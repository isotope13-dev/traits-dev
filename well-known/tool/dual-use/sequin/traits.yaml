defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 500000000

traits:
  - id: pe-module-path
    desc: Sequin CLI Windows Go module identity
    for: [pe]
    platforms: [windows]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/sequinstream/sequin/cli

  - id: elf-module-path
    desc: Sequin CLI Linux Go module identity
    for: [elf]
    platforms: [linux]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/sequinstream/sequin/cli

  - id: macho-module-path
    desc: Sequin CLI macOS Go module identity
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/sequinstream/sequin/cli

  - id: tunnel-command
    desc: Sequin CLI tunnel command description
    if:
      type: text
      substr: Create tunnels to Sequin
      section: .rdata

composite_rules:
  - id: sequin-cli-context
    desc: Recognized Sequin CLI tunnel client context
    crit: exception
    conf: 0.99
    any:
      - id: pe-module-path
      - id: elf-module-path
      - id: macho-module-path
    all:
      - id: tunnel-command
