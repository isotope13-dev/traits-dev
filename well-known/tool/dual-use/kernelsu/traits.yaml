# KernelSU is a documented Android kernel-based root solution. Its kernel
# hooks, root-grant interface, mount-namespace controls, and Manager WebView
# shell are intentional administration features; identify the project without
# treating those dual-use capabilities as malware on their own.
defaults:
  platforms: [linux, android]
  for: [c, cpp, kotlin, java, rust, source, documents, archives, elf, so, binaries]
  crit: notable
  conf: 0.95

traits:
  - id: supercall-api-marker
    desc: KernelSU supercall API marker
    for: [c, cpp]
    if:
      type: text
      regex: '\bKSU_IOCTL_(GRANT_ROOT|SET_SEPOLICY|ADD_TRY_UMOUNT|SET_INIT_PGRP)\b'

  - id: mount-namespace-api-marker
    desc: KernelSU mount namespace API marker
    for: [c, cpp]
    if:
      type: text
      regex: '\bKSU_NS_(INHERITED|GLOBAL|INDIVIDUAL)\b'

  - id: kernel-hook-api-marker
    desc: KernelSU kernel hook marker
    for: [c, cpp]
    if:
      type: text
      regex: '\bksu_(handle_setresuid|hook_setresuid)\b'

  - id: exec-hook-api-marker
    desc: KernelSU exec hook marker
    for: [c, cpp]
    if:
      type: text
      regex: '\bksu_(handle_execve|hook_execve)\b'

  - id: process-mark-api-marker
    desc: KernelSU process mark marker
    for: [c, cpp]
    if:
      type: text
      regex: '\bksu_(mark_all_process|set_task_mark|get_task_mark)\b'

  - id: manager-package-marker
    desc: KernelSU Manager package marker
    for: [kotlin, java]
    if:
      type: text
      substr: me.weishu.kernelsu

  - id: project-reference
    desc: KernelSU project reference
    for: [markdown]
    if:
      type: text
      regex: '(github\.com/tiann/KernelSU|kernelsu\.org)'

composite_rules:
  - id: source-identity
    desc: KernelSU source identity
    crit: notable
    conf: 0.98
    scope: outer
    any:
      - id: supercall-api-marker
      - id: mount-namespace-api-marker
      - id: kernel-hook-api-marker
      - id: manager-package-marker
      - id: project-reference
