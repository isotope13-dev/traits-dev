# Messenger — SOCKS5 / port-forward tunneling toolkit (Skyler Knecht / SpecterOps).
# https://github.com/skylerknecht/messenger
# Presented at DEF CON 33; dual-use red-team proxy similar to chisel/frp.
defaults:
  platforms: [unix, windows]
  for: [python, csharp, javascript, whl, python-sdist]
  attack: T1090.001
  mbc: B0030

traits:
  - id: messenger-github-repo
    desc: skylerknecht/messenger GitHub repository
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: github.com/skylerknecht/messenger

  - id: messenger-client-namespace
    desc: MessengerClient C# namespace
    crit: notable
    conf: 0.96
    for: [csharp]
    if:
      type: text
      regex: 'namespace\s+MessengerClient\b'

  - id: messenger-remote-port-forwarder
    desc: Messenger RemotePortForwarder class
    crit: notable
    conf: 0.95
    for: [csharp]
    if:
      type: text
      regex: 'class\s+RemotePortForwarder\b'

  - id: messenger-socks-command
    desc: Messenger interactive socks proxy command
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: "['\"]socks['\"]\\s*:\\s*\\(self\\.start_socks_proxy"

  - id: messenger-proxy-pypi-name
    desc: messenger-proxy PyPI package identity
    crit: notable
    conf: 0.97
    for: [whl, python-sdist, data]
    if:
      type: text
      regex: '(?m)^Name:\s*messenger-proxy\s*$'

composite_rules:
  - id: messenger-tunnel-toolkit
    desc: Messenger SOCKS tunneling toolkit
    crit: notable
    conf: 0.95
    scope: outer
    any:
      - id: messenger-github-repo
      - id: messenger-proxy-pypi-name
      - id: messenger-client-namespace
      - id: messenger-socks-command
    needs: 2
