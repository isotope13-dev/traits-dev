defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: zebedee-source-marker
    desc: Zebedee source revision string
    if:
      type: text
      exact: '$Id: zebedee.c,v 1.25 2002/05/28 06:31:15 ndwinton Exp $'
      section: .text

  - id: zebedee-secure-tunnel-marker
    desc: Zebedee secure-tunnel banner
    if:
      type: text
      exact: 'Zebedee -- A Secure Tunnel Program: Release %s'
      section: .text

composite_rules:
  - id: zebedee-secure-tunnel
    desc: Zebedee secure tunnel utility
    crit: notable
    conf: 0.99
    all:
      - id: zebedee-source-marker
      - id: zebedee-secure-tunnel-marker
