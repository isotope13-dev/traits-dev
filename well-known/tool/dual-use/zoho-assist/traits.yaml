# Zoho Assist — vendor remote-support / RMM agent from Zoho Corporation.
# Sits beside screenconnect/ and simplehelp/ for the same reason: a legitimate,
# vendor-signed remote-access product that intruders deploy as a ready-made
# backdoor, so AV vendors name it directly (ESET Win32/ZohoAssist, Fortinet
# W32/ZohoAssist!tr). Without an identity here a Zoho Assist installer surfaces
# only as "MSI creator is outside known vendor identities", which is actively
# misleading for a DigiCert-timestamped, ZOHO CORPORATION-signed package.
#
# Identity only, and deliberately NO stealth-configuration atoms. The
# ScreenConnect rules escalate on suppressed banners and hidden tray icons
# because those property names are known; nothing Zoho-specific of that kind
# was observable here (the Service/Banner strings in these installers are stock
# Windows Installer table and column names), and inventing knob names nobody
# has seen would produce a rule nobody can trust.
#
# Scope note: these cover the agent BINARIES. The installer itself routes as
# Unknown with strings=0, so raw and text cannot reach its table bytes; the
# container-side identity is a `type: value` read of the summary stream and
# lives in metadata/package/files/msi (msi-zoho-assist-title), beside the
# equivalent Adobe Acrobat MSI identities, for the same routing reason.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219
  conf: 0.95

traits:
  # Vendor-owned session-gateway shards (gwwa./wa<N>.zohoassist.com) that the
  # agent calls home to -- distinct from a document merely naming the product.
  - id: zoho-assist-gateway-host
    desc: Zoho Assist gateway host reference
    crit: notable
    size_min: 4096
    size_max: 200000000
    if:
      type: text
      section: rdata
      regex: '\b(gw)?wa\d*\.zohoassist\.com\b'

  - id: zoho-assist-deployer-binary
    desc: Zoho Assist deployer executable name
    crit: notable
    size_min: 4096
    size_max: 200000000
    if:
      type: text
      section: rdata
      substr: ZADeployer.exe
