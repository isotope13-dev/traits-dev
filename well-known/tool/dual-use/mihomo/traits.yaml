# MetaCubeX mihomo (Clash Meta) — dual-use proxy core used by Clash Verge
# and other Clash GUIs. Identify the official Go module path so bundled
# sidecars are not mistaken for opaque PE droppers or honeypot dashboards
# merely because they embed Wintun and MaxMind GeoIP.
defaults:
  platforms: [unix, windows]
  for: [pe, elf, go, python]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: mihomo-comment-bundle
    desc: Mihomo binary bundle marker
    for: [python]
    size_min: 1
    size_max: 10000000
    if:
      type: text
      exact: '# RYRY_MIHOMO_BUNDLE_V1'

  # Go build info is exposed under a container-specific value prefix: a Linux
  # mihomo build carries `elf.go.*`, so the `pe.`-prefixed paths below never
  # matched the ELF sidecars that ship with every Linux Clash GUI.
  - id: metacubex-mihomo-go-path
    desc: MetaCubeX mihomo Go module path
    for: [pe]
    if:
      type: value
      path: pe.go.path
      exact: github.com/metacubex/mihomo

  - id: metacubex-mihomo-go-path-elf
    desc: MetaCubeX mihomo Go module path
    for: [elf, go]
    if:
      type: value
      path: elf.go.path
      exact: github.com/metacubex/mihomo

  - id: metacubex-mihomo-module
    desc: MetaCubeX mihomo Go module identity
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/metacubex/mihomo

  - id: metacubex-mihomo-module-elf
    desc: MetaCubeX mihomo Go module identity
    for: [elf, go]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/metacubex/mihomo

  - id: metacubex-mihomo-dep-prefix
    desc: MetaCubeX mihomo dependency prefix
    for: [pe]
    if:
      type: value
      path: pe.go.deps
      substr: github.com/metacubex/mihomo/

  - id: metacubex-mihomo-dep-prefix-elf
    desc: MetaCubeX mihomo dependency prefix
    for: [elf, go]
    if:
      type: value
      path: elf.go.deps
      substr: github.com/metacubex/mihomo/

composite_rules:
  - id: mihomo-core
    desc: MetaCubeX mihomo proxy core
    crit: notable
    conf: 0.99
    for: [pe, elf, go]
    any:
      - id: metacubex-mihomo-go-path
      - id: metacubex-mihomo-go-path-elf
      - id: metacubex-mihomo-module
      - id: metacubex-mihomo-module-elf
      - id: metacubex-mihomo-dep-prefix
      - id: metacubex-mihomo-dep-prefix-elf
