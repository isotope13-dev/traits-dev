defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: yarn-standalone-text
    desc: Yarn standalone bundle text marker
    crit: component
    if:
      type: text
      regex: 'yarnpkg\.com|Yarn\s+\d'
  # Yarn Berry's release bundle (`.yarn/releases/yarn-*.cjs`) carries binjumper,
  # the tiny Windows launcher it copies in as a `.exe` bin shim, as a base64 gzip
  # string gunzipped by `getBinjumper()`. The engine's built-in base64-gz finding
  # fires on that string; this records what it is.
  - id: binjumper-launcher-loader
    desc: Yarn binjumper launcher loader
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: getBinjumper=function
composite_rules:
  - id: yarn-standalone-bundle
    desc: Yarn standalone bundle
    crit: notable
    all:
      - id: metadata/file/invisible-unicode::yarn-standalone-bundle-filename
      - id: well-known/tool/packaging/yarn::yarn-standalone-text
