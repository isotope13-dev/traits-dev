defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  size_max: 10000000
traits:
- id: yarn-cli-explicit-version-marker
  desc: Yarn CLI explicit version marker
  crit: notable
  conf: 1.0
  if:
    type: text
    substr: explicit version specifier from the Yarn CLI
- id: yarn-classic-registry-implementation
  desc: Yarn Classic registry implementation constructor
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'function YarnRegistry(cwd, registries, requestManager, reporter,'
- id: berry-release-path
  desc: Yarn berry releases bundle path
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: '(?i)\.yarn[\\/]releases[\\/]yarn-'

composite_rules:
- id: yarn-cli-bundle-marker
  desc: Bundled Yarn CLI marker
  crit: notable
  conf: 0.98
  any:
  - id: yarn-cli-explicit-version-marker
  - id: metadata/file/invisible-unicode::yarn-standalone-bundle-filename
  - id: yarn-classic-registry-implementation
  - id: berry-release-path
