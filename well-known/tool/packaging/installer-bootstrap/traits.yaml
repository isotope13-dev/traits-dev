defaults:
  platforms: [unix, windows]
  for: [scripts, dockerfile, markdown, text]
  crit: exception
  conf: 0.98

composite_rules:
  - id: packaging-bootstrap-installer-context
    desc: Recognized package manager installer bootstrap
    any:
      - id: well-known/tool/packaging/bun::bun-shell-install
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
      - id: well-known/tool/packaging/rustup::rustup-installer-source-url
      - id: micro-behaviors/os/package-manager/installer-script::rustup-installer-pipe
      - id: well-known/tool/packaging/golang-dep::golang-dep-installer-url
