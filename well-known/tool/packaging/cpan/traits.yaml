# CPAN.pm — the Perl module installer shipped with core perl (Andreas J.
# Koenig / PAUSE), plus the `cpan` front-end in App::Cpan.
#
# Its job is to fetch distribution tarballs over HTTP/FTP, unpack them into
# ~/.cpan/build, chmod and unlink cache files, read ~/.netrc for mirror logins
# and run `make`/`Build` on the result. That is a downloader-plus-installer
# profile, so knowing a file IS the CPAN client is what lets an analyst read
# those behaviours as the tool's advertised purpose rather than as a dropper.
defaults:
  platforms: [unix, windows]
  for: [perl]
  crit: notable
  conf: 0.95

traits:
  - id: cpan-shell-banner
    desc: CPAN.pm interactive shell startup banner
    conf: 0.99
    if:
      type: text
      substr: 'cpan shell -- CPAN exploration and modules installation'

  - id: cpan-recursion-guard-env
    desc: CPAN.pm PERL5_CPAN_IS_RUNNING recursion guard
    conf: 0.98
    if:
      type: text
      substr: PERL5_CPAN_IS_RUNNING

  - id: cpan-handleconfig-module
    desc: CPAN::HandleConfig configuration module
    conf: 0.9
    if:
      type: text
      substr: 'CPAN::HandleConfig'

  - id: cpan-shell-dispatch
    desc: CPAN::Shell command dispatch
    conf: 0.9
    if:
      type: text
      substr: 'CPAN::Shell->'

composite_rules:
  - id: perl-cpan-client
    desc: Perl CPAN.pm module installer client
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: cpan-shell-banner
      - id: cpan-recursion-guard-env
      - id: cpan-handleconfig-module
      - id: cpan-shell-dispatch
