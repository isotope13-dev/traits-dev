# snapd is Canonical's snap package manager daemon. Its syscheck package
# embeds a documented squashfs canary image (base64 + gzip) to verify the
# host can mount squashfs; the canary sentence below is that fixture's
# content, also asserted by the mount check itself. Require a parsed literal
# so documentation or a source comment alone does not identify the fixture.
# The trait identifies the upstream fixture, not any one package carrying
# snapd sources.
defaults:
  platforms: [unix]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: snapd-syscheck-squashfs-canary
    desc: Snapd SquashFS canary string literal
    if:
      type: literal
      exact: This file is used to check that snapd can read a squashfs image.

  - id: snapd-syscheck-squashfs-fixture-path
    desc: Snapd syscheck squashfs fixture path
    for: [go, gz]
    if:
      type: path
      regex: '(?i)(^|[\\/])syscheck[\\/]squashfs\.go(##|$)'
