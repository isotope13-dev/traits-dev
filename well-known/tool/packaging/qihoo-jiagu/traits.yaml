# Qihoo 360 Jiagu (加固) is a commercial Android app protector. It replaces the
# app's dex with an encrypted payload, ships a native unpacker as
# assets/libjiagu*.so, and boots through com.stub.StubApp. Legitimate Chinese
# apps and malware both use it; the protected code is not visible statically.
defaults:
  platforms: [android]
  for: [apk, zip]
  conf: 0.95

traits:
  - id: jiagu-native-unpacker-asset
    desc: Jiagu native unpacker asset member
    crit: component
    if:
      type: value
      path: archive.members[*].path
      regex: '^assets/libjiagu(_[a-z0-9]+)?\.so$'
  - id: jiagu-stub-application-class
    desc: Jiagu StubApp bootstrap class
    crit: component
    if:
      type: value
      path: android.app_class
      exact: com.stub.StubApp

composite_rules:
  - id: qihoo-jiagu-protected-apk
    desc: APK protected by Qihoo 360 Jiagu
    crit: notable
    all:
      - id: jiagu-native-unpacker-asset
      - id: jiagu-stub-application-class
