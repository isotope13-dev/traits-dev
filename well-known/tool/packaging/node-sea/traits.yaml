# Node.js Single Executable Application (SEA) packaging toolchain.
# Identifies scripts that prepare, configure, and bundle Node applications
# using Node's built-in SEA tooling and postject resource injection.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, scripts]
  crit: notable
  conf: 0.95

traits:
  - id: experimental-sea-config-flag
    desc: Node.js experimental-sea-config flag
    if:
      type: text
      substr: '--experimental-sea-config'

  - id: node-sea-fuse-sentinel
    desc: Node.js SEA fuse sentinel constant
    if:
      type: text
      substr: 'NODE_SEA_FUSE_'

  - id: node-sea-blob-symbol
    desc: Node.js SEA blob identifier
    if:
      type: text
      substr: 'NODE_SEA_BLOB'

  - id: postject-tool-reference
    desc: References postject resource injection tool
    if:
      type: text
      word: postject

composite_rules:
  - id: node-sea-packaging-context
    desc: Node.js Single Executable Application packaging toolchain
    crit: exception
    conf: 0.98
    needs: 2
    any:
      - id: experimental-sea-config-flag
      - id: node-sea-fuse-sentinel
      - id: node-sea-blob-symbol
      - id: postject-tool-reference
