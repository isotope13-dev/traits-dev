# OpenMolcas is a quantum-chemistry package. Its driver, pymolcas, ships a
# bundler (Tools/pymolcas/export.py) that packs the driver's modules as
# zlib+base64 and emits a single script which exec()s them back -- the file
# says so itself: "Obfuscation is not the goal here, just getting something
# that's easy to run, move and distribute." /usr/bin/pymolcas in the Debian
# package is that bundler's output, so both the generator and the generated
# script read as a packed dynamic-exec stager.
#
# pymolcas also vendors simpleeval, Daniel Fairhead's safe-expression
# evaluator, whose Python 2 compatibility shim is a literal
# exec('DISALLOW_FUNCTIONS.add(exec)') inside a library built to *block*
# dangerous evaluation.
defaults:
  platforms: [unix]
  for: [python, scripts, source]
  crit: notable
  conf: 0.98
  size_min: 200
  size_max: 20000000

traits:
  - id: openmolcas-license-banner
    desc: OpenMolcas LGPL file banner
    if:
      type: text
      substr: This file is part of OpenMolcas
  - id: pymolcas-driver-marker
    desc: pymolcas driver identity string
    if:
      type: text
      substr: This exports pymolcas to a single-file python script
  - id: simpleeval-guard-table
    desc: simpleeval disallowed-function table
    if:
      type: text
      substr: DISALLOW_FUNCTIONS

composite_rules:
  - id: openmolcas-bundler-context
    desc: OpenMolcas pymolcas bundler context
    crit: exception
    conf: 0.98
    any:
      - id: openmolcas-license-banner
      - id: pymolcas-driver-marker
      - id: simpleeval-guard-table
