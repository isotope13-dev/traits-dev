defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: nsis-manifest-identity
    desc: NSIS installer manifest identity
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.manifest.description
      regex: '(?i)^Nullsoft Install System'
  - id: nullsoft-install-system-text
    desc: Nullsoft Install System in text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Nullsoft Install System
      section: .text
  - id: nullsoft-install-system-rdata
    desc: Nullsoft Install System in rdata
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Nullsoft Install System
      section: .rdata
  - id: nullsoft-install-system-rsrc
    desc: Nullsoft Install System in resources
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Nullsoft Install System
      section: .rsrc
  - id: nsis-version-banner-rsrc
    desc: NSIS version banner in resources
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Nullsoft Install System v2.46-Unicode
      section: .rsrc
  - id: nsis-v1-banner-rsrc
    desc: NSIS v1 banner in resources
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: Nullsoft Install System v1.0j
      section: .rsrc
  - id: nsis-manifest-exehead
    desc: NSIS exehead assembly manifest
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Nullsoft.NSIS.exehead
      section: .rsrc
  - id: nsis-v3-banner-rsrc
    desc: NSIS v3 banner in resources
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Nullsoft Install System v3.
      section: .rsrc
  - id: nsis-error-title-rdata
    desc: NSIS runtime error title in rdata
    crit: notable
    conf: 1.0
    if:
      type: text
      exact: NSIS Error
      section: .rdata
  - id: nsis-error-title-data
    desc: NSIS runtime error title in data
    crit: notable
    conf: 1.0
    if:
      type: text
      exact: NSIS Error
      section: .data
  - id: nsis-error-url-rdata
    desc: NSIS runtime error URL in rdata
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: nsis.sf.net/NSIS_Error
      section: .rdata
  - id: nsis-error-url-data
    desc: NSIS runtime error URL in data
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: nsis.sf.net/NSIS_Error
      section: .data
  - id: nullsoftinst-marker
    desc: NullsoftInst archive marker
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: NullsoftInst
      section: .rdata
  - id: nsis-uac-ipc
    desc: NSIS UAC IPC marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: NSISUACIPC
      section: .rdata
composite_rules:
  - id: nullsoft-install-system
    desc: Nullsoft Install System marker
    crit: component
    conf: 0.95
    any:
      - id: well-known/tool/packaging/nsis::nullsoft-install-system-text
      - id: well-known/tool/packaging/nsis::nullsoft-install-system-rdata
      - id: well-known/tool/packaging/nsis::nullsoft-install-system-rsrc
  - id: nsis-error-title
    desc: NSIS runtime error title marker
    crit: component
    conf: 1.0
    any:
      - id: well-known/tool/packaging/nsis::nsis-error-title-rdata
      - id: well-known/tool/packaging/nsis::nsis-error-title-data
  - id: nsis-error-url
    desc: NSIS runtime error help URL
    crit: component
    conf: 1.0
    any:
      - id: well-known/tool/packaging/nsis::nsis-error-url-rdata
      - id: well-known/tool/packaging/nsis::nsis-error-url-data
  - id: nsis
    desc: Nullsoft NSIS installer marker
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: well-known/tool/packaging/nsis::nullsoftinst-marker
      - id: well-known/tool/packaging/nsis::nullsoft-install-system
      - id: well-known/tool/packaging/nsis::nsis-version-banner-rsrc
      - id: well-known/tool/packaging/nsis::nsis-v1-banner-rsrc
      - id: well-known/tool/packaging/nsis::nsis-v3-banner-rsrc
      - id: well-known/tool/packaging/nsis::nsis-manifest-exehead
      - id: well-known/tool/packaging/nsis::nsis-error-title
      - id: well-known/tool/packaging/nsis::nsis-error-url
      - id: micro-behaviors/data/checksum::ncrc-option-text
  - id: nsis-uninstaller
    desc: Nullsoft NSIS uninstaller identity
    crit: notable
    conf: 0.97
    all:
      - id: nsis-manifest-identity
      - id: metadata/file/extension/identity::uninstaller-exe-basename
  - id: nsis-uac-bridge
    desc: NSIS UAC elevation bridge markers
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/linking/runtime::uac-dll-section-text
      - id: well-known/tool/packaging/nsis::nsis-uac-ipc
      - id: metadata/binary/linking/runtime::system-dll-section-text
