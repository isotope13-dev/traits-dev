---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-embedded-dll-system-reference-profile
  desc: NSIS embedded PE with DLL names and system references
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
  any:
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  - id: micro-behaviors/os/service/name::trustedinstaller-label-reference
  - id: metadata/binary/layout/overlay::low-entropy-large-overlay
  - id: micro-behaviors/os/privilege/reference::shutdown-privilege-name
  needs: 3
