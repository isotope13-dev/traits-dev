---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-office-7zip-activesetup-profile
  desc: NSIS Office and 7-Zip references with Active Setup key
  crit: suspicious
  conf: 0.996
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-35pct
  - id: well-known/app/enterprise/microsoft-office-c2r::click-to-run-dll-reference
  any:
  - id: micro-behaviors/os/registry/autostart/reference::active-setup-ie-clsid
  - id: well-known/tool/sysadmin/7zip::7zip-shell-extension-clsid
  needs: 2
- id: nsis-lync99-office-multipe-profile
  desc: NSIS multi-PE bundle with Office and Lync99 references
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-35pct
  - id: micro-behaviors/fs/path/library::office-mso-win32client-dll-reference
  - id: micro-behaviors/process/sync/mutex::lync99-global-mutex-reference
  any:
  - id: micro-behaviors/os/registry/autostart/reference::active-setup-ie-clsid
  - id: well-known/tool/sysadmin/7zip::7zip-shell-extension-clsid
  - id: metadata/build/manifest::require-administrator
- id: nsis-appv-7zip-com-reference-profile
  desc: NSIS multi-PE with App-V and 7-Zip COM references
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
  - id: well-known/tool/sysadmin/7zip::7zip-shell-extension-clsid
  any:
  - id: metadata/file/profile/com/registration::clsid-inprocserver32-key-path
  - id: metadata/file/profile/com/registration::clsid-registry-key-path
  - id: well-known/app/productivity/adobe-reader::acrobat-security-registry-path
  - id: metadata/file/profile/embedded-binary::pe-magic-padding-token-cooccurrence
  needs: 2
