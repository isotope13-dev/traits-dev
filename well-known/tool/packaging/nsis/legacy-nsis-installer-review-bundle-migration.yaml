---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-truncated-certificate-api-profile
  desc: NSIS truncated certificate and system API references
  crit: suspicious
  conf: 0.94
  all:
  - id: well-known/tool/packaging/nsis::nsis-manifest-exehead
  - id: metadata/binary/layout/checksum::cert-table-truncated
  - id: metadata/binary/provenance/source::windows-product-or-signer-reference
  any:
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/os/handler/open::win-shellexecute
  needs: 2
  unless:
  - id: metadata/signature/verified/platform/
- id: nsis-admin-reboot-clipboard-ssn-profile
  desc: Elevated NSIS with reboot, clipboard, SSN and overlay clues
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/build/manifest::require-administrator-large-pe-raw
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  - id: objectives/evasion/anti-av/syscall::ssn-field
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  unless:
  - id: well-known/tool/development/toolchain/elixir-lang::official-elixir-windows-nsis-installer
- id: nsis-admin-reboot-clipboard-overlay
  desc: Elevated NSIS with reboot, clipboard and opaque overlay
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/build/manifest::require-administrator-large-pe-raw
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  unless:
  - id: well-known/tool/sysadmin/npcap::npcap-installer
  - id: well-known/tool/sysadmin/npcap::npcap-installer-context
  - id: well-known/tool/development/toolchain/elixir-lang::official-elixir-windows-nsis-installer
