---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-multipe-host-dll-reference-profile
  desc: NSIS multi-PE overlay with host and DLL name references
  crit: suspicious
  conf: 0.99
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: objectives/discovery/host/software::office-adobe-java-host-name-cluster
  any:
  - id: well-known/lib/runtime/managed/jvm::windows-jli-library-reference
  - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
  - id: well-known/lib/platform/adobe/air::runtime-dll-reference
  - id: micro-behaviors/fs/path/library::acrord32-dll-reference
- id: nsis-multipe-host-admin-runkey-profile
  desc: NSIS host references with admin manifest and Run-key path
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/tool/packaging/nsis::nsis-multipe-host-dll-reference-profile
  - id: metadata/build/manifest::require-administrator
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  any:
  - id: objectives/evasion/masquerade/identity/fabricated::office-policy-registry
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
