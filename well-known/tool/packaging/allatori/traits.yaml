# A generated demo marker identifies a protector trace, not malicious intent.
defaults:
  platforms: [windows, unix]
  for: [java, class]
traits:
  - id: allatori-demo-marker
    desc: Contains an Allatori demo marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)AllatorixDemo(_[A-Za-z0-9]+)?
