defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.93
composite_rules:
  - id: inno-delphi-installer-foundation
    desc: Inno Setup binary with Delphi runtime profile
    all:
      - id: metadata/lang/compiler/managed::delphi
    any:
      - id: well-known/tool/packaging/inno-setup-loader::inno-manifest-description
      - id: well-known/tool/packaging/inno-setup-loader::inno-manifest-assembly
      - id: well-known/tool/packaging/inno-setup-loader::inno-setup-installer-text
      - id: well-known/tool/packaging/inno-setup-loader::inno-setup-installer-data
      - id: well-known/tool/packaging/inno-setup-runtime::inno-setup-550-data-marker
  - id: inno-setup-crypto-support-markers
    desc: Inno Setup encryption support markers
    conf: 0.94
    all:
      - id: well-known/tool/packaging/inno-setup-loader::inno-setup-installer-data
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword
  - id: inno-uninstaller-runtime
    desc: Inno Setup uninstaller runtime identity
    conf: 0.99
    all:
      - id: well-known/tool/packaging/inno-setup-loader::inno-setup
      - id: metadata/binary/resource/identity::setup-uninstall-version-description
      - id: well-known/tool/packaging/inno-setup-loader::inno-uninstaller-marker
  - id: inno-pbkdf2-safearray-context
    desc: Inno Setup PBKDF2 and SafeArray context
    conf: 0.97
    all:
      - id: inno-delphi-installer-foundation
      - id: micro-behaviors/os/com/array::safearray-put-element
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
    any:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-password-canary
      - id: micro-behaviors/os/random/crypto::bcrypt-genrandom-name-without-symbol
