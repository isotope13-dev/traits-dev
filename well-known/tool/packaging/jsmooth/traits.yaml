defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: jsmooth-vm-search-order-string
    desc: JSmooth VM search order string
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "JSmooth will now try to use the VM in the following order:"
  - id: jsmooth-native-class-string
    desc: JSmooth Native class reference
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "jsmooth.Native"
composite_rules:
  - id: jsmooth-java-launcher
    desc: JSmooth Java launcher references
    crit: notable
    conf: 0.98
    any:
      - id: jsmooth-vm-search-order-string
      - id: jsmooth-native-class-string
