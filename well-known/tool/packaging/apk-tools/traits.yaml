# apk-tools, the Alpine/Wolfi package manager. libapk exports its package
# database and version-comparison API.
defaults:
  platforms: [linux]
  for: [elf, so]
  crit: component
  conf: 0.9
  size_min: 65536

traits:
  - id: db-open-export
    desc: Exports apk_db_open
    if:
      type: symbol
      kind: export
      exact: apk_db_open
  - id: version-compare-export
    desc: Exports apk_version_compare
    if:
      type: symbol
      kind: export
      exact: apk_version_compare

composite_rules:
  - id: libapk
    desc: apk-tools libapk shared library
    crit: notable
    conf: 0.97
    all:
      - id: db-open-export
      - id: version-compare-export
