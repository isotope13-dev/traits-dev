defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  size_min: 1048576

traits:
  - id: uv-executable-basename
    desc: uv executable basename
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '^uv(-[0-9.]+)?(\.exe)?$'
  - id: uv-crate-source-path
    desc: uv crate source path
    conf: 0.95
    if:
      type: text
      substr: crates/uv-client/src/middleware.rs
      section: any
  - id: astral-python-index-endpoint
    desc: Astral Python index endpoint
    conf: 0.95
    if:
      type: text
      substr: /simple/astral-sh/
      section: any
  - id: uv-github-release-url
    desc: Astral uv GitHub releases URL
    conf: 0.95
    if:
      type: text
      substr: github.com/astral-sh/uv
      section: any
  - id: astral-versions-endpoint
    desc: Astral versions repository endpoint
    conf: 0.95
    if:
      type: text
      substr: raw.githubusercontent.com/astral-sh/versions
      section: any
  - id: uv-pdb-basename
    desc: Astral uv Windows PDB debug basename
    conf: 0.95
    for: [pe]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: uv.pdb
  - id: uv-build-backend
    desc: uv build backend package
    conf: 0.98
    for: [python, alpine_apk]
    size_min: 1
    size_max: 2000000
    if:
      type: path
      regex: '(^|[\\/])uv_build([\\/]|$)'
  - id: uv-trampoline-assembly-identity
    desc: Astral uv trampoline manifest identity
    conf: 0.98
    for: [pe]
    size_min: 1000
    size_max: 200000
    if:
      type: text
      section: .rsrc
      substr: 'name="uv.Trampoline"'
  - id: uv-trampoline-launcher-string
    desc: Astral uv trampoline launcher identity string
    conf: 0.98
    for: [pe]
    size_min: 1000
    size_max: 200000
    if:
      type: text
      section: .rdata
      substr: 'uv trampoline failed to'

composite_rules:
  - id: astral-uv-python-tool
    desc: Astral uv Python tool
    conf: 0.98
    all:
      - id: uv-executable-basename
    any:
      - id: uv-crate-source-path
      - id: astral-python-index-endpoint
      - id: uv-github-release-url
      - id: astral-versions-endpoint
      - id: uv-pdb-basename

  - id: uv-windows-trampoline
    desc: Astral uv Windows Python launcher trampoline
    conf: 0.98
    for: [pe]
    size_min: 1000
    size_max: 200000
    any:
      - id: uv-trampoline-assembly-identity
      - id: uv-trampoline-launcher-string
