# LockedList, Afrow UK's NSIS plugin, lists the processes holding an
# installer's target files open so setup can ask the user to close them.
# Doing that is its whole job: it enables SeDebugPrivilege, opens every
# process and walks its modules and handles. The export set is the plugin's
# own API and is matched as one unit, so no single generic export name can
# stand in for the plugin. Identifying it explains that token-and-process
# surface without vouching for the installer that carries it.
defaults:
  platforms: [windows]
  for: [dll, pe]
  size_min: 4096
  size_max: 1048576

traits:
  - id: nsis-lockedlist-plugin
    desc: NSIS LockedList locked-file plugin
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        import "pe"
        rule nsis_lockedlist_plugin {
          strings:
            // NUL-terminated export-name table entries of the plugin API.
            $e1 = "IsFileLocked\x00" ascii
            $e2 = "SilentSearch\x00" ascii
            $e3 = "AddApplications\x00" ascii
            $e4 = "SilentWait\x00" ascii
          condition:
            pe.is_dll() and all of them
        }
