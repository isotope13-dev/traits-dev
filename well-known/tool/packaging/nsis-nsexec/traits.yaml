# nsExec, the stock NSIS plugin that runs a command-line program and captures
# its output for the installer (ExecToLog) or the install script stack
# (ExecToStack). Self-copying to TEMP and spawning the child via CreateProcess
# is its documented design, not worm spread: every NSIS 2/3 installer ships
# this exact 6 KB plugin under $PLUGINSDIR. The three-export set is matched
# as one unit, so no single generic export name stands in for the plugin.
# Identifying it explains the CopyFile/CreateProcess surface without vouching
# for the installer that carries it.
defaults:
  platforms: [windows]
  for: [dll, pe]
  size_min: 4096
  size_max: 65536

traits:
  - id: nsexec-exec-export
    desc: nsExec plugin Exec export
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: Exec
  - id: nsexec-exec-to-log-export
    desc: nsExec plugin ExecToLog export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: ExecToLog
  - id: nsexec-exec-to-stack-export
    desc: nsExec plugin ExecToStack export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: ExecToStack

composite_rules:
  - id: nsis-nsexec-plugin
    desc: NSIS nsExec execution plugin
    crit: notable
    conf: 0.98
    all:
      - id: nsexec-exec-export
      - id: nsexec-exec-to-log-export
      - id: nsexec-exec-to-stack-export
