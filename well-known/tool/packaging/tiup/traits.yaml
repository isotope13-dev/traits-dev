# TiUP: PingCAP package manager and component orchestrator for TiDB (tiup.io, github.com/pingcap/tiup).
defaults:
  platforms: [unix, windows]
  for: [go, shell, text, data, source, scripts]
  crit: notable
  conf: 0.99

traits:
  - id: tiup-mirror-command-literal
    desc: References tiup mirror command or TIUP_MIRRORS
    for: [go, shell]
    if:
      type: text
      regex: '(?i)(TIUP_MIRRORS|tiup\s+mirror\s+(publish|show))'

  - id: pingcap-qe-publisher-module-path
    desc: PingCAP publisher module import
    for: [go]
    if:
      type: text
      substr: 'github.com/PingCAP-QE/ee-apps/publisher'

  - id: tiup-package-publisher-type
    desc: TiUP publication worker type
    for: [go]
    if:
      type: text
      regex: '\b(tiupWorker|PublishRequestTiUP|PublishInfoTiUP)\b'

composite_rules:
  - id: tiup-publisher-context
    desc: TiUP component package publisher context
    crit: exception
    conf: 0.99
    for: [go]
    any:
      - id: tiup-mirror-command-literal
      - id: pingcap-qe-publisher-module-path
      - id: tiup-package-publisher-type
