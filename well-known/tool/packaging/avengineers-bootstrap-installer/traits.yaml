# Avengineers bootstrap-installer — shared PowerShell dev-environment bootstrap scripts.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.99

traits:
  - id: bootstrap-installer-github-url
    desc: Avengineers bootstrap-installer install.ps1 URL
    if:
      type: text
      substr: raw.githubusercontent.com/avengineers/bootstrap-installer

  - id: bootstrap-local-script-dot-source
    desc: Avengineers bootstrap local script dot-source
    if:
      type: text
      substr: .\.bootstrap\bootstrap.ps1

composite_rules:
  - id: bootstrap-installer-powershell-context
    desc: Avengineers bootstrap-installer PowerShell bootstrap context
    crit: exception
    conf: 0.99
    all:
      - id: bootstrap-installer-github-url
    any:
      - id: bootstrap-local-script-dot-source
