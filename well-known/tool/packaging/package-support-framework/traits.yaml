defaults:
  platforms: [windows]
  for: [pe]
  size_max: 20000000

traits:
  - id: psf-initialize-export
    desc: PSF fixup initialize export
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: PSFInitialize

  - id: psf-runtime-import
    desc: PSF runtime import
    crit: notable
    conf: 0.99
    if:
      type: import
      regex: '(?i)^psfruntime(32|64)?\.dll$'

  - id: psf-runtime-register-export
    desc: PSF runtime registration export
    crit: notable
    conf: 0.99
    if:
      type: export
      regex: '(?i)^_?PSFRegister(@\d+)?$'

composite_rules:
  - id: psf-component-context
    desc: Microsoft PSF component context
    crit: exception
    conf: 0.99
    any:
      - id: psf-initialize-export
      - id: psf-runtime-import
      - id: psf-runtime-register-export
