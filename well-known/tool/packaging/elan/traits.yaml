defaults:
  platforms: [unix, windows]
  for: [powershell, shell]
  size_max: 5000000

traits:
  - id: elan-installer-path
    desc: Elan bootstrap installer script path
    crit: notable
    if:
      type: path
      basename: true
      regex: '^elan-init\.(ps1|sh)$'

  - id: elan-installer-source-url
    desc: Elan official distribution repository URL
    crit: notable
    if:
      type: text
      regex: 'github\.com/leanprover/elan\b'

composite_rules:
  - id: elan-release-installer-context
    desc: Elan bootstrap installer context
    crit: notable
    conf: 0.99
    all:
      - id: elan-installer-path
      - id: elan-installer-source-url
