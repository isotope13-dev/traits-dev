defaults:
  platforms: [windows]
  for: [pe]
  size_max: 10485760

traits:
  - id: toolset-signer
    desc: WiX Toolset signed installer PE
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=WiX Toolset\b'
  - id: firegiant-signer
    desc: FireGiant-signed PE
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=FireGiant\b'
  - id: utilca-description
    desc: WiX utility custom-action description
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      exact: WiX Toolset Util CustomAction
  - id: utilca-original-filename
    desc: WiX utility custom-action filename
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.original_filename
      exact: utilca.dll

  - id: wixca-original-filename
    desc: WiX Custom Actions filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: wixca.dll
  - id: wixca-description
    desc: WiX Custom Actions description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: WiX Custom Actions

  - id: standard-bootstrapper-description
    desc: WiX standard bootstrapper description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: WiX Standard Bootstrapper Application

  - id: standard-bootstrapper-product
    desc: WiX bootstrapper product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Windows Installer XML Toolset

  # MakeSfxCA packages (CustomAction*.CA.dll) carry no WiX signature or
  # version resource, so identity rests on package content: the DTF managed
  # wrapper the payload links against, plus one SfxCA stub indicator.
  - id: dtf-managed-wrapper-reference
    desc: WiX DTF managed wrapper member reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(Microsoft\.Deployment|WixToolset\.Dtf)\.WindowsInstaller'
      section: overlay
  - id: sfxca-stub-member-name
    desc: SfxCA native stub module name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SfxCA.dll
      section: rdata
  - id: sfxca-outofproc-entry-name
    desc: SfxCA out-of-process invocation entry name
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: zzzzInvokeManagedCustomActionOutOfProcW
      section: rdata
  - id: sfxca-stub-debug-path
    desc: SfxCA stub PDB path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.debug.pdb.path
      regex: 'SfxCA\.pdb$'
  # Stock wixca.dll (WiX3 ship build) has a populated IAT and import-name
  # strings, but its data directories can point into that name table so the
  # dependency count stays zero. Identity keeps that module out of the
  # importless resolver objective.
  - id: wixca-module-pdb-path
    desc: WiX custom action module PDB path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: wixca.pdb
      section: .rdata

composite_rules:
  - id: standard-bootstrapper-component
    desc: WiX standard bootstrapper component
    crit: notable
    conf: 0.99
    all:
      - id: standard-bootstrapper-description
      - id: standard-bootstrapper-product

  # WiX DUtil's file helpers preserve file times while copying and moving
  # files; its debug assertions intentionally call IsDebuggerPresent and
  # DebugBreak. Those utility APIs are not a timestomp stager when the
  # DUtil source provenance and export identity agree in one PE.
  - id: wix-dutil-utility-module
    desc: WiX DUtil file utility module
    crit: exception
    conf: 0.99
    all:
      - id: metadata/binary/debug::wix-dutil-source-dutil-cpp
      - id: metadata/binary/debug::wix-dutil-source-fileutil-cpp
      - id: metadata/binary/debug::wix-dutil-source-dirutil-cpp
      - id: metadata/binary/symbols/exports::wix-dutil-write-text-file

  - id: wixca-custom-actions
    desc: WiX Custom Actions identity
    crit: notable
    conf: 0.99
    all:
      - id: wixca-original-filename
      - id: wixca-description

  - id: firegiant-utilca-context
    desc: FireGiant-signed WiX utility custom-action PE
    crit: exception
    conf: 0.99
    all:
      - id: firegiant-signer
      - id: utilca-description
      - id: utilca-original-filename

  - id: wix-toolset-utilca-context
    desc: WiX-signed utility custom-action PE
    crit: exception
    conf: 0.99
    all:
      - id: toolset-signer
      - id: utilca-description
      - id: utilca-original-filename

  # A MakeSfxCA package is a cabinet-in-PE that by construction "wraps" a
  # managed assembly and a single-import native stub — the exact shape the
  # cabinet-dropper rules read as a dropper. Its package content proves the
  # benign WiX DTF custom-action carrier.
  - id: wix-sfxca-custom-action-package
    desc: WiX DTF SfxCA managed custom-action package
    crit: exception
    conf: 0.98
    all:
      - id: dtf-managed-wrapper-reference
    any:
      - id: sfxca-outofproc-entry-name
      - id: sfxca-stub-member-name
      - id: sfxca-stub-debug-path
