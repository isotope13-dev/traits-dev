# golang/dep — official Go dependency management tool (pre-Go modules).
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: golang-dep-installer-url
    desc: Official golang/dep installer URL
    for: [scripts, dockerfile, markdown, text]
    if:
      type: text
      regex: 'githubusercontent\.com/golang/dep/(master|v[0-9.]+)/install\.sh'
