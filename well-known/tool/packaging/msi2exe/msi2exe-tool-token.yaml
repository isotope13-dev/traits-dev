defaults:
  size_min: 1
  platforms: [windows]
  for: [pe]


traits:
  - id: msi2exe-tool-token
    desc: msi2exe tool identity token
    crit: component
    conf: 0.9
    if:
      # Keep the case-sensitive partial identity token at any byte location,
      # including installer overlays; do not assert a particular PE section.
      type: yara
      source: |
        rule msi2exe_name_reference_in_pe {
          strings:
            $name = "msi2exe" ascii wide
          condition:
            uint16(0) == 0x5a4d and
            uint32(0x3c) < filesize - 4 and
            uint32(uint32(0x3c)) == 0x00004550 and $name
        }
