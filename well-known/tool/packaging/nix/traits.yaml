defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 536870912

traits:
  - id: nixos-install-script-url
    desc: NixOS official installer URL
    crit: notable
    for: [scripts, pkginfo, markdown, text, html, javascript, typescript, rust]
    if:
      type: text
      regex: '(?i)nixos\.org/nix/install'

  - id: nix-store-path-member
    desc: File in Nix store path
    crit: notable
    conf: 0.98
    for: [elf, shell, text, json, data]
    if:
      type: path
      regex: 'nix/store/[a-z0-9]{32}-'

  - id: nix-support-setup-hook-member
    desc: Nix package setup hook member
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: path
      regex: 'nix-support/setup-hook$'

  - id: nix-store-symlink-target
    desc: Symlink targets Nix store path
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].linkname
      regex: '^/nix/store/[a-z0-9]{32}-'

composite_rules:
  - id: nix-package-archive
    desc: Nix package or rootfs container archive
    crit: notable
    conf: 0.98
    for: [tar, xz]
    any:
      - id: nix-store-path-member
      - id: nix-support-setup-hook-member
      - id: nix-store-symlink-target
