# The official Nix bootstrap installer URL. Store paths and archives of
# Nix-built packages are what Nix produces; they live in metadata/build/nix.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 536870912

traits:
  - id: nixos-install-script-url
    desc: NixOS official installer URL
    crit: notable
    for: [scripts, pkginfo, markdown, text, html, javascript, typescript, rust]
    if:
      type: text
      regex: '(?i)nixos\.org/nix/install'
