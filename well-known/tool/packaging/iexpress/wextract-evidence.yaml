defaults:
  crit: notable
  platforms:
    - windows
  for:
    - pe
traits:
  - id: iexpress-setup-title
    desc: IExpress setup title marker
    conf: 0.95
    if:
      type: text
      exact: IExpress Setup
      section: .rsrc
  - id: wextract-assembly-name
    desc: Microsoft Wextract assembly name
    conf: 0.99
    if:
      type: text
      substr: 'Microsoft.Windows.Wextract'
      section: rsrc
  - id: wextract-manifest-description
    desc: IExpress extraction tool manifest marker
    conf: 0.99
    if:
      type: text
      substr: '<description>IExpress extraction tool</description>'
      section: rsrc
  - id: wextract-product-description
    desc: Win32 Cabinet Self-Extractor marker
    conf: 0.99
    if:
      type: text
      exact: Win32 Cabinet Self-Extractor
      section: rsrc
  - id: wextract-pdb-path
    desc: Microsoft Wextract PDB path
    conf: 0.98
    ref: sha256:dc25c03f61ca1ba41a1f6cccad97a8074c2c25158b3ed06e8725101e51e932b6
    if:
      type: text
      exact: wextract.pdb
      section: .rdata
  - id: wextract-internal-name
    desc: Microsoft Wextract internal name
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^wextract(\.exe)?$'
  - id: wextract-cleanup-string
    desc: Microsoft Wextract cleanup string
    conf: 0.99
    if:
      type: text
      substr: 'wextract_cleanup%'
composite_rules:
  - id: iexpress
    desc: Microsoft IExpress installer marker
    conf: 0.95
    all:
      - id: well-known/tool/packaging/iexpress::iexpress-setup-title
      - id: metadata/binary/resource/label::setup-exe-resource-name
  - id: wextract-tool
    desc: Microsoft IExpress wextract extraction tool
    conf: 0.99
    needs: 2
    any:
      - id: well-known/tool/packaging/iexpress::wextract-assembly-name
      - id: well-known/tool/packaging/iexpress::wextract-pdb-path
      - id: metadata/archive/serialization::cabinet-label-text
      - id: well-known/tool/packaging/iexpress::wextract-manifest-description
      - id: well-known/tool/packaging/iexpress::wextract-product-description
      - id: well-known/tool/packaging/iexpress::wextract-internal-name
      - id: well-known/tool/packaging/iexpress::wextract-cleanup-string
