defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.98

traits:
  - id: debootstrap-devices-path
    desc: Debootstrap initial device node archive path
    crit: notable
    conf: 0.98
    for: [tar, tar.gz]
    size_max: 65536
    if:
      type: path
      regex: '(?i)(^|[\\/])debootstrap[\\/]devices\.tar(\.gz)?$'
