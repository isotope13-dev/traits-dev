defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.9
traits:
  - id: wixsharp-runtime-dll
    desc: WixSharp.dll text in MSI
    crit: notable
    if:
      type: text
      substr: WixSharp.dll
  - id: wixsharp-wpf-ui-dll
    desc: WixSharp WPF UI DLL text in MSI
    crit: notable
    if:
      type: text
      substr: WixSharp.UI.WPF.dll
  - id: beforeinstall-custom-action
    desc: WixSharp BeforeInstall action name text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: WixSharp_BeforeInstall_Action
  - id: beforeinstall-handler-binding
    desc: WixSharp BeforeInstall handler name text
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: WixSharp_BeforeInstall_Handlers
composite_rules:
  - id: wixsharp-managed-ui-msi
    desc: WixSharp managed UI installer
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
    any:
      - id: wixsharp-runtime-dll
      - id: wixsharp-wpf-ui-dll
      - id: well-known/tool/packaging/wix::wixtoolset-mba-core-dll
    needs: 2
