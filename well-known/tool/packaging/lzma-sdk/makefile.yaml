defaults:
  for: [makefile]
  platforms: [unix, windows]

traits:
  - id: lzma-sdk-utility-build
    desc: LZMA SDK 7lzma utility build definition
    crit: notable
    conf: 0.98
    if:
      type: text
      # The build target and SDK decoder include together identify the
      # utility build, rather than merely mentioning LZMA compression.
      regex: '(?m)^PROG\s*=\s*7lzma\s+include [^\n]{1,64}/7zip/LzmaDec_gcc\.mak'
