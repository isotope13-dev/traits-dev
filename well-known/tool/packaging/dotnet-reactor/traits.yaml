# EZIRIZ .NET Reactor is a commercial .NET protector. This identifies the
# builder application itself; protected output does not carry the builder's
# version resource or NecroBit option text. Malware kits often bundle it to
# protect their stubs, so the identity explains the member, not the kit.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
  size_min: 1048576
  size_max: 104857600

traits:
  - id: eziriz-version-company
    desc: EZIRIZ company version metadata
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: EZIRIZ

  - id: reactor-version-description
    desc: .NET Reactor file description metadata
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      exact: .NET Reactor

  - id: necrobit-option-text
    desc: .NET Reactor NecroBit protection option text
    crit: component
    conf: 0.95
    if:
      type: text
      substr: NecroBit is a powerful protection technology
      # CLR resources and the user-string heap sit inside .text.
      section: .text

composite_rules:
  - id: dotnet-reactor-builder
    desc: EZIRIZ .NET Reactor protector builder
    conf: 0.98
    all:
      - id: eziriz-version-company
      - id: reactor-version-description
      - id: necrobit-option-text
