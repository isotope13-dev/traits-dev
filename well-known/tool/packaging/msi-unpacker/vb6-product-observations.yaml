defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: msi-unpacker-name-text
    desc: MSI Unpacker name text
    if:
      type: text
      exact: MSI Unpacker
      section: .text

composite_rules:
  - id: jsware-msi-unpacker
    desc: JSWare and MSI Unpacker identity claims
    crit: notable
    conf: 0.99
    all:
      - id: metadata/vendor/string::jsware-company-field
      - id: well-known/tool/packaging/msi-unpacker::msi-unpacker-name-text

