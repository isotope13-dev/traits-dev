defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.96

traits:
  - id: composer-package-name
    desc: composer/composer package name
    crit: notable
    for: [composer.json]
    if:
      type: value
      path: name
      exact: composer/composer

  - id: composer-installer-url
    desc: Official Composer installer URL
    crit: notable
    for: [shell, dockerfile, php]
    if:
      type: text
      substr: getcomposer.org/installer

  - id: composer-source-namespace
    desc: Composer source namespace
    crit: notable
    if:
      type: text
      regex: 'This file is part of Composer\.[\s\S]{0,300}namespace\s+Composer\\'

  - id: composer-phar-name
    desc: Composer PHAR filename
    if:
      type: path
      basename: true
      exact: composer.phar

  - id: phar-tools-composer-path
    desc: Composer PHAR in tools/phar directory
    if:
      type: path
      regex: '(?i)tools[/+]phar[/+]composer$'
  - id: composer-console-namespace
    desc: Composer console namespace
    if:
      type: text
      substr: 'namespace Composer\Console;'
  - id: composer-env-handling
    desc: Composer environment variable handling
    if:
      type: text
      substr: COMPOSER_HOME
  - id: docker-composer-php-src-path
    desc: Composer Docker image PHP source tarball path
    crit: notable
    for: [archives, tar, zip, bz2, source, c, cpp, php]
    size_max: 600000000
    if:
      type: path
      substr: usr/src/php.tar.xz

composite_rules:
  - id: composer-source-package
    desc: composer/composer source package
    crit: notable
    for: [php, composer.json]
    scope: archive
    all:
      - id: composer-package-name
      - id: composer-source-namespace

  - id: composer-phar-cli
    desc: Composer PHAR CLI application
    crit: notable
    all:
      - id: composer-console-namespace
      - id: composer-env-handling
    any:
      - id: composer-phar-name
      - id: phar-tools-composer-path
  - id: composer-docker-library-image-context
    desc: Official Composer Docker library image context
    crit: exception
    conf: 0.98
    scope: outer
    for: [archives, tar, zip, bz2, elf, php, source, c, cpp]
    size_max: 600000000
    any:
      - id: docker-composer-php-src-path
      - id: composer-phar-cli
