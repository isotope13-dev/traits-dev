defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: yinginstall-brand
    desc: YingInstall name repeated in PE resources
    crit: notable
    conf: 0.96
    size_min: 500000
    if:
      type: text
      word: YingInstall
      section: .rsrc
    count_min: 3
  - id: yinginstall-registry-root
    desc: YingInstall registry root in PE resources
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: '\SOFTWARE\YingSoft\YingInstall'
      section: .rsrc
  - id: yinginstall-stage-binary
    desc: YingInstall helper filename in PE resources
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: '\~YingInstall-ProvideForInstall.exe'
      section: .rsrc
  - id: yinginstall-version-tag
    desc: YingInstall XML version marker in PE resources
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: '<Version>YingInstall6.0</Version>'
      section: .rsrc
composite_rules:
  - id: yinginstall-name-reference
    desc: YingInstall name in PE resources
    crit: component
    conf: 0.98
    any:
      - id: yinginstall-brand
      - id: yinginstall-registry-root
      - id: yinginstall-stage-binary
      - id: yinginstall-version-tag
  - id: yinginstall-two-markers
    desc: Two YingInstall resource markers
    crit: component
    conf: 0.99
    needs: 2
    any:
      - id: yinginstall-brand
      - id: yinginstall-registry-root
      - id: yinginstall-stage-binary
      - id: yinginstall-version-tag
  - id: yinginstall-netman-context
    desc: YingInstall resource marker with Netman version information
    crit: component
    conf: 0.99
    all:
      - id: yinginstall-name-reference
    any:
      - id: well-known/app/network/netman::netman-ultimate-version-description
      - id: metadata/vendor/identity::nanning-netman-company-version
  - id: yinginstall-wrapper
    desc: YingInstall Windows installer wrapper
    crit: component
    conf: 0.99
    any:
      - id: yinginstall-two-markers
      - id: yinginstall-netman-context
