defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.99

traits:
  - id: rustup-installer-path
    desc: Rustup bootstrap installer script path
    if:
      type: basename
      exact: rustup-init.sh

  - id: rustup-installer-source-url
    desc: Rustup official distribution root URL
    if:
      type: text
      regex: 'static\.rust-lang\.org/rustup|sh\.rustup\.rs'

  - id: rustup-loongarch-probe
    desc: Rustup LoongArch ABI compatibility probe
    # uv's installer vendors this helper from rustup; with uv's own source
    # marker present the probe no longer attributes the artifact to rustup.
    unless:
      - id: well-known/tool/packaging/uv::astral-uv-installer-source
    if:
      type: text
      substr: check_loongarch_uapi

composite_rules:
  - id: rustup-installer
    desc: Rustup bootstrap installer with platform compatibility probe
    crit: notable
    conf: 0.99
    all:
      - id: rustup-installer-path
      - id: rustup-installer-source-url
      - id: rustup-loongarch-probe
