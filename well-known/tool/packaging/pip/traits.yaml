# pip — the Python package installer. Its own distribution declares the pip3
# console script, which every pip-bundling image and wheel carries verbatim.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  # Atomic traits run on one node. Both read member text, so they name only the
  # member types; the wheel container is joined by the composite below.
  - id: pip-dist-info-name
    desc: pip distribution metadata name line
    for: [pkginfo, python, text]
    if:
      type: text
      regex: '(?m)^Name: pip\s*$'

  - id: pip-stock-console-entrypoints
    desc: pip distribution pip3 console-script mapping
    for: [python, text]
    if:
      type: text
      substr: pip3=pip._internal.cli.main:main

composite_rules:
  # Both legs must appear together: the distribution name and the stock
  # pip._internal entry point. A package that only names pip3 in its own
  # entry points does not match. The legs sit in different wheel members
  # (METADATA and entry_points.txt), so the composite joins them at archive
  # scope.
  - id: pip-distribution-entrypoints
    desc: Stock pip distribution entry points
    for: [whl, pkginfo, python, text]
    scope: archive
    crit: notable
    conf: 0.95
    all:
      - id: pip-dist-info-name
      - id: pip-stock-console-entrypoints
