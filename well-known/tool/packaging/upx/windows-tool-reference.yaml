defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: upx-windows-executable-name
    desc: UPX executable name
    crit: notable
    if:
      type: path
      basename: true
      regex: '(?i)^upx(\.exe)?$'
composite_rules:
  - id: upx-named-packed-executable
    desc: UPX-named executable with UPX packing references
    crit: notable
    conf: 0.95
    all:
      - id: upx-windows-executable-name
      - id: metadata/binary/section/label/packing::upx-section
    any:
      - id: metadata/binary/provenance/build::upx-executable-packer-wide-text
      - id: metadata/binary/layout/stub::upx-396-version-magic
