defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.94

traits:
  - id: hermit-dist-https-url-text
    desc: HERMIT_DIST_URL has explicit HTTPS value
    conf: 0.93
    if:
      type: text
      regex: 'HERMIT_DIST_URL[^\n]{0,80}https://[^\s'']{1,80}'
      not:
        - regex: 'github\.com/cashapp/hermit'


composite_rules:
  - id: hermit-bootstrap-exec-context
    desc: Hermit dist-variable and exec context
    crit: notable
    conf: 0.96
    all:
      - id: well-known/tool/packaging/hermit::hermit-dist-url-env-var
      - id: well-known/tool/packaging/hermit::hermit-managed-binary-exec
