# Hermit (cashapp/hermit) — an open-source per-project development-environment
# manager. Projects that use it commit a `bin/hermit` shim: a small bash stub
# that resolves HERMIT_DIST_URL, `curl | bash`-es the official installer from
# the cashapp/hermit GitHub releases page when the managed binary is missing,
# and then execs that binary. Thousands of repositories vendor this file
# verbatim, so the stub is program IDENTITY, not an install-time dropper.
#
# NOT to be confused with well-known/malware/backdoor/hermit, an unrelated
# surveillance implant that shares the name.
#
# The bootstrap really does download and execute code, which is why the stub
# composite below stays notable and the neutral curl/pipe-to-shell capability
# atoms still surface alongside it. The supply-chain ATTACK that abused this
# stub keyed on the archive being a case-variant Go module path, not on the
# stub's presence; those hostile composites live in objectives/ and reference
# the archive-member facts directly.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.94

traits:
  - id: hermit-dist-url-env-var
    desc: Hermit HERMIT_DIST_URL distribution variable
    if:
      type: text
      substr: 'HERMIT_DIST_URL'

  - id: hermit-hash-pinned-install-script
    desc: Hermit hash-pinned installer script name
    conf: 0.95
    if:
      type: text
      substr: 'install-${INSTALL_SCRIPT_SHA256}.sh'

  - id: hermit-managed-binary-exec
    desc: Execs the Hermit-managed binary
    conf: 0.95
    if:
      type: text
      substr: 'exec "${HERMIT_EXE}"'
  # The vendor stub defaults HERMIT_DIST_URL to the Cash App release. A
  # case-variant module that still points there is that stub, not a swapped host.
  - id: hermit-nonvendor-dist-url
    desc: Hermit dist host is not Cash App
    conf: 0.93
    if:
      type: text
      regex: 'HERMIT_DIST_URL[^\n]{0,80}https://[^\s'']{1,80}'
      not:
        - regex: 'github\.com/cashapp/hermit'

composite_rules:
  - id: hermit-bootstrap-stub
    desc: Hermit bootstrap stub downloads then execs
    crit: notable
    conf: 0.96
    all:
      - id: hermit-dist-url-env-var
      - id: hermit-managed-binary-exec
