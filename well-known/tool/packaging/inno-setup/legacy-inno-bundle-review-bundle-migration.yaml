---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: inno-driver-themed-installer
  desc: Driver-themed Inno/Delphi installer profile
  crit: suspicious
  conf: 0.95
  all:
  - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
  - id: metadata/vendor/string::nvidia-driver-loader-banner
  any:
  - id: metadata/binary/resource/manifest::winhttp-system32-manifest
  - id: metadata/lang/compiler/managed::embarcadero-delphi-compiler-banner
- id: inno-pbkdf2-safearray-checksum-profile
  desc: Inno PBKDF2 and SafeArray context with section or checksum signal
  crit: suspicious
  conf: 0.99
  all:
  - id: well-known/tool/packaging/inno-setup-loader::inno-setup
  - id: well-known/tool/packaging/inno-setup-runtime::inno-pbkdf2-safearray-context
  any:
  - id: metadata/binary/section/entropy::reloc-entropy-at-least-6p8
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
- id: inno-python-zip-fragment-overlay
  desc: Inno overlay has Python ZIP fragments without EOCD
  crit: suspicious
  conf: 0.95
  all:
  - id: well-known/tool/packaging/inno-setup::inno-setup-installer-context
  - id: metadata/binary/layout/overlay::zip-local-header-without-eocd
  - id: metadata/package/files/name::zipimport-bytecode-member
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
