defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 10000000

traits:
  - id: inno-setup-compiler
    desc: Inno Setup compiler DLL identity
    if:
      type: basename
      exact: ISCmplr.dll
  - id: inno-setup-preprocessor
    desc: Inno Setup preprocessor DLL identity
    if:
      type: basename
      exact: ISPP.dll
  - id: inno-setup-ide-manifest
    desc: Inno Setup IDE manifest identity
    if:
      type: value
      path: pe.manifest.description
      exact: Inno Setup IDE
  - id: inno-setup-ide-product
    desc: Inno Setup product identity
    if:
      type: value
      path: pe.version.product_name
      exact: Inno Setup
  - id: inno-setup-command-line-compiler
    desc: Inno Setup command-line compiler identity
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Inno Setup Preprocessor Command-Line Compiler
  # ISCrypt.dll is Inno Setup's optional ARC4 helper that the setup runtime
  # loads to decrypt encrypted installers: a ~2.5 KB DLL with one import and
  # three exports, so the export name is the identity, not the file name.
  - id: inno-setup-iscrypt-dll
    desc: Inno Setup ISCrypt ARC4 helper DLL
    for: [dll]
    if:
      type: export
      exact: ISCryptGetVersion
  # Identity of the Inno Setup *installer stub* (SetupLdr), as opposed to the
  # IDE above. Both fields are written verbatim by the Inno Setup compiler into
  # every installer it produces, so they are the two things a forger copies
  # when dressing an unrelated executable up as an Inno installer.
  # size_max is unset: real installers routinely exceed the file-level default.
  - id: inno-setup-loader-manifest-identity
    desc: Inno Setup SetupLdr assembly manifest identity
    size_max: 500000000
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: JR.Inno.Setup
  - id: inno-setup-build-comment
    desc: Inno Setup build comment in version resource
    size_max: 500000000
    if:
      type: value
      path: pe.version.comments
      substr: built with Inno Setup

  - id: builtin-file-sfx-inno-setup-extraction-unexpected-loader-revision
    desc: Innoextract unexpected loader revision hook
    crit: suspicious
    conf: 0.95
    if:
      type: basename
      exact: __cleave_builtin_file_sfx_inno_setup_extraction_unexpected_loader_revision_hook__
    unless:
      - id: unpatched-setup-loader-template

  - id: builtin-file-sfx-inno-setup-extraction-loader-checksum-mismatch
    desc: Innoextract loader checksum mismatch hook
    crit: suspicious
    conf: 0.95
    if:
      type: basename
      exact: __cleave_builtin_file_sfx_inno_setup_extraction_loader_checksum_mismatch_hook__
    unless:
      - id: unpatched-setup-loader-template

composite_rules:
  - id: inno-setup-ide-context
    desc: Inno Setup IDE development-tool context
    crit: notable
    conf: 0.99
    all:
      - id: inno-setup-ide-manifest
      - id: inno-setup-ide-product

  - id: unpatched-setup-loader-template
    desc: Inno Setup unpatched compiler loader template
    crit: notable
    conf: 0.98
    all:
      - id: inno-setup-loader-manifest-identity
      - id: inno-setup-build-comment
      - id: metadata/binary/resource/identity::blank-version-resource-placeholder
