defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: pyinstaller-cookie-spec-text
    desc: PyInstaller cookie-named spec text
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bpyinstaller\b.{0,80}\bcookie[\w./\\-]{0,40}\.spec\b'
  - id: pyinstaller-stealer-spec-text
    desc: PyInstaller stealer-named spec text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bpyinstaller\b.{0,80}\bstealer[\w./\\-]{0,40}\.spec\b'
  - id: pyinstaller-keylog-spec-text
    desc: PyInstaller keylog-named spec text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bpyinstaller\b.{0,80}\bkeylog(ger)?[\w./\\-]{0,40}\.spec\b'
  - id: pyinstaller-rat-screenlog-spec-text
    desc: PyInstaller rat or screenlog spec text
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bpyinstaller\b.{0,80}\b(rat|screenlog(ger)?)[\w./\\-]{0,40}\.spec\b'
composite_rules:
  - id: pyinstaller-cookie-spec-freezer-clues
    desc: Cookie spec and freezer-install clues
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/tool/packaging/pyinstaller::pyinstaller-cookie-spec-text
      - id: micro-behaviors/os/package-manager/dependency-setup::pip-install-python-freezer
  - id: pyinstaller-stealer-spec-freezer-clues
    desc: Stealer spec and freezer-install clues
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/tool/packaging/pyinstaller::pyinstaller-stealer-spec-text
      - id: micro-behaviors/os/package-manager/dependency-setup::pip-install-python-freezer
  - id: pyinstaller-keylog-spec-freezer-clues
    desc: Keylog spec and freezer-install clues
    crit: suspicious
    conf: 0.92
    all:
      - id: well-known/tool/packaging/pyinstaller::pyinstaller-keylog-spec-text
      - id: micro-behaviors/os/package-manager/dependency-setup::pip-install-python-freezer
  - id: pyinstaller-rat-screenlog-freezer-clues
    desc: Rat or screenlog spec and freezer clues
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/tool/packaging/pyinstaller::pyinstaller-rat-screenlog-spec-text
      - id: micro-behaviors/os/package-manager/dependency-setup::pip-install-python-freezer
