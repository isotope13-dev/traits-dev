# embala-setup builds a setup.exe by appending a payload overlay (files,
# install/uninstall Lua scripts, manifest) onto a prebuilt Rust runtime stub.
# The stub is an installer UI: it reads its overlay, replays an install log,
# runs Lua scripts and asks for an install scope, so its API surface looks like
# a loader.  Its own banner token and Lua error strings identify it; they sit
# in a multi-megabyte .rdata whose strings the text extractor does not reach,
# so they are matched as bytes.
defaults:
  conf: 0.98
  platforms: [windows]
  for: [pe]

traits:
  - id: embala-banner-token
    crit: notable
    desc: embala installer banner token
    if:
      type: hex
      section: .rdata
      pattern: "45 4D 42 41 4C 41 5F 42 41 4E 4E 45 52"
composite_rules:
  - id: embala-setup-stub
    desc: embala setup.exe runtime stub
    crit: notable
    all:
      - id: embala-banner-token
      - id: micro-behaviors/os/package-manager/uninstall::setup-uninstall-lua-error-bytes
