# An elevated NSIS INetC flow and TEMP/process APIs are present, but no
# fetched path is bound to the process argument.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-inetc-temp-process-profile
    desc: Elevated NSIS INetC and TEMP/process clues
    crit: suspicious
    conf: 0.95
    all:
      - id: well-known/tool/packaging/nsis-inetc::nsis-admin-inetc-network-clues
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/os/handler/open::shell-execute-a
      - id: micro-behaviors/fs/write/file/handle/unspecified::pe-temp-write-process-api-profile
