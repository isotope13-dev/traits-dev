defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
- id: inetc-plugin-description
  crit: notable
  desc: INetC NSIS plugin description
  conf: 0.97
  if:
    type: text
    exact: inetc NSIS plug-in
    section: .rsrc
- id: inetc-user-agent
  crit: notable
  desc: INetC NSIS user agent
  conf: 0.92
  if:
    type: text
    exact: NSIS_Inetc (Mozilla)
    section: rdata
composite_rules:
- id: nsis-inetc-plugin
  desc: NSIS INetC transfer plugin
  crit: notable
  conf: 0.96
  all:
  - id: well-known/tool/packaging/nsis-inetc::inetc-plugin-description
  - id: metadata/binary/symbols/name/export::export-name-get
  - id: metadata/binary/symbols/name/export::export-name-post
  any:
  - id: metadata/binary/symbols/name/export::export-name-head
  - id: metadata/binary/symbols/name/export::export-name-put
  - id: well-known/tool/packaging/nsis-inetc::inetc-user-agent
  needs: 2
