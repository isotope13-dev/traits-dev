defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-admin-inetc-network-clues
  desc: Elevated NSIS with INetC WinINet flow
  crit: suspicious
  conf: 0.94
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/build/manifest::require-administrator
  - id: well-known/tool/packaging/nsis-inetc::nsis-inetc-plugin
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  any:
  - id: micro-behaviors/communications/http/post::wininet-post
  - id: micro-behaviors/communications/ftp/client::wininet-ftp-api
  - id: micro-behaviors/communications/http/authorization-header::auth-header
  unless:
  - id: metadata/signature/verified/signer::glarysoft-ltd
