defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: naughty-strings-sample-text
    desc: Naughty strings sample text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: big-list-of-naughty-strings|sampler\(:naughty|TheNaughtyStrings
  # The list file itself (blns.txt), with or without its `#\tReserved Strings`
  # comment header: vendored as QA input (R fs tests/testthat/blns.txt.xz).
  # Its XXE, SQLi and XSS lines are fuzz inputs, not payloads aimed anywhere.
  - id: naughty-strings-list-file
    desc: Big List of Naughty Strings file
    crit: notable
    conf: 0.9
    for: [text, data]
    if:
      type: text
      regex: '(?m)^undefined\r?\nundef\r?\nnull\r?\nNULL\r?\n\(null\)\r?\nnil\r?\nNIL\r?\ntrue'
