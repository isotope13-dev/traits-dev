defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: naughty-strings-sample-text
    desc: Naughty strings sample text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: big-list-of-naughty-strings|sampler\(:naughty|TheNaughtyStrings
  # The list file itself (blns.txt), with or without its `#\tReserved Strings`
  # comment header: vendored as QA input (R fs tests/testthat/blns.txt.xz).
  # Its XXE, SQLi and XSS lines are fuzz inputs, not payloads aimed anywhere.
  - id: naughty-strings-list-file
    desc: Big List of Naughty Strings file
    crit: notable
    conf: 0.9
    for: [text, data]
    if:
      type: text
      regex: '(?m)^undefined\r?\nundef\r?\nnull\r?\nNULL\r?\n\(null\)\r?\nnil\r?\nNIL\r?\ntrue'
  - id: naughty-strings-sql-null-rows
    desc: Null-like SQL string rows
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: "(?m)^\\('undefined'\\),\\r?\\n\\('undef'\\),\\r?\\n\\('null'\\),\\r?\\n\\('NULL'\\),"
  - id: naughty-strings-sql-boolean-rows
    desc: Nil and true SQL string rows
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: "(?m)^\\('\\(null\\)'\\),\\r?\\n\\('nil'\\),\\r?\\n\\('NIL'\\),\\r?\\n\\('true'\\),"
  - id: naughty-strings-xml-dictionary-path
    desc: Naughty strings XML dictionary path
    crit: notable
    for: [xml]
    if:
      type: path
      regex: '(^|[/\\])naughtystrings[/\\]xmlinjection$'
composite_rules:
  - id: naughty-strings-sql-rows
    desc: Big List of Naughty Strings in SQL rows
    crit: notable
    for: [text]
    near_lines: 10
    all:
      - id: naughty-strings-sql-null-rows
      - id: naughty-strings-sql-boolean-rows
