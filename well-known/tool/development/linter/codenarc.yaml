# CodeNarc — static analyzer for Groovy source code.
defaults:
  platforms: [windows, unix]
  for: [class, jar, archives, data, source]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 200000000

traits:
  - id: codenarc-jar-path
    desc: CodeNarc analyzer JAR path
    if:
      type: path
      regex: 'CodeNarc[^\\/]*[.]jar([.]extracted)?'

  - id: codenarc-jar-name
    desc: CodeNarc analyzer JAR name
    for: [jar]
    if:
      type: basename
      regex: '^CodeNarc[^\\/]*[.]jar$'

composite_rules:
  - id: codenarc-analyzer
    desc: CodeNarc Groovy static analyzer
    any:
      - id: codenarc-jar-path
      - id: codenarc-jar-name
