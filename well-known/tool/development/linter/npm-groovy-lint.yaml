# npm-groovy-lint — Groovy, Jenkinsfile, and Gradle source linter.
# Its Java launcher, local CodeNarc HTTP service, and bundled build libraries
# legitimately expose process, network, compiler, and filesystem behaviors.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, manifests, data, archives, binaries]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 200000000

traits:
  - id: npm-groovy-lint-package-name
    desc: npm-groovy-lint package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: npm-groovy-lint

  - id: npm-groovy-lint-repository
    desc: npm-groovy-lint GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github[.]com/nvuillam/npm-groovy-lint([.]git)?$'

  - id: npm-groovy-lint-package-path
    desc: npm-groovy-lint package path
    if:
      type: path
      regex: '(^|[\\/])npm-groovy-lint([\\/]|$)'

composite_rules:
  - id: npm-groovy-lint-tool
    desc: npm-groovy-lint developer tool
    any:
      - id: npm-groovy-lint-package-name
      - id: npm-groovy-lint-repository
      - id: npm-groovy-lint-package-path
