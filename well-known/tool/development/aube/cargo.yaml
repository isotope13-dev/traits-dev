# aube-scripts — Aube package-manager lifecycle script runner crate.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 20000

traits:
  - id: aube-scripts-crate-name
    desc: Aube scripts Cargo package name
    if:
      type: value
      path: package.name
      exact: aube-scripts

  - id: aube-scripts-description
    desc: Aube lifecycle script runner description
    if:
      type: value
      path: package.description
      exact: Lifecycle script runner for Aube

  - id: aube-codes-workspace-dep
    desc: Aube codes workspace crate dependency
    if:
      type: value
      path: dependencies.aube-codes.workspace
      exists: true

composite_rules:
  - id: aube-scripts-crate
    desc: Aube lifecycle script runner crate
    all:
      - id: aube-scripts-crate-name
      - id: aube-scripts-description
