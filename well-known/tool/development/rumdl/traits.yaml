# rumdl — fast Markdown linter (Ru(st) MarkDown Linter).
defaults:
  platforms: [linux, macos, windows]
  for: [rust, cargo.toml, crate, python]
  crit: notable
  conf: 0.98

traits:
  - id: crate-name
    desc: rumdl Cargo crate name
    for: [cargo.toml, crate]
    if:
      type: value
      path: crate.name
      exact: rumdl

  - id: github-repo
    desc: rumdl GitHub repository marker
    for: [rust, cargo.toml, crate, markdown]
    if:
      type: text
      substr: github.com/rvben/rumdl

  - id: cold-start-benchmark-script
    desc: rumdl cold-start benchmark script
    for: [python]
    if:
      type: path
      basename: true
      exact: benchmark_cold_start.py

  - id: cold-start-benchmark-doc
    desc: rumdl cold-start benchmark description
    for: [python]
    if:
      type: text
      substr: Cold start benchmark comparison

  - id: benchmark-rule-generator
    desc: rumdl rule benchmark fixture generator
    for: [rust]
    if:
      type: text
      substr: fn generate_test_content

  - id: benchmark-rule-binary-path
    desc: rumdl rule benchmark binary path
    for: [rust]
    if:
      type: path
      basename: true
      exact: benchmark_rule.rs

composite_rules:
  - id: cold-start-benchmark-context
    desc: Recognized rumdl cold-start benchmark helper
    crit: exception
    conf: 0.99
    all:
      - id: cold-start-benchmark-script
      - id: cold-start-benchmark-doc

  - id: rumdl-markdown-linter-context
    desc: rumdl Markdown linter project
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: crate-name
      - id: github-repo
