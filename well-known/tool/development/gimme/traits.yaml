# gimme (travis-ci/gimme) — the shell script that installs and selects a Go
# toolchain version. Its documented invocation is
# `eval "$(curl -sL .../travis-ci/gimme/master/gimme | GIMME_GO_VERSION=x bash)"`,
# because gimme prints the environment exports that the caller must apply, so
# the eval is load-bearing rather than a payload dropper. CI scripts across
# Travis, Jenkins and GitHub Actions bootstrap Go exactly this way.
#
# Identity only: the eval-curl capability atoms still fire and stay visible;
# this context is what keeps the dropper composite from claiming intent.
defaults:
  platforms: [unix]
  for: [shell, github-actions]
  crit: notable
  conf: 0.97

traits:
  - id: gimme-installer-url
    desc: travis-ci gimme installer script URL
    if:
      type: text
      regex: 'githubusercontent\.com/travis-ci/gimme/'

  - id: gimme-go-version-variable
    desc: GIMME_GO_VERSION toolchain selector
    if:
      type: text
      substr: 'GIMME_GO_VERSION'

composite_rules:
  # Both legs, so a bare `curl .../gimme` reference is not enough: the version
  # selector is what shows the script is being used as the Go installer.
  - id: gimme-bootstrap-context
    desc: Recognized gimme Go toolchain bootstrap
    crit: exception
    conf: 0.98
    all:
      - id: gimme-installer-url
      - id: gimme-go-version-variable
