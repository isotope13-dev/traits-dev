# AWS CDK libraries intentionally import the SDK as a peer. Published jsii
# packages therefore contain source-level `require("aws-cdk-lib/...")` calls
# without placing that framework in runtime `dependencies`; consumers provide
# the peer. Keep this package-manager shape from looking like a phantom
# runtime dependency while retaining the import facts themselves.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]

traits:
  - id: awscli-v1-asset-package-name
    desc: AWS CLI v1 asset npm package name
    for: [package.json]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: "@aws-cdk/asset-awscli-v1"

  - id: aws-cdk-repository
    desc: AWS CDK GitHub repository metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::repository.url
      regex: '(?i)github[.]com/aws/aws-cdk([.]git)?$'

  - id: aws-cdk-peer-sdk
    desc: AWS CDK peer SDK dependency
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::peerDependencies.aws-cdk-lib
      exists: true

composite_rules:
  - id: aws-cdk-peer-api-context
    desc: AWS CDK peer API package context
    crit: exception
    conf: 0.99
    all:
      - id: aws-cdk-repository
      - id: aws-cdk-peer-sdk
