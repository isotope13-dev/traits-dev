defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: gn-executable-basename
    desc: Chromium GN build tool executable
    if:
      type: basename
      exact: gn.exe
  - id: gn-source-build-marker
    desc: Chromium GN source-build marker
    crit: component
    if:
      type: text
      regex: '(?i)[\\/]src[\\/]gn[\\/]Release[\\/]gn\.exe\.pdb'

composite_rules:
  - id: gn-build-tool
    desc: Chromium GN build tool
    crit: notable
    all:
      - id: gn-executable-basename
      - id: gn-source-build-marker
