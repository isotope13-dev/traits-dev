# Darling is a macOS compatibility layer distributed as Debian packages.  Its
# runtime deliberately contains Darwin libraries, launchd jobs, Mach exception
# handling, and macOS configuration paths; those are implementation details of
# the compatibility layer, not indicators of a backdoor.
defaults:
  platforms: [linux, macos]
  for: [deb, zip, archives, macho, elf, binaries, scripts, data, plist, text]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: debian-package-name
    desc: Darling Debian package name
    for: [deb]
    if:
      type: value
      path: deb.package
      regex: '^darling(-[a-z0-9]+)*$'

  - id: release-archive-members
    desc: Darling release archive Debian members
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|[\\/])darling-[^\\/]+_[0-9][^\\/]*\.deb$'

  - id: debian-package-member-path
    desc: Darling Debian package member path
    for: [deb, zip]
    if:
      type: basename
      regex: '^darling-[^_]+_[0-9][^_]*\.deb$'

  - id: runtime-member-path
    desc: Darling runtime member path
    for: [macho, elf, binaries, scripts, data, plist, text]
    if:
      type: path
      regex: 'libexec[\\/]darling'

composite_rules:
  - id: darling-package-context
    desc: Darling macOS compatibility-layer package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: debian-package-name
      - id: release-archive-members
      - id: debian-package-member-path
      - id: runtime-member-path
