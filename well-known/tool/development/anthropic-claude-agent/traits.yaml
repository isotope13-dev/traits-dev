defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, macho]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: claude-agent-sdk-js-marker
    desc: Claude agent SDK JavaScript marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@anthropic-ai/claude-agent-sdk'
  - id: claude-agent-sdk-package-path
    desc: Claude Agent SDK package directory path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      regex: '@anthropic-ai/claude-agent-sdk'
  - id: claude-agent-sdk-package-name
    desc: Claude Agent SDK npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@anthropic-ai/claude-agent-sdk'
  - id: claude-agent-sdk-platform-package
    desc: Claude Agent SDK platform binary npm package
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@anthropic-ai/claude-agent-sdk-'
  - id: claude-agent-sdk-platform-dependency
    desc: Claude Agent SDK platform dependency ref
    crit: notable
    for: [package.json]
    if:
      type: text
      regex: '"@anthropic-ai/claude-agent-sdk-(linux|darwin|win32)-'
  - id: claude-agent-sdk-platform-archive
    desc: Claude Agent SDK platform binary archive path
    crit: notable
    for: [zip, tar, text]
    if:
      type: path
      regex: 'claude-agent-sdk-[a-z0-9]+-'
  - id: claude-agent-sdk-runtime-marker
    desc: Reads Claude Agent SDK environment variable
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env(\?\.|\.|\[[''"])CLAUDE_AGENT_SDK'
  - id: claude-agent-native-runtime
    desc: Claude Agent native runtime filename
    crit: notable
    platforms: [unix, windows, android]
    for: [elf]
    size_max: 300000000
    if:
      type: path
      regex: '(^|[\\/])claude$'
  - id: claude-agent-sdk-python-marker
    desc: Claude Agent SDK Python package
    crit: notable
    for: [python]
    if:
      type: path
      regex: 'claude_agent_sdk[\\/]types\.py$'

composite_rules:
  - id: claude-agent-sdk-package
    desc: Anthropic Claude Agent SDK package
    crit: notable
    conf: 0.99
    any:
      - id: claude-agent-sdk-js-marker
      - id: claude-agent-sdk-package-path
      - id: claude-agent-sdk-package-name
      - id: claude-agent-sdk-platform-package
      - id: claude-agent-sdk-platform-dependency
      - id: claude-agent-sdk-platform-archive
      - id: claude-agent-native-runtime
  - id: salesforce-claude-agent-extension
    desc: Salesforce Claude agent extension
    crit: notable
    conf: 0.99
    all:
      - id: claude-agent-sdk-js-marker
      - id: well-known/app/development/vscode-extension/salesforcedx-einstein-gpt::package-marker
