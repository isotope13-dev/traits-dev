# Python development tools that download and cache official browser WebDriver
# binaries (webdriver-manager, driverManagementPro, and similar helpers).
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.92

traits:
  - id: chromedriver-zip-url-template
    desc: ChromeDriver zip download URL template
    if:
      type: text
      substr: chromedriver-win64.zip

  - id: webdriver-cache-doc-marker
    desc: WebDriver cache management documentation
    if:
      type: text
      regex: '(?i)webdriver.{0,20}cache'

  - id: webdriver-manager-package-marker
    desc: WebDriver Manager package identifier
    if:
      type: text
      regex: '(?i)\bwebdriver[-_ ]manager\b'

composite_rules:
  - id: selenium-webdriver-driver-manager-package
    desc: Selenium WebDriver driver manager Python package
    crit: notable
    conf: 0.95
    all:
      - id: well-known/lib/development/selenium::python-webdriver-import
    any:
      - id: well-known/app/development/dev-tool-downloads::official-browser-driver-download-urls
      - id: chromedriver-zip-url-template
      - id: webdriver-cache-doc-marker
      - id: webdriver-manager-package-marker
