# HyperEnv for VS Code extension.
# Mentions curl/powershell installation in readme and error text for CLI installation.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, vsix, markdown, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: package-name
    desc: hyperenv package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: hyperenv

  - id: vsix-id
    desc: hyperenv VSIX id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: hyperenv

  - id: vsix-publisher
    desc: hyperenv VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: falcaosl

  - id: github-repo
    desc: hyperenv GitHub repo
    for: [package.json, markdown, javascript]
    if:
      type: text
      substr: github.com/iramarfalcao/hyperenv

composite_rules:
  - id: hyperenv-vsix-identity
    desc: HyperEnv VS Code extension VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
