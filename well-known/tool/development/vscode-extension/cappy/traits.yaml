defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  - vsix
  crit: notable
  conf: 0.98
traits:
- id: cappy-extension-path
  desc: Cappy VS Code extension member path
  if:
    type: path
    regex: (?i)eduardocecon\.cappy
- id: cappy-package-name
  desc: Cappy VS Code extension package name
  for:
  - package.json
  - javascript
  if:
    type: text
    substr: '"name": "cappy"'
- id: cappy-publisher
  desc: eduardocecon VS Code extension publisher
  for:
  - package.json
  - javascript
  if:
    type: text
    substr: '"publisher": "eduardocecon"'
- id: cappy-github-repo
  desc: eduardocecon/cappy GitHub repository
  for:
  - javascript
  - typescript
  - package.json
  if:
    type: text
    substr: eduardocecon/cappy
composite_rules:
- id: cappy-vscode-extension
  desc: Cappy AI dev companion VS Code extension
  conf: 0.99
  any:
  - id: cappy-extension-path
  - id: cappy-package-name
  all:
  - id: metadata/lang/source/syntax/key-value::npm-dep-model-context-protocol-sdk
  - id: metadata/lang/source/syntax/key-value::openai-semver-dependency-text
