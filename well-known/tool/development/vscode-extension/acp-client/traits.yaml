# ACP Client — Agent Client Protocol VS Code extension (formulahendry / vscode-acp).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: acp-client-extension-path
    desc: ACP Client VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)formulahendry\.acp-client'

  - id: acp-client-package-name
    desc: ACP Client VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "acp-client"'

  - id: acp-client-publisher
    desc: ACP Client VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "formulahendry"'

  - id: acp-client-github-repo
    desc: ACP Client GitHub repository URL
    if:
      type: text
      substr: formulahendry/vscode-acp

  - id: acp-client-embedded-package-json
    desc: ACP Client embedded package.json marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '"name":"acp-client","displayName":"ACP Client"'

composite_rules:
  - id: acp-client-vscode-extension
    desc: ACP Client Agent Client Protocol VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: acp-client-extension-path
      - id: acp-client-package-name
