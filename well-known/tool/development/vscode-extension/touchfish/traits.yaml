# TouchFish — ylw VS Code slack-off news/media aggregator extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, archives, python, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: touchfish VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: touchfish

  - id: publisher
    desc: ylw TouchFish extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ylw

  - id: vsix-basename
    desc: ylw TouchFish VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^ylw\.touchfish-.*\.vsix$'

  - id: touchfish-view-id
    desc: touchfish VS Code view container id
    for: [package.json, json]
    if:
      type: text
      substr: onView:touchfish

  - id: vscode-ffmpeg-replacer-script
    desc: VS Code electron ffmpeg library replacer script
    for: [python]
    if:
      type: path
      basename: true
      exact: reaplace-ffmpeg.py
      case_insensitive: true

composite_rules:
  - id: touchfish-vscode-extension
    desc: TouchFish VS Code media aggregator extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: vsix-basename
      - id: touchfish-view-id
