# MarsCode (Trae) ships a large VS Code extension that bundles its own
# language-server and agent binaries. The package is oversized because of
# those binaries, not because a small extension is hiding a payload.
defaults:
  size_min: 1000000
  platforms: [windows, unix]
  for: [vsix, vsix-archive]
  crit: notable
  conf: 0.95
traits:
  - id: marscode-extension-basename
    desc: MarsCode VS Code extension package
    if:
      type: basename
      regex: '(?i)^MarsCode\.marscode-extension.+\.vsix$'
  - id: marscode-aiserver-main
    desc: MarsCode AI server main bundle
    for: [javascript]
    if:
      type: basename
      exact: aiServerMainV2.js
  - id: marscode-ai-agent-source-path
    desc: MarsCode AI agent source path
    for: [elf]
    size_min: 100000000
    if:
      type: text
      section: rodata
      substr: apps/icube_server_rs/modules/ai-agent/src/
  - id: trae-debugger-guide-reference
    desc: Bundled TRAE debugger guide reference
    for: [elf]
    size_min: 100000000
    if:
      type: text
      section: rodata
      substr: TRAE-debugger/guides/debug-server.md
  - id: zeromq-websocket-engine-source-path
    desc: Bundled ZeroMQ WebSocket engine source path
    for: [elf]
    size_min: 100000000
    if:
      type: text
      section: rodata
      substr: zeromq-src-0.3.6+4.3.5/vendor/src/ws_engine.cpp
  - id: zeromq-websocket-request-template
    desc: ZeroMQ WebSocket request template
    for: [elf]
    size_min: 100000000
    if:
      type: text
      section: rodata
      substr: GET %s HTTP/1.1

composite_rules:
  - id: marscode-agent-debug-guide-websocket-context
    desc: MarsCode agent guide and WebSocket context
    crit: exception
    conf: 0.99
    for: [elf]
    size_min: 100000000
    all:
      - id: marscode-ai-agent-source-path
      - id: trae-debugger-guide-reference
      - id: zeromq-websocket-engine-source-path
      - id: zeromq-websocket-request-template
