# MarsCode (Trae) ships a large VS Code extension that bundles its own
# language-server and agent binaries. The package is oversized because of
# those binaries, not because a small extension is hiding a payload.
defaults:
  size_min: 1000000
  platforms: [windows, unix]
  for: [vsix, vsix-archive]
  crit: notable
  conf: 0.95
traits:
  - id: marscode-extension-basename
    desc: MarsCode VS Code extension package
    if:
      type: basename
      regex: '(?i)^MarsCode\.marscode-extension.+\.vsix$'
  - id: marscode-aiserver-main
    desc: MarsCode AI server main bundle
    for: [javascript]
    if:
      type: basename
      exact: aiServerMainV2.js
