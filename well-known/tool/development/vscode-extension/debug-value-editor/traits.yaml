# Microsoft JS Debug Value Editor VS Code extension.
# Mentions curl/powershell installation in error text.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, vsix, markdown, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: package-name
    desc: debug-value-editor package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: debug-value-editor

  - id: vsix-id
    desc: debug-value-editor VSIX id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: debug-value-editor

  - id: github-repo
    desc: vscode-debug-value-editor GitHub repo
    for: [package.json, markdown, javascript]
    if:
      type: text
      substr: github.com/microsoft/vscode-debug-value-editor

composite_rules:
  - id: debug-value-editor-manifest-identity
    desc: ms-vscode debug-value-editor package pair
    crit: notable
    conf: 0.98
    for: [package.json]
    all:
      - id: well-known/tool/development/vscode-extension/microsoft-remote::remote-server-package-publisher
      - id: package-name

  - id: debug-value-editor-vsix-identity
    desc: ms-vscode debug-value-editor VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: well-known/tool/development/vscode-extension/microsoft-remote::remote-server-vsix-publisher
