# Markdown Live Editor — WYSIWYG Markdown editor VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: markdown-live-editor-extension-path
    desc: Markdown Live Editor VS Code extension path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)jishii1204\.markdown-live-editor'

  - id: markdown-live-editor-package-name
    desc: markdown-live-editor VS Code package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: markdown-live-editor

  - id: jishii1204-publisher
    desc: jishii1204 VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: jishii1204

  - id: markdown-live-editor-github-repo
    desc: jishii1204 vscode-markdown-live GitHub repo
    for: [package.json, markdown]
    if:
      type: text
      substr: jishii1204/vscode-markdown-live

  - id: markdown-live-editor-view-type
    desc: markdownLiveEditor custom editor view type
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: markdownLiveEditor.editor

composite_rules:
  - id: markdown-live-editor-vscode-extension
    desc: Markdown Live Editor WYSIWYG VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: markdown-live-editor-extension-path
      - id: markdown-live-editor-package-name
