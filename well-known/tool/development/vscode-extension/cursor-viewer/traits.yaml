# xJchen cursor-viewer — VS Code office/markdown file viewer.
defaults:
  platforms: [unix, windows]
  for: [json, javascript, powershell, vsix]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cursor-viewer VS Code extension name
    for: [json]
    if:
      type: value
      path: name
      exact: cursor-viewer

  - id: publisher
    desc: xJchen VS Code extension publisher
    for: [json]
    if:
      type: value
      path: publisher
      exact: xJchen

  - id: vsix-basename
    desc: cursor-viewer VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^xJchen\.cursor-viewer-.*\.vsix$'

  - id: vditor-open-command
    desc: cursor-viewer Vditor markdown open command
    for: [json, javascript]
    if:
      type: text
      substr: cursor-viewer.markdown.openWithVditor

  - id: clipboard-png-dump
    desc: clipboard PNG dump helper attribution
    for: [powershell]
    if:
      type: text
      substr: github.com/octan3/img-clipboard-dump

composite_rules:
  - id: cursor-viewer-vscode-extension
    desc: xJchen cursor-viewer VS Code extension
    any:
      - id: package-name
      - id: publisher
      - id: vsix-basename
      - id: vditor-open-command
      - id: clipboard-png-dump
