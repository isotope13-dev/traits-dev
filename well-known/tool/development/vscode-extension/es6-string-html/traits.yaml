# Official es6-string-html VS Code extension (publisher Tobermory).
# TextMate injectTo grammars highlight HTML/SQL/CSS inside template strings.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: Tobermory VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: Tobermory

  - id: package-name
    desc: es6-string-html VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: es6-string-html

  - id: vsix-id
    desc: es6-string-html VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: es6-string-html

  - id: vsix-publisher
    desc: es6-string-html VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: Tobermory

  - id: github-repo
    desc: es6-string-html GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/mydesireiscoma/es6-string-html
