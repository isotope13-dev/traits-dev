# torn4dom4n LaTeX language-support VS Code extension. Grammar and
# snippets only (no extension JS). High scores on fetched
# github.githubassets.com chunks are GitHub's frontend, not this pack.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: torn4dom4n VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: torn4dom4n

  - id: package-name
    desc: latex-support VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: latex-support

  - id: vsix-id
    desc: latex-support VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: latex-support

  - id: vsix-publisher
    desc: torn4dom4n VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: torn4dom4n

  - id: github-repo
    desc: AREA44 vscode-LaTeX-support GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/AREA44/vscode-LaTeX-support

composite_rules:
  - id: latex-support-manifest-identity
    desc: torn4dom4n latex-support publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: latex-support-vsix-identity
    desc: torn4dom4n latex-support VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
