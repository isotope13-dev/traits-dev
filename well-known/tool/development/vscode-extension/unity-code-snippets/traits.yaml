# kleber-swf Unity Code Snippets VS Code extension. The VSIX writes
# generated snippet JSON into the extension folder; high scores on
# fetched github.githubassets.com chunks are GitHub's frontend, not
# this snippet pack.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: kleber-swf VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: kleber-swf

  - id: package-name
    desc: Unity Code Snippets package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: unity-code-snippets

  - id: vsix-id
    desc: Unity Code Snippets VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: unity-code-snippets

  - id: vsix-publisher
    desc: Unity Code Snippets VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: kleber-swf

  - id: github-repo
    desc: vscode-unity-code-snippets GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: kleber-swf/vscode-unity-code-snippets
