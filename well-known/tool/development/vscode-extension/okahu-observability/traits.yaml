# Okahu AI Observability — VS Code extension for cloud AI agent tracing.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96

traits:
  - id: okahu-publisher
    desc: Okahu VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: OkahuAI

  - id: okahu-package-name
    desc: Okahu observability extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: okahu-ai-observability

  - id: okahu-docs-url
    desc: Okahu documentation site URL
    if:
      type: text
      substr: docs.okahu.ai

  - id: n8n-workflow-trace-api-path
    desc: n8n workflow trace spans API path
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '/api/v1/workflows/.{0,80}/traces/'

composite_rules:
  - id: okahu-ai-observability-extension
    desc: Okahu AI observability VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: okahu-publisher
      - id: okahu-package-name
