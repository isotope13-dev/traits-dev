# Atom Material Theme — VS Code color theme (publisher tobiasalthoff).
# Marketplace VSIX; GitHub frontend CDN chunks linked from the repo are
# github-web identity, not this extension's own code.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 20000000

traits:
  - id: publisher
    desc: tobiasalthoff VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: tobiasalthoff

  - id: package-name
    desc: atom-material-theme VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: atom-material-theme

  - id: vsix-id
    desc: Atom Material Theme VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: atom-material-theme

  - id: vsix-publisher
    desc: Atom Material Theme VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: tobiasalthoff

  - id: github-repo
    desc: tobiasalthoff/vscode-atom-material-theme
    for: [package.json, json, markdown]
    if:
      type: text
      substr: tobiasalthoff/vscode-atom-material-theme

composite_rules:
  - id: atom-material-theme-extension
    desc: Atom Material Theme VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
