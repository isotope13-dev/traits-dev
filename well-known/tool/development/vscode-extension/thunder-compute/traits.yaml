# Thunder Compute VS Code extension (publisher ThunderCompute).
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Thunder Compute VS Code extension package name
    if:
      type: value
      path: name
      exact: thunder-compute

  - id: publisher
    desc: ThunderCompute VS Code publisher
    if:
      type: value
      path: publisher
      exact: ThunderCompute

composite_rules:
  - id: thunder-compute-vscode-extension
    desc: Thunder Compute VS Code extension
    all:
      - id: package-name
      - id: publisher
