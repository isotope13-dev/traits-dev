# Sloppy — programming language for game development (sloppy-lang.org).
# Official VS Code extension by RedFoxLabs for Sloppy language support.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, markdown]
  crit: notable
  conf: 0.96

traits:
  - id: publisher
    desc: RedFoxLabs VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: RedFoxLabs

  - id: package-name
    desc: Sloppy VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: sloppy

  - id: vsix-id
    desc: Sloppy language VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: sloppy

  - id: vsix-publisher
    desc: RedFoxLabs VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: RedFoxLabs

  - id: github-repo
    desc: Sloppy language GitHub repository reference
    for: [package.json, json, markdown, javascript, typescript]
    if:
      type: text
      substr: github.com/david-andrew/sloppy-lang

  - id: sloppy-powershell-piped-installer-command
    desc: Sloppy PowerShell installer piped to IEX
    crit: notable
    conf: 0.95
    for: [javascript, typescript, powershell, batch, shell]
    if:
      type: text
      regex: '(?i)(irm|Invoke-RestMethod)\s+\S*sloppy-lang\.org/install\.ps1\s*\|\s*iex\b'

composite_rules:
  - id: sloppy-manifest-identity
    desc: RedFoxLabs Sloppy publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: sloppy-vsix-identity
    desc: RedFoxLabs Sloppy VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
