# Julia VS Code extension by JuliaLang.
# Provides Juliaup/Julia installation commands for users.
defaults:
  platforms: [unix, windows]
  for: [vsix-manifest, vsix, package.json, javascript]
  crit: notable
  conf: 0.96
  size_min: 1000
  size_max: 200000000

traits:
  - id: vsix-id
    desc: Julia VSIX id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: language-julia

  - id: julialang-install-url
    desc: Official Julia install script URL
    for: [javascript, json, markdown, shell]
    if:
      type: text
      regex: '(?i)https?://install\.julialang\.org'
