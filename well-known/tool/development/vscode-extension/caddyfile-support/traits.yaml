defaults:
  platforms: [unix, windows]
  for: [vsix, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: official-publisher
    desc: Caddyfile Support publisher Matthewpi
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      regex: '(?i)^matthewpi$'
  - id: official-marketplace-link
    desc: Caddyfile Support marketplace listing link
    for: [markdown]
    if:
      type: text
      substr: 'marketplace.visualstudio.com/items?itemName=matthewpi.caddyfile-support'
