defaults:
  platforms: [unix, windows]
  for: [vsix, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: official-publisher
    desc: BasedPyright publisher Detachhead
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      regex: '(?i)^detachhead$'
  - id: official-marketplace-link
    desc: BasedPyright marketplace listing link
    for: [markdown]
    if:
      type: text
      substr: 'marketplace.visualstudio.com/items?itemName=detachhead.basedpyright'
