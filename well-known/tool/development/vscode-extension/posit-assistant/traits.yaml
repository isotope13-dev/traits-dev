# Posit Assistant — AI data assistant for Positron/VS Code.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: posit-assistant-package-name
    desc: Posit Assistant VS Code extension name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: assistant

  - id: posit-publisher
    desc: posit VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: posit

  - id: posit-assistant-view-id
    desc: Posit Assistant webview view identifier
    for: [package.json, json, javascript]
    if:
      type: text
      substr: posit-assistant.sidebarView

  - id: positron-engine-requirement
    desc: Positron engine version requirement
    for: [package.json, json]
    if:
      type: text
      substr: '"positron":'

composite_rules:
  - id: posit-assistant-vscode-extension
    desc: Posit Assistant AI data assistant extension
    crit: notable
    conf: 0.99
    all:
      - id: posit-publisher
      - id: posit-assistant-package-name
