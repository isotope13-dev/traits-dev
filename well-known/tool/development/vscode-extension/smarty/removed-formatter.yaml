# Microsoft lists OktayAydoan.smarty-formatter for impersonation (2025-12-23).
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
# The list identifies a package, not malicious behavior in a particular build.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
traits:
  - id: removed-smarty-formatter-publisher
    desc: OktayAydoan extension publisher
    if:
      type: value
      path: publisher
      exact: OktayAydoan
  - id: removed-smarty-formatter-name
    desc: Smarty Formatter extension name
    if:
      type: value
      path: name
      exact: smarty-formatter
composite_rules:
  - id: removed-smarty-formatter-identity
    desc: Removed Smarty Formatter extension identity
    crit: suspicious
    for: [vsix, vsix-manifest, xml, package.json]
    scope: archive
    all:
      - id: removed-smarty-formatter-publisher
      - id: removed-smarty-formatter-name
      - id: metadata/package/runtime::vscode-executes-code-property
