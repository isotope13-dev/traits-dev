# Huawei OP DevTools — Ascend C operator development VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest, python, shell]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: huawei-op-devtools-vsix-name
    desc: Huawei OP DevTools VSIX archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)huawei-op-devtools.*\.vsix$'

  - id: huawei-op-devtools-package-name
    desc: Huawei OP DevTools extension package name
    crit: notable
    for: [archives, javascript, json, package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"huawei-op-devtools-vscode-plugin"'

  - id: huawei-op-devtools-publisher
    desc: huawei VS Code publisher marker
    crit: notable
    for: [archives, javascript, json, package.json, vsix-manifest]
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"huawei"'

  - id: huawei-cann-copyright
    desc: Huawei CANN Open Software license marker
    crit: notable
    for: [python, shell, javascript]
    if:
      type: text
      substr: CANN Open Software License Agreement

  - id: huawei-technologies-copyright
    desc: Huawei Technologies copyright header
    crit: notable
    for: [python, shell, javascript]
    if:
      type: text
      substr: Huawei Technologies Co., Ltd.

  - id: ascend-op-generator-marker
    desc: Ascend operator generator class marker
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: AscendOpGenerator

composite_rules:
  - id: huawei-op-devtools-vscode-extension
    desc: Huawei OP DevTools Ascend operator VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: huawei-op-devtools-publisher
    any:
      - id: huawei-op-devtools-vsix-name
      - id: huawei-op-devtools-package-name
      - id: ascend-op-generator-marker
