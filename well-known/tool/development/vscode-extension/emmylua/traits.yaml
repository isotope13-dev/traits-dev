# EmmyLua — official VS Code EmmyLua language and debugger extension by tangzx.
defaults:
  platforms: [windows, unix]
  for: [manifests, vsix, binaries, scripts, source]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 600000000

traits:
  - id: publisher
    desc: tangzx VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: tangzx

  - id: package-name
    desc: EmmyLua extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: emmylua

  - id: vsix-id
    desc: EmmyLua VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: emmylua

  - id: vsix-publisher
    desc: EmmyLua VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: tangzx

  - id: extension-member
    desc: EmmyLua VS Code extension member
    for: [binaries, scripts, source, data]
    if:
      type: path
      regex: '(?i)(tangzx\.emmylua|debugger[\\/]emmy|extension[\\/]debugger)'

  - id: emmy-tool-helper
    desc: EmmyLua debugger attach helper binary
    for: [pe]
    if:
      type: text
      section: .rdata
      substr: InjectedDllName_SHMEM

composite_rules:
  - id: emmylua-extension-manifest
    desc: Recognized EmmyLua VS Code extension manifest
    crit: notable
    conf: 0.99
    for: [package.json, vsix-manifest, json, vsix]
    all:
      - id: publisher
      - id: package-name
