defaults:
  platforms: [unix, windows]
  for: [vsix, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: official-publisher
    desc: Vue extension publisher Vue
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      regex: '(?i)^vue$'
  - id: volar-vsix-name
    desc: Volar VSIX extension name
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      regex: '(?i)^volar(-vscode)?$'
  - id: official-display-name
    desc: Vue extension claims official branding
    for: [package.json]
    if:
      type: value
      path: displayName
      regex: '(?i)^(official vue|vue \(official\))$'
  - id: upstream-repository
    desc: Vue language tools repository link
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^https://github\.com/vuejs/language-tools(\.git)?$'
