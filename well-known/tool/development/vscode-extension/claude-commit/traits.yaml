# Marketplace identity and upstream repository of Claude Commit.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: Juanlb VS Code extension publisher
    if:
      type: value
      path: publisher
      exact: juanlb

  - id: name
    desc: Claude Commit extension name
    if:
      type: value
      path: name
      exact: claude-commit

  - id: repository
    desc: Claude Commit upstream repository
    if:
      type: value
      path: repository.url
      substr: github.com/juanlb/claude-commit
