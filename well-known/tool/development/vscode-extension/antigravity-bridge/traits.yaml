# Antigravity Ask Bridge — local REST/CLI bridge for Antigravity IDE (ddarkr).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: antigravity-bridge-extension-path
    desc: Antigravity bridge VS Code extension path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)(ddarkr\.)?antigravity-bridge-extension'

  - id: antigravity-bridge-package-name
    desc: Antigravity bridge VS Code package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "antigravity-bridge-extension"'

  - id: antigravity-bridge-publisher
    desc: Antigravity bridge VS Code publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "ddarkr"'

  - id: antigravity-bridge-github-repo
    desc: Antigravity Ask Bridge GitHub repository URL
    if:
      type: text
      substr: ddarkr/antigravity-ask

  - id: antigravity-bridge-sdk-dependency
    desc: Antigravity SDK npm dependency declaration
    for: [package.json, json, javascript]
    if:
      type: text
      substr: '"antigravity-sdk"'

composite_rules:
  - id: antigravity-bridge-vscode-extension
    desc: Antigravity Ask Bridge VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: antigravity-bridge-extension-path
      - id: antigravity-bridge-package-name
