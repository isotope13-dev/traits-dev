defaults:
  platforms: [unix, windows]
  for: [archives, javascript, jar, class]
  crit: baseline
  conf: 0.99

traits:
  - id: package-name
    desc: TLA+ VS Code Nightly package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: vscode-tlaplus-nightly

  - id: nightly-vsix
    desc: TLA+ VS Code Nightly extension context
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)alygin\.vscode-tlaplus-nightly-[0-9][^\\/]*\.vsix'
  - id: tlc-output-command
    desc: TLA+ VS Code TLC output command
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: showTlcOutput
  - id: proof-step-source-file
    desc: TLA+ VS Code proof-step source file
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      exact: current-proof-step.js

composite_rules:
  - id: extension-archive-context
    desc: TLA+ VS Code Nightly archive context
    crit: exception
    conf: 0.99
    for: [archives]
    scope: archive
    all:
      - id: package-name
    any:
      - id: nightly-vsix
