# Microsoft React Native Tools VS Code extension (msjsdiag.vscode-react-native).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: React Native Tools official publisher
    if:
      type: text
      substr: '"publisher": "msjsdiag"'

  - id: repository
    desc: React Native Tools official repository
    if:
      type: text
      substr: 'github.com/microsoft/vscode-react-native'

  - id: extension-id-reference
    desc: References msjsdiag.vscode-react-native ID
    if:
      type: text
      substr: 'msjsdiag.vscode-react-native'
