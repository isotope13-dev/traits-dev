# DBDeck — Free database client for VS Code (Juraj Svocak / jurasw).
defaults:
  platforms: [windows, unix]
  for: [package.json, json, vsix-manifest, vsix, zip, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: dbdeck-extension-path
    desc: DBDeck VS Code extension member path
    if:
      type: path
      regex: '(?i)dbdeck\.dbdeck'

  - id: dbdeck-package-name
    desc: DBDeck VS Code extension package name
    for: [package.json, json, vsix-manifest]
    if:
      type: value
      path: name
      exact: dbdeck

  - id: dbdeck-publisher
    desc: DBDeck VS Code extension publisher
    for: [package.json, json, vsix-manifest]
    if:
      type: value
      path: publisher
      exact: dbdeck

  - id: dbdeck-source-repository
    desc: DBDeck official GitHub repository
    for: [package.json, json]
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/jurasw/dbdeck(\.git)?$'

  - id: dbdeck-description
    desc: DBDeck marketplace description text
    for: [package.json]
    if:
      type: text
      substr: 'Free database client for MySQL, PostgreSQL, ClickHouse'

composite_rules:
  - id: package-identity
    desc: Official DBDeck database client package identity
    crit: notable
    conf: 0.99
    all:
      - id: dbdeck-package-name
      - id: dbdeck-publisher
      - id: dbdeck-source-repository

  - id: dbdeck-vscode-extension
    desc: DBDeck database client VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: dbdeck-extension-path
      - id: dbdeck-package-name
