defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: devsense-php-ls-pe-company
    desc: DevSense PHP language server company name
    for: [pe, dll]
    size_min: 10000
    size_max: 500000000
    if:
      type: value
      path: pe.version.company
      exact: Devsense

  - id: devsense-php-ls-pe-product
    desc: DevSense PHP language server product name
    for: [pe, dll]
    size_min: 10000
    size_max: 500000000
    if:
      type: value
      path: pe.version.product_name
      exact: devsense.php.ls

  - id: devsense-php-ls-package-name
    desc: DevSense PHP language server npm package name
    for: [package.json]
    size_min: 10
    size_max: 1000000
    if:
      type: value
      path: name
      regex: '^devsense-php-ls(-.*)?$'

composite_rules:
  - id: devsense-php-ls-binary
    desc: DevSense PHP language server executable
    crit: notable
    conf: 0.98
    for: [pe, dll]
    all:
      - id: devsense-php-ls-pe-company
      - id: devsense-php-ls-pe-product
