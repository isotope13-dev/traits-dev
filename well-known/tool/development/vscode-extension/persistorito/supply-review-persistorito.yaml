defaults:
  platforms: [windows, unix]
  size_min: 1

traits:
  - id: persistorito-publisher-name
    desc: Exact Puglight publisher name
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: Puglight
  - id: persistorito-display-name
    desc: Exact Persistorito display name
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: displayName
      exact: Persistorito
  - id: persistorito-description
    desc: Exact persistence marketing blurb
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: description
      exact: Motivational message extension that adds persistence via startup folder and scheduled tasks on Windows.
  - id: persistorito-task-name
    desc: Exact MotivationalPing task name
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: text
      substr: MotivationalPing
  - id: persistorito-hustle-banner
    desc: Exact persistence lure banner
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: string_literal
      exact: "Your hustle today defines your tomorrow. Stay persistent! 💪"
  - id: persistorito-windows-warning
    desc: Exact Windows-only warning text
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: string_literal
      exact: Persistence features only apply to Windows.
  - id: persistorito-msg-batch-text
    desc: Motivational msg batch text
    crit: notable
    conf: 1.0
    for: [javascript, batch]
    size_min: 1
    if:
      type: text
      substr: msg * "You're amazing. Keep going!"
  - id: persistorito-manifest-identity
    desc: Persistorito manifest identity tuple
    crit: notable
    conf: 1.0
    for: [vsix-manifest]
    if:
      type: text
      regex: Id="persistorito".{0,40}Publisher="Puglight"
  - id: persistorito-manifest-display
    desc: Persistorito manifest display name
    crit: notable
    conf: 1.0
    for: [vsix-manifest]
    if:
      type: text
      substr: <DisplayName>Persistorito</DisplayName>
  - id: persistorito-manifest-description
    desc: Persistorito manifest description
    crit: notable
    conf: 1.0
    for: [vsix-manifest]
    if:
      type: text
      substr: adds persistence via startup folder and scheduled tasks on Windows.

composite_rules:
  - id: persistorito-family
    desc: Persistorito extension manifest
    crit: notable
    conf: 0.999
    all:
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-publisher-name
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-display-name
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-description
      - id: metadata/package/description/function::wildcard-persistence-extension
  - id: persistorito-task-batch-clues
    desc: Persistorito task name and batch text
    crit: notable
    conf: 0.999
    for: [javascript]
    all:
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-task-name
      - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-msg-batch-text
  - id: persistorito-startup-task-messages
    desc: Persistorito startup and task status text
    crit: notable
    conf: 0.999
    for: [javascript]
    all:
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-hustle-banner
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-windows-warning
      - id: micro-behaviors/fs/write/file/startup::javascript-startup-file-created-message
      - id: micro-behaviors/os/autorun/task-registration::javascript-task-created-message
  - id: persistorito-vsixmanifest
    desc: Persistorito VSIX manifest
    crit: notable
    conf: 0.999
    for: [vsix-manifest]
    all:
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-manifest-identity
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-manifest-display
      - id: well-known/tool/development/vscode-extension/persistorito::persistorito-manifest-description
      - id: metadata/package/runtime::vscode-executes-code-property
