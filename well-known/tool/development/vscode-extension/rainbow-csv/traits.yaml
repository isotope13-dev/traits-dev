defaults:
  platforms: [unix, windows]
  for: [vsix, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: official-publisher
    desc: Rainbow CSV publisher Mechatroner
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      regex: '(?i)^mechatroner$'
  - id: vscode-name
    desc: Rainbow CSV VSIX extension name
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      regex: '(?i)^(rainbow-csv|csvrainbow)$'
  - id: display-name
    desc: Rainbow CSV extension display name
    for: [package.json]
    if:
      type: value
      path: displayName
      regex: '(?i)^(rainbow csv|csv rainbow)$'
  - id: upstream-repository
    desc: Rainbow CSV upstream repository link
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^https://github\.com/mechatroner/vscode_rainbow_csv(\.git)?$'
