# Microsoft records this extension identity for impersonation, without a
# version-specific rationale. The package itself describes an upstream fork.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
traits:
  - id: embeddteam-publisher
    desc: Embeddteam extension publisher
    if:
      type: value
      path: publisher
      exact: embeddteam
  - id: embedded-cortex-name
    desc: Embedded Cortex-Debug extension name
    if:
      type: value
      path: name
      exact: embedded-cortex-debug
composite_rules:
  - id: removed-cortex-debug-identity
    desc: Removed Embedded Cortex-Debug identity
    crit: suspicious
    for: [vsix, package.json]
    scope: archive
    all:
      - id: embeddteam-publisher
      - id: embedded-cortex-name
