# Microsoft records this extension identity as impersonation, without giving
# a version-specific behavioral rationale.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: embedd-team-publisher
    desc: Embedd Team extension publisher
    if:
      type: value
      path: publisher
      exact: embedd-team

  - id: project-manager-name
    desc: Embedd Project Manager extension name
    if:
      type: value
      path: name
      exact: embedd-project-manager

composite_rules:
  - id: removed-project-manager-identity
    desc: Removed Embedd Project Manager identity
    crit: suspicious
    for: [vsix, package.json]
    scope: archive
    all:
      - id: embedd-team-publisher
      - id: project-manager-name
