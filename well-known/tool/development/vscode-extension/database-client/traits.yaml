# Database Client (publisher cweijan) — VS Code database and SSH client.
# PostgreSQL Client is the same product shipped as a SKU-specific VSIX.
# SSH newUser net-localgroup is remote host admin, not a UAC bypass.
defaults:
  platforms: [windows, unix]
  for: [javascript, json, zip, vsix]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Database Client extension package name
    for: [json]
    if:
      type: value
      path: name
      exact: vscode-mysql-client2

  - id: package-name-postgresql
    desc: PostgreSQL Client extension package name
    for: [json]
    if:
      type: value
      path: name
      exact: vscode-postgresql-client2

  - id: vsix-id-postgresql
    desc: PostgreSQL Client VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: vscode-postgresql-client2

  - id: ssh-user-command
    desc: Database Client SSH user command
    for: [javascript]
    if:
      type: text
      substr: mysql.ssh.user.new

  - id: telemetry-endpoint
    desc: Database Client telemetry endpoint
    for: [javascript]
    if:
      type: text
      substr: click.database-client.com/telemetry

composite_rules:
  - id: main-extension-bundle
    desc: Database Client main extension bundle
    for: [javascript]
    all:
      - id: ssh-user-command
      - id: telemetry-endpoint

  - id: extension-context
    desc: Database Client VS Code extension context
    any:
      - id: package-name
      - id: package-name-postgresql
      - id: vsix-id-postgresql
      - id: main-extension-bundle
