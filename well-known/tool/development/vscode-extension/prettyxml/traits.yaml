# Pretty XML — PrateekMahendrakar VS Code XML formatter. Bundled
# XmlFormatter.CommandLine.exe is spawned via `dotnet` for formatting;
# that helper PE is product code, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: PrateekMahendrakar VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: PrateekMahendrakar

  - id: package-name
    desc: prettyxml VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: prettyxml

  - id: vsix-id
    desc: prettyxml VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: prettyxml

  - id: vsix-publisher
    desc: PrateekMahendrakar VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: PrateekMahendrakar

  - id: github-repo
    desc: pmahend1 prettyxml GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/pmahend1/prettyxml

composite_rules:
  - id: prettyxml-manifest-identity
    desc: PrateekMahendrakar prettyxml publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: prettyxml-vsix-identity
    desc: PrateekMahendrakar prettyxml VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
