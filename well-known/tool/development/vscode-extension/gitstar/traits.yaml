defaults:
  platforms: [unix, windows]
  for: [vsix, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: gitstar-publisher
    desc: GitstarAI VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      regex: '(?i)^gitstarai$'

  - id: gitstar-extension-name
    desc: Gitstar trending VSIX name
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      regex: '(?i)^top-github-trending$'

  - id: gitstar-repository
    desc: Gitstar trending repository link
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^https://github\.com/gitstarai/top-github-trending-repo-and-people(\.git)?$'
