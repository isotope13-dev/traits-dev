defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
  size_min: 1024
  size_max: 524288000
traits:
  - id: codebuddy-marker
    desc: Tencent Cloud CodeBuddy assistant marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      # The bare product name also appears in generic adapter registries and
      # command-line help. Require the vendor-qualified product marker here;
      # the archive-path atom below covers packaged CodeBuddy applications.
      substr: Tencent Cloud CodeBuddy
  - id: codebuddy-archive-path
    desc: Tencent CodeBuddy VSIX archive path
    crit: notable
    conf: 0.95
    if:
      type: path
      substr: "Tencent-Cloud.coding-copilot"
  - id: tencent-cloud-sdk-bundle-marker
    desc: Tencent Cloud SDK bundled module marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: TENCENTCLOUD_SECRETID
  # The three symbols below are generic library exports (zod's zodPatterns,
  # moment/dayjs's defineLocale, a zip-reading constant), not CodeBuddy
  # inventions: a plain zod consumer matched "CodeBuddy zodPatterns bundle
  # marker". They are bundle-corroboration legs only -- the vendor-qualified
  # codebuddy-marker/codebuddy-archive-path atoms carry identity.
  - id: codebuddy-sig-zip64-marker
    desc: SIG_ZIP64 symbol (CodeBuddy bundle leg)
    crit: component
    for: [javascript]
    if:
      type: text
      word: SIG_ZIP64
  - id: codebuddy-zod-patterns-marker
    desc: zodPatterns symbol (CodeBuddy bundle leg)
    crit: component
    for: [javascript]
    if:
      type: text
      word: zodPatterns
  - id: codebuddy-define-locale-marker
    desc: defineLocale symbol (CodeBuddy bundle leg)
    crit: component
    for: [javascript]
    if:
      type: text
      word: defineLocale
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: objectives/anti-static/obfuscation/string/encoding::js-define-locale-call

composite_rules:
  - id: codebuddy-decoded-vendor-library-bundle
    desc: CodeBuddy decoded vendor library bundle
    crit: component
    conf: 0.9
    for: [javascript]
    any:
      - id: codebuddy-sig-zip64-marker
      - id: codebuddy-zod-patterns-marker
      - id: codebuddy-define-locale-marker
  - id: tencent-codebuddy
    desc: Tencent Cloud CodeBuddy assistant
    crit: notable
    conf: 0.95
    any:
      - id: codebuddy-marker
      - id: codebuddy-archive-path
  - id: tencent-codebuddy-sdk-bundle
    desc: Tencent CodeBuddy bundled Tencent Cloud SDK
    crit: notable
    conf: 0.98
    all:
      - id: tencent-codebuddy
    any:
      - id: tencent-cloud-sdk-bundle-marker
      - id: codebuddy-decoded-vendor-library-bundle
