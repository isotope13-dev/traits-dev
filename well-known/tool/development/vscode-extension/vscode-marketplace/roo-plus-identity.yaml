# Microsoft lists this identity as untrustworthy without a version-specific
# rationale. This identity alone is not evidence of malicious behavior.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
traits:
  - id: roo-plus-foreign-publisher
    desc: Xavier Arosemena extension publisher
    if:
      type: value
      path: publisher
      exact: xavier-arosemena
  - id: roo-plus-extension-name
    desc: Roo Plus extension name
    if:
      type: value
      path: name
      exact: roo-plus
composite_rules:
  - id: removed-roo-plus-identity
    desc: Removed Roo Plus marketplace identity
    for: [vsix, package.json]
    scope: archive
    all:
      - id: roo-plus-foreign-publisher
      - id: roo-plus-extension-name
