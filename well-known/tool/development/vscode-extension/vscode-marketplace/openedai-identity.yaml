# Microsoft lists this publisher/name identity as impersonation; it does not
# identify a version or establish what a particular archive does.
defaults:
  for: [package.json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: openedai-publisher
    desc: OPENEDAI extension publisher
    if:
      type: value
      path: publisher
      exact: OPENEDAI
  - id: openedai-extension-name
    desc: OPENEDAI extension name
    if:
      type: value
      path: name
      exact: OPENEDAI
composite_rules:
  - id: removed-openedai-impersonation
    desc: Removed OPENEDAI impersonation identity
    for: [package.json, vsix]
    crit: suspicious
    scope: archive
    all:
      - id: openedai-publisher
      - id: openedai-extension-name
