# Official Snowflake VS Code extension (publisher snowflake, package snowflake-vsc).
defaults:
  platforms: [unix, windows]
  for: [javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Snowflake VS Code extension package name
    for: [json]
    if:
      type: value
      path: name
      exact: snowflake-vsc
  - id: coco-cli-terminal-install-command
    desc: CoCo install command sent to terminal
    for: [javascript]
    size_max: 20000000
    if:
      type: text
      regex: 'ai\.snowflake\.com/static/cc-scripts/install\.sh.{0,240}sendCommandToTerminal'
