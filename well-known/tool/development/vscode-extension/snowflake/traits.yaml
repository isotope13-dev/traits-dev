# Official Snowflake VS Code extension (publisher snowflake, package snowflake-vsc).
defaults:
  platforms: [unix, windows]
  for: [javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Snowflake VS Code extension package name
    for: [json]
    if:
      type: value
      path: name
      exact: snowflake-vsc
