# Microsoft records this identity for impersonation, without a version-level
# payload claim. The package describes itself as a Material Icon Theme fork.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.99
traits:
  - id: kyledunne-publisher
    desc: Kyle Dunne extension publisher
    if:
      type: value
      path: publisher
      exact: kyledunne
  - id: aios-icon-theme-name
    desc: AIOS Icon Theme extension name
    if:
      type: value
      path: name
      exact: aios-icon-theme
composite_rules:
  - id: removed-aios-icon-theme-identity
    desc: Removed AIOS Icon Theme identity
    crit: suspicious
    for: [vsix, package.json]
    scope: archive
    all:
      - id: kyledunne-publisher
      - id: aios-icon-theme-name
