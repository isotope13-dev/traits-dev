# Microsoft records this exact extension identity as Malware (2025-05-11).
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
# This is an identity-level removal signal. The listing does not establish
# which archive versions contained a payload or what behavior they performed.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
traits:
  - id: sfra-faka-publisher
    desc: SFRA-FAKA extension publisher
    if:
      type: value
      path: publisher
      exact: SFRA-FAKA
  - id: sfra-toolkit-extension-name
    desc: SFRA Toolkit extension name
    if:
      type: value
      path: name
      exact: sfra-toolkit
composite_rules:
  - id: removed-sfra-toolkit-identity
    desc: Removed SFRA Toolkit extension identity
    crit: suspicious
    for: [vsix, vsix-manifest, xml, package.json]
    scope: archive
    all:
      - id: sfra-faka-publisher
      - id: sfra-toolkit-extension-name
      - id: metadata/package/runtime::vscode-executes-code-property
      - id: metadata/permission/activation::on-startup-finished
