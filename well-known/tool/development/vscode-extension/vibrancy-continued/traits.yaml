# Identity of the vscode-vibrancy-continued VS Code extension (publisher
# illixion): applies transparency effects to the workbench. Its Windows
# updater copies refreshed native addon files into the VS Code install
# directory through a consented elevated PowerShell helper (Start-Process
# -Verb RunAs shows the UAC prompt), surfaces failures as user-facing
# messages with its known-errors documentation, and relaunches the editor
# non-elevated. Identity markers below are the marketplace extension ID and
# the project's documentation host, both stable across installs.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.94

traits:
  - id: vibrancy-continued-extension-context
    desc: vscode-vibrancy-continued extension context
    if:
      type: text
      regex: '(?i)illixion\.vscode-vibrancy-continued|github\.com/illixion/vscode-vibrancy-continued'
