# gamunu vscode-yarn — Yarn commands for VS Code. The extension spawns
# the Yarn CLI as product behavior, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: gamunu VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: gamunu

  - id: package-name
    desc: vscode-yarn VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-yarn

  - id: vsix-id
    desc: vscode-yarn VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: vscode-yarn

  - id: vsix-publisher
    desc: gamunu VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: gamunu

  - id: github-repo
    desc: gamunu vscode-yarn GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/gamunu/vscode-yarn

composite_rules:
  - id: vscode-yarn-manifest-identity
    desc: gamunu vscode-yarn publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: vscode-yarn-vsix-identity
    desc: gamunu vscode-yarn VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
