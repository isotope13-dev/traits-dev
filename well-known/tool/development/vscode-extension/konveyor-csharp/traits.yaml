# Konveyor C# — VS Code extension for app migration analysis.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: konveyor-csharp VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: konveyor-csharp

  - id: publisher
    desc: Konveyor VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: konveyor

  - id: vsix-basename
    desc: Konveyor C# VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^konveyor\.konveyor-csharp-.*\.vsix$'

  - id: editor-extensions-repo
    desc: konveyor editor-extensions GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: konveyor/editor-extensions

  - id: analyzer-provider-path
    desc: c-sharp-analyzer-provider bundled CLI path
    for: [javascript, json, archives]
    if:
      type: path
      regex: '(?i)c-sharp-analyzer-provider'

composite_rules:
  - id: konveyor-csharp-extension
    desc: Konveyor C# migration VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: vsix-basename
      - id: editor-extensions-repo
