# WordPress Snippets (wordpress-toolbox) — PHP snippet pack. Bundled
# @vscode/vsce is the publisher packing toolchain, not product code.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: wordpresstoolbox VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: wordpresstoolbox

  - id: package-name
    desc: WordPress Toolbox package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: wordpress-toolbox

  - id: vsix-id
    desc: WordPress Toolbox VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: wordpress-toolbox

  - id: vsix-publisher
    desc: WordPress Toolbox VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: wordpresstoolbox

  - id: github-repo
    desc: vscode-wordpress-toolbox GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: jason-pomerleau/vscode-wordpress-toolbox
