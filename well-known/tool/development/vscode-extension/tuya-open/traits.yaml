# Microsoft records this extension identity as impersonation; the listing does
# not establish what code any specific version contained.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: tuyaopen-publisher
    desc: TuyaOpen extension publisher
    if:
      type: value
      path: publisher
      exact: TuyaOpen

  - id: tuyaopen-ide-name
    desc: TuyaOpen IDE extension name
    if:
      type: value
      path: name
      exact: TuyaOpenIDE

composite_rules:
  - id: removed-ide-identity
    desc: Removed TuyaOpen IDE extension identity
    crit: suspicious
    for: [vsix, package.json]
    scope: archive
    all:
      - id: tuyaopen-publisher
      - id: tuyaopen-ide-name
