# Official Microsoft Azure Load Testing VS Code extension
# (publisher ms-azure-load-testing, id microsoft-testing). Bundled Azure
# Identity / HTTP / terminal spawn is load-test orchestration, not C2.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: Azure Load Testing VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ms-azure-load-testing

  - id: package-name
    desc: Azure Load Testing package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: microsoft-testing

  - id: vsix-id
    desc: Azure Load Testing VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: microsoft-testing

  - id: vsix-publisher
    desc: Azure Load Testing VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: ms-azure-load-testing

  - id: github-repo
    desc: Azure Load Testing GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/microsoft/azureloadtesting-extension
