defaults:
  platforms: [unix, windows]
  for: [javascript, json]
traits:
  - id: nodemailer-package-reference
    desc: Nodemailer import in send-mail wrapper
    crit: notable
    conf: 0.95
    for: [javascript, typescript, json, package.json]
    if:
      type: text
      regex: '(?i)\b(from|require)\b.{0,24}nodemailer|nodemailer.{0,24}:'
    unless:
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
  - id: action-pack-send-mail-package
    desc: action-pack-send-mail package marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: action-pack-send-mail
  # The bare "imports nodemailer" atom lives in well-known/lib/network/nodemailer now:
  # it identifies the library, not this action. Only the pairing with the
  # action's SMTP input fields identifies the wrapper.
composite_rules:
  - id: nodemailer-action-inputs
    desc: Nodemailer GitHub Action inputs
    crit: notable
    conf: 0.95
    all:
      - id: nodemailer-package-reference
      - id: micro-behaviors/communications/email/send/smtp::smtp-connection-input-field
  - id: github-action-send-mail-context
    desc: GitHub Action send-mail wrapper
    crit: notable
    conf: 0.96
    all:
      - id: nodemailer-action-inputs
    any:
      - id: action-pack-send-mail-package
      - id: metadata/library/github-actions::actions-sdk
