# oclif (oclif/core) — Heroku/Salesforce CLI framework.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 200000

traits:
  - id: oclif-core-package-name
    desc: oclif core npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@oclif/core'

  - id: oclif-core-npm-archive
    desc: oclif core npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@oclif/core'

  - id: oclif-core-github-repo
    desc: oclif core GitHub repository
    if:
      type: text
      substr: github.com/oclif/core
