# Pester — PowerShell BDD/TDD testing and mocking framework.
# Mock bootstrap, module-scoped scriptblock invoke (`& ($module)
# $ScriptBlock`), and hashtable parameter rewrite are product test
# machinery, not a staged eval loader. Identity only.
defaults:
  platforms: [unix, windows]
  for: [nupkg, powershell, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: nuget-package-id
    desc: Pester NuGet package id
    for: [nupkg]
    if:
      type: value
      path: nupkg.id
      exact: Pester

  - id: github-repo
    desc: pester/Pester GitHub repository
    if:
      type: text
      substr: github.com/pester/Pester
      case_insensitive: true

  - id: module-guid
    desc: Pester PowerShell module GUID
    for: [powershell, text]
    if:
      type: text
      substr: a699dea5-2c73-4616-a270-1f7abb777e71

  - id: root-module
    desc: Pester.psm1 RootModule declaration
    for: [powershell, text]
    if:
      type: text
      substr: "RootModule        = 'Pester.psm1'"

composite_rules:
  - id: pester-testing-framework
    desc: Pester PowerShell testing framework
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: nuget-package-id
      - id: github-repo
      - id: module-guid
      - id: root-module
