# Nx (nrwl/nx) generated library manifests ship a stub test script that
# tells developers to run tests from the workspace root.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 4096

traits:
  - id: nx-root-test-script
    desc: Nx generated root-test script
    if:
      type: value
      path: scripts.test
      exact: 'echo "Error: run tests from root" && exit 1'
