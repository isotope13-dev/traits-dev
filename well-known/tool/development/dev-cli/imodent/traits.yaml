# imodent — code-intelligence CLI (fix/scan Python, JSON, YAML, Rust).
# subprocess to ruff/clippy is the lint oracle, not a dropper.
# Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: imodent PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: imodent

  - id: package-metadata-name
    desc: imodent PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*imodent\s*$'

  - id: console-entry
    desc: imodent console-script entry point
    for: [text]
    if:
      type: text
      substr: 'imodent = imodent.cli:main'

  - id: lint-oracle-unavailable
    desc: imodent lint oracle unavailable finding
    for: [python, text]
    if:
      type: text
      substr: lint_oracle_unavailable

composite_rules:
  - id: imodent-package
    desc: imodent code-intelligence CLI package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: console-entry
      - id: lint-oracle-unavailable
    needs: 2
