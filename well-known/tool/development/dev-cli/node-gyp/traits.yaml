defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: component
  conf: 0.98

traits:
  - id: node-gyp-main-basename
    desc: node-gyp main module basename
    for: [javascript]
    if:
      type: basename
      exact: node-gyp.js
  - id: node-gyp-usage-banner
    desc: node-gyp usage banner
    for: [javascript]
    if:
      type: text
      substr: 'Usage: node-gyp <command> [options]'
  - id: node-gyp-config-env-prefix
    desc: node-gyp npm config environment prefix
    for: [javascript]
    if:
      type: text
      substr: npm_package_config_node_gyp_
  - id: node-gyp-pre-nodedir-error
    desc: node-gyp prerelease nodedir install error
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: '"pre" versions of node cannot be installed, use the --nodedir flag instead'
  - id: package-name
    desc: node-gyp npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: node-gyp
  - id: vendored-path
    desc: vendored node-gyp npm package path
    crit: notable
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/node-gyp/'

composite_rules:
  - id: node-gyp-main-module
    desc: node-gyp main module
    crit: notable
    conf: 0.99
    all:
      - id: node-gyp-main-basename
    any:
      - id: node-gyp-usage-banner
      - id: node-gyp-config-env-prefix
  - id: node-gyp-package
    desc: node-gyp native addon build tool
    crit: notable
    conf: 0.99
    any:
      - id: node-gyp-pre-nodedir-error
      - id: package-name
      - id: vendored-path
