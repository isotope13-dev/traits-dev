# @guanghechen kits (https://github.com/guanghechen). kit-paste is a clipboard
# paste CLI; published builds set ROLLUP_OBFUSCATE=true and ship obfuscator
# output under lib/esm/.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 5000000

traits:
  - id: kit-paste-package-name
    desc: Guanghechen kit-paste package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@guanghechen/kit-paste'

  - id: kit-paste-npm-archive
    desc: Guanghechen kit-paste npm archive
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@guanghechen/kit-paste'

  - id: commander-import
    desc: Guanghechen commander import specifier
    for: [javascript]
    if:
      type: text
      substr: '@guanghechen/commander'

  - id: reporter-import
    desc: Guanghechen reporter import specifier
    for: [javascript]
    if:
      type: text
      substr: '@guanghechen/reporter'

  - id: kit-package-name
    desc: Guanghechen kit meta-package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@guanghechen/kit'

  - id: command-name-export
    desc: Named COMMAND_NAME module export
    for: [javascript]
    if:
      type: text
      regex: '\bas COMMAND_NAME\b'

composite_rules:
  - id: obfuscated-cli
    desc: Guanghechen obfuscated commander CLI
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
    any:
      - id: commander-import
      - id: command-name-export
