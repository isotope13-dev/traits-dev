# envinfo — tabrindle environment-info CLI for debugging.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: envinfo npm package name
    if:
      type: value
      path: name
      exact: envinfo

  - id: repository
    desc: envinfo source repository
    if:
      type: value
      path: repository
      exact: https://github.com/tabrindle/envinfo

composite_rules:
  - id: envinfo-package
    desc: envinfo environment-info CLI
    all:
      - id: package-name
      - id: repository
