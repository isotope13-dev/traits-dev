# envinfo — tabrindle environment-info CLI for debugging.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: envinfo npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: envinfo

  - id: repository
    desc: envinfo source repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: https://github.com/tabrindle/envinfo

  - id: vendored-path
    desc: vendored envinfo npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/envinfo/'

composite_rules:
  - id: envinfo-package
    desc: envinfo environment-info CLI
    any:
      - id: vendored-path
      - id: package-name
