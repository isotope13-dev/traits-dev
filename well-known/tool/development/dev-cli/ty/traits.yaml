# Astral ty — Rust Python type checker shipped as a wheel plus native
# binary. ARM execve/dup2 are Rust libc wrappers, not a shell backdoor.
# Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: github-repo
    desc: astral-sh/ty GitHub repository
    for: [pkginfo, markdown]
    if:
      type: text
      substr: github.com/astral-sh/ty

  - id: find-ty-bin
    desc: ty binary locator helper function
    for: [python]
    if:
      type: text
      substr: 'def find_ty_bin()'

  - id: ty-not-found
    desc: ty binary missing FileNotFoundError
    for: [python]
    if:
      type: text
      substr: 'class TyNotFound(FileNotFoundError)'

  - id: find-ty-module-path
    desc: ty _find_ty helper module path
    for: [python, whl]
    if:
      type: path
      regex: 'ty[\\/]_find_ty\.py$'

composite_rules:
  - id: astral-ty-package
    desc: Astral ty Python type checker
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: github-repo
      - id: find-ty-bin
      - id: ty-not-found
      - id: find-ty-module-path
    needs: 2
