# Identity for Zed's native remote server, which legitimately combines
# networking, process management, credential APIs, and debugging support.
# The identity is anchored on the server protocol banner and matching PDB
# basename rather than on generic capabilities.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.98
  size_min: 10000000
  size_max: 250000000

traits:
  - id: zed-server-protocol-banner
    desc: Zed remote-server protocol banner
    if:
      type: hex
      section: .rdata
      pattern: '5a 65 64 2d 53 65 72 76 65 72 2f'
  - id: zed-remote-server-pdb
    desc: Zed remote-server PDB basename
    for: [pe]
    platforms: [windows]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: remote_server.pdb

composite_rules:
  - id: zed-remote-server
    desc: Zed editor remote server
    crit: notable
    conf: 0.99
    all:
      - id: zed-server-protocol-banner
      - id: zed-remote-server-pdb
