defaults:
  platforms: [macos]
  for: [macho]
  size_min: 1000000
  size_max: 500000000

traits:
  - id: team-id
    desc: Zed Industries signing team identifier
    crit: notable
    conf: 1.0
    if:
      type: value
      path: macho.code_signature.team_id
      exact: MQ55VZLNZQ
  - id: bundle-member-id
    desc: Zed bundle member signature identifier
    crit: notable
    conf: 1.0
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^(dev\.zed\.Zed|cli|git)$'

composite_rules:
  - id: official-signed-member
    desc: Official Zed signed bundle member
    crit: exception
    conf: 1.0
    all:
      - id: team-id
      - id: bundle-member-id
