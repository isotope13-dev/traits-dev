defaults:
  platforms: [unix, windows]

# Generated Cython source retains the original notebook implementation and
# its string table. Those strings include the normal base64 transport used to
# send user code to a child kernel; they are not an encoded package payload.
traits:
  - id: cython-notebook-source-marker
    desc: Cython-generated notebook source marker
    crit: notable
    conf: 0.97
    for: [c]
    if:
      type: text
      regex: 'routes/notebook\.py|"routes/notebook\.py"'
  - id: cython-notebook-code-b64encode
    desc: Notebook code base64-encode marker
    crit: notable
    conf: 0.97
    for: [c]
    if:
      type: text
      regex: 'code_b64\s*=\s*base64\.b64encode'
  - id: cython-notebook-safe-code-exec
    desc: Notebook safe-code exec wrapper
    crit: notable
    conf: 0.97
    for: [c]
    if:
      type: text
      regex: 'safe_code\s*=\s*f.{0,40}exec\(__import__'
  # There is deliberately no `terminal.js` basename atom here. It matched on
  # filename alone — a generic capability that does not belong in
  # well-known/ — and announced "Web IDE terminal frontend path" on every
  # unrelated file with that name, including node-pty's own terminal.js. The
  # ensurepip + pip-install pair below is the actual benign discriminator.
  - id: embedded-python-ensurepip
    desc: Embedded Python ensurepip bootstrap
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: ensurepip
  - id: embedded-python-pip-install
    desc: Embedded Python pip install bootstrap
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'pip\s+install'

composite_rules:
  - id: cython-notebook-kernel-source-context
    desc: Cython notebook kernel code transport context
    crit: exception
    conf: 0.99
    for: [c]
    all:
      - id: cython-notebook-source-marker
      - id: cython-notebook-code-b64encode
      - id: cython-notebook-safe-code-exec
      - id: micro-behaviors/data/decode/base64-native::c-b64decode-reference
  - id: web-ide-terminal-python-bootstrap-context
    desc: Web IDE terminal Python dependency bootstrap
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: embedded-python-ensurepip
      - id: embedded-python-pip-install
