defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, conda, data]
  crit: notable
  conf: 0.98

traits:
  - id: official-pnpm-package-name
    desc: Official pnpm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pnpm

  - id: network-ca-file-package-name
    desc: Official pnpm CA-file package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@pnpm/network.ca-file'

  - id: config-env-replace-package-name
    desc: Official pnpm env-replace package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@pnpm/config.env-replace'

  - id: network-ca-file-package-member
    desc: Official pnpm CA-file package member
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@pnpm/network.ca-file/'

  - id: config-env-replace-package-member
    desc: Official pnpm env-replace package member
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@pnpm/config.env-replace/'

  - id: read-ca-file-sync-export
    desc: pnpm readCAFileSync CA PEM splitter
    for: [javascript, typescript]
    if:
      type: text
      substr: 'exports.readCAFileSync = readCAFileSync'

  - id: env-replace-export
    desc: pnpm envReplace config interpolator
    for: [javascript, typescript]
    if:
      type: text
      substr: 'exports.envReplace = envReplace'

  - id: conda-package-basename
    desc: pnpm conda package basename
    for: [conda]
    if:
      type: path
      basename: true
      regex: '(?i)^pnpm-[0-9][A-Za-z0-9._-]*\.conda$'

composite_rules:
  - id: pnpm-ca-file-library
    desc: pnpm network.ca-file PEM reader
    needs: 2
    any:
      - id: network-ca-file-package-name
      - id: network-ca-file-package-member
      - id: read-ca-file-sync-export

  - id: pnpm-env-replace-library
    desc: pnpm config.env-replace interpolator
    needs: 2
    any:
      - id: config-env-replace-package-name
      - id: config-env-replace-package-member
      - id: env-replace-export

  - id: official-pnpm-package-archive
    desc: Official pnpm package archive identity
    crit: notable
    conf: 0.98
    for: [archives, conda]
    scope: archive
    all:
      - id: official-pnpm-package-name
      - id: metadata/package/files/included::package-json-basename
