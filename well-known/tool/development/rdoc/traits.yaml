# RDoc, Ruby's standard documentation generator, as shipped in the rdoc gem.
#
# Like yard, RDoc plugs itself into RubyGems from lib/rubygems_plugin.rb — the
# entry point RubyGems auto-requires out of every installed gem — registering
# `Gem.done_installing` to build a freshly installed gem's documentation and
# `Gem.pre_uninstall` to delete it again. The hook traits in
# objectives/supply-chain/install-hook/package/rubygems/ look for a gem that
# runs its own code across the install boundary; a documentation generator
# cleaning up the docs it produced is not that.
#
# Two markers, matching the sibling rubygems-own-library-file and
# well-known/tool/development/yard patterns, so a hostile gem cannot disarm the
# hook trait by copying one line: the relative require of RDoc's own hook
# implementation and the bound handler must both be present.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95

traits:
  - id: rubygems-hook-require
    desc: RDoc requires its own RubyGems hook
    if:
      type: text
      regex: 'require_relative\s+[''"]rdoc/rubygems_hook[''"]'

  - id: rubygems-hook-handler-binding
    desc: RDoc binds its RubyGems hook handler
    if:
      type: text
      substr: 'RDoc::RubyGemsHook.method'

composite_rules:
  - id: rubygems-doc-hook-file
    desc: File is RDoc's RubyGems documentation hook
    crit: exception
    conf: 0.97
    all:
      - id: rubygems-hook-require
      - id: rubygems-hook-handler-binding
