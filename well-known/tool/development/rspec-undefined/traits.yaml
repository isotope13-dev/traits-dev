# rspec-undefined — RSpec extension for marking undefined specs.
defaults:
  platforms: [windows, unix]
  for: [gem, ruby, tar, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: rspec-undefined-module
    desc: RSpec Undefined extension module
    for: [ruby, text]
    if:
      type: text
      regex: 'module\s+RSpec::Undefined\b'

  - id: be-undefined-matcher
    desc: RSpec be_undefined matcher reference
    for: [ruby, text]
    if:
      type: text
      substr: be_undefined

  - id: rspec-undefined-github-repo
    desc: tomoyukiinoue/rspec-undefined repository URL
    if:
      type: text
      substr: tomoyukiinoue/rspec-undefined

composite_rules:
  - id: rspec-undefined-gem
    desc: rspec-undefined RSpec undefined-spec matcher gem
    crit: notable
    conf: 0.97
    any:
      - id: rspec-undefined-module
      - id: be-undefined-matcher
      - id: rspec-undefined-github-repo
