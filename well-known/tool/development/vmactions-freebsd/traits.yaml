# vmactions/freebsd is a GitHub Action that boots a temporary FreeBSD VM,
# installs a job-local SSH key for that VM, and runs the caller's CI commands
# through SSH.  The authorized_keys write is VM bootstrap, not persistence in
# the runner, so this identity is used as a narrow benign context for those
# objective matchers.
defaults:
  platforms: [unix, windows]
  for: [gz, package.json, javascript, typescript, github-actions, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: package-name
    desc: vmactions FreeBSD VM Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vmactions-freebsd

  - id: repository-url
    desc: vmactions FreeBSD Action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/vmactions/freebsd([.]git)?$'

  - id: package-member-name
    desc: vmactions FreeBSD Action member package identity
    for: [javascript, typescript, github-actions]
    if:
      type: value
      path: package.json::name
      exact: vmactions-freebsd

  - id: action-package-path
    desc: vmactions FreeBSD Action source path
    for: [gz, package.json, javascript, typescript, github-actions]
    if:
      type: path
      basename: true
      regex: '(?i)^freebsd-vm-[0-9]'

  - id: freebsd-builder-release-url
    desc: Official vmactions FreeBSD builder release URL
    for: [javascript, typescript]
    if:
      type: text
      substr: 'github.com/vmactions/freebsd-builder/releases/download/'

composite_rules:
  - id: vmactions-freebsd-context
    desc: Recognized vmactions FreeBSD VM GitHub Action
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: repository-url
      - id: package-member-name
      - id: action-package-path
      - id: freebsd-builder-release-url
