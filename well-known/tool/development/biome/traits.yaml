defaults:
  platforms: [unix, windows]

traits:
  - id: parser-source-path
    desc: Biome JavaScript parser source path
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: path
      regex: '(^|[\\/])biome_js_parser[\\/]'
  - id: empty-strings-depth-fixture
    desc: Biome empty-string depth fixture
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: basename
      exact: 'many_empty_strings.js'

composite_rules:
  - id: parser-depth-fixture-context
    desc: Recognized Biome parser depth fixture
    crit: exception
    conf: 0.99
    all:
      - id: parser-source-path
      - id: empty-strings-depth-fixture
