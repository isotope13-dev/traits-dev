# Identity signals for the official Upsun CLI Go binary.
# These are also used as benign context for generic binary heuristics whose
# source strings are ordinary parts of the CLI's PHP/container management.
defaults:
  platforms: [windows, unix]
  for: [pe]
  size_min: 1000000
  size_max: 200000000

traits:
  - id: go-module
    desc: Upsun CLI Go module identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/upsun/cli

  - id: platform-command
    desc: Upsun CLI platform command entry point
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.go.path
      exact: github.com/upsun/cli/cmd/platform

composite_rules:
  - id: upsun-cli-context
    desc: Official Upsun CLI binary context
    crit: exception
    conf: 0.99
    all:
      - id: go-module
      - id: platform-command
