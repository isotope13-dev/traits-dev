defaults:
  platforms: [windows]
  for: [archive, batch, powershell]
  size_max: 2147483648

traits:
  - id: release-path
    desc: Cmder release archive or script
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[\\/])cmder\.7z$'

composite_rules:
  - id: vendor-member
    desc: Cmder bundled vendor member
    crit: notable
    conf: 0.96
    all:
      - id: release-path
      - id: metadata/package/files/dependency::vendored-source-path
