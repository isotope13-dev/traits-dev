# gosec is the standard Go security checker. Its documented install path is
# fetching install.sh from the project's own raw.githubusercontent URL and
# piping it to sh, so build recipes across the ecosystem carry this URL.
# The trait identifies that upstream installer, not any one project using it.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: gosec-official-installer-url
    desc: Official gosec installer URL
    for: [shell, dockerfile]
    if:
      type: text
      substr: raw.githubusercontent.com/securego/gosec/master/install.sh
