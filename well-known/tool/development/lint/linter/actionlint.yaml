# actionlint is a static checker for GitHub Actions workflow files (rhysd/actionlint).
# Its documented install path fetches download-actionlint.bash from the project's
# raw.githubusercontent URL and pipes it to bash.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: actionlint-official-installer-url
    desc: Official actionlint installer script URL
    for: [shell, dockerfile, package.json, javascript, typescript]
    if:
      type: text
      substr: raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash

  - id: actionlint-download-pipe-script
    desc: actionlint download script pipes to bash
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: 'raw\.githubusercontent\.com/rhysd/actionlint/[^\n|]{0,80}\|\s*bash'

  - id: actionlint-source-archive
    desc: actionlint Go module source archive
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/rhysd/actionlint@[^/]+/go\.mod$'

  - id: actionlint-testdata-fixture-member
    desc: actionlint test fixture archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/rhysd/actionlint@[^/]+/testdata/'

  - id: actionlint-official-installer-script
    desc: Official actionlint installer script
    for: [shell]
    if:
      type: text
      substr: actionlint_${version}_${os}_${arch}

  - id: actionlint-playground-url
    desc: actionlint web playground URL
    for: [markdown, text, documents]
    if:
      type: text
      substr: rhysd.github.io/actionlint#

  - id: actionlint-workflow-error-annotation
    desc: actionlint workflow error expectation annotation
    for: [github-actions, markdown, text]
    if:
      type: text
      regex: '#\s*ERROR:\s*[\w.`''"-]'
