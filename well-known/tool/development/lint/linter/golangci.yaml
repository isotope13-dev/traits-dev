# golangci-lint is the standard aggregating Go linter. Its documented install
# path is fetching install.sh from the project's own raw.githubusercontent URL
# and piping it to sh, so build recipes across the ecosystem carry this URL.
# The trait identifies that upstream installer, not any one project using it.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: golangci-official-installer-url
    desc: Official golangci-lint installer URL
    for: [shell, dockerfile, package.json, javascript, typescript]
    if:
      type: text
      substr: raw.githubusercontent.com/golangci/golangci-lint/master/install.sh

  # Makefiles keep the repository URL in a variable (`URL=https://raw...`) and
  # the pipe elsewhere (`curl -sfL $$URL/$$VERSION/install.sh | sh`), so the
  # full installer URL never appears on one line.
  - id: golangci-raw-repo-url
    desc: golangci-lint raw repository URL
    for: [makefile]
    if:
      type: text
      substr: raw.githubusercontent.com/golangci/golangci-lint

  - id: golangci-download-pipe-script
    desc: golangci-lint download script pipes to sh
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: 'raw\.githubusercontent\.com/golangci/golangci-lint/[^\n|]{0,80}\|\s*(sh|bash)'
