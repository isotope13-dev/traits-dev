# Astral's ruff is a Rust Python linter. Like other Rust toolchains it links
# mprotect and ships a panic::install_hook symbol that must not be read as
# Detours-style inline API hooking.
defaults:
  platforms: [unix]
  for: [elf]
  size_min: 1000000
  size_max: 100000000

traits:
  - id: ruff-binary-basename
    desc: ruff linter binary basename
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: ruff

  - id: ruff-package-name
    desc: ruff ELF package self-name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: elf.package.name
      exact: ruff

composite_rules:
  - id: ruff-binary
    desc: Astral ruff Python linter binary
    crit: notable
    conf: 0.99
    all:
      - id: ruff-binary-basename
      - id: ruff-package-name
