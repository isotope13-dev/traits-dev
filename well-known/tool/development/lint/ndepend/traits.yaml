# NDepend is a static analysis and code metrics tool for .NET.
# Its analysis engine (NDepend.Framework, NDepend.Platform.DotNet, NDepend.UI)
# computes code metrics, dependency matrices, and visual charts.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 524288000

traits:
  - id: ndepend-company-name
    desc: NDepend vendor Smacchia version information
    if:
      type: value
      path: pe.version.company
      regex: '(?i)SMACCHIA\.COM'

  - id: ndepend-product-name
    desc: NDepend product name in version resource
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bNDepend\b'

composite_rules:
  - id: ndepend-binary
    desc: NDepend .NET static analysis assembly
    conf: 0.99
    all:
      - id: ndepend-company-name
      - id: ndepend-product-name
