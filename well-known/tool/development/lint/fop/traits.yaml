# FOP (Filter Orderer and Preener) — adblock filter list sorting, preening, and linting tool.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: fop-cli-binary
    desc: FOP (Filter Orderer and Preener) executable
    for: [binaries]
    size_min: 100000
    size_max: 50000000
    if:
      type: text
      substr: "fop_sort.rs"

  - id: fop-python-script
    desc: FOP (Filter Orderer and Preener) Python script
    for: [python]
    size_min: 1000
    size_max: 500000
    if:
      type: text
      substr: "Filter Orderer and Preener"

composite_rules:
  - id: fop-tool
    desc: FOP (Filter Orderer and Preener) adblock list maintenance tool
    crit: notable
    conf: 0.98
    any:
      - id: fop-cli-binary
      - id: fop-python-script
