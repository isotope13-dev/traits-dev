# CLI application paths discriminate Oxlint from the shared Oxc parser library.
# This identity is not used to suppress any capability or credential finding.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  size_min: 1000000
traits:
  - id: cli-source-path
    desc: Oxlint CLI application source path
    conf: 0.98
    if:
      type: text
      regex: 'apps/oxlint/src/(lint|runner|main)\.rs'
      section: rodata
