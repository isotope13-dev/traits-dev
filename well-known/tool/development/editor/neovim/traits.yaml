defaults:
  platforms: [unix, windows]
  for: [lua, text, zip]
  crit: notable
  conf: 0.97
  size_max: 536870912

traits:
  - id: runtime-tree
    desc: Neovim runtime tree
    if:
      type: path
      regex: 'nvim[\\/]runtime'

  - id: windows-runtime-archive
    desc: Neovim Windows runtime archive
    if:
      type: path
      basename: true
      regex: '^nvim-win-[^\\/]*\.zip$'

  # The compiled editor. `nvim` embeds its whole Lua runtime -- netrw's
  # ssh/scp/netrc handling, gitconfig discovery, the filetype tables -- as
  # string data, so identity-file and path rules read the editor's knowledge
  # of those files as a sweep of them. The runtime-tree marker above only
  # matches an unpacked `nvim/runtime` directory, never the binary.
  - id: nvim-executable-basename
    desc: Neovim executable basename
    crit: notable
    for: [elf, macho, pe]
    size_min: 500000
    size_max: 200000000
    if:
      type: basename
      regex: '^nvim(\.exe)?$'

  - id: nvim-version-banner
    desc: Neovim version banner string
    crit: notable
    for: [elf, macho, pe]
    size_min: 500000
    size_max: 200000000
    if:
      type: text
      regex: 'NVIM v[0-9]+\.[0-9]+'
      section: rdata

composite_rules:
  - id: nvim-executable
    for: [lua, text, zip, elf, macho, pe]
    desc: Neovim editor executable
    crit: notable
    conf: 0.99
    all:
      - id: nvim-executable-basename
      - id: nvim-version-banner

  - id: runtime-code
    desc: Neovim runtime code
    crit: notable
    conf: 0.98
    any:
      - id: runtime-tree
      - id: windows-runtime-archive
