# ghostwriter/collection — PHP Collection library with dev PHAR tools.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, json, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: composer-package-name
    desc: ghostwriter/collection Composer package name
    for: [json, text]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"ghostwriter/collection"'

  - id: ghostwriter-github-repo
    desc: ghostwriter/collection GitHub repository URL
    if:
      type: text
      substr: ghostwriter/collection

  - id: collection-namespace
    desc: Ghostwriter Collection PHP namespace
    for: [php]
    if:
      type: text
      substr: Ghostwriter\\Collection

composite_rules:
  - id: ghostwriter-collection-package
    desc: ghostwriter/collection PHP library package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: composer-package-name
    any:
      - id: ghostwriter-github-repo
      - id: collection-namespace
