defaults:
  conf: 0.99
  platforms: [windows, macos, linux]
  for: [json]

traits:
  - id: vscodium-scoped-package-name
    desc: Official @vscodium scoped package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@vscodium/'

  - id: vscodium-npm-scoped-name
    desc: Official @vscodium npm archive identity
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@vscodium/'

  - id: vscodium-github-repository-url
    desc: VSCodium GitHub repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]vscodium/'

  - id: vscodium-npm-github-repository
    desc: VSCodium npm archive repository URL
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]vscodium/'

  - id: product-name
    desc: VSCodium product manifest name
    crit: notable
    if:
      type: value
      path: nameLong
      exact: VSCodium

  - id: official-license-url
    desc: Official VSCodium license URL
    crit: notable
    if:
      type: value
      path: licenseUrl
      exact: https://github.com/VSCodium/vscodium/blob/master/LICENSE

  - id: vscodium-core-bundle-path
    desc: VSCodium editor core bundle path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      case_insensitive: true
      regex: 'VSCodium\.app.{0,64}app[/\\]out[/\\]vs'

  - id: vscodium-distribution-basename
    desc: VSCodium distribution artifact basename
    crit: notable
    # Official builds ship as platform packages, archives, installers, and
    # AppImages. Keep this explicit list at the basename matcher's type cap.
    for: [zip, tar, deb, rpm, dmg, pe, elf]
    size_min: 1000000
    size_max: 2000000000
    if:
      type: basename
      case_insensitive: true
      regex: '^VSCodium(Setup|[-_.])'

composite_rules:
  - id: product-identity
    desc: VSCodium product.json identity pair
    crit: notable
    all:
      - id: product-name
      - id: official-license-url

  - id: archive-context
    for: [json, zip, tar, deb, rpm, dmg, pe, elf]
    desc: Recognized VSCodium distribution artifact
    crit: exception
    scope: outer
    any:
      - id: product-identity
      - id: vscodium-distribution-basename

  - id: vscodium-npm-package-context
    desc: Recognized @vscodium npm package
    crit: exception
    for: [package.json, npm]
    scope: archive
    any:
      - id: vscodium-scoped-package-name
      - id: vscodium-npm-scoped-name
