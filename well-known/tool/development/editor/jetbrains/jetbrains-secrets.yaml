defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: jetbrains-secrets
  size_min: 1
  desc: JetBrains credential token or secret reference
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    regex: \\bjetbrains\\b.{0,20}\\b(token|password|secret)\\b
    case_insensitive: true
