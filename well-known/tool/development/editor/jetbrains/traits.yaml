defaults:
  size_max: 52428800
  platforms: [windows, unix]
  for: [pe, elf, macho, json]
traits:
  - id: jetbrains-company-string
    desc: JetBrains company string
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: JetBrains s.r.o.
      section: rsrc
  - id: jetbrains-version-company
    desc: JetBrains PE version company
    crit: baseline
    conf: 0.98
    for: [pe]
    if:
      type: value
      path: pe.version.company
      regex: '^JetBrains( s\.r\.o\.)?$'
  - id: jetbrains-product-info
    desc: JetBrains product descriptor
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: product-info.json
      section: .text
  - id: rider-product-string
    desc: JetBrains Rider product string
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: text
      exact: JetBrains Rider
      section: rdata
  - id: rider64-filename-string
    desc: rider64.exe filename string
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: text
      exact: rider64.exe
      section: rdata
  - id: jetbrains-rights-string
    desc: JetBrains company rights string
    crit: notable
    conf: 0.96
    for: [pe]
    if:
      type: text
      regex: JetBrains s\.r\.o\. 20\d{2}\. All rights reserved\.
      section: rdata
  - id: debugger-worker-binary
    desc: JetBrains debugger worker binary
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^JetBrains\.Debugger\.Worker(\.exe)?$'
  # JetBrains' PhpStorm stub corpus: PHP files that declare signatures and
  # PHPDoc for an extension and nothing else, so an IDE can autocomplete it.
  # They carry no implementation, and the option arrays in their doc comments
  # are documentation rather than configuration -- phpredis' Redis.php shows
  # `'ssl' => ['verify_peer' => false]` in a comment illustrating the connect()
  # options, which scored as a PHP TLS-validation bypass in every crate that
  # vendors the corpus (mir-analyzer does).
  #
  # Two markers because neither covers the corpus alone: only about a quarter
  # of the 631 stub files import the JetBrains attribute namespace, and the
  # directory name is only visible when the tree is vendored intact.
  - id: phpstorm-stub-namespace
    desc: PhpStorm stub attribute namespace
    crit: notable
    conf: 0.97
    for: [php]
    if:
      type: text
      substr: 'JetBrains\PhpStorm'
  - id: phpstorm-stubs-tree-path
    desc: PhpStorm stubs corpus path
    crit: notable
    conf: 0.95
    for: [php]
    if:
      type: path
      regex: '(^|/)phpstorm-stubs/'

composite_rules:
  - id: jetbrains-binary
    desc: Binary from JetBrains
    crit: notable
    conf: 0.98
    any:
      - id: well-known/tool/development/editor/jetbrains::jetbrains-company-string
      - id: well-known/tool/development/editor/jetbrains::jetbrains-version-company
      - id: well-known/tool/development/editor/jetbrains::jetbrains-product-info
  - id: signed-jetbrains-binary
    for: [pe]
    desc: Verified JetBrains-signed PE
    crit: notable
    conf: 0.99
    all:
      - id: well-known/tool/development/editor/jetbrains::jetbrains-binary
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
    any:
      - id: metadata/signed/developer::jetbrains-s.r.o.
      - id: metadata/signed/leaf::jetbrains-s.r.o.
  - id: rider-version-identity
    desc: JetBrains Rider version identity
    crit: suspicious
    conf: 0.97
    for: [pe]
    all:
      - id: well-known/tool/development/editor/jetbrains::rider-product-string
      - id: well-known/tool/development/editor/jetbrains::rider64-filename-string
    any:
      - id: well-known/tool/development/editor/jetbrains::jetbrains-company-string
      - id: well-known/tool/development/editor/jetbrains::jetbrains-rights-string
    near_bytes: 512
