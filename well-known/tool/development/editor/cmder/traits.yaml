defaults:
  crit: notable
  conf: 0.96
  platforms: [windows]
  for: [7z, batch, powershell]
  size_max: 2147483648

traits:
  - id: release-path
    desc: Cmder release archive or script
    if:
      type: path
      regex: '(?i)(^|[\\/])cmder\.7z$'

composite_rules:
  - id: vendor-member
    desc: Cmder bundled vendor member
    all:
      - id: release-path
      - id: metadata/package/files/dependency::vendored-source-path
