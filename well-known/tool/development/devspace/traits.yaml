# Loft DevSpace Kubernetes development container tooling.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95

traits:
  - id: devspace-start-script-name
    desc: DevSpace container startup script filename
    if:
      type: basename
      exact: devspace_start.sh

  - id: devspace-enter-command
    desc: DevSpace enter shell command
    if:
      type: text
      substr: "devspace enter "

  - id: devspace-welcome-banner
    desc: DevSpace container welcome banner
    if:
      type: text
      substr: "Welcome to your development container!"

  - id: devspace-yaml-config
    desc: DevSpace configuration file
    for: [yaml]
    if:
      type: basename
      exact: devspace.yaml

composite_rules:
  - id: devspace-dev-container-context
    desc: DevSpace container startup context
    crit: exception
    any:
      - id: devspace-start-script-name
      - id: devspace-enter-command
      - id: devspace-welcome-banner
      - id: devspace-yaml-config
