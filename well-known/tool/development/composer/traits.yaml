defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.96

traits:
  - id: composer-package-name
    desc: composer/composer package name
    crit: notable
    for: [composer.json]
    if:
      type: value
      path: name
      exact: composer/composer

  - id: composer-source-namespace
    desc: Composer source namespace
    crit: notable
    if:
      type: text
      regex: 'This file is part of Composer\.[\s\S]{0,300}namespace\s+Composer\\'

  - id: composer-phar-name
    desc: Composer PHAR filename
    if:
      type: path
      basename: true
      exact: composer.phar

  - id: phar-tools-composer-path
    desc: Composer PHAR in tools/phar directory
    if:
      type: path
      regex: '(?i)tools[/+]phar[/+]composer$'
  - id: composer-console-namespace
    desc: Composer console namespace
    if:
      type: text
      substr: 'namespace Composer\Console;'
  - id: composer-env-handling
    desc: Composer environment variable handling
    if:
      type: text
      substr: COMPOSER_HOME

composite_rules:
  - id: composer-source-package
    desc: composer/composer source package
    crit: notable
    for: [php, composer.json]
    scope: archive
    all:
      - id: composer-package-name
      - id: composer-source-namespace

  - id: composer-phar-cli
    desc: Composer PHAR CLI application
    crit: notable
    all:
      - id: composer-console-namespace
      - id: composer-env-handling
    any:
      - id: composer-phar-name
      - id: phar-tools-composer-path
