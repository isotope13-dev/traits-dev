# esc generates Go static filesystems by embedding gzip-compressed assets.
defaults:
  platforms: [unix, windows]
  conf: 0.99

traits:
  - id: generated-static-assets
    desc: esc-generated Go static asset source
    crit: notable
    for: [go]
    if:
      type: text
      regex: 'Code generated by "esc\b'
