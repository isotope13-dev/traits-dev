# GitHub's CodeQL Action bundle includes a deliberately detached local proxy.
# Its launcher is an action implementation, not a module-init supply-chain
# payload: the proxy is downloaded from the CodeQL release and receives the
# action's registry configuration over stdin.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: CodeQL Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: codeql

  - id: package-description
    desc: CodeQL Action package description
    for: [package.json]
    if:
      type: value
      path: description
      exact: CodeQL action

  - id: action-stub
    desc: CodeQL GitHub Action stub manifest
    for: [github-actions]
    if:
      type: value
      path: name
      exact: 'CodeQL: Stub'

  - id: proxy-binary-reference
    desc: CodeQL launcher references update-job-proxy
    for: [javascript, typescript]
    if:
      type: text
      substr: update-job-proxy

  - id: codeql-release-download
    desc: CodeQL launcher references its GitHub release
    for: [javascript, typescript]
    if:
      type: text
      substr: github.com/github/codeql-action/releases/download

  - id: dependabot-proxy-ca
    desc: CodeQL launcher creates Dependabot proxy CA
    for: [javascript, typescript]
    if:
      type: text
      substr: Dependabot Internal CA

composite_rules:
  - id: codeql-proxy-launcher-context
    desc: Recognized CodeQL update proxy launcher
    crit: exception
    conf: 0.99
    all:
      - id: proxy-binary-reference
      - id: codeql-release-download
      - id: dependabot-proxy-ca

  - id: codeql-action-context
    desc: Recognized CodeQL Action source bundle
    crit: exception
    conf: 0.99
    for: [gz]
    scope: archive
    all:
      - id: package-name
      - id: package-description
      - id: action-stub
