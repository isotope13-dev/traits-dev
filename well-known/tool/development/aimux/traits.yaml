# AiMUX is a documented tmux/SSH bridge and MCP server. Its PTY, remote
# command, port-forwarding, and file-transfer capabilities are expected admin
# functionality; identify the package without turning those capabilities into
# a malware verdict.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: AiMUX Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: aimux

  - id: package-name
    desc: AiMUX package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: aimux

  - id: package-summary
    desc: AiMUX tmux wrapper package summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)tmux wrapper.{0,80}local.{0,20}remote'

  - id: bridge-source-marker
    desc: AiMUX bridge source marker
    for: [python]
    if:
      type: text
      regex: '\bAIMUX_(MCP_SHELL|BRIDGE_TOKEN|BRIDGE_URL)\b'

composite_rules:
  - id: aimux-tool
    desc: AiMUX tmux and remote-session tool
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-name
      - id: package-summary
      - id: bridge-source-marker
