defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: go-module-path
    desc: GitLab CLI Go module path
    if:
      type: value
      path: elf.go.module.path
      exact: gitlab.com/gitlab-org/cli

  - id: go-command-path
    desc: GitLab CLI Go command path
    if:
      type: value
      path: elf.go.path
      exact: gitlab.com/gitlab-org/cli/cmd/glab

composite_rules:
  - id: glab-cli-binary
    desc: Official GitLab CLI binary
    crit: exception
    conf: 0.99
    all:
      - id: go-module-path
      - id: go-command-path
