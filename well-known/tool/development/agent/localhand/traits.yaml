# LocalHand is a local automation agent (localhand.dev). The macOS desktop-bridge
# binary provides accessibility and UI automation helpers (slack-gui-bridge) to drive
# desktop windows without stealing user focus.
defaults:
  for: [macho]
  platforms: [macos]
  crit: baseline
  conf: 0.99
  size_min: 50000
  size_max: 2000000

traits:
  - id: localhand-desktop-bridge-marker
    desc: LocalHand macOS desktop bridge usage marker
    crit: notable
    if:
      type: text
      section: __TEXT,__cstring
      substr: "usage: slack-gui-bridge"

composite_rules:
  - id: localhand-desktop-bridge-utility
    desc: LocalHand macOS desktop bridge utility
    crit: notable
    conf: 0.99
    all:
      - id: localhand-desktop-bridge-marker
      - id: micro-behaviors/ui/window/enumerate::get-frontmost-application
