defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1000000
  size_max: 200000000

traits:
  - id: mmcg-pdb
    desc: Mastermind mmcg engine debug symbols reference
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: mmcg.pdb

  - id: mastermind-product-marker
    desc: Mastermind engine product identifier
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      substr: mastermind-workflow

composite_rules:
  - id: mastermind-engine-binary
    desc: Mastermind change graph engine binary
    crit: exception
    conf: 0.99
    all:
      - id: mmcg-pdb
      - id: mastermind-product-marker