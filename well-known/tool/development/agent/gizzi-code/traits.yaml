# Gizzi Code AI coding assistant CLI and packages from Allternit.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json, npm, tar, zip, elf, macho, pe, javascript]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: gizzi-code-scoped-package-name
    desc: Allternit Gizzi Code scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@allternit/gizzi-code'

  - id: gizzi-code-repository
    desc: Allternit platform source repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/Allternit/allternit-platform'

  - id: gizzi-code-package-member-path
    desc: Path inside an @allternit/gizzi-code package
    for: [scripts, source, markdown, text, json, package.json, javascript, pe, dll, elf, macho, npm, zip, tar]
    if:
      type: path
      regex: '(@?allternit[-/])?gizzi-code'

  - id: gizzi-code-cli-binary-name
    desc: Gizzi Code CLI binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 500000000
    if:
      type: basename
      regex: '^gizzi-code(-[a-z0-9_-]+)?$'

  - id: gizzi-code-bun-marker
    desc: Gizzi Code bundled application marker
    for: [elf, macho]
    size_min: 1000000
    size_max: 500000000
    if:
      type: text
      section: .bun
      substr: '@allternit/gizzi-code'

composite_rules:
  - id: gizzi-code-package-context
    desc: Official Gizzi Code package context
    crit: exception
    conf: 0.99
    for: [elf, macho, pe]
    any:
      - id: gizzi-code-cli-binary-name
      - id: gizzi-code-bun-marker
      - id: gizzi-code-package-member-path

  - id: gizzi-code-archive-context
    desc: Official Gizzi Code archive context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: gizzi-code-scoped-package-name
      - id: gizzi-code-repository
