defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: rigxyz CLI npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@rigxyz/cli'
- id: postinstall-skill-marker
  desc: rigxyz CLI managed postinstall skill marker
  for:
  - javascript
  if:
    type: text
    substr: managed by @rigxyz/cli postinstall
