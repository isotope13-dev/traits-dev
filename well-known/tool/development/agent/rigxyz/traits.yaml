# @rigxyz/cli — portable agent workspaces; postinstall optionally seeds a
# user-level rig SKILL.md under ~/.claude and ~/.agents (documented, opt-out).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: rigxyz CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@rigxyz/cli"

  - id: postinstall-skill-marker
    desc: rigxyz CLI managed postinstall skill marker
    for: [javascript]
    if:
      type: text
      substr: managed by @rigxyz/cli postinstall

composite_rules:
  - id: archive-context
    desc: rigxyz CLI documented agent skill install context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: postinstall-skill-marker
      - id: metadata/package/description/function::description-portable-agent-workspaces
