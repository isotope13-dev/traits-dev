# Legion — multi-agent coordination framework and Oh My Pi plugins (sjawhar/legion).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Legion scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@sjawhar/pi-[a-z0-9._-]+$'

  - id: scoped-npm-package-identity
    desc: Legion scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@sjawhar/pi-[a-z0-9._-]+$'

  - id: github-repository-string
    desc: Legion GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(?i)(git\+)?https://github\.com/sjawhar/legion(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Legion GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(?i)(git\+)?https://github\.com/sjawhar/legion(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Legion GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(?i)(git\+)?https://github\.com/sjawhar/legion(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Legion package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Legion repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Legion package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
