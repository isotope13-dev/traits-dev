# Swing MCP exposes deliberate Swing/JavaFX UI automation through MCP tools.
# Its key methods synthesize requested input; they do not capture a key stream.
defaults:
  for: [java_class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: swing-mcp-interaction-tools
    desc: Swing MCP UI interaction tool class
    if:
      type: value
      path: class.class_refs[*]
      exact: solutions/crosstech/swingmcp/server/tools/InteractionTools
