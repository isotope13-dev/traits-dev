defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho, javascript, typescript]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 200000000

traits:
  - id: reason-machines-domain
    desc: Mentions Reason Machines domain
    if:
      type: text
      substr: reasonmachines.com

  - id: reason-machines-api-domain
    desc: Mentions Reason Machines API origin
    if:
      type: text
      substr: api.reasonmachines.com

  - id: reason-machines-extension-host
    desc: Reason Machines browser connection host
    if:
      type: text
      substr: com.reasonmachines.device_connection

  - id: reason-browser-use-string
    desc: Mentions Reason Browser Use extension
    if:
      type: text
      substr: Reason Browser Use

  - id: reason-machines-package-name
    desc: Reason Machines CLI package name
    for: [package.json]
    size_min: 1
    size_max: 50000
    if:
      type: value
      path: name
      regex: '^@reason-machines/cli'

composite_rules:
  - id: reason-machines-agent-context
    desc: Reason Machines CLI and device agent context
    crit: exception
    conf: 0.99
    any:
      - id: reason-machines-domain
      - id: reason-machines-api-domain
      - id: reason-machines-extension-host
      - id: reason-browser-use-string
      - id: reason-machines-package-name
