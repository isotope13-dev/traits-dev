# sap-ai-dev-toolkit — SAP AI dev CLI/MCP toolkit; postinstall stages the
# bundled VSP Go helper from dist/ with checksum verification.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, elf, macho, pe]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: sap-ai-dev-toolkit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: sap-ai-dev-toolkit

  - id: vsp-packaged-binary-basename
    desc: Bundled VSP helper binary basename
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: basename
      regex: '^vsp-'

  - id: postinstall-binary-marker
    desc: Postinstall installs bundled VSP binary
    for: [javascript]
    if:
      type: text
      substr: installBinary

composite_rules:
  - id: archive-context
    desc: SAP AI dev toolkit documented install context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: vsp-packaged-binary-basename
      - id: postinstall-binary-marker
