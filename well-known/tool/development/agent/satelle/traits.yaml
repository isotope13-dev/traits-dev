# Satelle native desktop assistant daemon and MCP server. GetDIBits captures
# desktop snapshots for computer use, certificate enumeration supports the
# native TLS stack, and Toolhelp tracks managed child processes.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 1000000
  size_max: 100000000

traits:
  - id: satelle-agent-crate-path
    desc: Satelle desktop agent crate path
    if:
      type: raw
      section: rdata
      substr: 'crates\satelle\'

  - id: satelle-agent-pdb
    desc: Satelle desktop agent PDB build artifact
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: satelle.pdb

composite_rules:
  - id: satelle-agent-binary
    desc: Satelle desktop agent native binary
    crit: notable
    conf: 0.99
    all:
      - id: satelle-agent-crate-path
      - id: satelle-agent-pdb
