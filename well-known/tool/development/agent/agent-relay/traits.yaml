# @agent-relay/* — Agent Workforce Relay harness and broker SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: harness-driver-package-name
    desc: Agent Relay harness-driver npm package
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@agent-relay/harness-driver'

  - id: harness-driver-archive-path
    desc: harness-driver npm archive path
    if:
      type: path
      regex: 'harness-driver@[0-9]'

  - id: harness-driver-client-class
    desc: HarnessDriverClient agent relay SDK
    for: [javascript, typescript]
    if:
      type: text
      substr: HarnessDriverClient

  - id: native-harness-protocol-marker
    desc: Agent Relay native harness protocol version
    for: [javascript, typescript]
    if:
      type: text
      substr: NATIVE_HARNESS_PROTOCOL_VERSION

  - id: agent-relay-sdk-import
    desc: Agent Relay SDK module import
    for: [javascript, typescript]
    if:
      type: text
      substr: '@agent-relay/sdk'

  - id: broker-platform-optional-dep-name
    desc: Agent Relay broker platform optional dep
    for: [package.json]
    if:
      type: text
      regex: '"@agent-relay/broker-(darwin|linux|win32)-'

  - id: relay-monorepo-repository
    desc: Agent Workforce relay monorepo URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/AgentWorkforce/relay(\.git)?'

composite_rules:
  - id: agent-relay-harness-package
    desc: Agent Relay managed harness driver SDK
    crit: exception
    conf: 0.97
    any:
      - id: harness-driver-package-name
      - id: harness-driver-archive-path
      - id: harness-driver-client-class
      - id: native-harness-protocol-marker
      - id: agent-relay-sdk-import
