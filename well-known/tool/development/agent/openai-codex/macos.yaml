defaults:
  platforms: [macos]
  for: [macho]
  size_max: 500000000
  crit: notable
  conf: 1.0

traits:
  - id: openai-signing-team
    desc: OpenAI macOS signing team identifier
    if:
      type: value
      path: macho.code_signature.team_id
      exact: 2DC432GLL2

  - id: codex-macho-identifier
    desc: OpenAI Codex macOS code signature identifier
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^(codex(-[a-z0-9-]+)?|com\.openai\.codex(\..*)?)$'

composite_rules:
  - id: official-signed-artifact
    desc: Official signed OpenAI Codex macOS binary
    crit: exception
    all:
      - id: openai-signing-team
      - id: codex-macho-identifier
