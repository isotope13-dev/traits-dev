defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0

composite_rules:
  - id: official-signed-artifact
    desc: Mach-O signature claims OpenAI team and Codex identifier
    crit: notable
    all:
      - id: metadata/binary/signing::openai-signing-team-claim
      - id: metadata/binary/signing::codex-macho-identifier-claim
