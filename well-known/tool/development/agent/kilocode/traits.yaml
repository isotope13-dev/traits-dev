defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, package.json, elf, macho]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 200000000

traits:
  - id: kilo-code-package
    crit: notable
    desc: Kilo Code package marker
    for: [package.json]
    if:
      type: value
      path: name
      exact: kilo-code
  - id: kilo-code-scoped-package
    crit: notable
    desc: Kilo Code scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@kilocode/kilo'
  - id: kilo-code-repository-marker
    crit: notable
    desc: Kilo Code source repository marker
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/Kilo-Org/kilocode(\.git)?/?$'
  - id: kilo-code-source-archive-marker
    crit: notable
    desc: Kilo Code source archive repository path marker
    for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    if:
      type: text
      substr: github.com/Kilo-Org/kilocode@
  - id: kiloclaw-bundle-marker
    crit: notable
    desc: KiloClaw bundle marker
    for: [javascript, typescript]
    if:
      type: text
      substr: kiloclaw
  - id: kilo-theme-marker
    crit: notable
    desc: Kilo theme bundle marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 'theme:"Kilo"'
  - id: kilo-code-js-bundle
    crit: notable
    desc: Kilo CLI configuration reference in bundle
    for: [javascript, typescript]
    if:
      # A comment naming an integration target does not identify this code.
      # Require its product-specific configuration reference in string data.
      type: literal
      substr: Kilo CLI Configuration Reference
  - id: kilo-cli-config-marker
    crit: notable
    desc: Kilo CLI configuration marker
    for: [elf, macho]
    if:
      type: text
      section: .bun
      substr: Kilo CLI Configuration Reference
  - id: kilo-gateway-package-marker
    crit: notable
    desc: Kilo gateway package marker
    for: [elf, macho]
    if:
      type: text
      section: .bun
      substr: '@kilocode/kilo-gateway'
composite_rules:
  - id: kilo-code-identity
    desc: Kilo Code package or integration marker
    crit: notable
    conf: 0.98
    any:
      - id: kilo-code-package
      - id: kilo-code-scoped-package
      - id: kilo-code-repository-marker
      - id: kilo-code-source-archive-marker
      - id: kilo-cli-config-marker
      - id: kilo-gateway-package-marker
      - id: kilo-code-js-bundle
      - id: kiloclaw-bundle-marker
      - id: kilo-theme-marker
      - id: kilo-code-native-runtime
  - id: kilo-code-native-runtime
    desc: Kilo Code packaged native runtime
    for: [elf, macho]
    crit: notable
    conf: 0.98
    all:
      - id: metadata/filename/name-form::kilo-executable-basename
      - id: kilo-cli-config-marker
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/binary/section/name::bun-macho-section-name
