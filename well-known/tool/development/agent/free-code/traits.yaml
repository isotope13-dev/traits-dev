# Free Code CLI (npm free-code-cli / @free-code-cli/cli-*). Bun-compiled
# builds keep the package name beside the scoped platform package in the
# embedded module graph. That pair is the product, not a campaign token.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 1000000
  size_max: 400000000

traits:
  - id: free-code-cli-bundle-marker
    desc: Free Code CLI Bun package marker
    if:
      type: text
      section: .bun
      regex: 'free-code-cli[\s\S]{0,40}@free-code-cli/cli-'
