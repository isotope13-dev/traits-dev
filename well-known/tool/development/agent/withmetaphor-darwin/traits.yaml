# Darwin — multi-provider AI coding agent CLI (@withmetaphor/darwin by Metaphor / Spacetab, Inc).
# Bundles command-safety policy guidance and global shim cleanup.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Darwin AI coding agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@withmetaphor/darwin"

  - id: npm-package-name
    desc: Darwin AI coding agent npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@withmetaphor/darwin"

  - id: package-description
    desc: Darwin AI coding agent package description
    for: [package.json]
    if:
      type: value
      path: description
      substr: "Darwin - Next Generation AI Coding Agent"

  - id: npm-package-description
    desc: Darwin AI coding agent npm description
    for: [npm]
    if:
      type: value
      path: npm.description
      substr: "Darwin - Next Generation AI Coding Agent"

  - id: installer-package-name
    desc: Darwin installer package reference
    for: [javascript, markdown, text]
    if:
      type: text
      substr: "@withmetaphor/darwin-installer"

  - id: agent-prompt-marker
    desc: Darwin agent prompt marker
    for: [javascript, text]
    if:
      type: text
      substr: "You are an agent for Darwin"

  - id: runtime-package-root-global
    desc: Darwin runtime package root global
    for: [javascript]
    if:
      type: text
      substr: "__TAU_PACKAGE_ROOT__"

composite_rules:
  - id: darwin-agent-package-name
    desc: Darwin AI coding agent package name identity
    crit: notable
    conf: 0.99
    for: [package.json, npm]
    any:
      - id: package-name
      - id: npm-package-name

  - id: darwin-coding-agent
    desc: Darwin AI coding agent package identity
    crit: notable
    conf: 0.99
    any:
      - id: package-description
      - id: npm-package-description
      - id: installer-package-name
      - id: agent-prompt-marker
      - id: runtime-package-root-global

  - id: darwin-agent-package-context
    desc: Recognized Darwin AI coding agent package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: darwin-agent-package-name
      - id: darwin-coding-agent
