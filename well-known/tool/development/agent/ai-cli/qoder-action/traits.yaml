# Qoder AI coding assistant GitHub Action (QoderAI/qoder-action)
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: qoder-action-source
    desc: Qoder GitHub Action source tree path
    crit: notable
    for: [github-actions, shell, javascript, typescript]
    if:
      type: path
      substr: qoder-action

  - id: qoder-action-uses-step
    desc: Uses Qoder GitHub Action
    crit: notable
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: QoderAI/qoder-action

composite_rules:
  - id: qoder-action-context
    desc: Recognized Qoder AI assistant workflow context
    crit: exception
    conf: 0.98
    for: [github-actions]
    any:
      - id: qoder-action-source
      - id: qoder-action-uses-step
