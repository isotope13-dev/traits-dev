# great-cto installs its Claude Code plugin only when the user runs its CLI.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: great-cto npm package name
    for: [package.json]
    if:
      type: text
      regex: '"name"\s*:\s*"great-cto"'

  - id: postinstall-command
    desc: great-cto postinstall entrypoint
    for: [package.json]
    if:
      type: text
      regex: '(?s)"name"\s*:\s*"great-cto".{0,900}"postinstall"\s*:\s*"node postinstall\.mjs"'

  - id: noop-postinstall-stub
    desc: great-cto postinstall stub has no code
    for: [javascript]
    size_max: 1000
    if:
      type: text
      regex: '(?s)^#!/usr/bin/env node\s*/\*\*.{0,400}currently does nothing\..{0,200}\*/\s*$'
