# pantheon-cli — MCP server and CLI for handing off AI-agent conversations
# between Cursor, Claude Code, Codex, and similar tools. A global npm install
# refreshes bundled SKILL.md files and command stubs in the user's agent
# config directories; that is documented setup UX, not a supply-chain dropper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: pantheon-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pantheon-cli

  - id: handoff-mcp-tool-marker
    desc: Pantheon MCP handoff tool name
    for: [javascript, typescript]
    if:
      type: text
      substr: pantheon_handoff

  - id: bundled-agent-skill-installer
    desc: Pantheon writes bundled agent SKILL.md files
    for: [javascript, typescript]
    if:
      type: text
      substr: writeCodexSkill

composite_rules:
  - id: archive-context
    desc: Pantheon CLI documented agent setup context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: handoff-mcp-tool-marker
      - id: bundled-agent-skill-installer
