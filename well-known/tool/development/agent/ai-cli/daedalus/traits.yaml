# Atlas Daedalus (`acode-cli`) — Sovereign autonomous terminal AI coder CLI.
# Embeds an automated Threat Shield policy engine that checks tool commands
# against signatures of prompt injections, exfiltration tools, and sensitive
# host paths before execution.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 209715200

traits:
  - id: product-name
    desc: Atlas Daedalus autonomous AI coder product title
    if:
      type: text
      substr: "Atlas Daedalus"

  - id: threat-shield-banner
    desc: Atlas Daedalus threat shield intercept signature
    if:
      type: text
      substr: "[THREAT_SHIELD"

  - id: sovereign-gateway-domain
    desc: Atlas Research Labs powerbox gateway domain
    if:
      type: text
      substr: "powerbox.atlasresearchlabs.online"

  - id: package-name
    desc: acode-cli npm package name
    for: [package.json]
    size_min: 20
    size_max: 1000000
    if:
      type: value
      path: name
      exact: acode-cli

composite_rules:
  - id: daedalus-agent-context
    desc: Atlas Daedalus AI coding agent context
    crit: exception
    conf: 0.98
    scope: file
    needs: 2
    any:
      - id: product-name
      - id: threat-shield-banner
      - id: sovereign-gateway-domain

  - id: daedalus-threat-shield-corpus
    desc: Atlas Daedalus embedded threat shield detector signatures
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: daedalus-agent-context
      - id: threat-shield-banner
