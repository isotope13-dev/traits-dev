# PrimoCode — Brazilian AI engineering agent for the terminal (ConectaPrimoAI).
# (https://github.com/ConectaPrimoAI/primocode / npm primocode).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, markdown, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: PrimoCode npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: primocode

  - id: product-description
    desc: PrimoCode coding agent product description
    for: [package.json, markdown]
    if:
      type: text
      substr: "PrimoCode — agente de engenharia com IA"

  - id: terminal-tool-source
    desc: PrimoCode terminal launch tool implementation
    for: [javascript]
    if:
      type: text
      substr: "async function runInNewTerminal("

composite_rules:
  - id: primocode-coding-agent
    desc: PrimoCode AI coding agent
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: product-description
      - id: terminal-tool-source
