# Phoenix Labs Agents CLI — multi-agent manager and orchestrator (@phnx-labs/agents-cli)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: phnx-agents-cli-package-name
    desc: Phoenix Labs Agents CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@phnx-labs/agents-cli"

  - id: phnx-agents-cli-repo-url
    desc: Phoenix Labs Agents CLI GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/phnx-labs/agi-cli'

  - id: phnx-agents-cli-banner-comment
    desc: Agents CLI auto-generated rules banner
    for: [javascript, typescript]
    if:
      type: text
      substr: "Auto-generated by agents-cli"

# `phnx-agents-state-dir-reference` (quoted '.agents' string) was removed:
# `.agents` is a generic agent-state directory convention shared by Claude
# Code, opencode, izanagi-ai and others, so the matcher did not identify this
# product -- it false-positived on unrelated frameworks (34 files on one benign
# sample) and keyed a suppression exception to an attacker-controllable
# string. The neutral observation now lives at
# micro-behaviors/fs/path/agent-config/directory::agents-state-directory.

composite_rules:
  - id: phnx-agents-cli-source
    desc: Phoenix Labs Agents CLI source context
    crit: exception
    any:
      - id: phnx-agents-cli-package-name
      - id: phnx-agents-cli-repo-url
      - id: phnx-agents-cli-banner-comment
