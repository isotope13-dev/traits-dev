# bkit — AI agent engineering workflow and harness tool (@cbartens/bkit / github.com/cbartens/bkit)
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.95

traits:
  - id: bkit-package-name
    desc: bkit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@cbartens/bkit"

  - id: bkit-repo-url
    desc: bkit GitHub repository URL
    if:
      type: text
      substr: github.com/cbartens/bkit

  - id: bkit-install-command
    desc: bkit install command invocation
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: "bkit install"

  - id: bkit-prefix-constant
    desc: bkit prefix constant reference
    for: [javascript, typescript]
    if:
      type: text
      substr: BKIT_PREFIX

composite_rules:
  - id: bkit-source
    desc: bkit AI agent framework source
    crit: exception
    any:
      - id: bkit-package-name
      - id: bkit-repo-url
      - id: bkit-install-command
      - id: bkit-prefix-constant
