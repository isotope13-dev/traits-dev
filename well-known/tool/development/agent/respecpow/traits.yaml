# respecpow — spec-driven AI dev framework (git.gj.com/ai/specpow).
# postinstall registers disclosed Claude Code / CodeBuddy hooks via
# `npx respecpow hook-run`; rapid early releases are product cadence, not
# dependency-confusion impersonation.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: respecpow npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: respecpow

  - id: npm-package-name
    desc: respecpow npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: respecpow

  - id: specpow-repository-package-json
    desc: SpecPow repository URL in package.json
    for: [package.json]
    if:
      type: text
      substr: /ai/specpow

  - id: postinstall-hook-registration-script
    desc: SpecPow postinstall hook registration script
    for: [javascript, typescript]
    size_max: 500000
    if:
      type: text
      regex: '(?is)SpecPow Postinstall.{0,400}hook-run'

composite_rules:
  - id: official-package-identity
    desc: Official respecpow npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: archive-context
    desc: respecpow disclosed AI hook postinstall context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: specpow-repository-package-json
      - id: postinstall-hook-registration-script
