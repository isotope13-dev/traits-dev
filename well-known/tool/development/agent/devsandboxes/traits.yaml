# devsandboxes — DevContainers for AI coding agents (Nemikolh/devsandboxes)
# Provides isolated container sandboxes, Git worktree instances, and a host daemon.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, npm, tar, zip]
  crit: notable
  conf: 0.98
  size_max: 524288000

traits:
  - id: devsandbox-native-binary-name
    desc: devsandbox native CLI binary name
    crit: notable
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: basename
      regex: '^devsandbox(\.exe)?$'

  - id: devsbd-guest-daemon-name
    desc: devsbd container guest daemon binary name
    crit: notable
    for: [elf, macho, pe]
    size_min: 100000
    if:
      type: basename
      regex: '^devsbd(\.exe)?$'

  - id: package-name
    desc: devsandboxes npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@devsandboxes/.*|devsandboxes)$'

  - id: npm-package-name
    desc: devsandboxes npm archive name
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^(@devsandboxes/.*|devsandboxes)$'

  - id: repository-url
    desc: devsandboxes package repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: Nemikolh/devsandboxes

  - id: npm-repository-url
    desc: devsandboxes npm archive repository URL
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      substr: Nemikolh/devsandboxes

  - id: devsandboxes-config-filename
    desc: devsandboxes configuration filename
    crit: notable
    for: [elf, macho, pe]
    if:
      type: text
      section: rdata
      regex: 'devsandboxes\.(toml|ya?ml)'

  - id: devsandbox-host-daemon-service
    desc: devsandbox host daemon service marker
    crit: notable
    for: [elf, macho, pe]
    if:
      type: text
      section: rdata
      substr: 'devsandbox host daemon'

  - id: devsandbox-launchd-label
    desc: devsandbox host daemon LaunchAgent label
    crit: notable
    for: [elf, macho, pe]
    if:
      type: text
      section: rdata
      substr: dev.devsandbox.serve

composite_rules:
  - id: devsandboxes-cli
    desc: devsandboxes container sandbox CLI for AI coding agents
    crit: notable
    conf: 0.98
    any:
      - id: devsandbox-native-binary-name
      - id: devsbd-guest-daemon-name
      - id: package-name
      - id: npm-package-name
      - id: repository-url
      - id: npm-repository-url
      - id: devsandboxes-config-filename
      - id: devsandbox-host-daemon-service
      - id: devsandbox-launchd-label
