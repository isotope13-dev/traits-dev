# Open Interpreter -- the open-source agent runtime -- and its Rust
# implementation of the Codex CLI (github.com/openinterpreter/openinterpreter-rust).
# Native release builds embed the project's release URL right beside the
# upstream Codex release URL they forked, so the org repo string is the
# discriminating identity for the org's native builds. Raw section-scoped
# matching is required: the string sits inside concatenated Rust string-table
# runs that per-section string extraction does not split.
defaults:
  crit: notable
  conf: 0.98
  platforms: [linux, macos, windows]

traits:
  - id: open-interpreter-elf-repo-string
    desc: Open Interpreter ELF repo string
    for: [elf]
    platforms: [linux, macos]
    size_min: 1048576
    size_max: 536870912
    if:
      type: raw
      substr: github.com/openinterpreter/openinterpreter
      section: .rodata

  - id: open-interpreter-pe-repo-string
    desc: Open Interpreter PE repo string
    for: [pe]
    platforms: [windows]
    size_min: 1048576
    size_max: 536870912
    if:
      type: raw
      substr: github.com/openinterpreter/openinterpreter
      section: .rdata

  - id: open-interpreter-macho-repo-string
    desc: Open Interpreter Mach-O repo string
    for: [macho]
    platforms: [macos]
    size_min: 1048576
    size_max: 536870912
    if:
      type: raw
      substr: github.com/openinterpreter/openinterpreter
      section: __const
