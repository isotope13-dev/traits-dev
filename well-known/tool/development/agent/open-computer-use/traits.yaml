# open-computer-use is an open-source MCP server launcher and desktop automation agent
# (https://github.com/iFurySt/open-computer-use) providing computer-use tools.
defaults:
  for: [macho]
  platforms: [macos]
  crit: notable
  conf: 0.99
  size_min: 500000
  size_max: 50000000

traits:
  - id: open-computer-use-helper-utility
    desc: Open Computer Use macOS helper utility
    if:
      type: text
      section: __TEXT,__cstring
      substr: OpenComputerUseKit
