defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: zerone-agent-sdk-package-name
    desc: Zerone Agent SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@zerone-agent/agent-sdk'

  - id: zerone-agent-sdk-npm-name
    desc: Zerone Agent SDK npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@zerone-agent/agent-sdk'

  - id: zerone-agent-sdk-repository
    desc: Zerone Agent SDK upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/zerone-agents/agent-sdk(\.git)?$'

composite_rules:
  - id: zerone-agent-sdk-package-context
    desc: Recognized Zerone Agent SDK npm package
    scope: archive
    for: [npm, package.json]
    all:
      - id: zerone-agent-sdk-package-name
      - id: zerone-agent-sdk-repository
