# sandbox-cli — disposable, isolated Docker containers for AI coding agents (Amitgb14/sandbox-cli)
# Provides isolated container sandboxes, Git worktree instances, and a host studio daemon.
defaults:
  platforms: [linux, macos, windows]
  for: [go, javascript, typescript, json, markdown, shell, yaml]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-repository
    desc: sandbox-cli GitHub upstream repository
    if:
      type: text
      substr: github.com/Amitgb14/sandbox-cli

  - id: release-tree-path
    desc: Path under sandbox-cli release tree
    if:
      type: path
      regex: 'github\.com[\\/]Amitgb14[\\/]sandbox-cli'

composite_rules:
  - id: sandbox-cli-identity
    desc: Recognized sandbox-cli container sandbox tool for AI coding agents
    crit: notable
    conf: 0.99
    any:
      - id: upstream-repository
      - id: release-tree-path
