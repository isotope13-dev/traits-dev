# @yanzc/claude-pro is published from the yanzaocheng/copy-claude-code GitHub
# repository. The scoped package name and repo name differ intentionally as an
# independent reimplementation of Claude Code, not a clone-and-rename inconsistency.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Claude Pro npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@yanzc/claude-pro"

  - id: npm-package-name
    desc: Claude Pro npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@yanzc/claude-pro"

  - id: repository-url
    desc: Claude Pro official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/yanzaocheng/copy-claude-code(\.git)?$'

  - id: npm-repository-url
    desc: Claude Pro npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/yanzaocheng/copy-claude-code(\.git)?$'

  - id: package-path
    desc: Claude Pro package path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      regex: '(@yanzc[\\/]claude-pro|copy-claude-code|@yanzc-claude-pro)'

  - id: agent-source-marker
    desc: Claude Pro agent source code marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'interactive command line agent modelled on Claude Code'

composite_rules:
  - id: official-package-identity
    desc: Official Claude Pro package identity
    crit: exception
    for: [package.json, npm, javascript, typescript]
    any:
      - id: package-name
      - id: npm-package-name
      - id: package-path
      - id: agent-source-marker

  - id: official-repository-identity
    desc: Official Claude Pro repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official Claude Pro package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
