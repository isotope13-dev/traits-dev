# Identity for the Arch package that repackages Balena's official CLI release
# binary.  The recipe remains subject to source-integrity and install-behavior
# rules; this context only identifies the documented upstream package.
defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.99

traits:
  - id: cli-package-name
    desc: Balena CLI Arch package name
    if:
      type: value
      path: pkg.pkgname
      exact: balena-cli-bin

  - id: cli-upstream-site
    desc: Balena CLI upstream website
    if:
      type: value
      path: pkg.url
      exact: https://balena.io/

  - id: cli-release-owner
    desc: Balena CLI release owner
    if:
      type: value
      path: pkg.source_github_owners
      exact: balena-io
      match: any

composite_rules:
  - id: official-cli-package
    desc: Official Balena CLI package recipe
    crit: notable
    conf: 0.99
    all:
      - id: cli-package-name
      - id: cli-upstream-site
      - id: cli-release-owner
