# cross-platform-actions/action uses an SSH key and authorized_keys file to
# connect to the temporary BSD/QEMU VM it creates for a GitHub Actions job.
# Those writes are VM bootstrap, not supply-chain credential persistence.
defaults:
  platforms: [unix, windows]
  for: [gz, package.json, javascript, typescript, github-actions, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: package-name
    desc: cross-platform-action package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cross-platform-action

  - id: package-member-name
    desc: cross-platform-action package member identity
    for: [javascript, typescript, github-actions]
    if:
      type: value
      path: package.json::name
      exact: cross-platform-action

  - id: repository-url
    desc: cross-platform-actions repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/cross-platform-actions/action'

  - id: action-package-path
    desc: Official cross-platform-actions package path
    if:
      type: path
      regex: '(?i)(^|[/\\:])cross-platform-actions([/@\\]|$)'

  - id: vm-ssh-bootstrap-source
    desc: VM SSH bootstrap source marker
    for: [javascript, typescript]
    if:
      type: text
      substr: privateSshKeyName

composite_rules:
  - id: cross-platform-actions-context
    desc: Recognized cross-platform-actions VM GitHub Action
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: package-member-name
      - id: repository-url
      - id: action-package-path
      - id: vm-ssh-bootstrap-source
