defaults:
  platforms: [unix, windows]
  for: [zip, elf, macho, pe]
  crit: notable
  conf: 0.99

traits:
  - id: release-archive-name
    desc: Sequin CLI release archive name
    for: [zip]
    if:
      type: basename
      regex: '(?i)^sequinstream[-/]sequin-v[0-9]'

  - id: cli-binary-name
    desc: Sequin CLI executable name
    for: [elf, macho, pe]
    size_min: 100000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^sequin-cli-v[0-9]'

composite_rules:
  - id: cli-archive-context
    desc: Sequin Armon proxy archive context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: release-archive-name
      - id: cli-binary-name
