# PyInstaller — Python application bundler (pyinstaller/pyinstaller).
# Isolated subprocess IPC uses marshal+base64; bootloader vendors waflib.
defaults:
  platforms: [unix, windows]
  for: [python, archives, tar, elf, pe, macho]
  crit: notable
  conf: 0.98

traits:
  - id: development-team-copyright
    desc: PyInstaller Development Team copyright
    for: [python]
    if:
      type: text
      substr: 'PyInstaller Development Team'

  - id: package-import
    desc: from PyInstaller package import
    for: [python]
    if:
      type: text
      substr: 'from PyInstaller import'

  - id: isolated-child-marker
    desc: PyInstaller IsolatedPython child process
    for: [python]
    if:
      type: text
      substr: 'The child process to be invoked by IsolatedPython()'

  - id: meipass-runtime
    desc: PyInstaller _MEIPASS runtime attribute
    for: [python]
    if:
      type: text
      substr: '_MEIPASS'

composite_rules:
  - id: packaging-toolchain-context
    desc: Recognized PyInstaller packaging toolchain
    conf: 0.99
    needs: 2
    any:
      - id: development-team-copyright
      - id: package-import
      - id: isolated-child-marker
      - id: meipass-runtime
