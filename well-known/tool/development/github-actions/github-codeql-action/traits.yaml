# Official GitHub CodeQL Action source-tree identity.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, binaries]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 200000000

traits:
  - id: github-codeql-action-tree
    desc: GitHub CodeQL Action source tree
    if:
      type: path
      regex: '(?i)(github-)?codeql-action[-_]?[0-9]+([.][0-9]+)*'
  - id: github-codeql-action-archive
    desc: GitHub CodeQL Action source archive member
    if:
      type: path
      regex: '(?i)(^|[\\/])codeql-action-[0-9a-f]{8,}[\\/]'
