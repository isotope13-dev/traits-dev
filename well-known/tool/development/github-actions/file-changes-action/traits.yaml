# trilom/file-changes-action — lists files changed in a GitHub event.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: file-changes-action npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: file-changes-action

  - id: action-tree
    desc: file-changes-action source tree path
    if:
      type: path
      regex: 'file-changes-action'
