# actions/setup-python — official GitHub Action to install Python.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, gz, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: package-name
    desc: setup-python Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: setup-python

  - id: repository-url
    desc: setup-python Action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/actions/setup-python'

  - id: action-name
    desc: setup-python GitHub Action display name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Setup Python

  - id: github-repo
    desc: actions/setup-python repository path
    if:
      type: text
      substr: github.com/actions/setup-python
