# Wandalen/wretry.action — retries a GitHub Actions step on failure.
# Bundled wTools path helpers are the action runtime, not string obfuscation.
defaults:
  platforms: [unix, windows]
  for: [github-actions, javascript, typescript, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 600000000

traits:
  - id: action-name
    desc: wretry.action GitHub Action name
    for: [github-actions]
    conf: 0.99
    if:
      type: value
      path: name
      exact: retry action

  - id: action-repo
    desc: Wandalen wretry.action repository
    conf: 0.99
    if:
      type: text
      substr: Wandalen/wretry.action
