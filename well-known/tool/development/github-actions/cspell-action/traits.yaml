# streetsidesoftware/cspell-action — GitHub Action for spell checking.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, tar, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: cspell-action npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cspell-action

  - id: github-repository
    desc: cspell-action GitHub repository
    if:
      type: text
      substr: github.com/streetsidesoftware/cspell-action

  - id: action-description
    desc: cspell-action GitHub Action description
    for: [package.json]
    if:
      type: value
      path: description
      exact: "GitHub Action: Check Spelling"

composite_rules:
  - id: cspell-action-context
    desc: Official cspell GitHub Action repository
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: github-repository
      - id: action-description
