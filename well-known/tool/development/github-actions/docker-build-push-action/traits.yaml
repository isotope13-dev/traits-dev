# Docker's official build-push GitHub Action bundles its Node implementation
# into dist/index.js.  The generated bundle contains generic browser-shaped
# command and route strings from its dependencies; those strings are not a
# phishing workflow in this recognized action package.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Docker build-push Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: docker-build-push

  - id: repository-url
    desc: Docker build-push Action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/docker/build-push-action'

  - id: dist-tree
    desc: Docker build-push Action distribution tree
    for: [javascript]
    if:
      type: path
      regex: '(?i)build-push-action-[^\\/]+[\\/]dist'
