# azu/action-package-version-to-git-tag — GitHub Action that creates a
# git tag from package.json version. Identity only.
defaults:
  platforms: [unix, windows]
  for: [github-actions, package.json, javascript, typescript, json]
  crit: notable
  conf: 0.98
  size_min: 32
  size_max: 20000000

traits:
  - id: action-repo
    desc: package-version-to-git-tag action repo
    for: [github-actions, package.json, json, text]
    conf: 0.99
    if:
      type: text
      substr: azu/action-package-version-to-git-tag
