# GitHub's add-to-project Action — adds issues and PRs to GitHub Projects.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, gz, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: package-name
    desc: add-to-project Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@actions/add-to-project'

  - id: repository-url
    desc: add-to-project Action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/actions/add-to-project'

  - id: action-name
    desc: add-to-project GitHub Action display name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Add To GitHub projects
