# gruntwork-io/terragrunt-action — official composite Action to install
# and run Terragrunt/OpenTofu in GitHub Actions.
defaults:
  platforms: [unix, windows]
  for: [github-actions, shell, go, markdown, tar, gz]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 5000000

traits:
  - id: action-name
    desc: Gruntwork Terragrunt Action display name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Gruntwork Terragrunt

  - id: github-repo
    desc: terragrunt-action GitHub repository
    if:
      type: text
      regex: '(?i)(github\.com/)?gruntwork-io/terragrunt-action'
