# oNaiPs/secrets-to-env-action — a widely used GitHub Action that maps every
# repository secret into the job environment.
#
# `secrets: ${{ toJSON(secrets) }}` is its documented and only input, so that
# expression appearing in a workflow beside this action is the action working
# as designed, not a workflow serializing its secrets for exfiltration. It is
# the single most common legitimate reason to write toJSON(secrets), which is
# why objectives/supply-chain/recon-exfil/secrets/ references it.
defaults:
  platforms: [unix, windows]
  for: [github-actions, text, data]
  crit: notable
  conf: 0.98

traits:
  - id: action-step-reference
    desc: secrets-to-env-action workflow step
    if:
      type: text
      substr: 'secrets-to-env-action'
