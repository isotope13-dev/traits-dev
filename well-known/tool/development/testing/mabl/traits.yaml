# mabl CLI — official browser test automation command-line tool.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: mabl-cli-package-name
    desc: mabl CLI npm package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@mablhq/mabl-cli"

  - id: mabl-internal-runtime-path
    desc: mabl bundled internal test runtime path
    if:
      type: path
      regex: '@mablhq-internal/runtime'

  - id: mablhq-scope-marker
    desc: mablhq npm scope reference in source
    for: [javascript, typescript]
    if:
      type: text
      substr: "@mablhq/"

  - id: mabl-service-domain
    desc: mabl product domain reference
    for: [javascript, typescript, package.json]
    if:
      type: text
      substr: mabl.com

composite_rules:
  - id: mabl-cli-runtime-context
    desc: mabl official CLI and browser test runtime bundle
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: mabl-cli-package-name
      - id: mabl-internal-runtime-path
      - id: mablhq-scope-marker
      - id: mabl-service-domain
