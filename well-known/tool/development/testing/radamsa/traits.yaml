# Radamsa is a published mutation fuzzer. Its initialized mutation tables
# dwarf the C-string section; that layout is the fuzzer, not a packed stub.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [elf, macho]
  size_min: 1000

traits:
  - id: radamsa-fuzzer-banner-macho
    for: [macho]
    desc: Radamsa fuzzer banner in Mach-O
    if:
      type: text
      substr: 'Radamsa is a general purpose fuzzer'
      section: __DATA,__data
  - id: radamsa-fuzzer-banner-elf
    for: [elf]
    desc: Radamsa fuzzer banner in ELF
    if:
      type: text
      substr: 'Radamsa is a general purpose fuzzer'
      section: .data

composite_rules:
  - id: radamsa-fuzzer-banner
    desc: Radamsa fuzzer version banner
    any:
      - id: radamsa-fuzzer-banner-macho
      - id: radamsa-fuzzer-banner-elf
