# BrowserStack AI SDK — LLM observability and evaluation for Node.js.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, archives, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: BrowserStack AI SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@browserstack/ai-sdk"

  - id: bundle-marker
    desc: BrowserStack AI SDK bundle marker string
    for: [javascript, typescript]
    if:
      type: text
      substr: "@browserstack/ai-sdk"

  - id: instrumentation-marker
    desc: BrowserStack AI SDK instrumentation marker
    for: [javascript, typescript]
    if:
      type: text
      substr: ai-sdk-instrumentation

composite_rules:
  - id: browserstack-ai-sdk-context
    desc: BrowserStack AI SDK bundle context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    any:
      - id: package-name
      - id: bundle-marker
      - id: instrumentation-marker
