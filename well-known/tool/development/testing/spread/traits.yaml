# spread (github.com/canonical/spread) runs integration suites on disposable
# VMs and exports SPREAD_* variables to every task and prepare script. Its
# harness scripts reconfigure the throwaway guest (root SSH, passwordless
# sudo, ~/.ssh/rc hooks) so the runner can reach it.
defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: spread-backend-variable
    desc: Reads spread SPREAD_BACKEND variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_BACKEND\b'
  - id: spread-system-variable
    desc: Reads spread SPREAD_SYSTEM variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_SYSTEM\b'
  - id: spread-path-variable
    desc: Reads spread SPREAD_PATH variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_PATH\b'
  - id: spread-reboot-variable
    desc: Reads spread SPREAD_REBOOT variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_REBOOT\b'
  - id: spread-job-variable
    desc: Reads spread SPREAD_JOB variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_JOB\b'
  - id: spread-task-variable
    desc: Reads spread SPREAD_TASK variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_TASK\b'
  - id: spread-suite-variable
    desc: Reads spread SPREAD_SUITE variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_SUITE\b'
  - id: spread-variant-variable
    desc: Reads spread SPREAD_VARIANT variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\$\{?SPREAD_VARIANT\b'

composite_rules:
  - id: spread-harness-environment
    desc: Shell script reads spread harness variables
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: spread-backend-variable
      - id: spread-system-variable
      - id: spread-path-variable
      - id: spread-reboot-variable
      - id: spread-job-variable
      - id: spread-task-variable
      - id: spread-suite-variable
      - id: spread-variant-variable
