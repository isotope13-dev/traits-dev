# spread (github.com/canonical/spread) runs integration suites on disposable
# VMs and exports SPREAD_* variables to every task and prepare script. Its
# harness scripts reconfigure the throwaway guest (root SSH, passwordless
# sudo, ~/.ssh/rc hooks) so the runner can reach it.
defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: spread-harness-environment
    desc: Shell script reads spread harness variables
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '\$\{?SPREAD_(BACKEND|SYSTEM|PATH|REBOOT|JOB|TASK|SUITE|VARIANT)\b'
