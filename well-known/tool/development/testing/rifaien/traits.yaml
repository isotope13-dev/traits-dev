# Rifaien is a self-submission client for a public malware VM playground. It
# mutates copies of its own image and submits them; this is not a downloader or
# evidence of theft from the host.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 32768
  size_max: 4194304

traits:
  - id: rifaien-packed-banner
    desc: Rifaien client banner in packed UPX section
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: rifaien yanje
      section: UPX1

  - id: rifaien-unpacked-banner
    desc: Rifaien client banner in unpacked PE section
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: rifaien yanje
      section: .rdata

  - id: rifaien-unpacked-banner-rsrc
    desc: Rifaien client banner in PE resources
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: rifaien yanje
      section: .rsrc

composite_rules:
  - id: rifaien-packed-upload-markers
    desc: Packed Rifaien banner and self-submission markers
    crit: notable
    conf: 0.98
    all:
      - id: rifaien-packed-banner
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
    any:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
    needs: 1
  - id: rifaien-unpacked-upload-markers
    desc: Unpacked Rifaien banner and self-submission markers
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
    any:
      - id: rifaien-unpacked-banner
      - id: rifaien-unpacked-banner-rsrc
    needs: 1

  # Section variants of one slot, kept with the sprintf destination so
  # this is not an any-only alias. The routine memcmp's [[UNIQUE]] and
  # overwrites the following 16 bytes before writing rifaien2-%s.exe.
  - id: rifaien-image-mutation-slot
    desc: Rifaien self-mutation slot with generated executable name
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/target::generated-numbered-exe-format
    any:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker-rdata
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker-rsrc
    needs: 1

  - id: rifaien-packed-vm-self-submission
    desc: Packed Rifaien submits mutated self-copies to a VM playground
    crit: notable
    conf: 0.98
    all:
      - id: rifaien-packed-banner
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint

  - id: rifaien-unpacked-vm-self-submission
    desc: Unpacked Rifaien submits mutated self-copies to a VM playground
    crit: notable
    conf: 0.98
    all:
      - id: rifaien-unpacked-banner
      - id: rifaien-image-mutation-slot
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint

  - id: rifaien-mutated-executable-clone-writer
    desc: Rifaien writes uniquely mutated executable self-copies
    crit: notable
    conf: 0.97
    all:
      - id: rifaien-image-mutation-slot
    any:
      - id: rifaien-packed-banner
      - id: rifaien-unpacked-banner
      - id: rifaien-unpacked-banner-rsrc

