defaults:
  platforms: [windows]
  for: [pe]
  size_min: 32768
  size_max: 4194304

traits:

  - id: rifaien-packed-banner
    desc: Rifaien version banner in UPX data
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: rifaien yanje
      section: UPX1

# Benign identity: the historical upload service was a public VM playground.
# No required leg establishes theft, destruction or unauthorized execution.
# Reverse engineering: the main loop reads its own image, randomizes the
# mutation slot and posts a clone every 30 seconds to a selected VM node.
# The banner discriminates this implementation; neither UPX nor curl alone
# establishes unauthorized propagation. The endpoint is corroboration, not a required host.
composite_rules:
  - id: rifaien-self-submission-program
    desc: Rifaien VM-playground self-submission program
    crit: notable
    conf: 0.98
    all:
      - id: rifaien-packed-banner
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
    any:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
