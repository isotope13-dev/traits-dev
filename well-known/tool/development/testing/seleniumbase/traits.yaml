# SeleniumBase — browser automation and E2E testing framework.
# encryption.py obfuscates bundled test strings; browser_launcher enables
# stealth CDP/UC controls that are core product features, not malware.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.99
  size_max: 524288000

traits:
  - id: seleniumbase-wheel-package-name
    desc: SeleniumBase Python wheel package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: seleniumbase

  - id: seleniumbase-github-homepage
    desc: SeleniumBase GitHub project homepage
    for: [pkginfo, python]
    if:
      type: value
      path: home-page
      regex: '(?i)github\.com/seleniumbase/SeleniumBase'

  - id: seleniumbase-package-member-path
    desc: SeleniumBase package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])seleniumbase[\\/]'

  - id: seleniumbase-base-case-import
    desc: SeleniumBase BaseCase test harness import
    for: [python]
    if:
      type: text
      substr: from seleniumbase import BaseCase

  - id: seleniumbase-string-obfuscation-module
    desc: SeleniumBase test-string obfuscation helpers
    for: [python]
    if:
      type: text
      substr: def is_obfuscated(string)

composite_rules:
  - id: seleniumbase-browser-automation-framework
    desc: SeleniumBase browser automation testing framework
    scope: archive
    needs: 2
    any:
      - id: seleniumbase-wheel-package-name
      - id: seleniumbase-github-homepage
      - id: seleniumbase-package-member-path
      - id: seleniumbase-base-case-import
      - id: seleniumbase-string-obfuscation-module
