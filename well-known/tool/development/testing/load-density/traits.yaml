# LoadDensity (je_load_density, je-load-density-dev) — Python load & stress
# testing automation framework.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: LoadDensity Python package name
    for: [pkginfo]
    if:
      type: value
      path: name
      regex: '^je[-_]load[-_]density(_dev)?$'

  - id: upstream-repository
    desc: LoadDensity repository URL
    for: [pkginfo, python]
    if:
      type: text
      substr: Integration-Automation/LoadDensity

  - id: package-member-path
    desc: LoadDensity package directory member
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])je_load_density[\\/]'

composite_rules:
  - id: official-package
    desc: LoadDensity load testing framework identity
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: package-member-path
