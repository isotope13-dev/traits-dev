defaults:
  platforms: [unix, windows]
  for: [python, c, pkginfo, text]
  crit: notable
  conf: 0.98

traits:
  - id: ez2-aib-package-path
    desc: ez2-aib test tool package path
    if:
      type: path
      regex: '(?i)(^|/)aib/(tools|src|tests)'

  - id: ez2-aib-wheel-basename
    desc: ez2-aib package wheel basename
    for: [whl]
    if:
      type: basename
      regex: '^ez2_aib-[0-9].*\.whl$'

  - id: ez2-aib-trace-env
    desc: ez2-aib verification trace environment variable
    if:
      type: text
      regex: '\b(EZ2_VERIFY_TRACE|AIB_HOOK_CACHE|AIB_LDP_TRACE)\b'

composite_rules:
  - id: ez2-aib-tool
    desc: ez2-aib test impact analysis tool
    crit: notable
    conf: 0.98
    for: [python, whl, c, pkginfo, text]
    any:
      - id: ez2-aib-package-path
      - id: ez2-aib-wheel-basename
      - id: ez2-aib-trace-env
