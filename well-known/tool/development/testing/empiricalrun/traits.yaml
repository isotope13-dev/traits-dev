# Empirical Run Playwright utilities — Playwright test helper tools.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: empiricalrun-playwright-utils-name
    desc: Empirical Run Playwright utils package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@empiricalrun/playwright-utils"

  - id: empiricalrun-repo
    desc: Empirical Run test-generator repo URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/empirical-run/test-generator'

  - id: empirical-run-domain
    desc: Empirical Run service domain reference
    for: [javascript, typescript]
    if:
      type: text
      substr: empirical.run

  - id: empiricalrun-api-key-env
    desc: Empirical Run API key environment variable
    for: [javascript, typescript]
    if:
      type: text
      substr: EMPIRICALRUN_API_KEY

composite_rules:
  - id: empiricalrun-playwright-utils-context
    desc: Empirical Run Playwright utils context
    crit: notable
    conf: 0.99
    scope: file
    any:
      - id: empirical-run-domain
      - id: empiricalrun-api-key-env
