defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - tar
  crit: notable
  conf: 0.98
traits:
- id: package-name
  desc: Zapier platform core package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: zapier-platform-core
- id: package-member-context
  desc: Zapier platform core package member
  for:
  - javascript
  - typescript
  if:
    type: value
    path: package.json::name
    exact: zapier-platform-core
- id: archive-package-name
  desc: Zapier platform core npm archive identity
  for:
  - npm
  - tar
  if:
    type: value
    path: npm.name
    exact: zapier-platform-core
- id: archive-member-path
  desc: Zapier platform npm archive member path
  for:
  - javascript
  - typescript
  if:
    type: path
    substr: zapier-platform-core
- id: repository-coordinate
  desc: Zapier platform GitHub repository
  for:
  - package.json
  if:
    type: value
    path: repository
    substr: zapier/zapier-platform
