# Fabric — open-source AI augmentation CLI (github.com/danielmiessler/fabric).
# Embeds Go's crypto/ssh for ordinary client features; remote-forwarding
# protocol fields are library mechanics, not a reverse-access implant.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, markdown, zip, tar]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  - id: pe-go-module-path
    desc: Fabric Go module path in PE buildinfo
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/danielmiessler/fabric

  - id: elf-go-module-path
    desc: Fabric Go module path in ELF buildinfo
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/danielmiessler/fabric

  - id: binary-basename
    desc: Fabric CLI executable basename
    for: [elf, pe]
    if:
      type: value
      path: file.stem
      exact: fabric

  - id: upstream-repository-reference
    desc: Fabric upstream repository reference
    if:
      type: text
      substr: github.com/danielmiessler/fabric

composite_rules:
  - id: official-cli-binary
    desc: Official Fabric AI CLI binary identity
    crit: notable
    conf: 0.99
    all:
      - id: binary-basename
    any:
      - id: pe-go-module-path
      - id: elf-go-module-path
