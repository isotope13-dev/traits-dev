# Midscene.js (github.com/web-infra-dev/midscene) — AI-driven UI automation
# for web, Android and desktop. The @midscene/computer package grabs the
# screen with screenshot-desktop and drives mouse and keyboard so a model can
# operate the machine the developer points it at. Screen capture plus input
# control is the product, not a hidden remote-control channel.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: midscene-core-import
    desc: Imports the Midscene core or shared package
    if:
      type: text
      regex: 'from\s+[''"]@midscene/(core|shared)[/''"]'

  - id: midscene-package-name
    desc: Midscene package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@midscene/[a-z-]+$'

composite_rules:
  - id: midscene-source-context
    desc: Midscene automation framework source
    crit: exception
    conf: 0.97
    any:
      - id: midscene-core-import
      - id: midscene-package-name
