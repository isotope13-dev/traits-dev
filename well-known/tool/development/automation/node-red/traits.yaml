# Node-RED low-code runtime (nodered.org).
defaults:
  platforms: [unix, windows]
  for: [javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Node-RED npm package name
    for: [json]
    if:
      type: value
      path: name
      exact: node-red

  - id: homepage
    desc: Node-RED project homepage
    for: [json]
    if:
      type: value
      path: homepage
      exact: https://nodered.org

  - id: scoped-path
    desc: Node-RED scoped package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@node-red/'

composite_rules:
  - id: node-red-runtime
    desc: Node-RED low-code runtime package
    any:
      - id: scoped-path
      - id: package-name
