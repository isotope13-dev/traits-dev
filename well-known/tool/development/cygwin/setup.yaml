defaults:
  platforms:
  - windows
  for:
  - pe
  size_max: 8388608
traits:
- id: cygwin-setup-signature
  desc: Cygwin setup signer Jon Turney
  crit: notable
  conf: 0.99
  size_max: 5242880
  if:
    type: value
    path: pe.signatures[0].subject
    regex: Jon Turney
- id: cygwin-setup-manifest-name
  desc: Cygwin setup manifest identity
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.manifest.assembly_identity.name
    exact: RedHat.Cygwin.Setup
- id: cygwin-setup-manifest-description
  desc: Cygwin installation tool manifest description
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.manifest.description
    exact: Cygwin installation tool
composite_rules:
- id: cygwin-setup-application
  desc: Cygwin setup utility identity
  crit: notable
  conf: 0.995
  all:
  - id: cygwin-setup-manifest-name
  - id: cygwin-setup-manifest-description
