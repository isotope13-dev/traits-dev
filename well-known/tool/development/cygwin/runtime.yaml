# Cygwin runtime libraries, as opposed to the setup utility in setup.yaml.
# Cygwin distributes its runtime DLLs UPX-compressed, so any product that
# bundles a Cygwin-built component (iTop VPN's ProxyService ships 26 of them)
# carries a shelf of giant high-entropy RWX UPX1 sections that are packer
# geometry, not a payload.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 33554432

traits:
  - id: cygwin-runtime-dll-basename
    desc: Cygwin runtime DLL naming convention
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      # `cyg<library>-<soversion>.dll` is Cygwin's DLL naming scheme and is
      # not used by other toolchains.
      regex: '(?i)^cyg[a-z0-9_+.-]{1,32}-[0-9]{1,3}\.dll$'

composite_rules:
  - id: cygwin-runtime-upx-context
    desc: Recognized UPX-packed Cygwin runtime DLL
    crit: exception
    conf: 0.97
    all:
      - id: cygwin-runtime-dll-basename
      - id: metadata/binary/section/names::upx-section-pair

  # One reference for "this is a Cygwin distribution component", so a host
  # rule spends a single unless: slot on the setup utility and the runtime
  # libraries together.
  - id: cygwin-distribution-context
    desc: Recognized Cygwin distribution component
    crit: exception
    conf: 0.97
    any:
      - id: cygwin-runtime-upx-context
      - id: cygwin-setup-signature
