defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 4194304

traits:
- id: cygcheck-package-diagnostic
  desc: Cygwin package diagnostic utility
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: List system information, check installed packages
    section: .rdata
- id: mintty-terminal-emulator
  desc: Mintty Cygwin terminal emulator identity
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: 'mintty [0-9]+\.[0-9]+\.[0-9]+ \(Cygwin-.{1,32}\)'
    section: .rdata
