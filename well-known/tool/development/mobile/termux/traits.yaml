defaults:
  crit: notable
  conf: 0.99
  platforms: [android, unix]
  for: [java, source, tar]
  size_max: 500000000

traits:
  - id: termux-app-package-claim
    desc: Declares Termux Android package identity
    platforms: [android]
    for: [android_apk]
    if:
      type: value
      path: android.package
      exact: com.termux

  - id: termux-application-class
    desc: Termux application class in DEX
    for: [dex]
    if:
      type: text
      substr: "Lcom/termux/app/TermuxApplication;"

  - id: termux-service-class
    desc: Termux service class in DEX
    for: [dex]
    if:
      type: text
      substr: "Lcom/termux/app/TermuxService;"

  - id: termux-boot-package-claim
    desc: Declares Termux:Boot Android package identity
    platforms: [android]
    for: [android_apk]
    if:
      type: value
      path: android.package
      exact: com.termux.boot

  - id: termux-app-source-archive
    desc: Termux application source archive context
    if:
      type: path
      regex: '(?i)termux-termux-app-v[0-9][^\\/]*-source\.tar\.gz'
  - id: termux-app-source-member
    desc: Termux source archive member context
    for: [java, source]
    if:
      type: path
      regex: '(?i)termux-app-[0-9]'
  - id: termux-api-package-text
    desc: Termux:API package name text
    for: [xml]
    if:
      type: text
      substr: "com.termux.api"
  - id: termux-api-package-hex
    desc: Termux:API package in binary manifest
    for: [xml]
    if:
      type: hex
      pattern: '63 00 6f 00 6d 00 2e 00 74 00 65 00 72 00 6d 00 75 00 78 00 2e 00 61 00 70 00 69 00'

composite_rules:
  - id: termux-dex-identity
    desc: Termux application and service classes in DEX
    crit: exception
    conf: 0.995
    for: [dex]
    all:
      - id: termux-application-class
      - id: termux-service-class

  - id: termux-api-package
    desc: Termux:API Android package identity
    crit: notable
    conf: 0.99
    # The identity atoms both inspect the decoded/binary Android manifest.
    # Override the source-oriented file default so consumers can use this
    # composite as an exclusion on that same XML analysis unit.
    for: [xml]
    any:
      - id: termux-api-package-text
      - id: termux-api-package-hex
