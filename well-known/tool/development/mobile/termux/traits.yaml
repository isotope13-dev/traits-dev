defaults:
  crit: notable
  conf: 0.99
  platforms: [android, unix]
  for: [java, source, tar]
  size_max: 500000000

traits:
  - id: termux-app-source-archive
    desc: Termux application source archive context
    if:
      type: path
      regex: '(?i)termux-termux-app-v[0-9][^\\/]*-source\.tar\.gz'
  - id: termux-app-source-member
    desc: Termux source archive member context
    for: [java, source]
    if:
      type: path
      regex: '(?i)termux-app-[0-9]'
