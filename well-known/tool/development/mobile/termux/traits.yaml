defaults:
  crit: notable
  conf: 0.99
  platforms: [android, unix]
  for: [java, source, tar]
  size_max: 500000000

traits:
  - id: termux-app-source-archive
    desc: Termux application source archive context
    if:
      type: path
      regex: '(?i)termux-termux-app-v[0-9][^\\/]*-source\.tar\.gz'
  - id: termux-app-source-member
    desc: Termux source archive member context
    for: [java, source]
    if:
      type: path
      regex: '(?i)termux-app-[0-9]'
  - id: termux-api-package-text
    desc: Termux:API package name text
    for: [xml]
    if:
      type: text
      substr: "com.termux.api"
  - id: termux-api-package-hex
    desc: Termux:API package in binary manifest
    for: [xml]
    if:
      type: hex
      pattern: '63 00 6f 00 6d 00 2e 00 74 00 65 00 72 00 6d 00 75 00 78 00 2e 00 61 00 70 00 69 00'

composite_rules:
  - id: termux-api-package
    desc: Termux:API Android package identity
    crit: notable
    conf: 0.99
    any:
      - id: termux-api-package-text
      - id: termux-api-package-hex
