# Android Debug Bridge (adb) — benign Android developer tool basename.
# Used as a false-positive exclusion for Windows stealer-recon composites.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1
  size_max: 104857600
traits:
  - id: adb-exe-basename
    desc: Android Debug Bridge basename
    crit: baseline
    conf: 0.98
    if:
      type: path
      basename: true
      exact: 'adb.exe'
  - id: adb-client-version-banner
    desc: Android Debug Bridge version banner
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [unix, android]
    if:
      type: text
      substr: 'Android Debug Bridge version'
      section: .rodata
  - id: google-adb-windows-build-pdb
    desc: Google ADB Windows build PDB
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])packages/modules/adb/adb/windows_x86/unversioned/adb\.pdb$'

composite_rules:
  - id: google-signed-adb-windows-build-benign-context
    desc: Google-signed Android Debug Bridge Windows build
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signed/leaf::google-llc
      - id: google-adb-windows-build-pdb
