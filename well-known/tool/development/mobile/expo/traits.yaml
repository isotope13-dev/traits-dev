# Expo SDK — official React Native development platform npm packages
# (https://github.com/expo/expo).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: expo-package-name
    desc: Expo SDK package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: expo

  - id: expo-cli-package-name
    desc: Expo CLI scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@expo/cli'

  - id: archive-expo-name
    desc: Expo SDK npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: expo

  - id: package-member-expo
    desc: Expo SDK package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: expo

  - id: repository-coordinate
    desc: Expo monorepo GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: 'github.com/expo/expo'

  - id: expo-ui-package-name
    desc: Expo UI scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@expo/ui'

  - id: expo-ui-archive-name
    desc: Expo UI npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@expo/ui'

  - id: expo-ui-android-class
    desc: Expo UI Android module class
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '^expo/modules/ui/'

composite_rules:
  - id: expo-sdk-context
    desc: Expo React Native SDK package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: expo-package-name
      - id: expo-cli-package-name
      - id: archive-expo-name
      - id: package-member-expo
      - id: repository-coordinate

  - id: expo-ui-package-context
    desc: Expo UI React Native package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: expo-ui-package-name
      - id: expo-ui-archive-name
