defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: fastlane-gem-name
    desc: fastlane Ruby gem package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: fastlane

  - id: fastlane-source-repository
    desc: fastlane official source repository
    for: [ruby, gem, text]
    if:
      type: text
      substr: github.com/fastlane/fastlane

  - id: fastlane-cli-entrypoint
    desc: fastlane Ruby CLI entrypoint
    for: [ruby]
    if:
      type: path
      regex: '(^|[\\/])bin[\\/]fastlane$'

composite_rules:
  - id: official-fastlane-core-context
    desc: Official fastlane core gem context
    crit: notable
    scope: archive
    all:
      - id: fastlane-gem-name
      - id: fastlane-source-repository
