defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: debugger-frontend-package-name
    desc: React Native debugger frontend package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@react-native/debugger-frontend'

  - id: debugger-frontend-repository
    desc: React Native debugger source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: 'git+https://github.com/react/react-native.git'

  - id: debugger-frontend-directory
    desc: React Native debugger package directory
    for: [package.json]
    if:
      type: value
      path: repository.directory
      exact: packages/debugger-frontend

  - id: devtools-frontend-build-source
    desc: React Native DevTools frontend build source
    for: [text]
    if:
      type: text
      substr: 'Remote URL: https://github.com/facebook/react-native-devtools-frontend'

composite_rules:
  - id: official-package-context
    desc: Official React Native debugger package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: debugger-frontend-package-name
      - id: debugger-frontend-repository
      - id: debugger-frontend-directory
