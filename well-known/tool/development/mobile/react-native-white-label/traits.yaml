defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  conf: 0.85

traits:
  - id: react-native-white-label-title
    desc: React Native White Label product title
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: RNWL - React Native White Label
  - id: rnwl-config-path
    desc: RNWL configuration directory name reference
    crit: component
    if:
      type: text
      substr: rnwl-configs
  - id: rnwl-output-manifest
    desc: RNWL manifest filename reference
    crit: component
    if:
      type: text
      substr: rnwl.json
