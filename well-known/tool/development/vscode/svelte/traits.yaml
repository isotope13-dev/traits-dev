defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.96
  size_max: 16777216

traits:
  - id: svelte-node-modules
    desc: Svelte extension node modules
    if:
      type: path
      substr: extension/node_modules/svelte
  - id: utility-node-modules
    desc: Svelte extension utility modules
    if:
      type: path
      substr: svelte2tsx

composite_rules:
  - id: extension-bundle
    desc: Svelte VS Code extension bundle
    crit: notable
    any:
      - id: well-known/tool/development/vscode/svelte::svelte-node-modules
      - id: well-known/tool/development/vscode/svelte::utility-node-modules
