# @vscode/vsce-sign — Microsoft VS Code extension signing CLI. NativeAOT
# CoreCLR hosts (darwin/linux/windows) allocate executable pages for the JIT;
# identity only — do not loosen memory-exec.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, package.json, tar, text, javascript]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: package-name
    desc: vscode vsce-sign npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@vscode/vsce-sign'

  - id: archive-path
    desc: vsce-sign alpine npm pack path
    if:
      type: path
      regex: 'vsce-sign-alpine-(arm64|x64)@'

  # Scope-qualified so an arbitrary directory named `vsce-sign` cannot claim
  # the identity; published packages live under `@vscode/vsce-sign` with an
  # optional platform suffix (`-darwin-arm64`, `-linux-x64`, …).
  - id: package-path
    desc: vscode vsce-sign package source path
    if:
      type: path
      regex: '(?i)@vscode[\\/]vsce-sign'

  - id: binary-basename
    desc: vsce-sign CLI binary basename
    crit: notable
    for: [elf, macho, pe]
    if:
      type: basename
      exact: vsce-sign

composite_rules:
  - id: vscode-vsce-sign-tool
    desc: Microsoft VS Code extension signing tool
    any:
      - id: package-name
      - id: archive-path
      - id: package-path
      - id: binary-basename
