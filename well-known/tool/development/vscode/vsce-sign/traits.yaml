# @vscode/vsce-sign — Microsoft VS Code extension signing CLI (Alpine builds).
defaults:
  platforms: [unix, windows]
  for: [elf, pe, package.json, tar, text, javascript]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-name
    desc: vscode vsce-sign npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@vscode/vsce-sign'

  - id: archive-path
    desc: vsce-sign alpine npm pack path
    if:
      type: path
      regex: 'vsce-sign-alpine-(arm64|x64)@'

  # Scope-qualified so an arbitrary directory named `vsce-sign` cannot claim
  # the identity; the published package always lives under `@vscode/`.
  - id: package-path
    desc: vscode vsce-sign package source path
    for: [javascript, text]
    if:
      type: path
      regex: '(?i)@vscode[\\/]vsce-sign[\\/]'

  - id: binary-basename
    desc: vsce-sign CLI binary basename
    crit: notable
    for: [elf]
    if:
      type: basename
      exact: vsce-sign

composite_rules:
  - id: vscode-vsce-sign-tool
    desc: Microsoft VS Code extension signing tool
    any:
      - id: package-name
      - id: archive-path
      - id: binary-basename
