defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: nodemon-official-repository
  desc: Official nodemon GitHub repository metadata
  crit: component
  conf: 0.99
  if:
    type: value
    path: repository.url
    regex: 'github\.com[/:]remy/nodemon(\.git)?/?$'
    case_insensitive: true
- id: nodemon-variant-package-name
  desc: Nodemon repository claimed by variant name
  crit: notable
  conf: 0.98
  if:
    type: value
    path: name
    regex: '^nodemon[-_][A-Za-z0-9._-]+$'
    case_insensitive: true

composite_rules:
- id: nodemon-variant-claims-official-repository
  desc: Variant nodemon package claims the official repository
  crit: suspicious
  conf: 0.99
  all:
  - id: nodemon-official-repository
  - id: nodemon-variant-package-name
