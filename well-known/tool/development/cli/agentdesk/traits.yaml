# AgentDesk's reviewed npm wrapper downloads its own project's release binary.
# A package/repository name difference alone cannot distinguish this wrapper
# from a renamed package. Require both manifest claims and launcher content.
# Reviewed: agentdesk-tui 0.2.0, SHA-256
# 56ffa47503c9fe087554b9d977322ba25a9c42abaf86d41b133cee9a5985cf5c.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  crit: notable
  conf: 0.99
traits:
  - id: npm-package-name
    desc: AgentDesk TUI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agentdesk-tui
  - id: npm-repository
    desc: AgentDesk source repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: git+https://github.com/vijaygovindBiju/AgentDesk.git
  - id: launcher-release-repository
    desc: AgentDesk launcher release repository literal
    for: [javascript]
    if:
      type: literal
      exact: vijaygovindBiju/AgentDesk
  - id: launcher-release-asset
    desc: AgentDesk Linux release asset template
    for: [javascript]
    if:
      type: literal
      exact: 'AgentDesk-v${PKG_VERSION}-linux-${targetArch}.tar.gz'
composite_rules:
  - id: reviewed-release-wrapper
    desc: AgentDesk release launcher and manifest
    crit: exception
    scope: archive
    all:
      - id: npm-package-name
      - id: npm-repository
      - id: launcher-release-repository
      - id: launcher-release-asset
