# scc — System Context Compiler CLI by @carterlasalle (github.com/carterlasalle/scc).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: scc-github-repo
    desc: scc GitHub repository URL
    for: [rust, javascript, typescript, shell, markdown, cargo.toml]
    if:
      type: text
      substr: "github.com/carterlasalle/scc"

  - id: scc-install-script-url
    desc: scc official release installer URL
    for: [rust, shell, markdown]
    if:
      type: text
      substr: github.com/carterlasalle/scc/releases/download
