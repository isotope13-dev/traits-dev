defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: Supercode CLI npm package identity
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^@volter/supercode-cli(-[a-z0-9_-]+)?$
- id: main-package-name
  desc: Supercode harness npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@volter/supercode'
- id: teams-package-name
  desc: Supercode Teams npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@volter/supercode-teams'
- id: npm-package-name
  desc: Supercode CLI npm archive identity
  for:
  - npm
  if:
    type: value
    path: npm.name
    regex: ^@volter/supercode-cli(-[a-z0-9_-]+)?$
- id: npm-main-package-name
  desc: Supercode harness npm archive name
  for:
  - npm
  if:
    type: value
    path: npm.name
    exact: '@volter/supercode'
- id: npm-teams-package-name
  desc: Supercode Teams npm archive name
  for:
  - npm
  if:
    type: value
    path: npm.name
    exact: '@volter/supercode-teams'
- id: repository-url
  desc: Supercode official GitHub repository URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: ^(git\+)?https://github\.com/volter-ai/supercode(\.git)?$
- id: npm-repository-url
  desc: Supercode npm repository URL
  for:
  - npm
  if:
    type: value
    path: npm.repository.url
    regex: ^(git\+)?https://github\.com/volter-ai/supercode(\.git)?$
- id: teams-job-exec-module-path
  desc: Supercode Teams remote job-exec module path
  for:
  - python
  if:
    type: path
    regex: remote[\\/]job-exec\.py$
- id: porthole-hook-preload-marker
  desc: Supercode Teams porthole NODE_OPTIONS hook
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: porthole-hook.cjs
- id: teams-package-reference
  desc: Supercode Teams package name reference
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: '@volter/supercode-teams'
- id: supercode-terminal-import
  desc: Supercode terminal helper import
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: '@volter/supercode-terminal'
composite_rules:
- id: official-package-identity
  desc: Official Supercode CLI package identity
  crit: exception
  any:
  - id: package-name
  - id: npm-package-name
- id: official-repository-identity
  desc: Official Supercode repository identity
  crit: exception
  any:
  - id: repository-url
  - id: npm-repository-url
- id: official-package-repository-pair
  desc: Official Supercode package-repository pair
  crit: exception
  all:
  - id: official-package-identity
  - id: official-repository-identity
