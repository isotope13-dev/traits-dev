# @volter/supercode-cli-* is the official platform binary distribution package
# for Volter AI's Supercode CLI coding agent, published from volter-ai/supercode.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Supercode CLI npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@volter/supercode-cli(-[a-z0-9_-]+)?$'

  - id: npm-package-name
    desc: Supercode CLI npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@volter/supercode-cli(-[a-z0-9_-]+)?$'

  - id: repository-url
    desc: Supercode CLI official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/volter-ai/supercode(\.git)?$'

  - id: npm-repository-url
    desc: Supercode CLI npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/volter-ai/supercode(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official Supercode CLI package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Supercode CLI repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official Supercode CLI package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
