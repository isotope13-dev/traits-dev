# Knowtarium — E2EE AI agent workspace SDK, CLI, and MCP server (Knowtarium/knowtarium-sdk).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Knowtarium npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: "knowtarium"

  - id: npm-package-name
    desc: Knowtarium npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "knowtarium"

  - id: repository-url
    desc: Knowtarium official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(?i)(git\+ssh://git@|https://)github\.com/knowtarium/knowtarium-sdk(\.git)?$'

  - id: npm-repository-url
    desc: Knowtarium npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(?i)(git\+ssh://git@|https://)github\.com/knowtarium/knowtarium-sdk(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official Knowtarium package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Knowtarium repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official Knowtarium package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
