# static-php-cli (spc) — Static PHP Binary and Extension Builder
# Single-file standalone PHP runtime bundled with phpmicro and micro.sfx.
# The phar archive is appended to the micro.sfx runtime stub;
# PHP executes the embedded phar directly.
defaults:
  platforms: [unix, windows]
  for: [php, elf]
  crit: notable
  conf: 0.98
  size_max: 10485760

traits:
  - id: spc-phar-map
    desc: static-php-cli PHAR map marker
    if:
      type: text
      substr: "Phar::mapPhar('spc-php.phar')"

  - id: spc-console-application-import
    desc: static-php-cli console application import
    for: [php]
    if:
      type: import
      exact: "spc/consoleapplication"

  - id: spc-script-filename
    desc: static-php-cli script entry marker
    if:
      type: text
      substr: "phar://spc-php.phar/bin/spc"

composite_rules:
  - id: static-php-cli-distribution
    desc: Recognized static-php-cli standalone distribution
    crit: exception
    conf: 0.98
    scope: outer
    for: [phar, elf, php]
    any:
      - id: spc-phar-map
      - id: spc-console-application-import
      - id: spc-script-filename
