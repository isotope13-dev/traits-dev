# squeez (claudioemmanuel/squeez) — Claude Code hook token compressor. The npm
# wrapper postinstall may pipe the project's own raw.githubusercontent install.sh
# when the release binary is missing; that is documented bootstrap, not a dropper.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: npm-archive-package-name
    desc: squeez npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: squeez

  - id: manifest-package-name
    desc: squeez package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: squeez

  - id: upstream-repository
    desc: squeez GitHub upstream
    for: [javascript, markdown, text, package.json]
    size_min: 1
    if:
      type: text
      regex: '(?i)github\.com[/:]claudioemmanuel/squeez'

  - id: npm-upstream-repository
    desc: squeez npm repo metadata
    for: [npm]
    if:
      type: text
      regex: '(?i)github\.com[/:]claudioemmanuel/squeez'

  - id: official-raw-install-sh-url
    desc: squeez raw GitHub install.sh URL
    for: [javascript, shell, markdown, text]
    size_min: 1
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/claudioemmanuel/squeez/.{0,40}/install\.sh'

composite_rules:
  - id: declared-package-name
    desc: squeez declared npm package name
    any:
      - id: npm-archive-package-name
      - id: manifest-package-name

  - id: package-identity
    desc: Recognized squeez token compressor npm package
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: npm-archive-package-name
      - id: manifest-package-name
      - id: upstream-repository
      - id: npm-upstream-repository
      - id: official-raw-install-sh-url

  - id: archive-context
    desc: squeez archive benign context
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json, javascript, shell, markdown, text]
    all:
      - id: declared-package-name
    any:
      - id: upstream-repository
      - id: npm-upstream-repository
      - id: official-raw-install-sh-url
