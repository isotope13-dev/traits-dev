# abra — Co-op Cloud command-line interface tool.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: abra-install-script-url
    desc: abra official installer URL
    for: [go, shell, markdown]
    if:
      type: text
      regex: 'https?://(install\.abra\.coopcloud\.tech|git\.coopcloud\.tech/coop-cloud/abra)'
