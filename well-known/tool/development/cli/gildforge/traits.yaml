# GildForge CLI and runner packages published under the @gildforge/ scope.
# GildForge publishes platform binary packages (@gildforge/cli-darwin-arm64,
# @gildforge/cli-linux-x64, ...) from its gildforge/cli repository.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: GildForge scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@gildforge/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: GildForge scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@gildforge/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: GildForge GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(?i)(git\+)?https://github\.com/gildforge/cli(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: GildForge GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(?i)(git\+)?https://github\.com/gildforge/cli(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: GildForge GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(?i)(git\+)?https://github\.com/gildforge/cli(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official GildForge package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official GildForge repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official GildForge package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
