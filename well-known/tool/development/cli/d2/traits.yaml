defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98

traits:
  - id: vendored-source-path
    desc: D2 vendored source path
    if:
      type: path
      regex: 'oss\.terrastruct\.com[\\/]d2([\\/]|$)'

composite_rules:
  - id: d2-brotli-decoder-context
    desc: D2 vendored Brotli decoder context
    crit: exception
    conf: 0.99
    all:
      - id: vendored-source-path
      - id: micro-behaviors/data/decompress/brotli::brotli-decode-reference
