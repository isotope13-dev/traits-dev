# Firebase CLI — official Command-Line Interface for Firebase (firebase.google.com).
# Standalone binaries are packaged with firepit into a self-contained Node.js runtime.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, package.json, javascript, text]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: firebase-tools-package-name
    desc: firebase-tools npm package name
    for: [package.json]
    size_max: 1000000
    if:
      type: value
      path: name
      exact: firebase-tools

  - id: firebase-tools-repo-url
    desc: Firebase CLI upstream repository URL
    size_min: 1000
    if:
      type: text
      substr: github.com/firebase/firebase-tools

  - id: firepit-snapshot-marker
    desc: Firepit snapshot runtime path marker
    for: [elf, macho, pe, javascript, text]
    size_min: 1000000
    if:
      type: text
      substr: /snapshot/firepit

  - id: firepit-bootstrap-marker
    desc: Firepit bootstrap function identifier
    for: [elf, macho, pe, javascript, text]
    size_min: 1000000
    if:
      type: text
      substr: SetupFirebaseTools

  - id: firebase-cli-binary-name
    desc: Firebase CLI binary executable name
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: basename
      regex: '^firebase(-tools(-linux|-macos|-win)?)?(\.exe)?$'

composite_rules:
  - id: firebase-cli-standalone-binary
    desc: Firebase CLI standalone executable identity
    for: [elf, macho, pe]
    crit: notable
    conf: 0.99
    any:
      - id: firepit-snapshot-marker
      - id: firepit-bootstrap-marker
      - id: firebase-tools-repo-url

  - id: firebase-cli-context
    desc: Recognized Firebase CLI tool context
    crit: notable
    conf: 0.99
    any:
      - id: firebase-cli-standalone-binary
      - id: firebase-tools-package-name
      - id: firebase-cli-binary-name
