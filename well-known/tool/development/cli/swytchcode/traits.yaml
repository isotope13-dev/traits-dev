# Swytchcode CLI — official integration/workflow CLI distributed as platform
# npm packages (swytchcode-cli-linux-x64, etc.). The Go binary embeds its own
# curl|sh installer one-liner in help/onboarding text; that publication is not
# a download-and-execute stager.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: Swytchcode CLI npm package name
    for: [npm]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: npm.name
      regex: '^swytchcode(-cli-(darwin|linux|win32)-(arm64|x64))?$'

  - id: npm-manifest-name
    desc: Swytchcode CLI manifest package name
    for: [package.json]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^swytchcode(-cli-(darwin|linux|win32)-(arm64|x64))?$'

  - id: npm-repository
    desc: Swytchcode CLI GitLab repository URL
    for: [npm]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: npm.repository.url
      regex: '^git\+https://gitlab\.com/swytchcode/(cli|swytchcode-cli)\.git$'

  - id: npm-manifest-repository
    desc: Swytchcode CLI manifest GitLab repository URL
    for: [package.json]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: repository.url
      regex: '^git\+https://gitlab\.com/swytchcode/(cli|swytchcode-cli)\.git$'

  - id: elf-go-module
    desc: Swytchcode CLI Linux Go module identity
    for: [elf]
    platforms: [linux]
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: elf.go.module.path
      exact: gitlab.com/swytchcode/swytchcode-cli

  - id: elf-go-command
    desc: Swytchcode CLI Linux Go command path
    for: [elf]
    platforms: [linux]
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: elf.go.path
      exact: gitlab.com/swytchcode/swytchcode-cli/cmd/swytchcode

  - id: macho-go-module
    desc: Swytchcode CLI macOS Go module identity
    for: [macho]
    platforms: [macos]
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: macho.go.module.path
      exact: gitlab.com/swytchcode/swytchcode-cli

  - id: macho-go-command
    desc: Swytchcode CLI macOS Go command path
    for: [macho]
    platforms: [macos]
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: macho.go.path
      exact: gitlab.com/swytchcode/swytchcode-cli/cmd/swytchcode

  - id: pe-go-module
    desc: Swytchcode CLI Windows Go module identity
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: pe.go.module.path
      exact: gitlab.com/swytchcode/swytchcode-cli

  - id: pe-go-command
    desc: Swytchcode CLI Windows Go command path
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: pe.go.path
      exact: gitlab.com/swytchcode/swytchcode-cli/cmd/swytchcode

composite_rules:
  - id: official-swytchcode-cli-package-repository-pair
    desc: Official Swytchcode CLI npm package and repository pair
    for: [npm, tar, zip]
    crit: exception
    conf: 0.99
    all:
      - id: npm-package-name
      - id: npm-repository

  - id: swytchcode-cli-linux-context
    desc: Official Swytchcode CLI Linux binary context
    crit: exception
    conf: 0.99
    for: [elf]
    platforms: [linux]
    all:
      - id: elf-go-module
      - id: elf-go-command

  - id: swytchcode-cli-macos-context
    desc: Official Swytchcode CLI macOS binary context
    crit: exception
    conf: 0.99
    for: [macho]
    platforms: [macos]
    all:
      - id: macho-go-module
      - id: macho-go-command

  - id: swytchcode-cli-windows-context
    desc: Official Swytchcode CLI Windows binary context
    crit: exception
    conf: 0.99
    for: [pe]
    platforms: [windows]
    all:
      - id: pe-go-module
      - id: pe-go-command

  - id: swytchcode-cli-context
    desc: Official Swytchcode CLI binary context
    crit: exception
    conf: 0.99
    any:
      - id: swytchcode-cli-linux-context
      - id: swytchcode-cli-macos-context
      - id: swytchcode-cli-windows-context
