# Orbit is an open-source HDL package manager and build system.  These rules
# identify its source and release layouts; they do not treat its expected
# downloads, TLS/SSH support, archive handling, or build-process execution as
# malicious behavior.
defaults:
  platforms: [unix, windows]
  for: [zip]
  crit: component
  conf: 0.96

traits:
  - id: orbit-github-source-root
    desc: Orbit GitHub source-tree root path
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/(cdotrus|chaseruskin)/orbit@v[0-9][^/]*/'

  - id: orbit-cargo-manifest-path
    desc: Orbit source archive Cargo manifest path
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/(cdotrus|chaseruskin)/orbit@v[^/]+/Cargo\.toml$'

  - id: orbit-source-main-path
    desc: Orbit source archive Rust entry point path
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/(cdotrus|chaseruskin)/orbit@v[^/]+/src/main\.rs$'

  - id: orbit-readme-path
    desc: Orbit source archive README path
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/(cdotrus|chaseruskin)/orbit@v[^/]+/README\.md$'

  - id: orbit-release-binary-path
    desc: Orbit prebuilt release binary path
    if:
      type: value
      path: archive.members[*].path
      regex: 'orbit-[0-9]+\.[0-9]+\.[0-9]+-[^/]+/bin/orbit$'

  - id: orbit-release-installer-path
    desc: Orbit prebuilt release installer path
    if:
      type: value
      path: archive.members[*].path
      regex: 'orbit-[0-9]+\.[0-9]+\.[0-9]+-[^/]+/install$'

  - id: orbit-release-readme-path
    desc: Orbit prebuilt release README path
    if:
      type: value
      path: archive.members[*].path
      regex: 'orbit-[0-9]+\.[0-9]+\.[0-9]+-[^/]+/README\.txt$'

composite_rules:
  - id: orbit-source-archive
    desc: Orbit HDL package-manager source archive
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: orbit-github-source-root
      - id: orbit-cargo-manifest-path
      - id: orbit-source-main-path
      - id: orbit-readme-path

  - id: orbit-release-archive
    desc: Orbit prebuilt release archive layout
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: orbit-release-binary-path
      - id: orbit-release-installer-path
      - id: orbit-release-readme-path
