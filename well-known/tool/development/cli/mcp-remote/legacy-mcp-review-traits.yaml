---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: npx-mcp-remote-command-line
  desc: npx mcp-remote command line
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\bnpx\\s+(-\\S+\\s+){0,4}mcp-remote\\b"
- id: mcp-remote-package-reference
  desc: mcp-remote package reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: mcp-remote
composite_rules:
- id: mcp-remote-launcher-near-config-write
  desc: MCP remote launcher configuration near file write
  crit: notable
  conf: 0.93
  for: [javascript, typescript]
  scope: file
  near_bytes: 2500
  all:
  - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
  - id: well-known/tool/development/cli/mcp-remote::remote-mcp-server-over-npx
- id: remote-mcp-server-over-npx
  desc: Remote MCP package and endpoint references with launcher text
  crit: notable
  conf: 0.93
  all:
  - id: well-known/tool/development/cli/mcp-remote::mcp-remote-package-reference
  - id: micro-behaviors/communications/url/resource-path/automation::external-mcp-sse-endpoint
  any:
  - id: well-known/lib/development/npx::config-command-npx
  - id: well-known/tool/development/cli/mcp-remote::npx-mcp-remote-command-line
