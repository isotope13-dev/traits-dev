# npm exec can launch a registry package; this matcher observes the configuration text.
---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: config-command-npm-exec
  desc: Configuration command field names npm exec
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bcommand["']?\s*:\s*["']npm["'][\s\S]{0,120}["']exec["']
