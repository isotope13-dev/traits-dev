# capsurface — supply-chain security scanner by Victor Martins
# Capability-aware supply-chain scanner computing dependency capability surfaces in CI.
# Bundles test corpus of evasion patterns and example packages for demonstration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98
  size_max: 5242880

traits:
  - id: manifest-name
    desc: capsurface manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: capsurface

  - id: repository-url
    desc: capsurface repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/VictorMartins3/capsurface'

  - id: scanner-summary
    desc: capsurface scanner description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)capability-aware supply-chain scanner'

  - id: scanner-import
    desc: Relative import of capsurface scanner module
    for: [javascript, typescript]
    if:
      type: text
      substr: "require('../lib/scanner')"

  - id: evasion-corpus-comment
    desc: Evasion benchmark detection corpus comment
    for: [javascript, typescript]
    if:
      type: text
      substr: "Detection corpus. Every fixture is inert"

  - id: demo-payload-comment
    desc: Simulated payload comment in demo package
    for: [javascript, typescript]
    if:
      type: text
      substr: "Simulated worm-like payload for demo purposes only"

composite_rules:
  - id: capsurface-distribution
    desc: Recognized capsurface supply-chain scanner distribution
    crit: exception
    conf: 0.98
    any:
      - id: manifest-name
      - id: repository-url
      - id: scanner-summary
      - id: scanner-import
      - id: evasion-corpus-comment
      - id: demo-payload-comment
