# Maka CLI — command-line tool for scaffolding Meteor applications.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: maka-cli-package-name
    desc: maka-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@maka/maka-cli'

  - id: maka-cli-archive-name
    desc: maka-cli npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@maka/maka-cli'

  - id: maka-cli-repository-url
    desc: Maka CLI GitHub repository URL
    if:
      type: text
      substr: 'github.com/maka-io/maka-cli'

  - id: maka-cli-scaffolding-text
    desc: Maka CLI scaffolding command text
    if:
      type: text
      regex: '(?i)\b(maka create|Maka-CLI|Create a new Maka Meteor project)\b'

composite_rules:
  - id: maka-cli-context
    desc: Recognized Maka CLI scaffolding tool context
    crit: notable
    conf: 0.99
    any:
      - id: maka-cli-package-name
      - id: maka-cli-archive-name
      - id: maka-cli-repository-url
      - id: maka-cli-scaffolding-text
