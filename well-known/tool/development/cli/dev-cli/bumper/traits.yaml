# @enke.dev/bumper — repository dependency and runtime updater CLI by David Enke.
# The bundled CLI contains an openBrowser() helper with detached spawn,
# which sits near the printed install.sh shell pipeline remediation hint.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: enke.dev bumper npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@enke.dev/bumper"

  - id: github-repo
    desc: enke.dev bumper repository URL
    if:
      type: text
      substr: "github.com/enke-dev/bumper"

  - id: install-script-url
    desc: enke.dev bumper official install script URL
    for: [javascript, typescript, shell, markdown]
    if:
      type: text
      substr: "raw.githubusercontent.com/enke-dev/bumper/main/install.sh"

composite_rules:
  - id: bumper-cli
    desc: enke.dev bumper repo updater CLI
    crit: exception
    any:
      - id: package-name
      - id: github-repo
      - id: install-script-url
