# Nx's `nx release` remote-release clients. To publish a GitHub release on the
# developer's behalf, `GithubRemoteReleaseClient.resolveTokenData` walks the
# ordinary developer auth chain -- `GITHUB_TOKEN`/`GH_TOKEN` first, then the
# user's own `~/.config/gh/hosts.yml`, and only for an ssh/https session does
# it shell out to `gh auth token` -- and hands the result straight to its own
# axios client as an `Authorization` header. The token never leaves the
# machine's own API calls. Nx ships inside a great many Electron and monorepo
# bundles, so the module is worth recognizing by its exported symbols rather
# than by the path it happens to be unpacked to.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: nx-github-remote-release-client-class
    desc: Nx GitHub release-publishing client class
    if:
      type: text
      substr: GithubRemoteReleaseClient

  - id: nx-default-create-release-provider
    desc: Nx default release-provider export
    if:
      type: text
      substr: defaultCreateReleaseProvider

composite_rules:
  - id: nx-github-release-client-module
    desc: Recognized Nx GitHub release-client module
    crit: exception
    conf: 0.97
    all:
      - id: nx-github-remote-release-client-class
      - id: nx-default-create-release-provider
