# Official Nx packages are published under the @nx/ scope from the nrwl/nx
# monorepo (`repository.directory: packages/<name>`). Their READMEs inherit the
# monorepo's product heading ("Nx: Smart Monorepos · Fast Builds") rather than
# the package name, which is inherited documentation, not a clone's leftover.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: nx-scoped-package-identity
    desc: Nx scoped package identity
    if:
      type: value
      path: name
      regex: '^@nx/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: nx-github-repository-url
    desc: Nx GitHub monorepo repository URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/nrwl/nx(\.git)?$'

composite_rules:
  - id: official-scope-repository-pair
    desc: Official Nx package repository pairing
    crit: exception
    all:
      - id: nx-scoped-package-identity
      - id: nx-github-repository-url
