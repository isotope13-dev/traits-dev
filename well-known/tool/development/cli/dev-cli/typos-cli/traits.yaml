# crate-ci/typos (and its bundled codespell-compatible dictionary) is a
# source-code spell checker. Its correction dictionaries are CSV/txt tables
# mapping thousands of real-world misspellings to their correct spelling
# (e.g. `reqeusts,requests`) -- every misspelling the tool can fix is
# necessarily present in its own source tree as data, not an instruction.
defaults:
  platforms: [linux, macos, windows]
  for: [python, text, markdown, source, scripts, cargo.toml]
  crit: notable
  conf: 0.97

traits:
  - id: typos-dict-crate-path
    desc: typos-dict correction-dictionary crate path
    if:
      type: path
      regex: '(^|[\\/])(typos-dict|codespell-dict)[\\/]'
  - id: typos-dict-package-name
    desc: typos-dict Cargo package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^(typos-dict|codespell-dict)$'

composite_rules:
  - id: typos-dict-context
    desc: crate-ci/typos correction-dictionary source context
    crit: notable
    conf: 0.98
    any:
      - id: typos-dict-crate-path
      - id: typos-dict-package-name
