defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

traits:
  - id: official-release-url-template
    desc: Official evo release URL template
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      substr: "github.com/evo-hq/evo/releases/download/v{version}/{asset}"
  - id: hook-drain-release-asset-name
    desc: Evo hook drain release asset name
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      substr: "evo-hook-drain-"

  # The written-stager fragment consumed by python-installer-writes-remote-exec-stager:
  # an exec binding assigned then invoked on the response of a URL-bearing call.

composite_rules:
  - id: official-hook-drain-release
    desc: Official evo hook drain release
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    all:
      - id: well-known/tool/development/cli/evo::official-release-url-template
      - id: well-known/tool/development/cli/evo::hook-drain-release-asset-name
