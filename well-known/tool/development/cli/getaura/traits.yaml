# Aura — vibe coding companion CLI for coding agents (JohnFazio1/aura).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Aura npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: "getaura"

  - id: npm-package-name
    desc: Aura npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "getaura"

  - id: repository-url
    desc: Aura official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(?i)(git\+)?https://github\.com/johnfazio1/aura(\.git)?$'

  - id: npm-repository-url
    desc: Aura npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(?i)(git\+)?https://github\.com/johnfazio1/aura(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official Aura package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Aura repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official Aura package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
