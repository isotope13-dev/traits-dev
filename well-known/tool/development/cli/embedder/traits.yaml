# Embedder CLI — embedded systems and firmware development CLI and toolkit.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json, elf, macho]
  crit: notable
  conf: 0.98
  size_min: 10
  size_max: 500000000

traits:
  - id: embedder-package-name
    desc: Embedder npm package name
    for: [package.json]
    if:
      type: value
      path: package_json.name
      regex: '^@embedder/embedder(-[a-z0-9-]+)?$'

  - id: embedder-repository-url
    desc: Embedder repository URL
    for: [package.json]
    if:
      type: value
      path: package_json.repository.url
      regex: '(?i)github\.com/embedder-dev/embedder-cli(\.git)?/?$'

  - id: embedder-cli-binary-name
    desc: Embedder CLI binary name
    for: [elf, macho]
    size_min: 1000000
    size_max: 500000000
    if:
      type: basename
      exact: embedder

  - id: embedder-server-bridge-marker
    desc: Embedder bridge server identity
    for: [elf, macho]
    size_min: 1000000
    size_max: 500000000
    if:
      type: text
      section: .bun
      substr: embedder-bridge

composite_rules:
  - id: embedder-cli
    desc: Embedder embedded systems development CLI
    crit: notable
    conf: 0.98
    any:
      - id: embedder-package-name
      - id: embedder-repository-url
      - id: embedder-server-bridge-marker
      - id: embedder-cli-binary-name
