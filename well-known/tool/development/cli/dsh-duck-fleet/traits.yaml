# dsh-duck-fleet — DuckFleet multi-machine delegation for DeepSeek Harness (new-sailfish/duck-fleet).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: dsh-duck-fleet npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "dsh-duck-fleet"

  - id: npm-package-name
    desc: dsh-duck-fleet npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "dsh-duck-fleet"

  - id: repository-url
    desc: dsh-duck-fleet official repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(?i)(git\+https?://|https?://)github\.com/new-sailfish/duck-fleet(\.git)?$'

  - id: npm-repository-url
    desc: dsh-duck-fleet npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(?i)(git\+https?://|https?://)github\.com/new-sailfish/duck-fleet(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official dsh-duck-fleet package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official dsh-duck-fleet repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official dsh-duck-fleet package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
