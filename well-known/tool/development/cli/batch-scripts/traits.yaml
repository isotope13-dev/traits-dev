defaults:
  platforms: [unix, windows]
  for: [batch]
  size_max: 1000000
traits:
  - id: batch-scripts-iexpress-hybrid-fixture-name
    desc: batch.scripts IExpress hybrid fixture basename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)^(licenseAgreement|OKPopup)\.bat$'
  - id: batch-scripts-iexpress-example-path
    desc: batch.scripts IExpress hybrid example path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(?i)iexpress[\\/](hidder|bat2exeIEXP|iexpYNButton)\.bat$'
  - id: batch-scripts-bat2exe-example-name
    desc: batch.scripts Bat2Exe example basename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      exact: Bat2Exe 1.0.bat
  - id: batch-scripts-iexpress-example-name
    desc: batch.scripts IExpress hybrid example basename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)^(hidder|bat2exeIEXP|iexpYNButton)\.bat$'
  - id: windows11-scripts-admx-name-comment
    desc: Windows11 tweak script basename context
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)^((Minimal|Standard|Expert)_Install|Windows11Tweaks)\.bat$'
  - id: everythingportable-launcher-path
    desc: EverythingPortable launcher batch path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(?i)[\\/]EverythingPortable[\\/]launch_[a-z0-9_]+\.bat$'
  - id: everythingportable-launcher-title
    desc: EverythingPortable portable launcher title
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)Portable [A-Za-z0-9+_. -]+ Launcher - Helper Edition'
  - id: undeletable-dir-example-path
    desc: Undeletable directory example batch path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(?i)[\\/]undeletable-dirs-on-desktop[\\/]script\.bat$'
  - id: pytorch-ci-sevenzip-installer
    desc: PyTorch CI 7-Zip installer batch
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: sourceforge.net/projects/sevenzip/files/7-Zip/
  - id: intel-registration-center-download
    desc: Intel Registration Center download URL
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://registrationcenter-download.intel.com/akdlm/
  # Intel renamed the bundle: older scripts fetch `intel-dle-installer.exe`,
  # current ones fetch versioned `intel-deep-learning-essentials-*_offline.exe`
  # builds from the same Registration Center path.
  - id: intel-dle-local-installer
    desc: Intel Deep Learning Essentials local installer
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'intel-(dle-installer|deep-learning-essentials-[\w.+-]{1,40}_offline)\.exe'
  # The converter ships a directory of .cmd files that call each other --
  # convert-UUP.cmd is the entry point, create_virtual_editions.cmd and the
  # rest do the image servicing -- so the marker names the directory rather
  # than the one entry script.
  - id: uup-converter-wimlib-batch
    desc: UUP converter wimlib batch script
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(?i)uup-converter-wimlib[\\/].{1,40}\.cmd$'
  - id: protobuf-kokoro-source-path
    desc: Protobuf Kokoro source path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)protobuf[\\/]kokoro[\\/]'
  - id: protobuf-multibuild-pinned-revision
    desc: Protobuf multibuild pinned revision
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: git checkout b89bb903e94308be79abefa4f436bf123ebb1313

  - id: pypy-bitbucket-download-url
    desc: PyPy official Bitbucket download URL
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: bitbucket.org/pypy/pypy/downloads/

composite_rules:
  - id: intel-dle-official-installer
    desc: Official Intel Deep Learning Essentials installer
    crit: exception
    conf: 0.99
    all:
      - id: intel-registration-center-download
      - id: intel-dle-local-installer
  - id: protobuf-kokoro-wheel-builder
    desc: Protobuf Kokoro Python wheel builder
    crit: exception
    conf: 0.99
    all:
      - id: protobuf-kokoro-source-path
      - id: protobuf-multibuild-pinned-revision
  - id: appveyor-pypy-ci-installer
    desc: AppVeyor PyPy CI installer script
    crit: exception
    conf: 0.98
    all:
      - id: pypy-bitbucket-download-url
      - id: micro-behaviors/data/archive/extract/capability::sevenzip-extract-cmd
