# dotenvx — secure dotenv CLI by @motdotla.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 10
  size_max: 20000000

traits:
  - id: dotenvx-package-name
    desc: dotenvx npm package name
    for: [package.json]
    if:
      type: value
      path: package_json.name
      exact: "@dotenvx/dotenvx"

  - id: dotenvx-github-repo
    desc: dotenvx GitHub repository URL
    for: [package.json, javascript, typescript, markdown]
    if:
      type: text
      substr: "github.com/dotenvx/dotenvx"

  - id: dotenvx-install-script-url
    desc: dotenvx official install script URL
    for: [javascript, typescript, shell, markdown]
    if:
      type: text
      substr: "dotenvx.sh"

  - id: dotenvx-armor-url
    desc: dotenvx armor hub URL
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: "armor.dotenvx.com"

composite_rules:
  - id: dotenvx-cli
    desc: dotenvx configuration management CLI
    conf: 0.99
    scope: outer
    any:
      - id: dotenvx-package-name
      - id: dotenvx-github-repo
      - id: dotenvx-install-script-url
      - id: dotenvx-armor-url
    needs: 2
