# Official Lark/Feishu CLI (github.com/larksuite/cli). It keeps its own app
# secret and tenant/user access tokens in a local config and sends them to the
# Lark Open Platform API, so a credential read followed by a socket send is its
# normal operation. Suppress that shape only when the vendor module path and a
# Lark Open Platform host are both present in the same binary.
defaults:
  for: [pe, elf, macho]
  crit: notable
  conf: 0.97

traits:
  - id: lark-cli-go-module-pe
    for: [pe]
    platforms: [windows]
    desc: Official Lark CLI Go module in PE
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/larksuite/cli

  - id: lark-cli-go-module-elf
    for: [elf]
    platforms: [unix]
    desc: Official Lark CLI Go module in ELF
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/larksuite/cli

  - id: lark-cli-go-module-macho
    for: [macho]
    platforms: [macos]
    desc: Official Lark CLI Go module in Mach-O
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/larksuite/cli

  - id: lark-open-platform-host
    platforms: [unix, windows]
    desc: Lark Open Platform API host string
    if:
      type: text
      regex: 'open\.(feishu\.cn|larksuite\.com)'

composite_rules:
  - id: lark-cli-official-context
    desc: Official Lark CLI binary with its Open Platform API host
    platforms: [unix, windows, macos]
    crit: exception
    conf: 0.97
    all:
      - id: lark-open-platform-host
    any:
      - id: lark-cli-go-module-pe
      - id: lark-cli-go-module-elf
      - id: lark-cli-go-module-macho
