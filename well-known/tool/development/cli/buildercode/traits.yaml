# Builder.io CLI (buildercode) — AI-powered code generation CLI.
# Official CLI for Builder.io (github.com/BuilderIO/builder).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, markdown, text, powershell, shell, batch]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Builder.io buildercode npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@builder.io/buildercode"

  - id: official-installer-url
    desc: Official Builder.io installer URL
    crit: notable
    conf: 0.99
    for: [javascript, typescript, html, markdown, shell, powershell, batch, text]
    if:
      type: text
      regex: 'https?://(www\.)?builder\.io/install\.(ps1|sh)\b'

  - id: builder-io-powershell-piped-installer-command
    desc: Builder.io PowerShell installer piped to IEX
    crit: notable
    conf: 0.95
    for: [javascript, typescript, powershell, batch, shell, text]
    if:
      type: text
      regex: '(?i)(irm|Invoke-RestMethod)\s+\S*builder\.io/install\.ps1\s*\|\s*(iex|Invoke-Expression)'
