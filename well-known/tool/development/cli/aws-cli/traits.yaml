# AWS CLI (aws-cli / aws) — official Command-Line Interface for Amazon Web Services.
# Standalone binaries are packaged with PyInstaller into self-contained runtimes,
# signed with Apple Developer ID (AMZN Mobile LLC, Team ID 94KV3E626L).
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 500000000

traits:
  - id: aws-cli-team-id
    desc: AWS CLI official macOS signing Team ID
    if:
      type: value
      path: macho.code_signature.team_id
      exact: "94KV3E626L"

  - id: aws-cli-binary-basename
    desc: AWS CLI binary basename
    if:
      type: basename
      exact: aws

composite_rules:
  - id: aws-cli-binary
    desc: Official AWS CLI standalone executable
    crit: notable
    conf: 0.99
    all:
      - id: aws-cli-team-id
      - id: aws-cli-binary-basename
