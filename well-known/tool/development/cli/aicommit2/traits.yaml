# aicommit2's GitHub Models login is a user-invoked provider setup command.
# Its helper reads the user's GitHub CLI token and saves it for that provider.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.94

traits:
  - id: github-models-login-command
    desc: Declares a GitHub Models login command
    if:
      type: text
      regex: 'name:"github-login".{0,800}description:"Login to GitHub and setup access to GitHub Models"'

  - id: github-models-token-setting
    desc: Stores token for GitHub Models
    if:
      type: text
      regex: 'GITHUB_MODELS\.key.{0,100}GitHub token stored for GitHub Models access'

composite_rules:
  - id: github-models-login-context
    desc: aicommit2 GitHub Models login helper context
    crit: exception
    conf: 0.97
    all:
      - id: github-models-login-command
      - id: github-models-token-setting
