# Haril (@fasaled/haril) — NTFS / file-lifecycle forensic CLI (haril-ts).
# Bun bundles ship the Windows haril_native.dll as Base64 inside dist/cli.js.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: haril-npm-package-name
    desc: Haril forensic CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@fasaled/haril'

  - id: haril-npm-archive-name
    desc: Haril forensic CLI npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@fasaled/haril'

  - id: haril-bundled-native-dll-marker
    desc: Bun bundle references Haril native DLL filename
    for: [javascript, typescript]
    if:
      type: text
      substr: haril_native.dll

  - id: haril-native-api-marker
    desc: Haril native API export name in bundle
    for: [javascript, typescript]
    if:
      type: text
      substr: haril_get_file_id
