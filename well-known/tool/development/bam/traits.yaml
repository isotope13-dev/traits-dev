# bam — Lua-scripted build system (matricks/bam). Process spawn and
# vendored Lua loadlib are how it compiles and links.
defaults:
  platforms: [unix, windows]
  for: [c, python, markdown, tar, gz, archives, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 5000000

traits:
  - id: github-repo
    desc: bam build-system GitHub repository
    for: [markdown, text]
    conf: 0.98
    if:
      type: text
      substr: github.com/matricks/bam

  - id: version-banner
    desc: bam CLI version banner format
    for: [c, text]
    conf: 0.97
    if:
      type: text
      substr: 'printf("bam version " BAM_VERSION_STRING_COMPLETE'

  - id: lua-version-global
    desc: bam Lua _bam_version global
    for: [c, text]
    conf: 0.96
    if:
      type: text
      substr: '"_bam_version"'
