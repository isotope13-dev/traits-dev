defaults:
  platforms: [unix, windows]
  for: [oledoc]

traits:
  # OleDoc analysis leaves the extracted-string index empty (strings=0),
  # so type:text never sees OpenCores even though `cleave facts text`
  # can recover it. type:raw is rejected for plain ASCII by policy.
  # Hex matches the same ASCII run in the compound-file bytes.
  - id: opencores-document-marker
    desc: OpenCores documentation marker
    crit: notable
    conf: 0.99
    size_min: 64
    size_max: 50000000
    if:
      type: hex
      pattern: "4F 70 65 6E 43 6F 72 65 73"

  - id: opencores-org-email
    desc: OpenCores project email address
    crit: notable
    conf: 0.99
    size_min: 64
    size_max: 50000000
    if:
      type: hex
      pattern: "40 6F 70 65 6E 63 6F 72 65 73 2E 6F 72 67"

  - id: opencores-document-path
    desc: OpenCores documentation path
    crit: notable
    conf: 0.99
    for: [oledoc, zip, pdf]
    size_min: 64
    size_max: 50000000
    if:
      type: path
      regex: '(^|[\\/])opencores([\\/]|$)'

  - id: opencores-spec-template
    desc: OpenCores specifications Word template
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.template
      substr: Specifications Template

composite_rules:
  - id: documentation-context
    desc: Recognized OpenCores hardware documentation context
    crit: exception
    conf: 0.99
    all:
      - id: opencores-document-marker
      - id: opencores-org-email

  - id: documentation-tree-context
    desc: OpenCores tree path with document marker
    crit: exception
    conf: 0.99
    all:
      - id: opencores-document-path
      - id: opencores-document-marker

  - id: specifications-template-context
    desc: OpenCores specifications template documentation
    crit: exception
    conf: 0.95
    all:
      - id: opencores-spec-template
      - id: opencores-document-marker
