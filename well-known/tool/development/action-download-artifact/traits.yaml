# dawidd6/action-download-artifact — GitHub Action that downloads workflow
# artifacts. Bundled JS dependencies are product, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, javascript, typescript, package.json, github-actions, gz, tar]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 600000000

traits:
  - id: source-tree
    desc: action-download-artifact source tree path
    for: [source, scripts, javascript, typescript, package.json]
    if:
      type: path
      regex: 'action-download-artifact-[0-9][^\\/]*/'

  - id: package-name
    desc: action-download-artifact package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: action-download-artifact

  - id: action-name
    desc: Download workflow artifact Action name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Download workflow artifact

composite_rules:
  - id: action-download-artifact-identity
    desc: Recognized download-artifact GitHub Action
    needs: 2
    any:
      - id: source-tree
      - id: package-name
      - id: action-name
