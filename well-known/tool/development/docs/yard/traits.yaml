# YARD (Yet Another Ruby Documentation tool), as shipped in the yard gem.
#
# YARD plugs itself into RubyGems: lib/yard/rubygems/hook.rb registers
# `Gem.done_installing` to build documentation for a freshly installed gem and
# `Gem.pre_uninstall` to delete that documentation again. RubyGems auto-requires
# this file, so every vendored bundle that contains yard carries a gem
# uninstall hook. Install-hook detections look for a *gem* that
# runs its own code across the install boundary; a documentation generator
# cleaning up the docs it produced is not that.
#
# The class declaration and bound handler together identify the hook.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95

traits:
  - id: rubygems-hook-class
    desc: YARD RubyGems hook class declaration
    if:
      type: text
      regex: '(?m)^\s*class\s+RubygemsHook\b'

  - id: rubygems-hook-handler-binding
    desc: YARD binds its RubyGems hook handler
    if:
      type: text
      substr: 'YARD::RubygemsHook.method'

composite_rules:
  - id: rubygems-doc-hook-file
    desc: File is YARD's RubyGems documentation hook
    crit: notable
    conf: 0.97
    all:
      - id: rubygems-hook-class
      - id: rubygems-hook-handler-binding
