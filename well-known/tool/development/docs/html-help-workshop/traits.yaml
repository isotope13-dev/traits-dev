defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.99
  size_min: 1000000
  size_max: 20000000

traits:
  - id: html-help-workshop-product-name
    desc: HTML Help Workshop product name
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: 'HTML Help Workshop Install'

  - id: html-help-workshop-description
    desc: HTML Help Workshop file description
    crit: notable
    if:
      type: value
      path: pe.version.description
      exact: 'Microsoft® HTML Help Author'

  - id: html-help-workshop-original-filename
    desc: HTML Help Workshop original filename
    crit: notable
    if:
      type: value
      path: pe.version.original_filename
      exact: htmlhelp.exe
      case_insensitive: true

composite_rules:
  - id: html-help-workshop-build-identity
    desc: Microsoft HTML Help Workshop build identity
    crit: notable
    conf: 0.99
    all:
      - id: html-help-workshop-product-name
      - id: html-help-workshop-description
      - id: html-help-workshop-original-filename
      - id: metadata/vendor/identity::microsoft-prefixed-company
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
    any:
      - id: metadata/signature/verified/signer::microsoft-corporation
      - id: metadata/signature/unverified/signer::microsoft-corporation
      - id: metadata/signature/self-signed/signer::microsoft-corporation
      - id: metadata/signature/invalid/tampered/signer::microsoft-corporation
      - id: metadata/signature/invalid/bad-signature/signer::microsoft-corporation
