# Quarto — scientific/technical publishing system (quarto.org).
# Identity for conda/share trees, preview UI, and Quarto-branded assets.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 10000000

traits:
  - id: quarto-share-tree-path
    desc: Quarto share/quarto tree path fragment
    conf: 0.97
    for: [scripts, source, javascript, typescript, python, lua, html, json, text]
    if:
      type: path
      regex: '(?i)share/quarto'

  - id: quarto-preview-global-export
    desc: QuartoPreview browser global export
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: QuartoPreview=

  - id: quarto-preview-initialized-event
    desc: Quarto preview initialized custom event
    conf: 0.97
    for: [javascript]
    if:
      type: text
      substr: quarto-preview-initialized

  - id: quarto-ojs-runtime-basename
    desc: Quarto Observable JS runtime basename
    conf: 0.97
    for: [javascript]
    if:
      type: path
      basename: true
      exact: quarto-ojs-runtime.js
      case_insensitive: true

  - id: quarto-dashboard-basename
    desc: Quarto dashboard script basename
    conf: 0.96
    for: [javascript]
    if:
      type: path
      basename: true
      exact: quarto-dashboard.js
      case_insensitive: true

composite_rules:
  - id: quarto-publishing-toolkit
    desc: Quarto publishing toolkit asset
    crit: notable
    conf: 0.98
    for: [scripts, source, javascript, typescript, python, lua, html, json, text]
    any:
      - id: quarto-share-tree-path
      - id: quarto-preview-global-export
      - id: quarto-preview-initialized-event
      - id: quarto-ojs-runtime-basename
      - id: quarto-dashboard-basename
