# Ecmarkup — ECMAScript specification compiler and markup tooling (TC39).
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: ecmarkup npm package name
    if:
      type: value
      path: name
      exact: ecmarkup

  - id: repository-identity
    desc: ecmarkup upstream repository identity
    if:
      type: value
      path: repository
      regex: '(?i)(bterlson|tc39)/ecmarkup'

  - id: update-baselines-script
    desc: ecmarkup echoes loop syntax into Bash
    if:
      type: value
      path: scripts.update-baselines
      regex: '(?i)\becho\s+for\b[^\n|;]*;\s*do\b[^\n|;]*;\s*done\s*\|\s*(ba|z)?sh\b'
    # `do`/`done` are arguments to echo, so the lifecycle shell rejects the
    # declaration before it can emit anything to Bash. Keep the exception
    # away from packages with automatic install hooks, whose pipe findings
    # can represent an independent execution path in this same manifest.
    unless:
      - id: metadata/package/scripts/lifecycle::install-hooks

composite_rules:
  - id: ecmarkup-package-context
    desc: ecmarkup specification compiler package context
    all:
      - id: npm-package-name
      - id: repository-identity

  - id: ecmarkup-update-baselines-pipe-gate
    desc: ecmarkup malformed loop pipe context
    all:
      - id: ecmarkup-package-context
      - id: update-baselines-script
