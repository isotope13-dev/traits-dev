# Ecmarkup — ECMAScript specification compiler and markup tooling (TC39).
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: ecmarkup npm package name
    if:
      type: value
      path: name
      exact: ecmarkup

  - id: repository-identity
    desc: ecmarkup upstream repository identity
    if:
      type: value
      path: repository
      regex: '(?i)(bterlson|tc39)/ecmarkup'

  - id: update-baselines-script
    desc: ecmarkup update-baselines script
    if:
      type: value
      path: scripts.update-baselines
      regex: 'node\s+bin/ecmarkup\.js[^\n|]{0,60}\|\s*bash'

composite_rules:
  - id: ecmarkup-package-context
    desc: ecmarkup specification compiler package context
    all:
      - id: npm-package-name
      - id: repository-identity

  - id: ecmarkup-update-baselines-pipe-gate
    desc: ecmarkup update-baselines pipe-execute gate
    all:
      - id: ecmarkup-package-context
      - id: update-baselines-script
