# fake-commit — MIT CLI that synthesizes dated git commits for appearance
# (https://github.com/esyion/fake-commit). Subprocess git commit/push stays in
# micro-behaviors (correct dual-use history forging capability).
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: fake-commit wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: fake_commit

  - id: package-metadata-name
    desc: fake-commit PyPI Name field
    for: [text, markdown, pkginfo]
    if:
      type: text
      substr: 'Name: fake-commit'

  - id: console-entrypoint
    desc: fake-commit fcmt console entry point
    for: [text, whl]
    if:
      type: text
      substr: 'fcmt = src.main:main'

  - id: github-repo
    desc: esyion/fake-commit GitHub repository
    for: [text, markdown, python]
    if:
      type: text
      substr: github.com/esyion/fake-commit

  - id: commit-marker-file
    desc: fake-commit .commit_marker path
    for: [python]
    if:
      type: text
      substr: '.commit_marker'

composite_rules:
  - id: fake-commit-cli
    desc: fake-commit synthetic git history CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: console-entrypoint
      - id: github-repo
      - id: commit-marker-file
    needs: 2
