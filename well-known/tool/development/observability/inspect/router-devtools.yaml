# A reference does not establish that the component is mounted or exposed.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: production-router-devtools-symbol
    desc: References production router devtools export
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bTanStackRouterDevtools(Panel)?InProd\b'
