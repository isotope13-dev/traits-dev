# Mozilla Gecko/Firefox crashhelper and related tool markers
defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe, data]
  crit: baseline
  conf: 0.94
  size_min: 16384
  size_max: 524288000

traits:
  - id: gecko-source-path
    crit: notable
    desc: Gecko source tree path reference
    if:
      type: text
      substr: /builds/worker/checkouts/gecko/
composite_rules:
  - id: mozilla-crash-helper
    desc: Mozilla Firefox crashhelper binary
    crit: notable
    conf: 0.96
    all:
      - id: gecko-source-path
    any:
      - id: metadata/binary/debug::crash-helper-server-reference
      - id: well-known/lib/development/breakpad-legacy::crash-generation-server-reference
