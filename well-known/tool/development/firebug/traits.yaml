defaults:
  platforms: [windows, unix]
  for: [zip, javascript, chrome-manifest]
  crit: baseline
  conf: 0.95
  size_min: 4096
  size_max: 67108864

traits:
  - id: extension-id
    crit: notable
    desc: Firebug extension identifier
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: firebug@software.joehewitt.com

  - id: content-root
    crit: notable
    desc: Firebug content tree marker
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: content/firebug/

  - id: pref-domain
    crit: notable
    desc: Firebug preference domain
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: extensions.firebug

  - id: lib-js-xpcom-utils
    crit: notable
    desc: Firebug XPCOM utils marker
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: fbXPCOMUtils

  - id: lib-js-service-id
    crit: notable
    desc: Firebug service identifier marker
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: '@joehewitt.com/firebug;1'

composite_rules:
  - id: firefox-devtools-extension
    desc: Firebug Firefox developer tool
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: well-known/tool/development/firebug::content-root
      - id: well-known/tool/development/firebug::extension-id
      - id: metadata/lang/source/naming/interface::js-debugger-service-interface
      - id: well-known/tool/development/firebug::lib-js-service-id
      - id: well-known/tool/development/firebug::lib-js-xpcom-utils
      - id: well-known/tool/development/firebug::pref-domain
