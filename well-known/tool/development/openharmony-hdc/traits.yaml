# hdc is the OpenHarmony Device Connector: a client, host server and USB/TCP/UART
# daemon link that plays the role adb plays for Android. Built from
# developtools/hdc_standard, it opens sockets, queries the host, spawns a shell
# for `hdc shell` and waits on it -- the same API set a native command agent
# uses -- but the commands it runs come from the developer who typed them at the
# CLI, and it never fingerprints the host for a remote operator. It ships next
# to the toolchain in OpenHarmony IDE plugins.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576
  size_max: 33554432
  crit: notable
  conf: 0.95

traits:
  - id: hdc-standard-source-path
    desc: OpenHarmony hdc host source path
    if:
      type: text
      section: .rdata
      substr: developtools/hdc_standard/src/host/

  - id: hdc-server-class-strings
    desc: OpenHarmony hdc HdcServer log strings
    if:
      type: text
      section: .rdata
      substr: 'HdcServer::'

composite_rules:
  - id: openharmony-hdc-binary
    desc: OpenHarmony Device Connector binary
    crit: exception
    all:
      - id: hdc-standard-source-path
      - id: hdc-server-class-strings
