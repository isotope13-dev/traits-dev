# curl-fuzzer is curl's public libFuzzer harness.  Its generated fuzz targets
# link libcurl and therefore contain protocol, proxy, and timing strings that
# are not an implant or a tasking client.
defaults:
  platforms: [unix, windows]
  for: [gz, elf, c, cpp, python, shell, github-actions, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: curl-fuzzer-package-path
    desc: Official curl-fuzzer GitHub package path
    if:
      type: path
      regex: '(?i)(^|[/\\:])curl-fuzzer(@|[/\\]|$)'

  - id: curl-fuzzer-member-path
    desc: Official curl-fuzzer source tree path
    if:
      type: path
      regex: '(?i)(^|[/\\])curl-fuzzer-master([/\\]|$)'

  - id: oss-fuzz-root-path
    desc: OSS-Fuzz source tree member path
    if:
      type: path
      regex: '(?i)oss-fuzz(@|/)'

  - id: oss-fuzz-curl-fuzzer-artifact-path
    desc: OSS-Fuzz curl fuzzer binary path
    for: [elf]
    if:
      type: path
      regex: '(?i)(^|[/\\])curl_fuzzer(_[^/\\]+)?$'

composite_rules:
  - id: curl-fuzzer-context
    desc: Recognized curl libFuzzer package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: curl-fuzzer-package-path
      - id: curl-fuzzer-member-path

  - id: oss-fuzz-curl-context
    desc: Recognized OSS-Fuzz curl project and target
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: oss-fuzz-curl-fuzzer-artifact-path
      - id: oss-fuzz-root-path
