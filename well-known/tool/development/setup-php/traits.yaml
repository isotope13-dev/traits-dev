defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98
traits:
  - id: setup-php-action-source
    desc: setup-php GitHub Action source
    crit: notable
    for: [shell, powershell, javascript, typescript]
    if:
      type: path
      substr: setup-php

  - id: setup-php-github-action-uses
    desc: shivammathur/setup-php GitHub Action reference
    crit: notable
    for: [github-actions, text, markdown]
    if:
      type: text
      substr: shivammathur/setup-php

composite_rules:
  - id: setup-php-github-action
    desc: shivammathur setup-php GitHub Action
    crit: notable
    conf: 0.99
    any:
      - id: setup-php-action-source
      - id: setup-php-github-action-uses
