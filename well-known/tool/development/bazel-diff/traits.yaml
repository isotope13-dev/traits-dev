# bazel-diff (Tinder) ships a large bzlmod CC transitive fixture zip under
# cli/src/test/resources/fixture/. Nested JDK/bazel_tools members trip
# debugger entitlements and Windows reparse APIs that are not product code.
defaults:
  platforms: [unix, windows]

traits:
  - id: bazel-diff-bzlmod-fixture-archive-name
    desc: Bazel-diff bzlmod fixture archive name
    crit: notable
    conf: 0.99
    for: [zip, tar]
    size_max: 100000000
    if:
      type: basename
      regex: '^bzlmod-cc-transitive-test-[0-9]\.zip$'

  # Every nested fixture member carries `bzlmod-cc-transitive-test-N` (or
  # `bazel-bzlmod-…`) in its archive path.
  - id: bazel-bzlmod-transitive-fixture-token
    desc: Bazel bzlmod transitive fixture path
    crit: notable
    conf: 0.98
    for: [zip, tar, macho, dylib, python, c, cpp, shell, archives, binaries]
    size_max: 100000000
    if:
      type: path
      regex: '(?i)(bazel-)?bzlmod-cc-transitive-test-[0-9]'

composite_rules:
  - id: bazel-diff-bzlmod-test-fixture
    desc: Bazel-diff bzlmod test fixture
    crit: notable
    conf: 0.99
    scope: outer
    for: [zip, tar, macho, dylib, python, c, cpp, shell, archives, binaries]
    any:
      - id: bazel-diff-bzlmod-fixture-archive-name
      - id: bazel-bzlmod-transitive-fixture-token
