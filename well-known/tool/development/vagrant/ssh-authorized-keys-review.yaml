defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
traits:
- id: vagrant-user-marker
  desc: Vagrant user marker
  crit: notable
  conf: 0.98
  size_min: 12
  if:
    type: text
    substr: Vagrant User
- id: vagrant-insecure-key-marker
  desc: Vagrant insecure public key marker
  crit: notable
  conf: 0.98
  size_min: 27
  if:
    type: text
    substr: vagrant insecure public key
  unless:
  - id: well-known/app/system/kiwi::kiwi-vagrant-image-bootstrap
  - id: well-known/app/system/kiwi::kiwi-appliance-builder-package
composite_rules:
- id: vagrant-base-box-bootstrap
  desc: Vagrant base box SSH bootstrap
  crit: notable
  conf: 0.98
  all:
  - id: well-known/tool/development/vagrant::vagrant-user-marker
  - id: well-known/tool/development/vagrant::vagrant-insecure-key-marker
  near_bytes: 4096
