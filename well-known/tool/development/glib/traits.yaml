# GLib's Windows introspection compiler is a benign development utility.  Its
# compiler stubs can contain the same short self-loop sequence used by the
# generic anti-static rule, so retain an explicit tool identity for context.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.99
  size_min: 100000
  size_max: 5000000

traits:
  - id: gi-compile-repository-basename
    desc: GLib introspection compiler basename
    if:
      type: basename
      exact: gi-compile-repository.exe
      case_insensitive: true

  - id: gi-compile-repository-pdb
    desc: GLib introspection compiler PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: gi-compile-repository.pdb
      case_insensitive: true

composite_rules:
  - id: glib-introspection-compiler
    desc: GLib introspection compiler
    crit: notable
    conf: 0.99
    all:
      - id: gi-compile-repository-basename
      - id: gi-compile-repository-pdb
