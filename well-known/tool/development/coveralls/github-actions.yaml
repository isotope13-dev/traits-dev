# Coveralls coverage-reporting service, GitHub Actions context.
#
# php-coveralls and the official coveralls-reporter workflows notify the
# service that a (parallel) build finished by POSTing to the documented
# `https://coveralls.io/webhook?repo_token=...` endpoint, passing the
# repository's token (often the Actions-provided GITHUB_TOKEN) as the
# `repo_token`. That is the tool's own documented integration transport —
# the token authenticates the request to Coveralls, it is not exfiltrated.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.95

traits:
  - id: webhook-finish-url
    desc: Coveralls parallel-build finish webhook URL
    conf: 0.97
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: 'https?://coveralls\.io/webhook\?[^ \t"\n]*repo_token='
composite_rules:
  # Legitimate "notify Coveralls the (parallel) build finished" workflow step:
  # a run step references a secret used as the repo_token for the service's own
  # webhook. Quiets the secret-exfiltration host detections below; an attacker
  # harvesting the token for its own endpoint does not target this webhook.
  - id: coveralls-webhook-finish
    desc: Workflow notifies Coveralls of a finished build
    crit: exception
    conf: 0.99
    all:
      - id: webhook-finish-url
      - id: micro-behaviors/communications/http/webhook::run-webhook-url
      - id: metadata/build/ci/secret::run-secret-reference
