defaults:
  platforms: [unix, windows]

traits:
  - id: module-declaration
    desc: Declares Moby BuildKit Go module
    for: [go.mod]
    crit: component
    if:
      type: text
      regex: '(?m)^module[ \t]+github\.com/moby/buildkit[ \t]*\r?$'

  - id: buildctl-source-member
    desc: BuildKit client entry point archive member
    for: [go_module]
    crit: component
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/moby/buildkit@v[^/]+/cmd/buildctl/main\.go$'

  - id: buildkitd-source-member
    desc: BuildKit daemon entry point archive member
    for: [go_module]
    crit: component
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/moby/buildkit@v[^/]+/cmd/buildkitd/main\.go$'

composite_rules:
  - id: source-module
    desc: Moby BuildKit source module
    for: [go_module, go.mod]
    crit: notable
    scope: archive
    all:
      - id: module-declaration
      - id: buildctl-source-member
      - id: buildkitd-source-member
