# conda-smithy is a tool for managing and generating conda-forge feedstocks and CI scripts.
defaults:
  platforms: [windows, unix]
  for: [batch, shell, text]
  crit: baseline
  conf: 0.98

traits:
  - id: conda-smithy-generator-notice
    desc: Conda-smithy generated script notice
    crit: notable
    if:
      type: text
      substr: 'automatically generated by conda-smithy'

  - id: conda-smithy-rerender-reference
    desc: Conda-smithy rerender command reference
    crit: notable
    if:
      type: text
      substr: 'conda smithy rerender'

composite_rules:
  - id: conda-smithy-script
    desc: Script generated or managed by conda-smithy
    crit: exception
    conf: 0.98
    any:
      - id: conda-smithy-generator-notice
      - id: conda-smithy-rerender-reference
