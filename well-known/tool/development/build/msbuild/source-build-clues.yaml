defaults:
  platforms: [windows]
  for: [csharp, source]
  crit: notable
traits:
  - id: msbuild-exe-text
    desc: MSBuild.exe text
    crit: component
    conf: 0.85
    if:
      type: text
      regex: (?i)MSBuild\.exe
composite_rules:
  - id: msbuild-release-x64-project-clues
    desc: MSBuild release x64 project and template clues
    crit: notable
    conf: 0.95
    all:
      - id: well-known/tool/development/build/msbuild::msbuild-exe-text
      - id: metadata/lang/source/syntax/command/options::build-release-configuration-option
      - id: metadata/lang/source/syntax/command/options::build-x64-platform-option
      - id: micro-behaviors/fs/path/extension::visual-cpp-project-extension
    any:
      - id: metadata/lang/source/comment::owner-build-id-comment
      - id: micro-behaviors/data/encode/base64/primitive::dotnet-to-base64string
  - id: msbuild-sleep-placeholder-clues
    desc: MSBuild, sleep and placeholder clues
    crit: notable
    conf: 0.9
    all:
      - id: well-known/tool/development/build/msbuild::msbuild-exe-text
      - id: micro-behaviors/time/sleep/interval::dotnet-thread-sleep-five-digit-text
    any:
      - id: metadata/lang/source/comment::fake-code-comment
      - id: metadata/lang/source/comment::owner-build-id-comment
