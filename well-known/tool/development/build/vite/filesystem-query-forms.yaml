defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - scripts
    - source
  conf: 0.94

traits:
  - id: vite-fs-raw-bypass-query
    desc: References Vite filesystem raw-query form
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(raw(\?\?)?|raw\?import)$'

  - id: vite-fs-import-bypass-query
    desc: References Vite filesystem import-query form
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(import&(raw(\?\?)?|url&inline)|inline&import)$'




composite_rules:
  - id: vite-fs-bypass-query-catalog
    desc: Contains multiple Vite filesystem query forms
    crit: notable
    all:
      - id: well-known/tool/development/build/vite::vite-fs-route-reference
    needs: 2
    any:
      - id: well-known/tool/development/build/vite::vite-fs-raw-bypass-query
      - id: well-known/tool/development/build/vite::vite-fs-import-bypass-query
