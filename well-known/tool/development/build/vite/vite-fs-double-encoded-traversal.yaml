defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  conf: 0.94

traits:
  - id: vite-fs-double-encoded-traversal
    size_min: 1
    desc: Vite route uses double-encoded traversal
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/(\.\.%25(2f|5c)){2,}'
