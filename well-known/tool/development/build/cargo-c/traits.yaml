# cargo-c, the cargo subcommands that build and install Rust C-ABI
# libraries (cargo-cbuild, cargo-capi, cargo-cinstall, cargo-ctest).
# Each binary stamps "cargo-c <version>+cargo-<version>".
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: notable
  conf: 0.97
  size_min: 1048576

traits:
  - id: version-banner
    desc: cargo-c version banner
    if:
      type: text
      regex: 'cargo-c [0-9]+\.[0-9]+\.[0-9]+\+cargo-[0-9]'
      section: rodata
