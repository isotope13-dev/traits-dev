# Kitware CMake toolchain components.
#
# CMake ships monolithic statically linked tools (cmake-gui embeds libcurl
# and Qt with exports preserved; cmcldeps validates compiler target image
# headers). Those shapes trip proxy-loader and manual-mapper heuristics, so
# binaries whose Kitware signature verifies with a matching content digest
# carry a toolchain context: verified vendor identity plus proven
# untampered image, not merely a name claim.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 524288000

traits:
  - id: kitware-signer
    desc: Kitware Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      substr: 'Kitware'

composite_rules:
  - id: cmake-toolchain-context
    desc: Verified Kitware CMake toolchain component context
    crit: exception
    conf: 0.99
    all:
      - id: kitware-signer
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
