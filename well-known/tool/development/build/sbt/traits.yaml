defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  # Metals vendors the sbt launcher. Its shaded coursier classes reflect and
  # spawn processes; that is the launcher, not a dropper.
  - id: sbt-launcher-class-path
    desc: sbt launcher shaded class path
    if:
      type: path
      regex: 'xsbt[\\/]boot[\\/]'
