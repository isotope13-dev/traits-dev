# dartsass — Ruby wrapper bundling Dart Sass CSS compiler binaries (sass/dart-sass).
# Dart VM runtime reads /proc/self/status TracerPid for debugger support, not evasion.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, elf, macho, pe]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 50000000

traits:
  - id: gem-package-name
    desc: dartsass Ruby gem package name
    for: [gem, pkginfo]
    if:
      type: value
      path: gem.name
      exact: dartsass

  - id: dartsass-compiler-binary-path
    desc: dartsass bundled Sass compiler binary path
    for: [elf, macho, pe]
    if:
      type: path
      regex: '[\\/]exe[\\/](linux|darwin|mingw32)'

  - id: dart-sass-readme
    desc: dartsass Dart Sass binary wrapper README
    if:
      type: text
      substr: Dart Sass binaries

composite_rules:
  - id: dartsass-gem-context
    desc: dartsass Ruby gem bundling Dart Sass compiler
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: gem-package-name
      - id: dart-sass-readme
      - id: dartsass-compiler-binary-path
