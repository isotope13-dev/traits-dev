# Buck2, Meta's Rust build system. Its panic locations embed the
# workspace crate source paths (app/buck2_build_api/src/...).
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: notable
  conf: 0.97
  size_min: 10485760

traits:
  - id: crate-source-path
    desc: Buck2 build API crate source path
    if:
      type: text
      substr: buck2_build_api/src/
      section: rodata
