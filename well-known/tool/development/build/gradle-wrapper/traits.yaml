defaults:
  platforms: [unix, windows]
  for: [shell, batch]
  crit: baseline
  conf: 0.96
traits:
  - id: gradle-wrapper-jar
    desc: Gradle wrapper JAR identity
    crit: notable
    for: [jar]
    if:
      type: basename
      exact: gradle-wrapper.jar
  - id: gradle-wrapper-archive-member
    desc: Archive contains Gradle wrapper JAR
    crit: notable
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)gradle-wrapper\.jar$'
  - id: gradle-wrapper-install-class
    desc: Gradle wrapper distribution installer class
    crit: notable
    conf: 0.99
    for: [class]
    if:
      type: text
      substr: org/gradle/wrapper/Install
  # The whole `org/gradle/wrapper` package, not just Install. Every class in
  # the wrapper JAR carries the package path in its constant pool, and they
  # are all reflective by design: the wrapper downloads a Gradle
  # distribution, adds it to a URLClassLoader and invokes its main. That is
  # what `BootstrapMainStarter` does, and it scored java-reflective-invoke
  # and java-classloader-dropper in 9 and 8 samples -- gradle-wrapper.jar is
  # vendored into practically every JVM project.
  - id: gradle-wrapper-package-class
    desc: Gradle wrapper package class
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: text
      regex: org/gradle/(wrapper|cli)/
  - id: unix-gradle-wrapper
    desc: Gradle Unix wrapper script
    for: [shell]
    if:
      type: text
      substr: 'Gradle start up script for UN*X'
  - id: windows-gradle-wrapper
    desc: Gradle Windows wrapper script
    for: [batch]
    if:
      type: text
      substr: 'Gradle startup script for Windows'
  # Basename survives archive-member scans where the UN*X banner substr
  # sometimes misses; pairs with GradleWrapperMain for the composite.
  - id: gradlew-basename
    desc: gradlew wrapper script basename
    if:
      type: basename
      regex: '(?i)^gradlew(\.bat)?$'
  - id: gradle-wrapper-main-class
    desc: GradleWrapperMain launcher class reference
    if:
      type: text
      substr: org.gradle.wrapper.GradleWrapperMain
composite_rules:
  - id: gradle-wrapper-by-basename
    desc: Gradle wrapper basename with launcher class
    crit: notable
    conf: 0.98
    all:
      - id: gradlew-basename
      - id: gradle-wrapper-main-class

  - id: gradle-wrapper-script
    desc: Gradle wrapper script
    crit: notable
    conf: 0.98
    any:
      - id: unix-gradle-wrapper
      - id: windows-gradle-wrapper
      - id: gradle-wrapper-by-basename
