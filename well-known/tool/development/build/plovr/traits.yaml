# Plovr (bolinfest/plovr) is a build tool for Google Closure Tools (Compiler,
# Library, Templates). Packages using it specify plovr configurations (plovr.js)
# and plovr dependencies/jar invocations in build scripts.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: plovr-config-file
    desc: Plovr build configuration file
    for: [javascript, json, text]
    if:
      type: basename
      regex: '^plovr\.(js|json)$'

  - id: plovr-package-dependency
    desc: Package declares plovr dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.plovr
      regex: '.*'

  - id: plovr-jar-reference
    desc: References plovr.jar build tool
    for: [text, makefile]
    if:
      type: text
      substr: 'plovr.jar'

composite_rules:
  - id: plovr-build-context
    desc: Recognized Plovr Google Closure build tool context
    crit: notable
    conf: 0.99
    scope: archive
    for: [package.json, javascript, text, makefile, npm, tar]
    any:
      - id: plovr-config-file
      - id: plovr-package-dependency
      - id: plovr-jar-reference
