# Buck (facebook/buck) is a build tool designed for large multi-language repos.
# Its Android support library (buck-android-support.jar) implements exopackage,
# an incremental install mechanism that reflects into Android's BaseDexClassLoader
# to dynamically load dex files during development.
defaults:
  crit: notable
  platforms: [android, unix, windows]

traits:
  - id: buck-exopackage-package-class
    desc: Buck exopackage support library class
    conf: 0.99
    for: [class]
    if:
      type: text
      substr: com/facebook/buck/android/support/exopackage/

  - id: buck-android-support-jar-name
    desc: Buck Android support JAR name
    conf: 0.99
    for: [jar]
    if:
      type: basename
      exact: buck-android-support.jar

  - id: buck-action-declared-output
    desc: Buck rule declares an action output
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'ctx\.actions\.declare_(output|file)'

  - id: dotslash-windows-shim
    desc: DotSlash Windows launcher shim
    conf: 0.99
    for: [pe]
    size_min: 1024
    size_max: 32768
    if:
      type: text
      section: .rdata
      substr: dotslash-windows-shim
