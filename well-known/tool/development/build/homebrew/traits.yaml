defaults:
  platforms: [unix]
  for: [ruby, shell, text, source]
  crit: notable
  conf: 0.98
  size_max: 300000000

traits:
  - id: source-tree
    desc: Homebrew source tree
    if:
      type: path
      regex: '(?i)(linuxbrew|homebrew-core|homebrew[/-]brew)(@|[/\\])'

  - id: cask-source-tree
    desc: Homebrew cask source tree
    if:
      type: path
      regex: '(?i)homebrew-cask(@|[/\\])'

  - id: source-tree-macos
    desc: Homebrew source tree on macOS rule surfaces
    platforms: [macos]
    if:
      type: path
      regex: 'Library[\\/]Homebrew'

  - id: github-actions-repo
    desc: Homebrew GitHub Actions repository
    if:
      type: path
      regex: 'Homebrew/actions'

  - id: setup-homebrew-script
    desc: Homebrew setup-homebrew action script
    if:
      type: path
      regex: 'setup-homebrew'

  # Path observations from the Linuxbrew (brew) apk; conf stays low because
  # a path does not establish that a file is Homebrew's.
  - id: shims-path
    desc: Path is under Homebrew/shims
    for: [shell]
    conf: 0.5
    if:
      type: path
      regex: '(?i)Homebrew[\\/]shims[\\/]'

  - id: apk-filename
    desc: Path names a brew apk
    conf: 0.5
    for: [ruby, shell, text, alpine_apk]
    platforms: [linux]
    if:
      type: path
      regex: '(?i)brew-[0-9][^\\/]*\.apk$'
