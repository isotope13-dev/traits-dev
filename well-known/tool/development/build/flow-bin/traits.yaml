defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 250000000

traits:
  - id: flow-bin-package-name
    desc: Flow type-checker npm package identity
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: name
      exact: flow-bin

  - id: flow-bin-signing-certificate
    desc: Flow package signing certificate entry
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: files[*]
      regex: '(^|[\\/])signing\.pem$'

  - id: flow-bin-platform-binaries
    desc: Flow package platform-specific binary entries
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: files[*]
      regex: '(^|[\\/])flow-(linux|osx|win)'

  - id: flow-bin-package-path
    desc: Flow type checker binary package path
    for: [elf, pe, package.json, npm]
    if:
      type: path
      regex: 'node_modules/flow-bin/'

  - id: flow-linux64-binary-path
    desc: Flow Linux 64-bit published binary path
    for: [elf]
    if:
      type: path
      regex: 'flow-linux64-v'

  - id: flow-published-binary-path
    desc: Flow published binary package path
    for: [elf, pe, macho]
    if:
      type: path
      regex: 'flow-(linux|osx|win)'

  - id: flow-native-binary
    desc: Flow checker native symbol namespace
    crit: notable
    conf: 0.99
    for: [elf, macho]
    if:
      type: export
      regex: '^camlFlow_js__'

  - id: flow-native-binary-pe
    desc: Flow checker native symbol namespace (PE)
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      # A Windows EXE (not a DLL) has no export table, so the OCaml
      # module-qualified backtrace/reflection symbol names that show up as
      # ELF/Mach-O dynamic exports on the other two platforms are only
      # recoverable here as plain strings, and OCaml's MinGW toolchain bakes
      # them into its own custom `.exptbl` (exception/global table) section
      # rather than `.rdata`.
      type: text
      substr: camlFlow_js__
      section: exptbl

  - id: flow-cli-pdb
    desc: Flow CLI debug symbols reference
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: flow_cli.pdb

  - id: flow-rust-source-path
    desc: Flow Rust codebase source path reference
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      section: .rdata
      substr: crates/flow_cli/

  - id: flow-rust-source-path-elf
    desc: Flow Rust codebase source path (ELF)
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: crates/flow_cli/

composite_rules:
  - id: flow-bin-package-context
    desc: Recognized Flow type-checker package context
    crit: exception
    conf: 1.0
    for: [package.json, npm]
    all:
      - id: flow-bin-package-name
      - id: flow-bin-signing-certificate
      - id: flow-bin-platform-binaries

  - id: flow-binary-path
    desc: Recognized Flow binary path
    crit: notable
    for: [elf, pe, macho]
    any:
      - id: flow-published-binary-path
      - id: flow-bin-package-path
      - id: flow-linux64-binary-path

  - id: flow-binary-context
    desc: Recognized Flow type-checker binary context
    crit: exception
    conf: 0.99
    for: [elf, pe, macho]
    all:
      - id: flow-binary-path
    any:
      - id: flow-cli-pdb
      - id: flow-native-binary
      - id: flow-native-binary-pe
      - id: flow-rust-source-path
      - id: flow-rust-source-path-elf
