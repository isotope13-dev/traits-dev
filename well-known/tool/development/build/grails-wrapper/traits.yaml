defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  # GrailsWrapper downloads a distribution, adds it to a URLClassLoader and
  # invokes its main. Same mechanism as the Gradle wrapper, vendored as
  # grails-wrapper-runtime-*.jar.
  - id: grails-wrapper-package-class
    desc: Grails wrapper package class
    if:
      type: text
      substr: org/grails/wrapper/
