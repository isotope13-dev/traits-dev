# Leiningen — Clojure project build tool. JARs it emits stamp Created-By
# and ship coords under META-INF/leiningen/.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.96
  size_min: 64
  size_max: 50000000

traits:
  - id: created-by
    desc: Leiningen Created-By JAR manifest
    for: [jar, zip]
    conf: 0.98
    if:
      type: value
      path: jar.manifest.created_by
      substr: Leiningen

  - id: pom-group
    desc: leiningen-core Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: leiningen-core

  - id: pom-artifact
    desc: leiningen-core Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: leiningen-core

  - id: metadata-path
    desc: Leiningen metadata directory path
    for: [jar, zip]
    conf: 0.97
    if:
      type: path
      regex: '(?i)META-INF/leiningen/'

  - id: defproject-form
    desc: Leiningen defproject form
    for: [clojure, text]
    conf: 0.95
    if:
      type: text
      regex: '\(defproject\s+\S+'

  - id: codeberg-repo
    desc: Leiningen Codeberg repository URL
    for: [xml, clojure, markdown]
    conf: 0.97
    if:
      type: text
      substr: codeberg.org/leiningen/leiningen

composite_rules:
  - id: leiningen-core-maven
    desc: leiningen-core Maven coordinates
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact

