defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 250000000

traits:
  - id: bs-platform-package-name
    desc: BuckleScript compiler npm package identity
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: name
      exact: bs-platform

  - id: bs-platform-package-bin
    desc: BuckleScript package binary entry
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: bin.bsb
      substr: 'lib/bsb'

  - id: bs-platform-package-path
    desc: BuckleScript package path
    for: [elf, pe, package.json, npm]
    if:
      type: path
      substr: 'node_modules/bs-platform/'

  - id: bs-platform-binary-path
    desc: BuckleScript published binary name
    for: [elf, pe, macho]
    if:
      type: path
      basename: true
      regex: '^bs(b(_helper)?|c|ppx|refmt)(\.[a-z0-9]+)?$'

  - id: bs-platform-native-binary
    desc: BuckleScript native symbol namespace
    crit: notable
    conf: 0.99
    for: [elf, macho]
    if:
      type: symbol
      regex: '^camlBs(b(_helper)?|c|ppx|refmt)__'

composite_rules:
  - id: bs-platform-package-context
    desc: Recognized BuckleScript package context
    crit: exception
    conf: 1.0
    for: [package.json, npm]
    all:
      - id: bs-platform-package-name
      - id: bs-platform-package-bin

  - id: bs-binary-context
    desc: Recognized BuckleScript binary context
    crit: exception
    conf: 0.99
    for: [elf, pe, macho]
    all:
      - id: bs-platform-binary-path
    any:
      - id: bs-platform-native-binary
      - id: metadata/lang/compiler/native::ocaml-native-runtime-marker
