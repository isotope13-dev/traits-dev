# vbapm (github.com/vbapm/core) — a package manager and build tool for VBA.
# The npm package ships `addins/build/vbapm.xlam`, an Excel add-in whose VBA
# project is the product: it installs, resolves and builds VBA projects from
# inside Excel. A macro-bearing workbook is the point of the package, not a
# macro lure.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Package is vbapm
    size_min: 1
    if:
      type: value
      path: name
      exact: vbapm

  - id: upstream-repository
    desc: Package repository is vbapm/core
    size_min: 1
    if:
      type: value
      path: repository.url
      substr: github.com/vbapm/core

composite_rules:
  - id: package-context
    desc: Archive is the vbapm VBA package manager
    crit: exception
    all:
      - id: package-name
      - id: upstream-repository
