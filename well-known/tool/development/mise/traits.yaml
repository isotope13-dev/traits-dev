# mise (jdx/mise) version manager and its vfox plugin runtime crate.
# Embedded vfox plugins download third-party binaries and clear macOS quarantine
# on darwin after chmod — standard toolchain install UX, not Gatekeeper evasion.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98

traits:
  - id: mise-github-repo
    desc: mise/vfox GitHub repository marker
    for: [rust, cargo.toml, crate, markdown, lua]
    if:
      type: value
      path: crate.repository
      substr: github.com/jdx/mise

  - id: vfox-package-name
    desc: vfox plugin interface crate name
    for: [cargo.toml, crate]
    if:
      type: value
      path: crate.name
      exact: vfox

  - id: vfox-plugin-post-install-hook
    desc: vfox embedded plugin post_install hook
    for: [lua, crate]
    if:
      type: path
      regex: 'vfox-.+/hooks/post_install\.lua$'

  - id: vfox-runtime-os-guard
    desc: vfox RUNTIME.osType platform guard
    for: [lua]
    if:
      type: text
      substr: 'RUNTIME.osType == "darwin"'

composite_rules:
  - id: vfox-plugin-install-hook-context
    desc: vfox embedded plugin install hook context
    crit: exception
    conf: 0.98
    scope: outer
    all:
      - id: mise-github-repo
      - id: vfox-plugin-post-install-hook

  - id: mise-vfox-toolchain-context
    desc: mise vfox toolchain plugin runtime
    crit: notable
    conf: 0.99
    all:
      - id: mise-github-repo
      - id: vfox-package-name
