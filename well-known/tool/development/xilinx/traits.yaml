defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: planahead-marker
    desc: Xilinx PlanAhead marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'PlanAhead(TM)'

  - id: ise-wrap-wsh-marker
    desc: Xilinx ISE WSH wrapper marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'ISEWrap.js: ExploreAhead Script for WSH'

  - id: vivado-generated-design-marker
    desc: Vivado generated design script marker
    crit: notable
    conf: 0.99
    for: [lua]
    size_min: 64
    size_max: 50000000
    if:
      type: text
      substr: 'This is a generated script based on design:'

  - id: vivado-version-marker
    desc: Vivado generated-script version marker
    crit: notable
    conf: 0.99
    for: [lua]
    size_min: 64
    size_max: 50000000
    if:
      type: text
      word: scripts_vivado_version
      case_insensitive: true

composite_rules:
  - id: planahead-ise-wrapper-script
    desc: Recognized Xilinx PlanAhead ISE WSH wrapper
    crit: exception
    conf: 0.99
    all:
      - id: planahead-marker
      - id: ise-wrap-wsh-marker

  - id: vivado-generated-script-context
    desc: Recognized Vivado generated design script
    crit: exception
    conf: 0.99
    for: [lua]
    all:
      - id: vivado-generated-design-marker
      - id: vivado-version-marker
