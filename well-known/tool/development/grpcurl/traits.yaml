# grpcurl — CLI for invoking gRPC servers via reflection or proto files.
defaults:
  platforms: [unix, windows]
  for: [go, zip, tar, crate, gz]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: grpcurl-module-marker
    desc: fullstorydev grpcurl module path marker
    if:
      type: text
      substr: github.com/fullstorydev/grpcurl

  - id: grpcurl-package-comment
    desc: grpcurl core package comment
    for: [go]
    if:
      type: text
      substr: Package grpcurl provides the core functionality exposed by the grpcurl command
