defaults:
  platforms: [macos]
  for: [macho]
  size_min: 1000000

traits:
  - id: lsp-go-module-reference
    desc: Infracost LSP Go module reference
    crit: component
    conf: 0.97
    if:
      type: text
      substr: github.com/infracost/lsp/
      section: __gopclntab
  - id: pricing-api-reference
    desc: Infracost pricing API hostname
    crit: component
    conf: 0.97
    if:
      type: text
      substr: pricing.api.infracost.io
      section: __rodata

composite_rules:
  - id: lsp-code-and-pricing-api
    desc: Infracost LSP and pricing API references
    crit: notable
    conf: 0.98
    all:
      - id: lsp-go-module-reference
      - id: pricing-api-reference
