# chsrc is RubyMetric's cross-platform package-source mirror configurator.
# Its source release includes an installer that intentionally downloads the
# Android bootstrap script through wget and pipes it to bash.
defaults:
  platforms: [unix, windows]
  for: [shell, source, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-path
    desc: chsrc source release tree path
    for: [shell, source, markdown]
    if:
      type: path
      regex: 'chsrc-[^\\/]+'

  - id: upstream-repository
    desc: chsrc upstream repository reference
    for: [shell, markdown]
    if:
      type: text
      regex: 'github\.com/RubyMetric/chsrc|gitee\.com/RubyMetric/chsrc'

composite_rules:
  - id: chsrc-source-installer-context
    desc: Recognized chsrc source installer context
    crit: exception
    conf: 0.99
    scope: outer
    for: [shell]
    all:
      - id: source-tree-path
      - id: upstream-repository
