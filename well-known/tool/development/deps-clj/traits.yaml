# deps.clj — borkdude's Clojure CLI / tools.deps launcher, often bundled
# inside Calva and other Clojure editor tooling.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, clojure]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 20000000

traits:
  - id: pom-artifact
    desc: deps.clj Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: deps.clj

  - id: pom-group
    desc: borkdude Maven group id
    for: [jar, zip]
    conf: 0.97
    if:
      type: value
      path: jar.pom.group_id
      exact: borkdude

  - id: class-path
    desc: borkdude deps class path
    conf: 0.96
    if:
      type: path
      regex: '(?i)borkdude/deps'
