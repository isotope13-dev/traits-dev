defaults:
  platforms: [unix, windows]
  for: [python]
  size_min: 100
  size_max: 100000000

traits:
  - id: waf-author-marker
    desc: Waf author source marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Thomas Nagy'
  # Vendored waflib copies (e.g. PyInstaller bootloader) stamp every module
  # with this book URL even when the Thomas Nagy author line is absent.
  - id: waf-embedded-source-warning
    desc: Waf embedded source edit warning
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'https://waf.io/book/index.html#_obtaining_the_waf_file'
  - id: waf-pickle-command-decode
    desc: Waf pickled command decode
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'cPickle\.loads\s*\(\s*base64\.b64decode\s*\(\s*txt\s*\)\s*\)'
composite_rules:
  - id: waf-subprocess-command-worker
    desc: Waf deserializes and runs commands
    crit: notable
    conf: 0.99
    all:
      - id: waf-pickle-command-decode
      - id: micro-behaviors/process/create/subprocess::popen-ast
    any:
      - id: waf-author-marker
      - id: waf-embedded-source-warning
    near_lines: 60
