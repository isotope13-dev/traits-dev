defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - go
  - java
  - ruby
  - php
  size_max: 5000000
traits:
- id: stainless-generated-sdk
  desc: Stainless OpenAPI generator banner
  crit: component
  conf: 0.99
  if:
    type: text
    substr: File generated from our OpenAPI spec by Stainless.
- id: stainless-ruby-runtime-header
  desc: Stainless Ruby SDK runtime header
  crit: notable
  conf: 0.99
  for: [ruby]
  if:
    type: text
    substr: '"x-stainless-lang" => "ruby"'
