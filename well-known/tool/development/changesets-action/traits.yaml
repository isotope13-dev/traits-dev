defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, text]

traits:
  - id: source-read-module-marker
    desc: Changesets Action state reader import
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: './readChangesetState.ts'

  - id: source-run-module-marker
    desc: Changesets Action release runner import
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: './run.ts'

  - id: npm-publish-auth-line
    desc: Changesets Action npm publish auth bootstrap
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: '//registry\.npmjs\.org/:_authToken=\$\{process\.env\.NPM_TOKEN\}'

  - id: github-netrc-auth-line
    desc: Changesets Action GitHub netrc bootstrap
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: 'machine github\.com\\nlogin github-actions\[bot\]\\npassword'

  - id: release-behavior-marker
    desc: Changesets release workflow message marker
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'No changesets (found|present)'

  - id: package-name
    desc: Official Changesets Action package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@changesets/action'

  - id: action-metadata
    desc: Changesets GitHub Action metadata
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      substr: 'A GitHub action to automate releases with Changesets'

composite_rules:
  - id: source-context
    desc: Changesets Action source credential bootstrap context
    crit: exception
    conf: 0.99
    all:
      - id: source-read-module-marker
      - id: source-run-module-marker
      - id: npm-publish-auth-line

  - id: bundle-context
    desc: Changesets Action bundled release credential context
    crit: exception
    conf: 0.99
    all:
      - id: npm-publish-auth-line
      - id: github-netrc-auth-line
      - id: release-behavior-marker

  - id: archive-context
    desc: Changesets Action release archive context
    crit: exception
    conf: 0.99
    scope: archive
    for: [archives, tar]
    all:
      - id: package-name
      - id: action-metadata

  - id: official-changesets-action-context
    desc: Official Changesets Action release context
    crit: exception
    conf: 0.99
    any:
      - id: source-context
      - id: bundle-context
      - id: archive-context
      - id: package-name
