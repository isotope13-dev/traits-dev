# testit-adapter-pytest — Test IT TMS pytest integration adapter.
defaults:
  platforms: [windows, unix]
  for: [python, tar, archives, pkginfo, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: PyPI package testit-adapter-pytest
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^Name:\s*testit-adapter-pytest\s*$'

  - id: testit-tms-github-repo
    desc: testit-tms/adapters-python repository URL
    if:
      type: text
      substr: testit-tms/adapters-python

  - id: testit-pytest-plugin-module
    desc: testit_adapter_pytest pytest plugin module
    for: [python, text]
    if:
      type: text
      substr: testit_adapter_pytest

composite_rules:
  - id: testit-adapter-pytest-package
    desc: Test IT TMS pytest adapter package
    crit: notable
    conf: 0.97
    any:
      - id: package-name
      - id: testit-pytest-plugin-module
      - id: testit-tms-github-repo
