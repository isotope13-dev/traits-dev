defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
  size_min: 500000
  size_max: 100000000

traits:
  - id: aapt2-source-tree-marker
    desc: AAPT2 compiler source-tree marker
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      section: .rdata
      substr: frameworks/base/tools/aapt2/
  - id: aapt2-source-tree-marker-elf
    desc: AAPT2 compiler source-tree marker in ELF data
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: frameworks/base/tools/aapt2/
  - id: aapt2-source-tree-marker-macho
    desc: AAPT2 compiler source-tree marker in Mach-O data
    crit: notable
    conf: 0.99
    for: [macho]
    if:
      type: text
      section: __cstring
      substr: frameworks/base/tools/aapt2/
