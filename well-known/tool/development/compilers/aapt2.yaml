defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
  size_min: 500000
  size_max: 100000000

traits:
  - id: aapt2-source-tree-marker
    desc: AAPT2 compiler source marker
    crit: notable
    conf: 0.99
    if:
      type: text
      section: ".rodata"
      substr: frameworks/base/tools/aapt2/
