defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, archives]
  crit: notable
  conf: 0.98

traits:
  - id: codermake-package-name
    desc: Profound Logic codermake package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@profoundlogic/codermake"
  - id: codermake-npm-package-name
    desc: codermake npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@profoundlogic/codermake"
  - id: codermake-archive-package-name
    desc: codermake package name in archive manifest
    for: [javascript, typescript, npm]
    if:
      type: value
      path: package.json::name
      exact: "@profoundlogic/codermake"
  - id: codermake-cli-description
    desc: codermake IBM i build wrapper description
    for: [package.json, npm]
    if:
      type: value
      path: description
      substr: IBM i development
