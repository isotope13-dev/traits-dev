defaults:
  platforms: [unix, windows]
  for: [markdown, text]
traits:
  - id: cloudrouter-global-install-instruction
    desc: Instruction to globally install Cloudrouter
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)always run this command.{0,140}npm install -g\s+@.{0,40}/cloudrouter'

  - id: cloudrouter-ssh-recursive-ownership
    desc: Cloudrouter SSH recursive ownership command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)cloudrouter ssh.{0,100}sudo chown -R'

composite_rules:
  - id: cloudrouter-skill-install-and-sync-clues
    for: [markdown, text, zip]
    desc: Cloudrouter skill mentions install and sync
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: well-known/tool/development/cloudrouter::cloudrouter-global-install-instruction
      - id: metadata/lang/natural/phrasing/transfer::local-directory-cloud-sync-wording
    any:
      - id: well-known/tool/development/cloudrouter::cloudrouter-ssh-recursive-ownership
