# NuGet.exe — Microsoft's .NET package manager CLI (legacy 2.x bootstrap).
#
# Often vendored under package/src/nuget for publishing .nuspec packages.
# Uses the stock VS MyApplication template and managed resources like many
# .NET tools, but is legitimate build tooling rather than a reflective stager.
defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.99
  size_min: 500000
  size_max: 5242880

traits:
  - id: nuget-exe-basename
    desc: NuGet.exe CLI basename
    crit: notable
    if:
      type: basename
      exact: NuGet.exe

  - id: nuget-microsoft-product-metadata
    desc: NuGet Microsoft product version metadata
    crit: notable
    if:
      type: value
      path: pe.version.description
      exact: NuGet

  - id: nuget-microsoft-company-metadata
    desc: NuGet Microsoft company version metadata
    crit: component
    if:
      type: value
      path: pe.version.company
      exact: Microsoft Corporation

composite_rules:
  - id: nuget-cli-tool
    desc: Microsoft NuGet command-line package manager
    crit: notable
    needs: 2
    any:
      - id: nuget-exe-basename
      - id: nuget-microsoft-product-metadata
      - id: nuget-microsoft-company-metadata
