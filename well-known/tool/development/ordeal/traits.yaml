# ordeal — automated chaos testing framework for Python.
defaults:
  platforms: [windows, unix]
  for: [python, tar, archives, pkginfo, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: PyPI package ordeal
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^Name:\s*ordeal\s*$'

  - id: ordeal-metamorphic-module
    desc: ordeal.metamorphic testing module path
    for: [python, text]
    if:
      type: text
      substr: ordeal/metamorphic.py

  - id: byordeal-homepage
    desc: byordeal.com project homepage
    if:
      type: text
      substr: byordeal.com

composite_rules:
  - id: ordeal-package
    desc: ordeal chaos testing framework package
    crit: notable
    conf: 0.97
    any:
      - id: package-name
      - id: ordeal-metamorphic-module
      - id: byordeal-homepage
