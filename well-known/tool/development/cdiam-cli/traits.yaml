defaults:
  platforms: [unix, windows]
  for: [whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: CDIAM CLI wheel distribution name
    if:
      type: value
      path: whl.distribution
      exact: cdiam_cli

  - id: api-client-module
    desc: CDIAM CLI API client module
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)cdiam_cli/api/api_action\.py$'

composite_rules:
  - id: cdiam-api-client
    desc: Recognized CDIAM scientific API client
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: wheel-distribution
      - id: api-client-module
