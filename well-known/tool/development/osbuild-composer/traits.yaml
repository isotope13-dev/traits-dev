defaults:
  platforms: [linux]
  for: [shell, text, archive, rpm, go]
  crit: notable
  conf: 0.97

traits:
  - id: rpm-package-name
    desc: osbuild-composer RPM package name
    for: [rpm]
    conf: 0.99
    if:
      type: value
      path: rpm.name
      exact: osbuild-composer
  - id: github-go-module
    desc: osbuild-composer Go module path
    for: [shell, text, rpm]
    conf: 0.98
    if:
      type: text
      substr: github.com/osbuild/osbuild-composer
  - id: public-fork-go-module
    desc: osbuild-composer-public Go module path
    for: [go]
    conf: 0.98
    if:
      type: text
      substr: github.com/ondrejbudai/osbuild-composer-public
  - id: osbuild-composer-installer-test-path
    crit: notable
    desc: osbuild-composer installer test case path
    if:
      type: path
      regex: 'test/cases/ostree-simplified-installer\.sh$'
  - id: osbuild-composer-test-script-path
    crit: notable
    desc: osbuild-composer test harness script path
    if:
      type: path
      regex: '(?i)osbuild-composer.*(test[\\/]cases|tools[\\/])'
  - id: osbuild-composer-test-harness-command
    crit: notable
    desc: osbuild-composer test harness command
    if:
      type: text
      substr: /usr/libexec/osbuild-composer-test/

composite_rules:
  - id: osbuild-composer-test-script-context
    desc: osbuild-composer test harness script context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: osbuild-composer-test-script-path
      - id: osbuild-composer-test-harness-command
