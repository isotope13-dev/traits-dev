# Docker's @docker/actions-toolkit powers setup-docker, buildx, and compose
# GitHub Actions. install.js spawns a detached Colima/Lima VM, downloads Docker
# archives, and fetches moby systemd units from raw.githubusercontent.com —
# legitimate action bootstrap, not a supply-chain implant.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, github-actions]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Docker actions-toolkit package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@docker/actions-toolkit"

  - id: repository-url
    desc: Docker actions-toolkit repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/docker/actions-toolkit'

  - id: copyright-header
    desc: Docker actions-toolkit copyright header
    for: [javascript, typescript]
    if:
      type: text
      substr: "Copyright 2023 actions-toolkit authors"

  - id: lima-instance-name
    desc: Docker actions-toolkit Lima instance name
    for: [javascript, typescript]
    if:
      type: text
      substr: "limaInstanceName = 'docker-actions-toolkit'"

  - id: setup-docker-context
    desc: Docker setup action default context name
    for: [javascript, typescript]
    if:
      type: text
      substr: "contextName = opts.contextName || 'setup-docker-action'"

composite_rules:
  - id: docker-actions-toolkit-context
    desc: Recognized Docker actions-toolkit GitHub Action library
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: repository-url
      - id: copyright-header
      - id: lima-instance-name
      - id: setup-docker-context
