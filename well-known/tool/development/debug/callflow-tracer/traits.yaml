# CallFlow Tracer — Python call-graph tracing and observability library.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: callflow-tracer Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: callflow-tracer

  - id: package-metadata-name
    desc: callflow-tracer PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: callflow-tracer'

  - id: module-path
    desc: callflow_tracer Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)callflow_tracer/'

  - id: github-repo
    desc: rajveer43/callflow-tracer GitHub repository
    for: [json, markdown, text, python]
    if:
      type: text
      substr: rajveer43/callflow-tracer

  - id: console-entry
    desc: callflow-tracer CLI console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: callflow-tracer = callflow_tracer.command_line.main

composite_rules:
  - id: callflow-tracer-package
    desc: CallFlow Tracer profiling observability package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
