# Official Go build infrastructure (golang.org/x/build): coordinator, buildlet,
# gomote, and Windows builder provisioning scripts. Image setup legitimately
# disables Defender/firewall, creates admin service accounts, and reboots —
# behaviors that objective rules must not treat as hostile in this tree.
defaults:
  platforms: [unix, windows]
  for: [go, powershell, batch, shell, text, archive]
  crit: notable
  conf: 0.97

traits:
  # Keep ≤2 '/' separators so the same match works inside a module zip and on
  # an extracted tree (path-brittle validation).
  - id: module-tree-path
    desc: golang.org/x/build module tree path
    conf: 0.99
    if:
      type: path
      regex: 'golang\.org/x/build'

  - id: go-builder-data-url
    desc: Go builder data GCS bucket URL
    conf: 0.98
    for: [powershell, batch, shell, go, text]
    if:
      type: text
      substr: storage.googleapis.com/go-builder-data/

  - id: buildlet-main-import
    desc: Go buildlet main package import path
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: 'golang.org/x/build/cmd/buildlet'

  - id: go-x-build-import-prefix
    desc: golang.org/x/build package import prefix
    conf: 0.96
    for: [go]
    if:
      type: text
      substr: 'golang.org/x/build/'

composite_rules:
  - id: go-x-build-infra-context
    desc: Official golang.org/x/build infrastructure sources
    crit: exception
    conf: 0.99
    any:
      - id: module-tree-path
      - id: go-builder-data-url
      - id: buildlet-main-import
      - id: go-x-build-import-prefix
