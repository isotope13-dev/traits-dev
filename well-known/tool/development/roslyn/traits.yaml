defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.96
  size_max: 16777216

traits:
  - id: source-tree
    desc: Roslyn compiler source tree
    crit: notable
    for: [csharp, javascript, typescript, powershell, vbs]
    if:
      type: path
      regex: '(^|[\\/])roslyn-[0-9.]+[\\/]'
  - id: roslyn-runtime-assembly
    desc: Roslyn CodeAnalysis runtime assembly
    crit: notable
    for: [pe, dll]
    if:
      type: path
      basename: true
      # Same Microsoft.CodeAnalysis*.dll whether under /.roslyn/, lib/, or ref/.
      regex: '(?i)^Microsoft\.CodeAnalysis(\.[A-Za-z0-9.]+)?\.dll$'
