# Sass — Ruby CSS preprocessor (sass gem).
defaults:
  platforms: [unix, windows]
  for: [archives, data, tar, gem, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: sass-registry-basename
    desc: Sass RubyGems registry fetch basename
    for: [tar, gem, data, text]
    if:
      type: basename
      regex: '^sass@[0-9]+\.[0-9]'

composite_rules:
  - id: sass-gem-context
    desc: Official Sass Ruby gem package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: sass-registry-basename
      - id: well-known/tool/development/sdoc::ruby-gem-container-archive
