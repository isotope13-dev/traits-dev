# OpenClaw Crabbox (github.com/openclaw/crabbox) — remote runner and test execution control plane.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: go-module-path
    desc: Crabbox Go module import path
    for: [go, text]
    if:
      type: text
      substr: github.com/openclaw/crabbox

  - id: env-prefix
    desc: Crabbox environment variable prefix
    for: [go, shell, powershell, text]
    if:
      type: text
      regex: '\bCRABBOX_(SSH_USER|WORK_ROOT|AUTHORIZED_KEY|CACHE_VOLUME_PATH_|DESKTOP)\b'

  - id: powershell-recipe-helper
    desc: Crabbox PowerShell runner recipe helper function
    for: [powershell]
    if:
      type: text
      regex: '\b(New-CrabboxPassword|Assert-CrabboxFileSHA256|Resolve-CrabboxOpenSSHCommand)\b'

  - id: sudoers-dropin-path
    desc: Crabbox sudoers drop-in configuration path
    for: [go, shell, text]
    if:
      type: text
      substr: /etc/sudoers.d/crabbox

composite_rules:
  - id: crabbox-context
    desc: Recognized Crabbox runner and control plane context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: go-module-path
      - id: env-prefix
      - id: powershell-recipe-helper
      - id: sudoers-dropin-path
