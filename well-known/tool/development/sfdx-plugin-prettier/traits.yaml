# @jayree/sfdx-plugin-prettier — community Salesforce CLI plugin that
# formats retrieved metadata with Prettier after source retrieve/pull.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, markdown]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 2000000

traits:
  - id: package-name
    desc: jayree sfdx prettier plugin name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@jayree/sfdx-plugin-prettier'

  - id: npm-archive
    desc: jayree sfdx prettier npm archive
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@jayree/sfdx-plugin-prettier'

  - id: github-repo
    desc: jayree sfdx prettier GitHub repository
    if:
      type: text
      substr: github.com/jayree/sfdx-plugin-prettier

  - id: disable-prettier-env
    desc: SFDX disable prettier env var
    for: [javascript]
    if:
      type: text
      substr: SFDX_DISABLE_PRETTIER
