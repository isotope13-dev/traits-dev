# Transcrypt transparently encrypts sensitive files within a git repository (elasticdog/transcrypt).
# Its documented usage allows running the script directly from its GitHub repository via curl piped to bash.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: transcrypt-official-script-url
    desc: Official transcrypt script URL
    for: [shell, dockerfile, package.json, javascript, typescript]
    if:
      type: text
      substr: raw.githubusercontent.com/elasticdog/transcrypt/

  - id: transcrypt-download-pipe-script
    desc: transcrypt download script pipes to bash
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: 'raw\.githubusercontent\.com/elasticdog/transcrypt/[^\n|]{0,80}\|\s*(bash|sh)\b'
