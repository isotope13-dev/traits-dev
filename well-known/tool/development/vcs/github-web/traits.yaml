# github.com frontend bundles served from github.githubassets.com. Production
# chunks stamp a js-parse-end performance mark and GitHub catalog-service
# meta lookups; those are product identity, not generic minified-app behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 20000000

traits:
  - id: blob-page-rendered-source
    desc: GitHub blob page rendered source
    for: [html, javascript, python, shell]
    if:
      type: text
      substr: 'class="react-code-file-contents'

  - id: js-parse-end-mark
    desc: GitHub frontend js-parse-end mark
    conf: 0.98
    if:
      type: text
      substr: 'performance.mark("js-parse-end:'

  - id: catalog-service-meta
    desc: GitHub catalog-service meta tag
    conf: 0.97
    for: [html, javascript]
    if:
      type: text
      regex: 'meta\[name="current-catalog-service(-hash)?"\]'

  - id: githubassets-fetched-artifact-path
    desc: Fetched github.githubassets.com production chunk
    crit: notable
    conf: 0.98
    size_min: 0
    for: [javascript, typescript, text, html, data]
    if:
      type: path
      substr: github.githubassets.com

  - id: github-repo-fetched-path
    desc: Fetched github.com repository artifact
    crit: notable
    conf: 0.98
    size_min: 0
    for: [html, text, javascript, data]
    if:
      type: path
      regex: '(?i)github\.com'
    unless:
      # Go module archives root every member at the module path, which for a
      # GitHub-hosted module is github.com/<owner>/<repo>@<version>/... That
      # namespace is package identity, not a fetched github.com artifact.
      - type: path
        regex: '(?i)github\.com/[^/@\s]+/[^/@\s]+@v[0-9]'

composite_rules:
  - id: github-web-context
    desc: GitHub web page or application context
    crit: exception
    for: [html, javascript, typescript]
    any:
      - id: micro-behaviors/communications/url/host/name::githubassets-cdn-domain
      - id: catalog-service-meta
      - id: metadata/document/html::catalog-service-html-meta
      - id: blob-page-rendered-source
      - id: githubassets-fetched-artifact-path
      - id: github-repo-fetched-path
