defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 20000000
traits:
- id: blob-source-container-class
  desc: GitHub source container class reference
  for:
  - html
  if:
    type: text
    substr: class="react-code-file-contents
- id: js-parse-end-mark
  desc: GitHub frontend js-parse-end mark
  conf: 0.98
  if:
    type: text
    substr: 'performance.mark("js-parse-end:'
- id: catalog-service-meta
  desc: GitHub catalog-service meta tag
  conf: 0.97
  for:
  - html
  - javascript
  if:
    type: text
    regex: meta\[name="current-catalog-service(-hash)?"\]
- id: githubassets-fetched-artifact-path
  desc: Fetched github.githubassets.com production chunk
  crit: notable
  conf: 0.98
  size_min: 0
  for:
  - javascript
  - typescript
  - text
  - html
  - data
  if:
    type: path
    substr: github.githubassets.com

# The container class alone can be copied into executable source or arbitrary
# markup. Require an HTML page with an independent GitHub frontend meta tag.
composite_rules:
- id: blob-page-rendered-source
  desc: GitHub HTML source-view page
  for: [html]
  all:
  - id: blob-source-container-class
  - id: metadata/document/html/markup::catalog-service-html-meta
