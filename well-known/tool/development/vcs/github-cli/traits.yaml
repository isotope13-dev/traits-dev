defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: component
  conf: 0.98
  size_min: 1000000
  size_max: 200000000
traits:
  - id: official-release-installer-url
    desc: Official GitHub CLI release installer URL
    crit: notable
    conf: 0.99
    for: [powershell, batch, shell]
    size_min: 0
    size_max: 2000000
    if:
      type: text
      substr: github.com/cli/releases/download/
  - id: gh-auth-login-session-context
    desc: GitHub CLI login beside a token use
    crit: notable
    conf: 0.9
    for: [javascript, typescript, shell]
    size_min: 0
    if:
      type: text
      regex: 'gh auth login[\s\S]{0,400}(GITHUB_TOKEN|MCP authentication|token found)'
  - id: gh-auth-token-session-context
    desc: GitHub CLI token read beside GITHUB_TOKEN
    crit: notable
    conf: 0.9
    for: [javascript, typescript, shell]
    size_min: 0
    if:
      type: text
      # Developer CLIs shell out to `gh auth token` for the operator's own
      # session and fall back to GITHUB_TOKEN. The window covers the
      # PATH-hijack notes those clients wrap around the call.
      regex: 'gh auth token[\s\S]{0,900}GITHUB_TOKEN'
  - id: go-module-path-elf
    crit: notable
    desc: GitHub CLI Go module path on ELF
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/cli/v2
  - id: go-module-path-macho
    crit: notable
    desc: GitHub CLI Go module path on Mach-O
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/cli/v2
  - id: go-module-path-pe
    crit: notable
    desc: GitHub CLI Go module path on PE
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/cli/v2
  - id: executable-name
    crit: notable
    desc: GitHub CLI executable name
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '^gh(\.exe)?$'
  - id: codespaces-ssh-template
    crit: notable
    desc: GitHub CLI Codespaces SSH template
    if:
      type: text
      substr: AutomaticIdentityFilePath
      section: .rodata
composite_rules:
  - id: auth-helper-context
    desc: GitHub CLI auth helper context
    crit: notable
    conf: 0.9
    for: [javascript, typescript, shell]
    size_min: 0
    any:
      - id: gh-auth-login-session-context
      - id: gh-auth-token-session-context
  - id: go-module-path
    desc: GitHub CLI Go module path
    crit: component
    any:
      - id: go-module-path-elf
      - id: go-module-path-macho
      - id: go-module-path-pe
  - id: github-cli-binary
    desc: GitHub CLI binary
    crit: notable
    conf: 0.99
    all:
      - id: go-module-path
    any:
      - id: executable-name
      - id: codespaces-ssh-template
