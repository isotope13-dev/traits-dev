# Gitto — Git-like CLI for PokéPaste Pokémon team version control.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: gitto-cli Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: gitto-cli

  - id: package-metadata-name
    desc: gitto-cli PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: gitto-cli'

  - id: module-path
    desc: gitto Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])gitto([\\/]|$)'

  - id: gitto-command-class
    desc: GittoCommand CLI handler class
    for: [python]
    if:
      type: text
      substr: class GittoCommand

  - id: pokepaste-marker
    desc: PokéPaste team version control marker
    for: [python, markdown, text]
    if:
      type: text
      substr: PokéPaste

  - id: console-entry
    desc: gitto CLI console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: gitto = gitto.cli.repl

composite_rules:
  - id: gitto-cli-package
    desc: Gitto PokéPaste team version control CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
      - id: pokepaste-marker
