# Git Credential Manager (GCM) source. The TLS-verification callback in
# HttpClientFactory is gated on the user's opt-out setting, and GCM prints a
# SECURITY WARNING before installing it. The exception identifies that vendor
# source so the unconditional-callback capability reads as the documented
# opt-in, not a bypass. The callback itself stays a capability.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
  conf: 0.96

traits:
  - id: gcm-tls-verification-disabled-warning
    desc: GCM TLS verification disabled warning string
    if:
      type: text
      substr: TLS certificate verification has been disabled!

  - id: gcm-namespace-declaration
    desc: GitCredentialManager namespace declaration
    if:
      type: text
      substr: namespace GitCredentialManager

composite_rules:
  - id: gcm-tls-verification-opt-in
    desc: Git Credential Manager source with opt-out TLS warning
    crit: exception
    conf: 0.98
    all:
      - id: gcm-tls-verification-disabled-warning
      - id: gcm-namespace-declaration
