defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 1000000

traits:
  - id: go-module-path
    # gitaly, gitaly-backup, praefect and gitaly-debug share this module;
    # the /vN suffix tracks the major release.
    desc: Gitaly Go module path
    if:
      type: value
      path: elf.go.module.path
      regex: '^gitlab\.com/gitlab-org/gitaly(/v[0-9]+)?$'
