defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.98

traits:
  - id: yifei-wang-signed-sqlite3-cli-marker
    desc: GeekLink signed macOS executable
    size_min: 10000
    size_max: 5000000
    if:
      type: value
      path: macho.code_signature.team_id
      exact: W2JDUCL7MY

composite_rules:
  # A standalone SQLite shell built and signed by GeekLink's publisher. Its
  # SQLite math extension exports the same libm and process primitives that
  # the AMOS cipher heuristic used to misread as a lookup-table cipher.
  - id: yifei-wang-signed-sqlite3-cli
    desc: Yifei Wang signed SQLite command-line utility
    all:
      - id: yifei-wang-signed-sqlite3-cli-marker
      - id: metadata/signed/id::sqlite3
      - id: micro-behaviors/data/db/sqlite::sqlite3-open
      - id: metadata/lang/runtime::main-entry-symbol
