# Bridge CLI (usebridgeai/cli) — AGPL storage bridge for AI agents.
# install.sh downloads a GitHub release tarball, verifies SHA-256 checksums,
# and appends the install directory to shell PATH profiles.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98

traits:
  - id: bridge-cli-package-name
    desc: bridge-cli Cargo package name
    for: [cargo.toml, crate]
    if:
      type: value
      path: crate.name
      exact: bridge-cli

  - id: bridge-ls-homepage
    desc: Bridge CLI homepage marker
    for: [cargo.toml, crate, markdown]
    if:
      type: text
      substr: bridge.ls

  - id: install-script-header
    desc: Bridge CLI install.sh script header
    for: [shell]
    if:
      type: text
      substr: '# Bridge CLI installer'

  - id: checksum-verification-block
    desc: Bridge installer SHA-256 checksum verification
    for: [shell]
    if:
      type: text
      regex: 'shasum -a 256|sha256sum.{0,40}bridge'

composite_rules:
  - id: bridge-cli-verified-installer
    desc: Bridge CLI verified release installer
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: bridge-cli-package-name
      - id: install-script-header
      - id: checksum-verification-block
