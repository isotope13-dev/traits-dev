# Bridge CLI (usebridgeai/cli) — AGPL storage bridge for AI agents.
# install.sh downloads a GitHub release tarball, verifies SHA-256 checksums,
# and appends the install directory to shell PATH profiles.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98

traits:
  - id: bridge-cli-package-name
    desc: bridge-cli Cargo package name
    for: [cargo.toml, crate]
    if:
      type: value
      path: crate.name
      exact: bridge-cli

  - id: bridge-ls-homepage
    desc: Bridge CLI homepage marker
    for: [cargo.toml, crate, markdown]
    if:
      type: text
      substr: bridge.ls

  - id: install-script-header
    desc: Bridge CLI install.sh script header
    for: [shell]
    if:
      type: text
      substr: '# Bridge CLI installer'

  # Only the half of the old `checksum-verification-block` that actually names
  # Bridge stays here. Its other branch was a bare `shasum -a 256`, which every
  # installer that checksums a macOS download contains -- so an unrelated Go
  # project's install.sh was reported as "Bridge installer SHA-256 checksum
  # verification". The generic command now lives in
  # micro-behaviors/crypto/hash/digest and is referenced below, which is also
  # what keeps this exception firing on the Linux `sha256sum` spelling.
  - id: bridge-checksum-file-reference
    desc: Bridge release checksum file reference
    for: [shell]
    if:
      type: text
      regex: 'sha256sum.{0,40}bridge'

composite_rules:
  - id: bridge-cli-verified-installer
    desc: Bridge CLI verified release installer
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: bridge-cli-package-name
      - id: install-script-header
    any:
      - id: bridge-checksum-file-reference
      - id: micro-behaviors/crypto/hash/digest::shell-sha256-checksum-command
