# npm CLI — Node package manager.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: official npm CLI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: npm

  - id: vendored-path
    desc: vendored npm package path
    for: [scripts, manifests, data, source, text]
    if:
      type: path
      regex: 'node_modules/npm/'

  # npm's installed entrypoint normally lives at npm/lib/cli.js and is a
  # tiny bootstrap into cli/entry.js. Keep both the path and source shape:
  # replacement malware can erase the original bootstrap entirely, while a
  # standalone file scan may not retain its installation-root path.
  - id: internal-cli-entrypoint-path
    desc: npm internal CLI entrypoint path
    if:
      type: path
      regex: 'npm[/\\]lib[/\\]cli\.js$'

  - id: internal-cli-bootstrap
    desc: npm internal CLI engine-validation bootstrap
    if:
      type: text
      regex: 'require\(["'']\./cli/validate-engines\.js["'']\)[\s\S]{0,500}["'']cli/entry\.js["'']'


composite_rules:
  - id: npm-cli-library
    desc: official npm CLI package
    any:
      - id: package-name
      - id: vendored-path

  - id: npm-cli-entrypoint
    desc: official npm CLI internal entrypoint
    any:
      - id: internal-cli-entrypoint-path
      - id: internal-cli-bootstrap
