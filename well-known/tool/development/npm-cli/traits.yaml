# npm CLI — Node package manager.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: official npm CLI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: npm

  - id: vendored-path
    desc: vendored npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/npm/'


composite_rules:
  - id: npm-cli-library
    desc: official npm CLI package
    any:
      - id: package-name
      - id: vendored-path
