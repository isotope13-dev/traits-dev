# sdoc — Ruby HTML documentation generator for Rails/RDoc projects.
defaults:
  platforms: [unix, windows]
  for: [archives, data, tar, gem, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: sdoc-registry-basename
    desc: sdoc RubyGems registry fetch basename
    for: [tar, gem, data, text]
    if:
      type: basename
      regex: '^sdoc@[0-9]+\.[0-9]'

  - id: ruby-gem-metadata-member
    desc: Ruby gem metadata.gz tar member
    if:
      type: text
      substr: metadata.gz

  - id: ruby-gem-data-member
    desc: Ruby gem data.tar.gz tar member
    if:
      type: text
      substr: data.tar.gz

composite_rules:
  - id: ruby-gem-container-archive
    desc: Ruby gem container archive layout
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: ruby-gem-metadata-member
      - id: ruby-gem-data-member

  - id: sdoc-gem-context
    desc: Official sdoc Ruby gem package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: sdoc-registry-basename
      - id: ruby-gem-container-archive
