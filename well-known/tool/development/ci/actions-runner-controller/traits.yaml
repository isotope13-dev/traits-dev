# Actions Runner Controller (ARC) Kubernetes operator for GitHub Actions runners.
defaults:
  platforms: [unix, windows]
  for: [shell, dockerfile]
  crit: notable
  conf: 0.98

traits:
  - id: arc-docker-mtu-propagation
    desc: Actions Runner Controller Docker MTU setting
    if:
      type: text
      substr: ARC_DOCKER_MTU_PROPAGATION

  - id: arc-docker-shim-basename
    desc: Actions Runner Controller docker-shim script
    for: [shell]
    if:
      type: path
      basename: true
      exact: docker-shim.sh

composite_rules:
  - id: actions-runner-controller-docker-shim
    desc: Actions Runner Controller Docker runner shim
    crit: exception
    conf: 0.98
    for: [shell]
    all:
      - id: arc-docker-mtu-propagation
      - id: arc-docker-shim-basename
