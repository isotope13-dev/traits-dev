# PyPA cibuildwheel — composite GitHub Action that builds wheels via a venv
# bootstrap step, then evals the quoted cibuildwheel CLI from GITHUB_OUTPUT
# (CIBW_CMD_BASH). The eval is load-bearing, not a remote payload dropper.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.99

traits:
  - id: cibuildwheel-action-name
    desc: cibuildwheel GitHub composite action name
    if:
      type: value
      path: name
      exact: cibuildwheel

  - id: cibw-cmd-bash-output
    desc: cibuildwheel cmd-bash GitHub output key
    if:
      type: text
      substr: cmd-bash=

composite_rules:
  - id: cibuildwheel-composite-action-context
    desc: PyPA cibuildwheel composite GitHub Action
    crit: exception
    conf: 0.99
    all:
      - id: cibuildwheel-action-name
      - id: cibw-cmd-bash-output
