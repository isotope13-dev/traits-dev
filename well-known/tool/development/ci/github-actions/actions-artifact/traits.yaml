# actions/toolkit/packages/artifact — official GitHub Actions artifact library.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: actions artifact library package name
    if:
      type: value
      path: name
      exact: '@actions/artifact'

  - id: repository-url
    desc: actions artifact repository URL
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/actions/toolkit'
