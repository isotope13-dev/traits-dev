# Chocobo1/setup-ccache-action — installs and configures ccache on GHA.
# Bundled ncc dist/main is the published action, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 600000000

traits:
  - id: action-name
    desc: setup-ccache GitHub Action name
    for: [github-actions]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Setup ccache action

  - id: package-name
    desc: setup-ccache-action npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@Chocobo1/setup-ccache-action'

  - id: github-repo
    desc: Chocobo1 setup-ccache-action repository
    conf: 0.98
    if:
      type: text
      substr: github.com/Chocobo1/setup-ccache-action
