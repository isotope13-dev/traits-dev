# crazy-max/ghaction-setup-docker — installs Docker Engine in GitHub Actions.
# The ncc bundle may place a detached spawn near get.docker.com curl|sh docs.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: setup-docker Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: setup-docker-action

  - id: docker-package-name
    desc: Official Docker setup-docker npm name
    for: [package.json]
    if:
      type: value
      path: name
      exact: docker-setup-docker

  - id: github-repo
    desc: crazy-max setup-docker Action repository
    if:
      type: text
      substr: github.com/crazy-max/ghaction-setup-docker

  - id: docker-github-repo
    desc: Official Docker setup-docker-action repository
    if:
      type: text
      substr: github.com/docker/setup-docker-action

  - id: dist-tree
    desc: setup-docker Action distribution tree
    for: [javascript]
    if:
      type: path
      regex: '(?i)setup-docker-action-[^\\/]+[\\/]dist'
