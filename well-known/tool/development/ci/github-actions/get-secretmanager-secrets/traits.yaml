# google-github-actions/get-secretmanager-secrets — official Google GitHub
# Action that fetches Secret Manager values into workflow outputs. Bundles
# google-auth-library via ncc; AWS env-var strings in that dependency are
# workload-identity federation support, not AWS credential theft.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, markdown, text, gz, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: get-secretmanager-secrets package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: get-secretmanager-secrets

  - id: repository-url
    desc: Official google-github-actions repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/google-github-actions/get-secretmanager-secrets'

  - id: action-user-agent
    desc: get-secretmanager-secrets Action user-agent
    for: [javascript, typescript]
    if:
      type: text
      substr: 'google-github-actions:get-secretmanager-secrets/'

  - id: dist-tree
    desc: get-secretmanager-secrets distribution tree
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)get-secretmanager-secrets-[^/\\]+[\\/]dist'

composite_rules:
  - id: official-action-context
    desc: Official Google Secret Manager GitHub Action
    crit: notable
    conf: 0.99
    # package.json identity + dist/user-agent live in different archive entries
    scope: archive
    all:
      - id: package-name
      - id: repository-url
    any:
      - id: action-user-agent
      - id: dist-tree
