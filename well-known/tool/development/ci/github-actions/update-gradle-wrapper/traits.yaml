# update-gradle-wrapper-action — official GitHub Action that bumps Gradle Wrapper
# versions. Debug logging of process.env during CI is expected, not exfiltration.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, gz, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: update-gradle-wrapper-action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: update-gradle-wrapper-action

  - id: gradle-update-robot-marker
    desc: Gradle Update Robot git identity
    for: [javascript, typescript]
    if:
      type: text
      substr: gradle-update-robot

  - id: wrapper-properties-finder
    desc: Gradle wrapper properties finder
    for: [javascript, typescript]
    if:
      type: text
      substr: findWrapperPropertiesFiles

composite_rules:
  - id: official-action-context
    desc: Official Gradle Wrapper update GitHub Action
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: gradle-update-robot-marker
      - id: wrapper-properties-finder
