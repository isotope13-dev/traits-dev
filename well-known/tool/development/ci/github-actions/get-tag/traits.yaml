# olegtarasov/get-tag — GitHub Action that exports GIT_TAG_NAME.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, gz, tar]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 600000000

traits:
  - id: action-name
    desc: Get tag name Action display name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Get tag name

  - id: git-tag-env
    desc: GIT_TAG_NAME environment variable export
    for: [javascript, typescript]
    if:
      type: text
      substr: GIT_TAG_NAME

  - id: action-repo
    desc: olegtarasov get-tag Action repository
    for: [github-actions, package.json, javascript, typescript, text]
    if:
      type: text
      substr: olegtarasov/get-tag

  - id: source-tree
    desc: get-tag Action source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])get-tag-[0-9]'

composite_rules:
  - id: get-tag-action
    desc: Recognized olegtarasov get-tag Action
    needs: 2
    any:
      - id: action-name
      - id: git-tag-env
      - id: action-repo
      - id: source-tree
