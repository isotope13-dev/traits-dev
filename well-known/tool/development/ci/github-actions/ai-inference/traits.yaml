# GitHub's official actions/ai-inference Action.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, gz, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: package-name
    desc: ai-inference Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ai-inference

  - id: action-name
    desc: AI Inference GitHub Action name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: AI Inference

  - id: models-endpoint
    desc: GitHub Models inference API endpoint
    for: [github-actions, javascript, typescript]
    if:
      type: text
      substr: models.github.ai/inference

  - id: source-tree
    desc: ai-inference Action source tree path
    if:
      type: path
      regex: '(?i)ai-inference-[0-9a-f]{8,}'

composite_rules:
  - id: ai-inference-action
    desc: Recognized GitHub AI Inference Action
    needs: 2
    any:
      - id: package-name
      - id: action-name
      - id: models-endpoint
      - id: source-tree
