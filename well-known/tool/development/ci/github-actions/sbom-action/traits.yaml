# Anchore sbom-action — GitHub Action that downloads Syft and uploads SBOMs.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, gz, crate, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: package-name
    desc: Anchore sbom-action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@anchore/sbom-action'

  - id: repository-url
    desc: Anchore sbom-action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/anchore/sbom-action'

  - id: dist-tree
    desc: sbom-action distribution tree path
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)sbom-action-[^/\\]+[\\/]dist'

  - id: syft-action-description
    desc: sbom-action Syft SBOM description
    for: [text, package.json]
    if:
      type: text
      substr: GitHub Action for creating software bill of materials
