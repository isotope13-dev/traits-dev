# potatoqualitee/mssqlsuite GitHub Action
defaults:
  platforms: [unix, windows]
  for: [github-actions, powershell, shell, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 5000000

traits:
  - id: action-name
    desc: mssqlsuite GitHub Action display name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: "mssql suite"

  - id: mssqlsuite-repo
    desc: mssqlsuite GitHub Action repository reference
    if:
      type: text
      regex: '(?i)(github\.com/)?potatoqualitee/mssqlsuite'

  - id: mssqlsuite-default-sa-password
    desc: mssqlsuite default sa password reference
    for: [powershell, github-actions]
    if:
      type: text
      substr: "dbatools.I0"

  - id: mssqlsuite-install-options
    desc: mssqlsuite Install parameter option set
    for: [powershell]
    if:
      type: text
      substr: 'sqlclient", "sqlpackage", "sqlengine", "localdb'

composite_rules:
  - id: mssqlsuite-action-context
    desc: Recognized mssqlsuite GitHub Action context
    crit: exception
    conf: 0.99
    any:
      - id: action-name
      - id: mssqlsuite-repo
      - id: mssqlsuite-default-sa-password
      - id: mssqlsuite-install-options
