# mikepenz/action-junit-report — publishes JUnit XML as GitHub checks.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: action-junit-report npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: action-junit-report

  - id: github-repo
    desc: action-junit-report GitHub repository
    if:
      type: text
      substr: github.com/mikepenz/action-junit-report

  - id: dist-tree
    desc: action-junit-report distribution tree
    for: [javascript]
    if:
      type: path
      regex: '(?i)action-junit-report-[^\\/]+[\\/]dist'
