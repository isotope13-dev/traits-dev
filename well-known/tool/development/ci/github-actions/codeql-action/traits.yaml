defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - github-actions
  - javascript
  - typescript
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: CodeQL Action package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: codeql
- id: package-description
  desc: CodeQL Action package description
  for:
  - package.json
  if:
    type: value
    path: description
    exact: CodeQL action
- id: action-stub
  desc: CodeQL GitHub Action stub manifest
  for:
  - github-actions
  if:
    type: value
    path: name
    exact: 'CodeQL: Stub'
- id: proxy-binary-reference
  desc: CodeQL launcher references update-job-proxy
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: update-job-proxy
- id: codeql-release-download
  desc: CodeQL launcher references its GitHub release
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: github.com/github/codeql-action/releases/download
- id: dependabot-proxy-ca
  desc: CodeQL launcher creates Dependabot proxy CA
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: Dependabot Internal CA
