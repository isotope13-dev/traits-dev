# Geode-solutions GitHub Actions tooling
defaults:
  platforms: [unix, windows]
  for: [github-actions, javascript, typescript, shell]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 5000000

traits:
  - id: geode-release-action-name
    desc: Geode-solutions download GitHub release action
    for: [github-actions]
    if:
      type: value
      path: name
      exact: "Download GitHub Release"

  - id: geode-solutions-owner
    desc: Geode-solutions repository owner reference
    if:
      type: text
      substr: "Geode-solutions"

  - id: geode-solutions-repo
    desc: Geode-solutions actions repository
    if:
      type: text
      regex: '(?i)(github\.com/)?geode-solutions/actions'

composite_rules:
  - id: geode-actions-context
    desc: Recognized Geode-solutions GitHub Action context
    crit: exception
    conf: 0.99
    any:
      - id: geode-release-action-name
      - id: geode-solutions-owner
      - id: geode-solutions-repo
