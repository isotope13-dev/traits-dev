# Docker's official login GitHub Action bundles its Node implementation into
# dist/index.js.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Docker login Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: docker-login

  - id: repository-url
    desc: Docker login Action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/docker/login-action'

  - id: dist-tree
    desc: Docker login Action distribution tree
    for: [javascript]
    if:
      type: path
      regex: '(?i)login-action-[^\\/]+[\\/]dist'
