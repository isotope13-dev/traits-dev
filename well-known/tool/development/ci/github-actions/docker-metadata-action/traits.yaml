# Docker's official metadata GitHub Action bundles its Node implementation into
# dist/index.js.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Docker metadata Action package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: docker-metadata

  - id: repository-url
    desc: Docker metadata Action repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github[.]com/docker/metadata-action'

  - id: dist-tree
    desc: Docker metadata Action distribution tree
    for: [javascript]
    if:
      type: path
      regex: '(?i)metadata-action-[^\\/]+[\\/]dist'
