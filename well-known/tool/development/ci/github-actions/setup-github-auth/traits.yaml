# provide-io/ci-tooling setup-github-auth GitHub Action
# Configures git authentication for private repositories using organization helper tokens.
# An inline base64-encoded Python script sets global git insteadOf rules for helper PATs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: action-name
    desc: Setup GitHub Auth action name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Setup GitHub Auth

  - id: action-author
    desc: provide.io llc action author
    for: [github-actions]
    if:
      type: value
      path: author
      exact: provide.io llc

  - id: setup-github-auth-path
    desc: Setup GitHub Auth action path
    for: [shell]
    if:
      type: path
      regex: 'setup-github-auth'

  - id: auth-helper-script
    desc: Setup GitHub Auth helper script logic
    for: [shell]
    if:
      type: text
      substr: /tmp/setup_auth.py

  - id: helpers-json-var
    desc: Setup GitHub Auth HELPERS_JSON variable
    for: [shell]
    if:
      type: text
      substr: HELPERS_JSON

composite_rules:
  - id: setup-github-auth-manifest
    desc: Setup GitHub Auth composite action manifest
    crit: exception
    conf: 0.99
    for: [github-actions]
    all:
      - id: action-name
      - id: action-author

  - id: setup-github-auth-step-script
    desc: Setup GitHub Auth step script
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: setup-github-auth-path
      - id: auth-helper-script
      - id: helpers-json-var

  - id: setup-github-auth-context
    desc: Recognized provide-io setup-github-auth GitHub Action context
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, gz, zip, github-actions, shell]
    any:
      - id: setup-github-auth-manifest
      - id: setup-github-auth-step-script
