# githubnext/gh-cao (central-agentic-ops) installs GitHub's gh-aw compiler
# by piping the official install-gh-aw.sh from github/gh-aw to bash.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: gh-aw-official-installer-url
    desc: Official gh-aw installer script URL
    for: [shell, dockerfile, package.json, javascript, typescript]
    if:
      type: text
      substr: raw.githubusercontent.com/github/gh-aw/

  - id: gh-aw-download-pipe-script
    desc: gh-aw installer script pipes to bash
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: 'raw\.githubusercontent\.com/github/gh-aw/[^\n|]{0,80}\|\s*bash'
