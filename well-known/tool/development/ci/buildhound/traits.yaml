# BuildHound — self-hosted GitHub Actions runners on owned Macs/servers
# (https://buildhound.sh). `runner add` installs a user LaunchAgent/systemd
# unit and `setup` registers its MCP server with the local coding agents;
# both are explicit, documented user commands.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: BuildHound npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: buildhound

  - id: homepage
    desc: BuildHound product site reference
    if:
      type: text
      substr: buildhound.sh

  - id: control-plane-host
    desc: BuildHound control-plane API host
    for: [javascript, typescript]
    if:
      type: text
      substr: api.buildhound.sh

  - id: cli-user-agent
    desc: BuildHound CLI user-agent string
    for: [javascript, typescript]
    if:
      type: text
      substr: buildhound-cli

  - id: setup-marker
    desc: BuildHound agent setup consent marker
    for: [javascript, typescript]
    if:
      type: text
      substr: installed by buildhound setup agent

composite_rules:
  - id: buildhound-package
    desc: BuildHound self-hosted runner CLI package
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: homepage
      - id: control-plane-host
      - id: cli-user-agent
      - id: setup-marker
    needs: 2
