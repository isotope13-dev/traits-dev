# Google Skia Buildbot infrastructure (go.skia.org/infra / github.com/google/skia-buildbot).
# Continuous integration, Swarming bot setup, and cluster management for Skia.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, text, zip, tar]
  crit: notable
  conf: 0.98

traits:
  - id: skia-infra-module-path
    desc: Skia infrastructure Go module path
    conf: 0.99
    if:
      type: text
      substr: 'go.skia.org/infra'

  - id: skia-buildbot-repo-path
    desc: Skia buildbot repository path
    conf: 0.99
    if:
      type: path
      substr: 'skia-buildbot'

  - id: skia-swarming-setup-script
    desc: Skia swarming bot setup script
    conf: 0.99
    for: [shell, powershell]
    if:
      type: path
      basename: true
      regex: '^setup-(win\.ps1|linux\.sh)$'

composite_rules:
  - id: skia-buildbot-infra-context
    desc: Google Skia buildbot infrastructure repository
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: skia-infra-module-path
      - id: skia-buildbot-repo-path
      - id: skia-swarming-setup-script
