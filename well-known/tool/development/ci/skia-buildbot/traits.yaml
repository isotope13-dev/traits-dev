defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  - text
  - zip
  - tar
  crit: notable
  conf: 0.98
traits:
- id: skia-infra-module-path
  desc: Skia infrastructure Go module path
  conf: 0.99
  if:
    type: path
    substr: go.skia.org/infra
- id: skia-infra-module-text
  desc: Skia infrastructure Go module text reference
  conf: 0.99
  if:
    type: text
    substr: go.skia.org/infra
- id: skia-buildbot-repo-path
  desc: Skia buildbot repository path
  conf: 0.99
  if:
    type: path
    substr: skia-buildbot
- id: skia-swarming-setup-script
  desc: Skia swarming bot setup script
  conf: 0.99
  for:
  - shell
  - powershell
  if:
    type: path
    basename: true
    regex: ^(win_setup\.ps1|setup-(win\.ps1|linux\.sh))$
