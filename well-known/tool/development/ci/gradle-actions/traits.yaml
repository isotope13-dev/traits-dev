# gradle/actions — the official GitHub Actions for Gradle builds. The caching
# half ships as `gradle-actions-caching`, a proprietary component vendored
# under sources/vendor/ as a javascript-obfuscator bundle (its package.json
# says "VENDORED BUILD - DO NOT EDIT" and licenses it to Gradle Inc). The
# obfuscation is the vendor's licence protection, not concealment.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  conf: 0.95

traits:
  - id: vendored-caching-package-name
    desc: Package is gradle-actions-caching
    crit: notable
    size_min: 1
    if:
      type: value
      path: name
      exact: gradle-actions-caching

  - id: vendored-caching-license
    desc: Package licensed to Gradle Inc
    crit: notable
    size_min: 1
    if:
      type: value
      path: license
      exact: Gradle Inc

composite_rules:
  - id: vendored-caching-component-context
    desc: Archive vendors the Gradle caching component
    crit: exception
    all:
      - id: vendored-caching-package-name
      - id: vendored-caching-license
