defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, text]
  crit: notable
  conf: 0.99

traits:
  - id: danger-npm-package-name
    desc: danger npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: danger

  - id: danger-env-token
    desc: Danger CI token environment variable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'DANGER_(GITHUB_API_TOKEN|VERBOSE_SHOW_TOKEN|GITLAB_API_TOKEN|BITBUCKETSERVER_HOST)'

  - id: danger-repo-url
    desc: Danger JS GitHub repository URL
    if:
      type: text
      substr: 'github.com/danger/danger-js'

  - id: danger-cli-bin-marker
    desc: Danger CLI binary marker
    for: [package.json]
    if:
      type: value
      path: bin.danger
      exact: distribution/commands/danger.js

composite_rules:
  - id: danger-ci-context
    desc: Danger JS CI review automation tool
    crit: exception
    conf: 0.99
    any:
      - id: danger-npm-package-name
      - id: danger-env-token
      - id: danger-repo-url
      - id: danger-cli-bin-marker
