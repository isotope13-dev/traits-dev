defaults:
  platforms:
  - unix
  - windows
  for:
  - gz
  - package.json
  - javascript
  - typescript
  - github-actions
  - tar
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000
traits:
- id: package-name
  desc: vmactions FreeBSD VM Action package name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: (?i)^vmactions-freebsd$
- id: repository-url
  desc: vmactions FreeBSD Action repository URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: (?i)github[.]com/vmactions/freebsd(-vm)?([.]git)?$
- id: package-member-name
  desc: vmactions FreeBSD Action member package identity
  for:
  - javascript
  - typescript
  - github-actions
  if:
    type: value
    path: package.json::name
    regex: (?i)^vmactions-freebsd$
- id: action-package-path
  desc: vmactions FreeBSD Action source path
  for:
  - gz
  - package.json
  - javascript
  - typescript
  - github-actions
  if:
    type: path
    basename: true
    regex: (?i)^freebsd-vm-([0-9]|main|[a-f0-9]{7,40})
- id: freebsd-builder-release-url
  desc: Official vmactions FreeBSD builder release URL
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: github.com/vmactions/freebsd-builder/releases/download/
