# check-version-change — jfrz38 GitHub Action for registry version comparison.
defaults:
  platforms: [unix, windows]
  for: [package.json, github-actions, javascript, typescript, tar, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: package-or-action-name
    desc: check-version-change package or action name
    for: [package.json, github-actions]
    if:
      type: value
      path: name
      exact: check-version-change

  - id: github-repo-marker
    desc: jfrz38 check-version-change GitHub repository
    for: [package.json, markdown, javascript, github-actions]
    if:
      type: text
      substr: github.com/jfrz38/check-version-change

  - id: github-action-keyword
    desc: GitHub Action package keyword marker
    for: [package.json]
    if:
      type: text
      substr: '"github-action"'

composite_rules:
  - id: check-version-change-action
    desc: check-version-change registry version GitHub Action
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-or-action-name
      - id: github-repo-marker
