# AFL++ ships instrumentation utilities and curated malformed inputs for
# documentation and regression testing — not host-discovery or anti-analysis.
defaults:
  platforms: [unix, windows]
  for: [gz, zip, tar, crate, c, cpp, elf]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: aflplusplus-crate-path
    desc: AFLplusplus crate package path
    if:
      type: path
      regex: '(?i)(^|[/\\:])afl(@|-)[0-9]'

  - id: aflplusplus-source-tree
    desc: AFLplusplus source tree member path
    if:
      type: path
      regex: '(?i)(^|[/\\])AFLplusplus([/\\]|$)'

  - id: afl-vuln-sample-corpus-path
    desc: AFL vulnerability sample corpus path
    if:
      type: path
      regex: '(?i)(^|[/\\])(vuln_samples|testcases)[/\\]'

composite_rules:
  - id: aflplusplus-context
    desc: Recognized AFLplusplus fuzzing framework
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: aflplusplus-crate-path
      - id: aflplusplus-source-tree

  - id: afl-vuln-sample-corpus-context
    desc: AFL intentional malformed sample corpus
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: aflplusplus-context
      - id: afl-vuln-sample-corpus-path
