# Emscripten toolchain (emscripten-core/emscripten).
# Compiles C and C++ to WebAssembly and JavaScript using LLVM and Clang.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, text]
  crit: notable
  conf: 0.95

traits:
  - id: emscripten-source-archive-path
    desc: Emscripten toolchain source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])emscripten(-core)?([\\/@]|$)'

  - id: emscripten-authors-banner
    desc: Emscripten authors license banner
    if:
      type: text
      substr: 'The Emscripten Authors'

  - id: emscripten-memoryprofiler-identifier
    desc: Emscripten memory profiler tool identifier
    if:
      type: text
      substr: 'emscriptenMemoryProfiler'
