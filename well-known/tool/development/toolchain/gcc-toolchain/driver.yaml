# GCC's own libexec drivers, as a distribution installs them.
#
# `cc1`, `cc1plus`, `lto1`, `f951`, `collect2` and `lto-wrapper` live under
# `<prefix>/libexec/gcc/<triplet>/<version>/` and are invoked by the `gcc`
# driver rather than by users. They embed GCC's option table and diagnostic
# strings, which is why keyword rules land on them: the official gcc:bookworm
# image scored `usr/local/libexec/gcc/x86_64-linux-gnu/15.2.0/lto-wrapper`
# suspicious for `rootkit-keywords`, on `ftrace` plus `taint` -- two words out
# of a compiler's own vocabulary. That rule's `taint-keyword` leg already
# carries the comment "A lone compiler diagnostic mentioning taint is not
# rootkit evidence"; this identity is what lets that reasoning reach the
# compiler.
#
# Both legs are required. The basename alone is a name, and `libexec/gcc/`
# alone is a directory; together they are the toolchain's own driver, in the
# place the toolchain installs it.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.97
  # well-known/ traits need a size filter; a compiler driver is a real binary,
  # not a stub, and none ship anywhere near 200MB.
  size_min: 4096
  size_max: 209715200

traits:
  - id: gcc-libexec-path
    desc: GCC libexec directory path
    conf: 0.95
    if:
      type: path
      regex: 'libexec/gcc/'

composite_rules:
  - id: gcc-compiler-driver
    desc: GCC libexec compiler driver
    crit: exception
    conf: 0.99
    scope: file
    all:
      # The basename list lives in traits.yaml beside the other GCC identities
      # rather than being restated here, which would make this a superset of it.
      - id: gcc-libexec-compiler-basename
      - id: gcc-libexec-path
