defaults:
  crit: notable
  conf: 0.98
  platforms: [unix]
  for: [elf]

traits:
  - id: gcc-cpp-frontend-executable
    desc: GCC C++ compiler frontend executable
    if:
      type: basename
      exact: cc1plus
  - id: gcc-c-frontend-executable
    desc: GCC C compiler frontend executable
    if:
      type: basename
      exact: cc1
  - id: gcc-lto-frontend-executable
    desc: GCC LTO compiler frontend executable
    if:
      type: basename
      exact: lto1
  - id: gcc-fortran-frontend-executable
    desc: GCC Fortran compiler frontend executable
    if:
      type: basename
      exact: f951

