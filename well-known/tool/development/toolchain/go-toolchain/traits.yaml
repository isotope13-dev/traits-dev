defaults:
  platforms: [unix, windows]
  # `data` belongs here: toolchain trees ship constant tables (for example
  # crypto/internal/nistec/p256_asm_table.bin) whose entropy trips opaque-blob
  # rules; the path still proves the toolchain-tree location.
  for: [source, scripts, binaries, text, tar, zip, data]
  size_max: 200000000

traits:
  - id: go-toolchain-bin-path
    desc: Go toolchain binary path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: 'go/bin/(go|gofmt|godoc)(\.exe)?$'

  - id: go-toolchain-tool-path
    desc: Go toolchain pkg/tool binary path
    crit: notable
    conf: 0.98
    if:
      type: path
      # Shallow marker for `go/pkg/tool/<os_arch>/<name>` compilers and linkers.
      regex: 'go/pkg/tool'

  - id: go-toolchain-source-path
    desc: Go toolchain source tree path
    crit: notable
    conf: 0.98
    if:
      type: path
      # Official trees place stdlib under go/src, tests under go/test, and
      # platform helpers under go/misc (for example iOS exec wrappers).
      regex: 'go/(src|test|misc)/'

  - id: go-testdata-fixture-path
    desc: Go testdata fixture directory path
    crit: notable
    conf: 0.98
    if:
      type: path
      # `testdata/` is the Go-idiomatic fixture directory: the go tool
      # ignores it, so parser corpora (debug/pe/testdata/*) live there
      # by convention. Scoped to Go trees; a general testdata marker
      # belongs in the testing harness, not a toolchain identity.
      regex: '\bgo/.*testdata([\\/]|$)'

  - id: go-module-source-path
    desc: Go module source tree path
    crit: notable
    conf: 0.98
    if:
      type: path
      # Module-cache paths contain this canonical two-component marker.  A
      # repository archive named `project-go@v...` is not a cache entry.
      regex: '[/\\]pkg[/\\]mod'

  - id: go-command-build-path
    desc: Go cmd/go buildinfo path
    crit: notable
    conf: 0.99
    for: [pe, elf, macho]
    if:
      type: value
      path: pe.go.path
      exact: cmd/go

  - id: go-version-file
    desc: Official Go VERSION stamp file
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: path
      regex: 'go/VERSION$'

  - id: go-toolchain-cmd-symbol
    desc: Go toolchain standard cmd package symbol
    crit: notable
    conf: 0.98
    for: [elf, pe, macho]
    if:
      type: symbol
      regex: '^cmd/(vet|compile|link|go|doc|asm|cgo|pprof|trace|cover|dist|nm|objdump|pack)/'

composite_rules:
  - id: go-toolchain-distribution
    desc: Go toolchain distribution artifact
    crit: notable
    conf: 0.98
    scope: outer
    needs: 2
    any:
      - id: go-toolchain-bin-path
      - id: go-toolchain-tool-path
      - id: go-toolchain-source-path
      - id: go-module-source-path
      - id: go-command-build-path
      - id: go-version-file
      - id: go-toolchain-cmd-symbol
