# GWT (Google Web Toolkit) compiles Java into one `<hash>.cache.js` permutation
# per browser. Its output defines each class initializer as a function that
# overwrites itself and then calls itself (`function OFd(){OFd=vZc;...;OFd()}`),
# so a function ending in a call to its own name is the generator's idiom, not an
# unbounded recursion. The permutation starts with the compiler's module prologue.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 20000
  size_max: 100000000

traits:
  - id: compiled-module-prologue
    desc: GWT compiled module prologue
    if:
      type: text
      regex: 'var \$gwt_version = "[0-9.]{1,12}";'
