# Elm — functional programming language for web applications (elm-lang.org).
#
# .elm sources use tuple-literal syntax [("a", "b"), ...] that cleave may
# classify as JavaScript; list-of-pairs declarations are ordinary data, not
# Nemucod-style string-reconstruction obfuscation.
defaults:
  platforms: [unix, windows]
  for: [javascript, text, zip, tar]
  crit: baseline
  conf: 0.99
  size_max: 500000000

traits:
  - id: elm-source-extension
    desc: Elm language source file extension
    if:
      type: path
      regex: '(?i)\.elm$'

  - id: source-syntax-module
    desc: Elm module declaration syntax
    for: [javascript, text]
    if:
      type: text
      regex: '(?m)^\s*module\s+[A-Za-z0-9_.]+\s+(exposing|where)\b'

  - id: source-syntax-import
    desc: Elm import declaration syntax
    for: [javascript, text]
    if:
      type: text
      regex: '(?m)^\s*import\s+[A-Z]\w*(\s*\([a-zA-Z0-9_,\s]+\)|\s+exposing\b)'

  - id: source-syntax-case-of
    desc: Elm case-of pattern matching syntax
    for: [javascript, text]
    if:
      type: text
      regex: '\bcase\s+\w+\s+of\b'

  - id: source-syntax-markdown-quasi
    desc: Elm markdown quasiquote block syntax
    for: [javascript, text]
    if:
      type: text
      substr: "[markdown|"

composite_rules:
  - id: elm-language-source
    desc: Elm functional programming language source
    crit: notable
    all:
      - id: elm-source-extension
    any:
      - id: source-syntax-module
      - id: source-syntax-import
      - id: source-syntax-case-of
      - id: source-syntax-markdown-quasi
