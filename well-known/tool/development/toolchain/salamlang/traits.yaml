# Salam — general-purpose and systems programming language (salamlang.ir, SalamLang/Salam).
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: salam-windows-installer-header
    desc: Salam language Windows installer script header
    for: [batch]
    size_min: 500
    size_max: 50000
    if:
      type: text
      substr: 'Salam installer for Windows.'

  - id: salam-installer-repo-marker
    desc: Salam repository definition in installer script
    for: [batch, shell, powershell]
    size_min: 500
    size_max: 100000
    if:
      type: text
      substr: 'SalamLang/Salam'

  - id: salam-installer-script-url
    desc: Salam installer script download URL
    for: [batch, shell, powershell]
    size_min: 500
    size_max: 100000
    if:
      type: text
      substr: 'raw.githubusercontent.com/SalamLang/Salam'

  - id: salam-source-extension
    desc: Salam language source file extension
    for: [text, python]
    size_min: 1
    size_max: 10000000
    if:
      type: path
      regex: '(?i)\.salam$'
