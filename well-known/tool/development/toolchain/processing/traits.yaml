# Processing IDE — creative-coding environment and toolchain.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, macho, markdown, github_actions, objc, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: processing-repository-marker
    desc: Processing upstream repository marker
    for: [java, kotlin, markdown, github_actions]
    if:
      type: text
      substr: 'github.com/processing/processing'

  - id: processing-gradle-group-marker
    desc: Processing Gradle project group marker
    for: [kotlin]
    if:
      type: text
      substr: 'group = "processing"'

  - id: processing-bundle-identifier
    desc: Processing macOS bundle identifier marker
    crit: notable
    conf: 0.99
    for: [macho]
    size_min: 4096
    size_max: 5242880
    if:
      type: value
      path: macho.code_signature.identifier
      exact: org.processing.four

  # `appbundler-admin-privileged-launch` was removed from here. Its matcher was
  # a bare `do shell script ... with administrator privileges`, which is the
  # standard way ANY macOS program elevates -- including the stalkerware that
  # was being reported as an "Appbundler privileged shell launch". A generic
  # capability does not belong in a product-identity directory, and the corpus
  # already has it as micro-behaviors/os/privilege/elevation::applescript-admin-prompt,
  # which the launcher context below references instead.

  - id: launch4j-toolchain-path
    desc: Launch4j cross-compiler toolchain path
    for: [elf, macho, tar, zip]
    size_min: 1024
    size_max: 52428800
    if:
      type: path
      regex: 'launch4j'

  - id: appbundler-source-path
    desc: Oracle appbundler native launcher source path
    for: [objc]
    if:
      type: path
      regex: 'appbundler/native/'

composite_rules:
  - id: processing-macos-launcher-context
    desc: Processing macOS appbundler launcher context
    crit: notable
    conf: 1.0
    scope: file
    for: [macho]
    all:
      - id: processing-bundle-identifier
      - id: micro-behaviors/os/privilege/elevation::applescript-admin-prompt
