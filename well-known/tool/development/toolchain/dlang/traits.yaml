# The official DMD Windows package lays every compiler, library, and doc
# file under dmd2/.
defaults:
  platforms: [windows, unix]
  for: [pe, static-lib, html, javascript, 7z]
  crit: notable
  conf: 0.98
  size_max: 80000000

traits:
  - id: dmd-install-tree
    desc: DMD compiler install tree
    if:
      type: path
      regex: '(^|/)dmd2/'
