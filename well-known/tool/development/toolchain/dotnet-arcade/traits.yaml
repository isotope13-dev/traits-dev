# dotnet/arcade is Microsoft's shared .NET engineering infrastructure (Maestro,
# signing, packaging MSBuild tasks). Source drops ship unsigned test PEs and
# NuGet fixtures for SignTool and packaging tests, not runtime malware.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 16777216

traits:
  - id: arcade-source-archive-path
    desc: dotnet/arcade source archive root
    for: [tar, zip]
    if:
      type: path
      regex: '^arcade-main/'

  - id: arcade-source-member-path
    desc: File under dotnet/arcade source tree
    for: [xml, csharp, pe, dll, markdown, nupkg]
    if:
      type: path
      regex: '(^|[/])arcade-main([/]|$)'

composite_rules:
  - id: dotnet-arcade-source-context
    desc: Recognized dotnet/arcade engineering source
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, zip, xml, csharp, pe, dll, markdown, nupkg]
    any:
      - id: arcade-source-archive-path
      - id: arcade-source-member-path
