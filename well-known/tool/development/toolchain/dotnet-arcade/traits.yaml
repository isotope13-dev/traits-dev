# dotnet/arcade is Microsoft's shared .NET engineering infrastructure (Maestro,
# signing, packaging MSBuild tasks). Source drops ship unsigned test PEs and
# NuGet fixtures for SignTool and packaging tests, not runtime malware.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 16777216

traits:
  # GitHub names branch tarballs arcade-main/ but commit-pinned snapshots
  # arcade-<40hex>/; both roots are the same engineering tree.
  - id: arcade-source-archive-path
    desc: dotnet/arcade source archive root
    for: [tar, zip]
    if:
      type: path
      regex: '^arcade-(main|[0-9a-f]{40})/'

  - id: arcade-source-member-path
    desc: File under dotnet/arcade source tree
    for: [xml, csharp, pe, dll, markdown, nupkg]
    if:
      type: path
      regex: '(^|[/])arcade-(main|[0-9a-f]{40})([/]|$)'

  # Content rather than path as well: fixture harnesses evaluate member files
  # by basename, and snapshot roots vary, while arcade's own MSBuild files
  # always reference its DotNetBuildTasks property family. No hostile package
  # has reason to cite arcade's internal task-assembly properties.
  - id: arcade-msbuild-source-property
    desc: Arcade MSBuild source property
    crit: notable
    conf: 0.97
    for: [xml]
    if:
      type: text
      regex: '\$\(DotNetBuildTasks[A-Za-z]+\)'

composite_rules:
  - id: dotnet-arcade-source-context
    desc: Recognized dotnet/arcade engineering source
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, zip, xml, csharp, pe, dll, markdown, nupkg]
    any:
      - id: arcade-source-archive-path
      - id: arcade-source-member-path
      - id: arcade-msbuild-source-property
