defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.96

traits:
  - id: nvm4w-go-module-path
    desc: NVM for Windows Go module path
    crit: notable
    if:
      type: text
      regex: 'github\.com/(author/author-nvm|coreybutler/nvm-windows)\b'
      section: .rdata

  # The product's own elevation-task name, misspelling and all. It is the
  # anchor scheduled-task rules use to tell nvm-for-windows' install-time task
  # registration apart from an implant's.
  - id: nvm4w-registration-task-name
    desc: NVM for Windows registration task name
    crit: notable
    if:
      type: text
      substr: "nvm4w-regitration-"
      section: .rdata
