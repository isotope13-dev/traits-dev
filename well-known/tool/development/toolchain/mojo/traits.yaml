# Mojo — Modular's LLVM-based language compiler (modular/max packaging).
# The compiler driver downloads language toolchains, shells out to linkers,
# and ships networking support, so curl, proxy, exec, and keepalive wording
# in the driver binary is toolchain behavior, not backdoor tasking.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 100000
  for: [elf]

traits:
  - id: compiler-plugin-library
    desc: Mojo compiler plugin library name
    if:
      type: text
      substr: "libmojo-compiler-plugin.so"
      section: .rodata
  - id: version-mismatch-message
    desc: Mojo compiler version mismatch message
    if:
      type: text
      substr: "Mojo precompiled file is incompatible with the current version of the Mojo compiler"
      section: .rodata

composite_rules:
  - id: compiler
    desc: Modular Mojo language compiler
    all:
      - id: compiler-plugin-library
      - id: version-mismatch-message
