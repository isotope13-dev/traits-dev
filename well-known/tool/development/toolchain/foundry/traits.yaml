# Foundry is the standard Ethereum development toolchain (forge, cast,
# anvil, chisel) by Paradigm. Its documented install path pipes the
# installer from the project's own foundry.paradigm.xyz domain to bash,
# so Solidity repository setup scripts carry this exact one-liner.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: foundry-official-installer-url
    desc: Official Foundry installer URL
    for: [shell, dockerfile, package.json, javascript, typescript]
    if:
      type: text
      substr: foundry.paradigm.xyz

  - id: foundry-download-pipe-script
    desc: Foundry download script pipes to bash
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: 'foundry\.paradigm\.xyz\b[^\n|]{0,80}\|\s*(bash|sh)\b'
