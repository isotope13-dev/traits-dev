# The GNU binutils-gdb repository (bfd, binutils, gdb, gdbserver, gprofng, sim,
# readline, ld, gas) is toolchain source whose job is to read, rewrite and
# debug other programs' binaries. Its ELF code converts PT_NOTE segments, gdb
# documents clearing hardware breakpoints, gdbserver multiplexes stdio, the
# gprofng collector interposes libc with RTLD_NEXT, and its testsuite carries
# deliberately corrupt ELF fixtures -- all patterns that read as infection,
# anti-debug or rootkit code in isolation. Identity is the repository path.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, shell, text, scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: source-archive-member
    desc: GNU binutils-gdb source archive member
    if:
      type: path
      regex: '(?i)(^|[\\/])binutils-gdb(\.git)?@'
