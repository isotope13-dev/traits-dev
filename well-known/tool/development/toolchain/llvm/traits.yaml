# LLVM toolchain binaries. clangd loads its plugins and index backends through
# the ordinary dynamic-loader APIs, so dylib- and module-loading rules treat an
# LLVM binary as a toolchain rather than a loader implant.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.9
  size_max: 524288000
traits:
  # Every LLVM-project source file carries this licence header. The existing
  # markers in this file identify built toolchain *binaries*, so nothing here
  # reached LLVM's own sources: lldb/tools/debugserver/.../MachProcess.mm -- the
  # macOS debug stub, which calls PT_TRACE_ME and reads P_TRACED because that is
  # what a debugger does -- scored hostile on the objc debugger-detect rules.
  # Julia vendors the whole llvm-project, so its source tarball tripped them.
  - id: llvm-project-source-header
    desc: LLVM project source licence header
    for: [c, cpp, objective_c, source]
    crit: notable
    conf: 0.98
    size_min: 128
    size_max: 52428800
    if:
      type: text
      substr: 'Part of the LLVM Project, under the Apache License'

  - id: clangd-name
    desc: clangd language server name
    if:
      type: text
      word: clangd
  - id: clang-name
    desc: clang compiler name
    crit: baseline
    conf: 0.8
    if:
      type: text
      # Word-bound: Rust packs panic/tracing strings end to end, so the
      # substring matched `...synclang-tk-core` in a Go language server.
      word: clang
  # C++ namespace text: LLVM's own diagnostics and type names ("llvm::",
  # 30 in clangd, 635 in libLLVM). A program that merely configures clangd
  # (an IDE or coding-agent language server) names clangd and clang but not
  # this.
  - id: llvm-namespace-text
    desc: LLVM C++ namespace text
    crit: component
    conf: 0.8
    if:
      type: text
      substr: 'llvm::'

composite_rules:
  # `clang` alone names the compiler, not the toolchain: every clang-built
  # ELF's .comment and every Rust binary's DWARF producer ("clang LLVM (rustc
  # version ...)") carry it, so it no longer identifies the toolchain on its
  # own. A built LLVM tool names both itself and the compiler, and carries the
  # llvm:: namespace in its own strings.
  - id: llvm-toolchain-binary
    desc: LLVM toolchain binary
    crit: notable
    conf: 0.9
    all:
      - id: clangd-name
      - id: clang-name
      - id: llvm-namespace-text
