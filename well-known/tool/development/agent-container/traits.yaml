# agent-container — SSH+tmux dev environment manager for AI coding agents.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl, python]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 900000000

traits:
  - id: package-name
    desc: agent-container PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agent-container

  - id: repository-url
    desc: agent-container GitHub repository URL
    for: [pkginfo]
    if:
      type: value
      path: project-url
      substr: github.com/ondrasek/agent-container

  - id: module-doc-marker
    desc: agent-container module documentation marker
    for: [python]
    if:
      type: text
      substr: agent-container — interactive wizard + CLI for agent-container containers

  - id: agent-config-env-marker
    desc: agent-container configuration env marker
    for: [python]
    if:
      type: text
      substr: AGENT_CONTAINER_MODE
