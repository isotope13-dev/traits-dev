# ruby-maven — Maven build wrapper for Ruby/JRuby projects (jruby/ruby-maven).
# Bundles Polyglot Maven Ruby DSL (polyglot-ruby JAR) for POM generation.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, jar, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: gem-package-name
    desc: ruby-maven Ruby gem package name
    for: [gem, pkginfo]
    if:
      type: value
      path: gem.name
      exact: ruby-maven

  - id: gemspec-name
    desc: ruby-maven gemspec package name
    for: [ruby]
    if:
      type: text
      substr: s.name = 'ruby-maven'

  - id: github-homepage
    desc: ruby-maven GitHub project homepage
    if:
      type: text
      substr: github.com/jruby/ruby-maven

  - id: rmvn-executable
    desc: ruby-maven rmvn CLI executable
    for: [ruby]
    if:
      type: path
      regex: '(^|[\\/])bin[\\/]rmvn$'

  - id: polyglot-ruby-jar
    desc: Polyglot Maven Ruby DSL extension JAR
    for: [jar]
    if:
      type: basename
      regex: '^polyglot-ruby-'

composite_rules:
  - id: ruby-maven-build-tool
    desc: ruby-maven Maven build wrapper for Ruby projects
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: gem-package-name
      - id: gemspec-name
      - id: github-homepage
      - id: rmvn-executable
      - id: polyglot-ruby-jar
