defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 16384
  size_max: 2097152

traits:
  - id: dotrush-debug-host-pdb
    desc: DotRush debugger host PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])DotRush[\\/]DotRush[\\/]src[\\/]DotRush\.Debugging\.Host[\\/].*devhost\.pdb$'

  - id: dotrush-debugging-host-namespace
    desc: DotRush debugging host namespace
    if:
      type: text
      section: .text
      regex: '(?i)\bDotRush\.Debugging\.Host\b'

composite_rules:
  - id: dotrush-debug-host
    desc: DotRush debugger host binary
    all:
      - id: dotrush-debug-host-pdb
      - id: dotrush-debugging-host-namespace
