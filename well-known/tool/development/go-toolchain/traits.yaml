defaults:
  platforms: [unix, windows]
  for: [go, shell, elf, macho, pe, text, archive, c, cpp]
  size_max: 200000000

traits:
  - id: go-toolchain-bin-path
    desc: Go toolchain binary path
    crit: baseline
    conf: 0.98
    if:
      type: path
      regex: 'go/bin/(go|gofmt)(\.exe)?$'

  - id: go-toolchain-tool-path
    desc: Go toolchain pkg/tool binary path
    crit: baseline
    conf: 0.98
    if:
      type: path
      # Shallow marker for `go/pkg/tool/<os_arch>/<name>` compilers and linkers.
      regex: 'go/pkg/tool'

  - id: go-toolchain-source-path
    desc: Go toolchain source tree path
    crit: baseline
    conf: 0.98
    if:
      type: path
      # Official trees place stdlib under go/src, tests under go/test, and
      # platform helpers under go/misc (for example iOS exec wrappers).
      regex: 'go/(src|test|misc)/'

  - id: go-module-source-path
    desc: Go module source tree path
    crit: notable
    conf: 0.98
    if:
      type: path
      # Module-cache paths contain this canonical two-component marker.  A
      # repository archive named `project-go@v...` is not a cache entry.
      regex: '[/\\]pkg[/\\]mod'

  - id: go-buildid-testdata-path
    desc: Go buildid PE base64 test fixture basename
    crit: baseline
    conf: 0.99
    for: [text]
    if:
      type: path
      basename: true
      exact: a.pe.base64

  - id: go-buildinfo-testdata-base64
    desc: Go debug/buildinfo base64 test fixture basename
    crit: baseline
    conf: 0.99
    for: [text]
    if:
      type: path
      basename: true
      regex: '^go1[0-9]{2}\.base64$'

  - id: go-command-build-path
    desc: Go cmd/go buildinfo path
    crit: notable
    conf: 0.99
    for: [pe, elf, macho]
    if:
      type: value
      path: pe.go.path
      exact: cmd/go

  - id: go-version-file
    desc: Official Go VERSION stamp file
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: path
      regex: 'go/VERSION$'

composite_rules:
  - id: go-toolchain-distribution
    desc: Go toolchain distribution artifact
    crit: notable
    conf: 0.98
    scope: outer
    needs: 2
    any:
      - id: go-toolchain-bin-path
      - id: go-toolchain-tool-path
      - id: go-toolchain-source-path
      - id: go-module-source-path
      - id: go-buildid-testdata-path
      - id: go-buildinfo-testdata-base64
      - id: go-command-build-path
      - id: go-version-file
