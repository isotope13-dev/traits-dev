defaults:
  platforms: [windows]
  for: [pe]
  size_max: 10485760

traits:
  - id: toolset-signer
    desc: WiX Toolset signed installer PE
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=WiX Toolset\b'
  - id: firegiant-signer
    desc: FireGiant-signed PE
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=FireGiant\b'
  - id: utilca-description
    desc: WiX utility custom-action description
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      exact: WiX Toolset Util CustomAction
  - id: utilca-original-filename
    desc: WiX utility custom-action filename
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.original_filename
      exact: utilca.dll

  - id: wixca-original-filename
    desc: WiX Custom Actions filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: wixca.dll
  - id: wixca-description
    desc: WiX Custom Actions description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: WiX Custom Actions

  - id: standard-bootstrapper-description
    desc: WiX standard bootstrapper description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: WiX Standard Bootstrapper Application

  - id: standard-bootstrapper-product
    desc: WiX bootstrapper product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Windows Installer XML Toolset

composite_rules:
  - id: standard-bootstrapper-component
    desc: WiX standard bootstrapper component
    crit: notable
    conf: 0.99
    all:
      - id: standard-bootstrapper-description
      - id: standard-bootstrapper-product

  - id: wixca-custom-actions
    desc: WiX Custom Actions identity
    crit: notable
    conf: 0.99
    all:
      - id: wixca-original-filename
      - id: wixca-description

  - id: firegiant-utilca-context
    desc: FireGiant-signed WiX utility custom-action PE
    crit: exception
    conf: 0.99
    all:
      - id: firegiant-signer
      - id: utilca-description
      - id: utilca-original-filename

  - id: wix-toolset-utilca-context
    desc: WiX-signed utility custom-action PE
    crit: exception
    conf: 0.99
    all:
      - id: toolset-signer
      - id: utilca-description
      - id: utilca-original-filename
