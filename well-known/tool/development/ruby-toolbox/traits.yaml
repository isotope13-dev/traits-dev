# Ruby Toolbox — GDB/LLDB Ruby debugging extensions by socketry.
defaults:
  platforms: [windows, unix]
  for: [gem, ruby, python, tar, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: gem-package-name
    desc: Ruby gem name toolbox
    for: [gem, text]
    if:
      type: text
      regex: '(?im)^name:\s*toolbox\s*$'

  - id: socketry-github-repo
    desc: socketry/toolbox GitHub repository URL
    if:
      type: text
      substr: socketry/toolbox

  - id: ruby-toolbox-entry-marker
    desc: Ruby Toolbox GDB LLDB entry marker
    for: [python]
    if:
      type: text
      substr: Ruby Toolbox - Unified entry point for GDB and LLDB

composite_rules:
  - id: ruby-toolbox-gem
    desc: socketry Ruby GDB LLDB debugging toolbox gem
    crit: notable
    conf: 0.97
    any:
      - id: gem-package-name
      - id: socketry-github-repo
      - id: ruby-toolbox-entry-marker
