defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - html
  crit: notable
  conf: 0.95
traits:
- id: webinspector-extension-server
  desc: WebInspector ExtensionServer component
  if:
    type: text
    substr: WebInspector.ExtensionServer
- id: webinspector-namespace
  desc: WebInspector core namespace
  if:
    type: text
    regex: \bWebInspector\.(ExtensionServer|ExtensionStatus|RemoteObject)\b
- id: inspector-backend-evaluate
  desc: InspectorBackend evaluation interface
  if:
    type: text
    substr: InspectorBackend.evaluate(
