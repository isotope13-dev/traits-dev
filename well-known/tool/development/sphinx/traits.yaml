# Stock Sphinx documentation helper shipped as make.bat in Sphinx projects.
# The header comment, SPHINXBUILD wrapper, sphinx-build -M driver, and the
# official sphinx-doc.org download hint travel together; none of those strings
# is a hostile execution primitive on its own.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.96

traits:
  - id: sphinx-make-bat-header
    desc: Sphinx documentation make.bat header
    if:
      type: text
      substr: Command file for Sphinx documentation

  - id: sphinx-build-env-var
    desc: SPHINXBUILD environment variable assignment
    if:
      type: text
      regex: '(?i)set\s+SPHINXBUILD=sphinx-build'

  - id: sphinx-build-dash-m
    desc: sphinx-build -M make-mode invocation
    if:
      type: text
      regex: '%SPHINXBUILD%\s+-M\s+'

  - id: sphinx-doc-org-url
    desc: Official Sphinx documentation site URL
    if:
      type: text
      regex: 'https?://sphinx-doc\.org/'

composite_rules:
  - id: sphinx-documentation-make-bat
    desc: Stock Sphinx documentation make.bat
    all:
      - id: sphinx-make-bat-header
      - id: sphinx-build-env-var
      - id: sphinx-build-dash-m
      - id: sphinx-doc-org-url
