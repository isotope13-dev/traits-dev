# ClusterFuzz (google/clusterfuzz) package files that legitimately configure
# Windows fuzzing VMs or evaluate Chromium DEPS files. They are shipped in the
# clusterfuzz PyPI wheel and match offensive-looking registry and exec shapes.
defaults:
  crit: notable
  conf: 0.95

traits:
  - id: clusterfuzz-gce-windows-domain
    desc: ClusterFuzz GCE Windows bot domain name
    for: [scripts]
    platforms: [windows]
    if:
      type: text
      substr: "$domain = 'CLUSTERFUZZ-WIN'"

  - id: clusterfuzz-gce-windows-password-metadata
    desc: Reads ClusterFuzz Windows password from metadata
    for: [scripts]
    platforms: [windows]
    if:
      type: text
      substr: attributes/windows-password

  - id: clusterfuzz-deps-revisions-parser
    desc: ClusterFuzz DEPS-to-revisions parser function
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      substr: "def deps_to_revisions_dict(content):"

  - id: clusterfuzz-deps-format-log
    desc: ClusterFuzz DEPS format-change log message
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      substr: "Deps format has changed, code needs fixing."

composite_rules:
  # Windows GCE bootstrap: admin account from metadata, then registry policy
  # toggles for the fuzzing VM. Both legs are required so a stray copy of one
  # identifier does not suppress a hostile finding.
  - id: clusterfuzz-gce-windows-init
    desc: ClusterFuzz GCE Windows bot startup script
    crit: exception
    conf: 0.95
    scope: file
    platforms: [windows]
    all:
      - id: clusterfuzz-gce-windows-domain
      - id: clusterfuzz-gce-windows-password-metadata

  # Chromium DEPS evaluation: exec(content) over fetched DEPS text. Both
  # ClusterFuzz-specific legs must appear in the same file.
  - id: clusterfuzz-deps-parser
    desc: ClusterFuzz DEPS parser evaluates fetched DEPS content
    crit: exception
    conf: 0.95
    scope: file
    platforms: [unix, windows]
    all:
      - id: clusterfuzz-deps-revisions-parser
      - id: clusterfuzz-deps-format-log
