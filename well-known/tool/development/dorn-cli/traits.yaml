# Dorn.Cli — MIT .NET Clean Architecture scaffolding tool (NuGet DotnetTool).
# Retains the Visual Studio MyApplication.app template identity and a
# hash-derived far-future COFF stamp; Process.Start is CLI/template host
# behavior, not a masquerade loader.
defaults:
  platforms: [windows, unix]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 8000
  size_max: 80000000

traits:
  - id: original-filename
    desc: Dorn.Cli original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Dorn.Cli.dll

  - id: assembly-basename
    desc: Dorn.Cli assembly basename
    if:
      type: path
      basename: true
      exact: Dorn.Cli.dll

composite_rules:
  - id: official-cli-binary
    desc: Official Dorn.Cli tool binary
    crit: notable
    conf: 0.99
    all:
      - id: original-filename
      - id: assembly-basename
