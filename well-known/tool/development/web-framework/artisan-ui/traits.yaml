# blessedjasonmwanza/artisan-ui — Laravel Artisan command web UI package.
defaults:
  platforms: [windows, unix]
  for: [php, javascript, typescript, markdown, json, text]
  crit: notable
  conf: 0.97

traits:
  - id: composer-package-name
    desc: blessedjasonmwanza/artisan-ui Composer package
    if:
      type: text
      substr: blessedjasonmwanza/artisan-ui

  - id: artisan-ui-service-provider
    desc: ArtisanUi Laravel service provider class
    for: [php]
    if:
      type: text
      substr: ArtisanUiServiceProvider

  - id: login-dashboard-heading
    desc: Artisan UI sign-in page heading
    for: [javascript, typescript]
    if:
      type: text
      substr: Sign in to manage your commands

  - id: setup-admin-heading
    desc: Artisan UI first-admin setup page heading
    for: [javascript, typescript]
    if:
      type: text
      substr: Create the first administrator account to get started

  - id: welcome-artisan-ui-heading
    desc: Artisan UI welcome page title
    for: [javascript, typescript, html, php]
    if:
      type: text
      substr: Welcome to Artisan UI

composite_rules:
  - id: artisan-ui-package
    desc: Artisan UI Laravel admin dashboard package
    crit: notable
    conf: 0.98
    any:
      - id: composer-package-name
      - id: artisan-ui-service-provider
      - id: login-dashboard-heading
      - id: setup-admin-heading
      - id: welcome-artisan-ui-heading
