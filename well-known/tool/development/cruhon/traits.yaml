# Cruhon (CrucibleLab) Python DSL/transpiler -- its core/libs/*_.py standard
# library maps @namespace.calls to emitted Python snippets via
# register_lib_call lambdas. Those templates spell __import__('base64') /
# __import__('zlib') so generated code is self-contained; nothing is
# dynamically imported at framework runtime, and there is no payload.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: cruhon-lib-template-path
    desc: Path inside cruhon codegen standard library
    for: [python, text]
    if:
      type: path
      regex: 'cruhon[/\\]core[/\\]libs'
  - id: cruhon-register-lib-call
    desc: Cruhon template registration call
    for: [python]
    if:
      type: text
      substr: 'register_lib_call'

composite_rules:
  - id: cruhon-codegen-context
    desc: Cruhon transpiler code-template context
    crit: exception
    conf: 0.99
    for: [python]
    any:
      - id: cruhon-lib-template-path
      - id: cruhon-register-lib-call
