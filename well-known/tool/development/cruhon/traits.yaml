defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
traits:
- id: cruhon-lib-template-path
  desc: Path inside cruhon codegen standard library
  for:
  - python
  - text
  if:
    type: path
    regex: cruhon[/\\]core[/\\]libs
- id: cruhon-register-lib-call
  desc: Cruhon template registration call
  for:
  - python
  if:
    type: text
    substr: register_lib_call
