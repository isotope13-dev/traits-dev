defaults:
  platforms: [unix, windows]
  for: [whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Belay agent-harness Python wheel package
    if:
      type: value
      path: whl.distribution
      exact: belay_harness

  - id: mcp-proxy-module
    desc: Belay MCP proxy module
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)belay/proxy\.py$'

  - id: replay-client-module
    desc: Belay replay client module
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)belay/replay/client\.py$'

  - id: seatbelt-module
    desc: Belay macOS Seatbelt sandbox module
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)belay/sandbox/seatbelt\.py$'

  - id: console-entrypoint
    desc: Belay command-line entrypoint
    for: [text]
    if:
      type: text
      regex: '(?m)^belay\s*=\s*belay\.cli:main\s*$'

composite_rules:
  - id: belay-harness
    desc: Belay sandboxed MCP replay harness wheel
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: mcp-proxy-module
      - id: replay-client-module
      - id: seatbelt-module
      - id: console-entrypoint
    needs: 1
