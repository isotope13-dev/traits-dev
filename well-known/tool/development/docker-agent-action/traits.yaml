# Docker Agent Runner — official Docker GitHub Action for running Docker Agent AI.
defaults:
  platforms: [unix, windows]
  for: [github-actions, javascript, typescript, markdown, shell]
  crit: notable
  conf: 0.99

traits:
  - id: action-name
    desc: Docker Agent Runner action name
    for: [github-actions]
    if:
      type: value
      path: name
      exact: Docker Agent Runner

  - id: docker-author
    desc: Docker GitHub Action author field
    for: [github-actions]
    if:
      type: value
      path: author
      exact: Docker

  - id: mcp-gateway-input
    desc: Docker Agent Runner mcp-gateway input
    for: [github-actions]
    if:
      type: value
      path: inputs.mcp-gateway.description
      regex: mcp-gateway

  - id: archive-tree-path
    desc: docker-agent-action source archive path
    if:
      type: path
      regex: 'docker-agent-action-[0-9a-f]'

composite_rules:
  - id: docker-agent-action-manifest
    desc: Docker Agent Runner action manifest identity
    crit: notable
    conf: 0.99
    for: [github-actions]
    all:
      - id: action-name
      - id: docker-author
      - id: mcp-gateway-input

