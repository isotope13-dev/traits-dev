# Microsoft vscode-dev-containers script-library helpers (common-debian.sh etc.).
# Devcontainer setup grants NOPASSWD sudo to the configured non-root user.
defaults:
  platforms: [unix]
  for: [shell, dockerfile, text]
  crit: notable
  conf: 0.99

traits:
  - id: script-library-source-url
    desc: VS Code devcontainer script-library source URL
    if:
      type: text
      substr: github.com/microsoft/vscode-dev-containers

  - id: library-scripts-directory-path
    desc: Devcontainer library-scripts directory path
    if:
      type: path
      regex: '(^|[\\/])library-scripts[\\/]'

  - id: devcontainer-json-config
    desc: VS Code devcontainer configuration file
    for: [json, text]
    if:
      type: basename
      exact: devcontainer.json

  # devcontainers/cli's findProcesses() builds a full local process tree (pid,
  # cwd, env, cmdline) for every /proc/$pid so userEnvProbe can locate the
  # container's shell and report why an environment probe is slow. The result
  # is only written to a local diagnostic log, never sent off-box. This exact
  # shell pipeline is vendored verbatim into every extension that reuses the
  # official devcontainers-cli (Remote-Containers, GitHub Codespaces, Coder,
  # Gitpod, JetBrains Gateway), so it recurs across otherwise-unrelated tools.
  - id: devcontainers-cli-proc-tree-probe-script
    desc: devcontainers-cli /proc process-tree probe
    for: [shell, javascript, typescript, text]
    if:
      type: text
      substr: 'for pid in `cd /proc && ls -d [0-9]*`; do { echo $pid ; readlink /proc/$pid/cwd'

composite_rules:
  - id: vscode-devcontainer-script-library
    desc: VS Code devcontainer script-library context
    crit: exception
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: script-library-source-url
      - id: library-scripts-directory-path
      - id: devcontainer-json-config

  - id: devcontainer-passwordless-sudo-setup
    desc: VS Code devcontainer passwordless sudo setup script
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: script-library-source-url
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
