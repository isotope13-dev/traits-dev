# Microsoft vscode-dev-containers script-library helpers (common-debian.sh etc.).
# Devcontainer setup grants NOPASSWD sudo to the configured non-root user.
defaults:
  platforms: [unix]
  for: [shell, dockerfile, text]
  crit: notable
  conf: 0.99

traits:
  - id: script-library-source-url
    desc: VS Code devcontainer script-library source URL
    if:
      type: text
      substr: github.com/microsoft/vscode-dev-containers

  - id: library-scripts-directory-path
    desc: Devcontainer library-scripts directory path
    if:
      type: path
      regex: '(^|[\\/])library-scripts[\\/]'

  - id: devcontainer-json-config
    desc: VS Code devcontainer configuration file
    for: [json, text]
    if:
      type: basename
      exact: devcontainer.json

composite_rules:
  - id: vscode-devcontainer-script-library
    desc: VS Code devcontainer script-library context
    crit: exception
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: script-library-source-url
      - id: library-scripts-directory-path
      - id: devcontainer-json-config

  - id: devcontainer-passwordless-sudo-setup
    desc: VS Code devcontainer passwordless sudo setup script
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: script-library-source-url
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
