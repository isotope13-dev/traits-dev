defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: ganache-cli-package-name
    desc: ganache-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ganache-cli

  - id: ganache-core-bundle-marker
    desc: Ganache core webpack bundle marker
    for: [javascript, typescript]
    if:
      type: path
      substr: 'ganache-core.node.cli.js'

  - id: trufflesuite-repo-marker
    desc: Truffle Suite ganache repository marker
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: trufflesuite/ganache-cli

composite_rules:
  - id: ganache-cli-ethereum-simulator
    desc: Ganache CLI local Ethereum simulator
    crit: notable
    conf: 0.99
    any:
      - id: ganache-cli-package-name
      - id: ganache-core-bundle-marker
      - id: trufflesuite-repo-marker
