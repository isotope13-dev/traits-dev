defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: ganache-cli-package-name
    desc: ganache-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '(@[a-zA-Z0-9_-]+/)?ganache-cli'

  - id: ganache-core-bundle-marker
    desc: Ganache core webpack bundle marker
    for: [javascript, typescript]
    if:
      type: path
      substr: 'ganache-core.node.cli.js'

  - id: ganache-cli-banner-marker
    desc: Ganache CLI version banner marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Ganache CLI v'

  - id: trufflesuite-repo-marker
    desc: Truffle Suite or Celo ganache repository marker
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(trufflesuite|celo-org)/ganache-cli'

  - id: ganache-package-name
    desc: Ganache npm package name
    for: [package.json]
    crit: component
    if:
      type: value
      path: name
      exact: ganache

  - id: ganache-package-bin
    desc: Ganache package CLI entry point
    for: [package.json]
    crit: component
    if:
      type: value
      path: bin.ganache
      exact: dist/node/cli.js

  - id: ganache-package-main
    desc: Ganache package main entry point
    for: [package.json]
    crit: component
    if:
      type: value
      path: main
      exact: dist/node/core.js

  - id: ganache-package-repository
    desc: Ganache upstream repository URL
    for: [package.json]
    crit: component
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/(trufflesuite|ConsenSys-archive)/ganache(\.git)?$'
      case_insensitive: true

composite_rules:
  - id: ganache-npm-package
    desc: Ganache local Ethereum simulator package
    for: [package.json]
    all:
      - id: ganache-package-name
      - id: ganache-package-bin
      - id: ganache-package-main
      - id: ganache-package-repository

  - id: ganache-cli-ethereum-simulator
    desc: Ganache CLI local Ethereum simulator
    crit: notable
    conf: 0.99
    any:
      - id: ganache-cli-package-name
      - id: ganache-core-bundle-marker
      - id: ganache-cli-banner-marker
      - id: trufflesuite-repo-marker
