defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho]
  crit: baseline
  conf: 0.95
  size_min: 65536
  size_max: 1073741824

traits:
  # The upstream source tarball, unpacked as `qemu-8.2.2/`. QEMU *emulates*
  # storage hardware, so its source legitimately opens and overwrites block
  # devices (subprojects/libvduse/libvduse.c), hand-assembles tiny ELF blobs
  # for guest vDSOs (linux-user/*/vdso.so), and vendors u-boot's board docs.
  - id: source-tree-path
    desc: QEMU source tree path
    crit: notable
    conf: 0.97
    for: [c, cpp, shell, source, elf]
    size_min: 1
    if:
      type: path
      regex: 'qemu-[0-9][0-9.]{0,10}/'
  - id: qemu-version-banner
    desc: QEMU version banner string
    crit: notable
    if:
      type: text
      section: rodata
      regex: '\bqemu-[a-z][a-z0-9_]{1,16}\s+version\s+\d'
  - id: qemu-user-mode-banner
    desc: QEMU user-mode emulator banner
    crit: notable
    if:
      type: text
      section: rodata
      substr: Linux CPU emulator (compiled for
  - id: qemu-is-aligned-macro
    desc: QEMU_IS_ALIGNED assertion macro
    if:
      type: text
      section: rodata
      substr: QEMU_IS_ALIGNED
  - id: qemu-core-system-export
    desc: QEMU core system export
    crit: notable
    if:
      type: symbol
      exact: qemu_init_subsystems
  - id: qemu-qmp-export
    desc: QEMU QMP command export
    crit: notable
    if:
      type: symbol
      exact: qmp_marshal_query_vnc
  - id: qemu-riscv-export
    desc: QEMU RISC-V CPU export
    crit: notable
    if:
      type: symbol
      exact: riscv_cpu_finalize_features
  - id: qemu-options-parser-export
    desc: QEMU options parser export
    crit: notable
    if:
      type: symbol
      exact: qemu_opts_parse
  - id: qemu-firmware-package
    desc: QEMU firmware package context
    crit: notable
    conf: 0.99
    for: [apk, elf]
    if:
      type: path
      regex: '(?i)qemu-[0-9][^\\/]*\.apk'
  - id: qemu-firmware-member
    desc: QEMU firmware member context
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: path
      basename: true
      regex: '(?i)^(u-boot\.e500|palcode|openbios|hppa-firmware\d*\.img)'

  - id: python-qemu-package-import
    desc: Imports the QEMU Python package
    crit: notable
    conf: 0.97
    for: [python]
    size_min: 1
    if:
      type: text
      regex: '(?m)^\s*(from|import)\s+qemu(\.|$|\s)'

  # The TCG plugin ABI. A stripped release build keeps no internal symbols --
  # UTM's iOS bundle carries 27 `qemu-*-softmmu` frameworks and none of them
  # export qemu_init_subsystems or qmp_marshal_query_vnc -- but the plugin
  # entry points survive, because they are the documented interface QEMU
  # offers to out-of-tree plugins.
  - id: qemu-plugin-abi-read-register
    desc: QEMU TCG plugin register read export
    crit: notable
    if:
      type: symbol
      exact: qemu_plugin_read_register
  - id: qemu-plugin-abi-scoreboard
    desc: QEMU TCG plugin scoreboard export
    crit: notable
    if:
      type: symbol
      exact: qemu_plugin_scoreboard_find

composite_rules:
  - id: qemu-system-emulator
    desc: Recognized QEMU system emulator
    crit: exception
    conf: 0.99
    needs: 2
    any:
      - id: qemu-core-system-export
      - id: qemu-qmp-export
      - id: qemu-plugin-abi-read-register
      - id: qemu-plugin-abi-scoreboard
  - id: qemu-user-mode-emulator
    desc: Recognized QEMU user-mode emulator
    crit: exception
    conf: 0.99
    all:
      - id: qemu-version-banner
      - id: qemu-user-mode-banner
  - id: qemu-cli-utility
    desc: Recognized QEMU CLI utility
    crit: exception
    conf: 0.99
    all:
      - id: qemu-options-parser-export
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-string
