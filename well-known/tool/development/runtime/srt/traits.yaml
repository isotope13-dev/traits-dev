# Reason Machines Sandbox Runtime (srt) is a process sandboxing tool
# that uses Windows Job Objects and network filtering.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: srt-win-pdb-path
    desc: Reason Machines srt-win PDB build marker
    if:
      type: value
      path: pe.debug.pdb.path
      exact: srt_win.pdb

  - id: srt-win-path
    desc: Reason Machines srt-win executable path
    if:
      type: path
      regex: 'srt-win[\\/](x64|arm64)[\\/]srt-win\.exe$'

composite_rules:
  - id: srt-win-executable
    desc: Reason Machines srt-win executable
    crit: notable
    conf: 0.99
    all:
      - id: srt-win-pdb-path
      - id: srt-win-path
