# ClawGarden CLI (a7garden/clawgarden) — Docker-based multi-bot garden manager.
defaults:
  platforms: [linux, macos]
  crit: notable
  conf: 0.97

traits:
  - id: clawgarden-package-name
    desc: clawgarden-cli Cargo package name
    for: [cargo.toml, crate]
    if:
      type: value
      path: crate.name
      exact: clawgarden-cli

  - id: clawgarden-github-repo
    desc: ClawGarden GitHub repository marker
    for: [rust, cargo.toml, crate]
    if:
      type: text
      substr: github.com/a7garden/clawgarden

  - id: garden-cli-binary-name
    desc: ClawGarden garden CLI binary name
    for: [cargo.toml, crate]
    if:
      type: value
      path: package.bin[0].name
      exact: garden

composite_rules:
  - id: clawgarden-cli-context
    desc: ClawGarden multi-agent garden CLI
    crit: notable
    conf: 0.98
    all:
      - id: clawgarden-package-name
      - id: clawgarden-github-repo
