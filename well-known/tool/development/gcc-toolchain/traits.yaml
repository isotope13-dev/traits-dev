# Conda-forge GCC bootstrap packages are compiler distributions. Their
# bundled optimizer strings and executable modes are expected toolchain data.
defaults:
  platforms: [linux]
  for: [conda, archives, zip, elf, so, static-lib, scripts, shell, text, javascript, c, cpp]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: gcc-bootstrap-package
    desc: GCC bootstrap compiler conda package
    for: [conda]
    size_min: 1000000
    size_max: 600000000
    if:
      type: value
      path: file.basename
      regex: '(?i)^gcc_bootstrap_linux-'
  - id: gcc-bootstrap-feedstock
    desc: Conda-forge compiler activation feedstock
    for: [conda, pkginfo, text]
    size_max: 5000000
    if:
      type: text
      substr: github.com/conda-forge/ctng-compiler-activation-feedstock
  - id: conda-linux-gnu-triplet-path
    desc: Conda-forge linux-gnu toolchain path
    for: [elf, so, static-lib, scripts, shell, text, javascript, c, cpp]
    size_max: 200000000
    if:
      type: path
      regex: '(?i)(x86_64|aarch64)-conda-linux-gnu'
  - id: gcc-bootstrap-member-path
    desc: GCC bootstrap package member path
    for: [elf, so, static-lib, scripts, shell, text, javascript, c, cpp]
    size_max: 200000000
    if:
      type: path
      regex: '(?i)gcc_bootstrap'
  - id: gcc-libexec-compiler-basename
    desc: GCC libexec compiler driver basename
    for: [elf]
    size_min: 100000
    size_max: 200000000
    if:
      type: basename
      regex: '^(cc1|cc1plus|lto1|f951|collect2)$'

composite_rules:
  - id: gcc-bootstrap-toolchain
    desc: Conda-forge GCC bootstrap toolchain context
    crit: notable
    conf: 0.99
    for: [conda]
    scope: archive
    all:
      - id: gcc-bootstrap-package
    any:
      - id: gcc-bootstrap-feedstock
      - id: conda-linux-gnu-triplet-path
      - id: gcc-libexec-compiler-basename
  - id: gcc-bootstrap-benign-context
    desc: Conda-forge GCC bootstrap known-good context
    crit: exception
    conf: 0.99
    for: [elf, so, static-lib, scripts, shell, text, javascript, c, cpp, conda]
    any:
      - id: gcc-bootstrap-toolchain
      - id: conda-linux-gnu-triplet-path
      - id: gcc-bootstrap-member-path
      - id: gcc-libexec-compiler-basename
      - id: metadata/lang/compiler/native::gcc-compiler-frontend-executable
