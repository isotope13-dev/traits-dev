# Haril (@fasaled/haril) — NTFS / file-lifecycle forensic CLI (haril-ts).
# Bun bundles ship the Windows haril_native.dll as Base64 inside dist/cli.js.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: haril-npm-package-name
    desc: Haril forensic CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@fasaled/haril'

  - id: haril-npm-archive-name
    desc: Haril forensic CLI npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@fasaled/haril'

  - id: haril-bundled-native-embed-marker
    desc: Haril bun bundle embeds native addon payloads
    for: [javascript, typescript]
    if:
      type: text
      substr: EMBEDDED_NATIVE_PAYLOADS

  - id: haril-bundled-native-node-marker
    desc: Haril bundle writes haril_native.node addon
    for: [javascript, typescript]
    if:
      type: text
      substr: haril_native.node

  - id: haril-native-pe-export
    desc: Haril native capture module export
    for: [pe, dll]
    size_min: 50000
    size_max: 5000000
    if:
      type: export
      substr: haril_close

composite_rules:
  # Bun engine declarations alone do not identify Haril. Require its exact
  # package identity before exempting documented bundled Windows addons.
  - id: haril-documented-native-addon-context
    desc: Haril CLI ships documented Windows capture PE blobs
    crit: exception
    conf: 0.97
    scope: archive
    any:
      - id: haril-npm-package-name
      - id: haril-npm-archive-name
      - id: haril-bundled-native-embed-marker
      - id: haril-native-pe-export
