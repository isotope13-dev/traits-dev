defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ForenseLab package metadata name
    if:
      type: value
      path: name
      exact: forensic-cli

  - id: package-summary
    desc: ForenseLab digital forensics package summary
    if:
      type: value
      path: summary
      exact: DevKit Forense - CLI para análise de navegadores e rede

  - id: repository
    desc: ForenseLab source repository
    if:
      type: text
      substr: https://github.com/ErickG123/devkit_forense

  - id: browser-forensics-module
    desc: ForenseLab browser forensics source
    for: [python]
    if:
      type: path
      regex: '(logins|browser_history|downloads_history)\.py$'

  - id: network-scanner-module
    desc: ForenseLab network scanner source
    for: [python]
    if:
      type: path
      regex: '(ping_sweep|port_scanner)\.py$'
