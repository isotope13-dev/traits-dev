# BruteShark — Open-source Network Forensic Analysis Tool (NFAT).
# Deep packet inspection, TCP/UDP session reconstruction, credential and
# hash extraction, network mapping, and VoIP call carving from PCAP or live traffic.
# Tool identity only — behavioral capabilities (packet capture, hash formatting)
# belong in micro-behaviors/ and objectives/.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
  crit: notable
  conf: 0.98
  size_min: 10000
  size_max: 200000000

traits:
  - id: bruteshark-assembly-name
    desc: BruteShark .NET assembly name
    if:
      type: text
      substr: 'BruteSharkCli.dll'
      section: any

  - id: bruteshark-banner-method
    desc: BruteShark ASCII art banner method name
    if:
      type: text
      substr: 'PrintBruteSharkAsciiArt'
      section: any

  - id: bruteshark-build-path
    desc: BruteShark project build path
    if:
      type: text
      regex: '(?i)[\\/]BruteShark[\\/].{0,100}[\\/]BruteSharkCli\.'
      section: any

composite_rules:
  - id: bruteshark-nfat-tool-identity
    desc: BruteShark network forensic analysis tool identity
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: bruteshark-assembly-name
      - id: bruteshark-banner-method
      - id: bruteshark-build-path
