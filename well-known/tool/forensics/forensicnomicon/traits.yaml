defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, tar]
  crit: notable
  conf: 0.98

traits:
  - id: forensicnomicon-cargo-name
    desc: ForensicNomicon Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^forensicnomicon(-data|-core)?$'

  - id: forensicnomicon-repo-url
    desc: ForensicNomicon repository URL
    for: [cargo.toml, rust, markdown]
    if:
      type: text
      substr: github.com/SecurityRonin/forensicnomicon

  - id: forensicnomicon-source-path
    desc: ForensicNomicon source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])forensicnomicon(-data|-core)?-[0-9]'

  - id: forensicnomicon-artifact-descriptor
    desc: ForensicNomicon artifact descriptor declaration
    for: [rust]
    if:
      type: text
      regex: 'static\s+[A-Za-z0-9_]+:\s*ArtifactDescriptor\s*='

composite_rules:
  - id: forensicnomicon-context
    desc: ForensicNomicon DFIR artifact catalog context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: forensicnomicon-cargo-name
      - id: forensicnomicon-repo-url
      - id: forensicnomicon-source-path
      - id: forensicnomicon-artifact-descriptor
