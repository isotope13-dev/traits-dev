defaults:
  for:
  - elf
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
  size_min: 1048576
  size_max: 134217728
traits:
- id: container-toolkit-binary
  desc: CDK container penetration toolkit binary
  if:
    type: yara
    source: "rule source_identity {\n strings:\n  $s0 = \"github.com/cdk-team/CDK/pkg/task\" ascii\n  $s1 = \"cdk run <exploit> [<args>...]\" ascii\n  $s2 = \"cdk auto-escape <cmd>\" ascii\n condition: all of them\n}"
