defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  size_min: 1000
  size_max: 12000000
  crit: notable
traits:
- id: powershellrunner-namespace
  desc: PowerShellRunner managed namespace
  conf: 0.98
  if:
    type: text
    exact: PowerShellRunner.PowerShellRunner
    section: .rdata
- id: psrunner-custom-host-interface
  desc: PowerShellRunner custom host interface name
  conf: 0.97
  if:
    type: text
    section: .text
    regex: CustomPSR?HostUserInterface
- id: powershellrunner-invoke-ps
  desc: PowerShellRunner InvokePS entrypoint name
  conf: 0.96
  if:
    type: text
    section: .text
    word: InvokePS
composite_rules:
- id: empire-powershellrunner-execution
  desc: PowerShellRunner creates a runspace
  conf: 0.99
  all:
  - id: powershellrunner-namespace
  - id: metadata/import/framework::runspace-factory
  unless:
  - id: micro-behaviors/mem/combined::powershell-delegate-alloc-copy-protect
- id: empire-psrunner-custom-host
  desc: PowerShellRunner custom runspace host
  conf: 0.98
  all:
  - id: psrunner-custom-host-interface
  - id: metadata/import/framework::runspace-factory
  - id: metadata/lang/source/naming/function::create-runspace
  unless:
  - id: micro-behaviors/mem/combined::powershell-delegate-alloc-copy-protect
- id: empire-psrunner-invoke-entry
  desc: PowerShellRunner InvokePS runspace entry
  conf: 0.97
  all:
  - id: powershellrunner-invoke-ps
  - id: metadata/lang/source/naming/function::create-runspace
  unless:
  - id: micro-behaviors/mem/combined::powershell-delegate-alloc-copy-protect
  - id: powershellrunner-namespace
