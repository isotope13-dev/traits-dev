defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000
  size_max: 12000000

traits:
  - id: powershellrunner-namespace
    desc: PowerShellRunner managed namespace
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: PowerShellRunner.PowerShellRunner
      section: .rdata

  - id: psrunner-custom-host-interface
    desc: PowerShellRunner custom host interface name
    crit: notable
    conf: 0.97
    if:
      type: text
      section: .text
      regex: 'CustomPSR?HostUserInterface'

  - id: powershellrunner-invoke-ps
    desc: PowerShellRunner InvokePS entrypoint name
    crit: notable
    conf: 0.96
    if:
      type: text
      section: .text
      word: InvokePS

composite_rules:
  - id: empire-powershellrunner-execution
    desc: PowerShellRunner creates a runspace
    crit: notable
    conf: 0.99
    all:
      - id: powershellrunner-namespace
      - id: micro-behaviors/process/interpreter/powershell/host::runspace-factory
    unless:
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-reflective-shellcode-loader

  - id: empire-psrunner-custom-host
    desc: PowerShellRunner custom runspace host
    crit: notable
    conf: 0.98
    all:
      - id: psrunner-custom-host-interface
      - id: micro-behaviors/process/interpreter/powershell/host::runspace-factory
      - id: micro-behaviors/process/interpreter/powershell/host::create-runspace
    unless:
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-reflective-shellcode-loader

  - id: empire-psrunner-invoke-entry
    desc: PowerShellRunner InvokePS runspace entry
    crit: notable
    conf: 0.97
    all:
      - id: powershellrunner-invoke-ps
      - id: micro-behaviors/process/interpreter/powershell/host::create-runspace
    unless:
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-reflective-shellcode-loader
      - id: powershellrunner-namespace


