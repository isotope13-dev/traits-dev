# ShadowCat is an operator-facing, authorized web-application security
# scanner.  SQLi examples and CTF fixtures are expected contents of this
# dual-use tool; the identity context is narrow and requires both package
# metadata and the upstream repository.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: shadowcat-package-name
    desc: ShadowCat web security scanner package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: shadowcat

  - id: shadowcat-wheel-distribution
    desc: ShadowCat scanner wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: shadowcat

  - id: shadowcat-project-repository
    desc: ShadowCat upstream project repository
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: github.com/shadowcat-dast/shadowcat

composite_rules:
  - id: shadowcat-authorized-pentest-context
    desc: Recognized ShadowCat authorized pentesting context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: shadowcat-package-name
      - id: shadowcat-project-repository
