defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for: [scripts, source, markdown, text, data, zip, jpeg, png, xml, pkginfo, pyproject.toml]
  size_max: 5000000
traits:
# Bibliography/name references live under package documentation source;
# they do not identify a payload-library implementation.
- id: penetration-testing-payload-collection
  desc: Declares penetration-testing payload collection
  crit: notable
  conf: 0.95
  for: [markdown, text]
  if:
    type: text
    regex: '(?i)collection of payloads and wordlists.{0,120}penetration testing'
- id: payloadsallthethings-release-member
  desc: PayloadsAllTheThings release member
  crit: notable
  conf: 0.99
  size_max: 100000000
  if:
    type: path
    regex: '(?i)(^|[\\/])PayloadsAllTheThings-[0-9.]+[\\/]'
- id: commonhuman-lab-attribution
  desc: CommonHuman-Lab copyright/author attribution
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: CommonHuman-Lab
- id: commonhuman-lab-author
  desc: CommonHuman-Lab package author/summary
  crit: notable
  conf: 0.95
  for:
  - pkginfo
  - pyproject.toml
  if:
    type: value
    path: author
    substr: CommonHuman-Lab
- id: commonhuman-lab-summary
  desc: CommonHuman-Lab package summary
  crit: notable
  conf: 0.9
  for:
  - pkginfo
  - pyproject.toml
  if:
    type: value
    path: summary
    substr: CommonHuman-Lab
- id: agpl-license-field
  desc: AGPL-3.0 license metadata field
  crit: notable
  conf: 0.85
  for:
  - pkginfo
  - pyproject.toml
  if:
    type: value
    path: license
    substr: AGPL-3.0
composite_rules:
- id: documented-pentest-payload-corpus
  desc: Documented penetration-testing payload corpus
  crit: notable
  conf: 0.99
  scope: archive
  for: [scripts, source, markdown, text, data, zip, documents]
  all:
  - id: metadata/package/documentation/source::payloadsallthethings-reference
  - id: penetration-testing-payload-collection
- id: pentest-payload-corpus
  desc: CommonHuman-Lab pentest payload corpus
  crit: notable
  conf: 0.95
  all:
  - id: commonhuman-lab-attribution
  - id: metadata/package/license::agpl-3-license-identifier
- id: pentest-payload-corpus-pkg
  desc: CommonHuman-Lab pentest payload corpus metadata
  crit: notable
  conf: 0.95
  for:
  - pkginfo
  - pyproject.toml
  all:
  - id: agpl-license-field
  any:
  - id: commonhuman-lab-author
  - id: commonhuman-lab-summary
