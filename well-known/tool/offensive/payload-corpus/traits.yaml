defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for: [scripts, source, markdown, text, data, zip, jpeg, png, xml, pkginfo, pyproject.toml]
  size_max: 5000000
traits:
# PayloadsAllTheThings is the canonical, widely-mirrored payload reference
# library. A file that cites it is a curated payload *corpus* (reference data
# the operator searches), not an executing attack — so it marks the file as a
# recognized offensive-tool payload library for the dual-use unless-context.
- id: payloadsallthethings-reference
  desc: PayloadsAllTheThings payload-library citation
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'Payloads?AllThe[ ]?Things'
    case_insensitive: true
- id: payloadsallthethings-upstream
  desc: Swisskyrepo PayloadsAllTheThings upstream URL
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: 'github.com/swisskyrepo/PayloadsAllTheThings'
- id: penetration-testing-payload-collection
  desc: Declares penetration-testing payload collection
  crit: notable
  conf: 0.95
  for: [markdown, text]
  if:
    type: text
    regex: '(?i)collection of payloads and wordlists.{0,120}penetration testing'
- id: payloadsallthethings-release-member
  desc: PayloadsAllTheThings release member
  crit: notable
  conf: 0.99
  size_max: 100000000
  if:
    type: path
    regex: '(?i)(^|[\\/])PayloadsAllTheThings-[0-9.]+[\\/]'
- id: commonhuman-lab-attribution
  desc: CommonHuman-Lab copyright/author attribution
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: CommonHuman-Lab
- id: commonhuman-lab-author
  desc: CommonHuman-Lab package author/summary
  crit: notable
  conf: 0.95
  for:
  - pkginfo
  - pyproject.toml
  if:
    type: value
    path: author
    substr: CommonHuman-Lab
- id: commonhuman-lab-summary
  desc: CommonHuman-Lab package summary
  crit: notable
  conf: 0.9
  for:
  - pkginfo
  - pyproject.toml
  if:
    type: value
    path: summary
    substr: CommonHuman-Lab
- id: agpl-license-field
  desc: AGPL-3.0 license metadata field
  crit: notable
  conf: 0.85
  for:
  - pkginfo
  - pyproject.toml
  if:
    type: value
    path: license
    substr: AGPL-3.0
# XSS fuzzing lists (SecLists Fuzzing/XSS, PortSwigger's cheat sheet, the
# OFJAAAH and payloadbox corpora) prove execution with alert(): every vector
# is a tag or handler whose body is an alert() call. Real injected script
# steals, redirects or loads a second stage -- it never pops a dialog -- so
# ten or more alert() probes in one file mark a list of test vectors. Each
# vector also matches whatever breakout or obfuscation rule it exercises,
# which is why those rules consult this in `unless:`.
- id: xss-alert-probe-corpus
  desc: XSS test-vector list proving with alert()
  crit: notable
  conf: 0.95
  for: [javascript, php, html, svg, text]
  count_min: 10
  if:
    type: text
    # The call opens a tag body, a handler value or a javascript: URI, so
    # it follows `>`, `=`, `:` or a quote.
    regex: '(?i)[>=:"''`][ \t]*alert[ \t]*[(`]'
composite_rules:
- id: documented-pentest-payload-corpus
  desc: Documented penetration-testing payload corpus
  crit: notable
  conf: 0.99
  scope: archive
  for: [scripts, source, markdown, text, data, zip, documents]
  all:
  - id: payloadsallthethings-reference
  - id: penetration-testing-payload-collection
- id: pentest-payload-corpus
  desc: CommonHuman-Lab pentest payload corpus
  crit: notable
  conf: 0.95
  all:
  - id: commonhuman-lab-attribution
  - id: metadata/package/license::agpl-3-license-identifier
- id: pentest-payload-corpus-pkg
  desc: CommonHuman-Lab pentest payload corpus metadata
  crit: notable
  conf: 0.95
  for:
  - pkginfo
  - pyproject.toml
  all:
  - id: agpl-license-field
  any:
  - id: commonhuman-lab-author
  - id: commonhuman-lab-summary
