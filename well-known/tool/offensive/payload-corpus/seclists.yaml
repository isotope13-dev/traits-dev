defaults:
  for: [markdown, text]
  platforms: [unix, windows]

traits:
  # Corpus identity supplies triage context; it never suppresses findings in
  # bundled webshells, exploits, or other executable payloads.
  - id: seclists-corpus-documentation
    desc: SecLists security-testing corpus documentation
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "SecLists is the security tester's companion. It's a collection of multiple types of lists used during security assessments"
