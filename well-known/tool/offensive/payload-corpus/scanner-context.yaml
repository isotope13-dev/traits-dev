defaults:
  platforms: [unix, windows]
  for: [scripts, json, data, yaml, text]
composite_rules:
  - id: scanner-request-payload-context
    desc: Scanner, payload-corpus tool or signature dataset carries request payloads
    crit: exception
    conf: 0.98
    any:
      - id: well-known/tool/offensive/projectdiscovery::nuclei-cves-index-shape
      - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/tool/detection/websec-validator::websec-validator-probe-context
      - id: well-known/tool/detection/teler/
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: well-known/tool/offensive/riciplay::payload-template-context
      - id: well-known/tool/detection/security-scanner::webanalyzer-security-package-member
  # Scanner/payload-generator templates whose embedded exploit payloads are
  # probes sent to a remote target, not code the file itself runs.
  - id: scanner-template-payload-context
    desc: Scanner or payload-generator template embeds exploit payloads
    crit: exception
    conf: 0.95
    any:
      - id: well-known/tool/offensive/riciplay::payload-template-context
      - id: well-known/tool/offensive/projectdiscovery::nuclei-json-template-request
      - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
