# Suijin — published AGPL-3.0-or-later "autonomous red & blue teaming"
# framework (github.com/0xwi11iam/Suijin, PyPI `suijin`, formerly "Medusa").
# A LangGraph-driven Red Team agent that chains recon -> exploitation ->
# reporting, bundling reverse-shell, RCE, and container-escape primitives as
# documented "skills", plus a Metasploit integration module. Dual-use like
# Decepticon/pentestkit: it legitimately ships exploit content behind an
# explicit authorized-testing-only disclaimer, so it self-identifies as a
# known offensive framework rather than being mis-attributed to malware.
defaults:
  platforms: [unix, windows]
  size_max: 5000000
traits:
  # `scripts`/`source` (not just python) so the identity still resolves for
  # an embedded/extracted sub-artifact (e.g. a shell one-liner cleave pulls
  # out of a Python string literal and re-types as `shell`) that inherits
  # this file's archive path.
  - id: package-tree-member
    desc: Suijin package tree member
    crit: notable
    conf: 0.99
    for: [scripts, source, text, markdown, whl, pkginfo, pyproject.toml]
    if:
      type: path
      regex: '(^|[\\/])suijin([\\/]|-[0-9])'
  - id: pkg-redteam-summary
    desc: Suijin red/blue team framework summary
    crit: notable
    conf: 0.95
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: summary
      substr: 'red & blue teaming'
  - id: repo-attribution
    desc: Suijin source repository reference
    crit: component
    conf: 0.9
    for: [text, scripts, markdown]
    if:
      type: text
      substr: 0xwi11iam/Suijin
composite_rules:
  - id: suijin-redteam-framework
    desc: Suijin autonomous red/blue team framework
    crit: notable
    conf: 0.95
    any:
      - id: package-tree-member
      - id: pkg-redteam-summary
      - id: repo-attribution
