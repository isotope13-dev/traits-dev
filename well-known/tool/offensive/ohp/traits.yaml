# Open-HTTP-Puncher (ohp / ohpserver) — HTTP proxy tunnel puncher by @lfasmpao
# Used to punch tunnels through restrictive HTTP proxies to tunnel arbitrary TCP traffic (OpenVPN, SSH).
defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho, go]
  attack: T1572
  mbc: B0030
  size_min: 512
  size_max: 500000000

traits:
  - id: banner
    desc: Open HTTP Puncher banner
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: "Open HTTP Puncher Server by @lfasmpao"

  - id: source-path
    desc: Open HTTP Puncher source path
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: "open-http-puncher/ohpserver/main.go"

  - id: server-running-string
    desc: Open HTTP Puncher server startup message
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Server is running at port:"

  - id: unable-to-connect-string
    desc: Open HTTP Puncher upstream connection error
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Unable to connect to server"

composite_rules:
  - id: ohpserver-detected
    desc: Open HTTP Puncher offensive tunnel server detected
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/tool/offensive/ohp::banner
      - id: well-known/tool/offensive/ohp::server-running-string
