# reGeorg (SensePost) HTTP-to-TCP pivot tunnel. The server half is a web
# page (aspx/ashx/jsp/php) dropped on a compromised host; the client drives
# it with ?cmd=CONNECT|FORWARD|READ|DISCONNECT and relays SOCKS traffic
# through the page's session-held socket.
defaults:
  platforms: [linux, macos, windows]
  # Server-page types reGeorg actually ships (aspx/ashx, jsp, php). Narrower
  # than the relay composite on purpose: this is family attribution, and each
  # extra type spends precision on files the family never takes.
  for: [asp, csharp, jsp, php]
  attack: T1090.001
  crit: notable

traits:
  - id: tool-name
    desc: reGeorg tool name
    conf: 0.9
    if:
      type: text
      word: reGeorg
      case_insensitive: true

  - id: liveness-banner
    desc: reGeorg tunnel liveness banner
    conf: 0.97
    if:
      type: text
      substr: "Georg says, 'All seems fine'"

  # Every reGeorg server page switches on the same verbs. One verb alone is
  # an ordinary word; a CONNECT branch plus a FORWARD branch on the same
  # `cmd` value is the tunnel protocol. Kept as two small atoms (no broad
  # counted repeat) so C#, Java (`cmd.equals("CONNECT")`), and PHP ports
  # all match.
  - id: tunnel-connect-command-branch
    desc: reGeorg CONNECT command branch
    conf: 0.93
    if:
      type: text
      regex: '\bcmd\s*(==|\.?equals\s*\()\s*["'']CONNECT["'']'

  - id: tunnel-forward-command-branch
    desc: reGeorg FORWARD command branch
    conf: 0.93
    if:
      type: text
      regex: '\bcmd\s*(==|\.?equals\s*\()\s*["'']FORWARD["'']'

composite_rules:
  - id: tunnel-server-page
    desc: reGeorg tunnel server page
    crit: hostile
    conf: 0.98
    attack: T1090.001,T1505.003
    all:
      - id: tunnel-connect-command-branch
      - id: tunnel-forward-command-branch
    any:
      - id: tool-name
      - id: liveness-banner
