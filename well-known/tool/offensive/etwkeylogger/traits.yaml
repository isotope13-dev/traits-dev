defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 2000000
traits:
- id: usb-event-source-class
  desc: Etwkeylogger USB event-source class
  if:
    type: text
    substr: Etwkeylogger.UsbEventSource
composite_rules:
- id: usb-capture-queue-consumer
  desc: ETW keylogger consumes captured USB key queue
  crit: suspicious
  all:
  - id: usb-event-source-class
  - id: micro-behaviors/hardware/input/keyboard/listener::powershell-keypress-queue-dequeue
