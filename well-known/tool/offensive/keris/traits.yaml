# keris-toolkit (github.com/dexpie/keris) is a published MIT modular web
# penetration-testing toolkit. Its modules and payload lists are dual-use
# assessment corpus, not a malware dropper.
defaults:
  platforms: [unix, windows]
  for: [python, text, whl, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: package-tree-member
    desc: keris toolkit package tree member
    for: [python, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])keris[\\/](modules|core|data|payloads)'

  - id: http-client-import
    desc: Imports keris HTTP client
    for: [python]
    if:
      type: text
      substr: 'from keris.core.http import KerisHTTP'

  - id: github-repo
    desc: keris toolkit repository URL
    for: [python, text, markdown]
    if:
      type: text
      substr: github.com/dexpie/keris
