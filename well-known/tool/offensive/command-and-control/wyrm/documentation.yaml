defaults:
  for: [markdown, python, text]
  platforms: [unix, windows]

# The Wyrm README describes its own agent. Its file type is heuristic (a
# markdown file can be typed python), so the rules name markdown, python, and
# text. The two legs are the project's self-description and its C2 tasking loop.
traits:
  - id: wyrm-readme-self-description
    desc: Wyrm README describes a post-exploitation agent
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)wyrm agent is a post.exploitation red team framework'

  - id: wyrm-c2-tasking-loop-description
    desc: Wyrm README describes its C2 tasking loop
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)GET requests are made to the C2 and tasks are received'

composite_rules:
  - id: wyrm-agent-readme
    desc: Wyrm post-exploitation agent documentation with its C2 tasking loop
    crit: hostile
    conf: 0.96
    attack: T1071.001
    all:
      - id: wyrm-readme-self-description
      - id: wyrm-c2-tasking-loop-description
