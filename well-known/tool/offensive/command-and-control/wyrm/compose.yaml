defaults:
  for: [yaml]
  platforms: [unix, windows]
traits:
  - id: wof-mount
    desc: Wyrm object file volume mount
    crit: notable
    if:
      type: value
      path: services.c2.volumes
      exact: './wofs_static:/wofs_static'
  - id: transfer-mount
    desc: C2 transfer tools volume mount
    crit: notable
    if:
      type: value
      path: services.c2.volumes
      exact: './c2_transfer:/tools'
  - id: server-build
    desc: C2 server Dockerfile reference
    crit: notable
    if:
      type: value
      path: services.c2.build.dockerfile
      exact: c2/Dockerfile
composite_rules:
  - id: compose-deployment
    desc: Wyrm post-exploitation C2 deployment configuration
    crit: hostile
    attack: T1588.002
    all:
      - id: well-known/tool/offensive/command-and-control/wyrm::wof-mount
      - id: well-known/tool/offensive/command-and-control/wyrm::transfer-mount
      - id: well-known/tool/offensive/command-and-control/wyrm::server-build
