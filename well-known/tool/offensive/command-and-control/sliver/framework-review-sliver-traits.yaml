defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000

traits:
- id: proto-ref
  size_min: 512
  size_max: 500000000
  desc: Sliver proto definition reference
  crit: suspicious
  conf: 0.95
  attack: T1071
  platforms:
  - linux
  - windows
  - macos
  if:
    type: text
    substr: sliver.proto
- id: sliver-custom-base-encoder
  desc: Sliver custom base encoder
  crit: component
  if:
    type: text
    regex: 'sliverBase(32|64)\s*=\s*base(32|64)\.NewEncoding\s*\('

composite_rules:
- id: sliver-custom-implant-encoder
  desc: Sliver custom unpadded encoding context
  crit: suspicious
  conf: 0.97
  attack: T1027
  all:
  - id: well-known/tool/offensive/command-and-control/sliver::sliver-framework-banner
  - id: well-known/tool/offensive/command-and-control/sliver::sliver-custom-base-encoder
  - id: micro-behaviors/data/encode/charset::base-alphabet-assignment
  - id: micro-behaviors/data/encode/codecs::base-no-padding-reference
