# Sliver's beignet Mach-O stager. Its loader symbol and internal build path are
# identity of the C2 framework's stager component, not of a malware variant, so
# they sit beside the other Sliver framework identity rules.
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  crit: notable
  conf: 0.93

traits:
  - id: sliver-beignet-stager-identity
    desc: Sliver beignet stager loader identity
    if:
      type: text
      regex: 'beignet_loader|beignet/internal/stager'
