defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - wasm
  crit: notable
  conf: 0.96

traits:
  - id: sliver-go-module-path
    desc: Sliver framework Go module path
    crit: notable
    conf: 0.95
    size_min: 512
    size_max: 500000000
    for: [go, binaries]
    if:
      type: text
      substr: github.com/bishopfox/sliver

  # The framework's GPL header names the product ("Sliver Implant
  # Framework", BishopFox). That is identity of the dual-use C2 framework
  # itself, not evidence of a malware variant, so it lives beside the
  # module-path identity instead of under well-known/malware/.
  - id: sliver-framework-banner
    desc: Sliver framework license banner
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [go, binaries]
    size_max: 5000000
    if:
      type: text
      substr: Sliver Implant Framework

  - id: traffic-encoder-asset-path
    desc: Sliver traffic encoder asset path
    if:
      type: path
      regex: 'traffic-encoders[\\/][A-Za-z0-9_-]+\.wasm$'

  - id: sliver-bof-args-buffer-use
    desc: References Sliver BOF argument-buffer API
    conf: 0.93
    for: [go]
    if:
      type: text
      word: BOFArgsBuffer


composite_rules:
  - id: sliver-server-session-lifecycle
    desc: Sliver module with session lifecycle handlers
    crit: notable
    conf: 0.95
    for: [go]
    all:
      - id: well-known/tool/offensive/command-and-control/sliver::sliver-go-module-path
      - id: metadata/lang/source/naming/function/runtime::kill-session-function-name
      - id: metadata/lang/source/naming/function/runtime::open-session-function-name
      - id: metadata/lang/source/naming/function/runtime::close-session-function-name

  - id: sliver-hex-traffic-encoder
    desc: Sliver hex traffic encoder WebAssembly module
    conf: 0.99
    all:
      - id: well-known/tool/offensive/command-and-control/sliver::traffic-encoder-asset-path
      - id: metadata/binary/provenance/source::rust-hex-source-path
      - id: micro-behaviors/data/encode/codecs::wasm-encode-export
      - id: micro-behaviors/data/encode/codecs::wasm-decode-export
