defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  conf: 0.99

traits:
  - id: operator-rpc-client-return-type
    desc: Declares a Sliver operator RPC client result
    crit: notable
    if:
      type: tree-sitter
      language: go
      query: |
        ((source_file
          (import_declaration [
            (import_spec !name path: (interpreted_string_literal (interpreted_string_literal_content) @module))
            (import_spec_list (import_spec !name path: (interpreted_string_literal (interpreted_string_literal_content) @module)))
          ])
          (function_declaration result: [
            (qualified_type package: (package_identifier) @package name: (type_identifier) @client)
            (parameter_list (parameter_declaration type:
              (qualified_type package: (package_identifier) @package name: (type_identifier) @client)))
          ])) @signature
          (#eq? @module "github.com/bishopfox/sliver/protobuf/rpcpb")
          (#eq? @package "rpcpb")
          (#eq? @client "SliverRPCClient"))
        ((source_file
          (import_declaration [
            (import_spec name: (package_identifier) @import_alias path: (interpreted_string_literal (interpreted_string_literal_content) @module))
            (import_spec_list (import_spec name: (package_identifier) @import_alias path: (interpreted_string_literal (interpreted_string_literal_content) @module)))
          ])
          (function_declaration result: [
            (qualified_type package: (package_identifier) @package name: (type_identifier) @client)
            (parameter_list (parameter_declaration type:
              (qualified_type package: (package_identifier) @package name: (type_identifier) @client)))
          ])) @signature
          (#eq? @module "github.com/bishopfox/sliver/protobuf/rpcpb")
          (#eq? @package @import_alias)
          (#eq? @client "SliverRPCClient"))

composite_rules:
  - id: sliver-operator-wireguard-source
    desc: Sliver operator WireGuard transport source
    crit: notable
    all:
      - id: metadata/import/go/github/com/bishopfox/sliver/client/assets
      - id: metadata/import/go/github/com/bishopfox/sliver/protobuf/rpcpb
      - id: well-known/tool/offensive/command-and-control/sliver::operator-rpc-client-return-type
      - id: micro-behaviors/network/tunnel::go-constructed-wireguard-device-config
      - id: micro-behaviors/communications/grpc::go-custom-context-dialer-call
