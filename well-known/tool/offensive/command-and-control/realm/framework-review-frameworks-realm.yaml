defaults:
  crit: suspicious
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  - go
  - json
  size_max: 5000000
  attack: T1587.001
  mbc: B0030

traits:
  - id: realm-graphql-order-field-enum
    desc: Realm Tavern ordering-enum reference
    conf: 0.92
    if:
      type: text
      regex: '\b(Beacon|Quest|Tome|Portal)OrderField\b'

  - id: realm-graphql-id-query
    desc: Realm Tavern ID-query constant reference
    conf: 0.92
    if:
      # `GET_BEACON_IDS_QUERY`, `GET_QUEST_IDS_QUERY` -- the console's
      # paginated-id lookups, one per Realm model.
      type: text
      regex: '\bGET_(BEACON|QUEST|TOME|PORTAL)_[A-Z_]{2,20}_QUERY\b'

  - id: realm-tome-builder-extension
    desc: Realm Tome Builder editor extension
    conf: 0.9
    if:
      # Realm ships a VS Code extension for authoring Tomes -- the Eldritch
      # scripts a Quest runs on a Beacon. The extension source is otherwise
      # ordinary editor plumbing and carries no schema names.
      type: text
      regex: '(?i)\bTome Builder\b'

  - id: realm-eldritch-tome-pivot-call
    desc: Realm Eldritch tome calls pivot module
    conf: 0.9
    for: [text, python]
    size_max: 262144
    if:
      # Tomes are Starlark-dialect Eldritch scripts that a Quest runs on a
      # Beacon. The `pivot` module is Realm's lateral-movement and tunnelling
      # API (portals, port forwards, proxies, reverse shells, SSH/SMB
      # execution); its member names together with the module prefix are
      # Realm-specific, unlike the bare words.
      type: text
      regex: '\bpivot\.(create_portal|reverse_shell_pty|port_forward|bind_proxy|(ssh|smb)_exec)\('

