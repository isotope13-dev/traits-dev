defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: slackhell-name-reference
  desc: References the Slackhell tool name
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.9
  attack: T1588.002
  if:
    type: text
    regex: '(?i)slackhell'
