# Praxis is Origin's AI-agent post-exploitation framework. Identify its own
# wire protocol and executable dispatch, rather than mentions in clients or docs.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.99

traits:
  - id: agent-enable-dispatch
    desc: Praxis agent broadcast dispatch
    if:
      type: text
      substr: 'NodeBroadcastMessage::PraxisAgentEnabled {'
      exclude_comments: true

  - id: terminal-command-dispatch
    desc: Praxis terminal command dispatch
    if:
      type: text
      regex: 'NodeCommand::Terminal\([a-z_]+\)\s*=>'
      exclude_comments: true

  - id: intercepted-traffic-message
    desc: Praxis intercepted traffic report
    if:
      type: text
      substr: 'NodeSignalMessage::InterceptedTraffic(entry)'
      exclude_comments: true

  - id: intercept-ca-name
    desc: Praxis interception CA subject
    if:
      type: symbol
      kind: call
      regex: '\.push$'
      arg: {index: 1, exact: Praxis Intercept CA}

composite_rules:
  - id: amqp-control-runtime
    desc: Praxis post-exploitation node handles AMQP terminal tasking
    crit: hostile
    attack: T1059
    all:
      - id: agent-enable-dispatch
      - id: terminal-command-dispatch
      - id: micro-behaviors/communications/messaging/pubsub::rust-amqp-basic-consume-call

  - id: traffic-reporting-runtime
    desc: Praxis node includes terminal control and intercepted traffic reporting
    all:
      - id: amqp-control-runtime
      - id: intercepted-traffic-message

  - id: interception-certificate-authority
    desc: Praxis interception CA generates root and issued certificates
    all:
      - id: intercept-ca-name
      - id: micro-behaviors/crypto/certificate/generate::rust-certificate-self-sign-call
      - id: micro-behaviors/crypto/certificate/generate::rust-certificate-issuer-sign-call
