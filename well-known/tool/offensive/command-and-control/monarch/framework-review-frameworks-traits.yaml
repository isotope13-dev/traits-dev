defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: monarch-c2-base-image
  desc: Container built on the Monarch C2 image
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.93
  attack: T1588.002
  if:
    type: text
    regex: '(?im)^\s*FROM\s+[^\n]{0,20}pygrum/monarch'
