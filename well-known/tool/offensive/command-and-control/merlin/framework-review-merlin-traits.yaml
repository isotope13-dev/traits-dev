defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000

traits:
- id: github-ref
  size_min: 512
  size_max: 500000000
  desc: Merlin GitHub import path
  crit: suspicious
  conf: 0.95
  mbc: B0030
  attack: T1071
  if:
    type: text
    substr: github.com/Ne0nd0g/merlin
    section: ".text"
- id: agent-dash
  size_min: 512
  size_max: 500000000
  desc: merlin-agent reference
  crit: notable
  conf: 0.85
  mbc: B0030
  attack: T1071
  if:
    type: text
    substr: merlin-agent
    section: ".text"
- id: agent-camel
  size_min: 512
  size_max: 500000000
  desc: MerlinAgent reference
  crit: notable
  conf: 0.85
  mbc: B0030
  attack: T1071
  if:
    type: text
    substr: MerlinAgent
    section: ".text"
- id: pkg-messages
  size_min: 512
  size_max: 500000000
  desc: Merlin package messages reference
  crit: suspicious
  conf: 0.95
  mbc: B0030
  attack: T1071
  if:
    type: text
    substr: merlin/pkg/messages
    section: ".text"
- id: merlin-str
  size_min: 512
  size_max: 500000000
  desc: Merlin name token
  crit: component
  if:
    type: text
    word: merlin
    case_insensitive: true
    section: ".text"

composite_rules:
- id: agent-ref
  size_min: 512
  size_max: 500000000
  desc: Merlin agent reference
  crit: suspicious
  conf: 0.95
  mbc: B0030
  attack: T1071
  any:
  - id: well-known/tool/offensive/command-and-control/merlin::agent-dash
  - id: well-known/tool/offensive/command-and-control/merlin::agent-camel
- id: merlin-detected
  all:
  - id: well-known/tool/offensive/command-and-control/merlin::project-reference-evidence
  size_min: 512
  size_max: 500000000
  desc: Merlin C2 detected
  crit: suspicious
  conf: 0.95
  mbc: B0030
  attack: T1071
  needs: 2
  any:
  - id: well-known/tool/offensive/command-and-control/merlin::github-ref
  - id: well-known/tool/offensive/command-and-control/merlin::agent-ref
  - id: well-known/tool/offensive/command-and-control/merlin::pkg-messages
  - id: metadata/file/profile/execution-api::shellcode-assembly-command-name-cluster
  - id: metadata/file/profile/network::merlin-http2-marker-context
