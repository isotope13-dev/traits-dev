defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_min: 512
  size_max: 500000000
composite_rules:
- id: project-reference-evidence
  desc: Discriminating named-project reference evidence
  crit: component
  conf: 0.99
  any:
  - id: well-known/tool/offensive/command-and-control/merlin::github-ref
  - id: well-known/tool/offensive/command-and-control/merlin::pkg-messages
  - id: well-known/tool/offensive/command-and-control/merlin::agent-ref
  - id: well-known/tool/offensive/command-and-control/merlin::merlin-c2-repository
