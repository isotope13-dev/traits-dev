defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go
  - elf
  - macho
  - pe
  attack: T1059
  size_max: 52428800

traits:
  - id: hermit-backdoor-import
    desc: Hermit backdoor Go package import
    crit: suspicious
    conf: 0.99
    if:
      type: string_literal
      substr: github.com/hideckies/hermit
  - id: hermit-backdoor-author
    desc: References the Hideckies author handle
    crit: component
    conf: 0.99
    if:
      type: string_literal
      substr: hideckies

composite_rules:
  - id: hermit-agent-server-structs
    desc: Hermit agent/server structure pair
    crit: suspicious
    conf: 0.95
    for: [go]
    all:
      - id: metadata/lang/source/naming/declaration::agent-mode-struct-name
      - id: metadata/lang/source/naming/declaration::server-state-struct-name
    any:
      - id: well-known/tool/offensive/command-and-control/hermit::hermit-backdoor-import
      - id: well-known/tool/offensive/command-and-control/hermit::hermit-backdoor-author
