defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: obfpost-channel-class
  desc: Weevely ObfPost channel class
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: '((class_definition name: (identifier) @name) @evidence (#eq? @name "ObfPost"))'
- id: md5-channel-header-slice
  desc: Weevely MD5 channel header slice
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: self\.header\s*=\s*passwordhash\[8:20\]
- id: md5-channel-trailer-slice
  desc: Weevely MD5 channel trailer slice
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: self\.trailer\s*=\s*passwordhash\[20:32\]
composite_rules:
- id: weevely-obfuscated-post-channel
  desc: Weevely obfuscated webshell command channel
  crit: hostile
  conf: 0.98
  all:
  - id: obfpost-channel-class
  - id: md5-channel-header-slice
  - id: md5-channel-trailer-slice
  - id: micro-behaviors/data/compress::zlib-compress-symbol
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
