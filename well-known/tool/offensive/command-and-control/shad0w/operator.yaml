defaults:
  for: [pyc]
  platforms: [unix, windows]

traits:
  - id: input-handler-source-path
    desc: Shad0w input handler source path
    crit: notable
    if:
      type: value
      path: pyc.source_files[*]
      regex: '(^|[/\\])shad0w[/\\]lib[/\\]input_handler\.py$'

  - id: bridge-path
    desc: Shad0w bridge directory path
    crit: notable
    if:
      type: text
      substr: /shad0w/.bridge

  - id: command-module
    desc: Command module identifier
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: lib.commands

  - id: system-identifier
    desc: System identifier
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: system

composite_rules:
  - id: operator-input-handler-bytecode
    desc: Shad0w C2 operator command handler bytecode
    crit: hostile
    attack: T1588.002
    all:
      - id: input-handler-source-path
      - id: bridge-path
      - id: command-module
      - id: system-identifier
