# Gato is an openly published reverse-shell handler for authorized security
# testing.  Its listener, PTY negotiation, and file-transfer behavior is real;
# this context prevents the generic handler heuristic from treating the
# attributable operator tool as an implant. The identity evidence is split
# across archive members, so the exception must use outer scope.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, markdown, text, zip]
  crit: notable
  conf: 0.98

traits:
  - id: module-declaration
    desc: Gato Go module declaration
    for: [go.mod, text]
    if:
      type: text
      regex: '^module\s+github\.com/0xMoonrise/gato\s*$'

  - id: handler-description
    desc: Gato reverse-shell handler description
    for: [markdown, text]
    if:
      type: text
      substr: Gato is a reverse shell handler with interactive PTY support

  - id: source-member-marker
    desc: Gato internal Go package reference
    for: [go]
    if:
      type: text
      regex: 'github\.com/0xMoonrise/gato/internal/[A-Za-z0-9_/-]+'

composite_rules:
  - id: gato-tool-context
    desc: Recognized Gato reverse-shell handler source context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: module-declaration
      - id: handler-description
