# OSRipper advertises itself as a FUD backdoor/crypter generator in the
# package manifest. That wording plus the crypter console scripts is the
# product identity, not a generic Nuitka dependency.
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]
  attack: T1588.002,T1027.002
  crit: notable
  conf: 0.96

traits:
  - id: fud-backdoor-generator-description
    desc: Package describes a FUD backdoor generator
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)FUD backdoor generator'
  - id: osripper-console-scripts
    desc: Console scripts named osripper
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^osripper(-cli)?\s*='
  - id: crypter-keyword
    desc: Package keywords include crypter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|["\s])crypter(["\s]|$)'

composite_rules:
  - id: fud-crypter-generator-manifest
    desc: FUD backdoor crypter generator package
    crit: hostile
    conf: 0.98
    all:
      - id: fud-backdoor-generator-description
      - id: osripper-console-scripts
      - id: crypter-keyword
  - id: fud-backdoor-console-generator
    desc: FUD backdoor generator with named console scripts
    crit: hostile
    conf: 0.97
    all:
      - id: fud-backdoor-generator-description
      - id: osripper-console-scripts
  - id: crypter-console-generator
    desc: Crypter console scripts in a generator package
    crit: hostile
    conf: 0.96
    all:
      - id: osripper-console-scripts
      - id: crypter-keyword
