# HHunter (github.com/cc1a2b/HHunter) is an openly distributed HTTP header
# vulnerability scanner for authorized testing. Its mutation libraries embed
# SQLi / traversal probe strings; those are dual-use corpus, not live malware.
# This identity is benign context for those source members.
defaults:
  platforms: [unix, windows]
  for: [go, text]
  crit: notable
  conf: 0.98

traits:
  - id: hhunter-engine-import
    desc: Imports HHunter engine package
    if:
      type: text
      substr: github.com/cc1a2b/HHunter/engine

  - id: hhunter-module-path
    desc: HHunter Go module path
    if:
      type: text
      substr: github.com/cc1a2b/HHunter

  - id: hhunter-injection-mutations-fn
    desc: HHunter GetInjectionMutations function
    for: [go]
    if:
      type: text
      substr: GetInjectionMutations

  - id: hhunter-mutation-category-impact
    desc: HHunter mutation Category Impact fields
    for: [go]
    if:
      type: text
      regex: 'Category:\s+"Injection",\s+Impact:'

composite_rules:
  - id: hhunter-source-context
    desc: HHunter header-scanner source context
    crit: exception
    needs: 2
    any:
      - id: hhunter-engine-import
      - id: hhunter-module-path
      - id: hhunter-injection-mutations-fn
      - id: hhunter-mutation-category-impact
