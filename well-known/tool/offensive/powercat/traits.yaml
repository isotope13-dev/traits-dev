defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 1000000
traits:
- id: module-function
  desc: Powercat network-stream tool function
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?powercat\b'
- id: powershell-mode-function
  desc: Powercat interactive PowerShell mode function
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?Main_Powershell\b'
composite_rules:
- id: network-powershell-command-mode
  desc: Powercat provides network-fed PowerShell command evaluation
  crit: notable
  all:
  - id: module-function
  - id: powershell-mode-function
  - id: objectives/command-and-control/remote-command/dispatch::powershell-iex-on-stream-read
