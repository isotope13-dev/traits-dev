# Gauntlet — Adversarial stress-testing and regression suites for AI agents
# (github.com/GauntletVectorLabs/gauntlet, PyPI package `gauntlet-agent`).
#
# Gauntlet fires a suite of adversarial, edge-case prompts and jailbreak probes
# at AI agents over HTTP to stress-test agent boundaries, detect system-prompt
# leaks, and audit RL environments for reward hacks. The attack probes and
# mutators are deterministic testing fixtures shipped for evaluation purposes.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, text, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Gauntlet package name in package metadata
    for: [pkginfo, text, markdown]
    if:
      type: value
      path: name
      exact: gauntlet-agent

  - id: wheel-distribution
    desc: Gauntlet wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: gauntlet_agent

  - id: package-summary
    desc: Gauntlet package summary metadata
    for: [pkginfo, text, markdown]
    if:
      type: value
      path: summary
      substr: "Break your agent before your users do, and audit RL environments for reward hacks"

  - id: repo-reference
    desc: Gauntlet repository reference
    for: [source, scripts, pkginfo, text, markdown]
    if:
      type: text
      substr: "GauntletVectorLabs/gauntlet"

  - id: cli-entrypoint
    desc: Gauntlet console script entrypoint
    for: [text]
    if:
      type: text
      regex: '(?m)^gauntlet\s*=\s*gauntlet\.cli:main'

  - id: release-archive-member
    desc: Gauntlet release archive member
    if:
      type: path
      regex: '(?i)gauntlet[_-]agent-[0-9][\w.-]*\.(whl|tgz|tar\.gz)'

  - id: adversarial-probe-library
    desc: Gauntlet adversarial probe library docstring
    for: [python]
    if:
      type: text
      substr: "Built-in adversarial probe library"

  - id: best-of-n-mutators
    desc: Gauntlet Best-of-N mutators docstring
    for: [python]
    if:
      type: text
      substr: "Offline Best-of-N augmentation library"

  - id: attacker-models
    desc: Gauntlet attacker models docstring
    for: [python]
    if:
      type: text
      substr: "Attacker models: propose candidate attack messages given a goal"

  - id: adversarial-probe-class
    desc: Gauntlet BUILTIN_PROBES table definition
    for: [python]
    if:
      type: text
      regex: 'BUILTIN_PROBES\s*=\s*\['

composite_rules:
  - id: gauntlet-framework
    desc: Gauntlet agent adversarial stress-testing framework
    crit: notable
    conf: 0.98
    any:
      - id: package-name
      - id: wheel-distribution
      - id: package-summary
      - id: repo-reference
      - id: cli-entrypoint
      - id: release-archive-member
      - id: adversarial-probe-library
      - id: best-of-n-mutators
      - id: attacker-models
      - id: adversarial-probe-class
