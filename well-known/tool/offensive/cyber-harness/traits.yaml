# Cyber-Harness / AIScan — AI-driven security assessment agent and multi-engine
# scanner framework (github.com/chainreactors/cyber-harness,
# github.com/chainreactors/aiscan, github.com/iqx6889/cyber-harness).
# Integrates gogo, spray, zombie, neutron, and katana for automated penetration
# testing and vulnerability scanning.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, markdown, text, zip, tar, yaml]
  crit: notable
  conf: 0.98

traits:
  - id: repo-path
    desc: Cyber-harness repository tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])(cyber-harness|aiscan)(@|[-_]v?[0-9]|[\\/]|$)'

  - id: readme-title
    desc: AIScan pentest agent title
    for: [markdown, text]
    if:
      type: text
      substr: "AI-driven single-binary pentest agent with a built-in multi-engine arsenal"

  - id: embedded-skill-context
    desc: AIScan embedded scanner agent skill guide
    for: [markdown, text]
    if:
      type: text
      substr: "Autonomous security research agent on the chainreactors scanner toolkit"

  - id: config-basename
    desc: AIScan configuration filename
    if:
      type: path
      basename: true
      exact: 'aiscan.yaml'

composite_rules:
  - id: cyber-harness-framework
    desc: Cyber-harness / AIScan penetration-testing framework
    crit: notable
    conf: 0.98
    any:
      - id: well-known/tool/offensive/chainreactors::chainreactors-aiscan-module
      - id: readme-title
      - id: embedded-skill-context

  - id: cyber-harness-archive
    desc: Cyber-harness / AIScan security assessment archive
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: repo-path
    any:
      - id: well-known/tool/offensive/chainreactors::chainreactors-aiscan-module
      - id: readme-title
      - id: embedded-skill-context
      - id: config-basename
