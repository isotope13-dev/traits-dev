# A Windows reverse-shell DLL project built with OpenSSL. The MSBuild
# FileTracker log names the ReverseShellDLL project and its OpenSSL-WIN64 headers
# and libraries. The log is a build record, not a payload. The project is a
# post-exploitation implant, so a build of it is hostile on identity. Both legs
# are project-level identity; neither proves the DLL's runtime behavior.
defaults:
  for: [text]
  platforms: [windows, unix]
  attack: T1573

traits:
  - id: reverse-shell-dll-project-name
    desc: Build log names a ReverseShellDLL project
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: REVERSESHELLDLL

  - id: openssl-win64-build-path
    desc: Build log cites OpenSSL-WIN64 include path
    crit: notable
    conf: 0.8
    if:
      type: text
      case_insensitive: true
      substr: OPENSSL-WIN64

composite_rules:
  - id: reverse-shell-dll-openssl-build
    desc: ReverseShellDLL project built against OpenSSL headers
    crit: hostile
    conf: 0.88
    all:
      - id: reverse-shell-dll-project-name
      - id: openssl-win64-build-path
