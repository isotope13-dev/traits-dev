# DarkGlitch is an openly described remote-administration and post-exploitation
# framework. Its source package intentionally contains remote shell and file
# tasking behavior; require multiple published identity fields before treating
# that behavior as recognized offensive-tool functionality.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: published-package-summary
    desc: DarkGlitch published package summary
    for: [python-sdist, whl]
    if:
      type: value
      path: python.summary
      exact: Remote command delivery tool over WebSocket signaling

  - id: published-legacy-package-summary
    desc: DarkGlitch legacy package summary
    for: [python-sdist, whl]
    if:
      type: value
      path: python.summary
      exact: Remote command delivery and media streaming tool over WebRTC signaling

  - id: wheel-distribution
    desc: DarkGlitch wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: darkglitch

  - id: package-name
    desc: DarkGlitch Python package identity
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: darkglitch

  - id: package-summary
    desc: DarkGlitch remote-command package summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      exact: Remote command delivery tool over WebSocket signaling

  - id: project-repository
    desc: DarkGlitch upstream repository identity
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: github.com/LaVenganzaDelLadron/darkglitch

  - id: relay-connection-banner
    desc: DarkGlitch relay connection banner
    for: [python]
    if:
      type: text
      substr: CONNECTING TO MALWARE SIGNAL BASH

composite_rules:
  - id: framework-identity
    desc: DarkGlitch remote-administration framework
    for: [python-sdist, whl]
    scope: outer
    all:
      - id: package-name
      - id: package-summary
      - id: project-repository
