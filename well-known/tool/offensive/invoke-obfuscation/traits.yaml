defaults:
  platforms: [windows]
  for: [powershell]
  size_min: 200
  size_max: 12000000

traits:
  - id: obfuscation-module-functions-a
    desc: Invoke-Obfuscation command generator functions
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Out-(EncodedWhitespaceCommand|ObfuscatedAst|PowerShellLauncher)\b'

  - id: obfuscation-module-functions-b
    desc: Invoke-Obfuscation token generator functions
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Out-(EncodedSpecialCharOnlyCommand|ObfuscatedTokenCommand)\b'

  - id: obfuscation-framework-function
    desc: Invoke-Obfuscation framework entry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-Obfuscation\b'

  - id: compressed-command-function
    desc: Invoke-Obfuscation compression generator
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Out-CompressedCommand\b'

  # Every Invoke-Obfuscation output module carries this header, including the
  # ones whose generator function has no dedicated atom above ("This file is
  # part of ..." or, in Out-ObfuscatedAst, "<name> is a part of ..."). It
  # identifies the file as part of the obfuscation framework rather than a
  # one-off script, which is why it is suspicious on its own and corroborates
  # the hostile obfuscator composites on the generator modules.
  - id: invoke-obfuscation-module-marker
    desc: Invoke-Obfuscation module file marker
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bpart of Invoke-Obfuscation\.'
