# pypykatz is mimikatz reimplemented in Python: it parses LSASS memory (live,
# from a minidump, or from registry hives) and recovers plaintext passwords,
# NT hashes and Kerberos tickets. Kali ships it as python3-pypykatz.
#
# Detect the tool implementation instead of suppressing pypykatz as a known
# security utility. The lockfile-only matches below stay suspicious because a
# dependency declaration does not prove the project runs the dumper. The
# third-party rulesets already convict mimikatz.exe from a dozen directions,
# but nothing covered the Python port, so the Kali package scanned completely
# clean.
#
# Keyed on the LSA decryptor internals rather than the name alone: an article
# or a detection rule can mention "pypykatz", but only the tool carries the
# NT5/NT6 LSA template and decryptor classes it uses to walk lsasrv's
# structures.
defaults:
  platforms: [unix, windows]
  for: [python, text, pipfile.lock]
  attack: T1003.001
  size_max: 268435456

traits:
  - id: pypykatz-lockfile-package
    desc: Lockfile declares the pypykatz package
    crit: notable
    conf: 0.97
    for: [pipfile.lock, poetry.lock, requirements.txt]
    if:
      type: text
      regex: '(?m)^ {8}"pypykatz": \{'
  - id: minikerberos-lockfile-package
    desc: Lockfile declares the minikerberos package
    crit: notable
    conf: 0.94
    for: [pipfile.lock, poetry.lock, requirements.txt]
    if:
      type: text
      regex: '(?m)^ {8}"minikerberos": \{'
  - id: aiowinreg-lockfile-package
    desc: Lockfile declares the aiowinreg package
    crit: notable
    conf: 0.94
    for: [pipfile.lock, poetry.lock, requirements.txt]
    if:
      type: text
      regex: '(?m)^ {8}"aiowinreg": \{'
  - id: pypykatz-module-import
    desc: Imports a pypykatz module
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(^|\s)(from|import)\s+pypykatz[.\s]'
  - id: pypykatz-lsa-decryptor-class
    desc: pypykatz LSA decryptor class
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bLsa(Decryptor|Template)_NT[56]\b'
  - id: pypykatz-console-entrypoint
    desc: pypykatz console entry point
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bpypykatz\s*=\s*pypykatz\.__main__'

composite_rules:
  # The tool itself, not a mention of it: its own module namespace plus the
  # LSASS-parsing internals.
  - id: pypykatz-credential-dumper
    desc: pypykatz LSASS credential dumper
    crit: hostile
    conf: 0.98
    all:
      - id: pypykatz-module-import
    any:
      - id: pypykatz-lsa-decryptor-class
      - id: pypykatz-console-entrypoint

  # A dependency lockfile declares what an environment would install, not
  # whether the project runs credential extraction. Keep lockfile-only matches
  # suspicious; the source-code rule above remains hostile when the actual
  # pypykatz implementation is present.
  - id: pypykatz-kerberos-lockfile-stack
    desc: Lockfile pins pypykatz with minikerberos
    crit: suspicious
    conf: 0.9
    for: [pipfile.lock, poetry.lock, requirements.txt]
    all:
      - id: pypykatz-lockfile-package
      - id: minikerberos-lockfile-package

  - id: pypykatz-winreg-lockfile-stack
    desc: Lockfile pins pypykatz with aiowinreg
    crit: suspicious
    conf: 0.9
    for: [pipfile.lock, poetry.lock, requirements.txt]
    all:
      - id: pypykatz-lockfile-package
      - id: aiowinreg-lockfile-package

  - id: pypykatz-credential-ecosystem-lockfile
    desc: Lockfile pins the pypykatz Windows credential-dump stack
    crit: suspicious
    conf: 0.94
    for: [pipfile.lock, poetry.lock, requirements.txt]
    all:
      - id: pypykatz-lockfile-package
      - id: minikerberos-lockfile-package
      - id: aiowinreg-lockfile-package
