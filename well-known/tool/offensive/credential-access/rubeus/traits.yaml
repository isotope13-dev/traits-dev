# Rubeus is an openly published Kerberos assessment and red-team utility.
# Attribute the tool without treating its identity alone as malware; objective
# traits separately describe the credential attacks implemented by the binary.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
  size_max: 5242880

traits:
  - id: product-name
    desc: Rubeus PE product identity
    if:
      type: value
      path: pe.version.product_name
      exact: Rubeus

  - id: internal-name
    desc: Rubeus PE internal filename
    if:
      type: value
      path: pe.version.internal_name
      exact: Rubeus.exe

  # These distinctive help fingerprints survive namespace/product renaming.
  # A command name or generic Kerberos API alone cannot identify Rubeus.
  - id: ticket-column-wrapping-help
    desc: Rubeus ticket column-wrapping help fingerprint
    if:
      type: text
      section: .text
      substr: 'The "/nowrap" flag prevents any base64 ticket blobs from being column wrapped'

  - id: delegation-ticket-help
    desc: Rubeus delegation-ticket help fingerprint
    if:
      type: text
      section: .text
      substr: 'without elevation by abusing the Kerberos GSS-API, faking delegation'

composite_rules:
  - id: version-resource-identity
    desc: Rubeus product and internal-name resources
    all:
      - id: product-name
      - id: internal-name

  - id: renamed-help-identity
    desc: Rubeus delegation and ticket-formatting help
    all:
      - id: ticket-column-wrapping-help
      - id: delegation-ticket-help

  - id: rubeus-tool
    desc: Rubeus Kerberos assessment tool
    any:
      - id: version-resource-identity
      - id: renamed-help-identity
