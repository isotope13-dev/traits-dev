defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 1000000
traits:
- id: module-function
  desc: SessionGopher saved-session extraction function
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?Invoke-SessionGopher\b'
- id: winscp-decrypt-function
  desc: SessionGopher WinSCP password decoder
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?DecryptWinSCPPassword\b'
composite_rules:
- id: saved-session-password-extraction
  desc: SessionGopher reads saved sessions and decodes passwords
  crit: hostile
  all:
  - id: module-function
  - id: winscp-decrypt-function
  - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references
  - id: micro-behaviors/fs/read/file/full::get-content
