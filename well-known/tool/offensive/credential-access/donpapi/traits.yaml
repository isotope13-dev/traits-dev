# DonPAPI (https://github.com/login-securite/DonPAPI): dumps DPAPI-protected
# secrets (Credential Manager, vaults, browsers, Wi-Fi, RDCMan, mRemoteNG,
# VNC, certificates) and SAM/LSA from remote Windows hosts over SMB, with
# admin credentials. Its PyPI summary reads "Dumping revelant information on
# compromised targets without AV detection".
#
# The attack code is the collectors, the core that triages masterkeys, the
# secretsdump wrapper, and the entry point that drives them. The logger,
# paths, config, and web-report helpers import the package without touching
# a target, so each identity rule also needs remote looting evidence.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1555
  mbc: E1555

traits:
  - id: donpapi-package-import
    desc: Imports the DonPAPI package
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: import
      regex: '^donpapi\.(core|lib|collectors)(\.|$)'

  - id: donpapi-collector-roster
    desc: Imports five or more DonPAPI collectors
    crit: notable
    conf: 0.98
    count_min: 5
    if:
      type: symbol
      kind: import
      regex: '^donpapi\.collectors\.[a-z_]{3,24}$'

composite_rules:
  - id: donpapi-remote-secret-collector
    desc: DonPAPI module loots DPAPI or SAM/LSA secrets from remote hosts
    crit: hostile
    conf: 0.98
    all:
      - id: donpapi-package-import
    any:
      - id: well-known/tool/offensive/framework/dploot::dploot-dpapi-smb-import
      - id: well-known/tool/offensive/impacket::secretsdump-module-import
      - id: donpapi-collector-roster
