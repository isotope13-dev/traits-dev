# Hacktool kit banner in a d3des.h VNC DES header. The banner lists VNC brute
# force, MSSQL NT password, and password-store recovery modules. The header
# itself holds prototypes only, so the banner is a suspicious identity leg.
defaults:
  for: [c, cpp, text]
  platforms: [windows, linux, macos]
  crit: suspicious
  conf: 0.9
  attack: T1110
  size_min: 500
  size_max: 5000000

traits:
  - id: vncbrute-kit-banner
    desc: Hacktool banner naming VNC brute module
    if:
      type: text
      substr: 'MSSQL-NTPASS-SYM06010-MS04007-MS06040-VNCBRUTE'
