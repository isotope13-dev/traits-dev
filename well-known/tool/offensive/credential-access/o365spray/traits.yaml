# o365spray (https://github.com/0xZDH/o365spray): Microsoft 365 username
# enumeration and password-spraying tool. Each technique is a module class
# (SprayModule_oauth2, EnumerateModule_onedrive, ...) on top of a shared
# handler package. The module files are the attack code. Helpers such as the
# logger and writer import the package but do not spray, so they need the
# module class as well.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.003
  mbc: E1110

traits:
  - id: o365spray-package-import
    desc: Imports the o365spray handler package
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: import
      regex: '^o365spray\.core\.(handlers|utils)'

  - id: o365spray-attack-module-class
    desc: Defines an o365spray spray or enum module
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^class (SprayModule|EnumerateModule)_[a-z0-9]{2,20}\((SprayerBase|EnumeratorBase)\)'

composite_rules:
  - id: o365spray-attack-module
    desc: o365spray Microsoft 365 password-spray or user-enumeration module
    crit: hostile
    conf: 0.98
    all:
      - id: o365spray-package-import
      - id: o365spray-attack-module-class
