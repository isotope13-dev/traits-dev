defaults:
  for: [pe]
  platforms: [windows]
  attack: T1003.001

traits:
  - id: dump-routine
    desc: SafetyKatz managed dump routine
    crit: notable
    if:
      type: symbol
      kind: function
      exact: SafeKatz.Program.Minidump

composite_rules:
  - id: safetykatz
    desc: SafetyKatz LSASS dumper and in-memory Mimikatz loader
    crit: hostile
    conf: 0.99
    ref: https://github.com/GhostPack/SafetyKatz
    all:
      - id: dump-routine
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-call
      - id: micro-behaviors/process/info/name::lsass-target-token
      - id: objectives/execution/payload/image-map::managed-relocation-thread-loader
