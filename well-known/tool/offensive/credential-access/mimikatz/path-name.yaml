# A path naming Mimikatz does not establish Kali provenance or tool identity.
defaults:
  crit: notable
  conf: 0.99
  platforms: [linux, windows]
  for: [pe, dll]
  size_max: 2000000000
traits:
  - id: mimikatz-path-name
    desc: Path names Mimikatz executable or directory
    if:
      type: path
      regex: '(?i)(^|[\\/])mimikatz([\\/]|\.exe$)'
