defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.99

traits:
  - id: logonpasswords-command-literal
    desc: Mimikatz logon-password command literal
    if:
      type: literal
      regex: '(?i)^sekurlsa::logonpasswords(\s|$)'
  - id: certificate-export-command-literal
    desc: Mimikatz certificate private-key export command
    if:
      type: literal
      substr: 'crypto::certificates /export'
  - id: certificate-export-protection-patch-commands
    desc: Mimikatz CNG and CAPI export-protection patches
    if:
      type: literal
      substr: 'crypto::cng crypto::capi'
  - id: dcsync-user-command-literal
    desc: Mimikatz user-targeted DCSync command literal
    if:
      type: literal
      substr: 'lsadump::dcsync /user:'
