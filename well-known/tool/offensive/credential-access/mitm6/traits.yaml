# mitm6 (https://github.com/dirkjanm/mitm6): IPv6 DNS takeover tool that
# answers DHCPv6 requests as a rogue server and spoofs DNS replies, usually
# paired with ntlmrelayx to relay the authentication it attracts.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1557.003

traits:
  - id: mitm6-cli-banner
    desc: mitm6 command-line description
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: mitm6 - pwning IPv4 via IPv6

  - id: mitm6-soa-responsible-name
    desc: mitm6 forged SOA responsible-name marker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'rname\s*=\s*["'']mitm6["'']'

composite_rules:
  - id: mitm6-dns-takeover-tool
    desc: mitm6 rogue DHCPv6 and DNS spoofing tool
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/capture/network::rogue-dhcpv6-dns-takeover
    any:
      - id: mitm6-cli-banner
      - id: mitm6-soa-responsible-name
