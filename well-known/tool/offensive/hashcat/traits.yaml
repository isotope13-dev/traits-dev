# Hashcat is a password-recovery tool. Its Windows build is an unsigned
# MinGW binary whose brain client/server is a real Winsock service.
defaults:
  platforms: [windows, unix]
  for: [pe, shell, 7z]
  crit: notable
  conf: 0.98
  size_max: 50000000

traits:
  - id: hashcat-usage-banner
    desc: Hashcat usage banner
    for: [pe]
    if:
      type: text
      substr: 'Usage: hashcat [options]'
      section: .rdata
  - id: hashcat-distribution-path
    desc: Hashcat distribution path
    if:
      type: path
      regex: '(?i)(^|/)hashcat-[0-9]'
