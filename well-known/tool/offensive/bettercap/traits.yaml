# bettercap — the "Swiss Army knife" for network attacks and monitoring:
# ARP/DNS/DHCP spoofing, transparent HTTP(S) proxying, credential sniffing, and
# Wi-Fi/BLE/HID attacks. A legitimate, widely used pentest framework, so its
# identity is a notable dual-use attribution rather than a verdict on its own —
# a source file's offensive weight comes from what module it is, and much of the
# tree (like this UDPSocket retry patch) is ordinary plumbing. The composites
# that carry real intent live under objectives/; these atoms only answer "is
# this bettercap?".
defaults:
  platforms: [unix, windows]
  for: [ruby, go, markdown]
  size_max: 5000000

traits:
  # The banner block every bettercap source file opens with. The project name
  # and its author attribution together are specific enough that no unrelated
  # file carries them; either alone (the word "bettercap" in prose, a common
  # author name) would be weaker, which is why the composite pairs them.
  - id: bettercap-project-banner
    desc: bettercap source banner name
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*BETTERCAP\s*$'

  - id: bettercap-author-attribution
    desc: bettercap author attribution line
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "Simone 'evilsocket' Margaritelli"

  - id: bettercap-repository-url
    desc: bettercap source repository URL
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'github\.com/(evilsocket|bettercap)/bettercap'

composite_rules:
  - id: bettercap-banner-attribution
    desc: bettercap banner with author attribution
    crit: notable
    conf: 0.97
    all:
      - id: bettercap-project-banner
      - id: bettercap-author-attribution

  - id: bettercap-source-file
    desc: bettercap framework source file
    crit: notable
    conf: 0.98
    any:
      - id: bettercap-repository-url
      - id: bettercap-banner-attribution
