# ysoserial (frohoff/ysoserial) — the Java deserialization payload generator:
# given a gadget-chain name and a command, it emits a serialized stream that
# executes the command on a deserializing host. Invoking it is payload
# production, not library use; the gadget names below are its chain
# vocabulary (CommonsCollections, Spring, JRMP, URLDNS, ...), shared with
# Java exploitation research generally.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  attack: T1203
  mbc: E1203

traits:
  - id: ysoserial-generator-invocation
    desc: Invokes ysoserial payload generator
    crit: notable
    conf: 0.96
    if:
      type: text
      # `ysoserial <gadget> <command>` on a shell line, `java -jar
      # ysoserial.jar ...`, or a `ysoserial` step/wrapper binary. The word
      # boundary keeps longer identifiers out; the suffixes cover the
      # common distributions.
      regex: '(?i)\bysoserial(-all|\.jar|\.py|\.exe)?\b'

  - id: gadget-chain-commons
    desc: Names a Commons deserialization chain
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bCommons(Collections[1-7]|Beanutils[12]|Configuration[12])\b'

  - id: gadget-chain-spring
    desc: Names a Spring/Hibernate gadget chain
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(Spring[12]|Hibernate[12]|AspectJWeaver|JSON1)\b'

  - id: gadget-chain-jrmp
    desc: Names a JRMP/URLDNS gadget chain
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(JRMP(Client|Listener)|URLDNS|Groovy1|Jdk7u21)\b'

  - id: gadget-chain-misc-a
    desc: Names a misc deserialization chain
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(BeanShell1|Clojure|Click1|FileUpload1|JBossInterceptors[12])\b'

  - id: gadget-chain-misc-b
    desc: Names another deserialization chain
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(MozillaRhino[12]|Myfaces[12]|Wicket1|Vaadin1|Shiro(550|721))\b'

composite_rules:
  - id: deserialization-gadget-chain-name
    desc: Names a Java deserialization gadget chain
    crit: notable
    conf: 0.94
    any:
      - id: gadget-chain-commons
      - id: gadget-chain-spring
      - id: gadget-chain-jrmp
      - id: gadget-chain-misc-a
      - id: gadget-chain-misc-b

  - id: ysoserial-context
    desc: ysoserial payload-generator context
    crit: notable
    conf: 0.95
    any:
      - id: ysoserial-generator-invocation
      - id: deserialization-gadget-chain-name
