defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: masscan-ref
  size_min: 512
  size_max: 500000000
  desc: Masscan port scanner reference
  crit: notable
  conf: 0.75
  attack: T1046
  if:
    type: text
    word: masscan
    section: ".text"
- id: masscan-debug-ref
  size_min: 512
  size_max: 500000000
  desc: Masscan name in debug strings
  crit: notable
  conf: 0.9
  for:
  - elf
  if:
    type: text
    word: masscan
    section: ".debug_str"
- id: masscan-scan-output-banner
  size_min: 512
  size_max: 500000000
  desc: Masscan scan-output banner reference
  crit: notable
  conf: 0.95
  for:
  - elf
  if:
    type: text
    substr: "# Masscan 1.0.6 scan initiated"
    section: ".rodata.str1.8"
- id: masscan-adapter-ip
  size_min: 512
  size_max: 500000000
  desc: References adapter-ip scan option
  crit: notable
  if:
    type: text
    substr: adapter-ip
    section: ".text"
- id: masscan-nocapture
  size_min: 512
  size_max: 500000000
  desc: References --nocapture scan option
  crit: notable
  if:
    type: text
    substr: "--nocapture"
    section: ".text"
- id: masscan-randomize-hosts
  size_min: 512
  size_max: 500000000
  desc: References randomize-hosts scan option
  crit: notable
  if:
    type: text
    substr: randomize-hosts
    section: ".text"

composite_rules:
- id: masscan-output-format
  # The bare --output-format flag is shared by scanners, SBOM emitters, and
  # ordinary clap-style CLIs, so it lives as a neutral capability in
  # micro-behaviors/process/argument/option. The masscan reading requires a
  # masscan-specific anchor beside the flag: the tool name, one of its
  # distinctive options, or its scan banner.
  size_min: 512
  size_max: 500000000
  desc: Output-format option in Masscan context
  crit: notable
  conf: 0.9
  attack: T1046
  all:
  - id: metadata/file/profile/command-options::output-format-option
  any:
  - id: well-known/tool/offensive/masscan::masscan-ref
  - id: well-known/tool/offensive/masscan::masscan-adapter-ip
  - id: well-known/tool/offensive/masscan::masscan-nocapture
  - id: well-known/tool/offensive/masscan::masscan-randomize-hosts
  - id: well-known/tool/offensive/masscan::masscan-scan-output-banner
  needs: 1
- id: masscan-config
  size_min: 512
  size_max: 500000000
  desc: Masscan configuration-option fingerprint
  crit: suspicious
  conf: 0.85
  attack: T1046
  needs: 3
  any:
  - id: well-known/tool/offensive/masscan::masscan-adapter-ip
  - id: well-known/tool/offensive/masscan::masscan-nocapture
  - id: well-known/tool/offensive/masscan::masscan-output-format
  - id: well-known/tool/offensive/masscan::masscan-randomize-hosts
- id: masscan-object-module-signature
  size_min: 512
  size_max: 500000000
  desc: Masscan debug-source and banner fingerprint
  crit: notable
  conf: 0.95
  for:
  - elf
  needs: 3
  any:
  - id: well-known/tool/offensive/masscan::masscan-debug-ref
  - id: metadata/binary/provenance/source::grepable-output-source-name
  - id: metadata/binary/symbols/name/token::heartbleed-protocol-enum-name
  - id: well-known/tool/offensive/masscan::masscan-scan-output-banner
- id: masscan-process-create-context
  size_min: 512
  size_max: 500000000
  desc: Masscan reference with process-create evidence
  crit: suspicious
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  all:
  - id: well-known/tool/offensive/masscan::masscan-ref
  - id: "micro-behaviors/process/create"
