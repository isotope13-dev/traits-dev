# XSSer is an open-source cross-site scripting assessment framework. Its
# installed desktop launcher identifies the local security tool; it does not
# itself contain exploit logic or establish persistence.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.99
  size_max: 100000

traits:
  - id: desktop-launcher
    desc: XSSer web-security testing launcher
    if:
      type: value
      path: desktop_entry.exec
      regex: '^/usr/bin/xsser(\s|$)'
