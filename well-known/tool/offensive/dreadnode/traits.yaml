# Dreadnode — open-source AI red-teaming SDK (github.com/dreadnode, PyPI
# `dreadnode`). Its airt package implements published jailbreak and
# adversarial-prompt research, so attacker-LLM prompts that name safety-filter
# bypass are the tool's own objective text. Identity only: the framework
# import is a file-local known-entity context for LLM safety-bypass wording.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.95

traits:
  - id: package-tree-member
    desc: Dreadnode AIRT package tree member
    conf: 0.99
    if:
      type: path
      regex: '(?i)(^|[\\/])dreadnode[\\/]airt\b'

  - id: release-archive-member
    desc: Dreadnode release wheel archive member
    conf: 0.99
    if:
      type: path
      regex: '(?i)(^|[^\w-])dreadnode-[0-9][0-9a-z._-]*\.(whl|tar\.gz)'

  - id: framework-import
    desc: Imports the dreadnode SDK package
    conf: 0.85
    for: [python]
    if:
      type: import
      regex: '^dreadnode(\.|$)'

  - id: pkg-name
    desc: Dreadnode package name metadata
    conf: 0.9
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: dreadnode

composite_rules:
  - id: dreadnode-sdk
    desc: Dreadnode AI red-teaming SDK
    conf: 0.95
    any:
      - id: package-tree-member
      - id: release-archive-member
      - id: framework-import
      - id: pkg-name
