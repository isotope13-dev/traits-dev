defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 512
  size_max: 20971520
  crit: notable
  conf: 0.99
traits:
  - id: hid-state-config-marker
    desc: Hidden driver Hid_State configuration name
    if:
      type: text
      section: any
      exact: Hid_State
  - id: hid-stealthmode-config-marker
    desc: Hidden driver Hid_StealthMode configuration name
    if:
      type: text
      section: any
      exact: Hid_StealthMode

composite_rules:
  - id: hidden-minifilter-driver-context
    desc: Hidden-derived filesystem-minifilter driver
    all:
      - id: hid-stealthmode-config-marker
      - id: objectives/evasion/kernel-hide/rootkit::qassist-add-hidden-file-log
      - id: objectives/evasion/kernel-hide/rootkit::qassist-add-hidden-dir-log
      - id: objectives/evasion/kernel-hide/rootkit::qassist-clean-directory-information-log
      - id: metadata/binary/header/characteristics::pe-native-subsystem
