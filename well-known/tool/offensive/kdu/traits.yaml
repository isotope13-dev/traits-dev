defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 16777216

# MSVC merges these literals into .data in some KDU builds (e.g. the
# stock 577 KiB x64 release), so each string is accepted in either string
# section.
traits:
  - id: kernel-driver-utility-name
    desc: KDU Kernel Driver Utility product name
    if:
      type: text
      exact: Kernel Driver Utility
      section: .rdata

  - id: kernel-driver-utility-name-data
    desc: KDU product name in .data
    if:
      type: text
      exact: Kernel Driver Utility
      section: .data

  - id: kdu-project-copyright
    desc: KDU Project copyright banner
    if:
      type: text
      regex: '(?i)Copyright \(C\) 2020(\s*-\s*20[0-9]{2})? KDU Project'
      section: .rdata

  - id: kdu-project-copyright-data
    desc: KDU copyright banner in .data
    if:
      type: text
      regex: '(?i)Copyright \(C\) 2020(\s*-\s*20[0-9]{2})? KDU Project'
      section: .data

composite_rules:
  - id: kdu-utility
    desc: Recognized hfiref0x Kernel Driver Utility release
    crit: notable
    conf: 0.995
    all:
      - id: kernel-driver-utility-name
      - id: kdu-project-copyright
  - id: kdu-utility-data-strings
    desc: hfiref0x KDU release, data strings
    crit: notable
    conf: 0.995
    all:
      - id: kernel-driver-utility-name-data
      - id: kdu-project-copyright-data
