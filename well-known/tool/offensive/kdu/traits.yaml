defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 16777216

traits:
  - id: kernel-driver-utility-name
    desc: KDU Kernel Driver Utility product name
    if:
      type: text
      exact: Kernel Driver Utility
      section: .rdata

  - id: kdu-project-copyright
    desc: KDU Project copyright banner
    if:
      type: text
      regex: '(?i)Copyright \(C\) 2020(\s*-\s*20[0-9]{2})? KDU Project'
      section: .rdata

composite_rules:
  - id: kdu-utility
    desc: Recognized hfiref0x Kernel Driver Utility release
    crit: notable
    conf: 0.995
    all:
      - id: kernel-driver-utility-name
      - id: kdu-project-copyright
