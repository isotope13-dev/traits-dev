defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  size_min: 10000
  size_max: 2000000
  crit: notable
  conf: 0.98
traits:
- id: config-root
  desc: NetRipper plaintext interception configuration
  if:
    type: hex
    pattern: "3C 4E 65 74 52 69 70 70 65 72 3E 3C 70 6C 61 69 6E 74 65 78 74 3E"
    section: .data
- id: tls-read-log
  desc: NetRipper intercepted TLS read log name
  if:
    type: text
    substr: SSL_Read.txt
    section: .rdata
- id: tls-write-log
  desc: NetRipper intercepted TLS write log name
  if:
    type: text
    substr: SSL_Write.txt
    section: .rdata
- id: secret-string-filter
  desc: NetRipper credential keyword selection filter
  if:
    type: hex
    pattern: "3C 73 74 72 69 6E 67 66 69 6E 64 65 72 3E 75 73 65 72 2C 6C 6F 67 69 6E 2C 70 61 73 73 2C 64 61 74 61 62 61 73 65 2C 63 6F 6E 66 69 67"
    section: .data
composite_rules:
- id: plaintext-interceptor
  desc: NetRipper TLS plaintext interception tool
  all:
  - id: config-root
  - id: tls-read-log
  - id: tls-write-log
