# pwntools — the standard CTF and exploit-development framework (Gallopsled).
#
# Almost everything the offensive objectives detect here is reference data
# rather than behaviour:
#
#   pwnlib/constants/<os>/<arch>.py  ~1850 lines of `__NR_x = Constant('__NR_x', N)`
#   pwnlib/data/includes/**/*.h      the same syscall numbers as C headers
#   pwnlib/shellcraft/templates/**   assembly templates the user asks it to emit
#
# A syscall table naming memfd_create, finit_module, process_vm_writev and
# PTRACE_TRACEME is a table, not a fileless rootkit loader; the shellcraft
# templates are the product's entire purpose. The identity is what an analyst
# wants surfaced, and the objectives reference this from `unless:`.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: pwntools wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^pwntools$'

  - id: pwnlib-member-path
    desc: pwnlib package member path
    for: [python, text, data, source, scripts, c, whl, egg, zip]
    if:
      type: path
      regex: '(^|[\\/])pwnlib[\\/]'

  - id: pwnlib-import
    desc: pwnlib module import
    for: [python]
    if:
      type: import
      regex: '^pwnlib(\.|$)'

composite_rules:
  - id: pwntools-distribution
    desc: Recognized pwntools distribution
    crit: exception
    conf: 0.99
    scope: outer
    for: [python, text, data, source, scripts, c, whl, egg, zip]
    any:
      - id: wheel-distribution-name
      - id: pwnlib-member-path
      - id: pwnlib-import
