# Claude-BugHunter (github.com/elementalsouls/Claude-BugHunter, PyPI claude-bughunter)
# is an open-source terminal runner and Claude Code skills bundle for bug bounty
# hunting and security auditing. Its SKILL.md guides quote real-world vulnerability
# test vectors (XXE, path traversal, deserialization, SSRF) as bug-hunting patterns.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, scripts, source, zip, tar, python, pkginfo, pyproject.toml]
  crit: notable
  conf: 0.98

traits:
  - id: bughunter-repo-url
    desc: Claude-BugHunter GitHub repo URL
    for: [markdown, text, python, pyproject.toml]
    if:
      type: text
      regex: '(?i)github\.com/elementalsouls/claude-bughunter'

  - id: bughunter-package-name
    desc: claude-bughunter package metadata name
    for: [pyproject.toml, pkginfo, text]
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']claude-bughunter["'']'

  - id: bughunter-archive-path
    desc: Claude-BugHunter archive member path
    if:
      type: path
      regex: '(?i)(^|[\\/])claude-bughunter(@|[-_]v?[0-9]|[\\/]|$)'

  - id: bughunter-skill-description
    desc: Claude-BugHunter skill prompt description
    for: [markdown, text, scripts, source]
    if:
      type: text
      regex: '(?i)Hunting skill for \S+ vulnerabilities\b'

composite_rules:
  - id: claude-bughunter-skill-context
    desc: Claude-BugHunter security skill guide context
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: bughunter-repo-url
      - id: bughunter-package-name
      - id: bughunter-archive-path
      - id: bughunter-skill-description
