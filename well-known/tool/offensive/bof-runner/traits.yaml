defaults:
  for: [powershell]
  platforms: [windows]
  size_min: 1000
  size_max: 1000000
traits:
  - id: invoke-bof-function
    desc: Invoke-Bof caller-supplied COFF runner
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-Bof\b'
  - id: start-bof-function
    desc: COFF runner Start-Bof helper
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Start-Bof\b'
  - id: unload-beacon-parameters-function
    desc: COFF runner argument-buffer cleanup helper
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Unload-BeaconParameters\b'
composite_rules:
  - id: caller-supplied-coff-runner-context
    desc: Caller-supplied COFF execution utility
    crit: exception
    conf: 0.98
    all:
      - id: invoke-bof-function
      - id: start-bof-function
      - id: unload-beacon-parameters-function
    unless:
      - id: metadata/binary/layout/embedded::large-embedded-b64-blob
