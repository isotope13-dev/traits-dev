defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  mbc: B0030
  size_max: 5000000
traits:
- id: stowaway-module-path-cmd
  crit: notable
  size_min: 512
  size_max: 500000000
  desc: Stowaway Go module path (cmd)
  if:
    type: text
    regex: Stowaway/cmd/(agent|admin|share|protocol)
    section: ".text"
- id: stowaway-module-path-pkg
  crit: notable
  size_min: 512
  size_max: 500000000
  desc: Stowaway Go module path (pkg)
  if:
    type: text
    regex: Stowaway/pkg/(agent|admin|share|protocol)
    section: ".text"
- id: stowaway-agent-startup
  size_min: 512
  size_max: 500000000
  desc: Stowaway agent startup message
  crit: suspicious
  conf: 0.98
  attack: T1090
  if:
    type: text
    regex: "\\[\\*\\] Starting agent node (actively|passively)\\."
    section: ".text"
- id: stowaway-port-reuse
  size_min: 512
  size_max: 500000000
  desc: Stowaway port reuse technique
  crit: suspicious
  conf: 0.95
  attack: T1090
  if:
    type: text
    regex: reusing (host|port).{0,50}\((SO_REUSEPORT|IPTABLES)\)
    section: ".text"
- id: stowaway-crypto
  size_min: 512
  size_max: 500000000
  desc: Stowaway crypto functions
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: agent_crpyt\.|PassivePreAuth|achieveUUID
    section: ".text"
- id: stowaway-reconnect
  size_min: 512
  size_max: 500000000
  desc: Stowaway reconnection pattern
  crit: suspicious
  conf: 0.9
  attack: T1090
  if:
    type: text
    substr: Reconnecting every %d seconds
    section: ".text"
composite_rules:
- id: stowaway-module-path
  size_min: 512
  size_max: 500000000
  desc: Stowaway Go module path
  crit: suspicious
  conf: 0.99
  attack: T1090
  any:
  - id: stowaway-module-path-cmd
  - id: stowaway-module-path-pkg
- id: stowaway-proto-messages
  size_min: 512
  size_max: 500000000
  desc: Stowaway protocol message types
  crit: component
  conf: 0.95
  any:
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-1a
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-1b
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-1c
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-2a
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-2b
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-3a
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-3b
  - id: metadata/binary/symbols/name/qualified::proxy-proto-messages-3c
- id: stowaway-handlers
  size_min: 512
  size_max: 500000000
  desc: Stowaway handler functions
  crit: component
  conf: 0.95
  any:
  - id: metadata/binary/symbols/name/qualified::proxy-handlers-1
  - id: metadata/binary/symbols/name/qualified::proxy-handlers-2
- id: stowaway-managers
  size_min: 512
  size_max: 500000000
  desc: Stowaway manager components
  crit: component
  conf: 0.9
  any:
  - id: metadata/binary/symbols/name/qualified::proxy-managers-1
  - id: metadata/binary/symbols/name/qualified::proxy-managers-2
- id: stowaway-detected
  size_min: 512
  size_max: 500000000
  desc: Stowaway multi-hop proxy tool detected
  crit: hostile
  conf: 0.99
  attack: T1090.001
  all:
  - id: stowaway-module-path
  - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
- id: stowaway-ssh-tunnel
  size_min: 512
  size_max: 500000000
  desc: Stowaway with SSH tunneling
  crit: hostile
  conf: 0.98
  attack: T1572
  all:
  - id: stowaway-handlers
  - id: stowaway-managers
  - id: stowaway-module-path
  - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
- id: stowaway-agent
  size_min: 512
  size_max: 500000000
  desc: Stowaway agent with C2 capabilities
  crit: hostile
  conf: 0.98
  mbc: B0024
  attack: T1090.001
  all:
  - id: stowaway-agent-startup
  - id: stowaway-proto-messages
  - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
- id: stowaway-iptables-evasion
  size_min: 512
  size_max: 500000000
  desc: Stowaway with iptables evasion
  crit: hostile
  conf: 0.98
  attack: T1562.004
  all:
  - id: micro-behaviors/os/firewall/iptables::iptables-prerouting-redirect
  - id: stowaway-port-reuse
  - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
