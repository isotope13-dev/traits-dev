# Ne0nd0g's go-shellcode repository describes itself as a collection of Windows
# shellcode runners and lists the injection and execution techniques each one
# implements. The repository's own description and its runner catalog identify
# the project; a single API name in an unrelated document does not.
defaults:
  for: [html]
  platforms: [windows]
  crit: notable
  conf: 0.96

traits:
  - id: go-shellcode-project-description
    desc: go-shellcode project describes its runners
    if:
      type: text
      substr: A repository of Windows Shellcode runners and supporting utilities
  - id: go-shellcode-runner-catalog
    desc: go-shellcode runner catalog lists techniques
    if:
      type: text
      regex: 'EarlyBird|NtQueueApcThreadEx|RtlCreateUserThread|EtwpCreateEtwThread'

composite_rules:
  - id: go-shellcode-runner-collection
    desc: Ne0nd0g go-shellcode runner collection page
    crit: hostile
    conf: 0.95
    all:
      - id: go-shellcode-project-description
      - id: go-shellcode-runner-catalog
