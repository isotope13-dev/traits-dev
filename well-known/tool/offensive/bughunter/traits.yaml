# BugHunter is an openly identified dual-use bug-bounty toolkit.  These
# source-context traits let generic exploit rules retain their signal on
# unknown tools while recognizing this project's explicitly named modules.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.98

traits:
  - id: vuln-scanner-title
    desc: BugHunter vulnerability scanner title
    for: [shell]
    if:
      type: text
      regex: 'Bug Bounty Vulnerability Scanner v[0-9]+'

  - id: verified-poc-generation-title
    desc: BugHunter verified PoC generation title
    for: [shell]
    if:
      type: text
      substr: Verified PoC Generation

  - id: spray-orchestrator-title
    desc: BugHunter credential spray orchestrator title
    for: [shell]
    if:
      type: text
      substr: Spray Orchestrator

  - id: spray-lockout-warning
    desc: BugHunter spray lockout warning
    for: [shell]
    if:
      type: text
      substr: LOCKOUT WARNING

  - id: brain-local-llm-title
    desc: BugHunter local LLM brain title
    for: [python]
    if:
      type: text
      substr: Brain — Local LLM reasoning

  - id: brain-exploit-loop-marker
    desc: BugHunter autonomous exploit-loop marker
    for: [python]
    if:
      type: text
      regex: 'Post-scan autonomous loop[\s\S]{0,300}exploit_finding'

  - id: hackerone-oauth-title
    desc: BugHunter HackerOne OAuth tester title
    for: [python]
    if:
      type: text
      substr: HackerOne OAuth / Auth Flow Tester

  - id: hackerone-base-url
    desc: BugHunter HackerOne OAuth tester base URL
    for: [python]
    if:
      type: text
      exact: 'BASE = "https://hackerone.com"'

  - id: spray-helper-entrypoint-marker
    desc: BugHunter delegated spray helper marker
    for: [python]
    if:
      type: text
      substr: 'NOT a standalone entry point. Spawned by tools/spray_orchestrator.sh'

  - id: spray-helper-target-env
    desc: BugHunter spray helper target environment
    for: [python]
    if:
      type: text
      substr: SPRAY_TARGET_URL

  - id: security-guide-checklist-marker
    desc: BugHunter checklist plus submission criteria
    for: [markdown]
    if:
      type: text
      regex: '(?ims)^#{1,6}[ \t]+Testing Checklist[ \t]*$[\s\S]{0,800}\bSubmittable when:'

  - id: security-guide-submittable-marker
    desc: BugHunter guide impact marker
    for: [markdown]
    if:
      type: text
      substr: 'Submittable when:'

composite_rules:
  - id: bughunter-source-context
    desc: BugHunter dual-use security-tool source context
    crit: exception
    needs: 2
    any:
      - id: vuln-scanner-title
      - id: verified-poc-generation-title
      - id: spray-orchestrator-title
      - id: spray-lockout-warning
      - id: brain-local-llm-title
      - id: brain-exploit-loop-marker
      - id: hackerone-oauth-title
      - id: hackerone-base-url
      - id: spray-helper-entrypoint-marker
      - id: spray-helper-target-env

  - id: bughunter-security-guide-context
    desc: BugHunter educational vulnerability guide context
    for: [markdown]
    crit: exception
    all:
      - id: security-guide-checklist-marker
      - id: security-guide-submittable-marker
