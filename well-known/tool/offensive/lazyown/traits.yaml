defaults:
  crit: suspicious
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - pyc
  size_max: 5000000
traits:
- id: lazyown-c2-html-panel
  desc: LazyOwn Command and Control HTML panel
  crit: suspicious
  conf: 0.95
  for: [html]
  if:
    type: text
    regex: '(?is)LazyOwn Command and Control Center.{0,500}(powerful C&C|written in Python)'
- id: lazyown-llm-bridge
  desc: LazyOwn LLM Bridge for RCE
  crit: suspicious
  conf: 0.95
  if:
    type: string_literal
    substr: LazyOwn LLM Bridge
- id: lazyown-mcp-import
  desc: Imports the LazyOwn MCP component
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: from lazyown_mcp import
