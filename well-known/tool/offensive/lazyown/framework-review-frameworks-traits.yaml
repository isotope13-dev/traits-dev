defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: lazyown-name-reference
  desc: References the LazyOwn framework name
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: notable
  conf: 0.9
  attack: T1588.002
  if:
    # The name alone: the framework's own sources spell it inside identifiers
    # (`_run_lazyown`, `lazyown_mc`), and `_` is a word character, so
    # `\blazyown\b` matched none of them. Tools that interoperate with it (an
    # OSINT exporter emitting LazyOwn's intel vocabulary) carry the same string,
    # which is why a name reference is evidence of the framework only beside
    # the agent-class and orchestrator legs of the composite below.
    type: text
    regex: '(?i)lazyown'

composite_rules:
- id: lazyown-agent-orchestrator-context
  desc: LazyOwn agent and orchestrator name context
  crit: suspicious
  conf: 0.96
  attack: T1587.001
  for: [python]
  all:
  - id: well-known/tool/offensive/lazyown::lazyown-name-reference
  - id: metadata/lang/source/naming/declaration::autonomous-agent-name
  - id: metadata/lang/source/naming/function/runtime::orchestrator-execution-name
- id: lazyown-post-exploitation-goals
  desc: LazyOwn agent with post-exploitation goal text
  crit: suspicious
  conf: 0.97
  attack: T1587.001
  for: [python]
  all:
  - id: well-known/tool/offensive/lazyown::lazyown-agent-orchestrator-context
  needs: 2
  any:
  - id: metadata/lang/natural/phrasing::credential-dump-task-phrase
  - id: metadata/lang/natural/phrasing::credential-lateral-move-task-phrase
  - id: metadata/lang/natural/phrasing::persistence-task-phrase
