# LazyOwn "lazyaddons" manifests: YAML that tells the framework where to clone
# an offensive tool from, where to install it (external/.exploit/), how to run
# it, and optionally which file to upload to a compromised host and which
# command to run there.
defaults:
  platforms: [linux, windows]
  for: [yaml]
  size_max: 65536
  attack: T1588.002

traits:
  - id: addon-exploit-install-path
    desc: Tool manifest installs into external/.exploit/
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s+install_path:\s*["'']?external/\.exploit/'

  - id: addon-tool-clone-and-run
    desc: Manifest clones a repository and runs it
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?ms)^tool:\s*\n.{0,400}?^\s+repo_url:\s*\S.{0,800}?^\s+execute_command:\s*\S'

  - id: addon-target-upload
    desc: Manifest uploads a file to the target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s+upload_file:\s*\S'

  - id: addon-target-remote-command
    desc: Manifest runs a command on the target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s+remote_command:\s*\S'

composite_rules:
  - id: lazyown-offensive-addon-manifest
    desc: LazyOwn addon installs an offensive tool
    crit: suspicious
    conf: 0.9
    all:
      - id: addon-exploit-install-path
      - id: addon-tool-clone-and-run

  - id: lazyown-addon-runs-tool-on-target
    desc: Addon uploads a tool to a target and runs it
    crit: suspicious
    conf: 0.9
    attack: T1570
    all:
      - id: addon-tool-clone-and-run
      - id: addon-target-upload
      - id: addon-target-remote-command
