defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 5000000
traits:
- id: module-function
  desc: NinjaCopy raw NTFS copy module function
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?Invoke-NinjaCopy\b'
- id: stealth-open-export
  desc: NinjaCopy NTFS raw file-open export name
  if:
    type: text
    substr: StealthOpenFile
- id: stealth-read-export
  desc: NinjaCopy NTFS raw file-read export name
  if:
    type: text
    substr: StealthReadFile
composite_rules:
- id: reflective-raw-ntfs-copy
  desc: NinjaCopy raw NTFS copy utility with delegated exports
  crit: notable
  all:
  - id: module-function
  - id: stealth-open-export
  - id: stealth-read-export
  - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
