# Container images built on a penetration-testing distribution. Kali, Parrot
# and BlackArch exist to ship offensive tooling preinstalled, so a `FROM` line
# naming one tells you what the image is for before a single package is added
# -- the exploitation frameworks, cracking tools and payload generators are
# already in the base layer and never appear in the Dockerfile.
#
# Notable, not suspicious: these are legitimate, widely used distributions and
# an image built on one is as likely to belong to a security team as to an
# operator. It earns its place because the identity is invisible to any rule
# that reads only the instructions in the file.
defaults:
  platforms: [unix]
  for: [dockerfile, github-actions, shell, text]
  crit: notable
  conf: 0.95

traits:
  - id: pentest-distro-base-image
    desc: Container built on a pentest distribution
    if:
      type: text
      regex: '(?im)^\s*FROM\s+[^\n]{0,24}(kalilinux|parrotsec|blackarch)'

  - id: pentest-distro-repository
    desc: Adds a pentest distribution package repository
    if:
      # `deb http://http.kali.org/kali kali-rolling main ...` written into
      # sources.list -- the same result reached from an ordinary base image,
      # which the `FROM` check above never sees.
      type: text
      regex: '(?i)\bdeb\s+https?://[^\n]{0,40}\bkali(-rolling)?\b'
