# pwncat is a netcat-style network tool with bind/reverse-shell, port
# forwarding and file-transfer features (dual-use). These rules recognize
# references to the tool in scripts and CI workflows; they do not claim the
# scanned artifact is the tool itself.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, python, javascript, github-actions]
  crit: notable
  conf: 0.9

traits:
  - id: pwncat-tool-reference
    desc: References the pwncat network tool
    if:
      type: text
      word: pwncat
      case_insensitive: true

  - id: pwncat-test-env-prefix
    desc: pwncat test harness variable prefix
    conf: 0.92
    if:
      type: text
      regex: '\bTEST_PWNCAT_(HOST|PORT|WAIT|RUNS)\b'
