# DInvoke_rs — Kurosh Dabbagh Escalante (@_Kudaes_) Rust dynamic invocation and manual mapping crates
defaults:
  platforms: [windows]
  for: [cargo.toml, rust, text]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: repository-marker
    desc: DInvoke_rs source repository marker
    if:
      type: text
      substr: github.com/Kudaes/DInvoke_rs

  - id: author-kudaes
    desc: Kurosh Dabbagh Escalante author claim
    if:
      type: text
      substr: Kurosh Dabbagh Escalante

  - id: package-name
    desc: DInvoke_rs package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^(dinvoke|manualmap|dinvoke_data)$'

composite_rules:
  - id: dinvoke-rs-package
    desc: Recognized DInvoke_rs offensive research crate
    crit: notable
    conf: 0.99
    all:
      - id: repository-marker
    any:
      - id: package-name
      - id: author-kudaes

  - id: dinvoke-rs-context
    desc: Recognized DInvoke_rs crate context
    crit: exception
    conf: 0.99
    any:
      - id: dinvoke-rs-package
      - id: repository-marker
