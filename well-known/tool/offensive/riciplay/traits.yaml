# Riciplay is an openly identified bug-bounty DAST/SAST tool. Its payload
# factory intentionally stores SQLi, SSTI, SSRF, and sandbox-escape probes for
# operator-selected targets; those strings are generator data, not host-side
# execution by the package itself.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-tree-member
    desc: Riciplay security-tool package member
    if:
      type: path
      regex: '(?i)(^|[\\/])riciplay_cli([\\/]|-|$)'

  - id: pypi-package-name
    desc: Riciplay PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: riciplay-cli

  - id: payload-factory-title
    desc: Riciplay context-specific payload generator
    for: [python]
    if:
      type: text
      substr: Generates novel, context-specific payloads

  - id: payload-factory-class
    desc: Riciplay PayloadFactory class
    for: [python]
    if:
      type: text
      substr: 'class PayloadFactory:'

composite_rules:
  - id: payload-template-context
    desc: Riciplay vulnerability payload-template context
    crit: exception
    all:
      - id: payload-factory-title
      - id: payload-factory-class
