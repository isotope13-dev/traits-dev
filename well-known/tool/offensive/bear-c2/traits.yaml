# BEAR-C2 is a public adversary-emulation framework. This signature identifies
# its Reaper Node QUIC agent without treating the framework name as malware.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: reaper-quic-client-class
    desc: BEAR-C2 Reaper QUIC client class
    if:
      type: text
      regex: '\bclass\s+QUICClientPayload\s*\(QuicConnectionProtocol\)'

composite_rules:
  - id: reaper-node-quic-agent
    desc: BEAR-C2 Reaper Node QUIC agent
    crit: suspicious
    conf: 0.999
    all:
      - id: reaper-quic-client-class
      - id: objectives/command-and-control/backdoor/control/command-vocab::file-control-command-set
      - id: objectives/command-and-control/backdoor/control/command-vocab::file-control-response-set
      - id: micro-behaviors/communications/socket/quic::aioquic-client-connect
