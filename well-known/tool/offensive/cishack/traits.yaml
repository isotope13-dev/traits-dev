# CISHack 1.0: a Win16 VB3 CompuServe automation kit with mail-bomber and
# message-bomber front ends. The product title and menu names are specimen
# identifiers, so they stay in this family rule. The keystroke and repeat
# behavior is in the generic chat rules it shares with copycats.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1491

traits:
  - id: cishack-product-title
    desc: CISHack 1.0 product title text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: CISHack 1.0

  - id: cishack-mail-bomber-menu
    desc: CISHack mail bomber menu caption
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: CISHack - Mail Bomber

  - id: cishack-message-bomber-menu
    desc: CISHack message bomber menu caption
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: CISHack - Message Bomber

composite_rules:
  - id: cishack-bomber-kit
    desc: CISHack CompuServe bomber kit title and menus
    crit: hostile
    conf: 0.96
    needs: 2
    any:
      - id: cishack-product-title
      - id: cishack-mail-bomber-menu
      - id: cishack-message-bomber-menu
