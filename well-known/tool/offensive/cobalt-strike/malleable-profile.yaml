# Malleable C2 beacon profiles (Cobalt Strike / Empire format): a text
# profile that sets beacon timing (sleeptime, jitter, DNS timing) and
# defines http-get/http-post/http-stager transaction blocks with metadata
# transforms. The directives are attacker-tooling configuration, so two or
# more of them in one file is suspicious; a single timing word elsewhere is
# only notable.
defaults:
  attack: T1071
  mbc: C0001
  platforms: [windows, unix]
  # Profiles usually sniff as text, but directive-heavy ones (braces plus
  # base64 transform blobs) can sniff as javascript, as the Wikipedia
  # get-only profile does.
  for: [text, javascript]

traits:
  - id: malleable-sleeptime-directive
    desc: Malleable profile sleeptime directive
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*set\s+sleeptime\s+"?\d'

  - id: malleable-jitter-directive
    desc: Malleable profile jitter directive
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*set\s+jitter\s+"?\d'

  - id: malleable-dns-timing-directive
    desc: Malleable profile DNS timing directive
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*set\s+(dns_idle|dns_sleep|dns_max_txt|maxdns)\b'

  - id: malleable-transaction-block
    desc: Malleable profile transaction block
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*http-(get|post|stager)\s*\{'

composite_rules:
  - id: malleable-beacon-profile
    desc: Malleable C2 beacon profile directives
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: malleable-sleeptime-directive
      - id: malleable-jitter-directive
      - id: malleable-dns-timing-directive
      - id: malleable-transaction-block
