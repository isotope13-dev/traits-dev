defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: beacon-object-file-banner
    desc: Beacon Object File SDK banner
    if:
      type: text
      substr: Beacon Object Files (BOF)

  - id: cobalt-strike-version-banner
    desc: Cobalt Strike SDK version banner
    if:
      type: text
      substr: Cobalt Strike 4.x

  - id: beacon-sdk-header-guard
    desc: Beacon SDK header guard
    if:
      type: text
      substr: _BEACON_H_

composite_rules:
  - id: cobalt-strike-beacon-sdk-header
    desc: Cobalt Strike Beacon BOF SDK header
    all:
      - id: beacon-object-file-banner
      - id: cobalt-strike-version-banner
      - id: beacon-sdk-header-guard
    near_bytes: 2000
