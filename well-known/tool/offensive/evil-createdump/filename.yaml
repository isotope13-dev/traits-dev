defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 500000000
traits:
  - id: evil-createdump-name
    desc: Filename matches evil-createdump
    crit: notable
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '^evil[-_]?createdump(\.exe)?$'
      case_insensitive: true
