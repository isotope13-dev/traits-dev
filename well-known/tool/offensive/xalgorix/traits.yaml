# Xalgorix (github.com/xalgord/xalgorix) is an openly distributed AI
# autonomous penetration-testing platform. Its agent prompts and SKILL.md
# corpus intentionally document SQLi, RCE, PTY, and prompt-injection
# techniques for authorized engagements. These identity traits recognize the
# suite so generic exploit/skill objectives can except its source tree.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, json, archives, go, shell, python]
  crit: notable
  conf: 0.99

traits:
  - id: repository-member-path
    desc: xalgorix repository member path
    if:
      type: path
      regex: '(?i)xalgord.xalgorix'

  - id: go-module-path
    desc: xalgorix Go module path
    for: [go, text, markdown]
    if:
      type: text
      substr: github.com/xalgord/xalgorix

  - id: authorized-engagement-disclaimer
    desc: Xalgorix authorized engagement disclaimer
    for: [go, markdown, text]
    if:
      type: text
      regex: '(?i)SANCTIONED,\s*AUTHORIZED penetration test'

  - id: skill-author-xalgorix
    desc: Agent skill authored by xalgorix
    for: [markdown]
    if:
      type: text
      regex: '(?m)^author:\s*xalgorix\s*$'
