# Xalgorix (github.com/xalgord/xalgorix) is an openly distributed AI
# autonomous penetration-testing platform. Its agent prompts and SKILL.md
# corpus intentionally document SQLi, RCE, PTY, and prompt-injection
# techniques for authorized engagements. These identity traits recognize the
# suite so generic exploit/skill objectives can except its source tree.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, json, zip, go, shell, python]
  crit: notable
  conf: 0.99

traits:
  - id: repository-member-path
    desc: xalgorix repository member path
    if:
      type: path
      regex: '(?i)(xalgord|xalgorix).xalgorix'

  - id: go-module-path
    desc: xalgorix Go module path
    for: [go, shell, text, markdown]
    if:
      type: text
      regex: 'github\.com/(xalgord|xalgorix)/xalgorix'

  - id: authorized-engagement-disclaimer
    desc: Xalgorix authorized engagement disclaimer
    for: [go, shell, markdown, text]
    if:
      type: text
      regex: '(?i)SANCTIONED,\s*AUTHORIZED penetration test'

  - id: skill-author-xalgorix
    desc: Agent skill authored by xalgorix
    for: [markdown, php, shell, text, javascript, applescript, python]
    if:
      type: text
      regex: '(?im)^author:\s*(xalgorix|.{0,30}\(xalgord\))\s*$'

  - id: xalgorix-skill-author-frontmatter
    desc: Agent skill frontmatter names xalgorix author
    for: [scripts, markdown, php, shell, text]
    if:
      type: text
      regex: '(?im)^author:\s*.{0,35}\(xalgord\)\s*$'

  - id: xalgorix-prompt-detector-description
    desc: Skill documents prompt-injection detection
    for: [markdown, shell]
    if:
      type: text
      regex: '(?i)Detects prompt injection attacks targeting LLM-based applications'

  - id: xalgorix-skill-path
    desc: Xalgorix repository agent skill path
    for: [markdown, php, shell, text, javascript, applescript, python]
    if:
      type: path
      regex: '(?i)\binternal/tools/skills([^A-Za-z0-9_-]|$)'

  - id: xalgorix-pentest-skill-path
    desc: Xalgorix pentest or exploit skill path
    for: [python, php]
    if:
      type: path
      regex: '(?i)/xalgorix.*(pentest|exploiting|exploitation|offensive)'

composite_rules:
  # Xalgorix bundles authored security skills as methodology. Their examples
  # are not live shell or prompt-extraction behavior. Require both the
  # package's internal skill path and the author/tag frontmatter so a copied
  # payload or a generic pentest guide does not qualify.
  - id: xalgorix-authored-pentest-skill
    desc: Xalgorix-authored penetration-testing skill
    crit: exception
    for: [markdown, text]
    all:
      - id: repository-member-path
      - id: xalgorix-skill-path
      - id: metadata/package/agent-skill::skill-definition-file
      - id: xalgorix-skill-author-frontmatter
      - id: metadata/package/documentation/security-testing::pentest-skill-block-tag

  - id: xalgorix-prompt-detector-skill
    desc: Xalgorix-authored prompt-injection detector skill
    crit: exception
    for: [markdown]
    all:
      - id: repository-member-path
      - id: xalgorix-skill-path
      - id: metadata/package/agent-skill::skill-definition-file
      - id: xalgorix-skill-author-frontmatter
      - id: xalgorix-prompt-detector-description

  # The repository ships its prompt-injection and exploit guidance as agent
  # skills. Keep the author claim tied to both skill frontmatter and a member
  # path in this repository before treating payloads as inert examples.
  - id: xalgorix-authored-skill
    desc: Xalgorix-authored skill in repository
    crit: exception
    for: [markdown, php, shell, text, javascript, applescript, python]
    all:
      - id: repository-member-path
      - id: xalgorix-skill-path
      - id: metadata/package/agent-skill::skill-definition-file
      - id: skill-author-xalgorix

  # The agent's own system prompt: Go source in the xalgorix module that
  # opens with its authorized-engagement preamble. Payload strings in it
  # (JNDI lookups, UNION dumps) are testing instructions for the model.
  - id: xalgorix-agent-prompt-source
    desc: Xalgorix agent prompt with engagement preamble
    crit: exception
    for: [go, shell]
    all:
      - id: go-module-path
      - id: authorized-engagement-disclaimer
