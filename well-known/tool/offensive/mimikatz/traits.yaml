defaults:
  platforms:
  - linux
  - unix
  - windows
  - macos
  - ios
  - android
  size_max: 5000000
traits:
- id: sekurlsa-logonpasswords-lower
  size_min: 512
  size_max: 500000000
  desc: sekurlsa::logonpasswords command (lowercase)
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    substr: sekurlsa::logonpasswords
    section: ".rdata"
- id: sekurlsa-logonpasswords-mixed
  size_min: 512
  size_max: 500000000
  desc: Sekurlsa::LogonPasswords command (mixed case)
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    regex: "(?i)sekurlsa::logonpasswords"
    section: ".rdata"
- id: mimikatz-error
  size_min: 512
  size_max: 500000000
  desc: ERROR kuhl Mimikatz error signature
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: ERROR kuhl
    section: ".rdata"
- id: mimikatz-process-string
  size_min: 512
  size_max: 500000000
  desc: mimikatz.exe process string
  crit: notable
  conf: 0.95
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    substr: mimikatz
    section: ".rdata"
- id: credential-tool-name-alternation
  desc: Detector alternation of credential tool names
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [powershell]
  if:
    type: text
    substr: 'lsass|sekurlsa|mimikatz|logonpasswords'
- id: gentilkiwi-author
  size_min: 512
  size_max: 500000000
  desc: Benjamin Delpy (gentilkiwi) author signature
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: gentilkiwi|Benjamin Delpy
    section: ".rdata"
- id: mimidrv-driver-identity
  size_min: 512
  size_max: 500000000
  desc: Mimikatz kernel driver device identity
  crit: notable
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: '\Device\mimidrv'
    section: ".rdata"
- id: mimilove-identity
  size_min: 512
  size_max: 500000000
  desc: Mimilove credential-memory companion identity
  crit: notable
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: mimilove
    section: ".rdata"
- id: mimikatz-version-resource-identity
  size_min: 512
  size_max: 500000000
  desc: Mimikatz PE version-resource identity
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: '(?i)\bmimi(spool|lib|love)(\.dll|\.exe)?\s+\(mimikatz\)'
    section: ".rsrc"
composite_rules:
- id: sekurlsa-logonpasswords
  size_min: 512
  size_max: 500000000
  desc: Sekurlsa logonpasswords command (case variants)
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  any:
  - id: sekurlsa-logonpasswords-lower
  - id: sekurlsa-logonpasswords-mixed
- id: mimikatz
  size_min: 512
  size_max: 500000000
  desc: Mimikatz credential extraction tool
  crit: notable
  conf: 0.99
  attack: T1003.001
  mbc: E1003
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  unless:
  - id: metadata/package/testing/corpus::synthetic-command-log-fixture
  - id: metadata/file/format/markup::definition
  # Security UIs ship sample alert documents that name the tool the alert
  # fired on: Kibana's mock_endgame_ecs_data.js and endpoint generate_data.js
  # are fixtures for rendering a Mimikatz detection, not the tool.
  - id: metadata/package/testing/
  - id: metadata/build/generated::generated-attack-map-context
  - id: credential-tool-name-alternation
  - id: micro-behaviors/process/create/shell/guard/
  - id: well-known/tool/detection/
  - id: well-known/app/ai/coding-agent/
  - id: metadata/path::test-directory-component
  any:
  - id: sekurlsa-logonpasswords
  - id: mimikatz-error
  - id: mimikatz-process-string
  - id: gentilkiwi-author
  - id: mimikatz-version-resource-identity
- id: mimikatz-kernel-token-driver
  size_min: 512
  size_max: 500000000
  desc: Mimikatz kernel driver exposes process token controls
  crit: notable
  conf: 0.99
  attack: "T1134,T1055"
  mbc: "E1055,E1134"
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: mimidrv-driver-identity
  - id: micro-behaviors/os/kernel/device::create-device-object
  - id: micro-behaviors/os/kernel/device::create-device-symbolic-link
  - id: micro-behaviors/process/attach/address-space::lookup-process-by-id
- id: mimikatz-auth-provider-exports
  desc: Mimikatz DLL exports logon-provider interfaces
  crit: notable
  conf: 0.98
  attack: T1556.002
  all:
  - id: well-known/tool/offensive/mimikatz::mimikatz-version-resource-identity
  - id: micro-behaviors/os/security/auth/provider::multi-interface-auth-provider-exports
