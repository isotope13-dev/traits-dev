defaults:
  platforms:
  - linux
  - unix
  - windows
  - macos
  - ios
  - android
  size_max: 5000000
traits:
- id: sekurlsa-logonpasswords-lower
  size_min: 512
  size_max: 500000000
  desc: sekurlsa::logonpasswords command (lowercase)
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    substr: sekurlsa::logonpasswords
    section: ".rdata"
- id: sekurlsa-logonpasswords-mixed
  size_min: 512
  size_max: 500000000
  desc: Sekurlsa::LogonPasswords command (mixed case)
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    regex: "(?i)sekurlsa::logonpasswords"
    section: ".rdata"
- id: mimikatz-error
  size_min: 512
  size_max: 500000000
  desc: ERROR kuhl Mimikatz error signature
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: ERROR kuhl
    section: ".rdata"
- id: mimikatz-process-string
  size_min: 512
  size_max: 500000000
  desc: mimikatz.exe process string
  crit: notable
  conf: 0.95
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    substr: mimikatz
    section: ".rdata"
- id: mimikatz-command-script
  desc: Mimikatz credential dump command
  crit: notable
  conf: 0.97
  size_min: 0
  platforms:
  - windows
  for:
  - c
  - cpp
  - batch
  - python
  - javascript
  - powershell
  if:
    type: text
    regex: '(?i)\b(sekurlsa::(logonpasswords|minidump)|mimikatz(\.exe)?)\b'
  unless:
    - id: metadata/file/profile/identity::generated-attack-map-context
    - id: metadata/package/quality/integrity::debian-md5sums-manifest
- id: gentilkiwi-author
  size_min: 512
  size_max: 500000000
  desc: Benjamin Delpy (gentilkiwi) author signature
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: gentilkiwi|Benjamin Delpy
    section: ".rdata"
- id: mimidrv-driver-identity
  size_min: 512
  size_max: 500000000
  desc: Mimikatz kernel driver device identity
  crit: notable
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: '\Device\mimidrv'
    section: ".rdata"
- id: mimilove-identity
  size_min: 512
  size_max: 500000000
  desc: Mimilove credential-memory companion identity
  crit: notable
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: mimilove
    section: ".rdata"
- id: mimikatz-version-resource-identity
  size_min: 512
  size_max: 500000000
  desc: Mimikatz PE version-resource identity
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: '(?i)\bmimi(spool|lib|love)(\.dll|\.exe)?\s+\(mimikatz\)'
    section: ".rsrc"
composite_rules:
- id: sekurlsa-logonpasswords
  size_min: 512
  size_max: 500000000
  desc: Sekurlsa logonpasswords command (case variants)
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  any:
  - id: sekurlsa-logonpasswords-lower
  - id: sekurlsa-logonpasswords-mixed
- id: mimikatz
  size_min: 512
  size_max: 500000000
  desc: Mimikatz credential extraction tool
  crit: suspicious
  conf: 0.99
  attack: T1003.001
  mbc: E1003
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - python
  - javascript
  - powershell
  unless:
  - id: metadata/file/format/markup::definition
  any:
  - id: sekurlsa-logonpasswords
  - id: mimikatz-error
  - id: mimikatz-process-string
  - id: gentilkiwi-author
  - id: mimikatz-version-resource-identity
  - id: mimikatz-command-script
- id: mimikatz-kernel-token-driver
  size_min: 512
  size_max: 500000000
  desc: Mimikatz kernel driver exposes process token controls
  crit: hostile
  conf: 0.99
  attack: "T1134,T1055"
  mbc: "E1055,E1134"
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: mimidrv-driver-identity
  - id: micro-behaviors/os/kernel/device::create-device-object
  - id: micro-behaviors/os/kernel/device::create-device-symbolic-link
  - id: micro-behaviors/process/attach/address-space::lookup-process-by-id
- id: mimikatz-auth-provider-credential-capture
  desc: Mimikatz DLL intercepts logon credential interfaces
  crit: hostile
  conf: 0.98
  attack: T1556.002
  all:
  - id: well-known/tool/offensive/mimikatz::mimikatz-version-resource-identity
  - id: objectives/credential-access/theft/auth-provider::multi-interface-credential-provider-dll
