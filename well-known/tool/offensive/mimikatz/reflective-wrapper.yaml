# Compound identity of the operational Mimikatz DCSync wrapper.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.99
  attack: T1003.006

traits:
  - id: dcsync-ntlm-output-parser
    desc: Parses Mimikatz DCSync NTLM hash output
    crit: notable
    if:
      type: literal
      exact: 'Hash NTLM: (.+)'

composite_rules:
  - id: reflective-dcsync-wrapper
    desc: Mimikatz reflective DCSync wrapper
    all:
      - id: well-known/tool/offensive/mimikatz::dcsync-user-command-literal
      - id: micro-behaviors/dylib/load/runtime::powershell-memory-library-loader-call
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text

  - id: dcsync-native-hash-extraction-wrapper
    desc: Mimikatz wrapper invokes DCSync and parses NTLM hashes
    all:
      - id: well-known/tool/offensive/mimikatz::dcsync-user-command-literal
      - id: dcsync-ntlm-output-parser
      - id: micro-behaviors/data/control-flow/dispatch::powershell-command-pointer-invocation
      - id: micro-behaviors/dylib/load/runtime::powershell-memory-library-loader-call
