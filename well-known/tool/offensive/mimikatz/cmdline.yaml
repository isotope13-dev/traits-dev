# Mimikatz command-line invocations and rundll32 carriers.
# Captures the cmdline pattern even when the DLL is renamed.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  size_min: 256
  size_max: 500000000
traits:
  - id: lsadump-sam
    attack: T1003.002
    mbc: E1003
    desc: Mimikatz lsadump::sam command
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(lsadump::sam|kuhl_m_lsadump_sam)'
  - id: lsadump-secrets
    attack: T1003.004
    mbc: E1003
    desc: Mimikatz lsadump::secrets command
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'lsadump::secrets'
      case_insensitive: true
  - id: lsadump-dcsync
    attack: T1003.006
    mbc: E1003
    desc: Mimikatz lsadump::dcsync command
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(lsadump::dcsync|kuhl_m_lsadump_dcsync)'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/file/extension/identity::markdown-powershell-basename
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: kerberos-golden
    attack: T1558.001
    desc: Mimikatz kerberos::golden token reference
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(kerberos::golden|kuhl_m_kerberos_golden)'
  - id: kerberos-golden-invocation
    attack: T1558.001
    desc: Mimikatz ticket command with parameters
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)kerberos::golden[^\r\n]{0,240}/(user|domain|sid|krbtgt):'
  - id: privilege-debug
    attack: T1134
    desc: Mimikatz privilege::debug command
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'privilege::debug'
      case_insensitive: true
  - id: rundll32-mimikatz-cmdline
    attack: T1003
    mbc: E1003
    desc: rundll32 invoking Mimikatz command
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'rundll32(\.exe)?.{0,200}(sekurlsa::logonpasswords|lsadump::sam)'
      case_insensitive: true

  # Native diagnostic names the actual handler; command text alone cannot
  # establish the implementation, and Golden Ticket creation is not LSASS read.
  - id: golden-ticket-handler-reference
    desc: Mimikatz Golden Ticket handler reference
    crit: notable
    conf: 0.98
    for: [pe, dll]
    attack: T1558.001
    if:
      type: text
      substr: kuhl_m_kerberos_golden
      section: .rdata
composite_rules:
  - id: golden-ticket-implementation-profile
    desc: Mimikatz Golden Ticket implementation profile
    crit: notable
    conf: 0.99
    for: [pe, dll]
    attack: T1558.001
    all:
      - id: golden-ticket-handler-reference
      - id: mimikatz-error
