# BurpLoaderKeygen is an unauthorized Burp Suite license generator and Java
# agent. The atoms below describe reusable implementation markers; the
# composites require the combinations that make this a hostile tool.
defaults:
  platforms: [linux, macos, windows]
  for: [java, class, java_class, jar]

traits:
  - id: burp-loader-title
    desc: BurpLoaderKeygen application title
    crit: notable
    conf: 0.99
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      substr: Burp Suite Pro Loader & Keygen

composite_rules:
  - id: burp-loader-agent-patcher
    desc: Java agent rewrites Burp bytecode at load time
    crit: hostile
    conf: 0.99
    for: [jar]
    scope: archive
    all:
      - id: micro-behaviors/process/hook/instrumentation::java-agent-premain-entrypoint
      - id: micro-behaviors/process/hook/instrumentation::java-classfile-transformer-interface
      - id: micro-behaviors/process/hook/instrumentation::java-instrumentation-add-transformer
      - id: micro-behaviors/process/hook/instrumentation::java-asm-classreader
      - id: micro-behaviors/process/hook/instrumentation::java-asm-classwriter
      - id: burp-loader-title

  - id: burp-loader-license-forger
    desc: Java embeds a private key to forge Burp licenses
    crit: hostile
    conf: 0.99
    for: [jar]
    scope: archive
    all:
      - id: micro-behaviors/crypto/asymmetric/signature::java-signature-initsign
      - id: micro-behaviors/crypto/asymmetric/signature::java-pkcs8-private-key-spec-ref
      - id: micro-behaviors/crypto/asymmetric/signature::java-long-hex-crypto-material
      - id: burp-loader-title
