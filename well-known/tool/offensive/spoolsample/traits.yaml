defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 3000000
traits:
- id: spoolsample-entry-call
  desc: SpoolSample coercion payload entry invocation
  if:
    type: text
    regex: (?i)\[SpoolSample\.Program\]::Main\s*\(
composite_rules:
- id: powershell-coercion-payload
  desc: PowerShell loads and invokes SpoolSample authentication coercion payload
  crit: hostile
  all:
  - id: spoolsample-entry-call
  - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
