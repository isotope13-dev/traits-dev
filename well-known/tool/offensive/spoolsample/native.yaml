defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: native-notification-rpc-failure
  desc: SpoolSample notification RPC failure diagnostic
  if:
    type: text
    section: .text
    exact: RpcRemoteFindFirstPrinterChangeNotificationEx failed.
  size_min: 4096
  size_max: 10000000
- id: native-openprinter-rpc-failure
  desc: SpoolSample printer-open failure diagnostic
  if:
    type: text
    section: .text
    exact: RpcOpenPrinter failed %d
  size_min: 4096
  size_max: 10000000
composite_rules:
- id: native-coercion-payload
  desc: SpoolSample printer-RPC coercion payload
  crit: hostile
  all:
  - id: native-notification-rpc-failure
  - id: native-openprinter-rpc-failure
  - id: micro-behaviors/communications/ipc/named-pipe::spooler-rpc-pipe-endpoint
