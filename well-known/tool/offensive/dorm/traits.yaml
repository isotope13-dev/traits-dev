# DORM is a Go vulnerability scanner. Plugin sources import its models
# package and embed the probes the operator sends to a chosen target.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.97
  size_max: 5000000

traits:
  - id: dorm-plugin-import
    desc: DORM scanner plugin import
    size_min: 1
    if:
      type: text
      substr: '"DORM/models"'
