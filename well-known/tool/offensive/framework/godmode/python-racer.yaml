defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: ultraplinian-racer-marker
  desc: ULTRAPLINIAN racing engine source marker
  crit: notable
  conf: 0.98
  if:
    type: literal
    substr: ULTRAPLINIAN Multi-Model Racing Engine
- id: godmode-prompt-marker
  desc: G0DM0D3 jailbreak prompt marker
  crit: notable
  conf: 0.98
  if:
    type: literal
    substr: GODMODE:ENABLED...LOVE PLINY
- id: godmode-unfiltered-ranking
  desc: Filters race winners to non-refusal answers
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((list_comprehension body: (identifier) @value
       (for_in_clause left: (identifier) @item)
       (if_clause (boolean_operator left: (not_operator argument: (subscript
       value: (identifier) @tested subscript: (string (string_content) @key)))))) @evidence
       (#eq? @value @item) (#eq? @item @tested) (#eq? @key "is_refusal"))
composite_rules:
- id: godmode-multi-model-jailbreak-racer
  desc: G0DM0D3 jailbreak racer sends prompts and selects non-refusals
  crit: hostile
  conf: 0.98
  all:
  - id: ultraplinian-racer-marker
  - id: godmode-prompt-marker
  - id: godmode-unfiltered-ranking
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
