defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: ultraplinian-racer-marker
  desc: ULTRAPLINIAN racing engine source marker
  crit: notable
  conf: 0.98
  if:
    type: literal
    substr: ULTRAPLINIAN Multi-Model Racing Engine
- id: godmode-prompt-marker
  desc: G0DM0D3 jailbreak prompt marker
  crit: notable
  conf: 0.98
  if:
    type: literal
    substr: GODMODE:ENABLED...LOVE PLINY
composite_rules:
- id: godmode-multi-model-jailbreak-racer
  desc: G0DM0D3 racing source filters refusal-marked answers
  crit: hostile
  conf: 0.98
  all:
  - id: ultraplinian-racer-marker
  - id: godmode-prompt-marker
  - id: micro-behaviors/data/llm/decision::python-non-refusal-comprehension
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
  # First-party opt-in red-teaming skill shipped inside the Hermes Agent
  # distribution; the skill still identifies itself at member level.  Only
  # package-level identity qualifies: a lone ~/.hermes path in the script is
  # something a copycat can quote.
  downgrade:
    scope: archive
    any:
    - id: well-known/app/ai/coding-agent/hermes-agent::hermes-agent-package
