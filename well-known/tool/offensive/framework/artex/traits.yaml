# Attribution observations from S-RM, November 2026. These are references to
# an offensive framework, not proof of compromise or autonomous operation.
# Placeholder mail domains and generic i<number> names are not identities.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, text, html]
  crit: notable
  conf: 0.95

traits:
  - id: task-artifact-path
    desc: Artex task and intent artifact path reference
    if:
      type: text
      regex: '/opt/artex/data/tasks?/[0-9]+/i[0-9]+/'

  - id: disposable-test-branch
    desc: Artex disposable test branch name reference
    if:
      type: text
      regex: '\bartex-wtest-[0-9]+\b'

  - id: norma-sdk-user-agent
    desc: Reported Artex web-fetch SDK user-agent token
    conf: 0.8
    if:
      type: text
      regex: '\bnorma/0\.4([^\w./-]|$)'

  - id: dl-status-size-writeout
    desc: Artex curl status and size write-out
    conf: 0.92
    if:
      type: text
      substr: 'dl=%{http_code}/%{size_download}'
