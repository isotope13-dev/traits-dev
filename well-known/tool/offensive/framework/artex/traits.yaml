# Attribution observations from S-RM, November 2026, plus source identity.
# Attribution strings alone do not prove compromise or autonomous operation.
# Placeholder mail domains and generic i<number> names are not identities.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, text, html]
  crit: notable
  conf: 0.95

traits:
  - id: cloudtrail-user-agent
    desc: Reported ARTEX CloudTrail user agent
    for: [json]
    ref: https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
    if:
      type: value
      path: Records[*].userAgent
      regex: '^artex-(agent|judge-r[0-9]+|verify)$'

  - id: task-artifact-path
    desc: Artex task and intent artifact path reference
    if:
      type: text
      regex: '/opt/artex/data/tasks?/[0-9]+/i[0-9]+/'

  - id: disposable-test-branch
    desc: Artex disposable test branch name reference
    if:
      type: text
      regex: '\bartex-wtest-[0-9]+\b'

  - id: norma-sdk-user-agent
    desc: Reported Artex web-fetch SDK user-agent token
    conf: 0.8
    if:
      type: text
      regex: '\bnorma/0\.4([^\w./-]|$)'

  - id: dl-status-size-writeout
    desc: Artex curl status and size write-out
    conf: 0.92
    if:
      type: text
      substr: 'dl=%{http_code}/%{size_download}'

  - id: programdata-artx5v-path
    desc: Artex ProgramData artx5v directory
    size_max: 10485760
    if:
      type: text
      regex: '(?i)ProgramData[\\/]+artx5v([\\/]|["''\s]|$)'

  - id: art18-command-comment
    desc: Artex art18 command comment prefix
    size_max: 10485760
    for: [scripts, source, json]
    if:
      type: text
      regex: '(?i)["'']art18-[a-z0-9_-]{2,48}["'']'

  - id: artx-cloud-role-prefix
    desc: Artex artx cloud IAM role prefix
    size_max: 10485760
    for: [scripts, source, json]
    if:
      type: text
      regex: '(?i)(security-credentials/|role/|\brole\w*\s*[:=]\s*["''])artx-[a-z0-9_-]{2,48}'

  - id: operator-human-directive-tag
    desc: Artex Chinese operator directive tag
    conf: 0.92
    size_max: 10485760
    if:
      type: text
      substr: '【人类指令】'

  - id: go-module-artex-binary
    desc: Compiled Artex Go server module path
    for: [elf]
    conf: 0.95
    size_min: 1048576
    size_max: 134217728
    if:
      type: text
      substr: 'github.com/Autumn-27/artex/'
      section: .gopclntab

  # Source identity must survive changed checkout paths and payload filenames.
  # Importing ARTEX alone also occurs in integrations, so it is not hostile.
  - id: go-module-source-import
    desc: Imports an ARTEX Go framework module
    for: [go]
    if:
      type: symbol
      kind: import
      regex: '^github\.com/Autumn-27/artex/'

  # Worker identity and the exploitation role are independently notable;
  # the hostile source finding still requires a framework import as well.
  - id: worker-chat-marker
    desc: ARTEX worker conversation marker literal
    for: [go]
    crit: notable
    if:
      type: literal
      substr: '<!-- ARTEX_WORKER_CHAT:'

  - id: worker-pentest-prompt
    desc: ARTEX exploitation worker prompt literal
    for: [go]
    crit: notable
    if:
      type: literal
      substr: '你是一个网络安全平台授权渗透测试系统的"执行者"(work agent)'

composite_rules:
  # This identifies a dual-use offensive framework, not a particular intrusion.
  # Both source anchors are stable across payloads and operator objectives.
  - id: go-offensive-worker-source
    desc: ARTEX autonomous penetration-testing worker source
    for: [go]
    crit: suspicious
    conf: 0.99
    all:
      - id: go-module-source-import
    any:
      - id: worker-chat-marker
      - id: worker-pentest-prompt
