# Attribution observations from S-RM, November 2026. These are references to
# an offensive framework, not proof of compromise or autonomous operation.
# Placeholder mail domains and generic i<number> names are not identities.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, text, html]
  crit: notable
  conf: 0.95

traits:
  - id: task-artifact-path
    desc: Artex task and intent artifact path reference
    if:
      type: text
      regex: '/opt/artex/data/tasks?/[0-9]+/i[0-9]+/'

  - id: disposable-test-branch
    desc: Artex disposable test branch name reference
    if:
      type: text
      regex: '\bartex-wtest-[0-9]+\b'

  - id: norma-sdk-user-agent
    desc: Reported Artex web-fetch SDK user-agent token
    conf: 0.8
    if:
      type: text
      regex: '\bnorma/0\.4([^\w./-]|$)'

  - id: dl-status-size-writeout
    desc: Artex curl status and size write-out
    conf: 0.92
    if:
      type: text
      substr: 'dl=%{http_code}/%{size_download}'

  - id: programdata-artx5v-path
    desc: Artex ProgramData artx5v directory
    size_max: 10485760
    if:
      type: text
      regex: '(?i)ProgramData[\\/]+artx5v([\\/]|["''\s]|$)'

  - id: art18-command-comment
    desc: Artex art18 command comment prefix
    size_max: 10485760
    for: [scripts, source, json]
    if:
      type: text
      regex: '(?i)["'']art18-[a-z0-9_-]{2,48}["'']'

  - id: artx-cloud-role-prefix
    desc: Artex artx cloud IAM role prefix
    size_max: 10485760
    for: [scripts, source, json]
    if:
      type: text
      regex: '(?i)(security-credentials/|role/|\brole\w*\s*[:=]\s*["''])artx-[a-z0-9_-]{2,48}'

  - id: operator-human-directive-tag
    desc: Artex Chinese operator directive tag
    conf: 0.92
    size_max: 10485760
    if:
      type: text
      substr: '【人类指令】'
