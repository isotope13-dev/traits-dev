# Antares (github.com/enowdev/antares) — autonomous offensive agent with a
# TUI, gateway, browser and social-account automation, and an embedded
# post-exploitation module set (keylogger, LSASS dump, TCC bypass, container
# escape). The module names below are embedded as payload manifests in the
# agent binary, so they hold in the shipped executable and its copies.
defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho, go]
  attack: T1056.001
  crit: notable
  conf: 0.95

traits:
  - id: antares-internal-package
    desc: Antares agent internal Go package path
    conf: 0.98
    if:
      type: text
      substr: 'github.com/enowdev/antares/internal/'

  - id: antares-keylog-module
    desc: Antares keylogger payload module name
    if:
      type: text
      substr: keylog_win

  - id: antares-lsass-dump-module
    desc: Antares LSASS credential dump module name
    attack: T1003.001
    if:
      type: text
      substr: lsass_dump

  - id: antares-tcc-bypass-module
    desc: Antares macOS TCC bypass module name
    attack: T1562.001
    if:
      type: text
      substr: tcc_bypass

  - id: antares-k8s-escape-module
    desc: Antares container escape module name
    attack: T1611
    if:
      type: text
      substr: k8s_escape

composite_rules:
  # The shipped agent embeds several post-exploitation payload modules. Two
  # distinct module names establish the toolkit; one name alone can appear in
  # security research text.
  - id: antares-red-team-module-set
    desc: Embedded post-exploitation module set in offensive agent
    crit: hostile
    conf: 0.97
    scope: file
    needs: 2
    any:
      - id: antares-keylog-module
      - id: antares-lsass-dump-module
      - id: antares-tcc-bypass-module
      - id: antares-k8s-escape-module
