defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: dploot-dpapi-smb-import
  desc: Imports DPLoot SMB or DPAPI internals
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: import
    regex: ^dploot\.lib\.(dpapi|smb)$
composite_rules:
- id: dploot-browser-credential-collector
  desc: DPLoot browser credential collector implementation
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/browser/chromium::python-chrome-dpapi-credential-recovery
  - id: dploot-dpapi-smb-import
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
