defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: dploot-dpapi-smb-import
  desc: Imports DPLoot SMB or DPAPI internals
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: import
    regex: ^dploot\.lib\.(dpapi|smb)$
- id: dploot-triage-import
  desc: Imports a DPLoot secret triage module
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: import
    regex: ^dploot\.triage\.[a-z_]{3,24}$
composite_rules:
- id: dploot-remote-dpapi-secret-triage
  desc: DPLoot triages DPAPI-protected secrets over an SMB connection
  crit: hostile
  conf: 0.97
  attack: T1555
  all:
  - id: dploot-dpapi-smb-import
  - id: dploot-triage-import
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
- id: dploot-browser-credential-collector
  desc: DPLoot browser credential collector implementation
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/browser/chromium::python-chrome-dpapi-credential-recovery
  - id: dploot-dpapi-smb-import
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
