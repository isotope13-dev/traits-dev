defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-socialfish-install
  desc: Shell clones SocialFish phishing toolkit
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: git\s+clone\s+https://github\.com/UndeadSec/SocialFish
- id: python-socialfish-launch
  desc: Shell launches SocialFish phishing toolkit
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: python3?\s+SocialFish\.py\s+root\s+pass
