# ADhammer is an openly identified Active Directory assessment and red-team
# toolkit. It intentionally includes DCSync, relay, ticket-forging, poisoning,
# secretsdump, and remote-execution modules; this identity attributes those
# expected offensive capabilities without treating the tool itself as malware.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, crate, rust, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ADhammer Cargo package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: adhammer

  - id: repository-marker
    desc: ADhammer source repository marker
    for: [cargo.toml, rust, text]
    if:
      type: text
      substr: github.com/icedracon/adhammer

composite_rules:
  - id: adhammer-tool
    desc: ADhammer Active Directory security assessment toolkit
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: repository-marker
