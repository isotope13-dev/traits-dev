# ADhammer is an openly identified Active Directory assessment and red-team
# toolkit. It intentionally includes DCSync, relay, ticket-forging, poisoning,
# secretsdump, and remote-execution modules; this identity attributes those
# expected offensive capabilities without treating the tool itself as malware.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, crate, rust, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ADhammer Cargo package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^adhammer'

  - id: crate-name
    desc: ADhammer crate metadata identity
    for: [crate]
    if:
      type: value
      path: crate.name
      regex: '^adhammer'

  - id: repository-marker
    desc: ADhammer source repository marker
    for: [cargo.toml, rust, text]
    if:
      type: text
      substr: github.com/icedracon/adhammer

  # These are stable public APIs for the security-assessment capabilities in
  # this crate.  They identify the tool's behavior without treating a
  # transparent, operator-driven library as malware.
  - id: asrep-roasting-api
    desc: ADhammer AS-REP roasting API
    for: [rust]
    if:
      type: text
      regex: '\bpub async fn asrep_roast\b'

  - id: kerberoasting-api
    desc: ADhammer Kerberoasting service-ticket API
    for: [rust]
    if:
      type: text
      regex: '\bpub async fn roast_spn\b'

  - id: shadow-credentials-api
    desc: ADhammer Shadow Credentials builder
    for: [rust]
    if:
      type: text
      regex: '\bpub fn build_key_credential\b'

  - id: golden-ticket-forging-api
    desc: ADhammer Golden Ticket forging API
    for: [rust]
    if:
      type: text
      regex: '\bpub fn forge_golden_tgt\b'

  - id: silver-ticket-forging-api
    desc: ADhammer Silver Ticket forging API
    for: [rust]
    if:
      type: text
      regex: '\bpub fn forge_silver_tgt\b'

composite_rules:
  - id: adhammer-tool
    desc: ADhammer Active Directory security assessment toolkit
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: crate-name
      - id: repository-marker

  - id: adhammer-kerberos-library
    desc: ADhammer Kerberos assessment library crate
    crit: notable
    conf: 0.99
    for: [crate]
    scope: outer
    all:
      - id: repository-marker
    any:
      - id: crate-name
      - id: package-name
      - id: kerberoasting-api
      - id: asrep-roasting-api
