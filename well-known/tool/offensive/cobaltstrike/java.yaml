defaults:
  platforms: [windows, unix]
  for: [jar, zip]
traits:
  - id: cobalt-aggressor-client-entry
    desc: Archive contains Aggressor client class
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      exact: aggressor/Aggressor.class
  - id: cobalt-beacon-controller-entry
    desc: Archive contains Beacon controller class
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      exact: beacon/BeaconC2.class
  - id: cobalt-listener-config-entry
    desc: Archive contains listener configuration class
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      exact: common/ListenerConfig.class
  - id: cobalt-artifact-bridge-entry
    desc: Archive contains Aggressor artifact bridge
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      exact: aggressor/bridges/ArtifactBridge.class
composite_rules:
  - id: aggressor-beacon-client-archive
    desc: Cobalt Strike Java Aggressor and Beacon client
    crit: hostile
    conf: 0.99
    all:
      - id: cobalt-aggressor-client-entry
      - id: cobalt-beacon-controller-entry
      - id: cobalt-listener-config-entry
      - id: cobalt-artifact-bridge-entry
