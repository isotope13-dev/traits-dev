defaults:
  platforms: [windows, unix]
  for: [jar, zip]
traits:
  - id: aggressor-beacon-client-archive
    desc: Cobalt Strike Java Aggressor and Beacon client
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule cobaltstrike_java_client_archive {
          strings:
            $aggressor = "aggressor/Aggressor.class" ascii
            $beacon = "beacon/BeaconC2.class" ascii
            $listener = "common/ListenerConfig.class" ascii
            $artifact = "aggressor/bridges/ArtifactBridge.class" ascii
          condition:
            all of them
        }
