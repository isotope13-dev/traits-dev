# pyWhisker is a Shadow Credentials attack tool. Its name, the
# msDS-KeyCredentialLink attribute it writes, and its operation set
# ({add,spray,remove,...}) are the evidence. Each leg alone is common in
# security writing. The composite requires all three together, so a
# write-capable attack tool is identified rather than a mention of the attribute.
defaults:
  for: [html, python, text, markdown]
  platforms: [unix, windows]
traits:
  - id: pywhisker-name
    desc: pyWhisker tool name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bpywhisker\b'

  - id: key-credential-link-attribute
    desc: msDS-KeyCredentialLink attribute reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)msDS-KeyCredentialLink'

  - id: pywhisker-action-set
    desc: pyWhisker add, spray, and remove action set
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '{list,add,spray,remove,clear,info,export,import}'

composite_rules:
  - id: pywhisker-shadow-credentials
    desc: pyWhisker Shadow Credentials attack tool
    crit: hostile
    conf: 0.95
    all:
      - id: pywhisker-name
      - id: key-credential-link-attribute
      - id: pywhisker-action-set
