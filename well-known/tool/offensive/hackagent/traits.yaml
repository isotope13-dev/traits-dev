# HackAgent — open-source AI agent security testing & red-team toolkit
# (github.com/AISecurityLab/hackagent, PyPI `hackagent`).
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, whl, pkginfo, pyproject.toml]
  crit: notable
  conf: 0.95

traits:
  - id: package-tree-member
    desc: HackAgent package tree member
    conf: 0.99
    if:
      type: path
      regex: '(?i)(^|[\\/])hackagent([\\/]|-[0-9])'

  - id: release-archive-member
    desc: HackAgent release archive member
    conf: 0.99
    if:
      type: path
      regex: '(?i)(^|[^\w-])hackagent-[0-9][0-9a-z._-]*\.(tgz|zip|tar|whl)'

  - id: framework-import
    desc: Imports the HackAgent framework package
    conf: 0.85
    for: [python]
    if:
      type: import
      regex: '^(from|import)[^A-Za-z0-9_]+hackagent(\.|$)'

  - id: pkg-name
    desc: HackAgent package name metadata
    conf: 0.9
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: name
      exact: hackagent

  - id: pkg-summary
    desc: HackAgent security toolkit package summary
    conf: 0.95
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: summary
      substr: 'security toolkit to detect vulnerabilities of your AI Agents'

composite_rules:
  - id: hackagent-toolkit
    desc: HackAgent AI agent security testing toolkit
    conf: 0.95
    any:
      - id: package-tree-member
      - id: release-archive-member
      - id: framework-import
      - id: pkg-name
