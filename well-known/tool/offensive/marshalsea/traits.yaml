# marshalsea — Ruby object-deserialization security lab (Carter Perez /
# CarterPerez-dev/Cybersecurity-Projects). Parses Marshal/YAML without loading,
# discovers gadget sinks by reflection, ships boundary detection and runtime
# guards, and demonstrates CVE-2026-41316 ERB chains. Dual-use offensive
# security education; gadget-chain source and File.write canary templates are
# expected teaching artifacts, not trojan behavior.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: gem-package-name
    desc: marshalsea RubyGems package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: marshalsea

  - id: module-declaration
    desc: Marshalsea Ruby module declaration
    for: [ruby]
    if:
      type: text
      regex: '(?m)^module Marshalsea\b'

  - id: source-code-uri
    desc: Marshalsea deserialization gadget lab repository
    for: [ruby, markdown, text]
    if:
      type: text
      substr: deserialization-gadget-lab

  - id: boundary-detector-class
    desc: Marshalsea Marshal boundary detector class
    for: [ruby]
    if:
      type: text
      regex: '\bclass BoundaryDetector\b'

  - id: load-guard-class
    desc: Marshalsea Marshal load guard class
    for: [ruby]
    if:
      type: text
      regex: '\bclass LoadGuard\b'

composite_rules:
  - id: marshalsea-security-lab
    desc: Marshalsea Ruby deserialization security lab
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: gem-package-name
    any:
      - id: module-declaration
      - id: source-code-uri
      - id: boundary-detector-class
      - id: load-guard-class
