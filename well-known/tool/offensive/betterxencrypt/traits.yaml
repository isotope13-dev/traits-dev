defaults:
  platforms: [windows]
  for: [powershell]
  conf: 0.98

traits:
  - id: invoke-betterxencrypt-function
    desc: Invoke-BetterXencrypt function
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-BetterXencrypt\b'

  - id: betterxencrypt-crypter-banner
    desc: BetterXencrypt crypter banner
    crit: notable
    if:
      type: text
      regex: '(?i)Your Lovely FUD Powershell Crypter|github\.com/GetRektBoy724/BetterXencrypt'

  - id: betterxencrypt-help-example
    desc: BetterXencrypt Mimikatz example
    crit: notable
    if:
      type: text
      regex: '(?i)Invoke-BetterXencrypt\s+-.{0,50}Invoke-Mimikatz'

composite_rules:
  - id: betterxencrypt-framework
    desc: BetterXencrypt offensive PowerShell crypter
    crit: hostile
    conf: 0.99
    attack: "T1027.002,T1562.001"
    all:
      - id: invoke-betterxencrypt-function
    any:
      - id: betterxencrypt-crypter-banner
      - id: betterxencrypt-help-example
