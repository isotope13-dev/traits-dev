# PowerShell Empire agent receive-loop markers. The deployed agent.ps1
# establishes its entrypoint as `function Invoke-Empire`; its
# Process-TaskingPackets routine decrypts staged tasking with the session key
# (`Decrypt-Bytes -Key $Script:SessionKey`) and fans results out through
# `Process-Tasking`. A module that merely reuses the packet helpers without
# the entrypoint is not the agent receive loop.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
- id: powershell-agent-entrypoint
  desc: Empire agent entrypoint function
  if:
    type: text
    regex: '(?im)^\s*function\s+Invoke-Empire\b'
- id: powershell-agent-task-dispatch
  desc: Empire agent task-dispatch call
  if:
    type: text
    substr: Process-Tasking
- id: powershell-agent-session-decrypt
  desc: Empire agent session-key decryption call
  if:
    type: text
    regex: 'Decrypt-Bytes\s+-Key\s+\$Script:SessionKey'
