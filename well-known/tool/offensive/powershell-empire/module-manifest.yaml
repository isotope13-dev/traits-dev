# Empire (BC-Security) module definitions: YAML that wraps a post-exploitation
# script for an agent, declaring the ATT&CK techniques it implements, whether
# it needs admin rights and whether the operator may consider it "opsec safe".
defaults:
  platforms: [windows, linux, macos]
  for: [yaml]
  size_max: 2097152
  attack: T1588.002

traits:
  - id: module-needs-admin-flag
    desc: Module manifest declares needs_admin
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^needs_admin:\s*(true|false)\s*$'

  - id: module-opsec-safe-flag
    desc: Module manifest declares opsec_safe
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^opsec_safe:\s*(true|false)\s*$'

  - id: module-attack-technique-list
    desc: Module manifest lists ATT&CK techniques
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^(techniques:\s*\[\s*T1\d{3}|tactics:\s*\[\s*TA00\d\d)'

  - id: module-agent-option
    desc: Module manifest takes a target agent
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s+- name: Agent\s*\n\s+description: Agent to (run|execute)'

composite_rules:
  - id: empire-post-exploitation-module-manifest
    desc: Empire post-exploitation module definition
    crit: suspicious
    conf: 0.92
    all:
      - id: module-opsec-safe-flag
      - id: module-needs-admin-flag
      - id: module-agent-option
    any:
      - id: module-attack-technique-list
