  - id: empire-python-c2-role-a
    desc: Empire server startup role
    crit: suspicious
    conf: 0.97
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      substr: Starting Empire
    unless:
      # The framework's own unit tests assert on these role strings
      # (AgentTaskStatus fixtures); test content is not a deployed agent.
      - id: metadata/package/testing/presence/harness::pytest-module

  - id: empire-python-c2-role-b
