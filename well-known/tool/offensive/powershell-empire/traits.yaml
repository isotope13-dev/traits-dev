composite_rules:
  - id: empire-offensive-powershell-module
    desc: PowerShell Empire deployable offensive module
    crit: suspicious
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    any:
      - id: credential-module-functions
      - id: mimikatz-module-function
      - id: credential-abuse-module-functions
      - id: input-capture-module-functions
      - id: uac-bypass-module-functions
      - id: elevation-module-functions
      - id: injection-module-functions
      - id: lateral-module-functions
      - id: c2-module-functions
      - id: browser-credential-module-functions
      - id: extra-privesc-module-functions-a
      - id: extra-privesc-module-functions-b
      - id: extra-privesc-module-functions-c
      - id: ms16-032-exploit-function
      - id: extra-privesc-module-functions-d
      - id: extra-exec-module-functions
      - id: extra-exec-module-functions-b
      - id: sysvol-gpp-password-function
      - id: ms16-135-exploit-function
      - id: ridhijack-module-function
      - id: extra-collection-module-functions-a
      - id: extra-collection-module-functions-b
      - id: extra-exploit-module-functions-a
      - id: extra-exploit-module-functions-b
      - id: extra-persist-module-functions-a
      - id: extra-persist-module-functions-b
      - id: sitelist-password-function
      - id: powerup-service-abuse-functions
      - id: dumpcredstore-function

  - id: empire-powershell-operational-behavior
    desc: Empire module with system action
    crit: hostile
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    all:
      - id: empire-offensive-powershell-module
    any:
      - id: micro-behaviors/communications/
      - id: micro-behaviors/os/network/tunnel::dev-tun
      - id: micro-behaviors/os/network/tunnel::dev-net-tun
      - id: micro-behaviors/os/network/tunnel::dev-tap
      - id: micro-behaviors/os/network/tunnel::tunsetiff-ioctl
      - id: micro-behaviors/os/network/tunnel::tun
      - id: micro-behaviors/os/network/tunnel::wintun-create-adapter
      - id: micro-behaviors/os/network/tunnel::wintun-dll-reference
      - id: micro-behaviors/os/network/tunnel::tap0901-adapter-reference
      - id: micro-behaviors/os/network/tunnel::windows-virtual-tunnel-adapter
      - id: micro-behaviors/crypto/
      - id: micro-behaviors/fs/
      - id: micro-behaviors/mem/
      - id: micro-behaviors/os/registry/
      - id: micro-behaviors/process/create/
      - id: micro-behaviors/process/interpreter/
      - id: micro-behaviors/data/encode/
    needs: 1
    unless:
      - id: well-known/tool/offensive/powershellrunner::empire-powershellrunner-execution
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-reflective-shellcode-loader
      - id: micro-behaviors/process/interpreter/reflection/runtime::reflective-dotnet-loader

  # Modules that already carry a reflective shellcode loader skip the
  # generic operational-behavior composite above. This pairs the Empire
  # module identity with that loader so those files still have a second
  # hostile in the family directory.
  - id: empire-reflective-module-payload
    desc: Empire module ships a reflective loader
    crit: hostile
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    all:
      - id: empire-offensive-powershell-module
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-reflective-shellcode-loader
    unless:
      - id: well-known/tool/offensive/powershellrunner::empire-powershellrunner-execution
      # Scripts whose content is mostly an encoded body do not need a third
      # family roll-up in addition to the loader traits.
      - id: metadata/file/encoded::powershell-base64-dominated-body

  # Python stager generators carry the listener/stager role text and emit a
  # launcher that phones home: a hidden PowerShell cradle, an HTA/mshta
  # command, a macro, a JAR/WAR, or HID-script bytes. The role text plus
  # launcher mechanics convicts the generator, not the emitted payload.
  - id: empire-stager-payload-generator
    desc: Empire stager builds network-delivered launcher
    crit: hostile
    conf: 0.97
    for: [python]
    platforms: [unix, windows]
    all:
      - id: empire-python-c2-role-b
    any:
      - id: micro-behaviors/process/create/
      - id: micro-behaviors/process/interpreter/
      - id: micro-behaviors/communications/http/
    needs: 1
    unless:
      - id: metadata/package/testing/presence/harness::pytest-module

  - id: empire-hashdump-module
    desc: Empire module dumps SAM hashes from LSA keys
    crit: hostile
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    all:
      - id: credential-module-functions
      - id: micro-behaviors/os/registry/keys::lsa-control-key-path

  - id: empire-credstore-dump-module
    desc: Empire dumps the Windows credential store
    crit: hostile
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    all:
      - id: dumpcredstore-function
    any:
      - id: micro-behaviors/os/registry/
      - id: objectives/credential-access/credential-manager/
      - id: micro-behaviors/crypto/
      - id: micro-behaviors/fs/
    needs: 1

  - id: empire-shellcode-exec-module
    desc: Empire module stages or injects shellcode
    crit: hostile
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    all:
      - id: extra-exec-module-functions
    any:
      - id: micro-behaviors/mem/
      - id: objectives/evasion/process/injection/
    needs: 1

  - id: empire-powerup-service-abuse
    desc: Empire PowerUp service abuse helpers
    crit: hostile
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    all:
      - id: powerup-service-abuse-functions
    any:
      - id: micro-behaviors/os/registry/
      - id: micro-behaviors/process/create/
      - id: micro-behaviors/fs/
    needs: 1

  - id: empire-app-exploit-module
    desc: Empire application exploit module
    crit: hostile
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    all:
      - id: extra-exploit-module-functions-a
    any:
      - id: micro-behaviors/communications/
      - id: micro-behaviors/os/network/tunnel::dev-tun
      - id: micro-behaviors/os/network/tunnel::dev-net-tun
      - id: micro-behaviors/os/network/tunnel::dev-tap
      - id: micro-behaviors/os/network/tunnel::tunsetiff-ioctl
      - id: micro-behaviors/os/network/tunnel::tun
      - id: micro-behaviors/os/network/tunnel::wintun-create-adapter
      - id: micro-behaviors/os/network/tunnel::wintun-dll-reference
      - id: micro-behaviors/os/network/tunnel::tap0901-adapter-reference
      - id: micro-behaviors/os/network/tunnel::windows-virtual-tunnel-adapter
    needs: 1

  - id: empire-psransom-module
    desc: Empire ransomware and exfil module
    crit: hostile
    conf: 0.995
    for: [powershell]
    platforms: [windows]
    all:
      - id: psransom-encryption-function
      - id: psransom-exfiltration-function

  - id: empire-psransom-file-operations
    desc: PowerShell Empire ransomware file operations
    crit: hostile
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    all:
      - id: empire-psransom-module
    any:
      - id: micro-behaviors/crypto/
      - id: micro-behaviors/fs/
    needs: 1

  # A server module that imports the Empire package AND handles agent
  # staging keys and agent sessions participates in the agent protocol.
  # Serialization, routing, and ORM layers carry the import (and echo role
  # text in option descriptions) without ever handling a session, so the
  # role-text legs alone must not convict.
  - id: empire-agent-session-handler
    desc: Empire server handles agent staging sessions
    crit: hostile
    conf: 0.99
    for: [python]
    platforms: [unix, windows]
    all:
      - id: empire-routing-handler-symbol
      - id: metadata/file/literal::staging-key-identifier-reference
      - id: metadata/file/literal::session-identifier-reference
    any:
      - id: micro-behaviors/communications/
      - id: micro-behaviors/crypto/
      - id: micro-behaviors/process/create/
    needs: 1
    unless:
      - id: metadata/package/testing/presence/harness::pytest-module

  - id: empire-python-server-component
    desc: PowerShell Empire C2 server component
    crit: hostile
    conf: 0.995
    for: [python]
    platforms: [unix, windows]
    all:
      - id: empire-python-server-import
      - id: empire-agent-session-handler
    unless:
      - id: metadata/package/testing/presence/harness::pytest-module

  - id: empire-python-server-control-flow
    desc: Empire server network or process control
    crit: hostile
    conf: 0.98
    for: [python]
    platforms: [unix, windows]
    all:
      - id: empire-python-server-component
    any:
