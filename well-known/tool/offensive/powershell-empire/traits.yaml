defaults:
  size_min: 200
  size_max: 12000000

# Empire is a named offensive-security framework maintained for authorized
# red-team and adversary-emulation work. Its deployable agent and module code
# can implement hostile techniques, but the framework identity itself belongs
# under tool/offensive, not malware/rat.

traits:
  - id: credential-module-functions
    desc: Empire credential module functions
    crit: suspicious
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+(Invoke-(PowerDump|NTLMExtract|SessionGopher)|dumpCredStore)\b'

  - id: dumpcredstore-function
    desc: Empire Windows credential-store dump function
    crit: suspicious
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+(dumpCredStore|Enum-Creds|CredManMain)\b'

  - id: mimikatz-module-function
    desc: Empire Invoke-Mimikatz module function
    crit: suspicious
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-Mimikatz\b'

  - id: credential-abuse-module-functions
    desc: PowerShell credential abuse module functions
    crit: suspicious
    conf: 0.99
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-(DCSync|CredentialInjection|TokenManipulation)\b'

  - id: input-capture-module-functions
