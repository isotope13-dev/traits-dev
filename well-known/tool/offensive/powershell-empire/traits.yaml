  - id: empire-python-server-import
    desc: PowerShell Empire server package import
    crit: notable
    conf: 0.99
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?m)^from\s+empire\.server\.(api|common|core|utils)\b'

  - id: empire-python-c2-role-a
    desc: Empire server startup role
    crit: notable
    conf: 0.97
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      substr: Starting Empire
    unless:
      # The framework's own unit tests assert on these role strings
      # (AgentTaskStatus fixtures); test content is not a deployed agent.
      - id: metadata/package/testing/presence/harness::pytest-module

  - id: empire-python-c2-role-b
    desc: Empire listener stager role
    crit: notable
    conf: 0.97
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(Listener to generate stager|Empire listener)'
    unless:
      # Same pytest carve-out as role-a: unit tests quote these role
      # strings without deploying a listener.
      - id: metadata/package/testing/presence/harness::pytest-module

  # Stager generators hand a launcher to the stager-generation service:
  # generate_launcher / generate_exe_oneliner / generate_agent /
  # generate_jar. The call only appears where a stager builds its payload,
  # so the reference identifies a generator and anchors the launcher-options
  # composite below.
  - id: empire-stager-generator-api
    desc: Empire stager launcher-generation call
    crit: notable
    conf: 0.97
    for: [python]
    platforms: [unix, windows]
    if:
      type: symbol
      regex: '(?i)(stagers(v2)?|stagergenv2)\.generate_(launcher|exe_oneliner|jar)$'
    unless:
      - id: metadata/package/testing/presence/harness::pytest-module

  # Stager options that shape the emitted launcher: obfuscating its
  # PowerShell and prepending AMSI/ETW bypasses.
  - id: empire-launcher-obfuscation-option
    desc: Empire launcher obfuscation option
    crit: notable
    conf: 0.96
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(Obfuscate the launcher|Bypasses as a space separated list)'
    unless:
      - id: metadata/package/testing/presence/harness::pytest-module

  # C2 staging packet construction: template-based stagers (c_launcher)
  # build a routing packet for the STAGE0 shellcode request instead of
  # calling the launcher-generation service, so the generator-api atom
  # misses them. Building the staging packet is the same stager behavior
  # through the other code path.
  - id: empire-staging-routing-packet
    desc: Empire staging routing packet construction
    crit: notable
    conf: 0.96
    for: [python]
    platforms: [unix, windows]
    if:
      type: symbol
      regex: 'packets\.build_routing_packet$'
    unless:
