  - id: inveigh-module-functions
    desc: Inveigh credential capture or relay functions
    crit: suspicious
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-(Inveigh|InveighRelay)\b'

  - id: browser-credential-module-functions
    desc: Empire browser credential functions
    crit: suspicious
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Get-(ChromeDump|SharpChromium|FoxDump)\b'

  # Thin wrappers around an embedded offensive-tool payload (base64 PE/GZ
  # decoded and reflectively loaded in memory): Rubeus (Kerberos abuse),
  # Watson (missing-patch scanner),
  # SharpSecDump (hive credential dump), SharpChiselClient (tunneling), and
  # WireTap (audio surveillance). The function names are stable Empire module
  # entry points, so the atom is suspicious on its own and anchors the
  # staged-wrapper composite below.
  - id: staged-tool-wrapper-functions-a
    desc: Empire staged offensive-tool wrapper
    crit: notable
    conf: 0.97
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-Rubeus\b'

  - id: staged-tool-wrapper-functions-b
    desc: Empire staged offensive-tool wrapper
    crit: notable
    conf: 0.97
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-(SharpSecDump|WireTap)\b'

  # Empire firewall-egress prober: systematically opens TCP/UDP connections
  # across a port range to map what the firewall lets out for C2 planning.
  - id: empire-egress-probe-function
    desc: Empire egress firewall probe function
    crit: notable
    conf: 0.97
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-EgressCheck\b'

  # Empire lateral movement over SSH: drives an SSH session to run commands
  # on a remote host.
  - id: ssh-lateral-function
    desc: Empire SSH command helper function
    crit: notable
    conf: 0.97
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-SSHCommand\b'

  # Empire network scanner for exploitable web servers ("low hanging
  # fruit"): threaded probing of a host range with a URI dictionary.
  - id: find-fruit-function
    desc: Empire web-server recon scanner function
    crit: notable
    conf: 0.97
    for: [powershell]
    platforms: [windows]
    if:
      type: text
