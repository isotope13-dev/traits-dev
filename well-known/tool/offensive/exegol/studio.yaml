defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_min: 100000

traits:
  - id: killchain-save-tool-reference
    desc: Kill-chain graph save tool reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'id:"save_killchain"'
  - id: bundled-payload-corpus-reference
    desc: Bundled payload-reference corpus
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'pagesFile:"patt-pages.json"'

composite_rules:
  - id: exegol-offensive-agent-with-killchain
    desc: Offensive agent with kill-chain and corpus
    crit: hostile
    conf: 0.98
    all:
      - id: killchain-save-tool-reference
      - id: bundled-payload-corpus-reference
      - id: objectives/execution/exploit/development::offensive-agent-container-command-runner
