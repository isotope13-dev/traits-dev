defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: killchain-save-tool-reference
    desc: Kill-chain graph save tool reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'id:"save_killchain"'
  - id: bundled-payload-corpus-reference
    desc: Bundled payload-reference corpus
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'pagesFile:"patt-pages.json"'

  - id: studio-build-banner
    desc: Exegol Studio build banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '/*! Exegol Studio v'

composite_rules:
  - id: exegol-offensive-agent-with-killchain
    desc: Exegol Studio offensive container workbench
    crit: notable
    conf: 0.98
    all:
      - id: studio-build-banner
      - id: killchain-save-tool-reference
      - id: bundled-payload-corpus-reference
      - id: micro-behaviors/data/llm/tool-call::offensive-agent-container-command-runner
