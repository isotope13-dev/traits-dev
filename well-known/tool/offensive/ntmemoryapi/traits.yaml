# ntmemoryapi — Xenely PyPI process-memory library with direct NT syscalls.
defaults:
  platforms: [windows]
  for: [python, whl]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: ntmemoryapi wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ntmemoryapi

  - id: wheel-author
    desc: Xenely ntmemoryapi wheel author
    for: [whl]
    if:
      type: value
      path: whl.author
      exact: Xenely

  - id: github-profile
    desc: Xenely14 GitHub profile URL
    if:
      type: text
      substr: github.com/Xenely14

  - id: direct-syscall-wrapper-class
    desc: DirectSyscallWrapper class name identifier
    for: [python]
    if:
      type: text
      substr: class DirectSyscallWrapper

  - id: simdkmp-dll-name
    desc: simdkmp companion DLL filename
    for: [python]
    if:
      type: text
      substr: simdkmp.dll

composite_rules:
  - id: ntmemoryapi-identity
    desc: Recognized ntmemoryapi memory toolkit
    needs: 2
    any:
      - id: wheel-distribution
      - id: wheel-author
      - id: github-profile
      - id: direct-syscall-wrapper-class
      - id: simdkmp-dll-name
