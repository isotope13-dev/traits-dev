# go-appsec/toolbox (sectool): an MCP server with a built-in intercepting
# HTTP(S) proxy, request replay, crawler and out-of-band (interactsh) listener
# that lets a coding agent attack an application alongside its tester. Like
# Burp or mitmproxy it is a legitimate application-security workbench used on
# authorized targets, so its identity is a notable dual-use attribution rather
# than a verdict; hostile intent would come from objectives/ composites.
defaults:
  platforms: [linux, macos, windows]
  for: [go.mod]
  crit: notable
  attack: T1190
traits:
  - id: go-appsec-toolbox-module-path
    desc: go-appsec toolbox Go module path
    conf: 0.96
    if:
      type: text
      regex: '(?m)^module\s+github\.com/go-appsec/toolbox\s*$'
