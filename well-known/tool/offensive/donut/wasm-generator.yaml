# Statically compared against the upstream loader arrays, not a collector path.
# https://github.com/sliverarmory/wasm-donut/tree/main/donut
# This module generates native shellcode; it does not execute Windows APIs
# as Wasm imports. Preserve that distinction in all descriptions.
defaults:
  platforms: [windows, unix]
  for: [wasm]
  size_min: 16384
  size_max: 16777216
  crit: notable
  conf: 0.99
traits:
  - id: donut-generator-export
    desc: Donut shellcode-generation export
    if:
      type: value
      path: wasm.exports[*]
      exact: donut_generate
  - id: donut-x86-loader-template
    desc: Donut x86 in-memory loader template
    if:
      type: hex
      pattern: 81 EC D4 02 00 00 53 55 56 8B B4 24 E4 02 00 00 33 DB 57 8B FB 39 9E 38 02 00 00 0F 84 EA 00 00 00 FF 76 2C FF 76 28 FF B6 8C 00 00 00 FF B6 88 00 00 00 56 E8 45 28 00 00 8B F8 83 C4 14 85 FF 0F 84 C0 00 00 00 53 53 56 E8 2D 26 00 00 8B C8 B8 D7 22 40 00 2D 7B 36 40 00 03 C8 51 53 53 FF
  - id: donut-x64-loader-template
    desc: Donut x64 in-memory loader template
    if:
      type: hex
      pattern: 48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 41 56 41 57 48 81 EC 00 05 00 00 33 FF 48 8B D9 39 B9 38 02 00 00 0F 84 CE 00 00 00 4C 8B 41 28 48 8B 91 88 00 00 00 E8 34 2E 00 00 48 85 C0 0F 84 AF 00 00 00 48 21 7C 24 28 4C 8D 05 77 13 00 00 21 7C 24 20 4C 8B CB 33 D2 33 C9 FF D0 4C 8B
composite_rules:
  - id: donut-wasm-shellcode-generator
    desc: Donut Wasm shellcode generator with native loader
    crit: hostile
    attack: T1620,T1562.001
    all:
      - id: donut-generator-export
    any:
      - id: donut-x86-loader-template
      - id: donut-x64-loader-template
