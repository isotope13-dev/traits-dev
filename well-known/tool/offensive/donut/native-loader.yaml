defaults:
  for: [shellcode]
  platforms: [windows]
  crit: suspicious
  conf: 0.99

traits:
  # Identical to the x64 loader template in wasm-generator.yaml. Its payload
  # must be examined separately; the loader does not establish payload intent.
  - id: donut-x64-shellcode-loader
    desc: Donut x64 in-memory shellcode loader
    if:
      type: hex
      pattern: 48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 41 56 41 57 48 81 EC 00 05 00 00 33 FF 48 8B D9 39 B9 38 02 00 00 0F 84 CE 00 00 00 4C 8B 41 28 48 8B 91 88 00 00 00 E8 34 2E 00 00 48 85 C0 0F 84 AF 00 00 00 48 21 7C 24 28 4C 8D 05 77 13 00 00 21 7C 24 20 4C 8B CB 33 D2 33 C9 FF D0 4C 8B
  # Donut output opens with `call` over its encrypted instance; the call
  # lands on `pop rcx` and this stack-aligning stub before the loader.
  - id: donut-instance-call-prologue
    desc: Shellcode opens with call over instance
    crit: notable
    if:
      type: hex
      pattern: E8 ?? ?? 00 00 ?? ?? 00 00
      offset: 0
  - id: donut-instance-entry-stub
    desc: Donut pop-rcx x64 entry stub
    crit: notable
    if:
      type: hex
      pattern: 59 55 48 89 E5 48 83 E4 F0 48 83 EC 20 E8 05 00 00 00 48 89 EC 5D C3

composite_rules:
  - id: donut-wrapped-payload-shellcode
    desc: Donut shellcode wrapping an encrypted payload
    crit: hostile
    attack: T1620,T1055
    all:
      - id: donut-instance-call-prologue
      - id: donut-instance-entry-stub
      - id: donut-x64-shellcode-loader
