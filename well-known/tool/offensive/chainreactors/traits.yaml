# Chainreactors Tools & Aiscan
#
# Detects markers and components associated with Chainreactors security research
# and offensive tools (gogo port scanner, spray web fingerprinter, zombie
# credential tester, neutron POC engine, and the aiscan agentic scanner).
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, scripts, source, markdown, text, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: chainreactors-aiscan-module
    desc: References Chainreactors Aiscan Go module
    for: [go, go.mod, markdown, text, yaml]
    if:
      type: text
      substr: "github.com/chainreactors/aiscan"

  - id: chainreactors-toolkit-module
    desc: References Chainreactors scanner toolkit module
    for: [go, go.mod, text, elf]
    size_min: 16
    size_max: 67108864
    if:
      type: text
      regex: 'github\.com/chainreactors/(gogo|spray|zombie|neutron|ioa|fingers|proxyclient)'

  - id: chainreactors-aiscan-agent-skill
    desc: Aiscan autonomous security agent skill
    for: [markdown, text]
    if:
      type: text
      substr: "agent on the chainreactors scanner toolkit"

  - id: chainreactors-aiscan-banner
    desc: Aiscan agentic security scanner description
    for: [markdown, text, go]
    if:
      type: text
      substr: "Agentic Security Scanner — AI-driven reconnaissance meets deterministic scanning"

  - id: chainreactors-neutron-execute-symbol
    desc: Binary embeds Neutron protocol executer symbol
    crit: notable
    conf: 0.95
    for: [elf]
    size_min: 100000
    size_max: 67108864
    if:
      type: symbol
      kind: function
      substr: "chainreactors/neutron/protocols/executer."

composite_rules:
  - id: chainreactors-neutron-poc-executor-binary
    desc: Compiled Neutron PoC template executor binary
    crit: hostile
    conf: 0.96
    for: [elf]
    all:
      - id: chainreactors-toolkit-module
      - id: chainreactors-neutron-execute-symbol

  - id: chainreactors-aiscan-scanner-suite
    desc: Chainreactors Aiscan agentic scanner suite
    conf: 0.98
    crit: notable
    any:
      - id: chainreactors-aiscan-module
      - id: chainreactors-toolkit-module
      - id: chainreactors-aiscan-agent-skill
      - id: chainreactors-aiscan-banner
