# UC3M bachelor thesis that implements TripleCross (academic PDF, not the implant).
defaults:
  platforms: [unix, windows]
  for: [pdf]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 50000000

traits:
  - id: thesis-pdf-author
    desc: TripleCross thesis PDF author
    if:
      type: value
      path: pdf.info.author
      substr: 'Sánchez Bajo'

  - id: h3xduck-project-url
    desc: h3xduck TripleCross GitHub URL
    if:
      type: value
      path: pdf.actions[*].snippet
      substr: github.com/h3xduck/TripleCross

composite_rules:
  - id: triplecross-tfg-thesis
    desc: TripleCross eBPF bachelor thesis
    all:
      - id: thesis-pdf-author
      - id: h3xduck-project-url
