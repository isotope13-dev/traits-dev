# Mettle is Metasploit's Meterpreter-equivalent C2 payload agent, shipped as
# compiled per-platform binaries inside the metasploit_payloads-mettle gem.
# A Mettle binary registers its C2 transports (TCP, HTTP) against a TLV
# dispatcher keyed by a session UUID/GUID, then dials out over Winsock. The
# transport-registration and session-dispatcher symbols below name Mettle's
# own C2 apparatus (c2/c2.c, lib/mettle.c in the Mettle source tree); ordinary
# network clients register no such transports and carry no TLV session
# dispatcher. Requiring both registration markers plus a Winsock outbound
# connect import keeps static TLS stacks, socket libraries and generic
# implants without Mettle's session layer out.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
traits:
- id: c2-tcp-transport-registration
  desc: Mettle C2 TCP transport registration
  size_min: 4096
  size_max: 10000000
  if:
    type: text
    section: overlay
    substr: c2_register_tcp_transports
- id: c2-http-transport-registration
  desc: Mettle C2 HTTP transport registration
  size_min: 4096
  size_max: 10000000
  if:
    type: text
    section: overlay
    substr: c2_register_http_transports
- id: session-guid-dispatcher
  desc: Mettle C2 session GUID dispatcher
  size_min: 4096
  size_max: 10000000
  if:
    type: text
    section: overlay
    substr: tlv_dispatcher_set_session_guid
# Native executable builds retain function symbols even when their flat
# process-image counterparts omit section and symbol tables. Keep those
# ELF string-table entries separate from PE COFF overlay text. Cleave
# currently exposes only dynamic ELF symbols, so use the named .strtab.
- id: elf-tcp-transport-registration
  desc: Mettle TCP transport registration table entry
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 10000000
  if:
    type: text
    section: strtab
    exact: c2_register_tcp_transports
- id: elf-session-guid-dispatcher
  desc: Mettle session GUID dispatcher table entry
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 10000000
  if:
    type: text
    section: strtab
    exact: tlv_dispatcher_set_session_guid
- id: elf-process-command-handler
  desc: Mettle process execution handler table entry
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 10000000
  if:
    type: text
    section: strtab
    exact: sys_process_execute
composite_rules:
- id: c2-implant-session
  desc: Mettle C2 implant registers transports with session identity
  crit: hostile
  conf: 0.97
  all:
  - id: c2-tcp-transport-registration
  - id: session-guid-dispatcher
  - id: micro-behaviors/communications/socket/connect::connect-api
- id: elf-c2-command-agent
  desc: Mettle native C2 agent with process handler
  crit: hostile
  conf: 0.98
  platforms: [linux]
  for: [elf]
  all:
  - id: elf-tcp-transport-registration
  - id: elf-session-guid-dispatcher
  - id: elf-process-command-handler
