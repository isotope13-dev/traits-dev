# RCEKit is an open-source RCE detection and confirmation toolkit for
# authorised penetration tests. It generates injection payloads (SSTI, command
# injection, container escape, cloud-metadata probes), sends them to a target
# the operator names, and confirms results through its own out-of-band
# listener. Its source embeds the exploit payloads it sends. This identity is
# benign context for those members: the consent gate and per-run logging are
# the tool's own guardrails, and the rule's neutral capability traits still
# report the payloads. Consumers downgrade one step rather than suppress.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  crit: notable
  conf: 0.97

traits:
  - id: rcekit-class-declaration
    desc: RCEKit class declaration in source
    if:
      type: text
      regex: '^class RCEKit\b'

  - id: rcekit-consent-gate
    desc: RCEKit explicit-consent gate for active sends
    if:
      type: text
      substr: "--acknowledge-consent"

composite_rules:
  # Named identity for the whole tool: its class declaration and its consent
  # flag must both appear in the same source file.
  - id: rcekit-source-file
    desc: RCEKit exploit-confirmation toolkit source with consent gate
    crit: notable
    conf: 0.98
    all:
      - id: rcekit-class-declaration
      - id: rcekit-consent-gate
