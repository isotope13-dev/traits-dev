defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  size_min: 100000
  size_max: 5000000
composite_rules:
  - id: wxdiag-autostart-path-text
    desc: WxDiag filename and autostart path texts
    crit: notable
    conf: 0.98
    all:
      - id: metadata/filename/identity::wxdiag-basename
      - id: micro-behaviors/fs/path/autostart::wxdiag-launchagent-path-reference
      - id: micro-behaviors/os/registry/autostart/reference::wxdiag-run-key-path-reference
