defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  size_min: 100000
  size_max: 5000000
composite_rules:
  - id: wxdiag-beacon-exfil-c2demo-text
    desc: WxDiag filename and three command texts
    crit: notable
    conf: 0.99
    all:
      - id: metadata/filename/identity::wxdiag-basename
      - id: wxdiag-beacon-cli-text
      - id: wxdiag-exfil-cli-text
      - id: wxdiag-c2demo-cli-text
