defaults:
  for: [perl]
  platforms: [unix, windows]

traits:
  - id: reverse-shell-helper-module
    desc: Spellbook reverse-shell payload generator module
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^package\s+Spellbook::Helper::Reverse_Shell\s*\{'

composite_rules:
  - id: reverse-shell-generator-context
    desc: Spellbook helper returns generated payload text
    crit: exception
    all:
      - id: reverse-shell-helper-module
      - id: micro-behaviors/data/encode/base64::perl-return-encoded-hash-value
