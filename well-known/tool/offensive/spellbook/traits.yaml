defaults:
  for: [perl]
  platforms: [unix, windows]

traits:
  - id: reverse-shell-helper-module
    desc: Spellbook reverse-shell payload generator module
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^package\s+Spellbook::Helper::Reverse_Shell\s*\{'

  - id: metabase-command-injection-module
    desc: Spellbook Metabase reverse-shell exploit module
    crit: suspicious
    conf: 0.99
    attack: T1190,T1059.004
    if:
      type: text
      regex: '(?m)^package\s+Spellbook::Advisory::CVE_2023_38646\s*\{'

  - id: metabase-runtime-exec-payload
    desc: Metabase payload contains Java Runtime.exec
    crit: suspicious
    conf: 0.99
    attack: T1190,T1059.004
    if:
      type: text
      regex: 'java\.lang\.Runtime\.getRuntime\(\)\.exec\('

  - id: metabase-post-request
    desc: Metabase module constructs an HTTP POST request
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'HTTP::Request\s*->\s*new\s*\(\s*["'']POST'

composite_rules:
  - id: reverse-shell-generator-context
    desc: Spellbook helper returns generated payload text
    crit: exception
    all:
      - id: reverse-shell-helper-module
      - id: micro-behaviors/data/encode/base64::perl-return-encoded-hash-value

  - id: metabase-command-injection-exploit
    desc: Spellbook builds a Metabase command-injection reverse-shell request
    crit: suspicious
    conf: 0.99
    attack: T1190,T1059.004
    all:
      - id: metabase-command-injection-module
      - id: metabase-runtime-exec-payload
      - id: metabase-post-request
