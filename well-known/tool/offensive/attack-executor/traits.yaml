# Attack Executor — PyPI `attack_executor` / GitHub LexusWang/attack_executor.
# Published MIT toolkit that wraps Metasploit (pymetasploit3), Sliver (sliver-py),
# LinPEAS, nmap, and related pentest tools behind Python APIs for LLM-driven
# red-team automation. Identify the package so analysts can attribute the many
# offensive findings to a known attack-orchestration framework.
defaults:
  crit: notable
  platforms: [unix, windows]
  size_max: 5000000
traits:
  - id: package-tree-member
    desc: Attack Executor package tree member
    conf: 0.99
    for: [python, text, markdown, whl, pkginfo]
    if:
      type: path
      regex: '(^|[\\/])attack_executor([\\/]|-[0-9])'
  - id: pkg-name
    desc: Attack Executor package name metadata
    conf: 0.9
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: name
      regex: '(?i)^attack[_-]?executor$'
  - id: pkg-cyberattack-summary
    desc: Attack Executor cyberattack toolkit summary
    conf: 0.95
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: summary
      regex: '(?i)penetration testing and cyberattack|automated penetration testing'
  - id: pymetasploit3-dependency
    desc: Declares pymetasploit3 Metasploit RPC dependency
    conf: 0.95
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^pymetasploit3\b'
  - id: sliver-py-dependency
    desc: Declares sliver-py C2 client dependency
    conf: 0.95
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^sliver-py\b'
  - id: repo-attribution
    desc: Attack Executor source repository reference
    conf: 0.9
    for: [text, scripts, markdown]
    if:
      type: text
      substr: LexusWang/attack_executor
  - id: metasploit-executor-class
    desc: Attack Executor Metasploit wrapper class
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      kind: class
      regex: '^class\s+MetasploitExecutor\b'
  - id: sliver-executor-class
    desc: Attack Executor Sliver wrapper class
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      kind: class
      regex: '^class\s+SliverExecutor\b'
  - id: linpeas-runner-function
    desc: Attack Executor LinPEAS runner function
    conf: 0.9
    for: [python]
    if:
      type: function
      exact: run_linpeas
composite_rules:
  - id: attack-executor-framework
    desc: Attack Executor Metasploit/Sliver orchestration framework
    conf: 0.96
    any:
      - id: pkg-cyberattack-summary
      - id: pymetasploit3-dependency
      - id: sliver-py-dependency
      - id: package-tree-member
      - id: repo-attribution
      - id: pkg-name

  # Pair the wrapper identity with the concrete upstream API or payload
  # identity before using it as a finding suppressor.
  - id: metasploit-wrapper-source
    desc: Attack Executor Metasploit wrapper source
    crit: exception
    for: [python]
    all:
      - id: metasploit-executor-class
      - id: objectives/lateral-movement/exploit/metasploit::pymetasploit3-msfrpc-import

  - id: sliver-wrapper-source
    desc: Attack Executor Sliver wrapper source
    crit: exception
    for: [python]
    all:
      - id: sliver-executor-class
      - id: objectives/command-and-control/remote-command/tasking::sliver-py-client-import

  - id: linpeas-wrapper-source
    desc: Attack Executor LinPEAS wrapper source
    crit: exception
    for: [python]
    all:
      - id: linpeas-runner-function
      - id: objectives/discovery/host/security::peass-linpeas-download-url
