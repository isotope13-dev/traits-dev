defaults:
  for: [python]
  platforms: [linux, windows, macos]
traits:
- id: karavas-bot-package-import
  desc: Karavas C2 bot package import
  crit: suspicious
  conf: 0.92
  attack: T1588.002
  if:
    # The server imports its implant builders from the framework's bot package.
    type: text
    regex: '(?m)^\s*from\s+bot\s+import\s+launchers'
- id: karavas-command-type-enum
  desc: Karavas C2 command type enum
  crit: notable
  conf: 0.85
  attack: T1588.002
  if:
    type: text
    regex: '\bCommandType\.(SHELL|MODULE)\b'
- id: karavas-bot-command-queue-call
  desc: Queues Karavas bot commands
  crit: component
  if:
    type: symbol
    kind: call
    regex: '\.add_command$'
- id: karavas-shell-command-kind
  desc: Karavas shell command queue type
  crit: component
  if:
    type: text
    substr: CommandType.SHELL
- id: karavas-module-command-kind
  desc: Karavas module command queue type
  crit: component
  if:
    type: text
    substr: CommandType.MODULE
- id: karavas-mass-execution-loop
  desc: Karavas can task multiple bots
  crit: component
  if:
    type: text
    substr: mass_execute
- id: karavas-get-bots-call
  desc: Retrieves all Karavas bots for dispatch
  crit: component
  if:
    type: symbol
    kind: call
    regex: '\.get_bots$'
composite_rules:
- id: karavas-remote-shell-command-queue
  desc: Karavas queues operator shell commands to bots
  crit: suspicious
  conf: 0.98
  attack: T1059.004
  all:
  - id: well-known/tool/offensive/karavas::karavas-bot-package-import
  - id: well-known/tool/offensive/karavas::karavas-bot-command-queue-call
  - id: well-known/tool/offensive/karavas::karavas-shell-command-kind
- id: karavas-fleet-module-dispatch
  desc: Karavas queues modules across its bot fleet
  crit: suspicious
  conf: 0.99
  attack: T1105
  all:
  - id: well-known/tool/offensive/karavas::karavas-bot-package-import
  - id: well-known/tool/offensive/karavas::karavas-bot-command-queue-call
  - id: well-known/tool/offensive/karavas::karavas-module-command-kind
  - id: well-known/tool/offensive/karavas::karavas-mass-execution-loop
  - id: well-known/tool/offensive/karavas::karavas-get-bots-call
