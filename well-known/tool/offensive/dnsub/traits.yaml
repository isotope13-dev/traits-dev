# dnsub (github.com/yunxu1/dnsub, Kaleidora module mirror) is a public
# subdomain-enumeration scanner. Identity lets dropper-shaped exec.Command
# examples in vendored trees be excepted without weakening the generic Go
# PowerShell-loader rules.
defaults:
  platforms: [unix, windows]
  for: [go, text, zip, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: package-tree-member
    desc: dnsub-scanning-tool module or archive path
    conf: 0.99
    if:
      type: path
      regex: '(?i)dnsub-scanning-tool'

  - id: cli-help-banner
    desc: dnsub Darwin CLI help banner
    for: [go, text, markdown]
    conf: 0.97
    if:
      type: text
      substr: dnsub_darwin_amd64
