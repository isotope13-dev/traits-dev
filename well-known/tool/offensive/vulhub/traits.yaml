# Vulhub is an open-source collection of pre-built vulnerable Docker environments (vulhub.org).
# The repository distributes container definitions, vulnerable service configurations, and
# demonstration exploit scripts for security research and education.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, data, zip, tar]
  crit: notable
  conf: 0.99

traits:

  - id: vulhub-environments-manifest
    desc: Vulhub environments manifest
    for: [text, data]
    if:
      type: path
      basename: true
      exact: 'environments.toml'

  - id: vulhub-source-tree-member
    desc: Vulhub source tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])vulhub(@|[\\/]|$)'

composite_rules:
  - id: vulhub-vulnerable-environment-collection
    desc: Vulhub vulnerable environment collection
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: vulhub-environments-manifest
      - id: vulhub-source-tree-member
