defaults:
  platforms: [unix, windows]
  for: [scripts, source, manifests, documents, data, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: vulhub-repository-reference
    desc: Vulhub upstream repository reference
    for: [markdown, text, python, scripts, source]
    if:
      type: text
      substr: 'github.com/vulhub/vulhub'
