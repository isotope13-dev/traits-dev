# gori — keyboard-driven TUI HTTP/HTTPS intercepting proxy (hahwul/gori).
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, source, scripts]
  crit: notable
  conf: 0.99
  size_min: 1048576
  size_max: 104857600

traits:
  - id: gori-upstream-repository
    desc: gori upstream GitHub repository
    if:
      type: text
      substr: github.com/hahwul/gori

  - id: gori-version-user-agent
    desc: gori version user-agent token
    if:
      type: text
      regex: 'gori/[0-9]+\.[0-9]+\.[0-9]+ \(\+https://github\.com/hahwul/gori\)'

  - id: gori-custom-header-prefix
    desc: gori internal X-Gori request header prefix
    if:
      type: text
      substr: X-Gori-

  - id: gori-binary-basename
    desc: gori release binary basename
    for: [elf, macho, pe]
    if:
      type: basename
      regex: '^gori-v[0-9]'

composite_rules:
  - id: gori-proxy-context
    desc: gori TUI intercepting proxy package
    crit: exception
    conf: 0.99
    any:
      - id: gori-upstream-repository
      - id: gori-version-user-agent
      - id: gori-custom-header-prefix
      - id: gori-binary-basename
