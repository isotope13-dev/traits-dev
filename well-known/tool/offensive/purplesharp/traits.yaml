# PurpleSharp is an open-source C# adversary simulation tool that executes
# MITRE ATT&CK techniques across Windows and Active Directory environments.
# Attribute the tool as notable here; objective rules separately describe the
# attack techniques implemented in the binary.
defaults:
  crit: notable
  conf: 0.98
  platforms: [windows]
  for: [pe, dll]
  size_min: 16384
  size_max: 10000000

traits:
  - id: simulations-namespace
    desc: PurpleSharp simulation or library namespace
    if:
      type: text
      section: .text
      regex: 'PurpleSharp\.(Simulations|Lib)\b'

  - id: repository-url
    desc: PurpleSharp source repository URL
    if:
      type: text
      section: .text
      substr: github.com/mvelazc0/PurpleSharp

  - id: playbook-artifact
    desc: PurpleSharp playbook or navigator filename
    if:
      type: text
      section: .text
      regex: 'PurpleSharp(\.Playbook|_Navigator)\.json'

composite_rules:
  - id: purplesharp-tool
    desc: PurpleSharp adversary simulation tool
    all:
      - id: simulations-namespace
    any:
      - id: repository-url
      - id: playbook-artifact
