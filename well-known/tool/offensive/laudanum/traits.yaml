# Laudanum (SecureIdeas) pentest webshell collection: server pages (PHP, ASP)
# dropped on a host during authorized penetration tests to give the tester
# command, file, proxy, and recon access. The project banner and contact
# address below identify the family; behavior composites elsewhere convict
# the individual tools. Identity stays notable: the banner alone on an
# inert wrapper (plugin registration, settings page) is characterization,
# not a verdict.
defaults:
  platforms: [linux, macos, windows]
  # Server-page types Laudanum actually ships (php, asp). Narrower than the
  # relay/file composites on purpose: this is family attribution.
  for: [php, asp]
  attack: T1505.003
  crit: notable

traits:
  - id: project-banner
    desc: Laudanum pentest-tool project banner
    conf: 0.98
    if:
      type: text
      word: Laudanum

  - id: contact-reference
    desc: Laudanum contact address reference
    conf: 0.98
    if:
      type: text
      substr: laudanum.secureideas.net
