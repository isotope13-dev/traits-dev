# Some compressed builds retain literal fragments of the builder's banner,
# compiler option, and generated-logic symbol. These clues are version- and
# compression-dependent; they do not establish that the program ran.
defaults:
  platforms: [windows, unix]
  for: [data]
  size_max: 262144
traits:
  - id: dos-builder-compressed-fragments
    desc: DOS virus-builder identity fragments
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_vcl_builder_fragments {
          strings:
            $virus = "Virus" ascii
            $author = "Nowh" ascii
            $group = "WaReZ" ascii
            $compile = "compile" ascii
            $option = "-cvcl_" ascii
            $logic = "gic_bomb" ascii
          condition:
            uint16(0) == 0x5a4d and uint16(4) > 0 and
            uint16(8) >= 4 and 16*uint16(8) < filesize and
            $option and $logic and
            for any n in (1..#virus) : (
              $author in (@virus[n]..@virus[n]+128) and
              $group in (@virus[n]..@virus[n]+128) and
              $compile in (@virus[n]..@virus[n]+128)
            )
        }
