# CVEX Virus Maker, a Clipper 5.2 DOS virus builder (1994-1995). The menu
# banner and copyright lines are the identity evidence. Generation behavior
# lives under objectives/impact/infect/virus/builder.
defaults:
  platforms: [windows, unix]
  for: [data]

traits:
  - id: cvex-maker-banner
    desc: CVEX Virus Maker title banner
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Virus Maker  ver 1.00

  - id: cvex-corp-copyright
    desc: CVEX Corp virus-maker copyright line
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: (c) CVEX Corp.

composite_rules:
  - id: cvex-virus-maker
    desc: CVEX Virus Maker DOS virus builder identity
    crit: hostile
    conf: 0.98
    attack: T1587.001
    all:
      - id: cvex-maker-banner
      - id: cvex-corp-copyright
