# Script names are tool references, including when quoted in operator help.
# Preserve the original matching populations; command/target relationships
# remain the responsibility of the consuming lateral-movement composites.
traits:
  - id: impacket-psexec-script-reference
    desc: References the Impacket psexec script
    crit: notable
    conf: 0.96
    platforms: [unix, windows]
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bpsexec\.py\b'

  - id: impacket-wmiexec-script-reference
    desc: References the Impacket wmiexec script
    crit: notable
    platforms: [windows]
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)(impacket[\\/]examples[\\/]wmiexec\.py|wmiexec\.py)\b'
