# Impacket (SecureAuth/CoreSecurity) is an openly distributed, dual-use
# collection of Python classes for Windows/AD network protocols. Its own
# examples intentionally implement credential dumping (secretsdump.py),
# NTLM relay (ntlmrelayx.py/smbrelayx.py), and remote command execution
# (wmiexec.py/smbexec.py/dcomexec.py) as their documented, published
# purpose. This identity is benign context for the official source tree
# member; it does not suppress the underlying neutral capability traits.
defaults:
  platforms: [unix, windows]
  for: [python, text, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: Impacket source tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])impacket-\d+\.\d+(\.\d+)?[\\/]'
