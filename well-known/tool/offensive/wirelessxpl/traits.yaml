# WirelessXPL-Forge is an open modular wireless security research framework.
# It ships Wi-Fi attack bridges, BLE/Zigbee modules, and third-party PoC intel
# catalogs for authorized penetration testing — not implanted malware.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, json, whl, zip, tar, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: wirelessxpl PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: wirelessxpl

  - id: project-summary
    desc: WirelessXPL-Forge project summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: WirelessXPL-Forge

  - id: github-homepage
    desc: WirelessXPL-Forge GitHub repository URL
    if:
      type: text
      regex: github\.com/mrhenrique/WirelessXPL-Forge

  - id: module-tree-path
    desc: wirelessxpl modules directory path
    for: [python]
    if:
      type: path
      regex: '(?i)wirelessxpl/modules/'

  - id: wifi-lab-module-path
    desc: wirelessxpl wifi_lab module path
    for: [python]
    if:
      type: path
      regex: '(?i)wifi_lab/'

  - id: vendored-routeros-api-path
    desc: Vendored RouterOS API client path
    for: [python]
    if:
      type: path
      regex: '(?i)apiros_client'

  - id: arsenal-index-text-marker
    desc: WirelessXPL arsenal index text marker
    for: [json, text]
    if:
      type: text
      substr: WirelessXPL-Forge Arsenal Index

  - id: workspace-reuse-inventory-marker
    desc: Workspace reuse inventory catalog marker
    for: [json, text]
    count_min: 3
    if:
      type: text
      substr: '"classification": "integrate_core"'

  - id: authorized-use-statement
    desc: Authorized penetration testing disclaimer
    if:
      type: text
      substr: authorised penetration testing

  - id: wps-pin-predictor-module
    desc: WPS PIN predictor module path
    for: [python]
    if:
      type: path
      regex: '(?i)wps_pin_predictor'

composite_rules:
  - id: framework-identity
    desc: WirelessXPL-Forge wireless security framework
    crit: notable
    conf: 0.99
    any:
      - id: pypi-package-name
      - id: project-summary
      - id: github-homepage
      - id: arsenal-index-text-marker

  - id: offensive-module-layout
    desc: WirelessXPL offensive wireless module layout
    crit: notable
    conf: 0.98
    any:
      - id: module-tree-path
      - id: wifi-lab-module-path

  - id: authorized-framework-context
    desc: Authorized WirelessXPL-Forge research context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: framework-identity
      - id: authorized-use-statement

  - id: routeros-api-client-context
    desc: Vendored RouterOS API client in WirelessXPL
    crit: exception
    conf: 0.98
    scope: outer
    all:
      - id: framework-identity
      - id: vendored-routeros-api-path
