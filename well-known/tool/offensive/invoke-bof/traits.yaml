defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 1000000
traits:
- id: coff-loader-function
  desc: Invoke-BOF COFF mapping function
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?Load-Bof\b'
- id: bof-entry-function
  desc: Invoke-BOF object entry execution function
  if:
    type: text
    regex: '(?im)^\s*function\s+(local:)?Start-Bof\b'
- id: beacon-data-parse-api
  desc: Beacon object data-parser API name
  if:
    type: text
    substr: BeaconDataParse
composite_rules:
- id: powershell-beacon-object-loader
  desc: PowerShell maps and executes Beacon-compatible COFF objects
  crit: notable
  all:
  - id: coff-loader-function
  - id: bof-entry-function
  - id: beacon-data-parse-api
  - id: micro-behaviors/mem/copy::marshal-copy-powershell

- id: bof-delegated-memory-preparation
  desc: BOF loader prepares delegated memory APIs
  crit: notable
  all:
  - id: coff-loader-function
  - id: micro-behaviors/mem/combined::powershell-delegate-alloc-copy-protect

- id: bof-native-entry-delegation
  desc: BOF loader builds native entry delegates
  crit: notable
  all:
  - id: bof-entry-function
  - id: beacon-data-parse-api
  - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
