defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: pkgbuild-package-name
    desc: PKGBUILD names emp3r0r package
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^pkgname=emp3r0r\s*$'
  - id: pkgbuild-git-source
    desc: PKGBUILD names emp3r0r Git source
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: git+https://github.com/jm33-m0/emp3r0r.git
  - id: pkgbuild-local-build-command
    desc: Shell text invokes emp3r0r build command
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^[ \t]*\./emp3r0r[ \t]+--build\b'

composite_rules:
  - id: pkgbuild-source-recipe
    desc: emp3r0r source build recipe
    crit: notable
    conf: 0.99
    all:
      - id: pkgbuild-package-name
      - id: pkgbuild-git-source
      - id: pkgbuild-local-build-command
