traits:
- id: emp3r0r-brand-name
  size_min: 512
  desc: emp3r0r brand string
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: emp3r0r
    section: .text
  for:
  - elf
  - macho
  - go
- id: shadowsocks-c2
  size_min: 512
  desc: emp3r0r Shadowsocks C2 client
  crit: notable
  conf: 0.95
