    type: text
    substr: ShadowsocksC2Client
    section: .text
  for:
  - elf
  - macho
  - go
- id: vaccine-handler
  size_min: 512
  desc: emp3r0r vaccine handler name reference
  crit: notable
  conf: 0.95
