traits:
- id: source-secureconn-pfs-log
  desc: emp3r0r SecureConn PFS-switch log line
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: 'SecureConn: Switched to ephemeral session key'
- id: source-emp3r0r-agent-type
  desc: emp3r0r Emp3r0rAgent type reference
  crit: notable
  conf: 0.99
  if:
    type: text
    word: Emp3r0rAgent
- id: source-execute-agent-command
  desc: emp3r0r ExecuteAgentCommand C2 dispatcher
  crit: notable
  conf: 0.99
  if:
    type: text
    word: ExecuteAgentCommand
- id: source-linux-bof-test-skip-msg
  desc: emp3r0r linux BOF test skip message
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: linux BOF loader test only supports amd64
- id: source-process-list-handles-bof
  desc: emp3r0r process_list_handles BOF reference
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: process_list_handles_linux
- id: source-docker-probe-marker
  desc: emp3r0r Docker probe environment marker
  crit: notable
  conf: 0.99
  if:
    type: string_literal
    exact: EMP3R0R_IN_DOCKER_PROBE
- id: source-c2-agent-tls-server
  desc: emp3r0r TLS C2 agent server startup call
  crit: notable
  conf: 0.99
  if:
    type: symbol
    kind: call
    exact: server.StartC2AgentTLSServer
- id: source-http-aes-stager-listener
  desc: emp3r0r AES-compressed HTTP stager listener call
  crit: notable
  conf: 0.99
  if:
    type: symbol
    kind: call
    exact: listener.HTTPAESCompressedListener
- id: source-agent-command-send
  desc: emp3r0r sends a command to an agent
  crit: notable
  conf: 0.99
  if:
    type: symbol
    kind: call
    exact: agents.SendCmd
