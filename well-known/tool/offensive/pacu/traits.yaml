# Pacu (RhinoSecurityLabs/pacu) — the AWS exploitation framework: its
# modules enumerate IAM, escalate privileges, abuse Lambda/EC2 and plant
# backdoors. `--module-name` drives one named module non-interactively;
# the module name itself selects the abuse, so invocation plus the module
# flag is the identity. Read-only enumeration
# and privilege-escalation modules share this shape, so identity stays
# notable here; the privesc reading belongs to a consumer with module
# evidence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  attack: T1552, T1078

traits:
  - id: pacu-binary-reference
    desc: Names the Pacu AWS exploit kit
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bpacu\b'

  - id: pacu-module-run-flags
    desc: Pacu module selection flag
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      # `--module-name` names the abuse module to run; `--exec` alone is
      # also find(1)'s predicate, so it stays out of the identity.
      substr: '--module-name'

composite_rules:
  - id: pacu-context
    desc: Pacu AWS exploitation framework context
    crit: notable
    conf: 0.95
    any:
      - id: pacu-binary-reference
      - id: pacu-module-run-flags
