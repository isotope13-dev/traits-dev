# PowerSploit's Out-EncodedCommand prints a launcher. The help comment
# includes a worked example of that launcher, including -W Hidden and a
# Base64 stub. The generator is the tool; a pasted one-liner has no function.
defaults:
  for: [powershell, html]
  platforms: [windows]
traits:
  - id: powersploit-out-encoded-command
    desc: PowerSploit Out-EncodedCommand generator
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'function\s+Out-EncodedCommand\b[\s\S]{0,400}Compresses,\s+Base-64 encodes'
  - id: powerview-invoke-sharefinder
    desc: PowerView Invoke-ShareFinder share scan
    crit: suspicious
    conf: 0.97
    for: [powershell, batch]
    attack: T1135
    if:
      type: text
      regex: '(?i)\b(Invoke-ShareFinder|ShareFinder\.ps1)\b.{0,80}-(CheckShareAccess|ExcludeStandard)\b'
