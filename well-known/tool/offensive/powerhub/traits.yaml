# PowerHub is a web-app C2 that obfuscates PowerShell to bypass EDR and
# application allow-listing. The manifest names that purpose and ships
# a dedicated obfuscator entry point.
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]
  attack: T1588.002,T1027.010
  crit: notable
  conf: 0.96

traits:
  - id: epp-bypass-postex-description
    desc: Package describes post-exploitation EPP bypass
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)post exploitation tool.{0,80}bypassing endpoint protection'
  - id: power-obfuscate-entrypoint
    desc: Console script for PowerHub obfuscator
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^power-obfuscate\s*='
  - id: c2-obfuscation-keywords
    desc: Package keywords name C2 and obfuscation
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["\s]c2["\s].{0,80}obfuscation|obfuscation.{0,80}["\s]c2["\s]'

composite_rules:
  - id: powershell-c2-obfuscator-manifest
    desc: PowerShell C2 obfuscator package
    crit: hostile
    conf: 0.98
    all:
      - id: epp-bypass-postex-description
      - id: power-obfuscate-entrypoint
      - id: c2-obfuscation-keywords
  - id: epp-bypass-obfuscator-entrypoint
    desc: EPP-bypass post-exploitation obfuscator entry point
    crit: hostile
    conf: 0.97
    all:
      - id: epp-bypass-postex-description
      - id: power-obfuscate-entrypoint
  - id: c2-keyword-obfuscator-entrypoint
    desc: C2 obfuscator console script
    crit: hostile
    conf: 0.96
    all:
      - id: power-obfuscate-entrypoint
      - id: c2-obfuscation-keywords
