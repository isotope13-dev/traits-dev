# CyberStrike (cyberstrike.io, npm @cyberstrike-io/cyberstrike-*) - an AI
# offensive-security agent and autonomous pentesting platform built on the
# Bun/opencode runtime. The platform packages ship a Bun single-file
# executable that carries the agent's system prompt, skills and tradecraft
# text, plus a "HackBrowser" capture extension. The product is an operator
# tool: its bundled attack text and runtime imports are not implant behavior.
# Not related to the CyberStrikeAI family under ../cyberstrikeai.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98

traits:
  # The agent's own opening system-prompt sentence. A client that merely
  # embeds pentest text, or a package that wraps this binary, lacks it.
  - id: agent-system-prompt
    desc: Cyberstrike offensive security agent prompt
    if:
      type: text
      substr: "You are CyberStrike, an AI-powered offensive security agent"

composite_rules:
  # Benign context for string-only host rules. The agent bundles offensive
  # skills (rootkit persistence, audit tampering, backdoor recipes) as prompt
  # text inside a Bun single-file executable, and the runtime supplies socket
  # and process imports. Both the Bun runtime and the agent's own prompt are
  # required, so a Bun-built implant or a stray copy of the sentence misses.
  - id: bundled-tradecraft-context
    desc: Cyberstrike agent bundle carrying attack text
    crit: exception
    conf: 0.98
    size_min: 1000000
    for: [elf, macho]
    platforms: [unix]
    all:
      - id: agent-system-prompt
      - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context
