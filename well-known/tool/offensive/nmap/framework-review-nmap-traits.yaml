defaults:
  platforms:
  - windows
  - unix
  for:
  - kotlin
  - lua
  - python
  - shell
  - php
  - perl
  - c
  - cpp
  - source
  - scripts
  - tar
  - zip
  - elf
  - text
  - data
  - javascript
  crit: notable
  conf: 0.96
  size_max: 10000000

traits:
  - id: nmap-binary-basename
    crit: notable
    conf: 0.99
    desc: Nmap executable basename
    for: [elf, pe]
    size_min: 100000
    size_max: 10000000
    if:
      type: path
      basename: true
      exact: nmap


composite_rules:
  - id: nmap-name-source-context
    desc: Nmap source or executable name context
    crit: notable
    conf: 0.99
    any:
      - id: well-known/tool/offensive/nmap::nmap-source-tree-path
      - id: well-known/tool/offensive/nmap::nmap-nse-script-path
      - id: well-known/tool/offensive/nmap::nmap-binary-basename
