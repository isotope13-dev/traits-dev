defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: nmap-decoy-scan
  size_min: 512
  size_max: 500000000
  desc: Nmap decoy scan
  crit: suspicious
  conf: 0.85
  attack: T1046
  if:
    type: text
    regex: "\\bnmap(\\.exe)?[^\\n\\r]{0,120}\\s-D\\s*(ME|RND|[0-9,]+|\\d{1,3}(\\.\\d{1,3}){3})"
    section: ".text"
