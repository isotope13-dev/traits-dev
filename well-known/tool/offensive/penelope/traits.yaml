# Penelope is a reverse-shell handler packaged for pentest exams. The
# project name, reverse-shell keyword, and console script together are
# the tool, not a blog that mentions "pty".
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]
  attack: T1588.002,T1059.004
  crit: notable
  conf: 0.96

traits:
  - id: shell-handler-package-name
    desc: Package named as a shell handler
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^\s*name\s*=\s*"penelope-shell-handler"'
  - id: reverse-shell-keyword
    desc: Package keywords include reverse-shell
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["\s]reverse-shell["\s]'
  - id: penelope-console-script
    desc: Console script entry point for Penelope
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*penelope\s*=\s*"?penelope:main"?'

composite_rules:
  - id: reverse-shell-handler-manifest
    desc: Reverse-shell handler package
    crit: hostile
    conf: 0.97
    all:
      - id: shell-handler-package-name
      - id: reverse-shell-keyword
      - id: penelope-console-script
  - id: named-reverse-shell-handler
    desc: Named reverse-shell handler package
    crit: hostile
    conf: 0.96
    all:
      - id: shell-handler-package-name
      - id: reverse-shell-keyword
  - id: reverse-shell-handler-cli
    desc: Reverse-shell handler console script
    crit: hostile
    conf: 0.96
    all:
      - id: reverse-shell-keyword
      - id: penelope-console-script
