# Invoke-ConPtyShell (by antonioCoco) is a well-known offensive tool that
# spawns a fully interactive reverse shell over a ConPTY, typically delivered
# as a one-liner stage after a download-execute cradle. Legitimate software
# has no reason to invoke it by name.
defaults:
  platforms: [windows, unix]
  attack: T1059.001
  mbc: B0025

traits:
  - id: invoke-conptyshell-command
    desc: Invoke-ConPtyShell command reference
    crit: suspicious
    conf: 0.97
    for: [powershell, batch, javascript, typescript, shell, python, vbs]
    size_max: 2000000
    if:
      type: text
      regex: '(?i)invoke-conpt[y]?shell\b'

composite_rules:
  # The cradle spelling: an install hook or script builds a PowerShell command
  # that both downloads a stage (IEX/IWR) and calls ConPtyShell with a host
  # and port -- a reverse shell delivered through a package lifecycle.
  - id: conptyshell-reverse-shell-invoked
    desc: Script invokes ConPtyShell reverse shell
    crit: hostile
    conf: 0.97
    all:
      - id: invoke-conptyshell-command
    any:
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex-alias
