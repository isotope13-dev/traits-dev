# GXX (github.com/cyberspacesec/gxx) is a YAML/CEL web and network service
# fingerprint scanner with a CLI, SDK and rule-editor IDE. It probes targets
# supplied by the operator and optionally checks out-of-band callbacks through
# a user-supplied ceye.io key, so it is a reconnaissance tool, not malware.
# Identity is kept apart from behavioral findings.
defaults:
  platforms: [unix, windows]
  for: [go.mod, go]
  crit: notable
  conf: 0.97

traits:
  - id: go-module-path
    desc: GXX fingerprint scanner Go module path
    if:
      type: text
      regex: '(?i)github\.com/cyberspacesec/gxx\b'
  - id: readme-title
    desc: GXX fingerprint engine README title
    for: [markdown]
    if:
      type: text
      substr: GXX - 基于YAML规则的指纹识别引擎
