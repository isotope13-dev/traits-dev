# Ladon (k8gege) is an intranet / domain penetration and lateral-movement
# framework: asset scanning, password audit, exploit modules, remote execution
# and credential reading. These rules identify its managed (.NET) builds.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.95
  size_min: 4096
  size_max: 20000000

traits:
  - id: pe-version-company-k8gege
    desc: PE version resource names company K8gege
    if:
      type: value
      path: pe.version.company
      exact: K8gege

  - id: pe-managed-k8-module-names
    desc: Managed Ladon cracking or robot module names
    if:
      type: text
      section: .text
      regex: 'K8(crack|IPselect|robot|accessHelper)'

  - id: pe-build-marker
    desc: Ladon source tree path or LadonDLL namespace
    if:
      type: text
      section: .text
      regex: 'Desktop\\K8Ladon\\|namespace LadonDLL'

composite_rules:
  - id: pe-ladon-framework-binary
    desc: Ladon penetration framework .NET binary
    crit: hostile
    all:
      - id: pe-version-company-k8gege
    any:
      - id: pe-managed-k8-module-names
      - id: pe-build-marker
