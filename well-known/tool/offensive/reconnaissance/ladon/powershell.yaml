defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.95
  size_min: 1000
  size_max: 20000000

traits:
  - id: ps-reflective-loader-banner
    desc: Script header says it reflectively loads Ladon
    if:
      type: text
      regex: 'leverages Ladon [0-9.]{3,12} and Reflection\.Assembly'

  - id: ps-ladon-function-entry
    desc: Declares a PowerShell function named Ladon
    if:
      type: text
      regex: '(?i)^function Ladon\s*(\(\s*\))?\s*\{?\s*$'

composite_rules:
  - id: ps-ladon-in-memory-loader
    desc: Ladon framework loaded in memory by PowerShell
    crit: hostile
    all:
      - id: ps-reflective-loader-banner
      - id: ps-ladon-function-entry
      - id: objectives/command-and-control/backdoor/loader/managed-reflect::ps-deflate-base64-assembly-loader
