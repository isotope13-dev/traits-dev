defaults:
  platforms: [windows, linux]
  crit: notable
  conf: 0.95
  size_min: 500
  size_max: 2000000

traits:
  - id: go-ladongo-import
    desc: Go source imports LadonGo scanner modules
    for: [go]
    count_min: 3
    if:
      type: text
      substr: github.com/k8gege/LadonGo/

  - id: go-ladon-module-help
    desc: Go help lists Ladon exploits and exec
    for: [go]
    if:
      type: text
      substr: 'Ladon RemoteExec'

  - id: python-ladon-scanner-header
    desc: Python header names Ladon Scanner by K8gege
    for: [python]
    if:
      type: text
      regex: '(?i)#\s*Ladon Scanner'

  - id: python-ladon-author-k8gege
    desc: Python header credits author K8gege
    for: [python]
    if:
      type: text
      regex: '(?i)^#\s*Author:\s*K8gege'

composite_rules:
  - id: go-ladon-scanner-source
    desc: Ladon scanner and exploit Go source
    for: [go]
    crit: suspicious
    all:
      - id: go-ladongo-import
      - id: go-ladon-module-help

  - id: python-ladon-scanner-source
    desc: Ladon scanner Python source
    for: [python]
    crit: suspicious
    all:
      - id: python-ladon-scanner-header
      - id: python-ladon-author-k8gege
