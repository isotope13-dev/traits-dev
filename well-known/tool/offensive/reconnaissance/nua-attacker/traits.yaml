# NUA Attacker v1.01 (1990, Doctor Dissector, P/H/A): a DOS X.25 war-dialer
# that sweeps Network User Address ranges through a Hayes modem and logs the
# addresses that connect. A reconnaissance tool like nmap, so the identity
# stays notable. Its banner, log names, and credits are specimen-specific. The
# modem sweep behavior is under objectives/discovery/network/scan/dial.
defaults:
  platforms: [windows, unix]
  for: [data]
  crit: notable
  conf: 0.95
  attack: T1046

traits:
  - id: nua-attacker-banner
    desc: NUA Attacker X.25 scanner banner text
    if:
      type: text
      substr: Network User Address (NUA) Attacker

  - id: nua-attacker-pha-files
    desc: NUA Attacker PHA log and config names
    if:
      type: text
      regex: 'NUAFILE\.PHA|LOGFILE\.PHA|NUAA\.CFG'
