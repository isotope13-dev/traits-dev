# powerview.py (aniqfakhrul) is the Python port of PowerView for Active Directory
# enumeration over LDAP and SMB. Its project name is the identity leg. Saved
# project pages and READMEs are the usual carriers, so HTML and Markdown are read
# alongside the source files. PowerView.ps1 (PowerSploit) is covered elsewhere,
# and this regex does not match its file name.
defaults:
  platforms: [unix, windows]
  for: [html, markdown, text, python, scripts, source]
  crit: notable
  conf: 0.95
  attack: T1087.002

traits:
  - id: powerview-py-project-name
    desc: Names the powerview.py AD enumeration tool
    if:
      type: text
      regex: '(?i)\bpowerview\.py\b'
