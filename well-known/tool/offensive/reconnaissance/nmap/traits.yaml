defaults:
  platforms: [windows, unix]
  for: [kotlin, lua, python, shell, php, perl, c, cpp, source, scripts, tar, zip, elf, text, data, javascript]
  crit: notable
  conf: 0.96
  size_max: 10000000

traits:
  - id: nmap-source-tree-path
    crit: notable
    desc: Nmap source tree path
    size_max: 300000000
    if:
      type: path
      # Source trees are nmap-7.92/. Packaged NSE scripts are nmap/scripts/.
      regex: '(^|[\\/])(nmap[-_][0-9A-Za-z]|(nmap|nselib)[\\/])'

  - id: nmap-nse-script-path
    crit: notable
    desc: Nmap NSE script path
    if:
      type: path
      regex: 'scripts[\\/][A-Za-z0-9_-]+\.nse$'

