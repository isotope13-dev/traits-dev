# Posh-SecMod (darkoperator) is an open-source PowerShell security toolkit used for
# authorized penetration testing and defensive network inventory. Its Discovery
# module ships the cmdlets below. Generic names such as Get-Whois are excluded
# because other tools reuse them.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.95
  size_min: 32
  size_max: 5000000

traits:
  - id: mdns-records-cmdlet
    desc: Posh-SecMod mDNS records cmdlet name
    if:
      type: text
      regex: '(?i)\bGet-MDNSRecords\b'

  - id: arp-scan-cmdlet
    desc: Posh-SecMod ARP scan cmdlet name
    if:
      type: text
      regex: '(?i)\bInvoke-ARPScan\b'

  - id: srv-enumeration-cmdlet
    desc: Posh-SecMod SRV enumeration cmdlet name
    if:
      type: text
      regex: '(?i)\bInvoke-EnumSRVRecords\b'

  - id: cidr-range-cmdlet
    desc: Posh-SecMod CIDR range cmdlet name
    if:
      type: text
      regex: '(?i)\bNew-IPv4RangeFromCIDR\b'

composite_rules:
  - id: posh-secmod-discovery-module
    desc: Posh-SecMod discovery module recon cmdlet names
    needs: 2
    any:
      - id: mdns-records-cmdlet
      - id: arp-scan-cmdlet
      - id: srv-enumeration-cmdlet
      - id: cidr-range-cmdlet
