# Powershellery (nullbind) is an open-source collection of PowerShell scripts for
# Active Directory assessment. Its ADS folder ships the cmdlets below, which list
# domain computers and map their OS and service-pack strings to public exploit
# module names for authorized testing. The cmdlets report only; they do not attack.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.95
  size_min: 32
  size_max: 5000000

traits:
  - id: exploitable-systems-cmdlet
    desc: Powershellery exploitable-systems cmdlet name
    if:
      type: text
      regex: '(?i)\bGet-ExploitableSystems\b'

  - id: uac-flags-cmdlet
    desc: Powershellery computer UAC flags cmdlet name
    if:
      type: text
      regex: '(?i)\bGet-AdsComputerUacFlags\b'

composite_rules:
  - id: powershellery-ads-module
    desc: Powershellery AD assessment module cmdlet names
    any:
      - id: exploitable-systems-cmdlet
      - id: uac-flags-cmdlet
