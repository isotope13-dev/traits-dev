# Main-package build metadata distinguishes the CLI from references to Amass.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 512
traits:
  - id: amass-cli-build-path
    desc: OWASP Amass reconnaissance CLI
    if:
      type: value
      path: pe.go.path
      regex: '^github\.com/(owasp-amass/amass|OWASP/Amass)/v[0-9]+/cmd/amass$'
