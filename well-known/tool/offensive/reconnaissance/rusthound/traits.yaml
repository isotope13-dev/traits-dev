# RustHound-CE (Community Edition) is an open-source Active Directory data collector
# for BloodHound written in Rust (g0h4n / github.com/g0h4n/RustHound-CE). It queries
# Active Directory via LDAP, LDAPS, ADWS, and SMB to gather domain objects, trusts,
# sessions, and permissions for attack path analysis in BloodHound.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, crate, rust, markdown, text, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: RustHound Cargo package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: rusthound-ce

  - id: repository-marker
    desc: RustHound source repository marker
    for: [cargo.toml, rust, text, markdown]
    if:
      type: text
      regex: '(?i)github\.com/g0h4n/RustHound(-CE)?'

  - id: source-tree-path
    desc: RustHound source tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])RustHound(-CE)?([@._-][\w.-]{1,32})?[\\/]'

  - id: ad-collection-cli-options
    desc: RustHound AD collection CLI options
    for: [markdown, rust, text]
    if:
      type: text
      regex: '(?i)\brusthound-ce(\.exe)?\s+-[^\n]{0,80}--(ldap|ldaps|fqdn-resolver|pfx|adws)'

composite_rules:
  - id: rusthound-tool-context
    desc: RustHound Active Directory data collector context
    any:
      - id: package-name
      - id: repository-marker
      - id: ad-collection-cli-options

  - id: rusthound-archive-context
    desc: RustHound Active Directory reconnaissance archive
    scope: archive
    all:
      - id: source-tree-path
    any:
      - id: package-name
      - id: repository-marker
      - id: ad-collection-cli-options
