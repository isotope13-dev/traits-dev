# NetExec (nxc) is the maintained fork of CrackMapExec: a network
# post-exploitation framework that sprays credentials across SMB/WinRM/LDAP/
# MSSQL, dumps SAM/LSA/NTDS, and executes commands on every host that accepts
# them. Kali ships it as `netexec`.
#
# Detected, not suppressed. `well-known/tool/sysadmin/kali::kali-netexec-member`
# exists but is a *suppressor* keyed on the nxc/nanodump/procdump paths, so the
# package scanned completely clean.
#
# Keyed on the nxc module namespace together with its protocol/dump surface, so
# a blog post or a detection rule naming NetExec does not qualify.
defaults:
  platforms: [unix, windows]
  for: [python, text, archives]
  attack: T1021
  size_max: 268435456

traits:
  - id: nxc-module-import
    desc: Imports an nxc (NetExec) module
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(^|\s)(from|import)\s+nxc[.\s]'
  - id: nxc-protocol-namespace
    desc: NetExec protocol module namespace
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bnxc\.protocols\.[a-z_]{3,20}'
  - id: netexec-product-name
    desc: NetExec or CrackMapExec product name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(NetExec|CrackMapExec)\b'

composite_rules:
  - id: netexec-post-exploitation-framework
    desc: NetExec network post-exploitation framework
    crit: hostile
    conf: 0.98
    all:
      - id: nxc-module-import
    any:
      - id: nxc-protocol-namespace
      - id: netexec-product-name
