# NetExec (nxc) is the maintained fork of CrackMapExec: a network
# post-exploitation framework that sprays credentials across SMB/WinRM/LDAP/
# MSSQL, dumps SAM/LSA/NTDS, and executes commands on every host that accepts
# them. Kali ships it as `netexec`.
#
# Detect code identity rather than generic nanodump.py/procdump.exe filenames.
# Those filenames are also distributed by unrelated credential-audit tools.
#
# Keyed on the nxc module namespace together with its protocol/dump surface, so
# a blog post or a detection rule naming NetExec does not qualify.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  attack: T1021
  size_max: 268435456

traits:
  - id: nxc-module-import
    desc: Imports an nxc (NetExec) module
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^[ \t]*(from|import)\s+nxc[.\s]'
  - id: nxc-protocol-namespace
    desc: NetExec protocol module namespace
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bnxc\.protocols\.[a-z_]{3,20}'
  - id: cme-binary-name-reference
    desc: CrackMapExec or NetExec name reference
    crit: notable
    conf: 0.95
    for: [scripts, source, text]
    if:
      type: text
      # A quoted nxc token also names the Nexium ticker in token catalogs.
      # Full product names provide the identity evidence here. Exclude
      # language property/member accesses like imageutils.Netexec.
      regex: '(?i)(^|[^\w.])(crackmapexec|netexec)\b'
    unless:
      - id: well-known/tool/sysadmin/kubernetes/source::kubernetes-authors-shell
  - id: cme-hash-auth-flag
    desc: CME NTLM hash authentication flag
    crit: component
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      regex: '(["'']-H["'']|-H\s+["'']?(\$|[0-9a-fA-F]{32}))'
  - id: cme-admin-success-marker
    desc: CME admin access success marker
    crit: notable
    conf: 0.96
    for: [scripts, source, text]
    if:
      type: text
      substr: 'Pwn3d!'
  - id: cme-enum-module-flags
    desc: CME host enumeration flags
    crit: component
    conf: 0.93
    for: [scripts, source]
    if:
      type: text
      regex: '(--shares|--users|--sessions)'
composite_rules:
  - id: netexec-post-exploitation-framework
    desc: NetExec network post-exploitation framework
    crit: hostile
    conf: 0.98
    all:
      - id: nxc-module-import
    any:
      - id: nxc-protocol-namespace
      - id: well-known/tool/offensive/netexec::netexec-name-reference
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
