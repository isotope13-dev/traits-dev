# PLUNGER is an operator-invoked exploit and red-team payload framework. Its
# published package intentionally contains functional exploit, brute-force,
# webshell, bind-shell, and command-agent implementations; package installation
# itself does not execute them. Keep those implementations visible as neutral
# capabilities while preventing their source from being classified as a
# deployed implant.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: PLUNGER Hacker PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: plungerhacker

  - id: wheel-distribution
    desc: PLUNGER Hacker wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: plungerhacker

  - id: pypi-project-repository
    desc: PLUNGER securityresearch project repository
    for: [pkginfo]
    if:
      type: value
      path: home-page
      exact: https://github.com/securityresearch/plunger

  - id: wheel-project-repository
    desc: PLUNGER wheel project repository
    for: [whl]
    if:
      type: value
      path: whl.home_page
      exact: https://github.com/securityresearch/plunger

  - id: framework-source-marker
    desc: PLUNGER Framework source marker
    for: [python]
    if:
      type: text
      substr: PLUNGER Framework

  - id: globalconnect-source-marker
    desc: PLUNGER GlobalConnect receiver marker
    for: [python]
    if:
      type: text
      substr: GlobalConnect Receiver — polls JSON bin, executes commands

composite_rules:
  - id: plunger-package-identity
    desc: PLUNGER Hacker published package identity
    for: [pkginfo, whl]
    all:
      - id: pypi-package-name
      - id: pypi-project-repository
    scope: archive

  - id: plunger-wheel-identity
    desc: PLUNGER Hacker wheel identity
    for: [whl]
    all:
      - id: wheel-distribution
      - id: wheel-project-repository
