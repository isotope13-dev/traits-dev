# King Phisher is an open-source phishing simulation and awareness campaign
# toolkit. Its upstream releases and administration tools manage, configure,
# and stop its own client and server services; this identity provides benign
# context for service lifecycle management in tools/uninstall.sh.
defaults:
  platforms: [unix, windows]
  for: [shell, python, text, markdown]
  crit: notable
  conf: 0.99
  size_max: 100000000

traits:
  - id: source-directory
    desc: King Phisher upstream source directory
    if:
      type: path
      regex: '(?i)(crimsonforge-io|securestate)[\\/]king-phisher(@|v[0-9]|\b)'

  - id: source-archive
    desc: King Phisher upstream source archive
    for: [zip]
    if:
      type: path
      basename: true
      regex: '(?i)king-phisher-v[0-9].*\.zip$'

  - id: repository-reference
    desc: King Phisher GitHub repository reference
    if:
      type: text
      regex: '(?i)github\.com/(securestate|crimsonforge-io)/king-phisher'

composite_rules:
  - id: king-phisher-source-context
    desc: King Phisher campaign toolkit source context
    crit: notable
    conf: 0.99
    any:
      - id: source-directory
      - id: source-archive
      - id: repository-reference
