# WarMySQLBrute is a MySQL credential brute-forcing tool authored by WarGame
# of the EOF vx group, published in EOF magazine issue 0x01.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, c, cpp, html, text]
  crit: notable
  conf: 0.99
  size_min: 500
  size_max: 5000000

traits:
  - id: warmysqlbrute-project-path
    desc: WarMySQLBrute project path marker
    if:
      type: text
      substr: WarMySQLBrute

  - id: wargame-bruter-banner
    desc: WarGame MySQL bruter banner
    if:
      type: text
      substr: "My little mysql bruter :) by WarGame"

  - id: wargame-contact-marker
    desc: WarGame contact email address
    if:
      type: text
      substr: "wargame89@yahoo.it"

  - id: wargame-eof-author
    desc: WarGame EOF author attribution
    if:
      type: text
      substr: "Author: WarGame/EOF"

composite_rules:
  - id: warmysqlbrute-tool
    desc: WarGame MySQL brute-force tool
    crit: hostile
    conf: 0.99
    attack: T1110.001
    all:
      - id: objectives/lateral-movement/brute-force/database::mysql-credential-bruteforce
    any:
      - id: warmysqlbrute-project-path
      - id: wargame-bruter-banner
      - id: wargame-contact-marker
      - id: wargame-eof-author
