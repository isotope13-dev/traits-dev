# Sliver's traffic encoder is a dual-use C2 extension. A standalone encoder
# module exposes only a data codec; it is not itself a Sliver implant.
defaults:
  platforms: [linux, windows, macos]
  for: [wasm]
  crit: notable
  conf: 0.96

traits:
  - id: sliver-go-module-path
    desc: Sliver framework Go module path
    crit: notable
    conf: 0.95
    size_min: 512
    size_max: 500000000
    for: [go, binaries]
    if:
      type: text
      substr: github.com/bishopfox/sliver

  # The framework's GPL header names the product ("Sliver Implant
  # Framework", BishopFox). That is identity of the dual-use C2 framework
  # itself, not evidence of a malware variant, so it lives beside the
  # module-path identity instead of under well-known/malware/.
  - id: sliver-framework-banner
    desc: Sliver framework license banner
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [go, binaries]
    size_max: 5000000
    if:
      type: text
      substr: Sliver Implant Framework

  - id: traffic-encoder-asset-path
    desc: Sliver traffic encoder asset path
    if:
      type: path
      regex: 'traffic-encoders[\\/][A-Za-z0-9_-]+\.wasm$'

  - id: rust-hex-crate-source
    desc: Rust hex crate source path in WASM
    conf: 0.85
    if:
      type: text
      regex: 'hex-[0-9]+\.[0-9]+\.[0-9]+[\\/]src[\\/]lib\.rs'

  # Client-side use of Sliver's BOF argument-packing API (entrypoint plus
  # typed string/wstring/int/short/file arguments serialized for a Beacon
  # Object File). Like the module path, this marks the dual-use framework's
  # tooling, not a malware variant: packing arguments is operator-side
  # plumbing, and execution happens elsewhere.
  - id: sliver-bof-args-buffer-use
    desc: Builds Sliver BOF argument buffer
    conf: 0.93
    for: [go]
    if:
      type: text
      word: BOFArgsBuffer

  - id: function-kill-session
    desc: Defines Sliver KillSession RPC handler
    crit: component
    for: [go]
    if:
      type: symbol
      kind: function
      exact: KillSession

  - id: function-open-session
    desc: Defines Sliver OpenSession RPC handler
    crit: component
    for: [go]
    if:
      type: symbol
      kind: function
      exact: OpenSession

  - id: function-close-session
    desc: Defines Sliver CloseSession RPC handler
    crit: component
    for: [go]
    if:
      type: symbol
      kind: function
      exact: CloseSession

composite_rules:
  # Server-side RPC handlers expose operator control of implant sessions.
  # This is Sliver framework functionality, not proof that this source file
  # is an implant or that the handlers were invoked on a host.
  - id: sliver-server-session-lifecycle
    desc: Sliver server handles implant session open, close, and kill RPCs
    crit: notable
    conf: 0.95
    for: [go]
    all:
      - id: sliver-go-module-path
      - id: function-kill-session
      - id: function-open-session
      - id: function-close-session

  - id: sliver-hex-traffic-encoder
    desc: Sliver hex traffic encoder WebAssembly module
    conf: 0.99
    all:
      - id: traffic-encoder-asset-path
      - id: rust-hex-crate-source
      - id: micro-behaviors/data/encode/codecs::wasm-encode-export
      - id: micro-behaviors/data/encode/codecs::wasm-decode-export
