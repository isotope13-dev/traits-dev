# al-khaser anti-analysis test tool — benign-context suppressor.
#
# al-khaser (github.com/LordNoteworthy/al-khaser) is an open-source tool that
# exercises anti-analysis checks (VM, sandbox and debugger detection) so
# defenders can verify their sandboxes catch them. Its binary therefore trips
# intent-inferring rules across anti-analysis, injection and obfuscation by
# design: enumerating analysis-tool processes, touching native memory APIs,
# and building loader API names as stack strings are its test cases, not an
# attack.
#
# Identity is anchored on the tool's own build PDB (`al-khaser.pdb`, baked in
# by its Visual Studio build) plus one of its distinctive probe-helper
# symbols. Malware that borrows al-khaser techniques will not carry the
# tool's PDB path, so the exception only quiets the genuine tool. The
# function atoms live beside the other framework markers in
# well-known/tool/offensive/frameworks/traits.yaml and are referenced, not
# duplicated, here.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  size_min: 1024
  size_max: 10485760
traits:
  - id: al-khaser-pdb-path
    desc: al-khaser tool build PDB path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'al-khaser.pdb'
composite_rules:
  - id: al-khaser-benign-context
    desc: Genuine al-khaser anti-analysis test tool
    crit: exception
    conf: 0.98
    all:
      - id: al-khaser-pdb-path
    any:
      - id: well-known/tool/offensive/frameworks::al-khaser-check-mac-addr
      - id: well-known/tool/offensive/frameworks::al-khaser-check-adapter-name
      - id: well-known/tool/offensive/frameworks::al-khaser-attempt-read-memory-wow64
      - id: well-known/tool/offensive/frameworks::al-khaser-getpeb64
      - id: well-known/tool/offensive/frameworks::al-khaser-enum-system-firmware
