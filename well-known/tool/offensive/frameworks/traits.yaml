defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000
traits:
# --- Offensive framework build recipes ---------------------------------------
#
# A container recipe or CI file that clones, builds, or is based on a named
# command-and-control or attack framework. The recipes themselves are
# unremarkable -- `git clone`, `go build`, a `FROM` line -- which is exactly
# why they scored nothing before: the only thing in the file that means
# anything is *which project* it assembles.
#
# These are the canonical repository paths, build targets, and published base
# images of each framework, so a match is an identity rather than a keyword.
# Suspicious rather than notable, on the same footing as the msfpayload
# sibling above: standing up C2 infrastructure is legitimate on an authorized
# engagement and nowhere else, so an analyst wants to be told.
- id: merlin-c2-repository
  desc: Merlin C2 framework repository
  # The file default is scripts+binaries; a build recipe is neither.
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.95
  attack: T1588.002
  if:
    type: text
    regex: '(?i)Ne0nd0g/merlin'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: merlin-server-build-target
  desc: Builds the Merlin C2 server
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.95
  attack: T1588.002
  if:
    # `go build cmd/merlinserver/main.go` -- the server half, which is the
    # operator's console rather than an implant.
    type: text
    regex: '(?i)cmd/merlinserver'
- id: hermit-c2-repository
  desc: Hermit C2 framework repository
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.95
  attack: T1588.002
  if:
    type: text
    regex: '(?i)hideckies/hermit'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: monarch-c2-base-image
  desc: Container built on the Monarch C2 image
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.93
  attack: T1588.002
  if:
    type: text
    regex: '(?im)^\s*FROM\s+[^\n]{0,20}pygrum/monarch'
- id: fsociety-toolkit-repository
  desc: fsociety attack toolkit repository
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.93
  attack: T1588.002
  if:
    type: text
    regex: '(?i)Manisso/fsociety'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: autosploit-repository
  desc: AutoSploit mass-exploitation repository
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.95
  attack: T1588.002
  if:
    # Pairs Shodan results with Metasploit modules and fires at everything it
    # finds; untargeted exploitation is not a penetration-testing workflow.
    type: text
    regex: '(?i)NullArray/AutoSploit'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: lazyown-framework-tree
  desc: LazyOwn RedTeam framework install tree
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.9
  attack: T1588.002
  if:
    # The clone URL is parameterized in its own Dockerfile, so the only stable
    # marker is the directory and service account the install lays down.
    #
    # No word boundaries: the framework's own sources spell it inside
    # identifiers (`_run_lazyown`, `lazyown_mc`), and `_` is a word character,
    # so `\blazyown\b` matched none of them. The string is distinctive enough
    # to stand alone.
    type: text
    regex: '(?i)lazyown'
# Both of the name traits below drop word boundaries for the same reason the
# lazyown sibling does: a framework's own sources spell its name inside
# identifiers and paths (`_run_lazyown`, `slackhell_run`), and `_` is a word
# character, so `\bname\b` misses exactly the files that are most certainly
# the framework. These names are distinctive enough to stand alone.
- id: kithack-framework-reference
  desc: KitHack framework reference
  # `desktop-entry` is Linux-only and is dropped from the expansion under the
  # file's [unix, windows] default, so the platform is narrowed here rather
  # than in `for:`. KitHack is Linux tooling, so nothing is lost -- and the
  # installed .desktop launcher is the copy worth catching, since its presence
  # means the framework is deployed rather than merely mentioned.
  for: [scripts, dockerfile, github-actions, desktop-entry]
  platforms: [linux]
  crit: suspicious
  conf: 0.9
  attack: T1588.002
  if:
    type: text
    regex: '(?i)kithack'
- id: slackhell-build-output
  desc: Builds the slackhell offensive tool
  for: [scripts, binaries, dockerfile, github-actions, desktop-entry]
  crit: suspicious
  conf: 0.9
  attack: T1588.002
  if:
    type: text
    regex: '(?i)slackhell'
- id: karavas-bot-package-import
  desc: Karavas C2 bot package import
  crit: suspicious
  conf: 0.92
  for: [python]
  attack: T1588.002
  if:
    # `from bot import launchers,loaders` -- the server importing its implant
    # builders. The package layout is the framework's own.
    type: text
    regex: '(?m)^\s*from\s+bot\s+import\s+launchers'
- id: karavas-command-type-enum
  desc: Karavas C2 command type enum
  crit: notable
  conf: 0.85
  for: [python]
  attack: T1588.002
  if:
    type: text
    regex: '\bCommandType\.(SHELL|MODULE)\b'
- id: metasploit-ref
  size_min: 512
  size_max: 500000000
  desc: Metasploit framework reference
  crit: notable
  conf: 0.8
  attack: T1588.002
  if:
    type: text
    word: metasploit
    case_insensitive: true
    section: ".text"
