# Realm (Spellshift) adversary-emulation C2. Its server is "Tavern", its
# implant a "Beacon", the jobs it runs are "Quests" and the scripts those
# quests execute are "Tomes".
#
# Tavern's GraphQL schema is generated by entgo, which emits a `<Type>OrderField`
# enum per model. Those enum names therefore carry Realm's own domain vocabulary
# and appear throughout the operator console's TypeScript -- which is the bulk
# of the repository and had no identity marker before. Keyed on the generated
# enum rather than the bare words, since "beacon" and "quest" on their own
# belong to half the web.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, go, json]
  size_max: 5000000
  attack: T1587.001
  mbc: B0030

traits:
  - id: realm-graphql-order-field-enum
    desc: Realm Tavern GraphQL ordering enum
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\b(Beacon|Quest|Tome|Portal)OrderField\b'

  - id: realm-graphql-id-query
    desc: Realm Tavern GraphQL id query constant
    crit: suspicious
    conf: 0.92
    if:
      # `GET_BEACON_IDS_QUERY`, `GET_QUEST_IDS_QUERY` -- the console's
      # paginated-id lookups, one per Realm model.
      type: text
      regex: '\bGET_(BEACON|QUEST|TOME|PORTAL)_[A-Z_]{2,20}_QUERY\b'

  - id: realm-tome-builder-extension
    desc: Realm Tome Builder editor extension
    crit: suspicious
    conf: 0.9
    if:
      # Realm ships a VS Code extension for authoring Tomes -- the Eldritch
      # scripts a Quest runs on a Beacon. The extension source is otherwise
      # ordinary editor plumbing and carries no schema names.
      type: text
      regex: '(?i)\bTome Builder\b'
