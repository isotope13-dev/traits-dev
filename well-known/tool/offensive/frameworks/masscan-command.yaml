defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: masscan-command-reference
    desc: Masscan address scan command reference
    crit: notable
    size_max: 500000000
    conf: 0.9
    if:
      type: text
      regex: \bmasscan\s+[0-9./]+
    not:
      - substr: .TH "MASSCAN"
      - substr: Fast scan of the Internet
      - substr: masscan <ip addresses/ranges>
  - id: masscan-rate-option
    desc: Masscan command with a scan-rate option
    crit: notable
    size_max: 500000000
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/reconprobe/
    conf: 0.85
    if:
      type: text
      regex: masscan\s+.{0,64}--?rate\s+[0-9]+
  - id: masscan-output-option
    desc: Masscan command with a list-output option
    crit: notable
    size_max: 500000000
    conf: 0.85
    if:
      type: text
      regex: masscan\s+.{0,64}-oL\s+
composite_rules:
  - id: masscan-command-syntax
    desc: References Masscan scan command syntax
    crit: notable
    size_max: 500000000
    conf: 0.9
    any:
      - id: masscan-command-reference
      - id: masscan-rate-option
      - id: masscan-output-option
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/offensive/reconprobe/
