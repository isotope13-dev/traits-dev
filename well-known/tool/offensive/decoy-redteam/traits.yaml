# decoy-redteam — autonomous red team tool for MCP servers (github.com/decoy-run/decoy-redteam, decoy.run).
# Contains an attack catalog (lib/attacks.mjs) with test payloads for MCP security assessment.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, package.json, json, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: repo-tree-member
    desc: decoy-redteam repository tree member
    if:
      type: path
      regex: '(?i)decoy-run[\\/]decoy-redteam[@ ./-]'

  - id: npm-package-name
    desc: decoy-redteam npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: decoy-redteam

  - id: attack-catalog-export
    desc: decoy-redteam attack catalog export
    for: [javascript, typescript]
    if:
      type: text
      substr: 'export const ATTACKS = ['

  - id: github-repo
    desc: decoy-redteam GitHub repository reference
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: github.com/decoy-run/decoy-redteam

composite_rules:
  - id: attack-catalog-context
    desc: decoy-redteam attack catalog context
    crit: notable
    conf: 0.99
    all:
      - id: attack-catalog-export
    any:
      - id: repo-tree-member
      - id: github-repo
