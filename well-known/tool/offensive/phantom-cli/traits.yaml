# Phantom CLI is a Go offensive-assessment router that embeds module names and
# help text for credential theft, Kerberos attacks, and lateral movement. It is
# distinct from the Python phantom-agent package on PyPI.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1003,T1558.003,T1021
  size_min: 2000000
  size_max: 20000000

traits:
  - id: phantom-cli-module-identity
    desc: Phantom CLI Go module identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.go.module.path
      exact: phantom-cli

composite_rules:
  - id: phantom-cli-credential-attack-toolkit
    desc: Phantom CLI bundles credential attack modules
    crit: hostile
    conf: 0.98
    all:
      - id: phantom-cli-module-identity
      - id: well-known/tool/offensive/mimikatz::mimikatz-process-string
      - id: micro-behaviors/os/security/auth/session::kerberoast-command-name
      - id: micro-behaviors/os/security/directory-service::dcsync-command-name
  - id: phantom-cli-lateral-movement-toolkit
    desc: Phantom CLI bundles lateral movement modules
    crit: hostile
    conf: 0.97
    all:
      - id: phantom-cli-module-identity
      - id: metadata/lang/source/naming/target::psexec-tool-reference
      - id: micro-behaviors/os/application/target/utility::wmiexec-tool-reference
