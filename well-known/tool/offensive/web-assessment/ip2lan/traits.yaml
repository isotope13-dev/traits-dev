# Ip2Lan is a local browser extension for penetration testing (web inspection,
# repeater, encoding, JWT, and payload reference cards). Its reverse shell and
# exploit templates are reference strings for authorized security assessments.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: manifest-name
    desc: Ip2Lan browser extension name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      regex: '(?i)^Ip2Lan\b'

  - id: toolkit-pentest-panel
    desc: Ip2Lan toolkit pentest panel marker
    for: [javascript]
    if:
      type: text
      substr: 'Ip2Lan — Toolkit pentest'

composite_rules:
  - id: ip2lan-pentest-toolkit
    for: [chrome-manifest, javascript, xpi]
    desc: Ip2Lan local pentest toolkit extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: toolkit-pentest-panel
