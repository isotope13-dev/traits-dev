# hackbrowser-mcp — Model Context Protocol browser security testing server (github.com/badchars/hackbrowser-mcp).
# Provides security testing tools (injection testing, CSRF, SSRF, XSS, SSTI, SQLi) via Firefox containers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, package.json, json, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: repo-tree-member
    desc: hackbrowser-mcp repository tree member
    if:
      type: path
      regex: '(?i)badchars[\\/]hackbrowser-mcp[@ ./-]'

  - id: npm-package-name
    desc: hackbrowser-mcp npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: hackbrowser-mcp

  - id: github-repo
    desc: hackbrowser-mcp GitHub repository reference
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: github.com/badchars/hackbrowser-mcp

  - id: active-tester-marker
    desc: HackBrowser active tester injection types marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Injection types: sqli, xss, ssrf, ssti, cmdi, lfi, html_injection'

composite_rules:
  - id: hackbrowser-mcp-context
    desc: hackbrowser-mcp security testing tool context
    crit: notable
    conf: 0.99
    all:
      - id: repo-tree-member
    any:
      - id: npm-package-name
      - id: github-repo
      - id: active-tester-marker
