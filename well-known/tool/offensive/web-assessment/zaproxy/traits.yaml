defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: zed-attack-proxy-description
    desc: Zed Attack Proxy file description
    if:
      type: value
      path: pe.version.description
      exact: Zed Attack Proxy by Checkmarx

  - id: zed-attack-proxy-company
    desc: ZAP publisher field
    if:
      type: value
      path: pe.version.company
      exact: ZAP

  - id: zed-attack-proxy-original-filename
    desc: ZAP Windows original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: ZAP_2_17_0_windows.exe

composite_rules:
  - id: zed-attack-proxy-pe
    desc: Official Zed Attack Proxy Windows binary
    crit: notable
    conf: 0.99
    all:
      - id: zed-attack-proxy-description
      - id: zed-attack-proxy-company
      - id: zed-attack-proxy-original-filename
