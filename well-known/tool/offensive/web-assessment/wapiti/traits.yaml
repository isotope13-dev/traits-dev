# wapiti3 — open-source web application vulnerability scanner (wapiti-scanner/wapiti).
# Its attack payload catalogs (XXE entities, directory-buster wordlists) are the
# scanner's test inputs, not implant content. The package name or a wapitiCore/
# path is only identity; a repack can carry the payload file with no scanner.
# The XXE module loads xxePayloads.ini through its own parser, so the
# exception-feeding identity requires that consuming module.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wapiti-wheel-path
    desc: wapiti3 wheel distribution path
    for: [whl]
    if:
      type: path
      regex: '(^|[\\/])wapiti3-[0-9][^\\/]*\.whl'

  - id: wapiti-package-metadata
    desc: wapiti3 package metadata name line
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?m)^Name: wapiti3\s*$'

  - id: wapiti-member-path
    desc: wapiti scanner package member path
    for: [python, text, json, data]
    if:
      type: path
      regex: '(^|[\\/])wapitiCore[\\/]'

  - id: wapiti-xxe-module-path
    desc: Wapiti XXE attack module path
    for: [python]
    conf: 0.98
    if:
      type: path
      regex: 'wapitiCore[\\/]attack[\\/]mod_xxe\.py$'

  - id: wapiti-xxe-payload-reader
    desc: Wapiti XXE module names its payload file
    for: [python]
    conf: 0.98
    if:
      type: text
      substr: 'xxePayloads.ini'

composite_rules:
  - id: wapiti-xxe-payload-consumer
    desc: Wapiti XXE module reads its payload dictionary
    for: [python]
    conf: 0.98
    all:
      - id: wapiti-xxe-module-path
      - id: wapiti-xxe-payload-reader

  - id: wapiti-package-context
    desc: wapiti3 web vulnerability scanner package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wapiti-wheel-path
      - id: wapiti-package-metadata
      - id: wapiti-member-path
