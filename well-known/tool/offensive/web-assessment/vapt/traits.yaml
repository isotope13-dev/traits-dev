# Sysdig reported this command and oracle, rather than a source release.
# Generic probes belong in objectives; attribution requires the reported markers.
defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: oracle-command
    desc: Reported VAPT identity command literal
    crit: notable
    if:
      type: literal
      exact: 'echo VAPTb3gin; id; echo VAPTfin'

composite_rules:
  - id: oracle-request
    desc: VAPT sends a command and checks execution
    crit: hostile
    conf: 0.98
    ref: https://www.sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools
    near_lines: 8
    all:
      - id: oracle-command
      - id: objectives/execution/exploit/command-execution-oracle::bracketed-id-execution-oracle
