# Evidence: https://www.sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools
# Sysdig captured the oracle command and its response checks, not a source
# release. Identify the reported probe only when it contributes to a request.
defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: oracle-command
    desc: VAPT RCE oracle command literal
    crit: notable
    if:
      type: literal
      exact: 'echo VAPTb3gin; id; echo VAPTfin'

composite_rules:
  - id: oracle-request
    desc: VAPT RCE confirmation probe request
    crit: suspicious
    conf: 0.98
    near_lines: 8
    all:
      - id: oracle-command
      - id: micro-behaviors/communications/http/request/query::requests-bracketed-identity-query
