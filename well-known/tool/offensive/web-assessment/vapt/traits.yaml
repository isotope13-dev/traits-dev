# Evidence: https://www.sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools
# Sysdig captured the oracle command and its response checks, not a source
# release. Identify the reported probe only when it contributes to a request.
defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: oracle-command
    desc: Bracketed identity command literal
    crit: notable
    if:
      type: literal
      kind: string
      regex: '^echo [\w-]{3,32};[ \t]*id;[ \t]*echo[ \t]+[\w-]{3,32}$'

  - id: oracle-response-markers
    desc: Checks two response marker strings
    crit: notable
    count_min: 2
    if:
      type: text
      regex: "['\"][\\w-]{3,32}['\"] in response\\.text"

  - id: oracle-response-uid
    desc: Checks response for uid output
    crit: notable
    if:
      type: text
      substr: "'uid=' in response.text"

composite_rules:
  - id: oracle-request
    desc: VAPT sends a command and checks execution
    crit: hostile
    conf: 0.98
    near_lines: 8
    all:
      - id: oracle-command
      - id: micro-behaviors/communications/http/request/query::requests-bracketed-identity-query
      - id: oracle-response-markers
      - id: oracle-response-uid
