defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.98
traits:
  - id: encrypted-files-message
    desc: PSRansom encrypted-files notification
    if:
      type: literal
      substr: All your files have been encrypted by PSRansom!
  - id: simulator-help
    desc: PSRansom ransomware simulation help
    if:
      type: literal
      substr: generic ransomware in PowerShell with C2 capabilities
composite_rules:
  - id: recoverable-simulator
    desc: PSRansom simulator records a local recovery key
    all:
      - id: encrypted-files-message
      - id: simulator-help
      - id: micro-behaviors/fs/write/file/append::powershell-recovery-key-note
  - id: recoverable-simulator-context
    desc: Recoverable PSRansom simulation context
    crit: exception
    all:
      - id: simulator-help
      - id: micro-behaviors/fs/write/file/append::powershell-recovery-key-note
