defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: encrypted-files-message
    desc: PSRansom encrypted-files notification
    crit: notable
    conf: 0.98
    if:
      type: literal
      substr: All your files have been encrypted by PSRansom!
composite_rules:
  - id: file-encryption-payload
    desc: PSRansom encrypts files and deletes originals
    crit: hostile
    conf: 0.99
    attack: T1486
    all:
      - id: encrypted-files-message
      - id: objectives/impact/ransom/file-operations::powershell-ransom-encrypt-and-delete
