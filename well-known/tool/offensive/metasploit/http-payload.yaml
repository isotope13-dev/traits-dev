# Framework plumbing alone does not establish payload delivery or RCE.
defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: cmdstager-mixin
    desc: Metasploit module includes command stager
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Msf::Exploit::CmdStager'

composite_rules:
  - id: http-payload-module
    desc: MSF HTTP module references payload support
    crit: notable
    conf: 0.97
    all:
      - id: well-known/tool/offensive/metasploit::remote-exploit-class-declaration
      - id: micro-behaviors/communications/http/lib/rex::rex-http-request-call
    any:
      - id: objectives/execution/exploit/http-command-injection::msf-payload-delivery-call
      - id: cmdstager-mixin
      - id: micro-behaviors/data/property/access::payload-encoded-member
      - id: well-known/tool/offensive/metasploit::meterpreter-network-payload-reference
      - id: metadata/lang/source/naming::metasploit-reverse-shell-module-label
