defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  size_min: 512
  size_max: 500000000
composite_rules:
- id: project-reference-evidence
  desc: Discriminating named-project reference evidence
  crit: component
  conf: 0.99
  any:
  - id: well-known/tool/offensive/metasploit::msfpayload
  - id: well-known/tool/offensive/metasploit::metasploit-url
  - id: well-known/tool/offensive/metasploit::osx-x86-shell-bind-tcp
  - id: well-known/tool/offensive/metasploit::meterpreter
