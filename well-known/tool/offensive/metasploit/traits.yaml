# Metasploit Framework is an openly distributed penetration-testing framework.
# These markers identify the tool; they do not make exploit, credential-theft,
# shell, injection, or payload implementations benign.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source, documents, data, zip, tar, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: archive-root-member
    desc: Metasploit Framework archive root member
    # Official source releases are commonly distributed as tar archives;
    # keep the member-path identity available for both archive families.
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/'

  - id: source-tree-member
    desc: Metasploit Framework source-tree member
    if:
      type: path
      regex: '(^|[\\/])metasploit-framework(-[0-9][0-9A-Za-z._+-]*)?[\\/]'

  - id: release-gemspec-member
    desc: Metasploit Framework gemspec member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/metasploit-framework[.]gemspec$'

  - id: release-module-tree-member
    desc: Metasploit Framework module-tree member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/modules/(auxiliary|exploits|payloads)/'

  - id: release-console-member
    desc: Metasploit Framework console launcher member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/(msfconsole|msfvenom|msfrpcd?)$'

  - id: eicar-canary-member
    desc: Metasploit EICAR AV canary member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/data/eicar[.]com$'

  - id: project-homepage
    desc: Metasploit Framework project homepage
    for: [source, ruby, text]
    if:
      type: text
      regex: '(?i)(github\.com/rapid7/metasploit-framework|docs\.metasploit\.com)'

  - id: console-marker
    desc: Metasploit command-line launcher marker
    for: [source, ruby, text]
    # The boundary characters are captured, not asserted, so `not:` below can
    # see what sits either side of the name.
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])(msfconsole|msfvenom|msfrpcd?|msfd)([^A-Za-z0-9_]|$)'
    # A guardrail denylist names the tool to refuse it, not to run it, and
    # spells the names as a bare regex alternation: `metasploit|msfconsole|
    # msfvenom`. A pipe hard against the name separates that from a real shell
    # pipeline, which always has a space or an argument before the pipe
    # (`msfvenom -p windows/... | xxd`, `cmd | msfconsole`).
    not:
      - regex: '\|msf'
      - regex: 'msf[A-Za-z0-9_]*\|'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

composite_rules:
  - id: framework-context
    desc: Recognized Metasploit Framework source or release context
    crit: notable
    conf: 0.99
    # The versioned archive root is a precise project identity marker. It is
    # also the only marker available when an extensionless ZIP is classified
    # as OOXML by the container analyzer.
    any:
      - id: archive-root-member
      - id: framework-source-release
      - id: source-tree-member
      - id: project-homepage
      - id: console-marker

  - id: framework-source-release
    desc: Metasploit Framework source release layout
    crit: notable
    conf: 0.995
    all:
      - id: archive-root-member
      - id: release-gemspec-member
      - id: release-module-tree-member
      - id: release-console-member

  # A source release intentionally ships exploit modules, payload templates,
  # and AV canaries.  That is tool content, not evidence that the archive is
  # an implant.  Keep this exception narrow: it requires the versioned root,
  # gemspec, module tree, and launcher together across the same outer input.
  - id: framework-source-release-context
    desc: Recognized Metasploit Framework source release context
    crit: exception
    conf: 0.995
    for: [archives]
    scope: outer
    all:
      - id: framework-source-release
      - id: release-console-member
