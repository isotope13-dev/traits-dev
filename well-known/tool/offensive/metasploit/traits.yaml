# Metasploit Framework is an openly distributed penetration-testing framework.
# These markers identify the tool; they do not make exploit, credential-theft,
# shell, injection, or payload implementations benign.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source, documents, data, zip, tar, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: archive-root-member
    desc: Metasploit Framework archive root member
    # Official source releases are commonly distributed as tar archives;
    # keep the member-path identity available for both archive families.
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/'

  - id: source-tree-member
    desc: Metasploit Framework source-tree member
    if:
      type: path
      regex: '(^|[\\/])metasploit-framework(-[0-9][0-9A-Za-z._+-]*)?[\\/]'

  - id: release-gemspec-member
    desc: Metasploit Framework gemspec member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/metasploit-framework[.]gemspec$'

  - id: release-module-tree-member
    desc: Metasploit Framework module-tree member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/modules/(auxiliary|exploits|payloads)/'

  - id: release-console-member
    desc: Metasploit Framework console launcher member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/(msfconsole|msfvenom|msfrpcd?)$'

  - id: eicar-canary-member
    desc: Metasploit EICAR AV canary member
    for: [zip, tar, ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^metasploit-framework-[0-9][0-9A-Za-z._+-]*/data/eicar[.]com$'

  - id: project-homepage
    desc: Metasploit Framework project homepage
    for: [source, ruby, text]
    if:
      type: text
      regex: '(?i)(github\.com/rapid7/metasploit-framework|docs\.metasploit\.com)'

  - id: console-marker
    desc: Metasploit command-line launcher marker
    # Was `for: [source, ruby, text]`, which left out shell -- so a one-liner
    # driving the console (`msfconsole -x "use exploit/multi/handler; ..."`),
    # which is how an operator actually starts a listener, carried no
    # Metasploit identity at all. Widened to every script and source language
    # plus plain text; the file default also pulls in binaries and archives,
    # which is more file types than a `type: text` matcher may claim.
    for: [scripts, source, text]
    # The boundary characters are captured, not asserted, so `not:` below can
    # see what sits either side of the name.
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])(msfconsole|msfvenom|msfrpcd?|msfd)([^A-Za-z0-9_]|$)'
    # A guardrail denylist names the tool to refuse it, not to run it, and
    # spells the names as a bare regex alternation: `metasploit|msfconsole|
    # msfvenom`. A pipe hard against the name separates that from a real shell
    # pipeline, which always has a space or an argument before the pipe
    # (`msfvenom -p windows/... | xxd`, `cmd | msfconsole`).
    not:
      - regex: '\|msf'
      - regex: 'msf[A-Za-z0-9_]*\|'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  # Rapid7 publishes the framework's support libraries as standalone gems --
  # librex and rex (the Ruby Exploitation Library itself), the split-out rex-*
  # helpers, and metasploit_payloads-mettle. None of the framework
  # source-release markers below reach them, because a released gem has no
  # `metasploit-framework-<ver>/` root, so rex-powershell's payload templates
  # (data/templates/to_mem_*.ps1.template) read as a standalone PowerShell
  # memory loader rather than as Metasploit's own payload corpus.
  - id: rex-gem-name
    desc: Rapid7 Rex or Metasploit gem name
    for: [gem]
    if:
      type: value
      path: gem.name
      regex: '(?i)^((lib)?rex(-|$)|metasploit[-_])'

  - id: rex-gem-homepage
    desc: Rapid7 Rex or Metasploit gem homepage
    for: [gem]
    if:
      type: value
      path: gem.homepage
      regex: '(?i)github[.]com/rapid7/|(^|[.])metasploit[.]com'

  - id: msf-gem-author
    desc: Metasploit gem author field
    for: [gem]
    if:
      type: value
      path: gem.authors[*]
      regex: '(?i)^Metasploit '

# --- Console-driven handler setup -------------------------------------------
#
# The markers above identify the framework as *content* (a source tree, a gem,
# a launcher name). These identify it as *infrastructure being stood up*: the
# module path, payload spec, and listener parameters an operator feeds to
# msfconsole to open a C2 listener. They read the same whether the operator
# types them, a shell script passes them via `msfconsole -x`, an .rc resource
# file holds them, or a dropper writes them out -- so they are not tied to any
# one file type.
  - id: container-base-image
    desc: Container built on a Metasploit image
    crit: notable
    conf: 0.93
    for: [dockerfile, github-actions, shell]
    if:
      # `FROM phocean/msf` -- the framework arrives in the base layer, so an
      # image that installs nothing offensive itself still ships with the
      # whole of it.
      type: text
      regex: '(?im)^\s*FROM\s+[^\n]{0,30}(metasploit|/msf)\b'

  - id: multi-handler-module
    desc: Metasploit multi/handler listener module
    for: [scripts, source, text]
    crit: suspicious
    conf: 0.9
    mbc: B0030
    attack: T1071
    if:
      type: text
      substr: exploit/multi/handler

  - id: meterpreter-reverse-payload
    desc: Meterpreter reverse or bind payload module
    for: [scripts, source, text]
    crit: suspicious
    conf: 0.9
    mbc: B0030
    attack: T1071
    if:
      # `meterpreter/reverse_tcp`, `.../reverse_http(s)`, `.../bind_tcp`.
      # The stager family name is Metasploit's own, so the path is an
      # identity, not a generic protocol string.
      type: text
      regex: 'meterpreter/(reverse|bind)_(tcp|http)'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository

  - id: staged-shell-reverse-payload
    desc: Metasploit staged reverse-shell payload module
    for: [scripts, source, text]
    crit: suspicious
    conf: 0.88
    mbc: B0030
    attack: T1071
    if:
      # Matches both spellings Metasploit uses for the non-meterpreter
      # command-shell stagers: `shell/reverse_tcp` (staged) and
      # `shell_reverse_tcp` (stageless).
      type: text
      regex: '/shell(/|_)reverse_tcp\b'

  - id: handler-lhost-parameter
    desc: Metasploit console sets listener host
    for: [scripts, source, text]
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)\bset\s+LHOST\s+\S'

  - id: handler-lport-parameter
    desc: Metasploit console sets listener port
    for: [scripts, source, text]
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)\bset\s+LPORT\s+[0-9]'

  - id: console-noninteractive-commands
    desc: Metasploit console driven non-interactively
    for: [scripts, source, text]
    crit: notable
    conf: 0.9
    if:
      # `msfconsole -q -x "<commands>"` runs a command batch with no operator
      # at the keyboard -- the form used by launcher scripts and by droppers
      # that stand a listener up unattended.
      type: text
      regex: '(?i)msfconsole[^\n]{0,40}\s-x[\s"'']'

composite_rules:
  # An operator (or a dropper acting like one) standing up a listener: the
  # framework identity, the handler module, and a reverse/bind stager, seen
  # together. Suspicious rather than hostile -- Metasploit is a legitimate
  # penetration-testing product and this is exactly how it is used on an
  # authorized engagement.
  - id: automated-handler-listener
    desc: Metasploit reverse-payload handler being started
    crit: suspicious
    conf: 0.95
    mbc: B0030
    attack: T1071
    all:
      - id: multi-handler-module
    any:
      - id: meterpreter-reverse-payload
      - id: staged-shell-reverse-payload
      - id: handler-lhost-parameter
      - id: console-noninteractive-commands
    needs: 2

  # Two independent gemspec fields, so a gem that merely borrows the name does
  # not inherit the identity.
  - id: rex-gem-context
    desc: Recognized Rapid7 Rex or Metasploit gem
    crit: notable
    conf: 0.99
    for: [gem]
    scope: outer
    needs: 2
    any:
      - id: rex-gem-name
      - id: rex-gem-homepage
      - id: msf-gem-author

  - id: framework-context
    desc: Recognized Metasploit Framework source or release context
    crit: notable
    conf: 0.99
    # The versioned archive root is a precise project identity marker. It is
    # also the only marker available when an extensionless ZIP is classified
    # as OOXML by the container analyzer.
    any:
      - id: archive-root-member
      - id: framework-source-release
      - id: source-tree-member
      - id: project-homepage
      - id: console-marker

  - id: framework-source-release
    desc: Metasploit Framework source release layout
    crit: notable
    conf: 0.995
    all:
      - id: archive-root-member
      - id: release-gemspec-member
      - id: release-module-tree-member
      - id: release-console-member

  # A source release intentionally ships exploit modules, payload templates,
  # and AV canaries.  That is tool content, not evidence that the archive is
  # an implant.  Keep this exception narrow: it requires the versioned root,
  # gemspec, module tree, and launcher together across the same outer input.
  - id: framework-source-release-context
    desc: Recognized Metasploit Framework source release context
    crit: exception
    conf: 0.995
    for: [archives]
    scope: outer
    all:
      - id: framework-source-release
      - id: release-console-member
