# Metasploit's Android Meterpreter stager. Package identity lives in the
# DEX descriptors and the UTF-16 binary manifest, not in the APK wrapper.
defaults:
  platforms: [android]
  crit: notable
  conf: 0.95
  attack: T1406,T1624.001

traits:
  - id: android-stage-dex-package
    desc: Metasploit Android stage DEX package
    for: [dex]
    if:
      type: text
      substr: Lcom/metasploit/stage/

  - id: android-stage-utf16-package
    desc: Metasploit Android stage UTF-16 package
    for: [xml]
    if:
      type: hex
      pattern: 63 00 6F 00 6D 00 2E 00 6D 00 65 00 74 00 61 00 73 00 70 00 6C 00 6F 00 69 00 74 00 2E 00 73 00 74 00 61 00 67 00 65 00

  # msfvenom template-apk wraps the payload in the host app's package
  # (stage.metasploit.com.backdooredapk), not com.metasploit.stage.
  - id: android-backdooredapk-dex-package
    desc: Metasploit backdoored APK DEX package
    for: [dex]
    if:
      type: text
      substr: Lstage/metasploit/com/backdooredapk/

  - id: android-backdooredapk-payload-class
    desc: Metasploit backdoored APK Payload class
    for: [dex]
    if:
      type: text
      substr: Lstage/metasploit/com/backdooredapk/Payload;

  - id: android-backdooredapk-utf16-package
    desc: Metasploit backdoored APK UTF-16 package
    for: [xml]
    if:
      type: hex
      pattern: 73 00 74 00 61 00 67 00 65 00 2E 00 6D 00 65 00 74 00 61 00 73 00 70 00 6C 00 6F 00 69 00 74 00 2E 00 63 00 6F 00 6D 00

composite_rules:
  - id: android-stage-hidden-loader
    desc: Metasploit Android stage hides its launcher
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex]
    all:
      - id: android-stage-dex-package
      - id: objectives/evasion/process/hidden/launcher::android-set-component-enabled-setting-reference

  - id: android-stage-boot-persist
    desc: Metasploit Android stage survives reboot
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex]
    all:
      - id: android-stage-dex-package
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action

  - id: android-stage-dynamic-dex
    desc: Metasploit Android stage loads code dynamically
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex]
    all:
      - id: android-stage-dex-package
      - id: micro-behaviors/process/create/loader::dex-class-loader

  - id: android-backdooredapk-socket
    desc: Metasploit backdoored APK opens a socket
    crit: hostile
    conf: 0.96
    for: [dex]
    all:
      - id: android-backdooredapk-dex-package
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference

  - id: android-backdooredapk-dynamic-dex
    desc: Metasploit backdoored APK loads code dynamically
    crit: hostile
    conf: 0.96
    for: [dex]
    all:
      - id: android-backdooredapk-dex-package
      - id: micro-behaviors/process/create/loader::dex-class-loader

  - id: android-backdooredapk-payload-socket
    desc: Metasploit backdoored Payload opens a socket
    crit: hostile
    conf: 0.97
    for: [dex]
    all:
      - id: android-backdooredapk-payload-class
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
