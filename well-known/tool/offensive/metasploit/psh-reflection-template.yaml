# msfvenom's `psh-reflection` PowerShell payload template
# (Msf::Util::EXE.to_win32pe_psh_reflection). The generator emits fixed helper
# names -- `func_get_proc_address`, `func_get_delegate_type` -- and `$var_`
# prefixed locals around a `$var_code` byte array, because the template is a
# format string whose only substitutions are the payload bytes and a random
# variable suffix. Cobalt Strike, Empire, Covenant and a long tail of loader
# generators ship copies of the same template, so these names identify the
# generator family rather than any one product.
#
# The helper names survive the transformation these payloads usually receive
# (Base64 command line, string concatenation of the API names, renamed
# `$var_code`), which is why each is worth matching on its own.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, javascript, html, text]
  crit: notable
  conf: 0.98
  attack: T1620

traits:
  - id: psh-template-proc-address-helper
    desc: msfvenom psh GetProcAddress helper
    if:
      type: text
      word: func_get_proc_address

  - id: psh-template-delegate-type-helper
    desc: msfvenom psh delegate-type helper
    if:
      type: text
      word: func_get_delegate_type

composite_rules:
  # Both helpers together are the template itself. Kept hostile because the
  # only thing that carries this pair is a generated in-memory payload -- the
  # generator's own copy lives in the Rex gem, which the downgrade recognizes.
  - id: psh-reflection-payload
    desc: msfvenom psh-reflection payload template
    crit: hostile
    conf: 0.98
    attack: T1620,T1059.001
    mbc: B0023
    all:
      - id: psh-template-proc-address-helper
      - id: psh-template-delegate-type-helper
    downgrade:
      any:
        - id: rex-gem-context
        - id: source-tree-member
