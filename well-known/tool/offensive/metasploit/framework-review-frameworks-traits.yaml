defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: msfpayload
  size_min: 512
  size_max: 500000000
  desc: Metasploit payload generator reference
  crit: suspicious
  conf: 0.9
  attack: T1587.001
  if:
    type: text
    substr: msfpayload
    section: rdata
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-path
- id: metasploit-url
  size_min: 512
  size_max: 500000000
  desc: Metasploit website reference
  crit: notable
  conf: 0.75
  attack: T1588.002
  if:
    type: text
    substr: 'metasploit.com'
    section: rdata
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: osx-x86-shell-bind-tcp
  size_min: 512
  size_max: 500000000
  desc: Metasploit osx/x86 bind shell
  crit: suspicious
  conf: 0.95
  platforms:
  - macos
  for:
  - macho
  if:
    type: text
    exact: 'Payload: osx/x86/shell_bind_tcp'
    section: rdata
- id: meterpreter
  size_min: 512
  size_max: 500000000
  desc: Meterpreter payload reference
  crit: notable
  conf: 0.95
  attack: T1059
  platforms:
  - windows
  if:
    type: text
    substr: "/meterpreter/"
    section: ".text"

composite_rules:
- id: metasploit-payload
  all:
  - id: well-known/tool/offensive/metasploit::project-reference-evidence
  size_min: 512
  size_max: 500000000
  desc: Metasploit payload detected
  crit: suspicious
  conf: 0.95
  attack: T1587.001
  needs: 2
  any:
  - id: well-known/tool/offensive/metasploit::msfpayload
  - id: well-known/tool/offensive/metasploit::metasploit-url
  - id: metadata/file/string/artifact::payload-label
  - id: micro-behaviors/fs/path/executable::shh-bin-path-reference
- id: metasploit-osx-shell-bind
  size_min: 512
  size_max: 500000000
  desc: Metasploit macOS x86 bind shell
  crit: hostile
  conf: 0.98
  attack: T1059.004
  for:
  - macho
  platforms:
  - macos
  all:
  - id: well-known/tool/offensive/metasploit::metasploit-payload
  - id: well-known/tool/offensive/metasploit::osx-x86-shell-bind-tcp
