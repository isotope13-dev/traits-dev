# Metasploit's stock x86 Windows EXE template reserves a 4 KiB `PAYLOAD:`
# placeholder at the start of .data and calls it after VirtualProtect. A
# payload too large for the placeholder is written to a new section, the
# entry point is moved into it, and the placeholder is left in place.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1587.001

traits:
  - id: exe-template-payload-placeholder
    desc: Metasploit EXE template payload placeholder
    crit: notable
    conf: 0.9
    if:
      type: raw
      substr: 'PAYLOAD:'
      section: data
      section_offset_range: [0, 8]

composite_rules:
  - id: exe-template-payload-moved-to-section
    desc: Metasploit EXE template with payload entry in a custom section
    crit: hostile
    conf: 0.95
    all:
      - id: exe-template-payload-placeholder
      - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
      - id: metadata/binary/section/permission::wx-section
