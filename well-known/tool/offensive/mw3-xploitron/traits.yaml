defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 33554432

traits:
  - id: mw3-xploitron-product-name
    desc: MW3-XPLOITRON game-cheat product name
    if:
      type: text
      exact: MW3-XPLOITRON
      section: .rdata

  - id: modern-warfare-target-process
    desc: Call of Duty Modern Warfare target process
    if:
      type: text
      exact: cod23-cod.exe
      section: .rdata

  - id: modern-warfare-banner
    desc: Call of Duty Modern Warfare banner
    if:
      type: text
      exact: MODERN WARFARE
      section: .rdata

composite_rules:
  - id: mw3-xploitron-tool
    desc: Recognized MW3-XPLOITRON game-cheat loader
    crit: notable
    conf: 0.995
    all:
      - id: mw3-xploitron-product-name
      - id: modern-warfare-target-process

  - id: mw3-xploitron-tool-context
    desc: Recognized MW3-XPLOITRON tool context
    crit: exception
    conf: 1.0
    all:
      - id: mw3-xploitron-product-name
      - id: modern-warfare-target-process
      - id: modern-warfare-banner

  - id: mw3-xploitron-kernel-cheat-loader
    desc: MW3-XPLOITRON installs a protected-PID kernel cheat driver
    crit: suspicious
    conf: 0.995
    all:
      - id: mw3-xploitron-tool
      - id: objectives/evasion/kernel-hide/rootkit::protection-driver-service-path
      - id: objectives/evasion/kernel-hide/rootkit::protected-pid-value
      - id: micro-behaviors/os/service/control::create-service
