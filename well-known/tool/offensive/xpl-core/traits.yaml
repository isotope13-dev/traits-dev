# xpl-core is the core schemas, policies, and registry framework for the
# XPL-Suite (XPL-Forge) by André Henrique (@mrhenrike / Vision Cybersecurity).
# It ships schemas, module dispatchers, and shell handling logic for authorized
# penetration testing and security research — not implanted malware.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, json, whl, zip, tar, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: xpl-core PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: xpl-core

  - id: project-summary
    desc: XPL-Suite shared schemas project summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: 'XPL-Suite shared schemas'

  - id: github-homepage
    desc: xpl-core GitHub repository URL
    for: [python, pkginfo, json, markdown, text]
    if:
      type: text
      substr: 'github.com/mrhenrike/xpl-core'

  - id: package-tree-member
    desc: xpl-core package tree member
    conf: 0.99
    for: [python, scripts, text, markdown, whl, pkginfo]
    if:
      type: path
      regex: '(?i)(^|[\\/])xpl_core([\\/]|-[0-9])'

  - id: shells-tree-path
    desc: xpl-core shells directory path
    for: [python]
    if:
      type: path
      regex: '(?i)xpl_core/shells/'

composite_rules:
  - id: framework-identity
    desc: xpl-core XPL-Suite security framework core
    crit: notable
    conf: 0.99
    any:
      - id: pypi-package-name
      - id: project-summary
      - id: github-homepage

  - id: offensive-module-layout
    desc: xpl-core offensive shell and module layout
    crit: notable
    conf: 0.98
    any:
      - id: package-tree-member
      - id: shells-tree-path
