defaults:
  for:
  - pe
  platforms:
  - windows
  size_min: 10000
  size_max: 2000000
  crit: notable
  conf: 0.98
traits:
- id: password-listening-command
  desc: WireTap credential phrase listening command
  if:
    type: text
    substr: listen_for_passwords
    section: .text
- id: keylogging-command
  desc: WireTap keystroke recording command
  if:
    type: text
    substr: capture_keystrokes
    section: .text
- id: audio-trigger-status
  desc: WireTap phrase-triggered recording status
  if:
    type: text
    substr: Heard interesting phrase
    section: .text
composite_rules:
- id: surveillance-command-roster
  desc: WireTap keystroke and speech surveillance command roster
  all:
  - id: password-listening-command
  - id: keylogging-command
  - id: audio-trigger-status
