# EntySec publishes Android ADB post-exploitation (Ghost) and a private
# Python stack pulled via git+ during install. A pyproject that both
# advertises ADB remote access and pins those git dependencies is the
# packaged tool, not a README mention.
defaults:
  platforms: [unix, windows, android]
  for: [pyproject.toml]
  attack: T1588.002,T1422
  crit: notable
  conf: 0.96

traits:
  - id: ghost-adb-postex-description
    desc: Package describes Ghost ADB post-exploitation
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Ghost Framework is an Android post-exploitation framework'
  - id: entysec-git-dependency
    desc: EntySec GitHub git+ dependency
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'git+https://github.com/EntySec/'
  - id: ghost-cli-entrypoint
    desc: Console script entry point for Ghost
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^ghost\s*=\s*"?ghost\.cli:main"?'

composite_rules:
  - id: ghost-adb-framework-manifest
    desc: Ghost ADB post-exploitation framework package
    crit: hostile
    conf: 0.98
    all:
      - id: ghost-adb-postex-description
      - id: entysec-git-dependency
      - id: ghost-cli-entrypoint
  - id: ghost-entysec-git-postex
    desc: EntySec git dependencies with ADB post-exploitation
    crit: hostile
    conf: 0.97
    all:
      - id: ghost-adb-postex-description
      - id: entysec-git-dependency
  - id: ghost-cli-entysec-git
    desc: Ghost CLI installed from EntySec git dependencies
    crit: hostile
    conf: 0.97
    all:
      - id: ghost-cli-entrypoint
      - id: entysec-git-dependency
