# GARUDA all-in-one is an overt, operator-driven hacking CLI: port, subdomain
# and directory scanners, a password brute-forcer, SQLi/XSS/LFI/RCE probes and
# a command that prints reverse-shell one-liners for a supplied host and port.
# It routes traffic through a default proxy chain with user-agent rotation. It
# is dual-use, not an implant: nothing it prints is executed on the host.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98
  attack: T1595

traits:
  - id: source-banner
    desc: GARUDA all-in-one banner title
    for: [python]
    if:
      type: text
      regex: 'G A R U D A\s+A L L I N O N E'

  - id: source-tagline
    desc: GARUDA stay-invisible tagline
    for: [python]
    if:
      type: text
      substr: 'Hack · Code · Exploit · Stay Invisible'

  - id: package-summary
    desc: GARUDA all-in-one hacking package summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: All-in-One Hacking & Coding Framework

  - id: wheel-package-summary
    desc: GARUDA all-in-one hacking wheel summary
    for: [whl]
    if:
      type: value
      path: METADATA::summary
      substr: All-in-One Hacking & Coding Framework

composite_rules:
  - id: source-context
    desc: GARUDA all-in-one hacking framework source
    for: [python]
    crit: suspicious
    all:
      - id: source-banner
      - id: source-tagline

  - id: package-context
    desc: GARUDA all-in-one hacking framework package
    for: [pkginfo, whl]
    crit: notable
    any:
      - id: package-summary
      - id: wheel-package-summary
