# SpecterOps Blacklight Scout — dual-use endpoint triage for local AI-agent
# artifacts (Codex, Claude Code, Cursor, Antigravity CLI). Used by authorized
# operators and as a ready-made collection catalog for post-exploitation.
defaults:
  platforms: [windows, unix]
  for: [binaries, pe, elf, macho, source, c, cpp, csharp, python, javascript, typescript, powershell, shell]
  crit: suspicious
  conf: 0.97
  size_min: 64
  size_max: 50000000

traits:
  - id: ai-path-scout-basename
    desc: Blacklight ai_path_scout loader basename
    if:
      type: text
      regex: '(?i)\bai_path_scout(-windows-x64|-managed)?(\.x64\.o|\.exe|\.so|\.dylib)?\b'

  - id: bl-scout-run-export
    desc: Blacklight Scout POSIX entrypoint symbol
    if:
      type: text
      regex: '(?i)\bbl_scout_run\b'

  - id: blacklight-sessions-cli
    desc: Blacklight sessions analysis CLI invocation
    if:
      type: text
      regex: '(?i)\bblacklight\s+sessions\b'

  - id: blacklight-include-tool-flag
    desc: Blacklight Scout --include-tool filter flag
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)--include-tool\b.{0,40}\b(codex|claude(_|-)?code|cursor|antigravity(_|-)?cli)\b'

composite_rules:
  - id: blacklight-scout-toolkit
    desc: Blacklight AI-agent artifact scout toolkit
    crit: hostile
    conf: 0.99
    attack: T1005,T1083
    all:
      - id: ai-path-scout-basename
    any:
      - id: bl-scout-run-export
      - id: blacklight-sessions-cli
      - id: blacklight-include-tool-flag
    near_bytes: 8192
