# Lyrie OMEGA — Autonomous Security Intelligence Platform (Lyrie.ai / OTT Cybersecurity LLC).
# Autonomous offensive/defensive security research core powering the HEX Scanner,
# Lyrie Intel, and exploit feasibility pipeline. Dual-use AI security evaluation
# and red-teaming tool that ships adversarial strategy prompt templates (crescendo,
# tap, pair) for endpoint testing. Recognizing this framework allows triage of
# prompt-override and adversarial testing templates as intended tool fixtures.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, pkginfo, package.json, json, text, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Lyrie-Omega package name metadata
    for: [pkginfo, package.json, json, text, markdown]
    if:
      type: value
      path: name
      regex: '(?i)^(@lyrie/[\w.-]+|lyrie-[\w.-]+)$'

  - id: package-summary
    desc: Lyrie-Omega package summary metadata
    for: [pkginfo, text, markdown]
    if:
      type: value
      path: summary
      substr: "Omega-Suite — Lyrie.ai's autonomous binary analysis"

  - id: repo-reference
    desc: Lyrie-Omega repository reference
    for: [source, scripts, package.json, pkginfo, json, text, markdown]
    if:
      type: text
      substr: "OTT-Cybersecurity-LLC/lyrie-ai"

  - id: cli-entrypoint
    desc: Lyrie-Omega console script entrypoint
    for: [text]
    if:
      type: text
      regex: '(?m)^(lyrie|lyrie-omega)\s*=\s*omega\.cli:main'

  - id: redteam-cli-banner
    desc: Lyrie-Omega redteam CLI banner
    for: [python, text]
    if:
      type: text
      substr: "Lyrie REDTEAM — LLM adversarial attack"

  - id: release-archive-member
    desc: Lyrie-Omega release archive member
    if:
      type: path
      regex: '(?i)lyrie[_-]omega-[0-9][\w.-]*\.(whl|tgz|tar\.gz)'

  - id: lyrie-security-poc-warning
    desc: Lyrie security PoC safety warning
    for: [scripts, source, text]
    if:
      type: text
      regex: '(?i)(LYRIE SECURITY PoC|Lyrie PoC)'

composite_rules:
  - id: lyrie-omega-framework
    desc: Lyrie-Omega autonomous security intelligence framework
    crit: notable
    conf: 0.98
    any:
      - id: package-name
      - id: package-summary
      - id: repo-reference
      - id: cli-entrypoint
      - id: redteam-cli-banner
      - id: release-archive-member
      - id: lyrie-security-poc-warning

  - id: lyrie-payload-corpus-context
    desc: Lyrie security framework payload generator context
    crit: exception
    conf: 0.99
    any:
      - id: lyrie-security-poc-warning
      - id: repo-reference
      - id: package-name
