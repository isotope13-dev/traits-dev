# XXGARUDA is an overt, operator-driven penetration-testing CLI. Its payload
# command prints labeled reverse-shell templates; it does not execute them.
# This identity context prevents those printed templates from being mistaken
# for a covert implant while retaining the tool's notable offensive features.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: XXGARUDA Python package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: xxgaruda

  - id: wheel-package-name
    desc: XXGARUDA wheel package name
    for: [whl]
    if:
      type: value
      path: METADATA::name
      exact: xxgaruda

  - id: source-module-path
    desc: XXGARUDA source module path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])xxgaruda\.py$'

  - id: product-tagline
    desc: XXGARUDA product tagline
    for: [python, pkginfo]
    if:
      type: text
      substr: 'XXGARUDA — The Ultimate Tool'

  - id: payload-generator-function
    desc: XXGARUDA payload generator function
    for: [python]
    if:
      type: symbol
      exact: generate_payloads

  - id: exploit-cli-option
    desc: XXGARUDA payload generator CLI option
    for: [python]
    if:
      type: text
      regex: '--EXPLOIT.{0,100}Payload generator'

composite_rules:
  - id: source-context
    desc: XXGARUDA penetration-testing source module
    for: [python]
    needs: 2
    any:
      - id: source-module-path
      - id: product-tagline
      - id: payload-generator-function
      - id: exploit-cli-option

  - id: package-context
    desc: XXGARUDA penetration-testing package
    for: [pkginfo, whl]
    needs: 2
    any:
      - id: package-name
      - id: wheel-package-name
      - id: product-tagline
