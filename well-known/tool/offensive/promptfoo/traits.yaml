# promptfoo — the open-source LLM evaluation and red-teaming framework
# (github.com/typpo/promptfoo, npm package `promptfoo`).
#
# A large part of the tree is deliberately offensive by design: the red-team
# plugins and strategies generate the very attacks they exist to test for
# (prompt injection, jailbreak personas, shell-injection payloads, unicode
# and base64 encodings of override prompts), the site documents those
# techniques in prose, and the test suite asserts on attack-shaped fixtures.
# That is corpus content the tool ships on purpose — it is what the tool is
# for — not behavior the package performs against the host that installs it.
defaults:
  platforms: [unix, windows]
  for: [zip, tar, npm, scripts, source, documents, data, package.json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  # Source-archive member: the versioned GitHub tree path used by registry
  # mirrors (github.com/typpo/promptfoo@<ref>/...).
  - id: repo-tree-member
    desc: promptfoo repository tree member
    if:
      type: path
      regex: '(?i)typpo[\\/]promptfoo[@ .-]'

  # Published package member: inside a release archive the analyzed path
  # carries the archive basename (promptfoo-0.123.0.tgz!!package/...), so
  # this fires on every member of the distribution — the same arrangement
  # agent-glovebox uses for file-scoped unless: clauses.
  - id: release-archive-member
    desc: promptfoo release archive member
    if:
      type: path
      regex: '(?i)(^|[^\w-])promptfoo-[0-9][0-9a-z._-]*\.(tgz|zip|tar|gem|whl)'

  # Fetched dependencies retain their PURL as the virtual outer path rather
  # than the downloaded tarball basename.
  - id: purl-package-member
    desc: promptfoo fetched package member
    if:
      type: path
      regex: '(?i)^pkg:npm/promptfoo@'

  # The distribution's own manifest names the package.
  - id: npm-package-name
    desc: promptfoo npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: promptfoo

composite_rules:
  # Recognized promptfoo red-team evaluation corpus. Referenced from the
  # unless:/downgrade: clauses of the prompt-injection, jailbreak-persona,
  # and payload-generator detections its own corpus quotes by design — the
  # same arrangement inspect_evals established for cybench/agentharm.
  - id: redteam-eval-corpus-context
    desc: Recognized promptfoo red-team evaluation corpus
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: repo-tree-member
      - id: release-archive-member
      - id: purl-package-member
      - id: npm-package-name
