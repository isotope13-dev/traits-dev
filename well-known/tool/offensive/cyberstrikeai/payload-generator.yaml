# Recognize the generator implementation, never every file in the package.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, markdown, text]
  crit: notable
  conf: 0.99
traits:
  - id: oneliner-generator-definition
    desc: CyberStrikeAI payload generator definition
    if:
      type: text
      substr: 'func GenerateOneliner(in OnelinerInput) (string, error)'
  - id: oneliner-kind-declaration
    desc: CyberStrikeAI payload-kind type declaration
    if:
      type: text
      substr: 'type OnelinerKind string'
composite_rules:
  - id: oneliner-template-generator
    desc: CyberStrikeAI formats operator payloads
    crit: exception
    all:
      - id: oneliner-generator-definition
      - id: oneliner-kind-declaration
      - id: micro-behaviors/data/format/string::go-returns-format-template
