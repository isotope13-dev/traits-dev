# Phantom Agent is an openly identified dual-use penetration-testing framework.
# Its payload generator intentionally contains exploit strings, while its secret
# manager uses an encrypted-file fallback; those source contexts must not be
# mistaken for a delivered payload or malicious obfuscation.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Phantom Agent package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: phantom-agent

  - id: package-summary
    desc: Phantom Agent offensive-security summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      exact: Autonomous Offensive Security Intelligence - AI-powered penetration testing

  - id: project-repository
    desc: Phantom Agent upstream repository
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: github.com/Usta0x001/Phantom

  - id: payload-generator-title
    desc: Phantom payload generator title
    for: [python]
    if:
      type: text
      substr: Payload Generation Tools - P6 Elite Context-Aware Enhancement

  - id: payload-generator-scope
    desc: Phantom exploit-payload generator scope
    for: [python]
    if:
      type: text
      substr: Generates XSS, SQLi, XXE, SSTI, and command injection payloads

  - id: secret-manager-class
    desc: Phantom secure secret manager class
    for: [python]
    if:
      type: text
      regex: '\bclass\s+SecureSecretsManager\b'

  - id: secret-manager-description
    desc: Phantom secret storage module description
    for: [python]
    if:
      type: text
      substr: Secure Secrets Management for Phantom.

  - id: docker-sandbox-runtime
    desc: Phantom Docker sandbox runtime
    for: [python]
    if:
      type: text
      regex: '\bcap_add\s*=\s*\["NET_ADMIN",\s*"NET_RAW"\]'

composite_rules:
  - id: phantom-agent-framework
    desc: Phantom autonomous penetration-testing framework
    crit: notable
    conf: 0.99
    for: [pkginfo, python]
    any:
      - id: package-name
      - id: package-summary
      - id: project-repository
      - id: payload-generator-title
      - id: docker-sandbox-runtime

  - id: phantom-payload-corpus-context
    desc: Phantom exploit payload corpus context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: payload-generator-title
      - id: payload-generator-scope

  - id: phantom-secret-storage-context
    desc: Phantom secure secret storage context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: secret-manager-class
      - id: secret-manager-description
