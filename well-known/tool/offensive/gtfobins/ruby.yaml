defaults:
  crit: suspicious
  for:
  - ruby
  platforms:
  - unix
  - windows
  size_max: 5000000
traits:
- id: gtfobins-ruby-file-write
  size_max: 500000000
  desc: GTFOBins Ruby file write technique
  crit: suspicious
  conf: 0.9
  attack: T1083
  if:
    type: text
    regex: ruby -e.{0,50}File\.(open|write).{0,50}w.{0,50}write
- id: gtfobins-ruby-file-read
  size_max: 500000000
  desc: GTFOBins Ruby file read technique
  crit: suspicious
  conf: 0.9
  attack: T1083
  if:
    type: text
    regex: ruby -e.{0,50}(puts\s+)?File\.read
- id: gtfobins-ruby-exec-shell
  size_max: 500000000
  desc: GTFOBins Ruby shell spawning
  crit: suspicious
  conf: 0.9
  attack: T1059
  if:
    type: text
    regex: ruby -e.{0,30}(exec|system).{0,30}(bin/(ba)?sh|sh)
- id: gtfobins-ruby-socket-exec-bridge
  size_max: 500000000
  desc: Inline Ruby socket code runs commands
  crit: component
  conf: 0.9
  attack: T1059
  if:
    type: text
    regex: ruby\s+-rsocket\s+-e[^\n]{0,300}(\b(exec|spawn|system|popen|reopen)\b|%x|`)
composite_rules:
- id: gtfobins-ruby-privilege-escalation
  size_max: 500000000
  desc: GTFOBins privilege escalation via Ruby
  crit: suspicious
  conf: 0.95
  attack: T1068
  needs: 2
  any:
  - id: micro-behaviors/process/interpreter/ruby::ruby-inline-library-flag
  - id: micro-behaviors/process/identity/setuid::ruby-setuid
  - id: objectives/privilege-escalation/elevation-control/setuid/runtime::ruby-root-shell
- id: gtfobins-ruby-file-ops
  size_max: 500000000
  desc: GTFOBins file operations via Ruby
  crit: suspicious
  conf: 0.85
  attack: T1083
  all:
  - id: micro-behaviors/process/interpreter/ruby::ruby-inline-library-flag
  any:
  - id: gtfobins-ruby-file-read
  - id: gtfobins-ruby-file-write
- id: gtfobins-ruby-reverse-shell-comp
  size_max: 500000000
  desc: GTFOBins Ruby socket shell one-liner
  crit: suspicious
  conf: 0.93
  attack: T1059
  all:
  - id: micro-behaviors/process/interpreter/ruby::ruby-inline-library-flag
  - id: objectives/command-and-control/reverse-shell/stream-bridge::ruby-tcp-socket-constructor
  - id: gtfobins-ruby-socket-exec-bridge
  unless:
  - id: metadata/path/software::eventmachine-library
- id: gtfobins-ruby-reverse-shell-execution
  size_max: 500000000
  desc: Executes GTFOBins Ruby reverse shell command
  crit: hostile
  conf: 0.98
  attack: T1059.006
  all:
  - id: gtfobins-ruby-reverse-shell-comp
  - id: micro-behaviors/process/create/exec::system-process-call
- id: gtfobins-ruby-shell
  size_max: 500000000
  desc: GTFOBins shell execution via Ruby
  crit: suspicious
  conf: 0.85
  attack: T1059
  needs: 2
  any:
  - id: micro-behaviors/process/interpreter/ruby::ruby-inline-library-flag
  - id: micro-behaviors/process/create/shell/interpreter::ruby-shell-exec
- id: gtfobins-ruby-downloader
  size_max: 500000000
  desc: GTFOBins file download and write via Ruby
  crit: suspicious
  conf: 0.95
  attack: T1105
  all:
  - id: micro-behaviors/process/interpreter/ruby::ruby-inline-library-flag
  - id: micro-behaviors/communications/http/lib/netlib::open-uri
  any:
  - id: micro-behaviors/fs/write/file/copy::io-copy-stream
  - id: micro-behaviors/fs/write/file/copy::ruby-io-copy-stream-call-text
