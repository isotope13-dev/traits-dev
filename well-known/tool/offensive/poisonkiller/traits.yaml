defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.95
  size_min: 512
  size_max: 10485760

traits:
  - id: poisonkiller-pdb-path
    desc: PoisonKiller build PDB path
    for: [pe, dll]
    conf: 0.98
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[/\\])PoisonKiller\.pdb$'

  - id: poisonkiller-driver-response-prompt
    desc: PoisonKiller driver response status line
    if:
      type: text
      substr: '[*] Driver response:'

  - id: poisonkiller-terminated-prompt
    desc: PoisonKiller process-terminated status line
    if:
      type: text
      exact: '[+] Process terminated'

composite_rules:
  - id: poisonkiller-byovd-tool
    desc: PoisonKiller BYOVD process termination utility
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1068
    all:
      - id: micro-behaviors/os/kernel/device::kernel-device-io-control
      - id: poisonkiller-driver-response-prompt
    any:
      - id: poisonkiller-pdb-path
      - id: poisonkiller-terminated-prompt
      - id: objectives/impact/degrade/edr/teardown::byovd-poisonkiller
