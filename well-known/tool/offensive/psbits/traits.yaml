# PSBits is Grzegorz Tworek's published Windows internals and security
# research collection. Its source tree intentionally contains credential-
# access demonstrations, DNS transfer proofs of concept, and privilege/service
# utilities alongside DFIR and administration tools.
defaults:
  platforms: [windows]
  for: [source, scripts, binaries, text]
  crit: notable
  conf: 0.99
  size_max: 100000000

traits:
  - id: source-tree-member
    desc: PSBits security research source member
    if:
      type: path
      regex: '(?i)[\\/]gtworek[\\/]psbits@v[0-9]'
  - id: author-release-pdb
    desc: Grzegorz Tworek security research release build
    for: [pe, dll]
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)^C:\\Users\\GrzegorzTworek\\source\\repos\\.+\\x64\\Release\\.+\.pdb$'
