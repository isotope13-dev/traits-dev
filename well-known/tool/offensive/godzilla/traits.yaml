defaults:
  platforms: [linux, macos, windows]
  for: [java, class]

traits:
  - id: godzilla-cryption-interface
    desc: GODZILLA framework Cryption interface
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: core.imp.Cryption
  - id: godzilla-shell-entity
    desc: GODZILLA framework ShellEntity import
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: core.shell.ShellEntity
  - id: godzilla-payload-import
    desc: GODZILLA framework Payload import
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: core.imp.Payload
  - id: godzilla-cryption-annotation
    desc: GODZILLA framework CryptionAnnotation
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: CryptionAnnotation
  - id: godzilla-secret-key-x
    desc: GODZILLA ShellEntity getSecretKeyX accessor
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: getSecretKeyX
  - id: godzilla-shell-entity-name
    desc: GODZILLA ShellEntity type name
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: core/shell/ShellEntity
  - id: godzilla-cryption-type-name
    desc: GODZILLA Cryption type name
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: core/imp/Cryption
  - id: godzilla-payload-type-name
    desc: GODZILLA Payload type name
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: core/imp/Payload
  - id: godzilla-project-url
    desc: GODZILLA project repository URL
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)BeichenDream/Godzilla|beichendram/Godzilla'
  - id: godzilla-gitee-config-url
    desc: GODZILLA gitee application config URL
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: GITEE_CONFIG_URL

composite_rules:
  - id: godzilla-framework-contracts
    desc: GODZILLA framework API identity cluster
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: godzilla-cryption-interface
      - id: godzilla-shell-entity
      - id: godzilla-payload-import
      - id: godzilla-cryption-annotation
      - id: godzilla-secret-key-x
      - id: godzilla-shell-entity-name
      - id: godzilla-cryption-type-name
      - id: godzilla-payload-type-name
