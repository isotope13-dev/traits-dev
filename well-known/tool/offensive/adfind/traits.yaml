# AdFind is a legitimate, unsigned Active Directory query utility that is
# commonly used by operators and also frequently abused for reconnaissance.
# Keep its identity separate from the discovery objective so embedded help text
# is not mistaken for a query being executed.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000000
  size_max: 2000000
  crit: notable
  conf: 0.99

traits:
  - id: adfind-command
    desc: AdFind command-line tool reference
    if:
      type: text
      regex: '(?i)\badfind(\.exe)?\b'
      section: .data

  - id: adfind-product-name
    desc: AdFind PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: AdFind
      case_insensitive: true

  - id: adfind-internal-name
    desc: AdFind PE internal-name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: adfind
      case_insensitive: true

  - id: joeware-company
    desc: AdFind joeware publisher metadata
    if:
      type: value
      path: pe.version.company
      exact: http://www.joeware.net
      case_insensitive: true

composite_rules:
  - id: adfind-tool
    desc: AdFind Active Directory query utility
    crit: notable
    conf: 0.99
    all:
      - id: adfind-product-name
      - id: adfind-internal-name
      - id: joeware-company

  - id: adfind-binary-context
    desc: AdFind PE identity context
    crit: exception
    conf: 1.0
    all:
      - id: adfind-tool
      - id: adfind-command
