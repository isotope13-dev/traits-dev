# mcpsec (PyPI) — MIT scanner for MCP servers. Payload lists (SQLi, SSRF,
# traversal, xp_cmdshell, PHP request shells) are test corpus for authorized
# assessment of AI tool connections, not an implant.
defaults:
  platforms: [unix, windows]
  for: [python, text, scripts, source, whl, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: package-tree-member
    desc: mcpsec package tree or wheel
    conf: 0.99
    if:
      type: path
      regex: '(?i)mcpsec'

  - id: github-repo
    desc: mcpsec GitHub repository
    for: [python, text, markdown, pkginfo]
    conf: 0.99
    if:
      type: text
      substr: github.com/manthanghasadiya/mcpsec
