# GEF — GDB Enhanced Features for Exploiters & Reverse-Engineers, the
# exploit-development GDB framework (hugsy), including the widely used bata24
# fork. Kernel-objective atoms fire on its reference data rather than hostile
# behavior: the pipe inspector decodes `struct pipe_buffer` flag names such as
# PIPE_BUF_FLAG_CAN_MERGE for display, and the kernel-info command resolves
# commit_creds/prepare_kernel_cred symbol addresses to print them. The identity
# is what an analyst wants surfaced, and the objectives reference the exception
# below from `unless:`.
defaults:
  platforms: [unix]
  for: [python, text, data]
  crit: notable
  conf: 0.97

traits:
  - id: product-banner
    desc: GEF product banner
    if:
      type: text
      substr: "GDB Enhanced Features for Exploiters"

  - id: bata24-fork-url
    desc: bata24 GEF fork update URL
    if:
      type: text
      substr: "githubusercontent.com/bata24/gef"

composite_rules:
  - id: gef-gdb-script
    desc: Recognized GEF GDB script
    crit: exception
    conf: 0.97
    any:
      - id: product-banner
      - id: bata24-fork-url
