# IndustrialXPL-Forge is an open modular OT/ICS/SCADA security research framework.
# Part of the XPL-Forge suite by André Henrique (@mrhenrike).
# It ships ICS/SCADA assessment modules, PLC/RTU protocol tools, and third-party
# PoC intel for authorized security testing and education — not implanted malware.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, json, whl, zip, tar, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: industrialxpl PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: industrialxpl-forge

  - id: project-summary
    desc: IndustrialXPL-Forge project summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: 'IndustrialXPL-Forge'

  - id: github-homepage
    desc: IndustrialXPL-Forge GitHub repository URL
    for: [python, pkginfo, json, markdown, text]
    if:
      type: text
      substr: 'github.com/mrhenrike/IndustrialXPL-Forge'

  - id: module-tree-path
    desc: industrialxpl modules directory path
    for: [python]
    if:
      type: path
      regex: '(?i)industrialxpl/modules/'

  - id: core-tree-path
    desc: industrialxpl core directory path
    for: [python]
    if:
      type: path
      regex: '(?i)industrialxpl/core/'

  - id: package-tree-member
    desc: IndustrialXPL package tree member
    conf: 0.99
    for: [python, scripts, text, markdown, whl, pkginfo]
    if:
      type: path
      regex: '(?i)(^|[\\/])industrialxpl([\\/]|_forge|-[0-9])'

  - id: authorized-use-statement
    desc: Authorized OT/ICS penetration testing disclaimer
    for: [python, pkginfo, json, markdown, text]
    if:
      type: text
      regex: '(?i)authorized(, lawful use| security testing)'

composite_rules:
  - id: framework-identity
    desc: IndustrialXPL-Forge ICS security framework
    crit: notable
    conf: 0.99
    any:
      - id: pypi-package-name
      - id: project-summary
      - id: github-homepage

  - id: offensive-module-layout
    desc: IndustrialXPL offensive OT/ICS module layout
    crit: notable
    conf: 0.98
    any:
      - id: module-tree-path
      - id: core-tree-path
      - id: package-tree-member

  - id: authorized-framework-context
    desc: Authorized IndustrialXPL-Forge research context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: framework-identity
      - id: authorized-use-statement
