# BloodHound is an Active Directory and Azure attack path management and
# graph visualization tool (SpecterOps / adaptivethreat). Its UI modal
# help texts explain Active Directory privilege abuse techniques, opsec
# considerations, and defensive remediation procedures for auditors and
# penetration testers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, manifests, documents, data, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: BloodHound source tree member
    if:
      type: path
      regex: '(?i)(^|[\\/._-])BloodHound([@._0-9\\/-]|$)'

  - id: help-text-component
    desc: BloodHound modal help text component
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)(^|[\\/])HelpTexts[\\/]'

  - id: package-manifest
    desc: BloodHound package manifest identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: bloodhound

  - id: repository-url
    desc: BloodHound upstream repository reference
    for: [package.json, text, markdown]
    if:
      type: text
      regex: '(?i)github\.com/(BloodHoundAD|adaptivethreat|SpecterOps)/BloodHound'

composite_rules:
  - id: bloodhound-tool-context
    desc: BloodHound Active Directory analysis tool context
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: source-tree-member
      - id: help-text-component
      - id: package-manifest
      - id: repository-url
