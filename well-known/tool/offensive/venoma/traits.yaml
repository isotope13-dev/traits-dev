# Venoma: a C++ Windows beacon dropper with indirect-syscall execution, built
# to load a Cobalt Strike beacon. A build record names the project tree
# VENOMA\KOBRA and its VENOMA.CPP source. Those names are specimen identifiers
# for the public tool, so they stay in this family rule. The build record is
# text, so the rule scopes to text files and is not a loader behavior rule.
defaults:
  for: [text]
  platforms: [windows]
  attack: T1055

traits:
  - id: venoma-project-tree
    desc: Build record names VENOMA KOBRA project tree
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '\\venoma\\kobra\\'

  - id: venoma-source-file
    desc: Build record tracks VENOMA.CPP source
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '\\venoma\.cpp\b'

composite_rules:
  - id: venoma-build-record
    desc: Venoma beacon-dropper project build record
    crit: hostile
    conf: 0.95
    all:
      - id: venoma-project-tree
      - id: venoma-source-file
