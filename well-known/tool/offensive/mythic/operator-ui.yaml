defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_min: 256
  size_max: 1048576
  conf: 0.99
traits:
  - id: operator-callback-import-mutation
    desc: Mythic callback-import GraphQL operation
    crit: notable
    if:
      # Tagged templates have no argument literal in the projected flow.
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @tag
          arguments: (template_string) @operation)
          (#eq? @tag "gql")
          (#match? @operation "importCallbackConfig[ \\t\\r\\n]*\\([ \\t\\r\\n]*config[ \\t\\r\\n]*:"))
        ((program
          (import_statement
            (import_clause (named_imports (import_specifier
              name: (identifier) @exported alias: (identifier) @local)))
            source: (string (string_fragment) @library))
          (_ (variable_declarator value: (call_expression
            function: (identifier) @tag
            arguments: (template_string) @operation))))
          (#eq? @library "@apollo/client")
          (#eq? @exported "gql")
          (#eq? @local @tag)
          (#match? @operation "importCallbackConfig[ \\t\\r\\n]*\\([ \\t\\r\\n]*config[ \\t\\r\\n]*:"))
  - id: operator-callback-transfer-dialog
    desc: Mythic callback-import dialog text
    crit: notable
    if:
      type: text
      substr: Import Callback Config From Other Mythic Server
  - id: operator-payload-build-mutation
    desc: Mythic payload-definition GraphQL operation
    crit: notable
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @tag
          arguments: (template_string) @operation)
          (#eq? @tag "gql")
          (#match? @operation "createPayload[ \\t\\r\\n]*\\([ \\t\\r\\n]*payloadDefinition[ \\t\\r\\n]*:"))
        ((program
          (import_statement
            (import_clause (named_imports (import_specifier
              name: (identifier) @exported alias: (identifier) @local)))
            source: (string (string_fragment) @library))
          (_ (variable_declarator value: (call_expression
            function: (identifier) @tag
            arguments: (template_string) @operation))))
          (#eq? @library "@apollo/client")
          (#eq? @exported "gql")
          (#eq? @local @tag)
          (#match? @operation "createPayload[ \\t\\r\\n]*\\([ \\t\\r\\n]*payloadDefinition[ \\t\\r\\n]*:"))
  - id: operator-payload-build-confirmation
    desc: Mythic payload build submission message
    crit: notable
    if:
      type: literal
      exact: Submitted payload to build pipeline
composite_rules:
  - id: operator-cross-server-callback-importer
    desc: Mythic C2 callback-transfer operator UI
    crit: hostile
    all:
      - id: operator-callback-import-mutation
      - id: operator-callback-transfer-dialog
  - id: operator-payload-build-interface
    desc: Mythic payload-building operator UI
    crit: hostile
    all:
      - id: operator-payload-build-mutation
      - id: operator-payload-build-confirmation
