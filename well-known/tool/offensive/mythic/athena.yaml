defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: mythic-athena-source-tree-path
    desc: Mythic Athena agent source tree path
    for: [csharp, python]
    size_max: 10485760
    if:
      type: path
      regex: '(?i)(mythicagents|Payload_Type[\\/]athena)'

  - id: mythic-athena-container-image
    desc: Mythic Athena container image reference
    for: [dockerfile, shell, python, json]
    size_max: 10485760
    if:
      type: text
      substr: 'ghcr.io/mythicagents/athena'

  - id: mythic-athena-capabilities-manifest
    desc: Mythic Athena agent capabilities manifest
    for: [json]
    size_max: 10485760
    if:
      type: path
      basename: true
      exact: agent_capabilities.json

composite_rules:
  - id: mythic-athena-source-tree
    desc: Mythic Athena agent source tree
    crit: notable
    conf: 0.98
    any:
      - id: mythic-athena-source-tree-path
      - id: mythic-athena-container-image
      - id: mythic-athena-capabilities-manifest
