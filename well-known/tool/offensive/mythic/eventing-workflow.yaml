# Mythic eventing workflows are YAML documents that the C2 server runs on a
# trigger. A step that creates a payload and attaches a C2 profile schedules an
# agent build with its callback channel already configured.
defaults:
  platforms: [unix, windows]
  for: [yaml]
  size_max: 65536

traits:
  - id: mythic-eventing-payload-create-step
    desc: Mythic eventing step creates a payload
    crit: notable
    conf: 0.9
    if:
      type: value
      path: steps[*].action
      exact: payload_create

  - id: mythic-eventing-agent-payload-type
    desc: Mythic eventing step names an agent type
    crit: notable
    conf: 0.9
    if:
      type: value
      path: steps[*].action_data.payload_type
      exists: true

  - id: mythic-eventing-c2-profile-attached
    desc: Mythic eventing step attaches C2 profile
    crit: notable
    conf: 0.9
    if:
      type: value
      path: steps[*].action_data.c2_profiles
      exists: true

composite_rules:
  - id: mythic-eventing-scheduled-agent-build
    desc: Mythic workflow builds a C2 agent with a callback profile
    crit: hostile
    conf: 0.92
    attack: T1587.001
    all:
      - id: mythic-eventing-payload-create-step
      - id: mythic-eventing-agent-payload-type
      - id: mythic-eventing-c2-profile-attached
