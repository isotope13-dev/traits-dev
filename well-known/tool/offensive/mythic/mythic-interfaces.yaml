defaults:
  platforms: [unix, windows]

traits:
  - id: mythic-agent-message-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic agent message webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: AgentMessageWebhook
  - id: mythic-create-payload-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic create payload webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: CreatePayloadWebhook
  - id: mythic-create-task-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic create task webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: CreateTaskWebhook
  - id: mythic-create-credential-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic credential webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: CreateCredentialWebhook
  - id: mythic-create-keylog-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic create keylog webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: CreateKeylogWebhook
  - id: mythic-start-profile-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic start profile webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: StartStopC2ProfileWebhook
  - id: mythic-profile-status-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic profile status webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: C2ProfileStatusWebhook
  - id: mythic-profile-output-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic profile output webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: C2ProfileOutputWebhook
  - id: mythic-profile-sample-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic profile sample webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: C2ProfileSampleMessageWebhook
  - id: mythic-parameter-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic parameter webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: CreateC2ParameterInstanceWebhook
  - id: mythic-api-token-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic api token webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: GenerateAPITokenWebhook
  - id: mythic-password-update-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic password update webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: UpdateOperatorPasswordWebhook
  - id: mythic-secrets-webhook
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic secrets webhook symbol reference
    if:
      type: symbol
      kind: identifier
      exact: GetSecretsWebhook
  - id: mythic-profile-sync-message
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic C2 profile synchronization schema
    if:
      type: text
      regex: 'C2SyncMessage[\s\S]{0,520}(c2_profile|C2profile|c2Sync)'
      case_insensitive: true
  - id: mythic-profile-autostart
    crit: notable
    for: [go]
    conf: 0.9
    desc: Mythic profile update and autostart references
    if:
      type: text
      regex: 'updateC2Parameters[\s\S]{0,700}autoStartC2Profile'
  - id: mythic-bulk-download-webhook-symbol
    for: [go]
    desc: Mythic bulk download webhook symbol reference
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: DownloadBulkFilesWebhook
  - id: mythic-download-tag-identifier
    for: [go]
    desc: Mythic download tagging identifier
    crit: notable
    conf: 0.8
    if:
      type: text
      word: tagTypeDownload
  - id: mythic-event-import-webhook-symbol
    for: [go]
    desc: Mythic event import webhook symbol reference
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: EventingImportWebhook

composite_rules:
  - id: mythic-profile-sync-controller
    for: [go]
    conf: 0.9
    desc: Mythic profile sync and autostart interface
    crit: notable
    all:
      - id: well-known/tool/offensive/mythic::mythic-profile-sync-message
      - id: well-known/tool/offensive/mythic::mythic-profile-autostart
  - id: mythic-teamserver-web-routes
    for: [go]
    conf: 0.9
    desc: Mythic operator and agent HTTP interface roster
    crit: notable
    all:
      - id: micro-behaviors/communications/http/server/route::go-agent-message-path-literal
      - id: well-known/tool/offensive/mythic::mythic-agent-message-webhook
    needs: 2
    any:
      - id: well-known/tool/offensive/mythic::mythic-create-payload-webhook
      - id: well-known/tool/offensive/mythic::mythic-create-task-webhook
      - id: well-known/tool/offensive/mythic::mythic-create-credential-webhook
      - id: well-known/tool/offensive/mythic::mythic-create-keylog-webhook
      - id: well-known/tool/offensive/mythic::mythic-start-profile-webhook
      - id: well-known/tool/offensive/mythic::mythic-profile-status-webhook
      - id: well-known/tool/offensive/mythic::mythic-profile-output-webhook
      - id: well-known/tool/offensive/mythic::mythic-profile-sample-webhook
      - id: well-known/tool/offensive/mythic::mythic-parameter-webhook
      - id: well-known/tool/offensive/mythic::mythic-api-token-webhook
      - id: well-known/tool/offensive/mythic::mythic-password-update-webhook
      - id: well-known/tool/offensive/mythic::mythic-secrets-webhook
      - id: micro-behaviors/communications/http/server/auth::go-jwt-auth-middleware-symbol
      - id: micro-behaviors/communications/http/server/auth::go-cookie-auth-middleware-symbol
  - id: mythic-bulk-download-interface
    for: [go]
    desc: Mythic bulk file download and tagging interface
    crit: notable
    conf: 0.9
    all:
      - id: well-known/tool/offensive/mythic::mythic-bulk-download-webhook-symbol
      - id: micro-behaviors/data/parse/vocabulary::agent-file-id-field
      - id: well-known/tool/offensive/mythic::mythic-download-tag-identifier
      - id: micro-behaviors/data/property/access::go-filemeta-path-reference
  - id: mythic-event-import-interface
    for: [go]
    desc: Mythic event definition import interface
    crit: notable
    conf: 0.88
    all:
      - id: well-known/tool/offensive/mythic::mythic-event-import-webhook-symbol
      - id: micro-behaviors/communications/http/server/request::go-save-uploaded-file-symbol
      - id: micro-behaviors/data/parse/keywords::go-eventing-ingest-symbol
  - id: mythic-tasking-fields
    for: [elf, macho, pe, go]
    size_min: 512
    size_max: 524288000
    desc: Mythic tasking protocol field roster
    crit: notable
    conf: 0.98
    needs: 5
    any:
      - id: objectives/command-and-control/backdoor/rat/keywords::file-browser-word
      - id: micro-behaviors/data/parse/vocabulary::tasking-size-field
      - id: micro-behaviors/data/parse/vocabulary::delegate-tasks-field
      - id: micro-behaviors/data/parse/vocabulary::task-id-field
      - id: micro-behaviors/data/parse/vocabulary::is-screenshot-field
      - id: micro-behaviors/fs/file/stat::is-file-identifier
      - id: micro-behaviors/data/parse/vocabulary::c2-profile-field
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

