defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go.mod
  size_min: 128
  size_max: 1048576
  crit: notable
traits:
- id: mythic-container-python-package
  desc: Mythic C2 Python service SDK
  conf: 0.99
  for:
  - whl
  if:
    type: value
    path: whl.distribution
    exact: mythic_container
- id: mythic-go-module-path
  desc: Mythic C2 Go module path
  conf: 0.96
  if:
    type: text
    regex: (?m)^module\s+github\.com/its-a-feature/Mythic\s*$
- id: mythic-ui-component-namespace
  desc: Mythic operator UI component namespace
  conf: 0.92
  for:
  - javascript
  - typescript
  size_min: 1
  size_max: 5000000
  if:
    type: text
    regex: \bMythic[A-Z][A-Za-z]{4,24}\b
  count_min: 2
composite_rules:
- id: mythic-c2-server-go-manifest
  desc: Mythic server dependency manifest
  conf: 0.98
  all:
  - id: mythic-go-module-path
  needs: 3
  any:
  - id: metadata/package/dependencies/identity::go-http-router-module-reference
  - id: metadata/import/package::go-rabbitmq-amqp091-dependency
  - id: metadata/import/package::go-sql-migrate-dependency
  - id: micro-behaviors/communications/grpc::grpc-go-import
