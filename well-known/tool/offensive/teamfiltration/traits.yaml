# TeamFiltration's default configuration pins an obsolete Teams/Electron
# user-agent. Proofpoint observed the complete value as a stable attribution
# fingerprint; ordinary modern Teams clients do not emit it.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, csharp, json]
  crit: notable
  conf: 0.99
  size_min: 128
  size_max: 100000000

traits:
  - id: default-teams-user-agent
    desc: TeamFiltration default legacy Teams user-agent
    if:
      type: text
      substr: 'Teams/1.3.00.30866 Chrome/80.0.3987.165 Electron/8.5.1 Safari/537.36'
