defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 20971520

traits:
  - id: dmsoft-com-clsid-string
    desc: DmSoft COM automation CLSID string
    crit: notable
    conf: 0.98
    if:
      type: text
      section: any
      substr: "26037A0E-7CBD-4FFF-9C63-56F2D0770214"

  - id: dmsoft-progid-string
    desc: DmSoft COM automation ProgID string
    crit: notable
    conf: 0.98
    if:
      type: text
      section: any
      substr: "dm.dmsoft"

composite_rules:
  - id: dmsoft-game-automation-plugin
    desc: DmSoft game automation and cheat tool
    crit: hostile
    conf: 0.98
    all:
      - id: dmsoft-com-clsid-string
      - id: dmsoft-progid-string
