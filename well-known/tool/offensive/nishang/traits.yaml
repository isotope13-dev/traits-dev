# Nishang — samratashok's PowerShell offensive framework. Scripts are openly
# published and used by red teams and attackers alike, and most components
# (encoders, decoders, scan helpers) are dual-use utilities with no hostile
# behavior of their own. Attribution is the signal: a script that declares
# itself part of Nishang, or carries its canonical GitHub URL, is offensive
# tooling an analyst should see, without claiming a specific attack pattern.
defaults:
  platforms: [windows]
  for: [powershell]
  conf: 0.9

traits:
  - id: nishang-github-url
    desc: Nishang framework GitHub attribution
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: samratashok/nishang

  - id: nishang-script-header
    desc: Nishang framework script or payload header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnishang\s+(payload|script)\b|script for nishang\b'

composite_rules:
  - id: nishang-token-theft-tool
    desc: Nishang token duplication and impersonation tool
    crit: hostile
    conf: 0.99
    attack: T1134.001
    all:
      - id: objectives/privilege-escalation/token-manipulation::powershell-lsass-thread-token-theft
    any:
      - id: nishang-github-url
      - id: nishang-script-header
