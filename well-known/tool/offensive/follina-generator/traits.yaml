# Public CVE-2022-30190 (Follina) document generators: follina.py and its
# forks write the oleObject relationship as rId996 with a "!"-suffixed URL.
defaults:
  platforms: [windows]
  for: [zip, ooxml, xml]
  attack: T1203,T1588.005

traits:
  # Word numbers relationships from rId1 upward; the generators hardcode
  # rId996 on the oleObject relationship they add.
  - id: rels-oleobject-rid996
    desc: OLE object relationship uses generator id rId996
    crit: notable
    for: [xml]
    if:
      type: text
      regex: '<Relationship Id="rId996" Type="[^"]{0,90}/relationships/oleObject"'

composite_rules:
  - id: follina-generator-document
    desc: Document built by a public Follina exploit generator
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: rels-oleobject-rid996
      - id: metadata/document/office/markup::rels-oleobject-target-moniker-bang
