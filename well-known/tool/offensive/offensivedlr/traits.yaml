defaults:
  size_min: 200
  size_max: 12000000
  for: [powershell]
  platforms: [windows]
traits:
  - id: extra-exec-module-functions-c
    desc: OffensiveDLR IronPython wrapper functions
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-(IronPython|IronPython3)\b'

  - id: extra-exec-module-functions-d
    desc: OffensiveDLR Boo and SSharp wrapper functions
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-(Boolang|SSharp)\b'

  - id: clearscript-engine-function
    desc: OffensiveDLR ClearScript wrapper function
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*function\s+Invoke-ClearScript\b'

