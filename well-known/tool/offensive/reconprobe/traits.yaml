# ReconProbe is an open-source pentest reconnaissance framework. Reverse-shell
# strings in payload_gen.py are generator templates for authorized testing,
# not a host implant.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: package-name
    desc: ReconProbe PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: reconprobe

  - id: wheel-package-name
    desc: ReconProbe wheel package name
    for: [whl]
    if:
      type: value
      path: METADATA::name
      exact: reconprobe

  - id: github-repository
    desc: ReconProbe GitHub repository URL
    if:
      type: text
      substr: github.com/Yash-Patil-1/reconprobe

  - id: package-member-path
    desc: ReconProbe package member path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])reconprobe[\\/]'

  - id: package-import
    desc: ReconProbe package import path
    for: [python]
    if:
      type: text
      substr: from reconprobe.

  - id: payload-gen-docstring
    desc: ReconProbe payload generator docstring
    for: [python]
    if:
      type: text
      substr: 'Reverse shell & payload generator for ReconProbe.'

  - id: bash-revshell-generator
    desc: ReconProbe bash reverse-shell generator
    for: [python]
    if:
      type: text
      substr: 'def generate_bash_reverse_shell('

  - id: cli-banner
    desc: ReconProbe ASCII banner marker
    for: [python]
    if:
      type: text
      substr: 'RECONPROBE / |'

  - id: json-tool-field
    desc: ReconProbe JSON report tool field
    for: [python]
    if:
      type: text
      substr: '"tool": "ReconProbe"'

  - id: pdf-report-title
    desc: ReconProbe PDF report title
    for: [python]
    if:
      type: text
      substr: 'ReconProbe — Security Assessment Report'

  - id: recon-pdf-class
    desc: ReconProbe PDF report class
    for: [python]
    if:
      type: text
      substr: 'class _ReconPDF'

composite_rules:
  - id: reconprobe-package
    desc: ReconProbe pentest reconnaissance package
    for: [pkginfo, whl]
    scope: outer
    needs: 2
    any:
      - id: package-name
      - id: wheel-package-name
      - id: github-repository

  - id: reconprobe-source-tree
    desc: ReconProbe pentest source module
    for: [python]
    needs: 2
    any:
      - id: package-import
      - id: package-member-path
      - id: payload-gen-docstring
      - id: bash-revshell-generator
      - id: cli-banner
      - id: json-tool-field
      - id: pdf-report-title
      - id: recon-pdf-class
      - id: github-repository
