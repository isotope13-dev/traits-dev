# RaxuisCLI -- open-source Go "offensive security toolkit" for authorized
# testing and CTFs (github.com/Raxuis/RaxuisCLI). Most commands are
# informational: they print technique cheat sheets, generate example
# commands, and hold payload lists (LFI/XXE/SQLi wordlists, persistence and
# tunnelling examples) that the operator sends at a target they are cleared
# to test. The attack strings are catalog data, never executed on the host
# running the tool.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  # Fires on every member of the published source tree so file-scoped unless
  # clauses can recognise the toolkit's catalog and payload files without
  # pooling the whole archive.
  - id: source-tree-path
    desc: Path under RaxuisCLI source tree
    for: [go, php, markdown, makefile, text, json, yaml]
    size_min: 1
    if:
      type: path
      regex: '(?i)raxuis/raxuiscli'
