defaults:
  platforms: [windows]
  for: [pe, powershell]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 20000000
traits:
  - id: pr1v3sc-checks-namespace
    desc: PEASS renamed winPEAS checks namespace
    if:
      type: text
      exact: Pr1v3sc.Checks
      section: .text
  - id: pr1v3sc-audit-banner
    desc: PEASS local escalation audit banner
    if:
      type: text
      substr: Pr1v3sc is a binary to enumerate possible paths
      section: .text
  - id: winpeas-wrapper-function
    desc: winPEAS PowerShell wrapper function
    for: [powershell]
    if:
      type: function
      exact: Invoke-winPEAS
  - id: winpeas-wrapper-entry
    desc: winPEAS renamed assembly entry invocation
    for: [powershell]
    if:
      type: text
      substr: '[Pr1v3sc.Program]::Main('
  - id: winpeas-checks-namespace
    desc: winPEAS audit checks namespace
    for:
    - pe
    if:
      type: text
      exact: winPEAS.Checks
      section: .text
  - id: winpeas-local-credential-audit-namespace
    desc: winPEAS local browser credential audit namespace
    for:
    - pe
    if:
      type: text
      exact: winPEAS.KnownFileCreds.Browsers.Chrome
      section: .text
composite_rules:
  - id: winpeas-audit-assembly
    desc: PEASS winPEAS local security audit assembly
    for: [pe]
    all:
      - id: pr1v3sc-checks-namespace
      - id: pr1v3sc-audit-banner
  - id: winpeas-audit-wrapper
    desc: PowerShell wrapper invokes winPEAS audit entry
    for: [powershell]
    all:
      - id: winpeas-wrapper-function
      - id: winpeas-wrapper-entry
  - id: winpeas-current-audit-assembly
    desc: winPEAS local privilege and credential auditing assembly
    for:
    - pe
    all:
    - id: winpeas-checks-namespace
    - id: winpeas-local-credential-audit-namespace
