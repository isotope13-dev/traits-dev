# The release script concatenates every check, so a container token read
# and an AWS metadata query land in one file. Those are printed audit
# sections, identified by the script's own user agent and section title.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: linpeas-module-author
    desc: LinPEAS module author header
    if:
      type: text
      substr: '# Author: Carlos Polop'
  - id: linpeas-user-agent
    desc: LinPEAS audit script user agent
    if:
      type: text
      substr: 'User-Agent: linpeas'
  - id: linpeas-container-audit-title
    desc: LinPEAS container breakout audit section
    if:
      type: text
      substr: 'print_2title "Container & breakout enumeration"'
  - id: linpeas-host-checker-hostname-payload
    desc: LinPEAS host-checker builds hostname field
    crit: component
    if:
      type: text
      regex: '(?s)linpeas_host_checker_payload\(\)\s*\{.{0,100}hostname\s+2>/dev/null.{0,240}"hostname"'
  - id: linpeas-host-checker-post-payload
    desc: LinPEAS host-checker posts its generated payload
    crit: component
    if:
      type: text
      regex: '--(data-binary|post-data)\s+"\$_hacktricks_payload"'
  - id: linpeas-host-checker-payload-binding
    desc: LinPEAS host-checker payload binding
    crit: component
    if:
      type: text
      substr: '_hacktricks_payload="$(linpeas_host_checker_payload)"'

composite_rules:
  - id: linpeas-audit-script
    desc: LinPEAS local privilege-escalation audit script
    all:
      - id: linpeas-user-agent
      - id: linpeas-container-audit-title
  - id: linpeas-host-checker-hostname-post
    desc: LinPEAS host-checker hostname POST indicators
    all:
      - id: linpeas-audit-script
      - id: linpeas-host-checker-hostname-payload
      - id: linpeas-host-checker-post-payload
      - id: linpeas-host-checker-payload-binding
