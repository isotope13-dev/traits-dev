defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 1000000
traits:
- id: managed-prompt-entry
  desc: SharpLoginPrompt credential-prompt entry call
  if:
    type: text
    regex: (?i)\[SharpLoginPrompt\.Program\]::main\s*\(
composite_rules:
- id: inmemory-prompt-payload
  desc: Loads and invokes SharpLoginPrompt credential phishing payload
  crit: hostile
  all:
  - id: managed-prompt-entry
  - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
