defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: native-credential-output-label
  desc: SharpLoginPrompt plaintext password result label
  if:
    type: text
    section: .text
    exact: 'Password = '
  size_min: 4096
  size_max: 10000000
- id: native-prompt-class
  desc: SharpLoginPrompt credential capture class
  if:
    type: text
    section: .text
    exact: SharpLoginPrompt
  size_min: 4096
  size_max: 10000000
composite_rules:
- id: native-password-harvest-payload
  desc: SharpLoginPrompt compiled password harvester
  crit: hostile
  all:
  - id: native-prompt-class
  - id: native-credential-output-label
  - id: micro-behaviors/ui/dialog/prompt::managed-native-credential-prompt-name
  - id: micro-behaviors/ui/dialog/prompt::managed-credential-buffer-unpack-name
