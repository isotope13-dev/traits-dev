defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: native-token-impersonation-failure
  desc: SweetPotato token impersonation diagnostic
  if:
    type: text
    section: .text
    substr: '[!] Failed to impersonate security context token'
  size_min: 4096
  size_max: 10000000
- id: native-token-process-failure
  desc: SweetPotato token process failure diagnostic
  if:
    type: text
    section: .text
    substr: '[!] Failed to created impersonated process with token:'
  size_min: 4096
  size_max: 10000000
composite_rules:
- id: native-impersonation-exploit
  desc: SweetPotato compiled impersonation exploit
  crit: hostile
  all:
  - id: native-token-impersonation-failure
  - id: native-token-process-failure
  - id: micro-behaviors/os/privilege/token
