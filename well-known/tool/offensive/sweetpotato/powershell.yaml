defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 5000000
traits:
- id: powershell-entry-call
  desc: SweetPotato exploit entry invocation
  if:
    type: text
    regex: (?i)\[SweetPotato\.Program\]::main\s*\(
composite_rules:
- id: inmemory-exploit-entry
  desc: SweetPotato in-memory exploit invocation
  crit: hostile
  all:
  - id: powershell-entry-call
  - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
