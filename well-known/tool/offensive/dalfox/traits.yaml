# Dalfox — open-source XSS scanner and automation utility (hahwul/dalfox).
# Payload corpora, encoding tests, and release packaging are expected; not malware.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: dalfox-crate-name
    desc: Dalfox crates.io package name
    for: [crate]
    if:
      type: value
      path: crate.name
      exact: dalfox

  - id: dalfox-upstream-repository-crate
    desc: Dalfox crate registry repository field
    for: [crate]
    if:
      type: value
      path: crate.repository
      substr: github.com/hahwul/dalfox

  - id: dalfox-upstream-repository-text
    desc: Dalfox upstream GitHub repository marker
    for: [rust, text, cargo.toml]
    if:
      type: text
      substr: github.com/hahwul/dalfox

  - id: dalfox-xss-scanner-description-crate
    desc: Dalfox XSS scanner crate description
    for: [crate]
    if:
      type: value
      path: crate.description
      regex: '(?i)XSS scanner'

  - id: dalfox-xss-scanner-description-toml
    desc: Dalfox XSS scanner Cargo.toml description
    for: [cargo.toml]
    if:
      type: value
      path: package.description
      regex: '(?i)XSS scanner'

  - id: replay-corpus-tool-field
    desc: Dalfox replay corpus tool field
    for: [json]
    if:
      type: value
      path: tool
      exact: replay_corpus

  - id: dalfox-version-field
    desc: Dalfox semantic version field
    for: [json]
    if:
      type: value
      path: dalfox_version
      regex: '^\d+\.\d+\.\d+$'

composite_rules:
  - id: dalfox-scanner-context
    desc: Dalfox XSS scanner source or crate package
    crit: exception
    conf: 0.99
    scope: archive
    for: [crate, tar, zip]
    all:
      - id: dalfox-crate-name
    any:
      - id: dalfox-upstream-repository-crate
      - id: dalfox-xss-scanner-description-crate

  - id: dalfox-replay-corpus-report
    desc: Dalfox replay corpus report
    crit: notable
    conf: 0.99
    for: [json]
    all:
      - id: replay-corpus-tool-field
      - id: dalfox-version-field
