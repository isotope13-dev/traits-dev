defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: replay-corpus-tool-field
    desc: Dalfox replay corpus tool field
    if:
      type: value
      path: tool
      exact: replay_corpus

  - id: dalfox-version-field
    desc: Dalfox semantic version field
    if:
      type: value
      path: dalfox_version
      regex: '^\d+\.\d+\.\d+$'

composite_rules:
  - id: dalfox-replay-corpus-report
    desc: Dalfox replay corpus report
    crit: notable
    conf: 0.99
    all:
      - id: replay-corpus-tool-field
      - id: dalfox-version-field
