# linsniffer — legacy Linux network password sniffer by Mike Edulla (1994),
# widely bundled in rootkit packages (e.g. LRK) to capture plaintext credentials.
defaults:
  platforms: [unix]
  for: [c, elf, shell, text]
  crit: suspicious
  conf: 0.95
  attack: T1040
  mbc: C0010
  size_max: 2097152

traits:
  - id: linsniffer-tool-name
    desc: References linsniffer network sniffing tool
    if:
      type: text
      regex: '(?i)\blinsniffer\b'

composite_rules:
  - id: linsniffer-sniffer-launch
    desc: Manages or launches linsniffer credential sniffer
    crit: hostile
    conf: 0.98
    all:
      - id: linsniffer-tool-name
    any:
      - id: micro-behaviors/fs/write/file/redirect::local-program-output-redirect
      - id: micro-behaviors/process/terminate/command::killall-with-signal
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
