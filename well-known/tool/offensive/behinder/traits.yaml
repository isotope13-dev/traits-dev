defaults:
  platforms: [unix, windows]
  for: [class, php, vbs, pe]
  attack: T1505.003
  size_min: 16
  size_max: 100000000

traits:
  - id: java-class-namespace
    desc: Behinder declared Java class namespace
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^net/rebeyond/behinder/'

  - id: default-aes-key
    desc: Behinder default AES key
    crit: notable
    conf: 0.95
    for: [class, php, vbs, pe, asp, csharp, html]
    if:
      type: text
      substr: e45e329feb5d925b

  - id: rebeyond-package-token
    desc: Behinder rebeyond package token
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: net/rebeyond/behinder
  # Two adjacent components, no leading anchor and no `!`: the same class must
  # be recognised whether the jar is scanned as an archive member or unpacked
  # to disk, and `rebeyond/behinder` is already a family-unique pair.
  - id: rebeyond-package-path
    desc: Behinder rebeyond package path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(?i)rebeyond[\\/]behinder([\\/]|$)'

  - id: core-decrypt-class-path
    desc: Behinder core decrypt class path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])Decrypt\.class$'

  - id: java-payload-namespace
    desc: Behinder declared Java payload namespace
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^net/rebeyond/behinder/payload/'

  - id: java-client-namespace
    desc: Behinder declared Java client namespace
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^net/rebeyond/behinder/(core|utils|ui|dao|entity)/'

  - id: java-echo-helper-class
    desc: Behinder Echo class without a RunCMD reference
    crit: notable
    conf: 0.99
    for: [class]
    if:
      type: value
      path: class.this_class
      exact: net/rebeyond/behinder/payload/java/Echo
    unless:
    - type: import
      exact: RunCMD

composite_rules:
  - id: family-markers
    desc: Behinder Java payload or client class identity
    crit: notable
    conf: 0.99
    for: [class]
    all:
      - id: java-class-namespace
    any:
      - id: java-payload-namespace
      - id: java-client-namespace

  - id: webshell-framework
    for:
    - class
    desc: Behinder encrypted execution or class-loading payload
    crit: hostile
    conf: 0.99
    all:
    - id: family-markers
    - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use
    - id: java-payload-namespace
    any:
    - id: objectives/command-and-control/backdoor/webshell/exec/
    - id: micro-behaviors/process/create/exec::runtime-exec-request-parameter
    - id: objectives/command-and-control/backdoor/webshell/request/command::php-shell-functional
    - id: objectives/command-and-control/backdoor/webshell/request/command::php-command-webshell
    - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-shell-execution
    - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-shell-execution-alt
    - id: objectives/command-and-control/backdoor/webshell/request/command::php-variable-command-webshell
    - id: objectives/command-and-control/backdoor/webshell/request/command::php-indirect-request-command-webshell
    - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-cmd-parameter-runtime-exec
    - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
    - id: micro-behaviors/process/create/exec::child-process-execution
    - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
    unless:
    - id: echo-response-helper-context
  # Desktop management classes are tooling identity, not injected payload.
  - id: management-client-component
    for: [class]
    desc: Behinder management client component
    crit: notable
    conf: 0.99
    all:
      - id: family-markers
      - id: java-client-namespace

  - id: payload-active-operation
    for: [class]
    desc: Behinder payload contains server-side capability references
    # The declared namespace establishes payload identity. An
    # operation atom is still valuable triage context, but repeating it as a
    # hostile verdict overcounts the same payload capability.
    crit: notable
    conf: 0.99
    all:
      - id: family-markers
      - id: java-payload-namespace
    any:
      - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/metaprogramming/reflection::java-bytecode-reflective-method-invoke
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getbyname-bytecode
      - id: micro-behaviors/communications/socket/send::java-socket-stream-write-references
      - id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode

  # Network-only payloads lack the AES helpers used by the other payload
  # rules. Require the declared payload identity plus a network capability.
  - id: payload-network-channel
    for: [class]
    desc: Behinder payload opens a network tunnel or probe channel
    crit: hostile
    conf: 0.98
    all:
      - id: family-markers
      - id: java-payload-namespace
    any:
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getbyname-bytecode
      - id: micro-behaviors/communications/socket/send::java-socket-stream-write-references
    unless:
      - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use

  # AES and reflective Base64 helpers alone also occur in inert echo classes.
  # Require a file mutation or actual process API reference for this verdict.
  - id: encrypted-payload-operations
    for:
    - class
    desc: Behinder encrypted payload with file or process operations
    crit: hostile
    conf: 0.98
    all:
    - id: family-markers
    - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use
    - id: java-payload-namespace
    any:
    - id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
    - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode
    - id: micro-behaviors/process/create/exec::child-process-execution
    - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
    unless:
    - id: echo-response-helper-context

  # The echo entry point returns content, and never calls its copied RunCMD
  # helper. Preserve that dormant execution capability as a notable finding.
  # Do not suppress variants that reference RunCMD or add other payload APIs.
  - id: echo-response-helper-context
    desc: Behinder echo helper with no command-helper invocation
    crit: exception
    for: [class]
    all:
    - id: java-echo-helper-class
    - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use
    - id: micro-behaviors/metaprogramming/reflection::java-bytecode-reflective-method-invoke
    unless:
    - id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
    - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode
    - id: micro-behaviors/communications/socket/create::java-socket-class-import
    - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
    - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
