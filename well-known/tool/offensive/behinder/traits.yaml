defaults:
  platforms: [unix, windows]
  for: [class, php, vbs, pe]
  attack: T1505.003
  size_min: 16
  size_max: 100000000

traits:
  - id: java-package-path
    desc: Behinder Java package path component
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(^|[\\/])behinder[\\/]'

  - id: default-aes-key
    desc: Behinder default AES key
    crit: component
    conf: 0.95
    if:
      type: text
      substr: e45e329feb5d925b

  - id: rebeyond-package-token
    desc: Behinder rebeyond package token
    crit: component
    conf: 0.92
    if:
      type: text
      substr: net/rebeyond/behinder
  # Two adjacent components, no leading anchor and no `!`: the same class must
  # be recognised whether the jar is scanned as an archive member or unpacked
  # to disk, and `rebeyond/behinder` is already a family-unique pair.
  - id: rebeyond-package-path
    desc: Behinder rebeyond package path
    crit: component
    conf: 0.95
    if:
      type: path
      regex: '(?i)rebeyond[\\/]behinder([\\/]|$)'

  - id: core-decrypt-class-path
    desc: Behinder core decrypt class path
    crit: component
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])Decrypt\.class$'

  - id: java-payload-path
    desc: Behinder Java payload package path
    crit: component
    conf: 0.98
    if:
      type: path
      regex: '(^|[\\/])payload[\\/]'

  # Client-side packages shipped inside Behinder.jar (management UI, crypto,
  # DAO, entities, utils). Distinct from the server-side `payload/` package.
  # The leading boundary is dropped to stay within the two-separator path
  # budget; every composite using this atom also requires java-package-path,
  # which anchors `behinder/` on its own.
  - id: java-client-package-path
    desc: Behinder Java client package path
    crit: component
    conf: 0.96
    if:
      type: path
      regex: 'behinder[\\/](core|utils|ui|dao|entity)[\\/]'

composite_rules:
  - id: family-markers
    desc: Behinder webshell framework family markers
    crit: suspicious
    conf: 0.99
    all:
      - id: java-package-path
    any:
      - id: default-aes-key
      - id: rebeyond-package-token
      - id: rebeyond-package-path
      - id: core-decrypt-class-path

  - id: webshell-framework
    desc: Behinder webshell framework capability
    crit: hostile
    conf: 0.99
    all:
      - id: family-markers
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
    any:
      - id: objectives/command-and-control/backdoor/webshell/exec/
      - id: objectives/command-and-control/reverse-shell/dup/
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke

  # Path identity alone is enough once the file sits under the Behinder
  # package tree — the directory is family-unique and does not appear in
  # benign software.
  - id: framework-package-identity
    desc: Behinder framework package identity
    crit: hostile
    conf: 0.98
    all:
      - id: java-package-path
      - id: rebeyond-package-path

  # The payload package is distinct from Behinder's client/UI and JDBC-style
  # support code. Its classes are the server-side actions delivered through a
  # webshell, so the package identity plus the family marker is sufficient to
  # identify a payload component. The second composite below requires an
  # active sink before adding another hostile signal.
  - id: payload-component
    desc: Behinder server-side webshell payload component
    crit: hostile
    conf: 0.99
    all:
      - id: family-markers
      - id: java-payload-path

  # Management JAR classes are not the injected payload, but they are still
  # Behinder offensive tooling. Pairing the family marker with a client-package
  # path yields a second independent hostile finding for those members.
  - id: management-client-component
    desc: Behinder management client component
    crit: hostile
    conf: 0.99
    all:
      - id: family-markers
      - id: java-client-package-path

  - id: payload-active-operation
    desc: Behinder payload exposes an active server-side capability
    # The package and payload composites establish the malicious identity. An
    # operation atom is still valuable triage context, but repeating it as a
    # hostile verdict overcounts the same payload capability.
    crit: notable
    conf: 0.99
    all:
      - id: family-markers
      - id: java-payload-path
    any:
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/dns/lookup/resolver::jvm-inetaddress-getbyname-bytecode
      - id: micro-behaviors/communications/socket/send::java-raw-socket-client-write
      - id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/fs/delete/file::java-file-delete-bytecode

  # Payload classes (FileOperation, Cmd, …) ship AES helpers plus filesystem
  # or process sinks. family-markers alone is only suspicious; pairing the
  # framework identity with a concrete sink is the hostile payload shape.
  - id: payload-file-ops
    desc: Behinder decrypted payload performs file or reflective operations
    crit: hostile
    conf: 0.98
    all:
      - id: family-markers
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
    any:
      - id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/fs/delete/file::java-file-delete-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke
