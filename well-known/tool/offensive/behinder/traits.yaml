defaults:
  platforms: [unix, windows]
  for: [class, php, vbs, pe]
  attack: T1505.003
  size_min: 16
  size_max: 100000000

traits:
  - id: java-class-namespace
    desc: Behinder declared Java class namespace
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^net/rebeyond/behinder/'

  - id: default-aes-key
    desc: Behinder default AES key
    crit: notable
    conf: 0.95
    for: [class, php, vbs, pe, asp, csharp, html]
    if:
      type: text
      substr: e45e329feb5d925b

  - id: rebeyond-package-token
    desc: Behinder rebeyond package token
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: net/rebeyond/behinder
  # Two adjacent components, no leading anchor and no `!`: the same class must
  # be recognised whether the jar is scanned as an archive member or unpacked
  # to disk, and `rebeyond/behinder` is already a family-unique pair.
  - id: rebeyond-package-path
    desc: Behinder rebeyond package path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(?i)rebeyond[\\/]behinder([\\/]|$)'

  - id: core-decrypt-class-path
    desc: Behinder core decrypt class path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])Decrypt\.class$'

  - id: java-payload-namespace
    desc: Behinder declared Java payload namespace
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^net/rebeyond/behinder/payload/'

  - id: java-client-namespace
    desc: Behinder declared Java client namespace
    crit: notable
    conf: 0.98
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^net/rebeyond/behinder/(core|utils|ui|dao|entity)/'

composite_rules:
  - id: family-markers
    desc: Behinder Java payload or client class identity
    crit: notable
    conf: 0.99
    for: [class]
    all:
      - id: java-class-namespace
    any:
      - id: java-payload-namespace
      - id: java-client-namespace

  - id: webshell-framework
    for: [class]
    desc: Behinder webshell framework capability
    crit: hostile
    conf: 0.99
    all:
      - id: family-markers
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
    any:
      - id: objectives/command-and-control/backdoor/webshell/exec/
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke

  # The payload package is distinct from Behinder's client/UI and JDBC-style
  # support code. Its classes are the server-side actions delivered through a
  # webshell, so the package identity plus the family marker is sufficient to
  # identify a payload component. The second composite below requires an
  # active sink before adding another hostile signal.
  - id: payload-component
    for: [class]
    desc: Behinder server-side webshell payload component
    crit: hostile
    conf: 0.99
    all:
      - id: family-markers
      - id: java-payload-namespace

  # Desktop management classes are tooling identity, not injected payload.
  - id: management-client-component
    for: [class]
    desc: Behinder management client component
    crit: notable
    conf: 0.99
    all:
      - id: family-markers
      - id: java-client-namespace

  - id: payload-active-operation
    for: [class]
    desc: Behinder payload exposes an active server-side capability
    # The declared namespace establishes payload identity. An
    # operation atom is still valuable triage context, but repeating it as a
    # hostile verdict overcounts the same payload capability.
    crit: notable
    conf: 0.99
    all:
      - id: family-markers
      - id: java-payload-namespace
    any:
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getbyname-bytecode
      - id: micro-behaviors/communications/socket/send::java-raw-socket-client-write
      - id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode

  # Network-only payloads lack the AES helpers used by the other payload
  # rules. Require the declared payload identity plus a network capability.
  - id: payload-network-channel
    for: [class]
    desc: Behinder payload opens a network tunnel or probe channel
    crit: hostile
    conf: 0.98
    all:
      - id: family-markers
      - id: java-payload-namespace
    any:
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getbyname-bytecode
      - id: micro-behaviors/communications/socket/send::java-raw-socket-client-write
    unless:
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use

  # Payload classes (FileOperation, Cmd, …) ship AES helpers plus filesystem
  # or process sinks. family-markers alone is only suspicious; pairing the
  # framework identity with a concrete sink is the hostile payload shape.
  - id: payload-file-ops
    for: [class]
    desc: Behinder AES response helper with file or reflective APIs
    crit: hostile
    conf: 0.98
    all:
      - id: family-markers
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
    any:
      - id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke
