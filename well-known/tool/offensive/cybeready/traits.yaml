defaults:
  for: [html]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: cybeready-simulation-assets
    desc: Cybeready simulation asset URL
    if:
      type: text
      substr: lp.cybeready.net/beefree_images/cybeready_images/
  - id: cybeready-campaign-function
    desc: Cybeready campaign identifier function
    if:
      type: text
      regex: 'function getcrrid\(\)\{return [''"][a-f0-9]{28,40}[''"]'
composite_rules:
  - id: cybeready-campaign-page
    desc: Cybeready campaign page
    all:
      - id: cybeready-simulation-assets
      - id: cybeready-campaign-function
