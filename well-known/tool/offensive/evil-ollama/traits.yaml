# Evil-Ollama is a named offensive research tool.  These traits identify the
# package; scanner and exploit intent is expressed by objective composites.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Evil-Ollama package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: evil-ollama

  - id: wheel-distribution-name
    desc: Evil-Ollama wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: evil_ollama

  - id: project-homepage
    desc: Evil-Ollama project homepage
    for: [pkginfo]
    if:
      type: value
      path: home-page
      exact: https://github.com/evogix/Evil-Ollama

  - id: source-banner
    desc: Evil-Ollama source banner
    for: [python]
    if:
      type: text
      substr: EVIL-OLLAMA v
