# IoTSploit -- open-source IoT security-testing framework (TKXB/iotsploit,
# iotsploit.org, GPL-3.0; PyPI ring packages iotsploit-django/-core/-cli).
#
# Its Django ring ships NetAudit_Mgr, a network audit harness whose start_/
# stop_ method pairs drive nmap discovery and authorized flood/stress
# routines (hping3/macof/ping/UDP sendto loops) against operator-supplied
# targets with logging. The flood vocabulary there is audit-tooling surface,
# not a malware DoS implementation; the objectives reference this from
# `unless:`.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: IoTSploit wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^iotsploit([-_]|$)'

  - id: iotsploit-member-path
    desc: IoTSploit package member path
    for: [python, text, data, source, scripts, whl, egg, zip]
    if:
      type: path
      regex: '(^|[\\/])iotsploit[_-]'

  - id: net-audit-manager-symbol
    desc: IoTSploit network audit manager reference
    for: [python]
    if:
      type: text
      substr: 'NetAudit_Mgr'

composite_rules:
  - id: iotsploit-distribution
    desc: Recognized IoTSploit security-testing distribution
    crit: exception
    conf: 0.99
    scope: outer
    for: [python, text, data, source, scripts, whl, egg, zip]
    any:
      - id: wheel-distribution-name
      - id: iotsploit-member-path
      - id: net-audit-manager-symbol
