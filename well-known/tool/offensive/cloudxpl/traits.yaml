# CloudXPL-Forge is an open modular cloud security assessment framework.
# Part of the XPL-Forge suite by André Henrique (@mrhenrike).
# It ships cloud assessment modules across AWS, Azure, GCP, Kubernetes,
# serverless and storage for authorized testing — not implanted malware.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, json, whl, zip, tar, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: cloudxpl PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: cloudxpl-forge

  - id: project-summary
    desc: CloudXPL-Forge project summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: 'CloudXPL-Forge'

  - id: github-homepage
    desc: CloudXPL-Forge GitHub repository URL
    for: [python, pkginfo, json, markdown, text]
    if:
      type: text
      substr: 'github.com/mrhenrike/CloudXPL-Forge'

  - id: module-tree-path
    desc: cloudxpl modules directory path
    for: [python]
    if:
      type: path
      regex: '(?i)cloudxpl/modules/'

  - id: core-tree-path
    desc: cloudxpl core directory path
    for: [python]
    if:
      type: path
      regex: '(?i)cloudxpl/core/'

  - id: package-tree-member
    desc: CloudXPL package tree member
    conf: 0.99
    for: [python, scripts, text, markdown, whl, pkginfo]
    if:
      type: path
      regex: '(?i)(^|[\\/])cloudxpl([\\/]|_forge|-[0-9])'

composite_rules:
  - id: framework-identity
    desc: CloudXPL-Forge cloud security framework
    crit: notable
    conf: 0.99
    any:
      - id: pypi-package-name
      - id: project-summary
      - id: github-homepage

  - id: offensive-module-layout
    desc: CloudXPL offensive cloud module layout
    crit: notable
    conf: 0.98
    any:
      - id: module-tree-path
      - id: core-tree-path
      - id: package-tree-member
