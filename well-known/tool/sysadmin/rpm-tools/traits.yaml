defaults:
  crit: notable
  platforms: [linux]
  for: [shell]

traits:
  - id: rpm2cpio-basename
    desc: RPM payload extractor script name
    conf: 0.98
    if:
      type: basename
      exact: rpm2cpio.sh

  - id: rpm-input-error
    desc: RPM input validation error
    conf: 0.98
    if:
      type: text
      substr: "File doesn't look like rpm"

  - id: rpm-compression-error
    desc: RPM payload compression error
    conf: 0.98
    if:
      type: text
      substr: "Unrecognized payload compression format in rpm file"

composite_rules:
  - id: rpm2cpio-script
    desc: Recognized RPM payload extractor
    conf: 0.99
    all:
      - id: rpm2cpio-basename
      - id: rpm-input-error
      - id: rpm-compression-error
