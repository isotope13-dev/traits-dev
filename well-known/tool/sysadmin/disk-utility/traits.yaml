defaults:
  for: [elf, macho, pe, dll, so, dylib]
  platforms:
    - unix
    - windows
  crit: notable
  size_max: 10485760
traits:
  - id: bfi-fat12-description
    desc: BFI FAT12 image creation description
    conf: 0.99
    for: [pe]
    platforms: [windows]
    size_min: 50000
    size_max: 500000
    if:
      type: text
      section: .data
      exact: Creates a FAT12 floppy image from files.
  - id: bfi-bart-lagerweij-copyright
    desc: BFI Bart Lagerweij copyright
    conf: 0.99
    for: [pe]
    platforms: [windows]
    size_min: 50000
    size_max: 500000
    if:
      type: text
      section: .data
      exact: Copyright (c) 2002 Bart Lagerweij. All rights reserved.
  - id: bfi-gilles-vollant-credit
    desc: BFI Gilles Vollant credit
    conf: 0.99
    for: [pe]
    platforms: [windows]
    size_min: 50000
    size_max: 500000
    if:
      type: text
      section: .data
      exact: Copyright (c) 1993-2002 Gilles Vollant
  - id: bfi-winimage-website
    desc: BFI WinImage website reference
    conf: 0.98
    for: [pe]
    platforms: [windows]
    size_min: 50000
    size_max: 500000
    if:
      type: text
      section: .data
      exact: http://www.winimage.com

  - id: fdisk-tool-marker
    crit: notable
    desc: fdisk partition utility executable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^(s?fdisk|cfdisk)$'
  - id: parted-tool-marker
    crit: notable
    desc: parted partition utility executable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^(parted|partprobe)$'
  - id: gptfdisk-tool-marker
    crit: notable
    desc: GPT fdisk suite executable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^(cgdisk|gdisk|sgdisk|fixparts)$'
  - id: winhex-xways
    desc: WinHex/X-Ways forensic disk utility
    crit: notable
    conf: 0.98
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: 'X-Ways Forensics|www\.winhex\.net/|WinHex64\.exe'
      section: .text
  - id: open-free-fiasco-flasher
    desc: 0xFFFF firmware flasher identity
    conf: 0.99
    for: [elf]
    platforms: [linux]
    if:
      type: text
      section: .rodata
      exact: '0xFFFF v%s  // Open Free Fiasco Firmware Flasher'
composite_rules:
  - id: bfi-fat12-floppy-builder
    crit: notable
    desc: BFI FAT12 floppy image builder identity
    conf: 0.99
    for: [pe]
    platforms: [windows]
    all:
      - id: bfi-fat12-description
      - id: bfi-bart-lagerweij-copyright
      - id: bfi-gilles-vollant-credit
      - id: bfi-winimage-website
  - id: disk-partition-tool-marker
    crit: notable
    desc: Disk partitioning utility marker
    conf: 0.95
    any:
      - id: fdisk-tool-marker
      - id: parted-tool-marker
      - id: gptfdisk-tool-marker
