defaults:
  for: [binaries]
  platforms:
    - unix
    - windows
  crit: notable
  size_max: 10485760
traits:
  # NOTE: "the strings talk about partitions" identifies no product -- it fires
  # on every partition editor, installer, and database engine alike -- so it is
  # not a well-known fingerprint. It now lives as the generic capability
  # micro-behaviors/fs/disk/partition::partition-vocabulary-rodata.
  - id: winhex-xways
    desc: WinHex/X-Ways forensic disk utility
    crit: notable
    conf: 0.98
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: 'X-Ways Forensics|www\.winhex\.net/|WinHex64\.exe'
      section: .text
