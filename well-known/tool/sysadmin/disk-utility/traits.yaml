defaults:
  for: [binaries]
  platforms:
    - unix
    - windows
  crit: notable
  size_max: 10485760
traits:
  - id: fdisk-tool-marker
    crit: notable
    desc: fdisk partition utility marker
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(s?fdisk|cfdisk)\b'
      section: .rodata
  - id: parted-tool-marker
    crit: notable
    desc: parted partition utility marker
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(parted|partprobe)\b'
      section: .rodata
  - id: gdisk-tool-marker
    crit: notable
    desc: gdisk partition utility marker
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(gdisk|sgdisk)\b'
      section: .rodata
  - id: winhex-xways
    desc: WinHex/X-Ways forensic disk utility
    crit: notable
    conf: 0.98
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: 'X-Ways Forensics|www\.winhex\.net/|WinHex64\.exe'
      section: .text
composite_rules:
  - id: disk-partition-tool-marker
    crit: notable
    desc: Disk partitioning utility marker
    conf: 0.95
    any:
      - id: fdisk-tool-marker
      - id: parted-tool-marker
      - id: gdisk-tool-marker
