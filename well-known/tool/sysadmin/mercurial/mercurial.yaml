defaults:
  platforms:
  - unix
  - windows
  size_max: 5000000
traits:
- id: mercurial-js-id
  size_min: 512
  size_max: 500000000
  desc: Identifies mercurial.js
  crit: notable
  for:
  - javascript
  if:
    type: basename
    regex: mercurial\.js
- id: mercurial-package-path
  desc: Mercurial VCS installed package path
  crit: notable
  for: [python, pyc]
  if:
    type: path
    regex: 'site-packages[\\/]mercurial[\\/]'
composite_rules:
- id: mercurial-vcs-package-context
  desc: Mercurial VCS Python package context
  crit: exception
  conf: 0.97
  any:
    - id: mercurial-package-path
    - id: mercurial-js-id
