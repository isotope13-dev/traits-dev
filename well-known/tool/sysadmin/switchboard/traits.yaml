# Switchboard CLI (@switch-board/cli) — MIT remote-shell relay client that
# dials out over WebSocket to shell.lfkdsk.org and exposes a local PTY. The
# wire protocol matches the documented product; PTY-over-WebSocket is the
# intended behavior, not a concealed backdoor.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: npm-package-name
    desc: Switchboard CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@switch-board/cli"

  - id: homepage-url
    desc: Switchboard relay homepage URL
    if:
      type: text
      substr: shell.lfkdsk.org

  - id: github-repository
    desc: Switchboard GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/lfkdsk/switchboard'

  - id: daemon-header-comment
    desc: Switchboard daemon module banner
    for: [javascript, typescript]
    if:
      type: text
      substr: "Switchboard daemon"

composite_rules:
  - id: switchboard-cli-package-context
    desc: Published Switchboard CLI remote-terminal client
    crit: notable
    conf: 0.98
    any:
      - id: npm-package-name
      - id: homepage-url
      - id: github-repository
      - id: daemon-header-comment
