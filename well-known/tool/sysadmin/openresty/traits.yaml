defaults:
  platforms: [unix]
  for: [elf, so]
  size_max: 50000000

traits:
  - id: openresty-path
    desc: OpenResty install path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: 'openresty'

composite_rules:
  - id: openresty-nginx-module
    desc: OpenResty nginx module
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/files/runtime::nginx-module-library-path
      - id: openresty-path
