# fd (sharkdp/fd) — the Rust `find` replacement. A project that names this
# repository is naming a well-known developer utility it fetches or documents,
# exactly as its peer ripgrep is handled one directory over. The slug is a tool
# identity, not evidence about what the naming project intends to do with it.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # Relocated from objectives/command-and-control/dropper/node-bootstrap, where
  # a bare repository slug sat at `notable` inside a C2 directory. Every
  # toolchain that installs fd from its GitHub releases — and every README that
  # links it — scored a dropper finding. The bootstrap composite that consumed
  # it already paired this leg with `well-known/tool/sysadmin/ripgrep`, so the
  # two now live side by side and that composite reads the same either way.
  - id: repository-marker
    desc: fd GitHub repository marker
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: sharkdp/fd
