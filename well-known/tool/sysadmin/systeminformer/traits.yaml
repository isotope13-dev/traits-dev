defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 5000000
traits:
# phlib is System Informer's (formerly Process Hacker's) support library; tools
# such as lucasg/Dependencies embed it to parse PE images. Its mapped-image API
# explains PE-header checks and section unmapping in those binaries.
- id: phlib-get-mapped-image-name
  desc: Names phlib PhGetMappedImage APIs
  crit: component
  conf: 0.92
  if:
    type: text
    section: .rdata
    regex: '\bPhGetMappedImage[A-Za-z]+'
- id: phlib-load-mapped-image-name
  desc: Names phlib PhLoadMappedImage API
  crit: component
  conf: 0.92
  if:
    type: text
    section: .rdata
    regex: '\bPhLoadMappedImage[A-Za-z]*'
- id: phlib-unload-mapped-image-name
  desc: Names phlib PhUnloadMappedImage API
  crit: component
  conf: 0.92
  if:
    type: text
    section: .rdata
    substr: PhUnloadMappedImage
- id: phlib-initialize-mapped-image-name
  desc: Names phlib PhInitializeMappedImage API
  crit: component
  conf: 0.92
  if:
    type: text
    section: .rdata
    substr: PhInitializeMappedImage
- id: phlib-checksum-mapped-image-name
  desc: Names phlib PhCheckSumMappedImage API
  crit: component
  conf: 0.92
  if:
    type: text
    section: .rdata
    substr: PhCheckSumMappedImage
- id: phlib-symbol-provider-name
  desc: Names phlib PhSymbolProvider API
  crit: component
  conf: 0.92
  if:
    type: text
    section: .rdata
    substr: PhSymbolProvider
- id: systeminformer-product
  desc: SystemInformer product identification
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 52428800
  if:
    type: value
    path: pe.version.product_name
    regex: "(?i)System Informer"
composite_rules:
- id: phlib-mapped-image-api
  desc: Embeds phlib mapped-image API names
  crit: notable
  conf: 0.92
  needs: 2
  any:
  - id: phlib-get-mapped-image-name
  - id: phlib-load-mapped-image-name
  - id: phlib-unload-mapped-image-name
  - id: phlib-initialize-mapped-image-name
  - id: phlib-checksum-mapped-image-name
  - id: phlib-symbol-provider-name
- id: systeminformer-tool
  desc: System Informer process utility
  crit: notable
  conf: 0.98
  needs: 2
  any:
  - id: systeminformer-product
  - id: metadata/signature/certificate/subject::systeminformer-signer
  - id: metadata/vendor/identity::systeminformer-company
