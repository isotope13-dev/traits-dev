defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 5000000
traits:
- id: systeminformer-product
  desc: SystemInformer product identification
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 52428800
  if:
    type: value
    path: pe.version.product_name
    regex: "(?i)System Informer"
composite_rules:
- id: systeminformer-tool
  desc: System Informer process utility
  crit: notable
  conf: 0.98
  needs: 2
  any:
  - id: systeminformer-product
  - id: metadata/signed/certificate/subject::systeminformer-signer
  - id: metadata/vendor/identity::systeminformer-company
