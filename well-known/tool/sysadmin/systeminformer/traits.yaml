defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 5000000
traits:
# phlib is System Informer's (formerly Process Hacker's) support library; tools
# such as lucasg/Dependencies embed it to parse PE images. Its mapped-image API
# explains PE-header checks and section unmapping in those binaries.
- id: phlib-mapped-image-api
  desc: Embeds phlib mapped-image API names
  crit: notable
  conf: 0.92
  for: [pe, dll]
  count_min: 3
  if:
    type: text
    regex: '\bPh(GetMappedImage[A-Za-z]+|LoadMappedImage[A-Za-z]*|UnloadMappedImage|InitializeMappedImage|CheckSumMappedImage|SymbolProvider)\b'
- id: systeminformer-product
  desc: SystemInformer product identification
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 52428800
  if:
    type: value
    path: pe.version.product_name
    regex: "(?i)System Informer"
composite_rules:
- id: systeminformer-tool
  desc: System Informer process utility
  crit: notable
  conf: 0.98
  needs: 2
  any:
  - id: systeminformer-product
  - id: metadata/signature/certificate/subject::systeminformer-signer
  - id: metadata/vendor/identity::systeminformer-company
