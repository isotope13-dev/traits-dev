defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - pe
  - dll
  size_max: 5000000
traits:
- id: interactive-shell-binary-marker--rx-1
  desc: "Matches 'fish-shell/'"
  crit: notable
  conf: 0.95
  size_min: 65536
  if:
    type: text
    regex: "\\b(__fish_complete|fish-shell/)\\b"
    section: rdata
- id: interactive-shell-binary-marker--rx-2
  desc: "Matches 'zsh/Completion'"
  crit: notable
  conf: 0.95
  size_min: 65536
  if:
    type: text
    regex: "\\b(/bash/(complete|builtins)|zsh/Completion)\\b"
    section: rdata
- id: interactive-shell-binary-marker--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.95
  size_min: 65536
  if:
    type: text
    regex: "\\b(/zsh-[0-9])\\b"
    section: rdata
- id: interactive-shell-binary-marker-macho--rx-1
  desc: Regex component marker for macho
  crit: notable
  conf: 0.95
  for:
  - macho
  size_min: 65536
  if:
    type: text
    regex: "\\b(__fish_complete|fish-shell/)\\b"
    section: __cstring
- id: interactive-shell-binary-marker-macho--rx-2
  desc: Regex component marker for macho
  crit: notable
  conf: 0.95
  for:
  - macho
  size_min: 65536
  if:
    type: text
    regex: "\\b(/bash/(complete|builtins)|zsh/Completion)\\b"
    section: __cstring
- id: interactive-shell-binary-marker-macho--rx-3
  desc: Regex component marker for macho
  crit: component
  conf: 0.95
  for:
  - macho
  size_min: 65536
  if:
    type: text
    regex: "\\b(/zsh-[0-9])\\b"
    section: __cstring
- id: fishshell-name-reference
  desc: Fish shell name reference
  crit: notable
  conf: 0.9
  for:
  - scripts
  if:
    type: text
    substr: fishshell
composite_rules:
- id: interactive-shell-binary-marker
  desc: Interactive shell binary self-identifier
  crit: notable
  conf: 0.95
  size_min: 65536
  any:
  - id: well-known/tool/sysadmin/fish-bash-zsh::interactive-shell-binary-marker--rx-1
  - id: well-known/tool/sysadmin/fish-bash-zsh::interactive-shell-binary-marker--rx-2
  - id: well-known/tool/sysadmin/fish-bash-zsh::interactive-shell-binary-marker--rx-3
  - id: well-known/tool/sysadmin/fish-bash-zsh::interactive-shell-binary-marker-macho--rx-1
  - id: well-known/tool/sysadmin/fish-bash-zsh::interactive-shell-binary-marker-macho--rx-2
  - id: well-known/tool/sysadmin/fish-bash-zsh::interactive-shell-binary-marker-macho--rx-3
