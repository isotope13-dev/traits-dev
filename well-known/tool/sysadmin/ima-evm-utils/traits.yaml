# ima-evm-utils is a legitimate Linux integrity-measurement and file-signing
# utility.  Its xattr, hashing, and key APIs are neutral capabilities; these
# traits provide reusable identity context for those capabilities.
defaults:
  platforms: [linux]
  for: [elf, rpm, so]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 10000000

traits:
  - id: package-name
    desc: ima-evm-utils RPM package identity
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: ima-evm-utils

  - id: evmctl-command-interface
    desc: IMA/EVM signing utility command interface
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: 'Usage: evmctl [-v] <command> [OPTIONS]'

  - id: ima-xattr-marker
    desc: IMA integrity xattr marker
    for: [elf, so]
    if:
      type: text
      section: .rodata
      exact: security.ima

  - id: evm-xattr-marker
    desc: EVM integrity xattr marker
    for: [elf, so]
    if:
      type: text
      section: .rodata
      exact: security.evm

composite_rules:
  - id: ima-evm-signing-utility
    desc: IMA/EVM file-integrity utility
    crit: notable
    conf: 0.99
    all:
      - id: evmctl-command-interface
      - id: ima-xattr-marker
      - id: evm-xattr-marker
