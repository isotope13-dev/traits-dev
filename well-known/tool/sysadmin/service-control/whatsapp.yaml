# Neutral observations; intent requires separate evidence.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.97
  size_max: 20000000
composite_rules:
- id: whatsapp-development-service-controller
  desc: WhatsApp development-service controller
  all:
  - id: well-known/lib/network/whatsapp-web-js::whatsapp-web-js-library
  - id: micro-behaviors/communications/messaging/channel::whatsapp-apache-command-vocabulary
  - id: micro-behaviors/process/create/exec::child-process-execution
  any:
  - id: micro-behaviors/communications/messaging/channel::whatsapp-sql-command-vocabulary
  - id: micro-behaviors/process/terminate/command::taskkill-mysql-process
