# Spack HPC package manager — source releases and test fixtures.
defaults:
  platforms: [unix, windows]
  for: [python, shell, archives, tar, gz]
  crit: notable
  conf: 0.99

traits:
  - id: spack-source-tree-path
    desc: Spack package manager source tree path
    if:
      type: path
      regex: 'lib/spack/spack'

  - id: spack-share-path-marker
    desc: Spack share directory path marker
    if:
      type: path
      regex: 'share/spack'

  - id: spack-builtin-mock-marker
    desc: Spack built-in mock test repository marker
    for: [python, shell]
    if:
      type: text
      substr: 'builtin_mock'

composite_rules:
  - id: spack-package-context
    desc: Spack HPC package manager source context
    crit: exception
    conf: 1.0
    scope: outer
    any:
      - id: spack-source-tree-path
      - id: spack-share-path-marker
      - id: spack-builtin-mock-marker
