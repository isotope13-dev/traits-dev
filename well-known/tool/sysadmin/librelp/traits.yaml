# librelp — Adiscon's Reliable Event Logging Protocol library used by rsyslog.
defaults:
  platforms: [linux]
  for: [c, cpp, shell, rpm, tar]
  crit: baseline
  conf: 0.98

traits:
  - id: librelp-package-name
    crit: notable
    for: [c, cpp, shell]
    desc: librelp package name marker
    if:
      type: text
      regex: '(?i)\blibrelp\b'

  - id: librelp-source-path
    crit: notable
    desc: librelp source tree path
    if:
      type: path
      regex: '(?i)librelp'

composite_rules:
  - id: librelp-library-identity
    desc: Adiscon librelp RELP logging library
    crit: notable
    conf: 0.98
    all:
      - id: librelp-package-name
      - id: metadata/lang/natural/vocabulary/event-logging::relp-acronym
    any:
      - id: metadata/vendor/string::adiscon-domain-reference
      - id: librelp-source-path
