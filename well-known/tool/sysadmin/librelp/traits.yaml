# librelp — Adiscon's Reliable Event Logging Protocol library used by rsyslog.
defaults:
  platforms: [linux]
  for: [c, cpp, shell, rpm, tar]
  crit: baseline
  conf: 0.98

traits:
  - id: librelp-package-name
    desc: librelp package name marker
    if:
      type: text
      regex: '(?i)\blibrelp\b'

  - id: relp-protocol-marker
    desc: RELP protocol identifier
    if:
      type: text
      substr: RELP

  - id: adiscon-vendor-marker
    desc: Adiscon vendor contact marker
    if:
      type: text
      substr: adiscon.com

  - id: librelp-source-path
    desc: librelp source tree path
    if:
      type: path
      regex: '(?i)librelp'

composite_rules:
  - id: librelp-library-identity
    desc: Adiscon librelp RELP logging library
    crit: notable
    conf: 0.98
    all:
      - id: librelp-package-name
      - id: relp-protocol-marker
    any:
      - id: adiscon-vendor-marker
      - id: librelp-source-path
