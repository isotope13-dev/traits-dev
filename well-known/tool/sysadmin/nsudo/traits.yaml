defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 16384
  size_max: 5242880

# NSudo (https://nsudo.m2team.org, github.com/M2Team/NSudo) is an open-source
# "run as TrustedInstaller/System" utility. Its documented mechanism -
# enumerate sessions, open a SYSTEM process token (winlogon/lsass), duplicate
# it, and launch the target under that token - is indistinguishable at the
# API level from LSASS token theft. Many legitimate PC-tweaking/debloat
# utilities bundle its unmodified binaries to run privileged tweaks.
traits:
  - id: nsudo-company-name
    desc: NSudo company version metadata
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: M2-Team

  - id: nsudo-product-name
    desc: NSudo product version metadata
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: NSudo

composite_rules:
  - id: nsudo-identity
    desc: M2-Team NSudo privilege-elevation utility
    crit: notable
    conf: 0.97
    all:
      - id: nsudo-company-name
      - id: nsudo-product-name
