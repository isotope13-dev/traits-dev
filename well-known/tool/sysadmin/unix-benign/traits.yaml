defaults:
  platforms: [linux, openbsd, bsd]
  for: [elf]
  crit: notable
  conf: 0.96
traits:
  - id: openbsd-cloud-agent
    crit: notable
    desc: OpenBSD cloud-agent binary
    size_min: 100000
    size_max: 20000000
    if:
      type: path
      regex: '(^|[\\/])libexec[\\/]cloud-agent$'
  - id: sudo-noexec-library
    crit: notable
    desc: sudo noexec library
    size_min: 1000
    size_max: 200000
    if: {type: basename, exact: sudo_noexec.so}
  - id: sudo-intercept-library
    crit: notable
    desc: sudo intercept preload library
    size_min: 1000
    size_max: 200000
    if: {type: basename, exact: sudo_intercept.so}
  - id: sudo-system-group-library
    crit: notable
    desc: sudo system group plugin
    size_min: 1000
    size_max: 200000
    if: {type: basename, exact: system_group.so}
  # The sudo binary itself: PTY monitoring (use_pty) plus setuid exec trips
  # reverse-shell/PTY composites. Identify it by sudo's .rodata version banner.
  - id: sudo-main-binary
    crit: notable
    desc: sudo privilege-escalation binary
    size_min: 50000
    size_max: 5000000
    if:
      type: text
      section: .rodata
      substr: 'Sudo version %s'
  - id: sudo-noexec-intercept-source
    crit: notable
    desc: sudo noexec/intercept source file
    for: [c, cpp, source]
    if:
      type: path
      regex: 'sudo_(noexec|intercept)\.c$'
  - id: grub-i386-kernel-image
    crit: notable
    desc: GRUB i386 kernel image
    size_min: 10000
    size_max: 2000000
    if: {type: basename, exact: kernel.img}
  - id: grub-module-path
    crit: notable
    desc: GRUB platform module
    size_min: 512
    size_max: 2000000
    if:
      type: path
      regex: 'grub/.+\.mod$'
  # GRUB core images are deliberately linked as one freestanding W+X image.
  - id: grub-core-export-surface
    crit: notable
    desc: GRUB core exported API surface
    arch: [x86]
    size_min: 30000
    size_max: 2000000
    count_min: 20
    if:
      type: export
      regex: '^grub_'
  - id: grub-core-banner
    crit: notable
    desc: GRUB bootloader welcome banner
    arch: [x86]
    size_min: 30000
    size_max: 2000000
    if:
      type: text
      section: .rodata
      exact: 'Welcome to GRUB!'
  # TRAMP is Emacs's remote-file-access layer. It opens a shell on the far
  # host and neutralises that shell's history -- HISTFILE=/dev/null,
  # HISTSIZE=0, HISTFILESIZE=0 -- so its own bookkeeping commands do not land
  # in the user's history. Documented behaviour of a remote-shell wrapper.
  #
  # Emacs ships tramp-sh in two compiled forms and this only matched one: the
  # NATIVE-compiled `tramp-sh-<hash>.eln` (an ELF shared object). The
  # byte-compiled `lisp/net/tramp-sh.elc` is the form every Emacs has, and
  # Emacs 30.2 scored three suspicious findings on it. `.elc` is byte-code,
  # not ELF, so the file types differ too.
  - id: emacs-tramp-native-eln
    crit: notable
    desc: Emacs TRAMP compiled lisp
    for: [elf, go, macho, data, scripts, source]
    size_min: 10000
    size_max: 5000000
    if:
      type: path
      regex: '(^|/)tramp-sh(-[0-9a-f-]+)?\.el[nc]$'
  # Byte-compiled and native-compiled Emacs is identified as javascript or
  # ELF and then matches unrelated suspicious rules. The install tree is
  # the identity; the bytecode is not those behaviors.
  - id: emacs-install-tree
    crit: notable
    desc: File inside an Emacs install tree
    for: [javascript, text, elf, gz]
    size_min: 1
    size_max: 20000000
    if:
      type: path
      regex: '(^|/)emacs/'
  - id: restic-rest-server
    crit: notable
    desc: restic rest-server binary
    size_min: 1000000
    size_max: 100000000
    if: {type: basename, exact: rest-server}
  - id: casaos-binary
    crit: notable
    desc: CasaOS binary
    size_min: 1000000
    size_max: 100000000
    if: {type: basename, exact: casaos}
  - id: kernelsu-daemon
    crit: notable
    desc: KernelSU daemon binary
    size_min: 1000000
    size_max: 100000000
    if:
      type: path
      regex: 'ksud-(x86_64|aarch64)-unknown-linux-musl$'
  - id: flipper-firmware-elf
    crit: notable
    desc: Flipper firmware ELF
    size_min: 100000
    size_max: 20000000
    if: {type: basename, exact: firmware.elf}
  # snappy-java's ELF JNI shim moved to well-known/lib/format/snappy-java; it is a
  # third-party library fingerprint, not a sysadmin tool.
  - id: zipcloak-utility
    desc: Info-ZIP zipcloak encryption utility
    size_min: 20000
    size_max: 1000000
    if: {type: basename, exact: zipcloak}

composite_rules:
  - id: grub-i386-core-image
    desc: GRUB i386 core image identity
    crit: notable
    conf: 0.99
    arch: [x86]
    size_min: 30000
    size_max: 2000000
    all:
      - id: grub-core-export-surface
      - id: grub-core-banner

  # Stock shells and privileged system tools legitimately combine socket + PTY
  # + exec (socat relays, gawk coprocesses, sudo command monitoring, startpar
  # boot-time console multiplexing). Grouping them lets backdoor/PTY composites
  # cite one exception instead of many leaves. (busybox/musl/libc are baseline,
  # not notable, so they can't join an exception's any: and stay listed
  # separately by the referencing composites.)
  - id: benign-native-shell-tools
    desc: Stock shells and privileged system tools
    crit: exception
    conf: 0.99
    any:
      - id: sudo-main-binary
      - id: sudo-intercept-library
      - id: sudo-noexec-library
      - id: well-known/tool/sysadmin/network::socat-family-binary-name
      - id: well-known/tool/development/cli/gnu-awk::gawk-binary
      - id: well-known/tool/sysadmin/startpar::startpar-boot-tool
