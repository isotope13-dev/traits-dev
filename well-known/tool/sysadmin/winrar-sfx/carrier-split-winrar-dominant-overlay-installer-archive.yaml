---
defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: winrar-sfx-dominant-overlay
  desc: WinRAR SFX with dominant overlay
  crit: notable
  conf: 0.95
  all:
  - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: metadata/binary/layout/ratio::overlay-at-least-half
  unless:
  - id: metadata/signature/verified/
  - id: metadata/binary/layout/checksum::security-dir-out-of-bounds
