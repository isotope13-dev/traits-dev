---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: winrar-sfx-temp-overlay-profile
  desc: WinRAR SFX temp mode and overlay
  crit: notable
  conf: 0.96
  attack: T1204.002,T1027.002
  all:
  - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
  - id: micro-behaviors/data/archive/extract/destination::sfx-temp-mode-directive
  - id: metadata/binary/layout/ratio::overlay-at-least-half
  unless:
  - id: metadata/signature/verified/
  - id: metadata/binary/layout/checksum::security-dir-out-of-bounds
