defaults:
  crit: notable
  platforms:
    - windows
  for:
    - pe
traits:
  - id: winrar-sfx-registry-text
    desc: WinRAR SFX registry path text
    conf: 0.98
    if:
      type: text
      exact: Software\WinRAR SFX
      section: .rdata
  - id: winrar-sfx-manifest-name
    desc: WinRAR SFX manifest name
    conf: 0.98
    if:
      type: text
      substr: name="WinRAR SFX"
      section: .rsrc
  - id: winrar-sfx-manifest-description
    desc: WinRAR SFX manifest description
    conf: 0.99
    if:
      type: text
      substr: WinRAR SFX module
      section: .rsrc
composite_rules:
  - id: winrar-sfx-footprint
    desc: WinRAR self-extractor footprint
    conf: 0.97
    all:
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx-registry-text
      - id: micro-behaviors/ui/window/display::start-dialog-label-text
  - id: winrar-sfx
    desc: WinRAR self-extracting archive
    conf: 0.99
    # The "WinRAR SFX module" manifest string and the name="WinRAR SFX" assembly
    # identity are unique to genuine WinRAR SFX stubs; a built SFX archive
    # additionally carries the registry key + dialog.
    any:
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx-manifest-description
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx-manifest-name
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx-footprint
