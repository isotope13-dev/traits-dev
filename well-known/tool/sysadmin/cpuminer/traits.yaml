defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  size_min: 512
traits:
  - id: cpuminer-version-banner
    desc: Cpuminer version banner in PE data
    conf: 0.98
    if:
      type: text
      regex: 'cpuminer [0-9]{1,3}\.[0-9]{1,3}(\.[0-9]{1,3})?'
      section: .rdata
  - id: minerd-command-help
    desc: Minerd command-line usage in PE data
    conf: 0.95
    if:
      type: text
      substr: 'Usage: minerd [OPTIONS]'
      section: .rdata
composite_rules:
  - id: cpuminer-command-line-miner
    desc: Cpuminer command-line mining program
    conf: 0.99
    all:
      - id: cpuminer-version-banner
      - id: minerd-command-help
