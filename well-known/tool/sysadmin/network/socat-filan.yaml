defaults:
  platforms: [unix]

traits:
  - id: socat-binary
    desc: Filename is socat, socat1 or filan
    crit: notable
    for: [elf]
    if:
      type: path
      basename: true
      # openSUSE's socat 1.x series ships the binary as `socat1` (with a
      # `socat` symlink); the 2.x series and Debian ship `socat` directly.
      regex: '^(socat|socat1|filan)$'
