defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: gecko-fragment-marker
    desc: Gecko fragment marker constant
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '\bgeckoFlagFragment\s*=\s*0x80\b'

  - id: gecko-frame-encoder
    desc: Gecko frame encoder function
    crit: component
    conf: 0.98
    if:
      type: function
      exact: encodeFrame

  - id: gecko-frame-decoder
    desc: Gecko frame decoder function
    crit: component
    conf: 0.98
    if:
      type: function
      exact: decodeFrame

composite_rules:
  - id: hysteria-gecko-frame-implementation
    desc: Hysteria Gecko frame implementation
    crit: notable
    conf: 0.99
    all:
      - id: gecko-fragment-marker
      - id: gecko-frame-encoder
      - id: gecko-frame-decoder
      - id: micro-behaviors/data/buffer::go-big-endian-uint16-write
      - id: micro-behaviors/os/random/generator::go-rand-read-call
