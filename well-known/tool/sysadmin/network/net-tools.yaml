# net-tools network-status utility identity.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 10000
  size_max: 5000000

traits:
  - id: netstat-program-basename
    desc: net-tools netstat executable basename
    if:
      type: path
      basename: true
      exact: netstat
  - id: iproute2-utility-banner
    desc: iproute2 ip utility usage banner
    if:
      type: text
      substr: 'ip utility, iproute2-'
      section: .rodata

composite_rules:
  - id: net-tools-netstat-utility
    desc: net-tools netstat network utility
    crit: notable
    conf: 0.99
    all:
      - id: netstat-program-basename
      - id: metadata/file/string/identity::netstat-usage-banner
      - id: metadata/file/string/identity::netstat-source-marker
