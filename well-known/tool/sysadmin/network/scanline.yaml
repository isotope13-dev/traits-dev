# Foundstone ScanLine is a user-directed TCP/UDP/ICMP scanner. Its version
# resource survives UPX, while the console banner corroborates an unpacked
# build. Identity establishes neither permission to scan nor malicious intent.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.97
  size_min: 4096
  size_max: 8000000
traits:
  - id: scanline-product-name
    desc: Foundstone ScanLine PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: ScanLine
  - id: scanline-vendor-name
    desc: Foundstone scanner vendor metadata
    if:
      type: value
      path: pe.version.company
      regex: '^Foundstone(,)? Inc\.$'
  - id: scanline-console-banner
    desc: Foundstone ScanLine console version banner
    if:
      type: text
      section: .data
      regex: 'ScanLine \(TM\) [0-9]+(\.[0-9]+){1,3}'
composite_rules:
  - id: foundstone-scanline
    desc: Foundstone ScanLine network scanner
    all:
      - id: scanline-product-name
      - id: scanline-vendor-name
