# Stock rsync exports the global `shell_cmd` as the configured remote
# shell string. It is a data symbol, not a function that runs commands.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 100000000

traits:
  - id: rsync-protocol-error-string
    desc: rsync protocol error format string
    if:
      type: text
      section: .rodata
      substr: 'error in rsync protocol data stream'
