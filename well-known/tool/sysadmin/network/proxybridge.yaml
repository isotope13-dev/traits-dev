defaults:
  platforms: [unix, windows]
  for: [c, cpp, python, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: proxybridge-repository
    desc: ProxyBridge proxy client repository
    if:
      type: text
      substr: 'github.com/InterceptSuite/ProxyBridge'

  - id: proxybridge-project-name
    desc: ProxyBridge project property
    if:
      type: text
      substr: 'InterceptSuite_ProxyBridge'

  - id: proxybridge-source-path
    desc: ProxyBridge source member path
    size_max: 100000000
    if:
      type: path
      regex: 'ProxyBridge-(HEAD|[0-9a-fA-F]{7,40}|[0-9][A-Za-z0-9._-]*)'

composite_rules:
  - id: proxybridge-source-context
    desc: Recognized ProxyBridge proxy client source
    crit: exception
    conf: 0.99
    all:
      - id: proxybridge-source-path
    any:
      - id: proxybridge-repository
      - id: proxybridge-project-name
