defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
traits:
  - id: eooce-ws-default-uuid-reference
    desc: References eooce/ws default VLESS UUID
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 5efabea4-f6d4-91fd-b8f0-17e004c89c60
composite_rules:
  # A default identifier can be copied, so the finding describes the observed
  # references rather than declaring that the file is malware or this project.
  - id: eooce-uuid-vless-proxy-context
    desc: eooce UUID, VLESS and proxy configuration clues
    crit: notable
    conf: 0.97
    all:
      - id: eooce-ws-default-uuid-reference
      - id: micro-behaviors/communications/proxy/vless::vless-url-scheme
    any:
      - id: micro-behaviors/communications/url/host/domain-http::ssss-nyc-mn
      - id: well-known/app/system/nezha::nezha-v1-config-template
      - id: micro-behaviors/fs/write/file/npm-masquerade::write-binary-as-npm
