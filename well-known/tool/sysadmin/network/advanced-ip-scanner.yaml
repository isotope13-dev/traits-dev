# Advanced IP Scanner is a legitimate Windows network-discovery utility that
# is also named in the StormEncryptor post-compromise toolset.  Keep its
# identity neutral; intent comes from the surrounding ransomware or access
# behavior rather than from the product name alone.
defaults:
  platforms: [windows]
  for: [scripts, binaries, c, cpp, powershell, batch, shell, python, javascript, typescript, pe, dll]
  attack: T1046
  size_min: 64
  size_max: 500000000

traits:
  - id: advanced-ip-scanner-product-name
    desc: Advanced IP Scanner product name
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bAdvanced[ _-]+IP[ _-]+Scanner\b'

  - id: advanced-ip-scanner-executable-name
    desc: Advanced IP Scanner executable name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\badvanced[_ -]?ip[_ -]?scanner[^\r\n\\/]{0,24}\.(exe|msi)\b'

composite_rules:
  - id: advanced-ip-scanner
    desc: Advanced IP Scanner utility identity
    crit: notable
    conf: 0.94
    any:
      - id: advanced-ip-scanner-product-name
      - id: advanced-ip-scanner-executable-name
