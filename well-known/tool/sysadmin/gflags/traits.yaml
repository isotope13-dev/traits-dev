# GFlags is Microsoft's Global Flags editor for system debugging and
# diagnostic settings. Identity belongs under the recognized administration
# tool, not under generic PE metadata: these fields supply benign context for
# registry-surface rules but do not prove the executable is untampered.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 16384
  size_max: 4194304

traits:
  - id: gflags-original-filename
    desc: GFlags original filename resource
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.original_filename
      exact: GFLAGS.EXE

  - id: gflags-file-description
    desc: GFlags Global Flags Manipulator description
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '(?i)\bGlobal Flags Manipulator\b'

composite_rules:
  - id: gflags-tool-identity
    desc: Microsoft GFlags resource identity
    crit: exception
    conf: 0.98
    all:
      - id: gflags-original-filename
      - id: gflags-file-description

