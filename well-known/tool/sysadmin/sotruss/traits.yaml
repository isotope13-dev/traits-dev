# glibc's sotruss helper library.  The SOTRUSS_* option markers plus the
# complete audit callback set distinguish this tracer from an arbitrary
# LD_AUDIT library, including when the library has been renamed.
defaults:
  platforms: [linux]
  for: [elf, so]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 2000000

traits:
  - id: sotruss-environment-markers--from-list
    desc: sotruss environment option (SOTRUSS_FROMLIST)
    if:
      type: text
      section: .rodata
      exact: SOTRUSS_FROMLIST
  - id: sotruss-environment-markers--to-list
    desc: sotruss environment option (SOTRUSS_TOLIST)
    if:
      type: text
      section: .rodata
      exact: SOTRUSS_TOLIST
  - id: sotruss-environment-markers--exit
    desc: sotruss environment option (SOTRUSS_EXIT)
    if:
      type: text
      section: .rodata
      exact: SOTRUSS_EXIT
  - id: sotruss-environment-markers--which
    desc: sotruss environment option (SOTRUSS_WHICH)
    if:
      type: text
      section: .rodata
      exact: SOTRUSS_WHICH
  - id: sotruss-environment-markers--out-name
    desc: sotruss environment option (SOTRUSS_OUTNAME)
    if:
      type: text
      section: .rodata
      exact: SOTRUSS_OUTNAME

composite_rules:
  - id: sotruss-environment-markers
    desc: sotruss environment option markers
    any:
      - id: sotruss-environment-markers--from-list
      - id: sotruss-environment-markers--to-list
      - id: sotruss-environment-markers--exit
      - id: sotruss-environment-markers--which
      - id: sotruss-environment-markers--out-name
  - id: sotruss-library
    desc: GNU sotruss linker-audit library
    crit: notable
    conf: 0.99
    all:
      - id: sotruss-environment-markers
      - id: micro-behaviors/os/linker/audit::audit-version-callback
      - id: micro-behaviors/os/linker/audit::audit-object-open-callback
      - id: micro-behaviors/os/linker/audit::audit-symbol-bind-callback
