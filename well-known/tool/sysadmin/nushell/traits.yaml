# Nushell's Windows MSI is a WiX-authored release containing the shell,
# official core plugins, less.exe, licenses, and a Windows Terminal profile.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: rust-source-tree
    desc: Nushell Rust source tree marker
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rdata
      substr: 'C:\a\nushell\nushell\crates'

  - id: shell-help-marker
    desc: Nushell shell help marker
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rdata
      substr: The nushell language and shell

  - id: plugin-protocol-marker
    desc: Nushell plugin protocol marker
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rdata
      substr: Nushell Plugin

composite_rules:
  - id: official-msi-context
    desc: Recognized Nushell Windows MSI
    crit: notable
    conf: 0.99
    for: [oledoc]
    all:
      - id: metadata/package/files/msi::nushell-subject
      - id: metadata/package/files/msi::nushell-creator
      - id: metadata/package/files/msi::nushell-description
      - id: metadata/package/files/msi::nushell-wix-application

  - id: shell-binary-context
    desc: Recognized Nushell shell binary
    crit: notable
    conf: 0.99
    all:
      - id: rust-source-tree
      - id: shell-help-marker

  - id: plugin-binary-context
    desc: Recognized Nushell plugin binary
    crit: notable
    conf: 0.99
    all:
      - id: rust-source-tree
      - id: plugin-protocol-marker
