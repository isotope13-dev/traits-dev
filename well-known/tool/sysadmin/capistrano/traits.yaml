# Capistrano -- Ruby remote deployment tool. `cap install` generates
# config/deploy/<stage>.rb files whose comment blocks show example server and
# SSH-option settings, including commented-out `keys: %w(~/.ssh/id_rsa)`.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95

traits:
  - id: stage-role-syntax-header
    desc: Capistrano stage template role-syntax header
    if:
      type: text
      substr: '# Simple Role Syntax'

  - id: stage-ssh-options-header
    desc: Capistrano stage template SSH-options header
    if:
      type: text
      substr: '# Custom SSH Options'

composite_rules:
  - id: stage-config-template-context
    desc: Capistrano stage file generated from its template
    crit: exception
    conf: 0.95
    all:
      - id: stage-role-syntax-header
      - id: stage-ssh-options-header
