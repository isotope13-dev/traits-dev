# TermDeck — MIT-licensed cockpit/dashboard for agentic coding tools
# (github.com/kiril6/termdeck, npm `@kiril6/termdeck`). An Express + ws +
# node-pty + tmux web dashboard for running local coding agents (Claude Code,
# Codex, Gemini) in browser terminals with worktree isolation and approval gates.
# It binds to loopback (127.0.0.1) by default and verifies Origin and Host
# headers to guard against DNS rebinding and cross-site WebSocket hijacking.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: optout-file-reference
    desc: Termdeck tmux optout file reference
    if:
      type: text
      substr: '.termdeck-tmux-optout'

  - id: config-directory-reference
    desc: Termdeck user config directory path
    if:
      type: text
      substr: '.termdeck'

  - id: package-name-reference
    desc: Termdeck package name reference
    if:
      type: text
      substr: '@kiril6/termdeck'

composite_rules:
  - id: package-context
    desc: Termdeck terminal dashboard package context
    crit: notable
    conf: 0.97
    any:
      - id: optout-file-reference
      - id: config-directory-reference
      - id: package-name-reference
