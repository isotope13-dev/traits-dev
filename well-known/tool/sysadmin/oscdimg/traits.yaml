# Microsoft OSCDIMG is a CD/DVD premastering utility. Its embedded help and
# Microsoft version resource can overlap with unsigned-Microsoft heuristics
# when distributed inside a third-party utility bundle.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
  size_min: 80000
  size_max: 500000

traits:
  - id: oscdimg-banner
    desc: OSCDIMG utility banner
    conf: 0.99
    if:
      type: text
      exact: OSCDIMG 2.56
      section: .text
  - id: oscdimg-product
    desc: Microsoft OSCDIMG product name
    conf: 0.99
    if:
      type: text
      exact: Microsoft CD/DVD Premastering Utility
      section: .rsrc
  - id: oscdimg-license
    desc: OSCDIMG authorized-content license
    conf: 0.98
    if:
      type: text
      exact: Licensed only for producing Microsoft authorized content.
      section: .text

composite_rules:
  - id: oscdimg-utility
    desc: Microsoft OSCDIMG premastering utility
    conf: 0.99
    all:
      - id: oscdimg-banner
      - id: oscdimg-product
      - id: oscdimg-license
