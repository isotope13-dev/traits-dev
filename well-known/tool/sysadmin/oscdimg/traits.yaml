# Microsoft OSCDIMG is a CD/DVD premastering utility. Its embedded help and
# Microsoft version resource can overlap with unsigned-Microsoft heuristics
# when distributed inside a third-party utility bundle.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: oscdimg-banner
    desc: OSCDIMG utility banner
    crit: component
    conf: 0.99
    if:
      type: text
      exact: OSCDIMG 2.56
  - id: oscdimg-product
    desc: Microsoft OSCDIMG product marker
    crit: component
    conf: 0.99
    if:
      type: text
      exact: Microsoft CD/DVD Premastering Utility
  - id: oscdimg-license
    desc: OSCDIMG Microsoft authorized-content license marker
    crit: component
    conf: 0.98
    if:
      type: text
      exact: Licensed only for producing Microsoft authorized content.

composite_rules:
  - id: oscdimg-utility
    desc: Microsoft OSCDIMG premastering utility
    crit: notable
    conf: 0.99
    all:
      - id: oscdimg-banner
      - id: oscdimg-product
      - id: oscdimg-license
