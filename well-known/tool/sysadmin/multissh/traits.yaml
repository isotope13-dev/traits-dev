defaults:
  platforms: [unix, windows]
  for: [python, text, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: multissh-project-url
    desc: multiSSH project repository reference
    crit: notable
    if:
      type: text
      substr: github.com/yufei-pan/multiSSH3

  - id: multissh-script-identity
    desc: multiSSH script identity
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?i)\b(multiSSH3|multissh3|mssh_complete)\b'

composite_rules:
  - id: multissh-context
    desc: multiSSH utility context
    crit: exception
    conf: 0.98
    any:
      - id: multissh-project-url
      - id: multissh-script-identity
