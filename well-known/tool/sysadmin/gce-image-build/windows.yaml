defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: bootstrap-install-disk-function
  desc: GCE disk bootstrap function declaration
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'function Bootstrap-InstallDisk {'
- id: googet-offline-install-root
  desc: GooGet offline image installation root
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "-root 'D:\\ProgramData\\GooGet' addrepo"
composite_rules:
- id: gce-windows-disk-bootstrap
  desc: GCE Windows disk bootstrap routine
  crit: exception
  conf: 0.99
  all:
  - id: bootstrap-install-disk-function
  - id: googet-offline-install-root
