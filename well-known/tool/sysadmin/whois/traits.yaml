# GNU whois is a network lookup utility.  Its compiled registry table contains
# many country-code referral URLs, including PHP web interfaces; those URLs are
# data used by the lookup client, not operator-controlled C2 infrastructure.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 1000000

traits:
  - id: whois-binary-name
    desc: GNU whois executable basename
    if:
      type: basename
      exact: whois

  - id: whois-usage
    desc: GNU whois command usage banner
    if:
      type: text
      section: .rodata
      substr: 'Usage: whois [OPTION]... OBJECT...'

  - id: whois-iana-referral
    desc: WHOIS IANA referral server marker
    if:
      type: text
      section: .rodata
      substr: whois.iana.org

composite_rules:
  - id: whois-utility
    desc: GNU whois network lookup utility
    all:
      - id: whois-binary-name
      - id: whois-usage
      - id: whois-iana-referral
