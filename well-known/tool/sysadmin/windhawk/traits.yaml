# Windhawk — legitimate Windows customization and modding tool.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: windhawk-mod-header
    desc: Windhawk mod metadata block
    if:
      type: text
      substr: "// ==WindhawkMod=="

  - id: windhawk-api-header
    desc: Includes Windhawk API header
    if:
      type: text
      substr: "<windhawk_api.h>"

composite_rules:
  - id: windhawk-mod-source
    desc: Windhawk mod source code
    any:
      - id: windhawk-mod-header
      - id: windhawk-api-header
