defaults:
  platforms: [unix, windows]
  for: [php, json]
  crit: notable
  conf: 0.98
  size_max: 50000000

traits:
  - id: phpsysinfo-composer-name
    desc: phpSysInfo Composer package name
    for: [json]
    if:
      type: text
      substr: '"name": "phpsysinfo/phpsysinfo"'

  - id: phpsysinfo-copyright
    desc: phpSysInfo copyright header
    for: [php]
    if:
      type: text
      substr: 'phpSysInfo'

  - id: phpsysinfo-package-tag
    desc: phpSysInfo docblock package tag
    for: [php]
    if:
      type: text
      regex: '@package\s+PSI\b'

  - id: phpsysinfo-source-link
    desc: phpSysInfo project link
    for: [php]
    if:
      type: text
      regex: 'https?://phpsysinfo\.(sourceforge\.net|github\.io)'

composite_rules:
  - id: phpsysinfo-source-context
    desc: phpSysInfo system monitoring source file
    crit: notable
    conf: 0.99
    for: [php]
    needs: 2
    any:
      - id: phpsysinfo-copyright
      - id: phpsysinfo-package-tag
      - id: phpsysinfo-source-link
