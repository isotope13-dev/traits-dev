# PAExec (Power Admin LLC) — open PsExec-compatible remote execution helper
# commonly bundled by pypsexec. Token adjustment before CreateProcessAsUser
# is the tool's job, not token theft.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 32768
  size_max: 2097152

traits:
  - id: product-version-name
    desc: PAExec product version name
    if:
      type: value
      path: pe.version.product_name
      exact: PAExec Application

  - id: company-version-name
    desc: Power Admin LLC company field
    if:
      type: value
      path: pe.version.company
      exact: Power Admin LLC

  - id: pdb-path
    desc: PAExec PDB debug path
    if:
      type: text
      regex: '(?i)PAExec\.pdb'
      section: rdata

composite_rules:
  - id: paexec-remote-exec-tool
    desc: Recognized PAExec remote-exec binary
    all:
      - id: product-version-name
      - id: company-version-name
