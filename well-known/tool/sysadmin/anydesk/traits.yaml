defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97

traits:
  - id: manifest-identity
    desc: AnyDesk manifest identity declaration
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: philandro.AnyDesk.AnyDesk

  - id: manifest-description
    desc: AnyDesk remote-support description
    if:
      type: value
      path: pe.manifest.description
      exact: AnyDesk screen sharing and remote control software.

composite_rules:
  - id: windows-client
    desc: AnyDesk Windows remote-support client
    crit: notable
    conf: 0.98
    all:
      - id: manifest-identity
      - id: manifest-description
