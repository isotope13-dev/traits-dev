defaults:
  platforms: [unix, windows]
  for: [elf, pe, archive]
  crit: component
  conf: 0.98
  size_max: 100000000
traits:
  - id: cdrtools-release-archive
    desc: cdrtools release archive
    if:
      type: path
      basename: true
      regex: '(?i)cdrtools.*\.7z$'
  - id: mkisofs-windows-binary
    desc: mkisofs Windows binary
    if:
      type: path
      basename: true
      regex: '(?i)^(mk(isofs|hybrid)|isoinfo|cdda2wav)\.exe$'
      case_insensitive: true

  - id: wodim-package-name
    desc: wodim optical-media RPM package identity
    for: [rpm]
    platforms: [linux]
    crit: notable
    if:
      type: value
      path: rpm.name
      exact: wodim

  - id: cdrkit-suite-banner
    desc: cdrkit optical-media utility banner
    for: [elf]
    platforms: [unix]
    crit: notable
    size_min: 10000
    size_max: 10000000
    if:
      type: text
      section: .rodata
      substr: 'Cdrkit suite contributors'

  - id: remote-scsi-daemon-config
    desc: cdrkit remote SCSI daemon config marker
    for: [elf]
    platforms: [unix]
    crit: notable
    size_min: 10000
    size_max: 1000000
    if:
      type: text
      section: .rodata
      exact: /etc/netscsid.conf

composite_rules:
  - id: cdrtools-component
    desc: cdrtools component
    any:
      - id: well-known/tool/sysadmin/cdrtools::cdrtools-release-archive
      - id: well-known/tool/sysadmin/cdrtools::mkisofs-windows-binary

  - id: cdrkit-optical-media-utility
    desc: cdrkit optical-media utility
    for: [elf]
    platforms: [unix]
    crit: notable
    conf: 0.99
    any:
      - id: cdrkit-suite-banner
      - id: remote-scsi-daemon-config
