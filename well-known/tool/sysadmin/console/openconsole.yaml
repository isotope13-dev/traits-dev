defaults:
  conf: 1.0
  platforms: [windows]
  for: [pe]
  size_min: 200000
  size_max: 3000000

traits:
  - id: openconsole-product-identity
    desc: Windows Terminal OpenConsole product identity
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Windows Terminal

  - id: openconsole-file-identity
    desc: Windows Terminal OpenConsole file identity
    crit: notable
    if:
      type: value
      path: pe.version.original_filename
      exact: OpenConsole.exe

  - id: openconsole-basename
    desc: OpenConsole console host basename
    crit: notable
    if:
      type: path
      basename: true
      exact: OpenConsole.exe
      case_insensitive: true

composite_rules:
  - id: microsoft-openconsole-identity
    desc: Microsoft-signed Windows Terminal product identity
    crit: notable
    all:
      - id: metadata/signed/platform::microsoft
      - id: openconsole-product-identity

  - id: microsoft-openconsole-host
    desc: Verified Microsoft Windows Terminal console host
    crit: exception
    all:
      - id: microsoft-openconsole-identity
      - id: openconsole-file-identity

  - id: openconsole-host-identity
    desc: Windows Terminal OpenConsole host identity
    crit: exception
    all:
      - id: openconsole-product-identity
      - id: openconsole-file-identity
