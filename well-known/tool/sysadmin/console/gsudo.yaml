defaults:
  for: [pe, powershell]
  platforms: [windows]
  size_min: 100
  size_max: 10485760

traits:
  - id: gsudo-product-name
    desc: gsudo elevation tool product metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: gsudo

  - id: gsudo-product-comments
    desc: gsudo Windows sudo product metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.comments
      substr: gsudo is a sudo for Windows

  - id: gsudo-script-repository
    desc: gsudo PowerShell repository marker
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      substr: https://github.com/gerardog/gsudo

  - id: gsudo-script-serialization
    desc: gsudo scriptblock serialization wrapper
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      substr: Serialize-Scriptblock

  - id: gsudo-script-elevation
    desc: gsudo elevated PowerShell wrapper
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      substr: new elevated instance of powershell

composite_rules:
  - id: gsudo-tool
    desc: gsudo Windows elevation tool
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: gsudo-product-name
      - id: gsudo-product-comments

  - id: gsudo-powershell-wrapper
    desc: gsudo serialized elevated PowerShell context
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: gsudo-script-repository
      - id: gsudo-script-serialization
      - id: gsudo-script-elevation
      - id: metadata/signed/certificate/identity::powershell-signature-block
