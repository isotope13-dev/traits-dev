defaults:
  platforms:
  - linux
  for:
  - elf
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 100000
traits:
- id: update-passwd-usage
  desc: Debian update-passwd command usage
  if:
    type: text
    section: .rodata
    substr: 'Usage: update-passwd [OPTION]...'
- id: base-passwd-event-namespace
  desc: Debian base-passwd event namespace
  if:
    type: text
    section: .rodata
    regex: base-passwd/%s/(user|group)(/|-)
- id: base-passwd-master-database-paths
  desc: Debian base-passwd master database paths
  if:
    type: text
    section: .rodata
    regex: /usr/share/base-passwd/(passwd|group)\.master
composite_rules:
- id: debian-update-passwd
  desc: Debian base-passwd account database updater
  all:
  - id: update-passwd-usage
  - id: base-passwd-event-namespace
  - id: base-passwd-master-database-paths
  - id: micro-behaviors/os/user/account::putspent
  - id: micro-behaviors/os/group/membership::putgrent
  - id: micro-behaviors/os/user/account::lckpwdf
