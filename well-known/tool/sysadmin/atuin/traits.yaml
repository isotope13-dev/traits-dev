defaults:
  platforms: [unix]
  for: [shell, text, archive]
  crit: notable
  conf: 0.96

traits:
  - id: atuin-install-script-path
    crit: notable
    desc: Atuin install script path
    if:
      type: path
      regex: 'atuin[^/]*/install\.sh$'

  - id: atuin-history-filter-option
    platforms: [linux, macos, windows]
    for: [scripts, source, data]
    size_max: 10485760
    crit: notable
    conf: 0.95
    desc: Atuin history_filter configuration option
    attack: T1070.003
    if:
      type: text
      regex: '(?im)^\s*history_filter\s*=\s*\['

  - id: atuin-cwd-filter-option
    platforms: [linux, macos, windows]
    for: [scripts, source, data]
    size_max: 10485760
    crit: notable
    conf: 0.95
    desc: Atuin cwd_filter configuration option
    attack: T1070.003
    if:
      type: text
      regex: '(?im)^\s*cwd_filter\s*=\s*\['
