defaults:
  platforms: [unix, windows]
  for: [go, shell, python, binaries]
  crit: notable
  conf: 0.95
  size_min: 100
  size_max: 500000000

traits:
  - id: rancher-module-path
    desc: Rancher Go module or package path
    if:
      type: text
      regex: 'github\.com/rancher/(rancher|rke)\b'

  - id: rancher-node-cleanup
    desc: Rancher Kubernetes node cleanup agent
    if:
      type: text
      regex: 'rancher/rancher-agent|NodeCleanupContainerName|Rancher 2\.x extended cleanup'

composite_rules:
  - id: rancher-agent-cleanup-context
    desc: Rancher node cleanup agent context
    crit: exception
    conf: 0.95
    for: [go, shell, binaries]
    any:
      - id: rancher-module-path
      - id: rancher-node-cleanup
