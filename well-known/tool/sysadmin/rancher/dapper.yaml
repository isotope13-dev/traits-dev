# Rancher projects bootstrap builds with Dapper via a hidden Makefile
# target that downloads from releases.rancher.com. That pattern is
# standard upstream tooling, not a concealed install-hook payload.
defaults:
  platforms: [unix, windows]
  for: [shell, makefile]
  crit: notable
  conf: 0.99

traits:
  - id: dapper-release-download
    desc: Rancher Dapper release download URL
    if:
      type: text
      substr: releases.rancher.com/dapper
