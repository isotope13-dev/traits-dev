defaults:
  for:
  - binaries
  platforms:
  - windows
  - linux
  - macos
  crit: notable
composite_rules:
- size_min: 1024
  size_max: 10485760
  id: infozip-archive-tool
  desc: Info-ZIP archive utility
  conf: 0.95
  any:
  - id: well-known/tool/sysadmin/infozip::infozip-banner
  - id: well-known/tool/sysadmin/infozip::zipinfo-banner
  - id: well-known/tool/sysadmin/infozip::infozip-sfx-tool
  - id: well-known/tool/sysadmin/infozip::infozip-funzip-tool
  - id: well-known/tool/sysadmin/infozip::infozip-unzip32-example-tool
- size_min: 1024
  size_max: 10485760
  id: infozip-funzip-tool
  desc: Info-ZIP fUnZip archive filter
  conf: 0.92
  all:
  - id: well-known/tool/sysadmin/infozip::funzip-usage
  - id: well-known/tool/sysadmin/infozip::unzip-compiled-properly-message
- size_min: 1024
  size_max: 10485760
  id: infozip-sfx-tool
  desc: Info-ZIP self-extracting archive utility
  conf: 0.9
  all:
  - id: well-known/tool/sysadmin/infozip::unzip-compiled-properly-message
  - id: well-known/tool/sysadmin/infozip::unzip-extraction-directory-ui
  - id: well-known/tool/sysadmin/infozip::unzip-all-files-extracted-message
- size_min: 1024
  size_max: 10485760
  id: infozip-unzip32-example-tool
  desc: Info-ZIP UNZIP32.DLL example helper
  conf: 0.92
  all:
  - id: well-known/tool/sysadmin/infozip::unzip32-dll-reference
  - id: well-known/tool/sysadmin/infozip::wiz-single-entry-unzip-export
traits:
- size_min: 1024
  size_max: 10485760
  id: infozip-banner
  desc: Info-ZIP archive utility banner
  conf: 0.95
  if:
    type: text
    substr: by Info-ZIP
- size_min: 1024
  size_max: 10485760
  id: zipinfo-banner
  desc: ZipInfo archive utility banner
  conf: 0.95
  if:
    type: text
    substr: by Greg Roelofs and the Info-ZIP group
