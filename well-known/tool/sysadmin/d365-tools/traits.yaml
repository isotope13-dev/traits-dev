defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
  size_max: 50000000

traits:
  - id: d365-tools-package
    desc: D365 administrative tools package name
    for: [nupkg]
    if:
      type: value
      path: nupkg.name
      regex: '^d365(bap|fo)\.tools$'

  - id: d365-tools-basename
    desc: D365 administrative tools module basename
    for: [powershell]
    if:
      type: path
      basename: true
      regex: '^d365(bap|fo)\.tools\.(psm1|psd1|nuspec)$'
      case_insensitive: true

  - id: d365-tools-token
    desc: D365 BAP or FO tools identity token
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(d365bap\.tools|d365fo\.tools|Add-UdeWindowsDefenderRules)\b'

composite_rules:
  - id: d365-admin-tools
    desc: Dynamics 365 BAP and FO administrative and development tools
    conf: 0.98
    any:
      - id: d365-tools-package
      - id: d365-tools-basename
      - id: d365-tools-token
