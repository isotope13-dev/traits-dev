defaults:
  platforms: [macos]
  crit: notable
  conf: 0.95

traits:
  - id: macserial-source-marker
    desc: macserial source filename marker
    for: [macho]
    size_min: 65536
    size_max: 4000000
    if:
      type: text
      section: __TEXT,__cstring
      substr: macserial.c

  - id: macserial-generation-option
    desc: macserial generation option
    for: [macho]
    size_min: 65536
    size_max: 4000000
    if:
      type: text
      section: __TEXT,__cstring
      substr: --generate-all

  - id: macserial-info-option
    desc: macserial serial-info option
    for: [macho]
    size_min: 65536
    size_max: 4000000
    if:
      type: text
      section: __TEXT,__cstring
      substr: --info <serial>

  - id: nvram-hook-organization
    desc: OpenCore NVRAM hook organization marker
    for: [shell]
    if:
      type: text
      substr: org.acidanthera.nvramhook

  - id: launchd-command-name
    desc: OpenCore Launchd helper filename marker
    for: [shell]
    if:
      type: basename
      exact: Launchd.command

composite_rules:
  - id: macserial-tool
    desc: Acidanthera macserial hardware utility
    crit: notable
    for: [macho]
    all:
      - id: macserial-source-marker
      - id: macserial-generation-option
      - id: macserial-info-option

  - id: opencore-nvram-launchd-helper
    desc: OpenCore NVRAM-saving launchd helper
    crit: notable
    for: [shell]
    all:
      - id: nvram-hook-organization
      - id: launchd-command-name
