defaults:
  size_max: 52428800
  for: [pe]
  platforms: [windows]
  crit: baseline
  conf: 0.99

traits:
  - id: unlocker-device
    desc: IObit Unlocker device name
    crit: notable
    if:
      type: text
      exact: "\\Device\\IObitUnlockerDevice"
      section: rdata
  - id: unlocker-application-product
    desc: IObit Unlocker application product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Unlocker
  - id: iobit-publisher-company
    desc: IObit publisher metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: IObit Information Technology
  - id: iobit-publisher-signature
    desc: IObit publisher certificate subject
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)O=IObit CO\.'
  - id: unlocker-installer-name
    desc: IObit Unlocker installer filename
    crit: notable
    if:
      type: value
      path: file.basename
      exact: unlocker-setup.exe
  - id: unlocker-installer-product
    desc: IObit Unlocker installer product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: IObit Unlocker
  - id: iobit-publisher-company-installer
    desc: IObit installer publisher metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: IObit
  - id: unlocker-installer-signature
    desc: Unlocker installer distributor certificate
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)O=ORANGE VIEW LIMITED'

composite_rules:
  - id: iobit-unlocker-application-context
    desc: Signed IObit Unlocker application identity
    crit: notable
    all:
      - id: unlocker-application-product
      - id: iobit-publisher-company
      - id: iobit-publisher-signature
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  - id: iobit-unlocker-installer-context
    desc: IObit Unlocker installer identity
    crit: notable
    all:
      - id: unlocker-installer-name
      - id: unlocker-installer-product
      - id: iobit-publisher-company-installer
      - id: unlocker-installer-signature
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
