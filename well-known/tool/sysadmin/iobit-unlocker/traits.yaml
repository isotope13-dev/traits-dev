defaults:
  size_max: 52428800
  for: [pe]
  platforms: [windows]
  crit: baseline
  conf: 0.99

traits:
  - id: unlocker-device
    desc: IObit Unlocker device name
    crit: notable
    if:
      type: text
      exact: "\\Device\\IObitUnlockerDevice"
      section: rdata
  - id: unlocker-application-product
    desc: IObit Unlocker application product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Unlocker
  - id: unlocker-application-company
    desc: IObit Unlocker application publisher metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: IObit Information Technology
  - id: unlocker-iobit-signature
    desc: IObit Unlocker publisher certificate subject
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)O=IObit CO\.'
  - id: unlocker-signature-verified
    desc: Verified Authenticode signature
    crit: notable
    if:
      type: value
      path: pe.signatures[0].verified
      regex: '^true$'
  - id: unlocker-installer-name
    desc: IObit Unlocker installer filename
    crit: notable
    if:
      type: value
      path: file.basename
      exact: unlocker-setup.exe
  - id: unlocker-installer-product
    desc: IObit Unlocker installer product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: IObit Unlocker
  - id: unlocker-installer-company
    desc: IObit Unlocker installer publisher metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: IObit
  - id: unlocker-installer-inno-marker
    desc: IObit Unlocker Inno Setup marker
    crit: notable
    if:
      type: value
      path: pe.version.comments
      substr: Inno Setup
  - id: unlocker-installer-signature
    desc: Unlocker installer distributor certificate
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)O=ORANGE VIEW LIMITED'

composite_rules:
  - id: iobit-unlocker-application-context
    desc: Signed IObit Unlocker application identity
    crit: notable
    all:
      - id: unlocker-application-product
      - id: unlocker-application-company
      - id: unlocker-iobit-signature
      - id: unlocker-signature-verified
  - id: iobit-unlocker-installer-context
    desc: IObit Unlocker installer identity
    crit: notable
    all:
      - id: unlocker-installer-name
      - id: unlocker-installer-product
      - id: unlocker-installer-company
      - id: unlocker-installer-inno-marker
      - id: unlocker-installer-signature
      - id: unlocker-signature-verified
