defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 10240
  size_max: 2097152

traits:
  - id: cygwin-kill-basename
    desc: Cygwin kill executable name
    if:
      type: basename
      exact: kill.exe

  - id: cygwin-kill-banner
    desc: Cygwin kill process signaller banner
    if:
      type: text
      substr: "kill (cygwin)"
      section: .rdata

  - id: cygwin-kill-signaller-text
    desc: Cygwin process signaller title
    if:
      type: text
      substr: "Process Signaller"
      section: .rdata

  - id: cygwin-winpid-symbol
    desc: Cygwin Windows PID conversion import
    if:
      type: symbol
      exact: cygwin_winpid_to_pid

composite_rules:
  - id: cygwin-kill-utility
    desc: Recognized Cygwin or MSYS2 kill utility
    crit: notable
    conf: 0.99
    all:
      - id: cygwin-kill-banner
      - id: cygwin-kill-signaller-text
    any:
      - id: cygwin-kill-basename
      - id: cygwin-winpid-symbol
