defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 10485760
traits:
- id: subsystem-controller-name
  desc: App-V subsystem controller symbol text
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "AppV::Client::Virtualization::SubsystemController::"
    section: .text
- id: subsystem-registry
  desc: App-V subsystem registry path
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "SOFTWARE\\Microsoft\\AppV\\Subsystem"
    section: .text
- id: subsystem-runtime
  desc: App-V virtual services runtime text
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "Virtual Services"
    section: .text
- id: mavinject-allowlist
  desc: App-V mavinject allowlist marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "/INJECTRUNNING"
    section: .text
- id: mavinject-original-filename-versioninfo
  desc: Microsoft MavInject original filename
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.original_filename
    exact: mavinject32.exe
    case_insensitive: true
- id: appv-product-name-versioninfo
  desc: Microsoft App-V product name
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: Microsoft Application Virtualization (App-V)
composite_rules:
- id: microsoft-appv-mavinject
  desc: Microsoft App-V MavInject utility
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: mavinject-original-filename-versioninfo
  - id: appv-product-name-versioninfo
  - id: micro-behaviors/process/inject/runtime/call::mavinject-injectrunning-string
- id: subsystem-controller
  desc: Microsoft App-V subsystem controller
  crit: notable
  conf: 0.98
  all:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  any:
  - id: subsystem-controller-name
  - id: subsystem-registry
  - id: subsystem-runtime
  - id: mavinject-allowlist
