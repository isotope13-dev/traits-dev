# Chocolatey (Windows package manager) artifact filenames. These ship in
# every Chocolatey install and carry no signal alone; malware that masquerades
# as a Chocolatey installer embeds them as decoys. Component-only — referenced
# by family composites that add the real malicious behavior.
defaults:
  platforms: [windows]
  for: [pe, dll, scripts]
  crit: component
  conf: 0.5
  size_min: 512
  size_max: 50000000
traits:
  - id: installer-script-url
    desc: Chocolatey installer script URL
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)(community\.)?chocolatey\.org/install\.ps1'
  - id: refresh-env-cmd
    desc: Chocolatey RefreshEnv.cmd filename
    if:
      type: text
      substr: RefreshEnv.cmd
  - id: package-cache-location-ps1
    desc: "Chocolatey Get-PackageCacheLocation.ps1 file"
    if:
      type: text
      substr: Get-PackageCacheLocation.ps1
  - id: library-original-filename
    desc: chocolatey.dll original filename
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: chocolatey.dll
  - id: library-basename
    desc: chocolatey.dll assembly basename
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: path
      basename: true
      exact: chocolatey.dll
composite_rules:
  - id: official-library-dll
    desc: Official Chocolatey library DLL
    crit: notable
    conf: 0.99
    for: [pe, dll]
    all:
      - id: library-original-filename
      - id: library-basename
  - id: official-shimgen-pe
    desc: Official Chocolatey shimgen PE
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: objectives/evasion/masquerade/binary::chocolatey-shimgen-strings
      - id: objectives/evasion/masquerade/binary::chocolatey-shimgen-banner
  - id: official-library-pe-context
    desc: Recognized Chocolatey library or shimgen PE
    crit: exception
    conf: 0.99
    for: [pe, dll]
    any:
      - id: official-library-dll
      - id: official-shimgen-pe
