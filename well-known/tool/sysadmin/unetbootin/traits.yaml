# UNetbootin ships Syslinux and mke2fs as boot-media helpers. Their
# section layout and import tables are the bootloader tools, not a dropper.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [pe, macho, elf, data]
  size_min: 512
  size_max: 20000000
traits:
  - id: syslinux-windows-exe
    desc: Syslinux Windows installer
    if:
      type: path
      basename: true
      exact: syslinux.exe
  - id: unetbootin-syslinux-blob
    desc: UNetbootin bundled syslinux blob
    if:
      type: path
      basename: true
      exact: ubnsylnx64
  - id: syslinux-mac-binary
    desc: Syslinux macOS helper
    if:
      type: path
      basename: true
      exact: syslinux-mac
  - id: mke2fs-basename
    desc: e2fsprogs mke2fs utility
    if:
      type: path
      basename: true
      exact: mke2fs
  - id: unetbootin-linux-binary
    desc: UNetbootin Linux image
    if:
      type: path
      substr: unetbootin-linux
