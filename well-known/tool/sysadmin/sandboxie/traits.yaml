defaults:
  size_max: 52428800
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: sandboxie-product-marker
  desc: Sandboxie product marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: Sandboxie
    section: rsrc
- id: sbie-component-marker
  desc: Sandboxie component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: \bSbie(Dll|Svc|Drv)\b
    section: rdata
- id: sandboxie-component-basename
  desc: Sandboxie component filename
  crit: component
  conf: 0.95
  if:
    type: path
    basename: true
    regex: '(?i)^(Sbie|Sandboxie|Sbox)'
- id: sandboxie-helper-basename
  desc: Sandboxie helper filename
  crit: component
  conf: 0.95
  if:
    type: path
    basename: true
    regex: '(?i)^(Sandboxie|SboxHostDll)'
- id: sandboxie-sbie-basename
  desc: Sandboxie Sbie component filename
  crit: component
  conf: 0.95
  if:
    type: path
    basename: true
    regex: '(?i)^Sbie[A-Za-z]{3,12}\.(exe|dll|sys)$'
- id: sandboxie-lowlevel-pdb
  desc: Sandboxie low-level PDB path
  crit: component
  conf: 0.98
  if:
    type: text
    substr: \Sandboxie\core\low\obj\
    section: rdata
- id: sandboxie-installer-description
  desc: Sandboxie installer version description
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.description
    exact: Sandboxie Installer
- id: sandboxie-installer-company
  desc: Sandboxie installer company metadata
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.company
    exact: Sandboxie-Plus.com
- id: sandboxie-product-identity
  desc: Sandboxie product version identity
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: Sandboxie
- id: sandboxie-updater-identity
  desc: Sandboxie updater filename
  crit: notable
  conf: 0.99
  if:
    type: path
    basename: true
    exact: UpdUtil.exe
    case_insensitive: true
- id: sandboxie-source-marker--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.95
  for:
  - c
  - cpp
  - javascript
  - batch
  platforms:
  - windows
  - unix
  if:
    type: text
    substr: Sandboxie
  count_max: 1004167
- id: sandboxie-source-marker--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.95
  for:
  - c
  - cpp
  - javascript
  - batch
  platforms:
  - windows
  - unix
  if:
    type: text
    substr: QSbieAPI
  count_max: 1004168
- id: sandboxie-source-marker--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.95
  for:
  - c
  - cpp
  - javascript
  - batch
  platforms:
  - windows
  - unix
  if:
    type: text
    substr: SandMan
  count_max: 1004169
- id: sandboxie-source-path
  desc: Sandboxie source archive path
  crit: component
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - c
  - cpp
  - javascript
  - batch
  if:
    type: path
    regex: '(^|[\\/])Sandboxie-[0-9].{0,40}[\\/]'
composite_rules:
- id: sandboxie-component-identity
  desc: Known Sandboxie component filename
  crit: notable
  conf: 0.99
  any:
  - id: sandboxie-sbie-basename
  - id: sandboxie-helper-basename
- id: sandboxie-component
  desc: Sandboxie binary or source component marker
  crit: notable
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - c
  - cpp
  - javascript
  - batch
  any:
  - id: sandboxie-product-marker
  - id: sbie-component-marker
  - id: sandboxie-component-basename
  - id: sandboxie-helper-basename
  - id: sandboxie-sbie-basename
  - id: sandboxie-lowlevel-pdb
  - id: sandboxie-source-marker
  - id: sandboxie-source-path
- id: signed-sandboxie-component
  desc: Signed Sandboxie component marker
  crit: notable
  conf: 0.98
  all:
  - id: sandboxie-component-identity
  - id: metadata/signed/leaf::tonalio-gmbh
- id: sandboxie-installer-identity
  desc: Sandboxie NSIS installer identity
  crit: notable
  conf: 0.99
  all:
  - id: sandboxie-product-marker
  - id: sandboxie-installer-description
  - id: sandboxie-installer-company
  - id: metadata/binary/installer/script::nsis
- id: signed-sandboxie-installer
  desc: Signed Sandboxie NSIS installer
  crit: notable
  conf: 0.99
  all:
  - id: sandboxie-installer-identity
  - id: metadata/signed/leaf::tonalio-gmbh
- id: signed-sandboxie-driver
  desc: WHQL-signed Sandboxie kernel driver
  crit: notable
  conf: 0.99
  all:
  - id: sandboxie-component-identity
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/signed/certificate/identity::pe-whql-hardware-compat-attestation
- id: signed-sandboxie-product
  desc: Signed Sandboxie product binary
  crit: notable
  conf: 0.99
  all:
  - id: sandboxie-product-identity
  - id: metadata/signed/leaf::tonalio-gmbh
- id: signed-sandboxie-updater
  desc: Signed Sandboxie updater
  crit: notable
  conf: 0.99
  all:
  - id: sandboxie-updater-identity
  - id: metadata/signed/leaf::tonalio-gmbh
- id: sandboxie-known-signed-context
  desc: Recognized signed Sandboxie installer or component
  crit: exception
  conf: 0.99
  any:
  - id: signed-sandboxie-component
  - id: signed-sandboxie-driver
  - id: signed-sandboxie-product
  - id: signed-sandboxie-updater
- id: sandboxie-source-marker
  desc: Sandboxie source code marker
  crit: component
  conf: 0.95
  for:
  - c
  - cpp
  - javascript
  - batch
  platforms:
  - windows
  - unix
  any:
  - id: sandboxie-source-marker--rx-1
  - id: sandboxie-source-marker--rx-2
  - id: sandboxie-source-marker--rx-3
