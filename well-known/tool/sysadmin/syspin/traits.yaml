defaults:
  platforms: [windows]
  for: [pe]
  size_max: 200000

traits:
  - id: technosys-company
    desc: Technosys Corporation PE company metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      regex: '^\s*Technosys Corporation\s*$'

  - id: syspin-description
    desc: Pin To Taskbar PE description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      regex: '^\s*Pin To Taskbar\s*$'

  - id: syspin-internal-name
    desc: syspin executable internal name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      regex: '^\s*syspin\.exe\s*$'

  - id: syspin-brand-marker
    desc: Technosys Pin To Taskbar banner
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: Technosys Pin To Taskbar Utility
      section: .text

  - id: syspin-version-marker
    desc: Pin To Taskbar utility version banner
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: Pin To Taskbar Utility v0.99.9.1
      section: .text

  - id: syspin-version
    desc: Pin To Taskbar utility version metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.file_version
      regex: '^\s*0\.99\.9\.1\s*$'

  - id: syspin-command-interface
    desc: syspin pin and unpin command interface
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'syspin ["file"]'
      section: .text

composite_rules:
  - id: syspin-pin-to-taskbar
    desc: Technosys Pin To Taskbar utility identity
    crit: notable
    conf: 0.99
    all:
      - id: syspin-brand-marker
      - id: syspin-version-marker
      - id: syspin-command-interface
