# Err.exe is Microsoft's own error-code lookup tool (Windows SDK / Exchange
# lineage): it maps HRESULT, NTSTATUS and Win32 codes to names and messages and
# ships as a standalone, often unsigned build with Microsoft's VERSIONINFO. A
# real Microsoft claim on an unsigned binary is the masquerade tell, so the
# tool is recognized by its original filename and internal name together.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97
  size_min: 524288
  size_max: 16777216

traits:
  - id: err-original-filename
    desc: VERSIONINFO original filename Err.EXE
    if:
      type: value
      path: pe.version.original_filename
      exact: Err.EXE

  - id: err-internal-name
    desc: VERSIONINFO internal name Err
    if:
      type: value
      path: pe.version.internal_name
      exact: Err

composite_rules:
  - id: microsoft-err-lookup-tool
    desc: Microsoft Err error-code lookup tool
    crit: exception
    all:
      - id: err-original-filename
      - id: err-internal-name
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
