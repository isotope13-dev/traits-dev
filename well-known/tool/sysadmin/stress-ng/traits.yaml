# Colin Ian King's stress-ng system stress testing tool.
defaults:
  platforms: [linux]
  for: [elf, alpine_apk]
  crit: baseline
  conf: 0.98
  size_max: 200000000

traits:
  - id: stress-ng-basename
    desc: stress-ng executable basename
    crit: notable
    for: [elf]
    if:
      type: path
      basename: true
      exact: stress-ng
  - id: stress-ng-marker
    desc: stress-ng settings banner
    crit: notable
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: 'stress-ng settings:'
  - id: stress-ng-apk-path
    desc: Alpine stress-ng package archive
    crit: notable
    for: [alpine_apk]
    if:
      type: path
      regex: '(?i)(^|[\\/])stress-ng-[^\\/]+\.apk$'
  - id: stress-ng-source-tree-path
    desc: stress-ng source tree path
    crit: notable
    for: [c, cpp, shell, makefile]
    if:
      type: path
      regex: '(?i)stress-ng(@|[-_][0-9v]|[\\/])'
  - id: stress-ng-header-include
    desc: stress-ng header include
    crit: notable
    for: [c, cpp]
    if:
      type: text
      regex: '#include\s*["<]stress-ng\.h[">]'
  - id: stress-ng-author
    desc: stress-ng author credit
    crit: notable
    for: [c, cpp]
    if:
      type: text
      substr: 'Colin Ian King'

composite_rules:
  - id: stress-ng
    desc: stress-ng system stress testing tool
    crit: notable
    for: [elf, alpine_apk, c, cpp, shell, makefile]
    any:
      - id: stress-ng-basename
      - id: stress-ng-marker
      - id: stress-ng-apk-path
      - id: stress-ng-source-tree-path
  - id: stress-ng-source-context
    desc: stress-ng source file context
    crit: exception
    for: [c, cpp]
    all:
      - id: stress-ng-source-tree-path
    any:
      - id: stress-ng-header-include
      - id: stress-ng-author
