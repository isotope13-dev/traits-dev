defaults:
  platforms: [linux, android]
  for: [elf]
  size_min: 10000
  size_max: 2000000

traits:
  - id: proot-basename
    desc: PRoot executable basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      exact: proot

  - id: proot-guest-root-help
    desc: PRoot guest filesystem help text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "Use *path* as the new guest root file-system"
      section: .rodata

composite_rules:
  - id: proot-binary
    desc: PRoot userspace chroot implementation
    crit: notable
    conf: 0.99
    all:
      - id: proot-basename
      - id: proot-guest-root-help
