defaults:
  platforms:
    - linux
    - android
  for: [elf]
  crit: baseline
  conf: 0.95
  size_max: 10000000
traits:
  - id: toybox-banner
    desc: Toybox multi-call binary signature
    crit: notable
    conf: 0.95
    size_min: 10000
    if:
      type: text
      section: .rodata
      substr: 'Toybox %s multicall binary'
  - id: toybox-url
    desc: Toybox project URL reference
    crit: baseline
    conf: 0.95
    size_min: 10000
    if:
      type: text
      section: .rodata
      substr: 'https://landley.net/toybox'
  - id: toybox-main-symbol
    desc: Toybox main dispatcher symbol
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: toybox_main
  - id: toybox-binary-basename
    desc: Toybox executable basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      exact: toybox
composite_rules:
  - id: toybox-url-and-name
    desc: Toybox URL and basename
    crit: baseline
    conf: 0.95
    all:
      - id: toybox-url
      - id: toybox-binary-basename
  - id: toybox-binary
    desc: Toybox multi-call binary signature
    crit: notable
    conf: 0.98
    any:
      - id: toybox-banner
      - id: toybox-main-symbol
      - id: toybox-url-and-name
