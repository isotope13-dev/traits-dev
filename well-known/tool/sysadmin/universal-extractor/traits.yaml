defaults:
  crit: notable
  size_max: 52428800
  platforms: [windows]
  for: [pe]

traits:
  - id: universal-extractor-updater
    desc: Universal Extractor update utility string
    conf: 0.95
    if:
      type: text
      exact: Update utility for Universal Extractor
      section: rdata
  - id: universal-extractor-description
    desc: Universal Extractor application description
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: Universal Extractor
composite_rules:
  - id: universal-extractor-application
    desc: Universal Extractor application identity
    conf: 0.99
    all:
      - id: universal-extractor-description
      - id: metadata/lang/compiled::autoit-runtime-comment
