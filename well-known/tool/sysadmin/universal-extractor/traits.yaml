defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]

traits:
  - id: universal-extractor-updater
    desc: Universal Extractor updater marker
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: Update utility for Universal Extractor
      section: rdata
  - id: universal-extractor-description
    desc: Universal Extractor application description
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: Universal Extractor
  - id: universal-extractor-autoit-comment
    desc: Universal Extractor AutoIt runtime comment
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.comments
      exact: http://www.autoitscript.com/autoit3/
composite_rules:
  - id: universal-extractor-application
    desc: Universal Extractor application identity
    crit: notable
    conf: 0.99
    all:
      - id: universal-extractor-description
      - id: universal-extractor-autoit-comment
