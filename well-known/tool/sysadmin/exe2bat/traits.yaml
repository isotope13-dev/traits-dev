# exe2bat — classic EXE-to-batch converter shipped in Kali windows-resources.
# Emits a .bat that rebuilds the input via debug.exe script (debug<123.hex);
# the ||exe2batch|| marker plus the debug script prologue identify this tool.
# cmd.exe/VirtualAlloc/CreateProcess strings are the converter's own runtime,
# not a backdoor stub.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97
  size_min: 16384
  size_max: 262144

traits:
  - id: exe2batch-marker
    desc: exe2bat converter marker string
    if:
      type: text
      substr: '||exe2batch||'
      section: .data

  - id: debug-script-prologue
    desc: exe2bat debug.exe script prologue
    if:
      type: text
      substr: 'debug<123.hex'
      section: .data

composite_rules:
  - id: exe2bat-converter-binary
    desc: Recognized exe2bat EXE-to-batch converter
    all:
      - id: exe2batch-marker
      - id: debug-script-prologue
