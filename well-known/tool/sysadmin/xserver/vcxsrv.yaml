defaults:
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1048576
  size_max: 10485760

traits:
  - id: vcxsrv-product-name
    desc: VcXsrv X server product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: VcXsrv

  - id: vcxsrv-original-filename
    desc: VcXsrv executable filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: vcxsrv.exe

  - id: vcxsrv-description
    desc: VcXsrv Windows X server description
    if:
      type: value
      path: pe.version.description
      exact: VcXsrv windows xserver

composite_rules:
  - id: vcxsrv-x-server
    desc: VcXsrv Windows X server
    all:
      - id: vcxsrv-product-name
      - id: vcxsrv-original-filename
      - id: vcxsrv-description
