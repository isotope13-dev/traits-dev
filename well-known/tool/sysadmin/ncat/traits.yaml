# Ncat is the Nmap Project's documented netcat-compatible network utility.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 10000000

traits:
  - id: ncat-binary-name
    desc: Ncat executable basename
    if:
      type: basename
      exact: ncat

  - id: ncat-project-marker
    desc: Ncat upstream project marker
    if:
      type: text
      section: .rodata
      substr: https://nmap.org/ncat

  - id: ncat-package-identity
    desc: Nmap package name and version attestation
    if:
      type: text
      section: .note.package
      regex: '"name"\s*:\s*"nmap"\s*,\s*"version"\s*:\s*".{1,50}"'

composite_rules:
  - id: ncat-utility
    desc: Ncat network utility identity
    all:
      - id: ncat-binary-name
      - id: ncat-project-marker
