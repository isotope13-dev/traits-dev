defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: ps-scoop-bootstrap-irm-iex
    desc: PowerShell bootstraps Scoop via irm|iex
    crit: notable
    conf: 0.95
    for: [powershell, batch, text]
    if:
      type: text
      regex: '(?i)\birm\b[^\r\n]{0,40}get\.scoop\.sh[^\r\n]{0,40}\|\s*iex\b'
