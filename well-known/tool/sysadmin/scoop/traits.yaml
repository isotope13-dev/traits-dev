# Scoop (get.scoop.sh) — Windows package manager. Official bootstrap is
# `Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression`, then
# `scoop install` / `scoop bucket add`. That IRM|IEX shape matches fileless
# dropper composites; identity here suppresses intent, not the capability atoms.
defaults:
  platforms: [windows]
  for: [powershell, batch, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: scoop-bootstrap-url
    desc: Scoop official get.scoop.sh bootstrap URL
    if:
      type: text
      substr: get.scoop.sh

  - id: scoop-cli-install-or-bucket
    desc: Scoop CLI install or bucket command
    if:
      type: text
      regex: '(?i)\bscoop\s+(install|bucket)\b'

composite_rules:
  - id: scoop-bootstrap-installer-context
    desc: Official Scoop package-manager bootstrap installer
    crit: exception
    conf: 0.99
    all:
      - id: scoop-bootstrap-url
      - id: scoop-cli-install-or-bucket
