# GitHub Agentic Workflows (gh-aw) official action bundle — compiles agent
# workflows, runs security scans, and ships pinned gh-aw-firewall containers.
defaults:
  platforms: [unix, windows]
  for: [github-actions, javascript, typescript, shell, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: gh-aw-metadata-header
    desc: gh-aw generated workflow metadata header
    for: [github-actions]
    if:
      type: text
      substr: "# gh-aw-metadata:"

  - id: gh-aw-manifest-header
    desc: gh-aw resolved workflow manifest header
    for: [github-actions]
    if:
      type: text
      substr: "# gh-aw-manifest:"

  - id: gh-aw-compiler-banner
    desc: gh-aw compiler generated-workflow banner
    for: [github-actions]
    if:
      type: text
      regex: '(?m)^#\s*This file was automatically generated by gh-aw\b'

  - id: gh-aw-actions-setup-uses
    desc: Workflow uses gh-aw-actions setup action
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '^github/gh-aw-actions/(setup|setup-cli)@'

  - id: gh-aw-firewall-container
    desc: gh-aw firewall container image reference
    for: [github-actions]
    if:
      type: text
      regex: 'ghcr\.io/github/gh-aw-firewall/'

  - id: gh-aw-source-tree-path
    desc: gh-aw-actions source archive member path
    if:
      type: path
      regex: '(^|[\\/])gh-aw-actions-[0-9a-f]{40}([\\/]|$)'

composite_rules:
  - id: gh-aw-actions-identity
    desc: GitHub Agentic Workflows action bundle
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: gh-aw-metadata-header
      - id: gh-aw-manifest-header
      - id: gh-aw-compiler-banner
      - id: gh-aw-actions-setup-uses
      - id: gh-aw-firewall-container
      - id: gh-aw-source-tree-path
