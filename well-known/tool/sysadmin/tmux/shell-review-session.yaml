defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, shell]
  size_min: 4
traits:
  - id: tmux-command-literal
    desc: tmux command token
    crit: component
    conf: 0.85
    if:
      type: text
      word: tmux

composite_rules:
  - id: tmux-session-control
    desc: tmux and new-session tokens
    crit: notable
    conf: 0.9
    all:
      - id: tmux-command-literal
      - id: metadata/lang/source/literal/string/command::new-session-command-token

  - id: tmux-send-keys-injection
    desc: tmux and send-keys tokens
    crit: notable
    conf: 0.9
    all:
      - id: tmux-command-literal
      - id: metadata/lang/source/literal/string/command::send-keys-command-token

  - id: tmux-pane-capture
    desc: tmux and capture-pane tokens
    crit: notable
    conf: 0.9
    all:
      - id: tmux-command-literal
      - id: metadata/lang/source/literal/string/command::capture-pane-command-token
