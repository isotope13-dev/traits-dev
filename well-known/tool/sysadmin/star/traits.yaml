# Schily star archive utility identity.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000
  size_max: 2000000

traits:
  - id: star-program-basename
    desc: Schily star executable basename
    if:
      type: path
      basename: true
      exact: star

composite_rules:
  - id: star-archive-utility
    desc: Schily star archive utility
    crit: notable
    conf: 0.99
    all:
      - id: star-program-basename
      - id: metadata/file/string/identity::star-archive-format-marker
      - id: metadata/file/string/identity::star-default-config-marker
