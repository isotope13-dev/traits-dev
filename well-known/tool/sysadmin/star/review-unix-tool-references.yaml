# Stable strings used as components of named Unix system-tool identities.
defaults:
  size_min: 1
  platforms: [unix]
  for: [binaries]
  crit: component
  conf: 0.98
traits:
  - id: star-archive-format-marker
    crit: notable
    desc: Schily star archive-format name
    if:
      type: text
      exact: Extended standard tar (star 1994)
  - id: star-default-config-marker
    crit: notable
    desc: Schily star default-config path reference
    if:
      type: text
      exact: /etc/default/star
