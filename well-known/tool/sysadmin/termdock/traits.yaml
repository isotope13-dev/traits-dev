# Termdock — published MIT-licensed "web-based terminal application"
# (github.com/Jovines/termdock, npm `termdock`/`td`). An Express + ws + tmux +
# node-pty server that exposes a browser terminal (xterm.js) over WebSocket,
# documented with an optional password, cookie sessions, CSRF protection, and
# an explicit 401 rejection of unauthenticated WebSocket upgrade attempts. The
# WebSocket-driven PTY that its own route module implements is the product's
# core feature, not a backdoor; the auth gate that proves that lives in a
# separate server-bootstrap file, so this identity (present directly in the
# route module itself) is what the PTY-relay composites key off instead.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: config-directory-reference
    desc: Termdock user config directory path
    if:
      type: text
      substr: '/.termdock'

  - id: tmux-option-prefix
    desc: Termdock tmux user-option namespace
    if:
      type: text
      substr: '@termdock-'

composite_rules:
  - id: package-context
    desc: Termdock web-terminal package context
    crit: notable
    conf: 0.97
    any:
      - id: config-directory-reference
      - id: tmux-option-prefix
