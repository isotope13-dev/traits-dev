defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  size_max: 5000000
traits:
- id: gnulib-locale-functions-set
  size_min: 512
  size_max: 500000000
  desc: Gnulib setlocale support functions
  crit: notable
  conf: 0.95
  if:
    type: symbol
    regex: setlocale_(null|mtsafe|single|unixlike)
- id: gnulib-locale-functions-gl
  size_min: 512
  size_max: 500000000
  desc: Gnulib gl_locale_name support functions
  crit: notable
  conf: 0.95
  if:
    type: symbol
    regex: gl_locale_name_(default|environ)
- id: gettext-windows-basename
  desc: GNU gettext binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: gettext.exe
    case_insensitive: true
- id: ngettext-windows-basename
  desc: GNU ngettext binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: ngettext.exe
    case_insensitive: true
- id: msgcat-windows-basename
  desc: GNU msgcat binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: msgcat.exe
    case_insensitive: true
- id: msgfmt-windows-basename
  desc: GNU msgfmt binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: msgfmt.exe
    case_insensitive: true
- id: msggrep-windows-basename
  desc: GNU msggrep binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: msggrep.exe
    case_insensitive: true
- id: msgmerge-windows-basename
  desc: GNU msgmerge binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: msgmerge.exe
    case_insensitive: true
- id: msgunfmt-windows-basename
  desc: GNU msgunfmt binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: msgunfmt.exe
    case_insensitive: true
- id: xgettext-windows-basename
  desc: GNU xgettext binary basename
  crit: component
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: xgettext.exe
    case_insensitive: true
composite_rules:
- id: gettext-windows-utility
  desc: GNU gettext Windows utility
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]
  any:
  - id: gettext-windows-basename
  - id: ngettext-windows-basename
  - id: msgcat-windows-basename
  - id: msgfmt-windows-basename
  - id: msggrep-windows-basename
  - id: msgmerge-windows-basename
  - id: msgunfmt-windows-basename
  - id: xgettext-windows-basename
- id: gnulib-locale-functions
  size_min: 512
  size_max: 500000000
  desc: Gnulib locale support functions
  crit: notable
  any:
  - id: well-known/tool/sysadmin/locale::gnulib-locale-functions-gl
  - id: well-known/tool/sysadmin/locale::gnulib-locale-functions-set
