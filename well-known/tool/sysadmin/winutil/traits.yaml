# Chris Titus Tech Windows Utility (winutil) — open-source Windows debloater, optimizer and package manager.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.98
  size_max: 52428800

traits:
  - id: winutil-header-author
    desc: Chris Titus Tech WinUtil script author header
    for: [powershell]
    if:
      type: text
      regex: '(?i)Author\s*:\s*Chris\s*Titus\s*@christitustech'

  - id: winutil-repo-reference
    desc: Chris Titus Tech WinUtil repository URL
    for: [powershell, markdown, text]
    if:
      type: text
      substr: 'github.com/ChrisTitusTech/winutil'

  - id: winutil-function-identifier
    desc: WinUtil command and helper function definition
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bfunction\s+(Invoke-WinUtil|Test-WinUtilOwnsFileProcess|Invoke-WinUtilISOScript)\b'

composite_rules:
  - id: winutil-utility-context
    desc: Recognized Chris Titus Tech Windows Utility
    crit: exception
    scope: archive
    any:
      - id: winutil-header-author
      - id: winutil-repo-reference
      - id: winutil-function-identifier
