defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 16384
  size_max: 5242880
traits:
  - id: advancedrun-product-versioninfo
    desc: AdvancedRun product version information
    if:
      type: value
      path: pe.version.product_name
      exact: AdvancedRun
  - id: advancedrun-original-filename
    desc: AdvancedRun original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: AdvancedRun.exe
  - id: nir-sofer-signer
    desc: Claims Nir Sofer certificate subject
    if:
      type: value
      path: pe.signatures[0].subject
      substr: CN=Nir Sofer,
  # NirSoft ships AdvancedRun from a VS2005 build tree; the CodeView PDB
  # path is part of the build identity, like Procexp's PDB, and pairs
  # with the version fields so a lone forged string is not enough.
  - id: advancedrun-pdb
    desc: AdvancedRun release PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: AdvancedRun.pdb
composite_rules:
  # Version and PDB identity without a signer claim: the shipped build's
  # two-certificate chain never reaches metadata/signature/verified/,
  # so this is the benign-context leg objective rules may suppress with.
  - id: advancedrun-build-identity
    desc: NirSoft AdvancedRun build identity
    all:
      - id: nirsoft-company-versioninfo
      - id: advancedrun-product-versioninfo
      - id: advancedrun-original-filename
      - id: advancedrun-pdb

  - id: signed-advancedrun-utility
    desc: Intact signed NirSoft AdvancedRun utility
    all:
      - id: metadata/signature/verified/
      - id: nirsoft-company-versioninfo
      - id: advancedrun-product-versioninfo
      - id: advancedrun-original-filename
      - id: nir-sofer-signer
      - id: metadata/signature/certificate/integrity::pe-signature-verified
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
