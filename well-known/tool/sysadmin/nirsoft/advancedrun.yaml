defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 16384
  size_max: 5242880
traits:
  - id: advancedrun-product-versioninfo
    desc: AdvancedRun product version information
    if:
      type: value
      path: pe.version.product_name
      exact: AdvancedRun
  - id: advancedrun-original-filename
    desc: AdvancedRun original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: AdvancedRun.exe
  - id: nir-sofer-signer
    desc: Nir Sofer code-signing certificate subject
    if:
      type: value
      path: pe.signatures[0].subject
      substr: CN=Nir Sofer,
composite_rules:
  - id: signed-advancedrun-utility
    desc: Intact signed NirSoft AdvancedRun utility
    all:
      - id: nirsoft-company-versioninfo
      - id: advancedrun-product-versioninfo
      - id: advancedrun-original-filename
      - id: nir-sofer-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
