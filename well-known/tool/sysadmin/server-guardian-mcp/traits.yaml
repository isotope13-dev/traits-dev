# server-guardian-mcp — MIT SSH/Linux server monitoring MCP for Claude.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: server-guardian-mcp PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: server-guardian-mcp

  - id: wheel-distribution
    desc: server_guardian_mcp wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: server_guardian_mcp

  - id: mcp-product-banner
    desc: Server Guardian MCP product banner
    for: [python]
    if:
      type: text
      substr: 'Server Guardian MCP'

  - id: dangerous-override-env
    desc: Guardian dangerous-ops override env
    for: [python]
    if:
      type: text
      substr: 'GUARDIAN_ALLOW_DANGEROUS'

composite_rules:
  - id: server-guardian-mcp-runtime
    desc: Server Guardian MCP product
    any:
      - id: pypi-name
      - id: wheel-distribution
      - id: mcp-product-banner
      - id: dangerous-override-env
