# Version-resource fields are self-reported claims, not signature verification.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.98
traits:
- id: autohotkey-h-product-field
  desc: PE product field declares AutoHotkey_H
  if:
    type: value
    path: pe.version.product_name
    exact: AutoHotkey_H
