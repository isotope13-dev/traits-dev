# AutoHotkey — legitimate Windows macro and UI automation interpreter.
defaults:
  platforms: [windows]
  for: [pe, chm, html]
  crit: notable
  conf: 0.98
  size_min: 100
  size_max: 50000000

traits:
  - id: autohotkey-foundation-vendor
    desc: AutoHotkey Foundation vendor string
    for: [pe]
    size_min: 500000
    size_max: 5000000
    if:
      type: text
      substr: AutoHotkey Foundation
      section: .rsrc

  - id: autohotkey-product-description
    desc: AutoHotkey PE product description
    for: [pe]
    size_min: 500000
    size_max: 5000000
    if:
      type: text
      regex: '(?i)AutoHotkey\s+\d'
      section: .rsrc

  - id: autohotkey-chm-docs-marker
    desc: AutoHotkey help CHM documentation tree
    for: [chm]
    size_min: 500000
    size_max: 5000000
    if:
      type: raw
      regex: '(?i)AutoHotkey(_L-Docs|\s+v[0-9]\s+Help)'

  - id: autohotkey-docs-html
    desc: AutoHotkey documentation page marker
    for: [html]
    if:
      type: text
      regex: '(?i)(<title>[^<]{0,80}AutoHotkey|ExecScript\(Script.{0,60}AutoHotkey\.exe)'

  - id: autohotkey-h-text-interpreter-export
    desc: AutoHotkey_H text interpreter export
    for: [pe, dll]
    if:
      type: export
      exact: ahktextdll

  - id: autohotkey-h-script-exec-export
    desc: AutoHotkey_H script execution export
    for: [pe, dll]
    if:
      type: export
      exact: ahkExec

composite_rules:
  - id: autohotkey-h-library
    desc: AutoHotkey_H embeddable scripting DLL
    for: [pe, dll]
    all:
      - id: metadata/binary/provenance/version-info::autohotkey-h-product-field
      - id: autohotkey-h-text-interpreter-export
      - id: autohotkey-h-script-exec-export

  - id: autohotkey-official-interpreter
    desc: Official AutoHotkey interpreter or help bundle
    crit: exception
    scope: outer
    any:
      - id: autohotkey-h-library
      - id: autohotkey-foundation-vendor
      - id: autohotkey-product-description
      - id: autohotkey-chm-docs-marker
      - id: autohotkey-docs-html
      # Official 1.1 builds carry the versioned runtime banner
      # ("AutoHotkey v1.1.27.02") instead of a Foundation string or a
      # digit-bearing description; the banner is the interpreter's own
      # identity, not the bundled script's purpose.
      - id: well-known/tool/sysadmin/autohotkey::autohotkey-runtime-version
