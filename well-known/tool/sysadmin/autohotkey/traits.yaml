# AutoHotkey — legitimate Windows macro and UI automation interpreter.
defaults:
  platforms: [windows]
  for: [pe, chm, html]
  crit: notable
  conf: 0.98
  size_min: 100
  size_max: 50000000

traits:
  - id: autohotkey-foundation-vendor
    desc: AutoHotkey Foundation vendor string
    for: [pe]
    size_min: 500000
    size_max: 5000000
    if:
      type: text
      substr: AutoHotkey Foundation
      section: .rsrc

  - id: autohotkey-product-description
    desc: AutoHotkey PE product description
    for: [pe]
    size_min: 500000
    size_max: 5000000
    if:
      type: text
      regex: '(?i)AutoHotkey\s+\d'
      section: .rsrc

  - id: autohotkey-chm-docs-marker
    desc: AutoHotkey help CHM documentation tree
    for: [chm]
    size_min: 500000
    size_max: 5000000
    if:
      type: raw
      regex: '(?i)AutoHotkey(_L-Docs|\s+v[0-9]\s+Help)'

  - id: autohotkey-docs-html
    desc: AutoHotkey documentation page marker
    for: [html]
    if:
      type: text
      regex: '(?i)(<title>[^<]{0,80}AutoHotkey|ExecScript\(Script.{0,60}AutoHotkey\.exe)'

composite_rules:
  - id: autohotkey-official-interpreter
    desc: Official AutoHotkey interpreter or help bundle
    crit: exception
    scope: outer
    any:
      - id: autohotkey-foundation-vendor
      - id: autohotkey-product-description
      - id: autohotkey-chm-docs-marker
      - id: autohotkey-docs-html
