# Compiled scripts retain the interpreter banner even with custom version info.
# This identifies embedded runtime code, not the purpose of the bundled script.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 100000
traits:
  - id: autohotkey-runtime-version
    desc: AutoHotkey runtime version banner
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bAutoHotkey(_?U)?\s+v[0-9]'
      section: .rdata
