---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: 7zip-sfx-overlay-registry-api-profile
  desc: 7-Zip SFX with overlay, temp and registry API references
  crit: suspicious
  conf: 0.98
  size_min: 1000000
  all:
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: well-known/tool/sysadmin/7zip/installer::7zip-sfx-runtime
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  needs: 2
  any:
  - id: micro-behaviors/crypto/certificate/store::cert-store-population-api
  - id: micro-behaviors/os/sysinfo/platform/locale::locale-query-imports
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  unless:
  - id: metadata/installer/product/
