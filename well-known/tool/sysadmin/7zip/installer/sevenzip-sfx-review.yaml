defaults:
  platforms:
    - windows
  for:
    - pe
  size_min: 1
traits:
  - id: 7zip-self-extracting-archive-banner
    desc: 7-Zip self-extracting archive banner
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7-Zip self-extracting archive
      section: .rsrc
  - id: 7zip-installer-description
    desc: 7-Zip installer description
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7-Zip Installer
      section: .rsrc
  - id: 7zip-installer-setup-banner
    desc: 7-Zip setup banner string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 7-Zip [0-9]{1,2}\.[0-9]{2}( \(x(64|86)\))? Setup
      section: .rdata
  - id: 7zip-registry-key
    desc: 7-Zip registry key path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: Software\7-Zip
      section: .rdata
  - id: 7zip-original-filename
    desc: 7-Zip installer filename
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: 7zipInstall.exe
      section: .rsrc
  - id: 7zsfxmod-description
    desc: 7ZSfxMod setup description
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7z Setup SFX (x86)
      section: .rsrc
  - id: 7zsfxmod-internal-name
    desc: 7ZSfxMod internal name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7ZSfxMod
      section: .rsrc
  - id: 7zsfxmod-original-filename
    desc: 7ZSfxMod original filename
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7ZSfxMod_x86.exe
      section: .rsrc
  - id: 7zsfxmod-product-name
    desc: 7ZSfxMod product name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7-Zip SFX
      section: .rsrc
  - id: 7zsfx-runtime-stub
    desc: 7-Zip SFX stub name after 6 MiB
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: 7zS.sfx.exe
      section: .rdata
      offset_range: [6291456, null]
  - id: 7zs2-runtime-stub
    desc: 7-Zip SFX module internal name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7zS2.sfx
      section: .rsrc
  - id: stock-7zs-original-filename
    desc: PE OriginalFilename is stock 7zS.sfx.exe
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^7zS\.sfx(\.exe)?$'
  - id: 7zip-sfx-manifest-description
    desc: Versioned 7-Zip SFX manifest description
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '<description>7-Zip Self-extracting Archive v[0-9]{1,2}\.[0-9]{2}</description>'
      section: .rsrc
  - id: 7zsfx-resource-filename
    desc: 7-Zip SFX resource filename
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7zS.sfx.exe
      section: .rsrc
  - id: 7zip32-runtime-dll
    desc: 7-Zip runtime DLL name after 6 MiB
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: 7-zip32.dll
      section: .rdata
      offset_range: [6291456, null]
  - id: 7zip-fm-app-path
    desc: 7-Zip app path after 6 MiB
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\App Paths\7zFM.exe
      section: .rdata
      offset_range: [6291456, null]
  - id: 7zip-uninstaller-description
    desc: 7-Zip uninstaller description
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 7-Zip Uninstaller
      section: .rsrc
  - id: 7zip-uninstall-registry-path
    desc: 7-Zip uninstall registry path
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Uninstall\7-Zip
      section: .rdata
  - id: 7zip-shell-extension-clsid
    desc: 7-Zip shell extension CLSID
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: CLSID\{23170F69-40C1-278A-1000-000100020000}
      section: .rdata
  - id: 7zip-overlay-uninstaller-description
    desc: Overlay 7-Zip uninstaller description
    crit: notable
    conf: 0.98
    size_min: 1000000
    if:
      type: text
      exact: 7-Zip Uninstaller
      offset_range: [1048576, null]
  - id: 7zip-overlay-uninstall-registry-path
    desc: Overlay 7-Zip uninstall registry path
    crit: notable
    conf: 0.97
    size_min: 1000000
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Uninstall\7-Zip
      offset_range: [1048576, null]
  - id: 7zip-overlay-fm-app-path
    desc: Overlay 7-Zip file manager path
    crit: notable
    conf: 0.96
    size_min: 1000000
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\App Paths\7zFM.exe
      offset_range: [1048576, null]
composite_rules:
  - id: 7zsfxmod-named-reference
    desc: 7ZSfxMod named product reference
    crit: component
    conf: 0.98
    any:
      - id: 7zsfxmod-internal-name
      - id: 7zsfxmod-original-filename
  - id: 7zip-sfx-installer
    desc: 7-Zip self-extracting installer
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: well-known/tool/sysadmin/7zip/installer::7zip-installer-description
      - id: well-known/tool/sysadmin/7zip/installer::7zip-installer-setup-banner
      - id: well-known/tool/sysadmin/7zip/installer::7zip-registry-key
      - id: well-known/tool/sysadmin/7zip/installer::7zip-original-filename
  - id: 7zsfxmod-profile
    desc: 7ZSfxMod self-extracting installer
    crit: notable
    conf: 0.99
    all:
      - id: 7zsfxmod-named-reference
    needs: 2
    any:
      - id: well-known/tool/sysadmin/7zip/installer::7zsfxmod-description
      - id: well-known/tool/sysadmin/7zip/installer::7zsfxmod-internal-name
      - id: well-known/tool/sysadmin/7zip/installer::7zsfxmod-original-filename
      - id: well-known/tool/sysadmin/7zip/installer::7zsfxmod-product-name
      - id: micro-behaviors/data/archive/extract/capability::sfx-copyright-banner-text
      - id: micro-behaviors/data/archive/extract/capability::sfx-configuration-error-text
  - id: 7zip-sfx-runtime
    desc: 7-Zip self-extracting runtime bundle
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: micro-behaviors/fs/temp/directory::temp-archive-create-error-text
      - id: well-known/tool/sysadmin/7zip/installer::7zsfx-runtime-stub
      - id: well-known/tool/sysadmin/7zip/installer::7zip32-runtime-dll
      - id: well-known/tool/sysadmin/7zip/installer::7zip-fm-app-path
  - id: 7zip-sfx-resource-profile
    desc: Versioned 7-Zip SFX resource profile
    crit: notable
    conf: 0.99
    all:
      - id: 7zip-sfx-manifest-description
      - id: 7zsfx-resource-filename
  - id: 7zip-uninstaller-profile
    desc: 7-Zip uninstaller metadata profile
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: well-known/tool/sysadmin/7zip/installer::7zip-uninstaller-description
      - id: micro-behaviors/fs/path/executable::uninstaller-name-rdata-text
      - id: well-known/tool/sysadmin/7zip/installer::7zip-uninstall-registry-path
      - id: well-known/tool/sysadmin/7zip/installer::7zip-shell-extension-clsid
      - id: well-known/tool/sysadmin/7zip/installer::7zip-fm-app-path
  - id: 7zip-uninstaller-overlay-profile
    desc: 7-Zip uninstaller overlay profile
    crit: notable
    conf: 0.99
    needs: 3
    any:
      - id: well-known/tool/sysadmin/7zip/installer::7zip-overlay-uninstaller-description
      - id: micro-behaviors/fs/path/executable::uninstaller-name-overlay-text
      - id: well-known/tool/sysadmin/7zip/installer::7zip-overlay-uninstall-registry-path
      - id: well-known/tool/sysadmin/7zip/installer::7zip-overlay-fm-app-path
