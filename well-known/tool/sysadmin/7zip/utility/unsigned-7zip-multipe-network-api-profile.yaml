defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: unsigned-7zip-multipe-network-api-profile
  desc: Unsigned 7-Zip multi-PE overlay with network or privilege clues
  crit: suspicious
  conf: 0.99
  all:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/size::large-overlay-64k
  - id: metadata/signature/absent::unsigned
  any:
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe
  - id: micro-behaviors/os/service/name::trustedinstaller-label-reference
  - id: micro-behaviors/os/privilege/token/adjust::token-privilege-adjustment-references
  needs: 2
