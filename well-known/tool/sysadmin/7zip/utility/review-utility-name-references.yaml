defaults:
  platforms: [windows, macos, linux]
  for: [binaries]
  crit: component
  conf: 0.9
traits:
- id: sevenzip-setup-label-reference
  desc: "7-Zip setup or installer label reference"
  crit: notable
  size_min: 1
  if:
    type: text
    regex: (?i)7-Zip\s+(Setup|Installer)
- id: sevenzip-file-manager-label-reference
  desc: "7-Zip file-manager or standalone label"
  crit: notable
  size_min: 1
  if:
    type: text
    regex: (?i)7-Zip\s+(File Manager|Standalone)
- id: sevenzip-console-label-reference
  desc: "7-Zip console or archiver label"
  crit: notable
  size_min: 1
  if:
    type: text
    regex: (?i)7-Zip\s+(Console|Archiver)
- id: sevenzip-extension-label-reference
  desc: "7-Zip extension label"
  crit: component
  size_min: 1
  if:
    type: text
    regex: (?i)7-Zip\s+(Extension)
- id: sevenzip-dll-basename-reference
  desc: 7-Zip runtime DLL basename reference
  crit: notable
  for: [pe, dll]
  if:
    type: path
    basename: true
    case_insensitive: true
    regex: '^7z\.dll(@|$)'
- id: sevenzip-dll-text-reference
  desc: 7-Zip runtime DLL filename reference
  crit: component
  for: [pe, dll]
  size_min: 1
  if:
    type: text
    exact: 7z.dll
    case_insensitive: true
    section: .rdata
- id: sevenzip-gui-basename-reference
  desc: 7-Zip GUI executable basename reference
  crit: notable
  for: [pe]
  if:
    type: path
    basename: true
    case_insensitive: true
    regex: '^7zg\.exe(@|$)'
- id: sevenzip-console-basename-reference
  desc: 7-Zip console executable basename reference
  crit: notable
  for: [pe]
  if:
    type: path
    basename: true
    case_insensitive: true
    regex: '^7z\.exe(@|$)'
- id: sevenzip-standalone-basename-reference
  desc: 7-Zip standalone executable basename reference
  crit: notable
  for: [pe]
  if:
    type: path
    basename: true
    case_insensitive: true
    regex: '^7za(\.exe)?(@|$)'
- id: sevenzip-manager-basename-reference
  desc: 7-Zip file manager basename reference
  crit: notable
  for: [pe]
  if:
    type: path
    basename: true
    case_insensitive: true
    regex: '^7zfm\.exe(@|$)'
- id: sevenzip-gui-manifest-name-reference
  desc: 7-Zip GUI application manifest name reference
  crit: notable
  conf: 0.95
  for: [pe]
  platforms: [windows]
  size_min: 1
  if:
    type: text
    substr: name="7-Zip.7-Zip.7zG"
    section: .rsrc
- id: pe-product-name-7zip
  desc: PE product name claims 7-Zip
  crit: notable
  conf: 0.95
  for: [pe, dll]
  platforms: [windows]
  if:
    type: value
    path: pe.version.product_name
    regex: (?i)\b7-Zip\b
composite_rules:
- id: sevenzip-product-label-reference
  desc: 7-Zip product label reference
  crit: component
  conf: 1.0
  any:
  - id: sevenzip-setup-label-reference
  - id: sevenzip-file-manager-label-reference
  - id: sevenzip-console-label-reference
  - id: sevenzip-extension-label-reference
  unless:
  - id: well-known/lib/data/sevenzipjbinding::sevenzipjbinding-package-path-reference
- id: sevenzip-component-filename-reference
  desc: 7-Zip component filename reference
  crit: component
  conf: 0.98
  any:
  - id: sevenzip-dll-basename-reference
  - id: sevenzip-gui-basename-reference
  - id: sevenzip-console-basename-reference
  - id: sevenzip-standalone-basename-reference
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-reduced-basename-reference
  - id: sevenzip-manager-basename-reference
