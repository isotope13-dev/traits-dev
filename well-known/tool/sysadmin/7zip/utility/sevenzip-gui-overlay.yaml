# 7-Zip GUI manifest and embedded PE/overlay observations.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: sevenzip-gui-embedded-pe-overlay-clues
  desc: 7-Zip GUI claim, embedded PE and overlay clues
  crit: suspicious
  conf: 0.93
  all:
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-gui-manifest-name-reference
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/installer/product/
  - id: metadata/signature/verified/platform/
