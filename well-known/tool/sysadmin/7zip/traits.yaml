# Official 7-Zip reduced standalone console (7zr). ProductName plus the
# Reduced Console FileDescription and OriginalFilename 7zr.exe identify the
# public-domain Igor Pavlov build; a renamed PE that only claims "7-Zip" is
# not this tool.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 10485760

traits:
  - id: official-7zip-reduced-basename
    desc: Official 7-Zip reduced standalone filename
    crit: component
    conf: 0.96
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^7zr(\.exe)?(@|$)'
  - id: pe-filedescription-7zip-reduced
    desc: PE FileDescription is 7-Zip Reduced Console
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.description
      regex: '(?i)7-Zip Reduced Standalone Console'
  - id: pe-original-filename-7zr
    desc: PE OriginalFilename is 7zr.exe
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^7zr\.exe$'

  # The NSIS extract plugin (nsis7z.dll) is a DLL, and Igor Pavlov's resource
  # script names it `nsis7z.exe` with FILETYPE app -- hand-written VERSIONINFO
  # reused from the console builds. Installers bundle this plugin verbatim.
  - id: pe-filedescription-7zip-nsis-plugin
    desc: PE FileDescription is 7-Zip NSIS Extract Plugin
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^7-Zip NSIS Extract Plugin$'

  - id: pe-original-filename-nsis7z
    desc: PE OriginalFilename is nsis7z.exe
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^nsis7z\.exe$'

composite_rules:
  - id: sevenzip-reduced-console
    desc: Official 7-Zip reduced standalone console
    all:
      - id: pe-filedescription-7zip-reduced
      - id: pe-original-filename-7zr
      - id: metadata/file/string/identity::pe-product-name-7zip

  - id: sevenzip-nsis-extract-plugin
    desc: Official 7-Zip NSIS extract plugin
    for: [pe, dll]
    all:
      - id: pe-filedescription-7zip-nsis-plugin
      - id: pe-original-filename-nsis7z
      - id: metadata/file/string/identity::pe-product-name-7zip
