defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 524288000

traits:
  - id: osquery-product-name
    desc: osquery PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: osquery

  - id: osquery-company-name
    desc: Osquery Foundation company metadata
    if:
      type: value
      path: pe.version.company
      exact: Osquery Foundation

  - id: osquery-description
    desc: osquery daemon and shell description
    if:
      type: value
      path: pe.version.description
      exact: osquery daemon and shell

  - id: osquery-build-path
    desc: Upstream osquery build tree path
    if:
      type: text
      section: .rdata
      regex: '[/\\]osquery[/\\]w?[/\\]src[/\\]osquery'

composite_rules:
  - id: osquery-tool-context
    desc: Legitimate osquery endpoint observability tool context
    crit: exception
    conf: 0.99
    any:
      - id: osquery-product-name
      - id: osquery-company-name
      - id: osquery-description
      - id: osquery-build-path
