defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: netiq-adpopulator-name
    desc: NetIQ ADPopulator application name
    if:
      type: text
      exact: ADPopulator
      section: .text

  - id: netiq-dra-exa-guide
    desc: NetIQ DRA-ExA evaluation guide reference
    if:
      type: text
      exact: NetIQ DRA-ExA Evaluation Guide
      section: .text

composite_rules:
  - id: netiq-adpopulator
    desc: NetIQ ADPopulator identity claims
    crit: notable
    conf: 0.99
    all:
      - id: metadata/vendor/string::netiq-company-field
      - id: well-known/tool/sysadmin/netiq-adpopulator::netiq-adpopulator-name
      - id: well-known/tool/sysadmin/netiq-adpopulator::netiq-dra-exa-guide

