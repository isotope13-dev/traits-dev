# nPth — GnuPG's New Portable Threads library.
#
# nPth is a cooperative threading wrapper: for every blocking POSIX call it
# exports an `npth_`-prefixed version that releases the global lock around the
# real syscall. So the library's whole published API is connect, accept, read,
# recvmsg, sendmsg, select, waitpid and system -- which is precisely the leg
# set that objectives/supply-chain/trojanized/backdoor/shared-library reads as
# "a shared library with networked shell behavior".
#
# Debian's libnpth.so.0.1.2 in the official gcc:bookworm image is 22,912
# bytes. A .so that small has room for the wrappers and nothing else; there is
# no backdoor in it. Not to be confused with ByteDance's unrelated `npth`
# crash dumper, which already has its own identity under
# well-known/lib/runtime/native-platform/bytedance.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 10000000

traits:
  - id: npth-init-export
    desc: nPth library init export
    if:
      type: symbol
      kind: export
      exact: npth_init

  - id: npth-connect-export
    desc: nPth wrapped connect export
    if:
      type: symbol
      kind: export
      exact: npth_connect

  - id: npth-accept-export
    desc: nPth wrapped accept export
    if:
      type: symbol
      kind: export
      exact: npth_accept

composite_rules:
  # Two of the three: the prefix is distinctive enough that a pair of these
  # exports is the library and not an imitation, and requiring `npth_init`
  # alone would miss a build that inlines it.
  - id: npth-threading-library
    desc: nPth portable threads library
    crit: exception
    conf: 0.99
    scope: file
    needs: 2
    any:
      - id: npth-init-export
      - id: npth-connect-export
      - id: npth-accept-export
