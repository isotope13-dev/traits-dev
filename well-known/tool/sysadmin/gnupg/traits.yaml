# GnuPG's S/MIME and keybox utilities are legitimate system tools.  The
# dirmngr marker is kept here because it identifies GnuPG's local Assuan
# socket/configuration surface; it is not C2 infrastructure by itself.
defaults:
  platforms: [linux]
  for: [elf, rpm]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 10000000

traits:
  - id: smime-package-name
    desc: GnuPG S/MIME RPM package identity
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: gnupg2-smime

  - id: smime-program-marker
    desc: GnuPG S/MIME program marker
    for: [elf]
    if:
      type: text
      section: .rodata
      exact: '@GPGSM@ (@GNUPG@)'

  - id: keybox-program-marker
    desc: GnuPG keybox utility marker
    for: [elf]
    if:
      type: text
      section: .rodata
      exact: 'List, export, import Keybox data'

  - id: dirmngr-config-socket-marker
    desc: GnuPG dirmngr socket/config marker
    for: [elf]
    if:
      type: text
      regex: '\b(S\.dirmngr|dirmngr(\.conf|_ldapservers\.conf))\b'
      section: .rodata

composite_rules:
  - id: gnupg-dirmngr-network-context
    desc: GnuPG dirmngr network context
    crit: exception
    conf: 0.99
    all:
      - id: dirmngr-config-socket-marker
      - id: micro-behaviors/communications/socket/connect::connect-symbol
    any:
      - id: smime-program-marker
      - id: keybox-program-marker
