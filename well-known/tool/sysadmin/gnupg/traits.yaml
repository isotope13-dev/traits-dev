# GnuPG's S/MIME and keybox utilities are legitimate system tools.  The
# dirmngr marker is kept here because it identifies GnuPG's local Assuan
# socket/configuration surface; it is not C2 infrastructure by itself.
defaults:
  platforms: [linux]
  for: [elf, rpm]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 10000000

traits:
  - id: smime-package-name
    desc: GnuPG S/MIME RPM package identity
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: gnupg2-smime

  - id: smime-program-marker
    desc: GnuPG S/MIME program marker
    for: [elf]
    if:
      type: text
      section: .rodata
      exact: '@GPGSM@ (@GNUPG@)'

  - id: keybox-program-marker
    desc: GnuPG keybox utility marker
    for: [elf]
    if:
      type: text
      section: .rodata
      exact: 'List, export, import Keybox data'

  - id: dirmngr-config-socket-marker
    desc: GnuPG dirmngr socket/config marker
    for: [elf]
    if:
      type: text
      regex: '\b(S\.dirmngr|dirmngr(\.conf|_ldapservers\.conf))\b'
      section: .rodata
  - id: gpg-windows-program-basename
    desc: GnuPG Windows program basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      regex: '(?i)^gpg(-[a-z0-9-]+)?\.exe$'
  - id: gpgtar-windows-basename
    desc: GnuPG archive utility basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpgtar.exe
      case_insensitive: true
  - id: gpgsm-windows-basename
    desc: GnuPG S/MIME utility basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpgsm.exe
      case_insensitive: true
  - id: gpgscm-windows-basename
    desc: GnuPG Scheme utility basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpgscm.exe
      case_insensitive: true
  - id: gpg-error-windows-basename
    desc: GnuPG error utility basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpg-error.exe
      case_insensitive: true
  - id: gpgme-json-windows-basename
    desc: GnuPG JSON helper basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpgme-json.exe
      case_insensitive: true
  - id: gpgme-tool-windows-basename
    desc: GnuPG tool helper basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpgme-tool.exe
      case_insensitive: true
  - id: gpgme-w32spawn-windows-basename
    desc: GnuPG process helper basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: gpgme-w32spawn.exe
      case_insensitive: true
  - id: gpgconf-windows-basename
    desc: GnuPG configuration utility basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      regex: '(?i)^gpgconf(-w32)?\.exe$'
  - id: dirmngr-windows-basename
    desc: GnuPG directory-manager basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      regex: '(?i)^dirmngr(-client)?\.exe$'
  - id: scdaemon-windows-basename
    desc: GnuPG smart-card daemon basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: scdaemon.exe
      case_insensitive: true
  - id: keyboxd-windows-basename
    desc: GnuPG keybox daemon basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: keyboxd.exe
      case_insensitive: true
  - id: kbxutil-windows-basename
    desc: GnuPG keybox utility basename
    crit: component
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: kbxutil.exe
      case_insensitive: true
  - id: windows-gnupg-support-library
    desc: GnuPG Windows support library
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [dll]
    if:
      type: basename
      regex: '(?i)^lib(assuan|gcrypt|ksba)-[0-9]+\.dll$'

composite_rules:
  - id: windows-gnupg-program
    desc: GnuPG Windows utility binary
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe]
    any:
      - id: gpg-windows-program-basename
      - id: gpgtar-windows-basename
      - id: gpgsm-windows-basename
      - id: gpgscm-windows-basename
      - id: gpg-error-windows-basename
      - id: gpgme-json-windows-basename
      - id: gpgme-tool-windows-basename
      - id: gpgme-w32spawn-windows-basename
      - id: gpgconf-windows-basename
      - id: dirmngr-windows-basename
      - id: scdaemon-windows-basename
      - id: keyboxd-windows-basename
      - id: kbxutil-windows-basename

  - id: gnupg-dirmngr-network-context
    desc: GnuPG dirmngr network context
    crit: exception
    conf: 0.99
    all:
      - id: dirmngr-config-socket-marker
      - id: micro-behaviors/communications/socket/connect::connect-symbol
    any:
      - id: smime-program-marker
      - id: keybox-program-marker
