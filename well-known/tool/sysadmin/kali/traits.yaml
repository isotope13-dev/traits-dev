defaults:
  crit: notable
  conf: 0.99
  platforms: [linux, windows]
  for: [deb, python, pe]
  size_max: 2000000000

traits:
  - id: kali-installer-package-context
    desc: Kali installer package context
    if:
      type: path
      regex: '(?i)kali-linux-[0-9][^\\/]*-installer-[^\\/]+'
  - id: kali-netexec-member
    desc: Kali NetExec package member context
    for: [python, vbs, pe]
    if:
      type: path
      regex: '(?i)(^|[\\/])(nxc|nanodump\.py|procdump\.exe)([\\/]|$)'
  - id: kali-pypykatz-member
    desc: Kali pypykatz package member context
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])pypykatz([\\/]|$)'
  - id: kali-mimikatz-member
    desc: Kali mimikatz package member context
    for: [pe, dll]
    if:
      type: path
      regex: '(?i)(^|[\\/])mimikatz([\\/]|\.exe$)'
