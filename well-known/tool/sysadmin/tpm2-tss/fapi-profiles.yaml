defaults:
  platforms: [unix]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: config-profile-name
    desc: TPM FAPI selected profile name
    crit: component
    if:
      type: value
      path: profile_name
      regex: '^P_(ECC|RSA)[A-Za-z0-9]+$'

  - id: config-profile-directory
    desc: TPM FAPI profile directory path
    crit: component
    if:
      type: value
      path: profile_dir
      regex: '(^|/)tpm2-tss/fapi-profiles/?$'

  - id: config-user-keystore-directory
    desc: TPM FAPI user keystore path
    crit: component
    if:
      type: value
      path: user_dir
      regex: '(^|/)tpm2-tss/user/keystore/?$'

  - id: config-system-keystore-directory
    desc: TPM FAPI system keystore path
    crit: component
    if:
      type: value
      path: system_dir
      regex: '(^|/)tpm2-tss/system/keystore/?$'

  - id: config-event-log-directory
    desc: TPM FAPI event log directory
    crit: component
    if:
      type: value
      path: log_dir
      regex: '(^|/)tpm2-tss/eventlog/?$'

  - id: ecc-profile-type
    desc: TPM FAPI ECC profile type
    crit: component
    if:
      type: value
      path: type
      exact: TPM2_ALG_ECC

  - id: ecc-profile-ecdsa-scheme
    desc: TPM FAPI ECDSA signing scheme
    crit: component
    if:
      type: value
      path: ecc_signing_scheme.scheme
      exact: TPM2_ALG_ECDSA

  - id: ecc-profile-nist-curve
    desc: TPM FAPI NIST ECC curve
    crit: component
    if:
      type: value
      path: curveID
      regex: '^TPM2_ECC_NIST_P(256|384)$'

  - id: rsa-profile-type
    desc: TPM FAPI RSA profile type
    crit: component
    if:
      type: value
      path: type
      exact: TPM2_ALG_RSA

  - id: rsa-profile-srk-template
    desc: TPM FAPI persistent RSA SRK template
    crit: component
    if:
      type: value
      path: srk_template
      exact: 'system,restricted,decrypt,0x81000001'

  - id: rsa-profile-rsapss-scheme
    desc: TPM FAPI RSA-PSS signing scheme
    crit: component
    if:
      type: value
      path: rsa_signing_scheme.scheme
      exact: TPM2_ALG_RSAPSS

  - id: rsa-profile-oaep-scheme
    desc: TPM FAPI RSA-OAEP decryption scheme
    crit: component
    if:
      type: value
      path: rsa_decrypt_scheme.scheme
      exact: TPM2_ALG_OAEP

composite_rules:
  - id: fapi-config
    desc: tpm2-tss FAPI runtime configuration
    crit: notable
    all:
      - id: config-profile-name
      - id: config-profile-directory
      - id: config-user-keystore-directory
      - id: config-system-keystore-directory
      - id: config-event-log-directory

  - id: fapi-ecc-profile
    desc: tpm2-tss FAPI ECC profile
    all:
      - id: ecc-profile-type
      - id: ecc-profile-ecdsa-scheme
      - id: ecc-profile-nist-curve

  - id: fapi-rsa-profile
    desc: tpm2-tss FAPI RSA profile
    crit: notable
    all:
      - id: rsa-profile-type
      - id: rsa-profile-srk-template
      - id: rsa-profile-rsapss-scheme
      - id: rsa-profile-oaep-scheme
