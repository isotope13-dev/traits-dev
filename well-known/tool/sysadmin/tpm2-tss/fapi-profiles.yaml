defaults:
  platforms: [unix]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: ecc-profile-type
    desc: TPM FAPI ECC profile type
    crit: component
    if:
      type: value
      path: type
      exact: TPM2_ALG_ECC

  - id: ecc-profile-ecdsa-scheme
    desc: TPM FAPI ECDSA signing scheme
    crit: component
    if:
      type: value
      path: ecc_signing_scheme.scheme
      exact: TPM2_ALG_ECDSA

  - id: ecc-profile-nist-curve
    desc: TPM FAPI NIST ECC curve
    crit: component
    if:
      type: value
      path: curveID
      regex: '^TPM2_ECC_NIST_P(256|384)$'

composite_rules:
  - id: fapi-ecc-profile
    desc: tpm2-tss FAPI ECC profile
    all:
      - id: ecc-profile-type
      - id: ecc-profile-ecdsa-scheme
      - id: ecc-profile-nist-curve
