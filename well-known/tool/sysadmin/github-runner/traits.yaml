# The GitHub Actions self-hosted runner agent (actions/runner) — the service
# that registers with GitHub and executes workflow jobs on a machine you own.
#
# Relocated from metadata/build/github-actions/. TAXONOMY's own rubric decides
# it: "Is it the named tool/software being identified? -> well-known". These
# match the shipped agent — Runner.Worker / Runner.Listener, config.sh,
# run.cmd — a software fingerprint, not a fact about how some artifact was
# built.
#
# Filed under tool/sysadmin/ rather than beside the Actions themselves: the
# runner is not an Action but a long-running agent registered against
# infrastructure you administer, in the same company as the other
# infrastructure agents here. It is also not nested as
# `github-actions/runner/` — with the pipeline's three-level cap that extra
# level would have extracted as `tool/development/github-actions` anyway,
# depth carrying no signal, and tool/development/ is already at the 150-subdir
# fan-out limit. Local ids drop the `github-runner-` prefix the directory
# already says.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, text, data]
  crit: notable
  conf: 0.95
  size_min: 64
  size_max: 200000000

traits:
  - id: worker
    desc: GitHub Actions Runner.Worker identifier
    for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
    if:
      type: text
      substr: Runner.Worker
  - id: listener
    desc: GitHub Actions Runner.Listener process
    if:
      type: text
      substr: Runner.Listener
      section: .text
  - id: config-script
    desc: Self-hosted runner config script
    crit: component
    if:
      type: text
      substr: ./config.sh
  - id: config-args
    desc: Self-hosted runner config args
    crit: component
    if:
      type: text
      # Require the runner config script with a flag — bare `--token`/`--url`
      # also appear on cloudflared and other CLIs.
      regex: 'config\.sh.{0,120}--(url|token|labels|ephemeral)'
  - id: windows-config-script
    desc: Windows runner config script
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)(^|[\\/\s])\.?[\\/]config\.cmd\b'
  - id: windows-config-args
    desc: Windows runner registration args
    for: [powershell]
    if:
      type: text
      regex: '(?is)config\.cmd.{0,240}--(url|token|labels)\b'
  - id: windows-run-script
    desc: Windows runner execution script
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\brun\.cmd\b'
  - id: run-script
    desc: Self-hosted runner execution script
    conf: 0.8
    if:
      type: text
      substr: ./run.sh
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path

composite_rules:
  - id: configuration
    desc: Self-hosted runner configuration
    conf: 0.9
    all:
      - id: config-script
      - id: config-args
  - id: windows-registration
    desc: Windows runner registration
    conf: 0.97
    for: [powershell]
    all:
      - id: windows-config-script
      - id: windows-config-args
