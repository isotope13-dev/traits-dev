# Tencent Sandbox (TSBX) / @tencent-ai/sandbox-cli (Tencent) — sandbox
# isolation toolkit and process restriction runtime for Windows x64/x86.
# Hooks file, network, and process operations to isolate developer AI workloads.
defaults:
  platforms: [windows]
  conf: 0.99

traits:
  - id: tsbx-component-basename
    desc: Tencent Sandbox component filename
    crit: notable
    conf: 0.95
    for: [pe, dll]
    size_min: 8192
    size_max: 16777216
    if:
      type: path
      basename: true
      regex: '(?i)^tsbx(ldr|low|_sdk|_x86|_armec)?\.dll$'

  - id: tsbx-binary-marker
    desc: Tencent Sandbox TSBX marker in binary
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 8192
    size_max: 16777216
    if:
      type: text
      section: .rdata
      regex: 'Tsbx_DumpHookSnapshot|LsSDK_Attach|TsbxLdr_EarlyMain|LsInjectBridge'

  - id: tencent-sandbox-cli-basename
    desc: Tencent Sandbox CLI executable filename
    crit: notable
    conf: 0.95
    for: [pe]
    size_min: 65536
    size_max: 33554432
    if:
      type: path
      basename: true
      regex: '(?i)^sandbox-(cli|center)(-gc)?\.exe$'

  - id: tencent-sandbox-cli-marker
    desc: Tencent Sandbox CLI internal marker
    crit: notable
    conf: 0.98
    for: [pe]
    size_min: 65536
    size_max: 33554432
    if:
      type: text
      section: .rdata
      regex: 'SANDBOX_IPC_TRACE_|sandbox_cli\.rs|sandbox_center\.rs'

  - id: tencent-sandbox-package-name
    desc: Tencent Sandbox npm package manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    platforms: [windows, unix]
    if:
      type: value
      path: name
      regex: '^@tencent-ai/sandbox-cli'

  - id: tencent-sandbox-archive-path
    desc: Tencent Sandbox release archive path
    crit: notable
    conf: 0.98
    for: [tar, zip]
    platforms: [windows, unix]
    if:
      type: path
      regex: '(?i)(^|[\\/])@tencent-ai-sandbox-cli-[^\\/]+\.tgz$'

composite_rules:
  - id: tsbx-component
    desc: Recognized Tencent Sandbox TSBX component
    crit: notable
    conf: 0.99
    for: [pe, dll]
    all:
      - id: tsbx-component-basename
      - id: tsbx-binary-marker

  - id: tencent-sandbox-cli-component
    desc: Recognized Tencent Sandbox CLI binary
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: tencent-sandbox-cli-basename
      - id: tencent-sandbox-cli-marker

  - id: tencent-sandbox-tool
    desc: Recognized Tencent Sandbox tool or component
    crit: notable
    conf: 0.99
    platforms: [windows, unix]
    for: [pe, dll, package.json, tar, zip]
    any:
      - id: tsbx-component
      - id: tencent-sandbox-cli-component
      - id: tencent-sandbox-package-name
      - id: tencent-sandbox-archive-path
