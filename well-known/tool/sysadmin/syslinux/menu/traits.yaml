# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  - id: menu-api-import
    desc: Imports the Syslinux menu API
    if:
      type: symbol
      kind: import
      exact: init_menusystem
  - id: libmenu-com32-soname
    desc: Syslinux libmenu COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libmenu.c32
  - id: libmenu-menu-api-export
    desc: Exports the Syslinux menu initializer
    if:
      type: symbol
      kind: export
      exact: init_menusystem
  - id: cmenu-lua-module-export
    desc: Exports cmenu Lua module initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_cmenu
  # menu.c32 is the interactive Syslinux configuration/menu program.  These
  # exports are utility-specific and are combined with the COM32 dependency
  # and screen/key APIs below, rather than treating every console API user as
  # the menu module.
  - id: menu-config-parser-export
    desc: Exports the Syslinux menu config parser
    if:
      type: symbol
      kind: export
      exact: parse_configs
  - id: menu-start-export
    desc: Exports the Syslinux menu startup routine
    if:
      type: symbol
      kind: export
      exact: start_menu
composite_rules:
  - id: cmenu-com32-module
    desc: Syslinux cmenu Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: cmenu-lua-module-export
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: menu-api-import
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: menu-com32-module
    desc: Syslinux interactive menu COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: menu-config-parser-export
      - id: menu-start-export
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-screen-size-import
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-key-input-import
  - id: libmenu-com32-module
    desc: Syslinux libmenu COM32 menu module
    crit: notable
    conf: 1.0
    all:
      - id: libmenu-com32-soname
      - id: libmenu-menu-api-export
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-api-import
