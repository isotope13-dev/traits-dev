# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  # Some COM32 modules do not import the Syslinux ABI directly.  Their stable
  # ELF identity is still available from the SONAME or the module basename,
  # while the loader layout confirms that the identity is a COM32 artifact.
  - id: liblua-com32-soname
    desc: Syslinux liblua COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: liblua.c32
composite_rules:
  - id: liblua-com32-module
    desc: Syslinux liblua COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: liblua-com32-soname
      - id: metadata/binary/header/program::elf-entry-in-writable-segment
      - id: metadata/binary/header/program::elf-wx-segment
      - id: metadata/binary/header/program::elf-entry-in-last-segment
