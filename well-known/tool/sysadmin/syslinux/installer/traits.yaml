# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  - id: syslinux-api-import
    desc: Imports a Syslinux module API
    if:
      type: symbol
      kind: import
      regex: '^syslinux_'
  - id: syslinux-debug-api-import
    desc: Imports the Syslinux debug API
    if:
      type: symbol
      kind: import
      exact: syslinux_debug
  - id: setup-data-api-import
    desc: Imports the Syslinux setup-data API
    if:
      type: symbol
      kind: import
      regex: '^setup_data_'
  - id: loadfile-api-import
    desc: Imports the Syslinux loadfile API
    if:
      type: symbol
      kind: import
      exact: loadfile
  - id: syslinux-bios-interrupt-import
    desc: Syslinux BIOS interrupt helper import
    if:
      type: symbol
      kind: import
      exact: __intcall
  # The native installer emits a versioned product banner and names the
  # ldlinux COM32 payload it installs.  The version pattern remains useful
  # across releases while the payload name prevents a generic boot-sector
  # utility from being identified as Syslinux.
  - id: installer-product-banner
    desc: Syslinux installer product banner
    if:
      type: text
      regex: 'SYSLINUX\s+[0-9]+\.[0-9]+'
      section: data
  # cptime.c32 is the Syslinux copy-speed benchmark.  These exported
  # routines are its stable module ABI; pairing them with the COM32 runtime
  # dependency and loader layout avoids identifying unrelated ELF utilities
  # that merely contain a copied benchmark string.
  - id: cptime-copy-benchmark-export
    desc: Exports Syslinux cptime copy benchmark
    if:
      type: symbol
      kind: export
      exact: time_copy
  - id: cptime-result-formatter-export
    desc: Exports Syslinux cptime result formatter
    if:
      type: symbol
      kind: export
      regex: '^print_cp_result_(simple|tick|long)$'
  # Statically linked COM32 utilities do not necessarily retain a
  # libcom32.c32 dependency.  These are stable Syslinux console APIs used by
  # the stock directory-listing module and provide a family identity without
  # relying on the filename alone.
  - id: syslinux-screen-size-import
    desc: Imports the Syslinux console screen-size API
    if:
      type: symbol
      kind: import
      exact: getscreensize
  - id: syslinux-key-input-import
    desc: Imports the Syslinux keyboard input API
    if:
      type: symbol
      kind: import
      exact: get_key
  - id: poweroff-apm-status-text
    desc: Syslinux APM power-off status text
    if:
      type: text
      substr: 'APM not present.'
      section: rodata
  - id: kontron-kempld-access-export
    desc: Exports a Kontron KEMPLD access routine
    if:
      type: symbol
      kind: export
      regex: '^kempld_(read|write|set_index|prescaler_bits)$'
  - id: chain-disk-read-import
    desc: Imports Syslinux chain disk-read API
    if:
      type: symbol
      kind: import
      exact: disk_read_sectors
  - id: chain-disk-write-import
    desc: Imports Syslinux chain disk-write API
    if:
      type: symbol
      kind: import
      exact: disk_write_sectors
  # prdhcp.c32 displays the cached PXE packet and its DHCP vendor options.
  # The exported formatter set and PXELINUX-only guard are more stable than
  # the module filename and distinguish it from other PXE-aware modules.
  - id: prdhcp-packet-formatter-export
    desc: Exports Syslinux PXE/DHCP packet formatters
    if:
      type: symbol
      kind: export
      regex: '^print_(dhcp_pkt_all|pxe_(bootp_t|vendor_blk))$'
  # meminfo.c32 reports BIOS memory services, including INT 15h E801 and the
  # E820 map.  These report strings combined with the BIOS interrupt import
  # identify the utility without relying on its basename.
  - id: meminfo-bios-memory-report-text
    desc: Syslinux BIOS memory probe report text
    if:
      type: text
      regex: '^INT 15(h =| 88:| E801:)'
      section: rodata
  - id: meminfo-acpi-map-text
    desc: Syslinux ACPI memory-map report text
    if:
      type: text
      exact: ACPI reclaim
      section: rodata
  # hdt.c32 is the Syslinux Hardware Detection Tool.  Its exported CLI and
  # hardware-probe entry points, title, and DMI parser import form a precise
  # identity even when the module is renamed.
  - id: hdt-cli-export
    desc: Exports Syslinux HDT command-line entry point
    if:
      type: symbol
      kind: export
      exact: hdt_cli
  - id: hdt-hardware-detection-export
    desc: Exports Syslinux HDT hardware detection routine
    if:
      type: symbol
      kind: export
      exact: detect_hardware
  - id: hdt-title-text
    desc: Syslinux Hardware Detection Tool title text
    if:
      type: text
      exact: Hardware Detection Tool
      section: rodata
composite_rules:
  - id: syslinux-installer
    desc: Syslinux boot-media installer
    crit: notable
    conf: 1.0
    all:
      - id: installer-product-banner
      - id: well-known/tool/sysadmin/syslinux/com32-module::installer-ldlinux-payload-name
