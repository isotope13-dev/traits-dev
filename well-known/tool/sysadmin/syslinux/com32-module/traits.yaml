# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  - id: com32-runtime-dependency
    desc: Syslinux COM32 runtime library dependency
    if:
      type: value
      path: elf.needed
      regex: '^lib(com32|gpl|util|menu)\.c32$'
  - id: libutil-com32-soname
    desc: Syslinux libutil COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libutil.c32
  - id: com32-api-import
    desc: Imports the Syslinux COM32 API
    if:
      type: symbol
      kind: import
      regex: '^com32_'
  - id: libgpl-com32-soname
    desc: Syslinux libgpl COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libgpl.c32
  - id: cat-com32-basename
    desc: Syslinux cat COM32 module basename
    if:
      type: basename
      exact: cat.c32
  - id: poweroff-com32-basename
    desc: Syslinux poweroff COM32 module basename
    if:
      type: basename
      exact: poweroff.c32
  - id: installer-ldlinux-payload-name
    desc: Syslinux installer ldlinux payload name
    if:
      type: text
      substr: ldlinux.c32
      section: rodata
  - id: ldlinux-com32-soname
    desc: Syslinux ldlinux COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: ldlinux.c32
  - id: libcom32-com32-soname
    desc: Syslinux libcom32 COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libcom32.c32
  # The stock pwd.c32 module is a statically linked COM32 utility.  Its
  # current-directory API import and failure text are stable source-level
  # identity markers; the COM32 loader layout below prevents a generic ELF
  # utility with copied text from being identified as Syslinux.
  - id: pwd-com32-error-text
    desc: Syslinux pwd current-directory error text
    if:
      type: text
      substr: 'ERROR: getcwd() returned NULL'
      section: rdata
  - id: ls-com32-usage
    desc: Syslinux directory-listing usage text
    if:
      type: text
      substr: 'Usage: %s directory'
      section: rdata
  # ifplop.c32 checks for the PLoP boot manager through a BIOS interrupt and
  # dispatches one of two configured COM32 command paths.  The usage marker is
  # the stable utility identity; the interrupt and COM32 layout keep a copied
  # string in an unrelated ELF from being identified as ifplop.
  - id: ifplop-com32-usage
    desc: Syslinux ifplop PLoP detector usage text
    if:
      type: text
      regex: 'Usage:\s+ifplop\.c32\s+\[<plop_detected>\]'
      section: rodata
  # chain.c32 is the stock Syslinux boot chainloader. Its usage corpus plus
  # the load, disk, and shuffle APIs distinguish it from an unrelated ELF
  # that merely mentions partitions or exports generic file helpers.
  - id: chain-usage-text
    desc: Syslinux chainloader usage text
    if:
      type: text
      substr: 'chain.c32'
      section: rodata
  # hexdump.c32's usage synopsis is a stable utility-level marker.  Pair it
  # with the COM32 loader API rather than identifying an arbitrary file viewer
  # that happens to use the same option words.
  - id: hexdump-usage-text
    desc: Syslinux hexdump utility usage text
    if:
      type: text
      substr: 'Usage: %s [<option> [...]] <filename> [<option> [...]]'
      section: rodata
composite_rules:
  - id: syslinux-com32-api-import
    desc: Imports a Syslinux COM32 module API
    crit: notable
    conf: 0.99
    any:
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-api-import
      - id: com32-api-import
      - id: well-known/tool/sysadmin/syslinux/boot::initramfs-api-import
      - id: well-known/tool/sysadmin/syslinux/boot::pxe-api-import
      - id: well-known/tool/sysadmin/syslinux/installer::setup-data-api-import
      - id: well-known/tool/sysadmin/syslinux/installer::loadfile-api-import
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::dmi-api-import
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::dmi-parser-import
      - id: well-known/tool/sysadmin/syslinux/menu::menu-api-import
  - id: syslinux-com32-module
    desc: Syslinux COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: syslinux-com32-api-import
  - id: kontron-kempld-com32-module
    desc: Syslinux Kontron KEMPLD COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: well-known/tool/sysadmin/syslinux/installer::kontron-kempld-access-export
  - id: pwd-com32-module
    desc: Syslinux pwd current-directory COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: micro-behaviors/fs/directory/cwd::getcwd-import
      - id: pwd-com32-error-text
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: debug-com32-module
    desc: Syslinux debug COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-debug-api-import
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: config-com32-module
    desc: Syslinux kernel configuration COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/boot::syslinux-run-kernel-image-import
      - id: com32-runtime-dependency
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: cptime-com32-module
    desc: Syslinux cptime copy benchmark COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/installer::cptime-copy-benchmark-export
      - id: well-known/tool/sysadmin/syslinux/installer::cptime-result-formatter-export
      - id: com32-runtime-dependency
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: ldlinux-com32-runtime
    desc: Syslinux ldlinux BIOS COM32 runtime
    crit: notable
    conf: 1.0
    all:
      - id: ldlinux-com32-soname
      - id: well-known/tool/sysadmin/syslinux/boot::syslinux-boot-api-export
      - id: well-known/tool/sysadmin/syslinux/boot::syslinux-initramfs-archive-export
      - id: micro-behaviors/data/decompress/zlib::inflate
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: libcom32-com32-runtime
    desc: Syslinux libcom32 BIOS COM32 runtime library
    crit: notable
    conf: 1.0
    all:
      - id: libcom32-com32-soname
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-bios-interrupt-import
      - id: micro-behaviors/data/decompress/zlib::inflate
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: libgpl-com32-module
    desc: Syslinux libgpl BIOS COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: libgpl-com32-soname
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-bios-interrupt-import
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: cat-com32-module
    desc: Syslinux cat COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: cat-com32-basename
      - id: metadata/binary/header/program::elf-entry-in-writable-segment
      - id: metadata/binary/header/program::elf-wx-segment
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/ui/help::usage-title
  - id: poweroff-com32-module
    desc: Syslinux APM poweroff COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: poweroff-com32-basename
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-bios-interrupt-import
      - id: well-known/tool/sysadmin/syslinux/installer::poweroff-apm-status-text
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: pmload-com32-module
    desc: Syslinux protected-mode loader COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/boot::pmload-boot-raw-export
      - id: well-known/tool/sysadmin/syslinux/boot::syslinux-protected-mode-shuffle-api-import
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::syslinux-memory-map-api-import
      - id: well-known/tool/sysadmin/syslinux/installer::loadfile-api-import
      - id: com32-runtime-dependency
  - id: hexdump-com32-module
    desc: Syslinux hexdump file-viewer COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: hexdump-usage-text
      - id: well-known/tool/sysadmin/syslinux/installer::loadfile-api-import
      - id: com32-runtime-dependency
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: ifcpu64-com32-module
    desc: Syslinux conditional x86-64 command COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: micro-behaviors/os/sysinfo/cpu::extended-cpuid-long-mode-query
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-api-import
      - id: com32-runtime-dependency
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: ethersel-com32-module
    desc: Syslinux PCI network-card selector COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::pci-scan-api-import
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::pci-find-device-api-import
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-api-import
      - id: com32-runtime-dependency
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  # The stock ls.c32 is linked against the COM32 ABI directly, so it has no
  # libcom32.c32 dependency.  Its console APIs, directory iteration imports,
  # and utility-specific usage line together distinguish it from an
  # unrelated ELF that merely happens to have a COM32-compatible layout.
  - id: ls-com32-module
    desc: Syslinux directory-listing COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-screen-size-import
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-key-input-import
      - id: ls-com32-usage
      - id: micro-behaviors/fs/directory/readdir::readdir-opendir
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir
      - id: micro-behaviors/fs/directory/readdir::readdir-closedir
  - id: disk-com32-module
    desc: Syslinux disk-information COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::disk-drive-parameters-import
  - id: ifplop-com32-module
    desc: Syslinux ifplop PLoP detector COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: ifplop-com32-usage
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-bios-interrupt-import
      - id: com32-runtime-dependency
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: chain-com32-module
    desc: Syslinux chainloader COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: chain-usage-text
      - id: well-known/tool/sysadmin/syslinux/installer::loadfile-api-import
      - id: well-known/tool/sysadmin/syslinux/installer::chain-disk-read-import
      - id: well-known/tool/sysadmin/syslinux/installer::chain-disk-write-import
      - id: well-known/tool/sysadmin/syslinux/boot::chain-shuffle-import
      - id: com32-runtime-dependency
  - id: prdhcp-com32-module
    desc: Syslinux PXE/DHCP packet display COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/installer::prdhcp-packet-formatter-export
      - id: well-known/tool/sysadmin/syslinux/boot::prdhcp-pxelinux-guard-text
      - id: well-known/tool/sysadmin/syslinux/boot::pxe-api-import
      - id: com32-runtime-dependency
  - id: meminfo-com32-module
    desc: Syslinux BIOS memory information COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-bios-interrupt-import
      - id: well-known/tool/sysadmin/syslinux/installer::meminfo-bios-memory-report-text
      - id: well-known/tool/sysadmin/syslinux/installer::meminfo-acpi-map-text
  - id: hdt-com32-module
    desc: Syslinux Hardware Detection Tool COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/installer::hdt-cli-export
      - id: well-known/tool/sysadmin/syslinux/installer::hdt-hardware-detection-export
      - id: well-known/tool/sysadmin/syslinux/installer::hdt-title-text
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::dmi-parser-import
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::pci-scan-api-import
      - id: com32-runtime-dependency
