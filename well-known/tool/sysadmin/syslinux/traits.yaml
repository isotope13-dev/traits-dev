# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 10000000

traits:
  - id: libcom32-soname
    desc: Syslinux libcom32 module SONAME
    if:
      type: value
      path: elf.soname
      exact: libcom32.c32

  - id: syslinux-api-exports
    desc: Exports multiple Syslinux COM32 APIs
    if:
      type: symbol
      kind: export
      regex: '^syslinux_'
    count_min: 4

  - id: com32-loader-export
    desc: Exports the Syslinux Linux boot entrypoint
    if:
      type: symbol
      kind: export
      exact: bios_boot_linux

composite_rules:
  - id: syslinux-libcom32-module
    desc: Syslinux libcom32 COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: libcom32-soname
      - id: syslinux-api-exports
      - id: com32-loader-export
