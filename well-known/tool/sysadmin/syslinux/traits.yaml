# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: com32-runtime-dependency
    desc: Syslinux COM32 runtime library dependency
    if:
      type: value
      path: elf.needed
      regex: '^lib(com32|gpl|util|menu)\.c32$'

  - id: libutil-com32-soname
    desc: Syslinux libutil COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libutil.c32

  - id: syslinux-api-import
    desc: Imports a Syslinux module API
    if:
      type: symbol
      kind: import
      regex: '^syslinux_'

  - id: syslinux-debug-api-import
    desc: Imports the Syslinux debug API
    if:
      type: symbol
      kind: import
      exact: syslinux_debug

  - id: com32-api-import
    desc: Imports the Syslinux COM32 API
    if:
      type: symbol
      kind: import
      regex: '^com32_'

  - id: initramfs-api-import
    desc: Imports the Syslinux initramfs API
    if:
      type: symbol
      kind: import
      regex: '^initramfs_'

  - id: pxe-api-import
    desc: Imports the Syslinux PXE API
    if:
      type: symbol
      kind: import
      regex: '^pxe_'

  - id: gpxecmd-gpxe-check-import
    desc: Imports the Syslinux gPXE detection helper
    if:
      type: symbol
      kind: import
      exact: is_gpxe

  - id: setup-data-api-import
    desc: Imports the Syslinux setup-data API
    if:
      type: symbol
      kind: import
      regex: '^setup_data_'

  - id: loadfile-api-import
    desc: Imports the Syslinux loadfile API
    if:
      type: symbol
      kind: import
      exact: loadfile

  - id: dmi-api-import
    desc: Imports the Syslinux DMI API
    if:
      type: symbol
      kind: import
      regex: '^dmi_'

  - id: dmi-parser-import
    desc: Imports the Syslinux DMI parser API
    if:
      type: symbol
      kind: import
      exact: parse_dmitable

  - id: dmi-iterator-import
    desc: Imports Syslinux DMI iterator API
    if:
      type: symbol
      kind: import
      exact: dmi_iterate

  - id: dmi-lua-module-export
    desc: Exports Syslinux DMI Lua initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_dmi

  - id: menu-api-import
    desc: Imports the Syslinux menu API
    if:
      type: symbol
      kind: import
      exact: init_menusystem

  - id: libmenu-com32-soname
    desc: Syslinux libmenu COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libmenu.c32

  - id: libmenu-menu-api-export
    desc: Exports the Syslinux menu initializer
    if:
      type: symbol
      kind: export
      exact: init_menusystem

  - id: pci-scan-api-import
    desc: Imports the Syslinux PCI scan API
    if:
      type: symbol
      kind: import
      exact: pci_scan

  - id: pci-find-device-api-import
    desc: Imports the Syslinux PCI device lookup API
    if:
      type: symbol
      kind: import
      exact: find_pci_device

  - id: pci-lua-module-export
    desc: Exports the Syslinux PCI Lua initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_pci

  - id: syslinux-run-kernel-image-import
    desc: Imports the Syslinux kernel-image launcher
    if:
      type: symbol
      kind: import
      exact: syslinux_run_kernel_image

  - id: pxechn-entry-export
    desc: Exports the Syslinux pxechn entry point
    if:
      type: symbol
      kind: export
      exact: pxechn

  - id: cmenu-lua-module-export
    desc: Exports cmenu Lua module initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_cmenu

  # Some COM32 modules do not import the Syslinux ABI directly.  Their stable
  # ELF identity is still available from the SONAME or the module basename,
  # while the loader layout confirms that the identity is a COM32 artifact.
  - id: liblua-com32-soname
    desc: Syslinux liblua COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: liblua.c32

  - id: libgpl-com32-soname
    desc: Syslinux libgpl COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libgpl.c32

  - id: cat-com32-basename
    desc: Syslinux cat COM32 module basename
    if:
      type: basename
      exact: cat.c32

  - id: cpuid-com32-basename
    desc: Syslinux cpuid COM32 module basename
    if:
      type: basename
      exact: cpuid.c32

  - id: cpuid-com32-usage
    desc: Syslinux cpuid COM32 CLI usage marker
    if:
      type: text
      substr: 'Usage: %s leaf [counter]'
      section: rodata

  - id: poweroff-com32-basename
    desc: Syslinux poweroff COM32 module basename
    if:
      type: basename
      exact: poweroff.c32

  - id: syslinux-bios-interrupt-import
    desc: Syslinux BIOS interrupt helper import
    if:
      type: symbol
      kind: import
      exact: __intcall

  # cptime.c32 is the Syslinux copy-speed benchmark.  These exported
  # routines are its stable module ABI; pairing them with the COM32 runtime
  # dependency and loader layout avoids identifying unrelated ELF utilities
  # that merely contain a copied benchmark string.
  - id: cptime-copy-benchmark-export
    desc: Exports Syslinux cptime copy benchmark
    if:
      type: symbol
      kind: export
      exact: time_copy

  - id: cptime-result-formatter-export
    desc: Exports Syslinux cptime result formatter
    if:
      type: symbol
      kind: export
      regex: '^print_cp_result_(simple|tick|long)$'

  # These API exports are also present in libcom32.c32, so the atoms describe
  # the exported APIs rather than claiming the file is ldlinux.c32.
  - id: syslinux-boot-api-export
    desc: Exports Syslinux kernel-boot API
    if:
      type: symbol
      kind: export
      regex: '^syslinux_(boot_linux|run_kernel_image|run_command)$'

  - id: syslinux-initramfs-archive-export
    desc: Exports Syslinux initramfs archive API
    if:
      type: symbol
      kind: export
      exact: initramfs_load_archive

  - id: ldlinux-com32-soname
    desc: Syslinux ldlinux COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: ldlinux.c32

  - id: libcom32-com32-soname
    desc: Syslinux libcom32 COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: libcom32.c32

  # ifcpu.c32 conditionally boots one of two configured entries after
  # checking CPU features through the Syslinux helper API.
  - id: ifcpu-usage-text
    desc: Syslinux ifcpu conditional-boot usage text
    if:
      type: text
      substr: 'Run one command if system match some CPU features, another if it doesn''t.'
      section: rodata

  # pmload.c32 loads a protected-mode image, builds a memory map, and invokes
  # the Syslinux protected-mode shuffle/boot routine.
  - id: pmload-boot-raw-export
    desc: Exports pmload raw-boot entry point
    if:
      type: symbol
      kind: export
      exact: boot_raw

  - id: syslinux-protected-mode-shuffle-api-import
    desc: Imports Syslinux protected-mode shuffle API
    if:
      type: symbol
      kind: import
      exact: syslinux_shuffle_boot_pm

  - id: syslinux-memory-map-api-import
    desc: Imports Syslinux memory-map API
    if:
      type: symbol
      kind: import
      exact: syslinux_memory_map

  # menu.c32 is the interactive Syslinux configuration/menu program.  These
  # exports are utility-specific and are combined with the COM32 dependency
  # and screen/key APIs below, rather than treating every console API user as
  # the menu module.
  - id: menu-config-parser-export
    desc: Exports the Syslinux menu config parser
    if:
      type: symbol
      kind: export
      exact: parse_configs

  - id: menu-start-export
    desc: Exports the Syslinux menu startup routine
    if:
      type: symbol
      kind: export
      exact: start_menu

  # elf.c32 loads an ELF kernel or payload into the Syslinux memory map and
  # transfers control through the protected-mode shuffle API.  The boot_elf
  # export and elf.c32 usage line are more specific than the shared APIs.
  - id: elf-boot-entry-export
    desc: Exports the Syslinux ELF boot entry
    if:
      type: symbol
      kind: export
      exact: boot_elf

  - id: elf-loader-usage-text
    desc: Syslinux elf.c32 loader usage text
    if:
      type: text
      exact: 'Usage: elf.c32 elf_file arguments...'
      section: rodata

  - id: elf-loadfile-api-import
    desc: Imports the Syslinux compressed file loader
    if:
      type: symbol
      kind: import
      exact: zloadfile

  # The stock pwd.c32 module is a statically linked COM32 utility.  Its
  # current-directory API import and failure text are stable source-level
  # identity markers; the COM32 loader layout below prevents a generic ELF
  # utility with copied text from being identified as Syslinux.
  - id: pwd-com32-error-text
    desc: Syslinux pwd current-directory error text
    if:
      type: text
      substr: 'ERROR: getcwd() returned NULL'
      section: rdata

  # Statically linked COM32 utilities do not necessarily retain a
  # libcom32.c32 dependency.  These are stable Syslinux console APIs used by
  # the stock directory-listing module and provide a family identity without
  # relying on the filename alone.
  - id: syslinux-screen-size-import
    desc: Imports the Syslinux console screen-size API
    if:
      type: symbol
      kind: import
      exact: getscreensize

  - id: syslinux-key-input-import
    desc: Imports the Syslinux keyboard input API
    if:
      type: symbol
      kind: import
      exact: get_key

  - id: ls-com32-usage
    desc: Syslinux directory-listing usage text
    if:
      type: text
      substr: 'Usage: %s directory'
      section: rdata

  - id: poweroff-apm-status-text
    desc: Syslinux APM power-off status text
    if:
      type: text
      substr: 'APM not present.'
      section: rodata

  - id: cpuidtest-com32-basename
    desc: Syslinux cpuidtest COM32 module basename
    if:
      type: basename
      exact: cpuidtest.c32

  - id: cpu-detection-helper-import
    desc: Imports the Syslinux CPU detection helper
    if:
      type: symbol
      kind: import
      exact: detect_cpu

  - id: cpu-lua-module-export
    desc: Exports the Syslinux CPU Lua initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_cpu

  - id: kontron-kempld-access-export
    desc: Exports a Kontron KEMPLD access routine
    if:
      type: symbol
      kind: export
      regex: '^kempld_(read|write|set_index|prescaler_bits)$'

  - id: cpuidtest-output-format
    desc: Syslinux CPU report output format
    if:
      type: text
      substr: 'Vendor      = %s'
      section: rodata

  # ifplop.c32 checks for the PLoP boot manager through a BIOS interrupt and
  # dispatches one of two configured COM32 command paths.  The usage marker is
  # the stable utility identity; the interrupt and COM32 layout keep a copied
  # string in an unrelated ELF from being identified as ifplop.
  - id: ifplop-com32-usage
    desc: Syslinux ifplop PLoP detector usage text
    if:
      type: text
      regex: 'Usage:\s+ifplop\.c32\s+\[<plop_detected>\]'
      section: rodata

  # chain.c32 is the stock Syslinux boot chainloader. Its usage corpus plus
  # the load, disk, and shuffle APIs distinguish it from an unrelated ELF
  # that merely mentions partitions or exports generic file helpers.
  - id: chain-usage-text
    desc: Syslinux chainloader usage text
    if:
      type: text
      substr: 'chain.c32'
      section: rodata

  - id: chain-disk-read-import
    desc: Imports Syslinux chain disk-read API
    if:
      type: symbol
      kind: import
      exact: disk_read_sectors

  - id: chain-disk-write-import
    desc: Imports Syslinux chain disk-write API
    if:
      type: symbol
      kind: import
      exact: disk_write_sectors

  - id: chain-shuffle-import
    desc: Imports Syslinux chain shuffle API
    if:
      type: symbol
      kind: import
      exact: syslinux_shuffle_boot_rm

  # hexdump.c32's usage synopsis is a stable utility-level marker.  Pair it
  # with the COM32 loader API rather than identifying an arbitrary file viewer
  # that happens to use the same option words.
  - id: hexdump-usage-text
    desc: Syslinux hexdump utility usage text
    if:
      type: text
      substr: 'Usage: %s [<option> [...]] <filename> [<option> [...]]'
      section: rodata

  # prdhcp.c32 displays the cached PXE packet and its DHCP vendor options.
  # The exported formatter set and PXELINUX-only guard are more stable than
  # the module filename and distinguish it from other PXE-aware modules.
  - id: prdhcp-packet-formatter-export
    desc: Exports Syslinux PXE/DHCP packet formatters
    if:
      type: symbol
      kind: export
      regex: '^print_(dhcp_pkt_all|pxe_(bootp_t|vendor_blk))$'

  - id: prdhcp-pxelinux-guard-text
    desc: Syslinux PXELINUX-only execution guard text
    if:
      type: text
      substr: 'May only run in PXELINUX'
      section: rodata

  # meminfo.c32 reports BIOS memory services, including INT 15h E801 and the
  # E820 map.  These report strings combined with the BIOS interrupt import
  # identify the utility without relying on its basename.
  - id: meminfo-bios-memory-report-text
    desc: Syslinux BIOS memory probe report text
    if:
      type: text
      regex: '^INT 15(h =| 88:| E801:)'
      section: rodata

  - id: meminfo-acpi-map-text
    desc: Syslinux ACPI memory-map report text
    if:
      type: text
      exact: ACPI reclaim
      section: rodata

  # hdt.c32 is the Syslinux Hardware Detection Tool.  Its exported CLI and
  # hardware-probe entry points, title, and DMI parser import form a precise
  # identity even when the module is renamed.
  - id: hdt-cli-export
    desc: Exports Syslinux HDT command-line entry point
    if:
      type: symbol
      kind: export
      exact: hdt_cli

  - id: hdt-hardware-detection-export
    desc: Exports Syslinux HDT hardware detection routine
    if:
      type: symbol
      kind: export
      exact: detect_hardware

  - id: hdt-title-text
    desc: Syslinux Hardware Detection Tool title text
    if:
      type: text
      exact: Hardware Detection Tool
      section: rodata

  # dmitest.c32 is the interactive Syslinux DMI/SMBIOS browser.  Its command
  # help and DMI presence/absence report strings are stable utility identity
  # markers; pairing them with the DMI parser/iterator imports and COM32
  # runtime dependency avoids identifying an unrelated ELF that merely prints
  # SMBIOS field labels.
  - id: dmitest-command-help-text
    desc: Syslinux dmitest interactive command help
    if:
      type: text
      substr: 'Available commands are system, chassis, base_board, cpu, bios, memory, battery, all, exit'
      section: rodata

  - id: dmitest-dmi-presence-text
    desc: Syslinux dmitest DMI presence report text
    if:
      type: text
      substr: 'DMI %u.%u present.'
      section: rodata

  - id: dmitest-no-dmi-text
    desc: Syslinux dmitest missing-DMI error text
    if:
      type: text
      exact: 'No DMI Structure found'
      section: rodata

composite_rules:
  - id: syslinux-com32-api-import
    desc: Imports a Syslinux COM32 module API
    crit: notable
    conf: 0.99
    any:
      - id: syslinux-api-import
      - id: com32-api-import
      - id: initramfs-api-import
      - id: pxe-api-import
      - id: setup-data-api-import
      - id: loadfile-api-import
      - id: dmi-api-import
      - id: dmi-parser-import
      - id: menu-api-import

  - id: syslinux-com32-module
    desc: Syslinux COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: syslinux-com32-api-import

  - id: gpxe-aware-com32-module
    desc: Syslinux COM32 module with gPXE detection
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: pxe-api-import
      - id: gpxecmd-gpxe-check-import

  - id: kontron-kempld-com32-module
    desc: Syslinux Kontron KEMPLD COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: kontron-kempld-access-export

  - id: pwd-com32-module
    desc: Syslinux pwd current-directory COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: micro-behaviors/fs/directory/cwd::getcwd-import
      - id: pwd-com32-error-text
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: debug-com32-module
    desc: Syslinux debug COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: syslinux-debug-api-import
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: pxechn-com32-module
    desc: Syslinux PXE/DHCP COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: pxechn-entry-export
      - id: com32-runtime-dependency
      - id: pxe-api-import
      - id: loadfile-api-import
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: config-com32-module
    desc: Syslinux kernel configuration COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: syslinux-run-kernel-image-import
      - id: com32-runtime-dependency
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cmenu-com32-module
    desc: Syslinux cmenu Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: cmenu-lua-module-export
      - id: com32-runtime-dependency
      - id: menu-api-import
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cptime-com32-module
    desc: Syslinux cptime copy benchmark COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: cptime-copy-benchmark-export
      - id: cptime-result-formatter-export
      - id: com32-runtime-dependency
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: ldlinux-com32-runtime
    desc: Syslinux ldlinux BIOS COM32 runtime
    crit: notable
    conf: 1.0
    all:
      - id: ldlinux-com32-soname
      - id: syslinux-boot-api-export
      - id: syslinux-initramfs-archive-export
      - id: micro-behaviors/data/compress/library::inflate
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: libcom32-com32-runtime
    desc: Syslinux libcom32 BIOS COM32 runtime library
    crit: notable
    conf: 1.0
    all:
      - id: libcom32-com32-soname
      - id: syslinux-bios-interrupt-import
      - id: micro-behaviors/data/compress/library::inflate
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: liblua-com32-module
    desc: Syslinux liblua COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: liblua-com32-soname
      - id: metadata/binary/anomaly/format::elf-entry-in-writable-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment

  - id: libgpl-com32-module
    desc: Syslinux libgpl BIOS COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: libgpl-com32-soname
      - id: syslinux-bios-interrupt-import
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cat-com32-module
    desc: Syslinux cat COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: cat-com32-basename
      - id: metadata/binary/anomaly/format::elf-entry-in-writable-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/read::fread
      - id: micro-behaviors/fs/file/write/direct::write--fwrite
      - id: micro-behaviors/ui/help::usage-title-string

  - id: cpuid-com32-module
    desc: Syslinux cpuid COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: cpuid-com32-basename
      - id: cpuid-com32-usage
      # The basename and CLI text identify the utility, while these layout
      # traits distinguish a COM32 module from an unrelated ELF renamed to
      # cpuid.c32 or carrying copied usage text.
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: poweroff-com32-module
    desc: Syslinux APM poweroff COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: poweroff-com32-basename
      - id: syslinux-bios-interrupt-import
      - id: poweroff-apm-status-text
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cpuidtest-com32-module
    desc: Syslinux CPU information COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: cpuidtest-com32-basename
      - id: com32-runtime-dependency
      - id: cpu-detection-helper-import
      - id: cpuidtest-output-format
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cpu-com32-module
    desc: Syslinux CPU-information Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: cpu-detection-helper-import
      - id: cpu-lua-module-export

  - id: ifcpu-com32-module
    desc: Syslinux conditional CPU boot COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: ifcpu-usage-text
      - id: cpu-detection-helper-import
      - id: syslinux-api-import
      - id: com32-runtime-dependency

  - id: pmload-com32-module
    desc: Syslinux protected-mode loader COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: pmload-boot-raw-export
      - id: syslinux-protected-mode-shuffle-api-import
      - id: syslinux-memory-map-api-import
      - id: loadfile-api-import
      - id: com32-runtime-dependency

  - id: menu-com32-module
    desc: Syslinux interactive menu COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: menu-config-parser-export
      - id: menu-start-export
      - id: syslinux-screen-size-import
      - id: syslinux-key-input-import

  - id: elf-com32-module
    desc: Syslinux ELF loader COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: elf-boot-entry-export
      - id: elf-loader-usage-text
      - id: elf-loadfile-api-import
      - id: syslinux-memory-map-api-import
      - id: syslinux-protected-mode-shuffle-api-import

  - id: libmenu-com32-module
    desc: Syslinux libmenu COM32 menu module
    crit: notable
    conf: 1.0
    all:
      - id: libmenu-com32-soname
      - id: libmenu-menu-api-export
      - id: com32-runtime-dependency
      - id: syslinux-api-import

  - id: pci-com32-module
    desc: Syslinux PCI Lua COM32 module
    crit: notable
