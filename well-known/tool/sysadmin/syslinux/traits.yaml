# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: com32-runtime-dependency
    desc: Syslinux COM32 runtime library dependency
    if:
      type: value
      path: elf.needed
      regex: '^lib(com32|gpl|util|menu)\.c32$'

  - id: syslinux-api-import
    desc: Imports a Syslinux module API
    if:
      type: symbol
      kind: import
      regex: '^syslinux_'

  - id: syslinux-debug-api-import
    desc: Imports the Syslinux debug API
    if:
      type: symbol
      kind: import
      exact: syslinux_debug

  - id: com32-api-import
    desc: Imports the Syslinux COM32 API
    if:
      type: symbol
      kind: import
      regex: '^com32_'

  - id: initramfs-api-import
    desc: Imports the Syslinux initramfs API
    if:
      type: symbol
      kind: import
      regex: '^initramfs_'

  - id: pxe-api-import
    desc: Imports the Syslinux PXE API
    if:
      type: symbol
      kind: import
      regex: '^pxe_'

  - id: setup-data-api-import
    desc: Imports the Syslinux setup-data API
    if:
      type: symbol
      kind: import
      regex: '^setup_data_'

  - id: loadfile-api-import
    desc: Imports the Syslinux loadfile API
    if:
      type: symbol
      kind: import
      exact: loadfile

  - id: dmi-api-import
    desc: Imports the Syslinux DMI API
    if:
      type: symbol
      kind: import
      regex: '^dmi_'

  - id: dmi-parser-import
    desc: Imports the Syslinux DMI parser API
    if:
      type: symbol
      kind: import
      exact: parse_dmitable

  - id: menu-api-import
    desc: Imports the Syslinux menu API
    if:
      type: symbol
      kind: import
      exact: init_menusystem

  - id: syslinux-run-kernel-image-import
    desc: Imports the Syslinux kernel-image launcher
    if:
      type: symbol
      kind: import
      exact: syslinux_run_kernel_image

  - id: pxechn-entry-export
    desc: Exports the Syslinux pxechn entry point
    if:
      type: symbol
      kind: export
      exact: pxechn

  - id: cmenu-lua-module-export
    desc: Exports cmenu Lua module initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_cmenu

  # Some COM32 modules do not import the Syslinux ABI directly.  Their stable
  # ELF identity is still available from the SONAME or the module basename,
  # while the loader layout confirms that the identity is a COM32 artifact.
  - id: liblua-com32-soname
    desc: Syslinux liblua COM32 SONAME
    if:
      type: value
      path: elf.soname
      exact: liblua.c32

  - id: cat-com32-basename
    desc: Syslinux cat COM32 module basename
    if:
      type: basename
      exact: cat.c32

  - id: cpuid-com32-basename
    desc: Syslinux cpuid COM32 module basename
    if:
      type: basename
      exact: cpuid.c32

  - id: cpuid-com32-usage
    desc: Syslinux cpuid COM32 CLI usage marker
    if:
      type: text
      substr: 'Usage: %s leaf [counter]'
      section: rodata

  - id: poweroff-com32-basename
    desc: Syslinux poweroff COM32 module basename
    if:
      type: basename
      exact: poweroff.c32

  - id: syslinux-bios-interrupt-import
    desc: Syslinux BIOS interrupt helper import
    if:
      type: symbol
      kind: import
      exact: __intcall

  # Statically linked COM32 utilities do not necessarily retain a
  # libcom32.c32 dependency.  These are stable Syslinux console APIs used by
  # the stock directory-listing module and provide a family identity without
  # relying on the filename alone.
  - id: syslinux-screen-size-import
    desc: Imports the Syslinux console screen-size API
    if:
      type: symbol
      kind: import
      exact: getscreensize

  - id: syslinux-key-input-import
    desc: Imports the Syslinux keyboard input API
    if:
      type: symbol
      kind: import
      exact: get_key

  - id: ls-com32-usage
    desc: Syslinux directory-listing usage text
    if:
      type: text
      substr: 'Usage: %s directory'
      section: rdata

  - id: poweroff-apm-status-text
    desc: Syslinux APM power-off status text
    if:
      type: text
      substr: 'APM not present.'
      section: rodata

  - id: cpuidtest-com32-basename
    desc: Syslinux cpuidtest COM32 module basename
    if:
      type: basename
      exact: cpuidtest.c32

  - id: cpuidtest-helper-import
    desc: Syslinux CPU detection helper import
    if:
      type: symbol
      kind: import
      exact: detect_cpu

  - id: cpuidtest-output-format
    desc: Syslinux CPU report output format
    if:
      type: text
      substr: 'Vendor      = %s'
      section: rodata

composite_rules:
  - id: syslinux-com32-api-import
    desc: Imports a Syslinux COM32 module API
    crit: notable
    conf: 0.99
    any:
      - id: syslinux-api-import
      - id: com32-api-import
      - id: initramfs-api-import
      - id: pxe-api-import
      - id: setup-data-api-import
      - id: loadfile-api-import
      - id: dmi-api-import
      - id: dmi-parser-import
      - id: menu-api-import

  - id: syslinux-com32-module
    desc: Syslinux COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: com32-runtime-dependency
      - id: syslinux-com32-api-import

  - id: debug-com32-module
    desc: Syslinux debug COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: syslinux-debug-api-import
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: pxechn-com32-module
    desc: Syslinux PXE/DHCP COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: pxechn-entry-export
      - id: com32-runtime-dependency
      - id: pxe-api-import
      - id: loadfile-api-import
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: config-com32-module
    desc: Syslinux kernel configuration COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: syslinux-run-kernel-image-import
      - id: com32-runtime-dependency
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cmenu-com32-module
    desc: Syslinux cmenu Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: cmenu-lua-module-export
      - id: com32-runtime-dependency
      - id: menu-api-import

  - id: liblua-com32-module
    desc: Syslinux liblua COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: liblua-com32-soname
      - id: metadata/binary/anomaly/format::elf-entry-in-writable-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment

  - id: cat-com32-module
    desc: Syslinux cat COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: cat-com32-basename
      - id: metadata/binary/anomaly/format::elf-entry-in-writable-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/read::fread
      - id: micro-behaviors/fs/file/write/direct::write--fwrite
      - id: micro-behaviors/ui/help::usage-title-string

  - id: cpuid-com32-module
    desc: Syslinux cpuid COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: cpuid-com32-basename
      - id: cpuid-com32-usage
      # The basename and CLI text identify the utility, while these layout
      # traits distinguish a COM32 module from an unrelated ELF renamed to
      # cpuid.c32 or carrying copied usage text.
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: poweroff-com32-module
    desc: Syslinux APM poweroff COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: poweroff-com32-basename
      - id: syslinux-bios-interrupt-import
      - id: poweroff-apm-status-text
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  - id: cpuidtest-com32-module
    desc: Syslinux CPU information COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: cpuidtest-com32-basename
      - id: com32-runtime-dependency
      - id: cpuidtest-helper-import
      - id: cpuidtest-output-format
      - id: metadata/binary/anomaly/format::elf-entry-in-last-segment
      - id: metadata/binary/anomaly/format::elf-wx-segment

  # The stock ls.c32 is linked against the COM32 ABI directly, so it has no
  # libcom32.c32 dependency.  Its console APIs, directory iteration imports,
  # and utility-specific usage line together distinguish it from an
  # unrelated ELF that merely happens to have a COM32-compatible layout.
  - id: ls-com32-module
    desc: Syslinux directory-listing COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: syslinux-screen-size-import
      - id: syslinux-key-input-import
      - id: ls-com32-usage
      - id: micro-behaviors/fs/directory/readdir::readdir-opendir
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir
      - id: micro-behaviors/fs/directory/readdir::readdir-closedir
