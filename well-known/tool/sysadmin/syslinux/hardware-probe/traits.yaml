# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  - id: vpd-decode-api-import
    desc: Imports the Syslinux VPD decoder
    if:
      type: symbol
      kind: import
      exact: vpd_decode
  - id: vpdtest-report-text
    desc: Syslinux VPD report output text
    if:
      type: text
      exact: 'VPD present at address : 0x%s'
      section: rodata
  - id: vpdtest-bios-field-text
    desc: Syslinux BIOS field report text
    if:
      type: text
      exact: 'Bios Build ID                 : %s'
      section: rodata
  - id: dmi-api-import
    desc: Imports the Syslinux DMI API
    if:
      type: symbol
      kind: import
      regex: '^dmi_'
  - id: dmi-parser-import
    desc: Imports the Syslinux DMI parser API
    if:
      type: symbol
      kind: import
      exact: parse_dmitable
  - id: dmi-iterator-import
    desc: Imports Syslinux DMI iterator API
    if:
      type: symbol
      kind: import
      exact: dmi_iterate
  - id: dmi-lua-module-export
    desc: Exports Syslinux DMI Lua initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_dmi
  - id: pci-scan-api-import
    desc: Imports the Syslinux PCI scan API
    if:
      type: symbol
      kind: import
      exact: pci_scan
  - id: pci-find-device-api-import
    desc: Imports the Syslinux PCI device lookup API
    if:
      type: symbol
      kind: import
      exact: find_pci_device
  - id: pci-lua-module-export
    desc: Exports the Syslinux PCI Lua initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_pci
  - id: cpuid-com32-basename
    desc: Syslinux cpuid COM32 module basename
    if:
      type: basename
      exact: cpuid.c32
  - id: cpuid-com32-usage
    desc: Syslinux cpuid COM32 CLI usage marker
    if:
      type: text
      substr: 'Usage: %s leaf [counter]'
      section: rodata
  # disk.c32 is linked against libgpl.c32 and queries BIOS drive geometry
  # through this Syslinux-specific helper.  The symbol is more durable than
  # the utility's output wording and is paired with the runtime dependency
  # below before the utility identity is asserted.
  - id: disk-drive-parameters-import
    desc: Imports Syslinux disk-parameter API
    if:
      type: symbol
      kind: import
      exact: get_drive_parameters
  # ifcpu.c32 conditionally boots one of two configured entries after
  # checking CPU features through the Syslinux helper API.
  - id: ifcpu-usage-text
    desc: Syslinux ifcpu conditional-boot usage text
    if:
      type: text
      substr: 'Run one command if system match some CPU features, another if it doesn''t.'
      section: rodata
  - id: syslinux-memory-map-api-import
    desc: Imports Syslinux memory-map API
    if:
      type: symbol
      kind: import
      exact: syslinux_memory_map
  - id: cpuidtest-com32-basename
    desc: Syslinux cpuidtest COM32 module basename
    if:
      type: basename
      exact: cpuidtest.c32
  - id: cpu-detection-helper-import
    desc: Imports the Syslinux CPU detection helper
    if:
      type: symbol
      kind: import
      exact: detect_cpu
  - id: cpu-lua-module-export
    desc: Exports the Syslinux CPU Lua initializer
    if:
      type: symbol
      kind: export
      exact: luaopen_cpu
  - id: cpuidtest-output-format
    desc: Syslinux CPU report output format
    if:
      type: text
      substr: 'Vendor      = %s'
      section: rodata
  # dmitest.c32 is the interactive Syslinux DMI/SMBIOS browser.  Its command
  # help and DMI presence/absence report strings are stable utility identity
  # markers; pairing them with the DMI parser/iterator imports and COM32
  # runtime dependency avoids identifying an unrelated ELF that merely prints
  # SMBIOS field labels.
  - id: dmitest-command-help-text
    desc: Syslinux dmitest interactive command help
    if:
      type: text
      substr: 'Available commands are system, chassis, base_board, cpu, bios, memory, battery, all, exit'
      section: rodata
  - id: dmitest-dmi-presence-text
    desc: Syslinux dmitest DMI presence report text
    if:
      type: text
      substr: 'DMI %u.%u present.'
      section: rodata
  - id: dmitest-no-dmi-text
    desc: Syslinux dmitest missing-DMI error text
    if:
      type: text
      exact: 'No DMI Structure found'
      section: rodata
composite_rules:
  - id: vpdtest-com32-module
    desc: Syslinux VPD inspection COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: vpd-decode-api-import
      - id: vpdtest-report-text
      - id: vpdtest-bios-field-text
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: cpuid-com32-module
    desc: Syslinux cpuid COM32 runtime module
    crit: notable
    conf: 1.0
    all:
      - id: cpuid-com32-basename
      - id: cpuid-com32-usage
      # The basename and CLI text identify the utility, while these layout
      # traits distinguish a COM32 module from an unrelated ELF renamed to
      # cpuid.c32 or carrying copied usage text.
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: cpuidtest-com32-module
    desc: Syslinux CPU information COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: cpuidtest-com32-basename
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: cpu-detection-helper-import
      - id: cpuidtest-output-format
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: cpu-com32-module
    desc: Syslinux CPU-information Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: cpu-detection-helper-import
      - id: cpu-lua-module-export
  - id: ifcpu-com32-module
    desc: Syslinux conditional CPU boot COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: ifcpu-usage-text
      - id: cpu-detection-helper-import
      - id: well-known/tool/sysadmin/syslinux/installer::syslinux-api-import
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
  - id: pci-com32-module
    desc: Syslinux PCI Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: pci-scan-api-import
      - id: pci-lua-module-export
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
  - id: dmi-com32-module
    desc: Syslinux DMI Lua COM32 module
    crit: notable
    conf: 1.0
    all:
      - id: dmi-lua-module-export
      - id: dmi-parser-import
      - id: dmi-iterator-import
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
  - id: dmitest-com32-module
    desc: Syslinux DMI interactive browser COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: dmitest-command-help-text
      - id: dmitest-dmi-presence-text
      - id: dmitest-no-dmi-text
      - id: dmi-parser-import
      - id: dmi-iterator-import
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
