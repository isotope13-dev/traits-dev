# Syslinux COM32 runtime modules.
#
# COM32 modules are boot-loader components, not ordinary Linux processes. Their
# single RWX PT_LOAD and entry point in that segment are part of the runtime
# layout used by Syslinux's firmware-facing loader ABI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  - id: syslinux-reboot-api-import
    desc: Imports the Syslinux reboot API
    if:
      type: symbol
      kind: import
      exact: syslinux_reboot
  - id: initramfs-api-import
    desc: Imports the Syslinux initramfs API
    if:
      type: symbol
      kind: import
      regex: '^initramfs_'
  - id: pxe-api-import
    desc: Imports the Syslinux PXE API
    if:
      type: symbol
      kind: import
      regex: '^pxe_'
  - id: gpxecmd-gpxe-check-import
    desc: Imports the Syslinux gPXE detection helper
    if:
      type: symbol
      kind: import
      exact: is_gpxe
  - id: syslinux-run-kernel-image-import
    desc: Imports the Syslinux kernel-image launcher
    if:
      type: symbol
      kind: import
      exact: syslinux_run_kernel_image
  - id: pxechn-entry-export
    desc: Exports the Syslinux pxechn entry point
    if:
      type: symbol
      kind: export
      exact: pxechn
  # These API exports are also present in libcom32.c32, so the atoms describe
  # the exported APIs rather than claiming the file is ldlinux.c32.
  - id: syslinux-boot-api-export
    desc: Exports Syslinux kernel-boot API
    if:
      type: symbol
      kind: export
      regex: '^syslinux_(boot_linux|run_kernel_image|run_command)$'
  - id: syslinux-initramfs-archive-export
    desc: Exports Syslinux initramfs archive API
    if:
      type: symbol
      kind: export
      exact: initramfs_load_archive
  # pmload.c32 loads a protected-mode image, builds a memory map, and invokes
  # the Syslinux protected-mode shuffle/boot routine.
  - id: pmload-boot-raw-export
    desc: Exports pmload raw-boot entry point
    if:
      type: symbol
      kind: export
      exact: boot_raw
  - id: syslinux-protected-mode-shuffle-api-import
    desc: Imports Syslinux protected-mode shuffle API
    if:
      type: symbol
      kind: import
      exact: syslinux_shuffle_boot_pm
  # elf.c32 loads an ELF kernel or payload into the Syslinux memory map and
  # transfers control through the protected-mode shuffle API.  The boot_elf
  # export and elf.c32 usage line are more specific than the shared APIs.
  - id: elf-boot-entry-export
    desc: Exports the Syslinux ELF boot entry
    if:
      type: symbol
      kind: export
      exact: boot_elf
  - id: elf-loader-usage-text
    desc: Syslinux elf.c32 loader usage text
    if:
      type: text
      exact: 'Usage: elf.c32 elf_file arguments...'
      section: rodata
  - id: elf-loadfile-api-import
    desc: Imports the Syslinux compressed file loader
    if:
      type: symbol
      kind: import
      exact: zloadfile
  - id: chain-shuffle-import
    desc: Imports Syslinux chain shuffle API
    if:
      type: symbol
      kind: import
      exact: syslinux_shuffle_boot_rm
  - id: prdhcp-pxelinux-guard-text
    desc: Syslinux PXELINUX-only execution guard text
    if:
      type: text
      substr: 'May only run in PXELINUX'
      section: rodata
composite_rules:
  - id: reboot-com32-module
    desc: Syslinux reboot COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: syslinux-reboot-api-import
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: gpxe-aware-com32-module
    desc: Syslinux COM32 module with gPXE detection
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: pxe-api-import
      - id: gpxecmd-gpxe-check-import
  - id: pxechn-com32-module
    desc: Syslinux PXE/DHCP COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: pxechn-entry-export
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: pxe-api-import
      - id: well-known/tool/sysadmin/syslinux/installer::loadfile-api-import
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/binary/header/program::elf-wx-segment
  - id: elf-com32-module
    desc: Syslinux ELF loader COM32 utility
    crit: notable
    conf: 1.0
    all:
      - id: well-known/tool/sysadmin/syslinux/com32-module::com32-runtime-dependency
      - id: elf-boot-entry-export
      - id: elf-loader-usage-text
      - id: elf-loadfile-api-import
      - id: well-known/tool/sysadmin/syslinux/hardware-probe::syslinux-memory-map-api-import
      - id: syslinux-protected-mode-shuffle-api-import
