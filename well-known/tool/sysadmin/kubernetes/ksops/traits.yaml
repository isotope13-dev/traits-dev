# KSOPS, the kustomize plugin that decrypts SOPS-encrypted secrets.
# Wolfi builds it as `command-line-arguments`, so no module path is
# recorded; its main-package type names are the product evidence.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: component
  conf: 0.9
  size_min: 1048576

traits:
  - id: main-ksops-type
    desc: Go main package type named ksops
    if:
      type: raw
      substr: '*main.ksops'
      section: rodata
  - id: main-secretfrom-type
    desc: Go main package type named secretFrom
    if:
      type: raw
      substr: '*main.secretFrom'
      section: rodata

composite_rules:
  - id: plugin-binary
    desc: KSOPS kustomize SOPS plugin binary
    crit: notable
    conf: 0.96
    all:
      - id: main-ksops-type
      - id: main-secretfrom-type
