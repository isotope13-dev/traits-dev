# Flux CD GitOps controllers.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  # Every Go binary of this product exceeds 1 MiB; the main-module path is
  # read from the embedded build info, not from a filename.
  size_min: 1048576

traits:
  - id: image-automation-controller-go-module
    desc: Flux image automation controller module
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/fluxcd/image-automation-controller
