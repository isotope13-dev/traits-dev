defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  size_max: 5000000
traits:
- id: kubernetes-windows-gce-script
  desc: Kubernetes GCE bootstrap script
  crit: notable
  conf: 0.95
  for:
  - powershell
  if:
    type: text
    regex: '(?i)kubernetes[\s\S]{0,300}(GCE|Google Compute Engine)'
- id: kubernetes-shell-tooling
  desc: Kubernetes bootstrap tool names
  crit: component
  conf: 0.95
  if:
    type: text
    regex: cri-dockerd|kubeadm|minikube
- id: kubernetes-shell-kubectl-marker
  desc: Kubernetes kubectl shell marker
  crit: component
  conf: 0.95
  if:
    type: text
    word: kubectl
- id: kubernetes-linux-node-bootstrap
  desc: Kubernetes Linux node bootstrap script
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'kubelet\s'
- id: kubernetes-deployment-script-basename
  desc: Kubernetes deployment helper script name
  crit: component
  conf: 0.9
  if:
    type: path
    regex: '(?i)(^|/)(k8s|preflight(_checks)?)\.sh$'
- id: kubectl-binary
  desc: Kubernetes kubectl executable
  crit: notable
  conf: 0.99
  for: [elf, macho, pe]
  size_max: 100000000
  if:
    type: basename
    regex: '^kubectl(\.exe)?$'
- id: kubectl-binary-build-marker
  desc: Kubernetes kubectl Go binary build marker
  crit: notable
  conf: 0.99
  for:
  - macho
  size_max: 100000000
  if:
    type: value
    path: macho.go.path
    exact: k8s.io/kubernetes/cmd/kubectl
- id: kubernetes-windows-gce-ssh-installer-name
  desc: Kubernetes GCE OpenSSH installer filename
  crit: component
  conf: 0.98
  for: [powershell]
  if:
    type: basename
    exact: install-ssh.psm1
- id: kubernetes-windows-gce-ssh-installer-marker
  desc: Kubernetes GCE OpenSSH release marker
  crit: component
  conf: 0.98
  for: [powershell]
  if:
    type: text
    substr: Win32-OpenSSH/releases/download
- id: kubernetes-windows-gce-common-module-name
  desc: Kubernetes Windows GCE common module filename
  crit: component
  conf: 0.98
  for: [powershell]
  if:
    type: basename
    exact: common.psm1
- id: kubernetes-windows-gce-common-module-marker
  desc: Kubernetes log rotation task marker
  crit: component
  conf: 0.98
  for: [powershell]
  if:
    type: text
    substr: Rotate Kubernetes logs
# Node-setup content markers. Keep product identity separate from a concrete
# node setting so a stray Kubernetes mention cannot suppress defense-degrade
# findings by itself.
- id: kubernetes-tooling-reference
  desc: Kubernetes tooling name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)kube(rnetes|let|adm|ctl)|\bk8s\b'
- id: kubernetes-node-setting-reference
  desc: Kubernetes node networking or manifest setting
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)bridge-nf-call-ip|/etc/kubernetes/(manifests|kubelet)'
- id: blueking-container-service-source
  desc: Blueking Container Service source marker
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: Blueking Container Service available
composite_rules:
# In a file that carries both Kubernetes identity and an actual node-network
# or static-pod setting, firewall/MAC changes are cluster provisioning.
- id: kubernetes-node-provisioning-context
  desc: Kubernetes cluster node provisioning script
  crit: exception
  conf: 0.95
  all:
  - id: kubernetes-node-setting-reference
  any:
  - id: kubernetes-tooling-reference
  - id: blueking-container-service-source
- id: kubernetes-windows-gce-ssh-installer-context
  desc: Kubernetes Windows GCE OpenSSH installer source
  crit: notable
  conf: 0.98
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-ssh-installer-name
  - id: kubernetes-windows-gce-ssh-installer-marker
- id: kubernetes-windows-gce-ssh-installer-exception
  # GCE Windows test clusters download Win32-OpenSSH and run its install
  # scripts with -ExecutionPolicy Bypass; that is bootstrap, not a dropper.
  desc: Kubernetes Windows GCE OpenSSH test installer context
  crit: exception
  conf: 0.99
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-ssh-installer-context
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
- id: kubernetes-windows-gce-test-defender-exception
  # Kubernetes disables Defender only on explicitly marked GCE test nodes.
  # Keep the exception narrower than the Kubernetes product identity so a
  # future unguarded Defender change remains visible.
  desc: Kubernetes GCE test-node Defender configuration
  crit: exception
  conf: 0.99
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-script
  - id: micro-behaviors/os/security/defender::test-cluster-guarded-preference-change
- id: kubernetes-windows-gce-common-module-context
  desc: Kubernetes Windows GCE common module source
  crit: notable
  conf: 0.98
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-common-module-name
  - id: kubernetes-windows-gce-common-module-marker
- id: kubernetes-bootstrap-context
  desc: Kubernetes bootstrap context
  crit: baseline
  conf: 0.9
  for:
  - shell
  - powershell
  any:
  - id: kubernetes-windows-gce-script
  - id: kubernetes-shell-bootstrap
  - id: kubernetes-windows-gce-ssh-installer-context
  - id: kubernetes-windows-gce-common-module-context
  - id: kubernetes-linux-node-bootstrap
- id: kubernetes-shell-bootstrap
  desc: Kubernetes bootstrap shell context
  crit: notable
  conf: 0.95
  all:
  - id: well-known/tool/sysadmin/kubernetes/source::kubernetes-authors-shell
  any:
  - id: kubernetes-shell-tooling
  - id: kubernetes-shell-kubectl-marker
