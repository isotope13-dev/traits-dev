defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  size_max: 5000000
traits:
- id: kubectl-completion-manual
  desc: kubectl shell completion manual
  crit: notable
  for: [powershell]
  size_min: 6271
  size_max: 6271
  if:
    type: yara
    source: |
      import "hash"

      rule kubectl_completion_manual {
        condition:
          // Decompressed manual from the signed Arch kubectl 1.36.2-1.
          hash.sha256(0, filesize) ==
            "ea16947c04b6bc76c0c15513011bd45136d790754b0ac72e6cbc122389bb2cf4"
      }
- id: kubernetes-windows-gce-script
  desc: Kubernetes GCE bootstrap script
  crit: notable
  conf: 0.95
  for:
  - powershell
  if:
    type: text
    regex: '(?i)kubernetes[\s\S]{0,300}(GCE|Google Compute Engine)'
- id: kubernetes-shell-tooling
  desc: Kubernetes bootstrap tool names
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: cri-dockerd|kubeadm|minikube
- id: kubernetes-deployment-script-basename
  desc: Kubernetes deployment helper script name
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: '(?i)(^|/)(k8s|preflight(_checks)?)\.sh$'
- id: kubernetes-bootstrap-directory-path
  desc: Kubernetes bootstrap directory path
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: '(?i)(^|\W)k8s[\w.-]*[/\\]'
- id: kubectl-binary
  desc: Kubernetes kubectl executable
  crit: notable
  conf: 0.99
  for: [elf, macho, pe]
  size_max: 100000000
  if:
    type: basename
    regex: '^kubectl(\.exe)?$'
- id: kubectl-binary-build-marker
  desc: Kubernetes kubectl Go binary build marker
  crit: notable
  conf: 0.99
  for:
  - macho
  size_max: 100000000
  if:
    type: value
    path: macho.go.path
    exact: k8s.io/kubernetes/cmd/kubectl
- id: kubernetes-windows-gce-ssh-installer-name
  desc: Kubernetes GCE OpenSSH installer filename
  crit: notable
  conf: 0.98
  for: [powershell]
  if:
    type: basename
    exact: install-ssh.psm1
- id: kubernetes-windows-gce-ssh-installer-marker
  desc: Kubernetes GCE OpenSSH release marker
  crit: notable
  conf: 0.98
  for: [powershell]
  if:
    type: text
    substr: Win32-OpenSSH/releases/download
- id: kubernetes-windows-gce-common-module-name
  desc: Kubernetes Windows GCE common module filename
  crit: component
  conf: 0.98
  for: [powershell]
  if:
    type: basename
    exact: common.psm1
- id: kubernetes-windows-gce-common-module-marker
  desc: Kubernetes log rotation task marker
  crit: notable
  conf: 0.98
  for: [powershell]
  if:
    type: text
    substr: Rotate Kubernetes logs
# Node-setup content markers. Keep product identity separate from a concrete
# node setting so a stray Kubernetes mention cannot suppress defense-degrade
# findings by itself.
- id: kubernetes-node-setting-reference
  desc: Kubernetes node networking or manifest setting
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)bridge-nf-call|kubelet-cgroups|/etc/(kubernetes|rancher/rke2|yum\.repos\.d/kuber)'
- id: blueking-container-service-source
  desc: Blueking Container Service source marker
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: Blueking Container Service available
- id: openshift-cluster-bootstrap-script
  desc: OpenShift cluster bootstrap script
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?is)(openshift[\s\S]{0,80}cluster\s+up\b|\bcluster-openshift\b)'
- id: openshift-cluster-script-basename
  desc: OpenShift cluster management script name
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: '(?i)(^|/)cluster-openshift\.sh$'
- id: kurl-selinux-preflight-text
  desc: Preflight says Kubernetes conflicts with SELinux
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Kubernetes is incompatible with SELinux
- id: kurl-ufw-preflight-text
  desc: Installer prompt offers to disable active UFW
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: UFW is active, please press Y to disable
composite_rules:
# In a file that carries both Kubernetes identity and an actual node-network
# or static-pod setting, firewall/MAC changes are cluster provisioning.
- id: kubernetes-node-provisioning-context
  desc: Kubernetes cluster node provisioning script
  crit: exception
  conf: 0.95
  any:
  - id: openshift-cluster-bootstrap-script
  - id: openshift-cluster-script-basename
  - id: kubernetes-standard-node-provisioning
- id: kubernetes-standard-node-provisioning
  desc: Kubernetes standard node provisioning script
  crit: exception
  conf: 0.95
  all:
  - id: kubernetes-node-setting-reference
  any:
  - id: micro-behaviors/os/container/runtime::kubernetes-tooling-reference
  - id: blueking-container-service-source
- id: kurl-selinux-preflight-context
  desc: kURL preflight disables SELinux for Kubernetes nodes
  crit: exception
  conf: 0.95
  all:
  - id: kurl-selinux-preflight-text
  - id: micro-behaviors/os/container/runtime::kubernetes-tooling-reference
- id: kurl-ufw-preflight-context
  desc: kURL preflight disables UFW for Kubernetes nodes
  crit: exception
  conf: 0.95
  all:
  - id: kurl-ufw-preflight-text
  - id: micro-behaviors/os/container/runtime::kubernetes-tooling-reference
- id: kubernetes-windows-gce-ssh-installer-context
  desc: Kubernetes Windows GCE OpenSSH installer source
  crit: notable
  conf: 0.98
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-ssh-installer-name
  - id: kubernetes-windows-gce-ssh-installer-marker
- id: kubernetes-windows-gce-ssh-installer-exception
  # GCE Windows test clusters download Win32-OpenSSH and run its install
  # scripts with -ExecutionPolicy Bypass; that is bootstrap, not a dropper.
  desc: Kubernetes Windows GCE OpenSSH test installer context
  crit: exception
  conf: 0.99
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-ssh-installer-context
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
- id: kubernetes-windows-gce-test-defender-exception
  # Kubernetes disables Defender only on explicitly marked GCE test nodes.
  # Keep the exception narrower than the Kubernetes product identity so a
  # future unguarded Defender change remains visible.
  desc: Kubernetes GCE test-node Defender configuration
  crit: exception
  conf: 0.99
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-script
  - id: micro-behaviors/os/security/defender/policy::test-cluster-guarded-preference-change
- id: kubernetes-windows-gce-common-module-context
  desc: Kubernetes Windows GCE common module source
  crit: notable
  conf: 0.98
  for: [powershell]
  all:
  - id: kubernetes-windows-gce-common-module-name
  - id: kubernetes-windows-gce-common-module-marker
- id: kubernetes-bootstrap-context
  desc: Kubernetes bootstrap context
  crit: notable
  conf: 0.9
  for:
  - shell
  - powershell
  any:
  - id: kubernetes-windows-gce-script
  - id: kubernetes-shell-bootstrap
  - id: kubernetes-windows-gce-ssh-installer-context
  - id: kubernetes-windows-gce-common-module-context
- id: kubernetes-shell-bootstrap
  desc: Kubernetes bootstrap shell context
  crit: notable
  conf: 0.95
  all:
  - id: well-known/tool/sysadmin/kubernetes/source::kubernetes-authors-shell
  any:
  - id: kubernetes-shell-tooling
  - id: micro-behaviors/os/container/orchestration::kubectl-command-reference
- id: kubernetes-kubeconfig-provisioning-context
  desc: Kubernetes kubeconfig configuration context
  crit: exception
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/credential/container::kube-config
  - id: micro-behaviors/data/decode/command::base64-decode-to-file
  any:
  - id: micro-behaviors/os/container/orchestration::kubectl-command-reference
  - id: micro-behaviors/os/container/runtime::kubernetes-tooling-reference
