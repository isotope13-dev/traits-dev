defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - javascript
  - typescript
  - json
  - github-actions
  size_max: 5000000
traits:
- id: kubernetes-iac-path
  desc: Kubernetes IaC directory path
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: "(^|/)(k8s|kubernetes|argocd)(/|$)"
    case_insensitive: true
# Google Kubernetes Config Connector IAM resources: a manifest that declares
# one of these kinds asks KCC's service account to mutate GCP IAM on the
# submitter's behalf. KCC accepts YAML and JSON serializations and is
# commonly applied from shell heredocs, so these match the mapping shape
# rather than line layout.
- id: kcc-iam-kind
  desc: Config Connector IAM resource kind
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '["'']?kind["'']?\s*:\s*["'']?IAM(PolicyMember|PartialPolicy|Policy)\b'
- id: kcc-cnrm-apiversion
  desc: Config Connector API version
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: cnrm.cloud.google.com
- id: kcc-organization-scope-ref
  desc: Config Connector organization scope reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?s)resourceRef.{0,400}?["'']?kind["'']?\s*:\s*["'']?Organization\b'
- id: kcc-folder-scope-ref
  desc: Config Connector folder scope reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?s)resourceRef.{0,400}?["'']?kind["'']?\s*:\s*["'']?Folder\b'
composite_rules:
- id: kubernetes-iac-context
  desc: Kubernetes IaC manifest context
  crit: exception
  conf: 0.92
  all:
  - id: kubernetes-iac-path
  any:
  - id: micro-behaviors/os/container/runtime::kubernetes-manifest-apiversion
  - id: micro-behaviors/os/container/runtime::kubernetes-manifest-kind
  - id: micro-behaviors/os/container/runtime::kubernetes-pod-serviceaccount-field
  - id: micro-behaviors/os/container/runtime::kubernetes-volume-mounts-field
  - id: micro-behaviors/os/container/runtime::kubernetes-secretref-field
  - id: micro-behaviors/os/container/runtime::kubernetes-configmap-field
  needs: 2
