defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - javascript
  - typescript
  - json
  - github-actions
  size_max: 5000000
traits:
- id: kubernetes-iac-path
  desc: Kubernetes IaC directory path
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: "(^|/)(k8s|kubernetes|argocd)(/|$)"
    case_insensitive: true
# A bare `apiVersion` key is not Kubernetes-specific — WordPress Gutenberg
# block.json ("apiVersion": 2), Azure ARM (date strings), CloudFormation, and
# others all use it. Require the VALUE to be a k8s group/version token
# (`apps/v1`, `networking.k8s.io/v1beta1`) so an integer or date does
# not match. A bare `v1`/`v2` also fails the bar: a Lark docs client's
# `apiVersion: "v2"` negotiation is not a Kubernetes manifest. Real manifests
# with a bare `apiVersion: v1` still match kubernetes-manifest-kind; the
# composite still needs 2 legs.
- id: kubernetes-manifest-apiversion
  desc: Kubernetes apiVersion group/version value
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'apiVersion["'']?\s*:\s*["'']?[a-z0-9][a-z0-9.-]*/v[0-9]+'
- id: kubernetes-manifest-kind
  desc: Kubernetes kind field near apiVersion
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?s)\b(apiVersion.{0,200}kind|kind.{0,200}apiVersion)\b'
- id: kubernetes-pod-serviceaccount-field
  desc: Kubernetes service account field
  crit: notable
  conf: 0.88
  if:
    type: text
    word: serviceAccountName
- id: kubernetes-volume-mounts-field
  desc: Kubernetes volume mounts field
  crit: notable
  conf: 0.86
  if:
    type: text
    word: volumeMounts
- id: kubernetes-secretref-field
  desc: Kubernetes secret reference field
  crit: notable
  conf: 0.86
  if:
    type: text
    word: secretRef
- id: kubernetes-configmap-field
  desc: Kubernetes config map field
  crit: notable
  conf: 0.84
  if:
    type: text
    word: configMap
# Google Kubernetes Config Connector IAM resources: a manifest that declares
# one of these kinds asks KCC's service account to mutate GCP IAM on the
# submitter's behalf. KCC accepts YAML and JSON serializations and is
# commonly applied from shell heredocs, so these match the mapping shape
# rather than line layout.
- id: kcc-iam-kind
  desc: Config Connector IAM resource kind
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '["'']?kind["'']?\s*:\s*["'']?IAM(PolicyMember|PartialPolicy|Policy)\b'
- id: kcc-cnrm-apiversion
  desc: Config Connector API version
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: cnrm.cloud.google.com
- id: kcc-organization-scope-ref
  desc: Config Connector organization scope reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?s)resourceRef.{0,400}?["'']?kind["'']?\s*:\s*["'']?Organization\b'
- id: kcc-folder-scope-ref
  desc: Config Connector folder scope reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?s)resourceRef.{0,400}?["'']?kind["'']?\s*:\s*["'']?Folder\b'
composite_rules:
- id: kubernetes-iac-context
  desc: Kubernetes IaC manifest context
  crit: exception
  conf: 0.92
  all:
  - id: kubernetes-iac-path
  any:
  - id: kubernetes-manifest-apiversion
  - id: kubernetes-manifest-kind
  - id: kubernetes-pod-serviceaccount-field
  - id: kubernetes-volume-mounts-field
  - id: kubernetes-secretref-field
  - id: kubernetes-configmap-field
  needs: 2
