defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 10000000
  size_max: 100000000

traits:
  - id: h2offt-flash-rom-export
    desc: Insyde H2OFFT exports FlashROM
    if:
      type: export
      exact: FlashROM

  - id: h2offt-read-bios-region-export
    desc: Insyde H2OFFT exports ReadBiosRegionBuffer
    if:
      type: export
      exact: ReadBiosRegionBuffer

  - id: insyde-library-rpath
    desc: ELF RPATH points to Insyde's library directory
    if:
      type: value
      path: elf.rpath
      exact: /usr/local/insyde/Library/lib

composite_rules:
  - id: insyde-h2offt-bios-flasher
    desc: Insyde H2OFFT BIOS firmware flasher
    all:
      - id: h2offt-flash-rom-export
      - id: h2offt-read-bios-region-export
      - id: insyde-library-rpath
