# GCE rescue automation creates a temporary Windows admin account so the
# operator can RDP into their own rescue VM and repair the attached disk.
# The account is documented as temporary in the script itself
# ("Temporary rescue mode admin account", credentials "deleted when you
# restore the VM") and the orchestrator destroys the rescue VM on restore,
# so this is consented recovery automation, not a backdoor. Keep the
# exception narrower than the vendor identity so a GCE-named script without
# the temporary-account language keeps its findings.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: gce-rescue-script-context
    desc: GCE rescue automation script markers
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(GCE[- ]Rescue Mode|rescue_admin)'
  - id: temporary-rescue-admin-language
    desc: Temporary rescue admin account language
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)(temporary.{0,60}admin account|deleted when you restore)'

composite_rules:
  - id: gce-rescue-temporary-admin-context
    desc: GCE rescue temporary admin account context
    crit: exception
    conf: 0.98
    scope: file
    all:
      - id: gce-rescue-script-context
      - id: temporary-rescue-admin-language
