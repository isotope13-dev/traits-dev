# dracut and initramfs-tools assemble the early root before the real one
# exists: they zero and re-create overlay devices, write to whatever block
# device the kernel command line names, and mount things into /dev. Every OS
# install image in the corpus ships a few dozen of these hooks, and destructive
# storage rules read them as wipes because at that stage the operations are
# genuinely destructive -- by design, on a device the operator chose.
defaults:
  platforms: [unix]
  for: [shell, scripts]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 10000000

traits:
  - id: dracut-library-source
    desc: Script sources the dracut shell library
    if:
      type: text
      substr: dracut-lib.sh

  - id: dracut-hook-directory-path
    desc: File under a dracut hook directory
    if:
      type: path
      regex: 'dracut/hooks/'

  - id: initramfs-tools-scripts-path
    desc: File under initramfs-tools scripts
    if:
      type: path
      regex: 'initramfs-tools/scripts'

  - id: dmsquash-live-root-basename
    desc: dracut dmsquash live-root hook
    for: [shell]
    if:
      type: path
      basename: true
      regex: '^dmsquash-live-(root|genmedium)$'
