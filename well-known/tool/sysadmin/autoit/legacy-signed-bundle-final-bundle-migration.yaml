---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: signed-autoit-multipe-network-autorun-profile
  desc: Signed AutoIt multi-PE bundle with network and autorun clues
  crit: suspicious
  conf: 0.997
  size_min: 1000000
  size_max: 2500000
  all:
  - id: metadata/signed/unknown::autoit-consulting-ltd
  - id: metadata/lang/compiled::autoit-syntax-checker-runtime
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
  any:
  - id: well-known/app/system/adobe-acrobat-updater::adobe-acrobat-updater-text
  - id: well-known/app/system/windows-error-reporting::windows-error-reporter-manifest-reference
  - id: micro-behaviors/fs/path/application/executable::dw20-filename-reference
  - id: micro-behaviors/ui/window/hook::set-windows-hook-text
  - id: metadata/file/profile/memory/operation-reference::bounded-remote-thread-api-reference
  - id: micro-behaviors/communications/http/client/service::microsoft-watson-error-reporting-endpoint
  needs: 4
