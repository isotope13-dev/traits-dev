# AutoIt — legitimate Windows scripting and UI-automation product, and its
# redistributable ActiveX/DLL control AutoItX3.dll.
#
# AutoItX is the automation surface AutoIt exposes to other languages, so it is
# the component third-party wrappers vendor: RAutomation (Ruby), PyAutoIt
# (Python) and the old Selenium Ruby gem all ship a copy for driving native
# Windows dialogs. Its exports are exactly the Win32 input, clipboard, screen
# and remote-process APIs the surveillance and injection composites look for --
# because sending keystrokes, reading the clipboard and reaching into another
# process's windows *is* what a UI-automation control does.
#
# AutoIt is also genuinely abused (see well-known/malware/trojan/elex/), so this
# identity is deliberately narrow: the signed vendor strings of the official
# redistributable, not the word "AutoIt".
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 500000000

traits:
  - id: autoit-team-vendor
    desc: AutoIt Team PE vendor string
    if:
      type: value
      path: pe.version.company
      exact: AutoIt Team

  - id: autoitx-activex-product
    desc: AutoItX ActiveX control product name
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^AutoIt v3 ActiveX Control$'

  - id: autoitx-original-filename
    desc: AutoItX3 redistributable original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^AutoItX3(_x64)?\.dll$'

  - id: autoit-vendor-site-comment
    desc: AutoIt vendor site in PE comments
    if:
      type: value
      path: pe.version.comments
      substr: autoitscript.com

composite_rules:
  # Two independent version-resource fields, so a lone borrowed string does not
  # buy a malware sample the exemption.
  - id: autoitx-official-control
    desc: Official AutoItX3 automation control
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: autoit-team-vendor
      - id: autoitx-activex-product
      - id: autoitx-original-filename
      - id: autoit-vendor-site-comment
