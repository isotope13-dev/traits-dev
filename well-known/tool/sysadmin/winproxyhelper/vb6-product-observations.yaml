defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: peterson-winproxyhelper-name
    desc: WinProxyHelper application name
    if:
      type: text
      exact: win_proxy_helper
      section: .text

composite_rules:
  - id: peterson-winproxyhelper
    desc: VB MVPs and WinProxyHelper identity clues
    crit: notable
    conf: 0.99
    all:
      - id: metadata/vendor/string::vb-mvps-site-resource-text
      - id: well-known/tool/sysadmin/winproxyhelper::peterson-winproxyhelper-name
