defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: pspy-ref
  size_min: 512
  size_max: 500000000
  desc: pspy process snooping tool
  crit: notable
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  - shell
  if:
    type: text
    substr: dominicbreuker/pspy
    section: ".text"

composite_rules:
- id: pspy-functions
  all:
  - id: well-known/tool/sysadmin/pspy::pspy-ref
  size_min: 512
  size_max: 500000000
  desc: pspy helper-name fingerprint
  crit: notable
  conf: 0.8
  needs: 2
  any:
  - id: metadata/binary/symbols/name/function::start-fsw-name
  - id: metadata/binary/symbols/name/function::start-pss-name
  - id: metadata/binary/symbols/name/function::trigger-every-name
