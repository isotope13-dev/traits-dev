# pyppd is an open-source CUPS printer-driver helper. It embeds a compressed
# PPD database and exposes the standard driver `list`/`cat URI` interface.
defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: driver-cli-interface
    desc: pyppd printer-driver CLI interface
    if:
      type: text
      substr: 'usage: %prog list'

  - id: driver-cat-interface
    desc: pyppd PPD retrieval command interface
    if:
      type: text
      substr: '%prog cat URI'

  - id: ppd-archive-marker
    desc: pyppd embedded PPD archive marker
    if:
      type: text
      substr: PPDs Archive

  - id: author-marker
    desc: pyppd author marker
    if:
      type: text
      substr: Copyright (c) 2013 Vitor Baptista.

composite_rules:
  - id: compressed-ppd-driver
    desc: pyppd compressed CUPS PPD driver
    crit: notable
    conf: 0.99
    all:
      - id: driver-cli-interface
      - id: driver-cat-interface
      - id: ppd-archive-marker
      - id: author-marker
