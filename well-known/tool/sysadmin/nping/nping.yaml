# Nping's own target-validation diagnostic; a command that invokes the tool
# belongs with packet construction rather than the executable's identity.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  crit: notable
  conf: 0.99
traits:
  - id: nping
    desc: Nping packet generator executable
    ref: https://github.com/nmap/nmap/blob/master/nping/nping.cc
    if:
      type: text
      substr: 'Execution aborted. Nping needs at least one valid target to operate.'
