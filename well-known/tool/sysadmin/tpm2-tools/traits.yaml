defaults:
  platforms: [linux]
  for: [elf, rpm]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: tpm2-tools package identity
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: tpm2-tools

  - id: native-package-note
    desc: tpm2-tools native package identity
    for: [elf]
    size_min: 65536
    size_max: 2000000
    if:
      type: text
      substr: '"name":"tpm2-tools"'
      section: .rodata
