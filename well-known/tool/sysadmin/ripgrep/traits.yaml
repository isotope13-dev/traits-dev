defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1024
  size_max: 10485760

traits:
  - id: repository-marker
    desc: ripgrep GitHub repository marker
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    platforms: [windows, unix]
    if:
      type: text
      substr: BurntSushi/ripgrep
  - id: ripgrep-project-homepage
    desc: ripgrep project homepage
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "42 75 72 6e 74 53 75 73 68 69 2f 72 69 70 67 72 65 70"
      section: .rdata
  - id: ripgrep-source-path
    desc: ripgrep source path marker
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "44 3a 5c 61 5c 72 69 70 67 72 65 70 5c 72 69 70 67 72 65 70 5c 63 72 61 74 65 73"
      section: .rdata
  - id: vscode-ripgrep-package-path
    desc: VS Code ripgrep unscoped npm package path
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript, typescript, json]
    if:
      type: path
      # npm pack / atomscan names: vscode-ripgrep@1.13.2/...
      regex: '(?i)vscode-ripgrep@'

  - id: vscode-scoped-ripgrep-package-path
    desc: VS Code scoped ripgrep npm package path
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript, typescript, json]
    if:
      type: path
      regex: '(?i)@vscode/ripgrep'

  - id: vscode-ripgrep-github-repo
    desc: Microsoft vscode-ripgrep GitHub repository
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript, typescript, json, markdown]
    if:
      type: text
      substr: github.com/microsoft/vscode-ripgrep

  - id: ripgrep-prebuilt-github-repo
    desc: Microsoft ripgrep-prebuilt release repository
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: text
      substr: microsoft/ripgrep-prebuilt

composite_rules:
  - id: ripgrep-tool
    desc: ripgrep search utility
    crit: notable
    conf: 0.95
    any:
      - id: ripgrep-project-homepage
      - id: ripgrep-source-path

  - id: vscode-ripgrep-package-identity
    desc: VS Code ripgrep npm package identity
    crit: notable
    conf: 0.99
    platforms: [unix, windows]
    for: [javascript, typescript, json]
    any:
      - id: vscode-ripgrep-package-path
      - id: vscode-scoped-ripgrep-package-path

  - id: vscode-ripgrep-native-bootstrap-context
    desc: Official VS Code ripgrep postinstall binary bootstrap
    crit: exception
    conf: 0.99
    platforms: [unix, windows]
    for: [javascript, typescript]
    all:
      - id: vscode-ripgrep-package-identity
    any:
      - id: vscode-ripgrep-github-repo
      - id: ripgrep-prebuilt-github-repo
      - id: repository-marker
