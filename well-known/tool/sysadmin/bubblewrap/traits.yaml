defaults:
  platforms:
    - linux
  for: [elf]
  crit: notable
  conf: 0.95
  size_max: 10000000

traits:
  - id: bubblewrap-binary-basename
    desc: Bubblewrap executable basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      exact: bwrap

  - id: bubblewrap-userns-error-string
    desc: Bubblewrap user namespace error string
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rodata
      substr: 'Creating new namespace failed, likely because the kernel does not support user namespaces'

  - id: bubblewrap-unshare-option
    desc: Bubblewrap unshare command line parameter
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rodata
      substr: '--unshare-user'

composite_rules:
  - id: bubblewrap-sandbox-binary
    desc: Bubblewrap unprivileged sandboxing utility
    crit: exception
    conf: 0.98
    all:
      - id: bubblewrap-binary-basename
      - id: bubblewrap-unshare-option
    any:
      - id: bubblewrap-userns-error-string
