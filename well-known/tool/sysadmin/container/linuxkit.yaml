# LinuxKit's nsenter1 is a static helper whose only job is setns into the
# target namespaces. The rodata labels name that program.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 16384
  size_max: 262144

traits:
  - id: linuxkit-nsenter1-binary
    desc: LinuxKit nsenter1 namespace helper
    if:
      type: hex
      section: .rodata
      pattern: "73 65 74 6E 73 3A 6D 6E 74"
