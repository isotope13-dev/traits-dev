# Pelagos is an OCI-compatible Linux container runtime.  Namespace, cgroup,
# seccomp, networking, image, and process operations are its expected runtime
# behavior, so the product identity is kept separate from hostile objectives.
defaults:
  platforms: [unix]
  for: [cargo.toml, rust, shell, markdown, text, archives]
  crit: notable
  conf: 0.99

traits:
  - id: pelagos-package-name
    desc: Pelagos Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: pelagos

  - id: pelagos-repository
    desc: Pelagos upstream repository
    for: [cargo.toml]
    if:
      type: value
      path: package.repository
      exact: https://github.com/pelagos-containers/pelagos

  - id: pelagos-runtime-description
    desc: Pelagos OCI container runtime description
    for: [cargo.toml, markdown, text]
    if:
      type: text
      regex: 'Fast Linux container runtime|OCI-compatible.{0,40}container runtime'

  - id: pelagos-network-diagnostics-script
    desc: Pelagos network diagnostics script
    for: [shell]
    if:
      type: basename
      exact: dump-net-diag.sh

  - id: pelagos-network-diagnostics-banner
    desc: Pelagos network diagnostics report banner
    for: [shell]
    if:
      type: text
      substr: 'Network diagnostics dump for pelagos connectivity debugging'

composite_rules:
  - id: pelagos-package-identity
    desc: Recognized Pelagos OCI container runtime
    crit: notable
    conf: 0.99
    for: [cargo.toml]
    scope: archive
    all:
      - id: pelagos-package-name
      - id: pelagos-repository

  - id: pelagos-network-diagnostics-context
    desc: Recognized Pelagos network diagnostics context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: pelagos-network-diagnostics-script
      - id: pelagos-network-diagnostics-banner
