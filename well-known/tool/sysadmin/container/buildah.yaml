# Buildah, the OCI image builder. Its main module moved from
# github.com/containers/buildah to go.podman.io/buildah in 2025.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  # Every Go binary of this product exceeds 1 MiB; the main-module path is
  # read from the embedded build info, not from a filename.
  size_min: 1048576

traits:
  - id: buildah-go-module
    desc: Buildah Go main module
    if:
      type: value
      path: elf.go.module.path
      regex: '^(github\.com/containers|go\.podman\.io)/buildah$'
