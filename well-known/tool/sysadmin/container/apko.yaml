# apko, Chainguard's declarative OCI image builder.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  # Every Go binary of this product exceeds 1 MiB; the main-module path is
  # read from the embedded build info, not from a filename.
  size_min: 1048576

traits:
  - id: apko-go-module
    desc: apko Go main module
    if:
      type: value
      path: elf.go.module.path
      exact: chainguard.dev/apko
