# CRIU (Checkpoint/Restore In Userspace) dumps and restores whole process
# trees, so it walks /proc/<pid>/exe, recognises memfd-backed images and
# signals tasks as routine work. Its protobuf RPC request enum is unique.
defaults:
  crit: notable
  conf: 0.99
  platforms: [linux]
  for: [elf]
  size_min: 65536
  size_max: 67108864

traits:
  - id: criu-rpc-dump-request-type
    desc: CRIU RPC dump request enum
    if:
      type: text
      substr: CRIU_REQ_TYPE__PRE_DUMP
      section: rodata

  - id: criu-rpc-restore-request-type
    desc: CRIU RPC restore request enum
    if:
      type: text
      substr: CRIU_REQ_TYPE__RESTORE
      section: rodata

composite_rules:
  - id: criu-checkpoint-restore-binary
    desc: CRIU checkpoint/restore binary
    all:
      - id: criu-rpc-dump-request-type
      - id: criu-rpc-restore-request-type
