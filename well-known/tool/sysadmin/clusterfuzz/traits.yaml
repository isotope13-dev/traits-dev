defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.99

traits:
  - id: product-name
    desc: ClusterFuzz product name
    if:
      type: text
      word: clusterfuzz
      case_insensitive: true

composite_rules:
  - id: gce-windows-provisioner
    desc: ClusterFuzz GCE Windows provisioner
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: micro-behaviors/communications/http/services/cloud::gcp-metadata-endpoint-reference
