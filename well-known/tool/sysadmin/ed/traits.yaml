defaults:
  platforms: [linux]
  for: [elf, rpm]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: GNU ed package identity
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: ed

  - id: gnu-ed-description
    desc: GNU ed line-editor identity
    for: [elf]
    size_min: 32768
    size_max: 200000
    if:
      type: text
      substr: GNU ed is a line-oriented text editor.
      section: .rodata
