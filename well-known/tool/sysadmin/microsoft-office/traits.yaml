defaults:
  platforms:
  - windows
  for:
  - vbs
traits:
- id: olicense-cleanup-basename
  desc: OLicenseCleanup script basename
  crit: notable
  conf: 0.99
  if:
    type: basename
    exact: OLicenseCleanup.vbs
- id: olicense-cleanup-microsoft-header
  desc: Microsoft Office license-cleanup script header
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?is)Author:\s*Microsoft Customer Support Services.{0,180}Software Protection
      Platform
- id: offscrub-microsoft-header
  desc: OffScrub Microsoft support-services header
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?is)OffScrub\w{0,12}\.vbs.{0,99}Microsoft Customer Support Services
- id: offscrub-scriptfile-constant
  desc: OffScrub SCRIPTFILE constant declaration
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?i)Const\s+SCRIPTFILE\s{0,8}=\s{0,4}"OffScrub
- id: unpatches-script-basename
  desc: Office unPatches script basename
  crit: notable
  conf: 0.99
  if:
    type: basename
    regex: (?i)^unPatches[0-9]{4}\.vbs$
- id: office-product-guid-suffix
  desc: Office product GUID FF1CE suffix constant
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?i)Const\s+OFFICEID\s*=\s*"[0-9A-F]*000000FF1CE\}"
- id: office-c2r-installer-title
  desc: Office Click-to-Run multi-version title
  crit: notable
  conf: 0.98
  for:
  - pe
  size_min: 262144
  size_max: 134217728
  if:
    type: text
    regex: Office 20[0-9]{2}-20[0-9]{2} C2R Install
    section: .data
composite_rules:
- id: office-c2r-kms-activation-context
  desc: Office Click-to-Run installer with a local KMS emulator
  crit: exception
  conf: 0.99
  for:
  - pe
  scope: outer
  all:
  - id: office-c2r-installer-title
  - id: well-known/dual-use/access-control/kms-emulator::kms-emulation-registry-value-name
  - id: well-known/dual-use/access-control/kms-emulator::spp-ext-com-object-name
- id: office-license-cleanup-script
  desc: Microsoft Office license-removal utility
  crit: notable
  conf: 0.99
  all:
  - id: olicense-cleanup-basename
  - id: olicense-cleanup-microsoft-header
- id: office-license-cleanup-benign-context
  desc: Recognized Microsoft Office license-cleanup context
  crit: exception
  conf: 0.99
  all:
  - id: office-license-cleanup-script
  - id: olicense-cleanup-microsoft-header
- id: offscrub-removal-script
  desc: Microsoft Office OffScrub removal utility
  crit: notable
  conf: 0.99
  all:
  - id: offscrub-microsoft-header
  - id: offscrub-scriptfile-constant
- id: offscrub-removal-benign-context
  desc: Recognized Microsoft OffScrub removal context
  crit: exception
  conf: 0.99
  all:
  - id: offscrub-removal-script
  - id: offscrub-scriptfile-constant
- id: office-unpatches-script
  desc: Microsoft Office unPatches registry cleanup utility
  crit: notable
  conf: 0.99
  all:
  - id: unpatches-script-basename
  - id: office-product-guid-suffix
  - id: micro-behaviors/os/registry/keys::installer-products-patches-path-text-reference
- id: office-unpatches-benign-context
  desc: Recognized Office unPatches Installer cleanup context
  crit: exception
  conf: 0.99
  all:
  - id: office-unpatches-script
  - id: office-product-guid-suffix
