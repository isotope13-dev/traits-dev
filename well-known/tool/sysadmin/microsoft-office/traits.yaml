# Microsoft Office license-removal utility identity.
# The identity requires the script basename and its own Microsoft header; a
# lone mention of Office or Software Protection Platform is not sufficient.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: olicense-cleanup-basename
    desc: OLicenseCleanup script basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: OLicenseCleanup.vbs

  - id: olicense-cleanup-microsoft-header
    desc: Microsoft Office license-cleanup script header
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)Author:\s*Microsoft Customer Support Services.{0,180}Software Protection Platform'

  # OffScrub03/07/10/c2r/_O15msi/_O16msi -- the Microsoft Customer Support
  # Services "scrub" scripts that force-remove an Office installation when the
  # supported uninstall path is broken. They are shipped inside SaRA and pasted
  # into countless deployment packages, and their job makes them look like a
  # toolkit: hidden cscript relaunch under `runas`, WMI process/disk sweeps,
  # scheduled-task round trips, Run-key and Startup-shortcut deletion. Both
  # markers are the script's own self-declaration, so neither a product mention
  # nor a copied header alone establishes the identity.
  - id: offscrub-microsoft-header
    desc: OffScrub Microsoft support-services header
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)OffScrub\w{0,12}\.vbs.{0,99}Microsoft Customer Support Services'

  - id: offscrub-scriptfile-constant
    desc: OffScrub SCRIPTFILE constant declaration
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)Const\s+SCRIPTFILE\s{0,8}=\s{0,4}"OffScrub'

  # unPatches20xx.vbs — Office deployment helper that strips Installer patch
  # records for a given MSI (Office GUID suffix FF1CE + major version gate)
  # before a slipstreamed reinstall. Registry DeleteKey/SetStringValue against
  # Installer\UserData\...\Patches is its whole job.
  - id: unpatches-script-basename
    desc: Office unPatches script basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^unPatches[0-9]{4}\.vbs$'

  - id: office-product-guid-suffix
    desc: Office product GUID FF1CE suffix constant
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)Const\s+OFFICEID\s*=\s*"[0-9A-F]*000000FF1CE\}"'

  - id: unpatches-installer-patches-path
    desc: Installer Products Patches registry path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Installer\\Products\\.{0,80}\\Patches'

  # Office patch custom actions repair the Windows Installer patch registry
  # and materialize a missing MSP from a cabinet.  These markers describe
  # that repair workflow, rather than merely mentioning Office in prose.
  - id: office-mui-patch-list
    desc: Office MUI patch identifier list
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(lync|onenote|outlook|osetup)_kb[0-9]{7}\b'

  - id: windows-installer-session-database
    desc: Windows Installer custom action session database
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bSession\.(Database|Property)\s*(=|\()'

  - id: windows-installer-patch-property
    desc: Windows Installer patch property enumeration
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bPatch\._\b'

  - id: windows-installer-userdata-path
    desc: Windows Installer UserData registry path
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Installer\UserData

  - id: windows-installer-hklm-patch-write
    desc: Windows Installer HKLM patch registry write
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bSet(DWord|String)Value\s+HKLM\b'

  - id: windows-installer-cabinet-msp-repair
    desc: Windows Installer cabinet MSP repair staging
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)expand\.exe\s+-R\s+-F:\*.{0,100}\b1\._\b'

  # rePatches*.vbs — Office MUI custom action that re-registers Installer
  # patch GUIDs and materializes a missing MSP via expand.exe (same repair
  # family as office-mui-patch-repair, different entry basename).
  - id: repatches-script-basename
    desc: Office rePatches custom-action script basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^rePatches[A-Za-z0-9]*\.vbs$'

  - id: office-c2r-installer-title
    desc: Office Click-to-Run multi-version title
    crit: notable
    conf: 0.98
    for: [pe]
    size_min: 262144
    size_max: 134217728
    if:
      type: text
      regex: 'Office 20[0-9]{2}-20[0-9]{2} C2R Install'
      section: .data

composite_rules:
  - id: office-c2r-kms-activation-context
    desc: Office Click-to-Run installer with a local KMS emulator
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      - id: office-c2r-installer-title
      - id: well-known/dual-use/access-control/kms-emulator::kms-emulation-registry-value-name
      - id: well-known/dual-use/access-control/kms-emulator::spp-ext-com-object-name

  - id: office-license-cleanup-script
    desc: Microsoft Office license-removal utility
    crit: notable
    conf: 0.99
    all:
      - id: olicense-cleanup-basename
      - id: olicense-cleanup-microsoft-header

  - id: office-license-cleanup-benign-context
    desc: Recognized Microsoft Office license-cleanup context
    crit: exception
    conf: 0.99
    all:
      - id: office-license-cleanup-script
      - id: olicense-cleanup-microsoft-header

  - id: offscrub-removal-script
    desc: Microsoft Office OffScrub removal utility
    crit: notable
    conf: 0.99
    all:
      - id: offscrub-microsoft-header
      - id: offscrub-scriptfile-constant

  - id: offscrub-removal-benign-context
    desc: Recognized Microsoft OffScrub removal context
    crit: exception
    conf: 0.99
    all:
      - id: offscrub-removal-script
      - id: offscrub-scriptfile-constant

  - id: office-mui-patch-repair-benign-context
    desc: Recognized Office MUI Windows Installer patch repair
    crit: exception
    conf: 0.98
    all:
      - id: office-mui-patch-list
      - id: windows-installer-session-database
      - id: windows-installer-patch-property
      - id: windows-installer-userdata-path
      - id: windows-installer-hklm-patch-write
      - id: windows-installer-cabinet-msp-repair

  - id: office-repatches-script
    desc: Microsoft Office rePatches Installer custom action
    crit: notable
    conf: 0.99
    all:
      - id: repatches-script-basename
      - id: windows-installer-session-database
      - id: windows-installer-cabinet-msp-repair

  - id: office-repatches-benign-context
    desc: Recognized Office rePatches Installer repair context
    crit: exception
    conf: 0.99
    all:
      - id: office-repatches-script
      - id: windows-installer-userdata-path
      - id: windows-installer-hklm-patch-write

  - id: office-unpatches-script
    desc: Microsoft Office unPatches registry cleanup utility
    crit: notable
    conf: 0.99
    all:
      - id: unpatches-script-basename
      - id: office-product-guid-suffix
      - id: unpatches-installer-patches-path

  - id: office-unpatches-benign-context
    desc: Recognized Office unPatches Installer cleanup context
    crit: exception
    conf: 0.99
    all:
      - id: office-unpatches-script
      - id: office-product-guid-suffix
