# Microsoft Office license-removal utility identity.
# The identity requires the script basename and its own Microsoft header; a
# lone mention of Office or Software Protection Platform is not sufficient.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: olicense-cleanup-basename
    desc: OLicenseCleanup script basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: OLicenseCleanup.vbs

  - id: olicense-cleanup-microsoft-header
    desc: Microsoft Office license-cleanup script header
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)Author:\s*Microsoft Customer Support Services.{0,180}Software Protection Platform'

  # OffScrub03/07/10/c2r/_O15msi/_O16msi -- the Microsoft Customer Support
  # Services "scrub" scripts that force-remove an Office installation when the
  # supported uninstall path is broken. They are shipped inside SaRA and pasted
  # into countless deployment packages, and their job makes them look like a
  # toolkit: hidden cscript relaunch under `runas`, WMI process/disk sweeps,
  # scheduled-task round trips, Run-key and Startup-shortcut deletion. Both
  # markers are the script's own self-declaration, so neither a product mention
  # nor a copied header alone establishes the identity.
  - id: offscrub-microsoft-header
    desc: OffScrub Microsoft support-services header
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)OffScrub\w{0,12}\.vbs.{0,99}Microsoft Customer Support Services'

  - id: offscrub-scriptfile-constant
    desc: OffScrub SCRIPTFILE constant declaration
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)Const\s+SCRIPTFILE\s{0,8}=\s{0,4}"OffScrub'

composite_rules:
  - id: office-license-cleanup-script
    desc: Microsoft Office license-removal utility
    crit: notable
    conf: 0.99
    all:
      - id: olicense-cleanup-basename
      - id: olicense-cleanup-microsoft-header

  - id: office-license-cleanup-benign-context
    desc: Recognized Microsoft Office license-cleanup context
    crit: exception
    conf: 0.99
    all:
      - id: office-license-cleanup-script
      - id: olicense-cleanup-microsoft-header

  - id: offscrub-removal-script
    desc: Microsoft Office OffScrub removal utility
    crit: notable
    conf: 0.99
    all:
      - id: offscrub-microsoft-header
      - id: offscrub-scriptfile-constant

  - id: offscrub-removal-benign-context
    desc: Recognized Microsoft OffScrub removal context
    crit: exception
    conf: 0.99
    all:
      - id: offscrub-removal-script
      - id: offscrub-scriptfile-constant
