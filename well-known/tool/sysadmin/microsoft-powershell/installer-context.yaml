defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: intune-remediation-script
    desc: Intune remediation script path
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      exact: Create-IntuneRemediation.ps1
  # `powershell-release-installer` moved to
  # micro-behaviors/communications/http/download/release. Its `releases/download`
  # branch identified no product, so it attributed every GitHub-release
  # install.ps1 to Microsoft PowerShell. Referenced from here unchanged.

composite_rules:
  - id: powershell-download-archive-known-installer-context
    desc: Known installer archive context
    crit: notable
    conf: 0.99
    any:
      - id: well-known/app/development/calvyn-code
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: well-known/app/infrastructure/azure-dev-cli/
      - id: intune-remediation-script
      - id: metadata/package/testing/scripted::endtoend-smoke-download-recipe
      - id: metadata/package/quality/benign-context::cargo-binstall-release-installer-context
      - id: micro-behaviors/communications/http/download/release::powershell-release-installer
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-bootstrap-context
