defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: intune-remediation-script
    desc: Intune remediation script path
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      exact: Create-IntuneRemediation.ps1
  - id: powershell-release-installer
    desc: PowerShell release installer source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)function\s+(Get-Installer|Invoke-Installer)|releases/download'

composite_rules:
  - id: powershell-download-archive-known-installer-context
    desc: Known installer archive context
    crit: notable
    conf: 0.99
    any:
      - id: well-known/app/development/calvyn-code
      - id: well-known/app/ai/aui-agent-builder/
      - id: well-known/app/infrastructure/azure-dev-cli/
      - id: intune-remediation-script
      - id: metadata/package/testing/scripted::endtoend-smoke-download-recipe
      - id: metadata/package/quality/benign-context::cargo-binstall-release-installer-context
      - id: well-known/tool/sysadmin/microsoft-powershell::powershell-release-installer
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-bootstrap-context
