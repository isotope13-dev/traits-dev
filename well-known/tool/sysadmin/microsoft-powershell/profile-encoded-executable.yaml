defaults:
  platforms: [windows, unix]
  for: [javascript]
  size_min: 200
  size_max: 1000000

traits:
  - id: encoded-powershell-exe-reference
    desc: Base64 text references PowerShell executable
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      exact: powershell.exe
