defaults:
  platforms: [windows]
  for: [pe]
  size_min: 262144
  size_max: 33554432
  crit: notable
  conf: 0.99
traits:
  - id: measurement-banner
    desc: Ethr network measurement tool banner
    if:
      type: text
      section: .rdata
      substr: 'Ethr: Comprehensive Network Performance Measurement Tool'
  - id: module-path
    desc: Ethr upstream Go module path
    if:
      type: raw
      section: .rdata
      regex: 'github\.com/[Mm]icrosoft/[Ee]thr'
composite_rules:
  - id: ethr-binary
    desc: Microsoft Ethr network measurement executable
    all:
      - id: measurement-banner
      - id: module-path
