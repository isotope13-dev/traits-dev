# virt-what reports which hypervisor it is running under. Vendor strings,
# CPUID leaves, and the Alibaba metadata address are that report.
defaults:
  size_min: 1000
  size_max: 200000
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: virt-what-basename
    desc: virt-what hypervisor reporter
    if:
      type: basename
      exact: virt-what
  - id: virt-what-cvm-basename
    desc: virt-what confidential VM helper
    for: [elf]
    if:
      type: basename
      exact: virt-what-cvm
