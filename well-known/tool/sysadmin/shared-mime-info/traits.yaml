defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: update-mime-database-basename
    desc: shared-mime-info database update utility
    if:
      type: basename
      regex: '(?i)^update-mime-database(\.exe)?$'
  - id: shared-mime-info-source-marker
    desc: shared-mime-info source marker
    crit: component
    if:
      type: text
      regex: '(?i)shared-mime-info'
      section: rdata

composite_rules:
  - id: shared-mime-info-update-tool
    desc: shared-mime-info database update utility
    crit: notable
    all:
      - id: update-mime-database-basename
      - id: shared-mime-info-source-marker
