# Microsoft Workplace Join cleanup package identity.
# The package uses PsExec locally to run dsregcmd under SYSTEM; that is a
# documented cleanup workflow, not evidence of cross-host execution.
defaults:
  platforms: [windows]
  for: [batch, pe, dll, zip]
  size_max: 52428800

traits:
  - id: wpj-cleanup-name
    desc: Microsoft Workplace Join cleanup artifact name
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(WPJCleanUp|CleanupWPJ_(X86|AMD64))\b'

  - id: wpj-cleanup-dsregcmd-workflow
    desc: Workplace Join cleanup dsregcmd workflow
    crit: notable
    conf: 0.99
    for: [batch, zip]
    if:
      type: text
      regex: '(?is)PsExec\.exe\s+-is\s+dsregcmd\s+/leave.{0,240}CleanupWPJ_'

composite_rules:
  - id: microsoft-wpj-cleanup-package
    desc: Microsoft Workplace Join cleanup package
    crit: notable
    conf: 0.99
    all:
      - id: wpj-cleanup-name
      - id: wpj-cleanup-dsregcmd-workflow

  - id: microsoft-wpj-cleanup-benign-context
    desc: Recognized Microsoft Workplace Join cleanup context
    crit: exception
    conf: 0.99
    all:
      - id: microsoft-wpj-cleanup-package
      - id: wpj-cleanup-dsregcmd-workflow
