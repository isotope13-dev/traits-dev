# Linux-PAM's unix_chkpwd helper is a stock authentication component.  Keep
# the identity tied to its embedded PAM banner and the APIs that implement
# shadow-password verification rather than to the basename alone: a renamed
# copy should still be recognized, while a binary merely masquerading as the
# helper should not be treated as benign context.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 100000

traits:
  - id: unix-chkpwd-pam-banner
    desc: Linux-PAM unix_chkpwd helper banner
    if:
      type: text
      section: .rodata
      exact: 'PAM:unix_chkpwd'

  - id: unix-update-pam-banner
    desc: Linux-PAM unix_update helper banner
    if:
      type: text
      section: .rodata
      exact: 'PAM:unix_update'

composite_rules:
  - id: unix-chkpwd-helper
    desc: Linux-PAM Unix password-check helper
    crit: notable
    conf: 0.99
    all:
      - id: unix-chkpwd-pam-banner
      - id: micro-behaviors/os/user/lookup::getspnam
      - id: micro-behaviors/crypto/kdf/password::crypt-r
      - id: micro-behaviors/os/security/audit::libaudit-account-event-log

  - id: unix-update-helper
    desc: Linux-PAM Unix password-update helper
    crit: notable
    conf: 0.99
    all:
      - id: unix-update-pam-banner
      - id: micro-behaviors/os/user/account::lckpwdf
      - id: micro-behaviors/os/user/account::putpwent
      - id: micro-behaviors/os/user/account::putspent
      - id: micro-behaviors/crypto/kdf/password::crypt-gensalt
