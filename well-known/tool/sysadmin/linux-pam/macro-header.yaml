defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: linux-pam-upstream-macro-header
    desc: Upstream Linux-PAM macro header
    crit: notable
    conf: 1.0
    size_min: 6109
    size_max: 6698
    if:
      type: yara
      source: |
        import "hash"

        rule linux_pam_upstream_macro_header {
          strings:
            $guard = "#ifndef PAM_MACROS_H"
          condition:
            $guard at 0 and
            with digest = hash.sha256(0, filesize) : (
              // Identical across the reviewed upstream release groups.
              digest == "f41bb76c31c89639eab86ef4593c04480456ecd182459d4c14e7795dc07bc1ae" or
              digest == "ff75b3cc7490c70298f06bd28b62b381f1b2c2b4cf8356e0db07e96edd02b4fe"
            )
        }
