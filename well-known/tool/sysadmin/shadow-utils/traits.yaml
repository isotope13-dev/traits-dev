defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 200000

# Debian's FDO package note provides package provenance; the basename then
# identifies which standard shadow-utils account-management command is present.
# These are benign tool identities, not credential-dumping detections.
traits:
  - id: debian-shadow-package
    desc: Debian shadow package identity
    if:
      type: value
      path: elf.package.name
      exact: shadow

  - id: shadow-userdel-basename
    desc: shadow-utils userdel executable name
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: userdel

  - id: shadow-chsh-basename
    desc: shadow-utils chsh executable name
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: chsh

  - id: shadow-vipw-basename
    desc: shadow-utils vipw executable name
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: vipw

composite_rules:
  - id: debian-shadow-account-utility
    desc: Debian shadow account-management utility
    crit: notable
    conf: 0.99
    all:
      - id: debian-shadow-package
    any:
      - id: shadow-chsh-basename
      - id: shadow-vipw-basename
      - id: shadow-userdel-basename
      - id: objectives/credential-access/pam/intercept::pam-login-tool-basename

  - id: debian-shadow-chsh-context
    desc: Debian shadow chsh utility context
    crit: exception
    conf: 0.99
    all:
      - id: debian-shadow-package
      - id: shadow-chsh-basename
      - id: micro-behaviors/os/user/account::putpwent
      - id: micro-behaviors/os/user/account::lckpwdf
      - id: micro-behaviors/os/pam/auth::pam-authenticate
      - id: micro-behaviors/os/pam/auth::pam-acct-mgmt

  - id: debian-shadow-vipw-context
    desc: Debian shadow vipw utility context
    crit: exception
    conf: 0.99
    all:
      - id: debian-shadow-package
      - id: shadow-vipw-basename
      - id: micro-behaviors/os/user/account::putspent
      - id: micro-behaviors/os/user/account::putgrent
      - id: micro-behaviors/os/user/account::lckpwdf

  - id: debian-shadow-userdel-context
    desc: Debian shadow userdel package context
    crit: exception
    conf: 0.99
    all:
      - id: debian-shadow-package
      - id: shadow-userdel-basename
