defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 200000

# Debian's FDO package note provides package provenance; the basename then
# identifies which standard shadow-utils account-management command is present.
# These are benign tool identities, not credential-dumping detections.
traits:
  - id: debian-shadow-package
    desc: Debian shadow package identity
    if:
      type: value
      path: elf.package.name
      exact: shadow

  - id: shadow-userdel-basename
    desc: shadow-utils userdel executable name
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: userdel

composite_rules:
  - id: debian-shadow-account-utility
    desc: Debian shadow account-management utility
    crit: notable
    conf: 0.99
    all:
      - id: debian-shadow-package
    any:
      - id: objectives/credential-access/dump/system::account-tool-basename-shadow--vipw
      - id: objectives/credential-access/pam/intercept::pam-login-tool-basename

  - id: debian-shadow-userdel-context
    desc: Debian shadow userdel package context
    crit: exception
    conf: 0.99
    all:
      - id: debian-shadow-package
      - id: shadow-userdel-basename
