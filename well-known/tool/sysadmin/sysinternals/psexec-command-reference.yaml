traits:
  - id: psexec-remote-invocation
    platforms: [windows]
    for: [binaries, scripts, source]
    desc: PsExec and remote-host command text
    crit: notable
    conf: 0.96
    size_min: 32
    size_max: 500000000
    if:
      type: text
      regex: '(?i)\bpsexec(64)?(\.exe)?\b[^\r\n]{0,160}\s+["'']?\\\\[\w.%${}<>-]{1,80}(\s|["'']|$)'
