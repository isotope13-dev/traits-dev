defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 52428800

# Process Explorer ships both its GUI and a signed helper driver in the same
# distribution.  The version-resource identity is shared by all three GUI
# architectures and by the embedded driver; pair it with the Microsoft leaf
# signer before using it as benign context for objective rules.
traits:
  - id: process-explorer-product-name
    desc: Process Explorer product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Process Explorer

  - id: process-explorer-company-name
    desc: Sysinternals company metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Sysinternals\s+-\s+www\.sysinternals\.com$'

composite_rules:
  - id: sysinternals-process-explorer
    desc: Microsoft-signed Sysinternals Process Explorer
    crit: notable
    conf: 0.99
    all:
      - id: process-explorer-product-name
      - id: process-explorer-company-name
      - id: metadata/signed/leaf::microsoft-corporation
