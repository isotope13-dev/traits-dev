defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 16384

traits:
  - id: handle-product-name
    desc: Sysinternals Handle product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Sysinternals Handle

  - id: handle-original-filename
    desc: Sysinternals Handle original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^nthandle\.exe$'

composite_rules:
  - id: sysinternals-handle
    desc: Sysinternals Handle build identity
    all:
      - id: handle-product-name
      - id: metadata/binary/resource/identity::sysinternals-company-homepage-version-field
      - id: handle-original-filename
