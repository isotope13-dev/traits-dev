# The Process Explorer inspection driver is smaller than the GUI and is
# embedded in Handle. Keep it out of the GUI file's 32KB floor.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 16384

traits:
  - id: process-explorer-driver-product
    desc: Process Explorer driver product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Process Explorer

  - id: process-explorer-driver-filename
    desc: Process Explorer driver original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^procexp\d*\.sys$'

composite_rules:
  - id: sysinternals-process-explorer-driver
    desc: Sysinternals Process Explorer driver
    all:
      - id: process-explorer-driver-product
      - id: metadata/binary/resource/identity::sysinternals-company-homepage-version-field
      - id: process-explorer-driver-filename
