# Sysinternals SDelete — Microsoft-signed secure-delete utility.
#
# Wipe/overwrite APIs are expected here. Keep this identity distinct from
# malware that embeds SDelete strings or overlays for destruction staging.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 52428800

traits:
  - id: sdelete-original-filename
    desc: Sysinternals SDelete original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: sdelete.exe
      case_insensitive: true

  - id: sdelete-product-name
    desc: Sysinternals SDelete product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Sysinternals\s+Sdelete$'

composite_rules:
  - id: sdelete-tool
    desc: Microsoft-signed Sysinternals SDelete utility
    crit: notable
    conf: 0.99
    all:
      - id: sdelete-original-filename
      - id: sdelete-product-name
      - id: metadata/signed/leaf::microsoft-corporation
