defaults:
  size_max: 52428800
  platforms:
    - windows
  for:
    - pe
    - dll
    - batch
    - powershell
traits:
  - id: sysinternals-rsrc-marker
    desc: Sysinternals tool self-identification
    crit: component
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      substr: Sysinternals
      section: rdata
  - id: sysinternals-versioninfo-product
    desc: Sysinternals product version metadata
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: (?i)\bSysinternals\b
  - id: sysinternals-company-versioninfo
    desc: Sysinternals company version metadata
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: value
      path: pe.version.company
      regex: (?i)\bSysinternals\b
  - id: sysinternals-license-text
    desc: Sysinternals license text embedded
    crit: component
    conf: 0.96
    for: [pe, dll]
    if:
      type: text
      substr: Sysinternals License
      section: rdata
  - id: sysinternals-download-url
    desc: Sysinternals download URL embedded
    crit: component
    conf: 0.96
    for: [pe, dll]
    if:
      type: text
      substr: sysinternals.com
      section: rdata
  - id: rootkit-revealer-product
    desc: RootkitRevealer product version metadata
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bRootkitRevealer\b'
  - id: rootkit-revealer-driver-device
    desc: RootkitRevealer helper-driver device name
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\\(Device|DosDevices)(\\Global)?\\RkReveal150'
      section: pdata
  - id: rootkit-revealer-driver-image
    desc: RootkitRevealer helper-driver image name
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\bRKREVEAL150\.SYS\b'
      section: pdata
  - id: rootkit-revealer-driver-symbol
    desc: RootkitRevealer helper-driver symbol
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: text
      regex: '_RkReveal(GetSyscall|OpenKey|DeviceControl|Dispatch|Unload)'
      section: pdata
  - id: accesschk-driver-basename
    desc: AccessChk embedded kernel driver filename
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^akck\.sys(@|$)'
  - id: accesschk-binary-basename
    desc: AccessChk embedded executable filename
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^accesschk\.exe(@|$)'
  - id: procmon-driver-basename
    desc: Procmon embedded kernel driver filename
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^procmon\.sys(@|$)'
  - id: procmon-viewer-basename
    desc: Procmon embedded viewer binary filename
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^process_monitor(@|$)'
  - id: psexesvc-basename
    desc: PsExec embedded service binary filename
    crit: component
    conf: 0.98
    for: [pe, dll]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^psexesvc\.exe(@|$)'
  - id: psexesvc-service-name
    desc: PSEXESVC service name
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      word: PSEXESVC
      section: rdata
  - id: psexesvc-image-path
    desc: PSEXESVC.exe image path
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      regex: '\\PSEXESVC(\.exe)?\b'
      section: rdata
composite_rules:
  # Either VERSIONINFO field carries the identity, and which one varies by
  # tool: TcpView's ProductName is just "TcpView" while its CompanyName is
  # "Sysinternals - www.sysinternals.com". Requiring the product field alone
  # left most of the suite unrecognized, so the tools that name each other --
  # LiveKd launching WinDbg, Procmon referencing procexp -- read as malware
  # checking for analysis tools.
  - id: sysinternals-microsoft-signed-component
    desc: Microsoft-signed Sysinternals component
    crit: notable
    conf: 0.99
    all:
      # The leaf signer, not the platform::microsoft composite: that one wants a
      # verified-signature leg which is inconsistently present across one
      # signed suite -- tcpview.exe carries it, Procmon.exe and livekd.exe do
      # not, though cleave rates all three trust=platform. A Microsoft-issued
      # leaf cannot be forged, so it is the sound half of the identity.
      - id: metadata/signed/leaf::microsoft-corporation
    any:
      - id: sysinternals-versioninfo-product
      - id: sysinternals-company-versioninfo

  # A PsExec binary is itself a service-capable administrative tool.  Require
  # both the Sysinternals product identity and its service marker before using
  # that identity as benign context; a string copied by a masquerading loader
  # must not inherit the exception.
  - id: sysinternals-psexec
    desc: Sysinternals PsExec tool identity
    crit: notable
    conf: 0.99
    all:
      - id: sysinternals-versioninfo-product
      - id: psexesvc-service-name

  - id: sysinternals-rootkit-revealer
    desc: Sysinternals RootkitRevealer tool identity
    crit: notable
    conf: 0.99
    all:
      - id: rootkit-revealer-product
    any:
      - id: rootkit-revealer-driver-device
      - id: rootkit-revealer-driver-image
      - id: rootkit-revealer-driver-symbol

  - id: sysinternals-tool
    desc: Sysinternals tool self-identification
    crit: component
    conf: 0.98
    any:
      - id: sysinternals-rsrc-marker
      - id: sysinternals-versioninfo-product
      - id: sysinternals-company-versioninfo
      - id: sysinternals-license-text
      - id: sysinternals-download-url
  - id: sysinternals-embedded-component
    desc: Sysinternals embedded component filename
    crit: notable
    conf: 0.98
    any:
      - id: accesschk-driver-basename
      - id: accesschk-binary-basename
      - id: procmon-driver-basename
      - id: procmon-viewer-basename
      - id: psexesvc-basename
  - id: embedded-sdelete-secure-delete
    desc: Sysinternals SDelete secure-deletion capability
    crit: notable
    conf: 0.97
    attack: T1485
    all:
      - id: sysinternals-tool
      - id: micro-behaviors/fs/delete/secure::sdelete-secure-delete
  - id: psexec-lateral-movement
    desc: PsExec lateral movement service install
    crit: hostile
    conf: 0.95
    attack: T1569.002
    any:
      - id: psexesvc-service-name
      - id: psexesvc-image-path
