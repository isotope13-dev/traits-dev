# NSSM (Non-Sucking Service Manager) is a legitimate open-source Windows
# service wrapper (Public Domain, Iain Patterson). Installing/starting
# services and supervising (including terminating) the hosted process tree
# are its documented purpose, so the identity below is used only as benign
# context by the service-install and process-termination objectives.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 52428800

traits:
  - id: nssm-versioninfo-product
    desc: NSSM product version metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^NSSM\b'

  - id: nssm-versioninfo-description
    desc: NSSM service manager description metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: The non-sucking service manager

  - id: nssm-service-installer-text
    desc: NSSM service installer string embedded
    crit: notable
    conf: 0.97
    if:
      type: text
      section: rsrc
      substr: NSSM service installer

composite_rules:
  - id: nssm-service-manager
    desc: NSSM service manager utility
    crit: notable
    conf: 0.99
    all:
      - id: nssm-versioninfo-product
      - id: nssm-service-installer-text
