# atomscan/ascan is a defensive malware scanner. Its executable embeds the
# wallet, miner, downloader, and offensive-tool strings that it reports, plus
# the Cleave/YARA-X analysis engine. Those strings are scanner data, not
# behavior performed by the scanner process.
defaults:
  platforms: [unix, windows]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 1000000000

traits:
- id: ascan-package-path
  desc: atomscan Wolfi package path
  for: [apk]
  if:
    type: path
    regex: '(?i)(^|[\\/])ascan-[0-9][^\\/]*\.apk$'

- id: ascan-cli-basename
  desc: atomscan defensive scanner executable basename
  if:
    type: basename
    regex: '^(atomscan|ascan)$'

- id: ascan-cleave-engine
  desc: atomscan embedded Cleave analysis engine marker
  if:
    type: text
    section: .rodata
    substr: CLEAVE_V

- id: ascan-model-bundle-path
  desc: atomscan embedded model bundle path
  for: [javascript]
  if:
    type: path
    substr: ascan/models

composite_rules:
- id: ascan-defensive-scanner-context
  desc: Recognized atomscan defensive scanner executable context
  crit: exception
  conf: 0.99
  scope: file
  all:
  - id: ascan-cli-basename
  - id: metadata/file/string/security::yara-x-engine-marker

- id: ascan-package-context
  desc: Recognized atomscan package context
  crit: exception
  conf: 0.99
  scope: outer
  all:
  - id: ascan-package-path
  - id: metadata/file/string/security::yara-x-engine-marker
