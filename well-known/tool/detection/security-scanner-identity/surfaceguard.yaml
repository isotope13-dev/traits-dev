# SurfaceGuard (skill-guard) — security, signing and provenance scanner for agent skills (OWASP Agentic Skills Top 10).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 52428800

traits:
  - id: surfaceguard-go-module-path
    desc: SurfaceGuard Go module path
    for: [go, go.mod, text]
    if:
      type: text
      regex: '(?m)^module\s+github\.com/(SVGreg/surfaceguard|svgreg/skill-guard)\s*$'

  - id: surfaceguard-docs-title
    desc: SurfaceGuard documentation heading
    for: [markdown, text]
    if:
      type: text
      regex: '(?im)^#+\s+(surfaceguard|SurfaceGuard|Planned rules backlog)\b'

  - id: surfaceguard-docs-reference
    desc: SurfaceGuard documentation reference
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\b(surfaceguard|skill-guard)\b'

  - id: surfaceguard-rule-id-prefix
    desc: SurfaceGuard rule ID prefix
    for: [markdown, text, yaml, go]
    if:
      type: text
      regex: '\bSG-[A-Z]{3,5}-[0-9]{3}\b'

  - id: surfaceguard-archive-member
    desc: SurfaceGuard archive member
    for: [binaries, scripts, source, manifests, documents, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])(surfaceguard|skill-guard)(@|[-_]v?[0-9]|[\\/]|$)'

  - id: surfaceguard-policy-config
    desc: SurfaceGuard policy config
    for: [yaml, text]
    if:
      type: text
      substr: 'surfaceguard.svgreg.net/policy.v1'

composite_rules:
  - id: surfaceguard-scanner-context
    desc: SurfaceGuard scanner context
    crit: notable
    conf: 0.99
    scope: file
    any:
      - id: surfaceguard-go-module-path
      - id: surfaceguard-docs-title
      - id: surfaceguard-docs-reference
      - id: surfaceguard-rule-id-prefix
      - id: surfaceguard-archive-member
      - id: surfaceguard-policy-config
    needs: 2
