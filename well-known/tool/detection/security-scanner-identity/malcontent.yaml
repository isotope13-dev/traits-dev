# Malcontent embeds detection rules and their attack strings in its CLI.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
traits:
  - id: malcontent-cli-build-path
    desc: Malcontent scanner Go command path
    if:
      type: value
      path: elf.go.path
      exact: github.com/chainguard-dev/malcontent/cmd/mal
