# aiscan — Agentic Security Scanner (github.com/chainreactors/aiscan).
# Combines LLM agents with deterministic security scanning engines (gogo, spray,
# zombie, neutron, katana). Dual-use security scanner for asset discovery and recon.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 52428800

traits:
  - id: aiscan-go-module-path
    desc: aiscan security scanner Go module path
    for: [go, go.mod, text]
    if:
      type: text
      regex: '(?m)^module\s+github\.com/chainreactors/aiscan\s*$'

  - id: aiscan-docs-title
    desc: aiscan security scanner documentation title
    for: [markdown, text]
    if:
      type: text
      regex: '(?im)^#+\s+aiscan\b'

  - id: aiscan-archive-member
    desc: aiscan or cyber-harness archive member
    for: [binaries, scripts, source, manifests, documents, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])(aiscan|cyber-harness)(@|[-_]v?[0-9]|[\\/]|$)'

composite_rules:
  - id: aiscan-security-scanner-context
    desc: aiscan agentic security scanner context
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: aiscan-go-module-path
      - id: well-known/tool/offensive/chainreactors::chainreactors-aiscan-module
      - id: aiscan-docs-title
      - id: aiscan-archive-member
    needs: 2
