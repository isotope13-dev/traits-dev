# Anchore grype, the open-source vulnerability scanner for container images
# and filesystems. Its embedded advisory and CPE-mapping datasets name
# thousands of packages -- dual-use proxy and tunnel tools among them -- as
# data the scanner matches against. Recognised by the Go main module the
# binary was built as, read from its embedded build info, not by strings: a
# program that only vendors or mentions grype still names its own module
# here.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.97
  # Grype ships as a large statically linked Go binary with embedded
  # vulnerability databases: megabytes, not KB.
  size_min: 1048576
  size_max: 524288000

traits:
  - id: grype-go-module-pe
    desc: Go binary built as Anchore grype
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/anchore/grype

  - id: grype-go-module-elf
    desc: Go binary built as Anchore grype
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/anchore/grype

  - id: grype-go-module-macho
    desc: Go binary built as Anchore grype
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/anchore/grype

composite_rules:
  - id: grype-scanner-context
    desc: Recognized Anchore grype scanner context
    crit: exception
    conf: 0.97
    # Go main module identity: catches grype builds that embed advisory
    # catalogs (GOST and other dual-use tool paths mapped to CPEs) without
    # treating every "anchore/grype" mention as a scanner.
    any:
      - id: grype-go-module-pe
      - id: grype-go-module-elf
      - id: grype-go-module-macho
