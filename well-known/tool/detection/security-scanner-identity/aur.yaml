# ks-aur-scanner is a defensive source tree that deliberately ships malicious
# PKGBUILD fixtures for its AUR package analysis tests.
defaults:
  platforms: [unix]
  for: [cargo.toml]
  crit: notable
  conf: 0.99

traits:
- id: ks-aur-repository
  desc: Kief Studio AUR scanner repository
  if:
    type: text
    substr: 'github.com/KiefStudioMA/ks-aur-scanner'
- id: ks-aur-source-member
  desc: Kief Studio AUR scanner source member path
  for: [scripts, source, manifests, cargo.toml, markdown, shell, python, rust, json, html]
  size_max: 100000000
  if:
    type: path
    # Versioned checkouts (`ks-aur-scanner-2.0.0`) and git-archive HEAD
    # trees (`ks-aur-scanner-HEAD`) both carry the same fixture sources.
    regex: 'ks-aur-scanner-(HEAD|[0-9][A-Za-z0-9._-]*)'
- id: ks-aur-tests-member
  # Second path leg so the exception can assemble from two notable facts on the
  # same leaf (fixtures under tests/), without depending on scope:outer across
  # Cargo.toml — unless: evaluation does not always pool outer-scope exceptions.
  desc: Kief Studio AUR scanner tests tree member
  for: [scripts, source, manifests, cargo.toml, markdown, shell, python, rust, json, html]
  size_max: 100000000
  if:
    type: path
    regex: 'ks-aur-scanner-(HEAD|[0-9][A-Za-z0-9._-]*)[\\/]tests?[\\/]'
- id: ks-aur-crate-member
  # Analyzer sources under crates/ embed malicious PKGBUILD snippets as unit
  # fixtures (e.g. privilege.rs). Same identity as the tests/ tree.
  desc: Kief Studio AUR scanner crate source member
  for: [scripts, source, manifests, cargo.toml, markdown, shell, python, rust, json, html]
  size_max: 100000000
  if:
    type: path
    regex: 'ks-aur-scanner-(HEAD|[0-9][A-Za-z0-9._-]*)[\\/]crates[\\/]'

composite_rules:
- id: ks-aur-scanner-source-context
  desc: Recognized AUR security scanner source
  crit: exception
  conf: 0.99
  for: [scripts, source, manifests, cargo.toml, markdown, shell, python, rust, json, html]
  all:
  - id: ks-aur-source-member
  any:
  - id: ks-aur-tests-member
  - id: ks-aur-crate-member
