# Published agent-trust library whose detectors and self-tests carry prompt
# injection strings as data. The wheel names one vendor and its purpose.
defaults:
  platforms: [unix, windows]
  for: [whl]
  crit: notable
  conf: 0.95

traits:
  - id: gamai-trust-wheel-distribution
    desc: gamAI Trust Layer wheel distribution
    if:
      type: value
      path: whl.distribution
      exact: gamai_trust

  - id: gamai-trust-wheel-description
    desc: gamAI Trust Layer wheel description
    if:
      type: value
      path: whl.description
      substr: learned injection antibodies

composite_rules:
  - id: gamai-trust-package-context
    desc: Identified gamAI Trust Layer agent-security package
    crit: notable
    scope: archive
    all:
      - id: gamai-trust-wheel-distribution
      - id: gamai-trust-wheel-description
