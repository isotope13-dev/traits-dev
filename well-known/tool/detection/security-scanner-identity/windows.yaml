# ClamAV's deliberately malformed 544-byte PE regression fixture identifies
# itself with this sole section name.  Keep the marker as product/test identity
# so structural PE heuristics can exclude the fixture without relaxing their
# size, import, permission, or resource thresholds for ordinary executables.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: clamav-test-file-section
    desc: ClamAV test executable section
    size_max: 4096
    if:
      type: section
      exact: "[CLAMAV]"
