# Published scanner package whose source includes exploit playbooks and LLM
# red-team inputs as test data.
defaults:
  platforms: [unix, windows]
  for: [npm]
  crit: notable
  conf: 0.99

traits:
  - id: agentic-security-npm-name
    desc: Agentic-security scanner npm package
    if:
      type: value
      path: npm.name
      exact: '@clear-capabilities/agentic-security-scanner'

  - id: agentic-security-npm-repository
    desc: Agentic-security scanner repository
    if:
      type: value
      path: npm.repository.url
      substr: github.com/Clear-Capabilities/agentic-security

composite_rules:
  - id: agentic-security-package-context
    desc: Identified agentic-security scanner package
    crit: notable
    scope: archive
    all:
      - id: agentic-security-npm-name
      - id: agentic-security-npm-repository
