# Apple's XProtect daemon embeds sensitive paths and malware-signature strings
# as scanner data. Bind its exact designated identifier to the taxonomy's
# canonical Apple platform-binary identity before suppressing that catalog.
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0

traits:
  - id: apple-xprotectd-signing-identifier
    desc: Apple XProtect daemon signing identifier
    size_min: 100000
    size_max: 200000000
    if:
      type: value
      path: macho.code_signature.identifier
      exact: com.apple.xprotectd

composite_rules:
  - id: apple-xprotectd-scanner-context
    desc: Recognized Apple XProtect scanner context
    crit: exception
    conf: 1.0
    all:
      - id: apple-xprotectd-signing-identifier
      - id: metadata/signed/platform::apple
