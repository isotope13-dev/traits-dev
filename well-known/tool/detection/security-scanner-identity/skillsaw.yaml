# Skillsaw — configurable linter and security scanner for agent skills, plugins, and AI coding assistant context.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 52428800

traits:
  - id: skillsaw-cli-entrypoint
    desc: Skillsaw scanner CLI entry point declaration
    for: [pyproject.toml]
    if:
      type: value
      path: project.scripts.skillsaw
      exact: skillsaw.__main__:main

  - id: skillsaw-repo-url
    desc: Skillsaw upstream repository URL
    for: [python, pyproject.toml, markdown, text, shell]
    if:
      type: text
      substr: github.com/stbenjam/skillsaw

  - id: skillsaw-rule-import
    desc: Skillsaw rule module import
    for: [python]
    if:
      type: import
      exact: skillsaw.rule

  - id: skillsaw-docs-title
    desc: Skillsaw documentation heading
    for: [markdown, text]
    if:
      type: text
      regex: '(?im)^#+\s+skillsaw\b'

composite_rules:
  - id: skillsaw-scanner-context
    desc: Skillsaw AI coding assistant and skill security linter context
    crit: exception
    scope: archive
    any:
      - id: skillsaw-cli-entrypoint
      - id: skillsaw-repo-url
      - id: skillsaw-rule-import
      - id: skillsaw-docs-title
