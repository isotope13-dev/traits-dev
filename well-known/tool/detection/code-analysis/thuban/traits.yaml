defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: security-regression-case-table
    desc: Thuban security regression case table
    conf: 0.99
    if:
      type: text
      substr: 'KENNY_TESTS=[{id:"K01-JS-PHANTOM-API",name:"Phantom API:'
  - id: regression-expected-verdict-fields
    desc: Expected positive and negative verdict fields
    conf: 0.99
    if:
      type: text
      regex: 'mustDetect:\[[^\]]{1,200}\],mustNotFlag:\['
composite_rules:
  - id: regression-table-with-expected-verdicts
    desc: Thuban cases declare expected scan verdicts
    conf: 0.99
    all:
      - id: security-regression-case-table
      - id: regression-expected-verdict-fields
