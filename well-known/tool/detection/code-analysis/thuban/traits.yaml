defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: security-regression-case-table
    desc: Thuban security regression case table
    conf: 0.99
    if:
      type: text
      substr: 'KENNY_TESTS=[{id:"K01-JS-PHANTOM-API",name:"Phantom API:'
  - id: regression-expected-verdict-fields
    desc: Expected positive and negative verdict fields
    conf: 0.99
    if:
      type: text
      regex: 'mustDetect:\[[^\]]{1,200}\],mustNotFlag:\['
  # Crucible self-test seeds and self-attack payloads carry this header;
  # their planted secrets, injection and eval snippets are inert fixtures.
  - id: crucible-fixture-header
    desc: Thuban crucible seed or self-attack header
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      regex: '\[CRUCIBLE-(SEED|SELF-ATTACK)\]'
composite_rules:
  - id: regression-table-with-expected-verdicts
    desc: Thuban cases declare expected scan verdicts
    conf: 0.99
    all:
      - id: security-regression-case-table
      - id: regression-expected-verdict-fields
