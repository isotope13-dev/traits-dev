defaults:
  platforms: [unix, windows]

# Tool Guard Core is a defensive policy engine. Its repository deliberately
# carries executable attack probes and credential-path regression fixtures.
traits:
- id: repository-module
  desc: Tool Guard Core repository module path
  crit: notable
  conf: 0.99
  for: [go]
  if:
    type: text
    substr: github.com/dimaggi-ai/tool-guard-core
- id: readme-heading
  desc: Tool Guard Core project README heading
  crit: notable
  conf: 0.99
  for: [markdown]
  if:
    type: text
    substr: '# Tool Guard Core'
- id: postgres-attack-fixture
  desc: Tool Guard Core PostgreSQL attack fixture path
  crit: notable
  conf: 0.99
  for: [shell, markdown]
  if:
    type: path
    regex: 'postgres-attack'

composite_rules:
- id: defensive-attack-corpus-context
  desc: Tool Guard Core defensive attack corpus context
  crit: exception
  conf: 0.99
  scope: archive
  all:
  - id: repository-module
  - id: readme-heading
  - id: postgres-attack-fixture
