# webscan — Method Security web application scanner
# (github.com/Method-Security/webscan). CLI for discovery, enumeration, and
# pentest workflows (Nuclei, Wappalyzer, directory brute-force wordlists). Dual-use
# offensive security tooling with documented acceptable-use policy; expected to
# ship fuzzing wordlists and HTTP probe code.
defaults:
  platforms: [unix, windows]
  for: [go, markdown, text, archives, zip]
  crit: notable
  conf: 0.99

traits:
  - id: go-module-path
    desc: Method Security webscan Go module path
    for: [go, text, archives, zip]
    if:
      type: text
      regex: '(?m)^module\s+github\.com/Method-Security/webscan\s*$'

  - id: repository-marker
    desc: Method Security webscan repository marker
    if:
      type: text
      substr: github.com/Method-Security/webscan

  - id: discover-command-source
    desc: webscan discover command source path
    for: [go]
    if:
      type: path
      regex: '(^|/)cmd/discover\.go$'

  - id: wordpress-plugin-activation-exec
    desc: webscan WordPress activation execution
    for: [go]
    if:
      type: text
      substr: 'register_activation_hook(__FILE__'

  - id: wordpress-plugin-zip-builder
    desc: webscan WordPress plugin ZIP builder source
    for: [go]
    if:
      type: text
      substr: 'func buildPluginZip('

composite_rules:
  - id: webscan-scanner
    desc: Method Security webscan application scanner
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: go-module-path
      - id: repository-marker

  - id: wordpress-plugin-command-exec-payload
    desc: webscan WordPress pentest PHP exec payload
    crit: notable
    conf: 0.99
    all:
      - id: wordpress-plugin-activation-exec
      - id: wordpress-plugin-zip-builder
