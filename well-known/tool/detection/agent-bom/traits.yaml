# agent-bom — the Python security-posture agent (SBOM, CIS benchmarks,
# cloud inventory, vulnerability correlation).
#
# Its audit corpus is hundreds of collector modules under agent_bom/, and
# each one is written in the shape of the control it audits:
# aws_cis_benchmark.py checks public-access blocks and bucket policies,
# aws_inventory.py lists buckets and reads their ACLs. Reading buckets'
# permission surface is the product working, not cloud recon by an attacker.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: agent-bom wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^agent-bom$'

  - id: module-import
    desc: agent-bom module import
    for: [python]
    if:
      type: text
      substr: 'from agent_bom.'

  - id: package-tree-path
    desc: agent-bom package tree path
    for: [python, text, data, json]
    if:
      type: path
      regex: '(^|/)agent_bom/'

composite_rules:
  - id: agent-bom-benign-context
    desc: Recognized agent-bom scanner corpus
    crit: exception
    conf: 0.99
    scope: outer
    for: [whl, egg, zip, python, text, data, json]
    any:
      - id: wheel-distribution-name
      - id: module-import
      - id: package-tree-path
