# Checkov — Bridgecrew/Palo Alto Infrastructure-as-Code policy scanner.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Checkov Python distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: checkov

  - id: github-repo-url
    desc: Checkov upstream GitHub repository URL
    if:
      type: text
      substr: github.com/bridgecrewio/checkov

  - id: resource-policy-base-import
    desc: Imports Checkov Terraform policy base class
    for: [python]
    if:
      type: import
      regex: '^checkov\.terraform\.checks\.resource\.base_resource(_value)?_check$'

  - id: ckv-policy-check-id
    desc: Checkov CKV policy check identifier
    for: [python]
    if:
      type: literal
      regex: 'CKV_[A-Z]+_[0-9]+'

composite_rules:
  - id: checkov-policy-module
    desc: Checkov Python policy implementation module
    for: [python]
    all:
      - id: resource-policy-base-import
      - id: ckv-policy-check-id

  - id: checkov-scanner-context
    desc: Checkov IaC security scanner package
    scope: archive
    needs: 2
    any:
      - id: package-name
      - id: github-repo-url
      - id: checkov-policy-module
