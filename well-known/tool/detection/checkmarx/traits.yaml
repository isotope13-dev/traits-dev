defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [elf, macho, pe]
  size_min: 512
  size_max: 500000000
traits:
  # Vendor AST/secret-scanner CLIs ship large pattern catalogs (Slack tokens,
  # proxy tool paths, etc.). Identify the Checkmarx AST CLI so those catalog
  # hits can be suppressed without whitelisting every scanner string.
  - id: ast-cli-go-dep-elf
    desc: Checkmarx AST CLI Go dependency on ELF
    crit: notable
    for: [elf]
    if:
      type: value
      path: elf.go.deps[*].path
      exact: github.com/checkmarx/ast-cli
  - id: ast-cli-go-dep-macho
    desc: Checkmarx AST CLI Go dependency on Mach-O
    crit: notable
    for: [macho]
    if:
      type: value
      path: macho.go.deps[*].path
      exact: github.com/checkmarx/ast-cli
  - id: ast-cli-go-dep-pe
    desc: Checkmarx AST CLI Go dependency on PE
    crit: notable
    for: [pe]
    if:
      type: value
      path: pe.go.deps[*].path
      exact: github.com/checkmarx/ast-cli
  - id: ast-scanner-marker-elf
    desc: Checkmarx scanner marker in ELF
    crit: notable
    for: [elf]
    if:
      type: text
      substr: Checkmarx
      section: .rodata
  - id: ast-scanner-marker-macho
    desc: Checkmarx scanner marker in Mach-O
    crit: notable
    for: [macho]
    if:
      type: text
      substr: Checkmarx
      section: __TEXT,__rodata
  - id: ast-scanner-marker-pe
    desc: Checkmarx scanner marker in PE
    crit: notable
    for: [pe]
    if:
      type: text
      substr: Checkmarx
      section: .rdata
composite_rules:
  - id: ast-scanner-elf-catalog
    for: [elf]
    desc: Checkmarx AST CLI ELF pattern catalog
    crit: exception
    all:
      - id: ast-cli-go-dep-elf
      - id: ast-scanner-marker-elf
  - id: ast-scanner-macho-catalog
    for: [macho]
    desc: Checkmarx AST CLI Mach-O pattern catalog
    crit: exception
    all:
      - id: ast-cli-go-dep-macho
      - id: ast-scanner-marker-macho
  - id: ast-scanner-pe-catalog
    for: [pe]
    desc: Checkmarx AST CLI PE pattern catalog
    crit: exception
    all:
      - id: ast-cli-go-dep-pe
      - id: ast-scanner-marker-pe
  - id: ast-scanner-pattern-catalog
    desc: Checkmarx AST CLI pattern-catalog binary
    crit: exception
    # Go module dep + vendor marker: catches future AST CLI builds that still
    # embed detection-catalog strings (Slack tokens, GOST paths) without
    # treating every "Checkmarx" mention as a scanner.
    any:
      - id: ast-scanner-elf-catalog
      - id: ast-scanner-macho-catalog
      - id: ast-scanner-pe-catalog
