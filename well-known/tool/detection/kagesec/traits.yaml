# KageSec is a published defensive web-application scanner.  Its Nuclei
# flow interpreter, traversal probes, Shellshock probes, and OOB deserialization
# checks are scanner logic and test payloads, not an operator's attack code.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl]
  crit: notable
  conf: 0.99

traits:
- id: package-name
  desc: KageSec package metadata name
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: kagesec
- id: wheel-distribution
  desc: KageSec wheel distribution name
  for: [whl]
  if:
    type: value
    path: whl.distribution
    exact: kagesec
- id: project-repository
  desc: KageSec upstream project repository
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/ZulAmi/KageSecurity
- id: scanner-module-layout
  desc: KageSec scanner module layout
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])scanner[\\/]'
- id: wheel-member-prefix
  desc: KageSec wheel member prefix
  for: [python]
  if:
    type: path
    regex: '(?i)(^|[\\/])kagesec-[0-9]'
- id: scanner-summary
  desc: KageSec security scanner package summary
  for: [pkginfo]
  if:
    type: value
    path: summary
    regex: '(?i)web application security scanner'

composite_rules:
- id: package-identity
  desc: KageSec defensive scanner package
  crit: notable
  conf: 0.99
  scope: archive
  all:
  - id: package-name
  - id: project-repository
- id: package-context
  desc: KageSec package metadata context
  crit: notable
  conf: 0.99
  scope: archive
  all:
  - id: package-identity
  - id: scanner-summary
- id: source-member-context
  desc: KageSec scanner source context
  crit: notable
  conf: 0.99
  all:
  - id: wheel-member-prefix
  - id: scanner-module-layout
- id: defensive-scanner-context
  desc: Recognized KageSec defensive scanner
  crit: exception
  conf: 0.99
  scope: archive
  any:
  - id: package-context
  - id: source-member-context
