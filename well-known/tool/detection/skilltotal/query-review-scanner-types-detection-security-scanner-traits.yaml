defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: skilltotal-scanner-module-path
  desc: SkillTotal scanner module path
  for:
  - python
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: 'skilltotal[\\/]'
- id: skilltotal-package-import-marker
  desc: SkillTotal package source import
  for:
  - python
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: from skilltotal.
