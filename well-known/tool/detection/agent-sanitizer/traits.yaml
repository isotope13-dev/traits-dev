# agent-sanitizer: prompt-injection / invisible-character sanitizer for AI agents.
# Python wheel bundles the Node.js sanitize-cli.mjs so Python callers get
# byte-identical verdicts without re-implementing the JS logic.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: agent-sanitizer-pypi-name
    desc: agent-sanitizer PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agent-sanitizer

  - id: agent-sanitizer-cli-env-var
    desc: AGENT_SANITIZER_CLI environment override
    for: [python]
    if:
      type: text
      substr: AGENT_SANITIZER_CLI

  - id: agent-sanitizer-bundled-cli-path
    desc: Bundled sanitize-cli.mjs bridge path
    for: [python]
    if:
      type: text
      substr: _bundled/sanitize-cli.mjs

  - id: agent-sanitizer-prompt-classify-doc
    desc: Prompt invisible-content classification API
    for: [python]
    if:
      type: text
      regex: '(?i)classify a user ``prompt`` as pass / note / block on invisible'

  - id: agent-sanitizer-module-path
    desc: agent_sanitizer Python package module path
    for: [python, pkginfo]
    if:
      type: path
      regex: '(^|[\\/])agent_sanitizer([\\/]|$)'

composite_rules:
  - id: agent-sanitizer-bridge-context
    desc: agent-sanitizer Python-to-Node bridge context
    crit: notable
    conf: 0.99
    all:
      - id: agent-sanitizer-cli-env-var
      - id: agent-sanitizer-bundled-cli-path

  - id: agent-sanitizer-package-context
    desc: agent-sanitizer defensive sanitizer package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: agent-sanitizer-pypi-name
      - id: agent-sanitizer-bridge-context
      - id: agent-sanitizer-module-path
