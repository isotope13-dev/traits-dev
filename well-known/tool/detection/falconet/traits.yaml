# FalcoNet ships embedded detection strings (netsh portproxy, vssadmin, WMIC,
# AMSI notes) as signature corpus data, not live attack behavior.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  size_min: 1048576
  size_max: 52428800
  crit: notable
  conf: 0.98

traits:
  - id: falconet-env-config-marker
    desc: FalcoNet runtime configuration env keys
    if:
      type: text
      section: .rdata
      regex: 'FALCONET_(LANG|INTEL|COVER|OTLP|SYSLOG)\b'
  - id: falconet-scope-telemetry-marker
    desc: FalcoNet scope telemetry field name
    if:
      type: text
      section: .rdata
      substr: falconet.scope
  - id: falconet-reroute-batch-signature
    desc: FalcoNet portproxy reroute batch marker
    if:
      type: text
      section: .rdata
      substr: FalcoNet reroute

composite_rules:
  - id: falconet-defensive-scanner-context
    desc: FalcoNet defensive edge scanner platform
    crit: exception
    conf: 0.99
    all:
      - id: falconet-env-config-marker
    any:
      - id: falconet-scope-telemetry-marker
      - id: falconet-reroute-batch-signature
