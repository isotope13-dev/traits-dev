# Concinno — AGPL Claude Code behavior-governance / guardrail product.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: concinno PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: concinno

  - id: wheel-distribution
    desc: concinno wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: concinno

  - id: exfil-guard-module
    desc: Concinno exfil prevention module
    for: [python]
    if:
      type: text
      substr: 'concinno.exfil_guard — Data exfiltration prevention'

  - id: llm-judge-guard-module
    desc: Concinno LLM-judge guard module
    for: [python]
    if:
      type: text
      substr: 'concinno.security.llm_judge_guard — LLM-based prompt injection detection'

  - id: permissions-allowlist-cmd
    desc: Concinno permissions allowlist command
    for: [python]
    if:
      type: text
      substr: 'concinno.cli.configure_permissions_cmd — One-shot permission allowlist'

composite_rules:
  - id: concinno-runtime
    desc: Concinno Claude Code governance
    any:
      - id: pypi-name
      - id: wheel-distribution
      - id: exfil-guard-module
      - id: llm-judge-guard-module
      - id: permissions-allowlist-cmd
