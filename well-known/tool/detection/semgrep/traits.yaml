# Semgrep rule packs and their test fixtures.
#
# A static-analysis rule is written as the vulnerable pattern it hunts for, and
# semgrep's test convention is to ship, beside every rule, a source file
# containing real instances of that vulnerability annotated with `// ruleid:`
# (should fire) and `// ok:` (should not). Those fixtures are the genuine
# article -- `rules/semgrep/php/tainted_exec.php` really does pass $_POST into
# shell_exec -- so webshell, injection and deserialization objectives fire on
# them exactly as intended, on a file whose purpose is to be detected.
#
# The annotation convention is stable across the whole semgrep ecosystem
# (semgrep-rules, Meta's insecure_code_detector, Trail of Bits, GitLab, r2c),
# so this recognizes the fixture rather than any one vendor's copy.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  # `ruleid:` names the rule this line is expected to trigger -- distinctive
  # enough on its own. A bare `ok:` is too generic, but several `ok:` lines
  # that name a hyphenated rule id are the negative half of the same fixture.
  - id: rule-test-annotation
    desc: Semgrep rule test expectation annotation
    for: [scripts, source, php, python, javascript, csharp, github-actions, json, text, data]
    if:
      type: text
      regex: '(//|#)\s*(todo)?(deep)?ruleid:\s*[\w.-]{2,60}'

  - id: rule-test-ok-slash-annotations
    desc: Repeated slash Semgrep ok-case annotations
    for: [scripts, source, php, python, javascript, csharp, github-actions, json, text, data]
    count_min: 4
    if:
      type: text
      regex: '//\s*ok:\s*[A-Za-z][\w.]*[-.][\w.-]{1,60}'

  - id: rule-test-ok-hash-annotations
    desc: Repeated hash Semgrep ok-case annotations
    for: [scripts, source, php, python, javascript, csharp, github-actions, json, text, data]
    count_min: 4
    if:
      type: text
      regex: '#\s*ok:\s*[A-Za-z][\w.]*[-.][\w.-]{1,60}'

  - id: rule-document-taint-mode
    desc: Semgrep taint-mode rule document
    for: [json, text, data]
    if:
      type: text
      regex: '(?m)^\s*-?\s*pattern-(sources|sinks|sanitizers):\s*$'

  - id: rule-document-id-field
    desc: Semgrep rule document id and languages
    for: [json, text, data]
    if:
      type: value
      path: rules[*].languages
      exists: true

composite_rules:
  # Two annotations in one file, or a rule document that declares taint
  # sources/sinks -- either way the vulnerable code present is the subject of a
  # detection rule, not an implementation.
  - id: rule-pack-fixture
    desc: Recognized semgrep rule pack or fixture
    crit: exception
    conf: 0.97
    any:
      - id: rule-test-annotation
      - id: rule-test-ok-slash-annotations
      - id: rule-test-ok-hash-annotations
      - id: rule-document-taint-mode
      - id: rule-document-id-field
