# Google Tsunami is a network vulnerability scanner. Its plugin tree ships
# the request bodies each detector sends to a chosen target.
defaults:
  platforms: [unix, windows]
  for: [xml, java, go, text, zip]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 20000000
traits:
  - id: plugin-tree-path
    desc: Tsunami scanner plugin tree
    if:
      type: path
      substr: tsunami-security-scanner
