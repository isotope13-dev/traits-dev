# openaudit (wezter96/openaudit) is a multi-area security auditor. Its source
# and test tree embeds the very patterns its auditors look for: zero-width
# characters spliced into tokens, `eval(atob(...))` strings, agent
# prompt-injection phrases and an intentionally vulnerable PHP fixture.
# Identify the tree by its release directory name.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, php, text, markdown, json]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree-path
    desc: openaudit source or test tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])openaudit[-@]v?[0-9]'
