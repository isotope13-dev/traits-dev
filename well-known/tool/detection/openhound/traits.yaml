# OpenHound / ConfigManBearPig — SpecterOps BloodHound OpenGraph collectors for Active Directory and SCCM.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl, python-sdist, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-distribution-name
    desc: OpenHound collector PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      regex: '^(configmanbearpig|openhound(-[a-z0-9-]+)?)$'

  - id: python-package-path
    desc: OpenHound collector Python package tree member
    for: [python, whl, text, markdown, json]
    if:
      type: path
      regex: '(^|[/])openhound(_[a-z0-9]+)?(/|$)'

  - id: openhound-framework-url
    desc: OpenHound upstream repository URL
    for: [python, pkginfo, markdown, text]
    if:
      type: text
      regex: 'github\.com/SpecterOps/(ConfigManBearPig|openhound)'

  - id: openhound-collector-summary
    desc: OpenHound collector package summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)OpenHound/BloodHound OpenGraph collector'

composite_rules:
  - id: openhound-collector-context
    desc: OpenHound BloodHound collector context
    crit: exception
    conf: 0.99
    scope: file
    for: [whl, python-sdist, pkginfo, python, tar, zip, scripts, data]
    any:
      - id: python-package-path
      - id: pypi-distribution-name
      - id: openhound-framework-url
      - id: openhound-collector-summary
