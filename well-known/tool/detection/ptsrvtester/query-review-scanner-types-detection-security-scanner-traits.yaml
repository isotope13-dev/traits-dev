defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: penterep-ptsrvtester-package
  desc: Penterep service security tester package
  crit: notable
  conf: 0.99
  for: [whl, python, pyc, lnk, zip, json]
  if:
    type: path
    regex: '(?i)ptsrvtester'
