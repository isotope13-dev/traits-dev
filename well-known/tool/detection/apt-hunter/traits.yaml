# APT-Hunter (ahmedkhlief/APT-Hunter) is an open-source Windows event log
# threat hunting tool. It detects APT movements and suspicious activity
# across Windows event logs (Sysmon, Security, System, PowerShell, Defender).
defaults:
  platforms: [windows, unix]
  for: [python, text, scripts, source, markdown, zip]
  crit: notable
  conf: 0.98

traits:
  - id: tool-banner-author
    desc: APT-Hunter banner author attribution
    for: [python, text]
    if:
      type: text
      regex: '(?i)Ahmed\s+Khlief\s*,\s*@ahmed_khlief'

  - id: event-detection-schema
    desc: APT-Hunter detection event table schema
    for: [python]
    if:
      type: text
      substr: "'Detection Rule':[],'Severity':[],'Detection Domain':[]"

  - id: module-imports
    desc: APT-Hunter detection module imports
    for: [python]
    if:
      type: text
      regex: '(?m)^import\s+lib\.(EvtxDetection|CSVDetection|EvtxHunt)\b'

  - id: security-detector-declaration
    desc: APT-Hunter Security event detector declaration
    for: [python]
    if:
      type: function
      exact: detect_events_security_log

  - id: system-detector-declaration
    desc: APT-Hunter System event detector declaration
    for: [python]
    if:
      type: function
      exact: detect_events_system_log

  - id: sysmon-detector-declaration
    desc: APT-Hunter Sysmon event detector declaration
    for: [python]
    if:
      type: function
      exact: detect_events_Sysmon_log

composite_rules:
  - id: apt-hunter-tool
    desc: APT-Hunter Windows event log threat hunting tool
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: event-detection-schema
      - id: module-imports

  - id: apt-hunter-event-detectors
    desc: APT-Hunter Windows event detection module
    for: [python]
    all:
      - id: security-detector-declaration
      - id: system-detector-declaration
      - id: sysmon-detector-declaration
