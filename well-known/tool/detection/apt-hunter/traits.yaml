# APT-Hunter (ahmedkhlief/APT-Hunter) is an open-source Windows event log
# threat hunting tool. It detects APT movements and suspicious activity
# across Windows event logs (Sysmon, Security, System, PowerShell, Defender).
defaults:
  platforms: [windows, unix]
  for: [python, text, scripts, source, markdown, zip]
  crit: notable
  conf: 0.98

traits:
  - id: source-archive-path
    desc: APT-Hunter source tree or archive path
    if:
      type: path
      substr: 'ahmedkhlief/APT-Hunter'

  - id: source-archive-basename
    desc: APT-Hunter GitHub release or module archive
    for: [zip]
    if:
      type: basename
      regex: '(?i)^github\.com-ahmedkhlief-APT-Hunter-v[0-9].*\.zip$'

  - id: repository-url
    desc: APT-Hunter GitHub repository reference
    for: [python, markdown, text]
    if:
      type: text
      substr: 'github.com/ahmedkhlief/APT-Hunter'

  - id: tool-banner-author
    desc: APT-Hunter banner author attribution
    for: [python, text]
    if:
      type: text
      regex: '(?i)Ahmed\s+Khlief\s*,\s*@ahmed_khlief'

  - id: event-detection-schema
    desc: APT-Hunter detection event table schema
    for: [python]
    if:
      type: text
      substr: "'Detection Rule':[],'Severity':[],'Detection Domain':[]"

  - id: module-imports
    desc: APT-Hunter detection module imports
    for: [python]
    if:
      type: text
      regex: '(?m)^import\s+lib\.(EvtxDetection|CSVDetection|EvtxHunt)\b'

composite_rules:
  - id: apt-hunter-tool
    desc: APT-Hunter Windows event log threat hunting tool
    crit: notable
    conf: 0.98
    any:
      - id: source-archive-path
      - id: source-archive-basename
      - id: repository-url
      - id: tool-banner-author
      - id: event-detection-schema
      - id: module-imports
