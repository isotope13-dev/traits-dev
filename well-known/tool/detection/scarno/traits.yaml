defaults:
  platforms: [unix, windows]
traits:
- id: scarno-pypi-package
  desc: Scarno PyPI package identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: scarno
- id: scarno-project-repository
  desc: Scarno project repository identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/BrettCrawley/scarno
- id: scarno-python-module
  desc: Scarno Python module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    regex: '^scarno(\.|$)'
- id: scarno-catalog-rules-source
  desc: Scarno rule catalog source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: RULES
- id: scarno-catalog-engine-source
  desc: Scarno finding engine source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: _RuleContext
- id: scarno-catalog-html-source
  desc: Scarno HTML detector catalog source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: _CDN_PATTERNS
- id: scarno-catalog-cli-source
  desc: Scarno CLI detector lookup table source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: CLI_TOOL_TO_PACKAGE
- id: scarno-catalog-import-source
  desc: Scarno import alias lookup table source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: IMPORT_ALIASES
- id: scarno-catalog-dependency-source
  desc: Scarno dependency parser catalog source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: _STUB_REASON
- id: scarno-catalog-javascript-source
  desc: Scarno JavaScript detector source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: source analyser
- id: scarno-security-version-source
  desc: Scarno version-word lookup source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    substr: _VERSION_RESERVED_WORDS
- id: scarno-http-client-source
  desc: Scarno optional HTTPS artifact client source
  crit: component
  conf: 0.99
  for: [python]
  if:
    type: text
    regex: 'http\.client\.HTTPSConnection'
composite_rules:
- id: scarno-defensive-catalog-source
  desc: Scarno source file containing defensive detection catalogs
  crit: component
  conf: 0.99
  for: [python]
  any:
    - id: scarno-catalog-rules-source
    - id: scarno-catalog-engine-source
    - id: scarno-catalog-html-source
    - id: scarno-catalog-cli-source
    - id: scarno-catalog-import-source
    - id: scarno-catalog-dependency-source
    - id: scarno-catalog-javascript-source
- id: scarno-defensive-scanner-context
  desc: Recognized Scarno dependency scanner context
  crit: exception
  conf: 0.99
  for: [pkginfo, python, whl]
  all:
    - id: scarno-pypi-package
    - id: scarno-project-repository
  scope: archive
- id: scarno-source-archive-context
  desc: Recognized Scarno scanner source archive
  crit: notable
  conf: 0.99
  scope: archive
  all:
    - id: scarno-project-repository
  any:
    - id: scarno-defensive-catalog-source
    - id: scarno-security-version-source
    - id: scarno-http-client-source
