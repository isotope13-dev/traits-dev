defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: titus-defensive-secret-scanner-context
  desc: Titus secret scanner and embedded rule catalog
  crit: exception
  conf: 0.99
  size_max: 30000000
  for:
  - pe
  - elf
  - macho
  all:
  - id: well-known/tool/detection/titus::titus-secret-scan-implementation
  - id: micro-behaviors/data/string/search::kingfisher-secret-pattern-corpus
