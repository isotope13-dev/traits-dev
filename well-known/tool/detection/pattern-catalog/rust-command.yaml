# Rust command-pattern catalogs. A classifier keeps its patterns either as a
# scored rule table or as plain string-slice constants read by a substring
# matcher. Each shape requires its own table and its use, and neither exempts
# a file that spawns a process.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
traits:
  - id: rust-scored-command-rule-schema
    desc: Scored command pattern rule schema
    if:
      type: text
      regex: '(?s)struct Rule\s*\{[^}]{1,300}weight:\s*u8,[^}]{1,150}pattern:\s*&'
  - id: rust-rule-pattern-compilation
    desc: Rule table patterns compiled for matching
    if:
      type: text
      regex: '\w+\.iter\(\)\.map\(\|\w+\|\s*\(\w+,\s*\w+\(\w+\.pattern\)'
  # Several named string-slice tables: one constant is ordinary data, a set
  # of them with a matcher over them is a pattern catalog.
  - id: rust-str-slice-pattern-table
    desc: Rust named string-slice pattern table
    count_min: 2
    if:
      type: text
      regex: 'pub const [A-Z0-9_]{3,60}: &\[&str\] = &\['
  - id: rust-substring-matcher-fn
    desc: Rust bool fn taking a &str argument
    if:
      type: text
      regex: 'pub fn is_[a-z_]{3,40}\(\w{1,20}: &str\) -> bool'
  - id: rust-table-substring-iter
    desc: Iterates table testing substring containment
    if:
      type: text
      regex: '\.iter\(\)\s{1,16}\.any\(\|\w{1,8}\| \w{1,20}\.contains\(&\w{1,8}\.to_ascii_lowercase\(\)'
composite_rules:
  - id: rust-command-rule-catalog
    desc: Rust command pattern table with matcher or scorer
    crit: notable
    any:
      - id: rust-scored-command-table
      - id: rust-string-table-matcher
    unless:
      - id: micro-behaviors/process/create/subprocess/reference::rust-process-command-reference
  - id: rust-scored-command-table
    desc: Scored command rule table compiled for matching
    crit: component
    all:
      - id: rust-scored-command-rule-schema
      - id: rust-rule-pattern-compilation
  - id: rust-string-table-matcher
    desc: String-slice pattern tables with substring matcher
    crit: component
    all:
      - id: rust-str-slice-pattern-table
      - id: rust-substring-matcher-fn
      - id: rust-table-substring-iter
