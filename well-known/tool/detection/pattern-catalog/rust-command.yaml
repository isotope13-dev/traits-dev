# A command-line classifier stores scored regex rules and compiles their
# patterns for inspection. Require both the table schema and its use.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
traits:
  - id: rust-scored-command-rule-schema
    desc: Scored command pattern rule schema
    if:
      type: text
      regex: '(?s)struct Rule\s*\{[^}]{1,300}weight:\s*u8,[^}]{1,150}pattern:\s*&'
  - id: rust-rule-pattern-compilation
    desc: Rule table patterns compiled for matching
    if:
      type: text
      regex: '\w+\.iter\(\)\.map\(\|\w+\|\s*\(\w+,\s*\w+\(\w+\.pattern\)'
  - id: rust-command-process-launch
    desc: Rust process command launch reference
    if:
      type: text
      regex: '(Command::new|process::Command|std::process|tokio::process)'
composite_rules:
  - id: rust-command-rule-catalog
    desc: Rust scored command classifier rule table
    crit: notable
    all:
      - id: rust-scored-command-rule-schema
      - id: rust-rule-pattern-compilation
    unless:
      - id: rust-command-process-launch
