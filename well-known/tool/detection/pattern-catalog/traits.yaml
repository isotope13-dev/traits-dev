# Defensive tools that carry their detection patterns as source constants.
#
# A scanner, guardrail or audit module written in Python keeps the things it
# hunts for in an upper-snake module constant:
#
#   _DANGEROUS_COMMAND_SUBSTRINGS: Final[tuple[str, ...]] = (
#       "/dev/tcp/", "$(base64", "iptables -F", "ufw disable", "setenforce 0",
#   )
#
# Every entry is a real attack string, so the impact/degrade and
# credential-access objectives fire on the catalog exactly as they would on the
# attack. What separates the two is the declaration: the strings are named,
# collected, and never executed.
#
# Keyed on the naming convention rather than on any one tool's constant --
# well-known/tool/detection/security-scanner already carries BLOCKED_COMMANDS
# and BLOCKED_COMMAND_PATTERNS by exact name, which misses the next tool that
# spells it _DANGEROUS_COMMAND_PREFIXES (bernstein) or MALICIOUS_PATTERNS.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
  size_min: 200

traits:
  - id: danger-catalog-constant
    desc: Module constant naming dangerous patterns
    if:
      type: text
      # Require a pattern/command/signature catalog, not an application's
      # ordinary BLOCKED_PATHS, BLOCKED_EXTENSIONS, or UI state constants.
      regex: '(?m)^_?(DANGEROUS|MALICIOUS|BLOCKED)_(COMMAND|PATTERN|SIGNATURE)[A-Z0-9_]*[ ]*[:=]'

  - id: suspicion-catalog-constant
    desc: Module constant naming suspicious patterns
    if:
      type: text
      regex: '(?m)^_?(SUSPICIOUS|RISKY|FORBIDDEN)_(COMMAND|PATTERN|SIGNATURE)[A-Z0-9_]*[ ]*[:=]'

# The JavaScript/TypeScript spelling of the same catalog. A command-permission
# classifier keeps its deny-list in exported upper-snake constants, and the
# modules that screen against it name those constants again -- so the
# identifier, not a declaration anchor, identifies both the catalog and its
# callers. Every attack string in such a file is quoted data or comment text
# describing what to refuse; none of it is executed.
#
# Worked example: MiniMax Code's bundled `@mavis/permission`, whose
# classifier/dangerous-patterns.{js,ts} carries 145 `{pattern, category,
# description}` rows and whose tools/bash-safety-scan.{js,ts} documents in a
# comment the `base64 -d | bash` encoding-bypass category it screens for. The
# decode-and-pipe rule read that comment as the payload.
  # No leading \b: the identifier is routinely reached through a prefixed
  # spelling (`ALL_DANGEROUS_COMMAND_PATTERNS`), and `_` is a word character,
  # so anchoring the front matched only the unprefixed declaration and missed
  # every module that consumes the catalog by name.
  - id: js-dangerous-pattern-catalog-const
    desc: JS dangerous-command pattern constant
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    size_min: 200
    if:
      type: text
      regex: 'DANGEROUS_[A-Z0-9_]{0,20}PATTERNS\b'
  - id: js-blocked-pattern-catalog-const
    desc: JS blocked-command pattern constant
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    size_min: 200
    if:
      type: text
      regex: 'BLOCKED_[A-Z0-9_]{0,20}PATTERNS\b'

composite_rules:
  # Two independently-named catalogs in one module: a scanner enumerating what
  # it looks for, not a program doing it.
  - id: source-pattern-catalog
    desc: Defensive source pattern catalog module
    crit: exception
    conf: 0.95
    all:
      - id: danger-catalog-constant
      - id: suspicion-catalog-constant


  # Either spelling of the deny-list identifier. One is enough: a module that
  # names a dangerous- or blocked-command pattern set is either the catalog or
  # the scanner consuming it, and in both the attack strings are subject
  # matter rather than instructions.
  - id: js-command-deny-list-catalog
    desc: JS command deny-list catalog module
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    any:
      - id: js-dangerous-pattern-catalog-const
      - id: js-blocked-pattern-catalog-const
