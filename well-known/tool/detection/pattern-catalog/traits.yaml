# Defensive tools that carry their detection patterns as source constants.
#
# A scanner, guardrail or audit module written in Python keeps the things it
# hunts for in an upper-snake module constant:
#
#   _DANGEROUS_COMMAND_SUBSTRINGS: Final[tuple[str, ...]] = (
#       "/dev/tcp/", "$(base64", "iptables -F", "ufw disable", "setenforce 0",
#   )
#
# Every entry is a real attack string, so the impact/degrade and
# credential-access objectives fire on the catalog exactly as they would on the
# attack. What separates the two is the declaration: the strings are named,
# collected, and never executed.
#
# Keyed on the naming convention rather than on any one tool's constant --
# well-known/tool/detection/security-scanner already carries BLOCKED_COMMANDS
# and BLOCKED_COMMAND_PATTERNS by exact name, which misses the next tool that
# spells it _DANGEROUS_COMMAND_PREFIXES (bernstein) or MALICIOUS_PATTERNS.
defaults:
  platforms: [unix, windows]
traits:
  - id: danger-catalog-constant
    for: [python]
    crit: notable
    conf: 0.9
    size_min: 200
    desc: Module constant naming dangerous patterns
    if:
      type: text
      # Require a pattern/command/signature catalog, not an application's
      # ordinary BLOCKED_PATHS, BLOCKED_EXTENSIONS, or UI state constants.
      regex: '(?m)^_?(DANGEROUS|MALICIOUS|BLOCKED)_(COMMAND|PATTERN|SIGNATURE)[A-Z0-9_]*[ ]*[:=]'
  - id: suspicion-catalog-constant
    for: [python]
    crit: notable
    conf: 0.9
    size_min: 200
    desc: Module constant naming suspicious patterns
    if:
      type: text
      regex: '(?m)^_?(SUSPICIOUS|RISKY|FORBIDDEN)_(COMMAND|PATTERN|SIGNATURE)[A-Z0-9_]*[ ]*[:=]'

  # A generated ATT&CK technique map: one entry per technique, each carrying
  # MITRE's own prose description. Those descriptions quote the commands the
  # technique uses ("vssadmin delete shadows", "wevtutil cl"), so the impact
  # and ransomware objectives fire on the reference data. Assemblyline ships
  # `assemblyline/common/attack_map.py` with ~1200 entries this way.
  - id: attack-technique-map-module
    desc: ATT&CK technique map data module
    for: [python, json, data]
    crit: notable
    conf: 0.95
    count_min: 20
    if:
      type: text
      substr: 'attack_id'

  # The Rust spelling: a scanner keeps its rules as a table of tuples --
  # (id, regex, severity, description) -- so a severity enum sits beside every
  # attack pattern it catalogs. symbi-runtime's src/skills/scanner.rs lists its
  # reverse-shell, exfiltration and privilege patterns exactly this way, which
  # is why the netcat and /dev/tcp objectives fire on the scanner itself.
  # Several entries are required: one `Severity::Critical` is an ordinary enum
  # use, a table of them is a catalog.
  - id: rust-scan-severity-rule-table
    for: [rust]
    crit: notable
    conf: 0.92
    size_min: 200
    count_min: 3
    desc: Rust scanner severity rule table
    if:
      # No alternation: the bare substring matches `ScanSeverity::Critical`
      # and `Severity::Critical` alike, and `count_min` then means what it
      # says -- three rows of a table, not three ways to spell one row.
      type: text
      substr: 'Severity::Critical'

# The JavaScript/TypeScript spelling of the same catalog. A command-permission
# classifier keeps its deny-list in exported upper-snake constants, and the
# modules that screen against it name those constants again -- so the
# identifier, not a declaration anchor, identifies both the catalog and its
# callers. Every attack string in such a file is quoted data or comment text
# describing what to refuse; none of it is executed.
#
# Worked example: MiniMax Code's bundled `@mavis/permission`, whose
# classifier/dangerous-patterns.{js,ts} carries 145 `{pattern, category,
# description}` rows and whose tools/bash-safety-scan.{js,ts} documents in a
# comment the `base64 -d | bash` encoding-bypass category it screens for. The
# decode-and-pipe rule read that comment as the payload.
  # No leading \b: the identifier is routinely reached through a prefixed
  # spelling (`ALL_DANGEROUS_COMMAND_PATTERNS`), and `_` is a word character,
  # so anchoring the front matched only the unprefixed declaration and missed
  # every module that consumes the catalog by name.
  - id: js-dangerous-pattern-catalog-const
    desc: JS dangerous-command pattern constant
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    size_min: 200
    if:
      type: text
      regex: 'DANGEROUS_[A-Z0-9_]{0,20}PATTERNS\b'
  - id: js-blocked-pattern-catalog-const
    desc: JS blocked-command pattern constant
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    size_min: 200
    if:
      type: text
      regex: 'BLOCKED_[A-Z0-9_]{0,20}PATTERNS\b'
  # Compiled policy engines embed their rule corpus as data. Requiring both
  # the repeated baseline-deny rule headers and repeated DENY directives
  # distinguishes that corpus from a program containing one dangerous
  # command or one user-facing "deny" message.
  - id: baseline-deny-rule-catalog
    size_min: 200
    desc: Embedded baseline-deny policy rule catalog
    crit: notable
    conf: 0.98
    for: [binaries]
    count_min: 3
    if:
      type: text
      regex: 'rule baseline-deny-[a-z0-9-]{3,60} \{'
  - id: repeated-execution-deny-directives
    size_min: 200
    desc: Repeated policy DSL execution-deny directives
    crit: notable
    conf: 0.96
    for: [binaries]
    count_min: 3
    if:
      type: text
      regex: '(?m)^[ \t]+DENY execution[ \t]*$'
  # A detection-rule corpus carries its own labeled verification examples: the
  # `true_positive:` / `false_positive:` blocks are the rule file's test
  # fixtures. Attack-indicator strings inside those blocks are the subject
  # matter of the scanner, not behavior of the enclosing file.
  - id: detection-rule-example-corpus
    size_max: 5000000
    desc: Detection rules with labeled examples
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, text, json]
    if:
      type: text
      regex: '(?is)true_positive:.{0,600}false_positive:'
  - id: python-vulnerability-pattern-catalog
    size_max: 5000000
    desc: Python vulnerability pattern catalog
    crit: notable
    conf: 0.94
    for:
    - python
    if:
      type: text
      regex: 'VULNERABILITY_PATTERNS\s*='
  - id: audit-pattern-rules-constant
    size_max: 5000000
    desc: AUDIT_PATTERN_RULES sync table constant
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: AUDIT_PATTERN_RULES
  - id: namedtuple-rule-record-schema
    size_max: 5000000
    desc: namedtuple Rule audit record schema
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'Rule\s*=\s*namedtuple\(\s*["'']Rule["'']'
  - id: code-critical-pattern-constant
    size_max: 5000000
    desc: Critical code-pattern constant
    crit: notable
    conf: 0.96
    for:
    - python
    if:
      type: text
      substr: CODE_CRITICAL_PATTERNS
  - id: code-high-pattern-constant
    size_max: 5000000
    desc: High code-pattern constant
    crit: notable
    conf: 0.96
    for:
    - python
    if:
      type: text
      substr: CODE_HIGH_PATTERNS
  - id: python-taint-sink-map
    size_max: 5000000
    desc: Python static taint sink map
    crit: notable
    conf: 0.96
    for:
    - python
    if:
      type: text
      regex: '\bSINKS\s*:\s*(Dict|dict)\s*\['
  - id: integration-secret-pattern-catalog
    size_max: 5000000
    desc: Integration secret pattern catalog
    crit: notable
    conf: 0.93
    for:
    - python
    if:
      type: text
      regex: "INTEGRATION_PATTERNS[\\s\\S]{0,800}(DISCORD_TOKEN|SLACK_TOKEN|GITHUB_TOKEN)"
  - id: defensive-prompt-pattern-vars
    for: [scripts, source, documents]
    size_max: 5000000
    desc: Defensive prompt pattern variables
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: PROMPT_INJECTION_(PATTERNS|MARKERS)
      case_insensitive: true
  - id: defensive-threat-signature-doc
    for: [scripts, source, documents]
    size_max: 5000000
    desc: Defensive threat signature documentation
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: Built-in threat signatures|tool call details
      case_insensitive: true
  - id: defensive-threat-label-anti-mining
    for: [scripts, source, documents]
    size_max: 5000000
    desc: Defensive anti-mining label
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: anti-mining
      case_insensitive: true
  - id: defensive-threat-labels
    for: [scripts, source, documents]
    size_max: 5000000
    desc: Defensive threat label catalog
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "(?is)anti-trojan.{0,300}reverse_shell"
      case_insensitive: true
  - id: agent-risk-category-table
    size_max: 5000000
    desc: Agent action risk category table
    crit: notable
    conf: 0.9
    for:
    - python
    if:
      type: text
      regex: 'secret-read.{0,500}network-egress.{0,500}fs-destructive'
  - id: wordpress-threat-pattern-catalog
    size_max: 5000000
    desc: WordPress threat pattern catalog
    crit: notable
    conf: 0.95
    for:
    - php
    if:
      type: text
      regex: "rule_id.{0,160}(webshell|backdoor|malware|signature)"
      case_insensitive: true
  - id: wordpress-yara-signature-scanner
    size_max: 5000000
    desc: WordPress YARA signature scanner
    crit: notable
    conf: 0.94
    for:
    - php
    if:
      type: text
      regex: "\\b(yara[-_ ]?scanner|signature[-_ ]?sync)\\b"
      case_insensitive: true
  - id: php-regex-signature-label-array
    size_max: 5000000
    desc: PHP regex-to-label signature array
    crit: notable
    conf: 0.9
    for:
    - php
    if:
      type: text
      regex: "['\"]\\s*=>\\s*\\[\\s*['\"]name['\"]\\s*=>\\s*['\"][a-z0-9_]+['\"]\\s*,\\s*['\"]label['\"]\\s*=>"
  # A PHP scanner's signature database is a table of rule entries, each with
  # a namespaced id (VENDOR-KIND-NNN), a detection regex under 'pattern' and
  # a 'severity' grade. Attack code carries none of that schema: the id
  # numbering and severity field exist to be scored and reported, which only
  # detection logic does. The composite requires all three so a lone
  # 'severity' or a list of product codes does not read as scanner context.
  - id: risk-definition-constructor-call
    size_max: 5000000
    desc: Risk definition constructor call
    for:
    - python
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: RiskDefinition
  # Static pre-install audit scanners keep their detection regexes in a
  # namedtuple-backed table (id, detector, severity, pattern, …). Every
  # pattern string is quoted rule data, not code the module executes.
  - id: python-audit-rule-namedtuple-schema
    desc: Python audit Rule namedtuple schema
    for: [python]
    crit: notable
    conf: 0.97
    size_min: 200
    if:
      type: text
      substr: 'namedtuple("Rule", ["id", "detector", "severity", "pattern"'
  - id: python-audit-pattern-rules-block
    desc: Python AUDIT_PATTERN_RULES table
    for: [python]
    crit: notable
    conf: 0.97
    size_min: 200
    if:
      type: text
      substr: AUDIT_PATTERN_RULES
  - id: js-fetcher-command-set
    desc: JS set of network fetch command names
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new Set\(\[\s*[''"]curl[''"],\s*[''"]wget[''"]'
  - id: js-decoder-command-set
    desc: JS set of decoder command names
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new Set\(\[\s*[''"]base64[''"]'
  - id: js-shell-executor-set
    desc: JS set of shell interpreter names
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new Set\(\[\s*[''"]sh[''"],\s*[''"]bash[''"]'
composite_rules:
  # The PHP scanner signature database: a namespaced rule-id table with
  # detection regexes and severity grades. Attack code carries no reporting
  # schema, so requiring all three keys distinguishes scanner rule tables
  # from config that merely quotes one of them.
  - id: php-scanner-signature-rule-table
    desc: PHP scanner signature rule table
    crit: exception
    conf: 0.95
    for: [php]
    size_max: 5000000
    all:
      - id: metadata/lang/source::php-scanner-rule-id-entries
      - id: metadata/lang/source::php-scanner-rule-pattern-key
      - id: metadata/lang/source::php-scanner-rule-severity-key
  - id: python-namedtuple-audit-rules-catalog
    for: [python]
    size_min: 200
    desc: Python namedtuple audit rules catalog module
    crit: exception
    conf: 0.98
    all:
      - id: audit-pattern-rules-constant
      - id: namedtuple-rule-record-schema
  # Two independently-named catalogs in one module: a scanner enumerating what
  # it looks for, not a program doing it.
  - id: source-pattern-catalog
    for: [python]
    size_min: 200
    desc: Defensive source pattern catalog module
    crit: exception
    conf: 0.95
    all:
      - id: danger-catalog-constant
      - id: suspicion-catalog-constant
  - id: python-static-audit-rule-catalog
    for: [python]
    size_min: 500
    desc: Python static audit pattern rule catalog
    crit: exception
    conf: 0.98
    all:
      - id: python-audit-rule-namedtuple-schema
      - id: python-audit-pattern-rules-block
  - id: embedded-deny-policy-catalog
    size_min: 200
    desc: Compiled defensive deny-policy catalog
    crit: exception
    conf: 0.99
    for: [binaries]
    all:
      - id: baseline-deny-rule-catalog
      - id: repeated-execution-deny-directives
  # Either spelling of the deny-list identifier. One is enough: a module that
  # names a dangerous- or blocked-command pattern set is either the catalog or
  # the scanner consuming it, and in both the attack strings are subject
  # matter rather than instructions.
  - id: js-command-deny-list-catalog
    size_min: 200
    desc: JS command deny-list catalog module
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    any:
      - id: js-dangerous-pattern-catalog-const
      - id: js-blocked-pattern-catalog-const
  # A fetch/decode/exec guard keeps three command-class sets and quotes the
  # pipelines it blocks. The sets are the catalog; the quoted pipelines are
  # not commands this module runs.
  - id: js-fetch-decode-shell-classifier
    desc: JS module classifies fetch, decode, and shell commands
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: js-fetcher-command-set
      - id: js-decoder-command-set
      - id: js-shell-executor-set
