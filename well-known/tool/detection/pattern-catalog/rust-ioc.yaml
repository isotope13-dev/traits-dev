# Rust defensive catalogs that keep indicator or attack data as tables of
# records. Two shapes are recognized, and each requires many rows of its
# record fields so a single hand-written string is not exempted:
#  - a generated vulnerable-driver table (struct literal plus category enum);
#  - an attack-action table pairing each attacker action with its detection hint.
# The records are reference data the module never executes.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
traits:
  - id: rust-driver-record-literal
    desc: Rust vulnerable driver record literal
    count_min: 20
    if:
      type: text
      substr: 'VulnerableDriver { file_basename: "'
  - id: rust-driver-category-field
    desc: Driver category enum on record literal
    count_min: 20
    if:
      type: text
      substr: 'category: DriverCategory::'
  # An attack-action catalog pairs each attacker action with the detection hint
  # for it. Both fields recur in every record, so the pair identifies the table.
  - id: rust-attacker-action-field
    desc: Attacker action field on catalog records
    count_min: 5
    if:
      type: text
      substr: 'attacker_action: "'
  - id: rust-detection-hint-field
    desc: Detection hint field on catalog records
    count_min: 5
    if:
      type: text
      substr: 'detection_hint: "'
composite_rules:
  - id: rust-driver-record-catalog
    desc: Generated Rust vulnerable-driver record table
    crit: exception
    all:
      - id: rust-driver-record-literal
      - id: rust-driver-category-field
  - id: rust-attack-action-catalog
    desc: Attacker-action records paired with detection hints
    crit: exception
    all:
      - id: rust-attacker-action-field
      - id: rust-detection-hint-field
