# Source-defined tables and matcher APIs, rather than package filenames, identify
# these defensive modules. Their attack strings are compared with input content;
# they are not payloads. Each exception is file-local and needs two observations.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
  - id: ioc-blocklist-check-function
    desc: IOC blocklist content-check function
    if:
      type: function
      exact: checkIOCBlocklist
  - id: ioc-domain-table-member
    desc: Exported known-C2 domain table
    if:
      type: symbol
      kind: member
      exact: exports.KNOWN_C2_DOMAINS
  - id: threat-feed-update-function
    desc: Threat-feed update function
    if:
      type: function
      exact: updateThreatFeed
  - id: repeated-scored-ioc-records
    desc: Repeated confidence-scored threat IOC records
    count_min: 10
    if:
      type: text
      regex: 'severity: "critical", confidence: [0-9.]+, family:'
  - id: pattern-content-match-function
    desc: Pattern-table content matching function
    if:
      type: function
      exact: matchPatternInContent
  - id: exported-pattern-rule-table
    desc: Exported ALL_PATTERN_RULES detection table
    if:
      type: symbol
      kind: member
      exact: exports.ALL_PATTERN_RULES
  - id: pattern-rule-table-declaration
    desc: Type declaration for exported detection rules
    if:
      type: text
      substr: 'export declare const ALL_PATTERN_RULES:'
  - id: pattern-matcher-api-declaration
    desc: Type declaration for pattern matching API
    if:
      type: text
      substr: 'export declare function matchPatternInContent('
  - id: skill-content-scan-function
    desc: Agent skill content scanning function
    if:
      type: function
      exact: scanSkillContent
  - id: script-content-scan-function
    desc: Agent script content scanning function
    if:
      type: function
      exact: scanScriptContent
  - id: download-exec-matcher-table
    desc: Exported download-execution matcher table
    if:
      type: symbol
      kind: member
      exact: exports.DOWNLOAD_EXEC_MATCHERS
  - id: skill-scan-patterns-table
    desc: Exported skill-scan patterns table
    if:
      type: symbol
      kind: member
      exact: exports.SKILL_SCAN_PATTERNS
  - id: script-scan-patterns-table
    desc: Exported script-scan patterns table
    if:
      type: symbol
      kind: member
      exact: exports.SCRIPT_SCAN_PATTERNS
  - id: honeytoken-access-check-function
    desc: Honeytoken access checking function
    if:
      type: function
      exact: checkHoneytokenAccess
  - id: honeytoken-env-generator-function
    desc: Simulated honeytoken environment generator
    if:
      type: function
      exact: getHoneytokenEnv
  - id: security-blacklist-config-export
    desc: Exported security blacklist config table
    if:
      type: text
      regex: 'export\s+(const|default)\s+\w*(BLACKLIST|Blacklist|blocklist|Blocklist)\w*\s*[:=]'
  - id: security-blacklist-intervention-doc
    desc: Blocklist documents human-intervention blocking
    if:
      type: text
      regex: '(?i)block execution.{0,120}human intervention|require human intervention'
  - id: defensive-incident-threat-reference-doc
    desc: Defensive incident threat reference doc
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: patterns to grep for defensively
  - id: supply-chain-typosquat-grep-example
    desc: Defensive typosquat domain grep examples
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)typosquat domains in configs.{0,200}aquasecur'
  - id: malware-service-disguise-grep-example
    desc: Defensive disguised-service grep examples
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)disguised as monitoring.{0,120}pgmon'
  - id: incident-cve-references
    desc: Cited CVE identifiers in threat prose
    crit: notable
    conf: 0.95
    # Incident briefings cite several advisories; two identifiers distinguish
    # a curated briefing from a single incidental mention.
    count_min: 2
    if:
      type: text
      regex: '\bCVE-[0-9]{4}-[0-9]{4,}\b'

composite_rules:
  - id: js-ioc-blocklist-catalog
    desc: Defensive IOC blocklist and content matcher
    crit: exception
    all:
      - id: ioc-blocklist-check-function
      - id: ioc-domain-table-member
  - id: js-scored-threat-feed-catalog
    desc: Defensive scored threat feed and updater
    crit: exception
    all:
      - id: threat-feed-update-function
      - id: repeated-scored-ioc-records
  - id: js-detection-pattern-table
    desc: Defensive pattern table and content matcher
    crit: exception
    all:
      - id: pattern-content-match-function
      - id: exported-pattern-rule-table
  - id: js-detection-pattern-declarations
    desc: Defensive pattern-table type declarations
    crit: exception
    all:
      - id: pattern-rule-table-declaration
      - id: pattern-matcher-api-declaration
  - id: js-agent-skill-detection-module
    desc: Defensive agent skill scanner and matcher table
    crit: exception
    all:
      - id: skill-content-scan-function
    any:
      - id: download-exec-matcher-table
      - id: skill-scan-patterns-table
  - id: js-agent-script-detection-module
    desc: Defensive agent script scanner and matcher table
    crit: exception
    all:
      - id: script-content-scan-function
      - id: script-scan-patterns-table
  - id: js-honeytoken-simulator
    desc: Defensive honeytoken simulator and access checker
    crit: notable
    all:
      - id: honeytoken-access-check-function
      - id: honeytoken-env-generator-function
  - id: js-security-blacklist-catalog
    desc: Defensive JS agent security blacklist config
    crit: exception
    all:
      - id: security-blacklist-config-export
      - id: security-blacklist-intervention-doc
  # Restores this file's two-observation contract: the defensive-grep prose
  # alone is a phrase; paired with multiple cited advisories it identifies
  # a curated incident briefing, not payload prose.
  - id: defensive-incident-threat-briefing
    desc: Defensive incident briefing with CVE citations
    crit: exception
    all:
      - id: defensive-incident-threat-reference-doc
      - id: incident-cve-references
  - id: js-threat-data-catalog
    desc: Defensive JavaScript IOC or detection-pattern catalog
    crit: exception
    any:
      - id: js-ioc-blocklist-catalog
      - id: js-scored-threat-feed-catalog
      - id: js-detection-pattern-table
      - id: js-detection-pattern-declarations
      - id: js-agent-skill-detection-module
      - id: js-agent-script-detection-module
      - id: js-security-blacklist-catalog
      - id: defensive-incident-threat-briefing
