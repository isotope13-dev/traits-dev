defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.98
  size_min: 1000
  size_max: 120000000

traits:
  - id: wireshark-artifact-path
    crit: notable
    desc: Wireshark installer artifact path
    for: [pe, dll, batch, scripts, binaries]
    size_min: 0
    if:
      type: path
      substr: Wireshark-
  - id: usbpcap-installer-artifact-path
    crit: notable
    desc: USBPcap installer artifact path
    if:
      type: path
      substr: USBPcapSetup-
  - id: wireshark-product-name
    crit: notable
    desc: Wireshark PE product metadata
    for: [pe]
    size_min: 1000000
    if:
      type: value
      path: pe.version.product_name
      exact: Wireshark
  - id: wireshark-authenticode-subject
    crit: notable
    desc: Claims Wireshark Foundation signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)CN=Wireshark Foundation'
composite_rules:
  - id: wireshark-official-installer-context
    desc: Official Wireshark installer context
    crit: notable
    conf: 0.99
    any:
      - id: wireshark-artifact-path
      - id: usbpcap-installer-artifact-path
      - id: wireshark-product-name
  - id: signed-wireshark-release-context
    desc: Wireshark identity with intact verified signature
    crit: exception
    conf: 0.99
    all:
      - id: wireshark-authenticode-subject
      - id: metadata/signature/verified/
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
    any:
      - id: wireshark-artifact-path
      - id: wireshark-product-name
