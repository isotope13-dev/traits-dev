# AgentWall is an MCP/agent tool-call firewall.  Its manual test scripts feed
# credential paths (~/.ssh/id_rsa, .aws/credentials) to the proxy as tools/call
# arguments and assert a "Policy violation" block; the paths are test inputs
# the firewall must refuse, not keys being harvested.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: tools-call-jsonrpc-payload
    desc: JSON-RPC tools/call request payload
    if:
      type: text
      regex: '"method"\s*:\s*"tools/call"'

  - id: policy-violation-block-assertion
    desc: Asserts a Policy violation block message
    if:
      type: text
      substr: Policy violation

composite_rules:
  - id: tool-call-policy-block-test-harness
    desc: Test harness asserting tool-call policy blocks
    crit: exception
    all:
      - id: tools-call-jsonrpc-payload
      - id: policy-violation-block-assertion
