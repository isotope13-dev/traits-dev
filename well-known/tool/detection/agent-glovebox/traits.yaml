# agent-glovebox — defensive AI-agent sandbox (AlexanderMattTurner/agent-glovebox).
# Ships staticscan_fixtures/ with intentional reverse-shell / eval payloads used to
# grade its own scanner; those vectors are test corpus, not executable malware.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, python, json, archives, npm, tar, shell, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: agent-glovebox npm package name
    for: [package.json]
    size_min: 1
    if:
      type: value
      path: name
      exact: agent-glovebox

  - id: release-tree-path
    desc: Path under agent-glovebox release tree
    # Fires on every member of the published tarball so file-scoped unless
    # clauses can recognize defensive-scanner fixtures without archive pooling.
    # Basename-only matcher (≤2 '/' separators) so path-brittle stays green.
    # Include text/python/js: monitor-policy.txt, vendor redactor, and hook tests
    # all live under the release tree and need identity for unless: clauses.
    for: [scripts, source, manifests, json, package.json, plist, systemd-service, archives, tar, npm, binaries, text, markdown, python, javascript, typescript]

    size_min: 1
    if:
      type: path
      regex: 'agent-glovebox-[0-9]'

  - id: upstream-repository
    desc: agent-glovebox GitHub upstream repository
    size_min: 1
    if:
      type: text
      substr: github.com/AlexanderMattTurner/agent-glovebox

  - id: glovebox-dir-env
    desc: agent-glovebox install directory env var
    for: [javascript, typescript, python, json, shell]
    size_min: 1
    if:
      type: text
      substr: _GLOVEBOX_DIR

  - id: glovebox-skip-monitor-flag
    desc: agent-glovebox monitor skip permission flag
    for: [json]
    size_min: 1
    if:
      type: text
      substr: GLOVEBOX_DANGEROUSLY_SKIP_MONITOR

  - id: staticscan-fixture-dirname
    desc: agent-glovebox staticscan fixture directory
    for: [python, javascript, typescript, shell]
    size_min: 1
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])staticscan_fixtures([\\/]|$)'

  - id: reverse-shell-fixture-host
    desc: Scanner fixture uses attacker.test C2 host
    for: [python]
    size_min: 1
    if:
      type: literal
      substr: attacker.test

  - id: eval-decoded-fixture-call
    desc: Scanner fixture evals base64-decoded payload
    for: [javascript, typescript]
    size_min: 1
    if:
      type: text
      substr: 'eval(atob(payload))'

composite_rules:
  - id: package-identity
    desc: Recognized agent-glovebox defensive sandbox package
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: package-name
      - id: release-tree-path
      - id: upstream-repository
      - id: glovebox-dir-env
      - id: glovebox-skip-monitor-flag

  # File-local: path under the published release tree, or the package.json name.
  - id: archive-context
    desc: agent-glovebox archive benign context
    crit: exception
    conf: 0.99
    for: [scripts, source, manifests, json, package.json, plist, systemd-service, archives, tar, npm, binaries, text, markdown, python, javascript, typescript]

    any:
      - id: release-tree-path
      - id: package-name

  - id: glovebox-hook-settings-context
    desc: agent-glovebox SessionStart hook settings context
    crit: exception
    conf: 0.99
    for: [json]
    any:
      - id: glovebox-dir-env
      - id: glovebox-skip-monitor-flag

  - id: staticscan-reverse-shell-fixture-context
    desc: agent-glovebox reverse-shell scanner test fixture
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: staticscan-fixture-dirname
      - id: reverse-shell-fixture-host

  - id: staticscan-eval-payload-fixture-context
    desc: agent-glovebox eval-payload scanner test fixture
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: staticscan-fixture-dirname
      - id: eval-decoded-fixture-call
