defaults:
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - yaml

# argus-languages ships its own rule files, and those rule files quote the
# attack text they detect as regex patterns. The `argus-ignore` suppression
# directive and the `languages: [agent-rules]` rule tag appear only in that
# scanner's rule corpus, so the pair identifies the scanner's own rule source.

traits:
- id: argus-ignore-directive-text
  desc: argus-ignore suppression directive text
  crit: notable
  if:
    type: text
    substr: 'argus-ignore'
- id: argus-agent-rules-language-tag
  desc: argus agent-rules language tag
  crit: notable
  if:
    type: text
    substr: 'languages: [agent-rules]'

composite_rules:
- id: argus-scanner-rules-source
  desc: argus-languages scanner rule file with its own suppression directive
  crit: exception
  all:
  - id: argus-ignore-directive-text
  - id: argus-agent-rules-language-tag
