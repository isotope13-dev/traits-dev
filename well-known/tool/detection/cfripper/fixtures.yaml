defaults:
  platforms: [unix, windows]
  for: [json, yaml]
  crit: notable

traits:
  - id: regression-template-path
    desc: CFRipper regression template path
    if:
      type: path
      regex: '(?i)cfripper(-[\w.]+)?[\\/]tests[\\/]test_templates\b'

composite_rules:
  - id: cloudformation-regression-fixture
    desc: CFRipper CloudFormation regression fixture
    all:
      - id: regression-template-path
      - id: micro-behaviors/data/config/syntax::cloudformation-resource-type
