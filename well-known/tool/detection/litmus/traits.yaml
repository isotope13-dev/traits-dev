defaults:
  platforms: [macos]
  for: [macho]
  size_min: 5000000
  size_max: 120000000
  crit: notable
  conf: 0.99

traits:
- id: litmus-classifier-description
  desc: Litmus malware-classification CLI description
  if:
    type: text
    section: const
    substr: Malware classification powered by ML + static analysis
- id: litmus-models-repository
  desc: Litmus model repository reference
  if:
    type: text
    section: const
    substr: https://codeberg.org/atomdrift/litmus-models.git

composite_rules:
- id: litmus-classifier-context
  desc: Litmus malware-classifier build context
  crit: exception
  conf: 0.99
  all:
  - id: litmus-classifier-description
  - id: litmus-models-repository
