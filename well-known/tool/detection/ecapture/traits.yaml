# ecapture (gojue/ecapture): the widely used open-source eBPF SSL/TLS and
# plaintext capture tool ("Verified Capture Without CA Certificates"). It
# attaches uprobes/kprobes to TLS libraries (OpenSSL, GnuTLS, NSS/NSPR,
# Go crypto) from a root-owned context and is the standard Linux audit
# tooling for plaintext troubleshooting and traffic analysis -- the same
# class as tcpdump/strace, not an interception implant. Its kern/*.c eBPF
# sources include the project's own "ecapture.h".
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [c, cpp, go, makefile, scripts]

traits:
  - id: ecapture-source-tree
    desc: ecapture project source tree
    size_min: 100
    size_max: 100000000
    for: [binaries, scripts, source, c, cpp, go, makefile]
    if:
      type: path
      regex: '(?i)ecapture[-_]?[0-9]|[\\/]ecapture[\\/]'

  - id: ecapture-headers-module
    desc: ecapture eBPF header or Go module marker
    if:
      type: text
      regex: '(?i)(#include\s+"ecapture\.h"|github\.com/gojue/ecapture)'

composite_rules:
  - id: ecapture-source
    desc: ecapture capture-tool source context
    any:
      - id: ecapture-source-tree
      - id: ecapture-headers-module
