defaults:
  platforms: [macos]
  for: [macho]
  size_min: 5000000
  size_max: 120000000
  crit: notable
  conf: 0.99

traits:
- id: cleave-traits-repository
  desc: Cleave traits repository reference
  if:
    type: text
    section: const
    substr: https://codeberg.org/atomdrift/cleave-traits.git
- id: cleave-analyzer-source-marker
  desc: Cleave analyzer source path marker
  if:
    type: text
    section: "__TEXT,__cstring"
    substr: src/analyzers/mod.rs
- id: cleave-rule-loader-source-marker
  desc: Cleave rule loader source path marker
  if:
    type: text
    section: "__TEXT,__cstring"
    substr: src/capabilities/mapper/loader_directory.rs

composite_rules:
- id: cleave-static-analysis-context
  desc: Cleave static-analysis engine build context
  crit: exception
  conf: 0.99
  all:
  - id: cleave-analyzer-source-marker
  any:
  - id: cleave-traits-repository
  - id: cleave-rule-loader-source-marker
