defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99

traits:
  - id: cleave-regex-derivations-filename
    desc: Cleave regex derivation cache filename
    if:
      type: path
      regex: '(?i)regex-derivations-v[0-9]+\.json$'

  - id: cleave-regex-derivations-prefix-key
    desc: Cleave regex derivation prefix key
    if:
      type: text
      substr: '"prefix":{'

  - id: cleave-regex-derivations-atom-key
    desc: Cleave regex derivation atom key
    if:
      type: text
      substr: '"atom":{'

  - id: cleave-regex-derivations-atom-set-key
    desc: Cleave regex derivation atom_set key
    if:
      type: text
      substr: '"atom_set":{'

composite_rules:
  - id: cleave-derivation-memo-context
    desc: Cleave regex derivation cache context
    crit: exception
    conf: 0.99
    all:
      - id: cleave-regex-derivations-filename
      - id: cleave-regex-derivations-prefix-key
      - id: cleave-regex-derivations-atom-key
      - id: cleave-regex-derivations-atom-set-key
