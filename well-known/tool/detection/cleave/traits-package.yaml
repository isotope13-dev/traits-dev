# The cleave-traits distribution package (Wolfi/Alpine apk, tarball) ships the
# whole rule tree together with its regression fixtures. Those fixtures are the
# intentional positives of a detection corpus (obfuscated droppers, reverse
# shells, stealers), so the hostile detections they trigger describe the
# fixtures, not an implant. The package manifest name alone is renameable, so
# identity also requires the tree's own TAXONOMY.md heading in the same archive.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: cleave-traits-apk-name
    desc: Alpine package named cleave-traits
    for: [apk_alpine]
    if:
      type: value
      path: apk.name
      exact: cleave-traits

  - id: cleave-taxonomy-doc
    desc: Cleave taxonomy reference document
    for: [markdown]
    if:
      type: text
      case_insensitive: true
      regex: '(?m)^# cleave taxonomy\s*$'

composite_rules:
  - id: cleave-traits-package-identity
    desc: Cleave traits package with its taxonomy doc
    crit: notable
    scope: archive
    for: [apk_alpine, markdown]
    all:
      - id: cleave-traits-apk-name
      - id: cleave-taxonomy-doc
