# GuardLayer filters LLM and agent inputs. Its bundled data directory holds
# the attack strings the similarity scanner loads, not prompts the package runs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: bundled-attack-data-path
    desc: GuardLayer bundled attack data path
    for: [text, python, json, markdown]
    if:
      type: path
      regex: 'guardlayer[/\\]data'
