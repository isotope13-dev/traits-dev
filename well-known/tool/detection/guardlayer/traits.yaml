# GuardLayer filters LLM and agent inputs. Its bundled data directory holds
# the attack strings the similarity scanner loads, not prompts the package runs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: bundled-attack-data-path
    desc: GuardLayer bundled attack data path
    for: [text, python, json, markdown]
    if:
      type: path
      regex: 'guardlayer[/\\]data'

  - id: guardlayer-wheel-package
    desc: GuardLayer guardrails PyPI package
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: guardlayer

  - id: guardlayer-known-attack-corpus-header
    desc: GuardLayer bundled known-attack corpus
    for: [text]
    if:
      type: text
      substr: GuardLayer built-in known-attack corpus

  - id: guardlayer-pipeline-class
    desc: GuardLayer LLM filter pipeline class
    for: [python]
    if:
      type: text
      regex: 'class GuardLayer:\s*\n\s+"""Filter LLM inputs'

  - id: tool-policy-exfil-service-denylist
    desc: Agent tool-policy exfiltration hostname denylist
    for: [python]
    conf: 0.98
    if:
      type: text
      regex: 'EXFIL_SERVICES:\s*frozenset'

composite_rules:
  - id: guardlayer-scanner-context
    desc: File is part of GuardLayer LLM guardrails
    crit: notable
    conf: 0.98
    any:
      - id: well-known/tool/detection/guardlayer::guardlayer-wheel-package
      - id: well-known/tool/detection/guardlayer::bundled-attack-data-path
      - id: well-known/tool/detection/guardlayer::guardlayer-known-attack-corpus-header
      - id: well-known/tool/detection/guardlayer::guardlayer-pipeline-class
      - id: well-known/tool/detection/guardlayer::tool-policy-exfil-service-denylist
