defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
- id: opendoor-package-identity
  desc: OpenDoor reconnaissance scanner package metadata
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: opendoor
- id: opendoor-project-repository
  desc: OpenDoor project repository metadata
  for: [pkginfo]
  if:
    type: value
    path: home-page
    exact: https://github.com/stanislav-web/OpenDoor
- id: opendoor-source-tree
  desc: OpenDoor source-tree package member
  for: [python]
  if:
    type: path
    regex: '(?i)(^|[\\/])opendoor-[0-9]'

composite_rules:
- id: opendoor-tool-context
  desc: Recognized OpenDoor reconnaissance scanner context
  scope: archive
  for: [pkginfo, python]
  all:
  - id: opendoor-package-identity
  - id: opendoor-project-repository
  - id: opendoor-source-tree
