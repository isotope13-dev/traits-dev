# Stingward — offline security auditor for AI projects, skills, and MCP (HiveControlAgents/StingWard).
defaults:
  platforms: [unix, windows]
  for: [python, package.json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: stingward PyPI distribution name
    for: [python]
    if:
      type: value
      path: python.package.name
      exact: stingward

  - id: github-repository
    desc: StingWard GitHub repository reference
    if:
      type: text
      substr: HiveControlAgents/StingWard

  - id: cli-prog-name
    desc: stingward CLI program name
    for: [python]
    if:
      type: text
      substr: 'argparse.ArgumentParser(prog="stingward"'

  - id: osv-batch-client
    desc: stingward OSV.dev vulnerability batch client
    for: [python]
    if:
      type: literal
      substr: https://api.osv.dev/v1/querybatch

composite_rules:
  - id: stingward-context
    desc: Stingward security auditor for AI projects
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: github-repository
      - id: cli-prog-name
      - id: osv-batch-client
