defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: openscap-xccdf-profile
    desc: OpenSCAP XCCDF remediation profile
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'xccdf_org\.ssgproject\.content_profile_[a-z0-9_]+'

  - id: openscap-bash-remediation-banner
    desc: OpenSCAP Bash remediation banner
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)Bash Remediation Script.{0,80}CIS.{0,40}Benchmark'

composite_rules:
  - id: openscap-cis-remediation-script
    desc: OpenSCAP-generated CIS remediation script
    crit: exception
    conf: 0.99
    all:
      - id: openscap-xccdf-profile
      - id: openscap-bash-remediation-banner
