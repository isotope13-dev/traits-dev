defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: openscap-xccdf-profile
    desc: OpenSCAP XCCDF profile marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(XCCDF Version:|oscap\s+xccdf)'

  - id: openscap-bash-remediation-banner
    desc: OpenSCAP Bash remediation profile banner
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)Bash remediation (script|role).{0,80}(CIS|STIG|profile)'

composite_rules:
  - id: openscap-cis-remediation-script
    desc: OpenSCAP-generated CIS remediation script
    crit: exception
    conf: 0.99
    all:
      - id: openscap-xccdf-profile
      - id: openscap-bash-remediation-banner
