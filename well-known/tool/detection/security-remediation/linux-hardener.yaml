# linux-hardener (github.com/tidynest/linux-hardener) — open-source Linux
# security automation, scanning, hardening, and rollback tool.
defaults:
  platforms: [linux]
  for: [shell, rust, markdown, text, json, source]
  crit: notable
  conf: 0.98

traits:
  - id: linux-hardener-repo-url
    desc: linux-hardener repository URL
    if:
      type: text
      substr: github.com/tidynest/linux-hardener

  - id: linux-hardener-package-path
    desc: linux-hardener source path component
    if:
      type: path
      regex: 'linux-hardener'

  - id: linux-hardener-crate-reference
    desc: References linux-hardener crate suite
    for: [shell, rust, text, source]
    if:
      type: text
      regex: '\b(hardener-cli|hardener-plugins|hardener-core|hardener-common)\b'

composite_rules:
  - id: linux-hardener-context
    desc: linux-hardener security tool context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: linux-hardener-repo-url
      - id: linux-hardener-package-path
      - id: linux-hardener-crate-reference
