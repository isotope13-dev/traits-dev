# Emerging Threats — the open Snort/Suricata detection ruleset
# (emerging-*.rules, sid-msg.map), now maintained by Proofpoint. Its rules
# *describe* attacks — xp_cmdshell abuse, Empire's AMSI bypass, reverse
# shells, advance-fee fraud vocabulary — as signature content, so
# attack-objective atoms match its rule text the way they match malware that
# performs those attacks. Network-security tooling and NIDS deployments ship
# this corpus as data. The identity is what an analyst wants surfaced, and
# the affected objectives reference the exception below from `unless:`.
defaults:
  platforms: [unix, windows]
  for: [text, data]
  crit: notable
  conf: 0.97

traits:
  - id: ruleset-member-path
    desc: Emerging Threats ruleset member path
    if:
      type: path
      regex: '(^|/)emerging-[a-z0-9_]+\.rules$'

  - id: sid-message-map-path
    desc: Emerging Threats sid-msg.map path
    if:
      type: path
      substr: sid-msg.map

  - id: ruleset-license-header
    desc: Emerging Threats license header
    if:
      type: text
      regex: '(?m)^#\s*Emerging Threats\s*$'

composite_rules:
  - id: detection-ruleset
    desc: Emerging Threats detection-ruleset corpus
    crit: exception
    conf: 0.97
    scope: outer
    for: [zip, tar, tar.gz, text, data]
    any:
      - id: ruleset-member-path
      - id: sid-message-map-path
      - id: ruleset-license-header
      - id: well-known/tool/detection/threat-intel::emerging-threats-url
