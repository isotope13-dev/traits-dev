# malscore — command maliciousness scoring and MITRE ATT&CK mapping tool
# (https://github.com/raj3shp/malscore). Never executes input commands;
# contains signature strings, examples, and heuristic patterns for
# defensive detection and command analysis.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl, zip, tar, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: malscore package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: malscore

  - id: repository-url
    desc: malscore GitHub repository reference
    for: [pkginfo, python, text, markdown]
    if:
      type: text
      substr: github.com/raj3shp/malscore

  - id: summary-claim
    desc: malscore defensive scoring summary claim
    for: [pkginfo, python, text, markdown]
    if:
      type: text
      substr: "Never executes its input"

  - id: release-tree-member
    desc: malscore package release tree member
    for: [scripts, source, manifests, documents, data, build, markdown, whl, python]
    if:
      type: path
      regex: '(^|[\\/])malscore([\\/\\-\\.]|$)'

  - id: module-import
    desc: malscore Python module import
    for: [python]
    if:
      type: import
      regex: '^malscore(\.|$)'

composite_rules:
  - id: package-identity
    desc: Recognized malscore command security scoring package
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: repository-url
      - id: summary-claim

  - id: scanner-context
    desc: malscore defensive command analysis tool context
    crit: exception
    conf: 0.99
    for: [scripts, source, manifests, documents, data, build, markdown, whl, python, zip, tar]
    any:
      - id: release-tree-member
      - id: package-identity
      - id: repository-url
      - id: module-import
