defaults:
  platforms: [linux, macos, windows]
  for: [go, python, markdown, text, zip]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: airom-go-module
    desc: AIROM Go module path
    if:
      type: text
      substr: github.com/airomhq/airom
  - id: airom-aibom-scanner-phrase
    desc: AIROM AIBOM scanner description
    if:
      type: text
      substr: "AI Bill of Materials (AIBOM) scanner"
  - id: airom-python-package-name
    desc: AIROM Python package name
    for: [pyproject.toml, python]
    if:
      type: text
      regex: '(?m)^name\s*=\s*"airom"'

composite_rules:
  - id: airom-aibom-scanner
    desc: AIROM AIBOM security scanner
    crit: notable
    conf: 0.98
    any:
      - id: airom-go-module
      - id: airom-aibom-scanner-phrase
      - id: airom-python-package-name
