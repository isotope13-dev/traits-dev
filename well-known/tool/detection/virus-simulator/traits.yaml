# Rosenthal Virus Simulator (1990-1996): an antivirus test kit. It generates
# harmless test viruses under A:\VIRUS\ and can overwrite the A: boot sector
# with a simulated one. Its ordinary use is testing AV products, so the
# identity is dual-use rather than hostile.
defaults:
  for: [data, dos_com]
  platforms: [windows, unix]
  crit: notable

traits:
  - id: rosenthal-virus-simulator-name
    desc: Rosenthal Virus Simulator product name
    conf: 0.95
    if:
      type: text
      substr: "Rosenthal Virus Simulator"

  - id: rosenthal-simulated-virus-notice
    desc: Simulated virus test-notice string
    conf: 0.9
    if:
      type: text
      substr: "SIMUTATED VIRUS for testing"

composite_rules:
  - id: rosenthal-virus-simulator
    desc: Rosenthal Virus Simulator AV test kit identity
    conf: 0.97
    all:
      - id: rosenthal-virus-simulator-name
      - id: rosenthal-simulated-virus-notice
