# websec-validator (raccioly/websec-validator) is a defensive local-first
# security recon tool for AI coding agents. Bundles probe script templates
# (e.g. upload-matrix.sh) to test application endpoints for vulnerabilities.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, shell, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: websec-validator package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: websec-validator

  - id: wheel-distribution-name
    desc: websec-validator wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: websec_validator

  - id: repository-url
    desc: websec-validator upstream repository URL
    for: [pkginfo, markdown, python, text]
    if:
      type: text
      substr: github.com/raccioly/websec-validator

  - id: probe-disclaimer-header
    desc: Defensive check disclaimer header
    for: [scripts, text, shell, python]
    if:
      type: text
      substr: "⚠ DEFENSIVE CHECK — run only against a system you own/operate"

  - id: source-tree-path
    desc: websec-validator tree member path
    for: [scripts, source, text, json, whl, php]
    if:
      type: path
      regex: '(?i)(^|[\\/])websec_validator([\\/]|$)'

  - id: probe-template-path
    desc: websec-validator probe template path
    for: [scripts, source, text, php, shell]
    if:
      type: path
      regex: 'templates[\\/]probes[\\/]'

composite_rules:
  - id: websec-validator-tool
    desc: websec-validator defensive security recon tool
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: wheel-distribution-name
      - id: repository-url

  - id: websec-validator-probe-context
    desc: websec-validator defensive probe context
    crit: exception
    conf: 0.99
    for: [scripts, source, text, php, shell]
    any:
      - id: probe-template-path
      - id: probe-disclaimer-header
