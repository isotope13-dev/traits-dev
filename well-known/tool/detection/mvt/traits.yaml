# MVT (Mobile Verification Toolkit, `mvt` on PyPI) is Amnesty International's
# published forensic toolkit for detecting mobile spyware. Its metadata names
# malware (its subject matter) and its iOS modules parse sms.db (their
# evidence source); neither is stealer behavior.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl, python-sdist, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-distribution-name
    desc: mvt PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: mvt

  - id: forensic-mobile-module-tree
    desc: MVT iOS/Android forensic module tree
    for: [python, whl, text, markdown, json]
    if:
      type: path
      regex: '(^|[/])mvt/(ios|android)'

  - id: verification-toolkit-summary
    desc: Summary names Mobile Verification Toolkit
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)mobile verification toolkit'

composite_rules:
  - id: mvt-defensive-scanner-context
    desc: Recognized MVT mobile-forensics distribution
    crit: exception
    conf: 0.99
    scope: file
    for: [whl, python-sdist, pkginfo, python, tar, zip, scripts, data]
    any:
      - id: pypi-distribution-name
      - id: forensic-mobile-module-tree
