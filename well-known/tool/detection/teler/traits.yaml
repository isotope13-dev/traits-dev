# teler (kitabisa/teler, teler-sh/teler-waf) is an open-source real-time
# intrusion detection tool and HTTP log analyzer.
# teler-resources (teler-sh/teler-resources) bundles threat intelligence
# datasets and signature corpora, including CVE templates, bad IPs, and bot lists.
defaults:
  platforms: [unix, windows]
  for: [json, text, scripts, data, go, source, php]
  crit: notable
  conf: 0.98

traits:
  - id: teler-resources-package-path
    desc: teler-resources package or repository path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)(^|[\\/])teler-resources(@|[\\/]|$)'

  - id: teler-cves-json-shape
    desc: teler CVE templates JSON structure
    crit: notable
    conf: 0.98
    for: [json, text]
    if:
      type: text
      substr: '{"templates":[{"id":"CVE-'
