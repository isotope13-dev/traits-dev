defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
  size_min: 1000000
  size_max: 100000000

traits:
  - id: kingfisher-project-marker
    desc: Kingfisher secret-scanner project marker
    if:
      type: text
      substr: 'github.com/mongodb/kingfisher'
      section: any

  - id: kingfisher-rules-crate
    desc: Kingfisher secret-rules crate reference
    if:
      type: text
      substr: 'kingfisher-rules'
      section: any

composite_rules:
  - id: kingfisher-defensive-secret-scanner-context
    desc: Kingfisher secret scanner and embedded rule catalog
    crit: exception
    conf: 0.99
    all:
      - id: kingfisher-project-marker
      - id: micro-behaviors/data/string/search::kingfisher-secret-pattern-corpus
