# ImHex community pattern libraries (WerWolv/ImHex-Patterns and forks). Ship
# YARA rules, annotated malware samples, and DFIR fixtures — hostile bytes are
# reference corpus, not payload staged for execution from this archive.
defaults:
  platforms: [unix, windows]
  for: [data, documents, binaries]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: imhex-patterns-tree-path
    desc: Path under ImHex-Patterns tree
    if:
      type: path
      regex: '(?i)(^|[\\/])ImHex-Patterns(-master)?([\\/]|$)'

  - id: imhex-yara-rules-tree
    desc: ImHex pattern YARA rules directory
    if:
      type: path
      regex: '(?i)(^|[\\/])yara([\\/]|$)'

  - id: upstream-repository-marker
    desc: ImHex-Patterns upstream repo marker
    for: [documents, data]
    if:
      type: text
      regex: '(?i)(WerWolv/ImHex-Patterns|ImHex-Patterns)'

  - id: imhex-pattern-library-member-path
    desc: Binary under ImHex pattern library tree
    for: [binaries]
    if:
      type: path
      regex: '(?i)ImHex-Patterns'

composite_rules:
  - id: pattern-library-identity
    desc: Recognized ImHex pattern library archive
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: imhex-patterns-tree-path
      - id: imhex-yara-rules-tree
      - id: upstream-repository-marker

  - id: archive-context
    desc: ImHex pattern library reference corpus
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: imhex-patterns-tree-path
      - id: pattern-library-identity
