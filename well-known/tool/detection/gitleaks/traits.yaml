# Gitleaks and its forks (betterleaks), secret scanners that ship detection
# rules for dozens of providers' token formats. Recognised by the Go main
# module the binary was built as, read from its embedded build info, not by
# strings: a program that vendors gitleaks' detector package as a library
# still names its own module here.
defaults:
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.95
  # Statically linked Go scanners with embedded rule sets: megabytes, not KB.
  size_min: 1048576
  size_max: 209715200

traits:
  - id: gitleaks-family-go-module-pe
    desc: Go binary built as a gitleaks fork
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      regex: '^github\.com/(gitleaks|betterleaks|zricethezav)/(gitleaks|betterleaks)(/v\d+)?$'

  - id: gitleaks-family-go-module-elf
    desc: Go binary built as a gitleaks fork
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      regex: '^github\.com/(gitleaks|betterleaks|zricethezav)/(gitleaks|betterleaks)(/v\d+)?$'

  - id: gitleaks-family-go-module-macho
    desc: Go binary built as a gitleaks fork
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      regex: '^github\.com/(gitleaks|betterleaks|zricethezav)/(gitleaks|betterleaks)(/v\d+)?$'
