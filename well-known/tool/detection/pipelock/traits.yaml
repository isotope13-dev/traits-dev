# Pipelock (luckyPipewrench/pipelock) is an open-source AI agent firewall for
# Verifiable Egress Control (VEC). It inspects HTTP, WebSocket, CONNECT, MCP,
# and A2A traffic for secret exfiltration, prompt injection, and SSRF. Its test
# suites, diagnostic simulators, and documentation intentionally carry attack
# scenarios and regression fixtures.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, manifests, documents, data, markdown, binaries, text]
  size_min: 1
  size_max: 50000000
  crit: notable
  conf: 0.98

traits:
  - id: vendored-corpus-path
    desc: Vendored pipelock-rules detection corpus path
    if:
      type: path
      regex: '(?i)(^|[\\/])pipelock[_-]rules[\\/]'

  - id: pipelock-release-tree-member
    desc: Pipelock release tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])pipelock(@|[-_]v?[0-9a-f]|[\\/]|$)'

  - id: pipelock-go-module
    desc: Pipelock Go module path
    if:
      type: text
      substr: github.com/luckyPipewrench/pipelock

  - id: pipelock-action-reference
    desc: Pipelock GitHub Action reference
    if:
      type: text
      regex: '(?i)uses:\s+luckyPipewrench/pipelock'

composite_rules:
  - id: pipelock-defensive-scanner-context
    desc: Pipelock defensive AI-agent firewall context
    crit: exception
    conf: 0.99
    any:
      - id: vendored-corpus-path
      - id: pipelock-release-tree-member
      - id: pipelock-go-module
      - id: pipelock-action-reference
