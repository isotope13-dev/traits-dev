defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, alpine_apk, pkginfo, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: trivy-package-name
    desc: Trivy package name
    if:
      type: path
      substr: trivy-
  - id: trivy-go-module
    desc: Trivy Go module path
    for: [elf, macho, pe, pkginfo, text]
    if:
      type: text
      substr: github.com/aquasecurity/trivy
  - id: trivy-source-archive-path
    desc: Trivy source archive member path
    if:
      type: path
      substr: github.com/aquasecurity/trivy@

  # Trivy's local vulnerability database (`<cache>/trivy/db/trivy.db`, a bbolt
  # file of about 1.6 GB plus its metadata.json). It stores the advisories'
  # own text -- exploit strings, template-injection and XXE examples -- as data
  # the scanner matches against, which is why content rules read it as payloads.
  - id: vulnerability-db-path
    desc: Trivy vulnerability database file
    for: [data]
    size_max: 4000000000
    if:
      type: path
      basename: true
      exact: trivy.db

composite_rules:
  - id: trivy-scanner
    desc: Trivy vulnerability scanner
    crit: notable
    conf: 0.98
    any:
      - id: trivy-package-name
      - id: trivy-go-module
      - id: trivy-source-archive-path
