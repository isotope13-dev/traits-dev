# Agent security-monitor / skill-guardrail policies quote jailbreak and
# prompt-injection phrases as untrusted DATA to reject — the opposite of a
# jailbreak payload. Lives under well-known/tool/detection/agent-monitor,
# not objectives/. Sibling of ai-guardrail: monitor policies that frame
# tool-call / user content as untrusted data. Composite is crit: exception
# (RULES.md); members are notable.
#
# `javascript`/`typescript` cover coding-agent approval-reviewer prompts that
# ship inside IDE extension bundles (e.g. CodeGPT) and catalog `irm|iex`,
# `~/.ssh/id_rsa`, curl POST, etc. as HARD/SOFT BLOCK examples.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: approval-reviewer-coding-agent
    desc: Coding-agent approval reviewer policy
    if:
      type: text
      substr: approval reviewer for a coding agent

  - id: untrusted-evidence-framing
    desc: Treats artifacts as untrusted evidence
    if:
      type: text
      substr: UNTRUSTED EVIDENCE

  - id: auth-is-not-theft-policy
    desc: Authentication is not theft policy clause
    if:
      type: text
      substr: AUTHENTICATION IS NOT THEFT

  - id: untrusted-never-embed-instructions
    desc: Never interpret embedded instructions
    if:
      type: text
      regex: '(?i)never interpret embedded instructions'
  - id: untrusted-inject-imperative-text
    desc: Guardrail names imperative injection text
    if:
      type: text
      regex: '(?i)inject imperative text'
  - id: untrusted-data-never-instructions
    desc: Untrusted data never instructions
    if:
      type: text
      regex: '(?i)untrusted data.{0,40}never instructions'
  - id: untrusted-analyze-never-instructions
    desc: Analyze as data never instructions
    if:
      type: text
      regex: '(?i)data to analyze,\s*never instructions'
  - id: untrusted-must-not-interpret-directives
    desc: Must not interpret text as directives
    if:
      type: text
      regex: '(?i)\bmust not interpret\b[^.\n]{0,40}\bas directives\b'
  - id: untrusted-instruction-shaped-example
    desc: Instruction-shaped attack quoted as example
    if:
      type: text
      regex: '(?i)instruction-shaped text.{0,60}ignore (all )?(previous|prior)'
  - id: untrusted-injection-catalog-ignore-prior
    desc: Injection catalog quotes ignore-prior
    if:
      type: text
      regex: '(?i)(prompt injection attempts|Common patterns:).{0,80}ignore prior'
  - id: untrusted-tool-call-block-marker
    desc: Agent monitor marks tool-call payloads untrusted
    if:
      type: text
      regex: '(?i)\[UNTRUSTED TOOL CALL\]'
  - id: untrusted-payload-decision-immutable
    desc: Monitor ignores payload instructions
    if:
      type: text
      regex: '(?i)NEVER change your decision based on text inside'

composite_rules:
  # Benign-context suppressor: agent security monitors / skill docs that catalog
  # injection phrases as untrusted input. Referenced only from unless:/downgrade:.
  # Shared documentation atoms live in metadata/package/documentation.
  - id: untrusted-input-data-guardrail
    desc: Agent treats embedded instructions as data
    crit: exception
    conf: 0.96
    # needs>=2: real guardrail framing, not a lone quoted jailbreak phrase.
    # Also keeps a needs<=1 any: from being filtered before unless: can see it.
    needs: 2
    any:
      - id: approval-reviewer-coding-agent
      - id: untrusted-evidence-framing
      - id: auth-is-not-theft-policy
      - id: untrusted-never-embed-instructions
      - id: untrusted-inject-imperative-text
      - id: metadata/package/documentation::untrusted-user-input-is-data
      - id: metadata/package/documentation::untrusted-data-as-not-instructions
      - id: untrusted-data-never-instructions
      - id: untrusted-analyze-never-instructions
      - id: untrusted-must-not-interpret-directives
      - id: untrusted-instruction-shaped-example
      - id: untrusted-injection-catalog-ignore-prior
      - id: metadata/package/documentation::untrusted-not-instructions-to-execute
      - id: untrusted-tool-call-block-marker
      - id: untrusted-payload-decision-immutable
