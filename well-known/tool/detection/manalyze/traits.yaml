# Manalyze, a static PE analyzer. Its C++ sources carry the project's GPL banner
# and include the project's own manape library header. The sample's examples
# directory holds working process-hollowing code, so the identity only lowers
# that code's severity; it does not hide the technique.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: manalyze-gpl-banner
    desc: Manalyze GPL distribution banner
    if:
      type: text
      substr: Manalyze is distributed in the hope that it will be useful
  - id: manape-library-include
    desc: Includes the manape PE library header
    if:
      type: text
      substr: <manape/pe.h>

composite_rules:
  - id: manalyze-project-source
    desc: Manalyze project C++ source
    crit: exception
    conf: 0.97
    all:
      - id: manalyze-gpl-banner
      - id: manape-library-include
