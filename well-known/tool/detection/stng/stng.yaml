defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
  crit: notable
  conf: 0.95
  size_min: 512
  size_max: 104857600
traits:
  # The markers below key on `.text` strings and a symbol name a release build
  # no longer exposes: none matched stng 1.4.0 from Wolfi, which is how the
  # extractor's own path corpus — wallet directories, keychain names, browser
  # profile paths, compiled in as the vocabulary it searches *for* — read as a
  # desktop wallet stealer. These two survive a stripped build: Rust type paths
  # keep the crate name, and the CLI keeps its banner. Both live in .rodata,
  # not the .text the markers below scope to -- which is the other half of why
  # the identity never fired on a release build.
  - id: stng-crate-type-path
    desc: STNG crate type path symbol
    if:
      type: text
      section: .rodata
      regex: 'stng\.{2}(types|xor|r2|script)\.{2}[A-Za-z]'
  - id: stng-usage-banner
    desc: STNG command-line usage banner
    if:
      type: text
      section: .rodata
      substr: 'stng extracts and classifies strings from binaries'

  - id: xor-classify
    crit: notable
    desc: STNG XOR classification function
    if:
      type: symbol
      regex: stng::xor::classify
  - id: xor-classify-corpus
    crit: notable
    desc: STNG XOR classification corpus
    if:
      type: text
      substr: High-confidence XOR key found, stopping search
      section: .text
  - id: pattern-corpus
    crit: notable
    desc: STNG static pattern corpus
    if:
      type: text
      substr: static patterns
      section: .text
  - id: regex-corpus
    crit: notable
    desc: STNG static regex corpus
    if:
      type: text
      substr: static regex
      section: .text

composite_rules:
  # Referenced from the credential-targeting rules its corpus trips. A string
  # extractor that ships the paths it hunts for is not hunting them here.
  - id: stng-string-extractor-context
    desc: Recognized STNG string extractor
    crit: exception
    conf: 0.98
    any:
      - id: stng-crate-type-path
      - id: stng-usage-banner
      - id: xor-classify
      - id: xor-classify-corpus
