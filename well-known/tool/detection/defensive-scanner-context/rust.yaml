defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.95

traits:
  - id: rust-secret-predicate
    desc: Rust boolean secret-detection predicate
    if:
      type: text
      regex: 'pub fn has_secret\([^)]{0,80}\)\s*->\s*bool'
  - id: rust-secret-pattern-overrides
    desc: Rust configurable secret-pattern exclusions
    if:
      type: text
      regex: '\.filter\(\|p\|\s*!remove_set\.contains\(\*p\)\)'
  - id: rust-exfiltration-detector-call
    desc: Rust calls an exfiltration content detector
    if:
      type: symbol
      kind: call
      regex: '(^|::)detect_exfiltration$'
  - id: exfiltration-finding-message
    desc: Reports an exfiltration pattern finding
    if:
      type: literal
      substr: 'contains exfiltration pattern:'

composite_rules:
  - id: rust-configurable-secret-detector-context
    desc: Configurable Rust secret-detection predicate
    crit: exception
    all:
      - id: rust-secret-predicate
      - id: rust-secret-pattern-overrides
  - id: rust-exfiltration-audit-context
    desc: Rust content detector reports exfiltration findings
    crit: exception
    all:
      - id: rust-exfiltration-detector-call
      - id: exfiltration-finding-message
