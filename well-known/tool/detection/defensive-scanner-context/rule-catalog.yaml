# Security-scanner rule-catalog files: YAML that DEFINES detection rules
# (a rules: section of id'd entries with severity/match/regex fields). The
# rule bodies describe hostile patterns and embed hostile example fixtures,
# so hostile-content traits matching the file text are seeing detector
# definitions, not behavior.
defaults:
  platforms: [unix, windows]
  for: [yaml]
  crit: notable
  conf: 0.9

traits:
  - id: scanner-rule-catalog-yaml
    desc: Scanner rule-catalog YAML definition file
    if:
      type: text
      regex: '(?mi)^rules:[ \t]*$[\s\S]{0,600}^[ \t]+(match|pattern|severity):'
