defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  # An in-product secret-exposure guard: a fail-closed blocklist that refuses
  # sensitive environment variable names. Guard tooling catalogs vendor
  # secret names defensively, so it is recognized non-harvest context for
  # the env secret-name family.
  - id: env-secret-blocklist-guard
    desc: Env secret-name blocklist guard tooling
    if:
      type: text
      regex: '(?i)(safe_getenv|protected_env_var|reserved_env_names)'
