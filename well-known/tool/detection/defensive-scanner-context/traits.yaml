defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
- id: security-scanner-tool-class
  desc: Security scanner tool class
  crit: notable
  conf: 0.96
  for: [python]
  if:
    type: text
    word: SecurityScannerTool
- id: penetration-testing-tool-class
  desc: Penetration testing tool class
  crit: notable
  conf: 0.96
  for: [python]
  if:
    type: text
    word: PenetrationTestingTool
- id: authorized-testing-disclaimer
  desc: Authorized-testing disclaimer in scanner source
  crit: notable
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: '(?i)FOR\s+AUTHORIZED\s+TESTING\s+ONLY'

composite_rules:
- id: authorized-testing-tool-implementation
  desc: Authorized security testing tool implementation
  crit: notable
  conf: 0.98
  for: [python]
  any:
  - id: security-scanner-tool-class
  - id: penetration-testing-tool-class
- id: authorized-defensive-scanner-source
  desc: Defensive scanner with an explicit authorized-use boundary
  crit: notable
  conf: 0.98
  for: [python]
  all:
  - id: authorized-testing-tool-implementation
  - id: authorized-testing-disclaimer
- id: published-defensive-scanner-context
  desc: Published defensive scanner source context
  unless:
  - id: well-known/lib/core/sentry-js::sentry-js-sdk
  - id: well-known/app/development/vscode-extension/vscode-marketplace::vsce-ovsx-publish-shell
  any:
  - id: well-known/tool/detection/nox::nox-source-context
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/gung12/
  - id: well-known/tool/detection/jsonguard/
  - id: well-known/tool/detection/opendoor::opendoor-tool-context
  - id: authorized-defensive-scanner-source
