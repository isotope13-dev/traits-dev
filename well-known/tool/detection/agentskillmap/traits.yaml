defaults:
  platforms: [unix, windows]
  for: [pe, macho]
  size_min: 1000000

traits:
- id: cli-banner-windows
  desc: AgentSkillMap Windows CLI banner
  crit: notable
  conf: 0.99
  for: [pe]
  if:
    type: text
    section: .rdata
    substr: "skillmap — a capability differ for AI agent skills"
- id: cli-banner-macos
  desc: AgentSkillMap macOS CLI banner
  crit: notable
  conf: 0.99
  for: [macho]
  if:
    type: text
    section: __const
    substr: "skillmap — a capability differ for AI agent skills"

composite_rules:
- id: cli-context
  desc: Recognized AgentSkillMap defensive analysis CLI
  crit: exception
  conf: 0.99
  scope: file
  any:
  - id: cli-banner-windows
  - id: cli-banner-macos
