defaults:
  platforms: [unix, windows]
  for: [javascript]

# CodeTotal's local runner is a defensive scanner bootstrap. These independent
# markers identify that named tool before generic fetch/write/exec objectives
# infer a dropper from its Docker setup code.
traits:
  - id: codetotal-runner-class-marker
    desc: CodeTotal local runner class marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'CodeTotalRunner'

  - id: codetotal-official-compose-bootstrap-url
    desc: CodeTotal official Docker Compose bootstrap URL
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'raw.githubusercontent.com/oxsecurity/codetotal/main/docker-compose.yml'

composite_rules:
  - id: codetotal-local-docker-runner
    desc: CodeTotal local Docker runner
    crit: notable
    conf: 0.99
    all:
      - id: codetotal-runner-class-marker
      - id: codetotal-official-compose-bootstrap-url
