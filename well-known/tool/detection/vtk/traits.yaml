# vtk — VA Department of Veterans Affairs developer CLI with Shai-Hulud
# supply-chain scanners and post-incident credential audit scripts.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell, ruby, gem, text]
  crit: notable
  conf: 0.98

traits:
  - id: credential-audit-script
    desc: VTK credential audit script banner
    if:
      type: text
      regex: '(?im)^#\s*Credential Audit Script\b'

  - id: credential-audit-ps-synopsis
    desc: VTK credential audit PowerShell synopsis
    for: [powershell, text]
    if:
      type: text
      regex: '(?i)\.SYNOPSIS[\s\S]{0,60}Credential Audit Script'

  - id: shai-hulud-check-script
    desc: Shai-Hulud machine infection checker script
    if:
      type: text
      regex: '(?im)^#\s*Shai-Hulud Machine Infection Checker\b'

  - id: shai-hulud-ps-synopsis
    desc: Shai-Hulud checker PowerShell synopsis
    for: [powershell, text]
    if:
      type: text
      regex: '(?i)\.SYNOPSIS[\s\S]{0,80}Shai-Hulud'

  - id: vtk-gem-spec
    desc: VTK Ruby gem specification
    for: [gem, ruby, text]
    if:
      type: text
      regex: '(?im)^\s*spec\.name\s*=\s*[''"]vtk[''"]'

  - id: va-vtk-github
    desc: department-of-veterans-affairs/vtk repository
    if:
      type: text
      substr: department-of-veterans-affairs/vtk

  - id: vtk-ruby-module
    desc: VTK Ruby module namespace
    for: [ruby]
    if:
      type: text
      substr: module Vtk

  - id: gh-action-trace-script
    desc: VTK gh-action-trace script banner
    for: [shell, text]
    if:
      type: text
      substr: gh-action-trace —

  - id: vtk-scripts-path
    desc: VTK bundled security script path
    for: [shell, powershell, gem, tar, text]
    if:
      type: path
      regex: '(^|[/\\])scripts/(shai-hulud|credential-audit|gh-action)'

composite_rules:
  - id: vtk-security-scanner
    desc: VA VTK security scanning toolkit
    crit: notable
    conf: 0.99
    any:
      - id: credential-audit-script
      - id: credential-audit-ps-synopsis
      - id: shai-hulud-check-script
      - id: shai-hulud-ps-synopsis
      - id: vtk-gem-spec
      - id: va-vtk-github
      - id: vtk-ruby-module
      - id: gh-action-trace-script
      - id: vtk-scripts-path
