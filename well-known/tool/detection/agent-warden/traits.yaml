# Agent Warden (@shivdev/agent-warden, github.com/ShivShankarDash/warden) —
# AI agent firewall and prompt-injection detector. The published package ships
# its own canonical attack templates, red-team runner and evaluation test cases.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Package named @shivdev/agent-warden
    size_min: 1
    if:
      type: value
      path: name
      exact: "@shivdev/agent-warden"

  - id: upstream-repository
    desc: Package repository is ShivShankarDash/warden
    size_min: 1
    if:
      type: value
      path: repository.url
      substr: ShivShankarDash/warden

composite_rules:
  - id: package-context
    desc: Archive is the Agent Warden agent-security package
    crit: exception
    conf: 0.95
    all:
      - id: package-name
      - id: upstream-repository
