# CERT-X-GEN (crates.io cert-x-gen / cxg): published polyglot vulnerability
# scanner and pentest runner. Template probes, OAST fixtures, and installer
# docs mirror attack idioms by design; the crate is defensive tooling.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: cargo-package-name
    desc: CERT-X-GEN Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: cert-x-gen

  - id: crate-manifest-name
    desc: CERT-X-GEN crate manifest name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: cert-x-gen

  - id: upstream-repository
    desc: CERT-X-GEN upstream GitHub repository
    for: [cargo.toml, markdown, shell]
    conf: 0.99
    if:
      type: text
      regex: '(?i)github\.com/Bugb-Technologies/cert-x-gen\b'

  - id: archive-member-prefix
    desc: CERT-X-GEN crate member path prefix
    for: [rust, python, php, shell, markdown, javascript, github_actions]
    if:
      type: path
      regex: '(?i)(^|[\\/])cert-x-gen-[0-9][0-9a-z.-]*([\\/]|$)'

  - id: install-script-url
    desc: CERT-X-GEN official install.sh URL
    for: [shell, markdown]
    conf: 0.99
    if:
      type: text
      regex: '(?i)raw\.githubusercontent\.com/Bugb-Technologies/cert-x-gen/(main|master)/install\.sh'

  - id: polyglot-scanner-tagline
    desc: CERT-X-GEN polyglot scanner positioning phrase
    for: [markdown, rust]
    if:
      type: text
      regex: '(?i)polyglot (security )?execution engine'

  - id: cxg-cli-binary-name
    desc: CERT-X-GEN cxg CLI binary name
    for: [rust, shell, markdown]
    if:
      type: text
      regex: '(?m)\bcxg (scan|pentest)\b'

composite_rules:
  - id: package-identity
    desc: CERT-X-GEN crate package identity
    conf: 0.99
    scope: archive
    any:
      - id: cargo-package-name
      - id: crate-manifest-name

  - id: published-scanner-source
    desc: CERT-X-GEN published scanner source tree
    conf: 0.99
    scope: archive
    all:
      - id: package-identity
      - id: upstream-repository

  - id: scanner-source-member-context
    desc: CERT-X-GEN crate source tree member
    crit: exception
    conf: 0.99
    any:
      - id: archive-member-prefix
      - id: install-script-url

  - id: defensive-scanner-context
    desc: Recognized CERT-X-GEN defensive scanner
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: published-scanner-source
      - id: archive-member-prefix
      - id: polyglot-scanner-tagline
      - id: cxg-cli-binary-name
