# OpenA2A Agent Identity Management & Agent Runtime Protection (ARP)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  size_max: 5000000
  crit: notable
  conf: 0.98

traits:
  - id: opena2a-package-name
    desc: OpenA2A package name in manifest
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@opena2a/.*'

  - id: opena2a-home-env
    desc: OpenA2A configuration environment variable
    if:
      type: text
      regex: 'OPENA2A_(HOME|TELEMETRY|REGISTRY_URL)|ARP_TELEMETRY_DISABLED'

  - id: opena2a-arp-storage-path
    desc: OpenA2A ARP local event or baseline path
    if:
      type: text
      regex: '\.opena2a[/\\]arp[/\\]'

  - id: opena2a-arp-suspicious-hosts
    desc: OpenA2A ARP defensive suspicious host list
    if:
      type: text
      regex: 'SUSPICIOUS_HOSTS\s*=\s*\[.{0,60}webhook\.site'

composite_rules:
  - id: opena2a-arp-context
    desc: OpenA2A Agent Runtime Protection tool context
    crit: exception
    conf: 0.98
    any:
      - id: opena2a-package-name
      - id: opena2a-home-env
      - id: opena2a-arp-storage-path
      - id: opena2a-arp-suspicious-hosts
