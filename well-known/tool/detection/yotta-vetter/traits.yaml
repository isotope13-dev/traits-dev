# YottaMeta yotta-vetter (元审): agent-skill vetting checker whose
# scripts/vetter_rules.py is a synced copy of defensive detection regexes.
# Attack-pattern strings in that catalog are subject matter, not behavior.
defaults:
  conf: 0.99
  platforms: [unix, windows]

traits:
  - id: rule-namedtuple-schema
    desc: Yotta vetter Rule namedtuple schema
    crit: notable
    for: [python]
    if:
      type: text
      substr: 'Rule = namedtuple("Rule", ["id", "detector", "severity", "pattern", "description", "confidence"])'

  - id: vetter-rules-sync-banner
    desc: Yotta vetter rules sync provenance banner
    crit: notable
    for: [python]
    if:
      type: text
      substr: sync-vetter-rules.py

  - id: skill-slug-marker
    desc: Yotta vetter agent skill slug
    crit: notable
    for: [markdown]
    if:
      type: text
      substr: "slug: yotta-vetter"

  - id: vetter-cli-identity
    desc: Yotta vetter CLI tool identity constant
    crit: notable
    for: [python]
    if:
      type: text
      substr: 'TOOL_NAME = "yotta-vetter"'

composite_rules:
  - id: vetter-rules-catalog-context
    desc: Yotta vetter defensive rule catalog source file
    crit: exception
    conf: 0.99
    scope: file
    for: [python]
    all:
      - id: metadata/file/string/identity::pattern-rules-catalog
      - id: rule-namedtuple-schema

  - id: yotta-vetter-skill-archive-context
    desc: Recognized yotta-vetter skill package archive
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, python]
    all:
      - id: skill-slug-marker
    any:
      - id: vetter-rules-catalog-context
      - id: vetter-cli-identity
      - id: vetter-rules-sync-banner
