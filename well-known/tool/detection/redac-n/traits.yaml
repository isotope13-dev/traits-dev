defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, pkginfo, tgz, tar]
  crit: notable
  conf: 0.98

traits:
  - id: redac-n-package-name
    desc: redac---n package name
    for: [pkginfo, json]
    if:
      type: value
      path: name
      exact: redac---n

  - id: redac-n-package-description
    desc: redac---n package description
    for: [pkginfo, json]
    if:
      type: value
      path: description
      substr: Redact secrets from text and agent transcripts

  - id: redac-n-structure-analyzer
    desc: redac---n structure secret analyzer
    for: [javascript, typescript]
    if:
      type: symbol
      kind: function
      exact: findStructure

composite_rules:
  - id: redac-n-package-context
    desc: redac---n defensive secret redactor package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: redac-n-package-name
      - id: redac-n-package-description
      - id: redac-n-structure-analyzer
