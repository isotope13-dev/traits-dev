# pipelock-rules (luckyPipewrench/pipelock-rules) is a community bundle of
# agent-firewall detection rules, each shipped with a true-positive fixture the
# rule must match and a near-miss fixture it must not. Projects that test their
# own detectors vendor the bundle verbatim, so the fixtures carry the hostile
# phrasing (encoded instructions, tool-poisoning concealment) as test data.
defaults:
  platforms: [unix, windows]
  for: [text, yaml, markdown, json, python]
  crit: notable
  conf: 0.95

traits:
  - id: vendored-corpus-path
    desc: Vendored pipelock-rules detection corpus path
    if:
      type: path
      regex: '(?i)(^|[\\/])pipelock[_-]rules[\\/]'
