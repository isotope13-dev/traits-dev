# Detonate — security sandbox and testing tool for MCP servers and Agent skills (m4vic/detonate).
# Runs targets in a locked sandbox, probes for path traversal, command injection,
# prompt injection, SSRF, and Log4Shell vulnerabilities.
defaults:
  platforms: [linux, macos, windows]
  for: [source, documents, manifests, scripts, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: github-repository
    desc: Detonate GitHub repository reference
    if:
      type: text
      substr: github.com/m4vic/detonate

  - id: go-module-name
    desc: Detonate Go module name
    for: [go.mod]
    if:
      type: text
      regex: '(?m)^module\s+github\.com/m4vic/detonate\b'

  - id: release-tree-path
    desc: Path under detonate release tree
    if:
      type: path
      regex: '(?i)(^|[\\/])detonate(-[0-9]+)?[\\/]'

  - id: probe-injection-marker
    desc: Detonate probe injection marker
    if:
      type: text
      substr: DETONATE_INJECTION_MARKER

  - id: action-name
    desc: Detonate GitHub Action definition
    for: [yaml]
    if:
      type: text
      substr: "name: 'Detonate — MCP server & Agent Skill test'"

composite_rules:
  - id: detonate-tool
    desc: Detonate MCP and agent security sandbox
    crit: exception
    conf: 0.99
    any:
      - id: github-repository
      - id: go-module-name
      - id: release-tree-path
      - id: probe-injection-marker
      - id: action-name
