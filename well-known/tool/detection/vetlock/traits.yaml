# Vetlock — dependency update behavioral diff and lockfile security vetter.
defaults:
  conf: 0.99
  platforms:
  - windows
  - unix
traits:
- id: vetlock-release-tree-member
  desc: Vetlock release tree member
  crit: notable
  for: [scripts, source, manifests, documents, data, build, markdown]
  size_max: 50000000
  if:
    type: path
    regex: '(?i)(^|[\\/])vetlock[\\/\\-]'
- id: vetlock-source-marker
  desc: Vetlock project source marker
  crit: notable
  for: [scripts, source, manifests, documents, data, build, markdown]
  size_max: 50000000
  if:
    type: text
    substr: vetlock
composite_rules:
- id: vetlock-defensive-scanner-context
  desc: Vetlock defensive scanner project context
  crit: exception
  conf: 0.99
  any:
  - id: vetlock-release-tree-member
  - id: vetlock-source-marker
