# Sketchy — open-source repository security scanner by Adversis (adversis/sketchy).
# Checks repositories and scripts for suspicious patterns, cryptominers, reverse
# shells, stealers, and persistence. Its testdata fixtures embed intentional
# detection test cases that are not executable malware.
defaults:
  conf: 0.99
  platforms: [unix, windows]

traits:
  - id: sketchy-release-tree-member
    desc: Path under sketchy release tree
    crit: notable
    for: [scripts, source, manifests, documents, data, build, markdown, dockerfile, github-actions]
    size_max: 50000000
    if:
      type: path
      regex: '(?i)(^|[\\/])sketchy([@\\/-]|$)'

  - id: sketchy-source-marker
    desc: sketchy security scanner project marker
    crit: notable
    for: [scripts, source, manifests, documents, data, build, markdown, shell]
    size_max: 50000000
    if:
      type: text
      substr: github.com/adversis/sketchy

composite_rules:
  - id: sketchy-defensive-scanner-context
    desc: Recognized sketchy defensive scanner project context
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: sketchy-release-tree-member
      - id: sketchy-source-marker
