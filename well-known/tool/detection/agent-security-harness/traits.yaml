# Agent Security Harness is a defensive protocol-test package.  Its test
# vectors intentionally contain traversal paths, metadata URLs, and encoded
# shell commands; identify those fixtures without treating them as execution.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Agent Security Harness package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agent-security-harness

  - id: wheel-distribution-name
    desc: Agent Security Harness wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: agent_security_harness

  - id: upstream-repository
    desc: Agent Security Harness upstream repository
    for: [pkginfo]
    if:
      type: text
      substr: github.com/msaleme/red-team-blue-team-agent-fabric

  - id: protocol-test-harness-path
    desc: Agent Security Harness protocol-test module path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])protocol_tests[\\/][a-z0-9_]+_harness\.py$'

  - id: mcp-traversal-fixture
    desc: MCP harness traversal URI fixture
    for: [python]
    if:
      type: text
      regex: '(?s)traversal_uris\s*=\s*\[[^\]]{0,1200}file:///(\.\./){3}etc/shadow'

  - id: skill-exfiltration-test
    desc: Skill harness exfiltration test function
    for: [python]
    if:
      type: text
      regex: 'def\s+test_ss_004_exfiltration_via_skill_instructions\s*\('

  - id: skill-exfiltration-fixtures
    desc: Skill harness encoded exfiltration fixtures
    for: [python]
    if:
      type: text
      regex: 'exfil_skill_(url|b64|encoded)\s*='

composite_rules:
  - id: package-identity
    desc: Agent Security Harness defensive testing package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: upstream-repository

  - id: mcp-traversal-fixture-context
    desc: Agent Security Harness MCP traversal test fixture
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: protocol-test-harness-path
      - id: mcp-traversal-fixture

  - id: skill-exfiltration-fixture-context
    desc: Agent Security Harness skill exfiltration test fixture
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: protocol-test-harness-path
      - id: skill-exfiltration-test
      - id: skill-exfiltration-fixtures
