# DockSec is Advait Patel's AI-assisted Docker image and Dockerfile scanner.
# It shells out to hadolint/trivy and documents their curl|sh installers in
# user-facing error text — not remote code execution.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: DockSec Python distribution name
    if:
      type: value
      path: METADATA::Name
      exact: docksec

  - id: docker-scanner-class
    desc: DockSec Docker scanner class
    if:
      type: text
      substr: class DockerScanner

  - id: hadolint-trivy-install-docs
    desc: DockSec documents hadolint and trivy install
    if:
      type: text
      substr: Hadolint is required for Dockerfile linting

composite_rules:
  - id: docksec-scanner-context
    desc: DockSec Docker security scanner package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: docker-scanner-class
    any:
      - id: hadolint-trivy-install-docs
