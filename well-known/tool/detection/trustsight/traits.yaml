# TrustSight — open-source static security auditing tool for AUR PKGBUILD updates.
# Its detector rules, test fixtures, test scripts, and documentation embed attack
# strings and suspicious patterns as detection corpora and test cases by design.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, documents, manifests, data, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: trustsight-release-tree-member
    desc: TrustSight release tree member
    if:
      type: path
      regex: '(^|[\\/])trustsight[\\/\\-]'

  - id: trustsight-source-marker
    desc: TrustSight project source marker
    if:
      type: text
      substr: trustsight
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog

  - id: trustsight-pyproject-name
    desc: TrustSight pyproject package identity
    for: [manifests]
    if:
      type: text
      regex: '(?m)^\s*name\s*=\s*"trustsight"'

composite_rules:
  - id: trustsight-defensive-scanner-context
    desc: Recognized TrustSight defensive scanner context
    crit: notable
    conf: 0.99
    any:
      - id: trustsight-release-tree-member
      - id: trustsight-source-marker
      - id: trustsight-pyproject-name
