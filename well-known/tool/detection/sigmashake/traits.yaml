defaults:
  platforms:
  - unix
  - windows
  for:
  - pe
  - dll
  - javascript
  - package.json
  - npm
  crit: baseline
  conf: 0.97
  size_min: 65536
  size_max: 200000000
traits:
- id: sigmashake-package-marker
  desc: SigmaShake package identity marker
  crit: notable
  size_min: 1
  if:
    type: text
    regex: "(?i)@sigmashake/ssg([-/\\\"']|$)"
- id: sigmashake-bun-entry-path
  desc: SigmaShake Bun entry path
  crit: notable
  for: [pe]
  platforms: [windows]
  if:
    type: text
    regex: 'B:/~BUN/root/ssg(-hookw)?-win32-x64\.exe'
    section: .bun
- id: sigmashake-evaluate-export
  desc: SigmaShake evaluator API export
  crit: notable
  for: [dll]
  platforms: [windows]
  if:
    type: export
    exact: ssg_evaluate
- id: sigmashake-load-rules-export
  desc: SigmaShake rule-loader API export
  crit: notable
  for: [dll]
  platforms: [windows]
  if:
    type: export
    exact: ssg_load_rules
- id: sigmashake-get-result-export
  desc: SigmaShake result API export
  crit: notable
  for: [dll]
  platforms: [windows]
  if:
    type: export
    exact: ssg_get_result
- id: sigmashake-runtime-marker
  desc: SigmaShake runtime identity marker
  crit: notable
  if:
    type: text
    regex: "(?i)(sigmashakeHome|SigmaShakeDaemon|\\.sigmashake|hub\\.sigmashake\\.com)"
- id: sigmashake-exhaustive-test-module
  desc: SigmaShake exhaustive test command module
  crit: notable
  for: [pe]
  platforms: [windows]
  if:
    type: text
    substr: src/commands/test-exhaustive.ts
    section: .bun

composite_rules:
- id: sigmashake-native-evaluator-api
  desc: SigmaShake native evaluator API set
  crit: notable
  conf: 0.99
  for: [dll]
  platforms: [windows]
  all:
  - id: sigmashake-evaluate-export
  - id: sigmashake-load-rules-export
  - id: sigmashake-get-result-export
- id: sigmashake-governance-marker
  desc: SigmaShake Governance product marker
  crit: notable
  conf: 0.99
  any:
  - id: sigmashake-package-marker
  - id: sigmashake-bun-entry-path
  - id: sigmashake-native-evaluator-api
  - id: sigmashake-runtime-marker
- id: sigmashake-scheduled-task-context
  desc: SigmaShake scheduled-task startup context
  crit: exception
  conf: 0.99
  for: [pe, dll]
  all:
  - id: sigmashake-governance-marker
  - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
- id: sigmashake-hosts-policy-example-context
  desc: SigmaShake exhaustive policy-test context
  crit: exception
  conf: 0.99
  for: [pe]
  platforms: [windows]
  all:
  - id: sigmashake-runtime-marker
  - id: sigmashake-exhaustive-test-module
