defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: devdome-malware-scanner-source-context
  desc: Recognized DevDome Malware Scanner source
  crit: exception
  conf: 0.99
  for: [php, javascript, text, zip]
  all:
  - id: well-known/tool/detection/devdome::devdome-malware-scanner-package-member
  any:
  - id: well-known/tool/detection/devdome::devdome-malware-scanner-source-marker
