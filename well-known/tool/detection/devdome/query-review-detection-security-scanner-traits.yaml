defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: devdome-malware-scanner-package-member
  desc: DevDome Malware Scanner package member
  crit: notable
  conf: 0.99
  for: [php, javascript, text, zip]
  if:
    type: path
    regex: '(?i)devdome-malware-scanner'
- id: devdome-malware-scanner-source-marker
  desc: DevDome scanner source marker
  crit: notable
  conf: 0.99
  for: [php, javascript, text]
  if:
    type: text
    regex: '(?i)(devdmalw_scan_obfuscation|devdmalw_php_decode_funcs|devdmalw_scan_php_content)'
