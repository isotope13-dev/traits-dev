# @highflame/policy — Cedar policy types and detector catalogues for Highflame's
# AI guardrails. Each `*-detectors.gen.js` is a generated spec of the detectors
# the product ships; every entry carries `exampleAttacks` snippets (jailbreaks,
# prompt overrides, `rm -rf /`) that the detector is meant to flag. Those
# snippets are the inputs the guardrail blocks, quoted as documentation.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 500
  size_max: 2000000

traits:
  - id: highflame-detector-spec-catalog
    desc: Highflame detector spec with example attacks
    if:
      type: text
      regex: 'export const \w{1,40}_DETECTOR_SPEC_VERSION\b'
