# guardbee — MCP security scanner for prompt injection and LLM security.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: guardbee package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@guardbee/mcp-prompt-injection-scanner'

  - id: npm-package-name
    desc: guardbee npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@guardbee/mcp-prompt-injection-scanner'

  - id: github-repo
    desc: guardbee GitHub repository reference
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: GuardBee/guardbee-mcp

  - id: guardbee-ai-domain
    desc: guardbee.ai official domain reference
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: 'guardbee.ai'

  - id: llm-redteam-package-name
    desc: GuardBee LLM red-team package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@guardbee/mcp-llm-redteam'

  - id: llm-redteam-repository
    desc: GuardBee monorepo package repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: GuardBee/guardbee-mcp

composite_rules:
  - id: defensive-scanner-context
    desc: GuardBee prompt injection scanner context
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: npm-package-name
      - id: github-repo
      - id: guardbee-ai-domain

  # Canary probes live in dist/probes.js, which does not repeat the package
  # name. Archive scope lets those members see this package identity.
  - id: llm-redteam-package-context
    desc: GuardBee live LLM red-team package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: llm-redteam-package-name
      - id: llm-redteam-repository
