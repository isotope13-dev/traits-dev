# opencode-v2-security -- execution-boundary guard for the OpenCode coding agent.
# It classifies agent shell commands, brokers each boundary-crossing syscall to
# an approver, and ships its own red-team payload corpus. The classifier tables,
# credential-path denylists and replay payloads therefore quote the attack
# shapes they refuse: decode-to-shell pipelines, shadow-copy deletion, history
# suppression, host-profile probes and credential directories. The native
# helper scrubs its approval token from its own argv for the same reason.
# The package identity is read at archive scope by the rules it would trip.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: opencode-v2-security npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: opencode-v2-security
