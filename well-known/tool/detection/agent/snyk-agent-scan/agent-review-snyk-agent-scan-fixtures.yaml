defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown

traits:
  - id: upstream-source-path
    desc: Snyk agent-scan upstream source path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: 'snyk/agent-scan@[0-9A-Za-z._+-]+'
  - id: skill-fixture-path
    desc: Scanner skill test-data path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: 'tests/skills/'

composite_rules:
  - id: upstream-skill-fixture-context
    desc: Dormant skill fixture in Snyk agent-scan source tree
    crit: exception
    conf: 0.98
    scope: file
    all:
      - id: well-known/tool/detection/agent/snyk-agent-scan::upstream-source-path
      - id: well-known/tool/detection/agent/snyk-agent-scan::skill-fixture-path
