defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  - dll
  - tar
  - gz
  - package.json
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-repo-url
    desc: agentskillmap GitHub repository URL
    for: [elf, macho, pe, dll, gz, package.json]
    if:
      type: text
      substr: github.com/TakasiVenkataSandeep-08/agentskillmap

  - id: skillmap-lock-file
    desc: skillmap.lock capability baseline file
    for: [elf, macho, pe, dll, gz, package.json]
    if:
      type: text
      substr: skillmap.lock

  - id: capability-escalation-marker
    desc: skillmap capability escalation CI message
    for: [elf, macho, pe, dll, gz, package.json]
    if:
      type: text
      substr: capability escalation vs skillmap.lock

  - id: rules-languages-config
    desc: skillmap rules languages.toml reference
    for: [elf, macho, pe, dll, gz, package.json]
    if:
      type: text
      substr: rules/languages.toml


composite_rules:
  - id: skillmap-supply-chain-auditor
    desc: skillmap AI agent skill supply-chain auditor
    crit: exception
    conf: 0.99
    all:
      - id: well-known/tool/detection/agent/agentskillmap::skillmap-lock-file
    any:
      - id: well-known/tool/detection/agent/agentskillmap::github-repo-url
      - id: well-known/tool/detection/agent/agentskillmap::capability-escalation-marker
      - id: well-known/tool/detection/agent/agentskillmap::rules-languages-config
