defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - pyproject.toml
  - markdown
  - text
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ClawSecCheck Python package name
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      exact: clawseccheck

  - id: repository-url
    desc: ClawSecCheck source repository URL
    for: [pyproject.toml]
    if:
      type: value
      path: project.urls.Homepage
      exact: https://github.com/gl0di/clawseccheck

  - id: self-audit-description
    desc: ClawSecCheck OpenClaw self-audit description
    for: [pyproject.toml]
    if:
      type: value
      path: project.description
      regex: '(?i)local, read-only OpenClaw security self-audit'


composite_rules:
  - id: defensive-scanner-archive-context
    desc: ClawSecCheck defensive scanner archive context
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, pyproject.toml]
    all:
      - id: well-known/tool/detection/agent/clawseccheck::package-name
      - id: well-known/tool/detection/agent/clawseccheck::repository-url
      - id: well-known/tool/detection/agent/clawseccheck::self-audit-description
