defaults:
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  - python
  - package.json
  - github-actions
  - json
  - text
  - data
  - markdown
  - shell
  - scripts
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AgentAuditKit package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agent-audit-kit

  - id: module-import
    desc: AgentAuditKit Python module import
    for: [python]
    if:
      type: import
      regex: '^agent_audit_kit(\.|$)'

  - id: tree-path
    desc: AgentAuditKit distribution member path
    for: [python, json, text, data, markdown, github-actions, shell, scripts, package.json]
    if:
      type: path
      regex: 'agent-audit-kit'


composite_rules:
  - id: scanner-context
    desc: Recognized AgentAuditKit security scanner
    crit: exception
    conf: 0.99
    for: [scripts, manifests, data, markdown, github-actions, shell, json, text, python, npm, whl, python_sdist, zip, tar]
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: archive
    any:
      - id: well-known/tool/detection/agent/agent-audit-kit::package-name
      - id: well-known/tool/detection/agent/agent-audit-kit::module-import
      - id: well-known/tool/detection/agent/agent-audit-kit::tree-path
