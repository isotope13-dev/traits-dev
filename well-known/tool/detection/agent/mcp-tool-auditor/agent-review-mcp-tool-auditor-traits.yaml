defaults:
  platforms:
  - unix
  - windows
  for:
  - whl
  - python
  crit: notable
  conf: 0.98

traits:
  - id: mcp-tool-auditor-package-name
    desc: MCP Tool Auditor package metadata
    for: [whl]
    if:
      type: value
      path: 'whl.distribution'
      exact: mcp_tool_auditor

  - id: mcp-tool-auditor-offensive-module
    desc: MCP Auditor offensive simulation source module
    for: [whl]
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(^|/)offensive/[a-z_][a-z0-9_]*\.py$'

  - id: mcp-tool-auditor-scanner-module
    desc: MCP Auditor scanner implementation
    for: [whl]
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(^|/)auditor/scanner\.py$'

  - id: mcp-tool-auditor-authorization-warning
    desc: MCP Auditor authorization warning
    for: [python]
    if:
      type: text
      regex: '(?is)MCP.{0,30}Auditor.{0,100}AUTHORIZED\s+PENETRATION\s+TESTING'

  - id: mcp-tool-auditor-poisoner-generator
    desc: MCP Auditor poisoned-server generator
    for: [python]
    if:
      type: text
      substr: 'PoisonedServerGenerator'

  - id: mcp-tool-auditor-offensive-import
    desc: MCP Auditor offensive security module import
    for: [python]
    if:
      type: text
      regex: 'import\s+(ATPA_SPECIFIC|RUG_PULL_SPECIFIC|print_security_warning|require_ack)\b'


composite_rules:
  - id: mcp-tool-auditor-offensive-context
    desc: MCP Auditor authorized offensive simulation context
    crit: notable
    conf: 0.99
    for: [python]
    any:
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-authorization-warning
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-poisoner-generator
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-offensive-import

  - id: mcp-tool-auditor-package
    desc: MCP Tool Auditor security scanner package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-package-name
    any:
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-offensive-module
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-scanner-module
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-authorization-warning
    needs: 1
