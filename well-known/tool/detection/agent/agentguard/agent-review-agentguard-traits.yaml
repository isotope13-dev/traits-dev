# AgentGuard — AI coding assistant security gateway and guardrail proxy.
# Detects shell execution risks, tool abuse, and data leakage across MCP hosts.
defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: notable
  conf: 0.98

traits:
  - id: agentguard-cli-title
    desc: AgentGuard CLI title marker
    size_min: 10000
    size_max: 50000000
    if:
      type: text
      section: any
      substr: 'AgentGuard CLI'

  - id: agentguard-module-path
    desc: AgentGuard internal Go module path
    size_min: 10000
    size_max: 50000000
    if:
      type: text
      section: any
      substr: 'agentguard.local/agentguard'

  - id: agentguard-config-schema
    desc: AgentGuard configschema marker
    size_min: 10000
    size_max: 50000000
    if:
      type: text
      section: any
      substr: 'model_providers.agentguard'

composite_rules:
  - id: agentguard-security-proxy-context
    desc: AgentGuard AI assistant security helper context
    crit: exception
    scope: file
    all:
      - id: well-known/tool/detection/agent/agentguard::agentguard-module-path
    any:
      - id: well-known/tool/detection/agent/agentguard::agentguard-cli-title
      - id: well-known/tool/detection/agent/agentguard::agentguard-config-schema
