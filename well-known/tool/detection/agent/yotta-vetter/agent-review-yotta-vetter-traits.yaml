defaults:
  conf: 0.99
  platforms:
  - unix
  - windows

traits:
  - id: rule-namedtuple-schema
    desc: Yotta vetter Rule namedtuple schema
    crit: notable
    for: [python]
    if:
      type: text
      substr: 'Rule = namedtuple("Rule", ["id", "detector", "severity", "pattern", "description", "confidence"])'

  - id: vetter-rules-sync-banner
    desc: Yotta vetter rules sync provenance banner
    crit: notable
    for: [python]
    if:
      type: text
      substr: sync-vetter-rules.py

  - id: skill-slug-marker
    desc: Yotta vetter agent skill slug
    crit: notable
    for: [markdown]
    if:
      type: text
      substr: "slug: yotta-vetter"

  - id: vetter-cli-identity
    desc: Yotta vetter CLI tool identity constant
    crit: notable
    for: [python]
    if:
      type: text
      substr: 'TOOL_NAME = "yotta-vetter"'


composite_rules:
  - id: vetter-rules-catalog-context
    desc: Yotta vetter defensive rule catalog source file
    crit: notable
    conf: 0.99
    scope: file
    for: [python]
    all:
      - id: metadata/file/catalog/pattern-rules::pattern-rules-catalog
      - id: well-known/tool/detection/agent/yotta-vetter::rule-namedtuple-schema
      - id: well-known/tool/detection/agent/yotta-vetter::vetter-rules-sync-banner

  - id: yotta-vetter-skill-archive-context
    desc: yotta-vetter skill package archive
    crit: notable
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, python]
    all:
      - id: well-known/tool/detection/agent/yotta-vetter::skill-slug-marker
    any:
      - id: well-known/tool/detection/agent/yotta-vetter::vetter-rules-catalog-context
      - id: well-known/tool/detection/agent/yotta-vetter::vetter-cli-identity
      - id: well-known/tool/detection/agent/yotta-vetter::vetter-rules-sync-banner
