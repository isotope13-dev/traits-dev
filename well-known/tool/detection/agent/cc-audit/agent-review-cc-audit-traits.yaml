defaults:
  platforms:
  - unix
  - windows
  for:
  - rust
  - shell
  - python
  - javascript
  - typescript
  - json
  - yaml
  - cargo.toml
  - manifests
  - text
  - markdown
  crit: notable
  conf: 0.99

traits:
  - id: cargo-package-name
    desc: cc-audit Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: cc-audit

  - id: cargo-repository
    desc: cc-audit Cargo repository URL
    for: [cargo.toml]
    if:
      type: value
      path: package.repository
      exact: https://github.com/ryo-ebata/cc-audit

  - id: source-tree-path
    desc: cc-audit source or test tree member
    if:
      type: path
      regex: '(^|[/])cc-audit(@v[0-9]|\b)'

  - id: evasion-fixture-text
    desc: Node.js evasion-technique fixture header
    if:
      type: text
      substr: Node.js specific evasion techniques

  - id: security-auditor-summary
    desc: Package description describes security auditor
    for: [cargo.toml]
    if:
      type: value
      path: package.description
      regex: '(?i)security auditor for claude code'

  - id: rule-engine-implementation
    desc: cc-audit builtin rule-engine implementation
    for:
    - rust
    if:
      type: text
      regex: pub struct RuleEngine \{[\s\S]{0,900}(let\s+rules\s*=|rules:)\s*builtin::all_rules\(\)


composite_rules:
  - id: cc-audit-source-tree
    desc: cc-audit defensive security scanner source tree member
    crit: exception
    conf: 0.99
    scope: file
    all:
    - id: well-known/tool/detection/agent/cc-audit::cargo-package-name
    - id: well-known/tool/detection/agent/cc-audit::cargo-repository

  - id: cc-audit-security-scanner-context
    desc: cc-audit defensive security scanner context
    crit: notable
    conf: 0.99
    scope: archive
    all:
    - id: well-known/tool/detection/agent/cc-audit::cargo-package-name
    - id: well-known/tool/detection/agent/cc-audit::cargo-repository
    - id: well-known/tool/detection/agent/cc-audit::security-auditor-summary

  - id: cc-audit-cargo-manifest-identity
    desc: cc-audit Cargo manifest name and repository
    crit: notable
    conf: 0.99
    for:
    - cargo.toml
    all:
    - id: well-known/tool/detection/agent/cc-audit::cargo-package-name
    - id: well-known/tool/detection/agent/cc-audit::cargo-repository

  - id: cc-audit-source-package-identity
    desc: cc-audit manifest and rule engine source
    crit: notable
    scope: archive
    for:
    - zip
    - tar
    - crate
    - cargo.toml
    - rust
    - shell
    all:
    - id: well-known/tool/detection/agent/cc-audit::cc-audit-cargo-manifest-identity
    - id: well-known/tool/detection/agent/cc-audit::rule-engine-implementation

  # Scanner evasion fixture shipped in cc-audit's own examples tree. Path and
  # header text must both hold, so a renamed copy does not inherit the exemption.
  - id: bypass-fixture-context
    desc: cc-audit evasion fixture in its examples tree
    crit: exception
    all:
    - id: well-known/tool/detection/agent/cc-audit::source-tree-path
    - id: well-known/tool/detection/agent/cc-audit::evasion-fixture-text
