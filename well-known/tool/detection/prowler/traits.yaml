# Prowler — the open-source multi-cloud security assessment tool.
#
# Its corpus is thousands of individual check modules under
# prowler/providers/<cloud>/services/, and each one is written in the shape of
# the thing it audits: s3_service.py enumerates bucket ACLs and public-access
# blocks, defender_antiphishing_policy_configured.py names phishing controls,
# cloudtrail_threat_detection_llm_jacking.py carries the indicator lists it
# hunts for. Reading buckets' permission surface is the product working, not
# cloud recon by an attacker.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: Prowler wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^prowler$'

  - id: check-model-import
    desc: Prowler check base-class import
    for: [python]
    if:
      type: text
      substr: 'from prowler.lib.check.models import'

  - id: provider-service-path
    desc: Prowler provider service tree path
    for: [python, text, data, json]
    if:
      type: path
      regex: '(^|/)prowler/providers'

composite_rules:
  - id: scanner-check-corpus
    desc: Recognized Prowler check corpus
    crit: exception
    conf: 0.99
    scope: outer
    for: [whl, egg, zip, python, text, data, json]
    any:
      - id: wheel-distribution-name
      - id: check-model-import
      - id: provider-service-path
