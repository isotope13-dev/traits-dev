# Ironheights — local-first defensive scanner for OpenClaw agent skills.
#
# Its distribution embeds its own detection content: a denylist table of
# tunnel/paste hosts (BAD_HOST_SUFFIXES) and rule regexes naming the
# behaviors it detects (BASE64_PIPE). Those strings are signatures, not
# behavior: without a benign-context suppressor the tunnel-domain and
# decode-pipeline traits convict the scanner for describing its own rules.
# The guard plugin name and the pinned advisory-key path identify the
# distribution; the exception below requires two of the four markers so a
# lone borrowed string cannot borrow the suppression.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [scripts, data]

traits:
- id: guard-plugin-name
  desc: Ironheights guard plugin name
  crit: notable
  if:
    type: text
    substr: ironheights-guard
- id: pinned-advisory-key-path
  desc: Ironheights pinned advisory key path
  crit: notable
  if:
    type: text
    substr: src/advisories/pinned-key.ts
- id: denylist-table-marker
  desc: Ironheights host denylist table
  crit: notable
  if:
    type: text
    substr: BAD_HOST_SUFFIXES
- id: decode-pipe-rule-name
  desc: Ironheights decode-pipe detection rule
  crit: notable
  if:
    type: text
    substr: BASE64_PIPE

composite_rules:
- id: ironheights-defensive-scanner-context
  desc: Recognized Ironheights defensive scanner context
  crit: exception
  scope: file
  needs: 2
  any:
  - id: guard-plugin-name
  - id: pinned-advisory-key-path
  - id: denylist-table-marker
  - id: decode-pipe-rule-name
