# Preseal is a published defensive test harness for AI-agent deployments.
# Its built-in attack prompts and vulnerable demo agent are test corpus, not
# an operator payload.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: preseal-wheel-distribution
    desc: Preseal wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: preseal

  - id: preseal-package-name
    desc: Preseal Python package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: preseal

  - id: preseal-project-repository
    desc: Preseal upstream project repository
    for: [pkginfo, markdown, text]
    if:
      type: text
      substr: github.com/preseal/preseal

  - id: preseal-security-testing-purpose
    desc: Preseal AI-agent security-testing purpose marker
    for: [python, markdown, text]
    if:
      type: text
      regex: '(?i)pre-deployment security testing for AI agents|preseal audit --|preseal scan --demo'

composite_rules:
  - id: preseal-package-context
    desc: Recognized Preseal defensive AI-agent test package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: preseal-wheel-distribution
      - id: preseal-package-name
      - id: preseal-project-repository
