# Sniffnet — an open-source network-traffic monitoring application.
# These signatures provide benign product context for its packet-capture,
# socket, process, and catalog capabilities.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.98
  size_min: 100000
  size_max: 100000000

traits:
  - id: sniffnet-product-name
    desc: Sniffnet network-monitor product name
    crit: component
    conf: 0.98
    if:
      type: text
      section: .rodata
      substr: Sniffnet

  - id: sniffnet-homepage
    desc: Sniffnet project homepage URL
    crit: component
    conf: 0.98
    if:
      type: text
      section: .rodata
      substr: https://sniffnet.net

  - id: sniffnet-github-project
    desc: Sniffnet upstream GitHub repository URL
    crit: component
    conf: 0.99
    if:
      type: text
      section: .rodata
      substr: https://github.com/GyulyVGC/sniffnet

composite_rules:
  - id: sniffnet-network-monitor
    desc: Sniffnet network-traffic monitoring application
    crit: notable
    conf: 0.99
    all:
      - id: sniffnet-product-name
    any:
      - id: sniffnet-homepage
      - id: sniffnet-github-project
