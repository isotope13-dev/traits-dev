# jsonguard: defensive JSON/CSV/TSV input inspection and sanitization crate.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97

traits:
  - id: cargo-package-name
    desc: jsonguard Cargo package identity
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: jsonguard

  - id: cargo-repository
    desc: jsonguard upstream repository identity
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.repository
      exact: https://github.com/SecurityRonin/jsonguard

  - id: guard-input-trait
    desc: GuardInput trait for safe byte/str decode
    for: [rust]
    conf: 0.96
    if:
      type: text
      word: GuardInput

  - id: csv-field-sanitizer
    desc: csv_field sanitizer function
    for: [rust]
    conf: 0.95
    if:
      type: text
      regex: '\bfn\s+csv_field\b|\bcsv_field\s*\('

composite_rules:
  - id: jsonguard-identity
    desc: jsonguard input sanitization crate
    conf: 0.98
    all:
      - id: cargo-package-name
    any:
      - id: cargo-repository
      - id: guard-input-trait
      - id: csv-field-sanitizer

  - id: jsonguard-hazard-inspector
    desc: jsonguard formula/bidi hazard inspector
    conf: 0.97
    scope: archive
    all:
      - id: jsonguard-identity
      - id: micro-behaviors/data/string/sanitize::structured-input-hazard-inspect
