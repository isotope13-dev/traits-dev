defaults:
  platforms: [unix, windows]
  for: [json, yaml]
  crit: notable

traits:
  - id: regression-template-path
    desc: cfn-lint regression template path
    if:
      type: path
      regex: '(?i)cfn[-_]lint(-[\w.]+)?[\\/]test[\\/]fixtures\b'

composite_rules:
  - id: cloudformation-regression-fixture
    desc: cfn-lint CloudFormation regression fixture
    all:
      - id: regression-template-path
      - id: micro-behaviors/data/config/syntax::cloudformation-resource-type
