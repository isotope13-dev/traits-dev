defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: wpsecscan-cli-context
  desc: WPSecScan CLI/module text context
  crit: notable
  conf: 0.96
  for:
  - python
  if:
    type: text
    regex: wpsecscan\s+(--daemon|scan-zip)|python -m wpsecscan
