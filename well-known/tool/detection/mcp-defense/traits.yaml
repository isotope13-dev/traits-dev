# mcp-defense — MCP proxy policy engine with crown-jewel path denylist.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: pypi-package-name
    desc: mcp-defense PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: mcp-defense

  - id: crown-jewels-catalog
    desc: MCP Defense crown jewels path catalog
    for: [python]
    if:
      type: text
      word: CROWN_JEWELS

  - id: classify-path-function
    desc: MCP Defense path sensitivity classifier
    for: [python]
    if:
      type: text
      substr: def classify_path

  - id: github-repo
    desc: mcp-defense GitHub repository marker
    if:
      type: text
      substr: jessfortemnaturae8717/mcp-defense

composite_rules:
  - id: mcp-defense-framework
    desc: MCP Defense agent runtime defense framework
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: pypi-package-name
      - id: github-repo

  - id: crown-jewels-policy-context
    desc: MCP Defense crown jewels policy catalog
    crit: exception
    conf: 0.98
    scope: archive
    all:
      - id: crown-jewels-catalog
      - id: classify-path-function
