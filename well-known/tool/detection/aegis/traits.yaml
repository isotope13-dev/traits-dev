# AEGIS / KavachOS (@xshieldai/aegis, github.com/rocketlang/aegis) — agentic
# runtime governance and prompt-injection shield. The published package ships
# its own red-team corpora (`src/redteam/`), detector rules and agent test
# scenarios, so it contains the very attack phrases ("ignore all previous
# instructions"), sensitive-path deny lists and `base64 -d | bash` test
# strings that it exists to block. Those members are defensive test data.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Package named @xshieldai/aegis
    size_min: 1
    if:
      type: value
      path: name
      exact: "@xshieldai/aegis"

  - id: upstream-repository
    desc: Package repository is rocketlang/aegis
    size_min: 1
    if:
      type: value
      path: repository.url
      substr: rocketlang/aegis

composite_rules:
  - id: package-context
    desc: Archive is the AEGIS agent-governance package
    crit: exception
    conf: 0.95
    all:
      - id: package-name
      - id: upstream-repository
