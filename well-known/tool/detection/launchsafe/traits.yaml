# LaunchSafe Agent Firewall (@launchsafe/agent-firewall, launchsafe-firewall)
# An open-source firewall for AI agents inspecting tool calls against
# exfiltration, prompt injection, and destructive command patterns.
defaults:
  platforms: [unix, windows]
  for: [manifests, scripts, source, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: LaunchSafe agent firewall package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@launchsafe/agent-firewall"

  - id: repository-url
    desc: LaunchSafe agent firewall repository
    for: [package.json, javascript, typescript, json, markdown, text]
    if:
      type: text
      substr: github.com/shivanagendrakore/agent-firewall

  - id: cli-binary
    desc: LaunchSafe agent firewall CLI binary name
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: launchsafe-firewall

  - id: firewall-rule-catalogue
    desc: LaunchSafe agent firewall rule catalogue header
    for: [javascript, typescript]
    if:
      type: text
      substr: "The rule catalogue: the single place rule ids"

  - id: brand-mention
    desc: LaunchSafe brand reference
    for: [javascript, typescript, json, markdown, text]

    if:
      type: text
      substr: LaunchSafe

composite_rules:
  - id: package-identity
    desc: Recognized LaunchSafe AI agent firewall package
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: repository-url
      - id: cli-binary
      - id: firewall-rule-catalogue
      - id: brand-mention

  - id: defensive-firewall-context
    desc: LaunchSafe defensive firewall rule and tool context
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-identity
      - id: firewall-rule-catalogue
      - id: cli-binary
      - id: brand-mention


