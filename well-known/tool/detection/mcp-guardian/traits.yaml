# mcp-guardian — MCP security scanner for prompt injection and tool poisoning.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: mcp-guardian package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mcp-guardian

  - id: npm-package-name
    desc: mcp-guardian npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: mcp-guardian

  - id: github-repo
    desc: mcp-guardian GitHub repository reference
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: alexandriashai/mcp-guardian

  - id: prompt-injection-scanner-patterns
    desc: mcp-guardian prompt injection patterns
    for: [javascript, typescript]
    if:
      type: text
      substr: 'mcp-guardian - Detection Patterns'

composite_rules:
  - id: defensive-scanner-context
    desc: mcp-guardian MCP security scanner context
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: npm-package-name
      - id: github-repo
      - id: prompt-injection-scanner-patterns
