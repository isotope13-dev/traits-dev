# YottaMeta 元安 (yotta-security-audit) — read-only AI skill and system
# baseline scanner. Its rule table and engine quote the same credential-path and
# firewall strings they hunt for; those literals are detection signatures, not
# runtime behavior.
defaults:
  platforms: [unix, windows]
  for: [python, zip, tar]
  crit: notable
  conf: 0.97

traits:
  - id: audit-rules-table-header
    desc: Yotta audit rules table module header
    for: [python]
    if:
      type: text
      substr: audit_rules.py — YottaMeta 元安
  - id: yotta-audit-engine-identity
    desc: Yotta security audit engine tool name
    for: [python]
    if:
      type: literal
      kind: string
      exact: yotta-security-audit

composite_rules:
  - id: yotta-security-audit-defensive-context
    desc: YottaMeta read-only skill security audit scanner
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: audit-rules-table-header
      # The shared table name alone does not establish defensive provenance.
      # Synced catalogs also need the complete audit rule record schema.
      - id: well-known/tool/detection/yotta-vetter::vetter-rules-catalog-context
      - id: yotta-audit-engine-identity
