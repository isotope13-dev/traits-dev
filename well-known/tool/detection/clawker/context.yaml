defaults:
  platforms: [unix, windows]

traits:
  - id: prompt-injection-incident-report
    desc: Clawker prompt injection incident report
    crit: notable
    conf: 1.0
    for: [markdown]
    if:
      type: basename
      exact: 2026-05-16-prompt-injection-via-subagent.md

composite_rules:
  - id: prompt-injection-incident-context
    desc: Recognized Clawker prompt injection incident report context
    crit: exception
    conf: 1.0
    all:
      - id: source-tree
      - id: prompt-injection-incident-report
