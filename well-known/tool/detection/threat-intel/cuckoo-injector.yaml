# Cuckoo's published monitor injector has both its monitor-loading CLI and
# per-process cuckoo configuration path. Either alone is insufficient identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 10000000
traits:
  - id: cuckoo-monitor-injector-help
    desc: Cuckoo monitor injector command help
    if:
      type: text
      substr: '--free                 Do not inject our monitor'
      section: rdata
  - id: cuckoo-per-process-config-path
    desc: Cuckoo per-process monitor configuration path
    if:
      type: text
      substr: 'C:\cuckoo_%d.ini'
      section: rdata
composite_rules:
  - id: cuckoo-monitor-injector
    desc: Cuckoo sandbox monitor injection utility
    all:
      - id: cuckoo-monitor-injector-help
      - id: cuckoo-per-process-config-path
