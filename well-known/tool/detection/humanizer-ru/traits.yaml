# humanizer-ru — Russian text hygiene and copy-paste artifact diagnostic / sanitizer.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, json, pyproject.toml, zip, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: pyproject-name
    desc: humanizer-ru package name
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      exact: humanizer-ru

  - id: upstream-repository
    desc: humanizer-ru upstream repository URL
    for: [python, javascript, json, pyproject.toml, markdown]
    if:
      type: text
      substr: github.com/Vladimir-Human/humanizer-ru

  - id: module-path
    desc: humanizer-ru Python package module path
    for: [python, javascript, json]
    if:
      type: path
      regex: '(^|[\\/])humanizer_ru([\\/]|$)'

  - id: release-tree-path
    desc: Path under humanizer-ru release tree
    for: [python, javascript, json, pyproject.toml, markdown, text]
    if:
      type: path
      regex: 'humanizer-ru'

composite_rules:
  - id: package-identity
    desc: Recognized humanizer-ru text hygiene and normalization tool package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: pyproject-name
      - id: upstream-repository
      - id: module-path
      - id: release-tree-path

  - id: archive-context
    desc: humanizer-ru archive benign context
    crit: exception
    conf: 0.99
    for: [python, javascript, json, pyproject.toml, markdown, text]
    any:
      - id: release-tree-path
      - id: module-path
      - id: upstream-repository
