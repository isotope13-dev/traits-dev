# @sofagent/audit and @sofagent/eval (github.com/KongFangXun/sofagent) — commit-time
# discipline audit for AI coding agents. The audit package's rule tables carry
# the injection phrases and `eval(atob(` patterns it flags in a diff, and the
# eval package keeps a golden set of those attacks to score the audit against.
# Those strings are scanner detection data, not behaviour of the package.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Package named @sofagent/audit or @sofagent/eval
    size_min: 1
    if:
      type: value
      path: name
      regex: '^@sofagent/(audit|eval)$'

  - id: package-author
    desc: Package author is KongFangXun
    size_min: 1
    if:
      type: value
      path: author
      exact: KongFangXun

composite_rules:
  - id: package-context
    desc: Archive is the sofagent audit or eval package
    crit: exception
    all:
      - id: package-name
      - id: package-author
