# Wiz Code (WizCloud.wiz-vscode) is Wiz's IaC / secret / vulnerability scanner
# for VS Code. Its documented runtime downloads a pinned Wiz CLI, verifies it,
# and invokes that CLI for scans, so downloader and process-execution
# capabilities are the product's purpose rather than dropper behaviour.
defaults:
  platforms: [unix, windows]
  for: [vsix, package.json, xml, javascript, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Wiz Code VS Code package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: wiz-vscode

  - id: publisher
    desc: WizCloud VS Code extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: WizCloud

  - id: display-name
    desc: Wiz Code VS Code display name
    for: [package.json]
    if:
      type: value
      path: displayName
      exact: Wiz Code

  # Marketplace-qualified extension id; appears in the extension's own README
  # and in its bundled code, so it survives a repackage that drops the manifest.
  - id: extension-identity
    desc: WizCloud Wiz Code extension identity
    for: [xml, text, javascript]
    if:
      type: text
      substr: WizCloud.wiz-vscode

composite_rules:
  - id: product-context
    desc: Recognized WizCloud Wiz Code VS Code extension
    scope: outer
    for: [vsix, package.json]
    all:
      - id: package-name
      - id: publisher
    any:
      - id: display-name
      - id: extension-identity
