# agent-bom — the Python security-posture agent (SBOM, CIS benchmarks,
# cloud inventory, vulnerability correlation).
#
# Its audit corpus is hundreds of collector modules under agent_bom/, and
# each one is written in the shape of the control it audits:
# aws_cis_benchmark.py checks public-access blocks and bucket policies,
# aws_inventory.py lists buckets and reads their ACLs. Reading buckets'
# permission surface is the product working, not cloud recon by an attacker.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: agent-bom wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^agent-bom$'

  - id: module-import
    desc: agent-bom module import
    for: [python]
    if:
      type: text
      substr: 'from agent_bom.'

  - id: package-tree-path
    desc: agent-bom package tree path
    for: [python, text, data, json]
    if:
      type: path
      regex: '(^|/)agent_bom/'

composite_rules:
  - id: agent-bom-benign-context
    desc: agent-bom scanner corpus
    crit: notable
    conf: 0.99
    scope: outer
    for: [whl, egg, zip, python, text, data, json]
    any:
      - id: wheel-distribution-name
      - id: module-import
      - id: package-tree-path

  # Exceptions accept only notable members. The python tests directory is
  # baseline, so this notable composite references that atom instead of
  # repeating its regex. The path leg keeps a copy of the import outside
  # tests/ from using the exception.
  - id: agent-bom-test-tree-import
    desc: agent-bom import inside a Python tests directory
    crit: notable
    for: [python]
    all:
      - id: metadata/path/directory::python-tests-directory-component
      - id: module-import

  # agent-bom's test suite exercises the attack shapes the scanner detects
  # (SAML POST submissions, harvested environment posts, cron pipelines)
  # against the package it ships. The package import plus a tests/ path
  # identifies that suite.
  - id: agent-bom-test-source
    desc: agent-bom test suite source importing its own scanner package
    crit: exception
    all:
      - id: module-import
      - id: agent-bom-test-tree-import
