defaults:
  platforms:
  - unix
  - windows
  crit: component
  conf: 0.96
  size_max: 5000000
traits:
- id: package-name
  crit: notable
  desc: nhi-audit package metadata name
  for:
  - pkginfo
  if:
    type: value
    path: name
    regex: "^nhi[-_]audit$"
- id: package-summary
  crit: notable
  desc: NHI auditor package summary
  for:
  - pkginfo
  if:
    type: value
    path: summary
    regex: "(?i)auditor for Non-Human Identities"
- id: module-path
  crit: component
  desc: agentsentry Python package path
  for:
  - python
  if:
    type: path
    regex: "agentsentry[\\\\/]"
- id: provider-subclass
  crit: component
  desc: Provider subclass of BaseProvider
  for:
  - python
  if:
    type: text
    regex: class\s+\w+Provider\s*\(\s*BaseProvider\b
- id: risk-model
  crit: component
  desc: RiskLevel severity member reference
  for:
  - python
  if:
    type: text
    regex: "\\bRiskLevel\\.(CRITICAL|HIGH|MEDIUM|LOW)\\b"
- id: no-exfil-pledge
  crit: component
  desc: Local-scan no-exfiltration pledge text
  for:
  - python
  if:
    type: text
    substr: No data leaves the machine
- id: nhi-model--nonhumanidentity
  crit: component
  desc: NonHumanIdentity model name
  for:
  - python
  if:
    type: text
    word: NonHumanIdentity
- id: nhi-model--nhitype
  crit: component
  desc: NHIType model name
  for:
  - python
  if:
    type: text
    word: NHIType
composite_rules:
- id: nhi-model
  desc: NHI model-name reference
  crit: component
  for:
  - python
  any:
  - id: nhi-model--nonhumanidentity
  - id: nhi-model--nhitype
- id: module-context
  desc: agent-sentry source module context
  crit: component
  conf: 0.97
  for: [python]
  all:
  - id: module-path
  any:
  - id: provider-subclass
  - id: nhi-model
  - id: risk-model
  - id: no-exfil-pledge
- id: package-context
  desc: agent-sentry package metadata context
  crit: component
  conf: 0.97
  for: [pkginfo]
  any:
  - id: package-name
  - id: package-summary
- id: nhi-auditor-context
  desc: agent-sentry NHI defensive auditor context
  crit: notable
  conf: 0.97
  for: [python, pkginfo]
  any:
  - id: module-context
  - id: package-context
