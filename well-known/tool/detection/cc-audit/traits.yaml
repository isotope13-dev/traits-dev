# cc-audit (ryo-ebata/cc-audit) is a security auditor for Claude Code artifacts.
# Bundles test fixtures, built-in detection rules, and bypass attempt examples
# for validating its own audit engine.
defaults:
  platforms: [unix, windows]
  for: [rust, shell, python, javascript, typescript, json, yaml, cargo.toml, manifests, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: cargo-package-name
    desc: cc-audit Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: cc-audit

  - id: cargo-repository
    desc: cc-audit Cargo repository URL
    for: [cargo.toml]
    if:
      type: value
      path: package.repository
      exact: https://github.com/ryo-ebata/cc-audit

  - id: source-tree-path
    desc: cc-audit source or test tree member
    if:
      type: path
      regex: '(^|[/])cc-audit(@v[0-9]|\b)'

  - id: security-auditor-summary
    desc: Package description describes security auditor
    for: [cargo.toml]
    if:
      type: value
      path: package.description
      regex: '(?i)security auditor for claude code'

composite_rules:
  - id: cc-audit-source-tree
    desc: cc-audit defensive security scanner source tree member
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: source-tree-path
      - id: cargo-package-name

  - id: cc-audit-security-scanner-context
    desc: cc-audit defensive security scanner context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: cargo-package-name
      - id: cargo-repository
      - id: security-auditor-summary
      - id: source-tree-path
