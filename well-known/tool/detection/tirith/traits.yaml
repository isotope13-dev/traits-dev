# Tirith — open-source terminal-security scanner (shell hook + CLI) that
# intercepts commands, pasted content, and files for pipe-to-shell,
# homographs, ANSI injection, malicious AI skills, and known-bad
# packages/domains before they execute. Its tests, detector sources, rule
# docs, fixtures, benches, and release QA embed attack strings as detection
# corpus by design — those strings are what the tool is built to catch.
defaults:
  conf: 0.99
  platforms:
  - windows
  - unix
traits:
# Broad group scoping: the firing rules (e.g. powershell-exclusion-assignment)
# are themselves type-agnostic, tripping even on doc pages the classifier
# labels kotlin; the exception must reach every file object they reach.
# `markdown` is ungrouped, so it is listed explicitly.
- id: tirith-release-tree-member
  desc: Tirith release tree member
  crit: notable
  for: [scripts, source, manifests, documents, data, build, markdown]
  size_max: 50000000
  if:
    type: path
    regex: '(^|[\\/])tirith[\\/\\-]'
- id: tirith-source-marker
  desc: Tirith project source marker
  crit: notable
  for: [scripts, source, manifests, documents, data, build, markdown]
  size_max: 50000000
  if:
    type: text
    substr: tirith
  unless:
    - id: metadata/file/format/security-corpus::trait-expectation-catalog
- id: tirith-cli-binary-marker
  desc: Tirith CLI security-analysis help signature
  crit: notable
  for: [elf]
  size_max: 50000000
  if:
    type: text
    section: .rodata
    substr: tirith Security Scanner
- id: tirith-decoded-command-corpus-member
  desc: Tirith decoded command-corpus member
  crit: notable
  for: [shell]
  size_max: 50000000
  if:
    type: path
    regex: 'tirith##base64@'

composite_rules:
- id: tirith-defensive-scanner-context
  desc: Tirith defensive scanner project context
  crit: exception
  conf: 0.99
  any:
  - id: tirith-release-tree-member
  - id: tirith-source-marker
- id: tirith-embedded-command-corpus-context
  desc: Tirith embeds a decoded shell-rule corpus
  crit: exception
  for: [tar.gz, elf, shell]
  scope: outer
  all:
  - id: tirith-cli-binary-marker
  - id: tirith-decoded-command-corpus-member
