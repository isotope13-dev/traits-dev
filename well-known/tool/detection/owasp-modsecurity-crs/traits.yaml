# The OWASP ModSecurity Core Rule Set ships PowerShell command-name catalogs
# as data files. Cleave may classify these catalogs as PowerShell from their
# contents, but they are signatures consumed by ModSecurity, not scripts.
defaults:
  conf: 1.0
  platforms: [unix, windows]

traits:
  - id: owasp-crs-powershell-catalog-name
    desc: OWASP CRS PowerShell catalog filename
    crit: notable
    for: [powershell]
    if:
      type: basename
      exact: windows-powershell-commands.data

  - id: owasp-crs-rules-directory
    desc: OWASP CRS source tree path
    crit: notable
    # The matcher is a path substring, so it describes the whole release tree,
    # not one language in it. Restricted to `powershell` it could only ever
    # vouch for the signature catalogs, and the C utilities shipped beside
    # them carried no identity: `util/av-scanning/runAV/common.c` is a setuid
    # CGI helper that opens with `setresuid(0,0,0); setresgid(0,0,0);` to
    # assume root before running the scanner, and scored
    # `native-setresuid-escalation` at hostile for it.
    for: [powershell, c, cpp, shell, source]
    if:
      type: path
      substr: owasp-modsecurity-crs

  - id: owasp-crs-release-directory
    desc: OWASP CRS release source directory
    crit: notable
    for: [powershell]
    if:
      type: path
      substr: coreruleset-

composite_rules:
  - id: owasp-crs-powershell-catalog-context
    desc: OWASP CRS PowerShell signature-data context
    crit: exception
    all:
      - id: owasp-crs-powershell-catalog-name
    any:
      - id: owasp-crs-rules-directory
      - id: owasp-crs-release-directory
