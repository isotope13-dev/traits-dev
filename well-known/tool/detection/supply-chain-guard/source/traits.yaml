# These path/name rules identify source-distribution-shaped members. They do
# not authenticate the package or prove that matched content is benign.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, manifests, text, markdown, json]
  crit: notable
  conf: 0.99
composite_rules:
  - id: supply-chain-guard-source-code-path-context
    desc: Member path resembles scanner source, fixture, or matcher content
    crit: exception
    all:
      - id: metadata/package/files/name::supply-chain-guard-source-code-member
    any:
      - id: metadata/package/files/name::supply-chain-guard-fixture-member
      - id: metadata/package/files/name::supply-chain-guard-matcher-source-member
      - id: metadata/package/files/name::supply-chain-guard-workflow-matcher-member
  - id: supply-chain-guard-source-reference-path-context
    desc: Member path resembles scanner documentation or catalog content
    crit: exception
    all:
      - id: metadata/package/files/name::supply-chain-guard-source-reference-member
    any:
      - id: metadata/package/files/name::supply-chain-guard-catalog-member
      - id: metadata/package/files/name::supply-chain-guard-test-carrier-member
      - id: metadata/file/naming::uppercase-readme-md-basename
  - id: supply-chain-guard-source-path-context
    desc: Member path resembles scanner source or reference content
    crit: exception
    any:
      - id: supply-chain-guard-source-code-path-context
      - id: supply-chain-guard-source-reference-path-context
  - id: supply-chain-guard-detection-reference-path-context
    desc: Scanner-shaped paths and exported IOC reference tables
    crit: exception
    any:
      - id: supply-chain-guard-source-code-path-context
      - id: supply-chain-guard-source-reference-path-context
      - id: well-known/tool/detection/supply-chain-guard/ioc::exported-ioc-blocklists
