defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  - manifests
  - text
  - markdown
  - json
  crit: exception
  conf: 0.99
composite_rules:
- id: supply-chain-guard-source-code-path-context
  desc: Member path resembles scanner source, fixture, or matcher content
  all:
  - id: metadata/path::supply-chain-guard-source-code-member
  any:
  - id: metadata/path::supply-chain-guard-fixture-member
  - id: metadata/filename/identity::supply-chain-guard-matcher-source-member
  - id: metadata/filename/identity::supply-chain-guard-workflow-matcher-member
- id: supply-chain-guard-source-reference-path-context
  desc: Member path resembles scanner documentation or catalog content
  all:
  - id: metadata/path::supply-chain-guard-source-reference-member
  any:
  - id: metadata/path::supply-chain-guard-catalog-member
  - id: metadata/path::supply-chain-guard-test-carrier-member
  - id: metadata/filename/identity::uppercase-readme-md-basename
- id: supply-chain-guard-source-path-context
  desc: Member path resembles scanner source or reference content
  any:
  - id: supply-chain-guard-source-code-path-context
  - id: supply-chain-guard-source-reference-path-context
- id: supply-chain-guard-detection-reference-path-context
  desc: Scanner-shaped paths and exported IOC reference tables
  any:
  - id: supply-chain-guard-source-code-path-context
  - id: supply-chain-guard-source-reference-path-context
  - id: metadata/file/catalog/identity::exported-ioc-blocklists
