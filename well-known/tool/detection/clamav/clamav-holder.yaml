defaults:
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  # Every marker sits at a fixed offset inside the first 256 bytes, so the file
  # has to be at least a DOS stub plus PE headers for any of them to exist.
  size_min: 1024

traits:
  - id: clamav-holder-banner
    desc: ClamAV holder DOS stub banner
    crit: notable
    if:
      type: hex
      pattern: "21 54 68 69 73 20 66 69 6c 65 20 77 61 73 20 63 72 65 61 74 65 64 20 62 79 20 43 6c 61 6d 41 56"
      offset: 76

  - id: clamav-gpl-banner
    desc: ClamAV scanner banner string
    crit: notable
    if:
      type: hex
      pattern: "43 6c 61 6d 41 56 20 2d 20 41 20 47 50 4c 20 76 69 72 75 73 20 73 63 61 6e 6e 65 72"
      offset: 150

  - id: clamav-coff-timestamp
    desc: CLAM COFF timestamp marker
    crit: notable
    if:
      type: hex
      pattern: "43 4c 41 4d"
      offset: 216

composite_rules:
  - id: clamav-rewritten-pe-holder
    desc: ClamAV rewritten PE holder artifact
    crit: suspicious
    all:
      - id: clamav-holder-banner
      - id: clamav-gpl-banner
    any:
      - id: clamav-coff-timestamp
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    needs: 2

  - id: clamav-holder-shellexec
    desc: ClamAV holder still launches via ShellExecute
    crit: hostile
    conf: 0.94
    attack: T1059
    all:
      - id: clamav-holder-banner
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    unless:
      - id: metadata/signed/platform/

  - id: clamav-holder-writable-ep
    desc: ClamAV holder keeps a writable entry point
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: clamav-holder-banner
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
