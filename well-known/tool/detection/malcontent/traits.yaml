defaults:
  conf: 0.99
  for: [elf]
  platforms: [unix]

traits:
  - id: malcontent-project-marker
    desc: malcontent defensive scanner project marker
    crit: notable
    size_max: 70000000
    if:
      type: text
      section: .rodata
      substr: github.com/chainguard-dev/malcontent

  - id: malcontent-yara-catalog
    desc: malcontent embedded YARA rule catalog marker
    crit: notable
    size_max: 70000000
    if:
      type: text
      section: .rodata
      substr: YARAForge

  - id: malcontent-upx-config-key
    desc: malcontent UPX configuration environment key
    crit: notable
    size_max: 70000000
    if:
      type: text
      section: .rodata
      substr: MALCONTENT_UPX_PATH

# A scanner's YARA catalog is embedded data, not behavior its own executable
# performs. The project path, embedded catalog, and upstream UPX environment
# key identify malcontent itself before this suppressor discounts catalog hits.
composite_rules:
  - id: malcontent-defensive-scanner-context
    desc: Recognized malcontent defensive scanner executable context
    crit: exception
    scope: file
    all:
      - id: malcontent-project-marker
      - id: malcontent-yara-catalog
      - id: malcontent-upx-config-key
