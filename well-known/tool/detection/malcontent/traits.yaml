defaults:
  conf: 0.99
  for: [elf]
  platforms: [unix]

traits:
  - id: malcontent-project-marker
    desc: malcontent defensive scanner project marker
    crit: notable
    size_max: 70000000
    if:
      type: text
      section: .rodata
      substr: github.com/chainguard-dev/malcontent

  - id: malcontent-yara-catalog
    desc: malcontent embedded YARA rule catalog marker
    crit: notable
    size_max: 70000000
    if:
      type: text
      section: .rodata
      substr: YARAForge

  - id: malcontent-upx-config-key
    desc: malcontent UPX configuration environment key
    crit: notable
    size_max: 70000000
    if:
      type: text
      section: .rodata
      substr: MALCONTENT_UPX_PATH

# A scanner's YARA catalog is embedded data, not behavior its own executable
# performs. The project path, embedded catalog, and upstream UPX environment
# key identify malcontent itself before this suppressor discounts catalog hits.
  # malcontent shipped as bincapz before the rename (2024 macOS builds):
  # Go package paths name the old module, and the rule-link template points
  # at the bincapz rules tree.
  # Go keeps package paths in the read-only data and pclntab, inside long
  # unterminated runs the string extractor does not split; match the bytes.
  - id: bincapz-project-marker
    desc: bincapz scanner Go module path
    crit: notable
    for: [macho]
    platforms: [macos]
    size_max: 70000000
    if:
      type: raw
      section: __DATA_CONST,__rodata
      substr: github.com/chainguard-dev/bincapz/pkg/
  - id: bincapz-rule-link-template
    desc: bincapz rule documentation link template
    crit: notable
    for: [macho]
    platforms: [macos]
    size_max: 70000000
    if:
      type: text
      section: __TEXT,__rodata
      substr: github.com/chainguard-dev/bincapz/blob/main/rules/
  # The rule catalog is one concatenated blob; extracted text does not
  # surface the source tag inside it.
  - id: bincapz-yara-catalog
    desc: bincapz embedded YARA rule catalog marker
    crit: notable
    for: [macho]
    platforms: [macos]
    size_max: 70000000
    if:
      type: raw
      section: __TEXT,__rodata
      substr: YARAForge

composite_rules:
  # The engine drops third_party/ hits on files carrying this context. The
  # ELF markers match only ELF and the bincapz markers only Mach-O, so three
  # legs is always one generation's complete set.
  - id: malcontent-defensive-scanner-context
    desc: Recognized malcontent defensive scanner executable context
    crit: exception
    scope: file
    for: [elf, macho]
    platforms: [unix, macos]
    any:
      - id: malcontent-project-marker
      - id: malcontent-yara-catalog
      - id: malcontent-upx-config-key
      - id: bincapz-project-marker
      - id: bincapz-rule-link-template
      - id: bincapz-yara-catalog
    needs: 3
