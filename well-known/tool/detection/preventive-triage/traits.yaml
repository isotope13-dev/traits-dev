# @preventive/triage — Client & relay server for triaging automated reports
# (by Nikita Skovoroda / PreventiveMeasures). Its risk analysis heuristics
# inspect npm packages and GitHub Actions for suspicious patterns, documenting
# and catching dangerous calls (eval, child_process, credentials, etc.).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, text]
  crit: notable
  conf: 0.99

traits:
  - id: preventive-triage-package-name
    desc: Preventive triage package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@preventive/triage"

  - id: preventive-triage-npm-package-name
    desc: Preventive triage npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@preventive/triage"

  - id: preventive-triage-project-repository
    desc: Preventive triage project repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/PreventiveMeasures/triage

  - id: preventive-triage-npm-repository
    desc: Preventive triage npm package repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      substr: github.com/PreventiveMeasures/triage

  - id: preventive-triage-path
    desc: Preventive triage package or source path
    if:
      type: path
      regex: '(?i)(@preventive[-/]triage|PreventiveMeasures[\\/]triage)'

composite_rules:
  - id: preventive-triage-defensive-scanner-context
    desc: Recognized Preventive triage defensive report scanner context
    crit: notable
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json, javascript, typescript, text]
    any:
      - id: preventive-triage-package-name
      - id: preventive-triage-npm-package-name
      - id: preventive-triage-project-repository
      - id: preventive-triage-npm-repository
      - id: preventive-triage-path
