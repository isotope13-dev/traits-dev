# SecureVector AI threat monitor ships detection catalogs that quote
# ransomware commands and cloud secret names. Those strings are signatures,
# not live behavior.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: securevector-ai-monitor-wheel
    desc: SecureVector AI threat-monitor wheel
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)securevector[_-]ai[_-]monitor'

  - id: securevector-vss-signature-row
    desc: SecureVector catalogs vssadmin as dangerous
    if:
      type: text
      substr: '("vssadmin delete shadows", "dangerous"'

  - id: securevector-threat-monitor-summary
    desc: SecureVector real-time AI threat monitoring
    if:
      type: text
      substr: Real-time AI threat monitoring. Protect your apps from prompt injection
