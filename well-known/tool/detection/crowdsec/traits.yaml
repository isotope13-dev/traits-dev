defaults:
  platforms: [unix, windows]
  for: [data, scripts, source, zip]
  crit: notable
  conf: 0.99

traits:
  - id: crowdsec-hub-source-tree
    desc: CrowdSec Hub repository path
    if:
      type: path
      substr: crowdsecurity/hub

  - id: crowdsec-hub-index-schema
    desc: CrowdSec Hub index schema
    for: [json]
    if:
      type: text
      regex: '"scenarios"\s*:\s*\{[\s\S]{0,1000}"parsers"\s*:\s*\{'

composite_rules:
  - id: crowdsec-hub-context
    desc: CrowdSec Hub security detection catalog context
    crit: notable
    conf: 0.99
    any:
      - id: crowdsec-hub-source-tree
      - id: crowdsec-hub-index-schema
