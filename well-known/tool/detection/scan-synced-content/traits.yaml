defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: scan-synced-content-source-marker
    desc: scan-synced-content supply-chain scanner
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'scan-synced-content(\.test)?\.mjs\s*—\s*.{0,40}scanner'
  - id: scan-synced-content-script-path
    desc: scan-synced-content script path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: 'scripts/scan-synced-content(\.test)?\.mjs$'

composite_rules:
  - id: scan-synced-content-scanner-context
    desc: scan-synced-content supply-chain scanner
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: scan-synced-content-script-path
      - id: scan-synced-content-source-marker
