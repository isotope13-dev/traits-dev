defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, package.json]
  crit: notable
  conf: 0.98
  size_min: 100
  size_max: 500000000

traits:
  - id: xgrep-go-module-pe
    desc: Mondoo xgrep Go module on PE
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: go.mondoo.com/xgrep

  - id: xgrep-go-module-elf
    desc: Mondoo xgrep Go module on ELF
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: go.mondoo.com/xgrep

  - id: xgrep-go-module-macho
    desc: Mondoo xgrep Go module on Mach-O
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: go.mondoo.com/xgrep

  - id: xgrep-npm-package-name
    desc: Mondoo xgrep scanner npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@mondoohq/xgrep(_.*)?$'

composite_rules:
  - id: xgrep-scanner-context
    desc: Mondoo xgrep scanner context
    crit: exception
    conf: 0.98
    any:
      - id: xgrep-go-module-pe
      - id: xgrep-go-module-elf
      - id: xgrep-go-module-macho
      - id: xgrep-npm-package-name
