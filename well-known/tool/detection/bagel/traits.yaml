# bagel: BoostSecurity's credential-exposure scanner. It reads the same
# places a credential stealer would -- ~/.aws, ~/.azure, application default
# credentials, shell history -- which is why the credential-access rules
# suppress on it. Its Go module path is the identifier.
defaults:
  platforms: [unix, windows]
  for: [go, text, source]
  crit: notable
  conf: 0.99
  size_max: 104857600
traits:
  - id: bagel-go-module-path
    desc: bagel scanner Go module path
    if:
      type: text
      substr: github.com/boostsecurityio/bagel
