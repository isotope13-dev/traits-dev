defaults:
  conf: 0.99
  platforms:
  - windows
  - unix
  for:
  - python

traits:
- id: code-guardian-intake-module-name
  desc: code-guardian intake module file name
  crit: notable
  if:
    type: basename
    regex: '^intake_(rules|text)\.py$'
- id: code-guardian-intake-rules-docstring
  desc: code-guardian intake rules module docstring
  crit: notable
  if:
    type: text
    substr: 'Repo-intake rules: deterministic checks that read a quarantined copy'
- id: code-guardian-intake-text-docstring
  desc: code-guardian intake text module docstring
  crit: notable
  if:
    type: text
    substr: 'Repo intake, text a person cannot see and text written for an AI agent'

composite_rules:
- id: code-guardian-scanner-source
  desc: code-guardian defensive repo-intake scanner source
  crit: exception
  conf: 0.99
  all:
  - id: code-guardian-intake-module-name
  any:
  - id: code-guardian-intake-rules-docstring
  - id: code-guardian-intake-text-docstring
  needs: 1
