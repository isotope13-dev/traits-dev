# fletch (atomdrift-project/fletch) finds the external references hiding in a
# file -- `curl ... | sh`, `iwr ... | iex`, `npm install` inside a RUN -- and
# fetches them for an analyzer. Its source and unit tests spell those command
# shapes out as input examples, so command-line detection signatures match the
# strings without any command being run.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.97

traits:
  - id: filefacts-reference-import
    desc: Imports filefacts reference types
    if:
      type: text
      regex: 'use filefacts::\{[^}\n]{0,120}\bRefKind\b[^}\n]{0,120}\bRefLocator\b'

  - id: fletch-module-doc
    desc: Module doc names the fletch find stage
    if:
      type: text
      substr: 'half of fletch.'

composite_rules:
  - id: fletch-reference-finder-source
    desc: fletch reference-finder source file
    all:
      - id: filefacts-reference-import
      - id: fletch-module-doc
