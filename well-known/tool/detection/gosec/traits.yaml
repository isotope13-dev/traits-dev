# Gosec (Go Security Checker) AST-based source code scanner.
defaults:
  platforms: [unix, windows]
  for: [go, github-actions, zip, shell]
  crit: notable
  conf: 0.98

traits:
  - id: gosec-action-docker-image
    desc: Official gosec Docker action image
    for: [github-actions]
    if:
      type: text
      regex: 'docker://securego/gosec:[0-9]'

  - id: gosec-source-archive-path
    desc: Gosec source archive member path
    if:
      type: path
      substr: securego/gosec

  - id: gosec-action-identity
    desc: Gosec Security Checker action name
    for: [github-actions]
    if:
      type: text
      substr: 'Gosec Security Checker'

composite_rules:
  - id: gosec-scanner-context
    desc: Recognized Gosec security scanner context
    crit: exception
    conf: 0.99
    any:
      - id: gosec-action-docker-image
      - id: gosec-source-archive-path
      - id: gosec-action-identity
