defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - source
    - documents
  crit: component
  conf: 0.92
  size_max: 5000000

traits:
  - id: dangerous-query-keyword-denylist--union
    desc: Scanner denylist UNION keyword
    if:
      type: text
      word: UNION
  - id: dangerous-query-keyword-denylist--drop
    desc: Scanner denylist DROP keyword
    if:
      type: text
      word: DROP
  - id: dangerous-query-keyword-denylist--delete
    desc: Scanner denylist DELETE keyword
    if:
      type: text
      word: DELETE
  - id: dangerous-query-keyword-denylist--insert
    desc: Scanner denylist INSERT keyword
    if:
      type: text
      word: INSERT
  - id: dangerous-query-keyword-denylist--update
    desc: Scanner denylist UPDATE keyword
    if:
      type: text
      word: UPDATE
  - id: dangerous-query-keyword-denylist--exec
    desc: Scanner denylist EXEC keyword
    if:
      type: text
      word: EXEC
  - id: dangerous-query-keyword-denylist--execute
    desc: Scanner denylist EXECUTE keyword
    if:
      type: text
      word: EXECUTE

composite_rules:
  - id: dangerous-query-keyword-denylist
    desc: Scanner SQL keyword denylist
    crit: notable
    conf: 0.92
    any:
      - id: dangerous-query-keyword-denylist--union
      - id: dangerous-query-keyword-denylist--drop
      - id: dangerous-query-keyword-denylist--delete
      - id: dangerous-query-keyword-denylist--insert
      - id: dangerous-query-keyword-denylist--update
      - id: dangerous-query-keyword-denylist--exec
      - id: dangerous-query-keyword-denylist--execute
