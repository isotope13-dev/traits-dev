defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - source
    - documents
  crit: component
  conf: 0.92
  size_max: 5000000

traits:
  - id: dangerous-query-keyword-denylist--union
    desc: SQL UNION SELECT statement marker
    if:
      type: text
      regex: '(?i)\bUNION\s+(ALL\s+)?SELECT\b'
  - id: dangerous-query-keyword-denylist--drop
    desc: SQL DROP object statement marker
    if:
      type: text
      # A bare word also matches UI comments such as CSS `DROP BUTTON`.
      regex: '(?i)DROP\s+(TABLE|VIEW|INDEX)\b'
  - id: dangerous-query-keyword-denylist--delete
    desc: SQL DELETE FROM statement marker
    if:
      type: text
      regex: '(?i)\bDELETE\s+FROM\b'
  - id: dangerous-query-keyword-denylist--insert
    desc: SQL INSERT INTO statement marker
    if:
      type: text
      regex: '(?i)\bINSERT\s+INTO\b'
  - id: dangerous-query-keyword-denylist--update
    desc: SQL UPDATE SET statement marker
    if:
      type: text
      regex: '(?i)\bUPDATE\s+[A-Za-z_][A-Za-z0-9_$.\[\]]*\s+SET\b'
  - id: dangerous-query-keyword-denylist--exec
    desc: SQL EXEC system-procedure marker
    if:
      type: text
      regex: '(?i)\bEXEC\s+(xp_|sp_)[A-Za-z0-9_]+'
  - id: dangerous-query-keyword-denylist--execute
    desc: SQL EXECUTE system-procedure marker
    if:
      type: text
      regex: '(?i)\bEXECUTE\s+(xp_|sp_)[A-Za-z0-9_]+'

composite_rules:
  - id: dangerous-query-keyword-denylist
    desc: Scanner SQL keyword denylist
    crit: notable
    conf: 0.92
    any:
      - id: dangerous-query-keyword-denylist--union
      - id: dangerous-query-keyword-denylist--drop
      - id: dangerous-query-keyword-denylist--delete
      - id: dangerous-query-keyword-denylist--insert
      - id: dangerous-query-keyword-denylist--update
      - id: dangerous-query-keyword-denylist--exec
      - id: dangerous-query-keyword-denylist--execute
