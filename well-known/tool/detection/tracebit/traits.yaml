# Tracebit Community Edition (tracebit-com/tracebit-community-action) — a
# deception/canary tool that plants decoy AWS credentials and SSH keys on CI
# runners and alerts when anyone uses them. Its own demo and test workflows
# print the planted decoys (`cat ~/.aws/credentials`, `cat ~/.npmrc`) to show
# they exist, so credential-file reads in a workflow that invokes the action
# are inspecting canaries, not stealing real secrets.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.95

traits:
  - id: community-action-step
    desc: Tracebit canary-credential action step
    size_min: 1
    if:
      type: text
      regex: 'uses:\s*tracebit-com/tracebit-community-action@'
