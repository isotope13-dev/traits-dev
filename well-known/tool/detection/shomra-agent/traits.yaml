# Shomra (@shomra/agent) is an open-source AI agent security and guardrail assurance tool.
# Detects malicious tool calls, prompt injections, and manages agent workload identities.
defaults:
  platforms: [unix, windows]
  for: [manifests, scripts, source, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Shomra agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@shomra/agent'

  - id: repository-url
    desc: Shomra agent GitHub repository
    for: [package.json, javascript, typescript, json, markdown, text]
    if:
      type: text
      substr: github.com/shomra-org/agent

  - id: detection-signals-source
    desc: Shomra agent detection signal definitions
    for: [javascript, typescript]
    if:
      type: path
      regex: 'detect[\\/]signals'

  - id: workload-identity-source
    desc: Shomra workload identity token exchange source
    for: [javascript, typescript]
    if:
      type: text
      substr: '/var/run/secrets/shomra/token'

composite_rules:
  - id: package-identity
    desc: Recognized Shomra agent security guardrail package
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: repository-url
      - id: detection-signals-source
      - id: workload-identity-source
