# Oracle Macaron — SLSA / malware-analyzer research tool. Its
# tests/ trees ship captured PyPI malware as fixtures, not payloads.
defaults:
  platforms: [unix, windows]
  for: [python, github-actions]
  crit: notable
  conf: 0.99

traits:
  - id: github-repo
    desc: Oracle Macaron GitHub repository path
    if:
      type: text
      substr: github.com/oracle/macaron

  - id: package-module
    desc: Macaron Python package import path
    for: [python]
    if:
      type: text
      substr: from src.macaron
