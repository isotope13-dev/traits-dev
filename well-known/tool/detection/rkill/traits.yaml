# Identity of the repair routines, including the embedded x64 helper. This is
# not a whole-file safety assertion: an infected RKill retains these strings.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 16777216

traits:
  - id: repair-log-banner
    desc: RKill diagnostic log banner
    if:
      type: text
      exact: Rkill Debug Information
      section: rdata
  - id: ifeo-removal-log
    desc: RKill IFEO debugger removal diagnostic
    if:
      type: text
      substr: '[IFEO Debugger Deleted]'
      section: rdata

composite_rules:
  - id: repair-tool-identity
    desc: RKill malware process and policy repair tool
    all:
      - id: repair-log-banner
      - id: ifeo-removal-log
