# Augustus (github.com/praetorian-inc/augustus) — Praetorian's open-source
# LLM vulnerability scanner. Its probe packages, docs and Go tests ship the
# adversarial prompts, jailbreak personas, injection payloads and canary
# exfiltration URLs it fires at a *target model* on purpose. That is the
# scanner's corpus, not behavior performed against the installing host.
defaults:
  platforms: [unix, windows]
  for: [zip, tar, scripts, source, documents, data]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  # Source-archive member: the versioned Go module tree path
  # (github.com/praetorian-inc/augustus@<ref>/...).
  - id: repo-tree-member
    desc: Augustus repository tree member
    if:
      type: path
      regex: '(?i)praetorian-inc[\\/]augustus[@ .-]'

  # Go module proxy archive: the analyzed outer path carries the zip basename.
  - id: module-archive-member
    desc: Augustus Go module archive member
    if:
      type: path
      regex: '(?i)praetorian-inc-augustus-v[0-9]'

composite_rules:
  - id: llm-probe-corpus-context
    desc: Recognized Augustus LLM probe corpus
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: repo-tree-member
      - id: module-archive-member
