defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - github-actions
  size_max: 5000000
traits:
- id: bearer-tool
  desc: Bearer SAST tool reference
  crit: component
  if:
    type: text
    regex: bearer/bearer|bearer\s+(scan|ci|init)\b
- id: semgrep-tool
  desc: Semgrep SAST tool reference
  crit: component
  if:
    type: text
    word: semgrep
- id: grype-tool
  desc: Grype vulnerability scanner reference
  crit: component
  if:
    type: text
    word: grype
- id: scorecard-tool
  desc: OpenSSF Scorecard reference
  crit: component
  if:
    type: text
    regex: ossf/scorecard|scorecard-action|scorecard\s+--(repo|local)\b
- id: trufflehog-tool
  desc: TruffleHog secret scanner reference
  crit: component
  if:
    type: text
    word: trufflehog
- id: trufflehog-release-url
  desc: TruffleHog latest-release API URL
  crit: notable
  conf: 0.99
  for: [javascript, typescript, python, shell, github-actions]
  if:
    type: text
    substr: trufflesecurity/trufflehog/releases/latest
- id: lockfile-lint-tool
  desc: lockfile-lint reference
  crit: component
  if:
    type: text
    word: lockfile-lint
- id: snyk-tool
  desc: Snyk security scanner reference
  crit: component
  if:
    type: text
    word: snyk

- id: snyk-npm-package
  desc: Snyk CLI npm package name
  for: [package.json, npm, tar]
  crit: notable
  conf: 0.99
  if:
    type: value
    path: name
    exact: snyk

- id: snyk-archive-package-name
  desc: Snyk CLI npm archive identity
  for: [npm, tar]
  crit: notable
  conf: 0.99
  if:
    type: value
    path: npm.name
    exact: snyk

- id: snyk-package-member-context
  desc: Snyk CLI package member context
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  if:
    type: value
    path: package.json::name
    exact: snyk
# A secret-scanner rule table names its rules `aws_secret_key` / "GitHub Token"
# style, i.e. with a separator before the credential noun. Without that
# separator the pattern matched any camel-case identifier ending in the noun
# (`Name: "exprmapkey"` in a Go AST), which is not a scanner rule at all.
# The leading \b likewise keeps the key itself from being a suffix: fastlane's
# option tables write `env_name: "FL_GITHUB_API_TOKEN"`, which is a config
# option declaration, not a secret-scanner rule table.
- id: secret-scanner-rule-name-entry
  desc: Secret-scanner rule named for a credential kind
  crit: baseline
  conf: 0.92
  for:
  - javascript
  - typescript
  - python
  - ruby
  - go
  - rust
  if:
    type: text
    regex: \bname:\s*["'][A-Za-z][\w .-]{1,28}[ _-](key|secret|token|password)["']
    case_insensitive: true
  unless:
  - id: metadata/library/web3/
  - id: well-known/lib/development/chevrotain::chevrotain-recording-token-marker
- id: js-secret-scanner-pattern-table
  desc: JavaScript secret scanner regex table
  crit: baseline
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \["[a-z0-9-]*(key|secret|token|password)[a-z0-9-]*",\s*/
    case_insensitive: true
- id: js-secret-scan-tool-name
  desc: JavaScript secret_scan tool name
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: secret_scan
- id: js-secret-scan-redacted-output
  desc: JavaScript secret scan redacted output
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: redacted findings|redact\(match\[0\]\)
- id: python-secret-label-catalog
  desc: Python secret detector label catalog
  crit: baseline
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: '"(OpenAI API key|GitHub PAT|AWS access key|Slack token)"'
- id: python-secret-rule-catalog
  desc: Python secret detection rule catalog
  crit: baseline
  conf: 0.96
  for:
  - python
  if:
    type: text
    substr: _BUILTIN_PATTERNS
- id: vscode-marketplace-publish-script
  desc: VS Code marketplace publishing script
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\b(VSCE_PAT|OVSX_PAT|vsce\\s+publish|ovsx\\s+publish)\\b"
- id: trufflehog-detector-source-path
  desc: TruffleHog detector implementation path
  crit: notable
  conf: 0.99
  for: [go, pe, dll, archives, tar]
  if:
    type: path
    regex: '[\\/]detectors[\\/]'
- id: trufflehog-go-module-path
  desc: TruffleHog Go module path
  crit: notable
  conf: 0.99
  for: [elf, pe, go]
  if:
    type: value
    path: elf.go.module.path
    regex: trufflesecurity/trufflehog
- id: trufflehog-handlers-testdata-path
  desc: TruffleHog handlers testdata fixture path
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: 'handlers[\\/]testdata'
composite_rules:
- id: secret-scanner-named-regex
  desc: Named credential regex entries
  crit: baseline
  conf: 0.94
  for:
  - javascript
  - typescript
  - python
  - ruby
  - go
  - rust
  any:
  - id: secret-scanner-rule-name-entry
  - id: js-secret-scanner-pattern-table
  - id: python-secret-label-catalog
- id: secret-scanner-implementation
  desc: Read-only secret scanner implementation
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  all:
  - id: js-secret-scanner-pattern-table
  - id: js-secret-scan-tool-name
  any:
  - id: js-secret-scan-redacted-output
  - id: secret-scanner-named-regex
- id: sast-scanner-integration
  desc: Package integrates multiple SAST scanners
  crit: baseline
  conf: 0.95
  needs: 3
  any:
  - id: well-known/tool/detection/sast::bearer-tool
  - id: well-known/tool/detection/sast::grype-tool
  - id: well-known/tool/detection/sast::js-secret-scan-redacted-output
  - id: well-known/tool/detection/sast::js-secret-scan-tool-name
  - id: well-known/tool/detection/sast::js-secret-scanner-pattern-table
  - id: well-known/tool/detection/sast::lockfile-lint-tool
  - id: well-known/tool/detection/sast::python-secret-label-catalog
  - id: well-known/tool/detection/sast::python-secret-rule-catalog
  - id: well-known/tool/detection/sast::scorecard-tool
  - id: well-known/tool/detection/sast::secret-scanner-rule-name-entry
  - id: well-known/tool/detection/sast::semgrep-tool
  - id: well-known/tool/detection/sast::snyk-tool
  - id: well-known/tool/detection/sast::trufflehog-tool
  - id: well-known/tool/detection/sast::vscode-marketplace-publish-script

- id: snyk-cli-package-context
  desc: Snyk CLI security scanner package
  crit: notable
  conf: 0.99
  scope: outer
  for: [javascript, typescript, npm, tar]
  any:
    - id: snyk-npm-package
    - id: snyk-archive-package-name
    - id: snyk-package-member-context

- id: trufflehog-package-context
  desc: TruffleHog secret scanner source package
  crit: notable
  conf: 0.99
  scope: outer
  for: [go, pe, dll, elf, archives, tar, javascript, typescript]
  any:
    - id: trufflehog-detector-source-path
    - id: metadata/package/testing/harness/pe-fixture::decoder-test-fixture-path
    - id: trufflehog-go-module-path

- id: trufflehog-package-exception
  desc: TruffleHog scanner archive and test fixture context
  crit: exception
  conf: 0.99
  scope: outer
  for: [go, pe, dll, elf, archives, tar, zip, javascript, typescript]
  any:
    - id: trufflehog-detector-source-path
    - id: trufflehog-handlers-testdata-path
