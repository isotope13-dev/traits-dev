# Cordon (cordon-scanner on PyPI) is a published supply-chain security scanner.
# Its wheel bundles detection rule corpora and example malicious patterns used
# for matching, not behavior the scanner performs at install time.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, python-sdist, markdown, text, json, yaml]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-distribution-name
    desc: cordon-scanner PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: cordon-scanner

  - id: python-package-path
    desc: cordon_scanner Python package tree member
    for: [python, text, markdown, json, yaml]
    if:
      type: path
      regex: '(^|[/])(cordon_scanner|cordon_sandbox)(/|$)'

  - id: cordon-builtin-rule-pack
    desc: Cordon built-in detection rule pack marker
    for: [yaml, text]
    if:
      type: text
      substr: 'source: cordon-builtin'

  - id: cordon-capability-rule-case
    desc: Cordon numbered capability rule case id
    for: [yaml, text, markdown]
    if:
      type: text
      regex: '\bid:\s*CAP\.[A-Z]{2,10}\.'

  - id: supply-chain-scanner-summary
    desc: Package summary describes supply-chain scanning
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)supply[- ]chain.{0,40}security scanner'

composite_rules:
  - id: cordon-defensive-scanner-context
    desc: Recognized Cordon supply-chain scanner distribution
    crit: exception
    conf: 0.99
    scope: file
    for: [whl, python-sdist, pkginfo, python, tar, zip, scripts, data, yaml, text, markdown, json]
    any:
      - id: python-package-path
      - id: pypi-distribution-name
      - id: cordon-builtin-rule-pack
      - id: cordon-capability-rule-case
      - id: supply-chain-scanner-summary
