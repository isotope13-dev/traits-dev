# React Doctor — deterministic React codebase auditor (millionco/react-doctor,
# npm react-doctor, `react.doctor`). It ships its own secret-detection and
# exploit-pattern rules plus a regression corpus of deliberately vulnerable
# fixtures (WordPress plugin.php, decompiled-malware bridge snippets, scam
# copy, fake malicious update samples), so its own tree trips token-format,
# exploit, decoy, data-extension and install-hook composites.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, markdown, text]
  crit: notable
  conf: 0.97

traits:
  - id: react-doctor-package-name
    desc: React Doctor npm package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: react-doctor
  - id: react-doctor-scoped-package-name
    desc: React Doctor scoped npm package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@react-doctor/'
  - id: react-doctor-oxlint-plugin-name
    desc: React Doctor oxlint plugin package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: oxlint-plugin-react-doctor
  - id: react-doctor-eslint-plugin-name
    desc: React Doctor ESLint plugin package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: eslint-plugin-react-doctor
  - id: react-doctor-product-site
    desc: React Doctor product site reference
    if:
      type: text
      substr: react.doctor
  - id: react-doctor-action-ref
    desc: React Doctor GitHub Action versioned reference
    if:
      type: text
      regex: 'millionco/react-doctor@v\d'
  # Member-path anchor so file-level findings inside the scanner tree resolve
  # to their author: fixtures and rule tables carry no other react-doctor
  # string, but their archive path names the monorepo package they belong to.
  - id: react-doctor-tree-path
    desc: React Doctor monorepo member path
    for: [scripts, source, text, json, markdown, php, python, shell, powershell]
    if:
      type: path
      regex: '(react-doctor-[0-9]+/packages/|oxlint-plugin-react-doctor)'

composite_rules:
  - id: react-doctor-security-scanner
    desc: React Doctor security scanner
    crit: notable
    conf: 0.97
    any:
      - id: react-doctor-package-name
      - id: react-doctor-scoped-package-name
      - id: react-doctor-oxlint-plugin-name
      - id: react-doctor-eslint-plugin-name
      - id: react-doctor-product-site
      - id: react-doctor-action-ref
  # Archive-wide benign context: the package manifest names the scanner and
  # its tree carries the product site, so scanner rules and deliberately
  # vulnerable fixtures resolve to their author, not to an attack.
  - id: react-doctor-scanner-context
    desc: React Doctor scanner tree content context
    crit: exception
    conf: 0.96
    scope: outer
    for: [tar, zip, npm, package.json, javascript, typescript, json]
    all:
      - id: react-doctor-package-name
    any:
      - id: react-doctor-product-site
      - id: react-doctor-oxlint-plugin-name
      - id: react-doctor-scoped-package-name
