defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  size_max: 5000000
traits:
- id: secret-scrub-denylist-fragment
  desc: Secret/auth-header redaction denylist
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(?i)secret\\|token\\|cookie|bearer\\|api[_-]?key"
- id: redacted-replacement-marker
  desc: REDACTED replacement marker
  crit: component
  conf: 0.9
  size_max: 52428800
  if:
    type: text
    substr: REDACTED
- id: js-sensitive-patterns-object-sensitive
  desc: JavaScript sensitive pattern object
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: bind
    exact: SENSITIVE_PATTERNS
- id: js-detect-sensitive-patterns-function
  desc: JavaScript sensitive-pattern detector
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: detectSensitivePatterns
- id: js-standalone-secret-matches-function
  desc: JavaScript secret-match detector
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: findStandaloneSecretMatches
- id: js-likely-secret-match-function
  desc: JavaScript secret validator
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: isLikelySecretMatch
- id: js-detect-sensitive-patterns-async-function
  desc: JavaScript async sensitive-pattern detector
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: detectSensitivePatternsAsync
- id: js-secret-env-names-catalog
  desc: JavaScript secret environment catalog
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: bind
    exact: SECRET_ENV_NAMES
- id: js-redactable-types-catalog
  desc: JavaScript redactable type catalog
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: bind
    exact: REDACTABLE_TYPES
- id: python-secret-patterns-list
  desc: Python secret regex pattern list
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: bind
    exact: _SECRET_PATTERNS
- id: private-key-path-redaction-regex
  desc: Private key path redaction regex entry
  crit: component
  conf: 0.92
  size_max: 52428800
  for: [javascript, typescript]
  if:
    type: text
    regex: '/id_rsa/i|/id_ed25519/i'
- id: sensitive-file-read-block-message
  desc: Sensitive file read block message
  crit: component
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)cannot read sensitive (system )?files'
- id: sensitive-path-denylist-array
  desc: Sensitive path denylist array guard
  crit: component
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  if:
    type: text
    regex: 'authorized_keys.{0,200}\.netrc|\.netrc.{0,200}authorized_keys'
composite_rules:
- id: secret-redaction-layer
  desc: Secret redaction/scrubbing layer
  crit: notable
  conf: 0.92
  all:
  - id: secret-scrub-denylist-fragment
  - id: redacted-replacement-marker
- id: sensitive-data-js-validator
  desc: JavaScript sensitive-data validator
  crit: notable
  conf: 0.9
  any:
  - id: js-detect-sensitive-patterns-function
  - id: js-standalone-secret-matches-function
  - id: js-likely-secret-match-function
- id: sensitive-data-js-scanner
  desc: JavaScript sensitive-data scanner implementation
  crit: notable
  conf: 0.95
  all:
  - id: js-sensitive-patterns-object-sensitive
  - id: sensitive-data-js-validator
- id: sensitive-data-js-content-scanner
  desc: JavaScript sensitive-data content scanner
  crit: notable
  conf: 0.95
  all:
  - id: js-detect-sensitive-patterns-async-function
  - id: micro-behaviors/data/manipulation::js-redact-sensitive-text-function
- id: sensitive-data-js-redactor
  desc: JavaScript sensitive-data redactor implementation
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/manipulation::js-redact-sensitive-text-function
  - id: js-secret-env-names-catalog
  - id: js-redactable-types-catalog
- id: sensitive-data-python-sanitizer
  desc: Python sensitive-data sanitizer implementation
  crit: notable
  conf: 0.95
  all:
  - id: python-secret-patterns-list
  - id: micro-behaviors/data/manipulation::python-sanitize-function-name
- id: sensitive-data-scanner
  desc: Sensitive-data scanner or sanitizer
  crit: notable
  conf: 0.95
  any:
  - id: sensitive-data-js-scanner
  - id: sensitive-data-js-content-scanner
  - id: sensitive-data-js-redactor
  - id: sensitive-data-python-sanitizer
- id: credential-path-redaction-guard
  desc: Defensive credential-path redaction guard
  crit: notable
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/data/manipulation::replacement-redaction-marker
  - id: private-key-path-redaction-regex
- id: sensitive-file-read-denylist-guard
  desc: Defensive sensitive-file read denylist guard
  crit: notable
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  all:
  - id: sensitive-file-read-block-message
  - id: sensitive-path-denylist-array
