defaults:
  platforms: [windows, unix]
  size_max: 5000000
traits:
- id: secret-scrub-denylist-fragment
  for: [scripts, source]
  desc: Secret/auth-header redaction denylist
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(?i)secret\\|token\\|cookie|bearer\\|api[_-]?key"
- id: redacted-replacement-marker
  for: [scripts, source]
  desc: REDACTED replacement marker
  crit: notable
  conf: 0.9
  size_max: 52428800
  if:
    type: text
    substr: REDACTED
  not:
    # HTTP clients such as axios redact logged values as "[REDACTED ****]".
    - substr: "[REDACTED"
- id: js-sensitive-patterns-object-sensitive
  desc: JavaScript sensitive pattern object
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: bind
    exact: SENSITIVE_PATTERNS
- id: js-detect-sensitive-patterns-function
  desc: JavaScript sensitive-pattern detector
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: detectSensitivePatterns
- id: js-standalone-secret-matches-function
  desc: JavaScript secret-match detector
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: findStandaloneSecretMatches
- id: js-likely-secret-match-function
  desc: JavaScript secret validator
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: isLikelySecretMatch
- id: js-detect-sensitive-patterns-async-function
  desc: JavaScript async sensitive-pattern detector
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: function
    exact: detectSensitivePatternsAsync
- id: js-secret-env-names-catalog
  desc: JavaScript secret environment catalog
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: bind
    exact: SECRET_ENV_NAMES
- id: js-redactable-types-catalog
  desc: JavaScript redactable type catalog
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: bind
    exact: REDACTABLE_TYPES
- id: python-secret-patterns-list
  desc: Python secret regex pattern list
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: bind
    exact: _SECRET_PATTERNS
- id: private-key-path-redaction-regex
  desc: Private key path redaction regex entry
  crit: notable
  conf: 0.92
  size_max: 52428800
  for: [javascript, typescript]
  if:
    type: text
    regex: '/id_rsa/i|/id_ed25519/i'
- id: sensitive-file-read-block-message
  desc: Sensitive file read block message
  crit: notable
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)cannot read sensitive (system )?files'
- id: sensitive-path-denylist-array
  desc: Sensitive path denylist array guard
  crit: notable
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  if:
    type: text
    regex: 'authorized_keys.{0,200}\.netrc|\.netrc.{0,200}authorized_keys'
# `find_credential_markers` is the detector's own function name, not prose
# about it, so this names the tool the same way its siblings here do -- and
# every one of those is notable. It was `baseline`, which in well-known/ means
# a rule that only ever suppresses and never identifies anything.
- id: credential-marker-detector
  desc: Credential marker detector internals
  crit: notable
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: 'find_credential_markers|secret-shaped token|secret span .{0,120}redacted'
- id: secret-pattern-description-field
  for: [scripts, source, documents]
  desc: Secret-pattern description field
  crit: notable
  conf: 0.95
  # `[^"\n]` keeps the credential word inside the description string. With a
  # bare `.` the window ran past the closing quote into the next field, so an
  # ordinary command table (`description:"Set a context variable",usage:"set
  # <key> <value>"`) read as a secret-pattern catalog entry.
  if:
    type: text
    regex: '(?i)description:\s*"[^"\n]{0,80}(secret|token|key|password)\b'
- id: secret-redactor-suggest-field
  for: [scripts, source, documents]
  desc: Secret redactor env-var remediation suggestion
  crit: notable
  conf: 0.92
  count_min: 3
  if:
    type: text
    regex: suggest:\s*['"]process\.env\.
- id: bracketed-redacted-marker
  for: [scripts, source]
  desc: Bracketed redacted replacement marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\[redacted(:[a-z0-9_-]+)?\]'
- id: secret-redactor-symbols
  for: [scripts, source, documents]
  desc: Secret redactor / leak-scanner function names
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\b(redactString|redactSecrets?|redactEntropy|sanitizePayload)\\b"
- id: secret-pattern-private-key-description
  for: [scripts, source, documents]
  desc: Secret pattern description names private key
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)description\s*:\s*["''][^"\r\n]{0,60}(Private Key|Secret Key)\b'
- id: secret-pattern-token-label
  for: [scripts, source, documents]
  desc: Secret scanner token label
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: Personal Access Token|Service Account Key|Access Key ID
- id: credential-stripping-scratch-dir
  for: [scripts, source, documents]
  desc: Credential-stripping sandbox env builder
  crit: notable
  conf: 0.9
  if:
    type: text
    # cloc's `--sdir` help says "scratch directory instead of" with no
    # credential context. The sandbox this names redirects HOME.
    regex: '(?i)scratch dir\w* instead of.{0,80}(HOME|credential|secret)'
- id: credential-stripping-mcp-env-keys
  for: [scripts, source, documents]
  desc: MCP credential strip list
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: _MCP_STRIP_ENV_KEYS
- id: credential-dir-denylist-phrase
  for: [scripts, source, documents]
  desc: Credential-store directory denylist phrasing
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(?i)credential[- ]?(store|dir)s?.{0,60}(deny|block)[- ]?list"
composite_rules:
- id: secret-redaction-layer
  for: [scripts, source]
  desc: Secret redaction/scrubbing layer
  crit: notable
  conf: 0.92
  all:
  - id: secret-scrub-denylist-fragment
  - id: redacted-replacement-marker
- id: sensitive-data-js-validator
  for: [scripts, source]
  desc: JavaScript sensitive-data validator
  crit: notable
  conf: 0.9
  any:
  - id: js-detect-sensitive-patterns-function
  - id: js-standalone-secret-matches-function
  - id: js-likely-secret-match-function
- id: sensitive-data-js-scanner
  for: [javascript]
  desc: JavaScript sensitive-data scanner implementation
  crit: notable
  conf: 0.95
  all:
  - id: js-sensitive-patterns-object-sensitive
  - id: sensitive-data-js-validator
- id: sensitive-data-js-content-scanner
  for: [javascript]
  desc: JavaScript sensitive-data content scanner
  crit: notable
  conf: 0.95
  all:
  - id: js-detect-sensitive-patterns-async-function
  - id: micro-behaviors/data/manipulation::js-redact-sensitive-text-function
- id: sensitive-data-js-redactor
  for: [javascript]
  desc: JavaScript sensitive-data redactor implementation
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/manipulation::js-redact-sensitive-text-function
  - id: js-secret-env-names-catalog
  - id: js-redactable-types-catalog
- id: sensitive-data-python-sanitizer
  for: [python]
  desc: Python sensitive-data sanitizer implementation
  crit: notable
  conf: 0.95
  all:
  - id: python-secret-patterns-list
  - id: micro-behaviors/data/manipulation::python-sanitize-function-name
- id: sensitive-data-scanner
  for: [scripts, source]
  desc: Sensitive-data scanner or sanitizer
  crit: notable
  conf: 0.95
  any:
  - id: sensitive-data-js-scanner
  - id: sensitive-data-js-content-scanner
  - id: sensitive-data-js-redactor
  - id: sensitive-data-python-sanitizer
- id: credential-path-redaction-guard
  desc: Defensive credential-path redaction guard
  crit: notable
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/data/manipulation::replacement-redaction-marker
  - id: private-key-path-redaction-regex
- id: sensitive-file-read-denylist-guard
  desc: Defensive sensitive-file read denylist guard
  crit: notable
  conf: 0.94
  size_max: 52428800
  for: [javascript, typescript]
  all:
  - id: sensitive-file-read-block-message
  - id: sensitive-path-denylist-array
