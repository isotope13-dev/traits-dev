defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: webanalyzer-security-package-member
  desc: WebAnalyzer Security scanner package member
  crit: notable
  conf: 0.99
  for: [python, whl, pkginfo, json, text]
  if:
    type: path
    regex: '(?i)webanalyzer([-_]security)?'
- id: webanalyzer-scanner-source-marker
  desc: WebAnalyzer security scanner source marker
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: text
    regex: '(?i)(Advanced Content Scanner|Elite API Security Hunter|WEBANALYZER_PLUGIN_DIRS)'
