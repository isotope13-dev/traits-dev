# Nox is a published, defensive security scanner. Its source includes
# filesystem inspection, release bootstrapping, plugin execution, and cloud
# API clients as part of the scanner's documented operation.
defaults:
  platforms: [unix, windows]
  for: [go, shell, markdown, github-actions]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: Nox security scanner Go module path
    for: [go, go.mod]
    if:
      type: text
      regex: '(?i)\bmodule\s+github\.com/nox-hq/nox\b'

  - id: scanner-readme
    desc: Nox offline MCP scanner product statement
    for: [markdown]
    if:
      type: text
      substr: 'The MCP scanner that never sees your code.'

  - id: action-repository
    desc: Nox GitHub Action repository identifier
    for: [shell, github-actions]
    if:
      type: text
      regex: '(?i)(readonly\s+REPO=|github\.com/)"?nox-hq/nox'

composite_rules:
  - id: nox-source-context
    desc: Recognized Nox defensive scanner source
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: module-path
      - id: scanner-readme
