# js-x-ray — the NodeSecure JavaScript AST security analyzer
# (@nodesecure/js-x-ray). It is a detector: its probes recognize obfuscated
# requires, encoded literals and known obfuscators, so its probe sources and
# README carry the very hex-encoded require and encoded-literal patterns the
# anti-static objectives match. The identity is what an analyst wants
# surfaced, and those objectives reference the exception below from `unless:`.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: manifest-name
    desc: js-x-ray manifest name
    if:
      type: value
      path: "name"
      exact: "@nodesecure/js-x-ray"

  - id: nodesecure-probe-imports
    desc: NodeSecure probe-support imports
    if:
      type: import
      regex: '^@nodesecure/(sec-literal|estree-ast-utils)'

composite_rules:
  - id: js-x-ray-distribution
    desc: Recognized js-x-ray distribution
    crit: exception
    conf: 0.97
    scope: outer
    for: [npm, javascript, typescript, package.json]
    any:
      - id: manifest-name
      - id: nodesecure-probe-imports
