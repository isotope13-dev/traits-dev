# AgentAuditKit is a published agent-security scanner. Example trees ship
# intentional vulnerable configs (curl|bash postinstall, dotenv secrets).
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, package.json, github-actions, json, text, data, markdown, shell, scripts]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AgentAuditKit package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agent-audit-kit

  - id: module-import
    desc: AgentAuditKit Python module import
    for: [python]
    if:
      type: import
      regex: '^agent_audit_kit(\.|$)'

  - id: vulnerable-example-path
    desc: AgentAuditKit vulnerable-config example path
    for: [package.json, github-actions, text, markdown]
    if:
      type: path
      regex: 'vulnerable-configs'

  - id: tree-path
    desc: AgentAuditKit distribution member path
    for: [python, json, text, data, markdown, github-actions, shell, scripts, package.json]
    if:
      type: path
      regex: 'agent-audit-kit'

composite_rules:
  - id: scanner-context
    desc: Recognized AgentAuditKit security scanner
    crit: exception
    conf: 0.99
    for: [scripts, manifests, data, markdown, github-actions, shell, json, text, python]
    scope: archive
    any:
      - id: package-name
      - id: module-import
      - id: vulnerable-example-path
      - id: tree-path
