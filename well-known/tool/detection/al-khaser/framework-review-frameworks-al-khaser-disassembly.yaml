defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  crit: notable
  conf: 0.98

traits:
  - id: al-khaser-disassembly-constant
    desc: al-khaser constant-condition helper call
    if:
      type: symbol
      kind: call
      exact: __AsmConstantCondition
  - id: al-khaser-disassembly-same-target
    desc: al-khaser same-target jump helper call
    if:
      type: symbol
      kind: call
      exact: __AsmJmpSameTarget
  - id: al-khaser-disassembly-impossible
    desc: al-khaser disassembly-confusion helper call
    if:
      type: symbol
      kind: call
      exact: __AsmImpossibleDisassm

  - id: al-khaser-disassembly-function-pointer
    desc: al-khaser function-pointer helper call
    if:
      type: symbol
      kind: call
      exact: __AsmFunctionPointer
  - id: al-khaser-disassembly-return-pointer
    desc: al-khaser return-pointer abuse helper call
    if:
      type: symbol
      kind: call
      exact: __AsmReturnPointerAbuse
  - id: al-khaser-disassembly-seh
    desc: al-khaser SEH misuse helper call
    if:
      type: symbol
      kind: call
      exact: __AsmSEHMisuse


composite_rules:
  - id: al-khaser-disassembly-harness
    desc: al-khaser anti-analysis test source
    all:
      - id: well-known/tool/detection/al-khaser::al-khaser-disassembly-constant
      - id: well-known/tool/detection/al-khaser::al-khaser-disassembly-same-target
      - id: well-known/tool/detection/al-khaser::al-khaser-disassembly-impossible
