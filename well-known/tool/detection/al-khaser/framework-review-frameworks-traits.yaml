defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

composite_rules:
- id: al-khaser-anti-analysis-framework
  size_min: 1024
  size_max: 10485760
  desc: al-khaser probe helper-name fingerprint
  crit: suspicious
  conf: 0.98
  attack: T1587.001
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  needs: 3
  any:
  - id: metadata/binary/symbols/name/function::check-mac-addr-helper-name
  - id: metadata/binary/symbols/name/function::check-adapter-name-helper-name
  - id: metadata/binary/symbols/name/function::read-memory-wow64-helper-name
  - id: metadata/binary/symbols/name/function::get-peb64-helper-name
  - id: metadata/binary/symbols/name/function::firmware-table-enum-helper-name
  - id: objectives/anti-analysis/vm-detect/instruction::descriptor-table-helper-cluster
