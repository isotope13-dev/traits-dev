defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  size_min: 1024
  size_max: 10485760

traits:
  - id: al-khaser-pdb-path
    desc: al-khaser tool build PDB path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'al-khaser.pdb'

composite_rules:
  - id: al-khaser-build-helper-context
    desc: al-khaser build and helper context
    crit: exception
    conf: 0.98
    all:
      - id: well-known/tool/detection/al-khaser::al-khaser-pdb-path
    any:
      - id: metadata/binary/symbols/name/function::check-mac-addr-helper-name
      - id: metadata/binary/symbols/name/function::check-adapter-name-helper-name
      - id: metadata/binary/symbols/name/function::read-memory-wow64-helper-name
      - id: metadata/binary/symbols/name/function::get-peb64-helper-name
      - id: metadata/binary/symbols/name/function::firmware-table-enum-helper-name
