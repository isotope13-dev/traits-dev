# InnerWarden — compiled Rust "agent-guard" CLI that screens AI-agent tool
# calls before execution (github.com/InnerWarden/inner-warden, innerwarden.com).
# Shipped per-platform via npm (`@innerwarden/cli-<os>-<arch>`).
#
# Its own detection ruleset embeds the destructive/exfil/persistence command
# strings it watches for (rm -rf --no-preserve-root, ufw disable, curl|sh,
# cron persistence, cloud-metadata SSRF, XMRig, keylogger labels, etc.) as
# literal rodata, plus a YAML test-fixture corpus (`expected:
# triggered`/`not_triggered`, `bypass_technique:`, `tool_response:`) asserting
# its own detector flags them. Those strings are a catalog and test corpus,
# never executed -- the same "security tool embeds attacker signatures as
# data" shape as malcontent and agent-glovebox.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 209715200

traits:
  - id: product-banner
    desc: InnerWarden Community Edition product banner
    if:
      type: text
      substr: "InnerWarden Community Edition"

  - id: agent-guard-block-message
    desc: InnerWarden agent-guard block message
    if:
      type: text
      substr: "InnerWarden agent-guard blocked"

  - id: homepage-domain
    desc: innerwarden.com product domain reference
    if:
      type: text
      regex: '(?i)\binnerwarden\.com/(enterprise|defend|free)\b'

  - id: cli-contain-subcommand
    desc: innerwarden contain sandbox subcommand
    if:
      type: text
      substr: "innerwarden contain"

  - id: npm-package-name
    desc: "@innerwarden npm scoped package name"
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@innerwarden/'

composite_rules:
  - id: innerwarden-defensive-tool-context
    desc: Recognized InnerWarden AI-agent guardrail executable context
    crit: exception
    conf: 0.97
    scope: file
    needs: 2
    any:
      - id: product-banner
      - id: agent-guard-block-message
      - id: homepage-domain
      - id: cli-contain-subcommand
