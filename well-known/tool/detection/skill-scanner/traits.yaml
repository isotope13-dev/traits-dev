defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: banner
  desc: Skill Scanner defensive audit banner
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: 'Skill Scanner v1\.0[\s\S]{0,120}Security audit tool for Clawdbot/MCP skills'
- id: implementation-class
  desc: Skill Scanner implementation class
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^class SkillScanner\s*:'
- id: threat-pattern-table
  desc: Skill Scanner threat-pattern table
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^THREAT_PATTERNS\s*=\s*\['
- id: verdict-enum
  desc: Skill Scanner verdict enumeration
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^class Verdict\(Enum\)\s*:'

# TypeScript/Vitest regression tests for the same defensive scanner carry
# deliberately hostile-looking source snippets in template literals. The
# scanner module import, test-runner import, and a real scanSource call
# identify the harness without treating those fixtures as live behavior.
- id: typescript-scanner-module-import
  desc: Skill scanner implementation module import
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: import
    exact: ./scanner.js

- id: typescript-scanner-test-framework-import
  desc: Vitest defensive scanner test import
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: import
    exact: vitest

- id: typescript-scanner-api-call
  desc: Skill scanner source-analysis test call
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: scanSource

composite_rules:
- id: source-context
  desc: Recognized defensive skill scanner source context
  crit: exception
  conf: 0.99
  scope: file
  all:
  - id: banner
  - id: implementation-class
  - id: threat-pattern-table
  - id: verdict-enum
- id: typescript-test-context
  desc: Recognized defensive skill scanner TypeScript test context
  crit: exception
  conf: 0.99
  for: [javascript, typescript]
  scope: file
  all:
  - id: typescript-scanner-module-import
  - id: typescript-scanner-test-framework-import
  - id: typescript-scanner-api-call
