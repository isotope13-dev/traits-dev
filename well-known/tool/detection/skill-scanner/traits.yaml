defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: drskill-injection-check-module
  desc: DrSkill injection-check module
  crit: notable
  conf: 0.99
  if:
    type: path
    basename: true
    exact: injection.py
- id: drskill-package-summary
  desc: DrSkill defensive skill-audit package
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: summary
    regex: '(?i)brew doctor for your AI agent.{0,80}skill loadout'
- id: drskill-injection-check-marker
  desc: DrSkill credential-read check marker
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: '@check("injection-credential-read")'

- id: banner
  desc: Skill Scanner defensive audit banner
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: 'Skill Scanner v1\.0[\s\S]{0,120}Security audit tool for Clawdbot/MCP skills'
- id: implementation-class
  desc: Skill Scanner implementation class
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^class SkillScanner\s*:'
- id: threat-pattern-table
  desc: Skill Scanner threat-pattern table
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^THREAT_PATTERNS\s*=\s*\['
- id: verdict-enum
  desc: Skill Scanner verdict enumeration
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^class Verdict\(Enum\)\s*:'

# TypeScript/Vitest regression tests for the same defensive scanner carry
# deliberately hostile-looking source snippets in template literals. The
# scanner module import plus a real scanSource call identify the harness
# without treating those fixtures as live behavior.
#
# The test-runner import that used to sit here matched a bare `import ...
# from "vitest"` and so fired on every Vitest suite in every project — a
# general-purpose fact with no tie to this tool. It now lives with the other
# neutral harness facts at
# metadata/package/testing/harness/unit::vitest-import, and is not part of
# this identity because two scanner-specific legs already pin the file.
- id: typescript-scanner-module-import
  desc: Skill scanner implementation module import
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: import
    exact: ./scanner.js

- id: typescript-scanner-api-call
  desc: Skill scanner source-analysis test call
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: scanSource

composite_rules:
- id: drskill-context
  desc: Recognized DrSkill defensive skill scanner
  crit: notable
  conf: 0.99
  scope: archive
  all:
  - id: drskill-injection-check-module
  - id: drskill-package-summary
- id: drskill-injection-file-context
  desc: Recognized DrSkill injection-check source file
  crit: exception
  conf: 0.99
  scope: file
  all:
  - id: drskill-injection-check-module
  - id: drskill-injection-check-marker
- id: source-context
  desc: Recognized defensive skill scanner source context
  crit: exception
  conf: 0.99
  scope: file
  all:
  - id: banner
  - id: implementation-class
  - id: threat-pattern-table
  - id: verdict-enum
- id: typescript-test-context
  desc: Recognized defensive skill scanner TypeScript test context
  crit: exception
  conf: 0.99
  for: [javascript, typescript]
  scope: file
  all:
  - id: typescript-scanner-module-import
  - id: typescript-scanner-api-call
