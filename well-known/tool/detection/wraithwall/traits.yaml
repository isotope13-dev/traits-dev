# WraithWall is an open-source deception and threat intelligence platform
# (wraithwall on PyPI). It provides honeypot analysis (Cowrie intelligence),
# LLM firewall, link checking, and includes sandbox_kit for generating synthetic
# attack sessions and seed corpora to test deception components.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl, python-sdist, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-distribution-name
    desc: wraithwall PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: wraithwall

  - id: python-package-path
    desc: wraithwall Python package tree member
    for: [python, whl, text, markdown, json]
    if:
      type: path
      regex: '(^|[/])wraithwall(/|$)'

  - id: sandbox-kit-package-path
    desc: WraithWall sandbox kit package tree member
    for: [python, whl, text, markdown, json]
    if:
      type: path
      regex: '(^|[/])sandbox_kit(/|$)'

  - id: deception-platform-summary
    desc: Package summary describes deception platform
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: deception-and-threat-intelligence platform

composite_rules:
  - id: wraithwall-platform-identity
    desc: Recognized WraithWall deception platform component
    crit: notable
    conf: 0.99
    scope: file
    any:
      - id: python-package-path
      - id: sandbox-kit-package-path
      - id: pypi-distribution-name
      - id: deception-platform-summary
