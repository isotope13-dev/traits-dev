# skill-analysis (jixiang-cc / ClawHub): local OpenClaw Skill static+dynamic auditor.
# Engine source ships as scripts/analyze_skill.txt with embedded detection-rule
# corpora; heuristic AV and obfuscation composites must not treat rule text as live payloads.
defaults:
  platforms: [unix, windows]
  conf: 0.99

traits:
  - id: analyze-skill-engine-basename
    desc: skill-analysis audit engine filename
    crit: notable
    for: [python, text]
    if:
      type: basename
      exact: analyze_skill.txt

  - id: analyze-skill-audit-docstring
    desc: skill-analysis static audit module docstring
    crit: notable
    for: [python, text]
    if:
      type: text
      regex: 'analyze_skill\.py — 静态分析.{0,40}Skills 的安全'

  - id: skill-analysis-openclaw-manifest-name
    desc: openclaw-skill.json names skill-analysis
    crit: notable
    for: [json]
    if:
      type: value
      path: name
      exact: skill-analysis

  - id: engine-hashes-integrity-manifest
    desc: skill-analysis engine_hashes integrity manifest
    crit: notable
    for: [json, markdown, text, python]
    if:
      type: text
      substr: rules/engine_hashes.json

composite_rules:
  - id: skill-analysis-audit-engine-context
    desc: skill-analysis defensive audit engine source
    crit: exception
    conf: 0.99
    scope: file
    for: [python, text]
    all:
      - id: analyze-skill-engine-basename
      - id: analyze-skill-audit-docstring

  - id: skill-analysis-defensive-scanner-context
    desc: skill-analysis local Skill security scanner package
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, python, text, markdown, json, package.json]
    all:
      - id: analyze-skill-engine-basename
    any:
      - id: skill-analysis-openclaw-manifest-name
      - id: engine-hashes-integrity-manifest
      - id: analyze-skill-audit-docstring
    needs: 1
