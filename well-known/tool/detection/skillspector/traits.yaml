defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.99
traits:
  - id: skillspector-cli-entrypoint
    desc: SkillSpector scanner CLI entry point declaration
    for: [pyproject.toml]
    if:
      type: value
      path: project.scripts.skillspector
      exact: skillspector.cli:app
  - id: skillspector-static-analyzer-import
    desc: SkillSpector static analyzer module import
    for: [python]
    if:
      type: import
      exact: skillspector.nodes.analyzers
composite_rules:
  - id: skillspector-regression-corpus
    desc: SkillSpector scanner with regression fixture corpus
    crit: exception
    for: [python, zip, tar, python-sdist, whl, pyproject.toml]
    scope: archive
    all:
      - id: skillspector-cli-entrypoint
      - id: skillspector-static-analyzer-import
      - id: metadata/package/testing/presence/path::python-tests-fixture-member
