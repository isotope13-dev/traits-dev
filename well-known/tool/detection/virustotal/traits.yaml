defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-client-class
    desc: VirusTotalClient class declaration
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'class\s+VirusTotalClient\b'

  - id: official-api-v3-url
    desc: VirusTotal official API v3 URL
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      substr: virustotal.com/api/v3

composite_rules:
  - id: python-client-source
    desc: VirusTotal Python API client context
    crit: exception
    conf: 0.98
    all:
      - id: python-client-class
      - id: official-api-v3-url
