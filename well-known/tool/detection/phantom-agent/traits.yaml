defaults:
  platforms: [unix, windows]
  for: [python, pyc, scripts, text, json, whl, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 100000000

traits:
  - id: phantom-package-member
    desc: Phantom Agent package member
    if:
      type: path
      regex: '(?i)(^|[\\/])phantom(_agent)?([\\/]|-|$)'
