# tellproof — Lumetrix Advanced Technologies AI product telemetry and guardrail evaluation tool
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: manifest-name
    desc: tellproof manifest package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: tellproof

  - id: repository-url
    desc: tellproof upstream repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: "github.com/Lumetrix-Advanced-Technologies/tellproof"

  - id: canary-telemetry-key
    desc: Tellproof canary guardrail telemetry attribute
    for: [javascript, typescript]
    if:
      type: text
      substr: "tellproof.canary"

  - id: agent-command-string
    desc: Tellproof agent CLI invocation string
    for: [javascript, typescript]
    if:
      type: text
      substr: "npx tellproof"

composite_rules:
  - id: tellproof-package
    desc: Tellproof package distribution
    crit: notable
    conf: 0.99
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    any:
      - id: manifest-name
      - id: repository-url
      - id: canary-telemetry-key
