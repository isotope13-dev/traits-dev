# HELM AI Kernel (github.com/Mindburn-Labs/helm-ai-kernel) -- a Go runtime that
# governs AI-agent tool calls. Its `core/pkg/threatscan` package ships the
# detection rules for prompt injection and tool hijack (cue lists such as
# "ignore previous" / "new instructions" beside agent and action words), and
# its crypto-shredding tests exercise key destruction. Those strings are
# detector data, not directives aimed at an agent.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: kernel-module-import
    desc: Go imports HELM AI Kernel module
    size_min: 1
    if:
      type: text
      substr: github.com/Mindburn-Labs/helm-ai-kernel/
