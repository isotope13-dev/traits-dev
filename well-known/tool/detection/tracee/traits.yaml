defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: tracee-go-module
    desc: Tracee Go module path
    for: [elf, macho, pkginfo, text, go]
    if:
      type: text
      substr: github.com/aquasecurity/tracee
  - id: tracee-source-path
    desc: Aqua Security Tracee source tree
    for: [source, scripts, manifests, documents, data, binaries, text, c, cpp, go]
    if:
      type: path
      substr: github.com/aquasecurity/tracee
  - id: tracee-bpf-source
    desc: Tracee eBPF source file
    for: [source, c, cpp, text]
    if:
      type: path
      substr: tracee.bpf.c
  - id: tracee-vmlinux-missing-header
    desc: Tracee missing vmlinux definitions header
    for: [c, cpp, text]
    if:
      type: text
      substr: __VMLINUX_MISSING_H__

composite_rules:
  - id: tracee-security-monitor
    desc: Aqua Security Tracee eBPF runtime monitor
    crit: notable
    conf: 0.98
    any:
      - id: tracee-go-module
      - id: tracee-source-path
      - id: tracee-bpf-source
      - id: tracee-vmlinux-missing-header
