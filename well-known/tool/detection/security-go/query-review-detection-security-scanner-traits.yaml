defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: security-go-package-member
  desc: Security Go attack detection package member
  crit: notable
  conf: 0.99
  for: [go, go.mod, markdown, text, zip]
  if:
    type: path
    regex: '(?i)erikwang2013[-/]security-go'
- id: security-go-source-marker
  desc: Security Go attack detection source marker
  crit: notable
  conf: 0.99
  for: [go, go.mod]
  if:
    type: text
    substr: github.com/erikwang2013/security-go
