defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 512
  size_max: 524288000
traits:
  - id: chrome-sandbox-profile
    desc: Chromium sandbox profile text
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: "Profile for Chrome Sandbox"
      section: .text
  - id: chrome-sandbox-name
    desc: Chromium sandbox product name
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: "Chrome Sandbox"
      section: .text
  - id: qtwebengine-sandbox
    desc: Qt WebEngine sandbox interface
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "QtWebEngineSandbox"
      section: .text
  - id: sandbox-interception-exports
    desc: Chromium sandbox interception exports
    crit: notable
    conf: 0.97
    if:
      type: symbol
      regex: "^Target(Nt(OpenProcess|OpenProcessToken(Ex)?)|Create(Thread|NamedPipeW))(64)?$"
  - id: chrome-elf-basename
    desc: chrome_elf.dll basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: chrome_elf.dll
      case_insensitive: true
  - id: chrome-elf-rdata-reference
    desc: chrome_elf.dll name in PE read-only data
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: chrome_elf.dll
      section: .rdata
  - id: cef-bootstrap-product-name
    desc: PE ProductName CEF Bootstrap Application
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: 'CEF Bootstrap Application'
  - id: chrome-installer-product-name
    desc: PE ProductName Google Chrome Installer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Google Chrome Installer
  # Chromium's Windows setup bakes in chrome/installer/setup/setup_main.cc
  # and the system-install refusal. Forks such as Maxthon keep both.
  - id: chromium-setup-source-path
    desc: Chromium installer setup source path
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      substr: installer\setup\setup_main.cc
  - id: chromium-setup-system-level-log
    desc: Chromium setup system-install log
    crit: notable
    conf: 0.97
    if:
      type: text
      section: .rdata
      substr: system level Chrome
  - id: chrome-elevated-tracing-service-pdb
    desc: Chrome elevated tracing service PDB identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: elevated_tracing_service.exe.pdb
  # Chromium's app plist declares the Google updater helper and allows
  # arbitrary loads. That pair is the browser, not an SMJobBless implant.
  - id: chrome-updater-privileged-helper
    desc: Chromium updater privileged helper
    crit: notable
    conf: 0.99
    platforms: [macos]
    for: [plist]
    if:
      type: text
      substr: com.google.Chrome.UpdaterPrivilegedHelper

  # Android Chromium/WebView builds ship base/android/linker as
  # libchromium_android_linker.so. Its JNI exports are codegen'd from the
  # org.chromium.base.library_loader classes no other product uses.
  - id: android-linker-jni
    desc: Chromium Android linker JNI exports
    crit: notable
    conf: 0.98
    platforms: [android]
    for: [elf]
    if:
      type: symbol
      regex: '^Java_org_chromium_base_library_1loader_(LegacyLinker|ModernLinkerJni|LinkerJni)_native'
  - id: crazy-linker-log-namespace
    desc: Chromium crazy linker log namespace
    crit: notable
    conf: 0.9
    platforms: [android]
    for: [elf]
    if:
      type: text
      substr: crazy_linker
      section: .rodata

  # The Chromium Windows toolchain emits its own linker sections beside the
  # conventional MSVC set (.crthunk, .fptable, CPADinfo, malloc_h). Any one
  # name alone proves nothing -- a packer can rename a section -- but the
  # trio plus a versioned CrashpadInfo header supports the Chromium layout.
  - id: crthunk-section
    desc: Chromium .crthunk linker section
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: .crthunk
  - id: malloc-hook-section
    desc: Chromium malloc_h linker section
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: malloc_h
  # Files a Chrome / Chrome for Testing build ships beside chrome.dll.
  - id: chrome-binary-family-basename
    desc: chrome.exe / chrome_elf family basename
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^chrome(_elf|_proxy|_pwa_launcher)?\.(exe|dll)$'
      case_insensitive: true
  - id: chromedriver-basename
    desc: ChromeDriver executable basename
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^chromedriver(_win(32|64))?\.exe$'
      case_insensitive: true
  - id: chrome-plugin-helper-basename
    desc: Chrome CDM or NaCl helper basename
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^(widevinecdm\.dll|nacl64\.exe)$'
      case_insensitive: true
  - id: chrome-service-helper-basename
    desc: Chrome notification or elevation helper name
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^(notification_helper|elevation_service)\.exe$'
      case_insensitive: true
composite_rules:
  - id: chromium-distribution-basename
    desc: Chrome distribution binary basename
    crit: notable
    any:
      - id: chrome-binary-family-basename
      - id: chromedriver-basename
      - id: chrome-plugin-helper-basename
      - id: chrome-service-helper-basename
  # Every executable in a Chrome distribution is Authenticode-signed by
  # Google; the browser's own sandbox, loader and credential code is not a
  # third-party implant even when its API surface looks like one.
  - id: verified-google-chromium-distribution-binary
    desc: Verified Google-signed Chrome distribution binary
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signature/verified/signer::google-llc
      - id: chromium-distribution-basename
  - id: chromium-helper
    desc: Chromium or Qt sandbox helper
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: chrome-sandbox-profile
      - id: chrome-sandbox-name
      - id: qtwebengine-sandbox
      - id: sandbox-interception-exports
  - id: chromium-browser-reference
    desc: Chromium helper reference or Chrome product claim
    crit: notable
    conf: 0.99
    any:
      - id: chrome-elf-rdata-reference
      - id: well-known/app/browser/google-chrome::google-chrome-product-name-claim
  - id: google-chrome-browser-context
    desc: Verified Google Chrome browser main binary
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/browser/google-chrome::google-chrome-product-name-claim
    any:
      - id: metadata/signature/verified/signer::google-inc
      - id: metadata/signature/verified/signer::google-llc
  - id: google-chrome-installer
    desc: Verified Google Chrome installer
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signature/verified/signer::google-llc
      - id: chrome-installer-product-name
  - id: chromium-family-setup
    desc: Chromium-family Windows setup binary
    crit: exception
    conf: 0.98
    all:
      - id: chromium-setup-source-path
      - id: chromium-setup-system-level-log
  - id: google-chrome-runtime-component
    desc: Verified Google Chrome runtime component
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signature/verified/signer::google-llc
    any:
      - id: well-known/lib/runtime/scripted/electron::chromium-network-mojom-marker
      - id: chrome-elevated-tracing-service-pdb
  - id: chromium-linker-section-set
    desc: Chromium linker sections with CrashpadInfo header
    crit: notable
    conf: 0.97
    all:
      - id: well-known/lib/development/crashpad::crashpad-client-section
      - id: crthunk-section
      - id: malloc-hook-section
