# SingleFile (Gildas Lormeau) — browser tool and CLI that saves a complete
# web page into a single self-contained HTML file. Its releases publish
# standalone prebuilt binaries on GitHub.
defaults:
  platforms: [unix, windows]
  for: [python, shell, scripts, source, text]
  crit: notable
  conf: 0.98

traits:
  - id: single-file-cli-github-release-url
    desc: SingleFile CLI GitHub release download URL
    if:
      type: text
      substr: github.com/gildas-lormeau/single-file-cli/releases/download

  - id: single-file-cli-binary-asset-name
    desc: SingleFile CLI release binary asset name
    conf: 0.95
    if:
      type: text
      regex: 'single-file-(x86_64|aarch64|arm64)-(linux|apple-darwin)|single-file-win-x64\.exe'

composite_rules:
  - id: single-file-cli-bootstrap-installer-context
    desc: SingleFile CLI release bootstrap context
    crit: exception
    conf: 0.95
    for: [python]
    all:
      - id: single-file-cli-github-release-url
      - id: single-file-cli-binary-asset-name
