defaults:
  platforms: [windows]
  for: [pe]
  size_max: 52428800

traits:
  - id: idm-product-string
    desc: Internet Download Manager product string
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: Internet Download Manager
      section: rdata

  - id: idm-native-messaging-host
    desc: IDM native messaging host id
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: com.tonec.idm
      section: rdata

  - id: idm-product-name
    desc: IDM PE product name metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)Internet Download Manager'

  - id: idm-company-name
    desc: Tonec Inc company version metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Tonec Inc.

  - id: idm-original-filename
    desc: IDMan.exe original filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: IDMan.exe

  - id: idm-extension-id-path
    desc: IDM browser extension ID path
    crit: notable
    conf: 0.98
    platforms: [windows, unix]
    for: [javascript, text, crx, chrome-manifest]
    if:
      type: path
      substr: ngpampappnmepgilojfohadhhmbhlaek.crx

composite_rules:
  - id: idm-browser-integration
    desc: Internet Download Manager browser integration
    crit: notable
    conf: 0.99
    all:
      - id: idm-product-string
    any:
      - id: idm-native-messaging-host
      - id: metadata/signed/developer::tonec-inc.

  # Signed Tonec IDM legitimately reads browser cookies for authenticated
  # downloads and uses WinINet cookie APIs for session continuity. Suppress
  # generic credential-access path/SQL composites that mistake that for theft.
  - id: idm-download-manager-context
    desc: Recognized Internet Download Manager context
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signed/leaf::tonec-inc.
      - id: idm-product-name
