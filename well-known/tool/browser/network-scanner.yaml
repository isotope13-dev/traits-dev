# @fanboynz/network-scanner (FanboyNZ / Ryan Brown) — Puppeteer-based network
# scanner for analyzing web traffic and generating adblock filter rules.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, powershell, json, package.json, text]
  crit: notable
  conf: 0.95

traits:
  - id: network-scanner-package-name
    desc: Network scanner npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@fanboynz/network-scanner"

  - id: network-scanner-github-repo
    desc: Network scanner GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/ryanbr/network-scanner\b'

  - id: network-scanner-scheduled-capture-script
    desc: Network scanner scheduled capture script
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(nwss-capture|win-capture-hidden\.vbs)\b'

composite_rules:
  - id: network-scanner-context
    desc: Network scanner tool context
    crit: exception
    conf: 0.95
    any:
      - id: network-scanner-package-name
      - id: network-scanner-github-repo
      - id: network-scanner-scheduled-capture-script
