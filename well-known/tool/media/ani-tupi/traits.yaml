# ani-tupi is a CLI anime/manga streaming and downloading tool.
# Scraper plugins extract and descramble media player stream URLs.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-path
    desc: ani-tupi wheel distribution path
    for: [whl]
    if:
      type: path
      regex: '(?i)(^|[\\/])ani_tupi-[0-9][^\\/]*\.whl'

  - id: dist-info-path
    desc: ani-tupi dist-info member path
    for: [python, pkginfo]
    if:
      type: path
      regex: 'ani_tupi-[0-9][^/\\]*\.dist-info[\\/]'

  - id: package-metadata-name
    desc: ani-tupi package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: ani-tupi

  - id: project-repository
    desc: ani-tupi upstream repository URL
    for: [python, pkginfo]
    if:
      type: text
      substr: github.com/levyvix/ani-tupi

  - id: plugin-helper-import
    desc: Imports ani-tupi scraper plugin utilities
    for: [python]
    if:
      type: text
      regex: 'from\s+scrapers\.plugins\.utils\s+import\b'

  - id: plugin-loader-call
    desc: ani-tupi plugin loader registration
    for: [python]
    if:
      type: text
      regex: 'load_plugin\(\w+,\s*register\)'

composite_rules:
  - id: plugin-module
    desc: ani-tupi scraper plugin module
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: plugin-helper-import
      - id: plugin-loader-call

  - id: package-context
    desc: Recognized ani-tupi package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: wheel-path
      - id: dist-info-path
      - id: package-metadata-name
      - id: project-repository
      - id: plugin-module
