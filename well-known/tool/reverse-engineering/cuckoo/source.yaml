defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
  crit: notable
  conf: 0.99
traits:
- id: sandbox-banner
  desc: Cuckoo Sandbox source copyright banner
  if:
    type: text
    substr: Cuckoo Sandbox - Automated Malware Analysis.
- id: injection-cli-modes
  desc: Cuckoo injection mode help strings
  if:
    type: text
    regex: --crt.{0,40}CreateRemoteThread injection[\s\S]{0,120}--apc.{0,40}QueueUserAPC injection
- id: session-instrumentation-helper
  desc: Cuckoo session instrumentation helper definition
  if:
    type: text
    substr: int toggle_session_restriction(int enable)
composite_rules:
- id: cuckoo-instrumentation-source
  desc: Cuckoo Sandbox process-instrumentation source
  all:
  - id: sandbox-banner
  - id: injection-cli-modes
  - id: session-instrumentation-helper
