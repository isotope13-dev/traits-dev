defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho, dll]
  crit: notable
  conf: 0.97
  size_min: 65536

traits:
  - id: segger-jlink-registry-path
    desc: SEGGER J-Link registry configuration path
    if:
      type: text
      substr: 'Software\SEGGER\J-Link'
      section: rdata
  - id: segger-jlink-api-symbol
    desc: SEGGER J-Link JLINKARM API symbol prefix
    if:
      type: symbol
      regex: '^JLINKARM_'
  - id: segger-jlink-runtime-dll
    desc: SEGGER JLinkARM.dll runtime reference
    if:
      type: text
      substr: JLinkARM.dll
      section: rdata

composite_rules:
  - id: segger-jlink-identity
    desc: SEGGER J-Link probe software identity
    crit: notable
    conf: 0.98
    any:
      - id: segger-jlink-registry-path
      - id: segger-jlink-api-symbol
      - id: segger-jlink-runtime-dll
