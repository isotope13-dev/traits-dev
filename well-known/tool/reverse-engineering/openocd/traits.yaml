defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho]
  crit: notable
  conf: 0.97
  size_min: 65536

traits:
  - id: openocd-version-banner
    desc: OpenOCD version banner string
    if:
      type: text
      substr: Open On-Chip Debugger
      section: rdata
  - id: openocd-main-symbol
    desc: OpenOCD main entry symbol
    if:
      type: symbol
      exact: openocd_main
  - id: openocd-project-url
    desc: OpenOCD project URL reference
    if:
      type: text
      regex: '(openocd\.org|github\.com/(sysprogs|openocd-org|ntfreak)/openocd)'
      section: rdata

composite_rules:
  - id: openocd-identity
    desc: Open On-Chip Debugger (OpenOCD) tool identity
    crit: notable
    conf: 0.98
    any:
      - id: openocd-version-banner
      - id: openocd-main-symbol
      - id: openocd-project-url
