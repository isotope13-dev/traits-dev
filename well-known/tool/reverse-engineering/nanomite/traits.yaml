defaults:
  crit: notable
  for:
    - pe
    - dll
  platforms:
    - windows
  size_max: 1000000
traits:
  - id: nanomite-found
    desc: Nanomite status string
    conf: 0.99
    if:
      type: text
      substr: No Nanomites Founded
      section: .data
  - id: nanomite-patch-prompt
    desc: Nanomite patch prompt
    conf: 0.99
    if:
      type: text
      substr: Correct File To Patch Nanomites
      section: .data
  - id: armnf-export
    desc: ArmNF patch export symbol
    conf: 0.98
    if:
      type: symbol
      exact: AdvancedPatch@12
composite_rules:
  - id: nanomite-patcher
    desc: Nanomite analysis and patching tool
    conf: 0.99
    needs: 2
    any:
      - id: well-known/tool/reverse-engineering/nanomite::armnf-export
      - id: well-known/tool/reverse-engineering/nanomite::nanomite-found
      - id: well-known/tool/reverse-engineering/nanomite::nanomite-patch-prompt
      - id: well-known/tool/reverse-engineering/armnf::marker
