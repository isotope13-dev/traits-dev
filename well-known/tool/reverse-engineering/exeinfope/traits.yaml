# Exeinfo PE (ExeinfoPE) — A.S.L Software Win32 PE / packer identifier.
# Widely distributed UPX-packed Delphi builds; the unpacked image has a
# large writable executable .text section from the Delphi linker, which is
# normal for this tool and not a packing/shellcode signal.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 20000000

traits:
  - id: product-name
    desc: Exeinfo PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: Exeinfo PE by A.S.L

  - id: company-name
    desc: A.S.L Software company metadata
    if:
      type: value
      path: pe.version.company
      exact: A.S.L Software

  - id: file-description
    desc: Exeinfo PE file description
    if:
      type: value
      path: pe.version.description
      exact: ExEinfo PE - Win32 exe identifier

  - id: original-filename
    desc: ExeinfoPE.exe original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: ExeinfoPE.exe
      case_insensitive: true

  - id: terminate-ui-string
    desc: Exeinfo PE terminate UI string
    if:
      type: text
      substr: 'click to Terminate Exeinfo PE'
      section: .rsrc

composite_rules:
  - id: exeinfope-official-binary
    desc: Official Exeinfo PE analyzer binary
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: company-name
      - id: file-description

  - id: exeinfope-official-context
    desc: Official Exeinfo PE analyzer context
    crit: exception
    conf: 0.99
    all:
      - id: product-name
      - id: company-name
      - id: file-description
      - id: original-filename
