# androguard — Android APK analysis and reverse-engineering toolkit (androguard/androguard).
# The pentest module ships Frida scripts for authorized dynamic APK analysis, not
# attestation relay or key-bypass attacks.
defaults:
  platforms: [android, unix]
  for: [pkginfo, whl, python, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-package-name
    desc: androguard Python wheel package name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: androguard

  - id: github-homepage
    desc: androguard GitHub project homepage
    if:
      type: value
      path: home-page
      regex: '(?i)github\.com/androguard/androguard'

  - id: package-member-path
    desc: androguard package member path
    for: [python, javascript]
    if:
      type: path
      regex: '(^|[\\/])androguard[\\/]'

  - id: pentest-module-path
    desc: androguard pentest Frida module path
    for: [python, javascript]
    if:
      type: path
      regex: '(^|[\\/])androguard[\\/]pentest'

  - id: pentest-class
    desc: androguard Pentest dynamic analysis class
    for: [python]
    if:
      type: text
      substr: class Pentest

  - id: connect-default-usb
    desc: androguard USB Frida device connection helper
    for: [python]
    if:
      type: text
      substr: def connect_default_usb

composite_rules:
  - id: androguard-android-apk-analysis
    desc: androguard Android APK analysis toolkit
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: wheel-package-name
      - id: github-homepage
      - id: package-member-path

  - id: androguard-pentest-context
    desc: androguard pentest Frida dynamic analysis module
    crit: exception
    conf: 0.99
    for: [python, javascript]
    any:
      - id: pentest-module-path
      - id: pentest-class
      - id: connect-default-usb
