# Memory-forensics tooling: physical RAM acquisition tools and the Volatility
# analysis framework.
#
# These are legitimate, widely deployed DFIR tools.  Ransomware crews have
# adopted them as a credential-access path that never touches lsass.exe:
# acquire a full physical memory image with a signed imager, then carve the
# credential stores out of the image offline with Volatility.  Because no
# process ever opens a handle to LSASS, LSASS-access telemetry stays silent.
#
# Tool identity only — a responder's collection script matches these too.  The
# credential-dumping objective composites supply the intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
  size_min: 1
  size_max: 20971520

traits:
  # --- Analysis framework ---------------------------------------------------
  # Volatility ships as vol.py / vol.exe (v3) and volatility.exe (v2); the
  # `-f <image>` argument is the framework's universal "analyse this image"
  # switch and is what separates a real invocation from the bare word.
  - id: volatility-runner-name
    desc: Volatility framework executable name
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bvol(atility)?[23]?\.(exe|py)\b'

  - id: volatility-framework-invocation
    desc: Volatility image or profile invocation
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bvolatility[23]?(\.(exe|py))?\s+(-f|--profile=)'

  - id: volatility-image-file-flag
    desc: Volatility invoked against a memory image
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvol(atility)?[23]?(\.(exe|py))?\s+-f\s'

  - id: volatility-profile-flag
    desc: Volatility 2 profile selection flag
    conf: 0.9
    if:
      type: text
      regex: '(?i)--profile=(Win|Vista|Mac|Linux)\S{1,32}'

  # --- Physical memory acquisition -----------------------------------------
  # Each of these writes a raw image of all physical RAM.  Names are stable
  # across releases (winpmem_mini_x64_rc2.exe, MagnetRAMCapture.exe, ...).
  - id: winpmem-acquisition-tool
    desc: WinPmem memory acquisition tool
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bwinpmem[a-z0-9_]*\.exe\b'

  - id: dumpit-acquisition-tool
    desc: DumpIt memory acquisition tool
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bDumpIt(_[a-z0-9]+)?\.exe\b'

  - id: magnet-ram-acquisition-tool
    desc: Magnet RAM Capture acquisition tool
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bMagnetRAMCapture[a-z0-9_]*\.exe\b'

  - id: belkasoft-ram-acquisition-tool
    desc: Belkasoft RAM Capturer tool
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bRamCapture(64|32)?\.exe\b'

  - id: ftk-imager-acquisition-tool
    desc: FTK Imager acquisition tool
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bftkimager\.exe\b'

composite_rules:
  - id: volatility-memory-analysis
    desc: Volatility memory-image analysis invocation
    crit: notable
    conf: 0.93
    any:
      - id: volatility-runner-name
      - id: volatility-framework-invocation
      - id: volatility-image-file-flag
      - id: volatility-profile-flag

  - id: physical-memory-acquisition-tool
    desc: Physical memory acquisition tool invoked
    crit: notable
    conf: 0.95
    any:
      - id: winpmem-acquisition-tool
      - id: dumpit-acquisition-tool
      - id: magnet-ram-acquisition-tool
      - id: belkasoft-ram-acquisition-tool
      - id: ftk-imager-acquisition-tool
