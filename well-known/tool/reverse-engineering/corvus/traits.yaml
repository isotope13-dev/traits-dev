# Corvus reverse-engineering MCP server. Its analysis catalogue names attack
# techniques and APIs, while its live-process provider reads debuggee memory.
# Require internal decompiler code as well as independent build or provider
# evidence so an arbitrary assembly named corvus.dll cannot suppress findings.
defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.98
  size_max: 30000000

traits:
  - id: corvus-decompile-tools-namespace
    desc: Corvus decompilation tool namespace
    crit: baseline
    if:
      type: text
      section: .text
      substr: Corvus.Tools.DecompileTools

  - id: corvus-ghidra-provider-namespace
    desc: Corvus Ghidra worker provider namespace
    crit: baseline
    if:
      type: text
      section: .text
      substr: Corvus.Native.Providers.Ghidra.worker

  - id: corvus-build-pdb-path
    desc: Corvus source build PDB path
    crit: baseline
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]Corvus[\\/]Corvus[\\/]src[\\/]Corvus[\\/]'

composite_rules:
  - id: corvus-reverse-engineering-tool
    desc: Corvus decompiler and reverse-engineering tool assembly
    crit: notable
    all:
      - id: corvus-decompile-tools-namespace
    any:
      - id: corvus-ghidra-provider-namespace
      - id: corvus-build-pdb-path
