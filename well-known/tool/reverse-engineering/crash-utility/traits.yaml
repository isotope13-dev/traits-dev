# The `crash` kernel crash-dump analyser (David Anderson / Red Hat). It exists to
# inspect kernel memory, walk task structs and resolve the syscall table, and its
# help text names the kernel threads it reports -- kworker, migration, ksoftirqd.
# That is the whole job of the tool, so its source reads as kernel-thread-name
# masquerade and syscall-table scanning unless it is recognised first. See the
# `unless:` references in objectives/evasion/masquerade/process/name,
# objectives/evasion/kernel-hide/hook and objectives/execution/exploit/memory.
defaults:
  platforms: [unix]
  for: [c, cpp, source, binaries]
  crit: notable
  conf: 0.97
  size_min: 256
  size_max: 20000000

traits:
  - id: crashpager-env
    desc: crash utility CRASHPAGER variable
    if:
      type: text
      substr: CRASHPAGER
  - id: crash-version-macro
    desc: crash utility version macro
    if:
      type: text
      substr: CRASH_VERSION
  # Every crash source file opens `/* <name>.c - core analysis suite`, so this
  # is the marker that reaches memory.c, ppc.c and the rest -- CRASHPAGER and
  # CRASH_VERSION only appear in help.c and main.c.
  - id: core-analysis-suite-header
    desc: crash utility source file header
    if:
      type: text
      substr: '- core analysis suite'

composite_rules:
  - id: crash-utility-source
    desc: crash kernel dump analyser source
    crit: notable
    conf: 0.97
    any:
      - id: crashpager-env
      - id: crash-version-macro
      - id: core-analysis-suite-header
