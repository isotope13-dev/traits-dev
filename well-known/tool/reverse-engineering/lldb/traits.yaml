defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_max: 524288000

traits:
  - id: lldb-server-basename
    desc: LLDB server executable basename
    if:
      type: basename
      exact: lldb-server.exe
      case_insensitive: true

  - id: lldb-c-namespace
    desc: LLDB C++ namespace text
    if:
      type: text
      substr: 'lldb_private::'
      section: rdata

  - id: lldb-server-usage
    desc: LLDB server usage string
    if:
      type: text
      substr: 'lldb-server connects to the LLDB client'
      section: rdata

composite_rules:
  - id: lldb-debugger-binary
    desc: LLDB debugger executable or library
    crit: notable
    conf: 0.98
    any:
      - id: lldb-server-usage
      - id: lldb-c-namespace
