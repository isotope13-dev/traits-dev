# Xposed Framework and Xposed Installer (rovo89) — Android dynamic instrumentation
# and runtime method hooking framework. Used for security analysis, app debugging,
# and system customization.
defaults:
  platforms: [android, linux]
  for: [apk, dex]
  crit: baseline
  conf: 0.99

traits:
  - id: xposed-installer-application-class
    desc: Xposed Installer application class in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lde/robv/android/xposed/installer/XposedApp;"

  - id: xposed-installer-welcome-activity
    desc: Xposed Installer welcome activity in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lde/robv/android/xposed/installer/WelcomeActivity;"

composite_rules:
  - id: xposed-installer-dex-identity
    desc: Xposed Installer application classes in DEX
    crit: exception
    conf: 0.995
    for: [dex]
    all:
      - id: xposed-installer-application-class
      - id: xposed-installer-welcome-activity
