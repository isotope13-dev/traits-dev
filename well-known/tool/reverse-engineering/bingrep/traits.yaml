# bingrep (m4b/bingrep) — a cross-platform ELF/Mach-O/PE/archive parser and
# colorizer built on the goblin crate. Its documented function is to read a
# binary and print its headers, sections, symbols and relocations; `--extract`
# writes one archive member back to disk. Recognising it explains why a Rust
# tree carries executable-format constants and a file create+write path.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_max: 268435456

traits:
  - id: about-banner
    desc: bingrep CLI about banner
    for: [rust, binaries]
    if:
      type: text
      substr: 'bingrep - grepping through binaries since'

  - id: crate-name
    desc: bingrep Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: bingrep

  - id: upstream-repository
    desc: bingrep upstream repository URL
    for: [cargo.toml, rust, markdown]
    if:
      type: text
      substr: github.com/m4b/bingrep

  - id: extract-archive-member-help
    desc: bingrep archive member extract option
    for: [rust, binaries]
    if:
      type: text
      substr: 'Extract from an archive the object file which contains'
