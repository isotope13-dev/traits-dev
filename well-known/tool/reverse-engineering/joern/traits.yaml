defaults:
  platforms: [unix, windows]
  for: [tar, scala, php, pe]
  crit: notable
  conf: 0.99

traits:
  - id: source-archive-name
    desc: Joern source release archive name
    for: [tar]
    if:
      type: basename
      regex: '(?i)^joernio-joern-v[0-9][^\\/]*-source\\.tar\\.gz$'

  - id: php-scanner-test
    desc: Joern PHP scanner test fixture
    for: [scala]
    if:
      type: path
      regex: '(?i)scanners[\\/]php[\\/]PHPJoernTests\\.scala$'

  - id: git-test-binary
    desc: Joern Git test binary fixture
    for: [pe]
    size_min: 10000
    size_max: 50000000
    if:
      type: path
      regex: '(?i)testbinaries[\\/].*[\\/]git\\.exe$'

composite_rules:
  - id: source-archive-context
    desc: Joern source and test-fixture context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: source-archive-name
      - id: php-scanner-test
      - id: git-test-binary
