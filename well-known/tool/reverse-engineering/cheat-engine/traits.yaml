defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_max: 100000000

traits:
  - id: cheatengine-executable-basename
    desc: Cheat Engine executable basename
    for: [elf, pe]
    if:
      type: basename
      regex: '^cheatengine-(x86_64|i386|arm64)(\.exe)?$'

  - id: cheatengine-banner-elf
    desc: Cheat Engine banner in ELF rodata
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: 'Cheat Engine [0-9]+\.[0-9]+'

  - id: cheatengine-banner-pe
    desc: Cheat Engine banner in PE rdata
    for: [pe]
    if:
      type: text
      section: .rdata
      regex: 'Cheat Engine [0-9]+\.[0-9]+'

  - id: ceapi-library-basename
    desc: Cheat Engine API library basename
    for: [elf]
    if:
      type: basename
      exact: 'libceapi.so'

  - id: ceserver-extension-basename
    desc: Cheat Engine ceserver extension library basename
    for: [elf]
    if:
      type: basename
      regex: '^libceserver-extension_.*\.so$'

composite_rules:
  - id: cheat-engine-banner
    desc: Cheat Engine application title or banner text
    conf: 0.99
    any:
      - id: cheatengine-banner-elf
      - id: cheatengine-banner-pe

  - id: cheat-engine-executable
    desc: Cheat Engine debugger executable
    conf: 0.99
    all:
      - id: cheatengine-executable-basename
      - id: cheat-engine-banner

  - id: cheat-engine-component
    desc: Cheat Engine tool component
    conf: 0.99
    any:
      - id: cheat-engine-executable
      - id: ceapi-library-basename
      - id: ceserver-extension-basename
