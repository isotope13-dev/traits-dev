# Flow Storm — Clojure debugger that ships an instrumented Clojure
# runtime (com.github.flow-storm:clojure). clojure.core eval, genclass
# reflection, and storm instrumentation are the debugger, not a dropper.
# Identity only. Do not match org.clojure:clojure by artifact id alone.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 20000000

traits:
  - id: pom-group
    desc: flow-storm Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: com.github.flow-storm

  - id: storm-api
    desc: flow-storm.storm-api namespace
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: flow-storm.storm-api

  - id: maybe-init
    desc: maybe-init-flow-storm REPL hook
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: maybe-init-flow-storm

  - id: storm-repl-path
    desc: ClojureStorm REPL helper path
    conf: 0.96
    if:
      type: path
      regex: 'clojure/storm/repl\.clj$'

composite_rules:
  - id: flow-storm-clojure-runtime
    desc: Flow Storm instrumented Clojure JAR
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: pom-group
      - id: storm-api
      - id: maybe-init
      - id: storm-repl-path
    needs: 2
