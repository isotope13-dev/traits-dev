# E9Patch — static binary rewriter for x86_64 Linux ELF and Windows PE (GJDuck/e9patch).
defaults:
  platforms: [unix, windows]
  for: [c, cpp, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: E9Patch source file path
    if:
      type: path
      regex: 'e9patch[-_@]'

  - id: license-exception-banner
    desc: E9Patch MIT license exception banner
    if:
      type: text
      substr: "rest of the E9Patch/E9Tool source code is under the GPLv3 license"

  - id: repository-url
    desc: E9Patch upstream GitHub repository URL
    if:
      type: text
      substr: "github.com/GJDuck/e9patch"

  - id: loader-entry-marker
    desc: E9Patch loader entry point marker
    if:
      type: text
      substr: "E9Patch loader entry point"

composite_rules:
  - id: source-context
    desc: E9Patch static binary rewriter source context
    crit: exception
    conf: 0.99
    any:
      - id: source-path
      - id: license-exception-banner
      - id: repository-url
      - id: loader-entry-marker
