# Arwen is a documented Mach-O and ELF patching tool. Its source release ships
# example and fixture binaries for patching RPATHs, install names, and headers.
defaults:
  conf: 0.99
  platforms: [linux, macos, windows]
  size_max: 120000000
traits:
  - id: package-name
    desc: Arwen binary patching tool package identity
    crit: baseline
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: arwen
  - id: source-tree-path
    desc: Arwen package source tree
    crit: baseline
    for: [pe, elf, macho, rust]
    if:
      type: path
      regex: 'arwen-[0-9]'
composite_rules:
  - id: binary-patching-tool-context
    desc: Arwen binary patching tool source context
    crit: notable
    scope: archive
    any:
      - id: package-name
      - id: source-tree-path
