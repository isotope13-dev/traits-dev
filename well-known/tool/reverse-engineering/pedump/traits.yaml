# pedump — Ruby PE/NE/MZ binary dumper and packer detector (zed-0xff/pedump).
# Ships a marshalled packer signature database (data/sig.bin) and optional
# unpacker helpers; AV scanners and DOS-infector heuristics false-positive on
# the signature bytes unless this tool context is recognized.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, data, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: gem-package-name
    desc: pedump Ruby gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: pedump

  - id: gemspec-name
    desc: pedump gemspec package name
    for: [ruby]
    if:
      type: text
      # Jeweler-generated gemspecs (like this one) assign via `s.name`;
      # hand-written ones use `spec.name` or `gem.name`.
      regex: '(?m)^\s*(spec|s|gem)\.name\s*=\s*["'']pedump["'']'

  - id: pedump-class
    desc: PEdump PE analyzer class
    for: [ruby]
    if:
      type: text
      substr: class PEdump

  - id: pedump-unpacker-module
    desc: PEdump unpacker module namespace
    for: [ruby]
    if:
      type: text
      substr: PEdump::Unpacker

  - id: pedump-packer-marker
    desc: PEdump packer class or signature record
    for: [ruby, data]
    if:
      type: text
      substr: PEdump::Packer

  - id: bin-sigs-file-ref
    desc: pedump sig.bin signature database path
    for: [ruby]
    if:
      type: text
      substr: data/sig.bin

  - id: pedump-me-url
    desc: pedump.me analysis service URL
    for: [ruby, markdown]
    if:
      type: text
      substr: pedump.me

  - id: github-homepage
    desc: pedump GitHub project homepage
    for: [ruby, markdown]
    if:
      type: text
      substr: github.com/zed-0xff/pedump

composite_rules:
  - id: pedump-pe-analysis-tool
    desc: pedump PE binary analysis Ruby gem
    crit: notable
    scope: archive
    # The .gem itself is a tar (extensionless sample names detect as Tar,
    # not Gem), so the roll-up must accept the container type or it never
    # fires above the member findings.
    for: [ruby, gem, data, markdown, tar]
    needs: 2
    any:
      - id: gem-package-name
      - id: gemspec-name
      - id: pedump-class
      - id: github-homepage
      - id: pedump-me-url
      - id: pedump-packer-marker
      - id: bin-sigs-file-ref
