# dnSpy / dnSpyEx — .NET assembly debugger, decompiler and editor.
# Upstream: https://github.com/dnSpyEx/dnSpy (release asset dnSpy-net-win64.zip).
#
# A managed debugger necessarily does the things malware loaders do: it emits
# dynamic methods, resolves native ICorDebug/dbgshim entry points through
# Marshal.GetDelegateForFunctionPointer, walks the debuggee's module list, and
# ships a `dnSpy.Contracts.Debugger.AntiAntiDebug` subsystem that patches
# IsDebuggerPresent / CheckRemoteDebuggerPresent / NtRaiseHardError in the
# *debuggee* to defeat malware anti-debug. Several traits already carve out
# `well-known/tool/reverse-engineering/`; this identity lets them apply.
#
# Deliberately a composite of filename AND dnSpy's internal MEF contracts
# namespace: a trojanized dnSpy build was distributed in 2021, so a renamed
# payload must not inherit an RE-tool carve-out on filename alone.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.98
  size_max: 200000000

traits:
  - id: dnspy-assembly-basename
    desc: dnSpy assembly or executable basename
    if:
      type: path
      basename: true
      regex: '^dnSpy(\.[A-Za-z0-9.]+)?\.(dll|exe)$'

  - id: dnspy-contracts-namespace
    desc: dnSpy.Contracts MEF namespace string
    if:
      type: text
      # Managed PE: the CLR #Strings heap lives inside .text.
      section: .text
      substr: dnSpy.Contracts.

  - id: dnspy-build-pdb-path
    desc: dnSpy CI build PDB path
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]dnSpy[\\/](dnSpy|Extensions)[\\/]'

  - id: dnspy-anti-anti-debug-namespace
    desc: dnSpy AntiAntiDebug debugger contract
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .text
      substr: dnSpy.Contracts.Debugger.AntiAntiDebug

composite_rules:
  - id: dnspy-debugger-tool
    desc: dnSpy .NET debugger/decompiler component
    crit: notable
    conf: 0.98
    all:
      - id: dnspy-assembly-basename
    any:
      - id: dnspy-contracts-namespace
      - id: dnspy-build-pdb-path
