# Windows Debugger Detection
# Identifies binaries that are debuggers (not debugger targets)
# Debug event loop APIs indicate a debugger, not malware
defaults:
  for: [pe]
  platforms: [windows]
  size_max: 1000000
traits:
  - id: debugger-basename
    desc: Windows console debugger executable name
    crit: notable
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '(?i)^(windbg|cdb|ntsd|kd)\.exe$'
  - id: gdbserver-basename
    desc: GDB server executable name
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      exact: gdbserver.exe
      case_insensitive: true
  - id: gdbserver-source-marker
    desc: GDB server source marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: gdbserver/
      section: rdata
  - id: gdbserver-remote-protocol
    desc: GDB remote protocol marker
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: qXfer:features:read
      section: rdata
  - id: gnu-gdb-banner
    desc: GNU gdb debugger banner string
    crit: notable
    conf: 0.95
    # The full interactive GDB (bundled as gdborig.exe by MinGW/MSYS
    # distributions, which wrap the real binary with a launcher script named
    # gdb) statically links the whole GDB/BFD/readline stack and commonly
    # exceeds the 1MB default for a debugger-server stub.
    size_max: 50000000
    if:
      type: text
      exact: "GNU gdb %s%s"
      section: rdata
  - id: gnu-gdb-configured-marker
    desc: GNU gdb build configuration banner
    crit: baseline
    conf: 0.9
    size_max: 50000000
    if:
      type: text
      substr: "This GDB was configured as "
      section: rdata
composite_rules:
  - id: debug-event-loop
    desc: Windows debug event loop APIs
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/debug/event::wait-for-debug-event
      - id: micro-behaviors/process/debug/event::continue-debug-event
    any:
      - id: debugger-basename
      - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
  - id: gdbserver-debugger-server
    desc: GDB server debugger executable
    crit: notable
    conf: 0.95
    all:
      - id: gdbserver-basename
      - id: micro-behaviors/process/debug/event::wait-for-debug-event
      - id: micro-behaviors/process/debug/event::continue-debug-event
    # `qXfer:features:read` is the exact wording of a newer GDB remote-protocol
    # query; older gdbserver builds (GDB 8.1, bundled by the mingw-builds
    # i686-7.3.0 toolchain) only carry the `qXfer:` prefix as a shorter split
    # string, so requiring the full literal missed a real gdbserver.exe. The
    # `gdbserver/` source-tree path marker is version-independent corroboration.
    any:
      - id: gdbserver-source-marker
      - id: gdbserver-remote-protocol
  - id: gnu-gdb-debugger-binary
    desc: GNU gdb interactive debugger executable
    crit: notable
    conf: 0.95
    size_max: 50000000
    all:
      - id: gnu-gdb-banner
      - id: micro-behaviors/process/debug/event::wait-for-debug-event
      - id: micro-behaviors/process/debug/event::continue-debug-event
    any:
      - id: gnu-gdb-configured-marker
      - id: gdbserver-remote-protocol
