defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288000

traits:
  - id: product-name
    desc: QuickBMS product name
    crit: component
    conf: 0.98
    if:
      type: text
      substr: QuickBMS
      section: rdata
  - id: author-contact
    desc: QuickBMS author contact metadata
    crit: component
    conf: 0.98
    if:
      type: text
      substr: aluigi.org
      section: rdata
  - id: original-filename
    desc: QuickBMS original filename
    crit: component
    conf: 0.98
    if:
      type: text
      substr: quickbms.exe
      section: rdata

composite_rules:
  - id: utility-context
    desc: QuickBMS archive utility metadata
    crit: notable
    conf: 0.98
    all:
      - id: product-name
      - id: author-contact
      - id: original-filename
