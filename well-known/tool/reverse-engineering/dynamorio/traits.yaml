# DynamoRIO balloon is an out-of-memory test utility. The product resource and
# its documented command help identify it without trusting the collected name.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 20000000
traits:
  - id: dynamorio-memory-test-resource
    desc: DynamoRIO memory-test description resource
    if:
      type: text
      section: rsrc
      substr: DynamoRIO out of memory testing tool
  - id: balloon-memory-test-help
    desc: Balloon memory reservation and commit help
    if:
      type: text
      section: rdata
      substr: 'balloon -p <PID> [-v <MB or KB to reserve>] [-c <MB or KB to commit>]'
composite_rules:
  - id: balloon-memory-test-utility
    desc: DynamoRIO balloon memory-testing utility
    all:
      - id: dynamorio-memory-test-resource
      - id: balloon-memory-test-help
