defaults:
  platforms: [android, unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_max: 52428800

traits:
  # The existing markers key on the rz-test harness and ~/.config/rizin, which
  # only reach a built/installed tree. Rizin's own C sources carry neither, so
  # librz/debug/p/native/windows/windows_debug.c -- the Windows *debugger
  # backend* -- scored hostile on
  # objectives/anti-analysis/debugger-detect/loader::hardware-breakpoint-process-tool-gate
  # for reading debug registers while enumerating processes, which is exactly
  # what a debugger does. That rule already carves out
  # well-known/tool/reverse-engineering/ as a directory; it just had nothing
  # here that fired on source. `Rz`-prefixed types are rizin's C API namespace.
  - id: rizin-c-api-types
    desc: Rizin C API type prefix
    platforms: [unix, windows]
    for: [c, cpp, source]
    if:
      type: text
      regex: '\bRz(Debug|List|Core|Bin|Analysis|IO|Cons)\b'

  - id: rz-test-basename
    desc: Rizin rz-test executable basename
    if:
      type: basename
      exact: rz-test

  # Rizin vendored under another project (pwnkit vendors rizin under
  # vendor/rizin/) carries the same debugger/format-parser sources as a rizin
  # checkout, tripping technique traits on legitimate debugger code: ptrace
  # backends, NT API tables in format headers, arch-aware module handling.
  # Path identity is the established exclusion key for source trees (cf.
  # radare2-release-source-tree); it only ever suppresses via unless:,
  # never convicts.
  - id: rizin-vendored-source-path
    desc: Rizin vendored source tree path
    platforms: [unix, windows]
    for: [source]
    if:
      type: path
      regex: '/rizin(-[0-9]+\.[0-9]+)?/'

  - id: rz-test-usage
    desc: Rizin rz-test command usage string
    if:
      type: text
      section: .rodata
      substr: 'rz-test [-qvVnL]'

  - id: rizin-config-paths
    desc: Rizin runtime configuration paths
    if:
      type: text
      section: .rodata
      substr: .config/rizin

  - id: android-clang-build-comment
    crit: notable
    desc: Android Clang toolchain comment
    if:
      type: comment
      substr: Android (

composite_rules:
  - id: rizin-toolkit
    desc: Rizin reverse-engineering toolkit
    crit: notable
    conf: 0.98
    any:
      - id: rz-test-usage
      - id: rizin-config-paths
      - id: rz-test-basename
