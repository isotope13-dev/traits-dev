defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 32768
  size_max: 2097152

traits:
  - id: cygwin-profiler-basename
    desc: Cygwin profiler executable name
    if:
      type: basename
      exact: profiler.exe

  - id: cygwin-profiler-banner
    desc: Cygwin profiler banner text
    if:
      type: text
      substr: "IP-Sampling Profiler"
      section: .rdata

composite_rules:
  - id: cygwin-profiler-context
    desc: Recognized Cygwin execution profiler
    crit: exception
    conf: 0.99
    all:
      - id: cygwin-profiler-basename
      - id: cygwin-profiler-banner
