# Dotnet Source and Assembly Inspector (Dosai) — OWASP Dep-Scan / AppThreat assembly inspector.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 200000000

traits:
  - id: dosai-product-name
    desc: Dosai PE product name
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Dosai'

  - id: dosai-appthreat-company
    desc: AppThreat company metadata
    if:
      type: value
      path: pe.version.company
      exact: AppThreat

  - id: dosai-upstream-url
    desc: Dosai upstream repository URL
    for: [pe, dll, text]
    if:
      type: text
      substr: github.com/owasp-dep-scan/dosai

  - id: dosai-description-comments
    desc: Dosai tool description comments
    for: [pe, dll, text]
    if:
      type: text
      substr: Dotnet Source and Assembly Inspector (Dosai)

composite_rules:
  - id: dosai-tool-context
    desc: OWASP Dosai assembly analysis tool context
    crit: exception
    conf: 0.99
    any:
      - id: dosai-upstream-url
      - id: dosai-description-comments
      - id: dosai-appthreat-company
