# leosplit — 64DD .ndd splitter and MIPS disassembler for N64 decomp
# (Splat-like). Opcode tables and binary carving are the product.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: leosplit PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: leosplit

  - id: package-metadata-name
    desc: leosplit PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*leosplit\s*$'

  - id: mfs-magic
    desc: 64DD MFS volume magic string
    for: [python]
    if:
      type: text
      substr: 64dd-Multi

  - id: asm-module-path
    desc: leosplit disassembler module path
    for: [python, whl]
    if:
      type: path
      regex: 'leosplit[\\/]disassembler[\\/]leosplit_asm\.py'

composite_rules:
  - id: leosplit-package
    desc: leosplit 64DD disassembler package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: mfs-magic
      - id: asm-module-path
    needs: 2
