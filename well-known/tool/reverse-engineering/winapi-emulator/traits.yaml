# Emulators and API monitors dispatch Win32 names through a match table
# ("CreateRemoteThread" => handler). Dozens of those arms are the table,
# not a program that calls the injection APIs.
defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: rust-win32-api-match-dispatch
    desc: Rust match dispatches many Win32 APIs
    crit: notable
    conf: 0.94
    size_min: 2000
    count_min: 30
    if:
      type: text
      regex: '"[A-Z][A-Za-z0-9]{3,40}"\s*=>'
