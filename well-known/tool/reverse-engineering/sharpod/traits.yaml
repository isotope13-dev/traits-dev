# SharpOD is a separately authored anti-anti-debugging plugin for OllyDbg and
# x64dbg (SharpOD.dp32 / SharpOD_x64.dp64) that ships its own signed kernel
# helper driver. It is not part of ScyllaHide, so its identity strings live
# under their own family directory rather than in a neighbouring tool's.
defaults:
  platforms: [windows]
  for: [binaries]
  size_min: 1024
  size_max: 52428800

traits:
  - id: sharpod-debugger-assist-basename
    desc: SharpOD debugger-assist tool filename
    crit: component
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)^SharpOD(_x64)?\.(exe|dll|dp32|dp64)$'
  - id: sharpod-plugin-string
    desc: SharpOD anti-anti-debugger plugin identity
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: SharpOD Anti_Anti Debugger Plugin
  - id: sharpod-driver-string
    desc: SharpOD anti-anti-debugger driver identity
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: SharpOD Anti_Anti Debugger Plugin Driver
  - id: sharpod-kernel-helper-string
    desc: SharpOD native kernel-helper identity
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: SharpOD_Kernel.dll
      section: rdata
