defaults:
  for:
    - pe
  platforms:
    - windows
  size_max: 2000000
traits:
  - id: ollydbg-executable-marker
    desc: OllyDbg or AllyDbg executable identity markers
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^[oa]llydbg, 32-bit analysing debugger$'
