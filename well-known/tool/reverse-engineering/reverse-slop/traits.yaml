defaults:
  platforms: [windows]
  crit: notable
  conf: 0.98
  for: [pe]
  size_min: 1000000
  size_max: 50000000

traits:
  - id: reverse-slop-version-string
    desc: reverse-slop workbench banner
    if:
      type: text
      section: .rdata
      regex: 'reverse-sl[oa]p\s+0\.\d'

  - id: reverse-slop-driver-loader-string
    desc: reverse-slop driver mapper invocation string
    if:
      type: text
      section: .rdata
      exact: 'slop_mapper.exe load build\driver\slopdrvr.sys'

  - id: reverse-slop-mcp-port-env
    desc: reverse-slop MCP port environment variable
    if:
      type: text
      section: .rdata
      exact: 'SLOP_MCP_PORT'

composite_rules:
  - id: reverse-slop-workbench
    desc: reverse-slop dynamic analysis and reverse engineering workbench
    needs: 2
    any:
      - id: reverse-slop-version-string
      - id: reverse-slop-driver-loader-string
      - id: reverse-slop-mcp-port-env
