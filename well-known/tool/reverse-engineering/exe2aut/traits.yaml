# Exe2Aut is an AutoIt script decompiler. Its packed executable embeds an
# AutoIt runtime, so generic unpacking and process-injection heuristics can
# overlap with the decompiler's own analysis machinery.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: exe2aut-banner
    desc: Exe2Aut AutoIt decompiler banner
    crit: component
    conf: 0.99
    if:
      type: text
      exact: Exe2Aut - AutoIt3 Decompiler
  - id: exe2aut-homepage
    desc: Exe2Aut homepage marker
    crit: component
    conf: 0.99
    if:
      type: text
      substr: https://exe2aut.com/

composite_rules:
  - id: exe2aut-decompiler
    desc: Exe2Aut AutoIt decompiler identity
    crit: notable
    conf: 0.99
    all:
      - id: exe2aut-banner
      - id: exe2aut-homepage
