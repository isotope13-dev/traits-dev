# Exe2Aut is an AutoIt script decompiler. Its packed executable embeds an
# AutoIt runtime, so generic unpacking and process-injection heuristics can
# overlap with the decompiler's own analysis machinery.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 32768
  size_max: 1048576

traits:
  - id: exe2aut-banner
    desc: Exe2Aut decompiler banner
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: Exe2Aut - AutoIt3 Decompiler
      section: .data
  - id: exe2aut-homepage
    desc: Exe2Aut project homepage
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://exe2aut.com/
      section: .data

composite_rules:
  - id: exe2aut-decompiler
    desc: Exe2Aut AutoIt decompiler identity
    crit: notable
    conf: 0.99
    all:
      - id: exe2aut-banner
      - id: exe2aut-homepage
