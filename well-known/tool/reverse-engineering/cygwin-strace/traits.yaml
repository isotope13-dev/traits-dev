# Cygwin strace attaches with DebugActiveProcess and pumps the debug
# event loop. That is the tracer, the same shape as winedbg and gdb.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 32768
  size_max: 2097152

traits:
  - id: cygwin-strace-banner
    desc: Cygwin strace version banner
    if:
      type: text
      substr: "strace (cygwin)"
      section: .rdata
