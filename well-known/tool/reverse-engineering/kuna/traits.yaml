# Kuna is an open-source agent-first decompiler in Rust ported from Ghidra.
# Its source release ships test fixture binaries for decompiler loading tests.
defaults:
  conf: 0.99
  platforms: [linux, macos, windows]
  size_max: 120000000

traits:
  - id: package-name
    desc: Kuna decompiler crate package identity
    crit: baseline
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^kuna(-[a-z0-9_-]+)?$'

  - id: source-tree-path
    desc: Kuna decompiler package source tree
    crit: baseline
    for: [pe, elf, macho, rust]
    if:
      type: path
      regex: '(?i)(^|[\\/])kuna(@|-[0-9]|$|[\\/])'

composite_rules:
  - id: decompiler-source-context
    desc: Kuna decompiler source context
    crit: notable
    scope: archive
    any:
      - id: package-name
      - id: source-tree-path
