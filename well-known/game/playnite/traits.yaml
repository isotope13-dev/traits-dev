defaults:
  platforms: [windows, unix]
  for: [archive, csharp, xml, powershell, scripts]
  size_max: 2147483648

traits:
  - id: source-path
    desc: Playnite source tree path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(?i)Playnite-[0-9][^\\/]*'
  - id: source-file
    desc: Playnite source file
    crit: notable
    conf: 0.96
    for: [csharp, xml]
    if:
      type: path
      regex: '(?i)Playnite'
