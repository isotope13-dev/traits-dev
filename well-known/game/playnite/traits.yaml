defaults:
  crit: notable
  conf: 0.96
  platforms: [windows, unix]
  for: [rar, 7z, cpio, csharp, xml, powershell, scripts]
  size_max: 2147483648

traits:
  - id: source-path
    desc: Playnite source tree path
    if:
      type: path
      regex: '(?i)Playnite-[0-9][^\\/]*'
  - id: reference-binary
    desc: Playnite vendored reference binary
    for: [pe, tar.gz]
    if:
      type: path
      regex: '(?i)Playnite-[0-9]'
  - id: source-file
    desc: Playnite source file
    for: [csharp, xml]
    if:
      type: path
      regex: '(?i)Playnite'
