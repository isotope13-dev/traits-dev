# LX CHEATS identity markers; generic game and cheat features remain separate.
defaults:
  for:
  - pe
  platforms:
  - windows
  crit: component
  conf: 0.95
  size_min: 512
  size_max: 500000000

traits:
- id: lx-cheats-banner
  crit: notable
  desc: LX CHEATS brand banner string
  conf: 0.99
  if:
    type: text
    section: rdata
    substr: "LX CHEATS"

- id: lx-cheats-version
  crit: notable
  desc: LX CHEATS version string
  conf: 0.99
  if:
    type: text
    section: rdata
    regex: "LX CHEATS v[0-9]+\\.[0-9]+"

  # === PDB path ===
- id: lx-cheats-pdb
  crit: notable
  desc: LX CHEATS PDB debug path
  conf: 0.99
  if:
    type: value
    path: pe.debug.pdb.path
    regex: "[\\\\/]lx_cheats\\.pdb$"

  # === Game target ===

composite_rules:
- id: lx-cheats-detected
  desc: LX CHEATS C++ Edition game cheat detected
  crit: hostile
  conf: 0.97
  all:
  - id: well-known/game/lx-cheats::lx-cheats-banner
  any:
  - id: well-known/game/lx-cheats::lx-cheats-version
  - id: well-known/game/lx-cheats::lx-cheats-pdb
  - id: well-known/game/cheat::cs2-process-target
  - id: well-known/game/cheat::cs2-client-dll-target
  needs: 1

  # Generic CS2 cheat detection (covers variants without LX branding)
