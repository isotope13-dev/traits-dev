# Inventory Changer is a Counter-Strike inventory-modification utility. Its
# bundled BlackBone library deliberately opens the game process, changes its
# memory and creates remote threads; those APIs describe the product's stated
# function and are not, by themselves, evidence of malware.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1048576
  size_max: 16777216
  crit: component
  conf: 0.99

traits:
  - id: inventory-changer-brand
    desc: Inventory Changer product name
    if:
      type: text
      section: rdata
      substr: 'Inventory Changer'

  - id: inventory-changer-registry-key
    desc: Inventory Changer settings registry key
    if:
      type: text
      section: rdata
      exact: 'SOFTWARE\IChanger'

  - id: blackbone-driver-set
    desc: BlackBone multi-version driver filenames
    if:
      type: text
      section: rdata
      regex: 'BlackBoneDrv(7|8|10|81)\.sys'

composite_rules:
  - id: inventory-changer-blackbone-context
    desc: Inventory Changer with bundled BlackBone process library
    crit: notable
    conf: 0.995
    all:
      - id: inventory-changer-brand
      - id: inventory-changer-registry-key
      - id: blackbone-driver-set
