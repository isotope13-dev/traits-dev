defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
  size_min: 512
  size_max: 52428800

composite_rules:
  - id: game-ban-trace-cleaner
    desc: Game-ban cleaner with prompted adapter removal
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/ui/terminal::game-ban-adapter-guid-message
      - id: micro-behaviors/ui/terminal::game-tracking-file-cleanup-message
      - id: micro-behaviors/ui/dialog/prompt::adapter-reset-confirmation
      - id: micro-behaviors/os/kernel/device::setupdi-remove-device
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
