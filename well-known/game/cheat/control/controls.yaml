# Generic game-cheat controls, feature toggles, and trainer option labels.
# These supply feature evidence; malicious intent requires combination with
# intrusive runtime behavior or self-identification.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

traits:
  - id: self-described-game-cheat
    desc: Game cheat self-identification banner
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: .rsrc
      regex: '(?i)\b(windows\s+)?cheat\s+for\s+[a-z0-9][a-z0-9._ -]{1,32}\b'

  - id: aim-assist-control
    desc: Aim-assist or silent-aim cheat control
    crit: notable
    conf: 0.96
    if:
      type: text
      section: rdata
      regex: '\b(aimbot|aim assist|silent aim|aim[._ -]silent|silent[._ -]aim|magic[._ -]bullet)\b'
      case_insensitive: true

  - id: aim-lock-control
    desc: Aim-lock cheat control
    crit: notable
    conf: 0.96
    if:
      type: raw
      section: any
      regex: '\baim[ _-]?lock(_|\b)'
      case_insensitive: true

  - id: visual-cheat-control
    desc: Wallhack or ESP cheat control
    crit: notable
    conf: 0.95
    not:
      - regex: '(?i)^al-chams$'
    if:
      type: text
      section: rdata
      # Include the Arabic geographic article in the matched span, so not:
      # rejects al-Chams without suppressing other Chams labels in this file.
      # Other hyphenated controls (Enemy-Chams), esp.chams and UI copy remain.
      regex: '\b(wallhack|ghost hack|al-chams|chams)\b'
      case_insensitive: true

  - id: combat-modification-control
    desc: Game combat-modification cheat controls
    crit: notable
    conf: 0.95
    # "no reload, no flicker" is slide-preview copy. The longer alternative
    # is first so that phrase is the matched span, which not: can drop.
    # A bare "no reload" label still matches the second alternative.
    not:
      - substr: 'no reload, no flicker'
      - substr: 'no reload in start'
      - substr: 'no reload required'
    if:
      type: text
      section: rdata
      regex: '\bno reload(, no flicker| in start| required)?\b|\b(no recoil|rapid fire|camera hack)\b'
      case_insensitive: true
    unless:
      - id: camera-metadata-rapid-fire-label
      - id: browser-ui-no-reload-animation-label
      # Dev-loop tooling reports "no reload within %s" when a hot rebuild
      # misses its deadline; that is a latency diagnostic, not a weapon
      # toggle. Go binaries concatenate string blobs, so the bare matched
      # span carries none of that context and the surrounding text is the
      # only discriminating evidence.
      - id: hot-reload-diagnostic-label
      # WinDbg's .reload help reads "Unload modules, no reload" (dbgeng.dll).
      # A debugger command description, not a weapon toggle.
      - id: debugger-reload-help-label

  # Chromium's transition-animation settings describe a page transition with
  # "no reload animation"; that is interface copy, not a weapon toggle.
  - id: browser-ui-no-reload-animation-label
    desc: Browser UI no-reload animation label
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)\bno reload(,| animation)'

  - id: debugger-reload-help-label
    desc: Debugger .reload help text label
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)\bunload modules, no reload\b'

  - id: hot-reload-diagnostic-label
    desc: Hot-reload timeout diagnostic label
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)\bno reload within\b'

  - id: camera-metadata-rapid-fire-label
    desc: Camera metadata rapid-fire pistol label
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)\b\d+\s*m\s+rapid\s+fire\s+pistol\b'

  # Native cheats may construct labels as immediates in .text rather than
  # storing them in .rdata. These atoms remain suspicious; the hostile rules
  # below also require asynchronous key polling before inferring cheat intent.
  - id: native-aim-feature-label
    desc: Native aim-assistance feature label
    crit: suspicious
    conf: 0.94
    if:
      type: text
      section: .text
      word: SmartAim
      case_insensitive: true

  - id: native-automated-fire-label
    desc: Native automated-fire feature label
    crit: notable
    conf: 0.94
    if:
      type: text
      section: .text
      word: AutoFire
      case_insensitive: true

  - id: native-rapid-aim-feature-label
    desc: Native rapid-aim feature label
    crit: suspicious
    conf: 0.94
    if:
      type: text
      section: .text
      word: RapidAim
      case_insensitive: true

  # Trainers list cheat toggles as numpad hotkey options, such as
  # "Num 8 - Player Units: Infinite Health". Help text can contain the same
  # shape, so these labels only support composites with process control.
  - id: trainer-hotkey-option-label
    desc: Numpad hotkey cheat-option label
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnum \d{1,2} - [a-z][a-z ]{2,40}'

  - id: trainer-infinite-stat-option
    desc: Infinite game-stat cheat option label
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\binfinite (health|movement|skill points)\b'

  # Process images of shooter titles that internal cheat modules inject into.
  # Names alone are overlay vocabulary; the composite below adds the overlay.
  - id: shooter-game-process-target
    desc: Shooter game process image name
    crit: notable
    conf: 0.9
    if:
      type: text
      section: rdata
      regex: '(VALORANT-Win64-Shipping|r5apex|FortniteClient-Win64-Shipping|EscapeFromTarkov)\.exe'

composite_rules:
  - id: cheat-control-set
    desc: Generic game-cheat control set
    crit: suspicious
    conf: 0.95
    any:
      - id: aim-assist-control
      - id: aim-lock-control
      - id: visual-cheat-control
      - id: combat-modification-control
    unless:
      - id: objectives/evasion/masquerade/identity/app::unsigned-trainer-cheat-controls-only

  - id: native-aim-toggle-cheat
    desc: Native SmartAim cheat controlled by key polling
    crit: hostile
    conf: 0.97
    all:
      - id: native-aim-feature-label
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state

  - id: native-rapid-aim-toggle-cheat
    desc: Native RapidAim cheat controlled by key polling
    crit: hostile
    conf: 0.97
    all:
      - id: native-rapid-aim-feature-label
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state

  - id: native-automated-fire-toggle-cheat
    desc: Native automated-fire cheat controlled by key polling
    crit: hostile
    conf: 0.97
    all:
      - id: native-automated-fire-label
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state

  # Internal (in-process) game modules: an ImGui overlay backend, a shooter
  # process image, and key-state polling for menu hotkeys. Each leg is common
  # to a stat overlay alone, so the result stays suspicious rather than hostile.
  - id: game-internal-overlay-cheat
    desc: Internal ImGui overlay with shooter process and key polling
    crit: suspicious
    conf: 0.9
    all:
      - id: shooter-game-process-target
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
    any:
      - id: well-known/lib/ui/dear-imgui::imgui-impl-win32
      - id: well-known/lib/ui/dear-imgui::imgui-impl-dx11
      - id: well-known/lib/ui/dear-imgui::imgui-impl-opengl3
    needs: 1
    unless:
    - id: well-known/game/blitz::blitz-signed-game-module
