# Generic Counter-Strike 2 game-cheat indicators, overlays, and offset fetching.
# Brand-specific LX CHEATS rules live in well-known/game/lx-cheats/.
# ATT&CK: T1055 (Process Injection)
defaults:
  for: [pe]
  platforms: [windows]
  crit: component
  conf: 0.95
  size_min: 512
  size_max: 500000000

traits:
  # === Game target ===
  - id: cs2-process-target
    crit: notable
    desc: Counter-Strike 2 game process target
    conf: 0.95
    if:
      type: text
      section: rdata
      word: "cs2.exe"

  - id: cs2-client-dll-target
    crit: notable
    desc: CS2 client.dll module target
    conf: 0.95
    if:
      type: text
      section: rdata
      word: "client.dll"

  # === Cheat feature strings ===
  - id: cs2-offset-entity-list
    crit: notable
    desc: CS2 entity list offset reference
    conf: 0.95
    if:
      type: text
      section: rdata
      word: "dwEntityList"

  - id: cs2-offset-local-player
    crit: notable
    desc: CS2 local player pawn offset reference
    conf: 0.95
    if:
      type: text
      section: rdata
      word: "dwLocalPlayerPawn"

  - id: cs2-offset-health
    crit: notable
    desc: CS2 health offset reference
    conf: 0.95
    if:
      type: text
      section: rdata
      word: "m_iHealth"

  - id: cs2-offset-view-matrix
    crit: notable
    desc: CS2 view matrix offset reference
    conf: 0.95
    if:
      type: text
      section: rdata
      word: "dwViewMatrix"

  # Source 2 netvars shared by CS2 and other Source 2 titles. A title without
  # the cs2.exe literal (Deadlock's reader) still carries these names.
  - id: source2-team-netvar
    crit: notable
    desc: Source 2 team-number netvar reference
    conf: 0.9
    if:
      # Large Source 2 builds can exceed the extracted-string cap before this
      # netvar table, so match the read-only bytes directly.
      type: raw
      section: rdata
      substr: "m_iTeamNum"

  - id: enemy-health-esp-label
    crit: notable
    desc: Enemy health or health-bar ESP label
    conf: 0.9
    if:
      type: text
      section: rdata
      regex: '(?i)\benemy health\b|\bhealth bars?\b'

  # === Overlay ===
  - id: dx11-overlay-init-message
    crit: notable
    desc: DirectX 11 overlay initialization message
    conf: 0.95
    if:
      type: text
      section: rdata
      substr: "Initializing DirectX 11 overlay"

  # === GitHub offset fetching ===
  - id: cs2-offset-github-url
    desc: CS2 offset fetching from GitHub raw content
    crit: notable
    conf: 0.95
    if:
      type: text
      section: rdata
      regex: 'raw\.githubusercontent\.com/.{0,50}/cs2-dumper/.{0,50}/output/(offsets|client_dll)\.json'

  # === Game weapon names ===
  - id: cs2-firearm-references
    crit: notable
    desc: CS2 firearm name references
    conf: 0.85
    if:
      type: text
      section: rdata
      regex: '\b(deagle|ak47|flashbang)\b'

  - id: cs2-knife-references
    crit: notable
    desc: CS2 knife name references
    conf: 0.85
    if:
      type: text
      section: rdata
      regex: '\bknife_(ct|t)\b'

composite_rules:
  - id: cs2-weapon-references
    desc: CS2 weapon name references (cheat targeting)
    crit: component
    conf: 0.85
    any:
      - id: cs2-firearm-references
      - id: cs2-knife-references

  # Generic CS2 cheat detection (covers variants without LX branding)
  - id: cs2-cheat-detected
    desc: Counter-Strike 2 game cheat with overlay injection
    crit: hostile
    conf: 0.93
    all:
      - id: cs2-process-target
      - id: cs2-client-dll-target
    any:
      - id: metadata/lang/source/naming/game::cheat-esp-features
      - id: metadata/lang/source/naming/game::cheat-aimbot-features
      - id: metadata/lang/source/naming/game::cheat-triggerbot-features
      - id: metadata/lang/source/naming/game::cheat-bunnyhop-features
      - id: metadata/lang/source/naming/game::cheat-norecoil-features
      - id: metadata/lang/source/naming/game::cheat-autoaccept-features
      - id: cs2-offset-entity-list
      - id: cs2-offset-local-player
      - id: cs2-offset-health
      - id: cs2-offset-view-matrix
      - id: cs2-weapon-references
      - id: dx11-overlay-init-message
    needs: 2

  # Game cheat overlay: ImGui beside a game target or cheat-feature vocabulary.
  # The renderer backend is not required -- DX9 and DX11 builds both appear.
  - id: game-cheat-overlay
    desc: ImGui overlay with a game target or cheat-feature vocabulary
    crit: suspicious
    conf: 0.92
    all:
      - id: well-known/lib/ui/dear-imgui::dear-imgui-library
    any:
      - id: cs2-process-target
      - id: metadata/lang/source/naming/game::cheat-esp-features
      - id: metadata/lang/source/naming/game::cheat-aimbot-features
    needs: 1

  # GitHub-based offset fetching for game cheats
  - id: cs2-github-offset-fetcher
    desc: Game cheat fetching CS2 offsets from GitHub
    crit: suspicious
    conf: 0.94
    all:
      - id: cs2-offset-github-url
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
    any:
      - id: well-known/lib/format/nlohmann-json::nlohmann-json-v3-symbol
      - id: cs2-process-target
    needs: 1

  # Reads CS2 entity memory by offset. Overlays that only draw do not
  # dereference health offsets in another process, so the remote read is
  # required. Vendor stats overlays carry the same set; the Blitz signed-module
  # exception below covers the verified Blitz client only.
  - id: cs2-memory-reader-cheat
    desc: CS2 game-memory reader with health offset and remote read
    crit: hostile
    conf: 0.96
    all:
      - id: cs2-process-target
      - id: cs2-offset-health
      - id: micro-behaviors/mem/read/cross-process::read-process-memory-call
    unless:
    - id: well-known/game/blitz::blitz-signed-game-module

  # Source 2 entity reader for a title whose process is not named by cs2.exe
  # (Deadlock's external ESP reads health netvars with ReadProcessMemory).
  # Health plus a remote read is the required pair; a second netvar or ESP
  # label is needed so a lone m_iHealth string cannot convict a tool.
  - id: source2-netvar-memory-reader-cheat
    desc: Source 2 game-memory reader with health netvar and ESP evidence
    crit: hostile
    conf: 0.94
    attack: T1055
    all:
      - id: cs2-offset-health
      - id: micro-behaviors/mem/read/cross-process::read-process-memory-call
    any:
      - id: cs2-offset-entity-list
      - id: cs2-offset-local-player
      - id: cs2-offset-view-matrix
      - id: source2-team-netvar
      - id: enemy-health-esp-label
    needs: 2
    unless:
    - id: well-known/game/blitz::blitz-signed-game-module
