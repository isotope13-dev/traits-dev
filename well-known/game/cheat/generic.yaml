# Generic game-cheat indicators. These deliberately require combinations of
# cheat controls, emulator targets, UI, and intrusive runtime behavior rather
# than treating a single game-related word as hostile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

traits:
  - id: self-described-game-cheat
    desc: Game cheat self-identification banner
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: .rsrc
      regex: '(?i)\b(windows\s+)?cheat\s+for\s+[a-z0-9][a-z0-9._ -]{1,32}\b'

  - id: aim-assist-control
    desc: Aim-assist or silent-aim cheat control
    crit: notable
    conf: 0.96
    if:
      type: text
      section: rdata
      regex: '\b(aimbot|aim assist|silent aim)\b'
      case_insensitive: true
  - id: visual-cheat-control
    desc: Wallhack or ESP cheat control
    crit: notable
    conf: 0.95
    if:
      type: text
      section: rdata
      regex: '\b(wallhack|ghost hack)\b'
      case_insensitive: true
  - id: combat-modification-control
    desc: Game combat-modification cheat controls
    crit: notable
    conf: 0.95
    if:
      type: text
      section: rdata
      regex: '\b(no recoil|no reload|rapid fire|camera hack)\b'
      case_insensitive: true
    unless:
      - id: camera-metadata-rapid-fire-label
  - id: camera-metadata-rapid-fire-label
    desc: Camera metadata rapid-fire pistol label
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)\b\d+\s*m\s+rapid\s+fire\s+pistol\b'
  # Native cheats may construct labels as immediates in .text rather than
  # storing them in .rdata. These atoms remain suspicious; the hostile rules
  # below also require asynchronous key polling before inferring cheat intent.
  - id: native-aim-feature-label
    desc: Native aim-assistance feature label
    crit: suspicious
    conf: 0.94
    if:
      type: text
      section: .text
      word: SmartAim
      case_insensitive: true
  - id: native-automated-fire-label
    desc: Native automated-fire feature label
    crit: suspicious
    conf: 0.94
    if:
      type: text
      section: .text
      word: AutoFire
      case_insensitive: true
  - id: native-rapid-aim-feature-label
    desc: Native rapid-aim feature label
    crit: suspicious
    conf: 0.94
    if:
      type: text
      section: .text
      word: RapidAim
      case_insensitive: true
  - id: emulator-game-target
    desc: Android emulator or native game process target
    crit: notable
    conf: 0.94
    if:
      # NativeAOT images can exceed the extracted-string cap before these
      # late strings; scan the read-only bytes so the target is not lost.
      type: raw
      section: rdata
      regex: '\b(HD-Player\.exe|BstkVMM\.dll|MapChunkViaBstkVmm|libil2cpp\.so|com\.dts\.freefiremax)\b'
      case_insensitive: true

  - id: valorant-vanguard-target
    desc: Valorant Vanguard target marker
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)(\bvgc\.exe\b|\bvgk\.sys\b|/vanguard/v1/gateway\b|["'']game["'']\s*:\s*["'']valo["''])'

  - id: valorant-vanguard-tamper-command
    desc: Vanguard process-control command
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)(taskkill(\.exe)?[^\r\n]{0,100}\bvgc\.exe\b|\bsc(\.exe)?\s+start\s+vgc\b)'

  - id: valorant-vanguard-pipe-tamper
    desc: Vanguard named-pipe override marker
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)(\boverrid\w*\s+vgc\s+pipe\b|\boriginal\s+pipe\b)'

composite_rules:
  - id: cheat-control-set
    desc: Generic game-cheat control set
    crit: suspicious
    conf: 0.95
    any:
      - id: aim-assist-control
      - id: visual-cheat-control
      - id: combat-modification-control
  - id: injected-game-cheat-panel
    desc: Game-cheat panel combined with emulator targeting and process injection
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: micro-behaviors/ui/framework/imgui::dear-imgui-library
      - id: emulator-game-target
      - id: cheat-control-set
      - id: objectives/evasion/process/injection/memory::remote-thread-injection-api-chain
  - id: traffic-intercepting-game-cheat
    desc: Game-cheat controls combined with WinDivert packet interception
    crit: hostile
    conf: 0.97
    attack: T1040
    all:
      - id: emulator-game-target
      - id: micro-behaviors/communications/capture/windivert::windivert-packet-filter
      - id: cheat-control-set
  - id: native-aim-toggle-cheat
    desc: Native SmartAim cheat controlled by key polling
    crit: hostile
    conf: 0.97
    all:
      - id: native-aim-feature-label
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
  - id: native-rapid-aim-toggle-cheat
    desc: Native RapidAim cheat controlled by key polling
    crit: hostile
    conf: 0.97
    all:
      - id: native-rapid-aim-feature-label
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
  - id: native-automated-fire-toggle-cheat
    desc: Native automated-fire cheat controlled by key polling
    crit: hostile
    conf: 0.97
    all:
      - id: native-automated-fire-label
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state

  - id: valorant-vanguard-cheat-loader
    desc: Valorant cheat loader tampering with Vanguard
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: valorant-vanguard-target
      - id: valorant-vanguard-tamper-command
      - id: valorant-vanguard-pipe-tamper
      - id: micro-behaviors/ui/framework/imgui::dear-imgui-library
    any:
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-session-connect-flow
    needs: 1

  # The mechanic of an "external" cheat, named for what it does rather than for
  # the words it ships. The keyword traits above read the cheat's own menu
  # labels ("aimbot", "wallhack"), which a build with renamed or encrypted
  # strings drops entirely; this rung survives that because it is built from the
  # API surface the technique cannot do without.
  #
  # Reading another process's memory *and* synthesizing mouse input is the pair
  # that matters: the cheat locates an entity in the game's address space and
  # then moves the physical cursor onto it. Neither half is unusual alone --
  # debuggers and profilers read process memory, macro recorders and
  # accessibility tools drive the mouse -- but a program that does both, after
  # walking the module list to find its target, is aiming for someone.
  #
  # Suspicious, not hostile: this is riskware. It manipulates a game the user
  # chose to run, and carries no exfiltration, persistence or credential access.
  - id: external-cheat-memory-read-aim
    desc: Reads game memory and drives the mouse
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/hardware/input/mouse/synthesis::mouse-event
      - id: micro-behaviors/process/enumerate/snapshot::module32-first
