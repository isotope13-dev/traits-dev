# League of Legends cheat injectors open the game or Riot client process and
# write code into it. Overlays and stat trackers name the same processes but
# do not carry a remote allocate/write/thread API set, so the identity
# composite needs both. Cheating injects into the user's own game client;
# it is identity, not hostility toward the user.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 512
  size_max: 500000000

composite_rules:
  - id: league-client-process-injector
    desc: Injector naming League of Legends processes
    attack: T1055
    all:
      - id: micro-behaviors/process/info/name::league-client-process-name
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
