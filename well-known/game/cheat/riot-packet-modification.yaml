# A subscription console client that waits for a Riot game, prepares the
# player's Riot credentials, captures game traffic through an installed
# component service and reports whether packets were modified. The messages
# are .rdata text of the client itself; each is notable alone, and the
# identity composite needs the packet-modification result together with the
# Riot credential step so that neither a generic packet tool nor a Riot
# overlay is named. Like the other cheat identities this records what the
# tool is, not that it targets the user.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 512
  size_max: 500000000

traits:
  - id: packet-modification-session-result-message
    desc: Session result reports modified packets
    if:
      type: text
      section: rdata
      regex: 'Session finished with(out)? modified packets'

  - id: riot-credentials-not-prepared-message
    desc: Riot credentials preparation failure message
    if:
      type: text
      section: rdata
      substr: 'Riot credentials were not prepared'

composite_rules:
  - id: riot-credentialed-packet-modification-client
    desc: Riot-credentialed packet-modification client
    all:
      - id: packet-modification-session-result-message
      - id: riot-credentials-not-prepared-message
