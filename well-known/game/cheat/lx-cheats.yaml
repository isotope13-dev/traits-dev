# LX Cheats - Counter-Strike 2 Game Cheat Detection
# LX CHEATS C++ Edition is a game cheat targeting Counter-Strike 2.
# It provides ESP, aimbot, triggerbot, bunnyhop, and no-recoil features
# via a DirectX 11 overlay with Dear ImGui menus.
# It fetches game offsets dynamically from GitHub.
# ATT&CK: T1055 (Process Injection)
defaults:
  for: [pe]
  platforms: [windows]
  crit: component
  conf: 0.95
  size_min: 512
  size_max: 500000000
traits:
  # === Brand strings ===
- id: cs2-process-target
  crit: notable
  desc: Counter-Strike 2 game process target
  conf: 0.95
  if:
    type: text
    section: rdata
    word: "cs2.exe"

- id: cs2-client-dll-target
  crit: notable
  desc: CS2 client.dll module target
  conf: 0.95
  if:
    type: text
    section: rdata
    word: "client.dll"

  # === Cheat feature strings ===
- id: cs2-offset-entity-list
  crit: notable
  desc: CS2 entity list offset reference
  conf: 0.95
  if:
    type: text
    section: rdata
    word: "dwEntityList"

- id: cs2-offset-local-player
  crit: notable
  desc: CS2 local player pawn offset reference
  conf: 0.95
  if:
    type: text
    section: rdata
    word: "dwLocalPlayerPawn"

- id: cs2-offset-health
  crit: notable
  desc: CS2 health offset reference
  conf: 0.95
  if:
    type: text
    section: rdata
    word: "m_iHealth"

- id: cs2-offset-view-matrix
  crit: notable
  desc: CS2 view matrix offset reference
  conf: 0.95
  if:
    type: text
    section: rdata
    word: "dwViewMatrix"

  # === Game weapon names ===
- id: dx11-overlay-init-message
  crit: notable
  desc: DirectX 11 overlay initialization message
  conf: 0.95
  if:
    type: text
    section: rdata
    substr: "Initializing DirectX 11 overlay"

  # === GitHub offset fetching ===
- id: cs2-offset-github-url
  desc: CS2 offset fetching from GitHub raw content
  crit: notable
  conf: 0.95
  if:
    type: text
    section: rdata
    regex: "raw\\.githubusercontent\\.com/.{0,50}/cs2-dumper/.{0,50}/output/(offsets|client_dll)\\.json"

- id: cs2-firearm-references--deagle
  crit: notable
  desc: CS2 firearm name references (deagle)
  conf: 0.85
  if:
    type: text
    section: rdata
    word: deagle
- id: cs2-firearm-references--ak47
  crit: notable
  desc: CS2 firearm name references (ak47)
  conf: 0.85
  if:
    type: text
    section: rdata
    word: ak47
- id: cs2-firearm-references--flashbang
  crit: notable
  desc: CS2 firearm name references (flashbang)
  conf: 0.85
  if:
    type: text
    section: rdata
    word: flashbang
- id: cs2-knife-references--knife-ct
  crit: notable
  desc: CS2 knife name references (knife_ct)
  conf: 0.85
  if:
    type: text
    section: rdata
    word: knife_ct
- id: cs2-knife-references--knife-t
  crit: notable
  desc: CS2 knife name references (knife_t)
  conf: 0.85
  if:
    type: text
    section: rdata
    word: knife_t
composite_rules:
- id: cs2-firearm-references
  desc: CS2 firearm name references
  conf: 0.85
  any:
  - id: cs2-firearm-references--deagle
  - id: cs2-firearm-references--ak47
  - id: cs2-firearm-references--flashbang
- id: cs2-knife-references
  desc: CS2 knife name references
  conf: 0.85
  any:
  - id: cs2-knife-references--knife-ct
  - id: cs2-knife-references--knife-t
- id: cs2-weapon-references
  desc: CS2 weapon name references (cheat targeting)
  crit: component
  conf: 0.85
  any:
  - id: cs2-firearm-references
  - id: cs2-knife-references

  # High-confidence LX Cheats detection
- id: cs2-cheat-detected
  desc: Counter-Strike 2 game cheat with overlay injection
  crit: hostile
  conf: 0.93
  all:
  - id: cs2-process-target
  - id: cs2-client-dll-target
  any:
  - id: metadata/lang/source/naming/game::cheat-esp-features
  - id: metadata/lang/source/naming/game::cheat-aimbot-features
  - id: metadata/lang/source/naming/game::cheat-triggerbot-features
  - id: metadata/lang/source/naming/game::cheat-bunnyhop-features
  - id: metadata/lang/source/naming/game::cheat-norecoil-features
  - id: metadata/lang/source/naming/game::cheat-autoaccept-features
  - id: cs2-offset-entity-list
  - id: cs2-offset-local-player
  - id: cs2-offset-health
  - id: cs2-offset-view-matrix
  - id: cs2-weapon-references
  - id: dx11-overlay-init-message
  needs: 2

  # Game cheat overlay: ImGui + DX11 + game target
- id: game-cheat-overlay
  desc: Game cheat with ImGui overlay and DirectX 11 rendering
  crit: suspicious
  conf: 0.92
  all:
  - id: well-known/lib/ui/dear-imgui::dear-imgui-library
  any:
  - id: cs2-process-target
  - id: metadata/lang/source/naming/game::cheat-esp-features
  - id: metadata/lang/source/naming/game::cheat-aimbot-features
  needs: 1

  # GitHub-based offset fetching for game cheats
- id: cs2-github-offset-fetcher
  desc: Game cheat fetching CS2 offsets from GitHub
  crit: suspicious
  conf: 0.94
  all:
  - id: cs2-offset-github-url
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  any:
  - id: well-known/lib/format/nlohmann-json::nlohmann-json-v3-symbol
  - id: cs2-process-target
  needs: 1
