# Fortnite loader that carries an Epic Online Services game-client session token and
# targets the Fortnite Win64 install. The token JSON and the AntiCheat feature list
# are how an anti-cheat-aware client authenticates, so the token alone is only
# notable. A live token beside the Fortnite install path and the cheat's packaging
# is the loader evidence. The rule matches structural markers only, never token
# values.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  size_max: 200000000
  attack: T1555.003,T1578

traits:
  - id: fortnite-win64-install-path
    desc: Fortnite Win64 install path string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Epic Games\Fortnite\FortniteGame\Binaries\Win64'

  - id: eos-game-client-token-role
    desc: Epic Online Services GameClient token role
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '"role":"GameClient"'

  - id: eos-anticheat-feature-flag
    desc: Epic token feature list includes AntiCheat
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '"AntiCheat"'

composite_rules:
  - id: fortnite-eos-session-loader
    desc: Fortnite loader with embedded EOS game-client session token
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: well-known/game/cheat/product::fortnite-win64-install-path
      - id: well-known/game/cheat/product::eos-game-client-token-role
      - id: well-known/game/cheat/product::eos-anticheat-feature-flag
