# Astra Client is a Minecraft cheat (aim-assist and trigger-bot mods) that is
# distributed through the Astra Launcher. The identity legs name that launcher.
# The hostile composite also needs the launcher to unpack an embedded ZIP and
# start a program from it, so a plain mention of the name stays notable.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 200000000

traits:
  - id: astra-launcher-portable-env
    desc: Astra Launcher portable env variable
    if:
      type: text
      substr: 'ASTRA_PORTABLE_EXE'

  - id: astra-launcher-name
    desc: Astra Launcher program name string
    if:
      type: text
      substr: 'AstraLauncher'

  # The launcher bundles a Fabric client mod. Its aimbot (AimTarget) and trigger
  # bot (TriggerMixin) can target real players, as the class bytecode shows.
  # The outer .NET stub stores that mod deflated, so these entry names are only
  # readable in the extracted launcher.
  - id: astra-client-aim-target-entry
    desc: Fabric mod aim-target class entry
    if:
      type: text
      substr: 'dev/astra/client/AimTarget.class'

  - id: astra-client-trigger-mixin-entry
    desc: Fabric mod trigger-bot mixin entry
    if:
      type: text
      substr: 'dev/astra/client/mixin/TriggerMixin.class'

composite_rules:
  - id: astra-client-aimbot-trigger-mod
    desc: Minecraft client mod with aimbot and trigger-bot classes
    crit: hostile
    conf: 0.93
    all:
      - id: astra-client-aim-target-entry
      - id: astra-client-trigger-mixin-entry

  - id: astra-launcher-identity
    desc: Astra Launcher product identity strings
    crit: notable
    conf: 0.96
    all:
      - id: astra-launcher-portable-env
      - id: astra-launcher-name

  - id: astra-client-cheat-launcher
    desc: Astra cheat launcher starts a program from its embedded ZIP
    crit: hostile
    conf: 0.95
    all:
      - id: astra-launcher-identity
      - id: objectives/execution/payload/file-exec/detached/embedded-stage::dotnet-zip-managed-spawn
