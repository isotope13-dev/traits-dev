# Astra Client is a Minecraft cheat (aim-assist and trigger-bot mods) that is
# distributed through the Astra Launcher. The identity legs name that launcher.
# The hostile composite also needs the launcher to unpack an embedded ZIP and
# start a program from it, so a plain mention of the name stays notable.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 200000000

traits:
  - id: astra-launcher-portable-env
    desc: Astra Launcher portable env variable
    if:
      type: text
      substr: 'ASTRA_PORTABLE_EXE'

  - id: astra-launcher-name
    desc: Astra Launcher program name string
    if:
      type: text
      substr: 'AstraLauncher'

composite_rules:
  - id: astra-launcher-identity
    desc: Astra Launcher product identity strings
    crit: notable
    conf: 0.96
    all:
      - id: astra-launcher-portable-env
      - id: astra-launcher-name

  - id: astra-client-cheat-launcher
    desc: Astra cheat launcher starts a program from its embedded ZIP
    crit: hostile
    conf: 0.95
    all:
      - id: astra-launcher-identity
      - id: objectives/execution/payload/file-exec/detached/embedded-stage::dotnet-zip-managed-spawn
