# Vape V4 is a paid Minecraft cheat client. Its native launcher logs the user
# in against the vendor backend (credentials plus hardware ID), then injects
# the cheat DLL into the running JVM with direct NT memory/thread calls and a
# reflective loader. Product strings are identity; the injection behaviour is
# supplied by shared legs.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97
  size_min: 65536
  size_max: 100000000

traits:
  - id: vape-zeus-backend-address
    desc: Vape cheat backend address variable
    if:
      type: text
      substr: 'VAPE_ZEUS_ADDRESS'

  - id: vape-zeus-backend-host
    desc: Vape cheat backend hostname
    if:
      type: text
      substr: 'zeus-prod.vape.chat'

  - id: vape-loader-ready-message
    desc: Vape loader completion message
    if:
      type: text
      substr: 'Vape has finished loading'

composite_rules:
  - id: vape-loader-identity
    desc: Vape cheat loader product strings
    crit: notable
    conf: 0.98
    any:
      - id: vape-zeus-backend-address
      - id: vape-zeus-backend-host
      - id: vape-loader-ready-message
    needs: 2

  - id: vape-minecraft-cheat-injector
    desc: Vape Minecraft cheat loader with NT injection
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: vape-loader-identity
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-memory-thread-api-cluster
      - id: micro-behaviors/dylib/load/memory::reflective-loader-name-string
