# QQ Speed (QQ飞车) private-server launcher, built with E-Language.
# The 32-bit launcher shows an HTML login form, writes the typed account,
# password, server address and a key to QQInfo.ini, starts the genuine
# game client elevated, then injects an embedded x64 DLL (via Heaven's Gate and
# RtlCreateUserThread). The DLL reads QQInfo.ini, patches the client by byte
# signature and connects to the hard-coded server with those credentials.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97
  size_min: 65536
  size_max: 33554432

traits:
  - id: qqspeed-run-game-event
    desc: QQ Speed launcher game event name
    if:
      type: text
      substr: RunSpeedGameEvent_

  - id: qqspeed-qqinfo-ini
    desc: QQInfo.ini launcher handoff file
    crit: component
    if:
      type: text
      substr: QQInfo.ini

  - id: qqspeed-client-path
    desc: QQ Speed x64 client executable path
    if:
      type: text
      substr: 'Releasephysx27_64\GameApp.exe'

  - id: qqspeed-launcher-ini-section
    desc: Launcher mode section in QQInfo.ini
    crit: component
    if:
      type: text
      substr: Launcher

composite_rules:
  - id: qqspeed-private-server-launcher
    desc: QQ Speed private-server launcher injecting client DLL
    crit: hostile
    conf: 0.96
    attack: T1055,T1056
    all:
      - id: qqspeed-run-game-event
      - id: qqspeed-qqinfo-ini
      - id: qqspeed-client-path
      - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--rtlcreateuserthread-text
    unless:
      - id: metadata/signature/verified/

  - id: qqspeed-server-redirect-dll
    desc: QQ Speed client patch DLL reading launcher credentials
    crit: suspicious
    conf: 0.95
    size_max: 2097152
    for: [pe, dll]
    all:
      - id: qqspeed-qqinfo-ini
      - id: qqspeed-launcher-ini-section
      - id: micro-behaviors/fs/config/system::read-private-profile-ansi
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
      - id: micro-behaviors/process/info/thread::thread-context-suspend-resume-api-profile
