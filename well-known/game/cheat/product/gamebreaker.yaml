defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: gamebreaker-dma-cheat-loader
    desc: GameBreaker DMA game cheat loader marker
    crit: suspicious
    conf: 0.99
    size_max: 100000000
    if:
      type: text
      section: .text
      regex: 'GameBreaker\.(Licensing\.DeviceDetails|Package|Runtime\.dll|ROBRUN\.v1)'

  - id: robrun-focus-menu-literal
    desc: ROBRUN Focus menu literal
    crit: notable
    conf: 0.98
    size_max: 20000000
    if:
      type: text
      substr: robrun_focus_menu

  - id: robrun-focus-host-export
    desc: ROBRUN FocusHost DLL export
    crit: notable
    conf: 0.98
    size_max: 20000000
    if:
      type: export
      exact: FocusHost_Init

composite_rules:
  - id: robrun-focus-menu-dll
    desc: GameBreaker ROBRUN Focus cheat menu DLL
    crit: notable
    conf: 0.99
    all:
      - id: robrun-focus-menu-literal
      - id: robrun-focus-host-export
