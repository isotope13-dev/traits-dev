# ReverseSigma / ApollonClient Android game-modification library.
# This is a game cheat/overlay component, not a malware family. Its JNI
# namespace is a stronger identity signal than generic words such as "aim" or
# "hack", which can occur in ordinary game resources.
defaults:
  platforms: [android]
  for: [so]
  size_min: 1048576
  size_max: 10000000

traits:
  - id: reverse-sigma-apollon-jni
    desc: ApollonClient GLES3 JNI native-method namespace
    crit: notable
    conf: 0.995
    if:
      type: symbol
      regex: '^Java_com_subroutineZEFF_ApollonClient_GLES3JNIView_'
