# ReverseSigma / ApollonClient Android game-modification library.
# This is a game cheat/overlay component, not a malware family. Its JNI
# namespace is a stronger identity signal than generic words such as "aim" or
# "hack", which can occur in ordinary game resources.
defaults:
  platforms: [android]
  for: [so]
  size_min: 1048576
  size_max: 10000000

traits:
  - id: reverse-sigma-apollon-jni
    desc: ApollonClient GLES3 JNI native-method namespace
    crit: notable
    conf: 0.995
    if:
      type: symbol
      kind: export
      regex: '^Java_com_subroutineZEFF_ApollonClient_GLES3JNIView_'

composite_rules:
  - id: reverse-sigma-dobby-hook-api
    desc: ReverseSigma Apollon JNI and Dobby hook symbols
    # The exact ApollonClient namespace identifies the named game cheat; the
    # Dobby API confirms that this is an active hook implementation, not just
    # a library bundled by an unrelated application.
    crit: hostile
    conf: 0.995
    all:
      - id: reverse-sigma-apollon-jni
      - id: micro-behaviors/process/hook/keywords::dobby-hook-api

  - id: reverse-sigma-codepatch-api
    desc: ReverseSigma Apollon JNI with code-patching API
    # CodePatch changes executable pages at runtime in this named cheat.
    crit: hostile
    conf: 0.995
    all:
      - id: reverse-sigma-apollon-jni
      - id: micro-behaviors/process/hook/keywords::dobby-codepatch-api

  - id: reverse-sigma-imgui-opengl-overlay
    desc: ReverseSigma Android ImGui OpenGL overlay
    # The exact identity plus ImGui/OpenGL establishes the in-game cheat
    # overlay, rather than merely identifying a UI library.
    crit: hostile
    conf: 0.995
    all:
      - id: reverse-sigma-apollon-jni
      - id: micro-behaviors/ui/framework/imgui::dear-imgui-library
      - id: micro-behaviors/dylib/library/abi-graphics::graphics-api-import
