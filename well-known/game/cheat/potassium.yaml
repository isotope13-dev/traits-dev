defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: potassium-update-host
    desc: Potassium executor update host
    crit: notable
    conf: 0.95
    size_max: 500000000
    if:
      type: text
      substr: files.potassium.pro
      section: .rdata
  - id: roblox-client-shutdown-message
    desc: Roblox client shutdown status text
    crit: component
    conf: 0.85
    size_max: 500000000
    if:
      type: text
      substr: Closing Roblox
      section: .rdata
composite_rules:
  # An executor is not a malware family. The launcher UI pairs its own update
  # host with status text for closing and rebuilding the Roblox client around
  # an injected Luau runtime, which identifies the product without claiming
  # more than the retained bytes show.
  - id: potassium-script-executor
    desc: Potassium Roblox script executor launcher
    crit: notable
    conf: 0.97
    size_max: 500000000
    all:
      - id: well-known/game/cheat::potassium-update-host
      - id: well-known/game/cheat::roblox-client-shutdown-message
