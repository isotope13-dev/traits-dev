defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # An executor is not a malware family. Product infrastructure and executor
  # API vocabulary jointly identify Velocity, including its embedded DLL.
  - id: velocity-script-executor
    desc: Velocity Roblox script executor
    crit: notable
    conf: 0.99
    size_max: 500000000
    all:
      - id: micro-behaviors/communications/url/host/name::velocity-service-domain-reference
      - id: micro-behaviors/metaprogramming/reflection::script-runtime-introspection-api-names
