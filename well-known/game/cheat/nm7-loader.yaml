defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 33554432

traits:
  - id: nm7-loader-pdb
    desc: nm7 game cheat loader PDB path
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      substr: 'nm7 loader'

  - id: angeldriver-pdb
    desc: AngelDriver kernel cheat protection driver PDB
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      substr: 'AngelDriver.pdb'

  - id: angeldriver-threatkill-log
    desc: AngelDriver threatkill log message
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      substr: '[Angel] threatkill'

composite_rules:
  - id: nm7-cheat-loader
    desc: nm7 Call of Duty game cheat loader
    crit: notable
    conf: 0.995
    all:
      - id: nm7-loader-pdb
      - id: well-known/tool/offensive/mw3-xploitron::modern-warfare-target-process

  - id: angeldriver-cheat-protector
    desc: AngelDriver kernel cheat protection driver
    crit: notable
    conf: 0.995
    any:
      - id: angeldriver-pdb
      - id: angeldriver-threatkill-log

  - id: nm7-cheat-context
    desc: nm7 game cheat loader context
    crit: exception
    conf: 1.0
    any:
      - id: nm7-cheat-loader
      - id: angeldriver-cheat-protector
