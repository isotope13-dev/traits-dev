# Game-cheat process injection, thread-context manipulation, and vulnerable-driver abuse.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

composite_rules:
  - id: game-cheat-remote-memory-modification
    desc: Game cheat overlay combined with remote-process memory modification APIs
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: well-known/game/cheat/control::game-cheat-overlay
      - id: micro-behaviors/mem/combined::enumerated-remote-memory-write-api-profile

  - id: shellcode-mapper-cheat-loader
    desc: Game-cheat overlay beside a shellcode-write mapper stage
    crit: hostile
    conf: 0.97
    attack: T1055
    all:
      - id: well-known/game/cheat/control::game-cheat-overlay
      - id: objectives/execution/payload/process-inject/memory-transfer::shellcode-write-failure-diagnostic

  # CS2 cheats target the game process directly rather than an emulator. Keep
  # the target process, client module, and cross-process manipulation as
  # separate evidence roles so a game reference or generic injector cannot
  # trigger this objective on its own.
  - id: cs2-process-injecting-cheat
    desc: CS2 cheat targets the game with process injection
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: well-known/game/cheat/control::cs2-process-target
      - id: well-known/game/cheat/control::cs2-client-dll-target
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set

  - id: intel-vulnerable-driver-game-cheat
    desc: Game cheat uses Intel vulnerable-driver memory IOCTLs
    crit: hostile
    conf: 0.99
    attack: T1068
    for: [pe]
    scope: outer
    all:
      - id: well-known/game/cheat/control::cheat-control-set
      - id: micro-behaviors/os/kernel/device::intel-kernel-copy-request-call
      - id: micro-behaviors/os/kernel/device::intel-physical-map-request-call

  - id: injected-game-cheat-panel
    desc: Game-cheat panel combined with emulator targeting and process injection
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: well-known/lib/ui/dear-imgui::dear-imgui-library
      - id: emulator-game-target
      - id: well-known/game/cheat/control::cheat-control-set
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set

  - id: evasive-aim-lock-process-injector
    desc: Aim-lock cheat injects into another process and detects debuggers
    crit: hostile
    conf: 0.98
    attack: T1055,T1622
    all:
      - id: well-known/game/cheat/control::aim-lock-control
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api

  # Trainer option labels alone are weak. Enumerating a process's threads and
  # rewriting their contexts is the control leg; the labels show the purpose.
  # This is how single-player trainers patch a game, so it is a cheat tool
  # (riskware), not malware. Unsigned vendor trainers with controls only
  # (FLiNG, CheatHappens) are exempt, as for cheat-control-set.
  - id: game-trainer-thread-context-control
    desc: Game trainer cheat options with thread-context rewriting
    crit: suspicious
    conf: 0.9
    attack: T1055
    all:
      - id: micro-behaviors/process/info/thread::thread-context-api-pair
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-thread-enumeration-string
    any:
      - id: well-known/game/cheat/control::trainer-hotkey-option-label
      - id: well-known/game/cheat/control::trainer-infinite-stat-option
      - id: well-known/game/cheat/control::aim-assist-control
      - id: well-known/game/cheat/control::visual-cheat-control
      - id: well-known/game/cheat/control::combat-modification-control
    needs: 1
    unless:
      - id: objectives/evasion/masquerade/identity/app::unsigned-trainer-cheat-controls-only

  - id: evasive-cheat-module-executable-rdata
    desc: Game-cheat binary with anti-debug evasion and executable .rdata
    crit: hostile
    conf: 0.96
    attack: T1622,T1027
    all:
      - id: well-known/game/cheat/control::cheat-control-set
      - id: metadata/binary/section/permission::executable-rdata
      - id: objectives/anti-analysis/debugger-detect/check::win-debugger-detect
    unless:
      - id: metadata/signature/verified/

  # League of Legends cheat injectors open the game or Riot client process and
  # write code into it. Overlays and stat trackers name the same processes but
  # do not carry a remote allocate/write/thread API set, so the identity
  # composite needs both. Cheating injects into the user's own game client;
  # it is identity, not hostility toward the user.
  - id: league-client-process-injector
    desc: Injector naming League of Legends processes
    crit: notable
    conf: 0.95
    attack: T1055
    unless:
      - id: metadata/binary/layout/embedded::repeated-standard-pe-images
    all:
      - id: micro-behaviors/os/application/target/game::league-client-process-name
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
