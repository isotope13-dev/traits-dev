# Anti-cheat tampering, simulation, and game-ban trace cleanup.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

traits:
  # The Vanguard component and gateway names themselves are Riot's, not a
  # cheat's -- game launchers and optimizers reference them too -- so they live
  # in well-known/game/anti-cheat/ and are composed in below. What stays here is
  # the cheat-loader config field that selects VALORANT as the target title.
  - id: valorant-loader-game-selector
    desc: Cheat loader config selects VALORANT
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)["'']game["'']\s*:\s*["'']valo["'']'

  - id: valorant-vanguard-tamper-command
    desc: Vanguard process-control command
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)(taskkill(\.exe)?[^\r\n]{0,100}\bvgc\.exe\b|\bsc(\.exe)?\s+start\s+vgc\b)'

  - id: valorant-vanguard-pipe-tamper
    desc: Vanguard named-pipe override marker
    crit: notable
    conf: 0.99
    if:
      type: text
      section: rdata
      regex: '(?i)(\boverrid\w*\s+vgc\s+pipe\b|\boriginal\s+pipe\b)'

  - id: vanguard-simulation-marker
    desc: Identifies an emulated Vanguard service
    crit: notable
    conf: 0.97
    if:
      type: text
      section: rdata
      regex: '(?i)(simulated Vanguard (mutex|shared memory)|DndVanguardSrv)'

composite_rules:
  - id: valorant-vanguard-cheat-loader
    desc: Valorant cheat loader tampering with Vanguard
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: well-known/game/anti-cheat::vanguard-component-name
      - id: valorant-vanguard-tamper-command
      - id: valorant-vanguard-pipe-tamper
      - id: well-known/lib/ui/dear-imgui::dear-imgui-library
    any:
      - id: micro-behaviors/os/privilege/reference::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-session-connect-flow
    needs: 1

  - id: valorant-vanguard-simulated-pipe-server
    desc: Creates a simulated Vanguard pipe server
    crit: hostile
    conf: 0.98
    attack: T1562.001
    all:
      - id: well-known/game/anti-cheat::vanguard-component-name
      - id: valorant-vanguard-tamper-command
      - id: vanguard-simulation-marker
      - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-server
      - id: well-known/lib/ui/dear-imgui::dear-imgui-library
    any:
      - id: micro-behaviors/os/privilege/reference::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-session-connect-flow
    needs: 1

  - id: game-ban-trace-cleaner
    desc: Game-ban cleaner with prompted adapter removal
    crit: suspicious
    conf: 0.99
    size_max: 52428800
    all:
      - id: micro-behaviors/ui/terminal::game-ban-adapter-guid-message
      - id: micro-behaviors/ui/terminal::game-tracking-file-cleanup-message
      - id: micro-behaviors/ui/dialog/prompt::adapter-reset-confirmation
      - id: micro-behaviors/os/kernel/device::setupdi-remove-device
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
