# HWID spoofer that injects into a game process. The spoofer harvests the
# host's hardware identifiers (CPU, GPU, disk, RAM, motherboard, NIC) and sends
# them to a licence server with a reset request, then impersonates them inside
# the game's process. That is game ban evasion and anti-cheat tampering. Field
# names and the injector's status lines are the family identity; the composite
# demands all three so a generic hardware inventory tool cannot match.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

traits:
  - id: hwid-components-json-key
    desc: HWID component JSON key set
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: hwidComponents

  - id: hwid-reset-request-flag
    desc: HWID reset request flag in payload
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: requestHwidReset

  - id: hwid-motherboard-serial-field
    desc: Motherboard serial field name
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: motherboard_serial

  - id: hwid-game-injector-status
    desc: Game injector status lines name game pid
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'game found pid|emu inject into game|game open fail'

composite_rules:
  - id: hwid-spoofer-game-injector
    desc: HWID spoofer with reset request and in-game injector
    crit: hostile
    conf: 0.95
    attack: T1562.001,T1055
    all:
      - id: well-known/game/cheat/tamper::hwid-components-json-key
      - id: well-known/game/cheat/tamper::hwid-reset-request-flag
      - id: well-known/game/cheat/tamper::hwid-motherboard-serial-field
      - id: well-known/game/cheat/tamper::hwid-game-injector-status
