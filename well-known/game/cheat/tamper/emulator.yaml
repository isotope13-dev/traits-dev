# Android emulator targeting and root-image signature patching by game cheats.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

traits:
  - id: emulator-game-target
    desc: Android emulator or native game process target
    crit: notable
    conf: 0.94
    if:
      # NativeAOT images can exceed the extracted-string cap before these
      # late strings; scan the read-only bytes so the target is not lost.
      type: raw
      section: any
      regex: '\b(HD-Player\.exe|BstkVMM\.dll|MapChunkViaBstkVmm|libil2cpp\.so|com\.dts\.freefiremax)\b'
      case_insensitive: true

  - id: gameloop-emulator-target
    desc: GameLoop Android emulator process target
    crit: notable
    conf: 0.94
    if:
      type: raw
      section: any
      regex: '\b(GameLoop Android Engine|AndroidProcess\.exe)\b'
      case_insensitive: true

  - id: emulator-root-image-patcher
    desc: Applies signature patches to emulator files
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      section: rdata
      regex: '(?i)(Root\.vhd|HD-Player\.exe) signatures to apply'

  - id: emulator-root-patch-cycle
    desc: Stops emulator processes before patching
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: rdata
      regex: '(?i)closing HD-Player\s*/\s*BstkSVC before patching'

composite_rules:
  - id: emulator-root-patching-cheat
    desc: Game-cheat tool patches BlueStacks emulator binaries or root image
    crit: hostile
    conf: 0.99
    all:
      - id: emulator-game-target
      - id: emulator-root-image-patcher
      - id: emulator-root-patch-cycle
