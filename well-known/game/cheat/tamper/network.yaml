# Game-cheat packet interception and traffic tampering.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
  size_min: 512
  size_max: 500000000

composite_rules:
  - id: traffic-intercepting-game-cheat
    desc: Game-cheat controls combined with WinDivert packet interception
    crit: hostile
    conf: 0.97
    attack: T1040
    all:
      - id: emulator-game-target
