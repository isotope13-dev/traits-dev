# JoolzCheat is a Half-Life game cheat project. Its shared sources carry a
# banner naming the project, and that banner ships in helper headers such as
# the CRC32 class. The banner identifies the source tree, not hostile code,
# so the atom stays notable and no composite is written.
defaults:
  platforms: [windows]
  for: [c, cpp, makefile, text]
  crit: notable
  conf: 0.95

traits:
  - id: joolzcheat-banner
    desc: JoolzCheat game cheat project banner
    if:
      type: text
      substr: JoolzCheat
