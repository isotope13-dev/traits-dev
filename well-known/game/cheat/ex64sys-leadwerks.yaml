# Packed bundle recovered from a PUBG external-cheat build. The driver PDB
# names Ex64sys under a PUBG project tree; the companion injector comes from a
# Leadwerks template and names C:\Test.dll. Requiring all three developer
# artifacts avoids classifying an unrelated Ex64sys or Leadwerks build.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 262144
  size_max: 33554432

traits:
  - id: ex64sys-driver-pdb
    desc: Ex64sys driver PDB basename
    crit: component
    conf: 0.99
    if:
      type: raw
      substr: Ex64sys.pdb
      section: .nsp0

  - id: leadwerks-get-injector-pdb
    desc: Leadwerks Get injector PDB path
    crit: component
    conf: 0.99
    if:
      type: raw
      substr: Leadwerks-Template-master\Source\Get
      section: .nsp0

  - id: test-dll-injection-path
    desc: Test DLL injection target path
    crit: component
    conf: 0.95
    if:
      type: raw
      substr: C:\Test.dll
      section: .nsp0

composite_rules:
  - id: ex64sys-leadwerks-injector-bundle
    desc: Ex64sys driver and Leadwerks injector bundle
    crit: suspicious
    conf: 0.99
    all:
      - id: ex64sys-driver-pdb
      - id: leadwerks-get-injector-pdb
      - id: test-dll-injection-path
