# BeamNG.drive vehicle-simulation game (BeamNG GmbH).
# Signed shipping builds carry this product name and PDB; identity keeps
# generic process/memory/socket traits in a known-game context.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 52428800

traits:
  - id: beamng-drive-product-name
    desc: BeamNG.drive version product name
    if:
      type: value
      path: pe.version.product_name
      exact: BeamNG.drive

  - id: beamng-drive-pdb-basename
    desc: BeamNG.drive debug PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: BeamNG.drive.pdb

  - id: beamng-gmbh-company
    desc: BeamNG GmbH version company name
    if:
      type: value
      path: pe.version.company
      exact: BeamNG GmbH

  - id: beamng-drive-original-filename
    desc: BeamNG.drive original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: BeamNG.drive

  - id: beamng-support-host
    desc: BeamNG product support hostname
    if:
      type: text
      substr: go.beamng.com
      section: .rdata

composite_rules:
  - id: beamng-drive-identity
    desc: Recognized BeamNG.drive game binary
    needs: 2
    any:
      - id: beamng-drive-product-name
      - id: beamng-drive-pdb-basename
      - id: beamng-gmbh-company
      - id: beamng-drive-original-filename
      - id: beamng-support-host
