# BeamNG.drive vehicle-simulation game (BeamNG GmbH).
# Signed shipping builds carry this product name and PDB; identity keeps
# generic process/memory/socket traits in a known-game context.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 52428800

traits:
  - id: beamng-drive-product-name
    desc: BeamNG.drive version product name
    if:
      type: value
      path: pe.version.product_name
      exact: BeamNG.drive

  - id: beamng-drive-pdb-basename
    desc: BeamNG.drive debug PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: BeamNG.drive.pdb
