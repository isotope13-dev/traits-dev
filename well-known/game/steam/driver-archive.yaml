defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: steam-drivers-archive-title
  desc: Steam drivers archive title
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Steam Drivers Archive
    section: rdata
- id: steam-driver-archive-path
  desc: Steam driver path text
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: drivers/Windows10/x64/Steam
    section: rdata
composite_rules:
- id: valve-steam-driver-archive
  desc: Steam driver reference and Valve chain name
  crit: notable
  conf: 0.99
  all:
  - id: metadata/signature/claim/signer::valve-corp
  any:
  - id: well-known/game/steam::steam-drivers-archive-title
  - id: well-known/game/steam::steam-driver-archive-path
