defaults:
  size_max: 52428800
  platforms:
    - windows
  for:
    - pe
traits:
  - id: valve-vlv-integrity-header
    desc: Valve VLV integrity header
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 56 4C 56 00 01 00 00 00
      offset: 64
  - id: steam-product-name
    desc: Steam product metadata
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: Steam
  - id: steam-exe-original-filename
    desc: Steam client OriginalFilename metadata
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.original_filename
      exact: steam.exe
  - id: steamexe-pdb-basename
    desc: Steam client steamexe PDB basename
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: steamexe.pdb
  - id: steam-rel-client-pdb-path
    desc: Steam release-client steamexe PDB path
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)steam_rel_client_win32\\build\\src\\steamexe\\'
  - id: steam-api-export-prefix
    desc: SteamAPI export prefix
    crit: notable
    if:
      type: symbol
      regex: ^SteamAPI_
  - id: steam-export-prefix
    desc: Steam export prefix
    crit: notable
    if:
      type: symbol
      regex: ^Steam_
  - id: steam-breakpad-export-prefix
    desc: Steam Breakpad export prefix
    crit: notable
    if:
      type: symbol
      regex: ^Breakpad_Steam
  - id: breakpad-steamid-export
    desc: Steam Breakpad export
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: Breakpad_SetSteamID
  - id: steam-error-reporter-path
    desc: Steam error reporter path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /steamerrorreporter.exe
      section: rdata
  - id: steam-bootstrapper-export-family
    desc: Steam bootstrapper API exports
    crit: notable
    conf: 0.99
    if:
      type: export
      regex: '^SteamBootstrapper_(Get|Set)'
  - id: steam-bootstrapper-manifest-description
    desc: Steam Bootstrapper manifest description
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.manifest.description
      exact: Steam Bootstrapper
  - id: steam-assembly-identity
    desc: Valve Steam assembly identity name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: valvesoftware.steam.steam
  - id: steam-wow6432-path
    desc: Steam Wow6432Node registry path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SOFTWARE\WOW6432Node\Valve\Steam
      section: rdata
  - id: steam-activeprocess-path
    desc: Steam ActiveProcess registry path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Software\Valve\Steam\ActiveProcess
      section: rdata
  - id: steam-shell-open-command
    desc: Steam shell open command path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: steam\Shell\Open\Command
      section: rdata
  - id: steam-run-uri
    desc: Steam run URI launch string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: steam://run/
      section: rdata
  - id: steam-install-exe-path
    desc: Steam executable install path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: C:\Program Files (x86)\Steam\steam.exe
      section: rdata
  - id: steam-backup-executable-name
    desc: Steam backup name text
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: steam.back
      section: rdata
  - id: steam-client-process-cluster
    desc: Steam error reporter process name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)^steamerrorreporter64?$
      section: rdata
composite_rules:
  - id: steam-client-launch-references
    desc: Steam client with launch-path references
    crit: notable
    conf: 0.96
    all:
      - id: steam-client-identity
    any:
      - id: steam-wow6432-path
      - id: steam-activeprocess-path
      - id: steam-shell-open-command
      - id: steam-run-uri
      - id: steam-install-exe-path
      - id: steam-backup-executable-name
      - id: steam-client-process-cluster
  - id: steam-api-exports
    desc: Steam API exports
    crit: notable
    conf: 0.95
    any:
      - id: steam-api-export-prefix
      - id: steam-export-prefix
      - id: steam-breakpad-export-prefix
  - id: valve-corp-binary
    desc: Valve-associated PE identity
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: metadata/vendor/string::valve-corp-string
      - id: metadata/signed/leaf::valve
      - id: metadata/signed/leaf::valve-corp.
      - id: metadata/signed/unknown::valve
      - id: metadata/signed/unknown::valve-corp.
      - id: well-known/game/steam::valve-vlv-integrity-header
      - id: micro-behaviors/os/registry/keys/product::steam-path-string
      - id: well-known/game/steam::steam-api-exports
      - id: well-known/game/steam::breakpad-steamid-export
      - id: well-known/game/steam::steam-error-reporter-path
      - id: well-known/game/steam::steam-product-name
      - id: metadata/binary/resource/identity::x64launcher-original-filename
      - id: well-known/game/steam::steam-exe-original-filename
      - id: well-known/game/steam::steamexe-pdb-basename
      - id: well-known/game/steam::steam-rel-client-pdb-path
      - id: metadata/vendor/string::non-valve-anticheat-string
      - id: steam-bootstrapper-manifest-description
      - id: steam-assembly-identity
  - id: valve-signed-steam-binary
    desc: Verified Valve-signed Steam binary identity
    crit: notable
    conf: 0.999
    all:
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/leaf::valve-corp.
  - id: steam-client-identity
    desc: Steam client build metadata identity
    crit: notable
    conf: 0.99
    all:
      - id: steam-product-name
      - id: steam-exe-original-filename
      - id: steamexe-pdb-basename
  # Renamed copies of steam.exe are common MalwareBazaar / ML false positives.
  # Require a verified Valve signature so copied version resources alone cannot
  # turn an impersonating PE into a trusted Steam identity.
  - id: renamed-steam-client
    desc: Valve-signed Steam client under non-Steam basename
    crit: notable
    conf: 0.99
    all:
      - id: steam-client-identity
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/leaf::valve-corp.
  # The overlay legs are not restated here: the vendor-agnostic
  # post-signature-overlay-append composite is the canonical matcher for
  # "bytes landed after the signing step", and this rule adds only the Steam
  # identity. Observed on redistributed clients carrying ~1 KB of inert
  # high-entropy padding past Valve's certificate table.
  - id: padded-renamed-steam-client
    desc: Renamed Valve-signed Steam with post-signing overlay
    crit: notable
    conf: 0.99
    all:
      - id: renamed-steam-client
      - id: metadata/binary/signing::post-signature-overlay-append
  - id: steam-bootstrapper-identity
    desc: Steam bootstrapper binary identity
    crit: notable
    conf: 0.99
    all:
      - id: steam-client-identity
      - id: steam-bootstrapper-export-family
  - id: steam-bootstrapper-manifest-identity
    desc: Steam bootstrapper manifest identity
    crit: notable
    conf: 0.99
    all:
      - id: steam-bootstrapper-manifest-description
      - id: steam-assembly-identity
