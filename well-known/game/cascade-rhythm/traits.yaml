# cascade-rhythm — glebmatz/cascade terminal rhythm game. Installer curl/iwr
# and checksum split are product distribution, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: crate-name
    desc: cascade-rhythm crate archive name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: cascade-rhythm

  - id: crate-repository
    desc: cascade-rhythm crate repository
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/glebmatz/cascade

  - id: cargo-package-name
    desc: cascade-rhythm Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: cascade-rhythm

  - id: github-repo
    desc: glebmatz cascade GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/glebmatz/cascade
