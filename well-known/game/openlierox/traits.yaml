# OpenLieroX — open-source Liero-like multiplayer game (worms are player
# characters, not malware). Dedicated-server Python scripts and IRC chat are
# part of the game, and their vocabulary FPs worm/C2 keyword rules.
defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, shell, text, rpm, tar, archives]
  crit: notable
  conf: 0.98

traits:
  - id: openlierox-source-path
    desc: OpenLieroX source tree path
    if:
      type: path
      regex: '(?i)(^|/)OpenLieroX(/|$)'

  - id: openlierox-product-name
    desc: OpenLieroX product name string
    if:
      type: text
      substr: OpenLieroX

  - id: openlierox-worm-player-class
    desc: OpenLieroX dedicated-control Worm player class
    for: [python]
    if:
      type: text
      regex: '(?m)^class\s+Worm\s*:'

  - id: openlierox-spec-name
    desc: OpenLieroX RPM spec Name field
    for: [text, shell]
    if:
      type: text
      regex: '(?m)^Name:\s*openlierox\b'

  - id: google-crash-tooling-path
    desc: Google breakpad or coredumper source path
    for: [c, cpp, objectivec, text, archives, tar, rpm]
    if:
      type: path
      regex: '(?i)linux_syscall_support\.h|coredumper|breakpad'

composite_rules:
  - id: openlierox-game
    desc: OpenLieroX Liero-like game package
    crit: notable
    conf: 0.99
    any:
      - id: openlierox-source-path
      - id: openlierox-spec-name
      - id: openlierox-worm-player-class
