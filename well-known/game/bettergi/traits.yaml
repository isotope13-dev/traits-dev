# BetterGI publishes a .NET apphost named BetterGI.exe whose version
# resource still names the managed assembly BetterGI.dll.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 1000000
  size_max: 250000000
traits:
  - id: bettergi-exe-basename
    desc: BetterGI application executable
    if:
      type: basename
      exact: BetterGI.exe
      case_insensitive: true
  - id: bettergi-dll-original-filename
    desc: BetterGI managed assembly name
    if:
      type: value
      path: pe.version.original_filename
      exact: BetterGI.dll
      case_insensitive: true
composite_rules:
  - id: bettergi-apphost-identity
    desc: BetterGI apphost names managed DLL
    crit: exception
    conf: 0.99
    all:
      - id: bettergi-exe-basename
      - id: bettergi-dll-original-filename
