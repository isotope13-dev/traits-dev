# Hello Minecraft! Launcher (HMCL) mod metadata database and components.
# HMCL is an open-source Minecraft launcher. Bundled distributions provide
# mod and modpack metadata catalogs scraped from mcmod.cn.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: hmcl-comment-header
    desc: Hello Minecraft! Launcher comment header
    crit: component
    conf: 0.99
    for: [text]
    if:
      type: text
      exact: '# Hello Minecraft! Launcher'

  - id: hmcl-author-email
    desc: HMCL author copyright email
    crit: component
    conf: 0.99
    for: [text]
    if:
      type: text
      substr: 'huanghongxun2008@126.com'

  - id: hmcl-launcher-script
    desc: Hello Minecraft! Launcher shell launcher script
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*_HMCL_OS='

composite_rules:
  - id: hmcl-mod-database
    desc: Hello Minecraft! Launcher mod metadata database
    crit: notable
    conf: 0.99
    for: [text]
    all:
      - id: hmcl-comment-header
      - id: hmcl-author-email
    near_lines: 5
