# Dalamud is an open-source Final Fantasy XIV mod framework.  Its boot
# component deliberately rewrites a suspended game's entry point and writes
# executable memory into that process; its crash handler briefly suspends
# game threads while collecting diagnostics.  The identity below is specific
# enough to exempt those expected source-level capabilities without treating
# generic game-mod or injector names as safe.
defaults:
  platforms: [windows, unix]
  conf: 0.99

traits:
  - id: dalamud-source-repository-path
    desc: Dalamud GitHub source repository path
    crit: baseline
    for: [source, archive, c, cpp, csharp]
    if:
      type: path
      regex: '(?i)goatcorp[\\/]dalamud@'

  - id: dalamud-loader-project-marker
    desc: Dalamud boot component source marker
    crit: component
    for: [c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\bDalamud\.Boot\b'

  - id: dalamud-crash-handler-marker
    desc: Dalamud crash handler source marker
    crit: component
    for: [c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\bDalamudCrashHandler\b'

  - id: dalamud-ffxiv-window-marker
    desc: Final Fantasy XIV game window marker
    crit: component
    for: [c, cpp, csharp]
    if:
      type: text
      word: FFXIVGAME

composite_rules:
  - id: dalamud-source-tree
    desc: Recognized Dalamud source tree
    crit: notable
    conf: 0.99
    for: [c, cpp, csharp]
    all:
      - id: dalamud-source-repository-path
    any:
      - id: dalamud-loader-project-marker
      - id: dalamud-crash-handler-marker
      - id: dalamud-ffxiv-window-marker
