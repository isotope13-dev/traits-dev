# Bethesda Game Studios Script Extender Plugin
#
# Detects native plugins for Bethesda script extenders (OBSE, FOSE, NVSE,
# SKSE, F4SE, SFSE, CSE) used by The Elder Scrolls and Fallout series.
#
# Plugins export *Plugin_Query and *Plugin_Load entry points. Cross-game
# compatibility plugins (such as NVAC - New Vegas Anti Crash) export multiple
# framework hooks that resolve to shared handlers, producing aliased export
# tables that reflect cross-engine compatibility rather than obfuscation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  size_min: 1024
  size_max: 33554432

traits:
  - id: plugin-query-export
    desc: Bethesda script extender Plugin_Query export
    conf: 0.98
    if:
      type: export
      regex: '^(OBSE|FOSE|NVSE|SKSE|F4SE|SFSE|CSE)Plugin_Query$'

  - id: plugin-load-export
    desc: Bethesda script extender Plugin_Load export
    conf: 0.98
    if:
      type: export
      regex: '^(OBSE|FOSE|NVSE|SKSE|F4SE|SFSE|CSE)Plugin_Load$'

composite_rules:
  - id: bethesda-script-extender-plugin
    desc: Bethesda script extender plugin
    conf: 0.98
    any:
      - id: plugin-query-export
      - id: plugin-load-export
