# Geode Loader is a Geometry Dash mod loader. Its Windows release contains
# an updater and a proxy DLL that legitimately use HTTP and Winsock.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  size_max: 100000000

traits:
  - id: product-name
    desc: PE version resource names Geode Loader
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Geode Loader

  - id: project-company
    desc: PE version resource names Geode Development Team
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Geode Development Team

  - id: repository-pdb-path
    desc: Geode repository build PDB path
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])work[\\/]geode[\\/]geode[\\/]bin[\\/]nightly[\\/]Geode\.pdb$'

composite_rules:
  - id: geode-loader-release-identity
    desc: Geode Loader Windows release identity
    conf: 0.99
    all:
      - id: product-name
      - id: project-company
      - id: repository-pdb-path
