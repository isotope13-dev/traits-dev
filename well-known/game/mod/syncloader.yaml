# SyncLoader is a Silkroad Online (vSRO / OldSRO / Silkroad-R) multi-client launcher
# and hook injector. It provides auto-login, SOCKS proxy routing, and client management
# by injecting hooks (SyncLoader.Hook.dll) into Silkroad client processes.
# It uses VMProtect and requires administrator privileges to inject into game processes.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 33554432

traits:
  - id: syncloader-brand
    desc: SyncLoader brand string marker
    crit: notable
    if:
      type: text
      section: rdata
      substr: 'SyncLoader'

  - id: syncloader-hook-dll
    desc: SyncLoader game hook DLL reference
    crit: notable
    if:
      type: text
      section: rdata
      substr: 'SyncLoader.Hook.dll'

  - id: silkroad-target-client
    desc: Silkroad Online game client executable target
    crit: notable
    if:
      type: text
      section: rdata
      regex: '\b(sro_client\.exe|SRO_MacroClient\.exe|Silkroad\.exe)\b'

  - id: silkroad-maxiguard-probe
    desc: MaxiGuard Silkroad anti-cheat probe marker
    crit: notable
    if:
      type: text
      section: rdata
      substr: 'MaxiGuard'

  - id: syncloader-login-proxy
    desc: SyncLoader login proxy component reference
    crit: notable
    if:
      type: text
      section: rdata
      substr: 'SyncLoader.LoginProxy.exe'

composite_rules:
  - id: syncloader-silkroad-loader
    desc: SyncLoader Silkroad Online multi-client launcher and hook injector
    crit: notable
    conf: 0.99
    all:
      - id: syncloader-brand
      - id: silkroad-target-client
    any:
      - id: syncloader-hook-dll
      - id: silkroad-maxiguard-probe
      - id: syncloader-login-proxy
