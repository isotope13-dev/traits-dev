# we-linux runs the Steam copy of Wallpaper Engine under Proton and loads
# weshim.dll into wallpaper64.exe so the Windows desktop host exists.
# https://github.com/zHappySnake/we-linux
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  crit: notable
  conf: 0.96

traits:
  - id: welaunch-usage
    desc: welaunch shim launcher usage line
    if:
      type: text
      substr: "welaunch.exe <shim.dll> <target.exe>"

  - id: welaunch-steam-track
    desc: Launcher waits so Steam tracks the game
    if:
      type: text
      substr: "Steam keeps tracking the game as running"

composite_rules:
  - id: we-linux-shim-launcher
    desc: Wallpaper Engine Linux shim launcher
    all:
      - id: welaunch-usage
      - id: welaunch-steam-track
