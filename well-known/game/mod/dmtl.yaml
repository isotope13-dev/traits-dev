# DMTL — Dead by Daylight mod manager (PyInstaller + Rust/PyO3 core).
#
# Ships Steamworks bindings and embeds the Source Engine A2S query label for
# legitimate Steam server discovery, not DDoS tooling.
defaults:
  platforms: [linux]
  for: [elf, so, tar, python]
  conf: 0.99
  size_max: 524288000

traits:
  - id: dmtl-core-module-name
    desc: DMTL core Python extension module name
    crit: notable
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      word: dmtl_core

  - id: dmtl-local-mods-parser
    desc: DMTL local mod parser export
    crit: notable
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      substr: parse_local_mods

  - id: dmtl-steam-appid-sidecar
    desc: DMTL Steam app id sidecar file
    crit: notable
    size_min: 1
    size_max: 64
    if:
      type: path
      basename: true
      exact: steam_appid.txt

composite_rules:
  - id: dmtl-linux-mod-tool
    desc: DMTL Dead by Daylight mod manager
    crit: notable
    needs: 2
    any:
      - id: dmtl-core-module-name
      - id: dmtl-local-mods-parser
      - id: dmtl-steam-appid-sidecar
