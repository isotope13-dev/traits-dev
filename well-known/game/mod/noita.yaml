# Noita game mod and tooling framework (Noita Entangled Worlds, NoitaPatcher)
# Open-source coop multiplayer mod and development tools for the Noita game engine.
# Injects instrumentation/hook DLLs into noita_back.exe/noita.exe to sync multiplayer state.
defaults:
  platforms: [windows, unix]
  conf: 0.98
  size_max: 52428800

traits:
  - id: noita-entangled-worlds-path
    desc: Noita Entangled Worlds repository path
    crit: baseline
    for: [cargo.toml, rust, source, text, markdown]
    if:
      type: path
      regex: '(?i)(^|[\\/])noita[-_]entangled[-_]worlds'

  - id: noita-game-executable
    desc: Noita game executable target reference
    crit: notable
    for: [rust, c, cpp]
    if:
      type: text
      regex: '(?i)\bnoita(_back)?\.exe\b'

  - id: noita-entangled-worlds-name
    desc: Noita Entangled Worlds project name
    crit: notable
    for: [cargo.toml, documents, text, markdown]
    if:
      type: text
      substr: 'Noita Entangled Worlds'

  - id: noita-patcher-dll
    desc: NoitaPatcher DLL component reference
    crit: notable
    for: [rust, pe, dll, c, cpp, text]
    if:
      type: text
      substr: 'noitapatcher.dll'

composite_rules:
  - id: noita-mod-context
    desc: Noita game mod development context
    crit: notable
    conf: 0.98
    for: [cargo.toml, rust, source, text, markdown]
    any:
      - id: noita-entangled-worlds-path
      - id: noita-entangled-worlds-name
      - id: noita-game-executable
      - id: noita-patcher-dll
