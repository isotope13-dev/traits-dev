# Minecraft client API identity.
#
# Fabric/Forge mods are compiled against intermediary-mapped Minecraft classes,
# so the client singleton class name appears in the constant pool of nearly
# every mod class that touches the game. That makes it an identity marker for
# "this class is Minecraft client code" and nothing more -- session theft,
# account forwarding and mod trojanization rules reference it for context and
# supply their own intent evidence.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.9

traits:
  - id: minecraft-client-class-ref
    desc: Minecraft client singleton class reference
    if:
      type: import
      exact: net/minecraft/class_310
