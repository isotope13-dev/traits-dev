# Minecraft client API identity.
#
# Fabric/Forge mods are compiled against intermediary-mapped Minecraft classes,
# so the client singleton class name appears in the constant pool of nearly
# every mod class that touches the game. That makes it an identity marker for
# "this class is Minecraft client code" and nothing more -- session theft,
# account forwarding and mod trojanization rules reference it for context and
# supply their own intent evidence.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.9

traits:
  - id: minecraft-client-class-ref
    desc: Minecraft client singleton class reference
    for: [class, java_class]
    if:
      type: import
      exact: net/minecraft/class_310

  - id: minecraft-session-ref
    desc: Minecraft session object reference
    for: [class, java_class]
    if:
      type: import
      exact: net/minecraft/class_320

  - id: minecraft-name-getter-ref
    desc: Minecraft profile name getter reference
    for: [class, java_class]
    if:
      type: import
      exact: net/minecraft/class_320.method_1676

  - id: minecraft-uuid-getter-ref
    desc: Minecraft profile UUID getter reference
    for: [class, java_class]
    if:
      type: import
      exact: net/minecraft/class_320.method_44717

  # Mojang-mapped releases expose the same client and session methods under
  # readable names instead of intermediary class_*/method_* symbols.
  - id: minecraft-named-access-token-getter
    desc: Mojang-mapped Minecraft access token getter
    for: [class, java_class]
    if:
      type: import
      exact: getAccessToken

  - id: minecraft-named-profile-id-getter
    desc: Mojang-mapped Minecraft profile UUID getter
    for: [class, java_class]
    if:
      type: import
      exact: getProfileId

  - id: minecraft-client-class-native-text
    desc: Native Minecraft client class string
    for: [pe, dll]
    size_min: 8192
    size_max: 8388608
    if:
      type: text
      section: .rdata
      exact: net/minecraft/class_310

  - id: minecraft-session-token-method-native-text
    desc: Native Minecraft token getter string
    for: [pe, dll]
    size_min: 8192
    size_max: 8388608
    if:
      type: text
      section: .rdata
      exact: method_1674

  - id: minecraft-profile-name-method-native-text
    desc: Native Minecraft profile name method
    crit: notable
    conf: 0.94
    for: [pe, dll]
    size_min: 8192
    size_max: 8388608
    if:
      type: text
      section: .rdata
      exact: method_1676

composite_rules:
  - id: minecraft-session-access
    desc: Minecraft session profile access
    conf: 0.91
    all:
      - id: minecraft-client-class-ref
      - id: minecraft-session-ref
      - id: minecraft-name-getter-ref

  - id: minecraft-named-session-access
    desc: Mojang-mapped Minecraft session profile access
    crit: notable
    all:
      - id: metadata/import/framework::minecraft-named-client-ref
      - id: metadata/import/framework::minecraft-named-user-ref
      - id: minecraft-named-profile-id-getter
