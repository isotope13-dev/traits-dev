# Touhou Community Reliant Automatic Patcher (thcrap) — open-source
# translation and modding framework for Touhou Project and Japanese PC games
# (https://github.com/thpatch/thcrap, https://github.com/nmlgc/thcrap).
# Injects DLLs into target game processes (CreateRemoteThread, LoadLibrary)
# and installs a custom exception handler (VEH) with debug register inspection
# for game crash reporting.
defaults:
  platforms: [windows, unix]
  conf: 0.99

traits:
  - id: thcrap-source-repository-path
    desc: thcrap GitHub source repository path
    crit: baseline
    for: [source, c, cpp]
    if:
      type: path
      regex: '(?i)(thpatch|nmlgc)[\\/]thcrap(@|[\\/])'

  - id: thcrap-header-include
    desc: thcrap header include
    crit: component
    for: [c, cpp]
    if:
      type: text
      regex: '#include\s+["<]thcrap\.h[">]'

  - id: thcrap-project-name
    desc: Touhou Community Reliant Automatic Patcher name
    crit: notable
    for: [c, cpp, text, markdown]
    if:
      type: text
      substr: 'Touhou Community Reliant Automatic Patcher'

composite_rules:
  - id: thcrap-source-tree
    desc: Recognized thcrap source tree
    crit: notable
    conf: 0.99
    for: [c, cpp]
    all:
      - id: thcrap-source-repository-path
    any:
      - id: thcrap-header-include
      - id: thcrap-project-name
