# UE4SS (Unreal Engine 4/5 Scripting System) game-mod loader.
# Its proxy DLL and runtime intentionally inspect PE modules and patch game
# memory to install Unreal hooks; that is the product's documented purpose.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1024
  size_max: 33554432

traits:
  - id: ue4ss-dll-basename
    desc: UE4SS mod-loader DLL basename
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: UE4SS.dll
      case_insensitive: true

  - id: ue4ss-repository-pdb-path
    desc: UE4SS repository build PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])RE-UE4SS[\\/]RE-UE4SS[\\/].*[\\/]UE4SS\.pdb$'

composite_rules:
  - id: ue4ss-mod-loader
    desc: UE4SS Unreal game-mod loader identity
    crit: notable
    conf: 0.99
    all:
      - id: ue4ss-dll-basename
      - id: ue4ss-repository-pdb-path
