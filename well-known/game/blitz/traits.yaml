# Blitz (Swift Media Entertainment, Inc.) — a commercial game-stats overlay and
# coaching client. Its per-game modules read game state with ReadProcessMemory
# (CS2, Deadlock), load overlay DLLs through a window-hook injector and poll
# hotkeys, so game-cheat and input-capture rules fire on them. Each module
# carries a verified vendor signature; this exception requires it.
defaults:
  for: [pe]
  platforms: [windows]
  size_min: 512
  size_max: 500000000

traits:
  - id: blitz-version-company
    desc: Blitz PE version company
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      regex: '^(Swift Media Entertainment|Blitz)'
  - id: blitz-vendor-string
    desc: Swift Media Entertainment vendor string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Swift Media Entertainment

composite_rules:
  - id: blitz-signed-game-module
    desc: Integrity-verified Blitz game overlay module
    crit: exception
    conf: 0.97
    all:
      - id: metadata/signature/verified/signer::swift-media-entertainment-inc.
      - id: metadata/signature/certificate/integrity::pe-signature-verified
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
    any:
      - id: blitz-version-company
      - id: blitz-vendor-string
