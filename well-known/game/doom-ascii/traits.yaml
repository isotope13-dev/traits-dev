defaults:
  platforms: [windows, unix]
  for: [python, tar, zip, gz, python-sdist]
  size_max: 10485760
traits:
  - id: doom-ascii-config
    desc: doom-ascii.cfg game config reference
    crit: baseline
    conf: 0.98
    if:
      type: text
      word: doom-ascii.cfg
  - id: doom-ascii-name
    desc: doom-ascii executable name reference
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: 'doom-ascii(_mac|_win(32|64)\.exe)?'
  - id: pip-doom-package-name
    desc: pip-doom PyPI package name
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: "name=['\"]pip-doom['\"]"
  - id: pip-doom-github-repo
    desc: HaoCuii pip-doom GitHub repository
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: github.com/HaoCuii/pip-doom
  - id: pip-doom-sdist-basename
    desc: pip-doom sdist archive basename
    crit: notable
    conf: 0.96
    for: [tar, zip, gz, python-sdist]
    if:
      type: basename
      regex: '(?i)^pip_doom-[0-9]+\.[0-9]+'
  - id: pip-doom-archive-basename
    desc: pip-doom distribution archive basename
    crit: notable
    conf: 0.95
    for: [tar, zip, gz, python-sdist]
    size_max: 100000000
    if:
      type: basename
      regex: '(?i)pip[-_]doom'
  - id: doom-ascii-win-exe-member
    desc: doom-ascii Windows executable archive member
    crit: notable
    conf: 0.97
    for: [tar, zip, gz, python-sdist]
    size_max: 100000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)doom-ascii_win(32|64)\.exe$'
composite_rules:
  - id: doom-ascii-specific
    desc: doom-ascii-specific identity marker
    crit: component
    any:
      - id: doom-ascii-name
      - id: doom-ascii-config
  - id: doom-ascii-payload
    desc: doom-ascii game payload markers
    crit: notable
    conf: 0.98
    needs: 2
    all:
      - id: doom-ascii-specific
    any:
      - id: doom-ascii-name
      - id: doom-ascii-config
      - id: pip-doom-package-name
      - id: pip-doom-sdist-basename
      - id: pip-doom-archive-basename
      - id: pip-doom-github-repo
      - id: doom-ascii-win-exe-member
      - id: well-known/game/doom::doom-wad-reference
      - id: well-known/game/doom::doom-iwad-argument
  - id: pip-doom-distribution-context
    desc: Identified pip-doom game archive
    crit: exception
    scope: outer
    size_max: 100000000
    all:
      - id: pip-doom-archive-basename
      - id: doom-ascii-win-exe-member

