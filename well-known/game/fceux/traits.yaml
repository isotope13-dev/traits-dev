# FCEUX — open-source NES/Famicom emulator (https://fceux.com).
defaults:
  platforms: [windows, unix]
  for: [binaries, c, cpp]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 50000000

traits:
  - id: fceux-manifest-identity
    desc: FCEUX emulator PE manifest identity
    platforms: [windows]
    for: [pe]
    size_min: 100000
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: FCEUX

  - id: fceux-window-class
    desc: FCEUX main window class name
    if:
      type: text
      substr: FCEUXWindowClass

  - id: fceux-savestate-filter
    desc: FCEUX save-state dialog filter string
    if:
      type: text
      substr: "FCEUX Save State (*.fc?)"
