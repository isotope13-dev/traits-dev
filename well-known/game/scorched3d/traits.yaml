# Scorched3D — artillery game based on Scorched Earth. Landscape BMPs are
# heightmaps, not npm exfil payloads. autom4te.cache is autoconf output.
defaults:
  platforms: [unix, windows]
  for: [rpm, tar, archives, text, desktop-entry, c, cpp, shell]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 120000000

traits:
  - id: product-name
    desc: Scorched3D product name string
    if:
      type: text
      substr: Scorched3D

  - id: spec-name
    desc: scorched3d RPM spec Name field
    for: [text]
    if:
      type: text
      regex: '(?m)^Name:\s*scorched3d\b'

  - id: data-path
    desc: Scorched3D game data directory path
    for: [javascript, data, rpm, tar, archives, text]
    if:
      type: path
      regex: '(?i)scorched/data'
