defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: roblox-company-versioninfo
    desc: Roblox Corporation version info company
    if:
      type: value
      path: pe.version.company
      exact: Roblox Corporation
  - id: roblox-bootstrapper-product-versioninfo
    desc: Roblox Bootstrapper product version info
    if:
      type: value
      path: pe.version.product_name
      exact: Roblox Bootstrapper
  - id: roblox-bootstrapper-original-filename
    desc: Roblox.exe original filename version info
    if:
      type: value
      path: pe.version.original_filename
      exact: Roblox.exe
  - id: roblox-studio-installer-pdb
    desc: RobloxStudioInstaller PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: RobloxStudioInstaller.pdb

composite_rules:
  # Build identity without a signer claim. The engine files the Roblox
  # signature chain as unverified, so metadata/signature/verified/ never
  # fires for this installer even though the signature validates. The
  # version strings and CodeView PDB name pair the build to Roblox's
  # Studio installer. Consumers downgrade rather than suppress, so the
  # finding stays reportable at notable.
  - id: roblox-studio-installer-identity
    crit: exception
    desc: Roblox Studio installer build identity
    all:
      - id: roblox-company-versioninfo
      - id: roblox-bootstrapper-product-versioninfo
      - id: roblox-bootstrapper-original-filename
      - id: roblox-studio-installer-pdb
