defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  size_max: 10000000

traits:
- id: plants-vs-zombies-name
  desc: Plants vs Zombies game name marker
  crit: component
  conf: 0.99
  if:
    type: text
    exact: Plants vs Zombies
    section: .text

- id: plants-vs-zombies-steam-target
  desc: Plants vs Zombies Steam store target
  crit: component
  conf: 0.99
  if:
    type: text
    exact: https://store.steampowered.com/app/3590/Plants_vs_Zombies_GOTY_Edition/
    section: .text

- id: pzlauncher-form-marker
  desc: pzLauncher game-launcher form marker
  crit: component
  conf: 0.98
  if:
    type: text
    exact: TgLauncherForm
    section: .text

- id: pzlauncher-product-name
  desc: pzLauncher PE product metadata
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    regex: '^\s*pzLauncher\s*$'

composite_rules:
- id: pzlauncher-game-launcher
  desc: Plants vs Zombies game launcher identity
  crit: notable
  conf: 0.99
  all:
  - id: plants-vs-zombies-name
  - id: plants-vs-zombies-steam-target
  - id: pzlauncher-form-marker

- id: pzlauncher-uninstaller
  desc: pzLauncher Inno Setup uninstaller identity
  crit: notable
  conf: 0.99
  all:
  - id: pzlauncher-product-name
  - id: metadata/binary/installer/family::inno-uninstaller-runtime

- id: pzlauncher
  desc: pzLauncher Plants vs Zombies game identity
  crit: notable
  conf: 0.99
  any:
  - id: pzlauncher-game-launcher
  - id: pzlauncher-uninstaller
