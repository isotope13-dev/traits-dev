defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 200000000

traits:
  - id: lust-loader-dialog-title
    desc: lust cheat dialog title
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rdata
      regex: '(?i)\blust\s+-\s+(Cannot start|Driver Error|Driver Blocked)\b'

  - id: lust-loader-support-ticket-copy
    desc: lust cheat support ticket prompt
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rdata
      substr: 'Open a support ticket and include the bracketed line below.'

  - id: lust-loader-cs2-launch-prompt
    desc: lust cheat CS2 launch prompt
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rdata
      substr: 'cs2 will open itself momentarily'

  - id: lust-loader-diagnostic-log-format
    desc: lust cheat diagnostic log format
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rdata
      substr: '[lust 0x'

  - id: lust-loader-vulnerable-driver-notice
    desc: lust cheat vulnerable driver notice
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rdata
      substr: "Microsoft's vulnerable driver blocklist is on. It refuses the signed driver lust uses"

composite_rules:
  - id: lust-cs2-cheat-loader
    desc: lust Counter-Strike 2 cheat loader
    crit: notable
    conf: 0.99
    all:
      - id: lust-loader-dialog-title
      - id: lust-loader-cs2-launch-prompt
    any:
      - id: lust-loader-support-ticket-copy
      - id: lust-loader-diagnostic-log-format
      - id: lust-loader-vulnerable-driver-notice
