# PKHeX is Project Pokemon's open-source Pokemon save editor. Its WinForms
# assembly uses the stock MyApplication.app manifest and legitimately combines
# resources, file export, and Process.Start helpers across a large GUI binary.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: product-name
    desc: PKHeX version product name
    if:
      type: value
      path: pe.version.product_name
      exact: PKHeX

  - id: project-pokemon-company
    desc: Project Pokemon version company name
    if:
      type: value
      path: pe.version.company
      exact: Project Pokémon

  - id: save-editor-comment
    desc: Pokemon Save Editor version comment
    if:
      type: value
      path: pe.version.comments
      exact: Pokémon Save Editor

composite_rules:
  - id: pkhex-save-editor
    desc: Recognized PKHeX Pokemon save editor
    all:
      - id: product-name
      - id: project-pokemon-company
      - id: save-editor-comment
