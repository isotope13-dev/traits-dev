defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 100000000
traits:
  - id: ultimate-gems-player-manifest
    desc: Ultimate Gems player launcher manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Ultimate.Gems.PlayerLauncher
  - id: ultimate-metin2-launcher-title
    desc: Ultimate Metin2 Gems launcher UI title
    if:
      type: text
      exact: Ultimate Metin2 Gems Launcher
      section: .text
composite_rules:
  - id: ultimate-gems-cloud-launcher
    desc: Ultimate Gems Cloud Metin2 game launcher
    all:
      - id: ultimate-gems-player-manifest
      - id: ultimate-metin2-launcher-title
