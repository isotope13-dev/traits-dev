# Generic Doom source-port vocabulary
# doom1.wad and the -iwad argument are shared by every Doom engine port,
# not specific to any single port.
defaults:
  platforms: [windows, unix]
  for: [python, gz, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio]
  crit: component
  conf: 0.9
  size_max: 10485760

traits:
  - id: doom-wad-reference
    crit: notable
    desc: doom1.wad game data reference
    for: [python, gz]
    if:
      type: text
      word: doom1.wad

  - id: doom-iwad-argument
    desc: Doom IWAD launch argument
    for: [python, gz]
    if:
      type: text
      exact: -iwad
