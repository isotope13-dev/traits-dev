# DMO Game Protection Service by DMO Security Solutions. These traits
# identify DMO Game Protection's anti-cheat components.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  conf: 0.99
  size_min: 512
  size_max: 500000000

traits:
  - id: dmo-game-protection-service
    desc: DMO Game Protection Service anti-cheat component
    if:
      type: value
      path: pe.version.description
      exact: DMO Game Protection Service
