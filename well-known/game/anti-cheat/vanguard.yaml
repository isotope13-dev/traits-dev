# Riot Vanguard, the kernel anti-cheat shipped with VALORANT and League of
# Legends. These traits identify Vanguard's own components and service API;
# they say nothing about whether the file cooperates with it or attacks it.
# Cheat loaders that tamper with Vanguard compose these identity atoms with
# the tamper evidence in well-known/game/cheat/, and legitimate game utilities
# (launchers, optimizers, compatibility checkers) reference the same names.
defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.99
  size_min: 512
  size_max: 500000000

traits:
  # The user-mode service and the kernel driver are two spellings of one
  # signal: "this file names a Riot Vanguard component".
  - id: vanguard-component-name
    desc: Riot Vanguard anti-cheat component name
    crit: notable
    if:
      type: text
      section: rdata
      regex: '(?i)\b(vgc\.exe|vgk\.sys)\b'

  - id: vanguard-gateway-endpoint
    desc: Riot Vanguard gateway API path
    crit: notable
    if:
      type: text
      section: rdata
      substr: /vanguard/v1/gateway
      case_insensitive: true
