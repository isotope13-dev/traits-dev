# @nzeros/codebreak — terminal Mastermind/code-breaking game.
# 1.2.0 ships small native C minimax solvers and a postinstall that only
# self-tests them and caches openings into vendor/engine.json (no network).
# OSV MAL-2026-13736 / feed FPs target 1.3.0, which replaced Linux vendor
# slots with opaque multi-MB Go binaries (see objectives/supply-chain/
# hidden-payload/staging/npm-vendor-go-swap.yaml).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: codebreak-package-name
    desc: "@nzeros/codebreak npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@nzeros/codebreak"

  - id: codebreak-mastermind-description
    desc: package.json Mastermind game description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)code-breaking game|Mastermind'

  - id: codebreak-skip-postinstall-env
    desc: CODEBREAK_SKIP_POSTINSTALL opt-out env
    for: [javascript]
    if:
      type: text
      substr: CODEBREAK_SKIP_POSTINSTALL

  - id: codebreak-solver-selftest-arg
    desc: Native solver selftest argv literal
    for: [javascript]
    if:
      type: text
      substr: "['selftest']"

  - id: codebreak-engine-manifest-path
    desc: vendor/engine.json hint-engine manifest
    for: [javascript]
    if:
      type: text
      substr: 'engine.json'

  - id: codebreak-solver-vendor-prefix
    desc: vendor/solver-<platform>-<arch> binary path
    for: [javascript]
    if:
      type: text
      regex: 'solver-\$\{process\.platform\}-\$\{process\.arch\}'

  # Shipped C source banner — proves the declared minimax engine source is
  # present alongside the tiny vendor binaries (absent in the 1.3.0 swap).
  - id: codebreak-solver-c-source-banner
    desc: codebreak native solver.c source banner
    for: [c]
    if:
      type: text
      substr: "codebreak's native hint engine"

composite_rules:
  - id: codebreak-hint-engine-postinstall
    desc: codebreak native hint-engine postinstall
    crit: notable
    conf: 0.98
    for: [javascript]
    all:
      - id: codebreak-skip-postinstall-env
      - id: codebreak-solver-selftest-arg
      - id: codebreak-engine-manifest-path
      - id: codebreak-solver-vendor-prefix

  - id: codebreak-package-identity
    desc: "@nzeros/codebreak package identity"
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: codebreak-package-name
      - id: codebreak-hint-engine-postinstall
      - id: codebreak-mastermind-description
