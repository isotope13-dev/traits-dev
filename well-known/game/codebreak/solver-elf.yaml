# Small static ELF hint solvers shipped with @nzeros/codebreak 1.2.x.
# size_max keeps the MAL-2026-13736 multi-MB Go replacements out of identity.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95
  size_min: 8192
  size_max: 131072

traits:
  - id: codebreak-solver-selftest-diag
    desc: Solver selftest board-table diagnostic
    if:
      type: text
      section: .rodata
      substr: "selftest: cannot build 4x8 tables"

  - id: codebreak-solver-usage-banner
    desc: Solver CLI usage lists selftest count hint
    if:
      type: text
      section: .rodata
      substr: "usage: solver <selftest|count|hint>"

  - id: codebreak-solver-vendor-basename
    desc: Basename is solver-linux-x64
    if:
      type: value
      path: file.basename
      exact: solver-linux-x64

composite_rules:
  - id: codebreak-small-c-solver-identity
    desc: Small codebreak C minimax solver ELF
    crit: notable
    conf: 0.97
    all:
      - id: codebreak-solver-vendor-basename
      - id: codebreak-solver-selftest-diag
      - id: codebreak-solver-usage-banner
