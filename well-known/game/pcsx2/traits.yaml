defaults:
  platforms: [unix, windows]
  for: [c, cpp, source, scripts, text]
  crit: notable
  conf: 0.98
  size_max: 2147483648

traits:
  - id: pcsx2-source-tree-path
    desc: PCSX2 emulator source tree path
    for: [c, cpp]
    if:
      type: path
      regex: '(?i)(^|[\\/])pcsx2[\\/]'

  - id: granite-util-logging-author
    desc: Granite graphics framework logging header author
    for: [c, cpp]
    if:
      type: text
      substr: "Hans-Kristian Arntzen"
