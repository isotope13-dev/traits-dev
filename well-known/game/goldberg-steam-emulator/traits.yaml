defaults:
  platforms: [windows]
  crit: notable
  conf: 0.99

traits:
  - id: steamclient-loader-member
    desc: Goldberg Steam client loader member
    for: [archive, tar, 7z, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)release[/\\]steamclient_experimental[/\\]steamclient_loader_x(86|64)\.exe$'

  - id: release-readme-member
    desc: Goldberg Steam Emulator release README member
    for: [archive, tar, 7z, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|[/\\])README\.release\.md$'

  - id: coldclient-config-member
    desc: Goldberg ColdClientLoader configuration member
    for: [archive, tar, 7z, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|[/\\])steamclient_experimental[/\\]ColdClientLoader\.ini$'

  - id: coldclient-ini
    desc: ColdClientLoader INI filename
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      exact: ColdClientLoader.ini
      section: .rdata

  - id: force-inject-steamclient
    desc: ColdClientLoader ForceInjectSteamClient option
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      exact: ForceInjectSteamClient
      section: .rdata

  - id: exe-command-line
    desc: ColdClientLoader executable command-line option
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      exact: ExeCommandLine
      section: .rdata

  - id: steamclient64-dll
    desc: ColdClientLoader 64-bit Steam client DLL option
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      exact: SteamClient64Dll
      section: .rdata

  - id: persistent-mode-launch
    desc: ColdClientLoader persistent Steam launch message
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      substr: persistent mode 2 got steam launch cmd
      section: .rdata

  - id: registry-entry-hkcu
    desc: ColdClientLoader HKCU registry message
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      exact: Created new registry entry (HKCU) for Steam
      section: .rdata

  - id: registry-entry-hklm
    desc: ColdClientLoader HKLM registry message
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      exact: Created new registry entry (HKLM) for Steam
      section: .rdata

  - id: registry-entry-hkcs
    desc: ColdClientLoader HKCS registry message
    for: [pe, dll]
    size_min: 100000
    size_max: 1000000
    if:
      type: text
      substr: Created new registry entry (HKCS)
      section: .rdata

  - id: overlay-product
    desc: GSE overlay renderer product metadata
    crit: component
    for: [pe, dll]
    size_min: 1000000
    size_max: 4000000
    if:
      type: value
      path: pe.version.product_name
      exact: GSE Overlay Renderer

  - id: overlay-original-filename
    desc: GSE overlay renderer original filename
    crit: component
    for: [pe, dll]
    size_min: 1000000
    size_max: 4000000
    if:
      type: value
      path: pe.version.original_filename
      exact: GameOverlayRenderer.dll

composite_rules:
  - id: release-archive
    desc: Goldberg Steam Emulator Windows release
    crit: notable
    scope: outer
    all:
      - id: steamclient-loader-member
      - id: coldclient-config-member

  - id: overlay-renderer
    desc: Goldberg GSE overlay renderer library
    crit: notable
    all:
      - id: overlay-product
      - id: overlay-original-filename

  - id: coldclient-config
    desc: ColdClientLoader Steam configuration keys
    crit: notable
    needs: 3
    any:
      - id: coldclient-ini
      - id: force-inject-steamclient
      - id: exe-command-line
      - id: steamclient64-dll
      - id: persistent-mode-launch

  - id: coldclient-registry-patch
    desc: ColdClientLoader Steam registry patching messages
    crit: notable
    needs: 2
    any:
      - id: registry-entry-hkcu
      - id: registry-entry-hklm
      - id: registry-entry-hkcs

  - id: steam-loader
    desc: Goldberg ColdClientLoader Steam injection component
    crit: notable
    all:
      - id: coldclient-config
      - id: coldclient-registry-patch
      - id: objectives/evasion/process/injection/toolkit::steam-registry-remote-injector
