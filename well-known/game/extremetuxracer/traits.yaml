# Extreme Tux Racer — Fedora src.rpm of the SFML arctic racing game.
# GNU autotools (configure, config.guess, install-sh) are upstream
# build scripts, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [rpm, tar, archives, text, c, cpp, shell]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 120000000

traits:
  - id: product-name
    desc: Extreme Tux Racer product name
    if:
      type: text
      substr: Extreme Tux Racer

  - id: spec-name
    desc: extremetuxracer RPM spec Name field
    for: [text]
    if:
      type: text
      regex: '(?m)^Name:\s*extremetuxracer\b'

  - id: source-path
    desc: Extreme Tux Racer source archive path
    if:
      type: path
      regex: '(?i)(^|[\\/])extremetuxracer'
