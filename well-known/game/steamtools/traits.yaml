defaults:
  platforms: [windows]
  for: [pe, csharp, rar, 7z, cpio]
  crit: notable
  conf: 0.96
  size_max: 2147483648

traits:
  - id: release-path
    desc: SteamTools release artifact
    if:
      type: path
      regex: '(?i)(SteamTools|Steam\+\+)[^\\/]*'
  - id: source-pdb
    desc: SteamTools source PDB path
    for: [pe]
    if:
      type: text
      regex: '(?i)(C:\\Repos\\SteamTools\\|[\\/]SteamTools[\\/])'
      section: rdata
  - id: vendor-company
    desc: SteamTools vendor company string
    for: [pe]
    if:
      type: text
      regex: '(长沙次元超越科技有限公司|江苏蒸汽凡星科技有限公司)'
      section: rdata
  # The publisher string also sits in the version resource, which lives in
  # .rsrc -- the rdata-scoped trait above never sees it. BD.Common.dll and the
  # other shared assemblies carry only that form, so without this the suite's
  # own libraries fell outside every SteamTools carve-out.
  - id: vendor-company-version-resource
    desc: SteamTools publisher in version resource
    for: [pe]
    if:
      type: value
      path: pe.version.company
      regex: '(长沙次元超越科技有限公司|江苏蒸汽凡星科技有限公司)'
  # The suite was renamed Steam++ -> Watt Toolkit; nothing above reads the
  # current product name.
  - id: watt-toolkit-product-name
    desc: Watt Toolkit product name
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      regex: '^Watt Toolkit'
  - id: accelerator-apphost
    desc: SteamTools accelerator apphost
    for: [pe]
    if:
      type: text
      substr: Steam++.Accelerator.dll
      section: rdata
  - id: accelerator-basename
    desc: SteamTools accelerator executable
    for: [pe]
    if:
      type: path
      regex: '(?i)(^|[\\/])Steam\+\+\.Accelerator\.exe$'
  - id: accelerator-embedded
    desc: SteamTools embedded accelerator assembly
    for: [pe]
    if:
      type: path
      regex: '(?i)Steam\.Accelerator\.dll@'
  - id: bd-steamclient-assembly
    desc: SteamTools Steam client assembly
    for: [pe]
    if:
      type: basename
      exact: BD.SteamClient.dll
  - id: wtts-client-assembly
    desc: SteamTools WTTS client assembly
    for: [pe]
    if:
      type: basename
      exact: BD.WTTS.Client.dll
  - id: wtts-avalonia-assembly
    desc: SteamTools WTTS Avalonia assembly
    for: [pe]
    if:
      type: basename
      exact: BD.WTTS.Client.Avalonia.dll
  - id: accelerator-plugin
    desc: SteamTools accelerator plugin assembly
    for: [pe]
    if:
      type: basename
      exact: BD.WTTS.Client.Plugins.Accelerator.dll
  - id: gamelist-plugin
    desc: SteamTools game list plugin assembly
    for: [pe]
    if:
      type: basename
      exact: BD.WTTS.Client.Plugins.GameList.dll
  - id: gameaccount-plugin
    desc: SteamTools game account plugin
    for: [pe]
    if:
      type: basename
      exact: BD.WTTS.Client.Plugins.GameAccount.dll

composite_rules:
  - id: member
    desc: SteamTools release member
    crit: notable
    conf: 0.96
    any:
      - id: release-path
      - id: source-pdb
      - id: vendor-company
      - id: vendor-company-version-resource
      - id: watt-toolkit-product-name
      - id: accelerator-apphost
      - id: accelerator-basename
      - id: accelerator-embedded
      - id: bd-steamclient-assembly
      - id: wtts-client-assembly
      - id: wtts-avalonia-assembly
      - id: accelerator-plugin
      - id: gamelist-plugin
      - id: gameaccount-plugin
