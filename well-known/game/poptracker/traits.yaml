# PopTracker — open-source randomizer progress tracker.
defaults:
  platforms: [unix, windows]
  for: [tar, archives, text, python, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  - id: github-repository
    desc: PopTracker GitHub repository URL
    if:
      type: text
      substr: github.com/black-sliver/PopTracker

  - id: product-name
    desc: PopTracker product name
    if:
      type: text
      substr: PopTracker

  - id: source-tree-path
    desc: PopTracker versioned source-tree path
    for: [text, python, markdown, c]
    if:
      type: path
      regex: '(?i)PopTracker-[0-9]'

  - id: release-key-tools-path
    desc: PopTracker release key tooling path
    for: [python, text]
    if:
      type: path
      regex: '(?i)contrib/key-tools/list_keys'

composite_rules:
  - id: poptracker-context
    desc: Official PopTracker randomizer tracker
    crit: notable
    conf: 0.99
    any:
      - id: github-repository
      - id: product-name
      - id: release-key-tools-path
      - id: source-tree-path

  - id: poptracker-source-archive-context
    desc: Recognized PopTracker source archive
    crit: exception
    conf: 0.995
    scope: outer
    for: [gz]
    all:
      - id: github-repository
      - id: release-key-tools-path
      - id: source-tree-path
