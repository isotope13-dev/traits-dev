# Amiberry — optimized Amiga emulator for Linux, macOS, and Windows (BlitterStudio/amiberry).
defaults:
  platforms: [unix, windows]
  for: [c, cpp, source, scripts, text]
  crit: notable
  conf: 0.99

traits:
  - id: amiberry-source-tree-path
    desc: Amiberry emulator source tree path
    for: [c, cpp, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])amiberry[-@_0-9.]*[\\/]'

  - id: amiberry-header-include
    desc: Amiberry emulator header include
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)#include\s+["'']amiberry'

  - id: amiberry-project-cmake
    desc: Amiberry project declaration in CMake
    for: [text]
    if:
      type: text
      regex: '(?i)project\s*\(\s*amiberry\b'

  - id: amiberry-updater-logging
    desc: Amiberry updater log message
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)write_log\s*\(\s*["'']Updater:'

  - id: amiberry-blitter-studio
    desc: Amiberry BlitterStudio repository reference
    for: [c, cpp, text, markdown]
    if:
      type: text
      substr: 'BlitterStudio/amiberry'

composite_rules:
  - id: amiberry-emulator-context
    desc: Recognized Amiberry emulator source context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: amiberry-source-tree-path
      - id: amiberry-header-include
      - id: amiberry-project-cmake
      - id: amiberry-updater-logging
      - id: amiberry-blitter-studio
