# Overwolf — the gaming overlay platform. Its client and the apps built on it
# ship the vendor string below; the platform reads browser profile data for
# its in-game overlays, so it is a standing false-positive producer for
# browser-credential and cookie-path rules, which reference this as context.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  size_min: 512
  size_max: 500000000
  # Names the vendor outright: identity, which TAXONOMY places at notable.
  crit: notable
traits:
  - id: overwolf-vendor-string
    desc: Overwolf Ltd vendor string
    if:
      type: text
      substr: Overwolf Ltd
