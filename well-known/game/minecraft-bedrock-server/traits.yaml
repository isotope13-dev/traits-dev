defaults:
  platforms: [unix]
  for: [elf]

traits:
- id: dedicated-server-mode-marker
  desc: Minecraft dedicated-server mode marker
  crit: notable
  conf: 0.99
  size_min: 100000000
  size_max: 500000000
  if:
    type: text
    section: .rodata
    exact: isDedicatedServer
- id: bedrock-scripting-runtime-marker
  desc: Minecraft Bedrock scripting runtime marker
  crit: notable
  conf: 0.99
  size_min: 100000000
  size_max: 500000000
  if:
    type: text
    section: .rodata
    word: ScriptModuleMinecraft
