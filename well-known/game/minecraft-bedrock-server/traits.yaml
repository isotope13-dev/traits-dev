defaults:
  platforms: [unix]
  for: [elf]

traits:
- id: dedicated-server-mode-marker
  desc: Minecraft dedicated-server mode marker
  crit: notable
  conf: 0.99
  size_min: 100000000
  size_max: 500000000
  if:
    type: text
    section: .rodata
    exact: isDedicatedServer
- id: bedrock-scripting-runtime-marker
  desc: Minecraft Bedrock scripting runtime marker
  crit: notable
  conf: 0.99
  size_min: 100000000
  size_max: 500000000
  if:
    type: text
    section: .rodata
    word: ScriptModuleMinecraft

composite_rules:
- id: minecraft-bedrock-server-context
  desc: Recognized Minecraft Bedrock dedicated server
  crit: exception
  conf: 1.0
  all:
  - id: dedicated-server-mode-marker
  - id: bedrock-scripting-runtime-marker
