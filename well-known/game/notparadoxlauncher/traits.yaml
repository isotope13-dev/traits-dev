defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]
  size_min: 100000
  size_max: 20000000

traits:
- id: notparadoxlauncher-product-name
  desc: Not Paradox Launcher product name
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: Not Paradox Launcher

- id: notparadoxlauncher-repository-url
  desc: Not Paradox Launcher GitHub repository URL
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: https://github.com/shusaura85/notparadoxlauncher
    section: .rsrc

composite_rules:
- id: notparadoxlauncher
  desc: Not Paradox Launcher bypass utility
  crit: notable
  conf: 0.99
  all:
  - id: notparadoxlauncher-product-name
  - id: metadata/lang/compiler/managed::delphi
