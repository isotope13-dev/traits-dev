# switchboard — TurnZero VS Code multi-agent orchestration extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: switchboard-vsix-name
    desc: Switchboard VSIX archive name
    if:
      type: path
      regex: '(?i)TurnZero\.switchboard'

  - id: switchboard-package-name
    desc: Switchboard extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"switchboard"'

  - id: switchboard-publisher
    desc: TurnZero VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"TurnZero"'

  - id: switchboard-command-namespace
    desc: Switchboard command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: switchboard.

composite_rules:
  - id: switchboard-vscode-extension
    desc: TurnZero Switchboard agent orchestration extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: switchboard-publisher
    any:
      - id: switchboard-vsix-name
      - id: switchboard-package-name
      - id: switchboard-command-namespace
