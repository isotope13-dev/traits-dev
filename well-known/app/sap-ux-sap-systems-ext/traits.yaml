# SAP open-ux-tools connection manager VS Code extension fork.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: sap-systems-vsix-name
    desc: SAP systems connection manager VSIX archive name
    if:
      type: path
      regex: '(?i)sap-ux-sap-systems-ext'

  - id: sap-systems-package-name
    desc: SAP systems connection manager package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"sap-ux-sap-systems-ext"'

  - id: sap-open-ux-tools-repo
    desc: SAP open-ux-tools upstream repository marker
    if:
      type: text
      substr: github.com/SAP/open-ux-tools

  - id: sap-systems-store-marker
    desc: SAP systems credential store runtime marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)@sap-ux/store|open-ux-tools-sap-systems'

composite_rules:
  - id: sap-ux-sap-systems-vscode-extension
    desc: SAP open-ux-tools connection manager VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: sap-systems-vsix-name
      - id: sap-systems-package-name
    all:
      - id: sap-open-ux-tools-repo
