# Andreani WooCommerce is the vendor's official WordPress shipping integration.
# Its API endpoint and encoded credential field are expected service plumbing.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-header
    desc: Andreani WooCommerce plugin header
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Andreani WooCommerce\s*$'

  - id: wordpress-plugin-uri
    desc: Andreani WordPress plugin URI
    if:
      type: text
      substr: https://wordpress.org/plugins/andreani-shipping

  - id: api-host
    desc: Andreani WooCommerce API host
    if:
      type: text
      substr: https://woocommerce-api-acom.andreani.com

  - id: shipping-method-namespace
    desc: Andreani shipping method namespace
    if:
      type: text
      substr: andreani_flexipaas

composite_rules:
  - id: andreani-woocommerce-plugin
    desc: Andreani official WooCommerce shipping plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-header
      - id: wordpress-plugin-uri
      - id: api-host
