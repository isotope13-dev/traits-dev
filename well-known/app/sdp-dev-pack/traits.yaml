# SDP Dev Pack — Baidu SDP platform developer VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: sdp-dev-pack-vsix-name
    desc: SDP Dev Pack VSIX archive name
    if:
      type: path
      regex: '(?i)sdp-dev-pack.*\.vsix$'

  - id: sdp-dev-pack-package-name
    desc: SDP Dev Pack extension package name
    crit: notable
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"sdp-dev-pack"'

  - id: baidusdp-publisher
    desc: baidusdp VS Code publisher marker
    crit: notable
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"baidusdp"'

  - id: sdp-agent-skills-command-namespace
    desc: SDP Agent Skills command namespace
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: sdpAgentSkills.

composite_rules:
  - id: sdp-dev-pack-vscode-extension
    desc: Baidu SDP Dev Pack developer VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: baidusdp-publisher
    any:
      - id: sdp-dev-pack-vsix-name
      - id: sdp-dev-pack-package-name
      - id: sdp-agent-skills-command-namespace
