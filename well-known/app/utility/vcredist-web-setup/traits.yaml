# VCRedistWebSetup is a signed Visual C++ redistributable downloader. It
# statically links MFC, whose generic UI, registry, and WinINet tables can look
# like policy changes or data collection when analyzed without call sites.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1048576

traits:
  - id: vcredist-web-setup-product
    desc: VCRedistWebSetup product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: VCRedistWebSetup
  - id: vcredist-web-setup-description
    desc: Visual C++ redistributable web setup metadata
    if:
      type: value
      path: pe.version.description
      exact: Microsoft Visual C++ redistributable web setup
  - id: vcredist-web-setup-original-name
    desc: VCRedistWebSetup original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: VCRedistWebSetup.exe
  - id: vcredist-web-setup-authenticode-signer
    desc: Alexey Nicolaychuk Authenticode signer identity
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Alexey Nicolaychuk,O=Alexey Nicolaychuk,'

composite_rules:
  - id: vcredist-web-setup-verified-binary
    desc: Verified VCRedistWebSetup Windows binary
    all:
      - id: vcredist-web-setup-product
      - id: vcredist-web-setup-description
      - id: vcredist-web-setup-original-name
      - id: vcredist-web-setup-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: vcredist-web-setup-benign-context
    desc: Verified VCRedistWebSetup application context
    crit: exception
    conf: 0.99
    all:
      - id: vcredist-web-setup-verified-binary
      - id: vcredist-web-setup-authenticode-signer
