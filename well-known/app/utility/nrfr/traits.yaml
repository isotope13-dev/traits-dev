# Nrfr changes the Android SIM country-code override through CarrierConfigLoader
# using Shizuku. Identity markers describe the specific app and implementation;
# they do not treat the privileged API or regional override as suspicious.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
  - id: application-package
    desc: Nrfr Android application package
    if:
      type: text
      substr: Lcom/github/nrfr/

  - id: sim-country-override-key
    desc: Android SIM country-code override key
    if:
      type: text
      exact: sim_country_iso_override_string

  - id: shizuku-binder-wrapper
    desc: Shizuku Binder wrapper for CarrierConfigLoader
    if:
      type: text
      substr: rikka/shizuku/ShizukuBinderWrapper

composite_rules:
  - id: nrfr-carrier-configuration-utility
    desc: Nrfr SIM country-code configuration utility
    for: [android_apk, zip, dex]
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: application-package
      - id: sim-country-override-key
      - id: shizuku-binder-wrapper
