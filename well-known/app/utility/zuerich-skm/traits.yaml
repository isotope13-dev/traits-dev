# Stadt Zürich SKM Pflegebeiträge billing workbooks. VBA and Excel
# external links to the municipality list are the form's data lookup.
defaults:
  platforms: [unix, windows]
  for: [ooxml]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 50000000

traits:
  - id: creator
    desc: Zürich SKM finance-controller creator
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: Daniel Suter, Leiter Finanzen & Controlling

  - id: last-modified-by
    desc: Zürich SKM last-modified-by name
    conf: 0.97
    if:
      type: value
      path: office.last_modified_by
      exact: Karin Gregis (sgdgrk)

  - id: billing-form-basename
    desc: Pflegebeiträge billing-form filename
    conf: 0.98
    if:
      type: path
      basename: true
      regex: 'Abrechnungsformular Pflegebeitraege'

  - id: skm-pflegebeitraege-host
    desc: Stadt Zürich SKM Pflegebeiträge URL
    conf: 0.98
    if:
      type: value
      path: office.external_relationships[*].target
      substr: stadt-zuerich.ch/SKM/Pflegebeitr
