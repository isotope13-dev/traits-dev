# NTLEA (NT Locale Emulator Advance) deliberately installs hooks and injects
# its locale component into a target process.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 2000000

traits:
  - id: ntlea-product
    desc: NTLEA product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: ntlea
      case_insensitive: true

  - id: ntlea-component-description
    desc: NTLEA loader or injection component metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^ntlea (inject|loader) component$'

  - id: ntlea-component-name
    desc: NTLEA native component filename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)^ntlea[dhijks][.](dll|exe)$'

  - id: ntlea-runtime-marker
    desc: NTLEA runtime diagnostic marker
    crit: notable
    conf: 0.99
    if:
      type: text
      section: ntlead
      exact: NTLEA internal exception

composite_rules:
  - id: ntlea-versioned-component-identity
    desc: Versioned NTLEA native component identity
    crit: notable
    conf: 0.99
    all:
      - id: ntlea-product
      - id: ntlea-component-description
      - id: ntlea-component-name

  - id: ntlea-hook-component-identity
    desc: NTLEA locale hook component identity
    crit: notable
    conf: 0.99
    all:
      - id: ntlea-runtime-marker
      - id: ntlea-component-name
      - id: micro-behaviors/os/sysinfo/platform/locale::get-thread-locale
