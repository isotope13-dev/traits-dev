# tboot is an Intel TXT measured-boot loader.  Its 32-bit static image is
# firmware-facing code and intentionally uses a writable/executable load
# layout while it relocates and protects the boot environment.
defaults:
  platforms: [linux]
  crit: notable
  conf: 0.99

traits:
  - id: tboot-rpm-package-name
    desc: tboot RPM package identity
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: tboot

  - id: intel-txt-launch-marker
    desc: Intel TXT measured-launch marker
    for: [elf]
    size_min: 100000
    if:
      type: text
      section: .rodata
      regex: '(?i)(GETSEC\[SENTER\]|Intel TXT|measured launch succeeded)'

  - id: tboot-tpm-policy-marker
    desc: tboot TPM launch-policy marker
    for: [elf]
    size_min: 100000
    if:
      type: text
      section: .rodata
      regex: '(?i)(Verified Launch Policy|tboot_shared data|TBOOT:)'

  - id: tboot-bootloader-path
    desc: tboot bootloader member path
    for: [binaries]
    size_min: 100000
    size_max: 40000000
    if:
      type: basename
      regex: '^tboot(\.gz)?$'

composite_rules:
  - id: tboot-bootloader-layout-context
    desc: tboot firmware-facing W+X layout
    crit: exception
    conf: 0.99
    for: [binaries]
    all:
      - id: intel-txt-launch-marker
      - id: tboot-tpm-policy-marker
      - id: tboot-bootloader-path
