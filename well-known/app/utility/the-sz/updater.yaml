# The SZ Development ships small Windows freeware (CPU Grab Ex, Trion, ...)
# with a shared self-updater: it queries update.php, downloads the new build
# and launches it, and its sandbox-aware UI names the WDAG utility account.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 50000000

traits:
  - id: the-sz-update-endpoint
    desc: The SZ shared update service endpoint
    if:
      type: text
      substr: http://www.the-sz.com/common/update.php?p=
      section: .data

composite_rules:
  - id: the-sz-freeware-context
    desc: The SZ Development freeware with updater
    crit: exception
    all:
      - id: well-known/app/utility/trion::trion-company
      - id: the-sz-update-endpoint
