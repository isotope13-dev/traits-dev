defaults:
  platforms: [windows]
  for: [csharp, archives]
  crit: baseline
  conf: 0.99

traits:
  - id: source-archive-context
    desc: Bulk Crap Uninstaller source archive context
    crit: notable
    conf: 0.99
    if:
      type: path
      substr: Bulk-Crap-Uninstaller
  - id: bcu-managed-product-name
    desc: Bulk Crap Uninstaller component product name
    crit: notable
    conf: 0.99
    for: [pe, dll]
    size_min: 65536
    size_max: 500000000
    if:
      type: value
      path: pe.version.product_name
      regex: '^(BCUninstaller|KlocTools|UninstallTools)$'
  - id: bcu-pdb-path-marker
    desc: Bulk Crap Uninstaller PDB path marker
    crit: notable
    conf: 0.99
    for: [pe, dll]
    size_min: 65536
    size_max: 500000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)BulkCrapUninstaller'

composite_rules:
  - id: bcu-managed-component-context
    desc: Bulk Crap Uninstaller managed component context
    crit: exception
    conf: 0.99
    for: [pe, dll]
    all:
      - id: bcu-managed-product-name
      - id: bcu-pdb-path-marker
