# cheat — command-line cheatsheet viewer (github.com/cheat/cheat).
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, text]
  crit: notable
  conf: 0.99

traits:
  - id: go-module-path
    desc: cheat Go module path
    for: [go.mod, text]
    if:
      type: text
      substr: 'module github.com/cheat/cheat'

  - id: vendored-path
    desc: cheat module source path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'github.com/cheat/cheat'

  - id: sheet-struct
    desc: cheat Sheet cheatsheet struct
    for: [go]
    if:
      type: text
      substr: 'CheatPath string'
