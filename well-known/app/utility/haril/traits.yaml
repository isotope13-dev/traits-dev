# Haril (@fasaled/haril) — Bun CLI that bundles Windows NTFS capture addons
# (x64/arm64) as base64 PE blobs inside dist/cli.js. The README documents
# this; it is not a concealed dropper stage.
defaults:
  platforms: [unix, windows]

traits:
  - id: haril-scoped-package-name-json
    desc: "@fasaled/haril package.json name field"
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@fasaled/haril"

  - id: haril-bun-engine-declared
    desc: Haril package declares Bun engine requirement
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: engines.bun
      exists: true

composite_rules:
  - id: haril-documented-native-addon-context
    desc: Haril CLI ships documented Windows capture PE blobs
    crit: exception
    conf: 0.97
    scope: archive
    any:
      - id: haril-scoped-package-name-json
      - id: haril-bun-engine-declared
