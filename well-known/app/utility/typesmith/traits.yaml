# Typesmith — terminal auto-typer for tutorial recording (Brad Traversy).
defaults:
  platforms: [unix]
  for: [python, whl, zip, archives, markdown, json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 5000000

traits:
  - id: typesmith-distribution-name
    desc: typesmith Python distribution name
    for: [json, markdown]
    if:
      type: text
      substr: 'Name: typesmith'

  - id: typesmith-module-path
    desc: typesmith.py module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)typesmith\.py$'

  - id: typesmith-console-entrypoint
    desc: typesmith console_scripts entry point
    for: [json, markdown, text]
    if:
      type: text
      substr: typesmith = typesmith:main

  - id: typesmith-github-repo
    desc: bradtraversy/typesmith GitHub repository
    for: [markdown, json]
    if:
      type: text
      substr: bradtraversy/typesmith

composite_rules:
  - id: typesmith-python-package
    desc: Typesmith terminal tutorial auto-typer CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: typesmith-distribution-name
      - id: typesmith-module-path
