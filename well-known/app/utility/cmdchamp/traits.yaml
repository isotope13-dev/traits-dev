# cmdchamp — single-file Bash CLI trainer (mellen9999/cmdchamp). Quiz answer
# banks intentionally contain reverse-shell, privesc, and recon command strings
# as graded solutions; identity traits supply benign context for those matches.
defaults:
  platforms: [unix]
  for: [shell, text, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: trainer-header
    desc: cmdchamp CLI trainer file header
    for: [shell]
    if:
      type: text
      substr: 'cmdchamp — CLI trainer'

  - id: certified-banner
    desc: cmdchamp certified completion banner
    for: [shell]
    if:
      type: text
      substr: 'CMDCHAMP CERTIFIED'

  - id: unicode-capability-env
    desc: cmdchamp unicode capability override env
    for: [shell]
    if:
      type: text
      substr: CMDCHAMP_UNICODE

  - id: ascii-capability-env
    desc: cmdchamp ascii capability override env
    for: [shell]
    if:
      type: text
      substr: CMDCHAMP_ASCII

  - id: xdg-data-directory
    desc: cmdchamp XDG data directory path
    for: [shell]
    if:
      type: text
      substr: '/.local/share}/cmdchamp'

  - id: upstream-repository
    desc: cmdchamp GitHub upstream repository
    if:
      type: text
      substr: github.com/mellen9999/cmdchamp

  - id: aur-pkgbase
    desc: cmdchamp AUR pkgbase identity
    for: [text, archives]
    if:
      type: text
      regex: '(?m)^pkgbase = cmdchamp$'

  - id: aur-pkgdesc
    desc: cmdchamp AUR trainer package description
    for: [text, archives]
    if:
      type: text
      substr: 'CLI trainer — 30 levels from ls to privilege escalation'

composite_rules:
  - id: cli-trainer-source-context
    desc: Recognized cmdchamp CLI trainer source context
    crit: exception
    conf: 0.99
    for: [shell]
    # Outer scope so quiz-referenced URL fetches (e.g. linpeas.sh) inherit the
    # trainer identity when folded into the same scan tree.
    scope: outer
    needs: 2
    any:
      - id: trainer-header
      - id: certified-banner
      - id: unicode-capability-env
      - id: ascii-capability-env
      - id: xdg-data-directory
      - id: upstream-repository
