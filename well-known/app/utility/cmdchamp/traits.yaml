# cmdchamp — single-file Bash CLI trainer (mellen9999/cmdchamp). Quiz answer
# banks intentionally contain reverse-shell, privesc, and recon command strings
# as graded solutions; identity traits supply benign context for those matches.
defaults:
  platforms: [unix]
  for: [shell, text, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: trainer-header
    desc: cmdchamp CLI trainer file header
    for: [shell]
    if:
      type: text
      substr: 'cmdchamp — CLI trainer'

  - id: certified-banner
    desc: cmdchamp certified completion banner
    for: [shell]
    if:
      type: text
      substr: 'CMDCHAMP CERTIFIED'

  - id: unicode-capability-env
    desc: cmdchamp unicode capability override env
    for: [shell]
    if:
      type: text
      substr: CMDCHAMP_UNICODE

  - id: ascii-capability-env
    desc: cmdchamp ascii capability override env
    for: [shell]
    if:
      type: text
      substr: CMDCHAMP_ASCII

  - id: xdg-data-directory
    desc: cmdchamp XDG data directory path
    for: [shell]
    if:
      type: text
      substr: '/.local/share}/cmdchamp'

  - id: question-bank-generator
    desc: cmdchamp shell lesson question bank
    for: [shell]
    count_min: 100
    if:
      type: text
      substr: 'questions+=('

  - id: upstream-repository
    desc: cmdchamp GitHub upstream repository
    if:
      type: text
      substr: github.com/mellen9999/cmdchamp

  - id: aur-pkgbase
    desc: cmdchamp AUR pkgbase identity
    for: [text, archives]
    if:
      type: text
      regex: '(?m)^pkgbase = cmdchamp$'

  - id: aur-pkgdesc
    desc: cmdchamp AUR trainer package description
    for: [text, archives]
    if:
      type: text
      substr: 'CLI trainer — 30 levels from ls to privilege escalation'

  - id: trainer-archive-member
    desc: cmdchamp trainer source archive member
    crit: notable
    conf: 0.99
    for: [archive]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)cmdchamp-[0-9][A-Za-z0-9._+-]*/cmdchamp$'

  - id: trainer-archive-readme
    desc: cmdchamp trainer archive README member
    crit: notable
    conf: 0.99
    for: [archive]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)cmdchamp-[0-9][A-Za-z0-9._+-]*/README\.md$'

composite_rules:
  - id: cli-trainer-source-context
    desc: Recognized cmdchamp CLI trainer source context
    crit: exception
    conf: 0.99
    for: [shell, python]
    # Keep the exception on the identified trainer file. Referenced or fetched
    # artifacts must be assessed independently.
    all:
      - id: question-bank-generator
    needs: 2
    any:
      - id: trainer-header
      - id: certified-banner
      - id: unicode-capability-env
      - id: ascii-capability-env
      - id: xdg-data-directory
      - id: upstream-repository

  - id: cli-trainer-archive-context
    desc: Recognized cmdchamp source archive context
    crit: exception
    conf: 0.99
    for: [archive]
    all:
      - id: trainer-archive-member
      - id: trainer-archive-readme
