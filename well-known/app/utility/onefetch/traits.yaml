# onefetch — command-line Git repository information tool (o2sh).
# Test git clone/hash-object fixtures and GitHub Actions wiki publish
# are product CI, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, text, markdown]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: rpm-name
    desc: rust-onefetch RPM package name
    for: [rpm]
    platforms: [linux]
    conf: 0.99
    if:
      type: value
      path: rpm.name
      exact: rust-onefetch

  - id: crate-name
    desc: onefetch crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: onefetch

  - id: crate-repository
    desc: onefetch crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/o2sh/onefetch

  - id: cargo-package-name
    desc: onefetch Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: onefetch

  - id: github-repo
    desc: o2sh onefetch GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/o2sh/onefetch
