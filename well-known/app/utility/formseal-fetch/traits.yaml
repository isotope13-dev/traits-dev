# formseal-fetch — CLI for fetching encrypted FormSeal submissions.
defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, archives, markdown, json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 5000000

traits:
  - id: formseal-fetch-distribution-name
    desc: formseal-fetch Python distribution name
    for: [json, markdown]
    if:
      type: text
      substr: 'Name: formseal-fetch'

  - id: fsf-console-entrypoint
    desc: fsf console_scripts entry point
    for: [json, markdown, text]
    if:
      type: text
      substr: fsf = cli.fsf:main

  - id: formseal-fetch-module-path
    desc: formseal_fetch cli package path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)cli/fsf\.py$'

  - id: cloudflare-kv-provider-module
    desc: FormSeal Cloudflare KV provider module
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)storage/kv\.py$'

composite_rules:
  - id: formseal-fetch-cli
    desc: FormSeal encrypted submission fetch CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: formseal-fetch-distribution-name
      - id: formseal-fetch-module-path
