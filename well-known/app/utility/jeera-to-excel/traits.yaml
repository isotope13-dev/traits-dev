# Jeera to Excel — VS Code extension exporting Jira tickets to Excel workbooks.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: jeera-package-name
    desc: Jeera to Excel extension package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jeera-to-excel

  - id: jeera-command-namespace
    desc: Jeera to Excel VS Code command namespace
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: jeeraToExcel.openPanel

  - id: jeera-github-repo
    desc: Jeera to Excel GitHub repository
    if:
      type: text
      substr: github.com/Same3rAijaz/jeera-to-excel

  - id: jeera-atlassian-api-token-field
    desc: Jeera Jira Atlassian API token field
    for: [javascript, typescript]
    if:
      type: text
      substr: Paste your Atlassian API token

composite_rules:
  - id: jeera-to-excel-extension-context
    desc: Recognized Jeera to Excel Jira export extension
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: jeera-package-name
    any:
      - id: jeera-command-namespace
      - id: jeera-github-repo
