defaults:
  platforms: [windows]
  for: [pe, dll, 7z]
  crit: component
  conf: 0.98
  size_max: 200000000
traits:
  - id: fastfetch-windows-archive
    crit: notable
    desc: fastfetch Windows archive
    if:
      type: path
      basename: true
      regex: '(?i)^fastfetch.*windows.*amd64.*\.7z$'
  - id: fastfetch-windows-executable
    crit: notable
    desc: fastfetch Windows executable
    if:
      type: path
      basename: true
      regex: '(?i)^f(ast|lash)fetch\.exe$'
      case_insensitive: true
  - id: fastfetch-vulkan-loader
    crit: notable
    desc: fastfetch bundled Vulkan loader
    if:
      type: path
      regex: '(?i)fastfetch.*vulkan-1\.dll$'
  - id: fastfetch-github-release-url
    crit: notable
    desc: fastfetch GitHub release download URL
    conf: 0.98
    platforms: [unix, windows]
    for: [python, shell, scripts, source, text]
    if:
      type: text
      substr: github.com/fastfetch-cli/fastfetch/releases
  - id: fastfetch-release-asset-name
    crit: notable
    desc: fastfetch release archive asset name
    conf: 0.95
    platforms: [unix, windows]
    for: [python, shell, scripts, source, text]
    if:
      type: text
      regex: 'fastfetch-(linux|macos|windows)-|fastfetch-macos-universal'
composite_rules:
  - id: fastfetch-windows-component
    desc: fastfetch Windows component
    any:
      - id: well-known/app/utility/fastfetch::fastfetch-vulkan-loader
      - id: well-known/app/utility/fastfetch::fastfetch-windows-archive
      - id: well-known/app/utility/fastfetch::fastfetch-windows-executable
  - id: fastfetch-bootstrap-installer-context
    desc: fastfetch release bootstrap installer context
    crit: exception
    conf: 0.95
    platforms: [unix, windows]
    for: [python]
    all:
      - id: fastfetch-github-release-url
      - id: fastfetch-release-asset-name
