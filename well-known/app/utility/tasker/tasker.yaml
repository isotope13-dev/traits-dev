# Tasker (net.dinglisch.android.taskerm, João Dias) and the standalone apps
# its App Factory builds. The compiled APK ships the whole automation engine:
# every action implementation (wallpaper, torch, volume, SMS, HTTP, dynamic
# loading) is the vendor's runtime, present in every export regardless of
# what the embedded project configures. Engine capability evidence therefore
# describes the vendor's product, not the app author's intent; the
# project's own data (assets/kid/data.xml) is what carries configured
# behavior. Downgrade composites use this context, not a suppression: the
# capability findings stay visible at their reduced tier.
defaults:
  platforms: [android]
  crit: notable

traits:
  - id: tasker-manifest-engine-components
    desc: Manifest lists Tasker engine components
    conf: 0.95
    for: [xml]
    if:
      type: value
      path: "android_xml.values[*].value"
      regex: '^net\.dinglisch\.android\.taskerm\.'

  - id: tasker-appfactory-project-xml
    desc: Tasker project export (TaskerData root element)
    conf: 0.95
    for: [xml]
    if:
      type: text
      substr: TaskerData

  - id: tasker-engine-dex-identity
    desc: DEX carries the Tasker engine classes
    conf: 0.9
    for: [dex]
    if:
      type: text
      substr: "Lnet/dinglisch/android/taskerm/"

composite_rules:
  - id: tasker-appfactory-engine-context
    desc: Tasker App Factory standalone automation app
    crit: exception
    conf: 0.95
    # The two identity legs live in different archive members (the manifest
    # and the project export); evaluation pools across the enclosing archive.
    scope: archive
    all:
      - id: tasker-manifest-engine-components
      - id: tasker-appfactory-project-xml
