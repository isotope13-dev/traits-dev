# PicoScope 7 oscilloscope suite components.
#
# Pico Technology ships Babel-obfuscated .NET assemblies (unsigned on Linux)
# whose protector checks .NET profiler environment variables and kills the
# process on tampering, while the interop layer combines OpenCV imaging
# primitives with IoC plugin dispatch. Profiler checks and dynamic
# assembly/resource loads there are protector and plugin behavior, and the
# pixel channel references are oscilloscope imaging — not steganography.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: pico-technology-company
    desc: Pico Technology Ltd. PE company metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: Pico Technology Ltd.

  - id: picoscope-build-path
    desc: PicoScope7 official build-farm path fragment
    crit: notable
    if:
      type: text
      substr: PicoScope7
      section: .text

composite_rules:
  - id: picoscope-suite-context
    desc: Recognized PicoScope suite component context
    crit: exception
    conf: 0.99
    any:
      - id: pico-technology-company
      - id: picoscope-build-path
