defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 52428800

traits:
  - id: startallback-basename
    desc: StartAllBack binary filename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)^StartAllBack(_.*_setup|[AX][0-9]{2})?\.(exe|dll)$'
  - id: startisback-installer-title
    desc: StartIsBack installer title
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: StartIsBack installation utility
      section: rdata
  - id: startisback-product-name
    desc: StartIsBack product version name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: StartIsBack
  - id: startallback-product-name
    desc: StartAllBack product version name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: StartAllBack
  - id: startisback-config-description
    desc: StartIsBack configuration utility description
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.description
      exact: StartIsBack configuration
  - id: startallback-file-description
    desc: StartAllBack file description
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.description
      exact: StartAllBack

composite_rules:
  - id: startallback-component
    desc: StartAllBack component
    crit: notable
    conf: 0.99
    any:
      - id: well-known/app/utility/startallback::startallback-basename
      - id: well-known/app/utility/startallback::startisback-installer-title
      - id: well-known/app/utility/startallback::startisback-product-name
      - id: well-known/app/utility/startallback::startallback-product-name
      - id: well-known/app/utility/startallback::startisback-config-description
      - id: well-known/app/utility/startallback::startallback-file-description
      - id: metadata/signed/leaf::ip-zinukhov-stanislav-igorevich
