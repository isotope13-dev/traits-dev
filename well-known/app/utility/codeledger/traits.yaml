# CodeLedger — MCP server for AI-agent code provenance and memory
# (github.com/codeledgerAI/codeledger).
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: CodeLedger PyPI wheel name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: codeledger_ai

  - id: github-repo
    desc: codeledgerAI GitHub repository
    if:
      type: text
      substr: github.com/codeledgerAI/codeledger

  - id: author-email
    desc: CodeLedgerAI contact email
    if:
      type: text
      substr: hello@codeledgerai.github.io

  - id: console-entry
    desc: codeledger console-script entry point
    for: [text]
    size_min: 16
    if:
      type: text
      substr: 'codeledger = backend.cli:main'

  - id: macos-launch-agent
    desc: CodeLedger macOS launch agent name
    for: [python]
    if:
      type: text
      substr: com.codeledger.server

  - id: encrypted-vault-path
    desc: CodeLedger encrypted vault path
    for: [python]
    if:
      type: text
      substr: ~/.codeledger/vault.enc

composite_rules:
  - id: codeledger-package
    desc: CodeLedger AI provenance MCP server
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: wheel-distribution
      - id: github-repo
      - id: author-email
      - id: console-entry
      - id: macos-launch-agent
      - id: encrypted-vault-path
