defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 524288

traits:
  - id: generic-bugreport-company
    desc: Bugreport company metadata
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: Bugreport

  - id: generic-bugreport-product
    desc: Bugreport product metadata
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: Bugreport

composite_rules:
  - id: legacy-mfc-bugreport-helper
    desc: Legacy UPX-packed MFC Bugreport helper
    crit: notable
    conf: 0.99
    all:
      - id: generic-bugreport-company
      - id: generic-bugreport-product
      - id: metadata/binary/framework::mfc-application-framework
      - id: metadata/binary/section/names::upx-section-pair
