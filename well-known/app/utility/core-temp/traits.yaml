defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.99
  size_min: 10240
  size_max: 50000000

traits:
  - id: core-temp-product-name
    desc: Core Temp product name metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)Core Temp'

  - id: core-temp-signer-certificate
    desc: Core Temp ALCPU code-signing certificate
    crit: notable
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=ALCPU'

composite_rules:
  - id: core-temp-identity
    desc: Verified Arthur Liberman Core Temp utility
    crit: notable
    all:
      - id: core-temp-product-name
      - id: core-temp-signer-certificate
