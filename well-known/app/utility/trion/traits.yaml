# Trion is a serial-terminal utility from The SZ Development. Its normal
# terminal/UI workflow uses clipboard, keyboard hooks, GDI capture primitives,
# and network update/reporting APIs; identify the product before those
# capability composites infer surveillance or exfiltration.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 50000000

traits:
  - id: trion-company
    desc: The SZ Development PE company identity
    if:
      type: value
      path: pe.version.company
      exact: the sz development
  - id: trion-product
    desc: Trion serial terminal PE product identity
    if:
      type: value
      path: pe.version.product_name
      exact: the sz development Trion

  - id: trion-terminal-description
    desc: Trion serial terminal product description
    if:
      type: value
      path: pe.version.description
      exact: Trion

  - id: trion-update-endpoint
    desc: Trion update service endpoint
    if:
      type: text
      section: .data
      substr: http://www.the-sz.com/common/update.php?p=trion

composite_rules:
  - id: trion-application-context
    desc: Recognized The SZ Trion application context
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/utility/trion::trion-company
      - id: well-known/app/utility/trion::trion-product
      - id: well-known/app/utility/trion::trion-terminal-description
      - id: well-known/app/utility/trion::trion-update-endpoint
