# ok-script — open-source Windows automation framework using computer vision,
# OCR, and synthetic input (pynput/pydirectinput) for game and app testing.
defaults:
  platforms: [windows]
  for: [python, whl, markdown, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: ok-script-wheel-package
    desc: ok-script family wheel package name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '^ok[_-]script'

  - id: ok-package-namespace
    desc: ok-script package module namespace
    for: [python]
    if:
      type: text
      substr: ok.util.logger

  - id: ok-github-homepage
    desc: ok-script GitHub repository
    if:
      type: text
      substr: github.com/ok-oldking/ok-script

  - id: ok-computer-vision-framework
    desc: ok-script automation framework marker
    if:
      type: text
      substr: Computer Vision for Python

composite_rules:
  - id: ok-script-framework-context
    desc: Recognized ok-script automation framework
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: ok-script-wheel-package
      - id: ok-package-namespace
