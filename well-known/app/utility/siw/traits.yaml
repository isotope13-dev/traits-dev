# Topala Software Solutions' System Information for Windows family.  SIW is a
# signed diagnostic utility whose hardware, registry, input, and crash-report
# support naturally contains strings shared with analysis heuristics.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: topala-company-marker
    desc: Topala Software Solutions product marker
    if:
      type: text
      substr: Topala Software Solutions
      section: rdata

  - id: siw-manifest-marker
    desc: System Information for Windows manifest marker
    if:
      type: text
      substr: TopalaSoftwareSolutions.SIW
      section: .rsrc

  - id: firefox-password-helper-marker
    desc: SIW Firefox Passwords Helper product marker
    if:
      type: text
      substr: Firefox Passwords Helper
      section: .rsrc

  - id: chrome-password-helper-marker
    desc: SIW Chrome Passwords Helper product marker
    if:
      type: text
      exact: Chrome Passwords Helper
      section: .rsrc

composite_rules:
  - id: siw-family-identity
    desc: Recognized SIW diagnostic utility context
    crit: exception
    conf: 0.99
    # The manifest name identifies the main SIW binaries; the Firefox helper
    # carries its own explicit product marker in the version resources.
    any:
      - id: siw-manifest-marker
      - id: firefox-password-helper-marker
