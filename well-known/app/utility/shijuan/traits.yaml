# shijuan — exam-system data management tool (试卷). Indexes papers in
# MySQL/Elasticsearch and converts BrickLink Studio / LDraw models via Blender.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 2000000

traits:
  - id: wheel-distribution
    desc: shijuan Python wheel distribution
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: shijuan

  - id: package-path
    desc: shijuan package path
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])shijuan[\\/]'

  - id: exam-summary
    desc: shijuan exam-system summary
    for: [pkginfo, text]
    conf: 0.98
    if:
      type: text
      substr: 考试系统数据管理工具
