# Cummins INSITE Update Manager's signed Windows service host.  The product
# legitimately carries .NET Reactor protection and Win32 interop declarations;
# the exception below is only used when the complete product identity is
# present with a verified Authenticode signature.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 16384
  size_max: 10485760

traits:
  - id: cummins-update-manager-product
    desc: Cummins INSITE Update Manager product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Cummins INSITE Update Manager

  - id: cummins-update-service-filename
    desc: Cummins UpdateService executable filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: UpdateService.exe
      case_insensitive: true

  - id: cummins-update-manager-company
    desc: Cummins Update Manager company metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Cummins Inc.

  - id: cummins-update-manager-signer
    desc: Cummins Inc. Authenticode signer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Cummins Inc\.,OU=EBU - Information Products,'

composite_rules:
  - id: cummins-insite-update-manager-identity
    desc: Verified Cummins INSITE Update Manager binary
    crit: notable
    conf: 0.99
    all:
      - id: cummins-update-manager-product
      - id: cummins-update-service-filename
      - id: cummins-update-manager-company
      - id: cummins-update-manager-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: cummins-insite-update-manager-context
    desc: Verified Cummins INSITE Update Manager context
    crit: exception
    conf: 0.99
    all:
      - id: cummins-insite-update-manager-identity
      - id: cummins-update-manager-signer
