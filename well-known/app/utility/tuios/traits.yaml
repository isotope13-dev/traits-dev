# TUIOS — Terminal UI Operating System, an open-source terminal window manager and multiplexer in Go.
defaults:
  platforms: [unix, windows]
  for: [go, shell, text, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree
    desc: TUIOS source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])tuios([\\/]|[-@_]|$)'

  - id: module-path
    desc: TUIOS Go module import path
    for: [go, go.mod]
    if:
      type: text
      substr: "github.com/Gaurav-Gosain/tuios"

  - id: doc-url
    desc: TUIOS documentation website reference
    if:
      type: text
      substr: "tuios.dev"

composite_rules:
  - id: tuios
    desc: TUIOS terminal window manager
    any:
      - id: source-tree
      - id: module-path
      - id: doc-url
