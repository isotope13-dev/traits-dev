defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 1.0

traits:
  - id: kitten-arch-release
    desc: Kitty kitten command from Arch
    size_min: 26137424
    size_max: 26137424
    if:
      type: yara
      source: |
        import "hash"

        rule kitten_arch_release {
          condition:
            // kitten from the signed Arch kitty 0.48.2-1 package.
            hash.sha256(0, filesize) ==
              "fb2846987a742a41a2878be47ccf8bef9a53482a9edd0898f401a4460964d93b"
        }
