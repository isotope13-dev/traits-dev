# mc-minder — Minecraft Fabric server management suite with RCON.
defaults:
  platforms: [windows, unix]
  for: [crate, rust, cargo.toml, tar, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: crate-name
    desc: mc-minder Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: mc-minder

  - id: github-repo
    desc: SharkMI-0x7E/mc-minder GitHub repository URL
    for: [cargo.toml, rust, markdown, text]
    if:
      type: text
      substr: SharkMI-0x7E/mc-minder

  - id: minecraft-fabric-description
    desc: Minecraft Fabric server management description
    for: [cargo.toml, rust, markdown]
    if:
      type: text
      substr: Minecraft Fabric servers

composite_rules:
  - id: mc-minder-crate
    desc: mc-minder Minecraft Fabric server manager crate
    crit: notable
    conf: 0.97
    any:
      - id: crate-name
      - id: github-repo
      - id: minecraft-fabric-description
