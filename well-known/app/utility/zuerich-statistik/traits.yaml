# Statistik Stadt Zürich open-data workbooks (e.g. BEV360QM1060
# naturalizations of the foreign population). Identity only.
defaults:
  platforms: [unix, windows]
  for: [ooxml]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 50000000

traits:
  - id: creator
    desc: Statistik Stadt Zürich document creator
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: Statistik Stadt Zürich

  - id: naturalization-title
    desc: Zürich foreign-naturalization workbook title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Einbürgerungen der ausländischen Bevölkerung

  - id: dataset-id
    desc: Zürich BEV360QM1060 dataset identifier
    conf: 0.97
    if:
      type: path
      basename: true
      regex: 'BEV360QM1060'
