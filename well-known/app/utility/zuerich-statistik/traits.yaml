# Statistik Stadt Zürich open-data workbooks (e.g. BEV360QM1060
# naturalizations of the foreign population). Identity only.
defaults:
  platforms: [unix, windows]
  for: [ooxml]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 50000000

traits:
  - id: creator
    desc: Statistik Stadt Zürich document creator
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: Statistik Stadt Zürich

  - id: naturalization-title
    desc: Zürich foreign-naturalization workbook title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Einbürgerungen der ausländischen Bevölkerung

  - id: population-nationality-title
    desc: Zürich population-by-nationality title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Bevölkerungsbestand nach Nationalität

  - id: population-age-origin-title
    desc: Zürich population age-gender-origin title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Bevölkerungsbestand nach Alter, Geschlecht und Herkunft

  - id: relocation-title
    desc: Zürich residential-moves workbook title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Umzüge

  - id: zik-cpi-title
    desc: Zürich consumer-price index workbook title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Zürcher Index der Konsumentenpreise, Basis Dezember 2015, Detailresultate, Monatswerte

  - id: dataset-id
    desc: Zürich BEV dataset identifier
    conf: 0.97
    if:
      type: path
      basename: true
      regex: 'BEV[0-9]+QM[0-9]+'

  - id: dataset-id-pre
    desc: Zürich PRE dataset identifier
    conf: 0.97
    if:
      type: path
      basename: true
      regex: 'PRE[0-9]+T[0-9]+U'
