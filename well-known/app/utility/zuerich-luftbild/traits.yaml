# Stadt Zürich MFO-West aerial perimeter JPEGs (Luftbild Perimeters).
# Clean JFIF with municipal EXIF is GIS source imagery, not a polyglot.
defaults:
  platforms: [unix, windows]
  for: [jpeg]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: exif-artist
    desc: Stadt Zürich FD Luftbild EXIF artist
    conf: 0.99
    if:
      type: value
      path: jpeg.exif.artist
      exact: Fingerhuth Catharina (FD)

  - id: luftbild-perimeters-caption
    desc: Luftbild Perimeters Stadt Zürich caption
    conf: 0.98
    if:
      type: text
      substr: 'Luftbild Perimeters (Stadt'

  - id: mfo-west-basename
    desc: MFO-West Luftbild JPEG basename
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)^MFO-West-Luftbild'
