# Das U-Boot is the bootloader for most ARM/RISC-V embedded boards. It starts
# executing before the MMU and page tables exist, so it cannot separate its
# executable text from its writable data: every board image is a single RWE
# LOAD segment holding .text, .rodata, .data and .bss together, with the entry
# point inside it. That is the same firmware-facing layout tboot has, and it
# reads as entry-in-writable-segment plus W+X to the packer objectives.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.99

traits:
  - id: uboot-version-banner
    desc: U-Boot release banner
    for: [elf]
    size_min: 20000
    if:
      type: text
      section: .rodata
      regex: 'U-Boot 20[0-9]{2}\.[0-9]{2}'

  - id: uboot-image-basename
    desc: U-Boot board image basename
    for: [binaries]
    size_min: 20000
    size_max: 40000000
    if:
      type: basename
      regex: '^u-?boot(-spl)?\.(elf|bin)$'

composite_rules:
  - id: uboot-bootloader-layout-context
    desc: U-Boot firmware-facing W+X layout
    crit: exception
    conf: 0.99
    for: [binaries]
    all:
      - id: uboot-version-banner
      - id: uboot-image-basename
