# Sweep Cache Cleaner (com.cachesweeper.file.guarder) — ad-supported
# Android cache/storage cleaner distributed as an XAPK split bundle.
defaults:
  platforms: [android, unix]
  for: [apk, zip]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 80000000

traits:
  - id: android-package-name
    desc: CacheSweeper Android package name
    for: [apk, zip, dex]
    if:
      type: text
      substr: com.cachesweeper.file.guarder

  - id: android-package-alias
    desc: CacheSweeper collapsed package alias
    for: [apk, zip, dex]
    if:
      type: text
      substr: com.cachesweeper.fileguarder

  - id: android-package-utf16
    desc: CacheSweeper UTF-16 package name
    if:
      type: hex
      pattern: 63 00 6F 00 6D 00 2E 00 63 00 61 00 63 00 68 00 65 00 73 00 77 00 65 00 65 00 70 00 65 00 72 00 2E 00 66 00 69 00 6C 00 65 00 2E 00 67 00 75 00 61 00 72 00 64 00 65 00 72 00

  - id: display-name
    desc: Sweep Cache Cleaner display name
    if:
      type: hex
      pattern: 53 77 65 65 70 20 43 61 63 68 65 20 43 6C 65 61 6E 65 72

  - id: firebase-storage-host
    desc: Clean-sweeper Firebase storage host
    if:
      type: hex
      pattern: 63 6C 65 61 6E 2D 73 77 65 65 70 65 72 2E 66 69 72 65 62 61 73 65 73 74 6F 72 61 67 65 2E 61 70 70

  - id: xapk-package-id
    desc: CacheSweeper XAPK package identifier
    for: [zip]
    if:
      type: text
      substr: '"package_name":"com.cachesweeper.file.guarder"'

  - id: base-apk-member
    desc: CacheSweeper base APK member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      exact: com.cachesweeper.file.guarder.apk

composite_rules:
  - id: cachesweeper-app
    desc: Sweep Cache Cleaner application
    conf: 0.995
    scope: outer
    all:
      - id: display-name
      - id: firebase-storage-host
      - id: android-package-utf16

  - id: cachesweeper-dex
    desc: CacheSweeper DEX package identity
    conf: 0.99
    for: [dex]
    all:
      - id: android-package-name
      - id: android-package-alias

