# VOVSOFT product identities recorded in PE version metadata.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 100000000
traits:
  - id: vovsoft-company
    desc: VOVSOFT PE company identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.version.company
      exact: VOVSOFT
  - id: ai-requester-product
    desc: VOVSOFT AI Requester product identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.version.product_name
      exact: AI Requester
  - id: filename-lister-product
    desc: VOVSOFT Filename Lister product identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.version.product_name
      exact: Filename Lister

composite_rules:
  - id: ai-requester-known-app-context
    desc: VOVSOFT AI Requester version identity
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/utility/vovsoft::vovsoft-company
      - id: well-known/app/utility/vovsoft::ai-requester-product
  - id: filename-lister-known-app-context
    desc: VOVSOFT Filename Lister version identity
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/utility/vovsoft::vovsoft-company
      - id: well-known/app/utility/vovsoft::filename-lister-product
