# bernardopg/full-upgrade — Arch Linux upgrade/maintenance orchestrator.
# Optional tray autostart writes its own .desktop under XDG autostart; that is
# product UX, not third-party persistence.
defaults:
  platforms: [unix]
  for: [shell, markdown, text]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: github-repo-url
    desc: full-upgrade GitHub repository URL
    if:
      type: text
      substr: github.com/bernardopg/full-upgrade

  - id: tray-module-banner
    desc: full-upgrade tray module banner comment
    for: [shell]
    if:
      type: text
      substr: 'lib/tray.sh — daemon do systray'

  - id: source-tree-path
    desc: full-upgrade source tree path
    if:
      type: path
      regex: '(^|[/\\])full-upgrade(-[0-9]|[/\\])'

composite_rules:
  - id: full-upgrade-context
    desc: Recognized bernardopg/full-upgrade source tree
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: github-repo-url
      - id: tray-module-banner
      - id: source-tree-path
