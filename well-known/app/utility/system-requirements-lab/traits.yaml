# System Requirements Lab Detection, the signed Husdawg hardware-check utility.
# The product marker and signer are combined so a copied VERSIONINFO string does
# not create a benign context by itself.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1048576

traits:
  - id: srl-product-metadata
    desc: System Requirements Lab product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '^System Requirements Lab Detection$'
  - id: srl-authenticode-signer
    desc: Husdawg, LLC Authenticode signer identity
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Husdawg.*O=Husdawg.*$'

composite_rules:
  - id: srl-verified-binary
    desc: Verified System Requirements Lab Detection binary
    all:
      - id: srl-product-metadata
      - id: srl-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  - id: srl-benign-utility-context
    desc: Verified System Requirements Lab context
    crit: exception
    conf: 0.99
    all:
      - id: srl-verified-binary
      - id: srl-authenticode-signer
