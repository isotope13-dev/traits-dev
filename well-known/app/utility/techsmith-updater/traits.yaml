# TechSmith's signed desktop updater. The updater deliberately downloads and
# launches product installers, so those capabilities are expected in this
# verified product context rather than evidence of hostile execution.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 16384
  size_max: 10485760

traits:
  - id: techsmith-updater-product
    desc: TechSmith Updater product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: TechSmith Updater

  - id: techsmith-updater-original-filename
    desc: TechSmith updater original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: TSCUpdClt.exe
      case_insensitive: true

  - id: techsmith-updater-company
    desc: TechSmith updater company metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: TechSmith Corporation

  - id: techsmith-updater-authenticode-signer
    desc: TechSmith updater Authenticode signer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=TechSmith Corporation,O=TechSmith Corporation,'

composite_rules:
  - id: techsmith-updater-identity
    desc: Verified TechSmith updater identity
    crit: notable
    conf: 0.99
    all:
      - id: techsmith-updater-product
      - id: techsmith-updater-original-filename
      - id: techsmith-updater-company
      - id: techsmith-updater-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: techsmith-updater-benign-context
    desc: Verified TechSmith updater context
    crit: exception
    conf: 0.99
    all:
      - id: techsmith-updater-identity
      - id: techsmith-updater-authenticode-signer
