# Yodot Recovery Software (Versacor Offshore Software, the parent of Remo
# Software). Its license and recovery binaries ship under a commercial
# protector (cloned RWX sections, high-entropy code), and its bundled
# Sunisoft IncUpdate updater carries a large signed overlay. All are
# EV-signed by Versacor.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 10000
  size_max: 268435456

traits:
  - id: yodot-version-identity
    desc: VERSIONINFO names Yodot Software
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.copyright
      regex: '^© Copyright +Yodot Software\b'

  - id: incupdate-version-identity
    desc: VERSIONINFO names Sunisoft IncUpdate
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: IncUpdate

composite_rules:
  - id: versacor-signed-yodot-component
    desc: Versacor-signed Yodot Recovery component
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signature/verified/signer::versacor-offshore-software-private-limited
    any:
      - id: yodot-version-identity
      - id: incupdate-version-identity
