defaults:
  platforms: [unix]
  for: [elf]
traits:
- id: nnn-icons-static-basename
  desc: nnn icons static basename
  crit: notable
  conf: 0.95
  size_min: 100000
  size_max: 2000000
  if:
    type: basename
    exact: nnn-icons-static

- id: nnn-musl-static-basename
  desc: nnn v5.2 musl static release basename
  crit: notable
  conf: 0.99
  size_min: 207088
  size_max: 207088
  if:
    type: basename
    exact: nnn-musl-static

- id: nnn-upstream-repository-marker
  desc: nnn upstream repository marker
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 1000000
  if:
    type: text
    section: .rodata
    substr: https://github.com/jarun/nnn

- id: nnn-file-manager-help-interface
  desc: nnn file-manager help interface
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 1000000
  if:
    type: text
    section: .rodata
    substr: '%s: nnn [OPTIONS] [PATH]'

- id: nnn-v5-2-musl-archive-basename
  desc: nnn v5.2 musl release archive basename
  crit: notable
  conf: 0.99
  for: [tar]
  size_min: 204997
  size_max: 204997
  if:
    type: basename
    exact: jarun-nnn-v5.2-nnn-musl-static-5.2.x86_64.tar.gz

composite_rules:
- id: nnn-musl-static-release-context
  desc: nnn v5.2 musl static payload context
  crit: exception
  conf: 0.995
  all:
    - id: nnn-musl-static-basename
    - id: micro-behaviors/os/syscall/raw::x64-mmap-syscall-sectionless
    - id: micro-behaviors/os/syscall/raw::x64-mprotect-syscall-sectionless
