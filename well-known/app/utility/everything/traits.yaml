# Everything is the voidtools Windows filename search utility. Keep the raw
# version-resource strings separate from the verified identity so copied
# branding alone is not treated as an authentic application context.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  size_min: 100000
  size_max: 20000000

traits:
  - id: product-name
    desc: PE claims the Everything product name
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      exact: Everything

  - id: setup-description
    desc: PE claims the Everything Setup description
    conf: 0.9
    if:
      type: value
      path: pe.version.description
      exact: Everything Setup

  - id: application-description
    desc: PE claims the Everything application description
    conf: 0.9
    if:
      type: value
      path: pe.version.description
      exact: Everything

composite_rules:
  - id: verified-everything-setup-identity
    desc: Everything Setup identity signed by voidtools
    conf: 0.99
    all:
      - id: product-name
      - id: setup-description
      - id: metadata/signed/leaf::voidtools-pty-ltd

  - id: verified-everything-app-identity
    desc: Everything application identity signed by voidtools
    conf: 0.99
    all:
      - id: product-name
      - id: application-description
      - id: metadata/signed/leaf::voidtools-pty-ltd
