# @sma1lboy/rove — Terminal multiplexer for AI coding agents (github.com/Sma1lboy/rove).
# rove skill install wraps npx skills add for user-invoked agent skill installation.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Rove npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@sma1lboy/rove'

  - id: npm-package-name
    desc: Rove npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@sma1lboy/rove'

  - id: repository-url
    desc: Official Rove GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/Sma1lboy/rove(\.git)?$'

  - id: npm-repository-url
    desc: Rove npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/Sma1lboy/rove(\.git)?$'

  - id: upstream-repository-text
    desc: Rove upstream repository reference
    for: [javascript, typescript, markdown, text, shell]
    if:
      type: text
      substr: github.com/Sma1lboy/rove

  - id: multiplexer-product-description
    desc: Rove agent multiplexer product description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)agent multiplexer'

composite_rules:
  - id: official-package-identity
    desc: Rove package identity
    crit: notable
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Rove repository identity
    crit: notable
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: upstream-repository-text

  - id: archive-context
    desc: Rove coding agent multiplexer archive context
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: multiplexer-product-description
