# Iris — versenilvis shell autocomplete with AI suggestions (reads history
# for fuzzy matching; not credential theft).
defaults:
  platforms: [unix, windows]
  for: [elf, pe, dll, tar, archives, gz]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-module-path
    desc: versenilvis iris Go module path
    if:
      type: text
      substr: github.com/versenilvis/iris

  - id: ai-suggestion-marker
    desc: Iris AI suggestion feature marker
    if:
      type: text
      substr: ai suggestion

  - id: bash-history-read-marker
    desc: Bash history file read reference
    if:
      type: text
      substr: .bash_history

composite_rules:
  - id: iris-autocomplete-context
    desc: Iris shell autocomplete reads history for suggestions
    crit: exception
    conf: 0.99
    all:
      - id: github-module-path
    any:
      - id: ai-suggestion-marker
      - id: bash-history-read-marker
