defaults:
  platforms: [unix]
  for: [source, scripts, c, shell, kotlin, documents, tar]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 300000000

traits:
  - id: dmesg-basename
    desc: dmesg executable basename
    crit: notable
    for: [elf]
    if:
      type: basename
      exact: dmesg

  - id: util-linux-unshare-summary
    desc: util-linux unshare program summary
    crit: notable
    conf: 0.97
    for: [elf]
    if:
      type: text
      substr: 'Run a program with some namespaces unshared from the parent.'
      section: rodata

  - id: libmount-source-unit
    desc: libmount compilation unit path
    crit: notable
    conf: 0.97
    for: [elf]
    if:
      type: text
      substr: libmount/src/
      section: rodata

  - id: libmount-mount-action-marker
    desc: libmount mount-action assertion string
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: text
      substr: MNT_ACT_MOUNT
      section: rodata

  - id: libmount-utab-path
    desc: libmount userspace mount table path
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: text
      substr: /run/mount/utab
      section: rodata

  - id: util-linux-source-tree-path
    desc: util-linux source tree path
    if:
      type: path
      regex: 'util-linux((@v?|-)[0-9][^\\/]*|[\\/])'

  - id: resizepart-man-basename
    desc: resizepart section-8 man page name
    for: [gz]
    if:
      type: basename
      regex: '(?i)^resizepart\.8(\.gz)?$'

  - id: resizepart-man-title
    desc: util-linux resizepart man page title
    for: [text, documents]
    if:
      type: text
      substr: '.TH "RESIZEPART" "8"'

  - id: util-linux-translation-path
    desc: util-linux translation file
    for: [kotlin, text, documents]
    if:
      type: path
      regex: 'po-man[\\/].*\.po$'

  - id: util-linux-test-script
    desc: util-linux test script
    for: [shell, scripts]
    if:
      type: path
      regex: 'tests[\\/]ts'

composite_rules:
  - id: util-linux-source-tree
    desc: util-linux source tree
    crit: notable
    conf: 0.99
    any:
      - id: util-linux-source-tree-path
      - id: util-linux-translation-path
      - id: util-linux-test-script

  # libmount (util-linux) applies mounts from inside a mount namespace, so
  # setns and unshare show up in any binary that statically links it. The
  # compilation-unit path and the MNT_ACT_MOUNT assertion are that library.
  - id: libmount-linked-mount-utility
    desc: Binary embeds util-linux libmount
    crit: notable
    conf: 0.97
    platforms: [linux, unix]
    for: [elf]
    all:
      - id: libmount-source-unit
      - id: libmount-mount-action-marker
