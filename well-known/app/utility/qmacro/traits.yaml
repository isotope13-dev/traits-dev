# QMacro (按键精灵) standalone macro runner, published by vrBrothers /
# Fujian Chuangyi Jiahe Soft Co., Ltd.
defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.95
  size_max: 52428800

traits:
  - id: qmacro-product-name
    desc: QMacro product name
    if:
      type: value
      path: pe.version.product_name
      exact: QMacro

  - id: qmacro-original-filename
    desc: QMacro original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: MyMacro.exe

  - id: qmacro-company-name
    desc: QMacro company name vrBrothers Corporation
    if:
      type: value
      path: pe.version.company
      substr: vrBrothers Corporation

  - id: qmacro-description
    desc: QMacro macro runner description
    if:
      type: value
      path: pe.version.description
      substr: "QMacro's macro runner"

composite_rules:
  - id: qmacro-macro-runner-binary
    desc: Fujian Chuangyi Jiahe QMacro standalone macro runner
    crit: notable
    conf: 0.98
    all:
      - id: metadata/signed/leaf::fujian-chuangyi-jiahe-soft-co.-ltd.
    any:
      - id: qmacro-product-name
      - id: qmacro-original-filename
      - id: qmacro-company-name
      - id: qmacro-description
