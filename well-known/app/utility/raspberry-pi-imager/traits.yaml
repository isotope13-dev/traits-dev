# Official Raspberry Pi Imager Inno Setup installer (Sectigo-signed).
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: raspberry-pi-imager-product-identity
    desc: PE version resource names Raspberry Pi Imager
    conf: 0.99
    size_max: 100000000
    if:
      type: text
      regex: '(?i)Raspberry Pi Imager'
      section: rsrc

composite_rules:
  - id: raspberry-pi-imager-signed-inno-installer
    desc: Signed Raspberry Pi Imager Inno bundle
    conf: 0.99
    all:
      - id: raspberry-pi-imager-product-identity
      - id: metadata/installer/builder/inno-setup::inno-delphi-installer-foundation
      - id: metadata/installer/builder/inno-setup::inno-setup-loader-manifest-identity
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
