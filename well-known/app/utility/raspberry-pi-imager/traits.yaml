# Official Raspberry Pi Imager Inno Setup installer (Sectigo-signed).
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: raspberry-pi-imager-product-identity
    desc: PE version resource names Raspberry Pi Imager
    conf: 0.99
    size_max: 100000000
    if:
      type: text
      regex: '(?i)Raspberry Pi Imager'
      section: rsrc

composite_rules:
  - id: raspberry-pi-imager-signed-inno-installer
    desc: Signed official Raspberry Pi Imager Inno bundle
    conf: 0.99
    all:
      - id: raspberry-pi-imager-product-identity
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: well-known/tool/packaging/inno-setup::inno-setup-loader-manifest-identity
    unless:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
