# LunaTranslator's native hook library extracts text from games. The verified
# release is signed through SignPath and intentionally uses executable memory,
# resource decoding, and thread creation for its hook engines.
defaults:
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
  size_max: 50000000

traits:
  - id: lunatranslator-product
    desc: LunaTranslator product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: LunaTranslator

  - id: lunatranslator-company
    desc: LunaTranslator publisher metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: HIllya51

composite_rules:
  - id: verified-lunatranslator-component
    desc: Verified LunaTranslator native component
    crit: notable
    all:
      - id: lunatranslator-product
      - id: lunatranslator-company
      - id: metadata/signed/leaf::signpath-foundation
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: lunatranslator-hook-context
    desc: Verified LunaTranslator hook component context
    crit: exception
    all:
      - id: verified-lunatranslator-component
      - id: metadata/signed/leaf::signpath-foundation
