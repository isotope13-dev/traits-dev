defaults:
  crit: notable
  conf: 0.99
  platforms: [macos]
  for: [macho, dylib]
  size_min: 32

traits:
  - id: trial-popups-agent-identifier
    desc: MacKeeper TrialPopupsAgent signing identifier
    # Identifies the declared component; this is not a signature trust check
    # or a verdict on this module or the surrounding product.
    if:
      type: value
      path: macho.code_signature.identifier
      exact: com.mackeeper.MacKeeper.plugin.TrialPopupsAgent
