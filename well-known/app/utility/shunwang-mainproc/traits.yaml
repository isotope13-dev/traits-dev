defaults:
  platforms: [windows]
  for: [dll]

traits:
  - id: main-proc-keeper-pdb
    desc: MainProcKeeper cloud-terminal PDB identity
    crit: notable
    conf: 0.99
    size_min: 65536
    size_max: 1048576
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])MainProcKeeper\.pdb$'

  - id: main-proc-keeper-init-export
    desc: MainProcKeeper InitMK entry-point symbol
    crit: notable
    conf: 0.99
    size_min: 65536
    size_max: 1048576
    if:
      type: symbol
      exact: InitMK

composite_rules:
  - id: main-proc-keeper-watchdog
    desc: Shunwang cloud-terminal MainProcKeeper watchdog
    crit: notable
    conf: 0.99
    all:
      - id: main-proc-keeper-pdb
      - id: main-proc-keeper-init-export
