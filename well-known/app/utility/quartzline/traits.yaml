# QuartzLine — Slint/Tauri-style Rust document viewer (signed EV builds).
defaults:
  conf: 0.97
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  size_max: 20000000

traits:
  - id: quartzline-cargo-build-path
    desc: QuartzLine application cargo build path
    crit: notable
    if:
      type: text
      substr: apps\quartzline\target
      section: .rdata

  - id: quartzline-exit-dialog-text
    desc: QuartzLine exit confirmation prompt
    crit: notable
    if:
      type: text
      substr: Exit QuartzLine?
      section: .rdata

composite_rules:
  - id: quartzline-document-viewer-binary
    desc: QuartzLine Slint document viewer application
    crit: notable
    all:
      - id: quartzline-cargo-build-path
      - id: quartzline-exit-dialog-text
