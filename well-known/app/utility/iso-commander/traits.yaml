defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000
  size_max: 5000000

traits:
  - id: iso-commander-title
    desc: Iso Commander application title string
    if:
      type: text
      substr: Iso Commander
      section: rodata

  - id: convert2iso-menu-marker
    desc: Convert2ISO menu option marker
    if:
      type: text
      substr: Convert2ISO
      section: rodata

  - id: chd2iso-converter-marker
    desc: CHD2ISO converter marker string
    if:
      type: text
      substr: chd2iso
      section: rodata

composite_rules:
  - id: iso-commander-disk-tool
    desc: Iso Commander disk image conversion utility
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: iso-commander-title
      - id: convert2iso-menu-marker
      - id: chd2iso-converter-marker
