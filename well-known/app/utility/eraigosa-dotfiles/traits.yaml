# Dotfiles and developer workstation setup (sfc-gh-eraigosa/dotfiles).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: eraigosa-dotfiles-archive-member
    desc: eraigosa dotfiles archive member
    for: [zip, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)github\.com/sfc-gh-eraigosa/dotfiles'

  - id: eraigosa-dotfiles-repo-marker
    desc: eraigosa dotfiles repository marker
    for: [shell, powershell, markdown, text]
    if:
      type: text
      substr: 'sfc-gh-eraigosa/dotfiles'

  - id: eraigosa-dotfiles-script-path
    desc: eraigosa dotfiles script path
    for: [shell, powershell]
    if:
      type: path
      substr: sfc-gh-eraigosa

composite_rules:
  - id: eraigosa-dotfiles-context
    desc: eraigosa dotfiles repository context
    crit: exception
    any:
      - id: eraigosa-dotfiles-archive-member
      - id: eraigosa-dotfiles-repo-marker
      - id: eraigosa-dotfiles-script-path
