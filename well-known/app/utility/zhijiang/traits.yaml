# zhijiang — Xu Zhijiang's PyPI env-setup / dotfiles CLI. First-run 7z
# extract, apt bootstrap, and rc-file install are the product.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: zhijiang PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: zhijiang

  - id: github-repo
    desc: zhijiang GitHub env-setup repository
    if:
      type: text
      substr: github.com/xu-zhijiang/env-setup

  - id: payload-archive
    desc: zhijiang bundled 7z payload name
    for: [python, whl]
    if:
      type: literal
      exact: zhijiang.7z

  - id: unzip-helper
    desc: zhijiang first-run unzip helper
    for: [python]
    if:
      type: text
      substr: _unzip_if_necessary

  - id: useful-func-import
    desc: zhijiang useful-func import path
    for: [python]
    if:
      type: text
      substr: zhijiang.scripts.zhijiang_useful_func

  - id: console-entry
    desc: zhijiang console-script entry point
    for: [text]
    if:
      type: text
      exact: 'zhijiang = zhijiang_main:main'

  - id: cli-wrapper-docstring
    desc: zhijiang CLI wrapper module docstring
    for: [python]
    if:
      type: text
      substr: 'Thin CLI entry point for the zhijiang package'

composite_rules:
  - id: env-setup-package
    desc: zhijiang developer env-setup package
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: wheel-distribution
      - id: github-repo
      - id: payload-archive
      - id: unzip-helper
      - id: useful-func-import
      - id: console-entry
      - id: cli-wrapper-docstring
