# KDE Partition Manager is a legitimate disk and partition administration
# utility.  Its binary contains operator warnings that disk contents will be
# destroyed when a partition table is created; those warnings are not a wiper
# objective when the KDE application identity is present.
defaults:
  platforms: [linux]
  for: [elf]
  size_min: 100000
  size_max: 5000000

traits:
  - id: executable-basename
    desc: KDE Partition Manager executable basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: partitionmanager

  - id: kde-application-homepage
    desc: KDE Partition Manager application homepage
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .rodata
      regex: 'https://www\.kde\.org/applications/system/partitionmanager\b'

composite_rules:
  - id: kde-partitionmanager-binary
    desc: Recognized KDE Partition Manager binary
    crit: notable
    conf: 0.99
    all:
      - id: executable-basename
      - id: kde-application-homepage
