# Cummins License Configuration Tool's signed Windows service host.  The
# release uses .NET Reactor and declares Win32 process APIs as part of its
# service/runtime implementation; only its complete signed identity is a
# benign context for those generic indicators.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 16384
  size_max: 10485760

traits:
  - id: cummins-lct-product
    desc: Cummins License Configuration Tool product
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Cummins License Configuration Tool

  - id: cummins-lct-filename
    desc: Cummins LCTService executable filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: LCTService.exe
      case_insensitive: true

  - id: cummins-lct-signer
    desc: Cummins electronic tools signer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=CUMMINS INC\.,OU=ELECTRONIC TOOLS ORGANIZATION,OU=Digital ID Class 3'

composite_rules:
  - id: cummins-lct-identity
    desc: Verified Cummins LCTService binary
    crit: notable
    conf: 0.99
    all:
      - id: cummins-lct-product
      - id: cummins-lct-filename
      - id: cummins-lct-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: cummins-lct-context
    desc: Verified Cummins LCTService context
    crit: exception
    conf: 0.99
    all:
      - id: cummins-lct-identity
      - id: cummins-lct-signer
