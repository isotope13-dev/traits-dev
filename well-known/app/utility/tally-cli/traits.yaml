# tally-cli — Dockerfile/Containerfile linter (wharflab/tally, GPL-3.0).
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, gem, ruby, markdown]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: tally-elf-go-module-path
    desc: Tally Linux Go module identity
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/wharflab/tally

  - id: tally-pe-go-module-path
    desc: Tally Windows Go module identity
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/wharflab/tally

  - id: tally-macho-go-module-path
    desc: Tally macOS Go module identity
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/wharflab/tally

  - id: tally-cli-gem-name
    desc: tally-cli Ruby gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: tally-cli

  - id: tally-dockerfile-linter-marker
    desc: tally Dockerfile linter product marker
    if:
      type: text
      regex: '(?i)linter for Dockerfiles and Containerfiles|tally\.wharflab\.com'

  - id: wharflab-vscode-publisher
    desc: wharflab VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: wharflab

  - id: tally-vscode-package-name
    desc: Tally VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: tally

composite_rules:
  - id: tally-cli-tool
    desc: wharflab tally Dockerfile linter
    crit: notable
    conf: 0.99
    any:
      - id: tally-elf-go-module-path
      - id: tally-pe-go-module-path
      - id: tally-macho-go-module-path
      - id: tally-cli-gem-name
      - id: tally-dockerfile-linter-marker
  - id: wharflab-tally-vscode-extension
    desc: wharflab Tally Dockerfile linter VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: wharflab-vscode-publisher
      - id: tally-vscode-package-name
