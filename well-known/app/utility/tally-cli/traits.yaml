# tally-cli — Dockerfile/Containerfile linter (wharflab/tally, GPL-3.0).
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, gem, ruby, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: tally-wharflab-module-path
    desc: wharflab/tally Go module import path
    for: [elf, pe, macho]
    if:
      type: text
      section: .text
      substr: github.com/wharflab/tally

  - id: tally-cli-gem-name
    desc: tally-cli Ruby gem package name
    for: [gem, ruby]
    if:
      type: text
      regex: '(?i)\btally-cli\b'

  - id: tally-dockerfile-linter-marker
    desc: tally Dockerfile linter product marker
    if:
      type: text
      regex: '(?i)linter for Dockerfiles and Containerfiles|tally\.wharflab\.com'

composite_rules:
  - id: tally-cli-tool
    desc: wharflab tally Dockerfile linter
    crit: notable
    conf: 0.99
    any:
      - id: tally-wharflab-module-path
      - id: tally-cli-gem-name
      - id: tally-dockerfile-linter-marker
