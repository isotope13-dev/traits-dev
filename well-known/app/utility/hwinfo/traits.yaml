defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: hwinfo-product-metadata
    desc: HWiNFO product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)HWiNFO'
  - id: hwinfo-signer-certificate
    desc: HWiNFO code-signing certificate
    crit: notable
    if:
      id: metadata/signed/leaf::martin-malik---realix

composite_rules:
  - id: hwinfo-component-identity
    desc: Verified HWiNFO component identity
    crit: notable
    all:
      - id: hwinfo-product-metadata
      - id: hwinfo-signer-certificate
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: hwinfo-component-context
    desc: Verified HWiNFO component context
    crit: exception
    conf: 0.99
    all:
      - id: hwinfo-product-metadata
      - id: hwinfo-component-identity
