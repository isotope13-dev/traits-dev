# WERDiagController.dll is the Windows Error Reporting diagnostic controller.
# It starts AppRecorder (psr.exe), FDR ETW sessions, and AutoVerifier via IFEO —
# including local RtlCreateUserThread workers, AppCompatFlags\Layers updates for
# the recorder, and temp-file staging for AppRecorder XML output.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 1048576
  crit: notable
  conf: 0.99

traits:
  - id: wer-diag-original-filename
    desc: WERDiagController original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: WERDiagController.dll
      case_insensitive: true

  - id: wer-diag-description
    desc: WER Diagnostic Controller description
    if:
      type: value
      path: pe.version.description
      exact: WER Diagnostic Controller

  - id: wer-diag-pdb
    desc: WERDiagController PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[/\\])WerDiagController\.pdb$'

  - id: wer-diag-start-app-recorder-export
    desc: Exports StartAppRecorder WER entrypoint
    if:
      type: export
      exact: StartAppRecorder

  - id: wer-diag-start-fdr-export
    desc: Exports StartFDR WER entrypoint
    if:
      type: export
      exact: StartFDR

composite_rules:
  - id: wer-diag-controller-identity
    desc: Windows WER Diagnostic Controller identity
    crit: notable
    conf: 0.99
    all:
      - id: wer-diag-original-filename
      - id: wer-diag-description
      - id: wer-diag-pdb
    any:
      - id: wer-diag-start-app-recorder-export
      - id: wer-diag-start-fdr-export

  - id: wer-diag-controller-system-context
    desc: Recognized Windows WER Diagnostic Controller context
    crit: exception
    conf: 0.99
    all:
      - id: wer-diag-controller-identity
      - id: metadata/binary/vendor::microsoft-prefixed-company
