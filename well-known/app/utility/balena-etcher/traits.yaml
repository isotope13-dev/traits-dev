# balenaEtcher — open-source USB/SD image flasher (Electron).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
  size_max: 536870912

traits:
  - id: balena-etcher-package-name
    desc: balena-etcher package.json name
    for: [package.json, javascript, json]
    if:
      type: value
      path: name
      exact: balena-etcher

  - id: balena-etcher-product-name
    desc: balenaEtcher product name string
    for: [javascript, json, package.json, text]
    if:
      type: text
      substr: balenaEtcher

  - id: balena-etcher-github
    desc: balena-io/etcher GitHub repository
    for: [package.json, javascript, json, text]
    if:
      type: text
      substr: github.com/balena-io/etcher
