# Dism++ is a Windows servicing and cleanup utility. Its Frog plugins use
# low-level process APIs for legitimate system inspection and integration.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 250000000

traits:
  - id: publisher
    desc: Dism++ publisher metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: 初雨团队

  - id: product
    desc: Dism++ product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '^(Dism\+\+|青蛙插件)$'

  - id: frog-plugin-marker
    desc: Dism++ Frog plugin marker
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      word: FrogPlugins

composite_rules:
  # Both legs are version-resource strings, and this exception is referenced
  # from four `unless:` sites — two of them in the thread-hijacking injection
  # rules. As written, any PE that writes `CompanyName=初雨团队` and
  # `ProductName=Dism++` into its version resource turns those detections off
  # for itself, which is two string copies for a full exemption.
  #
  # The suppression itself is right: Dism++ really does use low-level process
  # APIs for servicing work. What is missing is a check that the file claiming
  # to be Dism++ behaves like it. A Windows servicing utility links its imports
  # and ships unobfuscated; code that resolves APIs by walking module exports,
  # or that arrives under an obfuscator, is not this product whatever its
  # version resource says.
  - id: dism-plus-plus-main-context
    desc: Dism++ executable context
    crit: exception
    conf: 0.99
    all:
      - id: publisher
      - id: product
    unless:
      - id: micro-behaviors/os/api-resolution/manual/
      - id: objectives/anti-static/obfuscation/obfuscator/

  - id: dism-plus-plus-plugin-context
    desc: Dism++ Frog plugin context
    crit: exception
    conf: 0.99
    all:
      - id: publisher
      - id: product
      - id: frog-plugin-marker
