defaults:
  platforms: [windows]
  for: [pe]
  size_min: 20000
  size_max: 100000

traits:
  - id: product-name
    desc: LookFor file-search utility product name
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: LookFor

  - id: sanny-publisher
    desc: Sanny Ltd. publisher metadata
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: Sanny Ltd.

composite_rules:
  - id: sanny-lookfor-utility
    desc: Sanny LookFor file-search utility
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: sanny-publisher
    unless:
      # Both legs are version-resource strings, which anyone can copy into
      # their own build — there is no signature to check, so this identity is
      # a claim rather than proof. `well-known/app/` is named as a whole
      # directory in several `unless:` sets (the manual-PE-mapper and
      # reflective-loader rules among them), so a binary that borrows these
      # two fields would inherit those exemptions.
      #
      # A file-search utility links its imports. Code that instead walks the
      # loaded module list and parses export directories is not this product,
      # whatever its version resource says, so the identity stands down —
      # measured on a 30 KB unsigned PE carrying both LookFor strings that
      # Trellix's YARA set calls a CryptoLocker variant.
      - id: micro-behaviors/os/api-resolution/manual/
