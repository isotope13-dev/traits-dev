defaults:
  platforms: [windows]
  for: [pe]
  size_min: 20000
  size_max: 100000

traits:
  - id: product-name
    desc: LookFor file-search utility product name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: LookFor

  - id: sanny-publisher
    desc: Sanny Ltd. publisher metadata
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: Sanny Ltd.

  - id: file-version-2-0-1-7
    desc: LookFor 2.0.1.7 file version
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.file_version
      exact: 2.0.1.7

composite_rules:
  - id: sanny-lookfor-utility
    desc: Sanny LookFor file-search utility
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: sanny-publisher
      - id: file-version-2-0-1-7
