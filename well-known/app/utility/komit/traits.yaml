# komit — local Ollama git-commit message CLI (github.com/glemiu6/komit).
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: komit PyPI wheel name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: komit

  - id: github-repo
    desc: glemiu6 komit GitHub repository
    if:
      type: text
      substr: github.com/glemiu6/komit

  - id: author-email
    desc: komit author contact email
    if:
      type: text
      substr: digorivlad59@gmail.com

  - id: console-entry
    desc: komit console-script entry point
    for: [text]
    if:
      type: text
      exact: 'komit = komit.main:run'

  - id: git-assistant-system-prompt
    desc: komit git-assistant system prompt
    for: [python]
    if:
      type: text
      substr: 'You are an expert git assistant'

  - id: ollama-commit-style-map
    desc: komit conventional commit style map
    for: [python]
    if:
      type: text
      substr: 'Generate a conventional commit message (type: description)'

composite_rules:
  - id: komit-package
    desc: komit Ollama git-commit CLI
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: wheel-distribution
      - id: github-repo
      - id: author-email
      - id: console-entry
      - id: git-assistant-system-prompt
      - id: ollama-commit-style-map
