# Looking Glass — low-latency KVM VGA pass-through client (looking-glass.io).
defaults:
  platforms: [linux]
  for: [c, cpp, source, elf, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: Looking Glass source-tree member
    size_min: 16
    size_max: 50000000
    if:
      type: path
      regex: 'looking-glass-B?[0-9][A-Za-z0-9.+-]*'

  - id: project-source-header
    desc: Looking Glass project website URL
    for: [c, cpp]
    size_min: 64
    size_max: 50000000
    if:
      type: text
      substr: 'https://looking-glass.io'

  - id: client-binary-name
    desc: Looking Glass client binary name
    for: [elf]
    size_min: 100000
    size_max: 100000000
    if:
      type: basename
      exact: looking-glass-client

composite_rules:
  - id: source-context
    desc: Recognized Looking Glass KVM client source context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
    any:
      - id: project-source-header

  - id: client-context
    desc: Recognized Looking Glass KVM client binary context
    crit: exception
    conf: 0.99
    for: [elf]
    all:
      - id: client-binary-name
    any:
      - id: project-source-header
