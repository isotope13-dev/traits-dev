# Grix ships a documented six-hour self-update check that runs through
# OpenClaw's isolated, no-delivery cron facility -- the same surface the
# autonomous-task cron persistence composite watches. Named for what the
# matcher finds (the product's own update routine) so that carve-out can be a
# trait reference instead of an inline pattern.
#
# Filed under app/utility rather than app/ai, where the OpenClaw traits it
# pairs with live, only because well-known/app/ai/ is already at the 150
# immediate-subdirectory cap; move it there if that level ever gains the
# grouping layer validation asks for.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
  size_min: 64
  size_max: 100000000

traits:
  - id: grix-auto-update-check
    desc: Grix auto-update check-and-apply sequence
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'grix auto update[\s\S]{0,900}check-and-apply'
      case_insensitive: true
