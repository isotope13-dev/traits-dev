# Tencent WeGame PC game platform installers and bundled components.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 524288000

traits:
  - id: wegame-product-version
    desc: WeGame PE product version resource
    if:
      type: value
      path: pe.version_info.product_name
      exact: WeGame

  - id: tencent-technology-signer
    desc: Tencent Technology Shenzhen code signature
    if:
      type: value
      path: pe.signatures[0].subject
      substr: Tencent Technology (Shenzhen) Company Limited

  - id: wegame-mini-loader-basename
    desc: WeGame mini loader filename
    for: [pe]
    if:
      type: value
      path: file.basename
      regex: '(?i)^WeGameMiniLoader'

composite_rules:
  - id: tencent-wegame-distribution-context
    desc: Tencent WeGame platform distribution
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: tencent-technology-signer
    any:
      - id: wegame-product-version
      - id: wegame-mini-loader-basename
