defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 50000
  size_max: 50000000

traits:
  - id: silentall-installer-company
    crit: notable
    desc: Silentall Unattended Installer company metadata
    if:
      type: value
      path: pe.version.company
      exact: Silentall Unattended Installer
  - id: silentall-installer-product
    crit: notable
    desc: Silentall Unattended Installer product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Silentall Unattended Installer
  - id: silentall-installer-comments
    crit: notable
    desc: Silentall Unattended Installer comment metadata
    if:
      type: value
      path: pe.version.comments
      exact: Silentall Unattended Installer

composite_rules:
  - id: silentall-unattended-installer
    desc: Silentall Unattended Installer package
    crit: notable
    conf: 0.99
    all:
      - id: silentall-installer-company
      - id: silentall-installer-product
