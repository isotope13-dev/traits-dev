# Official Ubuntu OCI minimized Docker library image.
# libc, OpenSSL, coreutils, and tzselect are distro contents; identity
# is the minimized-image MOTD, not those binaries. tzselect's UTF-8
# cuneiform probe is not octal obfuscation.
defaults:
  platforms: [linux]
  for: [shell, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 16384

traits:
  - id: unminimize-motd-basename
    desc: Ubuntu minimized MOTD script name
    if:
      type: basename
      exact: '60-unminimize'

  - id: unminimize-restore-hint
    desc: Ubuntu unminimize restore MOTD hint
    if:
      type: text
      substr: "run the 'unminimize' command"

composite_rules:
  - id: ubuntu-oci-minimized-image
    desc: Ubuntu OCI minimized Docker image
    crit: notable
    conf: 0.99
    all:
      - id: unminimize-motd-basename
      - id: unminimize-restore-hint
