defaults:
  platforms: [macos]
  for: [macho, plist, shell, scripts, data, zip]
  crit: component
  conf: 0.99

traits:
  - id: whatcable-signing-team
    crit: notable
    desc: WhatCable Apple signing team
    for: [macho]
    size_min: 4096
    size_max: 600000000
    if:
      type: value
      path: macho.code_signature.team_id
      exact: M4RUJ7W6MP

  - id: whatcable-bundle-path
    crit: notable
    desc: WhatCable bundle path
    for: [macho, plist, shell, data]
    size_min: 128
    size_max: 600000000
    if:
      type: path
      substr: WhatCable.app

  - id: whatcable-bundle-marker
    crit: notable
    desc: WhatCable bundle marker
    for: [macho, plist, shell, data]
    size_min: 128
    size_max: 600000000
    if:
      type: text
      substr: uk.whatcable.whatcable

composite_rules:
  - id: official-whatcable-member
    desc: Official WhatCable member
    crit: notable
    any:
      - id: whatcable-signing-team
      - id: whatcable-bundle-path
      - id: whatcable-bundle-marker
