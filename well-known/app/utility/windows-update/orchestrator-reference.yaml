defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: uie-orchestrator-stub-reference
    desc: References UIEOrchestratorStub.exe
    # The matched executable name occupies at least 23 bytes.
    size_min: 23
    if:
      type: text
      regex: '(?i)\bUIEOrchestratorStub\.exe\b'
