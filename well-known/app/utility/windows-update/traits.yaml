# WUSA is the Windows Update Standalone Installer. Its update, elevation,
# token, registry, and cleanup APIs are expected for a system component; use
# several independent PE identity fields before treating it as known context.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 100000
  size_max: 5000000
  crit: notable
  conf: 0.99

traits:
  - id: wusa-original-filename
    desc: WUSA original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: wusa.exe
      case_insensitive: true

  - id: wusa-internal-name
    desc: WUSA internal name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: wusa.exe
      case_insensitive: true

  - id: wusa-description
    desc: Windows Update Standalone Installer description
    if:
      type: value
      path: pe.version.description
      exact: Windows Update Standalone Installer

  - id: wusa-manifest-identity
    desc: Microsoft WUSA manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Microsoft.Windows.WUSA

composite_rules:
  - id: wusa-identity
    desc: Windows Update Standalone Installer identity
    crit: notable
    conf: 0.99
    all:
      - id: wusa-original-filename
      - id: wusa-internal-name
      - id: wusa-description
      - id: wusa-manifest-identity

  - id: wusa-system-context
    desc: Recognized Windows Update Standalone Installer context
    crit: exception
    conf: 0.99
    all:
      - id: wusa-identity
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/build/manifest::pe-requires-admin
