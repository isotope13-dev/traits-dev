defaults:
  platforms: [macos]
  for: [macho, plist, archives, binaries]
  crit: notable
  conf: 0.98
  size_max: 300000000

traits:
  - id: appcleaner-bundle-member
    desc: AppCleaner bundle member
    if:
      type: path
      regex: 'AppCleaner(_[0-9][^\\/]*)?\.zip|AppCleaner\.app'

  - id: dmcleaner-bundle-member
    desc: DMcleaner bundle member
    if:
      type: path
      regex: '(^|[\\/])DMcleaner\.dmg|DMcleaner\.app[\\/]'

  # DeepCleanMac is the same product class: a disk/browser cleaner enumerates
  # every browser's profile directory because removing that data is what it
  # sells. The browser-profile-path traits read that inventory as credential
  # targeting.
  - id: deepcleanmac-bundle-member
    desc: DeepCleanMac application bundle member
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)DeepCleanMac'
  - id: pearcleaner-bundle-member
    desc: Pearcleaner bundle member
    if:
      type: path
      substr: 'Pearcleaner.app'

composite_rules:
  - id: macos-cleaner-app
    desc: macOS cleaner application bundle
    crit: notable
    conf: 0.99
    any:
      - id: appcleaner-bundle-member
      - id: dmcleaner-bundle-member
      - id: deepcleanmac-bundle-member
      - id: pearcleaner-bundle-member
