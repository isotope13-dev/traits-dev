defaults:
  platforms: [macos]
  for: [macho, plist, binaries]
  crit: notable
  conf: 0.98
  size_max: 300000000

traits:
  - id: appcleaner-bundle-member
    for: [macho, plist, binaries, zip]
    desc: AppCleaner bundle member
    if:
      type: path
      regex: 'AppCleaner(_[0-9][^\\/]*)?\.zip|AppCleaner\.app'

  - id: dmcleaner-bundle-member
    for: [macho, plist, binaries, dmg]
    desc: DMcleaner bundle member
    if:
      type: path
      regex: '(^|[\\/])DMcleaner\.dmg|DMcleaner\.app[\\/]'

  # DeepCleanMac is the same product class: a disk/browser cleaner enumerates
  # every browser's profile directory because removing that data is what it
  # sells. The browser-profile-path traits read that inventory as credential
  # targeting.
  - id: deepcleanmac-bundle-member
    desc: DeepCleanMac application bundle member
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)DeepCleanMac'
  - id: pearcleaner-bundle-member
    desc: Pearcleaner bundle member
    if:
      type: path
      substr: 'Pearcleaner.app'

  - id: iboostup-bundle-member
    desc: iBoostUp macOS utility bundle member
    for: [macho, plist, binaries, dmg]
    if:
      type: path
      regex: '(?i)iBoostUp(\s+12)?\.app([\\/]|$)'

  - id: iboostup-developer
    desc: iBoostUp developer signing identity
    for: [macho, dylib, binaries]
    if:
      id: metadata/signed/developer::8NQYXT4C4P

composite_rules:
  - id: deepcleanmac-developer-id-signed-app
    desc: DeepCleanMac app signed by its Developer ID team
    crit: notable
    conf: 0.99
    for: [macho]
    all:
      - id: metadata/signed/id::com.deepcleanmac.app
      - id: metadata/signed/developer::SLUA7FD7MQ
  - id: macos-cleaner-app
    desc: macOS cleaner application bundle
    crit: notable
    conf: 0.99
    any:
      - id: appcleaner-bundle-member
      - id: dmcleaner-bundle-member
      - id: deepcleanmac-bundle-member
      - id: pearcleaner-bundle-member
      - id: iboostup-bundle-member
    all:
      - id: iboostup-bundle-member
      - id: iboostup-developer
