# File Browser (filebrowser/filebrowser) — Wolfi/Alpine web file manager.
# The static Go binary is an HTTP file server with optional command
# execution; init.sh exec and wget /health are product, not C2.
# ELF Go-module identity lives in alpine-packages; do not duplicate it.
defaults:
  platforms: [unix]
  for: [apk, elf, shell, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: apk-basename
    desc: filebrowser Alpine APK basename
    for: [apk]
    if:
      type: value
      path: file.basename
      regex: '(?i)^filebrowser-'

  - id: pkginfo-name
    desc: filebrowser Alpine PKGINFO pkgname
    for: [text, apk]
    if:
      type: text
      regex: '^pkgname\s*=\s*filebrowser\s*$'

  - id: pkginfo-web-file-browser
    desc: Alpine pkgdesc Web File Browser
    for: [text, apk]
    if:
      type: text
      substr: 'pkgdesc = Web File Browser'

  - id: github-clone-url
    desc: filebrowser GitHub clone URL
    for: [text, shell]
    if:
      type: text
      substr: github.com/filebrowser/filebrowser.git

  - id: binary-path
    desc: filebrowser usr/bin install path
    for: [elf, apk]
    if:
      type: path
      regex: '(?i)usr[\\/]bin[\\/]filebrowser$'

  - id: healthcheck-port
    desc: File Browser healthcheck FB_PORT env
    for: [shell]
    if:
      type: text
      substr: 'PORT=${FB_PORT:-$(jq -r .port /config/settings.json)}'

composite_rules:
  - id: filebrowser-package
    desc: File Browser web file manager package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: apk-basename
      - id: pkginfo-name
      - id: github-clone-url
      - id: binary-path
      - id: well-known/tool/sysadmin/alpine-packages::alpine-filebrowser-binary
    needs: 2
