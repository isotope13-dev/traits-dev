defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: debian-packaging
    desc: fwupd Debian packaging member
    for: [shell, makefile, text, data, c]
    if:
      type: text
      regex: '\b(fwupdtool|dh_install\s+-pfwupd|fwupd-tests)\b'

  - id: source-tree-context
    desc: fwupd source tree member
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, makefile, text, data, python]
    if:
      type: path
      regex: '(?i)fwupd-[0-9][^\\/]*'
