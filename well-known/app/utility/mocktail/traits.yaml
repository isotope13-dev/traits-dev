# mocktail — community Android Roblox client runtime for Linux (komaruworld/mocktail).
defaults:
  platforms: [unix]
  for: [c, cpp, shell, markdown, archives, tar, makefile]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-repository
    desc: mocktail upstream GitHub repository
    if:
      type: text
      substr: github.com/komaruworld/mocktail

  - id: mocktail-archive-path
    desc: mocktail source archive path
    if:
      type: path
      regex: 'mocktail-[0-9]'

  - id: android-roblox-runtime-marker
    desc: mocktail Android Roblox client description
    if:
      type: text
      substr: Android `x86_64` Roblox client on Linux

composite_rules:
  - id: mocktail-runtime-context
    desc: mocktail Android Roblox Linux runtime project
    crit: exception
    conf: 0.99
    any:
      - id: upstream-repository
      - id: mocktail-archive-path
      - id: android-roblox-runtime-marker
