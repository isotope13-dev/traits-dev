# Locale Remulator injects a Detours-based locale shim into child processes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 2000000

traits:
  - id: locale-remulator-hook-pdb
    desc: Locale Remulator hook PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|\\)Locale_Remulator\\.*\\LRHookx(32|64)[.]pdb$'

composite_rules:
  - id: locale-remulator-hook-identity
    desc: Locale Remulator Detours hook identity
    crit: notable
    conf: 0.99
    all:
      - id: locale-remulator-hook-pdb
      - id: well-known/lib/platform/microsoft-detours::detours-section-marker
      - id: micro-behaviors/os/sysinfo/platform/locale::get-thread-locale
