defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.96

traits:
  - id: display-tune-product
    crit: notable
    desc: Display Tune product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Display Tune

  - id: display-tune-description
    crit: notable
    desc: Display Tune file description
    if:
      type: value
      path: pe.version.description
      substr: Display Tune

composite_rules:
  - id: display-tune-binary
    desc: Portrait Displays Display Tune binary
    crit: notable
    conf: 0.99
    all:
      - id: metadata/vendor/identity::portrait-displays-company
      - id: display-tune-product
    any:
      - id: display-tune-description
      - id: metadata/binary/resource/identity::dthtml-original-filename
      - id: metadata/binary/section/label::pdi-section
    needs: 2
