# Shrike — GTK desktop utility suite (night mode, SSH keys, LAN drop, etc.).
# Legitimate apps commonly pair XDG autostart with a user systemd unit for
# alarms/status indicators; identity traits suppress that dual-surface FP.
defaults:
  platforms: [linux]
  for: [c, cpp, python, shell, text, archives]
  crit: notable
  conf: 0.99

traits:
  - id: config-dir-shrikeshrift
    desc: Shrike suite config directory name
    for: [c, cpp]
    if:
      type: text
      substr: .config/shrikeshrift

  - id: night-mode-window-title
    desc: Shrike Night Mode window title
    for: [c, cpp]
    if:
      type: text
      substr: 'Shrike Night Mode'

  - id: alarm-user-service
    desc: Shrike alarm systemd user service
    for: [c, cpp, systemd-service]
    if:
      type: text
      substr: shrike-alarm.service

  - id: keys-application-id
    desc: Shrike Keys GTK application id
    for: [c, cpp]
    if:
      type: text
      substr: org.shrike.keys

  - id: nightmode-autostart-desktop
    desc: Shrike nightmode XDG autostart desktop name
    for: [c, cpp]
    if:
      type: text
      substr: shrike-nightmode.desktop

composite_rules:
  - id: desktop-utility-suite-context
    desc: Recognized Shrike GTK desktop utility context
    crit: exception
    conf: 0.99
    for: [c, cpp]
    needs: 2
    any:
      - id: config-dir-shrikeshrift
      - id: night-mode-window-title
      - id: alarm-user-service
      - id: keys-application-id
      - id: nightmode-autostart-desktop
