# Locale Emulator's native helper DLLs access NT process APIs while applying a
# locale profile. Their upstream build paths identify these unsigned helpers.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 2000000

traits:
  - id: locale-emulator-core-pdb
    desc: Locale Emulator Core PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\Locale-Emulator-Core\\.*\\(LoaderDll|LocaleEmulator)[.]pdb$'

  - id: locale-emulator-component-name
    desc: Locale Emulator native component filename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)^(LoaderDll|LocaleEmulator)[.]dll$'

composite_rules:
  - id: locale-emulator-native-identity
    desc: Locale Emulator native helper identity
    crit: notable
    conf: 0.99
    all:
      - id: locale-emulator-core-pdb
      - id: locale-emulator-component-name

  - id: locale-emulator-native-context
    desc: Locale Emulator native helper context
    crit: exception
    conf: 0.99
    all:
      - id: locale-emulator-native-identity
      - id: locale-emulator-core-pdb
