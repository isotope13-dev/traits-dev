defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pulse-product-name
    desc: PULSE product name metadata
    crit: component
    conf: 0.9
    size_min: 102400
    if:
      type: value
      path: pe.version.product_name
      exact: PULSE

  - id: iiv-copyright
    desc: I I V copyright metadata
    crit: component
    conf: 0.98
    size_min: 102400
    if:
      type: value
      path: pe.version.copyright
      regex: '^Copyright 2024-20[2-9][0-9] I I V$'

composite_rules:
  - id: pulse-game-optimizer
    desc: PULSE Windows game optimizer identity
    crit: notable
    conf: 0.99
    all:
      - id: pulse-product-name
      - id: iiv-copyright
