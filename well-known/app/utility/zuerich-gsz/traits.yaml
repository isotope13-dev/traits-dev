# Grün Stadt Zürich (GSZ) construction-site QA workbooks — parks and
# public-space department, not Statistik Stadt Zürich.
defaults:
  platforms: [unix, windows]
  for: [ooxml]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 50000000

traits:
  - id: company
    desc: Grün Stadt Zürich document company
    conf: 0.99
    if:
      type: value
      path: office.company
      exact: Grün Stadt Zürich

  - id: last-modified-by-gsz
    desc: Grün Stadt Zürich last-modified-by GSZ
    conf: 0.97
    if:
      type: value
      path: office.last_modified_by
      exact: Seidler-Garot Iris (GSZ)

  - id: sia-108-fee-title
    desc: GSZ SIA 108 fee-calculation title
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Honorarberechnung SIA 108

  - id: bauarbeiten-qa-basename
    desc: GSZ construction-QA folder filename
    conf: 0.98
    if:
      type: path
      basename: true
      regex: 'qs-bauarbeiten'
