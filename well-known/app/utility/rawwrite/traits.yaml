# RawWrite for Windows is an open-source floppy image reader/writer.
# Identify its own embedded product, author, and diskio help strings; do not
# use its filename or archive location as identity evidence.
defaults:
  crit: notable
  conf: 0.98
  for: [pe]
  platforms: [windows]
  size_min: 50000
  size_max: 1048576

traits:
  - id: rawwrite-product-banner
    desc: RawWrite for Windows product banner
    if:
      type: text
      section: CODE
      substr: RawWrite for windows version

  - id: rawwrite-author
    desc: RawWrite author attribution
    if:
      type: text
      section: CODE
      exact: Written by John Newbigin

  - id: rawwrite-diskio-help
    desc: RawWrite missing diskio.dll help text
    if:
      type: text
      section: CODE
      substr: RawWrite can automaticly download it for you

  - id: rawwrite-download-source
    desc: RawWrite diskio download source
    if:
      type: text
      section: CODE
      substr: http://uranus.it.swin.edu.au/~jn/linux

composite_rules:
  - id: rawwrite-windows-floppy-imager
    desc: RawWrite for Windows floppy image utility
    all:
      - id: rawwrite-product-banner
      - id: rawwrite-author
      - id: rawwrite-diskio-help
      - id: rawwrite-download-source
