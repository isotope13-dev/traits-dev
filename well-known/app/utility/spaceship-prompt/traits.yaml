# Spaceship Prompt — A Zsh prompt for Astronauts (github.com/spaceship-prompt/spaceship-prompt)
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: spaceship-prompt-package-name
    desc: spaceship-prompt npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "spaceship-prompt"

  - id: spaceship-prompt-repo-url
    desc: spaceship-prompt repository reference
    for: [package.json, markdown, shell]
    if:
      type: text
      substr: "github.com/spaceship-prompt/spaceship-prompt"

  - id: spaceship-theme-file
    desc: Spaceship prompt zsh theme file
    for: [shell, tar, zip]
    if:
      type: path
      basename: true
      regex: '^(prompt_spaceship_setup|spaceship\.zsh(-theme)?)$'

composite_rules:
  - id: spaceship-prompt-context
    desc: Spaceship Zsh prompt package context
    crit: exception
    conf: 0.99
    any:
      - id: spaceship-prompt-package-name
      - id: spaceship-prompt-repo-url
      - id: spaceship-theme-file
