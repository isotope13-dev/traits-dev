defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  size_min: 524288
  size_max: 134217728
  crit: notable
  conf: 0.95

traits:
  - id: wezterm-github-repo-url
    desc: WezTerm upstream GitHub repository URL
    conf: 0.99
    if:
      type: text
      substr: https://github.com/wez/wezterm
      section: .rdata

  - id: wezterm-ci-source-path
    desc: WezTerm GitHub Actions source path marker
    conf: 0.98
    if:
      type: text
      regex: '(?i)[\\/]a[\\/]wezterm[\\/]wezterm[\\/]'
      section: .rdata

  - id: wezterm-utility-banner
    desc: WezTerm companion utility banner text
    conf: 0.99
    if:
      type: text
      substr: This utility is part of WezTerm.
      section: .rdata

  - id: wezterm-basename
    desc: WezTerm executable basename
    conf: 0.96
    if:
      type: path
      basename: true
      regex: '(?i)^wezterm(-gui|-mux-server)?\.exe$'

composite_rules:
  - id: wezterm-terminal-identity
    desc: WezTerm terminal application identity
    conf: 0.98
    any:
      - id: wezterm-github-repo-url
      - id: wezterm-ci-source-path
      - id: wezterm-utility-banner
      - id: wezterm-basename
