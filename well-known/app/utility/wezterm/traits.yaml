defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  size_min: 524288
  size_max: 134217728
  crit: notable
  conf: 0.95

traits:
  - id: wezterm-github-repo-url
    desc: WezTerm upstream GitHub repository URL
    conf: 0.99
    if:
      type: text
      # Matches http(s):// and bare host forms embedded in Rust builds
      regex: '(?i)github\.com/wez/wezterm\b'
      section: .rdata

  - id: wezterm-ci-source-path
    desc: WezTerm GitHub Actions source path marker
    conf: 0.98
    if:
      type: text
      regex: '(?i)[\\/]a[\\/]wezterm[\\/]wezterm[\\/]'
      section: .rdata

  - id: wezterm-utility-banner
    desc: WezTerm companion utility banner text
    conf: 0.99
    if:
      type: text
      substr: This utility is part of WezTerm.
      section: .rdata

  - id: wezterm-basename
    desc: WezTerm executable basename
    conf: 0.96
    if:
      type: path
      basename: true
      regex: '(?i)^wezterm(-gui|-mux-server)?\.exe$'

  - id: wezterm-strip-ansi-basename
    desc: WezTerm strip-ansi-escapes utility basename
    conf: 0.96
    if:
      type: path
      basename: true
      exact: strip-ansi-escapes.exe
      case_insensitive: true

composite_rules:
  # Require CI path plus a second independent marker so identity is not a
  # low-value needs<=1 any: (those are filtered from scan output).
  - id: wezterm-terminal-identity
    desc: WezTerm terminal application identity
    conf: 0.98
    all:
      - id: wezterm-ci-source-path
    any:
      - id: wezterm-basename
      - id: wezterm-github-repo-url
      - id: wezterm-utility-banner
      - id: wezterm-strip-ansi-basename

  - id: wezterm-companion-utility-identity
    desc: WezTerm companion utility identity
    conf: 0.98
    all:
      - id: wezterm-utility-banner
      - id: wezterm-github-repo-url
