# Verified PS Remote Play installers legitimately use InstallShield's
# prerequisite, reboot, and registry machinery.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 500000
  size_max: 10000000

traits:
  - id: ps-remote-play-product
    desc: PS Remote Play product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: PS Remote Play

  - id: sony-interactive-entertainment-company
    desc: Sony Interactive Entertainment company metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Sony Interactive Entertainment Inc.

  - id: installshield-setup-original-filename
    desc: InstallShield setup original filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: InstallShield Setup.exe
      case_insensitive: true

  - id: sony-interactive-entertainment-signer
    desc: Sony Authenticode signer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      substr: 'CN=Sony Interactive Entertainment Inc.,'

composite_rules:
  - id: sony-ps-remote-play-installer-identity
    desc: Verified Sony PS Remote Play installer identity
    crit: notable
    conf: 0.99
    all:
      - id: ps-remote-play-product
      - id: sony-interactive-entertainment-company
      - id: installshield-setup-original-filename
      - id: sony-interactive-entertainment-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: sony-ps-remote-play-installer-context
    desc: Verified PS Remote Play installer context
    crit: exception
    conf: 0.99
    all:
      - id: sony-ps-remote-play-installer-identity
      - id: metadata/binary/installer/family::installshield-setup-runtime-context
