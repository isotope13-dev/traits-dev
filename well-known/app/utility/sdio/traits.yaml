# Snappy Driver Installer Origin (SDIO) — portable Windows driver installer
# by Glenn Delahoy (GPL). Uses GDI canvas painting, WinINet updates, and WMI
# hardware queries as normal product behavior.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 50000000

traits:
  - id: product-name
    desc: Snappy Driver Installer Origin product
    if:
      type: value
      path: pe.version.product_name
      exact: Snappy Driver Installer Origin

  - id: company-name
    desc: Glenn Delahoy company metadata
    if:
      type: value
      path: pe.version.company
      exact: Glenn Delahoy

  - id: signer
    desc: Glenn Delahoy Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=Glenn Delahoy\b'

  - id: welcome-title
    desc: SDIO welcome title string
    if:
      type: text
      substr: 'Welcome To Snappy Driver Installer Origin'
      section: .rsrc

composite_rules:
  - id: sdio-official-binary
    desc: Official Snappy Driver Installer Origin
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: company-name
      - id: signer

  - id: sdio-official-context
    desc: Official SDIO application context
    crit: exception
    conf: 0.99
    all:
      - id: product-name
      - id: company-name
      - id: signer
      - id: welcome-title
