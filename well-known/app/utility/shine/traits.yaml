# Shine — personal preset installer for scripts and dotfiles (biulight).
defaults:
  platforms: [unix, windows]
  for: [rust, crate, tar, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: docs-site-url
    desc: Shine documentation site URL
    if:
      type: text
      substr: biulight.github.io/shine

  - id: preset-lifecycle-summary
    desc: Shine preset install lifecycle summary
    if:
      type: text
      substr: Give personal automation a reviewable lifecycle

composite_rules:
  - id: shine-preset-cli
    desc: Shine personal preset installer CLI
    crit: notable
    any:
      - id: docs-site-url
      - id: preset-lifecycle-summary
