# ClipX — Windows clipboard history and management utility
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 500000
  size_max: 10000000

traits:
  - id: clipx-pdb-path
    desc: ClipX PDB debug path
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\clipx\\.*\.pdb$'

  - id: clipx-donate-url
    desc: ClipX donation URL reference
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      exact: https://clipx.org/donate

  - id: clipx-install-helper-name
    desc: ClipX install helper reference
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rdata
      exact: clipx-install-helper.exe

  - id: clipx-clipboard-history-string
    desc: ClipX clipboard history UI string
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rsrc
      exact: ClipX can keep your clipboard history in three ways.

composite_rules:
  - id: clipx-identity
    desc: ClipX clipboard manager application identity
    crit: notable
    conf: 0.99
    all:
      - id: clipx-pdb-path
    any:
      - id: clipx-donate-url
      - id: clipx-install-helper-name
      - id: clipx-clipboard-history-string
