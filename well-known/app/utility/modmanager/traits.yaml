# ModManager (modmanager.info, WoM) is a game-mod installer. Setup builds are
# often UPX-packed and later show up as CAPE-reconstructed images.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 20000000

traits:
  - id: modmanager-product-name
    desc: ModManager product version resource
    if:
      type: value
      path: pe.version.product_name
      exact: ModManager
