# HxD Hex Editor's unsigned Windows editor binary.  HxD exposes memory-editing
# APIs as part of its documented hex-editor functionality, so its product
# identity must be established from several independent vendor markers before
# it is used as a benign context.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  size_max: 10000000

traits:
  - id: hxd-product-title
    desc: HxD Hex Editor product title
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .rsrc
      exact: HxD Hex Editor

  - id: hxd-official-update-endpoint
    desc: HxD official update endpoint
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .text
      regex: 'https://mh-nexus\.de/updates/HxD(Stable|Beta)VersionInfo'

  - id: hxd-generated-document-marker
    desc: HxD-generated document marker
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .text
      substr: Generated by HxD

composite_rules:
  - id: hxd-editor-identity
    desc: Known HxD Hex Editor identity
    crit: notable
    conf: 0.99
    all:
      - id: hxd-product-title
      - id: hxd-official-update-endpoint
      - id: hxd-generated-document-marker

  - id: hxd-editor-context
    desc: Recognized HxD editor context
    crit: exception
    conf: 0.99
    all:
      - id: hxd-editor-identity
      - id: hxd-product-title
