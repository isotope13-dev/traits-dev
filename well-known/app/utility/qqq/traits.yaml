# qqq — gh555 rich-note and paste-anywhere VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, python, archives, vsix]
  crit: notable
  conf: 0.99

traits:
  - id: qqq-package-name
    desc: qqq VS Code extension package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: qqq

  - id: gh555-publisher
    desc: gh555 extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: gh555

  - id: qqq-github-repo
    desc: qqq GitHub repository
    if:
      type: text
      substr: github.com/gh555com/qqq

  - id: qqq-clipboard-helper-file
    desc: qqq Python clipboard helper script
    for: [python]
    if:
      type: basename
      exact: kp.py

  - id: qqq-pip-bootstrap
    desc: qqq embedded Python get-pip bootstrap
    for: [javascript, typescript]
    if:
      type: text
      substr: bootstrap.pypa.io/pip

  - id: qqq-python-venv-marker
    desc: qqq embedded Python venv installer
    for: [javascript, typescript]
    if:
      type: text
      substr: embeddable-python

composite_rules:
  - id: qqq-extension-context
    desc: Recognized gh555 qqq rich-note extension
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: qqq-package-name
    any:
      - id: gh555-publisher
      - id: qqq-github-repo
      - id: qqq-clipboard-helper-file
