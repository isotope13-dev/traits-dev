# Recognized locale-compatibility tools that intentionally inject a shim into
# a child process. This directory contains only strong product identities so
# objective rules can suppress the shared behavior with one bounded reference.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 2000000

composite_rules:
  - id: recognized-locale-injection-component
    desc: Recognized locale injection utility component
    crit: notable
    conf: 0.99
    any:
      - id: well-known/app/utility/locale-remulator::locale-remulator-hook-identity
      - id: well-known/app/utility/ntlea::ntlea-versioned-component-identity
      - id: well-known/app/utility/ntlea::ntlea-hook-component-identity
