# ble.sh — Bash Line Editor (github.com/akinomyoga/ble.sh)
# Pure Bash command line editor replacing GNU Readline.
defaults:
  platforms: [unix]
  for: [shell, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: blesh-header
    desc: ble.sh source file header
    for: [shell]
    if:
      type: text
      substr: 'This script is a part of blesh (https://github.com/akinomyoga/ble.sh)'

  - id: blesh-version-banner
    desc: ble.sh version banner
    for: [shell]
    if:
      type: text
      substr: 'ble.sh (Bash Line Editor)'

  - id: blesh-repo-url
    desc: ble.sh GitHub repository reference
    if:
      type: text
      substr: 'https://github.com/akinomyoga/ble.sh'

composite_rules:
  - id: ble-sh-context
    desc: Recognized ble.sh (Bash Line Editor) context
    crit: exception
    conf: 0.99
    for: [shell]
    any:
      - id: blesh-header
      - id: blesh-version-banner
      - id: blesh-repo-url
