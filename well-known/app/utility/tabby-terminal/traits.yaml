# Tabby: the open-source cross-platform terminal. Its SSH support ships as a
# builtin plugin, so a file naming `tabby-ssh` is the terminal's own SSH
# feature rather than hand-rolled SSH client code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, scripts, binaries]
  conf: 0.95
  size_max: 209715200
traits:
  # Tabby's terminal plugins use builtin-plugins/tabby-<name>. Rspack's
  # unrelated dist/builtin-plugin tree is not a Tabby identity signal.
  - id: tabby-builtin-plugin-path
    desc: Tabby terminal builtin plugin member path
    crit: notable
    for: [javascript, json]
    size_max: 10000000
    if:
      type: path
      regex: 'builtin-plugins[\\/]tabby-'
  - id: tabby-builtin-plugin-dist-path
    desc: Tabby terminal compiled builtin plugin path
    crit: notable
    for: [javascript, json]
    size_max: 10000000
    if:
      type: path
      regex: 'builtin-plugins[\\/]tabby-[\w-]+[\\/]dist'
  - id: tabby-builtin-plugin-keyword
    desc: Declares a Tabby terminal builtin plugin
    crit: notable
    for: [package.json]
    if:
      type: value
      path: keywords[*]
      exact: tabby-builtin-plugin
  - id: tabby-ssh-builtin-plugin-path
    desc: Tabby builtin SSH plugin path
    crit: notable
    if:
      type: text
      substr: builtin-plugins/tabby-ssh
  - id: tabby-ssh-plugin-name
    desc: Tabby SSH plugin name
    crit: baseline
    if:
      type: text
      substr: tabby-ssh
  # The packaged application binary. A terminal emulator binds a Unix socket
  # for its own IPC, accepts on it, dup2()s the connection onto a PTY and
  # execve()s a shell -- every leg of a bind-shell rule, and the whole point
  # of the program. Keyed on the install path *and* the basename together so a
  # binary merely dropped in a folder called Tabby does not qualify.
  - id: tabby-install-path
    desc: Tabby install directory path
    crit: baseline
    for: [elf, macho, pe]
    size_min: 100000
    if:
      type: path
      regex: '(^|/)Tabby/'
  - id: tabby-app-basename
    desc: Tabby application binary basename
    crit: baseline
    for: [elf, macho, pe]
    size_min: 100000
    if:
      type: basename
      regex: '^[Tt]abby(\.exe)?$'

composite_rules:
  - id: tabby-builtin-plugin
    desc: Tabby terminal builtin plugin
    crit: notable
    for: [javascript, json, package.json]
    any:
      - id: tabby-builtin-plugin-path
      - id: tabby-builtin-plugin-dist-path
      - id: tabby-builtin-plugin-keyword
  - id: tabby-terminal-app
    for: [elf, macho, pe]
    desc: Tabby terminal application binary
    crit: notable
    conf: 0.97
    all:
      - id: tabby-install-path
      - id: tabby-app-basename

  - id: tabby-terminal-ssh
    desc: Tabby terminal SSH plugin
    crit: notable
    conf: 0.95
    any:
      - id: tabby-ssh-builtin-plugin-path
      - id: tabby-ssh-plugin-name
