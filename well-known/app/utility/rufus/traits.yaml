defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 100000
  size_max: 20000000

traits:
  - id: rufus-product-name
    desc: Rufus PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Rufus
  - id: rufus-company-name
    desc: Rufus PE company metadata
    if:
      type: value
      path: pe.version.company
      exact: Akeo Consulting
  - id: rufus-signer
    desc: Claims Akeo Consulting certificate subject
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=Akeo Consulting\b'
  - id: rufus-site-comments
    desc: Rufus website PE comments field
    if:
      type: value
      path: pe.version.comments
      regex: '(?i)^https?://(www\.)?rufus\.ie/?$'
  - id: rufus-batard-copyright
    desc: Pete Batard Rufus copyright notice
    if:
      type: value
      path: pe.version.copyright
      regex: '(?i)Pete Batard'

  # Rufus ships Pete Batard's public UEFI helpers (UEFI:NTFS driver and the
  # UEFI MD5 tool) as embedded EFI PEs. Their GitHub Actions build paths name
  # the project inside the member itself, so the identity lives per member.
  - id: uefi-helper-build-path
    desc: Public UEFI:NTFS or uefi-md5sum build path
    crit: notable
    conf: 0.97
    size_min: 1
    if:
      type: text
      regex: '/home/runner/work/uefi-(ntfs|md5sum)/uefi-(ntfs|md5sum)/'

composite_rules:
  - id: rufus-official-binary
    desc: Official Rufus Windows binary
    crit: notable
    conf: 0.99
    all:
      - id: rufus-product-name
      - id: rufus-company-name
      - id: rufus-signer

  # UPX-unpacked layers lose Authenticode; version metadata still identifies
  # official Rufus and must suppress boot-media/update false positives.
  - id: rufus-official-context
    desc: Official Rufus input context including unpacked layers
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: rufus-product-name
      - id: rufus-company-name
      - id: rufus-site-comments
      - id: rufus-batard-copyright
