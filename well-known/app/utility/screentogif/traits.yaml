# ScreenToGif — open-source screen/webcam recorder by Nicke Manarin.
# Single-file .NET publishes embed the app DLLs as resources and the product
# legitimately reads CurrentVersion\Run for optional "start with Windows".
# That combination trips resource-loader + Run-key hostiles meant for droppers.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000

traits:
  - id: screentogif-product-name
    desc: ScreenToGif product name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: ScreenToGif

  - id: screentogif-company-name
    desc: Nicke Manarin company identity
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: Nicke Manarin

  - id: screentogif-original-filename
    desc: ScreenToGif.dll original filename
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.original_filename
      exact: ScreenToGif.dll

  - id: screentogif-internal-name
    desc: ScreenToGif.dll internal name
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.internal_name
      exact: ScreenToGif.dll

composite_rules:
  - id: screentogif-identity
    desc: ScreenToGif recorder product identity
    crit: notable
    conf: 0.98
    all:
      - id: screentogif-product-name
      - id: screentogif-company-name
    any:
      - id: screentogif-original-filename
      - id: screentogif-internal-name

  - id: screentogif-app-context
    desc: Recognized ScreenToGif application context
    crit: exception
    conf: 0.99
    all:
      - id: screentogif-identity
      - id: screentogif-product-name
