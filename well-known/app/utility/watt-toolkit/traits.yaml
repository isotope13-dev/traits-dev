# Watt Toolkit (Steam++) ships single-file .NET hosts whose OriginalFilename
# is the sibling .dll, and tiny framework assemblies that embed https://steampp.net/
# as a namespace URL. Neither shape is a renamed stager.
defaults:
  crit: notable
  conf: 0.97
  platforms: [windows]
  for: [pe]
  size_min: 4096
  size_max: 30000000
traits:
  - id: accelerator-basename
    desc: Watt Toolkit accelerator host
    if:
      type: basename
      exact: Steam++.Accelerator.exe
      case_insensitive: true
  - id: wtts-assembly-prefix
    desc: Watt Toolkit WTTS assembly
    if:
      type: path
      regex: '(?i)(^|/)BD\.WTTS\.'
  - id: common-primitives-prefix
    desc: Watt Toolkit primitives assembly
    if:
      type: path
      regex: '(?i)(^|/)BD\.Common\.Primitives\.'
