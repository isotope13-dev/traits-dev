# The historical Yandex Pack downloader is a signed installer component.
# Its download-and-launch behavior is expected only with both its official
# endpoint and its partner-oriented command-line banner.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 1048576
  crit: notable
  conf: 0.99

traits:
- id: partner-downloader-cli-banner
  desc: Yandex Pack partner downloader banner
  if:
    type: text
    exact: 'For using type: downloader.exe --partner <name> [--distr <params>] [--try] <download try count> [--sync]'
    section: .rdata

composite_rules:
- id: official-yandex-pack-downloader
  desc: Official Yandex Pack installer downloader
  crit: exception
  conf: 0.99
  all:
  - id: metadata/signed/leaf::ooo-yandex
  - id: partner-downloader-cli-banner
  - id: micro-behaviors/communications/http/get::yandex-pack-download-base
