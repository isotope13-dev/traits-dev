# eoka is a legitimate browser-automation CLI built on Chrome DevTools Protocol.
# Its agent skill documents profile cloning and CDP workflows that resemble
# stealer collection unless the product identity is recognized.
defaults:
  platforms: [unix, windows]
  for: [markdown, rust, javascript, shell]
  crit: notable
  conf: 0.99

traits:
  - id: project-skill-name
    desc: eoka agent skill name field
    for: [markdown]
    if:
      type: value
      path: skill.name
      exact: eoka

  - id: upstream-repository
    desc: eoka-tools upstream repository
    for: [markdown, text, rust]
    if:
      type: text
      regex: '(?i)github\.com/shrimp-software/eoka-tools'

  - id: cdp-browser-cli-heading
    desc: eoka browser automation CLI heading
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# eoka — Browser Automation CLI\s*$'

composite_rules:
  - id: eoka-tools-context
    desc: eoka browser automation documentation archive
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: project-skill-name
      - id: upstream-repository
      - id: cdp-browser-cli-heading
