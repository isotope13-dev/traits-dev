# Appointment Hour Booking — CodePeople WordPress booking plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: appointment-hour-booking plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])appointment-hour-booking([\\/]|$)'

  - id: plugin-header
    desc: Appointment Hour Booking plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^Plugin Name:\s*Appointment Hour Booking\s*$'

  - id: codepeople-author-uri
    desc: apphourbooking.dwbooster.com author URI
    for: [php]
    if:
      type: text
      substr: apphourbooking.dwbooster.com

composite_rules:
  - id: appointment-hour-booking-plugin
    desc: CodePeople appointment hour booking plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: codepeople-author-uri
