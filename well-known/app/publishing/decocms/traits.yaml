defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  size_max: 5000000
traits:
- id: package-name
  desc: decoCMS npm package name
  crit: notable
  conf: 0.98
  for: [package.json]
  if:
    type: value
    path: name
    exact: decocms
- id: blocks-cli-package-name
  desc: deco blocks-cli npm package name
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: "@decocms/blocks-cli"

- id: blocks-cli-npm-archive-name
  desc: deco blocks-cli npm archive name
  crit: notable
  conf: 0.99
  for: [npm]
  if:
    type: value
    path: npm.name
    exact: "@decocms/blocks-cli"

- id: blocks-repository-url
  desc: deco blocks monorepo repository URL
  crit: notable
  conf: 0.98
  for: [package.json]
  if:
    type: value
    path: repository.url
    regex: 'github\.com/decocms/blocks(\.git)?'

- id: blocks-npm-archive-repository
  desc: deco blocks-cli npm archive repository
  crit: notable
  conf: 0.98
  for: [npm]
  if:
    type: value
    path: npm.repository.url
    regex: 'github\.com/decocms/blocks(\.git)?'

- id: studio-package-name
  desc: deco Studio workspace package name
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: "@decocms/studio"
- id: studio-repository-url
  desc: deco Studio source repository URL
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: repository.url
    regex: 'github\.com/decocms/studio(\.git)?'
- id: archive-path
  desc: decocms npm pack archive path
  crit: notable
  conf: 0.98
  for: [tar]
  size_max: 50000000
  if:
    type: path
    regex: '(^|[\\/])decocms-[0-9][^\\/]*\.tgz$'
- id: visual-editor-activate-message
  desc: Visual editor activation message
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: visual-editor::activate
- id: iframe-bootstrap-script-constant
  desc: Iframe bootstrap script constant
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: IFRAME_BOOTSTRAP_SCRIPT
- id: local-service-manager-context
  desc: Local service manager context
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: PostgreSQL[\s\S]{0,120}NATS[\s\S]{0,120}running
composite_rules:
- id: decocms-package
  desc: decoCMS self-hosted MCP gateway package
  crit: notable
  any:
  - id: package-name
  - id: blocks-cli-package-name
  - id: blocks-cli-npm-archive-name
  - id: blocks-repository-url
  - id: blocks-npm-archive-repository
  - id: studio-package-name
  - id: studio-repository-url
  - id: archive-path
  - id: local-service-manager

- id: decocms-blocks-cli-context
  desc: deco blocks-cli migration tooling context
  crit: exception
  conf: 0.98
  for: [package.json, npm, javascript, typescript, tar]
  any:
    - id: blocks-cli-package-name
    - id: blocks-cli-npm-archive-name
    - id: blocks-repository-url
    - id: blocks-npm-archive-repository
- id: visual-editor-iframe-bootstrap
  desc: decoCMS visual editor iframe bootstrap
  crit: notable
  all:
  - id: visual-editor-activate-message
  - id: iframe-bootstrap-script-constant
- id: local-service-manager
  desc: decoCMS local service manager
  crit: notable
  all:
  - id: local-service-manager-context
  - id: visual-editor-activate-message
