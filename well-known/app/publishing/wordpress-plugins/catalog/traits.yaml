defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  - id: wordpress-plugin-path-core
    desc: Known WordPress plugin package path
    if:
      type: path
      regex: '(?i)(wp-fastest-cache|backuply|secupress|wp-all-import)'
  - id: wordpress-plugin-path-more
    desc: Known WordPress plugin package path
    if:
      type: path
      regex: '(?i)(popup-maker|instawp-connect|iwp-client|duplicator)'
  - id: wordpress-plugin-path-extra
    desc: Known WordPress plugin package path
    if:
      type: path
      regex: '(?i)(updraftplus|file-manager-advanced|post-smtp|widget-options)'
composite_rules:
  - id: known-wordpress-plugin
    desc: Known benign WordPress plugin package
    crit: notable
    any:
      - id: well-known/app/publishing/wordpress-plugins/marketing::wordpress-plugin-path-ai-engine
      - id: wordpress-plugin-path-core
      - id: well-known/app/publishing/wordpress-plugins/performance
      - id: well-known/app/publishing/wordpress-plugins/site-admin
      - id: wordpress-plugin-path-more
      - id: well-known/app/publishing/wordpress-plugins/marketing::wordpress-plugin-path-seo
      - id: wordpress-plugin-path-extra
      - id: well-known/app/publishing/wordpress-plugins/marketing::wordpress-plugin-path-jetpack
      - id: well-known/app/publishing/wordpress-plugins/commerce
      - id: well-known/app/publishing/wordpress-plugins/builder
      - id: well-known/app/publishing/wordpress-plugins/security::wordpress-plugin-path-letsencrypt-ssl
      - id: well-known/app/publishing/wordpress-plugins/security::wordpress-plugin-path-ninjafirewall
      - id: well-known/app/publishing/wordpress-plugins/social::wordpress-plugin-path-reviews-feed
      - id: well-known/app/publishing/wordpress-plugins/social::wordpress-plugin-path-polldaddy
