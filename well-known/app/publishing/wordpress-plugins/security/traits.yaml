defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  - id: wp-hide-security-enhancer-plugin-path
    desc: WP Hide Security Enhancer plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])wp-hide-security-enhancer([\\/]|$)'
  - id: wp-hide-security-enhancer-plugin-header
    desc: WP Hide Security Enhancer plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*WP Hide\s*&\s*Security Enhancer\s*$'
  - id: wordpress-plugin-path-loginwp
    desc: LoginWP WordPress plugin package path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])peters-login-redirect([\\/]|$)'
  - id: loginwp-plugin-header
    desc: LoginWP WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*LoginWP\s*\(Formerly Peter''s Login Redirect\)\s*$'
  - id: wordpress-plugin-path-mikesoft-teamvault
    desc: Mikesoft TeamVault WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])mikesoft-teamvault([\\/]|$)'
  - id: mikesoft-teamvault-plugin-header
    desc: Mikesoft TeamVault WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Mikesoft TeamVault'
  - id: mikesoft-teamvault-constant-marker
    desc: Mikesoft TeamVault MSTV constant marker
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: MSTV_PLUGIN_DIR
  - id: wordpress-plugin-path-letsencrypt-ssl
    desc: WP Let's Encrypt plugin package path
    if:
      type: path
      regex: '(?i)(^|[\\/])wp-letsencrypt-ssl([\\/]|$)'
  - id: wordpress-plugin-path-ninjafirewall
    desc: NinjaFirewall WordPress plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])ninjafirewall([\\/]|$)'
  - id: wordpress-security-plugin-path
    desc: WordPress security plugin path
    if:
      type: path
      regex: '(?i)secupress'
  - id: aiowps-security-plugin-path
    desc: All-In-One Security WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, text]
    if:
      type: path
      regex: '(?i)all-in-one-wp-security-and-firewall'
  - id: ipsentry-security-plugin-path
    desc: Predax Security WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])ipsentry-security([\\/]|$)'
  - id: ipsentry-security-plugin-header
    desc: Predax Security WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Predax Security\s*[—-]\s*Block VPN, Proxy & Tor Traffic\s*$'
  # DominoGuard's documented emergency-recovery toolkit legitimately emits a
  # short-lived standalone script that can create an administrator account.
  - id: dominoguard-security-plugin-path
    desc: DominoGuard Security plugin package path
    crit: notable
    conf: 0.99
    for: [php, javascript, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])dominoguard-security([\\/]|$)'
  - id: dominoguard-recovery-toolkit-marker
    desc: DominoGuard emergency recovery toolkit marker
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: DominoGuard Emergency Recovery Toolkit
  - id: bitfire-plugin-path
    desc: BitFire WordPress firewall package path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])bitfire([\\/]|$)'
composite_rules:
  - id: loginwp-plugin-context
    desc: LoginWP WordPress plugin package identity
    crit: notable
    conf: 0.99
    for: [php]
    all:
      - id: wordpress-plugin-path-loginwp
      - id: loginwp-plugin-header
    scope: archive
  - id: mikesoft-teamvault-plugin-context
    desc: Mikesoft TeamVault WordPress plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-mikesoft-teamvault
      - id: mikesoft-teamvault-plugin-header
  - id: wordpress-security-plugin
    desc: Known WordPress security plugin
    crit: notable
    all:
      - id: well-known/app/publishing/wordpress-plugins/catalog::wordpress-plugin-path-core
    any:
      - id: wordpress-security-plugin-path
      - id: aiowps-security-plugin-path
  - id: dominoguard-security-context
    desc: DominoGuard recovery toolkit context
    crit: exception
    conf: 0.99
    for: [php]
    all:
      - id: dominoguard-security-plugin-path
      - id: dominoguard-recovery-toolkit-marker
