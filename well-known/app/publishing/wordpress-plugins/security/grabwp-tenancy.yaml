# GrabWP Tenancy integrity watchdog. It snapshots shared root files, and at
# the end of tenant write requests restores any change from the snapshot,
# logging the request context and leaving an admin notice. The snapshot
# mtime bookkeeping plus the restore write co-occur here as declared
# recovery behavior, not as a hidden in-place rewrite.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: snapshot-file-suffix
    desc: Snapshot file suffix marker
    if:
      type: text
      substr: .snap.php
  - id: snapshot-restore-report
    desc: Snapshot restore report text
    if:
      type: text
      substr: restored from snapshot

composite_rules:
  - id: snapshot-restore-context
    desc: Snapshot restore integrity context
    crit: exception
    conf: 0.99
    all:
      - id: snapshot-file-suffix
      - id: snapshot-restore-report
