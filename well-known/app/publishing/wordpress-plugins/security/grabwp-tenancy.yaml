defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
  conf: 0.98
traits:
- id: snapshot-file-suffix
  desc: Snapshot file suffix marker
  if:
    type: text
    substr: .snap.php
- id: snapshot-restore-report
  desc: Snapshot restore report text
  if:
    type: text
    substr: restored from snapshot
