# CenterShield (WP Center) malware-scan definitions. definitions.json is a
# signature database: built-in rules plus Linux Malware Detect and URLhaus
# feeds, with each signature's regex and literal fragments also carried
# base64-encoded (regex_b64 / common_b64). Decoding those fields yields
# webshell fragments that are detection content, not code.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99

traits:
  - id: centershield-definitions-database
    desc: CenterShield malware signature definitions
    if:
      type: text
      substr: '"credits":["WP Center Security definitions by'

  - id: centershield-includes-path
    desc: CenterShield plugin includes directory
    for: [php, json, text]
    if:
      type: path
      regex: '\bcentershield/includes/'
  - id: definitions-json-base64-layer
    desc: Decoded base64 value of definitions.json
    for: [php, json, text]
    if:
      type: path
      regex: '/definitions/definitions\.json##base64@\d+$'

composite_rules:
  # Decoded base64 layers are separate leaves and cannot see the database
  # identity above, so they are recognized by their place under the plugin's
  # definitions file. Each is one signature literal (a webshell fragment from
  # Linux Malware Detect), inert data the scanner matches against.
  - id: centershield-decoded-signature-literal
    desc: Decoded CenterShield signature literal
    for: [php, json, text]
    scope: leaf
    all:
      - id: centershield-includes-path
      - id: definitions-json-base64-layer
