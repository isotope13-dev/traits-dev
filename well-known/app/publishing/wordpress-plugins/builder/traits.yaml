defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  - id: elementor-path
    desc: Elementor plugin or integration path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)(^|[\\/])elementor([\\/]|$)'
  - id: wow-elements-plugin-header
    desc: Wow Elements plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Wow Elements Addons for Elementor\s*$'
  - id: wordpress-plugin-path-builder
    desc: Known WordPress builder plugin package path
    if:
      type: path
      regex: '(?i)nexter-extension'
  - id: wordpress-plugin-path-registration
    desc: Known WordPress registration plugin path
    if:
      type: path
      regex: '(?i)custom-registration-form-builder'
  - id: wordpress-plugin-path-ui
    desc: Known WordPress plugin UI package path
    if:
      type: path
      regex: '(?i)(premium-addons-for-elementor|pixelyoursite)'
  - id: wordpress-plugin-path-tenweb
    desc: TenWeb Speed Optimizer plugin path
    if:
      type: path
      regex: '(?i)tenweb-speed-optimizer'
  - id: wordpress-plugin-path-vision
    desc: Vision interactive map builder plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])vision([\\/]|$)'
  - id: vision-map-builder-header
    desc: Vision map builder plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Vision - Interactive Image Map Builder\s*$'
  - id: vision-rest-namespace
    desc: Vision plugin REST namespace constant
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: VISION_PLUGIN_REST_URL
composite_rules:
  - id: vision-map-builder-context
    desc: Vision interactive map builder plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-vision
      - id: vision-map-builder-header
      - id: vision-rest-namespace
