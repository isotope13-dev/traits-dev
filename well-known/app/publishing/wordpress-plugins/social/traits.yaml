defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  # Shariff Wrapper's plugin header and text domain identify the official
  # privacy-preserving social-share plugin across release versions.
  - id: shariff-wrapper-plugin-header
    desc: Shariff Wrapper WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Shariff Wrapper\s*$'
  - id: shariff-wrapper-text-domain
    desc: Shariff Wrapper WordPress text domain
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*shariff\s*$'
  - id: easy-social-feed-instagram-style-prefix
    desc: Easy Social Feed Instagram CSS prefix
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      # Match the namespace as a CSS class selector, not as an arbitrary
      # substring in comments, URLs, or prose.
      regex: '(?m)(^|[\s,{>])\.esf-insta-[A-Za-z0-9_-]+'
  # Easy Social Feed's Twitter/X feed uses the `.esf-tw-` class namespace, a
  # sibling of `.esf-insta-`/`.esf-fb-` (esf = Easy Social Feed).
  - id: easy-social-feed-twitter-style-prefix
    desc: Easy Social Feed Twitter CSS prefix
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      substr: '.esf-tw-'
  # Easy Social Feed ships a shared icon webfont under the `esf-custom-icons`
  # font-family (referenced by its `.icon-esf-*` glyph classes).
  - id: easy-social-feed-icon-font
    desc: Easy Social Feed custom icon font
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      substr: 'esf-custom-icons'
  # Easy Social Feed's lightbox/popup (a re-prefixed Magnific Popup) namespaces
  # its overlay classes with `.esfp-` (esfp = Easy Social Feed Popup).
  - id: easy-social-feed-popup-style-prefix
    desc: Easy Social Feed popup CSS prefix
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      substr: '.esfp-'
  # Easy Social Feed's Facebook feed uses the `.esf-fb-` class namespace, the
  # sibling of `.esf-insta-` above (esf = Easy Social Feed). This was previously
  # mislabeled "Easy Facebook Likebox"; that is a DIFFERENT plugin whose real
  # prefix is `.efbl-`, detected by easy-facebook-likebox-style-prefix below.
  - id: easy-social-feed-facebook-style-prefix
    desc: Easy Social Feed Facebook CSS prefix
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      substr: '.esf-fb-'
  # Easy Facebook Likebox (efbl = Easy FaceBook Likebox) namespaces every
  # frontend class with `.efbl-` (e.g. .efbl-container, .efbl-post). Distinct
  # from the Easy Social Feed family above.
  - id: easy-facebook-likebox-style-prefix
    desc: Easy Facebook Likebox CSS prefix
    crit: notable
    conf: 0.99
    for: [text]
    if:
      type: text
      # Match the namespace as a CSS class selector, not an arbitrary
      # substring in comments, URLs, or prose.
      regex: '(?m)(^|[\s,{>])\.efbl-[A-Za-z0-9_-]+'
  - id: wordpress-plugin-path-coresocial
    desc: coreSocial WordPress plugin package path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])coresocial([\\/]|$)'
  - id: wordpress-plugin-path-reviews-feed
    desc: Smash Balloon Reviews Feed WordPress plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])reviews-feed([\\/]|$)'
  - id: wordpress-plugin-path-polldaddy
    desc: Crowdsignal / Polldaddy WordPress plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])polldaddy([\\/]|$)'
  - id: wordpress-plugin-path-email-subscribers
    desc: Email Subscribers WordPress plugin package path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])email-subscribers([\\/]|$)'
  - id: wordpress-plugin-path-info-cards
    desc: Info Cards WordPress plugin package path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])info-cards([\\/]|$)'
  - id: info-cards-plugin-header
    desc: Info Cards WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Info Cards\s*$'
composite_rules:
  - id: shariff-wrapper-plugin
    desc: Shariff Wrapper WordPress plugin
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: shariff-wrapper-plugin-header
      - id: shariff-wrapper-text-domain
  - id: info-cards-plugin-context
    desc: Info Cards WordPress plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-info-cards
      - id: info-cards-plugin-header
