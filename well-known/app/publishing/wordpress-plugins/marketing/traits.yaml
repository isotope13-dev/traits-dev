defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  # The plugin header is the stable program identity across releases.  Keep
  # the matcher on the header rather than a package path or release number so
  # repackaged and newer versions remain identifiable.
  - id: seobot-ai-plugin-header
    desc: SEOBot AI WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*SEOBot AI\b'
  - id: wordpress-plugin-path-ai-engine
    desc: AI Engine WordPress plugin package path
    if:
      type: path
      regex: '(?i)(^|[\\/])ai-engine([\\/]|$)'
  - id: wordpress-plugin-path-seo
    desc: Known WordPress SEO plugin path
    if:
      type: path
      regex: '(?i)squirrly-seo'
  - id: wordpress-plugin-path-jetpack
    desc: Jetpack WordPress plugin bootstrap path
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      # Automattic jetpack.php — not a nested Jetpack/ integration folder.
      exact: jetpack.php
      case_insensitive: true
  - id: wordpress-plugin-path-stats4wp
    desc: Stats4WP plugin path
    crit: notable
    if:
      type: path
      regex: '(?i)(^|[\\/])stats4wp'
  - id: wordpress-plugin-path-nelio-ab-testing
    desc: Nelio A/B Testing WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])nelio-ab-testing([\\/]|$)'
  - id: nelio-ab-testing-plugin-header
    desc: Nelio A/B Testing WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Nelio A/B Testing'
  - id: nelio-ab-testing-constant-marker
    desc: Nelio A/B Testing bootstrap constant
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: NELIO_AB_TESTING
  - id: pixelyoursite-plugin-header
    desc: PixelYourSite WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*PixelYourSite\s*$'
  - id: pixelyoursite-license-constant
    desc: PixelYourSite license name constant
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: "PYS_FREE_LICENSE_NAME"
composite_rules:
  - id: nelio-ab-testing-plugin-context
    desc: Nelio A/B Testing WordPress plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-nelio-ab-testing
      - id: nelio-ab-testing-plugin-header
  - id: pixelyoursite-plugin-context
    desc: PixelYourSite WordPress plugin identity
    crit: notable
    conf: 0.99
    for: [php, javascript]
    scope: archive
    all:
      - id: well-known/app/publishing/wordpress-plugins/builder::wordpress-plugin-path-ui
    any:
      - id: pixelyoursite-plugin-header
      - id: pixelyoursite-license-constant
