defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  - id: manage-plugin-path
    desc: Manage WordPress plugin package path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])manage([\\/]|$)'
  - id: manage-plugin-header
    desc: Manage WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Manage\s*$'
  - id: manage-system-user-marker
    desc: Manage system-user marker
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?i)_manage_system_user|manage-system-user'
  - id: wordpress-plugin-path-worker
    desc: ManageWP Worker plugin directory path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])worker([\\/]|$)'
  - id: wordpress-plugin-path-bp-local-avatars
    desc: BP Local Avatars BuddyPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])bp-local-avatars([\\/]|$)'
  - id: bp-local-avatars-plugin-header
    desc: BP Local Avatars WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*BP Local Avatars'
  - id: wordpress-plugin-path-ssa
    desc: Simply Schedule Appointments plugin path
    if:
      type: path
      regex: '(?i)simply-schedule-appointments'
  - id: wordpress-plugin-path-calculated-fields-form
    desc: Calculated Fields Form WordPress plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])calculated-fields-form([\\/]|$)'
  - id: wordpress-plugin-path-loco-translate
    desc: Loco Translate WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])loco-translate([\\/]|$)'
  - id: loco-translate-plugin-header
    desc: Loco Translate WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      # WordPress plugin headers are bare keys inside the opening /* … */ block
      # (no leading "* " as in docblocks).
      regex: '(?im)^\s*Plugin Name:\s*Loco Translate\s*$'
composite_rules:
  - id: manage-system-user-context
    desc: Manage system-user implementation context
    crit: notable
    conf: 0.99
    for: [php]
    all:
      - id: manage-plugin-path
      - id: manage-system-user-marker
  - id: manage-plugin-context
    desc: Manage WordPress plugin package identity
    crit: notable
    conf: 0.99
    for: [php]
    all:
      - id: manage-plugin-path
      - id: manage-plugin-header
    scope: archive
  - id: loco-translate-plugin-context
    desc: Loco Translate WordPress plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-loco-translate
      - id: loco-translate-plugin-header
  - id: bp-local-avatars-plugin-context
    desc: BP Local Avatars BuddyPress plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-bp-local-avatars
      - id: bp-local-avatars-plugin-header
  - id: wordpress-maintenance-plugin
    desc: Known WordPress backup, migration, or security plugin
    crit: notable
    any:
      - id: well-known/app/publishing/wordpress-plugins/catalog::wordpress-plugin-path-core
      - id: wordpress-plugin-path-worker
      - id: well-known/app/publishing/wordpress-plugins/catalog::wordpress-plugin-path-more
      - id: well-known/app/publishing/wordpress-plugins/marketing::wordpress-plugin-path-seo
      - id: well-known/app/publishing/wordpress-plugins/catalog::wordpress-plugin-path-extra
      - id: well-known/app/publishing/wordpress-plugins/performance::wordpress-plugin-path-fast-backups
      - id: well-known/app/publishing/wordpress-plugins/commerce::wordpress-plugin-path-downloads
      - id: well-known/app/publishing/wordpress-plugins/commerce::wordpress-plugin-path-commerce
      - id: well-known/app/publishing/wordpress-plugins/commerce::wordpress-plugin-path-payments
      - id: well-known/app/publishing/wordpress-plugins/builder::wordpress-plugin-path-builder
