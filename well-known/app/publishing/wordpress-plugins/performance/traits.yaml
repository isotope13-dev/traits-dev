defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  - id: wordpress-plugin-path-imagify
    desc: Imagify WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)imagify'
  - id: wordpress-plugin-path-wp-piwik
    desc: WP-Piwik WordPress plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)wp-piwik'
  - id: wordpress-plugin-path-seraphinite-accelerator
    desc: Seraphinite Accelerator plugin path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])seraphinite-accelerator([\\/]|$)'
  - id: wordpress-plugin-path-w3-total-cache
    desc: W3 Total Cache WordPress plugin package path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])w3-total-cache([\\/]|$)'
  - id: wordpress-plugin-path-cloudflare-page-cache
    desc: Cloudflare Page Cache plugin path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])wp-cloudflare-page-cache([\\/]|$)'
  - id: wordpress-plugin-path-fast-velocity-minify
    desc: Fast Velocity Minify plugin path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])fast-velocity-minify([\\/]|$)'
  - id: wordpress-plugin-path-fast-backups
    desc: Fast Backups WordPress plugin package path
    if:
      type: path
      regex: '(?i)(^|[\\/])fast-backups([\\/]|$)'
  - id: wordpress-plugin-path-wp-compress
    desc: WP Compress image optimizer plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])wp-compress-image-optimizer([\\/]|$)'
  - id: wp-compress-plugin-header
    desc: WP Compress WordPress plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin name:\s*WP Compress'
  - id: wp-compress-textdomain-constant
    desc: WP Compress textdomain constant
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: wp-compress-image-optimizer
composite_rules:
  - id: wp-compress-plugin-context
    desc: WP Compress image optimizer plugin identity
    crit: notable
    conf: 0.99
    for: [php, zip]
    scope: archive
    all:
      - id: wordpress-plugin-path-wp-compress
      - id: wp-compress-textdomain-constant
    any:
      - id: wp-compress-plugin-header
