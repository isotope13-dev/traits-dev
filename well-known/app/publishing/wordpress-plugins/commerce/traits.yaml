defaults:
  platforms: [windows, unix]
  for: [php, javascript, shell, ole]
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
  - id: wordpress-plugin-path-downloads
    desc: Known WordPress download plugin path
    if:
      type: path
      regex: '(?i)(download-monitor|download-manager)'
  - id: wordpress-plugin-path-commerce
    desc: Known WordPress commerce plugin package path
    if:
      type: path
      regex: '(?i)(crmlytics|e2pdf|easycommerce|weareplanet)'
  - id: wordpress-plugin-path-multiparcels
    desc: MultiParcels WooCommerce plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])multiparcels-shipping-for-woocommerce([\\/]|$)'
  - id: wordpress-plugin-path-payments
    desc: Known WordPress payment plugin package path
    if:
      type: path
      regex: '(?i)(verified-crypto-checkout|videomail-for-ninja-forms)'
  - id: wordpress-plugin-path-rabo-omnikassa
    desc: Rabo Omnikassa WordPress payment plugin path
    crit: notable
    if:
      type: path
      regex: '(?i)(^|[\\/])woo-rabo-omnikassa([\\/]|$)'
  - id: wordpress-plugin-path-woo-razorpay
    desc: WooCommerce Razorpay plugin package path
    crit: notable
    if:
      type: path
      regex: '(?i)(^|[\\/])woo-razorpay([\\/]|$)'
  - id: wordpress-plugin-path-invoice-payment
    desc: Link Invoice Payment WooCommerce plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])invoice-payment-for-woocommerce([\\/]|$)'
  - id: wordpress-plugin-path-email-inquiry
    desc: WC Email Inquiry Cart Options plugin path
    crit: notable
    conf: 0.99
    for: [php, javascript, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])woocommerce-email-inquiry-cart-options([\\/]|$)'
  - id: invoice-payment-woocommerce-plugin-header
    desc: Link Invoice Payment WooCommerce plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Invoice Payment for WooCommerce\s*$'
  - id: email-inquiry-woocommerce-plugin-header
    desc: WC Email Inquiry Cart Options plugin header
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Email Inquiry & Cart Options for WooCommerce'
  - id: woo-razorpay-test-bootstrap
    desc: WooCommerce Razorpay PHPUnit bootstrap path
    crit: notable
    for: [php]
    if:
      type: path
      regex: '(?i)woo-razorpay.{0,160}bootstrap\.php$'
composite_rules:
  - id: woo-razorpay-test-context
    desc: WooCommerce Razorpay PHPUnit test context
    crit: exception
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-woo-razorpay
      - id: woo-razorpay-test-bootstrap
  - id: email-inquiry-woocommerce-plugin-context
    desc: Email Inquiry Cart Options WooCommerce plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: wordpress-plugin-path-email-inquiry
      - id: email-inquiry-woocommerce-plugin-header
