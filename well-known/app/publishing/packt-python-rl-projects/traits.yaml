# Packt "Python Reinforcement Learning Projects" (ISBN 978-1-78899-322-7).
# EPUB chapters embed A3C/TensorFlow listings (os.system, tmux, sleep);
# those are book samples, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: isbn
    desc: Packt Python RL Projects ISBN
    if:
      type: text
      substr: '978-1-78899-322-7'

  - id: book-title
    desc: Packt Python RL Projects book title
    if:
      type: text
      substr: Python Reinforcement Learning Projects

  - id: a3c-chapter-heading
    desc: A3C implementation chapter heading
    if:
      type: text
      substr: Implementation of A3C
