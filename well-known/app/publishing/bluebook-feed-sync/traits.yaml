# BlueBook Feed Sync — a WordPress Facebook feed plugin from SDAweb.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: wordpress-plugin-path
    desc: BlueBook Feed Sync plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])bluebook-feed-sync([\\/]|$)'

  - id: plugin-header
    desc: BlueBook Feed Sync plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*BlueBook Feed Sync\s*$'

composite_rules:
  - id: bluebook-feed-sync-plugin
    desc: BlueBook Feed Sync WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: wordpress-plugin-path
      - id: plugin-header
