# Spree CM Commissioner — Spree commerce commissioner extension gem.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, text, archives]
  crit: notable
  conf: 0.99

traits:
  - id: gem-package-name
    desc: spree_cm_commissioner Ruby gem name
    for: [gem, text]
    if:
      type: text
      regex: '(?im)^name:\s*spree_cm_commissioner\s*$'

  - id: spree-cm-commissioner-module
    desc: SpreeCmCommissioner Ruby module declaration
    for: [ruby]
    if:
      type: text
      substr: module SpreeCmCommissioner

  - id: spree-cm-engine-require
    desc: spree_cm_commissioner engine require
    for: [ruby]
    if:
      type: text
      substr: spree_cm_commissioner/engine

  - id: gem-basename
    desc: spree_cm_commissioner gem archive basename
    for: [gem]
    if:
      type: basename
      regex: '(?i)^spree_cm_commissioner-.*\.gem$'

composite_rules:
  - id: spree-cm-commissioner-gem
    desc: Spree CM Commissioner commerce extension gem
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: gem-package-name
      - id: gem-basename
      - id: spree-cm-commissioner-module
      - id: spree-cm-engine-require
