# Inisev Subs — cross-plugin WP promo carousel and try-it-out UI.
defaults:
  platforms: [windows, unix]
  for: [php, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: php-namespace
    desc: Inisev Subs PHP namespace
    for: [php]
    if:
      type: text
      substr: 'namespace Inisev\Subs'

  - id: try-out-class
    desc: Inisev try-out plugins class
    for: [php]
    if:
      type: text
      substr: Inisev_Try_Out_Plugins

  - id: carousel-nonce
    desc: Inisev carousel AJAX nonce object
    if:
      type: text
      substr: inisev_carousel

  - id: install-ajax
    desc: Inisev plugin install AJAX action
    for: [javascript]
    if:
      type: text
      substr: 'action=inisev_installation'

  - id: promo-ajax
    desc: Inisev promo banner AJAX action
    for: [javascript]
    if:
      type: text
      substr: insPP_ajax
