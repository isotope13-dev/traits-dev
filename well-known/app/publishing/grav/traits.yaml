# Grav CMS (getgrav/grav) — flat-file CMS by Trilby Media. Identity only.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, composer.json, archives]
  crit: notable
  conf: 0.96

traits:
  - id: grav-composer-name
    desc: Grav CMS Composer package name
    for: [composer.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: getgrav/grav

  - id: grav-homepage
    desc: Grav CMS project homepage
    for: [composer.json]
    conf: 0.97
    if:
      type: value
      path: homepage
      exact: https://getgrav.org

  - id: grav-common-namespace
    desc: Grav Common PHP namespace declaration
    for: [php]
    conf: 0.97
    if:
      type: text
      substr: 'namespace Grav\Common'

  - id: grav-scheduler-package
    desc: Grav Scheduler package documentation tag
    for: [php]
    conf: 0.98
    if:
      type: text
      substr: '@package    Grav\Common\Scheduler'

  - id: grav-plugin-api-namespace
    desc: Grav API plugin exception namespace
    for: [php]
    conf: 0.96
    if:
      type: text
      substr: 'namespace Grav\Plugin\Api'

  - id: grav-package-member
    desc: Member of a getgrav/grav package archive
    for: [php, javascript]
    if:
      type: value
      path: composer.json::name
      exact: getgrav/grav

composite_rules:
  - id: grav-cms-identity
    desc: Grav flat-file CMS identity
    crit: notable
    conf: 0.97
    any:
      - id: grav-composer-name
      - id: grav-common-namespace
      - id: grav-scheduler-package
      - id: grav-plugin-api-namespace
      - id: grav-package-member
