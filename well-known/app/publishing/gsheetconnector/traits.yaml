# GSheetConnector for Core Lite — WordPress Google Sheets sync plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: gsheetconnector-for-core-lite plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])gsheetconnector-for-core-lite([\\/]|$)'

  - id: plugin-header
    desc: GSheetConnector for Core Lite plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*GSheetConnector for Core Lite\s*$'

  - id: text-domain
    desc: gsheetconnector-for-core-lite text domain
    for: [php]
    if:
      type: text
      substr: gsheetconnector-for-core-lite

  - id: oauth-api-url
    desc: GSheetConnector OAuth API endpoint
    for: [php]
    if:
      type: text
      regex: 'https?://oauth\.gsheetconnector\.com/[A-Za-z0-9._/-]+'

  - id: settings-source-path
    desc: GSheetConnector settings source path
    crit: notable
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])gsheetconnector-for-core-lite[\\/]settings\.php$'

composite_rules:
  - id: gsheetconnector-source-context
    desc: GSheetConnector plugin source-file context
    crit: exception
    conf: 0.99
    all:
      - id: plugin-path
      - id: settings-source-path

  - id: gsheetconnector-core-lite-plugin
    desc: GSheetConnector WordPress Google Sheets plugin
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: oauth-api-url
