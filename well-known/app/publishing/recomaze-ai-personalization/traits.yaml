# Recomaze AI Personalization — official WooCommerce/WordPress plugin
# for recomaze.ai product recommendations. Bundled webpack admin UI
# pulls @react-pdf/renderer (CryptoJS RC4 for PDF export); that is
# document generation, not a stream-cipher dropper.
defaults:
  platforms: [unix, windows]
  for: [php, zip, package.json, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: Recomaze WordPress plugin directory path
    if:
      type: path
      regex: '(?i)(^|[\\/])recomaze-ai-personalization([\\/]|$)'

  - id: plugin-header
    desc: Recomaze AI Personalization plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Recomaze AI Personalization\s*$'

  - id: plugin-uri
    desc: Recomaze WooCommerce integration plugin URI
    for: [php, markdown]
    if:
      type: text
      substr: recomaze.ai/integration-guides/woocommerce-integration

  - id: version-const
    desc: RECOMAZE_VERSION plugin constant
    for: [php]
    if:
      type: text
      substr: RECOMAZE_VERSION

  - id: package-name
    desc: wordpress-recomaze-integration npm name
    for: [package.json]
    if:
      type: value
      path: name
      exact: wordpress-recomaze-integration

  - id: wordpress-plugin-name
    desc: Recomaze WordPress plugin name fact
    for: [zip]
    if:
      type: value
      path: source.wordpress.plugin_name
      exact: Recomaze AI Personalization

  - id: wordpress-slug
    desc: Recomaze WordPress plugin slug fact
    for: [zip]
    if:
      type: value
      path: source.wordpress.slug
      exact: recomaze-ai-personalization

composite_rules:
  - id: recomaze-ai-personalization-plugin
    desc: Recomaze AI Personalization WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: plugin-uri
      - id: version-const
      - id: package-name
      - id: wordpress-plugin-name
      - id: wordpress-slug
