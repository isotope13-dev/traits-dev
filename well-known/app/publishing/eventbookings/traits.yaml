# EventBookings — WordPress event booking and ticketing plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, markdown, text, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: EventBookings WordPress plugin header
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: EventBookings'

  - id: eventbookings-constant-marker
    desc: EVENTBOOKINGS_PLUGIN_PATH constant marker
    for: [php]
    if:
      type: text
      substr: EVENTBOOKINGS_PLUGIN_PATH

  - id: eventbookings-api-url-marker
    desc: EventBookings API URL marker
    for: [php, javascript]
    if:
      type: text
      substr: api-rto.eventbookings.com

composite_rules:
  - id: eventbookings-plugin-context
    desc: EventBookings WordPress ticketing plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-header-name
    any:
      - id: eventbookings-constant-marker
      - id: eventbookings-api-url-marker
