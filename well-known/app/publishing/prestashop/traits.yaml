# PrestaShop (and forks such as QloApps) regenerate the shop's .htaccess from
# Tools::generateHtaccess(). When the admin ticks "disable ModSecurity" it
# writes `SecFilterEngine Off` into that file, which reads as a security-filter
# bypass in a dropped config but is a documented shop setting in the PHP
# generator. Identity is the generator's own banner plus its option variable.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: htaccess-generator-banner
    desc: PrestaShop htaccess generator banner
    if:
      type: text
      substr: '.htaccess automaticaly generated by PrestaShop'

  - id: htaccess-modsec-option
    desc: PrestaShop disable-ModSecurity shop option
    if:
      type: text
      word: disable_modsec

composite_rules:
  - id: htaccess-generator-source
    desc: PrestaShop htaccess generator source
    crit: exception
    all:
      - id: htaccess-generator-banner
      - id: htaccess-modsec-option
