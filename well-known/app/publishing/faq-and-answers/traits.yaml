# FAQ and Answers (Awesome FAQ) — bPlugins WordPress Gutenberg FAQ block plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: Awesome FAQ plugin header name
    if:
      type: text
      substr: 'Plugin Name: Awesome FAQ'

  - id: plugin-textdomain
    desc: Awesome FAQ WordPress textdomain
    if:
      type: text
      substr: 'Text Domain: faa'

  - id: bplugins-author-uri
    desc: bPlugins author URI marker
    if:
      type: text
      substr: 'Author URI: https://bplugins.com'

composite_rules:
  - id: faq-and-answers-plugin-context
    desc: FAQ and Answers WordPress plugin identity
    all:
      - id: plugin-header-name
    any:
      - id: plugin-textdomain
      - id: bplugins-author-uri
