# Fullmetrix — WooCommerce marketing analytics connector plugin.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, markdown, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 5000000

traits:
  - id: plugin-slug-path
    desc: fullmetrix plugin directory path
    if:
      type: path
      regex: '(?i)fullmetrix([\\/]|$)'

  - id: plugin-header
    desc: Fullmetrix WordPress plugin header
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: Fullmetrix'

  - id: plugin-version-constant
    desc: FULLMETRIX_VERSION plugin constant
    for: [php]
    if:
      type: text
      substr: FULLMETRIX_VERSION

  - id: connection-code-option
    desc: fullmetrix_connection_code WordPress option
    for: [php]
    if:
      type: text
      substr: fullmetrix_connection_code

  - id: signed-request-header
    desc: X-Fullmetrix-Signature request header
    for: [php]
    if:
      type: text
      substr: X-Fullmetrix-Signature

  - id: api-base-url
    desc: fullmetrix.com plugin API base URL
    for: [php, markdown, text]
    if:
      type: text
      substr: fullmetrix.com/api/plugin

  - id: stream-exporter-class
    desc: Fullmetrix_Stream_Exporter WooCommerce exporter
    for: [php]
    if:
      type: text
      substr: Fullmetrix_Stream_Exporter

  - id: zip-basename
    desc: fullmetrix plugin zip basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)^fullmetrix-.*\.zip$'

composite_rules:
  - id: fullmetrix-woocommerce-connector
    desc: Fullmetrix WooCommerce analytics connector
    crit: notable
    conf: 0.97
    scope: outer
    needs: 2
    any:
      - id: plugin-slug-path
      - id: zip-basename
      - id: plugin-header
      - id: plugin-version-constant
      - id: connection-code-option
      - id: signed-request-header
      - id: api-base-url
      - id: stream-exporter-class
