# Exactas branding asset archive — logo PNG/EPS files only.
defaults:
  platforms: [unix, windows]
  for: [zip, archives]
  crit: notable
  conf: 0.98
  size_min: 100000
  size_max: 10000000

traits:
  - id: exactas-logo-member-path
    desc: Exactas Principal logo archive member path
    if:
      type: path
      regex: '(?i)^Exactas/Principal_Exactas'

  - id: exactas-eps-logo-member
    desc: Exactas EPS vector logo member
    if:
      type: path
      exact: Exactas/Principal_Exactas-01.eps
      case_insensitive: true

  - id: exactas-color-logo-member
    desc: Exactas color PNG logo member
    if:
      type: path
      exact: Exactas/Principal_Exactas-01.png
      case_insensitive: true

composite_rules:
  - id: exactas-brand-asset-archive
    desc: Exactas logo branding asset archive
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: exactas-logo-member-path
    any:
      - id: exactas-eps-logo-member
      - id: exactas-color-logo-member
