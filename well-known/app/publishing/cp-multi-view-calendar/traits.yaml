# CP Multi View Calendar — CodePeople WordPress events calendar plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: cp-multi-view-calendar plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])cp-multi-view-calendar([\\/]|$)'

  - id: plugin-header
    desc: CP Multi View Events Calendar plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*CP Multi View Events Calendar\s*$'

  - id: codepeople-author-uri
    desc: wordpress.dwbooster.com CodePeople author URI
    for: [php]
    if:
      type: text
      substr: wordpress.dwbooster.com

composite_rules:
  - id: cp-multi-view-calendar-plugin
    desc: CodePeople multi-view events calendar plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: codepeople-author-uri
