# Adobe Experience Manager DAM web rendition JPEGs use the cq5dam.web
# WxH basename. A clean JFIF image with that name is a CMS derivative,
# not a polyglot payload.
defaults:
  platforms: [unix, windows]
  for: [jpeg]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: web-rendition-basename
    desc: AEM DAM cq5dam web JPEG rendition
    if:
      type: path
      basename: true
      regex: '^cq5dam\.web\.\d+\.\d+\.jpe?g$'
