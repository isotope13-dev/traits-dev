# Abmahn-Shield — WooCommerce legal-compliance scanner (abmahn-shield.de).
# REST checkout, wp_remote_post to the vendor API, and admin.js fetch
# are product billing, not C2.
defaults:
  platforms: [unix, windows]
  for: [php, zip, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: Abmahn-Shield plugin directory path
    if:
      type: path
      regex: '(?i)(^|[\\/])abmahn-shield([\\/]|$)'

  - id: plugin-header
    desc: Abmahn-Shield WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Abmahn-Shield\s*$'

  - id: plugin-uri
    desc: Abmahn-Shield WooCommerce plugin URI
    for: [php, markdown, text]
    if:
      type: text
      substr: abmahn-shield.de/woocommerce

  - id: api-base-const
    desc: ABMAHN_SHIELD_API_BASE vendor constant
    for: [php]
    if:
      type: text
      substr: ABMAHN_SHIELD_API_BASE

  - id: wordpress-plugin-name
    desc: Abmahn-Shield WordPress plugin name
    for: [zip]
    if:
      type: value
      path: source.wordpress.plugin_name
      exact: Abmahn-Shield

  - id: wordpress-slug
    desc: abmahn-shield WordPress plugin slug
    for: [zip]
    if:
      type: value
      path: source.wordpress.slug
      exact: abmahn-shield

composite_rules:
  - id: abmahn-shield-plugin
    desc: Abmahn-Shield WooCommerce compliance plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: plugin-uri
      - id: api-base-const
      - id: wordpress-plugin-name
      - id: wordpress-slug
