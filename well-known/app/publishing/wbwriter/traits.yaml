# wbwriter — Stainly Django CMS article/publication writer.
# can_publish is content-workflow, not a package-propagation worm.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 5000000

traits:
  - id: wheel-distribution
    desc: wbwriter wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: wbwriter

  - id: pypi-package-name
    desc: wbwriter PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: wbwriter

  - id: article-admin-perm
    desc: wbwriter article-admin permission
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: wbwriter.administrate_article
