# itzbund/gsb-sitepackage — GSB 11 TYPO3 CMS site package kickstarter.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives, shell, json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: composer-package-name
    desc: itzbund/gsb-sitepackage Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: itzbund/gsb-sitepackage

  - id: gsb-sitepackage-namespace
    desc: Itzbund GsbSitepackage PHP namespace
    for: [php, composer.json, json]
    if:
      type: text
      substr: 'Itzbund\GsbSitepackage'

  - id: gsb-sitepackage-archive-path
    desc: GSB sitepackage kickstarter archive path
    for: [archives, zip]
    if:
      type: path
      regex: '(?i)gsb-sitepackage'

  - id: gsb-core-composer-dependency
    desc: itzbund/gsb-core composer dependency
    for: [composer.json, json]
    if:
      type: text
      substr: '"itzbund/gsb-core"'

composite_rules:
  - id: itzbund-gsb-sitepackage
    desc: ITZBund GSB 11 TYPO3 site package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: composer-package-name
      - id: gsb-sitepackage-archive-path
