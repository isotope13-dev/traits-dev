# CodePeople Calculated Fields Form WordPress plugin.
defaults:
  platforms: [unix, windows]
  for: [javascript, php]
  crit: notable
  conf: 0.99

traits:
  - id: fbuilder-jquery-namespace
    desc: CFF fbuilder jQuery namespace
    for: [javascript]
    if:
      type: text
      substr: '$.fbuilder['

  - id: gutenberg-block-category
    desc: CFF Gutenberg block category slug
    for: [javascript]
    if:
      type: text
      substr: "slug:'cp-calculated-fields-form'"

  - id: elementor-widget-class
    desc: CFF Elementor widget PHP class
    for: [php]
    if:
      type: text
      substr: 'class Elementor_CFF'

composite_rules:
  - id: calculated-fields-form-plugin
    desc: CodePeople Calculated Fields Form plugin
    any:
      - id: fbuilder-jquery-namespace
      - id: gutenberg-block-category
      - id: elementor-widget-class
