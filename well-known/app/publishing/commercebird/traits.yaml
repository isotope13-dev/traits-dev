# CommerceBird — WooCommerce ERP/CRM integration and AI admin plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, markdown, text, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: CommerceBird WordPress plugin header name
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: CommerceBird'

  - id: plugin-textdomain
    desc: CommerceBird WordPress textdomain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text Domain: commercebird'

  - id: commercebird-api-host
    desc: CommerceBird SaaS API host marker
    for: [php, javascript]
    if:
      type: text
      substr: api.commercebird.com

  - id: commercebird-menu-slug
    desc: CommerceBird admin menu slug constant
    for: [php]
    if:
      type: text
      substr: commercebird-app

  - id: commercebird-namespace
    desc: CommerceBird PHP namespace marker
    for: [php]
    if:
      type: text
      substr: namespace CommerceBird

composite_rules:
  - id: commercebird-plugin-context
    desc: CommerceBird WooCommerce integration plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-header-name
    any:
      - id: plugin-textdomain
      - id: commercebird-api-host
      - id: commercebird-namespace
