# AdminEase — PrecisionWP WordPress admin toolkit plugin.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: adminease WordPress plugin directory path
    if:
      type: path
      regex: '(?i)(^|[\\/])adminease([\\/]|$)'

  - id: plugin-header-name
    desc: AdminEase WordPress plugin header name
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*AdminEase\s*$'

  - id: adminease-text-domain
    desc: adminease WordPress text domain
    for: [php]
    if:
      type: text
      substr: adminease

  - id: adminease-version-constant
    desc: ADMINEASE_VERSION plugin constant
    for: [php]
    if:
      type: text
      substr: ADMINEASE_VERSION

composite_rules:
  - id: adminease-wordpress-plugin
    desc: AdminEase WordPress admin toolkit plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header-name
      - id: adminease-text-domain
      - id: adminease-version-constant
