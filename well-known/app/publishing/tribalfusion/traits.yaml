# Tribal Fusion / Exponential Interactive web advertising tag manager.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: e9-manager-identifier
    desc: Exponential Interactive e9Manager identifier
    if:
      type: text
      substr: 'e9Manager'

  - id: tribalfusion-ad-host
    desc: Tribal Fusion ad delivery domain
    if:
      type: text
      substr: 's.tribalfusion.com'

composite_rules:
  - id: tribalfusion-ad-tag-script
    desc: Tribal Fusion / Exponential Interactive ad tag manager script
    crit: notable
    conf: 0.99
    all:
      - id: e9-manager-identifier
      - id: tribalfusion-ad-host
