# Section Collection — bPlugins WordPress Gutenberg blocks plugin.
defaults:
  platforms: [unix, windows]
  for: [javascript, php, json]
  crit: notable
  conf: 0.98

traits:
  - id: b-blocks-gutenberg-namespace
    desc: bPlugins Gutenberg block CSS class namespace
    if:
      type: text
      substr: wp-block-b-blocks-

  - id: section-collection-textdomain
    desc: Section Collection plugin textdomain
    if:
      type: text
      substr: '"textdomain": "section-collection"'

  - id: bplugins-templates-cdn
    desc: bPlugins templates CDN hostname
    if:
      type: text
      substr: templates.bplugins.com

composite_rules:
  - id: section-collection-plugin-context
    desc: Section Collection WordPress plugin identity
    crit: notable
    all:
      - id: b-blocks-gutenberg-namespace
      - id: section-collection-textdomain
