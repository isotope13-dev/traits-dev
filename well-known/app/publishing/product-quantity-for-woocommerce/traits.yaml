# Product Quantity for WooCommerce — WPFactory quantity limits plugin.
defaults:
  platforms: [windows, unix]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-slug-path
    desc: product-quantity-for-woocommerce plugin path
    if:
      type: path
      regex: '(?i)product-quantity-for-woocommerce([\\/]|$)'

  - id: plugin-header
    desc: Product quantity WooCommerce plugin header
    for: [php]
    if:
      type: text
      substr: 'Text Domain: product-quantity-for-woocommerce'

  - id: alg-wc-pq-core-class
    desc: Alg_WC_PQ_Core WooCommerce quantity class
    for: [php]
    if:
      type: text
      substr: class Alg_WC_PQ_Core

  - id: zip-basename
    desc: product-quantity-for-woocommerce zip basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)^product-quantity-for-woocommerce-.*\.zip$'

composite_rules:
  - id: product-quantity-woocommerce-plugin
    desc: WPFactory product quantity WooCommerce plugin
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: plugin-slug-path
      - id: zip-basename
      - id: plugin-header
      - id: alg-wc-pq-core-class
