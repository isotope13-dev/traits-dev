# nexter-extension — POSIMYTH Nexter WordPress performance plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: nexter-extension WordPress plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])nexter-extension([\\/]|$)'

  - id: plugin-header
    desc: Nexter Extension WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Nexter Extension\s*$'

  - id: posimyth-author-uri
    desc: POSIMYTH plugin author URI
    for: [php]
    if:
      type: text
      substr: posimyth.com

composite_rules:
  - id: nexter-extension-plugin
    desc: POSIMYTH Nexter WordPress extension plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: posimyth-author-uri
