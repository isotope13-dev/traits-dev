# WhatsLink Click Tracker — WordPress WhatsApp click analytics plugin.
defaults:
  platforms: [windows, unix]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: wordpress-plugin-path
    desc: WhatsLink Click Tracker plugin path
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])whatslink-click-tracker([\\/]|$)'

  - id: plugin-header
    desc: WhatsLink Click Tracker plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*WhatsLink Click Tracker\s*$'

  - id: wpsani-author-uri
    desc: wpsani.store author URI marker
    for: [php]
    if:
      type: text
      substr: wpsani.store

composite_rules:
  - id: whatslink-click-tracker-plugin
    desc: WhatsLink Click Tracker WordPress plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: wpsani-author-uri
