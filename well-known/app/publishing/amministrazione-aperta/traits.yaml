# Amministrazione Aperta — WordPress plugin for Italian public-administration
# transparency data and CSV/XLS export.
defaults:
  platforms: [windows, unix]
  for: [php, text, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-path
    desc: Amministrazione Aperta plugin package path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[/\\])amministrazione-aperta([/\\]|$)'

  - id: plugin-header
    desc: Amministrazione Aperta WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Amministrazione Aperta\s*$'

  - id: plugin-uri
    desc: Amministrazione Aperta WordPress plugin URI
    for: [php, text]
    if:
      type: text
      substr: wordpress.org/plugins/amministrazione-aperta

  - id: source-repository
    desc: Amministrazione Aperta source repository
    for: [php, text]
    if:
      type: text
      substr: github.com/WPGov/amministrazione-aperta

composite_rules:
  - id: plugin
    desc: Amministrazione Aperta WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: plugin-uri
      - id: source-repository
