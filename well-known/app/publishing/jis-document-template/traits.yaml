# JIS Document Template (JDT2023) -- the Japanese Standards Association's
# Word template pack for drafting JIS standards, vendored by metanorma-jis
# under reference-docs/JDT2023. Its VBScript helpers create desktop shortcuts
# and launch Word with the macro template; the setup helpers ask the user
# before running an administrator initialisation program.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.95

traits:
  - id: shortcut-creator-script
    desc: JDT2023 desktop shortcut creator script
    if:
      type: text
      regex: 'JDT2023_Start\.[vV][bB][sS]'

  - id: word-template-launcher-script
    desc: Launches Word with the JIS control template
    if:
      type: text
      substr: JIS_Control.dotm

  - id: admin-setup-prompt-script
    desc: JSA setup helper prompts before running
    if:
      type: text
      substr: jsa_admin_work
