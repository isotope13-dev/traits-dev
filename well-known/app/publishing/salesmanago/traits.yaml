# SALESmanago — WordPress/WooCommerce marketing automation plugin.
defaults:
  platforms: [windows, unix]
  for: [php, composer.json, json, zip, archives]
  crit: notable
  conf: 0.95

traits:
  - id: wordpress-plugin-path
    desc: SALESmanago WordPress plugin package path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])salesmanago([\\/]|$)'

  - id: plugin-header
    desc: SALESmanago WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*SALESmanago'

  - id: composer-package-name
    desc: Composer package salesmanago/wordpress
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: salesmanago/wordpress

  - id: bhr-namespace
    desc: SALESmanago bhr PHP namespace
    for: [php]
    if:
      type: text
      regex: 'namespace\s+bhr\\'

  - id: atbash-encrypt-helper
    desc: SALESmanago atbash rot13 client encoding helper
    for: [php]
    if:
      type: text
      regex: 'private\s+static\s+function\s+atbash\s*\('

composite_rules:
  - id: salesmanago-wordpress-plugin
    desc: SALESmanago WordPress marketing automation plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: composer-package-name
      - id: bhr-namespace
