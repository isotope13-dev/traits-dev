# itwanger/toBeBetterJavaer — Java tutorial site (docs + interview notes).
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: github-repo
    desc: toBeBetterJavaer GitHub repository
    if:
      type: text
      regex: github.com/itwanger/tobebetterjavaer
      case_insensitive: true

  - id: source-archive-path
    desc: toBeBetterJavaer module source path
    if:
      type: path
      regex: 'itwanger/tobebetterjavaer@'
