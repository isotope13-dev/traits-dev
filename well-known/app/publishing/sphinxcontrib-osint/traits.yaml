# sphinxcontrib-osint — Sphinx extension that archives OSINT quests
# and publishes reports (Open WebUI, Bluesky, NLP analyse plugins).
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: sphinxcontrib-osint PyPI wheel name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: sphinxcontrib_osint

  - id: github-repo
    desc: bibi21000 sphinxcontrib-osint GitHub repository
    if:
      type: text
      substr: github.com/bibi21000/sphinxcontrib-osint

  - id: author-email
    desc: sphinxcontrib-osint author email
    for: [python, pkginfo]
    if:
      type: text
      substr: bibi21000@gmail.com

  - id: owebuil-api-class
    desc: Open WebUI OSINT API client class
    for: [python]
    if:
      type: text
      substr: 'class OwebuiAPI'

  - id: ollama-status-typo
    desc: Open WebUI ollama status helper
    for: [python]
    if:
      type: text
      substr: api_ollama_satus

  - id: bsky-story-class
    desc: OSInt Bluesky story item class
    for: [python]
    if:
      type: text
      substr: 'class OSIntBSkyStory'

  - id: analyse-directive-class
    desc: OSInt Sphinx analyse directive class
    for: [python]
    if:
      type: text
      substr: 'class DirectiveAnalyse'

  - id: webui-token-config
    desc: OSInt Open WebUI token config key
    for: [python]
    if:
      type: literal
      exact: osint_webui_token

composite_rules:
  - id: sphinxcontrib-osint-package
    desc: sphinxcontrib-osint Sphinx OSINT extension
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: wheel-distribution
      - id: github-repo
      - id: author-email
      - id: owebuil-api-class
      - id: ollama-status-typo
      - id: bsky-story-class
      - id: analyse-directive-class
      - id: webui-token-config
