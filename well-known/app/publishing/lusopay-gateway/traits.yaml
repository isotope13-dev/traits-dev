# Lusopay — WooCommerce Multibanco/Payshop/MBWay payment gateway.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: wordpress-plugin-path
    desc: Lusopay WooCommerce plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])multibanco-e-ou-payshop-by-lusopay([\\/]|$)'

  - id: plugin-header
    desc: LUSOPAY WooCommerce plugin author header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Author:\s*LUSOPAY\s*$'

  - id: lusopay-gateway-class
    desc: WC_Lusopaygateway payment gateway class
    for: [php]
    if:
      type: text
      substr: class WC_Lusopaygateway

composite_rules:
  - id: lusopay-gateway-plugin
    desc: LUSOPAY WooCommerce payment gateway plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: lusopay-gateway-class
