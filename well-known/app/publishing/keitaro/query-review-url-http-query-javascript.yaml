defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: keitaro-js-client-return-mode
    desc: Requests Keitaro JavaScript client response mode
    crit: notable
    conf: 0.96
    for: [html, javascript, typescript, php]
    if:
      type: literal
      kind: string
      regex: '[?&]return=js\.client(&|$)'
  - id: keitaro-browser-context-query-fields
    desc: Builds Keitaro browser-context query fields
    crit: notable
    conf: 0.97
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '[?&]se_referrer=[\s\S]{0,600}[?&]default_keyword=[\s\S]{0,600}[?&]landing_url='

  # Two-part Keitaro handoffs stash tracker base and campaign TTL on a window
  # config object. Split into short atoms; the composite enforces co-occurrence.
