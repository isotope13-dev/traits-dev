# Media Library Tools — Tiny Solutions WordPress media plugin.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: media-library-tools WordPress plugin path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])media-library-tools([\\/]|$)'

  - id: plugin-header-name
    desc: Media Library Tools WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Media Library Tools'

  - id: text-domain
    desc: media-library-tools WordPress text domain
    for: [php]
    if:
      type: text
      substr: media-library-tools

  - id: tsmlt-version-constant
    desc: TSMLT_VERSION plugin version constant
    for: [php]
    if:
      type: text
      substr: TSMLT_VERSION

  - id: tinysolutions-composer-package
    desc: tinysolutions media-library-tools Composer pkg
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: tinysolutions/media-library-tools

composite_rules:
  - id: media-library-tools-wordpress-plugin
    desc: Media Library Tools WordPress media plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header-name
      - id: text-domain
      - id: tsmlt-version-constant
