# Amplest Autopilot — WordPress AEO/JSON-LD plugin. Cloud REST
# webhooks and wp_remote_* calls are the product SaaS sync, not C2.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: Amplest Autopilot plugin package path
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[\\/])amplest-autopilot([\\/]|$)'

  - id: plugin-header
    desc: Amplest Autopilot WordPress plugin header
    for: [php]
    conf: 0.99
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Amplest Autopilot\b'

  - id: version-const
    desc: Amplest Autopilot version constant
    for: [php]
    conf: 0.97
    if:
      type: text
      substr: AMPLEST_AUTOPILOT_VERSION

  - id: cloud-api-url
    desc: Amplest Autopilot plugin API URL
    for: [php]
    conf: 0.98
    if:
      type: text
      substr: amplest.cloud/api/wp-plugin

composite_rules:
  - id: amplest-autopilot-plugin
    desc: Amplest Autopilot WordPress AEO plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: version-const
      - id: cloud-api-url
