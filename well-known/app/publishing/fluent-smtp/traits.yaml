# FluentSMTP — WordPress SMTP connection plugin (WPManageNinja).
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.98

traits:
  - id: fluent-smtp-plugin-path
    desc: fluent-smtp plugin package path
    for: [php, text, javascript]
    if:
      type: path
      regex: '(?i)(^|[/\\])fluent-smtp([/\\]|$)'

  - id: fluent-smtp-plugin-header
    desc: FluentSMTP WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*?\s*Plugin Name:\s*FluentSMTP\s*$'

  - id: fluent-smtp-product-url
    desc: FluentSMTP product site URL
    for: [php, text]
    if:
      type: text
      substr: https://fluentsmtp.com

  - id: fluent-smtp-constant
    desc: FluentSMTP plugin version constant
    for: [php]
    if:
      type: text
      substr: FLUENTMAIL_PLUGIN_VERSION

composite_rules:
  - id: fluent-smtp-plugin
    desc: FluentSMTP WordPress SMTP plugin
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: fluent-smtp-plugin-path
    any:
      - id: fluent-smtp-plugin-header
      - id: fluent-smtp-product-url
      - id: fluent-smtp-constant