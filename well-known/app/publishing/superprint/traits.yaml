# SuperPrint (npm superprint) — official launcher for the SuperPrint DTP suite
# by 2.13. The postinstall hook prints a banner only; cli.mjs downloads
# sp213-local.zip from app.zigmoon.com into ~/.superprint and runs Vite.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, markdown, npm]
  crit: notable
  conf: 0.98

traits:
  - id: npm-package-name
    desc: SuperPrint npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: superprint

  - id: product-home-dir
    desc: SuperPrint product home directory
    for: [javascript]
    if:
      type: text
      substr: ".superprint"

  - id: app-archive-url
    desc: SuperPrint official local app archive URL
    for: [javascript]
    if:
      type: text
      substr: app.zigmoon.com/sp213-local.zip

  - id: version-manifest-url
    desc: SuperPrint online version manifest URL
    for: [javascript]
    if:
      type: text
      substr: superprint.cc/version.txt

composite_rules:
  - id: npm-launcher-identity
    desc: SuperPrint npm launcher identity
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: npm-package-name
      - id: product-home-dir
      - id: app-archive-url
      - id: version-manifest-url
