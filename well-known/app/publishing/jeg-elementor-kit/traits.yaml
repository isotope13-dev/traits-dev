# Jeg Kit for Elementor — Jegtheme WordPress Elementor widget kit.
# Admin dashboard/wizard JS and bundled Freemius pricing are product
# plugin UI, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 80000000

traits:
  - id: plugin-path
    desc: Jeg Elementor Kit plugin path
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[\\/])jeg-elementor-kit([\\/]|$)'

  - id: plugin-header
    desc: Jeg Kit for Elementor plugin header
    for: [php]
    conf: 0.99
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Jeg Kit for Elementor\s*$'

  - id: version-const
    desc: Jeg Elementor Kit version constant
    for: [php]
    conf: 0.97
    if:
      type: text
      substr: JEG_ELEMENTOR_KIT_VERSION

composite_rules:
  - id: jeg-elementor-kit-plugin
    desc: Jeg Kit for Elementor WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: version-const
