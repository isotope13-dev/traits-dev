# SDAweb Channels for YouTube — WordPress YouTube channel plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: sdaweb-channels-for-youtube plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])sdaweb-channels-for-youtube([\\/]|$)'

  - id: plugin-header
    desc: SDAweb Channels for YouTube plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*SDAweb Channels for YouTube\s*$'

  - id: sdaweb-author-uri
    desc: sdaweb.no plugin author URI
    for: [php]
    if:
      type: text
      substr: sdaweb.no

composite_rules:
  - id: sdaweb-youtube-channels-plugin
    desc: SDAweb YouTube channels WordPress plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: sdaweb-author-uri
