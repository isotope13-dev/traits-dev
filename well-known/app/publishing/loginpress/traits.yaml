# LoginPress — WPBrigade WordPress wp-login customizer. WPB SDK
# telemetry (curl/wp_remote_post) and customizer AJAX are product
# plugin behavior, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: LoginPress WordPress plugin path
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[\\/])loginpress([\\/]|$)'

  - id: plugin-header
    desc: LoginPress WordPress plugin header
    for: [php]
    conf: 0.99
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*LoginPress\s*$'

  - id: version-const
    desc: LoginPress version constant
    for: [php]
    conf: 0.97
    if:
      type: text
      substr: LOGINPRESS_VERSION

  - id: github-repo
    desc: WPBrigade LoginPress GitHub repository
    for: [php, text]
    conf: 0.98
    if:
      type: text
      substr: github.com/WPBrigade/loginpress

composite_rules:
  - id: loginpress-plugin
    desc: LoginPress WordPress login customizer
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: version-const
      - id: github-repo
