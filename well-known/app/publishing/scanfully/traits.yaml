# Scanfully — WordPress performance and health monitoring plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: scanfully WordPress plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])scanfully([\\/]|$)'

  - id: plugin-header
    desc: Scanfully WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Scanfully\s*$'

  - id: scanfully-author-uri
    desc: scanfully.com plugin author URI
    for: [php]
    if:
      type: text
      substr: scanfully.com

composite_rules:
  - id: scanfully-plugin
    desc: Scanfully WordPress performance monitor plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: scanfully-author-uri
