# Mobimint Mobile App Builder — WooCommerce mobile app builder plugin.
defaults:
  platforms: [unix, windows]
  for: [php, pkginfo, zip]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header
    desc: Mobimint Mobile App Builder plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Mobimint Mobile App Builder\b'

  - id: text-domain
    desc: Mobimint Mobile App Builder text domain
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*mobimint-mobile-app-builder\s*$'

  - id: api-base-url-constant
    desc: Mobimint staging API base URL constant
    for: [php]
    if:
      type: text
      substr: MOBIMINTMAB_API_BASE_URL

composite_rules:
  - id: mobimint-mobile-app-builder-context
    desc: Mobimint WooCommerce mobile app builder plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-header
      - id: api-base-url-constant
