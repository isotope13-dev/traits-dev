defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: civicrm-archive-member
    crit: notable
    desc: CiviCRM source archive member
    for: [php, javascript, shell, json, package.json, source, data]
    size_min: 1
    size_max: 200000000
    if:
      type: path
      substr: civicrm-civicrm-core-
composite_rules:
  - id: civicrm-upgrade-form
    desc: CiviCRM source path with Form.php filename
    crit: notable
    conf: 0.98
    all:
      - id: civicrm-archive-member
      - id: metadata/filename/name-form::upgrade-form-basename
  - id: civicrm-test-schema
    desc: CiviCRM source path with Schema.php filename
    crit: notable
    conf: 0.98
    all:
      - id: civicrm-archive-member
      - id: metadata/filename/name-form::schema-basename
  - id: civicrm-google-map-template
    desc: CiviCRM source path with map template filename
    crit: notable
    conf: 0.98
    all:
      - id: civicrm-archive-member
      - id: metadata/filename/name-form::map-tpl-basename
  - id: civicrm-source-identity
    desc: CiviCRM source tree identity
    crit: notable
    conf: 0.98
    any:
      - id: civicrm-upgrade-form
      - id: civicrm-test-schema
      - id: civicrm-google-map-template
      - id: civicrm-archive-member
