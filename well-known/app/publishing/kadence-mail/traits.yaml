# Kadence Mail / Solid Mail (wp-smtp) — WordPress SMTP + email log
# plugin. Admin webpack fetch/JSON is the product settings UI, not C2.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: wp-smtp WordPress plugin package path
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[\\/])wp-smtp([\\/]|$)'

  - id: plugin-header
    desc: Kadence Mail WordPress plugin header
    for: [php]
    conf: 0.99
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Kadence Mail\s*$'

  - id: version-const
    desc: Kadence Mail version constant
    for: [php]
    conf: 0.97
    if:
      type: text
      substr: WPSMTP_VERSION

  - id: php-namespace
    desc: SolidWP Mail PHP namespace
    for: [php]
    conf: 0.98
    if:
      type: text
      substr: 'namespace SolidWP\Mail'

composite_rules:
  - id: kadence-mail-plugin
    desc: Kadence Mail WordPress SMTP plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: version-const
      - id: php-namespace
