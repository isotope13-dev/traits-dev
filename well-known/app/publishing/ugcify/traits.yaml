defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  - javascript
  - zip
  crit: notable
  conf: 0.99
traits:
- id: plugin-header
  desc: UGCify WordPress plugin header
  for:
  - php
  if:
    type: text
    regex: Plugin Name:\s*UGCify
- id: text-domain
  desc: UGCify WordPress text domain
  for:
  - php
  - javascript
  if:
    type: text
    word: ugcify
- id: webpack-chunk-namespace
  desc: UGCify webpack chunk namespace
  for:
  - javascript
  if:
    type: text
    substr: webpackChunkugcify
