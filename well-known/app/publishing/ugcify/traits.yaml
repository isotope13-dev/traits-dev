# UGCify is RexTheme's WooCommerce plugin for collecting and displaying
# customer photos and videos on product pages.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-header
    desc: UGCify WordPress plugin header
    for: [php]
    if:
      type: text
      regex: 'Plugin Name:\s*UGCify'

  - id: text-domain
    desc: UGCify WordPress text domain
    for: [php, javascript]
    if:
      type: text
      word: ugcify

  - id: webpack-chunk-namespace
    desc: UGCify webpack chunk namespace
    for: [javascript]
    if:
      type: text
      substr: webpackChunkugcify

composite_rules:
  - id: ugcify-plugin-context
    desc: Recognized UGCify WooCommerce plugin
    crit: exception
    conf: 0.99
    any:
      - id: plugin-header
      - id: webpack-chunk-namespace
