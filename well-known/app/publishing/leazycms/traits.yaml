# LeazyCMS — Laravel-based Content Management System (leazycms/web).
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: composer-package-name
    desc: LeazyCMS composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: leazycms/web

  - id: leazycms-namespace
    desc: LeazyCMS PHP namespace
    for: [php]
    if:
      type: text
      regex: 'namespace\s+Leazycms\\Web\b'

  - id: cloud-config-optimizer
    desc: LeazyCMS runtime cloud host configuration helper
    for: [php]
    if:
      type: text
      substr: 'class RuntimeConfigOptimizer'

composite_rules:
  - id: leazycms-package-context
    desc: LeazyCMS CMS framework context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: composer-package-name
      - id: leazycms-namespace
      - id: cloud-config-optimizer
    needs: 2
