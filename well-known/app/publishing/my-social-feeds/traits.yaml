# My Social Feeds — bPlugins WordPress social feed embed plugin.
defaults:
  platforms: [windows, unix]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: wordpress-plugin-path
    desc: My Social Feeds WordPress plugin path
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])my-social-feeds([\\/]|$)'

  - id: plugin-header
    desc: My Social Feeds WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*My Social Feeds\s*$'

  - id: bplugins-author-uri
    desc: bPlugins author URI marker
    for: [php]
    if:
      type: text
      substr: bplugins.com

composite_rules:
  - id: my-social-feeds-plugin
    desc: bPlugins My Social Feeds WordPress plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: bplugins-author-uri
