# hCaptcha for WP — official WordPress plugin (hcaptcha.com). Fetch
# wrapping in settings-base and console reassignment in general.js are
# product instrumentation, not implants.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: hCaptcha for WP plugin package path
    if:
      type: path
      regex: '(?i)hcaptcha-for-forms-and-more'

  - id: plugin-header
    desc: hCaptcha for WP plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*hCaptcha for WP\s*$'

  - id: version-const
    desc: hCaptcha for WP version constant
    for: [php]
    if:
      type: text
      substr: HCAPTCHA_VERSION

composite_rules:
  - id: hcaptcha-for-wp-plugin
    desc: hCaptcha for WP WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: version-const
