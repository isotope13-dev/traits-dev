# Orshot — WordPress OG image and template rendering plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-slug-path
    desc: orshot WordPress plugin directory path
    if:
      type: path
      regex: '(?i)(^|[\\/])orshot([\\/]|$)'

  - id: plugin-header
    desc: Orshot OG and featured images plugin header
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: Orshot'

  - id: text-domain
    desc: orshot WordPress text domain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text Domain: orshot'

  - id: orshot-oauth-class
    desc: Orshot_OAuth PKCE handler class
    for: [php]
    if:
      type: text
      substr: class Orshot_OAuth

  - id: zip-basename
    desc: orshot WordPress plugin zip basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)^orshot-.*\.zip$'

composite_rules:
  - id: orshot-wordpress-plugin
    desc: Orshot dynamic OG and featured images plugin
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: plugin-slug-path
      - id: zip-basename
      - id: text-domain
      - id: orshot-oauth-class
