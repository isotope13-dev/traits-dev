# Emergency Management — WordPress 2FA and password security plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: wordpress-plugin-path
    desc: Emergency Management WordPress plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])emergency-management([\\/]|$)'

  - id: plugin-header
    desc: Emergency Management WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Emergency Management\s*$'

  - id: mfem-version-constant
    desc: MFEM version bootstrap constant
    for: [php]
    if:
      type: text
      substr: MFEM_VERSION

composite_rules:
  - id: emergency-management-plugin
    desc: Emergency Management WordPress security plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: mfem-version-constant
