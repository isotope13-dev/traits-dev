# Reviews Feed — Smash Balloon WordPress reviews plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-header
    desc: Reviews Feed WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Reviews Feed\s*$'

  - id: smashballoon-author-uri
    desc: smashballoon.com plugin author URI
    for: [php]
    if:
      type: text
      substr: smashballoon.com

composite_rules:
  - id: reviews-feed-plugin
    desc: Smash Balloon Reviews Feed WordPress plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-reviews-feed
    any:
      - id: plugin-header
      - id: smashballoon-author-uri
