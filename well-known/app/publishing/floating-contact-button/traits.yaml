defaults:
  platforms: [windows, unix]
  for: [php, text]
  crit: notable
  conf: 0.99

traits:
  # Keep the package-path and header separate so a repackaged plugin remains
  # identifiable even when its archive layout changes.  The archive context
  # requires the path plus an independent product marker.
  - id: plugin-path
    desc: Floating Contact Button plugin package path
    if:
      type: path
      regex: '(?i)floating-contact-button-for-max-and-telegram'

  - id: plugin-header
    desc: Floating Contact Button WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Floating Contact Button for MAX and Telegram\s*$'

  - id: plugin-uri
    desc: Floating Contact Button author plugin URI
    conf: 0.98
    if:
      type: text
      substr: cryptolamer.ru/support_wp_plugin-floating-contact-button-for-max-and-telegram

composite_rules:
  - id: plugin-context
    desc: Floating Contact Button WordPress plugin identity
    scope: archive
    for: [php, zip]
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: plugin-uri
