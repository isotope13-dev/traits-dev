# MeetingHub — Sovlix WordPress video conferencing plugin.
defaults:
  platforms: [windows, unix]
  for: [php, javascript, composer.json, json, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: wordpress-plugin-path
    desc: MeetingHub WordPress plugin path
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])meetinghub([\\/]|$)'

  - id: plugin-header
    desc: MeetingHub WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*MeetingHub\s*$'

  - id: sovlix-author-uri
    desc: Sovlix author URI marker
    for: [php]
    if:
      type: text
      substr: sovlix.com

composite_rules:
  - id: meetinghub-plugin
    desc: MeetingHub WordPress video conferencing plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: sovlix-author-uri
