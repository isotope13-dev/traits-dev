# table-builder-block — Wpmet TableKit Gutenberg table block plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, javascript]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: table-builder-block WordPress plugin path
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])table-builder-block([\\/]|$)'

  - id: plugin-header
    desc: TableKit Wpmet WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*TableKit\s*$'

  - id: wpmet-author-uri
    desc: Wpmet plugin author URI
    for: [php]
    if:
      type: text
      substr: wpmet.com

composite_rules:
  - id: table-builder-block-plugin
    desc: Wpmet TableKit Gutenberg table builder plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: wpmet-author-uri
