# TermsFeed AutoTerms — WordPress privacy-policy / cookie-consent plugin.
# Bundled CodeMirror and document.cookie are the legal-page editor and
# consent banner; identity only.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: TermsFeed AutoTerms plugin path
    if:
      type: path
      substr: auto-terms-of-service-and-privacy-policy

  - id: plugin-header
    desc: TermsFeed AutoTerms plugin header
    for: [php]
    if:
      type: text
      substr: 'Plugin Name: TermsFeed AutoTerms'

  - id: plugin-dir-define
    desc: TermsFeed AutoTerms plugin dir define
    for: [php]
    if:
      type: text
      substr: "define( 'WPAUTOTERMS_PLUGIN_DIR'"

  - id: banner-container-id
    desc: TermsFeed AutoTerms banner container id
    for: [javascript]
    if:
      type: text
      substr: wpautoterms-top-fixed-container
