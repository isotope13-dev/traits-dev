# Vipps and MobilePay for WooCommerce — official payment gateway plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, zip]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-slug-path
    desc: woo-vipps plugin directory path
    if:
      type: path
      regex: '(?i)(^|[\\/])woo-vipps([\\/]|$)'

  - id: plugin-header
    desc: Vipps and MobilePay plugin header
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: Pay with Vipps and MobilePay for WooCommerce'

  - id: plugin-textdomain
    desc: woo-vipps WooCommerce textdomain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text-domain: woo-vipps'

  - id: wc-gateway-vipps-class
    desc: WC_Gateway_Vipps gateway class
    for: [php]
    if:
      type: text
      substr: 'class WC_Gateway_Vipps extends WC_Payment_Gateway'

  - id: zip-basename
    desc: woo-vipps plugin zip basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)^woo-vipps.*\.zip$'

composite_rules:
  - id: woo-vipps-payment-plugin
    desc: Vipps MobilePay WooCommerce plugin
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: plugin-slug-path
      - id: zip-basename
      - id: plugin-header
      - id: plugin-textdomain
      - id: wc-gateway-vipps-class
