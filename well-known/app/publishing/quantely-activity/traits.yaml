# Quantely Activity — Erravi WordPress visitor analytics plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: Quantely Activity plugin header name
    if:
      type: text
      substr: 'Plugin Name: Quantely Activity'

  - id: plugin-textdomain
    desc: Quantely Activity WordPress textdomain
    if:
      type: text
      substr: 'Text Domain: quantely-activity'

  - id: qmon-client-namespace
    desc: Quantely Activity qmon client namespace
    if:
      type: text
      substr: window.qmon

composite_rules:
  - id: quantely-activity-plugin-context
    desc: Quantely Activity WordPress analytics plugin
    all:
      - id: plugin-header-name
    any:
      - id: plugin-textdomain
      - id: qmon-client-namespace
