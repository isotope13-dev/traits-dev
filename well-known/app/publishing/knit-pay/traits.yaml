# Knit Pay — WordPress multi-gateway payment integration plugin.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: knit-pay WordPress plugin directory path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])knit-pay([\\/]|$)'

  - id: plugin-header-name
    desc: Knit Pay WordPress plugin header name
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Knit Pay\s*$'

  - id: knit-pay-text-domain
    desc: knit-pay-lang WordPress text domain
    for: [php]
    if:
      type: text
      substr: knit-pay-lang

  - id: pronamic-gateway-post-type
    desc: pronamic_gateway WordPress post type marker
    for: [php]
    if:
      type: text
      substr: pronamic_gateway

  - id: knitpay-org-url
    desc: knitpay.org plugin website URL
    for: [php, json, markdown]
    if:
      type: text
      substr: knitpay.org

composite_rules:
  - id: knit-pay-wordpress-plugin
    desc: Knit Pay WordPress payment gateway plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header-name
      - id: knit-pay-text-domain
      - id: pronamic-gateway-post-type
