# Spiffy Calendar — a WordPress event-calendar plugin from Spiffy Plugins.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: wordpress-plugin-path
    desc: Spiffy Calendar plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])spiffy-calendar([\\/]|$)'

  - id: plugin-header
    desc: Spiffy Calendar plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*?\s*Plugin Name:\s*Spiffy Calendar\s*$'

composite_rules:
  - id: spiffy-calendar-plugin
    desc: Spiffy Calendar WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: wordpress-plugin-path
      - id: plugin-header
