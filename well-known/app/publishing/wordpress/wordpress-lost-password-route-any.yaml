defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.96

composite_rules:
  - id: wordpress-lost-password-route-any
    desc: References WordPress lost-password action route
    any:
      - id: well-known/app/publishing/wordpress::wordpress-lost-password-route
      - id: well-known/app/publishing/wordpress::wordpress-lost-password-route-unicode
