# GriffinForms — WordPress form builder plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: wordpress-plugin-path
    desc: GriffinForms WordPress plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])griffinforms-form-builder([\\/]|$)'

  - id: plugin-header
    desc: GriffinForms WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*GriffinForms'

  - id: griffinforms-namespace-prefix
    desc: GriffinForms griffinforms_ identifier prefix
    for: [php]
    if:
      type: text
      substr: griffinforms_

composite_rules:
  - id: griffinforms-plugin
    desc: GriffinForms WordPress form builder plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: griffinforms-namespace-prefix
