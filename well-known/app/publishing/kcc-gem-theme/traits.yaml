# KCC Gem Theme Original — Jekyll theme for Kankakee Community College sites.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, text, archives, javascript, html, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: gem-package-name
    desc: kcc-gem-theme-original Ruby gem name
    for: [gem, text]
    if:
      type: text
      regex: '(?im)^name:\s*kcc-gem-theme-original\s*$'

  - id: jekyll-theme-config
    desc: kcc-gem-theme-original Jekyll theme config
    for: [markdown, text]
    if:
      type: text
      substr: 'theme: kcc-gem-theme-original'

  - id: kcc-college-marker
    desc: Kankakee Community College site marker
    for: [markdown, text, html, javascript]
    if:
      type: text
      substr: kankakee-community-college

  - id: gem-basename
    desc: kcc-gem-theme-original gem archive basename
    for: [gem]
    if:
      type: basename
      regex: '(?i)^kcc-gem-theme-original-.*\.gem$'

composite_rules:
  - id: kcc-gem-theme-original-gem
    desc: KCC Jekyll community college theme gem
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: gem-package-name
      - id: gem-basename
      - id: jekyll-theme-config
      - id: kcc-college-marker
