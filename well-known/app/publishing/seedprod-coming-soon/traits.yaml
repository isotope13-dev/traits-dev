# SeedProd Coming Soon — WordPress page builder plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, javascript]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: SeedProd coming-soon plugin path
    for: [php, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])coming-soon([\\/]|$)'

  - id: plugin-header
    desc: SeedProd WordPress plugin author header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Author:\s*SeedProd\s*$'

  - id: seedprod-build-constant
    desc: SEEDPROD_BUILD lite/pro version constant
    for: [php]
    if:
      type: text
      substr: SEEDPROD_BUILD

composite_rules:
  - id: seedprod-coming-soon-plugin
    desc: SeedProd WordPress coming soon page builder
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: seedprod-build-constant
