# Property Hive — WordPress estate agency plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: Property Hive plugin path
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])propertyhive([\\/]|$)'

  - id: plugin-header
    desc: Property Hive plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^[ \t/*#]*Plugin Name:[ \t]*Property Hive[ \t]*$'

  - id: propertyhive-textdomain
    desc: Property Hive text domain
    for: [php]
    if:
      type: text
      regex: '(?im)^[ \t/*#]*Text Domain:[ \t]*propertyhive[ \t]*$'

composite_rules:
  - id: propertyhive-plugin-context
    desc: Recognized Property Hive WordPress plugin
    crit: exception
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: propertyhive-textdomain
