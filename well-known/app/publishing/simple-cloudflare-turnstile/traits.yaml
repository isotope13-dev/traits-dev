# Simple Cloudflare Turnstile — RelyWP WordPress CAPTCHA plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, markdown, text, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: Simple Cloudflare Turnstile plugin header
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: Simple CAPTCHA Alternative with Cloudflare Turnstile'

  - id: plugin-textdomain
    desc: Simple Cloudflare Turnstile textdomain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text Domain: simple-cloudflare-turnstile'

  - id: cfturnstile-function-prefix
    desc: cfturnstile WordPress helper function prefix
    for: [php, javascript]
    if:
      type: text
      substr: cfturnstile_field_show

composite_rules:
  - id: simple-cloudflare-turnstile-plugin
    desc: Simple Cloudflare Turnstile WordPress plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-textdomain
    any:
      - id: plugin-header-name
      - id: cfturnstile-function-prefix
