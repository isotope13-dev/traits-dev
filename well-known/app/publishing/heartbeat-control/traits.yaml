# Heartbeat Control by WP Rocket — official WordPress.org plugin that
# throttles the Heartbeat API. Imagify_Partner.php installs Imagify via
# Plugin_Upgrader from the directory; that is a partner upsell, not a
# dropper. Bundled CMB2/CodeMirror eval is the editor, not a payload.
defaults:
  platforms: [unix, windows]
  for: [php, zip, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: Heartbeat Control plugin directory path
    if:
      type: path
      regex: '(?i)(^|[\\/])heartbeat-control([\\/]|$)'

  - id: plugin-header
    desc: Heartbeat Control by WP Rocket header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Heartbeat Control by WP Rocket\s*$'

  - id: plugin-uri
    desc: Heartbeat Control WordPress.org plugin URI
    for: [php, markdown, text]
    if:
      type: text
      substr: wordpress.org/plugins/heartbeat-control/

  - id: version-const
    desc: HBC_VERSION plugin constant
    for: [php]
    if:
      type: text
      substr: HBC_VERSION

  - id: wordpress-plugin-name
    desc: Heartbeat Control WordPress plugin name
    for: [zip]
    if:
      type: value
      path: source.wordpress.plugin_name
      exact: Heartbeat Control by WP Rocket

  - id: wordpress-slug
    desc: heartbeat-control WordPress plugin slug
    for: [zip]
    if:
      type: value
      path: source.wordpress.slug
      exact: heartbeat-control

composite_rules:
  - id: heartbeat-control-plugin
    desc: Heartbeat Control by WP Rocket plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: plugin-uri
      - id: version-const
      - id: wordpress-plugin-name
      - id: wordpress-slug
