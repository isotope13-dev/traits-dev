# Ad Commander — Wild Operation WordPress ad banner manager.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, json, javascript]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: ad-commander WordPress plugin directory path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])ad-commander([\\/]|$)'

  - id: plugin-header-name
    desc: Ad Commander WordPress plugin header name
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Ad Commander'

  - id: ad-commander-text-domain
    desc: ad-commander WordPress text domain
    for: [php]
    if:
      type: text
      substr: ad-commander

  - id: adcmdr-plugin-constant
    desc: ADCMDR plugin bootstrap constant marker
    for: [php]
    if:
      type: text
      substr: ADCMDR_PLUGIN_DIR

composite_rules:
  - id: ad-commander-wordpress-plugin
    desc: Ad Commander WordPress ad manager plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header-name
      - id: ad-commander-text-domain
      - id: adcmdr-plugin-constant
