# Indiekit — federated indie web publishing toolkit (getindiekit/indiekit).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, html, makefile, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 52428800

traits:
  - id: indiekit-frontend-package-name
    desc: Indiekit frontend npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@indiekit/frontend'

  - id: indiekit-monorepo-repository
    desc: Indiekit monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/getindiekit/indiekit'

  - id: indiekit-npm-archive-path
    desc: Indiekit frontend npm archive path
    if:
      type: path
      regex: '(?i)(@indiekit/frontend|indiekit)'

  - id: indiekit-form-njk-basename
    desc: Indiekit form layout template basename
    for: [html, makefile, text]
    if:
      type: basename
      exact: form.njk

  - id: indiekit-esbuild-helper-basename
    desc: Indiekit frontend esbuild helper module basename
    for: [javascript, typescript]
    if:
      type: basename
      exact: esbuild.js

  - id: indiekit-imports-esbuild-api
    desc: Indiekit frontend imports esbuild API
    for: [javascript, typescript]
    if:
      type: text
      substr: 'import * as esbuild from "esbuild"'

  - id: indiekit-micropub-form-template-marker
    desc: Indiekit form extends default layout
    for: [html, makefile, text]
    if:
      type: text
      substr: 'extends "default.njk"'

composite_rules:
  - id: indiekit-esbuild-bundle-helper
    desc: Indiekit frontend esbuild bundle helper module
    crit: notable
    conf: 0.97
    all:
      - id: indiekit-esbuild-helper-basename
      - id: indiekit-imports-esbuild-api

  - id: indiekit-micropub-form-layout
    desc: Indiekit Micropub form layout template
    crit: notable
    conf: 0.97
    all:
      - id: indiekit-form-njk-basename
      - id: indiekit-micropub-form-template-marker

  - id: indiekit-frontend-library
    desc: Indiekit frontend publishing UI package
    crit: exception
    conf: 0.97
    any:
      - id: indiekit-frontend-package-name
      - id: indiekit-monorepo-repository
      - id: indiekit-npm-archive-path
      - id: indiekit-micropub-form-layout
      - id: indiekit-esbuild-bundle-helper
