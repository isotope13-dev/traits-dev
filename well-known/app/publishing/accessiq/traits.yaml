# AccessIQ — readscope WordPress accessibility scanner and analytics.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, markdown, text, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: AccessIQ WordPress plugin header name
    for: [php, markdown, text]
    if:
      type: text
      substr: 'AccessIQ — Accessibility Scanner'

  - id: plugin-textdomain
    desc: AccessIQ WordPress textdomain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text Domain: accessiq'

  - id: accessiq-constant-marker
    desc: AccessIQ bootstrap constant marker
    for: [php]
    if:
      type: text
      substr: ACCESSIQ_VERSION

  - id: accessiq-track-action
    desc: AccessIQ click tracking AJAX action
    for: [php, javascript]
    if:
      type: text
      substr: accessiq_track_click

  - id: readscope-author-uri
    desc: readscope WordPress author URI marker
    for: [php, markdown, text]
    if:
      type: text
      substr: profiles.wordpress.org/readscope

composite_rules:
  - id: accessiq-plugin-context
    desc: AccessIQ accessibility and analytics plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-textdomain
    any:
      - id: plugin-header-name
      - id: accessiq-constant-marker
      - id: accessiq-track-action
