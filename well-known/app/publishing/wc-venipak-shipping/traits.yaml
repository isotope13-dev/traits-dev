# Venipak WooCommerce shipping — ShopUp courier and pickup plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-slug-path
    desc: wc-venipak-shipping plugin directory path
    if:
      type: path
      regex: '(?i)wc-venipak-shipping([\\/]|$)'

  - id: plugin-header
    desc: Venipak WooCommerce shipping plugin header
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name:       Shipping with Venipak for WooCommerce'

  - id: plugin-textdomain
    desc: woocommerce-shopup-venipak-shipping textdomain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text Domain:       woocommerce-shopup-venipak-shipping'

  - id: venipak-fetch-pickups-include
    desc: venipak_fetch_pickups WooCommerce helper
    for: [php]
    if:
      type: text
      substr: venipak_fetch_pickups

  - id: zip-basename
    desc: wc-venipak-shipping plugin zip basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)^wc-venipak-shipping-.*\.zip$'

composite_rules:
  - id: wc-venipak-shipping-plugin
    desc: ShopUp Venipak WooCommerce shipping plugin
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: plugin-slug-path
      - id: zip-basename
      - id: plugin-textdomain
      - id: venipak-fetch-pickups-include
