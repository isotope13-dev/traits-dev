# Odyssey LLMS — WordPress AI control panel for llms.txt and bot analytics.
defaults:
  platforms: [unix, windows]
  for: [php, pkginfo, zip]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header
    desc: Odyssey LLMS WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Odyssey LLMS\s*$'

  - id: text-domain
    desc: Odyssey LLMS WordPress text domain
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*odyssey-llms\s*$'

  - id: namespace-marker
    desc: Odyssey LLMS PHP namespace
    for: [php]
    if:
      type: text
      substr: namespace Odyssey\LLMS

composite_rules:
  - id: odyssey-llms-plugin-context
    desc: Odyssey LLMS WordPress AI content plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-header
      - id: namespace-marker
