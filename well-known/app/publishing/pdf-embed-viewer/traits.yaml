# PDF Embed Viewer is a WordPress plugin that embeds PDFs with the bundled
# PDF.js and 3D FlipBook libraries.  These library files contain renderer
# capabilities such as eval/new Function and PDF URI examples by design.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, text, zip]
  crit: notable
  conf: 0.99

traits:
  - id: pdf-embed-viewer-plugin-header
    desc: PDF Embed Viewer WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*3D Flipbook PDF Viewer & Embedder\b'

  - id: pdf-embed-viewer-plugin-uri
    desc: PDF Embed Viewer WordPress plugin URI
    for: [php, text]
    if:
      type: text
      substr: wordpress.org/plugins/pdf-embed-viewer

  - id: pdf-embed-viewer-source-path
    desc: PDF Embed Viewer plugin source path
    for: [php, javascript, text]
    if:
      type: path
      regex: '(^|[\\/])pdf-embed-viewer([\\/]|$)'

  - id: pdf-embed-viewer-pdfjs-vendor
    desc: PDF Embed Viewer bundled PDF.js library
    for: [javascript]
    if:
      type: path
      regex: 'vendor[\\/]pdf[\\/]pdf(\.min)?\.js$'

  - id: pdf-embed-viewer-flipbook-vendor
    desc: PDF Embed Viewer bundled 3D FlipBook library
    for: [javascript]
    if:
      type: path
      regex: '3dflipbook[\\/]js[\\/](3dflipbook|flip-book)(\.min)?\.js$'

composite_rules:
  - id: pdf-embed-viewer-plugin-context
    desc: Recognized PDF Embed Viewer WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: pdf-embed-viewer-plugin-header
      - id: pdf-embed-viewer-plugin-uri
