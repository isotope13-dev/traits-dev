# Muri Link Tracker — WordPress link checker plugin.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: muri-link-tracker WordPress plugin path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])muri-link-tracker([\\/]|$)'

  - id: plugin-header-name
    desc: Muri Link Tracker WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Muri Link Tracker\s*$'

  - id: text-domain
    desc: muri-link-tracker WordPress text domain
    for: [php]
    if:
      type: text
      substr: muri-link-tracker

  - id: mltr-version-constant
    desc: MLTR_VERSION plugin version constant
    for: [php]
    if:
      type: text
      substr: MLTR_VERSION

  - id: github-repo
    desc: nicolasdiolez muri-link-tracker GitHub repo
    for: [php, json, markdown]
    if:
      type: text
      substr: nicolasdiolez/muri-link-tracker

composite_rules:
  - id: muri-link-tracker-wordpress-plugin
    desc: Muri Link Tracker WordPress link checker plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header-name
      - id: text-domain
      - id: mltr-version-constant
