# Tickera — WordPress event ticketing and ticket sales plugin.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wordpress-plugin-path
    desc: tickera-event-ticketing-system plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])tickera-event-ticketing-system([\\/]|$)'

  - id: plugin-header
    desc: Tickera event ticketing plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Tickera. Sell Tickets & Manage Events\s*$'

  - id: tickera-author-uri
    desc: tickera.com plugin author URI
    for: [php]
    if:
      type: text
      substr: tickera.com

composite_rules:
  - id: tickera-plugin
    desc: Tickera WordPress event ticketing plugin
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: wordpress-plugin-path
    any:
      - id: plugin-header
      - id: tickera-author-uri
