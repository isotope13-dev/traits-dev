# PufferGo — AI website-builder WordPress plugin.
# https://wordpress.org/plugins/puffergo/
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: puffergo-plugin-path
    desc: PufferGo WordPress plugin path
    for: [php, text]
    if:
      type: path
      regex: '(?i)(^|[/\\])puffergo([/\\]|$)'

  - id: puffergo-plugin-header
    desc: PufferGo WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*PufferGo\s*$'

  - id: puffergo-plugin-uri
    desc: PufferGo WordPress plugin URI
    for: [php]
    if:
      type: text
      substr: puffergo.com/wp

  - id: puffergo-text-domain
    desc: PufferGo WordPress text domain
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*puffergo\s*$'

composite_rules:
  - id: puffergo-plugin
    desc: PufferGo AI website-builder WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: puffergo-plugin-path
    any:
      - id: puffergo-plugin-header
      - id: puffergo-plugin-uri
      - id: puffergo-text-domain
