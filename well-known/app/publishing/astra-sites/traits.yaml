# Starter Templates (astra-sites) — Brainstorm Force WordPress
# starter-site importer. Bundled webpack admin UI and github/fetch
# polyfill hook self.fetch as product JS, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 80000000

traits:
  - id: plugin-path
    desc: astra-sites WordPress plugin path
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[\\/])astra-sites([\\/]|$)'

  - id: plugin-header
    desc: Starter Templates WordPress plugin header
    for: [php]
    conf: 0.99
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Starter Templates\s*$'

  - id: name-const
    desc: Astra Sites name constant
    for: [php]
    conf: 0.97
    if:
      type: text
      substr: ASTRA_SITES_NAME

  - id: text-domain
    desc: astra-sites WordPress text domain
    for: [php, text]
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*astra-sites\s*$'

composite_rules:
  - id: astra-sites-plugin
    desc: Starter Templates astra-sites WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header
      - id: name-const
      - id: text-domain
