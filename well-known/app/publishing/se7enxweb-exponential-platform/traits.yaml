# se7enxweb exponential-platform — eZ Platform / Ibexa CMS fork (7x).
defaults:
  platforms: [windows, unix]
  for: [php, composer.json, json, zip, archives, package.json]
  crit: notable
  conf: 0.96

traits:
  - id: se7enxweb-oss-dependency
    desc: se7enxweb/oss composer dependency
    for: [composer.json, json]
    if:
      type: text
      substr: '"se7enxweb/oss"'

  - id: se7enxweb-ezplatform-kernel-dependency
    desc: se7enxweb/ezplatform-kernel composer dependency
    for: [composer.json, json]
    if:
      type: text
      substr: '"se7enxweb/ezplatform-kernel"'

  - id: se7enxweb-composer-path
    desc: se7enxweb exponential-platform archive path
    for: [archives, zip]
    if:
      type: path
      regex: '(?i)se7enxweb-exponential-platform'

composite_rules:
  - id: se7enxweb-exponential-platform
    desc: se7enxweb Exponential Platform eZ CMS project
    crit: notable
    conf: 0.97
    any:
      - id: se7enxweb-oss-dependency
      - id: se7enxweb-ezplatform-kernel-dependency
      - id: se7enxweb-composer-path
      - id: well-known/app/development/se7enxweb/exponential-platform::se7enxweb-author-homepage
