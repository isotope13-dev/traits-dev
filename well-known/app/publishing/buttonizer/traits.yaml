# Buttonizer — WordPress floating-button / sticky-menu plugin
# (buttonizer.io). Dashboard webpack bundles, React input-type maps,
# and Freemius are product features; identity only.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: Buttonizer WordPress plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])buttonizer-multifunctional-button([\\/]|$)'

  - id: contact-vr-path
    desc: Buttonizer contact-vr plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])button-contact-vr([\\/]|$)'

  - id: plugin-header
    desc: Buttonizer WordPress plugin header
    for: [php]
    if:
      type: text
      substr: 'Plugin Name: Buttonizer - Smart Floating'

  - id: live-chat-plugin-header
    desc: Buttonizer Live Chat plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Buttonizer - Live Chat'

  - id: version-define
    desc: Buttonizer version PHP define
    for: [php]
    if:
      type: text
      substr: "define('BUTTONIZER_VERSION'"

  - id: contact-vr-version
    desc: BZ_CONTACT_BUTTON_VERSION PHP define
    for: [php]
    if:
      type: text
      substr: BZ_CONTACT_BUTTON_VERSION

  - id: api-host
    desc: Buttonizer API host URL
    for: [php]
    if:
      type: text
      substr: api.buttonizer.io

  - id: php-namespace
    desc: BZContactButton PHP namespace
    for: [php]
    if:
      type: text
      substr: 'namespace BZContactButton\'

  - id: wordpress-plugin-name
    desc: Buttonizer Live Chat WordPress plugin name
    for: [zip]
    if:
      type: value
      path: source.wordpress.plugin_name
      exact: 'Buttonizer - Live Chat, AI Chatbot, Call, Chat, Contact Button'

  - id: wordpress-slug
    desc: button-contact-vr WordPress plugin slug
    for: [zip]
    if:
      type: value
      path: source.wordpress.slug
      exact: button-contact-vr

  - id: legacy-copyright
    desc: Buttonizer legacy dashboard copyright
    for: [javascript]
    if:
      type: text
      substr: 'Buttonizer buttonizer-legacy'

composite_rules:
  - id: buttonizer-wordpress-plugin
    desc: Buttonizer WordPress floating-button plugin
    crit: notable
    conf: 0.98
    scope: archive
    needs: 2
    any:
      - id: plugin-path
      - id: contact-vr-path
      - id: plugin-header
      - id: live-chat-plugin-header
      - id: version-define
      - id: contact-vr-version
      - id: api-host
      - id: php-namespace
      - id: wordpress-plugin-name
      - id: wordpress-slug
      - id: legacy-copyright
