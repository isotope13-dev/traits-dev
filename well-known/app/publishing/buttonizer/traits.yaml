# Buttonizer — WordPress floating-button / sticky-menu plugin
# (buttonizer.io). Dashboard webpack bundles and Freemius are product
# features; identity only.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, text, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: plugin-path
    desc: Buttonizer WordPress plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])buttonizer-multifunctional-button([\\/]|$)'

  - id: plugin-header
    desc: Buttonizer WordPress plugin header
    for: [php]
    if:
      type: text
      substr: 'Plugin Name: Buttonizer - Smart Floating'

  - id: version-define
    desc: Buttonizer version PHP define
    for: [php]
    if:
      type: text
      substr: "define('BUTTONIZER_VERSION'"

  - id: legacy-copyright
    desc: Buttonizer legacy dashboard copyright
    for: [javascript]
    if:
      type: text
      substr: 'Buttonizer buttonizer-legacy'
