# Ultimate Social Media PLUS — WordPress social share icon plugin.
defaults:
  platforms: [windows, unix]
  for: [php, javascript, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-path
    desc: Ultimate Social Media PLUS path
    if:
      type: path
      regex: '(?i)(^|[\\/])ultimate-social-media-plus([\\/]|$)'

  - id: plugin-header
    desc: Ultimate Social Media PLUS header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Ultimate Social Media PLUS\s*$'
