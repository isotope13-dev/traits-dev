# Quotes and Tips — BestWebSoft WordPress quotes/tips block plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, markdown, text, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: plugin-header-name
    desc: Quotes and Tips plugin header name
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Plugin Name: Quotes and Tips by BestWebSoft'

  - id: plugin-textdomain
    desc: Quotes and Tips WordPress textdomain
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Text Domain: quotes-and-tips'

  - id: bestwebsoft-author-uri
    desc: BestWebSoft author URI marker
    for: [php, markdown, text]
    if:
      type: text
      substr: 'Author URI: https://bestwebsoft.com/'

  - id: bestwebsoft-system-info-marker
    desc: BestWebSoft system info diagnostics marker
    for: [php]
    if:
      type: text
      substr: "WordPress Environment"

composite_rules:
  - id: quotes-and-tips-plugin-context
    desc: Quotes and Tips BestWebSoft WordPress plugin
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: plugin-textdomain
    any:
      - id: plugin-header-name
      - id: bestwebsoft-author-uri
