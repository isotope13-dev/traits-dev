# ioBroker.javascript — VS Code extension for ioBroker script development.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: iobroker-javascript-vsix-name
    desc: ioBroker.javascript VSIX archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)iobroker-javascript.*\.vsix$'

  - id: iobroker-javascript-package-name
    desc: ioBroker.javascript extension package name
    crit: notable
    for: [archives, javascript, json, package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"iobroker-javascript"'

  - id: iobroker-javascript-publisher
    desc: nokxs VS Code publisher marker
    crit: notable
    for: [archives, javascript, json, package.json, vsix-manifest]
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"nokxs"'

  - id: iobroker-javascript-command-namespace
    desc: ioBroker connect command namespace marker
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: iobroker-javascript.connect

  - id: iobroker-config-workspace-marker
    desc: ioBroker workspace config activation marker
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: workspaceContains:.iobroker-config.json

composite_rules:
  - id: iobroker-javascript-vscode-extension
    desc: ioBroker.javascript VS Code script IDE extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: iobroker-javascript-publisher
    any:
      - id: iobroker-javascript-vsix-name
      - id: iobroker-javascript-package-name
      - id: iobroker-javascript-command-namespace
