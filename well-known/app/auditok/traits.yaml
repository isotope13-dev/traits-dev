# auditok — Amine Sehili audio activity detection library.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: auditok-wheel-name
    desc: auditok Python wheel archive name
    if:
      type: path
      regex: '(?i)auditok-.*\.whl$'

  - id: auditok-package-name
    desc: auditok Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*auditok\s*$'

  - id: auditok-vad-marker
    desc: auditok voice activity detection marker
    for: [python, markdown]
    crit: notable
    if:
      type: text
      substr: voice activity detection

composite_rules:
  - id: auditok-python-package
    desc: auditok audio segmentation Python library
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: auditok-wheel-name
      - id: auditok-package-name
      - id: auditok-vad-marker
