defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Bito VS Code package identity
    for: [vsix-manifest, archive]
    if:
      type: value
      path: vsix.identity.id
      exact: Bito

  - id: package-publisher
    desc: Bito VS Code publisher identity
    for: [vsix-manifest, archive]
    if:
      type: value
      path: vsix.identity.publisher
      exact: Bito

  - id: project-repository
    desc: Bito upstream repository identity
    for: [vsix-manifest, archive]
    if:
      type: value
      path: vsix.properties.services.links.source
      regex: 'github\.com/gitbito/bitoai(\.git)?$'

composite_rules:
  - id: vscode-extension-context
    desc: Recognized Bito VS Code extension context
    crit: exception
    conf: 0.99
    for: [vsix-manifest, archive, javascript, typescript]
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
      - id: project-repository
