# gitchat — Gitchat team chat VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: gitchat-vsix-name
    desc: GitChat VSIX archive name
    if:
      type: path
      regex: '(?i)Gitchat\.gitchat'

  - id: gitchat-package-name
    desc: GitChat extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"gitchat"'

  - id: gitchat-publisher
    desc: Gitchat VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"Gitchat"'

  - id: gitchat-command-namespace
    desc: GitChat command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: gitchat.

composite_rules:
  - id: gitchat-vscode-extension
    desc: GitChat IDE team chat VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: gitchat-publisher
    any:
      - id: gitchat-vsix-name
      - id: gitchat-package-name
      - id: gitchat-command-namespace
