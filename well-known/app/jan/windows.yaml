# Jan AI's signed Windows desktop application identity.
# The product marker and verified Authenticode subject are intentionally
# combined so an arbitrary file that merely claims the Jan product name does
# not receive the benign application context.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576

traits:
  - id: jan-product-identity
    desc: Jan desktop product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '^Jan$'
  - id: jan-ai-authenticode-signer
    desc: Jan AI Authenticode signer identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: 'CN=Jan AI Pte\. Ltd\.,O=Jan AI Pte\. Ltd\.'

composite_rules:
  - id: jan-ai-verified-binary
    desc: Verified Jan AI signed Windows binary
    crit: notable
    conf: 0.99
    all:
      - id: jan-product-identity
      - id: jan-ai-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  - id: jan-ai-signed-app
    desc: Officially signed Jan desktop application context
    crit: exception
    conf: 0.99
    all:
      - id: jan-ai-verified-binary
      - id: jan-ai-authenticode-signer
  - id: jan-ai-tauri-runtime
    desc: Officially signed Jan Tauri runtime context
    crit: exception
    conf: 0.99
    all:
      - id: jan-ai-signed-app
      - id: metadata/build/framework::tauri-runtime
