# @react-native-firebase/crashlytics — Firebase Crashlytics for React Native.
defaults:
  platforms: [unix, windows, ios]
  for: [package.json, objc, zip]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: React Native Firebase Crashlytics package
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@react-native-firebase/crashlytics'

  - id: rnfb-crashlytics-module-path
    desc: RNFBCrashlytics native module path
    for: [objc]
    if:
      type: path
      regex: '(?i)RNFBCrashlytics'

composite_rules:
  - id: react-native-firebase-crashlytics
    desc: React Native Firebase Crashlytics SDK
    any:
      - id: package-name
      - id: rnfb-crashlytics-module-path
