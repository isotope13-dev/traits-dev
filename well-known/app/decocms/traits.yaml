defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  size_max: 5000000
traits:
- id: package-name
  desc: decoCMS npm package name
  crit: notable
  conf: 0.98
  for: [package.json]
  if:
    type: value
    path: name
    exact: decocms
- id: studio-package-name
  desc: deco Studio workspace package name
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: "@decocms/studio"
- id: studio-repository-url
  desc: deco Studio source repository URL
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: repository.url
    regex: 'github\.com/decocms/studio(\.git)?'
- id: visual-editor-activate-message
  desc: Visual editor activation message
  crit: component
  conf: 0.93
  if:
    type: text
    substr: visual-editor::activate
- id: iframe-bootstrap-script-constant
  desc: Iframe bootstrap script constant
  crit: component
  conf: 0.9
  if:
    type: text
    substr: IFRAME_BOOTSTRAP_SCRIPT
- id: local-service-manager-context
  desc: Local service manager context
  crit: component
  conf: 0.9
  if:
    type: text
    regex: PostgreSQL[\s\S]{0,120}NATS[\s\S]{0,120}running
composite_rules:
- id: decocms-package
  desc: decoCMS self-hosted MCP gateway package
  crit: notable
  any:
  - id: package-name
  - id: studio-package-name
  - id: studio-repository-url
  - id: local-service-manager
- id: visual-editor-iframe-bootstrap
  desc: decoCMS visual editor iframe bootstrap
  crit: notable
  all:
  - id: visual-editor-activate-message
  - id: iframe-bootstrap-script-constant
- id: local-service-manager
  desc: decoCMS local service manager
  crit: notable
  all:
  - id: local-service-manager-context
  - id: visual-editor-activate-message
