# Alexandria — Evangelos Pappas's local-first knowledge engine with MCP exposure.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: Alexandria wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: alexandria_wiki

  - id: package-name
    desc: Alexandria package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: alexandria-wiki

  - id: author-marker
    desc: Alexandria author metadata marker
    for: [pkginfo]
    if:
      type: text
      substr: Evangelos Pappas

  - id: alexandria-mcp-marker
    desc: Alexandria MCP server module marker
    for: [python]
    if:
      type: text
      regex: '(?i)alexandria\.mcp\.server|alexandria_wiki'

  - id: secret-vault-marker
    desc: Alexandria encrypted secret vault marker
    for: [python]
    if:
      type: text
      regex: '(?i)class SecretVault|ALEXANDRIA_VAULT_PASSPHRASE'

composite_rules:
  - id: alexandria-wiki-python-wheel
    desc: Alexandria local-first knowledge engine wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives, whl]
    all:
      - id: wheel-distribution
    any:
      - id: package-name
      - id: author-marker
      - id: alexandria-mcp-marker
      - id: secret-vault-marker
