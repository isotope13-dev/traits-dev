# My Trail Camera — WordPress trail camera management plugin (w1k).
defaults:
  platforms: [unix, windows]
  for: [php, javascript, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: my-trail-camera-plugin-header
    desc: My Trail Camera WordPress plugin header
    if:
      type: text
      regex: '(?i)Plugin Name:\s*My Trail Camera'

  - id: mtcam-prefix-marker
    desc: My Trail Camera mtcam_ prefix marker
    if:
      type: text
      substr: mtcam_
