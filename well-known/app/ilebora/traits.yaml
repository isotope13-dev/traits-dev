defaults:
  platforms: [unix, windows]
  for: [zip, javascript, php, data]
  crit: notable
  conf: 0.99

traits:
  - id: release-archive-name
    desc: ILEBORA Core Slim release archive name
    for: [zip]
    if:
      type: basename
      regex: '(?i)^ilebora-core-slim-sec-v[0-9][^\\/]*\\.zip$'

  - id: composer-package-name
    desc: ILEBORA Core Slim Composer package name
    for: [data]
    if:
      type: text
      regex: '(?i)"name"\\s*:\\s*"ilebora/core-slim-sec"'

  - id: realtime-query-script
    desc: ILEBORA realtime query script path
    for: [javascript, data]
    if:
      type: basename
      exact: se_m.bu

  - id: application-script
    desc: ILEBORA application script path
    for: [javascript, data]
    if:
      type: basename
      exact: ilebora_or.js

composite_rules:
  - id: release-identity
    desc: ILEBORA Core Slim package identity
    crit: notable
    conf: 0.99
    for: [zip, data]
    scope: archive
    all:
      - id: release-archive-name
      - id: composer-package-name

  - id: release-archive-context
    desc: ILEBORA framework source context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: release-identity
      - id: realtime-query-script
      - id: application-script
