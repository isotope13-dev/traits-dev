# DeepV Code — OrionStarAI AI programming assistant VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: deepv-vsix-name
    desc: DeepV Code VSIX archive name
    if:
      type: path
      regex: '(?i)DeepX\.deepv-code-vscode-ui-plugin'

  - id: deepv-package-name
    desc: DeepV Code extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"deepv-code-vscode-ui-plugin"'

  - id: deepv-publisher
    desc: DeepX VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"DeepX"'

  - id: deepvcode-repo-marker
    desc: DeepVCode upstream repository marker
    if:
      type: text
      substr: github.com/OrionStarAI/DeepVCode

  - id: deepv-assistant-command-marker
    desc: DeepV AI assistant command marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      regex: '(?i)deepv\.openAIAssistant|DeepV Code for VSCode'

composite_rules:
  - id: deepv-code-vscode-extension
    desc: DeepV Code AI programming assistant VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: deepv-publisher
    any:
      - id: deepv-vsix-name
      - id: deepv-package-name
      - id: deepvcode-repo-marker
      - id: deepv-assistant-command-marker
