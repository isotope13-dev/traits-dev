defaults:
  platforms: [unix, windows]
  for: [python, markdown, text]
  crit: notable
  conf: 0.95

traits:
  - id: freeride-product-name
    desc: FreeRide OpenClaw skill product name
    if:
      type: text
      regex: '(?i)\bFreeRide\b'

  - id: freeride-openrouter-referer
    desc: FreeRide OpenRouter App Activity referer URL
    conf: 0.99
    if:
      type: text
      substr: github.com/Shaivpidadi/FreeRide

composite_rules:
  - id: freeride-openclaw-skill
    desc: FreeRide OpenClaw model-ranking skill
    conf: 0.97
    all:
      - id: freeride-product-name
      - id: micro-behaviors/fs/path/application/config::openclaw-config-json-path
