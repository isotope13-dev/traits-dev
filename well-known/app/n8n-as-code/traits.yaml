# n8n as code — Etienne Lescot's VS Code extension for syncing n8n workflows.
# Its localhost ProxyService reverse-proxies the user's configured n8n instance
# so the editor webview can embed the n8n UI and persist auth cookies.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: n8n-as-code-vsix-name
    desc: n8n as code VSIX archive name
    if:
      type: path
      regex: '(?i)etienne-lescot\.n8n-as-code'

  - id: n8n-as-code-package-name
    desc: n8n as code extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"n8n-as-code"'

  - id: n8n-as-code-publisher
    desc: Etienne Lescot VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"etienne-lescot"'

  - id: n8nac-runtime-marker
    desc: n8nac workflow sync runtime marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)\bn8nac\b|@n8n-as-code/'

  - id: n8n-local-proxy-service-marker
    desc: n8n as code localhost reverse proxy service
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)ProxyService|n8n-cookies-|n8nac-config\.json'

composite_rules:
  - id: n8n-as-code-vscode-extension
    desc: n8n as code workflow sync VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: n8n-as-code-publisher
    any:
      - id: n8n-as-code-vsix-name
      - id: n8n-as-code-package-name
      - id: n8nac-runtime-marker
