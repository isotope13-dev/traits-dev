# tiycore — TiyAgents unified Rust LLM and agent runtime library.
defaults:
  platforms: [unix, windows]
  for: [rust, markdown, text, archives]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: tiycore-crate-name
    desc: tiycore Rust crate name
    if:
      type: text
      regex: '(?i)^name\s*=\s*"tiycore"'

  - id: tiycore-repository-marker
    desc: TiyAgents tiycore repository marker
    if:
      type: text
      substr: github.com/TiyAgents/tiycore

  - id: tiycore-llm-protocol-marker
    desc: tiycore LLMProtocol trait marker
    for: [rust, markdown]
    crit: notable
    if:
      type: text
      substr: LLMProtocol

  - id: tiycore-catalog-sync-bin
    desc: tiycore catalog sync binary marker
    for: [rust]
    crit: notable
    if:
      type: text
      substr: tiy-catalog-sync

composite_rules:
  - id: tiycore-rust-library
    desc: TiyAgents tiycore LLM agent runtime crate
    crit: notable
    conf: 0.98
    any:
      - id: tiycore-crate-name
      - id: tiycore-repository-marker
      - id: tiycore-llm-protocol-marker
      - id: tiycore-catalog-sync-bin
