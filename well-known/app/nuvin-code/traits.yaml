# @nuvin/nuvin-code — interactive AI coding-assistant TUI. The published dist
# is intentionally passed through javascript-obfuscator; identity comes from
# the package name and the nuvin-code bin entry, not from the mangled bundle.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.95
  size_min: 200
  size_max: 5000000

traits:
  - id: nuvin-code-package-name
    desc: '@nuvin/nuvin-code package identity'
    conf: 0.98
    if:
      type: value
      path: name
      exact: '@nuvin/nuvin-code'

  - id: nuvin-code-bin-entry
    desc: nuvin-code CLI bin entry
    crit: component
    conf: 0.95
    if:
      type: value
      path: bin.nuvin-code
      exists: true

  - id: nuvin-agent-core-dependency
    desc: Depends on @nuvin/agent-core
    crit: component
    conf: 0.9
    if:
      type: value
      path: dependencies.@nuvin/agent-core
      exists: true

composite_rules:
  - id: nuvin-code-identity
    desc: '@nuvin/nuvin-code assistant package'
    conf: 0.97
    all:
      - id: nuvin-code-package-name
    any:
      - id: nuvin-code-bin-entry
      - id: nuvin-agent-core-dependency
