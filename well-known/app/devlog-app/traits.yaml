# devlog-app — DevLog engineering journal VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: devlog-app-vsix-name
    desc: DevLog VSIX archive name
    if:
      type: path
      regex: '(?i)devlog\.devlog-app'

  - id: devlog-app-package-name
    desc: DevLog extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"devlog-app"'

  - id: devlog-app-publisher
    desc: devlog VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"devlog"'

  - id: devlog-app-command-namespace
    desc: DevLog command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: devlog.

composite_rules:
  - id: devlog-app-vscode-extension
    desc: DevLog engineering journal VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: devlog-app-publisher
    any:
      - id: devlog-app-vsix-name
      - id: devlog-app-package-name
      - id: devlog-app-command-namespace
