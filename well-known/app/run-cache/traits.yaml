# run_cache — Fivetran dbt run caching plugin (Python wheel).
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: run-cache-wheel-name
    desc: run_cache Python wheel archive name
    if:
      type: path
      regex: '(?i)run_cache-.*\.whl$'

  - id: run-cache-package-name
    desc: run-cache Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*run-cache\s*$'

  - id: dbt-run-cache-module-marker
    desc: dbt_run_cache plugin module marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: dbt_run_cache

composite_rules:
  - id: run-cache-python-package
    desc: Fivetran dbt run caching plugin wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: run-cache-wheel-name
      - id: run-cache-package-name
      - id: dbt-run-cache-module-marker
