# Reasonix is an open-source DeepSeek coding agent distributed from its
# upstream repository and through npm, Homebrew, and release archives.
defaults:
  platforms: [unix, windows]
  for: [tar, go, javascript, typescript, markdown, shell, package.json, json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: upstream-repository
    desc: Reasonix upstream repository marker
    if:
      type: text
      substr: github.com/esengine/DeepSeek-Reasonix

  - id: product-description
    desc: Reasonix coding-agent product description
    if:
      type: text
      substr: Cache-first DeepSeek coding agent

composite_rules:
  - id: source-archive-context
    desc: Recognized Reasonix upstream source archive
    crit: exception
    conf: 0.99
    for: [tar, archives]
    scope: archive
    all:
      - id: upstream-repository
      - id: product-description
