# Kombai's published VS Code extension. The browser-profile importer is a
# user-invoked feature that imports a selected Chrome profile into Kombai's
# managed Playwright browser; it is not evidence of credential theft by itself.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, package.json, vsix-manifest]

traits:
  - id: package-name
    desc: Kombai extension package name
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"name"\s*:\s*"kombai"'
  - id: publisher-id
    desc: Kombai VS Code publisher identity
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)("publisher"\s*:\s*"kombai"|Publisher="kombai")'
  - id: official-service-domain
    desc: Official Kombai service host
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\b(assistant\.app|agent|reflect)\.kombai\.com\b'
  - id: browser-profile-import-api
    desc: Kombai browser profile import API
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(import/chromeProfileCookies|extractAndSaveCookies|injectCookies)'
  - id: vendor-runtime-filename
    desc: Kombai vendor runtime bundle filename
    crit: notable
    conf: 0.99
    if:
      type: path
      exact: kombai-vendor-runtime.js
      case_insensitive: true
      basename: true
  # Just the brand token anywhere in the file -- it is the vendor identity, not
  # evidence of the vendor runtime bundle, which the filename trait above
  # establishes. Named for the matcher so a hit on package.json or the uninstall
  # script does not read as "this file is the runtime bundle".
  - id: brand-string
    desc: Kombai brand string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: kombai

composite_rules:
  - id: kombai-browser-profile-import-context
    desc: Recognized Kombai extension browser-profile import context
    crit: exception
    conf: 0.99
    scope: outer
    for: [javascript, package.json, vsix-manifest, archives]
    all:
      - id: official-service-domain
      - id: browser-profile-import-api
  - id: kombai-vendor-runtime-context
    desc: Recognized Kombai vendor runtime bundle
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: vendor-runtime-filename
      - id: brand-string
  - id: kombai-extension-runtime-context
    desc: Recognized Kombai VS Code extension runtime
    crit: exception
    conf: 0.99
    scope: outer
    for: [archives, javascript, package.json, vsix-manifest]
    all:
      - id: package-name
      - id: publisher-id
      - id: official-service-domain
  # NOTE: there is deliberately no exception for uninstall.js. That script does
  # ship os.hostname() + os.userInfo().username to PostHog on uninstall, so
  # collection/monitor/telemetry::host-user-uninstall-telemetry-id is a true
  # positive and should stay visible. The only notable facts that file carries
  # are the brand token and the PostHog SDK identity, so any exception built
  # from them would read "Kombai files using PostHog are exempt from privacy
  # findings" -- a per-vendor allowlist over real behaviour.
