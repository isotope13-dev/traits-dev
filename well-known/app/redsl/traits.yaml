# ReDSL: an LLM-assisted Python refactoring and developer automation toolkit.
# Its local HTTP, subprocess, Docker, and package-repair features are exposed
# by explicit CLI commands and are not, by themselves, malicious behavior.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: ReDSL wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: redsl

  - id: package-name
    desc: ReDSL package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: redsl

  - id: product-summary
    desc: ReDSL package summary identity
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: 'Refactor + DSL + Self-Learning'

  - id: orchestrator-class
    desc: ReDSL refactor orchestrator class
    for: [python]
    if:
      type: symbol
      kind: function
      exact: RefactorOrchestrator

  - id: llm-router-matrix
    desc: ReDSL LLM router matrix
    for: [python]
    if:
      type: text
      substr: MODEL_MATRIX

composite_rules:
  - id: package-context
    desc: ReDSL autonomous refactoring framework
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives, whl]
    all:
      - id: wheel-distribution
    any:
      - id: package-name
      - id: product-summary
      - id: orchestrator-class
      - id: llm-router-matrix
