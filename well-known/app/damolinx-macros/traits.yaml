# Damolinx Macros — damolinx JS/TS macro automation VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: damolinx-macros-vsix-name
    desc: Damolinx Macros VSIX archive name
    if:
      type: path
      regex: '(?i)damolinx\.damolinx-macros'

  - id: damolinx-macros-package-name
    desc: Damolinx Macros extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"damolinx-macros"'

  - id: damolinx-macros-publisher
    desc: damolinx VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"damolinx"'

  - id: damolinx-macro-vm-sandbox-marker
    desc: Damolinx macro vm sandbox runtime marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      regex: '(?i)vm\.runInContext|vm\.runInNewContext'

  - id: damolinx-macro-file-extension-marker
    desc: Damolinx macro file extension marker
    for: [javascript, typescript, json, markdown]
    crit: notable
    if:
      type: text
      substr: .macro.js

composite_rules:
  - id: damolinx-macros-vscode-extension
    desc: Damolinx Macros VS Code macro automation extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: damolinx-macros-publisher
    any:
      - id: damolinx-macros-vsix-name
      - id: damolinx-macros-package-name
      - id: damolinx-macro-vm-sandbox-marker
      - id: damolinx-macro-file-extension-marker
