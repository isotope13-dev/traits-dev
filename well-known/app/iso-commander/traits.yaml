defaults:
  platforms: [unix]
  for: [elf]
  crit: baseline
  conf: 0.99

traits:
  - id: database-file
    desc: Iso Commander database filename
    crit: notable
    size_min: 100000
    size_max: 10000000
    if:
      type: text
      substr: iso_commander_database.txt
      section: rdata

  - id: manageiso-marker
    desc: Iso Commander ManageISO menu
    crit: component
    size_min: 100000
    size_max: 10000000
    if:
      type: text
      word: ManageISO
      section: rdata

  - id: convert2iso-marker
    desc: Iso Commander Convert2ISO menu
    crit: component
    size_min: 100000
    size_max: 10000000
    if:
      type: text
      word: Convert2ISO
      section: rdata

  - id: importiso-marker
    desc: Iso Commander ImportISO menu
    crit: component
    size_min: 100000
    size_max: 10000000
    if:
      type: text
      word: ImportISO
      section: rdata

composite_rules:
  - id: menu-marker
    desc: Iso Commander menu marker
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 10000000
    any:
      - id: manageiso-marker
      - id: convert2iso-marker
      - id: importiso-marker

  - id: iso-commander-context
    desc: Iso Commander ISO management utility
    crit: notable
    conf: 0.99
    all:
      - id: database-file
      - id: menu-marker
