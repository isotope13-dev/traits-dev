# Zotero Agent is a local Zotero CLI/MCP bridge.  Its HTTP and JavaScript
# capabilities are expected product behavior; these traits identify the tool
# so those capabilities can be interpreted in context during triage.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Zotero Agent Python package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: zotero-agent

  - id: upstream-repository
    desc: Zotero Agent upstream repository reference
    for: [pkginfo, markdown, text]
    if:
      type: text
      substr: github.com/alex-roc/zotero-agent

  - id: local-bridge-token
    desc: Zotero Agent local bridge authentication header
    for: [python, text]
    if:
      type: text
      substr: X-Zotero-Agent-Token

composite_rules:
  - id: package-context
    desc: Recognized Zotero Agent package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository
