# Ghost is the Ghost Foundation's open-source publishing platform. These
# package-manifest markers identify the official npm distribution; they do not
# assert that arbitrary code shipped beside a Ghost manifest is trustworthy.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ghost npm package name
    if:
      type: value
      path: name
      exact: ghost

  - id: upstream-repository
    desc: Ghost upstream repository URL
    if:
      type: value
      path: repository.url
      regex: '^(git://|https://)github\.com/TryGhost/Ghost(\.git)?$'

  - id: homepage
    desc: Ghost project homepage URL
    if:
      type: value
      path: homepage
      exact: https://ghost.org

composite_rules:
  - id: official-package-identity
    desc: Official Ghost npm package identity
    all:
      - id: package-name
      - id: upstream-repository
      - id: homepage
