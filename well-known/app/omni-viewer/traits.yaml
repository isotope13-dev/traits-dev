# omni-viewer — battlecook multi-format file viewer VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: omni-viewer-vsix-name
    desc: omni-viewer VSIX archive name
    if:
      type: path
      regex: '(?i)battlecook\.omni-viewer'

  - id: omni-viewer-package-name
    desc: omni-viewer extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"omni-viewer"'

  - id: omni-viewer-publisher
    desc: battlecook VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"battlecook"'

  - id: omni-viewer-custom-editor-marker
    desc: omni-viewer custom editor view type
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: omni-viewer.

composite_rules:
  - id: omni-viewer-vscode-extension
    desc: battlecook multi-format file viewer extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: omni-viewer-publisher
    any:
      - id: omni-viewer-vsix-name
      - id: omni-viewer-package-name
      - id: omni-viewer-custom-editor-marker
