defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - manifests
  - documents
  - binaries
  - data
  - zip
  - dmg
  crit: notable
  conf: 0.98
  size_max: 600000000
traits:
- id: bruno-path
  desc: Bruno app path marker
  if:
    type: path
    substr: Bruno
- id: usebruno-path
  desc: usebruno app path marker
  if:
    type: path
    substr: usebruno
- id: bruno-enterprise-registry
  desc: Bruno enterprise registry path
  for:
  - javascript
  if:
    type: text
    substr: BrunoSoftwareInc
- id: bruno-collection-manifest
  desc: Bruno collection manifest name
  for:
  - javascript
  if:
    type: text
    substr: opencollection.yml
composite_rules:
- id: app-bundle
  desc: Bruno app bundle member
  any:
  - id: bruno-path
  - id: usebruno-path
