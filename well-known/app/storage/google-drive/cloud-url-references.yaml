defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: gdrive-export-download-url
  desc: Google Drive export-download link
  crit: notable
  if:
    type: text
    regex: (drive|docs)\.google\.com/uc\?export=download&id=[a-zA-Z0-9_-]{20,}
- id: gdrive-usercontent-download-reference
  desc: Google usercontent download URL
  crit: notable
  if:
    type: text
    substr: drive.usercontent.google.com/download
- id: gdrive-usercontent-host
  desc: Google usercontent download host
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: drive.usercontent.google.com
- id: gdrive-pe-file-url
  desc: Google Drive executable URL reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (drive|docs)\.google\.com/(uc|file/d)/[a-zA-Z0-9_-]{20,}[^\s,"'<>]{0,200}\.(exe|dll)\b
- id: gdrive-script-file-url
  desc: Google Drive script URL reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (drive|docs)\.google\.com/(uc|file/d)/[a-zA-Z0-9_-]{20,}[^\s,"'<>]{0,200}\.(bat|ps1)\b

composite_rules:
- id: gdrive-download-url-split
  desc: Google Drive download URL split across strings
  crit: notable
  conf: 0.98
  all:
  - id: gdrive-usercontent-host
  - id: micro-behaviors/communications/url/query/endpoint::download-id-export-query
- id: gdrive-download-url
  desc: Google Drive download URL
  crit: notable
  conf: 1.0
  any:
  - id: gdrive-export-download-url
  - id: gdrive-usercontent-download-reference
  - id: gdrive-download-url-split
- id: gdrive-executable-url
  desc: Google Drive URL with executable extension
  crit: notable
  conf: 0.9
  any:
  - id: gdrive-pe-file-url
  - id: gdrive-script-file-url
