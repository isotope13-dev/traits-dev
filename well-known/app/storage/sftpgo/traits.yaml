# SFTPGo, the SFTP/FTP/WebDAV server. The Go main module identifies the
# server binary; the asset and apk paths are only path observations.
defaults:
  platforms: [linux]
  crit: notable

traits:
  - id: go-module
    desc: SFTPGo Go main module
    for: [elf]
    conf: 0.97
    size_min: 1048576
    if:
      type: value
      path: elf.go.module.path
      regex: '^github\.com/drakkan/sftpgo(/v[0-9]+)?$'
  - id: static-asset-path
    desc: Path is under share/sftpgo
    for: [javascript]
    conf: 0.5
    if:
      type: path
      regex: '(?i)share[\\/]sftpgo[\\/]'
  - id: apk-member-path
    desc: Path is inside an sftpgo apk
    for: [javascript, alpine_apk]
    conf: 0.5
    if:
      type: path
      regex: '(?i)sftpgo-[^\\/]+\.apk[\\/]'
