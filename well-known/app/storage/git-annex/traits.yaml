# git-annex — manage files with git without storing their content in git
# (Joey Hess). Fedora/Debian ship it as an RPM/deb; the source tree includes
# ikiwiki docs. Identity only; encryption and Tor special remotes are
# documented product features, not C2.
defaults:
  platforms: [linux]
  for: [rpm, elf, text, markdown, shell]
  crit: notable
  conf: 0.96
  size_min: 64
  size_max: 80000000

traits:
  - id: rpm-name
    desc: git-annex RPM package name
    for: [rpm]
    conf: 0.99
    if:
      type: value
      path: rpm.name
      exact: git-annex

  - id: hackage-url
    desc: git-annex Hackage package URL
    for: [rpm, text, markdown]
    conf: 0.98
    if:
      type: text
      substr: hackage.haskell.org/package/git-annex

  - id: version-banner
    desc: git-annex version banner
    for: [elf, text, shell, markdown]
    conf: 0.97
    if:
      type: text
      regex: 'git-annex version:\s+\d+'

  - id: enable-tor-command
    desc: git-annex enable-tor command
    for: [elf, text, shell, markdown]
    conf: 0.96
    if:
      type: text
      substr: git-annex enable-tor
