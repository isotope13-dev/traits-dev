# ruTorrent's loginmgr plugin. Each tracker account is a subclass of the
# commonAccount base declared in plugins/loginmgr/accounts.php, and posts the
# account's credentials to the tracker's login page. A stock account for a
# free-TLD tracker (Xthor, on xthor.tk) therefore reads as a script posting
# credentials to a free-TLD host. The exemption needs both the subclass line and
# the abstract login() signature that the base class declares verbatim; a
# credential stealer that merely mimics the class name does not carry it.
defaults:
  platforms: [linux, macos, windows]
  for: [php]
  crit: component
  conf: 0.95

traits:
  - id: rutorrent-loginmgr-account-class
    desc: Subclass of ruTorrent commonAccount
    if:
      type: text
      regex: '(?m)^class \w{1,40}Account extends commonAccount\b'

  - id: rutorrent-loginmgr-login-signature
    desc: commonAccount abstract login() signature
    if:
      type: text
      substr: 'protected function login($client,$login,$password,&$url,&$method,&$content_type,&$body,&$is_result_fetched)'

composite_rules:
  - id: rutorrent-loginmgr-account
    desc: ruTorrent tracker-login account plugin
    crit: notable
    conf: 0.95
    all:
      - id: rutorrent-loginmgr-account-class
      - id: rutorrent-loginmgr-login-signature
