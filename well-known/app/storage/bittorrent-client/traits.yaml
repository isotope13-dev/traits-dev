# Official BitTorrent and uTorrent Windows client builds.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 20000000

traits:
  - id: bittorrent-limited-company-versioninfo
    desc: BitTorrent Limited company in VERSIONINFO
    if:
      type: value
      path: pe.version.company
      regex: (?i)^BitTorrent Limited$
  - id: bittorrent-product-versioninfo
    desc: BitTorrent product name in VERSIONINFO
    if:
      type: value
      path: pe.version.product_name
      regex: (?i)^BitTorrent$
  - id: utorrent-product-versioninfo
    desc: uTorrent product name in VERSIONINFO
    if:
      type: value
      path: pe.version.product_name
      regex: (?i)^uTorrent$
  # Packed client builds keep the update host and company name in the image
  # when the VERSIONINFO resource is not parsed from the outer stub.
  - id: utorrent-update-host
    desc: uTorrent client update hostname
    if:
      type: text
      substr: update.utorrent.com
      section: UPX0
  - id: bittorrent-inc-company-text
    desc: BitTorrent Inc company name text
    if:
      type: text
      substr: 'BitTorrent Inc'
      section: UPX0

composite_rules:
  - id: bittorrent-official-client-identity
    desc: BitTorrent Limited client version identity
    crit: notable
    conf: 0.99
    all:
      - id: bittorrent-limited-company-versioninfo
    any:
      - id: bittorrent-product-versioninfo
      - id: utorrent-product-versioninfo
  - id: bittorrent-embedded-client-text
    desc: Embedded BitTorrent client update text
    crit: notable
    conf: 0.99
    all:
      - id: utorrent-update-host
      - id: bittorrent-inc-company-text
