# AWS's own official code-example repository (github.com/awsdocs/aws-doc-sdk-examples).
# Every example is tagged with the `snippet-start:[...]` / `snippet-end:[...]`
# convention used by the AWS documentation build pipeline to pull runnable
# code into the public docs -- it appears tens of thousands of times across
# the repo and identifies the source unambiguously. Individual example files
# implement single S3 (and other service) API operations like copy-object and
# delete-object as separate, independently-callable functions for teaching
# purposes; the ransomware copy-then-delete composites need this context to
# avoid convicting the reference implementation of the very operations they
# describe.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.97

traits:
  - id: repo-path-identity
    desc: aws-doc-sdk-examples repository path
    if:
      type: path
      regex: '(?i)aws-doc-sdk-examples'

  - id: docs-snippet-marker
    desc: AWS docs snippet-start/end marker
    if:
      type: text
      regex: '(?i)snippet-(start|end):\[[a-z0-9_.-]+\]'

composite_rules:
  - id: benign-example-context
    desc: Recognized AWS doc SDK examples repository context
    crit: exception
    conf: 0.98
    all:
      - id: repo-path-identity
      - id: docs-snippet-marker
