# Official qBittorrent BitTorrent client (Windows PE + upstream source).
# Bundled NSIS UAC plugin hooks/tokens are installer elevation, not a patcher.
defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.98
  size_min: 1000000
  size_max: 80000000

traits:
  - id: qbittorrent-artifact-path
    desc: qBittorrent installer artifact path
    size_min: 1000
    if:
      type: path
      substr: qbittorrent
  - id: qbittorrent-company-name
    desc: qBittorrent PE company metadata
    if:
      type: value
      path: pe.version.company
      exact: The qBittorrent project
  - id: qbittorrent-product-name
    desc: qBittorrent PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: qBittorrent
  - id: source-tarball-name
    desc: qBittorrent source tarball basename
    for: [tar, xz]
    platforms: [unix, windows]
    crit: notable
    size_min: 32
    size_max: 200000000
    if:
      type: basename
      regex: 'qbittorrent-[0-9].*\.tar'
  - id: desktop-name
    desc: qBittorrent desktop application name
    for: [desktop-entry]
    platforms: [linux]
    crit: notable
    size_min: 32
    size_max: 1000000
    if:
      type: text
      regex: '(?m)^Name=qBittorrent$'
  - id: github-repo
    desc: qbittorrent GitHub repository
    for: [text, markdown, github-actions]
    platforms: [unix, windows]
    crit: notable
    size_min: 1
    size_max: 2000000
    if:
      type: text
      substr: github.com/qbittorrent/qBittorrent
  - id: appstream-id
    desc: qBittorrent AppStream application id
    for: [xml, text]
    platforms: [linux]
    crit: notable
    size_min: 32
    size_max: 2000000
    if:
      type: text
      substr: org.qbittorrent.qBittorrent
  - id: cmake-description
    desc: qBittorrent CMake project description
    for: [text]
    platforms: [unix, windows]
    crit: notable
    size_min: 32
    size_max: 2000000
    if:
      type: text
      substr: 'The qBittorrent BitTorrent client'

composite_rules:
  - id: qbittorrent-official-binary
    desc: Official qBittorrent Windows binary
    crit: notable
    conf: 0.99
    any:
      - id: qbittorrent-artifact-path
      - id: qbittorrent-company-name
      - id: qbittorrent-product-name
