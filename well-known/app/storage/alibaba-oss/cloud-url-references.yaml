defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: oss-service-host-reference
  desc: Alibaba OSS endpoint hostname
  crit: notable
  if:
    type: text
    regex: (?i)([A-Za-z0-9-]{1,64}\.oss-(cn|ap|us|eu|me)-[A-Za-z0-9-]{1,32}|oss)\.aliyuncs\.com
- id: oss-bucket-host-cn-ap
  desc: Alibaba OSS bucket hostname (CN/AP)
  crit: notable
  if:
    type: text
    regex: '[a-z0-9-]{1,64}\.oss-(cn|ap)-[a-z0-9-]{1,32}\.aliyuncs\.com'
- id: oss-bucket-host-us-eu
  desc: Alibaba OSS bucket hostname (US/EU)
  crit: notable
  if:
    type: text
    regex: '[a-z0-9-]{1,64}\.oss-(us|eu)-[a-z0-9-]{1,32}\.aliyuncs\.com'
- id: oss-bucket-host-me
  desc: Alibaba OSS bucket hostname (ME)
  crit: notable
  if:
    type: text
    regex: '[a-z0-9-]{1,64}\.oss-(me)-[a-z0-9-]{1,32}\.aliyuncs\.com'
- id: oss-executable-url-cn-ap
  desc: "Alibaba OSS EXE/DLL URL (CN/AP regions)"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.oss-(cn|ap)-[a-z0-9-]{1,32}\.aliyuncs\.com/.{1,200}\.(exe|dll)\b
- id: oss-script-url-cn-ap
  desc: "Alibaba OSS script URL (CN/AP regions)"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.oss-(cn|ap)-[a-z0-9-]{1,32}\.aliyuncs\.com/.{1,200}\.(bat|ps1)\b
- id: oss-executable-url-us-eu
  desc: "Alibaba OSS EXE/DLL URL (US/EU regions)"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.oss-(us|eu)-[a-z0-9-]{1,32}\.aliyuncs\.com/.{1,200}\.(exe|dll)\b
- id: oss-script-url-us-eu
  desc: "Alibaba OSS script URL (US/EU regions)"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.oss-(us|eu)-[a-z0-9-]{1,32}\.aliyuncs\.com/.{1,200}\.(bat|ps1)\b
- id: oss-executable-url-me
  desc: "Alibaba OSS executable/script URL (ME region)"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.oss-(me)-[a-z0-9-]{1,32}\.aliyuncs\.com/.{1,200}\.(exe|dll|bat|ps1)\b

composite_rules:
- id: alibaba-oss-url
  desc: Alibaba OSS bucket hostname reference
  crit: notable
  conf: 1.0
  any:
  - id: oss-bucket-host-cn-ap
  - id: oss-bucket-host-us-eu
  - id: oss-bucket-host-me
- id: alibaba-oss-executable-url
  desc: Alibaba Cloud OSS URL with executable extension
  crit: notable
  conf: 0.9
  any:
  - id: oss-executable-url-cn-ap
  - id: oss-script-url-cn-ap
  - id: oss-executable-url-us-eu
  - id: oss-script-url-us-eu
  - id: oss-executable-url-me
