defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1

traits:
  - id: dthelper-internal-name
    desc: DTProHelper internal name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.internal_name
      exact: DTProHelper.exe
  - id: dthelper-original-filename
    desc: DTProHelper original filename field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.original_filename
      exact: DTProHelper.exe
  - id: dthelper-product-name
    desc: DAEMON Tools Lite product name field
    crit: notable
    conf: 0.92
    if:
      type: value
      path: pe.version.product_name
      exact: DAEMON Tools Lite
  - id: dthelper-disc-soft-company
    desc: Disc Soft Limited company-name field
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      exact: Disc Soft Limited
  - id: dthelper-helper-app-description
    desc: DAEMON Tools Lite Helper file description
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.description
      exact: DAEMON Tools Lite Helper application
  - id: dthelper-avb-disc-soft-signing-subject
    desc: Signed by AVB Disc Soft SIA cert
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=AVB Disc Soft\\, SIA,'
  - id: dthelper-jenkins-pdb-path
    desc: Jenkins dtlite Helper PDB path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.debug.pdb.path
      substr: "Jenkins\\workspace\\dtlite\\ui\\Helper"
  - id: dthelper-basename
    desc: DTProHelper delivery basename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: "^DTProHelper[0-9]?(\\.exe)?$"
      case_insensitive: true
  - id: dthelper-getdtengine-export
    desc: GetDTEngine entrypoint export name
    crit: notable
    conf: 0.95
    if:
      type: text
      section: rdata
      exact: GetDTEngine
  - id: dthelper-discsoftbus-service-ref
    desc: DiscSoftBusServiceLite.exe service reference
    crit: notable
    conf: 0.85
    if:
      type: text
      section: rdata
      exact: DiscSoftBusServiceLite.exe
  - id: dthelper-sptdinst-driver-ref
    desc: SPTDInst-x64.exe driver-installer reference
    crit: notable
    conf: 0.85
    if:
      type: text
      section: rdata
      exact: SPTDInst-x64.exe

composite_rules:
  - id: dthelper-vendor-identity-cluster
    desc: DAEMON Tools Lite Helper vendor identity cluster
    crit: notable
    conf: 0.95
    all:
      - id: well-known/app/storage/daemon-tools::dthelper-internal-name
      - id: well-known/app/storage/daemon-tools::dthelper-product-name
      - id: well-known/app/storage/daemon-tools::dthelper-disc-soft-company
      - id: well-known/app/storage/daemon-tools::dthelper-helper-app-description
  - id: daemon-engine-module-reference-clues
    desc: DAEMON Tools engine module clues
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/linking/runtime::engine-dll-name-reference
      - id: well-known/app/storage/daemon-tools::dthelper-getdtengine-export
    any:
      - id: metadata/lang/natural/diagnostic::engine-loading-error-message
      - id: metadata/binary/section/entropy::data-entropy-7-to-7-8
