defaults:
  platforms: [unix, windows]
  for: [java, class, markdown, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: frostwire-domain
    desc: FrostWire domain
    if:
      type: text
      substr: frostwire.com

  - id: frostwire-github-repo
    desc: FrostWire GitHub repository
    if:
      type: text
      substr: github.com/frostwire/frostwire

  - id: frostwire-package
    desc: FrostWire Java package reference
    if:
      type: text
      substr: com.frostwire

  - id: limewire-i18n-resource
    desc: LimeWire or FrostWire i18n resource bundle
    for: [class]
    if:
      type: basename
      regex: '^Messages(_[a-zA-Z_]+)?\.class$'

composite_rules:
  - id: frostwire-application
    desc: FrostWire BitTorrent client application
    crit: notable
    conf: 0.99
    any:
      - id: frostwire-domain
      - id: frostwire-github-repo
      - id: frostwire-package
      - id: limewire-i18n-resource
