defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.99

traits:
- id: metaserver-source-link
  desc: Dropbox metaserver source link
  if:
    type: text
    regex: 'sourcegraph\.pp\.dropbox\.com/server@[0-9a-f]{40}/-/blob/metaserver/static/'
- id: metaserver-bazel-bundle-path
  desc: Dropbox metaserver bundle path
  if:
    type: text
    substr: bazel-out/k8-opt/bin/metaserver/static/js/

composite_rules:
- id: metaserver-web-bundle
  desc: Dropbox metaserver JavaScript bundle
  crit: notable
  all:
  - id: metaserver-source-link
  - id: metaserver-bazel-bundle-path
