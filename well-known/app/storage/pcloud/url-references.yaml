defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: pcloud-api-url
  desc: pCloud API endpoint URL
  for:
  - java
  - kotlin
  if:
    type: text
    regex: https?://(api\.)?pcloud\.com/|pcloud\.com/(api|file|download)
