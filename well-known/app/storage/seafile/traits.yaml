# Seafile server — open-source file sync and collaboration.
defaults:
  platforms: [unix]
  for: [c, go, markdown, gz, tar]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-prefix
    desc: Seafile server source tree prefix
    if:
      type: path
      regex: 'seafile-server-'

  - id: github-repo
    desc: Seafile server GitHub repository
    if:
      type: text
      substr: github.com/haiwen/seafile
