defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 52428800

traits:
  - id: microsoft-onedrive-product
    desc: Microsoft OneDrive product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft OneDrive

  - id: standalone-updater-original-filename
    desc: OneDrive standalone updater filename
    if:
      type: value
      path: pe.version.original_filename
      exact: OneDriveStandaloneUpdater.exe

composite_rules:
  - id: signed-onedrive-standalone-updater
    desc: Microsoft-signed OneDrive standalone updater context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-onedrive-product
      - id: standalone-updater-original-filename
      - id: metadata/signed/leaf::microsoft-corporation
