defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: myqcloud-domain-reference
  desc: Tencent myqcloud.com domain reference
  crit: notable
  if:
    type: text
    regex: (?i)myqcloud\.com
- id: tencent-cos-url
  desc: Tencent COS bucket URL
  if:
    type: text
    regex: '[a-z0-9-]{1,64}\.cos\.ap-[a-z0-9-]{1,32}\.myqcloud\.com'
- id: cos-pe-url
  desc: Tencent COS URL references EXE or DLL
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \.cos\.ap-[a-z0-9-]{1,32}\.myqcloud\.com/.{1,200}\.(exe|dll)\b
- id: cos-installer-batch-url
  desc: Tencent COS URL references MSI or batch
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \.cos\.ap-[a-z0-9-]{1,32}\.myqcloud\.com/.{1,200}\.(msi|bat)\b
- id: cos-powershell-url
  desc: Tencent COS URL references PowerShell script
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \.cos\.ap-[a-z0-9-]{1,32}\.myqcloud\.com/.{1,200}\.(ps1)\b
- id: tencent-cos-archive-url
  desc: Tencent COS URL with archive extension
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.cos\.ap-[a-z0-9-]{1,32}\.myqcloud\.com/.{1,200}\.(zip|7z|rar)\b

composite_rules:
- id: tencent-cos-executable-url
  desc: Tencent COS URL with executable extension
  crit: notable
  conf: 0.92
  any:
  - id: cos-pe-url
  - id: cos-installer-batch-url
  - id: cos-powershell-url
