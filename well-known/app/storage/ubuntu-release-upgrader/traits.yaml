defaults:
  platforms: [unix]
  for: [python]

traits:
  - id: dist-upgrade-quirks-module
    desc: Ubuntu release-upgrader quirks module
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: DistUpgradeQuirks.py

  - id: canonical-dist-upgrade-source
    desc: Canonical release-upgrader source marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "Copyright (c) 2004-2010 Canonical"

  - id: font-restore-implementation
    desc: Ubuntu upgrade font-restore implementation
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'upgrade-restore-font\.(desktop|service)'

composite_rules:
  - id: ubuntu-release-upgrader-font-restore-context
    desc: Ubuntu release-upgrader one-shot font restore
    crit: exception
    conf: 0.99
    all:
      - id: dist-upgrade-quirks-module
      - id: canonical-dist-upgrade-source
      - id: font-restore-implementation
