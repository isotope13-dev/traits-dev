defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  # The main executable's version resource is too large for the bounded PE
  # parser in some embedded installers, so retain its stable app identity.
  - id: syncback-free-executable-name
    desc: SyncBackFree executable name
    if:
      type: basename
      exact: SyncBackFree.exe

  - id: syncback-installer-member
    desc: SyncBack installer PE member
    if:
      type: path
      regex: '(?i)(^|[\\/])SyncBack_Setup\.[^\\/]+\.exe'

  - id: syncback-company
    desc: 2BrightSparks publisher metadata variants
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^\s*2BrightSparks Pte\.? Ltd\.?\s*$'

  - id: syncback-product
    desc: SyncBackFree product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^\s*SyncBackFree\s*$'

  - id: syncback-installer-description
    desc: SyncBackFree installer description
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^\s*SyncBackFree V12\.0\.0\.0 Installer\s*$'

  - id: syncback-pro-executable-name
    desc: SyncBackPro executable name
    if:
      type: basename
      exact: SyncBackPro.exe

  - id: syncback-pro-product-text
    desc: SyncBackPro product string
    if:
      type: text
      substr: SyncBackPro
      section: .rsrc

  - id: syncback-pro-code-text
    desc: SyncBackPro product string in native code data
    if:
      type: text
      substr: SyncBackPro
      section: .text

  - id: syncback-vendor-text
    desc: 2BrightSparks vendor string
    if:
      type: text
      substr: 2BrightSparks
      section: .rsrc

  - id: syncback-vendor-code-text
    desc: 2BrightSparks vendor string in native code data
    if:
      type: text
      substr: 2BrightSparks
      section: .text

  - id: syncback-shell-ext-name
    desc: SyncBack shell extension module name
    if:
      type: text
      word: SBShellExt
      section: .rsrc

composite_rules:
  - id: syncback-backup-benign-context
    desc: SyncBack backup product vendor context
    crit: exception
    all:
      - id: well-known/app/storage/syncback::syncback-vendor-text
      - id: well-known/app/storage/syncback::syncback-pro-product-text
  - id: syncback-shell-ext-benign-context
    desc: SyncBack shell extension vendor context
    crit: exception
    all:
      - id: well-known/app/storage/syncback::syncback-vendor-code-text
      - id: well-known/app/storage/syncback::syncback-shell-ext-name
  - id: syncback-suite-benign-context
    desc: SyncBack suite vendor context
    crit: exception
    all:
      - id: well-known/app/storage/syncback::syncback-company
      - id: well-known/app/storage/syncback::syncback-vendor-text
  # Any recognized SyncBack vendor context suppresses host detections that
  # would otherwise fire on the suite's own backup, installer, and shell
  # components. Referencing this umbrella keeps host rules under the
  # suppression budget instead of listing each context separately.
  - id: syncback-benign-context
    desc: Any recognized SyncBack vendor context
    crit: exception
    any:
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-suite-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
