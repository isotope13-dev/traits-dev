defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  # The main executable's version resource is too large for the bounded PE
  # parser in some embedded installers, so retain its stable app identity.
  - id: syncback-free-executable-name
    desc: SyncBackFree executable name
    if:
      type: basename
      exact: SyncBackFree.exe

  - id: syncback-installer-member
    desc: SyncBack installer PE member
    if:
      type: path
      regex: '(?i)(^|[\\/])SyncBack_Setup\.[^\\/]+\.exe'

  - id: syncback-company
    desc: 2BrightSparks publisher metadata variants
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^\s*2BrightSparks Pte\.? Ltd\.?\s*$'

  - id: syncback-product
    desc: SyncBackFree product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^\s*SyncBackFree\s*$'

  - id: syncback-installer-description
    desc: SyncBackFree installer description
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^\s*SyncBackFree V12\.0\.0\.0 Installer\s*$'
