defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  size_max: 80000000
traits:
  - id: restic-binary-name
    desc: Restic backup binary name
    crit: baseline
    conf: 0.98
    if:
      type: basename
      regex: '^(restic|restic-restic-v.*-restic_.*)$'
  - id: restic-go-module-path
    desc: Restic Go module path
    crit: notable
    conf: 0.98
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/restic/restic
composite_rules:
  - id: restic-backup-binary
    desc: Restic backup tool binary
    crit: notable
    conf: 0.98
    all:
      - id: restic-binary-name
      - id: restic-go-module-path
