defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: yandex-disk-api-url
  desc: Yandex Disk API endpoint URL
  for:
  - java
  - kotlin
  - csharp
  - python
  - powershell
  if:
    type: literal
    kind: string
    regex: https?://(cloud-api\.yandex\.net|disk\.yandex\.[a-z.]+)/
