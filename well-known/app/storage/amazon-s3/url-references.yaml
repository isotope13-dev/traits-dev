defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: aws-s3-url
  desc: References an Amazon S3 HTTP URL
  if:
    type: text
    regex: (?i)https?://([a-z0-9-]+\.)?s3([.-][a-z0-9-]+)?\.amazonaws\.com/
- id: s3-bucket-uri
  desc: References an S3 bucket URI
  if:
    type: text
    regex: (?i)\bs3://[a-z0-9][a-z0-9.-]{1,62}(/|$)
