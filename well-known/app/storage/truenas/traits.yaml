# TrueNAS / FreeNAS — open-source storage operating system and middleware
# (middlewared daemon). Storage management, pool operations, and disk wipe APIs
# are core product capabilities, not wiper malware.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: archive-name
    desc: TrueNAS archive basename
    for: [zip, tar]
    if:
      type: basename
      regex: '(?i)^github\.com-(freenas|truenas)-.*\.zip$'

  - id: middlewared-import
    desc: Imports TrueNAS middlewared package
    for: [python]
    if:
      type: text
      regex: '(?m)^(from|import)[ \t]+middlewared\b'

  - id: middlewared-package-name
    desc: TrueNAS middlewared package metadata
    for: [text]
    if:
      type: text
      substr: 'name = "middlewared"'

  - id: truenas-middleware-title
    desc: TrueNAS Middleware title reference
    for: [text, markdown, python]
    if:
      type: text
      substr: 'TrueNAS Middleware'

  - id: truenas-repository-url
    desc: TrueNAS/FreeNAS repository URL
    for: [text, markdown, python]
    if:
      type: text
      regex: 'github\.com/(freenas|truenas)/'

composite_rules:
  - id: truenas-storage-context
    desc: Recognized TrueNAS storage middleware context
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, tar, python, text, markdown, shell]
    any:
      - id: archive-name
      - id: middlewared-import
      - id: middlewared-package-name
      - id: truenas-middleware-title
      - id: truenas-repository-url
