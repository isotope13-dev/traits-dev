# Lurus Code — the @scramble-cloud/lurus-code-cli coding-agent package.
# The published CLI is intentionally javascript-obfuscator output; package
# metadata and its own bin entry identify the application without treating
# ordinary agent shell/authentication capabilities as hostile behavior.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.95
  size_min: 200
  size_max: 5000000

traits:
  - id: lurus-code-package-name
    desc: '@scramble-cloud/lurus-code-cli package identity'
    conf: 0.98
    if:
      type: value
      path: name
      exact: '@scramble-cloud/lurus-code-cli'

  - id: lurus-code-bin-entry
    desc: lurus Code CLI bin entry
    crit: component
    conf: 0.95
    if:
      type: value
      path: bin.lurus
      exists: true

  - id: lurus-code-package-description
    desc: Lurus Code agentic coding CLI description
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)agentic\s+coding\s+cli'

composite_rules:
  - id: lurus-code-identity
    desc: '@scramble-cloud/lurus-code-cli coding assistant package'
    crit: notable
    conf: 0.98
    all:
      - id: lurus-code-package-name
      - id: lurus-code-bin-entry
    any:
      - id: lurus-code-package-description
