# Apify SDK — official Python client for the Apify platform.
defaults:
  platforms: [unix, windows]
  for: [python, text, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: apify-wheel-name
    desc: Apify SDK Python wheel archive name
    if:
      type: path
      regex: '(?i)^apify-.*\.whl$'

  - id: apify-package-name
    desc: apify distribution name
    for: [text, python]
    if:
      type: text
      regex: '(?m)^Name:\s*apify\s*$'

  - id: apify-support-email
    desc: Apify support email domain marker
    for: [text, python]
    if:
      type: text
      substr: support@apify.com

  - id: apify-client-import
    desc: Apify Python client import marker
    crit: notable
    for: [python]
    if:
      type: text
      substr: from apify_client import

composite_rules:
  - id: apify-python-sdk
    desc: Apify official Python SDK package
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: apify-client-import
    any:
      - id: apify-wheel-name
      - id: apify-package-name
      - id: apify-support-email
