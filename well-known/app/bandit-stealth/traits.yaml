# bandit-stealth — Burtson Labs local AI coding agent VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: bandit-stealth-vsix-name
    desc: Bandit Stealth VSIX archive name
    if:
      type: path
      regex: '(?i)BurtsonLabs\.bandit-stealth'

  - id: bandit-stealth-package-name
    desc: Bandit Stealth extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"bandit-stealth"'

  - id: bandit-stealth-publisher
    desc: BurtsonLabs VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"BurtsonLabs"'

  - id: bandit-stealth-command-namespace
    desc: Bandit Stealth command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: banditStealth.

composite_rules:
  - id: bandit-stealth-vscode-extension
    desc: Burtson Labs Bandit Stealth AI agent extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: bandit-stealth-publisher
    any:
      - id: bandit-stealth-vsix-name
      - id: bandit-stealth-package-name
      - id: bandit-stealth-command-namespace
