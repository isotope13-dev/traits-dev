# SharkTranslate — Trip.com Shark i18n helper VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: shark-translate-vsix-name
    desc: SharkTranslate VSIX archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)shark-translate.*\.vsix$'

  - id: shark-translate-package-name
    desc: SharkTranslate extension package name
    crit: notable
    for: [archives, javascript, json, package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"shark-translate"'

  - id: shark-translate-publisher
    desc: zs-liu VS Code publisher marker
    crit: notable
    for: [archives, javascript, json, package.json, vsix-manifest]
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"zs-liu"'

  - id: shark-translate-command-namespace
    desc: SharkTranslate command namespace marker
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: sharkTranslate.oneSharkReplace

  - id: shark-translate-openai-config
    desc: SharkTranslate OpenAI translation API setting
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: sharkTranslate.realtimeTranslateApiUrl

composite_rules:
  - id: shark-translate-vscode-extension
    desc: SharkTranslate Trip Shark i18n VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: shark-translate-publisher
      - id: shark-translate-command-namespace
    any:
      - id: shark-translate-vsix-name
      - id: shark-translate-package-name
