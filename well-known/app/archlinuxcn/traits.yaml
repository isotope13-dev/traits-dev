defaults:
  platforms: [unix, windows]
  for: [archives, shell]
  crit: notable
  conf: 0.99

traits:
  - id: repository-archive-path
    desc: Arch Linux CN package repository archive
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)archlinuxcn[\\/]repo@v[0-9]'

  - id: nm-tray-package-recipe
    desc: nm-tray Arch package recipe
    crit: notable
    for: [shell]
    if:
      type: path
      regex: '(?i)(^|[\\/])nm-tray-git[\\/]PKGBUILD$'

composite_rules:
  - id: repository-archive-context
    desc: Arch Linux CN package source context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: repository-archive-path
      - id: nm-tray-package-recipe
