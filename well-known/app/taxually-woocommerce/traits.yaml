# Taxually For WooCommerce is the vendor's official tax-compliance integration.
# It provisions read-only WooCommerce REST keys and returns them over an
# authenticated admin REST route during OAuth connection setup.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-header
    desc: Taxually For WooCommerce plugin header
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Taxually For WooCommerce\s*$'

  - id: taxsure-api-namespace
    desc: Taxually Taxsure API integration namespace
    if:
      type: text
      substr: Taxually_For_WooCommerce_Taxsure_API

  - id: oauth-pkce-connect-flow
    desc: Taxually OAuth PKCE connect flow marker
    if:
      type: text
      substr: taxually_connect_error

composite_rules:
  - id: taxually-woocommerce-plugin
    desc: Taxually official WooCommerce tax plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-header
      - id: taxsure-api-namespace
    any:
      - id: oauth-pkce-connect-flow
