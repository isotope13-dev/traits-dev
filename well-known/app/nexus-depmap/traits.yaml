# Nexus DepMap — bgarcias web dependency visualization VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: nexus-depmap-vsix-name
    desc: Nexus DepMap VSIX archive name
    if:
      type: path
      regex: '(?i)bgarcias\.nexus-depmap'

  - id: nexus-depmap-package-name
    desc: Nexus DepMap extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"nexus-depmap"'

  - id: nexus-depmap-publisher
    desc: bgarcias VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"bgarcias"'

  - id: nexus-open-map-command
    desc: Nexus DepMap open map command marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      substr: '"command": "nexus.openMap"'

  - id: nexus-sidebar-view-marker
    desc: Nexus DepMap sidebar view marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      substr: nexus.sidebarView

composite_rules:
  - id: nexus-depmap-vscode-extension
    desc: Nexus DepMap web dependency map VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: nexus-depmap-publisher
    any:
      - id: nexus-depmap-vsix-name
      - id: nexus-depmap-package-name
      - id: nexus-open-map-command
      - id: nexus-sidebar-view-marker
