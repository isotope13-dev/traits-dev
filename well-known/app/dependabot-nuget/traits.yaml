# dependabot-nuget — GitHub Dependabot NuGet ecosystem updater gem.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, archives, markdown, text]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: dependabot-nuget-gem-name
    desc: dependabot-nuget Ruby gem archive name
    crit: notable
    if:
      type: path
      regex: '(?i)dependabot-nuget-.*\.gem$'

  - id: dependabot-nuget-gemspec-name
    desc: dependabot-nuget gem specification name
    for: [gem]
    if:
      type: text
      regex: '(?i)^name:\s*dependabot-nuget\s*$'

  - id: dependabot-nuget-module-marker
    desc: Dependabot NuGet updater module marker
    for: [ruby]
    crit: notable
    if:
      type: text
      substr: dependabot/nuget

composite_rules:
  - id: dependabot-nuget-ruby-gem
    desc: GitHub Dependabot NuGet updater gem
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: dependabot-nuget-gem-name
      - id: dependabot-nuget-gemspec-name
      - id: dependabot-nuget-module-marker
