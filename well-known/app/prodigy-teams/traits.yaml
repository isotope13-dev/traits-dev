# prodigy-teams — Explosion AI Prodigy Teams CLI (ptc).
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: prodigy-teams-wheel-name
    desc: prodigy_teams Python wheel archive name
    if:
      type: path
      regex: '(?i)prodigy_teams-.*\.whl$'

  - id: prodigy-teams-package-name
    desc: prodigy-teams Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*prodigy-teams\s*$'

  - id: prodigy-teams-module-marker
    desc: prodigy_teams plugin module marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: prodigy_teams

composite_rules:
  - id: prodigy-teams-python-package
    desc: Explosion Prodigy Teams CLI wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: prodigy-teams-wheel-name
      - id: prodigy-teams-package-name
      - id: prodigy-teams-module-marker
