# presently — Samuel Williams Ruby browser presentation gem.
defaults:
  platforms: [unix, windows]
  for: [ruby, javascript, json, markdown, text, archives]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: presently-gem-name
    desc: presently Ruby gem archive name
    if:
      type: path
      regex: '(?i)presently-.*\.gem$'

  - id: presently-gemspec-name
    desc: presently gem specification name
    for: [gem]
    if:
      type: text
      regex: '(?i)^name:\s*presently\s*$'

  - id: presently-module-marker
    desc: Presently Ruby module marker
    for: [ruby]
    crit: notable
    if:
      type: text
      substr: Presently::Presentation

composite_rules:
  - id: presently-ruby-gem
    desc: presently Ruby browser presentation gem
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: presently-gemspec-name
    any:
      - id: presently-gem-name
      - id: presently-module-marker
