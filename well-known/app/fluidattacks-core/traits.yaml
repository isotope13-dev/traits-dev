# fluidattacks-core — Fluid Attacks security platform Python core library.
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, json, archives]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: fluidattacks-core-wheel-name
    desc: fluidattacks-core Python wheel name
    if:
      type: path
      regex: '(?i)fluidattacks_core-.*\.whl'

  - id: fluidattacks-core-package-name
    desc: fluidattacks-core Python distribution name
    if:
      type: text
      regex: '(?i)^Name:\s*fluidattacks-core\s*$'

  - id: fluidattacks-core-module-marker
    desc: fluidattacks_core Python package marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: fluidattacks_core

  - id: fluidattacks-rustport-module
    desc: fluidattacks_core rustport native module
    for: [python]
    crit: notable
    if:
      type: text
      substr: fluidattacks_core.rustport

composite_rules:
  - id: fluidattacks-core-python-package
    desc: Fluid Attacks security scanner core library
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: fluidattacks-core-wheel-name
      - id: fluidattacks-core-package-name
      - id: fluidattacks-core-module-marker
      - id: fluidattacks-rustport-module
