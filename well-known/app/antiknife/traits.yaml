# AntiKnife — ace-express Antigravity IDE multi-account rotation helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest, macho, pe]
  crit: baseline
  conf: 0.97
  size_min: 1
  size_max: 524288000

traits:
  - id: antiknife-vsix-name
    desc: AntiKnife VSIX archive name
    if:
      type: path
      regex: '(?i)ace-express\.antiknife'

  - id: antiknife-package-name
    desc: AntiKnife extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"antiknife"'

  - id: antiknife-publisher
    desc: ace-express VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"ace-express"'

  - id: antigravity-auth-bridge-marker
    desc: Antigravity IDE OAuth bridge marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)antigravityAuth|antigravityUnifiedStateSync'

  - id: antiknife-daemon-binary-basename
    desc: AntiKnife Go daemon binary basename
    for: [macho, pe]
    crit: notable
    if:
      type: basename
      regex: '^antiknife(-darwin|-linux|-windows)?'

composite_rules:
  - id: antiknife-vscode-extension
    desc: AntiKnife Antigravity account rotation VS Code extension
    crit: notable
    conf: 0.97
    scope: archive
    for: [archives]
    all:
      - id: antiknife-publisher
    any:
      - id: antiknife-vsix-name
      - id: antiknife-package-name
      - id: antigravity-auth-bridge-marker
      - id: antiknife-daemon-binary-basename
