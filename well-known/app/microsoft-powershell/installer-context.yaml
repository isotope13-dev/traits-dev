defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-release-installer
    desc: PowerShell release installer source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)function\s+(Get-Installer|Invoke-Installer)|releases/download'

composite_rules:
  - id: powershell-download-archive-known-installer-context
    desc: Known installer archive context
    crit: notable
    conf: 0.99
    any:
      - id: well-known/app/calvyn-code
      - id: well-known/app/aui-agent-builder/
      - id: well-known/app/azure-dev-cli/
      - id: well-known/app/microsoft-intune::intune-remediation-script
      - id: metadata/package/testing/scripted::endtoend-smoke-download-recipe
      - id: well-known/app/recognized-contexts/source::cargo-binstall-release-installer-context
      - id: well-known/app/microsoft-powershell::powershell-release-installer
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-bootstrap-context
