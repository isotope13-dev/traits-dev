# ProbeJS is a static JavaScript vulnerability-analysis framework. Its bundled
# parser installer, analysis stubs, and optional LLM providers are product
# functionality; this identity makes that context explicit during triage.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, javascript, text]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: ProbeJS Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: probejs
  - id: package-name
    desc: ProbeJS distribution metadata name
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^Name:\s*probejs\s*$'
  - id: source-package-path
    desc: ProbeJS source package path
    for: [python, javascript]
    if:
      type: path
      regex: '(^|[\\/])probejs([\\/]|$)'
  - id: analysis-framework-summary
    desc: ProbeJS vulnerability-analysis summary
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?i)static analysis framework for JavaScript vulnerability detection'

composite_rules:
  - id: probejs-tool
    desc: Recognized ProbeJS JavaScript vulnerability-analysis framework
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-name
      - id: analysis-framework-summary
