# V.I.S.O.R. HUD — Visual Intelligence System for Orchestrated Reasoning VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: visor-hud-vsix-name
    desc: V.I.S.O.R. HUD VSIX archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)visor-hud.*\.vsix$'

  - id: visor-hud-package-name
    desc: V.I.S.O.R. HUD extension package name
    crit: notable
    for: [archives, javascript, json, package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"visor-hud"'

  - id: visor-hud-publisher
    desc: dibun75 VS Code publisher marker
    crit: notable
    for: [archives, javascript, json, package.json, vsix-manifest]
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"dibun75"'

  - id: visor-hud-command-namespace
    desc: V.I.S.O.R. command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: visor.startHUD

composite_rules:
  - id: visor-hud-vscode-extension
    desc: V.I.S.O.R. HUD developer telemetry VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: visor-hud-publisher
      - id: visor-hud-command-namespace
    any:
      - id: visor-hud-vsix-name
      - id: visor-hud-package-name
