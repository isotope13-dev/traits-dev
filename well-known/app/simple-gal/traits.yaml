# simple-gal — minimal static site generator for photography portfolios.
defaults:
  platforms: [unix, windows]
  for: [rust, crate, cargo.toml, markdown, text]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: simple-gal-crate-name
    desc: simple-gal Rust crate archive name
    for: [archives, crate]
    crit: notable
    if:
      type: path
      regex: '(?i)simple-gal-.*\.crate$'

  - id: simple-gal-cargo-name
    desc: simple-gal Cargo package name
    for: [cargo.toml, crate]
    if:
      type: text
      regex: '(?i)^name\s*=\s*"simple-gal"'

  - id: simple-gal-ssg-marker
    desc: Simple Gal photography SSG documentation marker
    for: [rust, markdown]
    crit: notable
    if:
      type: text
      substr: fine art photography portfolios

composite_rules:
  - id: simple-gal-rust-crate
    desc: simple-gal photography portfolio SSG crate
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: simple-gal-crate-name
      - id: simple-gal-cargo-name
      - id: simple-gal-ssg-marker
