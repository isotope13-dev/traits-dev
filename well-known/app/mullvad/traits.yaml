defaults:
  platforms: [linux]
  for: [deb, shell, elf, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: linux-package-path
    desc: Mullvad VPN Linux package path
    for: [deb]
    if:
      type: path
      substr: MullvadVPN-
      case_insensitive: true

  - id: service-lifecycle-marker
    desc: Mullvad VPN systemd service marker
    for: [shell]
    if:
      type: text
      regex: '(?i)\bmullvad-(daemon|early-boot-blocking)\.service\b'
