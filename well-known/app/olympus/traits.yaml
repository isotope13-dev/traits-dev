# @flame0510/olympus is the OpenClaw multi-agent monitoring dashboard.
# Keep this identity signature tied to package metadata.  Generic strings such
# as "olympus serve" also occur in documentation and unrelated applications.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: Olympus npm package metadata name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@flame0510/olympus'

  - id: package-repository
    desc: Olympus package repository identity
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: git+https://github.com/Flame0510/olympus.git

  - id: package-homepage
    desc: Olympus package homepage identity
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://github.com/Flame0510/olympus#readme

  - id: archive-package-name
    desc: Olympus npm archive package name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@flame0510/olympus'

  - id: archive-package-repository
    desc: Olympus npm archive repository identity
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: git+https://github.com/Flame0510/olympus.git

  - id: archive-package-homepage
    desc: Olympus npm archive homepage identity
    for: [npm, tar]
    if:
      type: value
      path: npm.homepage
      exact: https://github.com/Flame0510/olympus#readme

composite_rules:
  - id: npm-package-identity
    desc: Olympus npm package identity
    crit: notable
    for: [package.json]
    all:
      - id: package-name
      - id: package-repository
      - id: package-homepage

  - id: npm-archive-identity
    desc: Olympus npm archive identity
    crit: notable
    conf: 0.99
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-package-repository
      - id: archive-package-homepage
