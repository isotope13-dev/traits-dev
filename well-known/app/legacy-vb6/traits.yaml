defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.96

traits:
  - id: jsware-msi-unpacker-company
    desc: JSWare company metadata
    if:
      type: value
      path: pe.version.company
      exact: JSWare

  - id: jsware-msi-unpacker-name
    desc: JSWare MSI Unpacker application marker
    if:
      type: text
      exact: MSI Unpacker
      section: .rsrc

  - id: netiq-adpopulator-company
    desc: NetIQ Corporation company metadata
    if:
      type: value
      path: pe.version.company
      exact: NetIQ Corporation

  - id: netiq-adpopulator-name
    desc: NetIQ ADPopulator application marker
    if:
      type: text
      exact: ADPopulator
      section: .rsrc

  - id: netiq-dra-exa-guide
    desc: NetIQ DRA-ExA evaluation utility marker
    if:
      type: text
      exact: NetIQ DRA-ExA Evaluation Guide
      section: .rsrc

composite_rules:
  - id: jsware-msi-unpacker
    desc: JSWare MSI Unpacker utility
    crit: notable
    conf: 0.99
    all:
      - id: jsware-msi-unpacker-company
      - id: jsware-msi-unpacker-name

  - id: netiq-adpopulator
    desc: NetIQ DRA-ExA ADPopulator utility
    crit: notable
    conf: 0.99
    all:
      - id: netiq-adpopulator-company
      - id: netiq-adpopulator-name
      - id: netiq-dra-exa-guide
