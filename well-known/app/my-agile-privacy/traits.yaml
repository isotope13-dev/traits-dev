defaults:
  platforms: [unix, windows]
  for: [php, zip]
  crit: baseline
  conf: 0.99

traits:
  - id: plugin-header
    desc: My Agile Privacy WordPress plugin header
    crit: notable
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*My Agile Privacy(®)?\s*$'

  - id: plugin-directory
    desc: My Agile Privacy plugin directory
    crit: notable
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])myagileprivacy([\\/]|$)'

composite_rules:
  - id: wordpress-plugin
    desc: My Agile Privacy WordPress plugin
    crit: notable
    conf: 0.99
    any:
      - id: plugin-header
      - id: plugin-directory
