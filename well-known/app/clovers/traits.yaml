# clovers — KarisAya async chat bot plugin framework (Python wheel).
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: clovers-wheel-name
    desc: clovers Python wheel archive name
    if:
      type: path
      regex: '(?i)clovers-.*\.whl$'

  - id: clovers-package-name
    desc: clovers Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*clovers\s*$'

  - id: clovers-adapter-core-marker
    desc: Clovers AdapterCore plugin framework marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: "[Clovers][AdapterCore]"

composite_rules:
  - id: clovers-python-package
    desc: clovers async chat bot plugin framework
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: clovers-wheel-name
      - id: clovers-package-name
      - id: clovers-adapter-core-marker
