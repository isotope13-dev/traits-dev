# TollGate's OpenWrt module includes a documented private relay and Cashu wallet.
# Its official release binary and source package therefore legitimately contain
# network, crypto, and service-installation behavior.
defaults:
  platforms: [linux]
  for: [elf, go]

traits:
  - id: module-identity
    desc: OpenTollGate basic module identity
    crit: notable
    conf: 1.0
    size_min: 1000000
    size_max: 20000000
    if:
      type: text
      substr: github.com/OpenTollGate/tollgate-module-basic-go
  - id: private-relay-symbol
    desc: TollGate private relay startup symbol
    crit: notable
    conf: 1.0
    size_min: 1000000
    size_max: 20000000
    if:
      type: text
      substr: main.startPrivateRelayWithAutoRestart

  - id: source-tree
    desc: OpenTollGate basic module source-tree path
    crit: notable
    conf: 1.0
    for: [source, shell, python, javascript, typescript, go, c, cpp, rust, markdown, json]
    if:
      type: path
      regex: 'github\.com[\\/]OpenTollGate[\\/]tollgate-module-basic-go@v'

  - id: source-archive
    desc: OpenTollGate basic module source archive
    crit: notable
    conf: 1.0
    for: [zip]
    if:
      type: basename
      regex: 'tollgate-module-basic-go-v'

composite_rules:
  - id: official-private-relay-binary
    desc: Official TollGate binary with its private relay
    crit: exception
    conf: 1.0
    all:
      - id: module-identity
      - id: private-relay-symbol

  - id: official-source-context
    desc: Official OpenTollGate basic module source context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: source-archive
      - id: source-tree
