# TollGate's OpenWrt module includes a documented private relay and Cashu wallet.
# Its official release binary therefore legitimately embeds an onion endpoint.
defaults:
  platforms: [linux]
  for: [elf, go]

traits:
  - id: module-identity
    desc: OpenTollGate basic module identity
    crit: notable
    conf: 1.0
    size_min: 1000000
    size_max: 20000000
    if:
      type: text
      substr: github.com/OpenTollGate/tollgate-module-basic-go
  - id: private-relay-symbol
    desc: TollGate private relay startup symbol
    crit: notable
    conf: 1.0
    size_min: 1000000
    size_max: 20000000
    if:
      type: text
      substr: main.startPrivateRelayWithAutoRestart

composite_rules:
  - id: official-private-relay-binary
    desc: Official TollGate binary with its private relay
    crit: exception
    conf: 1.0
    all:
      - id: module-identity
      - id: private-relay-symbol
