# interpolars — Polars N-dimensional interpolation plugin.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: interpolars-wheel-name
    desc: interpolars Python wheel archive name
    if:
      type: path
      regex: '(?i)interpolars-.*\.whl$'

  - id: interpolars-package-name
    desc: interpolars Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*interpolars\s*$'

  - id: interpolars-plugin-marker
    desc: interpolars Polars interpolation API marker
    for: [python, markdown]
    crit: notable
    if:
      type: text
      substr: interpolate_nd

composite_rules:
  - id: interpolars-python-package
    desc: Polars interpolation plugin wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: interpolars-wheel-name
      - id: interpolars-package-name
      - id: interpolars-plugin-marker
