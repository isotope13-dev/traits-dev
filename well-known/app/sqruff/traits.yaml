defaults:
  platforms: [unix, windows]
  for: [archive, package.json, json]
  crit: baseline
  conf: 0.99

traits:
  - id: vsix-id
    desc: sqruff VS Code extension identifier
    crit: notable
    for: [archive]
    if:
      type: value
      path: vsix.identity.id
      exact: sqruff

  - id: vsix-publisher
    desc: Quary VS Code extension publisher
    crit: notable
    for: [archive]
    if:
      type: value
      path: vsix.identity.publisher
      exact: Quary

  - id: package-name
    desc: sqruff package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: sqruff

  - id: upstream-repository
    desc: sqruff upstream repository
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/quarylabs/sqruff(\.git)?$'

composite_rules:
  - id: official-vsix-identity
    desc: Quary sqruff VS Code extension identity
    crit: notable
    conf: 0.99
    for: [archive]
    all:
      - id: vsix-id
      - id: vsix-publisher

  - id: official-package-identity
    desc: sqruff package with its upstream repository
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: package-name
      - id: upstream-repository
