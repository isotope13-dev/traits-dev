defaults:
  platforms: [linux]
  for: [elf]
  size_min: 1000000
  size_max: 100000000

traits:
  - id: xen-hypervisor-context
    desc: Xen hypervisor version marker in read-only data
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rodata
      regex: '\bXen\s+[0-9]+\.[0-9]+(\.[0-9]+)?\b'
