# @wengine-ai/claude-code-router-cli — community Claude Code request router.
# Routes Claude Code traffic through a local proxy (ccr) by rewriting
# ~/.claude/settings.json to point ANTHROPIC_BASE_URL at loopback. Identity is
# the scoped package name and the ccr bin entry, not the settings rewrite.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.95
  size_min: 200
  size_max: 5000000

traits:
  - id: ccr-cli-package-name
    desc: '@wengine-ai/claude-code-router-cli package name'
    conf: 0.98
    if:
      type: value
      path: name
      exact: '@wengine-ai/claude-code-router-cli'

  - id: ccr-bin-entry
    desc: ccr CLI bin entry
    crit: component
    conf: 0.95
    if:
      type: value
      path: bin.ccr
      exists: true

  - id: ccr-statusline-command
    desc: ccr statusline Claude settings command
    for: [javascript, typescript]
    conf: 0.95
    size_min: 200
    size_max: 200000
    if:
      type: text
      substr: 'ccr statusline'

  # The `.claude-code-router` directory name is shared with the upstream
  # musistudio project and is equally present in anything that merely reads
  # the router's config, so on its own it does not identify this package —
  # the vendor-scoped name below does.
  - id: claude-code-router-config-dir
    desc: Claude Code Router config directory path
    for: [javascript, typescript]
    crit: component
    conf: 0.9
    size_min: 200
    if:
      type: text
      substr: '.claude-code-router'

  # The sources import the workspace siblings (`-shared`, `-server`) and the
  # bundle inlines them, keeping only the umbrella name in its self-update
  # `npm view`/`npm update -g` commands — hence no trailing `-` here.
  - id: ccr-scoped-package-reference
    desc: Reference to @wengine-ai claude-code-router
    for: [javascript, typescript]
    conf: 0.98
    if:
      type: text
      substr: '@wengine-ai/claude-code-router'

composite_rules:
  - id: claude-code-router-cli-identity
    desc: '@wengine-ai/claude-code-router-cli package'
    conf: 0.97
    all:
      - id: ccr-cli-package-name
      - id: ccr-bin-entry

  # Source and bundled-CLI counterpart of the package identity above: the
  # vendor-scoped module name plus one of the router's own runtime surfaces.
  # The 200KB cap on `ccr statusline` keeps it off the 3MB bundle, which the
  # config directory covers instead.
  - id: claude-code-router-cli-module
    desc: Claude Code Router CLI module
    for: [javascript, typescript]
    conf: 0.97
    all:
      - id: ccr-scoped-package-reference
    any:
      - id: ccr-statusline-command
      - id: claude-code-router-config-dir
    needs: 1
