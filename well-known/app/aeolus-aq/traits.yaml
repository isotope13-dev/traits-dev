# aeolus_aq — air quality data download and standardization library.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: aeolus-aq-wheel-name
    desc: aeolus_aq Python wheel archive name
    if:
      type: path
      regex: '(?i)aeolus_aq-.*\.whl$'

  - id: aeolus-aq-package-name
    desc: aeolus_aq Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*aeolus_aq\s*$'

  - id: aeolus-aq-module-marker
    desc: aeolus air quality package module marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: aeolus.networks

composite_rules:
  - id: aeolus-aq-python-package
    desc: aeolus air quality data Python library
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: aeolus-aq-wheel-name
      - id: aeolus-aq-package-name
      - id: aeolus-aq-module-marker
