# BIND 9 -- the DNS server; its own source and tooling paths.
defaults:
  crit: notable
  conf: 0.98
  platforms: [unix, windows]
traits:
- id: bind9-idn-ltconfig-path
  desc: BIND9 bundled idnkit ltconfig path
  crit: notable
  conf: 0.98
  for: [shell, vbs]
  if:
    type: path
    regex: '(^|[\\/])idnkit-1\.0-src[\\/]ltconfig$'
- id: bind9-dnssec-clean-path
  desc: BIND9 dnssec clean path
  crit: notable
  conf: 0.98
  for: [shell]
  if:
    type: path
    regex: '(^|[\\/])dnssec[\\/]clean\.sh$'
