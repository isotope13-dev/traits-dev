defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  size_min: 262144
  size_max: 52428800
  conf: 0.99

traits:
  - id: product-name
    desc: Fiddler PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: Fiddler

  - id: publisher
    desc: Progress Software PE publisher
    if:
      type: value
      path: pe.version.company
      exact: Progress Software Corporation

  - id: web-debugging-description
    desc: Fiddler web debugging description
    if:
      type: value
      path: pe.version.comments
      exact: Web Debugging Utility

  - id: classic-banner
    desc: Progress Telerik Fiddler banner
    if:
      type: text
      exact: Progress Telerik Fiddler Classic
      section: .text

composite_rules:
  - id: fiddler-classic
    desc: Progress Telerik Fiddler Classic application
    all:
      - id: product-name
      - id: publisher
      - id: metadata/signed/leaf::progress-software-corporation
    any:
      - id: web-debugging-description
      - id: classic-banner
