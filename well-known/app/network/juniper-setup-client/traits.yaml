# Juniper Setup Client is the signed Junos Pulse / Network Connect bootstrap
# component.  It downloads and replaces vendor components and uses WinINet
# authentication cookies, so those operations are expected for this identity.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 5000000

traits:
  - id: setup-client-product-name
    desc: Juniper Setup Client product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Juniper Setup Client

  - id: setup-client-company-name
    desc: Juniper Networks Setup Client company metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Juniper Networks, Inc.

  - id: setup-client-original-filename
    desc: Juniper Setup Client original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: JuniperSetupClient.exe
      case_insensitive: true

  - id: setup-client-internal-name
    desc: Juniper Setup Client internal name
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: JuniperSetupClient

composite_rules:
  - id: juniper-setup-client-identity
    desc: Signed Juniper Setup Client identity
    crit: notable
    conf: 0.99
    all:
      - id: setup-client-product-name
      - id: setup-client-company-name
      - id: setup-client-original-filename
      - id: setup-client-internal-name
      - id: metadata/signed/leaf::juniper-networks-inc.
