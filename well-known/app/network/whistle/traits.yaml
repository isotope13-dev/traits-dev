# Whistle — Node.js web debugging proxy (avwo/whistle). Host platform
# identification is used to construct the internal client runtime ID
# (x-whistle-runtime-id) for local proxy sessions.
defaults:
  crit: notable
  conf: 0.98
  platforms: [linux, windows, macos]
  for: [javascript, typescript]
traits:
  - id: runtime-id-header
    desc: Whistle proxy runtime ID header
    if:
      type: text
      substr: "x-whistle-runtime-id"
