# Bitvise SSH Client includes several purpose-specific executables. In
# particular, totermc.exe is the graphical client's xterm-compatible terminal
# console component. Feed and collection pipelines may rename these files, so
# establish identity from coherent VERSIONINFO and debug metadata rather than
# the observed basename.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 100000
  size_max: 100000000

traits:
  # These two weak atoms are also useful to malware objectives that identify a
  # binary pretending to be Bitvise. They belong with the product identity,
  # not inside a SOCKS-proxy objective.
  - id: brand-reference
    desc: References the Bitvise product name
    crit: component
    conf: 0.84
    if:
      type: text
      word: Bitvise
      section: .rdata

  - id: bitssh-filename-reference
    desc: References the Bitvise bitssh executable name
    crit: component
    conf: 0.9
    if:
      type: text
      word: bitssh
      section: .rdata

  - id: ssh-client-product-name
    desc: Bitvise SSH Client product identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Bitvise SSH Client
      case_insensitive: true

  - id: company-name
    desc: Bitvise Limited publisher identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Bitvise Limited
      case_insensitive: true

  - id: terminal-original-filename
    desc: Bitvise terminal client original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: totermc.exe
      case_insensitive: true

  - id: terminal-pdb
    desc: Bitvise terminal client PDB identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: totermc.pdb
      case_insensitive: true

composite_rules:
  - id: terminal-client-context
    desc: Recognized Bitvise SSH terminal client component
    crit: notable
    conf: 0.999
    all:
      - id: ssh-client-product-name
      - id: company-name
      - id: terminal-original-filename
      - id: terminal-pdb
