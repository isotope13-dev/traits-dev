# SONiC management test framework (Azure/sonic-mgmt). Its setup-container.sh
# builds a throwaway developer container: it recreates the invoking host
# user, grants it passwordless sudo, sets lab passwords and installs the
# caller's own SSH key. Individually these are the steps of an account
# backdoor; here they provision the container the script was run to create.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.99

traits:
  - id: docker-sonic-mgmt-image-declaration
    desc: sonic-mgmt test container image declaration
    if:
      type: text
      substr: DOCKER_SONIC_MGMT="docker-sonic-mgmt:latest"

  - id: sonicdev-registry-image-reference
    desc: SONiC dev registry docker-sonic-mgmt image
    if:
      type: text
      substr: sonicdev-microsoft.azurecr.io:443/docker-sonic-mgmt

composite_rules:
  - id: sonic-mgmt-container-setup-context
    desc: Recognized sonic-mgmt container setup script
    crit: exception
    all:
      - id: docker-sonic-mgmt-image-declaration
      - id: sonicdev-registry-image-reference
