# vsftpd ("very secure FTP daemon"), the default FTP server on many Linux
# distributions. Its source tree defines its version in vsftpver.h.
defaults:
  platforms: [unix]
  for: [c]
traits:
  - id: vsftpd-version-define
    desc: vsftpd source VSF_VERSION definition
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '#define\s+VSF_VERSION\s+"[0-9][0-9.]{2,10}"'
