# Skywire -- Skycoin's open-source decentralized mesh VPN
# (github.com/skycoin/skywire; rewards for visor uptime, macOS installer,
# Go/WASM visor web console).
#
# Its CLI rewards tooling spawns localhost-only Skycoin nodes for wallet
# ownership verification, passing config paths to those children through
# their environment and polling their HTTP health endpoints. The
# environment-plus-HTTP shape there is local process orchestration, not
# exfiltration; the objectives reference this from `unless:`.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: skywire-module-member-path
    desc: Skywire Go module member path
    for: [go, text, data, source, scripts, shell, wasm, zip]
    if:
      type: path
      regex: 'skycoin[/\\]skywire'

  - id: skywire-rewards-command-marker
    desc: Skywire rewards CLI package reference
    for: [go]
    if:
      type: text
      substr: 'clirewardsserver'

composite_rules:
  - id: skywire-distribution
    desc: Recognized Skywire mesh-network distribution
    crit: exception
    conf: 0.99
    scope: outer
    for: [go, text, data, source, scripts, shell, wasm, zip]
    any:
      - id: skywire-module-member-path
      - id: skywire-rewards-command-marker
