# Netzilo — zero-trust network access and secure-browser vendor (netzilo.com).
# Its client is a Go mesh/VPN agent: peers, routes, a SOCKS5 relay, a MITM proxy
# for policy and a management channel. Peer and route diagnostics are its
# ordinary vocabulary, so they say nothing about command-and-control here.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  crit: notable
  conf: 0.98
  size_min: 5000000
  size_max: 200000000

traits:
  - id: netzilo-client-go-module
    desc: Netzilo client Go module symbols
    if:
      type: text
      substr: github.com/netzilo/netzilo/client/
