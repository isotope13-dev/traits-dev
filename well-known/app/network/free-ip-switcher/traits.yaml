defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.99
traits:
  - id: free-ip-switcher-description
    desc: PE description names Free IP Switcher
    crit: notable
    if:
      type: value
      path: pe.version.description
      exact: Free IP Switcher
composite_rules:
  - id: eusing-free-ip-switcher-version-fields
    desc: PE version fields name Free IP Switcher and Eusing Software
    crit: notable
    all:
      - id: metadata/vendor/identity::eusing-company-version
      - id: free-ip-switcher-description
