# Voltius — local-first SSH/SFTP/Serial client (Termius alternative).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, rust, tar, archives, gz, markdown]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-repo-url
    desc: VoltiusApp/voltius GitHub repository
    if:
      type: text
      substr: github.com/VoltiusApp/voltius

  - id: product-summary
    desc: Voltius SSH client product summary
    if:
      type: text
      substr: modern alternative to Termius

composite_rules:
  - id: voltius-ssh-client
    desc: Voltius SSH/SFTP client application
    crit: notable
    any:
      - id: github-repo-url
      - id: product-summary
