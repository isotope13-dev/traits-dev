# bunny.net CDN CLI — npm platform packages ship a Bun-compiled Mach-O/PE/ELF
# binary named `bunny` (see @bunny.net/cli-darwin-arm64, etc.).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, macho, pe, elf]
  crit: baseline
  conf: 0.98

traits:
  - id: bunny-net-cli-npm-package-name
    desc: bunny.net CLI npm platform package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      regex: '^@bunny\.net/cli-'

  - id: bunny-net-cli-package-description
    desc: bunny.net CLI npm package description
    for: [package.json, npm]
    if:
      type: value
      path: description
      regex: '^bunny\.net CLI binary for '

  - id: oven-sh-bun-runtime-strings
    desc: oven-sh Bun runtime implementation strings
    for: [macho, pe, elf]
    size_min: 1000000
    if:
      type: text
      section: __TEXT,__cstring
      substr: github.com/oven-sh/bun

composite_rules:
  - id: bunny-net-cli-package
    desc: bunny.net CDN CLI npm platform package
    crit: notable
    conf: 0.99
    for: [package.json, npm]
    any:
      - id: bunny-net-cli-npm-package-name
      - id: bunny-net-cli-package-description

  - id: bunny-net-cli-bun-binary
    desc: bunny.net Bun-compiled CLI binary
    crit: notable
    conf: 0.99
    for: [macho, pe, elf]
    size_min: 1000000
    all:
      - id: oven-sh-bun-runtime-strings
      - id: well-known/lib/runtime/bun-runtime::bun-standalone-graph-trailer
