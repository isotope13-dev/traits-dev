# bunny.net CDN CLI — npm platform packages ship a Bun-compiled Mach-O/PE/ELF
# binary named `bunny` (see @bunny.net/cli-darwin-arm64, etc.).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, macho, pe, elf]
  crit: baseline
  conf: 0.98

traits:
  - id: bunny-net-cli-npm-package-name
    desc: bunny.net CLI npm platform package name
    crit: notable
    for: [package.json, npm]
    if:
      type: value
      path: name
      regex: '^@bunny\.net/cli-'

  - id: bunny-net-cli-package-description
    desc: bunny.net CLI npm package description
    crit: notable
    for: [package.json, npm]
    if:
      type: value
      path: description
      regex: '^bunny\.net CLI binary for '
