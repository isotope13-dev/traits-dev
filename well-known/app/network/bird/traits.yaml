# BIRD Internet Routing Daemon (BGP, OSPF, RIP, BFD)
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_max: 104857600

traits:
  - id: bird-routing-version-banner
    desc: BIRD routing daemon version banner
    if:
      type: text
      section: .rodata
      regex: '\bBIRD version [0-9]+\.[0-9]+(\.[0-9]+)?\b'

  - id: bird-daemon-basename
    desc: BIRD routing daemon basename
    if:
      type: basename
      exact: bird

  - id: bird-control-client-basename
    desc: BIRD control client basename
    if:
      type: basename
      regex: '^(birdc|birdcl)$'

  - id: bird-control-socket-path
    desc: BIRD control socket path reference
    if:
      type: text
      section: .rodata
      substr: /var/run/bird.ctl

  - id: bird-config-path
    desc: BIRD config path reference
    if:
      type: text
      section: .rodata
      substr: /etc/bird.conf

composite_rules:
  - id: bird-routing-daemon
    desc: BIRD internet routing daemon
    crit: notable
    conf: 0.99
    all:
      - id: bird-daemon-basename
      - id: bird-routing-version-banner
    any:
      - id: bird-config-path
      - id: bird-control-socket-path

  - id: bird-control-client
    desc: BIRD routing control client
    crit: notable
    conf: 0.99
    all:
      - id: bird-control-client-basename
      - id: bird-control-socket-path
