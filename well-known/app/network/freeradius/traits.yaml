defaults:
  platforms: [unix]

traits:
  - id: freeradius-source-tree
    desc: FreeRADIUS upstream source-tree path
    crit: notable
    conf: 1.0
    for: [c, cpp, shell, python]
    if:
      type: path
      regex: '(?i)freeradius-server@v[0-9][^\\/]{0,64}'

  - id: freeradius-pam-module-marker
    desc: FreeRADIUS PAM module source marker
    crit: notable
    conf: 1.0
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)rlm_pam|freeradius-devel/server/(base|module_rlm)\.h'

  - id: freeradius-build-plugin-marker
    desc: FreeRADIUS GNU make plugin marker
    crit: notable
    conf: 1.0
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)GNU make plugin to run dlopen|Network RADIUS SARL'

  # The acutest marker/context that lived here matched only the FILENAME
  # acutest.h inside the FreeRADIUS tree. Acutest is vendored by many projects,
  # so it is recognised once by its own contents at
  # well-known/lib/development/acutest::source-context instead.

composite_rules:
  - id: freeradius-pam-module-context
    desc: Recognized FreeRADIUS PAM module context
    crit: exception
    conf: 1.0
    all:
      - id: freeradius-source-tree
      - id: freeradius-pam-module-marker

  - id: freeradius-build-plugin-context
    desc: Recognized FreeRADIUS build plugin context
    crit: exception
    conf: 1.0
    all:
      - id: freeradius-source-tree
      - id: freeradius-build-plugin-marker
