defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, shell, python, systemd_service]
  crit: baseline
  conf: 0.96
  size_max: 1073741824

traits:
  - id: package-context
    crit: notable
    desc: OpenSSH package or server artifact context
    if:
      type: text
      regex: 'openssh-server|/usr/share/openssh/sshd_config|OpenBSD "secure shell"'

  # The upstream source tarball, unpacked as `openssh-9.6p1/` or GitHub archive
  # `openssh-portable-V_10_2_P1/`. OpenSSH is the reference implementation of the
  # things the credential-access rules look for: `auth-pam.c` copies PAM prompt
  # responses because that is what a PAM conversation function does, `logintest.c`
  # exercises utmp/wtmp accounting, and the contrib specs and buildpkg scripts
  # install the service.
  - id: source-tree-path
    desc: OpenSSH source tree path
    crit: notable
    conf: 0.97
    for: [c, cpp, shell, source]
    if:
      type: path
      regex: 'openssh(-portable)?-[0-9Vv][0-9A-Za-z_.-]{0,24}/'
  - id: portable-dev-list-address
    desc: OpenSSH portable development list address
    crit: notable
    conf: 0.98
    for: [c, cpp, shell, source]
    if:
      type: text
      substr: openssh-unix-dev@mindrot.org
  - id: solaris-package-init-variable
    desc: OpenSSH Solaris package init variable
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: text
      substr: OPENSSHD=opensshd.init

  - id: server-artifact
    desc: OpenSSH server executable
    crit: notable
    conf: 0.98
    for: [elf, pe]
    if:
      type: basename
      # OpenSSH 9.8 split the monolithic sshd: per-connection work moved to
      # `sshd-session` and pre-auth handling to `sshd-auth`, both launched by
      # the listener.
      regex: '^sshd(-session|-auth)?(\.exe)?$'

composite_rules:
  - id: openssh-portable-source
    desc: OpenSSH portable source tree context
    crit: notable
    conf: 0.98
    any:
      - id: source-tree-path
      - id: portable-dev-list-address
      - id: solaris-package-init-variable

  - id: openssh-server
    for: [elf, pe]
    desc: OpenSSH server artifact context
    crit: notable
    conf: 0.99
    all:
      - id: package-context
      - id: server-artifact
