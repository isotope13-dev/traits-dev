defaults:
  platforms: [linux]
  for: [elf, shell, python, systemd_service]
  crit: baseline
  conf: 0.96
  size_max: 1073741824

traits:
  - id: package-context
    desc: OpenSSH package or server artifact context
    if:
      type: text
      regex: 'openssh-server|/usr/share/openssh/sshd_config|OpenBSD "secure shell"|OpenSSH[_ ]'

  # The upstream source tarball, unpacked as `openssh-9.6p1/`. OpenSSH is the
  # reference implementation of the things the credential-access rules look
  # for: `auth-pam.c` copies PAM prompt responses because that is what a PAM
  # conversation function does, `logintest.c` exercises utmp/wtmp accounting,
  # and the contrib specs and buildpkg scripts install the service.
  - id: source-tree-path
    desc: OpenSSH source tree path
    crit: notable
    conf: 0.97
    for: [c, cpp, shell, source]
    if:
      type: path
      regex: 'openssh-[0-9][0-9p.]{0,12}/'
  - id: sshd-service-dropin
    desc: OpenSSH socket systemd drop-in path
    if:
      type: text
      regex: '/etc/systemd/system/ssh\.socket\.d/[A-Za-z0-9_.-]+\.conf'

  - id: server-artifact
    desc: OpenSSH server executable
    crit: notable
    conf: 0.98
    for: [elf]
    if:
      type: basename
      regex: '^sshd(-session)?$'

composite_rules:
  - id: openssh-package
    desc: OpenSSH package context
    crit: notable
    conf: 0.98
    any:
      - id: package-context
      - id: sshd-service-dropin

  - id: openssh-server
    desc: OpenSSH server artifact context
    crit: notable
    conf: 0.99
    all:
      - id: openssh-package
      - id: server-artifact
