defaults:
  platforms: [windows]
  for: [pe]
  size_min: 100000
  size_max: 10485760

traits:
  - id: windows-product-claim
    desc: PE version resource claims OpenSSH for Windows
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^OpenSSH for Windows$'

composite_rules:
  - id: windows-platform-signed-component
    desc: Microsoft-signed OpenSSH Windows PE component
    crit: notable
    conf: 0.99
    all:
      - id: windows-product-claim
      - id: metadata/signed/platform::microsoft
