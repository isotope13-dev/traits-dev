# Citrix NetScaler / ADC product identity. Appliance-management code, vendor
# documentation, and automation modules all name the product; on its own that
# is a target-platform fact, not an attack. The DoS composites in
# objectives/impact/dos/resource/ combine it with the destructive command.
defaults:
  platforms: [unix, appliance]
  for: [scripts, source, go, java, kotlin, csharp, swift]

traits:
  - id: netscaler-appliance-reference
    desc: References a NetScaler appliance
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NetScaler appliance
