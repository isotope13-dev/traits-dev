defaults:
  platforms: [netscaler, appliance, windows]
  for: [powershell]

traits:
  - id: netscaler-nsupdate-api-path
    desc: NetScaler nsupdate API path reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /nitro/v1/config/nsupdate

  - id: netscaler-fileupload-api-path
    desc: NetScaler file-upload API path reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /nitro/v1/config/fileupload

  - id: netscaler-cli-script-api-path
    desc: NetScaler CLI-script API path reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /nitro/v1/config/cli_script

