defaults:
  platforms: [netscaler, appliance, unix]
  for: [php]

composite_rules:
  - id: php-netscaler-account-label-path-clues
    desc: NetScaler account path and backdoor label clues
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/app/network/netscaler::php-nsapppasswd-path
      - id: metadata/lang/source/naming/account::php-backdoor-user-identifier
    any:
      - id: well-known/app/network/netscaler::php-netscaler-peer-config-path
