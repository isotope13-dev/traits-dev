defaults:
  platforms: [netscaler, appliance, unix]
  for: [php]

traits:
  - id: php-nsapppasswd-path
    desc: NetScaler nsapppasswd path in PHP
    crit: notable
    conf: 0.92
    size_min: 21
    if:
      type: text
      substr: /nsconfig/nsapppasswd

  - id: php-netscaler-peer-config-path
    desc: NetScaler peer configuration path in PHP
    crit: notable
    conf: 0.92
    size_min: 28
    if:
      type: text
      substr: /flash/nsconfig/nspeers.conf

