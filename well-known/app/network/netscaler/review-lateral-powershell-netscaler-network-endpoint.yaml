---
defaults:
  platforms:
  - netscaler
  - appliance
  - windows
  for:
  - powershell
composite_rules:
- id: netscaler-config-api-paths
  desc: NetScaler update, upload and CLI path references
  crit: notable
  conf: 0.98
  all:
  - id: well-known/app/network/netscaler::netscaler-nsupdate-api-path
  - id: well-known/app/network/netscaler::netscaler-fileupload-api-path
  any:
  - id: well-known/app/network/netscaler::netscaler-cli-script-api-path
