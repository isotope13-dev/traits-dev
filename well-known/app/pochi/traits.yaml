# Pochi — TabbyML's open-source AI coding agent VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json]
  crit: baseline
  conf: 0.98

traits:
  - id: pochi-package-name
    desc: Pochi VS Code extension package name
    if:
      type: text
      regex: '(?i)TabbyML\.pochi|["'']pochi["'']'

  - id: pochi-publisher-marker
    desc: TabbyML publisher marker
    if:
      type: text
      substr: TabbyML

  - id: getpochi-runtime-marker
    desc: GetPochi runtime package marker
    if:
      type: text
      substr: '@getpochi/'

  - id: pochi-homepage-marker
    desc: Pochi homepage marker
    if:
      type: text
      substr: getpochi.com

composite_rules:
  - id: pochi-vscode-extension
    desc: TabbyML Pochi AI coding agent extension
    crit: notable
    conf: 0.98
    all:
      - id: pochi-publisher-marker
    any:
      - id: pochi-package-name
      - id: getpochi-runtime-marker
      - id: pochi-homepage-marker
