# preflow-devtools — Preflow PHP framework dev CLI package.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: preflow-devtools-composer-name
    desc: preflow/devtools Composer package name
    for: [composer.json]
    if:
      type: value
      path: name
      exact: preflow/devtools

  - id: preflow-devtools-archive-name
    desc: preflow-devtools source archive name
    if:
      type: path
      regex: '(?i)preflow-devtools'

  - id: preflow-devtools-namespace
    desc: Preflow DevTools PHP namespace marker
    for: [php]
    crit: notable
    if:
      type: text
      substr: Preflow\DevTools

composite_rules:
  - id: preflow-devtools-php-package
    desc: Preflow PHP devtools Composer package
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: preflow-devtools-composer-name
      - id: preflow-devtools-archive-name
      - id: preflow-devtools-namespace
