defaults:
  platforms: [unix]
  for: [pkginfo, python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Platterpus Python package identity
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: platterpus

  - id: project-repository
    desc: Platterpus project repository URL
    for: [pkginfo]
    if:
      type: value
      path: project-url
      substr: github.com/rmccann-hub/Platterpus

  - id: source-package-path
    desc: Platterpus Python source package path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])platterpus([\\/]|$)'

composite_rules:
  - id: package-identity
    desc: Recognized Platterpus Linux CD-ripping application
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: project-repository
