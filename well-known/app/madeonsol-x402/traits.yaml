# madeonsol-x402 — x402 micropayment client for MadeOnSol Solana API.
defaults:
  platforms: [unix, windows]
  for: [python, text, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: madeonsol-x402-wheel-name
    desc: madeonsol-x402 Python wheel archive name
    if:
      type: path
      regex: '(?i)madeonsol[_-]x402.*\.whl$'

  - id: madeonsol-x402-package-name
    desc: madeonsol-x402 distribution name
    for: [text, python]
    if:
      type: text
      regex: '(?m)^Name:\s*madeonsol-x402\s*$'

  - id: madeonsol-client-class
    desc: MadeOnSol API client class marker
    crit: notable
    for: [python]
    if:
      type: text
      substr: class MadeOnSolClient

  - id: madeonsol-api-endpoint
    desc: MadeOnSol API base URL marker
    crit: notable
    for: [python]
    if:
      type: text
      substr: https://madeonsol.com

composite_rules:
  - id: madeonsol-x402-python-sdk
    desc: MadeOnSol x402 Solana API Python SDK
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: madeonsol-client-class
    any:
      - id: madeonsol-x402-wheel-name
      - id: madeonsol-x402-package-name
      - id: madeonsol-api-endpoint
