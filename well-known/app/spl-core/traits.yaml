# spl-core — Avengineers Software Product Line support for CMake (Python wheel).
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, json, shell, powershell]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: spl-core-wheel-name
    desc: spl-core Python wheel archive name
    if:
      type: path
      regex: '(?i)spl_core-.*\.whl'

  - id: spl-core-package-name
    desc: spl-core Python distribution name
    if:
      type: text
      regex: '(?i)^Name:\s*spl-core\s*$'

  - id: spl-core-pypeline-marker
    desc: spl-core pypeline build workflow marker
    for: [powershell, python]
    crit: notable
    if:
      type: text
      substr: pypeline run --step GenerateEnvSetupScript

  - id: spl-core-bootstrap-marker
    desc: spl-core bootstrap-installer template marker
    for: [powershell]
    crit: notable
    if:
      type: text
      substr: avengineers/bootstrap-installer

composite_rules:
  - id: spl-core-python-package
    desc: Avengineers spl-core CMake product-line Python package
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: spl-core-wheel-name
      - id: spl-core-bootstrap-marker
      - id: spl-core-pypeline-marker
    all:
      - id: spl-core-package-name
