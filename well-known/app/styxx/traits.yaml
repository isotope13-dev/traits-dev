# styxx — Fathom Lab LLM agent cognitive vitals monitor (Python wheel).
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, json, archives]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: styxx-wheel-name
    desc: styxx Python wheel archive name
    if:
      type: path
      regex: '(?i)styxx-.*\.whl'

  - id: styxx-package-name
    desc: styxx Python distribution name
    if:
      type: text
      regex: '(?i)^Name:\s*styxx\s*$'

  - id: styxx-publish-endpoint
    desc: styxx opt-in dashboard publish endpoint
    for: [python]
    crit: notable
    if:
      type: text
      substr: fathom.darkflobi.com/api/styxx-submit

  - id: styxx-cognitive-vitals-marker
    desc: styxx cognitive vitals monitor marker
    for: [python, markdown]
    crit: notable
    if:
      type: text
      substr: cognitive vitals monitor

composite_rules:
  - id: styxx-python-package
    desc: Fathom Lab styxx LLM agent vitals monitor
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: styxx-wheel-name
      - id: styxx-package-name
      - id: styxx-publish-endpoint
      - id: styxx-cognitive-vitals-marker
