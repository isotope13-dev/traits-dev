defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text, tar]
  crit: notable
  conf: 0.96
  size_min: 50
  size_max: 1000000

traits:
  - id: brightdata-cli-heading
    desc: Bright Data CLI skill heading
    conf: 0.99
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: Bright Data CLI

  - id: brightdata-cli-package
    desc: References @brightdata/cli package
    conf: 0.99
    if:
      type: text
      substr: '@brightdata/cli'

  - id: brightdata-api-key-env
    desc: Bright Data API key environment variable
    conf: 0.98
    if:
      type: text
      word: BRIGHTDATA_API_KEY

  - id: brightdata-cli-credentials-path
    desc: Bright Data CLI credentials path
    conf: 0.98
    if:
      type: text
      substr: .config/brightdata-cli/credentials.json

composite_rules:
  - id: brightdata-skills-bundle
    desc: Bright Data agent skills bundle
    conf: 0.98
    needs: 2
    any:
      - id: brightdata-cli-heading
      - id: brightdata-cli-package
      - id: brightdata-api-key-env
      - id: brightdata-cli-credentials-path
