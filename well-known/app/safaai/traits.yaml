# SafaAI is an interactive developer-workstation cleanup and optimization TUI.
# Its privileged cleanup, browser-cache inspection, and self-update paths are
# user-invoked product functionality; the archive context prevents those
# capabilities from being mistaken for hostile activity.
defaults:
  platforms: [unix]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: SafaAI Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: safaai

  - id: package-name
    desc: SafaAI package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: safaai

  - id: optimizer-summary
    desc: SafaAI workstation optimizer summary
    for: [pkginfo]
    if:
      type: text
      substr: TUI-first developer workstation optimizer

  - id: cleanup-graph-module
    desc: SafaAI cleanup graph module
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      exact: safaai/scanners/graph.py

composite_rules:
  - id: application-identity
    desc: Recognized SafaAI interactive workstation optimizer
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: optimizer-summary
      - id: cleanup-graph-module
