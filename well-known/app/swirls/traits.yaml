# Swirls — VS Code language extension for .swirls workflow files.
defaults:
  platforms: [unix, windows]
  for: [package.json, markdown, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: swirls-publisher
    desc: Swirls VS Code extension publisher
    if:
      type: text
      substr: swirlsai

  - id: swirls-package-name
    desc: Swirls VS Code extension package name
    if:
      type: value
      path: name
      exact: vscode-swirls

  - id: swirls-language-id
    desc: Swirls language contribution id
    if:
      type: text
      substr: '"id": "swirls"'

composite_rules:
  - id: swirls-extension-context
    desc: Swirls VS Code language extension identity
    crit: notable
    all:
      - id: swirls-publisher
      - id: swirls-package-name
