# nirium — Official Python SDK for Nirium Protocol (Stellar/Soroban DeFi agents).
defaults:
  platforms: [unix, windows]
  for: [python, whl, tar, egg]
  crit: baseline
  conf: 0.98

traits:
  - id: nirium-package-name
    desc: nirium Python package name
    if:
      type: text
      regex: '(?i)\bnirium\b'

  - id: nirium-module-path
    desc: nirium Python module tree path
    if:
      type: path
      regex: '(^|/)nirium/'

  - id: nirium-github-marker
    desc: nirium GitHub repository marker
    if:
      type: text
      substr: github.com/nirium/nirium

  - id: nirium-protocol-marker
    desc: Nirium Protocol product marker
    if:
      type: text
      regex: '(?i)Nirium Protocol|nirium\.dev|x402 \+ MPP'

composite_rules:
  - id: nirium-python-sdk
    desc: Nirium Protocol Python SDK
    crit: notable
    conf: 0.98
    all:
      - id: nirium-package-name
    any:
      - id: nirium-module-path
      - id: nirium-github-marker
      - id: nirium-protocol-marker
