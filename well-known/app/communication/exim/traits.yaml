defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 50000000

traits:
  - id: exim4-basename
    desc: Exim daemon executable basename
    if:
      type: value
      path: file.basename
      exact: exim4

  - id: exim-version-banner
    desc: Exim version banner
    if:
      type: text
      section: .rodata
      substr: Exim version

  - id: exim-mta-banner
    desc: Exim mail-transfer-agent banner
    if:
      type: text
      section: .rodata
      substr: Exim is a Mail Transfer Agent

composite_rules:
  - id: exim-mail-transfer-agent
    desc: Exim mail-transfer-agent binary
    all:
      - id: exim4-basename
      - id: exim-mta-banner
