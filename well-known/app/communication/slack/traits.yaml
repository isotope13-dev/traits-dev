defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: baseline
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: slack-app-context
    desc: Slack macOS Electron app.asar context
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^(52[.]bundle[.]cjs|main[.]bundle[.]cjs)$'

  - id: official-install-windows-ps1-url
    desc: Official Slack CLI PowerShell installer URL
    crit: notable
    conf: 0.98
    for: [powershell, text, markdown, github-actions]
    if:
      type: text
      regex: downloads\.slack-edge\.com/slack-cli/install(-windows)?\.ps1

