# Howard E-Mail Notifier (the sz development) Windows components.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 50000000

traits:
  - id: howard-setup-product
    desc: Howard E-Mail Notifier setup product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Howard E-Mail Notifier

  - id: howard-application-product
    desc: Howard E-Mail Notifier application metadata
    if:
      type: value
      path: pe.version.product_name
      exact: the sz development Howard

  - id: libcurl-wrapper-product
    desc: LibCurlWrapper component product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: the sz development LibCurlWrapper

composite_rules:
  - id: howard-component-context
    desc: Recognized Howard E-Mail Notifier component context
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/utility/trion::trion-company
    any:
      - id: howard-setup-product
      - id: howard-application-product
      - id: libcurl-wrapper-product
