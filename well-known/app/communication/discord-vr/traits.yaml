# discord-vr — xx347x helper that patches discord.py's IDENTIFY payload
# so a bot presents as Discord VR / Oculus. The DiscordWebSocket.identify
# assignment is a real method hook; it is product behavior, not a loader.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: discord-vr PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: discord-vr

  - id: wheel-distribution
    desc: discord_vr wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: discord_vr

  - id: github-repo
    desc: xx347x Discord-VR GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/xx347x/Discord-VR

  - id: vr-browser-property
    desc: Discord VR IDENTIFY browser property
    for: [python]
    conf: 0.98
    if:
      type: text
      substr: '"Discord VR"'
