# Frenfoil — open-source AGPL end-to-end encrypted messenger on its own
# post-quantum protocol (git.josf.dev/josefandersson/frenfoil). Identity is
# mnemonic-based, so asking for the recovery phrase (e.g. to export from a
# device) is the app's own account flow, not a wallet-drainer prompt.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: frenwire-protocol-marker
    desc: Frenfoil frenwire protocol marker
    if:
      type: text
      substr: frenwire

  - id: frenfoil-app-identity
    desc: Frenfoil application identity marker
    if:
      type: text
      substr: frenfoil

composite_rules:
  - id: frenfoil-messenger-context
    desc: Frenfoil encrypted messenger application context
    any:
      - id: frenwire-protocol-marker
      - id: frenfoil-app-identity
