# TeleVault — Telegram MTProto cloud backup with optional systemd timers.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: televault PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: televault

  - id: github-repo
    desc: TeleVault GitHub repository marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: github.com/yahyatoubali/televault

  - id: mtproto-backup-summary
    desc: TeleVault MTProto cloud backup summary
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: Unlimited cloud storage using Telegram MTProto

  - id: schedule-module-doc
    desc: TeleVault automatic backup scheduler module
    for: [python]
    if:
      type: text
      substr: Automatic backup scheduler for TeleVault

composite_rules:
  - id: televault-backup-context
    desc: TeleVault Telegram MTProto cloud backup tool
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: mtproto-backup-summary

  - id: televault-backup-scheduler-context
    desc: TeleVault scheduled backup with systemd timers
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: schedule-module-doc
