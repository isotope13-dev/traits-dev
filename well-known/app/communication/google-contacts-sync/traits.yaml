# Google Contacts Sync adapter for Android. This identifies the sync component;
# contact access, boot handling, and network use are expected for its purpose.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
  - id: contacts-sync-service-class
    desc: Google Contacts Sync adapter service class
    if:
      type: text
      substr: Lcom/google/android/syncadapters/contacts/ContactsSyncAdapterService;

  - id: contacts-sync-adapter-class
    desc: Google Contacts Sync implementation class
    if:
      type: text
      substr: Lcom/google/android/syncadapters/contacts/ContactsSyncAdapter;

composite_rules:
  - id: google-contacts-sync-adapter
    desc: Google Contacts Sync Android component
    for: [android_apk, zip, dex]
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: contacts-sync-service-class
      - id: contacts-sync-adapter-class
