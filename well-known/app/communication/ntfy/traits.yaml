# ntfy is an open-source HTTP pub-sub notification server and CLI. Release
# binaries embed both the Go module path and the package description, along
# with the rendered documentation served by the application.
defaults:
  platforms: [unix]
  for: [elf]
  size_max: 200000000

traits:
  - id: go-module-path
    desc: ntfy server Go module path
    crit: component
    conf: 0.99
    if:
      type: text
      section: .gopclntab
      substr: heckel.io/ntfy/v2

  - id: cli-subscribe-usage
    desc: ntfy subscribe command usage
    crit: component
    conf: 0.98
    if:
      type: text
      section: .rodata
      substr: ntfy subscribe [OPTIONS..] [TOPIC]

composite_rules:
  - id: ntfy-binary
    desc: ntfy notification server or CLI binary
    crit: notable
    conf: 0.99
    all:
      - id: go-module-path
      - id: cli-subscribe-usage
