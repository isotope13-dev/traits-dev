# endcord — Discord TUI client (github.com/sparklost/endcord).
defaults:
  platforms: [unix, windows]
  for: [python, shell, tar, archives, gz]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 50000000

traits:
  - id: copyright-header
    desc: Endcord SparkLost copyright header
    for: [python]
    if:
      type: text
      substr: endcord - Copyright

  - id: repo-path
    desc: sparklost/endcord repository path
    if:
      type: text
      substr: sparklost/endcord

  - id: package-directory
    desc: endcord package directory path
    if:
      type: path
      regex: '(^|[\\/])endcord[\\/]'

composite_rules:
  - id: package-context
    desc: Endcord Discord TUI client package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: repo-path
      - id: package-directory
    all:
      - id: copyright-header
