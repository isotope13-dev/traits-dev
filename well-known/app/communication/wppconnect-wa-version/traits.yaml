# @wppconnect/wa-version — WPPConnect Team npm package that mirrors pinned
# WhatsApp Web HTML builds for automation clients. Fetches web.whatsapp.com
# check-update endpoints by design; not a stealer or session harvester.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: WPPConnect wa-version package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@wppconnect/wa-version'

  - id: archive-package-name
    desc: WPPConnect wa-version npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@wppconnect/wa-version'

  - id: package-member-context
    desc: WPPConnect wa-version package member
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@wppconnect/wa-version'

  - id: repository-coordinate
    desc: WPPConnect wa-version GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'wppconnect-team/wa-version'

  - id: whatsapp-check-update-url
    desc: WhatsApp Web check-update URL constant
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      substr: web.whatsapp.com/check-update

composite_rules:
  - id: wppconnect-wa-version-context
    desc: WPPConnect WhatsApp Web version mirror package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: repository-coordinate
      - id: whatsapp-check-update-url
