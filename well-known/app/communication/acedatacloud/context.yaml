defaults:
  platforms: [unix, windows]

composite_rules:
  - id: personal-wechat-byoc-context
    desc: AceDataCloud Personal WeChat BYOC connector context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: skills-package-name
      - id: personal-wechat-base-url
      - id: personal-wechat-api-token
      - id: micro-behaviors/communications/http/headers::authorization-header-map-entry
  - id: personal-wechat-byoc-file-context
    desc: Personal WeChat BYOC connector file context
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: personal-wechat-base-url
      - id: personal-wechat-api-token
      - id: micro-behaviors/communications/http/headers::authorization-header-map-entry
