defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell, batch]
traits:
- id: phoneexperiencehost-process
  desc: PhoneExperienceHost name reference
  crit: notable
  conf: 0.88
  size_min: 19
  if:
    type: text
    section: any
    substr: PhoneExperienceHost
- id: yourphone-process
  desc: YourPhone name reference
  crit: notable
  conf: 0.86
  size_min: 9
  if:
    type: text
    section: any
    regex: '\bYourPhone(\.exe)?\b'
- id: link-to-windows-process
  desc: Link to Windows name reference
  crit: notable
  conf: 0.86
  size_min: 15
  if:
    type: text
    section: any
    substr: Link to Windows
