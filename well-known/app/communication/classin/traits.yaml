# ClassIn (EEO) classroom client. EeoCamera.dll captures camera frames.
defaults:
  size_min: 100000
  size_max: 80000000
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: eeo-camera-basename
    desc: ClassIn camera capture DLL
    conf: 0.95
    if:
      type: basename
      exact: EeoCamera.dll
      case_insensitive: true
