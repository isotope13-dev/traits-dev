# Bob Frankston mailx — personal email client suite (IMAP/SMTP, local store,
# settings sync). Legitimate mail operations; identity only — not a verdict.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.96

traits:
  - id: mailx-package-name
    desc: Bob Frankston mailx package name
    for: [package.json]
    conf: 0.98
    if:
      type: value
      path: name
      regex: '^@bobfrankston/mailx'

  - id: mailx-github-repository
    desc: Bob Frankston mailx GitHub repository URL
    for: [package.json]
    conf: 0.96
    if:
      type: value
      path: repository.url
      regex: 'github\.com/BobFrankston/mailx'

  - id: mailx-settings-cloud-module
    desc: mailx settings cloud storage module
    for: [javascript, typescript]
    conf: 0.97
    if:
      type: text
      substr: 'Cloud storage for mailx settings'

  - id: mailx-imap-module-marker
    desc: mailx-imap package module marker
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: text
      substr: '@bobfrankston/mailx-imap'

  - id: mailx-github-source-marker
    desc: Bob Frankston mailx source repository marker
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: text
      substr: 'github.com/BobFrankston/mailx'

  - id: mailx-android-marker
    desc: mailx Android bootstrap telemetry marker
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: text
      substr: 'mailx-android'

  - id: mailx-api-bridge-marker
    desc: mailx injected application bridge marker
    for: [javascript, typescript]
    conf: 0.98
    if:
      type: text
      regex: '\bmailxapi\??\.isApp\b'

  - id: mailx-package-member
    desc: Bob Frankston mailx package member
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      regex: '^@bobfrankston/mailx'

  - id: mailx-settings-package
    desc: Bob Frankston mailx settings package
    for: [package.json]
    conf: 0.98
    if:
      type: value
      path: name
      exact: '@bobfrankston/mailx-settings'

  - id: mailx-settings-member
    desc: Bob Frankston mailx settings package member
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@bobfrankston/mailx-settings'

  - id: iflow-direct-package
    desc: Bob Frankston iflow IMAP client package
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@bobfrankston/iflow-direct'

composite_rules:
  - id: mailx-ecosystem-package
    desc: Bob Frankston mailx email client package
    crit: notable
    conf: 0.97
    any:
      - id: mailx-package-name
      - id: mailx-package-member
      - id: iflow-direct-package
      - id: mailx-imap-module-marker

  - id: mailx-renderer-ipc-client
    desc: Bob Frankston mailx renderer IPC client
    crit: notable
    conf: 0.98
    all:
      - id: mailx-api-bridge-marker
      - id: micro-behaviors/communications/ipc/rpc::ipc-object-method-call

  - id: mailx-settings-cloud-sync
    desc: Bob Frankston mailx settings cloud sync package
    crit: notable
    conf: 0.97
    any:
      - id: mailx-settings-package
      - id: mailx-settings-member
