# Moonlight Discord mod launcher — locates Discord stable/PTB/Canary installs
# to inject the mod, not to harvest tokens.
defaults:
  platforms: [unix, windows]
  for: [pe, elf, shell, text]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 50000000

traits:
  - id: moonlight-mod-github-repo
    desc: Moonlight mod upstream GitHub repository
    if:
      type: text
      substr: github.com/moonlight-mod/moonlight

  - id: moonlight-launcher-binary-name
    desc: Moonlight mod launcher executable basename
    if:
      type: basename
      regex: '^moonlight-(ptb|canary|stable)$'

  - id: discord-install-discovery-message
    desc: Moonlight Discord installation discovery message
    if:
      type: text
      substr: moonlight couldn't find your Discord installation

composite_rules:
  - id: moonlight-discord-launcher-context
    desc: Moonlight Discord mod launcher context
    crit: exception
    conf: 0.99
    any:
      - id: moonlight-mod-github-repo
      - id: moonlight-launcher-binary-name
      - id: discord-install-discovery-message
