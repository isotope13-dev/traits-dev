# Passkey Linker is a disclosed WhatsApp Web session mover. Its popup states
# that it extracts the authenticated session to link the account to another
# system, hands the credentials only to an allowlisted connector page, and
# clears the local copy once that page acknowledges the import. The identity
# and first-party connector protocol are benign context for the injected
# IndexedDB wipe; the extraction itself stays visible through its own traits.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Passkey Linker extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Passkey Linker

  - id: manifest-description
    desc: Passkey Linker WhatsApp session description
    for: [chrome-manifest]
    if:
      type: value
      path: description
      substr: sessão autenticada

  - id: connector-origin
    desc: Passkey Linker allowlisted connector origin
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https://app\.wavoip\.com\b'

  - id: connector-protocol
    desc: Passkey Linker credential ACK message
    for: [javascript, typescript]
    if:
      type: text
      substr: PLK_CREDS_ACK

composite_rules:
  - id: disclosed-integration-context
    desc: Passkey Linker disclosed WhatsApp session mover
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-description
      - id: connector-origin
      - id: connector-protocol
      - id: metadata/permission/host::host-permission-im-web-app
