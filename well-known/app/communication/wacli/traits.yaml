# wacli — openclaw WhatsApp CLI (sync, search, send from terminal).
defaults:
  platforms: [unix, windows]
  for: [go, markdown, javascript, shell, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: wacli Go module path
    for: [go]
    if:
      type: text
      substr: github.com/openclaw/wacli

  - id: archive-path
    desc: wacli source archive path
    if:
      type: path
      regex: 'wacli-[0-9]'

  - id: homepage-marker
    desc: wacli product homepage
    for: [markdown, go]
    if:
      type: text
      substr: wacli.sh

  - id: whatsmeow-dependency
    desc: wacli whatsmeow WhatsApp Web client dependency
    for: [go]
    if:
      type: text
      substr: go.mau.fi/whatsmeow

composite_rules:
  - id: wacli-whatsapp-cli-context
    desc: wacli WhatsApp terminal CLI project
    crit: exception
    conf: 0.99
    any:
      - id: module-path
      - id: archive-path
      - id: homepage-marker
      - id: whatsmeow-dependency
