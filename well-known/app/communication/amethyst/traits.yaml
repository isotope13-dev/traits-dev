# Amethyst Nostr social client for Android (vitorpamplona/amethyst).
defaults:
  platforms: [android, unix, windows]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: amethyst-source-package
    desc: Amethyst Android package namespace
    for: [java, kotlin]
    if:
      type: text
      regex: 'package\s+com\.vitorpamplona\.amethyst'

  - id: amethyst-repository-marker
    desc: Amethyst upstream repository marker
    for: [markdown, text, json, kotlin]
    if:
      type: text
      substr: 'vitorpamplona/amethyst'

  - id: amethyst-archive-member
    desc: Amethyst source archive member path
    for: [zip, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)github\.com/vitorpamplona/amethyst'

composite_rules:
  - id: amethyst-source-context
    desc: Amethyst source repository context
    crit: exception
    any:
      - id: amethyst-source-package
      - id: amethyst-repository-marker
      - id: amethyst-archive-member
