# FreeDV is open-source digital voice software for amateur radio, developed
# under the Software Freedom Conservancy. Its audio processing, codec integration
# (Codec 2 / LPCNet), and wxWidgets-based GUI explain the standard helper APIs.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: freedv-product-name
    desc: FreeDV PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: FreeDV

  - id: freedv-description
    desc: FreeDV PE file description
    if:
      type: value
      path: pe.version.description
      exact: FreeDV - HF Digital Voice for Radio Amateurs

  - id: freedv-company-name
    desc: FreeDV PE company name
    if:
      type: value
      path: pe.version.company
      regex: '^(FreeDV|Software Freedom Conservancy)'

  - id: freedv-signer
    desc: FreeDV SFC Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Software Freedom Conservancy\\, Inc\.'

  - id: freedv-pdb-path
    desc: FreeDV build PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '[\\/]freedv(-gui)?[\\/].*freedv\.pdb$'

composite_rules:
  - id: freedv-application-identity
    desc: FreeDV digital voice application
    crit: notable
    conf: 0.99
    all:
      - id: freedv-product-name
      - id: freedv-description

  - id: freedv-installer-identity
    desc: FreeDV Windows installer package
    crit: notable
    conf: 0.99
    all:
      - id: freedv-product-name
      - id: freedv-description
      - id: metadata/binary/installer/script::nsis
