# BlueBubbles is an open-source cross-platform messaging client ecosystem
# for iMessage on Android, Linux, Windows, macOS and Web (bluebubbles.app).
defaults:
  crit: notable
  conf: 0.99
  platforms: [android]
  for: [xml, yaml, json, text, source, manifests]
  size_max: 50000000

traits:
  - id: android-package-name
    desc: BlueBubbles Android manifest package name
    for: [xml]
    if:
      type: text
      substr: 'package="com.bluebubbles.messaging"'

  - id: flutter-pubspec-name
    desc: BlueBubbles Flutter pubspec application name
    for: [yaml, manifests, text]
    if:
      type: text
      regex: '(?m)^name:\s*bluebubbles\b'

  - id: app-repository-path
    desc: BlueBubbles repository source tree path
    for: [source, manifests, text, xml, yaml]
    if:
      type: path
      regex: '(?i)(^|[\\/])bluebubbles-app(-[0-9a-z._+]+)?[\\/]'

composite_rules:
  - id: app-identity
    desc: Recognized BlueBubbles messaging client application
    crit: notable
    conf: 0.995
    any:
      - id: android-package-name
      - id: flutter-pubspec-name
      - id: app-repository-path
