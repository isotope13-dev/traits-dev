# Discord HypeSquad Switcher is a paid Firefox/Chrome extension that reads the
# live Discord session token only to call Discord's official HypeSquad house API.
# That token read matches the stealer composite in isolation; suppress when the
# archive also identifies this product and the HypeSquad house endpoint.
defaults:
  platforms: [unix, windows]
  for: [javascript, chrome-manifest]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Discord HypeSquad Switcher manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Discord HypeSquad Switcher

  - id: firefox-extension-id
    desc: Discord HypeSquad Switcher Firefox extension ID
    for: [chrome-manifest]
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: discord-hypesquad-switcher-amo@spegal.dev

  - id: hypesquad-house-api-path
    desc: Discord HypeSquad house online API path
    for: [javascript]
    if:
      type: text
      substr: /api/v9/hypesquad/online

  - id: house-switch-message
    desc: Extension house-switch runtime message
    for: [javascript]
    if:
      type: text
      substr: SWITCH_HOUSE

composite_rules:
  - id: hypesquad-switcher-extension-context
    desc: Discord HypeSquad Switcher extension identity and house API
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: firefox-extension-id
      - id: hypesquad-house-api-path
      - id: house-switch-message