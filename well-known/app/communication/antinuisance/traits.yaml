defaults:
  platforms: [android]
  for: [apk]
  crit: baseline
  conf: 0.99

traits:
  - id: antinuisance-package
    desc: AntiNuisance Android package name
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "org.whiteglow.antinuisance"

  - id: antinuisance-main-activity
    desc: AntiNuisance main activity class
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lorg/whiteglow/antinuisance/activity/MainActivity;"

  - id: antinuisance-service
    desc: AntiNuisance service class
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lorg/whiteglow/antinuisance/service/AntiNuisanceService;"

  - id: antinuisance-sms-receiver
    desc: AntiNuisance SMS receiver class
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lorg/whiteglow/antinuisance/service/SmsMessageReceiver;"

  - id: antinuisance-call-receiver
    desc: AntiNuisance call receiver class
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lorg/whiteglow/antinuisance/service/CallReceiver;"

composite_rules:
  - id: antinuisance-application
    desc: AntiNuisance Android application identity
    crit: notable
    conf: 0.995
    for: [android_apk, zip, xml, dex]
    scope: outer
    all:
      - id: antinuisance-package
      - id: antinuisance-main-activity

  - id: antinuisance-dex-features
    desc: AntiNuisance DEX call and SMS filter implementation
    crit: exception
    conf: 0.995
    for: [dex]
    all:
      - id: antinuisance-main-activity
      - id: antinuisance-service
      - id: antinuisance-sms-receiver
      - id: antinuisance-call-receiver
