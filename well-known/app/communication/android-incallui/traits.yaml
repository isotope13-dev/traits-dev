# Android InCallUI is the AOSP and OEM system in-call user interface app (com.android.incallui).
# As a core telephony system component running with sharedUserId="android.uid.phone",
# it handles incoming/ongoing call screens (SYSTEM_ALERT_WINDOW), contacts display (READ_CONTACTS),
# and quick reject-with-SMS (READ_SMS).
defaults:
  platforms: [android]
  for: [xml]
  crit: baseline
  conf: 0.99

traits:
  - id: incallui-package
    desc: Android InCallUI package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.android.incallui"

  - id: incallui-shared-user-phone
    desc: Android phone system shared user ID
    crit: notable
    conf: 0.99
    if:
      type: value
      path: android_xml.values[*].value
      exact: "android.uid.phone"

  - id: incallui-application-class
    desc: Android InCallUI application class
    crit: notable
    conf: 0.99
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.android.incallui.InCallApp"

composite_rules:
  - id: incallui-manifest-identity
    desc: Android InCallUI manifest identity
    crit: exception
    conf: 0.995
    all:
      - id: incallui-package
    any:
      - id: incallui-shared-user-phone
      - id: incallui-application-class
