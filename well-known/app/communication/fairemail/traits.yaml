# FairEmail — Fully featured, open source, privacy friendly email app for Android.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, text, zip, source]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: FairEmail package name
    for: [java, kotlin, text, xml]
    conf: 0.98
    if:
      type: text
      substr: eu.faircode.email

  - id: archive-path
    desc: FairEmail source tree path
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[/\\])fairemail([/\\]|-|$)'

composite_rules:
  - id: fairemail-email-client-context
    desc: FairEmail email client context
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: package-name
      - id: archive-path
