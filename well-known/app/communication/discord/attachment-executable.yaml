defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, documents]
  crit: notable
traits:
  - id: discord-cdn-shell-script-url
    desc: Discord attachment has shell script suffix
    conf: 0.95
    if:
      type: text
      regex: 'cdn\.discordapp\.com/attachments/\d+/\d+/[^\s"''<>]{1,80}\.sh\b'
composite_rules:
  - id: discord-cdn-executable-url
    desc: Discord executable attachment URL reference
    conf: 0.95
    any:
      - id: discord-cdn-windows-executable-url
      - id: discord-cdn-shell-script-url
