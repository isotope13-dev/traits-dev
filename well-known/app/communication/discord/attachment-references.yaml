defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: discord-cdn-download-url
  desc: Discord attachment URL reference
  if:
    type: text
    regex: (cdn|media)\.discordapp\.(com|net)/attachments/\d+/\d+/
- id: discord-cdn-windows-executable-url
  desc: Discord CDN URL with executable extension
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: discordapp\.com/attachments/[0-9]{15,}/[0-9]{15,}/.{1,80}\.(exe|dll|bat|ps1)\b
- id: discord-cdn-archive-url
  desc: Discord CDN URL with archive extension
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: discordapp\.com/attachments/[0-9]{15,}/[0-9]{15,}/.{1,80}\.(zip|7z|rar)\b

composite_rules:
- id: discord-cdn-download-url-any
  desc: Discord CDN executable or archive URL
  crit: notable
  conf: 0.9
  any:
  - id: discord-cdn-executable-url
  - id: discord-cdn-archive-url
