defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: discord-rpc-assembly
    desc: Discord RPC managed assembly
    for: [pe]
    size_max: 500000
    if:
      type: path
      basename: true
      exact: DiscordRPC.dll
      case_insensitive: true

  - id: discord-app-path-windows
    desc: Discord Windows application directory
    conf: 0.7
    for: [elf, macho, pe, javascript, typescript, python, rust]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      regex: '(?i)AppData[/\\](Roaming|Local)[/\\]discord(canary|ptb)?[/\\]'

  - id: discord-app-path-macos
    desc: Discord macOS application directory
    conf: 0.7
    for: [elf, macho, pe, javascript, typescript, python, rust]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      regex: '(?i)Application Support[/\\]discord(canary|ptb)?[/\\]'

  - id: discord-app-path-linux
    desc: Discord Linux application directory
    conf: 0.7
    for: [elf, macho, pe, javascript, typescript, python, rust]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      regex: '(?i)\.config[/\\]discord(canary|ptb)?[/\\]'

  # Client-channel names identify Discord installations, not credential
  # access. Credential objectives may use these as target context only when
  # combined with concrete local-state access and decryption behavior.
  - id: webpack-runtime-global
    desc: Discord webpack runtime global
    conf: 0.98
    if:
      type: symbol
      kind: member
      exact: window.webpackChunkdiscord_app

  - id: discord-core-asar-bridge
    desc: Discord core.asar CommonJS bridge
    conf: 0.95
    for: [pe, dll, javascript, typescript]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      substr: module.exports = require("./core.asar");

  - id: discord-app-mount-element
    desc: Targets Discord app-mount root element
    conf: 0.95
    if:
      type: text
      substr: getElementById("app-mount")

  - id: discord-layer-container-selector
    desc: Selects Discord layerContainer UI nodes
    conf: 0.95
    if:
      type: text
      substr: 'querySelectorAll("div[class^=layerContainer]"'

composite_rules:
  - id: discord-app-paths
    desc: References Discord application directories
    conf: 0.75
    any:
      - id: discord-app-path-windows
      - id: discord-app-path-macos
      - id: discord-app-path-linux
