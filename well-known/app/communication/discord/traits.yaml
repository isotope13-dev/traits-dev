defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Relocated from objectives/command-and-control/channel/messaging/. An
  # invite link is how every project publishes its community server -- README
  # badges, About screens, support pages -- so under a C2 messaging-channel
  # objective it reported a Flutter Misskey client's community link. (The rule
  # there had already grown a hardcoded carve-out for one specific invite
  # code, which is the usual sign the label is wrong rather than the sample.)
  # Composites that mean "this code talks to an attacker's Discord" reference
  # this and add the webhook/bot-token/exfil leg.
  - id: discord-invite-url
    desc: Discord invite URL
    crit: notable
    conf: 0.8
    for: [elf, macho, pe, javascript, typescript]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      regex: discord\.gg/[a-zA-Z0-9]+

  - id: webpack-runtime-global
    desc: Discord webpack runtime global
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: member
      exact: window.webpackChunkdiscord_app

  - id: discord-app-mount-element
    desc: Targets Discord app-mount root element
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: getElementById("app-mount")

  - id: discord-layer-container-selector
    desc: Selects Discord layerContainer UI nodes
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'querySelectorAll\("div\[class\^=layerContainer\]"'

  - id: discord-web-host-allowlist
    desc: Discord web host URL gate
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "https://discord.com/"
