defaults:
  platforms:
  - windows
  - macos
  - linux
  for:
  - javascript
  - typescript
  - python
  - pe
  - elf
  - macho
  - batch
  size_max: 50000000

traits:
  - id: discord-token-config-field
    desc: Discord token configuration label
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(label|name)\s*=\s*["'']Discord token["'']'
  - id: discord-token-account-scope
    desc: Discord token account scope marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bDiscord token\b.{0,100}\b(account|server|guild)\b'
