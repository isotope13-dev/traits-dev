# wechatauto-replica — WeChat 4.x Windows client automation and database reader library.
defaults:
  platforms: [windows, unix]
  for: [python, markdown, text, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: wechatauto package metadata name
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^Name:\s*wechatauto(-replica)?\b'

  - id: repository-url
    desc: wechatauto repository URL
    if:
      type: text
      substr: github.com/fanyuantaier/wechatauto-replica

  - id: source-path
    desc: wechatauto Python source path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])wechatauto[\\/][a-zA-Z0-9_]+\.py$'

  - id: wcdb-cipher-config-reference
    desc: WeChat WCDB cipher configuration reference
    for: [python]
    if:
      type: text
      substr: com.Tencent.WCDB.Config.Cipher

  - id: wechat-db-class-reference
    desc: WeChatDB class reference
    for: [python]
    if:
      type: text
      regex: '\bclass\s+WeChatDB\b'

composite_rules:
  - id: wechatauto-package-context
    desc: wechatauto WeChat client automation package context
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: repository-url

  - id: wechatauto-db-source-context
    desc: wechatauto WeChat database reader source context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: source-path
    any:
      - id: wcdb-cipher-config-reference
      - id: wechat-db-class-reference

  - id: wechatauto-context
    desc: wechatauto WeChat automation context
    crit: exception
    conf: 0.99
    any:
      - id: wechatauto-package-context
      - id: wechatauto-db-source-context
