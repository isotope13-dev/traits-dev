defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - markdown
  - text
  - pkginfo
  crit: notable
  conf: 0.98
traits:
- id: package-name
  desc: wechatauto package metadata name
  for:
  - pkginfo
  - text
  if:
    type: text
    regex: (?im)^Name:\s*wechatauto(-replica)?\b
- id: repository-url
  desc: wechatauto repository URL
  if:
    type: text
    substr: github.com/fanyuantaier/wechatauto-replica
- id: source-path
  desc: wechatauto Python source path
  for:
  - python
  if:
    type: path
    regex: (^|[\\/])wechatauto[\\/][a-zA-Z0-9_]+\.py$
- id: wcdb-cipher-config-reference
  desc: WeChat WCDB cipher configuration reference
  for:
  - python
  if:
    type: text
    substr: com.Tencent.WCDB.Config.Cipher
- id: wechat-db-class-reference
  desc: WeChatDB class reference
  for:
  - python
  if:
    type: text
    regex: \bclass\s+WeChatDB\b
