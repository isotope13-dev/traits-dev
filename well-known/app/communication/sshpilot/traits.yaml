# SSHPilot — GTK SSH client (https://github.com/mfat/sshpilot).
defaults:
  platforms: [linux]
  for: [python, deb, xml, text]
  crit: notable
  conf: 0.99

traits:
  - id: deb-package-name
    desc: SSHPilot Debian package name
    for: [deb]
    if:
      type: value
      path: deb.package
      exact: sshpilot

  - id: python-module
    desc: SSHPilot Python module path
    for: [python]
    if:
      type: text
      substr: sshpilot

  - id: appstream-id
    desc: SSHPilot AppStream application id
    for: [xml, text]
    if:
      type: text
      substr: io.github.mfat.sshpilot

  - id: github-repository
    desc: SSHPilot upstream GitHub repository
    for: [text, xml, python]
    if:
      type: text
      substr: github.com/mfat/sshpilot

composite_rules:
  - id: sshpilot-package-identity
    desc: Recognized SSHPilot SSH client package
    crit: notable
    conf: 0.99
    for: [deb, python]
    scope: archive
    all:
      - id: deb-package-name
      - id: python-module
