defaults:
  platforms: [unix, windows]
  size_min: 1
  size_max: 600000000

traits:
  - id: product-marker
    desc: Mattermost Desktop product marker
    crit: notable
    conf: 0.95
    for: [binaries, javascript, typescript, shell, package.json, json, desktop-entry]
    if:
      type: text
      regex: '(Mattermost Desktop|mattermost-desktop|app\.mattermost\.desktop)'

  - id: macos-app-bundle
    desc: Mattermost Desktop macOS app bundle
    crit: notable
    conf: 0.96
    for: [macho, binaries, javascript, archives, zip]
    if:
      type: path
      regex: 'Mattermost\.app[\\/]'
  - id: asar-resource
    desc: Mattermost Desktop asar resource
    crit: notable
    conf: 0.96
    for: [javascript, shell]
    size_max: 50000000
    if:
      type: basename
      regex: '^(create_desktop_file\.sh|[0-9]+_bundle\.js)$'

  - id: deb-package-name
    desc: Mattermost Desktop Debian package name
    crit: notable
    conf: 0.99
    platforms: [linux]
    for: [deb]
    if:
      type: value
      path: deb.package
      exact: mattermost-desktop

  - id: linux-opt-path
    desc: Mattermost Desktop Linux install path
    crit: notable
    conf: 0.97
    platforms: [linux]
    for: [deb, archives, elf]
    if:
      type: path
      regex: 'opt[\\/]Mattermost'
