# Athou/CommaFeed — self-hosted RSS reader (Quarkus + React).
defaults:
  platforms: [unix, windows]
  for: [java, xml]
  crit: notable
  conf: 0.99

traits:
  - id: maven-artifact
    desc: CommaFeed Maven artifactId
    for: [xml]
    if:
      type: text
      substr: <artifactId>commafeed</artifactId>

  - id: package-namespace
    desc: CommaFeed Java package namespace
    for: [java]
    if:
      type: text
      substr: package com.commafeed
