# Gtk-Gnutella — GUI Gnutella servent (gtk-gnutella.sourceforge.net).
# Sockets, UPnP port-mapping, mingw32 portability, and Configure are
# product P2P networking, not a backdoor.
defaults:
  platforms: [unix, windows]
  for: [rpm, text, c, shell, markdown]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: rpm-name
    desc: gtk-gnutella RPM package name
    for: [rpm]
    platforms: [linux]
    conf: 0.99
    if:
      type: value
      path: rpm.name
      exact: gtk-gnutella

  - id: rpm-url
    desc: gtk-gnutella SourceForge project URL
    for: [rpm]
    platforms: [linux]
    conf: 0.99
    if:
      type: value
      path: rpm.url
      substr: gtk-gnutella.sourceforge.net

  - id: sourceforge-url
    desc: gtk-gnutella SourceForge site
    for: [text, markdown, c, shell]
    if:
      type: text
      substr: gtk-gnutella.sourceforge.net

  - id: sourceforge-files
    desc: gtk-gnutella SourceForge files URL
    for: [text, shell]
    if:
      type: text
      substr: sourceforge.net/projects/gtk-gnutella

  - id: spec-basename
    desc: gtk-gnutella RPM spec basename
    for: [text]
    if:
      type: path
      basename: true
      exact: gtk-gnutella.spec

composite_rules:
  - id: gtk-gnutella-package
    desc: Gtk-Gnutella Gnutella client package
    crit: notable
    conf: 0.99
    for: [rpm]
    platforms: [linux]
    scope: outer
    any:
      - id: rpm-name
      - id: rpm-url
      - id: sourceforge-url
      - id: spec-basename
    needs: 2
