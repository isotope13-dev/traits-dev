# Yetibot core — Clojure chat-ops bot (yetibot/yetibot.core). The
# `agent` command shells out to Gemini CLI, gh, and git as product
# automation, not a dropper. Identity only; do not put javascript on
# the defaults (uberjar vendors webpack UI chunks).
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 50000000

traits:
  - id: pom-group
    desc: yetibot Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: yetibot

  - id: main-class
    desc: yetibot.core.init JAR main class
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.main_class
      exact: yetibot.core.init

  - id: github-repo
    desc: yetibot.core GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/yetibot/yetibot.core

  - id: defproject
    desc: yetibot/core Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject yetibot/core'

  - id: core-namespace-path
    desc: yetibot core namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)yetibot[\\/]core[\\/]'

  - id: agent-command-ns
    desc: yetibot agent command namespace
    for: [clojure]
    conf: 0.98
    if:
      type: text
      substr: yetibot.core.commands.agent

composite_rules:
  - id: yetibot-core-maven-library
    desc: yetibot core Clojure chat-ops library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: main-class
