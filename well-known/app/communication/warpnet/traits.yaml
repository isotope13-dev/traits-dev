# Warpnet -- decentralized, peer-to-peer serverless social network
# (github.com/Warp-net/warpnet).
# Bundles payment-engine binary for TRC20/USDT wallet transactions.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_max: 500000000

traits:
  - id: warpnet-repository-marker
    desc: Warpnet repository marker
    for: [go, text, markdown, json, shell, dockerfile, yaml, batch]
    if:
      type: text
      substr: "github.com/Warp-net/warpnet"

  - id: warpnet-source-path
    desc: Warpnet source archive path
    for: [binaries, source, scripts, text, data, manifests, zip, tar]
    if:
      type: path
      regex: 'github\.com[/\\]Warp-net[/\\]warpnet'

  - id: warpnet-payment-engine-path
    desc: Warpnet payment engine path
    for: [elf, binaries]
    if:
      type: path
      regex: 'core[/\\]wallet[/\\]payment-engine'

  - id: warpnet-payment-engine-wallet-types
    desc: Warpnet payment engine wallet types
    for: [elf, binaries]
    if:
      type: text
      substr: "WalletTransferResult"

composite_rules:
  - id: warpnet-payment-engine
    desc: Warpnet payment engine binary
    crit: notable
    conf: 0.98
    for: [elf, binaries]
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: warpnet-payment-engine-wallet-types
    any:
      - id: warpnet-payment-engine-path
      - id: warpnet-source-path
      - id: micro-behaviors/data/runtime/library::go-http-internals-present

  - id: warpnet-distribution
    desc: Recognized Warpnet decentralized network distribution
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: warpnet-repository-marker
      - id: warpnet-source-path
      - id: warpnet-payment-engine
