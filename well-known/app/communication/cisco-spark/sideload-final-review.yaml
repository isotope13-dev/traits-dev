defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: spark-launcher-dll-reference
    desc: Cisco Spark launcher DLL reference
    crit: notable
    conf: 0.95
    for:
      - pe
    if:
      type: text
      section: any
      exact: CiscoSparkLauncher.dll
  - id: spark-launcher-path-reference
    desc: Cisco Spark launcher path reference
    crit: notable
    conf: 0.95
    for:
      - pe
    if:
      type: text
      section: any
      exact: \CiscoSparkLauncher
  - id: spark-entry-point-reference
    desc: Cisco Spark entry-point reference
    crit: notable
    conf: 0.95
    for:
      - pe
      - dll
    if:
      type: text
      section: any
      exact: SparkEntryPoint

composite_rules:
  - id: spark-launcher-component-references
    desc: Cisco Spark launcher component references
    crit: notable
    conf: 0.95
    for: [pe]
    any:
      - id: well-known/app/communication/cisco-spark::spark-launcher-dll-reference
      - id: well-known/app/communication/cisco-spark::spark-launcher-path-reference
      - id: well-known/app/communication/cisco-spark::spark-entry-point-reference
    needs: 2
