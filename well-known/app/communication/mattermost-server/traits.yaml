# Mattermost Server — open-source team collaboration platform (Go).
#
# Test fixtures under tests/ include compressed import archives (e.g.
# Fake_Team_Import.rar) used by unit tests, not packed droppers.
defaults:
  platforms: [unix, windows]
  for: [zip, tar, go, rar, shell, javascript, text]
  conf: 0.99
  size_max: 500000000

traits:
  - id: go-module-identity
    desc: Mattermost server Go module path
    crit: notable
    for: [go, zip, tar, text]
    if:
      type: text
      substr: github.com/mattermost/mattermost-server

  - id: fake-team-import-fixture-name
    desc: Mattermost team import test RAR basename
    crit: notable
    for: [rar]
    if:
      type: basename
      exact: Fake_Team_Import.rar

composite_rules:
  - id: mattermost-server-source
    desc: Mattermost team collaboration server source
    crit: notable
    any:
      - id: go-module-identity
      - id: fake-team-import-fixture-name
