# Atom's Connections hosts its bundled PeerJS messaging UI on loopback and
# protects its generated device key with DPAPI. Identity is not an assertion
# of signature validity or benign deployment; retain its capability findings.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
  - id: product-name
    desc: Atom's Connections declared product name
    if:
      type: value
      path: pe.version.product_name
      exact: Atom's Connections

  - id: assembly-identity
    desc: Atom's Connections application manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: UltraEncode.AtomsConnections

composite_rules:
  - id: desktop-application
    desc: Atom's Connections loopback messaging application
    all:
      - id: product-name
      - id: assembly-identity
      - id: micro-behaviors/communications/http/server/managed::dotnet-loopback-http-listener
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-reference
