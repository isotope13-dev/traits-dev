# Signal Desktop is an Electron application. Chromium's accessibility and UI
# runtime installs keyboard hooks, samples keyboard state, creates worker
# threads, and carries ordinary cleartext diagnostic URLs. Those file-wide
# capabilities resemble a keylogger only when the verified product identity is
# ignored.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 500000000

traits:
  - id: signal-desktop-product-name
    desc: Signal Desktop product identity
    if:
      type: value
      path: pe.version.product_name
      exact: Signal

  - id: signal-messenger-company-name
    desc: Signal Messenger company identity
    if:
      type: value
      path: pe.version.company
      exact: Signal Messenger, LLC

composite_rules:
  - id: signal-desktop-verified-context
    desc: Verified Signal Desktop application
    crit: exception
    conf: 0.99
    all:
      - id: signal-desktop-product-name
      - id: signal-messenger-company-name

  - id: signal-desktop-verified-archive-context
    desc: Verified Signal Desktop archive
    crit: exception
    conf: 0.99
    scope: outer
    for: [pe, 7z, zip, tar, asar, nupkg]
    all:
      - id: signal-desktop-product-name
      - id: signal-messenger-company-name
