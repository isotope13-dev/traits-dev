---
defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 500000000
traits:
- id: signal-desktop-product-name
  desc: Signal Desktop product identity
  if:
    type: value
    path: pe.version.product_name
    exact: Signal
- id: signal-messenger-company-name
  desc: Signal Messenger company identity
  if:
    type: value
    path: pe.version.company
    exact: Signal Messenger, LLC
- id: signalapp-sqlcipher-path
  desc: Signal SQLCipher addon path
  crit: notable
  conf: 0.98
  if:
    type: path
    regex: "@signalapp([\\\\/]|\\\\+)sqlcipher"
composite_rules:
- id: signal-desktop-verified-archive-context
  desc: Signal Desktop version metadata
  crit: notable
  conf: 0.99
  scope: outer
  for:
  - pe
  - 7z
  - zip
  - tar
  - asar
  - nupkg
  all:
  - id: signal-desktop-product-name
  - id: signal-messenger-company-name
