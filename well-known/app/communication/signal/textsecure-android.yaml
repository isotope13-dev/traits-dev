defaults:
  platforms:
  - android
  crit: notable
  conf: 0.99
traits:
- id: textsecure-manifest-package
  desc: TextSecure Android manifest package
  for:
  - xml
  - data
  if:
    type: text
    regex: package\s*=\s*"org\.thoughtcrime\.securesms"
- id: textsecure-source-namespace
  desc: TextSecure Java source namespace
  for:
  - java
  - kotlin
  if:
    type: text
    regex: (?m)^\s*package\s+org\.thoughtcrime\.securesms[\w.]*\s*;
- id: textsecure-source-path
  desc: TextSecure source tree path
  for:
  - java
  - kotlin
  - xml
  - text
  - zip
  - source
  conf: 0.95
  if:
    type: path
    regex: '(?i)(^|[/\\])(textsecure|securesms)([-@/\\]|$)'
composite_rules:
- id: textsecure-client-context
  desc: TextSecure / Signal Android messaging client context
  crit: exception
  conf: 0.99
  scope: outer
  any:
    - id: textsecure-manifest-package
    - id: textsecure-source-namespace
    - id: textsecure-source-path
