# TextSecure is WhisperSystems' open-source private messenger (the predecessor
# of today's Signal Android). An SMS client of its kind necessarily declares
# the SEND/RECEIVE/READ SMS permission cluster, so the cluster alone says
# nothing about this product. The Android manifest `package` attribute and the
# Java source namespace are format-mandated identity, not attacker-chosen
# labels: an app that renames them away is no longer TextSecure.
defaults:
  platforms: [android]
  crit: notable
  conf: 0.99

traits:
  - id: textsecure-manifest-package
    desc: TextSecure Android manifest package
    for: [xml, data]
    if:
      type: text
      regex: 'package\s*=\s*"org\.thoughtcrime\.securesms"'

  - id: textsecure-source-namespace
    desc: TextSecure Java source namespace
    for: [java, kotlin]
    if:
      type: text
      regex: '(?m)^\s*package\s+org\.thoughtcrime\.securesms[\w.]*\s*;'

composite_rules:
  - id: textsecure-android-archive-context
    desc: TextSecure Android source archive
    crit: exception
    scope: outer
    for: [zip, tar, xml, data, java, kotlin]
    all:
      - id: textsecure-manifest-package
      - id: textsecure-source-namespace
