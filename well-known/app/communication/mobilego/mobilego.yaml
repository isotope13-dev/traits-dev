# Wondershare MobileGo -- a commercial Android phone-manager suite (device
# cleanup, app install/uninstall, SMS/contacts/call-log backup, WiFi daemon).
# Its feature surface (SMS read/send, overlays, accessibility cleanup, shared
# storage deletion, package management) satisfies several SMS-banker and
# wiper capability composites; the vendor-signed manifest identity below is
# the benign context for those findings, mirroring the SmsForwarder and
# android-incallui exclusions.
defaults:
  platforms: [android]
  for: [apk, zip, xml, dex]
  crit: baseline
  conf: 0.99

traits:
  - id: mobilego-package
    desc: MobileGo Android package name
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.wondershare.mobilego"

  - id: mobilego-manifest-application-class
    desc: MobileGo application class in manifest
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.wondershare.mobilego.GlobalApp"

  - id: mobilego-sms-daemon-action
    desc: MobileGo SMS daemon action in manifest
    crit: notable
    conf: 0.98
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.wondershare.mobilego.daemon.sms.setted.HeadlessSmsSendService"

  - id: mobilego-application-class
    desc: MobileGo application class in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcom/wondershare/mobilego/GlobalApp;"

  - id: mobilego-wifi-daemon-class
    desc: MobileGo WiFi daemon class in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcom/wondershare/mobilego/AndroidDaemonWifi;"

composite_rules:
  - id: mobilego-manifest-identity
    desc: MobileGo manifest package and application identity
    crit: exception
    conf: 0.995
    for: [xml]
    all:
      - id: mobilego-package
      - id: mobilego-manifest-application-class

  - id: mobilego-dex-identity
    desc: MobileGo application and WiFi daemon classes in DEX
    crit: exception
    conf: 0.995
    for: [dex]
    all:
      - id: mobilego-application-class
      - id: mobilego-wifi-daemon-class
