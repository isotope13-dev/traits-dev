# SimpleX Chat — open-source private messenger (github.com/simplex-chat/simplex-chat).
# It has no push provider: the Android app keeps a foreground service alive,
# asks the user to exempt it from battery optimisation, and posts rich
# notifications. Hiding the user-profile flag (`user.hidden`) and swapping
# launcher icon aliases are app features, not concealment.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 20000000

traits:
  - id: simplex-chat-android-package-declaration
    desc: SimpleX Chat Android package declaration
    for: [kotlin, java]
    platforms: [android]
    if:
      type: text
      regex: '(?m)^package chat\.simplex\.(app|common)\b'

  - id: simplex-chat-repository-reference
    desc: SimpleX Chat repository reference
    for: [markdown, text, shell, json, kotlin, swift]
    platforms: [android, unix, windows]
    if:
      type: text
      substr: github.com/simplex-chat/simplex-chat

composite_rules:
  - id: simplex-chat-source-tree
    desc: SimpleX Chat client source tree
    crit: exception
    conf: 0.98
    scope: archive
    all:
      - id: simplex-chat-android-package-declaration
      - id: simplex-chat-repository-reference
