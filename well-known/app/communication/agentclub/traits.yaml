# agentclub — Slack-like chat server for humans and AI agents.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name agentclub
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*agentclub\s*$'

  - id: agentclub-github-repo
    desc: dantezhu/agentclub GitHub repository URL
    if:
      type: text
      substr: dantezhu/agentclub

  - id: flask-socketio-app-module
    desc: Flask SocketIO agentclub application module
    for: [python]
    if:
      type: text
      substr: flask_socketio import SocketIO

composite_rules:
  - id: agentclub-package
    desc: Agent Club IM server for humans and agents
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: agentclub-github-repo
      - id: flask-socketio-app-module
