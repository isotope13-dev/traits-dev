# agentclub — Slack-like chat server for humans and AI agents.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name agentclub
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*agentclub\s*$'

  - id: agentclub-github-repo
    desc: dantezhu/agentclub GitHub repository URL
    if:
      type: text
      substr: dantezhu/agentclub

  - id: nanobot-channel-package-name
    desc: PyPI package name nanobot-channel-agentclub
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*nanobot-channel-agentclub\s*$'

  - id: nanobot-channel-entry-point
    desc: Agent Club Nanobot channel entry point
    for: [text]
    if:
      type: text
      substr: 'agentclub = nanobot_channel_agentclub:AgentClubChannel'

  - id: nanobot-channel-source-module
    desc: Agent Club Nanobot channel source module
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])nanobot_channel_agentclub[\\/]channel\.py$'

  - id: flask-socketio-app-module
    desc: Flask SocketIO agentclub application module
    for: [python]
    if:
      type: text
      substr: flask_socketio import SocketIO

composite_rules:
  - id: agentclub-package
    desc: Agent Club IM server for humans and agents
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: agentclub-github-repo
      - id: flask-socketio-app-module

  - id: nanobot-channel-package
    desc: Agent Club Nanobot channel package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: nanobot-channel-package-name
    any:
      - id: agentclub-github-repo
      - id: nanobot-channel-entry-point
      - id: nanobot-channel-source-module
