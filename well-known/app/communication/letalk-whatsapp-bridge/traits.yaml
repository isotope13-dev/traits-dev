# Letalk WhatsApp Bridge exports the user's WhatsApp Web session to Letalk's
# first-party passkey-bridge API after explicit user action. Keep extraction
# visible while using manifest identity and protocol as context for theft rules.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Letalk WhatsApp Bridge manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Letalk WhatsApp Bridge

  - id: manifest-description
    desc: Letalk WhatsApp Web session bridge description
    for: [chrome-manifest]
    if:
      type: value
      path: description
      substr: WhatsApp Web ao Letalk

  - id: service-host
    desc: Letalk WhatsApp channel API host
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      exact: apdot.letalk.com.br

  - id: integration-protocol
    desc: Letalk passkey bridge session import path
    for: [javascript, typescript]
    if:
      type: text
      substr: /whatsapp/passkey-bridge/import

composite_rules:
  - id: bridge-script-context
    desc: Letalk passkey bridge implementation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: service-host
      - id: integration-protocol

  - id: disclosed-integration-context
    desc: Letalk disclosed WhatsApp bridge context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-description
      - id: service-host
      - id: integration-protocol
      - id: metadata/permission/host::host-permission-im-web-app
