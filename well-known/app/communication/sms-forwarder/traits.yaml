defaults:
  platforms: [android]
  for: [apk]
  crit: baseline
  conf: 0.99

traits:
  - id: smsforwarder-package
    desc: SmsForwarder Android package name
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "cn.ppps.forwarder"

  - id: smsforwarder-manifest-application-class
    desc: SmsForwarder application class in manifest
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "cn.ppps.forwarder.App"

  - id: smsforwarder-application-class
    desc: SmsForwarder application class
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcn/ppps/forwarder/App;"

  - id: smsforwarder-sms-api-controller
    desc: SmsForwarder local SMS API controller
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcn/ppps/forwarder/server/controller/SmsController;"

  - id: smsforwarder-call-api-controller
    desc: SmsForwarder local call-log API controller
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcn/ppps/forwarder/server/controller/CallController;"

  - id: smsforwarder-contact-api-controller
    desc: SmsForwarder local contacts API controller
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcn/ppps/forwarder/server/controller/ContactController;"

  - id: smsforwarder-source-package
    desc: SmsForwarder source package namespace
    crit: notable
    conf: 0.99
    for: [java, kotlin]
    if:
      type: text
      regex: '(?m)^\s*package\s+cn\.ppps\.forwarder(\.[A-Za-z_][A-Za-z0-9_]*)?\s*$'

  - id: smsforwarder-source-frp-binding
    desc: SmsForwarder FRP Java binding reference
    crit: notable
    conf: 0.98
    for: [java, kotlin]
    if:
      type: text
      word: Frpclib

composite_rules:
  - id: smsforwarder-application
    desc: SmsForwarder Android application identity
    crit: notable
    conf: 0.995
    for: [android_apk, zip, xml, dex]
    scope: outer
    all:
      - id: smsforwarder-package
      - id: smsforwarder-application-class

  - id: smsforwarder-manifest-identity
    desc: SmsForwarder manifest package and application identity
    crit: exception
    conf: 0.995
    for: [xml]
    all:
      - id: smsforwarder-package
      - id: smsforwarder-manifest-application-class

  - id: smsforwarder-dex-communication-features
    desc: SmsForwarder DEX communication API implementation
    crit: exception
    conf: 0.995
    for: [dex]
    all:
      - id: smsforwarder-application-class
      - id: smsforwarder-sms-api-controller
      - id: smsforwarder-call-api-controller
      - id: smsforwarder-contact-api-controller

  - id: smsforwarder-source-application
    desc: SmsForwarder Android source identity
    crit: notable
    conf: 0.995
    scope: outer
    for: [zip, tar, java, kotlin]
    all:
      - id: smsforwarder-source-package
      - id: smsforwarder-source-frp-binding

  - id: smsforwarder-source-battery-context
    desc: SmsForwarder source battery keep-alive context
    crit: exception
    conf: 0.995
    for: [java, kotlin]
    all:
      - id: smsforwarder-source-package
      - id: micro-behaviors/os/privilege/check::android-battery-optimization-status
      - id: micro-behaviors/os/privilege/check::android-request-ignore-battery-action
      - id: micro-behaviors/os/message/intent::android-start-activity
