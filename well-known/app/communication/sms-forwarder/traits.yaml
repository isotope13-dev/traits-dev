defaults:
  platforms: [android]
  for: [apk]
  crit: baseline
  conf: 0.99

traits:
  - id: smsforwarder-package
    desc: SmsForwarder Android package name
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "cn.ppps.forwarder"

  - id: smsforwarder-application-class
    desc: SmsForwarder application class
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "Lcn/ppps/forwarder/App;"

  - id: smsforwarder-source-package
    desc: SmsForwarder source package namespace
    crit: notable
    conf: 0.99
    for: [java, kotlin]
    if:
      type: text
      regex: '(?m)^\s*package\s+cn\.ppps\.forwarder(\.[A-Za-z_][A-Za-z0-9_]*)?\s*$'

  - id: smsforwarder-source-frp-binding
    desc: SmsForwarder FRP Java binding reference
    crit: notable
    conf: 0.98
    for: [java, kotlin]
    if:
      type: text
      word: Frpclib

composite_rules:
  - id: smsforwarder-application
    desc: SmsForwarder Android application identity
    crit: notable
    conf: 0.995
    scope: outer
    all:
      - id: smsforwarder-package
      - id: smsforwarder-application-class

  - id: smsforwarder-source-application
    desc: SmsForwarder Android source identity
    crit: notable
    conf: 0.995
    scope: outer
    for: [zip, tar]
    all:
      - id: smsforwarder-source-package
      - id: smsforwarder-source-frp-binding

  - id: smsforwarder-source-battery-context
    desc: SmsForwarder source battery keep-alive context
    crit: exception
    conf: 0.995
    for: [java, kotlin]
    all:
      - id: smsforwarder-source-package
      - id: micro-behaviors/os/privilege/check::android-battery-optimization-status
      - id: micro-behaviors/os/privilege/check::android-request-ignore-battery-action
      - id: micro-behaviors/os/message/intent::android-start-activity
