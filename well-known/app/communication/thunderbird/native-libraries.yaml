defaults:
  crit: notable
  conf: 0.99
  platforms: [linux]
  for: [elf, so]
  size_max: 50000000

traits:
  - id: firefox-mozinference-basename
    desc: Firefox Mozilla inference library basename
    if:
      type: basename
      exact: libmozinference.so

  - id: firefox-mozinference-firefox-path
    desc: Firefox Mozilla inference library path
    if:
      type: path
      regex: '(?i)[\\/]firefox(-[a-z0-9-]+)?[\\/]libmozinference\.so$'

  - id: firefox-mozinference-backend-export
    desc: Mozilla inference llama or ggml backend export
    if:
      type: export
      regex: '^(llama|ggml)_[A-Za-z0-9_]+$'

composite_rules:
  - id: firefox-mozinference-library
    desc: Firefox Mozilla inference library
    all:
      - id: firefox-mozinference-basename
      - id: firefox-mozinference-firefox-path
      - id: firefox-mozinference-backend-export
