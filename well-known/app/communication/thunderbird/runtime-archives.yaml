defaults:
  platforms: [linux, macos, windows]
  for: [zip]
  crit: baseline
  conf: 0.98

traits:
  - id: librewolf-directory-path
    desc: LibreWolf directory path
    crit: component
    if:
      type: path
      regex: '(?i)[\\/]librewolf[\\/]'

  - id: librewolf-omni-basename
    desc: LibreWolf omni archive basename
    crit: component
    if:
      type: basename
      exact: omni.ja

  - id: firefox-omni-runtime-path
    desc: Firefox omni runtime archive path
    crit: baseline
    conf: 0.99
    for: [zip, vbs]
    if:
      type: path
      regex: '(?i)[\\/]firefox(-[a-z0-9-]+)?[^\r\n]{0,48}[\\/]omni\.ja$'

  - id: firefox-omni-hidden-run-context
    desc: Firefox omni hidden-run wrapper context
    crit: notable
    conf: 0.99
    for: [vbs]
    if:
      id: firefox-omni-runtime-path

  - id: firefox-omni-root-manifest
    desc: Firefox omni root chrome manifest
    if:
      type: value
      path: "archive.members[*].path"
      exact: chrome.manifest

  - id: firefox-omni-components-manifest
    desc: Firefox omni components manifest
    if:
      type: value
      path: "archive.members[*].path"
      exact: components/components.manifest

  - id: firefox-omni-aboutlogins-ui
    desc: Firefox omni about logins UI
    if:
      type: value
      path: "archive.members[*].path"
      exact: chrome/browser/content/browser/aboutlogins/components/input-field/login-password-field.mjs

  - id: firefox-omni-devtools-netmonitor
    desc: Firefox omni DevTools netmonitor module
    if:
      type: value
      path: "archive.members[*].path"
      exact: chrome/devtools/modules/devtools/client/netmonitor/src/connector/firefox-data-provider.js

  - id: firefox-chrome-migration-utils-module
    desc: Firefox Chrome migration utility module
    for: [javascript]
    if:
      type: basename
      exact: ChromeMigrationUtils.sys.mjs

  - id: firefox-chrome-profile-migrator-module
    desc: Firefox Chrome profile migrator module
    for: [javascript]
    if:
      type: basename
      exact: ChromeProfileMigrator.sys.mjs

  - id: firefox-pip-site-overrides
    desc: Firefox picture-in-picture site overrides
    crit: notable
    for: [javascript]
    if:
      type: basename
      exact: picture_in_picture_overrides.js

  - id: firefox-devtools-storage-actor
    desc: Firefox DevTools storage actor module
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'devtools/server/actors/resources/storage'

composite_rules:
  - id: librewolf-omni-runtime-path
    desc: LibreWolf omni runtime archive
    crit: notable
    conf: 0.99
    all:
      - id: librewolf-directory-path
      - id: librewolf-omni-basename

  - id: firefox-omni-runtime-archive
    desc: Firefox omni runtime archive
    crit: baseline
    conf: 0.99
    all:
      - id: firefox-omni-runtime-path
      - id: firefox-omni-root-manifest
      - id: firefox-omni-components-manifest
    any:
      - id: firefox-omni-aboutlogins-ui
      - id: firefox-omni-devtools-netmonitor
