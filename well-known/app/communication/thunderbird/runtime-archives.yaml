defaults:
  platforms: [linux, macos, windows]
  for: [zip]
  crit: baseline
  conf: 0.98

traits:
  - id: librewolf-directory-path
    desc: LibreWolf directory path
    crit: notable
    if:
      type: path
      regex: '(?i)[\\/]librewolf[\\/]'

  - id: librewolf-omni-basename
    desc: LibreWolf omni archive basename
    crit: notable
    if:
      type: basename
      exact: omni.ja

  - id: firefox-omni-runtime-path
    desc: Path matches Firefox omni archive
    crit: notable
    conf: 0.99
    for: [zip, odf, vbs]
    if:
      type: path
      regex: '(?i)[\\/]firefox(-[a-z0-9-]+)?[^\r\n]{0,48}[\\/]omni\.ja$'

  # Portable and release Thunderbird trees ship the same Gecko omni.ja under
  # Thunderbird/ or Thunderbird64/; magic often types the archive as odf.
  - id: thunderbird-omni-runtime-path
    desc: Thunderbird omni runtime archive path
    crit: notable
    conf: 0.99
    for: [zip, odf, vbs]
    if:
      type: path
      regex: '(?i)[\\/]thunderbird(64)?[\\/]omni\.ja$'

  - id: firefox-omni-hidden-run-context
    desc: Firefox omni hidden-run wrapper context
    crit: notable
    conf: 0.99
    for: [vbs]
    if:
      id: firefox-omni-runtime-path

  - id: firefox-pip-site-overrides
    desc: Firefox picture-in-picture site overrides
    crit: notable
    for: [javascript]
    if:
      type: basename
      exact: picture_in_picture_overrides.js

  - id: firefox-devtools-storage-actor
    desc: Firefox DevTools storage actor module
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'devtools/server/actors/resources/storage'

composite_rules:
  - id: librewolf-omni-runtime-path
    desc: LibreWolf omni runtime archive
    crit: notable
    conf: 0.99
    all:
      - id: librewolf-directory-path
      - id: librewolf-omni-basename

  - id: firefox-omni-runtime-archive
    desc: Firefox omni runtime archive
    crit: notable
    conf: 0.99
    all:
      - id: firefox-omni-runtime-path
      - id: metadata/archive/member/filename::chrome-manifest-member
      - id: metadata/archive/member/path::components-manifest-member
    any:
      - id: metadata/archive/member/path::aboutlogins-password-field-member
      - id: metadata/archive/member/path::devtools-netmonitor-provider-member

  - id: thunderbird-omni-runtime-archive
    desc: Thunderbird omni runtime archive
    crit: notable
    conf: 0.99
    for: [zip, odf]
    all:
      - id: thunderbird-omni-runtime-path
      - id: metadata/archive/member/filename::chrome-manifest-member
