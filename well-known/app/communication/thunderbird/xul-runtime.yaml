# Thunderbird's Gecko/XUL engine (xul.dll) and launcher (thunderbird.exe)
# embed the same moz_* SQL and NT memory APIs that stealers copy. Product
# metadata distinguishes signed Mozilla Thunderbird components.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 400000000

traits:
  - id: thunderbird-xul-product-name
    desc: Thunderbird product name in PE version
    if:
      type: value
      path: pe.version.product_name
      exact: Thunderbird

  - id: thunderbird-exe-original-filename
    desc: thunderbird.exe original filename metadata
    size_max: 5000000
    if:
      type: value
      path: pe.version.original_filename
      exact: thunderbird.exe

composite_rules:
  - id: thunderbird-xul-runtime
    desc: Thunderbird XUL/Gecko runtime library
    size_min: 1000000
    all:
      - id: thunderbird-xul-product-name
      - id: well-known/lib/runtime/mozilla-xul::xul-original-filename
      - id: metadata/signed/leaf::mozilla-corporation

  - id: thunderbird-application-runtime
    desc: Thunderbird application executable
    size_max: 5000000
    all:
      - id: thunderbird-xul-product-name
      - id: thunderbird-exe-original-filename
      - id: metadata/signed/leaf::mozilla-corporation

  # Any Mozilla-signed PE that declares Thunderbird as ProductName — covers
  # thunderbird.exe, xul.dll, plugin-container.exe, and sibling helpers.
  - id: thunderbird-mozilla-signed-component
    desc: Mozilla-signed Thunderbird product component
    all:
      - id: thunderbird-xul-product-name
      - id: metadata/signed/leaf::mozilla-corporation
