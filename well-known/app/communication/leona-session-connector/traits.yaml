# Leona Session Connector is a disclosed WhatsApp-to-UAZAPI migration tool.
# It exports live WhatsApp Web credentials by design after the user supplies
# an instance URL and token.  Keep the sensitive capabilities visible, while
# using its identity and first-party protocol as context for theft rules.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Leona Session Connector manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Leona Session Connector

  - id: manifest-description
    desc: Leona WhatsApp session bridge description
    for: [chrome-manifest]
    if:
      type: value
      path: description
      substr: sessão autenticada do WhatsApp Web

  - id: service-host
    desc: Leona UAZAPI service domain
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      exact: uazapi.com

  - id: integration-protocol
    desc: Leona WhatsApp session import endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: /instance/import-web-session

composite_rules:
  - id: bridge-script-context
    desc: Leona session bridge implementation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: service-host
      - id: integration-protocol

  - id: disclosed-integration-context
    desc: Leona disclosed WhatsApp bridge context
    crit: exception
    conf: 0.99
    for: [crx, archives]
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-description
      - id: service-host
      - id: integration-protocol
      - id: metadata/permission/host::host-permission-im-web-app
