# dankmail — keyboard-driven Linux email triage system (Go daemon dmail + Quickshell UI).
defaults:
  platforms: [unix, windows]
  size_min: 1
  size_max: 268435456
  crit: notable
  conf: 0.98

traits:
  - id: package-path
    desc: dankmail Go subpackage path
    for: [pe, elf, macho, go, text]
    conf: 0.98
    if:
      type: text
      regex: 'github\.com/arqueon/dankmail(/v[0-9]+)?/[A-Za-z0-9_.-]+'

  - id: archive-path
    desc: dankmail source or package directory
    for: [text, shell, go, scripts, tar, zip, elf]
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[/\\])dankmail([/\\]|-|$)'

  - id: daemon-usage
    desc: dmail daemon management string
    for: [elf, macho, pe, go, text]
    conf: 0.97
    if:
      type: text
      substr: 'dmail daemon'

composite_rules:
  - id: dankmail-email-client-context
    desc: dankmail email triage client
    crit: exception
    conf: 0.98
    any:
      - id: package-path
      - id: archive-path
      - id: daemon-usage
