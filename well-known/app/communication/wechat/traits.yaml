defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.95
  size_min: 500000
traits:
  - id: wechat-product-name
    crit: notable
    desc: WeChat product name in PE version metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^wechat$'
  - id: tencent-company-name
    crit: notable
    desc: Tencent company name in PE version metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^tencent'
composite_rules:
  # Stock WeChat desktop executable and engine DLL. The Tencent signer claim
  # distinguishes the vendor binary from a copy that only repeats its strings.
  - id: official-wechat-binary
    desc: Tencent-signed WeChat desktop binary identity
    crit: notable
    conf: 0.95
    all:
      - id: wechat-product-name
      - id: tencent-company-name
      - id: metadata/signature/claim/certificate::tencent-technology-chain-name
  # Resource-only WeChat modules ship unsigned resource DLLs with the same
  # product and company metadata; identity alone is the strongest available claim.
  - id: wechat-module-identity
    desc: WeChat resource module product and company metadata
    crit: notable
    conf: 0.9
    all:
      - id: wechat-product-name
      - id: tencent-company-name
