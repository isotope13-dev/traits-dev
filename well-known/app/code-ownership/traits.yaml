# code_ownership — Gusto/rubyatscale monorepo code ownership gem.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, archives, markdown, text]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: code-ownership-gem-name
    desc: code_ownership Ruby gem archive name
    crit: notable
    if:
      type: path
      regex: '(?i)code_ownership-.*\.gem$'

  - id: code-ownership-gemspec-name
    desc: code_ownership gem specification name
    for: [gem]
    if:
      type: text
      regex: '(?i)^name:\s*code_ownership\s*$'

  - id: code-ownership-module-marker
    desc: CodeOwnership Ruby module marker
    for: [ruby]
    crit: notable
    if:
      type: text
      substr: "module CodeOwnership"

composite_rules:
  - id: code-ownership-ruby-gem
    desc: Gusto code ownership declaration gem
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: code-ownership-gem-name
      - id: code-ownership-gemspec-name
      - id: code-ownership-module-marker
