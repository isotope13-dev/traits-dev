# Red programming language (red-lang.org) — compiled View GUI runtime. Red
# statically links clipboard, GDI/PrintWindow, keyboard-state, HTTP and
# process-creation APIs into every binary; that surface is expected toolchain
# behavior, not surveillance malware.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 500000
  size_max: 10000000
  crit: notable
  conf: 0.99

traits:
  - id: red-gui-console-description
    desc: Red GUI Console PE description
    if:
      type: value
      path: pe.version.description
      exact: Red GUI Console

  - id: red-foundation-copyright
    desc: Red Foundation PE copyright
    if:
      type: value
      path: pe.version.copyright
      substr: Red Foundation

  - id: static-red-lang-build-path
    desc: Official static.red-lang.org build path
    if:
      type: text
      section: .rdata
      substr: static.red-lang.org/dl/

  - id: red-view-basename
    desc: Red View GUI executable basename
    if:
      type: basename
      regex: '^red-view-.+\\.exe$'
      case_insensitive: true

composite_rules:
  - id: red-view-gui-runtime
    desc: Red View GUI language runtime
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/compiled::red-compiled-binary
      - id: red-gui-console-description
    any:
      - id: static-red-lang-build-path
      - id: red-view-basename
      - id: red-foundation-copyright
