# RealVNC Server's vncinitconfig setup utility.  The utility intentionally
# writes service, PAM, firewall, and startup configuration on supported hosts;
# this identity lets persistence rules distinguish that installer context.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 1000000

traits:
  - id: server-setup-banner
    desc: RealVNC Server setup utility banner
    if:
      type: text
      substr: VNC® Server Setup Utility

  - id: publisher-credit
    desc: RealVNC publisher credit
    if:
      type: text
      substr: RealVNC Ltd.

composite_rules:
  - id: realvnc-setup-utility
    desc: RealVNC Server setup utility
    crit: notable
    conf: 0.99
    all:
      - id: server-setup-banner
      - id: publisher-credit
