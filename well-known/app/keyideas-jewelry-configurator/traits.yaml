# Keyideas Jewelry Configurator is a WordPress plugin that embeds the
# vendor-hosted 3D configurator in an iframe.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-header
    desc: Keyideas Jewelry Configurator header
    if:
      type: text
      regex: '(?im)^\*\s*Plugin Name:\s*Keyideas Jewelry Configurator\s*$'

  - id: configurator-endpoint
    desc: Keyideas hosted configurator endpoint
    if:
      type: text
      substr: https://jewelry-configurator-app-44j3g.kinsta.app/

  - id: shortcode
    desc: Keyideas configurator shortcode
    if:
      type: text
      substr: kijs_configurator

composite_rules:
  - id: keyideas-jewelry-configurator-plugin
    desc: Keyideas Jewelry Configurator WordPress plugin
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-header
      - id: configurator-endpoint
      - id: shortcode
