# PushProspect is a disclosed LinkedIn/WhatsApp prospecting service. Its
# extension intentionally transfers the user's LinkedIn session material to
# pushprospect.com so the service can automate outreach from that account.
# Keep that authorized integration distinct from unrelated browser stealers.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: PushProspect LinkedIn extension name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: PushProspect – LinkedIn Connect

  - id: manifest-description
    desc: PushProspect account-connection description
    for: [chrome-manifest]
    if:
      type: value
      path: description
      substr: Connectez vos comptes LinkedIn et WhatsApp à PushProspect

  - id: service-host
    desc: PushProspect service host
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https://pushprospect\.com\b'

  - id: integration-protocol
    desc: PushProspect LinkedIn integration protocol
    for: [javascript, typescript]
    if:
      type: text
      regex: '(linkedin/accounts/(connect-cookie|refresh-cookie|resolve)|cdp-relay\?token=)'

  - id: linkedin-host-permission
    desc: PushProspect LinkedIn host permission
    for: [chrome-manifest]
    if:
      type: value
      path: host_permissions
      regex: 'linkedin\.com'

composite_rules:
  - id: disclosed-integration-context
    desc: PushProspect disclosed LinkedIn integration context
    crit: exception
    conf: 0.99
    for: [crx, archives]
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-description
      - id: service-host
      - id: integration-protocol
      - id: linkedin-host-permission
      - id: metadata/permission/cookie::permission-cookies
