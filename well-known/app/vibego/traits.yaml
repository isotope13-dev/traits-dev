# vibego is a Telegram-driven remote CLI for Codex/Claude/Gemini/Copilot.
defaults:
  platforms: [unix]
  for: [python, pkginfo, markdown, text, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: vibego PyPI package identity
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: vibego

  - id: wheel-distribution
    desc: vibego wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: vibego

  - id: config-directory
    desc: vibego config directory path
    for: [python, markdown, shell, text]
    if:
      type: text
      substr: ~/.config/vibego

  - id: master-bot-module
    desc: vibego Telegram master bot module
    for: [python]
    if:
      type: text
      substr: ALLOWED_CHAT_ID

  - id: product-summary
    desc: vibego Telegram CLI product summary
    for: [pkginfo, markdown, text]
    if:
      type: text
      regex: '(?i)vibego.{0,120}telegram.{0,120}(master bot|vibe coding|AI CLI)'

composite_rules:
  - id: telegram-remote-cli-context
    desc: vibego Telegram remote CLI tool context
    crit: exception
    conf: 0.99
    for: [whl, python]
    scope: archive
    any:
      - id: package-name
      - id: wheel-distribution
      - id: config-directory
      - id: master-bot-module
      - id: product-summary
