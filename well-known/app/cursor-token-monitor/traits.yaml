defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Cursor Token Monitor package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cursor-token-monitor

  - id: upstream-repository
    desc: Cursor Token Monitor repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: https://github.com/ahmed404abd/cursor-token-monitor.git

  - id: cursor-usage-api-host
    desc: Cursor usage API host
    for: [javascript]
    if:
      type: text
      substr: api2.cursor.sh

  - id: auth-helper-script
    desc: Cursor monitor auth helper script reference
    for: [javascript]
    if:
      type: text
      substr: read_cursor_auth.py

  - id: monitor-config-namespace
    desc: Cursor monitor configuration namespace
    for: [javascript]
    if:
      type: text
      substr: cursorTokenMonitor

composite_rules:
  - id: cursor-token-monitor-context
    desc: Recognized Cursor monitor auth-reader context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository
      - id: auth-helper-script
      - id: monitor-config-namespace
