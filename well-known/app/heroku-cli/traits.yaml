defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Heroku CLI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: heroku

  - id: upstream-repository
    desc: Heroku CLI upstream repository
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(^|[/.:])heroku/cli(\.git)?$'

  - id: command-package-name
    desc: Heroku CLI command package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@heroku-cli/command'

  - id: command-upstream-repository
    desc: Heroku CLI command upstream repository
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(^|[/.:])heroku/heroku-cli-command(\.git)?$'

  - id: runtime-path
    desc: Heroku CLI runtime path
    for: [javascript]
    if:
      type: path
      regex: 'heroku[/\\]dist'

  - id: command-package-path
    desc: Heroku CLI command package path
    if:
      type: path
      regex: 'heroku-cli[/\\]command'

  - id: heroku-api-error-symbol
    desc: HerokuAPIError class identifier
    for: [javascript]
    if:
      type: text
      substr: HerokuAPIError

  - id: command-debug-namespace
    desc: heroku-cli-command debug namespace
    for: [javascript]
    if:
      type: text
      substr: heroku-cli-command

  - id: command-user-agent
    desc: heroku-cli user-agent product token
    for: [javascript]
    if:
      type: text
      substr: 'heroku-cli/'

composite_rules:
  - id: official-package
    desc: Official Heroku CLI package identity
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository

  - id: official-command-package
    desc: Official Heroku CLI command package identity
    crit: exception
    for: [npm, package.json, javascript]
    scope: outer
    all:
      - id: command-package-name
      - id: command-upstream-repository
    any:
      - id: command-package-path
      - id: heroku-api-error-symbol
      - id: command-debug-namespace
      - id: command-user-agent
