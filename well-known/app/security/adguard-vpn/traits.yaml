# AdGuard VPN for Windows components.  These are signed application modules,
# not generic exemptions for service, crypto, or resource APIs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 2000000000

traits:
  - id: authenticode-signer
    desc: Adguard Software Limited Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)^CN=Adguard Software Limited(,|$)'

  - id: vpn-product-metadata
    desc: AdGuard VPN Windows product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^(AdGuardVPN|Adguard VPN( libraries)? for Windows)$'

  - id: utils-product-metadata
    desc: AdGuard utility product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^AdGuard Utils( UI)?$'

  - id: base-utils-product-metadata
    desc: AdGuard base utility product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: AdGuard Base Utils

  - id: vendor-company-metadata
    desc: Adguard Software company metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Adguard Software (Limited|Ltd\.?)$'

  - id: component-original-filename
    desc: AdGuard Windows component original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^Adguard(\.|Vpn)'

composite_rules:
  - id: verified-component
    desc: Verified AdGuard VPN Windows component
    all:
      - id: authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: vendor-company-metadata
    any:
      - id: vpn-product-metadata
      - id: utils-product-metadata
      - id: base-utils-product-metadata
      - id: component-original-filename

  # This exception is intentionally narrow: a valid Adguard signer and the
  # matching product version metadata are both required on the same PE.
  - id: benign-context
    desc: Verified AdGuard VPN Windows component context
    crit: exception
    all:
      - id: authenticode-signer
      - id: metadata/signed/leaf::adguard-software-limited
      - id: vendor-company-metadata
    any:
      - id: vpn-product-metadata
      - id: utils-product-metadata
      - id: base-utils-product-metadata
      - id: component-original-filename
