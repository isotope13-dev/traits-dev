defaults:
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576

traits:
  - id: securityctrl-package-repository
    desc: Aikido SecurityCtrl package repository host
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: dependencies.*
      regex: '^https://repo\.securityctrl\.com/'

  - id: securityctrl-callback-domain
    desc: Aikido SecurityCtrl callback domain
    crit: notable
    conf: 0.99
    for: [scripts]
    if:
      type: text
      substr: .caller.securityctrl.com
