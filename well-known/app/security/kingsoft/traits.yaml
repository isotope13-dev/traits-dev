# Beijing Kingsoft Security software Co., Ltd components (Kingsoft Internet Security /
# 金山毒霸). The security suite components legitimately manage processes with tokens,
# query software detail/update endpoints, and inspect system configuration.
# Require a verified Kingsoft code-signing certificate.
defaults:
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 100000000

traits:
  - id: kingsoft-authenticode-signer
    desc: Kingsoft Authenticode signer identity
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)Beijing Kingsoft Security software Co'

composite_rules:
  - id: kingsoft-security-component
    desc: Verified Kingsoft security component
    crit: notable
    all:
      - id: kingsoft-authenticode-signer
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: micro-behaviors/os/security/product::kingsoft-security

  - id: kingsoft-security-context
    desc: Verified Kingsoft security context
    crit: exception
    all:
      - id: kingsoft-security-component
      - id: kingsoft-authenticode-signer
