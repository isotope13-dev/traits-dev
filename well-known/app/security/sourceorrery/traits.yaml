# Identity and benign context for SourceOrrery vaults and SDKs.
# SourceOrrery is an open-source secrets management runtime and SDK for
# managing credentials across AWS Secrets Manager, Azure Key Vault, HashiCorp
# Vault, and system keyrings. The native Node addons link the official AWS Rust
# SDK (aws-config) to authenticate to AWS; the credential resolution strings
# belong to the SDK and are legitimate secret management behaviors.
defaults:
  platforms: [unix, windows]
  conf: 0.98

traits:
  - id: sourceorrery-npm-package-name
    desc: SourceOrrery npm package name
    crit: notable
    for: [package.json]
    size_max: 100000
    if:
      type: value
      path: name
      regex: '^@sourceorreryai/'

  - id: sourceorrery-repository-url
    desc: SourceOrrery source repository URL
    crit: notable
    for: [package.json]
    size_max: 100000
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/Netizine/sourceorrery(\.git)?$'

  - id: sourceorrery-binary-basename
    desc: SourceOrrery native addon binary name
    crit: notable
    for: [elf, dylib, pe, macho]
    size_min: 1000000
    size_max: 200000000
    if:
      type: basename
      regex: '^sourceorrery(\.[a-z0-9_-]+)?\.node$'

  - id: sourceorrery-crate-source-path
    desc: SourceOrrery crate source path
    crit: notable
    for: [elf, dylib, pe, macho]
    size_min: 1000000
    size_max: 200000000
    if:
      type: text
      section: any
      regex: 'crates[/\\]sourceorrery(-[a-z0-9_-]+)?[/\\]src[/\\]'

composite_rules:
  - id: sourceorrery-native-addon
    desc: SourceOrrery native addon
    crit: notable
    conf: 0.98
    for: [elf, dylib, pe, macho]
    all:
      - id: sourceorrery-binary-basename
      - id: sourceorrery-crate-source-path

  - id: sourceorrery-secrets-manager
    desc: SourceOrrery secrets management software
    crit: exception
    conf: 0.99
    any:
      - id: sourceorrery-native-addon
      - id: sourceorrery-crate-source-path
