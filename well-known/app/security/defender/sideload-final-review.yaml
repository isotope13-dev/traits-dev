defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: mpconfig-initialize-symbol
    desc: Defender MpConfigInitialize symbol
    crit: notable
    conf: 0.95
    for:
      - pe
      - dll
    if:
      type: symbol
      exact: MpConfigInitialize
  - id: mpclient-util-export-symbol
    desc: Defender MpClientUtil symbol
    crit: notable
    conf: 0.95
    for:
      - pe
      - dll
    if:
      type: symbol
      exact: MpClientUtilExportFunctions
