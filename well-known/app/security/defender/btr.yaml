# Stable artifacts of Windows Defender's Boot-Time Removal (BTR) transaction
# protocol. These identify the remediation mechanism; attacker intent is
# inferred only by objective composites that require manual driver loading or
# destructive targets.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, powershell, batch, go, rust, python]
  size_max: 52428800

traits:
  - id: btr-transaction-magic
    desc: Windows Defender BTR transaction header magic
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\b0xFEE1DEAD\b'

  - id: btr-transaction-magic-bytes
    desc: BTR transaction magic bytes
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: AD DE E1 FE

  - id: btr-changelist-stream-name
    desc: BTR changelist stream name
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i):changelist\b'

  - id: btr-feedback-driver-stream
    desc: BTR driver feedback stream
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\.sys:[A-Za-z0-9_.-]{1,80}\.dat\b'

  - id: btr-bootclean-log-path
    desc: Windows Defender BTR boot-cleaning log path
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(\\{1,4}SystemRoot|[A-Z]:\\{1,4}Windows)\\{1,4}Temp\\{1,4}BootClean\.log\b'

  - id: defender-critical-component-name
    desc: Critical Defender component name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(WdFilter(\.sys)?|WdNisDrv(\.sys)?|MsMpEng\.exe|WinDefend)\b'

composite_rules:
  - id: btr-service-transaction-staging
    desc: Contains Defender BTR service and transaction staging artifacts
    crit: notable
    conf: 0.99
    all:
      - id: btr-changelist-stream-name
      - id: micro-behaviors/os/service/driver::boot-bus-extender-group
    any:
      - id: btr-transaction-magic
      - id: btr-transaction-magic-bytes
      - id: btr-feedback-driver-stream
