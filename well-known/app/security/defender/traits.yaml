defaults:
  crit: notable
  size_max: 52428800
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: is-defender-named-2
    desc: Defender Mp service file name
    conf: 0.8
    if:
      type: path
      basename: true
      regex: (?i)(MpSvc|MpCmdRun|MsMpEng)
  - id: is-defender-named-3
    desc: WebThreatDef file name
    conf: 0.8
    if:
      type: path
      basename: true
      regex: (?i)WebThreatDef
  - id: microsoft-malware-protection-product-name
    desc: Microsoft Malware Protection product name
    conf: 0.98
    if:
      type: text
      section: .rsrc
      word: Microsoft Malware Protection
composite_rules:
  - id: is-defender-named
    desc: Defender product metadata with a matching filename
    conf: 0.8
    all:
      - id: microsoft-malware-protection-product-name
    any:
      - id: metadata/file/naming::defender-related-basename
      - id: well-known/app/security/defender::is-defender-named-2
      - id: well-known/app/security/defender::is-defender-named-3
