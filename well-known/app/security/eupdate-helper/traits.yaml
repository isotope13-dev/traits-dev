# Eupdate Helper (yztcsn) runs a LAN mirror for ESET update manifests: it
# frees its listen port, rotates trial accounts against the ESET update
# servers, and re-serves update.ver to local clients. These are identity
# observations, not a trust verdict. Manifest filtering and HTTP 404s for
# unsupported resources do not prove malicious update substitution.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [pe]
  size_max: 8000000

traits:
  - id: eupdate-helper-product-identity
    desc: Eupdate Helper PE product identity
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Eupdate Helper

  - id: eupdate-helper-single-instance-mutex
    desc: Eupdate Helper single-instance mutex name
    crit: notable
    if:
      type: text
      substr: Global\EupdateHelper_SingleInstance
      section: .rdata

composite_rules:
  - id: eupdate-helper-binary
    desc: Eupdate Helper ESET update mirror binary
    crit: notable
    # 32 KiB floor: a UPX-packed release build is ~60 KB, half the unpacked
    # image, so the old 64 KiB floor skipped packed builds entirely.
    size_min: 32768
    all:
      - id: eupdate-helper-product-identity
    any:
      - id: eupdate-helper-single-instance-mutex
      - id: micro-behaviors/communications/http/url/api-path::eset-update-manifest-path
      - id: metadata/build/artifact::overlay-hash-tag
    needs: 1
    # No trailer-length leg: the appended pad is the tool's own hash-rotation
    # buffer and its size varies per build (31/40/70-byte builds seen).
    # The corpus-app body strings (mutex, ESET paths) sit in sections that UPX
    # compresses, so a packed genuine build shows only the version resource
    # and the appended release tag; requiring the mutex here convicted packed
    # genuine builds as trojanized droppers.

  # This is part of the mirror's upstream account-management behavior. It is
  # notable for identification, but does not by itself establish hostile
  # proxy abuse or resource hijacking.
  - id: eupdate-helper-trial-account-relay
    desc: Eupdate Helper rotates trial accounts for its ESET update relay
    crit: notable
    conf: 0.97
    all:
      - id: eupdate-helper-binary
      - id: micro-behaviors/communications/proxy/auth::trial-account-identifier-prefix
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/http/auth::authorization-basic-header-token
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile

  - id: eupdate-helper-upx-packed-mirror
    desc: UPX-packed Eupdate Helper update mirror build
    crit: notable
    conf: 0.96
    all:
      - id: eupdate-helper-binary
      - id: metadata/binary/section/label::upx-section-pair

