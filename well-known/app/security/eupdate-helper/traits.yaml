# Eupdate Helper (yztcsn) runs a LAN mirror for ESET update manifests: it
# frees its listen port, rotates trial accounts against the ESET update
# servers, and re-serves update.ver to local clients.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [pe]
  size_max: 8000000

traits:
  - id: eupdate-helper-product-identity
    desc: Eupdate Helper PE product identity
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Eupdate Helper

  - id: eupdate-helper-single-instance-mutex
    desc: Eupdate Helper single-instance mutex name
    crit: notable
    if:
      type: text
      substr: Global\EupdateHelper_SingleInstance
      section: .rdata

composite_rules:
  - id: eupdate-helper-binary
    desc: Eupdate Helper ESET update mirror binary
    crit: notable
    size_min: 65536
    all:
      - id: eupdate-helper-product-identity
    # No trailer-length leg: the appended pad is the tool's own hash-rotation
    # buffer and its size varies per build (31/40/70-byte builds seen).
    any:
      - id: eupdate-helper-single-instance-mutex
      - id: micro-behaviors/communications/http/url/api-path::eset-update-manifest-path
    needs: 1
    unless:
      - id: micro-behaviors/process/create/shellexec::shell-execute-call

  - id: eupdate-helper-raw-ip-config-fetch
    desc: Eupdate Helper pulls remote config from a raw external IP over HTTP
    crit: suspicious
    conf: 0.96
    attack: T1105,T1071.001
    size_min: 65536
    all:
      - id: eupdate-helper-product-identity
      - id: eupdate-helper-single-instance-mutex
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-dll-name-text
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/process/create/shellexec::shell-execute-call

  - id: eupdate-helper-hash-rotation-profile
    desc: Eupdate Helper pads and relaunches itself to rotate on-disk hash
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    size_min: 65536
    all:
      - id: eupdate-helper-product-identity
      - id: eupdate-helper-single-instance-mutex
      - id: objectives/anti-analysis/self-modify/runtime::executable-hash-padding-diagnostic
      - id: objectives/anti-analysis/self-modify/runtime::exit-to-change-hash-diagnostic
    unless:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/process/create/shellexec::shell-execute-call

  - id: eupdate-helper-upx-packed-mirror
    desc: UPX-packed Eupdate Helper update mirror build
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    all:
      - id: eupdate-helper-binary
      - id: metadata/binary/section/label::upx-section-pair
    unless:
      - id: micro-behaviors/process/create/shellexec::shell-execute-call

