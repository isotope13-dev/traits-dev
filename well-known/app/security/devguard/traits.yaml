# DevGuard — OWASP Incubating developer security & supply chain management platform.
defaults:
  platforms: [linux]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 536870912

traits:
  - id: devguard-product-identifier
    desc: DevGuard product identity
    for: [elf, text]
    if:
      type: text
      substr: github.com/l3montree-dev/devguard

  - id: devguard-executable-basename
    desc: DevGuard executable name
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^devguard(-cli)?$'

  - id: devguard-container-path
    desc: DevGuard container repository URL path
    for: [tar]
    if:
      type: path
      regex: '(?i)ghcr\.io(%2F|/)l3montree-dev(%2F|/)devguard'

composite_rules:
  - id: devguard-security-platform
    desc: DevGuard software supply chain security platform
    crit: notable
    conf: 0.98
    any:
      - id: devguard-product-identifier
      - id: devguard-container-path
