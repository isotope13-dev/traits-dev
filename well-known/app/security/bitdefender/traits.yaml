defaults:
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  - dll
  size_min: 131072
  size_max: 100000000
traits:
- id: bitdefender-authenticode-signer
  desc: Bitdefender Authenticode signer identity
  crit: notable
  if:
    type: value
    path: pe.signatures[0].subject
    regex: ^CN=Bitdefender SRL,.*O=Bitdefender SRL
composite_rules:
- id: bitdefender-installer-component
  desc: Verified Bitdefender installer component identity
  crit: notable
  all:
  - id: bitdefender-authenticode-signer
  - id: metadata/signed/certificate/signature::pe-signature-verified-kv
  - id: metadata/binary/vendor::bitdefender-product-marker
