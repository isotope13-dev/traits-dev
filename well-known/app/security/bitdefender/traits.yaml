# Bitdefender's signed Windows installer components legitimately download
# updates, inspect security products, enumerate browser data, and manage
# services/tasks. Require both the vendor identity and a verified signature
# before using this as a benign application context.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 131072
  size_max: 100000000

traits:
  - id: bitdefender-authenticode-signer
    desc: Bitdefender Authenticode signer identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Bitdefender SRL,.*O=Bitdefender SRL'

composite_rules:
  - id: bitdefender-installer-component
    desc: Verified Bitdefender installer component identity
    crit: notable
    conf: 0.99
    all:
      - id: bitdefender-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: metadata/binary/vendor::bitdefender-product-marker

  - id: bitdefender-installer-context
    desc: Verified Bitdefender installer component context
    crit: exception
    conf: 0.99
    all:
      - id: bitdefender-installer-component
      - id: bitdefender-authenticode-signer
