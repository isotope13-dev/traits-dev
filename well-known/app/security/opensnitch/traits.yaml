# OpenSnitch application and packaging identity.
defaults:
  platforms: [linux]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree
    desc: OpenSnitch application source tree path
    for: [source, scripts, shell, python, go, zip, tar]
    if:
      type: path
      regex: '(?i)github\.com/evilsocket/opensnitch(@v[0-9]|-[0-9]|\.git)'

  - id: opensnitch-debconf-template
    desc: OpenSnitch debconf template question
    for: [shell, text]
    if:
      type: text
      substr: python3-opensnitch-ui/question1

  - id: opensnitch-desktop-path
    desc: References OpenSnitch desktop application path
    for: [shell, text]
    if:
      type: text
      substr: opensnitch_ui.desktop

composite_rules:
  - id: opensnitch-package-context
    desc: OpenSnitch application packaging context
    crit: exception
    conf: 0.98
    for: [shell, text, zip, tar]
    any:
      - id: source-tree
      - id: opensnitch-debconf-template
      - id: opensnitch-desktop-path
