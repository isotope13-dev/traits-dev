# ConvertMacCode — Korean MFC utility (Security tooling) whose linker emits a
# large writable .text section and XOR-obfuscated API names like many packers.
defaults:
  conf: 0.97
  platforms: [windows]
  for: [pe]
  size_min: 500000
  size_max: 4000000

traits:
  - id: convertmaccode-pdb-path
    desc: ConvertMacCode MSVC PDB path
    crit: notable
    if:
      type: text
      substr: ConvertMacCode\ConvertMacCode\release\ConvertMacCode.pdb
      section: .rdata

  - id: convertmaccode-mfc-app-class
    desc: ConvertMacCode MFC application RTTI class name
    crit: notable
    if:
      type: text
      substr: .?AVCConvertMacCodeApp@@
      section: .data

composite_rules:
  - id: convertmaccode-binary
    desc: ConvertMacCode MFC security utility binary
    crit: notable
    all:
      - id: convertmaccode-pdb-path
      - id: convertmaccode-mfc-app-class
