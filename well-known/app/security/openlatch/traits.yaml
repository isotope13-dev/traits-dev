defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
  size_max: 268435456
traits:
- id: npm-package-name
  desc: OpenLatch scoped npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^@openlatch/
- id: repository-url
  desc: OpenLatch upstream GitHub repository
  for:
  - package.json
  - markdown
  - text
  if:
    type: text
    substr: github.com/OpenLatch/openlatch-client
- id: hook-source-path
  desc: OpenLatch hook source path
  for:
  - elf
  if:
    type: text
    substr: src/app/openlatch_hook/
    section: rodata
- id: hook-source-path-pe
  desc: OpenLatch hook source path in PE/Mach-O
  for:
  - macho
  - pe
  - dll
  if:
    type: text
    regex: src[/\\]app[/\\]openlatch_hook[/\\]
    section: .rdata
- id: policy-block-marker
  desc: OpenLatch policy blocked marker
  for:
  - elf
  if:
    type: text
    substr: Blocked by OpenLatch policy
    section: rodata
- id: policy-block-marker-pe
  desc: OpenLatch policy blocked marker in PE/Mach-O
  for:
  - macho
  - pe
  - dll
  if:
    type: text
    substr: Blocked by OpenLatch policy
    section: .rdata
- id: basename
  desc: OpenLatch binary basename
  for:
  - elf
  - macho
  - pe
  - dll
  if:
    type: basename
    regex: ^openlatch(-.*)?\.exe$
