defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1

traits:
  - id: installer-internal-name
    desc: ShieldGuardVPNInstaller internal name field
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.internal_name
      exact: ShieldGuardVPNInstaller.exe
  - id: installer-original-filename
    desc: ShieldGuardVPNInstaller original filename
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.original_filename
      exact: ShieldGuardVPNInstaller.exe
  - id: installer-product-zyravpn
    desc: ZyraVPN product name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: ZyraVPN
  - id: installer-company-zyravpn
    desc: ZyraVPN Software Ltd. company-name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: ZyraVPN Software Ltd.
  - id: installer-trademark-claim
    desc: ZyraVPN trademark claim string
    crit: notable
    conf: 0.93
    if:
      type: value
      path: pe.version.trademarks
      substr: ZyraVPN
  - id: installer-manifest-shieldguard-app
    desc: "ShieldGuardVPNInstaller manifest identity"
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: ShieldGuardVPNInstaller.app
  - id: installer-uninstall-key-shieldguard
    desc: Uninstall registry key path for ShieldGuardVPN
    crit: notable
    conf: 0.97
    if:
      type: text
      section: text
      substr: "Uninstall\\ShieldGuardVPN"
  - id: installer-stage-filename-service
    desc: ShieldGuardVPNService.exe stage filename
    crit: notable
    conf: 0.95
    if:
      type: text
      section: text
      exact: ShieldGuardVPNService.exe
  - id: installer-stage-filename-client
    desc: ShieldGuardVPN.exe stage filename
    crit: notable
    conf: 0.93
    if:
      type: text
      section: text
      exact: ShieldGuardVPN.exe
  - id: installer-user-agent
    desc: ShieldGuardVPNInstaller User-Agent string
    crit: notable
    conf: 0.97
    if:
      type: text
      section: text
      substr: ShieldGuardVPNInstaller/
  - id: installer-zyravpn-setup-window-title
    desc: ZyraVPN Setup window title
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      exact: ZyraVPN Setup
  - id: installer-task-name-shieldguardvpnservice
    desc: ShieldGuardVPNService scheduled task name
    crit: notable
    conf: 0.94
    if:
      type: text
      section: text
      substr: "ShieldGuardVPN Service - Auto-start"
  - id: zyra-installer-basename
    desc: ZyraPrivateVPN.exe delivery basename
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: "^ZyraPrivateVPN(\\.exe)?$"
      case_insensitive: true
  - id: zyra-shieldguard-installer-basename
    desc: ShieldGuardVPNInstaller.exe alternate basename
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: "^ShieldGuardVPNInstaller(\\.exe)?$"
      case_insensitive: true
  - id: service-internal-name
    desc: ShieldGuardVPNService internal name field
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.internal_name
      exact: ShieldGuardVPNService.exe
  - id: service-product-shieldguard-vpn
    desc: ShieldGuard VPN product-name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: ShieldGuard VPN
  - id: service-company-shieldguard-software
    desc: ShieldGuard Software Ltd. company-name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: ShieldGuard Software Ltd.
  - id: service-trademark-claim
    desc: ShieldGuard trademark claim string
    crit: notable
    conf: 0.93
    if:
      type: value
      path: pe.version.trademarks
      substr: ShieldGuard
  - id: service-manifest-shieldguardservice-app
    desc: "ShieldGuardVPNService manifest identity"
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: ShieldGuardVPNService.app
  - id: zyra-service-basename
    desc: ShieldGuardVPNService.exe delivery basename
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: "^ShieldGuardVPNService(\\.exe)?$"
      case_insensitive: true
  - id: client-internal-name
    desc: ShieldGuardVPN internal name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.internal_name
      exact: ShieldGuardVPN.exe
  - id: client-product-shieldguardvpn
    desc: ShieldGuardVPN product-name field
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: ShieldGuardVPN
  - id: client-pdb-path
    desc: ShieldGuardVPN client project PDB path
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.debug.pdb.path
      substr: "shieldguardvpn\\client\\ShieldGuardVPN"
  - id: client-c2-get-configs-php
    desc: zyra/get_configs.php config-fallback endpoint
    crit: suspicious
    conf: 0.96
    if:
      type: text
      section: text
      substr: /zyra/get_configs.php
  - id: client-c2-get-ip-php
    desc: zyra/get_ip.php IP-query endpoint
    crit: notable
    conf: 0.93
    if:
      type: text
      section: text
      substr: /zyra/get_ip.php
  - id: client-c2-flags-path
    desc: zyra/flags/ flag-image directory
    crit: notable
    conf: 0.85
    if:
      type: text
      section: text
      substr: /zyra/flags/
  - id: client-hardcoded-ss-url
    desc: Zyra VPN Shadowsocks credential reference
    crit: notable
    conf: 0.99
    if:
      type: text
      section: text
      substr: "ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTpmWGZkSDlWN0taUWhjODZ1RjNlVW9j"
  - id: zyra-client-basename
    desc: ShieldGuardVPN.exe delivery basename
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: "^ShieldGuardVPN(\\.exe)?$"
      case_insensitive: true

composite_rules:
  - id: installer-vendor-identity-cluster
    desc: ZyraVPN vendor-identity field cluster
    crit: notable
    conf: 0.95
    all:
      - id: well-known/app/security/zyra-vpn::installer-internal-name
      - id: well-known/app/security/zyra-vpn::installer-product-zyravpn
      - id: well-known/app/security/zyra-vpn::installer-company-zyravpn
  - id: installer-stage-deployment-cluster
    desc: ShieldGuardVPN stage filenames + uninstall key cluster
    crit: suspicious
    conf: 0.95
    all:
      - id: well-known/app/security/zyra-vpn::installer-stage-filename-service
      - id: well-known/app/security/zyra-vpn::installer-uninstall-key-shieldguard
  - id: service-vendor-identity-cluster
    desc: ShieldGuard service vendor-identity cluster
    crit: notable
    conf: 0.95
    all:
      - id: well-known/app/security/zyra-vpn::service-internal-name
      - id: well-known/app/security/zyra-vpn::service-product-shieldguard-vpn
      - id: well-known/app/security/zyra-vpn::service-company-shieldguard-software
  - id: shieldguard-vpn-client-clues
    desc: ShieldGuard VPN client clues
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/security/zyra-vpn::client-internal-name
    any:
      - id: well-known/app/security/zyra-vpn::client-hardcoded-ss-url
      - id: micro-behaviors/communications/proxy/tunnel::vpn-tool-path-reference-cluster
      - id: well-known/app/security/zyra-vpn::client-c2-get-configs-php
  - id: zyra-vpn-credential-toolset
    desc: Zyra VPN credential and tool references
    crit: notable
    conf: 0.985
    all:
      - id: well-known/app/security/zyra-vpn::client-hardcoded-ss-url
      - id: micro-behaviors/communications/proxy/tunnel::vpn-tool-path-reference-cluster
  - id: zyra-vpn-client-identity
    desc: Zyra VPN client identity clues
    crit: notable
    conf: 0.995
    all:
      - id: well-known/app/security/zyra-vpn::zyra-client-basename
      - id: well-known/app/security/zyra-vpn::client-internal-name
    any:
      - id: well-known/app/security/zyra-vpn::client-hardcoded-ss-url
      - id: micro-behaviors/communications/proxy/tunnel::vpn-tool-path-reference-cluster
      - id: well-known/app/security/zyra-vpn::client-c2-get-configs-php
      - id: well-known/app/security/zyra-vpn::client-pdb-path
  - id: zyra-vpn-proxy-client-clues
    desc: Zyra VPN proxy-client clues
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/security/zyra-vpn::client-hardcoded-ss-url
      - id: micro-behaviors/communications/proxy/tunnel::vpn-tool-path-reference-cluster
      - id: micro-behaviors/communications/proxy/config::vpn-runner-field-reference-cluster
    any:
      - id: micro-behaviors/communications/url/query/selection::client-outline-prefix-token
      - id: well-known/app/security/zyra-vpn::client-c2-get-configs-php
  - id: zyra-shared-shieldguard-naming
    desc: ShieldGuard naming across Zyra components
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: well-known/app/security/zyra-vpn::installer-internal-name
      - id: well-known/app/security/zyra-vpn::service-internal-name
      - id: well-known/app/security/zyra-vpn::client-internal-name
      - id: well-known/app/security/zyra-vpn::installer-stage-filename-service
      - id: well-known/app/security/zyra-vpn::installer-stage-filename-client
