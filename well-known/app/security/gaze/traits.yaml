# Gaze (github.com/gundulabs/gaze) — open-source biometric facial authentication
# system for Linux, providing pam_gaze.so and the gazed service daemon.
defaults:
  platforms: [unix]
  for: [elf, so, scripts, text]
  size_max: 268435456
  crit: notable
  conf: 0.95

traits:
  - id: gaze-pam-module-reference
    desc: References Gaze PAM facial authentication module
    if:
      type: text
      substr: pam_gaze.so

  - id: gaze-identity
    desc: Gaze biometric facial authentication system
    if:
      type: text
      regex: 'gaze@gundulabs\.(ca|com)|com\.gundulabs\.Gaze|gaze\.gundulabs\.com'

composite_rules:
  - id: gaze-authentication-system
    desc: Gaze biometric authentication system
    crit: exception
    any:
      - id: gaze-identity
      - id: gaze-pam-module-reference
