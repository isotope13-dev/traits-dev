# QNSQY (quantumsequrity.com) is a post-quantum cryptography application built
# on NIST post-quantum standards (ML-KEM, ML-DSA, SLH-DSA). Its GUI/CLI/TUI
# binary and npm packages include local file encryption and key management
# features with user-facing documentation.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: qnsqy-binary-name
    desc: QNSQY binary basename
    for: [elf, macho, pe]
    size_min: 1048576
    size_max: 300000000
    if:
      type: path
      basename: true
      regex: '^qnsqy(\.exe)?$'

  - id: qnsqy-quantumsequrity-domain
    desc: Quantum Sequrity domain reference
    for: [elf, macho, pe, javascript, text]
    size_min: 100
    size_max: 300000000
    if:
      type: text
      regex: '(?i)(https?://)?(billing\.|api\.)?quantumsequrity\.com'

  - id: qnsqy-application-identity
    desc: QNSQY application self-description
    for: [elf, macho, pe, javascript, text]
    size_min: 100
    size_max: 300000000
    if:
      type: text
      substr: 'Everything you need to know about QNSQY'

  - id: qnsqy-package-name
    desc: QNSQY npm package name
    for: [package.json]
    size_max: 65536
    if:
      type: value
      path: name
      regex: '^(@quantumsequrity/)?qnsqy(-[a-z0-9-]+)?$'

composite_rules:
  - id: qnsqy-known-app-context
    desc: QNSQY post-quantum encryption application context
    crit: exception
    conf: 0.99
    any:
      - id: qnsqy-application-identity
      - id: qnsqy-quantumsequrity-domain
      - id: qnsqy-package-name
