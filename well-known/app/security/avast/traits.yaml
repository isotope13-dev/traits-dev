defaults:
  platforms: [windows, unix]
  for: [javascript, chrome-manifest]
  size_max: 10000000
  crit: baseline
  conf: 0.98

traits:
  - id: avast-antitrack-xpi-path
    crit: notable
    desc: Avast AntiTrack extension path
    if:
      type: path
      regex: '(?i)avast[_-]antitrack.*\.xpi[\\/]'
  - id: browsing-data-cleaner-framework
    desc: Avast browsing data cleaner framework
    crit: notable
    conf: 0.99
    for: [macho, dylib, pe, dll]
    if:
      type: path
      regex: 'BrowsingDataCleaner'

composite_rules:
  - id: avast-antitrack-extension
    desc: Avast AntiTrack browser extension
    crit: notable
    conf: 0.98
    all:
      - id: avast-antitrack-xpi-path
      - id: metadata/lang/natural/vocabulary/privacy::antitrack-text
