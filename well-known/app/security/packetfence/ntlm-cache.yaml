defaults:
  platforms: [unix, windows]
  for: [perl]
  crit: component
  conf: 0.98
traits:
  - id: ntlm-cache-package-declaration
    desc: PacketFence NTLM-cache package declaration
    if:
      type: text
      encoding: none
      regex: '(?m)^package pf::domain::ntlm_cache;'
  - id: ntlm-cache-account-function
    desc: PacketFence NTLM-cache account function
    if:
      type: text
      encoding: none
      regex: '(?m)^sub get_sync_samaccountname\s*\{'
  - id: ntlm-cache-cache-function
    desc: PacketFence NTLM-cache cache function
    if:
      type: text
      encoding: none
      regex: '(?m)^sub cache_user\s*\{'
composite_rules:
  - id: ntlm-cache-module
    desc: PacketFence domain NTLM-cache implementation
    crit: notable
    all:
      - id: ntlm-cache-package-declaration
      - id: ntlm-cache-account-function
      - id: ntlm-cache-cache-function
