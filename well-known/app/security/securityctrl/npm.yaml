defaults:
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
  crit: notable
  conf: 0.99

traits:
  - id: repository-host
    desc: SecurityCtrl package repository host
    for: [package.json]
    if:
      type: value
      path: dependencies.*
      regex: '^https://repo\.securityctrl\.com/'

  - id: callback-host
    desc: SecurityCtrl callback service domain
    for: [scripts]
    if:
      type: text
      substr: .caller.securityctrl.com

composite_rules:
  # SecurityCtrl reserves dependency-confusion names with a documented
  # placeholder whose sole dependency resolves through its own repository.
  # Require all three facts so an unrelated package cannot inherit this
  # exception merely by mentioning the vendor host or the word placeholder.
  - id: defensive-placeholder-context
    desc: SecurityCtrl defensive package placeholder context
    crit: exception
    for: [package.json]
    all:
      - id: repository-host
      - id: metadata/package/manifest/description::description-mentions-placeholder
      - id: metadata/package/dependencies/manifest::npm-single-https-runtime-dependency
