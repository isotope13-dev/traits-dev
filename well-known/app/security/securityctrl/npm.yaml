defaults:
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
  crit: notable
  conf: 0.99

traits:
  - id: repository-host
    desc: SecurityCtrl package repository host
    for: [package.json]
    if:
      type: value
      path: dependencies.*
      regex: '^https://repo\.securityctrl\.com/'

  - id: callback-host
    desc: SecurityCtrl callback service domain
    for: [scripts]
    if:
      type: text
      substr: .caller.securityctrl.com
