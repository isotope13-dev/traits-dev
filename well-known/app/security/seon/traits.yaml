# SEON JavaScript SDK — commercial device/browser fingerprinting and bot
# detection for fraud prevention (seon.io). Heavily minified and wrapped in a
# commercial-obfuscator self-defending/debug-protection shell by design: the
# product's purpose is resisting tampering by the fraudsters it is meant to
# detect, not concealment from the customer embedding it.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: SEON JavaScript SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@seontechnologies/seon-javascript-sdk"

  - id: umd-global-export
    desc: SEON SDK UMD bundle global export marker
    for: [javascript]
    if:
      type: text
      regex: '\)\.seon=[a-zA-Z_$][\w$]*\(\)'

composite_rules:
  - id: seon-sdk-context
    desc: SEON JavaScript SDK bundle context
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: umd-global-export
