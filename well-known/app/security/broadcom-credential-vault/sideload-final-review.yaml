defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: host-storage-original-filename
    desc: Host Storage original filename claim
    crit: notable
    conf: 0.98
    for:
      - pe
    if:
      type: value
      path: pe.version.original_filename
      exact: HostStorageService.exe
  - id: host-storage-pdb-path
    desc: Host Storage PDB path
    crit: notable
    conf: 0.96
    for:
      - pe
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])HostStorageService\.pdb$'
  - id: credential-vault-interface-dll-reference
    desc: Credential Vault interface DLL reference
    crit: notable
    conf: 0.98
    for:
      - pe
    if:
      type: text
      section: any
      exact: CVUsrIfc.dll
  - id: credential-vault-service-name
    desc: Credential Vault Host Storage service name
    crit: notable
    conf: 0.96
    for:
      - pe
    if:
      type: text
      section: any
      exact: Credential Vault Host Storage
