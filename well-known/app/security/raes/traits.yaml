# RAES (Range Architecture for Exercises and Simulations) environment packs
# (github.com/OpenRAE/env-packs). Pack resources define reference cyber-range
# environments and intentionally bundle vulnerable applications, mock targets,
# and training assets for purple team exercises.
defaults:
  platforms: [unix, windows]
  conf: 0.99
  crit: notable

traits:
  - id: wheel-distribution-name
    desc: RAES environment packs wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^raes[_-]env[_-]packs$'

  - id: upstream-repository
    desc: RAES environment packs GitHub repository
    for: [package.json, markdown, text, source]
    if:
      type: text
      substr: 'github.com/OpenRAE/env-packs'

  - id: pack-resource-path
    desc: RAES environment pack asset resource path
    for: [scripts, source, data, manifests, documents, text]
    size_max: 50000000
    if:
      type: path
      regex: '(?i)raes_env_packs[/\\]resources'

composite_rules:
  - id: raes-env-pack-context
    desc: RAES cyber-range environment pack context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution-name
      - id: upstream-repository
      - id: pack-resource-path
