# KeePass Password Safe 2.x (Dominik Reichl) is a long-established open-source
# password manager. Its source carries features that read as attack primitives
# in isolation: an opt-in "accept invalid TLS certificates" setting, a
# URL-login helper that POSTs form data through a web request, and the
# installer helper ShInstUtil that registers the optional "PreLoad" startup
# entry under the Run key. Every source file starts with the author's
# copyright line, which identifies the file itself.
defaults:
  platforms: [windows, unix]
  for: [csharp, cpp, c, source]
  crit: notable
  conf: 0.95

traits:
  - id: source-copyright-header
    desc: KeePass source copyright header
    if:
      type: text
      regex: 'Copyright \(C\) 2003-\d{4} Dominik Reichl'
