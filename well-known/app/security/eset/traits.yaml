# Identity observations for the ESET security product. ecmd.exe is the
# product's command-line console; update tooling locates it under the
# install directory and launches it with /update so the product pulls
# updates through the caller's own relay. Launch mechanics keep their own
# findings.
defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]

traits:
  - id: ecmd-updater-console-reference
    desc: References the ESET ecmd.exe updater console
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\becmd\.exe\b'
      section: .rdata
