# Identity observations for ESET Mobile Security for Android.
# Legitimate mobile security suites bind accessibility services (for anti-phishing
# and app lock), device administration (for anti-theft wipe/lock and uninstall
# protection), notification listeners, and system alert windows.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99

traits:
  - id: eset-mobile-security-package
    desc: ESET Mobile Security Android package name
    if:
      type: value
      path: android_xml.values[*].value
      regex: '^com\.eset\.ems2?(\.gp)?$'

  - id: eset-mobile-security-application-component
    desc: ESET Mobile Security component class
    if:
      type: value
      path: android_xml.values[*].value
      regex: '^com\.eset\.(app\.homesecurity|ems|ems2|commoncore)\.'

composite_rules:
  - id: eset-mobile-security-identity
    desc: ESET Mobile Security Android manifest identity
    crit: exception
    conf: 0.995
    all:
      - id: eset-mobile-security-package
      - id: eset-mobile-security-application-component
