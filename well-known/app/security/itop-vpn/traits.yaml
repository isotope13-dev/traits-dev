# iTop VPN for Windows components.  The installer bundles its UI, browser
# privacy cleanup, proxy, updater, and WHQL network/process drivers.  Keep the
# exception narrow: require a verified iTop signer plus an iTop component
# identity, rather than exempting generic VPN or installer behavior.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: authenticode-signer
    desc: Chengdu ShanHe Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)^CN=Chengdu ShanHe Information Technology Co'

  - id: product-metadata
    desc: iTop VPN product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^iTop VPN$'

  - id: company-metadata
    desc: iTop VPN company metadata
    if:
      type: value
      path: pe.version.company
      exact: iTop Inc.

  # Only the vendor's own names identify an iTop component. `ICONPIN`,
  # `WinDivert` and `cyg` were also listed, but those name shared or
  # third-party binaries -- ICONPIN ships in IObit's other products, WinDivert
  # is an open-source packet driver, and `cyg*` is any Cygwin runtime -- so
  # they attributed other vendors' files to iTop VPN.
  - id: component-original-filename
    desc: iTop VPN component filename metadata
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^(iTop|vpnclient)[A-Za-z0-9_.-]*\.(exe|dll|sys)$'

  - id: proxy-component-basename
    desc: iTop VPN proxy component filename
    if:
      type: path
      basename: true
      regex: '(?i)^(iTopProxy(Server|Client|Cleaner)|ProxyInit)\.exe$'

  - id: driver-component-basename
    desc: iTop VPN driver component filename
    if:
      type: path
      basename: true
      regex: '(?i)^(itvwd|ITopVpnCallbackProcess)\.sys$'

  - id: bundle-library-basename
    desc: iTop VPN bundled library filename
    if:
      type: path
      basename: true
      # Only the vendor-prefixed names belong here. `sqlite3`, `webres`,
      # `pwds`, `datastate`, `pnf1`, and `s5b` were also listed, but those are
      # generic library names thousands of applications ship -- as an identity
      # leg they named something the matcher could not establish, and the
      # pattern ran past the 64-char cap on path regexes.
      regex: '(?i)^(iTopAws|iTopClientExt)\.(dll|exe)$'

composite_rules:
  - id: verified-component
    desc: Verified iTop VPN component identity
    all:
      - id: authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
    any:
      - id: product-metadata
      - id: company-metadata
      - id: component-original-filename
      - id: proxy-component-basename
      - id: driver-component-basename
      - id: bundle-library-basename
      - id: well-known/lib/data/sqlite::sqlite-version-resource-identity

  - id: benign-context
    desc: Verified iTop VPN component context
    crit: exception
    conf: 0.99
    all:
      - id: verified-component
    any:
      - id: product-metadata
      - id: company-metadata
      - id: component-original-filename
      - id: proxy-component-basename
      - id: driver-component-basename
      - id: bundle-library-basename
      - id: well-known/lib/data/sqlite::sqlite-version-resource-identity
