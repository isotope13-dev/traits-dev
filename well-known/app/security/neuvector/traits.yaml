# NeuVector container security platform. The scanner and scannerTask
# binaries share the github.com/neuvector/scanner main module.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  # Every Go binary of this product exceeds 1 MiB; the main-module path is
  # read from the embedded build info, not from a filename.
  size_min: 1048576

traits:
  - id: scanner-go-module
    desc: NeuVector scanner Go main module
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/neuvector/scanner
