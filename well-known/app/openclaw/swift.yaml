defaults:
  platforms: [macos]
  for: [swift]
  crit: notable
  conf: 0.98
traits:
  - id: openclaw-kit-import
    desc: OpenClawKit Swift module import
    crit: notable
    conf: 1.0
    if:
      type: symbol
      kind: import
      exact: OpenClawKit
  - id: openclaw-ipc-import
    desc: OpenClawIPC Swift module import
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: import
      exact: OpenClawIPC
  - id: openclaw-general-settings-view
    desc: OpenClaw general settings view
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: GeneralSettings
composite_rules:
  - id: openclaw-general-settings-source
    desc: OpenClaw settings source module
    crit: notable
    conf: 0.99
    all:
      - id: openclaw-kit-import
      - id: openclaw-ipc-import
      - id: openclaw-general-settings-view
