# Starlette Admin is a Python web-administration framework. Its bundled
# JavaScript assets and HTTP/UI code are expected package behavior; these
# identity traits make that package context explicit during triage.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, javascript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Starlette Admin distribution metadata name
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^Name:\s*starlette-admin\s*$'

  - id: package-member-path
    desc: Starlette Admin package member path
    for: [python, javascript, markdown, text, whl]
    if:
      type: path
      regex: '(^|[\\/])starlette_admin([\\/]|$)'

  - id: upstream-repository
    desc: Starlette Admin upstream repository reference
    for: [pkginfo, markdown, text]
    if:
      type: text
      regex: 'github\.com/jowilf/starlette-admin'

composite_rules:
  - id: package-context
    desc: Recognized Starlette Admin Python package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: package-member-path
