# bioconda-recipes is the community conda package recipe repository. Build
# scripts, wget fetches, and architecture selectors are normal recipe tooling.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, python, markdown, text, github-actions]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-repository
    desc: bioconda-recipes upstream repository reference
    if:
      type: text
      substr: github.com/bioconda/bioconda-recipes

composite_rules:
  - id: bioconda-recipes-repo
    desc: bioconda community conda recipe repository
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: upstream-repository
      - id: metadata/build/conda::conda-recipe-tree-build-path
