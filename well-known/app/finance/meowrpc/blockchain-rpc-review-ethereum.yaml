defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-meowrpc-provider--source
  desc: MeowRPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: eth.meowrpc.com
- id: ethereum-meowrpc-provider--binary
  desc: MeowRPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: eth.meowrpc.com

composite_rules:
- id: ethereum-meowrpc-provider
  desc: MeowRPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/meowrpc::ethereum-meowrpc-provider--source
    - id: well-known/app/finance/meowrpc::ethereum-meowrpc-provider--binary
