defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-blastapi-provider--source
  desc: BlastAPI Ethereum JSON-RPC provider
  conf: 0.9
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: eth-mainnet.public.blastapi.io
- id: ethereum-blastapi-provider--binary
  desc: BlastAPI Ethereum JSON-RPC provider
  conf: 0.9
  for: [binaries]
  crit: component
  if:
    type: text
    substr: eth-mainnet.public.blastapi.io
- id: ethereum-blastapi-provider-unicode
  desc: Unicode-escaped BlastAPI RPC provider
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: encoded
    encoding: unicode-escape
    substr: eth-mainnet.public.blastapi.io

composite_rules:
- id: ethereum-blastapi-provider
  desc: BlastAPI Ethereum JSON-RPC provider
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/blastapi::ethereum-blastapi-provider--source
    - id: well-known/app/finance/blastapi::ethereum-blastapi-provider--binary
