defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-blxrbdn-provider--source
  desc: bloXroute Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    regex: '(?i)(singapore|uk|virginia)\.rpc\.blxrbdn\.com'
- id: ethereum-blxrbdn-provider--binary
  desc: bloXroute Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    regex: '(?i)(singapore|uk|virginia)\.rpc\.blxrbdn\.com'

composite_rules:
- id: ethereum-blxrbdn-provider
  desc: bloXroute Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/bloxroute::ethereum-blxrbdn-provider--source
    - id: well-known/app/finance/bloxroute::ethereum-blxrbdn-provider--binary
