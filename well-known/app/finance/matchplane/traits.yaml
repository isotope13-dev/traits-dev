# Matchplane — distributed exchange matching and payment platform.
defaults:
  platforms: [unix]
  for: [elf, tar, zst, archives]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 500000000

traits:
  - id: binary-path
    desc: Matchplane service binary path
    if:
      type: path
      regex: 'matchplane-(matcher|projector|event-relay|payment-service)$'

  - id: crate-path-marker
    desc: Matchplane Rust crate path
    if:
      type: text
      substr: crates/matchplane-storage

  - id: version-marker
    desc: Matchplane release version marker
    if:
      type: text
      substr: matchplane.commands.v1

composite_rules:
  - id: matchplane-storage-context
    desc: Matchplane storage crate context
    crit: notable
    conf: 0.99
    all:
      - id: crate-path-marker
      - id: version-marker

  - id: matchplane-distribution-context
    desc: Recognized Matchplane release bundle
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: binary-path
      - id: matchplane-storage-context
