defaults:
  platforms: [unix, windows]
  for: [pe, dll, csharp, binaries, scripts, source]
  crit: notable
  conf: 0.9
  size_min: 1

traits:
- id: bsc-defibit-provider--source
  desc: BSC defibit JSON-RPC provider
  conf: 0.83
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: bsc-dataseed1.defibit.io
- id: bsc-defibit-provider--binary
  desc: BSC defibit JSON-RPC provider
  conf: 0.83
  for: [binaries]
  crit: component
  if:
    type: text
    substr: bsc-dataseed1.defibit.io

composite_rules:
- id: bsc-defibit-provider
  desc: BSC defibit JSON-RPC provider
  crit: notable
  conf: 0.83
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/defibit::bsc-defibit-provider--source
    - id: well-known/app/finance/defibit::bsc-defibit-provider--binary
