# Celo blockchain — go-ethereum fork for the Celo network.
defaults:
  platforms: [unix, windows]
  for: [go, jar, zip, tar, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-repo-url
    desc: Celo-org/celo-blockchain GitHub repository
    if:
      type: text
      substr: github.com/Celo-org/celo-blockchain

  - id: golang-geth-implementation
    desc: Celo official golang geth implementation summary
    if:
      type: text
      substr: Official golang implementation of the Celo blockchain

composite_rules:
  - id: celo-blockchain-node
    desc: Celo blockchain go-ethereum node
    crit: notable
    any:
      - id: github-repo-url
      - id: golang-geth-implementation
