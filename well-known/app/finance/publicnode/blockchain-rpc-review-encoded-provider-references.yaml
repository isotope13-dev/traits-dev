defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  size_min: 1

traits:
- id: polygon-publicnode-encoded
  desc: Encoded Polygon publicnode endpoint
  crit: suspicious
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: polygon-bor-rpc.publicnode.com
- id: bsc-publicnode-encoded
  desc: Encoded BSC publicnode RPC endpoint
  crit: suspicious
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: bsc-rpc.publicnode.com
