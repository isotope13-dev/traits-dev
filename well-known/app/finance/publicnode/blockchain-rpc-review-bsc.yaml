defaults:
  platforms: [unix, windows]
  for: [pe, dll, csharp, binaries, scripts, source]
  crit: notable
  conf: 0.9
  size_min: 1

traits:
- id: bsc-publicnode-provider--source
  desc: BSC PublicNode JSON-RPC provider
  conf: 0.82
  for: [scripts, source]
  crit: component
  if:
    type: string_literal
    substr: bsc-rpc.publicnode.com
- id: bsc-publicnode-provider--binary
  desc: BSC PublicNode JSON-RPC provider
  conf: 0.82
  for: [binaries]
  crit: component
  if:
    type: string_literal
    substr: bsc-rpc.publicnode.com

composite_rules:
- id: bsc-publicnode-provider
  desc: BSC PublicNode JSON-RPC provider
  crit: notable
  conf: 0.82
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/publicnode::bsc-publicnode-provider--source
    - id: well-known/app/finance/publicnode::bsc-publicnode-provider--binary
