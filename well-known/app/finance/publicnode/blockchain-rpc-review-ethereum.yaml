defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-publicnode-provider--source
  desc: PublicNode Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: ethereum.publicnode.com
- id: ethereum-publicnode-provider--binary
  desc: PublicNode Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: ethereum.publicnode.com

composite_rules:
- id: ethereum-publicnode-provider
  desc: PublicNode Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/publicnode::ethereum-publicnode-provider--source
    - id: well-known/app/finance/publicnode::ethereum-publicnode-provider--binary
