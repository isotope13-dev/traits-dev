# Sila Money PHP SDK — fintech payments and ACH API client library.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, json, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: composer-package-name
    desc: silamoney/php-sdk Composer package name
    for: [json, markdown, text]
    if:
      type: text
      substr: '"name": "silamoney/php-sdk"'

  - id: sila-api-class
    desc: SilaApi PHP SDK client class
    for: [php]
    if:
      type: text
      substr: class SilaApi

  - id: sdk-repo-path
    desc: Sila-Money sila-sdk-php repository path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)Sila-Money-sila-sdk-php'

  - id: sila-docs-homepage
    desc: silamoney.com PHP SDK documentation URL
    for: [markdown, text, php]
    if:
      type: text
      substr: docs.silamoney.com

composite_rules:
  - id: silamoney-php-sdk-package
    desc: Sila Money PHP payments SDK package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: composer-package-name
      - id: sdk-repo-path
      - id: sila-api-class
