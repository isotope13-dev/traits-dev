defaults:
  platforms: [unix, windows]
  for: [pe, dll, csharp, binaries, scripts, source]
  crit: notable
  conf: 0.9
  size_min: 1

traits:
- id: bsc-bnbchain-provider--source
  desc: BNB Chain public JSON-RPC provider
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: bnbchain.org
- id: bsc-bnbchain-provider--binary
  desc: BNB Chain public JSON-RPC provider
  for: [binaries]
  crit: component
  if:
    type: text
    substr: bnbchain.org

composite_rules:
- id: bsc-bnbchain-provider
  desc: BNB Chain public JSON-RPC provider
  crit: notable
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/bnb-chain::bsc-bnbchain-provider--source
    - id: well-known/app/finance/bnb-chain::bsc-bnbchain-provider--binary
