defaults:
  platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - macho
composite_rules:
# A pool reference can be the built-in donation service; it is not proof of
# an operator-supplied configuration or unauthorized mining deployment.
- id: xmrig-pool-or-wallet-references
  desc: XMRig with pool or wallet references
  for: [elf, pe, python, javascript, powershell]
  crit: notable
  conf: 0.95
  all:
  - id: well-known/app/finance/xmrig::xmrig-name
  any:
  - id: objectives/impact/cryptojacking/miner/pool/
  - id: micro-behaviors/crypto/hash/mining::mining-protocol-known-pool
  - id: objectives/impact/crypto-manipulation/keystore::native-monero-wallet-paths
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/naming::test-directory-component

- id: built-in-wallet-pools-config
  desc: XMRig reference with embedded pools and wallet JSON
  crit: notable
  conf: 0.95
  all:
  - id: well-known/app/finance/xmrig::xmrig-name
  - id: micro-behaviors/data/config/syntax::xmrig-embedded-pools-config
  - id: micro-behaviors/data/config/syntax::monero-shaped-json-user-field
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: stratum-pools-donations-disabled
  desc: XMRig, pool JSON, zero donations and Stratum references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/data/config/syntax::xmrig-embedded-pools-config
  - id: micro-behaviors/data/config/syntax::xmrig-donate-level-zero-config
  - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
  any:
  - id: micro-behaviors/process/info/name::xmrig-product
  - id: well-known/app/finance/xmrig::xmrig-name
  - id: well-known/app/finance/xmrig::xmrig-binary-markers
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
