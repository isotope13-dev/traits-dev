defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 500000000

traits:
  # ELF builds keep this CLI banner in read-only data, rather than .text.
  # Require the version syntax so a bare product-name reference is insufficient.
  - id: xmrig-version-banner-elf
    desc: XMRig version banner in ELF
    if:
      type: text
      regex: '^XMRig [0-9]+\.[0-9]+\.[0-9]+([ -]|$)'
      section: .rodata

composite_rules:
  # Stratum support and donation/mining CLI help ship in ordinary XMRig
  # releases. Identify the miner, but do not infer unauthorized cryptojacking
  # without a configured payout or deployment behavior.
  - id: native-elf-stratum-miner-cli
    desc: XMRig ELF with Stratum support and miner CLI options
    crit: notable
    conf: 0.97
    all:
      - id: xmrig-name
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: metadata/file/profile/command-options::donation-level-option-text
    any:
      - id: metadata/file/profile/command-options::randomx-mode-option-text
      - id: metadata/file/profile/command-options::cpu-max-threads-hint-option-text
    needs: 1
