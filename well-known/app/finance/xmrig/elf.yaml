defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 500000000

traits:
  # ELF builds keep this CLI banner in read-only data, rather than .text.
  # Require the version syntax so a bare product-name reference is insufficient.
  - id: xmrig-version-banner-elf
    desc: XMRig version banner in ELF
    if:
      type: text
      regex: '^XMRig [0-9]+\.[0-9]+\.[0-9]+([ -]|$)'
      section: .rodata

composite_rules:
  # IoT stages use the ``xmrig-arm`` release name; official ARM64 builds use
  # ``xmrig-arm64`` filenames but keep the same rodata version banner.
  - id: xmrig-arm-release-identity
    desc: XMRig ARM release name or ELF version banner
    crit: notable
    conf: 0.97
    any:
      - id: well-known/app/finance/xmrig::xmrig-arm
      - id: xmrig-version-banner-elf
