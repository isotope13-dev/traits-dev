defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 500000000

traits:
  # ELF builds keep this CLI banner in read-only data, rather than .text.
  # Require the version syntax so a bare product-name reference is insufficient.
  - id: xmrig-version-banner-elf
    desc: XMRig version banner in ELF
    if:
      type: text
      regex: '^XMRig [0-9]+\.[0-9]+\.[0-9]+([ -]|$)'
      section: .rodata
