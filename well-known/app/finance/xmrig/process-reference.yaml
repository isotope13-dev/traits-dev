defaults:
  platforms: [unix, windows]
  size_min: 1
  # JSON included: IaC templates and config files reference the product too.
  for: [documents, scripts, binaries, json, data]
traits:
  - id: xmrig-product
    desc: References XMRig process name
    crit: notable
    conf: 0.8
    if:
      type: text
      # Do not promote a PowerShell/shell line comment into a process name.
      regex: '(?im)^[^#\r\n]{0,300}\bxmrig\b'
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: metadata/file/profile/threat-scanning::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/agent/skill-scanner::source-context
      - id: metadata/file/catalog/threat-pattern::bad-pattern-process-scanner
      - id: metadata/file/profile/threat-scanning::defensive-miner-signature-catalog
