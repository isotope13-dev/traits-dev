defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  size_max: 5000000
traits:
# IoT botnets stage the stock ARM build under its release name, often
# inside packed string tables where no word boundary surrounds it, so the
# word matcher misses; the release name itself stays distinctive.
- id: xmrig-arm
  size_min: 512
  size_max: 500000000
  for:
  - binaries
  desc: XMRig ARM build binary name
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: xmrig-arm
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/clawmetry/
  - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
- id: xmrig-title
  size_min: 512
  size_max: 500000000
  desc: Xmrig string (title case)
  crit: notable
  conf: 0.8
  if:
    type: text
    word: Xmrig
    section: ".text"
- id: xmrig-upper
  size_min: 512
  size_max: 500000000
  desc: XMRIG string (uppercase)
  crit: notable
  conf: 0.8
  if:
    type: text
    word: XMRIG
    section: ".text"
- id: xmrig-pascal
  size_min: 512
  size_max: 500000000
  desc: XMRig string (PascalCase)
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: XMRig
    section: ".text"
- id: user-flag-u
  size_min: 512
  size_max: 500000000
  desc: XMRig -u flag with wallet context
  crit: notable
  conf: 0.7
  attack: T1496
  for:
  - shell
  if:
    type: string_literal
    regex: "-u\\s+[A-Za-z0-9]{40,}"
    section: ".text"
- id: user-flag-user
  size_min: 512
  size_max: 500000000
  desc: XMRig --user flag
  crit: notable
  conf: 0.7
  attack: T1496
  if:
    type: text
    substr: "'--user'"
    section: ".text"
- id: pool-flag-o
  size_min: 512
  size_max: 500000000
  desc: XMRig -o flag
  crit: notable
  conf: 0.7
  attack: T1496
  if:
    type: text
    regex: "\\s-o\\s+[^-\\s][^\\s]{0,120}:\\d+"
    section: ".text"
- id: pool-flag-url
  size_min: 512
  size_max: 500000000
  desc: XMRig --url flag
  crit: notable
  conf: 0.7
  attack: T1496
  if:
    type: text
    substr: "'--url'"
    section: ".text"
  unless:
    # A --help option enumeration ("--runtime, --llama-cpp-url, --url,
    # --model") lists long flags as documentation; it invokes nothing. A
    # genuine miner still matches xmrig-name and its cryptonight strings.
    - id: micro-behaviors/ui/help::long-option-enumeration

# Source-level identity that survives a product rename: XMRig's path
# placeholders (expanded in config paths) and its developer-donation banner.
- id: xmrig-path-placeholder-vars
  size_min: 512
  size_max: 500000000
  for:
  - binaries
  desc: XMRig config path placeholder variables
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\bXMRIG_(EXE_DIR|HOME_DIR|DATA_DIR|TEMP_DIR)\b'
- id: xmrig-dev-donate-banner
  size_min: 512
  size_max: 500000000
  for:
  - binaries
  desc: XMRig developer-donation status banner
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: dev donate started
composite_rules:
- id: xmrig-binary-markers
  desc: XMRig binary with path and donation fingerprints
  size_min: 512
  size_max: 500000000
  for: [binaries]
  crit: notable
  conf: 0.98
  all:
    - id: micro-behaviors/process/info/name::xmrig-product
    - id: xmrig-path-placeholder-vars
    - id: xmrig-dev-donate-banner
- id: xmrig-name
  size_min: 512
  size_max: 500000000
  desc: XMRig miner identity markers
  crit: notable
  conf: 0.9
  # Product identity does not establish unauthorized resource use.
  any:
  - id: xmrig-binary-markers
  - id: xmrig-title
  - id: xmrig-upper
  - id: xmrig-pascal
- id: user-flag
  size_min: 512
  size_max: 500000000
  desc: XMRig -u flag (wallet/user)
  crit: suspicious
  conf: 0.8
  attack: T1496
  any:
  - id: user-flag-u
  - id: user-flag-user
- id: pool-flag
  size_min: 512
  size_max: 500000000
  desc: XMRig -o flag (pool address)
  crit: suspicious
  conf: 0.8
  attack: T1496
  any:
  - id: pool-flag-o
  - id: pool-flag-url
- id: invocation
  size_min: 512
  size_max: 500000000
  desc: XMRig-style miner invocation
  conf: 0.95
  crit: suspicious
  mbc: B0036
  attack: T1496
  needs: 2
  any:
  - id: user-flag
  - id: pool-flag
  - id: micro-behaviors/communications/ip/endpoint::common-high-port-any

- id: cryptonight-implementation
  size_min: 512
  size_max: 500000000
  for: [python, javascript, powershell, pe, elf]
  desc: XMRig CryptoNight miner implementation
  crit: notable
  conf: 0.97
  all:
    - id: xmrig-name
    - id: micro-behaviors/crypto/hash/mining::cryptonight-str
  any:
    - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
    - id: micro-behaviors/data/config/syntax::json-donate-level-field
    - id: micro-behaviors/crypto/hash/mining::cn-v8
  needs: 1
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
