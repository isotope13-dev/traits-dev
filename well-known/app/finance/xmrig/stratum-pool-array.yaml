defaults:
  platforms: [linux, macos, windows]
  for: [pe]
  crit: notable
  conf: 0.96

composite_rules:
  - id: pe-stratum-pool-config-references
    desc: XMRig PE with Stratum and pool-array references
    all:
      - id: well-known/app/finance/xmrig::xmrig-name
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
    any:
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
    needs: 1
