# Nonempty-content bound; preserves every existing positive match.
defaults:
  size_min: 1
  for: [scripts, binaries, csharp]
  platforms: [macos, windows, linux]
traits:
  - id: monero-gui-name-at-least-four
    desc: At least four Monero GUI Wallet names
    crit: notable
    conf: 0.9
    count_min: 4
    size_min: 16
    if:
      type: text
      substr: Monero GUI Wallet
