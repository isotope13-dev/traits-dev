# Prysm is an Ethereum consensus client. Its wallet recovery, signed release
# downloads, and build-cleanup scripts are product/toolchain behavior, not
# credential theft or self-deletion.
defaults:
  platforms: [unix, windows]
  for: [go, shell, batch, github-actions, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree
    desc: Prysm source-tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])prysm@v[0-9]'
  - id: module-path
    desc: Prysm Go module path
    for: [go]
    if:
      type: text
      regex: '(?i)\bmodule\s+github\.com/prysmaticlabs/prysm\b'
  - id: project-readme
    desc: Prysm Ethereum client README
    for: [markdown]
    if:
      type: text
      substr: 'Prysm: An Ethereum 2.0 Client Written in Go'

composite_rules:
  - id: prysm-source-tree
    desc: Recognized Prysm Ethereum client source
    crit: exception
    scope: outer
    any:
      - id: source-tree
      - id: module-path
      - id: project-readme
