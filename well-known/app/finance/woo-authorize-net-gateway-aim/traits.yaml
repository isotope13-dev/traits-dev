# Woo Authorize.net AIM — Pledged Plugins WooCommerce gateway.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: woo-authorize-net-gateway-aim plugin path
    if:
      type: path
      regex: '(?i)(^|[\\/])woo-authorize-net-gateway-aim([\\/]|$)'

  - id: plugin-header-name
    desc: Authorize.net WooCommerce gateway plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Pledged Plugins Secure Gateway for Authorize\.net'

  - id: wc-authnet-text-domain
    desc: wc-authnet WordPress text domain
    for: [php]
    if:
      type: text
      substr: wc-authnet

  - id: wc-gateway-authnet-class
    desc: WC_Gateway_Authnet payment gateway class
    for: [php]
    if:
      type: text
      substr: class WC_Gateway_Authnet

composite_rules:
  - id: woo-authorize-net-gateway-aim-plugin
    desc: Pledged Plugins Authorize.net WooCommerce gateway
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: plugin-path
    any:
      - id: plugin-header-name
      - id: wc-authnet-text-domain
      - id: wc-gateway-authnet-class
