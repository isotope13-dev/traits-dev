defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  size_min: 1

traits:
- id: polygon-nodies-encoded
  desc: Encoded Polygon nodies endpoint
  crit: suspicious
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: polygon-public.nodies.app
- id: polygon-pokt-encoded
  desc: Encoded Polygon pokt endpoint
  crit: suspicious
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: polygon-pokt.nodies.app
