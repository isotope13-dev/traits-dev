defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-llamarpc-provider--source
  desc: LlamaRPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: eth.llamarpc.com
- id: ethereum-llamarpc-provider--binary
  desc: LlamaRPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: eth.llamarpc.com

composite_rules:
- id: ethereum-llamarpc-provider
  desc: LlamaRPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/llamarpc::ethereum-llamarpc-provider--source
    - id: well-known/app/finance/llamarpc::ethereum-llamarpc-provider--binary
