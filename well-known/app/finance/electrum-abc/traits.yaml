defaults:
  platforms: [unix, windows]
  for: [python, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name-marker
    desc: Electrum ABC package name marker
    for: [python]
    if:
      type: text
      substr: Electrum ABC

  - id: electrumabc-module-path
    desc: electrumabc Python package path
    for: [python]
    if:
      type: path
      regex: '(^|[/\\])electrumabc([/\\]|$)'

  - id: electrumabc-import
    desc: Imports electrumabc module
    for: [python]
    if:
      type: text
      substr: electrumabc

composite_rules:
  - id: electrum-abc-wallet
    desc: Electrum ABC eCash wallet
    crit: notable
    conf: 0.99
    any:
      - id: package-name-marker
      - id: electrumabc-module-path
      - id: electrumabc-import
