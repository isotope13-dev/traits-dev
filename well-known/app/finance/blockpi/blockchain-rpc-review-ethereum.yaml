defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-blockpi-provider--source
  desc: BlockPi Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: ethereum.blockpi.network/public
- id: ethereum-blockpi-provider--binary
  desc: BlockPi Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: ethereum.blockpi.network/public

composite_rules:
- id: ethereum-blockpi-provider
  desc: BlockPi Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/blockpi::ethereum-blockpi-provider--source
    - id: well-known/app/finance/blockpi::ethereum-blockpi-provider--binary
