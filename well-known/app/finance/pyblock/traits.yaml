# PyBlock (curly60e) is an open-source Lightning/Bitcoin node-management TUI.
# Its OP_RETURN viewer prints chain graffiti via a message API and its price
# tickers shell out to curl; chain data never reaches execution in the same
# file, so the blockchain-deaddrop coincidence needs a product context.
defaults:
  platforms: [unix, windows]
  for: [python, shell, zip, tar]
  crit: notable
  conf: 0.98

traits:
  - id: pyblock-source-tree-member
    desc: PyBlock node-manager source-tree member
    if:
      type: path
      regex: '(?i)(^|[\\\\/])pyblock([\\\\/]|@|$)'
  - id: pyblock-package-marker
    desc: PyBlock package marker
    for: [python, shell]
    if:
      type: text
      regex: '(?i)pybitblock'
