# SCADS DEX frontend SDK constants (PancakeSwap-style swap config).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 200000

traits:
  - id: scads-sdk-import
    desc: SCADS SDK package import
    if:
      type: text
      substr: '@scads/sdk'

  - id: scads-testnet-router
    desc: SCADS testnet router address
    if:
      type: text
      substr: '0x8e0A7Fde7E549Ea689c27A79d26798Cf8F27C8e8'

  - id: scads-treasury-name
    desc: SCADS Treasury product name
    if:
      type: text
      substr: SCADS Treasury

  - id: proof-of-holding-poh
    desc: SCADS Proof of Holding name
    if:
      type: text
      substr: 'Proof of Holding (POH)'

  - id: twine-hold-scads-wallets
    desc: TWINE earned by holding SCADS
    if:
      type: text
      substr: earn TWINE tokens by holding SCADS

composite_rules:
  - id: scads-swap-sdk
    desc: SCADS DEX swap SDK constants
    conf: 0.995
    all:
      - id: scads-sdk-import
      - id: scads-testnet-router

  - id: scads-ecosystem-docs
    desc: SCADS ecosystem documentation copy
    conf: 0.99
    needs: 2
    any:
      - id: scads-treasury-name
      - id: proof-of-holding-poh
      - id: twine-hold-scads-wallets

