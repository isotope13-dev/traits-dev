# SCADS DEX frontend SDK constants (PancakeSwap-style swap config).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 200000

traits:
  - id: scads-sdk-import
    desc: SCADS SDK package import
    if:
      type: text
      substr: '@scads/sdk'

  - id: scads-testnet-router
    desc: SCADS testnet router address
    if:
      type: text
      substr: '0x8e0A7Fde7E549Ea689c27A79d26798Cf8F27C8e8'

composite_rules:
  - id: scads-swap-sdk
    desc: SCADS DEX swap SDK constants
    conf: 0.995
    all:
      - id: scads-sdk-import
      - id: scads-testnet-router
