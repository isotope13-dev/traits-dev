# MetaMask — official Ethereum wallet (github.com/MetaMask).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.98

traits:
  - id: metamask-source-path
    desc: MetaMask source path or repository member
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[/\\])metamask([-_][\w-]+)?([/\\]|@|$)'

  - id: metamask-repository
    desc: MetaMask upstream GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/MetaMask/'

composite_rules:
  - id: metamask-wallet-context
    desc: MetaMask cryptocurrency wallet context
    conf: 0.99
    any:
      - id: metamask-source-path
      - id: metamask-repository
