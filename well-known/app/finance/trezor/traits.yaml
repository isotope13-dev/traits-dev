# Trezor — official cryptocurrency hardware wallet firmware and libraries (github.com/trezor).
defaults:
  platforms: [windows, unix]
  for: [source, scripts]
  size_max: 50000000
  crit: notable
  conf: 0.98

traits:
  - id: trezor-source-path
    desc: Trezor source path or repository member
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|/)(trezor|trezorlib|trezor-firmware)(/|@|$)'

  - id: trezor-repository
    desc: Trezor upstream GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/trezor/'

composite_rules:
  - id: trezor-wallet-context
    desc: Trezor cryptocurrency hardware wallet context
    conf: 0.99
    any:
      - id: trezor-source-path
      - id: trezor-repository
