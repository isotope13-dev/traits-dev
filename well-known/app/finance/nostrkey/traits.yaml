# NostrKey browser extension identity. It manages Nostr signing keys and
# includes its own secret-entry and vault-unlock UI.
defaults:
  platforms: [unix, windows]

traits:
  - id: extension-id
    desc: NostrKey Chrome extension signing identity
    crit: notable
    conf: 0.99
    for: [crx]
    if:
      type: value
      path: crx.extension_id
      exact: cggakcmbihnpmcddkkfmoglgaocnmaop

  - id: official-homepage
    desc: NostrKey extension homepage identity
    crit: notable
    conf: 0.98
    for: [chrome-manifest]
    if:
      type: value
      path: homepage_url
      exact: https://nostrkey.com

composite_rules:
  - id: nostrkey-extension-context
    desc: NostrKey extension identity
    crit: exception
    conf: 0.99
    scope: outer
    for: [crx, xpi, zip, chrome-manifest, html, javascript]
    all:
      - id: extension-id
      - id: official-homepage
