defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-nodereal-provider--source
  desc: NodeReal Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: eth-mainnet.nodereal.io
- id: ethereum-nodereal-provider--binary
  desc: NodeReal Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: eth-mainnet.nodereal.io

composite_rules:
- id: ethereum-nodereal-provider
  desc: NodeReal Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/nodereal::ethereum-nodereal-provider--source
    - id: well-known/app/finance/nodereal::ethereum-nodereal-provider--binary
