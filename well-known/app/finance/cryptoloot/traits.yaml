# CryptoLoot (CRLT) is a CoinHive-successor browser mining API that copied
# CoinHive's Anonymous/User bootstrap. A constructor reference establishes
# the family identity, not an unauthorized use of the visitor's CPU; the
# cryptojacking composites add the throttle and start evidence.
defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: cryptoloot-anonymous-construct
    desc: CryptoLoot anonymous miner construction
    if:
      type: text
      regex: new\s+CRLT\.(Anonymous|User)\s*\(
      exclude_html_comments: true
