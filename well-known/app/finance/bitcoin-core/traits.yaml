# Bitcoin Core source and test trees contain wallet path fixtures, encoded test
# vectors, and CI launch commands that resemble stealer/dropper behavior.
defaults:
  platforms: [unix, windows]
  for: [python, shell, github-actions, cmake, xml, zip, tar]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree-member
    for: [python, shell, github-actions, cmake, xml]
    desc: Bitcoin Core or Elements source member
    if:
      type: path
      regex: '(?i)(^|[\\/])(bitcoin|elements)([@\\/._-]|[0-9]|$)'

  - id: test-tree-member
    for: [python, shell, github-actions, cmake]
    desc: Bitcoin Core test, CI, or contrib member
    crit: notable
    if:
      type: path
      regex: '(?i)\bbitcoin[\w-]*[\\/](\.github|ci|test|contrib)([\\/]|$)'

  # The daemon's own --help text, embedded in every bitcoind build, identifies
  # the node binary itself (as opposed to its source tree, which the members
  # above identify by path).
  - id: bitcoind-daemon-banner
    for: [macho]
    desc: Bitcoin Core daemon help banner
    size_min: 1000000
    size_max: 300000000
    if:
      type: text
      section: __TEXT,__cstring
      substr: The Bitcoin Core daemon (bitcoind) is a headless program

  - id: msbuild-task-member
    desc: Bitcoin Core MSBuild task member
    if:
      type: path
      regex: '(?i)(^|[\\/])tasks[\\/][a-zA-Z0-9_.-]+\.targets$'

composite_rules:
  - id: bitcoin-core-test-context
    desc: Recognized Bitcoin Core test, CI, or contrib context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
      - id: test-tree-member

  - id: bitcoin-core-msbuild-context
    desc: Recognized Bitcoin Core MSBuild task context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
      - id: msbuild-task-member
