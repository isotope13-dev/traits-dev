# Bitcoin Core source and test trees contain wallet path fixtures, encoded test
# vectors, and CI launch commands that resemble stealer/dropper behavior.
defaults:
  platforms: [unix, windows]
  for: [python, shell, github-actions, archives, cmake, xml]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree-member
    desc: Bitcoin Core source-tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])bitcoin(-[0-9]|[\\/])'

  - id: test-tree-member
    desc: Bitcoin Core test or CI member
    if:
      type: path
      # The composite also requires `source-tree-member`, so a top-level test
      # or CI component is sufficient and remains valid after archive
      # extraction (where deep member prefixes are intentionally unavailable).
      regex: '(?i)(^|[\\/])(\.github|ci|test)([\\/]|$)'

  - id: msbuild-task-member
    desc: Bitcoin Core MSBuild task member
    if:
      type: path
      regex: '(?i)(^|[\\/])tasks[\\/][a-zA-Z0-9_.-]+\.targets$'

composite_rules:
  - id: bitcoin-core-test-context
    desc: Recognized Bitcoin Core source test context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
      - id: test-tree-member

  - id: bitcoin-core-msbuild-context
    desc: Recognized Bitcoin Core MSBuild task context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
      - id: msbuild-task-member
