# Bitcoin Core source and test trees contain wallet path fixtures, encoded test
# vectors, and CI launch commands that resemble stealer/dropper behavior.
defaults:
  platforms: [unix, windows]
  for: [python, shell, github-actions, archives, cmake]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree-member
    desc: Bitcoin Core source-tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])bitcoin(-[0-9]|[\\/])'

  - id: test-tree-member
    desc: Bitcoin Core test or CI member
    if:
      type: path
      regex: '(?i)(^|[\\/])(.github/workflows|ci/test|test/functional)([\\/]|$)'

composite_rules:
  - id: bitcoin-core-test-context
    desc: Recognized Bitcoin Core source test context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
      - id: test-tree-member
