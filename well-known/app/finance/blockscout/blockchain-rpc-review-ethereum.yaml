defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: blockscout-account-transaction-list
  desc: Blockscout account transaction-list references
  conf: 0.92
  for:
  - scripts
  - source
  - pe
  - dll
  if:
    type: text
    regex: (?i)blockscout\.com[\s\S]{0,240}module[=:]account[\s\S]{0,120}action[=:]txlist
- id: blockscout-host-unicode-encoded
  desc: Unicode-encoded Blockscout host
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: encoded
    encoding: unicode-escape
    substr: blockscout.com
- id: blockscout-host-fragment
  desc: Split Blockscout Ethereum host fragment
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: h.blocksco
- id: blockscout-ethereum-api-endpoint
  desc: Blockscout API endpoint reference
  crit: notable
  conf: 0.9
  for: [javascript, typescript, python]
  if:
    type: string_literal
    regex: '(?i)(https?://)?(eth\.)?blockscout\.com/api\b'
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - pe
  - dll
  id: blockscout-chain-host-reference
  desc: Blockscout chain host reference
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (eth|base|optimism)\.blockscout\.com
