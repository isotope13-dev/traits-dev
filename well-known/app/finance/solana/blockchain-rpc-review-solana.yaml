defaults:
  size_min: 1
  platforms: [unix, windows]

traits:
- id: solana-rpc-url--source
  desc: Solana RPC endpoint reference
  conf: 0.9
  for: [scripts, source]
  crit: component
  if:
    type: string_literal
    regex: api\.(mainnet(-beta)?|devnet|testnet)\.solana\.com
- id: solana-rpc-url--binary
  desc: Solana RPC endpoint reference
  conf: 0.9
  for: [binaries]
  crit: component
  if:
    type: string_literal
    regex: api\.(mainnet(-beta)?|devnet|testnet)\.solana\.com

composite_rules:
- id: solana-rpc-url
  desc: Solana RPC endpoint reference
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/solana::solana-rpc-url--source
    - id: well-known/app/finance/solana::solana-rpc-url--binary
