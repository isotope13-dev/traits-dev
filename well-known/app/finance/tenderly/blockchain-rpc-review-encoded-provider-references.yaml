defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  size_min: 1

traits:
- id: polygon-tenderly-encoded
  desc: Encoded Polygon tenderly endpoint
  crit: suspicious
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: polygon.gateway.tenderly.co
- id: polygon-tenderly-public-encoded
  desc: Encoded Tenderly public Polygon endpoint
  crit: suspicious
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: gateway.tenderly.co/public/polygon
