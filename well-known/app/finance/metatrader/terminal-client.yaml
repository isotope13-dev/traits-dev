defaults:
  platforms: [windows]
  for: [pe]

# MetaTrader 5 client binaries are very large and carry hundreds of thousands
# of strings. Both version fields must match; a product name alone is spoofable.
composite_rules:
  - id: metatrader5-client-terminal-identity
    desc: MetaTrader 5 client terminal product identity
    crit: notable
    conf: 0.95
    all:
      - id: metatrader5-client-product-name
      - id: metatrader5-client-company-name

traits:
  - id: metatrader5-client-product-name
    desc: Product name reads MetaTrader 5 Client Terminal
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: MetaTrader 5 Client Terminal

  - id: metatrader5-client-company-name
    desc: Company name reads MetaQuotes Ltd.
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: MetaQuotes Ltd.
