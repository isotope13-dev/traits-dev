# WildRig is a GPU miner. The name alone is the product, not proof it was launched.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  size_max: 500000000

traits:
  - id: wildrig-miner-name
    desc: WildRig GPU miner name
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)wildrig'
      section: any
