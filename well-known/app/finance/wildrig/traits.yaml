# WildRig is a GPU miner. The name alone is the product, not proof it was launched.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  size_max: 500000000

traits:
  - id: wildrig-miner-name
    desc: WildRig GPU miner name
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: WildRig
