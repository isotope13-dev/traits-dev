# hadoku-fidelity — Fidelity trading automation with FastAPI service.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package hadoku-fidelity
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*hadoku-fidelity\s*$'

  - id: hadoku-trader-github-repo
    desc: WolffM/hadoku-trader GitHub repository URL
    if:
      type: text
      substr: WolffM/hadoku-trader

  - id: hadoku-fidelity-module-path
    desc: hadoku_fidelity Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])hadoku_fidelity([\\/]|$)'

  - id: patchright-fidelity-browser
    desc: Patchright browser automation for Fidelity API
    for: [python]
    if:
      type: text
      substr: FidelityClientPatchright

composite_rules:
  - id: hadoku-fidelity-package
    desc: hadoku-fidelity Fidelity trading automation package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: hadoku-trader-github-repo
      - id: hadoku-fidelity-module-path
      - id: patchright-fidelity-browser
