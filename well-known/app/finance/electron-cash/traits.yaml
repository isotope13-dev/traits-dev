defaults:
  platforms: [unix, windows]
  for: [python, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name-marker
    desc: Electron Cash package name marker
    for: [python]
    if:
      type: text
      substr: Electron Cash

  - id: electroncash-module-path
    desc: electroncash Python package path
    for: [python]
    if:
      type: path
      regex: '(^|[/\\])electroncash([/\\]|$)'

  - id: electroncash-import
    desc: Imports electroncash module
    for: [python]
    if:
      type: text
      substr: electroncash

composite_rules:
  - id: electron-cash-wallet
    desc: Electron Cash Bitcoin Cash wallet
    crit: notable
    conf: 0.99
    any:
      - id: package-name-marker
      - id: electroncash-module-path
      - id: electroncash-import
