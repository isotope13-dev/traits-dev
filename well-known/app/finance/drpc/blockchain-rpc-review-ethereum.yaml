defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-drpc-provider--source
  desc: dRPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: eth.drpc.org
- id: ethereum-drpc-provider--binary
  desc: dRPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: eth.drpc.org
- id: ethereum-drpc-host-fragment--source
  desc: Split dRPC Ethereum host fragment
  conf: 0.9
  for: [scripts, source]
  crit: component
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])h\.drpc\.org'
- id: ethereum-drpc-host-fragment--binary
  desc: Split dRPC Ethereum host fragment
  conf: 0.9
  for: [binaries]
  crit: component
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])h\.drpc\.org'

composite_rules:
- id: ethereum-drpc-provider
  desc: dRPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/drpc::ethereum-drpc-provider--source
    - id: well-known/app/finance/drpc::ethereum-drpc-provider--binary
- id: ethereum-drpc-host-fragment
  desc: Split dRPC Ethereum host fragment
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/drpc::ethereum-drpc-host-fragment--source
    - id: well-known/app/finance/drpc::ethereum-drpc-host-fragment--binary
