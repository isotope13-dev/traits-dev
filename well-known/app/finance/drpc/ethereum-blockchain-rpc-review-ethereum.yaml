---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - go
  - scripts
  - source
  size_min: 1
traits:
- id: ethereum-drpc-host-fragment
  desc: Split dRPC Ethereum host fragment
  conf: 0.9
  for:
  - binaries
  - scripts
  - source
  - -clojure
  - -mirc
  - -ircii
  crit: notable
  if:
    type: text
    regex: "(?i)(^|[^a-z0-9])h\\.drpc\\.org"
- id: ethereum-drpc-provider
  desc: dRPC Ethereum JSON-RPC provider
  conf: 0.88
  for:
  - binaries
  - scripts
  - source
  - -clojure
  - -mirc
  - -ircii
  crit: notable
  if:
    type: text
    substr: eth.drpc.org
