# Web3Games (W3G) Next.js token-bridge UI.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: web3games-chain-name
    desc: Web3Games chain display name
    if:
      type: text
      substr: Web3Games

  - id: w3g-bridge-rate
    desc: W3G bridge rate display text
    if:
      type: text
      substr: '1 W3G on'

  - id: select-token-top-atom
    desc: Select_TokenTop jotai atom name
    if:
      type: text
      substr: Select_TokenTop

  - id: wallet-button-show-atom
    desc: WalletButtonShowState jotai atom name
    if:
      type: text
      substr: WalletButtonShowState

  - id: web3games-devnet-ws
    desc: Web3Games devnet WebSocket endpoint
    if:
      type: text
      substr: wss://devnet.web3games.org

composite_rules:
  - id: web3games-bridge-ui
    desc: Recognized Web3Games Next.js wallet UI
    all:
      - id: web3games-chain-name
    any:
      - id: w3g-bridge-rate
      - id: select-token-top-atom
      - id: wallet-button-show-atom
      - id: web3games-devnet-ws
