---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - go
  - scripts
  - source
  size_min: 1
traits:
- id: ethereum-1rpc-provider
  desc: 1RPC Ethereum JSON-RPC provider
  conf: 0.88
  for:
  - binaries
  - scripts
  - source
  - -clojure
  - -mirc
  - -ircii
  crit: notable
  if:
    type: text
    substr: 1rpc.io/eth
- id: ethereum-1rpc-path-fragment
  desc: Split 1RPC Ethereum path fragment
  conf: 0.9
  for:
  - binaries
  - scripts
  - source
  - -clojure
  - -mirc
  - -ircii
  crit: notable
  if:
    type: text
    regex: "(?i)(^|[^a-z0-9])pc\\.io/eth"
