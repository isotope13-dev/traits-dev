defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-1rpc-provider--source
  desc: 1RPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: 1rpc.io/eth
- id: ethereum-1rpc-provider--binary
  desc: 1RPC Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: 1rpc.io/eth
- id: ethereum-1rpc-path-fragment--source
  desc: Split 1RPC Ethereum path fragment
  conf: 0.9
  for: [scripts, source]
  crit: component
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])pc\.io/eth'
- id: ethereum-1rpc-path-fragment--binary
  desc: Split 1RPC Ethereum path fragment
  conf: 0.9
  for: [binaries]
  crit: component
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])pc\.io/eth'

composite_rules:
- id: ethereum-1rpc-provider
  desc: 1RPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/1rpc::ethereum-1rpc-provider--source
    - id: well-known/app/finance/1rpc::ethereum-1rpc-provider--binary
- id: ethereum-1rpc-path-fragment
  desc: Split 1RPC Ethereum path fragment
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/1rpc::ethereum-1rpc-path-fragment--source
    - id: well-known/app/finance/1rpc::ethereum-1rpc-path-fragment--binary
