# emoney-mcp — Claude Desktop MCP for Emoney Advisor (wealth.emaplan.com).
# Copies the operator's local Chrome cookies for emaplan.com only so the MCP
# can scrape the already-logged-in advisor session. Documented opt-in session
# reuse, not a credential stealer.
defaults:
  platforms: [windows, linux, macos]
  for: [python, text, scripts, source, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-tree-member
    desc: emoney-mcp package tree or wheel
    conf: 0.99
    if:
      type: path
      regex: '(?i)emoney_mcp'

  - id: emaplan-cookie-extract
    desc: emaplan.com Chrome cookie extract helper
    for: [python, scripts, source, text]
    conf: 0.99
    if:
      type: text
      substr: extract_chrome_emaplan_cookies

composite_rules:
  - id: session-reuse-context
    desc: emoney-mcp local Chrome session reuse for emaplan.com
    crit: exception
    conf: 0.99
    all:
      - id: package-tree-member
      - id: emaplan-cookie-extract
