defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  size_min: 1

traits:
- id: trongrid-api-encoded
  desc: Encoded TronGrid API endpoint
  crit: suspicious
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: api.trongrid.io
