defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  size_min: 1

traits:
- id: aptos-fullnode-encoded
  desc: Encoded Aptos fullnode endpoint
  crit: suspicious
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: fullnode.mainnet.aptoslabs.com
