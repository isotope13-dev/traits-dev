# Official Aptos CLI install scripts (aptos.dev/scripts/install_cli.sh and
# install_cli.ps1), fetched by aptos-labs/actions' install-aptos-cli composite
# action and by the documented bootstrap one-liners. The action stages the
# vendor script into RUNNER_TEMP and invokes it with installer flags
# (`-f -y --cli-version ...`) — software installation, not a dropper.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: aptos-cli-official-install-script-url
    desc: Official Aptos CLI installer script URL
    for: [powershell, github-actions, shell, text, markdown]
    if:
      type: text
      substr: aptos.dev/scripts/install_cli.
