defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.82
  size_min: 1

traits:
- id: aptos-fullnode-provider--source
  desc: Aptos fullnode mainnet endpoint
  for: [scripts, source]
  crit: component
  if:
    type: string_literal
    substr: fullnode.mainnet.aptoslabs.com
- id: aptos-fullnode-provider--binary
  desc: Aptos fullnode mainnet endpoint
  for: [binaries]
  crit: component
  if:
    type: string_literal
    substr: fullnode.mainnet.aptoslabs.com

composite_rules:
- id: aptos-fullnode-provider
  desc: Aptos fullnode mainnet endpoint
  crit: notable
  any:
    - id: well-known/app/finance/aptos::aptos-fullnode-provider--source
    - id: well-known/app/finance/aptos::aptos-fullnode-provider--binary
