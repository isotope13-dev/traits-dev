# PancakeSwap frontend Cypress helper: injects an ethers Eip1193Bridge
# mock wallet over BSC dataseed for swap UI tests.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 50000

traits:
  - id: never-use-test-address
    desc: PancakeSwap Cypress never-use test address
    if:
      type: text
      substr: TEST_ADDRESS_NEVER_USE

  - id: eip1193-bridge-import
    desc: ethers experimental EIP-1193 bridge import
    if:
      type: text
      substr: '@ethersproject/experimental/lib/eip1193-bridge'

  - id: connector-id-v2
    desc: PancakeSwap connectorIdv2 storage key
    if:
      type: literal
      exact: connectorIdv2

composite_rules:
  - id: cypress-eip1193-wallet-mock
    desc: PancakeSwap Cypress EIP-1193 wallet mock
    conf: 0.995
    needs: 2
    any:
      - id: never-use-test-address
      - id: eip1193-bridge-import
      - id: connector-id-v2
