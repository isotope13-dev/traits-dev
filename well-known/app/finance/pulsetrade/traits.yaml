# PulseTrade.Comm.Spa.Dynamic — F#/WebSharper SDUI actor SPA.
# WebSocket sync, XHR, and WebSharper eval are the product runtime,
# not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [nupkg, dll, javascript, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: nuget-package-id
    desc: PulseTrade Spa.Dynamic NuGet id
    for: [nupkg]
    if:
      type: value
      path: nupkg.id
      exact: PulseTrade.Comm.Spa.Dynamic

  - id: nuget-repository-url
    desc: PulseTrade Spa.Dynamic repository URL
    for: [nupkg]
    if:
      type: value
      path: nupkg.repository_url
      exact: https://github.com/ingted/PulseTrade.Comm.Spa.Dynamic.git

  - id: github-repo
    desc: PulseTrade Spa.Dynamic GitHub repository
    if:
      type: text
      substr: github.com/ingted/PulseTrade.Comm.Spa.Dynamic

  - id: add-key-renderer
    desc: PulseTrade add-key renderer hook
    for: [javascript, text]
    if:
      type: text
      substr: PulseTradeRegisterAddKeyRenderer

composite_rules:
  - id: pulsetrade-spa-dynamic-nupkg
    desc: PulseTrade Spa.Dynamic NuGet package
    crit: notable
    conf: 0.99
    for: [nupkg]
    all:
      - id: nuget-package-id
      - id: nuget-repository-url

  - id: pulsetrade-spa-dynamic-package
    desc: PulseTrade Spa.Dynamic package identity
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: nuget-package-id
      - id: nuget-repository-url
      - id: github-repo
      - id: add-key-renderer
    needs: 2
