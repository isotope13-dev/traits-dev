defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: blockstream-detached-fetch-or-chmod-clues
  desc: Blockstream, detached spawn and file-operation clues
  crit: suspicious
  conf: 0.98
  attack: T1102,T1105,T1059.007
  mbc: B0024
  for:
    - javascript
    - typescript
    - npm
    - tar
  scope: archive
  all:
    - id: micro-behaviors/communications/http/services/blockchain::blockstream-explorer-endpoint
    - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  any:
    - id: micro-behaviors/fs/chmod/modify::node-chmod-owner-only-700
    - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
    - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-argv
  needs: 1
