defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-mevblocker-provider--source
  desc: MEV Blocker Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: rpc.mevblocker.io
- id: ethereum-mevblocker-provider--binary
  desc: MEV Blocker Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: rpc.mevblocker.io

composite_rules:
- id: ethereum-mevblocker-provider
  desc: MEV Blocker Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/mev-blocker::ethereum-mevblocker-provider--source
    - id: well-known/app/finance/mev-blocker::ethereum-mevblocker-provider--binary
