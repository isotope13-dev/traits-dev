# JPMorgan Quorum — Ethereum-based permissioned ledger (go-ethereum fork).
defaults:
  platforms: [unix, windows]
  for: [go, shell, text, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: quorum-module-cache-path
    desc: Quorum Go module cache source path
    for: [go, shell, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])quorum@v[0-9]'
  - id: quorum-readme-identity
    desc: Quorum project README identity
    for: [markdown, text]
    if:
      type: text
      regex: '(?m)^# Quorum\s*$'
  - id: constellation-privacy-reference
    desc: Quorum Constellation privacy component reference
    if:
      type: text
      substr: 'github.com/jpmorganchase/constellation'
  - id: puppeth-node-dockerfile-marker
    desc: Puppeth Ethereum node Dockerfile template
    for: [go]
    if:
      type: text
      substr: 'var nodeDockerfile ='
