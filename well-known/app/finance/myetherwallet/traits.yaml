# MyEtherWallet — open-source client-side Ethereum wallet (github.com/myetherwallet/myetherwallet).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.98

traits:
  - id: myetherwallet-package-name
    desc: MyEtherWallet package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: myetherwallet

  - id: myetherwallet-repository
    desc: MyEtherWallet GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/myetherwallet/myetherwallet'

  - id: myetherwallet-source-path
    desc: MyEtherWallet source path
    if:
      type: path
      regex: '(?i)(^|[/\\])myetherwallet([/\\]|@|$)'

composite_rules:
  - id: myetherwallet-wallet-context
    desc: MyEtherWallet cryptocurrency wallet context
    conf: 0.99
    any:
      - id: myetherwallet-package-name
      - id: myetherwallet-repository
      - id: myetherwallet-source-path
