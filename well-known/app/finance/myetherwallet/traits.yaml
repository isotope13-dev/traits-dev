defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]

traits:
  - id: myetherwallet-package-name
    desc: MyEtherWallet package name
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: name
      exact: myetherwallet

  - id: myetherwallet-repository
    desc: MyEtherWallet GitHub repository
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/MyEtherWallet/MyEtherWallet
