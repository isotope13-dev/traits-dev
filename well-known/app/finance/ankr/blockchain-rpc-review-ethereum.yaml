defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-ankr-provider--source
  desc: Ankr Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: rpc.ankr.com/eth
- id: ethereum-ankr-provider--binary
  desc: Ankr Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: rpc.ankr.com/eth

composite_rules:
- id: ethereum-ankr-provider
  desc: Ankr Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/ankr::ethereum-ankr-provider--source
    - id: well-known/app/finance/ankr::ethereum-ankr-provider--binary
