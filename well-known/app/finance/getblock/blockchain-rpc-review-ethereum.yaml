defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-getblock-provider--source
  desc: GetBlock Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: go.getblock.io
- id: ethereum-getblock-provider--binary
  desc: GetBlock Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: go.getblock.io

composite_rules:
- id: ethereum-getblock-provider
  desc: GetBlock Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/finance/getblock::ethereum-getblock-provider--source
    - id: well-known/app/finance/getblock::ethereum-getblock-provider--binary
