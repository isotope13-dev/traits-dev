# prediction-market-agent-tooling — Gnosis prediction market agent SDK.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: prediction-market-agent-tooling wheel
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: prediction-market-agent-tooling

  - id: package-metadata-name
    desc: prediction-market-agent-tooling PyPI name
    for: [json, markdown, text]
    if:
      type: text
      substr: 'Name: prediction-market-agent-tooling'

  - id: gnosis-author
    desc: Gnosis prediction market tooling author
    for: [json, markdown, text]
    if:
      type: text
      substr: 'Author: Gnosis'

  - id: module-path
    desc: prediction_market_agent_tooling package path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)prediction_market_agent_tooling/'

  - id: agent-market-class
    desc: prediction market AgentMarket class marker
    for: [python]
    if:
      type: text
      substr: class AgentMarket

  - id: gnosis-github-repo
    desc: gnosis prediction-market-agent-tooling repo
    for: [json, markdown, text, python]
    if:
      type: text
      substr: gnosis/prediction-market-agent-tooling

composite_rules:
  - id: prediction-market-agent-tooling-package
    desc: Gnosis prediction market agent tooling package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
