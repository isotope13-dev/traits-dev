# btcd — the btcsuite alternative Bitcoin full-node implementation in Go, plus
# its btcutil/btcwallet siblings. Like every Bitcoin node it ships the network's
# public bootstrap seed lists in chaincfg, and the signet seed set includes a
# Tor onion peer, so the source tree trips embedded-onion-endpoint heuristics on
# what is ordinary P2P bootstrap infrastructure.
defaults:
  platforms: [unix, windows]
  for: [go, elf, pe, macho, tar, zip]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 200000000

traits:
  - id: btcd-module-path
    desc: btcd module path
    if:
      type: text
      substr: github.com/btcsuite/btcd

  - id: btcd-chain-params-declaration
    desc: btcd chaincfg network params declaration
    for: [go]
    if:
      type: text
      regex: '\b(MainNetParams|SigNetParams|TestNet3Params)\s*=\s*Params\{'

composite_rules:
  # Both legs required: the module path alone also appears in projects that
  # merely import btcd, while the network-parameter declaration anchors the
  # match to btcd's own source. Archive scope joins go.mod to chaincfg source.
  - id: btcd-source-tree
    desc: Recognized btcd Bitcoin node source tree
    crit: notable
    conf: 0.99
    for: [go, tar, zip]
    all:
      - id: btcd-module-path
      - id: btcd-chain-params-declaration
    scope: archive
