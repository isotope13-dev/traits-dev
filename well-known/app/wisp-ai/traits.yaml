# wisp-ai — delehner Wisp AI pipeline VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: wisp-ai-vsix-name
    desc: Wisp AI VSIX archive name
    if:
      type: path
      regex: '(?i)delehner\.wisp-ai'

  - id: wisp-ai-package-name
    desc: Wisp AI extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"wisp-ai"'

  - id: wisp-ai-publisher
    desc: delehner VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"delehner"'

  - id: wisp-ai-command-namespace
    desc: Wisp AI command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: wisp.

composite_rules:
  - id: wisp-ai-vscode-extension
    desc: Wisp AI pipeline CLI VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: wisp-ai-publisher
    any:
      - id: wisp-ai-vsix-name
      - id: wisp-ai-package-name
      - id: wisp-ai-command-namespace
