# OPC-Agents is an AI task-execution application. Its LLM, SMTP, filesystem,
# subprocess, and external-skill capabilities are product functionality; these
# rules identify the package so analysts can interpret those capabilities in context.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: OPC-Agents Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: opc_agents

  - id: package-name
    desc: OPC-Agents package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: opc-agents

  - id: project-repository
    desc: OPC-Agents upstream repository
    if:
      type: text
      exact: https://github.com/lulin70/OPC-Agents

  - id: python-module-marker
    desc: OPC-Agents manager module marker
    for: [python]
    if:
      type: import
      regex: '^opc_manager(\.|$)'

composite_rules:
  - id: application-identity
    desc: OPC-Agents AI task-execution application identity
    crit: notable
    conf: 0.99
    any:
      - id: wheel-distribution
      - id: package-name
      - id: project-repository
      - id: python-module-marker
