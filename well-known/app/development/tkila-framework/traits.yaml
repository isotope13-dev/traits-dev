# tkila-framework — Teko Estudio PHP API framework library.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: framework-path
    desc: tkila-framework archive member path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])tkila-framework'

  - id: composer-package-name
    desc: teko/tkila-framework Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: teko/tkila-framework

  - id: gitlab-repository
    desc: teko-estudio tkila-framework GitLab repository
    for: [json, markdown, text, php]
    if:
      type: text
      substr: gitlab.com/teko-estudio/tkila-framework

composite_rules:
  - id: tkila-framework-package
    desc: Teko Estudio tkila API framework library
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: framework-path
      - id: composer-package-name
      - id: gitlab-repository
