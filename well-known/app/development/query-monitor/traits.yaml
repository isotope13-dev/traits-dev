# Query Monitor — John Blackbourn WordPress developer tools plugin.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: plugin-path
    desc: johnbillion-query-monitor plugin path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])johnbillion-query-monitor'

  - id: plugin-header-name
    desc: Query Monitor WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)Plugin Name:\s*Query Monitor\s*$'

  - id: query-monitor-text-domain
    desc: query-monitor WordPress text domain
    for: [php]
    if:
      type: text
      substr: query-monitor

  - id: composer-package-name
    desc: johnbillion/query-monitor Composer package
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: johnbillion/query-monitor

composite_rules:
  - id: query-monitor-wordpress-plugin
    desc: Query Monitor WordPress developer tools plugin
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: plugin-path
      - id: plugin-header-name
      - id: composer-package-name
