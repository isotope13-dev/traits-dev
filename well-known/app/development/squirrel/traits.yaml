# Squirrel.Windows is the Electron/.NET app updater framework: its
# Update/SyncReleases binaries download release packages to a temp
# directory and launch the updated app by design.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.97
  size_max: 50000000

traits:
  - id: squirrel-windows-updater
    desc: Squirrel.Windows updater framework binary
    if:
      type: text
      substr: "Squirrel.FileDownloader"
      section: .text
