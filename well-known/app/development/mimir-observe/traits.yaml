# mimir-observe — AI agent auto-instrumentation and observability.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name mimir-observe
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*mimir-observe\s*$'

  - id: mimir-github-repo
    desc: TA-Studios mimir GitHub repository URL
    if:
      type: text
      substr: TA-Studios-AI-Avengers/mimir

  - id: mimir-instrument-openai-marker
    desc: mimir.instrument_openai SDK hook marker
    for: [python]
    if:
      type: text
      substr: instrument_openai

composite_rules:
  - id: mimir-observe-package
    desc: mimir-observe AI agent observability package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: mimir-github-repo
      - id: mimir-instrument-openai-marker
