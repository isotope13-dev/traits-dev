# Anjor — observability and reliability platform for agentic AI.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name anjor
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*anjor\s*$'

  - id: anjor-github-repo
    desc: anjor-labs/anjor GitHub repository URL
    if:
      type: text
      substr: anjor-labs/anjor

  - id: anjor-module-path
    desc: anjor Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])anjor([\\/]|$)'

composite_rules:
  - id: anjor-package
    desc: Anjor agent observability platform package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: anjor-github-repo
      - id: anjor-module-path
