# symfony/phpunit-bridge — PHPUnit testing utilities for Symfony projects.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, json, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: composer-package-name
    desc: symfony/phpunit-bridge Composer package name
    for: [json, text]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"symfony/phpunit-bridge"'

  - id: phpunit-bridge-namespace
    desc: Symfony PHPUnit bridge namespace
    for: [php]
    if:
      type: text
      substr: 'Symfony\\Bridge\\PhpUnit'

  - id: simple-phpunit-bin
    desc: Symfony simple-phpunit test runner script
    for: [php]
    if:
      type: path
      regex: '(?i)bin[/+]simple-phpunit(\.php)?$'

composite_rules:
  - id: symfony-phpunit-bridge-package
    desc: symfony/phpunit-bridge PHPUnit testing utilities
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: composer-package-name
    any:
      - id: phpunit-bridge-namespace
      - id: simple-phpunit-bin
