# aioesphomeapi — official ESPHome device API Python library.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: pkginfo-name
    desc: PyPI package name aioesphomeapi
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*aioesphomeapi\s*$'

  - id: esphome-homepage-url
    desc: ESPHome project homepage URL
    if:
      type: text
      substr: esphome.io

  - id: esphome-github-repo
    desc: esphome/aioesphomeapi repository URL
    if:
      type: text
      substr: esphome/aioesphomeapi

composite_rules:
  - id: aioesphomeapi-package
    desc: ESPHome aioesphomeapi Python client library
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: esphome-homepage-url
      - id: esphome-github-repo
