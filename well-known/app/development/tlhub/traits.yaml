# tlhub — local TORCH_TRACE run hub for PyTorch compile debugging.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: tlhub Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: tlhub

  - id: package-metadata-name
    desc: tlhub PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: tlhub'

  - id: module-path
    desc: tlhub Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)tlhub/'

  - id: torch-trace-marker
    desc: TORCH_TRACE trace hub marker string
    for: [python, markdown, text]
    if:
      type: text
      substr: TORCH_TRACE

  - id: github-repo
    desc: bobrenjc93 tlhub GitHub repository
    for: [json, markdown, text, python, pkginfo]
    if:
      type: text
      substr: bobrenjc93/tlhub

composite_rules:
  - id: tlhub-package
    desc: tlhub PyTorch TORCH_TRACE local run hub
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
