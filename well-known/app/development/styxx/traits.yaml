# Styxx — Fathom Lab LLM agent cognitive vitals monitor.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95

traits:
  - id: pkginfo-name
    desc: PyPI package name styxx
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*styxx\s*$'

  - id: tagline-marker
    desc: Styxx nothing crosses unseen tagline
    for: [pkginfo, text, python]
    if:
      type: text
      substr: nothing crosses unseen

  - id: fathom-homepage-url
    desc: Fathom Lab Styxx project homepage URL
    if:
      type: text
      substr: fathom.darkflobi.com/styxx

  - id: styxx-console-entrypoint
    desc: styxx console_scripts entry point
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^styxx\s*=\s*styxx\.cli:'

  - id: chart-audit-log-path
    desc: Styxx chart.jsonl audit log path reference
    for: [python]
    if:
      type: text
      substr: chart.jsonl

composite_rules:
  - id: styxx-package
    desc: Styxx LLM cognitive vitals monitor package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: tagline-marker
      - id: fathom-homepage-url
      - id: styxx-console-entrypoint
