# Lyric is a .NET-distributed programming-language tool.  Its package ships
# compiler/runtime libraries and a Maven dependency resolver; those are
# benign toolchain identity markers, not evidence of a backdoor.
defaults:
  platforms: [windows, unix]
  for: [csharp, pe, dll, jar, nupkg, xml, data]
  crit: notable
  conf: 0.97

traits:
  - id: lyric-dotnet-tool-manifest
    desc: Tool manifest declares the Lyric command
    for: [xml, data]
    size_min: 100
    size_max: 300000000
    if:
      type: text
      exclude_html_comments: true
      regex: '<Command\b[^>]{0,160}\bName\s*=\s*["'']lyric["'']'
      case_insensitive: true

  - id: lyric-package-name
    desc: NuGet package declares Lyric identity
    for: [nupkg]
    size_min: 100
    size_max: 300000000
    if:
      type: value
      path: nupkg.name
      exact: Lyric
      case_insensitive: true

  - id: lyric-managed-assembly
    desc: Lyric managed compiler assembly
    for: [csharp, pe, dll]
    size_min: 1000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^Lyric\.(Stdlib|Jvm|Msil|Lyric)\.[A-Za-z0-9]+$'

  - id: lyric-maven-resolver
    desc: Lyric embedded Maven resolver
    for: [jar]
    size_min: 1000
    size_max: 30000000
    if:
      type: basename
      exact: lyric-resolver.jar

composite_rules:
  - id: lyric-toolchain
    desc: Lyric development toolchain
    crit: notable
    any:
      - id: lyric-dotnet-tool-manifest
      - id: lyric-package-name
      - id: lyric-managed-assembly
      - id: lyric-maven-resolver
