# @superdoc/docx-engine — SuperDoc programmatic DOCX editing engine (npm).
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, archives, javascript, typescript]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: npm-package-name
    desc: SuperDoc docx-engine npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@superdoc/docx-engine"

  - id: superdoc-homepage
    desc: SuperDoc product homepage URL
    if:
      type: text
      substr: superdoc.dev

  - id: docx-engine-license-marker
    desc: SuperDoc docx-engine license file marker
    if:
      type: text
      substr: DOCX-ENGINE-LICENSE

composite_rules:
  - id: superdoc-docx-engine-package
    desc: SuperDoc docx-engine npm package
    crit: notable
    conf: 0.96
    scope: archive
    any:
      - id: npm-package-name
      - id: superdoc-homepage
      - id: docx-engine-license-marker
    needs: 2
