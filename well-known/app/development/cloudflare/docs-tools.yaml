# Cloudflare docs tools sync-github-issue-to-jira utility.
# Synchronizes GitHub issues into Jira using GitHub and Jira REST APIs.
# The credentials read from the environment authenticate API requests via
# HTTP headers rather than being exfiltrated in the request body.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: sync-github-issue-to-jira-cli
    desc: Cloudflare sync-github-issue-to-jira CLI
    if:
      type: text
      substr: "sync-github-issue-to-jira"

  - id: cloudflare-access-header-literal
    desc: Cloudflare Access service token header literal
    if:
      type: text
      regex: '(?i)["'']cf-access-client-(id|secret)["'']'

  - id: jira-issue-creation-response-marker
    desc: Jira issue creation response marker
    if:
      type: text
      substr: "successfully created internal JIRA issue"

composite_rules:
  - id: cloudflare-github-jira-sync-context
    desc: Cloudflare GitHub to Jira issue synchronization tool context
    crit: exception
    conf: 0.99
    all:
      - id: sync-github-issue-to-jira-cli
      - id: cloudflare-access-header-literal
    any:
      - id: jira-issue-creation-response-marker
      - id: micro-behaviors/communications/http/authorization-header::go-authorization-set
