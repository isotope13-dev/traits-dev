# Cloudflare brand references in document text.
#
# Relocated from objectives/evasion/masquerade/brand/keywords/, whose own
# header already conceded the neutrality: a page titled as Cloudflare is just
# as likely a legitimate Cloudflare property -- or a `<title>Cloudflare</title>`
# accessibility label inside an SVG logo, which is how an npm package's
# integration-logo sheet matched -- as a phishing lure. The matcher sees only
# "the Cloudflare name inside a title element", so that is all this states.
# Impersonation intent comes from the composites in
# objectives/credential-access/phishing/captcha/, which pair this branding with
# Turnstile/CAPTCHA lure text and redirect behavior.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  size_min: 64
  size_max: 100000000

traits:
  - id: cloudflare-title-element
    desc: Cloudflare brand name in title element
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)<title.{0,40}>.{0,80}cloudflare
