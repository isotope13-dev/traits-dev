defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]
  size_min: 1

traits:
- id: ethereum-cloudflare-provider--source
  desc: Cloudflare Ethereum JSON-RPC provider
  conf: 0.88
  for: [scripts, source]
  crit: component
  if:
    type: text
    substr: cloudflare-eth.com
- id: ethereum-cloudflare-provider--binary
  desc: Cloudflare Ethereum JSON-RPC provider
  conf: 0.88
  for: [binaries]
  crit: component
  if:
    type: text
    substr: cloudflare-eth.com

composite_rules:
- id: ethereum-cloudflare-provider
  desc: Cloudflare Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  any:
    - id: well-known/app/development/cloudflare::ethereum-cloudflare-provider--source
    - id: well-known/app/development/cloudflare::ethereum-cloudflare-provider--binary
