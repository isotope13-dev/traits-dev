# gitpod-flex — Gitpod Ona remote development VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: publisher
    desc: gitpod VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: gitpod

  - id: package-name
    desc: gitpod-flex VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: gitpod-flex

  - id: gitpod-flex-command-prefix
    desc: gitpod-flex VS Code command namespace
    for: [package.json, json, javascript]
    if:
      type: text
      substr: gitpod-flex.

composite_rules:
  - id: gitpod-flex-extension
    desc: Gitpod Ona remote development VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
