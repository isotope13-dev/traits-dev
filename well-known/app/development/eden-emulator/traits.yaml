# Eden — Nintendo Switch emulator distributed as a Linux AppImage with the
# uruntime/AppImageKit memfd-exec bootstrap.
defaults:
  platforms: [linux]
  for: [elf, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 500000000

traits:
  - id: appimage-filename
    desc: Eden Linux AppImage filename marker
    if:
      type: text
      regex: '(?i)Eden-Linux-[^/]{1,80}\.AppImage'

  - id: release-zsync-url
    desc: Eden nightly AppImage zsync URL
    if:
      type: text
      substr: nightly.eden-emu.dev/latest/Eden-Linux

composite_rules:
  - id: eden-appimage-runtime-context
    desc: Eden AppImage with uruntime bootstrap
    crit: notable
    conf: 0.99
    all:
      - id: appimage-filename
      - id: well-known/lib/runtime/uruntime::runtime-banner

  - id: eden-appimage-context
    desc: Recognized Eden Linux AppImage runtime
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: eden-appimage-runtime-context
      - id: release-zsync-url
