defaults:
  platforms: [windows]
  for: [pe]
  size_max: 209715200
  crit: notable
  conf: 0.96
traits:
  - id: logitech-ghub-library-name
    crit: notable
    desc: Logitech G HUB library name
    if:
      type: path
      regex: '(?i)Logi(tech)?_\w+_Library(@|\.dll|$)'
composite_rules:
  - id: logitech-ghub-installer-bundle
    crit: notable
    desc: Logitech G HUB installer bundle
    any:
      - id: metadata/signed/certificate/subject::logitech-primary-signer
      - id: logitech-ghub-library-name
