# linthis — cross-platform multi-language linter and formatter (Rust crate).
defaults:
  platforms: [linux, macos, windows]
  for: [rust, crate, cargo.toml]
  crit: notable
  conf: 0.95

traits:
  - id: linthis-crate-name
    desc: linthis crate package name
    for: [crate, cargo.toml]
    if:
      type: value
      path: crate.name
      exact: linthis

  - id: linthis-github-repo
    desc: linthis GitHub repository URL
    if:
      type: text
      substr: github.com/zhlinh/linthis

  - id: linthis-hook-script-module
    desc: linthis git hook script generator module
    for: [rust]
    if:
      id: micro-behaviors/process/create/shell/target::rust-hook-script-module-path

composite_rules:
  - id: linthis-package
    desc: linthis multi-language linter and formatter
    crit: notable
    conf: 0.96
    any:
      - id: linthis-crate-name
      - id: linthis-github-repo
