# zshrs — compiled zsh-compatible shell (MenkeTechnologies / StrykeLang).
defaults:
  platforms: [linux, macos, windows]
  for: [rust, crate, shell, cargo.toml]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: zshrs-crate-name
    desc: zshrs Rust crate package name
    for: [cargo.toml, rust, crate]
    if:
      type: text
      substr: 'name = "zshrs"'

  - id: zshrs-author
    desc: zshrs crate author MenkeTechnologies
    for: [cargo.toml, rust, crate]
    if:
      type: text
      substr: MenkeTechnologies

  - id: zshrs-test-corpus-path
    desc: zshrs zsh regression test corpus path
    for: [shell, rust, crate]
    if:
      type: path
      regex: '(^|[/\\])test_corpus[/\\].+\.ztst$'

composite_rules:
  - id: zshrs-crate-context
    desc: zshrs compiled zsh shell crate
    crit: notable
    conf: 0.99
    any:
      - id: zshrs-crate-name
      - id: zshrs-author
