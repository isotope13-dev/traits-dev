# dbp/relay-authorization-bundle — Digital Blueprint Relay authorization module.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: relay-authorization-composer-name
    desc: dbp/relay-authorization-bundle package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: dbp/relay-authorization-bundle

  - id: relay-authorization-github-repo
    desc: digital-blueprint relay-authorization repo URL
    if:
      type: text
      substr: digital-blueprint/relay-authorization-bundle

  - id: dbp-relay-bundle-class
    desc: DbpRelayAuthorizationBundle PHP class
    for: [php]
    if:
      type: text
      substr: DbpRelayAuthorizationBundle

composite_rules:
  - id: dbp-relay-authorization-bundle
    desc: Digital Blueprint Relay authorization Symfony bundle
    crit: notable
    conf: 0.98
    any:
      - id: relay-authorization-composer-name
      - id: relay-authorization-github-repo
