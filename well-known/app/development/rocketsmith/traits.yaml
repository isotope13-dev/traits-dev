# RocketSmith — MCP toolchain for model rocket design and build.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: rocketsmith Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: rocketsmith

  - id: package-metadata-name
    desc: rocketsmith PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: rocketsmith'

  - id: module-path
    desc: rocketsmith Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)rocketsmith/'

  - id: github-repo
    desc: ppak10 RocketSmith GitHub repository
    for: [json, markdown, text, python, pkginfo]
    if:
      type: text
      substr: ppak10/RocketSmith

  - id: openrocket-jar-marker
    desc: OpenRocket JAR discovery helper marker
    for: [python]
    if:
      type: text
      substr: OPENROCKET_JAR

composite_rules:
  - id: rocketsmith-package
    desc: RocketSmith model rocket MCP toolchain package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
