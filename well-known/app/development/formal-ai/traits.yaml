# formal-ai — Unlicense Rust crate: formal symbolic AI POC with
# OpenAI-compatible HTTP APIs (github.com/link-assistant/formal-ai).
defaults:
  platforms: [unix, windows]
  for: [rust, crate, cargo.toml]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 5000000

traits:
  - id: formal-ai-crate-name
    desc: formal-ai Rust crate package name
    for: [cargo.toml, crate]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: formal-ai

  - id: formal-ai-lib-name
    desc: formal_ai Rust library name
    for: [cargo.toml, crate]
    conf: 0.98
    if:
      type: text
      substr: 'name = "formal_ai"'

  - id: formal-ai-github-repo
    desc: formal-ai upstream GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/link-assistant/formal-ai'

  # Anchored on a path separator and the version digit that follows the crate
  # name, so the unpacked `formal-ai-<version>/` tree matches while an
  # unrelated path containing "informal-ai-…" does not.
  - id: formal-ai-crate-path
    desc: formal-ai crate source path fragment
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])formal-ai-[0-9]'

  - id: formal-ai-telegram-runtime-type
    desc: formal-ai TelegramPollingRuntimeError type
    for: [rust]
    conf: 0.97
    if:
      type: text
      substr: TelegramPollingRuntimeError

composite_rules:
  - id: formal-ai-crate-identity
    desc: formal-ai symbolic AI crate identity
    crit: notable
    conf: 0.98
    any:
      - id: formal-ai-crate-name
      - id: formal-ai-lib-name
      - id: formal-ai-github-repo
      - id: formal-ai-crate-path
      - id: formal-ai-telegram-runtime-type
