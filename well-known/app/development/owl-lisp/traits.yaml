# Owl Lisp is a purely functional Scheme dialect. ovm is its small register
# VM used to run precompiled fasl heap images; the VM exposes sockets, exec,
# and terminal control as language primitives — not a reverse shell.
# Identity composite: well-known/app/development/owl-lisp::owl-ovm-runtime
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 2000000

traits:
  - id: ovm-basename
    desc: Owl Lisp OVM executable basename
    if:
      type: basename
      exact: ovm

  - id: ovm-adjust-heap
    desc: Owl Lisp OVM heap adjuster symbol
    if:
      type: text
      section: strtab
      exact: adjust_heap

  - id: ovm-max-heap-mb
    desc: Owl Lisp OVM max-heap config symbol
    if:
      type: text
      section: strtab
      exact: max_heap_mb

  - id: ol-runtime-banner
    desc: Owl Lisp functional scheme banner
    size_min: 100000
    size_max: 5000000
    if:
      type: text
      section: .rodata
      substr: 'Owl Lisp -- a functional scheme'

  - id: ol-upstream-url
    desc: Owl Lisp upstream project URL
    size_min: 100000
    size_max: 5000000
    if:
      type: text
      section: .rodata
      substr: haltp.org/owl

composite_rules:
  - id: owl-ovm-runtime
    desc: Owl Lisp OVM bytecode runtime
    crit: notable
    conf: 1.0
    all:
      - id: ovm-basename
      - id: ovm-adjust-heap

  - id: owl-lisp-compiler
    desc: Owl Lisp ol compiler frontend
    crit: notable
    conf: 1.0
    all:
      - id: ol-runtime-banner
      - id: ol-upstream-url
