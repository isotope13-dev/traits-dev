# ddapm-test-agent — Datadog APM client library test harness.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: ddapm_test_agent Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ddapm_test_agent

  - id: package-metadata-name
    desc: ddapm-test-agent PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: ddapm-test-agent'

  - id: module-path
    desc: ddapm_test_agent Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)ddapm_test_agent/'

  - id: datadog-github-repo
    desc: DataDog dd-apm-test-agent GitHub repository
    for: [json, markdown, text, python, pkginfo]
    if:
      type: text
      substr: DataDog/dd-apm-test-agent

composite_rules:
  - id: ddapm-test-agent-package
    desc: Datadog APM test agent Python package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
