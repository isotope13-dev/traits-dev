# Datadog system-tests — cross-language APM tracer black-box test workbench.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: readme-identity
    desc: Datadog system-tests README identity
    for: [markdown, text]
    if:
      type: text
      substr: black-box testing workbench for Datadog tracer libraries

  - id: dd-trace-env-marker
    desc: Datadog tracer environment variable
    for: [shell, python, javascript, typescript, dockerfile, text]
    if:
      type: text
      substr: DD_TRACE_

  - id: system-tests-path
    desc: system-tests repository path segment
    for: [zip, tar, gz, archives, shell, python, javascript, typescript, php, go, java, groovy, powershell]
    if:
      type: path
      regex: '(^|[\\/])system-tests'

composite_rules:
  - id: datadog-system-tests-context
    desc: Datadog system-tests tracer workbench context
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, tar, gz, archives]
    needs: 2
    any:
      - id: readme-identity
      - id: dd-trace-env-marker
      - id: system-tests-path
