# doiftrue/unitest-wp-copy — WordPress core stubs for PHP unit testing.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: composer-package-name
    desc: doiftrue/unitest-wp-copy Composer package
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: doiftrue/unitest-wp-copy

  - id: unitest-wp-copy-namespace
    desc: Unitest_WP_Copy PHP namespace
    for: [php]
    if:
      type: text
      substr: namespace Unitest_WP_Copy

  - id: wp-copy-bootstrap-loader
    desc: unitest-wp-copy Bootstrap init loader
    for: [php]
    if:
      type: text
      substr: 'Unitest_WP_Copy\Bootstrap::init'

composite_rules:
  - id: doiftrue-unitest-wp-copy
    desc: doiftrue WordPress core unit-test stub library
    crit: notable
    conf: 0.98
    any:
      - id: composer-package-name
      - id: unitest-wp-copy-namespace
