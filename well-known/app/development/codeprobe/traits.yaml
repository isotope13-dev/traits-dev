# codeprobe — benchmark AI coding agents against your own codebase.
# Mines tasks from repo history and scores agent answers against ground_truth.json.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: codeprobe PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: codeprobe

  - id: github-repo
    desc: codeprobe GitHub repository marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: github.com/sjarmak/codeprobe

  - id: oracle-scorer-marker
    desc: codeprobe F1 oracle scorer template
    for: [python]
    if:
      type: text
      substr: Self-contained F1 oracle scorer

composite_rules:
  - id: codeprobe-benchmark-context
    desc: codeprobe AI agent benchmark toolkit
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: github-repo
