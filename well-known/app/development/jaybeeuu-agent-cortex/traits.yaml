# @jaybeeuu/agent-cortex — Pi coding-agent package (skills, extensions, installers).
# postinstall updates ~/.copilot/copilot-instructions.md; skills document upstream tools.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, markdown, text, shell]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: agent-cortex npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@jaybeeuu/agent-cortex"

  - id: upstream-repository
    desc: jaybeeuu agent-cortex upstream repo
    for: [package.json, markdown, javascript, typescript, shell]
    if:
      type: text
      regex: 'github\.com/jaybeeuu/agent-cortex([./\s"''`?#]|$)'

  - id: pi-manifest-skills
    desc: Pi package declares bundled skills tree
    for: [package.json]
    if:
      type: value
      path: pi.skills
      exists: true

  - id: install-instructions-postinstall
    desc: postinstall runs copilot instructions helper
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      substr: install-instructions.sh

  - id: managed-instructions-marker
    desc: agent-cortex managed instructions marker
    for: [shell, javascript, typescript]
    if:
      type: text
      substr: "<!-- agent-cortex:start -->"

composite_rules:
  - id: archive-context
    desc: jaybeeuu agent-cortex Pi skills package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: pi-manifest-skills
      - id: install-instructions-postinstall
      - id: managed-instructions-marker
      - id: metadata/package/keywords/identity::npm-keyword-pi-package
