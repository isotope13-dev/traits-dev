# flowsh-cli — generates owner-executable Bash harnesses from MADE
# workflow YAML for OpenCode. yaml.load and chmod +x are the product.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: flowsh_cli PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: flowsh_cli

  - id: package-metadata-name
    desc: flowsh-cli PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*flowsh-cli\s*$'

  - id: log-dir-env
    desc: FLOWSH_LOG_DIR environment variable
    for: [python]
    if:
      type: text
      substr: FLOWSH_LOG_DIR

  - id: github-repo
    desc: tbrandenburg flowsh GitHub repository
    for: [pkginfo, markdown, python, text]
    if:
      type: text
      substr: github.com/tbrandenburg/flowsh

  - id: cli-module-path
    desc: flowsh_cli CLI module path
    for: [python, whl]
    if:
      type: path
      regex: 'flowsh_cli[\\/]cli\.py'

composite_rules:
  - id: flowsh-cli-package
    desc: flowsh-cli OpenCode harness generator
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: log-dir-env
      - id: github-repo
      - id: cli-module-path
    needs: 2
