# sysmonitor — VS Code system monitor extension (CPU/GPU/RAM).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: LiChenxi VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: LiChenxi

  - id: package-name
    desc: sysmonitor VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: sysmonitor

  - id: sysmonitor-github-repo
    desc: lcx-0504/sysmonitor repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: lcx-0504/sysmonitor

composite_rules:
  - id: sysmonitor-extension
    desc: sysmonitor VS Code system monitor extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
