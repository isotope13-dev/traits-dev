# fsbrowse — AnEntrypoint/httpfs Express HTTP file server middleware.
# Legitimate versions serve local files over HTTP. Compromised npm
# fsbrowse@0.2.28 appends a unicode-escaped NullReceiver EtherHiding IIFE to
# index.js; keep product identity separate so those C2 traits stay decisive.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: npm package name is fsbrowse
    for: [package.json, javascript, typescript, markdown]
    if:
      type: value
      path: package.json::name
      exact: fsbrowse

  - id: archive-package-name
    desc: npm archive package name is fsbrowse
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: fsbrowse

  - id: archive-repository
    desc: fsbrowse AnEntrypoint httpfs repository
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: https://github.com/AnEntrypoint/httpfs.git

  - id: package-repository
    desc: package.json points at AnEntrypoint/httpfs
    for: [package.json]
    if:
      type: value
      path: package.json::repository.url
      exact: https://github.com/AnEntrypoint/httpfs.git

  - id: express-middleware-export
    desc: Exports fsbrowse Express middleware factory
    for: [javascript, typescript]
    if:
      type: text
      substr: 'module.exports = function fsbrowse(opts)'

  - id: files-api-list-route
    desc: fsbrowse /api/list file listing route
    for: [javascript, typescript]
    if:
      type: text
      regex: "(?i)/api/list/"

composite_rules:
  - id: fsbrowse-archive-identity
    desc: Recognized fsbrowse npm archive
    conf: 0.99
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-repository

  - id: fsbrowse-package-identity
    desc: Recognized fsbrowse package.json identity
    conf: 0.99
    all:
      - id: package-name
      - id: package-repository

  - id: fsbrowse-express-middleware
    desc: fsbrowse Express file-server middleware
    conf: 0.97
    all:
      - id: express-middleware-export
      - id: files-api-list-route
      - id: micro-behaviors/communications/http/server/middleware::app-router-use-middleware-registration
