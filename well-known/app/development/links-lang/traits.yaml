# Links — functional web programming language (links-lang/links).
#
# .links sources use tuple-literal record syntax that cleave may classify as
# JavaScript; var accounts = [("Alice", 100), ...] is a bank model, not
# Nemucod-style string-reconstruction obfuscation.
defaults:
  platforms: [unix, windows]
  for: [javascript, text, zip, tar, archives]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: repository-identity
    desc: Links language GitHub repository
    if:
      type: text
      substr: github.com/links-lang/links

  - id: links-source-extension
    desc: Links language source file extension
    if:
      type: path
      regex: '(?i)\.links$'

  - id: source-syntax-typename
    desc: Links typename declaration syntax
    size_min: 200
    size_max: 500000
    if:
      type: text
      regex: '(?m)^\s*typename\s+[A-Za-z_][A-Za-z0-9_]*\s*='

  - id: source-syntax-sig
    desc: Links sig declaration syntax
    size_min: 200
    size_max: 500000
    if:
      type: text
      regex: '(?m)^\s*sig\s+[A-Za-z_][A-Za-z0-9_]*\s*:'

composite_rules:
  - id: links-language-source
    desc: Links functional web programming language source
    crit: notable
    all:
      - id: links-source-extension
    any:
      - id: source-syntax-typename
      - id: source-syntax-sig
      - id: repository-identity
