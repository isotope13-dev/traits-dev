# ATAC — Julien-cpsn terminal API client (Postman-like TUI).
# reqwest, clipboard, env enumeration, and boa_engine request scripts
# are the product HTTP client, not a stealer.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, tar, archives, markdown]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 80000000

traits:
  - id: cargo-name
    desc: atac Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: atac

  - id: github-repo
    desc: Julien-cpsn ATAC GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/Julien-cpsn/ATAC

  - id: product-tagline
    desc: ATAC terminal API client tagline
    if:
      type: text
      substr: Arguably a Terminal API Client
