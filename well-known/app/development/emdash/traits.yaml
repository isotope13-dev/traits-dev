# Emdash — generalaction Agentic Development Environment (parallel coding
# agents, SSH, worktrees). Ships user-feedback Discord webhook and open-in-IDE
# terminal launcher tables as product features, not exfiltration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, zip, tar, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-repo-url
    desc: generalaction/emdash GitHub repository
    if:
      type: text
      substr: github.com/generalaction/emdash

  - id: ade-product-summary
    desc: Emdash Agentic Development Environment summary
    if:
      type: text
      substr: Agentic Development Environment

  - id: open-in-apps-registry
    desc: Emdash open-in-apps launcher registry
    if:
      type: text
      substr: export const OPEN_IN_APPS

composite_rules:
  - id: emdash-ade-app
    desc: Emdash agentic development environment app
    crit: exception
    conf: 0.99
    any:
      - id: github-repo-url
      - id: ade-product-summary
