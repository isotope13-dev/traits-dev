# Wu Framework's native CLI embeds its framework templates in each platform
# binary. The Windows build also imports NT thread/memory APIs as part of its
# Zig runtime, so this identity suppresses capability-only findings when the
# product markers occur together.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 20000000

traits:
- id: wu-cli-banner
  desc: Wu Framework CLI banner
  crit: component
  conf: 0.99
  if:
    type: text
    section: .rdata
    substr: Wu CLI
- id: wu-framework-adapter-templates
  desc: Wu Framework adapter templates
  crit: component
  conf: 0.99
  if:
    type: text
    section: .rdata
    substr: wu-framework/adapters/

composite_rules:
- id: wu-framework-native-cli
  desc: Wu Framework native CLI binary
  crit: notable
  conf: 0.995
  all:
  - id: wu-cli-banner
  - id: wu-framework-adapter-templates
