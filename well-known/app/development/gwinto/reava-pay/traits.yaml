# gwinto/reava-pay — Reava Pay payment gateway for Gwinto rental management.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, javascript, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: reava-pay-composer-name
    desc: gwinto/reava-pay Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: gwinto/reava-pay

  - id: reava-pay-namespace
    desc: Gwinto ReavaPay PHP namespace
    for: [php]
    if:
      type: text
      substr: Gwinto\\ReavaPay\\

  - id: reava-pay-service-provider
    desc: ReavaPay Laravel service provider
    for: [php, composer.json, json]
    if:
      type: text
      substr: Gwinto\\ReavaPay\\ReavaPayServiceProvider

  - id: reava-pay-api-host
    desc: Reava Pay API host reference
    if:
      type: text
      substr: reavapay.com

composite_rules:
  - id: gwinto-reava-pay-package
    desc: gwinto/reava-pay Reava Pay payment integration
    crit: notable
    conf: 0.98
    any:
      - id: reava-pay-composer-name
      - id: reava-pay-service-provider
