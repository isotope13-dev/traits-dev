# tldr-cli — CLI binaries for the TLDR code analysis tool.
defaults:
  platforms: [windows, unix]
  for: [crate, rust, tar, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: crate-package-name
    desc: Cargo crate name tldr-cli
    for: [crate, rust]
    if:
      type: text
      regex: '(?m)^name\s*=\s*"tldr-cli"'

  - id: tldr-code-github-repo
    desc: parcadei/tldr-code GitHub repository URL
    if:
      type: text
      substr: parcadei/tldr-code

  - id: tldr-code-analysis-description
    desc: TLDR code analysis tool description
    if:
      type: text
      substr: TLDR code analysis

composite_rules:
  - id: tldr-cli-crate
    desc: TLDR code analysis CLI crate package
    crit: notable
    conf: 0.96
    all:
      - id: crate-package-name
    any:
      - id: tldr-code-github-repo
      - id: tldr-code-analysis-description
