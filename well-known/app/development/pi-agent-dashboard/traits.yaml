defaults:
  platforms: [unix, windows]
  for: [typescript, javascript, package.json]
  crit: notable
  conf: 0.98
traits:
  - id: shared-terminal-types-import
    desc: Pi dashboard shared terminal types import
    if:
      type: text
      substr: '@blackbelt-technology/pi-dashboard-shared/terminal-types.js'
  - id: dashboard-heap-flags-import
    desc: Pi dashboard heap flags import
    if:
      type: text
      substr: '@blackbelt-technology/pi-dashboard-shared/heap-flags.js'
composite_rules:
  - id: terminal-manager-source
    desc: Pi agent dashboard terminal manager source
    scope: file
    all:
      - id: shared-terminal-types-import
      - id: dashboard-heap-flags-import
