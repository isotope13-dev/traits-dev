# oh-my-pi — Bun/Node coding agent with terminal, PTY, and shell builtins.
# pi-natives ships platform-specific Node-API addons; SSH client fixtures in
# test data are product functionality, not brute-force tooling.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, package.json, elf, macho, pe]
  crit: notable
  conf: 0.99

traits:
  - id: pi-natives-package-name
    desc: oh-my-pi pi-natives npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@oh-my-pi/pi-natives-'

  - id: pi-natives-manifest-name
    desc: oh-my-pi pi-natives package.json name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@oh-my-pi/pi-natives-'

  - id: f5xc-pi-natives-manifest-name
    desc: f5xc-salesdemos pi-natives package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: "@f5xc-salesdemos/pi-natives"

  - id: f5xc-xcsh-repository
    desc: f5xc-salesdemos xcsh GitHub repository
    for: [package.json, npm, markdown]
    if:
      type: text
      substr: github.com/f5xc-salesdemos/xcsh

  - id: pi-natives-source-tree
    desc: oh-my-pi pi-natives Rust source path
    for: [elf, macho, pe]
    size_min: 65536
    if:
      type: text
      substr: crates/pi-natives/src/
      section: rodata

  - id: pi-builtins-source-tree
    desc: oh-my-pi pi-builtins Rust source path
    for: [elf, macho, pe]
    size_min: 65536
    if:
      type: text
      substr: crates/pi-builtins/src/
      section: rodata

  - id: oh-my-pi-product-marker
    desc: oh-my-pi product identity string
    for: [elf, macho, pe]
    size_min: 65536
    if:
      type: text
      word: oh-my-pi
      section: rodata

  - id: pi-natives-addon-basename
    desc: pi-natives Node native addon basename
    for: [elf, macho, pe]
    size_min: 65536
    size_max: 536870912
    if:
      type: path
      basename: true
      regex: '^pi_natives\.(linux|darwin|win32)-'

composite_rules:
  - id: pi-natives-native-addon
    desc: oh-my-pi pi-natives Node native addon
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/framework::node-api-addon-export
      - id: pi-natives-source-tree

  - id: oh-my-pi-natives-context
    desc: oh-my-pi pi-natives coding-agent native library context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: pi-natives-package-name
      - id: pi-natives-manifest-name
      - id: f5xc-pi-natives-manifest-name
      - id: f5xc-xcsh-repository
      - id: pi-natives-native-addon
      - id: pi-natives-addon-basename
