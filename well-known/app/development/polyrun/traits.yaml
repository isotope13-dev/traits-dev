# polyrun — parallel Ruby test runner (amkisko/polyrun.rb).
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, markdown, archives]
  crit: notable
  conf: 0.97

traits:
  - id: polyrun-gem-name
    desc: polyrun Ruby gem name assignment
    for: [ruby]
    if:
      type: text
      regex: 'spec\.name\s*=\s*["'']polyrun["'']'

  - id: polyrun-module-marker
    desc: Polyrun Ruby module marker
    for: [ruby]
    if:
      type: text
      regex: '\bmodule\s+Polyrun\b'

  - id: polyrun-github-repo
    desc: amkisko/polyrun.rb GitHub repository
    if:
      type: text
      substr: github.com/amkisko/polyrun.rb

  - id: polyrun-cli-binary
    desc: polyrun CLI executable path
    for: [ruby, gem, archives]
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]polyrun$'

composite_rules:
  - id: polyrun-gem
    desc: polyrun parallel test runner Ruby gem
    crit: notable
    conf: 0.98
    any:
      - id: polyrun-gem-name
      - id: polyrun-github-repo
