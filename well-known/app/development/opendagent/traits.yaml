# openDAGent — DAG-oriented agentic AI workflow runtime.
defaults:
  platforms: [windows, unix]
  for: [python, whl, zip, archives, markdown, text, json, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: opendagent Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: opendagent

  - id: pkginfo-name
    desc: PyPI package name openDAGent
    for: [pkginfo, markdown, text, json]
    if:
      type: text
      regex: '(?im)^Name:\s*openDAGent\s*$'

  - id: agentic-runtime-module-path
    desc: agentic_runtime Python package path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)agentic_runtime/'

  - id: opendagent-product-marker
    desc: openDAGent product name marker
    for: [python, html, markdown, text]
    if:
      type: text
      substr: openDAGent

  - id: opendagent-console-entry
    desc: openDAGent CLI console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: openDAGent = agentic_runtime.cli

composite_rules:
  - id: opendagent-package
    desc: openDAGent DAG agentic workflow Python runtime
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: pkginfo-name
      - id: agentic-runtime-module-path
