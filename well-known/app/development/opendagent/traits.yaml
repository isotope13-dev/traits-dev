# openDAGent — DAG-oriented agentic AI workflow runtime.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name openDAGent
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*openDAGent\s*$'

  - id: agentic-runtime-module-path
    desc: agentic_runtime Python package path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])agentic_runtime([\\/]|$)'

  - id: opendagent-product-marker
    desc: openDAGent product name marker
    for: [python, html]
    if:
      type: text
      substr: openDAGent

composite_rules:
  - id: opendagent-package
    desc: openDAGent DAG agentic workflow Python runtime
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: agentic-runtime-module-path
      - id: opendagent-product-marker
