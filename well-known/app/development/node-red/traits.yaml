# Node-RED low-code runtime (nodered.org).
defaults:
  platforms: [unix, windows]
  for: [javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Node-RED npm package name
    for: [json]
    if:
      type: value
      path: name
      exact: node-red

  - id: homepage
    desc: Node-RED project homepage
    for: [json]
    if:
      type: value
      path: homepage
      exact: https://nodered.org

composite_rules:
  - id: node-red-runtime
    desc: Node-RED low-code runtime package
    all:
      - id: package-name
      - id: homepage
