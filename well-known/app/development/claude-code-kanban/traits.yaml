# Claude Code Kanban — web-based Kanban board and terminal companion for
# Claude Code tasks (github.com/NikiforovAll/claude-code-kanban, npm `claude-code-kanban`).
# Provides an embedded local browser terminal using node-pty and WebSockets, bound
# strictly to loopback and protected by Host allowlists, Origin validation,
# and per-session authentication tokens.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Claude Code Kanban package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: claude-code-kanban

  - id: repository-url
    desc: Claude Code Kanban repository URL
    for: [package.json]
    if:
      type: text
      substr: github.com/NikiforovAll/claude-code-kanban

  - id: terminal-env-marker
    desc: Claude Code Kanban terminal environment marker
    if:
      type: text
      regex: '\b(CCK_TERMINAL|CCK_TERMINAL_ID|CCK_TERMINAL_SHELL|CCK_URL)\b'

  - id: terminal-ws-endpoint
    desc: Claude Code Kanban terminal WebSocket path
    if:
      type: text
      substr: '/api/terminal/ws'

composite_rules:
  - id: package-context
    desc: Claude Code Kanban package context
    for: [package.json]
    crit: notable
    conf: 0.98
    any:
      - id: package-name
      - id: repository-url

  - id: terminal-manager-source
    desc: Claude Code Kanban terminal manager source
    crit: notable
    conf: 0.98
    scope: file
    all:
      - id: terminal-env-marker
      - id: terminal-ws-endpoint
