defaults:
  platforms: [windows]
  for: [package.json, javascript]
  crit: baseline
  conf: 0.99

traits:
  - id: package-name
    desc: Vibrancy Continued VS Code package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: vscode-vibrancy-continued

  - id: publisher
    desc: Vibrancy Continued VS Code publisher
    crit: notable
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: illixion

  - id: vibrancy-continued-vsix
    desc: VS Code Vibrancy Continued VSIX context
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)vscode-vibrancy-continued-[0-9][^\\/]*\.vsix'

  - id: runtime-marker
    desc: Vibrancy Continued runtime marker
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: vscode-vibrancy-continued
