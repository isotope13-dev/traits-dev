# difit — CLI that serves Git commit diffs in a GitHub-like Files changed UI
# (github.com/yoshiko-pg/difit). Conda/npm packaging of the Node CLI + web UI.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: difit-package-name
    desc: difit npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: difit

  - id: difit-github-repo
    desc: difit upstream GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/yoshiko-pg/difit'

  - id: difit-node-modules-path
    desc: difit package path under node_modules
    conf: 0.96
    if:
      type: path
      regex: '(?i)node_modules[/\\]difit([/\\]|$)'

composite_rules:
  - id: difit-diff-viewer
    desc: difit Git diff viewer package
    crit: notable
    conf: 0.98
    any:
      - id: difit-package-name
      - id: difit-github-repo
      - id: difit-node-modules-path
