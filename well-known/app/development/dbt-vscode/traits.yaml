# dbt — official dbt Fusion VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: dbtLabsInc VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: dbtLabsInc

  - id: package-name
    desc: dbt VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: dbt

  - id: dbt-fusion-github-repo
    desc: dbt-labs/dbt-fusion GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: dbt-labs/dbt-fusion

  - id: datadog-api-server-config
    desc: Datadog API server configuration marker
    for: [javascript, typescript]
    if:
      type: text
      substr: datadoghq.com

composite_rules:
  - id: dbt-vscode-extension-context
    desc: Official dbt VS Code extension bundle context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: datadog-api-server-config
    any:
      - id: dbt-fusion-github-repo
