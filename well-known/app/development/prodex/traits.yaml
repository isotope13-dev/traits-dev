# prodex — Codex/Claude Code profile pooling and quota routing.
defaults:
  platforms: [windows, unix]
  for: [crate, rust, tar, archives, markdown, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: crate-package-name
    desc: Cargo crate name prodex
    for: [crate, rust, text]
    if:
      type: text
      substr: 'name = "prodex"'

  - id: prodex-github-repo
    desc: christiandoxa/prodex GitHub repository URL
    if:
      type: text
      substr: christiandoxa/prodex

  - id: codex-cli-profile-description
    desc: OpenAI profile pooling for Codex CLI
    if:
      type: text
      substr: Codex CLI and Claude Code

  - id: prodex-crate-basename
    desc: prodex Rust crate archive basename
    for: [crate]
    if:
      type: basename
      regex: '^prodex-.*\.crate$'

  - id: christiandoxa-prodex-npm-package
    desc: christiandoxa prodex npm package name
    for: [package.json, json]
    if:
      type: text
      substr: '@christiandoxa/prodex'

composite_rules:
  - id: prodex-crate
    desc: prodex Codex Claude profile manager crate
    crit: notable
    conf: 0.97
    any:
      - id: crate-package-name
      - id: prodex-github-repo
      - id: christiandoxa-prodex-npm-package
      - id: prodex-crate-basename
      - id: codex-cli-profile-description
