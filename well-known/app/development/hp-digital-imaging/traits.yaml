defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.98
  size_min: 65536
  size_max: 5000000

traits:
  - id: hp-digital-imaging-product
    desc: HP Digital Imaging product field
    if:
      type: value
      path: pe.version.product_name
      exact: HP Digital Imaging

  - id: hp-scan-original-name
    desc: HP Scan executable original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)(^|[\\/])HPScan\.exe$'

  # Cleaved version-info strings are sometimes only partial on this family;
  # comments still identify the Scan API DLL used as a VERSION.DLL sideload host.
  - id: hp-scanapi-comments
    desc: HPScanApi version-resource comments field
    size_min: 100000
    if:
      type: value
      path: pe.version.comments
      exact: HPScanApi

  # ISO 9660 often truncates the member to HPSCANAP.DLL while Joliet keeps
  # HPScanApi.dll; accept both spellings.
  - id: hp-scanapi-basename
    desc: Filename is HPScanApi.dll
    size_min: 100000
    if:
      type: path
      basename: true
      regex: '(?i)^HPSCANAP(I)?\.DLL$'

composite_rules:
  - id: hp-signed-scanner-component
    desc: Validly signed HP Scan component
    crit: notable
    conf: 0.99
    all:
      - id: hp-digital-imaging-product
      - id: hp-scan-original-name
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: hp-scanapi-component
    desc: HP Scan API DLL component identity
    crit: notable
    conf: 0.97
    all:
      - id: hp-scanapi-comments
      - id: hp-scanapi-basename
