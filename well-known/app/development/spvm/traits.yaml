# SPVM — Static Perl Virtual Machine language and toolchain.
defaults:
  platforms: [windows, unix]
  for: [perl, tar, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: spvm-package-name
    desc: CPAN package name SPVM
    for: [json, text]
    if:
      type: text
      regex: '"name"\s*:\s*"SPVM"'

  - id: spvm-language-module
    desc: SPVM Perl language module
    for: [perl, text]
    if:
      type: text
      regex: 'package\s+SPVM\b'

  - id: spvmcc-compiler-script
    desc: spvmcc compiler script reference
    if:
      type: text
      substr: spvmcc

composite_rules:
  - id: spvm-language-package
    desc: SPVM Perl virtual machine language package
    crit: notable
    conf: 0.97
    any:
      - id: spvm-package-name
      - id: spvm-language-module
