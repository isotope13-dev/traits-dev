# commit-defender — AI-powered git pre-commit code review hook.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package commit-defender
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*commit-defender\s*$'

  - id: commit-defender-github-repo
    desc: commit-defender GitHub repository URL
    if:
      type: text
      substr: commit-defender/commit-defender

  - id: commit-defender-module-path
    desc: commit_defender Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])commit_defender([\\/]|$)'

  - id: pre-commit-ai-review-summary
    desc: AI-powered git pre-commit code review summary
    if:
      type: text
      substr: AI-powered git pre-commit code review

composite_rules:
  - id: commit-defender-package
    desc: commit-defender AI pre-commit review package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: commit-defender-github-repo
      - id: commit-defender-module-path
      - id: pre-commit-ai-review-summary
