# HarnessUp is a commercial AI coding-agent harness published from harnessup.dev.
# Its binaries carry the vendor's telemetry and privacy guard strings, and
# they read the developer's credential stores and mailbox connectors so they
# can mask secrets before they leave the machine ("HarnessUp No Leak"). That
# access is the product's own feature set. The identity is a claimed string,
# so consumers downgrade one step rather than suppress.
defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe]
  crit: notable
  conf: 0.95

traits:
  - id: harnessup-vendor-api-host
    desc: HarnessUp vendor API host reference
    if:
      type: text
      substr: "api.harnessup.dev"

  - id: harnessup-noleak-masking
    desc: HarnessUp No Leak secret-masking notice
    if:
      type: text
      substr: "HarnessUp No Leak"

  - id: harnessup-bench-telemetry
    desc: HarnessUp Bench telemetry label
    if:
      type: text
      substr: "HarnessUp Bench"

composite_rules:
  # Two of three distinct product markers: the vendor API host and the two
  # feature labels. A single marker can appear in third-party text.
  - id: harnessup-product-identity
    desc: HarnessUp coding-agent harness with vendor markers
    crit: notable
    conf: 0.96
    any:
      - id: harnessup-vendor-api-host
      - id: harnessup-noleak-masking
      - id: harnessup-bench-telemetry
    needs: 2
