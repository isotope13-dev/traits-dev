defaults:
  platforms: [unix, windows]
  for: [go, rust, python, shell, powershell, javascript, typescript, markdown, json]
  crit: baseline
  conf: 0.98
  size_min: 0

traits:
  - id: openai-codex-source-path
    desc: OpenAI Codex source archive path
    if:
      type: path
      substr: github.com/openai/codex
  - id: openai-codex-module-path
    desc: OpenAI Codex Go module path
    if:
      type: text
      substr: github.com/openai/codex
  - id: openai-codex-cli-name
    desc: OpenAI Codex CLI source marker
    if:
      type: text
      substr: codex-cli

  - id: openai-codex-platform-package
    desc: OpenAI Codex platform-specific npm package
    for: [package.json]
    if:
      type: text
      regex: '"@openai/codex-(linux|darwin|win32)-'

  - id: openai-codex-sdk-dependency
    desc: OpenAI Codex SDK npm dependency
    for: [package.json]
    if:
      type: text
      substr: '"@openai/codex-sdk"'

  # Native CLI builds (npm platform packages, GitHub release tarballs) are
  # classified as ELF/Mach-O/PE, so the source-language `for:` defaults above
  # never see these strings. Keep this off `@codexed/` package names: a
  # republished wrapper must not inherit the official-product unless: set.
  - id: openai-codex-native-repo-string
    desc: OpenAI Codex native repo string
    crit: notable
    conf: 0.98
    for: [elf]
    size_min: 1048576
    size_max: 536870912
    if:
      type: text
      substr: github.com/openai/codex
      section: .rodata

  - id: openai-codex-linux-sandbox-name
    desc: Codex Linux sandbox helper name
    crit: notable
    conf: 0.98
    for: [elf]
    size_min: 1048576
    size_max: 536870912
    if:
      type: text
      substr: codex-linux-sandbox
      section: .rodata

composite_rules:
  - id: openai-codex-source-context
    desc: OpenAI Codex source context
    crit: notable
    conf: 0.98
    any:
      - id: openai-codex-source-path
      - id: openai-codex-module-path
      - id: openai-codex-cli-name
      - id: openai-codex-platform-package
      - id: openai-codex-sdk-dependency
      - id: openai-codex-native-repo-string
      - id: openai-codex-linux-sandbox-name
