defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.98
  size_min: 1000000
  size_max: 200000000

traits:
  - id: linux-runtime-basename
    desc: Deno Linux runtime basename
    crit: component
    platforms: [linux]
    for: [elf]
    if:
      type: basename
      regex: '^deno(rt)?$'
  - id: linux-runtime-marker
    desc: Deno Linux runtime embedded marker
    crit: component
    platforms: [linux]
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: "deno_runtime::"
  - id: deno-product-name
    desc: Deno PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Deno
  - id: deno-runtime-description
    desc: Deno runtime PE description
    if:
      type: value
      path: pe.version.description
      exact: "Deno: A secure runtime for JavaScript and TypeScript"
  - id: deno-original-filename
    desc: Deno PE original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: deno.exe

  - id: denort-runtime-basename
    desc: Deno compiled runtime basename
    if:
      type: value
      path: file.basename
      exact: denort.exe

  - id: denort-runtime-marker
    desc: Deno compiled runtime RDATA marker
    if:
      type: text
      substr: "deno_core::"
      section: .rdata

  # Official GitHub source tarballs use denoland-deno-v*-source.tar.gz.
  - id: source-archive-name-release
    desc: Deno official source release archive name
    crit: notable
    size_min: 0
    for: [tar]
    platforms: [unix, windows]
    if:
      type: basename
      regex: '(?i)^denoland-deno-v[0-9].*-source\.tar\.gz$'

  # Mirrored or hash-prefixed copies often keep only a deno_src / deno-src stem.
  - id: source-archive-name-src
    desc: Deno src-stem source archive name
    crit: notable
    size_min: 0
    for: [tar]
    platforms: [unix, windows]
    if:
      type: basename
      regex: '(?i)deno[_-]src\.tar\.gz$'

  - id: source-repository
    desc: Deno source repository metadata
    crit: notable
    size_min: 0
    for: [cargo.toml]
    platforms: [unix, windows]
    if:
      type: text
      substr: 'https://github.com/denoland/deno'

  # Workspace root lists the Deno CLI and extension crates — identity when the
  # outer archive basename was rewritten (hash prefix, mirror rename).
  - id: source-workspace-members
    desc: Deno workspace lists cli and ext crates
    crit: notable
    size_min: 0
    for: [cargo.toml]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?s)members\s*=\s*\[[^\]]{0,400}"cli"[^\]]{0,800}"ext/'


  # Leaf-file path identity so unless: on nested specs/tests members can match
  # the exception without relying solely on outer-archive basename evidence.
  - id: specs-tree-path
    desc: Path under Deno specs tree
    crit: notable
    size_min: 0
    for: [scripts, source, javascript, typescript, rust, c, cpp, package.json]
    platforms: [unix, windows]
    if:
      type: path
      substr: deno/specs/

  - id: tests-tree-path
    desc: Path under Deno tests tree
    crit: notable
    size_min: 0
    for: [scripts, source, javascript, typescript, rust, c, cpp, package.json]
    platforms: [unix, windows]
    if:
      type: path
      substr: deno/tests/

composite_rules:
  - id: windows-runtime-binary
    desc: Deno JavaScript runtime binary
    crit: notable
    conf: 0.99
    all:
      - id: deno-product-name
      - id: deno-runtime-description
    any:
      - id: deno-original-filename

  - id: linux-runtime-binary
    desc: Deno Linux runtime binary
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    all:
      - id: linux-runtime-basename
      - id: linux-runtime-marker

  - id: macos-runtime-binary
    desc: Deno signed macOS runtime binary
    crit: notable
    conf: 1.0
    platforms: [macos]
    for: [macho]
    all:
      - id: metadata/signed/developer::2H4KBF436B
      - id: metadata/signed/id::deno

  - id: deno-runtime-binary
    desc: Deno JavaScript runtime binary
    crit: notable
    conf: 0.99
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    any:
      - id: windows-runtime-binary
      - id: linux-runtime-binary
      - id: macos-runtime-binary

  - id: denort-runtime-binary
    desc: Deno compiled runtime binary
    crit: notable
    conf: 0.99
    all:
      - id: denort-runtime-basename
      - id: denort-runtime-marker

  - id: source-archive-context
    desc: Official Deno source archive context
    crit: exception
    conf: 0.99
    size_min: 0
    # outer: nested npm registry fixtures inside tests/ must still see the
    # Deno workspace identity on the enclosing source tree.
    scope: outer
    platforms: [unix, windows]
    # Broad for: so unless: on nested js/ts/rust/c members can see this exception
    # (ansible source-archive-context pattern); identity still from project metadata.
    for: [scripts, source, binaries, tar, rust, javascript, typescript, shell, github-actions, cargo.toml, npm, package.json, c, cpp]
    all:
      - id: source-repository
    any:
      - id: source-archive-name-release
      - id: source-archive-name-src
      - id: source-workspace-members
      - id: specs-tree-path
      - id: tests-tree-path
    needs: 1
