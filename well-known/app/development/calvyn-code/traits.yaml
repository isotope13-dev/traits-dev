# A generic agents/gateway/skills layout is shared by many coding tools.
# Only the declared package identity establishes that this is Calvyn Code.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: calvyn-package-name
    desc: Manifest identifies Calvyn Code package
    if:
      type: value
      path: name
      exact: calvyn-code
