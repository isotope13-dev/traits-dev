defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 2147483647

traits:
  - id: mongosh-bundled-cli-marker
    desc: MongoDB Shell bundled CLI marker
    if:
      type: raw
      section: .rodata
      substr: lib-boxednode/mongosh

  - id: mongosh-node-mongocrypt-marker
    desc: MongoDB Shell Node.js cryptography marker
    if:
      type: raw
      section: .dynstr
      substr: node_mongocrypt

composite_rules:
  - id: mongosh-node-runtime
    desc: MongoDB Shell Node.js runtime
    crit: notable
    conf: 0.99
    all:
      - id: mongosh-bundled-cli-marker
      - id: mongosh-node-mongocrypt-marker
      - id: well-known/lib/runtime/v8::node-runtime-registration-symbol
