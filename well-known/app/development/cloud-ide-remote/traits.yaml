# cloud-ide-remote — Meituan Cloud IDE remote VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: publisher
    desc: cloudide VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: cloudide

  - id: package-name
    desc: cloud-ide-remote extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: cloud-ide-remote

  - id: sankuai-cloud-ide-homepage
    desc: Meituan Cloud IDE ide.sankuai.com URL
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: ide.sankuai.com

composite_rules:
  - id: cloud-ide-remote-extension
    desc: Meituan Cloud IDE remote VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
