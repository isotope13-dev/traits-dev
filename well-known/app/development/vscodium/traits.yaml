defaults:
  platforms: [windows, macos, linux]
  for: [json]

traits:
  - id: product-name
    desc: VSCodium product manifest name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: nameLong
      exact: VSCodium

  - id: official-license-url
    desc: Official VSCodium license URL
    crit: notable
    conf: 0.99
    if:
      type: value
      path: licenseUrl
      exact: https://github.com/VSCodium/vscodium/blob/master/LICENSE

  - id: vscodium-core-bundle-path
    desc: VSCodium editor core bundle path
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: path
      case_insensitive: true
      regex: 'VSCodium\.app.{0,64}app[/\\]out[/\\]vs'

composite_rules:
  - id: archive-context
    desc: Recognized VSCodium application archive
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: product-name
      - id: official-license-url
