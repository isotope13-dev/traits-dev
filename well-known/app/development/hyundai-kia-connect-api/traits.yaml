# hyundai_kia_connect_api — Hyundai/Kia Connect vehicle API client.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package hyundai_kia_connect_api
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*hyundai_kia_connect_api\s*$'

  - id: hyundai-kia-connect-github-repo
    desc: Hyundai-Kia-Connect API repository URL
    if:
      type: text
      substr: Hyundai-Kia-Connect/hyundai_kia_connect_api

  - id: kia-uvo-api-module
    desc: KiaUvoApi regional API implementation module
    for: [python]
    if:
      type: basename
      regex: '^KiaUvoApi\w+\.py$'

composite_rules:
  - id: hyundai-kia-connect-api-package
    desc: Hyundai Kia Connect vehicle API client library
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: hyundai-kia-connect-github-repo
      - id: kia-uvo-api-module
