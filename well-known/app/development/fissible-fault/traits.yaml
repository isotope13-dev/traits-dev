# fissible/fault — Laravel exception tracking and triage library.
defaults:
  platforms: [windows, unix]
  for: [php, composer.json, json, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: composer-package-name
    desc: Composer package fissible/fault
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: fissible/fault

  - id: fault-namespace
    desc: Fissible Fault PHP namespace
    for: [php]
    if:
      type: text
      substr: Fissible\Fault\

composite_rules:
  - id: fissible-fault-library
    desc: fissible/fault Laravel exception triage library
    crit: notable
    conf: 0.99
    any:
      - id: composer-package-name
      - id: fault-namespace
      - id: well-known/app/development/fissible/fault::fault-github-repo
