defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.99

traits:
  - id: apidemos-activity-class
    desc: Android ApiDemos activity class descriptor
    if:
      type: text
      regex: 'L(io/appium|com/example)/android/apis/ApiDemos;'

  - id: apidemos-package-string
    desc: Android ApiDemos package identifier string
    if:
      type: text
      regex: '(io\.appium|com\.example)\.android\.apis'

  - id: apidemos-sms-sample-class
    desc: Android ApiDemos SMS demo class descriptor
    if:
      type: text
      regex: 'L(io/appium|com/example)/android/apis/os/Sms[A-Za-z0-9_$]+;'

composite_rules:
  - id: apidemos-dex-sms-sample
    desc: Android ApiDemos SMS demonstration sample identity
    crit: exception
    conf: 0.995
    all:
      - id: apidemos-activity-class
      - id: apidemos-package-string
      - id: apidemos-sms-sample-class
