# MangoJuice — open-source Linux GPU monitoring AppImage
# (https://github.com/radiolamp/mangojuice). Bundles uruntime, which
# references /tmp/.path for runtime state.
defaults:
  platforms: [linux]
  for: [elf, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  - id: github-release-zsync
    desc: MangoJuice GitHub release zsync marker
    if:
      type: text
      substr: radiolamp/mangojuice

  - id: appimage-filename
    desc: MangoJuice AppImage filename marker
    for: [elf, zip]
    if:
      type: text
      regex: '(?i)MangoJuice-[A-Za-z0-9._-]+\.AppImage'

composite_rules:
  - id: mangojuice-appimage-context
    desc: MangoJuice GPU monitor AppImage context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: github-release-zsync
      - id: appimage-filename
