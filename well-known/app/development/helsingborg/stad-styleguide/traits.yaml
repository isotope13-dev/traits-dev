# helsingborg-stad/styleguide — Helsingborg municipal design system.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, javascript, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: styleguide-composer-name
    desc: helsingborg-stad/styleguide Composer name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: helsingborg-stad/styleguide

  - id: municipio-styleguide-namespace
    desc: MunicipioStyleGuide PHP namespace
    for: [php]
    if:
      type: text
      substr: MunicipioStyleGuide\\

  - id: helsingborg-email-domain
    desc: helsingborg.se author email domain
    for: [composer.json, json, markdown]
    if:
      type: text
      substr: '@helsingborg.se'

composite_rules:
  - id: helsingborg-stad-styleguide
    desc: Helsingborg Stad municipal styleguide package
    crit: notable
    conf: 0.98
    any:
      - id: styleguide-composer-name
      - id: municipio-styleguide-namespace
