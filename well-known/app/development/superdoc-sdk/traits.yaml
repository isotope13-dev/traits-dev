# SuperDoc SDK — programmatic DOCX editing via bundled CLI host.
# Platform wheels (superdoc-sdk-cli-*) ship the Bun-compiled CLI binary.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95

traits:
  - id: pkginfo-name
    desc: PyPI package name superdoc-sdk
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*superdoc-sdk\s*$'

  - id: pkginfo-cli-name
    desc: SuperDoc SDK CLI package name
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*superdoc-sdk-cli-'

  - id: cli-backed-summary
    desc: SuperDoc SDK CLI-backed package summary
    for: [pkginfo, text]
    if:
      type: text
      substr: SuperDoc SDK (CLI-backed)

  - id: cli-platform-summary
    desc: SuperDoc CLI platform binary summary
    if:
      type: text
      substr: SuperDoc CLI binary for

  - id: cli-bundled-binary-locator
    desc: SuperDoc CLI bundled binary locator
    for: [python]
    if:
      type: text
      substr: 'CLI binary not found:'

  - id: cli-companion-binary-member
    desc: SuperDoc CLI binary archive member
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: 'superdoc_sdk_cli_[^/]+/bin/superdoc(\.exe)?$'

  - id: docs-url
    desc: SuperDoc documentation site URL
    if:
      type: text
      substr: docs.superdoc.dev

composite_rules:
  - id: superdoc-sdk-package
    desc: SuperDoc programmatic DOCX SDK package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: cli-backed-summary
      - id: docs-url

  - id: superdoc-sdk-cli-pkginfo
    desc: SuperDoc SDK CLI companion pkginfo
    crit: notable
    conf: 0.97
    for: [pkginfo]
    all:
      - id: pkginfo-cli-name
      - id: cli-platform-summary

  - id: superdoc-sdk-cli-loader
    desc: SuperDoc SDK CLI loader module
    crit: notable
    conf: 0.96
    for: [python]
    all:
      - id: cli-platform-summary
      - id: cli-bundled-binary-locator
