# Fallow is a local TypeScript/JavaScript codebase analyzer. Its release binary
# embeds an optional CI helper template; the template's chmod of /tmp/fallow-run.sh
# is documented build automation, not indicator removal.
defaults:
  platforms: [unix, windows]
  for: [elf, package.json, markdown, text]
  crit: notable
  conf: 0.99
  size_max: 524288000

traits:
  - id: platform-package-name
    desc: Fallow native platform package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@fallow-cli/linux-x64-(musl|gnu)$'

  - id: upstream-repository
    desc: Fallow upstream repository reference
    for: [package.json, markdown, text]
    if:
      type: text
      regex: 'github\.com/fallow-rs/fallow([/\.\s"''`?#]|$)'
      case_insensitive: true

  - id: cli-product-marker
    desc: Fallow CLI compiled product marker
    for: [elf]
    if:
      type: text
      section: rodata
      substr: FALLOW_SERIALIZE_COMBINED_REPORT

  - id: ci-template-marker
    desc: Fallow embedded CI template marker
    for: [elf]
    if:
      type: text
      section: rodata
      substr: FALLOW_RUN_WRITER_EOF

composite_rules:
  - id: package-context
    desc: Recognized Fallow native package metadata
    crit: notable
    scope: outer
    all:
      - id: platform-package-name
      - id: upstream-repository

  - id: fallow-ci-template-context
    desc: Fallow embedded CI template context
    crit: exception
    all:
      - id: cli-product-marker
      - id: ci-template-marker
