# Cratis Stage is an open-source C# event modeling and code-generation framework
# for building Cratis Arc and Chronicle applications. It embeds .NET reference
# assemblies for in-memory Roslyn compilation, which can co-occur with crypto
# and system APIs across the embedded DLLs.
defaults:
  platforms: [unix, windows]
  for: [pe, dll, nupkg]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 500000000

traits:
  - id: cratis-stage-product-name
    desc: Cratis Stage product name metadata
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '^Cratis\.Stage'

  - id: cratis-stage-copyright
    desc: Cratis Stage copyright metadata
    for: [pe, dll]
    if:
      type: value
      path: pe.version.copyright
      exact: Copyright Cratis

  - id: cratis-stage-nuspec-id
    desc: Cratis Stage NuGet package identifier
    for: [nupkg]
    if:
      type: path
      regex: '(?i)(^|[\\/])Cratis\.Stage\.[A-Za-z0-9.]+\.nuspec$'

composite_rules:
  - id: cratis-stage-assembly
    desc: Recognized Cratis Stage code generation assembly
    crit: exception
    conf: 0.99
    all:
      - id: cratis-stage-product-name
      - id: cratis-stage-copyright
