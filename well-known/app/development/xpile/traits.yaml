# xpile — PAIML polyglot transpile workbench (Python/C/C++/Rust/Ruchy/Lean
# to Rust/Ruchy/PTX/WGSL/SPIR-V/shell). Process spawn, /bin/sh -c, pipe-to-
# shell, and exec(open().read()) are compiler tests and backends, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: crate-name
    desc: xpile crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: xpile

  - id: crate-repository
    desc: xpile crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/paiml/xpile

  - id: cargo-package-name
    desc: xpile Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: xpile

  - id: github-repo
    desc: paiml xpile GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/paiml/xpile

  - id: workbench-about
    desc: xpile polyglot transpile workbench
    conf: 0.97
    if:
      type: text
      substr: Polyglot transpile workbench
