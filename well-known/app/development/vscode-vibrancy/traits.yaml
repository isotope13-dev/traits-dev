# illixion/vscode-vibrancy-continued applies a translucent background to VS
# Code by patching the editor's own resource files. Doing that means the editor
# has to be restarted, so the extension writes a one-shot trampoline --
# `sleep 1; <vscode cli> &; rm -f "$0"` -- launches it detached and lets it
# remove itself. A dropper self-deletes to destroy the payload; a relaunch
# helper self-deletes because it has nothing left to do.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 100000000

traits:
  - id: extension-manifest-name
    desc: Vibrancy Continued extension manifest
    for: [package.json]
    if:
      type: value
      path: name
      exact: vscode-vibrancy-continued

  - id: extension-repository
    desc: Vibrancy Continued upstream repository
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: illixion/vscode-vibrancy-continued

composite_rules:
  # Notable rather than `exception` so the `well-known/app/` directory
  # reference in the self-delete rule's `unless:` reaches it -- a directory
  # reference never includes exceptions.
  - id: vibrancy-extension
    desc: Recognized Vibrancy Continued extension
    crit: notable
    conf: 0.99
    any:
      - id: extension-manifest-name
      - id: extension-repository
