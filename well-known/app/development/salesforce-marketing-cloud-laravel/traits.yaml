# nlincs/marketing-cloud-laravel — Salesforce Marketing Cloud Laravel SDK.
defaults:
  platforms: [windows, unix]
  for: [php, composer.json, json, zip, archives]
  crit: notable
  conf: 0.95

traits:
  - id: composer-package-name
    desc: Composer package nlincs/marketing-cloud-laravel
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: nlincs/marketing-cloud-laravel

  - id: marketingcloudapis-host
    desc: Salesforce Marketing Cloud API host
    if:
      type: text
      substr: marketingcloudapis.com

  - id: exacttarget-soap-namespace
    desc: ExactTarget SOAP partner API namespace
    if:
      type: text
      substr: exacttarget.com/wsdl/partnerAPI

composite_rules:
  - id: nlincs-marketing-cloud-laravel
    desc: nlincs Marketing Cloud Laravel integration package
    crit: notable
    conf: 0.96
    all:
      - id: composer-package-name
    any:
      - id: marketingcloudapis-host
      - id: exacttarget-soap-namespace
