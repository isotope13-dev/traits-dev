# Musubi — .NET tool compiler for a lambda-calculus language.
# Ships as a NuGet DotnetTool; retains the VS MyApplication.app template
# identity and a hash-derived far-future COFF stamp. Process.Start is CLI
# host behavior, not a masquerade loader.
defaults:
  platforms: [windows, unix]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 8000
  size_max: 80000000

traits:
  - id: original-filename
    desc: Musubi.Cli original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Musubi.Cli.dll

  - id: assembly-basename
    desc: Musubi.Cli assembly basename
    if:
      type: path
      basename: true
      exact: Musubi.Cli.dll

composite_rules:
  - id: official-cli-binary
    desc: Official Musubi.Cli tool binary
    crit: notable
    conf: 0.99
    all:
      - id: original-filename
      - id: assembly-basename
