# Storybook — UI component workshop (storybook.js.org / storybookjs).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, conda]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: storybook-package-name
    desc: storybook npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: storybook

  - id: storybook-github-repo
    desc: Storybook upstream GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/storybookjs/storybook'

  - id: storybook-package-tree-path
    desc: File resides within Storybook package tree
    conf: 0.96
    if:
      type: path
      regex: '(?i)node_modules[/\\]storybook([/\\]|$)'

  - id: storybook-conda-basename
    desc: Storybook conda package basename
    for: [conda]
    conf: 0.99
    size_min: 100000
    size_max: 100000000
    if:
      type: value
      path: file.basename
      regex: '(?i)^storybook-'

  - id: storybook-conda-forge-feedstock
    desc: conda-forge Storybook feedstock URL
    for: [json, text, conda]
    conf: 0.99
    size_max: 100000000
    if:
      type: text
      substr: github.com/conda-forge/storybook-feedstock

composite_rules:
  - id: storybook-ui-workshop
    desc: Storybook UI component workshop package
    crit: notable
    conf: 0.98
    any:
      - id: storybook-package-name
      - id: storybook-github-repo

  - id: storybook-conda-distribution
    desc: conda-forge Storybook package
    crit: notable
    conf: 0.99
    for: [conda]
    size_min: 100000
    size_max: 100000000
    scope: archive
    all:
      - id: storybook-conda-basename
    any:
      - id: storybook-github-repo
      - id: storybook-conda-forge-feedstock
