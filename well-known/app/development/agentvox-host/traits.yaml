# AgentVox host daemon — local companion daemon for AgentVox (agentvox.app,
# github.com/scifantastic/agentvox, npm `@agentvox/host`). Controls local CLI coding
# agents (Claude Code, Codex, tmux) hands-free from the AgentVox iOS app.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AgentVox host daemon package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@agentvox/host"

  - id: repository-url
    desc: AgentVox GitHub repository reference
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: "github.com/scifantastic/agentvox"

  - id: proxy-domain
    desc: AgentVox proxy domain reference
    for: [javascript, typescript]
    if:
      type: text
      substr: "proxy.agentvox.bot"

  - id: cli-binary-marker
    desc: AgentVox CLI binary marker
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(agentvox-host|agentvox-board)\b'

composite_rules:
  - id: agentvox-host-package-context
    desc: AgentVox host daemon package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: repository-url
      - id: proxy-domain
      - id: cli-binary-marker

  - id: agentvox-host-bundle-content-context
    desc: AgentVox host daemon bundle content context
    crit: exception
    conf: 0.99
    scope: file
    for: [javascript, typescript]
    all:
      - id: proxy-domain
      - id: cli-binary-marker
