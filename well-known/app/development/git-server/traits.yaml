# Git::Server — Perl git hosting with granular server-side hooks (hookbot/git-server).
defaults:
  platforms: [unix]
  for: [perl, scripts, text, markdown, pkginfo]
  crit: notable
  conf: 0.97

traits:
  - id: cpan-package-name
    desc: Git-Server CPAN distribution name
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^name:\s*Git-Server\s*$'

  - id: git-server-perl-module
    desc: Git Server Perl module
    for: [perl]
    if:
      type: text
      substr: package Git::Server

  - id: git-server-hook-runner
    desc: Git Server hook runner script
    for: [scripts]
    if:
      type: text
      substr: run-git-hooks - Secure Git Server

  - id: git-server-version-marker
    desc: Git::Server environment version marker
    for: [scripts, perl]
    if:
      type: text
      regex: '\$ENV\{GIT_SERVER_VERSION\}\s*(\|\|=|=)\s*("UNKNOWN"|"[0-9][0-9.]*"|\$VERSION)'

composite_rules:
  - id: git-server-package
    desc: Git Server Perl git hosting package
    crit: notable
    conf: 0.98
    any:
      - id: cpan-package-name
      - id: git-server-perl-module
      - id: git-server-hook-runner
      - id: git-server-version-marker
