# gluetool — Red Hat command-line pipeline framework.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: pkginfo-name
    desc: PyPI package name gluetool
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*gluetool\s*$'

  - id: gluetool-readthedocs-url
    desc: gluetool Read the Docs homepage URL
    if:
      type: text
      substr: gluetool.readthedocs.org

  - id: html-log-module
    desc: gluetool HTML log report module
    for: [python]
    if:
      type: basename
      exact: html_log.py

composite_rules:
  - id: gluetool-package
    desc: gluetool Python pipeline framework package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: gluetool-readthedocs-url
      - id: html-log-module
