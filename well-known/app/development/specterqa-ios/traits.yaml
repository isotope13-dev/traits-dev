# SpecterQA iOS (SyncTek) — AI-driven iOS Simulator QA driver. Reads app
# keychain entries via security find-generic-password with values redacted,
# and documents APP_PASSWORD-style product test credentials in CredentialContext.
defaults:
  platforms: [macos]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: specterqa-ios PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: specterqa-ios

  - id: credential-context-class
    desc: SpecterQA CredentialContext credential store
    for: [python]
    if:
      type: text
      substr: class CredentialContext

  - id: state-inspector-class
    desc: SpecterQA StateInspector simulator state probe
    for: [python]
    if:
      type: text
      substr: class StateInspector

  - id: synctek-product-marker
    desc: SyncTek SpecterQA product marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: synctek.io/specterqa

composite_rules:
  - id: specterqa-ios-context
    desc: SpecterQA iOS simulator test driver
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
    any:
      - id: credential-context-class
      - id: state-inspector-class
