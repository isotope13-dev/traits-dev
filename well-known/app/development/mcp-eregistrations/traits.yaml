# mcp-eregistrations — UNCTAD eRegistrations platform MCP servers.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name mcp-eregistrations
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*mcp-eregistrations\s*$'

  - id: unctad-eregistrations-github-repo
    desc: UNCTAD MCP_eRegistrations repository URL
    if:
      type: text
      substr: UNCTAD-eRegistrations/MCP_eRegistrations

  - id: mcp-eregistrations-bpa-module
    desc: mcp_eregistrations_bpa server module
    for: [python]
    if:
      type: text
      substr: mcp_eregistrations_bpa

composite_rules:
  - id: mcp-eregistrations-package
    desc: UNCTAD eRegistrations MCP server package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: unctad-eregistrations-github-repo
      - id: mcp-eregistrations-bpa-module
