# telnetlib3 — asyncio Telnet client/server library by Jeff Quast.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: pkginfo-name
    desc: PyPI package name telnetlib3
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*telnetlib3\s*$'

  - id: telnetlib3-homepage
    desc: telnetlib3 project homepage URL
    if:
      type: text
      substr: github.com/jquast/telnetlib3

  - id: telnet-server-module
    desc: telnetlib3 server module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])telnetlib3([\\/])server\.py$'

composite_rules:
  - id: telnetlib3-package
    desc: telnetlib3 asyncio Telnet protocol library
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: telnetlib3-homepage
      - id: telnet-server-module
