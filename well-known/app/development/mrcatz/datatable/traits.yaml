# mrcatz/datatable — Laravel Livewire DataTable base class (MrCatz).
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: mrcatz-datatable-composer-name
    desc: mrcatz/datatable Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: mrcatz/datatable

  - id: mrcatz-datatable-namespace
    desc: MrCatz DataTable PHP namespace
    for: [php]
    if:
      type: text
      substr: MrCatz\\DataTable\\

  - id: mrcatz-service-provider
    desc: MrCatz DataTable Laravel service provider
    for: [php, composer.json, json]
    if:
      type: text
      substr: MrCatz\\DataTable\\MrCatzServiceProvider

composite_rules:
  - id: mrcatz-datatable-package
    desc: mrcatz/datatable Laravel Livewire DataTable library
    crit: notable
    conf: 0.98
    any:
      - id: mrcatz-datatable-composer-name
      - id: mrcatz-service-provider
