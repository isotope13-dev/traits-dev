# akeb/framework — PHP admin framework with auth, migrations, and OAuth.
defaults:
  platforms: [unix, windows]
  for: [php, json, markdown, zip]
  crit: notable
  conf: 0.99

traits:
  - id: composer-package-name
    desc: akeb/framework Composer package name
    for: [json]
    if:
      type: value
      path: name
      exact: akeb/framework

  - id: github-source
    desc: AKEB Framework GitHub repository
    for: [php, json, markdown]
    if:
      type: text
      substr: github.com/AKEB/Framework-AKEB-framework

  - id: framework-migration-class
    desc: AKEB framework database migration class
    for: [php]
    if:
      type: text
      regex: 'class\s+Framework_Migration_\d+'

composite_rules:
  - id: akeb-framework-context
    desc: Recognized akeb/framework PHP package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: github-source
    any:
      - id: composer-package-name
      - id: framework-migration-class
