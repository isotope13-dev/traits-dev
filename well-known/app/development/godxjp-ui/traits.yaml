# @godxjp/ui — GoDX shared React UI framework. Since its inert-install change
# (#1215) postinstall only prints a hint; MCP config, CLAUDE.md and skills are
# written by the explicit `npx godxjp-ui sync-rules` CLI.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: GoDX UI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@godxjp/ui'

  - id: npm-package-name
    desc: GoDX UI npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@godxjp/ui'

  - id: repository-url
    desc: GoDX UI official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/godx-jp/godxjp-ui(\.git)?$'

  - id: npm-repository-url
    desc: GoDX UI npm repository URL field
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/godx-jp/godxjp-ui(\.git)?$'

  - id: upstream-repository-text
    desc: GoDX UI upstream repository reference
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: github.com/godx-jp/godxjp-ui

  - id: postinstall-mcp-setup-marker
    desc: GoDX UI postinstall MCP registration log marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@godxjp/ui → MCP in .mcp.json'

  - id: agent-setup-mcp-launcher
    desc: GoDX UI MCP server npx launcher definition
    for: [javascript, typescript]
    if:
      type: text
      substr: '["@godxjp/ui-mcp"]'

  - id: claude-md-managed-block-marker
    desc: GoDX UI managed CLAUDE.md workflow block marker
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: 'godxjp-ui:start'

  # The whole stub (749 bytes) is a header, one hint naming the package, and
  # exit(0). A hook that grows real code exceeds the size bound or breaks the
  # tail anchor. Its only import, shouldSkip(), reads package.json alone.
  - id: inert-postinstall-hint-stub
    desc: GoDX UI postinstall only prints setup hint
    for: [javascript]
    size_max: 800
    if:
      type: text
      regex: '(?s)writes NOTHING.{0,700}godxjp/ui: agent files are not written.{0,250}exit\(0\);\s*$'

composite_rules:
  - id: official-package-identity
    desc: Official GoDX UI npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official GoDX UI repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: upstream-repository-text

  - id: archive-context
    desc: GoDX UI framework package archive context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: postinstall-mcp-setup-marker
      - id: agent-setup-mcp-launcher
      - id: claude-md-managed-block-marker
