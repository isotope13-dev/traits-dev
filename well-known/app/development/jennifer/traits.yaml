# Jennifer is a small, embeddable programming language. Its `.j` source uses
# `func` declarations, typed `def ... as ... init` bindings, and `$name`
# references; cleave may otherwise classify these files as Python by heuristic.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: repository-identity
    desc: Jennifer GitHub repository identity
    for: [text, markdown, python, archives]
    if:
      type: text
      regex: 'github\.com/jennifer-language/jennifer([/)#\s]|$)'

  - id: source-syntax-func
    desc: Jennifer function declaration syntax
    size_min: 1000
    size_max: 1000000
    if:
      type: text
      regex: '(?m)^\s*func\s+[A-Za-z_][A-Za-z0-9_]*\s*\('
    unless:
      # Python files commonly embed Go examples in docstrings.  Jennifer
      # source is heuristically typed as Python, but its .j files are not.
      # The same heuristic catches every other Python-shaped language, and
      # `func name(` is their ordinary declaration syntax too: auto-editor's
      # Nim sources (`func initLexer*(...)`) type as Python and were reported
      # as the Jennifer language. Extensions other than `.j` are not Jennifer.
      - type: path
        regex: '(?i)\.(py|nims?|pyx)$'
      # yacc grammars commonly append Go helper functions after the second %%.
      - type: basename
        regex: '(?i)\.(y|yy|yacc)$'

  - id: source-syntax-binding
    desc: Jennifer typed binding syntax
    size_min: 1000
    size_max: 1000000
    if:
      type: text
      regex: '\bdef\s+[A-Za-z_][A-Za-z0-9_]*\s+as\s+[A-Za-z_][A-Za-z0-9_]*\s+init\b'

  - id: http-parser-test-file
    desc: Jennifer HTTP parser regression-test source
    if:
      type: path
      regex: '(^|[\\/])modules[\\/]http_test\.j$'

composite_rules:
  - id: recognized-source
    desc: Recognized Jennifer source file
    crit: exception
    conf: 0.99
    size_min: 1000
    size_max: 1000000
    all:
      - id: metadata/file/extension/identity::j-source-extension
    any:
      - id: source-syntax-func
      - id: source-syntax-binding

  # A fetched repository aggregate retains child-source syntax but has no
  # filename extension; archive-wide source metrics are not meaningful there.
  # scope:outer pools TarGz/Gz fetch wrappers with .j children (HEAD is typed gz).
  - id: recognized-project-archive
    desc: Recognized Jennifer source project aggregate
    crit: exception
    conf: 0.99
    for: [gz, tar, archives, python, javascript, markdown, text]
    scope: outer
    all:
      - id: repository-identity
      - id: source-syntax-func
      - id: source-syntax-binding

  - id: http-parser-test-context
    desc: Jennifer HTTP parser regression-test context
    crit: exception
    conf: 0.99
    all:
      - id: recognized-source
      - id: http-parser-test-file
