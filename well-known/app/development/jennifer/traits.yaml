defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.99
traits:
- id: repository-identity
  desc: Jennifer GitHub repository identity
  for:
  - text
  - markdown
  - python
  if:
    type: text
    regex: github\.com/jennifer-language/jennifer([/)#\s]|$)
- id: source-syntax-func
  desc: Jennifer function declaration syntax
  size_min: 1000
  size_max: 1000000
  if:
    type: text
    regex: (?m)^\s*func\s+[A-Za-z_][A-Za-z0-9_]*\s*\(
  unless:
  - type: path
    regex: (?i)\.[a-z0-9]{2,32}$
- id: source-syntax-binding
  desc: Jennifer typed binding syntax
  size_min: 1000
  size_max: 1000000
  if:
    type: text
    regex: \bdef\s+[A-Za-z_][A-Za-z0-9_]*\s+as\s+[A-Za-z_][A-Za-z0-9_]*\s+init\b
- id: http-parser-test-file
  desc: Jennifer HTTP parser regression-test source
  if:
    type: path
    regex: (^|[\\/])modules[\\/]http_test\.j$
composite_rules:
- id: recognized-source
  desc: Recognized Jennifer source file
  crit: exception
  conf: 0.99
  size_min: 1000
  size_max: 1000000
  all:
  - id: metadata/file/extension/identity::j-source-extension
  any:
  - id: source-syntax-func
  - id: source-syntax-binding
- id: recognized-project-archive
  desc: Recognized Jennifer source project aggregate
  crit: exception
  conf: 0.99
  for:
  - gz
  - tar
  - python
  - javascript
  - markdown
  - text
  scope: outer
  all:
  - id: repository-identity
  - id: source-syntax-func
  - id: source-syntax-binding
