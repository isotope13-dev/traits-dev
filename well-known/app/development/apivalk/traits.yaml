# apivalk/apivalk — lightweight PHP REST API framework.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: apivalk-composer-name
    desc: apivalk/apivalk Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: apivalk/apivalk

  - id: apivalk-namespace
    desc: apivalk PHP namespace prefix
    for: [php]
    if:
      type: text
      substr: apivalk\\apivalk\\

  - id: apivalk-homepage
    desc: apivalk.com project homepage
    if:
      type: text
      substr: apivalk.com

composite_rules:
  - id: apivalk-php-framework
    desc: apivalk PHP REST API framework
    crit: notable
    conf: 0.98
    any:
      - id: apivalk-composer-name
      - id: apivalk-homepage
