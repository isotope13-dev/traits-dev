# MorscherLab MLD plugin development SDK (mld-sdk on PyPI).
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95

traits:
  - id: mld-sdk-pkginfo-name
    desc: PyPI package name mld-sdk
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*mld-sdk\s*$'

  - id: mld-console-entrypoint
    desc: mld console_scripts entry point
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^mld\s*=\s*mld_sdk\.cli:'

  - id: morscherlab-maintainer-email
    desc: MorscherLab maintainer contact email
    if:
      type: text
      substr: morscher@chem.ethz.ch

  - id: mld-init-templates-module
    desc: mld_sdk plugin scaffold template module
    for: [python]
    if:
      type: basename
      exact: init_templates.py

composite_rules:
  - id: mld-sdk-package
    desc: MorscherLab MLD plugin development SDK
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: mld-sdk-pkginfo-name
      - id: mld-console-entrypoint
