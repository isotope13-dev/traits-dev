# kak-lsp — Language Server Protocol implementation for Kakoune editor.
defaults:
  platforms: [windows, unix]
  for: [crate, rust, tar, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: crate-package-name
    desc: Cargo crate name kak-lsp
    for: [crate, rust]
    if:
      type: text
      regex: '(?m)^name\s*=\s*"kak-lsp"'

  - id: kak-lsp-github-repo
    desc: kakoune-lsp/kakoune-lsp GitHub repository URL
    if:
      type: text
      substr: kakoune-lsp/kakoune-lsp

composite_rules:
  - id: kak-lsp-crate
    desc: kak-lsp Kakoune editor LSP server crate
    crit: notable
    conf: 0.96
    all:
      - id: crate-package-name
    any:
      - id: kak-lsp-github-repo
