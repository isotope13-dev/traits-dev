# Mendix Labs mxcli — unofficial community CLI for Mendix app development.
# The Makefile uses bunx for frontend tooling; that is maintainer build
# automation, not a transient-package dropper.
defaults:
  platforms: [unix, windows]
  for: [makefile, shell, archives, tar, go]
  crit: notable
  conf: 0.99
  size_max: 2000000

traits:
  - id: release-tree-path
    desc: mxcli versioned source tree path
    if:
      type: path
      regex: '(^|[\\/])mxcli-[0-9]'

  - id: github-archive-path
    desc: mendixlabs mxcli GitHub archive path
    if:
      type: path
      regex: 'mendixlabs/mxcli'

composite_rules:
  - id: official-source-context
    desc: Recognized mxcli source tree
    crit: exception
    conf: 0.99
    any:
      - id: release-tree-path
      - id: github-archive-path
