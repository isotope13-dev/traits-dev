# Crackerjack — Python project management and QA tooling (lesleslie).
defaults:
  platforms: [unix, windows]
  for: [python, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-repo-url
    desc: lesleslie/crackerjack GitHub repository
    if:
      type: text
      substr: github.com/lesleslie/crackerjack

  - id: project-management-summary
    desc: Crackerjack Python project management summary
    if:
      type: text
      substr: Crackerjack Python project management tool

composite_rules:
  - id: crackerjack-qa-tool
    desc: Crackerjack Python project management tool
    crit: notable
    any:
      - id: github-repo-url
      - id: project-management-summary
