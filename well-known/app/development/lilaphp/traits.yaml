# LilaPHP — seip25 lightweight PHP micro-framework.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: archive-path
    desc: LilaPHP project archive directory path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])LilaPHP'

  - id: composer-package-name
    desc: seip25/lila-php Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: seip25/lila-php

  - id: lila-core-namespace
    desc: LilaPHP Core namespace marker
    for: [php]
    if:
      type: text
      substr: app/lila/core/

  - id: github-repo
    desc: seip25 LilaPHP GitHub repository
    for: [json, markdown, php, composer.json]
    if:
      type: text
      substr: seip25/LilaPHP

composite_rules:
  - id: lilaphp-framework
    desc: LilaPHP lightweight PHP micro-framework
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: archive-path
      - id: composer-package-name
      - id: lila-core-namespace
