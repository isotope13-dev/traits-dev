# Zapier Developer Platform CLI SDK (zapier-platform-core).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Zapier platform core package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: zapier-platform-core

  - id: package-member-context
    desc: Zapier platform core package member
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: zapier-platform-core

  - id: archive-package-name
    desc: Zapier platform core npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: zapier-platform-core

  - id: archive-member-path
    desc: Zapier platform npm archive member path
    for: [javascript, typescript]
    if:
      type: path
      substr: zapier-platform-core

  - id: repository-coordinate
    desc: Zapier platform GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository
      regex: 'zapier/zapier-platform'

composite_rules:
  - id: zapier-platform-sdk-context
    desc: Zapier platform core SDK package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-member-context
      - id: archive-package-name
      - id: archive-member-path
      - id: package-name
