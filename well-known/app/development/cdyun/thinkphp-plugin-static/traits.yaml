# cdyun/thinkphp-plugin-static — ThinkPHP Admin static assets plugin.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives, javascript]
  crit: notable
  conf: 0.97

traits:
  - id: thinkphp-plugin-static-composer-name
    desc: cdyun/thinkphp-plugin-static Composer name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: cdyun/thinkphp-plugin-static

  - id: thinkphp-plugin-static-github
    desc: cdyun303 thinkphp-plugin-static GitHub repo
    if:
      type: text
      substr: cdyun303/thinkphp-plugin-static

  - id: pear-admin-static-path
    desc: Pear admin static asset tree path
    for: [archives, javascript]
    if:
      type: path
      regex: '(?i)pear[/\\]module[/\\]'

composite_rules:
  - id: cdyun-thinkphp-plugin-static
    desc: cdyun ThinkPHP Admin static assets plugin
    crit: notable
    conf: 0.98
    any:
      - id: thinkphp-plugin-static-composer-name
      - id: thinkphp-plugin-static-github
