# vscode-swirls — Swirls language VS Code extension with bundled TypeScript LSP.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: vscode-swirls extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-swirls

  - id: publisher
    desc: swirlsai VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: swirlsai

  - id: swirls-language-id
    desc: Swirls language contribution id
    for: [package.json, json]
    if:
      type: text
      substr: '"id": "swirls"'

  - id: github-repo
    desc: byteslicehq/swirls-platform GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: byteslicehq/swirls-platform

composite_rules:
  - id: vscode-swirls-extension
    desc: Swirls language VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: swirls-language-id
      - id: github-repo
