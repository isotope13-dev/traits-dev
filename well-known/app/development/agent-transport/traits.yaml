# agent-transport — SIP and audio streaming for AI voice agents.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name agent-transport
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*agent-transport\s*$'

  - id: plivo-labs-github-repo
    desc: plivo-labs/agent-transport repository URL
    if:
      type: text
      substr: plivo-labs/agent-transport

  - id: livekit-pipecat-transport-summary
    desc: LiveKit and Pipecat voice agent transport
    if:
      type: text
      substr: LiveKit Agents

composite_rules:
  - id: agent-transport-package
    desc: Plivo agent-transport voice AI library
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: plivo-labs-github-repo
      - id: livekit-pipecat-transport-summary
