# coding-academy-lecture-manager — CLM course content processing (hoelzl/clm).
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: coding-academy-lecture-manager wheel
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: coding-academy-lecture-manager

  - id: package-metadata-name
    desc: coding-academy-lecture-manager PyPI name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: coding-academy-lecture-manager'

  - id: module-path
    desc: clm Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)clm/'

  - id: lecture-manager-summary
    desc: Coding-Academy Lecture Manager summary
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: Coding-Academy Lecture Manager

  - id: clm-worker-id-env
    desc: CLM worker pool WORKER_ID environment variable
    for: [python]
    if:
      type: text
      substr: WORKER_ID=

  - id: github-repo
    desc: hoelzl clm GitHub repository
    for: [json, markdown, text, python]
    if:
      type: text
      substr: github.com/hoelzl/clm

composite_rules:
  - id: coding-academy-lecture-manager-package
    desc: Coding Academy CLM lecture manager Python package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
