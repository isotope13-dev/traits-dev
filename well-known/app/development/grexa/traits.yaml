# Grexa — VisorCraft Linux file-content search workbench and CLI
# (https://github.com/visorcraft/Grexa). Rust/Qt desktop grep with optional
# Docker/Podman container search and OpenAI-compatible chat assistance.
defaults:
  platforms: [linux]
  for: [rust, shell, tar, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: grexa-cli-name
    desc: Grexa CLI binary name reference
    for: [shell, rust]
    if:
      type: text
      word: grexa-cli

  - id: visorcraft-bundle-id
    desc: Grexa Freedesktop bundle identifier
    if:
      type: text
      substr: com.visorcraft.Grexa

  - id: visorcraft-github-repo
    desc: VisorCraft Grexa GitHub repository
    if:
      type: text
      substr: visorcraft/Grexa

  - id: grexa-readme-title
    desc: Grexa README project title
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# Grexa\s*$'

composite_rules:
  - id: grexa-source-context
    desc: Grexa Linux search tool source context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: grexa-cli-name
      - id: visorcraft-bundle-id
      - id: visorcraft-github-repo
      - id: grexa-readme-title
