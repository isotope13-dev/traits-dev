# Flow-Wing language-support VS Code extension (kushagra).
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Flow-Wing VS Code extension package name
    if:
      type: value
      path: name
      exact: Flow-Wing

  - id: repository-url
    desc: Flow-Wing source repository
    if:
      type: value
      path: repository.url
      exact: https://github.com/kushagra1212/Flow-Wing

composite_rules:
  - id: flow-wing-vscode-extension
    desc: Flow-Wing language VS Code extension
    all:
      - id: package-name
      - id: repository-url
