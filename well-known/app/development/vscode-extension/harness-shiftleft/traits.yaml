# Harness ShiftLeft Core — Qwiet SAST/SCA VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96

traits:
  - id: harness-publisher
    desc: Harness VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: harness-inc

  - id: shiftleft-core-package-name
    desc: ShiftLeft Core extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: shiftleft-core

  - id: qwiet-learn-url
    desc: Qwiet security product URL
    if:
      type: text
      substr: qwiet.ai

  - id: shiftleft-run-analysis-command
    desc: ShiftLeft workspace analysis command id
    for: [javascript, typescript, json]
    if:
      type: text
      substr: shiftleft-core.runAnalysisOnWorkspace

composite_rules:
  - id: harness-shiftleft-extension
    desc: Harness ShiftLeft SAST and SCA VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: harness-publisher
      - id: shiftleft-core-package-name
