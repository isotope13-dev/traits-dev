# Microsoft Visual Studio Live Share — collaborative coding extension.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, archives]
  crit: notable
  conf: 0.98

traits:
  - id: vsliveshare-extension-path
    desc: VS Live Share extension member path
    for: [archives, javascript, typescript, package.json, c, cpp, text, json]
    if:
      type: path
      regex: '(?i)ms-vsliveshare\.vsliveshare'

  - id: vsliveshare-package-name
    desc: VS Live Share package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "vsliveshare"'

  - id: vsliveshare-bundle-marker
    desc: VS Live Share bundled extension code
    for: [javascript, typescript]
    if:
      type: text
      substr: vsliveshare

composite_rules:
  - id: vsliveshare-extension
    desc: Microsoft Visual Studio Live Share extension
    crit: notable
    conf: 0.99
    any:
      - id: vsliveshare-extension-path
      - id: vsliveshare-package-name
