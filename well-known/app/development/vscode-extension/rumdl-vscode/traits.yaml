# rumdl VS Code — rvben Markdown linter extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: rvben VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: rvben

  - id: package-name
    desc: rumdl VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: rumdl

  - id: display-name
    desc: rumdl Markdown linter display name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: displayName
      exact: rumdl - Markdown Linter

  - id: rumdl-vsix-basename
    desc: rvben rumdl VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^rvben\.rumdl-.*\.vsix$'

  - id: rumdl-vscode-github-repo
    desc: rvben rumdl-vscode GitHub repository
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: github.com/rvben/rumdl-vscode

composite_rules:
  - id: rumdl-vscode-extension
    desc: rumdl Markdown linter VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: display-name
      - id: rumdl-vsix-basename
