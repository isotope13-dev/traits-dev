# fabiospampinato Monokai Night VS Code color theme. The VSIX is JSON
# theme data only; high scores on fetched github.githubassets.com chunks
# are GitHub's frontend, not this extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: fabiospampinato VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: fabiospampinato

  - id: package-name
    desc: Monokai Night VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-monokai-night

  - id: vsix-id
    desc: Monokai Night VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: vscode-monokai-night

  - id: vsix-publisher
    desc: Monokai Night VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: fabiospampinato

  - id: github-repo
    desc: vscode-monokai-night GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: fabiospampinato/vscode-monokai-night
