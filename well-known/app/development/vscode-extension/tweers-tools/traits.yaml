# Tweers Tools — Twee interactive fiction VS Code extension (raven-book).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: tweers-tools VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: tweers-tools

  - id: publisher
    desc: raven-book VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: raven-book

  - id: tweers-tools-vsix-basename
    desc: Raven-Book tweers-tools VSIX basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^Raven-Book\.tweers-tools-.*\.vsix$'

  - id: twee3-language-id
    desc: Twee3 language contribution id
    for: [package.json, json]
    if:
      type: text
      substr: '"id": "twee3"'

  - id: tweers-dev-tool-command
    desc: tweers-dev-tool VS Code command namespace
    for: [package.json, javascript]
    if:
      type: text
      substr: tweers-dev-tool.preview

composite_rules:
  - id: tweers-tools-vscode-extension
    desc: Tweers Tools Twee story VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: tweers-tools-vsix-basename
      - id: twee3-language-id
      - id: tweers-dev-tool-command
