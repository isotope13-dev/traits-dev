# Language Support for Java by Red Hat (publisher: redhat, extension id: java).
# Ships Eclipse JDT language server, Lombok, Ant, and Flexmark — their
# classloaders/clipboard/process helpers are IDE tooling, not backdoors.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, jar]
  crit: notable
  conf: 0.98

traits:
  - id: redhat-java-package-name
    desc: redhat.java extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      # Marketplace package name is often "java" under publisher redhat.
      exact: java

  - id: redhat-java-display-name
    desc: Language Support for Java by Red Hat
    for: [javascript, json, package.json, vsix-manifest, text]
    if:
      type: text
      substr: Language Support for Java(TM) by Red Hat

  - id: redhat-vscode-java-github
    desc: redhat-developer/vscode-java GitHub repo
    for: [javascript, json, package.json, vsix-manifest, text]
    if:
      type: text
      substr: github.com/redhat-developer/vscode-java

  - id: redhat-java-vsix-path
    desc: redhat.java VSIX package path
    for: [archives, vsix, jar, javascript]
    if:
      type: path
      regex: '(?i)redhat\.java-[0-9]'

  - id: jdt-ls-core-jar
    desc: Eclipse JDT language server core JAR
    for: [archives, jar, vsix]
    if:
      type: path
      regex: '(?i)org\.eclipse\.jdt\.ls\.core_'

  - id: eclipse-jdt-package-path
    desc: Eclipse JDT package path
    for: [archives, jar, class, java_class, vsix]
    if:
      type: path
      regex: '(?i)org\.eclipse\.jdt\.|eclipse/jdt/'

  - id: equinox-launcher-path
    desc: Eclipse Equinox macOS launcher path
    for: [archives, jar, macho, vsix]
    size_min: 8192
    size_max: 2000000
    if:
      type: path
      regex: '(?i)equinox\.executable|MacOS/launcher'

  - id: flexmark-package-path
    desc: flexmark markdown library path
    for: [archives, jar, class, java_class, vsix]
    if:
      type: path
      regex: '(?i)flexmark-util|vladsch/flexmark/'

  - id: jna-platform-package-path
    desc: JNA platform package path
    for: [archives, jar, class, java_class, vsix]
    if:
      type: path
      regex: '(?i)jna\.platform|sun/jna/'

composite_rules:
  - id: redhat-java-vscode-extension
    desc: Red Hat Language Support for Java VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/development/vscode-extension/redhat::publisher
    any:
      - id: redhat-java-display-name
      - id: redhat-vscode-java-github
      - id: redhat-java-vsix-path
      - id: jdt-ls-core-jar
