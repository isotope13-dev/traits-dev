# Cappy — autonomous AI dev companion VS Code extension (eduardocecon).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: cappy-extension-path
    desc: Cappy VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)eduardocecon\.cappy'

  - id: cappy-package-name
    desc: Cappy VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "cappy"'

  - id: cappy-publisher
    desc: eduardocecon VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "eduardocecon"'

  - id: cappy-github-repo
    desc: eduardocecon/cappy GitHub repository
    if:
      type: text
      substr: eduardocecon/cappy

  - id: cappy-mcp-sdk-dependency
    desc: Cappy MCP SDK npm dependency
    for: [package.json, json, javascript]
    if:
      type: text
      substr: '"@modelcontextprotocol/sdk"'

  - id: cappy-openai-dependency
    desc: Cappy OpenAI npm dependency
    for: [package.json, json, javascript]
    if:
      type: text
      substr: '"openai"'

composite_rules:
  - id: cappy-vscode-extension
    desc: Cappy AI dev companion VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: cappy-extension-path
      - id: cappy-package-name
