# Frida Code Copilot — AI agent VS Code extension (FridaPlatform).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: fridagpt-package-name
    desc: Frida Code Copilot VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: fridagpt

  - id: fridaplatform-publisher
    desc: FridaPlatform VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: FridaPlatform

  - id: fridagpt-github-repo
    desc: Frida-VsCode-Extension-React GitHub repository
    if:
      type: text
      substr: Fridaplatform/Frida-VsCode-Extension-React

  - id: fridagpt-uri-activation
    desc: Frida Code Copilot custom URI activation
    for: [package.json, json, javascript]
    if:
      type: text
      substr: onUri:vscode://fridaplatform.fridagpt

composite_rules:
  - id: fridagpt-vscode-extension
    desc: Frida Code Copilot AI agent VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: fridagpt-package-name
      - id: fridaplatform-publisher
