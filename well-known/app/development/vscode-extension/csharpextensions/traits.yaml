# C# Extensions — VS Code C# class/interface templates (publisher
# jchannon). Bundled coffee-script is a cb2promise transitive compiler.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: jchannon VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: jchannon

  - id: package-name
    desc: C# Extensions package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: csharpextensions

  - id: vsix-id
    desc: C# Extensions VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: csharpextensions

  - id: vsix-publisher
    desc: C# Extensions VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: jchannon

  - id: github-repo
    desc: jchannon csharpextensions GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: jchannon/csharpextensions
