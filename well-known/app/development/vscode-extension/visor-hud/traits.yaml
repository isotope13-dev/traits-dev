# V.I.S.O.R. HUD — WebGPU developer HUD VS Code extension (dibun75).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: visor-hud-package-name
    desc: V.I.S.O.R. HUD VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: visor-hud

  - id: dibun75-publisher
    desc: dibun75 VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: dibun75

  - id: visor-hud-github-repo
    desc: dibun75/visor GitHub repository
    if:
      type: text
      substr: github.com/dibun75/visor

  - id: visor-hud-command
    desc: V.I.S.O.R. HUD start command
    for: [package.json, json, javascript]
    if:
      type: text
      substr: visor.startHUD

composite_rules:
  - id: visor-hud-vscode-extension
    desc: V.I.S.O.R. HUD WebGPU developer HUD VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: visor-hud-package-name
      - id: dibun75-publisher
