# [FF] Flutter Files — VS Code extension that scaffolds Flutter BLoC
# templates (publisher gornivv / Gorniv). Template Function() compile
# and workspace file writes are product features; identity only.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: gornivv VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: gornivv

  - id: package-name
    desc: vscode-flutter-files package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-flutter-files

  - id: vsix-id
    desc: Flutter Files VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: vscode-flutter-files

  - id: vsix-publisher
    desc: Flutter Files VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: gornivv

  - id: github-repo
    desc: Gorniv vscode-flutter-files repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: Gorniv/vscode-flutter-files

composite_rules:
  - id: vscode-flutter-files-extension
    desc: Flutter Files VS Code scaffold extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
