# Saropa Lints — Dart/Flutter lint rules and Package Vibrancy.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: extension-package-name
    desc: saropa-lints VS Code extension name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: saropa-lints

  - id: publisher-saropa
    desc: saropa VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: saropa

  - id: github-repo
    desc: saropa_lints GitHub repository marker
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: github.com/saropa/saropa_lints

  - id: vibrancy-user-agent
    desc: Saropa Package Vibrancy API User-Agent
    for: [javascript, typescript]
    if:
      type: text
      substr: saropa-package-vibrancy

composite_rules:
  - id: saropa-lints-extension-context
    desc: Saropa Lints Dart/Flutter analysis extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: extension-package-name
      - id: publisher-saropa
