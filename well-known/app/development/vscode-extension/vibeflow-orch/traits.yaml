# VibeFlow Orch — AI workflow builder VS Code extension (vibeflow).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: vibeflow-orch-extension-path
    desc: VibeFlow Orch VS Code extension path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)(vibeflow\.vibeflow-orch|VibeFlow\.vibeflow-orch)'

  - id: vibeflow-orch-package-name
    desc: VibeFlow Orch VS Code package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "vibeflow-orch"'

  - id: vibeflow-orch-publisher
    desc: VibeFlow Orch VS Code publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "vibeflow"'

  - id: vibeflow-orch-github-repo
    desc: VibeFlow Orch GitHub repository URL
    if:
      type: text
      substr: VirgilAdoleyine/vibeflow-orchension

composite_rules:
  - id: vibeflow-orch-vscode-extension
    desc: VibeFlow Orch AI workflow builder VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: vibeflow-orch-extension-path
      - id: vibeflow-orch-package-name
