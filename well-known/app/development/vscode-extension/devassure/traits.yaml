# DevAssure O2 Agent — AI end-to-end test generation VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: devassure VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: devassure

  - id: package-name
    desc: DevAssure agent VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: devassure-agent-vscode-extension

  - id: display-name
    desc: DevAssure O2 Agent VS Code display name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: displayName
      exact: DevAssure O2 Agent

  - id: devassure-vsix-basename
    desc: devassure agent VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^devassure\.devassure-agent-vscode-extension-.*\.vsix$'

  - id: devassure-command-prefix
    desc: DevAssure VS Code command namespace
    for: [package.json, javascript]
    if:
      type: text
      substr: '"command": "devassure.'

composite_rules:
  - id: devassure-vscode-extension
    desc: DevAssure O2 Agent test automation extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: display-name
      - id: devassure-vsix-basename
