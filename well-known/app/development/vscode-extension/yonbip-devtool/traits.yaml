# yonbip-devtool — Yonyou YonBIP developer tooling VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives, jar]
  crit: notable
  conf: 0.97

traits:
  - id: yonbip-devtool-package-name
    desc: yonbip-devtool VS Code extension name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: yonbip-devtool

  - id: yonbip-devtool-github-repo
    desc: yonbip-vscode-dev-tools GitHub repository
    if:
      type: text
      substr: zhangchaocai/yonbip-vscode-dev-tools

  - id: yonyou-mcp-jar-path
    desc: Yonyou MCP server bundled JAR path
    for: [archives, jar, vsix]
    if:
      type: path
      regex: '(?i)yonyou-mcp\.jar$'

composite_rules:
  - id: yonbip-devtool-vscode-extension
    desc: Yonyou YonBIP developer tooling VS Code extension
    crit: notable
    conf: 0.98
    all:
      - id: well-known/app/development/vscode-extension/yds-hyperion::publisher-zhangchck
    any:
      - id: yonbip-devtool-package-name
      - id: yonyou-mcp-jar-path
