# Staqed — learning platform VS Code extension (staqed / staqed.com).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: staqed-extension-path
    desc: Staqed VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)staqed\.staqed'

  - id: staqed-package-name
    desc: Staqed VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "staqed"'

  - id: staqed-publisher
    desc: Staqed VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "staqed"'

  - id: staqed-homepage
    desc: Staqed product homepage URL
    if:
      type: text
      substr: https://staqed.com

composite_rules:
  - id: staqed-vscode-extension
    desc: Staqed learning platform VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: staqed-extension-path
      - id: staqed-package-name
