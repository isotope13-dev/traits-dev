# Official Snowflake VS Code extension (publisher snowflake, package snowflake-vsc).
defaults:
  platforms: [unix, windows]
  for: [javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Snowflake VS Code extension package name
    for: [json]
    if:
      type: value
      path: name
      exact: snowflake-vsc

  - id: request-id-header
    desc: Snowflake HTTP request-id header
    for: [javascript]
    if:
      type: text
      substr: X-Snowflake-Request-Id

  - id: computing-app-suffix
    desc: Snowflake computing app hostname suffix
    for: [javascript]
    if:
      type: text
      substr: .snowflakecomputing.app

  - id: sql-snowflake-scope
    desc: Snowflake SQL TextMate scope name
    for: [javascript]
    if:
      type: text
      substr: 'source.sql.snowflake'

  - id: webpack-437-chunk-path
    desc: Snowflake extension webpack 437 chunk
    for: [javascript, scripts, manifests, data, source]
    if:
      type: path
      regex: 'extension/437\.js'

  - id: webpack-views-chunk-path
    desc: Snowflake extension webpack views chunk
    for: [javascript, scripts, manifests, data, source]
    if:
      type: path
      regex: 'extension/views\.js'

composite_rules:
  - id: snowflake-vscode-extension
    desc: Official Snowflake VS Code extension
    any:
      - id: package-name
      - id: request-id-header
      - id: computing-app-suffix
      - id: sql-snowflake-scope
      - id: webpack-437-chunk-path
      - id: webpack-views-chunk-path
