# GethNet LiteLLM Connector for Copilot — VS Code language-model chat provider.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96

traits:
  - id: gethnet-publisher
    desc: GethNet VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: GethNet

  - id: litellm-connector-package-name
    desc: LiteLLM Connector Copilot extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: litellm-connector-copilot

  - id: litellm-connector-vendor
    desc: LiteLLM language-model chat provider vendor id
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: litellm-connector

  - id: gethnet-connector-repo
    desc: GethNet LiteLLM connector Copilot repository URL
    if:
      type: text
      substr: gethnet/litellm-connector-copilot

composite_rules:
  - id: litellm-connector-copilot-extension
    desc: GethNet LiteLLM Connector for Copilot VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: gethnet-publisher
      - id: litellm-connector-package-name
