# AntiKnife — Antigravity IDE multi-account Google token rotation (ace-express).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: antiknife-extension-path
    desc: AntiKnife VS Code extension member path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)ace-express\.antiknife'

  - id: antiknife-package-name
    desc: AntiKnife VS Code extension package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: antiknife

  - id: antiknife-publisher
    desc: ace-express VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ace-express

  - id: antiknife-github-repo
    desc: AntiKnife GitHub repository URL
    for: [package.json, markdown]
    if:
      type: text
      substr: ace-express/antiknife

  - id: antiknife-command-id
    desc: AntiKnife VS Code command identifier
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: antiKnife.addAccount

composite_rules:
  - id: antiknife-vscode-extension
    desc: AntiKnife Antigravity account rotation extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: antiknife-extension-path
      - id: antiknife-package-name

  - id: antiknife-token-pool-context
    desc: AntiKnife optional remote token pool feature
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: antiknife-vscode-extension
      - id: micro-behaviors/communications/http/upload::remote-token-pool-context
