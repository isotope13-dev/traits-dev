# Coder Remote — VS Code extension for Coder remote workspaces.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: publisher
    desc: coder VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: coder

  - id: package-name
    desc: coder-remote VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: coder-remote

  - id: coder-remote-vsix-basename
    desc: coder-remote VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^coder\.coder-remote-.*\.vsix$'

  - id: vscode-coder-github-repo
    desc: coder/vscode-coder GitHub repository
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: coder/vscode-coder

  - id: coder-ssh-remote-dependency
    desc: Coder extension remote SSH dependency
    for: [package.json, json, javascript]
    if:
      type: text
      substr: ms-vscode-remote.remote-ssh

composite_rules:
  - id: coder-remote-vscode-extension
    desc: Coder remote workspace VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: coder-remote-vsix-basename
      - id: vscode-coder-github-repo
