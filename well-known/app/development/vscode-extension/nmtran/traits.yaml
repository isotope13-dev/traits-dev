# NMTRAN — NONMEM control-stream language support (vrognas/vscode-nmtran).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: nmtran-extension-path
    desc: NMTRAN VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)vrognas\.nmtran'

  - id: nmtran-package-name
    desc: NMTRAN VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: nmtran

  - id: nmtran-publisher
    desc: vrognas VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: vrognas

  - id: nmtran-github-repo
    desc: vrognas vscode-nmtran GitHub repository
    if:
      type: text
      substr: vrognas/vscode-nmtran

composite_rules:
  - id: nmtran-vscode-extension
    desc: NMTRAN NONMEM language VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: nmtran-extension-path
      - id: nmtran-package-name
