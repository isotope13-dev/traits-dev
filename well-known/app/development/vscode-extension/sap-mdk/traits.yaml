# SAP Mobile Development Kit VS Code editor (publisher SAPSE).
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: SAP MDK VS Code extension package name
    if:
      type: value
      path: name
      exact: vsc-extension-mdk

  - id: language-schema-package
    desc: SAP MDK language-schema package name
    if:
      type: value
      path: name
      exact: language-schema

composite_rules:
  - id: sap-mdk-vscode-extension
    desc: SAP Mobile Development Kit VS Code editor
    any:
      - id: package-name
      - id: language-schema-package
