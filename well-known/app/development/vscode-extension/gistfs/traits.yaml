# GistPad (publisher vsls-contrib, package gistfs). Webpack unicode-escape
# overlays of moment locales are decoder artifacts; GitHub gist/repo FS
# APIs are the product. Identity only.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: vsls-contrib VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: vsls-contrib

  - id: package-name
    desc: gistfs VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: gistfs

  - id: vsix-id
    desc: gistfs VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: gistfs

  - id: vsix-publisher
    desc: vsls-contrib VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: vsls-contrib

  - id: github-repo
    desc: lostintangent gistpad GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/lostintangent/gistpad

composite_rules:
  - id: gistfs-manifest-identity
    desc: vsls-contrib gistfs publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: gistfs-vsix-identity
    desc: vsls-contrib gistfs VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
