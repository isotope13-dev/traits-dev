# vscode-quarkus — Red Hat Quarkus Tools VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-quarkus-package-name
    desc: vscode-quarkus extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-quarkus

  - id: vscode-quarkus-github-repo
    desc: redhat-developer/vscode-quarkus GitHub repo
    if:
      type: text
      substr: github.com/redhat-developer/vscode-quarkus

  - id: quarkus-ls-jar
    desc: Quarkus language server uber JAR path
    for: [archives, jar, vsix]
    if:
      type: path
      regex: '(?i)com\.redhat\.qute\.ls-uber\.jar$'

composite_rules:
  # The publisher leg alone identified Red Hat, not Quarkus, so every Red Hat
  # extension was reported as Quarkus Tools. Require a Quarkus-specific marker.
  - id: redhat-vscode-quarkus-extension
    desc: Red Hat Quarkus Tools VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/development/vscode-extension/redhat::publisher
    any:
      - id: vscode-quarkus-package-name
      - id: vscode-quarkus-github-repo
      - id: quarkus-ls-jar
