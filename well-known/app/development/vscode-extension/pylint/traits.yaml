# Microsoft vscode-pylint — official Pylint linter for VS Code.
# Bundled extension.js and dill pickle helpers are product linting,
# not a dropper. Fetched github.githubassets.com chunks are GitHub's
# frontend. Reuse flake8 ms-python publisher atoms (do not duplicate).
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: pylint VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: pylint

  - id: vsix-id
    desc: pylint VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: pylint

  - id: github-repo
    desc: microsoft vscode-pylint GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/microsoft/vscode-pylint

composite_rules:
  - id: pylint-manifest-identity
    desc: ms-python pylint publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: well-known/app/development/vscode-extension/flake8::publisher
      - id: package-name

  - id: pylint-vsix-identity
    desc: ms-python pylint VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: well-known/app/development/vscode-extension/flake8::vsix-publisher
