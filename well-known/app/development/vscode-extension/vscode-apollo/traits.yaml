# Official Apollo GraphQL VS Code extension (publisher apollographql).
# Bundled language-server HTTP/process/socket use is GraphQL tooling, not C2.
# package.json postinstall runs patch-package on graphql.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: Apollo GraphQL VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: apollographql

  - id: package-name
    desc: Apollo GraphQL VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-apollo

  - id: vsix-id
    desc: Apollo GraphQL VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: vscode-apollo

  - id: vsix-publisher
    desc: Apollo GraphQL VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: apollographql

  - id: github-repo
    desc: Apollo vscode-graphql GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/apollographql/vscode-graphql
