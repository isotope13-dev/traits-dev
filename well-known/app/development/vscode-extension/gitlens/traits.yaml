# GitLens — Git supercharged VS Code extension (eamodio / GitKraken).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: gitlens-extension-path
    desc: GitLens VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)eamodio\.gitlens'

  - id: gitlens-package-name
    desc: GitLens VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "gitlens"'

  - id: gitlens-publisher
    desc: GitLens VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "eamodio"'

composite_rules:
  - id: gitlens-vscode-extension
    desc: GitLens Git supercharged VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: gitlens-extension-path
      - id: gitlens-package-name
