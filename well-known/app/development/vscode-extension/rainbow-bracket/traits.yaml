# tal7aouy Rainbow Brackets — VS Code bracket colorizer. Activation on
# all events and editor terminal APIs are product editor UX, not a
# dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: tal7aouy VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: tal7aouy

  - id: package-name
    desc: rainbow-bracket VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: rainbow-bracket

  - id: vsix-id
    desc: rainbow-bracket VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: rainbow-bracket

  - id: vsix-publisher
    desc: tal7aouy VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: tal7aouy

  - id: github-repo
    desc: tal7aouy RainbowBrackets GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/tal7aouy/RainbowBrackets

composite_rules:
  - id: rainbow-bracket-manifest-identity
    desc: tal7aouy rainbow-bracket publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: rainbow-bracket-vsix-identity
    desc: tal7aouy rainbow-bracket VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
