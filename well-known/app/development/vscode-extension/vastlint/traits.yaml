# vastlint — aleksUIX IAB VAST XML validator VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: aleksUIX VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: aleksUIX

  - id: package-name
    desc: vastlint VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vastlint

  - id: display-name
    desc: vastlint VAST XML Validator display name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: displayName
      exact: vastlint — VAST XML Validator

  - id: vastlint-vsix-basename
    desc: aleksUIX vastlint VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^aleksUIX\.vastlint-.*\.vsix$'

  - id: vastlint-github-repo
    desc: aleksUIX vastlint GitHub repository
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: github.com/aleksUIX/vastlint

composite_rules:
  - id: vastlint-vscode-extension
    desc: vastlint IAB VAST XML validator extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: display-name
      - id: vastlint-vsix-basename
