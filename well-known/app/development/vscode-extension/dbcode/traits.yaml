defaults:
  platforms: [windows, unix]
  for: [javascript, json, zip]
  crit: notable
  conf: 0.98
traits:
  - id: vsix-member
    desc: DBCode VS Code extension
    if:
      type: path
      substr: dbcode.dbcode
  - id: package-name
    desc: DBCode extension package name
    for: [json]
    if:
      type: value
      path: name
      exact: dbcode
  - id: table-edit-bundle
    desc: DBCode table editor bundle
    for: [javascript]
    if:
      type: text
      substr: data-dbcod
  - id: role-editor-bundle
    desc: DBCode role editor bundle
    for: [javascript]
    if:
      type: basename
      exact: roleEditor.js
  - id: snowflake-sdk-bundle
    desc: DBCode bundled Snowflake SDK
    for: [javascript]
    if:
      type: basename
      exact: snowflake-sdk.js
  - id: firebase-admin-bundle
    desc: DBCode bundled Firebase Admin SDK
    for: [javascript]
    if:
      type: basename
      exact: firebase-admin.js
  - id: mssql-bundle
    desc: DBCode bundled MSSQL SDK
    for: [javascript]
    if:
      type: basename
      exact: mssql.js
  - id: dbcode-string
    desc: DBCode string marker
    for: [javascript]
    if:
      type: text
      substr: dbcode
  - id: execplan-bundle-path
    desc: DBCode execution-plan UI bundle path
    crit: notable
    for: [javascript, scripts, manifests, data, source]
    if:
      type: path
      regex: 'execplan\.js'
  - id: execplan-url-layer-path
    desc: DBCode execplan URL-decode layer path
    crit: notable
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'execplan\.js##url@'
  - id: execplan-unicode-layer-path
    desc: DBCode execplan unicode-escape layer path
    crit: notable
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'execplan\.js##unicode-escape@'
  - id: dbc-theme-selector-element
    desc: DBCode theme-selector custom element
    crit: component
    for: [javascript]
    if:
      type: text
      substr: dbc-theme-selector
composite_rules:
  - id: mongodb-bundle
    desc: DBCode bundled MongoDB SDK
    for: [javascript]
    all:
      - id: vsix-member
      - id: well-known/lib/data/mongodb::mongodb-driver-basename
  - id: extension-main-bundle
    desc: DBCode main extension bundle
    for: [javascript]
    all:
      - id: metadata/build/bundler::vscode-extension-bundle-basename
      - id: dbcode-string
  - id: execution-plan-path-and-marker
    desc: DBCode execution-plan bundle path and content
    crit: component
    for: [javascript]
    all:
      - id: execplan-bundle-path
      - id: dbcode-string
  - id: execution-plan-ui-bundle
    desc: DBCode execution-plan UI bundle
    for: [javascript]
    any:
      - id: execution-plan-path-and-marker
      - id: dbc-theme-selector-element
  - id: extension-context
    desc: DBCode VS Code extension context
    any:
      - id: vsix-member
      - id: package-name
      - id: table-edit-bundle
      - id: role-editor-bundle
      - id: snowflake-sdk-bundle
      - id: firebase-admin-bundle
      - id: mongodb-bundle
      - id: mssql-bundle
      - id: extension-main-bundle
      - id: execution-plan-ui-bundle
