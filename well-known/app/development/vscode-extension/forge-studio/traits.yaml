# Forge Studio — Alto9 VS Code/Cursor GitHub-centric AI workflow extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: Alto9 VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: alto9

  - id: package-name
    desc: forge-studio extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: forge-studio

  - id: display-name
    desc: Forge Studio VS Code display name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: displayName
      exact: Forge Studio

  - id: forge-github-repo
    desc: alto9/forge GitHub repository URL
    for: [package.json, json, javascript, markdown, github_actions]
    if:
      type: text
      substr: github.com/alto9/forge

  - id: forge-vsix-basename
    desc: Alto9 Forge Studio VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^alto9\.forge-studio-.*\.vsix$'

composite_rules:
  - id: forge-studio-extension
    desc: Forge Studio GitHub-centric AI workflow VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: display-name
      - id: forge-vsix-basename
