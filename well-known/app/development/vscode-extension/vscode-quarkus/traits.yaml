# vscode-quarkus — Red Hat Quarkus Tools VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-quarkus-extension-path
    desc: Red Hat Quarkus VS Code extension path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)redhat\.vscode-quarkus'

  - id: vscode-quarkus-github-repo
    desc: redhat-developer/vscode-quarkus GitHub repo
    if:
      type: text
      substr: redhat-developer/vscode-quarkus

composite_rules:
  - id: vscode-quarkus-extension
    desc: Red Hat Quarkus Tools VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: vscode-quarkus-extension-path
      - id: well-known/app/development/vscode-extension/quarkus::vscode-quarkus-package-name
      - id: well-known/app/development/vscode-extension/redhat::publisher
      - id: well-known/app/development/vscode-extension/quarkus::quarkus-ls-jar
