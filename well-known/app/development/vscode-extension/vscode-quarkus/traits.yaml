# vscode-quarkus — Red Hat Quarkus Tools VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-quarkus-extension-path
    desc: Red Hat Quarkus VS Code extension path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)redhat\.vscode-quarkus'

  - id: vscode-quarkus-package-name
    desc: vscode-quarkus extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-quarkus

  - id: redhat-publisher
    desc: redhat VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: redhat

  - id: vscode-quarkus-github-repo
    desc: redhat-developer/vscode-quarkus GitHub repo
    if:
      type: text
      substr: redhat-developer/vscode-quarkus

  - id: qute-ls-jar
    desc: Red Hat Qute language server uber JAR
    for: [archives, jar, vsix]
    if:
      type: path
      regex: '(?i)com\.redhat\.qute\.ls-uber\.jar'

composite_rules:
  - id: vscode-quarkus-extension
    desc: Red Hat Quarkus Tools VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: vscode-quarkus-extension-path
      - id: vscode-quarkus-package-name
