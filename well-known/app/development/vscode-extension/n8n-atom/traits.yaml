# n8n Atom — atom8n n8n workflow client VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: n8n-atom-v3 VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: n8n-atom-v3

  - id: publisher
    desc: atom8n VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: atom8n

  - id: n8n-atom-vsix-basename
    desc: atom8n n8n-atom VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^atom8n\.n8n-atom-v3-.*\.vsix$'

  - id: n8n-new-request-command
    desc: n8n.newRequest VS Code command
    for: [package.json, json, javascript]
    if:
      type: text
      substr: n8n.newRequest

  - id: n8n-custom-editor-activation
    desc: n8n custom editor activation event
    for: [package.json, json]
    if:
      type: text
      substr: onCustomEditor:n8n.apiEditor

  - id: n8n-icon-default-export
    desc: n8n design-system N8nIcon bundled export
    for: [javascript]
    if:
      type: text
      substr: N8nIcon_default

  - id: n8n-text-default-export
    desc: n8n design-system N8nText bundled export
    for: [javascript]
    if:
      type: text
      substr: N8nText_default

  - id: n8n-ndv-empty-state
    desc: n8n Node Details View empty-state component
    for: [javascript]
    if:
      type: text
      substr: '__name: "NDVEmptyState"'

  - id: n8n-insights-chart
    desc: n8n insights chart Vue component
    for: [javascript]
    if:
      type: text
      substr: InsightsChart

  - id: n8n-run-data-html
    desc: n8n workflow run HTML preview component
    for: [javascript]
    if:
      type: text
      substr: 'name: "RunDataHtml"'

  - id: n8n-chat-file-component
    desc: n8n editor ChatFile Vue component
    for: [javascript]
    if:
      type: text
      substr: '__name: "ChatFile"'

  - id: n8n-entity-not-found
    desc: n8n EntityNotFound Vue component
    for: [javascript]
    if:
      type: text
      substr: '__name: "EntityNotFound"'

  - id: n8n-entity-unauthorised
    desc: n8n EntityUnAuthorised Vue component
    for: [javascript]
    if:
      type: text
      substr: '__name: "EntityUnAuthorised"'

  - id: n8n-keyboard-shortcut-tooltip
    desc: n8n KeyboardShortcutTooltip component
    for: [javascript]
    if:
      type: text
      substr: '__name: "KeyboardShortcutTooltip"'

  - id: n8n-project-icon
    desc: n8n ProjectIcon Vue component
    for: [javascript]
    if:
      type: text
      substr: '__name: "ProjectIcon"'

  - id: n8n-page-view-layout
    desc: n8n PageViewLayout Vue SFC module
    for: [javascript]
    if:
      type: text
      substr: PageViewLayout_vue_vue_type_style_index_0

  - id: n8n-animated-spinner
    desc: n8n AnimatedSpinner Vue SFC export
    for: [javascript]
    if:
      type: text
      substr: AnimatedSpinner_default

composite_rules:
  - id: n8n-atom-vscode-extension
    desc: atom8n n8n workflow VS Code client extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: n8n-atom-vsix-basename
      - id: n8n-new-request-command
      - id: n8n-icon-default-export
      - id: n8n-text-default-export
      - id: n8n-ndv-empty-state
      - id: n8n-insights-chart
      - id: n8n-run-data-html
      - id: n8n-chat-file-component
      - id: n8n-entity-not-found
      - id: n8n-entity-unauthorised
      - id: n8n-keyboard-shortcut-tooltip
      - id: n8n-project-icon
      - id: n8n-page-view-layout
      - id: n8n-animated-spinner

  - id: n8n-editor-ui-chunk
    desc: n8n workflow editor UI bundle chunk
    crit: notable
    conf: 0.98
    for: [javascript]
    any:
      - id: n8n-icon-default-export
      - id: n8n-text-default-export
      - id: n8n-ndv-empty-state
      - id: n8n-insights-chart
      - id: n8n-run-data-html
      - id: n8n-chat-file-component
      - id: n8n-entity-not-found
      - id: n8n-entity-unauthorised
      - id: n8n-keyboard-shortcut-tooltip
      - id: n8n-project-icon
      - id: n8n-page-view-layout
      - id: n8n-animated-spinner
