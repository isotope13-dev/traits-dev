# G-Coder — AI coding assistant VS Code extension (bytarchai).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: g-coder-package-name
    desc: g-coder VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: g-coder

  - id: bytarchai-publisher
    desc: bytarchai VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: bytarchai

  - id: g-coder-github-repo
    desc: bytarchai/G-coder GitHub repository
    if:
      type: text
      substr: github.com/bytarchai/G-coder

composite_rules:
  - id: g-coder-vscode-extension
    desc: G-Coder AI coding assistant VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: g-coder-package-name
      - id: bytarchai-publisher
