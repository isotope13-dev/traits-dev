# Pyrefly (loong64) — LoongArch port of Meta's Pyrefly Python language server.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 5000000

traits:
  - id: loong-vsx-publisher
    desc: loong-vsx VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: loong-vsx

  - id: pyrefly-package-name
    desc: Pyrefly VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: pyrefly

  - id: pyrefly-loong64-repo
    desc: Pyrefly LoongArch64 port repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: loongcodium/pyrefly-loong64

  - id: pyrefly-org-url
    desc: Pyrefly language server project URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: pyrefly.org

  - id: pyrefly-lsp-binary-basename
    desc: Bundled Pyrefly language server binary basename
    for: [elf]
    crit: notable
    conf: 0.96
    size_min: 1000000
    size_max: 200000000
    if:
      type: basename
      exact: pyrefly

composite_rules:
  - id: pyrefly-loong64-extension
    desc: Pyrefly LoongArch64 Python language server VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: loong-vsx-publisher
      - id: pyrefly-package-name
