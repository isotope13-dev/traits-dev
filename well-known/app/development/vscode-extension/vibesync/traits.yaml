# VibeSync — mobile mirror for AI coding sessions VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: vibesync-extension VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vibesync-extension

  - id: publisher
    desc: vibesync VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: vibesync

  - id: vibesync-vsix-basename
    desc: vibesync VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^vibesync\.vibesync-extension-.*\.vsix$'

  - id: vibesync-homepage
    desc: vibesync.app extension homepage URL
    for: [package.json, json, markdown]
    if:
      type: text
      substr: vibesync.app

  - id: vibesync-github-repo
    desc: vibesync vscode-extension GitHub repository
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: vibesync/vscode-extension

  - id: vibesync-chat-participant
    desc: vibesync.assistant chat participant id
    for: [package.json, json]
    if:
      type: text
      substr: vibesync.assistant

composite_rules:
  - id: vibesync-vscode-extension
    desc: VibeSync mobile AI session mirror extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: vibesync-vsix-basename
      - id: vibesync-homepage
