# hledger — plain-text accounting journal language support (juev/hledger-vscode).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: hledger-extension-path
    desc: hledger VS Code extension member path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)evsyukov\.hledger'

  - id: hledger-package-name
    desc: hledger VS Code extension package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: hledger

  - id: hledger-publisher
    desc: evsyukov VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: evsyukov

  - id: hledger-github-repo
    desc: juev/hledger-vscode GitHub repository URL
    for: [package.json, markdown]
    if:
      type: text
      substr: juev/hledger-vscode

  - id: hledger-language-id
    desc: hledger VS Code language identifier
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: '"id": "hledger"'

composite_rules:
  - id: hledger-vscode-extension
    desc: hledger plain-text accounting VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: hledger-extension-path
      - id: hledger-package-name
