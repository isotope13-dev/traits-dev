defaults:
  platforms: [windows, unix]
  for: [vsix-archive, zip, package.json, json]
  crit: notable
  conf: 0.98
traits:
  - id: archive-name
    desc: dscodegpt VS Code extension archive
    for: [vsix-archive, zip]
    if:
      type: value
      path: file.stem
      regex: '(?i)dscodegpt'
  - id: package-name
    desc: dscodegpt package name
    for: [package.json, json]
    if:
      type: value
      path: name
      exact: dscodegpt

  - id: vsix-id
    desc: dscodegpt VSIX identity
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: dscodegpt

  - id: package-member-service-url
    desc: dscodegpt first-party JSON endpoint
    for: [javascript, typescript]
    if:
      type: literal
      regex: '(?i)https://storage\.codegpt\.co/vscode/(funnel|planPrices)\.json'

composite_rules:
  - id: package-member-context
    desc: dscodegpt first-party JSON service context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: package-member-service-url
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: extension-context
    desc: dscodegpt VS Code extension context
    crit: exception
    conf: 0.98
    # Consumers (e.g. the fetch-eval hostile composite) reference this from
    # unless: against javascript/typescript bundle files, not just the
    # archive-level types above. Without an explicit for: here the composite
    # inherited the file defaults.for (vsix-archive/zip/package.json/json),
    # so it silently never matched for javascript and the exception was dead.
    for: [vsix-archive, zip, package.json, json, javascript, typescript]
    scope: archive
    any:
      - id: archive-name
      - id: package-name
