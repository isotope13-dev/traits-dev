# JJ View — Jujutsu (jj) VCS integration for VS Code (brychanrobot).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: jj-view-package-name
    desc: JJ View VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: jj-view

  - id: jj-view-publisher
    desc: jj-view VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: jj-view

  - id: jj-view-github-repo
    desc: brychanrobot/jj-view GitHub repository
    if:
      type: text
      substr: github.com/brychanrobot/jj-view

  - id: jj-view-jujutsu-workspace-activation
    desc: JJ View activates on Jujutsu workspace marker
    for: [package.json, json, javascript]
    if:
      type: text
      substr: workspaceContains:.jj

  - id: jj-view-commit-editor
    desc: JJ View commit details custom editor
    for: [package.json, json, javascript]
    if:
      type: text
      substr: jj-view.commitDetailsEditor

composite_rules:
  - id: jj-view-vscode-extension
    desc: JJ View Jujutsu VCS VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: jj-view-package-name
      - id: jj-view-github-repo
