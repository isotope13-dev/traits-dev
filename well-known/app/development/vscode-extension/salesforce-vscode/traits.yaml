# Official Salesforce DX / Lightning VS Code extensions and bundled Aura client code.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json, vsix-manifest, archives, jar]
  crit: baseline
  conf: 0.98
  size_max: 524288000

traits:
  - id: salesforce-vscode-publisher
    desc: Salesforce VS Code extension publisher
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: salesforce
  - id: salesforce-vscode-package-name
    desc: Salesforce DX VS Code extension package name
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      regex: '(?i)^salesforcedx-vscode'
  - id: salesforce-vscode-archive-name
    desc: Salesforce DX VS Code extension archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])salesforce\.salesforcedx-vscode-[^\\/]+\.vsix$'
  - id: salesforce-vscode-path
    desc: Salesforce DX VS Code extension path
    crit: notable
    if:
      type: path
      regex: '(?i)salesforcedx-vscode|apex-jorje-lsp'
  - id: salesforce-aura-client-marker
    desc: Salesforce Aura client service marker
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'AuraClientService\.prototype\.handleNoAccessException|markup://aura:noAccess'
  - id: salesforce-lightning-lsp-marker
    desc: Salesforce Lightning LSP extension marker
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      regex: '(?i)salesforcedx-vscode-lightning|auraServer\.js'
  - id: salesforce-lwc-package-name
    desc: Salesforce LWC VS Code package name
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: salesforcedx-vscode-lwc

  - id: salesforce-agents-package-name
    desc: Salesforce Agentforce DX VS Code package name
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: salesforcedx-vscode-agents

  - id: agentforce-display-name
    desc: Agentforce DX VS Code display name
    crit: notable
    for: [package.json, json]
    if:
      type: value
      path: displayName
      exact: Agentforce DX

  - id: metadata-visualizer-package-name
    desc: Salesforce metadata visualizer extension name
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: salesforcedx-metadata-visualizer-vscode

  - id: metadata-visualizer-vsix-basename
    desc: Salesforce metadata visualizer VSIX basename
    crit: notable
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^salesforce\.salesforcedx-metadata-visualizer.*\.vsix$'

  - id: metadata-visualizer-github-repo
    desc: forcedotcom metadata visualizer support repo
    crit: notable
    for: [package.json, json, markdown]
    if:
      type: text
      substr: forcedotcom/salesforce-metadata-visualizer-support

composite_rules:
  - id: salesforce-vscode
    desc: Official Salesforce VS Code extension package
    crit: notable
    any:
      - id: salesforce-vscode-publisher
      - id: salesforce-vscode-package-name
      - id: salesforce-vscode-archive-name
      - id: salesforce-vscode-path
      - id: salesforce-aura-client-marker
      - id: salesforce-lightning-lsp-marker
      - id: salesforce-lwc-package-name
      - id: salesforce-agents-package-name
      - id: agentforce-display-name
      - id: metadata-visualizer-package-name
      - id: metadata-visualizer-vsix-basename
      - id: metadata-visualizer-github-repo

  - id: salesforce-metadata-visualizer-extension
    desc: Salesforce metadata visualizer VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: salesforce-vscode-publisher
    any:
      - id: metadata-visualizer-package-name
      - id: metadata-visualizer-vsix-basename
      - id: metadata-visualizer-github-repo

  - id: salesforce-vscode-extension-context
    desc: Salesforce DX VS Code extension context
    crit: exception
    conf: 0.98
    for: [javascript, archives, package.json, json]
    any:
      - id: salesforce-vscode-archive-name
      - id: salesforce-vscode-package-name
      - id: salesforce-lwc-package-name
      - id: salesforce-agents-package-name
      - id: salesforce-lightning-lsp-marker
      - id: salesforce-aura-client-marker
