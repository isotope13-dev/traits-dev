# SiFli SDK CodeKit — embedded SiFli SDK development VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: sifli-codekit-extension-path
    desc: SiFli SDK CodeKit VS Code extension path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)SiFli\.sifli-sdk-codekit'

  - id: sifli-codekit-package-name
    desc: sifli-sdk-codekit VS Code package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: sifli-sdk-codekit

  - id: sifli-publisher
    desc: SiFli VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: SiFli

  - id: sifli-codekit-github-repo
    desc: OpenSiFli SiFli-SDK-CodeKit GitHub repo
    for: [package.json, markdown]
    if:
      type: text
      substr: OpenSiFli/SiFli-SDK-CodeKit

  - id: sifli-probe-rs-debug-type
    desc: sifli-probe-rs VS Code debug adapter type
    for: [package.json, json, javascript]
    if:
      type: text
      substr: onDebug:sifli-probe-rs

composite_rules:
  - id: sifli-sdk-codekit-vscode-extension
    desc: SiFli SDK CodeKit embedded IDE extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: sifli-codekit-extension-path
      - id: sifli-codekit-package-name
