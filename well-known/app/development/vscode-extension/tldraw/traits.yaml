# tldraw — infinite canvas whiteboard VS Code extension (tldraw-org publisher).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: tldraw-extension-path
    desc: tldraw VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)tldraw-org\.tldraw-vscode'

  - id: tldraw-package-name
    desc: tldraw VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "tldraw-vscode"'

  - id: tldraw-publisher
    desc: tldraw VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "tldraw-org"'

composite_rules:
  - id: tldraw-vscode-extension
    desc: tldraw infinite canvas VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: tldraw-extension-path
      - id: tldraw-package-name
