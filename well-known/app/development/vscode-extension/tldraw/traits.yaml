# tldraw — infinite canvas whiteboard VS Code extension (tldraw-org).
# Bundled webpack editor/extension.js and vsce packaging scripts are
# product, not a dropper. Identity only; do not match generic tldraw JS.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: tldraw-org VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: tldraw-org

  - id: package-name
    desc: tldraw-vscode VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: tldraw-vscode

  - id: vsix-id
    desc: tldraw-vscode VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: tldraw-vscode

  - id: vsix-publisher
    desc: tldraw-org VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: tldraw-org

  - id: github-repo
    desc: tldraw GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/tldraw/tldraw

  - id: extension-path
    desc: tldraw VS Code extension member path
    for: [vsix, package.json]
    if:
      type: path
      regex: '(?i)tldraw-org\.tldraw-vscode'

  - id: vsix-basename
    desc: tldraw-org tldraw VSIX archive name
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^tldraw-org\.tldraw-vscode-'

composite_rules:
  - id: tldraw-manifest-identity
    desc: tldraw-org tldraw-vscode publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: tldraw-vsix-identity
    desc: tldraw-org tldraw-vscode VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher

  - id: tldraw-vscode-extension
    desc: tldraw infinite canvas VS Code extension
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: tldraw-manifest-identity
      - id: tldraw-vsix-identity
      - id: github-repo
      - id: extension-path
      - id: vsix-basename
