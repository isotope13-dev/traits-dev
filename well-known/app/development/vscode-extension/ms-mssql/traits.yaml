# Official Microsoft SQL Server VS Code extension (ms-mssql.mssql) and its
# bundled SqlToolsService. Identity for the marketplace VSIX / package.json.
defaults:
  platforms: [windows, unix]
  for: [json, package.json, vsix-manifest, vsix, javascript, zip]
  crit: notable
  conf: 0.99
  size_max: 200000000

traits:
  - id: mssql-extension-package-name
    desc: ms-mssql.mssql VS Code extension package name
    for: [json, package.json, vsix-manifest]
    if:
      type: value
      path: name
      exact: mssql

  - id: mssql-extension-publisher
    desc: ms-mssql VS Code extension publisher
    for: [json, package.json, vsix-manifest]
    if:
      type: value
      path: publisher
      exact: ms-mssql

  - id: vscode-mssql-github
    desc: Microsoft vscode-mssql GitHub repository
    if:
      type: text
      substr: 'github.com/Microsoft/vscode-mssql'

  - id: mssql-vsix-path
    desc: ms-mssql.mssql VSIX package path
    for: [vsix, zip, javascript]
    if:
      type: path
      regex: '(?i)(^|/)ms-mssql\.mssql'

composite_rules:
  - id: microsoft-vscode-mssql-extension
    desc: Microsoft SQL Server VS Code extension
    conf: 0.99
    needs: 2
    any:
      - id: mssql-extension-package-name
      - id: mssql-extension-publisher
      - id: vscode-mssql-github
      - id: mssql-vsix-path
