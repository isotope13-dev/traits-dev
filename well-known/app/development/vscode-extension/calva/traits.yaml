# Calva — Clojure/ClojureScript REPL VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: betterthantomorrow VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: betterthantomorrow

  - id: package-name
    desc: calva VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: calva

  - id: calva-github-repo
    desc: BetterThanTomorrow/calva GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: BetterThanTomorrow/calva

  - id: vsix-id
    desc: Calva VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: calva

  - id: vsix-publisher
    desc: Calva VSIX publisher identity
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: betterthantomorrow

  - id: calva-site
    desc: Calva product site URL
    for: [javascript, markdown]
    if:
      type: text
      substr: calva.io

composite_rules:
  - id: calva-vscode-extension
    desc: Calva Clojure REPL VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
