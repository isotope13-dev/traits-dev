# VMware vscode-manifest-yaml — CloudFoundry manifest.yml VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: vscode-manifest-yaml extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-manifest-yaml

  - id: publisher
    desc: VMware VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: vmware

  - id: vsix-basename
    desc: VMware manifest-yaml VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^vmware\.vscode-manifest-yaml-.*\.vsix$'

  - id: spring-tools-repo
    desc: spring-projects spring-tools GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: spring-projects/spring-tools

  - id: manifest-yaml-language-id
    desc: manifest-yaml VS Code language id
    for: [package.json, json]
    if:
      type: text
      substr: onLanguage:manifest-yaml

composite_rules:
  - id: vmware-manifest-yaml-extension
    desc: VMware CloudFoundry manifest YAML extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: vsix-basename
      - id: spring-tools-repo
