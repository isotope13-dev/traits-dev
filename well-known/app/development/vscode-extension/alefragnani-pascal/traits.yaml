# alefragnani Pascal language-support VS Code extension. GNU GLOBAL
# execFile/gtags and .vscode/GTEMP.pas writes are code navigation;
# fetched github.githubassets.com chunks are GitHub's SPA, not this pack.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: alefragnani VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: alefragnani

  - id: package-name
    desc: pascal VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: pascal

  - id: vsix-id
    desc: pascal language VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: pascal

  - id: vsix-publisher
    desc: alefragnani VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: alefragnani

  - id: github-repo
    desc: vscode-language-pascal GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/alefragnani/vscode-language-pascal

composite_rules:
  - id: alefragnani-pascal-manifest-identity
    desc: alefragnani pascal publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: alefragnani-pascal-vsix-identity
    desc: alefragnani pascal VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
