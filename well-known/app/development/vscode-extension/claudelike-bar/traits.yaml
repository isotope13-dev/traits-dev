# claudelike-bar — Claude Code terminal session sidebar dashboard.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: aes87 VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: aes87

  - id: package-name
    desc: claudelike-bar VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: claudelike-bar

  - id: claudelike-bar-github-repo
    desc: aes87/claudelike-bar repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: aes87/claudelike-bar

composite_rules:
  - id: claudelike-bar-extension
    desc: Claudelike Bar Claude Code dashboard extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
