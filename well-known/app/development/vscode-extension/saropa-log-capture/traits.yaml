# Saropa Log Capture — debug log viewer and AI activity monitor.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: saropa-log-capture-extension-path
    desc: Saropa Log Capture VS Code extension path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)saropa\.saropa-log-capture'

  - id: saropa-log-capture-package-name
    desc: saropa-log-capture VS Code package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: saropa-log-capture

  - id: publisher-saropa
    desc: saropa VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: saropa

  - id: saropa-log-capture-github-repo
    desc: saropa/saropa-log-capture GitHub repository
    for: [package.json, markdown]
    if:
      type: text
      substr: saropa/saropa-log-capture

  - id: saropa-log-capture-start-command
    desc: saropaLogCapture.start VS Code command id
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: saropaLogCapture.start

composite_rules:
  - id: saropa-log-capture-vscode-extension
    desc: Saropa Log Capture debug log viewer extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: saropa-log-capture-extension-path
      - id: saropa-log-capture-package-name
