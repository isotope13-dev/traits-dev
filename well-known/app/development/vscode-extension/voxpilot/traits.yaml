# VoxPilot — on-device voice-to-code VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: natearcher-ai VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: natearcher-ai

  - id: package-name
    desc: voxpilot VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: voxpilot

  - id: voxpilot-github-repo
    desc: natearcher-ai/voxpilot repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: natearcher-ai/voxpilot

composite_rules:
  - id: voxpilot-extension
    desc: VoxPilot voice-to-code VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
