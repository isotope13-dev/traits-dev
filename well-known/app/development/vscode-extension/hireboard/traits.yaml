# Hireboard — VS Code extension for expert developer support via Live Share.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: hireboard-package-name
    desc: Hireboard AVCS VS Code extension package
    for: [package.json]
    if:
      type: value
      path: name
      exact: hireboard-avcs-extension-stage

  - id: hireboard-publisher
    desc: Hireboard staging extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: MuhammadShahzebKalam

  - id: hireboard-api-endpoint
    desc: Hireboard staging API endpoint
    for: [javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)(api|stage-api|staging-app|tools)\.hireboard\.co'

  - id: hireboard-live-share-bundle
    desc: Bundled Microsoft Live Share VSIX dependency
    for: [vsix]
    if:
      type: path
      regex: '(?i)ms-vsliveshare\.vsliveshare-[0-9][^/\\]*\.vsix$'

composite_rules:
  - id: hireboard-extension
    desc: Hireboard developer support VS Code extension
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: hireboard-package-name
      - id: hireboard-publisher
    any:
      - id: hireboard-api-endpoint
      - id: hireboard-live-share-bundle
