# rEcomment — VS Code Markdown/LaTeX comment renderer.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: extension-package-name
    desc: recomment VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: recomment

  - id: publisher-valkotlarovhoffman
    desc: ValKotlarovHoffman VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ValKotlarovHoffman

  - id: webpack-obfuscator-dep
    desc: webpack-obfuscator build dependency
    for: [package.json, json]
    if:
      type: text
      substr: '"webpack-obfuscator"'

  - id: recomment-command-id
    desc: recomment VS Code command identifier
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: recomment.showFeedback

composite_rules:
  - id: recomment-extension-context
    desc: rEcomment Markdown/LaTeX comment renderer
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: extension-package-name
      - id: publisher-valkotlarovhoffman

  - id: recomment-obfuscated-bundle-context
    desc: rEcomment webpack-obfuscator release bundle
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: extension-package-name
      - id: webpack-obfuscator-dep
