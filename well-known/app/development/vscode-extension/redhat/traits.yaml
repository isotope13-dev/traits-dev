# Red Hat's VS Code Marketplace publisher account (publisher: redhat).
#
# The publisher field alone identifies the vendor, not any one product —
# redhat ships ansible, java, quarkus, vscode-yaml, devspaces-remote-ssh and
# more under it. It lived twice before, as `quarkus::redhat-publisher` and
# `devspaces-remote-ssh::publisher`, so every Red Hat extension picked up two
# findings naming products it is not. One canonical vendor trait; the
# product composites add the name/repo leg that actually identifies them.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: VS Code extension published by Red Hat
    if:
      type: value
      path: publisher
      exact: redhat
