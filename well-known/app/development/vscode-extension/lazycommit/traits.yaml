# lazycommit — AI commit-message copilot VS Code extension (imxitiz).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: lazycommit-extension-path
    desc: lazycommit VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)imxitiz\.lazycommit-vscode'

  - id: lazycommit-package-name
    desc: lazycommit VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "lazycommit-vscode"'

  - id: lazycommit-publisher
    desc: imxitiz VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "imxitiz"'

  - id: lazycommit-github-repo
    desc: lazycommit-vscode-extension GitHub repository
    if:
      type: text
      substr: imxitiz/lazycommit-vscode-extension

  - id: lazycommit-managed-cli-package
    desc: lazycommit managed CLI npm package reference
    for: [javascript, typescript, package.json]
    if:
      type: text
      substr: '@sachinthapa572/lazycommit'

composite_rules:
  - id: lazycommit-vscode-extension
    desc: lazycommit AI commit message VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: lazycommit-extension-path
      - id: lazycommit-package-name
