# PRISM — Python MRO and inheritance visualizer VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: TemilolaOlowolayemo VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: TemilolaOlowolayemo

  - id: package-name
    desc: prism-vscode extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: prism-vscode

  - id: prism-mro-description
    desc: PRISM MRO inheritance visualizer description
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: MRO & Inheritance Visualizer

  - id: prism-backend-binary-path
    desc: prism-backend native binary path
    for: [javascript, archives]
    if:
      type: path
      regex: '(?i)prism-backend-(linux|darwin|win)'

composite_rules:
  - id: prism-vscode-extension
    desc: PRISM Python MRO inheritance VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
