# GitHub Codespaces — official GitHub cloud dev environment VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 100000000

traits:
  - id: package-name
    desc: GitHub Codespaces extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: codespaces

  - id: publisher
    desc: VS Code extension published by GitHub
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: GitHub

  - id: extension-archive-path
    desc: GitHub Codespaces VSIX archive member path
    for: [archives, vsix, javascript, typescript]
    if:
      type: path
      regex: '(?i)GitHub\.codespaces'

  - id: bundle-display-name
    desc: GitHub Codespaces bundled display name
    for: [javascript, typescript]
    if:
      type: text
      substr: GitHub Codespaces extension

composite_rules:
  - id: codespaces-package-publisher
    desc: GitHub Codespaces package manifest identity
    crit: notable
    conf: 0.98
    all:
      - id: package-name
      - id: publisher

  - id: codespaces-publisher-bundle
    desc: GitHub Codespaces publisher with bundled display name
    crit: notable
    conf: 0.98
    all:
      - id: publisher
      - id: bundle-display-name

  - id: github-codespaces-extension
    desc: GitHub Codespaces official cloud dev VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: extension-archive-path
      - id: codespaces-package-publisher
      - id: codespaces-publisher-bundle
