# mylonics/zephyr-ide — VS Code extension for Zephyr RTOS development.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, powershell, package.json, text]
  crit: notable
  conf: 0.97

traits:
  - id: zephyr-ide-package-name
    desc: Zephyr IDE VS Code extension package
    for: [package.json]
    if:
      type: value
      path: name
      exact: zephyr-ide

  - id: winget-install-script-path
    desc: Bundled asheroto winget-install script
    for: [powershell]
    if:
      type: path
      regex: '(?i)(^|[/\\])resources[/\\]winget-install\.ps1$'

  - id: zephyr-sdk-west-command
    desc: Zephyr SDK west management command
    for: [python]
    if:
      type: text
      substr: manage Zephyr SDK

  - id: zephyr-refresh-env-cmd
    desc: Chocolatey RefreshEnv helper script
    for: [batch]
    if:
      type: path
      regex: '(?i)(^|[/\\])resources[/\\]RefreshEnv\.cmd$'

composite_rules:
  - id: zephyr-ide-extension
    desc: Zephyr IDE embedded development extension
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: zephyr-ide-package-name
    any:
      - id: winget-install-script-path
      - id: zephyr-sdk-west-command
      - id: zephyr-refresh-env-cmd
