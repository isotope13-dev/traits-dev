# Flowmo Flowchart Editor — VS Code Mermaid/cytoscape flowchart editor.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: flowmo-flowchart-editor extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: flowmo-flowchart-editor

  - id: publisher
    desc: Flowmo VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: flowmo

  - id: custom-editor-view-type
    desc: Flowchart Editor custom editor view type
    for: [package.json, json, javascript]
    if:
      type: text
      substr: flowchart.editor

  - id: github-repo
    desc: flowmo-lol-flowchart-editor GitHub repository
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: izambasiron/flowmo-lol-flowchart-editor

composite_rules:
  - id: flowmo-flowchart-editor-extension
    desc: Flowmo Flowchart Editor VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: custom-editor-view-type
      - id: github-repo
