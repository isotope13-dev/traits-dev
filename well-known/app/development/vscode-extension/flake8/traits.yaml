# Microsoft vscode-flake8 — official Flake8 linter for VS Code.
# Bundled extension.js spawns the flake8 Language Server via
# child_process; that is product linting, not a dropper. High scores
# on fetched github.githubassets.com chunks are GitHub's frontend,
# not this extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: ms-python VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ms-python

  - id: package-name
    desc: flake8 VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: flake8

  - id: vsix-id
    desc: flake8 VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: flake8

  - id: vsix-publisher
    desc: ms-python VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: ms-python

  - id: github-repo
    desc: microsoft vscode-flake8 GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/microsoft/vscode-flake8

composite_rules:
  - id: flake8-manifest-identity
    desc: ms-python flake8 publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: flake8-vsix-identity
    desc: ms-python flake8 VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
