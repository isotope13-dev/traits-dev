# Graphite GTI — visual Git stacking VS Code extension (graphite.dev).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: gti-vscode Graphite extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: gti-vscode

  - id: publisher
    desc: Graphite VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: Graphite

  - id: gti-vsix-basename
    desc: Graphite gti-vscode VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^Graphite\.gti-vscode-.*\.vsix$'

  - id: gti-extension-member-path
    desc: Graphite gti-vscode extension member path
    for: [archives, javascript, typescript, package.json, vsix]
    if:
      type: path
      regex: '(?i)Graphite\.gti-vscode'

  - id: graphite-homepage
    desc: graphite.dev homepage URL
    for: [package.json, json, markdown]
    if:
      type: text
      substr: graphite.dev

  - id: graphite-gti-command
    desc: graphite.open-gti VS Code command
    for: [package.json, javascript]
    if:
      type: text
      substr: graphite.open-gti

  - id: graphite-gti-webview-id
    desc: graphite.gti webview panel identifier
    for: [javascript, typescript]
    if:
      type: text
      substr: graphite.gti

  - id: graphite-gt-auth-server-chunk
    desc: Graphite gt local auth server webpack chunk
    for: [javascript, typescript]
    if:
      type: text
      substr: validateTokenForTests

composite_rules:
  - id: gti-vscode-bundled-js-context
    desc: Graphite GTI bundled extension JS context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    any:
      - id: graphite-gti-webview-id
      - id: graphite-gti-command
      - id: graphite-gt-auth-server-chunk

  - id: gti-vscode-extension
    desc: Graphite GTI visual Git VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: gti-vsix-basename
      - id: gti-extension-member-path
      - id: graphite-homepage
