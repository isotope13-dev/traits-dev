# Herb LSP — HTML+ERB language server VS Code extension (marcoroth).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: marcoroth VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: marcoroth

  - id: package-name
    desc: herb-lsp VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: herb-lsp

  - id: herb-lsp-vsix-basename
    desc: marcoroth Herb LSP VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^marcoroth\.herb-lsp-.*\.vsix$'

  - id: herb-tools-node-wasm-dep
    desc: Herb Tools node-wasm npm dependency
    for: [package.json, json, javascript]
    if:
      type: text
      substr: '@herb-tools/node-wasm'

  - id: herb-language-server-path
    desc: Herb language server bundled script path
    for: [javascript, archives]
    if:
      type: path
      regex: '(?i)herb-language-server\.js$'

composite_rules:
  - id: herb-lsp-vscode-extension
    desc: Herb HTML+ERB language server VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: herb-lsp-vsix-basename
      - id: herb-tools-node-wasm-dep
