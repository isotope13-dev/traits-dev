# znck Vue — VS Code Vue syntax highlighting (znck/vue-developer-experience).
# Bundled InversifyJS and dist/index.web.js webpack are product grammar
# tooling, not a dropper. Identity only; no javascript defaults.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: znck VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: znck

  - id: package-name
    desc: znck Vue VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vue

  - id: vsix-id
    desc: znck Vue VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: vue

  - id: vsix-publisher
    desc: znck VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: znck

  - id: github-repo
    desc: znck Vue developer-experience GitHub
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/znck/vue-developer-experience

composite_rules:
  - id: znck-vue-manifest-identity
    desc: znck Vue publisher-name pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: znck-vue-vsix-identity
    desc: znck Vue VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
