# Baidu SDP Dev Pack — internal SDP agent skills marketplace VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 5000000

traits:
  - id: baidusdp-publisher
    desc: baidusdp VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: baidusdp

  - id: sdp-dev-pack-package-name
    desc: SDP Dev Pack extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: sdp-dev-pack

  - id: sdp-dev-pack-repo-url
    desc: Baidu SDP dev pack repository URL
    if:
      type: text
      substr: sdp-dev-pack

  - id: sdpcli-npm-package
    desc: Baidu sdpcli npm package reference
    for: [javascript, typescript, json]
    if:
      type: text
      substr: '@baidu/sdpcli'

composite_rules:
  - id: baidu-sdp-dev-pack-extension
    desc: Baidu SDP Dev Pack VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: baidusdp-publisher
      - id: sdp-dev-pack-package-name
