# Commit Message Gene by GitHub Copilot — komiyamma SCM helper extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.97

traits:
  - id: komiyamma-publisher
    desc: komiyamma VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: komiyamma

  - id: commit-message-gene-package-name
    desc: commit-message-gene-by-ghcopilot package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: commit-message-gene-by-ghcopilot

composite_rules:
  - id: commit-message-gene-ghcopilot-extension
    desc: Commit Message Gene by GitHub Copilot extension
    crit: notable
    conf: 0.98
    all:
      - id: komiyamma-publisher
      - id: commit-message-gene-package-name
