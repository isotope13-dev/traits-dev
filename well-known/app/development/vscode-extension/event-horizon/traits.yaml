# Event Horizon — multi-agent AI coding orchestration VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: HeytalePazguato VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: HeytalePazguato

  - id: package-name
    desc: event-horizon-vscode extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: event-horizon-vscode

  - id: event-horizon-vsix-basename
    desc: HeytalePazguato Event Horizon VSIX context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^HeytalePazguato\.event-horizon-vscode-.*\.vsix$'

  - id: event-horizon-core-module
    desc: Event Horizon core npm module marker
    for: [javascript, package.json]
    if:
      type: text
      substr: '@event-horizon/core'

  - id: event-horizon-github-repo
    desc: HeytalePazguato event-horizon GitHub repo
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: HeytalePazguato/event-horizon

composite_rules:
  - id: event-horizon-vscode-extension
    desc: Event Horizon multi-agent orchestration extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: event-horizon-vsix-basename
      - id: event-horizon-core-module
