# Scrudix — AI engineering companion VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: scrudix VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: scrudix

  - id: package-name
    desc: scrudix VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: scrudix

  - id: scrudix-github-repo
    desc: AniketOxO/Imagica GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: AniketOxO/Imagica

composite_rules:
  - id: scrudix-vscode-extension
    desc: Scrudix AI engineering VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
