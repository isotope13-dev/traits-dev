# redhat.ansible — the official Red Hat Ansible VS Code extension
# (github.com/ansible/vscode-ansible). It bundles the Ansible language server
# and an MCP server, so it legitimately spawns terminals, runs ansible-lint
# and pip, reads workspace files and talks to Lightspeed/Gemini endpoints.
# The identity is what tells an analyst those behaviours are the product.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-ansible-package-name
    desc: Package name field is ansible
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: ansible

  - id: vscode-ansible-github-repo
    desc: ansible/vscode-ansible GitHub repository
    for: [package.json, vsix-manifest, json, javascript, typescript, markdown]
    if:
      type: text
      substr: github.com/ansible/vscode-ansible

  - id: ansible-language-server-path
    desc: Ansible language server bundle path
    for: [archives, vsix, javascript]
    if:
      type: path
      regex: 'packages[/\\]ansible-language-server[/\\]'

composite_rules:
  - id: redhat-ansible-extension
    desc: Red Hat Ansible VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/development/vscode-extension/redhat::publisher
    any:
      - id: vscode-ansible-package-name
      - id: vscode-ansible-github-repo
      - id: ansible-language-server-path
