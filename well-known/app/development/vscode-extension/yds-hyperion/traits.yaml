# YDS Hyperion — VS Code AI assistant with MCP tool integration.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: extension-package-name
    desc: yds-hyperion VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: yds-hyperion

  - id: publisher-zhangchck
    desc: zhangchck VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: zhangchck

  - id: github-repo
    desc: yds-hyperion GitHub repository marker
    for: [package.json, json, javascript, typescript, markdown]
    if:
      type: text
      substr: github.com/zhangchck/yds-hyperion

  - id: mcp-transport-setting
    desc: YDS Hyperion MCP transport configuration key
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: ydshyperion.mcp.transportType

composite_rules:
  - id: yds-hyperion-extension-context
    desc: YDS Hyperion VS Code AI assistant extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: extension-package-name
      - id: publisher-zhangchck
