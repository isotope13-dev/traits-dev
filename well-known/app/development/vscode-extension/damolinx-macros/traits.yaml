# damolinx Macros — VS Code extension for JS/TS macro automation (damolinx publisher).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: extension-path
    desc: damolinx Macros VS Code extension path
    for: [archives, javascript, package.json]
    if:
      type: path
      regex: '(?i)damolinx\.damolinx-macros'

  - id: package-name
    desc: damolinx-macros extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: damolinx-macros

  - id: publisher
    desc: damolinx VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: damolinx

  - id: github-repo
    desc: damolinx/vscode-macros GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: damolinx/vscode-macros

composite_rules:
  - id: damolinx-macros-vscode-extension
    desc: damolinx Macros VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: extension-path
      - id: package-name
