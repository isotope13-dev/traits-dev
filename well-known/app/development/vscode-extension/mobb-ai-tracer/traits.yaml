# Mobb Tracy — AI coding session tracer for Mobb security platform.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: mobb-ai-tracer-extension-path
    desc: Mobb Tracy VS Code extension member path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)Mobb\.mobb-ai-tracer'

  - id: mobb-ai-tracer-package-name
    desc: mobb-ai-tracer VS Code package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: mobb-ai-tracer

  - id: mobb-publisher
    desc: Mobb VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: Mobb

  - id: mobb-tracy-github-repo
    desc: mobb-dev/tracy GitHub repository URL
    for: [package.json, markdown]
    if:
      type: text
      substr: mobb-dev/tracy

  - id: mobb-accept-completion-command
    desc: mobb.acceptInlineCompletion command id
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: mobb.acceptInlineCompletion

composite_rules:
  - id: mobb-ai-tracer-vscode-extension
    desc: Mobb Tracy AI session tracing extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: mobb-ai-tracer-extension-path
      - id: mobb-ai-tracer-package-name
