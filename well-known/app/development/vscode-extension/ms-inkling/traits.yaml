# Microsoft Inkling (Bonsai) VS Code language support. vscode-languageclient
# spawn/taskkill is the LSP host, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: ms-inkling VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ms-inkling

  - id: package-name
    desc: ms-inkling VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: ms-inkling

  - id: vsix-id
    desc: Inkling VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: ms-inkling

  - id: vsix-publisher
    desc: Inkling VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: ms-inkling

  - id: enable-features-setting
    desc: Inkling enableAllFeatures setting key
    for: [package.json, json]
    if:
      type: text
      substr: inkling.enableAllFeatures

composite_rules:
  - id: inkling-manifest-identity
    desc: ms-inkling publisher package pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: inkling-vsix-identity
    desc: Microsoft Inkling VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
