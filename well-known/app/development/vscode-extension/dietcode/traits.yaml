# DietCode — autonomous AI coding agent VS Code extension (DreamBeesAI).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: dietcode-extension-path
    desc: DietCode VS Code extension member path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)DreamBeesAI\.dietcode'

  - id: dietcode-package-name
    desc: DietCode VS Code extension package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "dietcode"'

  - id: dietcode-publisher
    desc: DietCode VS Code extension publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "DreamBeesAI"'

  - id: dietcode-homepage
    desc: DietCode product homepage URL
    if:
      type: text
      substr: https://dietcode.io

composite_rules:
  - id: dietcode-vscode-extension
    desc: DietCode AI coding agent VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: dietcode-extension-path
      - id: dietcode-package-name
