# elumine/kotlin-jump — Kotlin & Java navigation VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: kotlin-jump extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: kotlin-jump

  - id: publisher
    desc: Elumine VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: elumine

  - id: github-repo
    desc: elumine-dev/kotlin-jump GitHub repository
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: elumine-dev/kotlin-jump

  - id: mcp-server-sdk
    desc: Model Context Protocol SDK npm dependency
    crit: component
    conf: 0.96
    for: [package.json, javascript]
    if:
      type: text
      substr: "@modelcontextprotocol/sdk"

composite_rules:
  - id: kotlin-jump-extension
    desc: Kotlin Jump language navigation VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: github-repo
      - id: mcp-server-sdk
