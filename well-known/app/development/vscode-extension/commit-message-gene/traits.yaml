# Commit Message Gene by GitHub Copilot — komiyamma VS Code SCM extension.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: commit-message-gene-extension-path
    desc: Commit Message Gene VS Code extension path
    for: [archives, javascript, typescript, package.json]
    if:
      type: path
      regex: '(?i)komiyamma\.commit-message-gene-by-ghcopilot'

  - id: commit-message-gene-package-name
    desc: Commit Message Gene VS Code package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "commit-message-gene-by-ghcopilot"'

  - id: commit-message-gene-publisher
    desc: Commit Message Gene VS Code publisher
    for: [package.json, javascript]
    if:
      type: text
      substr: '"publisher": "komiyamma"'

  - id: commit-message-gene-github-repo
    desc: Commit Message Gene GitHub repository URL
    if:
      type: text
      substr: komiyamma/vscode-extension-commit-message-gene-by-ghcopilot

  - id: copilot-sdk-dependency
    desc: GitHub Copilot SDK npm dependency
    for: [package.json, json, javascript]
    if:
      type: text
      substr: '"@github/copilot-sdk"'

composite_rules:
  - id: commit-message-gene-vscode-extension
    desc: Commit Message Gene by GitHub Copilot extension
    crit: notable
    conf: 0.99
    any:
      - id: commit-message-gene-extension-path
      - id: commit-message-gene-package-name
