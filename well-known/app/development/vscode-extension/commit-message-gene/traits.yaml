# Commit Message Gene — shared path atom for komiyamma SCM helper extensions.
# Publisher/name matchers for the GitHub Copilot VSIX live in
# ../commit-message-gene-ghcopilot/.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.97

traits:
  - id: commit-message-gene-extension-path
    desc: Commit Message Gene VS Code extension path
    for: [archives, javascript, typescript, package.json, vsix]
    if:
      type: path
      regex: '(?i)komiyamma\.commit-message-gene'
