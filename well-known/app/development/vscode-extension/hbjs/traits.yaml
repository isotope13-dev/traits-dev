# HB.js — Broadcom Code4z mainframe HostBridge VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: publisher
    desc: BroadcomMFD VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: broadcomMFD

  - id: package-name
    desc: hbjs VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: hbjs

  - id: display-name
    desc: HB.js for VS Code display name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: displayName
      exact: HB.js for VS Code

  - id: hbjs-vsix-basename
    desc: BroadcomMFD HB.js VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^BroadcomMFD\.hbjs-.*\.vsix$'

  - id: code4z-marker
    desc: Broadcom Code4z mainframe developer marker
    for: [markdown, javascript, package.json]
    if:
      type: text
      substr: code4z

  # `HostBridge` alone is an ordinary compound word that appears in unrelated
  # host/bridge APIs; require the product's own two-word name.
  - id: hostbridge-marker
    desc: HostBridge JavaScript engine product marker
    for: [markdown, javascript, package.json]
    if:
      type: text
      regex: 'HostBridge\s+(JavaScript|for\s+CICS)'

composite_rules:
  - id: hbjs-vscode-extension
    desc: Broadcom HB.js mainframe VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: display-name
      - id: hbjs-vsix-basename
