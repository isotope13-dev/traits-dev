# KOREXT — AI code governance and compliance for Windsurf (Korext).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: korext-extension-path
    desc: KOREXT Windsurf VS Code extension path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)korext\.korext-windsurf'

  - id: korext-package-name
    desc: KOREXT Windsurf VS Code package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: korext-windsurf

  - id: korext-publisher
    desc: Korext VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: Korext

  - id: korext-homepage
    desc: KOREXT product homepage URL
    for: [package.json, markdown]
    if:
      type: text
      substr: korext.com

  - id: korext-signin-command
    desc: KOREXT sign-in VS Code command id
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: korext.signIn

composite_rules:
  - id: korext-windsurf-vscode-extension
    desc: KOREXT AI code governance Windsurf extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: korext-extension-path
      - id: korext-package-name
