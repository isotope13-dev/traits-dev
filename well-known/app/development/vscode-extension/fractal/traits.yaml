# Fractal — VS Code markdown outliner and WYSIWYG editor extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: imaken VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: imaken

  - id: package-name
    desc: fractal VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: fractal

  - id: fractal-github-repo
    desc: raggbal/fractal GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: raggbal/fractal

composite_rules:
  - id: fractal-extension
    desc: Fractal markdown outliner VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
