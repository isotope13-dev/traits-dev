# Antigravity Auto Retry Agent — disclosed hands-free auto-accept for Cursor/Antigravity.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: antigravity-auto-retry-agent package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: antigravity-auto-retry-agent

  - id: publisher-jodie-dunbar
    desc: jodie-dunbar VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: jodie-dunbar

  - id: github-repo
    desc: auto-retry-agent GitHub repository marker
    for: [package.json, json, javascript, typescript, markdown]
    if:
      type: text
      substr: JodieDunbar/auto-retry-agent

  - id: auto-accept-start-api
    desc: CDP-injected auto-accept start hook
    for: [javascript, typescript]
    if:
      type: text
      substr: window.__autoAcceptStart

  - id: session-summary-api-path
    desc: Session summary backend API path
    for: [javascript, typescript]
    if:
      type: text
      substr: /session-summary

  - id: license-api-host
    desc: Auto Retry disclosed license API host
    for: [javascript, typescript]
    if:
      type: text
      substr: auto-accept-backend.onrender.com

composite_rules:
  - id: auto-retry-vscode-extension
    desc: Antigravity Auto Retry Agent VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: publisher-jodie-dunbar
    any:
      - id: package-name
      - id: github-repo

  # Archive-scoped identity for unless legs on archive-scoped composites.
  - id: auto-retry-package-identity
    desc: Auto Retry extension package identity
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: publisher-jodie-dunbar

  - id: declared-auto-accept-product
    desc: Disclosed CDP auto-accept automation product
    crit: exception
    conf: 0.98
    scope: archive
    all:
      - id: package-name
      - id: publisher-jodie-dunbar
      - id: auto-accept-start-api

  - id: disclosed-summary-backend
    desc: Disclosed session-summary and license API backend
    crit: exception
    conf: 0.98
    scope: archive
    all:
      - id: package-name
      - id: publisher-jodie-dunbar
      - id: license-api-host
    any:
      - id: session-summary-api-path
      - id: auto-accept-start-api
