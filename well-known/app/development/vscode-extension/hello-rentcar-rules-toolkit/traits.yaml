# HelloRentCar Rules Toolkit — VS Code AI rules monitoring extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: HelloRentCar VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: HelloRentCar

  - id: package-name
    desc: rules-toolkit VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: rules-toolkit

  - id: rules-toolkit-command-prefix
    desc: rulesToolkit VS Code command namespace
    for: [package.json, json, javascript]
    if:
      type: text
      substr: rulesToolkit.

composite_rules:
  - id: hello-rentcar-rules-toolkit-extension
    desc: HelloRentCar Rules Toolkit VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
