# ysemeniuk Emmet Live VS Code extension. Expands Emmet abbreviations
# in the editor; high scores on fetched github.githubassets.com chunks
# are GitHub's frontend minifier, not this extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: ysemeniuk VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ysemeniuk

  - id: package-name
    desc: emmet-live VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: emmet-live

  - id: vsix-id
    desc: emmet-live VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: emmet-live

  - id: vsix-publisher
    desc: ysemeniuk VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: ysemeniuk

  - id: github-repo
    desc: semeniuk vscode-emmet-live GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/semeniuk/vscode-emmet-live
