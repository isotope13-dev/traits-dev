# Soloboi's Settings Sync — a VS Code extension that syncs editor state
# through user-selected GitHub Gists.
defaults:
  platforms: [windows, unix]
  for: [package.json, javascript, xml, vsix]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Soloboi Settings Sync package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: solobois-settings-sync

  - id: package-publisher
    desc: Soloboi Settings Sync package publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: soloboi

composite_rules:
  - id: solobois-settings-sync-extension
    desc: Soloboi Settings Sync VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
