# vscode-groovy-lint — Groovy/Jenkinsfile linter (NicolasVuillamy).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: groovy-lint-package-name
    desc: vscode-groovy-lint extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-groovy-lint

  - id: nicolasvuillamy-publisher
    desc: NicolasVuillamy VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: NicolasVuillamy

  - id: groovy-lint-github-repo
    desc: nvuillam/vscode-groovy-lint GitHub repository
    if:
      type: text
      substr: github.com/nvuillam/vscode-groovy-lint

composite_rules:
  - id: vscode-groovy-lint-extension
    desc: Groovy Lint Format and Fix VS Code extension
    crit: notable
    conf: 0.99
    any:
      - id: groovy-lint-package-name
      - id: nicolasvuillamy-publisher
