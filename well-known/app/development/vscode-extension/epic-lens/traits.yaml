# Epic Lens — Jira/GitLab/GitHub epic tracker VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: andrevops VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: andrevops

  - id: package-name
    desc: epic-lens VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: epic-lens

  - id: epic-lens-github-repo
    desc: Andrevops/epic-lens GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: Andrevops/epic-lens

  - id: epic-lens-vsix-basename
    desc: Andrevops Epic Lens VSIX archive context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^andrevops\.epic-lens-.*\.vsix$'

composite_rules:
  - id: epic-lens-vscode-extension
    desc: Epic Lens Jira GitLab GitHub tracker extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
    any:
      - id: package-name
      - id: epic-lens-vsix-basename
