# Better Scripts — VS Code extension for npm/pnpm/bun/yarn script sidebar.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown, shell]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: MeinhartThomas VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: MeinhartThomas

  - id: package-name
    desc: better-scripts VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: better-scripts

  - id: vsix-id
    desc: better-scripts VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: better-scripts

  - id: vsix-publisher
    desc: better-scripts VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: MeinhartThomas

  - id: github-repo
    desc: better-scripts GitHub repository
    for: [package.json, json, markdown, vsix-manifest]
    if:
      type: text
      substr: github.com/MeinhartThomas/better-scripts

  - id: better-scripts-command-id
    desc: betterScripts VS Code command identifier
    for: [package.json, json, javascript]
    if:
      type: text
      substr: betterScripts.runScript

composite_rules:
  - id: better-scripts-extension
    desc: Better Scripts npm scripts sidebar extension
    crit: notable
    needs: 2
    any:
      - id: publisher
      - id: package-name
      - id: vsix-id
      - id: vsix-publisher
      - id: github-repo
      - id: better-scripts-command-id
