# Official Atlassian Atlascode VS Code extension (Jira, Rovo Dev,
# Bitbucket). Bundled webpack, Atlaskit UI, Segment analytics, and
# node-macaddress execFile are product code, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, javascript, markdown]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: Atlassian VS Code publisher
    for: [package.json, json]
    if:
      type: value
      path: publisher
      exact: atlassian

  - id: package-name
    desc: atlascode VS Code package name
    for: [package.json, json]
    if:
      type: value
      path: name
      exact: atlascode

  - id: vsix-id
    desc: atlascode VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: atlascode

  - id: vsix-publisher
    desc: Atlassian VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: atlassian

  - id: github-repo
    desc: atlassian atlascode GitHub repository
    for: [package.json, json, markdown, vsix-manifest]
    if:
      type: text
      substr: github.com/atlassian/atlascode

  - id: atlascode-extension-path
    desc: Atlassian Atlascode uninstall script path
    for: [javascript, json]
    if:
      type: path
      regex: 'build[\\/]extension[\\/]uninstall\.js$'

  - id: atlascode-vsix-member-path
    desc: Atlassian Atlascode VSIX member path
    for: [archives, vsix, javascript, json]
    if:
      type: path
      substr: Atlassian.atlascode

  - id: atlascode-package-name
    desc: Atlassian Atlascode extension identifier
    if:
      type: text
      substr: atlassian.atlascode

  - id: atlaskit-runtime-marker
    desc: Atlaskit UI component runtime marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@atlaskit/'

  - id: webpack-chunk-atlascode
    desc: Atlascode webpack chunk global
    for: [javascript]
    if:
      type: text
      substr: webpackChunkatlascode

composite_rules:
  - id: atlascode-manifest-identity
    desc: Atlassian atlascode package publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: atlascode-vsix-identity
    desc: Atlassian atlascode VSIX identity pair
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher

  - id: atlascode-vscode-extension
    desc: Atlassian Atlascode VS Code extension
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: atlascode-extension-path
      - id: atlascode-package-name
      - id: atlascode-vsix-member-path
      - id: webpack-chunk-atlascode
      - id: atlascode-manifest-identity
      - id: atlascode-vsix-identity
      - id: github-repo

  - id: atlascode-atlaskit-ui-bundle
    desc: Atlassian Atlaskit UI component bundle
    crit: notable
    conf: 0.97
    all:
      - id: atlascode-vscode-extension
      - id: atlaskit-runtime-marker
