defaults:
  platforms: [unix, windows]
  for: [javascript, json]
  crit: baseline
  conf: 0.98
  size_max: 10000000

traits:
  - id: atlascode-extension-path
    desc: Atlassian Atlascode VS Code extension path
    size_min: 0
    if:
      type: path
      regex: 'build[\\/]extension[\\/]uninstall\.js$'
  - id: atlascode-vsix-member-path
    desc: Atlassian Atlascode VSIX member path
    size_min: 0
    size_max: 20000000
    if:
      type: path
      substr: Atlassian.atlascode

  - id: atlascode-package-name
    desc: Atlassian Atlascode package name
    if:
      type: text
      substr: atlassian.atlascode

  - id: atlaskit-runtime-marker
    desc: Atlaskit UI component runtime marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@atlaskit/'

  - id: webpack-chunk-atlascode
    desc: Atlascode webpack chunk global
    for: [javascript]
    if:
      type: text
      substr: webpackChunkatlascode

composite_rules:
  - id: atlascode-vscode-extension
    desc: Atlassian Atlascode VS Code extension
    crit: notable
    conf: 0.98
    any:
      - id: atlascode-extension-path
      - id: atlascode-package-name
      - id: atlascode-vsix-member-path
      - id: webpack-chunk-atlascode

  - id: atlascode-atlaskit-ui-bundle
    desc: Atlassian Atlaskit UI component bundle
    crit: notable
    conf: 0.97
    all:
      - id: atlascode-vscode-extension
      - id: atlaskit-runtime-marker
