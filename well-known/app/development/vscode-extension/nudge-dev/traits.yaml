# nudge-dev — VS Code AI agent co-pilot with remote backend.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, vsix, archives, javascript, typescript]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: nudge-dev VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: nudge-dev

  - id: publisher
    desc: nudge-dev VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: nudge-dev

  - id: vsix-basename
    desc: nudge-dev VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^nudge-dev\.nudge-dev-.*\.vsix$'

  - id: backend-url-setting
    desc: nudge-dev.backendUrl configuration key
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: nudge-dev.backendUrl

  - id: github-repo
    desc: sahil-n06 nudge-dev-extension GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: sahil-n06/nudge-dev-extension

composite_rules:
  - id: nudge-dev-vscode-extension
    desc: Nudge Dev AI agent co-pilot VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: vsix-basename
      - id: backend-url-setting
