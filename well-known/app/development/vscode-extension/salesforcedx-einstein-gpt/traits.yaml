# Salesforce Agentforce Vibes (salesforcedx-einstein-gpt). Cline-fork
# workspace walk, puppeteer browser tool, and SF data skills are product.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 100000000

traits:
  - id: publisher
    desc: Salesforce VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: salesforce

  - id: package-name
    desc: Agentforce Vibes VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: salesforcedx-einstein-gpt

  - id: vsix-id
    desc: Agentforce Vibes VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: salesforcedx-einstein-gpt

  - id: vsix-publisher
    desc: Salesforce VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: salesforce

  - id: github-repo
    desc: Einstein GPT for Developers GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/forcedotcom/Einstein-GPT-for-Developers

  - id: package-marker
    desc: salesforcedx-einstein-gpt package marker
    for: [javascript, typescript, json]
    if:
      type: text
      substr: salesforcedx-einstein-gpt

composite_rules:
  - id: einstein-gpt-manifest-identity
    desc: Salesforce Agentforce Vibes publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: einstein-gpt-vsix-identity
    desc: Salesforce Agentforce Vibes VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
