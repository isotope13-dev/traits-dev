# Fetch Coder — ASI:One autonomous AI coding agent VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 5000000

traits:
  - id: gautammanak2-publisher
    desc: gautammanak2 VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: gautammanak2

  - id: fetch-coder-package-name
    desc: Fetch Coder VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: fetch-coder

  - id: asi1-vscode-repo
    desc: ASI:One VS Code extension repository URL
    if:
      type: text
      substr: gautammanak1/asi1-vs-code

  - id: firebase-webview-dependency
    desc: Firebase npm dependency in package manifest
    crit: component
    conf: 0.96
    for: [package.json, json]
    if:
      type: text
      regex: '"firebase"\s*:\s*"\^'

composite_rules:
  - id: fetch-coder-extension
    desc: Fetch Coder ASI:One autonomous coding agent extension
    crit: notable
    conf: 0.97
    all:
      - id: gautammanak2-publisher
      - id: fetch-coder-package-name
      - id: firebase-webview-dependency
