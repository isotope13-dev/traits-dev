# Antigravity Cockpit — Antigravity AI quota dashboard (jlcodes).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: antigravity-cockpit-extension-path
    desc: Antigravity Cockpit VS Code extension path
    for: [archives, vsix, package.json]
    if:
      type: path
      regex: '(?i)jlcodes\.antigravity-cockpit'

  - id: antigravity-cockpit-package-name
    desc: Antigravity Cockpit VS Code package name
    for: [package.json, vsix-manifest, json, javascript]
    if:
      type: value
      path: name
      exact: antigravity-cockpit

  - id: antigravity-cockpit-publisher
    desc: jlcodes VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: jlcodes

  - id: antigravity-cockpit-github-repo
    desc: Antigravity Cockpit GitHub repository URL
    for: [package.json, markdown]
    if:
      type: text
      substr: jlcodes99/vscode-antigravity-cockpit

  - id: ag-cockpit-command-id
    desc: Antigravity Cockpit VS Code command id
    for: [package.json, json, javascript, typescript]
    if:
      type: text
      substr: agCockpit.open

  - id: dev-install-hooks-postinstall-script
    desc: postinstall runs dev install-hooks.sh
    for: [package.json, json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^bash scripts/install-hooks\.sh$'

composite_rules:
  - id: antigravity-cockpit-vscode-extension
    desc: Antigravity Cockpit quota monitor extension
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: antigravity-cockpit-extension-path
      - id: antigravity-cockpit-package-name

  - id: antigravity-cockpit-dev-postinstall-context
    desc: Antigravity Cockpit dev git-hook postinstall
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: antigravity-cockpit-vscode-extension
      - id: dev-install-hooks-postinstall-script
