# Kognyt Astra — official Salesforce org-context VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96

traits:
  - id: kognyt-publisher
    desc: Kognyt VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: kognyt

  - id: kognyt-astra-package-name
    desc: Kognyt Astra extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: kognyt-astra

  - id: yantra-api-url
    desc: Kognyt Yantra service API URL
    if:
      type: text
      substr: yantra.kognyt.dev

  - id: kognyt-auth-url
    desc: Kognyt Supabase auth endpoint URL
    if:
      type: text
      substr: auth.kognyt.dev

composite_rules:
  - id: kognyt-astra-extension
    desc: Kognyt Astra Salesforce VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: kognyt-publisher
      - id: kognyt-astra-package-name
