# bceskavich Dracula At Night VS Code color theme. The VSIX is theme
# JSON plus a local attach/eject helper; high scores on fetched
# github.githubassets.com chunks are GitHub's frontend, not this
# extension. Symlink attach into ~/.vscode/extensions is product.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix-manifest, json, vsix, markdown]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: bceskavich VS Code publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: bceskavich

  - id: package-name
    desc: Dracula At Night VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: theme-dracula-at-night

  - id: vsix-id
    desc: Dracula At Night VSIX identity id
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: theme-dracula-at-night

  - id: vsix-publisher
    desc: Dracula At Night VSIX publisher
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: bceskavich

  - id: github-repo
    desc: bceskavich dracula-at-night GitHub repo
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/bceskavich/dracula-at-night

composite_rules:
  - id: dracula-at-night-manifest-identity
    desc: bceskavich Dracula At Night publisher pair
    crit: notable
    conf: 0.98
    for: [package.json, json]
    all:
      - id: publisher
      - id: package-name

  - id: dracula-at-night-vsix-identity
    desc: bceskavich Dracula At Night VSIX identity
    crit: notable
    conf: 0.98
    for: [vsix]
    all:
      - id: vsix-id
      - id: vsix-publisher
