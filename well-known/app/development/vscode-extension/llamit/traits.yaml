# Llamit — AI commit messages VS Code extension (Crstian).
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: package-name
    desc: llamit VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: llamit

  - id: publisher
    desc: Crstian VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: Crstian

  - id: llamit-vsix-basename
    desc: Crstian llamit VSIX archive basename
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^Crstian\.llamit-.*\.vsix$'

  - id: llamit-github-repo
    desc: crstian19 llamit GitHub repository
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: crstian19/llamit

  - id: llamit-ollama-config-key
    desc: llamit Ollama URL configuration key
    for: [package.json, json, javascript]
    if:
      type: text
      substr: llamit.ollamaUrl

  - id: llamit-generate-commit-command
    desc: llamit generate commit VS Code command
    for: [package.json, json, javascript]
    if:
      type: text
      substr: llamit.generateCommit

  - id: llamit-go-cli-binary-basename
    desc: llamit bundled Go CLI binary basename
    for: [elf, macho, pe]
    if:
      type: basename
      regex: '(?i)^llamit-(darwin|linux|windows)-'

composite_rules:
  - id: llamit-vscode-extension
    desc: Llamit Ollama commit message VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: llamit-vsix-basename
      - id: llamit-github-repo
      - id: llamit-ollama-config-key
      - id: llamit-generate-commit-command
