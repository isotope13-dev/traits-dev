# Malloy — VS Code extension for Malloy data language.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: malloydata VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: malloydata

  - id: package-name
    desc: malloy-vscode extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: malloy-vscode

  - id: malloy-github-repo
    desc: malloydata/malloy-vscode-extension repo URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: malloydata/malloy-vscode-extension

composite_rules:
  - id: malloy-vscode-extension
    desc: Malloy data language VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
