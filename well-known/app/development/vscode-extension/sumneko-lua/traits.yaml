# sumneko.lua — Lua Language Server VS Code / VSCodium extension
# (marketplace publisher sumneko). Ships EmmyLua `---@meta` stdlib stubs
# under extension/server/meta/template/ for type analysis, not runtime.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 0
  size_max: 500000000

traits:
  - id: sumneko-lua-vsix-member
    desc: sumneko Lua language-server VSIX member
    for: [lua, javascript, json, elf, macho, pe, binaries, archives, text]
    if:
      type: path
      regex: '(?i)sumneko\.lua'

  - id: lua-language-server-meta-template-path
    desc: Lua language server EmmyLua meta template path
    for: [lua, text]
    if:
      type: path
      regex: '(?i)meta/template'

  - id: emmylua-meta-file-annotation
    desc: EmmyLua ---@meta definition stub annotation
    for: [lua, text]
    if:
      type: text
      regex: '(?m)^---@meta\b'

composite_rules:
  - id: sumneko-lua-meta-stub-context
    desc: sumneko Lua language-server EmmyLua meta stub
    crit: notable
    conf: 0.99
    scope: outer
    for: [lua, text, archives]
    all:
      - id: emmylua-meta-file-annotation
    any:
      - id: sumneko-lua-vsix-member
      - id: lua-language-server-meta-template-path
