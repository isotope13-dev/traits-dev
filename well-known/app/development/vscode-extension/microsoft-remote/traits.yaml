# Microsoft Remote Development extensions for VS Code. The manifest identities
# are exact product identifiers; the bundle identities require multiple
# implementation markers so extensions that merely depend on Remote SSH do not
# inherit Microsoft's product identity.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, vsix]

traits:
  - id: remote-ssh-vsix-id
    desc: Remote SSH VSIX identifier
    crit: component
    conf: 0.99
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: remote-ssh

  - id: remote-ssh-vsix-publisher
    desc: Remote SSH VSIX publisher
    crit: component
    conf: 0.99
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: ms-vscode-remote

  - id: remote-server-vsix-id
    desc: Remote Server VSIX identifier
    crit: component
    conf: 0.99
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: remote-server

  - id: remote-server-vsix-publisher
    desc: Remote Server VSIX publisher
    crit: component
    conf: 0.99
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: ms-vscode

  - id: remote-ssh-package-name
    desc: Remote SSH package name
    crit: component
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: name
      exact: remote-ssh

  - id: remote-ssh-package-publisher
    desc: Remote SSH package publisher
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: ms-vscode-remote

  - id: remote-server-package-name
    desc: Remote Server package name
    crit: component
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: name
      exact: remote-server

  - id: remote-server-package-publisher
    desc: Remote Server package publisher
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: ms-vscode

  - id: remote-development-repository
    desc: Microsoft Remote Development repository
    crit: component
    conf: 0.98
    for: [javascript, typescript, package.json]
    if:
      type: text
      substr: github.com/Microsoft/vscode-remote-release
      case_insensitive: true

  - id: remote-ssh-agent-folder
    desc: Remote SSH agent-folder setting
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: vscodeAgentFolder

  - id: remote-ssh-install-options
    desc: Remote SSH download-option setting
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: useCurlAndWgetConfigurationFiles

  - id: remote-ssh-authorized-keys-doc
    desc: Remote SSH authorized-keys marker
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: VSCODE_INJECTION

  - id: remote-server-client-id
    desc: Remote Server tunnel client identifier
    crit: component
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: vscode.dev.remote-server

  - id: dev-tunnels-ssh-repository
    desc: Microsoft Dev Tunnels SSH repository
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: github.com/microsoft/dev-tunnels-ssh
      case_insensitive: true

composite_rules:
  - id: remote-ssh-vsix
    desc: Microsoft Remote SSH extension
    crit: notable
    conf: 0.99
    for: [vsix]
    all:
      - id: remote-ssh-vsix-id
      - id: remote-ssh-vsix-publisher

  - id: remote-server-vsix
    desc: Microsoft Remote Tunnels extension
    crit: notable
    conf: 0.99
    for: [vsix]
    all:
      - id: remote-server-vsix-id
      - id: remote-server-vsix-publisher

  - id: remote-ssh-package
    desc: Microsoft Remote SSH manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: remote-ssh-package-name
      - id: remote-ssh-package-publisher

  - id: remote-server-package
    desc: Microsoft Remote Tunnels manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: remote-server-package-name
      - id: remote-server-package-publisher

  - id: remote-ssh-bundle
    desc: Microsoft Remote SSH bundle
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: remote-development-repository
      - id: remote-ssh-agent-folder
      - id: remote-ssh-install-options

  - id: remote-ssh-doc-bundle
    desc: Microsoft Remote SSH documentation bundle
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: remote-ssh-bundle
      - id: remote-ssh-authorized-keys-doc

  - id: remote-server-bundle
    desc: Microsoft Remote Tunnels bundle
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: remote-server-client-id
      - id: dev-tunnels-ssh-repository
