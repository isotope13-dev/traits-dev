# devspaces-remote-ssh — Red Hat OpenShift Dev Spaces SSH extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives, markdown]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: devspaces-remote-ssh extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: devspaces-remote-ssh

  - id: devspaces-remote-ssh-github-repo
    desc: redhat-developer/devspaces-remote-ssh repo URL
    for: [package.json, json, markdown, javascript]
    if:
      type: text
      substr: redhat-developer/devspaces-remote-ssh

composite_rules:
  - id: devspaces-remote-ssh-extension
    desc: Red Hat Dev Spaces remote SSH VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: well-known/app/development/vscode-extension/redhat::publisher
      - id: package-name
