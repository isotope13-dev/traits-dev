# envoke-cli — YAML variable resolver for shell env and .env output.
defaults:
  platforms: [windows, unix]
  for: [crate, rust, tar, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: crate-package-name
    desc: Cargo crate name envoke-cli
    for: [crate, rust]
    if:
      type: text
      regex: '(?m)^name\s*=\s*"envoke-cli"'

  - id: envoke-github-repo
    desc: glennib/envoke GitHub repository URL
    if:
      type: text
      substr: glennib/envoke

  - id: envoke-yaml-variable-description
    desc: envoke YAML variable resolver description
    if:
      type: text
      substr: Resolve variables from literals, commands, scripts

composite_rules:
  - id: envoke-cli-crate
    desc: envoke-cli YAML variable resolver crate
    crit: notable
    conf: 0.96
    all:
      - id: crate-package-name
    any:
      - id: envoke-github-repo
      - id: envoke-yaml-variable-description
