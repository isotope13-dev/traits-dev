# Prismatic.io's private VS Code/Cursor extension for Code-Native Integrations.
defaults:
  platforms: [windows, unix]
  for: [package.json, json, javascript, typescript, vsix, vsix-archive, text]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Prismatic.io extension package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: prismatic-io

  - id: package-publisher
    desc: Prismatic VS Code extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: prismatic

  - id: repository-coordinate
    desc: Prismatic extension GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: https://github.com/prismatic-io/vscode

composite_rules:
  - id: extension
    desc: Prismatic Code-Native Integrations extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
