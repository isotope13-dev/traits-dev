# neosmart/securestore — PHP library for NeoSmart SecureStore v3 vaults.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: composer-package-name
    desc: neosmart/securestore Composer package name
    for: [composer.json, json, markdown]
    if:
      type: text
      substr: neosmart/securestore

  - id: securestore-library-description
    desc: SecureStore vault secrets library description
    for: [composer.json, json, markdown]
    if:
      type: text
      substr: Load and decrypt SecureStore vault secrets

  - id: securestore-v3-spec
    desc: SecureStore v3 vault version check
    for: [php]
    if:
      type: text
      substr: This library supports v3

composite_rules:
  - id: neosmart-securestore-library
    desc: NeoSmart SecureStore vault secrets PHP library
    crit: notable
    conf: 0.99
    any:
      - id: composer-package-name
      - id: securestore-library-description
