# vscode-pi — pi coding agent VS Code extension by cdervis.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: cdervis VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: cdervis

  - id: package-name
    desc: vscode-pi extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: vscode-pi

  - id: vscode-pi-github-repo
    desc: cdervis/vscode-pi GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: cdervis/vscode-pi

composite_rules:
  - id: vscode-pi-extension
    desc: pi Agent coding agent VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
