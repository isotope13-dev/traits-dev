# imnot — stateful API mock server for integration testing.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: imnot PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: imnot

  - id: github-repo
    desc: imnot GitHub repository marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: github.com/edu2105/imnot

  - id: mock-server-summary
    desc: imnot stateful API mock server summary
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: stateful API mock server for integration testing

composite_rules:
  - id: imnot-mock-server-context
    desc: imnot stateful API mock server for integration tests
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: mock-server-summary
