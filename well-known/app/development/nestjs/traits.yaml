# @nestjs/core — NestJS Node.js web framework core package.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: nestjs-core-package-name
    desc: "@nestjs/core npm package name"
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: "@nestjs/core"

  - id: nestjs-homepage
    desc: NestJS product homepage marker
    for: [package.json, npm]
    if:
      type: text
      substr: nestjs.com

  - id: nestjs-repository
    desc: NestJS upstream GitHub repository
    for: [package.json, npm]
    if:
      type: text
      substr: github.com/nestjs/nest

composite_rules:
  - id: nestjs-framework-context
    desc: NestJS web framework npm package
    crit: exception
    conf: 0.99
    all:
      - id: nestjs-core-package-name
      - id: nestjs-homepage
      - id: nestjs-repository
