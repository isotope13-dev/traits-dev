# fissible/fault — Laravel exception tracking for fissible/watch cockpit.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.97

traits:
  - id: fault-composer-package-name
    desc: fissible/fault Composer package name
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: fissible/fault

  - id: fault-github-repo
    desc: fissible/fault GitHub repository URL
    if:
      type: text
      substr: github.com/fissible/fault

  - id: fault-namespace
    desc: Fissible Fault PHP namespace
    for: [php]
    if:
      type: text
      substr: Fissible\\Fault\\

composite_rules:
  - id: fissible-fault-package
    desc: fissible/fault Laravel exception tracker
    crit: notable
    conf: 0.98
    any:
      - id: fault-composer-package-name
      - id: fault-github-repo
