# Kong Insomnia, the API client. The Electron host calls ShellExecute and
# CreateProcessW to open links and spawn helpers.
defaults:
  size_min: 1000000
  size_max: 20000000
  platforms: [windows]
  for: [pe]
  crit: notable
traits:
  - id: insomnia-product-name
    desc: Insomnia API client product
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: Insomnia
