defaults:
  platforms:
  - windows
  for:
  - package.json
  - npm
  - javascript
  - typescript
  - powershell
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: a11ign screenreader-worker npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^@a11ign/screenreader-(worker|fleet)$
- id: npm-package-name
  desc: a11ign screenreader-worker npm archive identity
  for:
  - npm
  if:
    type: value
    path: npm.name
    regex: ^@a11ign/screenreader-(worker|fleet)$
- id: repository-url
  desc: a11ign screenreader-worker GitHub repo URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: ^(git\+)?https://github\.com/a11ign/screenreader-(worker|fleet)(\.git)?$
- id: npm-repository-url
  desc: a11ign screenreader-worker npm repository URL
  for:
  - npm
  if:
    type: value
    path: npm.repository.url
    regex: ^(git\+)?https://github\.com/a11ign/screenreader-(worker|fleet)(\.git)?$
- id: nvda-worker-bin
  desc: a11ign NVDA worker CLI bin entry
  for:
  - package.json
  if:
    type: value
    path: bin.a11ign-nvda-worker
    exact: ./dist/server.mjs
- id: capture-protocol-export
  desc: a11ign capture protocol version export
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: CAPTURE_PROTOCOL_VERSION
- id: windows-trim-marker
  desc: a11ign windows guest trim completion marker path
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: .windows-trimmed
- id: windows-trim-routine
  desc: a11ign Windows guest trim provisioning routine
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: applyWindowsTrim
- id: a11ign-capture-worker-script
  desc: a11ign capture worker provisioning script
  for:
  - powershell
  if:
    type: text
    regex: (?i)\ba11ign capture worker\b
