# @a11ign/screenreader-worker — NVDA capture worker for accessibility testing.
# Optional guest provisioning (windows-trim) disables bloatware services on lab VMs.
defaults:
  platforms: [windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: a11ign screenreader-worker npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@a11ign/screenreader-worker"

  - id: npm-package-name
    desc: a11ign screenreader-worker npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@a11ign/screenreader-worker"

  - id: repository-url
    desc: a11ign screenreader-worker GitHub repo URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/a11ign/screenreader-worker(\.git)?$'

  - id: npm-repository-url
    desc: a11ign screenreader-worker npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/a11ign/screenreader-worker(\.git)?$'

  - id: nvda-worker-bin
    desc: a11ign NVDA worker CLI bin entry
    for: [package.json]
    if:
      type: value
      path: bin.a11ign-nvda-worker
      exact: "./dist/server.mjs"

  - id: capture-protocol-export
    desc: a11ign capture protocol version export
    for: [javascript, typescript]
    if:
      type: text
      substr: CAPTURE_PROTOCOL_VERSION

  - id: windows-trim-marker
    desc: a11ign windows guest trim completion marker path
    for: [javascript, typescript]
    if:
      type: text
      substr: .windows-trimmed

composite_rules:
  - id: official-package-identity
    desc: Official a11ign screenreader-worker package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official a11ign screenreader-worker repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: archive-context
    desc: a11ign NVDA screenreader capture worker context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: nvda-worker-bin
      - id: capture-protocol-export
      - id: windows-trim-marker
