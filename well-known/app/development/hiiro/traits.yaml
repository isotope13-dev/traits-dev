# hiiro — Joshua Toyota Ruby multi-command CLI framework gem.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, markdown, text, json, shell]
  crit: notable
  conf: 0.98

traits:
  - id: gem-name
    desc: hiiro Ruby gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: hiiro

  - id: hiiro-class-marker
    desc: hiiro Ruby framework class marker
    for: [ruby]
    if:
      type: text
      substr: class Hiiro

  - id: hiiro-version-constant
    desc: hiiro VERSION constant marker
    for: [ruby]
    if:
      type: text
      substr: Hiiro::VERSION

  - id: hiiro-github-repo
    desc: unixsuperhero/hiiro GitHub repository URL
    for: [ruby, markdown, text, json]
    if:
      type: text
      substr: github.com/unixsuperhero/hiiro

  - id: hiiro-module-path
    desc: hiiro Ruby library module path
    for: [ruby, gem, archives]
    if:
      type: path
      regex: '(?i)hiiro/'

composite_rules:
  - id: hiiro-cli-framework
    desc: hiiro Ruby multi-command CLI framework gem
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: gem-name
      - id: hiiro-class-marker
      - id: hiiro-module-path
