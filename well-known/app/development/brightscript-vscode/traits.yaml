# Roku Community BrightScript — official VS Code language support extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, typescript, vsix, archives]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 5000000

traits:
  - id: roku-community-publisher
    desc: RokuCommunity VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: RokuCommunity

  - id: brightscript-package-name
    desc: BrightScript VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: brightscript

  - id: vscode-brightscript-repo
    desc: RokuCommunity BrightScript extension repo URL
    if:
      type: text
      substr: RokuCommunity/vscode-brightscript-language

composite_rules:
  - id: brightscript-extension
    desc: Roku Community BrightScript VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: roku-community-publisher
      - id: brightscript-package-name
