# gal-run — Scheduler Systems GAL governance VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, vsix-archive, json, text]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: gal-run VS Code extension package name
    for: [json, text]
    if:
      type: text
      regex: '(?im)"name"\s*:\s*"gal-run"'

  - id: publisher-scheduler-systems
    desc: scheduler-systems VS Code extension publisher
    for: [json, text]
    if:
      type: text
      regex: '(?im)"publisher"\s*:\s*"scheduler-systems"'

  - id: gal-dashboard-url
    desc: GAL dashboard URL
    if:
      type: text
      substr: app.gal.run

  - id: gal-webview-sidebar
    desc: GAL governance webview sidebar bundle
    for: [javascript, typescript]
    if:
      type: text
      substr: Governance Agentic Layer

composite_rules:
  - id: gal-run-extension
    desc: GAL governance VS Code extension
    crit: notable
    conf: 0.98
    any:
      - id: package-name
      - id: publisher-scheduler-systems
      - id: gal-dashboard-url
      - id: gal-webview-sidebar
