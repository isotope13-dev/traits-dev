# strands-compose — YAML-driven multi-agent orchestration for strands-agents.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name strands-compose
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*strands-compose\s*$'

  - id: strands-compose-github-repo
    desc: strands-compose/sdk-python GitHub repository URL
    if:
      type: text
      substr: strands-compose/sdk-python

  - id: strands-compose-module-path
    desc: strands_compose Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])strands_compose([\\/]|$)'

composite_rules:
  - id: strands-compose-package
    desc: strands-compose YAML agent orchestration package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: strands-compose-github-repo
      - id: strands-compose-module-path
