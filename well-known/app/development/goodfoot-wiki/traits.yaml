# Goodfoot Wiki Viewer — wiki markdown webview VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: publisher
    desc: goodfoot VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: goodfoot

  - id: package-name
    desc: wiki-extension VS Code package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: wiki-extension

  - id: goodfoot-github-repo
    desc: goodfoot-io/wiki GitHub repository URL
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: goodfoot-io/wiki

composite_rules:
  - id: goodfoot-wiki-vscode-extension
    desc: Goodfoot wiki markdown viewer VS Code extension
    crit: notable
    conf: 0.97
    all:
      - id: publisher
      - id: package-name
