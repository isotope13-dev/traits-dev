# GitSplit is a PowerShell module for planning and applying Git patch, hunk,
# and commit operations. Its generated command scripts and ordinary arrays are
# implementation details, not an obfuscated payload.
defaults:
  platforms: [unix, windows]
  for: [powershell, nupkg]
  crit: notable
  conf: 1.0

traits:
  - id: module-basename
    desc: GitSplit PowerShell module file
    for: [powershell]
    if:
      type: basename
      exact: GitSplit.psm1

  - id: module-purpose
    desc: GitSplit Git patch and commit module
    for: [powershell]
    if:
      type: text
      substr: git-oriented patch/hunk/commit splitting utilities

composite_rules:
  - id: module-context
    desc: GitSplit PowerShell module context
    crit: exception
    scope: file
    all:
      - id: module-basename
      - id: module-purpose
