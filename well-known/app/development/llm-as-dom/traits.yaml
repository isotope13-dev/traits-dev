# llm-as-dom — menot-you MCP browser automation binary wrapper.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: llm_as_dom Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: llm_as_dom

  - id: package-metadata-name
    desc: llm-as-dom PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: llm-as-dom'

  - id: module-path
    desc: menot_you_mcp_lad Python module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)menot_you_mcp_lad/'

  - id: mcp-lad-entry-point
    desc: mcp-lad console script entry point
    for: [text, pkginfo, markdown]
    if:
      type: text
      substr: mcp-lad = menot_you_mcp_lad

  - id: github-repo
    desc: menot-you llm-as-dom GitHub repository
    for: [json, markdown, text, python, pkginfo]
    if:
      type: text
      substr: menot-you/llm-as-dom

composite_rules:
  - id: llm-as-dom-package
    desc: LLM-as-DOM MCP browser pilot Python wrapper
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
