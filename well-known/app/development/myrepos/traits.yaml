# myrepos (mr) — Joey Hess tool to manage multiple VCS repositories.
# FreeBSD ships it as a zstd-wrapped pkg; the payload is a self-contained
# Perl command plus .mrconfig documentation.
defaults:
  platforms: [unix]
  for: [pkg, zst, perl, text, markdown]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 50000000

traits:
  - id: freebsd-pkg-basename
    desc: myrepos FreeBSD package basename
    for: [pkg, zst]
    if:
      type: value
      path: file.basename
      regex: '(?i)^myrepos-'

  - id: homepage-url
    desc: myrepos branchable project homepage
    for: [perl, text, markdown]
    if:
      type: text
      substr: myrepos.branchable.com

  - id: pod-name-heading
    desc: mr tool POD name heading
    for: [perl]
    if:
      type: text
      substr: 'mr - a tool to manage all your version control repos'

composite_rules:
  - id: myrepos-identity
    desc: Recognized myrepos VCS manager
    needs: 2
    any:
      - id: freebsd-pkg-basename
      - id: homepage-url
      - id: pod-name-heading
      - id: metadata/package/files/bsd::freebsd-pkg-zstd-archive
