defaults:
  platforms: [unix, windows]
  for: [nupkg, javascript]
  size_max: 600000000

traits:
  - id: github-desktop-delta-package
    desc: GitHub Desktop delta package context
    crit: notable
    conf: 0.99
    for: [nupkg]
    if:
      type: path
      regex: '(?i)GitHubDesktop-[0-9][^\\/]*\.nupkg'
  - id: github-desktop-copilot-member
    desc: GitHub Desktop Copilot member context
    crit: notable
    conf: 0.99
    size_max: 500000000
    for: [javascript, pe]
    if:
      type: path
      regex: '(?i)copilot[\\/]'

  - id: github-desktop-app-path
    desc: GitHub Desktop application bundle member
    crit: notable
    conf: 0.99
    platforms: [macos]
    for: [binaries, scripts, source, manifests, data]
    if:
      type: path
      regex: '(?i)(^|[/\\])GitHub Desktop\.app([/\\]|$)'

  - id: github-desktop-signing-team
    desc: GitHub Desktop macOS signing team
    crit: notable
    conf: 1.0
    platforms: [macos]
    for: [macho]
    if:
      type: value
      path: macho.code_signature.team_id
      exact: VEKTX9H2N7

  - id: github-desktop-bundle-id
    desc: GitHub Desktop bundle identifier
    crit: notable
    conf: 1.0
    platforms: [macos]
    for: [plist]
    if:
      type: value
      path: CFBundleIdentifier
      exact: com.github.GitHubClient

composite_rules:
  - id: official-signed-app-bundle
    desc: Official GitHub Desktop application bundle
    crit: exception
    conf: 0.99
    platforms: [macos]
    for: [macho]
    all:
      - id: github-desktop-app-path
      - id: github-desktop-signing-team
