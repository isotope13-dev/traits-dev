defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: elixir-windows-installer-basename
    desc: Elixir Windows installer basename
    crit: notable
    conf: 0.99
    size_min: 500000
    if:
      type: basename
      regex: '(?i)^elixir-lang-.*-elixir-otp-[0-9]+\.exe$'

  # The signer string is constrained to the tail of the PE, where the
  # Authenticode certificate table resides.  The basename and NSIS marker are
  # still required by the exception below; the string alone is only provenance.
  - id: erlang-ecosystem-foundation-certificate-marker
    desc: Erlang Ecosystem Foundation certificate marker
    crit: notable
    conf: 0.99
    size_min: 500000
    if:
      type: raw
      regex: Erlang Ecosystem Foundation
      offset_range: [-16384, null]

composite_rules:
  - id: official-elixir-windows-nsis-installer
    desc: Recognized official Elixir Windows NSIS installer
    crit: exception
    conf: 0.99
    all:
      - id: elixir-windows-installer-basename
      - id: erlang-ecosystem-foundation-certificate-marker
      - id: metadata/binary/installer/script::nsis
