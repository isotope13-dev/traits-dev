# DataLex CLI — git-native data modeling for dbt users.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name datalex-cli
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*datalex-cli\s*$'

  - id: datalex-github-repo
    desc: duckcode-ai/DataLex GitHub repository URL
    if:
      type: text
      substr: duckcode-ai/DataLex

  - id: datalex-core-module-path
    desc: datalex_core Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])datalex_core([\\/]|$)'

composite_rules:
  - id: datalex-cli-package
    desc: DataLex git-native dbt modeling CLI package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: datalex-github-repo
      - id: datalex-core-module-path
