defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
composite_rules:
- id: gitlab-api-client-token-marker
  desc: GitLab client name or import references
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: well-known/lib/network/gl-got::gitlab-api-client-gl-got-require
  - id: well-known/lib/network/gl-got::gitlab-api-client-wrapper-require
  - id: metadata/lang/source/naming/action/function-name::gitlab-api-client-glgot-call
