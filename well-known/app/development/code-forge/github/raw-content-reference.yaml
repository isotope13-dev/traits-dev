defaults:
  platforms: [windows, unix]
  for: [scripts, markdown]
  crit: notable
traits:
  - id: github-raw-url
    desc: GitHub raw-content URL
    conf: 0.92
    if:
      type: text
      regex: 'https?://raw\.githubusercontent\.com/'
  - id: raw-githubusercontent-host-reference
    desc: References raw.githubusercontent.com host
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: raw.githubusercontent.com
