traits:
  - id: github-uploads-api
    desc: GitHub uploads host reference
    crit: notable
    conf: 0.8
    for: [shell, python, javascript, typescript, github-actions]
    platforms: [unix, windows]
    if:
      type: string_literal
      substr: uploads.github.com
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
