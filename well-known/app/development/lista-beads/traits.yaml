# lista-beads — Trimble Lista Beads issue tracker VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: lista-beads extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: lista-beads

  - id: publisher
    desc: ListaDev VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: ListaDev

  - id: lista-beads-command
    desc: listaBeads.refresh command id
    for: [package.json, json, javascript]
    if:
      type: text
      substr: listaBeads.refresh

  - id: github-repo
    desc: trimble-oss/lista-extensions GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: trimble-oss/lista-extensions

composite_rules:
  - id: lista-beads-extension
    desc: Lista Beads VS Code issue tracker extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: lista-beads-command
      - id: github-repo
