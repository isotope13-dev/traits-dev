defaults:
  platforms: [linux, windows, macos]
  crit: notable
  conf: 0.96
  size_min: 10485760
  size_max: 536870912

traits:
  - id: gitea-go-module
    desc: Gitea server Go module identity
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: code.gitea.io/gitea

  - id: wolfi-gitea-package
    desc: Wolfi Gitea package
    for: [archive]
    if:
      type: basename
      regex: '^gitea-[0-9][^\\/]*\.apk$'

  - id: gitea-server-binary
    desc: Gitea server binary
    for: [elf]
    size_min: 10485760
    size_max: 536870912
    if:
      type: basename
      exact: gitea
