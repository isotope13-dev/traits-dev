# DCloud HBuilder / uni-app base runtime APK (io.dcloud.HBuilder).
# The base launcher APK is a universal developer preview container signed by
# DCloud; it bundles permissions, messaging bridges, and debug hot-reload code
# for all uni-app plugins regardless of whether a previewed project uses them.
defaults:
  platforms: [android]
  crit: notable

traits:
  - id: dcloud-hbuilder-package
    desc: Android package is io.dcloud.HBuilder
    conf: 0.95
    for: [apk]
    if:
      type: value
      path: android.package
      exact: io.dcloud.HBuilder

  - id: dcloud-hbuilder-verified-signer
    desc: APK signed with DCloud HBuilder certificate
    conf: 0.98
    for: [apk]
    if:
      type: value
      path: android.signatures[0].thumbprint_sha256
      exact: d75c1fa2b9ae867ce688a8adc6deac7cd6ba96f43a751fd10a200fa5974ac636

composite_rules:
  - id: dcloud-hbuilder-base-context
    desc: Verified DCloud HBuilder base runtime APK
    crit: exception
    conf: 0.98
    for: [apk, zip]
    scope: archive
    all:
      - id: dcloud-hbuilder-package
      - id: dcloud-hbuilder-verified-signer
      - id: metadata/signature/certificate/integrity::android-signature-verified
