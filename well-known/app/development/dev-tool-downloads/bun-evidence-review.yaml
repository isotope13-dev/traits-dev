defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: bun-installer-endpoint-literal
    desc: Bun installer endpoint reference
    if:
      type: literal
      kind: string
      regex: 'bun\.(sh|com)/install'
  - id: bun-installer-endpoint-call-text
    desc: Bun installer endpoint in call text
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(exec(Sync)?|spawn(Sync)?|fetch|download)\s*\([^)]{0,200}bun\.(sh|com)/install'
