# Processing IDE — creative-coding environment and toolchain.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, macho, markdown, github_actions, archives, objc]
  crit: notable
  conf: 0.99

traits:
  - id: processing-repository-marker
    desc: Processing upstream repository marker
    for: [java, kotlin, markdown, github_actions]
    if:
      type: text
      substr: 'github.com/processing/processing'

  - id: processing-gradle-group-marker
    desc: Processing Gradle project group marker
    for: [kotlin]
    if:
      type: text
      substr: 'group = "processing"'

  - id: processing-bundle-identifier
    desc: Processing macOS bundle identifier marker
    crit: notable
    conf: 0.99
    for: [macho]
    size_min: 4096
    size_max: 5242880
    if:
      type: value
      path: macho.code_signature.identifier
      exact: org.processing.four

  - id: appbundler-admin-privileged-launch
    desc: Appbundler privileged shell launch
    crit: notable
    conf: 0.95
    for: [macho]
    size_min: 4096
    size_max: 5242880
    if:
      type: text
      regex: 'do shell script.{0,120}with administrator privileges'
      section: __TEXT,__cstring

  - id: launch4j-toolchain-path
    desc: Launch4j cross-compiler toolchain path
    for: [elf, macho, archives]
    size_min: 1024
    size_max: 52428800
    if:
      type: path
      regex: 'launch4j'

  - id: appbundler-source-path
    desc: Oracle appbundler native launcher source path
    for: [objc]
    if:
      type: path
      regex: 'appbundler/native/'

composite_rules:
  - id: processing-package-context
    desc: Processing IDE source and build context
    crit: exception
    conf: 1.0
    scope: outer
    any:
      - id: processing-repository-marker
      - id: processing-gradle-group-marker
      - id: processing-bundle-identifier
      - id: appbundler-source-path

  - id: processing-macos-launcher-context
    desc: Processing macOS appbundler launcher context
    crit: exception
    conf: 1.0
    scope: file
    for: [macho]
    all:
      - id: processing-bundle-identifier
      - id: appbundler-admin-privileged-launch
