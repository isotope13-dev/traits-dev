# Paseo — voice-controlled development environment for local AI coding agents
# (paseo.sh, github.com/getpaseo/paseo, npm `paseo`, `@getpaseo/*`).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: paseo-package-name
    desc: Manifest identifies Paseo package
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(paseo|@getpaseo/[a-z0-9-]+)$'

  - id: paseo-repo-url
    desc: Paseo repository reference
    for: [package.json, javascript, typescript, json]
    if:
      type: text
      substr: github.com/getpaseo/paseo

  - id: paseo-plugin-scope
    desc: Paseo package scope reference
    for: [javascript, typescript]
    if:
      type: text
      substr: '@getpaseo/'

composite_rules:
  - id: paseo-identity
    desc: Paseo voice AI coding environment
    crit: notable
    conf: 0.99
    any:
      - id: paseo-package-name
      - id: paseo-repo-url
      - id: paseo-plugin-scope
