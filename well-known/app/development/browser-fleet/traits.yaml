# Browser Fleet Windows bootstrap has been observed as an unsigned Go
# downloader that phones home to sslip.io / workers.dev control planes and
# installs Run-key + service persistence. Keep the identity atoms for
# attribution; the hostile composite below requires the C2 and persistence
# legs so a clean rebuild without those surfaces does not inherit malice.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576
  size_max: 15728640

traits:
  - id: go-bootstrap-path
    desc: Browser Fleet bootstrap Go command path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.go.path
      exact: github.com/serhat/browser-fleet/bootstrap/cmd/fleet-bootstrap

  - id: bootstrap-token-header
    desc: Browser Fleet bootstrap token header
    crit: notable
    conf: 0.99
    if:
      type: raw
      substr: X-Fleet-Bootstrap-Token
      section: .rdata

  - id: acceptance-verifier-symbol
    desc: Browser Fleet acceptance verifier function
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: github.com/serhat/browser-fleet/supervisor/update.AcceptanceVerifier.Verify
      section: .rdata

composite_rules:
  - id: bootstrap-identity
    desc: Browser Fleet Windows bootstrap identity
    crit: notable
    conf: 1.0
    all:
      - id: go-bootstrap-path
      - id: bootstrap-token-header
      - id: acceptance-verifier-symbol

  - id: bootstrap-sslip-runkey-downloader
    desc: Browser Fleet bootstrap with sslip.io Run-key staging
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1547.001,T1105
    all:
      - id: bootstrap-identity
      - id: micro-behaviors/communications/http/url/domain::sslip-io-ip-hostname
      - id: objectives/persistence/login/startup/registry::software-run-key
    unless:
      - id: metadata/signed/platform/
