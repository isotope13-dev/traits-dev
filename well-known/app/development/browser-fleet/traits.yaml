defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1048576
  size_max: 15728640

traits:
  - id: go-bootstrap-path
    desc: Browser Fleet bootstrap Go command path
    if:
      type: value
      path: pe.go.path
      exact: github.com/serhat/browser-fleet/bootstrap/cmd/fleet-bootstrap

  - id: bootstrap-token-header
    desc: Browser Fleet bootstrap token header
    if:
      type: raw
      substr: X-Fleet-Bootstrap-Token
      section: .rdata

  - id: acceptance-verifier-symbol
    desc: Browser Fleet acceptance verifier function
    if:
      type: text
      exact: github.com/serhat/browser-fleet/supervisor/update.AcceptanceVerifier.Verify
      section: .rdata

composite_rules:
  - id: bootstrap-identity
    desc: Browser Fleet Windows bootstrap identity
    crit: notable
    conf: 1.0
    all:
      - id: go-bootstrap-path
      - id: bootstrap-token-header
      - id: acceptance-verifier-symbol
