# Hammerspoon is a signed macOS automation application. Its window, clipboard,
# screen, socket, and shell APIs are product capabilities, not malware intent.
defaults:
  platforms: [macos]

traits:
  - id: hammerspoon-application-bundle-path
    desc: Hammerspoon macOS application bundle member
    crit: notable
    conf: 0.99
    size_max: 600000000
    for: [binaries, scripts, source, manifests, data, archives]
    if:
      type: path
      regex: '(?i)(^|[/\\])Hammerspoon\.app([/\\]|$)'

  - id: hammerspoon-bundle-identifier
    desc: Hammerspoon macOS bundle identifier
    crit: notable
    conf: 1.0
    size_max: 600000000
    for: [macho]
    if:
      type: value
      path: macho.code_signature.identifier
      exact: org.hammerspoon.Hammerspoon

  - id: hammerspoon-signing-team
    desc: Hammerspoon macOS signing team
    crit: notable
    conf: 1.0
    size_max: 600000000
    for: [macho]
    if:
      type: value
      path: macho.code_signature.team_id
      exact: VQCYSNZB89

composite_rules:
  - id: hammerspoon-application-context
    desc: Official signed Hammerspoon macOS application
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: hammerspoon-bundle-identifier
      - id: hammerspoon-signing-team
