# godot-kit — AnEntrypoint Agent Skills installer for Godot 4.x.
# Writes Claude skill docs plus localhost HTTP debug bridges (editor port
# 6008, game REPL port 6009). Later npm versions (e.g. 1.0.1786316795) were
# hijacked with a NullReceiver Ethereum C2 loader in lang/gdscript.js; this
# identity covers the legitimate package surface so those stages stay distinct.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: npm package name is godot-kit
    for: [package.json, javascript, typescript, markdown]
    if:
      type: value
      path: package.json::name
      exact: godot-kit

  - id: archive-package-name
    desc: npm archive package name is godot-kit
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: godot-kit

  - id: archive-repository
    desc: godot-kit AnEntrypoint GitHub repository
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: git+https://github.com/AnEntrypoint/godot-kit.git

  - id: package-repository
    desc: package.json points at AnEntrypoint/godot-kit
    for: [package.json]
    if:
      type: value
      path: package.json::repository.url
      exact: git+https://github.com/AnEntrypoint/godot-kit.git

  - id: repl-bridge-autoload
    desc: Wires ReplBridge Godot autoload path
    for: [javascript, typescript]
    if:
      type: text
      substr: 'ReplBridge="*res://addons/repl_bridge/repl_bridge.gd"'

  - id: editor-bridge-port
    desc: GodotKit editor HTTP bridge port 6008
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?m)^\s*const PORT := 6008\s*$'

  - id: editor-run-gdscript-route
    desc: Editor HTTP /run-gdscript eval route
    for: [javascript, typescript]
    if:
      type: text
      substr: '/run-gdscript'

composite_rules:
  - id: godot-kit-archive-identity
    desc: Recognized godot-kit npm archive
    conf: 0.99
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-repository

  - id: godot-kit-package-identity
    desc: Recognized godot-kit package.json identity
    conf: 0.99
    all:
      - id: package-name
      - id: package-repository

  - id: godot-kit-editor-http-eval-bridge
    desc: GodotKit editor HTTP bridge with GDScript eval
    conf: 0.97
    all:
      - id: editor-bridge-port
      - id: editor-run-gdscript-route
      - id: micro-behaviors/communications/socket/listen::gdscript-tcpserver-listen
      - id: micro-behaviors/process/interpreter/expression::gdscript-expression-execute
