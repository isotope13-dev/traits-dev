# Microsoft dotnet/skills — curated .NET agent skills, eval harnesses, and
# gh-aw security workflows for the Copilot agent-skills marketplace.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, json, github-actions, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: project-heading
    desc: .NET Agent Skills project heading
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: .NET Agent Skills

  - id: upstream-repository
    desc: dotnet/skills upstream repository reference
    for: [markdown, text, json, github-actions]
    if:
      type: text
      regex: '(?i)github\.com/dotnet/skills\b'

  - id: marketplace-reference
    desc: dotnet agent skills marketplace reference
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)dotnet/skills|dotnet-agent-skills'

  - id: source-tree-member
    desc: dotnet skills source archive member path
    if:
      type: path
      regex: '(^|[\\/])skills-[0-9a-f]{40}([\\/]|$)'

  - id: experiment-config-text
    desc: dotnet-skills experiment configuration marker
    for: [markdown, text]
    if:
      type: text
      substr: dotnet-skills.experiment.yaml

composite_rules:
  - id: dotnet-agent-skills-identity
    desc: Microsoft dotnet/skills agent skills repository
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: project-heading
      - id: upstream-repository
      - id: marketplace-reference
      - id: source-tree-member
      - id: experiment-config-text
