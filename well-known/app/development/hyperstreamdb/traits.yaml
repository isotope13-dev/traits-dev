# hyperstreamdb — serverless index-streaming database crate.
defaults:
  platforms: [windows, unix]
  for: [crate, rust, tar, archives]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: crate-package-name
    desc: Cargo crate name hyperstreamdb
    for: [crate, rust]
    if:
      type: text
      regex: '(?m)^name\s*=\s*"hyperstreamdb"'

  - id: hyperstreamdb-github-repo
    desc: hyperstreamdb GitHub repository URL
    if:
      type: text
      substr: rla3rd/hyperstreamdb

  - id: overlay-indexing-description
    desc: HyperStreamDB overlay indexing marker
    if:
      type: text
      substr: Overlay Indexing

composite_rules:
  - id: hyperstreamdb-crate
    desc: HyperStreamDB index-streaming database crate
    crit: notable
    conf: 0.96
    all:
      - id: crate-package-name
    any:
      - id: hyperstreamdb-github-repo
      - id: overlay-indexing-description
