# Sorcha.Cli — MIT NuGet DotnetTool for the Sorcha register platform.
# Retains the Visual Studio MyApplication.app template identity and a
# hash-derived far-future COFF stamp; Process.Start is CLI host behavior.
defaults:
  platforms: [windows, unix]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 8000
  size_max: 80000000

traits:
  - id: original-filename
    desc: Sorcha.Cli original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Sorcha.Cli.dll

  - id: company-name
    desc: Sorcha Contributors version company
    if:
      type: value
      path: pe.version.company
      exact: Sorcha Contributors

composite_rules:
  - id: official-cli-binary
    desc: Official Sorcha.Cli tool binary
    crit: notable
    conf: 0.99
    all:
      - id: original-filename
      - id: company-name
