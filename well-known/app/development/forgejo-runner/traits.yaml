defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.98
  size_min: 1000000
  size_max: 200000000

traits:
  - id: go-module-path
    desc: Forgejo Actions runner Go module path
    crit: notable
    if:
      type: value
      path: elf.go.module.path
      regex: '^code\.forgejo\.org/forgejo/runner/v[0-9]+$'
