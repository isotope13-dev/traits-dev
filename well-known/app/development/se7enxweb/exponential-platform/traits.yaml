# se7enxweb exponential platform — legacy Ibexa/eZ Platform Symfony CMS fork.
defaults:
  platforms: [unix, windows]
  for: [composer.json, package.json, php, markdown, zip, archives]
  crit: notable
  conf: 0.96

traits:
  - id: se7enxweb-composer-namespace
    desc: se7enxweb vendor packages in Composer manifest
    for: [composer.json, json]
    if:
      type: text
      substr: '"se7enxweb/'

  - id: se7enxweb-author-homepage
    desc: se7enx.com author homepage URL
    if:
      type: text
      substr: se7enx.com

  - id: symfony-webpack-encore-dependency
    desc: Symfony Webpack Encore build dependency
    for: [package.json, json]
    if:
      type: text
      regex: '"@symfony/webpack-encore"\s*:'

composite_rules:
  - id: se7enxweb-exponential-platform
    desc: se7enxweb Exponential Earth legacy platform
    crit: notable
    conf: 0.97
    any:
      - id: se7enxweb-composer-namespace
      - id: se7enxweb-author-homepage
