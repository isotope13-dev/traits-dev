# openclacky — OpenClaw Skill creator platform (clacky-ai).
defaults:
  platforms: [windows, unix]
  for: [gem, ruby, tar, archives, text]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: gem-package-name
    desc: Ruby gem name openclacky
    for: [gem, text]
    if:
      type: text
      regex: '(?im)^name:\s*openclacky\s*$'

  - id: clacky-ai-github-repo
    desc: clacky-ai/openclacky GitHub repository URL
    if:
      type: text
      substr: clacky-ai/openclacky

  - id: openclaw-skill-platform-marker
    desc: OpenClaw Skill creator platform marker
    if:
      type: text
      substr: OpenClaw Skill

composite_rules:
  - id: openclacky-gem
    desc: OpenClacky OpenClaw Skill creator platform gem
    crit: notable
    conf: 0.97
    any:
      - id: gem-package-name
      - id: clacky-ai-github-repo
      - id: openclaw-skill-platform-marker
