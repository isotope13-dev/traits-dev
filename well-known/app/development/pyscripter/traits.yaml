# PyScripter is a Delphi/VCL Python IDE. Its official Windows binary imports
# the VCL input-hook APIs and bundles registry, process, and shell helpers as
# part of its GUI/debugger runtime.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: product-name
    desc: PyScripter product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: PyScripter

  - id: original-filename
    desc: PyScripter original executable name
    if:
      type: value
      path: pe.version.original_filename
      exact: PyScripter.exe

  - id: author-signature
    desc: PyScripter author Authenticode signature
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Kiriakos Vlahos,.*'

  - id: verified-signature
    desc: PyScripter binary has a verified Authenticode signature
    if:
      type: value
      path: pe.signatures[0].verified
      exact: "true"

  - id: intact-signature
    desc: PyScripter Authenticode digest matches the binary
    if:
      type: value
      path: pe.signatures[0].digest_matches
      exact: "true"

composite_rules:
  - id: official-binary
    desc: Official PyScripter Windows executable
    all:
      - id: product-name
      - id: original-filename
      - id: author-signature
      - id: verified-signature
      - id: intact-signature
