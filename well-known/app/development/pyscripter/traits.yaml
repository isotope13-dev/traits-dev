# PyScripter is a Delphi/VCL Python IDE. Its official Windows binary imports
# the VCL input-hook APIs and bundles registry, process, and shell helpers as
# part of its GUI/debugger runtime.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  # The release executable is a multi-megabyte Delphi/VCL image; the bounds
  # only rule out stubs and unrelated blobs.
  size_min: 1000000
  size_max: 150000000

traits:
  - id: product-name
    desc: PyScripter product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: PyScripter

  - id: original-filename
    desc: PyScripter original executable name
    if:
      type: value
      path: pe.version.original_filename
      exact: PyScripter.exe

  - id: author-signature
    desc: PyScripter author Authenticode signature
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Kiriakos Vlahos,.*'
composite_rules:
  - id: official-binary
    desc: Official PyScripter Windows executable
    all:
      - id: product-name
      - id: original-filename
      - id: author-signature
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
