# Inspect DevTools is an Electron application whose mobile-web inspector
# implements its own CDP protocol adapter. These same-file markers identify
# the product-specific implementation without relying on a generic automation
# library name or on a cross-archive package correlation.

defaults:
  platforms: [windows]
  for: [pe, javascript]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: inspect-product-marker
    desc: Inspect DevTools product marker
    for: [javascript]
    if:
      type: text
      substr: Inspect DevTools

  - id: inspect-api-host
    desc: Inspect DevTools service endpoint
    for: [javascript]
    if:
      type: text
      substr: https://inspect.dev/api

  - id: inspect-cdp-input-adapter
    desc: Inspect DevTools CDP input adapter
    for: [javascript]
    if:
      type: text
      substr: 'protocolAdaptor.addMessageFilter("tools::Input.dispatch'

  - id: inspect-cdp-screencast-adapter
    desc: Inspect DevTools CDP screencast adapter
    for: [javascript]
    if:
      type: text
      substr: 'protocolAdaptor.addMessageFilter("tools::Page.startScreencast'

  - id: inspect-pe-company
    desc: Inspect DevTools PE company metadata
    for: [pe]
    if:
      type: value
      path: pe.version.company
      exact: Inspect DevTools

  - id: inspect-pe-product
    desc: Inspect DevTools PE product metadata
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: Inspect

  - id: inspect-nsis-uninstaller-manifest
    desc: Inspect NSIS uninstaller manifest identity
    for: [pe]
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Nullsoft.NSIS.exehead

  - id: inspect-uninstaller-basename
    desc: Inspect uninstaller executable basename
    for: [pe]
    if:
      type: basename
      regex: '(?i)^uninstall[ _-]inspect\.exe$'

composite_rules:
  - id: inspect-devtools-cdp-adapter-context
    desc: Recognized Inspect DevTools mobile-web CDP adapter
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: inspect-product-marker
      - id: inspect-api-host
      - id: inspect-cdp-input-adapter
      - id: inspect-cdp-screencast-adapter

  - id: inspect-devtools-nsis-uninstaller-context
    desc: Recognized Inspect DevTools signed NSIS uninstaller
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      # The "signature verifies" leg was a local copy of
      # metadata/signed/certificate/identity::pe-signature-verified-kv, which
      # fires on every signed PE and was surfacing as "Inspect PE has verified
      # Authenticode signature" on unrelated vendors' binaries. The canonical
      # trait is baseline, so it cannot be an exception member; the four
      # identity legs below already pin this to Inspect's own uninstaller.
      - id: inspect-pe-company
      - id: inspect-pe-product
      - id: inspect-nsis-uninstaller-manifest
      - id: inspect-uninstaller-basename
