# Official Unity Hub Linux package (deb under /usr/lib/unityhub). The
# Electron app.asar vendors npm trees; archive-scoped install-hook
# composites pool those members. LicensingClient is a signed .NET helper.
defaults:
  platforms: [unix, windows]
  for: [asar, deb, archives, javascript, pe, dll, csharp]
  crit: notable
  conf: 0.99
  size_max: 1000000000

traits:
  - id: linux-lib-install-path
    desc: Official Unity Hub Linux library path
    if:
      type: path
      regex: 'lib[\\/]unityhub'

  - id: official-deb-basename
    desc: Official Unity Hub Debian package basename
    for: [deb]
    platforms: [linux]
    if:
      type: path
      basename: true
      regex: '^unityhub_'

  - id: licensing-client-path
    desc: Unity Hub licensing client member path
    if:
      type: path
      regex: 'UnityLicensingClient'

  - id: linux-repo-host
    desc: Unity Hub Linux repository host
    for: [text, shell]
    if:
      type: text
      substr: hub.unity3d.com/linux/repos/deb

  - id: aur-pkg-name
    desc: Unity Hub AUR package name
    for: [text, shell]
    if:
      type: text
      regex: '(?m)^pkg(name|base)\s*=\s*unityhub$'

composite_rules:
  - id: official-package-context
    desc: Official Unity Hub package context
    crit: exception
    conf: 0.99
    any:
      - id: linux-lib-install-path
      - id: official-deb-basename
      - id: licensing-client-path
      - id: linux-repo-host
      - id: aur-pkg-name
