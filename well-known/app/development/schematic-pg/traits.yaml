defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  - tar
  - zip
  - javascript
  - typescript
  - markdown
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: schematic-pg npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: schematic-pg
- id: npm-package-name
  desc: schematic-pg npm archive identity
  for:
  - npm
  if:
    type: value
    path: npm.name
    exact: schematic-pg
- id: repository-url
  desc: schematic-pg GitHub repository URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: ^(git\+)?https://github\.com/tawsbob/schematic-pg(\.git)?$
- id: npm-repository-url
  desc: schematic-pg npm repository URL
  for:
  - npm
  if:
    type: value
    path: npm.repository.url
    regex: ^(git\+)?https://github\.com/tawsbob/schematic-pg(\.git)?$
- id: cli-bin
  desc: schematic-pg CLI bin entry
  for:
  - package.json
  if:
    type: value
    path: bin.schematic-pg
    exact: dist/cli.js
- id: framework-description
  desc: schematic-pg PostgreSQL Node description
  for:
  - package.json
  if:
    type: value
    path: description
    regex: (?i)postgresql.*node
- id: agents-guide-version-marker
  desc: schematic-pg managed AGENTS.md marker
  for:
  - javascript
  - typescript
  - markdown
  if:
    type: text
    substr: schematic-pg-agents
