# schematic-pg — schema-driven PostgreSQL + Node.js backend framework (tawsbob/schematic-pg).
# Postinstall refreshes an existing consumer AGENTS.md from the bundled guide template.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: schematic-pg npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: schematic-pg

  - id: npm-package-name
    desc: schematic-pg npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: schematic-pg

  - id: repository-url
    desc: schematic-pg GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/tawsbob/schematic-pg(\.git)?$'

  - id: npm-repository-url
    desc: schematic-pg npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/tawsbob/schematic-pg(\.git)?$'

  - id: cli-bin
    desc: schematic-pg CLI bin entry
    for: [package.json]
    if:
      type: value
      path: bin.schematic-pg
      exact: dist/cli.js

  - id: framework-description
    desc: schematic-pg PostgreSQL Node description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)postgresql.*node'

  - id: agents-guide-version-marker
    desc: schematic-pg managed AGENTS.md marker
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: schematic-pg-agents

composite_rules:
  - id: official-package-identity
    desc: Official schematic-pg package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official schematic-pg repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: archive-context
    desc: schematic-pg PostgreSQL backend framework
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: cli-bin
      - id: framework-description
      - id: agents-guide-version-marker
