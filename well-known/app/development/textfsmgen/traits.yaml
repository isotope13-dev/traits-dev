# textfsmgen — low-code TextFSM template generator library.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name textfsmgen
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*textfsmgen\s*$'

  - id: textfsmgen-github-repo
    desc: Geeks-Trident textfsmgen GitHub repo URL
    if:
      type: text
      substr: Geeks-Trident-LLC/textfsmgen

  - id: textfsmgen-module-path
    desc: textfsmgen Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])textfsmgen([\\/]|$)'

composite_rules:
  - id: textfsmgen-package
    desc: textfsmgen TextFSM template generator Python package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: textfsmgen-github-repo
      - id: textfsmgen-module-path
