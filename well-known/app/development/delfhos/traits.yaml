# Delfhos / Cortex — Python AI agent SDK with sandboxed code execution.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.94

traits:
  - id: delfhos-pkginfo-name
    desc: PyPI package name delfhos
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*delfhos\s*$'

  - id: delfhos-github-repo
    desc: DavidFraifer/delfhos GitHub repository URL
    if:
      type: text
      substr: DavidFraifer/delfhos

  - id: delfhos-agent-import
    desc: Delfhos Agent SDK import marker
    for: [python]
    if:
      type: text
      substr: from delfhos import Agent

  - id: python-executor-sandbox-module
    desc: Delfhos sandbox python executor path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])delfhos([\\/])python_executor\.py$'

composite_rules:
  - id: delfhos-agent-sdk
    desc: Delfhos Cortex AI agent SDK
    crit: notable
    conf: 0.95
    scope: outer
    all:
      - id: delfhos-pkginfo-name
    any:
      - id: delfhos-github-repo
      - id: delfhos-agent-import
      - id: python-executor-sandbox-module
