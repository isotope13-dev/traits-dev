# Delfhos / Cortex — Python AI agent SDK with sandboxed code execution.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.94

traits:
  - id: delfhos-pkginfo-name
    desc: PyPI package name delfhos
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*delfhos\s*$'

  - id: cortex-agent-module
    desc: Cortex agent orchestration module
    for: [python]
    if:
      type: basename
      exact: agent.py

  - id: python-executor-sandbox-module
    desc: Sandboxed Python executor module
    for: [python]
    if:
      type: basename
      exact: python_executor.py

composite_rules:
  - id: delfhos-agent-sdk
    desc: Delfhos Cortex AI agent SDK
    crit: notable
    conf: 0.95
    scope: outer
    all:
      - id: delfhos-pkginfo-name
    any:
      - id: cortex-agent-module
      - id: python-executor-sandbox-module
