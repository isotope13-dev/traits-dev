# mycode-sdk — multi-turn tool-calling agent runtime SDK.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name mycode-sdk
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*mycode-sdk\s*$'

  - id: mycode-github-repo
    desc: legibet/mycode GitHub repository URL
    if:
      type: text
      substr: legibet/mycode

  - id: mycode-module-path
    desc: mycode Python package module path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])mycode([\\/]|$)'

composite_rules:
  - id: mycode-sdk-package
    desc: mycode-sdk agent runtime Python package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: mycode-github-repo
      - id: mycode-module-path
