defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: remotion-renderer-package
    desc: Remotion renderer npm package
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@remotion/renderer'

  - id: remotion-compositor-dependency
    desc: Remotion compositor platform dependency ref
    for: [package.json]
    if:
      type: text
      regex: '"@remotion/compositor-(linux|darwin|win32)-'

composite_rules:
  - id: remotion-package-context
    desc: Remotion video renderer package context
    crit: notable
    conf: 0.95
    any:
      - id: remotion-renderer-package
      - id: remotion-compositor-dependency
