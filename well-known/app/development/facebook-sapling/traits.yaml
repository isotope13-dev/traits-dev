# Meta Sapling SCM — scalable source control with Eden, VS Code addons, and
# Windows build helpers shipped in the Go module source tree.
defaults:
  platforms: [unix, windows]
  for: [go, zip, javascript, package.json, vsix-manifest, json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: source-archive-member
    desc: facebook/sapling Go module source archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/facebook/sapling@v[0-9][^/]+/go\.mod$'

  - id: source-archive-path
    desc: facebook/sapling module source path
    for: [go, text]
    if:
      type: path
      regex: 'github\.com/facebook/sapling@'

  - id: vscode-extension-package
    desc: Sapling SCM VS Code extension package
    for: [package.json]
    if:
      type: value
      path: name
      exact: sapling-scm

  - id: meta-publisher
    desc: Meta VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: meta

composite_rules:
  - id: facebook-sapling-library
    desc: Meta Sapling SCM source tree
    crit: notable
    conf: 0.99
    any:
      - id: source-archive-member
      - id: source-archive-path
      - id: vscode-extension-package

  - id: facebook-sapling-source-archive-context
    desc: facebook/sapling source archive context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: source-archive-member
      - id: vscode-extension-package
