# @1interface/voice-shell — React voice UI providers (1interface-chat monorepo).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: 1interface voice-shell npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@1interface/voice-shell"

  - id: repository-url
    desc: 1interface-chat monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/aiatcore/1interface-chat

  - id: peer-react-postinstall-dedup
    desc: postinstall drops nested peer React copies
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      substr: rm -rf node_modules/react

composite_rules:
  - id: archive-context
    desc: 1interface voice-shell UI package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: repository-url
