defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  - javascript
  - typescript
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: 1interface voice-shell npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@1interface/voice-shell'
- id: package-name-voice-core
  desc: 1interface voice-core npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@1interface/voice-core'
- id: repository-url
  desc: 1interface-chat monorepo repository URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    substr: github.com/aiatcore/1interface-chat
- id: package-name-shared-core
  desc: 1interface shared-core npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@1interface/shared-core'
- id: peer-react-postinstall-dedup
  desc: postinstall removes nested peer React copies
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    substr: rm -rf node_modules/react
