# Pencil — VS Code design extension from High Agency (pencil.dev).
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Pencil VS Code extension package name
    if:
      type: value
      path: name
      exact: pencildev

  - id: publisher
    desc: High Agency Pencil extension publisher
    if:
      type: value
      path: publisher
      exact: highagency

  - id: homepage
    desc: Pencil design extension homepage
    if:
      type: text
      substr: https://pencil.dev

composite_rules:
  - id: package-identity
    desc: Official High Agency Pencil VS Code extension identity
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: publisher
      - id: homepage
