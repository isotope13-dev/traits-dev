# Markdown PDF — yzane VS Code markdown-to-PDF export extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: markdown-pdf extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: markdown-pdf

  - id: publisher
    desc: yzane VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: yzane

  - id: export-command
    desc: Markdown PDF export command id
    for: [package.json, json, javascript]
    if:
      type: text
      substr: extension.markdown-pdf.pdf

  - id: github-repo
    desc: yzane/vscode-markdown-pdf GitHub repository
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: yzane/vscode-markdown-pdf

  - id: puppeteer-dependency
    desc: puppeteer-core dependency for PDF rendering
    for: [package.json, json]
    if:
      type: text
      substr: '"puppeteer-core"'

composite_rules:
  - id: markdown-pdf-extension
    desc: yzane Markdown PDF VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: export-command
      - id: github-repo
      - id: puppeteer-dependency
