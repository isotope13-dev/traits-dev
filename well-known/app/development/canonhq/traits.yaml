# canonhq — spec-driven development platform (FastAPI + MCP).
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name canonhq
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*canonhq\s*$'

  - id: canonhq-github-repo
    desc: canonhq/canon GitHub repository URL
    if:
      type: text
      substr: canonhq/canon

  - id: canonhq-homepage-url
    desc: canonhq.co project homepage URL
    if:
      type: text
      substr: canonhq.co

composite_rules:
  - id: canonhq-package
    desc: Canon spec-driven development platform
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: canonhq-github-repo
      - id: canonhq-homepage-url
