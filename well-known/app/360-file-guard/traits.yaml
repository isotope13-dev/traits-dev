defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 300000000

traits:
  - id: qihoo-360-authenticode-signer
    desc: Qihoo 360 Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)(Beijing Qihu Technology Co.*Ltd|Qihoo 360 Software \(Beijing\) Company Limited)'

  - id: 360-company-field
    desc: 360.cn PE company metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^(360\.cn|Qihu 360 Software Co\., Ltd\.)$'

  - id: 360-product-family
    desc: 360 security product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)(^360|FileAbap|DocProte|TeslaCrypt)'

  - id: 360-description-family
    desc: 360 security component description
    if:
      type: value
      path: pe.version.description
      regex: '(?i)(360|FileAbap|Document Protector|TeslaCrypt)'

  - id: fileabap-driver-marker
    desc: FileAbap anti-ransomware driver marker
    if:
      type: value
      path: pe.version.comments
      exact: File Auto Backup and Protect

composite_rules:
  - id: 360-file-guard-identity
    desc: 360 File Guard signed component identity
    crit: notable
    conf: 0.99
    all:
      - id: qihoo-360-authenticode-signer
    any:
      - id: 360-company-field
      - id: 360-product-family
      - id: 360-description-family
      - id: fileabap-driver-marker
