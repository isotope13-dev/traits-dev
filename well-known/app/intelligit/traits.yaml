# IntelliGit — thanhtunguet VS Code Git client extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: intelligit-vsix-name
    desc: IntelliGit VSIX archive name
    if:
      type: path
      regex: '(?i)thanhtunguet\.vscode-git-client'

  - id: intelligit-package-name
    desc: IntelliGit extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"vscode-git-client"'

  - id: intelligit-publisher
    desc: thanhtunguet VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"thanhtunguet"'

  - id: intelligit-command-namespace
    desc: IntelliGit command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: intelliGit.

composite_rules:
  - id: intelligit-vscode-extension
    desc: IntelliGit VS Code Git client extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: intelligit-publisher
    any:
      - id: intelligit-vsix-name
      - id: intelligit-package-name
      - id: intelligit-command-namespace
