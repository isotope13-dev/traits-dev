# netwatch-tui is a network diagnostics and monitoring application.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
  crit: notable
  conf: 0.99

traits:
  - id: cargo-package-name
    desc: netwatch-tui Cargo package identity
    if:
      type: value
      path: crate.name
      exact: netwatch-tui
  - id: cargo-repository
    desc: netwatch-tui upstream repository identity
    if:
      type: value
      path: crate.repository
      exact: https://github.com/matthart1983/netwatch
  - id: safety-boundary-documentation
    desc: netwatch documented filesystem safety boundary
    for: [markdown]
    if:
      type: text
      substr: 'A tool that parses hostile traffic *cannot* read your SSH keys, browser profiles, or `/etc/shadow`.'

composite_rules:
  - id: package-identity
    desc: netwatch-tui Cargo package identity
    all:
      - id: cargo-package-name
      - id: cargo-repository
