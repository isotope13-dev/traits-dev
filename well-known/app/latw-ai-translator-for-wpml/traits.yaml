# LATW AI Translator for WPML — WordPress plugin for LLM-assisted translation.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: latw-plugin-header
    desc: LATW AI Translator for WPML plugin header
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*LATW AI Translator for WPML\s*$'

  - id: latw-text-domain
    desc: LATW AI Translator text domain marker
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*latw-ai-translator-for-wpml\s*$'

  - id: latwaitr-class-prefix
    desc: LATWAITR plugin class namespace
    crit: notable
    if:
      type: text
      substr: LATWAITR_

composite_rules:
  - id: latw-ai-translator-wpml-plugin
    desc: LATW AI Translator for WPML WordPress plugin
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: latw-plugin-header
    any:
      - id: latw-text-domain
      - id: latwaitr-class-prefix
