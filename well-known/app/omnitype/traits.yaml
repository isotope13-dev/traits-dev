# OmniType — VS Code extension for code-origin auditing (typed vs AI vs paste).
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json]
  crit: baseline
  conf: 0.98

traits:
  - id: omnitype-package-name
    desc: OmniType VS Code extension package name
    if:
      type: text
      regex: '(?i)omnitype[-_]vscode|["'']omnitype-vscode["'']'

  - id: omnitype-publisher-marker
    desc: OmniType RishavKumar publisher marker
    if:
      type: text
      substr: RishavKumar

  - id: omnitype-api-marker
    desc: OmniType backend API host marker
    if:
      type: text
      substr: api.imrishav.life

  - id: omnitype-provenance-marker
    desc: OmniType code provenance feature marker
    if:
      type: text
      regex: '(?i)code (origin|provenance) audit'

composite_rules:
  - id: omnitype-vscode-extension
    desc: OmniType code provenance VS Code extension
    crit: notable
    conf: 0.98
    all:
      - id: omnitype-publisher-marker
    any:
      - id: omnitype-package-name
      - id: omnitype-api-marker
      - id: omnitype-provenance-marker
