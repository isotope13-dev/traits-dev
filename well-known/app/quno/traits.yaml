defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 100000
  size_max: 2000000

traits:
  - id: quno-card-game-brand
    desc: QUno card-game identity string
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .text
      substr: About QUno
  - id: quno-author-credit
    desc: QUno author credit
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .text
      substr: Copyright © 2019 Roger Deetz
  - id: quno-game-resource
    desc: QUno Windows Forms game resource
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .text
      substr: WindowsApplication2.FormPlayAgainstAI.resources

composite_rules:
  - id: quno-benign-resource-game
    desc: Recognized QUno Windows card-game resource context
    crit: exception
    conf: 0.99
    all:
      - id: quno-card-game-brand
      - id: quno-author-credit
      - id: quno-game-resource
