# Kirim.Email SMTP SDK — official PHP client for kirim.email API.
defaults:
  platforms: [unix, windows]
  for: [php, archives, text]
  crit: baseline
  conf: 0.98

traits:
  - id: kirimemail-composer-name
    desc: Kirim.Email SMTP SDK composer package name
    for: [text, php]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"kirimemail/smtp-sdk"'

  - id: kirimemail-namespace
    desc: KirimEmail SMTP PHP namespace marker
    crit: notable
    for: [php]
    if:
      type: text
      substr: KirimEmail\Smtp\

  - id: kirimemail-api-endpoint
    desc: Kirim.Email SMTP API endpoint
    crit: notable
    for: [php]
    if:
      type: text
      substr: smtp-app.kirim.email

composite_rules:
  - id: kirimemail-smtp-php-sdk
    desc: Kirim.Email official SMTP PHP SDK
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: kirimemail-namespace
    any:
      - id: kirimemail-composer-name
      - id: kirimemail-api-endpoint
