# rust-analyzer — the official Rust language server VS Code extension from rust-lang.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: rust-analyzer-vsix-name
    desc: rust-analyzer VSIX archive name
    if:
      type: path
      regex: '(?i)rust-lang\.rust-analyzer'

  - id: rust-analyzer-package-name
    desc: rust-analyzer extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"rust-analyzer"'

  - id: rust-analyzer-publisher
    desc: rust-lang VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"rust-lang"'

  - id: rust-analyzer-homepage-marker
    desc: rust-analyzer official homepage marker
    if:
      type: text
      substr: rust-analyzer.github.io

  - id: rust-analyzer-lsp-marker
    desc: rust-analyzer language server runtime marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)rust-analyzer(\.exe)?["'']|ra_lsp|rustAnalyzer\.restart'

composite_rules:
  - id: rust-analyzer-vscode-extension
    desc: Official rust-analyzer VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: rust-analyzer-publisher
    any:
      - id: rust-analyzer-vsix-name
      - id: rust-analyzer-package-name
      - id: rust-analyzer-homepage-marker
      - id: rust-analyzer-lsp-marker
