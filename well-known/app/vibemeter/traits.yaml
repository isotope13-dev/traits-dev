defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript, markdown]
  crit: notable
  conf: 0.99
# Vibemeter is a local-first dashboard for coding-agent session data. Its
# local file reads and explicit account/service controls are product behavior,
# not evidence of covert collection.
traits:
  - id: package-name
    desc: Vibemeter npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@hirra/vibemeter'

  - id: upstream-repository
    desc: Vibemeter upstream GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/myhirra/Vibemeter(\.git)?/?$'

  - id: cli-product-marker
    desc: Vibemeter launch-agent product marker
    for: [javascript]
    if:
      type: text
      substr: 'com.hirra.vibemeter'

  - id: local-dashboard-marker
    desc: Vibemeter local dashboard description marker
    for: [javascript, markdown]
    if:
      type: text
      regex: 'local-first dashboard for (your )?AI coding life|data never leaves this machine'

composite_rules:
  - id: package-identity
    desc: Recognized Vibemeter npm package
    for: [package.json]
    all:
      - id: package-name
      - id: upstream-repository

  - id: cli-identity
    desc: Recognized Vibemeter local dashboard CLI
    for: [javascript]
    all:
      - id: cli-product-marker
      - id: local-dashboard-marker
