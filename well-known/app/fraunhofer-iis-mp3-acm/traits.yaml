# Fraunhofer IIS MPEG Layer-3 ACM codec (l3codec.acm / l3codecp.acm).
# Windows Audio Compression Manager codecs are PE DLLs with a .acm extension
# that export DriverProc; MSVC CRT PE self-checks and VirtualProtect are
# expected and must not be read as a renamed reflective loader.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 2097152
  crit: notable
  conf: 0.99

traits:
  - id: fraunhofer-mp3-acm-company
    desc: Fraunhofer IIS company version metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Fraunhofer Institut Integrierte Schaltungen IIS$'

  - id: fraunhofer-mp3-acm-description
    desc: MPEG Layer-3 MSACM codec description
    if:
      type: value
      path: pe.version.description
      exact: MPEG Audio Layer-3 Codec for MSACM

  - id: fraunhofer-mp3-acm-original-filename
    desc: l3codec.acm original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^l3codecp?\.acm$'

  - id: fraunhofer-mp3-acm-product
    desc: Fraunhofer IIS MP3 ACM product name
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Fraunhofer IIS MPEG Audio Layer-3 ACM codec$'

  - id: fraunhofer-mp3-acm-driverproc-export
    desc: Exports ACM DriverProc entrypoint
    if:
      type: export
      exact: DriverProc

  - id: fraunhofer-mp3-acm-pdb
    desc: Fraunhofer l3codec ACM PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[/\\])l3codecp?\.pdb$'

composite_rules:
  - id: fraunhofer-mp3-acm-identity
    desc: Fraunhofer IIS MPEG Layer-3 ACM codec identity
    crit: notable
    conf: 0.99
    all:
      - id: fraunhofer-mp3-acm-company
      - id: fraunhofer-mp3-acm-description
      - id: fraunhofer-mp3-acm-original-filename
      - id: fraunhofer-mp3-acm-product
      - id: fraunhofer-mp3-acm-driverproc-export
      - id: fraunhofer-mp3-acm-pdb
