# ovinc-client — OVINC Union API Python SDK.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: ovinc-client-wheel-name
    desc: ovinc_client Python wheel archive name
    if:
      type: path
      regex: '(?i)ovinc_client-.*\.whl$'

  - id: ovinc-client-package-name
    desc: ovinc_client Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*ovinc_client\s*$'

  - id: ovinc-client-class-marker
    desc: OVINCClient Union API client marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: OVINCClient

composite_rules:
  - id: ovinc-client-python-package
    desc: OVINC Union API Python SDK wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: ovinc-client-wheel-name
      - id: ovinc-client-package-name
      - id: ovinc-client-class-marker
