# CloakBrowser (github.com/CloakHQ/CloakBrowser): an MIT-licensed anti-detect
# Chromium distribution published to PyPI and npm as a drop-in Playwright
# replacement. Its README names the bot-defense products it is tested against
# and its launcher passes Chromium's --fingerprint-* flags, which is what the
# anti-bot composites read; package identity is what separates the shipped
# distribution from a bypass toolkit that quotes the same vendor list.
defaults:
  conf: 0.99
  platforms: [unix, windows]

traits:
  - id: cloakbrowser-package-name
    desc: CloakBrowser package identity
    crit: notable
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: cloakbrowser
  - id: cloakbrowser-project-repository
    desc: CloakBrowser project repository identity
    crit: notable
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      regex: '(?i)github\.com/CloakHQ/cloakbrowser\b'
  - id: cloakbrowser-source-tree-path
    desc: CloakBrowser source tree identity
    crit: notable
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])cloakbrowser[\\/]'

composite_rules:
  - id: cloakbrowser-package-context
    desc: Recognized CloakBrowser package context
    crit: exception
    for: [pkginfo, python, whl]
    scope: archive
    any:
      - id: cloakbrowser-package-name
      - id: cloakbrowser-source-tree-path
