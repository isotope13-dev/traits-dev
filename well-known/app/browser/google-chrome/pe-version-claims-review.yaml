defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: pe-product-name-chrome
  desc: PE ProductName claims Chrome
  crit: notable
  conf: 0.98
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.product_name
    regex: (?i)^Chrome\s*$
- id: pe-file-description-chrome-setup
  desc: PE FileDescription claims Chrome Setup
  crit: notable
  conf: 0.98
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.description
    regex: (?i)^Chrome Setup\s*$
