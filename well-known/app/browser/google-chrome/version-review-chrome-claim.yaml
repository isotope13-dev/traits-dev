# Version-resource fields are self-reported claims, not signature verification.
traits:
- id: google-chrome-product-name-claim
  platforms:
  - windows
  for:
  - pe
  - dll
  size_min: 512
  size_max: 524288000
  desc: PE ProductName claims Google Chrome
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: Google Chrome
