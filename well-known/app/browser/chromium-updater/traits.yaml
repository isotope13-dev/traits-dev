defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1048576
  size_max: 104857600

traits:
  - id: updater-setup-source-path
    desc: Chromium updater setup source path
    if:
      type: text
      exact: '..\..\chrome\updater\win\setup\win_setup.cc'
      section: rdata

  - id: chromiumbrowser-updater-product
    desc: ChromiumBrowser updater product identity
    if:
      type: value
      path: pe.version.product_name
      regex: '^ChromiumBrowser Updater \((x86|x64)\)$'

composite_rules:
  - id: chromiumbrowser-updater-binary
    desc: ChromiumBrowser updater binary identity
    all:
      - id: updater-setup-source-path
      - id: chromiumbrowser-updater-product
