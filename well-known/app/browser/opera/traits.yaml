defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 80000000
traits:
- id: installer-product-string
  desc: Opera installer product string
  if:
    type: text
    section: .rsrc
    substr: Opera Installer
- id: certificate-oprm-trailer
  desc: Opera certificate trailer marker
  if:
    type: text
    section: overlay
    # Real Opera installers append OPRM + Base64 JSON (eyJ...) or OPRZ + Base64
    # payload right after binary PKCS#7 bytes, never mid-run inside prose/padding.
    regex: (^[^A-Za-z0-9]{0,3}OPR[MZ][A-Za-z0-9+/]{16}|(^|[^A-Za-z0-9+/])OPRMeyJ[A-Za-z0-9+/=]{13})
- id: opera-auth-url
  desc: Opera account authentication URL
  crit: notable
  conf: 0.98
  platforms:
  - windows
  - unix
  for:
  - binaries
  - elf
  - pe
  - macho
  - scripts
  size_max: 524288000
  if:
    type: text
    substr: https://auth.opera.com/
- id: opera-settings-scheme
  desc: Opera browser settings URI scheme
  crit: notable
  conf: 0.98
  platforms:
  - windows
  - unix
  for:
  - binaries
  - elf
  - pe
  - macho
  - scripts
  size_max: 524288000
  if:
    type: text
    substr: opera://settings
composite_rules:
- id: official-installer-image
  desc: Official Opera installer image
  crit: notable
  conf: 0.99
  all:
  - id: installer-product-string
  - id: certificate-oprm-trailer
- id: opera-browser-main
  desc: Opera browser main executable
  crit: notable
  conf: 0.99
  platforms:
  - windows
  - unix
  for:
  - binaries
  - elf
  - pe
  - macho
  size_max: 524288000
  any:
  - id: opera-auth-url
  - id: opera-settings-scheme
