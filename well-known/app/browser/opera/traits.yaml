# Opera's Windows setup is a UPX image signed by Opera Norway AS. After the
# PKCS#7 blob, inside the certificate table, the installer appends an `OPRM`
# marker and a base64 JSON blob (download country, installer name, product).
# That tail is excluded from the Authenticode hash. cleave reports it as
# unsigned trailing bytes and `signature_integrity: tampered` even when the
# recomputed SHA-256 equals the signed digest.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 80000000

traits:
  - id: installer-product-string
    desc: Opera installer product string
    if:
      type: text
      section: .rsrc
      substr: "Opera Installer"

  - id: certificate-oprm-trailer
    desc: Opera certificate trailer marker
    if:
      type: text
      section: overlay
      regex: 'OPR[MZ][A-Za-z0-9+/=]{16}'

  - id: opera-auth-url
    desc: Opera account authentication URL
    crit: notable
    conf: 0.98
    platforms: [windows, unix]
    for: [binaries, elf, pe, macho, scripts]
    size_max: 524288000
    if:
      type: text
      substr: "https://auth.opera.com/"

  - id: opera-settings-scheme
    desc: Opera browser settings URI scheme
    crit: notable
    conf: 0.98
    platforms: [windows, unix]
    for: [binaries, elf, pe, macho, scripts]
    size_max: 524288000
    if:
      type: text
      substr: "opera://settings"

composite_rules:
  - id: official-installer-image
    desc: Official Opera installer image
    crit: notable
    conf: 0.99
    all:
      - id: installer-product-string
      - id: certificate-oprm-trailer

  # Installers signed by Opera Norway AS whose image hash still matches the
  # signed digest carry the Opera installer identity under the signer's key.
  # Copied-certificate reuse fails the digest leg, so this context only
  # holds for images Opera actually signed.
  - id: verified-opera-installer
    desc: Digest-verified Opera Norway installer
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signed/leaf::opera-norway-as
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
      - id: installer-product-string

  - id: opera-browser-main
    desc: Opera browser main executable
    crit: notable
    conf: 0.99
    platforms: [windows, unix]
    for: [binaries, elf, pe, macho]
    size_max: 524288000
    any:
      - id: opera-auth-url
      - id: opera-settings-scheme
