defaults:
  size_min: 1
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: component
  conf: 0.4
traits:
- id: opera-name-other
  desc: References Opera GX, Stable, or Browser
  if:
    type: text
    regex: Opera\s+(GX|Stable|Browser)
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
