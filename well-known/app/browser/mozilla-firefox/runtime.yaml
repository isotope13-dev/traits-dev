defaults:
  platforms: [unix, windows]
  for: [apk, binaries, source, scripts, manifests, data, documents, media, javascript, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: firefox-runtime-tree-path
    desc: Firefox runtime package or source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])firefox[\\/]'

  - id: firefox-doh-module
    desc: Firefox DoH controller module
    for: [javascript]
    if:
      type: basename
      exact: DoHController.sys.mjs

  - id: firefox-doh-module-marker
    desc: Firefox DoH controller marker
    for: [javascript]
    if:
      type: text
      substr: DoHController

  - id: firefox-webdriver-actions-module
    desc: Firefox WebDriver actions module
    for: [javascript]
    if:
      type: basename
      exact: Actions.sys.mjs

  - id: firefox-webdriver-actions-marker
    desc: Firefox WebDriver pause action marker
    for: [javascript]
    if:
      type: text
      substr: PauseAction

  - id: firefox-onnx-module
    desc: Firefox ONNX pipeline module
    for: [javascript]
    if:
      type: basename
      exact: ONNXPipeline.mjs

  - id: firefox-onnx-module-marker
    desc: Firefox ONNX pipeline marker
    for: [javascript]
    if:
      type: text
      substr: ensurePipelineIsReady

  - id: firefox-chrome-migrator-marker
    desc: Firefox Chrome password migration marker
    for: [javascript]
    if:
      type: text
      substr: Chrome passwords

  - id: firefox-chrome-migrator-path
    desc: Firefox Chrome migrator module path
    for: [javascript]
    if:
      type: path
      regex: '(^|[\\/])ChromeProfileMigrator\.sys\.mjs$'

  - id: firefox-ai-tab-group-module
    desc: Firefox AI tab group module
    for: [javascript]
    if:
      type: basename
      exact: tabgroup-menu.js

  - id: firefox-ai-tab-group-marker
    desc: Firefox AI tab group marker
    for: [javascript]
    if:
      type: text
      substr: CREATE_AI_INITIAL

  - id: firefox-ai-sidebar-module
    desc: Firefox AI sidebar stylesheet
    for: [text]
    if:
      type: basename
      exact: aiWindowSidebar.css

  - id: firefox-ai-sidebar-marker
    desc: Firefox AI sidebar marker
    for: [text]
    if:
      type: text
      substr: hide-ai-sidebar

composite_rules:
  - id: firefox-doh-source-context
    desc: Firefox DoH controller source context
    crit: exception
    conf: 0.99
    all:
      - id: firefox-doh-module
      - id: firefox-doh-module-marker

  - id: firefox-webdriver-source-context
    desc: Firefox WebDriver source context
    crit: exception
    conf: 0.99
    all:
      - id: firefox-webdriver-actions-module
      - id: firefox-webdriver-actions-marker

  - id: firefox-onnx-source-context
    desc: Firefox ONNX source context
    crit: exception
    conf: 0.99
    all:
      - id: firefox-onnx-module
      - id: firefox-onnx-module-marker

  - id: firefox-chrome-migrator-context
    desc: Firefox Chrome migrator source context
    crit: exception
    conf: 0.99
    all:
      - id: firefox-chrome-migrator-path
      - id: firefox-chrome-migrator-marker

  - id: firefox-ai-tab-group-context
    desc: Firefox AI tab group source context
    crit: exception
    conf: 0.99
    all:
      - id: firefox-ai-tab-group-module
      - id: firefox-ai-tab-group-marker

  - id: firefox-ai-sidebar-context
    desc: Firefox AI sidebar source context
    crit: exception
    conf: 0.99
    all:
      - id: firefox-ai-sidebar-module
      - id: firefox-ai-sidebar-marker

  - id: firefox-known-source-module-context
    desc: Recognized Firefox source module context
    crit: exception
    conf: 0.99
    any:
      - id: firefox-doh-source-context
      - id: firefox-webdriver-source-context
      - id: firefox-onnx-source-context
      - id: firefox-chrome-migrator-context
      - id: firefox-ai-tab-group-context
      - id: firefox-ai-sidebar-context
