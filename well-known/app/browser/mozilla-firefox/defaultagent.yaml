defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: defaultagent-rust-crate
    desc: Mozilla DefaultAgent Rust crate path
    crit: notable
    conf: 0.97
    size_min: 19
    if:
      type: text
      substr: defaultagent_static
      section: rdata
  - id: defaultagent-viaduct-wininet
    desc: DefaultAgent viaduct_wininet crate path
    crit: notable
    conf: 0.96
    size_min: 15
    if:
      type: text
      substr: viaduct_wininet
      section: rdata
  - id: defaultagent-user-agent-template
    desc: Mozilla DefaultAgent WinINet UA template
    crit: notable
    conf: 0.95
    size_min: 16
    if:
      type: text
      substr: DefaultAgent/1.0
      section: rdata
composite_rules:
  - id: defaultagent-jdk-wix-embedded-pe-context
    desc: DefaultAgent, JDK and WiX embedded PE clues
    crit: notable
    conf: 0.99
    all:
      - id: defaultagent-rust-crate
      - id: metadata/binary/debug::jdk-8u321-javaw-pdb
      - id: metadata/binary/debug::wix-burn-pdb-path
      - id: metadata/binary/layout/embedded::embedded-pe-multi
  - id: unsigned-defaultagent-context
    desc: Unsigned PE with DefaultAgent references
    crit: notable
    conf: 0.95
    all:
      - id: defaultagent-rust-crate
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: defaultagent-viaduct-wininet
      - id: defaultagent-user-agent-template
  - id: defaultagent-sparse-import-embedded-pe-context
    desc: DefaultAgent with few imports and embedded PEs
    crit: notable
    conf: 0.96
    all:
      - id: defaultagent-rust-crate
      - id: metadata/binary/symbols/imports::few-import-count
      - id: metadata/binary/layout/embedded::embedded-pe-multi
