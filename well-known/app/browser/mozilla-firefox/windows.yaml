defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 400000000

traits:
  - id: firefox-product-name
    desc: Firefox product name in PE version
    if:
      type: value
      path: pe.version.product_name
      exact: Firefox

  - id: firefox-runtime-archive-path
    desc: Firefox omni runtime archive path
    for: [data, zip]
    if:
      type: path
      regex: '(?i)[\\/]Firefox(64)?[\\/]omni\.ja$'

  # Reconstructed or truncated PE images may retain version-resource strings
  # while no longer exposing the corresponding structured pe.version fields.
  # Keep these atoms inert until the SFX identity composite consumes both.
  - id: firefox-resource-product-marker
    desc: Firefox product resource marker
    crit: component
    if:
      type: text
      exact: Firefox
      section: .rsrc

  - id: mozilla-resource-company-marker
    desc: Mozilla company resource marker
    crit: component
    if:
      type: text
      exact: Mozilla
      section: .rsrc

composite_rules:
  - id: firefox-signed-component
    desc: Mozilla-signed Firefox component
    all:
      - id: firefox-product-name
      - id: metadata/signed/platform::mozilla

  - id: firefox-xul-runtime
    desc: Mozilla-signed Firefox XUL runtime
    all:
      - id: firefox-signed-component
      - id: well-known/lib/runtime/mozilla-xul::xul-original-filename

  - id: firefox-7zip-sfx-stub
    desc: Mozilla-branded Firefox 7-Zip SFX stub
    crit: notable
    conf: 0.99
    all:
      - id: firefox-resource-product-marker
      - id: mozilla-resource-company-marker
      - id: metadata/binary/installer/sfx::7zip-sfx-resource-profile
