# Mozilla Firefox HTTP Cache2 entries:
# Firefox caches HTTP responses on disk (e.g. in cache2/entries/<hash>).
# When caching a downloaded Windows executable, the file begins with the
# intact PE payload, followed by Necko Cache2 metadata in the trailing overlay.
# The metadata records HTTP headers, request URLs, and Necko timing metrics,
# ending with an 8-byte footer containing the CacheFile format version and
# the big-endian byte offset of the metadata chunk.
# On an Authenticode-signed PE, this appended cache trailer sits past the
# certificate table and changes the whole-file Authentihash without altering
# the signed PE image.

defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 500000000

traits:
  - id: firefox-cache2-trailer-version
    desc: Firefox Cache2 trailer format version marker
    if:
      type: hex
      pattern: "00 00 00 (01|02|03|04)"
      offset: -8

  - id: firefox-cache2-net-response-time-marker
    desc: Firefox Cache2 network response timing metadata
    if:
      type: text
      section: overlay
      substr: "net-response-time-"

  - id: firefox-cache2-response-head-marker
    desc: Firefox Cache2 response-head metadata marker
    if:
      type: text
      section: overlay
      substr: "response-head"

  - id: firefox-cache2-request-method-marker
    desc: Firefox Cache2 request-method metadata marker
    if:
      type: text
      section: overlay
      substr: "request-method"

  - id: firefox-cache2-spdy-header
    desc: Firefox Cache2 SPDY/HTTP2 protocol marker
    if:
      type: text
      section: overlay
      substr: "X-Firefox-Spdy:"

  - id: firefox-cache2-partition-key-marker
    desc: Firefox Cache2 partitioned cache key marker
    if:
      type: text
      section: overlay
      substr: "partitionKey="

composite_rules:
  - id: firefox-cache2-entry-context
    desc: Firefox Cache2 entry with appended cache metadata
    crit: exception
    conf: 0.99
    all:
      - id: firefox-cache2-trailer-version
    any:
      - id: firefox-cache2-net-response-time-marker
      - id: firefox-cache2-response-head-marker
      - id: firefox-cache2-request-method-marker
      - id: firefox-cache2-spdy-header
      - id: firefox-cache2-partition-key-marker
    needs: 2
