# Nova Browser (github.com/Novaturiente/nova-browser): an open-source keyboard-driven
# web browser built on Chromium Embedded Framework (CEF) and inspired by qutebrowser.
# Provides a CLI `--import` command (in src/import.rs) to migrate bookmarks and history
# from Firefox (places.sqlite/moz_places), Chromium, and qutebrowser profiles.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: nova-browser-source-path
    desc: Nova Browser source tree path
    for: [rust, source]
    if:
      type: path
      regex: '(?i)nova-browser-[0-9]'

  - id: novabrowser-import-cli-help
    desc: Nova Browser import CLI command description
    for: [rust, source, elf, markdown, text]
    size_max: 50000000
    if:
      type: text
      substr: 'novabrowser --import'

  - id: novabrowser-package-archive-name
    desc: Nova Browser release package archive filename
    crit: notable
    conf: 0.98
    for: [tar]
    size_max: 200000000
    if:
      type: path
      basename: true
      regex: '^novabrowser-[0-9]+\.[0-9]+.*\.tar\.(zst|xz|gz)$'

  - id: novabrowser-desktop-entry
    desc: Nova Browser desktop application entry
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [desktop_entry]
    size_max: 10000
    if:
      type: value
      path: desktop_entry.exec
      substr: novabrowser

  - id: novabrowser-manifest-name
    desc: Nova Browser Cargo package name
    for: [cargo.toml]
    if:
      type: text
      substr: 'name = "novabrowser"'

composite_rules:
  - id: nova-browser-context
    desc: Recognized Nova Browser source or package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: nova-browser-source-path
      - id: novabrowser-import-cli-help
      - id: novabrowser-package-archive-name
      - id: novabrowser-desktop-entry
      - id: novabrowser-manifest-name
