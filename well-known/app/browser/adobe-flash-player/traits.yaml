defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 20000000

traits:
  - id: adobe-flash-player-pdb
    desc: Adobe Flash Player debug database name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: FlashPlayer.pdb
      section: .rdata

  - id: adobe-flash-player-runtime-identity
    desc: Adobe Flash Player runtime identity string
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Adobe Flash Player (%s|[0-9]+(\.[0-9]+)?)'
      section: .rdata

composite_rules:
  - id: adobe-flash-player-runtime
    desc: Adobe Flash Player runtime
    crit: notable
    conf: 0.99
    all:
      - id: adobe-flash-player-pdb
      - id: adobe-flash-player-runtime-identity
