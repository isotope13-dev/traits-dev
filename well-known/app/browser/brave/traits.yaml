defaults:
  crit: notable
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 5000000
composite_rules:
- id: brave-update-sideload-candidate
  desc: BraveUpdate.exe - benign binary often abused for DLL side-loading
  crit: notable
  conf: 0.95
  attack: T1574.002
  size_min: 290000
  size_max: 300000
  all:
  - id: brave-crash-handler-pdb
  - id: brave-update-filename
  any:
  - id: metadata/signature/verified/signer::brave-software-inc.
  - id: metadata/signature/unverified/signer::brave-software-inc.
  - id: metadata/signature/self-signed/signer::brave-software-inc.
  - id: metadata/signature/invalid/tampered/signer::brave-software-inc.
  - id: metadata/signature/invalid/bad-signature/signer::brave-software-inc.
  # Mirrors the Google Chrome browser-context exception: the main binary
  # (ProductName Brave Browser, Brave leaf signer) legitimately holds the
  # Chromium sandbox primitives (section unmap, remote-thread startup) that
  # hollowing/injection composites otherwise convict.
- id: brave-browser-context
  desc: Verified Brave browser main binary
  crit: notable
  conf: 0.99
  all:
  - id: brave-browser-product-name
  any:
  - id: metadata/signature/verified/signer::brave-software-inc.
  - id: metadata/signature/unverified/signer::brave-software-inc.
  - id: metadata/signature/self-signed/signer::brave-software-inc.
  - id: metadata/signature/invalid/tampered/signer::brave-software-inc.
  - id: metadata/signature/invalid/bad-signature/signer::brave-software-inc.
# Exception form of the context above, for unless:. Brave's Chromium sandbox
# holds the section-unmap and PE-header-check primitives that loader composites
# convict. Unlike the context above it needs an intact Authenticode digest, so
# a Brave signature blob copied onto a modified binary does not qualify.
- id: brave-signed-browser-binary-context
  desc: Intact Brave-signed browser main binary
  crit: exception
  conf: 0.98
  all:
  - id: brave-browser-product-name
  - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
  - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
  any:
  - id: metadata/signature/verified/signer::brave-software-inc.
  - id: metadata/signature/unverified/signer::brave-software-inc.
traits:
- id: brave-update-setup-name
  desc: References the BraveUpdateSetup installer name
  crit: notable
  conf: 0.95
  size_min: 32768
  if:
    type: text
    substr: BraveUpdateSetup.exe
    section: ".rdata"
- id: brave-browser-product-name
  desc: PE ProductName Brave Browser
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: 'Brave Browser'
- id: brave-crash-handler-pdb
  desc: PDB path for Brave Crash Handler
  crit: notable
  conf: 1.0
  size_min: 290000
  size_max: 300000
  if:
    type: text
    substr: BraveCrashHandler_unsigned.pdb
    section: ".rdata"
- id: brave-update-filename
  desc: Original filename is BraveUpdate.exe
  crit: notable
  conf: 1.0
  size_min: 290000
  size_max: 300000
  if:
    type: value
    path: pe.version.original_filename
    exact: BraveUpdate.exe
