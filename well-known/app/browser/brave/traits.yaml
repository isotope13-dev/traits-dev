defaults:
  crit: notable
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 5000000
composite_rules:
- id: brave-update-sideload-candidate
  desc: BraveUpdate.exe - benign binary often abused for DLL side-loading
  crit: notable
  conf: 0.95
  attack: T1574.002
  size_min: 290000
  size_max: 300000
  all:
  - id: metadata/signed/leaf::brave-software-inc.
  - id: brave-crash-handler-pdb
  - id: brave-update-filename
  # Mirrors the Google Chrome browser-context exception: the main binary
  # (ProductName Brave Browser, Brave leaf signer) legitimately holds the
  # Chromium sandbox primitives (section unmap, remote-thread startup) that
  # hollowing/injection composites otherwise convict.
- id: brave-browser-context
  desc: Verified Brave browser main binary
  crit: exception
  conf: 0.99
  all:
  - id: brave-browser-product-name
  any:
  - id: metadata/signed/leaf::brave-software-inc.
traits:
- id: brave-browser-product-name
  desc: PE ProductName Brave Browser
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: 'Brave Browser'
- id: brave-crash-handler-pdb
  desc: PDB path for Brave Crash Handler
  crit: notable
  conf: 1.0
  size_min: 290000
  size_max: 300000
  if:
    type: text
    substr: BraveCrashHandler_unsigned.pdb
    section: ".rdata"
- id: brave-update-filename
  desc: Original filename is BraveUpdate.exe
  crit: notable
  conf: 1.0
  size_min: 290000
  size_max: 300000
  if:
    type: value
    path: pe.version.original_filename
    exact: BraveUpdate.exe
