defaults:
  conf: 0.99
  platforms:
  - unix
  - windows
traits:
- id: package-name
  desc: browser-tools package identity
  crit: notable
  for:
  - pkginfo
  if:
    type: value
    path: name
    exact: browser-tools
- id: project-repository
  desc: browser-tools project repository identity
  crit: notable
  for:
  - pkginfo
  if:
    type: value
    path: project-url[*]
    substr: github.com/dungle-scrubs/browser-tools
- id: package-path
  desc: browser-tools wheel or package path
  crit: notable
  for:
  - python
  - whl
  - pkginfo
  if:
    type: path
    regex: (?i)(^|[\\/])browser[-_]tools(-[0-9]|[\\/])
composite_rules:
- id: package-metadata-context
  desc: browser-tools package metadata identity
  crit: notable
  for:
  - pkginfo
  all:
  - id: package-name
  - id: project-repository
