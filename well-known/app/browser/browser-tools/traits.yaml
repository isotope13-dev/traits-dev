# browser-tools (github.com/dungle-scrubs/browser-tools): Browser automation,
# debugging, and anti-detect browsing CLI over CDP and Camoufox.
# Its README documents challenge/bot detection across multiple vendors and
# its lifecycle manager migrates browser profiles (checking Login Data files).
defaults:
  conf: 0.99
  platforms: [unix, windows]

traits:
  - id: package-name
    desc: browser-tools package identity
    crit: notable
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: browser-tools

  - id: project-repository
    desc: browser-tools project repository identity
    crit: notable
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: github.com/dungle-scrubs/browser-tools

  - id: package-path
    desc: browser-tools wheel or package path
    crit: notable
    for: [python, whl, pkginfo]
    if:
      type: path
      regex: '(?i)(^|[\\/])browser[-_]tools(-[0-9]|[\\/])'

composite_rules:
  - id: package-metadata-context
    desc: browser-tools package metadata identity
    crit: notable
    for: [pkginfo]
    all:
      - id: package-name
      - id: project-repository

  - id: browser-tools-package-context
    desc: Recognized browser-tools package context
    crit: exception
    for: [pkginfo, python, whl]
    conf: 0.99
    scope: outer
    any:
      - id: package-path
      - id: package-metadata-context
