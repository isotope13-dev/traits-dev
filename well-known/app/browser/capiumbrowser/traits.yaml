# Capium Browser (capiumbrowser.com): a commercial stealth Chromium distribution
# and SDK published to PyPI as a drop-in Playwright replacement. Its README names
# the bot-defense products it is tested against and its launcher passes
# Chromium's --fingerprint-* flags; package identity is what separates the shipped
# distribution from an evasion toolkit.
defaults:
  conf: 0.99
  platforms: [unix, windows]

traits:
  - id: capiumbrowser-package-name
    desc: Capium Browser package identity
    crit: notable
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: capiumbrowser
  - id: capiumbrowser-project-homepage
    desc: Capium Browser project homepage identity
    crit: notable
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      regex: '(?i)capiumbrowser\.com\b'
  - id: capiumbrowser-source-tree-path
    desc: Capium Browser source tree identity
    crit: notable
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])capiumbrowser[\\/]'

composite_rules:
  - id: capiumbrowser-package-context
    desc: Recognized Capium Browser package context
    crit: exception
    for: [pkginfo, python, whl]
    scope: archive
    any:
      - id: capiumbrowser-package-name
      - id: capiumbrowser-source-tree-path
