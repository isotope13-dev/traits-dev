defaults:
  platforms: [linux, windows]
  for: [shell, tar, deb, elf]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: microsoft-edge-package-context
    desc: Microsoft Edge package path context
    if:
      type: path
      regex: '(?i)microsoft-edge-stable'

  - id: lnk-icon-location
    desc: LNK icon location references Microsoft Edge
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [lnk]
    if:
      type: value
      path: lnk.icon_location
      regex: '(?i)msedge\.exe$'
