defaults:
  platforms: [linux, windows]
  for: [shell, tar, deb, elf]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: msedgewebview2-exe-name
    desc: Microsoft Edge WebView2 host executable
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [pe, dll, rust, scripts, javascript, typescript, csharp]
    if:
      type: text
      word: msedgewebview2.exe
      case_insensitive: true

  - id: microsoft-edge-package-context
    desc: Microsoft Edge package path context
    if:
      type: path
      regex: '(?i)microsoft-edge-stable'

  # The WebView2/msedge.dll this package redistributes is Microsoft-signed
  # with an intact digest: the signer below plus digest-matches proves
  # Microsoft built the bytes, so stealer/loader/killer composites that
  # assemble Chromium's own capabilities (sandbox process APIs, App-Bound
  # Encryption, AV inventory, IWA platform support) misfire on it.
  - id: edge-authenticode-signer
    desc: Microsoft Corporation Authenticode signer
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)^CN=Microsoft Corporation(,|$)'

composite_rules:
  - id: edge-runtime-binary-context
    desc: Genuine Microsoft-signed Edge runtime binary
    crit: exception
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/file/string/application-name::microsoft-edge-name
      - id: edge-authenticode-signer
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
