defaults:
  platforms: [unix]
  for: [elf, so]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 200000000

traits:
  - id: palemoon-netbsd-runtime-rpath
    desc: Pale Moon NetBSD runtime library path
    if:
      type: value
      path: elf.rpath
      regex: '^/usr/pkg/lib:/usr/pkg/lib/ffmpeg[0-9]+:/usr/X11R7/lib:/usr/pkg/lib/palemoon-[0-9][0-9.]*$'
