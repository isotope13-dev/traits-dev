# WrapSec — AI security gateway that inspects LLM prompts/responses
# (ALLOW/BLOCK/SANITIZE). Guarddog "keylogging"/"exfil" signals are detection
# rules and load-test monitors, not attacker behaviors.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, markdown, text, shell]
  crit: notable
  conf: 0.98

traits:
  - id: wrapsec-spdx-header
    desc: WrapSec SPDX copyright header
    for: [python, javascript, text]
    if:
      type: text
      substr: 'WrapSec v1.0 | AI Security Gateway'
  - id: wrapsec-product-url
    desc: WrapSec product site URL
    if:
      type: text
      substr: 'https://wrapsec.com'
  - id: wrapsec-docker-postgres
    desc: WrapSec Postgres docker container name
    for: [python, shell, text]
    if:
      type: text
      substr: 'wrapsec_postgres'
  - id: wrapsec-readme-title
    desc: WrapSec README title heading
    for: [markdown, text]
    if:
      type: text
      substr: '<h1 align="center">WrapSec</h1>'
