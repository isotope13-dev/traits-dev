# Blazen — Zach Handley's AGPL Rust/Python AI workflow engine wheel.
defaults:
  platforms: [unix]
  for: [python, macho, whl, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: Blazen wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: blazen

  - id: package-name
    desc: Blazen package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: blazen

  - id: author-marker
    desc: Blazen author metadata marker
    for: [pkginfo]
    if:
      type: text
      substr: Zach Handley

  - id: extension-module
    desc: Blazen PyO3 extension module basename
    for: [macho]
    if:
      type: basename
      regex: '^blazen\.cpython-'

  - id: workflow-engine-marker
    desc: Blazen workflow engine summary marker
    for: [pkginfo, python]
    if:
      type: text
      regex: '(?i)Blazen workflow engine|Event-driven AI workflow engine'

composite_rules:
  - id: blazen-python-wheel
    desc: Blazen Rust/Python AI workflow engine wheel
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives, whl]
    all:
      - id: wheel-distribution
    any:
      - id: package-name
      - id: author-marker
      - id: extension-module
      - id: workflow-engine-marker
