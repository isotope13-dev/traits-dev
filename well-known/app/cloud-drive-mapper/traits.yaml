# Cloud Drive Mapper's MSI carries the normal Advanced Installer helper set.
# Keep this identity tied to the package metadata rather than its filename so
# the benign installer context cannot suppress unrelated MSI detections.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: msi-application
    desc: Cloud Drive Mapper MSI application metadata
    if:
      type: value
      path: office.application
      exact: Cloud Drive Mapper

  - id: msi-creator
    desc: IAM Technology Group MSI creator metadata
    if:
      type: value
      path: office.creator
      exact: IAM Technology Group Limited

  - id: msi-subject
    desc: Cloud Drive Mapper MSI subject metadata
    if:
      type: value
      path: office.subject
      exact: Cloud Drive Mapper

composite_rules:
  - id: cloud-drive-mapper-msi-context
    desc: Cloud Drive Mapper benign MSI context
    crit: exception
    conf: 0.99
    all:
      - id: msi-application
      - id: msi-creator
      - id: msi-subject
