defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: baseline
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: slack-app-context
    desc: Slack macOS Electron app.asar context
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^(52[.]bundle[.]cjs|main[.]bundle[.]cjs)$'
