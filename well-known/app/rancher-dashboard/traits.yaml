# Rancher Dashboard is SUSE/Rancher's official Kubernetes cluster management UI.
defaults:
  platforms: [linux]
  for: [javascript, apk, archives]
  crit: notable
  conf: 0.99

traits:
  - id: ui-dashboard-install-path
    desc: Rancher UI dashboard install path
    if:
      type: text
      substr: /usr/share/rancher/ui-dashboard

  - id: alpine-package-name
    desc: Rancher Dashboard Alpine package name
    for: [apk, archives]
    if:
      type: text
      regex: '(?i)rancher-dashboard'

  - id: product-title
    desc: Rancher Dashboard product title
    for: [javascript, html]
    if:
      type: text
      regex: '(?i)Rancher.{0,40}Dashboard'

composite_rules:
  - id: rancher-dashboard-context
    desc: Recognized Rancher Kubernetes dashboard UI
    crit: exception
    conf: 0.99
    any:
      - id: ui-dashboard-install-path
      - id: alpine-package-name
