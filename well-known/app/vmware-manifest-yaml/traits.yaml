# VMware Cloud Foundry manifest.yml VS Code language extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: vmware-manifest-yaml-package
    desc: VMware manifest YAML VS Code package name
    if:
      type: value
      path: name
      exact: vscode-manifest-yaml

  - id: vmware-publisher
    desc: VMware VS Code extension publisher
    if:
      type: value
      path: publisher
      exact: vmware

  - id: cloudfoundry-manifest-language
    desc: Cloud Foundry manifest language contribution
    if:
      type: text
      substr: '"id": "manifest-yaml"'

composite_rules:
  - id: vmware-manifest-yaml-extension-context
    desc: VMware Cloud Foundry manifest YAML extension
    crit: notable
    all:
      - id: vmware-manifest-yaml-package
      - id: vmware-publisher
