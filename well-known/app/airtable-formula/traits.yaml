# airtable-formula — Nskha Airtable formula editor and MCP extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: airtable-formula-vsix-name
    desc: Airtable Formula VSIX archive name
    if:
      type: path
      regex: '(?i)Nskha\.airtable-formula'

  - id: airtable-formula-package-name
    desc: Airtable Formula extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"airtable-formula"'

  - id: airtable-formula-publisher
    desc: Nskha VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"Nskha"'

  - id: airtable-formula-command-namespace
    desc: Airtable Formula command namespace
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: airtable-formula.

composite_rules:
  - id: airtable-formula-vscode-extension
    desc: Nskha Airtable Formula VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: airtable-formula-publisher
    any:
      - id: airtable-formula-vsix-name
      - id: airtable-formula-package-name
      - id: airtable-formula-command-namespace
