# rxfoundry Swifty API — OpenAPI-generated RxFoundry pharmacy client SDK.
defaults:
  platforms: [unix, windows]
  for: [python, text, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: swifty-api-wheel-name
    desc: RxFoundry Swifty API Python wheel name
    if:
      type: path
      regex: '(?i)rxfoundry.*swifty.*\.whl$'

  - id: swifty-api-package-name
    desc: rxfoundry.clients.swifty-api distribution name
    for: [text, python]
    if:
      type: text
      regex: '(?m)^Name:\s*rxfoundry\.clients\.swifty-api\s*$'

  - id: swifty-api-module-path
    desc: rxfoundry Swifty API Python module path
    crit: notable
    for: [python]
    if:
      type: text
      substr: rxfoundry.clients.swifty_api

composite_rules:
  - id: rxfoundry-swifty-api-sdk
    desc: RxFoundry SwiftyRX OpenAPI Python client SDK
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: swifty-api-module-path
    any:
      - id: swifty-api-wheel-name
      - id: swifty-api-package-name
