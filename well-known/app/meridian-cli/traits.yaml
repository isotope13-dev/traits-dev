# meridian-cli — meridian-flow multi-harness AI agent orchestration CLI.
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, json, archives]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: meridian-cli-wheel-name
    desc: meridian-cli Python wheel name
    if:
      type: path
      regex: '(?i)meridian_cli-.*\.whl'

  - id: meridian-cli-package-name
    desc: meridian-cli Python distribution name
    if:
      type: text
      regex: '(?i)^Name:\s*meridian-cli\s*$'

  - id: meridian-cli-repository
    desc: meridian-flow meridian-cli repository marker
    if:
      type: text
      substr: github.com/meridian-flow/meridian-cli

  - id: meridian-mars-agents-marker
    desc: meridian-cli mars-agents dependency marker
    for: [python, text, json]
    crit: notable
    if:
      type: text
      substr: mars-agents

composite_rules:
  - id: meridian-cli-python-package
    desc: Meridian multi-model agent orchestration CLI
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: meridian-cli-wheel-name
      - id: meridian-cli-package-name
      - id: meridian-cli-repository
      - id: meridian-mars-agents-marker
