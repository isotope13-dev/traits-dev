# VASProcar: DFT VASP/QE post-processing toolkit (scientific Python).
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown]
  crit: notable
  conf: 0.96

traits:
  - id: pypi-package-name
    desc: vasprocar_dev PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: vasprocar_dev

  - id: vasprocar-product-name
    desc: VASProcar product name marker
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bVASProcar\b'

  - id: zenodo-doi
    desc: VASProcar Zenodo DOI reference
    conf: 0.99
    if:
      type: text
      substr: '10.5281/zenodo.6343960'

  - id: samba-ilum-module-run
    desc: Runs samba_ilum Python module via subprocess
    for: [python]
    conf: 0.97
    if:
      type: text
      regex: 'subprocess\.(run|Popen|call)\(\s*\[[^\]]{0,120}["'']samba_ilum["'']'

composite_rules:
  - id: vasprocar-identity
    desc: VASProcar DFT post-processing toolkit
    conf: 0.97
    any:
      - id: pypi-package-name
      - id: zenodo-doi
      - id: vasprocar-product-name
