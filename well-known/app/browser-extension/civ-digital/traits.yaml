# CIV Digital Conector — Chrome extension that copies the pilot's SACI
# (ANAC) session cookies to the CIV Digital logbook API after pairing.
# Declared host permissions and the user's Conectar action; not a stealth
# cookie stealer.
defaults:
  platforms: [unix, windows]
  for: [javascript, chrome-manifest, crx, archives]
  crit: notable
  conf: 0.99

traits:
  - id: extension-display-name
    desc: CIV Digital Conector Chrome extension name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: CIV Digital Conector

  - id: saci-session-endpoint
    desc: CIV Digital SACI session upload path
    for: [javascript]
    if:
      type: text
      substr: /api/saci-session

  - id: extension-description
    desc: CIV Digital extension description
    for: [chrome-manifest]
    if:
      type: value
      path: description
      exact: 'Conecta o seu login do SACI ao CIV Digital para lançar suas horas de voo — direto no navegador, sem instalar app.'

  - id: civ-panel-host-permission
    desc: CIV Digital panel host permission
    for: [chrome-manifest]
    if:
      type: value
      path: host_permissions
      regex: 'https://www\.civdigital\.com\.br/\*'

composite_rules:
  - id: disclosed-manifest-context
    desc: Disclosed CIV Digital extension manifest
    crit: exception
    conf: 0.98
    all:
      - id: extension-display-name
      - id: extension-description
      - id: civ-panel-host-permission

  - id: disclosed-session-cookie-transfer
    desc: CIV Digital integration transfers SACI session cookies
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [crx, zip, archives]
    all:
      - id: extension-display-name
      - id: saci-session-endpoint
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: metadata/permission/cookie::permission-cookies
      - id: objectives/credential-access/browser/extension::extension-auth-cookie-upload-body
