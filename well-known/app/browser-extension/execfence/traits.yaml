# ExecFence -- defensive browser extension that warns users before executing
# paste-and-run scams (ClickFix). It inspects web page DOM and clipboard contents
# for deceptive lures and command injection patterns, quoting patterns like
# `iex (irm ...)` and `FromBase64String` inside its detection rules.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: extension-id
    desc: ExecFence extension gecko ID
    if:
      type: text
      word: execfence@execfence.com

  - id: extension-name
    desc: ExecFence extension name
    if:
      type: text
      substr: 'ExecFence — stop paste-and-run scams'

  - id: overlay-host-identifier
    desc: ExecFence overlay host DOM element tag
    for: [javascript]
    if:
      type: text
      substr: execfence-overlay-host

  - id: clipboard-protocol-marker
    desc: ExecFence clipboard channel protocol marker
    for: [javascript]
    if:
      type: text
      substr: 'execfence:clip:v1'

composite_rules:
  - id: execfence-bundle-context
    for: [javascript]
    desc: ExecFence defensive content script bundle
    crit: exception
    conf: 0.99
    all:
      - id: overlay-host-identifier
      - id: clipboard-protocol-marker

  - id: execfence-extension-context
    for: [chrome-manifest, crx, xpi, zip]
    desc: ExecFence defensive browser extension
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: extension-id
      - id: extension-name
