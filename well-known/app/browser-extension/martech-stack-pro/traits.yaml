# Martech Stack Pro — Chrome Web Store auditor that classifies marketing
# pixels from webRequest URLs and page globals. Injection and cookie
# reads are stack evidence, not a steal-all implant.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: display-name
    desc: Martech Stack Pro extension name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Martech Stack Pro

  - id: extension-id
    desc: Martech Stack Pro Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: fepdlhkhmfjpmjlaehfhjommjcnckben

  - id: network-evidence-label
    desc: Martech network-API evidence citation
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: 'Verified via Network API Request:'
