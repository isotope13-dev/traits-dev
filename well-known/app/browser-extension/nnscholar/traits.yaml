# nnscholar — Chrome extension that converts natural-language queries into
# PubMed / Google Scholar / Web of Science search strategies (scholarbar.org).
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, crx]
  crit: notable
  conf: 0.98

traits:
  - id: nnscholar-manifest-name
    desc: nnscholar Chrome extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: nnscholar

  - id: nnscholar-scholarbar-api
    desc: nnscholar scholarbar.org API base URL
    for: [javascript]
    if:
      type: text
      substr: https://www.scholarbar.org

  - id: nnscholar-install-log
    desc: nnscholar install log message
    for: [javascript]
    if:
      type: text
      substr: nnscholar 已安装
