# HookVault — Manifest V3 X/Twitter swipe-file saver. storage+activeTab
# and x.com/twitter.com hosts; content-script inject is the product UI.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: HookVault Chrome extension display name
    for: [json]
    conf: 0.99
    if:
      type: text
      substr: '"message": "HookVault"'

  - id: product-title
    desc: HookVault swipe-file product title
    for: [json]
    conf: 0.98
    if:
      type: text
      substr: 'HookVault - Save X/Twitter Posts'

  - id: storage-items-key
    desc: HookVault library storage key
    for: [javascript]
    conf: 0.96
    if:
      type: text
      substr: 'hookvault.items'

  - id: tweet-inject-marker
    desc: HookVault tweet inject marker
    for: [javascript]
    conf: 0.96
    if:
      type: text
      substr: data-hookvault-injected
