defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  size_max: 120000000
traits:
  - id: manifest-name
    desc: Ronin Wallet extension manifest name
    crit: component
    conf: 0.99
    if:
      type: value
      path: name
      exact: Ronin Wallet
  - id: firefox-id
    desc: Ronin Wallet Firefox extension ID
    crit: component
    conf: 0.99
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: ronin-wallet@axieinfinity.com
composite_rules:
  - id: browser-extension
    desc: Official Ronin Wallet browser extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: firefox-id
