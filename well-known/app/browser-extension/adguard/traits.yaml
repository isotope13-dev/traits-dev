defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest, crx, archives]
  size_max: 120000000
traits:
  - id: extension
    desc: AdGuard AdBlocker extension archive
    if:
      type: path
      substr: bgnkhhnnamicmpeenaelnjfhikgbkllg.crx
  - id: author
    desc: AdGuard browser extension author
    for: [chrome-manifest]
    if:
      type: value
      path: author
      substr: Adguard Software
  - id: url-filter-engine
    desc: AdGuard tsurlfilter engine
    if:
      type: text
      substr: tsurlfilter
  - id: webextension-engine
    desc: AdGuard tswebextension engine
    if:
      type: text
      substr: tswebextension
