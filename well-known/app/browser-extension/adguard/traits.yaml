defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest, crx]
  size_max: 120000000
traits:
  - id: extension
    desc: AdGuard AdBlocker extension archive
    if:
      type: path
      substr: bgnkhhnnamicmpeenaelnjfhikgbkllg.crx
  - id: author
    desc: AdGuard browser extension author
    for: [chrome-manifest]
    if:
      type: value
      path: author
      substr: Adguard Software
  - id: url-filter-engine
    desc: AdGuard tsurlfilter engine
    for: [javascript, text, chrome-manifest]
    if:
      type: text
      substr: tsurlfilter
  - id: webextension-engine
    desc: AdGuard tswebextension engine
    for: [javascript, text, chrome-manifest]
    if:
      type: text
      substr: tswebextension
  - id: filter-list-header
    desc: AdGuard filter list header
    for: [javascript, text]
    if:
      type: text
      regex: '(?m)^!\s*(Title:\s*AdGuard\b|Compiled by @adguard/)'

  - id: hostlist-compiler-banner
    desc: AdGuard hostlist compiler banner
    for: [javascript, text]
    if:
      type: text
      substr: '@adguard/hostlist-compiler'
