defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, text]
  size_max: 120000000
traits:
  - id: chrome-extension-id
    desc: Coinbase Wallet Chrome extension ID
    crit: notable
    conf: 0.99
    for: [python, javascript, typescript, elf, macho, pe]
    if:
      type: text
      substr: hnfanknocfeofbddgcijnmhnfnkdnaad

  - id: extension-reference
    desc: Coinbase Wallet extension reference
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'Coinbase Wallet extension|chrome\.google\.com/webstore/detail/coinbase-wallet-extension/'
