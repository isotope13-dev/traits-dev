# Ohio State — Chrome Web Store browser theme (OSU scarlet/gray).
# Theme-only manifest; NTP wallpaper/PNGs are chrome theme assets, not
# a packed payload. Thumbs.db is a leftover Windows thumbnail cache.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: display-name
    desc: Ohio State Chrome theme name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Ohio State

  - id: extension-id
    desc: Ohio State Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: lbcpnbpkhipclmgcoobjiilmcnnlmlan

composite_rules:
  - id: ohio-state-chrome-theme
    desc: Ohio State Chrome Web Store theme
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: display-name
      - id: extension-id
