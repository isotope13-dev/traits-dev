# vivyd — AI ops for Fresha. After pairing, the extension uploads Fresha
# partner cookies to vivyd.ai so the product can act on the salon calendar.
defaults:
  platforms: [unix, windows]
  for: [javascript, chrome-manifest, crx, archives]
  crit: notable
  conf: 0.99
  size_max: 8000000

traits:
  - id: extension-display-name
    desc: vivyd Fresha Chrome extension name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: 'vivyd — AI ops for Fresha'

  - id: cookie-register-path
    desc: vivyd Fresha cookie registration API path
    for: [javascript]
    if:
      type: text
      substr: /api/cloud-sync/register-cookies
