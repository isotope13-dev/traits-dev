# mini-downloader — browser extension + native host download manager.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, typescript, markdown, json, cargo.toml]
  crit: notable
  conf: 0.99

traits:
  - id: extension-add-on-id
    desc: mini-downloader Firefox extension ID
    if:
      type: text
      substr: minidownloader@ramazan.dev

  - id: upstream-repository
    desc: mini-downloader upstream repository
    if:
      type: text
      regex: 'github\.com/RamazanBerk20/mini-downloader([./\s"''`?#]|$)'

  - id: native-messaging-host-name
    desc: mini-downloader native messaging host manifest
    for: [json]
    if:
      type: text
      substr: com.minidownloader.host

  - id: cargo-package-name
    desc: mini-downloader workspace Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: mini-downloader

composite_rules:
  - id: mini-downloader-archive-context
    desc: Recognized mini-downloader download manager context
    crit: exception
    conf: 0.99
    for: [archives]
    scope: archive
    any:
      - id: extension-add-on-id
      - id: native-messaging-host-name

  - id: mini-downloader-outer-context
    desc: mini-downloader source release outer context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: upstream-repository
    any:
      - id: extension-add-on-id
      - id: cargo-package-name
      - id: native-messaging-host-name
