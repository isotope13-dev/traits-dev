# Mk 2xScreen (merke.net) simulates a double-width borderless window. Browser
# extensions cannot remove window chrome or span displays, so it ships a
# companion native-messaging host (a Python, PowerShell or shell helper that
# calls xprop / SetWindowLong) together with an installer script that registers
# the host for its own extension ID under the browser's NativeMessagingHosts
# key. The extension source embeds those installer texts.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 5000
  size_max: 2000000

traits:
  - id: native-host-name
    desc: Mk 2xScreen native messaging host name
    if:
      type: text
      substr: com.merke.twoxscreen
