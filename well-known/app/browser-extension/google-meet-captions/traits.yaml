# Chrome extension that copies Google Meet live captions from the Meet
# captions container and offers them as a downloaded text file.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, crx]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: extension-name
    desc: Google Meet captions capture name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Google Meet Captions Capture

  - id: meet-captions-jsname
    desc: Google Meet captions jsname selector
    for: [javascript]
    conf: 0.96
    if:
      type: text
      substr: "div[jsname='YSxPC']"

  - id: download-captions-action
    desc: Download-captions extension message action
    for: [javascript]
    conf: 0.94
    if:
      type: text
      substr: 'action: "downloadCaptions"'
