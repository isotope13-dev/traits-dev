# Urban VPN's marketplace name is identity only. It becomes impersonation only
# when a separately operated service is also present in the same extension.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.98

traits:
  - id: display-name
    desc: Urban VPN browser extension display name
    if:
      type: value
      path: name
      regex: '\bUrban[ -]VPN\b'
      case_insensitive: true
