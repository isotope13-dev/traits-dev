defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest]

traits:
  - id: citewatch-predatory-publishing-dataset
    desc: Wikimedia CiteWatch predatory publishing dataset
    for: [javascript, text]
    if:
      type: text
      substr: 'Cite_Unseen/sources/predatory/'

  - id: notandia-extension
    desc: Notandia scholarly literature browser extension
    if:
      type: text
      substr: browser-extension@notandia.github.io
