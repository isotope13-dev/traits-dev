# Save to Google Calendar — context-menu helper that opens a
# Calendar TEMPLATE URL for the selected date. tabs.create is the
# product open-in-tab flow, not a hijack.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: Save to Google Calendar display name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Save to Google Calendar

  - id: extension-id
    desc: Save to Google Calendar Chrome Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: jpoefccfjpcdglbnjfhomifadledaodm

  - id: calendar-template
    desc: Google Calendar TEMPLATE render URL
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: google.com/calendar/render?action=TEMPLATE
