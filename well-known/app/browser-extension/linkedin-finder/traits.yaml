# Linkedin Finder — Chrome Web Store helper that highlights recruiter
# keywords on linkedin.com. Storage + content-script DOM highlight is
# the product UI, not a session stealer. Identity only.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx, javascript]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 5000000

traits:
  - id: display-name
    desc: Linkedin Finder extension display name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Linkedin Finder

  - id: extension-id
    desc: Linkedin Finder Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: mkcakjilbamhcppdaeeodcghlclpbfgd

  - id: keywords-storage-key
    desc: Linkedin Finder keywords storage key
    for: [javascript]
    if:
      type: text
      substr: linkedin_finder_keywords

  - id: highlight-class
    desc: Linkedin Finder highlight CSS class
    for: [javascript, text]
    if:
      type: text
      substr: linkedin-finder-highlight

composite_rules:
  - id: linkedin-finder-extension
    desc: Linkedin Finder Chrome keyword highlighter
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: display-name
      - id: extension-id
      - id: keywords-storage-key
      - id: highlight-class
    needs: 2
