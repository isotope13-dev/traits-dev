# Mystic Forest Glow — Chrome Web Store browser theme.
# Theme-only manifest; NTP wallpaper PNG is a chrome theme asset, not
# a packed payload.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: display-name
    desc: Mystic Forest Glow Chrome theme name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Mystic Forest Glow

  - id: extension-id
    desc: Mystic Forest Glow Chrome store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: gjjcggngndmmeifdpicinfalofnannhh

composite_rules:
  - id: mystic-forest-glow-theme
    desc: Mystic Forest Glow Chrome theme
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: display-name
      - id: extension-id
