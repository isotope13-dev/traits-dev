# Keepa's Firefox WebExtension identity. These fields together identify the
# official Amazon price-tracking add-on and provide benign context for generic
# extension lifecycle heuristics.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]

traits:
  - id: manifest-name
    desc: Keepa Amazon price tracker name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: Keepa - Amazon Price Tracker

  - id: manifest-homepage
    desc: Keepa extension homepage
    crit: notable
    conf: 0.99
    if:
      type: value
      path: homepage_url
      exact: https://keepa.com

  - id: manifest-gecko-id
    desc: Keepa Mozilla extension identifier
    crit: notable
    conf: 0.99
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: amptra@keepa.com

  - id: runtime-service-domain
    desc: Keepa extension service domain
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: https://dyn-2.keepa.com

composite_rules:
  - id: keepa-extension
    desc: Keepa Amazon price tracker extension
    crit: notable
    conf: 0.99
    for: [xpi, archives]
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-homepage
      - id: manifest-gecko-id
      - id: runtime-service-domain
