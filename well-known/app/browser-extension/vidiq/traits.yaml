# vidIQ Vision for YouTube Firefox extension. Cookies, all-URL content
# scripts, and Google OAuth are the product (YouTube analytics); identity only.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, xpi]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: gecko-id
    desc: vidIQ Vision Mozilla extension id
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: firefox@vid.io

  - id: product-host
    desc: vidIQ product site host
    for: [chrome-manifest, json]
    conf: 0.98
    if:
      type: text
      substr: vidiq.com

  - id: display-name
    desc: vidIQ Vision for YouTube display name
    for: [json, chrome-manifest]
    conf: 0.97
    if:
      type: text
      substr: 'vidIQ Vision for YouTube'
