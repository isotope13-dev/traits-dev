# Clarity - Redirect — BTO LIMS Chrome extension. After Clarity LIMS
# login it restores the pre-auth URL via tabs.update; that is the
# product redirect, not a hijack.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: Clarity Redirect extension display name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Clarity - Redirect

  - id: extension-id
    desc: Clarity Redirect Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: eekdngpcjemdloeghibigcmegefpcfea

  - id: btolims-host
    desc: BTO LIMS Clarity hostname pattern
    for: [javascript, chrome-manifest]
    conf: 0.98
    if:
      type: text
      substr: btolims.com/clarity
