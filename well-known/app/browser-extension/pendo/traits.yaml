# Pendo Launcher — official enterprise digital adoption and analytics
# browser extension from Pendo.io.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Pendo Launcher extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Pendo Launcher

  - id: gecko-id
    desc: Pendo Launcher Firefox extension id
    for: [chrome-manifest]
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: pendo-launcher@pendo.io

composite_rules:
  - id: pendo-launcher-extension
    desc: Pendo Launcher browser extension
    crit: notable
    conf: 0.99
    for: [xpi, crx, chrome-manifest]
    scope: archive
    any:
      - id: manifest-name
      - id: gecko-id
