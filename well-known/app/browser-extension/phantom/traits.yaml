defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, text, crx, xpi]
  size_max: 120000000

traits:
  - id: chrome-store-reference
    for: [javascript, typescript, text]
    desc: Phantom Chrome store reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: chrome.google.com/webstore/detail/phantom/bfnaelmomeimhlpmgjnjophhpkkoljpa
  - id: addon-host-literal
    desc: Literal names the Phantom addon host
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      substr: phantom.app
