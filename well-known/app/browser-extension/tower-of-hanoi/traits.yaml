# Tower Of Hanoi — Vinod Sebastian Chrome puzzle wrapper. popup.js
# iframes the author's hosted PHP game; install/update opens a
# thank-you page and setUninstallURL is author telemetry. Identity only.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx, javascript]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: extension-id
    desc: Tower Of Hanoi Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: khompggjjfkfbaiaapikflcflfijfkcf

  - id: display-name
    desc: Tower Of Hanoi extension display name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Tower Of Hanoi

  - id: game-url
    desc: Vinod Sebastian Tower Of Hanoi game URL
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: vinodsebastian.com/gamesdir/TowerOfHanoi.php

  - id: homepage
    desc: Tower Of Hanoi extension homepage
    conf: 0.97
    if:
      type: text
      substr: vinodsebastian.com/tower-of-hanoi
