# QuizFetch / Canvas Quiz Fetch application identity.
# Identity does not establish safe collection or consent handling.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, chrome-manifest, xpi]
  crit: notable
  conf: 0.98

traits:
  - id: gecko-addon-id
    desc: QuizFetch Firefox add-on id
    for: [json, chrome-manifest]
    if:
      type: text
      substr: quizfetch@wehyn.github.io

  - id: config-object
    desc: QuizFetch application config object
    for: [javascript]
    if:
      type: text
      substr: 'window.QUIZFETCH_CONFIG'

  - id: webapp-url
    desc: QuizFetch hosted webapp URL
    for: [javascript, json]
    if:
      type: text
      substr: https://quiz-fetch.vercel.app
