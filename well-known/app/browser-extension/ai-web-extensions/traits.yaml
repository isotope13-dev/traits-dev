# adamlui's ai-web-extensions: its package, bump helper and remote runner.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: ai-web-extensions-bump-host
    desc: Adam Lui jsDelivr CDN host literal
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      substr: cdn.jsdelivr.net/gh/adamlui/
  - id: ai-web-extensions-bump-module
    desc: ai-web-extensions bump helper module
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      substr: 'utils/bump/lib/bump.min.mjs'
  - id: ai-web-extensions-remote-runner-file
    desc: Adam Lui remote runner utility basename
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: basename
      exact: remote-run.js
  - id: ai-web-extensions-package
    desc: ai-web-extensions package identity
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@adamlui/ai-web-extensions'
composite_rules:
  - id: ai-web-extensions-screenshot-path
    for: [npm, javascript, typescript, package.json, png]
    desc: ai-web-extensions screenshot asset path
    crit: notable
    conf: 1.0
    scope: archive
    all:
      - id: ai-web-extensions-package
      - id: metadata/package/files/included::screenshot-directory-asset-path
  - id: ai-web-extensions-bump-helper-context
    desc: Recognized ai-web-extensions maintenance helper context
    crit: exception
    conf: 0.99
    all:
      - id: ai-web-extensions-bump-host
      - id: ai-web-extensions-bump-module
  - id: ai-web-extensions-remote-runner-context
    desc: Recognized Adam Lui remote maintenance runner context
    crit: exception
    conf: 0.99
    for: [npm, javascript, typescript]
    scope: archive
    all:
      - id: ai-web-extensions-bump-host
      - id: ai-web-extensions-remote-runner-file
