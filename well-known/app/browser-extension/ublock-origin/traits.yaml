defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, crx]
  size_max: 120000000
traits:
  - id: chrome-extension
    desc: uBlock Origin Chrome extension archive
    if:
      type: path
      substr: ddkjiahejlhfcafbddmgiahcphecmpfh.crx
  - id: edge-extension
    desc: uBlock Origin Edge extension archive
    if:
      type: path
      substr: cimighlppcgcoapaliogpjjdehbnofhn.crx
  - id: edge-extension-alt
    desc: uBlock Origin alternate Edge extension archive
    ref: sha256:642bf3b1f5e895ffcfcd59dde017a495a09312c20da0e4a0564abbbfb7d08eea
    if:
      type: path
      substr: odfafepnkmbhccpbejgmiehpchacaeak.crx
  # uBlock Origin's own source files carry its GPL banner. The extension's
  # filter parser and static filtering engine are where hosts-file syntax
  # (`0.0.0.0 example.com`) is implemented, so a rule looking for bulk domain
  # blocking finds the blocker itself rather than one of its lists.
  - id: source-banner
    desc: uBlock Origin source file banner
    crit: notable
    if:
      type: text
      substr: 'uBlock Origin - a comprehensive, efficient content blocker'

  - id: filter-bundle
    desc: uBlock Origin filter bundle
    if:
      type: text
      substr: ublock-filters
