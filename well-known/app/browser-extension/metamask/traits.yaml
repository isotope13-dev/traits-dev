defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, chrome-manifest, crx]
  size_max: 120000000
traits:
  - id: addon-host-literal
    desc: Literal names the MetaMask addon host
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      substr: metamask.io
  - id: crx-member
    desc: MetaMask extension archive member
    conf: 0.98
    if:
      type: path
      regex: 'nkbihfbeogaeaoehlefnkodbefgpgknn\.crx([\\/]|$)'
  - id: lavamoat-webpack
    desc: MetaMask LavaMoat webpack bundle
    conf: 0.96
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: with(this.ST)with(this.RH)with(this.G)
  - id: official-manifest
    desc: MetaMask official extension manifest
    conf: 0.98
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: https://metamask.io
