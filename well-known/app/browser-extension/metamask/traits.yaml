defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, chrome-manifest, crx]
  size_max: 120000000
traits:
  - id: chrome-extension-id
    desc: MetaMask Chrome extension ID
    conf: 0.99
    for: [python, javascript, typescript, elf, macho, pe]
    if:
      type: text
      substr: nkbihfbeogaeaoehlefnkodbefgpgknn
  - id: edge-extension-id
    desc: MetaMask Edge extension ID
    conf: 0.99
    for: [python, javascript, typescript, elf, macho, pe]
    if:
      type: text
      substr: ejbalbakoplchlghecdalmeeeajnimhm
  - id: crx-member
    desc: MetaMask extension archive member
    conf: 0.98
    if:
      type: path
      regex: 'nkbihfbeogaeaoehlefnkodbefgpgknn\.crx([\\/]|$)'
  - id: lavamoat-webpack
    desc: MetaMask LavaMoat webpack bundle
    conf: 0.96
    if:
      type: text
      substr: with(this.ST)with(this.RH)with(this.G)
  - id: official-manifest
    desc: MetaMask official extension manifest
    conf: 0.98
    if:
      type: text
      substr: https://metamask.io
