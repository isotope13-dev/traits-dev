# KYM Venus Web Hands — companion extension for the Venus desktop
# app. chrome.scripting into the active tab is the product web-hands
# bridge, not a drive-by injector.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: KYM Venus Web Hands display name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: KYM Venus Web Hands

  - id: extension-id
    desc: KYM Venus Web Hands Chrome Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: ggkekaifogcdecmikbklfakjkfemlfbd

  - id: local-bridge
    desc: Venus local HTTP bridge endpoint
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: 127.0.0.1:3001/api/venus-ext
