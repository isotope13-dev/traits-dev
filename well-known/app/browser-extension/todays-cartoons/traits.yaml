# Today's Cartoons — Chrome Web Store hosted app that opens
# cartoon.appzend.net in a tab. unlimitedStorage is the hosted-app
# permission; there is no extension JS payload.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: extension-id
    desc: Today's Cartoons Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: lagliihdfbilpfocmfioblodgmflanpp

  - id: launch-host
    desc: Today's Cartoons hosted-app launch host
    for: [chrome-manifest, json]
    conf: 0.98
    if:
      type: text
      substr: cartoon.appzend.net

  - id: localized-name
    desc: Today's Cartoons localized display name
    for: [json]
    conf: 0.97
    if:
      type: text
      substr: 'Today''s Cartoons'
