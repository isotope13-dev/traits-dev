# An extension identifier establishes an app reference, not collection.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - typescript
  - elf
  - macho
  - pe
  size_min: 32
traits:
- id: chrome-extension-id
  desc: TronLink wallet extension ID
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: ibnejdfjmmkpcnlpebklmnkoeoihofec
- id: addon-host-literal
  desc: Literal names the TronLink addon host
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: literal
    kind: string
    substr: tron.network
