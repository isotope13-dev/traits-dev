# ScriptCat -- open-source userscript manager (Tampermonkey-class) for
# Chromium and Firefox. By design it parses ==UserScript== headers, exposes
# GM_* APIs (GM_cookie, GM_xmlhttpRequest, GM_getValue), watches web requests,
# and syncs to cloud drives, so a pooled-archive detector sees cookie, request
# and HTTP legs spread across its bundle. Those are the manager's API surface
# for scripts the user installed, not collection by the extension itself.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-author
    desc: ScriptCat manifest author name
    if:
      type: value
      path: author
      exact: CodFrm

  - id: manifest-name
    desc: ScriptCat manifest localized name key
    if:
      type: value
      path: name
      regex: '^__MSG_scriptcat(_beta)?__$'

  - id: docs-site-url
    desc: ScriptCat documentation site URL
    for: [javascript]
    if:
      type: string_literal
      substr: docs.scriptcat.org

  - id: cat-api-compat-name
    desc: ScriptCat CAT_ API compatibility name
    for: [javascript]
    if:
      type: text
      word: CAT_userConfig

composite_rules:
  - id: scriptcat-extension-context
    for: [chrome-manifest, crx, xpi, zip, javascript]
    desc: Recognized ScriptCat userscript manager context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: manifest-author
      - id: manifest-name

  # File-scoped twin of the manifest context: suppressors only see findings in
  # the file a rule matched in, and the vocabulary rules report on the bundle
  # members, not on manifest.json.
  - id: scriptcat-bundle-context
    for: [javascript]
    desc: Recognized ScriptCat userscript manager bundle
    crit: exception
    conf: 0.99
    all:
      - id: docs-site-url
      - id: cat-api-compat-name
