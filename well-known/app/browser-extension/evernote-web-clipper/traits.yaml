defaults:
  platforms: [windows, unix]
  for: [javascript, text, crx, archives]
  size_max: 120000000
traits:
  - id: extension-path
    desc: Evernote Web Clipper extension archive
    crit: component
    conf: 0.98
    if:
      type: path
      substr: pioclpoplcdbaefihamjohnefbikjilc.crx
  - id: extension-marker
    desc: Evernote clipper service worker filename
    crit: component
    conf: 0.98
    if:
      type: text
      substr: ServiceWorkerExtension.js
  - id: clipper-display-name
    desc: Evernote Web Clipper display name
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Evernote Web Clipper
composite_rules:
  - id: extension
    desc: Evernote Web Clipper extension
    crit: notable
    conf: 0.98
    any:
      - id: extension-path
      - id: extension-marker
      - id: clipper-display-name
