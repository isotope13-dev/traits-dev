defaults:
  platforms: [windows, unix]
  for: [javascript, text, crx, archives]
  size_max: 120000000
traits:
  - id: extension-path
    desc: Evernote Web Clipper extension archive
    crit: component
    conf: 0.98
    if:
      type: path
      substr: pioclpoplcdbaefihamjohnefbikjilc.crx
  - id: extension-marker
    desc: Evernote Web Clipper marker
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(Evernote|ServiceWorkerExtension\.js)'
composite_rules:
  - id: extension
    desc: Evernote Web Clipper extension
    crit: notable
    conf: 0.98
    any:
      - id: extension-path
      - id: extension-marker
