# advanced Proxy Firefox extension. Proxy management tool for Firefox.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest, javascript, xpi, zip]
  crit: notable
  conf: 0.98

traits:
  - id: advanced-proxy-gecko-id
    desc: advanced Proxy Firefox extension identifier
    for: [chrome-manifest]
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: 'advanced-proxy@proxypro.local'

  - id: advanced-proxy-name
    desc: advanced Proxy extension name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: 'advanced Proxy'

  - id: advanced-proxy-source-marker
    desc: advanced Proxy component source marker
    for: [javascript]
    if:
      type: text
      regex: 'advanced Proxy — (Engine|Dashboard|i18n|Background|Popup)'

composite_rules:
  - id: advanced-proxy-extension-context
    desc: Recognized advanced Proxy Firefox extension
    crit: notable
    conf: 0.99
    any:
      - id: advanced-proxy-gecko-id
      - id: advanced-proxy-name
      - id: advanced-proxy-source-marker
