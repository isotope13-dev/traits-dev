# Map Route Pro & Search — Firefox maps UI that also sets Yahoo YHS
# as the default search provider. Affiliate search override stays
# notable (existing composites); atlas.min.js is Azure Maps, not malware.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, xpi]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: display-name
    desc: Map Route Pro extension display name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Map Route Pro & Search

  - id: gecko-id
    desc: Map Route Pro Mozilla extension id
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: addon@maproutepro.com

  - id: xpi-name
    desc: Map Route Pro XPI display name
    for: [xpi]
    conf: 0.99
    if:
      type: value
      path: xpi.name
      exact: Map Route Pro & Search

  - id: site-host
    desc: Map Route Pro product site host
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: maproutepro.com

composite_rules:
  - id: map-route-pro-extension
    desc: Map Route Pro Firefox maps add-on
    crit: notable
    conf: 0.99
    for: [xpi, chrome-manifest]
    all:
      - id: display-name
      - id: gecko-id
