# Legitimate Primus zkTLS browser extension (Primus Labs).
defaults:
  platforms: [windows, unix]
  for: [crx, archives]
  size_max: 120000000
traits:
  - id: primus-chrome-extension
    desc: Primus zkTLS Chrome extension archive
    crit: notable
    conf: 0.98
    if:
      type: path
      substr: oeiomhmbaapihbilkfkhmlajkeegnjhe.crx
  - id: primus-labs-manifest-name
    desc: Primus extension manifest product name
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '"name":"Primus"'
