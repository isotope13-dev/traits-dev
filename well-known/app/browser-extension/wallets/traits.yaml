# Identity co-occurrence; consumers add evidence of collection or theft.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - typescript
  - elf
  - macho
  - pe
  size_min: 32
composite_rules:
- id: several-wallet-addon-host-literals
  desc: Literals name several wallet addon hosts
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  needs: 3
  any:
  - id: well-known/app/browser-extension/metamask::addon-host-literal
  - id: well-known/app/browser-extension/phantom::addon-host-literal
  - id: well-known/app/browser-extension/tronlink::addon-host-literal
