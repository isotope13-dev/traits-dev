# Identity co-occurrence; consumers add evidence of collection or theft.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - typescript
  - elf
  - macho
  - pe
  size_min: 32
composite_rules:
- id: multiple-wallet-extension-ids
  desc: Multiple wallet extension ID references
  any:
  - id: well-known/app/browser-extension/metamask::chrome-extension-id
  - id: well-known/app/browser-extension/phantom::chrome-extension-id
  - id: well-known/app/browser-extension/trust-wallet::chrome-extension-id
  - id: well-known/app/browser-extension/binance::chrome-extension-id
  - id: well-known/app/browser-extension/coinbase-wallet::chrome-extension-id
  - id: well-known/app/browser-extension/tronlink::chrome-extension-id
  - id: well-known/app/browser-extension/nami::chrome-extension-id
  - id: well-known/app/browser-extension/temple::chrome-extension-id
  - id: well-known/app/browser-extension/petra::chrome-extension-id
  - id: well-known/app/browser-extension/martian::chrome-extension-id
  - id: well-known/app/browser-extension/pontem::chrome-extension-id
  - id: well-known/app/browser-extension/exodus::chrome-extension-id
  - id: well-known/app/browser-extension/keplr::chrome-extension-id
  - id: well-known/app/browser-extension/rabby::chrome-extension-id
  - id: well-known/app/browser-extension/brave::chrome-extension-id
  - id: well-known/app/browser-extension/metamask::edge-extension-id
  - id: well-known/app/browser-extension/coin98::chrome-extension-id
  - id: well-known/app/browser-extension/mathwallet::chrome-extension-id
  - id: well-known/app/browser-extension/safepal::chrome-extension-id
  - id: well-known/app/browser-extension/solflare::chrome-extension-id
  - id: well-known/app/browser-extension/wombat::chrome-extension-id
  needs: 2
  crit: notable
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: objectives/credential-access/wallet/extension::coinbase-solana-adapter-context
  - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
  - id: well-known/lib/crypto/connectkit::connectkit-wallet-integration-context
- id: wallet-extension-id-cluster
  desc: Three or more wallet extension IDs
  crit: notable
  conf: 0.95
  for:
  - python
  - javascript
  - elf
  - pe
  - macho
  needs: 3
  any:
  - id: well-known/app/browser-extension/metamask::chrome-extension-id
  - id: well-known/app/browser-extension/phantom::chrome-extension-id
  - id: well-known/app/browser-extension/trust-wallet::chrome-extension-id
  - id: well-known/app/browser-extension/binance::chrome-extension-id
  - id: well-known/app/browser-extension/coinbase-wallet::chrome-extension-id
  - id: well-known/app/browser-extension/tronlink::chrome-extension-id
  - id: well-known/app/browser-extension/exodus::chrome-extension-id
  - id: well-known/app/browser-extension/keplr::chrome-extension-id
  - id: well-known/app/browser-extension/petra::chrome-extension-id
  - id: well-known/app/browser-extension/martian::chrome-extension-id
  - id: well-known/app/browser-extension/pontem::chrome-extension-id
  - id: well-known/app/browser-extension/nami::chrome-extension-id
  - id: well-known/app/browser-extension/temple::chrome-extension-id
  - id: well-known/app/browser-extension/rabby::chrome-extension-id
  - id: well-known/app/browser-extension/brave::chrome-extension-id
  - id: well-known/app/browser-extension/metamask::edge-extension-id
  - id: well-known/app/browser-extension/coin98::chrome-extension-id
  - id: well-known/app/browser-extension/mathwallet::chrome-extension-id
  - id: well-known/app/browser-extension/safepal::chrome-extension-id
  - id: well-known/app/browser-extension/solflare::chrome-extension-id
  - id: well-known/app/browser-extension/wombat::chrome-extension-id
  unless:
  - id: well-known/lib/crypto/connectkit::connectkit-wallet-integration-context
