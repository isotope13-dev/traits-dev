# Windscribe's official Chrome extension. Keep the canonical store ID
# available so brand-impersonation rules can distinguish it from lookalikes.
defaults:
  platforms: [windows, unix]
  for: [crx]
  crit: notable
  conf: 0.99

traits:
  - id: official-extension-id
    desc: Official Windscribe Chrome extension ID
    if:
      type: value
      path: crx.extension_id
      exact: hnmpcagpplmpfojmgmnngilcnanddlhb
