defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [crx]
  size_max: 120000000
traits:
  - id: chrome-extension-id
    desc: AdBlock Chrome extension ID
    if:
      type: value
      path: crx.extension_id
      exact: gighmmpiobklfepjocnamgkkbiglidom
  - id: edge-extension-id
    desc: AdBlock Edge extension ID
    if:
      type: value
      path: crx.extension_id
      exact: ndcileolkflehcjpmjnfbnaibdcgglog

composite_rules:
  - id: chrome-extension
    desc: Signed AdBlock Chrome extension archive
    all:
      - id: chrome-extension-id
      - id: metadata/signature/verified/crx::valid-signature
  - id: edge-extension
    desc: Signed AdBlock Edge extension archive
    all:
      - id: edge-extension-id
      - id: metadata/signature/verified/crx::valid-signature
