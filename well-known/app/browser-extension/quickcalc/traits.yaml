# QuickCalc — Manifest V3 popup calculator (AIO.com.ai). No host
# permissions; click/keyboard handlers are the calculator UI.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: QuickCalc modern calculator display name
    for: [json]
    conf: 0.99
    if:
      type: text
      substr: 'QuickCalc - Modern Calculator'

  - id: aio-publisher
    desc: AIO.com.ai calculator publisher mark
    for: [json]
    conf: 0.96
    if:
      type: text
      substr: 'by AIO.com.ai'
