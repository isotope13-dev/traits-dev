# Official Cuponomia cashback/coupon browser extension. The extension
# posts user feedback to a Google Apps Script endpoint and uses AWS APIs
# for coupon testing — both are benign for this product identity.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, typescript, crx]

traits:
  - id: manifest-name
    for: [javascript, chrome-manifest]
    desc: Cuponomia extension manifest name
    if:
      type: value
      path: name
      exact: Cuponomia - Cupom e Cashback

  - id: manifest-homepage
    for: [javascript, chrome-manifest]
    desc: Cuponomia extension homepage
    if:
      type: value
      path: homepage_url
      exact: https://www.cuponomia.com.br

  - id: extension-feedback-endpoint
    desc: Cuponomia extension feedback Apps Script URL
    if:
      type: text
      substr: extensionFeedback:"https://script.google.com/macros/

  - id: runtime-cdn-domain
    desc: Cuponomia extension CDN domain
    if:
      type: text
      substr: ext-cdn.cuponomia.com.br

composite_rules:
  - id: cuponomia-extension
    desc: Cuponomia official coupon extension
    for: [crx]
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-homepage
    any:
      - id: extension-feedback-endpoint
      - id: runtime-cdn-domain
