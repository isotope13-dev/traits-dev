# Fantasy Forest — Chrome Web Store browser theme. The Web Store CRX ships
# only a colors-only theme manifest and its verification metadata.
defaults:
  platforms: [unix, windows]
  for: [crx, json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 8000000

traits:
  - id: extension-id
    desc: Fantasy Forest Chrome Web Store id
    for: [crx]
    if:
      type: value
      path: crx.extension_id
      exact: fcdlcnkfpmfhgiiagjlhmadfndaaahjf

composite_rules:
  - id: fantasy-forest-theme
    desc: Fantasy Forest Chrome browser theme
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: extension-id
      - id: metadata/file/format/browser-extension::json-webextension-theme-manifest
