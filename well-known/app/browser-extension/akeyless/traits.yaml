defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, crx, xpi, source]
  size_max: 52428800
  crit: notable
  conf: 0.99

traits:
  - id: akeyless-browser-extension
    desc: Akeyless secrets automation browser extension
    if:
      type: text
      regex: '(?i)(akeyless-sa@akeyless\.io|https://(\w+\.)?akeyless\.io|\[Akeyless SA 2\.0\])'
