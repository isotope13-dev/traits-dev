# Ultimate Ad Blocker & Security Suite — Chrome extension that blocks ads
# via DNR, cosmetic filters, and a MAIN-world anti-fingerprint stealth
# script. Freemium Gumroad license; not a credential stealer.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, crx]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: extension-name
    desc: Ultimate Ad Blocker extension name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Ultimate Ad Blocker & Security Suite

  - id: stealth-activate-event
    desc: Ultimate Ad Blocker stealth activate event
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: UAL_ACTIVATE_STEALTH_MODE

  - id: gumroad-product
    desc: Ultimate Ad Blocker Gumroad product URL
    for: [javascript]
    conf: 0.96
    if:
      type: text
      substr: businessguru1.gumroad.com/l/adblocker
