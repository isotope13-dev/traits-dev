# PT Depiler (github.com/pt-plugins/PT-depiler) — an open-source browser
# extension that searches, aggregates and downloads from private and public
# BitTorrent trackers, with optional Backblaze B2 backup of its settings. It
# ships one definition file per tracker site, so the bundle names hundreds of
# tracker URLs (`/browse.php`, mirror domains, cheap TLDs) as lookup data and
# sends a stored site token to the site it belongs to.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [chrome-manifest]

traits:
  - id: manifest-homepage
    desc: PT Depiler extension homepage
    if:
      type: value
      path: homepage_url
      exact: https://github.com/pt-plugins/PT-depiler

  - id: manifest-gecko-id
    desc: PT Depiler Mozilla extension identifier
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: ptdepiler.ptplugins@gmail.com

composite_rules:
  - id: extension-context
    desc: Official PT Depiler browser extension
    crit: exception
    for: [xpi, chrome-manifest, javascript]
    scope: archive
    all:
      - id: manifest-homepage
      - id: manifest-gecko-id
