# Namirasoft Password — Manifest V3 password manager. all_urls content
# scripts, form fill, and AES-GCM are product features; identity only.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, typescript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: Namirasoft Password extension name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Namirasoft Password

  - id: product-title
    desc: Namirasoft Password UI product title
    for: [javascript, typescript]
    conf: 0.98
    if:
      type: text
      substr: Namirasoft Password

  - id: password-version-key
    desc: Namirasoft Password version storage key
    for: [javascript, typescript]
    conf: 0.97
    if:
      type: text
      substr: KEY_NS_PASSWORD_VERSION

  - id: logo-cdn-path
    desc: Namirasoft Password logo CDN path
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: text
      substr: static.namirasoft.com/image/namirasoft/password
