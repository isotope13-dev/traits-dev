# These extension relay and landing domains serve Prado VPN's payment funnel.
# Identity is value-neutral: Prado-branded extensions may legitimately use it.
# The apexes are throwaway `<russian-word>prdo.space` coinages (rasshirenye-,
# gooreshir-, skorost-), so the pattern matches the coining scheme rather than
# an enumerated list.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: extension-infrastructure
    desc: References Prado VPN extension infrastructure
    if:
      type: text
      case_insensitive: true
      regex: '\b(svayzinter|[a-z]{4,16}prdo)\.space\b'
