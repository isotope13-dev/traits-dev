# Gameograf wallpaper/new-tab extensions. These extensions are promotional,
# but publisher promotion alone is not unwanted or hostile behavior.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, crx]
  crit: notable
  conf: 0.92

traits:
  - id: manifest-author
    desc: Gameograf Chrome extension author
    for: [json, chrome-manifest]
    if:
      type: value
      path: author
      exact: Gameograf

  - id: publisher-host
    desc: Gameograf publisher URL in extension
    for: [javascript, typescript]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

composite_rules:
  - id: newtab-extension
    desc: Gameograf new-tab extension identity
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: manifest-author
      - id: publisher-host
