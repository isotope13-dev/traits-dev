# Env Border — Manifest V3 environment-colored page border. all_urls
# content-script inject is the product UI.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: Env Border Chrome extension display name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Env Border

  - id: webstore-id
    desc: Env Border Chrome Web Store item id
    for: [markdown]
    conf: 0.98
    if:
      type: text
      substr: env-border/imioapnclmdfnmoaackmnfnkinlojhng

  - id: border-class
    desc: Env Border injected DOM class name
    for: [javascript]
    conf: 0.96
    if:
      type: text
      substr: classList.add('env-border')
