# VPNLY's marketplace name is identity only. A separate objective determines
# whether another operator has placed that identity on its own proxy service.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.98

traits:
  - id: display-name
    desc: VPNLY browser extension display name
    if:
      type: value
      path: name
      regex: '\bVPNLY\b'
      case_insensitive: true
