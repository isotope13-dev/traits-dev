# FireShot is a legitimate screenshot extension whose native helper exposes
# clipboard, screen, keyboard, registry, and file APIs as part of its capture
# and native-messaging implementation.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest, javascript, pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: extension-short-name
    desc: FireShot extension short name
    for: [chrome-manifest]
    if:
      type: value
      path: short_name
      exact: FireShot

  - id: firefox-extension-id
    desc: FireShot Firefox extension identifier
    for: [chrome-manifest]
    if:
      type: value
      path: applications.gecko.id
      exact: '{0b457cAA-602d-484a-8fe7-c1d894a011ba}'

  - id: native-resource-fetch
    desc: FireShot packaged native resource fetch
    for: [javascript]
    if:
      type: symbol
      kind: call
      exact: chrome.runtime.getURL
      arg:
        kind: string
        exact: native/fireshot-chrome-plugin.dat

  - id: extension-id-reference
    desc: FireShot extension identifier reference
    for: [javascript]
    if:
      type: text
      substr: 0b457cAA-602d-484a-8fe7-c1d894a011ba

  - id: installer-brand-marker
    desc: FireShot native installer source marker
    for: [javascript]
    if:
      type: text
      substr: FireShot - Webpage Screenshots and Annotations

  - id: native-product-name
    desc: FireShot native product metadata
    for: [pe, dll]
    size_min: 500000
    size_max: 25000000
    if:
      type: value
      path: pe.version.product_name
      exact: FireShot Webpage Captures

composite_rules:
  - id: extension-context
    desc: Recognized FireShot Firefox extension
    crit: notable
    conf: 0.99
    for: [chrome-manifest]
    all:
      - id: extension-short-name
      - id: firefox-extension-id
      - id: metadata/permission/extension-api::permission-native-messaging

  - id: native-install-context
    desc: FireShot packaged native installer script
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: native-resource-fetch
      - id: extension-id-reference
      - id: installer-brand-marker

  - id: native-host-context
    desc: Recognized FireShot signed native host
    crit: exception
    conf: 0.99
    for: [pe, dll]
    all:
      - id: native-product-name
      - id: metadata/signed/leaf::evgeny-suslikov-evgeny-suslikov-ip
