# Remove Blink — Chrome Web Store CSS injector that disables cursor
# blink. host_permissions and <all_urls> content_scripts are the product.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: extension-id
    desc: Remove Blink Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: fnaaokkdhakddpnkbmghogjelkakgpkg

  - id: display-name
    desc: Remove Blink extension display name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Remove Blink
