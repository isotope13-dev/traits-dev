# @axe-core/watcher -- Deque's axe DevTools Watcher, the accessibility test
# harness for Cypress, Playwright, Puppeteer and WebdriverIO. Alongside its
# Node entry points it ships a Manifest V3 browser extension whose
# background and content scripts are javascript-obfuscator output, licensed
# UNLICENSED (proprietary). The scope is Deque's own, the package is a
# long-lived, widely installed release train that regularly cuts several
# versions in a day, so "obfuscated code in a package with release bursts"
# describes its normal publication, not a stage loader.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: axe DevTools Watcher npm package name
    if:
      type: value
      path: name
      exact: '@axe-core/watcher'
