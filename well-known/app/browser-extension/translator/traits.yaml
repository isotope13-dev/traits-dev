# A translation extension: its own member paths, its backend host, and the
# Tencent translation API credentials it asks the user for.
defaults:
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest, crx, xpi, archives]
  size_max: 120000000
traits:
  - id: translator-member-path
    desc: Translator extension member path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: path
      substr: _translator-
  - id: tencent-translation-api-auth
    desc: Tencent translation API authentication context
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: Missing Tencent SecretId or SecretKey.
  - id: translator-backend-host
    desc: Translator extension backend service host
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: yd.transduck.com
composite_rules:
  - id: translator-security-context
    desc: Translator extension CORS service context
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: translator-backend-host
      - id: micro-behaviors/process/hook/webextension::dnr-cors-origin-rewrite
      - id: micro-behaviors/process/hook/webextension::dnr-request-context-header-set
