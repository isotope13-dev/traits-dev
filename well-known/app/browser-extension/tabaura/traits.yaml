# TabAura — Manifest V3 side-panel tab search/manager. tabs+sidePanel
# only; no host permissions.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: TabAura Chrome extension display name
    for: [json]
    conf: 0.99
    if:
      type: text
      substr: '"message": "TabAura"'

  - id: side-panel-description
    desc: TabAura side-panel search description
    for: [json]
    conf: 0.96
    if:
      type: text
      substr: 'Fluidly search and manage browser tabs'

  - id: open-action-title
    desc: Open TabAura action title
    for: [json]
    conf: 0.96
    if:
      type: text
      substr: '"message": "Open TabAura"'

  - id: product-name
    desc: TabAura product name in script
    for: [javascript]
    conf: 0.95
    if:
      type: text
      substr: TabAura
