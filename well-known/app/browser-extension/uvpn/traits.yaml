# Product identity only. A separate composite checks the substituted service.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.98

traits:
  - id: display-name
    desc: uVPN browser extension display name
    if:
      type: value
      path: name
      regex: '\buVPN\b'
      case_insensitive: true
