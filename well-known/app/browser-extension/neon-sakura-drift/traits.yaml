# Neon Sakura Drift — Chrome Web Store browser theme. Theme-only
# manifest; the PNG is NTP wallpaper, not a packed payload.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: display-name
    desc: Neon Sakura Drift theme display name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Neon Sakura Drift

  - id: extension-id
    desc: Neon Sakura Drift Chrome Web Store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: adiblmcgnepobbpgncdhggpamaampcae
