# Scholarly — unified academic search Chrome extension. fetch, innerHTML
# result cards, and chrome.tabs side-panel open are the product UI.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: Scholarly research-search extension name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: 'Scholarly: Unified Research Search'

  - id: extension-id
    desc: Scholarly Chrome Web Store extension id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: lehaaaaaffkojgjeccjjopfpneklbhih

  - id: search-api-host
    desc: Scholarly onrender search API host
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: scholarly-search-api-70wp.onrender.com
