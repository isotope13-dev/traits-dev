# Surfshark VPN Firefox extension. Proxy, all-URL content scripts,
# webRequestBlocking, and autofill are the product; identity only.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, xpi]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: gecko-id
    desc: Surfshark VPN Mozilla extension id
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: '{732216ec-0dab-43bb-ac85-4b5e1977599d}'

  - id: product-host
    desc: Surfshark product site host
    for: [chrome-manifest, json]
    conf: 0.98
    if:
      type: text
      substr: surfshark.com

  - id: display-message
    desc: Surfshark VPN extension display name
    for: [json]
    conf: 0.97
    if:
      type: text
      substr: 'Surfshark VPN Extension'
