# NotionHub (notionhub.app) is a browser extension that syncs a user's
# accounts on services such as WeRead, Douban, Weibo, X, Spotify and YouTube
# into Notion. It does so by reading each service's session cookies after the
# user clicks a "get cookie" button and handing them, with the user's NotionHub
# account authorization, to the vendor's integration API (documented at
# notionhub.app/docs). Cookie enumeration and an off-site POST are the product's
# purpose here, so the generic collection rules read as a match on the
# product rather than on an extension that conceals harvesting.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: notable
  conf: 0.98

traits:
  - id: manifest-name
    desc: NotionHub manifest name
    if:
      type: value
      path: name
      exact: Notionhub
      case_insensitive: true

  - id: oauth-callback-content-script
    desc: NotionHub OAuth callback content script
    if:
      type: value
      path: content_scripts[*].matches[*]
      substr: notion-auth.notionhub.app

composite_rules:
  - id: notionhub-extension-context
    desc: Recognized NotionHub sync extension
    crit: exception
    scope: archive
    for: [chrome-manifest, crx, xpi, zip, javascript]
    all:
      - id: manifest-name
      - id: oauth-callback-content-script
