# iFrame remover — Firefox add-on that strips page iframes on demand.
# Broad content-script + storage are the product UI, not a credential thief.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, markdown, xpi]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: display-name
    desc: iFrame remover extension display name
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: name
      exact: iFrame remover

  - id: gecko-id
    desc: iFrame remover Mozilla extension id
    for: [chrome-manifest]
    conf: 0.99
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: walkingice@web_extension_remove_iframe

  - id: amo-listing
    desc: AMO iframe-remover add-on listing
    for: [markdown]
    conf: 0.98
    if:
      type: text
      substr: addons.mozilla.org/zh-TW/firefox/addon/iframe-remover/

composite_rules:
  - id: iframe-remover-extension
    desc: Official iFrame remover Firefox add-on
    crit: notable
    conf: 0.99
    for: [xpi, archives]
    scope: archive
    all:
      - id: display-name
      - id: gecko-id
      - id: amo-listing
