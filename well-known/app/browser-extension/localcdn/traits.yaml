defaults:
  platforms: [windows, unix]
  for: [javascript, text, crx, xpi, archives]
  size_max: 120000000
traits:
  - id: resource-path
    desc: LocalCDN vendored library resource path
    crit: component
    conf: 0.98
    if:
      type: path
      regex: 'resources[\\/](angular-ui-bootstrap|jquery-ui|semantic-ui)[\\/]'
  - id: angular-datepicker
    desc: Angular UI Bootstrap datepicker marker
    crit: component
    conf: 0.98
    if:
      type: text
      substr: datepickerMode
  - id: jquery-datepicker
    desc: jQuery UI datepicker prototype marker
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Datepicker.prototype
  - id: semantic-ui-api
    desc: Semantic UI API settings marker
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'semantic.{0,40}loadingDuration|loadingDuration.{0,80}apiSettings'
      case_insensitive: true
composite_rules:
  - id: vendored-ui-library
    desc: LocalCDN vendored UI library resource
    crit: notable
    conf: 0.98
    all:
      - id: resource-path
    any:
      - id: angular-datepicker
      - id: jquery-datepicker
      - id: semantic-ui-api
