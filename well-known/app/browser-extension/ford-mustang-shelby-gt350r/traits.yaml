# Ford Mustang Shelby Gt350r — Chrome Web Store browser theme.
# Theme-only manifest; the PNG is NTP wallpaper, not a packed payload.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, json, crx]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: display-name
    desc: Ford Mustang Shelby Gt350r theme name
    for: [chrome-manifest, json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: Ford Mustang Shelby Gt350r

  - id: extension-id
    desc: Ford Mustang Shelby Gt350r store id
    for: [crx]
    conf: 0.99
    if:
      type: value
      path: crx.extension_id
      exact: piobiephcifmkfdjakejpbolgednjabh

  - id: ntp-wallpaper
    desc: Ford Mustang Shelby NTP wallpaper name
    for: [chrome-manifest, json]
    conf: 0.97
    if:
      type: text
      substr: ford_mustang_shelby_gt350r.png
