# PrismGuard is an open-source prompt-injection firewall. It downloads a
# checksum-pinned ONNX classifier, verifies offline licenses, and optionally
# serves an HTTP API; these are declared product capabilities.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, text]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: PrismGuard Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: prismguard
  - id: package-name
    desc: PrismGuard distribution metadata name
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^Name:\s*prismguard\s*$'
  - id: source-package-path
    desc: PrismGuard source package path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])prismguard([\\/]|$)'
  - id: firewall-summary
    desc: PrismGuard prompt-injection firewall summary
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?i)prompt injection firewall'
  - id: upstream-repository
    desc: PrismGuard upstream repository reference
    for: [pkginfo, text]
    if:
      type: text
      exact: github.com/insightitsGit/PrismGuard

composite_rules:
  - id: prismguard-tool
    desc: Recognized PrismGuard prompt-injection firewall
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-name
      - id: firewall-summary
