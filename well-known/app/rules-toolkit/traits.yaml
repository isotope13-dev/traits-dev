# HelloRentCar Rules Toolkit — corporate AI rules monitor for Hellobike.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: rules-toolkit-vsix-name
    desc: Rules Toolkit VSIX archive name
    if:
      type: path
      regex: '(?i)HelloRentCar\.rules-toolkit'

  - id: rules-toolkit-package-name
    desc: Rules Toolkit extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"rules-toolkit"'

  - id: rules-toolkit-publisher
    desc: HelloRentCar VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"HelloRentCar"'

  - id: hellobike-rent-ai-endpoint
    desc: Hellobike rent-ai service endpoint marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      substr: rent-ai.hellobike.cn

composite_rules:
  - id: rules-toolkit-vscode-extension
    desc: HelloRentCar Rules Toolkit AI rules monitor extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: rules-toolkit-publisher
    any:
      - id: rules-toolkit-vsix-name
      - id: rules-toolkit-package-name
      - id: hellobike-rent-ai-endpoint
