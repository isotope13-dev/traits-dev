# sysmonitor — LiChenxi remote Linux system monitor extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: sysmonitor-vsix-name
    desc: sysmonitor VSIX archive name
    if:
      type: path
      regex: '(?i)LiChenxi\.sysmonitor'

  - id: sysmonitor-package-name
    desc: sysmonitor extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"sysmonitor"'

  - id: sysmonitor-publisher
    desc: LiChenxi VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"LiChenxi"'

  - id: sysmonitor-panel-marker
    desc: sysmonitor webview panel identifier
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: sysmonitor.panel

composite_rules:
  - id: sysmonitor-vscode-extension
    desc: LiChenxi remote Linux sysmonitor extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: sysmonitor-publisher
    any:
      - id: sysmonitor-vsix-name
      - id: sysmonitor-package-name
      - id: sysmonitor-panel-marker
