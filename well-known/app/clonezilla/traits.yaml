defaults:
  platforms: [unix]
  for: [shell, perl, text, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-manifest
    desc: Clonezilla package manifest identity
    if:
      type: text
      regex: '(?im)^pkgname\s*=\s*clonezilla\s*$'

  - id: package-purpose
    desc: Clonezilla disk-imaging package description
    if:
      type: text
      regex: '(?i)partition and disk imaging/cloning program'

  - id: archive-name
    desc: Clonezilla package archive name
    for: [tar]
    if:
      type: basename
      regex: '(?i)^clonezilla-[0-9][^/]*\.pkg\.tar\.zst$'

  - id: clonezilla-script-name
    desc: Clonezilla OCS script filename
    for: [shell, perl, text]
    if:
      type: basename
      regex: '(?i)^ocs-[^/]+$'

  - id: clonezilla-script-marker
    desc: Clonezilla project name marker
    for: [shell, perl, text]
    if:
      type: text
      regex: '(?i)clonezilla'

  - id: drbl-locale-catalog-header
    desc: Clonezilla DRBL message catalog header
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      substr: '# Written by Steven Shiau <steven _at_ clonezilla org>'

  - id: translated-locale-catalog-header
    desc: Clonezilla translated locale catalog header
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '(?im)^# .{0,80}translated to .{0,80} by .{0,120}clonezilla/'

composite_rules:
  - id: clonezilla-script-context
    desc: Recognized Clonezilla OCS disk-imaging script context
    crit: exception
    conf: 0.99
    all:
      - id: clonezilla-script-name
      - id: clonezilla-script-marker

  - id: drbl-locale-catalog-context
    desc: Recognized Clonezilla DRBL message catalog context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: clonezilla-script-marker
    any:
      - id: drbl-locale-catalog-header
      - id: translated-locale-catalog-header

  - id: package-context
    desc: Recognized Clonezilla disk-imaging package context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-manifest
      - id: package-purpose
