defaults:
  platforms: [unix]
  for: [gem, ruby, shell]
  crit: notable
  conf: 0.99
  size_max: 100000000

traits:
  - id: gem-name
    desc: Pindo RubyGem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: pindo

  - id: source-tree
    desc: Pindo Ruby source tree member
    for: [ruby]
    if:
      type: path
      regex: '(?i)(^|[\\/])pindo([\\/]|$)'

  - id: executable-basename
    desc: Pindo executable basename
    for: [ruby, shell]
    if:
      type: path
      basename: true
      exact: pindo

composite_rules:
  - id: application-context
    desc: Pindo mobile release tool
    crit: notable
    conf: 0.99
    any:
      - id: gem-name
      - id: source-tree
      - id: executable-basename
