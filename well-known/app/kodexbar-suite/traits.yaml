# KodexBar Suite — KDE Plasma AI quota widget and CLI tooling (AUR/source).
defaults:
  platforms: [unix]
  for: [shell, python, javascript, json, text]
  crit: notable
  conf: 0.98

traits:
  - id: aur-pkgname
    desc: KodexBar Suite AUR package name
    for: [shell, text]
    if:
      type: text
      regex: '(?m)^pkgname=kodexbar-suite\s*$'
  - id: plasma-plasmoid-id
    desc: KodexBar Plasma plasmoid ID
    for: [json, javascript, text]
    if:
      type: text
      substr: 'org.kde.plasma.kodexbar'
  - id: upstream-repository
    desc: KodexBar Suite upstream repository URL
    if:
      type: text
      substr: 'https://github.com/Karasowl/KodexBar-Suite'
