# IDS peak IPL: IDS Imaging Development Systems industrial image processing.
# The wheel contains the Python bindings and the vendor's native IPL library.
defaults:
  platforms: [unix, windows]
  for: [python, elf, whl, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: ids_peak_ipl wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ids_peak_ipl

  - id: package-name
    desc: ids_peak_ipl package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: ids-peak-ipl

  - id: author-contact
    desc: IDS Imaging author contact
    for: [pkginfo]
    if:
      type: value
      path: author-email
      regex: '(?i)support@ids-imaging\.com(>|\s|$)'

  - id: native-api-symbols
    desc: IDS peak IPL exported API symbols
    for: [elf]
    if:
      type: symbol
      kind: export
      regex: '^PEAK_IPL_'

  - id: python-binding-marker
    desc: IDS peak IPL Python binding marker
    for: [python]
    if:
      type: text
      regex: '_ids_peak_ipl_python_interface|from\s+ids_peak_ipl'

composite_rules:
  - id: package-context
    desc: IDS peak IPL imaging package
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives, whl]
    all:
      - id: wheel-distribution
      - id: native-api-symbols
