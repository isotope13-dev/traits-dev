# Stream Live is a browser extension that tracks followed live streams across
# named streaming services. Its user-driven OAuth/channel imports and first-
# party telemetry are expected extension behavior.
defaults:
  platforms: [unix, windows]
  for: [xpi, chrome-manifest, javascript, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: firefox-extension-id
    desc: Stream Live Firefox extension ID
    for: [chrome-manifest]
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: 8ed624ac-fa11-4c6b-9722-2756ac30d913
  - id: first-party-service-host
    desc: Stream Live first-party service host
    for: [chrome-manifest, javascript, json, text]
    if:
      type: text
      substr: streamlive.fadme.dev
  - id: localized-product-name
    desc: Stream Live extension product name
    for: [json, text]
    if:
      type: text
      regex: '(?i)Stream Live.{0,100}(notification|live stream)'

composite_rules:
  - id: stream-live-extension
    desc: Recognized Stream Live browser extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: metadata/file/format::web-extension-root-manifest
      - id: firefox-extension-id
      - id: first-party-service-host
