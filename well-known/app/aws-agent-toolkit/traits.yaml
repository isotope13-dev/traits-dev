# AWS Agent Toolkit for AWS is an official AWS skills/plugin source tree.
# These identity observations do not suppress its real AWS API, credential,
# installer, or script-execution behavior.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell, python, text, json, archives]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: AWS Agent Toolkit source-tree member
    if:
      type: path
      regex: '(^|[\\/])agent-toolkit-for-aws-[0-9a-f]{40}([\\/]|$)'

  - id: project-heading
    desc: AWS Agent Toolkit project heading
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: Agent Toolkit for AWS

  - id: upstream-repository
    desc: AWS Agent Toolkit upstream repository
    for: [markdown, text, json]
    if:
      type: text
      substr: github.com/aws/agent-toolkit-for-aws

  - id: aws-core-plugin-marker
    desc: AWS Agent Toolkit aws-core plugin marker
    for: [markdown, shell, python, text, json]
    if:
      type: text
      regex: '(^|[\\/])aws-core([\\/]|$)'

  - id: aws-agents-plugin-marker
    desc: AWS Agent Toolkit aws-agents plugin marker
    for: [markdown, shell, python, text, json]
    if:
      type: text
      regex: '(^|[\\/])aws-agents([\\/]|$)'

  - id: aws-data-analytics-plugin-marker
    desc: AWS Agent Toolkit data-analytics plugin marker
    for: [markdown, shell, python, text, json]
    if:
      type: text
      regex: '(^|[\\/])aws-data-analytics([\\/]|$)'

  - id: aws-devsecops-plugin-marker
    desc: AWS Agent Toolkit devsecops plugin marker
    for: [markdown, shell, python, text, json]
    if:
      type: text
      regex: '(^|[\\/])aws-agents-for-devsecops([\\/]|$)'

composite_rules:
  - id: official-toolkit-identity
    desc: Official AWS Agent Toolkit source identity
    crit: notable
    conf: 0.99
    any:
      - id: project-heading
      - id: upstream-repository
      - id: source-tree-member
      - id: aws-core-plugin-marker
      - id: aws-agents-plugin-marker
      - id: aws-data-analytics-plugin-marker
      - id: aws-devsecops-plugin-marker
