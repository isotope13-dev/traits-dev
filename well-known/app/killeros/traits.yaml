# KillerOS is a Pi coding-agent extension with subagents, hooks, and a custom
# TUI. Process spawning and optional shell hooks are expected product behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: pi-coding-agent-import
    desc: Imports Pi coding-agent extension API
    for: [javascript, typescript]
    if:
      type: text
      substr: "@earendil-works/pi-coding-agent"

  - id: upstream-repository
    desc: KillerOS upstream repository reference
    if:
      type: text
      substr: github.com/KyrosHendrix/pi-KillerOS

  - id: hooks-config-filename
    desc: KillerOS hooks configuration filename
    if:
      type: text
      substr: killeros-hooks.json

composite_rules:
  - id: killeros-pi-extension
    desc: KillerOS Pi coding-agent extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: pi-coding-agent-import
      - id: upstream-repository
