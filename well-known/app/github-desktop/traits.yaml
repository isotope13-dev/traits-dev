defaults:
  platforms: [windows, unix]
  for: [nupkg, javascript]

traits:
  - id: github-desktop-delta-package
    desc: GitHub Desktop delta package context
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)GitHubDesktop-[0-9][^\\/]*\.nupkg'
  - id: github-desktop-copilot-member
    desc: GitHub Desktop Copilot member context
    crit: notable
    conf: 0.99
    size_max: 500000000
    for: [javascript, pe]
    if:
      type: path
      regex: '(?i)copilot[\\/]'
