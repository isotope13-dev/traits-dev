defaults:
  platforms: [unix, windows]
  for: [go, javascript, typescript, markdown, text, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: nagobot-product-name
    desc: Nagobot product name marker
    if:
      type: text
      regex: '(?i)\bnagobot\b'

  - id: nagobot-github-repo
    desc: linanwx/nagobot repository reference
    conf: 0.99
    if:
      type: text
      substr: github.com/linanwx/nagobot

  - id: nagobot-agent-shell-tool
    desc: Nagobot agent shell execution tool
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: 'Execute a shell command and return its output'

  - id: nagobot-service-installation
    desc: Nagobot service installation support
    conf: 0.99
    for: [go]
    if:
      type: text
      regex: '(?i)nagobot\.service'

  - id: nagobot-windows-run-key-installer
    desc: Nagobot Windows Run key autostart installer
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: Register for auto-start on logon via Registry Run key

composite_rules:
  - id: nagobot-identity
    desc: Nagobot multi-channel AI agent identity
    conf: 0.97
    all:
      - id: nagobot-github-repo
      - id: nagobot-product-name

  - id: nagobot-windows-autostart-context
    desc: Nagobot Windows per-user autostart installer
    crit: exception
    conf: 0.99
    all:
      - id: nagobot-product-name
      - id: nagobot-windows-run-key-installer
