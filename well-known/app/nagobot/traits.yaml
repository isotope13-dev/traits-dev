defaults:
  platforms: [unix, windows]
  for: [go, javascript, typescript, markdown, text, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: nagobot-product-name
    desc: Nagobot product name marker
    if:
      type: text
      regex: '(?i)\bnagobot\b'

  - id: nagobot-github-repo
    desc: linanwx/nagobot repository reference
    conf: 0.99
    if:
      type: text
      substr: github.com/linanwx/nagobot

composite_rules:
  - id: nagobot-identity
    desc: Nagobot multi-channel AI agent identity
    conf: 0.97
    any:
      - id: nagobot-github-repo
      - id: nagobot-product-name
