defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.99
  size_min: 1
  size_max: 300000000

traits:
  - id: clean-master-product-marker
    desc: 360 Clean Master product marker
    if:
      type: text
      substr: 360CleanMaster
      section: rdata

  - id: clean-master-component-marker
    desc: 360 Clean Master speedup component marker
    if:
      type: text
      substr: 360CleanSpeedup.exe
      section: rdata

composite_rules:
  - id: 360-clean-master-installer-identity
    desc: Signed 360 Clean Master installer bundle
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/360-file-guard::qihoo-360-authenticode-signer
      - id: clean-master-product-marker
      - id: clean-master-component-marker
