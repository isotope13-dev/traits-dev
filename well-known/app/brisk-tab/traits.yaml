# Brisk is a new-tab and search extension published for brisk-tab.com. The
# identity requires both the manifest name and the vendor host permission so a
# generic extension named "Brisk" does not match by itself.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]

traits:
  - id: manifest-name
    desc: Brisk extension manifest name
    crit: notable
    conf: 1.0
    if:
      type: value
      path: name
      exact: Brisk

  - id: vendor-host
    desc: Brisk Tab vendor host permission
    crit: notable
    conf: 1.0
    if:
      type: value
      path: host_permissions
      regex: 'brisk-tab\.com'

composite_rules:
  - id: brisk-tab-extension
    desc: Recognized Brisk Tab Chrome extension
    crit: notable
    conf: 1.0
    for: [crx]
    scope: archive
    all:
      - id: manifest-name
      - id: vendor-host
