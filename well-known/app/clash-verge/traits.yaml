# Clash Verge Rev — open-source Tauri GUI for the Mihomo/Clash proxy
# core (https://github.com/clash-verge-rev/clash-verge-rev). Ships an
# NSIS installer, a Rust service helper (clash-verge-service), and a
# MetaCubeX mihomo sidecar. Unsigned Rust service builds trip generic
# inline-PE / debugger composites; identify the product before treating
# those as hostile loaders.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  size_min: 50000
  size_max: 80000000

traits:
  - id: service-pdb
    desc: Clash Verge service PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)^clash_verge_service\.pdb$'

  - id: service-install-pdb
    desc: Clash Verge service-install PDB
    size_max: 5000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)^clash_verge_service_install\.pdb$'

  - id: service-uninstall-pdb
    desc: Clash Verge service-uninstall PDB
    size_max: 5000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)^clash_verge_service_uninstall\.pdb$'

  - id: app-pdb
    desc: Clash Verge GUI PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)^clash_verge\.pdb$'

  - id: product-name
    desc: Clash Verge product name
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Clash Verge$'

  - id: file-description-rev
    desc: Clash Verge Rev file description
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^Clash Verge( Rev)?$'

  - id: company-rev
    desc: Clash Verge Rev company field
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Clash Verge Rev$'

  - id: service-standalone-mode
    desc: Clash Verge service standalone mode
    if:
      type: text
      exact: 'Clash Verge Service - Standalone Mode'
      section: .rdata

  - id: service-named-pipe
    desc: Clash Verge service named pipe path
    if:
      type: text
      substr: '\\.\pipe\clash-verge-service'
      section: .rdata

  - id: service-ipc-source-path
    desc: Clash Verge service-ipc CI source path
    if:
      type: text
      substr: 'clash-verge-service-ipc\src\'
      section: .rdata

  - id: bundle-identifier
    desc: Clash Verge Rev Tauri bundle id
    if:
      type: text
      exact: io.github.clash-verge-rev.clash-verge-rev
      section: .rdata

  - id: update-endpoint
    desc: Clash Verge Rev GitHub update endpoint
    if:
      type: text
      substr: 'github.com/clash-verge-rev/clash-verge-rev/releases/download/updater/'
      section: .rdata

  - id: service-display-name
    desc: Clash Verge Service display name
    size_max: 5000000
    if:
      type: text
      exact: 'Clash Verge Service helps to launch clash core'
      section: .rdata

composite_rules:
  - id: clash-verge-service-identity
    desc: Clash Verge service binary identity
    crit: notable
    conf: 0.99
    any:
      - id: service-pdb
      - id: service-install-pdb
      - id: service-uninstall-pdb
      - id: service-standalone-mode
      - id: service-named-pipe
      - id: service-ipc-source-path
      - id: service-display-name

  - id: clash-verge-app
    desc: Clash Verge Rev desktop application
    crit: notable
    conf: 0.99
    any:
      - id: app-pdb
      - id: product-name
      - id: file-description-rev
      - id: company-rev
      - id: bundle-identifier
      - id: update-endpoint

  - id: clash-verge
    desc: Clash Verge Rev proxy client
    crit: notable
    conf: 0.99
    any:
      - id: clash-verge-service-identity
      - id: clash-verge-app
