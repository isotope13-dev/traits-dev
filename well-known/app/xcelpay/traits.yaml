# XcelPay Wallet is a published multicurrency wallet extension. Its key
# handling, transaction signing, clipboard use, and blockchain RPC traffic are
# expected wallet functions; this identity does not suppress those capability
# findings.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: XcelPay Wallet extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: XcelPay Wallet

  - id: extension-store-member
    desc: XcelPay Wallet Chrome Web Store extension member
    for: [crx, archives]
    if:
      type: path
      regex: 'ehjiblpccbknkgimiflboggcffmpphhp\.crx([\\/]|$)'

  - id: official-domain
    desc: XcelPay Wallet official service domain
    for: [javascript]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_-])xcelpay\.io([^A-Za-z0-9_.-]|$)'

composite_rules:
  - id: extension-context
    desc: Recognized XcelPay Wallet browser extension
    crit: notable
    conf: 0.99
    for: [crx, archives]
    scope: archive
    all:
      - id: manifest-name
      - id: extension-store-member
