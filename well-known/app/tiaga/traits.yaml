# tiaga — terminal AI coding agent with shell tools, MCP, and approval policies.
defaults:
  platforms: [unix, windows]
  for: [python, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: tiaga-config-dir-marker
    desc: tiaga agent config directory marker
    if:
      type: text
      substr: .seems-tiaga

  - id: tiaga-pypi-package
    desc: tiaga PyPI package identity
    if:
      type: text
      regex: '(?i)Name:\s*tiaga\b'

  - id: tiaga-approval-policy-doc
    desc: tiaga approval policy documentation
    if:
      type: text
      regex: '(?i)approval policy.{0,80}(on_request|auto_edit|yolo)'
