# Crofty is an open-source Hugo/Cloudflare publishing CLI. Its package builder
# and postinstall script are legitimate contexts for generic installer signals.
defaults:
  platforms: [unix, windows]

traits:
  - id: go-module-path
    desc: Crofty Go module identity
    crit: notable
    conf: 1.0
    for: [go.mod]
    if:
      type: text
      regex: '(?m)^module github\.com/ShiroDoromoto/crofty\s*$'

  - id: source-marker
    desc: Crofty source or installer identity
    crit: notable
    conf: 0.99
    for: [go, shell, markdown]
    if:
      type: text
      regex: '(?i)(github\.com/ShiroDoromoto/crofty|crofty\.site/install\.sh|Application Support/crofty)'

composite_rules:
  - id: official-source-tree
    desc: Official Crofty source archive context
    crit: exception
    conf: 1.0
    for: [zip]
    scope: archive
    all:
      - id: go-module-path
      - id: source-marker
