# Codezy — mt-codezy intelligent debugging assistant VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: codezy-vsix-name
    desc: Codezy VSIX archive name
    if:
      type: path
      regex: '(?i)mt-codezy\.codezy'

  - id: codezy-package-name
    desc: Codezy extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"codezy"'

  - id: codezy-publisher
    desc: mt-codezy VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"mt-codezy"'

  - id: codezy-command-marker
    desc: Codezy VS Code command namespace marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      regex: '(?i)"command"\s*:\s*"codezy\.'

  - id: codezy-claude-code-dependency
    desc: Codezy bundles Anthropic Claude Code dependency
    for: [package.json, json]
    crit: notable
    if:
      type: text
      regex: '(?i)"@anthropic-ai/claude-code"\s*:'

composite_rules:
  - id: codezy-vscode-extension
    desc: Codezy intelligent debugging VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: codezy-publisher
    any:
      - id: codezy-vsix-name
      - id: codezy-package-name
      - id: codezy-command-marker
      - id: codezy-claude-code-dependency
