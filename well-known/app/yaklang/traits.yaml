# Yaklang ships a serialized gob documentation index containing API examples.
# The examples intentionally cover offensive/security operations, but the gob
# is data and is not itself an executable script.
defaults:
  platforms: [unix, windows]
  for: [vbs, data]
  size_max: 20000000

traits:
  - id: yakdoc-document-helper
    desc: Yaklang serialized documentation helper
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: DocumentHelper

  - id: yakdoc-script-library-type
    desc: Yaklang serialized script library type
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: yakdoc.ScriptLib

  # The HTTP-template package is a legitimate Yaklang scanner component.
  # Keep the package declaration as a weak fragment and require both stable
  # Yaklang imports before asserting the source identity.
  - id: httptpl-package-declaration
    desc: Declares the Yaklang HTTP template package
    crit: component
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: 'package httptpl'

  - id: httptpl-lowhttp-import
    desc: Imports Yaklang raw HTTP support
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: import
      exact: github.com/yaklang/yaklang/common/utils/lowhttp

  - id: httptpl-codec-import
    desc: Imports Yaklang template codec support
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: import
      exact: github.com/yaklang/yaklang/common/yak/yaklib/codec

  - id: httptpl-nuclei-parser-api
    desc: Parses Nuclei templates into Yak templates
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: CreateYakTemplateFromNucleiTemplateRaw

  - id: httptpl-executor-api
    desc: Executes Yaklang HTTP templates
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: 'func (y *YakTemplate) ExecWithUrl'

  - id: httptpl-signature-validation-api
    desc: Validates a Yaklang HTTP template signature
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: 'func (y *YakTemplate) CheckTemplateRisks'

  - id: httptpl-request-generation-api
    desc: Generates raw Yaklang HTTP requests
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: text
      substr: 'func (c *YakRequestBulkConfig) GenerateRaw'

  # These APIs are the implementation's stable Nuclei-template rendering
  # boundary.  They distinguish the scanner's request mutation engine from a
  # generic HTTP client that merely happens to contain an HTTP request string.
  - id: httptpl-nuclei-tag-fuzzer
    desc: Fuzzes Nuclei template tags into requests
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: symbol
      kind: call
      exact: FuzzNucleiTag

  - id: httptpl-nuclei-tag-renderer
    desc: Renders Nuclei template variables
    crit: notable
    conf: 0.99
    for: [go]
    if:
      type: symbol
      kind: call
      exact: QuickFuzzNucleiTag

  - id: httptpl-tcp-template-executor
    desc: Executes parsed TCP template requests
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: symbol
      kind: call
      exact: tcpReq.Execute

composite_rules:
  - id: yaklang-documentation-index-context
    desc: Yaklang serialized API documentation index
    crit: exception
    conf: 0.99
    all:
      - id: yakdoc-document-helper
      - id: yakdoc-script-library-type

  - id: yaklang-httptpl-source
    desc: Yaklang HTTP template implementation source
    crit: notable
    conf: 0.99
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-codec-import

  - id: yaklang-nuclei-template-parser
    desc: Yaklang Nuclei-compatible template parser
    crit: notable
    conf: 0.99
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-nuclei-parser-api

  - id: yaklang-httptpl-executor
    desc: Yaklang HTTP template request executor
    crit: notable
    conf: 0.99
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-executor-api

  - id: yaklang-httptpl-signature-validation
    desc: Yaklang HTTP template signature validation implementation
    crit: notable
    conf: 0.99
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-signature-validation-api

  - id: yaklang-httptpl-request-generation
    desc: Yaklang HTTP template payload request generation implementation
    crit: notable
    conf: 0.99
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-request-generation-api

  - id: yaklang-httptpl-template-fuzzing
    desc: Yaklang Nuclei template request fuzzing
    crit: notable
    conf: 0.99
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-nuclei-tag-fuzzer
      - id: httptpl-nuclei-tag-renderer

  - id: yaklang-httptpl-tcp-executor
    desc: Yaklang TCP template request executor
    crit: notable
    conf: 0.98
    for: [go]
    all:
      - id: httptpl-package-declaration
      - id: httptpl-lowhttp-import
      - id: httptpl-tcp-template-executor

  # This workflow is a legitimate scanner feature: obtain an out-of-band
  # callback address and inspect DNS events after executing a template.  Keep
  # the app identity leg so the generic OOB capabilities are not relabeled as
  # Yaklang when they occur in another program.
  - id: yaklang-httptpl-oob-dns-workflow
    desc: Yaklang template OOB DNS callback workflow
    crit: notable
    conf: 0.98
    for: [go]
    all:
      - id: yaklang-httptpl-executor
      - id: micro-behaviors/communications/dns/oob::oob-address-request
      - id: micro-behaviors/communications/dns/oob::dns-oob-event-check
