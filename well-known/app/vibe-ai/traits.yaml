# Vibe AI — SeedProd WordPress MCP connector plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: vibe-ai-plugin-header
    desc: Vibe AI WordPress plugin header
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*Vibe AI'

  - id: vibe-ai-text-domain
    desc: Vibe AI text domain marker
    if:
      type: text
      regex: '(?im)^\s*\*\s*Text Domain:\s*vibe-ai\s*$'

  - id: vibe-ai-author-uri
    desc: Vibe AI wpvibe.ai author URI marker
    crit: notable
    if:
      type: text
      substr: https://wpvibe.ai

  - id: wpvibe-rest-namespace
    desc: WPVibe REST API namespace marker
    crit: notable
    for: [php]
    if:
      type: text
      substr: wpvibe/v1

  - id: wpvibe-class-prefix
    desc: WPVibe plugin class namespace
    crit: notable
    for: [php]
    if:
      type: text
      substr: class WPVibe_REST

  - id: wpvibe-file-edit-routes
    desc: WPVibe authenticated file-edit REST routes
    crit: notable
    for: [php]
    if:
      type: text
      regex: "register_rest_route\\(\\s*\\$namespace,\\s*'/file/(edit|write|delete)'"

  - id: wpvibe-draft-theme-sandbox
    desc: WPVibe draft-theme sandbox state
    crit: notable
    for: [php]
    if:
      type: text
      substr: wpvibe_draft_theme

  - id: wpvibe-cli-allowlist
    desc: WPVibe native command allowlist
    crit: notable
    for: [php]
    if:
      type: text
      substr: 'const ALLOWLIST = array('

composite_rules:
  - id: vibe-ai-wordpress-plugin
    desc: Vibe AI WordPress MCP connector plugin
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: vibe-ai-plugin-header
    any:
      - id: vibe-ai-text-domain
      - id: wpvibe-rest-namespace
      - id: wpvibe-class-prefix
