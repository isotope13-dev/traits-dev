# bumper-guard — disclosed AI coding-agent safety daemon with install-time
# autostart wiring (detached daemon + optional hidden Windows Startup launcher).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, text]

traits:
  - id: bumper-guard-homepage
    desc: bumper-guard product homepage
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://bumper-guard.pages.dev

composite_rules:
  - id: bumper-guard-disclosed-install-context
    desc: bumper-guard package install autostart wiring
    crit: exception
    for: [package.json, npm, tar, javascript]
    all:
      - id: well-known/app/ai/coding-agent/bumper-guard::bumper-guard-package-name
      - id: metadata/package/scripts/lifecycle::postinstall-runs-bumper-installer
      - id: bumper-guard-homepage
