# Tencent AI / WorkBuddy sandbox CLI (containerization and isolation helper for AI workflows).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 268435456

traits:
  - id: env-marker
    desc: Tencent AI sandbox backend env marker
    for: [elf]
    if:
      type: text
      substr: WB_SANDBOX_BACKEND
      section: rodata
  - id: env-marker-pe
    desc: Tencent AI sandbox backend env marker PE
    for: [macho, pe, dll]
    if:
      type: text
      substr: WB_SANDBOX_BACKEND
      section: .rdata
  - id: helper-source-path
    desc: Tencent AI sandbox-cli source path
    for: [elf]
    if:
      type: text
      substr: sandbox/src/bin/sandbox_cli.rs
      section: rodata
  - id: helper-source-path-pe
    desc: Tencent AI sandbox-cli source path PE
    for: [macho, pe, dll]
    if:
      type: text
      substr: sandbox/src/bin/sandbox_cli.rs
      section: .rdata
  - id: paths-marker
    desc: Tencent AI sandbox paths marker
    for: [elf]
    if:
      type: text
      substr: SandboxPaths.sandbox_home
      section: rodata
  - id: paths-marker-pe
    desc: Tencent AI sandbox paths marker PE
    for: [macho, pe, dll]
    if:
      type: text
      substr: SandboxPaths.sandbox_home
      section: .rdata
  - id: npm-package-name
    desc: Tencent AI sandbox-cli package name
    for: [package.json]
    size_min: 10
    size_max: 1048576
    if:
      type: value
      path: name
      regex: '^@tencent-ai/sandbox-cli(-.+)?$'

composite_rules:
  - id: tencent-sandbox-context
    desc: Tencent AI sandbox context
    crit: exception
    conf: 0.99
    any:
      - id: env-marker
      - id: env-marker-pe
      - id: helper-source-path
      - id: helper-source-path-pe
      - id: paths-marker
      - id: paths-marker-pe
      - id: npm-package-name
