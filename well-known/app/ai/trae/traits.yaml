# trae_vm.dll is the Trae/MarsCode agent sandbox helper. Its PDB path is
# aha_sbox_v1\...\trae_vm.pdb. It imports thread-context and remote-memory
# APIs because it is a sandbox, not because it is a dropper.
defaults:
  size_min: 100000
  size_max: 8000000
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
traits:
  - id: trae-vm-basename
    desc: Trae sandbox VM helper DLL
    crit: notable
    conf: 0.95
    if:
      type: basename
      exact: trae_vm.dll
      case_insensitive: true
  - id: trae-vm-sdk-basename
    desc: Trae sandbox VM SDK DLL
    crit: notable
    conf: 0.95
    if:
      type: basename
      exact: vm_sdk.dll
      case_insensitive: true
  - id: trae-vm-core-basename
    desc: Trae sandbox VM core DLL
    crit: notable
    conf: 0.95
    if:
      type: basename
      exact: vm_core.dll
      case_insensitive: true
  # ctx-cli is the agent's filesystem helper (cat, grep, ls, write). It is an
  # unsigned Rust CLI, so Winsock, getaddrinfo, and IsDebuggerPresent imports
  # are the runtime, not a debugger-gated loader.
  - id: trae-ctx-cli-basename
    desc: Trae context filesystem CLI
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: basename
      exact: ctx-cli.exe
      case_insensitive: true
  # aha_sbox_v1 is the sandbox build that produces aiep_vm, aiep_ipc, and
  # run_helper. Process-name tables and Windows API names in those binaries
  # are the VM surface.
  - id: aha-sandbox-pdb
    desc: Aha sandbox build path
    crit: notable
    conf: 0.95
    if:
      type: raw
      section: rdata
      substr: aha_sbox_v1
