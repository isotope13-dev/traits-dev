# Lean AI — VS Code agentic AI extension with Python backend.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, python, vsix, archives]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: lean-ai VS Code extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: lean-ai

  - id: publisher
    desc: lean-ai VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: lean-ai

  - id: lean-ai-vsix-basename
    desc: lean-ai VSIX archive basename context
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^lean-ai\.lean-ai-.*\.vsix$'

  - id: github-repo
    desc: shunobies/lean-ai GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: shunobies/lean-ai

  - id: browser-search-module-path
    desc: Lean AI browser_search.py module path
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: path
      regex: '(?i)lean_ai/tools/browser_search\.py$'

composite_rules:
  - id: lean-ai-vscode-extension
    desc: Lean AI agentic VS Code extension
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: publisher
    any:
      - id: package-name
      - id: lean-ai-vsix-basename
      - id: github-repo

  - id: lean-ai-browser-search-selenium
    desc: Lean AI Selenium headless search tool
    crit: exception
    conf: 0.99
    for: [python]
    scope: file
    all:
      - id: browser-search-module-path
      - id: well-known/lib/development/selenium::python-webdriver-import
