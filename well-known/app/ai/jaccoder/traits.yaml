# JacCoder — Jaseci Jac AI coding agent VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, archives, vsix]
  crit: notable
  conf: 0.99

traits:
  - id: jaccoder-package-name
    desc: JacCoder VS Code extension package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jaccoder

  - id: jaseci-labs-publisher
    desc: Jaseci Labs extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: jaseci-labs

  - id: jac-coder-github-repo
    desc: JacCoder GitHub repository
    if:
      type: text
      substr: github.com/jaseci-labs/vscode-jac-coder

  - id: jaccoder-pip-bootstrap
    desc: JacCoder get-pip bootstrap for Jac runtime
    for: [javascript, typescript]
    if:
      type: text
      substr: jaccoder-get-pip.py

composite_rules:
  - id: jaccoder-extension-context
    desc: Recognized JacCoder Jaseci AI coding extension
    crit: exception
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: jaccoder-package-name
    any:
      - id: jaseci-labs-publisher
      - id: jac-coder-github-repo
      - id: jaccoder-pip-bootstrap
