# easyeda-agent — EasyEDA Pro automation skill and CLI (zhoushoujianwork/easyeda-agent).
defaults:
  platforms: [unix, windows]
  for: [markdown, text, powershell, python, shell, zip]
  crit: notable
  conf: 0.98

traits:
  - id: easyeda-agent-github-raw-install
    desc: easyeda-agent GitHub raw install script URL
    for: [markdown, text, powershell]
    if:
      type: text
      substr: raw.githubusercontent.com/zhoushoujianwork/easyeda-agent

  - id: easyeda-cli-marker
    desc: easyeda CLI command marker
    for: [markdown, text, python, shell]
    if:
      type: text
      regex: '\beasyeda (health|update)\b'
