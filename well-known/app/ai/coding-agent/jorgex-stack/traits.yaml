# jorgex-stack — shared skills, subagents, and native integrations configuration
# for Claude Code, Codex, OpenCode, and Pi (github.com/jorgehn98/jorgex-stack).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: jorgex-stack-package-name
    desc: jorgex-stack npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jorgex-stack

  - id: jorgex-stack-github-repo
    desc: jorgex-stack GitHub repository URL
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: github.com/jorgehn98/jorgex-stack

  - id: jorgex-stack-cli-name
    desc: jorgex-stack CLI command name
    for: [javascript, typescript, package.json, text]
    if:
      type: text
      substr: jorgex-stack

composite_rules:
  - id: jorgex-stack-source
    desc: jorgex-stack coding-agent harness source context
    any:
      - id: jorgex-stack-package-name
      - id: jorgex-stack-github-repo
      - id: jorgex-stack-cli-name
