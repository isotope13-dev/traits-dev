# @firedmosquito831/my-claude-code is published from the same-named GitHub
# repository. The scoped npm name is an intentional publisher identity, not a
# clone-and-rename inconsistency.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: My Claude Code npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@firedmosquito831/my-claude-code"

  - id: npm-package-name
    desc: My Claude Code npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@firedmosquito831/my-claude-code"

  - id: repository-url
    desc: My Claude Code official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/FiredMosquito831/my-claude-code(\.git)?$'

  - id: npm-repository-url
    desc: My Claude Code npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/FiredMosquito831/my-claude-code(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official My Claude Code package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official My Claude Code repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official My Claude Code package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
