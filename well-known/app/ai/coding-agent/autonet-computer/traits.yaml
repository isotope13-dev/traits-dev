# Autonet Computer — Decentralized AI alignment network with an agent framework.
# Host discovery inspects local tools, keys, and env credential names to expose
# them to agent execution under owner control.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, text, markdown, json, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: autonet-computer-wheel-distribution
    desc: autonet-computer PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: autonet_computer

  - id: autonet-computer-package-metadata
    desc: autonet-computer package metadata Name
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*autonet[-_]computer\s*$'

  - id: autonet-computer-repo-url
    desc: autonet-computer repository URL
    for: [python, text, pkginfo, markdown]
    if:
      type: text
      substr: github.com/autonet-code/node

  - id: autonet-computer-homepage-url
    desc: autonet-computer homepage URL
    for: [python, text, pkginfo, markdown]
    if:
      type: text
      substr: autonet.computer

  - id: atn-claude-bridge-package-name
    desc: ATN Claude bridge package name
    for: [package.json, json, text]
    if:
      type: text
      substr: atn-claude-bridge

  - id: autonet-host-discovery-path
    desc: Autonet host discovery module path
    for: [python, whl]
    if:
      type: path
      regex: '(?i)runtime[\\/]host_discovery'

  - id: autonet-env-credential-probe-class
    desc: Autonet EnvCredentialProbe class definition
    for: [python]
    if:
      type: text
      substr: "class EnvCredentialProbe(HostProbe):"

composite_rules:
  - id: autonet-computer-agent-context
    desc: Autonet Computer AI agent framework context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: autonet-computer-wheel-distribution
      - id: autonet-computer-package-metadata
      - id: autonet-computer-repo-url
      - id: autonet-computer-homepage-url
      - id: atn-claude-bridge-package-name
      - id: autonet-host-discovery-path
      - id: autonet-env-credential-probe-class
    needs: 2
