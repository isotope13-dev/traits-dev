defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, plist, json, package.json, archives, elf]

traits:
- id: package-name
  desc: Claude Code VS Code extension package name
  crit: notable
  for: [package.json]
  if:
    type: value
    path: name
    exact: claude-code
- id: publisher
  desc: Anthropic Claude Code publisher
  crit: notable
  for: [package.json]
  if:
    type: value
    path: publisher
    exact: Anthropic
- id: native-product
  desc: Claude Code native product
  crit: notable
  for: [pe, dll]
  size_min: 1000000
  size_max: 400000000
  if:
    type: value
    path: pe.version.product_name
    exact: Claude Code
- id: native-publisher
  desc: Anthropic Claude Code publisher
  crit: notable
  for: [pe, dll]
  size_min: 1000000
  size_max: 400000000
  if:
    type: value
    path: pe.version.company
    exact: Anthropic PBC
- id: native-cli-member
  desc: Claude Code native CLI member
  crit: notable
  conf: 0.99
  for: [pe]
  size_max: 400000000
  if:
    type: path
    regex: '(^|[\\/])(native-binary|package)[\\/]claude\.exe$'
- id: native-linux-cli-member
  desc: Official Claude Code bundled Linux CLI member
  crit: notable
  conf: 0.99
  for: [elf]
  platforms: [unix]
  size_min: 1000000
  size_max: 300000000
  if:
    type: basename
    exact: claude
- id: native-linux-audio-member
  desc: Official Claude Code Linux audio addon member
  crit: notable
  conf: 0.99
  for: [elf]
  platforms: [unix]
  size_max: 5000000
  if:
    type: basename
    exact: audio-capture.node
- id: native-audio-member
  desc: Claude Code audio addon member
  crit: notable
  conf: 0.99
  for: [pe, dll]
  size_max: 5000000
  if:
    type: path
    regex: 'audio-capture[\\/]x64-win32[\\/]audio-capture\.node$'
# Anchored on the `@anthropic-ai` publisher scope (or the `anthropic-ai-`
# prefix npm pack flattens it to), NOT on a bare `claude-code-` path
# substring. `claude-code-` is an ecosystem name prefix shared by hundreds of
# unaffiliated community packages (`@wengine-ai/claude-code-router-cli`,
# `claude-code-templates`, ...), so the substring form identified any of them
# as Anthropic's product. It is also reachable from the `unless:` of several
# hostile composites via the `well-known/app/ai/coding-agent/anthropic-claude-code` directory
# reference, which made "name the package claude-code-anything" a suppression
# bypass.
- id: anthropic-scoped-package-member-path
  desc: Path inside an @anthropic-ai/claude-code package
  crit: notable
  conf: 0.99
  for: [scripts, source, markdown, text, plist, json, package.json, archives, javascript, pe, dll]
  size_max: 300000000
  if:
    type: path
    regex: '(@anthropic-ai[\\/]|anthropic-ai-)claude-code[-\\/.]'
- id: bundled-module-path
  desc: Anthropic Claude Code bundled module marker
  crit: notable
  conf: 0.99
  for: [javascript]
  size_max: 300000000
  if:
    type: path
    regex: 'claude-code[\\/]cli\.js$'
- id: native-npm-package-name
  desc: Claude Code platform npm package name
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    regex: '^@anthropic-ai/claude-code'
- id: macos-native-signed-binary
  desc: Signed Anthropic Claude Code macOS binary
  crit: notable
  conf: 0.99
  for: [macho]
  size_min: 1000000
  size_max: 400000000
  if:
    type: value
    path: macho.code_signature.identifier
    exact: com.anthropic.claude-code
# `claude-code` alone as a basename substring matched every third-party
# archive with the product name in its filename. Requiring the version token
# to follow `claude-code` immediately keeps Anthropic's own release archives
# (`claude-code-2.0.1.tgz`, `anthropic-ai-claude-code-2.0.1.tgz`) and rejects
# `claude-code-<word>-<version>` community forks and wrappers.
- id: source-archive
  desc: Anthropic Claude Code versioned source archive
  crit: baseline
  conf: 0.99
  for: [archive, tar, zip]
  if:
    type: path
    basename: true
    regex: '^(anthropic-ai-)?claude-code-v?[0-9]'
composite_rules:
- id: package-identity
  desc: Official Anthropic Claude Code VS Code extension identity
  crit: notable
  conf: 0.99
  scope: outer
  all:
  - id: package-name
  - id: publisher
- id: source-release
  desc: Anthropic Claude Code source release
  crit: notable
  conf: 0.99
  any:
  - id: anthropic-scoped-package-member-path
  - id: source-archive
  - id: bundled-module-path
  - id: native-npm-package-name
  - id: native-cli-member
