defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: official-npm-name
    desc: Official Claude Code npm package name
    if:
      type: value
      path: name
      exact: '@anthropic-ai/claude-code'
  - id: anthropic-author-string
    desc: Package claims Anthropic as author
    if:
      type: value
      path: author
      regex: '(?i)^Anthropic\s*<support@anthropic\.com>$'
  - id: official-project-homepage
    desc: Package points to Claude Code repository
    if:
      type: value
      path: homepage
      regex: '^https://github\.com/anthropics/claude-code/?$'
  - id: claude-command-entry
    desc: Package declares claude command
    if:
      type: value
      path: bin.claude
      regex: '.+'
