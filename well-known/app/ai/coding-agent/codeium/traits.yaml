# Codeium's language server: the Go binary behind the Windsurf editor and
# Google Antigravity (built from third_party/jetski). It embeds the product's
# protobuf packages under the `exa.` namespace, which the extension-side
# JavaScript client shares. Go keeps these in .rodata (ELF, Mach-O
# __TEXT,__rodata) or .rdata (PE).
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.97
  size_max: 524288000

traits:
  - id: exa-language-server-protos
    desc: Codeium language-server protobuf packages
    for: [elf, macho]
    if:
      type: text
      regex: '\bexa\.(codeium_common_pb|language_server_pb)\b'
      section: rodata
  - id: exa-language-server-protos-pe
    desc: Codeium language-server protobufs (Windows)
    for: [pe]
    if:
      type: text
      regex: '\bexa\.(codeium_common_pb|language_server_pb)\b'
      section: rdata
  - id: exa-language-server-protos-js
    desc: Codeium language-server client protobufs
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bexa\.(codeium_common_pb|language_server_pb)\b'
