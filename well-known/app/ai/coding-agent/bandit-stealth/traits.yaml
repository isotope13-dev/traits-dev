# Bandit Stealth — Burtson Labs local-first AI coding agent for VS Code/Cursor.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, archives, vsix]
  crit: notable
  conf: 0.99

traits:
  - id: bandit-stealth-package-name
    desc: Bandit Stealth VS Code extension name
    for: [package.json]
    if:
      type: value
      path: name
      exact: bandit-stealth

  - id: burtson-labs-publisher
    desc: Burtson Labs extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: BurtsonLabs

  - id: bandit-stealth-github
    desc: Bandit agent framework GitHub repo
    if:
      type: text
      substr: github.com/Burtson-Labs/bandit-agent-framework

composite_rules:
  - id: bandit-stealth-extension-context
    desc: Recognized Burtson Labs Bandit Stealth agent
    crit: exception
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: bandit-stealth-package-name
    any:
      - id: burtson-labs-publisher
      - id: bandit-stealth-github
