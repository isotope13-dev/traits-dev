# Agentgate — AI coding agent gateway (HansKristoffer/agentgate)
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, javascript, npm, tar, zip]
  crit: baseline
  conf: 0.98
  size_max: 524288000

traits:
  - id: agentgate-native-binary-name
    desc: Agentgate native binary name
    crit: notable
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: basename
      regex: '(?i)^agentgate(\.exe)?$'

  - id: agentgate-binary-path
    desc: Bundled Agentgate binary path
    crit: notable
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]agentgate(\.exe)?$'

  - id: agentgate-platform-package-name
    desc: Agentgate platform npm package name
    crit: notable
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^agentpool-(darwin|linux|windows)-(x64|arm64)$'

  - id: agentgate-github-repo
    desc: Agentgate GitHub repository reference
    crit: notable
    for: [elf, macho, pe, javascript, text, package.json]
    if:
      type: text
      substr: HansKristoffer/agentgate

  - id: agentgate-service-command
    desc: Agentgate service management command
    crit: notable
    for: [elf, macho, pe, javascript]
    if:
      type: text
      substr: agentgate service start

composite_rules:
  - id: agentgate-cli
    desc: Agentgate coding agent gateway CLI
    crit: notable
    conf: 0.98
    any:
      - id: agentgate-native-binary-name
      - id: agentgate-platform-package-name
      - id: agentgate-github-repo
      - id: agentgate-service-command

  - id: agentgate-daemon-service-context
    desc: Agentgate daemon service management context
    crit: exception
    conf: 0.98
    for: [macho, elf, pe]
    any:
      - id: agentgate-service-command
      - id: agentgate-github-repo
