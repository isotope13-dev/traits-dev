# Frely AI coding agent CLI -- official distribution at https://frely.cloud
defaults:
  platforms: [macos]
  for: [package.json, macho, text, json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 500000000

traits:
  - id: frely-package-name
    desc: Frely CLI package name in package.json
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@frelyhq/cli-'

  - id: frely-github-repo
    desc: Frely CLI GitHub repository
    if:
      type: text
      substr: github.com/FrelyHQ/frely-cli

  - id: frely-cloud-domain
    desc: Frely cloud service domain reference
    if:
      type: text
      substr: frely.cloud

composite_rules:
  - id: frely-cli-context
    desc: Frely AI coding agent CLI context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, macho, package.json]
    scope: outer
    any:
      - id: frely-package-name
      - id: frely-github-repo
      - id: frely-cloud-domain
