# Omnigent — desktop client and harness for AI coding agents
# (github.com/omnigent-ai/omnigent).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: omnigent-github-repo
    desc: Omnigent GitHub repository URL
    if:
      type: text
      substr: github.com/omnigent-ai/omnigent

  - id: omnigent-package-name
    desc: Omnigent package name reference
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^omnigent(-desktop)?'

  - id: omnigent-python-import
    desc: Omnigent Python harness package import
    for: [python]
    if:
      type: text
      regex: '(from|import) omnigent'

composite_rules:
  - id: omnigent-agent-source
    desc: Omnigent coding-agent harness source context
    any:
      - id: omnigent-github-repo
      - id: omnigent-package-name
      - id: omnigent-python-import
