# qwenpaw-tui — stub TUI package for QwenPaw (Eric Zhu). Wheel is a
# versioned placeholder with no runtime network or exec behavior.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: qwenpaw-tui PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: qwenpaw-tui

  - id: wheel-distribution
    desc: qwenpaw_tui wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: qwenpaw_tui

  - id: tui-docstring
    desc: QwenPaw TUI package docstring
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: A TUI for QwenPaw
