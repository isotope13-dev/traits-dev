# @ooples/token-optimizer-mcp — MCP server with documented multi-agent hooks.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: token-optimizer-mcp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@ooples/token-optimizer-mcp"

  - id: npm-package-name
    desc: token-optimizer-mcp npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@ooples/token-optimizer-mcp"

  - id: repository-url
    desc: token-optimizer-mcp official GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/ooples/token-optimizer-mcp(\.git)?$'

  - id: npm-repository-url
    desc: token-optimizer-mcp npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/ooples/token-optimizer-mcp(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official token-optimizer-mcp npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: archive-context
    desc: token-optimizer-mcp MCP hook installer context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: metadata/package/description/function::description-mcp-agent-clients
