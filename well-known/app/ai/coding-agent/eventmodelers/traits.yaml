# Eventmodelers CLI (github.com/Nebulit-GmbH/Eventmodelers-Build-Kits) — real-time
# Claude agent and skills for Claude Code across multiple stacks, including the
# Ralph autonomous build-kit agent runner loop.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Eventmodelers CLI npm package name
    for: [package.json]
    size_max: 10485760
    if:
      type: value
      path: name
      exact: "@eventmodelers/cli"

  - id: ralph-agent-runner-script
    desc: Eventmodelers Ralph agent runner script marker
    for: [shell]
    size_max: 1048576
    if:
      type: text
      substr: "Called by ralph.sh with cwd already set"
