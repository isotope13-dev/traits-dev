# ai-sqlx — natural-language-to-SQL CLI (ai-sql). Calls OpenAI chat
# completions and verifies USDT license payments via Etherscan.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: wheel-distribution
    desc: ai_sqlx Python wheel distribution
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: ai_sqlx

  - id: package-path
    desc: ai_sql package path
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])ai_sql/'

  - id: usdt-license-address
    desc: ai-sql USDT license payment address
    for: [python, text]
    conf: 0.98
    if:
      type: text
      substr: '0xafc32581a9e4ea30aa03cb8ef5879c2366d35f46'

  - id: console-entrypoint
    desc: ai-sqlx console script entrypoint
    for: [text]
    conf: 0.97
    if:
      type: text
      regex: '(?m)^ai-sqlx\s*=\s*ai_sql\.cli:main_entry\s*$'
