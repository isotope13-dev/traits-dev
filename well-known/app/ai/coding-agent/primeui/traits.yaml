# PrimeUI Agent Setup (@primeuicom/agent-setup) — Shared AI setup presets, config,
# and detection helpers for PrimeUI tooling.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: primeui-workspace-import
    desc: PrimeUI agent setup package import
    for: [javascript, typescript]
    if:
      type: text
      substr: "@primeuicom/"

  - id: primeui-cli-name
    desc: PrimeUI agent setup CLI name
    if:
      type: text
      substr: primeui-agent-setup

  - id: primeui-package-name
    desc: PrimeUI npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: ^@primeuicom/

composite_rules:
  - id: primeui-agent-source
    desc: PrimeUI agent setup source context
    any:
      - id: primeui-workspace-import
      - id: primeui-cli-name
      - id: primeui-package-name
