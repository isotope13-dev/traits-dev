# 0xray — multi-agent orchestration framework for OpenCode, Hermes, Grok Build,
# and OpenClaw (0xRayAI/xray). Postinstall deploys AGENTS.md, git hooks, and
# agent bridges into consumer projects as documented product setup.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: 0xray npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 0xray

  - id: upstream-repository
    desc: 0xRayAI xray upstream repository
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: github.com/0xRayAI/xray

  - id: managed-agents-marker
    desc: 0xray managed AGENTS.md marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 0xray-managed

  - id: consumer-bridge-postinstall-marker
    desc: 0xray consumer bridge postinstall marker
    for: [javascript, typescript]
    if:
      type: text
      substr: installAllBridges

  - id: mcp-knowledge-skill-marker
    desc: 0xray MCP knowledge skill base class
    for: [javascript, typescript]
    if:
      type: text
      substr: XrayKnowledgeSkillBase

composite_rules:
  - id: archive-context
    desc: 0xray documented multi-agent setup context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: managed-agents-marker
