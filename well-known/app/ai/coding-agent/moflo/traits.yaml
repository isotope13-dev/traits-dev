# MoFlo — Claude Code agent orchestration toolkit (npm: moflo, eric-cielo/moflo).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: npm-package-name
    desc: MoFlo npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: moflo
  - id: npm-archive-name
    desc: MoFlo npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: moflo
  - id: homepage-url
    desc: MoFlo product homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      substr: cielolimitada.com/moflo
  - id: repository-url
    desc: MoFlo GitHub repository reference
    for: [javascript, typescript]
    if:
      type: text
      substr: github.com/eric-cielo/moflo
  - id: flo-bin-entry
    desc: MoFlo flo CLI bin mapping
    for: [package.json]
    if:
      type: text
      regex: '"flo"\s*:\s*"bin/cli\.js"'
composite_rules:
  - id: moflo-package-context
    desc: MoFlo Claude Code orchestration toolkit package
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: npm-package-name
      - id: npm-archive-name
      - id: homepage-url
      - id: repository-url
      - id: flo-bin-entry
