# AgentGUI is a local web interface that orchestrates multiple AI coding CLIs.
# Product identity is intentionally notable, not an exception: a compromised
# AgentGUI release must still be convicted by its malicious behavior.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: AgentGUI npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: agentgui

  - id: package-name
    desc: AgentGUI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agentgui

  - id: upstream-repository
    desc: AgentGUI upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/AnEntrypoint/AgentGUI(\.git)?([/?#]|$)'

  - id: acp-client-identity
    desc: AgentGUI ACP client identity
    for: [javascript]
    if:
      type: text
      substr: "clientInfo: { name: 'agentgui', title: 'AgentGUI'"

composite_rules:
  - id: package-identity
    desc: Recognized AgentGUI package identity
    for: [package.json]
    all:
      - id: package-name
      - id: upstream-repository
