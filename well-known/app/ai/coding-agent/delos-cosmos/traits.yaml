# delos-so/delos-cosmos — Delos Code AI coding assistant VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, elf, macho]
  crit: notable
  conf: 0.97

traits:
  - id: delos-cosmos-package-name
    desc: Delos Cosmos VS Code extension package
    for: [package.json]
    if:
      type: value
      path: name
      exact: delos-cosmos

  - id: delos-cosmos-publisher
    desc: Delos Cosmos extension publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: delos-so

  - id: delos-intelligence-marker
    desc: Delos Intelligence product marker
    for: [javascript, typescript, package.json]
    if:
      type: text
      substr: Delos Intelligence

  - id: delos-opencode-bundle
    desc: Delos-bundled OpenCode server path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)opencode-bin[/\\]opencode(\.exe)?$'

composite_rules:
  - id: delos-cosmos-extension
    desc: Delos Code AI assistant VS Code extension
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: delos-cosmos-package-name
      - id: delos-cosmos-publisher
    any:
      - id: delos-intelligence-marker
      - id: delos-opencode-bundle
