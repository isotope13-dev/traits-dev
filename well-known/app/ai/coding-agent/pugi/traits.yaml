# Pugi — AI coding agent and SDLC automation CLI (pugi.io / pugi-io/pugi).
# Ships platform native Bun executables named `pugi` / `pugi.exe`.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, tar, zip, elf, macho, pe, package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: pugi-native-binary-name
    desc: Pugi native executable basename
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^pugi(\.exe)?$'

  - id: pugi-binary-path
    desc: Bundled Pugi binary path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]pugi(\.exe)?$'

  - id: pugi-platform-package-name
    desc: Pugi platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^@pugi/cli(-.*)?$'

  - id: pugi-github-repo
    desc: Pugi GitHub repository URL
    for: [elf, macho, pe, javascript, text]
    size_min: 64
    if:
      type: text
      substr: github.com/pugi-io/pugi

  - id: pugi-product-site
    desc: Pugi product site URL
    for: [elf, macho, pe, javascript, text]
    size_min: 64
    if:
      type: text
      regex: 'https?://([a-zA-Z0-9.-]+\.)?pugi\.io\b'

composite_rules:
  - id: pugi-binary-identity
    desc: Pugi native binary identity
    crit: notable
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    all:
      - id: pugi-native-binary-name
    any:
      - id: pugi-binary-path
      - id: pugi-github-repo
      - id: pugi-product-site

  - id: pugi-package-context
    desc: Pugi coding agent package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: pugi-binary-identity
      - id: pugi-platform-package-name
