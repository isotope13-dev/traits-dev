# Clio Coder (IOWarp) open-source coding agent, published on npm as
# @iowarp/clio-coder. The package bundles its own agent harness: a Windows
# launcher that opens the desktop app through a hidden PowerShell script, a
# detached PowerShell self-removal after uninstall, macOS seatbelt sandbox
# probes under /private/tmp, and a large orchestrator bundle whose system
# prompts instruct the model about untrusted repository content. Those are the
# product's documented behaviors; this context lowers them one step only.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: "@iowarp/clio-coder package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@iowarp/clio-coder'

  - id: repository-url
    desc: Clio Coder upstream repository URL
    for: [package.json, markdown, javascript, text]
    if:
      type: text
      substr: github.com/iowarp/clio-coder

composite_rules:
  - id: clio-coder-context
    desc: Clio Coder open-source coding agent package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: npm-package-name
      - id: repository-url
