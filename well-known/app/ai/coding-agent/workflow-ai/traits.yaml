# workflow-ai — Kanban pipeline and safety guardrails for AI coding agents.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: workflow-ai npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: workflow-ai

  - id: package-description
    desc: workflow-ai npm package description
    for: [package.json]
    if:
      type: value
      path: description
      substr: AI Agent Workflow Coordinator

  - id: wf-loader-path
    desc: workflow-ai loader script path
    for: [javascript]
    if:
      type: path
      regex: '(?i)(^|[/\\])wf-loader\.mjs$'

composite_rules:
  - id: workflow-ai-package-context
    desc: workflow-ai agent workflow context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: package-description
      - id: wf-loader-path
