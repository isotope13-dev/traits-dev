# Forgexa CLI — command-line client and AI agent runtime for the Forgexa
# software factory platform (forgexa.net, github.com/forgexa/forgexa).
defaults:
  platforms: [unix, windows]
  for: [python, shell, markdown, text]
  crit: notable
  conf: 0.95

traits:
  - id: forgexa-package-name
    desc: Forgexa CLI package name
    if:
      type: text
      substr: "forgexa_cli"

  - id: forgexa-repo-url
    desc: Forgexa GitHub repository URL
    if:
      type: text
      substr: "github.com/forgexa/forgexa"

  - id: forgexa-cli-name
    desc: Forgexa agent runtime identifier
    if:
      type: text
      substr: "Forgexa agent runtime"

  - id: forgexa-task-file
    desc: Forgexa task markdown file marker
    if:
      type: text
      substr: ".forgexa-task.md"

composite_rules:
  - id: forgexa-agent-source
    desc: Forgexa coding-agent harness source context
    any:
      - id: forgexa-package-name
      - id: forgexa-repo-url
      - id: forgexa-cli-name
      - id: forgexa-task-file
