# oh-my-openkei — agent orchestration plugin for OpenCode
# (github.com/keibn29/oh-my-openkei, fork of oh-my-opencode-slim).
# Orchestrates specialized coding sub-agents under OpenCode with configurable
# permission gates and routing, implementing the approval and agent settings.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: oh-my-openkei-package-name
    desc: oh-my-openkei npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'oh-my-openkei'

  - id: oh-my-openkei-github-repo
    desc: oh-my-openkei GitHub repository URL
    if:
      type: text
      substr: keibn29/oh-my-openkei

  - id: oh-my-openkei-log-prefix
    desc: oh-my-openkei log message prefix
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[(oh-my-openkei|oh-my-opencode)\]'

composite_rules:
  - id: oh-my-openkei-agent-source
    desc: oh-my-openkei coding-agent harness source context
    crit: exception
    any:
      - id: oh-my-openkei-package-name
      - id: oh-my-openkei-github-repo
      - id: oh-my-openkei-log-prefix
