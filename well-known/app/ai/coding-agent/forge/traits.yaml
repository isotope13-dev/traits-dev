# Forge — CLI coding agent (forgecode.dev).
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, shell, markdown]
  crit: notable
  conf: 0.95
  size_min: 64
  size_max: 524288000

traits:
  - id: forge-install-script-url
    desc: Forge CLI official install script URL
    if:
      type: text
      substr: forgecode.dev/cli

  - id: forge-product-site
    desc: Forge product site URL
    if:
      type: text
      substr: forgecode.dev
