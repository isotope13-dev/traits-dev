# Traycer — AI coding assistant VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [package.json, json, vsix-manifest, vsix, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Traycer VS Code extension package name
    for: [package.json, json, vsix-manifest]
    if:
      type: value
      path: name
      exact: traycer-vscode

  - id: publisher
    desc: Traycer VS Code publisher identity
    for: [package.json, json, vsix-manifest]
    if:
      type: value
      path: publisher
      exact: Traycer

  - id: source-repository
    desc: Traycer official GitHub repository
    for: [package.json, json]
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/traycerai/community(\.git)?$'

  - id: vsix-id
    desc: Traycer VSIX identity
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: traycer-vscode

  - id: vsix-publisher
    desc: Traycer VSIX publisher identity
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: Traycer

composite_rules:
  - id: package-identity
    desc: Official Traycer coding-assistant package identity
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
      - id: source-repository
