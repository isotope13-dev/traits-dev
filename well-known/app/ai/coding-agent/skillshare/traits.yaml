# Skillshare — multi-agent AI coding orchestrator (runkids/skillshare).
# Windows install documentation uses the standard `irm … | iex` bootstrap
# pointing to this project's own GitHub raw install.ps1 script.
defaults:
  platforms: [windows, unix]
  for: [powershell, text, markdown, go]
  crit: notable
  conf: 0.99

traits:
  - id: skillshare-github-raw-install-url
    desc: Skillshare GitHub raw install.ps1 URL
    for: [powershell, text, markdown]
    if:
      type: text
      substr: raw.githubusercontent.com/runkids/skillshare

  - id: skillshare-repo-path
    desc: Skillshare repository path
    for: [powershell, text, markdown, go, tar]
    if:
      type: path
      regex: '(?i)skillshare[-/]'

composite_rules:
  - id: skillshare-windows-installer-context
    desc: Skillshare official Windows installer bootstrap
    crit: exception
    conf: 0.99
    for: [powershell, text, markdown]
    all:
      - id: skillshare-github-raw-install-url
      - id: skillshare-repo-path
