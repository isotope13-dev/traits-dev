# @nextsparkjs/ai-workflow — ships Claude/Cursor workflow templates and syncs
# them on postinstall inside NextSpark consumer projects (documented product UX).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: NextSpark npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@nextsparkjs/(ai-workflow|cli)$'

  - id: workflow-sync-postinstall-marker
    desc: NextSpark ai-workflow postinstall sync marker
    for: [javascript]
    if:
      type: text
      substr: "@nextsparkjs/ai-workflow updated"

  - id: cli-ai-workflow-sync
    desc: NextSpark CLI AI workflow sync implementation
    for: [javascript, typescript]
    if:
      type: text
      substr: "@nextsparkjs/ai-workflow"

composite_rules:
  - id: archive-context
    desc: NextSpark documented setup context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: workflow-sync-postinstall-marker
      - id: cli-ai-workflow-sync
      - id: metadata/package/description/function::description-ai-workflow-templates
