# InBoost AI Proxy — Local inference proxy and reliability gateway for
# Claude Code, Cursor, OpenHands, and Cline (github.com/inboost-dev).
defaults:
  platforms: [unix, windows]
  for: [whl, elf, python, pkginfo, text, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: inboost_proxy PyPI wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '^inboost[-_]proxy$'

  - id: package-metadata-name
    desc: InBoost PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*inboost[-_]proxy\s*$'

  - id: native-module
    desc: InBoost native extension module
    for: [elf]
    if:
      type: text
      regex: '(?i)\b(inboost_core|inboost_proxy|inboost_router)\b'
      section: .rodata

  - id: command-safety-watchdog
    desc: InBoost command safety watchdog guardrail
    for: [elf]
    if:
      type: text
      regex: 'inboost_core\.watchdog\.(ProcessWatchdog|CommandSafetyGuardrail|check_command_safety)'
      section: .rodata

  - id: docs-portal-url
    desc: InBoost product documentation URL
    for: [python, text, markdown]
    if:
      type: text
      substr: 'inboost.pro/ai-proxy'

composite_rules:
  - id: inboost-ai-proxy
    desc: InBoost AI Proxy coding agent runtime
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: native-module
      - id: command-safety-watchdog
      - id: docs-portal-url
    needs: 2
