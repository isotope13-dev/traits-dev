# Pitroom — coding-agent delegation harness and MCP server (github.com/ATASTECH/pitroom).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: pitroom-package-name
    desc: Pitroom npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pitroom

  - id: pitroom-github-repo
    desc: Pitroom GitHub repository URL
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: github.com/ATASTECH/pitroom

  - id: pitroom-env-prefix
    desc: Pitroom environment variable reference
    for: [javascript, typescript, shell]
    if:
      type: text
      regex: '\bPITROOM_[A-Z_]+\b'

  - id: pitroom-mcp-name
    desc: Pitroom MCP server identifier reference
    for: [package.json, javascript, typescript, json]
    if:
      type: text
      substr: io.github.ATASTECH/pitroom

composite_rules:
  - id: pitroom-agent-source
    desc: Pitroom coding-agent harness source context
    any:
      - id: pitroom-package-name
      - id: pitroom-github-repo
      - id: pitroom-env-prefix
      - id: pitroom-mcp-name
