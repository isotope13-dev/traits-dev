# oh-my-agent (npm `oh-my-agent`, first-fluke/oh-my-agent) is an open-source CLI
# harness and orchestrator for AI coding agents (Claude Code, Antigravity, OpenCode, Codex).
# Its LaunchAgent service is a periodic Serena Reaper task (`dev.oma.serena-reaper`)
# that cleans up orphaned Serena LSP processes, paired with multi-agent config deployment.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: oh-my-agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'oh-my-agent'

  - id: upstream-repository
    desc: oh-my-agent upstream repository reference
    if:
      type: text
      regex: 'github\.com/first-fluke/oh-my-agent(\.git)?([/\\s"''`?#]|$)'

  - id: reaper-service-label
    desc: oh-my-agent Serena Reaper service label
    for: [javascript, typescript]
    if:
      type: text
      substr: 'dev.oma.serena-reaper'

composite_rules:
  - id: official-package
    desc: Official oh-my-agent package identity
    crit: exception
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: reaper-service-label
