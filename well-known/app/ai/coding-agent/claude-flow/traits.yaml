# Claude Flow / Ruflo — agent orchestration platform and multi-agent harnesses
# (github.com/ruvnet/ruflo), published on npm under the @claude-flow/* scope.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: claude-flow-workspace-import
    desc: Claude Flow workspace package import
    for: [javascript, typescript]
    if:
      type: text
      substr: "@claude-flow/"

  - id: claude-flow-github-repo
    desc: Claude Flow GitHub repository URL
    if:
      type: text
      substr: ruvnet/ruflo

  - id: claude-flow-package-name
    desc: Claude Flow npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: ^@claude-flow/

composite_rules:
  - id: claude-flow-agent-source
    desc: Claude Flow coding-agent source context
    any:
      - id: claude-flow-workspace-import
      - id: claude-flow-github-repo
      - id: claude-flow-package-name
