# @herjarsa/omo-meta-governor — OpenCode meta-governance plugin.
# Ships agent skills, MCP tooling, and documented postinstall bootstrap.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: npm-package-name
    desc: omo-meta-governor npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@herjarsa/omo-meta-governor"

  - id: github-repository
    desc: omo-meta-governor GitHub repository
    if:
      type: text
      substr: github.com/herjarsa/omo-meta-governor

  - id: opencode-plugin-config-path
    desc: OpenCode omo-meta-governor plugin config path
    if:
      type: text
      substr: .config/opencode/plugins/omo-meta-governor

composite_rules:
  - id: omo-meta-governor-identity
    desc: OpenCode omo-meta-governor plugin identity
    crit: notable
    conf: 0.98
    for: [package.json]
    all:
      - id: npm-package-name
      - id: github-repository
