# Pullfrog — autonomous GitHub Actions coding bot and agent harness
# (github.com/pullfrog/pullfrog), published as the pullfrog npm package / GitHub Action.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: pullfrog-package-name
    desc: Pullfrog npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pullfrog

  - id: pullfrog-github-repo
    desc: Pullfrog GitHub repository URL
    if:
      type: text
      substr: github.com/pullfrog/pullfrog

  - id: pullfrog-mcp-name
    desc: Pullfrog MCP server identifier reference
    for: [javascript, typescript]
    if:
      type: text
      substr: pullfrogMcpName

  - id: pullfrog-brand-text
    desc: Pullfrog agent harness source brand marker
    for: [javascript, typescript]
    if:
      type: text
      substr: "# written by pullfrog"

composite_rules:
  - id: pullfrog-agent-source
    desc: Pullfrog coding-agent harness source context
    any:
      - id: pullfrog-package-name
      - id: pullfrog-github-repo
      - id: pullfrog-mcp-name
      - id: pullfrog-brand-text
