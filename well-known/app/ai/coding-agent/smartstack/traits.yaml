# SmartStack — Claude Code automation toolkit for GitFlow, EF Core, and prompts.
# npm: @atlashub/smartstack-cli, repository: https://dev.azure.com/AtlasHub/SmartStack
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: package-name
    desc: SmartStack CLI npm package name
    crit: notable
    for: [package.json]
    size_max: 1000000
    if:
      type: value
      path: name
      exact: "@atlashub/smartstack-cli"

  - id: npm-package-name
    desc: SmartStack CLI npm archive name
    crit: notable
    for: [npm]
    size_max: 100000000
    if:
      type: value
      path: npm.name
      exact: "@atlashub/smartstack-cli"

  - id: smartstack-repo-url
    desc: SmartStack repository URL
    crit: notable
    for: [package.json, javascript, typescript]
    size_max: 10000000
    if:
      type: text
      substr: "dev.azure.com/AtlasHub/SmartStack"

  - id: smartstack-bin-config
    desc: SmartStack binary mapping in package manifest
    crit: notable
    for: [package.json]
    size_max: 1000000
    if:
      type: text
      regex: '"smartstack"\s*:\s*"\./dist/index\.js"'

composite_rules:
  - id: smartstack-package-context
    desc: SmartStack Claude Code automation toolkit package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: npm-package-name
      - id: smartstack-repo-url
      - id: smartstack-bin-config
