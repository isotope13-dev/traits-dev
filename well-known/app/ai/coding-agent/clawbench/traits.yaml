# ClawBench — AI Workbench, United Across Devices (github.com/xulongzhe / npm: @xulongzhe/clawbench).
defaults:
  platforms: [unix, android, windows]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 300000000

traits:
  - id: clawbench-package-name
    desc: ClawBench platform npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@xulongzhe/clawbench'

  - id: clawbench-workbench-doc
    desc: ClawBench AI workbench description
    for: [package.json, elf, macho, pe, go]
    if:
      type: text
      substr: "ClawBench — AI Workbench"

  - id: clawbench-binary-name
    desc: ClawBench binary name
    for: [elf, macho, pe]
    if:
      type: basename
      exact: clawbench

composite_rules:
  - id: clawbench-cli
    desc: ClawBench AI workbench distribution
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: clawbench-package-name
      - id: clawbench-workbench-doc
      - id: clawbench-binary-name
    needs: 2
