# Satelle — AI developer platform host daemon and coding agent host binding (Microck/satelle)
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, npm, tar, zip]
  crit: baseline
  conf: 0.98
  size_max: 524288000

traits:
  - id: satelle-native-binary-name
    desc: Satelle native binary name
    crit: notable
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: basename
      regex: '(?i)^satelle(\.exe)?$'

  - id: satelle-launchagent-label
    desc: Satelle host daemon LaunchAgent service label
    crit: notable
    for: [macho, elf, pe, text]
    if:
      type: text
      substr: dev.microck.satelle

  - id: satelle-github-repo
    desc: Satelle GitHub repository reference
    crit: notable
    for: [elf, macho, pe, text, package.json]
    if:
      type: text
      substr: Microck/satelle

composite_rules:
  - id: satelle-cli
    desc: Satelle developer platform host CLI
    crit: notable
    conf: 0.98
    any:
      - id: satelle-native-binary-name
      - id: satelle-launchagent-label
      - id: satelle-github-repo

  - id: satelle-daemon-service-context
    desc: Satelle host daemon service management context
    crit: exception
    conf: 0.98
    for: [macho, elf, pe]
    any:
      - id: satelle-launchagent-label
      - id: satelle-github-repo
