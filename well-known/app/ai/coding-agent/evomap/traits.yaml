# EvoMap Evolver — open-source self-evolving agent engine (https://github.com/EvoMap/evolver).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Evolver npm package name
    for: [package.json]
    if:
      type: text
      regex: '"name":\s*"@evomap/evolver(-[a-z]+)?"'

  - id: github-repo
    desc: Evolver GitHub repository URL
    if:
      type: text
      regex: '(?i)EvoMap/evolver'

  - id: evomap-domain
    desc: EvoMap domain reference
    if:
      type: text
      substr: evomap.ai

  - id: credential-acl-script-env
    desc: Evolver credential ACL script env variable
    for: [javascript, typescript]
    if:
      type: text
      substr: EVOMAP_CREDENTIAL_ACL_SCRIPT

  - id: evolver-dist-path
    desc: Evolver packages distribution output path
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)(^|[\\/])evolver-[a-z]+[\\/]dist\b'

composite_rules:
  - id: evomap-evolver-package
    desc: EvoMap Evolver AI agent self-evolution engine package
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: github-repo
      - id: evomap-domain
      - id: credential-acl-script-env
      - id: evolver-dist-path
