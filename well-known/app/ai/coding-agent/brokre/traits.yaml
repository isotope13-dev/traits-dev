# brokre — Furowu local credential broker MCP npm launcher (packages/brokre-mcp).
# Postinstall stages the native CLI and may append a marked PATH line to shell rc;
# that is documented product behavior, not an undisclosed implant.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, zip]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: brokre npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: brokre

  - id: furowu-repository
    desc: Official Furowu/brokre Git repository
    for: [package.json]
    if:
      type: text
      regex: '(?i)github\.com[/:]Furowu/brokre'

  - id: shell-path-marker
    desc: Documented brokre MCP shell PATH marker comment
    for: [javascript]
    if:
      type: text
      substr: '# brokre CLI (brokre-mcp)'

composite_rules:
  - id: brokre-mcp-archive-context
    desc: Official brokre MCP npm launcher package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: npm-package-name
    any:
      - id: furowu-repository
      - id: shell-path-marker
