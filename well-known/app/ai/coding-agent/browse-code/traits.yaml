# browse-code (PyPI browse_code) is a published MIT local coding-agent
# bridge: a Chrome/Firefox content script talks to a FastAPI server on
# localhost and runs user-authorized tool calls against the workspace.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, json, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: browse_code distribution name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: browse_code

  - id: localhost-bridge-url
    desc: Browse Code localhost agent bridge URL
    for: [javascript]
    if:
      type: text
      substr: 'http://127.0.0.1:5505'

  - id: home-data-dir
    desc: Browse Code user data directory
    for: [python]
    if:
      type: text
      substr: '.browse_code'

  - id: gecko-addon-id
    desc: Browse Code Firefox add-on id
    for: [json]
    if:
      type: text
      substr: browse-code@dedeep007.github.io
