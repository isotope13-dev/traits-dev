# Ozaiya CLI is a published remote agent daemon for Claude Code and related
# tools. Credential reads, screenshots, HTTP polling, and LaunchAgent install
# are expected product behavior for remote terminal management.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ozaiya CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ozaiya-cli

  - id: upstream-repository
    desc: Ozaiya upstream repository reference
    for: [package.json, javascript, typescript, markdown]
    if:
      type: text
      regex: 'github\.com/tangojet/ozaiya(\.git)?([/\\s"''`?#]|$)'

  - id: product-summary
    desc: Ozaiya agent daemon product summary
    for: [package.json, markdown]
    if:
      type: text
      regex: '(?i)Ozaiya agent daemon'

  - id: api-server-host
    desc: Ozaiya API server hostname
    for: [javascript, typescript]
    if:
      type: text
      substr: api.ozaiya.com

  - id: daemon-launchd-label
    desc: Ozaiya daemon LaunchAgent bundle identifier
    for: [javascript, typescript]
    if:
      type: text
      substr: com.ozaiya.daemon

  - id: package-member-context
    desc: Ozaiya CLI package member identity
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: ozaiya-cli

  - id: package-member-summary
    desc: Ozaiya CLI package member description
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::description
      regex: '(?i)Ozaiya agent daemon'

  - id: archive-member-context
    desc: Ozaiya CLI npm archive member path
    if:
      type: path
      regex: '(^|[\\/])ozaiya-cli-[0-9][0-9A-Za-z.-]*([\\/]|$)'

  - id: bundle-package-name-marker
    desc: Ozaiya CLI name in bundled JavaScript
    for: [javascript, typescript]
    if:
      type: text
      regex: '"name":\s*"ozaiya-cli"'

composite_rules:
  - id: package-identity
    desc: Ozaiya CLI package identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: upstream-repository
      - id: package-member-context
      - id: archive-member-context

  - id: benign-runtime-context
    desc: Recognized Ozaiya CLI application runtime context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-member-context
      - id: package-member-summary

  - id: benign-archive-context
    desc: Recognized Ozaiya CLI npm archive context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: archive-member-context
      - id: upstream-repository

  - id: daemon-launchd-context
    desc: Ozaiya daemon LaunchAgent service context
    crit: exception
    conf: 0.99
    all:
      - id: daemon-launchd-label
      - id: api-server-host

  - id: benign-application-context
    desc: Ozaiya CLI bundled application context
    crit: exception
    conf: 0.99
    all:
      - id: api-server-host
    any:
      - id: upstream-repository
      - id: archive-member-context
      - id: bundle-package-name-marker
      - id: package-member-context
