# amicus — multi-model LLM council and parallel AI window for Claude Code
# (BourbonDog/amicus). npm install registers bundled MCP/skills into the
# user's Claude config and optionally provisions Electron; that is documented
# product setup, not a supply-chain dropper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: amicus npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: amicus

  - id: mcp-registry-name
    desc: amicus MCP registry identifier
    for: [package.json]
    if:
      type: value
      path: mcpName
      exact: io.github.BourbonDog/amicus

  - id: upstream-repository
    desc: BourbonDog amicus upstream repository
    for: [javascript, typescript, markdown, text, json, package.json]
    if:
      type: text
      substr: github.com/BourbonDog/amicus

  - id: claude-register-module
    desc: amicus Claude MCP registration module
    for: [javascript, typescript]
    if:
      type: text
      substr: '@module claude-register'

  - id: electron-custody-module
    desc: amicus Electron artifact custody module
    for: [javascript, typescript]
    if:
      type: text
      substr: '@module sidecar/electron-custody'

composite_rules:
  - id: archive-context
    desc: amicus documented Claude Code agent setup context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: mcp-registry-name
      - id: upstream-repository
      - id: claude-register-module
      - id: electron-custody-module
