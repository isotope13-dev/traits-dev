# Paniolo — repository intelligence, harness tooling and MCP server for coding agents (paniolo.ai).
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 500000000

traits:
  - id: paniolo-npm-package-name
    desc: Paniolo npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@paniolo/cli(-[a-z0-9-]+)?$'

  - id: paniolo-pdb
    desc: Paniolo CLI debug symbols reference
    for: [pe]
    size_min: 10000000
    size_max: 300000000
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: paniolo.pdb

  - id: paniolo-product-site
    desc: Paniolo product site URL
    for: [pe, package.json, javascript, typescript, markdown]
    if:
      type: text
      substr: paniolo.ai

  - id: paniolo-config-filename
    desc: Paniolo configuration filename reference
    for: [pe, package.json, javascript, typescript, markdown]
    if:
      type: text
      substr: paniolo.config.json

composite_rules:
  - id: paniolo-cli-binary
    desc: Paniolo coding agent harness CLI binary
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      - id: paniolo-pdb
    any:
      - id: paniolo-product-site
      - id: paniolo-config-filename

  - id: paniolo-package-context
    desc: Paniolo CLI package distribution context
    crit: exception
    conf: 0.99
    for: [pe, package.json, npm]
    any:
      - id: paniolo-npm-package-name
      - id: paniolo-cli-binary
