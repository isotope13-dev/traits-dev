# claude-multiacc — open-source Claude Code / Codex subscription pooling (gowalk-public).
# postinstall runs install.sh on global installs: launchd/cron agents, optional rsync
# sync of the operator's own OAuth pool to a configured server — not covert exfil.
defaults:
  platforms: [unix]
  for: [package.json, npm, shell, javascript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: claude-multiacc npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: claude-multiacc

  - id: npm-package-name
    desc: claude-multiacc npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: claude-multiacc

  - id: repository-url
    desc: claude-multiacc official GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/gowalk-public/claude-multiacc(\.git)?$'

  - id: npm-repository-url
    desc: claude-multiacc npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/gowalk-public/claude-multiacc(\.git)?$'

  - id: path-shim-header
    desc: claude-multiacc PATH shadow shim script header
    for: [shell]
    if:
      type: text
      substr: claude-multiacc-shim

  - id: claude-pool-path
    desc: Claude accounts pool path or env var
    for: [shell, markdown, text]
    if:
      type: text
      regex: '(?i)(\.claude-accounts|CLAUDE_ACCOUNTS_(ROOT|DIR))'

  - id: codex-pool-path
    desc: Codex accounts pool path or env var
    for: [shell, markdown, text]
    if:
      type: text
      regex: '(?i)(\.codex-accounts|CODEX_ACCOUNTS_(ROOT|DIR))'

  - id: pool-manager-script
    desc: Multiacc pool manager shell script header
    for: [shell]
    if:
      type: text
      regex: '(?i)(codex-accounts —|claude-accounts —).{0,40}multi-account pool'

composite_rules:
  - id: official-package-identity
    desc: Official claude-multiacc npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official claude-multiacc repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: archive-context
    desc: claude-multiacc subscription pooling addon context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: path-shim-header
      - id: claude-pool-path
      - id: codex-pool-path
      - id: pool-manager-script
