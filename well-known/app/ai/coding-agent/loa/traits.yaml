# Loa — agent-driven development framework for Claude Code
# (github.com/0xHoneyJar/loa).
defaults:
  platforms: [windows, unix]
  for: [shell, markdown, text, data]
  crit: notable
  conf: 0.95

traits:
  - id: loa-source-path
    desc: Loa Claude Code agent framework path
    if:
      type: path
      regex: '(?i)(^|[\\/])loa(@|-[0-9]|$|[\\/])'

  - id: loa-github-repo
    desc: Loa GitHub repository URL
    if:
      type: text
      substr: "github.com/0xHoneyJar/loa"

composite_rules:
  - id: loa-coding-agent-context
    desc: Loa coding-agent framework source context
    any:
      - id: loa-source-path
      - id: loa-github-repo
