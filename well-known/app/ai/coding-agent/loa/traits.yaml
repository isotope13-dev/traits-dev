# Loa / League of Agents — agent-driven development framework
# (github.com/0xHoneyJar/loa, github.com/mujeeb-k/league-of-agents).
defaults:
  platforms: [windows, unix]
  for: [shell, markdown, text, data, javascript, typescript, json]
  crit: notable
  conf: 0.95

traits:
  - id: loa-source-path
    desc: Loa Claude Code agent framework path
    if:
      type: path
      regex: '(?i)(^|[\\/])(loa|leagueofagents-cli)(@|-[0-9]|\.m?js|$|[\\/])'

  - id: loa-github-repo
    desc: Loa GitHub repository URL
    if:
      type: text
      regex: 'github\.com/(0xHoneyJar/loa|mujeeb-k/league-of-agents)|leagueofagents\.dev'

  - id: loa-bridge-header
    desc: League of Agents bridge script header
    for: [javascript, typescript]
    if:
      type: text
      substr: "League of Agents bridge"

  - id: loa-package-name
    desc: League of Agents package name
    for: [json]
    if:
      type: value
      path: name
      exact: leagueofagents-cli

composite_rules:
  - id: loa-coding-agent-context
    desc: Loa coding-agent framework source context
    any:
      - id: loa-source-path
      - id: loa-github-repo
      - id: loa-bridge-header
      - id: loa-package-name
