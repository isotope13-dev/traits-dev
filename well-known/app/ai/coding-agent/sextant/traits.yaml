# Sextant (`sxt`) — a published remote-control product for coding agents
# (sextant.top; npm `sextant-cli` plus per-platform `sextant-cli-<os>-<arch>`
# binary packages). A user installs it themselves; it runs a local daemon,
# registers a pairing room on the vendor's relay, and drives Claude Code /
# Codex on a PTY so the vendor's phone app can hold the session.
#
# By construction that is the same capability set as a PTY backdoor: WSS
# transport + creack/pty + os/exec + an AI-CLI marker + a systemd user unit.
# What separates the product from an implant is a published identity, so the
# objectives that infer a backdoor from that shape name `well-known/app/` in
# their `unless:` sets. Keyed on the vendor's own host, Go module path and CLI
# lifecycle banner — strings a repackager cannot inherit without also shipping
# the vendor's relay.
defaults:
  crit: notable
  conf: 0.98
  platforms: [linux]
  for: [elf]
  size_min: 1000000
  size_max: 200000000

traits:
  - id: sextant-relay-endpoint
    desc: Sextant vendor relay WebSocket endpoint
    if:
      type: text
      section: .rodata
      substr: 'wss://relay.sextant.top'

  - id: sextant-vendor-host
    desc: Sextant vendor host name
    # cleave decomposes `https://sextant.top/api/app/version?...` into a host
    # fact, so match the host rather than the URL path.
    if:
      type: text
      section: .rodata
      regex: '\bsextant\.top\b'

  - id: sextant-go-module-path
    desc: Sextant claude_control Go module path
    if:
      type: text
      section: .rodata
      regex: '\bclaude_control/(daemon|pincode|hook|config)\.go\b'

  - id: sextant-cli-lifecycle-help
    desc: Sextant sxt CLI lifecycle help text
    # The user-facing stop/status/logs banner: this daemon documents how to
    # turn itself off, which a covert implant does not.
    if:
      type: text
      section: .rodata
      regex: 'Stop: sxt stop.{0,20}Status: sxt status'

  - id: sextant-macho-vendor-host
    desc: Sextant vendor host in Mach-O build
    platforms: [macos]
    for: [macho]
    if:
      type: text
      section: __cstring
      regex: '\bsextant\.top\b'

  - id: sextant-npm-package-name
    desc: Sextant CLI npm package name
    # The wrapper and every per-platform binary package, so the identity holds
    # on the archive even when the payload is a Windows or macOS build.
    platforms: [linux, macos, windows]
    for: [package.json]
    size_min: 0
    size_max: 65536
    if:
      type: text
      regex: '"name":\s*"sextant-cli(-[a-z0-9]+-[a-z0-9]+)?"'

composite_rules:
  - id: sextant-remote-cli-context
    desc: Sextant remote AI CLI control product
    crit: notable
    conf: 0.98
    platforms: [linux, macos, windows]
    for: [elf, macho, package.json]
    any:
      - id: sextant-relay-endpoint
      - id: sextant-vendor-host
      - id: sextant-go-module-path
      - id: sextant-cli-lifecycle-help
      - id: sextant-macho-vendor-host
      - id: sextant-npm-package-name
