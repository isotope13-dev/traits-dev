# AgentHippo CLI — serve, chat, and deploy agent packs
# (github.com/agenthippoai/agenthippo-store), published on npm under @agenthippo-ai scope.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: agenthippo-workspace-import
    desc: AgentHippo workspace package scope
    for: [javascript, typescript]
    if:
      type: text
      substr: "@agenthippo-ai/"

  - id: agenthippo-github-repo
    desc: AgentHippo GitHub repository URL
    if:
      type: text
      substr: agenthippoai/agenthippo-store

  - id: agenthippo-package-name
    desc: AgentHippo npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: ^@agenthippo-ai/

composite_rules:
  - id: agenthippo-agent-source
    desc: AgentHippo coding-agent source context
    any:
      - id: agenthippo-workspace-import
      - id: agenthippo-github-repo
      - id: agenthippo-package-name
