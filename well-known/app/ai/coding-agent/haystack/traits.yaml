# Haystack — AI code review and verification CLI (haystackeditor/haystack-review).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Haystack CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@haystackeditor/cli"

  - id: npm-package-name
    desc: Haystack CLI npm package archive
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@haystackeditor/cli"

  - id: upstream-repository
    desc: Haystack GitHub repository
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)github\.com[/:]haystackeditor/haystack-review'

  - id: haystack-domain
    desc: Haystack official domain
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: haystackeditor.com

  - id: haystack-cli-reference
    desc: Haystack CLI package reference
    for: [javascript, typescript]
    if:
      type: text
      substr: "@haystackeditor/cli"

  - id: haystack-telemetry-runtime
    desc: Haystack telemetry runtime instrumentation
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(__haystack_telemetry|\.haystack-telemetry|haystack-node-telemetry|HAYSTACK_TELEMETRY)'

composite_rules:
  - id: haystack-cli-context
    desc: Haystack AI code review CLI context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: npm-package-name
      - id: upstream-repository
      - id: haystack-domain
      - id: haystack-cli-reference
      - id: haystack-telemetry-runtime
