# 100XPrompt — terminal AI coding assistant (100xprompt.com / nipurn123/100xprompt).
# Ships platform native binaries named `100xprompt`.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, tar, zip, elf, macho, pe, package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: 100xprompt-native-binary-name
    desc: 100XPrompt native executable basename
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^100xprompt(\.exe)?$'

  - id: 100xprompt-binary-path
    desc: Bundled 100XPrompt binary path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]100xprompt(\.exe)?$'

  - id: 100xprompt-platform-package-name
    desc: 100XPrompt platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^@100xprompt/cli(-.*)?$'

  - id: 100xprompt-github-repo
    desc: 100XPrompt GitHub repository URL
    for: [elf, macho, pe, javascript, text]
    size_min: 64
    if:
      type: text
      substr: github.com/nipurn123/100xprompt

  - id: 100xprompt-product-site
    desc: 100XPrompt product site URL
    for: [elf, macho, pe, javascript, text]
    size_min: 64
    if:
      type: text
      regex: 'https?://([a-zA-Z0-9.-]+\.)?100xprompt\.com\b'

composite_rules:
  - id: 100xprompt-binary-identity
    desc: 100XPrompt native binary identity
    crit: notable
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    all:
      - id: 100xprompt-native-binary-name
    any:
      - id: 100xprompt-binary-path
      - id: 100xprompt-github-repo
      - id: 100xprompt-product-site

  - id: 100xprompt-package-context
    desc: 100XPrompt coding agent package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: 100xprompt-binary-identity
      - id: 100xprompt-platform-package-name
