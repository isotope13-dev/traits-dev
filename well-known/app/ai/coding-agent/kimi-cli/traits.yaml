# Kimi CLI / Kimi Code (Moonshot AI) — an AI coding agent with an official
# two-stage bootstrap: the entry script at code.kimi.com self-updates by
# piping its own hosted installer into iex, and the legacy path installs the
# Python kimi-cli through Astral's uv bootstrap. The piped-IRM|IEX shape is
# the product's documented install command, not a dropper pipeline.
defaults:
  platforms: [windows, unix]
  for: [powershell, shell, batch, text, markdown]
  size_max: 1000000

traits:
  - id: official-installer-url
    desc: Kimi CLI installer origin URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'code\.kimi\.com/(kimi-code/)?install\.(ps1|sh)'

  - id: kimi-cli-product-name
    desc: Kimi CLI or Kimi Code product name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bkimi[- ]?(code|cli)\b'

composite_rules:
  - id: official-kimi-cli-installer-context
    desc: Official Kimi CLI bootstrap installer context
    crit: exception
    conf: 0.97
    all:
      - id: official-installer-url
    any:
      - id: kimi-cli-product-name
      # The legacy entry script chains to Astral's official uv bootstrap.
      - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
