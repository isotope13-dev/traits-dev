# Elementor Angie AI assistant SDK (@elementor/angie-sdk).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: angie-sdk-package-name
    desc: Elementor Angie SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@elementor/angie-sdk'

  - id: angie-sdk-npm-name
    desc: Elementor Angie SDK npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@elementor/angie-sdk'

  - id: angie-github-repository
    desc: Elementor Angie SDK GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]elementor/angie-sdk'

  - id: angie-npm-github-repository
    desc: Angie SDK npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]elementor/angie-sdk'

  - id: angie-elementor-host
    desc: Angie Elementor product host reference
    for: [javascript, typescript]
    if:
      type: text
      substr: angie.elementor.com

composite_rules:
  - id: elementor-angie-sdk-package-context
    desc: Official Elementor Angie SDK package
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: archive
    any:
      - id: angie-sdk-package-name
      - id: angie-sdk-npm-name
