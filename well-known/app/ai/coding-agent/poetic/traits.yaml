# Poetic — multi-provider AI orchestration CLI (ebrindley/Poetic).
# Runs competing provider variants (Claude, Codex, Cursor, Copilot, Gemini)
# in sandboxes and synthesizes solutions.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98
  size_min: 32
  size_max: 300000000

traits:
  - id: poetic-package-name
    desc: Poetic npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@poetic-ai/poetic(-.*)?$'

  - id: poetic-github-repo
    desc: Poetic GitHub repository URL
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: github.com/ebrindley/Poetic

  - id: poetic-orchestrator-marker
    desc: Poetic multi-provider agent orchestrator marker
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '(?i)(poetic-orchestrator|pretest:provider:(claude|copilot|cursor|codex|gemini))'

composite_rules:
  - id: poetic-package-context
    desc: Poetic AI coding orchestrator package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: poetic-package-name
      - id: poetic-github-repo

  - id: poetic-agent-context
    desc: Poetic AI coding orchestrator context
    crit: exception
    conf: 0.99
    any:
      - id: poetic-package-name
      - id: poetic-github-repo
      - id: poetic-orchestrator-marker
