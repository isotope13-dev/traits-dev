# ccdeck (npm `ccdeck`, BarganConstantin/ccdeck) — Local dashboard for
# Claude Code and Codex CLI sessions. Includes user login service registration
# via launchd/systemd/Task Scheduler so the dashboard stays available across
# reboots to monitor sessions and tool calls.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ccdeck npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'ccdeck'

  - id: upstream-repository
    desc: ccdeck upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/BarganConstantin/ccdeck(\.git)?$'

  - id: dist-archive-path
    desc: ccdeck release archive path
    if:
      type: path
      regex: '(^|[\\/])ccdeck-[0-9][^\\/]*\.tgz'

  - id: service-label-definition
    desc: ccdeck service label definition in login service
    for: [javascript]
    if:
      type: text
      substr: 'SERVICE_LABEL = "ccdeck"'

  - id: self-reference-name
    desc: ccdeck self reference in package code
    for: [javascript, markdown]
    if:
      type: text
      substr: 'ccdeck'

composite_rules:
  - id: official-package
    desc: Official ccdeck package identity
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: dist-archive-path
      - id: service-label-definition
      - id: self-reference-name
