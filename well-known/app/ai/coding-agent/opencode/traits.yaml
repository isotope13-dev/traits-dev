# OpenCode — terminal coding agent (opencode.ai / anomalyco/opencode).
# Platform npm packages ship a Bun-compiled ELF/Mach-O/PE named `opencode`.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: opencode-native-binary-name
    desc: OpenCode native binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^opencode(\.exe)?$'

  - id: opencode-binary-path
    desc: Bundled OpenCode binary path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]opencode(\.exe)?$'

  - id: opencode-platform-package-name
    desc: OpenCode platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^opencode-(linux|darwin|windows)-(x64|arm64)$'

  - id: opencode-github-repo
    desc: OpenCode GitHub repository
    for: [elf, macho, pe, javascript, text]
    size_min: 64
    if:
      type: text
      substr: anomalyco/opencode

  - id: opencode-product-site
    desc: OpenCode product site URL
    for: [elf, macho, pe, javascript, text]
    size_min: 64
    if:
      type: text
      substr: https://opencode.ai

composite_rules:
  - id: opencode-bun-runtime
    desc: OpenCode packaged Bun runtime
    crit: notable
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    scope: outer
    all:
      - id: opencode-native-binary-name
    any:
      - id: opencode-binary-path
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/binary/section/name::bun-macho-section-name
      - id: well-known/lib/runtime/bun-runtime::bun-standalone-graph-trailer
      - id: opencode-github-repo
      - id: opencode-product-site

  - id: opencode-distribution
    desc: OpenCode distribution identity
    crit: notable
    conf: 0.98
    any:
      - id: opencode-platform-package-name
      - id: opencode-github-repo
      - id: opencode-product-site
