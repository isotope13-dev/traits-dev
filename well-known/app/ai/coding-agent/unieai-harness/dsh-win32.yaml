# dsh-win32 — community npm package that fixes DeepSeek Harness on native Windows
# (sjh9714/dsh-win32). Install docs use `irm …/install.ps1 | iex` for this repo.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: dsh-win32-package-name
    desc: dsh-win32 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: dsh-win32

  - id: dsh-win32-repository-url
    desc: dsh-win32 GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/sjh9714/dsh-win32'

  - id: dsh-win32-github-raw-install-url
    desc: dsh-win32 GitHub raw install.ps1 URL
    for: [markdown, text]
    if:
      type: text
      substr: raw.githubusercontent.com/sjh9714/dsh-win32

  - id: dsh-win32-doc-repo-reference
    desc: dsh-win32 repository path in prose
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)github\.com/sjh9714/dsh-win32'

composite_rules:
  - id: dsh-win32-distribution
    desc: dsh-win32 npm package distribution identity
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-win32-package-name
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-win32-repository-url

  - id: dsh-win32-context
    desc: dsh-win32 DeepSeek Harness Windows helper context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: archive
    all:
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-win32-package-name
      - id: well-known/app/ai/coding-agent/unieai-harness::deepseek-harness-description

  - id: dsh-win32-windows-installer-context
    desc: dsh-win32 documented Windows installer bootstrap
    crit: exception
    conf: 0.99
    for: [markdown, text]
    all:
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-win32-github-raw-install-url
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-win32-doc-repo-reference
