# dsh-computer-use — Windows computer-use MCP server and UIA engine for DeepSeek Harness
# (kaczev/dsh-computer-use, upstream Yu-tao-Li/dsh-computer-use-win).
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: dsh-computer-use-package-name
    desc: DeepSeek Harness computer-use package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@kaczev/)?dsh-computer-use(-win)?$'

  - id: dsh-computer-use-repository-url
    desc: DeepSeek Harness computer-use repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/(kaczev|Yu-tao-Li)/dsh-computer-use'

  - id: dsh-computer-use-backend-marker
    desc: DeepSeek Harness computer-use backend marker
    for: [powershell, text]
    if:
      type: text
      substr: 'dsh-computer-use-win MCP server'

  - id: dsh-computer-use-takeover-namespace
    desc: DeepSeek Harness desktop takeover namespace
    for: [csharp, powershell, text]
    if:
      type: text
      substr: 'namespace DshTakeover'

composite_rules:
  - id: dsh-computer-use-distribution
    desc: DeepSeek Harness computer-use distribution
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-computer-use-package-name
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-computer-use-repository-url

  - id: dsh-computer-use-context
    desc: DeepSeek Harness computer-use package context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: archive
    all:
      - id: well-known/app/ai/coding-agent/unieai-harness::dsh-computer-use-package-name
      - id: well-known/app/ai/coding-agent/unieai-harness::deepseek-harness-description
