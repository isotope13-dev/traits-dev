# @unieai/uad-* packages from the UnieAI Agent Desktop (DeepSeek Harness) monorepo.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: unieai-scoped-package-name
    desc: UnieAI scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@unieai/uad-'

  - id: unieai-agent-desktop-repository
    desc: UnieAI Agent Desktop monorepo repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/unieai/unieai-agent-desktop'

  - id: deepseek-harness-description
    desc: Package description names DeepSeek Harness
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)deepseek harness'

composite_rules:
  - id: unieai-harness-package-context
    desc: UnieAI DeepSeek Harness monorepo package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: unieai-scoped-package-name
      - id: unieai-agent-desktop-repository
