# Tamnora Harness — local AI coding agent CLI and TUI (tamnora/tamnora-harness).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Tamnora npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@danieltmn/tamnora"

  - id: npm-package-name
    desc: Tamnora npm package archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@danieltmn/tamnora"

  - id: repository-url
    desc: Tamnora official GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/tamnora/tamnora-harness(\.git)?$'

  - id: npm-repository-url
    desc: Tamnora npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/tamnora/tamnora-harness(\.git)?$'

  - id: upstream-repository-text
    desc: Tamnora upstream repository reference
    for: [javascript, markdown, text]
    if:
      type: text
      substr: github.com/tamnora/tamnora-harness

  - id: tamnora-cli-binary-name
    desc: Tamnora binary name
    for: [package.json]
    if:
      type: value
      path: bin.tamnora
      exact: "harness/packages/cli/bin/tamnora.mjs"

composite_rules:
  - id: official-package-identity
    desc: Official Tamnora npm package identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Tamnora repository identity
    crit: notable
    conf: 0.99
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: upstream-repository-text

  - id: official-package-repository-pair
    desc: Official Tamnora scoped name and repository pair
    crit: exception
    conf: 0.99
    all:
      - id: official-package-identity
      - id: official-repository-identity

  - id: tamnora-harness-context
    desc: Tamnora AI agent harness package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: tamnora-cli-binary-name
