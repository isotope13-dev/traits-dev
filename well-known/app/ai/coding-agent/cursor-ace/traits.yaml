defaults:
  platforms: [unix, windows]
  for: [archives, package.json, javascript, typescript, data]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Cursor ACE extension package name
    for: [package.json, data]
    if:
      type: value
      path: name
      exact: cursor-ace-extension

  - id: package-publisher
    desc: Cursor ACE extension publisher
    for: [package.json, data]
    if:
      type: value
      path: publisher
      exact: ce-dot-net

  - id: upstream-repository
    desc: Cursor ACE extension repository
    for: [package.json, data]
    if:
      type: text
      substr: github.com/ce-dot-net/ace-cursor

  - id: sdk-config-path
    desc: ACE SDK configuration module path
    for: [javascript, typescript, data]
    if:
      type: path
      regex: '(?i)@ace-sdk[\\/]core'

composite_rules:
  - id: extension-identity
    desc: Cursor ACE extension identity
    crit: notable
    conf: 0.99
    for: [package.json, data]
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
      - id: upstream-repository

  - id: extension-archive-context
    desc: Cursor ACE SDK archive context
    crit: exception
    conf: 0.99
    for: [archives, javascript, typescript, data]
    scope: archive
    all:
      - id: extension-identity
      - id: sdk-config-path
