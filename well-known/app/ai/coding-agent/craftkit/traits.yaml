# @raditia/craftkit — skills/rules sync for Claude Code, Cursor, Gemini, Codex.
defaults:
  platforms: [unix]
  for: [package.json, npm, shell, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: craftkit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@raditia/craftkit"

  - id: npm-package-name
    desc: craftkit npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@raditia/craftkit"

  - id: repository-url
    desc: craftkit official GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/raditia/CraftKit(\.git)?$'

  - id: npm-repository-url
    desc: craftkit npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/raditia/CraftKit(\.git)?$'

  - id: sync-script-header
    desc: craftkit sync.sh script banner
    for: [shell]
    if:
      type: text
      substr: "==> Syncing craftkit..."

composite_rules:
  - id: official-package-identity
    desc: Official craftkit npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: archive-context
    desc: craftkit agent skills sync installer context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: sync-script-header
      - id: metadata/package/description/function::description-ai-coding-skills-sync
