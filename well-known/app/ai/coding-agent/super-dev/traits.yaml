# Super Dev — pipeline AI coding assistant (shangyankeji/super-dev).
# host_hooks.py installs Claude Code PreToolUse guards that *block* reads of
# secret paths and env names; that catalog is enforcement, not harvesting.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.98
  size_max: 524288000

traits:
  - id: super-dev-wheel-package-name
    desc: Super Dev wheel package name
    crit: notable
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: super_dev

  - id: super-dev-github-homepage
    desc: Super Dev GitHub project homepage
    crit: notable
    for: [whl, python, text]
    if:
      type: text
      substr: github.com/shangyankeji/super-dev

  - id: host-hooks-configurator-class
    desc: Super Dev host-hooks configurator class
    crit: notable
    for: [python]
    if:
      type: text
      substr: class HostHooksConfigurator

  - id: secret-read-block-reason
    desc: Super Dev secret-read block reason
    crit: notable
    for: [python]
    if:
      type: text
      substr: 'Super Dev: blocked read/glob/grep'

composite_rules:
  - id: super-dev-ai-coding-pipeline
    desc: Super Dev AI coding pipeline
    crit: notable
    needs: 2
    any:
      - id: super-dev-wheel-package-name
      - id: super-dev-github-homepage
      - id: host-hooks-configurator-class
      - id: secret-read-block-reason

  - id: super-dev-secret-read-guard-context
    desc: Super Dev secret-read guard context
    crit: exception
    conf: 0.99
    all:
      - id: host-hooks-configurator-class
      - id: secret-read-block-reason
