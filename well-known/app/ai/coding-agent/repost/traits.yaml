# Repost — terminal AI coding agent (repost.sh / github.com/repost-sh/monorepo).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 300000000

traits:
  - id: repost-cli-package-name
    desc: Repost CLI platform npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@repost/cli'

  - id: repost-repo-url
    desc: Repost GitHub repository URL
    for: [package.json, macho, elf, pe, rust]
    if:
      type: text
      substr: github.com/repost-sh/monorepo

  - id: repost-client-version-marker
    desc: Repost client version telemetry marker
    for: [macho, elf, pe, rust]
    if:
      type: text
      exact: REPOST_CLIENT_VERSION

  - id: repost-binary-name
    desc: Repost CLI binary name
    for: [macho, elf, pe]
    if:
      type: basename
      exact: repost

composite_rules:
  - id: repost-cli
    desc: Repost AI coding agent CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: repost-cli-package-name
      - id: repost-repo-url
      - id: repost-client-version-marker
      - id: repost-binary-name
    needs: 2
