# Aria Code — AI coding agent CLI (Arthera AI).
# npm: @artheras/aria-code, @artheras/aria-code-win32-x64
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, manifests, text]
  crit: notable
  conf: 0.98
  size_max: 500000000

traits:
  - id: package-name
    desc: Aria Code npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^@artheras/aria-code(-[a-z0-9-]+)?$'

  - id: native-binary-name
    desc: Aria Code native executable basename
    for: [pe, elf, macho]
    if:
      type: basename
      regex: '(?i)^aria-code(-bin)?(\.exe)?$'

  - id: binary-path
    desc: Aria Code binary path
    for: [pe, elf, macho]
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]aria-code(-bin)?(\.exe)?$'

  - id: member-path
    desc: Aria Code member path
    for: [binaries, scripts, text]
    if:
      type: path
      regex: '(?i)[/\\]aria[-_]code(-bin)?[/\\]'

  - id: cli-script-marker
    desc: Aria Code CLI entrypoint reference
    for: [binaries, scripts, text]
    if:
      type: text
      substr: aria_cli.py

composite_rules:
  - id: aria-code-cli
    desc: Aria Code AI coding agent CLI
    crit: notable
    conf: 0.98
    any:
      - id: package-name
      - id: native-binary-name
      - id: binary-path
      - id: member-path
      - id: cli-script-marker
