defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
  size_max: 300000000

traits:
  - id: lobehub-browser-import-context
    desc: LobeHub browser data import module
    if:
      type: text
      substr: 'lobehub-chrome-import-'
  - id: lobechat-local-file-shell-package
    desc: LobeChat local-file-shell package path
    if:
      type: path
      regex: '(^|[/\\])local-file-shell([/\\]|$)'

composite_rules:
  - id: local-cookie-import
    desc: LobeHub imports cookies into its local session
    crit: exception
    all:
      - id: lobehub-browser-import-context
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
      - id: micro-behaviors/communications/http/cookies::cookie-store-flush
