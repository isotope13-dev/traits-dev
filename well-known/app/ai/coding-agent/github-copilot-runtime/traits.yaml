# @github/copilot — bundled GitHub Copilot language-server runtime (npm).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives, package.json, pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: copilot-npm-package-path
    desc: Bundled GitHub Copilot npm package path
    for: [javascript, typescript, npm, archives]
    if:
      type: path
      regex: '(?i)@github[\\/]copilot(-[a-z0-9-]+)?[\\/]'

  - id: copilot-npm-package-name
    desc: GitHub Copilot npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@github/copilot(-[a-z0-9-]+)?$'

  - id: copilot-sdk-dependency
    desc: GitHub Copilot SDK dependency in manifest
    for: [package.json, json]
    if:
      type: text
      substr: '@github/copilot-sdk'

  - id: copilot-computer-use-product
    desc: Copilot Computer Use product name
    for: [pe, dll]
    size_min: 100000
    size_max: 50000000
    if:
      type: value
      path: pe.version.product_name
      exact: 'Copilot Computer Use'

  - id: copilot-github-company
    desc: GitHub company name in PE version
    for: [pe, dll]
    size_min: 100000
    size_max: 50000000
    if:
      type: value
      path: pe.version.company
      exact: 'GitHub'

  - id: copilot-runtime-node-export
    desc: GitHub Copilot runtime native exports
    for: [pe, dll]
    size_min: 100000
    size_max: 200000000
    if:
      type: export
      regex: '^copilot_runtime_'

composite_rules:
  - id: copilot-computer-use-binary-context
    desc: GitHub Copilot Computer Use binary context
    crit: exception
    conf: 0.99
    all:
      - id: copilot-computer-use-product
      - id: copilot-github-company

  - id: github-copilot-app-bundle
    desc: Bundled GitHub Copilot runtime npm package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: copilot-npm-package-path
      - id: copilot-npm-package-name
      - id: copilot-sdk-dependency
