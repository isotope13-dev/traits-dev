# The OpenClaw npm distribution (github.com/openclaw/openclaw), an AI gateway
# CLI published as a single ~8500-file tarball.
#
# The product ships a first-class cron facility, a sandboxed JS runtime, a
# browser bridge, and a command-RPC transport. Third-party packages that reach
# for those surfaces are worth flagging, but the distribution that *implements*
# them is not abusing anything -- so the surface references live here as
# identity, and the objective composites that infer abuse reference them.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: OpenClaw npm package name
    if:
      type: value
      path: name
      exact: openclaw

  - id: npm-repository-url
    desc: OpenClaw upstream repository reference
    if:
      type: value
      path: repository.url
      substr: 'github.com/openclaw/openclaw'

  - id: npm-bin-command
    desc: OpenClaw npm bin command entry
    if:
      type: value
      path: bin.openclaw
      exists: true

  # Relocated from objectives/persistence/system/cron/job/ (was
  # `openclaw-cron-add`, crit: suspicious). The matcher recognizes OpenClaw's
  # `cron add` command surface -- a named product's API, which is an identity
  # fact. Third-party code scheduling itself through someone else's agent
  # runtime is worth flagging, but that inference belongs to the composite in
  # objectives/persistence/system/cron/job/, which references this trait and
  # supplies the task-pool and no-delivery legs. As a suspicious atom it
  # reported OpenClaw's own dist/cron.js -- the implementation of the feature.
  - id: cron-add-command
    desc: OpenClaw cron add command reference
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'openclaw[\s\S]{0,80}cron[\s\S]{0,80}add'
      case_insensitive: true

  - id: openclaw-env-marker
    desc: OpenClaw agent environment variable marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bOPENCLAW_[A-Z0-9_]+\b'

  # The control UI ships each asset twice (plain and .js.gz sibling), so the
  # path marker must reach the compressed member too: suppression legs that
  # key on it otherwise lose the .gz copy of the very same asset.
  - id: control-ui-asset-path
    desc: OpenClaw control-ui asset path
    crit: notable
    conf: 0.99
    for: [javascript, typescript, html, json, text, gz]
    if:
      type: path
      regex: '(^|[\\/])control-ui[\\/]'

  - id: package-root-entry
    desc: OpenClaw root entry point
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: basename
      exact: openclaw.mjs

  # Windows native-messaging bridge members name the product's native host
  # (`openclaw-browser-native-host`) in their install/lookup plumbing.
  - id: browser-native-host-reference
    desc: OpenClaw browser native host reference
    crit: notable
    conf: 0.98
    for: [javascript, typescript, json]
    if:
      type: text
      substr: openclaw-browser-native-host

  # Dist chunk exporting the product's PowerShell argv builder
  # (`-NoLogo -NoProfile -NonInteractive -EncodedCommand`, utf16le base64) --
  # the documented command-execution plumbing for Windows nodes, not a
  # concealed launch.
  - id: powershell-spawn-helper
    desc: OpenClaw PowerShell spawn helper chunk
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: buildEncodedPowerShellArgs

  # Browser-bridge route that imports the operator's own system-browser
  # cookies into a managed local automation profile (`POST /cookies/set-many`
  # against the configured gateway). Reading the user's own cookie store for
  # the operator's own local browser tooling is the documented session-import
  # feature, not theft.
  - id: browser-cookie-sync-endpoint
    desc: OpenClaw browser cookie sync endpoint
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: /cookies/set-many
