# The OpenClaw npm distribution (github.com/openclaw/openclaw), an AI gateway
# CLI published as a single ~8500-file tarball.
#
# The product ships a first-class cron facility, a sandboxed JS runtime, a
# browser bridge, and a command-RPC transport. Third-party packages that reach
# for those surfaces are worth flagging, but the distribution that *implements*
# them is not abusing anything -- so the surface references live here as
# identity, and the objective composites that infer abuse reference them.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: OpenClaw npm package name
    if:
      type: value
      path: name
      exact: openclaw

  - id: npm-repository-url
    desc: OpenClaw upstream repository reference
    if:
      type: value
      path: repository.url
      regex: 'github\.com/openclaw/openclaw'

  - id: npm-bin-command
    desc: OpenClaw npm bin command entry
    if:
      type: value
      path: bin.openclaw
      exists: true

  # Relocated from objectives/persistence/system/cron/job/ (was
  # `openclaw-cron-add`, crit: suspicious). The matcher recognizes OpenClaw's
  # `cron add` command surface -- a named product's API, which is an identity
  # fact. Third-party code scheduling itself through someone else's agent
  # runtime is worth flagging, but that inference belongs to the composite in
  # objectives/persistence/system/cron/job/, which references this trait and
  # supplies the task-pool and no-delivery legs. As a suspicious atom it
  # reported OpenClaw's own dist/cron.js -- the implementation of the feature.
  - id: cron-add-command
    desc: OpenClaw cron add command reference
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'openclaw[\s\S]{0,80}cron[\s\S]{0,80}add'
      case_insensitive: true
