# ClawHub — OpenClaw public skill registry (openclaw/clawhub).
defaults:
  platforms: [unix, windows]
  for: [package.json, markdown, text, javascript, typescript]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: clawhub-package-name
    desc: ClawHub monorepo package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: clawhub

  - id: clawhub-readme-tagline
    desc: ClawHub public skill registry tagline
    for: [markdown, text]
    if:
      type: text
      substr: public skill registry for OpenClaw

  - id: clawhub-moderation-engine-source
    desc: ClawHub moderation engine source path
    if:
      type: path
      regex: 'moderationEngine\.test\.ts$'

  - id: clawhub-upstream-repository
    desc: ClawHub upstream GitHub repository
    for: [package.json, markdown, text]
    if:
      type: text
      regex: '(?i)github\.com/openclaw/clawhub'

composite_rules:
  - id: clawhub-registry-context
    desc: ClawHub OpenClaw skill registry platform
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, npm, zip, source, manifests, documents]
    any:
      - id: clawhub-package-name
      - id: clawhub-readme-tagline
      - id: clawhub-moderation-engine-source
      - id: clawhub-upstream-repository
