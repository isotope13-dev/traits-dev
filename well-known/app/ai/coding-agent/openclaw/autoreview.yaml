# OpenClaw autoreview ships a provider env-key catalog used for redaction,
# not credential harvesting.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable
  conf: 0.99

traits:
  - id: opencode-provider-env-key-catalog
    desc: OpenCode provider env-key catalog marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: OPENCODE_PROVIDER_ENV_KEYS

  - id: openclaw-redaction-placeholder
    desc: OpenClaw redaction placeholder marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: __openclaw_redacted__

composite_rules:
  - id: autoreview-provider-env-redaction-context
    desc: Autoreview provider env-key redaction context
    crit: exception
    conf: 0.99
    all:
      - id: opencode-provider-env-key-catalog
      - id: openclaw-redaction-placeholder
