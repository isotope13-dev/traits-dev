defaults:
  platforms: [android]
  for: [zip]
  crit: notable
  conf: 0.99
traits:
  # The voice-assistant Android companion ships mic/camera/location/
  # contacts/calendar permission requests as declared capabilities; the
  # source tree (ai.openclaw.app) marks the permission set as expected
  # for this app, the way phonesky/smsforwarder identities do for theirs.
  - id: openclaw-android-source-tree
    desc: OpenClaw Android source tree
    if:
      type: value
      path: archive.members[*].path
      substr: 'apps/android/app/src/main/java/ai/openclaw/'
