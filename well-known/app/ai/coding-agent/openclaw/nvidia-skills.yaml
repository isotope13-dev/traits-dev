# NVIDIA agent skills collection (github.com/nvidia/skills).
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript, typescript, python, shell, package.json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  - id: nvidia-skills-deepstream-sop-path
    desc: NVIDIA DeepStream SOP skill path
    if:
      type: path
      regex: 'deepstream-sop/'

  - id: nvidia-skills-repository-reference
    desc: NVIDIA skills GitHub repository reference
    for: [markdown, text, package.json]
    if:
      type: text
      regex: '(?i)github\.com/nvidia/skills'

  - id: nvidia-deepstream-runtime-path
    desc: NVIDIA DeepStream install path reference
    for: [markdown, text, python, shell]
    if:
      type: text
      substr: /opt/nvidia/deepstream/

composite_rules:
  - id: nvidia-agent-skills-context
    desc: NVIDIA published agent skills bundle
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, npm, zip, source, scripts, manifests, documents]
    any:
      - id: nvidia-skills-deepstream-sop-path
      - id: nvidia-skills-repository-reference
      - id: nvidia-deepstream-runtime-path
