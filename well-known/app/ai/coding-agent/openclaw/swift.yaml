defaults:
  platforms: [macos]
  for: [swift]
  crit: notable
  conf: 0.98
traits:
  - id: openclaw-kit-import
    desc: OpenClawKit Swift module import
    crit: notable
    conf: 1.0
    if:
      type: symbol
      kind: import
      exact: OpenClawKit
  - id: openclaw-ipc-import
    desc: OpenClawIPC Swift module import
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: import
      exact: OpenClawIPC
  - id: openclaw-discovery-import
    desc: OpenClawDiscovery Swift module import
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: import
      exact: OpenClawDiscovery
  - id: general-settings-type
    desc: GeneralSettings Swift type
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bstruct\s+GeneralSettings\s*:\s*View\b'
  - id: launch-at-login-setting
    desc: OpenClaw login-launch setting
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Launch at login[\s\S]{0,180}state\.launchAtLogin'
  - id: computer-control-capability-setting
    desc: OpenClaw computer-control capability setting
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Allow Computer Control[\s\S]{0,320}gateway command authorization'
  - id: camera-capture-capability-setting
    desc: OpenClaw camera-capture capability setting
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Allow Camera[\s\S]{0,220}via the built-in camera'
  - id: gateway-url-setting
    desc: OpenClaw gateway URL setting
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Gateway URL[\s\S]{0,120}WebSocket URL'
  - id: gateway-token-setting
    desc: OpenClaw remote gateway token key
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'gateway.remote.token'
  - id: ssh-target-setting
    desc: OpenClaw SSH target setting
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'SSH target[\s\S]{0,120}remote Gateway machine'
  - id: local-gateway-launchd-status
    desc: OpenClaw launchd autostart caption
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Gateway auto-starts in local mode via launchd'
  - id: remote-gateway-probe-call
    desc: OpenClaw remote gateway connectivity probe
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: RemoteGatewayProbe..run
  - id: remote-token-secure-field
    desc: OpenClaw remote gateway token input
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'SecureField\s*\(\s*"remote gateway auth token \(gateway\.remote\.token\)"'
  - id: ssh-identity-file-field
    desc: OpenClaw SSH identity-file setting
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Identity file[\s\S]{0,180}remoteIdentity'
composite_rules:
  - id: openclaw-general-settings-source
    desc: OpenClaw settings source module
    crit: notable
    conf: 0.99
    all:
      - id: openclaw-kit-import
      - id: openclaw-ipc-import
      - id: openclaw-discovery-import
      - id: general-settings-type
  - id: openclaw-settings-capability-surface
    desc: OpenClaw settings capability surface
    crit: notable
    conf: 0.99
    all:
      - id: openclaw-general-settings-source
      - id: computer-control-capability-setting
      - id: camera-capture-capability-setting
      - id: gateway-url-setting
      - id: gateway-token-setting
      - id: ssh-target-setting
      - id: local-gateway-launchd-status
