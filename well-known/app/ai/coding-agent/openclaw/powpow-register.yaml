# PowPow (OpenClaw) registration assistant skills ship a zero-dependency Node CLI
# that talks only to the vendor API at global.powpow.online. FormData username/
# password fields and a `whoami` subcommand are legitimate signup flow, not OAST
# host profiling or hidden autofill theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: powpow-register-password-env
    desc: PowPow register CLI password env var
    for: [javascript, typescript]
    if:
      type: text
      substr: POWPOW_REGISTER_PASSWORD

  - id: powpow-official-api-base-url
    desc: PowPow official global API base URL
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)https://global\.powpow\.online\b'

  - id: powpow-register-state-file
    desc: PowPow register CLI temp state filename
    for: [javascript, typescript]
    if:
      type: text
      substr: powpow-register-state.json

composite_rules:
  - id: powpow-register-skill-script-context
    desc: PowPow OpenClaw registration helper script
    crit: exception
    conf: 0.99
    scope: file
    for: [javascript, typescript]
    all:
      - id: powpow-register-password-env
      - id: powpow-official-api-base-url
      - id: powpow-register-state-file
