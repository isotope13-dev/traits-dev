defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  - powershell
  - text
  crit: component
  conf: 0.9
  size_max: 5000000
traits:
- id: openclaw-product-name
  desc: OpenClaw product name marker
  crit: notable
  if:
    type: text
    regex: "(?i)\\b(OpenClaw|Clawdbot|Moltbot|Molty)\\b"
composite_rules:
- id: openclaw-agent-skill-file-context
  for: [markdown]
  desc: OpenClaw agent skill SKILL.md documentation
  crit: exception
  conf: 0.99
  scope: file
  all:
  - id: metadata/package/agent-skill::agent-skill-md-basename
  - id: openclaw-product-name
