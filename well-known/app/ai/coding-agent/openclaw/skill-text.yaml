defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  - powershell
  - text
  crit: component
  conf: 0.9
  size_max: 5000000
traits:
- id: openclaw-product-name
  desc: OpenClaw product name marker
  crit: notable
  if:
    type: text
    regex: "(?i)\\b(OpenClaw|Clawdbot|Moltbot|Molty)\\b"
- id: openclaw-ecosystem-phrase
  crit: notable
  desc: OpenClaw ecosystem phrase marker
  if:
    type: text
    regex: "(?i)open agent skills ecosystem|\\bnpx skills\\b"

- id: openclaw-skill-md-path
  desc: OpenClaw agent skill SKILL.md member path
  crit: notable
  if:
    type: path
    regex: '(?i)(^|[\\/])SKILL\.md(##|$)'

composite_rules:
- id: openclaw-skill-text
  desc: OpenClaw skill text marker
  crit: notable
  any:
  - id: openclaw-product-name
  - id: openclaw-ecosystem-phrase

- id: openclaw-agent-skill-file-context
  desc: OpenClaw agent skill SKILL.md documentation
  crit: exception
  conf: 0.99
  scope: file
  all:
  - id: openclaw-skill-md-path
  - id: openclaw-product-name
