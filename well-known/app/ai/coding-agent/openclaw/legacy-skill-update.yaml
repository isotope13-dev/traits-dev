defaults:
  platforms: [unix, windows]
  for: [markdown, text]

traits:
  - id: agent-skill-cron-auto-update
    desc: Clawdbot recurring update command text
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)clawdbot\s+cron\s+add.{0,180}(auto-update|auto.updates)'

  - id: agent-skill-updates-all-installed-skills
    desc: ClawdHub update-all command text
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: clawdhub update --all

  - id: agent-skill-global-agent-package-update
    desc: Clawdbot global package update command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(npm|pnpm|bun)\s+update\s+-g\s+clawdbot'

composite_rules:
  - id: agent-skill-persistent-self-update
    for: [markdown, text, zip, npm, whl, tar]
    desc: Skill describes recurring Clawdbot updates
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-cron-auto-update
      - id: agent-skill-updates-all-installed-skills
