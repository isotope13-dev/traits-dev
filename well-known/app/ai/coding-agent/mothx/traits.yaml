# MothX — terminal coding agent (startvibecoding/mothx).
# Platform npm packages ship a Go-compiled native binary named `mothx`.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: mothx-native-binary-name
    desc: MothX native binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^mothx(\.exe)?$'

  - id: mothx-binary-path
    desc: Bundled MothX binary path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]mothx(\.exe)?$'

  - id: mothx-installer-package-name
    desc: MothX platform npm installer package
    for: [package.json]
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^mothx-installer-(linux|darwin|windows)-(x64|arm64)(-musl)?$'

  - id: mothx-github-module
    desc: MothX Go module import path
    for: [elf, macho, pe, text]
    size_min: 64
    if:
      type: text
      substr: github.com/startvibecoding/mothx

  - id: mothx-manifest-github-repo
    desc: MothX package.json GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]startvibecoding/mothx'

  - id: mothx-npm-github-repo
    desc: MothX npm archive repository field
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]startvibecoding/mothx'

composite_rules:
  - id: mothx-distribution
    desc: MothX agent distribution identity
    crit: notable
    conf: 0.99
    any:
      - id: mothx-installer-package-name
      - id: mothx-github-module
      - id: mothx-manifest-github-repo
      - id: mothx-npm-github-repo

  - id: mothx-go-agent-binary
    desc: MothX Go-compiled agent binary
    crit: notable
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    scope: outer
    all:
      - id: mothx-native-binary-name
    any:
      - id: mothx-binary-path
      - id: mothx-github-module
