# jcode — AI coding assistant CLI (https://jcode.sh, GitHub 1jehuang/jcode).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 500000000

traits:
  - id: official-domain
    desc: jcode official domain reference
    for: [elf, macho, pe, shell, markdown, text, json]
    if:
      type: text
      substr: jcode.sh

  - id: github-repo
    desc: jcode GitHub repository reference
    for: [elf, macho, pe, shell, markdown, text, json]
    if:
      type: text
      substr: 1jehuang/jcode

  - id: binary-name
    desc: jcode CLI binary name
    for: [elf, macho, pe, shell]
    if:
      type: basename
      regex: '^jcode(-[a-z0-9_]+)?(\.(bin|exe))?$'

  - id: env-marker
    desc: jcode environment variable marker
    for: [elf, macho, pe, shell, text]
    if:
      type: text
      regex: '\bJCODE_(RELOAD_DETACH_COMMAND|API_KEY|MODEL|PROVIDER|SWARM_ENABLED)\b'

composite_rules:
  - id: jcode-coding-agent
    desc: jcode AI coding assistant CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: official-domain
      - id: github-repo
      - id: binary-name
      - id: env-marker
    needs: 2

  - id: jcode-cli-context
    desc: jcode CLI package context
    crit: exception
    conf: 0.99
    any:
      - id: jcode-coding-agent
      - id: official-domain
      - id: github-repo
