# Tau — package for the Pi coding agent (Earendil Works) by Gonçalo Silva
# Repository: github.com/goncalossilva/tau
# Provides coding workflows, web search with browser session integration, sandboxing, skills, and themes.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: tau-all-agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: tau-all-agent

  - id: npm-package-name
    desc: tau-all-agent npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: tau-all-agent

  - id: upstream-repository
    desc: Tau upstream repository URL
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/goncalossilva/tau([./\s"''`?#]|$)'

  - id: pi-manifest-extensions
    desc: Pi package declares extension entrypoints
    for: [package.json]
    if:
      type: value
      path: pi.extensions
      exists: true

composite_rules:
  - id: archive-context
    desc: Tau Pi agent extension package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: upstream-repository
    any:
      - id: pi-manifest-extensions
      - id: metadata/package/keywords/identity::npm-keyword-pi-package
