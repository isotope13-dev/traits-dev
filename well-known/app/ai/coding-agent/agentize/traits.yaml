# SyntheSys-Lab/agentize: AI-powered SDK for Software Development with Claude Code.
defaults:
  platforms: [unix, windows]
  for: [shell, markdown, text, dockerfile, scripts, json, python]
  crit: notable
  conf: 0.99

traits:
  - id: agentize-repo-url
    desc: Agentize GitHub repository reference
    if:
      type: text
      substr: "SyntheSys-Lab/agentize"
      case_insensitive: true

  - id: agentize-container-entrypoint
    desc: Agentize container entrypoint script marker
    if:
      type: text
      substr: "Entrypoint script for agentize container"

composite_rules:
  - id: agentize-sandbox-context
    desc: Recognized Agentize AI development sandbox context
    crit: exception
    any:
      - id: agentize-repo-url
      - id: agentize-container-entrypoint
