# codex-supervisor-mcp — MCP server for parallel Codex CLI workers (github.com/zriyox/codex-supervisor-mcp).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: codex-supervisor-mcp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: codex-supervisor-mcp

  - id: upstream-repository
    desc: codex-supervisor-mcp upstream GitHub repository
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: github.com/zriyox/codex-supervisor-mcp

  - id: setup-skill-marker
    desc: codex-supervisor postinstall setup marker
    for: [javascript, typescript]
    if:
      type: text
      substr: CODEX_SUPERVISOR_SKIP_SETUP

composite_rules:
  - id: archive-context
    desc: codex-supervisor-mcp documented MCP supervisor installer context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: setup-skill-marker
