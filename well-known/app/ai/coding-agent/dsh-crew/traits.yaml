# dsh-crew — DeepSeek Harness agent plugin for Claude Code / Codex with optional Windows autostart.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, vbs, npm, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: dsh-crew-package-name
    desc: dsh-crew npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ran-sh/dsh-crew'

  - id: dsh-crew-repository-url
    desc: dsh-crew GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]ran-sh/dsh-crew'

  - id: dsh-crew-windows-autostart-path
    desc: dsh-crew Windows autostart VBS script path
    for: [vbs]
    if:
      type: path
      regex: '(?i)(^|[\\/])start-dsh-crew\.vbs$'

  - id: dsh-crew-vbs-launcher-token
    desc: dsh-crew Windows autostart launcher token
    for: [vbs]
    if:
      type: text
      substr: '__LAUNCHER__'

composite_rules:
  - id: dsh-crew-documented-package-context
    desc: dsh-crew documented package context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: dsh-crew-package-name
      - id: dsh-crew-repository-url

  - id: dsh-crew-autostart-vbs-context
    desc: dsh-crew Windows autostart VBS launcher context
    crit: exception
    conf: 0.99
    for: [vbs]
    scope: file
    any:
      - id: dsh-crew-windows-autostart-path
      - id: dsh-crew-vbs-launcher-token
