# Kapacitor — native daemon and CLI harness for coding agents (kurrent.io).
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 500000000

traits:
  - id: kapacitor-npm-package-name
    desc: Kapacitor npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@kurrent/kapacitor(-[a-z0-9-]+)?$'

  - id: kapacitor-pdb
    desc: Kapacitor CLI or daemon debug symbols reference
    for: [pe]
    size_min: 5000000
    size_max: 50000000
    if:
      type: value
      path: pe.debug.pdb.basename
      regex: '^kapacitor(-daemon)?\.pdb$'

  - id: kapacitor-repo-url
    desc: Kapacitor repository URL reference
    for: [pe, package.json, javascript, typescript, markdown]
    if:
      type: text
      substr: 'github.com/kurrent-io/kapacitor-cli'

  - id: kapacitor-daemon-internal-name
    desc: Kapacitor daemon internal name in PE version
    for: [pe]
    size_min: 5000000
    size_max: 50000000
    if:
      type: value
      path: pe.version.internal_name
      regex: '^kapacitor(-daemon)?\.dll$'

composite_rules:
  - id: kapacitor-cli-binary
    desc: Kapacitor coding agent daemon or CLI binary
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      - id: kapacitor-pdb
    any:
      - id: kapacitor-repo-url
      - id: kapacitor-daemon-internal-name
