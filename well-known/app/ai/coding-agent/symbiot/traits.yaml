# Symbiot — local AI coding assistant / productivity tool that summarizes
# git activity. Its Windows screenshot automation uses PowerShell -EncodedCommand
# for DPI-aware user32 mouse and capture calls to avoid shell quote mangling.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: package-name
    desc: Symbiot npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: symbiot

  - id: npm-package-name
    desc: Symbiot npm archive name
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: symbiot

  - id: symbiot-config-dir
    desc: Symbiot config directory path
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: '.config/symbiot'

composite_rules:
  - id: symbiot-package
    desc: Symbiot AI coding assistant package
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: npm-package-name
      - id: symbiot-config-dir
