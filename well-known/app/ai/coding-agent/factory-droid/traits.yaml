# Factory "droid" — the CLI coding agent published by Factory AI
# (github.com/Factory-AI/factory, npm @factory/cli*). The Windows/macOS/Linux
# binaries are `bun build --compile` single-file executables, so the whole
# agent -- shell tool, MCP client, and a native Chrome DevTools Protocol
# browser tool -- lands in one multi-hundred-megabyte executable named
# droid(.exe).
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, javascript, typescript, package.json]
  crit: notable
  conf: 0.95
  size_min: 64
  size_max: 524288000

traits:
  - id: factory-api-host
    desc: Factory AI API host
    if:
      type: text
      substr: api.factory.ai

  - id: factory-app-host
    desc: Factory AI web application host
    if:
      type: text
      substr: app.factory.ai

  - id: factory-api-key-env
    desc: Factory AI API key environment variable
    if:
      type: text
      substr: FACTORY_API_KEY

  - id: factory-cli-product-name
    desc: Factory CLI product name string
    if:
      type: text
      substr: Factory CLI

  - id: factory-cli-package-name
    desc: '@factory/cli npm package name'
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@factory/cli'

composite_rules:
  - id: factory-droid-cli
    desc: Factory droid AI coding CLI
    crit: notable
    conf: 0.97
    all:
      - id: factory-cli-product-name
    any:
      - id: factory-api-host
      - id: factory-app-host
      - id: factory-api-key-env

  # Two first-party signals (vendor-owned endpoint plus product name) identify
  # the shipped droid binary. Its bundled CDP client drives a browser the agent
  # launches itself, which is mechanically identical to a CDP hijack; the
  # endpoint ownership is what separates them.
  - id: factory-droid-cdp-browser-context
    desc: Factory droid built-in CDP browser tool context
    crit: exception
    conf: 0.97
    all:
      - id: factory-cli-product-name
      - id: factory-api-host
