# lmctl-ai lmplayer — AI model runner and coding agent (https://github.com/lmctl-ai/lmplayer).
# Platform binary packages ship a Bun-compiled executable under @lmctl-ai/lmplayer-*.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json, npm, pe, elf, macho]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: lmplayer scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@lmctl-ai/lmplayer(-[a-z0-9_-]+)?$'

  - id: scoped-npm-package-identity
    desc: lmplayer scoped npm archive package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@lmctl-ai/lmplayer(-[a-z0-9_-]+)?$'

  - id: github-repository-url
    desc: lmplayer GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/lmctl-ai/lmplayer(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: lmplayer GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/lmctl-ai/lmplayer(\.git)?(/.*)?$'

  - id: lmplayer-binary-name
    desc: lmplayer native executable binary name
    for: [pe, elf, macho]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^lmplayer(\.exe)?$'

composite_rules:
  - id: official-package-scope
    desc: Official lmplayer package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official lmplayer organization repository
    crit: exception
    any:
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official lmplayer package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
