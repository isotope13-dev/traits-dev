# novahiz — OpenCode agent skill gate and catalog (github.com/novahiz/novahiz).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: novahiz npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: novahiz

  - id: upstream-repository
    desc: novahiz upstream GitHub repository
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: github.com/novahiz/novahiz

  - id: opencode-installer-marker
    desc: novahiz OpenCode installer marker
    for: [javascript, typescript]
    if:
      type: text
      substr: opencodeConfigDir

composite_rules:
  - id: archive-context
    desc: novahiz documented OpenCode skills installer context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: opencode-installer-marker
