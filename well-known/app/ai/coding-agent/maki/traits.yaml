# Maki is a Rust terminal coding agent. Release binaries retain source paths
# from several product-specific workspace crates even when built as static PIE.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 600000000

traits:
  - id: rust-workspace-crate-paths
    desc: Maki coding-agent Rust crate path
    if:
      type: text
      substr: maki-agent/src/
