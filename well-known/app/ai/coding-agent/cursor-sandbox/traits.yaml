defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 268435456

traits:
  - id: env-marker
    desc: Cursor sandbox environment marker
    for: [elf]
    if:
      type: text
      substr: CURSOR_SANDBOX
      section: rodata
  - id: env-marker-pe
    desc: Cursor sandbox environment marker in PE/Mach-O
    for: [macho, pe, dll]
    if:
      type: text
      substr: CURSOR_SANDBOX
      section: .rdata
  - id: helper-source-path
    desc: Cursor sandbox-helper source path
    for: [elf]
    if:
      type: text
      substr: packages/sandbox-helper/native/sandbox/
      section: rodata
  - id: helper-source-path-pe
    desc: Cursor sandbox-helper source path in PE/Mach-O
    for: [macho, pe, dll]
    if:
      type: text
      substr: packages/sandbox-helper/native/sandbox/
      section: .rdata
  - id: basename
    desc: cursorsandbox executable basename
    for: [elf, macho, pe, dll]
    if:
      type: basename
      regex: '^cursorsandbox(\.exe)?$'

composite_rules:
  - id: cursor-sandbox-context
    desc: Cursor agent sandbox helper context
    crit: exception
    conf: 0.99
    any:
      - id: env-marker
      - id: env-marker-pe
      - id: helper-source-path
      - id: helper-source-path-pe
      - id: basename
  - id: linux-sandbox-context
    desc: Cursor Linux agent sandbox helper
    any:
      - id: env-marker
      - id: helper-source-path
      - id: basename
