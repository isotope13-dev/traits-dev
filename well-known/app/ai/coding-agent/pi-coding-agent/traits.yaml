# Pi coding agent — terminal coding agent by Earendil Works (Mario Zechner).
# Repository: github.com/earendil-works/pi (and pi-mono).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip, markdown, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Pi coding agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@earendil-works/pi-coding-agent"

  - id: upstream-repository
    desc: Pi coding agent upstream repository
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/earendil-works/pi([./\s"''`?#]|$)'

  - id: package-scope-path
    desc: Pi coding agent package path
    for: [scripts, source, markdown, text, json, package.json, javascript, typescript, tar, zip]
    if:
      type: path
      regex: '(@?earendil-works[-/])pi-coding-agent[-/.]'

  - id: pi-installer-endpoint
    desc: Pi official installer URL
    crit: notable
    conf: 0.95
    for: [javascript, typescript, powershell, shell, markdown, text]
    if:
      type: text
      regex: 'https?://pi\.dev/install\.(ps1|sh)\b'

  - id: pi-installer-package-identity
    desc: Pi installer package identity
    crit: notable
    conf: 0.95
    for: [powershell, shell, text]
    if:
      type: text
      substr: '$PiPackage = "@earendil-works/pi-coding-agent"'

composite_rules:
  - id: archive-context
    desc: Pi coding agent package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: package-scope-path

  - id: pi-standalone-updater-context
    for: [javascript, typescript]
    desc: Pi coding agent official installer migration command context
    crit: exception
    conf: 0.99
    all:
      - id: upstream-repository
      - id: pi-installer-endpoint

  - id: pi-installer-context
    desc: Pi coding agent official installer context
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: pi-installer-package-identity
      - id: pi-installer-endpoint

