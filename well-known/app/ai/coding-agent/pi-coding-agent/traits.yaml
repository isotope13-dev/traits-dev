# Pi coding agent — terminal coding agent by Earendil Works (Mario Zechner).
# Repository: github.com/earendil-works/pi (and pi-mono).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip, markdown, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Pi coding agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@earendil-works/pi-coding-agent"

  - id: upstream-repository
    desc: Pi coding agent upstream repository
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/earendil-works/pi([./\s"''`?#]|$)'

  - id: package-scope-path
    desc: Pi coding agent package path
    for: [scripts, source, markdown, text, json, package.json, javascript, typescript, tar, zip]
    if:
      type: path
      regex: '(@?earendil-works[-/])pi-coding-agent[-/.]'

composite_rules:
  - id: archive-context
    desc: Pi coding agent package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: package-scope-path
