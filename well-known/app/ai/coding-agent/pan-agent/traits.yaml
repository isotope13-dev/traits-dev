# Pan Agent — terminal coding/chat AI assistant (github.com/euraika-labs/pan-agent).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 300000000

traits:
  - id: pan-agent-go-module
    desc: Pan Agent Go module path
    for: [go, elf, pe, macho]
    if:
      type: text
      substr: github.com/euraika-labs/pan-agent

  - id: pan-agent-chat-prompt
    desc: Pan Agent interactive terminal chat prompt
    for: [go, elf, pe, macho]
    if:
      type: text
      substr: Interactive terminal chat with Pan Agent

  - id: pan-agent-github-repo
    desc: Pan Agent GitHub repository URL
    for: [go, elf, pe, macho, markdown]
    if:
      type: text
      substr: github.com/Euraika-Labs/pan-agent

  - id: pan-agent-binary-name
    desc: Pan Agent CLI binary name
    for: [elf, pe, macho]
    if:
      type: basename
      regex: '^pan(\.exe)?$'

composite_rules:
  - id: pan-agent-cli
    desc: Pan Agent AI assistant CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: pan-agent-go-module
      - id: pan-agent-chat-prompt
      - id: pan-agent-github-repo
      - id: pan-agent-binary-name
    needs: 2
