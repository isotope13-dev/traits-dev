# @karajan-family/code — AGPL multi-agent coding orchestrator (manufosela/karajan-code).
# Scoped npm name vs karajan-code repo is intentional monorepo publishing, not
# clone-and-rename. postinstall registers karajan-mcp locally; install-binary.ps1
# is the documented Windows bootstrap (checksum-verified Node + npm global).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, powershell, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Karajan Code npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@karajan-family/code|karajan-code)$'

  - id: npm-package-name
    desc: Karajan Code npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^(@karajan-family/code|karajan-code)$'

  - id: repository-url
    desc: Karajan Code official GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/manufosela/karajan-code(\.git)?$'
    unless:
      - type: value
        path: repository.directory
        exists: true

  - id: upstream-repository-text
    desc: Karajan Code upstream repository reference
    for: [javascript, typescript, markdown, text, powershell]
    if:
      type: text
      substr: github.com/manufosela/karajan-code

  - id: upstream-github-slug-text
    desc: Karajan Code GitHub owner/repo slug reference
    for: [javascript, typescript, markdown, text, powershell, shell]
    if:
      type: text
      regex: '(?i)manufosela/karajan-code'

  - id: karajan-install-ps1-url
    desc: Karajan Code official Windows install script URL
    crit: notable
    conf: 0.98
    for: [powershell, markdown, text]
    if:
      type: text
      substr: karajancode.com/install.ps1

  - id: karajan-installer-script-marker
    desc: Karajan Code Windows installer script header
    crit: notable
    conf: 0.98
    for: [powershell]
    if:
      type: text
      regex: '(?is)\.SYNOPSIS\b.{0,400}Karajan Code installer'

composite_rules:
  - id: npm-repository-url
    desc: Karajan Code archive name and repository pair
    crit: notable
    conf: 0.99
    for: [npm, package.json]
    scope: archive
    all:
      - id: npm-package-name
      - id: repository-url

  - id: official-package-identity
    desc: Official Karajan Code npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Karajan Code repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: upstream-repository-text
      - id: upstream-github-slug-text

  - id: official-package-repository-pair
    desc: Official Karajan Code scoped name and repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity

  - id: archive-context
    desc: Karajan Code orchestrator package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity

  - id: windows-installer-context
    desc: Karajan Code documented Windows installer script
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: official-repository-identity
    any:
      - id: karajan-install-ps1-url
      - id: karajan-installer-script-marker
