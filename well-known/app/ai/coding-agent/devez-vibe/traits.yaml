# devez-vibe — terminal UI for Codex and the Claude Agent SDK. Ships agent
# skills (including insane-search) whose engine bootstraps pinned browser deps
# into ~/.insane-search on first use.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, package.json, npm, pe, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: devez-vibe npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: devez-vibe

  - id: npm-package-name
    desc: devez-vibe npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: devez-vibe

  - id: runtime-binary-name
    desc: devez-vibe Windows CLI executable name
    for: [pe]
    platforms: [windows]
    size_min: 500000
    size_max: 50000000
    if:
      type: basename
      exact: dvz.exe

  - id: runtime-binary-marker
    desc: devez-vibe product identity in runtime binary
    for: [pe]
    platforms: [windows]
    size_min: 500000
    size_max: 50000000
    if:
      type: text
      section: .rdata
      substr: devez-vibe

  - id: upstream-repository
    desc: devez-vibe upstream repository reference
    for: [javascript, typescript, python, markdown, text, package.json]
    if:
      type: text
      substr: github.com/MrHoje/Devez-vibe

  - id: insane-search-skill-marker
    desc: devez-vibe insane-search skill marker
    for: [javascript, typescript, python, markdown, text]
    if:
      type: text
      substr: insane-search

  - id: claude-sdk-bridge-marker
    desc: devez-vibe Claude Agent SDK bridge marker
    for: [javascript, typescript]
    if:
      type: text
      substr: claude-agent-sdk-bridge

composite_rules:
  - id: archive-context
    desc: devez-vibe documented agent TUI context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: npm-package-name
      - id: upstream-repository
      - id: insane-search-skill-marker
      - id: claude-sdk-bridge-marker

  - id: runtime-binary-context
    desc: devez-vibe Windows agent TUI runtime binary
    crit: exception
    conf: 0.99
    for: [pe]
    platforms: [windows]
    all:
      - id: runtime-binary-name
      - id: runtime-binary-marker
