# aiterm-mcp — Persistent terminal MCP server for AI coding agents.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: aiterm-mcp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: aiterm-mcp

  - id: npm-package-name
    desc: aiterm-mcp npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: aiterm-mcp

  - id: mcp-registry-name
    desc: aiterm-mcp MCP registry identifier
    for: [package.json]
    if:
      type: value
      path: mcpName
      exact: io.github.kitepon/aiterm-mcp

  - id: github-repo
    desc: aiterm-mcp GitHub repository
    if:
      type: text
      substr: github.com/kitepon/aiterm-mcp

  - id: aiterm-process-probe
    desc: aiterm process probe function
    for: [javascript, typescript]
    if:
      type: text
      substr: aitermProcessProbe

  - id: aiterm-steer-delivery
    desc: aiterm-steer-delivery import
    for: [javascript, typescript, package.json]
    if:
      type: text
      substr: aiterm-steer-delivery

  - id: codex-delivery-error
    desc: aiterm Codex delivery error marker
    for: [javascript, typescript]
    if:
      type: text
      substr: CodexDeliveryError

composite_rules:
  - id: aiterm-mcp-package
    desc: aiterm-mcp terminal MCP server
    crit: notable
    conf: 0.99
    for: [package.json, javascript, typescript, npm, json, markdown]
    any:
      - id: package-name
      - id: npm-package-name
      - id: mcp-registry-name
      - id: github-repo
      - id: aiterm-process-probe
      - id: aiterm-steer-delivery
      - id: codex-delivery-error
