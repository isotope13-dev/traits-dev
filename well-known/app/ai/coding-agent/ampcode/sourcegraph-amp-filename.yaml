defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: sourcegraph-amp-filename
    desc: Sourcegraph AMP VSIX filename
    crit: notable
    conf: 0.1
    if:
      type: path
      basename: true
      exact: sourcegraph.amp-0.0.1772799397.vsix
  # U+E0020 is the deprecated TAG SPACE character from the Unicode Tags
  # block. Unlike the tag letters used by the legitimate England, Scotland,
  # and Wales subdivision-flag emoji sequences, TAG SPACE has no routine
  # rendered-text use. Attackers insert its UTF-8 bytes inside visible words
  # so literal signatures and tokenizers no longer see the original token.
