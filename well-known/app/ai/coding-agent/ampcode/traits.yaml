# Sourcegraph Amp — terminal coding agent (ampcode.com / @ampcode/cli).
# Platform npm packages ship a Bun-compiled native binary named `amp` / `amp.exe`.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, javascript, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: ampcode-platform-package-name
    desc: Amp CLI platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^@ampcode/cli(-[a-z0-9_-]+)?$'

  - id: ampcode-native-binary-name
    desc: Amp CLI native binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^amp(\.exe)?$'

  - id: ampcode-npm-package-link
    desc: Link to official @ampcode/cli package
    for: [markdown, package.json, text]
    if:
      type: text
      substr: 'npmjs.com/package/@ampcode/cli'

  - id: ampcode-license-sourcegraph
    desc: Sourcegraph Amp license terms reference
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)Sourcegraph Inc\..{0,60}ampcode\.com'

  - id: ampcode-sidecar-state-dir
    desc: Amp desktop sidecar state directory
    for: [macho, shell]
    platforms: [macos]
    size_min: 1000
    size_max: 300000000
    if:
      type: text
      substr: '.amp-sidecar/'

  - id: ampcode-namespace-mac-token-guard
    desc: Probes Namespace Mac runner token file
    for: [macho, shell]
    platforms: [macos]
    size_min: 1000
    size_max: 300000000
    if:
      type: text
      substr: '/var/run/nsc/token.json'

composite_rules:
  - id: ampcode-cli-distribution
    desc: Amp CLI distribution identity
    crit: notable
    conf: 0.99
    any:
      - id: ampcode-platform-package-name
      - id: ampcode-npm-package-link
      - id: ampcode-license-sourcegraph

  - id: ampcode-bun-runtime
    desc: Amp CLI packaged Bun runtime
    crit: exception
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    all:
      - id: ampcode-native-binary-name
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-standalone-graph-trailer

  # The CLI embeds a provisioning script that pre-grants screen capture and
  # accessibility to Amp's own desktop helper on ephemeral Namespace Mac
  # runners. It aborts unless the runner token file exists and SIP is already
  # off, so it never alters a user's Mac. Both Amp state and the runner guard
  # must be present; a bare TCC write still convicts.
  - id: ampcode-desktop-helper-tcc-provisioning
    desc: Amp helper TCC grant gated on Namespace runner
    crit: exception
    conf: 0.95
    for: [macho, shell]
    platforms: [macos]
    all:
      - id: ampcode-sidecar-state-dir
      - id: ampcode-namespace-mac-token-guard
