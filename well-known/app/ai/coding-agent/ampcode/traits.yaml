# Sourcegraph Amp — terminal coding agent (ampcode.com / @ampcode/cli).
# Platform npm packages ship a Bun-compiled native binary named `amp` / `amp.exe`.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, javascript, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: ampcode-platform-package-name
    desc: Amp CLI platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^@ampcode/cli(-[a-z0-9_-]+)?$'

  - id: ampcode-native-binary-name
    desc: Amp CLI native binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^amp(\.exe)?$'

  - id: ampcode-npm-package-link
    desc: Link to official @ampcode/cli package
    for: [markdown, package.json, text]
    if:
      type: text
      substr: 'npmjs.com/package/@ampcode/cli'

  - id: ampcode-license-sourcegraph
    desc: Sourcegraph Amp license terms reference
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)Sourcegraph Inc\..{0,60}ampcode\.com'

composite_rules:
  - id: ampcode-cli-distribution
    desc: Amp CLI distribution identity
    crit: notable
    conf: 0.99
    any:
      - id: ampcode-platform-package-name
      - id: ampcode-npm-package-link
      - id: ampcode-license-sourcegraph

  - id: ampcode-bun-runtime
    desc: Amp CLI packaged Bun runtime
    crit: exception
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    all:
      - id: ampcode-native-binary-name
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-standalone-graph-trailer
