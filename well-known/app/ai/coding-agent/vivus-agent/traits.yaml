# Vivus — local AI coding agent (Claude Code–derived bundle). The dist CLI
# embeds PowerShell parsing helpers that reference -EncodedCommand for sandbox
# wrappers; that is not a hidden payload launch.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: package-name
    desc: Vivus agent npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: vivus-agent

  - id: npm-package-name
    desc: Vivus agent npm archive name
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: vivus-agent

  - id: bundle-powershell-parse-env
    desc: Vivus bundled PowerShell parse timeout env
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: VIVUS_CODE_PWSH_PARSE_TIMEOUT_MS

  - id: bundle-encoded-command-guard
    desc: Vivus bundled EncodedCommand policy check
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: function checkEncodedCommand(parsed)

  - id: bin-proxy-launcher-setdefault
    desc: Vivus bin routes Anthropic traffic via proxy
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: setDefault('ANTHROPIC_BASE_URL', PROXY)

composite_rules:
  - id: vivus-agent-package
    desc: Vivus AI coding agent package or bundle
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: npm-package-name
      - id: bundle-powershell-parse-env
      - id: bundle-encoded-command-guard
      - id: bin-proxy-launcher-setdefault
