# @codyswann/lisa — Cody Swann's Claude Code governance framework (CodySwannGT/lisa).
# postinstall registers bundled plugins and merge drivers; that is documented product setup.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Cody Swann LISA npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@codyswann/lisa'

  - id: npm-package-name
    desc: Cody Swann LISA npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@codyswann/lisa'

  - id: repository-url
    desc: Official Cody Swann LISA GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/CodySwannGT/lisa(\.git)?$'

  - id: npm-repository-url
    desc: Cody Swann LISA npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/CodySwannGT/lisa(\.git)?$'

  - id: upstream-repository-text
    desc: Cody Swann LISA upstream repository reference
    for: [javascript, typescript, markdown, text, shell]
    if:
      type: text
      substr: github.com/CodySwannGT/lisa

  - id: governance-product-description
    desc: LISA Claude Code governance product description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)claude code governance'

  - id: install-claude-plugins-script
    desc: LISA install-claude-plugins postinstall helper
    for: [javascript, typescript, shell]
    if:
      type: text
      substr: install-claude-plugins

composite_rules:
  - id: official-package-identity
    desc: Official Cody Swann LISA package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Cody Swann LISA repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url
      - id: upstream-repository-text

  - id: archive-context
    desc: Cody Swann LISA governance framework install context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: official-repository-identity
      - id: governance-product-description
      - id: install-claude-plugins-script
