# ezcoder — CLI coding agent with OAuth authentication for Anthropic, OpenAI, and Gemini
# npm: @prestyj/cli, repo: Gahroot/ezcoder
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: package-name
    desc: ezcoder CLI npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@prestyj/cli"

  - id: npm-package-name
    desc: ezcoder CLI npm archive name
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@prestyj/cli"

  - id: ezcoder-repo-url
    desc: ezcoder repository URL
    crit: notable
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: "github.com/Gahroot/ezcoder"

  - id: ezcoder-bin-config
    desc: ezcoder binary mapping in package manifest
    crit: notable
    for: [package.json]
    if:
      type: text
      regex: '"ezcoder"\s*:\s*"\./dist/cli\.js"'

composite_rules:
  - id: ezcoder-package-context
    desc: ezcoder CLI coding agent package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: npm-package-name
      - id: ezcoder-repo-url
      - id: ezcoder-bin-config
