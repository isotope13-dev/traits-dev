defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: neokai-server-title
    desc: NeoKai AI development server title
    for: [binaries, javascript]
    size_min: 10000
    if:
      type: text
      substr: NeoKai Server

  - id: neokai-github-user-agent
    desc: NeoKai GitHub integration user-agent
    for: [binaries, javascript]
    size_min: 10000
    if:
      type: text
      substr: NeoKai-GitHub-Integration/1.0

  - id: neokai-platform-package
    desc: NeoKai platform CLI package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@neokai/cli-[a-z0-9-]{3,40}$'
