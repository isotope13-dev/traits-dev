# Happyvertical SDK packages ship AGENT.md plus a workspace metadata.json used by
# the claude-context installer — not an npm registry packument.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: happyvertical-scoped-package-name
    desc: Official @happyvertical scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@happyvertical/'

  - id: happyvertical-npm-scoped-name
    desc: Official @happyvertical npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@happyvertical/'

  - id: happyvertical-sdk-repository
    desc: Happyvertical SDK monorepo repository reference
    for: [javascript, typescript, package.json, markdown, text]
    if:
      type: text
      substr: github.com/happyvertical/sdk

  - id: happyvertical-npm-sdk-repository
    desc: Happyvertical SDK monorepo npm repository field
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com[:/]happyvertical/sdk'

  - id: sdk-package-metadata-document
    desc: Happyvertical workspace package metadata sidecar
    for: [json, pkginfo]
    if:
      type: text
      substr: '"externalHappyVertical"'

  - id: claude-context-installer-marker
    desc: Happyvertical claude-context installer script
    for: [javascript, typescript]
    if:
      type: text
      substr: Installed @happyvertical/

composite_rules:
  - id: archive-context
    desc: Happyvertical SDK package archive
    crit: exception
    scope: archive
    for: [npm, tar, zip, package.json]
    any:
      - id: happyvertical-scoped-package-name
      - id: happyvertical-npm-scoped-name
      - id: happyvertical-sdk-repository
      - id: happyvertical-npm-sdk-repository
