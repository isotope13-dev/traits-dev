# vtcode — Vinh Nguyen AI coding agent CLI (Rust).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 300000000

traits:
  - id: cargo-package-name
    desc: vtcode Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: crate.name
      exact: vtcode

  - id: github-repo
    desc: vtcode GitHub repository marker
    for: [rust, python, markdown, cargo.toml]
    if:
      type: text
      substr: github.com/vinhnx/vtcode

  - id: vtcode-commons-path
    desc: vtcode commons crate path
    for: [rust]
    if:
      type: text
      substr: vtcode-commons

  - id: vtcode-config-env
    desc: vtcode configuration env var
    for: [rust, python]
    if:
      type: text
      substr: VTCODE_CONFIG

  - id: vtcode-data-path
    desc: vtcode data directory path
    for: [rust, python]
    if:
      type: text
      substr: /.vtcode/

  - id: vtcode-binary-name
    desc: vtcode CLI binary name
    for: [elf]
    if:
      type: basename
      exact: vtcode

  - id: eval-harness-marker
    desc: vtcode eval harness subprocess argv
    for: [python]
    if:
      type: text
      substr: ./target/release/vtcode

  - id: install-script-url
    desc: vtcode official install.sh script URL
    for: [rust]
    if:
      type: text
      substr: vinhnx/vtcode/main/scripts/install.sh

  # Compiled-binary markers: the release ELF ships without Rust sources, so the
  # source-typed legs above never reach it.
  - id: binary-workspace-crate-path
    desc: vtcode workspace crate source path in binary
    for: [binaries]
    if:
      type: text
      regex: 'crates/(codegen|common)/vtcode-[a-z-]{2,30}/src/'

  - id: binary-config-file-name
    desc: vtcode.toml configuration file name in binary
    for: [binaries]
    if:
      type: text
      substr: vtcode.toml

  - id: binary-sandbox-exec-subcommand
    desc: vtcode sandbox-exec subcommand in binary
    for: [binaries]
    if:
      type: text
      substr: vtcode sandbox-exec

  - id: binary-secret-migrate-subcommand
    desc: vtcode secret migrate subcommand in binary
    for: [binaries]
    if:
      type: text
      substr: vtcode secret migrate

composite_rules:
  - id: vtcode-binary-agent
    desc: vtcode AI coding agent compiled binary
    crit: notable
    conf: 0.99
    scope: file
    needs: 2
    any:
      - id: binary-workspace-crate-path
      - id: binary-config-file-name
      - id: binary-sandbox-exec-subcommand
      - id: binary-secret-migrate-subcommand

  - id: vtcode-agent-package
    desc: vtcode AI coding agent CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: cargo-package-name
      - id: github-repo
      - id: vtcode-commons-path
      - id: vtcode-config-env
      - id: vtcode-data-path
      - id: vtcode-binary-name
    needs: 2

  - id: vtcode-eval-harness-context
    desc: vtcode empirical evaluation harness
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: eval-harness-marker
      - id: github-repo
