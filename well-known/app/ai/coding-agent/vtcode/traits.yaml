# vtcode — Vinh Nguyen AI coding agent CLI (Rust).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 300000000

traits:
  - id: cargo-package-name
    desc: vtcode Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: crate.name
      exact: vtcode

  - id: github-repo
    desc: vtcode GitHub repository marker
    for: [rust, python, markdown, cargo.toml]
    if:
      type: text
      substr: github.com/vinhnx/vtcode

  - id: vtcode-commons-path
    desc: vtcode commons crate path
    for: [rust]
    if:
      type: text
      substr: vtcode-commons

  - id: vtcode-config-env
    desc: vtcode configuration env var
    for: [rust, python]
    if:
      type: text
      substr: VTCODE_CONFIG

  - id: vtcode-data-path
    desc: vtcode data directory path
    for: [rust, python]
    if:
      type: text
      substr: /.vtcode/

  - id: vtcode-binary-name
    desc: vtcode CLI binary name
    for: [elf]
    if:
      type: basename
      exact: vtcode

  - id: eval-harness-marker
    desc: vtcode eval harness subprocess argv
    for: [python]
    if:
      type: text
      substr: ./target/release/vtcode

  - id: install-script-url
    desc: vtcode official install.sh script URL
    for: [rust]
    if:
      type: text
      substr: vinhnx/vtcode/main/scripts/install.sh

composite_rules:
  - id: vtcode-agent-package
    desc: vtcode AI coding agent CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: cargo-package-name
      - id: github-repo
      - id: vtcode-commons-path
      - id: vtcode-config-env
      - id: vtcode-data-path
      - id: vtcode-binary-name
    needs: 2

  - id: vtcode-eval-harness-context
    desc: vtcode empirical evaluation harness
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: eval-harness-marker
      - id: github-repo
