# ADHDev (@adhdev/*, author "vilmire") is a local AI-dev-tool daemon: an
# embedded HTTP/WS server for a local dashboard, an MCP server, and a web
# terminal (node-pty over WebSocket). It binds 127.0.0.1 by default (0.0.0.0
# only when the user sets standaloneBindHost) and gates the API behind a Bearer
# token. Its web terminal, command execution, and a Node-version-guard preinstall
# trip reverse-shell / npm-lifecycle heuristics; identify the vendor to clear
# them, mirroring codeam-cli / codeplane / qwen-code.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript, json, package.json, npm, text]
traits:
  - id: adhdev-npm-scope
    desc: ADHDev npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@adhdev/'
  - id: adhdev-bind-host-marker
    desc: ADHDev daemon bind-host config
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: standaloneBindHost
  - id: adhdev-scope-text
    desc: ADHDev package scope reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '@adhdev/'
  - id: adhdev-session-host-core-reference
    desc: ADHDev session-host core dependency reference
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: symbol
      kind: import
      exact: '@adhdev/session-host-core'
  - id: adhdev-brand-marker
    desc: ADHDev product brand marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: ADHDev

  - id: adhdev-cloud-service-url
    desc: ADHDev cloud service endpoint
    crit: notable
    conf: 0.99
    for: [javascript, typescript, text]
    if:
      type: text
      substr: 'https://api.adhf.dev'

  - id: adhdev-daemon-class-marker
    desc: ADHDev daemon class marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      word: AdhdevDaemon

  - id: adhdev-daemon-core-source-marker
    desc: ADHDev daemon-core source marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: 'daemon-core/src/'

  - id: adhdev-preinstall-node-version
    desc: ADHDev preinstall reads Node version
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      substr: process.versions.node

  - id: adhdev-preinstall-platform-branch
    desc: ADHDev preinstall checks Windows platform
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      substr: process.platform

  - id: adhdev-preinstall-guarded-exit
    desc: ADHDev preinstall guarded failure exit
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'process\.platform[\s\S]{0,240}process\.exit\(1\)'

  - id: adhdev-session-host-server-class
    desc: ADHDev session-host server class
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: symbol
      kind: function
      exact: SessionHostServer
composite_rules:
  - id: adhdev-daemon-runtime
    desc: ADHDev daemon runtime bundle
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: adhdev-brand-marker
      - id: adhdev-cloud-service-url
      - id: adhdev-daemon-class-marker
      - id: adhdev-daemon-core-source-marker

  - id: adhdev-daemon-package
    desc: ADHDev local-dashboard daemon
    crit: exception
    conf: 0.99
    all:
      - id: adhdev-scope-text
      - id: adhdev-brand-marker

  - id: adhdev-session-host-runtime
    desc: ADHDev local session-host runtime
    crit: exception
    conf: 0.99
    all:
      - id: adhdev-session-host-core-reference
      - id: adhdev-session-host-server-class
      - id: micro-behaviors/process/tty/pty::node-pty-module-ref

  - id: adhdev-preinstall-compatibility-context
    desc: ADHDev bounded preinstall compatibility check
    crit: exception
    conf: 0.99
    for: [package.json]
    all:
      - id: adhdev-npm-scope
      - id: adhdev-preinstall-node-version
      - id: adhdev-preinstall-platform-branch
      - id: adhdev-preinstall-guarded-exit
