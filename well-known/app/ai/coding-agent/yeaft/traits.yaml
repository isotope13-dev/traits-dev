# Yeaft Web Code Agent — Remote worker agent for Yeaft (github.com/yeaft/claude-web-chat).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.98

traits:
  - id: yeaft-webchat-agent-package-name
    desc: Yeaft Web Code Agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@yeaft/webchat-agent"

  - id: yeaft-github-repo
    desc: Yeaft Web Code Agent GitHub repository URL
    if:
      type: text
      substr: github.com/yeaft/claude-web-chat

  - id: yeaft-agent-service-name
    desc: Yeaft Web Code Agent service identifier
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(yeaft-agent|agent-tray\.ps1)\b'

composite_rules:
  - id: yeaft-webchat-agent-distribution
    desc: Yeaft Web Code Agent package distribution
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: yeaft-webchat-agent-package-name
      - id: yeaft-github-repo

  - id: yeaft-webchat-agent-context
    desc: Yeaft Web Code Agent remote worker agent context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip, package.json]
    any:
      - id: yeaft-webchat-agent-package-name
      - id: yeaft-github-repo
      - id: yeaft-agent-service-name
