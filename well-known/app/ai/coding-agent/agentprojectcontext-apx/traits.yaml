# APX (@agentprojectcontext/apx) — open-source Agent OS: CLI, daemon, and APC runtime.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: APX npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@agentprojectcontext/apx"

  - id: npm-archive-name
    desc: APX npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@agentprojectcontext/apx"

  - id: upstream-repository
    desc: APX upstream GitHub repository
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/agentprojectcontext/apx([./\s"''`?#]|$)'

  - id: apc-protocol-reference
    desc: Agent Project Context protocol repo ref
    for: [markdown, javascript, typescript]
    if:
      type: text
      substr: agentprojectcontext/agentprojectcontext

  - id: apx-daemon-service-label
    desc: APX per-user launchd daemon service label
    for: [javascript, typescript]
    if:
      type: text
      substr: dev.apx.daemon

composite_rules:
  - id: archive-context
    desc: APX Agent OS package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: npm-archive-name
      - id: upstream-repository
      - id: apc-protocol-reference
