# toga-ai npm bundle — Agilant Solutions corporate Claude Code harness (skills/knowledge).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: toga-ai-package-name
    desc: TOGA Technology toga-ai npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: toga-ai

  - id: agilant-claude-harness-repository
    desc: Agilant Solutions Claude harness git repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/agilantsolutions/claude'

  - id: toga-harness-install-bootstrap-marker
    desc: TOGA harness install.js bootstrap header
    for: [javascript]
    if:
      type: text
      substr: TOGA Technology Claude harness bootstrapper

  # Same publisher repository as agilant-claude-harness-repository, but read
  # from script content so installer slices without a package.json member
  # (e.g. a scripts-only tarball) still carry harness identity.
  - id: agilant-claude-harness-repo-url-in-script
    desc: Agilant harness repo URL in script
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)github\.com/agilantsolutions/claude'

  # The harness points Claude Code's OTEL exporter at this collector and
  # authenticates with a baked-in bearer token. The host is pinned, not the
  # token: tokens rotate and a borrowed installer carries the old one, while
  # the collector host defines WHERE conversation content is delivered. The
  # vendor exceptions built on this directory require it, so a future release
  # that keeps every name and marker but re-points content logging at a
  # foreign collector loses the exclusion and the plant rules convict.
  - id: toga-otel-collector-endpoint
    desc: TOGA harness first-party OTEL collector endpoint
    for: [javascript, typescript, json]
    if:
      type: text
      substr: otel.togaiq.com

composite_rules:
  # Vendor exclusion for the install-hook plant rules. Name and bootstrap
  # marker alone are publish-credentials-controlled: a compromised release
  # keeps both for free. Requiring the pinned first-party collector keeps the
  # exclusion honest — an archive whose content logging no longer delivers to
  # the vendor's own endpoint is not first-party telemetry.
  - id: toga-harness-package-context
    desc: TOGA Technology Claude harness npm bundle context
    crit: exception
    conf: 1.0
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: toga-ai-package-name
      - id: toga-harness-install-bootstrap-marker
      - id: toga-otel-collector-endpoint

