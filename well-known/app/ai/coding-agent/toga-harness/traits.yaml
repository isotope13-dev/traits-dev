# toga-ai npm bundle — Agilant Solutions corporate Claude Code harness (skills/knowledge).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: toga-ai-package-name
    desc: TOGA Technology toga-ai npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: toga-ai

  - id: agilant-claude-harness-repository
    desc: Agilant Solutions Claude harness git repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/agilantsolutions/claude'

  - id: toga-harness-install-bootstrap-marker
    desc: TOGA harness install.js bootstrap header
    for: [javascript]
    if:
      type: text
      substr: TOGA Technology Claude harness bootstrapper

  # Same publisher repository as agilant-claude-harness-repository, but read
  # from script content so installer slices without a package.json member
  # (e.g. a scripts-only tarball) still carry harness identity.
  - id: agilant-claude-harness-repo-url-in-script
    desc: Agilant harness repo URL in script
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)github\.com/agilantsolutions/claude'

composite_rules:
  - id: toga-harness-package-context
    desc: TOGA Technology Claude harness npm bundle context
    crit: exception
    conf: 1.0
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: toga-ai-package-name
      - id: toga-harness-install-bootstrap-marker

  # Only the npm-mandated package.json identity anchors this exception. A
  # self-identifying banner comment or repository URL inside script content is
  # the publisher's label, not benign context: a repacked slice keeps the
  # banner while dropping the manifest, so script-content legs alone never
  # satisfy the exception. An archive without the toga-ai manifest keeps every
  # finding this exception would otherwise suppress.
  - id: archive-context
    desc: TOGA Technology Claude harness npm installer context
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: toga-ai-package-name
    any:
      - id: toga-harness-install-bootstrap-marker
      - id: agilant-claude-harness-repository
      - id: agilant-claude-harness-repo-url-in-script
