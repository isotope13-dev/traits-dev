# toga-ai npm bundle — Agilant Solutions corporate Claude Code harness (skills/knowledge).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: toga-ai-package-name
    desc: TOGA Technology toga-ai npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: toga-ai

  - id: toga-ai-npm-package-name
    desc: TOGA Technology toga-ai npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: toga-ai

  - id: agilant-claude-harness-repository
    desc: Agilant Solutions Claude harness git repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/agilantsolutions/claude'

  - id: agilant-claude-harness-npm-repository
    desc: Agilant harness repository on npm archive
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/agilantsolutions/claude'

  - id: toga-harness-install-bootstrap-marker
    desc: TOGA harness install.js bootstrap header
    for: [javascript]
    if:
      type: text
      substr: TOGA Technology Claude harness bootstrapper

  # Same publisher repository as agilant-claude-harness-repository, but read
  # from script content so installer slices without a package.json member
  # (e.g. a scripts-only tarball) still carry harness identity.
  - id: agilant-claude-harness-repo-url-in-script
    desc: Agilant harness repo URL in script
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)github\.com/agilantsolutions/claude'

  # The harness points Claude Code's OTEL exporter at this collector and
  # authenticates with a baked-in bearer token. The host is pinned, not the
  # token: tokens rotate and a borrowed installer carries the old one, while
  # the collector host defines WHERE conversation content is delivered.
  - id: toga-otel-collector-endpoint
    desc: TOGA harness OTEL collector endpoint
    for: [javascript, typescript, json]
    if:
      type: text
      substr: otel.togaiq.com

composite_rules:
  # Removed: `documented-corporate-telemetry-install`. Its premise — that the
  # harness documents the OTEL export and the skip switch — is false: no
  # shipped file outside install.js mentions telemetry, OTEL, togaiq.com or
  # TOGA_SKIP_TELEMETRY (verified 1.0.1092/1097/1098), and install.js is the
  # code doing the export, not documentation of it.

  - id: official-package-identity
    desc: Official TOGA toga-ai npm package identity
    crit: exception
    any:
      - id: toga-ai-package-name
      - id: toga-ai-npm-package-name

  - id: official-repository-identity
    desc: Official Agilant Claude harness repository identity
    crit: exception
    any:
      - id: agilant-claude-harness-repository
      - id: agilant-claude-harness-npm-repository

  # The npm package is named toga-ai but publishes from agilantsolutions/claude;
  # without this pairing the folded-slug comparison reads clone-and-rename.
  - id: official-package-repository-pair
    desc: Official toga-ai package and Claude harness repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity

