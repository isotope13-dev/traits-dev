# Roll Agent — AI coding agent runtime (github.com/steveoon/roll-agent)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: roll-agent-package-name
    desc: Roll Agent npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@roll-agent/'

  - id: roll-agent-github-repo
    desc: Roll Agent GitHub repository URL
    if:
      type: text
      substr: github.com/steveoon/roll-agent

  - id: roll-agent-tool-name
    desc: Roll Agent shell tool name reference
    for: [javascript, typescript]
    if:
      type: text
      substr: "roll__bash"

  - id: roll-agent-output-dir
    desc: Roll Agent output dump directory reference
    for: [javascript, typescript]
    if:
      type: text
      substr: '".roll-agent"'

composite_rules:
  - id: roll-agent-source
    desc: Roll Agent coding agent runtime source context
    crit: exception
    any:
      - id: roll-agent-package-name
      - id: roll-agent-github-repo
      - id: roll-agent-tool-name
      - id: roll-agent-output-dir
