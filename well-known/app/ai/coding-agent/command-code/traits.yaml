# Command Code — local AI coding assistant desktop application and CLI.
defaults:
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: package-name
    desc: Command Code npm package name
    crit: notable
    for: [package.json]
    size_max: 1000000
    if:
      type: value
      path: name
      regex: '^(@commandcode/(desktop|harness|remote)|command-code)$'

  - id: product-name
    desc: Command Code product name
    crit: notable
    for: [package.json]
    size_max: 1000000
    if:
      type: value
      path: productName
      exact: Command Code

  - id: homepage-repository
    desc: Command Code repository or homepage
    crit: notable
    for: [package.json]
    size_max: 1000000
    if:
      type: value
      path: homepage
      substr: github.com/CommandCodeAI/

  - id: bundle-cli-exempt-subtrees
    desc: Command Code CLI exempt subtrees constant
    crit: notable
    for: [javascript, typescript]
    size_max: 10000000
    if:
      type: text
      word: COMMANDCODE_EXEMPT_SUBTREES

  - id: main-mcp-schema-marker
    desc: Command Code MCP server config schema marker
    crit: notable
    for: [javascript, typescript]
    size_max: 10000000
    if:
      type: text
      word: mcpServerConfigSchema

  - id: hooks-doc-header
    desc: Command Code hooks documentation header
    crit: notable
    for: [markdown]
    size_max: 1000000
    if:
      type: text
      substr: https://commandcode.ai/docs

  - id: desktop-app-path
    desc: Command Code application member path
    crit: notable
    for: [javascript, typescript, markdown, json, package.json, elf]
    size_max: 500000000
    if:
      type: path
      substr: Command Code/

  - id: desktop-entry-basename
    desc: Command Code desktop entry file
    crit: notable
    for: [desktop_entry]
    size_max: 100000
    if:
      type: basename
      exact: command-code.desktop

composite_rules:
  - id: command-code-package-context
    desc: Command Code AI coding agent package context
    crit: notable
    conf: 0.99
    for: [package.json, javascript, typescript, markdown, desktop_entry, elf, json]
    any:
      - id: package-name
      - id: product-name
      - id: homepage-repository
      - id: bundle-cli-exempt-subtrees
      - id: main-mcp-schema-marker
      - id: hooks-doc-header
      - id: desktop-app-path
      - id: desktop-entry-basename
