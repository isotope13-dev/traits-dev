defaults:
  platforms: [unix, windows]
composite_rules:
  - id: upstream-attribution-under-alternate-publisher
    desc: Cline attribution with alternate package publisher
    crit: notable
    conf: 0.93
    for: [vsix, package.json, npm, tar, zip, markdown]
    # The author field lives in extension/package.json and the upstream install
    # links live in the bundled locale READMEs, so the evidence has to pool
    # across archive entries.
    scope: archive
    all:
      # The shipped manifest still names the upstream vendor as its author...
      - id: well-known/app/ai/coding-agent/cline::vendor-author-name
      # ...and the bundled docs still point readers at the upstream listing.
      - id: well-known/app/ai/coding-agent/cline::upstream-marketplace-listing-link
    unless:
      # ...yet nothing in the package is published by the upstream vendor.
      - id: well-known/app/ai/coding-agent/cline::publisher
      - id: well-known/app/ai/coding-agent/cline::vsix-publisher
      - id: well-known/app/ai/coding-agent/cline::package-name
      - id: well-known/app/ai/coding-agent/cline::claude-dev-package-name
      - id: well-known/app/ai/coding-agent/cline::npm-scoped-cline-package-name

