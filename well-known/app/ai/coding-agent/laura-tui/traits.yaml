# Laura — TUI workspace that provides an API over the TUI for pairing with AI coding agents (thomaseleff/laura-tui).
# Platform packages ship a Rust-compiled Mach-O/ELF/PE named `laura`.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, whl, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: laura-package-name
    desc: Laura TUI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: laura-tui

  - id: laura-github-repo
    desc: Laura TUI GitHub repository URL
    for: [elf, macho, pe, pkginfo]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '(?i)(github\.com/|github\.io/)thomaseleff/laura-tui\b'

  - id: laura-workspace-summary
    desc: Laura TUI workspace summary string
    for: [elf, macho, pe, pkginfo]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      substr: 'Laura is a TUI workspace that provides your agent with an API over the TUI'

  - id: laura-env-marker
    desc: Laura TUI environment variable marker
    for: [elf, macho, pe, pkginfo]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '\bLAURA_(EXPERIMENTAL_EDITOR|RUNTIME|TAB)\b'

  - id: laura-binary-name
    desc: Laura native executable basename
    for: [elf, macho, pe]
    conf: 0.99
    size_min: 500000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^laura(\.exe)?$'

composite_rules:
  - id: laura-binary-identity
    desc: Laura native binary identity
    conf: 0.99
    for: [elf, macho, pe]
    all:
      - id: laura-binary-name
    any:
      - id: laura-github-repo
      - id: laura-workspace-summary
      - id: laura-env-marker

  - id: laura-package-identity
    desc: Laura package identity
    conf: 0.99
    for: [whl, tar, zip, pkginfo, elf, macho, pe]
    scope: outer
    any:
      - id: laura-binary-identity
      - id: laura-package-name
