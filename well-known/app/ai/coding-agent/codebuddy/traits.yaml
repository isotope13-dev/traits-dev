# CodeBuddy (Tencent) AI coding agent -- the Python SDK vendors a per-platform
# `codebuddy-headless` CLI (Bun-compiled Mach-O on macOS) and shells out to it,
# the same shape as the Claude Code SDK. The headless CLI is a full agent
# harness: localhost SOCKS/HTTP allowlist proxies gating sandboxed commands,
# seatbelt/bwrap/seccomp sandbox profiles, destructive-command detectors, and
# Bun-cron LaunchAgent scheduling. Those harness behaviors are expected here.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 500000000
traits:
  - id: codebuddy-sdk-member-path
    desc: Path inside a codebuddy-agent-sdk package
    for: [binaries, scripts, text]
    if:
      type: path
      regex: 'codebuddy_agent_sdk[/\\]'
  - id: codebuddy-signed-binary-identifier
    desc: Signed CodeBuddy headless CLI binary
    for: [macho]
    if:
      type: value
      path: macho.code_signature.identifier
      exact: codebuddy-headless

composite_rules:
  - id: codebuddy-headless-context
    desc: Tencent CodeBuddy headless agent CLI context
    crit: exception
    conf: 0.99
    for: [macho]
    any:
      - id: codebuddy-sdk-member-path
      - id: codebuddy-signed-binary-identifier
