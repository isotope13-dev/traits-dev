# CodeBuddy (Tencent) AI coding agent -- the Python SDK vendors a per-platform
# `codebuddy-headless` CLI (Bun-compiled Mach-O on macOS) and shells out to it,
# the same shape as the Claude Code SDK. The headless CLI is a full agent
# harness: localhost SOCKS/HTTP allowlist proxies gating sandboxed commands,
# seatbelt/bwrap/seccomp sandbox profiles, destructive-command detectors, and
# Bun-cron LaunchAgent scheduling. Those harness behaviors are expected here.
# The npm CLI (@tencent-ai/codebuddy-code) ships the same harness as bundled
# JavaScript plus a documented install/uninstall/status autostart daemon
# (launchd, systemd user unit, Task Scheduler) and a program deny-list that
# names LOLBins such as InstallUtil.exe.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 500000000
traits:
  - id: codebuddy-sdk-member-path
    desc: Path inside a codebuddy-agent-sdk package
    for: [binaries, scripts, text]
    if:
      type: path
      regex: 'codebuddy_agent_sdk[/\\]'
  - id: codebuddy-signed-binary-identifier
    desc: Signed CodeBuddy headless CLI binary
    for: [macho]
    if:
      type: value
      path: macho.code_signature.identifier
      exact: codebuddy-headless

  - id: npm-package-name
    desc: "@tencent-ai/codebuddy-code package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@tencent-ai/codebuddy-code'
  - id: daemon-service-name
    desc: CodeBuddy autostart daemon unit name
    for: [javascript]
    if:
      type: text
      substr: codebuddy-daemon.service
  - id: session-env-variable
    desc: CodeBuddy session environment variable
    for: [javascript]
    if:
      type: text
      substr: CODEBUDDY_SESSION_ID

composite_rules:
  - id: codebuddy-headless-context
    desc: Tencent CodeBuddy headless agent CLI context
    crit: exception
    conf: 0.99
    for: [macho, javascript, package.json, npm]
    any:
      - id: codebuddy-sdk-member-path
      - id: codebuddy-signed-binary-identifier
      - id: npm-package-name
      - id: daemon-service-name
      - id: session-env-variable
