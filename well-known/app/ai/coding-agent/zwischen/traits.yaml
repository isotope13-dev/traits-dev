# Zwischen — Claude Code adversary-review hook client. SessionStart /
# PreToolUse hooks, loopback intercept, and subprocess daemon spawn are
# the product; identify the package so those capabilities stay notable.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: zwischen PyPI wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: zwischen

  - id: package-metadata-name
    desc: zwischen PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*zwischen\s*$'

  - id: daemon-port-env
    desc: Zwischen daemon port environment variable
    for: [python]
    if:
      type: text
      substr: ZWISCHEN_DAEMON_PORT

  - id: docs-url
    desc: Zwischen product documentation URL
    for: [python, text]
    if:
      type: text
      substr: zwischen.ai/docs

  - id: hook-adapter-path
    desc: Zwischen Claude Code hook adapter path
    for: [python, whl]
    if:
      type: path
      regex: '(?i)zwischen[\\/]hook_adapter\.py'

  - id: hook-command
    desc: Zwischen Claude Code hook command
    for: [python]
    if:
      type: text
      substr: 'zwischen hook'

composite_rules:
  - id: zwischen-package
    desc: Zwischen Claude Code hook client package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: daemon-port-env
      - id: docs-url
      - id: hook-adapter-path
      - id: hook-command
    needs: 2
