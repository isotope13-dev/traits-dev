# yana-ai — disclosed agent-setup security audit product (PyPI wheel).
defaults:
  platforms: [unix, windows]
  for: [whl, python, zip, pkginfo]

traits:
  - id: yana-ai-pkg-name
    desc: yana-ai PyPI distribution name
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: yana-ai

  - id: yana-ai-pkg-summary
    desc: yana-ai audit product summary
    crit: notable
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: Audits your AI coding agent setup

  - id: yana-ai-wheel-tree
    desc: yana_ai package member path
    crit: notable
    conf: 0.99
    for: [whl, zip]
    if:
      type: path
      regex: '^yana_ai/'

composite_rules:
  - id: yana-ai-security-audit-product-context
    desc: Yana AI disclosed security audit wheel
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: yana-ai-pkg-name
      - id: yana-ai-wheel-tree
    any:
      - id: yana-ai-pkg-summary
