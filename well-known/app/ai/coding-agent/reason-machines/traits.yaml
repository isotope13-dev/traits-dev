# Reason Machines CLI — AI developer assistant native runtime and CLI (reason-machines/monorepo)
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, npm, tar, zip]
  crit: baseline
  conf: 0.98
  size_max: 524288000

traits:
  - id: reason-machines-package-name
    desc: Reason Machines platform npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@reason-machines/cli(-[a-z0-9_-]+)?$'

  - id: reason-machines-npm-archive-name
    desc: Reason Machines platform npm archive name
    crit: notable
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@reason-machines/cli-[a-z0-9_-]+$'

  - id: reason-machines-github-repo
    desc: Reason Machines GitHub repository reference
    crit: notable
    for: [elf, macho, pe, text, package.json]
    if:
      type: text
      substr: reason-machines/monorepo

  - id: reason-machines-website
    desc: Reason Machines website reference
    crit: notable
    # Shared by the native CLI and device-agent context. Consumers retain
    # their own file-type and size constraints.
    platforms: [unix, windows]
    for: [elf, macho, pe, text, package.json, javascript, typescript]
    if:
      type: text
      substr: reasonmachines.com

  - id: reason-machines-signed-macho
    desc: Reason Machines signed macOS binary identifier
    crit: notable
    conf: 0.99
    for: [macho]
    size_min: 1000000
    if:
      type: value
      path: macho.code_signature.identifier
      exact: so.ara.device-broker

  - id: reason-machines-permission-tile-macho
    desc: Reason permission onboarding tile identifier
    crit: notable
    conf: 0.99
    for: [macho]
    if:
      type: value
      path: macho.code_signature.identifier
      exact: so.ara.cli.permission-tile

  - id: reason-machines-background-bundle-id
    desc: Reason background helper bundle identifier
    crit: notable
    conf: 0.98
    for: [macho, plist]
    if:
      type: text
      substr: so.ara.cli

  - id: reason-machines-bunfs-root
    desc: Reason Machines ara bunfs entrypoint marker
    crit: notable
    conf: 0.96
    for: [elf, macho, pe, text]
    size_min: 1000000
    if:
      type: text
      substr: '$bunfs/root/ara'

  # The account API verb that imports locally discovered third-party agent
  # OAuth tokens ({provider, access, expires}) into the signed-in account.
  - id: local-subscription-api-call
    desc: Calls Reason account localSubscription API
    crit: notable
    conf: 0.92
    platforms: [unix, windows]
    for: [javascript, typescript]
    size_max: 52428800
    if:
      type: symbol
      kind: call
      substr: localSubscription

  - id: local-subscription-api-route
    desc: Reason /local-subscription device API route
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [elf, macho, pe, javascript]
    if:
      type: text
      regex: 'localSubscription:\w{1,3}\("/local-subscription","device_proof"\)'

  - id: reason-hands-protocol-version
    desc: Reason Hands worker protocol version constant
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: REASON_HANDS_PROTOCOL_VERSION

  - id: reason-worker-macos-bundle-prefix
    desc: Reason worker LaunchAgent bundle id prefix
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: com.reasonmachines.worker.

  - id: reason-linux-ara-desktop-entry
    desc: Reason Linux desktop Chromium launcher entry
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: ara-chromium.desktop

  - id: reason-workspace-setup-temp-prefix
    desc: Reason workspace setup temp dir prefix
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: reason-workspace-setup-

  - id: reason-local-login-token-handoff
    desc: Enables local login handoff
    crit: notable
    conf: 0.99
    for: [elf, macho, pe, javascript, typescript]
    platforms: [unix, windows]
    if:
      type: text
      regex: 'localLogins===!0[\s\S]{0,200}handOverLocalLogins'

  - id: reason-machines-install-script-url
    desc: Reason Machines official install script URL
    crit: notable
    conf: 0.98
    for: [javascript, typescript, shell, markdown, python]
    if:
      type: text
      substr: reasonmachines.com/install

composite_rules:
  - id: reason-machines-cli
    desc: Reason Machines coding agent native CLI
    crit: notable
    conf: 0.98
    any:
      - id: reason-machines-package-name
      - id: reason-machines-github-repo
      - id: reason-machines-website
      - id: reason-machines-signed-macho
      - id: reason-machines-permission-tile-macho
      - id: reason-machines-background-bundle-id
      - id: reason-machines-bunfs-root
      - id: reason-local-login-token-handoff

  - id: reason-machines-cli-context
    desc: Reason Machines coding agent CLI context
    crit: exception
    conf: 0.98
    for: [elf, macho, pe, tar, npm, package.json, javascript]
    any:
      - id: reason-machines-package-name
      - id: reason-machines-npm-archive-name
      - id: reason-machines-github-repo
      - id: reason-machines-website
      - id: reason-machines-signed-macho
      - id: reason-machines-permission-tile-macho
      - id: reason-machines-background-bundle-id
      - id: reason-machines-bunfs-root
      - id: reason-hands-protocol-version
      - id: reason-worker-macos-bundle-prefix
      - id: reason-linux-ara-desktop-entry
      - id: reason-workspace-setup-temp-prefix
      - id: reason-machines-install-script-url
