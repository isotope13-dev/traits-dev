# Reason Machines CLI — AI developer assistant native runtime and CLI (reason-machines/monorepo)
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, npm, tar, zip]
  crit: baseline
  conf: 0.98
  size_max: 524288000

traits:
  - id: reason-machines-package-name
    desc: Reason Machines platform npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@reason-machines/cli(-[a-z0-9_-]+)?$'

  - id: reason-machines-github-repo
    desc: Reason Machines GitHub repository reference
    crit: notable
    for: [elf, macho, pe, text, package.json]
    if:
      type: text
      substr: reason-machines/monorepo

  - id: reason-machines-website
    desc: Reason Machines website reference
    crit: notable
    # Shared by the native CLI and device-agent context. Consumers retain
    # their own file-type and size constraints.
    platforms: [unix, windows]
    for: [elf, macho, pe, text, package.json, javascript, typescript]
    if:
      type: text
      substr: reasonmachines.com

  - id: reason-machines-signed-macho
    desc: Reason Machines signed macOS binary identifier
    crit: notable
    conf: 0.99
    for: [macho]
    size_min: 1000000
    if:
      type: value
      path: macho.code_signature.identifier
      exact: so.ara.device-broker

  - id: reason-machines-bunfs-root
    desc: Reason Machines ara bunfs entrypoint marker
    crit: notable
    conf: 0.96
    for: [elf, macho, pe, text]
    size_min: 1000000
    if:
      type: text
      substr: '$bunfs/root/ara'

  # The account API verb that imports locally discovered third-party agent
  # OAuth tokens ({provider, access, expires}) into the signed-in account.
  - id: local-subscription-api-call
    desc: Calls Reason account localSubscription API
    crit: notable
    conf: 0.92
    platforms: [unix, windows]
    for: [javascript, typescript]
    size_max: 52428800
    if:
      type: symbol
      kind: call
      substr: localSubscription

  - id: local-subscription-api-route
    desc: Reason /local-subscription device API route
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [elf, macho, pe, javascript]
    if:
      type: text
      regex: 'localSubscription:\w{1,3}\("/local-subscription","device_proof"\)'

composite_rules:
  - id: reason-machines-cli
    desc: Reason Machines coding agent native CLI
    crit: notable
    conf: 0.98
    any:
      - id: reason-machines-package-name
      - id: reason-machines-github-repo
      - id: reason-machines-website
      - id: reason-machines-signed-macho
      - id: reason-machines-bunfs-root

  - id: reason-machines-cli-context
    desc: Reason Machines coding agent CLI context
    crit: exception
    conf: 0.98
    for: [elf, macho, pe, tar, npm, package.json, javascript]
    any:
      - id: reason-machines-github-repo
      - id: reason-machines-website
      - id: reason-machines-signed-macho
      - id: reason-machines-bunfs-root
