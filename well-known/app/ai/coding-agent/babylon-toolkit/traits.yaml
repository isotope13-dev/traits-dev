# @babylonjs-toolkit/agent — Babylon Toolkit skills CLI for coding agents.
# Optional `bt-agent bridge --install-service` writes a documented launchd,
# systemd, or Windows Startup VBS launcher that starts the Unity bridge helper.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: babylon-toolkit-package-name
    desc: Babylon Toolkit agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@babylonjs-toolkit/agent'

  - id: babylon-toolkit-repository-url
    desc: babylontoolkit skills GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]babylontoolkit/skills'

  - id: babylon-toolkit-bridge-launchd-label
    desc: Babylon Toolkit bridge launchd agent label
    for: [javascript]
    if:
      type: text
      substr: com.babylontoolkit.bridge

  - id: babylon-toolkit-bridge-vbs-name
    desc: Babylon Toolkit Startup VBS launcher name
    for: [javascript]
    if:
      type: text
      substr: babylon-toolkit-bridge.vbs

composite_rules:
  - id: babylon-toolkit-documented-package-context
    desc: Babylon Toolkit agent documented package context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: outer
    all:
      - id: babylon-toolkit-package-name
      - id: babylon-toolkit-repository-url

  - id: babylon-toolkit-autostart-service-context
    desc: Babylon Toolkit documented Windows autostart service wiring
    crit: exception
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: babylon-toolkit-bridge-launchd-label
      - id: babylon-toolkit-bridge-vbs-name
