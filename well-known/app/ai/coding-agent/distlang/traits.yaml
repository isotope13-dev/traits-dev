# Distlang Agent Debugger Claude Code plugin (@distlang/claude-code-plugin).
# Captures Claude Code hook events and uploads them to Distlang; managed
# distlang CLI install is the product, not a supply-chain dropper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, npm, tar, gz]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: npm-package-name
    desc: distlang Claude Code plugin package name
    for: [package.json, npm, tar, gz]
    if:
      type: value
      path: name
      exact: "@distlang/claude-code-plugin"

  - id: github-repository
    desc: distlanglabs Claude Code plugin repository
    if:
      type: text
      substr: distlanglabs/claude-code-plugin

  - id: ingest-api-path
    desc: Distlang agent debugger ingest path
    for: [javascript, typescript]
    if:
      type: text
      substr: /agent-debugger/v1/ingest

  - id: install-main-url
    desc: Distlang CLI install-main URL
    for: [javascript, typescript]
    if:
      type: text
      substr: distlang.com/install-main

  - id: plugin-state-basename
    desc: Distlang Claude plugin state filename
    for: [javascript, typescript]
    if:
      type: text
      substr: distlang-plugin.json

  - id: hook-status-field
    desc: Distlang hook status payload field
    for: [javascript, typescript]
    if:
      type: text
      substr: distlang_status

  - id: claude-code-env-prefix
    desc: Distlang Claude Code env prefix
    for: [javascript, typescript]
    if:
      type: text
      substr: DISTLANG_CLAUDE_CODE_

  - id: claude-hook-token-source
    desc: Claude hook token usage source
    for: [javascript, typescript]
    if:
      type: text
      substr: claude_hook

composite_rules:
  - id: distlang-claude-code-plugin-identity
    desc: Recognized Distlang Claude Code plugin
    needs: 2
    any:
      - id: npm-package-name
      - id: github-repository
      - id: ingest-api-path
      - id: install-main-url
      - id: plugin-state-basename
      - id: hook-status-field
      - id: claude-code-env-prefix
      - id: claude-hook-token-source
