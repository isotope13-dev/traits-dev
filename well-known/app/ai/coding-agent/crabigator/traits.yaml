# Crabigator — TUI wrapper for Claude Code, Codex, opencode, and Grok
# with real-time status widgets and terminal multiplexer (samuelclay/crabigator).
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: crabigator-package-name
    desc: Crabigator npm package name
    for: [package.json]
    conf: 0.99
    size_min: 50
    size_max: 50000
    if:
      type: value
      path: name
      exact: crabigator

  - id: crabigator-github-repo
    desc: Crabigator GitHub repository URL
    for: [elf, macho, pe, javascript]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '(?i)github\.com/samuelclay/crabigator\b'

  - id: crabigator-product-site
    desc: Crabigator product site URL
    for: [elf, macho, pe, javascript]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '(?i)https?://(drink)?crabigator\.com\b'

  - id: crabigator-env-marker
    desc: Crabigator environment variable marker
    for: [elf, macho, pe, javascript]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '\bCRABIGATOR_(INSTALLED_VIA|SESSION_ID|PROFILE)\b'

  - id: crabigator-cli-usage
    desc: Crabigator CLI usage text
    for: [elf, macho, pe, javascript]
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      substr: 'Usage: crabigator'

  - id: crabigator-binary-name
    desc: Crabigator native executable basename
    for: [elf, macho, pe]
    conf: 0.99
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^crabigator(\.exe)?$'

composite_rules:
  - id: crabigator-binary-identity
    desc: Crabigator native binary identity
    conf: 0.99
    for: [elf, macho, pe]
    all:
      - id: crabigator-binary-name
    any:
      - id: crabigator-github-repo
      - id: crabigator-product-site
      - id: crabigator-env-marker
      - id: crabigator-cli-usage

  - id: crabigator-package-identity
    desc: Crabigator package identity
    conf: 0.99
    for: [npm, tar, zip, package.json, elf, macho, pe, javascript]
    scope: outer
    all:
      - id: crabigator-package-name
    any:
      - id: crabigator-github-repo
      - id: crabigator-product-site
      - id: crabigator-env-marker
