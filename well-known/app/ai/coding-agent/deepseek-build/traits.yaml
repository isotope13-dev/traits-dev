# DeepSeek Build (@innocarpe/deepseek-build) — npm launcher for a DeepSeek-native
# terminal coding agent. Postinstall fetches GitHub release natives into
# ~/.deepseek-build/bin; this identity distinguishes that wrapper from a
# generic install-time dropper.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: npm-package-name
    desc: DeepSeek Build npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: "@innocarpe/deepseek-build"

  - id: github-repository
    desc: DeepSeek Build GitHub repository
    if:
      type: text
      substr: github.com/innocarpe/deepseek-build

  - id: product-home-dir
    desc: DeepSeek Build product home directory
    for: [javascript]
    if:
      type: text
      substr: ".deepseek-build"

  - id: product-home-env
    desc: DeepSeek Build home environment variable
    for: [javascript]
    if:
      type: text
      word: DEEPSEEK_BUILD_HOME

composite_rules:
  - id: npm-wrapper-identity
    desc: DeepSeek Build npm wrapper identity
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: npm-package-name
      - id: github-repository
      - id: product-home-dir
      - id: product-home-env
