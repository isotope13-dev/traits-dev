defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: tabby-basename
    crit: notable
    desc: Filename matches tabby or tabby.exe
    for: [elf, pe, macho, javascript]
    size_max: 200000000
    if:
      type: basename
      regex: '^tabby(\.exe)?$'
  - id: tabby-release-path
    crit: notable
    desc: Filename matches a Tabby release name
    for: [elf, pe, macho]
    size_max: 200000000
    if:
      type: path
      basename: true
      regex: '^tabby(_x86_64|-[^\\/]+)?(\.exe)?$'
  - id: tabby-source-member
    crit: notable
    desc: Path contains tabby-nightly
    for: [javascript, typescript, python, shell, json, source, data]
    size_min: 1
    size_max: 300000000
    if:
      type: path
      substr: tabby-nightly
composite_rules:
  - id: tabby-release-binary
    desc: Tabby release binary
    crit: notable
    conf: 0.98
    any:
      - id: tabby-basename
      - id: tabby-release-path
  - id: tabby-openapi-codegen
    desc: Tabby OpenAPI codegen script
    crit: notable
    conf: 0.98
    all:
      - id: tabby-source-member
      - id: metadata/filename/name-form::codegen-js-basename
  - id: tabby-eval-dataset
    desc: Tabby evaluation dataset
    crit: notable
    conf: 0.98
    all:
      - id: tabby-source-member
      - id: metadata/package/files/runtime::experimental-eval-path
  - id: tabby-ai-assistant
    desc: Tabby self-hosted AI coding assistant
    crit: notable
    conf: 0.98
    any:
      - id: tabby-release-binary
      - id: tabby-openapi-codegen
      - id: tabby-eval-dataset
