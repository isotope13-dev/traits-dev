defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: tabby-basename
    desc: Tabby binary basename
    for: [elf, pe, macho, javascript]
    size_max: 200000000
    if:
      type: basename
      regex: '^tabby(\.exe)?$'
  - id: tabby-release-path
    desc: Tabby release archive path
    for: [elf, pe, macho]
    size_max: 200000000
    if:
      type: path
      basename: true
      regex: '^tabby(_x86_64|-[^\\/]+)?(\.exe)?$'
  - id: llama-server-basename
    desc: llama-server bundled binary
    for: [elf, pe, macho]
    size_max: 200000000
    if:
      type: path
      basename: true
      regex: '^llama-server(\.exe)?$'
  - id: tabby-source-member
    desc: Tabby source archive member
    for: [javascript, typescript, python, shell, json, source, data]
    size_min: 1
    size_max: 300000000
    if:
      type: path
      substr: tabby-nightly
  - id: tabby-eval-dataset-member
    desc: Tabby evaluation dataset member
    for: [python, json, source, data]
    if:
      type: path
      regex: 'experimental[\\/]eval'
  - id: codegen-js-basename
    desc: codegen.js basename
    for: [javascript]
    if:
      type: basename
      exact: codegen.js

composite_rules:
  - id: tabby-release-binary
    desc: Tabby release binary
    crit: notable
    conf: 0.98
    any:
      - id: tabby-basename
      - id: tabby-release-path
      - id: llama-server-basename
  - id: tabby-openapi-codegen
    desc: Tabby OpenAPI codegen script
    crit: notable
    conf: 0.98
    all:
      - id: tabby-source-member
      - id: codegen-js-basename
  - id: tabby-eval-dataset
    desc: Tabby evaluation dataset
    crit: notable
    conf: 0.98
    all:
      - id: tabby-source-member
      - id: tabby-eval-dataset-member
  - id: tabby-ai-assistant
    desc: Tabby self-hosted AI coding assistant
    crit: notable
    conf: 0.98
    any:
      - id: tabby-release-binary
      - id: tabby-openapi-codegen
      - id: tabby-eval-dataset
