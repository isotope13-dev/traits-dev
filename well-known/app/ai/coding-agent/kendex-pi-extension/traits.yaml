# Kendex Pi extensions — npm packages for the Pi coding agent (Earendil Works)
# that declare `pi.appendSystem` and run the vendored `append-system.mjs` on
# postinstall to upsert extension instructions into APPEND_SYSTEM.md.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: pi-append-system-manifest
    desc: Pi package declares appendSystem source
    for: [package.json]
    if:
      type: value
      path: pi.appendSystem
      exists: true

  - id: kendex-upstream-repository
    desc: Kendex monorepo upstream repository
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      regex: 'github\.com/vanillagreencom/kendex([./\s"''`?#]|$)'

  - id: append-system-postinstall
    desc: postinstall runs Kendex append-system helper
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      substr: append-system.mjs

  - id: append-system-block-marker
    desc: Kendex append-system HTML block marker
    for: [javascript, typescript]
    if:
      type: text
      substr: kendex:append-system

composite_rules:
  - id: archive-context
    desc: Kendex Pi extension documented appendSystem setup
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: pi-append-system-manifest
    any:
      - id: kendex-upstream-repository
      - id: append-system-postinstall
      - id: append-system-block-marker
      - id: metadata/package/keywords/identity::npm-keyword-pi-package
