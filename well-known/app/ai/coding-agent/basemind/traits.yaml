# Basemind — context and coordination layer for AI coding agents (Goldziher/basemind).
# Provides MCP server, tree-sitter code-map, document RAG, shared agent memory,
# and token-compression output filters that preserve credentials and error detail.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, package.json, javascript, typescript, python, markdown, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: basemind-scoped-path
    desc: Basemind package or repository path
    for: [scripts, source, markdown, text, json, package.json, rust, cargo.toml, python]
    if:
      type: path
      regex: 'goldziher[\\/]basemind(@|[\\/]|$)'

  - id: basemind-upstream-repository
    desc: Basemind upstream GitHub repository URL
    for: [cargo.toml, package.json, markdown, rust, text, python]
    if:
      type: text
      substr: github.com/Goldziher/basemind

  - id: basemind-cargo-package-name
    desc: Basemind Cargo package name
    for: [cargo.toml]
    if:
      type: text
      regex: '(?m)^name\s*=\s*"basemind"'

  - id: basemind-npm-package-name
    desc: Basemind npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: basemind

  - id: basemind-output-compression-safety
    desc: Basemind credential preservation module
    for: [rust]
    if:
      type: text
      substr: never trade a secret for token savings

composite_rules:
  - id: basemind-coding-agent
    desc: Basemind AI coding-agent context layer
    crit: notable
    conf: 0.99
    any:
      - id: basemind-scoped-path
      - id: basemind-upstream-repository
      - id: basemind-cargo-package-name
      - id: basemind-npm-package-name
      - id: basemind-output-compression-safety
