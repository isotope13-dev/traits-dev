# yaver-cli — Yaver agent/MCP npm bootstrap (yaver-io/yaver.io). Postinstall
# may append a marked PATH export to shell rc files so global `yaver` resolves;
# that is documented installer behavior, not a hidden implant.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: yaver-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: yaver-cli

  - id: mcp-registry-name
    desc: Yaver MCP registry identifier
    for: [package.json]
    if:
      type: value
      path: mcpName
      exact: io.github.yaver-io/yaver

  - id: upstream-repository
    desc: Official yaver-io Yaver repository
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)github\.com[/:]yaver-io/yaver'

  - id: shell-path-marker
    desc: Documented yaver-cli shell PATH marker comment
    for: [javascript]
    if:
      type: text
      substr: '# yaver-cli PATH'

composite_rules:
  - id: yaver-cli-archive-context
    desc: Official Yaver agent npm CLI bootstrap package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: mcp-registry-name
      - id: upstream-repository
      - id: shell-path-marker
