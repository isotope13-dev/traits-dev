# Hermes Agent — The self-improving AI agent by Nous Research (https://github.com/NousResearch/hermes-agent).
defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, text, json, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: wheel-distribution
    desc: hermes-agent Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: hermes_agent

  - id: pkginfo-name
    desc: PyPI package name hermes-agent
    for: [pkginfo, text, json]
    if:
      type: text
      regex: '(?im)^Name:\s*hermes-agent\s*$'

  - id: github-repo
    desc: Hermes Agent GitHub repository URL
    for: [python, text, json, pkginfo]
    if:
      type: text
      regex: '(?i)NousResearch/hermes-agent'

  - id: hermes-cli-path
    desc: Hermes CLI package path
    for: [python, text]
    if:
      type: path
      regex: '(?i)(^|[/\\])hermes_cli([/\\]|$)'

  - id: hermes-home-config-dir
    desc: Hermes Agent home configuration directory path
    for: [python, text]
    if:
      type: text
      regex: '(?i)(~|\$HOME)[/\\]\.hermes\b'

  - id: hermes-agent-import
    desc: Hermes Agent module import
    for: [python]
    if:
      type: text
      regex: '(from|import)\s+(hermes_cli|hermes_constants)\b'

  - id: hermes-portal-domain
    desc: Hermes Portal domain reference
    for: [python, text]
    if:
      type: text
      substr: 'hermes-agent.nousresearch.com'

composite_rules:
  - id: hermes-agent-package
    desc: Nous Research Hermes Agent AI coding and tool assistant package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: pkginfo-name
      - id: github-repo
      - id: hermes-portal-domain
    needs: 2

  - id: hermes-agent-source
    desc: Nous Research Hermes Agent source file
    crit: notable
    conf: 0.98
    any:
      - id: github-repo
      - id: hermes-cli-path
      - id: hermes-home-config-dir
      - id: hermes-agent-import
      - id: hermes-portal-domain
