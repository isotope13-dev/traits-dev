defaults:
  platforms: [unix, windows]
  for: [python]
  conf: 0.98
  crit: component
traits:
  - id: credential-removal-step-type
    desc: RemovalStep credential registry declaration
    if:
      type: text
      encoding: none
      regex: '(?m)^class RemovalStep\s*[:(]'
  - id: credential-removal-result-type
    desc: RemovalResult credential registry declaration
    if:
      type: text
      encoding: none
      regex: '(?m)^class RemovalResult\s*[:(]'
  - id: credential-removal-register-function
    desc: Hermes credential-removal register function
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "_register_all_sources"))
  - id: credential-removal-lookup-function
    desc: Hermes credential-removal lookup function
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "find_removal_step"))
  - id: credential-removal-claude-function
    desc: Hermes credential-removal claude function
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "_remove_claude_code"))
composite_rules:
  - id: credential-removal-module
    desc: Hermes credential-removal implementation
    crit: notable
    all:
      - id: credential-removal-step-type
      - id: credential-removal-result-type
      - id: credential-removal-register-function
      - id: credential-removal-lookup-function
      - id: credential-removal-claude-function
      - id: hermes-agent-import
