# Volter AI Supercode — official AI coding agent platform and Teams daemon
# (https://github.com/volter-ai/supercode).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, python, npm]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: Supercode npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@volter/supercode-(teams|cli(-[a-z0-9_-]+)?)$'

  - id: npm-package-name
    desc: Supercode npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@volter/supercode-(teams|cli(-[a-z0-9_-]+)?)$'

  - id: supercode-env-marker
    desc: Supercode agent environment variable marker
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bSUPERCODE_(TEAMS_PORTS_DIR|TEAMS_PANE|HOME|CODEX_BIN|TEAMS_CGROUP|TEAMS_NO_PORTHOLE)\b'

  - id: supercode-package-import
    desc: Supercode internal package import
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']@volter/supercode-[a-z0-9-]+["'']'

composite_rules:
  - id: supercode-agent-context
    desc: Official Supercode AI coding agent context
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: npm-package-name
      - id: supercode-env-marker
      - id: supercode-package-import
      - id: metadata/package/documentation/docstring::machine-exec-stream-endpoint-doc

  - id: supercode-powershell-helper-context
    desc: Supercode PowerShell helper execution context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    any:
      - id: supercode-env-marker
      - id: supercode-package-import
