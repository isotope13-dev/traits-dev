# dsh-permgate — Permission gateway for DeepSeek Harness (MrWeiCodes/dsh-permgate).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: dsh-permgate-package-name
    desc: dsh-permgate npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@mrweicodes/dsh-permgate"

  - id: dsh-permgate-repository-url
    desc: dsh-permgate GitHub repository reference
    if:
      type: text
      substr: "github.com/MrWeiCodes/dsh-permgate"

  - id: dsh-permgate-description
    desc: dsh-permgate permission gateway description
    if:
      type: text
      regex: '(?i)\bPermission gateway for DSH\b'

composite_rules:
  - id: dsh-permgate-distribution
    desc: dsh-permgate package distribution identity
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: dsh-permgate-package-name
      - id: dsh-permgate-repository-url

  - id: dsh-permgate-context
    desc: dsh-permgate AI agent permission gateway context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: outer
    all:
      - id: dsh-permgate-package-name
      - id: dsh-permgate-description
