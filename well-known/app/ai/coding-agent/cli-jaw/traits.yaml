# CLI-JAW — personal AI assistant and multi-agent orchestrator (github.com/lidge-ai/cli-jaw)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: cli-jaw-package-name
    desc: CLI-JAW npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cli-jaw

  - id: cli-jaw-upstream-repo
    desc: CLI-JAW GitHub repository reference
    if:
      type: text
      substr: github.com/lidge-ai/cli-jaw

  - id: cli-jaw-home-dir-reference
    desc: CLI-JAW home configuration directory reference
    for: [javascript, typescript]
    if:
      type: text
      substr: '".cli-jaw"'

  - id: cli-jaw-opencode-permission-sync
    desc: CLI-JAW OpenCode permission configuration helper
    for: [javascript, typescript]
    if:
      type: text
      substr: withOpencodeAlwaysAllowPermissions

composite_rules:
  - id: cli-jaw-source
    desc: CLI-JAW multi-agent orchestrator source context
    crit: exception
    any:
      - id: cli-jaw-package-name
      - id: cli-jaw-upstream-repo
      - id: cli-jaw-home-dir-reference
      - id: cli-jaw-opencode-permission-sync
