# LocalCode — local-first AI coding assistant (mjwsolo/localcode).
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.99
  size_max: 524288000

traits:
  - id: localcode-wheel-package-name
    desc: LocalCode Python wheel package name
    crit: notable
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: localcode

  - id: localcode-github-homepage
    desc: LocalCode GitHub project homepage
    crit: notable
    if:
      type: value
      path: METADATA::Home-page
      regex: '(?i)github\.com/mjwsolo/localcode'

  - id: injection-defense-module
    desc: LocalCode prompt-injection defense module
    crit: notable
    for: [python]
    if:
      type: text
      substr: def detect_injection_patterns

  - id: debugger-hardening-entrypoint
    desc: LocalCode macOS debugger-attach hardening
    crit: notable
    for: [python]
    if:
      type: text
      substr: def _harden_against_debugger_attach

  - id: untrusted-data-wrapper-call
    desc: LocalCode wrap_untrusted injection defense call
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      exact: wrap_untrusted

composite_rules:
  - id: localcode-ai-coding-assistant
    desc: LocalCode local AI coding assistant
    crit: notable
    needs: 2
    any:
      - id: localcode-wheel-package-name
      - id: localcode-github-homepage
      - id: injection-defense-module
      - id: debugger-hardening-entrypoint
      - id: untrusted-data-wrapper-call
