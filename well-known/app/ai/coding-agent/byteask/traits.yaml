# ByteAsk — AI coding agent CLI and gateway (ByteAsk/byteask-gateway).
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.99

traits:
  - id: byteask-gateway-host
    desc: ByteAsk AI gateway host reference
    for: [powershell, text, markdown, json]
    if:
      type: text
      substr: code.byteask.ai

  - id: byteask-repo-url
    desc: ByteAsk repository URL reference
    for: [powershell, text, markdown, json, package.json]
    if:
      type: text
      substr: github.com/ByteAsk/byteask-gateway

  - id: byteask-cli-launcher
    desc: ByteAsk CLI launcher script identity
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(byteask\.ps1 - ByteAsk AI coding agent CLI|\$BYTEASK_HOME\b)'

composite_rules:
  - id: byteask-windows-installer-context
    desc: ByteAsk official Windows installer and updater bootstrap
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: byteask-cli-launcher
      - id: byteask-gateway-host
