# Ajantik — crash test for AI agents and MCP server (github.com/Ajantik/ajantik)
defaults:
  platforms: [unix, windows]
  for: [python, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: ajantik-package-name
    desc: Ajantik package name reference
    if:
      type: text
      regex: '(?i)\bajantik\b'

  - id: ajantik-github-repo
    desc: Ajantik GitHub repository URL
    if:
      type: text
      substr: github.com/Ajantik/ajantik

  - id: ajantik-cli-module
    desc: Ajantik CLI module reference
    for: [python]
    if:
      type: text
      substr: "ajantik.cli"

composite_rules:
  - id: ajantik-testing-harness-context
    desc: Ajantik AI agent testing harness context
    crit: exception
    any:
      - id: ajantik-package-name
      - id: ajantik-github-repo
      - id: ajantik-cli-module
