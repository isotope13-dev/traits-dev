# xcsh — coding agent CLI with tool execution and session management.
# Source: https://github.com/f5-sales-demo/xcsh
defaults:
  platforms: [linux, macos, windows]
  for: [package.json, javascript, typescript, json, text]
  crit: notable
  conf: 0.98

traits:
  - id: xcsh-package-name
    desc: xcsh coding agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@f5-sales-demo/xcsh"

  - id: xcsh-github-repo
    desc: xcsh coding agent GitHub repository
    if:
      type: text
      substr: github.com/f5-sales-demo/xcsh

  - id: xcsh-bin-path
    desc: xcsh coding agent entrypoint script
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]xcsh(\.ts|\.js)?$'

  - id: xcsh-internal-urls-path
    desc: xcsh coding agent internal URL index path
    if:
      type: path
      regex: '(?i)internal-urls[/\\]'

composite_rules:
  - id: xcsh-distribution
    desc: xcsh coding agent package distribution
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: xcsh-package-name
      - id: xcsh-github-repo

  - id: xcsh-context
    desc: xcsh coding agent package context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip, package.json]
    scope: outer
    any:
      - id: xcsh-package-name
      - id: xcsh-github-repo
      - id: xcsh-bin-path
      - id: xcsh-internal-urls-path
