# TestChimp — coding agent QA platform and MCP server (testchimp.io / github.com/testchimp).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: testchimp-package-scope
    desc: TestChimp npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@testchimp/'

  - id: testchimp-github-repo
    desc: TestChimp GitHub repository URL
    if:
      type: text
      substr: github.com/testchimp/

  - id: testchimp-docs-url
    desc: TestChimp documentation URL
    if:
      type: text
      substr: docs.testchimp.io

  - id: testchimp-api-key-env
    desc: TestChimp API key environment variable reference
    for: [javascript, typescript, shell]
    if:
      type: text
      substr: TESTCHIMP_API_KEY

composite_rules:
  - id: testchimp-agent-source
    desc: TestChimp coding-agent harness source context
    any:
      - id: testchimp-package-scope
      - id: testchimp-github-repo
      - id: testchimp-docs-url
      - id: testchimp-api-key-env
