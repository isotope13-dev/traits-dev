# roleflow — public OpenCode plugin (agents/skills + hooks). postinstall copies
# bundled agents/ and skills/ into ~/.config/opencode for OpenCode compatibility.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: roleflow npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: roleflow

  - id: opencode-plugin-peer-dependency
    desc: roleflow OpenCode plugin peer dependency
    for: [package.json]
    if:
      type: value
      path: peerDependencies.@opencode-ai/plugin
      exists: true

  - id: postinstall-opencode-config-bridge
    desc: roleflow postinstall copies into OpenCode config
    for: [javascript, typescript]
    if:
      type: text
      substr: join(homedir(), ".config", "opencode")

composite_rules:
  - id: archive-context
    desc: roleflow documented OpenCode plugin install context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: opencode-plugin-peer-dependency
      - id: postinstall-opencode-config-bridge
