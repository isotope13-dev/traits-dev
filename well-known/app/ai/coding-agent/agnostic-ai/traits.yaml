# agnostic-ai — CLI tool to sync AI instructions, rules, skills, agents across coding assistants (Chemaclass/agnostic-ai).
defaults:
  platforms: [unix, windows]
  for: [go, shell, powershell, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: repository-url
    desc: agnostic-ai GitHub repository
    if:
      type: text
      substr: github.com/Chemaclass/agnostic-ai

  - id: install-ps1-url
    desc: agnostic-ai Windows install script URL
    for: [powershell, markdown, text]
    if:
      type: text
      substr: Chemaclass/agnostic-ai/main/scripts/install.ps1

  - id: spec-config-file
    desc: agnostic-ai specification configuration file
    for: [text, markdown]
    if:
      type: basename
      regex: '^(agnostic-ai\.ya?ml|AGNOSTIC_AI\.md)$'

composite_rules:
  - id: agnostic-ai-identity
    desc: agnostic-ai specification tool identity
    crit: notable
    conf: 0.99
    all:
      - id: repository-url
    any:
      - id: install-ps1-url
      - id: spec-config-file

  - id: agnostic-ai-context
    desc: agnostic-ai specification tool archive context
    crit: exception
    conf: 0.99
    for: [zip, tar, go, shell, powershell, markdown, text, json]
    scope: archive
    all:
      - id: repository-url
      - id: spec-config-file
