# Remote Codex (dufangshi/remoteCodex) — Web control plane and relay for coding agents.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: remote-codex-package-name
    desc: Remote Codex npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: remote-codex

  - id: remote-codex-github-repo
    desc: Remote Codex GitHub repository URL
    if:
      type: text
      substr: dufangshi/remoteCodex

  - id: remote-codex-brand-name
    desc: Remote Codex product name reference
    for: [javascript, typescript]
    if:
      type: text
      substr: remote-codex

composite_rules:
  - id: remote-codex-agent-source
    desc: Remote Codex coding-agent source context
    any:
      - id: remote-codex-package-name
      - id: remote-codex-github-repo
      - id: remote-codex-brand-name
