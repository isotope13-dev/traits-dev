# bumper-guard — documented AI-assistant safety daemon with optional autostart.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: bumper-guard-package-name
    desc: bumper-guard npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: bumper-guard

  - id: bumper-guard-published-homepage
    desc: bumper-guard project homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      substr: bumper-guard.pages.dev

  - id: bumper-guard-postinstall-installer-marker
    desc: bumper-guard postinstall installer log marker
    for: [javascript]
    if:
      type: text
      substr: "[bumper]"

  - id: bumper-guard-autostart-service-label
    desc: bumper-guard launchd or systemd service label
    for: [javascript]
    if:
      type: text
      substr: com.bumper.autostart

  - id: bumper-guard-windows-autostart-vbs-name
    desc: bumper-guard Windows Startup VBS launcher name
    for: [javascript]
    if:
      type: text
      substr: BumperAutostart.vbs

composite_rules:
  - id: bumper-guard-documented-install-context
    desc: bumper-guard documented npm install and daemon wiring
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: outer
    all:
      - id: bumper-guard-package-name
      - id: bumper-guard-published-homepage

  - id: bumper-guard-autostart-vbs-context
    desc: bumper-guard documented hidden Windows autostart launcher
    crit: exception
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: bumper-guard-autostart-service-label
      - id: bumper-guard-windows-autostart-vbs-name
