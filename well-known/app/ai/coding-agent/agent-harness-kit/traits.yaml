# Agent Harness Kit — CLI scaffolding for multi-agent harness systems
# published on npm under @cardor/agent-harness-kit scope.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: agent-harness-kit-package-name
    desc: Agent Harness Kit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@cardor/agent-harness-kit"

  - id: agent-harness-kit-package-import
    desc: Agent Harness Kit package import
    for: [javascript, typescript]
    if:
      type: text
      substr: "@cardor/agent-harness-kit"

  - id: agent-harness-kit-binary-name
    desc: Agent Harness Kit binary name
    for: [javascript, typescript, shell]
    if:
      type: text
      substr: "agent-harness-kit"

composite_rules:
  - id: agent-harness-kit-agent-source
    desc: Agent Harness Kit coding-agent harness source context
    any:
      - id: agent-harness-kit-package-name
      - id: agent-harness-kit-package-import
      - id: agent-harness-kit-binary-name
