# VibeCheck AI is a VS Code code-analysis extension. Its device-code login,
# telemetry, and local process integration are product behavior; identify the
# published bundle before applying generic phishing heuristics.
defaults:
  platforms: [windows, unix]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: VibeCheck AI VS Code package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vibecheck-AI

  - id: package-publisher
    desc: VibeCheck AI VS Code package publisher
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: Vibecheck-AI

  - id: api-host
    desc: VibeCheck AI API host
    for: [javascript, typescript]
    if:
      type: text
      substr: api.vibecheckai.dev

  - id: telemetry-host
    desc: VibeCheck AI telemetry host
    for: [javascript, typescript]
    if:
      type: text
      substr: telemetry.vibecheckai.dev

composite_rules:
  - id: vscode-package-context
    desc: Recognized VibeCheck AI VS Code package context
    crit: exception
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
      - id: api-host

  - id: vscode-bundle-context
    desc: Recognized VibeCheck AI bundled extension context
    crit: exception
    for: [javascript, typescript]
    all:
      - id: api-host
      - id: telemetry-host
