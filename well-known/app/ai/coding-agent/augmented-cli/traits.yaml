# Augmented Team CLI — agent provisioning and management (@integrity-labs/agt-cli)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: augmented-cli-package-name
    desc: Augmented CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@integrity-labs/agt-cli"

  - id: augmented-cli-repo-url
    desc: Augmented CLI GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/integrity-labs/augmented'

  - id: augmented-cli-brand-text
    desc: Augmented Team CLI brand description
    if:
      type: text
      substr: "Augmented Team CLI"

  - id: augmented-agent-dir-reference
    desc: Augmented agent state directory reference
    for: [javascript, typescript]
    if:
      type: text
      substr: '".augmented"'

composite_rules:
  - id: augmented-cli-source
    desc: Augmented CLI agent harness source context
    crit: exception
    any:
      - id: augmented-cli-package-name
      - id: augmented-cli-repo-url
      - id: augmented-cli-brand-text
      - id: augmented-agent-dir-reference
