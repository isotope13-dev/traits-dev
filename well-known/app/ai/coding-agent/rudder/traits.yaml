# Rudder — terminal dashboard for running coding agents with worktree-isolated runs (viraatdas/rudder).
# Platform packages ship a Rust-compiled Mach-O/ELF/PE named `rudder-native`.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: rudder-package-name
    desc: Rudder npm package name
    for: [package.json]
    conf: 0.99
    size_min: 50
    size_max: 50000
    if:
      type: value
      path: name
      exact: '@viraatdas/rudder'

  - id: rudder-github-repo
    desc: Rudder GitHub repository URL
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '(?i)github\.com/viraatdas/rudder\b'

  - id: rudder-product-site
    desc: Rudder product site URL
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '(?i)https?://rudder\.viraat\.dev\b'

  - id: rudder-orchestrator-marker
    desc: Rudder orchestrator or plan task marker
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      regex: '\bRUDDER_(PLAN_TASKS_START|INTERACTIVE_ORCHESTRATOR|CLOUD_MIGRATE)\b'

  - id: rudder-smoke-marker
    desc: Rudder native smoke test string
    conf: 0.99
    size_min: 64
    size_max: 300000000
    if:
      type: text
      substr: 'rudder-native smoke ok'

  - id: rudder-binary-name
    desc: Rudder native executable basename
    for: [elf, macho, pe]
    conf: 0.99
    size_min: 500000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^rudder-native(\.exe)?$'

composite_rules:
  - id: rudder-binary-identity
    desc: Rudder native binary identity
    conf: 0.99
    for: [elf, macho, pe]
    all:
      - id: rudder-binary-name
    any:
      - id: rudder-smoke-marker
      - id: rudder-orchestrator-marker
      - id: rudder-github-repo
      - id: rudder-product-site

  - id: rudder-package-identity
    desc: Rudder package identity
    conf: 0.99
    for: [npm, tar, zip, package.json, elf, macho, pe, javascript]
    scope: outer
    all:
      - id: rudder-package-name
    any:
      - id: rudder-github-repo
      - id: rudder-product-site
      - id: rudder-orchestrator-marker
