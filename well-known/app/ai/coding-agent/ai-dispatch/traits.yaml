# ai-dispatch (aid) — Multi-AI CLI team orchestrator (agent-tools-org).
# Process spawn, PTY, and curl|sh install are product features.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: crate-name
    desc: ai-dispatch crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: ai-dispatch

  - id: cargo-package-name
    desc: ai-dispatch Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: ai-dispatch

  - id: github-repo
    desc: ai-dispatch GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/agent-tools-org/ai-dispatch

  - id: install-host
    desc: ai-dispatch installer download host
    for: [markdown, text]
    conf: 0.97
    if:
      type: text
      substr: aid.agent-tools.org
