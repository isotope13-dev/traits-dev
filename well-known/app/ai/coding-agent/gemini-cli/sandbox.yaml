defaults:
  crit: notable
  platforms: [linux, windows, macos]
  for: [javascript, typescript, package.json]

traits:
  - id: core-package-import
    desc: Gemini CLI core package import
    conf: 1.0
    if:
      type: text
      substr: "@google/gemini-cli-core"
  - id: sandbox-env-selector
    desc: Gemini sandbox environment selector
    conf: 1.0
    if:
      type: text
      substr: "GEMINI_SANDBOX"
  - id: repo-agent-task-script
    desc: Gemini Kubernetes repo-agent task runner script
    for: [shell]
    size_max: 1048576
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(/opt/repo-agent/|/root/\.gemini/settings\.json|gemini for chore)'

composite_rules:
  - id: sandbox-env-launcher
    for: [javascript]
    desc: Gemini CLI sandbox command selector
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/fs/path/config/environment::dotenv-config-path
    any:
      - id: core-package-import
      - id: sandbox-env-selector
