# @google/gemini-cli — bundled Google Gemini CLI coding agent (npm).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, package.json, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: gemini-cli-npm-package-path
    desc: Bundled Gemini CLI npm package path
    for: [javascript, typescript, npm]
    if:
      type: path
      regex: '(?i)@google[\\/]gemini-cli(-[a-z0-9-]+)?[\\/]'

  - id: gemini-cli-npm-package-name
    desc: Gemini CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@google/gemini-cli(-[a-z0-9-]+)?$'

  - id: gemini-cli-dependency
    desc: Gemini CLI dependency in manifest
    for: [package.json, json]
    if:
      type: text
      substr: '@google/gemini-cli'

  - id: gemini-cli-bundle
    desc: Bundled Gemini CLI javascript
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(@google/gemini-cli|Gemini CLI|gemini-cli)'

composite_rules:
  - id: gemini-cli-app-bundle
    desc: Bundled Gemini CLI runtime npm package
    crit: exception
    conf: 0.99
    any:
      - id: gemini-cli-npm-package-path
      - id: gemini-cli-npm-package-name
      - id: gemini-cli-dependency
      - id: gemini-cli-bundle
