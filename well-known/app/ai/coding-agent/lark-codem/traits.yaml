# Official Lark / ByteDance CodeM coding assistant CLI context.
defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe, javascript, json, package.json, npm]
  crit: baseline
  conf: 0.98
  size_max: 524288000

traits:
  - id: lark-codem-package-name
    desc: Lark CodeM package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@lark-codem/codem-cli'

  - id: codem-daemon-task-marker
    desc: CodeM daemon service task name
    crit: notable
    for: [macho, elf, pe, javascript]
    if:
      type: text
      substr: com.byted-meego.codem.daemon

  - id: codem-cli-service-command
    desc: CodeM service management command
    crit: notable
    for: [macho, elf, pe, javascript]
    if:
      type: text
      substr: codem service start

composite_rules:
  - id: lark-codem-cli
    desc: Lark CodeM coding assistant CLI
    crit: notable
    conf: 0.98
    any:
      - id: lark-codem-package-name
      - id: codem-daemon-task-marker
      - id: codem-cli-service-command
  # Benign-context suppressor: the CLI installs and supervises its own daemon
  # (LaunchAgent on macOS, systemd unit on Linux, scheduled task on Windows)
  # when the user runs `codem service start`. That assembly is expected here,
  # not hostile persistence.
  - id: codem-daemon-service-context
    desc: CodeM daemon service management context
    crit: exception
    conf: 0.98
    for: [macho, elf, pe]
    any:
      - id: codem-daemon-task-marker
      - id: codem-cli-service-command
