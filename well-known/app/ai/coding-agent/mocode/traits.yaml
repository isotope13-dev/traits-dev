# mocode-ai — Open-source terminal AI coding agent (wanxunyang/mocode).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: mocode-ai-package-name
    desc: mocode-ai npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "mocode-ai"

  - id: mocode-repository
    desc: mocode GitHub repository reference
    if:
      type: text
      substr: "github.com/wanxunyang/mocode"

  - id: mocode-cli-name
    desc: mocode CLI executable name
    for: [package.json]
    if:
      type: value
      path: bin.mocode
      exact: "bin/mocode.js"

composite_rules:
  - id: mocode-ai-distribution
    desc: mocode-ai CLI distribution identity
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: mocode-ai-package-name
      - id: mocode-repository
      - id: mocode-cli-name

  - id: mocode-ai-context
    desc: mocode-ai terminal coding agent context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: mocode-ai-package-name
      - id: mocode-repository
