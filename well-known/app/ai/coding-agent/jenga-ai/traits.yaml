# @jenga-ai/agent — agentic dev workflow for Claude Code, Copilot, and Codex.
# Postinstall mirrors shipped skills/agents into consumer .claude/ and .agents/
# trees as documented product setup (see scripts/postinstall.js).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Jenga AI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@jenga-ai/agent"

  - id: upstream-repository
    desc: Jenga AI upstream repository reference
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: github.com/samwelmunga/jenga-npm

  - id: consumer-mirror-postinstall-marker
    desc: Jenga consumer mirror postinstall marker
    for: [javascript, typescript]
    if:
      type: text
      substr: reconcileFromManifest

  - id: jenga-version-marker
    desc: Jenga installed-version marker file
    for: [javascript, typescript, shell]
    if:
      type: text
      substr: .jenga-version

composite_rules:
  - id: archive-context
    desc: Jenga AI documented consumer install context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: consumer-mirror-postinstall-marker
      - id: jenga-version-marker
