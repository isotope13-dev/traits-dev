# mcp-security-guard — MCP security scanner plugin for Claude Code (github.com/petrovicistefan/mcp-security-guard).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-name
    desc: mcp-security-guard npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mcp-security-guard

  - id: mcp-registry-name
    desc: mcp-security-guard MCP registry identifier
    for: [package.json]
    if:
      type: value
      path: mcpName
      exact: io.github.petrovicistefan/mcp-security-guard

  - id: upstream-repository
    desc: mcp-security-guard upstream GitHub repo
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: github.com/petrovicistefan/mcp-security-guard

  - id: mcp-scanner-client
    desc: mcp-security-guard scanner client identifier
    for: [javascript, typescript]
    if:
      type: text
      regex: 'name:\s*"mcp-security-guard(-scanner)?"'

  - id: mcp-scanner-instructions
    desc: mcp-security-guard server instructions
    for: [javascript, typescript]
    if:
      type: text
      substr: "Security scanner for the MCP servers configured in Claude Code"

composite_rules:
  - id: mcp-security-guard-package
    desc: MCP security guard scanner for Claude Code
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: mcp-registry-name
      - id: upstream-repository
      - id: mcp-scanner-client
      - id: mcp-scanner-instructions
