# zcode-pro — documented open-source UI enhancement mod for the ZCode
# desktop client (GitHub duanluan/zcode-pro, AUR zcode-pro). Installed
# knowingly via install scripts that also provide uninstall; its Start Menu
# shortcut points at its own silent VBS launcher by design, not hijack.
defaults:
  platforms: [unix, windows]
  for: [powershell, vbs, package.json, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: zcode-pro-shortcut-name
    desc: zcode-pro Start Menu shortcut name
    for: [powershell]
    if:
      type: text
      substr: 'ZCode Pro.lnk'
  - id: zcode-pro-uninstall-switch
    desc: zcode-pro installer uninstall switch
    for: [powershell]
    if:
      type: text
      substr: '[switch]$Uninstall'

composite_rules:
  - id: zcode-pro-installer-shortcut-context
    desc: zcode-pro documented installer shortcut wiring
    crit: exception
    conf: 0.99
    for: [powershell]
    scope: file
    all:
      - id: zcode-pro-shortcut-name
      - id: zcode-pro-uninstall-switch
