# HXF coding agent — terminal coding agent by Netro (Mario Zechner).
# Repository: github.com/netrodev/hxf
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip, markdown, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: HXF coding agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@netrodev/hxf-coding-agent"

  - id: upstream-repository
    desc: HXF coding agent upstream repository
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/(netrodev/hxf|NetroIndonesia)([./\s"''`?#]|$)'

  - id: package-scope-path
    desc: HXF coding agent package path
    for: [scripts, source, markdown, text, json, package.json, javascript, typescript, tar, zip]
    if:
      type: path
      regex: '(@?netrodev[-/])hxf-coding-agent[-/.]'

  - id: official-package-identity
    desc: HXF coding agent package identity string
    for: [javascript, typescript, text]
    if:
      type: text
      substr: '"@netrodev/hxf-coding-agent"'

  - id: hxf-installer-endpoint
    desc: HXF official installer URL
    crit: notable
    conf: 0.95
    for: [javascript, typescript, powershell, shell, markdown, text]
    if:
      type: text
      regex: 'https?://howtofix\.id/install\.(ps1|sh)\b'

composite_rules:
  - id: archive-context
    desc: HXF coding agent package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: package-scope-path

  - id: hxf-standalone-updater-context
    for: [javascript, typescript]
    desc: HXF coding agent official installer updater
    crit: exception
    conf: 0.99
    all:
      - id: hxf-installer-endpoint
    any:
      - id: upstream-repository
      - id: official-package-identity
