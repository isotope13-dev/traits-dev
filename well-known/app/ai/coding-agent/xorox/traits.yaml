# XOROX — AI coding agent context and specification integration for Cursor and Claude Code (xorox.eu).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, pe, elf, macho, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: XOROX Agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@xorox(-ai)?/agent$'

  - id: repository-url
    desc: XOROX Agent upstream repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/rolandruul/xorox(\.git)?'

  - id: upstream-repository-text
    desc: XOROX Agent upstream repository reference
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: github.com/rolandruul/xorox

  - id: product-site
    desc: XOROX product site URL
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: xorox.eu

  - id: runtime-binary-name
    desc: XOROX runtime binary executable name
    for: [pe]
    platforms: [windows]
    size_min: 500000
    size_max: 50000000
    if:
      type: basename
      regex: '^xorox-runtime-win32-(x64|arm64)\.exe$'

  - id: runtime-binary-marker
    desc: XOROX runtime binary instruction marker
    for: [pe]
    platforms: [windows]
    size_min: 500000
    size_max: 50000000
    if:
      type: text
      section: .rdata
      substr: XOROX_PROJECT_ROOT

  - id: xorox-postinstall-hook-marker
    desc: XOROX postinstall hook setup marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '[xorox] beforeSubmitPrompt hook'

composite_rules:
  - id: xorox-runtime-binary
    desc: XOROX coding agent runtime binary
    crit: exception
    conf: 0.99
    for: [pe]
    platforms: [windows]
    all:
      - id: runtime-binary-name
      - id: runtime-binary-marker

  - id: archive-context
    desc: XOROX coding agent package archive context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: repository-url
      - id: upstream-repository-text
      - id: product-site
      - id: xorox-postinstall-hook-marker
