# oh-my-pi (omp) — terminal coding agent from Stencil Labs
# (github.com/can1357/oh-my-pi, omp.sh), published on npm under the
# @oh-my-pi/* scope. The harness's own source implements the approval
# gates other traits watch for — subagents run headless under the parent
# task's approval, and the security coordinator drives a read-only scan
# session — so identifying this source keeps those observations notable
# instead of suspicious. Code that targets somebody else's agent config
# does not import these packages.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: oh-my-pi-workspace-import
    desc: oh-my-pi workspace package import
    for: [javascript, typescript]
    if:
      type: text
      substr: "@oh-my-pi/"

  - id: oh-my-pi-github-repo
    desc: oh-my-pi GitHub repository URL
    if:
      type: text
      substr: can1357/oh-my-pi

  - id: oh-my-pi-product-site
    desc: oh-my-pi product site URL
    if:
      type: text
      substr: https://omp.sh

  - id: oh-my-pi-package-name
    desc: oh-my-pi npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: ^@oh-my-pi/

composite_rules:
  - id: oh-my-pi-agent-source
    desc: oh-my-pi coding-agent source context
    any:
      - id: oh-my-pi-workspace-import
      - id: oh-my-pi-github-repo
      - id: oh-my-pi-product-site
      - id: oh-my-pi-package-name
