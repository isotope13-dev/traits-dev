# instar — coherence infrastructure for self-evolving AI agents on Claude Code or Codex.
# Repository: github.com/JKHeadley/instar, Homepage: instar.sh.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip, markdown, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: instar npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: instar

  - id: upstream-repository
    desc: instar upstream repository
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/JKHeadley/instar([./\s"''`?#]|$)'

  - id: homepage-url
    desc: instar homepage URL
    for: [package.json, markdown, javascript, typescript]
    if:
      type: text
      substr: instar.sh

composite_rules:
  - id: archive-context
    desc: instar AI agent infrastructure package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: homepage-url
