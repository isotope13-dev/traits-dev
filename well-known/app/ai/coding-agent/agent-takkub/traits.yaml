# agent-takkub — desktop cockpit for orchestrating Claude Code agent teams.
# npm postinstall provisions an isolated ~/.agent-takkub venv; the wheel ships
# pane guards and detached Windows updater scripts for in-app self-update.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, package.json, npm, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: agent-takkub npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agent-takkub

  - id: upstream-repository
    desc: agent-takkub upstream repository reference
    for: [javascript, typescript, python, markdown, text, package.json]
    if:
      type: text
      substr: github.com/takkub/agent-takkub

  - id: isolated-home-marker
    desc: agent-takkub isolated home directory marker
    for: [javascript, typescript, python]
    if:
      type: text
      substr: AGENT_TAKKUB_HOME

  - id: pane-guard-module
    desc: agent-takkub pane command guard module
    for: [python]
    if:
      type: text
      substr: pane_guard

  - id: detached-updater-script-marker
    desc: agent-takkub detached updater script builder
    for: [python]
    if:
      type: text
      substr: build_updater_script

  - id: takkub-auto-update-marker
    desc: agent-takkub startup auto-update marker
    for: [python]
    if:
      type: text
      substr: "[takkub] auto-update"

composite_rules:
  - id: archive-context
    desc: agent-takkub documented cockpit install context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: isolated-home-marker
      - id: pane-guard-module
      - id: detached-updater-script-marker
      - id: takkub-auto-update-marker
