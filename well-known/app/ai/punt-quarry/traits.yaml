# punt-quarry — Punt Labs local semantic search CLI with Claude Code MCP hooks.
defaults:
  platforms: [unix]
  for: [python, whl, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: punt-quarry PyPI package name
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: punt-quarry

  - id: github-homepage
    desc: punt-labs quarry GitHub repository
    for: [python, whl, markdown]
    if:
      type: text
      substr: github.com/punt-labs/quarry

  - id: punt-labs-data-directory
    desc: punt-labs quarry user data directory
    for: [python]
    if:
      type: text
      substr: .punt-labs/quarry

  - id: quarry-install-command
    desc: quarry install daemon command reference
    for: [python, markdown]
    if:
      type: text
      substr: quarry install

composite_rules:
  - id: punt-quarry-package-context
    desc: Recognized punt-quarry local search package
    crit: notable
    conf: 0.99
    scope: archive
    for: [whl]
    all:
      - id: pypi-package-name
      - id: github-homepage
    any:
      - id: punt-labs-data-directory

  - id: punt-quarry-source-context
    desc: Recognized punt-quarry CLI source tree
    crit: notable
    conf: 0.99
    for: [python]
    all:
      - id: github-homepage
      - id: punt-labs-data-directory
