# AIcrowd WhestBench — ARC white-box estimation challenge toolkit.
# Hardware fingerprinting, sys.gettrace UI fallback, and the uv
# install.sh curl|sh hint are product behavior, not a loader.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: whestbench PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: whestbench

  - id: wheel-distribution
    desc: whestbench wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: whestbench

  - id: github-repo
    desc: AIcrowd whestbench GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/AIcrowd/whestbench

  - id: python-import
    desc: whestbench Python package import
    for: [python]
    conf: 0.96
    if:
      type: text
      regex: '\b(import whestbench|from whestbench)\b'
