# Lattice AI (ltcai) — local MLX/cloud LLM workspace server.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 524288000

traits:
  - id: ltcai-wheel-package-name
    desc: Lattice AI wheel package name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ltcai

  - id: lattice-ai-github-homepage
    desc: Lattice AI GitHub project homepage
    if:
      type: text
      substr: github.com/TaeSooPark-PTS/LatticeAI

  - id: lattice-agent-root-env
    desc: Lattice AI agent root env var
    for: [python]
    if:
      type: text
      substr: LATTICEAI_AGENT_ROOT

  - id: lattice-ai-agent-mode
    desc: Lattice AI agent mode docstring
    for: [python]
    if:
      type: text
      substr: Lattice AI agent mode

  - id: lattice-ai-console-entry
    desc: Lattice AI console-script entry point
    for: [text]
    size_min: 16
    if:
      type: text
      substr: 'LTCAI = ltcai_cli:main'

  - id: lattice-ai-mlx-bridge
    desc: Lattice AI MLX bridge server header
    for: [python]
    if:
      type: text
      substr: 'Lattice AI MLX — Local LLM Bridge Server'

composite_rules:
  - id: lattice-ai-workspace-server
    desc: Lattice AI local workspace server
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: ltcai-wheel-package-name
      - id: lattice-ai-github-homepage
      - id: lattice-agent-root-env
      - id: lattice-ai-agent-mode
      - id: lattice-ai-console-entry
      - id: lattice-ai-mlx-bridge
