# Lattice AI (ltcai) — local MLX/cloud LLM workspace server.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.98
  size_max: 524288000

traits:
  - id: ltcai-wheel-package-name
    desc: Lattice AI wheel package name
    crit: notable
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: ltcai

  - id: lattice-ai-github-homepage
    desc: Lattice AI GitHub project homepage
    crit: notable
    for: [whl, python, pkg_info, text]
    if:
      type: text
      substr: github.com/TaeSooPark-PTS/LatticeAI

  - id: lattice-agent-root-env
    desc: Lattice AI agent root env var
    crit: notable
    for: [python]
    if:
      type: text
      substr: LATTICEAI_AGENT_ROOT

  - id: lattice-ai-agent-mode
    desc: Lattice AI agent mode docstring
    crit: notable
    for: [python]
    if:
      type: text
      substr: Lattice AI agent mode

composite_rules:
  - id: lattice-ai-workspace-server
    desc: Lattice AI local workspace server
    crit: notable
    needs: 2
    any:
      - id: ltcai-wheel-package-name
      - id: lattice-ai-github-homepage
      - id: lattice-agent-root-env
      - id: lattice-ai-agent-mode
