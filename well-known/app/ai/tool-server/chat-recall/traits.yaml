# chat-recall (npm `chat-recall`, munhq/chat-recall) — MCP server and CLI
# for recording and querying cross-agent coding history. Includes optional
# background sync daemon service via launchd/systemd and Claude Code
# configuration integration.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: chat-recall npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'chat-recall'

  - id: upstream-repository
    desc: chat-recall upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/munhq/chat-recall(\.git)?$'

  - id: dist-archive-path
    desc: chat-recall release archive path
    if:
      type: path
      regex: '(^|[\\/])chat-recall-[0-9][^\\/]*\.tgz'

  - id: self-reference-name
    desc: chat-recall self reference in package code
    for: [javascript, markdown]
    if:
      type: text
      substr: 'chat-recall'

composite_rules:
  - id: official-package
    desc: Official chat-recall package identity
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: dist-archive-path
      - id: self-reference-name
