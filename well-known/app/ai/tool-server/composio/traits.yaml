# Composio — AI agent tools/integrations platform. Its CLI login flow runs the
# vendor's own documented installer from composio.dev/install. Referenced from
# dropper composites' unless: to suppress the FP where a detached spawn is the
# Composio CLI login piping the vendor's apex installer, not a hostile loader.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: composio-install-url
    desc: Composio apex installer URL
    if:
      type: text
      regex: 'composio\.dev/install'
