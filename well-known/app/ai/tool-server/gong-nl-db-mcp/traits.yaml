# gong-nl-db-mcp — read-only Cloud SQL Postgres MCP server.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package gong-nl-db-mcp
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*gong-nl-db-mcp\s*$'

  - id: gong-nl-db-mcp-github-repo
    desc: andyhorvitz/gong-nl-db-mcp repository URL
    if:
      type: text
      substr: andyhorvitz/gong-nl-db-mcp

  - id: fastmcp-gong-nl-db-server
    desc: FastMCP server name gong-nl-db
    for: [python]
    if:
      type: text
      substr: FastMCP("gong-nl-db")

composite_rules:
  - id: gong-nl-db-mcp-package
    desc: Gong NL DB read-only Cloud SQL MCP server
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: gong-nl-db-mcp-github-repo
      - id: fastmcp-gong-nl-db-server
