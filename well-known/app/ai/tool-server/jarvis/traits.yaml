# Jarvis (@appchy/jarvis) — local AI coding assistant CLI and MCP server.
# Registers itself with Claude Code session hooks and installs a localhost
# daemon via launchd. Legitimate tool CLI package.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Jarvis npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@appchy/jarvis'

  - id: dist-archive-path
    desc: Jarvis release archive path
    if:
      type: path
      regex: '(^|[\\/])@?appchy-jarvis-[0-9][^\\/]*\.tgz'

  - id: launchd-service-label
    desc: Jarvis LaunchAgent service label
    for: [javascript]
    if:
      type: text
      substr: 'com.appchy.jarvis'

  - id: self-reference-name
    desc: Jarvis self reference in package code
    for: [javascript]
    if:
      type: text
      substr: '@appchy/jarvis'

composite_rules:
  - id: official-package
    desc: Official @appchy/jarvis package identity
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: dist-archive-path
      - id: launchd-service-label
      - id: self-reference-name
