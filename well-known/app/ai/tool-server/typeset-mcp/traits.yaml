# typeset-mcp (npm `typeset-mcp`, 32lngs-js/typeset) — MCP server bridging a
# browser typography overlay to coding agents. Setup is an explicit
# user-invoked `install` command (no install hooks) that registers the server
# with Claude Code, installs a localhost bridge daemon via launchd, and
# writes the product's agent instructions; that is the product, documented
# in its README with an uninstall command, not a supply-chain implant.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: typeset-mcp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'typeset-mcp'

  - id: upstream-repository
    desc: typeset-mcp upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/32lngs-js/typeset(\.git)?$'

  - id: dist-archive-path
    desc: typeset-mcp release archive path
    if:
      type: path
      regex: '(^|[\\/])typeset-mcp-[0-9][^\\/]*\.tgz'

  # Member-local identity so the exception also evaluates inside the
  # package's own code members (the name+repository pair lives on
  # package.json alone, which never shares a member with the code).
  - id: self-reference-name
    desc: typeset-mcp self reference in package code
    for: [javascript, markdown]
    if:
      type: text
      substr: 'typeset-mcp'

composite_rules:
  - id: official-package
    desc: Official typeset-mcp package identity
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    # Bare any like the gallery-dl and tokenade package contexts: the
    # exception is evaluated per member, where only member-local legs
    # (archive path, self reference) can fire -- the name+repository pair
    # lives on package.json and never shares a member with the code.
    any:
      - id: package-name
      - id: upstream-repository
      - id: dist-archive-path
      - id: self-reference-name
