defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.98
traits:
- id: package-name
  desc: lp-builder-mcp npm package name
  if:
    type: value
    path: name
    exact: lp-builder-mcp
- id: binary-name
  desc: lp-builder-mcp binary entrypoint
  if:
    type: value
    path: bin.lp-builder-mcp
    exact: dist-obf/mcp.cjs
- id: description
  desc: lp-builder-mcp package description
  if:
    type: value
    path: description
    substr: LP構築の MCP サーバー
