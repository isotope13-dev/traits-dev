# @carlkibler/toolsmith — MCP server that gives AI coding agents surgical
# file reads/edits so they spend fewer tokens. Setup writes the user's
# Claude/Codex/Gemini MCP config and optional priming blocks; that is the
# product, not a supply-chain implant.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, npm, tar, gz]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: npm-package-name
    desc: toolsmith npm scoped package name
    for: [package.json, npm, tar, gz]
    if:
      type: value
      path: name
      exact: "@carlkibler/toolsmith"

  - id: github-repository
    desc: toolsmith GitHub repository path
    if:
      type: text
      regex: 'carlkibler[/\\]+toolsmith'

  - id: mcp-tool-prefix
    desc: toolsmith MCP tool name prefix
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: mcp__toolsmith__

  - id: priming-sentinel
    desc: toolsmith agent-priming HTML sentinel
    for: [javascript, typescript]
    if:
      type: text
      substr: "<!-- toolsmith:begin -->"

  - id: mcp-server-script
    desc: toolsmith MCP server script name
    for: [javascript, typescript]
    if:
      type: text
      substr: toolsmith-mcp.js

  - id: agent-log-scan-cli
    desc: toolsmith agent log scan command
    for: [javascript, typescript]
    if:
      type: text
      substr: scan-agent-logs

  - id: codex-footer-hook-name
    desc: toolsmith Codex footer hook script
    for: [javascript, typescript]
    if:
      type: text
      substr: toolsmith-token-footer.sh

  - id: usage-jsonl-path
    desc: toolsmith usage jsonl log path
    for: [javascript, typescript]
    if:
      type: text
      substr: state/toolsmith/usage.jsonl

composite_rules:
  - id: toolsmith-mcp-identity
    desc: Recognized carlkibler toolsmith MCP package
    needs: 2
    any:
      - id: npm-package-name
      - id: github-repository
      - id: mcp-tool-prefix
      - id: priming-sentinel
      - id: mcp-server-script
      - id: agent-log-scan-cli
      - id: codex-footer-hook-name
      - id: usage-jsonl-path
