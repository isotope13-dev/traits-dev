defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.98
traits:
- id: zen-app-plugin-package-name
  desc: zen-app-plugin npm package name
  if:
    type: value
    path: name
    exact: zen-app-plugin
- id: zen-aiwith-bridge-bin
  desc: zen-aiwith-bridge binary entrypoint
  if:
    type: value
    path: bin.zen-aiwith-bridge
    exact: zen
- id: zen-app-plugin-description
  desc: zen-app-plugin package description
  if:
    type: value
    path: description
    substr: app代码生成器
