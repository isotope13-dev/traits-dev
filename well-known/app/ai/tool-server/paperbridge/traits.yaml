# PaperBridge (npm `xjtlu-paperbridge`, shanyuzhang/xjtlu-paperbridge) — MCP server
# bridging Xi'an Jiaotong-Liverpool University past exam papers and PDF downloads
# to coding agents. Its Windows installer install.ps1 is an ASCII-safe wrapper around
# scripts/bootstrap/install.ps1 that decodes UTF-8 bootstrap source to prevent
# Chinese character encoding corruption on legacy Windows PowerShell 5.1 hosts.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, powershell, shell, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: xjtlu-paperbridge npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'xjtlu-paperbridge'

  - id: upstream-repository
    desc: xjtlu-paperbridge upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/shanyuzhang/xjtlu-paperbridge(\.git)?$'

  - id: upstream-repo-url
    desc: PaperBridge upstream GitHub URL reference
    for: [powershell, shell, markdown, javascript]
    if:
      type: text
      substr: 'github.com/shanyuzhang/xjtlu-paperbridge'

  - id: bootstrap-installer-heading
    desc: PaperBridge installer bootstrap header
    for: [powershell, shell]
    if:
      type: text
      substr: 'PaperBridge Windows installer'

composite_rules:
  - id: powershell-bootstrap-context
    desc: PaperBridge PowerShell installer bootstrap wrapper
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: upstream-repo-url
      - id: bootstrap-installer-heading
