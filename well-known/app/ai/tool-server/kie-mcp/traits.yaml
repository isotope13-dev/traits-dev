# kie-mcp (npm `kie-mcp`, elibarnett/kie-mcp) — MCP server for kie.ai AI models.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: kie-mcp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'kie-mcp'

  - id: mcp-name
    desc: kie-mcp official MCP reverse-DNS identifier
    for: [package.json]
    if:
      type: value
      path: mcpName
      exact: 'io.github.elibarnett/kie-mcp'

  - id: upstream-repository
    desc: kie-mcp upstream GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/elibarnett/kie-mcp(\.git)?$'

  - id: dist-archive-path
    desc: kie-mcp release archive path
    if:
      type: path
      regex: '(^|[\\/])kie-mcp-[0-9][^\\/]*\.tgz'

  - id: self-reference-name
    desc: kie-mcp self reference in package code
    for: [javascript, markdown]
    if:
      type: text
      substr: '[kie-mcp]'

composite_rules:
  - id: official-package
    desc: Official kie-mcp package identity
    crit: exception
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: mcp-name
      - id: upstream-repository
      - id: dist-archive-path
      - id: self-reference-name
