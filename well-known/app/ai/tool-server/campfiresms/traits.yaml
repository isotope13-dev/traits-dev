defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: CampfireSMS setup npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@campfiresms/setup'
- id: homepage-url
  desc: CampfireSMS install homepage URL
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: ^https://campfiresms\.com/
- id: dist-archive-path
  desc: CampfireSMS setup release archive path
  if:
    type: path
    regex: (^|[\\/])@?campfiresms-setup-[0-9][^\\/]*\.tgz
- id: self-reference-name
  desc: CampfireSMS self reference in package code
  for:
  - javascript
  if:
    type: text
    substr: CampfireSMS
