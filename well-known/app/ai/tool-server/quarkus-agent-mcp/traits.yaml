# quarkus-agent-mcp — Quarkus Dev MCP agent server (stdio MCP for dev workflows).
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, java]
  crit: notable
  conf: 0.95
  size_min: 1000000
  size_max: 500000000

traits:
  - id: manifest-implementation-title
    desc: quarkus-agent-mcp JAR implementation title
    if:
      type: text
      substr: 'Implementation-Title: quarkus-agent-mcp'

  - id: quarkus-agent-mcp-package-path
    desc: Quarkus agent MCP Java package path
    if:
      type: text
      substr: quarkus/agent/mcp

  - id: quarkiverse-mcp-server-path
    desc: Quarkiverse MCP server Java package path
    if:
      type: text
      substr: quarkiverse/mcp/server

composite_rules:
  - id: quarkus-agent-mcp-package
    desc: Quarkus Dev MCP agent server package
    crit: notable
    conf: 0.96
    any:
      - id: manifest-implementation-title
      - id: quarkus-agent-mcp-package-path
      - id: quarkiverse-mcp-server-path
    needs: 2
