# Specific AI (specific-ai, specific-ai-cli) — Multi-platform scraping and
# automation CLI and MCP server for AI Agents.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Specific AI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^specific-ai(-cli|-assets-[a-z]+)?$'

  - id: upstream-repository
    desc: Specific AI upstream repository reference
    for: [package.json, javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)github\.com/dearli666/specific-ai(\.git)?([/\\s"''`?#]|$)'

  - id: self-reference-name
    desc: Specific AI self reference in package code
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']specific-ai(-cli)?["'']'

  - id: archive-member-context
    desc: Specific AI npm archive member path
    if:
      type: path
      regex: '(^|[\\/])specific-ai(-cli)?-[0-9][0-9A-Za-z.-]*([\\/]|$)'

composite_rules:
  - id: official-package
    desc: Official Specific AI package identity
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: self-reference-name
      - id: archive-member-context

  - id: benign-application-context
    desc: Specific AI application context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: self-reference-name
      - id: upstream-repository
      - id: archive-member-context
