# Local MCP (LMCP) — macOS and Windows MCP server bridging desktop apps
# (Calendar, Reminders, Contacts, Messages, Mail) to AI coding assistants
# (local-mcp.com, github.com/colibird-ai/local-mcp-releases).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Local MCP npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: local-mcp

  - id: npm-package-name
    desc: Local MCP npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: local-mcp

  - id: platform-package-name
    desc: Local MCP platform npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^local-mcp-(darwin|win32|linux)-'

  - id: platform-npm-package-name
    desc: Local MCP platform npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^local-mcp-(darwin|win32|linux)-'

  - id: repository-url
    desc: Local MCP official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/colibird-ai/local-mcp-releases(\.git)?$'

  - id: npm-repository-url
    desc: Local MCP npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/colibird-ai/local-mcp-releases(\.git)?$'

  - id: server-binary-name
    desc: Local MCP server binary basename
    platforms: [macos]
    for: [macho]
    size_min: 1000000
    size_max: 50000000
    if:
      type: basename
      exact: local-mcp-server

  - id: helper-binary-name
    desc: Local MCP helper binary basename
    platforms: [macos]
    for: [macho]
    size_min: 100000
    size_max: 10000000
    if:
      type: basename
      exact: local-mcp-helper

composite_rules:
  - id: official-package-identity
    desc: Official Local MCP npm package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name
      - id: platform-package-name
      - id: platform-npm-package-name

  - id: official-repository-identity
    desc: Official Local MCP repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official Local MCP package and repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity

  - id: binary-context
    desc: Recognized Local MCP binary context
    crit: exception
    conf: 0.99
    platforms: [macos]
    for: [macho]
    any:
      - id: metadata/signed/id::com.local-mcp.server
      - id: metadata/signed/id::com.local-mcp.helper
      - id: server-binary-name
      - id: helper-binary-name
