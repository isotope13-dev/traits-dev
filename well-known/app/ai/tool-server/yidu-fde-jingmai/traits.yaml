defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.98
traits:
- id: package-name
  desc: yidu-fde jingmai npm package name
  if:
    type: value
    path: name
    exact: '@yidu-fde/jingmai'
- id: binary-name
  desc: jingmai binary entrypoint
  if:
    type: value
    path: bin.jingmai
    exact: index.mjs
