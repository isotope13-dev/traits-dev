# @yidu-fde/jingmai — MCP server that drives the JD.com merchant (京麦) and
# procurement back office through Playwright, with the seller's own account
# supplied through JINGMAI_USERNAME / JINGMAI_PASSWORD. The published bundle is
# javascript-obfuscator output; its network targets are JD.com hosts only.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: yidu-fde jingmai npm package name
    if:
      type: value
      path: name
      exact: '@yidu-fde/jingmai'

  - id: binary-name
    desc: jingmai binary entrypoint
    if:
      type: value
      path: bin.jingmai
      exact: 'index.mjs'

composite_rules:
  - id: yidu-fde-jingmai-package-context
    desc: Official @yidu-fde/jingmai package context
    crit: exception
    conf: 0.99
    all:
      - id: package-name
      - id: binary-name
