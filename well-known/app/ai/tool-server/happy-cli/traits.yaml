# Happy CLI (happy-cli, @slopus/happy, @buzzni/happy-cli) — Mobile and Web
# client daemon and MCP server for Claude Code and Codex.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Happy CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@(slopus|buzzni)/happy(-cli)?$'

  - id: upstream-repository
    desc: Happy CLI upstream repository reference
    for: [package.json, javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)github\.com/(slopus|buzzni)/happy(-cli)?(\.git)?([/\\s"''`?#]|$)'

  - id: daemon-launchd-label
    desc: Happy CLI daemon LaunchDaemon label
    for: [javascript, typescript]
    if:
      type: text
      substr: 'com.happy-cli.daemon'

  - id: self-reference-name
    desc: Happy CLI self reference in package code
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']@(slopus|buzzni)/happy(-cli)?["'']'

  - id: archive-member-context
    desc: Happy CLI npm archive member path
    if:
      type: path
      regex: '(^|[\\/])(@?buzzni-)?happy(-cli)?-[0-9][0-9A-Za-z.-]*([\\/]|$)'

composite_rules:
  - id: official-package
    desc: Official Happy CLI package identity
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: daemon-launchd-label
      - id: self-reference-name
      - id: archive-member-context

  - id: benign-application-context
    desc: Happy CLI application context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    any:
      - id: daemon-launchd-label
      - id: self-reference-name
      - id: upstream-repository
      - id: archive-member-context
