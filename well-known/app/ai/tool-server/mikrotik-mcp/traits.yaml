# RouterOS management MCP servers expose every operation the appliance
# backdoor shapes key on -- script/scheduler creation, fetch, firewall and
# log edits -- as user-invoked tools. A file that self-describes as an MCP
# server and carries the RouterOS wordmark is the toolkit, not an implant.
defaults:
  platforms: [unix, windows]
  for: [javascript, text, package.json]

traits:
  - id: mcp-server-self-reference
    desc: File describes an MCP server
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)mcp server|model context protocol'

composite_rules:
  - id: routeros-mcp-management-context
    desc: RouterOS MCP management toolkit file
    crit: exception
    conf: 0.95
    all:
      - id: metadata/lang/natural/vocabulary/content-word::routeros-mikrotik-name
      - id: mcp-server-self-reference
