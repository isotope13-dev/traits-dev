defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: Beehaven npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@clearlysh/beehaven'
- id: upstream-repository
  desc: Beehaven upstream repository
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: github\.com/clearly-sh/clearly(\.git)?$
- id: dist-archive-path
  desc: Beehaven release archive path
  if:
    type: path
    regex: (^|[\\/])@?clearlysh-beehaven-[0-9][^\\/]*\.tgz
- id: self-reference-label
  desc: Beehaven service label in package code
  for:
  - javascript
  - markdown
  if:
    type: text
    substr: sh.clearly.beehaven
