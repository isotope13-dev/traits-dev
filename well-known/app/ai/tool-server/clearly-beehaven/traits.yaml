# Beehaven (npm `@clearlysh/beehaven`, clearly-sh/clearly) — Claude Code and agent
# workspace CLI daemon. Setup registers a user launchd LaunchAgent service and
# manages Claude Code hooks and settings on uninstall.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Beehaven npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@clearlysh/beehaven'

  - id: upstream-repository
    desc: Beehaven upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/clearly-sh/clearly(\.git)?$'

  - id: dist-archive-path
    desc: Beehaven release archive path
    if:
      type: path
      regex: '(^|[\\/])@?clearlysh-beehaven-[0-9][^\\/]*\.tgz'

  - id: self-reference-label
    desc: Beehaven service label in package code
    for: [javascript, markdown]
    if:
      type: text
      substr: 'sh.clearly.beehaven'

composite_rules:
  - id: official-package
    desc: Official Beehaven package identity
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: dist-archive-path
      - id: self-reference-label
