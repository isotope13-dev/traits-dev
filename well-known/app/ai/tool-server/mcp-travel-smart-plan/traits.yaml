# mcp-travel-smart-plan — FastMCP server that plans trips via a Fliggy
# (飞猪) Function Compute proxy. urllib POST to that proxy is the
# product data source, not C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: mcp-travel-smart-plan PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: mcp-travel-smart-plan

  - id: wheel-distribution
    desc: mcp_travel_smart_plan wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: mcp_travel_smart_plan

  - id: fastmcp-name
    desc: TravelSmartPlan FastMCP server name
    for: [python]
    conf: 0.98
    if:
      type: text
      substr: 'FastMCP("TravelSmartPlan")'

  - id: fliggy-tool
    desc: Fliggy AI search tool identifier
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: fliggy_ai_search
