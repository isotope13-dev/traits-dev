# rails-ai-context — Rails MCP server exposing guarded project context to AI agents.
defaults:
  platforms: [unix, windows]
  for: [ruby, markdown, gem, json]
  crit: notable
  conf: 0.98

traits:
  - id: rails-ai-context-module
    desc: rails-ai-context gem module marker
    if:
      type: text
      substr: module RailsAiContext

  - id: rails-ai-context-gem-name
    desc: rails-ai-context gem package name
    if:
      type: text
      regex: '(?i)name:\s*rails-ai-context\b'

composite_rules:
  - id: rails-ai-context-guarded-package
    desc: rails-ai-context gem with sensitive file guards
    crit: notable
    all:
      - id: rails-ai-context-module
      - id: micro-behaviors/fs/path/sensitive/credentials::ruby-sensitive-file-guard
