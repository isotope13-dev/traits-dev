defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  size_min: 1

traits:
  # commons-memory (Neoo-Blue) is an MIT-licensed MCP memory hub. Its
  # `commons setup` and `commons expose` code invokes its own module by name
  # (`python -m commons_memory`). That invocation identifies the shipped
  # package's source. It is an identity marker only: it does not prove the
  # package's behavior, so suppressing findings on it must stay narrow.
  - id: commons-memory-module-invocation
    desc: commons-memory package module invocation
    for: [python]
    if:
      type: text
      substr: "-m commons_memory"
