# Abstract Endeavors abstract-toolserver
defaults:
  platforms: [unix, windows]
  for: [pkg_info, text, python]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: abstract_toolserver package name
    for: [pkg_info, text]
    if:
      type: value
      path: name
      exact: abstract_toolserver

  - id: repository-url
    desc: abstract_toolserver upstream repository
    if:
      type: text
      substr: github.com/abstractendeavors/abstract-toolserver
      case_insensitive: true

  - id: mcp-server-name
    desc: abstract_toolserver MCP server name
    for: [python]
    if:
      type: string_literal
      exact: abstract-toolserver-mcp

composite_rules:
  - id: abstract-toolserver-package
    desc: abstract_toolserver package identity
    crit: notable
    conf: 0.99
    for: [pkg_info, text]
    all:
      - id: package-name
      - id: repository-url
