# Thalamus CLI is a published remote client for Claude Code sessions.
# HTTP polling against its relay server and authenticated shell/file RPC
# handlers are expected product behavior for remote session management.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Thalamus npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: thalamus

  - id: upstream-repository
    desc: Thalamus upstream repository reference
    for: [package.json, javascript, typescript, markdown]
    if:
      type: text
      regex: 'et-ai-labs/Thalamus([-/ "''`?#]|$)'

  - id: api-server-host
    desc: Thalamus API server hostname
    for: [javascript, typescript]
    if:
      type: text
      substr: thalamus.etai.app

  - id: mcp-tool-namespace
    desc: Thalamus MCP tool namespace
    for: [javascript, typescript]
    if:
      type: text
      substr: mcp__thalamus__

composite_rules:
  - id: benign-application-context
    desc: Thalamus bundled application context
    crit: exception
    conf: 0.99
    all:
      - id: api-server-host
    any:
      - id: upstream-repository
      - id: mcp-tool-namespace
      - id: package-name
