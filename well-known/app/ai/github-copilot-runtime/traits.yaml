# @github/copilot — bundled GitHub Copilot language-server runtime (npm).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: copilot-npm-package-path
    desc: Bundled GitHub Copilot npm package path
    for: [javascript, typescript, npm, archives]
    if:
      type: path
      regex: '(?i)@github[\\/]copilot[\\/]'

  - id: copilot-sdk-dependency
    desc: GitHub Copilot SDK dependency in manifest
    for: [package.json, json]
    if:
      type: text
      substr: '@github/copilot-sdk'

composite_rules:
  - id: github-copilot-app-bundle
    desc: Bundled GitHub Copilot runtime npm package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: copilot-npm-package-path
      - id: copilot-sdk-dependency
