# The Windows portable distribution is a normal application bundle: its
# embedded Python, GPU runtimes, and many native extensions are expected.
# Large solid 7z builds often omit archive.members[*] in the values tree, so
# identification also uses nested-path and archive-basename signals (same
# pattern as Electron app.asar bundle exceptions).
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.99

traits:
  - id: comfyui-portable-archive-layout
    desc: ComfyUI Windows portable archive layout
    for: [7z, zip]
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]'

  - id: comfyui-project-manifest-member
    desc: ComfyUI project manifest archive member
    for: [7z, zip]
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]ComfyUI[\\/]pyproject\.toml$'

  - id: comfyui-intel-launcher-member
    desc: ComfyUI Intel GPU launcher archive member
    for: [7z, zip]
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]run_intel_gpu\.bat$'

  - id: comfyui-portable-gpu-launcher-member
    desc: ComfyUI portable GPU launcher archive member
    for: [7z, zip]
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]run_(amd|nvidia|intel)_gpu\.bat$'

  - id: comfyui-portable-archive-basename
    desc: ComfyUI Windows portable archive basename
    for: [7z, zip]
    size_min: 1000000
    size_max: 10000000000
    if:
      type: basename
      regex: '(?i)ComfyUI_windows_portable'

  - id: comfyui-portable-nested-path
    desc: ComfyUI Windows portable nested path
    # Nested members inside the portable tree (Python runtime, wheels, GPU
    # libs, launchers). Broad for: so archive-scoped package rules can see
    # the application-bundle context when evidence pools across members.
    for: [binaries, scripts, source, manifests, data, pe, dll, python, batch, whl, 7z, zip]
    platforms: [windows, unix]
    size_min: 0
    size_max: 10000000000
    if:
      type: path
      regex: '(?i)(^|[/\\])ComfyUI_windows_portable([/\\]|$)'

  - id: comfy-kitchen-tensor-module
    desc: ComfyUI kitchen tensor layouts
    for: [python]
    platforms: [windows, unix]
    size_min: 500
    size_max: 200000
    if:
      type: path
      regex: '(?i)comfy_kitchen/tensor'
  - id: comfy-kitchen-cuda-backend
    desc: ComfyUI kitchen CUDA backend
    for: [python]
    platforms: [windows, unix]
    size_min: 1000
    size_max: 200000
    if:
      type: path
      regex: '(?i)comfy_kitchen/backends/cuda'

  - id: comfyui-main-script
    desc: ComfyUI application entry script
    for: [python]
    platforms: [windows, unix]
    size_min: 1000
    size_max: 200000
    if:
      type: path
      regex: '(?i)ComfyUI/main\.py'

composite_rules:
  - id: comfyui-portable-member-layout
    desc: ComfyUI portable archive member layout
    crit: notable
    conf: 0.99
    for: [7z, zip]
    all:
      - id: comfyui-portable-archive-layout
      - id: comfyui-project-manifest-member
    any:
      - id: comfyui-intel-launcher-member
      - id: comfyui-portable-gpu-launcher-member

  - id: comfyui-portable-archive-context
    desc: Identified ComfyUI Windows portable distribution
    crit: exception
    conf: 0.99
    # Pool across the whole input so archive-scoped wheel/package composites
    # that combine unrelated nested files still see the application context.
    scope: outer
    for: [binaries, scripts, source, manifests, data, pe, dll, python, batch, whl, 7z, zip, tar, jar, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix, xpi, rar, cpio, apk, alpine_apk, ipa]
    platforms: [windows, unix]
    any:
      - id: comfyui-portable-archive-basename
      - id: comfyui-portable-nested-path
      - id: comfyui-portable-member-layout
