# Miadi relational movie software factory suite metapackage.
# The root package is an umbrella distribution that installs the family of
# @miadi/* packages in one command and contains no code itself.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: miadi-suite-package-name
    desc: Miadi relational movie suite package
    if:
      type: value
      path: name
      regex: '^(@miadi/.*|miadi)$'
