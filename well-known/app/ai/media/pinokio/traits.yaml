defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, html, shell, batch, elf, pe, macho, archives]
  crit: notable
  conf: 0.98
  size_max: 600000000

traits:
  - id: app-bundle
    desc: Pinokio app bundle member
    if:
      type: path
      regex: 'Pinokio|pinokio\.computer|pinokiod'
  - id: package-name
    desc: pinokiod npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: pinokiod
  - id: archive-path
    desc: pinokiod npm pack archive path
    crit: notable
    if:
      type: path
      regex: 'pinokiod-[0-9]'
  - id: pinokio-client-runtime
    desc: Pinokio browser client runtime
    for: [javascript, typescript]
    if:
      type: text
      substr: PinokioPathRemoval
  - id: huggingface-auth-token-cache
    desc: Pinokio Hugging Face auth token cache path
    for: [javascript, typescript]
    if:
      type: text
      substr: 'kernel.path("cache", "HF_AUTH", "token")'
  - id: huggingface-device-login-test
    desc: Pinokio Hugging Face device-login unit test
    for: [javascript, typescript]
    if:
      type: text
      substr: Hugging Face connect parses managed hf JSON device login events

  - id: huggingface-provider-path
    desc: Pinokio Hugging Face provider path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'providers/huggingface'
