# audio-transc — CLI that transcribes wav/mp3/m4a via NVIDIA Parakeet
# (NeMo ASR) after ffmpeg resample. Console entry point audio-transc.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: wheel-distribution
    desc: audio_transc Python wheel distribution
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: audio_transc

  - id: parakeet-tdt-model
    desc: NVIDIA Parakeet TDT ASR model name
    for: [python, text]
    conf: 0.98
    if:
      type: text
      substr: nvidia/parakeet-tdt

  - id: console-entrypoint
    desc: audio-transc console script entrypoint
    for: [text]
    conf: 0.97
    if:
      type: text
      regex: '(?m)^audio-transc\s*=\s*transcribe:main\s*$'
