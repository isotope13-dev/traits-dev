defaults:
  conf: 0.99
  platforms:
  - unix
  - windows
  for:
  - javascript
  - json
  - chrome-manifest
  - crx
  - zip
  - xpi
traits:
- id: product-name
  desc: NoobClaw browser assistant product name
  crit: notable
  for:
  - javascript
  - json
  - chrome-manifest
  if:
    type: text
    regex: (?i)\bNoobClaw\b
- id: official-domain
  desc: NoobClaw first-party domain
  crit: notable
  for:
  - javascript
  - json
  - chrome-manifest
  if:
    type: text
    substr: noobclaw.com
