# NoobClaw Browser Assistant is a user-facing AI browser automation extension
# that connects to the NoobClaw AI desktop client or server for social media
# automation (Douyin, Xiaohongshu, Binance Square). Its CDP debugger bridge,
# synthetic input events, and loopback WebSocket transport (ws://127.0.0.1:18800)
# are the expected mechanics of that browser automation tool. Identity is anchored
# on its self-owned first-party domain plus product brand so that unrelated browser
# automation is not suppressed.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, json, chrome-manifest, crx, zip, xpi]

traits:
  - id: product-name
    desc: NoobClaw browser assistant product name
    crit: notable
    for: [javascript, json, chrome-manifest]
    if:
      type: text
      regex: '(?i)\bNoobClaw\b'

  - id: official-domain
    desc: NoobClaw first-party domain
    crit: notable
    for: [javascript, json, chrome-manifest]
    if:
      type: text
      substr: noobclaw.com

composite_rules:
  - id: noobclaw-browser-extension-context
    desc: Recognized NoobClaw AI browser-agent extension
    crit: exception
    scope: outer
    for: [javascript, chrome-manifest, crx, zip, xpi]
    all:
      - id: product-name
      - id: official-domain
