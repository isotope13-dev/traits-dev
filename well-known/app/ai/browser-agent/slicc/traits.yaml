# slicc (github.com/ai-ecoverse/slicc-cli) is an open-source browser automation
# and environment connection tool for AI agents developed by ai-ecoverse.
# It discovers installed browsers and connects via CDP to automate navigation,
# tabs, and observability sessions.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, package.json]
  crit: notable
  conf: 0.98
  size_max: 100000000

traits:
  - id: product-name
    desc: slicc product name
    if:
      type: text
      regex: '(?i)\bslicc\b'

  - id: repo-url
    desc: slicc repository URL
    if:
      type: text
      substr: 'ai-ecoverse/slicc-cli'

  - id: package-name
    desc: slicc npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@ai-ecoverse/slicc'

  - id: cli-usage
    desc: slicc CLI command usage text
    if:
      type: text
      regex: '(?i)\bslicc\s+(browsers|update|install|prompt)\b'

composite_rules:
  - id: slicc
    desc: slicc AI browser automation CLI
    all:
      - id: product-name
    any:
      - id: repo-url
      - id: package-name
      - id: cli-usage
