# @phi-code-admin/browser — programmatic browser automation API for phi-code (uglyswap/phi-code).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: phi-code-github-repo
    desc: phi-code GitHub repository URL
    if:
      type: text
      substr: uglyswap/phi-code

  - id: phi-code-npm-scope
    desc: phi-code npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: ^@phi-code-admin/

  - id: camofox-browser-server-package
    desc: camofox-browser server package reference
    for: [javascript, typescript]
    if:
      type: text
      substr: "@phi-code-admin/camofox-browser"

  - id: phi-browser-env-var
    desc: phi-code browser environment variable
    for: [javascript, typescript]
    if:
      type: text
      regex: \bPHI_BROWSER_[A-Z0-9_]+\b

composite_rules:
  - id: phi-code-browser-context
    desc: phi-code browser automation context
    crit: notable
    conf: 0.95
    any:
      - id: phi-code-github-repo
      - id: phi-code-npm-scope
      - id: camofox-browser-server-package
      - id: phi-browser-env-var
