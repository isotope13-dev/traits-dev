# sourcebolt (github.com/candidloom-hub/sourcebolt) signs the user into
# NotebookLM. Login launches Chromium on a dedicated user-data-dir, never the
# user's profile, then keeps only notebook and Google sign-in cookies.
defaults:
  platforms: [unix, windows]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: module-path
    desc: sourcebolt Go module path
    if:
      type: text
      substr: github.com/candidloom-hub/sourcebolt
      section: .rodata

  - id: login-command
    desc: sourcebolt login command text
    if:
      type: text
      substr: sourcebolt login
      section: .rodata

composite_rules:
  - id: product
    desc: sourcebolt NotebookLM login CLI
    all:
      - id: module-path
      - id: login-command
