defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: agent-webbridge npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agent-webbridge

  - id: upstream-repository
    desc: agent-webbridge GitHub repository
    for: [javascript, markdown, text, json, package.json]
    if:
      type: text
      substr: github.com/jeet-dhandha/agent-webbridge

  - id: awb-profile-tokens
    desc: agent-webbridge extension profile symbols
    for: [javascript]
    if:
      type: text
      regex: '\b(AWB_EXT_IDS|awbExtId|agent-webbridge-extension)\b'

composite_rules:
  - id: archive-context
    desc: agent-webbridge documented AI browser automation daemon context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: awb-profile-tokens
