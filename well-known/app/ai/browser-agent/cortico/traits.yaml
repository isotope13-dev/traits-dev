# Cortico World Browser (cortico-world-browser, github.com/biliye/cortico-world-browser)
# is a browser-automation agent plugin for the Cortico AI desktop assistant platform
# ("Cortico World: 浏览器"). Its dedicated Chrome instance launched with
# --remote-allow-origins=* and an isolated User Data directory inside the agent's
# home directory is the product's documented design for multi-tab automation and
# background media playback without interfering with the user's personal browser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: cortico-world-browser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cortico-world-browser

  - id: upstream-repository
    desc: cortico-world-browser GitHub repository URL
    for: [javascript, typescript, markdown, text, json, package.json]
    if:
      type: text
      substr: github.com/biliye/cortico-world-browser

  - id: cortico-world-manifest
    desc: Cortico extension world manifest block
    for: [package.json]
    if:
      type: value
      path: cortico.kind
      exact: world

  - id: cortico-core-module-import
    desc: Imports Cortico agent core or world runtime
    for: [javascript, typescript]
    if:
      type: text
      regex: 'cortico/(core/types|world)\.ts'

  - id: cortico-own-browser-args
    desc: Cortico dedicated browser argument builder
    for: [javascript, typescript]
    if:
      type: symbol
      exact: ownBrowserArgs

  - id: cortico-window-raise-token
    desc: Cortico window raise helper token
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(CorticoRaiseW|CORTICO_RAISE_PID)\b'

composite_rules:
  - id: cortico-browser-module-context
    desc: Cortico browser agent module context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: cortico-core-module-import
    any:
      - id: cortico-own-browser-args
      - id: cortico-window-raise-token

  - id: cortico-world-browser-archive
    desc: Cortico world browser package archive context
    crit: exception
    conf: 0.99
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: cortico-world-manifest
      - id: cortico-core-module-import

  - id: cortico-browser-agent-context
    desc: Recognized Cortico AI desktop browser agent context
    crit: exception
    conf: 0.99
    any:
      - id: cortico-browser-module-context
      - id: cortico-world-browser-archive
