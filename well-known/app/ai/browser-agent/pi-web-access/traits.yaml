# pi-web-access is a documented Pi extension for web search and Gemini Web.
# Its Chromium-cookie reader is opt-in and uses the user's existing Google
# session only for the advertised Gemini Web integration. Keep the generic
# Chromium credential-access signal for unrelated code, but recognize the
# reader source when both of its package-specific symbols are present.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: pi-web-access package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pi-web-access

  - id: npm-package-name
    desc: pi-web-access npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: pi-web-access

  - id: browser-cookie-access-gate
    desc: Browser cookie access opt-in gate
    for: [typescript]
    if:
      type: symbol
      exact: isBrowserCookieAccessAllowed

  - id: browser-cookie-access-setting
    desc: Browser cookie access opt-in setting key
    for: [javascript, typescript]
    if:
      type: text
      case_insensitive: true
      substr: browsercookieaccess

  - id: google-cookie-reader
    desc: Google browser cookie reader
    for: [typescript]
    if:
      type: symbol
      exact: getGoogleCookies

  - id: gemini-web-origin
    desc: Gemini Web origin URL
    for: [javascript, typescript]
    if:
      type: text
      substr: https://gemini.google.com

  - id: gemini-media-upload-endpoint
    desc: Gemini media upload API endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: generativelanguage.googleapis.com/upload/v1beta

  - id: feynman-web-search-config-env
    desc: Feynman web-search config environment variable
    for: [javascript, typescript]
    if:
      type: text
      substr: FEYNMAN_WEB_SEARCH_CONFIG

composite_rules:
  - id: browser-cookie-reader-context
    desc: pi-web-access browser cookie reader source context
    crit: exception
    conf: 0.99
    for: [typescript]
    all:
      - id: browser-cookie-access-gate
      - id: google-cookie-reader

  - id: gemini-cookie-reader-module
    desc: Gemini Web cookie reader module context
    crit: exception
    conf: 0.99
    for: [typescript]
    all:
      - id: google-cookie-reader
      - id: gemini-web-origin

  - id: gemini-video-upload-module
    desc: Gemini video upload helper module context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: gemini-media-upload-endpoint
      - id: feynman-web-search-config-env

  - id: pi-extension-gated-cookie-reader
    desc: Pi extension gated browser cookie reader context
    crit: exception
    conf: 0.99
    scope: archive
    for: [package.json, javascript, typescript, npm]
    all:
      - id: browser-cookie-access-setting
      - id: well-known/app/ai/coding-agent/tau-pi-extension::pi-manifest-extensions
      - id: metadata/package/keywords/identity::npm-keyword-pi-package
    # A setting name and Pi manifest markers alone are insufficient, and the
    # alternatives must prove the *reader* is gated rather than restating
    # capabilities every cookie client has. Recognized reader symbols, or a
    # cookie-store read structurally enclosed by the positive browser-cookie
    # opt-in branch, cover renamed or downstream readers that implement the
    # same opt-in gated flow. A bare cookies-table query proves no consent,
    # and a gated Gemini Web consumer call does not gate the reader's other
    # call sites, so neither clears the hostile replay claim; a verified
    # hostile clone shipped the opt-in setting text, the Pi markers, the
    # cookies-table query and one gated search call alongside ungated,
    # decrypting reader paths that blindly forward the harvested session
    # across redirects.
    any:
      - id: browser-cookie-access-gate
      - id: google-cookie-reader
      - id: micro-behaviors/communications/http/services/gemini::browser-cookie-gated-read
    # No cookie-name unless here: a legitimate Gemini Web session replay
    # lists the same short Google auth names (SID/HSID/SSID) alongside
    # __Secure-1PSID/__Secure-1PSIDTS, since the browser itself sends them
    # with requests to google.com hosts. Name presence alone does not
    # distinguish over-collection from the documented gated flow.
    # No redirect-forwarding void here either: the documented gated flow
    # starts from the advertised first-party Gemini Web endpoint and follows
    # its redirects the way a standard session client does, so the replay
    # stays first-party session use rather than session hijacking and this
    # context clears the hostile replay claim. The redirect boundary itself
    # is a separate defect observation that stays with
    # communications/http/redirect, which does not reference this context.



