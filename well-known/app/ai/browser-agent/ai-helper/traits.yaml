# AI Helper Agent (github.com/xiweicheng/ai-helper) is an open-source local proxy
# service and companion agent for the AI Helper Chrome Extension, providing local
# file access, command execution, and MCP tools.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: official-installer-url
    desc: AI Helper official installer script URL
    crit: notable
    conf: 0.98
    for: [javascript, typescript, html, markdown, shell, powershell, batch, text]
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/xiweicheng/ai-helper/main(/install\.(sh|ps1))?'

  - id: repository-url
    desc: AI Helper repository URL
    if:
      type: text
      regex: '(github|raw\.githubusercontent)\.com/xiweicheng/ai-helper\b'

  - id: package-name
    desc: ai-helper-agent npm package name
    for: [package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"ai-helper-agent"'

  - id: agent-command-name
    desc: ai-helper-agent CLI command name
    if:
      type: text
      regex: '\b(ai-helper-agent|aha)\s+(start|stop|status|paircode)\b'

composite_rules:
  - id: ai-helper-agent
    desc: AI Helper Chrome extension and companion agent
    crit: notable
    conf: 0.98
    all:
      - id: repository-url
    any:
      - id: official-installer-url
      - id: package-name
      - id: agent-command-name
