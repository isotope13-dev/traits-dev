# agent-browser (github.com/vercel-labs/agent-browser, agent-browser.dev) is an
# open-source browser automation CLI for AI agents published by Vercel Labs.
# It launches browsers (Chrome, Chromium) and connects via WebSocket (CDP) to
# automate navigation, DOM interactions, and observability sessions.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.98
  size_max: 100000000

traits:
  - id: product-name
    desc: agent-browser product name
    if:
      type: text
      regex: '(?i)\bagent-browser\b'

  - id: repo-url
    desc: agent-browser repository URL
    if:
      type: text
      substr: 'github.com/vercel-labs/agent-browser'

  - id: env-var
    desc: agent-browser environment variable prefix
    if:
      type: text
      regex: '\bAGENT_BROWSER_(CDP|STREAM_PORT|SESSION|DEBUG|ENGINE|CONFIG)\b'

  - id: mcp-tool-prefix
    desc: agent-browser MCP tool prefix
    if:
      type: text
      regex: '\bagent_browser_(open|click|snapshot|connect|close)\b'

  - id: agent-browser-benchmark
    desc: agent-browser benchmark source
    if:
      type: path
      regex: 'benchmarks[\\/]bench\.ts$'

  - id: agent-browser-trust-boundaries-doc
    desc: agent-browser trust-boundary safety guide
    conf: 1.0
    for: [markdown]
    if:
      type: basename
      exact: trust-boundaries.md

composite_rules:
  - id: agent-browser
    desc: agent-browser automation CLI
    all:
      - id: product-name
    any:
      - id: repo-url
      - id: env-var
      - id: mcp-tool-prefix
      - id: agent-browser-benchmark
      - id: agent-browser-trust-boundaries-doc
