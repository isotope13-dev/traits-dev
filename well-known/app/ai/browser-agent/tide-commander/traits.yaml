# Tide Commander (github.com/deivid11/tide-commander, tidecommander.com) is an
# open-source visual orchestrator for AI coding agents. Its companion browser
# extension is a user-operated cockpit: it captures page errors, chats with the
# agent assigned to a page from a side panel, and picks DOM elements to send as
# context. Delivery to an agent is user-initiated, sensitive headers are
# redacted before forwarding, and the default commander endpoint is local.
# Driving pages over the chrome.debugger CDP bridge with all-site host access
# is an expected feature of that product, as with the other recognized AI
# browser agents in this directory.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, chrome-manifest, archives]

traits:
  - id: product-name
    desc: Tide Commander product name
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\btide[ _-]?commander\b'

  - id: extension-manifest-name
    desc: Tide Commander browser-extension manifest name
    crit: notable
    conf: 0.99
    for: [chrome-manifest]
    if:
      type: value
      path: name
      substr: Tide Commander

composite_rules:
  - id: tide-commander-browser-extension-context
    desc: Recognized Tide Commander browser-agent cockpit extension
    crit: exception
    conf: 0.99
    for: [javascript, chrome-manifest, crx, archives]
    all:
      - id: product-name
      - id: extension-manifest-name
