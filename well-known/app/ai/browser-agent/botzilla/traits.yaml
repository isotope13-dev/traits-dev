# Botzilla (botzilla.dev) is a commercial browser-automation/RPA studio with
# an AI agent surface: it drives browsers via CDP, matches screen elements
# (GetPixel/SetPixel image comparison), loads extensions through delegates,
# and ships an updater. Those individually-suspicious capabilities are its
# ordinary automation behavior, not payload staging.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  # Botzilla Studio is a multi-megabyte suite; stub-sized files carrying
  # these markers are not the product.
  size_min: 1048576
  size_max: 16777216

traits:
  - id: product-identity
    desc: Botzilla PE product identity
    if:
      type: value
      path: pe.version.product_name
      exact: Botzilla
  - id: original-filename-exe
    desc: Botzilla original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Botzilla.exe
  - id: vendor-domain
    desc: Botzilla vendor domain reference
    if:
      type: text
      substr: botzilla.dev
      section: .text
  - id: studio-namespace
    desc: Botzilla studio namespace reference
    if:
      type: text
      substr: Botzilla.Studio
      section: .text
  - id: studio-updater-artifact
    desc: Botzilla studio updater artifact name
    if:
      type: text
      substr: Botzilla.StudioUpdater.ps1
      section: .text

composite_rules:
  - id: botzilla-studio
    desc: Botzilla RPA studio application
    all:
      - id: product-identity
    any:
      - id: vendor-domain
      - id: studio-namespace
      - id: original-filename-exe
  # Known-good automation context: the studio's pixel reads serve screen
  # element matching and its delegate loads serve extensions. Referenced
  # only from unless/downgrade legs, never as evidence.
  - id: botzilla-automation-context
    desc: Botzilla studio automation context
    crit: exception
    all:
      - id: botzilla-studio
      - id: studio-updater-artifact
