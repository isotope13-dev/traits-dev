# Retab official Python SDK for LLM document processing.
# requests.get, env API keys, and gzip/base64 MIME helpers are the
# product HTTP client, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: retab PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: retab

  - id: wheel-distribution
    desc: retab wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: retab

  - id: github-repo
    desc: retab-dev GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/retab-dev/retab

  - id: api-host
    desc: retab API hostname
    conf: 0.98
    if:
      type: text
      substr: api.retab.com
