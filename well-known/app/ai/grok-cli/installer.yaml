# xAI publishes shell and PowerShell bootstrap scripts for Grok CLI from the
# same first-party path. Projects that guide users through installing Grok CLI
# legitimately embed these otherwise risky download-to-interpreter commands.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, markdown, shell, powershell, batch]
  crit: notable
  conf: 0.99

traits:
  - id: official-installer-url
    desc: Official xAI Grok CLI installer URL
    if:
      type: text
      regex: 'https://x\.ai/cli/install\.(sh|ps1)\b'
