# InsForge Agent Skills is a public collection of reusable AI-agent workflows
# for the InsForge BaaS platform.  Documentation legitimately references CLI
# installers, API keys, and agent guidance files.
defaults:
  platforms: [unix, windows]
  for: [tar, markdown, text, javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: project-heading
    desc: InsForge Agent Skills project heading
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: InsForge Agent Skills

  - id: upstream-repository
    desc: InsForge Agent Skills upstream repository
    for: [markdown, text, json]
    if:
      type: text
      regex: '(?i)github\.com/InsForge/insforge-skills'

  - id: source-tree-member
    desc: InsForge Agent Skills source-tree member
    if:
      type: path
      regex: '(^|[\\/])insforge-skills-[0-9a-f]{40}([\\/]|$)'

composite_rules:
  - id: insforge-agent-skills-identity
    desc: InsForge Agent Skills source identity
    crit: notable
    conf: 0.99
    any:
      - id: project-heading
      - id: upstream-repository
      - id: source-tree-member

  - id: insforge-agent-skills-context
    desc: InsForge Agent Skills documentation archive
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: insforge-agent-skills-identity
      - id: metadata/package/config::agent-instructions-md-basename
