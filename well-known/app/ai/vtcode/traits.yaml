defaults:
  platforms: [unix, windows]
  for: [elf, rust, text]
  crit: notable
  conf: 0.95
  size_min: 1000000
  size_max: 300000000

traits:
  - id: vtcode-commons-path
    desc: vtcode commons crate path
    if:
      type: text
      substr: vtcode-commons

  - id: vtcode-config-env
    desc: vtcode configuration env var
    if:
      type: text
      substr: VTCODE_CONFIG

  - id: vtcode-data-path
    desc: vtcode data directory path
    if:
      type: text
      substr: /.vtcode/

  - id: vtcode-binary-name
    desc: vtcode CLI binary name
    for: [elf]
    if:
      type: basename
      exact: vtcode

composite_rules:
  - id: vtcode-agent-package
    desc: vtcode AI coding agent CLI
    crit: notable
    conf: 0.95
    any:
      - id: vtcode-commons-path
      - id: vtcode-config-env
      - id: vtcode-data-path
      - id: vtcode-binary-name
    needs: 2
