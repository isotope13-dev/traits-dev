defaults:
  platforms: [unix, windows]
  for: [pkginfo, powershell, python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: comfy-test package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: comfy-test

  - id: package-summary
    desc: comfy-test install-test infrastructure
    for: [pkginfo]
    if:
      type: value
      path: summary
      exact: Installation testing infrastructure for ComfyUI custom nodes

  - id: repository
    desc: comfy-test source repository
    for: [pkginfo]
    if:
      type: text
      substr: https://github.com/PozzettiAndrea/comfy-test

  - id: source-module
    desc: comfy-test source module path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])comfy_test[\\/]'

  - id: generated-vm-template
    desc: Generated comfy-test VM bootstrap
    for: [powershell]
    if:
      type: text
      substr: Generated by `comfy-test vm build --unattended`

  - id: generated-vm-template-path
    desc: comfy-test VM bootstrap filename
    for: [powershell]
    if:
      type: basename
      exact: post-install.ps1

  - id: screenshot-test-dependency-bootstrap
    desc: comfy-test screenshot dependency bootstrap
    for: [python]
    if:
      type: text
      regex: 'packages\s*=\s*\[\s*"playwright"\s*,\s*"pillow"\s*,\s*"greenlet"'
