# Aegis (aegis-ag) — CLI-first persistent agent runtime from Agentic
# Intelligence Lab (https://aegis.agentic-in.ai). Distinct from Aliyun
# Aegis AV and the rustaegis protector.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name-aegis-ag
    desc: aegis-ag PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: aegis-ag

  - id: wheel-distribution-aegis-ag
    desc: aegis_ag wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: aegis_ag

  - id: wheel-distribution-prefix
    desc: aegis_ag wheel filename prefix
    for: [whl]
    if:
      type: value
      path: whl.filename.name_prefix
      exact: aegis_ag

  - id: wheel-author
    desc: Agentic Intelligence Lab wheel author
    for: [whl]
    if:
      type: value
      path: whl.author
      exact: Agentic Intelligence Lab

  - id: github-agentic-in-aegis-repo
    desc: agentic-in Aegis GitHub repository
    if:
      type: text
      substr: github.com/agentic-in/aegis

  - id: pkginfo-aegis-github-source
    desc: Package metadata cites Aegis GitHub
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      regex: '(?i)github\.com/agentic-in/aegis'

  - id: aegis-homepage
    desc: Aegis product homepage URL
    if:
      type: text
      substr: aegis.agentic-in.ai

  - id: embed-model-id-env
    desc: Aegis embedding model ID env
    for: [python]
    if:
      type: text
      substr: AEGIS_EMBED_MODEL_ID

  - id: copilot-acp-command-env
    desc: Aegis Copilot ACP command env
    for: [python]
    if:
      type: text
      substr: AEGIS_COPILOT_ACP_COMMAND

  - id: aegis-tool-code-filename
    desc: Aegis tool-exec compile filename
    for: [python]
    if:
      type: text
      substr: '<aegis-tool-code>'

  - id: terminal-exec-command-error
    desc: Aegis terminal.exec missing command
    for: [python]
    if:
      type: text
      substr: "tool.terminal.exec requires a 'command' argument"

  - id: clawhub-skill-search-source
    desc: Aegis ClawHub skill search source
    for: [python]
    if:
      type: text
      substr: ClawHubSkillSearchSource

  - id: claude-marketplace-skill-search
    desc: Aegis Claude marketplace skill search
    for: [python]
    if:
      type: text
      substr: ClaudeMarketplaceSkillSearchSource

  - id: guardian-mark-renderer
    desc: Aegis guardian brand mark renderer
    for: [python]
    if:
      type: text
      substr: render_guardian_mark

  - id: aegis-gateway-status-banner
    desc: Aegis Gateway runtime status banner
    for: [python]
    if:
      type: text
      substr: Aegis Gateway runtime status

  - id: local-encrypted-secret-cipher
    desc: Aegis local encrypted secret cipher
    for: [python]
    if:
      type: text
      substr: LocalEncryptedSecretCipher

  - id: aegis-im-cli-prog
    desc: Aegis IM CLI program name
    for: [python]
    if:
      type: text
      substr: 'prog="aegis im"'

  - id: aegis-skill-search-github-taps
    desc: Aegis skill search GitHub taps env
    for: [python]
    if:
      type: text
      substr: AEGIS_SKILL_SEARCH_GITHUB_TAPS
composite_rules:
  - id: aegis-ag-runtime
    desc: Aegis CLI persistent agent runtime
    needs: 2
    any:
      - id: pypi-name-aegis-ag
      - id: wheel-distribution-aegis-ag
      - id: wheel-distribution-prefix
      - id: wheel-author
      - id: github-agentic-in-aegis-repo
      - id: pkginfo-aegis-github-source
      - id: aegis-homepage
      - id: embed-model-id-env
      - id: copilot-acp-command-env
      - id: aegis-tool-code-filename
      - id: terminal-exec-command-error
      - id: clawhub-skill-search-source
      - id: claude-marketplace-skill-search
      - id: guardian-mark-renderer
      - id: aegis-gateway-status-banner
      - id: local-encrypted-secret-cipher
      - id: aegis-im-cli-prog
      - id: aegis-skill-search-github-taps
