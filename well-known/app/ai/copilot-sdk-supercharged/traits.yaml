# copilot-sdk-supercharged — Python SDK for GitHub Copilot CLI JSON-RPC control.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: copilot-sdk-supercharged PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: copilot-sdk-supercharged

  - id: github-repo
    desc: copilot-sdk-supercharged GitHub repo marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: github.com/jeremiahjordanisaacson/copilot-sdk-supercharged

  - id: copilot-client-class
    desc: CopilotClient SDK entry class
    for: [python]
    if:
      type: text
      substr: class CopilotClient

  - id: tcp-cli-connect-fn
    desc: Copilot SDK TCP CLI server connection helper
    for: [python]
    if:
      type: text
      substr: async def _connect_via_tcp

composite_rules:
  - id: copilot-sdk-supercharged-context
    desc: GitHub Copilot CLI Python SDK supercharged fork
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: copilot-client-class

  - id: copilot-cli-tcp-transport-context
    desc: Copilot SDK JSON-RPC client over TCP socket transport
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: tcp-cli-connect-fn
