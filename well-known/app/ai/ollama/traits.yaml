defaults:
  platforms:
  - windows
  - unix
  # Windows installers bundle the runtime and are substantially larger than
  # source scripts; keep identity matching available for those vendor builds.
  size_max: 2000000000
traits:
- id: official-download-url
  desc: Official Ollama installer download URL
  crit: notable
  conf: 0.98
  for:
  - python
  - shell
  - text
  if:
    type: text
    regex: https://ollama\.com/(download/(OllamaSetup\.exe|Ollama-darwin\.zip)|install\.sh)\b

- id: ollama-api-tags-path
  desc: Ollama model-list API path
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: text
    substr: /api/tags

- id: ollama-windows-signer
  desc: Ollama Windows code-signing identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.signatures[0].subject
    substr: Ollama Inc.

- id: ollama-windows-go-module
  desc: Ollama Windows Go module identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.go.module.path
    exact: github.com/ollama/ollama

- id: ollama-windows-product
  desc: Ollama Windows PE product identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.version.product_name
    exact: Ollama

composite_rules:
# Ollama's signed agent bundles safety-policy code and a Qwen Code installer;
# keep its literal credential paths and installer URL as notable context while
# preserving suspicious matches for other publishers and Go modules.
- id: ollama-windows-signed-go-context
  desc: Signed Ollama Windows Go application context
  crit: exception
  conf: 0.99
  all:
  - id: ollama-windows-signer
  - id: ollama-windows-go-module
