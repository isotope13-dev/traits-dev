# Sirius Chat is a Python LLM/RPG dialogue framework. Its provider HTTP
# clients, SQLite persistence, and skill loader are expected application
# capabilities; this identity keeps them separate from hostile interpretations.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 500000000

traits:
  - id: wheel-distribution
    desc: Sirius Chat Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: sirius_chat

  - id: package-name
    desc: Sirius Chat package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: sirius-chat

  - id: upstream-repository
    desc: Sirius Chat upstream GitHub repository
    if:
      type: text
      substr: github.com/Sparrived/SiriusChat

  - id: python-module-tree
    desc: Sirius Chat Python module tree
    for: [python]
    if:
      type: path
      regex: '(^|[/\\])sirius_chat[/\\]'

composite_rules:
  - id: package-context
    desc: Recognized Sirius Chat Python package
    crit: notable
    conf: 0.99
    scope: archive
    for: [whl]
    all:
      - id: wheel-distribution
    any:
      - id: upstream-repository
      - id: python-module-tree
