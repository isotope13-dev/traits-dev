# CLI Launcher for Claude is a VS Code extension that embeds Claude Code in a
# node-pty terminal. Package identity supplies context for its expected local
# shell, PTY, clipboard, and desktop-notification capabilities.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: CLI Launcher for Claude package name
    if:
      type: value
      path: name
      exact: cli-launcher-for-claude

  - id: package-publisher
    desc: CLI Launcher for Claude publisher
    if:
      type: value
      path: publisher
      exact: rockuen

  - id: upstream-repository
    desc: CLI Launcher for Claude upstream repository
    if:
      type: value
      path: repository.url
      regex: 'github\.com/rockuen/cli-launcher-for-claude(\.git)?([/?#]|$)'

composite_rules:
  - id: vscode-extension-identity
    desc: Recognized CLI Launcher for Claude VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
      - id: upstream-repository
