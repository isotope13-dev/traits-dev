# Theus — terminal coding agent (theus.pe / Marketrix SAC).
# Platform npm packages ship a Bun-compiled native binary named `theus` / `theus.exe`.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, tar, zip, elf, macho, pe, package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: theus-native-binary-name
    desc: Theus native binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^theus(\.exe)?$'

  - id: theus-binary-path
    desc: Bundled Theus binary path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]theus(\.exe)?$'

  - id: theus-platform-package-name
    desc: Theus platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^theus-cli(-[a-z0-9_-]+)?$'

  - id: theus-product-site
    desc: Theus product site URL
    for: [elf, macho, pe, package.json, javascript, text]
    size_min: 64
    if:
      type: text
      substr: 'https://theus.pe'

  - id: theus-author-marketrix
    desc: Theus author Marketrix reference
    for: [package.json, markdown, text]
    if:
      type: text
      substr: 'Marketrix SAC'

composite_rules:
  - id: theus-bun-runtime
    desc: Theus packaged Bun runtime
    crit: notable
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    all:
      - id: theus-native-binary-name
    any:
      - id: theus-binary-path
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/binary/section/name::bun-macho-section-name
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-standalone-graph-trailer
      - id: theus-product-site

  - id: theus-distribution
    desc: Theus distribution identity
    crit: notable
    conf: 0.98
    any:
      - id: theus-platform-package-name
      - id: theus-product-site
      - id: theus-author-marketrix

  - id: theus-package-context
    desc: Theus coding agent package context
    crit: exception
    conf: 0.99
    any:
      - id: theus-bun-runtime
      - id: theus-distribution
      - id: theus-binary-path
      - id: theus-platform-package-name
