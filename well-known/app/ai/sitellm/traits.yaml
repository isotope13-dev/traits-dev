# SiteLLM is a LiteLLM-compatible Python gateway with an optional proxy UI,
# provider integrations, MCP support, and security/guardrail fixtures. Those
# legitimate features explain the package's broad static capability surface.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name sitellm
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: sitellm

  - id: sitellm-project-repository
    desc: SiteLLM project repository URL
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: gitee.com/zhds/sitellm

  - id: sitellm-console-entrypoint
    desc: SiteLLM console entry point
    for: [text]
    if:
      type: text
      regex: '(?im)^sitellm(-proxy)?\s*=\s*sitellm[.:]'

  - id: sitellm-aws-secret-manager-source
    desc: SiteLLM AWS secret-manager module path
    for: [python]
    if:
      type: path
      regex: 'secret_managers[\\/]aws_secret_manager\.py$'

  - id: sitellm-aws-kms-env-namespace
    desc: SiteLLM AWS KMS environment namespace
    for: [python]
    if:
      type: text
      substr: LITELLM_SECRET_AWS_KMS

  - id: compliance-dataset-export
    desc: Exports SiteLLM compliance-dataset prompts
    for: [javascript]
    if:
      type: text
      substr: getComplianceDatasetPrompts

  - id: code-execution-safety-framework
    desc: Code-execution safety prompt marker
    for: [javascript]
    crit: notable
    if:
      id: metadata/file/policy/identity::llm-code-execution-safety-prompts

composite_rules:
  - id: sitellm-package
    desc: SiteLLM LiteLLM-compatible gateway package
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: pkginfo-name
    any:
      - id: sitellm-project-repository
      - id: sitellm-console-entrypoint

  - id: sitellm-aws-kms-env-provider
    desc: SiteLLM AWS KMS environment-backed secret provider
    crit: notable
    conf: 0.99
    for: [python]
    all:
      - id: sitellm-aws-secret-manager-source
      - id: sitellm-aws-kms-env-namespace

  - id: compliance-dataset-context
    desc: SiteLLM defensive compliance-prompt dataset
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: compliance-dataset-export
      - id: code-execution-safety-framework
