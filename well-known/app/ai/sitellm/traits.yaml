# SiteLLM is a LiteLLM-compatible Python gateway with an optional proxy UI,
# provider integrations, MCP support, and security/guardrail fixtures. Those
# legitimate features explain the package's broad static capability surface.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name sitellm
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*sitellm\s*$'

  - id: sitellm-project-repository
    desc: SiteLLM project repository URL
    for: [pkginfo, markdown, python]
    if:
      type: text
      substr: gitee.com/zhds/sitellm

  - id: sitellm-console-entrypoint
    desc: SiteLLM console entry point
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?im)^sitellm(-proxy)?\s*=\s*sitellm[.:]'

composite_rules:
  - id: sitellm-package
    desc: SiteLLM LiteLLM-compatible gateway package
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: sitellm-project-repository
      - id: sitellm-console-entrypoint
