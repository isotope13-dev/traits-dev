# Copilot Delegate — VS Code extension for delegating tasks to CLI agents.
defaults:
  platforms: [unix, windows]
  for: [json, javascript, powershell, shell, markdown, package.json, vsix-manifest]
  crit: notable
  conf: 0.98

traits:
  - id: copilot-delegate-package-name
    desc: Copilot Delegate VS Code extension package name
    for: [json, package.json, vsix-manifest]
    if:
      type: value
      path: name
      exact: copilot-delegate

  - id: copilot-delegate-publisher
    desc: Copilot Delegate extension publisher
    if:
      type: text
      substr: allansantos-dv

  - id: copilot-delegate-github-repo
    desc: Copilot Delegate GitHub repository
    if:
      type: text
      substr: github.com/AllanSantos-DV/copilot-delegate

  - id: copilot-hooks-directory-reference
    desc: Copilot Delegate hook directory reference
    for: [powershell, shell, javascript, markdown]
    if:
      type: text
      substr: .copilot/hooks

  - id: copilot-delegate-hook-script
    desc: Copilot Delegate bundled hook script
    for: [powershell, shell]
    if:
      type: path
      regex: '(?i)resources/hooks/'

  - id: copilot-delegate-remote-bridge
    desc: Copilot Delegate remote Android bridge runtime
    for: [javascript]
    if:
      type: text
      word: AndroidBridge

composite_rules:
  - id: copilot-delegate-extension-context
    desc: Copilot Delegate VS Code extension identity
    crit: exception
    conf: 0.99
    any:
      - id: copilot-delegate-package-name
      - id: copilot-delegate-github-repo
    all:
      - id: copilot-delegate-publisher
