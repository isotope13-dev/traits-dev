defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 200000000
traits:

  - id: litellm-package-path
    desc: LiteLLM package path
    crit: notable
    for: [python, javascript, typescript, text]
    if:
      type: path
      regex: '(^|[\\/])litellm([\\/]|-|$)'

  # sk-1234 is LiteLLM's documented default master key. Presented as a
  # credential in a captured request it means someone is authenticating to a
  # proxy that was never hardened (observed in Wiz honeypots paired with
  # model-fingerprinting probes before LLMjacking). Suppressed inside the
  # LiteLLM package itself, whose docs and tests reference it legitimately.
  - id: litellm-default-master-key-request
    desc: Authenticates with LiteLLM default master key
    crit: suspicious
    for: [text, data, json, python, javascript, typescript, shell]
    if:
      type: text
      regex: '(?im)^authorization\s*:\s*bearer\s+sk-1234\b'
    unless:
      - id: litellm-package-path
