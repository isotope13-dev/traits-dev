# Official KoboldCpp distribution (github.com/LostRuins/koboldcpp).
# Bundles CUDA runtimes and Docker environment reference scripts.
defaults:
  platforms: [linux, windows]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: koboldcpp-docker-banner
    desc: KoboldCpp official Docker helper banner
    if:
      type: text
      substr: "Welcome to the official KoboldCpp Docker!"

  - id: koboldcpp-docker-image-reference
    desc: KoboldCpp Docker image reference
    if:
      type: text
      substr: "koboldai/koboldcpp"

  - id: koboldcpp-docker-helper-path
    desc: KoboldCpp docker-helper script path
    if:
      type: path
      regex: '(?i)(^|[\\/])docker-reference[\\/]docker-helper\.sh$'

composite_rules:
  - id: koboldcpp-docker-helper-context
    desc: Official KoboldCpp Docker helper script context
    crit: exception
    conf: 0.99
    all:
      - id: koboldcpp-docker-helper-path
    any:
      - id: koboldcpp-docker-banner
      - id: koboldcpp-docker-image-reference
