defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, shell, text]
  crit: notable
  conf: 0.95

traits:
  - id: opencodex-package-name
    desc: OpenCodex package name in package.json
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@bitkyc08/opencodex"

  - id: opencodex-github-repository
    desc: OpenCodex GitHub repository reference
    if:
      type: text
      regex: 'https?://github\.com/lidge-jun/opencodex(\.git)?\b'

  - id: opencodex-homepage
    desc: OpenCodex homepage URL reference
    if:
      type: text
      substr: 'https://lidge-jun.github.io/opencodex'

  - id: opencodex-branding
    desc: OpenCodex branding marker
    if:
      type: text
      regex: '(?i)\bOpenCodex\b'

  - id: opencodex-config-directory
    desc: OpenCodex configuration directory reference
    if:
      type: text
      regex: '(?i)[~/\\]\.opencodex[/\\]'

composite_rules:
  - id: opencodex-archive-context
    desc: OpenCodex package archive context
    crit: exception
    for: [npm, zip, javascript, typescript, package.json, json, text]
    scope: archive
    all:
      - id: opencodex-package-name
    any:
      - id: opencodex-github-repository
      - id: opencodex-homepage
      - id: opencodex-branding
      - id: opencodex-config-directory
