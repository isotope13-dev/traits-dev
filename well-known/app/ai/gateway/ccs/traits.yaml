defaults:
  platforms: [unix, windows]
  for: [javascript, powershell, json, package.json, text]
  crit: notable
  conf: 0.95

traits:
  - id: ccs-github-repository
    desc: Claude Code Switch GitHub repository
    if:
      type: text
      regex: 'https?://github\.com/kaitranntt/ccs\b'

  - id: ccs-package-name
    desc: Claude Code Switch package name
    if:
      type: text
      regex: '@kaitranntt/ccs\b'

  - id: ccs-branding
    desc: Claude Code Switch branding marker
    if:
      type: text
      regex: '(?i)\b(Claude Code Switch|CCS (Postinstall|Uninstallation))\b'

  - id: ccs-config-directory
    desc: Claude Code Switch config directory
    if:
      type: text
      regex: '(?i)[~/\\]\.ccs[/\\]'

  - id: ccs-source-path
    desc: Claude Code Switch repository path
    if:
      type: path
      regex: 'kaitranntt[/\\]ccs[@/]?'

composite_rules:
  - id: ccs-benign-context
    desc: Claude Code Switch benign context
    crit: exception
    any:
      - id: ccs-github-repository
      - id: ccs-package-name
      - id: ccs-branding
      - id: ccs-config-directory
      - id: ccs-source-path
