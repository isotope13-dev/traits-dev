defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, powershell, json, package.json, text]
  crit: notable
  conf: 0.95

traits:
  - id: ccs-github-repository
    desc: Claude Code Switch GitHub repository
    if:
      type: text
      regex: 'https?://github\.com/kaitranntt/ccs\b'

  - id: ccs-package-name
    desc: Claude Code Switch package name
    if:
      type: text
      regex: '@kaitranntt/ccs\b'

  - id: ccs-branding
    desc: Claude Code Switch branding marker
    if:
      type: text
      regex: '(?i)\b(Claude Code Switch|CCS (Postinstall|Uninstallation))\b'

  - id: ccs-command-line
    desc: Claude Code Switch CLI command usage
    if:
      type: text
      regex: '(?i)\bccs (cleanup|config|switch)\b'

  - id: ccs-log-heading
    desc: Claude Code Switch log header marker
    if:
      type: text
      regex: '(?i)\bCCS (Logs?|CLIProxy)\b'

  - id: ccs-config-directory
    desc: Claude Code Switch config directory
    if:
      type: text
      regex: '(?i)[~/\\]\.ccs[/\\]'

  - id: ccs-source-path
    desc: Claude Code Switch repository path
    if:
      type: path
      regex: 'kaitranntt[/\\]ccs[@/]?'

  - id: ccs-npm-package-path
    desc: Bundled Claude Code Switch npm package path
    if:
      type: path
      regex: '(?i)@kaitranntt[\\/]ccs(-[a-z0-9-]+)?[\\/]'

composite_rules:
  - id: ccs-benign-context
    desc: Claude Code Switch benign context
    crit: exception
    any:
      - id: ccs-github-repository
      - id: ccs-package-name
      - id: ccs-branding
      - id: ccs-command-line
      - id: ccs-log-heading
      - id: ccs-config-directory
      - id: ccs-source-path
      - id: ccs-npm-package-path

  - id: ccs-archive-context
    desc: Claude Code Switch archive context
    crit: exception
    for: [npm, zip, javascript, typescript, powershell, json, package.json, text]
    scope: archive
    all:
      - id: ccs-package-name
    any:
      - id: ccs-github-repository
      - id: ccs-branding
      - id: ccs-command-line
      - id: ccs-log-heading
      - id: ccs-config-directory
      - id: ccs-source-path
      - id: ccs-npm-package-path
