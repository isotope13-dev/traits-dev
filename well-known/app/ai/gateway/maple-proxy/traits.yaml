# maple-proxy — OpenSecret OpenAI-compatible Maple TEE proxy server.
defaults:
  platforms: [unix, windows]
  for: [crate, rust, javascript, package.json, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: crate-name
    desc: maple-proxy Rust crate package name
    for: [crate]
    if:
      type: value
      path: crate.name
      exact: maple-proxy

  - id: crate-repository
    desc: OpenSecret maple-proxy GitHub repository
    for: [crate, markdown, text, rust]
    if:
      type: text
      substr: github.com/OpenSecret/maple-proxy

  - id: openai-proxy-description
    desc: Maple OpenAI-compatible proxy server description
    for: [crate, markdown, text, rust]
    if:
      type: text
      substr: OpenAI-compatible proxy server for Maple

  - id: openclaw-plugin-package-name
    desc: OpenSecret maple-openclaw-plugin package name
    for: [package.json, javascript]
    if:
      type: value
      path: name
      exact: '@opensecret/maple-openclaw-plugin'

  - id: maple-proxy-skill-marker
    desc: maple-proxy OpenClaw agent skill marker
    for: [markdown, text]
    if:
      type: path
      substr: maple-proxy-skill

composite_rules:
  - id: maple-proxy-package
    desc: OpenSecret Maple TEE AI proxy server
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: crate-name
      - id: crate-repository
      - id: openai-proxy-description
      - id: openclaw-plugin-package-name
