# Astra — local AI gateway CLI (astragate).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: astragate npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: astragate

  - id: npm-archive-name
    desc: astragate npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: astragate

  - id: astra-server-launchd-label
    desc: Astra server LaunchAgent label
    for: [javascript, typescript]
    if:
      type: text
      substr: io.astra.server

  - id: product-summary
    desc: Astra local AI gateway product summary
    for: [package.json, markdown]
    if:
      type: text
      substr: "Astra — a local AI gateway"

composite_rules:
  - id: archive-context
    desc: Astra local AI gateway package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: npm-archive-name
      - id: product-summary
      - id: astra-server-launchd-label
