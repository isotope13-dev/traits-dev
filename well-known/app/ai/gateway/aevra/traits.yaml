# Aevra — workspace-scoped local MCP execution gateway for AI web interfaces
# (github.com/the-long-ride/aevra).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: aevra-package-name
    desc: Aevra npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@the-long-ride/aevra"

  - id: aevra-github-repository
    desc: Aevra GitHub repository URL
    if:
      type: text
      substr: github.com/the-long-ride/aevra

composite_rules:
  - id: aevra-gateway-context
    desc: Aevra AI MCP execution gateway context
    crit: notable
    conf: 0.98
    any:
      - id: aevra-package-name
      - id: aevra-github-repository
