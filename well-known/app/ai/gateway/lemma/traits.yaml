# Lemma (@nxuss/lemma) — local MCP server and optional LLM cache proxy for
# coding agents. Opt-in `lemma init` wires IDE configs; postinstall only
# registers a Muse skill when muse is on PATH.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: "@nxuss/lemma npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@nxuss/lemma"

  - id: scoped-npm-archive-name
    desc: "@nxuss/lemma npm archive name"
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@nxuss/lemma"

  - id: upstream-repository
    desc: Lemma upstream GitHub repository
    for: [package.json, markdown]
    if:
      type: text
      regex: 'github\.com/Nxusbets/lemma(\.git)?([/\\s"''`?#]|$)'

  - id: product-mcp-summary
    desc: Lemma local MCP server product summary
    for: [package.json, markdown]
    if:
      type: text
      regex: '(?i)local MCP server.{0,120}(project memory|coding agents)'

  - id: proxy-launchd-label
    desc: Lemma cache proxy LaunchAgent label
    for: [javascript, typescript]
    if:
      type: text
      substr: com.lemma.cache-proxy

  - id: vendor-upgrade-endpoint
    desc: Lemma vendor license upgrade endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: lemma.nxus.studio

composite_rules:
  - id: archive-context
    desc: Recognized Lemma npm archive context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: scoped-npm-archive-name
    any:
      - id: scoped-package-name
      - id: upstream-repository
      - id: product-mcp-summary

  - id: proxy-launchd-context
    desc: Lemma documented cache-proxy LaunchAgent installer
    crit: exception
    conf: 0.99
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: proxy-launchd-label
      - id: vendor-upgrade-endpoint
