# Orchard — The Proxy Company Apple Silicon LLM inference SDK.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: orchard Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: orchard

  - id: package-metadata-name
    desc: orchard PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: orchard'

  - id: orchard-module-path
    desc: orchard Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)orchard/'

  - id: proxy-inference-engine-binary
    desc: Proxy Inference Engine binary name
    for: [python, markdown, text]
    if:
      type: text
      substr: proxy_inference_engine

  - id: orchard-manifest-host
    desc: Orchard release manifest host marker
    for: [python, markdown, text]
    if:
      type: text
      substr: orchard.theproxycompany.com

  - id: proxy-company-marker
    desc: The Proxy Company product marker
    for: [python, markdown, text, json]
    if:
      type: text
      substr: com.theproxycompany

composite_rules:
  - id: orchard-llm-sdk-context
    desc: Orchard Proxy Company LLM inference SDK
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: orchard-module-path
