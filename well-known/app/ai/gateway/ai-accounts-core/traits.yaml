# ai-accounts-core — framework-agnostic AI provider account management library.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.98

traits:
  - id: wheel-distribution
    desc: ai-accounts-core Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ai-accounts-core

  - id: package-metadata-name
    desc: ai-accounts-core PyPI distribution name
    for: [json, markdown, text]
    if:
      type: text
      substr: 'Name: ai-accounts-core'

  - id: module-docstring
    desc: ai-accounts-core package docstring
    for: [python]
    if:
      type: text
      substr: 'Framework-agnostic core for ai-accounts'

  - id: ai-accounts-module-path
    desc: ai_accounts_core Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)ai_accounts_core/'

  - id: cliproxy-manager-module
    desc: ai-accounts-core CLIProxy manager module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)ai_accounts_core/cliproxy/manager\.py$'

composite_rules:
  - id: ai-accounts-core-library
    desc: ai-accounts-core AI provider account management library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-docstring
      - id: ai-accounts-module-path
