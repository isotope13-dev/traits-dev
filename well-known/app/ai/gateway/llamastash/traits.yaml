# LlamaStash is a local-LLM TUI/CLI and daemon.  Its loopback OpenAI
# endpoint, model downloads, and child-process management are documented
# product behavior; identify the package before applying generic heuristics.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, rust, markdown, text, archives]
  crit: notable
  conf: 0.99

traits:
  - id: llamastash-package-name
    desc: LlamaStash Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: llamastash

  - id: llamastash-repository
    desc: LlamaStash upstream repository
    for: [cargo.toml]
    if:
      type: value
      path: package.repository
      exact: https://github.com/llamastash/llamastash

  - id: llamastash-loopback-proxy
    desc: LlamaStash loopback OpenAI-compatible proxy
    for: [rust, markdown, text]
    if:
      type: text
      regex: '127\.0\.0\.1:11435/v1|x-llamastash-served-by'

composite_rules:
  - id: llamastash-package-identity
    desc: Recognized LlamaStash local-LLM manager
    crit: notable
    conf: 0.99
    for: [cargo.toml]
    scope: archive
    all:
      - id: llamastash-package-name
      - id: llamastash-repository
