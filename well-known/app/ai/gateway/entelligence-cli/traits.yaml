defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: entelligence-branding
    desc: Entelligence router branding marker
    if:
      type: text
      regex: '(?i)\bEntelligence\b'

composite_rules:
  - id: router-settings-implementation
    desc: Entelligence Claude router settings implementation
    crit: notable
    conf: 0.98
    all:
      - id: entelligence-branding
      - id: micro-behaviors/os/env/vars/access::anthropic-router-settings
