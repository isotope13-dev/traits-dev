# JetBrains Grazie AI platform (Fleet AI gateway) libraries use ai/grazie
# Java/Kotlin namespaces. Its user-config model defines keyboard-shortcut
# data classes (Keystroke/Shortcut: key plus modifiers, first/second-stroke
# chords) whose keystroke vocabulary trips the built-in keystroke heuristic
# without capturing input.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: grazie-namespace-class
    desc: JetBrains Grazie AI platform class
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '^ai/grazie/'
