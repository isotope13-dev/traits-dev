# InBoost AI Proxy — local LLM gateway for coding assistants (inboost.pro).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: "@inboost-pro/inboost-ai-proxy npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@inboost-pro/inboost-ai-proxy"

  - id: scoped-npm-archive-name
    desc: "@inboost-pro/inboost-ai-proxy npm archive name"
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@inboost-pro/inboost-ai-proxy"

  - id: scoped-proxy-package-name
    desc: "@inboost-pro/inboost-proxy npm alias name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@inboost-pro/inboost-proxy"

  - id: scoped-proxy-npm-archive-name
    desc: "@inboost-pro/inboost-proxy npm archive"
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@inboost-pro/inboost-proxy"

  - id: package-name
    desc: inboost-ai-proxy npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: inboost-ai-proxy

  - id: alias-package-name
    desc: inboost-proxy npm alias package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: inboost-proxy

  - id: alias-archive-name
    desc: inboost-proxy npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: inboost-proxy

  - id: runtime-repository-marker
    desc: InBoost proxy runtime GitHub repository
    for: [javascript, typescript, markdown, package.json]
    if:
      type: text
      substr: github.com/inboost-dev/inboost-ai-proxy-runtime

  - id: localhost-gateway-endpoint
    desc: InBoost localhost gateway base URL literal
    for: [javascript, typescript]
    if:
      type: text
      substr: http://localhost:8080

  - id: proxy-launchd-label
    desc: InBoost proxy LaunchAgent label
    for: [javascript, typescript]
    if:
      type: text
      substr: pro.inboost.proxy

composite_rules:
  - id: archive-context
    desc: InBoost local inference proxy product context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: scoped-package-name
      - id: scoped-npm-archive-name
      - id: scoped-proxy-package-name
      - id: scoped-proxy-npm-archive-name
      - id: package-name
      - id: alias-package-name
      - id: runtime-repository-marker

  - id: proxy-launchd-context
    desc: InBoost documented LaunchAgent service installer
    crit: exception
    conf: 0.99
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: runtime-repository-marker
      - id: proxy-launchd-label
