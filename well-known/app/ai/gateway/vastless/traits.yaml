defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - shell
  - markdown
  crit: notable
  conf: 0.99
traits:
- id: scoped-package-name
  desc: '@npmc_5/vastless npm package name'
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@npmc_5/vastless'
- id: scoped-npm-archive-name
  desc: '@npmc_5/vastless npm archive name'
  for:
  - npm
  if:
    type: value
    path: npm.name
    exact: '@npmc_5/vastless'
- id: repository-marker
  desc: vastless GitHub repository
  if:
    type: text
    substr: github.com/pinion05/vastless
- id: description-marker
  desc: vastless package description
  for:
  - package.json
  - markdown
  if:
    type: text
    substr: Serverless OpenAI-compatible LLM on vast.ai spot GPUs
