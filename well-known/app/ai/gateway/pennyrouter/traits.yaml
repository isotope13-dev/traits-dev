defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - json
  - shell
  - text
  crit: notable
  conf: 0.95
traits:
- id: pennyrouter-github-repository
  desc: PennyRouter GitHub repository reference
  if:
    type: text
    regex: https?://github\.com/jduke99/pennyrouter(-cli)?\b
- id: pennyrouter-package-name
  desc: PennyRouter package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: pennyrouter
- id: pennyrouter-homepage
  desc: PennyRouter homepage URL reference
  if:
    type: text
    substr: https://pennyrouter.com
- id: pennyrouter-branding
  desc: PennyRouter branding marker
  if:
    type: text
    regex: (?i)\bPennyRouter\b
- id: pennyrouter-config-directory
  desc: PennyRouter configuration directory reference
  if:
    type: text
    regex: (?i)[~/\\]\.pennyrouter[/\\]
composite_rules:
- id: pennyrouter-archive-context
  desc: PennyRouter package archive context
  crit: exception
  for:
  - npm
  - zip
  - javascript
  - typescript
  - package.json
  - json
  - text
  scope: archive
  all:
  - id: pennyrouter-package-name
  any:
  - id: pennyrouter-github-repository
  - id: pennyrouter-homepage
  - id: pennyrouter-branding
  - id: pennyrouter-config-directory
