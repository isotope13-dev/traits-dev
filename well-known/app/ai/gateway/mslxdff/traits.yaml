defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - json
  - shell
  - text
  crit: notable
  conf: 0.95
traits:
- id: mslxdff-package-name
  desc: mslxdff package name in package.json
  for:
  - package.json
  if:
    type: value
    path: name
    exact: mslxdff
- id: mslxdff-cli-command
  desc: mslxdff CLI command usage
  if:
    type: text
    regex: (?i)\bmslxdff\s+(-showtoken|-status|-model|-provider)\b
- id: mslxdff-gateway-name
  desc: mslxdff gateway name reference
  if:
    type: text
    substr: mslxdff local gateway
- id: mslxdff-config-directory
  desc: mslxdff config directory path
  if:
    type: text
    regex: (?i)[~/\\]\.config[/\\]mslxdff\b
- id: mslxdff-env-prefix
  desc: mslxdff environment variable prefix
  if:
    type: text
    regex: \bMSLXDFF_[A-Z0-9_]+\b
