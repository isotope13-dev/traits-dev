defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, shell, text]
  crit: notable
  conf: 0.95

traits:
  - id: mslxdff-package-name
    desc: mslxdff package name in package.json
    for: [package.json]
    if:
      type: value
      path: name
      exact: mslxdff

  - id: mslxdff-cli-command
    desc: mslxdff CLI command usage
    if:
      type: text
      regex: '(?i)\bmslxdff\s+(-showtoken|-status|-model|-provider)\b'

  - id: mslxdff-gateway-name
    desc: mslxdff gateway name reference
    if:
      type: text
      substr: 'mslxdff local gateway'

  - id: mslxdff-config-directory
    desc: mslxdff config directory path
    if:
      type: text
      regex: '(?i)[~/\\]\.config[/\\]mslxdff\b'

  - id: mslxdff-env-prefix
    desc: mslxdff environment variable prefix
    if:
      type: text
      regex: '\bMSLXDFF_[A-Z0-9_]+\b'

composite_rules:
  - id: mslxdff-gateway-context
    desc: mslxdff AI gateway context
    crit: exception
    any:
      - id: mslxdff-package-name
      - id: mslxdff-cli-command
      - id: mslxdff-gateway-name
      - id: mslxdff-config-directory
      - id: mslxdff-env-prefix

  - id: mslxdff-archive-context
    desc: mslxdff package archive context
    crit: exception
    for: [npm, zip, javascript, typescript, package.json, json, text]
    scope: archive
    all:
      - id: mslxdff-package-name
    any:
      - id: mslxdff-cli-command
      - id: mslxdff-gateway-name
      - id: mslxdff-config-directory
      - id: mslxdff-env-prefix
