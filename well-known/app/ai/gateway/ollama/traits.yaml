defaults:
  platforms:
  - windows
  - unix
  # Windows installers bundle the runtime and are substantially larger than
  # source scripts; keep identity matching available for those vendor builds.
  size_max: 2000000000
traits:
- id: official-download-url
  desc: Official Ollama installer download URL
  crit: notable
  conf: 0.98
  for:
  - python
  - shell
  - text
  if:
    type: text
    regex: https://ollama\.com/(download/(OllamaSetup\.exe|Ollama-darwin\.zip)|install\.(sh|ps1))\b

- id: official-install-ps1-url
  desc: Official Ollama PowerShell installer URL
  crit: notable
  conf: 0.98
  for: [powershell, text, markdown]
  if:
    type: text
    substr: ollama.com/install.ps1

- id: ollama-api-tags-path
  desc: Ollama model-list API path
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: text
    substr: /api/tags

- id: ollama-windows-signer
  desc: Ollama Windows code-signing identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.signatures[0].subject
    substr: Ollama Inc.

- id: ollama-windows-go-module
  desc: Ollama Windows Go module identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.go.module.path
    exact: github.com/ollama/ollama

- id: ollama-windows-product
  desc: Ollama Windows PE product identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.version.product_name
    regex: '^Ollama[[:space:]]*$'

- id: ollama-rocm-runtime-member
  desc: Ollama ROCm runtime archive path
  crit: notable
  conf: 0.99
  for: [zip]
  size_min: 104857600
  if:
    type: value
    path: archive.members[*].path
    regex: '(?i)^lib/ollama/rocm/amdhip64_[0-9]+\.dll$'

- id: ollama-windows-exe-member
  desc: Ollama Windows executable archive member
  crit: notable
  conf: 0.99
  for: [zip]
  size_min: 104857600
  if:
    type: value
    path: archive.members[*].path
    regex: '(?i)^ollama\.exe$'

# The CUDA/Vulkan Windows runtime ships the ggml backends under lib/ollama/
# alongside the server executable; a top-level ollama.exe plus those members
# identifies the vendor runtime distribution at archive level, where PE
# signature and Go-module identity are not directly visible.
- id: ollama-windows-ggml-runtime-member
  desc: Ollama Windows ggml backend archive member
  crit: notable
  conf: 0.99
  for: [zip]
  size_min: 104857600
  if:
    type: value
    path: archive.members[*].path
    regex: '(?i)^lib/ollama/ggml-[a-z0-9-]+\.dll$'

- id: ollama-rocm-kernel-member
  desc: Ollama ROCm kernel archive path
  crit: notable
  conf: 0.99
  for: [zip]
  size_min: 104857600
  if:
    type: value
    path: archive.members[*].path
    regex: '(?i)^lib/ollama/rocm/rocblas/library/[^/]+\.(co|hsaco)$'

composite_rules:
- id: ollama-rocm-archive-layout
  desc: Ollama ROCm distribution layout
  crit: exception
  conf: 0.99
  for: [zip]
  all:
  - id: ollama-rocm-runtime-member
  - id: ollama-rocm-kernel-member

- id: ollama-windows-runtime-archive
  desc: Official Ollama Windows runtime archive layout
  crit: notable
  conf: 0.99
  for: [zip]
  all:
  - id: ollama-windows-exe-member
  - id: ollama-windows-ggml-runtime-member

# Ollama's signed Windows application bundles safety-policy code and a Qwen
# Code installer; keep its literal credential paths and installer URL as
# notable context while preserving suspicious matches for other publishers.
- id: ollama-windows-signed-context
  desc: Signed Ollama Windows application context
  crit: exception
  conf: 0.99
  all:
  - id: ollama-windows-signer
  any:
  - id: ollama-windows-go-module
  - id: ollama-windows-product
