# 9Router AI gateway, including scoped npm builds of the upstream CLI.
# The manifest name alone is easy to imitate. Require an implementation
# marker from its runtime installer in the same archive for package identity.
defaults:
  platforms: [unix, windows]
  conf: 0.98

traits:
  - id: package-name
    desc: 9Router npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@[a-z0-9._-]+/)?9router$'

  - id: runtime-package-marker
    desc: 9Router runtime installer package marker
    crit: baseline
    for: [javascript]
    if:
      type: text
      substr: 'name: "9router-runtime"'

composite_rules:
  - id: npm-gateway-package
    desc: 9Router AI gateway npm package
    crit: notable
    scope: archive
    for: [npm, tar, tar.gz, package.json, javascript]
    all:
      - id: package-name
      - id: runtime-package-marker
