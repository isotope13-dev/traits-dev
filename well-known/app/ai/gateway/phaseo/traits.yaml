defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - typescript
  - github-actions
  - markdown
  - json
  - text
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: Phaseo npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^(@phaseo/|phaseo-)
- id: upstream-repository
  desc: Phaseo upstream repository reference
  if:
    type: text
    regex: github\.com/phaseoteam/Phaseo(\.git)?([/\\s"'`?#]|$)
- id: phaseo-source-path
  desc: Phaseo source tree path
  if:
    type: path
    regex: (?i)(^|[\\/])phaseoteam[\\/]Phaseo
