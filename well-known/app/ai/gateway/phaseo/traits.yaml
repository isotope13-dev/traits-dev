# Phaseo is an open-source unified AI gateway and model intelligence platform.
# Its model discovery, provider credentials, and proxy integration are expected
# product behaviors.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, github-actions, markdown, json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Phaseo npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@phaseo/|phaseo-)'

  - id: upstream-repository
    desc: Phaseo upstream repository reference
    if:
      type: text
      regex: 'github\.com/phaseoteam/Phaseo(\.git)?([/\\s"''`?#]|$)'

  - id: phaseo-source-path
    desc: Phaseo source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])phaseoteam[\\/]Phaseo'

composite_rules:
  - id: benign-archive-context
    desc: Recognized Phaseo archive context
    crit: exception
    conf: 0.99
    scope: outer
    for: [package.json, javascript, typescript, github-actions, markdown, json, zip, text, scripts, source]
    all:
      - id: upstream-repository
    any:
      - id: package-name
      - id: phaseo-source-path
