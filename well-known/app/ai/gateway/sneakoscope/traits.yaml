defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, shell, text]
  crit: notable
  conf: 0.95

traits:
  - id: sneakoscope-package-name
    desc: Sneakoscope package name in package.json
    for: [package.json]
    if:
      type: value
      path: name
      exact: sneakoscope

  - id: sneakoscope-github-repository
    desc: Sneakoscope GitHub repository reference
    if:
      type: text
      regex: 'https?://github\.com/mandarange/Sneakoscope-Codex(\.git)?\b'

  - id: sneakoscope-branding
    desc: Sneakoscope branding marker
    if:
      type: text
      regex: '(?i)\bSneakoscope\b'

  - id: sneakoscope-config-directory
    desc: Sneakoscope configuration directory reference
    if:
      type: text
      regex: '(?i)[~/\\]\.sneakoscope[/\\]'

composite_rules:
  - id: sneakoscope-archive-context
    desc: Sneakoscope package archive context
    crit: exception
    for: [npm, zip, javascript, typescript, package.json, json, text]
    scope: archive
    all:
      - id: sneakoscope-package-name
    any:
      - id: sneakoscope-github-repository
      - id: sneakoscope-branding
      - id: sneakoscope-config-directory
