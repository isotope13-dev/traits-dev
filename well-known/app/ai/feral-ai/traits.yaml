# feral-ai — open-source AI agent with computer use and MCP.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name feral-ai
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*feral-ai\s*$'

  - id: feral-ai-github-repo
    desc: FERAL-AI/FERAL-AI GitHub repository URL
    if:
      type: text
      substr: FERAL-AI/FERAL-AI

  - id: feral-cli-module
    desc: FERAL CLI interactive terminal agent module
    for: [python]
    if:
      type: text
      substr: FERAL CLI — Interactive Terminal Agent

composite_rules:
  - id: feral-ai-package
    desc: FERAL open-source AI agent platform package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: feral-ai-github-repo
      - id: feral-cli-module
