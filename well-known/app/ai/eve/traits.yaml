# Vercel Eve — durable backend AI agent framework with precompiled adapters.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: eve-package-name
    desc: Vercel Eve npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'eve'

  - id: eve-vercel-repository
    desc: Vercel Eve upstream repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^(git\+)?https://github\.com/vercel/eve(\.git)?$'

  - id: eve-npm-archive-name
    desc: Eve npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: 'eve'

  - id: eve-compiled-vendor-bundle-path
    desc: Eve precompiled vendor dependency bundle path
    for: [javascript, typescript, scripts]
    if:
      type: path
      regex: '(^|/)compiled/'

composite_rules:
  - id: vercel-eve-agent-framework
    desc: Vercel Eve AI agent framework npm package
    crit: exception
    conf: 0.97
    scope: archive
    any:
      - id: eve-package-name
      - id: eve-vercel-repository
      - id: eve-npm-archive-name
