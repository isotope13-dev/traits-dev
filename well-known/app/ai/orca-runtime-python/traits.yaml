# orca-runtime-python — Apache-2.0 async runtime for Orca state machines
# (https://github.com/orca-lang/orca-lang-python). Bridge IPC uses argv-list
# subprocess.run; that capability stays in micro-behaviors (not suppressed).
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: orca-runtime-python wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: orca_runtime_python

  - id: package-metadata-name
    desc: orca-runtime-python PyPI Name field
    for: [text, markdown, pkginfo]
    if:
      type: text
      substr: 'Name: orca-runtime-python'

  - id: module-path
    desc: orca_runtime_python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)orca_runtime_python/'

  - id: bridge-protocol-marker
    desc: Orca cross-tool bridge protocol version marker
    for: [python]
    if:
      type: text
      substr: BRIDGE_PROTOCOL_VERSION

  - id: github-repo
    desc: orca-lang-python GitHub repository URL
    for: [text, markdown, python]
    if:
      type: text
      substr: github.com/orca-lang/orca-lang-python

composite_rules:
  - id: orca-runtime-python-package
    desc: Orca state-machine Python async runtime package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
      - id: bridge-protocol-marker
      - id: github-repo
    needs: 2
