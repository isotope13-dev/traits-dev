# kyber-chat — open-source personal AI assistant (kyber.chat).
defaults:
  platforms: [unix, windows]
  for: [python, javascript, whl, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 32
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: kyber-chat PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: kyber-chat

  - id: wheel-distribution
    desc: kyber_chat wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: kyber_chat

  - id: product-site
    desc: Kyber product site hostname
    if:
      type: text
      substr: kyber.chat

  - id: github-repo
    desc: cyph3rasi kyber GitHub repository
    if:
      type: text
      substr: github.com/cyph3rasi/kyber

  - id: dashboard-server-docstring
    desc: Kyber web dashboard server docstring
    for: [python]
    if:
      type: text
      substr: 'Kyber web dashboard server.'

  - id: gateway-pgrep-pattern
    desc: kyber gateway pgrep pattern
    for: [python]
    if:
      type: text
      substr: 'kyber gateway'

  - id: cli-help-banner
    desc: kyber personal AI assistant banner
    for: [python]
    if:
      type: text
      substr: 'kyber - Personal AI Assistant'

  - id: dashboard-token-key
    desc: kyber dashboard token storage key
    for: [javascript]
    if:
      type: text
      substr: kyber_dashboard_token

  - id: dashboard-ui-banner
    desc: Kyber Dashboard UI header comment
    for: [javascript]
    if:
      type: text
      substr: Kyber Dashboard

  - id: claude-oauth-comment
    desc: Kyber Claude OAuth reuse comment
    for: [python]
    if:
      type: text
      substr: Kyber does not run its own OAuth

  - id: claude-sync-comment
    desc: Kyber Claude Code sync comment
    for: [python]
    if:
      type: text
      substr: Claude Code and Kyber stay in sync

composite_rules:
  - id: kyber-chat-identity
    desc: Recognized Kyber personal AI assistant
    needs: 2
    any:
      - id: pkginfo-name
      - id: wheel-distribution
      - id: product-site
      - id: github-repo
      - id: dashboard-server-docstring
      - id: gateway-pgrep-pattern
      - id: cli-help-banner
      - id: dashboard-token-key
      - id: dashboard-ui-banner
      - id: claude-oauth-comment
      - id: claude-sync-comment
