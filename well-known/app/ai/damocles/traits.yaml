# Damocles — Aizenvolt Claude coding assistant VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest, vsix]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: damocles-vsix-name
    desc: Damocles VSIX archive name
    crit: notable
    for: [archives, vsix]
    if:
      type: path
      regex: '(?i)damocles.*\.vsix$'

  - id: damocles-package-name
    desc: Damocles extension package name
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: damocles

  - id: damocles-publisher
    desc: Aizenvolt VS Code publisher marker
    crit: notable
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: Aizenvolt

  - id: damocles-vsix-id
    desc: Damocles VSIX identity id
    crit: notable
    for: [vsix]
    if:
      type: value
      path: vsix.identity.id
      exact: damocles

  - id: damocles-vsix-publisher
    desc: Aizenvolt VSIX publisher identity
    crit: notable
    for: [vsix]
    if:
      type: value
      path: vsix.identity.publisher
      exact: Aizenvolt

  - id: damocles-browser-config
    desc: Damocles integrated browser config namespace
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: damocles.browser

  - id: damocles-browser-service-marker
    desc: Damocles browser service class marker
    crit: notable
    for: [javascript, archives]
    if:
      type: text
      substr: DamoclesBrowser

  - id: damocles-source-repository
    desc: Damocles official GitHub repository
    crit: notable
    for: [package.json, json]
    if:
      type: value
      path: repository.url
      substr: github.com/AizenvoltPrime/damocles

  - id: damocles-source-repository-text
    desc: Damocles GitHub repository string reference
    crit: notable
    for: [javascript, markdown]
    if:
      type: text
      substr: github.com/AizenvoltPrime/damocles

composite_rules:
  - id: damocles-vscode-extension
    desc: Damocles Claude coding assistant VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives, vsix, package.json]
    all:
      - id: damocles-publisher
    any:
      - id: damocles-vsix-name
      - id: damocles-package-name
      - id: damocles-source-repository

  - id: damocles-cdp-browser-context
    desc: Damocles integrated CDP browser automation context
    crit: exception
    conf: 0.98
    for: [javascript, archives, vsix]
    all:
      - id: damocles-browser-config
    any:
      - id: damocles-publisher
      - id: damocles-package-name
      - id: damocles-source-repository
      - id: damocles-browser-service-marker
