# ai-agent-gateway — generic AI agent HTTP gateway with MCP tools.
defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, archives, markdown, json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: package-distribution-name
    desc: ai-agent-gateway Python distribution name
    for: [json, markdown]
    if:
      type: text
      substr: 'Name: ai-agent-gateway'

  - id: agent-gateway-module-path
    desc: agent_gateway Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)agent_gateway/'

  - id: create-agent-api
    desc: ai-agent-gateway create_agent in agent_gateway
    for: [python]
    if:
      type: text
      regex: '(?m)^def create_agent\('
    unless:
      - id: well-known/app/data/mainsequence::mainsequence-module-path

  - id: create-gateway-app-api
    desc: ai-agent-gateway create_gateway_app symbol
    for: [python]
    if:
      type: text
      regex: '(?m)^def create_gateway_app\('
    unless:
      - id: well-known/app/data/mainsequence::mainsequence-module-path

  - id: sdk-runner-module
    desc: agent_gateway sdk_runner module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)agent_gateway/sdk_runner\.py'

composite_rules:
  - id: ai-agent-gateway-python-package
    desc: ai-agent-gateway MCP agent HTTP gateway
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-distribution-name
      - id: agent-gateway-module-path
