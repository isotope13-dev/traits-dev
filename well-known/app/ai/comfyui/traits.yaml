# The Windows portable distribution is a normal application bundle: its
# embedded Python, GPU runtimes, and many native extensions are expected.
defaults:
  platforms: [windows]
  for: [7z, zip]

traits:
  - id: comfyui-portable-archive-layout
    desc: ComfyUI Windows portable archive layout
    crit: notable
    conf: 0.99
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]'

  - id: comfyui-project-manifest-member
    desc: ComfyUI project manifest archive member
    crit: notable
    conf: 0.99
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]ComfyUI[\\/]pyproject\.toml$'

  - id: comfyui-intel-launcher-member
    desc: ComfyUI Intel GPU launcher archive member
    crit: notable
    conf: 0.99
    size_min: 1000000
    size_max: 10000000000
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ComfyUI_windows_portable[\\/]run_intel_gpu\.bat$'

composite_rules:
  - id: comfyui-portable-archive-context
    desc: Identified ComfyUI Windows portable distribution
    crit: exception
    conf: 0.99
    all:
      - id: comfyui-portable-archive-layout
      - id: comfyui-project-manifest-member
      - id: comfyui-intel-launcher-member
