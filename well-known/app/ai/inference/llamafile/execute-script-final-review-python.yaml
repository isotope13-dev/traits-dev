defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

traits:
  - id: official-huggingface-model-url
    desc: Official llamafile HuggingFace model URL
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      substr: "huggingface.co/jartine/Mistral-7B-Instruct-v0.2-llamafile/"

composite_rules:
  - id: official-model-runner-clues
    desc: Official llamafile model runner clues
    crit: notable
    conf: 0.95
    all:
      - id: well-known/app/development/dev-tool-downloads::official-llamafile-github-release
      - id: well-known/app/ai/inference/llamafile::official-huggingface-model-url
      - id: metadata/lang/source/syntax/argument::python-server-option
