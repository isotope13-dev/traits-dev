# Pi Studio — local desktop GUI for the Pi coding agent (Tauri).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Pi Studio npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pi-studio

  - id: upstream-repository
    desc: Pi Studio upstream repository
    for: [package.json, markdown]
    if:
      type: text
      regex: 'github\.com/deflating/pi-studio([./\s"''`?#]|$)'

  - id: fetch-pi-script-marker
    desc: Pi Studio embedded pi fetch script reference
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: fetch-pi-binary.js

  - id: pi-mono-release-endpoint
    desc: Pi Studio locked pi-mono GitHub release URL
    for: [javascript, typescript]
    if:
      type: text
      substr: earendil-works/pi-mono/releases

  - id: embedded-pi-resource-path
    desc: Pi Studio embedded pi runtime resource directory
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: src-tauri/resources/pi

composite_rules:
  - id: pi-studio-archive-context
    desc: Recognized Pi Studio desktop app context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: upstream-repository

  - id: pi-studio-fetch-pi-context
    desc: Recognized Pi Studio pi-mono fetch build script
    crit: exception
    conf: 0.99
    all:
      - id: pi-mono-release-endpoint
      - id: embedded-pi-resource-path
