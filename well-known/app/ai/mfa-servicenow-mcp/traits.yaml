defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl]

traits:
  - id: package-name
    desc: MFA ServiceNow MCP Python package name
    crit: notable
    conf: 1.0
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: mfa-servicenow-mcp

  - id: service-name-marker
    desc: MFA ServiceNow MCP source marker
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      regex: 'mfa-servicenow-mcp|jshsakura/mfa-servicenow-mcp'

composite_rules:
  - id: mfa-servicenow-mcp-package
    desc: Recognized MFA ServiceNow MCP package
    crit: notable
    conf: 1.0
    any:
      - id: package-name
      - id: service-name-marker
