# TextGen is a legitimate local-LLM desktop application published by
# oobabooga.  Its Windows portable distributions intentionally bundle an
# Electron launcher, a private Python runtime, and native llama.cpp/CUDA
# dependencies inside a ZIP archive.
defaults:
  platforms: [windows]
  for: [zip, 7z]
  crit: notable
  conf: 0.99

traits:
  - id: textgen-portable-archive-basename
    desc: TextGen portable archive basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)textgen-portable-[a-z0-9]+'

  - id: textgen-portable-launcher-member
    desc: TextGen portable launcher archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^textgen-[^/\\]{1,48}[/\\]textgen\.bat$'

  - id: textgen-portable-electron-member
    desc: TextGen portable Electron executable member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^textgen-[^/\\]{1,48}[/\\]app[/\\]electron[/\\]electron\.exe$'

  - id: textgen-portable-python-member
    desc: TextGen portable Python runtime member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^textgen-[^/\\]{1,48}[/\\]app[/\\]portable_env[/\\]python\.exe$'

  - id: textgen-portable-package-member
    desc: TextGen portable application manifest member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^textgen-[^/\\]{1,48}[/\\]app[/\\]package\.json$'

composite_rules:
  - id: textgen-portable-archive-layout
    desc: TextGen portable application archive layout
    all:
      - id: textgen-portable-archive-basename
      - id: textgen-portable-launcher-member
      - id: textgen-portable-electron-member
      - id: textgen-portable-python-member

  - id: textgen-portable-archive-context
    desc: Identified TextGen portable Windows distribution
    crit: exception
    scope: outer
    all:
      - id: textgen-portable-archive-layout
      - id: textgen-portable-package-member
