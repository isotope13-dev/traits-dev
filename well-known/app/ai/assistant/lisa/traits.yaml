# LISA (Local Intelligent System Agent) package identity and documented risk
# controls. The options below are legitimate product behavior, but they matter
# during supply-chain triage because they govern remotely reachable local tools.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown]
  crit: notable
  conf: 0.96

traits:
  - id: package-name
    desc: Declares the @oratis/lisa package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@oratis/lisa'

  - id: repository-url
    desc: References the official Oratis LISA repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/oratis/LISA

  - id: cli-entrypoint
    desc: Declares the LISA command-line entry point
    for: [package.json]
    if:
      type: value
      path: bin.lisa
      exact: dist/cli.js

  - id: remote-full-tools-option
    desc: Remote channel unrestricted-tools option
    for: [javascript, typescript]
    if:
      type: text
      substr: unsafeFullTools

  - id: remote-full-tools-warning
    desc: Warns remote messages get the full toolset
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)remote messages.{0,80}(full|unrestricted) toolset'

  - id: automatic-approval-value
    desc: Configures automatic tool-call approval
    for: [javascript, typescript]
    if:
      type: text
      regex: 'approval\s*:\s*["'']auto["'']'

  - id: approval-mode-list
    desc: Defines automatic and interactive approval modes
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']auto["'']\s*,\s*["'']ask["'']\s*,\s*["'']ask-mutating["'']'

composite_rules:
  - id: lisa-package
    desc: Oratis LISA local AI agent package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
    any:
      - id: repository-url
      - id: cli-entrypoint

  - id: remote-unrestricted-tools
    desc: Remote channel can enable unrestricted local tools
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: remote-full-tools-option
      - id: remote-full-tools-warning

  - id: automatic-tool-approval-default
    desc: LISA defaults tool calls to automatic approval
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: automatic-approval-value
      - id: approval-mode-list
