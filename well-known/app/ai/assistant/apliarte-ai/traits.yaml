# apliarte-ai — local LM Studio/Ollama chat VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, vsix, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: apliarte-ai extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: apliarte-ai

  - id: publisher
    desc: ApliArte VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: apliarte

  - id: github-repo
    desc: erbolamm/apliarte-ai GitHub repository
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: erbolamm/apliarte-ai

  - id: local-ai-endpoints
    desc: Local LM Studio and Ollama endpoint settings
    for: [package.json, json]
    if:
      type: text
      substr: apliarteAi.lmstudioEndpoint

  - id: transformers-runtime-install
    desc: Installs Hugging Face transformers deps
    for: [javascript]
    if:
      type: text
      regex: 'execFile\("npm",\s*\["install","--production"\]'

composite_rules:
  - id: apliarte-ai-extension
    desc: ApliArte AI local chat VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: github-repo
      - id: local-ai-endpoints

  - id: apliarte-ai-local-setup-context
    desc: ApliArte AI installs local ML deps and probes host hardware
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: apliarte-ai-extension
    any:
      - id: transformers-runtime-install
      - id: objectives/discovery/system/hardware/sysctl::sysctl-cpu-brand-dup
