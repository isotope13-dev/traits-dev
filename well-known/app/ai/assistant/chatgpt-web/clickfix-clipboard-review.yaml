defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: public-canvas-share-url
    desc: ChatGPT Canvas or share URL
    crit: notable
    conf: 0.94
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?i)https?://chatgpt\.com/(canvas|share)/'
