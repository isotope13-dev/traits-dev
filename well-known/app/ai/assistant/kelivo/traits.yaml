# Kelivo (github.com/Chevey339/kelivo) — open-source cross-platform LLM client
# for Android, iOS, macOS, Windows, and Linux.
defaults:
  platforms:
  - android
  - unix
  - windows
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: kelivo-source-package
    desc: Kelivo Android package namespace
    for:
    - java
    - kotlin
    if:
      type: text
      regex: 'package\s+com\.psyche\.kelivo\b'

  - id: kelivo-repository-marker
    desc: Kelivo upstream repository marker
    for:
    - markdown
    - text
    - json
    - kotlin
    if:
      type: text
      substr: Chevey339/kelivo

  - id: kelivo-archive-member
    desc: Kelivo source archive member path
    for:
    - zip
    - tar
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)kelivo[-_][0-9]'
