# LightClaw is a self-hosted AI assistant with channel integrations.  Its
# Feishu bot creator deliberately adapts a browser session so the QR login
# page renders in automation; retain one precise webdriver signal while
# suppressing duplicate anti-bot umbrella findings for this reviewed context.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: LightClaw Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: lightclaw

  - id: package-name
    desc: LightClaw package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: lightclaw

  - id: project-repository
    desc: LightClaw upstream repository marker
    for: [pkginfo]
    if:
      type: text
      substr: git.woa.com/orcakit/finnie

  - id: feishu-bot-creator-module
    desc: LightClaw Feishu bot creator module
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      exact: lightclaw/app/channels/feishu/bot_creator.py

composite_rules:
  - id: feishu-browser-automation-context
    desc: Recognized LightClaw Feishu bot automation context
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: project-repository
      - id: feishu-bot-creator-module
