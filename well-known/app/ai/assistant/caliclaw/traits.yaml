# caliclaw — personal Telegram AI assistant CLI (califlaw/caliclaw).
defaults:
  platforms: [unix]
  for: [python, pkginfo, markdown, text, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: caliclaw PyPI package identity
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: caliclaw

  - id: wheel-distribution
    desc: caliclaw wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: caliclaw

  - id: freedom-mode-flag
    desc: caliclaw FREEDOM_MODE opt-in guardrail toggle
    for: [python]
    if:
      type: text
      substr: FREEDOM_MODE=

  - id: product-summary
    desc: caliclaw Telegram AI assistant product summary
    for: [pkginfo, markdown, text]
    if:
      type: text
      regex: '(?i)caliclaw.{0,120}telegram.{0,120}(personal AI|assistant)'

composite_rules:
  - id: caliclaw-agent-cli-context
    desc: caliclaw Telegram personal AI assistant CLI
    crit: exception
    conf: 0.99
    for: [whl, python]
    scope: archive
    any:
      - id: package-name
      - id: wheel-distribution
      - id: product-summary
