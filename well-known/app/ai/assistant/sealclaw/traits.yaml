# SealClaw is an AgentScope personal assistant that runs skills locally.
# Browser cookie reads in sealclaw-auth and commerce skills are for the
# operator's own platform login — not credential theft.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown, text, whl]
  crit: notable
  conf: 0.99

traits:
  - id: pypi-package-name
    desc: sealclaw PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: sealclaw

  - id: project-summary
    desc: SealClaw personal assistant summary
    for: [pkginfo]
    if:
      type: value
      path: summary
      substr: personal assistant

  - id: github-repo
    desc: SealClaw GitHub repository URL
    if:
      type: text
      regex: github\.com/agentscope-ai/SealClaw

  - id: cdp-cookie-extract-skill
    desc: CDP browser cookie extraction skill
    for: [python]
    if:
      type: text
      substr: cdp_extract_cookies

  - id: sealclaw-auth-path
    desc: SealClaw auth skill module path
    for: [python]
    if:
      type: path
      regex: '(?i)sealclaw_auth'

composite_rules:
  - id: framework-identity
    desc: SealClaw personal assistant framework
    crit: notable
    conf: 0.99
    any:
      - id: pypi-package-name
      - id: github-repo
      - id: project-summary

  - id: local-browser-cookie-auth-context
    desc: Local browser cookie auth for platform login skills
    crit: exception
    conf: 0.98
    scope: outer
    all:
      - id: framework-identity
    any:
      - id: cdp-cookie-extract-skill
      - id: sealclaw-auth-path
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-import
