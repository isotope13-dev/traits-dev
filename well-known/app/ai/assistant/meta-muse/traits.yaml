# Meta Muse macOS configuration identity. The preference marker is neutral;
# credential-access objectives combine it with endpoint-rewrite and listener
# behavior when inferring abuse.
defaults:
  crit: notable
  conf: 0.99
  platforms: [macos]
  for: [scripts, binaries]
  size_max: 200000000

traits:
  - id: dictation-endpoint-preference
    desc: Meta Muse dictation endpoint preference
    if:
      type: text
      word: endo_voyager_dictation_endpoint
