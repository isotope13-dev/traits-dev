defaults:
  platforms: [windows]
  for: [whl]
  crit: notable
  conf: 0.98
traits:
  - id: myra-wheel-distribution
    desc: MYRA AI Assistant wheel distribution identity
    if:
      type: value
      path: whl.filename.name_prefix
      exact: myra_ai_assistant

  - id: myra-benign-release-version
    desc: MYRA AI Assistant benign release version
    if:
      type: value
      path: whl.filename.version
      exact: "0.3.2"

composite_rules:
  - id: myra-benign-wheel-context
    desc: MYRA AI Assistant known release context
    crit: exception
    conf: 0.98
    scope: archive
    all:
      - id: myra-wheel-distribution
      - id: myra-benign-release-version
