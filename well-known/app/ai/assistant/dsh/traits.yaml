# DSH (DeepSeek Hub) — Web platform and plugin ecosystem for DeepSeek assistants.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: dsh-plugin-package-name
    desc: DSH plugin npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: dsh-long-plugins

  - id: dsh-plugin-manifest
    desc: DSH plugin configuration file
    if:
      type: path
      basename: true
      exact: dsh.plugin.json

  - id: dsh-restart-env-marker
    desc: DSH restart environment variable marker
    for: [javascript, typescript]
    if:
      type: text
      word: DSH_RESTART_CMD

  - id: dsh-web-start-script-reference
    desc: DSH web start script reference
    for: [javascript, typescript]
    if:
      type: text
      substr: start-dsh.cmd

composite_rules:
  - id: dsh-restart-context
    desc: DSH web restart helper context
    crit: exception
    conf: 0.99
    any:
      - id: dsh-restart-env-marker
      - id: dsh-web-start-script-reference
      - id: dsh-plugin-manifest
      - id: dsh-plugin-package-name
