# Tangu Computer Use (@forsion/tangu-computer-use) lets an agent observe and
# control desktop apps.  Its Windows bridge also runs a "Computer History"
# recorder for the Forsion desktop: low-level mouse and keyboard hooks plus
# foreground-window WinEvents feed a user-only named pipe, and the hook thread
# forwards modifier-key state, not typed text.  Its source states that
# contract by name, so the hook and window-title APIs are the recorder's
# subject matter rather than a keylogger.
defaults:
  platforms: [windows]
  for: [rust]
  crit: notable
  conf: 0.95

traits:
  - id: computer-history-contract-reference
    desc: Tangu Computer History event contract reference
    if:
      type: text
      substr: computerHistory.ts

  - id: record-subscribe-pipe-command
    desc: Tangu recorder pipe subscription command
    if:
      type: text
      substr: recordSubscribe

composite_rules:
  - id: tangu-computer-history-recorder
    desc: Tangu Computer History activity recorder source
    crit: exception
    all:
      - id: computer-history-contract-reference
      - id: record-subscribe-pipe-command
