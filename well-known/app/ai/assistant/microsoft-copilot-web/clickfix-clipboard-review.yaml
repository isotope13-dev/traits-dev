defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: public-page-share-url
    desc: Microsoft Copilot public page URL
    crit: notable
    conf: 0.94
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?i)https?://copilot\.microsoft\.com/(pages|share)/'
