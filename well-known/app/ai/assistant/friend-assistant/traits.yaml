# friend-assistant — self-hosted personal AI assistant (masterdeepak15/friend).
# The package name friend-assistant vs repo friend is intentional, not
# clone-and-rename.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Friend Assistant npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: "friend-assistant"

  - id: npm-package-name
    desc: Friend Assistant npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "friend-assistant"

  - id: repository-url
    desc: Friend Assistant official GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(?i)(git\+)?https://github\.com/masterdeepak15/friend(\.git)?$'

  - id: npm-repository-url
    desc: Friend Assistant npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(?i)(git\+)?https://github\.com/masterdeepak15/friend(\.git)?$'

composite_rules:
  - id: official-package-identity
    desc: Official Friend Assistant package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-repository-identity
    desc: Official Friend Assistant repository identity
    crit: exception
    any:
      - id: repository-url
      - id: npm-repository-url

  - id: official-package-repository-pair
    desc: Official Friend Assistant package-repository pair
    crit: exception
    all:
      - id: official-package-identity
      - id: official-repository-identity
