# Official Anthropic Claude Desktop Linux package layout (deb under
# /usr/lib/claude-desktop and the ion-dist web UI bundles). Bundled
# Electron/JS assets mention Google/Microsoft login and Graph APIs as
# product integrations, not phishing kits.
defaults:
  platforms: [unix, windows]
  for: [javascript, asar, deb, archives, json, data, scripts, source]
  crit: notable
  conf: 0.99
  size_max: 800000000

traits:
  - id: linux-lib-install-path
    desc: Official Claude Desktop Linux library path
    if:
      type: path
      regex: 'lib[\\/]claude-desktop'

  - id: ion-dist-asset-path
    desc: Claude Desktop ion-dist frontend asset path
    for: [javascript]
    if:
      type: path
      regex: 'ion-dist[\\/]assets'

  - id: official-deb-basename
    desc: Official Claude Desktop Debian package basename
    platforms: [linux]
    for: [deb]
    if:
      type: path
      basename: true
      regex: '^claude-desktop_[0-9]'

  - id: bundled-office365-mcp-path
    desc: Claude Desktop bundled Office 365 MCP path
    if:
      type: path
      regex: 'office365-mcp'

composite_rules:
  - id: official-package-context
    desc: Official Claude Desktop package context
    crit: exception
    conf: 0.99
    any:
      - id: linux-lib-install-path
      - id: ion-dist-asset-path
      - id: official-deb-basename
      - id: bundled-office365-mcp-path
