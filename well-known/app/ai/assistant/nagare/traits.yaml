# smtdfc/nagare — Wails desktop UI for an LLM agent.
defaults:
  platforms: [unix, windows]
  for: [package.json, typescript, go, zip]
  crit: notable
  conf: 0.99

traits:
  - id: ui-package-name
    desc: Nagare agent main UI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@nagare-agent/main-ui'

  - id: github-repo
    desc: Nagare GitHub repository path
    if:
      type: text
      substr: github.com/smtdfc/nagare
