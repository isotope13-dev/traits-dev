# Chat with Work Desktop (github.com/crmne/chatwithwork-desktop) — open-source
# desktop application and local background agent for Chat with Work.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, shell, rust, markdown, text, json]
  crit: notable
  conf: 0.98
  size_max: 250000000

traits:
  - id: chatwithwork-git-repo
    desc: Chat with Work Desktop repository URL
    if:
      type: text
      substr: github.com/crmne/chatwithwork-desktop

  - id: chatwithwork-service-label
    desc: Chat with Work Desktop service label
    if:
      type: text
      regex: '\bcom\.chatwithwork\.desktop\b'

  - id: chatwithwork-package-path
    desc: Chat with Work Desktop path component
    if:
      type: path
      regex: 'chatwithwork-desktop'

  - id: chatwithwork-website
    desc: Chat with Work website reference
    if:
      type: text
      substr: chatwithwork.com
