# Alma is a desktop AI assistant. Its Windows Go server runs a LAN mobile-relay
# step that adds one inbound firewall allow rule through a UAC-elevated,
# window-hidden PowerShell. That launcher is the vendor's own, so it is only
# context for the policy-override profile when both the Alma server module and
# the launcher's decline marker are present in the same PE.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: alma-server-go-module
    desc: Alma server Go module path
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/yetone/alma/server-go

  - id: alma-uac-decline-marker
    desc: Alma firewall launcher UAC decline marker
    if:
      type: text
      substr: ALMA_UAC_DECLINED

composite_rules:
  - id: alma-mobile-relay-firewall-context
    desc: Alma LAN relay firewall elevation launcher context
    crit: exception
    conf: 0.98
    all:
      - id: alma-server-go-module
      - id: alma-uac-decline-marker
