# Mastra AI agent framework (@mastra/* on npm).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: mastra-core-package-name
    desc: Mastra core npm package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@mastra/core"

  - id: mastra-github-repository
    desc: Mastra GitHub repository URL
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/mastra-ai/mastra

  - id: mastra-homepage
    desc: Mastra project homepage URL
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: homepage
      substr: mastra.ai

composite_rules:
  - id: mastra-core-package
    desc: Mastra AI agent framework core package
    crit: notable
    conf: 0.99
    any:
      - id: mastra-core-package-name
      - id: mastra-github-repository
      - id: mastra-homepage
