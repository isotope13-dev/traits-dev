# AI Box — internal VS Code extension for Cursor/Qoder usage analytics,
# SSO login, skill management, and chat history tooling.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: ai-box-command-namespace
    desc: AI Box VS Code command namespace
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: ai-box.openPanel

  - id: cursor-session-reader
    desc: AI Box Cursor session reader
    for: [javascript, typescript]
    if:
      type: text
      substr: getCursorSessionInfo

  - id: cursor-login-manager
    desc: AI Box Cursor login manager
    for: [javascript, typescript]
    if:
      type: text
      substr: CursorLoginManager

  - id: preview-beta-package-name
    desc: AI Box preview-beta VS Code package name
    for: [package.json, javascript]
    if:
      type: text
      substr: '"name": "preview-beta"'

composite_rules:
  - id: ai-box-extension-context
    desc: Recognized AI Box Cursor analytics extension
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: ai-box-command-namespace
    any:
      - id: cursor-session-reader
      - id: cursor-login-manager
      - id: preview-beta-package-name
