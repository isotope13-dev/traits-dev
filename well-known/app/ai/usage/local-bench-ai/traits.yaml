defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Local Bench AI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: local-bench-ai

  - id: brand-marker
    desc: Local Bench AI benchmark marker
    for: [pkginfo, markdown, text]
    if:
      type: text
      substr: local-bench.ai

  - id: repository-description
    desc: Local Bench AI benchmark description
    for: [pkginfo, markdown, text]
    if:
      type: text
      regex: '(?i)benchmark runner.{0,160}(local AI|leaderboard|llama\.cpp)'

  - id: benchmark-cli-marker
    desc: Local Bench AI CLI marker
    for: [python]
    if:
      type: text
      regex: 'localbench\.(cli|scoring|serving)'

  - id: wheel-distribution
    desc: Local Bench AI wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: localbench

composite_rules:
  - id: benchmark-runner-context
    desc: Local Bench AI benchmark runner package
    crit: exception
    conf: 0.99
    for: [whl, python-sdist, pkginfo]
    scope: archive
    any:
      - id: package-name
      - id: brand-marker
      - id: repository-description
      - id: wheel-distribution
