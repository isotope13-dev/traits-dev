defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - npm
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: tokenburnmarket package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: tokenburnmarket
- id: upstream-repository
  desc: tokenburnmarket repository
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: (?i)github\.com/formidable-oss/tokenburnmarket(\.git)?$
- id: launchd-daemon-label
  desc: tokenburnmarket LaunchAgent label
  for:
  - javascript
  - markdown
  if:
    type: text
    substr: com.tokenburnmarket.daemon
- id: systemd-daemon-unit
  desc: tokenburnmarket systemd service unit
  for:
  - javascript
  - markdown
  if:
    type: text
    substr: tokenburnmarket.service
- id: windows-daemon-task
  desc: tokenburnmarket Windows scheduled task name
  for:
  - javascript
  - markdown
  if:
    type: text
    substr: tokenburnmarket scheduled task
