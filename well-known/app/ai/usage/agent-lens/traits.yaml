# Agent Lens (@swestash/agent-lens) -- a local-only tool that passively
# collects, browses and analyzes Claude Code session traces. Its documented
# `agent-lens service install` registers the collector and the loopback web UI
# (127.0.0.1:4477) as systemd, launchd or Windows Task Scheduler services; the
# README states nothing leaves the machine. Installing an OS service on all
# three platforms is that documented lifecycle, not an implant.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: "@swestash/agent-lens package name"
    if:
      type: value
      path: name
      exact: '@swestash/agent-lens'

  - id: cli-binary-entrypoint
    desc: agent-lens CLI binary entrypoint
    if:
      type: value
      path: bin.agent-lens
      exact: ./dist/agent-lens.js

  - id: collector-systemd-unit
    desc: agent-lens collector systemd unit name
    for: [javascript, data]
    if:
      type: text
      substr: agent-lens-collect.service

  - id: server-systemd-unit
    desc: agent-lens server systemd unit name
    for: [javascript, data]
    if:
      type: text
      substr: agent-lens-server.service

composite_rules:
  - id: official-package
    desc: Official Agent Lens trace analyzer npm package
    crit: exception
    conf: 0.99
    for: [package.json, javascript, npm, data]
    scope: outer
    any:
      - id: npm-package-name
      - id: cli-binary-entrypoint
      - id: collector-systemd-unit
      - id: server-systemd-unit
