defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.99
traits:
- id: npm-package-name
  desc: '@swestash/agent-lens package name'
  if:
    type: value
    path: name
    exact: '@swestash/agent-lens'
- id: cli-binary-entrypoint
  desc: agent-lens CLI binary entrypoint
  if:
    type: value
    path: bin.agent-lens
    exact: ./dist/agent-lens.js
- id: collector-systemd-unit
  desc: agent-lens collector systemd unit name
  for:
  - javascript
  - data
  if:
    type: text
    substr: agent-lens-collect.service
- id: server-systemd-unit
  desc: agent-lens server systemd unit name
  for:
  - javascript
  - data
  if:
    type: text
    substr: agent-lens-server.service
