# daily-report-collector — PyPI agent that watches local AI-coding-tool
# memory/transcript files and syncs them to a user-configured daily-report
# server (default loopback). Dual-use collection, not a hidden stealer.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 2000000

traits:
  - id: pypi-package-name
    desc: daily-report-collector PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: daily-report-collector

  - id: wheel-distribution
    desc: daily_report_collector wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: daily_report_collector

  - id: github-repo
    desc: ddong8 daily_report GitHub repository
    if:
      type: text
      substr: github.com/ddong8/daily_report

  - id: data-directory
    desc: daily-report collector data directory
    for: [python]
    if:
      type: text
      substr: '.daily-report'

  - id: launchd-label
    desc: dailyreport collector LaunchAgent label
    for: [python]
    if:
      type: text
      substr: com.dailyreport.collector

  - id: setup-banner
    desc: Daily Report Collector setup banner
    for: [python]
    if:
      type: text
      substr: 'AI Daily Report Collector Setup'

  - id: package-name-const
    desc: daily-report-collector package name constant
    for: [python]
    if:
      type: text
      substr: 'PACKAGE_NAME = "daily-report-collector"'

  - id: console-entrypoint
    desc: daily-report-collector console script entry
    for: [text]
    if:
      type: text
      regex: '(?m)^daily-report-collector\s*=\s*collector\.cli:cli_main\s*$'

composite_rules:
  - id: package-identity
    desc: Recognized daily-report-collector product identity
    any:
      - id: pypi-package-name
      - id: wheel-distribution
      - id: github-repo
      - id: data-directory
      - id: launchd-label
      - id: setup-banner
      - id: package-name-const
      - id: console-entrypoint
