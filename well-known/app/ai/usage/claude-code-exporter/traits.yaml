# myoontyee/claude-code-exporter — exports Claude/Codex/Cursor chats to Markdown.
defaults:
  platforms: [windows, unix]
  for: [package.json, vsix-manifest, json, javascript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: claude-code-exporter extension package name
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: name
      exact: claude-code-exporter

  - id: publisher
    desc: myoontyee VS Code extension publisher
    for: [package.json, vsix-manifest, json]
    if:
      type: value
      path: publisher
      exact: myoontyee

  - id: github-repo
    desc: Myoontyee/claude-code-exporter GitHub repository
    for: [package.json, json, javascript, markdown]
    if:
      type: text
      substr: Myoontyee/claude-code-exporter

  - id: export-command-namespace
    desc: Claude Code Exporter command namespace
    for: [package.json, javascript]
    if:
      type: text
      substr: claudeCodeExporter

  - id: cursor-history-export-path
    desc: Cursor conversation export directory marker
    for: [package.json, javascript, markdown]
    if:
      type: text
      substr: .cursor-history

composite_rules:
  - id: claude-code-exporter-extension
    desc: Claude Code Exporter VS Code extension
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: publisher
    any:
      - id: github-repo
      - id: export-command-namespace

  - id: claude-code-exporter-cursor-context
    desc: Claude Code Exporter reads Cursor composer state for export
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: claude-code-exporter-extension
      - id: cursor-history-export-path
      - id: objectives/credential-access/dev-tools/cursor::cursor-state-vscdb-path
