# Claude Usage Companion daemon (@rehberodhano/claude-usage-companion-daemon, RehberOdhano/headroom)
# Read-only local companion daemon for Claude Usage Companion browser extension.
# Provides CLI/session usage attribution, token tracking, and autostart background service.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: claude-usage-companion-daemon package
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@rehberodhano/claude-usage-companion-daemon'

  - id: upstream-repository
    desc: claude-usage-companion repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/RehberOdhano/headroom(\.git)?$'

  - id: dist-archive-path
    desc: claude-usage-companion release archive
    if:
      type: path
      regex: '(?i)claude-usage-companion-daemon-[0-9].*\.tgz'

  - id: service-label-literal
    desc: claude-usage-companion service label
    for: [javascript, markdown]
    if:
      type: text
      substr: 'com.headroom.claude-usage-daemon'

  - id: daemon-cli-name
    desc: claude-usage-daemon CLI command
    for: [javascript, markdown, package.json]
    if:
      type: text
      substr: 'claude-usage-daemon'

composite_rules:
  - id: official-package
    desc: Official claude-usage-companion-daemon package
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: dist-archive-path
      - id: service-label-literal
