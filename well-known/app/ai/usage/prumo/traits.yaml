# Prumo (@henri-ralmeida/prumo) — PO First task orchestration for Claude
# Code, Kiro, Codex and DSH. Global install registers harness skills and a
# localhost dashboard with documented launchd/schtasks/systemd lifecycle.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: "@henri-ralmeida/prumo package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@henri-ralmeida/prumo'

  - id: launchd-dashboard-label
    desc: Prumo dashboard LaunchAgent label
    for: [javascript, markdown]
    if:
      type: text
      substr: dev.prumo.dashboard

  - id: systemd-dashboard-unit
    desc: Prumo dashboard systemd user unit
    for: [javascript, markdown]
    if:
      type: text
      substr: prumo-dashboard.service

composite_rules:
  - id: official-package
    desc: Official Prumo orchestration npm package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: npm-package-name
      - id: launchd-dashboard-label
      - id: systemd-dashboard-unit

  # Documented dashboard autostart in lib/autostart.mjs; pairs install paths
  # with explicit disable/teardown on every OS (see tri-os lifecycle-manager).
  - id: documented-dashboard-autostart-module
    desc: Prumo dashboard autostart includes teardown
    crit: exception
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: launchd-dashboard-label
      - id: systemd-dashboard-unit
      - id: micro-behaviors/os/autorun/control::js-launchctl-unload
      - id: micro-behaviors/os/autorun/control::js-systemctl-lifecycle-disable
    any:
      - id: micro-behaviors/os/autorun/control::js-schtasks-end-or-delete
      - id: micro-behaviors/os/autorun/control::js-scheduled-task-powershell-teardown
    needs: 1
