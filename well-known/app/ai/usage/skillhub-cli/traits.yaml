# SkillHub CLI (@lingyiliebian/skillhub) — package manager for AI agent skills.
# Its documented `skillhub usage setup|opt-out|opt-in` commands register a daily
# aggregate usage report as a Windows scheduled task, a launchd agent or a
# systemd user timer; the README says it reads only structured invocation
# declarations from agent session stores and never uploads prompts or files.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 1000
  size_max: 20000000

traits:
  - id: skillhub-usage-report-command
    desc: SkillHub scheduled usage report command
    if:
      type: text
      substr: skillhub usage report --quiet
