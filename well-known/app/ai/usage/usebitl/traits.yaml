defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: BITL CLI package name
  if:
    type: value
    path: name
    exact: '@usebitl/cli'
- id: homepage
  desc: BITL product homepage
  for:
  - package.json
  - javascript
  - markdown
  if:
    type: text
    substr: https://usebitl.com
- id: sync-only-postinstall
  desc: BITL postinstall copies adapters only
  if:
    type: value
    path: scripts.postinstall
    substr: bitl.mjs __sync
