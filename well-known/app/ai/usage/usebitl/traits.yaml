# BITL (@usebitl/cli) shows what Claude Code, Codex, and Antigravity are
# doing. npm postinstall runs `bitl.mjs __sync`, which copies adapters into
# ~/.bitl and exits. MCP and hook edits happen later, when the user runs
# `bitl install`. All three markers have to be present.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: BITL CLI package name
    if:
      type: value
      path: name
      exact: '@usebitl/cli'

  - id: homepage
    desc: BITL product homepage
    for: [package.json, javascript, markdown]
    if:
      type: text
      substr: 'https://usebitl.com'

  - id: sync-only-postinstall
    desc: BITL postinstall copies adapters only
    if:
      type: value
      path: scripts.postinstall
      substr: 'bitl.mjs __sync'

composite_rules:
  - id: adapter-sync-package
    desc: BITL postinstall only syncs adapters
    crit: exception
    conf: 0.99
    scope: archive
    for: [package.json, npm, tar, javascript, markdown]
    all:
      - id: package-name
      - id: homepage
      - id: sync-only-postinstall
