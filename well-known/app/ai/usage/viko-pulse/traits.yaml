# VIKO Pulse OS CLI (@viko-pulse/pulse-os)
# Authenticated installer and updater for VIKO Pulse OS coding agent rules and skills.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: viko-pulse package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@viko-pulse/pulse-os'

  - id: service-label-literal
    desc: viko-pulse LaunchAgent service label
    for: [javascript, markdown]
    if:
      type: text
      substr: 'net.viko.pulse.sync'

  - id: sync-command-token
    desc: viko-pulse sync command token
    for: [javascript, markdown, package.json]
    if:
      type: text
      substr: '@viko-pulse/pulse-os'

composite_rules:
  - id: official-package
    desc: Official @viko-pulse/pulse-os package
    crit: exception
    conf: 0.99
    for: [javascript, npm, package.json]
    scope: outer
    any:
      - id: package-name
      - id: service-label-literal
      - id: sync-command-token
