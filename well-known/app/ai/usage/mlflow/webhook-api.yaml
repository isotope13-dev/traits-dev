# MLflow model-registry webhook API identifiers. These traits establish
# product/API context only; attack intent is composed under credential access.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: model-registry-webhooks-route
    desc: MLflow model-registry webhooks API route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)/api/2\.0/mlflow/webhooks\b'

  - id: webhook-test-route
    desc: MLflow synchronous webhook test API route
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)/api/2\.0/mlflow/webhooks/[^\s"'']{1,96}/test\b'

  - id: registered-model-created-event
    desc: MLflow registered-model creation webhook event
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bREGISTERED_MODEL\b.{0,160}["'']?action["'']?\s*:\s*["'']CREATED["'']'
