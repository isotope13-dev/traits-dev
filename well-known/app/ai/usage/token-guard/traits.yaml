# Token Guard (@allansantos-dev/token-guard)
# Context economy for AI agents (Copilot CLI, Claude Code, Cursor, Codex, MCP).
# Provides CLI/session token tracking, hook adapters, and companion daemon with
# autostart service across platforms.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: token-guard package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@allansantos-dev/token-guard'

  - id: upstream-repository
    desc: token-guard repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/AllanSantos-DV/token-guard(\.git)?$'

  - id: launchd-daemon-label
    desc: token-guard LaunchAgent label
    for: [javascript, markdown]
    if:
      type: text
      substr: 'com.token-guard.daemon'

  - id: systemd-daemon-unit
    desc: token-guard systemd service unit
    for: [javascript, markdown]
    if:
      type: text
      substr: 'token-guard-daemon.service'

  - id: windows-daemon-task
    desc: token-guard Windows scheduled task name
    for: [javascript, markdown]
    if:
      type: text
      substr: 'TokenGuardDaemon'

composite_rules:
  - id: official-package
    desc: Official @allansantos-dev/token-guard package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: upstream-repository
      - id: launchd-daemon-label
      - id: systemd-daemon-unit
      - id: windows-daemon-task
