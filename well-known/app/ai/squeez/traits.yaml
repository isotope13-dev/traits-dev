# squeez — Claude Code / Copilot CLI token optimizer with install hooks.
defaults:
  platforms: [unix, windows]
  for: [package.json, markdown, javascript, rust]
  crit: notable
  conf: 0.98

traits:
  - id: squeez-package-name
    desc: squeez package or crate name
    if:
      type: value
      path: name
      exact: squeez

  - id: squeez-github-repo
    desc: squeez GitHub repository
    if:
      type: text
      substr: github.com/claudioemmanuel/squeez

  - id: squeez-official-install-url
    desc: squeez official curl install script URL
    if:
      type: text
      substr: raw.githubusercontent.com/claudioemmanuel/squeez/main/install.sh

composite_rules:
  - id: squeez-package-context
    desc: squeez Claude Code optimizer package identity
    crit: notable
    conf: 0.99
    all:
      - id: squeez-package-name
      - id: squeez-github-repo
    for: [npm, archives]
    scope: archive
