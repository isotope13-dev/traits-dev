# Chutes Build — open-source terminal coding agent for the Chutes ecosystem.
# Platform npm packages ship prebuilt standalone ELF/Mach-O/PE binaries named
# `chutes-build`.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, tar, zip, elf, macho, pe, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: chutes-build-native-binary-name
    desc: Chutes Build native binary name
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      regex: '(?i)^chutes-build(\.exe)?$'

  - id: chutes-build-binary-path
    desc: Bundled Chutes Build binary path
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[/\\])bin[/\\]chutes-build(\.exe)?$'

  - id: chutes-build-platform-package-name
    desc: Chutes Build platform npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      regex: '^chutes-build-(linux|darwin|windows)-(x64|arm64)(-musl)?$'

  - id: chutes-build-package-name
    desc: Chutes Build npm package name
    for: [package.json]
    conf: 0.99
    size_min: 32
    size_max: 10000
    if:
      type: value
      path: name
      exact: chutes-build

  - id: chutes-build-github-repo
    desc: Chutes Build GitHub repository
    for: [elf, macho, pe, javascript, text, package.json]
    size_min: 32
    if:
      type: text
      substr: TheStreamCode/chutes-build
