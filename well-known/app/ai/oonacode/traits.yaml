# OonaCode's Windows host is a Bun-compiled CLI and headless service.
# The embedded API host is how that binary names itself.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 1000000
  size_max: 200000000

traits:
  - id: oona-api-host
    desc: OonaCode API host in the Bun image
    if:
      type: text
      section: ".bun"
      substr: 'api.oonacode.oonak.ai'
