# Acuvo Code — terminal client for the Acuvo capability registry. It reads
# a workspace `.npmrc` to refuse agent-written registry/script hijacks, not
# to steal user credentials.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, archives]
  crit: notable
  conf: 0.99
  size_max: 5000000

traits:
  - id: package-name
    desc: acuvo-code npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: acuvo-code

  - id: product-blurb
    desc: Acuvo Code product blurb
    for: [javascript]
    if:
      type: text
      substr: 'Acuvo Code — the terminal client'

  - id: allow-commands-env
    desc: Acuvo command allowlist environment variable
    for: [javascript]
    if:
      type: text
      substr: ACUVO_ALLOW_COMMANDS

  - id: skills-dir-constant
    desc: Acuvo project skills directory
    for: [javascript]
    if:
      type: text
      substr: .acuvo/skills

  - id: memory-files-list
    desc: Acuvo project memory file list
    for: [javascript]
    if:
      type: text
      substr: "MEMORY_FILES = ['ACUVO.md'"

composite_rules:
  - id: official-package-context
    desc: Official acuvo-code package context
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: product-blurb
      - id: allow-commands-env
      - id: skills-dir-constant
      - id: memory-files-list
