# Ensu is a local AI desktop application. Its bundled llama/ggml code carries
# parser strings such as `/proc/self/status` and `TracerPid:` without using
# them as an anti-debugging check.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_max: 200000000

traits:
  - id: ensu-rust-source-path
    desc: Ensu Rust application source path
    if:
      type: text
      section: .rodata
      regex: '(^|[/\\])crates/ensu/src/[A-Za-z0-9_./-]+\.rs'

  - id: ensu-tauri-source-path
    desc: Ensu Tauri application source path
    if:
      type: text
      section: .rodata
      regex: '(^|[/\\])apps/ensu/src-tauri/src/[A-Za-z0-9_./-]+\.rs'

  - id: ensu-release-metadata-url
    desc: Ensu release metadata URL
    if:
      type: text
      section: .rodata
      substr: https://ente.com/release-info/ensu-desktop.json

composite_rules:
  - id: ensu-desktop-application
    desc: Recognized Ensu local AI desktop application
    crit: exception
    conf: 0.99
    all:
      - id: ensu-rust-source-path
      - id: ensu-tauri-source-path
    any:
      - id: ensu-release-metadata-url
