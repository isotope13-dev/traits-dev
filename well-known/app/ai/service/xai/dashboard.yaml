# A public provider console URL is a reference, not a malware identity.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_min: 64
  size_max: 10485760

traits:
  - id: console-url
    desc: xAI console dashboard URL reference
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'https://console.x.ai'
