defaults:
  platforms: [windows, unix]
  for: [npm, package.json, javascript, typescript, tar, tgz]
  crit: baseline
  conf: 0.98

traits:
  - id: comprism-npm-package-name
    desc: CompletionPrism npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@illuminis/comprism"

  - id: comprism-package-text-marker
    desc: CompletionPrism package identity string
    crit: notable
    for: [javascript, typescript, json, package.json]
    if:
      type: text
      regex: '@illuminis/comprism(["'',]|$)'

  - id: completionprism-tenant-host
    desc: CompletionPrism tenant service hostname
    crit: notable
    for: [javascript, typescript, markdown, json, package.json]
    if:
      type: text
      substr: completionprism.illuminis.ai

  - id: comprism-tenant-script-pipe-updater
    desc: CompletionPrism tenant pipe install updaters
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{base\}/install\.ps1 \| iex[\s\S]{0,320}\$\{base\}/install\.sh \| sh'

  - id: comprism-update-module-marker
    desc: CompletionPrism update command module
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: COMPRISM_UPDATE_PACKAGE

composite_rules:
  - id: comprism-package-context
    desc: CompletionPrism CLI package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: comprism-npm-package-name
      - id: comprism-package-text-marker

  - id: comprism-standalone-updater-context
    desc: CompletionPrism self-update via tenant install scripts
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: comprism-tenant-script-pipe-updater
    any:
      - id: comprism-package-text-marker
      - id: comprism-update-module-marker
