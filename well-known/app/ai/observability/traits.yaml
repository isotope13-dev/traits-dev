defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  crit: component
  conf: 0.94
  size_max: 5000000
traits:
- id: clawmetry-name
  desc: ClawMetry product name
  if:
    type: text
    word: ClawMetry
    case_insensitive: true
- id: observability-dashboard-context
  desc: Observability dashboard wording
  # `dashboard` dropped from the alternation: on its own it is a plain product
  # word carried by any admin panel, docs page or path list (a 403-bypass probe
  # list containing /dashboard was enough), which made every such file read as
  # ClawMetry context. The remaining terms still pair with the brand leg below,
  # and an observability product describes itself as one.
  if:
    type: text
    regex: "(observability|cloud sync)"
    case_insensitive: true
- id: openclaw-agent-context
  desc: OpenClaw agent context
  # `AI agents?` dropped for the same reason -- it is now ordinary vocabulary in
  # any README; only the brand token identifies this app.
  if:
    type: text
    word: OpenClaw
    case_insensitive: true
composite_rules:
- id: clawmetry-observability-dashboard
  desc: ClawMetry observability dashboard context
  crit: component
  conf: 0.94
  all:
  - id: clawmetry-name
  any:
  - id: observability-dashboard-context
  - id: openclaw-agent-context
  near_bytes: 4096
