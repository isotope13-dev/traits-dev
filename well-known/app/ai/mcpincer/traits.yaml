# MCPincer — Cursor sidebar MCP orchestration extension with account usage views.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: mcpincer-package-name
    desc: MCPincer VS Code extension package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mcpincer

  - id: openclaw-sidebar-view
    desc: MCPincer OpenClaw sidebar view id
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: openclaw.sidebar

  - id: mcpincer-refresh-account-command
    desc: MCPincer refresh Cursor account command
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: openclaw.refreshAccount

  - id: cursor-db-reader-module
    desc: MCPincer Cursor state database reader module
    for: [javascript, typescript]
    if:
      type: text
      substr: cursor-db-reader

  - id: mcpincer-cursor-db-reader-file
    desc: MCPincer Cursor DB reader bundle
    for: [javascript, typescript]
    if:
      type: basename
      exact: cursor-db-reader.js
