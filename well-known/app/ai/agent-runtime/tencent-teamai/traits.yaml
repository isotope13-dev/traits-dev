# Tencent TeamAI — team harness for AI agents (skill sync + shared knowledge base).
# Coordinates agent skills and rules across tools (Claude Code, Cursor, Windsurf, Trae, etc.)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: teamai-cli-package-name
    desc: Tencent TeamAI CLI npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^(@tencent/)?teamai-cli$'

  - id: teamai-upstream-repository
    desc: Tencent TeamAI upstream repository
    conf: 0.99
    if:
      type: text
      substr: 'github.com/Tencent/teamai-cli'

  - id: teamai-cli-package-path
    desc: Tencent TeamAI CLI source path
    for: [javascript, typescript]
    conf: 0.98
    if:
      type: path
      regex: '(?i)(^|[\\/])teamai-cli(@|[-_0-9]|$|[\\/])'

  - id: teamai-cli-marker
    desc: TeamAI CLI product marker
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(TEAMAI_HOME|teamai init)\b'

composite_rules:
  - id: teamai-cli-source-context
    desc: TeamAI CLI source context
    crit: component
    for: [javascript, typescript]
    all:
      - id: teamai-cli-package-path
      - id: teamai-cli-marker

  - id: tencent-teamai-coding-harness
    desc: Tencent TeamAI agent harness
    crit: notable
    conf: 0.99
    any:
      - id: teamai-cli-package-name
      - id: teamai-upstream-repository
      - id: teamai-cli-source-context
