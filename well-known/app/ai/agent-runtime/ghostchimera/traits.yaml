# Ghost Chimera (github.com/fernandogarzaaa/GHOST-Chimera) — local-first AI agent
# orchestration prototype. Its browser_vault connector allows opt-in direct
# Chromium login-store import gated behind explicit in-UI consent (CONSENT_TEXT)
# for local-only use, with temporary SQLite copies zero-fill shredded after use.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown, text, whl]
  crit: notable
  conf: 0.98

traits:
  - id: ghostchimera-wheel-distribution
    desc: ghostchimera PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ghostchimera

  - id: ghostchimera-package-metadata
    desc: ghostchimera package metadata name
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*ghostchimera\s*$'

  - id: ghostchimera-repo-url
    desc: Ghost Chimera GitHub repository URL
    for: [python, text, pkginfo, markdown]
    if:
      type: text
      substr: github.com/fernandogarzaaa/GHOST-Chimera

  - id: ghostchimera-browser-vault-shred
    desc: Ghost Chimera browser vault DB prefix
    for: [python]
    if:
      type: text
      substr: 'prefix="ghost-logins-"'

  - id: ghostchimera-browser-vault-consent
    desc: Ghost Chimera explicit consent check
    for: [python]
    if:
      type: text
      substr: "Read my browser's saved logins on this machine only"

composite_rules:
  - id: ghostchimera-browser-vault-context
    desc: Ghost Chimera consented browser vault
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: ghostchimera-wheel-distribution
      - id: ghostchimera-package-metadata
      - id: ghostchimera-repo-url
      - id: ghostchimera-browser-vault-shred
      - id: ghostchimera-browser-vault-consent
