# Oasis — multi-agent coding runtime & coordinator CLI (oasis node daemon).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, shell, text]
  crit: notable
  conf: 0.98

traits:
  - id: oasis-package-name
    desc: Oasis coding agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^oasis(_test(_v\d+)?)?$'

  - id: oasis-daemon-package-literal
    desc: Oasis daemon npm package identifier
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(DAEMON_NPM_PACKAGE|LEGACY_DAEMON_NPM_PACKAGE)\s*=\s*"oasis_test(_v\d+)?"'

  - id: oasis-node-launchagent-label
    desc: Oasis node LaunchAgent service label
    for: [javascript, typescript, text]
    if:
      type: text
      substr: com.oasis.node.plist

  - id: oasis-feishu-wrapper-marker
    desc: Oasis Feishu CLI security wrapper marker
    for: [shell, text]
    if:
      type: text
      substr: 'OASIS_CMD_NAME="lark-cli"'

composite_rules:
  - id: oasis-coding-agent-context
    desc: Oasis multi-agent coding runtime context
    crit: notable
    conf: 0.98
    any:
      - id: oasis-package-name
      - id: oasis-daemon-package-literal
      - id: oasis-node-launchagent-label
      - id: oasis-feishu-wrapper-marker
