defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: agentswarm-cli-basename
    desc: AgentSwarm CLI binary basename
    conf: 0.95
    for: [elf, macho, pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: basename
      exact: agentswarm

  - id: agentswarm-cli-user-agent
    desc: AgentSwarm CLI user-agent prefix
    conf: 0.99
    for: [elf, macho, pe, javascript]
    size_min: 100000
    if:
      type: text
      regex: '\bagentswarm-cli/[0-9]+\.[0-9]+'

  - id: agency-swarm-product-name
    desc: Agency Swarm product name literal
    conf: 0.96
    for: [elf, macho, pe, javascript, python]
    size_min: 1000
    if:
      type: text
      substr: Agency Swarm

  - id: agentswarm-cli-npm-package
    desc: AgentSwarm CLI scoped npm package name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@vrsen/agentswarm-cli'

composite_rules:
  - id: agentswarm-cli-binary
    desc: AgentSwarm CLI compiled binary
    conf: 0.99
    for: [elf, macho, pe]
    size_min: 1000000
    all:
      - id: agentswarm-cli-basename
    any:
      - id: agentswarm-cli-user-agent
      - id: agency-swarm-product-name
      - id: well-known/lib/runtime/bun-runtime::unix-runtime-context
      - id: well-known/lib/runtime/bun-runtime::bun-standalone-graph-trailer
