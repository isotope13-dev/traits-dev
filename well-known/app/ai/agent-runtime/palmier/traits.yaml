# Palmier (palmier.me) — open-source Android companion app and control plane
# for running AI agents on desktop from a mobile device.
defaults:
  platforms: [android]
  for: [apk, zip, xml, dex]
  crit: baseline
  conf: 0.99

traits:
  - id: palmier-package
    desc: Palmier Android package name
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.palmier.app"

  - id: palmier-manifest-main-activity
    desc: Palmier main activity in manifest
    crit: notable
    conf: 0.99
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.palmier.app.MainActivity"

  - id: palmier-main-activity-class
    desc: Palmier main activity class in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcom/palmier/app/MainActivity;"

  - id: palmier-device-plugin-class
    desc: Palmier device plugin class in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcom/palmier/app/DevicePlugin;"

  - id: palmier-fcm-service-class
    desc: Palmier FCM messaging service class in DEX
    crit: notable
    conf: 0.99
    for: [dex]
    if:
      type: text
      substr: "Lcom/palmier/app/PalmierFirebaseMessagingService;"

composite_rules:
  - id: palmier-application
    desc: Palmier Android application identity
    crit: notable
    conf: 0.995
    for: [android_apk, zip, xml, dex]
    scope: outer
    all:
      - id: palmier-package
      - id: palmier-main-activity-class

  - id: palmier-manifest-identity
    desc: Palmier manifest package and activity identity
    crit: exception
    conf: 0.995
    for: [xml]
    all:
      - id: palmier-package
      - id: palmier-manifest-main-activity

  - id: palmier-dex-identity
    desc: Palmier Android DEX core classes
    crit: exception
    conf: 0.995
    for: [dex]
    all:
      - id: palmier-main-activity-class
      - id: palmier-device-plugin-class
      - id: palmier-fcm-service-class
