# humaninloop / AskHuman (https://github.com/Naituw/AskHuman)
# Human-in-the-loop interaction tool for AI agents.
defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe, package.json, binaries]
  crit: notable
  conf: 0.98
  size_min: 50
  size_max: 250000000

traits:
  - id: askhuman-binary-name
    desc: AskHuman binary name
    for: [macho, elf, pe]
    if:
      type: basename
      exact: AskHuman

  - id: askhuman-package-name
    desc: humaninloop npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@humaninloop\/'

  - id: askhuman-repo-url
    desc: AskHuman repository reference
    if:
      type: text
      substr: 'github.com/Naituw/AskHuman'

composite_rules:
  - id: askhuman-app-identity
    desc: AskHuman binary identity
    crit: notable
    conf: 0.99
    all:
      - id: askhuman-binary-name
      - id: askhuman-repo-url

  - id: binary-context
    desc: Recognized AskHuman binary context
    crit: exception
    conf: 0.99
    any:
      - id: metadata/signed/id::com.naituw.humaninloop
      - id: askhuman-app-identity
