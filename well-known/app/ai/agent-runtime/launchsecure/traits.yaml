# LaunchSecure / launch-kit — developer platform, local run pod, and agent pipeline runner
# (github.com/launchsecure/launchsecure-v2, automatewith.us), published on npm under @launchsecure/*.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: launchsecure-package-scope
    desc: LaunchSecure npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@launchsecure/'

  - id: launchsecure-github-repo
    desc: LaunchSecure GitHub repository URL
    if:
      type: text
      substr: launchsecure/launchsecure-v2

  - id: launchsecure-author
    desc: LaunchSecure package author
    for: [package.json]
    if:
      type: value
      path: author
      regex: '(?i)launchsecure'

  - id: launch-kit-package-literal
    desc: LaunchSecure launch-kit package literal
    if:
      type: text
      substr: '@launchsecure/launch-kit'

  - id: launch-studio-session-marker
    desc: LaunchSecure session environment marker
    for: [javascript, typescript]
    if:
      type: text
      substr: LAUNCH_STUDIO_SESSION

composite_rules:
  - id: launchsecure-toolkit-context
    desc: LaunchSecure agent runner context
    crit: exception
    conf: 0.99
    any:
      - id: launchsecure-package-scope
      - id: launchsecure-github-repo
      - id: launchsecure-author
      - id: launch-kit-package-literal
      - id: launch-studio-session-marker
