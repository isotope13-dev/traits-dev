# @teamx-sh/agent — TeamX local git-activity agent. Watches a repo, syncs
# commits to the team feed, and can register a login service; postinstall
# only detaches `sync-history` when `.teamx-config.json` already exists.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, gz]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: npm-package-name
    desc: teamx-agent npm scoped package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: "@teamx-sh/agent"

  - id: github-repository
    desc: teamx-agent GitHub repository path
    if:
      type: text
      substr: github.com/omam-muqadar/teamx-agent

  - id: config-filename
    desc: TeamX agent local config filename
    if:
      type: text
      substr: .teamx-config.json

  - id: no-auto-sync-env
    desc: TeamX postinstall auto-sync opt-out
    for: [javascript, typescript]
    if:
      type: text
      substr: TEAMX_NO_AUTO_SYNC

  - id: no-snapshot-env
    desc: TeamX git snapshot opt-out env
    for: [javascript, typescript]
    if:
      type: text
      substr: TEAMX_NO_SNAPSHOT

  - id: service-label
    desc: TeamX agent launchd service label
    for: [javascript, typescript]
    if:
      type: text
      substr: sh.teamx.agent

  - id: agent-log-filename
    desc: teamx-agent log file name
    for: [javascript, typescript]
    if:
      type: text
      substr: teamx-agent.log

  - id: blast-radius-snapshot
    desc: TeamX Blast Radius snapshot title
    for: [javascript, typescript]
    if:
      type: text
      substr: Blast Radius snapshot

composite_rules:
  - id: teamx-agent-identity
    desc: Recognized TeamX git-activity agent
    needs: 2
    any:
      - id: npm-package-name
      - id: github-repository
      - id: config-filename
      - id: no-auto-sync-env
      - id: no-snapshot-env
      - id: service-label
      - id: agent-log-filename
      - id: blast-radius-snapshot
