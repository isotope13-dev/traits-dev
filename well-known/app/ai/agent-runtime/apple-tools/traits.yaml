# apple-tools — unified Apple tools MCP server bundle for macOS (github.com/JonathanRReed/Apple-MCPs).
defaults:
  platforms: [macos]
  for: [json, python, pyproject.toml, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: manifest-name
    desc: apple-tools MCP bundle manifest name
    for: [json]
    if:
      type: value
      path: name
      exact: apple-tools

  - id: repo-url
    desc: Apple-MCPs GitHub repository URL
    if:
      type: text
      substr: github.com/JonathanRReed/Apple-MCPs

  - id: pyproject-name
    desc: apple-tools pyproject project name
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      exact: apple-tools

  - id: messages-automation-bridge-class
    desc: Messages automation bridge class declaration
    for: [python]
    if:
      type: text
      substr: MessagesAutomationBridgeError

  - id: apple-tools-path
    desc: Apple Tools or Apple MCP path component
    for: [python]
    if:
      type: path
      regex: '(?i)(apple[-_]tools|apple[-_]messages[-_]mcp)'

composite_rules:
  - id: apple-tools-mcp-bundle
    desc: Recognized Apple Tools MCP server bundle
    crit: notable
    conf: 0.99
    for: [zip, json, python, pyproject.toml]
    scope: outer
    any:
      - id: manifest-name
      - id: repo-url
      - id: pyproject-name

  - id: apple-tools-macos-automation-context
    desc: Apple Tools MCP macOS automation context
    crit: exception
    conf: 0.99
    for: [python]
    any:
      - id: repo-url
      - id: messages-automation-bridge-class
      - id: apple-tools-path
