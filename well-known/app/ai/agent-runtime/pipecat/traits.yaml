# Pipecat — open-source real-time voice and multimodal AI agent framework
# (pipecat-ai on PyPI; dv-pipecat-ai is an alternate distribution name for the
# same upstream project).
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97

traits:
  - id: pypi-name-pipecat-ai
    desc: pipecat-ai PyPI distribution name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: pipecat-ai

  - id: pypi-name-dv-pipecat-ai
    desc: dv-pipecat-ai PyPI distribution name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: dv-pipecat-ai

  - id: wheel-metadata-name-pipecat-ai
    desc: Wheel METADATA names pipecat-ai
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: pipecat-ai

  - id: wheel-metadata-name-dv-pipecat-ai
    desc: Wheel METADATA names dv-pipecat-ai
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: dv-pipecat-ai

  - id: wheel-distribution-pipecat-ai
    desc: pipecat_ai wheel distribution prefix
    for: [whl]
    if:
      type: value
      path: whl.filename.name_prefix
      exact: pipecat_ai

  - id: wheel-distribution-dv-pipecat-ai
    desc: dv_pipecat_ai wheel distribution prefix
    for: [whl]
    if:
      type: value
      path: whl.filename.name_prefix
      exact: dv_pipecat_ai

  - id: github-pipecat-ai-repo
    desc: pipecat-ai GitHub repository URL
    if:
      type: text
      substr: github.com/pipecat-ai/pipecat

  - id: wheel-metadata-pipecat-github-source
    desc: Wheel METADATA cites pipecat-ai GitHub source
    for: [whl]
    if:
      type: value
      path: METADATA::project-url[*]
      regex: '(?i)github\.com/pipecat-ai/pipecat'

  - id: pipecat-version-distribution-import
    desc: Pipecat version lookup via importlib.metadata
    for: [python]
    size_min: 100
    size_max: 50000000
    if:
      type: text
      regex: 'version\("(pipecat-ai|dv-pipecat-ai)"\)'

  - id: wheel-top-level-pipecat-module
    desc: Wheel top_level exposes pipecat module
    for: [whl]
    if:
      type: value
      path: whl.top_level_packages[0]
      exact: pipecat

composite_rules:
  - id: pipecat-framework-package
    desc: Pipecat voice and multimodal AI framework
    crit: notable
    needs: 2
    any:
      - id: pypi-name-pipecat-ai
      - id: pypi-name-dv-pipecat-ai
      - id: wheel-metadata-name-pipecat-ai
      - id: wheel-metadata-name-dv-pipecat-ai
      - id: wheel-distribution-pipecat-ai
      - id: wheel-distribution-dv-pipecat-ai
      - id: github-pipecat-ai-repo
      - id: wheel-metadata-pipecat-github-source
      - id: pipecat-version-distribution-import
