# Nebula AI (nebula.gg / agent-labs-dev/nebula-desktop) — Terminal UI and CLI
# for the nebula.gg AI task orchestration platform.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: nebula-ai-package-name
    desc: Nebula AI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "nebula-ai"

  - id: nebula-desktop-repository
    desc: Nebula Desktop repository reference
    if:
      type: text
      substr: "github.com/agent-labs-dev/nebula-desktop"

  - id: nebula-gg-domain
    desc: Nebula AI platform domain reference
    if:
      type: text
      regex: '(?i)\bhttps?://(app-assets\.)?nebula\.gg\b'

  - id: nebula-ai-launcher-signing-key
    desc: Nebula AI launcher signing key
    for: [javascript, typescript]
    if:
      type: text
      substr: "MCowBQYDK2VwAyEAyAvta5v665Vd82jfFmuCEw3WpneUQboj936gYHQE4/0="

composite_rules:
  - id: nebula-ai-distribution
    desc: Nebula AI CLI distribution identity
    crit: notable
    conf: 0.98
    any:
      - id: nebula-ai-package-name
      - id: nebula-desktop-repository
      - id: nebula-gg-domain
      - id: nebula-ai-launcher-signing-key

  - id: nebula-ai-context
    desc: Nebula AI CLI orchestration platform context
    crit: exception
    conf: 0.99
    any:
      - id: nebula-ai-launcher-signing-key
      - id: nebula-desktop-repository
      - id: nebula-ai-package-name
