# KaijiBot (github.com/Kaiji-Z/kaijibot) — proactive cognitive AI assistant
# with Feishu/WeChat integration, bundled extensions, and shipped agent skills.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: KaijiBot npm package name
    if:
      type: value
      path: name
      exact: kaijibot

  - id: npm-repository-url
    desc: KaijiBot upstream repository reference
    if:
      type: value
      path: repository.url
      substr: github.com/Kaiji-Z/kaijibot

  - id: kaijibot-skill-frontmatter-marker
    desc: KaijiBot skill frontmatter metadata block
    for: [markdown, shell]
    if:
      type: text
      regex: '"kaijibot"\s*:'

  - id: postinstall-bundled-plugins-script-marker
    desc: KaijiBot bundled-plugin postinstall script path
    for: [javascript, typescript]
    if:
      type: path
      substr: postinstall-bundled-plugins.mjs

composite_rules:
  - id: kaijibot-package-context
    desc: KaijiBot npm distribution identity
    crit: exception
    conf: 0.99
    for: [npm, package.json]
    any:
      - id: npm-package-name
      - id: npm-repository-url
