# Local Operator — Radient proactive AI desktop assistant agent runtime.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: local-operator-wheel-distribution
    desc: local-operator PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: local_operator

  - id: local-operator-package-metadata
    desc: local-operator package metadata Name
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*local[-_]operator\s*$'

  - id: local-operator-repo-url
    desc: local-operator GitHub repository URL
    for: [python, text, pkginfo, markdown]
    if:
      type: text
      substr: github.com/damianvtran/local-operator

  - id: local-operator-author
    desc: local-operator author email or organization
    for: [python, text, pkginfo]
    if:
      type: text
      substr: contact@radienthq.com

  - id: local-operator-brand-name
    desc: Local Operator process brand name
    for: [python]
    if:
      type: text
      substr: 'BRAND = "Local Operator"'

composite_rules:
  - id: local-operator-package-context
    desc: Local Operator AI assistant agent runtime context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: local-operator-wheel-distribution
      - id: local-operator-package-metadata
      - id: local-operator-repo-url
      - id: local-operator-author
      - id: local-operator-brand-name
