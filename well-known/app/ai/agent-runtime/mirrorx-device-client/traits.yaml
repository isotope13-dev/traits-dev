# Amaster MirrorX device client (@amaster.ai/mirrorx-device-client) — connector
# daemon for user-owned Codex, WorkBuddy, and Pi agent executors. It registers
# an overt per-user background service on macOS (LaunchAgent), Linux (systemd
# user unit), and Windows (scheduled task) with documented labels and env vars.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: Amaster MirrorX device client package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@amaster.ai/mirrorx-device-client'

  - id: launchd-daemon-label
    desc: MirrorX device client launchd label
    for: [javascript, typescript, text]
    if:
      type: text
      substr: 'ai.mirrorx.device-client'

  - id: device-env-variable
    desc: MirrorX device client environment variable
    for: [javascript, typescript, text]
    if:
      type: text
      substr: 'MIRRORX_DEVICE_HOME'

  - id: upstream-repository
    desc: MirrorX device client upstream repository
    for: [package.json, markdown, text]
    if:
      type: text
      substr: 'github.com/TGYD-helige/pi-agent'

composite_rules:
  - id: mirrorx-device-client-context
    desc: Recognized Amaster MirrorX device client context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, package.json, npm]
    any:
      - id: npm-package-name
      - id: launchd-daemon-label
      - id: device-env-variable
      - id: upstream-repository
