# Naholo CLI — task and issue management runtime for AI coding agents (https://github.com/Rokt33r/naholo).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, json, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Naholo CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@naholo/cli"

  - id: npm-package-name
    desc: Naholo CLI npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@naholo/cli"

  - id: upstream-repository
    desc: Naholo official git repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/rokt33r/naholo'

  - id: naholo-cli-bundle-text
    desc: Naholo CLI bundled package identity
    crit: notable
    for: [javascript, typescript, json, package.json]
    if:
      type: text
      regex: '@naholo/cli(["'',]|$)'

  - id: agent-manual-marker
    desc: Naholo agent manual documentation header
    crit: notable
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: "# Naholo Agent Manual"

composite_rules:
  - id: naholo-agent-runtime
    desc: Naholo AI agent task and issue management runtime
    crit: notable
    conf: 0.98
    any:
      - id: package-name
      - id: npm-package-name
      - id: upstream-repository
      - id: naholo-cli-bundle-text
      - id: agent-manual-marker

  - id: naholo-bundle-context
    desc: Naholo CLI agent runtime bundle context
    crit: exception
    conf: 0.99
    all:
      - id: naholo-cli-bundle-text
      - id: agent-manual-marker
