# Cortico World Browser (npm cortico-world-browser) — browser automation world
# extension for the Cortico AI desktop agent (https://github.com/biliye/cortico-world-browser).
defaults:
  platforms: [windows, unix]
  for: [typescript, javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: cortico-core-import
    desc: Cortico core types import
    for: [typescript, javascript]
    if:
      type: text
      substr: cortico/core/types
