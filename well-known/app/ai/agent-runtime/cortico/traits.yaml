# Cortico World Browser (npm cortico-world-browser) — browser automation world
# extension for the Cortico AI desktop agent (https://github.com/biliye/cortico-world-browser).
defaults:
  platforms: [windows, unix]
  for: [typescript, javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: cortico-core-import
    desc: Cortico core types import
    for: [typescript, javascript]
    if:
      type: text
      substr: cortico/core/types

  - id: cortico-world-browser-npm-name
    desc: cortico-world-browser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cortico-world-browser

  - id: cortico-world-manifest
    desc: Cortico World extension manifest declaration
    for: [package.json]
    if:
      type: value
      path: cortico.kind
      exact: world

  - id: cortico-world-browser-repo-url
    desc: cortico-world-browser repository URL
    if:
      type: text
      substr: github.com/biliye/cortico-world-browser

composite_rules:
  - id: cortico-world-browser-context
    desc: Cortico World browser extension context
    crit: exception
    any:
      - id: cortico-core-import
      - id: cortico-world-browser-npm-name
      - id: cortico-world-manifest
      - id: cortico-world-browser-repo-url
