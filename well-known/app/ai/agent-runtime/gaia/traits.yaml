# GAIA (@jaguilar87/gaia, github.com/metraton/gaia) -- specialist agents for
# Claude Code and OpenCode behind a consent gate. Its `gaia install` helper
# generates the OpenCode agent definitions and settings for the agents the
# package itself ships, including a permission table that allows every
# directory for its own sub-agents. A wildcard allow in that generated table is
# the installer's product scaffolding, not a rewrite of somebody else's
# approval gate.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
  size_min: 500
  size_max: 2000000

traits:
  - id: gaia-module-import
    desc: Imports a gaia package module
    if:
      type: text
      regex: '(?m)^\s*from gaia\.[a-z_]{1,24} import'

  - id: gaia-install-helper-docstring
    desc: Gaia install helper module docstring
    if:
      type: text
      substr: shared helpers for `gaia install`

composite_rules:
  - id: gaia-installer-context
    desc: Recognized Gaia installer helper module
    crit: exception
    conf: 0.98
    all:
      - id: gaia-module-import
      - id: gaia-install-helper-docstring
