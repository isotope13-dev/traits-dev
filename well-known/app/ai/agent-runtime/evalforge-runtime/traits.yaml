# evalforge-runtime — LLM process runtime with optional mail/webhook connectors.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: evalforge-runtime-pypi-package
    desc: evalforge-runtime PyPI package identity
    if:
      type: text
      regex: '(?i)Name:\s*evalforge-runtime\b'

  - id: evalforge-runtime-module
    desc: evalforge_runtime Python package marker
    if:
      type: text
      substr: evalforge_runtime
