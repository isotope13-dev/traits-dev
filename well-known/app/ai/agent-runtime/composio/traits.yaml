# Composio agent orchestrator (composiohq/agent-orchestrator) — Electron
# desktop app for AI coding agents. Its browser-profile import moves the
# user's own cookies and history into app-managed profiles through an
# explicit source picker (validateRequest, includeCookies/includeHistory
# flags, size budgets, staging under `browser-import-staging`), the same
# consented-import shape as the Kombai and Tokenade contexts.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, json, package.json, text]
  crit: notable
  conf: 0.98

traits:
  - id: composio-orchestrator-repo-path
    desc: Composio agent-orchestrator repository path
    for: [scripts, source, markdown, text, json, package.json, javascript, typescript]
    if:
      type: path
      regex: 'composiohq[/\\]agent-orchestrator(@|[/\\]|$)'
  - id: composio-browser-import-staging-dir
    desc: Composio browser-import staging directory name
    for: [javascript, typescript]
    if:
      type: text
      substr: browser-import-staging
  - id: composio-browser-profile-import-service
    desc: Composio browser profile import service class
    for: [javascript, typescript]
    if:
      type: text
      substr: BrowserProfileImportService
  - id: composio-cookie-support-flag
    desc: Composio browser-import cookie support flag
    for: [javascript, typescript]
    if:
      type: text
      substr: cookieSupport

composite_rules:
  - id: composio-agent-orchestrator
    desc: Composio AI agent orchestrator
    crit: notable
    conf: 0.98
    any:
      - id: composio-orchestrator-repo-path
      - id: composio-browser-import-staging-dir
      - id: composio-browser-profile-import-service
      - id: composio-cookie-support-flag
  # Consented-import context: the staging dir plus the import service (or its
  # cookie-support plumbing) in one file is the explicit user-driven import
  # flow, not credential theft.
  - id: composio-browser-import-context
    desc: Composio consented browser-import context
    crit: exception
    conf: 0.97
    scope: file
    for: [javascript, typescript]
    all:
      - id: composio-browser-import-staging-dir
    any:
      - id: composio-browser-profile-import-service
      - id: composio-cookie-support-flag
