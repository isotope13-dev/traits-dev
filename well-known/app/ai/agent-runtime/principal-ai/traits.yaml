# Principal AI Subsystems Studio (@principal-ai/subsystems-studio) is an
# Electrobun desktop application for subsystem architecture modeling, tours,
# trails, and agent sessions. Its local API endpoints, agent prompt generation,
# and bundled UI trip curl / token / script heuristics; identify the vendor
# package and application bundle.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Subsystems Studio npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@principal-ai/subsystems-studio'

  - id: package-scope
    desc: Principal AI npm scope reference
    for: [package.json, javascript, typescript, text]
    if:
      type: text
      substr: '@principal-ai/'

  - id: bundle-id
    desc: Subsystems Studio application bundle identifier
    for: [plist]
    if:
      type: value
      path: CFBundleIdentifier
      exact: ai.principal.subsystems-studio

  - id: bundle-name
    desc: Subsystems Studio application bundle name
    for: [plist]
    if:
      type: value
      path: CFBundleName
      exact: Subsystems Studio

composite_rules:
  - id: subsystems-studio-package
    desc: Recognized Principal AI Subsystems Studio package
    crit: exception
    scope: archive
    for: [npm, tar, zip, package.json, javascript, text]
    all:
      - id: package-name
      - id: package-scope

  - id: subsystems-studio-app
    desc: Recognized Principal AI Subsystems Studio desktop application
    crit: exception
    scope: archive
    for: [tar, zip, plist]
    all:
      - id: bundle-id
      - id: bundle-name
