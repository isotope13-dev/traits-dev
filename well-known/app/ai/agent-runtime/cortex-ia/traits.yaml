# Cortex-IA deterministic multi-agent control plane & orchestration engine
defaults:
  platforms: [unix, windows]
  for: [go, source, zip, elf, macho, pe]
  size_max: 100000000
  crit: notable
  conf: 0.98

traits:
  - id: cortex-ia-module-path
    desc: Cortex-IA Go module import path
    if:
      type: path
      substr: github.com/lleontor705/cortex-ia

  - id: cortex-ia-telemetry-endpoint
    desc: Cortex-IA error reporting endpoint
    if:
      type: text
      substr: cortex-report-hub-production.up.railway.app

  - id: cortex-ia-user-agent
    desc: Cortex-IA client user-agent literal
    if:
      type: text
      substr: 'cortex-ia/'

  - id: cortex-ia-telemetry-config-path
    desc: Cortex-IA telemetry configuration file path
    if:
      type: text
      regex: '\.cortex-ia[/\\]telemetry\.json'

composite_rules:
  - id: cortex-ia-telemetry-reporter
    desc: Cortex-IA error reporting telemetry client
    crit: notable
    conf: 0.98
    all:
      - id: cortex-ia-telemetry-endpoint
    any:
      - id: cortex-ia-user-agent
      - id: cortex-ia-telemetry-config-path
      - id: cortex-ia-module-path
