# Werewolf Agent Build SDK — Taobao LLM agents for werewolf-game play.
# OpenAI client, env API keys, FastAPI, and ephemeral bind are the
# product HTTP agent server, not C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: werewolf-agent-build-sdk PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: werewolf-agent-build-sdk

  - id: wheel-distribution
    desc: werewolf_agent_build_sdk wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: werewolf_agent_build_sdk

  - id: werewolftown-agent-class
    desc: WerewolfTownAgent class declaration
    for: [python]
    conf: 0.98
    if:
      type: text
      substr: 'class WerewolfTownAgent'

  - id: werewolf-model-import
    desc: werewolf_model AgentReq import path
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: agent_build_sdk.model.werewolf_model
