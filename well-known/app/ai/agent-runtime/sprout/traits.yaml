# Sprout — AI-powered coding agent and development environment (github.com/sprout-foundry/sprout).
defaults:
  platforms: [unix, windows]
  for: [go, javascript, typescript, markdown, package.json, json, shell, text]
  crit: notable
  conf: 0.99

traits:
  - id: sprout-repository-or-module
    desc: Sprout repository URL or module path
    if:
      type: text
      substr: github.com/sprout-foundry/sprout

  - id: sprout-package-name
    desc: Sprout npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: sprout

composite_rules:
  - id: sprout-agent-runtime
    desc: Sprout AI coding agent context
    crit: notable
    conf: 0.99
    any:
      - id: sprout-repository-or-module
      - id: sprout-package-name
