# ColonyAI / PacoMind multi-agent framework and persistence sidecar.
defaults:
  platforms: [unix, windows]
  for: [python, pyproject.toml, text, json, yaml]
  crit: notable
  conf: 0.98

traits:
  - id: pacomind-hermes-package
    desc: pacomind-hermes PyPI package name
    if:
      type: text
      regex: '(?i)(name\s*=\s*["'']pacomind(-hermes)?["''])'

  - id: upstream-repository
    desc: ColonyAI GitHub repository reference
    if:
      type: text
      regex: 'github\.com/aevonix/colonyai(\.git)?([/\\s"''`?#]|$)'

  - id: colonyai-source-path
    desc: ColonyAI source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])(aevonix[\\/]colonyai|colonyai@v\d)'

composite_rules:
  - id: colonyai-package-context
    desc: Recognized ColonyAI package context
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, tar, python, pyproject.toml, text, json, yaml]
    any:
      - id: pacomind-hermes-package
      - id: upstream-repository
      - id: colonyai-source-path
