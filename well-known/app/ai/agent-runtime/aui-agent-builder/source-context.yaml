defaults:
  platforms: [unix, windows]

composite_rules:
  - id: aui-agent-builder-package-context
    desc: Recognized AUI Agent Builder package
    crit: exception
    conf: 0.99
    for: [scripts, source, manifests, data, markdown]
    scope: outer
    any:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::package-name
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::package-member-context
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::source-archive-path

