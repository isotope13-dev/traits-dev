# Parall local agent runtime (@parall/daemon, @parall/agent-core).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: parall-npm-package-name
    desc: Parall npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@parall/(daemon|agent-core|sdk|claude-agent|codex-agent|openclaw-agent)$'

  - id: parall-github-repository
    desc: Parall GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/parall-hq/parall-mono

  - id: parall-bundle-path
    desc: Parall bundled runtime script path
    for: [javascript]
    if:
      type: path
      regex: 'bundle[\\/]parall-(daemon|claude-agent|codex-agent)\.js$'

  - id: parall-runtime-symbols
    desc: Parall client and runtime identifiers
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(ParallClient|ParallWs|PRLL_CLAUDE_HOME|PRLL_CODEX_HOME)\b'

composite_rules:
  - id: parall-daemon-package
    desc: Parall local agent runtime daemon package
    for: [package.json]
    all:
      - id: parall-npm-package-name
      - id: parall-github-repository

  - id: parall-bundled-runtime
    desc: Parall bundled agent runtime script
    for: [javascript]
    all:
      - id: parall-bundle-path
      - id: parall-runtime-symbols

  - id: parall-agent-runtime-context
    desc: Parall agent runtime context
    crit: exception
    any:
      - id: parall-daemon-package
      - id: parall-bundled-runtime
