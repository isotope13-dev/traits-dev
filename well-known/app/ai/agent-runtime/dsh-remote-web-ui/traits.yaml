# dsh-remote-web-ui — Scan-to-pair remote access web UI plugin for DeepSeek Harness (dsh).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: dsh-remote-web-ui-package-name
    desc: dsh-remote-web-ui npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@linxin666/dsh-remote-web-ui"

  - id: dsh-remote-web-ui-repository-url
    desc: dsh-remote-web-ui GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]zhu1090093659/dsh-web'

  - id: dsh-market-relay-origin
    desc: DeepSeek Harness market relay origin reference
    for: [javascript, typescript, text]
    if:
      type: text
      substr: "dsh-market.com/api/relay"

composite_rules:
  - id: dsh-remote-web-ui-distribution
    desc: dsh-remote-web-ui package distribution identity
    crit: notable
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: outer
    any:
      - id: dsh-remote-web-ui-package-name
      - id: dsh-remote-web-ui-repository-url

  - id: dsh-remote-web-ui-context
    desc: dsh-remote-web-ui AI agent plugin context
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: outer
    any:
      - id: dsh-remote-web-ui-package-name
      - id: dsh-remote-web-ui-repository-url
      - id: dsh-market-relay-origin
