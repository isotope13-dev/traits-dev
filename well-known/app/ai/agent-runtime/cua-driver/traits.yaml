# Cua Driver — computer-use automation driver for AI agents (trycua/cua).
# Ships native binaries (cua-driver, cua-driver-uia, cua-cursor-theme)
# redistributed by @amaster.ai/pi-computer-use-cua-driver.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98
  size_min: 32
  size_max: 300000000

traits:
  - id: cua-driver-package-name
    desc: Cua Driver npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@amaster\.ai/pi-computer-use-cua-driver|@trycua/cua-driver)'

  - id: cua-driver-binary-name
    desc: Cua Driver native binary basename
    for: [pe, elf, macho]
    if:
      type: basename
      regex: '^cua-driver(-uia|-cursor-theme)?(\.exe)?$'

  - id: cua-driver-github-repo
    desc: Cua Driver upstream GitHub repository URL
    for: [pe, elf, macho, text, markdown, package.json]
    if:
      type: text
      substr: github.com/trycua/cua

  - id: cua-driver-identifier
    desc: Cua Driver application bundle identifier
    for: [pe, elf, macho, text]
    if:
      type: text
      regex: '\bcom\.trycua\.driver(\.uia)?\b'

composite_rules:
  - id: cua-driver-binary-identity
    desc: Cua Driver native executable identity
    crit: notable
    conf: 0.99
    for: [pe, elf, macho]
    all:
      - id: cua-driver-binary-name
    any:
      - id: cua-driver-identifier
      - id: cua-driver-github-repo

  - id: cua-driver-runtime-context
    desc: Cua Driver computer-use agent runtime context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: cua-driver-binary-identity
      - id: cua-driver-package-name
