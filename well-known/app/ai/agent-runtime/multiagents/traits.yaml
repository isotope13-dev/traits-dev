# multiagents — multi-agent orchestration platform for Claude Code, Codex CLI,
# and Gemini CLI (github.com/zetbrush/multiagents), published on npm as multiagents.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: multiagents-package-name
    desc: multiagents npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: multiagents

  - id: multiagents-github-repo
    desc: multiagents GitHub repository URL
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: github.com/zetbrush/multiagents

  - id: multiagents-env-prefix
    desc: multiagents environment variable reference
    for: [javascript, typescript, shell]
    if:
      type: text
      regex: '\bMULTIAGENTS_[A-Z_]+\b'

  - id: multiagents-peer-mcp-name
    desc: multiagents peer MCP server identifier
    for: [package.json, javascript, typescript, json]
    if:
      type: text
      substr: multiagents-peer

composite_rules:
  - id: multiagents-agent-source
    desc: multiagents coding-agent source context
    any:
      - id: multiagents-package-name
      - id: multiagents-github-repo
      - id: multiagents-env-prefix
      - id: multiagents-peer-mcp-name
