# @pikaa-ai/pikaa (Groupy) — Bun/TS coding agent with MCP stdio clients.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: pikaa-package-json-name
    desc: Pikaa AI package.json name field
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@pikaa-ai/pikaa"
  - id: pikaa-npm-archive-name
    desc: Pikaa AI npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@pikaa-ai/pikaa"
  - id: groupy-readme-title
    desc: Groupy agent README title
    for: [markdown]
    if:
      type: text
      substr: Groupy Autonomous Agent

composite_rules:
  - id: pikaa-agent-cli-context
    desc: Pikaa Groupy agent CLI application context
    crit: notable
    conf: 0.98
    any:
      - id: pikaa-package-json-name
      - id: pikaa-npm-archive-name
      - id: groupy-readme-title
