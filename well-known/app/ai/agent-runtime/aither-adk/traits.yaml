# Aither ADK (aither-adk) — Aitherium agent development kit.
# CLI deploy zips a project tree and POSTs it to gateway.aitherium.com;
# that is product packaging, not credential-store exfiltration.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: aither-adk PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: aither-adk

  - id: wheel-distribution
    desc: aither_adk wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: aither_adk

  - id: product-site
    desc: Aitherium product site hostname
    if:
      type: text
      substr: aitherium.com

  - id: gateway-host
    desc: Aitherium agent gateway hostname
    if:
      type: text
      substr: gateway.aitherium.com

  - id: user-agent
    desc: AitherADK HTTP User-Agent token
    for: [python]
    if:
      type: text
      substr: AitherADK/1.0

  - id: home-dir
    desc: Aither ADK home directory path
    for: [python]
    if:
      type: text
      substr: ~/.aither

composite_rules:
  - id: aither-adk-sdk
    desc: Recognized Aither ADK Python SDK
    needs: 2
    any:
      - id: pypi-name
      - id: wheel-distribution
      - id: product-site
      - id: gateway-host
      - id: user-agent
      - id: home-dir
