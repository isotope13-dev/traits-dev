# AgentProto: agent protocol CLI adapter framework (agentproto.sh)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: agentproto-package-scope
    desc: AgentProto npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@agentproto/'

  - id: agentproto-github-repo
    desc: AgentProto GitHub repository URL
    if:
      type: text
      substr: github.com/agentproto/ts

  - id: agentproto-homepage
    desc: AgentProto project homepage
    if:
      type: text
      substr: agentproto.sh

  - id: agentproto-package-literal
    desc: AgentProto package reference
    for: [javascript, typescript]
    if:
      type: text
      regex: '@agentproto/(cli|runtime|driver|adapter|auth|provider-kit|worktree)'

composite_rules:
  - id: agentproto-runtime-context
    desc: AgentProto agent runtime context
    crit: exception
    conf: 0.99
    any:
      - id: agentproto-package-scope
      - id: agentproto-github-repo
      - id: agentproto-homepage
      - id: agentproto-package-literal
