# Claude Gateway — Multi-agent orchestrator and gateway platform for Claude Code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: claude-gateway-package-json-name
    desc: Claude Gateway package.json name field
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@0xmaxma/claude-gateway"

  - id: claude-gateway-npm-archive-name
    desc: Claude Gateway npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@0xmaxma/claude-gateway"

  - id: claude-gateway-repository-url
    desc: Claude Gateway repository URL field
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: "github.com/0xMaxMa/claude-gateway"

  - id: claude-gateway-mcp-bridge-marker
    desc: Claude Gateway container MCP bridge marker
    for: [javascript, typescript]
    if:
      type: text
      substr: "GATEWAY_ORCHESTRATION_TICKET_FILE"

composite_rules:
  - id: claude-gateway-context
    desc: Claude Gateway agent platform application context
    crit: notable
    conf: 0.98
    any:
      - id: claude-gateway-package-json-name
      - id: claude-gateway-npm-archive-name
      - id: claude-gateway-repository-url
      - id: claude-gateway-mcp-bridge-marker
