# Brindle — coding agent supervisor (pawdelta.com/brindle)
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: brindle-wheel-distribution
    desc: Brindle PyPI wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: brindle

  - id: brindle-package-name
    desc: Brindle coding agent package name
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*brindle$'

  - id: brindle-homepage-url
    desc: Brindle coding agent homepage URL
    if:
      type: text
      substr: "pawdelta.com/brindle"

  - id: brindle-supervisor-doc
    desc: Brindle coding agent supervisor summary
    if:
      type: text
      substr: "Run coding agents in parallel"

  - id: brindle-source-path
    desc: Brindle coding agent source path
    for: [python]
    if:
      type: path
      regex: '([/\\]|^)brindle[/\\]'

  - id: brindle-ci-agent-scrub-marker
    desc: Brindle CI agent environment scrub marker
    for: [python]
    if:
      type: text
      regex: "brindle CI.{0,50}scrubs a job's environment"

composite_rules:
  - id: brindle-agent-runtime-context
    desc: Brindle coding agent supervisor context
    crit: exception
    conf: 0.99
    scope: outer
    for: [whl, python, pkginfo, markdown, text]
    any:
      - id: brindle-wheel-distribution
      - id: brindle-package-name
      - id: brindle-homepage-url
      - id: brindle-supervisor-doc
      - id: brindle-source-path
      - id: brindle-ci-agent-scrub-marker
