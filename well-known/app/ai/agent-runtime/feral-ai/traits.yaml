# feral-ai — open-source AI agent with computer use and MCP.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo, javascript]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name feral-ai
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*feral-ai\s*$'

  - id: feral-ai-github-repo
    desc: FERAL-AI/FERAL-AI GitHub repository URL
    if:
      type: text
      substr: FERAL-AI/FERAL-AI

  - id: feral-cli-module
    desc: FERAL CLI interactive terminal agent module
    for: [python]
    if:
      type: text
      substr: FERAL CLI — Interactive Terminal Agent

  - id: wheel-distribution
    desc: feral_ai wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: feral_ai

  - id: feral-logger-namespace
    desc: FERAL Python logger namespace
    for: [python]
    if:
      type: text
      substr: 'getLogger("feral.'

  - id: feral-host-process-token
    desc: FERAL host process token
    for: [python]
    if:
      type: text
      substr: FERAL host process

  - id: feral-protocol-message-type
    desc: FERAL protocol message type
    for: [python]
    if:
      type: text
      substr: FeralMessage

  - id: feral-ui-theme-key
    desc: FERAL UI theme storage key
    for: [javascript]
    if:
      type: text
      substr: feral_ui_theme

  - id: feral-capture-worklet
    desc: FERAL capture audio worklet
    for: [javascript]
    if:
      type: text
      substr: FeralCaptureProcessor

  - id: feral-webui-css-prefix
    desc: FERAL web UI CSS class prefix
    for: [javascript]
    if:
      type: text
      substr: feral-border

composite_rules:
  - id: feral-ai-package
    desc: FERAL open-source AI agent platform package
    crit: notable
    conf: 0.96
    scope: outer
    needs: 2
    any:
      - id: pkginfo-name
      - id: wheel-distribution
      - id: feral-ai-github-repo
      - id: feral-cli-module

  - id: feral-macos-automation-context
    desc: FERAL agent macOS automation source
    crit: exception
    conf: 0.99
    for: [python]
    any:
      - id: feral-logger-namespace
      - id: feral-host-process-token
      - id: feral-protocol-message-type
