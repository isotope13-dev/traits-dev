# Mobius — CLI for pairing and running local AI agent services (@moxt-ai/mobius).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: mobius-package-name
    desc: Mobius CLI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@moxt-ai/mobius"

  - id: mobius-github-repo
    desc: Mobius GitHub repository URL
    for: [package.json, markdown]
    if:
      type: text
      substr: "github.com/moxt-ai/mobius"

  - id: mobius-protocol-import
    desc: Imports @moxt-ai/mobius-protocol
    for: [javascript, typescript]
    if:
      type: text
      substr: "@moxt-ai/mobius-protocol"

  - id: mobius-api-url-marker
    desc: Mobius API URL helper reference
    for: [javascript, typescript]
    if:
      type: text
      substr: "mobiusApiUrl"

composite_rules:
  - id: mobius-agent-package
    desc: Mobius AI agent package
    crit: notable
    conf: 0.98
    for: [package.json, markdown]
    any:
      - id: mobius-package-name
      - id: mobius-github-repo

  - id: mobius-pairing-context
    desc: Mobius local machine pairing context
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: mobius-protocol-import
      - id: mobius-api-url-marker
