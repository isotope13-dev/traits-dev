# explainmyrepo — headless Claude Code agent runner that turns GitHub repos into explainer sites (github.com/stuinfla/Repo-Explainer)
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: explainmyrepo npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "explainmyrepo"

  - id: repo-url
    desc: explainmyrepo GitHub repository reference
    for: [package.json, javascript, markdown]
    if:
      type: text
      substr: "github.com/stuinfla/Repo-Explainer"

  - id: agentic-runner-marker
    desc: explainmyrepo agentic runner marker
    for: [javascript]
    if:
      type: text
      regex: '(?i)(explainmyrepo\s+SKILL\s+as\s+a\s+headless\s+Claude\s+Code|\[agentic-runner\])'

composite_rules:
  - id: explainmyrepo-package-context
    desc: explainmyrepo agentic runner package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: repo-url
      - id: agentic-runner-marker
    needs: 2

  - id: explainmyrepo-runner-context
    desc: explainmyrepo agentic runner context
    crit: exception
    conf: 0.99
    for: [javascript]
    any:
      - id: repo-url
      - id: agentic-runner-marker
