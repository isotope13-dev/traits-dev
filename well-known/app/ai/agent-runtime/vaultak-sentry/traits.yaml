# Vaultak Sentry — wraps an AI agent process and injects language SDKs.
# python-threaded-dynamic-exec is the monitor/event thread plus SDK exec()
# wrapping, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.98
  size_max: 524288000

traits:
  - id: vaultak-sentry-wheel-name
    desc: Vaultak Sentry wheel package name
    crit: notable
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: vaultak_sentry

  - id: vaultak-api-key-env
    desc: Vaultak API key env var
    crit: notable
    for: [python]
    if:
      type: text
      substr: VAULTAK_API_KEY

  - id: inject-vaultak-function
    desc: Vaultak inject_vaultak function name
    crit: notable
    for: [python]
    if:
      type: text
      substr: def inject_vaultak

  - id: vaultak-api-endpoint
    desc: Vaultak default API endpoint URL
    crit: notable
    for: [python, whl, text]
    if:
      type: text
      substr: https://vaultak.com

composite_rules:
  - id: vaultak-sentry-agent-monitor
    desc: Vaultak Sentry AI agent monitor
    crit: notable
    needs: 2
    any:
      - id: vaultak-sentry-wheel-name
      - id: vaultak-api-key-env
      - id: inject-vaultak-function
      - id: vaultak-api-endpoint
