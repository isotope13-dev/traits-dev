# @paigy/harness — coding agent bridge to mobile Paigy app.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, package.json, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: paigy-harness-package-json-name
    desc: Paigy harness package.json name field
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@paigy/harness"

  - id: paigy-harness-npm-archive-name
    desc: Paigy harness npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@paigy/harness"

  - id: paigy-harness-readme-title
    desc: Paigy harness README title
    for: [markdown]
    if:
      type: text
      substr: "# paigy-harness"

  - id: paigy-harness-service-label
    desc: Paigy harness macOS LaunchAgent service label
    for: [javascript, typescript]
    if:
      type: text
      substr: "ai.paigy.host"

  - id: paigy-harness-cli-client-marker
    desc: Paigy harness CLI client marker
    for: [javascript, typescript]
    if:
      type: text
      substr: "paigy-harness host"

composite_rules:
  - id: paigy-harness-context
    desc: Paigy harness coding agent bridge application context
    crit: notable
    conf: 0.98
    any:
      - id: paigy-harness-package-json-name
      - id: paigy-harness-npm-archive-name
      - id: paigy-harness-readme-title
      - id: paigy-harness-service-label
      - id: paigy-harness-cli-client-marker
