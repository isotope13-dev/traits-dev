# shard: the Shardflux command line (https://shardflux.dev).
# Manages serverless agent workspaces and supports importing authenticated
# browser sessions into a cloud workspace via `shard browser import`.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, package.json]
  crit: notable
  conf: 0.98
  size_min: 10

traits:
  - id: shardflux-cli-package-name
    desc: Shardflux CLI package name
    for: [package.json, markdown]
    if:
      type: text
      substr: '"@shardflux/cli"'

  - id: shardflux-cli-homepage
    desc: Shardflux CLI homepage URL
    if:
      type: text
      substr: "https://shardflux.dev"

  - id: shardflux-browser-save-marker
    desc: Shardflux browser save workspace instruction
    for: [javascript, typescript]
    if:
      type: text
      substr: "Sign in through the workspace and use shard browser save."

  - id: shardflux-browser-session-note
    desc: Shardflux browser session security note
    for: [javascript, typescript]
    if:
      type: text
      substr: "browserSessionNote"

composite_rules:
  - id: shardflux-cli-context
    desc: Shardflux CLI tool context
    crit: notable
    conf: 0.98
    any:
      - id: shardflux-cli-package-name
      - id: shardflux-cli-homepage

  - id: shardflux-browser-import-context
    desc: Shardflux browser profile import context
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: shardflux-browser-save-marker
      - id: shardflux-browser-session-note
