# Optio — agent orchestration platform and coding-agent task runner
# (github.com/deai-network/optio).
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, pkginfo]
  crit: notable
  conf: 0.95

traits:
  - id: optio-wheel-distribution
    desc: Optio PyPI wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '^optio[-_]'

  - id: optio-repo-url
    desc: Optio GitHub repository URL
    if:
      type: text
      substr: github.com/deai-network/optio

  - id: optio-package-metadata-name
    desc: Optio PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*optio[-_]'

  - id: optio-package-name
    desc: Optio ecosystem package name reference
    if:
      type: text
      regex: '\boptio[-_](opencode|core|host|agents|claudecode|codex|grok)\b'

  - id: optio-python-import
    desc: Optio Python harness package import
    for: [python]
    if:
      type: text
      regex: '\b(from|import)\s+optio_(opencode|core|host|agents|claudecode|codex|grok)\b'

  - id: optio-task-consumer
    desc: Optio task consumer identifier
    for: [python]
    if:
      type: text
      regex: 'consumer_name=["'']optio-[a-z0-9_-]+["'']'

composite_rules:
  - id: optio-agent-source
    desc: Optio coding-agent harness source context
    any:
      - id: optio-wheel-distribution
      - id: optio-repo-url
      - id: optio-package-metadata-name
      - id: optio-package-name
      - id: optio-python-import
      - id: optio-task-consumer
