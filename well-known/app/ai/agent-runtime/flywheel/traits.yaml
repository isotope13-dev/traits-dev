# flywheel-verify — verifiable LLM evaluation harness and agent runtime
# (https://github.com/HarperZ9/flywheel). Generates sealed offline-checkable receipts
# with optional OpenTimestamps Bitcoin blockchain anchoring and kill-switch IAM credential clearing.
defaults:
  platforms: [unix, windows]
  for: [python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: flywheel-wheel-distribution
    desc: Flywheel wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: flywheel_verify

  - id: flywheel-metadata-name
    desc: Flywheel package metadata name
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?m)^Name:\s*flywheel-verify$'

  - id: flywheel-homepage-url
    desc: Flywheel project homepage URL
    if:
      type: text
      regex: '(?i)harperz9\.github\.io/flywheel'

  - id: flywheel-github-repo
    desc: Flywheel GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/HarperZ9/flywheel'

  - id: flywheel-receipt-tagline
    desc: Flywheel verifiable receipt tagline
    if:
      type: text
      substr: "Run any model, keep a receipt you can recheck offline"

  - id: flywheel-kill-switch-marker
    desc: Flywheel kill-switch credential marker
    for: [python]
    if:
      type: text
      substr: "FLYWHEEL_KILL_SWITCH_LIVE"

  - id: flywheel-credential-revocation-schema
    desc: Flywheel credential revocation schema
    for: [python]
    if:
      type: text
      substr: "flywheel.credential-revocation/v1"

composite_rules:
  - id: flywheel-harness-context
    desc: Flywheel verifiable evaluation harness
    crit: exception
    conf: 0.99
    scope: archive
    for: [whl, python, pkginfo, markdown, text]
    any:
      - id: flywheel-wheel-distribution
      - id: flywheel-metadata-name
      - id: flywheel-homepage-url
      - id: flywheel-github-repo
      - id: flywheel-receipt-tagline
    needs: 2

  - id: flywheel-iam-revocation-context
    desc: Flywheel credential revocation context
    crit: exception
    conf: 0.99
    scope: file
    for: [python]
    any:
      - id: flywheel-kill-switch-marker
      - id: flywheel-credential-revocation-schema
