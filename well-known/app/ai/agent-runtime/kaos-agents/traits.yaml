# kaos-agents — Kelvin Agentic OS (KAOS) runtime by 273 Ventures
# (kelvin.legal / github.com/273v/kaos-agents). Legal-tech agent, MCP, and
# FastAPI surfaces; not a hidden C2 framework.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 2000000

traits:
  - id: pypi-package-name
    desc: kaos-agents PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: kaos-agents

  - id: wheel-distribution
    desc: kaos_agents wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: kaos_agents

  - id: github-repo
    desc: 273v kaos-agents GitHub repository
    if:
      type: text
      substr: github.com/273v/kaos-agents

  - id: product-site
    desc: Kelvin Legal KAOS product site
    if:
      type: text
      substr: https://kelvin.legal

  - id: api-token-env
    desc: KAOS agents API token env
    for: [python]
    if:
      type: text
      substr: KAOS_AGENTS_API_TOKEN

  - id: cli-cost-env
    desc: KAOS agent CLI cost env
    for: [python]
    if:
      type: text
      substr: KAOS_AGENT_MAX_COST_USD

  - id: run-inspector-banner
    desc: kaos-agents Run Inspector banner
    for: [python]
    if:
      type: text
      substr: 'kaos-agents Run Inspector'

composite_rules:
  - id: package-identity
    desc: Recognized kaos-agents KAOS runtime
    any:
      - id: pypi-package-name
      - id: wheel-distribution
      - id: github-repo
      - id: product-site
      - id: api-token-env
      - id: cli-cost-env
      - id: run-inspector-banner
