# Core MCP AI Agent (apt-mcp-agent-setup, alphatechs.ai).
# Enterprise MCP agent runtime and setup infrastructure for AI assistants.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, json, markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: apt-mcp-agent-package-name
    desc: apt-mcp-agent-setup package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: apt-mcp-agent-setup

  - id: apt-mcp-agent-gitlab-repo
    desc: Base MCP AI Agent repo URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: gitlab.com/anhdh/base_mcp_ai_agent

  - id: apt-mcp-agent-gitlab-url-text
    desc: Base MCP AI Agent repo reference
    for: [javascript, markdown, text]
    if:
      type: text
      substr: gitlab.com/anhdh/base_mcp_ai_agent

  - id: apt-mcp-agent-package-gate-marker
    desc: apt-mcp-agent quality gate marker
    for: [javascript]
    if:
      type: text
      substr: "clientInfo: { name: 'apt-package-gate'"

composite_rules:
  - id: apt-mcp-agent-package-context
    desc: Recognized APT MCP agent package context
    crit: exception
    conf: 0.99
    for: [package.json]
    all:
      - id: apt-mcp-agent-package-name
    any:
      - id: apt-mcp-agent-gitlab-repo
      - id: apt-mcp-agent-gitlab-url-text
      - id: apt-mcp-agent-package-gate-marker
