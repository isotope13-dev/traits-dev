# neuralosd — Deterministic-first agentic runtime by Hyperspace Technologies
# (https://github.com/DrOlu/neuralosd, https://neuralos.ng). Provides @probe framework,
# microVM sandbox backends (BoxLite / Microsandbox), MCP server, and host bridge proxy.
defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, text, json, pkginfo, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: wheel-distribution
    desc: neuralosd Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: neuralosd

  - id: pkginfo-name
    desc: PyPI package name neuralosd
    for: [pkginfo, text, json, markdown]
    if:
      type: text
      regex: '(?im)^Name:\s*neuralosd\s*$'

  - id: github-repo
    desc: neuralosd GitHub repository URL
    for: [python, text, json, pkginfo, markdown]
    if:
      type: text
      regex: '(?i)github\.com/DrOlu/neuralosd'

  - id: module-path
    desc: neuralosd package module path
    for: [python, whl, zip, tar]
    if:
      type: path
      regex: '(?i)(^|[/\\])neuralosd([/\\]|$)'

  - id: home-config-dir
    desc: neuralosd home configuration directory path
    for: [python, text]
    if:
      type: text
      regex: '(?i)(~|\$HOME)[/\\]\.neuralosd\b'

  - id: env-var-prefix
    desc: neuralosd environment variable prefix
    for: [python, text]
    if:
      type: text
      substr: 'NEURALOSD_'

  - id: neuralosd-import
    desc: neuralosd module import
    for: [python]
    if:
      type: text
      regex: '(from|import)\s+neuralosd\b'

composite_rules:
  - id: neuralosd-package
    desc: neuralosd agentic runtime package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: pkginfo-name
      - id: github-repo
      - id: module-path
    needs: 2

  - id: neuralosd-source
    desc: neuralosd agentic runtime source file
    crit: notable
    conf: 0.98
    any:
      - id: github-repo
      - id: module-path
      - id: home-config-dir
      - id: env-var-prefix
      - id: neuralosd-import
