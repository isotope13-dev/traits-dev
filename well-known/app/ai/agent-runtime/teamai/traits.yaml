# TeamAI — Tencent team AI experience sharing framework (github.com/Tencent/teamai-cli).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: teamai-npm-package-name
    desc: TeamAI npm package name
    for: [json, text, markdown]
    if:
      type: text
      substr: '@tencent/teamai-cli'

  - id: teamai-git-repository-url
    desc: TeamAI git repository URL
    if:
      type: text
      regex: '(?i)(git\.woa\.com/teamai/teamai-cli|github\.com/Tencent/teamai-cli)'

  - id: teamai-home-constant
    desc: TeamAI home directory constant
    for: [typescript, javascript]
    if:
      type: text
      word: TEAMAI_HOME

  - id: tgit-gongfeng-cli-endpoint
    desc: TGit GongFeng CLI endpoint reference
    for: [typescript, javascript, json, text]
    if:
      type: text
      regex: '(?i)(git\.woa\.com|gongfeng-cli)'

composite_rules:
  - id: teamai-agent-runtime-context
    desc: TeamAI agent runtime and team sharing framework
    crit: exception
    conf: 0.99
    any:
      - id: teamai-npm-package-name
      - id: teamai-git-repository-url
      - id: teamai-home-constant
      - id: tgit-gongfeng-cli-endpoint
    needs: 2
