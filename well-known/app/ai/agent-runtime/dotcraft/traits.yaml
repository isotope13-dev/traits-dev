# DotCraft AI agent runtime (DotHarness/dotcraft).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: dotcraft-csharp-namespace
    desc: DotCraft AI agent runtime C# namespace
    for: [csharp]
    if:
      type: text
      regex: 'namespace\s+DotCraft(\.|\s*;)'

  - id: dotcraft-browser-client-marker
    desc: DotCraft browser automation client marker
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(__dotcraft|dotcraft-browser|dotcraft/browser)'

  - id: dotcraft-source-path
    desc: DotCraft source tree path
    for: [csharp, javascript, typescript]
    if:
      type: path
      regex: '(?i)(^|/)DotCraft\.'

  - id: dotcraft-repo-archive-member
    desc: DotCraft repository archive member
    for: [zip, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)github\.com/dotharness/dotcraft'

composite_rules:
  - id: dotcraft-agent-runtime-context
    desc: DotCraft agent runtime context
    crit: exception
    any:
      - id: dotcraft-csharp-namespace
      - id: dotcraft-browser-client-marker
      - id: dotcraft-source-path
      - id: dotcraft-repo-archive-member
