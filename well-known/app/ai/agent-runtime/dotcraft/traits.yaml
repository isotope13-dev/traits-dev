# DotCraft AI agent runtime (DotHarness/dotcraft).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: dotcraft-csharp-namespace
    desc: DotCraft AI agent runtime C# namespace
    for: [csharp]
    if:
      type: text
      regex: 'namespace\s+DotCraft\.(Satellite|Runtime|AppServer|Harness)'

  - id: dotcraft-browser-client-marker
    desc: DotCraft browser automation client marker
    for: [javascript, typescript]
    if:
      type: text
      regex: 'dotcraft-browser-use|dotcraft/browserUse'

composite_rules:
  - id: dotcraft-agent-runtime-context
    desc: DotCraft agent runtime context
    crit: exception
    any:
      - id: dotcraft-csharp-namespace
      - id: dotcraft-browser-client-marker
