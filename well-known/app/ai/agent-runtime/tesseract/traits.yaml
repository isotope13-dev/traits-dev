# Tesseract AI agent runtime (tesseract.dev, Eightcell Labs).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text]
  crit: notable
  conf: 0.95

traits:
  - id: tesseract-agent-package-name
    desc: Tesseract Agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'tesseract-agent'

  - id: tesseract-domain
    desc: Tesseract agent service domain
    if:
      type: text
      regex: 'https?://(app\.)?tesseract\.dev'

  - id: fineguide-tesseract-package-scope
    desc: Fineguide Tesseract npm package scope
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: '@fineguide-tesseract/'

  - id: tesseract-agent-cli-literal
    desc: Tesseract agent CLI literal
    for: [javascript, typescript]
    if:
      type: text
      word: 'tesseract-agent'
