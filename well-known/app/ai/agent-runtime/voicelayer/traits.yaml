# VoiceLayer — Voice I/O layer for AI coding assistants (local TTS, STT, MCP server).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, plist, package.json, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: voicelayer-package-name
    desc: voicelayer-mcp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "voicelayer-mcp"

  - id: voicelayer-github-repo
    desc: voicelayer GitHub repository URL
    for: [package.json, markdown]
    if:
      type: text
      substr: "github.com/EtanHey/voicelayer"

  - id: voicelayer-launchd-label
    desc: VoiceLayer launchd service label
    platforms: [macos]
    for: [plist]
    if:
      type: text
      substr: "<string>com.voicelayer."

  - id: voicelayer-verify-script-marker
    desc: VoiceLayer verify script path marker
    for: [shell]
    if:
      type: text
      substr: "scripts/voicelayer-verify.sh"

  - id: voicelayer-auto-f5-token
    desc: VoiceLayer auto-F5 variable token
    for: [shell]
    if:
      type: text
      substr: "VOICELAYER_AUTO_F5_"

  - id: voicelayer-benchmark-cli-marker
    desc: VoiceLayer benchmark CLI script marker
    for: [javascript, typescript]
    if:
      type: text
      substr: "scripts/benchmark-stt-decode.ts"

  - id: voicelayer-whisper-server-marker
    desc: VoiceLayer whisper benchmark marker
    for: [javascript, typescript]
    if:
      type: text
      substr: "whisper-server on port"

composite_rules:
  - id: voicelayer-mcp-package
    desc: VoiceLayer MCP server package
    crit: notable
    conf: 0.98
    for: [npm, package.json, markdown]
    scope: outer
    any:
      - id: voicelayer-package-name
      - id: voicelayer-github-repo

  - id: voicelayer-audio-automation-context
    desc: VoiceLayer audio capture verification context
    crit: exception
    conf: 0.99
    for: [shell]
    any:
      - id: voicelayer-verify-script-marker
      - id: voicelayer-auto-f5-token

  - id: voicelayer-benchmark-context
    desc: VoiceLayer speech-to-text benchmark context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: voicelayer-benchmark-cli-marker
      - id: voicelayer-whisper-server-marker
