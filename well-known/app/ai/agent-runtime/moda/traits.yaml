# Moda — AI agent analytics and observability CLI (@moda-ai/cli)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, text, markdown, shell]
  crit: notable
  conf: 0.95

traits:
  - id: moda-cli-package-reference
    desc: Moda CLI npm package reference
    for: [shell, markdown, text, javascript, typescript]
    if:
      type: text
      substr: "@moda-ai/cli"

  - id: moda-cli-package-name
    desc: Moda CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@moda-ai/cli"

  - id: moda-cli-repo-url
    desc: Moda CLI GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/ModaLabs/modaobservability'

  - id: moda-cli-brand-text
    desc: Moda CLI brand description
    if:
      type: text
      substr: "Moda - AI agent analytics and observability"

  - id: moda-cli-api-key-env
    desc: Moda API key environment variable reference
    if:
      type: text
      substr: "MODA_API_KEY"

  - id: moda-cli-prompt-command
    desc: Moda CLI prompts command usage
    if:
      type: text
      regex: '(?i)\bmoda prompts (ab|propose|sync|status|promote)\b'

  - id: moda-skill-identifier
    desc: Moda agent skill identifier
    if:
      type: text
      substr: "moda-cli — let coding agents query Moda analytics via the CLI"

composite_rules:
  - id: moda-cli-context
    desc: Moda AI agent observability CLI context
    crit: exception
    any:
      - id: moda-cli-package-reference
      - id: moda-cli-package-name
      - id: moda-cli-repo-url
      - id: moda-cli-brand-text
      - id: moda-cli-api-key-env
      - id: moda-cli-prompt-command
      - id: moda-skill-identifier
