# @cloudflare/think — Cloudflare Workers chat agent base class from the
# cloudflare/agents monorepo (packages/think). Ships agentic-loop tooling,
# workspace/fetch/execute tools, messenger adapters, and extension loading.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Cloudflare Think npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@cloudflare/think'

  - id: npm-archive-name
    desc: Cloudflare Think npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@cloudflare/think'

  - id: agents-monorepo-repository
    desc: Cloudflare agents GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/cloudflare/agents(\.git)?(/.*)?$'

  - id: agents-npm-repository
    desc: Cloudflare agents npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/cloudflare/agents(\.git)?(/.*)?$'

  - id: think-monorepo-directory
    desc: Think package monorepo directory
    for: [package.json]
    if:
      type: value
      path: repository.directory
      exact: packages/think

  - id: think-agent-import
    desc: Imports Cloudflare Think agent class
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: 'from "@cloudflare/think"'

  - id: think-fetch-tools-module
    desc: Cloudflare Think fetch tools export
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: '@cloudflare/think/tools/fetch'

composite_rules:
  - id: cloudflare-think-package
    desc: Official Cloudflare Think agent package
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: npm-archive-name

  - id: cloudflare-think-monorepo-member
    desc: Cloudflare Think agents monorepo package
    crit: notable
    conf: 0.99
    all:
      - id: cloudflare-think-package
      - id: agents-monorepo-repository
