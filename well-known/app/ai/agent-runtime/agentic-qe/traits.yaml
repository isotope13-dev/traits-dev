# Agentic Quality Engineering (AQE) framework
# Multi-agent testing and verification system for Claude/AI agents
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text, json, npm, package.json, applescript]
  crit: notable
  conf: 0.98
  size_min: 10
  size_max: 50000000

traits:
  - id: agentic-qe-package-name
    desc: agentic-qe npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agentic-qe

  - id: agentic-qe-banner
    desc: agentic-qe brand marker
    for: [javascript, typescript, markdown, text, applescript]
    if:
      type: text
      regex: '(?i)\bAgentic\s+QE\b|AQE\s+Parallel\s+Eval\s+Runner'

  - id: qe-agent-definition-tag
    desc: agentic-qe agent definition tag
    for: [markdown, text, applescript]
    if:
      type: text
      substr: "<qe_agent_definition>"

composite_rules:
  - id: agentic-qe-framework-context
    desc: Recognized agentic-qe quality engineering framework context
    crit: exception
    any:
      - id: agentic-qe-package-name
      - id: agentic-qe-banner
      - id: qe-agent-definition-tag
