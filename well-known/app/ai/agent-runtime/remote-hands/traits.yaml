# remote-hands (`rh`, npm remote-hands-cli) — phone-operated control plane for
# coding and browser agents. The user deploys their own Cloudflare relay, pairs
# a phone, and the daemon drives the user's own Chrome profile over CDP behind
# an approval gate. The debug-socket flags, a LaunchAgent for its desktop HUD
# and Claude skill writes are the product's documented design, not a hijack.
defaults:
  platforms: [macos, linux, windows]
  for: [javascript]
  crit: notable
  conf: 0.95
  size_min: 100000
  size_max: 20000000

traits:
  - id: remote-hands-state-directory
    desc: Remote Hands per-user state directory
    if:
      type: text
      regex: '\.remote-hands[/"''`]'

  - id: remote-hands-hud-launchagent-label
    desc: Remote Hands desktop HUD LaunchAgent label
    platforms: [macos]
    if:
      type: text
      substr: com.remote-hands.hud

composite_rules:
  - id: remote-hands-agent-control-plane
    desc: Remote Hands agent control plane identity
    all:
      - id: remote-hands-state-directory
      - id: remote-hands-hud-launchagent-label
