# Metistry (github.com/foldedspacelabs/metistry) — local AI assistant and
# agent runtime platform by Folded Space Labs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: metistry-package-name
    desc: Metistry npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@foldedspacelabs/metistry(-[a-z0-9]+)?$'

  - id: metistry-git-repo
    desc: Metistry GitHub repository URL
    for: [json, package.json, javascript, typescript, markdown, text]
    if:
      type: text
      substr: github.com/foldedspacelabs/metistry

  - id: metistry-service-label
    desc: Metistry service identifier or import
    for: [javascript, typescript]
    if:
      type: text
      regex: 'com\.foldedspacelabs\.metistry|@foldedspacelabs/metistry'

  - id: metistry-package-path
    desc: Metistry package path component
    for: [npm, tar, zip, javascript, typescript, json, package.json, markdown, text]
    if:
      type: path
      regex: '(@foldedspacelabs[/\\]metistry|@foldedspacelabs-metistry)'

composite_rules:
  - id: metistry-package-context
    desc: Metistry AI assistant runtime context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: metistry-package-name
      - id: metistry-git-repo
      - id: metistry-service-label
      - id: metistry-package-path
