# VibeFlow is an intent-driven local kanban for coding agents (Claude Code, Codex).
# npm: @kw-yeh/vibeflow, repository: https://github.com/KW-Yeh/VibeFlow
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: VibeFlow npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@kw-yeh/vibeflow"

  - id: npm-package-name
    desc: VibeFlow npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@kw-yeh/vibeflow"

  - id: vibeflow-repo-url
    desc: VibeFlow repository URL
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: "github.com/KW-Yeh/VibeFlow"

  - id: vibeflow-task-env
    desc: VibeFlow task environment variable
    for: [javascript, typescript]
    if:
      type: text
      substr: "VIBEFLOW_TASK_ID"

composite_rules:
  - id: coding-agent-kanban-context
    desc: VibeFlow coding agent kanban application context
    conf: 0.99
    any:
      - id: package-name
      - id: npm-package-name
      - id: vibeflow-repo-url
      - id: vibeflow-task-env
