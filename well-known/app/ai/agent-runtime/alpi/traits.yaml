# alpi-agent — personal AI agent network runtime (https://github.com/satoshi-ltd/alpi).
# Local supervisor cleans up stamped child processes via /proc/{pid}/environ.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: alpi-agent wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: alpi_agent

  - id: package-metadata-name
    desc: alpi-agent PyPI Name field
    for: [text, markdown, pkginfo]
    if:
      type: text
      substr: 'Name: alpi-agent'

  - id: module-path
    desc: alpi package module path
    for: [python, whl, zip, tar]
    if:
      type: path
      regex: '(?i)(^|[/\\])alpi[/\\]'

  - id: alpi-github-repo
    desc: alpi GitHub repository URL
    for: [text, markdown, python]
    if:
      type: text
      substr: github.com/satoshi-ltd/alpi

  - id: alpi-alp-protocol
    desc: Alpi Link Protocol marker
    for: [python, text, markdown]
    if:
      type: text
      regex: '\b(ALP\.[123]|Noise_XK)\b'

  - id: alpi-env-marker
    desc: Alpi runtime environment variable marker
    for: [python]
    if:
      type: text
      regex: '\bALPI_(RUN_TIMEOUT_S|OWNER_RUN)\b'

  - id: alpi-module-import
    desc: Alpi package module import
    for: [python]
    if:
      type: text
      regex: '(?m)^(from\s+alpi[a-z0-9_.]{0,50}\s+import|import\s+alpi\b)'

composite_rules:
  - id: alpi-agent-package
    desc: Alpi personal AI agent network runtime package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
      - id: alpi-github-repo
      - id: alpi-alp-protocol
    needs: 2

  - id: alpi-agent-context
    desc: Alpi personal AI agent runtime file context
    crit: exception
    conf: 0.99
    for: [python]
    any:
      - id: alpi-env-marker
      - id: alpi-module-import
      - id: alpi-alp-protocol
