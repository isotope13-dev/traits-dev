# FRAIM agent runtime and hub (fraim / fraim-hub on npm).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: fraim-hub-package-name
    desc: FRAIM Hub npm package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: "fraim-hub"

  - id: fraim-package-name
    desc: FRAIM core npm package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: "fraim"

  - id: fraim-github-repository
    desc: FRAIM GitHub repository URL
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: homepage
      substr: github.com/mathursrus/fraim
