defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  size_min: 1

traits:
  - id: package-metadata
    desc: Ouroboros AI package metadata
    for: [text, python]
    if:
      type: text
      substr: "Name: ouroboros-ai"

  - id: project-description
    desc: Ouroboros AI project description
    for: [text, python]
    if:
      type: text
      substr: "Specification-first workflow engine for AI coding agents"

  - id: wheel-basename
    desc: ouroboros-ai Python wheel basename
    for: [whl]
    if:
      type: basename
      regex: '(?i)^ouroboros_ai-.*-py3-none-any\.whl$'

  - id: console-entrypoint
    desc: ouroboros console_scripts entry point
    for: [text]
    if:
      type: text
      substr: "ouroboros = ouroboros.cli.main:app"

  - id: setup-module-path
    desc: Ouroboros AI setup command module
    for: [python]
    if:
      type: path
      substr: cli/commands/setup.py

  - id: mcp-command-module
    desc: Ouroboros MCP CLI command module
    for: [python]
    if:
      type: path
      substr: cli/commands/mcp.py

  - id: codex-mcp-section-template
    desc: Ouroboros Codex MCP registration template
    for: [python]
    if:
      type: text
      substr: "[mcp_servers.ouroboros]"

  - id: github-repo
    desc: Q00 ouroboros GitHub repository
    for: [text, python, markdown]
    if:
      type: text
      substr: github.com/Q00/ouroboros

composite_rules:
  - id: ouroboros-ai-package
    desc: Ouroboros AI agent workflow package
    crit: notable
    conf: 0.95
    scope: archive
    any:
      - id: package-metadata
      - id: project-description
      - id: wheel-basename
      - id: console-entrypoint
      - id: setup-module-path
      - id: mcp-command-module
      - id: codex-mcp-section-template
      - id: github-repo
    needs: 2
