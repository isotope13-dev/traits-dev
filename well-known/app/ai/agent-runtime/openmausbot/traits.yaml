# OpenMausBot — self-hosted AI agent platform and server (github.com/milind-soni/OpenMausBot).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, json, text, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: openmausbot-product-name
    desc: OpenMausBot product name marker
    if:
      type: text
      regex: '(?i)\bopenmausbot\b'

  - id: openmausbot-github-repo
    desc: OpenMausBot repository URL
    if:
      type: text
      regex: '(?i)github\.com/milind-soni/openmausbot'

  - id: openmausbot-package-name
    desc: OpenMausBot npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: openmausbot

composite_rules:
  - id: openmausbot-runtime-context
    desc: OpenMausBot agent runtime context
    crit: exception
    conf: 0.99
    any:
      - id: openmausbot-product-name
      - id: openmausbot-github-repo
      - id: openmausbot-package-name
