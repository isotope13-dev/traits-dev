# @veai-ru/ai-agent -- Veai AI Agent, Explyt Ltd's proprietary terminal coding
# agent (a pi-based fork whose IDE backend is the Veai "Neo" plugin). It ships
# closed-source, javascript-obfuscator output as copy protection and exposes a
# bash tool, so a brand-new package name with obfuscated code that can spawn
# processes looks like a stage loader. The scope is the vendor's own, the
# package declares a proprietary license, and a public README documents the
# `veai` command.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Veai AI Agent npm package name
    if:
      type: value
      path: name
      exact: '@veai-ru/ai-agent'

  - id: binary-name
    desc: veai binary entrypoint
    if:
      type: value
      path: bin.veai
      exact: dist/cli/index.js

composite_rules:
  - id: veai-ai-agent-package-context
    desc: Official @veai-ru/ai-agent package context
    crit: exception
    conf: 0.99
    all:
      - id: package-name
      - id: binary-name
