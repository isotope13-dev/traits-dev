# @veai-ru/ai-agent, its rebrand @explyt/ai-agent and the @explyt/acp-adapter
# bridge -- Veai / Explyt AI Agent,
# Explyt Ltd's proprietary terminal coding agent (a pi-based fork whose IDE
# backend is the Veai "Neo" plugin). It ships
# closed-source, javascript-obfuscator output as copy protection and exposes a
# bash tool, so a brand-new package name with obfuscated code that can spawn
# processes looks like a stage loader. The scope is the vendor's own, the
# package declares a proprietary license, and a public README documents the
# `veai` (now `explyt`) command.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Veai or Explyt agent package name
    if:
      type: value
      path: name
      regex: '^@(veai-ru|explyt)/(ai-agent|acp-adapter)$'
