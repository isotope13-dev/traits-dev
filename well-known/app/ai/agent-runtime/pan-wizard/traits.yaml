# PanWizard agent orchestration framework (oharms/PanWizard, pan-wizard).
# Multi-agent orchestrator and context engineering layer across Claude Code,
# Gemini CLI, Codex, OpenCode, and Copilot CLI.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: pan-wizard-npm-package-name
    desc: PanWizard npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pan-wizard

  - id: pan-wizard-github-repository
    desc: PanWizard GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/oharms/PanWizard(\.git)?$'

  - id: pan-wizard-core-path
    desc: PanWizard core directory path
    for: [javascript, markdown]
    if:
      type: path
      regex: '(?i)pan-wizard-core[\\/]'

  - id: pan-wizard-identity-string
    desc: PanWizard identifier or environment token
    for: [javascript, markdown, package.json]
    if:
      type: text
      regex: '\b(pan-wizard|PanWizard|PAN_PROVIDER|PAN_SOURCE_ROOT)\b'

composite_rules:
  - id: pan-wizard-package
    desc: PanWizard npm package
    crit: exception
    for: [package.json]
    all:
      - id: pan-wizard-npm-package-name
      - id: pan-wizard-github-repository

  - id: pan-wizard-runtime-file
    desc: PanWizard runtime file
    crit: exception
    for: [javascript]
    any:
      - id: pan-wizard-core-path
      - id: pan-wizard-identity-string

  - id: pan-wizard-agent-runtime-context
    desc: PanWizard agent runtime context
    crit: exception
    any:
      - id: pan-wizard-package
      - id: pan-wizard-runtime-file
