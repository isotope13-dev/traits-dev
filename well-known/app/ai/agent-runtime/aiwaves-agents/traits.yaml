# AIWaves Agents — Autonomous language agent framework (https://github.com/aiwaves-cn/agents)
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: wheel-distribution
    desc: ai-agents wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ai_agents

  - id: package-metadata-name
    desc: ai-agents PyPI Name field
    for: [text, markdown, pkginfo]
    if:
      type: text
      substr: "Name: ai-agents"

  - id: repo-url
    desc: AIWaves agents GitHub repository reference
    for: [python, text, markdown]
    if:
      type: text
      substr: "github.com/aiwaves-cn/agents"

  - id: copyright-header
    desc: AIWaves Inc copyright header
    for: [python]
    if:
      type: text
      substr: "Copyright 2023  The AIWaves Inc. team"

  - id: agent-docstring
    desc: AIWaves autonomous agent docstring marker
    for: [python]
    if:
      type: text
      substr: "helper functions for an LLM autonoumous agent"

composite_rules:
  - id: aiwaves-agents-runtime
    desc: Recognized AIWaves autonomous language agent framework context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: repo-url
      - id: copyright-header
      - id: agent-docstring
