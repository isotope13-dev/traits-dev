# Morula (@arcships/morula-runtime) is a local agent runtime: a daemon and portal
# that run coding-agent sessions and register a Dim plugin, with an optional
# macOS LaunchAgent for daemon autostart. It also reads the user's Claude Code
# settings to find existing credentials and projects skills into task
# workspaces, which pairs LaunchAgent writes with Claude configuration paths.
defaults:
  platforms: [unix]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 10000
  size_max: 20000000

traits:
  - id: daemon-autostart-label
    desc: Morula runtime daemon LaunchAgent label
    if:
      type: text
      substr: com.morula.runtime.daemon

  - id: package-name
    desc: Morula runtime npm package name
    for: [package.json]
    size_min: 100
    size_max: 200000
    if:
      type: value
      path: name
      exact: '@arcships/morula-runtime'

composite_rules:
  # The package ships a postinstall that registers the runtime's Dim plugin and
  # skills (best effort, never failing the install), which archive-level install
  # hook rules read across files; this ties the manifest to the bundle.
  - id: archive-context
    desc: Morula runtime npm package
    crit: exception
    scope: archive
    for: [package.json, javascript, npm]
    all:
      - id: package-name
      - id: daemon-autostart-label
