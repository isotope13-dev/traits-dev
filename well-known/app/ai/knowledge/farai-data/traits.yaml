# farai-data is the knowledge corpus and Agent Skills channel for FarAI.
# It legitimately includes security references, CTF writeup knowledge,
# reverse-shell reference documentation, and knowledge-base ingestion tools.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, json, zip, tar, shell]
  crit: notable
  conf: 0.99

traits:
  - id: repository-member-path
    desc: farai-data repository member path
    for: [scripts, source, markdown, text, json, zip, tar, python, shell, batch, powershell]
    if:
      type: path
      regex: '(?i)(pajarori[\\/]farai-data|farai-data(@|-|[\\/]))'

  - id: repository-url
    desc: farai-data repository URL
    for: [markdown, text, json, shell]
    if:
      type: text
      substr: github.com/pajarori/farai-data

  - id: data-builder-package-name
    desc: farai-data-builder package name
    for: [json, text]
    if:
      type: text
      substr: farai-data-builder

  - id: ctfknow-provenance
    desc: CTFKnow dataset provenance reference
    for: [json, text, markdown]
    if:
      type: text
      substr: ctfknow-mit

composite_rules:
  - id: farai-data-repository
    desc: Recognized farai-data knowledge and skills repository
    crit: exception
    for: [scripts, source, markdown, text, json, zip, tar, shell, powershell]
    any:
      - id: repository-member-path
      - id: repository-url
      - id: data-builder-package-name
      - id: ctfknow-provenance
