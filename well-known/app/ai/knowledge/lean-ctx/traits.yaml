# lean-ctx (LeanCTX) is a local-first context-compression layer for AI coding
# agents.  Its source tree intentionally includes an optional browser
# extension, local agent integrations, a loopback proxy, and opt-in cloud
# synchronization; those capabilities are product features, not malware.
defaults:
  platforms: [unix, windows]
  for: [source, documents, manifests, python, rust, shell, markdown, tar, gz, elf, macho, pe, binaries, conda, zst]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 500000000

traits:
  - id: source-tree-path
    desc: lean-ctx source release tree path
    if:
      type: path
      regex: 'lean-ctx-[0-9]'
  - id: secret-expiry-script
    desc: lean-ctx GitHub secret-rotation expiry script
    for: [python]
    if:
      type: basename
      exact: check-secret-expiry.py

  - id: upstream-repository
    desc: lean-ctx upstream repository reference
    for: [rust, shell, markdown]
    if:
      type: text
      substr: 'github.com/yvgude/lean-ctx'

  - id: cargo-package-name
    desc: lean-ctx Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: lean-ctx

  - id: browser-extension-name
    desc: lean-ctx browser extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      regex: '^lean-ctx\s+—\s+Token Compression$'

  - id: binary-name
    desc: lean-ctx executable binary name
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      exact: lean-ctx

  - id: binary-identity
    desc: lean-ctx application binary identity
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: 'LEAN_CTX_PROXY_TOKEN|LEAN_CTX_SHADOW|github\.com/yvgude/lean-ctx'

  - id: conda-package-name
    desc: lean-ctx conda package path
    for: [conda, zst, tar]
    if:
      type: path
      regex: '(?i)(^|[\\/])(pkg-)?lean-ctx-[0-9]'

composite_rules:
  - id: source-tree-identity
    desc: Recognized lean-ctx source tree
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: source-tree-path
    any:
      - id: upstream-repository
      - id: secret-expiry-script
      - id: cargo-package-name

  - id: binary-context
    desc: Recognized lean-ctx binary context
    crit: exception
    conf: 0.99
    all:
      - id: binary-name
      - id: binary-identity

  - id: package-context
    desc: Recognized lean-ctx package distribution
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: conda-package-name
    any:
      - id: binary-context
      - id: source-tree-identity
      - id: upstream-repository
