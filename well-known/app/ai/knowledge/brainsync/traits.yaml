# BrainSync — dawoodahmad's VS Code AI memory/MCP extension with local vault.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: brainsync-vsix-name
    desc: Path contains BrainSync publisher and name
    if:
      type: path
      regex: '(?i)dawoodahmad\.brainsync'

  - id: brainsync-package-name
    desc: Text contains a BrainSync name field
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"brainsync"'

  - id: brainsync-vault-marker
    desc: BrainSync universal vault key derivation marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      substr: brainsync-universal-vault-key

  - id: brainsync-pattern-detector-marker
    desc: BrainSync pattern detector runtime marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      substr: patternDetector

composite_rules:
  - id: brainsync-vscode-extension
    desc: BrainSync AI memory and MCP VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [vsix, javascript, json, markdown, package.json, vsix-manifest]
    all:
      - id: metadata/lang/source/syntax/key-value::dawoodahmad-publisher-field
    any:
      - id: brainsync-vsix-name
      - id: brainsync-package-name
      - id: brainsync-vault-marker
      - id: brainsync-pattern-detector-marker
