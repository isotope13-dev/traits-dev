# Hivevault (npm hivevault) is an open-source MCP server and HTTP API over a
# git-backed Markdown memory vault shared by AI coding sessions, with a
# documented opt-in daemon (`hivevault service install`) and client tokens.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: hivevault-identifier
    desc: Hivevault identifier
    if:
      type: text
      regex: '(?i)\bhivevault\b'

  - id: package-name
    desc: Hivevault npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: hivevault

  - id: engine-token-env
    desc: Hivevault engine token environment variable
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: HIVEVAULT_TOKEN

  - id: daemon-pid-marker
    desc: Hivevault daemon pid-file path
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: .vault/daemon.pid

composite_rules:
  - id: hivevault
    desc: Hivevault AI memory vault
    crit: notable
    conf: 0.98
    all:
      - id: hivevault-identifier
    any:
      - id: package-name
      - id: engine-token-env
      - id: daemon-pid-marker
