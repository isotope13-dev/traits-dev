# go-dev — ClawHub reference skill for an opinionated Go dev stack.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: skill-frontmatter-name
    desc: go-dev agent skill name field
    for: [markdown]
    if:
      type: text
      regex: '(?m)^name:\s*go-dev\s*$'

  - id: tenequm-skills-upstream
    desc: tenequm skills monorepo upstream path
    if:
      type: text
      substr: github.com/tenequm/skills

composite_rules:
  - id: go-dev-skill-identity
    desc: go-dev ClawHub Go stack reference skill
    crit: notable
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown]
    all:
      - id: skill-frontmatter-name
    any:
      - id: tenequm-skills-upstream
