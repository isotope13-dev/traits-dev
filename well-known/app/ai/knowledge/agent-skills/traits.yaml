defaults:
  platforms: [unix, windows]
  for: [markdown, text]

traits:
  - id: skill-definition-file
    desc: Agent Skills SKILL.md definition file
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: SKILL.md
  - id: agent-zero-source-path
    desc: Agent Zero framework source tree path
    crit: notable
    conf: 0.98
    for: [markdown, javascript, python, shell, text, archives]
    if:
      type: path
      regex: '(?i)agent-zero'
