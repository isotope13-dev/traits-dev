# Siluzan TSO — ClawHub agent skill for the siluzan-tso-cli npm package.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text]
  crit: notable
  conf: 0.99

traits:
  - id: skill-frontmatter-name
    desc: siluzan-tso agent skill name field
    for: [markdown]
    if:
      type: text
      regex: '(?m)^name:\s*siluzan-tso\s*$'

  - id: siluzan-cli-package-name
    desc: siluzan-tso-cli npm package name
    for: [markdown, shell]
    if:
      type: text
      substr: siluzan-tso-cli

  - id: siluzan-website-domain
    desc: Siluzan product website hostname
    if:
      type: text
      substr: siluzan.com

  - id: bundled-install-script-path
    desc: Siluzan skill bundled scripts/install path
    if:
      type: path
      regex: '(^|[\\/])scripts[\\/]install\.(sh|ps1)$'

composite_rules:
  - id: siluzan-tso-skill-identity
    desc: Siluzan TSO ClawHub marketing skill identity
    crit: notable
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown, shell]
    any:
      - id: skill-frontmatter-name
      - id: siluzan-cli-package-name

  - id: siluzan-tso-installer-context
    desc: Siluzan TSO documented npm installer script context
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, tar, shell]
    all:
      - id: siluzan-tso-skill-identity
      - id: bundled-install-script-path
