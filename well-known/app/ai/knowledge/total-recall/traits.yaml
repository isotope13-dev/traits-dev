# Total Recall (github.com/gregiteen/total-recall) is an open-source portable
# SSSS AI memory and local retrieval system with CLI, web UI, and local relay daemon.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: total-recall-identifier
    desc: Total Recall identifier
    if:
      type: text
      regex: '(?i)\btotal-recall\b'

  - id: package-name
    desc: Total Recall npm package name
    for: [package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"total-recall-brain"'

  - id: repository-url
    desc: Total Recall repository URL
    for: [package.json, markdown, javascript]
    if:
      type: text
      substr: 'github.com/gregiteen/total-recall'

  - id: relay-cli-marker
    desc: Total Recall relay daemon CLI marker
    for: [javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)total-recall\s+relay'

  - id: skill-config-path
    desc: Total Recall agent skill config path
    for: [javascript, typescript, markdown]
    if:
      type: text
      substr: '.agent/skills/total-recall'

composite_rules:
  - id: total-recall
    desc: Total Recall AI memory system
    crit: notable
    conf: 0.98
    all:
      - id: total-recall-identifier
    any:
      - id: package-name
      - id: repository-url
      - id: relay-cli-marker
      - id: skill-config-path
