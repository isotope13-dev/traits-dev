defaults:
  platforms: [linux, macos, windows]
  for: [python]

# This is the pool-side implementation of Animica's Stratum service.  It
# accepts miner sessions and optionally enables an operator-controlled XMR
# compatibility path; it does not itself launch a miner or consume host CPU
# for proof of work.
traits:
  - id: stratum-pool-server-class
    desc: Animica Stratum pool server class
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'class\s+StratumPoolServer\s*:'

  - id: stratum-server-module-import
    desc: Stratum server implementation import
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: mining.stratum_server

  - id: pool-metrics-class
    desc: Animica pool accounting class
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'class\s+PoolMetrics\s*:'

  - id: xmr-pool-environment-toggle
    desc: Animica XMR pool opt-in toggle
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: ANIMICA_POOL_XMR_ENABLED

composite_rules:
  - id: animica-stratum-pool-context
    desc: Recognized Animica Stratum pool implementation
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/ai/knowledge/animica::source-member-marker
      - id: stratum-server-module-import
    any:
      - id: stratum-pool-server-class
      - id: pool-metrics-class
