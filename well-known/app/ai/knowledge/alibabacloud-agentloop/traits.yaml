# Alibaba Cloud AgentLoop management agent skill (ClawHub / skills.aliyun.com).
defaults:
  platforms: [unix, windows]
  for: [markdown, zip, python, javascript, typescript, text]
  crit: notable
  conf: 0.99

traits:
  - id: skill-router-name
    desc: AgentLoop management skill manifest name
    for: [markdown]
    if:
      type: text
      substr: "name: alibabacloud-agentloop-management"

  - id: alibaba-agent-skills-user-agent
    desc: AlibabaCloud Agent Skills CLI user-agent prefix
    for: [python, markdown, javascript, typescript, text]
    if:
      type: text
      substr: "AlibabaCloud-Agent-Skills/"

  - id: agentloop-help-aliyun-doc-fetch
    desc: AgentLoop doc fetcher help.aliyun.com base URL
    for: [python]
    if:
      type: text
      substr: "help.aliyun.com"

composite_rules:
  - id: archive-context
    desc: Alibaba Cloud AgentLoop management agent skill
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, markdown, python]
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: skill-router-name
    any:
      - id: alibaba-agent-skills-user-agent
      - id: agentloop-help-aliyun-doc-fetch
