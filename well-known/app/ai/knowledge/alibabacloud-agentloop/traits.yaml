defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - zip
  - python
  - javascript
  - typescript
  - text
  crit: notable
  conf: 0.99
traits:
- id: skill-router-name
  desc: AgentLoop management skill manifest name
  for:
  - markdown
  if:
    type: text
    substr: 'name: alibabacloud-agentloop-management'
- id: alibaba-agent-skills-user-agent
  desc: AlibabaCloud Agent Skills CLI user-agent prefix
  for:
  - python
  - markdown
  - javascript
  - typescript
  - text
  if:
    type: text
    substr: AlibabaCloud-Agent-Skills/
- id: agentloop-help-aliyun-doc-fetch
  desc: AgentLoop doc fetcher help.aliyun.com base URL
  for:
  - python
  if:
    type: text
    substr: help.aliyun.com
