# OOMOL oo connector skills — ClawHub Agent Skills that call third-party APIs
# through the OOMOL oo CLI with server-side credential injection.
defaults:
  platforms: [unix, windows]
  for: [markdown, zip]
  crit: notable
  conf: 0.98

traits:
  - id: oo-connector-run-instruction
    desc: oo CLI connector run instruction
    for: [markdown]
    if:
      type: text
      substr: 'oo connector run'

  - id: oo-connector-schema-instruction
    desc: oo CLI connector schema instruction
    for: [markdown]
    if:
      type: text
      substr: 'oo connector schema'

  - id: oomol-author-field
    desc: OOMOL skill author metadata
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\s*author:\s*"OOMOL"'

  - id: oomol-restricted-bash-tools
    desc: OOMOL skill restricted Bash scope
    for: [markdown]
    if:
      type: text
      regex: '(?m)^allowed-tools:\s*\[Bash\(oo \*\)\]'

  - id: oomol-cli-installer-host
    desc: OOMOL official CLI installer host
    for: [markdown]
    if:
      type: text
      substr: 'cli.oomol.com/install'

  - id: oomol-oo-cli-repository
    desc: OOMOL oo CLI GitHub repository
    for: [markdown]
    if:
      type: text
      substr: 'github.com/oomol-lab/oo-cli'

composite_rules:
  - id: oomol-oo-connector-skill-identity
    desc: OOMOL oo connector Agent Skill
    crit: notable
    conf: 0.99
    all:
      - id: oo-connector-run-instruction
      - id: oo-connector-schema-instruction
      - id: oomol-author-field
    any:
      - id: oomol-restricted-bash-tools
      - id: oomol-cli-installer-host
      - id: oomol-oo-cli-repository

  - id: oomol-oo-connector-skill-context
    desc: OOMOL oo connector skill documentation
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: oomol-oo-connector-skill-identity
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: well-known/app/ai/knowledge/agent-skills::skill-definition-file
