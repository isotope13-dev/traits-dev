# Riffkit — published agent skill for the Riffkit short-video SaaS (riffkit.ai).
# Bundles SKILL.md, HEARTBEAT.md self-sync, and API reference docs for agents.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: skill-frontmatter-name
    desc: Riffkit skill frontmatter name
    for: [markdown]
    if:
      type: text
      regex: '(?m)^name:\s*riffkit\s*$'

  - id: official-base-url
    desc: Riffkit official API base URL
    if:
      type: text
      substr: https://riffkit.ai

  - id: session-credential-guardrail
    desc: Riffkit session credential handling rule
    for: [markdown]
    if:
      type: text
      substr: vee_session is a login credential

  - id: heartbeat-version-sync-marker
    desc: Riffkit HEARTBEAT remote version check
    for: [markdown]
    if:
      type: text
      substr: /SKILL.json

composite_rules:
  - id: archive-context
    desc: Riffkit published agent skill bundle context
    crit: exception
    conf: 0.99
    for: [zip, tar, markdown, text]
    scope: archive
    all:
      - id: skill-frontmatter-name
    any:
      - id: official-base-url
      - id: session-credential-guardrail
      - id: heartbeat-version-sync-marker
