defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - markdown
  crit: notable
  conf: 0.98
traits:
- id: context-tree-package-name
  desc: Context Tree npm package name
  for:
  - package.json
  if:
    type: text
    regex: (?i)"name"\s*:\s*"@first-tree-ai/context-tree"
- id: context-tree-repository
  desc: Context Tree repository URL
  for:
  - package.json
  - markdown
  if:
    type: text
    substr: github.com/first-tree-ai/context-tree
- id: context-tree-cli-name
  desc: Context Tree CLI command name
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \.name\(["']context-tree["']\)
- id: context-tree-skill-prefix
  desc: Context Tree owned skill prefix
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: context-tree-
