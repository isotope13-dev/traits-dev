# Topos node (PyPI topos-node) is a local personal-data engine. Its documented
# connectors read the operator's own Contacts and iMessage database and sync
# encrypted ops to the account control plane. The logger namespace is in each
# of those modules, so a same-file exclusion can see it.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: topos-logger-namespace
    desc: Topos node logger namespace
    if:
      type: text
      substr: 'logging.getLogger("topos'
