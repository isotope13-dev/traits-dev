# QuickPrompt is a local-first VS Code prompt and clipboard-history extension.
# Its package also contains a user-invoked stdio MCP server and skill generator.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: QuickPrompt VS Code package name
    if:
      type: value
      path: name
      exact: quick-prompt

  - id: package-publisher
    desc: QuickPrompt VS Code publisher
    if:
      type: value
      path: publisher
      exact: winterdrive

  - id: upstream-repository
    desc: QuickPrompt upstream repository
    if:
      type: value
      path: repository.url
      regex: 'github\.com/winterdrive/QuickPrompt(\.git)?([/?#]|$)'

composite_rules:
  - id: vscode-extension-identity
    desc: Recognized QuickPrompt VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
      - id: upstream-repository
