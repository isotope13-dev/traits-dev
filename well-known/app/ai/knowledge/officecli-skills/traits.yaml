# OfficeCLI ClawHub agent skills — documentation for the OfficeCLI xlsx tool.
defaults:
  platforms: [unix, windows]
  for: [markdown, zip]
  crit: notable
  conf: 0.98

traits:
  - id: officecli-installer-host
    desc: OfficeCLI official installer CDN host
    for: [markdown]
    if:
      type: text
      substr: 'd.officecli.ai/install'

  - id: officecli-github-releases
    desc: OfficeCLI GitHub releases fallback
    for: [markdown]
    if:
      type: text
      substr: 'github.com/iOfficeAI/OfficeCLI'

composite_rules:
  - id: officecli-agent-skill-identity
    desc: OfficeCLI ClawHub agent skill documentation
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: well-known/app/ai/knowledge/agent-skills::skill-definition-file
    any:
      - id: officecli-installer-host
      - id: officecli-github-releases

  - id: officecli-skill-context
    desc: First-party OfficeCLI skill install documentation
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: officecli-agent-skill-identity
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: well-known/app/ai/knowledge/agent-skills::skill-definition-file
