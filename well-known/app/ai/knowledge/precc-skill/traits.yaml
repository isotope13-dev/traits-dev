# PRECC — ClawHub skill for the peri-a-i/precc-cc Claude Code hook.
defaults:
  platforms: [unix]
  for: [markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: skill-frontmatter-name
    desc: precc agent skill name field
    for: [markdown]
    if:
      type: text
      regex: '(?m)^name:\s*precc\s*$'

  - id: precc-upstream-repository
    desc: PRECC GitHub repository reference
    if:
      type: text
      substr: github.com/peri-a-i/precc-cc

composite_rules:
  - id: precc-skill-identity
    desc: PRECC ClawHub agent skill identity
    crit: notable
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown]
    any:
      - id: skill-frontmatter-name
      - id: precc-upstream-repository

  - id: precc-documented-installer
    desc: PRECC documented peria.ai installer one-liner
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, tar, markdown]
    all:
      - id: precc-skill-identity
      - id: micro-behaviors/os/package-manager/installer-script::precc-peria-install-script-url
