# Cartograph is a local-first widget registry and validation CLI for AI-agent
# projects.  The package intentionally manages agent instructions and can
# exchange widget archives with its optional registry; those are product
# capabilities, not hidden payload behavior.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: package-name
    desc: PyPI package name cartograph-cli
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*cartograph-cli\s*$'

  - id: upstream-repository
    desc: benteigland11 Cartograph repository URL
    if:
      type: text
      regex: 'github\.com/benteigland11/Cartograph([/\.\s"''`?#]|$)'
      case_insensitive: true

  - id: widget-registry-description
    desc: Cartograph AI widget registry description
    for: [pkginfo]
    if:
      type: text
      substr: A local first reusable code registry for AI agents

composite_rules:
  - id: package-identity
    desc: Cartograph AI widget registry package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
    any:
      - id: upstream-repository
      - id: widget-registry-description
