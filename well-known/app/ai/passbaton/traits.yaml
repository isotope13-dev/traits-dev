defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: passbaton npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: passbaton
- id: repository-url
  desc: passbaton GitHub repository URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    substr: github.com/leesgit/passbaton
- id: hook-command-prefix
  desc: passbaton hook command prefix
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: passbaton-hook-
composite_rules:
- id: passbaton-product-marker
  desc: passbaton package name or hook prefix
  crit: notable
  conf: 0.99
  for:
  - package.json
  - npm
  - javascript
  - typescript
  scope: archive
  any:
  - id: package-name
  - id: hook-command-prefix
