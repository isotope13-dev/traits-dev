# passbaton — local session-memory MCP for Claude Code, Codex, and Gemini.
# The published installer writes the user's own client configs. Require the
# package name and the upstream repository together.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: passbaton npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: passbaton

  - id: repository-url
    desc: passbaton GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/leesgit/passbaton

composite_rules:
  - id: archive-context
    desc: passbaton session-memory package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: repository-url
