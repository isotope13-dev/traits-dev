# passbaton — local session-memory MCP for Claude Code, Codex, and Gemini.
# The published installer writes the user's own client configs. Require the
# upstream repository together with either the package name or the hook
# command prefix the installer writes. A renamed package that still carries
# that installer is the same product; a repo URL alone is not.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: passbaton npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: passbaton

  - id: repository-url
    desc: passbaton GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/leesgit/passbaton

  - id: hook-command-prefix
    desc: passbaton hook command prefix
    for: [javascript, typescript]
    if:
      type: text
      substr: 'passbaton-hook-'

composite_rules:
  - id: passbaton-product-marker
    desc: passbaton package name or hook prefix
    crit: notable
    conf: 0.99
    for: [package.json, npm, javascript, typescript]
    scope: archive
    any:
      - id: package-name
      - id: hook-command-prefix

  - id: archive-context
    desc: passbaton session-memory package
    crit: exception
    conf: 0.99
    for: [package.json, npm, javascript, typescript]
    scope: archive
    all:
      - id: repository-url
      - id: passbaton-product-marker
