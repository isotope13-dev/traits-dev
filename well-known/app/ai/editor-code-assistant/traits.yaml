defaults:
  platforms: [unix, windows]
  for: [vsix-manifest, archive]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ECA VS Code extension identity
    if:
      type: value
      path: vsix.identity.id
      exact: eca

  - id: package-publisher
    desc: ECA VS Code publisher identity
    if:
      type: value
      path: vsix.identity.publisher
      exact: editor-code-assistant

composite_rules:
  - id: eca-vscode-extension
    desc: Recognized ECA VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: package-publisher
