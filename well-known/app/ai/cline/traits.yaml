defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, shell, vsix-manifest]
  crit: baseline
  conf: 0.99

traits:
  - id: package-name
    desc: Cline VS Code package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^cline(-nightly)?$'

  - id: claude-dev-package-name
    desc: Cline VS Code legacy package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: claude-dev

  - id: cline-nightly-vsix
    desc: Cline Nightly VSIX archive context
    crit: notable
    conf: 0.99
    for: [vsix]
    if:
      type: basename
      regex: '(?i)^saoudrizwan\.cline-nightly-.*\.vsix$'

  - id: display-name
    desc: Cline VS Code display name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: displayName
      exact: Cline

  - id: publisher
    desc: Cline VS Code publisher identifier
    crit: notable
    for: [package.json]
    if:
      type: value
      path: publisher
      exact: saoudrizwan

  - id: source-repository
    desc: Cline official source repository
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/cline/cline

  - id: development-script
    desc: Cline extension development script
    crit: notable
    for: [javascript, shell]
    if:
      type: basename
      regex: '^(run-extension-host\.sh|publish-marketplace\.mjs)$'
      case_insensitive: true

  - id: add-endpoints-vsix-script
    desc: Cline VSIX endpoints pack script
    crit: notable
    for: [shell]
    if:
      type: basename
      exact: add-endpoints-to-vsix.sh

  - id: add-endpoints-jetbrains-script
    desc: Cline JetBrains endpoints pack script
    crit: notable
    for: [shell]
    if:
      type: basename
      exact: add-endpoints-to-jetbrains.sh

  - id: add-endpoints-npm-script
    desc: Cline npm endpoints pack script
    crit: notable
    for: [shell]
    if:
      type: basename
      exact: add-endpoints-to-npm.sh

  - id: build-python-proto-script
    desc: Cline Python proto build script
    crit: notable
    for: [javascript]
    if:
      type: basename
      exact: build-python-proto.mjs

  - id: build-proto-script
    desc: Cline TypeScript proto build script
    crit: notable
    for: [javascript]
    if:
      type: basename
      exact: build-proto.mjs

  - id: build-tests-script
    desc: Cline esbuild test bundle script
    crit: notable
    for: [javascript]
    if:
      type: basename
      exact: build-tests.js

  # Cline's parser is an application integration, not the @cline/llms
  # provider catalog.  Keep that marker in the application namespace.
  - id: cline-parser-model-marker
    desc: Cline integration parser reads model identifiers
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: '\bCline\b.{0,60}\bmodel\b|\bmodel\b.{0,60}\bCline\b'

composite_rules:
  - id: cline-cdp-browser-context
    desc: Cline integrated CDP browser automation context
    crit: exception
    conf: 0.99
    for: [javascript, vsix, package.json]
    all:
      - id: publisher
    any:
      - id: source-repository
      - id: package-name
      - id: claude-dev-package-name
      - id: cline-nightly-vsix
