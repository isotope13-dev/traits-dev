# openusage-cli — Linux backend for OpenUsage AI provider usage plugins.
defaults:
  platforms: [unix]
  for: [cargo.toml, markdown, rust, javascript, typescript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: cargo-package-name
    desc: openusage-cli Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: openusage-cli

  - id: plugin-install-path
    desc: openusage-cli packaged plugin directory path
    for: [cargo.toml, markdown]
    if:
      type: text
      substr: share/openusage-cli/openusage-plugins

  - id: config-namespace
    desc: openusage-cli XDG config namespace
    for: [rust, markdown]
    if:
      type: text
      substr: ProjectDirs::from("com", "openusage", "openusage-cli")

  - id: openusage-cursor-usage-endpoint
    desc: OpenUsage Cursor usage dashboard API endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: GetCurrentPeriodUsage

  - id: openusage-cursor-plugin-handle
    desc: OpenUsage Cursor provider plugin handle
    for: [javascript, typescript]
    if:
      type: text
      substr: __openusage_plugin

composite_rules:
  - id: openusage-cli-archive-context
    desc: Recognized OpenUsage CLI plugin runner context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: cargo-package-name
      - id: plugin-install-path

  - id: openusage-cursor-plugin-context
    desc: Recognized OpenUsage Cursor provider plugin context
    crit: exception
    conf: 0.99
    all:
      - id: openusage-cursor-usage-endpoint
      - id: openusage-cursor-plugin-handle
