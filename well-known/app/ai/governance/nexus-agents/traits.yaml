# nexus-agents — MCP governance substrate for AI coding agents
# (github.com/nexus-substrate/nexus-agents). Ships adversarial test corpora,
# Semgrep installs, and cited supply-chain incident IOCs as defensive reference.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown, text]
  crit: notable
  conf: 0.99
  size_max: 100000000

traits:
  - id: npm-package-name
    desc: nexus-agents npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: nexus-agents

  - id: mcp-registry-name
    desc: nexus-agents MCP registry identifier
    for: [package.json]
    if:
      type: value
      path: mcpName
      exact: io.github.nexus-substrate/nexus-agents

  - id: upstream-repository
    desc: nexus-substrate upstream GitHub repository
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: github.com/nexus-substrate/nexus-agents

  - id: nexus-agents-runtime-data-dir
    desc: Nexus agents per-user data directory path
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: .nexus-agents

  - id: nexus-agents-config-env-prefix
    desc: Nexus agents MCP timeout environment variable
    for: [javascript, typescript]
    if:
      type: text
      substr: NEXUS_TIMEOUT_MCP

  - id: nexus-agents-product-tagline
    desc: Nexus agents governance product description
    for: [javascript, typescript, markdown, text, package.json]
    if:
      type: text
      substr: Governance substrate for AI coding agents

  - id: nexus-agents-generated-artifact-footer
    desc: Nexus agents generated benchmark artifact banner
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: Generated by nexus-agents

  - id: nexus-agents-clawguard-telemetry
    desc: Nexus agents ClawGuard violation telemetry event
    for: [javascript, typescript]
    if:
      type: text
      substr: security.clawguard_violation

  - id: nexus-agents-clawguard-emitter
    desc: Nexus agents ClawGuard violation emitter
    for: [javascript, typescript]
    if:
      type: text
      substr: emitClawGuardViolation

  - id: nexus-agents-adversarial-runtime
    desc: Nexus agents adversarial testing runtime string
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: (?i)\badversarial\b.{0,40}\bnexus\b|\bnexus\b.{0,40}\badversarial\b

  - id: nexus-llm-threat-taxonomy-labels
    desc: Nexus agents LLM threat category label list
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: (?i)adversarial.{0,60}jailbreak

composite_rules:
  - id: nexus-agents-governance-context
    desc: Nexus agents governance MCP package context
    crit: exception
    conf: 0.99
    any:
      - id: npm-package-name
      - id: mcp-registry-name
      - id: upstream-repository
      - id: nexus-agents-runtime-data-dir
      - id: nexus-agents-config-env-prefix
      - id: nexus-agents-product-tagline
      - id: nexus-agents-generated-artifact-footer
      - id: nexus-agents-clawguard-telemetry
      - id: nexus-agents-clawguard-emitter
      - id: nexus-agents-adversarial-runtime
      - id: nexus-llm-threat-taxonomy-labels
