# Plato SDK (plato-sdk-v2) — Python SDK for the Plato simulator platform
# (plato.so). Bundled EnvGen Recorder is a session-capture Chrome extension
# for authoring sims, not a steal-all-URLs implant.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, chrome-manifest, json]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: plato-sdk-v2 PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: plato-sdk-v2

  - id: wheel-distribution
    desc: plato_sdk_v2 wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: plato_sdk_v2

  - id: product-site
    desc: Plato product site hostname
    if:
      type: text
      substr: plato.so

  - id: envgen-recorder-name
    desc: EnvGen Recorder extension display name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: EnvGen Recorder

  - id: envgen-recorder-description
    desc: EnvGen Recorder session capture description
    for: [chrome-manifest, json]
    if:
      type: text
      substr: Records browser sessions with video and UI events

  - id: api-key-env
    desc: Plato API key environment variable
    for: [python]
    if:
      type: text
      substr: PLATO_API_KEY

  - id: base-url-env
    desc: Plato base URL environment variable
    for: [python]
    if:
      type: text
      substr: PLATO_BASE_URL

  - id: worlds-tailscale-config
    desc: Plato worlds TailscaleConfig import
    for: [python]
    if:
      type: text
      substr: from plato.worlds.config import TailscaleConfig

  - id: worlds-tailscale-helpers
    desc: Plato worlds Tailscale helper module
    for: [python]
    if:
      type: text
      substr: Tailscale VPN helpers for Plato worlds

composite_rules:
  - id: plato-sdk-identity
    desc: Recognized Plato simulator Python SDK
    needs: 2
    any:
      - id: pypi-name
      - id: wheel-distribution
      - id: product-site
      - id: api-key-env
      - id: base-url-env
      - id: worlds-tailscale-config
      - id: worlds-tailscale-helpers

  - id: envgen-recorder-identity
    desc: Recognized Plato EnvGen Recorder extension
    crit: exception
    conf: 0.99
    needs: 2
    any:
      - id: envgen-recorder-name
      - id: envgen-recorder-description
      - id: product-site
