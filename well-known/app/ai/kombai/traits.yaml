# Kombai — VS Code / Cursor AI design-engineer extension (publisher kombai).
# Imports the user's local Chromium cookie DB into a Kombai-managed browser
# profile for design preview (temp dir prefix `kombai-cookies-`), and ships an
# intentionally obfuscated runtime.js bundle.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 0
  size_max: 500000000

traits:
  - id: kombai-vsix-member
    desc: Kombai VSIX package member
    for: [javascript, typescript, json, archives, text]
    if:
      type: path
      regex: '(?i)kombai\.kombai'

  - id: kombai-cookies-temp-prefix
    desc: Kombai browser-cookie staging temp prefix
    for: [javascript, typescript]
    if:
      type: text
      substr: kombai-cookies-

  - id: kombai-page-bridge-marker
    desc: Kombai in-page bridge marker
    for: [javascript, typescript]
    if:
      type: text
      substr: __kombai_page__

  - id: kombai-product-display-name
    desc: Kombai product display name
    for: [javascript, typescript, json, markdown, text]
    if:
      type: text
      substr: Kombai - Your AI design engineer

  - id: kombai-webpack-ui-global
    desc: Kombai webpack UI chunk global
    for: [javascript, typescript]
    if:
      type: text
      substr: webpackChunk_kombai_ui

  - id: kombai-browser-extension-description
    desc: Kombai browser extension manifest description
    for: [json, chrome-manifest]
    if:
      type: value
      path: description
      exact: Kombai browser extension

  - id: kombai-sidebar-frame-id
    desc: Kombai browser sidebar frame identifier
    for: [javascript, typescript]
    if:
      type: text
      substr: kombai-iframe

  - id: chunk-3744-unicode-layer
    desc: Kombai 3744.js unicode-escape layer path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '3744\.js##unicode-escape@'

  - id: chunk-353-unicode-layer
    desc: Kombai 353.js unicode-escape layer path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '353\.js##unicode-escape@'

composite_rules:
  - id: kombai-browser-session-import-context
    desc: Kombai local browser session import context
    crit: exception
    conf: 0.99
    scope: outer
    for: [javascript, typescript, archives]
    all:
      - id: kombai-cookies-temp-prefix
    any:
      - id: kombai-vsix-member
      - id: kombai-page-bridge-marker
      - id: kombai-product-display-name

  - id: kombai-extension-context
    desc: Kombai VS Code extension context
    crit: notable
    conf: 0.99
    scope: outer
    for: [javascript, typescript, json, chrome-manifest, archives]
    any:
      - id: kombai-vsix-member
      - id: kombai-product-display-name
      - id: kombai-page-bridge-marker
      - id: kombai-cookies-temp-prefix
      - id: kombai-webpack-ui-global
      - id: kombai-browser-extension-description
      - id: kombai-sidebar-frame-id
