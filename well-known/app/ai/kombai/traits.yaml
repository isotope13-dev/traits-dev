# Kombai — VS Code / Cursor AI design-engineer extension (publisher kombai).
# Imports the user's local Chromium cookie DB into a Kombai-managed browser
# profile for design preview (temp dir prefix `kombai-cookies-`), and ships an
# intentionally obfuscated runtime.js bundle.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 0
  size_max: 500000000

traits:
  - id: kombai-vsix-member
    desc: Kombai VSIX package member
    for: [javascript, typescript, json, archives, text]
    if:
      type: path
      regex: '(?i)kombai\.kombai'

  - id: kombai-cookies-temp-prefix
    desc: Kombai browser-cookie staging temp prefix
    for: [javascript, typescript]
    if:
      type: text
      substr: kombai-cookies-

  - id: kombai-page-bridge-marker
    desc: Kombai in-page bridge marker
    for: [javascript, typescript]
    if:
      type: text
      substr: __kombai_page__

  - id: kombai-product-display-name
    desc: Kombai product display name
    for: [javascript, typescript, json, markdown, text]
    if:
      type: text
      substr: Kombai - Your AI design engineer

composite_rules:
  - id: kombai-browser-session-import-context
    desc: Kombai local browser session import context
    crit: exception
    conf: 0.99
    scope: outer
    for: [javascript, typescript, archives]
    all:
      - id: kombai-cookies-temp-prefix
    any:
      - id: kombai-vsix-member
      - id: kombai-page-bridge-marker
      - id: kombai-product-display-name

  - id: kombai-extension-context
    desc: Kombai VS Code extension context
    crit: notable
    conf: 0.99
    scope: outer
    for: [javascript, typescript, json, archives]
    all:
      - id: kombai-vsix-member
    any:
      - id: kombai-product-display-name
      - id: kombai-page-bridge-marker
      - id: kombai-cookies-temp-prefix
