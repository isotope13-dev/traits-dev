# bash-agent — lloydzhou's bash/awk AI coding agent runtime (bash-agent,
# cagent, goagent, rustagent ports share the same tool/session semantics).
defaults:
  platforms: [unix, windows]
  for: [shell, markdown, tar, archives, gz]
  crit: notable
  conf: 0.98

traits:
  - id: github-repo-url
    desc: lloydzhou/bash-agent GitHub repository
    if:
      type: text
      substr: github.com/lloydzhou/bash-agent

  - id: agent-sh-release-artifact
    desc: bash-agent single-file agent.sh release URL
    if:
      type: text
      substr: bash-agent/releases/latest/download/agent.sh

composite_rules:
  - id: bash-agent-project
    desc: lloydzhou bash-agent AI coding agent
    crit: notable
    any:
      - id: github-repo-url
      - id: agent-sh-release-artifact
