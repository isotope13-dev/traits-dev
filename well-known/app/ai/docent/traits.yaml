# Docent (Transluce) — LLM agent trace analysis SDK. Integrates with Harbor
# trial directories that use config.json and result.json layout artifacts.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: docent-python PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: docent-python

  - id: transluce-marker
    desc: Transluce Docent project marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: transluce.org

  - id: harbor-trial-layout-fn
    desc: Docent Harbor trial directory layout helper
    for: [python]
    if:
      type: text
      substr: is_harbor_trial_dir

composite_rules:
  - id: docent-sdk-context
    desc: Transluce Docent agent analysis SDK
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: transluce-marker

  - id: docent-harbor-integration-context
    desc: Docent Harbor trial directory integration
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: harbor-trial-layout-fn
