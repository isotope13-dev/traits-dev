defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: mtmai Python package metadata name
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*mtmai\s*$'

  - id: project-repository
    desc: mtmai project repository marker
    if:
      type: text
      exact: https://github.com/codeh007/mtmai

  - id: module-import
    desc: Imports the mtmai Python package
    for: [python]
    if:
      type: import
      regex: '^mtmai(\.|$)'

composite_rules:
  - id: mtmai-identity
    desc: mtmai Python automation package identity
    any:
      - id: package-name
      - id: project-repository
      - id: module-import
