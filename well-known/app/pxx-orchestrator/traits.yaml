# pxx-orchestrator is a local-first AI coding-agent runtime. Its shell,
# filesystem, MCP, memory, and HTTP behaviors are explicit product features
# guarded by permissions, scope, hooks, budgets, and optional authentication.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: pxx-orchestrator wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: pxx_orchestrator
  - id: package-name
    desc: pxx-orchestrator package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: pxx-orchestrator
  - id: python-package-marker
    desc: pxx Python package marker
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])pxx([\\/]|$)'
  - id: product-summary
    desc: pxx local coding-agent summary
    for: [pkginfo, markdown]
    if:
      type: text
      regex: '(?i)local-first AI coding agent runtime'

composite_rules:
  - id: package-identity
    desc: pxx-orchestrator coding-agent identity
    any:
      - id: wheel-distribution-name
      - id: package-name
      - id: python-package-marker
      - id: product-summary
