# cpsl — Capsule platform SDK and CLI.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: cpsl-wheel-name
    desc: cpsl Python wheel archive name
    if:
      type: path
      regex: '(?i)cpsl-.*\.whl$'

  - id: cpsl-package-name
    desc: cpsl Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*cpsl\s*$'

  - id: cpsl-runner-marker
    desc: Capsule runner gRPC service marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: RunnerServiceStub

composite_rules:
  - id: cpsl-python-package
    desc: Capsule platform SDK and CLI wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: cpsl-wheel-name
      - id: cpsl-package-name
      - id: cpsl-runner-marker
