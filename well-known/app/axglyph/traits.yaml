# AxGlyph is AmyXun's Windows vector drawing and OLE document editor.  Its
# editor, Office add-ins, registration helper, and AxSnap companion explain
# the otherwise security-relevant registry, clipboard, HTTP, process, and
# screen-capture APIs in the shipped binaries.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  - id: axglyph-company
    desc: AxGlyph AmyXun publisher metadata
    if:
      type: value
      path: pe.version.company
      exact: AmyXun

  - id: axglyph-product
    desc: AxGlyph product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: AxGlyph

  - id: axglyph-document-description
    desc: AxGlyph document editor description
    if:
      type: value
      path: pe.version.description
      exact: AxGlyph Document

composite_rules:
  - id: axglyph-editor
    desc: AmyXun AxGlyph vector drawing and OLE editor
    crit: notable
    conf: 0.99
    all:
      - id: axglyph-company
      - id: axglyph-product
      - id: axglyph-document-description
