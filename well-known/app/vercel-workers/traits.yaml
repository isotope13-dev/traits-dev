# vercel-workers — official Python SDK for Vercel Queues and Workers.
defaults:
  platforms: [unix, windows]
  for: [python, text, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: vercel-workers-wheel-name
    desc: vercel-workers Python wheel archive name
    if:
      type: path
      regex: '(?i)vercel[_-]workers.*\.whl$'

  - id: vercel-workers-package-name
    desc: vercel-workers distribution name
    for: [text, python]
    if:
      type: text
      regex: '(?m)^Name:\s*vercel-workers\s*$'

  - id: vercel-workers-module-marker
    desc: vercel.workers Python package marker
    crit: notable
    for: [python]
    if:
      type: text
      substr: vercel.workers

  - id: vercel-workers-vqs-error
    desc: Vercel Queues VQSError exception class
    crit: notable
    for: [python]
    if:
      type: text
      substr: class VQSError

composite_rules:
  - id: vercel-workers-python-sdk
    desc: Vercel Workers official Python SDK
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: vercel-workers-module-marker
    any:
      - id: vercel-workers-wheel-name
      - id: vercel-workers-package-name
