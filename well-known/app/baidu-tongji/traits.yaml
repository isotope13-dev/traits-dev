# Baidu Tongji (百度统计) browser analytics tracker identity.  This is a
# telemetry library: it records page and browser measurements and reports them
# to Baidu endpoints.  The minified tracker also contains compatibility code for
# ActiveX, local storage, and dynamic JSON parsing; those capabilities remain
# neutral micro-behaviors and are not suppressed by this identity.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: baidu-tongji-script-host
    desc: Baidu Tongji script host reference
    if:
      type: literal
      substr: tongji.baidu.com/hm-web/js/

  - id: baidu-tongji-pageview-endpoint
    desc: Baidu Tongji pageview endpoint
    if:
      type: literal
      substr: hm.baidu.com/hm.gif

  - id: baidu-tongji-global-queue
    desc: Baidu Tongji global event queue
    if:
      type: text
      regex: '\b_hmt\s*=\s*_hmt\s*\|\|\s*\[\]'

composite_rules:
  - id: baidu-tongji-tracker
    desc: Baidu Tongji browser analytics tracker
    crit: notable
    conf: 0.99
    all:
      - id: baidu-tongji-script-host
      - id: baidu-tongji-pageview-endpoint
      - id: baidu-tongji-global-queue
