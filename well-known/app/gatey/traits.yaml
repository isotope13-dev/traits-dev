# Gatey — SmartCloud's WordPress Amazon Cognito login/SSO plugin.
#
# This is identity context only.  A compromised plugin release must continue
# through the ordinary supply-chain and webshell rules.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, archives, zip]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 100000000

traits:
  - id: gatey-plugin-header
    desc: Gatey WordPress plugin header
    for: [php]
    if:
      type: text
      substr: 'Plugin Name:       Gatey - Login & SSO with Amazon Cognito'

  - id: gatey-wpsuite-namespace
    desc: Gatey SmartCloud PHP namespace
    for: [php]
    if:
      type: text
      substr: 'namespace SmartCloud\\WPSuite\\Gatey'

  - id: gatey-archive-name
    desc: Gatey plugin source archive name
    for: [zip]
    if:
      type: basename
      regex: '(?i)^gatey-[0-9][^\\/]*\.zip$'

  # Vendor and hub assets ship inside the plugin zip; path identity lets
  # benign Symfony/JS members be named without suppressing real webshell rules.
  - id: gatey-plugin-tree-path
    desc: Gatey plugin tree path
    for: [php, javascript, html, json, text, source]
    if:
      type: path
      regex: '(^|[\\/])gatey([\\/]|$)'

composite_rules:
  - id: gatey-plugin-identity
    desc: Gatey WordPress Cognito plugin identity
    crit: notable
    conf: 0.99
    any:
      - id: gatey-plugin-header
      - id: gatey-wpsuite-namespace
      - id: gatey-archive-name
      - id: gatey-plugin-tree-path
