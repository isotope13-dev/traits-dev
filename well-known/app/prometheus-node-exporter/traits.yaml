# Prometheus node_exporter is a legitimate Go system metrics exporter.  Its
# module identity prevents generic polling and encoding capabilities from being
# mistaken for a command-and-control beacon.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  - id: go-module-path
    desc: Prometheus node_exporter Go module path
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/prometheus/node_exporter
