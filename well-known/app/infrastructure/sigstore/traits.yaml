# github.com/sigstore/sigstore — Sigstore signing and OIDC client library.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: Sigstore Go module path
    if:
      type: text
      substr: github.com/sigstore/sigstore

  - id: source-archive-path
    desc: Sigstore module source archive path
    for: [go, zip]
    if:
      type: path
      regex: 'sigstore/sigstore@'

  - id: python-signing-config
    desc: Sigstore Python signing configuration
    for: [python]
    if:
      type: text
      regex: 'SIGSTORE_TUF_URL[\s\S]{0,300}SIGSTORE_REKOR_URL'
