# Datadog Agent binaries (agent, dogstatsd, system-probe, trace-agent ...).
# Every Go component is built from the github.com/DataDog/datadog-agent
# main module. The install-directory and apk-name rules are path
# observations: they do not establish that a file is Datadog's.
defaults:
  platforms: [linux]
  crit: notable

traits:
  - id: go-module
    desc: Datadog Agent Go main module
    for: [elf]
    conf: 0.97
    size_min: 1048576
    if:
      type: value
      path: elf.go.module.path
      regex: '^github\.com/DataDog/datadog-agent(/.+)?$'

  - id: agent-version-export
    desc: Datadog Agent DD_AGENT_1.0 version marker
    for: [elf]
    conf: 0.95
    size_min: 1048576
    if:
      type: symbol
      kind: export
      exact: DD_AGENT_1.0

  # Kept as a path observation for the eBPF exclusions that reference it:
  # the agent's own probes (SSL uprobes, kprobe syscall profiles) live
  # under its install tree.
  - id: install-path
    desc: Path has a datadog-agent directory
    for: [c, elf]
    conf: 0.5
    size_max: 400000000
    if:
      type: path
      regex: '(?i)datadog-agent[\\/]'

  - id: apk-member-path
    desc: Path names a Datadog Agent apk
    for: [python, elf, alpine_apk]
    conf: 0.5
    size_max: 400000000
    if:
      type: path
      regex: '(?i)(datadog-agent|dogstatsd)-.{1,40}\.apk'
