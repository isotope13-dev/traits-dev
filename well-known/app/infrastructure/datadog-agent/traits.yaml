# Datadog Agent repository and source tree context.
# Datadog Agent is an open-source monitoring and observability daemon.
# Its build scripts, packaging tools, and eBPF instrumentation probes
# contain operations (e.g. tool downloading, TLS uprobes) that overlap
# with generic suspicious/hostile rules.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, go, powershell, shell, python, ruby, zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree
    desc: Datadog Agent source tree path
    if:
      type: path
      regex: 'github\.com/datadog/datadog-agent[^[:space:]]*@v[0-9]'

  - id: source-archive-readme-member
    desc: Datadog Agent root README archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/datadog/datadog-agent@v[0-9][^/]+/README\.md$'

  - id: source-archive-mod-member
    desc: Datadog Agent root go.mod archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/datadog/datadog-agent@v[0-9][^/]+/go\.mod$'

composite_rules:
  - id: source-context
    desc: Datadog Agent source repository context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: source-tree
      - id: source-archive-mod-member
