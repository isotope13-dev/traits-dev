# CF-Server-Monitor — lightweight server monitoring platform on Cloudflare Workers.
# Official repository github.com/huilang-me/CF-Server-Monitor.
defaults:
  platforms: [unix, windows]
  for: [powershell, shell, javascript, json, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: repo-reference
    desc: CF-Server-Monitor repository reference
    if:
      type: text
      regex: '(?i)github\.com/huilang-me/CF-Server-Monitor'

  - id: app-name
    desc: CF-Server-Monitor application name
    if:
      type: text
      regex: '(?i)\bCF-Server-Monitor\b'

  - id: probe-service-or-task
    desc: CF-Server-Monitor probe service or task name
    for: [powershell, shell]
    if:
      type: text
      regex: '(?i)\b(CFProbe|cf-probe(\.service|\.sh)?)\b'

composite_rules:
  - id: cf-server-monitor-context
    desc: CF-Server-Monitor server monitor context
    crit: exception
    any:
      - id: repo-reference
      - id: app-name
      - id: probe-service-or-task
