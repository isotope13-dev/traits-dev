# go.flipt.io/flipt/rpc/flipt — generated Flipt feature-flag gRPC/HTTP stubs.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: Flipt RPC Go module path
    if:
      type: text
      substr: go.flipt.io/flipt/rpc/flipt

  - id: source-archive-path
    desc: Flipt RPC module source archive path
    for: [go, zip]
    if:
      type: path
      regex: 'flipt/rpc/flipt@'
