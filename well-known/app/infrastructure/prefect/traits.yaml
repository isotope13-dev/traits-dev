# Prefect workflow orchestration source (github.com/prefecthq/prefect).
# CI uses Claude Code on main to refresh AGENTS.md; that is maintainers'
# automation, not an unattended agent bypass implant.
defaults:
  platforms: [unix, windows]
  for: [github-actions, markdown, python, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: github-module-path
    desc: Prefect GitHub module member path
    if:
      type: path
      regex: 'prefecthq[\\/]prefect@'

  - id: agents-md-sync-workflow
    desc: Prefect AGENTS.md sync workflow basename
    for: [github-actions]
    if:
      type: path
      basename: true
      exact: agents-md-update.yml

composite_rules:
  - id: official-source-context
    desc: Official Prefect source context
    crit: exception
    conf: 0.99
    any:
      - id: github-module-path
      - id: agents-md-sync-workflow
