defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  size_min: 1000000
  size_max: 100000000

traits:
  # xen.efi stores the "Xen N.N.N" banner in .rodata. The boot marker
  # below still has to sit in .text.
  - id: xen-version-marker
    desc: Xen hypervisor version marker
    conf: 0.98
    if:
      type: text
      section: .rodata
      regex: '\bXen\s+[0-9]+\.[0-9]+(\.[0-9]+)?\b'

  - id: xen-boot-marker
    desc: Xen hypervisor boot or guest-loader marker
    conf: 0.98
    if:
      type: text
      section: .text
      regex: '(?i)(__xen_guest|xenvmmxeh|xen will only load images)'

  - id: xenstore-marker
    desc: XenStore or XenBus integration marker
    conf: 0.6
    if:
      type: text
      section: .text
      regex: '(?i)\bxen(store|bus)\b'

  - id: xen-hypervisor-marker
    desc: Xen hypervisor integration marker
    conf: 0.6
    if:
      type: text
      section: .text
      regex: '(?i)\bxen(-vm|\s+hypervisor)\b'

  # hvmloader is the Xen HVM guest firmware. It relocates itself before the
  # guest has page protections, so .text is writable and the entry sits in a
  # W+X segment. The hypervisor image is megabytes; this loader is ~100KB,
  # under that file floor, and its banner is "HVM Loader" rather than
  # "Xen N.N". Both literals live in .rodata.
  - id: hvmloader-banner
    desc: Xen HVM loader banner
    conf: 0.98
    size_min: 16384
    size_max: 4194304
    if:
      type: text
      section: .rodata
      substr: "HVM Loader"
  - id: xen-hvm-cpuid-signature
    desc: Xen HVM CPUID vendor signature
    conf: 0.98
    size_min: 16384
    size_max: 4194304
    if:
      type: text
      section: .rodata
      substr: XenVMMXenVMM

composite_rules:
  - id: xen-hypervisor-context
    desc: Xen hypervisor executable identity
    conf: 0.99
    all:
      - id: xen-version-marker
      - id: xen-boot-marker
  - id: xen-hvmloader-firmware
    desc: Xen HVM guest firmware loader
    conf: 0.99
    size_min: 16384
    size_max: 4194304
    all:
      - id: hvmloader-banner
      - id: xen-hvm-cpuid-signature
