# Dapr is a portable runtime for distributed applications. Its documented CLI
# install path fetches install.sh from the project's own raw.githubusercontent
# URL, so build recipes across the ecosystem carry this URL. The trait
# identifies that upstream installer, not any one project using it.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: official-installer-url
    desc: Official Dapr CLI installer URL
    for: [shell, dockerfile]
    if:
      type: text
      substr: raw.githubusercontent.com/dapr/cli/master/install/install.sh
