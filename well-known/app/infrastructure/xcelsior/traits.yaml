# Xcelsior GPU Cloud (xcelsior.ca) is a GPU compute marketplace and provider
# platform. The onboarding wizard installs the platform host-control SSH public
# key into ~/.ssh/authorized_keys to allow remote worker management.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, shell, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Xcelsior GPU wizard npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@xcelsior-gpu/'

  - id: npm-package-name
    desc: Xcelsior GPU wizard npm container identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@xcelsior-gpu/'

  - id: xcelsior-cli-binary-name
    desc: Xcelsior CLI binary name
    for: [package.json]
    if:
      type: value
      path: bin.xcelsior-wizard
      exact: 'dist/src/index.js'

  - id: xcelsior-domain
    desc: Xcelsior official domain reference
    for: [javascript, typescript, shell, text]
    if:
      type: text
      substr: 'xcelsior.ca'

  - id: xcelsior-env-prefix
    desc: Xcelsior environment variable prefix
    for: [javascript, typescript, shell, text]
    if:
      type: text
      regex: '\bXCELSIOR_(HOST_ID|SCHEDULER_URL|API_TOKEN|HOST_SSH_USER|PREFER_GVISOR)\b'

  - id: platform-host-pubkey-installer
    desc: Xcelsior platform host SSH key installer
    for: [javascript, typescript]
    if:
      type: text
      substr: 'fetchPlatformHostPublicKey'

composite_rules:
  - id: xcelsior-onboarding-context
    desc: Recognized Xcelsior GPU onboarding context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: npm-package-name
      - id: xcelsior-cli-binary-name
      - id: xcelsior-domain
      - id: xcelsior-env-prefix
      - id: platform-host-pubkey-installer
