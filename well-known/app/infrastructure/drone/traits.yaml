# Drone CI (drone.io / harness/drone) — MIT license copyright header.
defaults:
  platforms: [unix, windows]
  for: [text, markdown]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 16384

traits:
  - id: drone-io-copyright
    desc: drone.io copyright license header
    if:
      type: text
      substr: 'Copyright (c) 2017 drone.io'
