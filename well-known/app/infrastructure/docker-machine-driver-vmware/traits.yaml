# Docker Machine's VMware driver is a legitimate Go plugin used to create and
# manage Boot2Docker guests through VMware Fusion or Workstation. Its guest
# mount command and environment handling overlap with VM-evasion heuristics.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: source-module-path
    desc: Docker Machine VMware driver module path
    size_min: 100000
    if:
      type: raw
      substr: github.com/machine-drivers/docker-machine-driver-vmware
      section: .rdata

  - id: plugin-banner
    desc: Docker Machine plugin banner
    size_min: 100000
    if:
      type: raw
      substr: This is a Docker Machine plugin binary.
      section: .rdata

composite_rules:
  - id: docker-machine-vmware-driver-identity
    desc: Docker Machine VMware driver identity
    crit: notable
    conf: 0.99
    all:
      - id: source-module-path
      - id: plugin-banner

  - id: docker-machine-vmware-driver-context
    desc: Signed Docker Machine VMware driver context
    crit: exception
    conf: 0.99
    all:
      - id: docker-machine-vmware-driver-identity
      - id: metadata/signed/leaf::broadcom-inc
