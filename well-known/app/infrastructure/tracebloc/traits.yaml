# Tracebloc client — local ML model training and inference runner for Kubernetes.
defaults:
  platforms: [unix, windows]
  for: [go, shell, powershell, yaml, markdown, text, dockerfile]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 100000000

traits:
  - id: tracebloc-client-repo-reference
    desc: References Tracebloc client repository
    if:
      type: text
      substr: tracebloc/client

  - id: tracebloc-source-tree-path
    desc: Tracebloc client source tree path
    for: [shell, powershell, yaml, go, text]
    if:
      type: path
      regex: '(?i)tracebloc/client@'

  - id: tracebloc-env-config
    desc: Tracebloc environment configuration variable
    for: [powershell, shell]
    if:
      type: text
      word: TRACEBLOC_ENV

composite_rules:
  - id: tracebloc-client-context
    desc: Recognized Tracebloc ML client context
    crit: exception
    conf: 0.99
    any:
      - id: tracebloc-client-repo-reference
      - id: tracebloc-source-tree-path
      - id: tracebloc-env-config
