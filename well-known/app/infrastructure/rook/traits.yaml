# Rook (rook.io) is a CNCF Kubernetes storage orchestrator for Ceph. Its
# source tree ships CI/dev-cluster helper scripts under tests/scripts/ that
# legitimately provision and wipe Ceph OSD block devices (operator-supplied
# --disk argument, not victim auto-discovery) and print local dashboard URLs
# built from kubectl queries -- both of which overlap with generic malware
# heuristics for disk-wipe and exfiltration-via-URL techniques.
defaults:
  platforms: [unix, windows]
  for: [go, shell, zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree
    desc: Rook source-tree path
    if:
      type: path
      regex: 'github\.com/rook/rook@v[0-9]'
