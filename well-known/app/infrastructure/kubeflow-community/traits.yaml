defaults:
  platforms: [unix, windows]
  for: [source, scripts, documents, data]
  size_max: 52428800
traits:
  - id: notebook-scripts
    desc: Kubeflow community notebook scripts
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: 'scripts[\\/][^\\/]+\.ipynb$'

  - id: model-registry-python-client
    desc: Kubeflow Model Registry Python client
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      regex: 'KF_PIPELINES_SA_TOKEN_PATH[\s\S]{0,300}Model registry client'
