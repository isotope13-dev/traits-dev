defaults:
  platforms: [linux]
  crit: baseline
  conf: 0.98

traits:
  - id: ftl-binary
    desc: Pi-hole FTL binary
    crit: notable
    conf: 0.98
    for: [elf]
    size_max: 600000000
    if:
      type: basename
      exact: pihole-FTL
  - id: pihole-container-archive
    crit: notable
    desc: Pi-hole container archive
    for: [tar]
    size_min: 1000000
    size_max: 2000000000
    if:
      type: path
      basename: true
      regex: '^docker\.io_pihole_pihole_.*\.tar\.xz$'
  - id: pihole-source-path
    crit: notable
    desc: Pi-hole source or install path
    for: [shell, python]
    if:
      type: path
      regex: '(^|[\\/])(\.pihole|pihole)([\\/]|$)'
composite_rules:
  - id: pihole-artifact
    desc: Pi-hole application artifact
    crit: notable
    conf: 0.98
    any:
      - id: pihole-container-archive
      - id: pihole-source-path
      - id: ftl-binary
