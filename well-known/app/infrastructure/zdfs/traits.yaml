# github.com/data-accelerator/zdfs — overlaybd/dadi snapshotter for containerd.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: zdfs overlaybd snapshotter module path
    if:
      type: text
      substr: github.com/data-accelerator/zdfs

  - id: source-archive-path
    desc: zdfs module source archive path
    for: [go, zip]
    if:
      type: path
      regex: 'data-accelerator/zdfs@'
