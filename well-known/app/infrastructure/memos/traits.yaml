# Memos is a self-hosted notes server distributed as a statically linked Go
# executable. Its embedded frontend and parser tables contain ordinary
# JavaScript escape sequences and long generated tokens; identify the release
# binary before those strings are treated as obfuscation.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.999
  size_min: 10000000
  size_max: 100000000

traits:
- id: go-module-path
  desc: Memos Go module identity
  if:
    type: value
    path: elf.go.module.path
    exact: github.com/usememos/memos

- id: go-command-path
  desc: Memos Go command identity
  if:
    type: value
    path: elf.go.path
    exact: github.com/usememos/memos/cmd/memos

- id: api-package-marker
  desc: Memos API package marker
  if:
    type: text
    section: .rodata
    substr: memos.api.v1

composite_rules:
- id: release-binary-identity
  desc: Memos release server binary identity
  crit: notable
  conf: 0.999
  all:
  - id: go-module-path
  - id: go-command-path

- id: release-binary-context
  desc: Recognized Memos release binary context
  crit: exception
  conf: 0.999
  all:
  - id: release-binary-identity
  - id: api-package-marker
