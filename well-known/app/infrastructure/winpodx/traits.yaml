# WinPodX: FreeRDP RemoteApp container orchestration for Windows applications on Linux.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, batch, powershell, python, text]
  size_max: 268435456
  crit: notable
  conf: 0.98

traits:
  - id: winpodx-banner
    desc: WinPodX orchestration banner
    for: [batch, powershell, python, shell, text]
    if:
      type: text
      substr: '[WinPodX]'

  - id: winpodx-repo-path
    desc: WinPodX repository path
    if:
      type: path
      regex: 'winpodx(-HEAD|[\\/])'

composite_rules:
  - id: winpodx-tooling
    desc: WinPodX container orchestration tooling
    any:
      - id: winpodx-banner
      - id: winpodx-repo-path
