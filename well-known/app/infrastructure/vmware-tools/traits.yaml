# VMware Tools for Windows includes an updater that enumerates files, copies
# its image during replacement, and rewrites installer data.  Those operations
# are legitimate in this narrowly identified, verified VMware component; keep
# the identity independent of a particular build number.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 5000000

traits:
  - id: upgrader-product
    desc: VMware Tools product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: VMware Tools

  - id: upgrader-description
    desc: VMware Tools Upgrader description metadata
    if:
      type: value
      path: pe.version.description
      exact: VMware Tools Upgrader

  - id: upgrader-original-filename
    desc: VMware Tools Upgrader original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: upgrader.exe
      case_insensitive: true

  - id: upgrader-manifest-identity
    desc: VMware Tools Upgrader manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: VMware.VMware.upgrader

composite_rules:
  - id: vmware-tools-upgrader-identity
    desc: VMware Tools Upgrader identity
    crit: notable
    conf: 0.99
    all:
      - id: metadata/signed/leaf::vmware-inc.
      - id: upgrader-product
      - id: upgrader-description
      - id: upgrader-original-filename
      - id: upgrader-manifest-identity

  - id: vmware-tools-upgrader-context
    desc: Recognized VMware Tools Upgrader application context
    crit: exception
    conf: 0.99
    all:
      - id: vmware-tools-upgrader-identity
      - id: vmware-tools-upgrader-verified-signer

  - id: vmware-tools-upgrader-verified-signer
    desc: Verified VMware Tools Upgrader Authenticode signer
    crit: notable
    conf: 0.99
    all:
      - id: vmware-tools-upgrader-identity
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
