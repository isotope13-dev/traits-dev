# HashiCorp Vault — secrets management and PKI platform.
defaults:
  platforms: [unix, windows]
  for: [go, zip, tar, markdown]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 104857600

traits:
  - id: github-repo-url
    desc: hashicorp/vault GitHub repository
    for: [go, markdown]
    if:
      type: text
      substr: github.com/hashicorp/vault

  - id: secrets-management-summary
    desc: Vault secrets management product summary
    for: [go, markdown]
    if:
      type: text
      substr: tool for securely accessing secrets

  - id: vault-benchmark-go-module
    desc: vault-benchmark Go main module
    for: [elf]
    platforms: [linux]
    conf: 0.97
    size_min: 1048576
    size_max: 1073741824
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/hashicorp/vault-benchmark

composite_rules:
  - id: hashicorp-vault-product
    desc: HashiCorp Vault secrets management platform
    crit: notable
    any:
      - id: github-repo-url
      - id: secrets-management-summary
