# pg-tide-relay — trickle-labs PostgreSQL outbox/inbox relay binary.
# HTTP, Kafka/NATS, and process spawn are sink backends, not C2.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: crate-name
    desc: pg-tide-relay crate archive name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: pg-tide-relay

  - id: crate-repository
    desc: pg-tide-relay crate repository
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/trickle-labs/pg-tide

  - id: cargo-package-name
    desc: pg-tide-relay Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: pg-tide-relay

  - id: github-repo
    desc: trickle-labs pg-tide GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/trickle-labs/pg-tide
