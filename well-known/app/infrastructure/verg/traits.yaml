# verg — desired-state infrastructure convergence engine (rvben/verg).
# SSH push of a static agent, chmod, package/service apply, and e2e
# authorized_keys fixtures are product IaC, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: crate-name
    desc: verg crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: verg

  - id: crate-repository
    desc: verg crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/rvben/verg

  - id: cargo-package-name
    desc: verg Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: verg

  - id: github-repo
    desc: rvben verg GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/rvben/verg

  - id: product-description
    desc: verg desired-state engine description
    conf: 0.97
    if:
      type: text
      substr: Desired-state infrastructure convergence engine
