# OpenRod — Web console for NVIDIA OpenShell gateways and sandboxes (github.com/OpenRod/OpenRod).
defaults:
  crit: notable
  conf: 0.98
  platforms: [linux, windows, macos]
  for: [javascript, typescript, package.json, json, text]

traits:
  - id: openrod-package-name
    desc: OpenRod package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: openrod

  - id: openrod-repository-url
    desc: OpenRod GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/openrod/openrod'

  - id: openrod-cloud-ssh-header
    desc: OpenRod cloud SSH configuration header
    if:
      type: text
      regex: 'OpenRod (Cloud|SSH)|openrod-cloud-|\.config/openrod'

composite_rules:
  - id: openrod-infrastructure-context
    desc: OpenRod sandbox gateway console context
    crit: exception
    conf: 0.99
    any:
      - id: openrod-package-name
      - id: openrod-repository-url
      - id: openrod-cloud-ssh-header
