# Dokku is an open-source container deployment platform. Its source tree
# contains privileged container initialization, SSH test setup, image cleanup,
# and build-time download helpers; those are benign project context, not an
# attacker objective when the tree is analyzed as a whole.
defaults:
  platforms: [unix]
  for: [scripts, source, manifests, archives, shell, text, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: dokku-source-tree
    desc: Dokku versioned source-tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])dokku(-[0-9]|@v[0-9])'

  - id: github-repo
    desc: dokku/dokku GitHub repository
    for: [shell, text, markdown]
    if:
      type: text
      substr: github.com/dokku/dokku
