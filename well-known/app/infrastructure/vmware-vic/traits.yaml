# VMware vSphere Integrated Containers (VIC) — open-source container engine for vSphere (github.com/vmware/vic).
# Appliance staging scripts configure rootfs image filesystems inside a build container.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.99

traits:
  - id: appliance-staging-basename
    desc: Appliance staging script basename
    if:
      type: basename
      exact: appliance-staging.sh

  - id: vmware-copyright-header
    desc: VMware copyright header
    if:
      type: text
      regex: '(?i)Copyright\s+\d{4}\s+VMware,\s+Inc\.'

  - id: vic-admin-or-init-marker
    desc: VMware VIC admin or init marker
    if:
      type: text
      regex: '\b(vicadmin|vic-init|VCH packages)\b'

composite_rules:
  - id: appliance-staging-context
    desc: VMware VIC appliance image staging context
    crit: exception
    conf: 0.99
    all:
      - id: vmware-copyright-header
      - id: appliance-staging-basename
      - id: vic-admin-or-init-marker
