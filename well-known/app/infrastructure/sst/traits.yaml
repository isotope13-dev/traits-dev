# SST is a cloud application framework and deployment CLI. Its Windows package
# and embedded Linux helper preserve the Go module path as build identity.
defaults:
  platforms: [linux, windows]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  - id: pe-go-module-path
    desc: SST v3 module in PE read-only data
    for: [pe]
    if:
      type: text
      section: .rdata
      substr: github.com/sst/sst/v3

  - id: elf-go-module-path
    desc: SST v3 module in ELF read-only data
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: github.com/sst/sst/v3
