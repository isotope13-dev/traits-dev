# containerd source trees contain legitimate provisioning and test harnesses
# whose setup operations overlap with generic defense and execution heuristics.
defaults:
  platforms: [unix, windows]
  for: [binaries, source, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 300000000

traits:
  - id: source-tree
    desc: containerd source-tree path
    if:
      type: path
      regex: '(?i)[/\\](containerd-main|containerd@v[0-9])[/\\]'

  - id: containerd-github-module
    desc: containerd GitHub module path
    for: [go, markdown, shell]
    if:
      type: text
      substr: github.com/containerd/containerd

  - id: nri-github-module
    desc: containerd NRI GitHub module path
    for: [go, markdown, shell, zip]
    if:
      type: text
      substr: github.com/containerd/nri

  - id: nri-source-path
    desc: containerd NRI module source path
    for: [go, shell, zip]
    if:
      type: path
      regex: 'containerd/nri@'

  - id: vagrantfile
    desc: containerd Vagrant test provisioner
    for: [shell]
    if:
      type: basename
      exact: Vagrantfile

composite_rules:
  - id: containerd-vagrant-test-context
    desc: containerd Vagrant test provisioning context
    crit: exception
    conf: 1.0
    all:
      - id: source-tree
      - id: vagrantfile
