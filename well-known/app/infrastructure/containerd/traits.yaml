# containerd source trees contain legitimate provisioning and test harnesses
# whose setup operations overlap with generic defense and execution heuristics.
defaults:
  platforms: [unix, windows]
  for: [all]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 300000000

traits:
  - id: source-tree
    desc: containerd source-tree path
    if:
      type: path
      regex: 'github\.com/containerd/containerd@v[0-9]'

  - id: vagrantfile
    desc: containerd Vagrant test provisioner
    for: [shell]
    if:
      type: basename
      exact: Vagrantfile

composite_rules:
  - id: containerd-vagrant-test-context
    desc: containerd Vagrant test provisioning context
    crit: exception
    conf: 1.0
    all:
      - id: source-tree
      - id: vagrantfile
