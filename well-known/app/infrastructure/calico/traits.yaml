# Project Calico — Kubernetes container networking and network security provider.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.99
  for: [elf]
  size_min: 10000000
  size_max: 500000000

traits:
  - id: calico-felix-module-path
    desc: Calico Felix Go module path
    if:
      type: text
      substr: "github.com/projectcalico/calico/felix"
      section: gopclntab

  # A basename is only an observation; the composite needs the module path.
  - id: calico-node-binary
    desc: ELF named calico-node
    crit: component
    conf: 0.5
    if:
      type: path
      basename: true
      exact: calico-node

composite_rules:
  - id: calico-node-context
    desc: Recognized Calico node networking agent
    crit: notable
    conf: 0.99
    all:
      - id: calico-felix-module-path
      - id: calico-node-binary
