# sigs.k8s.io/release-utils — Kubernetes SIG Release helper library
# (command, tar, hash, HTTP helpers used by krel and related tools).
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: k8s release-utils Go module path
    if:
      type: text
      substr: sigs.k8s.io/release-utils

  - id: source-archive-path
    desc: k8s release-utils module source path
    for: [go, zip]
    if:
      type: path
      regex: 'sigs\.k8s\.io/release-utils@'
