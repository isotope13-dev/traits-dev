# OpenCharly (github.com/opencharly/sdk, github.com/opencharly/charly) — container/VM orchestration toolchain.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: go-module-path
    desc: OpenCharly Go module import path
    for: [go, text, source]
    if:
      type: text
      substr: github.com/opencharly/

  - id: charly-sudoers-builder-path
    desc: OpenCharly builder sudoers drop-in path
    for: [go, shell, text, source]
    if:
      type: text
      substr: /etc/sudoers.d/builder

composite_rules:
  - id: opencharly-context
    desc: OpenCharly container and VM orchestration context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: go-module-path
      - id: charly-sudoers-builder-path
