# CircleCI CLI — official local client for CircleCI pipelines. Embeds Go's SSH
# stack for remote job debugging; protocol forwarding fields are library
# mechanics, not a reverse-access implant.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, archives, tar]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: go-module-path
    desc: CircleCI CLI Go module path
    for: [elf, pe]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/CircleCI-Public/circleci-cli

  - id: binary-basename
    desc: CircleCI CLI executable basename
    for: [elf, pe]
    if:
      type: basename
      exact: circleci

  - id: upstream-repository-path
    desc: CircleCI CLI upstream repository reference
    if:
      type: text
      substr: CircleCI-Public/circleci-cli

composite_rules:
  - id: official-cli-binary
    desc: Official CircleCI CLI binary identity
    crit: notable
    conf: 0.99
    all:
      - id: go-module-path
      - id: binary-basename
