defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: product-marker
    desc: Open VM Tools self-version banner template
    for: [scripts, binaries, source, text, data]
    if:
      type: text
      # A guest-daemon name in a blacklist is not this product's identity.
      substr: 'open-vm-tools %s build %s'

  # These exported/imported symbol families are specific to the Open VM Tools
  # suite. Keep them as neutral identity evidence so VMware's guest backdoor
  # protocol and CPUID probes can be excluded without matching generic
  # filenames or suppressing unrelated VMware software.
  - id: vmtools-api-symbol
    desc: Open VM Tools API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^VMTools_'
  - id: vmguestlib-api-symbol
    desc: VMware guest library API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^VMGuestLib_'
  - id: gueststore-api-symbol
    desc: VMware Guest Store API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^GuestStore'
  - id: hgfs-api-symbol
    desc: VMware HGFS API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^Hgfs'
  - id: deploypkg-api-symbol
    desc: VMware deployment package API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^DeployPkg_'
  - id: vgauth-api-symbol
    desc: VMware guest authentication API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^VGAuth_'
  - id: vmware-tools-banner
    desc: VMware Tools product banner
    for: [binaries]
    if:
      type: text
      exact: VMware Tools

  - id: guest-library-soname
    desc: Open VM Tools shared library SONAME
    for: [elf]
    if:
      type: value
      path: elf.soname
      regex: '^lib(vmtools|guestlib|guestStoreClient)\.so\.0$'

  - id: guest-library-lifecycle-export
    desc: Open VM Tools guest library lifecycle export
    for: [elf]
    if:
      type: symbol
      kind: export
      regex: '^(VMTools_AcquireLogStateLock|VMGuestLib_CloseHandle|GuestStore_Init)$'

  - id: guest-library-operation-export
    desc: Open VM Tools guest library operation export
    for: [elf]
    if:
      type: symbol
      kind: export
      regex: '^(VMTools_AddConfig|VMTools_LoadConfig|VMGuestLib_GetCpuLimitMHz|GuestStore_GetContent)$'

  - id: guest-utility-marker
    desc: Open VM Tools guest utility message
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: 'rpctool syntax:|tools\.vmsupport\.status %d|VGAuth_QueryMappedAliases failed\.'

  - id: guest-utility-hostinfo
    desc: Open VM Tools host detection diagnostic
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: 'HOSTINFO: CPUID hypervisor bit is set, but no hypervisor vendor signature is present.'

composite_rules:
  - id: open-vm-tools-guest-library
    desc: Open VM Tools ELF guest integration library
    crit: notable
    for: [elf]
    scope: file
    all:
      - id: guest-library-soname
      - id: guest-library-lifecycle-export
      - id: guest-library-operation-export

  - id: open-vm-tools-guest-utility
    desc: Open VM Tools ELF guest integration utility
    crit: notable
    for: [elf]
    scope: file
    all:
      - id: guest-utility-marker
      - id: guest-utility-hostinfo
