defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: product-marker
    desc: Open VM Tools product marker
    for: [scripts, binaries, text, data]
    if:
      type: text
      regex: '\b(open-vm-tools|vmware-rpctool|vmware-tools|vmtoolsd)\b'

  # These exported/imported symbol families are specific to the Open VM Tools
  # suite. Keep them as neutral identity evidence so VMware's guest backdoor
  # protocol and CPUID probes can be excluded without matching generic
  # filenames or suppressing unrelated VMware software.
  - id: vmtools-api-symbol
    desc: Open VM Tools API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^VMTools_'
  - id: vmguestlib-api-symbol
    desc: VMware guest library API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^VMGuestLib_'
  - id: gueststore-api-symbol
    desc: VMware Guest Store API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^GuestStore'
  - id: hgfs-api-symbol
    desc: VMware HGFS API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^Hgfs'
  - id: deploypkg-api-symbol
    desc: VMware deployment package API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^DeployPkg_'
  - id: vgauth-api-symbol
    desc: VMware guest authentication API symbol
    for: [binaries]
    if:
      type: symbol
      regex: '^VGAuth_'
  - id: vmware-tools-banner
    desc: VMware Tools product banner
    for: [binaries]
    if:
      type: text
      exact: VMware Tools
