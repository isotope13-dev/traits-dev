# dask-gateway-server — multi-tenant Dask cluster gateway (Wolfi/Alpine).
# The Go dask-gateway-proxy binary and HTTP/TLS/ChaCha usage are the
# product reverse-proxy, not a dropper. Identity only.
defaults:
  platforms: [unix]
  for: [apk, elf, python, text, json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 100000000

traits:
  - id: apk-basename
    desc: dask-gateway-server Alpine APK basename
    for: [apk]
    if:
      type: value
      path: file.basename
      regex: '(?i)^dask-gateway-server-'

  - id: pkginfo-name
    desc: dask-gateway-server Alpine PKGINFO name
    for: [text, apk]
    if:
      type: text
      regex: '^pkgname\s*=\s*dask-gateway-server\s*$'

  - id: github-repo
    desc: dask/dask-gateway GitHub repository
    for: [text, json, python]
    if:
      type: text
      substr: github.com/dask/dask-gateway

  - id: no-proxy-env
    desc: Dask gateway server no-proxy env var
    for: [python, text]
    if:
      type: text
      substr: DASK_GATEWAY_SERVER__NO_PROXY

  - id: proxy-go-dep
    desc: dask-gateway-proxy Go module path
    for: [elf]
    if:
      type: value
      path: elf.go.deps[*].path
      exact: github.com/dask/dask-gateway/dask-gateway-proxy

composite_rules:
  - id: dask-gateway-server-package
    desc: dask-gateway-server Alpine package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: apk-basename
      - id: pkginfo-name
      - id: github-repo
      - id: no-proxy-env
      - id: proxy-go-dep
    needs: 2
