# ANTfrastructure — Kataglyphis's public Windows container-build
# infrastructure project (Apache-2.0): CI composite actions for container
# hosts, host provisioning scripts (Defender exclusions for the container
# daemons, container-scoped Windows Update disable, dufs WebDAV sccache L2
# service), and build handoff tooling. The scripts exercise exactly the
# privilege/persistence/update surfaces an IaC host setup touches, on
# infrastructure the operator owns.
defaults:
  platforms: [windows, unix]
  for: [powershell, shell, yaml, github_actions]
  crit: notable
  conf: 0.99

traits:
  - id: antfrastructure-kataglyphis-credit
    desc: Kataglyphis author credit
    if:
      type: text
      regex: '(?i)Kataglyphis'

  - id: antfrastructure-container-host-vocabulary
    desc: Container-host daemon and cache vocabulary
    if:
      type: text
      regex: '(?i)(containerd|buildkit|dockerd|vmcompute|cexecsvc|dufs|sccache)'

  - id: antfrastructure-repo-reference
    desc: ANTfrastructure repository reference
    if:
      type: text
      regex: '(?i)Kataglyphis[/\\]ANTfrastructure'

composite_rules:
  - id: antfrastructure-host-provisioning-context
    desc: Recognized ANTfrastructure host provisioning file
    crit: exception
    conf: 0.99
    all:
      - id: antfrastructure-kataglyphis-credit
      - id: antfrastructure-container-host-vocabulary
