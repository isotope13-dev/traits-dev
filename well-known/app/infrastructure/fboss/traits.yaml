# Facebook Open Switching System (FBOSS) source and appliance image tooling.
# Image-build templates may deliberately tailor SELinux and boot services for
# the switch OS; retain those actions as notable behavior in that context.
defaults:
  platforms: [unix]
  for: [scripts, source, python, dockerfile, kotlin]

traits:
  - id: fboss-image-tooling-source
    desc: FBOSS appliance image tooling source
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[\\/])fboss-image[\\/]'
