# Watchmaker is Plus3IT's applied-configuration-management distribution.
# Its Salt formulas legitimately contain policy names and credential
# decryption used for OS hardening and domain joins.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Watchmaker Python distribution name
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*watchmaker\s*$'

  - id: upstream-repository
    desc: Plus3IT Watchmaker upstream repository
    for: [pkginfo]
    if:
      type: text
      regex: 'github\.com/plus3it/watchmaker([./\s"''`?#]|$)'

composite_rules:
  - id: package-context
    desc: Recognized Plus3IT Watchmaker distribution
    crit: exception
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: package-name
      - id: upstream-repository
