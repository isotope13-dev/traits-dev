# Go programs embedding crypto/ssh for ordinary CLI features expose the
# remote-forwarding protocol fields as library mechanics, not reverse-access
# endpoints. Bundle the known-good identities here so tunnel composites stay
# within suppress-clause limits.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, go, binaries]
  crit: exception
  conf: 0.99

composite_rules:
  - id: go-ssh-library-cli-context
    desc: Known-good Go CLI embedding SSH client library
    any:
      - id: well-known/app/infrastructure/circleci-cli::official-cli-binary
      - id: well-known/app/development/fabric::official-cli-binary
