# Nuzur is a self-hosted deployment and agent-management CLI. Its source
# release intentionally installs, enables, stops, and removes its own services
# and project state; this identity is only benign context for generic impact
# heuristics. The underlying capabilities remain visible to triage.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, zip]
  crit: notable
  conf: 1.0
  size_max: 100000000

traits:
  - id: source-directory
    desc: Nuzur CLI upstream source directory
    if:
      type: path
      regex: 'nuzur-cli@v[0-9][^\\/]*'

  - id: source-archive
    desc: Nuzur CLI upstream source archive
    for: [zip]
    if:
      type: path
      basename: true
      regex: '^github\.com-nuzur-nuzur-cli-v[^\\/]+\.zip$'
