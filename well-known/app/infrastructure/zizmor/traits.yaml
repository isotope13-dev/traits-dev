# zizmor — static analyzer for GitHub Actions workflows (zizmorcore/zizmor).
# Its integration test-data directory holds deliberately flawed workflows, such
# as one that serializes the whole secrets context, as inputs the linter must
# flag; they are fixtures, never run by any repository.
defaults:
  platforms: [unix, windows]
  for: [github-actions, yaml, text]
  crit: notable
  conf: 0.95

traits:
  - id: zizmor-test-data-path
    desc: zizmor workflow audit test fixture
    if:
      type: path
      regex: 'zizmor[\\/]tests[\\/]'
