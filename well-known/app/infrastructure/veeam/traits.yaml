defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  size_max: 16777216
traits:
  - id: configuration-reference
    desc: References Veeam database or registry settings
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bVeeamBackup\b|Veeam\\{1,2}Veeam Backup and Replication\b'
