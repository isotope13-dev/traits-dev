# Proxmox Backup Server Plus (pbs-plus) — backup server extension and agent.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: pbs-plus-repo-reference
    desc: References pbs-d2d-backup repository
    for: [powershell, go, shell, yaml, markdown, text, dockerfile]
    if:
      type: text
      substr: sonroyaalmerol/pbs-d2d-backup

  - id: pbs-plus-source-tree-path
    desc: pbs-d2d-backup source tree path
    for: [powershell, go, shell, yaml, markdown, text, dockerfile]
    if:
      type: path
      regex: 'pbs-d2d-backup'

  - id: pbs-plus-agent-service-name
    desc: References PBS Plus agent service name
    for: [powershell, shell]
    if:
      type: text
      regex: '(?i)\b(PBSPlusAgent|pbs-plus-agent)\b'

  - id: pbs-plus-agent-installer-banner
    desc: PBS Plus agent installer script banner
    for: [powershell]
    if:
      type: text
      substr: PBS Plus Agent MSI

composite_rules:
  - id: pbs-plus-agent-installer-context
    desc: Recognized PBS Plus agent installer context
    crit: exception
    conf: 0.99
    for: [powershell]
    any:
      - id: pbs-plus-agent-installer-banner
      - id: pbs-plus-agent-service-name

  - id: pbs-plus-client-context
    desc: Recognized PBS Plus backup context
    crit: exception
    conf: 0.99
    any:
      - id: pbs-plus-repo-reference
      - id: pbs-plus-source-tree-path
      - id: pbs-plus-agent-installer-context
