# OpenZFS is the upstream ZFS filesystem source release. Kernel-module,
# platform-port, and zfs-tests harness code carry SUID checks, sysctl
# handlers, and dirent manipulation that are normal for this tree.
defaults:
  platforms: [unix]
  for: [c, cpp, archive, tar]
  crit: notable
  conf: 0.99

traits:
  - id: release-tree-path
    desc: OpenZFS release source tree path
    if:
      type: path
      regex: '(^|/)zfs-[0-9]+\.[0-9]'

  - id: zfs-tests-harness-path
    desc: OpenZFS zfs-tests harness path
    if:
      type: path
      regex: '(^|/)zfs-tests/'

  - id: upstream-repository
    desc: OpenZFS upstream repository marker
    if:
      type: text
      substr: github.com/openzfs/zfs

composite_rules:
  - id: openzfs-source-context
    desc: OpenZFS upstream source release context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: release-tree-path
      - id: zfs-tests-harness-path
