# VMware's virtual-disk library legitimately combines volume, file, and
# cryptographic operations, which can resemble ransomware in generic rules.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 3000000

traits:
  - id: disklib-pdb-identity
    desc: VMware DiskLibWrapper PDB identity
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: diskLibWrapper.pdb
      case_insensitive: true

  - id: disklib-vix-entrypoint
    desc: VixDiskLib plugin entry point
    if:
      type: text
      substr: VixDiskLibPlugin_EntryPoint
      section: .rdata

  - id: disklib-v2i-image-api
    desc: V2iDiskLib image API marker
    if:
      type: text
      substr: V2iDiskLib::OpenImage
      section: .rdata

  - id: disklib-dismount-helper
    desc: VMware volume-dismount helper marker
    if:
      type: text
      substr: W32Util_DismountVolumes
      section: .rdata

composite_rules:
  - id: vmware-disklib-identity
    desc: VMware virtual-disk library identity
    crit: notable
    conf: 0.99
    all:
      - id: metadata/signed/leaf::vmware-inc.
      - id: disklib-pdb-identity
      - id: disklib-vix-entrypoint
      - id: disklib-v2i-image-api

  - id: vmware-disklib-context
    desc: Recognized VMware disk library context
    crit: exception
    conf: 0.99
    all:
      - id: vmware-disklib-identity
      - id: disklib-dismount-helper
