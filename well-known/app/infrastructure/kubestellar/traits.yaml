# KubeStellar Hive — multi-cluster orchestration and agent management framework.
defaults:
  platforms: [linux, windows]
  for: [shell, source, zip, systemd, text]
  crit: notable
  conf: 0.95
  size_max: 50000000

traits:
  - id: source-tree-member
    desc: KubeStellar Hive source tree member
    if:
      type: path
      regex: 'github\.com[\\/]kubestellar[\\/]hive'

  - id: hive-checkout-guard-script
    desc: KubeStellar Hive checkout guard reference
    for: [systemd, shell]
    if:
      type: text
      substr: hive-checkout-guard.sh

  - id: hive-snapshot-service
    desc: KubeStellar Hive snapshot service unit
    for: [systemd]
    if:
      type: path
      basename: true
      exact: hive-snapshot.service

  - id: hive-prereq-check-script
    desc: KubeStellar Hive prereq check script
    for: [shell]
    if:
      type: path
      basename: true
      exact: hive-prereq-check.sh

composite_rules:
  - id: kubestellar-hive-context
    desc: KubeStellar Hive infrastructure context
    crit: exception
    conf: 0.98
    scope: archive
    any:
      - id: source-tree-member
      - id: hive-checkout-guard-script
      - id: hive-snapshot-service
      - id: hive-prereq-check-script
