# KubeStellar (kubestellar/kubestellar) is a CNCF Sandbox multi-cluster
# Kubernetes configuration manager. This archive is a ghproxy mirror of the
# official source tree, not a trojanized fork.
defaults:
  platforms: [unix, windows]
  for: [go, markdown, text, zip, archives, github-actions]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 10000000

traits:
  - id: source-tree-member
    desc: KubeStellar versioned source-tree member
    if:
      type: path
      regex: 'kubestellar[\\/]kubestellar@'

  - id: go-module-path
    desc: KubeStellar Go module path
    for: [go, text]
    if:
      type: text
      substr: module github.com/kubestellar/kubestellar

  - id: cncf-project-readme
    desc: KubeStellar CNCF project README
    for: [markdown]
    if:
      type: text
      substr: KubeStellar is a Cloud Native Computing Foundation
