# LFK — Lightning Fast Kubernetes navigator (janosmiko/lfk).
defaults:
  platforms: [unix, windows]
  for: [go, zip, tar, archives, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: github-repo-url
    desc: janosmiko/lfk GitHub repository
    if:
      type: text
      substr: github.com/janosmiko/lfk

  - id: kubernetes-navigator-summary
    desc: LFK Lightning Fast Kubernetes navigator summary
    if:
      type: text
      substr: Lightning Fast Kubernetes navigator

composite_rules:
  - id: lfk-k8s-navigator
    desc: LFK Lightning Fast Kubernetes navigator
    crit: notable
    any:
      - id: github-repo-url
      - id: kubernetes-navigator-summary
