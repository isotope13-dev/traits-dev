# Cloud Custodian (c7n) — open-source cloud governance and policy engine.
# ShieldMetrics filters enumerate AWS DDoS Protection attack-vector names for
# defensive monitoring, not attack tooling.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Cloud Custodian c7n wheel distribution name
    for: [whl, pkginfo]
    if:
      type: value
      path: whl.distribution
      exact: c7n

  - id: package-module-path
    desc: Cloud Custodian c7n package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])c7n[\\/]'

  - id: cloud-custodian-homepage
    desc: Cloud Custodian project homepage
    if:
      type: text
      substr: cloudcustodian.io

  - id: shield-metrics-filter-class
    desc: Cloud Custodian AWS Shield metrics filter class
    for: [python]
    if:
      type: text
      substr: class ShieldMetrics

  - id: aws-ddos-protection-namespace
    desc: AWS DDoS Protection CloudWatch namespace
    for: [python]
    if:
      type: text
      substr: AWS/DDoSProtection

composite_rules:
  - id: cloud-custodian-policy-engine
    desc: Cloud Custodian cloud governance policy engine
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: wheel-distribution
      - id: cloud-custodian-homepage
      - id: package-module-path

  - id: shield-ddos-metrics-filter-context
    desc: Cloud Custodian AWS Shield DDoS metrics filter
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: package-module-path
      - id: shield-metrics-filter-class
      - id: aws-ddos-protection-namespace
