defaults:
  platforms: [unix, windows]

traits:
  - id: runtime-name
    desc: OpenRemote runtime identifier
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      exact: openremote
  - id: keycloak-mode
    desc: OpenRemote Keycloak auth mode
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      exact: KEYCLOAK

composite_rules:
  - id: manager-auth-context
    desc: Recognized OpenRemote manager authentication client context
    crit: exception
    conf: 0.99
    all:
      - id: runtime-name
      - id: keycloak-mode
