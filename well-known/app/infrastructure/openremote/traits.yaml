# OpenRemote — open-source IoT platform (openremote/openremote). Its deploy
# workflows overlay the whole secrets map into a SECRETS env var for the
# deployment matrix (ECR/docker/maven publishing across repos); the
# serialization feeds its own deploy scripts, not an exfiltration sink.
defaults:
  platforms: [unix, windows]
  for: [github-actions, text]
  crit: notable
  conf: 0.98

traits:
  - id: openremote-repo-reference
    desc: OpenRemote repository reference
    if:
      type: text
      substr: openremote/openremote
  - id: openremote-manager-image
    desc: OpenRemote manager container image reference
    if:
      type: text
      substr: openremote/manager

composite_rules:
  - id: openremote-deploy-context
    desc: OpenRemote deploy workflow context
    crit: exception
    conf: 0.97
    for: [github-actions]
    any:
      - id: openremote-repo-reference
      - id: openremote-manager-image
