defaults:
  for: [pe]
  platforms: [windows]
  size_min: 1048576
  crit: notable
  conf: 0.98

traits:
  - id: windows-exporter-go-module
    desc: Prometheus Windows exporter main module
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/prometheus-community/windows_exporter

  - id: prometheus-go-module
    desc: Prometheus Go module identity
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/prometheus/prometheus
