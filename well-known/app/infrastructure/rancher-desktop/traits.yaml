defaults:
  platforms: [unix, windows]
  for: [scripts, source, manifests, documents, binaries, zip, dmg]
  crit: notable
  conf: 0.98
  size_max: 800000000

traits:
  - id: app-bundle
    desc: Rancher Desktop app bundle member
    if:
      type: path
      regex: 'Rancher Desktop|rancher-desktop|Rancher\.Desktop'
