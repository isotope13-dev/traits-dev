# Official Microsoft Azure CLI (github.com/Azure/azure-cli).
# Role/Graph command modules implement legitimate Entra admin CRUD, including
# application/servicePrincipal password rotation — not identity-plane backdoors.
defaults:
  platforms: [unix, windows]
  for: [python, shell, text, markdown, json, archives, tar, gz, zip]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: setup-package-name
    desc: azure-cli setuptools package name
    for: [python, text]
    if:
      type: text
      regex: "name\\s*=\\s*['\"]azure-cli['\"]"

  - id: github-repo-url
    desc: Azure CLI upstream GitHub repository URL
    for: [python, text, markdown]
    if:
      type: text
      substr: github.com/Azure/azure-cli

  - id: source-tree-path
    desc: Azure CLI source tree path
    if:
      type: path
      regex: '(^|[/\\])azure-cli-(azure-cli-)?[0-9]'

  - id: cli-module-path
    desc: Azure CLI Python command module path
    if:
      type: path
      regex: 'cli[/\\]command_modules'

  - id: msft-copyright-header
    desc: Microsoft Corporation source copyright header
    for: [python, text]
    if:
      type: text
      substr: 'Copyright (c) Microsoft Corporation. All rights reserved.'

composite_rules:
  - id: azure-cli-source-tree
    desc: Official Microsoft Azure CLI source tree
    crit: notable
    conf: 0.99
    any:
      - id: setup-package-name
      - id: github-repo-url
      - id: source-tree-path
      - id: cli-module-path

  - id: azure-cli-context
    desc: Recognized official Azure CLI source tree
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: setup-package-name
      - id: github-repo-url
      - id: source-tree-path
      - id: cli-module-path
      - id: msft-copyright-header
