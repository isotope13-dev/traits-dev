# Official Microsoft Azure CLI (github.com/Azure/azure-cli).
# Role/Graph command modules implement legitimate Entra admin CRUD, including
# application/servicePrincipal password rotation — not identity-plane backdoors.
defaults:
  platforms: [unix, windows]
  for: [python, shell, text, markdown, json, archives, tar, gz, zip]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: setup-package-name
    desc: azure-cli setuptools package name
    for: [python, text]
    if:
      type: text
      regex: "name\\s*=\\s*['\"]azure-cli['\"]"

  - id: github-repo-url
    desc: Azure CLI upstream GitHub repository URL
    for: [python, text, markdown]
    if:
      type: text
      substr: github.com/Azure/azure-cli

  - id: source-tree-path
    desc: Azure CLI source tree path
    if:
      type: path
      regex: '(^|[/\\])azure-cli-(azure-cli-)?[0-9]'

  - id: cli-module-path
    desc: Azure CLI Python command module path
    if:
      type: path
      regex: 'cli[/\\]command_modules'

  - id: cli-core-module-import
    desc: Azure CLI core module import
    for: [python, text]
    if:
      type: text
      regex: '\b(from|import)\s+azure\.cli\.core\b'

composite_rules:
  - id: azure-cli-source-tree
    desc: Official Microsoft Azure CLI source tree
    crit: notable
    conf: 0.99
    any:
      - id: setup-package-name
      - id: github-repo-url
      - id: source-tree-path
      - id: cli-module-path
      - id: cli-core-module-import

  # The same identity markers, pooled across the whole input so a rule firing
  # in one file of an Azure CLI tree is suppressed by a marker found in a
  # sibling file. It deliberately does NOT accept a bare Microsoft copyright
  # header: that string is vendored into anything derived from a Microsoft
  # repo, and it used to let unrelated code silence ransomware and OAuth
  # persistence rules here.
  - id: azure-cli-context
    desc: Recognized official Azure CLI source tree
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: setup-package-name
      - id: github-repo-url
      - id: source-tree-path
      - id: cli-module-path
