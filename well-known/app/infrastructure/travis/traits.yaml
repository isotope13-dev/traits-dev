defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: github-token-login
    desc: Travis CLI authenticates with GitHub token
    if:
      type: text
      regex: '(?m)^\s*travis\s+login[^\n]{0,60}--github-token\b'

  - id: cli-token-authorization
    desc: Travis CLI token supplies HTTP authorization
    if:
      type: text
      substr: 'Authorization: token $(travis token)'

  - id: build-request-endpoint
    desc: Travis API build-request endpoint
    if:
      type: text
      regex: 'https://api\.travis-ci\.(org|com)/repo/.{1,180}/requests'

composite_rules:
  # The GitHub token authenticates the Travis CLI; the subsequent request uses
  # a Travis-issued token and sends build parameters, not the GitHub secret.
  - id: authenticated-build-request-context
    desc: Travis CLI-authenticated build request
    crit: exception
    conf: 0.99
    near_lines: 20
    all:
      - id: github-token-login
      - id: cli-token-authorization
      - id: build-request-endpoint
