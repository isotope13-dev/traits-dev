# astrapi-mirror — Debian-repository mirror web UI (astrapi-core). HTTP
# fetches, GPG key import, and apt repo serving are the product; identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: astrapi-mirror PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: astrapi_mirror

  - id: package-metadata-name
    desc: astrapi-mirror PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*astrapi-mirror\s*$'

  - id: user-agent
    desc: astrapi-mirror HTTP User-Agent token
    for: [python]
    if:
      type: text
      substr: 'astrapi-mirror/1.0'

  - id: cli-module-path
    desc: astrapi-mirror console entry module path
    for: [python, whl]
    if:
      type: path
      regex: 'astrapi_mirror[\\/]_cli\.py'

composite_rules:
  - id: astrapi-mirror-package
    desc: astrapi-mirror Debian mirror package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: user-agent
      - id: cli-module-path
    needs: 2
