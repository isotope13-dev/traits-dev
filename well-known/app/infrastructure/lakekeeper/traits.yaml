# Lakekeeper is an Apache Iceberg REST catalog server (lakekeeper.io).
defaults:
  platforms: [unix, windows]
  for: [tar, shell, python, rust, javascript, json]
  crit: notable
  conf: 0.99

traits:
  - id: product-name-string
    desc: Lakekeeper product name reference
    if:
      type: text
      word: lakekeeper

  - id: iceberg-rest-description
    desc: Apache Iceberg REST catalog description
    if:
      type: text
      substr: "Apache Iceberg REST"

composite_rules:
  - id: lakekeeper-catalog-context
    desc: Recognized Lakekeeper Iceberg REST catalog
    crit: notable
    conf: 0.99
    all:
      - id: product-name-string
      - id: iceberg-rest-description
