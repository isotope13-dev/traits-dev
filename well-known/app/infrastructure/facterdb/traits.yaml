# Vox Pupuli FacterDB — Puppet/Facter version matrix used by rspec-puppet-facts.
#
# Ships Vagrant/Packer image-build helpers (Boxstarter, sysprep generalize,
# RDP firewall for test VMs). Those are provisioning scripts, not backdoors.
defaults:
  platforms: [unix, windows]
  for: [gem, shell, batch, powershell]
  conf: 0.99
  size_max: 52428800

traits:
  - id: facterdb-gem-name
    desc: FacterDB Ruby gem package name
    crit: notable
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: facterdb

  - id: facterdb-get-facts-script
    desc: FacterDB get_facts provisioning script
    crit: notable
    for: [shell]
    size_min: 1000
    size_max: 524288
    if:
      type: path
      basename: true
      exact: get_facts.sh

  - id: facterdb-windows-packer-tree
    desc: FacterDB Windows Packer script tree
    crit: notable
    if:
      type: path
      regex: '(?i)windows_packer[\\/]'

  - id: packer-sysprep-generalize-oobe
    desc: Packer sysprep generalize OOBE shutdown
    crit: notable
    for: [batch, powershell, shell]
    size_max: 4096
    if:
      type: text
      regex: '(?i)sysprep\.exe\s+/generalize\s+/oobe'

composite_rules:
  - id: facterdb-packer-image-build-context
    desc: FacterDB Packer Vagrant image build context
    crit: notable
    needs: 2
    any:
      - id: facterdb-gem-name
      - id: facterdb-get-facts-script
      - id: facterdb-windows-packer-tree
      - id: packer-sysprep-generalize-oobe
