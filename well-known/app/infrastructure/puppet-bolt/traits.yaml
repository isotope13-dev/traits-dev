# Puppet Bolt — orchestration tool with SSH/WinRM/SMB transports.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.98

traits:
  - id: bolt-module-namespace
    desc: Bolt orchestration module namespace
    if:
      type: text
      regex: '(?m)^module Bolt\b'

  - id: bolt-winrm-transport-class
    desc: Bolt WinRM transport class
    if:
      type: text
      substr: 'class WinRM < Simple'

  - id: bolt-gem-name
    desc: Puppet Bolt gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: bolt

  - id: bolt-smb-port-constant
    desc: Bolt SMB file transfer port constant
    if:
      type: text
      substr: 'SMB_PORT = 445'

composite_rules:
  - id: bolt-orchestration-context
    desc: Puppet Bolt orchestration source context
    crit: exception
    conf: 0.99
    all:
      - id: bolt-module-namespace
    any:
      - id: bolt-winrm-transport-class
      - id: bolt-gem-name
      - id: bolt-smb-port-constant
