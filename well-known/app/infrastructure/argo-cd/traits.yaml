# Argo CD (argoproj/argo-cd) — CNCF GitOps continuous delivery controller.
# The UI package pins argo-ui from the sibling argoproj repository; ui-test has a
# short description string — together those are not dependency-confusion staging.
defaults:
  platforms: [unix, windows]
  for: [go, zip, archives, package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: Argo CD versioned source-tree member
    if:
      type: path
      regex: 'argoproj[\\/]argo-cd[\\/]v2@'

  - id: go-module-path
    desc: Argo CD Go module path
    for: [go, text]
    if:
      type: text
      substr: module github.com/argoproj/argo-cd/v2

  - id: ui-argo-ui-git-dependency
    desc: Argo CD UI argo-ui git dependency
    for: [package.json]
    if:
      type: text
      substr: argoproj/argo-ui.git

composite_rules:
  - id: argo-cd-source-tree
    desc: Argo CD GitOps continuous delivery source tree
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: source-tree-member
      - id: go-module-path
      - id: ui-argo-ui-git-dependency
