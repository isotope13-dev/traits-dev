defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: unit-runtime-config-file
    desc: NGINX Unit live configuration file
    conf: 0.9
    if:
      type: text
      substr: /var/lib/unit/conf.json
  - id: unit-control-socket
    desc: NGINX Unit control socket path
    conf: 0.9
    if:
      type: text
      substr: 'control.unit.sock'
composite_rules:
  - id: unit-live-config-surface
    desc: NGINX Unit live configuration surface
    crit: notable
    conf: 0.9
    any:
      - id: well-known/app/infrastructure/nginx-unit::unit-runtime-config-file
      - id: well-known/app/infrastructure/nginx-unit::unit-control-socket
