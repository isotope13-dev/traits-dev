defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.98

traits:
  - id: puppet-module-namespace
    desc: Puppet Ruby module namespace
    for: [ruby]
    if:
      type: text
      regex: '(?m)^module Puppet\b'

  - id: puppet-type-provider-declaration
    desc: Puppet type or provider declaration
    for: [ruby]
    if:
      type: text
      regex: 'Puppet::Type\.(type\(.{0,80}\)\.provide|newtype\()'

  - id: puppet-osx-installer-script
    desc: Puppet macOS installer script
    for: [shell, ruby]
    if:
      type: text
      regex: '(?i)(/Local/Target/Users/puppet|looking for Puppet User)'

  - id: puppet-gem-metadata-name
    desc: Puppet gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: puppet

composite_rules:
  - id: puppet-source-context
    desc: Puppet configuration management source
    crit: notable
    conf: 0.99
    for: [ruby, gem, shell]
    any:
      - id: puppet-module-namespace
      - id: puppet-type-provider-declaration
      - id: puppet-gem-metadata-name
      - id: puppet-osx-installer-script
