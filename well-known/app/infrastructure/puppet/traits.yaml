defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.98

traits:
  - id: puppet-module-namespace
    desc: Puppet Ruby module namespace
    if:
      type: text
      regex: '(?m)^module Puppet\b'

  - id: puppet-type-provider-declaration
    desc: Puppet type provider declaration
    if:
      type: text
      regex: 'Puppet::Type\.type\(.{0,80}\)\.provide'

  - id: puppet-gem-metadata-name
    desc: Puppet gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: puppet

composite_rules:
  - id: puppet-source-context
    desc: Puppet configuration management source
    crit: notable
    conf: 0.99
    any:
      - id: puppet-module-namespace
      - id: puppet-type-provider-declaration
      - id: puppet-gem-metadata-name
