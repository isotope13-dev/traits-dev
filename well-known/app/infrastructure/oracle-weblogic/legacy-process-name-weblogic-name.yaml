# A name reference alone does not establish interaction with the server.
defaults:
  size_min: 1
  platforms: [unix]
  for: [c, cpp, objc, elf]
  crit: component
  conf: 0.4

traits:
  - id: weblogic-name
    crit: notable
    desc: WebLogic application server name
    if:
      type: text
      word: weblogic
