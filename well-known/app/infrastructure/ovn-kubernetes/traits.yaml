# OVN-Kubernetes — Kubernetes network provider for OVN (Open Virtual Network).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: source-archive-member
    desc: OVN-Kubernetes source tree member
    for: [zip, tar]
    if:
      type: value
      path: "archive.members[*].path"
      substr: github.com/ovn-org/ovn-kubernetes/go-controller@

  - id: module-path
    desc: OVN-Kubernetes Go module path
    for: [go, go.mod]
    if:
      type: text
      substr: github.com/ovn-org/ovn-kubernetes/go-controller

  - id: cni-shim-source
    desc: OVN-Kubernetes CNI shim source
    for: [go]
    if:
      type: path
      regex: 'pkg/cni/cnishim\.go$'

composite_rules:
  - id: ovn-kubernetes-context
    desc: OVN-Kubernetes container network provider context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: source-archive-member
      - id: module-path
      - id: cni-shim-source
