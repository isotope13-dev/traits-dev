# JFrog Artifactory server-identity markers: the user-plugin SDK surface and
# the plugin deployment path. Artifactory user plugins are Groovy scripts that
# the repository server executes inside its own process, so code carrying
# these markers runs with the server's privileges. Composites for malicious
# plugin use live in objectives/command-and-control/infrastructure/ci-abuse/.
defaults:
  platforms: [unix]
  for: [groovy, java]
  crit: notable
  conf: 0.9

traits:
  - id: plugin-sdk
    desc: JFrog Artifactory user-plugin SDK API usage
    if:
      type: text
      regex: '\borg\.artifactory\.[a-z]'

  - id: plugins-directory
    desc: JFrog Artifactory etc/plugins deployment path
    conf: 0.95
    if:
      type: text
      regex: '(/var/opt/jfrog/artifactory|ARTIFACTORY_HOME)[^\s"'']{0,12}/etc/plugins\b'
