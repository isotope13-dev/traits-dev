# Replicated kURL is a Kubernetes installer. Its host preflights may offer to
# relax firewall and SELinux policy, while its CNI migration code temporarily
# opens INPUT before restoring the saved rules. These stable source markers
# identify that product without relying on archive names or release versions.
defaults:
  platforms: [linux]
  for: [shell]
  crit: notable

traits:
  - id: installer-docs-url
    desc: Replicated kURL installer documentation URL
    conf: 0.99
    if:
      type: text
      substr: kurl.sh/docs/install-with-kurl/

  - id: binary-path-variable
    desc: Replicated kURL binary path variable
    conf: 0.98
    if:
      type: text
      word: BIN_KURL
