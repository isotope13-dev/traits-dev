# Azure DevOps Artifacts managed npm registries.
defaults:
  platforms: [unix, windows]
  for: [package-lock.json]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  # Was pinned to one org/project/feed triple (monacotools/Monaco/vscode), so
  # only the VS Code core team's feed was recognised. Microsoft publishes from
  # many public ADO feeds — ms-vscode.cpptools bootstraps yarn from
  # azure-public/VisualCpp/cpp_PublicPackages — and each unrecognised feed
  # produced three `suspicious` off-registry findings on an official extension.
  # Anchor on the Azure DevOps Artifacts npm-feed URL shape instead, which is
  # how the consuming rule already treats every other managed registry host
  # (artifactory, nexus, jfrog, npm.pkg.github.com, *-npm.pkg.dev).
  - id: azure-devops-artifacts-npm-feed
    desc: Azure DevOps Artifacts npm feed URL
    crit: notable
    if:
      type: value
      path: packages.*.resolved
      regex: '^https?://pkgs\.dev\.azure\.com/[^/]+/[^/]+/_packaging/[^/]+/npm/registry/'
  - id: azure-devops-legacy-artifacts-npm-feed
    desc: Legacy Azure DevOps Artifacts npm feed URL
    crit: notable
    if:
      type: value
      path: packages.*.resolved
      regex: '^https://[^/]+\.pkgs\.visualstudio\.com/[^/]+/_packaging/[^/]+/npm/'
