defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98
  size_max: 800000000

traits:
  - id: logstash-container-archive
    desc: Official Logstash container archive
    crit: notable
    for: [tar]
    if:
      type: basename
      regex: '^docker\.io_library_logstash_[0-9]'

  - id: elasticsearch-filter-gem-name
    desc: Logstash Elasticsearch filter plugin gem
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: logstash-filter-elasticsearch

  - id: elasticsearch-filter-plugin-class
    desc: Logstash Elasticsearch filter plugin class
    for: [ruby]
    if:
      type: text
      substr: 'LogStash::Filters::Elasticsearch'

composite_rules:
  - id: logstash-elasticsearch-filter-plugin
    desc: Elastic Logstash Elasticsearch filter plugin
    crit: notable
    conf: 0.99
    scope: outer
    for: [gem, ruby]
    any:
      - id: elasticsearch-filter-gem-name
    all:
      - id: elasticsearch-filter-plugin-class
