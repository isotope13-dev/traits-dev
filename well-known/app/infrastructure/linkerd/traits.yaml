# Linkerd 1.x (Buoyant / CNCF) Scala service mesh proxy. CI fetches
# h2spec and protoc from GitHub releases; jquery-ui is the admin UI
# vendor bundle. Download, tar, chmod, and local exec stay notable.
defaults:
  platforms: [unix, windows]
  for: [scala, markdown, text, shell, tar, archives]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: github-repo
    desc: Linkerd 1.x GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/linkerd/linkerd/

  - id: sbt-organization
    desc: Buoyant Linkerd sbt organization
    for: [scala, text]
    conf: 0.99
    if:
      type: text
      substr: 'organization := "io.buoyant"'

  - id: build-object
    desc: Linkerd sbt build object name
    for: [scala, text]
    conf: 0.98
    if:
      type: text
      substr: object LinkerdBuild

  - id: scala-package
    desc: Buoyant Linkerd Scala package
    for: [scala, text]
    conf: 0.97
    if:
      type: text
      substr: package io.buoyant.linkerd

  - id: package-path
    desc: Buoyant Linkerd source package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)io[\\/]buoyant[\\/]'

composite_rules:
  - id: linkerd-1x-source
    desc: Linkerd 1.x service mesh proxy source
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: github-repo
      - id: sbt-organization
      - id: build-object
      - id: scala-package
      - id: package-path
