# Any OCI runtime binary, not just runc.
#
# runc, crun, youki and podman's helpers all implement the same
# runtime-spec lifecycle, and they all copy their own executable into a
# memfd and `fexecve` it. That is not fileless staging -- it is the
# DOCUMENTED mitigation for CVE-2019-5736, the 2019 runc container escape
# where a malicious image overwrote the runtime binary through
# /proc/self/exe. Every conformant runtime has done it since.
#
# So a runtime binary necessarily carries socket create/connect/send/receive
# (it talks to its own init over a socketpair), write, fexecve and
# memfd_create -- which is `raw-socket-anonymous-stage-execution` leg for
# leg. That rule already reasons this way about liblxc, but only via a
# downgrade keyed on a 200+ export table; crun is a 489KB *executable* with
# no exports, so the downgrade cannot reach it. minikube's kicbase image
# (kubernetes-minikube-v1.38.0-kicbase-v0.0.49) scored hostile on usr/bin/crun.
#
# Both legs required: the namespace refs alone are in anything that reads
# /proc/*/ns, and the hook strings alone are in the spec's own JSON. Together
# they are a binary that implements the runtime-spec lifecycle.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  size_min: 4096
  size_max: 200000000

composite_rules:
  - id: oci-runtime-lifecycle-binary
    desc: OCI runtime-spec lifecycle binary
    crit: exception
    conf: 0.98
    scope: file
    # The notable atoms directly rather than the `ns-refs`/`hooks-refs`
    # roll-ups, which are `component` tier.
    all:
      - id: micro-behaviors/os/container/namespace::setns-str
    any:
      - id: micro-behaviors/os/container/namespace::prestart-str
      - id: micro-behaviors/os/container/namespace::poststart-str
      - id: micro-behaviors/os/container/namespace::poststop-str
    needs: 1
