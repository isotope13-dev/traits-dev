# Nonempty-content bound; preserves every existing positive match.
# Neutral container term references; names do not prove runtime use.
defaults:
  size_min: 1
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
traits:
- id: runc-oci-str
  desc: opencontainers/runc text reference
  crit: notable
  conf: 0.9
  size_min: 18
  if:
    type: text
    substr: opencontainers/runc
