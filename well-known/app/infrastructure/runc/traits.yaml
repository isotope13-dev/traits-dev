# Official runc source-tree identity used to distinguish its documented
# memfd-bind helper from fileless payload staging.
defaults:
  platforms: [linux]
  for: [go]
  crit: notable
  conf: 1.0

traits:
  - id: runc-source-member-path
    desc: OpenContainers runc source member path
    if:
      type: path
      regex: 'github\.com/opencontainers/runc@v[0-9]+(\.[0-9]+)*'
