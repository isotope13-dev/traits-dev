# Official runc source-tree identity used to distinguish its documented
# memfd-bind helper and seccomp agent from fileless payload staging.
defaults:
  platforms: [linux]
  for: [go, c, cpp, zip, tar, gz]
  crit: notable
  conf: 1.0
  size_min: 1024
  size_max: 200000000

traits:
  - id: runc-source-member-path
    desc: OpenContainers runc source member path
    if:
      type: path
      regex: 'opencontainers/runc@v[0-9]'

  - id: source-archive-member
    desc: runc source archive root member
    for: [zip, tar, gz]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/opencontainers/runc@v[0-9][^/]+/README\.md$'

  - id: source-go-mod-member
    desc: runc source archive go.mod member
    for: [zip, tar, gz]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/opencontainers/runc@v[0-9][^/]+/go\.mod$'

  - id: seccompagent-source-path
    desc: runc seccompagent source path
    for: [go]
    if:
      type: path
      regex: 'seccompagent/seccompagent\.go$'

composite_rules:
  - id: runc-source-archive-context
    desc: Recognized runc source release archive
    crit: exception
    conf: 0.99
    for: [zip, tar, gz]
    scope: outer
    all:
      - id: source-archive-member
      - id: source-go-mod-member

  - id: runc-source-tree-context
    desc: Recognized runc source tree
    crit: exception
    conf: 0.99
    any:
      - id: runc-source-member-path
      - id: seccompagent-source-path
