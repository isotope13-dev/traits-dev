# Azure HPC/AI VM Images (github.com/Azure/azhpc-images)
# Official Microsoft repository for building Azure HPC and AI virtual machine images.
defaults:
  platforms: [unix, windows]
  for: [shell, text, markdown, json, yaml, yml, tar, gz, zip]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree-path
    desc: Azure HPC images source tree path
    if:
      type: path
      regex: '(?i)(^|[/\\])azhpc-images([@/\\]|$)'

  - id: github-repo-url
    desc: Azure HPC images GitHub repository reference
    for: [markdown, text, shell]
    if:
      type: text
      substr: github.com/Azure/azhpc-images

  - id: readme-heading
    desc: Azure HPC/AI VM Images README heading
    for: [markdown, text]
    if:
      type: text
      substr: '# Azure HPC/AI VM Images'

  - id: hpc-pipeline-reference
    desc: Azure HPC image validation pipeline reference
    for: [markdown, text, yaml, yml]
    if:
      type: text
      substr: hpc-platform-team/hpc-image-val

  - id: azurelinux-pr-url
    desc: Azure Linux GitHub PR reference
    for: [shell, text, markdown]
    if:
      type: text
      substr: github.com/microsoft/azurelinux/pull/

  - id: al3-firewall-reset-comment
    desc: Azure Linux iptables service reset comment
    for: [shell, text]
    if:
      type: text
      substr: AL3 has an iptables systemd service

composite_rules:
  - id: azhpc-images-context
    desc: Azure HPC VM images build context
    crit: exception
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: source-tree-path
      - id: github-repo-url
      - id: readme-heading
      - id: hpc-pipeline-reference
      - id: azurelinux-pr-url
      - id: al3-firewall-reset-comment
