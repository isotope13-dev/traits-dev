# wads — Python packaging and CI automation toolkit.
defaults:
  platforms: [unix, windows]
  for: [github-actions, python]
  crit: notable
  conf: 0.98

traits:
  - id: wads-action-reference
    desc: wads GitHub Action reference
    for: [github-actions]
    if:
      type: text
      substr: i2mint/wads/actions/

  - id: wads-ci-secrets-marker
    desc: wads CI secrets transport marker
    if:
      type: text
      substr: WADS_CI_SECRETS_JSON

composite_rules:
  - id: wads-ci-context
    desc: wads CI workflow context
    crit: exception
    conf: 0.99
    for: [github-actions]
    any:
      - id: wads-action-reference
      - id: wads-ci-secrets-marker
