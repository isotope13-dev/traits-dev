# Official Netris agent installer (get.netris.io). It downloads its own
# scripts into /opt/netris; that prefix is the product install tree, not a
# foreign application the payload is hiding inside.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: netris-install-prefix
    desc: Netris install prefix /opt/netris
    if:
      type: text
      substr: /opt/netris/
  - id: netris-repository-host
    desc: Netris package repository host
    if:
      type: text
      substr: repo.netris.ai

composite_rules:
  - id: netris-agent-installer
    desc: Netris agent installer for its own prefix
    all:
      - id: netris-install-prefix
      - id: netris-repository-host
