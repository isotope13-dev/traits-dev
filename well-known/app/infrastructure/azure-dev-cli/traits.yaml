# Azure Developer CLI (azd) — Microsoft "code to cloud" toolchain.
# CI fetches github/gh-aw-actions; start_mcp_gateway.cjs writes Copilot
# MCP config under ~/.copilot and spawns the gateway container. Identity only.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, manifests, go, go.mod, markdown, text, tar, archives]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 200000000

traits:
  - id: azure-dev-cli-source-path
    desc: Azure Developer CLI source tree
    conf: 0.97
    if:
      type: path
      regex: 'azure-dev-cli|azure-dev-azure-dev-cli'

  - id: github-repo
    desc: Azure Developer CLI GitHub repository
    for: [markdown, text]
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/azure/azure-dev'

  - id: go-module
    desc: azd Go module path
    for: [go, go.mod, text]
    conf: 0.99
    if:
      type: text
      substr: github.com/azure/azure-dev/cli/azd

composite_rules:
  - id: azure-dev-cli-source
    desc: Azure Developer CLI azd sources
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: azure-dev-cli-source-path
      - id: github-repo
      - id: go-module
