# Official AWS Agent Toolkit for AWS (github.com/aws/agent-toolkit-for-aws).
# Skills installers and payment-policy unit tests are tooling, not wipe/steal
# payloads.
defaults:
  platforms: [unix, windows]
  for: [shell, python, markdown, text, json, archives, tar, gz]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: readme-title
    desc: Agent Toolkit for AWS README title
    for: [markdown, text]
    if:
      type: text
      regex: '(?m)^# Agent Toolkit for AWS\s*$'

  - id: github-repo-url
    desc: Agent Toolkit for AWS GitHub repository URL
    for: [markdown, text]
    if:
      type: text
      substr: github.com/aws/agent-toolkit-for-aws

  - id: source-tree-path
    desc: Agent Toolkit for AWS source tree path
    if:
      type: path
      regex: '(^|[/\\])agent-toolkit-for-aws'

  - id: db2-driver-script
    desc: RDS Db2 driver install script basename
    for: [shell]
    if:
      type: basename
      exact: db2-driver.sh

composite_rules:
  - id: agent-toolkit-context
    desc: Recognized AWS Agent Toolkit for AWS source tree
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: readme-title
      - id: github-repo-url
      - id: source-tree-path
