# Gardener — SAP Kubernetes cluster management; shoot nodes provision a
# dedicated `gardener` admin user with passwordless sudo for operations.
defaults:
  platforms: [unix, windows]
  for: [go, shell, markdown, text, tar, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: github-module
    desc: Gardener GitHub module path
    if:
      type: text
      substr: github.com/gardener/gardener

  - id: source-tree-path
    desc: Gardener source tree path
    if:
      type: path
      regex: '(?i)gardener/gardener@'

  - id: gardener-user-sudoers-marker
    desc: Gardener shoot node user sudoers drop-in path
    for: [shell, go]
    if:
      type: text
      substr: sudoers.d/99-gardener-user

composite_rules:
  - id: gardener-context
    desc: Official Gardener Kubernetes management project
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: github-module
      - id: source-tree-path
