# k8s.io/cri-api — Kubernetes Container Runtime Interface protobuf/gRPC API.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: Kubernetes CRI API Go module path
    if:
      type: text
      substr: k8s.io/cri-api

  - id: source-archive-path
    desc: Kubernetes CRI API module source path
    for: [go, zip]
    if:
      type: path
      regex: 'k8s\.io/cri-api@'
