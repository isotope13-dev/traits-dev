# Windmill workflow platform source (github.com/windmill-labs/windmill).
# Container recipes stage Monaco under /tmp/monaco and use UNION SQL in
# sqlx query metadata — normal product behavior, not miner staging or injection.
defaults:
  platforms: [unix, windows]
  for: [zip, dockerfile, javascript, typescript, rust, go, shell, source, text, npm]
  crit: notable
  conf: 0.99

traits:
  - id: github-source-path
    desc: Windmill GitHub module source-tree path
    if:
      type: path
      regex: 'windmill-labs[\\/]windmill@'

  - id: go-proxy-archive-basename
    desc: Go module proxy Windmill source archive basename
    for: [zip]
    if:
      type: path
      regex: 'windmill-labs_windmill'

  - id: npm-windmill-cli-name
    desc: npm package name windmill-cli
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: windmill-cli

  - id: dockerfile-tmp-monaco-staging
    desc: Windmill Dockerfile /tmp/monaco staging
    for: [dockerfile]
    if:
      type: text
      substr: /tmp/monaco

  - id: sqlx-offline-query-member
    desc: sqlx offline query cache JSON member
    for: [json, source]
    if:
      type: path
      substr: /.sqlx/query-

composite_rules:
  - id: source-tree
    desc: Windmill upstream source context
    crit: exception
    conf: 0.99
    any:
      - id: github-source-path
      - id: go-proxy-archive-basename
      - id: npm-windmill-cli-name
      - id: sqlx-offline-query-member
