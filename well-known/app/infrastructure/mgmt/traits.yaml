# mgmt (github.com/purpleidea/mgmt) — distributed, event-driven configuration
# management engine. Its own tree ships shell helpers that download and unpack
# build dependencies, which is why the dropper objectives reference this
# identity from `unless:`.
defaults:
  platforms: [unix]
  for: [source, scripts, shell, python, archives]
  crit: notable
  conf: 0.98
  size_max: 300000000

traits:
  # Unambiguous identity: Go files, the go.mod, CI helpers and docs carry this
  # upstream repository reference. It is a repository reference in shell and
  # Python helpers, not necessarily a Go module declaration.
  - id: mgmt-upstream-repository-reference
    desc: mgmt upstream repository reference
    for: [go, shell, python]
    if:
      type: text
      substr: github.com/purpleidea/mgmt

  # Release-tarball layout, for the tree's non-Go helper scripts that never name
  # the module path. Anchored to a whole path segment carrying a dotted version,
  # so it cannot claim `azure-mgmt-core-1.4.0` or a plain `mgmt-2024/` directory
  # as this project.
  - id: mgmt-source-tree
    desc: Unpacked mgmt release source tree
    if:
      type: path
      regex: '(^|/)mgmt-[0-9]+\.[0-9]+\.[0-9]+'
