# Encore (encore.dev) is a backend framework whose CLI compiles an app into a
# container image. The CLI is Linux-only, so build scripts on other hosts run it
# inside a container that has the Docker socket mounted and installs the CLI
# from the vendor's official script -- the same shape as a socket-mounted
# payload pull, but with a named vendor installer and the vendor's own build
# command beside it.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95

traits:
  - id: official-installer-command
    desc: Official Encore CLI installer command
    if:
      type: text
      substr: 'https://encore.dev/install.sh'

  - id: build-docker-command
    desc: Encore CLI docker image build command
    if:
      type: text
      substr: 'encore build docker'

composite_rules:
  - id: cli-container-build-context
    desc: Encore CLI container build script
    crit: exception
    all:
      - id: official-installer-command
      - id: build-docker-command
