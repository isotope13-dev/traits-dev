# Windows CardSpace (InfoCard) was shipped with .NET Framework 3.0 as the
# Microsoft digital-identity service.  Its local RPC, token, ACL, and crypto
# implementation is expected for this component and is not malware intent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 262144
  size_max: 2097152

traits:
  - id: infocard-original-filename
    desc: Windows CardSpace original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: infocard.exe
      case_insensitive: true

  - id: windows-cardspace-description
    desc: Windows CardSpace version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Windows CardSpace

  - id: infocard-manifest-description
    desc: CardSpace digital identity service manifest
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.manifest.description
      exact: The Digital Identity Service.

  - id: infocard-assembly-name
    desc: CardSpace manifest assembly name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: infocard.exe
      case_insensitive: true

  - id: infocard-pdb
    desc: Windows CardSpace PDB identity
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.debug.pdb.path
      exact: infocard.pdb
      case_insensitive: true

composite_rules:
  - id: windows-cardspace-identity
    desc: Windows CardSpace identity service binary
    crit: notable
    conf: 0.99
    all:
      - id: infocard-original-filename
      - id: windows-cardspace-description
      - id: infocard-manifest-description
      - id: metadata/binary/vendor::microsoft-prefixed-company
    any:
      - id: infocard-assembly-name
      - id: infocard-pdb
