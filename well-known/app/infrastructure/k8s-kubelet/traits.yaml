# k8s.io/kubelet — Kubernetes kubelet CRI streaming and credential APIs.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: Kubernetes kubelet Go module path
    if:
      type: text
      substr: k8s.io/kubelet

  - id: source-archive-path
    desc: Kubernetes kubelet module source path
    for: [go, zip]
    if:
      type: path
      regex: 'k8s\.io/kubelet@'
