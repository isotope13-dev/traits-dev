# Docker Engine source-tree identity.  The source tree contains CI helpers,
# integration tests, and rootless setup code whose normal behavior overlaps
# with generic malware heuristics.
defaults:
  platforms: [unix, windows]
  for: [go, powershell, shell, dockerfile, zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree
    desc: Docker Engine source-tree path
    if:
      type: path
      regex: 'github\.com/(docker|moby)[^[:space:]]+@v[0-9]'

  - id: source-archive-member
    desc: Docker Engine root Dockerfile archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/(docker/(docker|engine)|moby/moby)@v[0-9][^/]+/Dockerfile$'

  - id: source-archive-license-member
    desc: Docker Engine root license archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/(docker/(docker|engine)|moby/moby)@v[0-9][^/]+/LICENSE$'

  - id: cli-source-tree
    desc: Docker CLI source tree path
    if:
      type: path
      regex: 'docker/cli@v[0-9]'

  - id: cli-source-archive-member
    desc: Docker CLI source archive root member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/docker/cli@v[0-9][^/]+/README\.md$'

  - id: cli-source-go-mod-member
    desc: Docker CLI source archive go.mod member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/docker/cli@v[0-9][^/]+/go\.mod$'

composite_rules:
  - id: docker-source-archive-context
    desc: Recognized Docker Engine source archive context
    crit: exception
    conf: 0.99
    for: [zip]
    all:
      - id: source-archive-member
      - id: source-archive-license-member

  - id: docker-cli-source-archive-context
    desc: Recognized Docker CLI source archive context
    crit: exception
    conf: 0.99
    for: [zip]
    scope: outer
    all:
      - id: cli-source-archive-member
      - id: cli-source-go-mod-member
