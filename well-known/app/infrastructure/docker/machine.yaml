# Docker Machine (docker/machine, archived). The CLI links its own
# `commands` package; driver plugins link only libmachine, so this marks the
# docker-machine CLI. Its provisioners embed `wget -qO- ... | sh` installers.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.97
  size_min: 1048576

traits:
  - id: machine-cli-go-package
    desc: Docker Machine CLI Go package path
    if:
      type: text
      substr: github.com/docker/machine/commands
      section: gopclntab
