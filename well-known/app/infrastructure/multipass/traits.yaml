# Canonical Multipass — Ubuntu VM orchestrator for Linux, macOS and Windows
# (github.com/canonical/multipass). The Windows release is a WiX MSI that ships
# multipass.exe, multipassd.exe, multipass.gui.exe and sshfs_server.exe. The
# upstream release is not Authenticode-signed, so this identity rests on
# product metadata rather than a verified signer. Its unsigned loader-shaped
# and elevation-shaped PEs are the daemon's SSHFS mount server and the Qt
# runtime's detached-elevation helper, not a payload loader.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.97
  size_min: 1000

traits:
  - id: msi-subject-multipass
    desc: Multipass MSI subject names the product
    for: [oledoc]
    if:
      type: value
      path: office.subject
      exact: Multipass

  - id: msi-creator-canonical
    desc: Multipass MSI creator is Canonical Ltd
    for: [oledoc]
    if:
      type: value
      path: office.creator
      exact: Canonical Ltd

  - id: msi-description-multipass
    desc: Multipass WiX install description names product
    for: [oledoc]
    if:
      type: value
      path: office.description
      exact: This installer database contains the logic and data required to install Multipass.

  - id: pe-product-multipass
    desc: Multipass PE product name resource
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: Multipass

  - id: pe-company-canonical
    desc: Canonical Ltd PE company resource
    for: [pe]
    if:
      type: value
      path: pe.version.company
      exact: Canonical Ltd.

  - id: pe-copyright-canonical
    desc: Canonical Ltd PE copyright resource
    for: [pe]
    if:
      type: value
      path: pe.version.copyright
      exact: Copyright (C) Canonical, Ltd. All rights reserved.

composite_rules:
  # Two of the three summary fields name Multipass and Canonical in the MSI.
  - id: multipass-msi-installer
    desc: Canonical Multipass MSI installer identity
    crit: notable
    conf: 0.97
    for: [oledoc]
    scope: file
    needs: 2
    any:
      - id: msi-subject-multipass
      - id: msi-creator-canonical
      - id: msi-description-multipass

  # Two of the three version-resource fields name Multipass and Canonical in a PE.
  - id: multipass-pe-component
    desc: Canonical Multipass PE component identity
    crit: notable
    conf: 0.97
    for: [pe]
    scope: file
    needs: 2
    any:
      - id: pe-product-multipass
      - id: pe-company-canonical
      - id: pe-copyright-canonical
