# Home Manager — declarative user environment manager for Nix (nix-community/home-manager).
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: home-manager-github-repo
    desc: Home Manager GitHub repository URL
    for: [text, markdown, source]
    if:
      type: text
      substr: "github.com/nix-community/home-manager"

  - id: home-manager-customization-marker
    desc: Home Manager customization reference
    for: [text, source]
    if:
      type: text
      substr: "Home Manager customizations"

  - id: home-manager-launchd-label
    desc: Home Manager launchd service label
    for: [plist, text]
    if:
      type: text
      substr: "org.nix-community.home."

  # Module files and forks omit the upstream GitHub URL.
  - id: home-manager-tree-path
    desc: Home Manager project path
    platforms: [windows, unix]
    for: [scripts, source, binaries, data]
    size_max: 5000000
    if:
      type: path
      regex: '(^|/)home-manager(@|/)'

composite_rules:
  - id: home-manager-context
    desc: Home Manager configuration management context
    crit: notable
    conf: 0.98
    for: [text, markdown, source, plist]
    any:
      - id: home-manager-github-repo
      - id: home-manager-customization-marker
      - id: home-manager-launchd-label
      - id: home-manager-tree-path
