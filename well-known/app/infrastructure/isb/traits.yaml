# Execution Associates ISB infrastructure automation and orchestration toolkit
# (github.com/execution-associates/isb).
defaults:
  platforms: [unix, windows]
  for: [shell, rust, cargo.toml, text]
  crit: notable
  conf: 0.95

traits:
  - id: isb-workspace-image-build-comment
    desc: ISB workspace image build script
    for: [shell, text]
    if:
      type: text
      substr: isb workspace image build

  - id: isb-repo-url
    desc: ISB repository URL
    if:
      type: text
      substr: execution-associates/isb

composite_rules:
  - id: isb-context
    desc: ISB infrastructure automation context
    any:
      - id: isb-workspace-image-build-comment
      - id: isb-repo-url
