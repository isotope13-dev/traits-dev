# ProcBoss (pboss) — JavaScript & TypeScript process manager (github.com/procboss/pboss).
defaults:
  crit: notable
  conf: 0.98
  platforms: [linux, windows, macos]
  for: [javascript, typescript, package.json, json, text]

traits:
  - id: pboss-package-name
    desc: pboss package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pboss

  - id: pboss-repository-url
    desc: pboss GitHub repository URL
    if:
      type: text
      regex: '(?i)github\.com/procboss/pboss'

  - id: pboss-source-header
    desc: pboss process manager banner or domain
    if:
      type: text
      regex: '(?i)ProcBoss \(pboss\)|procboss\.com'

composite_rules:
  - id: pboss-process-manager-context
    desc: pboss process manager context
    conf: 0.99
    any:
      - id: pboss-package-name
      - id: pboss-repository-url
      - id: pboss-source-header
