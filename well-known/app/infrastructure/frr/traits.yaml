# FRRouting protocol daemons open raw sockets and set IP_HDRINCL to send
# routing protocol packets. That is the daemon, not a header-include flooder.
defaults:
  size_min: 50000
  size_max: 8000000
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: frr-protocol-daemon
    desc: FRRouting protocol daemon
    if:
      type: basename
      regex: '(?i)^(pimd|ospfd|eigrpd)$'
