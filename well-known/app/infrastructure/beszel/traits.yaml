# Beszel — lightweight server monitoring (hub + agent). Hub is PocketBase-based;
# agent reports host/Docker metrics. Official module github.com/henrygd/beszel.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, manifests, documents, archives, go.mod]
  crit: notable
  conf: 0.99

traits:
  - id: go-module-path
    desc: Beszel Go module path
    for: [go, go.mod, text, markdown]
    if:
      type: text
      substr: github.com/henrygd/beszel

  - id: app-name-constant
    desc: Beszel AppName constant
    for: [go]
    if:
      type: text
      regex: 'AppName\s*=\s*"beszel"'

  - id: product-site
    desc: Beszel product site URL
    for: [markdown, text, go, scripts]
    if:
      type: text
      substr: beszel.dev

  - id: agent-exe-name
    desc: beszel-agent executable name
    for: [scripts, go, text]
    if:
      type: literal
      kind: string
      regex: '(?i)\bbeszel-agent(\.exe)?\b'

composite_rules:
  - id: beszel-source-context
    desc: Beszel monitoring platform source tree
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: go-module-path
    any:
      - id: app-name-constant
      - id: product-site
      - id: agent-exe-name
