# Strimzi — Apache Kafka on Kubernetes (CNCF). Bundled snappy-java /
# zstd-jni / lz4-java natives and OSInfo.Runtime.exec are JNI
# compression, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, text, java, class, java_class]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 120000000

traits:
  - id: apk-pkgname
    desc: Strimzi cluster-operator APK name
    for: [apk, text]
    platforms: [linux]
    conf: 0.99
    if:
      type: text
      substr: 'pkgname = strimzi-kafka-operator-cluster-operator'

  - id: apk-origin
    desc: Strimzi Kafka operator APK origin
    for: [apk, text]
    platforms: [linux]
    conf: 0.99
    if:
      type: text
      substr: 'origin = strimzi-kafka-operator'

  - id: pom-group
    desc: Strimzi Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: io.strimzi

  - id: pom-artifact
    desc: Strimzi cluster-operator artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: cluster-operator

  - id: implementation-title
    desc: Strimzi Cluster Operator JAR title
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: Strimzi Cluster Operator

  - id: main-class
    desc: Strimzi cluster operator main class
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.main_class
      exact: io.strimzi.operator.cluster.Main

  - id: package-path
    desc: Strimzi operator Java package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)io[\\/]strimzi[\\/]'

composite_rules:
  - id: strimzi-apk-package
    desc: Strimzi cluster-operator APK package
    crit: notable
    conf: 0.99
    for: [apk, text]
    platforms: [linux]
    all:
      - id: apk-pkgname
      - id: apk-origin

  - id: strimzi-cluster-operator-jar
    desc: Strimzi cluster-operator Maven JAR
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact

  - id: strimzi-kafka-operator
    desc: Strimzi Kafka Kubernetes operator
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: strimzi-apk-package
      - id: strimzi-cluster-operator-jar
      - id: implementation-title
      - id: main-class
      - id: package-path
