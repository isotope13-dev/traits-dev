defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  for: [shell, source, archives, zip, go]

traits:
  - id: source-tree-member
    desc: KubeBlocks versioned source-tree member
    if:
      type: path
      regex: 'github\.com[\\/]apecloud[\\/]kubeblocks@v[0-9]'

  - id: dapr-installer-script
    desc: KubeBlocks Dapr build installer script
    for: [shell]
    if:
      type: basename
      exact: install-dapr-tools.sh

  - id: dapr-official-installer
    desc: Official Dapr CLI installer URL
    for: [shell]
    if:
      type: text
      substr: raw.githubusercontent.com/dapr/cli/master/install/install.sh

  - id: golangci-official-installer
    desc: Official golangci-lint installer URL
    for: [shell]
    if:
      type: text
      substr: raw.githubusercontent.com/golangci/golangci-lint/master/install.sh

composite_rules:
  - id: build-tool-installer-context
    desc: KubeBlocks build-tool installer context
    crit: exception
    conf: 0.98
    for: [shell]
    all:
      - id: source-tree-member
      - id: dapr-installer-script
      - id: dapr-official-installer
      - id: golangci-official-installer
