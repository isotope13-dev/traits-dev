defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  for: [shell, source, archives, zip, go]

traits:
  - id: source-tree-member
    desc: KubeBlocks versioned source-tree member
    if:
      type: path
      regex: 'github\.com[\\/]apecloud[\\/]kubeblocks@v[0-9]'

  - id: dapr-installer-script
    desc: KubeBlocks Dapr build installer script
    for: [shell]
    if:
      type: basename
      exact: install-dapr-tools.sh

composite_rules:
  # The two installer URLs are upstream project identities rather than
  # KubeBlocks facts, so they live with the tools they name.
  - id: build-tool-installer-context
    desc: KubeBlocks build-tool installer context
    crit: exception
    conf: 0.98
    for: [shell]
    all:
      - id: source-tree-member
      - id: dapr-installer-script
      - id: well-known/app/infrastructure/dapr::official-installer-url
      - id: well-known/tool/development/linter::golangci-official-installer-url
