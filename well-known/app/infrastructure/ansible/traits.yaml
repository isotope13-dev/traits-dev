# Ansible Core upstream source is a benign automation project. Its test
# corpus and Windows transport wrappers intentionally exercise credential
# validation, service scripts, archive naming, PowerShell reflection, and
# process-creation attributes that look alarming out of context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, python, powershell, csharp, shell, markdown, pyproject.toml, tar, archives, whl]
  crit: notable
  conf: 0.99

traits:
  - id: ansible-core-project-name
    desc: Ansible Core project metadata
    for: [pyproject.toml]
    if:
      type: text
      substr: 'name = "ansible-core"'

  - id: ansible-wheel-distribution
    desc: Ansible community collections wheel
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: ansible

  - id: ansible-collections-archive-member
    desc: Ansible collections tree archive member
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|[\\/])ansible_collections[\\/]'

  - id: ansible-upstream-repository
    desc: Ansible upstream repository marker
    for: [pyproject.toml, pkginfo, markdown]
    if:
      type: text
      substr: github.com/ansible/ansible

  - id: ansible-core-wheel-metadata-member
    desc: Ansible Core wheel metadata member
    for: [zip, whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^ansible_core-[0-9][^/]*\.dist-info[\\/]METADATA$'

  - id: ansible-core-pkginfo-name
    desc: Ansible Core package metadata name
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*ansible-core\s*$'

  - id: ansible-module-utils-path
    desc: Ansible module_utils source path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)ansible[\\/]module_utils'

  - id: ansible-collections-path
    desc: Ansible collections source path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)ansible_collections[\\/]'

  - id: ansible-lib-tree-path
    desc: Ansible lib source tree path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)lib[\\/]ansible'
  - id: ansible-test-tree-path
    desc: Ansible test tree path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)ansible.{0,24}[\\/]test[\\/]'

  - id: ansible-powershell-executor-path
    desc: Ansible PowerShell executor wrapper path
    for: [powershell]
    if:
      type: path
      regex: '(?i)ansible[\\/]executor[\\/]powershell'

  - id: ansible-log-helper-reference
    desc: Ansible PowerShell logging helper reference
    for: [powershell]
    if:
      type: text
      word: Write-AnsibleLog

  - id: ansible-webrequest-helper-function
    desc: Ansible PowerShell web request helper
    for: [powershell]
    if:
      type: text
      regex: '(?i)Function\s+Get-AnsibleWebRequest\b'

  - id: ansible-test-bootstrap-path
    desc: Ansible test target bootstrap path
    for: [shell]
    if:
      type: path
      regex: '(?i)target[\\/]setup[\\/]bootstrap\.sh$'

  - id: ansible-test-bootstrap-marker
    desc: Ansible test bootstrap state marker
    for: [shell]
    if:
      type: text
      substr: /etc/ansible-test.bootstrap

  - id: ansible-async-csharp-namespace
    desc: Ansible async C# utility namespace
    for: [csharp]
    if:
      type: text
      substr: 'namespace Ansible._Async'

  # Every Ansible task module declares itself. Python modules carry the
  # ANSIBLE_METADATA dict the docs tooling parses; PowerShell modules are
  # driven by the `WANT_JSON` protocol marker and the Get-AnsibleParam /
  # Exit-Json helpers that module_utils injects.
  - id: ansible-module-metadata-block
    desc: Ansible module metadata declaration
    for: [python]
    if:
      type: text
      substr: ANSIBLE_METADATA

  - id: ansible-powershell-module-protocol
    desc: Ansible PowerShell module protocol markers
    for: [powershell]
    if:
      type: text
      regex: '\b(WANT_JSON|Get-AnsibleParam|Exit-Json)\b'

  - id: ansible-powershell-module-requires
    desc: Ansible PowerShell module requires directive
    for: [powershell]
    if:
      type: text
      substr: '#AnsibleRequires'

  - id: ansible-python-module-utils-import
    desc: Ansible Python module_utils import
    for: [python]
    if:
      type: text
      substr: from ansible.module_utils

  # Many collection modules are documentation-only Python stubs whose real
  # implementation is a sibling .ps1; they carry no ANSIBLE_METADATA and import
  # nothing. The `DOCUMENTATION = r'''` YAML block is the Ansible module
  # documentation protocol and is what identifies them as task modules.
  - id: ansible-module-documentation-block
    desc: Ansible module DOCUMENTATION block
    for: [python]
    if:
      type: text
      regex: '(?m)^DOCUMENTATION\s*=\s*r?[''"]{3}'

composite_rules:
  - id: ansible-module-tree-path
    desc: Ansible module source tree path
    crit: notable
    conf: 0.99
    for: [python, powershell]
    any:
      - id: ansible-lib-tree-path
      - id: ansible-collections-path

  - id: ansible-async-csharp-context
    desc: Recognized Ansible async C# utility context
    crit: exception
    conf: 0.99
    for: [csharp]
    all:
      - id: ansible-async-csharp-namespace
      - id: ansible-module-utils-path

  # A task module inside the Ansible source tree. Ansible is a remote-
  # administration framework, so its 1500+ modules exist precisely to disable
  # firewalls, clear event logs, install packages quietly, manage local users,
  # and read Kubernetes secrets on the operator's behalf -- each is the
  # module's documented purpose, named after it, and reachable only from a
  # playbook the operator wrote. Both legs are required: the upstream tree path
  # alone would cover a dropped file, and the module markers alone would cover
  # a rogue third-party collection.
  - id: ansible-module-source-context
    desc: Recognized Ansible module source file
    crit: exception
    conf: 0.99
    for: [python, powershell]
    all:
      - id: ansible-module-tree-path
    any:
      - id: ansible-module-metadata-block
      - id: ansible-powershell-module-protocol
      - id: ansible-powershell-module-requires
      - id: ansible-python-module-utils-import
      - id: ansible-module-documentation-block

  - id: ansible-collections-wheel-context
    desc: Recognized Ansible community collections wheel
    crit: exception
    conf: 0.99
    scope: outer
    for: [whl, python, powershell, archives, text]
    all:
      - id: ansible-wheel-distribution
      - id: ansible-collections-archive-member

  - id: ansible-source-archive-context
    desc: Recognized Ansible Core upstream source archive
    crit: exception
    conf: 0.99
    # Broad for: so unless: on nested python/powershell/csharp/shell members
    # can see this exception; identity still comes from project metadata.
    scope: outer
    for: [scripts, source, python, powershell, csharp, shell, markdown, pyproject.toml, tar, archives, text]
    all:
      - id: ansible-core-project-name
      - id: ansible-upstream-repository

  - id: ansible-powershell-executor-context
    desc: Recognized Ansible PowerShell executor wrapper
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: ansible-powershell-executor-path
      - id: ansible-log-helper-reference

  - id: ansible-powershell-webrequest-context
    desc: Recognized Ansible PowerShell web request utility
    crit: exception
    conf: 0.99
    for: [powershell]
    all:
      - id: ansible-module-utils-path
      - id: ansible-webrequest-helper-function

  - id: ansible-test-bootstrap-context
    desc: Recognized Ansible test target bootstrap
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: ansible-test-bootstrap-path
      - id: ansible-test-bootstrap-marker
