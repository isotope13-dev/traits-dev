# Ansible Core upstream source is a benign automation project. Its test
# corpus and Windows transport wrappers intentionally exercise credential
# validation, service scripts, archive naming, PowerShell reflection, and
# process-creation attributes that look alarming out of context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, python, powershell, csharp, shell, markdown, pyproject.toml, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: ansible-core-project-name
    desc: Ansible Core project metadata
    for: [pyproject.toml]
    if:
      type: text
      substr: 'name = "ansible-core"'

  - id: ansible-upstream-repository
    desc: Ansible upstream repository marker
    for: [pyproject.toml, markdown]
    if:
      type: text
      substr: github.com/ansible/ansible

  - id: ansible-module-utils-path
    desc: Ansible module_utils source path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)ansible[\\/]module_utils'

  - id: ansible-lib-tree-path
    desc: Ansible lib source tree path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)lib[\\/]ansible'
  - id: ansible-test-tree-path
    desc: Ansible test tree path
    for: [scripts, source, python, powershell, csharp, shell]
    if:
      type: path
      regex: '(?i)ansible.{0,24}[\\/]test[\\/]'

  - id: ansible-async-csharp-namespace
    desc: Ansible async C# utility namespace
    for: [csharp]
    if:
      type: text
      substr: 'namespace Ansible._Async'

composite_rules:
  - id: ansible-async-csharp-context
    desc: Recognized Ansible async C# utility context
    crit: exception
    conf: 0.99
    for: [csharp]
    all:
      - id: ansible-async-csharp-namespace
      - id: ansible-module-utils-path

  - id: ansible-source-archive-context
    desc: Recognized Ansible Core upstream source archive
    crit: exception
    conf: 0.99
    # Broad for: so unless: on nested python/powershell/csharp/shell members
    # can see this exception; identity still comes from project metadata.
    scope: outer
    for: [scripts, source, python, powershell, csharp, shell, markdown, pyproject.toml, tar, archives, text]
    all:
      - id: ansible-core-project-name
      - id: ansible-upstream-repository
