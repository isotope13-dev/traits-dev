defaults:
  platforms: [unix]
  for: [shell, go, zip, tar, scripts]
  crit: notable
  conf: 0.98

traits:
  - id: pritunl-cloud-source-path
    desc: Pritunl Cloud source tree path
    conf: 0.99
    if:
      type: path
      regex: 'github\.com[/\\]pritunl[/\\]pritunl-cloud@'

  - id: pritunl-cloud-setup-script-path
    desc: Pritunl Cloud VM template setup script path
    conf: 0.99
    for: [shell]
    if:
      type: path
      regex: 'virt-install[/\\]setup[/\\][a-z0-9_]+\.sh$'

  - id: pritunl-cloud-setup-header
    desc: Pritunl Cloud VM template setup script header
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: '# (starting|finished) [a-z0-9_]+ setup'

composite_rules:
  - id: pritunl-cloud-context
    desc: Recognized Pritunl Cloud virtualization infrastructure context
    crit: exception
    conf: 0.99
    any:
      - id: pritunl-cloud-source-path
      - id: pritunl-cloud-setup-header

  - id: pritunl-cloud-setup-context
    desc: Recognized Pritunl Cloud VM template setup context
    crit: exception
    conf: 0.99
    all:
      - id: pritunl-cloud-setup-header
    any:
      - id: pritunl-cloud-source-path
      - id: pritunl-cloud-setup-script-path
