# Chainloop — Linux Foundation evidence store for supply-chain
# attestations. Labs c8l curl|bash of docs.chainloop.dev/install.sh and
# Syft's GitHub install.sh are official tool bootstrap, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [go, text, markdown, github-actions, shell, tar, archives, go.mod]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 200000000

traits:
  - id: go-module
    desc: chainloop-dev Go module path
    for: [go, text, go.mod]
    conf: 0.99
    if:
      type: text
      substr: module github.com/chainloop-dev/chainloop

  - id: github-repo
    desc: chainloop-dev/chainloop GitHub repository
    for: [go, text, markdown, github-actions, shell, go.mod]
    conf: 0.98
    if:
      type: text
      substr: github.com/chainloop-dev/chainloop

  - id: cli-install-url
    desc: Chainloop CLI official install script URL
    for: [shell, github-actions, text]
    conf: 0.98
    if:
      type: text
      substr: dl.chainloop.dev/cli/install.sh

  - id: labs-cli-banner
    desc: Chainloop Labs c8l CLI usage banner
    for: [shell]
    conf: 0.97
    if:
      type: text
      substr: '(c8l) Chainloop Labs CLI'
