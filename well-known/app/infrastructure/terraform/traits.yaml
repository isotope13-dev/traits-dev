defaults:
  conf: 0.99
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  size_min: 5000000
  size_max: 700000000

traits:
  - id: terraform-core-macho-module
    desc: Terraform core Mach-O Go module
    crit: notable
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/hashicorp/terraform
  - id: terraform-core-pe-module
    desc: Terraform core PE Go module
    crit: notable
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/hashicorp/terraform
  - id: terraform-core-elf-module
    desc: Terraform core ELF Go module
    crit: notable
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/hashicorp/terraform

composite_rules:
  - id: terraform-core-binary
    desc: Terraform core binary
    crit: notable
    any:
      - id: terraform-core-elf-module
      - id: terraform-core-macho-module
      - id: terraform-core-pe-module
    all:
      - id: micro-behaviors/communications/grpc::terraform-reattach-providers-env
