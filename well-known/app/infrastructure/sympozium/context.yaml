defaults:
  platforms: [unix, windows]

composite_rules:
  - id: official-project-context
    desc: Recognized Sympozium upstream project source tree
    crit: exception
    conf: 1.0
    for: [zip, archives, go, javascript, typescript, shell, markdown]
    scope: archive
    all:
      - id: repository
      - id: product-description
      - id: installer-host
