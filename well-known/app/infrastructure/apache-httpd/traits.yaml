defaults:
  platforms: [unix, windows]
  for: [source, shell, makefile, text, html, xml, tar]
  size_max: 268435456
  crit: notable
  conf: 0.96

traits:
  - id: source-tree
    desc: Apache httpd source tree
    if:
      type: path
      regex: '(^|[\\/])httpd-[0-9][^\\/]*'

  - id: version-banner
    desc: Apache HTTP Server version banner
    for: [elf, macho, pe]
    if:
      type: text
      section: .rodata
      regex: '\bApache/[0-9]+\.[0-9]+(\.[0-9]+)?\b'

composite_rules:
  - id: apache-httpd-binary
    desc: Apache HTTP Server binary
    for: [elf, macho, pe]
    all:
      - id: version-banner
      - id: micro-behaviors/communications/http/server/listener::apache-httpd-core-exports
