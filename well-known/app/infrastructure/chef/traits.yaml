defaults:
  platforms: [unix, windows]
  for: [ruby, gem, powershell, shell, zip]
  crit: notable
  conf: 0.98

traits:
  - id: chef-class-namespace
    desc: Chef Ruby class namespace
    for: [ruby]
    if:
      type: text
      regex: '(?m)^class (Chef|Ohai)(::\w{1,40}){0,4}\b'

  - id: chef-resource-provider-declaration
    desc: Chef resource/provider class declaration
    for: [ruby]
    if:
      type: text
      regex: 'class \w+ < Chef::Provider'

  - id: chef-gem-metadata-name
    desc: Chef gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      regex: ^(chef|ohai)$

  - id: chef-rspec-spec
    desc: Chef RSpec test describe
    for: [ruby]
    if:
      type: text
      regex: '(?m)^\s*describe\s+["'']?(Chef|Ohai)\b'

  - id: ohai-plugin-declaration
    desc: Ohai plugin declaration
    for: [ruby]
    if:
      type: text
      regex: '\bOhai\.plugin\('

  - id: chef-source-tree
    desc: Chef configuration management source tree path
    if:
      type: path
      regex: 'chef@v[0-9]'

  - id: chef-buildkite-test-script
    desc: Chef Buildkite Windows test script
    for: [powershell]
    if:
      type: text
      substr: 'chefstyle'

composite_rules:
  - id: chef-source-context
    desc: Chef configuration management source
    crit: notable
    conf: 0.99
    any:
      - id: chef-class-namespace
      - id: chef-resource-provider-declaration
      - id: chef-gem-metadata-name
      - id: chef-rspec-spec
      - id: ohai-plugin-declaration
      - id: chef-source-tree
      - id: chef-buildkite-test-script
