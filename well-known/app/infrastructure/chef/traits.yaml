defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.98

traits:
  - id: chef-class-namespace
    desc: Chef Ruby class namespace
    if:
      type: text
      regex: '(?m)^class Chef(::\w{1,40}){0,4}\b'

  - id: chef-resource-provider-declaration
    desc: Chef resource/provider class declaration
    if:
      type: text
      regex: 'class \w+ < Chef::Provider'

  - id: chef-gem-metadata-name
    desc: Chef gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: chef

composite_rules:
  - id: chef-source-context
    desc: Chef configuration management source
    crit: notable
    conf: 0.99
    any:
      - id: chef-class-namespace
      - id: chef-resource-provider-declaration
      - id: chef-gem-metadata-name
