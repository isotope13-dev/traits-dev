# DDEV is an open-source Docker-based local development environment.
# Its source tree contains container management, provider setup, and local
# environment cleanup scripts.
defaults:
  platforms: [unix, windows]
  for: [go, powershell, shell, dockerfile, zip, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: source-tree-path
    desc: DDEV source-tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])(drud|ddev)[\\/][Dd][Dd][Ee][Vv]'

  - id: github-repo
    desc: DDEV GitHub repository reference
    for: [shell, text, markdown]
    if:
      type: text
      substr: github.com/drud/ddev
