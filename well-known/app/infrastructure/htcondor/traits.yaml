# HTCondor — High-Throughput Computing workload management system.
defaults:
  platforms: [unix, windows]
  for: [go, shell, c, cpp, python, text]
  crit: notable
  conf: 0.98

traits:
  - id: source-tree
    desc: HTCondor source tree path
    if:
      type: path
      regex: '(?i)(^|[\\/])(golang-htcondor|htcondor)([\\/]|[-@_]|$)'

  - id: module-path
    desc: golang-htcondor Go module import path
    for: [go]
    if:
      type: text
      substr: "github.com/bbockelm/golang-htcondor"

  - id: condor-config-comment
    desc: HTCondor configuration reference
    if:
      type: text
      substr: "HTCondor configuration"

composite_rules:
  - id: htcondor
    desc: HTCondor workload management system
    any:
      - id: source-tree
      - id: module-path
      - id: condor-config-comment
