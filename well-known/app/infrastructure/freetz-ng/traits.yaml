defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: fwmod-script
    desc: Freetz firmware modification tool
    for: [shell]
    if:
      type: path
      basename: true
      regex: '^fwmod(_custom)?$'

  - id: fmake-script
    desc: Freetz make wrapper script
    for: [shell]
    if:
      type: path
      basename: true
      exact: fmake

  - id: freetz-repo-path
    desc: Freetz-NG repository path
    for: [scripts, github-actions, makefile, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])freetz-ng(-HEAD)?([\\/]|$)'

  - id: freetz-config-prefix
    desc: Freetz configuration option namespace
    for: [scripts, github-actions, makefile, text]
    if:
      type: text
      regex: '\bFREETZ_[A-Z0-9_]{3,30}\b'

composite_rules:
  - id: freetz-ng-firmware-context
    desc: Freetz-NG router firmware toolkit context
    crit: exception
    conf: 0.98
    for: [scripts, github-actions, makefile, text]
    any:
      - id: freetz-repo-path
      - id: fwmod-script
      - id: fmake-script
      - id: freetz-config-prefix
