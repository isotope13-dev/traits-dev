# opentelemetry-github — GitHub Actions OpenTelemetry instrumentation toolkit
# by Philipp Lengauer (plengauer/opentelemetry-github). Workflows serialize
# secrets to the action's secrets_to_redact input so the OpenTelemetry exporter
# redacts sensitive secrets from traces.
defaults:
  platforms: [unix, windows]
  for: [github-actions, shell]
  crit: notable
  conf: 0.98

traits:
  - id: secrets-to-redact-input
    desc: OpenTelemetry secret redaction input
    for: [github-actions]
    if:
      type: text
      substr: secrets_to_redact

  - id: opentelemetry-github-repo-ref
    desc: OpenTelemetry GitHub repo reference
    if:
      type: text
      regex: 'plengauer/(opentelemetry-github|opentelemetry-shell|Thoth)'

  - id: opentelemetry-instrument-action-path
    desc: OpenTelemetry instrument action path
    if:
      type: text
      regex: '(\./)?actions/instrument/(job|step|deploy)'

composite_rules:
  - id: opentelemetry-github-action-reference
    desc: OpenTelemetry GitHub action reference
    crit: notable
    conf: 0.98
    any:
      - id: opentelemetry-github-repo-ref
      - id: opentelemetry-instrument-action-path

  - id: opentelemetry-github-ci-context
    desc: OpenTelemetry GitHub Actions CI context
    crit: exception
    conf: 0.99
    for: [github-actions]
    all:
      - id: secrets-to-redact-input
      - id: opentelemetry-github-action-reference
