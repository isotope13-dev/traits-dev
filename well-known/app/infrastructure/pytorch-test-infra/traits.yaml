# PyTorch test-infra CI plumbing. Its reusable job workflows serialize the
# workflow's own secrets (`ALL_SECRETS: ${{ toJSON(secrets) }}`) only to hand
# them to a first-party runner script that maps named secrets into the job
# environment -- the secrets never leave the workflow that owns them. That
# serialization textually matches the credential-theft atom, so the runner
# reference below identifies the benign consumer for its `unless:`.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
  - id: secrets-env-runner-script
    desc: PyTorch CI secrets env runner reference
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: run_with_env_secrets.py
