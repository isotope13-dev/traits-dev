# Datadog Operator, the Kubernetes operator that deploys the Datadog Agent.
# Its container ships the controller as `manager`, but that is kubebuilder's
# default binary name (Kong Ingress Controller and most operators use it),
# so the name is only an observation; the operator's Go module path is what
# identifies the product.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: manager-binary-name
    desc: Large ELF is named manager
    crit: component
    conf: 0.5
    size_min: 10485760
    if:
      type: basename
      exact: manager
  - id: go-module-path
    desc: Datadog Operator Go module path
    crit: component
    conf: 0.95
    size_min: 1048576
    if:
      type: text
      substr: github.com/DataDog/datadog-operator/
      section: gopclntab

composite_rules:
  - id: operator-binary
    desc: Datadog Operator controller binary
    crit: notable
    conf: 0.97
    all:
      - id: manager-binary-name
      - id: go-module-path
