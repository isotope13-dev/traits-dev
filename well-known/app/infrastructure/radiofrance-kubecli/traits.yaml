# github.com/radiofrance/kubecli — thin Kubernetes client-go wrapper.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: radiofrance kubecli Go module path
    if:
      type: text
      substr: github.com/radiofrance/kubecli

  - id: source-archive-path
    desc: radiofrance kubecli module source path
    for: [go, zip]
    if:
      type: path
      regex: 'radiofrance/kubecli@'
