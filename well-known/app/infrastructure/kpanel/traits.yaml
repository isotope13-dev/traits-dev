# KPanel (kejilion-panel) is an open-source Linux server management web panel
# and host operations control plane. Its host agent (kejilion-agent) runs as a
# systemd service with system administration capabilities to manage Docker,
# firewall rules, sites, and host metrics.
defaults:
  platforms: [linux]
  for: [source, scripts, manifests, documents, go, go.mod, yaml, systemd-service, tar, zip, text, markdown]
  crit: notable
  conf: 0.98
  size_max: 50000000

traits:
  - id: go-module-path
    desc: KPanel Go module path
    for: [go, go.mod, text, markdown, yaml]
    if:
      type: text
      substr: github.com/kejilion/kejilion-panel

  - id: repository-url
    desc: KPanel GitHub repository URL
    for: [markdown, text, shell, yaml]
    if:
      type: text
      substr: github.com/kejilion/KPanel

  - id: product-site
    desc: KPanel product site or documentation URL
    for: [markdown, text, go, shell, systemd-service, yaml]
    if:
      type: text
      regex: 'https?://(kpanel\.kejilion\.sh|hub\.docker\.com/r/kjlion/kejilion-panel)'

  - id: agent-service-name
    desc: KPanel host agent systemd service
    for: [systemd-service, shell]
    if:
      type: basename
      exact: kejilion-agent.service

  - id: codex-workflows-path
    desc: KPanel Codex workflows directory path
    for: [yaml, shell, markdown]
    if:
      type: path
      regex: '\.codex-workflows[\\/]'

composite_rules:
  - id: kpanel-source-context
    desc: KPanel server management platform source tree
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: go-module-path
      - id: repository-url
      - id: product-site
      - id: agent-service-name
      - id: codex-workflows-path
