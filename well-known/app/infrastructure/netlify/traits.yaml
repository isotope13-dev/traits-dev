# netlify-cli — official Netlify command-line tool.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: netlify-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: netlify-cli

  - id: upstream-repository
    desc: netlify-cli upstream repository
    if:
      type: text
      regex: 'github\.com/netlify/cli([./\s"''`?#]|$)'

  - id: github-release-download-url
    desc: netlify-cli release asset download URL
    for: [javascript, typescript]
    if:
      type: text
      substr: '/releases/download/${version}/${pkgName}'

  - id: netlify-dev-warn-marker
    desc: netlify-cli dev warning helper marker
    for: [javascript, typescript]
    if:
      type: text
      substr: NETLIFYDEVWARN

composite_rules:
  - id: netlify-cli-archive-context
    desc: Recognized netlify-cli npm package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: upstream-repository

  - id: netlify-cli-exec-fetcher-bootstrap
    desc: netlify-cli GitHub release fetch helper
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: netlify-dev-warn-marker
      - id: upstream-repository
      - id: github-release-download-url

  - id: official-js-github-release-bootstrap
    desc: Official JS CLI GitHub release bootstrap
    crit: exception
    conf: 0.99
    any:
      - id: netlify-cli-exec-fetcher-bootstrap
      - id: netlify-cli-archive-context
      - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
      - id: well-known/dual-use/transfer/rclone::rclone-official-release-downloader
