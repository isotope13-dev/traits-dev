# circleci.test — official CircleCI clojure.test-compatible runner.
# load-reader / read-string load project config and CLI args; leave those
# micro-behaviors intact (correct interpreter capability).
defaults:
  platforms: [unix, windows]
  for: [clojure, jar, text]
  crit: notable
  conf: 0.99

traits:
  - id: maven-artifact-id
    desc: circleci.test Maven artifactId
    for: [jar]
    if:
      type: value
      path: jar.pom.artifact_id
      exact: circleci.test

  - id: maven-group-id
    desc: circleci Maven groupId
    for: [jar]
    if:
      type: value
      path: jar.pom.group_id
      exact: circleci

  - id: pom-artifact-id
    desc: circleci.test POM artifactId element
    for: [jar, text]
    if:
      type: text
      substr: '<artifactId>circleci.test</artifactId>'

  - id: ns-circleci-test
    desc: circleci.test Clojure namespace declaration
    for: [clojure]
    if:
      type: text
      regex: '\(ns\s+circleci\.test[\s\n;]'

  - id: github-repo
    desc: circleci/circleci.test GitHub repository
    for: [text, clojure]
    if:
      type: text
      substr: github.com/circleci/circleci.test

composite_rules:
  - id: circleci-test-runner
    desc: CircleCI clojure.test runner library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: maven-artifact-id
      - id: pom-artifact-id
      - id: ns-circleci-test
      - id: github-repo
    needs: 2
