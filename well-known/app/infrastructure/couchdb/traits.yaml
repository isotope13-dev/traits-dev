defaults:
  platforms: [linux]
  # `go` covers CouchDB client libraries and their tests (go-kivik's
  # cluster fixtures name ordinary distribution nodes), whose module paths
  # already satisfy the couchdb-path identity below.
  for: [alpine_apk, elf, shell, text, go]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 268435456

traits:
  - id: couchdb-package
    desc: CouchDB package identity
    if:
      type: path
      regex: '(?i)couchdb-[0-9].{0,16}\.apk$|[\\/]couchdb[\\/]'
