defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
composite_rules:
- id: name-reference
  desc: References the VirtualBox product name
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-reference
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-asset-path
  - id: well-known/app/infrastructure/virtualbox::gentoo-recipe-virtualbox-context
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
