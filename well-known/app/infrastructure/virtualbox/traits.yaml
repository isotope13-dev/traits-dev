defaults:
  platforms: [unix, windows]
  for: [elf, shell, batch, text, pe, archives]
  crit: notable
  conf: 0.98
  size_max: 600000000

traits:
  - id: build-marker
    desc: VirtualBox platform build marker
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: text
      substr: Oracle VirtualBox
      section: .rdata
  - id: source-path
    desc: VirtualBox source path marker
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: text
      substr: \src\VBox\
      section: .rdata
  - id: support-driver
    desc: VirtualBox support driver reference
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: text
      exact: VBoxSup.sys
      section: .rdata
  - id: virtualbox-path
    desc: VirtualBox package path marker
    if:
      type: path
      substr: virtualbox

  - id: virtualbox-case-path
    desc: VirtualBox mixed-case package path marker
    if:
      type: path
      substr: VirtualBox

  - id: vbox-path
    desc: VBox package path marker
    if:
      type: path
      substr: VBox

  - id: unattended-template
    desc: VirtualBox unattended install template
    if:
      type: path
      regex: 'UnattendedTemplates'

  # A Gentoo package-atom reference identifies distribution recipe context,
  # rather than code probing the host for VirtualBox artifacts.
  - id: gentoo-package-atom
    desc: Gentoo VirtualBox package atom
    for: [shell]
    if:
      type: text
      substr: app-emulation/virtualbox
      case_insensitive: true

composite_rules:
  - id: platform-component
    desc: VirtualBox platform component context
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: build-marker
      - id: source-path
      - id: support-driver
  - id: package-member
    desc: VirtualBox package member
    any:
      - id: virtualbox-path
      - id: virtualbox-case-path
      - id: vbox-path

  # Benign context for VM-vendor string probes: a Gentoo ebuild is a distro
  # packaging recipe, so a VirtualBox mention there names the software being
  # packaged (app-emulation/virtualbox*) rather than checking which hypervisor
  # the machine runs on. Referenced from the unless: of the vendor-string atoms.
  - id: gentoo-recipe-virtualbox-context
    desc: Gentoo ebuild recipe naming VirtualBox
    crit: exception
    conf: 0.99
    all:
      - id: metadata/build/package/recipe::gentoo-ebuild-recipe
      - id: gentoo-package-atom
