# OpenShift aos-cd-jobs — release-automation and cluster-maintenance scripts
# for OpenShift CI. Version-gate test runners, self-bootstrapping repo
# clones, and fleet log janitors are its normal behavior, overlapping
# generic malware heuristics for staged execution and repo cloning.
defaults:
  platforms: [unix, windows]
  for: [shell, python]
  crit: notable
  conf: 0.99

traits:
  - id: cd-jobs-context
    desc: OpenShift aos-cd-jobs source-tree path
    if:
      type: path
      regex: 'openshift[\\\\/]aos-cd-jobs@'
