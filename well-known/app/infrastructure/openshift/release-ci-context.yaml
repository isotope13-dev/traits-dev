defaults:
  conf: 0.99
  platforms: [unix, windows]

# The release repository's ci-operator/step-registry scripts legitimately SSH
# into test clusters, stage tooling under /tmp, and run oc debug chroot probes.
traits:
  - id: openshift-release-step-registry-path
    desc: OpenShift release step-registry CI script path
    crit: notable
    for: [shell]
    if:
      type: path
      regex: 'ci-operator/step-registry/.+-commands\.sh$'

  - id: openshift-release-ci-step-basename
    desc: OpenShift release CI step basename
    crit: notable
    for: [shell]
    if:
      type: basename
      regex: '.+-commands\.sh$'

composite_rules:
  - id: openshift-release-ci-step-context
    desc: Recognized OpenShift release CI step script
    crit: exception
    scope: file
    all:
      - id: well-known/app/infrastructure/openshift::openshift-release-source-tree
      - id: openshift-release-step-registry-path
