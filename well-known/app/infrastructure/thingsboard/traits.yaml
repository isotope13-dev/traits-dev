# ThingsBoard — Apache-2.0 open-source IoT platform (thingsboard.io).
# Source releases are Maven multi-module trees with an Angular UI.
defaults:
  platforms: [unix, windows]
  for: [java, javascript, typescript, xml, archives]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 50000000

traits:
  - id: maven-group-id
    desc: ThingsBoard Maven groupId
    for: [xml]
    if:
      type: text
      regex: '<groupId>\s*org\.thingsboard\s*</groupId>'

  - id: maven-artifact-id
    desc: ThingsBoard root Maven artifactId
    for: [xml]
    if:
      type: text
      regex: '<artifactId>\s*thingsboard\s*</artifactId>'

  - id: project-url
    desc: ThingsBoard project URL
    for: [xml, java, javascript, typescript]
    if:
      type: text
      substr: 'https://thingsboard.io'

  - id: authors-copyright
    desc: ThingsBoard authors copyright header
    for: [java, javascript, typescript, xml]
    if:
      type: text
      substr: 'The Thingsboard Authors'

composite_rules:
  - id: thingsboard-maven-identity
    desc: Official ThingsBoard Maven project identity
    crit: notable
    conf: 0.99
    for: [xml]
    all:
      - id: maven-group-id
      - id: maven-artifact-id
      - id: project-url

  - id: thingsboard-source-context
    desc: Official ThingsBoard source context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: maven-group-id
      - id: maven-artifact-id
      - id: authors-copyright
