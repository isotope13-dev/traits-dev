# Traefik reverse proxy and load balancer (github.com/traefik/traefik).
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho, zip]
  crit: notable
  conf: 0.97

traits:
  - id: traefik-go-package
    desc: Traefik Go module path
    for: [pe]
    size_min: 1048576
    size_max: 268435456
    if:
      type: text
      section: .rdata
      substr: github.com/traefik/traefik/

  - id: traefik-release-archive-name
    desc: Traefik release archive name
    for: [zip]
    size_max: 268435456
    if:
      type: value
      path: file.basename
      regex: 'traefik.*traefik_v[0-9].*\.(zip|tar\.gz)$'
      case_insensitive: true

composite_rules:
  - id: traefik-release-archive
    desc: Traefik reverse proxy release archive
    crit: notable
    conf: 0.98
    for: [zip]
    all:
      - id: traefik-release-archive-name
    any:
      - id: traefik-go-package
