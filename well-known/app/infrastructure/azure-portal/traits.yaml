# Azure Portal / Entra admin-center user settings export. Cosmos-backed
# portal preference dumps (theme, favorites, HATs, AAD IAM store) land in
# malware corpora when leaked from tenants; they are UI state, not payloads.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.95
  size_min: 1024
  size_max: 8000000

traits:
  - id: fxs-theme-setting-key
    desc: Azure Portal FxS theme setting key
    if:
      type: text
      substr: '"settingKey":"fxs-theme"'

  - id: hats-extensions-setting-key
    desc: Azure Portal HATs extensions setting key
    if:
      type: text
      substr: '"settingKey":"hatsExtensions"'

  - id: ms-portal-impl-theme-asset
    desc: Azure Portal MsPortalImpl theme asset path
    if:
      type: text
      substr: /Images/MsPortalImpl/Themes/

  - id: aad-iam-persistent-store
    desc: Azure Portal AAD IAM persistent storage store
    if:
      type: text
      substr: '"store":"Microsoft_AAD_IAMPersistentStorage"'

  - id: hubs-extension-browse-favorite
    desc: Azure Portal HubsExtension browse favorite id
    if:
      type: text
      substr: HubsExtension_BrowseAllResources

composite_rules:
  - id: azure-portal-settings-export
    desc: Azure Portal / Entra user settings export dump
    crit: notable
    conf: 0.98
    needs: 3
    any:
      - id: fxs-theme-setting-key
      - id: hats-extensions-setting-key
      - id: ms-portal-impl-theme-asset
      - id: aad-iam-persistent-store
      - id: hubs-extension-browse-favorite
