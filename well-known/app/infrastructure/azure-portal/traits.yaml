# Azure Portal / Entra admin-center user settings export. Cosmos-backed
# portal preference dumps (theme, favorites, HATs, AAD IAM store) land in
# malware corpora when leaked from tenants; they are UI state, not payloads.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.95
  size_min: 1024
  size_max: 8000000

traits:
  - id: fxs-theme-setting-key
    desc: Azure Portal FxS theme setting key
    if:
      type: value
      path: settings[*].settingKey
      exact: fxs-theme

  - id: hats-extensions-setting-key
    desc: Azure Portal HATs extensions setting key
    if:
      type: value
      path: settings[*].settingKey
      exact: hatsExtensions

  - id: ms-portal-impl-theme-asset
    desc: Azure Portal MsPortalImpl theme asset path
    if:
      type: value
      path: settings[*].data.imageUri
      substr: /Images/MsPortalImpl/Themes/

  - id: aad-iam-persistent-store
    desc: Azure Portal AAD IAM persistent storage store
    if:
      type: value
      path: settings[*].store
      exact: Microsoft_AAD_IAMPersistentStorage

  - id: hubs-extension-browse-favorite
    desc: Azure Portal HubsExtension browse favorite id
    if:
      type: value
      path: settings[*].data
      substr: HubsExtension_BrowseAllResources

  - id: cosmos-portal-settings-self
    desc: Cosmos DB portal settings document self-link
    if:
      type: value
      path: settings[*]._self
      regex: '^dbs/.+/colls/.+/docs/'

  - id: cross-tenant-store
    desc: Azure Portal CrossTenant settings store
    if:
      type: value
      path: settings[*].store
      exact: CrossTenant

  - id: user-default-directory-key
    desc: Azure Portal userDefaultDirectory setting key
    if:
      type: value
      path: settings[*].settingKey
      exact: userDefaultDirectory

  - id: avatar-base64-setting-key
    desc: Azure Portal avatar_base64encoded setting key
    if:
      type: value
      path: settings[*].settingKey
      exact: avatar_base64encoded

composite_rules:
  - id: azure-portal-settings-export
    desc: Azure Portal / Entra user settings export dump
    crit: notable
    conf: 0.98
    needs: 3
    any:
      - id: fxs-theme-setting-key
      - id: hats-extensions-setting-key
      - id: ms-portal-impl-theme-asset
      - id: aad-iam-persistent-store
      - id: hubs-extension-browse-favorite
      - id: cosmos-portal-settings-self
      - id: cross-tenant-store
      - id: user-default-directory-key
      - id: avatar-base64-setting-key
