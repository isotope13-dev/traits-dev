# OVHcloud official CLI (github.com/ovh/ovhcloud-cli) — Go Cobra client for OVH APIs.
defaults:
  platforms: [unix, windows]
  for: [go, shell, markdown, json, javascript, text]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: OVHcloud CLI versioned source-tree member
    if:
      type: path
      regex: 'ovh[\\/]ovhcloud-cli@'

  - id: go-module-path
    desc: OVHcloud CLI Go module path
    for: [go, text]
    if:
      type: text
      substr: module github.com/ovh/ovhcloud-cli

  - id: github-repository
    desc: OVHcloud CLI GitHub repository reference
    if:
      type: text
      substr: github.com/ovh/ovhcloud-cli

  - id: readme-title
    desc: OVHcloud CLI README title
    for: [markdown]
    if:
      type: text
      substr: '# OVHcloud official CLI'

  - id: github-source-tree-member-path
    desc: OVHcloud CLI GitHub module archive member path
    if:
      type: path
      regex: 'ovh[\\/]ovhcloud-cli@v[0-9]'

  - id: github-source-archive-zip-name
    desc: OVHcloud CLI GitHub source archive zip name
    if:
      type: path
      basename: true
      regex: '^github\.com-ovh-ovhcloud-cli-v[0-9]'

composite_rules:
  - id: ovhcloud-cli-source-tree
    desc: OVHcloud CLI official source tree
    crit: notable
    for: [zip, go, text, shell, markdown, json, javascript]
    scope: archive
    needs: 2
    any:
      - id: source-tree-member
      - id: go-module-path
      - id: github-repository
      - id: readme-title

  - id: ovhcloud-cli-context
    desc: OVHcloud CLI official client context
    crit: exception
    conf: 0.99
    any:
      - id: github-source-tree-member-path
      - id: github-source-archive-zip-name
      - id: source-tree-member
      - id: go-module-path
      - id: github-repository
      - id: readme-title
