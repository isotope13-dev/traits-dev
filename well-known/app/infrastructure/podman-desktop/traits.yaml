defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: pe-product-name
    desc: Podman Desktop PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: Podman Desktop

  - id: pe-company-name
    desc: Podman Desktop PE company name
    if:
      type: value
      path: pe.version.company
      exact: Podman Desktop

  - id: builtin-podman-extension-path
    desc: Podman Desktop built-in extension
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      # `.cdix` is Podman Desktop's own extension-container layout, and it
      # ships one per provider -- kind.cdix, docker.cdix, compose.cdix,
      # lima.cdix -- not just podman.cdix. Anchoring on the product's own
      # name matched exactly one of them, so the Kubernetes extension
      # (`extensions/kind/builtin/kind.cdix/dist/extension.js`) carried no
      # identity at all and scored hostile for calling the Kubernetes API.
      type: path
      regex: '[a-z0-9-]{1,24}\.cdix/(src|dist)/extension\.(ts|cjs|js)$'

  # Podman Desktop is an Electron app: its main process is bundled to
  # `packages/main/dist/index.cjs`. That path alone is generic Electron, so it
  # is paired with the product-name marker below rather than used on its own.
  - id: electron-main-bundle-path
    desc: Electron main process bundle path
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: path
      regex: 'main/dist/index\.cjs$'

composite_rules:
  - id: podman-desktop-nsis-installer-context
    desc: Recognized Podman Desktop NSIS installer context
    crit: exception
    conf: 0.99
    all:
      - id: pe-product-name
      - id: pe-company-name
      - id: metadata/binary/installer/script::nsis

  # The main process is where Podman Desktop talks to Kubernetes: it reads the
  # kubeconfig and service-account token and calls the secrets/configmap API,
  # which is `kubernetes-serviceaccount-secret-dump`'s entire evidence. Two
  # legs, because the Electron path is generic on its own and the product-name
  # text is only a mention, which acquits on a name alone.
  - id: podman-desktop-main-bundle
    desc: Podman Desktop Electron main bundle
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [javascript, typescript]
    all:
      - id: electron-main-bundle-path
      - id: well-known/app/infrastructure/podman-desktop::resource-text
