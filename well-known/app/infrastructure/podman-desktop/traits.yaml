defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: pe-product-name
    desc: Podman Desktop PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: Podman Desktop

  - id: pe-company-name
    desc: Podman Desktop PE company name
    if:
      type: value
      path: pe.version.company
      exact: Podman Desktop

  - id: builtin-podman-extension-path
    desc: Podman Desktop built-in extension
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: path
      regex: 'podman\.cdix/(src|dist)/extension\.(ts|cjs|js)$'

composite_rules:
  - id: podman-desktop-nsis-installer-context
    desc: Recognized Podman Desktop NSIS installer context
    crit: exception
    conf: 0.99
    all:
      - id: pe-product-name
      - id: pe-company-name
      - id: metadata/binary/installer/script::nsis
