defaults:
  platforms: [unix, windows]
  size_max: 600000000

traits:
  - id: macos-app-bundle
    desc: Podman Desktop macOS app bundle
    crit: notable
    conf: 0.96
    for: [macho, binaries, javascript, typescript, c, archives, zip]
    if:
      type: path
      regex: 'Podman Desktop\.app[\\/]'
  - id: resource-basename
    desc: Podman Desktop extension resource
    crit: component
    conf: 0.96
    for: [javascript, typescript, c]
    size_max: 50000000
    if:
      type: basename
      regex: '^image-registry-[A-Za-z0-9_-]+\.cjs$'
  - id: resource-text
    desc: Podman Desktop product name reference
    crit: component
    conf: 0.96
    for: [javascript, typescript, c]
    size_max: 50000000
    if:
      type: text
      regex: '(?i)Podman Desktop|podman-desktop'

composite_rules:
  - id: bundled-resource
    desc: Podman Desktop bundled resource
    crit: notable
    conf: 0.96
    all:
      - id: resource-basename
      - id: resource-text
