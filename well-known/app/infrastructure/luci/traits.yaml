# LUCI / Swarming — Chromium distributed test and execution infrastructure.
defaults:
  platforms: [unix, windows]
  for: [javascript, python, go, html]
  crit: notable
  conf: 0.98

traits:
  - id: luci-authors-copyright
    desc: LUCI Authors copyright notice
    for: [javascript, python, go]
    if:
      type: text
      substr: The LUCI Authors

  - id: swarming-bot-bootstrap-template
    desc: Swarming bot bootstrap template
    for: [javascript, python, html]
    if:
      type: text
      substr: /bootstrap?tok=

  - id: swarming-bot-zip-reference
    desc: Swarming bot zip asset reference
    for: [javascript, python, go]
    if:
      type: text
      substr: swarming_bot.zip

composite_rules:
  - id: swarming-bot-bootstrap-context
    desc: Swarming bot bootstrap UI context
    crit: exception
    conf: 0.99
    for: [javascript, python]
    any:
      - id: swarming-bot-bootstrap-template
      - id: swarming-bot-zip-reference
