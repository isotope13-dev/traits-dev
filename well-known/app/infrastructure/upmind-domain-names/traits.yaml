# upmind/provision-provider-domain-names — domain registrar provisioning library.
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, composer.json, json, markdown]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: archive-path
    desc: upmind domain-names provision provider path
    for: [php, zip, archives]
    if:
      type: path
      regex: '(?i)upmind-provision-provider-domain-names'

  - id: composer-package-name
    desc: upmind/provision-provider-domain-names package
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: upmind/provision-provider-domain-names

  - id: namespace-marker
    desc: Upmind DomainNames provision namespace
    for: [php]
    if:
      type: text
      substr: Upmind\\ProvisionProviders\\DomainNames

  - id: upmind-automation-github
    desc: upmind-automation GitHub organization marker
    for: [json, markdown, text, php]
    if:
      type: text
      substr: github.com/upmind-automation

composite_rules:
  - id: upmind-domain-names-provider
    desc: Upmind domain name provisioning PHP library
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: archive-path
      - id: composer-package-name
      - id: namespace-marker
