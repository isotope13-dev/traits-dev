# cdklabs.multi-az-observability — AWS CDK construct for multi-AZ impairment detection.
defaults:
  platforms: [windows, unix]
  for: [python, whl, archives, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: cdklabs multi AZ wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: cdklabs_multi_az_observability

  - id: wheel-home-page
    desc: cdk multi AZ project homepage
    for: [whl]
    if:
      type: value
      path: whl.home_page
      exact: https://github.com/cdklabs/cdk-multi-az-observability

  - id: pypi-package-name
    desc: cdklabs.multi-az-observability PyPI package name
    for: [text, json]
    if:
      type: text
      substr: cdklabs.multi-az-observability

  - id: construct-class
    desc: MultiAZObservability CDK construct
    for: [python, text]
    if:
      type: text
      substr: InstrumentedServiceMultiAZObservability

  - id: github-repo
    desc: cdk-multi-az-observability GitHub repository
    for: [text, json]
    if:
      type: text
      substr: cdklabs/cdk-multi-az-observability

  - id: monitoring-layer-asset
    desc: Bundled monitoring-layer Lambda asset
    for: [zip, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])monitoring-layer\.zip$'

composite_rules:
  - id: cdk-multi-az-observability-package
    desc: CDK multi-AZ observability construct package
    crit: notable
    conf: 0.99
    scope: archive
    for: [whl]
    all:
      - id: wheel-distribution
    any:
      - id: wheel-home-page
      - id: construct-class
      - id: github-repo
      - id: monitoring-layer-asset
