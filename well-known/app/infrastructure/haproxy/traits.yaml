# HAProxy load balancer and reverse-proxy identity.
defaults:
  platforms: [unix]
  for: [c, cpp, elf]
  crit: notable
  conf: 0.97
  size_max: 268435456

traits:
  - id: filter-header-source
    desc: HAProxy filter header include
    for: [c, cpp]
    if:
      type: text
      regex: '(?m)^\s*#\s*include\s*[<"]haproxy/filters?\.h[>"]'

  - id: htx-header-source
    desc: HAProxy HTX header include
    for: [c, cpp]
    if:
      type: text
      regex: '(?m)^\s*#\s*include\s*[<"]haproxy/(http_htx|htx)\.h[>"]'

  - id: version-banner
    desc: HAProxy binary version banner
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: '\bHAProxy version [0-9]+\.[0-9]+(\.[0-9]+)?\b'

composite_rules:
  - id: native-filter-source
    desc: HAProxy native HTTP filter source
    for: [c, cpp]
    all:
      - id: filter-header-source
      - id: htx-header-source
