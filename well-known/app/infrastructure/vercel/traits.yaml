# Vercel CLI native packages are platform-specific npm distributions whose
# payload is a Node.js Single Executable Application binary.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: native-linux-arm64-package-name
    desc: Vercel native Linux ARM64 package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@vercel/vc-native-linux-arm64'

  - id: native-package-repository
    desc: Vercel native package upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: 'git+https://github.com/vercel/vercel.git'

  - id: native-linux-arm64-archive-name
    desc: Vercel native Linux ARM64 npm archive name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@vercel/vc-native-linux-arm64'

  - id: native-archive-repository
    desc: Vercel native npm archive upstream repository
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: 'git+https://github.com/vercel/vercel.git'

composite_rules:
  - id: official-native-package
    desc: Official Vercel native Linux ARM64 package
    crit: notable
    for: [package.json]
    all:
      - id: native-linux-arm64-package-name
      - id: native-package-repository

  - id: official-native-archive
    desc: Official Vercel native Linux ARM64 npm archive
    crit: notable
    scope: archive
    for: [npm, tar]
    all:
      - id: native-linux-arm64-archive-name
      - id: native-archive-repository
