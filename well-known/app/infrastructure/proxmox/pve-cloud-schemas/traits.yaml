# pve-cloud-schemas — vmzberlin JSON Schema pack for Proxmox VE cloud
# inventory (pxc.cloud). Validator CLI only; identity, not C2.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: pve_cloud_schemas wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: pve_cloud_schemas

  - id: package-metadata-name
    desc: pve-cloud-schemas PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*pve-cloud-schemas\s*$'

  - id: package-path
    desc: pve_cloud_schemas package directory path
    for: [python, whl, text]
    if:
      type: path
      regex: 'pve_cloud_schemas[\\/]'

  - id: pcval-entrypoint
    desc: pcval pve_cloud_schemas console script
    for: [text, python]
    if:
      type: text
      substr: pve_cloud_schemas.validate:validate_inventory_file

  - id: dyn-inv-schema-resource
    desc: pve_cloud dyn inventory schema resource
    for: [python]
    if:
      type: text
      substr: pve_cloud_dyn_inv_schema.yaml

composite_rules:
  - id: pve-cloud-schemas-package
    desc: pve-cloud-schemas inventory schema pack
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: package-path
      - id: pcval-entrypoint
      - id: dyn-inv-schema-resource
    needs: 2
