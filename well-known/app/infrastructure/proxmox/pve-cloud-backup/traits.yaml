# py-pve-cloud-backup — Proxmox VE cloud backup orchestration (vmzberlin).
defaults:
  platforms: [unix]
  for: [python, whl, zip, archives, pkginfo, json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: package-distribution-name
    desc: py-pve-cloud-backup Python distribution name
    for: [json, pkginfo]
    if:
      type: text
      substr: 'Name: py-pve-cloud-backup'

  - id: package-module-path
    desc: pve_cloud_backup Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)pve_cloud_backup/'

  - id: backup-rpc-import
    desc: pve_cloud backup RPC library import
    for: [python]
    if:
      type: text
      substr: from pve_cloud.lib.backup_rpc import Command

  - id: brctl-console-script
    desc: pve_cloud_backup brctl console entry point
    for: [python, whl, zip, archives, json]
    if:
      type: text
      substr: pve_cloud_backup.daemon.brctl:main

composite_rules:
  - id: pve-cloud-backup-python-package
    desc: Proxmox VE cloud backup orchestration package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-distribution-name
      - id: package-module-path
