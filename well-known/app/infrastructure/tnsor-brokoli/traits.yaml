# Tnsor-Labs/brokoli — Apache-2.0 local data-pipeline platform. Plugin
# indexes are signed/digested GitHub raw catalogs, not a Python wheel
# that stages unsigned remote extension code.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 80000000

traits:
  - id: module-path
    desc: Brokoli Go module path
    if:
      type: text
      regex: '(?i)github\.com/tnsor-labs/brokoli'

  - id: source-archive-path
    desc: Brokoli module source archive path
    for: [go, zip]
    if:
      type: path
      regex: '(?i)tnsor-labs/brokoli@'

  - id: plugin-index-url
    desc: Brokoli plugins GitHub raw index
    if:
      type: text
      substr: Tnsor-Labs/brokoli-plugins
