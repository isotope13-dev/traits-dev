# systemd — Linux init/service manager. A basename alone is only a naming
# convention; use the package note as the independent identity evidence before
# using this as a false-positive exclusion for system-service masquerade.
defaults:
  platforms: [unix]
  for: [elf]
  size_min: 1
  size_max: 104857600
traits:
  - id: systemd-helper-basename
    desc: systemd-style helper basename
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '^systemd-[a-z0-9-]+$'

  - id: systemd-package-name
    desc: ELF package metadata names systemd
    crit: notable
    conf: 1.0
    if:
      type: value
      path: elf.package.name
      exact: systemd

  - id: systemd-mtd-probe-helper-basename
    desc: systemd MTD probe helper basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      exact: mtd_probe

  - id: systemd-container-helper-basename-a
    desc: systemd container helper basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      regex: '^systemd-(nspawn|vmspawn)$'
  - id: systemd-container-helper-basename-b
    desc: systemd machine helper basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      regex: '^systemd-(machined|importd)$'
  - id: systemd-container-helper-basename-c
    desc: systemd portable helper basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      regex: '^systemd-(portabled|pull)$'
  - id: systemd-container-helper-basename-d
    desc: systemd image helper basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      regex: '^systemd-(dissect|import)$'
  - id: systemd-container-helper-basename-e
    desc: systemd export helper basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      regex: '^systemd-(export|import-fs)$'
  - id: systemd-nss-mymachines-basename
    desc: systemd nss mymachines basename
    crit: notable
    conf: 1.0
    for: [elf, so]
    if:
      type: value
      path: file.basename
      regex: '^libnss_mymachines\.so'

composite_rules:
  - id: legitimate-systemd-helper-basename
    desc: Systemd helper basename with package attestation
    crit: notable
    conf: 1.0
    all:
      - id: systemd-helper-basename
      - id: systemd-package-name

  # These identities cover the systemd helpers and runtime library that
  # legitimately combine socket, PTY, and exec control paths.
  - id: systemd-native-control-component
    desc: systemd helper or non-NSS runtime library identity
    crit: exception
    conf: 1.0
    any:
      - id: legitimate-systemd-helper-basename
      - id: well-known/lib/native/systemd::systemd-shared-library
    unless:
      # NSS modules are loaded into many unrelated services and are not
      # expected to provide systemd's socket/PTY/exec control paths. Keep
      # those identities eligible for backdoor detection.
      - id: well-known/lib/native/systemd::libnss-systemd-systemd-library
      - id: well-known/lib/native/systemd::libnss-resolve-systemd-library
      - id: well-known/lib/native/systemd::libnss-myhostname-systemd-library
      - id: well-known/app/infrastructure/systemd::systemd-nss-mymachines-basename

  - id: container-runtime-component-basename
    desc: systemd container runtime component basename
    crit: notable
    conf: 1.0
    any:
      - id: systemd-container-helper-basename-a
      - id: systemd-container-helper-basename-b
      - id: systemd-container-helper-basename-c
      - id: systemd-container-helper-basename-d
      - id: systemd-container-helper-basename-e
      - id: systemd-nss-mymachines-basename
