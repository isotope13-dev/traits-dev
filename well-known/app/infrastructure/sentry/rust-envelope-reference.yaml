defaults:
  platforms: [unix, windows]

traits:
  - id: well-known/app/infrastructure/sentry::rust-sentry-envelope-reference
    desc: Sentry envelope endpoint reference
    crit: notable
    conf: 0.94
    for: [rust]
    if:
      type: text
      regex: '(?i)(^|[^a-z0-9-])ingest\.(sentry\.io|[a-z0-9.-]{1,253}\.sentry\.io)/.{0,160}/envelope/'
