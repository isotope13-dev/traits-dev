# minikube (kubernetes/minikube) runs a local Kubernetes cluster inside a VM or
# container. It embeds golang.org/x/crypto/ssh with port-forwarding support so
# it can drive the guest, and ships guest provisioning scripts that schedule
# work and decode base64 blobs -- so a release binary trips reverse-SSH-tunnel
# and cron-with-base64 heuristics on library and template strings alone.
#
# Identity comes from Go build info (the main module path recorded by the
# toolchain), not a filename or a size window: it survives renaming and is
# present in every official release. cleave exposes it under the object for the
# binary's own format, hence one matcher per format.
defaults:
  platforms: [linux, macos, windows]
  # A statically linked Go binary embedding the whole Kubernetes client stack;
  # official releases have run ~60-150 MB. The bounds only keep the matchers
  # off small files, they are not part of the identity.
  size_min: 20000000
  size_max: 400000000

traits:
- id: minikube-go-module-path-macho
  desc: Minikube Go module identity
  crit: notable
  conf: 0.999
  for: [macho]
  if:
    type: value
    path: macho.go.module.path
    exact: k8s.io/minikube
- id: minikube-go-command-path-macho
  desc: Minikube Go command path identity
  crit: notable
  conf: 0.999
  for: [macho]
  if:
    type: value
    path: macho.go.path
    exact: k8s.io/minikube/cmd/minikube
- id: minikube-go-module-path-elf
  desc: Minikube Go module identity
  crit: notable
  conf: 0.999
  for: [elf]
  if:
    type: value
    path: elf.go.module.path
    exact: k8s.io/minikube
- id: minikube-go-command-path-elf
  desc: Minikube Go command path identity
  crit: notable
  conf: 0.999
  for: [elf]
  if:
    type: value
    path: elf.go.path
    exact: k8s.io/minikube/cmd/minikube
- id: minikube-go-module-path-pe
  desc: Minikube Go module identity
  crit: notable
  conf: 0.999
  for: [pe]
  if:
    type: value
    path: pe.go.module.path
    exact: k8s.io/minikube
- id: minikube-go-command-path-pe
  desc: Minikube Go command path identity
  crit: notable
  conf: 0.999
  for: [pe]
  if:
    type: value
    path: pe.go.path
    exact: k8s.io/minikube/cmd/minikube

composite_rules:
# `go.module.path` is the module the binary was *built from*, recorded by the
# toolchain -- not a vendored dependency and not a string an unrelated binary
# can pick up by embedding minikube's code.
- id: minikube-release-binary-context
  desc: Recognized Minikube release binary
  crit: exception
  conf: 0.999
  any:
  - id: minikube-go-module-path-macho
  - id: minikube-go-module-path-elf
  - id: minikube-go-module-path-pe
