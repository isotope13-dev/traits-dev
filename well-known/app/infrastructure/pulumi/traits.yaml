defaults:
  platforms: [unix, windows]
  for: [javascript, github-actions, package.json, python, whl]
traits:
  - id: node-sdk-package
    desc: Pulumi Node.js SDK package
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@pulumi/pulumi'
  - id: pulumi-source-tree
    desc: Pulumi source archive member
    crit: notable
    conf: 0.99
    for: [javascript, python, markdown, shell, github-actions, package.json]
    if:
      type: path
      regex: 'pulumi@v[0-9]'
  - id: github-secrets-export-action
    desc: Pulumi GitHub secrets export action
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: pulumi/esc-export-secrets-action
  - id: github-action-retry-wrapper
    desc: Pulumi GitHub Action retry wrapper
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'Retry wrapper for GitHub Actions|pulumi/retry-action'
  - id: pulumi-dotnet-provider
    desc: Pulumi .NET provider assembly identity
    crit: notable
    conf: 0.99
    for: [pe, dll]
    size_min: 100000
    size_max: 500000000
    if:
      type: value
      path: pe.version.product_name
      regex: '^Pulumi\.[A-Za-z0-9]+$'

  - id: pulumi-python-provider-wheel
    desc: Pulumi Python provider wheel package name
    for: [whl, python]
    if:
      type: value
      path: whl.distribution
      regex: '^pulumi_[a-z0-9_]+$'

  - id: pulumi-provider-homepage
    desc: Pulumi provider package homepage
    for: [whl, python]
    if:
      type: text
      regex: 'https://github\.com/pulumi/pulumi-'

composite_rules:
  - id: pulumi-python-provider-package
    desc: Pulumi auto-generated Python provider wheel
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: pulumi-python-provider-wheel
    any:
      - id: metadata/lang/compiler/generated::pulumi-language-python-generated
      - id: pulumi-provider-homepage
