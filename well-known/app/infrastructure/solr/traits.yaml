# Apache Solr — search server core JAR (org.apache.solr). Bundled
# security.json uses solr.BasicAuthPlugin and RuleBasedAuthorizationPlugin.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, json]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 50000000

traits:
  - id: implementation-title
    desc: Apache Solr implementation title
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: org.apache.solr

  - id: package-path
    desc: Apache Solr package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)apache/solr/'

  - id: basic-auth-plugin
    desc: Solr BasicAuthPlugin class name
    for: [json, text]
    conf: 0.98
    if:
      type: text
      substr: solr.BasicAuthPlugin
