defaults:
  platforms: [linux]
  for: [tar, archives, shell, text]

traits:
  - id: vmware-workstation-pkgbuild
    desc: VMware Workstation PKGBUILD source package
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: pkgname=vmware-workstation

  - id: workstation-company
    desc: VMware Workstation company metadata
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 1000000
    size_max: 50000000
    if:
      type: value
      path: pe.version.company
      exact: VMware, Inc.

  - id: workstation-product
    desc: VMware Workstation product metadata
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 1000000
    size_max: 50000000
    if:
      type: value
      path: pe.version.product_name
      exact: VMware Workstation

  - id: workstation-description
    desc: VMware Workstation UI library description
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 1000000
    size_max: 50000000
    if:
      type: value
      path: pe.version.description
      exact: VMware cui library

  - id: workstation-original-filename
    desc: VMware Workstation UI DLL filename metadata
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 1000000
    size_max: 50000000
    if:
      type: value
      path: pe.version.original_filename
      exact: vmwarewui.DLL
      case_insensitive: true

  - id: workstation-signer
    desc: VMware Workstation Authenticode signer
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 1000000
    size_max: 50000000
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=VMware\\, Inc\.,OU=Digital ID Class 3 - Microsoft Software Validation v2,'

composite_rules:
  - id: workstation-ui-dll-identity
    desc: Signed VMware Workstation UI DLL identity
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: workstation-company
      - id: workstation-product
      - id: workstation-description
      - id: workstation-original-filename
      - id: workstation-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
