# UDisks2 is the freedesktop Linux disk-management daemon.  Its encrypted
# volume and secure-erase APIs are expected capabilities, not ransomware intent.
# The same APIs ship in two shapes: the udisksd daemon itself, and the loadable
# modules it dlopen()s from /usr/lib*/udisks2/modules (lvm2, btrfs, zram, iscsi,
# lsm).  Identify both by the UDisks2 ABI rather than by the daemon filename, so
# a distro's -lvm2/-btrfs subpackage is recognized as UDisks2 too.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: daemon-basename
    desc: UDisks2 daemon executable basename
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 5000000
    if:
      type: basename
      exact: udisksd

  # Wide size bounds on the symbol traits: the names below are UDisks2-internal
  # and unique on their own, while several stock modules are well under 100 KB.
  - id: daemon-api
    desc: UDisks2 daemon API symbol
    crit: notable
    conf: 0.99
    size_min: 20000
    size_max: 20000000
    if:
      type: symbol
      exact: udisks_daemon_new

  - id: block-api
    desc: UDisks2 block-management API symbol
    crit: notable
    conf: 0.99
    size_min: 20000
    size_max: 20000000
    if:
      type: import
      exact: udisks_block_complete_format

  - id: module-abi
    desc: UDisks2 loadable module ABI entry point
    crit: notable
    conf: 0.99
    size_min: 20000
    size_max: 20000000
    if:
      type: export
      exact: udisks_module_handle_uevent

  - id: library-linkage
    desc: Links against the UDisks2 shared library
    crit: notable
    conf: 0.95
    size_min: 20000
    size_max: 20000000
    if:
      type: value
      path: elf.needed
      regex: '^libudisks2\.so'

composite_rules:
  - id: udisks2-context
    desc: Recognized UDisks2 disk-management daemon or module
    crit: exception
    conf: 0.99
    all:
      - id: block-api
    any:
      - id: daemon-basename
      - id: daemon-api
      - id: module-abi
      - id: library-linkage
    needs: 2
