# UDisks2 is the freedesktop Linux disk-management daemon.  Its encrypted
# volume and secure-erase APIs are expected capabilities, not ransomware intent.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: daemon-basename
    desc: UDisks2 daemon executable basename
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 5000000
    if:
      type: basename
      exact: udisksd

  - id: daemon-api
    desc: UDisks2 daemon API symbol
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 5000000
    if:
      type: symbol
      exact: udisks_daemon_new

  - id: block-api
    desc: UDisks2 block-management API symbol
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 5000000
    if:
      type: import
      exact: udisks_block_complete_format

composite_rules:
  - id: udisks2-daemon-context
    desc: Recognized UDisks2 disk-management daemon
    crit: exception
    conf: 0.99
    all:
      - id: daemon-basename
      - id: daemon-api
      - id: block-api
