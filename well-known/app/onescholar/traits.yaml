# OneScholar is a browser extension for academic literature discovery,
# translation, and citation on scholarly publisher sites.
defaults:
  platforms: [unix, windows]
  for: [javascript, chrome-manifest, xpi, crx, archives]
  crit: notable
  conf: 0.99

traits:
  - id: firefox-extension-id
    desc: OneScholar Firefox extension ID
    for: [chrome-manifest]
    if:
      type: value
      path: browser_specific_settings.gecko.id
      exact: onescholar@scigreat.com

  - id: product-name
    desc: OneScholar product name marker
    for: [javascript, html, json]
    if:
      type: text
      regex: '(?i)OneScholar'

  - id: scigreat-homepage
    desc: OneScholar SciGreat homepage URL
    for: [javascript, chrome-manifest, html]
    if:
      type: text
      substr: scigreat.com/info/onescholar

composite_rules:
  - id: onescholar-extension-context
    desc: Recognized OneScholar browser extension
    crit: exception
    conf: 0.99
    any:
      - id: firefox-extension-id
      - id: scigreat-homepage
