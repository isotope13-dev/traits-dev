defaults:
  platforms:
  - windows
  - unix
  # Windows installers bundle the runtime and are substantially larger than
  # source scripts; keep identity matching available for those vendor builds.
  size_max: 2000000000
traits:
- id: official-download-url
  desc: Official Ollama installer download URL
  crit: notable
  conf: 0.98
  for:
  - python
  - shell
  - text
  if:
    type: text
    regex: https://ollama\.com/(download/(OllamaSetup\.exe|Ollama-darwin\.zip)|install\.sh)\b

- id: ollama-api-tags-path
  desc: Ollama model-list API path
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: text
    substr: /api/tags

- id: ollama-windows-signer
  desc: Ollama Windows installer code-signing identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.signatures[0].subject
    substr: Ollama Inc.

- id: ollama-windows-product
  desc: Ollama Windows installer product identity
  crit: notable
  conf: 0.99
  for: [pe]
  platforms: [windows]
  size_min: 1000000
  size_max: 2000000000
  if:
    type: value
    path: pe.version.product_name
    exact: Ollama
