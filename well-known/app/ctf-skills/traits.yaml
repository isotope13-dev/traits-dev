# ctf-skills is an Agent Skills corpus for authorized CTF training. It
# intentionally documents exploitation, prompt injection, and security tools;
# the repository identity supplies narrow context for those examples without
# suppressing unrelated behavior traits.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, json, archives]
  crit: notable
  conf: 0.99

traits:
  - id: repository-member-path
    desc: ctf-skills repository member path
    for: [scripts, source, markdown, text, json, archives, python, shell, batch, powershell]
    if:
      type: path
      regex: '(^|[\\/])ctf-skills-[0-9a-f]{40}([\\/]|$)'

  - id: repository-url
    desc: ljagiello ctf-skills repository reference
    for: [markdown, text, json]
    if:
      type: text
      substr: github.com/ljagiello/ctf-skills

  - id: repository-title
    desc: ctf-skills repository title
    for: [markdown]
    if:
      type: text
      regex: '(?im)^#\s*ctf-skills\s*$'

  - id: repository-install-reference
    desc: ctf-skills installation reference
    for: [markdown]
    if:
      type: text
      substr: ljagiello/ctf-skills

composite_rules:
  - id: ctf-training-repository-context
    desc: Recognized ctf-skills CTF training repository context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: repository-title
      - id: repository-install-reference
