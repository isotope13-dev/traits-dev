# OVAS Connector — WordPress plugin for OVAS Connect accounting API.
defaults:
  platforms: [unix, windows]
  for: [php, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: ovas-plugin-slug
    desc: OVAS Connector WordPress plugin slug
    if:
      type: text
      substr: ovas-connect

  - id: ovas-api-host
    desc: OVAS Connect API hostname
    if:
      type: text
      substr: api.ovas.nl

  - id: ovas-payment-webhook-route
    desc: OVAS payment provider webhook REST route
    if:
      type: text
      regex: '(?i)(digiwallet|pronamic|get_pronamic_payment)'

composite_rules:
  - id: ovas-connector-plugin-context
    desc: OVAS Connector WordPress plugin identity
    crit: notable
    all:
      - id: ovas-plugin-slug
      - id: ovas-api-host
