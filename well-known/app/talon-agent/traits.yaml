# talon-agent — Personal AI agent daemon by Dylan Neve (github.com/dylanneve1/talon).
# Telegram/Discord/Teams frontends, multi-backend LLM routing (Codex/Claude/OpenAI),
# MCP hub, shell/fs native tools, and mesh remote nodes. Dual-use agent capabilities
# (spawn, fetch, credentials) are expected operator features, not trojan behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: github-repository-marker
    desc: Talon agent GitHub repository marker
    if:
      type: text
      substr: github.com/dylanneve1/talon

  - id: cli-entrypoint-banner
    desc: Talon CLI entry point banner
    for: [javascript]
    if:
      type: text
      substr: Talon CLI entry point

  - id: talon-config-type
    desc: Talon configuration type export
    for: [javascript]
    if:
      type: text
      substr: type TalonConfig

composite_rules:
  - id: talon-agent-application
    desc: Talon personal AI agent application
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: github-repository-marker
      - id: cli-entrypoint-banner
