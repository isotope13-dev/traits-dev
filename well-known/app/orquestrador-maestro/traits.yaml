# @iapro/orquestrador-maestro-cli — AI coding-agent orchestrator that installs
# skills, AGENTS.md, and tool profiles into Codex, Claude, Cursor, and peers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, markdown]
  crit: component
  conf: 0.96

traits:
  - id: npm-package-name
    desc: Orquestrador Maestro npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@iapro/orquestrador-maestro-cli'
  - id: cli-binary-name
    desc: Orquestrador Maestro CLI binary name
    crit: notable
    for: [javascript]
    if:
      type: path
      basename: true
      exact: orquestrador-maestro.js
  - id: archive-package-name
    desc: Orquestrador Maestro npm archive name
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@iapro/orquestrador-maestro-cli'
  - id: package-member-context
    desc: Orquestrador Maestro package member identity
    crit: notable
    for: [javascript, typescript, markdown]
    if:
      type: value
      path: package.json::name
      exact: '@iapro/orquestrador-maestro-cli'
  - id: orchestrator-root-marker
    desc: Orquestrador Maestro SKILLS_ROUTER marker
    crit: notable
    if:
      type: text
      substr: orquestrador/SKILLS_ROUTER.json

composite_rules:
  - id: official-npm-archive
    desc: Official Orquestrador Maestro npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: orchestrator-root-marker
