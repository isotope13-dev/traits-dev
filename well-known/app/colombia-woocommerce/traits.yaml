# Colombia WooCommerce — Saul Morales Pacheco states and cities plugin.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, text, markdown, archives, zip]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: colombia-woocommerce-archive
    desc: Colombia WooCommerce plugin archive name
    if:
      type: path
      regex: '(?i)departamentos-y-ciudades-de-colombia-para-woocommerce'

  - id: colombia-woocommerce-plugin-header
    desc: Colombia WooCommerce plugin header marker
    for: [php]
    crit: notable
    if:
      type: text
      substr: Departamentos y Ciudades de Colombia para Woocommerce

  - id: colombia-woocommerce-class
    desc: WC_States_Places_Colombia class marker
    for: [php]
    crit: notable
    if:
      type: text
      substr: WC_States_Places_Colombia

  - id: colombia-woocommerce-text-domain
    desc: Colombia WooCommerce text domain marker
    for: [php, javascript]
    crit: notable
    if:
      type: text
      substr: departamentos-y-ciudades-de-colombia-para-woocommerce

composite_rules:
  - id: colombia-woocommerce-plugin
    desc: Colombia WooCommerce states and cities plugin
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives, zip]
    any:
      - id: colombia-woocommerce-archive
      - id: colombia-woocommerce-plugin-header
      - id: colombia-woocommerce-class
      - id: colombia-woocommerce-text-domain
