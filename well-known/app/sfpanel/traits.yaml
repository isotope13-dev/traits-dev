defaults:
  platforms: [unix]
  for: [go, typescript, javascript, shell, markdown, json, elf]
  crit: notable
  conf: 0.99
  size_max: 300000000

traits:
  - id: source-tree
    desc: SFPanel source tree member
    if:
      type: path
      substr: SFPanel@v

  - id: repository-reference
    desc: SFPanel official repository reference
    if:
      type: text
      substr: github.com/svrforum/SFPanel

  - id: executable-basename
    desc: SFPanel executable basename
    for: [elf, shell]
    if:
      type: path
      basename: true
      exact: sfpanel

composite_rules:
  - id: application-context
    desc: SFPanel server administration application
    crit: notable
    conf: 0.99
    any:
      - id: source-tree
      - id: repository-reference
      - id: executable-basename
