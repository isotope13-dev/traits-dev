# pandoc-crossref — conda-forge / Hackage filter that numbers figures,
# equations, and tables for Pandoc. Identity is the CLI help banner and the
# conda package name; the binary is a large statically-linked Haskell build.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, conda]
  crit: notable
  conf: 0.95
  size_min: 64
  size_max: 200000000

traits:
  - id: pandoc-crossref-help-banner
    desc: pandoc-crossref CLI help banner
    conf: 0.98
    size_min: 100000
    if:
      type: text
      substr: 'pandoc-crossref - Pandoc filter for cross-references'

  - id: pandoc-crossref-pipe-mode
    desc: pandoc-crossref pipe-mode usage string
    crit: component
    conf: 0.9
    size_min: 100000
    if:
      type: text
      substr: 'pandoc-crossref --pipe'

  - id: pandoc-crossref-conda-name
    desc: pandoc-crossref conda package name
    for: [json, conda]
    crit: component
    conf: 0.95
    size_min: 32
    size_max: 65536
    if:
      type: value
      path: name
      exact: pandoc-crossref

composite_rules:
  - id: pandoc-crossref-identity
    desc: pandoc-crossref filter binary or package
    conf: 0.97
    any:
      - id: pandoc-crossref-help-banner
      - id: pandoc-crossref-conda-name
      - id: pandoc-crossref-pipe-mode
