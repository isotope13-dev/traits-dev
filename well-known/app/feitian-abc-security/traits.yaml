# FeiTian's Agricultural Bank of China browser security integration. These
# markers identify the installed product family; they do not assert that every
# file carrying one is safe, which keeps them useful for tamper comparison.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: abchina-security-product-marker
    desc: FeiTian ABC security marker
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 2000000
    if:
      type: text
      regex: 'NativeMessaging for ABChina|AbcEbankInfo'
      section: .rsrc

  - id: abchina-assistant-product-name
    desc: ABCBank Assistant product name
    crit: notable
    conf: 0.99
    size_min: 100000
    if:
      type: value
      path: pe.version.product_name
      exact: ABCBank Assistant

  - id: abchina-assistant-product-name-cn
    desc: Agricultural Bank web-assistant product name
    crit: notable
    conf: 0.99
    size_min: 100000
    if:
      type: value
      path: pe.version.product_name
      exact: 农业银行网银助手

  - id: abchina-assistant-update-domain
    desc: ABCBank Assistant update domain
    crit: notable
    conf: 0.99
    size_min: 100000
    if:
      type: text
      regex: '(?i)ebhelper(\.cdn-static)?\.abchina\.com\.cn'
      section: .rdata

  - id: abchina-assistant-resource-domain
    desc: ABCBank Assistant resource domain
    crit: notable
    conf: 0.99
    size_min: 100000
    if:
      type: text
      regex: '(?i)ebhelper(\.cdn-static)?\.abchina\.com\.cn'
      section: .rsrc

  - id: abchina-system-info-plugin
    desc: ABCBank system-information plugin filename
    crit: notable
    conf: 0.99
    size_min: 50000
    if:
      type: path
      basename: true
      exact: luasysinfo.dll

  - id: abchina-assist-component
    desc: ABCBank Assist component product name
    crit: notable
    conf: 0.99
    size_min: 100000
    if:
      type: value
      path: pe.version.product_name
      exact: Assist 动态链接库

  - id: abchina-keyboard-plugin
    desc: ABCBank keyboard plugin internal name
    crit: notable
    conf: 0.99
    size_min: 50000
    if:
      type: value
      path: pe.version.internal_name
      exact: Plugin_FTKBDSYS.dll

composite_rules:
  - id: abchina-assistant-product-identity
    desc: ABCBank Assistant product identity
    crit: notable
    conf: 0.99
    any:
      - id: abchina-assistant-product-name
      - id: abchina-assistant-product-name-cn

  - id: abchina-signed-component-identity
    desc: ABCBank signed security component identity
    crit: notable
    conf: 0.99
    any:
      - id: abchina-system-info-plugin
      - id: abchina-assist-component
      - id: abchina-keyboard-plugin

  - id: abchina-assistant-signed-endpoint-context
    desc: FeiTian-signed ABCBank Assistant endpoint context
    crit: exception
    conf: 0.99
    all:
      - id: abchina-assistant-product-identity
      - id: metadata/signed/certificate/identity::pe-signer-feitian-technologies
      - id: abchina-assistant-update-domain

  - id: abchina-signed-component-context
    desc: Agricultural Bank signed security component context
    crit: exception
    conf: 0.99
    all:
      - id: abchina-signed-component-identity
      - id: metadata/signed/certificate/identity::pe-signer-agricultural-bank-china

  - id: abchina-signed-resource-context
    desc: FeiTian-signed ABCBank resource context
    crit: exception
    conf: 0.99
    all:
      - id: abchina-assistant-resource-domain
      - id: metadata/signed/certificate/identity::pe-signer-feitian-technologies

  - id: abchina-resource-context
    desc: FeiTian ABCBank resource context
    crit: exception
    conf: 0.99
    any:
      - id: abchina-assistant-signed-endpoint-context
      - id: abchina-signed-resource-context
