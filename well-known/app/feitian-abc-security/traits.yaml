# FeiTian's Agricultural Bank of China browser security integration. These
# markers identify the installed product family; they do not assert that every
# file carrying one is safe, which keeps them useful for tamper comparison.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: abchina-security-product-marker
    desc: FeiTian ABC security marker
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 2000000
    if:
      type: text
      regex: 'NativeMessaging for ABChina|AbcEbankInfo'
      section: .rsrc
