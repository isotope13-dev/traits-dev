# fl-darkstat is a Freelancer game data browser and map tool.  It vendors
# legacy Windows modding utilities and nests inspiration archives that must
# not be correlated with unrelated siblings in the outer source tree.
defaults:
  platforms: [unix, windows]
  for: [go, markdown, pe, zip]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: fl-darkstat Go module path
    for: [go, markdown]
    if:
      type: text
      substr: github.com/darklab8/fl-darkstat

  - id: project-readme-flstat
    desc: fl-darkstat README flstat reference
    for: [markdown]
    if:
      type: text
      regex: '(?m)^online version of the \[flstat\]'

  - id: utf-image-exporter-basename
    desc: Bundled UTF Image Exporter utility
    for: [pe]
    size_min: 1000000
    size_max: 2000000
    if:
      type: basename
      exact: UTF Image Exporter.exe
      case_insensitive: true

  - id: utf-image-exporter-pe-product
    desc: UTF Image Exporter PE product metadata
    for: [pe]
    size_min: 1000000
    size_max: 2000000
    if:
      type: value
      path: pe.version.product_name
      exact: UTF Image Exporter

composite_rules:
  - id: fl-darkstat-identity
    desc: fl-darkstat Freelancer game data project
    crit: notable
    conf: 0.99
    any:
      - id: module-path
      - id: project-readme-flstat

  - id: fl-darkstat-source-archive-context
    desc: fl-darkstat upstream source archive
    crit: exception
    conf: 0.99
    for: [zip, archives]
    scope: archive
    any:
      - id: module-path
      - id: project-readme-flstat

  - id: fl-darkstat-bundled-utility-context
    desc: fl-darkstat bundled Freelancer modding utility
    crit: exception
    conf: 0.99
    all:
      - id: utf-image-exporter-basename
      - id: utf-image-exporter-pe-product
