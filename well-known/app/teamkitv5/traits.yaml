# TeamKit v5 — Laravel 13 / Filament 5 multi-panel starter kit.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: teamkitv5-composer-name
    desc: TeamKit v5 Composer package name
    crit: notable
    for: [php, json, text, archives]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"jeffersongoncalves/teamkitv5"'

  - id: teamkitv5-npm-package-name
    desc: TeamKit v5 npm package name
    crit: notable
    for: [json, javascript, text, archives]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"@jeffersongoncalves/teamkitv5"'

  - id: teamkitv5-description
    desc: TeamKit Filament starter kit description marker
    crit: notable
    for: [php, json, text, archives]
    if:
      type: text
      substr: TeamKit starter kit built on Laravel

  - id: teamkitv5-config-namespace
    desc: TeamKit configuration namespace marker
    crit: notable
    for: [php, archives]
    if:
      type: text
      substr: config('teamkit.

  - id: filament-echo-bundle-path
    desc: Filament admin panel bundled Echo asset path
    crit: notable
    for: [javascript, archives]
    if:
      type: path
      regex: '(?i)filament/filament/echo\.js$'

  - id: pusher-js-microsoft-xhr-fallback
    desc: Pusher.js legacy IE Microsoft.XMLHTTP transport
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: createMicrosoftXHR:function(){return new ActiveXObject("Microsoft.XMLHTTP")}

composite_rules:
  - id: teamkitv5-laravel-filament-starter
    desc: TeamKit v5 Laravel Filament starter kit
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: teamkitv5-description
    any:
      - id: teamkitv5-composer-name
      - id: teamkitv5-npm-package-name

  - id: filament-echo-pusher-bundle
    desc: Filament Laravel Echo Pusher.js vendor bundle context
    crit: exception
    conf: 0.98
    for: [javascript, archives]
    all:
      - id: pusher-js-microsoft-xhr-fallback
    any:
      - id: filament-echo-bundle-path
      - id: teamkitv5-composer-name
      - id: teamkitv5-npm-package-name
