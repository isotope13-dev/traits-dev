# ChatWalaʻau is a localhost-first AI agent server built on Microsoft's Agent
# Framework.  These identity traits make its Azure login check and local
# service behavior legible without treating them as hostile execution.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: ChatWalaʻau Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: chatwalaau

  - id: package-name
    desc: ChatWalaʻau package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: chatwalaau

  - id: project-repository
    desc: ChatWalaʻau upstream repository marker
    for: [pkginfo]
    if:
      type: text
      exact: https://github.com/motojinc25/chatwalaau

composite_rules:
  - id: localhost-agent-identity
    desc: Recognized ChatWalaʻau localhost AI agent
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: project-repository
