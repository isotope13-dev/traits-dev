# siglus-ssu — SiglusEngine SceneScript compile/extract utility.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: siglus-ssu-wheel-name
    desc: siglus_ssu Python wheel archive name
    if:
      type: path
      regex: '(?i)siglus_ssu-.*\.whl$'

  - id: siglus-ssu-package-name
    desc: siglus-ssu Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*siglus-ssu\s*$'

  - id: siglus-ssu-module-marker
    desc: siglus_ssu SceneScript utility module marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: SiglusEngine

composite_rules:
  - id: siglus-ssu-python-package
    desc: SiglusEngine SceneScript utility wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: siglus-ssu-wheel-name
      - id: siglus-ssu-package-name
      - id: siglus-ssu-module-marker
