# @antv/awards is a generated badge-data package. Its published archive is
# intentionally JSON-only; the maintainer scripts and their network access are
# repository tooling and are not included in the npm artifact.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, markdown, json]

traits:
  - id: package-name
    desc: AntV Awards npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/awards'
  - id: repository-reference
    desc: AntV Awards repository reference
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: 'github\.com[:/]antvis/awards(\.git)?'
  - id: badge-endpoint-domain
    desc: AntV Awards badge endpoint domain
    crit: notable
    conf: 0.98
    for: [markdown, json]
    if:
      type: text
      substr: awards.antv.vision

composite_rules:
  - id: published-package
    desc: Recognized AntV Awards package
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: package-name
      - id: repository-reference
