# Damocles — Aizenvolt Claude coding assistant VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: damocles-vsix-name
    desc: Damocles VSIX archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)damocles.*\.vsix$'

  - id: damocles-package-name
    desc: Damocles extension package name
    crit: notable
    for: [archives, javascript, json, package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"damocles"'

  - id: damocles-publisher
    desc: Aizenvolt VS Code publisher marker
    crit: notable
    for: [archives, javascript, json, package.json, vsix-manifest]
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"Aizenvolt"'

  - id: damocles-browser-config
    desc: Damocles integrated browser config namespace
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: damocles.browser

  - id: damocles-source-repository
    desc: Damocles official GitHub repository
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: github.com/AizenvoltPrime/damocles

composite_rules:
  - id: damocles-vscode-extension
    desc: Damocles Claude coding assistant VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: damocles-publisher
    any:
      - id: damocles-vsix-name
      - id: damocles-package-name
      - id: damocles-source-repository

  - id: damocles-cdp-browser-context
    desc: Damocles integrated CDP browser automation context
    crit: exception
    conf: 0.98
    for: [javascript, archives]
    all:
      - id: damocles-browser-config
    any:
      - id: damocles-publisher
      - id: damocles-package-name
      - id: damocles-source-repository
