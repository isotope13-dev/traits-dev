# Meet Saver (Caladesoft) — monetized Chrome extension that downloads Google Meet
# recordings from Drive via debugger network capture and ffmpeg.wasm merge.
defaults:
  platforms: [unix, windows]
  for: [javascript, chrome-manifest, html]
  crit: notable
  conf: 0.98

traits:
  - id: manifest-name
    desc: Meet Saver extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Meet Saver
  - id: gumroad-product-url
    desc: Meet Saver Gumroad purchase URL
    for: [javascript]
    if:
      type: text
      substr: 'https://caladesoft.gumroad.com/l/meetsaverpro'
  - id: meetsaver-log-prefix
    desc: MeetSaver console log prefix
    for: [javascript]
    if:
      type: text
      substr: '[MeetSaver]'
