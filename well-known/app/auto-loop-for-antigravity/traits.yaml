# Auto Loop for Antigravity — Keyacrosslaud Ralph Loop VS Code extension for Antigravity IDE.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: auto-loop-vsix-name
    desc: Auto Loop for Antigravity VSIX archive name
    if:
      type: path
      regex: '(?i)Keyacrosslaud\.auto-loop-for-antigravity'

  - id: auto-loop-package-name
    desc: Auto Loop for Antigravity extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"auto-loop-for-antigravity"'

  - id: auto-loop-publisher
    desc: Keyacrosslaud VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"Keyacrosslaud"'

  - id: ralph-loop-antigravity-marker
    desc: Ralph Loop Antigravity IDE integration marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      regex: '(?i)ralphLoop\.antigravity|antigravityClient/'

  - id: ralph-loop-command-marker
    desc: Ralph Loop VS Code command marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      substr: '"command": "ralph.start"'

composite_rules:
  - id: auto-loop-antigravity-vscode-extension
    desc: Auto Loop Ralph Loop VS Code extension for Antigravity IDE
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: auto-loop-publisher
    any:
      - id: auto-loop-vsix-name
      - id: auto-loop-package-name
      - id: ralph-loop-antigravity-marker
      - id: ralph-loop-command-marker
