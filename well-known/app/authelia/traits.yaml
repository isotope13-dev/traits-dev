# Authelia is an open-source authentication and authorization server.  Its Go
# module identity makes the application context explicit when its bundled
# lookup tables resemble tunnel or password-dictionary tooling.
defaults:
  platforms: [unix, windows]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  - id: go-module-path
    desc: Authelia authentication server Go module path
    if:
      type: value
      path: elf.go.path
      exact: github.com/authelia/authelia/v4/cmd/authelia
