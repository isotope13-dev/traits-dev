defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, html]
  crit: notable
  conf: 0.98

traits:
  - id: product-name
    desc: AXMA Story Maker product name
    for: [javascript, json, html]
    if:
      type: text
      substr: AXMA Story Maker

  - id: vendor-host
    desc: AXMA Story Maker vendor service host
    for: [javascript, html]
    if:
      type: text
      substr: sm.axmasoft.com

# NOTE: a `chrome-app-background` trait matching app.background.scripts[0] ==
# "background.js" used to live here. That is the default background-script name
# for essentially every Chrome app, so it carried no AXMA identity — it fired on
# unrelated manifests (e.g. SDL2's NaCl testgles2 test app) and, because this
# directory is referenced from an `unless:` on the js-postmessage-data-eval
# composite, it let any Chrome app suppress that detection. The genuinely unique
# product-name and vendor-host traits above carry the identity on their own.
