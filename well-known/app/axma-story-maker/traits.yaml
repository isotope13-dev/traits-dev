defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, json, html]
  crit: notable
  conf: 0.98

traits:
  - id: product-name
    desc: AXMA Story Maker product name
    for: [javascript, json, html]
    if:
      type: text
      substr: AXMA Story Maker

  - id: vendor-host
    desc: AXMA Story Maker vendor service host
    for: [javascript, html]
    if:
      type: text
      substr: sm.axmasoft.com

  - id: chrome-app-background
    desc: AXMA Story Maker Chrome app background entry
    for: [chrome-manifest]
    if:
      type: value
      path: app.background.scripts[0]
      exact: background.js
