# react-native-webview — official React Native WebView component.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, java, kotlin]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: react-native-webview package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: react-native-webview

  - id: archive-package-name
    desc: react-native-webview npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: react-native-webview

  - id: package-member-context
    desc: react-native-webview package member
    for: [javascript, typescript, java, kotlin]
    if:
      type: value
      path: package.json::name
      exact: react-native-webview

composite_rules:
  - id: react-native-webview-package-context
    desc: react-native-webview official package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
