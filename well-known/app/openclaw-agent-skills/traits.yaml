# OpenClaw Agent Skills is a public collection of reusable coding-agent
# workflows.  Its Beam skill intentionally publishes a bounded, redacted
# session snapshot only when explicitly invoked; this identity must not
# suppress the underlying network or process capabilities.
defaults:
  platforms: [unix, windows]
  for: [tar, markdown, text, javascript, typescript, python, shell, json]
  crit: notable
  conf: 0.99

traits:
  - id: project-heading
    desc: OpenClaw Agent Skills project heading
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: OpenClaw Agent Skills

  - id: upstream-repository
    desc: OpenClaw Agent Skills upstream repository
    for: [markdown, text, json]
    if:
      type: text
      substr: github.com/openclaw/agent-skills

  - id: source-tree-member
    desc: OpenClaw Agent Skills source-tree member
    if:
      type: path
      regex: '(^|[\\/])agent-skills-[0-9a-f]{40}([\\/]|$)'

  - id: beam-session-render-call
    desc: Beam renders a local coding session
    for: [javascript]
    if:
      type: text
      regex: '\brenderSession\s*\(\s*session\.file\b'

  - id: beam-visible-text-sanitization
    desc: Beam sanitizes visible session text
    for: [javascript]
    if:
      type: symbol
      exact: sanitizeVisibleText

  - id: beam-json-payload-body
    desc: Beam serializes the session payload body
    for: [javascript]
    if:
      type: text
      regex: '\bbody\s*:\s*JSON\.stringify\s*\(\s*payload\s*\)'

composite_rules:
  - id: openclaw-agent-skills-identity
    desc: OpenClaw Agent Skills source identity
    crit: notable
    conf: 0.99
    any:
      - id: project-heading
      - id: upstream-repository
      - id: source-tree-member

  # `fetch(url, ...)` is a generic JavaScript operation. Keep the Beam
  # identity in the composite so an unrelated bundle cannot be relabeled as
  # Beam merely because it uses the same call shape.
  - id: beam-fetch-url-call
    desc: Beam fetches the configured endpoint
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: openclaw-agent-skills-identity
      - id: beam-session-render-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: beam-redacted-session-publication
    desc: OpenClaw Beam redacted session publication
    crit: notable
    conf: 0.99
    scope: archive
    near_bytes: 1600
    all:
      - id: openclaw-agent-skills-identity
      - id: beam-session-render-call
      - id: beam-visible-text-sanitization
      - id: beam-fetch-url-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: beam-json-payload-body
