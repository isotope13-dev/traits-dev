# LXPanel GTK magnifier plugin identity. These markers identify the benign
# desktop panel module; they are context, not execution or persistence claims.
defaults:
  platforms: [unix]
  for: [elf]
  crit: baseline
  conf: 0.98
  size_min: 4096
  size_max: 2000000

traits:
  - id: lxpanel-gtk-module-export
    desc: LXPanel GTK module initialization export
    if:
      type: export
      exact: fm_module_init_lxpanel_gtk

  - id: mage-rpi-helper-path
    desc: Raspberry Pi magnifier helper path
    if:
      type: text
      section: .rodata
      substr: /usr/bin/mage-rpi

  - id: magnifier-ui-label
    desc: Virtual magnifying glass UI label
    if:
      type: text
      section: .rodata
      substr: Virtual magnifying glass

composite_rules:
  - id: recognized-lxpanel-magnifier
    desc: Recognized LXPanel virtual magnifier plugin
    crit: notable
    conf: 0.99
    all:
      - id: lxpanel-gtk-module-export
      - id: mage-rpi-helper-path
      - id: magnifier-ui-label
