defaults:
  platforms: [unix, windows]
  for: [elf, macho]
  crit: baseline
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: elf-go-module-path
    desc: PocketBase Go module identity
    crit: notable
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/pocketbase/pocketbase

  - id: macho-go-module-path
    desc: PocketBase Go module identity
    crit: notable
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/pocketbase/pocketbase

composite_rules:
  - id: pocketbase-binary
    desc: PocketBase Go server binary
    crit: notable
    conf: 0.99
    any:
      - id: elf-go-module-path
      - id: macho-go-module-path
