defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx]
  crit: baseline
  conf: 0.99

traits:
  - id: manifest-name
    desc: Navigate Rewards Chrome extension manifest
    crit: notable
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Navigate Rewards

  - id: reward-description
    desc: Navigate Rewards reward-program description
    crit: component
    for: [chrome-manifest]
    if:
      type: value
      path: description
      exact: Turn Your Web Browsing into Rewards!

composite_rules:
  - id: extension-context
    desc: Recognized Navigate Rewards browser extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: reward-description
