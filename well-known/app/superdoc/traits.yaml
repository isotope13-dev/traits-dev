# SuperDoc's macOS CLI companion wheel.  Its executable is a signed Bun
# runtime, so normal JIT, networking, and process APIs are expected here.
defaults:
  platforms: [macos]
  for: [python, macho, whl, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: SuperDoc wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: superdoc_sdk_cli_darwin_x64

  - id: package-name
    desc: SuperDoc package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: superdoc-sdk-cli-darwin-x64

  - id: cli-basename
    desc: SuperDoc CLI executable basename
    for: [macho]
    if:
      type: basename
      exact: superdoc

  - id: python-wrapper-marker
    desc: SuperDoc CLI Python wrapper marker
    for: [python]
    if:
      type: text
      regex: '_BINARY_NAME\s*=\s*[''\"]superdoc[''\"]'

  - id: sdk-reference
    desc: SuperDoc SDK companion reference
    for: [pkginfo]
    if:
      type: text
      substr: superdoc-sdk

composite_rules:
  - id: package-context
    desc: SuperDoc signed Bun CLI companion
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives, whl]
    all:
      - id: wheel-distribution
      - id: cli-basename
      - id: well-known/lib/bun-runtime::unix-runtime-context
