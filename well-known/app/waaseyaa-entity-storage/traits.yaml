# waaseyaa/entity-storage — Waaseyaa pluggable PHP entity persistence library.
defaults:
  platforms: [unix, windows]
  for: [php, json, markdown, text, archives, zip]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: waaseyaa-entity-storage-archive
    desc: waaseyaa-entity-storage distribution archive
    if:
      type: path
      regex: '(?i)waaseyaa-entity-storage-.*\.zip'

  - id: waaseyaa-entity-storage-composer
    desc: waaseyaa entity-storage Composer package
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"waaseyaa/entity-storage"'

  - id: waaseyaa-entity-storage-namespace
    desc: Waaseyaa EntityStorage PHP namespace
    for: [php]
    crit: notable
    if:
      type: text
      substr: namespace Waaseyaa\EntityStorage

  - id: waaseyaa-sql-entity-storage
    desc: Waaseyaa SqlEntityStorage class marker
    for: [php, markdown]
    crit: notable
    if:
      type: text
      substr: SqlEntityStorage

composite_rules:
  - id: waaseyaa-entity-storage-package
    desc: Waaseyaa entity persistence PHP library
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives, zip]
    any:
      - id: waaseyaa-entity-storage-archive
      - id: waaseyaa-entity-storage-composer
      - id: waaseyaa-entity-storage-namespace
      - id: waaseyaa-sql-entity-storage
