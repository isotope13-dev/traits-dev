# fastgear — FastAPI utility library (hmarcuzzo/fastgear).
defaults:
  platforms: [unix, windows]
  for: [python, whl, tar, egg]
  crit: baseline
  conf: 0.98

traits:
  - id: fastgear-package-name
    desc: fastgear Python package name
    if:
      type: text
      regex: '(?i)\bfastgear\b'

  - id: fastgear-module-path
    desc: fastgear Python module tree path
    if:
      type: path
      regex: '(^|/)fastgear/'

  - id: fastgear-github-marker
    desc: fastgear GitHub repository marker
    if:
      type: text
      substr: github.com/hmarcuzzo/fastgear

  - id: fastgear-fastapi-marker
    desc: fastgear FastAPI utility library marker
    if:
      type: text
      regex: '(?i)FastGear|fastgear.{0,40}FastAPI|streamline.{0,40}backend development with FastAPI'

composite_rules:
  - id: fastgear-python-library
    desc: fastgear FastAPI utility library
    crit: notable
    conf: 0.98
    all:
      - id: fastgear-package-name
    any:
      - id: fastgear-module-path
      - id: fastgear-github-marker
      - id: fastgear-fastapi-marker
