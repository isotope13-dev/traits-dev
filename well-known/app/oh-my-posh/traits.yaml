# oh-my-posh — cross-shell prompt theme engine (jandedobbeleer), distributed
# as a single static Go binary through conda-forge, Homebrew, winget and
# scoop. Its prompt segments read the environment they render: the active
# Docker context, kubeconfig, cloud profiles, git state and shell history all
# turn into path and credential-file references inside one binary, which is
# the identity worth naming before those references are read as collection.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  # Go build info sits under a container-specific value prefix, so the module
  # identity needs one trait per binary format.
  - id: oh-my-posh-go-module-elf
    desc: oh-my-posh Go module identity
    for: [elf, go]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/jandedobbeleer/oh-my-posh/src

  - id: oh-my-posh-go-module-macho
    desc: oh-my-posh Go module identity
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/jandedobbeleer/oh-my-posh/src

  - id: oh-my-posh-go-module-pe
    desc: oh-my-posh Go module identity
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/jandedobbeleer/oh-my-posh/src

  # Survives a stripped build: the package paths are compiled into the symbol
  # and type names of every segment.
  - id: oh-my-posh-package-path
    desc: oh-my-posh package import path
    if:
      type: text
      substr: github.com/jandedobbeleer/oh-my-posh/src/
