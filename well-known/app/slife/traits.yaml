defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Slife Python package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: slife

  - id: repository
    desc: Slife upstream repository marker
    for: [pkginfo, markdown, text]
    if:
      type: text
      substr: github.com/juzcn/slife

  - id: terminal-agent-description
    desc: Slife terminal AI-agent description
    for: [pkginfo, markdown, text]
    if:
      type: text
      regex: '(?i)terminal-based AI agent.{0,120}(function-calling|MCP|tools)'

  - id: slife-mcp-runtime
    desc: Slife MCP runtime marker
    for: [python]
    if:
      type: text
      regex: 'slife\.(mcp|plugins\.mcp)'

composite_rules:
  - id: terminal-agent-context
    desc: Slife terminal AI-agent application
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: repository
      - id: terminal-agent-description
