# rqmd — ryeleo Requirements Driven Development CLI (Python wheel).
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: rqmd-wheel-name
    desc: rqmd Python wheel archive name
    if:
      type: path
      regex: '(?i)rqmd-.*\.whl$'

  - id: rqmd-package-name
    desc: rqmd Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*rqmd\s*$'

  - id: rqmd-rdd-marker
    desc: Requirements Driven Development marker
    for: [python, markdown]
    crit: notable
    if:
      type: text
      substr: Requirements Driven Development

composite_rules:
  - id: rqmd-python-package
    desc: rqmd requirements markdown CLI toolkit
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: rqmd-wheel-name
      - id: rqmd-package-name
      - id: rqmd-rdd-marker
