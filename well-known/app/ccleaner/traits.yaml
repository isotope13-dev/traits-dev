defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 300000000

traits:
  - id: ccleaner-product
    desc: CCleaner PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: CCleaner

  - id: ccleaner-self-extract-description
    desc: CCleaner self-extract package description
    if:
      type: value
      path: pe.version.description
      exact: CCleaner Self-Extract Package

  - id: ccleaner-icarus-sfx-original-filename
    desc: CCleaner icarus_sfx original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^icarus_sfx\.exe$'

  - id: ccleaner-icarus-sfx-pdb
    desc: CCleaner icarus_sfx PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[/\\])icarus_sfx\.pdb$'

composite_rules:
  - id: ccleaner-icarus-sfx-context
    desc: Signed CCleaner Icarus SFX identity
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signed/leaf::gen-digital-inc.
      - id: ccleaner-icarus-sfx-original-filename
      - id: ccleaner-icarus-sfx-pdb

  - id: ccleaner-offline-installer-identity
    desc: Gen Digital CCleaner offline installer identity
    crit: notable
    conf: 0.99
    all:
      - id: ccleaner-product
      - id: ccleaner-self-extract-description
    any:
      - id: ccleaner-icarus-sfx-original-filename
      - id: ccleaner-icarus-sfx-pdb

  - id: ccleaner-offline-installer
    desc: Verified Gen Digital CCleaner offline installer
    crit: exception
    conf: 0.99
    all:
      - id: metadata/signed/leaf::gen-digital-inc.
      - id: ccleaner-offline-installer-identity
