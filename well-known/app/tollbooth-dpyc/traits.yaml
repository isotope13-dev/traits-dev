# tollbooth-dpyc — Bitcoin Lightning micropayments for MCP servers (Lonnie VanZandt).
defaults:
  platforms: [unix, windows]
  for: [python, whl, tar, egg]
  crit: baseline
  conf: 0.98

traits:
  - id: tollbooth-package-name
    desc: tollbooth-dpyc Python package name
    if:
      type: text
      regex: '(?i)\btollbooth[-_]dpyc\b'

  - id: tollbooth-module-path
    desc: tollbooth Python module tree path
    if:
      type: path
      regex: '(^|/)tollbooth/'

  - id: tollbooth-github-marker
    desc: tollbooth-dpyc GitHub repository marker
    if:
      type: text
      substr: lonniev/tollbooth-dpyc

  - id: tollbooth-lightning-marker
    desc: Tollbooth Lightning micropayment marker
    if:
      type: text
      regex: '(?i)Lightning micropayments? for MCP'

composite_rules:
  - id: tollbooth-dpyc-library
    desc: tollbooth-dpyc Lightning MCP payment library
    crit: notable
    conf: 0.98
    all:
      - id: tollbooth-package-name
    any:
      - id: tollbooth-module-path
      - id: tollbooth-github-marker
      - id: tollbooth-lightning-marker
