defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl]

traits:
  - id: package-name
    desc: Open Codex UI Python package name
    crit: notable
    conf: 1.0
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: open-codex-ui

  - id: wheel-distribution
    desc: Open Codex UI wheel identity
    crit: notable
    conf: 1.0
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: open_codex_ui

composite_rules:
  - id: open-codex-ui-package
    desc: Recognized Open Codex UI package
    crit: notable
    conf: 1.0
    any:
      - id: package-name
      - id: wheel-distribution
