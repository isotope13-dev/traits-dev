# Gladbot is a game-automation extension for Gladiatus.  Its login-link hook
# uses the current Gameforge session to switch between the user's own game
# accounts; it is not a general browser-session stealer.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Gladbot game automation extension name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Gladiatus Bot - Gladbot

  - id: gameforge-host-permission
    desc: Gladbot Gameforge host permission
    for: [chrome-manifest]
    if:
      type: value
      path: host_permissions
      regex: 'gameforge\.com'

  - id: license-service-host
    desc: Gladbot license validation service host
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https://(glad|gladbot)\.fociisoftware\.com\b'

composite_rules:
  - id: licensed-game-bot-context
    desc: Gladbot licensed Gameforge automation context
    crit: exception
    conf: 0.99
    for: [crx, archives]
    scope: archive
    all:
      - id: manifest-name
      - id: gameforge-host-permission
      - id: license-service-host
