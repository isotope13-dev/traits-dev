# pawnpro — NullSablex Pawn/SA-MP/open.mp VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: pawnpro-vsix-name
    desc: PawnPro VSIX archive name
    if:
      type: path
      regex: '(?i)NullSablex\.pawnpro'

  - id: pawnpro-package-name
    desc: PawnPro extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"pawnpro"'

  - id: pawnpro-publisher
    desc: NullSablex VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"NullSablex"'

  - id: pawnpro-command-namespace
    desc: PawnPro command namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: pawnpro.

composite_rules:
  - id: pawnpro-vscode-extension
    desc: PawnPro SA-MP/open.mp VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: pawnpro-publisher
    any:
      - id: pawnpro-vsix-name
      - id: pawnpro-package-name
      - id: pawnpro-command-namespace
