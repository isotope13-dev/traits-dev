defaults:
  platforms: [unix, windows]
  for: [archives, source]
  size_max: 500000000

traits:
  - id: mozc-source-archive
    desc: Mozc source archive context
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)mozc_[0-9][^\\/]*\.orig\.tar\.xz'
  - id: mozc-source-member
    desc: Mozc source archive member context
    crit: notable
    conf: 0.99
    for: [source]
    if:
      type: path
      regex: '(?i)mozc-[0-9]'
