defaults:
  platforms: [unix, windows]

traits:
  - id: seed-fixture-tree
    desc: Moonshiner seed-fixture tree member
    crit: notable
    conf: 0.99
    # Seed fixtures ship shell/PowerShell/PE/nupkg/JSON task curricula used to
    # train coding agents; match any file under the bundled seed tree.
    for: [powershell, shell, pe, dll, nupkg, json, python, text, binaries, scripts, source]
    size_min: 100
    size_max: 100000000
    if:
      type: path
      regex: 'moonshiner_app'
