# suparkanbun — Koichi Yasuoka Classical Chinese NLP wheel.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown, json]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: suparkanbun-wheel-name
    desc: suparkanbun Python wheel archive name
    if:
      type: path
      regex: '(?i)suparkanbun-.*\.whl$'

  - id: suparkanbun-package-name
    desc: suparkanbun Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*suparkanbun\s*$'

  - id: suparkanbun-language-marker
    desc: SuParKanbunLanguage spaCy component
    for: [python]
    crit: notable
    if:
      type: text
      substr: SuParKanbunLanguage

composite_rules:
  - id: suparkanbun-python-package
    desc: SuPar-Kanbun Classical Chinese NLP wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: suparkanbun-wheel-name
      - id: suparkanbun-package-name
      - id: suparkanbun-language-marker
