defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text, package.json, xml]
  crit: notable
  conf: 0.95

traits:
  - id: bangumi-product-name
    desc: Bangumi third-party client product name
    if:
      type: text
      regex: '(?i)\bBangumi\b'

  - id: bangumi-github-repo
    desc: czy0729/Bangumi repository reference
    conf: 0.99
    if:
      type: text
      substr: github.com/czy0729/Bangumi

  - id: bangumi-android-application-id
    desc: Bangumi Android applicationId
    conf: 0.99
    for: [text, xml]
    if:
      type: text
      substr: com.czy0729.bangumi

  - id: bangumi-pro-package-name
    desc: bangumi-pro npm package name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: bangumi-pro

composite_rules:
  - id: bangumi-client-identity
    desc: czy0729 Bangumi React Native client identity
    conf: 0.97
    any:
      - id: bangumi-github-repo
      - id: bangumi-pro-package-name
      - id: bangumi-android-application-id
