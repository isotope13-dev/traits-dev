# The published claude-remote-agent package is the documented client for the
# Claude Remote open-source project.  Its remote PTY and transcript features
# are intentional product behavior; keep this identity context narrow so the
# generic remote-agent objectives still detect lookalike packages.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: claude-remote-package-name
    desc: Claude Remote agent package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: claude-remote-agent

  - id: claude-remote-repository
    desc: Claude Remote project repository
    crit: notable
    conf: 0.99
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/AlehPishchykau/claude-remote(\.git)?$'

composite_rules:
  - id: claude-remote-known-app-context
    desc: Recognized Claude Remote agent package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: claude-remote-package-name
      - id: claude-remote-repository
