# RequestFlow — miguelmatg's VS Code API client for .http files, MQTT, and WebSocket.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: requestflow-vsix-name
    desc: RequestFlow VSIX archive name
    if:
      type: path
      regex: '(?i)requestflow\.requestflow'

  - id: requestflow-package-name
    desc: RequestFlow extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"requestflow"'

  - id: requestflow-publisher
    desc: requestflow VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"requestflow"'

  - id: requestflow-http-file-marker
    desc: RequestFlow native .http file workflow marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      regex: '(?i)requestflow\.sendInline|source\.http\.requestflow|\.requestsflow'

composite_rules:
  - id: requestflow-vscode-extension
    desc: RequestFlow API testing VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: requestflow-publisher
    any:
      - id: requestflow-vsix-name
      - id: requestflow-package-name
      - id: requestflow-http-file-marker
