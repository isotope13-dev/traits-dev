# Keeper Commander — official Keeper Security vault CLI and PAM tooling.
defaults:
  platforms: [unix, windows]
  for: [python, pyc, whl, archives]
  crit: notable
  conf: 0.98

traits:
  - id: source-header
    desc: Keeper Commander source header
    if:
      type: text
      substr: "# Keeper Commander"

  - id: package-module-path
    desc: Keeper Commander package module path
    if:
      type: path
      regex: '(?i)(^|[/\\])keepercommander([/\\]|$)'

  - id: keeper-security-github
    desc: Keeper Security Commander GitHub repo
    if:
      type: text
      substr: github.com/Keeper-Security/Commander

composite_rules:
  - id: official-package-source
    desc: Keeper Commander package source
    crit: notable
    conf: 0.99
    all:
      - id: source-header
      - id: package-module-path

  - id: keepercommander-package-context
    desc: Recognized Keeper Security Commander package
    crit: exception
    conf: 0.99
    scope: archive
    for: [archives, whl]
    all:
      - id: package-module-path
    any:
      - id: source-header
      - id: keeper-security-github
