# Apache OpenOffice / LibreOffice — the office suite itself and the third-party
# launchers built around it. The suite is Apache-2.0 licensed, so redistributed
# and rebranded builds are common and an analyst usually wants to know which of
# the two a binary is before judging the behaviour around it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 16384
  size_max: 52428800

traits:
  # Top-level window class registered by the suite's own VCL toolkit (the
  # StarView "SAL" layer). Present in the suite and in anything that goes
  # looking for its windows.
  - id: salframe-window-class
    desc: OpenOffice SALFRAME window class name
    conf: 0.9
    if:
      type: text
      exact: SALFRAME
      section: text

  - id: apache-openoffice-product-name
    desc: Apache OpenOffice product name string
    if:
      type: text
      exact: Apache OpenOffice
      section: text

  - id: openoffice-calc-executable-name
    desc: OpenOffice Calc scalc.exe program name
    conf: 0.9
    if:
      type: text
      exact: scalc.exe
      section: text

composite_rules:
  # A program that has no OpenOffice code of its own but starts the suite's
  # Calc binary and then goes hunting for its window class. That is the shape
  # of an external launcher/skin wrapped around the suite, not the suite.
  - id: openoffice-external-launcher
    desc: External launcher driving OpenOffice Calc
    crit: notable
    conf: 0.93
    size_max: 8388608
    all:
      - id: openoffice-calc-executable-name
      - id: salframe-window-class
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: micro-behaviors/ui/window/manage/control::find-window-ex
