# @datarails-ai/dr-cli — first-party Datarails tenant CLI. Bundled agent skills,
# documented Windows installer (drcli.datarails.com), and postinstall skill/MCP
# wiring are disclosed product setup, not trojanized agent-skill instructions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Datarails dr-cli npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@datarails-ai/dr-cli'

  - id: dr-cli-installer-host
    desc: Datarails dr-cli official installer host path
    for: [markdown]
    if:
      type: text
      substr: drcli.datarails.com/cli/install

composite_rules:
  - id: archive-context
    desc: Datarails dr-cli documented install and skill bundle context
    crit: exception
    conf: 0.995
    scope: archive
    all:
      - id: package-name
      - id: dr-cli-installer-host
