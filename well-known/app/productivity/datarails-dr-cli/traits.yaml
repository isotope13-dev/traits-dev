defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - markdown
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: Datarails dr-cli npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@datarails-ai/dr-cli'
- id: dr-cli-installer-host
  desc: Datarails dr-cli official installer host path
  for:
  - markdown
  if:
    type: text
    substr: drcli.datarails.com/cli/install
