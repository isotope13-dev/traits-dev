# Jitbit Macro Recorder compiles user-authored macros into an unsigned .NET
# playback template. The runtime legitimately includes screenshot matching,
# input synthesis, process launch, Windows hooks, and C# macro compilation.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 131072

traits:
  - id: company-identity
    desc: Jitbit Macro Recorder PE company identity
    if:
      type: value
      path: pe.version.company
      exact: Jitbit Macro Recorder

  - id: product-identity
    desc: Jitbit Macro Recorder PE product identity
    if:
      type: value
      path: pe.version.product_name
      exact: MacroRecorder

  - id: compiled-template-identity
    desc: Jitbit compiled macro template filename
    if:
      type: value
      path: pe.version.original_filename
      exact: ExeTemplate.exe

composite_rules:
  - id: known-binary-context
    desc: Recognized Jitbit Macro Recorder compiled macro
    crit: exception
    conf: 0.99
    all:
      - id: company-identity
      - id: product-identity
      - id: compiled-template-identity
