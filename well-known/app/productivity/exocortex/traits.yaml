# Official @kitelev/exocortex-cli — Obsidian/SPARQL knowledge-management CLI.
# Ships optional ai-task-{runner,worker} helpers that invoke Claude with
# --dangerously-skip-permissions for vault-delegated tasks. That pattern is
# intentional product automation, not a supply-chain implant.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: kitelev-exocortex-cli-package-name
    desc: kitelev Exocortex CLI package name
    if:
      type: value
      path: name
      exact: "@kitelev/exocortex-cli"

  - id: kitelev-exocortex-github-repo
    desc: kitelev Exocortex GitHub repository URL
    if:
      type: value
      path: repository.url
      regex: 'github\.com[/:]kitelev/exocortex(\.git)?/?$'
      case_insensitive: true

composite_rules:
  - id: kitelev-exocortex-cli-context
    desc: Official kitelev Exocortex CLI package
    crit: exception
    conf: 0.99
    all:
      - id: kitelev-exocortex-cli-package-name
      - id: kitelev-exocortex-github-repo
