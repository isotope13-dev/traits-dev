# DocSlicer (Market Framer) is a hierarchical document parser/chunker that
# optionally scrapes HTML via Playwright. Its bundled stealth_init.js masks
# navigator.webdriver for that scraper path — package identity explains it.
defaults:
  platforms: [linux, macos, windows]
  for: [pkginfo, python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: DocSlicer PyPI package identity
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: docslicer

  - id: project-repository
    desc: DocSlicer project repository URL
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: github.com/DocSlicer/DocSlicer

  - id: source-tree-path
    desc: DocSlicer Python source-tree path
    for: [python, javascript]
    if:
      type: path
      regex: '(^|[\\/])docslicer[\\/]'

  # Same-leaf suppressor for the Playwright stealth helper (ethan-style path
  # unless). Keep ≤2 '/' separators (qual/path-brittle).
  - id: stealth-init-script
    desc: DocSlicer Playwright stealth init script
    for: [javascript]
    if:
      type: path
      regex: '(?i)docslicer.{0,32}stealth_init\.js$'

composite_rules:
  - id: playwright-stealth-context
    desc: DocSlicer Playwright scraper stealth context
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: source-tree-path
      - id: stealth-init-script
