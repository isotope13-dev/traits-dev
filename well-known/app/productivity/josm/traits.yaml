defaults:
  platforms: [unix, windows]
  for: [jar]
  crit: notable
  conf: 0.99

traits:
  - id: application-name
    desc: JOSM Java OpenStreetMap Editor manifest name
    if:
      type: value
      path: jar.manifest.application_name
      exact: JOSM - Java OpenStreetMap Editor

  - id: main-class
    desc: JOSM Java editor application entry point
    if:
      type: value
      path: jar.manifest.main_class
      exact: org.openstreetmap.josm.gui.MainApplication

  - id: website-codebase
    desc: JOSM official codebase manifest marker
    if:
      type: value
      path: jar.manifest.codebase
      exact: josm.openstreetmap.de

composite_rules:
  - id: application-identity
    desc: JOSM identity with signature artifacts
    all:
      - id: application-name
      - id: main-class
      - id: website-codebase
      - id: metadata/signed/trust-level::jar-signature-artifacts
