# Eqnedit64 is Sugahara Laboratory's TeX Equation Editor for Windows.
# Its editor copies equations to the Windows clipboard in various formats
# (Office, PowerPoint, Google Slides, PNG, MathML, EMF).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  - id: eqnedit64-company
    desc: Eqnedit64 Sugahara Laboratory publisher metadata
    if:
      type: value
      path: pe.version.company
      exact: Sugahara Laboratory

  - id: eqnedit64-product
    desc: Eqnedit64 product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Eqnedit64

  - id: eqnedit64-description
    desc: Eqnedit64 TeX Equation Editor description
    if:
      type: value
      path: pe.version.description
      exact: Eqnedit64 - TeX Equation Editor

composite_rules:
  - id: eqnedit64-editor
    desc: Sugahara Laboratory Eqnedit64 TeX Equation Editor
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: eqnedit64-company
      - id: eqnedit64-product
      - id: eqnedit64-description
