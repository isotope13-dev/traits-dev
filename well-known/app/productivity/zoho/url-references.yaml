defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: zoho-service-url
  desc: Zoho service URL reference
  for:
  - documents
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - java
  - kotlin
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: https?://(www\.)?(zohoapis|workdrive\.zoho|accounts\.zoho)\.[a-z]{2,3}(\.[a-z]{2})?/
- id: zoho-service-host-reference
  desc: Zoho service hostname reference
  for:
  - documents
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - java
  - kotlin
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)(^|[^\w.-])(zohoapis|(workdrive|accounts)\.zoho)\.[a-z]{2,3}(\.[a-z]{2})?([^\w.-]|$)
- id: zoho-oauth-token-url
  desc: Zoho OAuth token endpoint
  for:
  - documents
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - java
  - kotlin
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)(^|[^\w.-])accounts\.zoho\.[a-z]{2,3}(\.[a-z]{2})?/oauth/v2/token\b
- id: workdrive-zoho-host-url
  desc: Zoho WorkDrive host URL reference
  for: [documents, binaries, '!dex', scripts, '!jcl', java, kotlin]
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'https?://workdrive\.zoho\.(com|eu|in|jp|ca|sa|com\.[a-z]{2})/'
- id: workdrive-zoho-api-url
  desc: Zoho API URL with WorkDrive path
  for: [documents, binaries, '!dex', scripts, '!jcl', java, kotlin]
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'https?://([a-z0-9-]+\.)?zohoapis\.(com|eu|in|jp|ca|sa|com\.[a-z]{2})/workdrive/'

composite_rules:
- id: zoho-workdrive-url
  desc: Zoho WorkDrive service URL reference
  for: [documents, binaries, '!dex', scripts, '!jcl', java, kotlin]
  crit: notable
  conf: 0.92
  any:
  - id: workdrive-zoho-host-url
  - id: workdrive-zoho-api-url
