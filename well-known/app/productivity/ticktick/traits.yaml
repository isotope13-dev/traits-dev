# TickTick — Popular task management and to-do application for Android.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98

traits:
  - id: ticktick-application-class
    desc: TickTick application class in DEX
    if:
      type: text
      substr: "Lcom/ticktick/task/TickTickApplication"

  - id: ticktick-package-name
    desc: TickTick package name
    if:
      type: text
      substr: com.ticktick.task

composite_rules:
  - id: ticktick-dex-identity
    desc: TickTick application identity in DEX
    crit: notable
    conf: 0.99
    all:
      - id: ticktick-application-class
      - id: ticktick-package-name
