# SPKL-style Indonesian attendance / marketing macro workbooks.
# Legitimate encrypted legacy Excel tools for roster printing and data entry.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.96

traits:
  - id: cetak-presensi-macro
    desc: Indonesian attendance print macro name
    if:
      type: raw
      regex: 'Cetak[\s\S]{0,3}Presensi'

  - id: copy-data-input-macro
    desc: SPKL attendance data copy macro name
    if:
      type: raw
      regex: 'Copy[\s\S]{0,3}data[\s\S]{0,3}input'

  - id: spkl-form-marker
    desc: SPKL form worksheet marker
    if:
      type: raw
      regex: '(?i)Form[\s\S]{0,3}SPKL'

composite_rules:
  - id: spkl-attendance-macro-workbook
    desc: SPKL attendance printing macro workbook
    crit: notable
    conf: 0.98
    all:
      - id: metadata/document/office/macro::legacy-excel-vba-document
      - id: cetak-presensi-macro
    any:
      - id: copy-data-input-macro
      - id: spkl-form-marker
