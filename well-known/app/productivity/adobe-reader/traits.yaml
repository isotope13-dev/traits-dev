defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96
  size_min: 4096
  size_max: 524288000

traits:
  - id: wow-helper-filename-reference
    desc: Adobe Reader wow_helper.exe filename reference
    if:
      type: text
      exact: wow_helper.exe
      section: .rsrc

  - id: wow-helper-product-name
    desc: Adobe Reader WOW Helper product name
    if:
      type: text
      exact: Adobe Reader WOW Helper
      section: .rsrc

  - id: chrome-wow-helper-pdb-reference
    desc: Adobe Reader Chrome WOW helper PDB reference
    if:
      type: text
      substr: chrome_wow_helper.pdb
      section: .rdata

  - id: fulltrust-notifier-pdb-reference
    desc: Adobe Reader FullTrustNotifier PDB reference
    if:
      type: text
      substr: FullTrustNotifier.pdb
      section: .rdata

  - id: notification-service-identifier
    desc: Adobe Reader notification service identifier
    if:
      type: text
      exact: com.adobe.NotificationService
      section: .rdata

  - id: acrobroker-pdb-reference
    desc: Adobe AcroBroker debug database filename
    if:
      type: text
      exact: AcroBroker.pdb
      section: .rdata

  - id: acrobroker-write-warning
    desc: Adobe AcroBroker write warning message
    if:
      type: text
      exact: "AcroBroker: Unexpected Write Warning!!"
      section: .rdata

  - id: acrobat-security-registry-path
    desc: Adobe Acrobat security registry path
    if:
      type: text
      exact: Software\Adobe\Adobe Acrobat\11.0\Security
      section: .rdata

  - id: reader-featurelockdown-registry-path
    desc: Adobe Reader FeatureLockDown registry path
    if:
      type: text
      exact: SOFTWARE\Policies\Adobe\Acrobat Reader\11.0\FeatureLockDown
      section: .rdata

composite_rules:
  - id: wow-helper-identity
    desc: Adobe Reader WOW Helper identity
    crit: notable
    conf: 0.99
    all:
      - id: wow-helper-filename-reference
      - id: wow-helper-product-name
      - id: chrome-wow-helper-pdb-reference

  - id: acrobroker-mail-policy-profile
    desc: Adobe AcroBroker mail and preference-storage profile
    crit: notable
    conf: 0.99
    all:
      - id: acrobroker-pdb-reference
    any:
      - id: acrobroker-write-warning
      - id: acrobat-security-registry-path
      - id: reader-featurelockdown-registry-path
      - id: micro-behaviors/communications/email/send/mapi::extended-mapi-session
      - id: micro-behaviors/data/db/sqlite::pref-events-schema-statements
    needs: 3
