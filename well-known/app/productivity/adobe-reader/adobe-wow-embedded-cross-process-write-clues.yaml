# Embedded PE, product-name and API combinations; no linked payload is required.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: adobe-wow-embedded-cross-process-write-clues
  desc: Adobe WOW helper and cross-process write clues
  crit: suspicious
  conf: 0.99
  scope: outer
  all:
  - id: metadata/vendor/string::adobe-systems-inc-marker
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: well-known/app/productivity/adobe-reader::chrome-wow-helper-pdb-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex
  - id: well-known/lib/runtime/managed/jvm::windows-jjs-original-filename
  - id: well-known/app/productivity/adobe-reader::fulltrust-notifier-pdb-reference
  needs: 1
