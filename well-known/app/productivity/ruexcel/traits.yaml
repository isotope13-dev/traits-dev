# RuExcel is a rebranded OpenOffice-compatible spreadsheet application.  Its
# small Manager executable launches Calc and changes the suite window title;
# the complete product and publisher identity distinguish that normal
# wrapper behavior from an unrelated masquerading launcher.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 8388608

traits:
  - id: ruexcel-product-name
    desc: RuExcel product name string
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: RuExcel
      section: text

  - id: ruexcel-archive-manager-member
    desc: RuExcel portable archive Manager launcher member
    crit: notable
    conf: 0.98
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      exact: Manager.exe

  - id: ruexcel-product-metadata
    desc: RuExcel PE product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '^\s*RuExcel\s*$'

  - id: ruexcel-authenticode-signer
    desc: RuExcel Authenticode subject identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      exact: 'CN=IP  Dekanov Dmitry Andreevich,O=IP  Dekanov Dmitry Andreevich,L=Moscow,ST=Moscow,C=RU'

composite_rules:
  - id: ruexcel-publisher-identity
    desc: RuExcel verified Authenticode publisher identity
    crit: notable
    conf: 0.99
    all:
      - id: ruexcel-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: ruexcel-inno-uninstaller
    desc: RuExcel Inno Setup uninstaller
    crit: notable
    conf: 0.99
    all:
      - id: ruexcel-product-metadata
      - id: metadata/binary/installer/family::inno-uninstaller-runtime

  - id: ruexcel-openoffice-wrapper
    desc: Verified RuExcel OpenOffice-compatible wrapper
    crit: exception
    conf: 0.99
    all:
      - id: ruexcel-product-name
      - id: ruexcel-publisher-identity
      - id: well-known/app/productivity/openoffice::openoffice-external-launcher
      - id: well-known/app/productivity/openoffice::apache-openoffice-product-name

  - id: ruexcel-inno-installer-archive
    desc: RuExcel Inno Setup installer archive
    crit: exception
    conf: 0.99
    for: [zip]
    scope: archive
    all:
      - id: ruexcel-archive-manager-member
      - id: metadata/build/archive::archive-unins-executable-member
      - id: ruexcel-authenticode-signer
    any:
      - id: ruexcel-product-name
      - id: ruexcel-product-metadata
