# Contextures Excel samples (Debra Dalgleish / Ron Coderre). This workbook
# inserts a local picture when a dropdown cell changes; the VBA is a
# published helper, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [oledoc]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 50000000

traits:
  # OleDoc analysis leaves the extracted-string index empty, so type:text
  # never sees these VBA strings. type:raw is rejected for plain ASCII by
  # policy. Hex matches the same ASCII run in the compound-file bytes.
  - id: download-comment
    desc: Contextures.com sample download comment
    if:
      type: hex
      pattern: "44 6F 77 6E 6C 6F 61 64 65 64 20 66 72 6F 6D 20 77 77 77 2E 63 6F 6E 74 65 78 74 75 72 65 73 2E 63 6F 6D"

  - id: insert-pic-from-file
    desc: InsertPicFromFile VBA helper name
    if:
      type: hex
      pattern: "49 6E 73 65 72 74 50 69 63 46 72 6F 6D 46 69 6C 65"

  - id: ron-coderre-creator
    desc: Ron Coderre workbook creator name
    if:
      type: value
      path: office.creator
      exact: Ron Coderre

  - id: debra-dalgleish-editor
    desc: Debra Dalgleish last author name
    if:
      type: value
      path: office.last_modified_by
      exact: Debra Dalgleish

composite_rules:
  - id: contextures-excel-sample
    desc: Recognized Contextures Excel sample workbook
    needs: 2
    any:
      - id: download-comment
      - id: insert-pic-from-file
      - id: ron-coderre-creator
      - id: debra-dalgleish-editor
