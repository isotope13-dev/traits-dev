defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: nextcloud-ocs-app-api-path
    size_min: 1
    desc: Nextcloud OCS app API path
    if:
      type: text
      regex: '(?i)/ocs/v[0-9][a-z.]{0,4}/apps/[a-z_-]{2,20}/api/v[0-9]'

  # Nextcloud frontend spelling of the same routes: client code calls
  # generateOcsUrl('/apps/<app>/api/v<n>/...') and the /ocs/v2.php prefix is
  # prepended at runtime, so the OCS literal above never appears. The Talk
  # (spreed) app id is fixed, so its frontend routes are recognisable.
