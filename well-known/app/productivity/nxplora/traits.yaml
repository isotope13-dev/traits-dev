# nxplora (PyPI) — Nexplora "NX" terminal operator CLI. Generated compute
# tools run behind an AST gate plus macOS sandbox-exec that *denies* reads of
# ~/.ssh ~/.aws and similar; MCP catalog entries name env vars such as
# N8N_API_KEY for the operator's own n8n-mcp install. Neither is theft.
defaults:
  platforms: [unix]
  for: [python, text, scripts, source, whl, pkginfo, json]
  crit: notable
  conf: 0.98

traits:
  - id: package-tree-member
    desc: nxplora distribution or NX module path
    conf: 0.99
    if:
      type: path
      regex: '(?i)nxplora|nx_tool_sandbox\.py'

  - id: sandbox-secret-denylist
    desc: NX compute-tool sandbox denies home secret trees
    for: [python, scripts, source, text]
    conf: 0.99
    if:
      type: text
      substr: 'nx_tool_sandbox — structural, subprocess-isolated execution'

  - id: n8n-mcp-catalog-entry
    desc: NX MCP catalog n8n-mcp env key entry
    for: [scripts, json, python, text]
    conf: 0.99
    if:
      type: text
      substr: 'npx -y n8n-mcp'

composite_rules:
  - id: compute-sandbox-context
    desc: NX generated-tool sandbox that blocks credential file reads
    crit: exception
    conf: 0.99
    all:
      - id: package-tree-member
      - id: sandbox-secret-denylist
