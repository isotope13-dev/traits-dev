defaults:
  platforms:
  - unix
  for:
  - python
  - text
  - scripts
  - source
  - whl
  - pkginfo
  - json
  crit: notable
  conf: 0.98
traits:
- id: package-tree-member
  desc: nxplora distribution or NX module path
  conf: 0.99
  if:
    type: path
    regex: (?i)nxplora|nx_tool_sandbox\.py
- id: sandbox-secret-denylist
  desc: NX compute-tool sandbox denies home secret trees
  for:
  - python
  - scripts
  - source
  - text
  conf: 0.99
  if:
    type: text
    substr: nx_tool_sandbox — structural, subprocess-isolated execution
- id: n8n-mcp-catalog-entry
  desc: NX MCP catalog n8n-mcp env key entry
  for:
  - scripts
  - json
  - python
  - text
  conf: 0.99
  if:
    type: text
    substr: npx -y n8n-mcp
