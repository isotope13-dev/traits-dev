# Enron corpus financial workbooks (including Enron Broadband / EBSCS).
# OLE creator metadata identifies the analyst's workbooks; the
# document-security flag is ordinary workbook protection.
defaults:
  platforms: [unix, windows]
  for: [oledoc]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 50000000

traits:
  - id: creator
    desc: Enron Broadband workbook creator
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: renee_stlouis

  - id: last-modified-by
    desc: Enron Broadband last-modified-by name
    conf: 0.97
    if:
      type: value
      path: office.last_modified_by
      exact: renee_stlouis

  - id: creator-cara-semperger
    desc: Enron workbook creator Cara Semperger
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: Cara Semperger

  - id: creator-greg-elliott
    desc: Enron workbook creator Greg Elliott
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: Greg Elliott

  - id: creator-jwebb
    desc: Enron workbook creator jwebb
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: jwebb

  - id: last-modified-by-jwebb
    desc: Enron workbook last-modified-by jwebb
    conf: 0.97
    if:
      type: value
      path: office.last_modified_by
      exact: jwebb
