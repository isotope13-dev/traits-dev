defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: onepassword-runtime-path
    desc: 1Password packaged runtime path
    for: [tar, elf, data]
    size_min: 1000
    size_max: 500000000
    if:
      type: basename
      regex: '(?i)^1password-[0-9]'

  - id: onepassword-runtime-marker
    desc: 1Password application runtime marker
    for: [binaries, data]
    size_min: 100000
    size_max: 500000000
    if:
      type: text
      regex: '(?i)(1Password for Linux|@ext\.agilebits\.com)'

  - id: onepassword-source-package
    desc: Official 1Password Linux package source
    for: [text, shell, archives]
    if:
      type: text
      substr: downloads.1password.com/linux/tar/

  - id: onepassword-native-module-name
    desc: 1Password native module filename
    for: [elf, data]
    size_min: 100000
    size_max: 500000000
    if:
      type: basename
      exact: index.node
      case_insensitive: true

  - id: onepassword-sdk-wheel-package-name
    desc: 1Password Python SDK wheel package name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: onepassword-sdk

  - id: onepassword-sdk-github-homepage
    desc: Official 1Password Python SDK homepage
    for: [pkginfo, whl, python, text]
    if:
      type: value
      path: home-page
      regex: '(?i)github\.com/1Password/onepassword-sdk-python'

  - id: onepassword-sdk-ipc-library-name
    desc: 1Password SDK desktop IPC client library name
    for: [python]
    if:
      type: text
      substr: op_sdk_ipc_client

  - id: onepassword-sdk-desktop-lib-resolver
    desc: 1Password SDK desktop library path resolver
    for: [python]
    if:
      type: text
      substr: def find_1password_lib_path

composite_rules:
  - id: onepassword-runtime-context
    desc: Recognized 1Password packaged runtime context
    crit: exception
    conf: 0.99
    for: [tar, elf, data]
    scope: archive
    all:
      - id: onepassword-runtime-path
      - id: onepassword-runtime-marker

  - id: onepassword-native-module-context
    desc: Recognized 1Password native module context
    crit: exception
    conf: 0.99
    for: [elf, data]
    all:
      - id: onepassword-native-module-name
      - id: onepassword-runtime-marker

  - id: onepassword-sdk-context
    desc: Recognized 1Password Python SDK context
    crit: exception
    conf: 0.99
    for: [whl, python]
    scope: archive
    needs: 2
    any:
      - id: onepassword-sdk-wheel-package-name
      - id: onepassword-sdk-github-homepage
      - id: onepassword-sdk-ipc-library-name

  - id: onepassword-sdk-desktop-ipc-context
    desc: 1Password SDK desktop IPC client loader
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: onepassword-sdk-ipc-library-name
      - id: onepassword-sdk-desktop-lib-resolver
