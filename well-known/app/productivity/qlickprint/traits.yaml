defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]
  size_max: 500000000

traits:
  - id: qlickprint-installer
    desc: QlickPrint installer context
    if:
      type: path
      regex: '(?i)QlickPrint_Setup_NL\.exe'
  - id: qlickprint-member
    desc: QlickPrint bundled executable context
    if:
      type: path
      basename: true
      regex: '(?i)^(QlickPrint|QlickPrintUpdater)\.exe$'
