# Alan He "Find iPhone" Alfred workflow — legitimate Find My iCloud client.
# https://github.com/alanhe421/alfred-workflows/tree/master/find-my-iphone
defaults:
  platforms: [macos]
  for: [javascript, plist, zip]
  crit: notable
  conf: 0.95

traits:
  - id: alanhe-findmy-bundle-id
    desc: Alan He Find My Alfred bundle ID
    for: [plist]
    if:
      type: text
      substr: cn.alanhe.find-my-iphone

  - id: alfred-findmy-alert-subject
    desc: Alfred Find My playSound alert subject
    for: [javascript]
    if:
      type: literal
      exact: Alfred-find-my Alert

  - id: stacker-alfred-utils-import
    desc: Imports @stacker/alfred-utils helper
    for: [javascript]
    if:
      type: literal
      exact: "@stacker/alfred-utils"

composite_rules:
  - id: alanhe-alfred-find-my-workflow
    desc: Alan He Alfred Find My iPhone workflow
    crit: notable
    conf: 0.98
    all:
      - id: alfred-findmy-alert-subject
      - id: objectives/credential-access/cloud/session::icloud-findmy-api-endpoint
    any:
      - id: alanhe-findmy-bundle-id
      - id: stacker-alfred-utils-import
    needs: 1
