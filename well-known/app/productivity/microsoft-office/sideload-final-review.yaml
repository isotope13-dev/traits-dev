defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: licensing-datacontract-url
    desc: Office licensing data contract URL
    crit: notable
    conf: 0.92
    for:
      - pe
    if:
      type: text
      section: any
      exact: http://schemas.datacontract.org/2004/07/Microsoft.Office.LicensingService.Common
  - id: namecontrol-contact-retriever-reference
    desc: Office Contact Retriever reference
    crit: notable
    conf: 0.97
    for: [pe]
    if:
      type: text
      section: any
      exact: Microsoft Office Contact Retriever
  - id: namecontrolserver-progid
    desc: Office NameControlServer COM ProgID
    crit: notable
    conf: 0.96
    for: [pe]
    if:
      type: text
      section: any
      substr: NameControlServer.NameCtrl
  - id: protocolhandler-executable-reference
    desc: Office ProtocolHandler executable reference
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: text
      section: any
      exact: ProtocolHandler.exe
  - id: orgchart-config-reference
    desc: Office OrgChart configuration reference
    crit: notable
    conf: 0.95
    if:
      type: text
      section: any
      regex: (?i)OrgChart(Pref|Clip)\.dat
  - id: orgchart-intl-dll-reference
    desc: Office OrgChart international DLL reference
    crit: notable
    conf: 0.95
    if:
      type: text
      section: any
      exact: orgcintl.dll
  - id: orgchart-pdb-reference
    desc: Office OrgChart PDB reference
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: encoded
      section: any
      regex: 'postc2r.(x-?none|xone).orgchart\.pdb'
  - id: vpreview-pdb-reference
    desc: Office VPreview PDB reference
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: encoded
      section: any
      regex: 'postc2r.(x-?none|xone).vpreview\.pdb'
  - id: orgchart-executable-basename
    desc: Office OrgChart executable basename
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: path
      basename: true
      exact: ORGCHART.EXE
      case_insensitive: true

composite_rules:
  - id: orgchart-component-references
    desc: Office OrgChart component references
    crit: notable
    conf: 0.96
    for: [pe]
    any:
      - id: well-known/app/productivity/microsoft-office::orgchart-config-reference
      - id: well-known/app/productivity/microsoft-office::orgchart-intl-dll-reference
      - id: well-known/app/productivity/microsoft-office::orgchart-pdb-reference
    needs: 2
