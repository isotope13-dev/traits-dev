# Microsoft Office 2010 MSI-advertised Word shortcuts. The Shell Link carries
# a Darwin descriptor for installer repair and points at wordicon.exe in the
# product's Windows Installer cache; the deep relative path is standard MSI
# shortcut construction, not payload concealment.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 65536

traits:
  - id: office-2010-proplus-word-icon
    desc: Office 2010 ProPlus Word icon path
    conf: 0.99
    if:
      type: value
      path: lnk.icon_environment_target
      exact: '%SystemRoot%\Installer\{90140000-0011-0000-0000-0000000FF1CE}\wordicon.exe'
      case_insensitive: true

  - id: word-advertised-shortcut-description
    desc: Microsoft Word advertised-shortcut description
    conf: 0.99
    if:
      type: value
      path: lnk.description
      exact: Create and edit professional-looking documents such as letters, papers, reports, and booklets by using Microsoft Word.

composite_rules:
  - id: microsoft-word-2010-advertised-shortcut
    desc: Microsoft Word 2010 MSI-advertised shortcut
    crit: notable
    conf: 0.995
    all:
      - id: office-2010-proplus-word-icon
      - id: word-advertised-shortcut-description
