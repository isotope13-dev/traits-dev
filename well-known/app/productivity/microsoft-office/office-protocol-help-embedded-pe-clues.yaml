# Embedded PE, product-name and API combinations; no linked payload is required.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: office-protocol-help-embedded-pe-clues
  desc: Office protocol, Help and embedded PE clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/signature/certificate/identity::microsoft-certificate-chain
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/debug::office-protocolhandler-pdb-reference
  - id: well-known/app/productivity/microsoft-office::office-protocol-handler-name
  - id: well-known/app/productivity/microsoft-office::office-help-viewer-name
  - id: objectives/evasion/masquerade/identity/user-agent::office-help-user-agent-untrusted
  any:
  - id: well-known/app/productivity/microsoft-office::officecompleted-text
  - id: well-known/app/productivity/microsoft-office::office-help-path
  - id: micro-behaviors/communications/http/client/service::microsoft-watson-error-reporting-endpoint
  - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  needs: 2
