# Embedded PE, product-name and API combinations; no linked payload is required.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: office-protocol-token-api-clues
  desc: Office protocol, embedded PE and token APIs
  crit: suspicious
  conf: 0.985
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/debug::office-protocolhandler-pdb-reference
  - id: micro-behaviors/os/privilege/token/use::open-process-token
  - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex
  - id: metadata/binary/symbols/name/process::create-process-with-token
  any:
  - id: well-known/app/productivity/microsoft-office::protocolhandler-executable-reference
  - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
  - id: metadata/signature/verified/signer::mozilla-corporation
  - id: metadata/signature/unverified/signer::mozilla-corporation
  - id: metadata/signature/self-signed/signer::mozilla-corporation
  - id: metadata/signature/invalid/tampered/signer::mozilla-corporation
  - id: metadata/signature/invalid/bad-signature/signer::mozilla-corporation
  - id: metadata/signature/verified/subject::mozilla-corporation
  - id: metadata/signature/unverified/subject::mozilla-corporation
  - id: metadata/signature/self-signed/subject::mozilla-corporation
  - id: metadata/signature/invalid/tampered/subject::mozilla-corporation
  - id: metadata/signature/invalid/bad-signature/subject::mozilla-corporation
  - id: well-known/app/productivity/microsoft-office::officecompleted-text
  needs: 2
