# Embedded PE, product-name and API combinations; no linked payload is required.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: office-protocol-token-spawn-clues
  desc: Office protocol, embedded PE and token APIs
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/debug::office-protocolhandler-pdb-reference
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain
  any:
  - id: well-known/app/productivity/microsoft-office::protocolhandler-executable-reference
  - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
  - id: metadata/signed/unknown::mozilla-corporation
  needs: 2
