defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: office-namecontrolserver-component-clues
    desc: Office NameControlServer component clues
    crit: suspicious
    conf: 0.97
    for: [pe]
    size_min: 200000
    all:
      - id: well-known/app/productivity/microsoft-office::namecontrol-contact-retriever-reference
      - id: well-known/app/productivity/microsoft-office::namecontrolserver-progid
      - id: micro-behaviors/fs/path/library::office-mso-dll-reference
      - id: metadata/binary/section/label/packing::c2r-section-name
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
      - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
      - id: micro-behaviors/data/embedded/certificate::microsoft-timestamp-chain
  - id: office-namecontrolserver-adobe-clues
    desc: Office NameControlServer and Adobe clues
    crit: suspicious
    conf: 0.99
    for: [pe]
    size_min: 1000000
    all:
      - id: well-known/app/productivity/microsoft-office::office-namecontrolserver-component-clues
      - id: well-known/app/productivity/adobe-reader::notification-service-identifier
  - id: office-appv-protocolhandler-clues
    desc: Office AppV, ProtocolHandler and C2R clues
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: well-known/app/productivity/microsoft-office::protocolhandler-executable-reference
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
      - id: metadata/binary/section/label/packing::c2r-section-name
  - id: multiple-office-postc2r-pdbs
    desc: Multiple Office postc2r PDB references
    crit: suspicious
    conf: 0.97
    for: [pe]
    size_min: 524288
    any:
      - id: well-known/app/productivity/microsoft-office::orgchart-pdb-reference
      - id: metadata/binary/debug::office-msosync-pdb-path-reference
      - id: well-known/app/productivity/microsoft-office::vpreview-pdb-reference
      - id: metadata/binary/debug::office-postc2r-pdb-path-reference
    needs: 2
    unless:
      - id: well-known/app/productivity/microsoft-office::orgchart-executable-basename
  - id: multiple-office-pdb-embedded-pe-clues
    desc: Office PDB and embedded PE clues
    crit: suspicious
    conf: 0.98
    for: [pe]
    size_min: 1000000
    all:
      - id: well-known/app/productivity/microsoft-office::multiple-office-postc2r-pdbs
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
    any:
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
      - id: micro-behaviors/os/registry/com/reference::clsid-inprocserver32-key-path
      - id: metadata/binary/section/label/packing::c2r-section-name
