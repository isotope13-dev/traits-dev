---
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: officecompleted-text
  desc: OfficeCompleted text reference
  crit: component
  conf: 0.88
  if:
    type: text
    exact: OfficeCompleted
- id: office-help-viewer-name
  desc: Office Help Viewer marker
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: Microsoft Office Help Viewer
- id: office-help-path
  desc: Office help virtual path marker
  crit: notable
  conf: 0.88
  if:
    type: text
    exact: "/MsOfficeHelp16/"
- id: msoxmled-pdb
  desc: Office msoxmled.exe PDB marker
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: msoxmled.pdb
- id: vsto-installer-pdb-reference
  desc: VSTOInstaller PDB name reference
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: VSTOInstaller.pdb
- id: ensure-vsto-component-text
  desc: EnsureVSTOComponent text reference
  crit: notable
  conf: 0.93
  if:
    type: text
    exact: EnsureVSTOComponent
- id: office-help-user-agent-text
  desc: Office Help telemetry user-agent text
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: 'User-Agent: %s%sX-OfApp: %s%sX-OfVer: %s%sX-Office-Version: %d.%d.%04d.0%sX-OfHelpLcid:
      %s%sX-OfUILcid: %s%sX-OfSysLcid: %s%s'
