defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: office-licensing-component-clues
    desc: Office licensing component clues
    crit: notable
    conf: 0.94
    for:
      - pe
    all:
      - id: micro-behaviors/fs/path/system/library::dll-reference-osppc
      - id: micro-behaviors/fs/path/system/library::dll-reference-osppcext
      - id: well-known/app/productivity/microsoft-office::licensing-datacontract-url
    any:
      - id: micro-behaviors/fs/path/system/library::dll-reference-sppc
      - id: well-known/app/enterprise/microsoft-office-c2r::click-to-run-dll-reference
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
    downgrade:
      any:
        - id: metadata/vendor/identity::microsoft-corp-versioninfo
