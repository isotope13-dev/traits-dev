# Beekeeper Studio — open-source SQL editor / database GUI (Electron).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
  size_max: 536870912

traits:
  - id: beekeeper-package-name
    desc: Beekeeper Studio package.json name
    for: [package.json, javascript, json]
    if:
      type: value
      path: name
      exact: beekeeper-studio
  - id: beekeeper-app-name-string
    desc: Beekeeper Studio product name string
    for: [javascript, json, data, pe, elf, macho, text]
    if:
      type: text
      substr: Beekeeper Studio
  - id: beekeeper-install-path
    desc: Beekeeper Studio install path layout
    for: [elf, pe, macho, javascript, data, archives]
    if:
      type: path
      regex: '(?i)(Beekeeper Studio|beekeeper-studio)'

composite_rules:
  - id: beekeeper-studio-app
    desc: Beekeeper Studio application
    crit: notable
    conf: 0.97
    any:
      - id: beekeeper-package-name
      - id: beekeeper-app-name-string
      - id: beekeeper-install-path
