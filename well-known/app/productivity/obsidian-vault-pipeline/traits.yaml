# Obsidian Vault Pipeline (fakechris/obsidian_vault_pipeline) — LLM-backed
# Obsidian knowledge ingest/absorb/refine CLI (ovp / ovp-ui).
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.98
  size_max: 524288000

traits:
  - id: ovp-wheel-distribution
    desc: Obsidian vault pipeline wheel name
    crit: notable
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: obsidian_vault_pipeline

  - id: ovp-github-homepage
    desc: Obsidian vault pipeline GitHub homepage
    crit: notable
    for: [whl, python, text]
    if:
      type: text
      substr: github.com/fakechris/obsidian_vault_pipeline

  - id: auto-vault-api-key-env
    desc: OVP AUTO_VAULT_API_KEY env var
    crit: notable
    for: [python]
    if:
      type: text
      substr: AUTO_VAULT_API_KEY

  - id: ovp-truth-ui-heading
    desc: OVP Truth UI page heading
    crit: notable
    for: [python]
    if:
      type: text
      substr: OVP Truth UI

  - id: vault-layout-from-vault
    desc: OVP VaultLayout from_vault helper
    crit: notable
    for: [python]
    if:
      type: text
      substr: VaultLayout.from_vault

composite_rules:
  - id: ovp-knowledge-pipeline
    desc: Obsidian vault knowledge pipeline
    crit: notable
    needs: 2
    any:
      - id: ovp-wheel-distribution
      - id: ovp-github-homepage
      - id: auto-vault-api-key-env
      - id: ovp-truth-ui-heading
      - id: vault-layout-from-vault
