# Vditor — B3log markdown editor (npm vditor, github.com/Vanessa219/vditor).
defaults:
  platforms: [unix, windows]
  for: [javascript, npm, tar]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-banner
    desc: Vditor package banner comment
    for: [javascript]
    if:
      type: text
      substr: Vditor v

  - id: b3log-homepage
    desc: B3log Vditor homepage reference
    if:
      type: text
      substr: b3log.org/vditor

  - id: sync-script-loader-export
    desc: Vditor synchronous script loader export
    for: [javascript]
    if:
      type: text
      substr: addScriptSync

composite_rules:
  - id: package-context
    desc: Vditor markdown editor package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: b3log-homepage
      - id: sync-script-loader-export
    all:
      - id: package-banner
