defaults:
  platforms: [windows]
  for: [javascript, c, cpp, pe]
  size_max: 10000000
traits:
  - id: winmerge-installer-path
    desc: WinMerge signed installer path
    crit: notable
    conf: 0.98
    size_max: 20000000
    if:
      type: path
      regex: '(?i)WinMerge-[0-9][^\\/]{0,80}-Setup\.exe([\\/]|$)'
  - id: winmerge-main-exe-basename
    desc: WinMerge main executable basename
    crit: notable
    conf: 0.98
    size_max: 10000000
    if:
      type: basename
      exact: WinMergeU.exe
  - id: winmerge-full-source-archive-path
    desc: WinMerge full source archive path
    crit: notable
    conf: 0.98
    for: [javascript, c, cpp, pe, csharp, 7z, package.json]
    size_max: 80000000
    if:
      type: path
      regex: '(?i)winmerge-[0-9][^\\/]{0,80}-full-src\.7z'
  - id: winmerge-product-name
    desc: WinMerge PE product name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: WinMerge
  - id: winmerge-description
    desc: WinMerge PE file description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: WinMerge
  - id: winmerge-original-filename
    desc: WinMerge PE original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: WinMergeU.EXE
  - id: winmerge-poco-testsuite-path
    desc: WinMerge bundled POCO testsuite source path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(?i)poco.{0,160}testsuite[\\/]src[\\/]'
  - id: winmerge-shell-extension-register
    desc: WinMerge shell extension registration
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?is)WinMerge.{0,300}ShellExtension\.dll|ShellExtension\.dll.{0,300}WinMerge'
composite_rules:
  - id: winmerge-signed-installer-binary
    for: [pe]
    desc: WinMerge signed installer binary
    crit: notable
    conf: 0.99
    all:
      - id: winmerge-installer-path
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
  - id: winmerge-signed-main-binary
    for: [pe]
    desc: WinMerge signed main executable
    crit: notable
    conf: 0.99
    all:
      - id: winmerge-main-exe-basename
      - id: winmerge-product-name
      - id: winmerge-description
      - id: winmerge-original-filename
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
  - id: winmerge-bundled-plugin-script
    desc: WinMerge bundled plugin script
    crit: notable
    conf: 0.98
    all:
      - id: winmerge-full-source-archive-path
    any:
      - id: metadata/package/files/runtime::known-scriptlet-basename
      - id: metadata/package/files/runtime::dlls-scriptlet-path
  - id: winmerge-bundled-testsuite-source
    desc: WinMerge full-source bundled C/C++ testsuite source
    crit: notable
    conf: 0.98
    all:
      - id: winmerge-full-source-archive-path
      - id: winmerge-poco-testsuite-path
