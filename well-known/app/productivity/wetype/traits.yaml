defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  conf: 0.99
  size_min: 100000
  size_max: 300000000

traits:
  - id: product-name
    desc: WeType Chinese product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '^微信输入法( UI)?$'

  - id: service-product
    desc: WeType management service metadata
    if:
      type: value
      path: pe.version.product_name
      exact: WeType Management Service

  - id: resource-helper-product
    desc: WeChat resource helper product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: WeChat

  - id: resource-helper-filename
    desc: WeChat resource helper original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: WeChatResource.dll

composite_rules:
  - id: signed-product
    desc: Tencent-signed WeType binary
    all:
      - id: product-name
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: signed-resource-helper
    desc: Tencent-signed WeType resource helper
    all:
      - id: resource-helper-product
      - id: resource-helper-filename
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: signed-service
    desc: Tencent-signed WeType management service
    all:
      - id: service-product
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: app
    desc: Tencent WeType application component
    any:
      - id: signed-product
      - id: signed-resource-helper
      - id: signed-service
