# TheBrain (thebrain.com) desktop mind-mapping application. Its main
# assembly TheBrainCore.dll is unsigned at the PE level (macOS codesign
# covers the bundle instead) and, like any large .NET application, contains
# base64 decoding, Activator-based dependency injection, and symmetric
# crypto for licensing and data protection scattered across tens of
# megabytes. It also pairs ordinary UI copy ("{0} files have been {1}.")
# with encrypted-thought DecryptWarning text. Those are application
# function and product English, not payload staging or a ransom note.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: core-company
    desc: TheBrainCore company metadata
    if:
      type: value
      path: pe.version.company
      exact: TheBrainCore

  - id: core-internal-name
    desc: TheBrainCore.dll internal name
    if:
      type: value
      path: pe.version.internal_name
      exact: TheBrainCore.dll

  - id: core-file-description
    desc: TheBrainCore file description
    if:
      type: value
      path: pe.version.description
      exact: TheBrainCore

composite_rules:
  - id: thebrain-known-app-context
    desc: TheBrain application known benign context
    crit: exception
    conf: 0.99
    all:
      - id: core-company
      - id: core-internal-name
      - id: core-file-description
