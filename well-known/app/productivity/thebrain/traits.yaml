# TheBrain Desktop ships an Electron shell plus obfuscated .NET assemblies in
# the same application bundle. The path identity is deliberately exact to the
# vendor's bundle layout; the package name is not used as a standalone trust
# signal because it is an application identifier, not a signing identity.
defaults:
  platforms: [unix, windows]
traits:
  - id: thebrain-app-bundle-member
    desc: TheBrain application bundle member
    crit: notable
    conf: 1.0
    for: [binaries, scripts, source, manifests, data]
    size_max: 500000000
    if:
      type: path
      regex: '(?i)TheBrain[ ]15[.]app([/\\]|$)'
  - id: thebrain-dmg-name
    desc: TheBrain application disk image filename
    crit: notable
    conf: 1.0
    for: [data]
    size_max: 500000000
    if:
      type: path
      basename: true
      regex: '(?i)TheBrain[- ]15[.][0-9.]+[-]x64[.]dmg$'

composite_rules:
  - id: thebrain-known-app-context
    desc: Recognized TheBrain application bundle context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/productivity/thebrain::thebrain-app-bundle-member
      - id: well-known/app/productivity/thebrain::thebrain-dmg-name
