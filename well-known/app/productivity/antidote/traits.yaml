# Antidote French/English writing assistant for Windows.
# Its release executables are commercially VMProtect-packed, so the product
# identity is also used as a benign context for the generic VMP section rule.
# VirusSign / AV Evo-gen labels are typical on unsigned VMP-packed Antidote.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 50000000

traits:
  - id: antidote-release-pdb-path
    desc: Druide Antidote release PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]Antidote[\\/]release[\\/]Application[\\/]Bin64[\\/]Antidote\.pdb$'

  - id: antidote-product-metadata
    desc: Antidote 12 PE product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Antidote 12

  - id: antidote-company-metadata
    desc: Druide informatique Antidote company metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Druide informatique inc.

  - id: antidote-exe-original-filename
    desc: Antidote.exe OriginalFilename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: Antidote.exe

  - id: antidote-file-description
    desc: PE file description is Antidote
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: Antidote

composite_rules:
  - id: antidote-product-identity
    desc: Druide Antidote 12 product identity
    crit: notable
    conf: 0.99
    all:
      - id: antidote-product-metadata
      - id: antidote-company-metadata
      - id: antidote-exe-original-filename
      - id: antidote-file-description

  - id: antidote-vmprotect-context
    desc: Antidote's benign VMProtect-packed release context
    crit: exception
    conf: 0.995
    all:
      - id: antidote-release-pdb-path
      - id: antidote-product-metadata
      - id: antidote-company-metadata
      - id: antidote-exe-original-filename
