# Doc77 — local document preview and management tool
# (https://github.com/xyy277/doc77). SIGTERM handlers that stop an optional
# cloudflared/ngrok tunnel and exit zero are graceful shutdown, not Bun bootstrap.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: core-package-name
    desc: Doc77 core npm package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: '@doc77/core'

  - id: github-repository
    desc: Doc77 upstream GitHub repository
    if:
      type: text
      substr: github.com/xyy277/doc77

  - id: tunnel-manager-class
    desc: Doc77 tunnel manager implementation
    for: [javascript, typescript]
    if:
      type: text
      substr: 'var TunnelManager = class'

  - id: npm-update-check-url
    desc: Doc77 npm registry update check URL
    for: [javascript, typescript]
    if:
      type: text
      substr: registry.npmjs.org/idoc77/latest

composite_rules:
  - id: doc77-core-package-context
    desc: Doc77 core document manager package
    crit: exception
    conf: 0.99
    any:
      - id: core-package-name
      - id: github-repository
      - id: tunnel-manager-class
      - id: npm-update-check-url
