# Official aitable-workflow — DingTalk AI-table workflow automation.
# Delegates design tasks to Claude Code / Codex with bypassPermissions for
# unattended recipe execution; intentional product automation, not a backdoor.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: workflow-package-name
    desc: aitable-workflow npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^aitable-workflow-(core|base)'

  - id: agent-config-schema-marker
    desc: aitable workflow agent config schema
    for: [javascript, typescript]
    if:
      type: text
      substr: aitableAgentConfig

  - id: dingtalk-stream-event-marker
    desc: aitable DingTalk stream event type
    for: [javascript, typescript]
    if:
      type: text
      substr: dingtalk_stream_message

composite_rules:
  - id: aitable-workflow-source-context
    desc: aitable-workflow bundled source identity
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: agent-config-schema-marker
      - id: dingtalk-stream-event-marker
  - id: aitable-workflow-product-context
    desc: Official aitable-workflow automation product
    crit: exception
    conf: 0.99
    any:
      - id: workflow-package-name
      - id: aitable-workflow-source-context
