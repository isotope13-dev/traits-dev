defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: comfort-clipboard-company
    desc: Comfort Software Group publisher field
    if:
      type: value
      path: pe.version.company
      exact: Comfort Software Group

  - id: comfort-clipboard-description
    desc: Comfort Clipboard Pro file description
    if:
      type: value
      path: pe.version.description
      exact: Comfort Clipboard Pro 9

  - id: comfort-clipboard-product
    desc: Comfort Clipboard Pro product name
    if:
      type: value
      path: pe.version.product_name
      exact: Comfort Clipboard Pro

  - id: comfort-clipboard-setup-description
    desc: Comfort Clipboard Pro setup file description
    if:
      type: value
      path: pe.version.description
      exact: Comfort Clipboard Pro 9.5.0.0 Setup

  - id: comfort-clipboard-setup-product
    desc: Comfort Clipboard Pro setup product name
    if:
      type: value
      path: pe.version.product_name
      exact: Comfort Clipboard Pro 9.5.0.0

composite_rules:
  - id: comfort-clipboard-pro
    desc: Comfort Clipboard Pro binary
    crit: notable
    conf: 0.99
    all:
      - id: comfort-clipboard-company
      - id: comfort-clipboard-description
      - id: comfort-clipboard-product

  - id: comfort-clipboard-setup
    desc: Comfort Clipboard Pro setup binary
    crit: notable
    conf: 0.99
    all:
      - id: comfort-clipboard-company
      - id: comfort-clipboard-setup-description
      - id: comfort-clipboard-setup-product

  - id: comfort-clipboard-family
    desc: Comfort Clipboard Pro binary or installer
    crit: exception
    conf: 0.99
    any:
      - id: comfort-clipboard-pro
      - id: comfort-clipboard-setup
