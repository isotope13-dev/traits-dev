defaults:
  platforms: [windows]
  for: [pe, dll, 7z]
  crit: component
  conf: 0.98
  size_max: 200000000
traits:
  - id: notepad-plus-plus-portable-archive
    crit: notable
    desc: Notepad++ portable archive
    if:
      type: path
      regex: '(?i)(^|[\\/])npp\.[0-9][A-Za-z0-9._-]*portable.*\.7z($|[\\/])'
  - id: notepad-plus-plus-plugin-list
    crit: notable
    desc: Notepad++ plugin list DLL
    if:
      type: path
      basename: true
      exact: nppPluginList.dll
      case_insensitive: true
  - id: notepad-plus-plus-gup-updater
    crit: notable
    desc: Notepad++ GUP updater
    if:
      type: path
      basename: true
      exact: GUP.exe
      case_insensitive: true
  - id: notepad-plus-plus-nppexport-plugin
    crit: notable
    desc: Notepad++ NppExport plugin
    for: [dll]
    if:
      type: path
      basename: true
      exact: NppExport.dll
      case_insensitive: true
  - id: notepad-plus-plus-nppconverter-plugin
    crit: notable
    desc: Notepad++ NppConverter plugin
    for: [dll]
    if:
      type: path
      basename: true
      exact: NppConverter.dll
      case_insensitive: true

  - id: notepad-plus-plus-product-name
    desc: Notepad++ PE product identity
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: Notepad++

  - id: notepad-plus-plus-company
    desc: Notepad++ PE company identity
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.company
      exact: Don HO don.h@free.fr

  - id: notepad-plus-plus-original-filename
    desc: Notepad++ main executable filename
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^notepad\+\+\.exe$'

  # Notepad++ loads any DLL under plugins\<name>\ that exports this C ABI.
  # Each name alone is generic; the plugin-interface composite below needs
  # most of the set before it identifies a plugin module.
  - id: npp-plugin-export-set-info
    desc: Plugin export receiving editor handles
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: symbol
      kind: export
      exact: setInfo
  - id: npp-plugin-export-get-name
    desc: Plugin export returning the menu name
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: symbol
      kind: export
      exact: getName
  - id: npp-plugin-export-get-funcs-array
    desc: Plugin export returning the command table
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: symbol
      kind: export
      exact: getFuncsArray
  - id: npp-plugin-export-be-notified
    desc: Plugin export receiving editor notifications
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: symbol
      kind: export
      exact: beNotified
  - id: npp-plugin-export-message-proc
    desc: Plugin export receiving forwarded messages
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: symbol
      kind: export
      exact: messageProc
  - id: npp-plugin-export-is-unicode
    desc: Plugin export declaring a Unicode build
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: symbol
      kind: export
      exact: isUnicode

composite_rules:
  # Four or more of the six plugin ABI exports identify a Notepad++ plugin
  # module, whoever wrote it; it says nothing about whether it is genuine.
  - id: notepad-plus-plus-plugin-abi-exports
    desc: Exports the Notepad++ plugin interface
    crit: notable
    conf: 0.97
    for: [pe, dll]
    needs: 4
    any:
      - id: npp-plugin-export-set-info
      - id: npp-plugin-export-get-name
      - id: npp-plugin-export-get-funcs-array
      - id: npp-plugin-export-be-notified
      - id: npp-plugin-export-message-proc
      - id: npp-plugin-export-is-unicode

  - id: notepad-plus-plus-main-binary
    desc: Notepad++ main executable identity
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-product-name
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-company
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-original-filename

  - id: notepad-plus-plus-portable-component
    desc: Notepad++ portable component
    any:
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-gup-updater
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-nppconverter-plugin
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-nppexport-plugin
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-plugin-list
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-portable-archive
