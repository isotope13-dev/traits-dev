defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: crash-reporter-export-family
    desc: Evernote crash reporter exports
    crit: notable
    conf: 0.96
    for:
      - pe
      - dll
    if:
      type: symbol
      kind: export
      regex: '^En(CrashRep|APMDataRep|AnrDumpRep)'
