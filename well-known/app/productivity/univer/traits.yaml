# Univer Pro — commercial document and sheet collaboration platform (DreamNum).
# Official enterprise packages ship build-obfuscated locale tables and runtime code.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: univer-pro-package-name
    desc: Univer Pro npm package namespace
    if:
      type: value
      path: name
      regex: '^@univerjs-pro/'

  - id: univer-pro-repository
    desc: Univer Pro git repository URL
    if:
      type: value
      path: repository.url
      substr: github.com/dream-num/univer

  - id: univer-pro-author
    desc: DreamNum Univer author contact
    if:
      type: value
      path: author
      regex: '(?i)DreamNum.*developer@univer\.ai'

composite_rules:
  - id: univer-pro-package-context
    desc: Univer Pro commercial package context
    crit: exception
    conf: 0.99
    all:
      - id: univer-pro-package-name
      - id: univer-pro-repository
      - id: univer-pro-author
