defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: workflow-import
    desc: n8n workflow import marker
    crit: component
    conf: 0.95
    if:
      type: text
      substr: n8n-workflow
  - id: node-properties-schema
    desc: n8n node properties schema
    crit: component
    conf: 0.95
    if:
      type: text
      substr: INodeProperties
  - id: stripe-card-token-schema
    desc: Stripe card token schema
    crit: component
    conf: 0.95
    if:
      type: text
      substr: cardToken

composite_rules:
  - id: stripe-card-token-description
    desc: n8n Stripe card token node description
    crit: notable
    conf: 0.98
    all:
      - id: workflow-import
      - id: node-properties-schema
      - id: stripe-card-token-schema
