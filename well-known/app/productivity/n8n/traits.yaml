defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: workflow-import
    desc: n8n workflow import marker
    conf: 0.95
    if:
      type: text
      substr: n8n-workflow
  - id: node-properties-schema
    desc: n8n node properties schema
    conf: 0.95
    if:
      type: text
      substr: INodeProperties
composite_rules:
  - id: stripe-card-token-description
    desc: n8n Stripe card token node description
    conf: 0.98
    all:
      - id: workflow-import
      - id: node-properties-schema
      - id: metadata/lang/source/naming/secret::card-token-name-reference