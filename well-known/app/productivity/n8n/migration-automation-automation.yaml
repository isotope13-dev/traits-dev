defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - json
traits:
- id: n8n-api-key-header
  desc: n8n API key authentication header
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?i)\bX-N8N-API-KEY\b
- id: n8n-api-key-environment-variable
  desc: References n8n API key environment variable
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (^|[^A-Z0-9_])N8N_API_KEY([^A-Z0-9_]|$)
- id: n8n-scheduled-trigger-node
  desc: n8n scheduled workflow trigger node
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)n8n-nodes-base\.scheduleTrigger\b
- id: n8n-node-type-marker
  desc: n8n workflow node type marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)["']type["']\s*:\s*["']n8n-nodes-[A-Za-z0-9_.-]{1,64}["']
- id: n8n-http-node-remote-url-context
  desc: n8n HTTP node and remote URL text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)n8n-nodes-base\.httpRequest.{0,500}https?://.{1,180}
  unless:
  - id: metadata/file/format/news::serialized-news-article-catalog
composite_rules:
- id: n8n-stored-credential-reference
  desc: n8n workflow stored-credential reference
  crit: notable
  conf: 0.93
  all:
  - id: well-known/app/productivity/n8n::n8n-node-type-marker
  - id: micro-behaviors/data/serialize/schema-credential::credentials-field-key
  near_bytes: 1024
- id: n8n-scheduled-stored-credential-workflow
  desc: Scheduled n8n workflow uses a stored credential
  crit: notable
  conf: 0.98
  all:
  - id: well-known/app/productivity/n8n::n8n-scheduled-trigger-node
  - id: well-known/app/productivity/n8n::n8n-stored-credential-reference
  - id: metadata/lang/source/naming/authentication::workflow-credential-type-field-text
  near_bytes: 4096
- id: n8n-http-node-stored-credential-context
  desc: n8n HTTP node with credential and URL
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/library::n8n-http-request-node
  - id: well-known/app/productivity/n8n::n8n-stored-credential-reference
  - id: metadata/lang/source/naming/authentication::workflow-credential-type-field-text
  - id: well-known/app/productivity/n8n::n8n-http-node-remote-url-context
  near_bytes: 4096
