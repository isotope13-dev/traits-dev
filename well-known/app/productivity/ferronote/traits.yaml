# Ferronote — terminal note-taking app (crates.io / GitHub releases).
# Windows install docs use the common `irm … | iex` bootstrap against this
# project's own raw GitHub install.ps1, then download a signed release zip.
defaults:
  platforms: [windows, unix]
  for: [powershell, rust, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: ferronote-github-raw-install-url
    desc: Ferronote GitHub raw install.ps1 URL
    if:
      type: text
      substr: raw.githubusercontent.com/tareqmy/ferronote

  - id: ferronote-product-name
    desc: Ferronote product name
    if:
      type: text
      substr: Ferronote

  - id: ferronote-crate-path
    desc: Ferronote crate package path
    for: [rust, powershell, markdown, text, tar, archives]
    if:
      type: path
      regex: '(?i)ferronote[-/]'

composite_rules:
  - id: ferronote-windows-installer-context
    desc: Ferronote official Windows installer bootstrap
    crit: exception
    conf: 0.99
    all:
      - id: ferronote-github-raw-install-url
      - id: ferronote-crate-path
