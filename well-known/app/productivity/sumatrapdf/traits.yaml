defaults:
  platforms: [windows]
  for: [pe]
  size_max: 20000000

traits:
  - id: sumatrapdf-product-name
    desc: SumatraPDF PE product name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: SumatraPDF

  - id: sumatrapdf-description
    desc: SumatraPDF PE file description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: SumatraPDF

  - id: sumatrapdf-original-filename
    desc: SumatraPDF PE original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: SumatraPDF.exe

  - id: sumatrapdf-company-name
    desc: SumatraPDF author company name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Krzysztof Kowalczyk

composite_rules:
  - id: sumatrapdf-signed-binary
    desc: SumatraPDF signed binary
    crit: notable
    conf: 0.99
    all:
      - id: sumatrapdf-product-name
      - id: sumatrapdf-description
      - id: sumatrapdf-original-filename
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
