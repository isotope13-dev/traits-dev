# SAP Crystal Reports Engine (CRPE) is often shipped with commercial packing
# that yields random section names, multi-TLS callbacks, and VirtualProtect —
# the same surface as native loaders. Identify signed CRPE so packer traits
# do not convict the legitimate reporting DLL.
#
# Version-resource / signer atoms alone are not enough: trojanized hosts
# (e.g. Amatera) keep the SAP Authenticode leaf and CRPE version strings while
# replacing the export surface with a tiny loader stub. Require the real PE*
# Engine API exports before treating the file as known-good CRPE.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 67108864

traits:
  - id: sap-se-signer
    desc: SAP SE Authenticode leaf subject
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=SAP SE\b'

  - id: crpe-company-name
    desc: SAP SE PE company metadata
    if:
      type: value
      path: pe.version.company
      exact: SAP SE

  - id: crpe-product-name
    desc: SBOP Crystal Reports PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: SBOP Crystal Reports

  - id: crpe-original-filename
    desc: Crystal Reports Engine original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: CRPE32.DLL

  - id: crpe-description
    desc: Crystal Reports Engine file description
    if:
      type: value
      path: pe.version.description
      exact: Crystal Reports Engine

  # Real CRPE exports dozens of PE* Engine APIs. A stub with GetNewFIT/Run
  # (or any other tiny export set) must not inherit the CRPE exception.
  - id: crpe-engine-api-exports
    desc: Crystal Reports Engine PE* API export surface
    conf: 0.95
    count_min: 20
    if:
      type: export
      regex: '^PE[A-Z][A-Za-z0-9]+'

composite_rules:
  - id: sap-crystal-reports-engine
    desc: Signed SAP Crystal Reports Engine binary
    crit: notable
    conf: 0.99
    all:
      - id: sap-se-signer
      - id: crpe-company-name
      - id: crpe-product-name
      - id: crpe-engine-api-exports
    any:
      - id: crpe-original-filename
      - id: crpe-description
    needs: 1

  - id: sap-crystal-reports-engine-context
    desc: Recognized signed SAP Crystal Reports Engine context
    crit: exception
    conf: 0.99
    all:
      - id: sap-se-signer
      - id: sap-crystal-reports-engine
