defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Heroku MCP server package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@heroku/mcp-server'

  - id: upstream-repository
    desc: Heroku MCP server upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/heroku/heroku-mcp-server(\.git)?$'

  - id: runtime-path
    desc: Heroku MCP runtime path
    for: [javascript]
    if:
      type: path
      regex: '@heroku[/\\]mcp-server[/\\](dist|bin)'

composite_rules:
  - id: official-package
    desc: Official Heroku MCP server package identity
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository

  - id: official-package-context
    desc: Official Heroku MCP server package context
    crit: exception
    for: [npm, package.json, javascript]
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository
