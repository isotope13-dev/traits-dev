# soren — KubaJadrzak Ruby HTTP client library gem.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, archives, markdown, text]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: soren-gem-name
    desc: soren Ruby gem archive name
    crit: notable
    if:
      type: path
      regex: '(?i)soren-.*\.gem$'

  - id: soren-gemspec-name
    desc: soren gem specification name
    for: [gem]
    if:
      type: text
      regex: '(?i)^name:\s*soren\s*$'

  - id: soren-module-marker
    desc: Soren Ruby HTTP client module
    for: [ruby]
    crit: notable
    if:
      type: text
      substr: "Soren::Connection"

composite_rules:
  - id: soren-ruby-gem
    desc: soren Ruby HTTP client library gem
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: soren-gem-name
      - id: soren-gemspec-name
      - id: soren-module-marker
