# process_bot — kaspernj Ruby process control gem (Sidekiq/Puma).
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, archives, markdown, text]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: process-bot-gem-name
    desc: process_bot Ruby gem archive name
    crit: notable
    if:
      type: path
      regex: '(?i)process_bot-.*\.gem$'

  - id: process-bot-gemspec-name
    desc: process_bot gemspec package name
    for: [gem]
    if:
      type: text
      regex: '(?i)^name:\s*process_bot\s*$'

  - id: process-bot-module-marker
    desc: ProcessBot Ruby module marker
    for: [ruby]
    crit: notable
    if:
      type: text
      substr: "ProcessBot::"

  - id: process-bot-rubygems-release-marker
    desc: ProcessBotRubygemsRelease release task
    for: [ruby, python]
    crit: notable
    if:
      type: text
      substr: ProcessBotRubygemsRelease

  - id: process-bot-version-file-marker
    desc: process_bot version.rb release path marker
    for: [ruby, python]
    crit: notable
    if:
      type: text
      substr: process_bot/version.rb

composite_rules:
  - id: process-bot-ruby-gem
    desc: process_bot Ruby process control gem
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: process-bot-gem-name
      - id: process-bot-gemspec-name
      - id: process-bot-module-marker

  - id: process-bot-rubygems-release-context
    desc: process_bot maintainer Rubygems release rake
    crit: exception
    conf: 0.99
    scope: outer
    for: [ruby, python, gem, archives]
    all:
      - id: process-bot-rubygems-release-marker
      - id: process-bot-version-file-marker
