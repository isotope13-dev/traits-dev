# Agent Crossbar is a local developer-agent and MCP harness. Its subprocess,
# shell, and local-state behavior is intentional package functionality.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Agent Crossbar distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agent-crossbar

  - id: wheel-distribution-name
    desc: Agent Crossbar wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: agent_crossbar

  - id: python-package-marker
    desc: Agent Crossbar Python package marker
    for: [python]
    if:
      type: text
      substr: agent_crossbar

composite_rules:
  - id: agent-crossbar-tool
    desc: Agent Crossbar developer-agent harness identity
    any:
      - id: package-name
      - id: wheel-distribution-name
      - id: python-package-marker
