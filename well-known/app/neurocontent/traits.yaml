defaults:
  platforms: [unix, windows]
  for: [php, zip]
  crit: notable
  conf: 0.99

traits:
  - id: plugin-header
    desc: NeuroContent WordPress plugin header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Plugin Name:\s*NeuroContent\s*$'

  - id: author-header
    desc: NeuroContent VerseLabWP author header
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Author:\s*VerseLabWP\s*$'

  - id: plugin-directory
    desc: NeuroContent plugin directory
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])neurocontent([\\/]|$)'

composite_rules:
  - id: wordpress-plugin
    desc: NeuroContent WordPress plugin
    crit: notable
    conf: 0.99
    any:
      - id: plugin-header
      - id: author-header
      - id: plugin-directory
