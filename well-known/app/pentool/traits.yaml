# Pentool is an open-source terminal web penetration-testing toolkit.  Its
# proxy, scanner, plugin, updater, and terminal subprocesses are product
# functionality; the package identity lets those neutral capabilities be
# interpreted in context during triage.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Pentool Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: pentool

  - id: project-repository
    desc: Pentool upstream repository
    if:
      type: text
      substr: github.com/docxqwerty/pentool

  - id: source-module
    desc: Pentool Python source module
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])pentool[\\/]'

composite_rules:
  - id: pentool-application
    desc: Pentool web penetration-testing toolkit
    crit: notable
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: wheel-distribution
    any:
      - id: project-repository
      - id: source-module
