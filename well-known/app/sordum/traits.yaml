defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96
  size_min: 100000
  size_max: 3000000

traits:
  - id: sordum-utility
    crit: notable
    desc: Sordum utility binary
    if:
      type: value
      path: pe.version.company
      exact: Sordum Software
  - id: sordum-dnsjumper
    crit: notable
    desc: Sordum DNS Jumper binary
    if:
      type: basename
      exact: DnsJumper.exe
      case_insensitive: true
  - id: sordum-hedit
    crit: notable
    desc: Sordum hEdit binary
    if:
      type: basename
      exact: hEdit.exe
      case_insensitive: true
  - id: bluelife-hosts-editor-company
    desc: Sordum Software company metadata
    if:
      type: value
      path: pe.version.company
      exact: www.sordum.org
  - id: bluelife-hosts-editor-description
    desc: BlueLife Hosts Editor description
    if:
      type: value
      path: pe.version.description
      exact: BlueLife Hosts Editor v1.3
  - id: bluelife-hosts-editor-comments
    desc: BlueLife Hosts Editor hosts-file purpose
    if:
      type: value
      path: pe.version.comments
      exact: This program is designed to edit the hosts file.
  - id: bluelife-hosts-editor-original-filename
    desc: BlueLife Hosts Editor original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: hEdit.exe

composite_rules:
  - id: bluelife-hosts-editor
    desc: Sordum BlueLife Hosts Editor
    crit: notable
    conf: 0.99
    all:
      - id: bluelife-hosts-editor-company
      - id: bluelife-hosts-editor-description
      - id: bluelife-hosts-editor-comments
      - id: bluelife-hosts-editor-original-filename
