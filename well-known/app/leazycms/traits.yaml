# LeazyCMS — iamudin Laravel CMS web package.
defaults:
  platforms: [unix, windows]
  for: [php, json, markdown, text, archives, zip]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: leazycms-archive-name
    desc: LeazyCMS web distribution archive name
    if:
      type: path
      regex: '(?i)leazycms-web-.*\.zip'

  - id: leazycms-composer-package
    desc: LeazyCMS web Composer package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"leazycms/web"'

  - id: leazycms-namespace-marker
    desc: LeazyCMS Web PHP namespace marker
    for: [php]
    crit: notable
    if:
      type: text
      substr: namespace Leazycms\Web

  - id: leazycms-service-provider
    desc: LeazyCMS CmsServiceProvider marker
    for: [php, json]
    crit: notable
    if:
      type: text
      substr: Leazycms\Web\CmsServiceProvider

composite_rules:
  - id: leazycms-web-package
    desc: LeazyCMS Laravel CMS web package
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives, zip]
    any:
      - id: leazycms-archive-name
      - id: leazycms-composer-package
      - id: leazycms-namespace-marker
      - id: leazycms-service-provider
