# Local tab agent — moego0's VS Code coding agent using Ollama and a localhost
# WebSocket bridge to a Chrome extension for ChatGPT browser-tab prompting.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: local-tab-agent-vsix-name
    desc: Local tab agent VSIX archive name
    if:
      type: path
      regex: '(?i)moego0\.local-tab-agent'

  - id: local-tab-agent-package-name
    desc: Local tab agent extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"local-tab-agent"'

  - id: local-tab-agent-publisher
    desc: moego0 VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"moego0"'

  - id: local-tab-agent-bridge-marker
    desc: Local tab agent Chrome bridge server marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)bridgeServer|aiagent\.checkBridge|Chrome bridge is connected'

  - id: local-tab-agent-ollama-marker
    desc: Local tab agent Ollama integration marker
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)aiagent\.(selectModel|checkOllama)|ollamaUrl|ollamaModel'

composite_rules:
  - id: local-tab-agent-vscode-extension
    desc: Local tab agent Ollama coding assistant VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: local-tab-agent-publisher
    any:
      - id: local-tab-agent-vsix-name
      - id: local-tab-agent-package-name
      - id: local-tab-agent-bridge-marker
      - id: local-tab-agent-ollama-marker
