# runn-code-ext — marimelon Runn API testing VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: runn-code-ext-vsix-name
    desc: runn-code-ext VSIX archive name
    if:
      type: path
      regex: '(?i)marimelon\.runn-code-ext'

  - id: runn-code-ext-package-name
    desc: runn-code-ext extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"runn-code-ext"'

  - id: runn-code-ext-publisher
    desc: marimelon VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"marimelon"'

  - id: runn-scenario-explorer-marker
    desc: Runn scenario explorer view marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: runnScenarioExplorer

composite_rules:
  - id: runn-code-ext-vscode-extension
    desc: Runn API testing VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: runn-code-ext-publisher
    any:
      - id: runn-code-ext-vsix-name
      - id: runn-code-ext-package-name
      - id: runn-scenario-explorer-marker
