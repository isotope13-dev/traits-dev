defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 100000000

traits:
- id: product-name
  desc: Clippy clipboard manager product metadata
  if:
    type: value
    path: pe.version.product_name
    exact: clippy
- id: publisher
  desc: 0-don Clippy publisher metadata
  if:
    type: value
    path: pe.version.company
    exact: 0-don

composite_rules:
- id: clippy-binary
  desc: Clippy clipboard manager Windows binary identity
  crit: notable
  conf: 0.99
  all:
  - id: product-name
  - id: publisher
  - id: metadata/build/framework::tauri-runtime
