# blendersessiond is a local Blender session manager and MCP bridge.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: blendersessiond Python wheel identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: blendersessiond
