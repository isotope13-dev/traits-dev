# Plato Python SDK — official client for the plato.so simulation platform.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, json, chrome-manifest, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: plato-sdk-wheel-name
    desc: Plato SDK Python wheel archive name
    if:
      type: path
      regex: '(?i)plato[_-]sdk.*\.whl$'

  - id: plato-sdk-package-name
    desc: plato-sdk-v2 distribution name
    for: [text, python]
    if:
      type: text
      regex: '(?m)^Name:\s*plato-sdk-v2\s*$'

  - id: plato-sdk-support-email
    desc: Plato support email domain marker
    for: [python, text]
    if:
      type: text
      substr: support@plato.so

  - id: envgen-recorder-extension-name
    desc: EnvGen Recorder Chrome extension name
    crit: notable
    for: [json, chrome-manifest]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"EnvGen Recorder"'

  - id: envgen-recorder-plato-host
    desc: EnvGen Recorder Plato sims host permission
    for: [json, chrome-manifest]
    crit: notable
    if:
      type: text
      substr: sims.plato.so

  - id: plato-worlds-tailscale-setup
    desc: Plato worlds Tailscale VPN setup helper
    for: [python]
    crit: notable
    if:
      type: text
      substr: Tailscale VPN helpers for Plato worlds

composite_rules:
  - id: plato-sdk-python-package
    desc: Plato official Python SDK package
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: plato-sdk-support-email
    any:
      - id: plato-sdk-wheel-name
      - id: plato-sdk-package-name

  - id: envgen-recorder-extension-context
    desc: Plato EnvGen session recorder extension context
    crit: exception
    conf: 0.98
    for: [chrome-manifest, json, javascript]
    all:
      - id: envgen-recorder-extension-name
      - id: envgen-recorder-plato-host
