defaults:
  platforms: [unix, windows]
  for: [go, go.mod, markdown, text, json, manifests]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: threat.gg honeypot agent module
    for: [go.mod]
    if:
      type: text
      exact: 'module github.com/joshrendek/threat.gg-agent'

  - id: brand-marker
    desc: threat.gg honeypot service marker
    for: [go, markdown, text]
    if:
      type: text
      substr: threat.gg

  - id: network-honeypot-service-marker
    desc: Network-service honeypot marker
    crit: notable
    conf: 0.92
    for: [go, markdown, text]
    if:
      type: text
      regex: '(?i)\b(network|internet)[ -]honeypot\b|\bhoneypot[ -](agent|service)\b'

  - id: capture-activity-marker
    desc: Honeypot attack-data collection marker
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\b(collect|capture)\w*\s+and\s+analy[sz]\w*\s+real-world attack data\b'

composite_rules:
  - id: honeypot-agent-context
    desc: threat.gg network honeypot agent
    crit: notable
    conf: 0.99
    all:
      - id: module-path
      - id: brand-marker
      - id: network-honeypot-service-marker

  - id: benign-honeypot-context
    desc: threat.gg documented network honeypot identity
    crit: exception
    conf: 0.99
    all:
      - id: module-path
      - id: brand-marker
      - id: network-honeypot-service-marker
      - id: capture-activity-marker
