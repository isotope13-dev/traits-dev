defaults:
  platforms: [unix, windows]
  for: [go, go.mod, markdown, text, json, manifests]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: threat.gg honeypot agent module
    for: [go.mod]
    if:
      type: text
      exact: 'module github.com/joshrendek/threat.gg-agent'

  - id: brand-marker
    desc: threat.gg honeypot service marker
    for: [go, markdown, text]
    if:
      type: text
      substr: threat.gg

  - id: honeypot-marker
    desc: Network-service honeypot marker
    for: [go, markdown, text]
    if:
      type: text
      word: honeypot

  - id: emulated-service-marker
    desc: Emulated network-service name
    for: [go, markdown, text]
    if:
      type: text
      regex: '(?i)(SSH|FTP|Docker|Kubernetes)'

composite_rules:
  - id: honeypot-agent-context
    desc: threat.gg network honeypot agent
    crit: notable
    conf: 0.99
    all:
      - id: module-path
      - id: brand-marker
      - id: honeypot-marker
      - id: emulated-service-marker
