# VibeTime is an AI-agent session analytics client.  Its supported CLI is
# intentionally an agent-hook telemetry reporter; package identity and the
# upstream repository establish the benign product context for that behavior.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: VibeTime npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@yhong91/vibetime'

  - id: upstream-repository
    desc: VibeTime upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/yhong91/vibetime-cli(\.git)?([/?#]|$)'

  - id: cli-package-name-marker
    desc: VibeTime CLI package marker
    for: [javascript]
    if:
      type: text
      substr: '@yhong91/vibetime'

  - id: cli-api-environment-marker
    desc: VibeTime API environment marker
    for: [javascript]
    if:
      type: text
      substr: VIBETIME_API_URL

  - id: cli-hook-command-marker
    desc: VibeTime agent-hook command marker
    for: [javascript]
    if:
      type: text
      substr: 'vibetime hook --agent'

composite_rules:
  - id: vibetime-package-identity
    desc: Recognized VibeTime package identity
    crit: notable
    for: [package.json]
    all:
      - id: package-name
      - id: upstream-repository

  - id: vibetime-cli-source-context
    desc: Recognized VibeTime CLI source context
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: cli-package-name-marker
      - id: cli-api-environment-marker
      - id: cli-hook-command-marker
