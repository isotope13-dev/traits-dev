defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 300000000

traits:
  - id: product-name
    desc: 360 Zip product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: 360 Zip

  - id: installer-original-filename
    desc: 360 Zip installer original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: 360zipsetup.exe
      case_insensitive: true

composite_rules:
  - id: 360-zip-installer-identity
    desc: Signed 360 Zip installer identity
    crit: notable
    conf: 0.99
    all:
      - id: well-known/app/360-file-guard::qihoo-360-authenticode-signer
      - id: product-name
      - id: installer-original-filename

  - id: 360-zip-installer-archive-context
    desc: 360 Zip installer with embedded 7-Zip archive
    crit: exception
    conf: 0.99
    all:
      - id: 360-zip-installer-identity
      - id: metadata/binary/layout::7z-archive-signature-in-resource
