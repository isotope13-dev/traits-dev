# Portacode is a remote administration and development client.  Its package
# identity gives analysts context for the intentionally powerful capabilities
# in the client; it does not imply hostile behavior.
defaults:
  platforms: [linux, macos, windows]
  for: [whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Portacode Python wheel distribution
    if:
      type: value
      path: whl.distribution
      exact: portacode

  - id: project-homepage
    desc: Portacode upstream repository
    if:
      type: value
      path: whl.home_page
      exact: https://github.com/portacode/portacode

composite_rules:
  - id: application-identity
    desc: Portacode remote administration and development client identity
    crit: notable
    conf: 0.99
    all:
      - id: wheel-distribution
      - id: project-homepage
