# Lush Lisp Universal Shell. Its documented shell, PTY, and socket primitives
# are legitimate interpreter capabilities, not an implanted reverse shell.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000

traits:
  - id: lush-executable-name
    desc: Lush interpreter executable name
    if:
      type: basename
      exact: lush

  - id: lush-runtime-banner
    desc: Lush Lisp Universal Shell runtime banner
    if:
      type: text
      section: .rodata
      substr: LUSH Lisp Universal Shell

  - id: lush-filteropenpty-primitive
    desc: Lush filteropenpty primitive
    crit: component
    if:
      type: text
      section: .rodata
      exact: filteropenpty
  - id: lush-socketopen-primitive
    desc: Lush socketopen primitive
    crit: component
    if:
      type: text
      section: .rodata
      exact: socketopen
  - id: lush-socketaccept-primitive
    desc: Lush socketaccept primitive
    crit: component
    if:
      type: text
      section: .rodata
      exact: socketaccept
  - id: lush-socketselect-primitive
    desc: Lush socketselect primitive
    crit: component
    if:
      type: text
      section: .rodata
      exact: socketselect

composite_rules:
  - id: lush-pty-network-primitives
    desc: Lush PTY and socket runtime primitives
    crit: notable
    conf: 0.98
    any:
      - id: lush-filteropenpty-primitive
      - id: lush-socketopen-primitive
      - id: lush-socketaccept-primitive
      - id: lush-socketselect-primitive
  - id: lush-runtime
    desc: Lush Lisp Universal Shell interpreter
    crit: notable
    conf: 0.99
    all:
      - id: lush-executable-name
      - id: lush-runtime-banner

  - id: lush-pty-runtime
    desc: Lush PTY-capable interpreter context
    crit: exception
    conf: 0.99
    all:
      - id: lush-runtime
      - id: lush-pty-network-primitives
