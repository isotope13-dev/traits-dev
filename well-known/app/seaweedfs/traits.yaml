# SeaweedFS — fast distributed blob/object/file store. The conda-forge package
# ships the `weed` CLI/server binary; identity is the product banner strings
# and the conda package name, not the S3/IAM-compatible API surface it speaks.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, conda, go]
  crit: notable
  conf: 0.95
  size_min: 64
  size_max: 500000000

traits:
  - id: seaweedfs-volume-banner
    desc: SeaweedFS Volume server banner
    conf: 0.98
    size_min: 1000000
    if:
      type: text
      substr: 'SeaweedFS Volume'

  - id: seaweedfs-example-weed
    desc: SeaweedFS weed CLI usage example
    crit: component
    conf: 0.9
    size_min: 1000000
    if:
      type: text
      substr: 'Example: weed %s'

  - id: seaweedfs-home-config-path
    desc: SeaweedFS home config directory path
    crit: component
    conf: 0.9
    size_min: 1000000
    if:
      type: text
      substr: '$HOME/.seaweedfs'

  # Matches a `name` field, which any JSON manifest has; the conda-index gate
  # that makes it an identity lives in the composite below.
  - id: seaweedfs-package-name
    desc: seaweedfs package name field
    for: [json, conda]
    crit: component
    conf: 0.95
    size_min: 32
    size_max: 65536
    if:
      type: value
      path: name
      exact: seaweedfs

composite_rules:
  # The product banner plus either of the `weed` CLI fragments: the usage
  # example belongs to the command help and `$HOME/.seaweedfs` to the config
  # lookup, so a build that keeps only one of the two is still SeaweedFS.
  - id: seaweedfs-identity
    desc: SeaweedFS distributed storage binary
    conf: 0.97
    all:
      - id: seaweedfs-volume-banner
    any:
      - id: seaweedfs-example-weed
      - id: seaweedfs-home-config-path
    needs: 1

  # Conda ships the `weed` binary in the package payload, not in the index
  # metadata, so the package identity is the name field read in a file that the
  # conda index-metadata trait has already confirmed is a conda index — a bare
  # `"name": "seaweedfs"` in any other JSON is not this package.
  - id: seaweedfs-conda-package
    desc: SeaweedFS conda package metadata
    for: [json, conda]
    conf: 0.97
    all:
      - id: seaweedfs-package-name
      - id: metadata/package/manifest/ecosystem::conda-index-metadata
