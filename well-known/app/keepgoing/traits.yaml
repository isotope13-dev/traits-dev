# KeepGoing — VS Code extension for session checkpoints and MCP setup.
defaults:
  platforms: [unix, windows]
  for: [markdown, json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: keepgoing-publisher
    desc: KeepGoing VS Code extension publisher
    if:
      type: text
      substr: keepgoing-dev

  - id: keepgoing-package-name
    desc: KeepGoing VS Code extension package name
    if:
      type: text
      regex: '(?i)\bId="keepgoing"\b'

  - id: keepgoing-official-install-url
    desc: KeepGoing official install.sh URL
    if:
      type: text
      substr: https://keepgoing.dev/install.sh

  - id: keepgoing-domain
    desc: KeepGoing product domain
    if:
      type: text
      substr: keepgoing.dev

composite_rules:
  - id: keepgoing-extension-context
    desc: KeepGoing VS Code extension identity
    crit: notable
    all:
      - id: keepgoing-publisher
      - id: keepgoing-domain
