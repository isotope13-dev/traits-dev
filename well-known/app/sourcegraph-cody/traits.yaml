# sourcegraph.cody-testing — Sourcegraph Cody AI assistant VS Code extension (dev/test build).
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: cody-testing-vsix-name
    desc: Sourcegraph Cody testing VSIX archive name
    if:
      type: path
      regex: '(?i)sourcegraph\.cody-testing'

  - id: cody-testing-package-name
    desc: Cody testing extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"cody-testing"'

  - id: cody-sourcegraph-publisher
    desc: Sourcegraph VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"sourcegraph"'

  - id: cody-sourcegraph-marker
    desc: Sourcegraph Cody product marker
    if:
      type: text
      regex: '(?i)Sourcegraph.{0,40}Cody|sourcegraph\.com|@sourcegraph/'

composite_rules:
  - id: sourcegraph-cody-vscode-extension
    desc: Sourcegraph Cody VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: cody-sourcegraph-publisher
    any:
      - id: cody-testing-vsix-name
      - id: cody-testing-package-name
      - id: cody-sourcegraph-marker
