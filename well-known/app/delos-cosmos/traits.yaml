# Delos Code — delos-so AI coding assistant VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: delos-cosmos-vsix-name
    desc: Delos Code VSIX archive name
    if:
      type: path
      regex: '(?i)delos-so\.delos-cosmos'

  - id: delos-cosmos-package-name
    desc: Delos Code extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"delos-cosmos"'

  - id: delos-cosmos-publisher
    desc: delos-so VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"delos-so"'

  - id: delos-opencode-caller-marker
    desc: Delos OpenCode caller environment marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      substr: OPENCODE_CALLER=vscode-delos

  - id: delos-cosmos-oauth-marker
    desc: Delos Cosmos OAuth storage key marker
    for: [javascript, typescript, json]
    crit: notable
    if:
      type: text
      substr: delos.cosmos.oauthToken

composite_rules:
  - id: delos-cosmos-vscode-extension
    desc: Delos Code AI assistant VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: delos-cosmos-publisher
    any:
      - id: delos-cosmos-vsix-name
      - id: delos-cosmos-package-name
      - id: delos-opencode-caller-marker
      - id: delos-cosmos-oauth-marker
      - id: well-known/app/opencode::opencode-native-binary-name
