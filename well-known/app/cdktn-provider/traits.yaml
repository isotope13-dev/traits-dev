# CDK Terrain (cdktn) prebuilt Terraform provider bindings (jsii-generated).
defaults:
  platforms: [unix, windows]
  for: [python, whl, javascript, typescript, npm, tar]
  crit: baseline
  conf: 0.98

traits:
  - id: cdktn-provider-package-name
    desc: cdktn provider Python wheel package name
    for: [whl, python]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^cdktn[-_]provider[-_]'

  - id: cdktn-provider-module-path
    desc: cdktn provider Python module path
    for: [whl, python]
    if:
      type: path
      regex: '(?i)cdktn[-_]provider[-_]'

  - id: cdktn-provider-jsii-fqn
    desc: CDKTN provider JSII fully-qualified name
    for: [javascript, typescript]
    if:
      type: text
      substr: '@cdktn/provider-'

  - id: cdktn-terrain-marker
    desc: CDK Terrain project marker
    for: [python, whl, javascript, typescript, npm, tar, markdown]
    if:
      type: text
      regex: '(?i)CDK Terrain|cdktn\.io|cdktn-io'

composite_rules:
  - id: cdktn-terraform-provider-wheel
    desc: CDK Terrain prebuilt Terraform provider wheel
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: cdktn-provider-package-name
    any:
      - id: cdktn-provider-module-path
      - id: cdktn-provider-jsii-fqn
      - id: cdktn-terrain-marker
