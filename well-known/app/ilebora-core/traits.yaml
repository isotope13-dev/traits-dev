# ilebora-core-slim-sec — ILEBORA BoraSlim PHP helper framework.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json, javascript, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: ilebora-core-archive-name
    desc: ilebora-core-slim-sec source archive name
    if:
      type: path
      regex: '(?i)ilebora-core-slim-sec'

  - id: ilebora-core-composer-name
    desc: ilebora/core-slim-sec Composer package
    for: [composer.json]
    if:
      type: value
      path: name
      exact: ilebora/core-slim-sec

  - id: boraslim-namespace-marker
    desc: BoraSlim PHP framework namespace marker
    for: [php, composer.json]
    crit: notable
    if:
      type: text
      substr: BoraSlim\\

composite_rules:
  - id: ilebora-core-slim-sec-package
    desc: ILEBORA BoraSlim PHP helper framework
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: ilebora-core-archive-name
      - id: ilebora-core-composer-name
      - id: boraslim-namespace-marker
