# Nickle is a desk-calculator language with C-like scripting, sockets, and
# process control. Its interpreter legitimately imports bind/listen/accept/
# connect plus dup2/exec for the language runtime — not a reverse shell.
# Identity composite: well-known/app/nickle::nickle-interpreter
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 5000000

traits:
  - id: nickle-basename
    desc: Nickle interpreter executable basename
    if:
      type: basename
      exact: nickle

  - id: nickle-start-env-marker
    desc: Nickle NICKLESTART environment marker
    if:
      type: text
      section: .rodata
      exact: NICKLESTART

  - id: nickle-libdir-marker
    desc: Nickle library directory symbol
    if:
      type: text
      section: .rodata
      exact: nickle_libdir

composite_rules:
  - id: nickle-interpreter
    desc: Nickle desk calculator language interpreter
    crit: notable
    conf: 1.0
    all:
      - id: nickle-basename
      - id: nickle-start-env-marker
      - id: nickle-libdir-marker
