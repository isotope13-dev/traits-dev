# aya — shawnoster personal AI assistant CLI toolkit (Python wheel).
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown, json]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: aya-wheel-name
    desc: aya_ai_assist Python wheel archive name
    if:
      type: path
      regex: '(?i)aya_ai_assist-.*\.whl$'

  - id: aya-package-name
    desc: aya-ai-assist Python distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*aya-ai-assist\s*$'

  - id: aya-cli-entry-marker
    desc: aya CLI entry point module marker
    for: [python]
    crit: notable
    if:
      type: text
      substr: CLI entry point — aya command

composite_rules:
  - id: aya-python-package
    desc: aya personal AI assistant CLI toolkit
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: aya-wheel-name
      - id: aya-package-name
      - id: aya-cli-entry-marker
