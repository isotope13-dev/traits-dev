# The LinkedIn MCP server documents and implements an opt-in browser-session
# import. Its browser credential handling is limited to LinkedIn cookies and
# saves them into the server's own local profile.
defaults:
  platforms: [windows, linux, macos]
  for: [python, markdown]

traits:
  - id: browser-import-source-path
    desc: LinkedIn MCP browser import source path
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: path
      regex: 'browser_import[\\/](extract|discovery)\.py$'
  - id: browser-import-source-doc
    desc: LinkedIn browser cookie import documentation
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(Cookies database|LinkedIn cookies|--import-from-browser)'
  - id: package-identity
    desc: LinkedIn MCP server package identity
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(stickerdaniel/linkedin-mcp-server|mcp-server-linkedin)'
  - id: browser-discovery-marker
    desc: LinkedIn MCP browser discovery marker
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '(?i)(SUPPORTED_BROWSERS|Yandex/YandexBrowser|browser roots)'
  - id: opt-in-browser-import-doc
    desc: Documented opt-in LinkedIn browser import
    crit: notable
    conf: 0.98
    for: [markdown]
    if:
      type: text
      regex: '(?i)(Import a session from your everyday browser|reads the browser.{0,30}LinkedIn cookies)'

composite_rules:
  - id: browser-import-source-context
    desc: LinkedIn MCP browser import source context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: browser-import-source-path
      - id: browser-import-source-doc
  - id: browser-import-discovery-context
    desc: LinkedIn MCP browser discovery source context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: browser-import-source-path
      - id: browser-discovery-marker
  - id: browser-import-archive-context
    desc: Documented LinkedIn MCP browser import package context
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, archives]
    all:
      - id: package-identity
      - id: opt-in-browser-import-doc
      - id: browser-import-source-path
