# lidlplus-ui — unofficial Lidl Plus GTK desktop client by Zsombor Kalmar.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: lidlplus-ui wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: lidlplus_ui

  - id: package-name
    desc: lidlplus-ui package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: lidlplus-ui

  - id: author-marker
    desc: lidlplus-ui author metadata marker
    for: [pkginfo]
    if:
      type: text
      substr: Zsombor Kalmar

  - id: lidlplus-api-import
    desc: lidlplus-api client import marker
    for: [python]
    if:
      type: text
      regex: '(?i)import lidlplus_api|from lidlplus_api'

  - id: gtk-libadwaita-marker
    desc: GTK libadwaita desktop UI marker
    for: [python]
    if:
      type: text
      regex: '(?i)gi\.require_version\([''"]Adw[''"]|from gi\.repository import Gtk, Gdk, Adw'

composite_rules:
  - id: lidlplus-ui-python-wheel
    desc: Unofficial Lidl Plus GTK desktop client wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives, whl]
    all:
      - id: wheel-distribution
    any:
      - id: package-name
      - id: author-marker
      - id: lidlplus-api-import
      - id: gtk-libadwaita-marker
