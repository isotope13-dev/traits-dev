# CyberLink PowerCinema's signed CLRCEngine3 remote-control DLL legitimately
# injects a CyberLink hook into the process that owns a selected media window.
# Require the full product, module, PDB, and verified Authenticode identity
# before treating that injection capability as an application exception.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 262144
  crit: notable
  conf: 0.99

traits:
  - id: cyberlink-company
    desc: CyberLink company metadata
    if:
      type: value
      path: pe.version.company
      exact: CyberLink Corp.

  - id: cyberlink-product
    desc: CyberLink PowerCinema product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Cyberlink PowerCinema

  - id: cyberlink-remote-control-description
    desc: CyberLink PowerCinema remote-control module
    if:
      type: value
      path: pe.version.description
      exact: Cyberlink Remote Control Module for PCM

  - id: cyberlink-original-filename
    desc: CyberLink CLRCEngine3 DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: CLRCEngine3.DLL

  - id: cyberlink-remote-control-pdb
    desc: CyberLink CLRCEngine3 PDB basename
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[/\\]CLRCEngine3\.pdb$'

  - id: cyberlink-authenticode-signer
    desc: CyberLink Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=CyberLink,OU=Digital ID Class 3 - Microsoft Software Validation v2,O=CyberLink,'

composite_rules:
  - id: cyberlink-verified-remote-control-module
    desc: Verified CyberLink PowerCinema remote-control DLL identity
    all:
      - id: cyberlink-company
      - id: cyberlink-product
      - id: cyberlink-remote-control-description
      - id: cyberlink-original-filename
      - id: cyberlink-remote-control-pdb
      - id: cyberlink-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: cyberlink-remote-control-injection-context
    desc: Verified CyberLink remote-control DLL injection context
    crit: exception
    conf: 0.99
    all:
      - id: cyberlink-verified-remote-control-module
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
