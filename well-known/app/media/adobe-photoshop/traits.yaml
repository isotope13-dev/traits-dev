# Adobe Photoshop UXP (Unified Extensibility Platform) plugins and CCX packages.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: uxp-manifest-host-photoshop
    desc: UXP manifest targets Adobe Photoshop host
    for: [json]
    if:
      type: value
      path: host.app
      regex: '(?i)^(PS|Photoshop)$'

  - id: uxp-manifest-host-array-photoshop
    desc: UXP manifest host array targets Adobe Photoshop
    for: [json]
    if:
      type: value
      path: host[*].app
      regex: '(?i)^(PS|Photoshop)$'

  - id: uxp-manifest-version
    desc: UXP manifest version declaration
    for: [json]
    if:
      type: value
      path: manifestVersion
      regex: '^[456]$'

  - id: ccx-archive-basename
    desc: Adobe Creative Cloud extension package basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)\.ccx$'

composite_rules:
  - id: photoshop-uxp-manifest
    desc: Adobe Photoshop UXP plugin manifest
    crit: notable
    conf: 0.99
    all:
      - id: uxp-manifest-version
    any:
      - id: uxp-manifest-host-photoshop
      - id: uxp-manifest-host-array-photoshop

  - id: photoshop-uxp-plugin-context
    desc: Adobe Photoshop UXP plugin context
    crit: exception
    conf: 0.99
    any:
      - id: photoshop-uxp-manifest
      - id: ccx-archive-basename
