defaults:
  for:
  - scripts
  - source
  - binaries
  - data
  - text
  - xml
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99

traits:
  - id: plex-transcoder-h264-options
    for: [scripts, source, data, text, xml]
    desc: Plex H264 transcoder preference key
    if:
      type: text
      word: TranscoderH264Options
  - id: plex-transcoder-h264-options-binary
    desc: Plex H264 option-name text in binary
    for: [binaries]
    if:
      type: text
      substr: TranscoderH264Options

composite_rules:
  - id: plex-transcoder-h264-preference
    desc: Plex H264 transcoder preference reference
    any:
      - id: plex-transcoder-h264-options
      - id: plex-transcoder-h264-options-binary
