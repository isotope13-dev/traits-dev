defaults:
  # Same carrier rationale as timeline-subscribe-route; see that file.
  for: [scripts, source, binaries, -mirc, -ircii, -clojure]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: companion-proxy-poll-route
    size_min: 1
    desc: Plex Companion proxy registration route
    if:
      type: text
      substr: /player/proxy/poll
      exclude_comments: true
  - id: timeline-unsubscribe-route
    size_min: 1
    desc: Plex timeline unsubscribe route reference
    if:
      type: text
      substr: /player/timeline/unsubscribe
      exclude_comments: true
  - id: plex-system-resources-route
    size_min: 1
    desc: Plex system plugin resource-fetch route
    if:
      type: text
      regex: '(/system/:/resources/|/:/plugins/com\.plexapp\.system/resources/)'
      exclude_comments: true
  - id: plex-prefs-route
    size_min: 1
    desc: Plex server preferences API route
    if:
      type: text
      substr: /:/prefs
      exclude_comments: true
  - id: plex-direct-play-disabled
    size_min: 1
    desc: Plex transcode parameter disables direct play
    if:
      type: text
      regex: 'directPlay(["'']\s*[,:=]\s*["'']?0|(=|%3[dD])0)'
      exclude_comments: true
  - id: plex-preferences-xml-root
    size_min: 1
    for: [xml]
    desc: Plex Preferences XML root with machine ID
    if:
      type: text
      regex: '<Preferences\b[^>]{0,256}\bMachineIdentifier='
  - id: plex-prefs-put-request-log
    size_min: 64
    for: [text, data]
    desc: Logged PUT request to Plex prefs route
    if:
      type: text
      substr: PUT /:/prefs?
  - id: plex-transcode-route-log
    size_min: 64
    for: [text, data]
    desc: Logged Plex video transcode session route
    if:
      type: text
      substr: /video/:/transcode/
