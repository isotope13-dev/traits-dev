defaults:
  for: [scripts, source, binaries, data, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: plex-plugin-network-function-route
    desc: Plex plugin network-fetch route reference
    for: [scripts, source, data, text]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      regex: 'com\.plexapp\.agents\.[\w.]+(/|%2[fF])function(/|%2[fF])GetResultFromNetwork'
  - id: plex-plugin-network-function-route-binary
    desc: Plex plugin network route in binary
    for: [binaries]
    size_min: 4096
    size_max: 500000000
    if:
      type: text
      regex: 'com\.plexapp\.agents\.[\w.]+(/|%2[fF])function(/|%2[fF])GetResultFromNetwork'
