defaults:
  # Plex route references occur in code and compiled string tables; they are
  # not distinctive in undifferentiated text/data blobs, and chat-script
  # dialects and Clojure cannot carry them, so those types are excluded to
  # stay within the text-matcher file-type cap.
  for: [scripts, source, binaries, -mirc, -ircii, -clojure]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: timeline-subscribe-route
    size_min: 1
    desc: Timeline subscription route reference
    if:
      type: text
      substr: /player/timeline/subscribe
