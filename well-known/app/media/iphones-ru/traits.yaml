# iPhones.ru Simpla2 WordPress theme webpack production bundle.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: webpack-public-path
    desc: iPhones.ru Simpla2 theme webpack public path
    if:
      type: text
      substr: cdn.iphones.ru/wp-content/themes/simpla2/dist/


composite_rules:
  - id: simpla2-theme-bundle
    desc: iPhones.ru Simpla2 WordPress theme bundle
    crit: notable
    conf: 0.99
    all:
      - id: webpack-public-path
      - id: well-known/lib/ui/react::production-error-decoder
