# draw.io Desktop's own bundled webapp source, as it appears inside the
# Electron asar.
#
# Kept in its own file rather than beside the other draw.io traits so that the
# per-file identity below is not confused with the container identities in
# traits.yaml: drawio-asar-context and drawio-application-context both read
# package.json/plist/Mach-O facts and are evaluated on the CONTAINER, which is
# why they cannot acquit a finding that lands on one bundled .js member. See
# the Windows NSIS installers of v29.5.2 and v29.6.6, where
# url-fragment-identity-relay scored `drawio/src/main/webapp/js/app.min.js`
# and `.../js/diagramly/App.js` while the asar identity matched three levels up.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript]

traits:
  # Path matchers see the member path inside an archive, so this lands on the
  # individual script, which is the whole point.
  - id: drawio-webapp-source-path
    desc: draw.io bundled webapp source path
    crit: notable
    conf: 0.97
    size_max: 600000000
    if:
      type: path
      regex: 'drawio/src/main'

composite_rules:
  # `mxShape` alone is an mxGraph token any third-party embedder carries, and
  # the vendored source path alone is just a directory name, so neither
  # acquits on its own; together they are draw.io's own webapp source.
  - id: drawio-webapp-script-context
    desc: draw.io bundled webapp script context
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: drawio-webapp-source-path
    any:
      - id: drawio-shape-resource-script-text
      - id: drawio-mxgraph-shape-key
