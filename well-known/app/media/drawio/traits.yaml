# draw.io (diagrams.net) — shape resource scripts (mxShape) and sidebar
# shape libraries. Benign FP-suppression context: bundled shape libraries
# resemble obfuscated JS payloads / high-entropy identifier carriers. The
# application identity below also identifies the signed macOS Desktop bundle.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript]
traits:
  - id: drawio-shape-resource-script-text
    desc: draw.io shape resource script text
    crit: component
    conf: 0.95
    if:
      type: text
      substr: mxShape
  - id: drawio-shape-resource-script-path
    desc: draw.io shape resource script path
    crit: component
    conf: 0.95
    if:
      type: path
      basename: true
      regex: 'mx[A-Za-z0-9]+\.js$'
  - id: drawio-mxgraph-shape-key
    desc: draw.io mxgraph shape style key
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'shape=mxgraph.'
  - id: drawio-application-bundle-path
    desc: draw.io macOS application bundle member
    crit: notable
    conf: 0.99
    size_max: 600000000
    platforms: [macos]
    for: [binaries, scripts, source, manifests, data, archives]
    if:
      type: path
      regex: '(^|[/\\\\])draw[.]io[.]app([/\\\\]|$)'
  - id: drawio-package-name
    desc: draw.io application package name
    crit: notable
    conf: 0.99
    size_max: 5000000
    platforms: [macos]
    for: [package.json]
    if:
      type: value
      path: name
      exact: draw.io
  - id: drawio-package-entrypoint
    desc: draw.io Electron main entrypoint
    crit: notable
    conf: 0.99
    size_max: 5000000
    platforms: [macos]
    for: [package.json]
    if:
      type: value
      path: main
      exact: src/main/electron.js
  - id: drawio-bundle-identifier
    desc: draw.io macOS bundle identifier
    crit: notable
    conf: 0.99
    size_max: 1000000
    platforms: [macos]
    for: [plist]
    if:
      type: value
      path: CFBundleIdentifier
      exact: com.jgraph.drawio.desktop
  - id: drawio-signing-team
    desc: draw.io macOS signing team identifier
    crit: notable
    conf: 0.99
    size_max: 600000000
    platforms: [macos]
    for: [macho]
    if:
      type: value
      path: macho.code_signature.team_id
      exact: UZEUFB4N53
composite_rules:
  - id: drawio-shape-resource-script
    desc: draw.io shape resource script
    crit: notable
    conf: 0.95
    all:
      - id: drawio-shape-resource-script-text
      - id: drawio-shape-resource-script-path
  - id: drawio-sidebar-shape-library
    desc: draw.io sidebar shape library script
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/files/name::sidebar-prefixed-javascript-basename
      - id: drawio-mxgraph-shape-key
  - id: drawio-asar-context
    desc: draw.io application ASAR context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: drawio-package-name
      - id: drawio-package-entrypoint
  - id: drawio-signed-binary-context
    desc: draw.io signed Electron binary context
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: drawio-application-bundle-path
      - id: drawio-signing-team
  - id: drawio-application-context
    desc: Official draw.io Desktop macOS application bundle
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: drawio-application-bundle-path
      - id: drawio-package-name
      - id: drawio-package-entrypoint
      - id: drawio-bundle-identifier
      - id: drawio-signing-team
