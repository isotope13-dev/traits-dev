# DVDVideoSoft Free Disc Burner is a legitimate .NET desktop utility. Its
# historical Reactor-protected build contains protector stub APIs that can look
# like a managed injector; identify the product before applying those hostile
# loader composites.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 5000000

traits:
  - id: free-disc-burner-product
    desc: Free Disc Burner product identity
    if:
      type: text
      exact: FreeDiscBurner
      section: .text

  - id: free-disc-burner-vendor
    desc: DVDVideoSoft disc burner vendor identity
    if:
      type: text
      exact: DVDVideoSoft Ltd.
      section: .text

  - id: free-disc-burner-namespace
    desc: DVDVideoSoft disc burner assembly namespace
    if:
      type: text
      substr: DVDVideoSoft.DiscBurnerApi
      section: .text

composite_rules:
  - id: free-disc-burner-utility
    desc: Recognized DVDVideoSoft Free Disc Burner utility
    crit: notable
    conf: 0.99
    all:
      - id: free-disc-burner-product
      - id: free-disc-burner-vendor
      - id: free-disc-burner-namespace
