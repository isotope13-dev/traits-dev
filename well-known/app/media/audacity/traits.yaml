defaults:
  platforms: [windows]
  for: [pe, zip]
  size_max: 1000000000

traits:
  - id: audacity-company
    desc: Audacity Team PE company metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.company
      regex: '^\s*Audacity Team\s*$'

  - id: audacity-product
    desc: Audacity PE product metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      regex: '^\s*Audacity\s*$'

  - id: audacity-setup-description
    desc: Audacity versioned setup description
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.description
      regex: '^\s*Audacity [0-9]+\.[0-9]+\.[0-9]+ Setup\s*$'

  - id: audacity-installer-signer
    desc: Musecy-signed Audacity setup
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Musecy SM Ltd\.,O=Musecy SM Ltd\.'

  - id: audacity-wx-runtime-basename
    desc: Audacity bundled wxWidgets x64 runtime filename
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: basename
      regex: '^wxmsw[0-9]+u_core_vc_x64_custom\.dll$'

  - id: audacity-archive-name
    desc: Audacity Windows archive filename
    crit: notable
    conf: 0.98
    for: [zip]
    if:
      type: basename
      exact: Audacity.zip

  - id: audacity-archive-installer-member
    desc: Audacity archive installer member
    crit: notable
    conf: 0.98
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      exact: audacity-win.exe

composite_rules:
  - id: audacity-installer-identity
    desc: Audacity Windows setup identity
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: audacity-company
      - id: audacity-product
      - id: audacity-setup-description
      - id: audacity-installer-signer

  - id: audacity-portable-bundle
    desc: Identified Audacity portable executable bundle
    crit: exception
    conf: 0.99
    for: [zip]
    scope: archive
    all:
      - id: audacity-archive-name
      - id: audacity-archive-installer-member
      - id: metadata/build/archive::archive-unins-executable-member
      - id: metadata/build/archive::archive-hex-named-executable-member
      - id: audacity-company
      - id: audacity-product
      - id: audacity-setup-description
      - id: audacity-installer-signer

  - id: audacity-wx-runtime-identity
    desc: Identified Audacity wxWidgets runtime component
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: audacity-wx-runtime-basename
      - id: audacity-installer-signer
