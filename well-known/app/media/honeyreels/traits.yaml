# HoneyReels / YaWen TV short-drama client (sideloaded as com.redrama.shortsgo).
defaults:
  platforms: [android]
  for: [zip, odf, apk]
  crit: notable
  conf: 0.96
  size_max: 524288000

traits:
  - id: honeyreels-product-brand
    desc: HoneyReels short-drama product brand
    conf: 0.97
    if:
      type: text
      substr: HoneyReels

  - id: yawentv-xapp-api-host
    desc: YaWen TV XApp API host
    conf: 0.98
    if:
      type: text
      substr: xapp-api.yawentv.com

  - id: redrama-shortsgo-package
    desc: Redrama ShortsGo Android package
    conf: 0.97
    if:
      type: text
      substr: com.redrama.shortsgo

composite_rules:
  - id: honeyreels-short-drama-client
    desc: HoneyReels YaWen short-drama client
    conf: 0.99
    needs: 2
    any:
      - id: honeyreels-product-brand
      - id: yawentv-xapp-api-host
      - id: redrama-shortsgo-package
