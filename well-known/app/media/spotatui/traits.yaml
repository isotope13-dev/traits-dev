# spotatui — Spotify terminal client powered by Ratatui
defaults:
  platforms: [windows, unix]
  for: [batch, powershell, rust, cargo.toml, markdown, text, shell]
  crit: notable
  conf: 0.95

traits:
  - id: spotatui-official-installer-url
    desc: spotatui official installer URL
    if:
      type: text
      regex: 'https?://spotatui\.com/install\.(cmd|ps1|sh)'

  - id: spotatui-powershell-piped-installer-command
    desc: spotatui PowerShell installer piped to IEX
    for: [powershell, batch, scripts]
    if:
      type: text
      regex: '(?i)(irm|Invoke-RestMethod)\s+\S*spotatui\.com/install\.ps1\s*\|\s*(iex|Invoke-Expression)'

  - id: spotatui-repository-url
    desc: spotatui official GitHub repository URL
    if:
      type: text
      substr: 'github.com/LargeModGames/spotatui'

  - id: spotatui-cargo-package
    desc: spotatui Cargo package name
    for: [cargo.toml]
    if:
      type: text
      regex: '(?m)^\s*name\s*=\s*"spotatui"\s*$'
