# Ez2Lazer — community osu! lazer fork (https://github.com/SK-la/Ez2Lazer).
defaults:
  platforms: [windows, unix]
  for: [xml, archives, text]
  crit: notable
  conf: 0.99

traits:
  - id: csproj-title
    desc: Ez2Lazer osu.Game project title
    for: [xml]
    if:
      type: text
      substr: <Title>osu! (Ez2Lazer)</Title>

  - id: framework-package-reference
    desc: Ez2Lazer framework NuGet package reference
    for: [xml]
    if:
      type: text
      substr: PackageReference Include="ez2lazer.Framework"

  - id: github-repository
    desc: Ez2Lazer upstream GitHub repository
    for: [text]
    if:
      type: text
      substr: github.com/SK-la/Ez2Lazer

composite_rules:
  - id: ez2lazer-source-identity
    desc: Recognized Ez2Lazer osu! lazer fork source tree
    crit: notable
    conf: 0.99
    for: [xml, archives]
    scope: archive
    all:
      - id: csproj-title
      - id: framework-package-reference
