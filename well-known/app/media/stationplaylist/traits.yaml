defaults:
  platforms: [windows]
  for: [pe]
  size_min: 100000
  size_max: 10000000
  crit: baseline
  conf: 0.98

traits:
  - id: track-tool-description
    desc: StationPlaylist Track Tool PE description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Track Tool

  - id: stationplaylist-copyright
    desc: StationPlaylist copyright metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.copyright
      exact: (c) Copyright 2016 StationPlaylist.com

composite_rules:
  - id: track-tool-identity
    desc: StationPlaylist Track Tool PE metadata identity
    crit: notable
    conf: 0.99
    all:
      - id: track-tool-description
      - id: stationplaylist-copyright
