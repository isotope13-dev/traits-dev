# Tencent Video (QQLive) desktop client: installer, helpers, and the Tencent
# Browsing Service CEF core. qbcore.dll's signing certificate has expired, and
# the engine files it as unverified, so metadata/signature/verified/ does not
# fire here. The identity is version resources plus the build PDB path instead.
# Consumers downgrade rather than suppress, so injection-capable findings stay
# reportable at a lower tier.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: tencent-video-product-versioninfo
    desc: TencentVideo or Tencent Browsing Service product
    if:
      type: value
      path: pe.version.product_name
      regex: '^(TencentVideo|Tencent Browsing Service)$'

  - id: tencent-video-build-pdb-path
    desc: TencentVideo build tree PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)tencentvideo'

composite_rules:
  # Build identity for the Tencent Video client tree. The company string alone
  # is forgeable, so it must pair with the product name or the build PDB path.
  - id: tencent-video-build-identity
    crit: exception
    desc: Tencent Video client build identity
    conf: 0.95
    all:
      - id: metadata/vendor/identity::tencent-version-company
    any:
      - id: tencent-video-product-versioninfo
      - id: tencent-video-build-pdb-path
