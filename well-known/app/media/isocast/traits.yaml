# Isocast — macOS screen recorder. scripts/vm-grant.sh runs as root inside
# the project's test VM, where SIP is off, and pre-grants screen, camera, and
# microphone to the dev engine. Both the engine path and that VM user's TCC
# database have to be present; a TCC write alone still matches.
defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
  conf: 0.99

traits:
  - id: dev-engine-path
    desc: Isocast dev engine app path
    if:
      type: text
      substr: Application Support/Isocast/Isocast Dev.app

  - id: vm-user-tcc-db
    desc: Isocast test VM user TCC database
    if:
      type: text
      substr: /Users/lume/Library/Application Support/com.apple.TCC/TCC.db

composite_rules:
  - id: vm-tcc-pregrant
    desc: Isocast test VM pre-grants its own engine
    crit: exception
    conf: 0.99
    all:
      - id: dev-engine-path
      - id: vm-user-tcc-db
