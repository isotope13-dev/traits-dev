# BrickLink Studio — LEGO CAD. Project `.io` files are ZIP archives whose
# default password is the documented Studio constant soho0909.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 8000000

traits:
  - id: io-zip-password
    desc: BrickLink Studio .io ZIP password
    conf: 0.98
    if:
      type: text
      substr: soho0909
