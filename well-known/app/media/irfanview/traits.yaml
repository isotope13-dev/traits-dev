# IrfanView installer package and application identity.
defaults:
  conf: 0.99
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 100000000

traits:
  - id: irfanview-product-name
    desc: IrfanView product name
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^IrfanView\b'

  - id: irfanview-company-name
    desc: IrfanView author and company name
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: Irfan Skiljan

  - id: irfanview-authenticode-signer
    desc: IrfanView Authenticode signer identity
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Irfan Skiljan,O=Irfan Skiljan\b'

composite_rules:
  - id: irfanview-verified-installer
    desc: Verified IrfanView Windows installer
    crit: notable
    all:
      - id: irfanview-product-name
      - id: irfanview-company-name
      - id: irfanview-authenticode-signer
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv

  - id: irfanview-application-context
    desc: IrfanView application context
    crit: exception
    any:
      - id: irfanview-verified-installer
      - id: irfanview-authenticode-signer
