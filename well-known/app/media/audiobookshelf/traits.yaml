# Audiobookshelf — self-hosted audiobook/podcast server.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: install-lib-path
    desc: Audiobookshelf install library path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'lib/audiobookshelf/'
