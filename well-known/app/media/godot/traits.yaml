# Godot's native runtime is a legitimate source of broad socket and process
# APIs.  Those APIs are also used by the engine's multiplayer and platform
# integrations, so they are benign context for generic binary backdoor rules.
defaults:
  platforms: [unix, windows]
  for: [elf, pe]
  size_min: 1000000
  size_max: 500000000
  conf: 0.98

traits:
  - id: godot-engine-runtime-version
    desc: Godot Engine native runtime version
    crit: notable
    for: [elf]
    unless:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
    if:
      type: text
      section: .rodata
      regex: 'Godot Engine v[0-9]+\.[0-9]+\.[^\r\n]{1,32}'

  - id: godot-engine-project-runtime
    desc: Godot Engine exported project runtime
    crit: notable
    for: [elf]
    unless:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
    if:
      type: text
      section: .rodata
      regex: '(Running Godot Engine project|https://godotengine\.org|Godot Engine contributors)'

  # PE twin of the ELF markers above: Windows builds keep the same banners
  # in .rdata, where a .rodata gate never matches. Raw byte search, not text:
  # the string extractor does not offer these .rdata runs (e.g. Godot Engine
  # v4.7.2.stable.official is in the file but absent from extracted strings),
  # so a text matcher can never fire on them. Kept as separate atoms so the
  # shared exception below stays a two-leaf suppression.
  - id: godot-engine-runtime-version-pe
    desc: Godot Engine native runtime version in PE
    crit: notable
    for: [pe, dll]
    unless:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
    if:
      type: raw
      section: .rdata
      regex: 'Godot Engine v[0-9]+\.[0-9]+\.[^\r\n]{1,32}'

  - id: godot-engine-project-runtime-pe
    desc: Godot Engine exported project runtime in PE
    crit: notable
    for: [pe, dll]
    unless:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
    if:
      type: raw
      section: .rdata
      regex: '(Running Godot Engine project|https://godotengine\.org|Godot Engine contributors)'

composite_rules:
  - id: godot-native-runtime
    desc: Godot native application runtime context
    crit: exception
    for: [elf]
    all:
      - id: godot-engine-runtime-version
      - id: godot-engine-project-runtime

  # Windows-scoped twin of the exception above for PE-only rules: the shared
  # exception only recognizes the ELF markers, so Windows Godot builds need
  # their own suppressor.
  - id: godot-windows-runtime-context
    desc: Godot engine markers in a Windows binary
    crit: exception
    for: [pe, dll]
    all:
      - id: godot-engine-runtime-version-pe
      - id: godot-engine-project-runtime-pe
