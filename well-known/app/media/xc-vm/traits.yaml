# XC_VM — open-source IPTV panel (Vateron-Media/XC_VM). Identity only.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json, zip, tar, gz, shell, text]
  crit: notable
  conf: 0.98

traits:
  - id: xc-vm-composer-name
    desc: XC_VM Composer package name
    for: [composer.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: vateron-media/xc-vm

  - id: xc-vm-repo-url
    desc: XC_VM GitHub repository URL
    for: [php, shell, text]
    conf: 0.98
    if:
      type: text
      regex: 'github\.com/Vateron-Media/XC_VM'
      case_insensitive: true

  - id: xc-vm-namespace
    desc: XC_VM PHP namespace declaration or import
    for: [php]
    conf: 0.98
    if:
      type: text
      regex: '\b(namespace|use)\s+XcVm\\'

  - id: xc-vm-package-tag
    desc: XC_VM package docblock tag
    for: [php]
    conf: 0.98
    if:
      type: text
      regex: '@package\s+XC_VM'

  - id: xc-vm-archive-member
    desc: XC_VM repository archive member path
    conf: 0.97
    if:
      type: path
      regex: '(?i)vateron-media.*xc[-_]vm'

composite_rules:
  - id: xc-vm-identity
    desc: XC_VM IPTV panel identity
    crit: notable
    conf: 0.98
    any:
      - id: xc-vm-composer-name
      - id: xc-vm-repo-url
      - id: xc-vm-namespace
      - id: xc-vm-package-tag
      - id: xc-vm-archive-member
