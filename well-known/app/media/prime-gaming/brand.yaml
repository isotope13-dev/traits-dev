defaults:
  platforms: [unix, windows]
  for: [html]
traits:
  - id: page-title
    desc: Prime Gaming page title
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule prime_gaming_active_title {
          strings:
            $title = /<title\b[^>]{0,80}>[^<]{0,160}\bPrime\s+Gaming\b[^<]{0,160}<\/title\s*>/ nocase
            $comment = /<!--(.|\n|\r)*?-->/
          condition:
            for any i in (1..#title) : (
              not for any j in (1..#comment) : (
                @title[i] >= @comment[j] and
                @title[i] < @comment[j] + !comment[j]
              )
            )
        }
