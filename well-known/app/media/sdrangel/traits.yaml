# SDRangel — Qt SDR and signal-analyzer frontend (f4exb). Vendored
# swagger-ui is API docs; airline ICAO tables are ADS-B labels.
defaults:
  platforms: [unix, windows]
  for: [rpm, tar, gz, archives, text, c, cpp]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 200000000

traits:
  - id: spec-name
    desc: sdrangel RPM spec Name field
    for: [text]
    conf: 0.99
    if:
      type: text
      regex: '(?m)^Name:\s*sdrangel\b'

  - id: github-repo
    desc: f4exb/sdrangel GitHub repository
    for: [text]
    conf: 0.98
    if:
      type: text
      substr: github.com/f4exb/sdrangel

  - id: source-path
    desc: SDRangel versioned source-tree path
    conf: 0.97
    if:
      type: path
      regex: '(?i)(^|[\\/])sdrangel-[0-9]'
