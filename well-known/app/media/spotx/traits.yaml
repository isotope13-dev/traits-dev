# SpotX — open-source Spotify desktop client patcher and ad blocker by amd64fox
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: spotx-repository-url
    desc: SpotX official GitHub repository URL
    for: [powershell, batch, markdown, text]
    if:
      type: text
      regex: '(?i)github\.com/(SpotX-Official|amd64fox)/SpotX\b'

  - id: spotx-pages-url
    desc: SpotX GitHub Pages site URL
    for: [powershell, batch, markdown, text, html]
    if:
      type: text
      regex: '(?i)spotx-official\.github\.io/SpotX\b'

  - id: spotx-call-lang-function
    desc: SpotX CallLang localized script loader function
    if:
      type: text
      substr: 'function CallLang'

  - id: spotx-format-lang-function
    desc: SpotX Format-LanguageCode function
    if:
      type: text
      substr: 'function Format-LanguageCode'

  - id: spotx-binary-patch-call
    desc: SpotX binary patch scanner function
    if:
      type: text
      regex: '(?i)\bFind-[A-Za-z0-9]+BinaryPatchLocation\b'

  - id: spotx-branding-title
    desc: SpotX welcome banner or installation message
    for: [powershell, text, markdown]
    if:
      type: text
      regex: '(?i)(Welcome to SpotX for Windows|Patcher for Spotify Desktop Client)'

composite_rules:
  - id: spotx-context
    desc: Recognized SpotX Spotify desktop patcher
    crit: exception
    needs: 2
    any:
      - id: spotx-call-lang-function
      - id: spotx-format-lang-function
      - id: spotx-binary-patch-call
      - id: spotx-repository-url
      - id: spotx-pages-url
      - id: spotx-branding-title
