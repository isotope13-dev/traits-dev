# Audacious — GTK/Qt audio player (audacious-media-player).
defaults:
  platforms: [unix, windows]
  for: [tar, archives, shell, c, text, desktop-entry]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 80000000

traits:
  - id: source-tarball-name
    desc: Audacious source tarball basename
    for: [tar]
    conf: 0.99
    if:
      type: basename
      regex: '^audacious-[0-9].*\.tar'

  - id: desktop-name
    desc: Audacious desktop application name
    for: [desktop-entry]
    platforms: [linux]
    conf: 0.98
    if:
      type: text
      regex: '(?m)^Name=Audacious$'

  - id: autoconf-package
    desc: Audacious Autoconf package init
    for: [shell, text]
    conf: 0.97
    if:
      type: text
      substr: 'AC_INIT([audacious]'

  - id: pkgconfig-description
    desc: Audacious pkg-config description
    for: [text]
    conf: 0.96
    if:
      type: text
      substr: 'Audacious is a versatile and handy multi platform media player'

  - id: developers-copyright
    desc: Audacious developers copyright
    for: [shell, text]
    conf: 0.95
    if:
      type: text
      substr: 'Audacious developers and others'
