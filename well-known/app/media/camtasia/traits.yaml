# Camtasia Studio's signed DirectShow filter DLLs legitimately use COM
# registration, media resources, GDI/GDI+ capture paths, and diagnostics.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000000
  size_max: 20000000
  crit: notable
  conf: 0.99

traits:
  - id: camtasia-company
    desc: Camtasia Studio TechSmith company metadata
    if:
      type: value
      path: pe.version.company
      exact: TechSmith Corporation

  - id: camtasia-product
    desc: Camtasia Studio product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Camtasia Studio

  - id: camtasia-filter-description
    desc: Camtasia Studio DirectShow filter description
    if:
      type: value
      path: pe.version.description
      exact: Camtasia Studio DirectShow Filters

  - id: camtasia-filter-original-filename
    desc: Camtasia DirectShow filter original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: CamtasiaFilters.dll

  - id: camtasia-filter-pdb
    desc: Camtasia DirectShow filter PDB basename
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[/\\]CamtasiaFilters\.pdb$'

  - id: camtasia-authenticode-signer
    desc: TechSmith Corporation Authenticode signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=TechSmith Corporation,O=TechSmith Corporation,'

composite_rules:
  - id: camtasia-verified-filters
    desc: Verified Camtasia Studio DirectShow filter identity
    all:
      - id: camtasia-company
      - id: camtasia-product
      - id: camtasia-filter-description
      - id: camtasia-filter-original-filename
      - id: camtasia-filter-pdb
      - id: camtasia-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: camtasia-known-app-context
    desc: Known signed Camtasia Studio media-filter context
    crit: exception
    all:
      - id: camtasia-verified-filters
      - id: camtasia-authenticode-signer
