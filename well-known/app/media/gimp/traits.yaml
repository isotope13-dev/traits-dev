defaults:
  platforms: [windows]
  for: [pe, zip]
  size_max: 1000000000

traits:
  - id: gimp-company
    desc: The GIMP Team PE company metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.company
      regex: '^\s*The GIMP Team\s*$'

  - id: gimp-product
    desc: GIMP PE product metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      regex: '^\s*GIMP\s*$'

  - id: gimp-setup-description
    desc: GIMP Setup PE description
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.description
      regex: '^\s*GIMP Setup\s*$'

  - id: gimp-installer-comment
    desc: GIMP-specific installer comment
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: value
      path: pe.version.comments
      regex: '(?i)\bGIMP\b'

  - id: gimp-uninstaller-product
    desc: GIMP uninstaller product metadata
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      regex: '^\s*Gimp\s*$'

  - id: gimp-uninstaller-description
    desc: GIMP-specific uninstaller description
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^\s*GIMP\s+(Setup|Uninstall)\s*$'

  - id: gimp-archive-name
    desc: GIMP Windows archive filename
    crit: notable
    conf: 0.98
    for: [zip]
    if:
      type: basename
      exact: GIMP.zip

  - id: gimp-archive-installer-member
    desc: GIMP archive installer member
    crit: notable
    conf: 0.98
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      exact: gimp-setup.exe

composite_rules:
  - id: gimp-installer-identity
    desc: GIMP Windows setup identity
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: gimp-company
      - id: gimp-product
      - id: gimp-setup-description

  - id: gimp-uninstaller-identity
    desc: GIMP Inno uninstaller identity
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: gimp-uninstaller-product
      - id: gimp-uninstaller-description

  - id: gimp-installer-archive-context
    desc: Identified GIMP installer archive
    crit: exception
    conf: 0.99
    for: [zip]
    scope: archive
    all:
      - id: gimp-archive-name
      - id: gimp-archive-installer-member
      - id: gimp-company
      - id: gimp-product
      - id: gimp-setup-description
      - id: gimp-uninstaller-product
      - id: gimp-uninstaller-description
