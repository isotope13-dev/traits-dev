# Jellyfin web client — GPL HTML5 UI for the Jellyfin media server.
# emby-input / emby-textarea custom elements wrap native value setters
# so labeled controls stay in sync; that hook is product UI, not a clipper.
defaults:
  platforms: [unix, windows]
  for: [apk, text, html, javascript, json, archives]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 120000000

traits:
  - id: apk-pkgname
    desc: jellyfin-web APK package name
    for: [apk, text]
    platforms: [linux]
    conf: 0.99
    if:
      type: text
      substr: 'pkgname = jellyfin-web'

  - id: apk-origin
    desc: jellyfin-web APK origin field
    for: [apk, text]
    platforms: [linux]
    conf: 0.99
    if:
      type: text
      substr: 'origin = jellyfin-web'

  - id: github-repo
    desc: jellyfin-web GitHub repository
    for: [text, json]
    conf: 0.98
    if:
      type: text
      substr: github.com/jellyfin/jellyfin-web

  - id: webpack-bundle
    desc: jellyfin-web main webpack bundle
    for: [html, javascript]
    conf: 0.98
    if:
      type: text
      substr: main.jellyfin.bundle

  - id: install-path
    desc: jellyfin-web install tree path
    conf: 0.96
    if:
      type: path
      regex: '(?i)jellyfin[\\/]jellyfin-web'

composite_rules:
  - id: jellyfin-web-apk
    desc: jellyfin-web APK package identity
    crit: notable
    conf: 0.99
    for: [apk, text]
    platforms: [linux]
    all:
      - id: apk-pkgname
      - id: apk-origin

  - id: jellyfin-web-client
    desc: Jellyfin HTML5 web client
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: jellyfin-web-apk
      - id: github-repo
      - id: webpack-bundle
      - id: install-path
