# CloudCompare — GPL 3D point-cloud / mesh processing (cloudcompare.org).
# Bundled Equation Editor Word docs are math figures, not CVE-2017-11882.
# setup-miniconda is GitHub Actions CI for CCCoreLib, not this product.
defaults:
  platforms: [unix, windows]
  for: [tar, archives, text, markdown, cpp, c]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 200000000

traits:
  - id: github-repo
    desc: CloudCompare GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/CloudCompare/CloudCompare

  - id: homepage
    desc: CloudCompare project homepage
    conf: 0.97
    if:
      type: text
      substr: https://cloudcompare.org

  - id: cmake-project
    desc: CloudCompare CMake project name
    for: [text]
    conf: 0.98
    if:
      type: text
      substr: project( CloudCompareProjects )

  - id: source-path
    desc: CloudCompare versioned source-tree path
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[\\/])cloudcompare-'

composite_rules:
  - id: cloudcompare-source
    desc: CloudCompare 3D point-cloud processor
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: github-repo
      - id: homepage
      - id: cmake-project
      - id: source-path
