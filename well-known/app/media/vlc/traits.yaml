defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
  size_max: 2147483648

traits:
  # The unpacked source tree. VLC implements TLS (modules/misc/securetransport.c)
  # and its own HTTP/1 parser (modules/access/http/), so protocol-level rules
  # read its implementation of a mechanism as use of it.
  - id: source-tree-context
    desc: VLC source tree member
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, makefile, text, data, python]
    if:
      type: path
      regex: '(?i)vlc-[0-9][0-9a-z.-]*'

  - id: windows-portable-archive
    desc: VLC Windows portable archive
    for: [7z, pe, javascript]
    if:
      type: path
      regex: '(?i)vlc-[0-9][^\\/]*win(32|64)[^\\/]*\.7z$'
  - id: nsis-vlc-exe-name
    desc: VLC executable name inside NSIS installer
    crit: notable
    for: [pe]
    if:
      type: text
      substr: vlc.exe
      section: .rdata
  - id: nsis-libvlc-name
    desc: VLC library name inside NSIS installer
    crit: notable
    for: [pe]
    if:
      type: text
      substr: libvlc.dll
      section: .rdata
  - id: nsis-access-plugin-path
    desc: VLC access plugin path inside NSIS installer
    crit: notable
    for: [pe]
    if:
      type: text
      substr: plugins/access/libaccess_
      section: .rdata

composite_rules:
  - id: windows-nsis-bundle
    desc: VLC Windows NSIS installer bundle
    for: [pe]
    all:
      - id: metadata/binary/installer/script::nsis-manifest-exehead
    any:
      - id: nsis-vlc-exe-name
      - id: nsis-libvlc-name
      - id: nsis-access-plugin-path
    needs: 2
