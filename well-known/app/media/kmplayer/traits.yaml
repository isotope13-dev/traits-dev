defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  size_max: 100000000

traits:
  - id: kmplayer-product-name
    desc: KMPlayer product name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: KMPlayer

  - id: kmplayer-original-filename
    desc: KMPlayer64.exe original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: KMPlayer64.exe

  - id: kmplayer-team-company
    desc: KMPlayer Team company name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: KMPlayer Team

composite_rules:
  - id: signed-kmplayer-executable
    desc: Authenticode-verified KMPlayer executable
    crit: notable
    conf: 1.0
    all:
      - id: kmplayer-product-name
      - id: kmplayer-original-filename
      - id: kmplayer-team-company
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
