defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, markdown, tar]
  crit: baseline
  conf: 0.99

traits:
  - id: spotiflyer-source-package
    desc: SpotiFlyer Kotlin source package namespace
    crit: notable
    conf: 0.99
    for: [java, kotlin]
    if:
      type: text
      regex: '(?m)^\s*package\s+com\.shabinder\.spotiflyer(\.[A-Za-z_][A-Za-z0-9_]{0,63})?\s*$'

  - id: spotiflyer-source-readme
    desc: SpotiFlyer source README archive member
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      regex: 'SpotiFlyer-[^/\\]+[/\\]README\.md$'

  - id: spotiflyer-repository-reference
    desc: SpotiFlyer official GitHub repository reference
    crit: notable
    conf: 0.99
    for: [java, kotlin, markdown]
    if:
      type: text
      regex: 'github\.com/Shabinder/SpotiFlyer'

composite_rules:
  - id: spotiflyer-source-archive
    desc: Recognized SpotiFlyer source archive
    crit: notable
    conf: 0.995
    scope: archive
    for: [tar]
    all:
      - id: spotiflyer-source-package
      - id: spotiflyer-source-readme
      - id: spotiflyer-repository-reference

  - id: spotiflyer-source-battery-context
    desc: SpotiFlyer source background-download battery context
    crit: exception
    conf: 0.995
    for: [java, kotlin]
    all:
      - id: spotiflyer-source-package
      - id: micro-behaviors/os/privilege/check::android-battery-optimization-status
      - id: micro-behaviors/os/privilege/check::android-request-ignore-battery-action
      - id: micro-behaviors/os/message/intent::android-start-activity

  - id: spotiflyer-source-archive-battery-context
    desc: SpotiFlyer archive background-download battery context
    crit: exception
    conf: 0.995
    scope: archive
    for: [tar]
    all:
      - id: spotiflyer-source-package
      - id: spotiflyer-source-readme
      - id: spotiflyer-repository-reference
      - id: micro-behaviors/os/privilege/check::android-battery-optimization-status
      - id: micro-behaviors/os/privilege/check::android-request-ignore-battery-action
      - id: micro-behaviors/os/message/intent::android-start-activity
      - id: micro-behaviors/ui/window/notify/message::android-rich-notification-actions
