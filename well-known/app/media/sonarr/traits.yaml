# Sonarr — GPL TV-series PVR / media manager (sonarr.tv). Official builds are
# self-contained .NET publishes that ship Microsoft.NETCore.App runtime packs.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 10000
  size_max: 200000000

traits:
  - id: product-name
    desc: Sonarr product name
    if:
      type: value
      path: pe.version.product_name
      exact: Sonarr

  - id: company-name
    desc: sonarr.tv company metadata
    if:
      type: value
      path: pe.version.company
      exact: sonarr.tv

  - id: copyright-marker
    desc: Sonarr GPL copyright string
    if:
      type: value
      path: pe.version.copyright
      regex: '(?i)sonarr\.tv.*GNU General Public'

  - id: original-filename
    desc: Sonarr.dll original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Sonarr.dll

composite_rules:
  - id: sonarr-official-binary
    desc: Official Sonarr application binary
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: company-name
      - id: copyright-marker

  - id: sonarr-official-context
    desc: Official Sonarr application context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: product-name
      - id: company-name
      - id: copyright-marker
      - id: original-filename
