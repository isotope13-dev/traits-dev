# Bandicam's signed recorder binaries legitimately use screen capture, input
# hooks, clipboard access, and startup task registration.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 131072
  size_max: 100000000

traits:
  - id: bandicam-product-identity
    desc: Bandicam PE product identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: bdcam

  - id: bandicam-company-identity
    desc: Bandicam PE company identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Bandicam Company

  - id: bandicam-authenticode-signer
    desc: Bandicam Authenticode signer identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=Bandicam Company Corp\.,O=Bandicam Company Corp\.'

composite_rules:
  - id: bandicam-verified-binary
    desc: Verified Bandicam Windows binary
    crit: notable
    conf: 0.99
    all:
      - id: bandicam-product-identity
      - id: bandicam-company-identity
      - id: bandicam-authenticode-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: bandicam-known-app-context
    desc: Verified Bandicam recorder application context
    crit: exception
    conf: 0.99
    all:
      - id: bandicam-verified-binary
      - id: bandicam-authenticode-signer
