# PhotoPrism's own HTTPS bootstrap generates a private issuer and installs it
# with update-ca-certificates. That is the product's default TLS certificate,
# not a forged trust anchor dropped by an intruder.
defaults:
  platforms: [unix]
  for: [shell, go]
  crit: notable
  conf: 0.98

traits:
  - id: photoprism-source-tree-path
    desc: PhotoPrism source tree path
    for: [shell, go, media]
    if:
      type: path
      regex: '(?i)photoprism/photoprism'
  - id: photoprism-default-tls-script
    desc: PhotoPrism default TLS installer
    if:
      type: text
      substr: PHOTOPRISM_DEFAULT_TLS
