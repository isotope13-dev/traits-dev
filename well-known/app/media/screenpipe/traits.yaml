# Screenpipe is a signed Windows desktop capture and activity-search product.
# Its binary legitimately combines window/input capture, local API, integration,
# and hardware-query code that generic stealer heuristics may otherwise join.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: screenpipe-pdb-identity
    desc: Screenpipe Windows binary PDB identity
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: screenpipe.pdb
      case_insensitive: true

  - id: screenpipe-signer-identity
    desc: Screenpipe Mediar Authenticode signer identity
    size_min: 1000000
    size_max: 100000000
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=Mediar\\, Inc'

  - id: screenpipe-api-identity
    desc: Screenpipe product API endpoint identity
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rdata
      regex: '(?i)(api\.screenpipe\.com|screenpi\.pe)'

composite_rules:
  - id: screenpipe-known-app-context
    desc: Recognized signed Screenpipe capture application context
    crit: exception
    conf: 0.99
    all:
      - id: screenpipe-pdb-identity
      - id: screenpipe-signer-identity
      - id: screenpipe-api-identity
