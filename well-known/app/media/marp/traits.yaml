defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: marp-team-package-name
    desc: Official Marp Team package identity
    crit: notable
    if:
      type: value
      path: name
      regex: '^(@marp-team/(marp-(cli|core)|marpit(-svg-polyfill)?)|marp-vscode)$'
  - id: marp-team-repository
    desc: Official Marp Team GitHub repository identity
    crit: notable
    if:
      type: text
      regex: 'github\.com/marp-team/(marp-(cli|core|vscode)|marpit(-svg-polyfill)?)'
  - id: marp-team-release-version-script
    desc: Marp Team release version script
    crit: notable
    if:
      type: value
      path: scripts.version
      substr: 'raw.githubusercontent.com/marp-team/actions/v1/lib/scripts/version.js | node'

composite_rules:
  - id: marp-team-release-context
    desc: Recognized Marp Team release package context
    crit: component
    all:
      - id: marp-team-package-name
      - id: marp-team-repository
      - id: marp-team-release-version-script
  - id: marp-vscode-archive-context
    desc: Recognized Marp VS Code extension archive
    crit: exception
    for: [vsix, package.json, javascript, shell, zip]
    scope: archive
    all:
      - id: marp-team-package-name
      - id: marp-team-repository
