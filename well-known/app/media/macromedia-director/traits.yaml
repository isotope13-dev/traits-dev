# Macromedia Director MX 2004 authoring and player runtime components.
# Director projectors bundle Proj.dll (which exports ProjectorMain and carries
# original_filename Otto.exe from the Director Projector codebase) and modular
# Xtra DLLs (.x32) such as XMLParser.x32 containing high-entropy data tables.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 20971520

traits:
  - id: director-product-name
    desc: Director MX product version metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Director (MX|Player)'

  - id: director-player-description
    desc: Director Player description metadata
    if:
      type: value
      path: pe.version.description
      exact: Director Player

  - id: director-otto-original-filename
    desc: Director projector Otto.exe original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Otto.exe

  - id: director-projector-main-export
    desc: Exports ProjectorMain entrypoint
    if:
      type: export
      exact: ProjectorMain

  - id: director-xtra-description
    desc: Macromedia Director Xtra description metadata
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^Macromedia .* Xtra$'

composite_rules:
  - id: macromedia-director-projector-dll
    desc: Macromedia Director Player projector DLL
    crit: notable
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/version-resource/plugin::macromedia-flash-company-claim
      - id: director-product-name
      - id: director-player-description
      - id: director-otto-original-filename
      - id: director-projector-main-export

  - id: macromedia-director-xtra-plugin
    desc: Macromedia Director Xtra plugin DLL
    crit: notable
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/version-resource/plugin::macromedia-flash-company-claim
      - id: director-product-name
      - id: director-xtra-description

  - id: macromedia-director-runtime-component
    desc: Macromedia Director runtime component
    crit: notable
    conf: 0.98
    any:
      - id: macromedia-director-projector-dll
      - id: macromedia-director-xtra-plugin
