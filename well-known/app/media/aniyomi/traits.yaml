defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: versioned-application-identity
    desc: Aniyomi anime and manga application
    if:
      type: text
      regex: 'Aniyomi v[0-9.]+ \(xyz\.jmir\.tachiyomi\.mi\)'
  - id: mpv-player-class
    desc: Aniyomi MPV player integration class
    if:
      type: text
      substr: 'Leu/kanade/tachiyomi/ui/player/AniyomiMPVView;'
