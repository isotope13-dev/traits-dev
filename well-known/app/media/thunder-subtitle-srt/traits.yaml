# thunder-subtitle-srt — CLI for Xunlei (Thunder) Chinese subtitle
# search and download (Jellyfin library scan). requests.get of subtitle
# URLs is the product, not C2. Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: thunder_subtitle_srt wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: thunder_subtitle_srt

  - id: package-metadata-name
    desc: thunder-subtitle-srt PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*thunder-subtitle-srt\s*$'

  - id: xunlei-oracle-api
    desc: Xunlei shoulei oracle subtitle API
    for: [python, text]
    if:
      type: text
      substr: api-shoulei-ssl.xunlei.com/oracle

  - id: download-timeout-env
    desc: Thunder subtitle download timeout env
    for: [python, text]
    if:
      type: text
      substr: THUNDER_SUBTITLE_DOWNLOAD_TIMEOUT

composite_rules:
  - id: thunder-subtitle-srt-package
    desc: Thunder Xunlei subtitle CLI package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: xunlei-oracle-api
      - id: download-timeout-env
    needs: 2
