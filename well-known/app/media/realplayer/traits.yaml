defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: realplayer-32-product-version
    desc: RealPlayer 32-bit product name in resource
    if:
      type: text
      exact: RealPlayer (32-bit)
      section: .rsrc
composite_rules:
  - id: realplayer-upgrade-helper-resource-context
    desc: RealPlayer upgrade helper resource identity
    for: [pe]
    conf: 0.97
    size_min: 60000
    size_max: 300000
    all:
      - id: metadata/binary/provenance/version-fields::upgrade-helper-resource-label
      - id: metadata/vendor/string::realnetworks-company-version
      - id: realplayer-32-product-version
      - id: metadata/binary/provenance/version-fields::upgrdhlp-original-filename
      - id: metadata/binary/provenance/version-fields::upgrdhlp-internal-name
    near_bytes: 1024
