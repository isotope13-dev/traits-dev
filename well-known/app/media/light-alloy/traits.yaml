# Light Alloy — Vortex Team Windows media player (Inno Setup releases).
# Unsigned Inno installers are frequently generic-detected (Sonbokli/Mokes/Babar);
# product metadata distinguishes the legitimate player from opaque nested Inno
# malware loaders.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 500000
  size_max: 50000000

traits:
  - id: light-alloy-product-name
    desc: Light Alloy PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: Light Alloy

  - id: light-alloy-company-url
    desc: Light Alloy company URL metadata
    if:
      type: value
      path: pe.version.company
      exact: https://light-alloy.com

  - id: light-alloy-original-filename
    desc: LA.exe OriginalFilename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: LA.exe

  - id: light-alloy-internal-name
    desc: Light Alloy media player internal name
    conf: 0.95
    if:
      type: value
      path: pe.version.internal_name
      exact: Light Alloy - media player for Windows

  - id: light-alloy-vortex-copyright
    desc: Vortex Team Light Alloy copyright
    conf: 0.98
    if:
      type: value
      path: pe.version.copyright
      regex: '(?i)Vortex Team'

composite_rules:
  - id: light-alloy-product-identity
    desc: Light Alloy media player product identity
    crit: notable
    conf: 0.99
    all:
      - id: light-alloy-product-name
      - id: light-alloy-company-url
      - id: light-alloy-original-filename
      - id: light-alloy-vortex-copyright

  - id: light-alloy-inno-installer-context
    desc: Light Alloy Inno Setup installer context
    crit: exception
    conf: 0.99
    all:
      - id: light-alloy-product-identity
      - id: metadata/binary/installer/script::inno-setup
