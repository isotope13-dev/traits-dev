# Bentley MicroStation — CAD drafting/design application (DGN format).
#
# A V8 or CONNECT-edition .dgn is an OLE2 compound file: its SummaryInformation
# names the authoring application, and its storages hold the Dgn~* element
# streams (Dgn~H header, Dgn-Md model storages, Dgn^Nm named groups). Nothing
# in that layout is executable — no VBA project stream, no ObjectPool — but the
# container looks enough like a Windows Installer database from the outside that
# generic OLE summary-property rules misread a drawing's Subject/Author.
# Identifying the format positively is what keeps those apart.
defaults:
  platforms: [windows, unix]
  for: [oledoc]

traits:
  - id: microstation-authoring-application
    desc: Document application is MicroStation
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.application
      regex: '^MicroStation\b'

  - id: dgn-model-storage
    desc: DGN design-file model storage in OLE
    crit: notable
    conf: 0.97
    if:
      type: value
      path: office.streams[*]
      regex: '^/Dgn-Md(/|$)'
