# Jackett — open-source indexer proxy (github.com/Jackett/Jackett). Official
# Mono/.NET publishes keep the Visual Studio MyApplication.app manifest and a
# hash-derived far-future COFF stamp; Process.Start is updater/console host
# behavior, not a templated masquerade loader.
defaults:
  platforms: [windows, unix]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 8000
  size_max: 80000000

traits:
  - id: console-original-filename
    desc: JackettConsole original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: JackettConsole.exe

  - id: updater-original-filename
    desc: JackettUpdater original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: JackettUpdater.exe

  - id: console-basename
    desc: JackettConsole executable basename
    if:
      type: path
      basename: true
      exact: JackettConsole.exe

  - id: updater-basename
    desc: JackettUpdater executable basename
    if:
      type: path
      basename: true
      exact: JackettUpdater.exe

composite_rules:
  - id: jackett-console-binary
    desc: Official Jackett console binary
    crit: notable
    conf: 0.99
    all:
      - id: console-original-filename
      - id: console-basename

  - id: jackett-updater-binary
    desc: Official Jackett updater binary
    crit: notable
    conf: 0.99
    all:
      - id: updater-original-filename
      - id: updater-basename

  - id: jackett-official-binary
    desc: Official Jackett application binary
    crit: notable
    conf: 0.99
    any:
      - id: jackett-console-binary
      - id: jackett-updater-binary
