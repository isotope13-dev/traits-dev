# Jackett tracker definitions (Definitions/*.yml): declarative scraping
# schemas -- site links, Torznab category mappings, and CSS selectors for
# result rows -- that Jackett's own engine interprets. They hold no code.
defaults:
  platforms: [windows, unix]
  for: [yaml]
  crit: notable
  conf: 0.9
  size_min: 200
  size_max: 200000

traits:
  - id: indexer-definition-category-mappings
    desc: Torznab category mappings declared
    if:
      type: value
      path: caps.categorymappings
      exists: true

  - id: indexer-definition-search-rows-selector
    desc: Search result row selector declared
    if:
      type: value
      path: search.rows.selector
      exists: true

  - id: indexer-definition-search-paths
    desc: Search request paths declared
    if:
      type: value
      path: search.paths
      exists: true

composite_rules:
  - id: indexer-definition-schema
    desc: Jackett indexer definition schema
    conf: 0.9
    all:
      - id: indexer-definition-category-mappings
      - id: indexer-definition-search-rows-selector
      - id: indexer-definition-search-paths
