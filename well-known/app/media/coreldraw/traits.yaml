# CorelDRAW — SVG export stamps a stable ODM namespace and creator comment.
defaults:
  platforms: [unix, windows]
  for: [svg]
  crit: notable
  conf: 0.98
  size_min: 128
  size_max: 100000000

traits:
  - id: svg-odm-namespace
    desc: CorelDRAW SVG ODM namespace
    if:
      type: text
      substr: http://www.corel.com/coreldraw/odm/2003
  - id: svg-creator-comment
    desc: CorelDRAW SVG creator comment
    if:
      type: text
      substr: 'Creator: CorelDRAW'

composite_rules:
  - id: exported-svg
    desc: SVG exported from CorelDRAW
    crit: notable
    conf: 0.99
    all:
      - id: svg-odm-namespace
      - id: svg-creator-comment
