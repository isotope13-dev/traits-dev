# MediaForge is a documented, GPL-licensed media downloader. Its browser
# module explicitly solves provider challenges encountered while retrieving
# media, so the generic multi-provider CAPTCHA composite is not malware in
# this package context.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python]
  conf: 0.99

traits:
  - id: mediaforge-package-name
    desc: MediaForge distribution metadata
    crit: notable
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*mediaforge\s*$'

composite_rules:
  - id: mediaforge-captcha-context
    desc: Recognized MediaForge CAPTCHA context
    crit: exception
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: mediaforge-package-name
      - id: objectives/evasion/security-bypass/anti-bot::browser-captcha-solving-capability
