defaults:
  platforms: [windows, unix]
  for: [c, cpp, batch, text]

traits:
  - id: obs-source-path
    desc: OBS Studio source tree path
    crit: baseline
    conf: 0.95
    if:
      type: path
      regex: 'obs-studio-.{0,40}sources'

  - id: obs-project-string
    desc: OBS Studio project string
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: OBS Studio

  - id: obs-project-signer
    desc: OBS Project code-signing certificate
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 4096
    size_max: 52428800
    if:
      id: metadata/signed/leaf::obs-project-llc

  - id: obs-project-company
    desc: OBS Project PE company metadata
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    size_min: 4096
    size_max: 52428800
    if:
      type: value
      path: pe.version.company
      exact: OBS Project

composite_rules:
  - id: obs-studio-identity
    desc: OBS Studio source distribution
    crit: notable
    conf: 0.95
    any:
      - id: obs-source-path
      - id: obs-project-string

  - id: obs-signed-binary
    desc: Signed OBS Project binary component
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: obs-project-signer
      - id: obs-project-company

  - id: obs-signed-binary-context
    desc: Recognized signed OBS binary context
    crit: exception
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: obs-project-signer
      - id: obs-signed-binary
