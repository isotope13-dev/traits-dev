defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 20000000

traits:
  - id: mscorsvw-original-filename
    desc: .NET Runtime Optimization Service filename
    if:
      type: value
      path: pe.version.original_filename
      exact: mscorsvw.exe

  - id: mscorsvw-company
    desc: Microsoft .NET runtime publisher
    if:
      type: value
      path: pe.version.company
      regex: '^Microsoft Corporation$'

  - id: mscorsvw-description
    desc: .NET Runtime Optimization Service description
    if:
      type: value
      path: pe.version.description
      exact: .NET Runtime Optimization Service

composite_rules:
  - id: mscorsvw-runtime
    desc: Recognized Microsoft .NET runtime optimization service
    crit: exception
    conf: 0.99
    all:
      - id: mscorsvw-original-filename
      - id: mscorsvw-company
      - id: mscorsvw-description
