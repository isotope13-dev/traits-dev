# Solstone is the sol pbc local-first journal and AI application.  It ships
# explicit provider downloads, local services, agent workers, and web apps;
# these are expected product capabilities, not hidden payload behavior.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Solstone Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: solstone

  - id: project-repository
    desc: Solstone upstream repository
    if:
      type: text
      substr: github.com/solpbc/solstone-journal

  - id: source-module
    desc: Solstone Python source module
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])solstone[\\/]'

composite_rules:
  - id: solstone-application
    desc: Solstone local-first journal application
    crit: notable
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: wheel-distribution
    any:
      - id: project-repository
      - id: source-module
