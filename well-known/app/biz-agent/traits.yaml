# BizAgent — AI task manager VS Code extension with kanban board.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: biz-agent-vsix-name
    desc: BizAgent VSIX archive name
    crit: notable
    for: [archives]
    if:
      type: path
      regex: '(?i)biz-agent.*\.vsix$'

  - id: biz-agent-package-name
    desc: BizAgent extension package name
    crit: notable
    for: [archives, javascript, json, package.json]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"biz-agent"'

  - id: biz-agent-publisher
    desc: yohei1996 VS Code publisher marker
    crit: notable
    for: [archives, javascript, json, package.json, vsix-manifest]
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"yohei1996"'

  - id: biz-agent-command-namespace
    desc: BizAgent kanban command namespace marker
    crit: notable
    for: [javascript, json, package.json]
    if:
      type: text
      substr: bizAgent-task-kanban.openKanbanBoard

  - id: biz-agent-github-repo
    desc: BizAgent official GitHub repository
    crit: notable
    for: [javascript, json, package.json, vsix-manifest]
    if:
      type: text
      substr: github.com/yohei1996/biz-agent

composite_rules:
  - id: biz-agent-vscode-extension
    desc: BizAgent AI task manager VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: biz-agent-publisher
    any:
      - id: biz-agent-vsix-name
      - id: biz-agent-package-name
      - id: biz-agent-github-repo
      - id: biz-agent-command-namespace
