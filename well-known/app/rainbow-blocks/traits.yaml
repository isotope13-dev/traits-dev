# rainbow-blocks — cadenza-tech bracket colorizer VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: rainbow-blocks-vsix-name
    desc: Rainbow Blocks VSIX archive name
    if:
      type: path
      regex: '(?i)cadenza-tech\.rainbow-blocks'

  - id: rainbow-blocks-package-name
    desc: Rainbow Blocks extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"rainbow-blocks"'

  - id: rainbow-blocks-publisher
    desc: cadenza-tech VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"cadenza-tech"'

  - id: rainbow-blocks-config-marker
    desc: Rainbow Blocks configuration namespace
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: rainbowBlocks.

composite_rules:
  - id: rainbow-blocks-vscode-extension
    desc: Rainbow Blocks bracket colorizer extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: rainbow-blocks-publisher
    any:
      - id: rainbow-blocks-vsix-name
      - id: rainbow-blocks-package-name
      - id: rainbow-blocks-config-marker
