# im.codes / imcodes — remote AI coding agent with a device-bound daemon
# (LaunchAgent / systemd user service / Windows scheduled watchdog) and an
# open-computer-use helper. Guarddog and Socket often flag the persistence
# and UI-automation surfaces; those are product features, not malware.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: imcodes-bind-url
    desc: imcodes bind URL for device pairing
    if:
      type: text
      substr: 'https://app.im.codes/bind/'
  - id: imcodes-daemon-plist-label
    desc: imcodes LaunchAgent daemon label
    if:
      type: text
      substr: 'imcodes.daemon'
  - id: imcodes-creds-dir
    desc: imcodes credentials directory path
    if:
      type: text
      substr: '.imcodes'

composite_rules:
  - id: imcodes-agent-identity
    desc: imcodes remote AI coding agent
    conf: 0.96
    all:
      - id: imcodes-bind-url
      - id: imcodes-daemon-plist-label
