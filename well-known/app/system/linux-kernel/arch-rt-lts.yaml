defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 1.0

traits:
  - id: arch-rt-lts-vmlinux
    desc: Arch Linux RT LTS kernel ELF
    size_min: 67406456
    size_max: 67406456
    if:
      type: yara
      source: |
        import "hash"

        rule arch_rt_lts_vmlinux {
          condition:
            // vmlinux from signed linux-rt-lts-headers 6.6.87.rt54.arch1-7.
            hash.sha256(0, filesize) ==
              "20c7dba2b621fa554a15946ce79409a5e5a69a2bf53ed0be47d57879690c2e57"
        }
