---
defaults:
  platforms:
  - macos
  for:
  - plist
  crit: notable
traits:
- id: apple-mobiledevice-updater-resource
  desc: Apple MobileDevice updater name in plist
  conf: 0.9
  if:
    type: text
    substr: com.apple.mobiledeviceupdater
- id: apple-hardware-icon-resource
  desc: Apple iPhone X icon name in plist
  conf: 0.85
  if:
    type: text
    substr: com.apple.iphone-x-1
- id: apple-mobiledevice-ui-resource
  desc: MobileDevice update controller name in plist
  conf: 0.85
  if:
    type: text
    substr: MobileDeviceUpdateController
composite_rules:
- id: coderesources-apple-component-clues
  desc: CodeResources with Apple component references
  conf: 0.85
  all:
  - id: metadata/signature/resource::coderesources-plist
  any:
  - id: apple-mobiledevice-updater-resource
  - id: apple-hardware-icon-resource
  - id: apple-mobiledevice-ui-resource
