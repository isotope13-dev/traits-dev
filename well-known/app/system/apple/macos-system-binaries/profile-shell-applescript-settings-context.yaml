# A shell call and an app-name reference do not establish settings automation
# or attacker intent: an ordinary dialog can use this title.
defaults:
  platforms: [macos]
  for: [applescript]
composite_rules:
  - id: shell-with-settings-reference
    desc: AppleScript shell call with settings-app name
    crit: notable
    conf: 0.85
    all:
      - id: well-known/app/system/apple/macos-system-binaries::settings-app-name-reference
      - id: "micro-behaviors/process/create/shell/command-string::shell-command-text-reference"
