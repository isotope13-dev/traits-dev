defaults:
  platforms: [macos]
  for: [shell, javascript, typescript, go, python, macho]


traits:
  - id: apple-like-cache-service-name
    desc: Apple-like cache or service name
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(com\.apple\.(verified|homeenergyd)|/com\.apple\.softwareupdate/SoftwareUpdate)\b'
