# Apple XNU kernel source (opensource.apple.com, vendored by Darling and
# others). The kernel itself implements the hook surfaces the kernel-hide
# family keys on: the IP filter KPI (bsd/netinet/kpi_ipfilter.c), KUNC
# (osfmk/UserNotification), sysctl OID handlers and the DTrace providers
# ported from OpenSolaris (bsd/dev/dtrace, CDDL-licensed).
#
# Like linux-kernel-source-context, a header alone is not context: the file
# must also sit in an XNU top-level subsystem directory.
defaults:
  platforms: [macos]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: apsl-osreference-header
    desc: Apple APSL license header marker
    if:
      type: text
      regex: '@APPLE_(OSREFERENCE_)?LICENSE_HEADER_START@'

  - id: opensolaris-cddl-header
    desc: OpenSolaris CDDL license header
    if:
      type: text
      substr: 'CDDL HEADER START'

  - id: xnu-subsystem-path
    desc: XNU kernel subsystem directory path
    if:
      type: path
      regex: 'xnu[\w.-]*/(bsd|osfmk|iokit|libkern|libsa|security|pexpert|san)/'

composite_rules:
  - id: xnu-kernel-source
    desc: Apple XNU kernel source file
    crit: exception
    conf: 0.97
    all:
      - id: xnu-subsystem-path
    any:
      - id: apsl-osreference-header
      - id: opensolaris-cddl-header
