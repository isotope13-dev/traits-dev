defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.98
traits:
  - id: rip-tweaks-installer-description
    desc: PE description names RIP Tweaks installer
    crit: notable
    if:
      type: value
      path: pe.version.description
      exact: RIP Tweaks installer
composite_rules:
  - id: rip-tweaks-installer
    desc: RIP Tweaks installer description with intact CA-issued signature
    crit: notable
    all:
      - id: rip-tweaks-installer-description
      - id: metadata/signature/certificate/chain::ca-issued-intact-signature
