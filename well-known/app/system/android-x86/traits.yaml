defaults:
  platforms: [android]
  for: [apk]
  crit: baseline
  conf: 0.99

traits:
  - id: phonesky-system-app
    desc: Android-x86 system Google Play Store APK
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: Phonesky.apk
      case_insensitive: true

  - id: systemui-system-app
    desc: Android-x86 system UI APK
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: SystemUI.apk
      case_insensitive: true
