# systemd-networkd attaches classic BPF socket filters for DHCP and
# neighbor discovery, and it also reaps child processes. That pair is the
# network service, not a packet-filter backdoor.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 100000000

traits:
  - id: networkd-dbus-service-name
    desc: systemd-networkd D-Bus service name
    if:
      type: text
      section: .rodata
      substr: org.freedesktop.network1
