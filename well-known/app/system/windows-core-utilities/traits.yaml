# Precise identities for legacy Windows XP utilities that predate universal
# Authenticode signing. These are valid embedded hosts in prepending file
# infectors and should not be treated as forged Microsoft payloads.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: microsoft-company-name
    desc: Microsoft version company name
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.company
      exact: Microsoft Corporation

  - id: command-processor-original-filename
    desc: Windows command processor original filename
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^cmd\.exe$'

  - id: command-processor-description
    desc: Windows command processor file description
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.description
      exact: Windows Command Processor

  - id: system-information-original-filename
    desc: Windows System Information original filename
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^msinfo32\.exe$'

  - id: system-information-description
    desc: Windows System Information file description
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.description
      exact: System Information

  - id: speech-server-original-filename
    desc: Windows Speech API server original filename
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^sapisvr5(\.exe)?$'

  - id: speech-server-description
    desc: Windows Speech API server file description
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^sapisvr\s*5$'

composite_rules:
  - id: windows-command-processor-identity
    desc: Recognized Microsoft Windows command processor
    crit: exception
    conf: 1.0
    all:
      - id: command-processor-original-filename
      - id: command-processor-description
      - id: microsoft-company-name

  - id: windows-system-information-identity
    desc: Recognized Microsoft Windows System Information utility
    crit: exception
    conf: 1.0
    all:
      - id: system-information-original-filename
      - id: system-information-description
      - id: microsoft-company-name

  - id: windows-speech-server-identity
    desc: Recognized Microsoft Windows Speech API server
    crit: exception
    conf: 1.0
    all:
      - id: speech-server-original-filename
      - id: speech-server-description
      - id: microsoft-company-name
