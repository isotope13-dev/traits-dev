defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  size_min: 6
traits:
  - id: rundll16-dll-export-command
    desc: 16-bit rundll loads an export
    crit: notable
    conf: 0.92
    for: [text, batch, html, javascript, vbs, powershell, scripts]
    if:
      type: text
      regex: '(?i)\brundll(\.exe)?\s+[^,\r\n]{1,80},\s*[A-Za-z_]\w{0,40}\b'

  - id: rundll16-ordinal-export
    desc: 16-bit rundll calls an ordinal export
    crit: notable
    conf: 0.93
    for: [text, batch, html, javascript, vbs, powershell, scripts]
    if:
      type: text
      regex: '(?i)\brundll(\.exe)?\s+[^,\r\n]{1,40},\s*#\d+\b'
