# Arch Linux Chinese Community Repository (archlinuxcn/repo): packaging
# recipes for the community [archlinuxcn] pacman repository. Guarddog/Socket
# flag curl|sh and download-exec shapes that are normal in PKGBUILD build()
# helpers (e.g. ghcup bootstrap), not malware.
defaults:
  platforms: [unix]
  for: [archives, shell, markdown, text, python]
  crit: notable
  conf: 0.99

traits:
  - id: repository-readme-title
    desc: Arch Linux CN repository README title
    for: [markdown, text]
    if:
      type: text
      substr: 'Arch Linux Chinese Community Repository'

  - id: pacman-conf-repo-stanza
    desc: archlinuxcn pacman.conf repository stanza
    for: [markdown, text, shell]
    if:
      type: text
      regex: '(?m)^\[archlinuxcn\]\s*$'

  - id: repository-archive-basename
    desc: Arch Linux CN repo archive basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)archlinuxcn[-_.]repo'

  - id: repository-member-path
    desc: Arch Linux CN repo tree member path
    if:
      type: path
      regex: '(?i)archlinuxcn[/\\]repo@v'

  - id: packaging-recipe-path
    desc: archlinuxcn or alarmcn package tree path
    for: [shell]
    if:
      type: path
      regex: '(?i)[/\\](archlinuxcn|alarmcn)[/\\]'

  - id: lilac-schema-basename
    desc: lilac packaging schema basename
    for: [text]
    if:
      type: basename
      regex: '(?i)^lilac-yaml-schema\.ya?ml$'

composite_rules:
  - id: repository-identity
    desc: Arch Linux CN community package repository
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: repository-readme-title
    any:
      - id: pacman-conf-repo-stanza
      - id: repository-archive-basename
      - id: repository-member-path
      - id: lilac-schema-basename

  - id: repository-archive-context
    desc: Arch Linux CN package source context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: repository-identity
      - id: packaging-recipe-path
