# KDE Plasma Baloo file-search runner (.desktop service). Official Plasma
# DBus runner metadata — not an XDG autostart persistence drop.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.99
  size_max: 100000

traits:
  - id: plasma-runner-service-type
    desc: Plasma/Runner KDE service type
    if:
      type: text
      substr: 'X-KDE-ServiceTypes=Plasma/Runner'

  - id: baloosearch-plugin-name
    desc: Baloo search Plasma runner plugin name
    if:
      type: text
      substr: 'X-KDE-PluginInfo-Name=baloosearch'

  - id: baloo-runner-dbus-service
    desc: Baloo Plasma runner D-Bus service name
    if:
      type: text
      substr: 'X-Plasma-DBusRunner-Service=org.kde.runners.baloo'

composite_rules:
  - id: plasma-baloosearch-runner
    desc: KDE Plasma Baloo file-search runner
    conf: 0.99
    needs: 2
    any:
      - id: plasma-runner-service-type
      - id: baloosearch-plugin-name
      - id: baloo-runner-dbus-service
