# Veila — Wayland session lockscreen for wlroots compositors.
defaults:
  platforms: [unix]
  for: [elf, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: veila-idle-service-marker
    desc: Veila idle systemd user service
    crit: notable
    conf: 0.99
    for: [elf]
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      substr: veila-idle.service
      section: .rodata

  - id: veila-daemon-name-marker
    desc: Veila veilad daemon name marker
    crit: notable
    conf: 0.99
    for: [elf]
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      substr: veilad is not running
      section: .rodata

  - id: veila-share-path-marker
    desc: Veila share install path marker
    crit: notable
    conf: 0.99
    for: [elf]
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      substr: /share/veila/
      section: .rodata

  - id: veila-repository-marker
    desc: Veila upstream repository marker
    for: [markdown]
    if:
      type: text
      substr: github.com/naurissteins/veila

composite_rules:
  - id: veila-lockscreen-context
    desc: Veila Wayland lockscreen package context
    crit: exception
    conf: 1.0
    scope: outer
    any:
      - id: veila-idle-service-marker
      - id: veila-daemon-name-marker
      - id: veila-share-path-marker
      - id: veila-repository-marker
