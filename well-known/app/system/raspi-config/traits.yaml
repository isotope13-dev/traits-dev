# raspi-config is Raspberry Pi's legitimate interactive system configuration
# tool.  Its options intentionally create and remove boot-time configuration.
defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: upstream-repository-marker
    desc: raspi-config upstream repository marker
    if:
      type: text
      substr: github.com/RPi-Distro/raspi-config

  - id: configuration-tool-title
    desc: Raspberry Pi Software Configuration Tool title
    if:
      type: text
      substr: Raspberry Pi Software Configuration Tool

  - id: source-description-marker
    desc: raspi-config source description marker
    if:
      type: text
      substr: Part of raspi-config

composite_rules:
  - id: recognized-raspi-config
    desc: Recognized Raspberry Pi raspi-config tool
    crit: notable
    conf: 0.99
    all:
      - id: upstream-repository-marker
      - id: configuration-tool-title
      - id: source-description-marker

  - id: raspi-config-persistence-context
    desc: Recognized raspi-config persistence-management context
    crit: exception
    conf: 0.99
    all:
      - id: upstream-repository-marker
      - id: configuration-tool-title
