# KuerPE — Chinese Windows Preinstallation Environment (WinPE) distribution.
# PEBoot.exe is the dual-user bootstrapper and launcher setting up the PE session.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: peboot-manifest-identity
    desc: KuerPE PEBoot manifest assembly identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: KuerPE.PEBoot

  - id: peboot-version-company
    desc: KuerPE version resource company
    if:
      type: value
      path: pe.version.company
      regex: '^KuerPE'

  - id: peboot-description
    desc: KuerPE WinPE boot launcher description
    if:
      type: value
      path: pe.version.description
      substr: WinPE 启动器

composite_rules:
  - id: kuerpe-peboot-identity
    desc: KuerPE PEBoot WinPE launcher identity
    crit: exception
    any:
      - id: peboot-manifest-identity
      - id: peboot-version-company
      - id: peboot-description
