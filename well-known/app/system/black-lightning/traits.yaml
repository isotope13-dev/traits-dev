defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 10000000

traits:
  - id: black-lightning-product
    desc: Black Lightning PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Black Lightning

  - id: black-lightning-company
    desc: Black Lightning PE company metadata
    if:
      type: value
      path: pe.version.company
      exact: Black Lightning

  - id: black-lightning-simutronics-description
    desc: Black Lightning Simutronics description
    if:
      type: value
      path: pe.version.comments
      substr: Simutronics

  - id: black-lightning-plugin-namespace
    desc: Black Lightning plugin namespace
    if:
      type: text
      exact: BlackLightning.PluginLib
      section: .text

  - id: black-lightning-project-url
    desc: Black Lightning project URL
    if:
      type: text
      exact: http://www.blacklightning.net
      section: .text

composite_rules:
  # Black Lightning is an unsigned .NET game front end. Its normal plugin,
  # socket, and local credential features resemble generic loader signals;
  # this exception only applies when all independent identity markers agree.
  - id: black-lightning-identity-context
    desc: Black Lightning application identity context
    crit: exception
    conf: 0.99
    all:
      - id: black-lightning-product
      - id: black-lightning-company
      - id: black-lightning-simutronics-description
      - id: black-lightning-plugin-namespace
      - id: black-lightning-project-url
