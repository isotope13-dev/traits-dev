# OmniOS Kayak's interactive installer writes first-boot configuration that
# legitimately includes Solaris SMF and account-management commands. The
# multi-marker context is used only to suppress objective-level persistence
# inferences; the neutral capabilities remain visible to analysts.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: omnios-community-license
    desc: OmniOS Community Edition source license marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'OmniOS Community Edition'

  - id: kayak-library-import
    desc: Kayak installer library import
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: /kayak/lib/install_help.sh

  - id: kayak-staged-root
    desc: Kayak alternate installation root assignment
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^ALTROOT=/mnt$'

composite_rules:
  - id: kayak-installer-context
    desc: Recognized OmniOS Kayak installer context
    crit: exception
    conf: 0.99
    all:
      - id: omnios-community-license
      - id: kayak-library-import
      - id: kayak-staged-root
