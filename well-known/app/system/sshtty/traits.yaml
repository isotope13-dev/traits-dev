defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  size_min: 1000000
  size_max: 100000000
  crit: notable
  conf: 0.98

traits:
  - id: sshtty-basename
    desc: sshtty executable basename
    size_min: 1000000
    size_max: 100000000
    if:
      type: path
      basename: true
      regex: '^sshtty(\.exe)?$'

composite_rules:
  - id: sshtty-terminal-server
    desc: sshtty browser terminal server binary
    crit: notable
    conf: 0.99
    all:
      - id: sshtty-basename
      - id: micro-behaviors/process/create/sshtty::sshtty-server-crate-marker
    any:
      - id: micro-behaviors/process/create/sshtty::sshtty-terminal-banner
