defaults:
  platforms: [windows]
  for: [pe]
  size_max: 2097152

traits:
  - id: dw20-original-filename
    desc: Windows Error Reporting DW20 executable identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: DW20.Exe
      case_insensitive: true
