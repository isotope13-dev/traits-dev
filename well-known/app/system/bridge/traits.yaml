# System Bridge is a published system monitoring and control application
# with documented power-management and Linux autostart support.
defaults:
  platforms: [unix, windows]
  for: [go, archive, tar]
  crit: notable
  conf: 0.99

traits:
  - id: go-module
    desc: System Bridge Go module identity
    for: [go]
    if:
      type: text
      substr: github.com/timmo001/system-bridge

  - id: release-tree-path
    desc: System Bridge release source tree path
    if:
      type: path
      regex: '(^|/)system-bridge-(HEAD|[0-9])'

  - id: product-homepage
    desc: System Bridge product homepage marker
    if:
      type: text
      substr: system-bridge.timmo.dev

  - id: homeassistant-integration
    desc: System Bridge Home Assistant integration marker
    if:
      type: text
      substr: home-assistant.io/integrations/system_bridge

composite_rules:
  - id: documented-system-control-context
    desc: Documented System Bridge monitoring and control context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: go-module
      - id: release-tree-path
