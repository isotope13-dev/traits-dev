defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.99
  size_min: 1000000
  size_max: 200000000

traits:
  - id: go-module-path
    desc: nektos act Go module path
    for: [elf]
    crit: notable
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/nektos/act

  - id: pe-go-module-path
    desc: nektos act Windows Go module path
    for: [pe]
    crit: notable
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/nektos/act

  - id: macho-go-module-path
    desc: nektos act macOS Go module path
    for: [macho]
    crit: notable
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/nektos/act

composite_rules:
  - id: nektos-act-binary
    desc: nektos act binary identity
    crit: notable
    any:
      - id: go-module-path
      - id: pe-go-module-path
      - id: macho-go-module-path
