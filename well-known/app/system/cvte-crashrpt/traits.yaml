defaults:
  for: [binaries]
  platforms: [windows]
  size_min: 1024
  size_max: 524288000

traits:
  - id: cvte-crashrpt-upload-endpoint
    desc: "CVTE CrashRpt corporate upload endpoint"
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "myou.cvte.com/api/v1/crashdumps/collect/more"
      section: ".rdata"

composite_rules:
  - id: cvte-crashrpt
    desc: CVTE Shirui CrashRpt crash reporter
    crit: notable
    conf: 0.99
    any:
      - id: cvte-crashrpt-strong-pin
      - id: cvte-crashrpt-minidump-runtime
      - id: cvte-crashrpt-versioninfo
      - id: cvte-crashrpt-upload-endpoint
  - id: cvte-crashrpt-versioninfo
    desc: "CVTE CrashRpt VERSIONINFO fields"
    crit: notable
    conf: 0.99
    all:
      - id: cvte-crashrpt-upload-endpoint
      - id: metadata/vendor/identity::cvte-crashrpt-company-name
    any:
      - id: metadata/binary/resource/identity::crashrpt-original-filename

  - id: cvte-crashrpt-strong-pin
    for: [pe]
    desc: "CVTE CrashRpt Breakpad uploader build"
    crit: notable
    conf: 0.995
    all:
      - id: cvte-crashrpt-versioninfo
      - id: cvte-crashrpt-upload-endpoint
      - id: well-known/lib/development/breakpad-legacy::crashreportsender

  - id: cvte-crashrpt-minidump-runtime
    for: [pe]
    desc: "CVTE CrashRpt sibling-process minidump flow"
    crit: notable
    conf: 0.995
    all:
      - id: micro-behaviors/fs/file/pe-inspect::dbghelp-dll-reference
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-symbol
      - id: well-known/lib/development/breakpad-legacy::crash-context-string
      - id: well-known/lib/development/breakpad-legacy::dump-file-string
    any:
      - id: micro-behaviors/fs/path/log/application::crashrpt-log-reference
      - id: metadata/lang/natural/phrasing::generate-dump-success
