# Google sign-in form markup and Drive sign-in page titles. The identifierId
# input is Google's own account field; it is only evidence of a Google login
# replica when the page is not Google's own sign-in host (see the composite
# in phishing/html-brand, which requires a Drive sign-in title and a credential
# field pair).
defaults:
  platforms: [windows, unix]
  for: [html, javascript, php]

traits:
  - id: google-signin-identifier-input
    desc: Google sign-in account input element ID
    crit: notable
    conf: 0.93
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<input\b[^>]{0,200}\bid\s*=\s*["'']?identifierId\b'

  - id: google-drive-signin-title
    desc: Page title names Google Drive sign-in
    crit: component
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<title>[^<]{0,40}Google\s+Drive[^<]{0,20}Sign[- ]in'

  # Google's own sign-in document keeps its base URL on accounts.google.com
  # and submits its form to a relative Google sign-in path, so a saved copy
  # of the genuine page sends credentials only to Google.
  - id: google-signin-accounts-base-href
    desc: Base URL set to Google accounts sign-in
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<base\s+href\s*=\s*["'']https://accounts\.google\.com/'

  - id: google-signin-relative-form-action
    desc: Form posts to relative Google sign-in path
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<form\b[^>]{0,200}\baction\s*=\s*["'']/(v3/)?signin/'

composite_rules:
  - id: genuine-google-signin-document
    desc: Genuine Google sign-in page posting only to Google
    crit: exception
    conf: 0.9
    all:
      - id: google-signin-accounts-base-href
      - id: google-signin-relative-form-action
