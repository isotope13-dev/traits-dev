defaults:
  platforms: [ios]
  for: [swift]

traits:
  - id: data-management-view
    desc: LiveContainer data-management SwiftUI view
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: 'LCDataManagementView\.swift$'
  - id: keychain-removal-alert
    desc: LiveContainer keychain removal confirmation
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: keyChainRemovalAlert
  - id: clean-keychain-label
    desc: LiveContainer clean-keychain action label
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'lc\.settings\.cleanKeychain'
  - id: cancel-label
    desc: LiveContainer cancel action label
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'lc\.common\.cancel'

composite_rules:
  - id: data-management-context
    desc: LiveContainer user-confirmed data-management screen
    crit: exception
    conf: 0.99
    all:
      - id: data-management-view
      - id: keychain-removal-alert
      - id: clean-keychain-label
      - id: cancel-label
