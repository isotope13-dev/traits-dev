# APTL (Advanced Purple Team Lab) is a defensive cyber-range distribution.
# Its bundled lab assets intentionally contain red-team commands, vulnerable
# services, test credentials, flags, and reverse-engineering setup scripts.
defaults:
  platforms: [unix, windows]
  for: [whl, scripts, source, data]
  crit: notable
  conf: 0.99

traits:
  - id: aptl-wheel-name
    desc: APTL Labs wheel artifact
    for: [whl]
    if:
      type: value
      path: file.basename
      regex: '(?i)^aptl_labs-[0-9][^/\\]*\.whl$'

  - id: aptl-lab-asset-path
    desc: APTL bundled lab asset path
    for: [scripts, source, data]
    if:
      type: path
      regex: '(?i)(^|[\\\\/])_labdata([\\\\/]|$)'

  # APTL's service module is a lab-health helper.  The fully-qualified import
  # is the stable product marker; a generic function name is not an APTL
  # identity signal and is intentionally not matched here.
  - id: aptl-service-helper-import
    desc: APTL service helper import
    for: [python]
    if:
      type: import
      exact: aptl.utils.curl_safe

composite_rules:
  - id: official-wheel-lab-assets
    desc: Official APTL wheel with bundled lab assets
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: aptl-wheel-name
      - id: aptl-lab-asset-path
