# KDE Plasma system-monitor Memory Usage applet KPackage descriptor.
# Official Plasma widget metadata — not an npm packument.
defaults:
  platforms: [linux]
  for: [json, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 0
  size_max: 500000

traits:
  - id: plugin-id
    desc: Plasma memory-usage applet plugin id
    if:
      type: text
      substr: org.kde.plasma.systemmonitor.memory

  - id: systemmonitor-root-path
    desc: Plasma system-monitor applet root path
    if:
      type: text
      substr: '"X-Plasma-RootPath": "org.kde.plasma.systemmonitor"'
