# KDE Plasma Application Dashboard (kickerdash) KPackage descriptor.
# Official Plasma applet metadata — not an npm packument.
defaults:
  platforms: [linux]
  for: [json, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 0
  size_max: 500000

traits:
  - id: plugin-id
    desc: Plasma Application Dashboard plugin id
    if:
      type: text
      substr: org.kde.plasma.kickerdash

  - id: kicker-root-path
    desc: Plasma kicker applet root path
    if:
      type: text
      substr: '"X-Plasma-RootPath": "org.kde.plasma.kicker"'
