defaults:
  platforms: [windows]
  for: [pe, dll, python, powershell, csharp]
  crit: notable
  conf: 0.95
traits:
  - id: executable-name
    desc: References LibreHardwareMonitor executable
    size_max: 536870912
    if:
      type: text
      substr: LibreHardwareMonitor.exe
  - id: config-filename
    desc: References LibreHardwareMonitor configuration
    size_max: 536870912
    if:
      type: text
      substr: LibreHardwareMonitor.config
