defaults:
  conf: 1.0
  platforms: [unix, windows]

traits:
  - id: mdn-date-reference-title
    desc: MDN JavaScript Date reference title
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: Date time string format

composite_rules:
  - id: mdn-date-reference-context
    desc: Recognized MDN JavaScript Date reference
    crit: exception
    all:
      - id: mdn-date-reference-title
      - id: micro-behaviors/data/format/locale::js-date-prototype-api-sweep
