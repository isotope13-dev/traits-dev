defaults:
  platforms: [unix, windows]

traits:
  - id: mdn-date-reference-title
    desc: MDN JavaScript Date reference title
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: text
      substr: Date time string format
  # A single `Date.prototype` mention is ordinary JavaScript — moment.js feature-
  # tests `Date.prototype.toISOString`, and the bare substring made every date
  # library look like a copy of the MDN docs. An MDN Date reference page instead
  # enumerates the whole method table, so require the enumeration, not one hit.
  - id: mdn-date-reference-api
    desc: Enumerates the Date.prototype method table
    crit: notable
    conf: 1.0
    for: [javascript]
    count_min: 8
    unless:
      - id: well-known/app/ai/aui-agent-builder/
    if:
      type: text
      regex: 'Date\.prototype\.[A-Za-z]'

composite_rules:
  - id: mdn-date-reference-context
    desc: Recognized MDN JavaScript Date reference
    crit: exception
    conf: 1.0
    all:
      - id: mdn-date-reference-title
      - id: mdn-date-reference-api
