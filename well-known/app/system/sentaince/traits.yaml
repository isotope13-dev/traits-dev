defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: SentAInce Python package name
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*sentaince\s*$'

  - id: upstream-repository
    desc: SentAInce upstream repository
    for: [pkginfo]
    if:
      type: text
      regex: 'github\.com/dcnconsult/sentAInce([/#?]|$)'

  - id: defensive-summary
    desc: SentAInce safety-guard package summary
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Summary:\s*Phase II embodiment of the FreqOS organism.{0,100}synthetic immune system'

  - id: guard-source-marker
    desc: SentAInce destructive-command guard source
    for: [python]
    if:
      type: text
      regex: '(?i)catalogued lethal|somatic gate|_LETHAL_PATTERNS'

  - id: powershell-guard-test-path
    desc: SentAInce PowerShell guard test path
    for: [python]
    if:
      type: basename
      exact: test_somatic_ps.py

  - id: powershell-guard-test-source
    desc: SentAInce PowerShell lethal-command test source
    for: [python]
    if:
      type: text
      regex: '(?m)^LETHAL\s*=\s*\[|test_lethal_ps_is_recognized|is_lethal_ps\('

composite_rules:
  - id: defensive-guard-context
    desc: SentAInce defensive command-guard source context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: powershell-guard-test-path
      - id: powershell-guard-test-source
