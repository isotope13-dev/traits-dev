defaults:
  platforms: [macos]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.99
  size_max: 10485760

traits:
  - id: dispatcher-socket
    desc: References the Parallels dispatcher socket
    if:
      type: text
      substr: /var/run/prl_disp_service.socket

  - id: local-login-api
    desc: References the Parallels local login API
    for: [python, ruby, c, cpp, swift, objectivec, macho]
    if:
      type: symbol
      regex: '(^|\.)PrlSrv_LoginLocal$'

  - id: install-appliance-api
    desc: References the Parallels appliance install API
    for: [python, ruby, c, cpp, swift, objectivec, macho]
    if:
      type: symbol
      regex: '(^|\.)PrlSrv_InstallAppliance$'

composite_rules:
  - id: local-appliance-client
    desc: Parallels local appliance installation client
    all:
      - id: local-login-api
      - id: install-appliance-api
