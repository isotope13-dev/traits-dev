# Version-resource fields are self-reported claims, not signature verification.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: adobe-bootstrapper-description
  desc: Adobe single-install bootstrapper description
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.description
    exact: Adobe Bootstrapper for Single Installation
composite_rules:
- id: adobe-bootstrapper-versioninfo
  desc: Adobe bootstrapper version resource claims
  crit: notable
  conf: 0.98
  all:
  - id: metadata/binary/vendor::adobe-version-info-company
  - id: adobe-bootstrapper-description
  - id: metadata/binary/provenance/version-info::adobe-bootstrapper-product
- id: unsigned-adobe-bootstrapper-versioninfo
  desc: Adobe bootstrapper claims without signature record
  crit: notable
  conf: 0.97
  all:
  - id: adobe-bootstrapper-versioninfo
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
