# These are individually identified WinUtilities 15.89 suite components.
# Identity requires a verified Authenticode digest, the suite's leaf signer,
# and the component's exact version-resource description.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 50000000

traits:
  - id: winutilities-signed-component
    desc: Signed WinUtilities component identity
    if:
      type: text
      substr: WinUtilities
      section: rsrc

  - id: winutilities-startup-cleaner
    desc: WinUtilities Startup Cleaner
    if:
      type: text
      exact: WinUtilities Startup Cleaner
      section: rsrc

  - id: winutilities-registry-defrag
    desc: WinUtilities Registry Defrag
    if:
      type: text
      exact: WinUtilities RegistryDefrag
      section: rsrc

  - id: winutilities-process-security
    desc: WinUtilities Process Security
    if:
      type: text
      exact: WinUtilities Process Security
      section: rsrc

  - id: winutilities-history-cleaner
    desc: WinUtilities History Cleaner
    if:
      type: text
      exact: WinUtilities History Cleaner
      section: rsrc

  - id: winutilities-disk-cleaner
    desc: WinUtilities Disk Cleaner
    if:
      type: text
      exact: WinUtilities Disk Cleaner
      section: rsrc

  - id: winutilities-system-info
    desc: WinUtilities System Information
    if:
      type: text
      exact: WinUtilities System Information
      section: rsrc

  - id: winutilities-history-cleaner-module
    desc: WinUtilities History Cleaner COM module
    if:
      type: text
      exact: WinUtilities History Cleaner Module
      section: rsrc

  - id: winutilities-system-control-module
    desc: WinUtilities System Control COM module
    if:
      type: text
      exact: WinUtilities System Control Module
      section: rsrc

  - id: winutilities-license-module
    desc: WinUtilities License COM module
    if:
      type: text
      exact: WinUtilities License Module
      section: rsrc

  - id: winutilities-skin-module
    desc: WinUtilities ComSkin COM module
    if:
      type: text
      exact: WinUtilities ComSkin Module
      section: rsrc
  - id: winutilities-close-apps-marker
    desc: CloseApps process management utility
    if:
      type: text
      exact: CloseApps Module
      section: rsrc

composite_rules:
  - id: winutilities-signed-suite-component
    desc: Verified WinUtilities component signed by Suining YiLong
    all:
      - id: metadata/signed/leaf::suining-yilong-software-store
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: winutilities-signed-component

  - id: winutilities-startup-cleaner-identity
    desc: Signed WinUtilities Startup Cleaner identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-startup-cleaner

  - id: winutilities-registry-defrag-identity
    desc: Signed WinUtilities Registry Defrag identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-registry-defrag

  - id: winutilities-process-security-identity
    desc: Signed WinUtilities Process Security identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-process-security

  - id: winutilities-history-cleaner-identity
    desc: Signed WinUtilities History Cleaner identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-history-cleaner

  - id: winutilities-disk-cleaner-identity
    desc: Signed WinUtilities Disk Cleaner identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-disk-cleaner

  - id: winutilities-system-info-identity
    desc: Signed WinUtilities System Information identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-system-info

  - id: winutilities-history-cleaner-module-identity
    desc: Signed WinUtilities History Cleaner COM module identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-history-cleaner-module

  - id: winutilities-system-control-module-identity
    desc: Signed WinUtilities System Control COM module identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-system-control-module

  - id: winutilities-license-module-identity
    desc: Signed WinUtilities License COM module identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-license-module

  - id: winutilities-skin-module-identity
    desc: Signed WinUtilities ComSkin COM module identity
    all:
      - id: winutilities-signed-suite-component
      - id: winutilities-skin-module

  - id: winutilities-close-apps-identity
    desc: Signed CloseApps process management utility identity
    all:
      - id: metadata/signed/leaf::suining-yilong-software-store
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: winutilities-close-apps-marker
