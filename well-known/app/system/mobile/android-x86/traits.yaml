defaults:
  platforms: [android]
  for: [android_apk]
  crit: baseline
  conf: 0.99

traits:
  - id: phonesky-system-app
    desc: Android-x86 system Google Play Store APK
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: Phonesky.apk
      case_insensitive: true

  - id: systemui-system-app
    desc: Android-x86 system UI APK
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: SystemUI.apk
      case_insensitive: true

  - id: android-x86-ramdisk-path
    desc: Android-x86 published ramdisk
    crit: notable
    conf: 0.99
    platforms: [unix]
    for: [cpio]
    size_min: 512
    size_max: 20000000
    if:
      type: path
      substr: android-x86.org
