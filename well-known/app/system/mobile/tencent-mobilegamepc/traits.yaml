defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: tencent-mobilegamepc-registry
  desc: MobileGamePC registry path text
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: SOFTWARE\Tencent\MobileGamePC
    section: rdata
- id: tencent-tmarketinst-version
  desc: TMarketInst identifier in PE data
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: TMarketInst
    section: rdata
- id: tencent-txmobilegamepc-marker
  desc: Tencent TXMobileGamePC identifier
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: TXMobileGamePC
    section: rdata
- id: tencent-tgbdownloader-marker
  desc: Tencent TGBDownloader identifier
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: TGBDownloader
    section: rdata

composite_rules:
- id: tencent-mobilegamepc-installer
  desc: MobileGamePC reference and Tencent chain name
  crit: notable
  conf: 0.99
  all:
  - id: metadata/signature/certificate/identity::tencent-technology-chain-name
  any:
  - id: well-known/app/system/mobile/tencent-mobilegamepc::tencent-mobilegamepc-registry
  - id: well-known/app/system/mobile/tencent-mobilegamepc::tencent-tmarketinst-version
  - id: well-known/app/system/mobile/tencent-mobilegamepc::tencent-txmobilegamepc-marker
  - id: well-known/app/system/mobile/tencent-mobilegamepc::tencent-tgbdownloader-marker

