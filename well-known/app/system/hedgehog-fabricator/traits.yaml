defaults:
  platforms: [unix, windows]
  for: [zip, go, go.mod, source, shell, text]

traits:
  - id: fabricator-source-tree-path
    desc: Hedgehog Fabricator Go source tree path
    crit: notable
    conf: 0.99
    if:
      type: path
      substr: go.githedgehog.com/fabricator@

  - id: fabricator-source-archive
    desc: Hedgehog Fabricator source archive name
    crit: notable
    conf: 0.99
    for: [zip]
    if:
      type: basename
      regex: '^go\.githedgehog\.com-fabricator-v[^\\/]+\.zip$'

  - id: fabricator-module-declaration
    desc: Hedgehog Fabricator Go module declaration
    crit: notable
    conf: 0.99
    for: [go.mod]
    if:
      type: text
      regex: '(?m)^module\s+go\.githedgehog\.com/fabricator\s*$'

composite_rules:
  - id: official-fabricator-context
    desc: Official Hedgehog Fabricator source distribution context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: fabricator-source-tree-path
      - id: fabricator-source-archive
      - id: fabricator-module-declaration
