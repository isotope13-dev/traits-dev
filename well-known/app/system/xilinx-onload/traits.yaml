defaults:
  conf: 0.99
  platforms: [linux]
  for: [c, source]
  size_min: 1
  size_max: 500000000

traits:
  - id: onload-source-tree-path
    desc: Xilinx Onload source tree path
    crit: notable
    if:
      type: path
      regex: 'onload@'

  # Anchored on the copyright statement the id already names. A bare vendor
  # word claimed an Onload identity from any mention of Xilinx: every ELF
  # machine-type table lists `EM_MICROBLAZE, "Xilinx MicroBlaze ..."`, so the
  # ELFIO header vendored by projects such as dde-file-manager matched, as
  # would binutils, libelf and any driver enumeration.
  - id: onload-xilinx-copyright
    desc: Xilinx Onload source marker
    crit: notable
    for: [c]
    if:
      type: text
      regex: '(?i)copyright[^\n]{0,60}(solarflare communications|xilinx)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

composite_rules:
  - id: onload-kernel-source-context
    for: [c]
    desc: Xilinx Onload kernel source context
    crit: exception
    all:
      - id: onload-source-tree-path
      - id: onload-xilinx-copyright
