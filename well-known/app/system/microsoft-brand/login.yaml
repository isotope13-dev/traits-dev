defaults:
  platforms: [windows, unix]
  for: [html, javascript]

traits:
  - id: microsoft-signin-account-placeholder
    desc: Microsoft sign-in account input placeholder
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)placeholder=["'']Email address,\s*phone number or Skype["'']'

  - id: microsoft-signin-input-id
    desc: Microsoft sign-in input element ID
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bid=["'']?i011[678]\b'
