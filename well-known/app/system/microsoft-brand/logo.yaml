# The Microsoft logo is four coloured squares whose hex values
# (F25022/7FBA00/00A4EF/FFB900) are fixed by the Microsoft brand guidelines.
#
# Relocated from objectives/evasion/masquerade/brand/installer/, where the
# composite was named `ms-logo-svg-impersonation` at crit notable. The matcher
# only finds the brand palette, which any application that ships a Microsoft
# provider icon carries -- Cherry Studio's own
# packages/ui/.../icons/models/microsoft/light.tsx surfaced as impersonation.
# The lure text and non-Microsoft-domain context that make it impersonation
# stay in the composite there, which references this cross-directory.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  size_min: 64
  size_max: 100000000

traits:
  - id: ms-logo-red-square
    desc: Microsoft red square brand colour
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '#[Ff]25022\b'
  - id: ms-logo-green-square
    desc: Microsoft green square brand colour
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '#7[Ff][Bb][Aa]00\b'
  - id: ms-logo-blue-square
    desc: Microsoft blue square brand colour
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '#00[Aa]4[Ee][Ff]\b'
  - id: ms-logo-yellow-square
    desc: Microsoft yellow square brand colour
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '#[Ff][Ff][Bb]900\b'

  - id: microsoft-collaboration-logo-asset
    desc: Microsoft collaboration logo image asset
    crit: notable
    conf: 0.92
    for: [html, scripts]
    if:
      # Product identity in an image filename is structural branding. Phishing
      # intent is supplied by device-flow and token-forwarding composites.
      type: text
      regex: '(?i)(microsoft[-_ ]?)?(teams|sharepoint)[-_ ](logo|icon)\.(svg|png|jpe?g|webp)\b'

  - id: microsoft-collaboration-page-title
    desc: Microsoft collaboration product page title
    crit: notable
    conf: 0.9
    for: [html, scripts]
    if:
      type: text
      regex: '(?i)<title\b[^>]{0,80}>\s*(microsoft\s+)?(teams|sharepoint)(\s+phone)?\s*</title>'

composite_rules:
  - id: ms-logo-brand-colours
    desc: Microsoft logo brand colour set
    crit: notable
    conf: 0.95
    needs: 3
    any:
      - id: ms-logo-red-square
      - id: ms-logo-green-square
      - id: ms-logo-blue-square
      - id: ms-logo-yellow-square

  - id: microsoft-collaboration-page-branding
    desc: Microsoft collaboration product page branding
    crit: notable
    conf: 0.96
    for: [html, scripts]
    all:
      - id: microsoft-collaboration-logo-asset
      - id: microsoft-collaboration-page-title
    near_bytes: 4096
