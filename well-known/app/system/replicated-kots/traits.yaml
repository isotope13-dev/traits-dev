defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  size_min: 5000000

traits:
  - id: replicated-kots-module
    desc: Replicated KOTS Go module identity
    crit: baseline
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/replicatedhq/kots

  - id: replicated-kots-command
    desc: Replicated KOTS command entry point
    crit: baseline
    if:
      type: value
      path: elf.go.path
      regex: '^github\.com/replicatedhq/kots/cmd/kots(adm)?$'

composite_rules:
  - id: replicated-kots-binary
    desc: Replicated KOTS binary identity
    crit: notable
    any:
      - id: replicated-kots-module
      - id: replicated-kots-command
