defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 52428800

traits:
  - id: thinprint-company
    desc: ThinPrint GmbH company metadata
    if:
      type: value
      path: pe.version.company
      exact: ThinPrint GmbH

  - id: thinprint-viewture-product
    desc: ThinPrint Viewture product name
    if:
      type: value
      path: pe.version.product_name
      exact: ThinPrint Viewture

  - id: tpview-original-filename
    desc: ThinPrint TPView DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^tpview.+\.dll$'

  - id: tpview-com-proxy-progid
    desc: ThinPrint TPView COM ProgID
    if:
      type: text
      substr: TpViewCom.TpViewComProxy
      section: rsrc

composite_rules:
  - id: thinprint-viewture-binary
    desc: ThinPrint-signed Viewture preview binary
    crit: notable
    conf: 0.99
    all:
      - id: thinprint-company
      - id: metadata/signed/leaf::thinprint-gmbh
    any:
      - id: thinprint-viewture-product
      - id: tpview-original-filename
      - id: tpview-com-proxy-progid
