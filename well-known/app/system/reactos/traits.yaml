defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: product-name
    desc: ReactOS operating-system product name
    crit: component
    conf: 0.99
    size_min: 1024
    size_max: 52428800
    if:
      type: value
      path: pe.version.product_name
      exact: ReactOS Operating System

  - id: project-company
    desc: ReactOS project version-resource company
    crit: component
    conf: 0.99
    size_min: 1024
    size_max: 52428800
    if:
      type: value
      path: pe.version.company
      regex: '^ReactOS Project(/Wine Team)?$'

composite_rules:
  - id: system-component
    desc: ReactOS operating-system component
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: project-company
