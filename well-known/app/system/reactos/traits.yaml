defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: product-name
    desc: ReactOS operating-system product name
    crit: component
    conf: 0.99
    size_min: 1024
    size_max: 52428800
    if:
      type: value
      path: pe.version.product_name
      exact: ReactOS Operating System

  - id: project-company
    desc: ReactOS project version-resource company
    crit: component
    conf: 0.99
    size_min: 1024
    size_max: 52428800
    if:
      type: value
      path: pe.version.company
      regex: '^ReactOS Project(/Wine Team)?$'

  # Release builds retain source paths even in components that do not carry a
  # VERSIONINFO resource (API-set stubs, drivers, and imported Wine modules).
  # These paths identify the build tree rather than merely trusting a product
  # string that an unrelated PE could copy.
  - id: release-workdir-source-path
    desc: ReactOS release build-tree source path
    crit: notable
    conf: 0.99
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      section: rdata
      regex: '(?i)reactos[/\\]Release_WorkDir[/\\]Repo[/\\]output-MinGW-[^/\\]{1,80}[/\\]'

  - id: sdk-source-path
    desc: ReactOS SDK source-tree path
    crit: notable
    conf: 0.98
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      section: rdata
      regex: '(?i)(^|[/\\])sdk[/\\]include[/\\]reactos[/\\]'

  - id: rosapps-source-path
    desc: ReactOS applications source-tree path
    crit: notable
    conf: 0.98
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      section: rdata
      regex: '(?i)(^|[/\\])modules[/\\]rosapps[/\\]'

  - id: apiset-build-source-path
    desc: ReactOS API-set generated-source path
    crit: notable
    conf: 0.99
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      section: rdata
      regex: '(?i)output-MinGW-[^/\\]{1,80}[/\\]dll[/\\]apisets[/\\]api-ms-win-'

  - id: libwine-source-path
    desc: ReactOS bundled libwine source-tree path
    crit: notable
    conf: 0.98
    size_min: 4096
    size_max: 52428800
    if:
      type: text
      section: rdata
      regex: '(?i)(^|[/\\])sdk[/\\]lib[/\\]3rdparty[/\\]libwine[/\\]'

  - id: test-harness-script
    desc: ReactOS Wine-compatible test harness script
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      type: text
      exact: set WINETEST_PLATFORM=reactos

composite_rules:
  - id: version-resource-component
    desc: ReactOS version-resource identity
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: project-company

  - id: system-component
    desc: ReactOS operating-system component
    crit: notable
    conf: 0.99
    any:
      - id: version-resource-component
      - id: release-workdir-source-path
      - id: sdk-source-path
      - id: rosapps-source-path
      - id: apiset-build-source-path
      - id: libwine-source-path
