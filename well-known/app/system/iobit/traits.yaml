defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: iobit-signer
    desc: IObit code-signing certificate
    crit: notable
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)\bO=IObit (CO\.\\, LTD|Information Technology)\b'

  - id: driver-booster-product
    desc: Driver Booster product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Driver Booster

  - id: driver-booster-updater-name
    desc: Driver Booster updater OriginalFilename metadata
    crit: notable
    if:
      type: value
      path: pe.version.original_filename
      exact: DriverUpdate

  - id: iobit-company
    desc: IObit PE company metadata
    crit: notable
    if:
      type: value
      path: pe.version.company
      exact: IObit

  - id: advanced-systemcare-product
    desc: Advanced SystemCare product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Advanced SystemCare

  - id: malware-fighter-product
    desc: IObit Malware Fighter product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: IObit Malware Fighter

  - id: uninstall-utility-product
    desc: IObit Uninstaller product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Uninstall Utility 13

composite_rules:
  - id: iobit-signed-component
    desc: Verified IObit-signed software component
    crit: notable
    all:
      - id: iobit-signer
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: iobit-signed-component-context
    desc: Verified IObit software component context
    crit: exception
    conf: 0.99
    all:
      - id: iobit-signer
      - id: iobit-signed-component

  # ELAM and WHQL-signed IObit drivers may carry Microsoft's certificate rather
  # than an embedded IObit leaf.  Their exact company/product version identity
  # still distinguishes the recognized AV component from generic signed code.
  - id: iobit-malware-fighter-component-context
    desc: Recognized IObit Malware Fighter component context
    crit: exception
    conf: 0.99
    all:
      - id: iobit-company
      - id: malware-fighter-product

  - id: iobit-uninstaller-component-context
    desc: Recognized IObit Uninstaller component context
    crit: exception
    conf: 0.99
    all:
      - id: iobit-company
      - id: uninstall-utility-product

  - id: advanced-systemcare-component-context
    desc: Recognized Advanced SystemCare component context
    crit: exception
    conf: 0.99
    all:
      - id: iobit-company
      - id: advanced-systemcare-product

  - id: iobit-component-context
    desc: Recognized IObit software component context
    crit: exception
    conf: 0.99
    any:
      - id: iobit-malware-fighter-component-context
      - id: iobit-uninstaller-component-context
      - id: iobit-signed-component-context

  - id: driver-booster-signed-updater
    desc: Verified IObit Driver Booster updater identity
    crit: notable
    all:
      - id: driver-booster-product
      - id: driver-booster-updater-name
      - id: iobit-signed-component
