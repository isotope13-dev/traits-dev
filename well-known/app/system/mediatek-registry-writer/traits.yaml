# MediaTek's Ralink Registry Writer helper is an OEM Wi-Fi support binary.  Its
# service installation, registry maintenance, and local RPC endpoint are
# expected setup functionality, not evidence of a hostile service.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 5000000

traits:
  - id: registry-writer-product-name
    desc: MediaTek Registry Writer product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: MediatekRegistryWriter

  - id: registry-writer-company-name
    desc: MediaTek Registry Writer company metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Mediatek Inc.

  - id: registry-writer-original-filename
    desc: MediaTek Registry Writer original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^RaRegistry(64)?\.exe$'

  - id: registry-writer-pdb-path
    desc: Ralink Registry Writer release build path
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)RalinkRegistryWriter[\\/]Release[\\/]RaRegistry(64)?\.pdb$'

composite_rules:
  - id: mediatek-registry-writer-identity
    desc: Signed MediaTek Ralink Registry Writer identity
    crit: notable
    conf: 0.99
    all:
      - id: registry-writer-product-name
      - id: registry-writer-company-name
      - id: registry-writer-original-filename
      - id: registry-writer-pdb-path
      - id: metadata/signed/leaf::mediatek-inc.
