defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 32768
  size_max: 52428800

traits:
  - id: google-update-product
    desc: Google Update product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Google Update

  - id: google-update-setup-description
    desc: Google Update Setup file description
    if:
      type: value
      path: pe.version.description
      exact: Google Update Setup

  # NSIS helper shipped under $PLUGINSDIR; no VERSIONINFO. MSVC RTTI names the
  # omaha::TagExtractor class used to parse Google Update installer tags.
  - id: omaha-tag-extractor-rtti
    desc: Google Omaha TagExtractor C++ RTTI
    size_min: 8192
    size_max: 262144
    if:
      type: text
      exact: .?AVTagExtractor@omaha@@
      section: .data

  - id: omaha-read-tag-dll-name
    desc: Google Omaha ReadTagDLL module name string
    size_min: 8192
    size_max: 262144
    if:
      type: text
      exact: ReadTagDLL.dll
      section: .rdata

composite_rules:
  - id: signed-google-update-setup
    desc: Signed Google Update bootstrapper identity
    crit: exception
    conf: 0.99
    all:
      - id: google-update-product
      - id: google-update-setup-description
    any:
      - id: metadata/signed/leaf::google-inc
      - id: metadata/signed/leaf::google-llc

  - id: omaha-nsis-read-tag-plugin
    desc: Google Omaha NSIS ReadTagDLL tag-extractor plugin
    crit: notable
    conf: 0.99
    all:
      - id: omaha-tag-extractor-rtti
      - id: omaha-read-tag-dll-name
