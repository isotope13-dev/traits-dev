defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 32768
  size_max: 52428800

traits:
  - id: google-update-product
    desc: Google Update product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Google Update

  - id: google-update-setup-description
    desc: Google Update Setup file description
    if:
      type: value
      path: pe.version.description
      exact: Google Update Setup

composite_rules:
  - id: signed-google-update-setup
    desc: Signed Google Update bootstrapper identity
    crit: exception
    conf: 0.99
    all:
      - id: google-update-product
      - id: google-update-setup-description
    any:
      - id: metadata/signed/leaf::google-inc
      - id: metadata/signed/leaf::google-llc
