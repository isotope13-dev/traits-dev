defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]
  size_max: 500000000

traits:
  - id: another-redis-desktop-manager-release
    desc: Another Redis Desktop Manager release context
    if:
      type: path
      regex: '(?i)Another-Redis-Desktop-Manager-win-[0-9][^\\/]*\.exe'
  - id: another-redis-desktop-manager-member
    desc: Another Redis Desktop Manager member
    if:
      type: basename
      exact: Another Redis Desktop Manager.exe
