# Vendora Connect is a disclosed WhatsApp-to-vendora.bot bridge. It reads
# session material by design after the user supplies a connection code; the
# identity and first-party endpoint form benign context for generic session
# theft composites, while the underlying capabilities remain visible.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, javascript, archives]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Vendora Connect extension manifest name
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Vendora Connect

  - id: manifest-description
    desc: Vendora WhatsApp bridge description
    for: [chrome-manifest]
    if:
      type: value
      path: description
      substr: vendora.bot

  - id: service-host
    desc: Vendora first-party service host
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https://app\.vendorabot\.com\.br\b'

  - id: integration-protocol
    desc: Vendora WhatsApp bridge endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: /api/instances/bridge-import

composite_rules:
  # The archive-level exception is unavailable when atomscan evaluates the
  # implementation file by itself.  These two stable first-party markers are
  # the narrow child-file equivalent.
  - id: bridge-script-context
    desc: Vendora bridge implementation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: service-host
      - id: integration-protocol

  - id: disclosed-integration-context
    desc: Vendora Connect disclosed WhatsApp bridge context
    crit: exception
    conf: 0.99
    for: [crx, archives]
    scope: archive
    all:
      - id: manifest-name
      - id: manifest-description
      - id: service-host
      - id: integration-protocol
      # Host access is a neutral manifest capability; the Vendora identity
      # comes from the other four legs above.
      - id: metadata/permission/host::host-permission-im-web-app
