# StartOS (Start9 Labs) — privacy-focused personal server OS. Tor onion
# connectivity checks, image-build sudoers, and kiosk/setup scripts are
# product behavior, not attack tooling.
defaults:
  platforms: [unix]
  for: [shell, text, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: tor-check-custom-list-path
    desc: StartOS tor-check custom onion list path
    for: [shell]
    if:
      type: text
      substr: ~/.startos/tor-check.list

  - id: startd-tor-proxy-label
    desc: StartOS Startd Tor SOCKS proxy label
    for: [shell]
    if:
      type: text
      substr: 'Startd Tor|'

  - id: official-onion-service
    desc: Start9 official privacy onion service
    for: [shell, text, markdown]
    if:
      type: text
      substr: privacy34kn4ez3y3nijweec6w4g54i3g54sdv7r5mr6soma3w4begyd.onion

  - id: onion-connectivity-banner
    desc: StartOS onion connectivity test banner
    for: [shell]
    if:
      type: text
      substr: 'Testing Onion Connections...'

  - id: upstream-organization
    desc: Start9 Labs GitHub organization reference
    if:
      type: text
      substr: github.com/start9labs/
      case_insensitive: true

  - id: image-build-banner
    desc: StartOS image build banner
    for: [shell]
    if:
      type: text
      substr: '==== StartOS Image Build ===='

  - id: start9-nopasswd-dropin
    desc: StartOS start9 passwordless sudoers drop-in
    for: [shell]
    if:
      type: text
      substr: 010_start9-nopasswd

  - id: clearnet-wireguard-setup
    desc: StartOS Clearnet WireGuard VPS setup
    for: [shell]
    if:
      type: text
      substr: 'for StartOS Clearnet functionality'

  - id: start9-home-ssh-dir
    desc: StartOS start9 user SSH directory path
    for: [shell]
    if:
      type: text
      substr: /home/start9/.ssh

  - id: lib-startos-version-path
    desc: StartOS version file under /usr/lib/startos
    for: [shell]
    if:
      type: text
      substr: /usr/lib/startos/VERSION.txt

composite_rules:
  - id: tor-connectivity-check-context
    desc: Recognized StartOS Tor connectivity check context
    crit: exception
    conf: 0.99
    for: [shell]
    needs: 2
    any:
      - id: tor-check-custom-list-path
      - id: startd-tor-proxy-label
      - id: official-onion-service
      - id: onion-connectivity-banner

  - id: image-build-context
    desc: Recognized StartOS image build script context
    crit: exception
    conf: 0.99
    for: [shell]
    needs: 2
    any:
      - id: image-build-banner
      - id: start9-nopasswd-dropin
      - id: lib-startos-version-path

  - id: clearnet-setup-context
    desc: Recognized StartOS Clearnet WireGuard setup context
    crit: exception
    conf: 0.99
    for: [shell]
    needs: 2
    any:
      - id: clearnet-wireguard-setup
      - id: start9-home-ssh-dir
      - id: upstream-organization
