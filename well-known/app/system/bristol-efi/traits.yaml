defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 16777216

traits:
  - id: bristol-efi-source-path
    desc: Apple BristolEFI storage-driver source path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: /BristolEFI/BristolEFI-
      section: .text

composite_rules:
  - id: bristol-efi-storage-context
    desc: Apple BristolEFI storage firmware context
    crit: exception
    conf: 0.99
    all:
      - id: bristol-efi-source-path
      - id: metadata/binary/layout::efi-pe-subsystem
      - id: micro-behaviors/os/kernel/firmware::uefi-loaded-image-protocol
      - id: micro-behaviors/os/kernel/firmware::uefi-simple-file-system-protocol
