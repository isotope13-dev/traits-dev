defaults:
  platforms: [unix, windows]
  for: [composer.json, php, javascript, zip, archives, markdown]
  crit: baseline
  conf: 0.98

traits:
  - id: craft-author-toolbar-composer-name
    desc: digitalastronaut/craft-author-toolbar package
    crit: notable
    conf: 0.98
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: digitalastronaut/craft-author-toolbar

  - id: craft-author-toolbar-github
    desc: tim-digitalastronaut craft-author-toolbar repo
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: tim-digitalastronaut/craft-author-toolbar

  - id: craft-author-toolbar-member
    desc: Craft author toolbar member
    for: [javascript]
    if:
      type: path
      substr: craft-author-toolbar-
  - id: utils-js-basename
    desc: Craft author toolbar utils path
    for: [javascript]
    if:
      type: path
      regex: 'craft-author-toolbar.*utils\.js$'

composite_rules:
  - id: craft-author-toolbar-package
    desc: digitalastronaut Craft author toolbar plugin
    crit: notable
    conf: 0.98
    any:
      - id: craft-author-toolbar-composer-name
      - id: craft-author-toolbar-github
  - id: craft-author-toolbar-utils
    desc: Craft author toolbar utils
    crit: notable
    conf: 0.98
    all:
      - id: craft-author-toolbar-member
      - id: utils-js-basename
