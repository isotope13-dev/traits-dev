defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.99

traits:
  - id: motorola-launcher-package
    desc: Motorola Launcher package identifier
    for: [xml]
    if:
      type: value
      path: android_xml.values[*].value
      exact: "com.motorola.launcher3"

  - id: motorola-launcher-class
    desc: Motorola Launcher class descriptor
    if:
      type: text
      substr: "Lcom/motorola/launcher3/"

  - id: motorola-plugin-core-class
    desc: Motorola Plugin Core class descriptor
    if:
      type: text
      substr: "Lcom/motorola/plugin/core/"

  - id: motorola-plugin-sdk-class
    desc: Motorola Plugin SDK class descriptor
    if:
      type: text
      substr: "Lcom/motorola/plugin/sdk/"

composite_rules:
  - id: motorola-launcher-application
    desc: Motorola Launcher Android application identity
    conf: 0.995
    for: [apk, xml, dex]
    any:
      - id: motorola-launcher-package
      - id: motorola-launcher-class

  - id: motorola-launcher-dex-features
    desc: Motorola Launcher DEX component features
    crit: exception
    conf: 0.995
    all:
      - id: motorola-launcher-class
      - id: motorola-plugin-core-class
      - id: motorola-plugin-sdk-class
