# MediaTek BootROM / FlashTool communication DLL (brom.dll).  Phone-flashing
# toolchains ship this unsigned helper with a writable .text section and an
# entry point in RWX memory by linker convention, not as a packer stub.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  size_min: 1048576
  size_max: 10485760

traits:
  - id: flashtool-company-name
    desc: MediaTek Inc. company metadata
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: MediaTek Inc.

  - id: flashtool-internal-name
    desc: brom.dll internal name metadata
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: brom.dll

  - id: flashtool-product-name
    desc: BootROM FlashTool product metadata
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      substr: BootROM and FlashTool Communication DLL

  - id: flashtool-original-filename
    desc: brom.dll original filename metadata
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: brom.dll

  - id: flashtool-pdb-path
    desc: FlashTool release build PDB path
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)FlashtoollibEx\.pdb$'

composite_rules:
  - id: mediatek-flashtool-brom-context
    desc: MediaTek BootROM FlashTool brom.dll component context
    crit: exception
    conf: 0.99
    all:
      - id: flashtool-company-name
      - id: flashtool-internal-name
      - id: flashtool-product-name
      - id: flashtool-original-filename
