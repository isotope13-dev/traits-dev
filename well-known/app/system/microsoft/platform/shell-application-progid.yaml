defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
    - asp
  platforms:
    - windows
traits:
  - id: shell-application-progid
    desc: Shell.Application ProgID string
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell, asp]
    crit: notable
    conf: 0.85
    if:
      type: text
      word: Shell.Application
      case_insensitive: true
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/os/application/shell-namespace::createobject-shell-application
