defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: onecore-forwarder-description
    desc: OneCore forwarder shim description
    crit: notable
    if:
      type: value
      path: pe.version.description
      exact: OneCore forwarder shim
composite_rules:
