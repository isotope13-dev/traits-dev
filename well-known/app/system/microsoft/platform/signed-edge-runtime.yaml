defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: microsoft-signed-edge-runtime-context
    desc: Genuine Microsoft-signed Edge runtime binary
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/os/application/target/browser::microsoft-edge-name
      - id: metadata/signature/verified/platform::microsoft
