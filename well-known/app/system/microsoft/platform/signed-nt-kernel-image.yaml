# The verified platform signature proves Microsoft signed it; the version
# resource and product name say which binary it is.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: microsoft-nt-kernel-image
    desc: Verified Microsoft Windows NT kernel image
    crit: notable
    conf: 0.99
    all:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/binary/provenance/version-info::pe-version-original-filename-ntkrnlmp
      - id: metadata/binary/provenance/version-info::pe-version-description-nt-kernel-system
      - id: well-known/app/system/microsoft/platform::windows-os-product-name
