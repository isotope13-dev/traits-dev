defaults:
  size_min: 8
traits:
- platforms:
  - windows
  for:
  - batch
  - powershell
  - text
  - data
  id: msconfig-name-reference
  desc: References Windows msconfig command name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bmsconfig(\.exe)?\b
  unless:
    - id: metadata/file/line::many-single-token-lines
    - id: metadata/lang/natural/phrasing/system::windows-safe-mode-toggle-title
