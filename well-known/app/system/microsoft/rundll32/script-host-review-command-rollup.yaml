defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  size_min: 6
composite_rules:
  - id: rundll32-command-reference
    desc: References the Windows rundll32 command host
    crit: notable
    conf: 0.92
    any:
      - id: well-known/app/system/microsoft/rundll32::rundll32-command-text
      - id: micro-behaviors/process/create/exec::rundll32-powershell-call
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: micro-behaviors/os/application/target/system::rundll32-executable-reference
