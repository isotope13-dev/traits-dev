defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  size_min: 6
traits:
  - id: rundll32-dll-export-command
    desc: Rundll32 command loads a DLL export
    crit: notable
    conf: 0.93
    for: [text, batch, scripts]
    if:
      type: text
      regex: '(?i)^rundll32(\.exe)?\s+\S{1,40}\.dll\s*,\s*[A-Za-z_]\w{0,40}\s*$'
  - id: rundll32-command-text
    desc: Rundll32 command text
    crit: notable
    conf: 0.9
    # A native DLL may export a function named `rundll32`; a raw binary string
    # is not evidence that the file launches the Windows host process.  This
    # matcher is meaningful only in command-bearing script formats.
    for: [scripts, -powershell]
    if:
      type: text
      # Require an argument after the command, rather than a quoted image
      # name in a process allowlist or debugger-detection table.
      regex: '\brundll32(\.exe)?\s+[^\s"'']'
    unless:
      # Encyclopedia/documentation pages quote LOLBin names without invoking
      # them; keep the atom for actual command-bearing script contexts.
      - id: metadata/package/documentation/page::documentation-heading-html-page
  - id: rundll32-dll-unregister-command
    desc: Rundll32 command unregisters DLL server
    crit: notable
    conf: 0.98
    for: [scripts, binaries, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\brundll32(\.exe)?\s+[^,\r\n]{1,200}\.dll\s*,\s*DllUnregisterServer\b'

  - id: rundll32-davsetcookie
    desc: Rundll32 registers a WebDAV cookie
    crit: notable
    conf: 0.96
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brundll32(\.exe)?\s+[^\r\n,]{1,180}\bdavclnt\.dll\s*,\s*DavSetCookie\b'

  - id: rundll32-ordinal-host
    desc: Rundll32 invokes an ordinal export
    crit: notable
    conf: 0.97
    for: [scripts]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: metadata/build/generated::generated-attack-map-context
    if:
      type: text
      # PowerShell droppers often backtick-escape `#` so the ordinal is not a
      # comment (`dll,`#1`). Accept an optional backtick before the hash.
      regex: '(?i)\brundll32(\.exe)?\s+[^\r\n,]{1,200},\s*`?#\d+\b'

  - id: rundll32-sta-clsid-activation
    desc: Rundll32 activates pathless COM class
    crit: notable
    conf: 0.98
    for: [scripts, binaries, c, cpp, csharp, go, rust]
    if:
      # /sta accepts a registered CLSID and resolves the DLL through COM, so
      # the loaded module never needs to appear on the command line.
      type: text
      regex: '(?i)\brundll32(\.exe)?\s+/sta\s+\{[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}\}'
