defaults:
  platforms: [windows]

traits:
  - id: dw20-original-filename
    for: [pe]
    size_max: 2097152
    desc: Windows Error Reporting DW20 executable identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: DW20.Exe
      case_insensitive: true

  - id: werfault-executable-reference
    for: [scripts, source, binaries]
    size_min: 16
    size_max: 10485760
    desc: References WerFault or WerFaultSecure binary
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bWerFault(Secure)?\.exe\b'
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository

  - id: werui-dll-reference
    for: [scripts, source, binaries]
    size_min: 16
    size_max: 10485760
    desc: References Windows werui.dll library
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bwerui\.dll\b'
