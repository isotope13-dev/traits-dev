# Product identity requires the marker cluster and a verified Microsoft signer.
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
composite_rules:
- id: mighost-binary-identity
  desc: Microsoft Windows migration plugin host
  conf: 0.995
  all:
  - id: mighost-command-template
  - id: mighost-pdb
  - id: metadata/signature/verified/platform::microsoft
  any:
  - id: mighost-load-dll-server-log
  - id: mighost-parent-exit-log
  - id: mighost-volatile-registry-log
  needs: 2
