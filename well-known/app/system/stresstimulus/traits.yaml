# StresStimulus installer bundles several legitimate third-party and
# Microsoft components. Their metadata is intentionally exact so these
# identities can suppress loader heuristics without creating a broad .NET
# exception.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 512
  size_max: 30000000

traits:
  - id: stresstimulus-installer-original-filename
    desc: StresStimulus installer original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: StresStimulusInstaller_Full.exe
  - id: stresstimulus-installer-product
    desc: StresStimulus installer product name
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: StresStimulusInstaller
  - id: logicnp-cryptolicensing
    desc: LogicNP CryptoLicensing DLL identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: LogicNP.CryptoLicensing.dll
  - id: mschart-original-filename
    desc: Microsoft Chart Controls setup filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: MSChart.exe
  - id: mschart-description
    desc: Microsoft Chart Controls setup description
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Microsoft Chart Controls for Microsoft .NET Framework 3.5 Setup
  - id: stresstimulus-dll-original-filename
    desc: StresStimulus managed library filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: StresStimulus.dll
  - id: stresstimulus-company
    desc: Stimulus Technology company marker
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Stimulus Technology
  - id: fiddlercore-original-filename
    desc: FiddlerCore library filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: FiddlerCore.dll
  - id: fiddlercore-company
    desc: FiddlerCore library company
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Eric Lawrence
  - id: stresstimulus-fiddler-original-filename
    desc: StresStimulus Fiddler add-on filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: StresStimulus.Core.Fiddler.dll
  - id: stresstimulus-core-original-filename
    desc: StresStimulus Core library filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: StresStimulus.Core.dll
  - id: stresstimulus-license-original-filename
    desc: StresStimulus license library filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: StresStimulus.License.dll
  - id: stresstimulus-license-product
    desc: StresStimulus license library product
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: StresStimulus.License
  - id: stresstimulus-license-company
    desc: StresStimulus license library company
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: ST

composite_rules:
  - id: stresstimulus-installer
    desc: StresStimulus installer identity
    crit: notable
    conf: 0.99
    all:
      - id: stresstimulus-installer-original-filename
      - id: stresstimulus-installer-product
  - id: mschart-setup
    desc: Microsoft Chart Controls setup identity
    crit: notable
    conf: 0.99
    all:
      - id: mschart-original-filename
      - id: mschart-description
  - id: stresstimulus-dll
    desc: StresStimulus managed library identity
    crit: notable
    conf: 0.99
    all:
      - id: stresstimulus-dll-original-filename
      - id: stresstimulus-company
  - id: fiddlercore
    desc: FiddlerCore library identity
    crit: notable
    conf: 0.99
    all:
      - id: fiddlercore-original-filename
      - id: fiddlercore-company
  - id: stresstimulus-fiddler
    desc: StresStimulus Fiddler add-on identity
    crit: notable
    conf: 0.99
    all:
      - id: stresstimulus-fiddler-original-filename
      - id: stresstimulus-company
  - id: stresstimulus-core
    desc: StresStimulus Core library identity
    crit: notable
    conf: 0.99
    all:
      - id: stresstimulus-core-original-filename
      - id: stresstimulus-company
  - id: stresstimulus-license
    desc: StresStimulus license library identity
    crit: notable
    conf: 0.99
    all:
      - id: stresstimulus-license-original-filename
      - id: stresstimulus-license-product
      - id: stresstimulus-license-company
