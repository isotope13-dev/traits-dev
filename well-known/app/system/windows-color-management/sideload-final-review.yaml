defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: launch-color-cpl-symbol
    desc: Windows LaunchColorCpl symbol
    crit: notable
    conf: 0.96
    for:
      - pe
      - dll
    if:
      type: symbol
      exact: LaunchColorCpl
  - id: colorui5-dll-name-component
    desc: Windows colorui5 DLL name
    crit: component
    conf: 0.98
    for:
      - pe
      - dll
    if:
      type: text
      section: any
      exact: colorui5.dll
