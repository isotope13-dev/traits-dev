defaults:
  platforms: [windows, unix]
  for: [npm, tar, pe, package.json, javascript, typescript, data]
  crit: notable
  conf: 0.99

traits:
  - id: release-archive-name
    desc: AgentSwarm CLI release archive name
    for: [npm, tar]
    if:
      type: basename
      regex: '(?i)^@?vrsen[-/]agentswarm-cli-windows-arm64-[0-9]'

  - id: package-name
    desc: AgentSwarm CLI package name
    for: [package.json, data]
    if:
      type: value
      path: name
      exact: '@vrsen/agentswarm-cli-windows-arm64'

  - id: agentswarm-binary
    desc: AgentSwarm CLI executable
    for: [pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      basename: true
      exact: agentswarm.exe
      case_insensitive: true

composite_rules:
  - id: cli-identity
    desc: AgentSwarm CLI package identity
    crit: notable
    conf: 0.99
    for: [package.json, data]
    scope: archive
    all:
      - id: package-name
      - id: release-archive-name

  - id: cli-archive-context
    desc: AgentSwarm Bun CLI archive context
    crit: exception
    conf: 0.99
    for: [npm, tar, pe, data]
    scope: archive
    all:
      - id: cli-identity
      - id: agentswarm-binary
