# KDE Info Center "Devices" category .desktop (KInfoCenterCategory).
# Official Plasma service metadata — not an XDG autostart drop.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 100000

traits:
  - id: device-information-category
    desc: KInfoCenter device_information category
    if:
      type: text
      substr: 'X-KDE-KInfoCenter-Category=device_information'

  - id: desktop-basename
    desc: KInfoCenter devices category desktop file
    if:
      type: path
      basename: true
      exact: deviceinfocategory.desktop
      case_insensitive: true

composite_rules:
  - id: kinfocenter-devices-category
    desc: KDE Info Center Devices category entry
    conf: 0.99
    needs: 2
    any:
      - id: well-known/app/system/plasma-kinfocenter::kinfocenter-category-service-type
      - id: device-information-category
      - id: desktop-basename
