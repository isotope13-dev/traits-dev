# Far Manager is Eugene Roshal's long-running Windows file manager (the author
# of RAR). A file manager copies and moves executables, walks directories with
# wildcards, spawns the command interpreter, stages temp copies for its viewer
# and editor, and its process-list plugin enables SeDebugPrivilege to read other
# processes -- the same API sets as a file infector or a privilege abuser. The
# VERSIONINFO company line names the vendor. The UPX-packed unsigned imitations
# are still convicted by far-manager-upx-unsigned-masquerade in
# objectives/evasion/masquerade/brand/installer, which this trait does not touch.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 16777216

traits:
  - id: far-manager-versioninfo-company
    desc: VERSIONINFO company Eugene Roshal and FAR Group
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      regex: '^Eugene Roshal( & FAR Group)?$'
