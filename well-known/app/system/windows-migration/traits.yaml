defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 2097152

traits:
  - id: mighost-command-template
    desc: Windows MigHost surrogate command syntax
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: MigHost.exe {SurrogateCLSID} /InitDoneEvent:<event_name> /LogDir:<path> /ParentPID:<pid>
      section: .rdata

  - id: mighost-load-dll-server-log
    desc: Windows MigHost DLL-server loading diagnostic
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: CMigPluginSurrogate::LoadDllServer
      section: .rdata

  - id: mighost-parent-exit-log
    desc: Windows MigHost parent-process exit diagnostic
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Parent process unexpectedly exited. Terminating host.
      section: .rdata

  - id: mighost-volatile-registry-log
    desc: Windows MigHost volatile-registry diagnostic
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: CreateVolatileRegValue(%s, %s, %s)
      section: .rdata

  - id: mighost-pdb
    desc: Windows MigHost debug database name
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: mighost.pdb
      section: .rdata

composite_rules:
  - id: mighost-binary-identity
    desc: Microsoft Windows migration plugin host
    crit: notable
    conf: 0.995
    all:
      - id: mighost-command-template
      - id: mighost-pdb
    any:
      - id: mighost-load-dll-server-log
      - id: mighost-parent-exit-log
      - id: mighost-volatile-registry-log
    needs: 2
