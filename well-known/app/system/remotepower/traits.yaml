# Identity markers for the published RemotePower fleet-management project.
# These are specific to the source release and are used only to avoid treating
# its documented management features and test fixtures as RAT or stealer code.
defaults:
  platforms: [unix, windows]
  for: [python, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: api-backend-identity
    desc: RemotePower API backend source identity
    if:
      type: text
      substr: "RemotePower API backend - v1.9.0"

  - id: windows-agent-identity
    desc: RemotePower Windows agent source identity
    for: [python]
    if:
      type: text
      substr: "RemotePower — Windows agent."

  - id: agent-identity
    desc: RemotePower agent source identity
    for: [python]
    if:
      type: text
      regex: '(?i)remotepower\b.{0,60}\bagent\b'

  - id: release-tree-member-path
    desc: RemotePower release-tree member
    for: [python, javascript, source, scripts, text]
    if:
      type: path
      regex: '(^|/)remotepower(-\d+(\.\d+)*)?/'

  - id: release-product-marker
    desc: RemotePower product source marker
    if:
      type: text
      regex: '(?i)RemotePower|remotepower'

  - id: archive-api-member
    desc: RemotePower API member in release archive
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)server/cgi-bin/api\.py$'

  - id: archive-windows-agent-member
    desc: RemotePower Windows agent archive member
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)client/remotepower-agent-win\.py$'

composite_rules:
  - id: documented-rmm-release-archive-context
    desc: Published RemotePower release archive context
    crit: notable
    conf: 0.99
    for: [tar]
    scope: archive
    all:
      - id: well-known/app/system/remotepower::archive-api-member
      - id: well-known/app/system/remotepower::archive-windows-agent-member

  - id: remotepower-agent-source-context
    desc: RemotePower agent source context
    crit: notable
    conf: 0.99
    for: [python]
    all:
      - id: well-known/app/system/remotepower::release-tree-member-path
      - id: well-known/app/system/remotepower::release-product-marker
      - id: well-known/app/system/remotepower::agent-identity

  - id: documented-rmm-release-context
    desc: Published RemotePower release member context
    crit: exception
    conf: 0.99
    for: [tar, python, javascript, scripts, source]
    any:
      - id: well-known/app/system/remotepower::documented-rmm-release-archive-context
      - id: well-known/app/system/remotepower::remotepower-agent-source-context
