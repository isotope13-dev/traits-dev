# FreeIPA-specific directory schema and DNs. These name the product's own
# namespace, so they identify a FreeIPA deployment as the target of whatever
# directory operation the surrounding code performs.
defaults:
  platforms: [unix]
  for: [scripts, source, text]
  crit: notable
  conf: 0.97

traits:
  - id: freeipa-otp-entry-dn
    desc: References FreeIPA OTP entry DN
    if:
      type: text
      regex: '(?i)ipaTokenUniqueID\s*=\s*[^,\r\n]{1,160},\s*cn\s*=\s*otp\s*,'

  - id: freeipa-otp-token-objectclass
    desc: References a FreeIPA OTP token objectClass
    if:
      type: text
      regex: '(?i)["'']?\bipaToken(TOTP|HOTP)\b["'']?'

  - id: freeipa-admins-group-dn
    desc: References the FreeIPA admins group DN
    if:
      type: text
      regex: '(?i)cn\s*=\s*admins\s*,\s*cn\s*=\s*groups\s*,\s*cn\s*=\s*accounts\b'
