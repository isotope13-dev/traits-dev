defaults:
  crit: notable
  conf: 0.99
  platforms: [unix]
  for: [shell]

traits:
  - id: pam-winbind-arch-release
    desc: Signed Arch Samba Winbind PAM module
    for: [elf, so]
    size_min: 71856
    size_max: 71856
    if:
      type: yara
      source: |
        import "hash"

        rule pam_winbind_arch_release {
          condition:
            // pam_winbind.so from the signed samba 4.24.4-1 package.
            hash.sha256(0, filesize) ==
              "5d2c5527090b5a7287bde889bb59953b097c03d7eeba4a5c42dff79a02d32ae7"
        }
  - id: samba-md4-hash-export
    desc: Samba MD4 password-hash export
    for: [elf, so]
    size_min: 100
    size_max: 20000000
    if:
      type: export
      exact: E_md4hash
  - id: samba-des-hash-export
    desc: Samba DES password-hash export
    for: [elf, so]
    size_min: 100
    size_max: 20000000
    if:
      type: export
      exact: E_deshash
  - id: samba-configuration-library
    desc: Samba configuration shared library
    for: [elf, so]
    size_min: 100000
    size_max: 20000000
    if:
      type: basename
      regex: '^libsmbconf\.so(\.[0-9.]+)?$'
  - id: samba-source-tree
    desc: Samba source-tree path
    size_min: 100
    size_max: 100000000
    # `shell, vbs` folded in from a second samba home under app/network/,
    # which held the same `Samba source-tree path` matcher for those types.
    for: [binaries, scripts, source, c, cpp, python, shell, vbs]
    if:
      type: path
      regex: 'samba-[0-9][^\\/]*|samba-team.samba@v'
  - id: samba-registry-import-regression-test
    desc: Samba registry import regression test
    size_min: 100
    size_max: 100000000
    if:
      type: text
      regex: '\bsamba_net\s+rpc\s+registry\s+import\b'
