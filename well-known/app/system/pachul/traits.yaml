# Pachul — GTK4/libadwaita Pacman/AUR front end for Arch Linux.
# Tray autostart and desktop entries are documented product UX.
defaults:
  platforms: [unix]
  for: [python, shell, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: github-repository-url
    desc: Pachul GitHub repository URL
    if:
      type: text
      substr: github.com/wergosam/Pachul

  - id: desktop-application-id
    desc: Pachul desktop application ID
    if:
      type: text
      substr: io.github.wergosam.pachul

  - id: pacman-aur-front-end-marker
    desc: Pacman AUR front end description
    if:
      type: text
      substr: Pacman/AUR front end

  - id: source-tree-path
    desc: Pachul source tree path
    if:
      type: path
      regex: '(?i)(^|[/\\])Pachul(-[0-9]|/)'

composite_rules:
  - id: pachul-context
    desc: Recognized Pachul package manager app context
    crit: exception
    conf: 0.99
    any:
      - id: github-repository-url
      - id: desktop-application-id
      - id: pacman-aur-front-end-marker
      - id: source-tree-path
