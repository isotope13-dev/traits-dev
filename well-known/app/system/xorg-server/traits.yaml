defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 50000000

traits:
  - id: xorg-server-version-banner
    desc: X.Org X Server version banner
    if:
      type: text
      section: rdata
      substr: "X.Org X Server %d.%d.%d"

  - id: xorg-driver-abi-classes
    desc: X.Org driver and extension ABI strings
    if:
      type: text
      section: rdata
      regex: 'X\.Org Video Driver[\s\S]{0,80}X\.Org XInput driver'

composite_rules:
  - id: xorg-server-binary
    desc: X.Org X11 display server binary
    all:
      - id: xorg-server-version-banner
      - id: xorg-driver-abi-classes
