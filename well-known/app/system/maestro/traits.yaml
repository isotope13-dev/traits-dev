# Maestro is an open-source mobile and web UI test framework.  These markers
# identify its upstream source distribution so ordinary test-driver mechanics
# can be distinguished from unrelated automation tooling.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-repository
    desc: Maestro upstream repository marker
    if:
      type: text
      substr: github.com/mobile-dev-inc/Maestro

  - id: product-description
    desc: Maestro UI testing framework description
    if:
      type: text
      regex: '(?i)Maestro.{0,80}open-source framework.{0,100}(Android|iOS).{0,40}(web|end-to-end)'

  - id: android-driver-package
    desc: Maestro Android driver package
    platforms: [android]
    for: [kotlin]
    if:
      type: text
      substr: 'package maestro.drivers'

  - id: android-driver-service
    desc: Maestro Android instrumentation service
    platforms: [android]
    for: [kotlin]
    if:
      type: text
      substr: 'dev.mobile.maestro.MaestroDriverService#grpcServer'

  - id: android-test-app-path
    desc: Maestro Android test app resource
    platforms: [android]
    for: [apk]
    if:
      type: path
      basename: true
      exact: maestro-app.apk
      case_insensitive: true

  - id: ios-test-fixture-archive
    desc: Maestro iOS test fixture archive
    platforms: [macos, ios]
    for: [zip]
    if:
      type: path
      basename: true
      exact: test-ios.zip
      case_insensitive: true

  - id: ios-test-fixture-path
    desc: Maestro iOS test app fixture path
    platforms: [macos, ios]
    for: [plist]
    if:
      type: path
      regex: '(?i)(^|[\\/])SimpleWebViewApp\.app([\\/]|$)'

composite_rules:
  - id: source-archive-context
    desc: Recognized Maestro upstream source archive
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, archives]
    all:
      - id: upstream-repository
      - id: product-description

  - id: android-test-driver-context
    desc: Maestro Android test-driver source context
    crit: exception
    conf: 0.99
    platforms: [android]
    for: [kotlin]
    all:
      - id: android-driver-package
      - id: android-driver-service

  - id: ios-test-fixture-context
    desc: Maestro iOS example test fixture context
    crit: exception
    conf: 0.99
    platforms: [macos, ios]
    scope: archive
    for: [zip, plist]
    all:
      - id: ios-test-fixture-archive
      - id: ios-test-fixture-path
