# MiKTeX's Windows setup programs are installer binaries with COM/OLE,
# resource extraction, registry, process, and locale code.  Require several
# independent identity fields before using the product identity as benign
# context for objective composites.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  crit: notable
  conf: 0.99

traits:
  - id: company
    desc: MiKTeX company metadata
    if:
      type: value
      path: pe.version.company
      exact: MiKTeX.org

  - id: product-name
    desc: MiKTeX product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: MiKTeX

  - id: setup-description
    desc: MiKTeX Setup Wizard description
    if:
      type: value
      path: pe.version.description
      exact: MiKTeX Setup Wizard

  - id: setup-manifest-identity
    desc: MiKTeX Setup Wizard manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: MiKTeXOrg.MiKTeX.SetupMFC

composite_rules:
  - id: miktex-setup-wizard
    desc: MiKTeX Setup Wizard identity
    crit: notable
    conf: 0.99
    all:
      - id: company
      - id: product-name
      - id: setup-description
      - id: setup-manifest-identity
