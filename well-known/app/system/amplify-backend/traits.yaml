defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: amplify-backend-member
    crit: notable
    desc: Amplify backend archive member
    for: [javascript, php, source, data]
    if:
      type: path
      substr: amplify-plugin-backend-
composite_rules:
  - id: amplify-public-js-asset
    desc: Amplify public JS asset
    crit: notable
    conf: 0.98
    all:
      - id: amplify-backend-member
      - id: metadata/package/files/runtime::numbered-public-js
