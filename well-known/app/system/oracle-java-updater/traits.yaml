defaults:
  platforms: [unix, windows]

composite_rules:
  - id: signed-oracle-java-updater
    desc: Signed Oracle Java updater context
    crit: exception
    conf: 0.99
    all:
      - id: well-known/lib/runtime/jvm::windows-jdk-product-identity
      - id: metadata/signed/certificate/identity::pe-signer-oracle-america
