# KDE Info Center category .desktop (KInfoCenterCategory).
# Official Plasma service metadata — not an XDG autostart drop.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 100000

traits:
  - id: kinfocenter-category-service-type
    desc: KInfoCenter category KDE service type
    if:
      type: text
      substr: 'X-KDE-ServiceTypes=KInfoCenterCategory'
