# KDE Info Center "Graphics" category .desktop (KInfoCenterCategory).
# Official Plasma service metadata — not an XDG autostart drop.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 100000

traits:
  - id: graphical-information-category
    desc: KInfoCenter graphical_information category
    if:
      type: text
      substr: 'X-KDE-KInfoCenter-Category=graphical_information'

  - id: desktop-basename
    desc: KInfoCenter graphics category desktop file
    if:
      type: path
      basename: true
      exact: graphicalinfocategory.desktop
      case_insensitive: true

composite_rules:
  - id: kinfocenter-graphics-category
    desc: KDE Info Center Graphics category entry
    conf: 0.99
    needs: 2
    any:
      - id: well-known/app/system/plasma-kinfocenter::kinfocenter-category-service-type
      - id: graphical-information-category
      - id: desktop-basename
