# dbp/relay-authorization-bundle — Digital Blueprint Relay API authorization.
defaults:
  platforms: [windows, unix]
  for: [php, composer.json, json, zip, archives]
  crit: notable
  conf: 0.98

traits:
  - id: composer-package-name
    desc: Composer package dbp/relay-authorization-bundle
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: dbp/relay-authorization-bundle

  - id: relay-authorization-namespace
    desc: Dbp Relay AuthorizationBundle PHP namespace
    for: [php]
    if:
      type: text
      substr: Dbp\Relay\AuthorizationBundle\

  - id: relay-core-bundle-dependency
    desc: dbp/relay-core-bundle composer dependency
    for: [composer.json, json]
    if:
      type: text
      substr: '"dbp/relay-core-bundle"'

composite_rules:
  - id: dbp-relay-authorization-bundle
    desc: Digital Blueprint Relay authorization Symfony bundle
    crit: notable
    conf: 0.99
    any:
      - id: composer-package-name
      - id: relay-authorization-namespace
