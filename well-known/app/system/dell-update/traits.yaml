defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.95

traits:
  - id: dupframework-original-filename
    desc: Dell Update Package DUPFramework executable name
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^DUPFramework\.exe$'

  - id: dupframework-internal-name
    desc: Dell Update Package DUPFramework internal name
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^DUPFramework\.exe$'

  - id: dupframework-pdb-path
    desc: Dell Update Package DupFramework PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)DUP_Framework.+DupFramework\.pdb$'

  - id: dell-update-package-description
    desc: Dell Update Package file description
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^Dell Update Package'

composite_rules:
  - id: dell-update-package-binary
    desc: Dell Update Package framework binary
    crit: notable
    conf: 0.98
    all:
      - id: metadata/signed/leaf::dell-inc.
    any:
      - id: dupframework-original-filename
      - id: dupframework-internal-name
      - id: dupframework-pdb-path
      - id: dell-update-package-description
