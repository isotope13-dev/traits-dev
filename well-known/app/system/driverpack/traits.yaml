defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 30000000

traits:
  - id: product-name
    desc: DriverPack Solution product name
    if:
      type: value
      path: pe.version.product_name
      regex: '^DriverPack Solution\s*$'

  - id: setup-description
    desc: DriverPack Solution setup description
    if:
      type: value
      path: pe.version.description
      regex: '^DriverPack Solution Setup\s*$'

composite_rules:
  - id: maombi-signed-inno-installer
    desc: Maombi-signed DriverPack Solution Inno installer
    all:
      - id: product-name
      - id: setup-description
      - id: metadata/signed/leaf::maombi-ru-llc
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
