defaults:
  platforms: [unix, windows]
  for: [source, c, cpp, shell, text]
  size_max: 268435456
  crit: notable
  conf: 0.98

traits:
  - id: intel-compute-runtime-path
    desc: Intel Compute Runtime driver path
    if:
      type: path
      regex: '(?i)(^|[\\/])intel[\\/]compute-runtime'

  - id: intel-compute-runtime-repo-banner
    desc: Intel Compute Runtime repository reference
    if:
      type: text
      substr: 'github.com/intel/compute-runtime'

composite_rules:
  - id: intel-compute-runtime-driver
    desc: Intel Graphics Compute Runtime driver source
    crit: notable
    conf: 0.99
    any:
      - id: intel-compute-runtime-path
      - id: intel-compute-runtime-repo-banner
