# Version-resource strings identify a claimed Realtek audio component, not a signer.
defaults:
  conf: 0.9
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: realtek-audio-service-label
    desc: Realtek Audio Service label in resource
    crit: notable
    if:
      type: text
      exact: Realtek Audio Service
      section: .rsrc
  - id: realtek-rtkaudio-filename
    desc: Realtek rtkaudio DLL filename
    crit: notable
    if:
      type: text
      exact: rtkaudio.dll
      section: .rsrc
  - id: realtek-rtkaudio-manifest
    desc: Realtek rtkaudio manifest identity
    crit: notable
    if:
      type: text
      exact: Realtek.Windows.rtkaudio
      section: .rsrc

composite_rules:
  - id: realtek-rtkaudio-resource-context
    desc: Realtek audio service resource identity
    crit: notable
    conf: 0.97
    all:
      - id: metadata/vendor/string::realtek-company-marker-rsrc
      - id: realtek-audio-service-label
    any:
      - id: realtek-rtkaudio-filename
      - id: realtek-rtkaudio-manifest
  - id: realtek-rtkaudio-com-registration
    desc: Realtek audio resource identity with COM registration export
    crit: notable
    conf: 0.96
    all:
      - id: realtek-rtkaudio-resource-context
      - id: metadata/binary/symbols/exports::export-dll-register-server
