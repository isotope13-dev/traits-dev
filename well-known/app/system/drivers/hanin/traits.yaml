# Hanin / HPRT label printer Windows drivers (Xiamen Hanin Electronic Technology).
defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.96

traits:
  - id: hanin-company
    desc: Hanin printer vendor company metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)HPRT|Hanin'

  - id: hprt-label-printer-product
    desc: HPRT label printer driver product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)HPRT.*Label Printer'

  - id: hprt-label-printer-description
    desc: HPRT label printer driver file description
    if:
      type: value
      path: pe.version.description
      regex: '(?i)HPRT.*Label Printer'

  - id: hprt-driver-setup-filename
    desc: HPRT label printer driver setup archive member
    crit: notable
    for: [zip, archive]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)HPRT_.*Label_Printer.*Driver.*\.exe$'

composite_rules:
  - id: hprt-label-printer-driver
    desc: Hanin HPRT label printer Windows driver
    crit: notable
    conf: 0.99
    all:
      - id: hanin-company
    any:
      - id: hprt-label-printer-product
      - id: hprt-label-printer-description
      - id: hprt-driver-setup-filename
      - id: micro-behaviors/os/service/print::printer-driver-enable-export

  - id: hprt-driver-installer-bundle
    desc: HPRT label printer driver installer bundle
    crit: notable
    conf: 0.99
    for: [zip]
    scope: outer
    all:
      - id: hprt-label-printer-driver
      - id: hprt-driver-setup-filename
