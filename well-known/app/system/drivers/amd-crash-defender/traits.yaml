# AMD Crash Defender version-resource identity. These strings are benign on
# their own and become security-relevant only when combined with anomalies.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 52428800
  crit: notable
  conf: 0.98

traits:
  - id: product-name
    desc: AMD Crash Defender resource product string
    if:
      type: text
      section: .rsrc
      exact: AMD Crash Defender

  - id: tool-description
    desc: AMD Crash Defender resource description string
    if:
      type: text
      section: .rsrc
      exact: AMD Crash Defender Tool

  - id: internal-name
    desc: AMD Crash Defender resource internal name
    if:
      type: text
      section: .rsrc
      exact: AMDCrashDefender.exe
