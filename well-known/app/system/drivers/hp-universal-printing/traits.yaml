defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: hp-universal-printing-company
    desc: Hewlett-Packard publisher field
    if:
      type: value
      path: pe.version.company
      exact: Hewlett-Packard

  - id: hp-universal-printing-description
    desc: HP Universal Printing DLL filename
    if:
      type: value
      path: pe.version.description
      exact: hpmja130.dll

  - id: hp-universal-printing-version
    desc: HP Universal Printing file version
    if:
      type: value
      path: pe.version.file_version
      exact: 61.130.04.12834

composite_rules:
  - id: hp-universal-printing-hpmja130
    desc: HP Universal Printing PCL driver binary
    crit: notable
    conf: 0.99
    all:
      - id: hp-universal-printing-company
      - id: hp-universal-printing-description
      - id: hp-universal-printing-version
