defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.96

traits:
  - id: dell-company
    desc: Dell Inc. PE company metadata
    if:
      type: value
      path: pe.version.company
      exact: Dell Inc.

  - id: dell-ps-printer-driver-product
    desc: Dell PS plug-in printer driver product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Dell PS Plug-in Printer Driver

  - id: dell-ps-printer-driver-description
    desc: Dell PS plug-in printer driver file description
    if:
      type: value
      path: pe.version.description
      exact: Dell PS Plug-in Printer Driver

  - id: dell-ps-printer-driver-manifest
    desc: Dell PS plug-in printer driver manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Dell.PrinterDriver.dlpsc3fu

  - id: dell-ps-printer-driver-original-filename
    desc: Dell PS plug-in printer driver original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: dlpsc3fu.dll

  - id: dell-langmon-pdb-path
    desc: Dell PJL language monitor PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)CommonRTADellLangmon.+pjlmon'

  - id: language-monitor-status-product
    desc: Language Monitor for Status Monitor product
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: Language Monitor for Status Monitor

  - id: initialize-print-monitor-export
    desc: InitializePrintMonitor language-monitor export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: InitializePrintMonitor

  - id: pjl-printingscout-command
    desc: PJL PRINTINGSCOUT printer status command
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '@PJL PRINTINGSCOUT'
      section: text

composite_rules:
  - id: dell-ps-printer-driver-binary
    desc: Dell PS plug-in printer driver binary
    crit: notable
    conf: 0.99
    all:
      - id: dell-company
    any:
      - id: dell-ps-printer-driver-product
      - id: dell-ps-printer-driver-description
      - id: dell-ps-printer-driver-manifest
      - id: dell-ps-printer-driver-original-filename
    needs: 2

  - id: dell-pjl-language-monitor
    desc: Dell PJL printer language monitor
    crit: notable
    conf: 0.99
    all:
      - id: dell-langmon-pdb-path
    any:
      - id: language-monitor-status-product
      - id: initialize-print-monitor-export
      - id: pjl-printingscout-command
