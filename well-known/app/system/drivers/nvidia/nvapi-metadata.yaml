defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: nvidia-nvapi-original-filename
    desc: NVIDIA NVAPI original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: nvapi.dll
  - id: nvidia-nvapi-internal-name
    desc: NVIDIA NVAPI internal name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: nvapi.dll
  - id: nvidia-nvapi-product-name
    desc: NVIDIA Windows driver product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: NVIDIA Windows drivers

composite_rules:
  - id: nvidia-windows-nvapi-context
    desc: Signed NVIDIA NVAPI Windows driver
    crit: notable
    conf: 0.99
    all:
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
      - id: nvidia-nvapi-original-filename
      - id: nvidia-nvapi-internal-name
      - id: nvidia-nvapi-product-name
    any:
      - id: metadata/signature/verified/signer::nvidia-corporation
      - id: metadata/signature/unverified/signer::nvidia-corporation
      - id: metadata/signature/self-signed/signer::nvidia-corporation
      - id: metadata/signature/invalid/tampered/signer::nvidia-corporation
      - id: metadata/signature/invalid/bad-signature/signer::nvidia-corporation
