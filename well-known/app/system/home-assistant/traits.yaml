# Home Assistant core — open-source home automation platform.
defaults:
  platforms: [unix, windows]
  for: [python, pyproject.toml, zip, markdown, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 500000000

traits:
  - id: pyproject-name
    desc: homeassistant pyproject package name
    for: [pyproject.toml]
    if:
      type: text
      substr: 'name = "homeassistant"'

  - id: authors-email
    desc: Home Assistant authors contact email
    for: [pyproject.toml]
    if:
      type: text
      substr: hello@home-assistant.io

  - id: github-core-repo
    desc: home-assistant core GitHub repository
    for: [pyproject.toml, markdown, text]
    if:
      type: text
      substr: github.com/home-assistant/core

  - id: application-name-const
    desc: HomeAssistant application name constant
    for: [python]
    if:
      type: text
      substr: 'APPLICATION_NAME: Final = "HomeAssistant"'

  - id: components-tree-path
    desc: homeassistant components source path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])homeassistant[\\/]components'

composite_rules:
  - id: home-assistant-identity
    desc: Recognized Home Assistant core source
    needs: 2
    any:
      - id: pyproject-name
      - id: authors-email
      - id: github-core-repo
      - id: application-name-const
      - id: components-tree-path
