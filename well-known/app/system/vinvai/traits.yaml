defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98

traits:
  - id: vinvai-engine-configuration-marker
    desc: Vinv engine configuration marker
    if:
      type: text
      regex: '\bvinv\.(enginesPath|engines\.autoUpdate)\b'
  - id: vinvai-environment-marker
    desc: Vinv environment variable marker
    if:
      type: text
      regex: '\bVINV_(HOME|ENGINE_PROJECT_ROOT|CAPTURES_DIR)\b'

composite_rules:
  - id: vinvai-vscode-extension-context
    desc: VinvAI VS Code developer extension context
    crit: exception
    conf: 0.99
    all:
      - id: metadata/library/vscode::vscode-extension-marker
    any:
      - id: vinvai-engine-configuration-marker
      - id: vinvai-environment-marker
