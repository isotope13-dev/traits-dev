defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
  size_min: 32768
  size_max: 20971520

traits:
  - id: spider-solitaire-filename
    desc: Microsoft Spider Solitaire executable filename
    if:
      type: text
      exact: spidersolitaire.exe
      section: .rdata

  - id: common-client-library-filename
    desc: Microsoft Internet Games client DLL filename
    if:
      type: text
      exact: CmnCliM.dll
      case_insensitive: true
      section: .text

composite_rules:
  - id: client-file-set
    desc: Microsoft Internet Games client file set
    crit: notable
    conf: 0.99
    all:
      - id: spider-solitaire-filename
      - id: common-client-library-filename
