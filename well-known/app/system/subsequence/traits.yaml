# Subsequence is a generative MIDI sequencer. Its optional localhost live-coding
# server and MIDI/OSC networking are intended product functionality; the identity
# rules provide benign context for those capabilities without downgrading them.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Subsequence Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: subsequence

  - id: package-name
    desc: Subsequence package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: subsequence

  - id: project-repository
    desc: Subsequence upstream repository
    if:
      type: text
      exact: https://github.com/simonholliday/subsequence

  - id: live-coding-server-marker
    desc: Subsequence documented live-coding server
    for: [python, markdown, text]
    if:
      type: text
      substr: TCP eval server for live coding

composite_rules:
  - id: application-identity
    desc: Subsequence generative MIDI sequencer identity
    crit: notable
    conf: 0.99
    any:
      - id: wheel-distribution
      - id: package-name
      - id: project-repository

  - id: benign-live-coding-server-context
    desc: Subsequence documented localhost live-coding server
    crit: exception
    conf: 0.99
    all:
      - id: live-coding-server-marker
      - id: micro-behaviors/communications/socket/listen::asyncio-start-server-call
      - id: micro-behaviors/process/interpreter/python::eval-builtin
      - id: micro-behaviors/process/interpreter/python::exec-builtin
