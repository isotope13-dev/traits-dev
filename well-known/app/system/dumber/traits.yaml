defaults:
  platforms: [unix]
  for: [go]

traits:
  - id: go-module
    desc: Dumber Go module identity
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: github.com/bnema/dumber

  - id: product-homepage
    desc: Dumber browser product homepage marker
    crit: notable
    conf: 0.99
    for: [markdown]
    if:
      type: text
      substr: dumber.bnema.dev

  - id: render-stall-backtrace-function
    desc: Dumber render-stall backtrace helper
    crit: notable
    conf: 1.0
    if:
      type: function
      exact: maybeCaptureRenderStallBacktrace

  - id: render-stall-backtrace-log
    desc: Dumber render-stall backtrace log marker
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      exact: "cef: render stall native backtrace"

composite_rules:
  - id: application-identity
    desc: Dumber keyboard-driven browser identity
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: go-module
      - id: product-homepage

  - id: render-stall-diagnostic-context
    desc: Dumber render-stall diagnostic backtrace context
    crit: exception
    conf: 1.0
    scope: file
    all:
      - id: render-stall-backtrace-function
      - id: render-stall-backtrace-log
