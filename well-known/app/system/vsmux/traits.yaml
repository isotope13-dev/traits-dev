# VSmux — VS Code extension for managing T3code and agent CLI sessions (maddada/VSmux).
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: vsmux-vsix-name
    desc: VSmux VSIX archive name
    crit: notable
    if:
      type: path
      regex: '(?i)maddada\.VSmux'

  - id: vsmux-vsix-manifest
    desc: VSmux VSIX manifest identity
    crit: notable
    if:
      type: text
      regex: '(?i)Publisher="maddada".{0,40}Id="VSmux"|maddada/VSmux'

  - id: vsmux-package-name
    desc: VSmux extension package name
    crit: notable
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"VSmux"'

  - id: vsmux-terminal-daemon-marker
    desc: VSmux terminal daemon runtime marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: terminal-daemon-process

  - id: vsmux-bundle-text
    desc: VSmux product text marker
    crit: notable
    if:
      type: text
      substr: maddada/VSmux

composite_rules:
  - id: vsmux-vscode-extension
    desc: VSmux agent CLI manager VS Code extension
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: vsmux-vsix-manifest
    any:
      - id: vsmux-vsix-name
      - id: vsmux-package-name
      - id: vsmux-terminal-daemon-marker

  - id: vsmux-benign-bundle-context
    desc: VSmux VSIX bundled runtime context
    crit: exception
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: vsmux-vsix-manifest
    any:
      - id: vsmux-vsix-name
      - id: vsmux-terminal-daemon-marker
