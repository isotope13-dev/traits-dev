# SysManage Agent — cross-platform monitoring and remote-management agent from
# sysmanage.org. Privileged Windows helper scripts legitimately use UAC
# elevation and background start /b for daemon lifecycle.
defaults:
  platforms: [unix, windows]
  for: [python, batch, tar, archives, markdown, text]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: agent-module-path
    desc: SysManage agent Python module path
    if:
      type: path
      regex: 'sysmanage_agent[\\/]'

  - id: agent-package-directory
    desc: SysManage agent package directory name
    if:
      type: path
      regex: 'sysmanage-agent[-.]'

  - id: windows-installer-script-path
    desc: SysManage Windows installer script path
    for: [powershell, batch]
    if:
      type: path
      regex: 'installer[\\/]windows[\\/]'

  - id: project-website
    desc: SysManage project website reference
    if:
      type: text
      substr: sysmanage.org

  - id: repo-hosting-path
    desc: SysManage agent GitHub repository path
    if:
      type: text
      substr: bceverly/sysmanage-agent

  - id: agent-product-name
    desc: SysManage Agent product name reference
    if:
      type: text
      substr: SysManage Agent

composite_rules:
  - id: agent-batch-script-context
    desc: SysManage agent Windows script bundle
    crit: notable
    conf: 0.99
    all:
      - id: agent-package-directory
      - id: agent-product-name

  - id: agent-repo-identity
    desc: SysManage agent repository identity
    crit: notable
    conf: 0.99
    all:
      - id: project-website
      - id: repo-hosting-path

  - id: agent-package-context
    desc: SysManage monitoring agent package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: agent-module-path
      - id: agent-batch-script-context
      - id: agent-repo-identity
