# WezTerm — open-source terminal emulator and multiplexer.
#
# These markers name the legitimate Rust/Windows bundle.  They intentionally
# do not suppress generic process, network, crypto, or anti-analysis traits.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 100000000

traits:
  - id: wezterm-rust-pdb
    desc: WezTerm Rust release PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]wezterm(_gui|_mux_server)?\.pdb$'

  - id: wezterm-executable-name
    desc: WezTerm Windows executable name
    if:
      type: basename
      regex: '(?i)^wezterm(-gui|-mux-server)?\.exe$'

  - id: wezterm-product-marker
    desc: WezTerm product marker
    if:
      type: text
      section: .rdata
      regex: '(?i)WezTerm|wezterm_gui|wezterm_mux_server'

  - id: wezterm-installer-app-path
    desc: WezTerm Windows installer app path
    if:
      type: path
      regex: '(^|[\\/])app[\\/]wezterm(-gui|-mux-server)?\.exe$'

composite_rules:
  - id: wezterm-binary-identity
    desc: WezTerm Windows binary identity
    crit: notable
    conf: 0.99
    any:
      - id: wezterm-rust-pdb
      - id: wezterm-executable-name
      - id: wezterm-installer-app-path
      - id: wezterm-product-marker
