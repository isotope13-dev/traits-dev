defaults:
  platforms: [linux]
  for: [elf, desktop-entry, rpm, text, binaries, archives]

traits:
  - id: monero-gui-binary-name
    desc: Official Monero GUI executable name
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 1000000000
    for: [elf]
    if:
      type: basename
      exact: monero-wallet-gui

  - id: monero-gui-application-id
    desc: Official Monero GUI application identifier
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 1000000000
    for: [elf, text]
    if:
      type: text
      substr: org.getmonero.Monero

  - id: monero-gui-desktop-entry
    desc: Official Monero GUI desktop entry
    crit: notable
    conf: 0.99
    for: [desktop-entry]
    if:
      type: basename
      exact: monero-gui.desktop

composite_rules:
  - id: official-monero-gui-context
    desc: Official Monero GUI application context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: monero-gui-binary-name
    any:
      - id: monero-gui-application-id
      - id: monero-gui-desktop-entry
