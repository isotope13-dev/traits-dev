defaults:
  platforms: [unix, windows]
  for: [scripts, source, jsp, xml, text]
  crit: notable
  conf: 0.98

traits:
  - id: peoplesoft-gateway-listener-path
    desc: PeopleSoft Gateway HTTP listener path
    if:
      type: text
      substr: /PSIGW/HttpListeningConnector

  - id: peoplesoft-loopback-hub-connector-value
    desc: Connector URL targets loopback PeopleSoft Hub
    if:
      type: text
      regex: '<Value>\s*https?://(127\.0\.0\.1|localhost|\[::1\])(:\d+)?/PSEMHUB/hub[?#<]'
