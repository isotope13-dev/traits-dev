defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, vbs, kotlin, tar]
  crit: notable
  conf: 0.99

traits:
  - id: cfengine-name-reference
    desc: CFEngine product name reference
    crit: notable
    if:
      type: text
      substr: CFEngine
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: masterfiles-archive
    desc: CFEngine masterfiles archive
    crit: notable
    for: [tar]
    if:
      type: basename
      regex: '^cfengine-masterfiles-[0-9]'
