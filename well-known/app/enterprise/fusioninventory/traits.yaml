# FusionInventory Agent's Windows deployment helper is an upstream deployment
# script.  Its download-to-TEMP and hidden installer launch are expected here;
# require project identity as well as the filename before making an exception.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.99

traits:
  - id: deployment-script-basename
    desc: FusionInventory deployment script basename
    if:
      type: basename
      exact: fusioninventory-agent-deployment.vbs

  - id: project-source-header
    desc: FusionInventory project source header
    if:
      type: text
      regex: '(?is)This file is part of FusionInventory project.{0,240}GNU General Public License'

  - id: github-release-download
    desc: FusionInventory GitHub release download URL
    if:
      type: text
      substr: github.com/fusioninventory/fusioninventory-agent/releases/download/

composite_rules:
  - id: fusioninventory-agent-deployment-script
    desc: FusionInventory Agent deployment script
    crit: notable
    conf: 0.99
    all:
      - id: deployment-script-basename
      - id: project-source-header
      - id: github-release-download

  - id: fusioninventory-agent-deployment-benign-context
    desc: Recognized FusionInventory deployment context
    crit: exception
    conf: 0.99
    all:
      - id: deployment-script-basename
      - id: github-release-download
