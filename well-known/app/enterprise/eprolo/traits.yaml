# EPROLO (Dianxiaobao) — dropshipping supply chain and ICBU AI publishing management.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: eprolo-api-endpoint
    desc: EPROLO platform API endpoint
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https?://[a-z0-9.-]*eprolo\.com\b'

  - id: eprolo-config-path
    desc: EPROLO configuration directory path
    for: [javascript, typescript]
    if:
      type: text
      substr: '.eprolo-toolkit'

  - id: eprolo-cli-package-name
    desc: EPROLO CLI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'eprolo-cli'

composite_rules:
  - id: eprolo-cli-client
    desc: EPROLO dropshipping supply chain CLI client
    crit: notable
    conf: 0.95
    scope: file
    any:
      - id: eprolo-api-endpoint
      - id: eprolo-config-path
      - id: eprolo-cli-package-name
