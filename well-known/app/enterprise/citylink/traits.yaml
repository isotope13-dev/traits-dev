# City-Link Express — Malaysian courier and logistics service integration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.95

traits:
  - id: citylink-wcf-service-endpoint
    desc: City-Link Express WCF REST service endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: /CitylinkService.svc/rest

  - id: citylink-debug-namespace
    desc: Citylink integration debug namespace
    for: [javascript, typescript]
    if:
      type: text
      substr: things-factory:integration-lmd:citylink

composite_rules:
  - id: citylink-courier-client
    desc: City-Link Express courier service client
    crit: notable
    conf: 0.95
    scope: file
    any:
      - id: citylink-wcf-service-endpoint
      - id: citylink-debug-namespace
