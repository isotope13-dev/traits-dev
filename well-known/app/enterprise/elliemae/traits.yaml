defaults:
  platforms: [unix, windows]
  for: [package.json, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: elliemae-scope-package-name
    desc: Ellie Mae scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@elliemae/[a-z0-9][a-z0-9.-]{0,60}$'

  - id: elliemae-dependencies-package-name
    desc: Ellie Mae dependencies metapackage name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@elliemae/[a-z0-9.-]+-dependencies$'

  - id: elliemae-infrastructure-reference
    desc: Ellie Mae Encompass infrastructure reference
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]*(elliemae\.io|intcx\.net)'

  - id: elliemae-repository-url
    desc: Ellie Mae organization git repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: 'github.com/intcx/'

composite_rules:
  - id: elliemae-dependency-metapackage-context
    desc: Ellie Mae dependency metapackage context
    crit: exception
    conf: 0.97
    for: [package.json, npm, tar]
    all:
      - id: elliemae-scope-package-name
      - id: elliemae-dependencies-package-name
    any:
      - id: elliemae-infrastructure-reference
      - id: elliemae-repository-url
