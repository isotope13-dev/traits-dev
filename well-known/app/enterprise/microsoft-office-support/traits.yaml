# Microsoft Office support/deployment archives carry signed Microsoft binaries
# and vendor scripts whose registry, WMI, COM, and embedded-code strings can
# resemble malware when the archive is analyzed as one scope.
defaults:
  platforms: [windows]
  for: [zip]

traits:
  - id: microsoft-office-support-bundle-name
    desc: Microsoft Office support bundle archive name
    crit: notable
    conf: 0.98
    if:
      type: basename
      regex: '^(Activate|SaRA|ODT)\.lotp$'

  - id: sara-cmd-tool-name
    desc: Microsoft SaRA command-line tool filename
    crit: notable
    conf: 0.98
    for: [pe]
    size_min: 8192
    size_max: 1048576
    if:
      type: path
      basename: true
      exact: SaRACmd.exe

  # Office ships OSPP.VBS and OSPPREARM.EXE inside its own install directory.
  # Seeing them as standalone files means the licensing kit was copied out of
  # an Office install and redistributed; on its own that is only an identity.
  - id: ospp-activation-script-name
    desc: Office activation script OSPP.VBS filename
    crit: notable
    conf: 0.97
    for: [vbs]
    size_min: 1024
    size_max: 4194304
    if:
      type: basename
      exact: ospp.vbs
      case_insensitive: true

  - id: ospp-rearm-utility-name
    desc: Office activation rearm utility filename
    crit: notable
    conf: 0.97
    for: [pe]
    size_min: 4096
    size_max: 4194304
    if:
      type: basename
      exact: ospprearm.exe
      case_insensitive: true

composite_rules:
  - id: microsoft-office-support-bundle-context
    desc: Signed Microsoft Office support bundle context
    crit: exception
    conf: 0.99
    # The bundle name is on the outer .lotp file while the Microsoft identity
    # is on an extracted member, so archive scope would put them in different
    # buckets. Outer scope is the intended correlation for this known bundle.
    scope: outer
    all:
      - id: microsoft-office-support-bundle-name
    any:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: sara-cmd-tool-name
