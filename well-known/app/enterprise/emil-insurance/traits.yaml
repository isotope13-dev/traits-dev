# @emilgroup/insurance-sdk — OpenAPI-generated TypeScript client for
# EMIL InsuranceService (apiv2.emil.de).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: npm-archive-name
    desc: emilgroup insurance-sdk npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@emilgroup/insurance-sdk'

  - id: package-name
    desc: emilgroup insurance-sdk package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@emilgroup/insurance-sdk'

  - id: insurance-service-banner
    desc: EMIL InsuranceService OpenAPI title
    if:
      type: text
      substr: EMIL InsuranceService

  - id: contact-email
    desc: EMIL kontakt@emil.de contact email
    if:
      type: text
      substr: kontakt@emil.de

  - id: api-v2-host
    desc: EMIL apiv2.emil.de API hostname
    if:
      type: text
      substr: apiv2.emil.de

composite_rules:
  - id: emil-insurance-sdk
    desc: Recognized EMIL InsuranceService OpenAPI client
    conf: 0.98
    scope: outer
    all:
      - id: insurance-service-banner
      - id: api-v2-host

