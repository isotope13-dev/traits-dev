# OCA delivery_state — Odoo addon for shipment tracking states.
# Carrier HTTP and ir.cron updates are product delivery tracking, not C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: odoo-addon-delivery_state PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: odoo-addon-delivery_state

  - id: wheel-distribution
    desc: odoo_addon_delivery_state wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: odoo_addon_delivery_state

  - id: github-repo
    desc: OCA delivery-carrier GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/OCA/delivery-carrier

  - id: manifest-name
    desc: Delivery State Odoo module name
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: '"name": "Delivery State"'
