# Dotmatics DTX.Cloud.Management — enterprise PowerShell NuGet module for
# Dotmatics cloud/Oracle automation (agent installs, Oracle patching, EC2
# hooks). Legitimate ops tooling uses EncodedCommand scheduled tasks,
# Administrators group grants for Oracle accounts, Win32_Service StartName
# lookups, and Defender path exclusions around patch windows.
defaults:
  platforms: [windows]
  for: [powershell, nupkg]
  crit: notable
  conf: 0.98

traits:
  - id: dtx-cloud-management-package
    desc: DTX.Cloud.Management NuGet package id
    for: [nupkg]
    if:
      type: value
      path: nupkg.id
      exact: DTX.Cloud.Management

  - id: dtx-cloud-management-owners
    desc: Dotmatics Limited NuGet package owners
    for: [nupkg]
    if:
      type: value
      path: nupkg.owners
      exact: Dotmatics Limited

  - id: dtx-cloud-management-module-path
    desc: DTX.Cloud.Management module member path
    if:
      type: path
      regex: '(?i)DTX\.Cloud\.Management(\.psm1|\.psd1)?$'

  - id: dtx-system-function
    desc: Get-DTXSystem automation function
    for: [powershell]
    if:
      type: text
      substr: function Get-DTXSystem

  - id: dtx-crowdstrike-install-function
    desc: Install-DTXCrowdStrikeAgent function
    for: [powershell]
    if:
      type: text
      substr: function Install-DTXCrowdStrikeAgent

composite_rules:
  - id: dtx-cloud-management-nupkg-identity
    desc: Dotmatics DTX.Cloud.Management NuGet identity
    crit: notable
    conf: 0.99
    for: [nupkg]
    all:
      - id: dtx-cloud-management-package
      - id: dtx-cloud-management-owners

  - id: dtx-cloud-management-module-identity
    desc: Dotmatics DTX.Cloud.Management module identity
    crit: notable
    conf: 0.99
    for: [powershell]
    all:
      - id: dtx-cloud-management-module-path
      - id: dtx-system-function
      - id: dtx-crowdstrike-install-function

  - id: dtx-cloud-management-context
    desc: Recognized Dotmatics DTX cloud automation context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: dtx-cloud-management-nupkg-identity
      - id: dtx-cloud-management-module-identity
