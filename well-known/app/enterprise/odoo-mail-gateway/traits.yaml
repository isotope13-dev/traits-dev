# OCA mail_gateway — Odoo addon for external chat gateways.
# Public /gateway webhook routes are product inbound mail, not C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: odoo-addon-mail_gateway PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: odoo-addon-mail_gateway

  - id: wheel-distribution
    desc: odoo_addon_mail_gateway wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: odoo_addon_mail_gateway

  - id: github-repo
    desc: OCA mail_gateway GitHub tree URL
    conf: 0.98
    if:
      type: text
      substr: github.com/OCA/social/tree/18.0/mail_gateway

  - id: manifest-name
    desc: Mail Gateway Odoo module name
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: '"name": "Mail Gateway"'
