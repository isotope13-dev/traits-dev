defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 100000
  size_max: 1000000
  crit: notable
  conf: 0.99

traits:
  - id: portal-connect-core-filename
    desc: Microsoft Office PortalConnectCore DLL filename
    if:
      type: value
      path: pe.version.original_filename
      exact: PortalConnectCore.dll
      case_insensitive: true

  - id: portal-connect-core-pdb
    desc: Microsoft Office PortalConnectCore PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])portalconnectcore\.pdb$'

  - id: portal-connect-core-product
    desc: Microsoft Office 2016 product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft Office 2016

composite_rules:
  - id: microsoft-office-portal-connect-core
    desc: Microsoft Office PortalConnectCore component identity
    all:
      - id: portal-connect-core-filename
      - id: portal-connect-core-product
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/platform::microsoft

  - id: microsoft-office-portal-connect-core-context
    desc: Recognized signed Microsoft Office PortalConnectCore context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-office-portal-connect-core
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
