defaults:
  size_max: 8388608
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.95

traits:
  - id: office-c2r-common-name
    desc: Office C2R common component
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: "4D 69 63 72 6F 73 6F 66 74 2E 54 6F 6F 6C 73 2E 4F 66 66 69 63 65 2E 43 32 52"

  - id: office-deployment-component-string
    desc: Microsoft Office deployment component
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: "4D 69 63 72 6F 73 6F 66 74 20 4F 66 66 69 63 65 20 44 65 70 6C 6F 79 6D 65 6E 74 20 43 6F 6D 70 6F 6E 65 6E 74"

  - id: integrated-office-sxs-description
    desc: Office IntegratedOffice SxS version identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      regex: '^Microsoft Office Click-to-Run IntegratedOfficeExe \(SxS\)$'

  - id: integrated-office-original-filename
    desc: Office IntegratedOffice executable identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: IntegratedOffice.exe
      case_insensitive: true

  - id: click2run-build-path
    desc: Office Click-to-Run build path marker
    crit: notable
    conf: 0.9
    if:
      type: text
      section: .text
      substr: click2run
      case_insensitive: true

  - id: office-c2r-build-pdb-path
    desc: Office C2R build-pipeline PDB path
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)^[A-Z]:\\Target\\x(86|64)\\ship\\[a-z][a-z0-9_-]{1,32}\\'
  - id: office-c2r-client-filename
    desc: Office Click-to-Run client filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: OfficeC2RClient.exe
      case_insensitive: true

composite_rules:
  - id: microsoft-office-c2r-client-context
    desc: Microsoft Office Click-to-Run client context
    crit: exception
    conf: 0.99
    all:
      - id: office-c2r-client-filename
      - id: metadata/binary/vendor::microsoft-prefixed-company

  - id: microsoft-office-c2r-common
    desc: Microsoft Office C2R common component
    crit: notable
    conf: 0.99
    all:
      - id: office-c2r-common-name
      - id: office-deployment-component-string

  - id: microsoft-office-integrated-office
    desc: Microsoft Office Click-to-Run IntegratedOffice component identity
    crit: notable
    conf: 0.99
    all:
      - id: integrated-office-sxs-description
      - id: integrated-office-original-filename
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/platform::microsoft

  - id: microsoft-office-integrated-office-context
    desc: Recognized signed Microsoft Office IntegratedOffice context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-office-integrated-office
      - id: metadata/binary/vendor::microsoft-corp-marker-cert

  # Integrator.exe carries both the Software Licensing API cluster and the
  # GUID that NjRAT later reused as a mutex. This content identity remains
  # valid when the executable is nested inside a larger PE carrier, where its
  # original version information and Authenticode scope are no longer usable.
  - id: microsoft-office-integrator-content-context
    desc: Microsoft Office Click-to-Run Integrator content
    crit: exception
    conf: 0.99
    size_max: 52428800
    any:
      - id: metadata/binary/debug::office-integrator-pdb-rsrc
      - id: metadata/binary/debug::office-integrator-pdb-rdata
      - id: metadata/binary/debug::office-integrator-pdb-text-section
