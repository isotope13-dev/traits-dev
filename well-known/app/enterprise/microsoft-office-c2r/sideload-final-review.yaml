defaults:
  platforms:
    - windows
  for: [scripts, binaries]
  size_min: 1

traits:
  - id: appv-isv-subsystems-dll-basename
    desc: AppV ISV subsystems DLL basename
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: path
      basename: true
      regex: (?i)^AppvIsvSubsystems(32|64)\.dll$
  - id: appv-client-dll-basename
    desc: Click-to-Run AppV DLL basename
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: path
      basename: true
      regex: (?i)^Appv(IsvSubsystems(32|64)|Client)\.dll$
  - id: c2r-dll-basename
    desc: Click-to-Run C2R DLL basename
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: path
      basename: true
      regex: (?i)^C2R(32|64)\.dll$
  - id: msochina-dll-basename
    desc: Click-to-Run MsoChina DLL basename
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: path
      basename: true
      exact: MsoChina.dll
      case_insensitive: true
  - id: mso-win32-client-dll-basename
    desc: Office Win32 client DLL basename
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: path
      basename: true
      regex: (?i)^mso(20|30|40(ui)?|99L)win32client\.dll$
  - id: appv-isv-subsystems-dll-reference
    desc: Office AppV DLL reference
    crit: notable
    conf: 0.97
    for: [pe]
    if:
      type: text
      section: any
      exact: AppVIsvSubsystems32.dll

composite_rules:
  - id: click-to-run-dll-basename-component
    desc: Click-to-Run DLL basename
    crit: component
    conf: 0.9
    any:
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-client-dll-basename
      - id: well-known/app/enterprise/microsoft-office-c2r::c2r-dll-basename
      - id: well-known/app/enterprise/microsoft-office-c2r::msochina-dll-basename
      - id: well-known/app/enterprise/microsoft-office-c2r::mso-win32-client-dll-basename
  - id: click-to-run-dll-reference
    desc: Click-to-Run DLL reference
    crit: notable
    conf: 0.92
    any:
      - id: well-known/app/enterprise/microsoft-office-c2r::click-to-run-dll-basename-component
      - id: micro-behaviors/fs/path/library::office-mso-win32client-dll-reference
