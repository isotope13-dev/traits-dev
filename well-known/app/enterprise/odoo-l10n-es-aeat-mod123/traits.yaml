# OCA l10n_es_aeat_mod123 — Spanish AEAT Modelo 123 withholding return.
# Tax-box mapping and BOE export are product accounting, not C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: odoo-addon-l10n_es_aeat_mod123 PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: odoo-addon-l10n_es_aeat_mod123

  - id: wheel-distribution
    desc: odoo_addon_l10n_es_aeat_mod123 wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: odoo_addon_l10n_es_aeat_mod123

  - id: github-repo
    desc: OCA l10n_es_aeat_mod123 GitHub tree
    conf: 0.98
    if:
      type: text
      substr: l10n-spain/tree/19.0/l10n_es_aeat_mod123

  - id: manifest-name
    desc: AEAT modelo 123 Odoo module name
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: '"name": "AEAT modelo 123"'
