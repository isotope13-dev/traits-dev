# OCA l10n_br_nfse — Brazilian NFS-e (Nota Fiscal de Serviço Eletrônica)
# root module. SOAP transmit via erpbrasil with requests.Session (TLS
# verify off for municipal endpoints) is product fiscal EDI, not C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: odoo-addon-l10n_br_nfse PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: odoo-addon-l10n_br_nfse

  - id: wheel-distribution
    desc: odoo_addon_l10n_br_nfse wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: odoo_addon_l10n_br_nfse

  - id: github-repo
    desc: OCA l10n_br_nfse GitHub tree
    conf: 0.98
    if:
      type: text
      substr: l10n-brazil/tree/18.0/l10n_br_nfse

  - id: danfe-report-xmlid
    desc: Brazilian NFSe DANFE report xmlid
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: l10n_br_nfse.report_br_nfse_danfe
