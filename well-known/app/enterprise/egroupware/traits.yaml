defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.98

traits:
  - id: egroupware-archive-member
    crit: notable
    desc: EGroupware source archive member
    for: [php, javascript, java, shell, text, source, data]
    if:
      type: path
      regex: 'egroupware@v|egroupware-egroupware-'
      case_insensitive: true
  - id: egroupware-composer-name
    crit: notable
    desc: EGroupware Composer project name
    for: [composer.json]
    if:
      type: value
      path: name
      exact: egroupware/egroupware
  - id: egroupware-composer-source
    crit: notable
    desc: EGroupware Composer source repository
    for: [composer.json]
    if:
      type: value
      path: support.source
      exact: https://github.com/egroupware/egroupware
composite_rules:
  - id: egroupware-asyncservice
    desc: EGroupware Asyncservice scheduler
    crit: notable
    conf: 0.98
    all:
      - id: egroupware-archive-member
      - id: metadata/filename/name-form::asyncservice-basename
  - id: egroupware-db-backup-helper
    desc: EGroupware database backup helper
    crit: notable
    conf: 0.98
    all:
      - id: egroupware-archive-member
      - id: metadata/filename/name-form::db-backup-basename
  - id: egroupware-vfs-helper
    desc: EGroupware VFS helper
    crit: notable
    conf: 0.98
    all:
      - id: egroupware-archive-member
      - id: metadata/filename/name-form::vfs-basename
  - id: egroupware-dhtmlx-test-js
    desc: EGroupware dhtmlx test JS
    crit: notable
    conf: 0.98
    all:
      - id: egroupware-archive-member
      - id: metadata/filename/name-form::dhtmlx-test-basename
  - id: egroupware-json-websocket-client
    desc: EGroupware JSON WebSocket client
    crit: notable
    conf: 0.98
    all:
      - id: egroupware-archive-member
      - id: metadata/filename/name-form::egw-json-basename
  - id: egroupware-filemanager-cli
    desc: EGroupware filemanager CLI
    crit: notable
    conf: 0.98
    all:
      - id: egroupware-archive-member
      - id: metadata/package/files/runtime::filemanager-cli-path
  - id: egroupware-source-identity
    desc: EGroupware source tree identity
    crit: notable
    conf: 0.98
    scope: archive
    any:
      - id: egroupware-archive-member
      - id: egroupware-asyncservice
      - id: egroupware-db-backup-helper
      - id: egroupware-vfs-helper
      - id: egroupware-dhtmlx-test-js
      - id: egroupware-json-websocket-client
      - id: egroupware-filemanager-cli
      - id: egroupware-composer-identity
  - id: egroupware-composer-identity
    desc: EGroupware Composer source identity
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: egroupware-composer-name
      - id: egroupware-composer-source
