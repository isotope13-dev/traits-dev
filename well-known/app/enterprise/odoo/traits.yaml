# OCA (Odoo Community Association) Portugal localization metapackage.
# Wheel is dist-info only; runtime lives in the pinned odoo-addon-l10n-pt-*
# dependencies.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 5000000

traits:
  - id: wheel-distribution
    desc: OCA Portugal Odoo wheel name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: odoo_addons_oca_l10n_portugal

  - id: pypi-package-name
    desc: OCA Portugal Odoo PyPI name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: odoo-addons-oca-l10n-portugal

  - id: invoicexpress-addon-dep
    desc: OCA InvoiceXpress Portugal addon pin
    for: [pkginfo]
    conf: 0.97
    if:
      type: text
      substr: odoo-addon-l10n-pt-account-invoicexpress
