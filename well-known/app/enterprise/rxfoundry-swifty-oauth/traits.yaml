# RxFoundry Swifty OAuth API — OpenAPI-generated Python client.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package rxfoundry swifty-oauth-api
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*rxfoundry\.clients\.swifty-oauth-api\s*$'

  - id: openapi-generator-marker
    desc: OpenAPI Generator Python client marker
    for: [python]
    if:
      type: text
      substr: Generated by OpenAPI Generator (https://openapi-generator.tech)

  - id: swifty-oauth-module-path
    desc: swifty_oauth_api Python package path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])swifty_oauth_api([\\/]|$)'

composite_rules:
  - id: rxfoundry-swifty-oauth-client
    desc: RxFoundry Swifty OAuth OpenAPI Python client
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: openapi-generator-marker
      - id: swifty-oauth-module-path
