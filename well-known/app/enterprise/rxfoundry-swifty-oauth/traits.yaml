# RxFoundry Swifty OAuth API — OpenAPI-generated Python client.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package rxfoundry swifty-oauth-api
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*rxfoundry\.clients\.swifty-oauth-api\s*$'

  - id: pkginfo-name-receiver
    desc: PyPI package rxfoundry swifty-receiver-api
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*rxfoundry\.clients\.swifty-receiver-api\s*$'

  - id: swifty-receiver-module-path
    desc: swifty_receiver_api Python package path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])swifty_receiver_api([\\/]|$)'

  - id: swifty-oauth-module-path
    desc: swifty_oauth_api Python package path
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])swifty_oauth_api([\\/]|$)'

composite_rules:
  - id: rxfoundry-swifty-oauth-client
    desc: RxFoundry Swifty OAuth OpenAPI Python client
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: metadata/lang/source::openapi-generator-source-banner
      - id: swifty-oauth-module-path

  - id: rxfoundry-swifty-receiver-client
    desc: RxFoundry Swifty Receiver OpenAPI Python client
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name-receiver
    any:
      - id: metadata/lang/source::openapi-generator-source-banner
      - id: swifty-receiver-module-path
