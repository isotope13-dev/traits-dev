# sino-bc-cli -- BeyondClick's command-line client for its business API
# gateway (agent.beyondclick.com). Its build obfuscates dist/index.js with
# javascript-obfuscator, and its postinstall runs the CLI's documented `/init`,
# which copies the bundled, hash-listed agent skills into ~/.agents/skills
# (and ~/.claude/skills when present). Releases are frequent, so a new,
# bursty, obfuscated package with process reach describes the vendor's normal
# publishing rather than a stage loader. The package name is unscoped, so the
# identity also requires the README's gateway host.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: BeyondClick CLI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: sino-bc-cli
  - id: gateway-host-reference
    desc: BeyondClick agent gateway host
    for: [package.json, javascript, markdown, text]
    if:
      type: text
      substr: agent.beyondclick.com

composite_rules:
  - id: cli-package
    desc: BeyondClick CLI npm package
    for: [npm, tar, package.json]
    scope: archive
    all:
      - id: package-name
      - id: gateway-host-reference
