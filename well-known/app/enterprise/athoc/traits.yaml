# AtHocAFRC Internet Explorer Browser Helper / desktop notification component.
# The version metadata and verified AtHoc Authenticode leaf identify the
# historical signed BHO; its GUI, clipboard, and WinInet surfaces are expected
# for an Internet Explorer toolbar and notification client.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 52428800

traits:
  - id: athocafrc-product-name
    desc: AtHocAFRC desktop module product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: AtHocAFRC Desktop Module

  - id: athocafrc-original-filename
    desc: AtHocAFRC browser helper original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: AtHocAFRCTbr.dll

  - id: athocafrc-company-name
    desc: AtHocAFRC CompanyName version metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: AtHocAFRC

composite_rules:
  - id: athocafrc-browser-helper
    desc: Verified AtHocAFRC browser helper component
    crit: notable
    conf: 0.99
    all:
      - id: athocafrc-product-name
      - id: athocafrc-original-filename
      - id: athocafrc-company-name
      - id: metadata/signed/leaf::athoc-inc.
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: athocafrc-benign-installation-context
    desc: Verified AtHocAFRC installer context
    crit: exception
    conf: 0.99
    all:
      - id: athocafrc-browser-helper
      - id: metadata/signed/leaf::athoc-inc.
