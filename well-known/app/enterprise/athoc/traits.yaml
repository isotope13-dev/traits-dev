# AtHocAFRC Internet Explorer Browser Helper / desktop notification component.
# The version metadata and matching AtHoc Authenticode certificate identity
# identify the historical BHO; its GUI, clipboard, WinInet, CryptoAPI, file,
# and registry surfaces are expected for this desktop notification client.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 52428800

traits:
  - id: athocafrc-product-name
    desc: AtHocAFRC desktop module product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: AtHocAFRC Desktop Module

  - id: athocafrc-original-filename
    desc: AtHocAFRC browser helper original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: AtHocAFRCTbr.dll

  - id: athocafrc-company-name
    desc: AtHocAFRC CompanyName version metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: AtHocAFRC

composite_rules:
  - id: athocafrc-browser-helper
    desc: AtHocAFRC browser helper component identity
    crit: notable
    conf: 0.99
    all:
      - id: athocafrc-product-name
      - id: athocafrc-original-filename
      - id: athocafrc-company-name
      - id: metadata/signed/leaf::athoc-inc.
      - id: metadata/signed/certificate/identity::pe-cert-leaf-sha1-signature

  - id: athocafrc-legacy-module-context
    desc: AtHocAFRC browser helper certificate context
    crit: exception
    conf: 0.99
    all:
      - id: athocafrc-browser-helper
      - id: metadata/signed/leaf::athoc-inc.
