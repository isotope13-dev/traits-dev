# @emilgroup/document-sdk — OpenAPI-generated TypeScript client for
# EMIL DocumentService (apiv2.emil.de).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: npm-archive-name
    desc: emilgroup document-sdk npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@emilgroup/document-sdk'

  - id: package-name
    desc: emilgroup document-sdk package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@emilgroup/document-sdk'

  - id: document-service-banner
    desc: EMIL DocumentService OpenAPI title
    if:
      type: text
      substr: EMIL DocumentService

composite_rules:
  - id: emil-document-sdk
    desc: Recognized EMIL DocumentService OpenAPI client
    conf: 0.98
    scope: outer
    all:
      - id: document-service-banner
      - id: well-known/app/enterprise/emil-insurance::api-v2-host
