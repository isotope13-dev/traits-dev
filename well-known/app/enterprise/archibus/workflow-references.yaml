---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - powershell
  - shell
  - javascript
  - java
  - text
  - jsp
traits:
- id: archibus-record-query-call
  desc: DWR selects the Archibus record-query workflow
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: c\d+-param0=string:AbCommonResources-getDataRecords\b
- id: archibus-report-write-call
  desc: DWR selects the Archibus report-write workflow
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: c\d+-param0=string:AbCommonResources-writeHTMLtoFile\b
