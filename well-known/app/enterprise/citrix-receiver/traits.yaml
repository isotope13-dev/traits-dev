# Citrix Receiver / ICA Client / PNAgent identity.
#
# Signed Citrix clients legitimately register network providers, copy and
# rewrite their own images during self-update, extract resources under
# System32, and manage session UI — behaviors that otherwise look like
# dropper/persistence staging.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 52428800

traits:
  - id: citrix-client-product-name
    desc: Citrix Receiver or ICA Client metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '^Citrix (Receiver|ICA Client)$'

  - id: citrix-receiver-original-filename
    desc: Citrix WFCRUN32 original filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: WFCRUN32.EXE
      case_insensitive: true

  - id: citrix-receiver-description
    desc: Citrix Connection Manager version description
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Citrix Connection Manager

  - id: citrix-receiver-company
    desc: Citrix Systems version company metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Citrix Systems, Inc.

  - id: citrix-pnagent-original-filename
    desc: Citrix PNAgent PNAMain original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: PNAMain.EXE
      case_insensitive: true

  - id: citrix-pnagent-description
    desc: Citrix XenApp version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Citrix XenApp

  - id: citrix-pnagent-manifest
    desc: Citrix PNAgent assembly identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Citrix PNAgent

composite_rules:
  - id: citrix-receiver-identity
    desc: Signed Citrix client WFCRUN32 launcher identity
    crit: notable
    conf: 0.99
    all:
      - id: citrix-client-product-name
      - id: citrix-receiver-original-filename
      - id: citrix-receiver-description
      - id: citrix-receiver-company
      - id: metadata/signed/leaf::citrix-systems-inc.

  - id: citrix-receiver-context
    desc: Verified Citrix Receiver WFCRUN32 integration context
    crit: exception
    conf: 0.99
    all:
      - id: citrix-receiver-identity
      - id: metadata/signed/leaf::citrix-systems-inc.

  - id: citrix-pnagent-identity
    desc: Signed Citrix PNAgent client identity
    crit: notable
    conf: 0.99
    all:
      - id: citrix-pnagent-original-filename
      - id: metadata/signed/leaf::citrix-systems-inc.

  - id: citrix-pnagent-context
    desc: Verified Citrix PNAgent client integration context
    crit: exception
    conf: 0.99
    all:
      - id: citrix-pnagent-identity
      - id: metadata/signed/leaf::citrix-systems-inc.
