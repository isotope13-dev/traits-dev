# RegScale — GRC (governance, risk, compliance) vendor; regscale_cli is its
# PyPI-distributed CLI (unflagged by every VT engine). The wheel bundles an
# obfuscated passphrase-gated Fernet helper (encrypt.py), AWS inventory
# collectors, and AWS guidance docs -- each trips shape-based verdicts that
# describe the vendor's own tooling, not an attack. This identity exists as a
# benign-context exclusion for those rules. Caveat, shared with every vendor
# whitelist: a trojanized RegScale build would keep these strings, so the
# exclusion quiets only the shape verdicts below -- content findings (Fernet
# calls, S3 APIs, os.system) stay visible, and anything with network,
# persistence, or C2 behavior still convicts on its own legs.
defaults:
  platforms: [windows, unix]
  for: [python, markdown, text, shell]
  crit: notable
  conf: 0.99

traits:
  - id: regscale-logger-name
    desc: RegScale logger name
    for: [python]
    if:
      type: text
      regex: 'getLogger\(["'']regscale["'']\)'
  - id: regscale-package-import
    desc: RegScale package import
    for: [python]
    if:
      type: text
      regex: '(?m)^\s*(from|import)\s+regscale[\s.]'
  - id: regscale-product-mention
    desc: RegScale product mention
    # Shell is in the file default because heuristic language ID types some
    # vendor markdown (e.g. the AWS role guide) as shell, and the mention
    # must fire there for the exception to reach it.
    if:
      type: text
      substr: RegScale

composite_rules:
  - id: regscale-cli-benign-context
    desc: RegScale CLI vendor context
    crit: exception
    conf: 0.99
    any:
      - id: regscale-logger-name
      - id: regscale-package-import
      - id: regscale-product-mention
