# Ansys Desktop Licensing client (ansyscl), a FlexNet-based license checkout
# agent shipped inside Ansys runtimes such as pytwin.  It probes CPUID for a
# hypervisor, keeps a /dev/shm cache file and sends license heartbeats; those
# are licensing mechanics, so only its own class and message identity exempts them.
defaults:
  conf: 0.99
  size_min: 1048576
  size_max: 67108864

traits:
  - id: ansys-client-class-pe
    desc: Ansys license client class name
    crit: notable
    platforms: [windows]
    for: [pe]
    if:
      type: text
      section: .rdata
      regex: 'CAnsysCl[A-Z][A-Za-z]{3,40}'

  - id: ansys-license-message-pe
    desc: Ansys license manager outdated message
    crit: notable
    platforms: [windows]
    for: [pe]
    if:
      type: text
      section: .rdata
      substr: Your version of the ANSYS license manager software is out of date

  - id: ansys-client-class-elf
    desc: Ansys license client class name
    crit: notable
    platforms: [linux]
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: 'CAnsysCl[A-Z][A-Za-z]{3,40}'

  - id: ansys-license-message-elf
    desc: Ansys license manager outdated message
    crit: notable
    platforms: [linux]
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: Your version of the ANSYS license manager software is out of date

composite_rules:
  - id: ansys-licensing-client-pe
    desc: Ansys Desktop Licensing client for Windows
    crit: notable
    platforms: [windows]
    for: [pe]
    all:
      - id: ansys-client-class-pe
      - id: ansys-license-message-pe

  - id: ansys-licensing-client-elf
    desc: Ansys Desktop Licensing client for Linux
    crit: notable
    platforms: [linux]
    for: [elf]
    all:
      - id: ansys-client-class-elf
      - id: ansys-license-message-elf

  - id: ansys-licensing-client
    desc: Ansys Desktop Licensing client binary
    crit: notable
    platforms: [linux, windows]
    for: [pe, elf]
    any:
      - id: ansys-licensing-client-pe
      - id: ansys-licensing-client-elf
