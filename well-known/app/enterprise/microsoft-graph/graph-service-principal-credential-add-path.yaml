defaults:
  platforms:
    - unix
    - windows
  # Same rationale as graph-application-credential-add-path: REST paths occur
  # across source and compiled string tables, not in chat-script dialects or
  # Clojure, which are excluded to stay within the text-matcher file-type cap.
  for:
    - scripts
    - source
    - binaries
    - -mirc
    - -ircii
    - -clojure
  crit: notable
  conf: 0.96
traits:
  - id: graph-service-principal-credential-add-path
    size_min: 1
    desc: Graph service-principal credential-add path
    if:
      type: text
      regex: (?i)(^|[/"'])servicePrincipals/[^/?&"']{1,128}/(addPassword|addKey)\b
