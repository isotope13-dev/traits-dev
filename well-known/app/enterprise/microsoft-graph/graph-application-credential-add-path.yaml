defaults:
  platforms:
    - unix
    - windows
  # Graph REST paths are written in source of every language and carried in
  # compiled string tables; chat-script dialects and Clojure have no calling
  # convention that produces this text, so they are excluded to stay within
  # the text-matcher file-type cap.
  for:
    - scripts
    - source
    - binaries
    - -mirc
    - -ircii
    - -clojure
  crit: notable
  conf: 0.96
traits:
  - id: graph-application-credential-add-path
    size_min: 1
    desc: Graph application credential-add path
    if:
      type: text
      regex: (?i)(^|[/"'])applications/[^/?&"']{1,128}/(addPassword|addKey)\b
