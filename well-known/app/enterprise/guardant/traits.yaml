# Guardant Control Center daemon and license wizard (grdcontrol package by Aktiv Co.),
# an enterprise software licensing and copy protection suite for Guardant hardware
# keys and software licenses. Protected with Guardant Armor/Net envelope.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95
  size_min: 512
  size_max: 67108864

traits:
  - id: guardant-section
    desc: Guardant protection envelope section
    if:
      type: section
      regex: '^\.grd[0-9a-fA-F]{4}$'

  - id: guardant-control-center-string
    desc: Guardant Control Center product string
    if:
      type: text
      section: .rodata
      substr: "Guardant Control Center"

  - id: guardant-endpoint
    desc: Guardant licensing endpoint domain
    if:
      type: text
      section: .rodata
      regex: '(?i)\b(getlicense|station|grdmku)\.guardant\.(ru|com)\b'

  - id: guardant-api-string
    desc: Guardant licensing API reference
    if:
      type: text
      section: .rodata
      regex: '\bGrd(Feature|GetLicense|Dongle|License|GetHostFingerprint)\w{1,30}\b'

composite_rules:
  - id: guardant-binary
    desc: Guardant software licensing binary
    crit: notable
    conf: 0.98
    all:
      - id: guardant-control-center-string
    any:
      - id: guardant-section
      - id: guardant-endpoint
      - id: guardant-api-string
