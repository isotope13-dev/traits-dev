# SailingSeek (溯航) — COSCO maritime vessel tracking logistics service integration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: sailingseek-service-endpoint
    desc: SailingSeek vessel tracking service endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: '115.190.235.143:8080'

  - id: sailingseek-platform-marker
    desc: SailingSeek platform name marker
    for: [javascript, typescript, source]
    if:
      type: text
      substr: 'SailingSeek'

  - id: idm-vessel-package-name
    desc: IDM vessel tracking plugin package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@idm-plugin/vessel'

composite_rules:
  - id: sailingseek-vessel-client
    desc: SailingSeek maritime vessel tracking API client
    crit: notable
    conf: 0.95
    scope: file
    any:
      - id: sailingseek-service-endpoint
      - id: sailingseek-platform-marker
      - id: idm-vessel-package-name
