# SAP process telemetry identity. Restricting the match to process-parent or
# native audit records avoids treating product documentation as execution.
defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: sapxpg-parent-process
    desc: SAPXPG is the parent process
    if:
      type: value
      path: process.parent.executable
      regex: '(?i)(^|[/\\])sapxpg(\.exe)?$'

  - id: auditd-sapxpg-exec-record
    desc: Auditd records SAPXPG execution
    platforms: [linux]
    if:
      type: value
      path: log.original
      regex: '(?i)\b(comm|exe)="?([^"\s]*/)?sapxpg(\.exe)?"?(\s|$)'

composite_rules:
  - id: sapxpg-process-event
    desc: Process event identifies SAPXPG
    crit: notable
    any:
      - id: sapxpg-parent-process
      - id: auditd-sapxpg-exec-record
