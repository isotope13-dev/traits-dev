# SAP GUI workstation security-rule configuration (`saprules.xml`) and SAP
# .NET Connector (`sapnco.dll` / `SAP.Middleware.Connector`) RFC client calls.
defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: sapgui-saprules-allow-rule-element
    desc: Constructs SAP GUI saprules.xml allow entry
    crit: component
    conf: 0.92
    for: [powershell, vbs, python, javascript, typescript, csharp]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(<user_rules\b|<permissions\b).{0,400}<action>\s*0\s*</action>'

  - id: sap-nco-dotnet-connector-ref
    desc: Loads or imports SAP .NET Connector (NCo)
    conf: 0.95
    for: [powershell, csharp, python]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(\bsapnco(_utils)?\.dll\b|\bSAP\.Middleware\.Connector\b)'

  - id: sap-nco-rfc-function-invoke
    desc: Invokes SAP RFC function via NCo destination
    conf: 0.96
    for: [powershell, csharp, python]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)\bRfcDestinationManager\b.{0,600}\bCreateFunction\s*\('

composite_rules:
  - id: sapgui-saprules-allow-policy-write
    desc: Configures Allow rule in SAP GUI saprules.xml
    conf: 0.95
    for: [powershell, vbs, python, javascript, typescript, csharp]
    all:
      - id: micro-behaviors/fs/path/config/security::sapgui-saprules-config-path
      - id: sapgui-saprules-allow-rule-element
