defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, javascript, typescript, crx, archives]
  crit: notable
  conf: 0.99

traits:
  - id: extension-name
    desc: Kalam CX employee activity extension identity
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Kalam app extension

  - id: activity-tracking-endpoint
    desc: Kalam CX activity tracking API endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: https://kalamcxapp.site/server/api/track.php

composite_rules:
  - id: kalam-cx-activity-extension
    desc: Recognized Kalam CX employee activity extension
    for: [crx, archives]
    scope: archive
    all:
      - id: extension-name
      - id: activity-tracking-endpoint
