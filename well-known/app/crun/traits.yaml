# crun is the containers/common OCI runtime.  Its container setup necessarily
# uses mounts, namespaces, SELinux labels, seccomp, and child-process
# environment setup; the identity composite lets objective rules distinguish
# those runtime mechanics from the same strings in unrelated executables.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000
  size_max: 5000000

traits:
  - id: crun-binary-basename
    desc: crun OCI runtime binary basename
    if:
      type: path
      basename: true
      exact: crun

  - id: crun-oci-runtime-marker
    desc: crun OCI runtime metadata marker
    if:
      type: text
      section: .rodata
      substr: run.oci.crun.version

composite_rules:
  - id: crun-runtime-identity
    desc: crun OCI container runtime identity
    crit: notable
    conf: 0.99
    all:
      - id: crun-binary-basename
      - id: crun-oci-runtime-marker
