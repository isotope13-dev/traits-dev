# skycoll — Bluesky/AT Protocol social-graph CLI (twecoll equivalent).
defaults:
  platforms: [unix, windows]
  for: [python, text, archives]
  crit: baseline
  conf: 0.98

traits:
  - id: skycoll-wheel-name
    desc: skycoll Python wheel archive name
    if:
      type: path
      regex: '(?i)^skycoll-.*\.whl$'

  - id: skycoll-package-name
    desc: skycoll distribution name
    for: [text, python]
    if:
      type: text
      regex: '(?m)^Name:\s*skycoll\s*$'

  - id: skycoll-summary-marker
    desc: skycoll Bluesky social-graph CLI summary
    crit: notable
    for: [text, python]
    if:
      type: text
      substr: Bluesky/AT Protocol social-graph CLI

  - id: skycoll-sessions-dir
    desc: skycoll OAuth session storage path
    crit: notable
    for: [python]
    if:
      type: text
      substr: ~/.skycoll/sessions

  - id: skycoll-atproto-scopes
    desc: skycoll AT Protocol OAuth scope marker
    crit: notable
    for: [python]
    if:
      type: text
      substr: atproto transition:generic

composite_rules:
  - id: skycoll-python-cli
    desc: skycoll Bluesky AT Protocol social-graph CLI
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: skycoll-summary-marker
    any:
      - id: skycoll-wheel-name
      - id: skycoll-package-name
      - id: skycoll-sessions-dir
