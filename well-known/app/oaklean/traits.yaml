# oaklean — Hitabis GmbH JS/TS energy consumption VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: oaklean-vsix-name
    desc: Oaklean VSIX archive name
    if:
      type: path
      regex: '(?i)HitabisGmbH\.oaklean'

  - id: oaklean-package-name
    desc: Oaklean extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"oaklean"'

  - id: oaklean-publisher
    desc: HitabisGmbH VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"HitabisGmbH"'

  - id: oaklean-config-marker
    desc: Oaklean configuration namespace marker
    for: [javascript, json, package.json]
    crit: notable
    if:
      type: text
      substr: oaklean.

composite_rules:
  - id: oaklean-vscode-extension
    desc: Oaklean JS energy measurement VS Code extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: oaklean-publisher
    any:
      - id: oaklean-vsix-name
      - id: oaklean-package-name
      - id: oaklean-config-marker
