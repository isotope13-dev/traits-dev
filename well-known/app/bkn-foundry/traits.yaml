defaults:
  platforms: [unix, windows]
  for: [markdown, text, package.json, shell, python]
  crit: notable
  conf: 0.96
  size_min: 50
  size_max: 20000000

traits:
  - id: readme-heading
    desc: BKN Foundry README heading
    conf: 0.99
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: BKN Foundry

  - id: openbkn-product-name
    desc: OpenBKN product name reference
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bOpenBKN\b'

  - id: openbkn-github-repo
    desc: openbkn-ai/bkn-foundry repository reference
    conf: 0.99
    if:
      type: text
      substr: github.com/openbkn-ai/bkn-foundry

composite_rules:
  - id: bkn-foundry-identity
    desc: OpenBKN BKN Foundry platform identity
    conf: 0.98
    any:
      - id: readme-heading
      - id: openbkn-github-repo
      - id: openbkn-product-name
