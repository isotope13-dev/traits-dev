# Netdata monitoring agent identity.
#
# The bare product word is NOT an identity: "netdata" is also the name of Mark
# Newman's network-data collection (www-personal.umich.edu/~mejn/netdata/), a
# common dataset/directory name, and appears freely in monitoring prose. The two
# previous atoms were the same case-insensitive `netdata` substring written
# twice, so `needs: 2` over them was really "the word appears 20 times". This
# identity is consumed by
# metadata/package/quality/false-positives::benign-app-fp-context, so a
# word-only match lets any document that mentions netdata suppress unrelated
# detections. Identity now requires an installed-agent anchor (config path,
# plugin dir, NETDATA_* runtime env, or Netdata Cloud endpoint) alongside the
# repeated name.
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  size_max: 5000000
traits:
- id: netdata-name-repeated
  desc: Repeated Netdata name
  crit: component
  conf: 0.95
  count_min: 20
  if:
    type: text
    case_insensitive: true
    substr: netdata
- id: netdata-config-path
  desc: Netdata agent config path
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '/etc/netdata\b|\bnetdata\.conf\b'
- id: netdata-plugin-dir
  desc: Netdata agent plugin/library directory
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '/usr/(lib|libexec|share)/netdata\b'
- id: netdata-config-dir-env
  desc: NETDATA config-dir runtime env var
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\bNETDATA_(USER|STOCK)_CONFIG_DIR\b'
- id: netdata-runtime-dir-env
  desc: NETDATA runtime directory env var
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\bNETDATA_(PLUGINS|LOG|CACHE|LIB)_DIR\b'
- id: netdata-cloud-endpoint
  desc: Netdata Cloud service endpoint host
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(app|api|registry|agent-events)\.netdata\.cloud\b'
composite_rules:
- id: netdata-agent
  desc: Netdata monitoring agent identity
  crit: notable
  conf: 0.95
  all:
  - id: netdata-name-repeated
  any:
  - id: netdata-config-path
  - id: netdata-plugin-dir
  - id: netdata-config-dir-env
  - id: netdata-runtime-dir-env
  - id: netdata-cloud-endpoint
  needs: 1
