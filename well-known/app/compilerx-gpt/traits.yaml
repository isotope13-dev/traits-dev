defaults:
  platforms: [windows, unix]
  for: [chrome-manifest, crx]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: CompilerX-GPT Chrome extension identity
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Compilerx-GPT

  - id: service-domain
    desc: CompilerX service domain
    if:
      type: text
      substr: compilerx.com

composite_rules:
  - id: extension-identity
    desc: Recognized CompilerX-GPT Chrome extension
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: manifest-name
      - id: service-domain
