defaults:
  platforms: [unix, windows]
  for: [go, rust, python, shell, powershell, javascript, typescript, markdown, json]
  crit: baseline
  conf: 0.98
  size_min: 0

traits:
  - id: openai-codex-source-path
    desc: OpenAI Codex source archive path
    if:
      type: path
      substr: github.com/openai/codex
  - id: openai-codex-module-path
    desc: OpenAI Codex Go module path
    if:
      type: text
      substr: github.com/openai/codex
  - id: openai-codex-cli-name
    desc: OpenAI Codex CLI source marker
    if:
      type: text
      substr: codex-cli

  - id: openai-codex-platform-package
    desc: OpenAI Codex platform-specific npm package
    for: [package.json]
    if:
      type: text
      regex: '"@openai/codex-(linux|darwin|win32)-'

  - id: openai-codex-sdk-dependency
    desc: OpenAI Codex SDK npm dependency
    for: [package.json]
    if:
      type: text
      substr: '"@openai/codex-sdk"'

composite_rules:
  - id: openai-codex-source-context
    desc: OpenAI Codex source context
    crit: notable
    conf: 0.98
    any:
      - id: openai-codex-source-path
      - id: openai-codex-module-path
      - id: openai-codex-cli-name
      - id: openai-codex-platform-package
      - id: openai-codex-sdk-dependency
