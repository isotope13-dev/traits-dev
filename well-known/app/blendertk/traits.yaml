# BlenderTK is a pure-Python Blender/DCC interoperability toolkit. Its local
# RPC bridges and external DCC launchers are expected product functionality.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: BlenderTK distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: blendertk

  - id: wheel-distribution-name
    desc: BlenderTK wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: blendertk

  - id: python-package-path
    desc: BlenderTK Python package path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])blendertk[\\/]'

composite_rules:
  - id: blendertk-toolkit
    desc: BlenderTK Blender/DCC toolkit identity
    any:
      - id: package-name
      - id: wheel-distribution-name
      - id: python-package-path
