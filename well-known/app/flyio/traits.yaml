defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 40000000
  size_max: 150000000

traits:
  - id: flyctl-binary-name
    desc: flyctl CLI binary basename
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      exact: flyctl

  - id: superfly-module-path
    desc: superfly/flyctl Go module path
    for: [elf, macho, pe, go]
    if:
      type: text
      section: .text
      substr: github.com/superfly/flyctl

composite_rules:
  - id: flyctl-cli-context
    desc: Recognized Fly.io flyctl CLI context
    for: [elf, macho, pe, go]
    any:
      - id: flyctl-binary-name
      - id: superfly-module-path
