defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.98
  size_min: 1000000

traits:
  - id: zeroclaw-daemon-basename
    desc: ZeroClaw daemon executable basename
    if:
      type: value
      path: file.basename
      exact: zeroclaw.exe

  - id: zeroclaw-daemon-marker
    desc: ZeroClaw daemon gateway identity marker
    crit: notable
    if:
      type: text
      substr: "ZeroClaw Gateway listening on http://"
      section: .rdata

  - id: zerocode-source-tree
    desc: ZeroClaw TUI source-tree marker
    crit: notable
    if:
      type: text
      substr: 'apps\zerocode\src\'
      section: .rdata

composite_rules:
  - id: zeroclaw-daemon
    desc: ZeroClaw daemon application
    crit: notable
    all:
      - id: zeroclaw-daemon-basename
      - id: zeroclaw-daemon-marker

  - id: zerocode-tui
    desc: ZeroClaw TUI application
    crit: notable
    all:
      - id: zerocode-source-tree
      - id: metadata/binary/layout::pe-tls-callback-table

  - id: zeroclaw-windows-application
    desc: ZeroClaw Windows application
    crit: notable
    any:
      - id: zeroclaw-daemon
      - id: zerocode-tui
