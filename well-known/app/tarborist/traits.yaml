# tarborist — tylermorganwall R targets static analysis VS Code extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: tarborist-vsix-name
    desc: tarborist VSIX archive name
    if:
      type: path
      regex: '(?i)tylermorganwall\.tarborist'

  - id: tarborist-package-name
    desc: tarborist extension package name
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"tarborist"'

  - id: tarborist-publisher
    desc: tylermorganwall VS Code publisher marker
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"tylermorganwall"'

  - id: tarborist-targets-marker
    desc: tarborist R targets pipeline marker
    for: [javascript, json, markdown, package.json]
    crit: notable
    if:
      type: text
      substr: _targets.R

composite_rules:
  - id: tarborist-vscode-extension
    desc: tarborist R targets static analysis extension
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    all:
      - id: tarborist-publisher
    any:
      - id: tarborist-vsix-name
      - id: tarborist-package-name
      - id: tarborist-targets-marker
