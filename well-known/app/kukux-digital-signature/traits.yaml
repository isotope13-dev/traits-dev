# kukux-digital-signature — Laravel Filament digital signature plugin.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json, javascript, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: kukux-signature-archive-name
    desc: kukux digital-signature source archive name
    if:
      type: path
      regex: '(?i)kukux-digital-signature'

  - id: kukux-signature-composer-name
    desc: kukux/digital-signature Composer package
    for: [composer.json]
    if:
      type: value
      path: name
      exact: kukux/digital-signature

  - id: kukux-signature-namespace
    desc: Kukux DigitalSignature PHP namespace marker
    for: [php, composer.json]
    crit: notable
    if:
      type: text
      substr: Kukux\DigitalSignature

composite_rules:
  - id: kukux-digital-signature-package
    desc: Kukux Filament digital signature plugin
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: kukux-signature-archive-name
      - id: kukux-signature-composer-name
      - id: kukux-signature-namespace
