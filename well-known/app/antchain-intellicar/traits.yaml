# antchain_intellicar — Ant Chain INTELLICAR Python SDK wheel.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, markdown]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: antchain-intellicar-wheel-name
    desc: antchain_intellicar Python wheel name
    if:
      type: path
      regex: '(?i)antchain_intellicar-.*\.whl$'

  - id: antchain-intellicar-package-name
    desc: antchain-intellicar distribution name
    for: [whl]
    if:
      type: text
      regex: '(?i)^Name:\s*antchain-intellicar\s*$'

  - id: antchain-intellicar-sdk-module
    desc: antchain_sdk_intellicar Python module
    for: [python]
    crit: notable
    if:
      type: text
      substr: antchain_sdk_intellicar

composite_rules:
  - id: antchain-intellicar-python-sdk
    desc: Ant Chain INTELLICAR Python SDK wheel
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: antchain-intellicar-wheel-name
      - id: antchain-intellicar-package-name
      - id: antchain-intellicar-sdk-module
