# Tabsdata MySQL CDC — Tabs Data Inc. change-data-capture connector extra.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: tabsdata-cdc-mysql Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: tabsdata-cdc-mysql

  - id: package-metadata-name
    desc: tabsdata-cdc-mysql PyPI distribution name
    for: [json, markdown, text]
    if:
      type: text
      substr: 'Name: tabsdata-cdc-mysql'

  - id: tabsdata-cdc-module-path
    desc: tabsdata MySQL CDC connector module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)tabsdata/connector/'

  - id: tabsdata-homepage
    desc: Tabs Data Inc. tabsdata.com homepage marker
    for: [json, markdown, text]
    if:
      type: text
      substr: https://tabsdata.com

composite_rules:
  - id: tabsdata-cdc-mysql-connector
    desc: Tabsdata MySQL CDC connector plugin
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: tabsdata-cdc-module-path
