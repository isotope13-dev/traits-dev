# Jitsu Bulker data ingestion services (bulker, ingest, ingmgr, syncctl,
# sidecar). Each service is its own module under github.com/jitsucom/bulker.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  # Every Go binary of this product exceeds 1 MiB; the main-module path is
  # read from the embedded build info, not from a filename.
  size_min: 1048576

traits:
  - id: go-module
    desc: Jitsu Bulker Go main module
    if:
      type: value
      path: elf.go.module.path
      regex: '^github\.com/jitsucom/bulker(/[a-z-]+)?$'
