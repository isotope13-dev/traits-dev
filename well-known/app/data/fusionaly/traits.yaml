# Fusionaly — privacy-first self-hosted web analytics (karloscodes/fusionaly-oss).
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, javascript, shell, zip, markdown, text, makefile]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: oss-github-repo
    desc: Fusionaly OSS GitHub repository
    if:
      type: text
      substr: karloscodes/fusionaly-oss

  - id: install-script-url
    desc: Fusionaly curl installer URL
    for: [shell, text, markdown]
    if:
      type: text
      substr: fusionaly.com/install

  - id: window-global
    desc: Fusionaly browser global object
    for: [javascript]
    if:
      type: text
      substr: window.Fusionaly

  - id: pending-events-key
    desc: Fusionaly pending-events storage key
    for: [javascript]
    if:
      type: text
      substr: fusionaly_pendingEvents

  - id: go-module-clause
    desc: Fusionaly Go module path
    for: [go.mod, text]
    if:
      type: text
      exact: module fusionaly

  - id: demo-docker-image
    desc: Fusionaly demo Docker image
    for: [shell, text]
    if:
      type: text
      substr: karloscodes/fusionaly:latest

  - id: env-mode-var
    desc: FUSIONALY_ENV mode environment variable
    for: [shell, text, go, makefile]
    if:
      type: text
      word: FUSIONALY_ENV

  - id: makefile-project-name
    desc: Fusionaly Makefile project name
    for: [makefile, text]
    if:
      type: text
      exact: 'PROJECT_NAME := fusionaly'

  - id: archive-member-path
    desc: Fusionaly OSS archive member path
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: 'karloscodes/fusionaly-oss@'

  - id: zip-basename
    desc: Fusionaly OSS GitHub zip name
    for: [zip]
    if:
      type: basename
      regex: '(?i)github\.com-karloscodes-fusionaly-oss'

composite_rules:
  - id: fusionaly-analytics-source
    desc: Recognized Fusionaly analytics source
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: oss-github-repo
      - id: install-script-url
      - id: window-global
      - id: pending-events-key
      - id: go-module-clause
      - id: demo-docker-image
      - id: env-mode-var
      - id: makefile-project-name
  - id: fusionaly-oss-archive
    desc: Fusionaly OSS source archive
    crit: notable
    conf: 0.97
    for: [zip]
    all:
      - id: archive-member-path
      - id: zip-basename
