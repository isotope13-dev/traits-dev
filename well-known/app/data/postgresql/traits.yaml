defaults:
  crit: notable
  platforms: [unix, windows]
  for: [c, cpp, shell, perl, python]

traits:
  - id: postgresql-source-tree
    desc: PostgreSQL source-tree path
    conf: 0.99
    size_min: 100
    size_max: 100000000
    for: [binaries, scripts, source]
    if:
      type: path
      regex: '(^|[\\/])postgresql([\\/]|-[0-9])'

  # PostgreSQL's own wal_shipper.rb WAL-archiving example script. Each string
  # is verbatim from that script, so either one names it.
  - id: wal-shipper-header
    desc: PostgreSQL WAL shipper script header
    for: [ruby, shell, python, javascript]
    if:
      type: text
      substr: "PostgreSQL WAL files shipping"
  - id: wal-shipper-config
    desc: PostgreSQL WAL shipper configuration
    for: [ruby, shell, python, javascript]
    if:
      type: text
      substr: "archive_command = '/path/to/postgres_home/bin/wal_shipper.rb %p'"

  - id: postgresql-pe-pdb-marker
    desc: PostgreSQL PE build PDB debug path
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 1000
    size_max: 200000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]postgresql'

  - id: postgresql-event-log-marker
    desc: PostgreSQL Windows event log service marker
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 1000
    size_max: 200000000
    if:
      type: text
      section: .rdata
      substr: 'PostgreSQL error'

  - id: postgresql-native-binary-marker
    desc: PostgreSQL native binary string marker
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 1000
    size_max: 200000000
    if:
      type: text
      section: .rdata
      regex: 'PostgreSQL Global Development Group|postgres\.exe'

  - id: embedded-postgres-package-name
    desc: embedded-postgres package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@embedded-postgres/'

  - id: embedded-postgres-repository-url
    desc: embedded-postgres repository URL
    crit: notable
    conf: 0.99
    for: [package.json, text, javascript]
    if:
      type: text
      regex: '(?i)github\.com/leinelissen/embedded-postgres'

composite_rules:
  - id: postgresql-native-binary-context
    desc: Recognized PostgreSQL native binary context
    crit: exception
    conf: 0.99
    for: [pe, dll]
    any:
      - id: postgresql-pe-pdb-marker
      - id: postgresql-event-log-marker
      - id: postgresql-native-binary-marker
