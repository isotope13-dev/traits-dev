defaults:
  platforms: [unix, windows]
  for: [c, cpp, shell, perl, python]

traits:
  - id: postgresql-source-tree
    desc: PostgreSQL source-tree path
    crit: notable
    conf: 0.99
    size_min: 100
    size_max: 100000000
    for: [binaries, scripts, source]
    if:
      type: path
      regex: '(^|[\\/])postgresql([\\/]|-[0-9])'

  # PostgreSQL's own wal_shipper.rb WAL-archiving example script. Each string
  # is verbatim from that script, so either one names it.
  - id: wal-shipper-header
    desc: PostgreSQL WAL shipper script header
    crit: notable
    for: [ruby, shell, python, javascript]
    if:
      type: text
      substr: "PostgreSQL WAL files shipping"
  - id: wal-shipper-config
    desc: PostgreSQL WAL shipper configuration
    crit: notable
    for: [ruby, shell, python, javascript]
    if:
      type: text
      substr: "archive_command = '/path/to/postgres_home/bin/wal_shipper.rb %p'"
