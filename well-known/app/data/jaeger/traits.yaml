# Jaeger query service (jaegertracing/jaeger-query) image and binary.
defaults:
  platforms: [linux]
  crit: notable
  conf: 0.98

traits:
  - id: query-linux-basename
    desc: Jaeger query-linux executable name
    for: [elf]
    size_min: 1000000
    size_max: 500000000
    if:
      type: path
      basename: true
      exact: query-linux

  - id: container-archive
    desc: jaeger-query Docker image archive
    for: [tar]
    size_min: 1000000
    size_max: 2000000000
    if:
      type: path
      basename: true
      regex: 'docker\.io_jaegertracing_jaeger-query_.*\.tar\.xz$'

  - id: query-app-module
    desc: Jaeger query app Go module path
    for: [elf]
    size_min: 1000000
    size_max: 500000000
    if:
      type: text
      substr: github.com/jaegertracing/jaeger/cmd/query/app
      section: .gopclntab
