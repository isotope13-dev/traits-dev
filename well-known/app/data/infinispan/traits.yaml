# Infinispan in-memory data grid. Its web console bundle registers a
# product-named webpack chunk loader.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_max: 104857600

traits:
  - id: console-webpack-chunk
    desc: Infinispan console webpack chunk global
    if:
      type: text
      substr: webpackChunkinfinispan_console
