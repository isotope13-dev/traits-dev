defaults:
  crit: notable
  platforms: [unix, windows]
  for: [json]

traits:
  - id: couchbase-sync-gateway-sync-function
    desc: Couchbase Sync Gateway sync function
    conf: 0.95
    if:
      type: text
      regex: '"sync"\s*:\s*`\s*function\s*\(\s*doc'

  - id: couchbase-server-url
    desc: Couchbase server connection URL
    conf: 0.95
    if:
      type: text
      substr: "couchbase://"

composite_rules:
  - id: couchbase-sync-gateway-config
    desc: Couchbase Sync Gateway configuration
    conf: 0.95
    any:
      - id: couchbase-sync-gateway-sync-function
      - id: couchbase-server-url
