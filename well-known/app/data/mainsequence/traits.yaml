# Main Sequence — Python SDK and CLI for the Main Sequence data platform.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: mainsequence Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: mainsequence

  - id: package-metadata-name
    desc: mainsequence PyPI distribution name
    for: [json, markdown, text]
    if:
      type: text
      substr: 'Name: mainsequence'

  - id: mainsequence-cli-entrypoint
    desc: MainSequence CLI typer help text
    for: [python, text, json, markdown]
    if:
      type: text
      substr: 'MainSequence CLI (login + project operations)'

  - id: mainsequence-module-path
    desc: mainsequence Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)mainsequence/'

  - id: main-sequence-github-org
    desc: mainsequence-sdk GitHub organization repository
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: github.com/mainsequence-sdk/mainsequence-sdk

composite_rules:
  - id: mainsequence-sdk-context
    desc: Main Sequence platform Python SDK and CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: mainsequence-cli-entrypoint
      - id: mainsequence-module-path
