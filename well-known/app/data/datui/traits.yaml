# datui — terminal UI for tabular data, parquet, and cloud storage (Derek Wisong).
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  size_min: 1048576

traits:
  - id: datui-executable-basename
    desc: datui executable basename
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      exact: datui

  - id: datui-doc-url
    desc: datui documentation URL
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: derekwisong.github.io/datui
      section: .rodata

  - id: datui-github-repo
    desc: datui GitHub repository reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: github.com/derekwisong/datui
      section: .rodata

composite_rules:
  - id: datui-binary
    desc: datui terminal data viewer
    crit: exception
    conf: 0.98
    all:
      - id: datui-executable-basename
    any:
      - id: datui-doc-url
      - id: datui-github-repo
