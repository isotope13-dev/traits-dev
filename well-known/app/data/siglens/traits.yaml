# SigLens (SigScalr) observability installer and UI assets.
defaults:
  platforms: [unix, windows]
  for: [shell, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: agpl-header
    desc: SigLens AGPL copyright header
    for: [shell]
    if:
      type: text
      substr: This file is part of SigLens Observability Solution

  - id: github-releases-api
    desc: SigLens GitHub latest-release API URL
    for: [shell]
    if:
      type: text
      substr: api.github.com/repos/siglens/siglens/releases/latest

  - id: segment-install-track
    desc: SigLens installer Segment analytics track URL
    for: [shell]
    if:
      type: text
      substr: api.segment.io/v1/track

composite_rules:
  - id: siglens-install-telemetry
    desc: Recognized SigLens installer analytics script
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: agpl-header
      - id: github-releases-api
      - id: segment-install-track
