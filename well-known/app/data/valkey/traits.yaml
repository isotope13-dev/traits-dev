# Valkey — the Linux Foundation fork of the Redis data-store server. Its
# source tree ships `utils/install_server.sh`, the vendor service installer
# that renders `valkey_init_script.tpl` into /etc/init.d and registers the
# daemon at boot — installing the init script is the installer's product.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [c, cpp, shell, python, scripts]

traits:
  - id: valkey-source-tree
    desc: Valkey release source-tree path
    conf: 0.98
    if:
      type: path
      regex: '(^|[/\\])valkey([@-][^/\\]{0,80})?$'

  - id: valkey-init-script-template
    desc: Valkey service installer init template
    conf: 0.98
    if:
      type: text
      substr: valkey_init_script.tpl

composite_rules:
  - id: valkey-init-script-context
    desc: Valkey product-bundled init-script installer
    crit: exception
    conf: 0.95
    any:
      - id: valkey-source-tree
      - id: valkey-init-script-template
