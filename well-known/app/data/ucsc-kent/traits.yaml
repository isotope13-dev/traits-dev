# UCSC Kent source toolkit — genome browser command-line utilities such as
# twoBitInfo. These statically embed libcurl, OpenSSL, htslib, and related
# bioinformatics networking code, so generic HTTP/WebSocket strings are expected.
defaults:
  platforms: [unix, windows]
  for: [elf, macho]
  crit: notable
  conf: 0.99
  size_min: 1000

traits:
  - id: kent-source-version
    desc: Kent source tree version marker
    if:
      type: text
      substr: kent source version
      section: rodata

  - id: twobitinfo-usage
    desc: twoBitInfo CLI usage banner
    if:
      type: text
      substr: twoBitInfo - get information about sequences in a .2bit file
      section: rodata

  - id: twobit-library-source
    desc: Kent twoBit library source file
    if:
      type: text
      exact: twoBit.c
      section: rodata

  - id: twobitinfo-build-path
    desc: twoBitInfo Kent source build path
    if:
      type: value
      path: elf.dwarf.comp_dirs
      substr: kent/src/utils/twoBitInfo

  - id: genome-browser-net-source
    desc: UCSC genome browser net.c source marker
    if:
      type: text
      substr: genome.ucsc.edu/net.c
      section: rodata

composite_rules:
  - id: ucsc-kent-twobitinfo
    desc: UCSC Kent twoBitInfo genome utility
    crit: notable
    conf: 0.99
    any:
      - id: twobitinfo-usage
      - id: twobitinfo-build-path

  - id: ucsc-kent-twobitinfo-context
    desc: UCSC Kent twoBitInfo genome utility context
    crit: exception
    conf: 0.99
    any:
      - id: twobitinfo-usage
      - id: twobitinfo-build-path
      - id: genome-browser-net-source
