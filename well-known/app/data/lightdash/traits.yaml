# Lightdash's CLI installer sends a documented anonymous install event to its
# own analytics endpoint. This identity only suppresses supply-chain
# exfiltration composites for this exact telemetry script; curl and host/OS
# discovery capabilities remain visible as notable traits.
#
# @lightdash/* packages (cli, common, warehouses, ...) publish from the
# lightdash/lightdash monorepo, so folded-slug comparison reads every official
# release as a name/repo mismatch unless the scope and org repo are paired.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 1.0

traits:
  - id: lightdash-track-script
    desc: Lightdash CLI install tracking script
    if:
      type: basename
      exact: track.sh

  - id: lightdash-install-event
    desc: Lightdash anonymous CLI install event marker
    if:
      type: text
      substr: 'lightdash_cli.install.'

  - id: lightdash-analytics-endpoint
    desc: Lightdash first-party install analytics endpoint
    if:
      type: text
      substr: analytics.lightdash.com/v1/track

  - id: redshift-ca-bundle-marker
    desc: Lightdash Redshift Amazon CA bundle marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: ca-bundle-aws-redshift.crt

  - id: redshift-ssl-mode-marker
    desc: Lightdash Redshift SSL mode configuration marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: getSSLConfigFromMode

  - id: redshift-client-marker
    desc: Lightdash Redshift warehouse client marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: RedshiftWarehouseClient

  - id: scoped-package-identity
    desc: Lightdash scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@lightdash/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Lightdash scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@lightdash/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Lightdash GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/lightdash/lightdash(\.git)?(/.*)?$'

  - id: github-repository-shorthand
    desc: Lightdash owner/repo repository shorthand
    for: [package.json]
    if:
      type: value
      path: repository
      exact: lightdash/lightdash

  - id: github-repository-url
    desc: Lightdash GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/lightdash/lightdash(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Lightdash GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/lightdash/lightdash(\.git)?(/.*)?$'

  - id: npm-repository-shorthand
    desc: Lightdash npm archive repository shorthand
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      exact: lightdash/lightdash

composite_rules:
  - id: lightdash-anonymous-install-tracking
    desc: Recognized Lightdash anonymous install telemetry script
    crit: exception
    conf: 1.0
    all:
      - id: lightdash-track-script
      - id: lightdash-install-event
      - id: lightdash-analytics-endpoint

  - id: lightdash-redshift-tls-context
    desc: Lightdash Redshift certificate and SSL mode context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: redshift-ca-bundle-marker
      - id: redshift-ssl-mode-marker
      - id: redshift-client-marker

  - id: official-package-scope
    desc: Official Lightdash package scope
    crit: exception
    for: [package.json, npm]
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Lightdash monorepo repository
    crit: exception
    for: [package.json, npm]
    any:
      - id: github-repository-string
      - id: github-repository-shorthand
      - id: github-repository-url
      - id: github-npm-repository-url
      - id: npm-repository-shorthand

  - id: official-scope-repository-pair
    desc: Official Lightdash package repository pairing
    crit: exception
    for: [package.json, npm]
    all:
      - id: official-package-scope
      - id: official-package-repo
