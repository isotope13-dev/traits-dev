defaults:
  platforms: [unix, windows]
  for: [shell, elf, pe, text, perl]
  size_max: 200000000

traits:
  # The whole wsrep_sst_* family ships in mariadb-server (mariabackup, rsync,
  # rsync_wan, mysqldump, backup, common) and they share one code base, so
  # pinning the identity to a single member left the siblings unrecognised.
  - id: wsrep-sst-helper
    desc: MariaDB Galera state-transfer helper
    crit: notable
    conf: 0.99
    for: [shell]
    platforms: [unix]
    if:
      type: basename
      regex: '^wsrep_sst_[a-z0-9_]+$'

  # `syslog_tag_mysqld_safe` is the launcher's own logging tag, present in
  # every mysqld_safe/mariadbd-safe since 5.5 and in no other program. The
  # script is a supervisor: it nice-launches the server under nohup, probes
  # peers with `nc -z`, force-kills stale servers and chmods datadir files --
  # a capability profile that reads like a bot loader without this identity.
  - id: mysqld-safe-launcher
    desc: MariaDB/MySQL mysqld_safe server launcher
    crit: notable
    conf: 0.98
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: syslog_tag_mysqld_safe

  - id: wsrep-sst-markers
    desc: MariaDB Galera state-transfer markers
    crit: notable
    conf: 0.98
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?i)\b(WSREP_SST_OPT_|mariadb-backup|wsrep_sst)\b'

  # The remaining stock mariadb-server admin scripts. Each one looks alarming
  # in isolation -- galera_recovery evals a server command line as root and
  # chmods its log, galera_new_cluster writes a /run flag file and restarts a
  # service, mysqld_multi reads ~/.my.cnf credentials and rewrites files, and
  # mysql_secure_installation drops databases and builds a throwaway defaults
  # file -- so give each a program identity that triage can anchor on. The
  # markers are the servers' own long-form option and group names, which are
  # MariaDB/MySQL-specific and survive the scripts' periodic renames.
  - id: galera-recovery-helper
    desc: MariaDB Galera position-recovery helper
    crit: notable
    conf: 0.97
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: '--wsrep-start-position'

  - id: galera-new-cluster-bootstrap
    desc: MariaDB Galera new-cluster bootstrap script
    crit: notable
    conf: 0.97
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: '--wsrep-new-cluster'

  - id: mysqld-multi-manager
    desc: MariaDB/MySQL mysqld_multi instance manager
    crit: notable
    conf: 0.97
    for: [perl]
    platforms: [unix]
    if:
      type: text
      substr: 'mysqld_multi'

  - id: secure-installation-hardener
    desc: MariaDB secure-installation hardening script
    crit: notable
    conf: 0.97
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: 'mysql_secure_installation'

  - id: mariadb-version-marker-elf
    desc: MariaDB version identity string in ELF
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [unix]
    if:
      type: text
      section: .rodata
      # Canonical server identity embedded in mysqld/mariadbd and clients.
      regex: '\d+\.\d+\.\d+-MariaDB'

  - id: mariadb-version-marker-pe
    desc: MariaDB version identity string in PE
    crit: notable
    conf: 0.98
    for: [pe]
    platforms: [windows]
    if:
      type: text
      section: rdata
      regex: '\d+\.\d+\.\d+-MariaDB'

  - id: mariadb-version-marker-text
    desc: MariaDB version identity string in text
    crit: notable
    conf: 0.98
    for: [text, shell]
    platforms: [unix]
    if:
      type: text
      regex: '\d+\.\d+\.\d+-MariaDB'

  - id: mariadb-family-basename
    desc: MariaDB family binary basename
    crit: baseline
    conf: 0.98
    for: [elf, pe]
    if:
      type: basename
      # mariadb, mariadbd, mariadb-backup, mariadb-embedded, …
      regex: '^mariadb'

  - id: aria-s3-copy-basename
    desc: MariaDB aria_s3_copy binary basename
    crit: baseline
    conf: 0.98
    for: [elf, pe]
    if:
      type: basename
      exact: aria_s3_copy

  - id: libmarias3-marker
    desc: MariaDB Aria S3 client library marker
    crit: notable
    conf: 0.97
    for: [elf]
    platforms: [unix]
    if:
      type: text
      section: .rodata
      substr: '[libmarias3]'

  - id: mariadb-mysql-share-path
    desc: Path under MariaDB/MySQL share tree
    crit: baseline
    conf: 0.98
    for: [shell, text, perl]
    platforms: [unix]
    if:
      type: path
      # Stock scripts under share/mysql (benchmarks, policies).
      regex: 'share[/\\]mysql'

  - id: mariadb-artifact-path
    desc: MariaDB package or tree path marker
    crit: baseline
    conf: 0.97
    if:
      type: path
      # Arch/Debian package names and source trees: mariadb-12.2.2-…, mariadb/
      regex: '(?i)(^|[/\\])mariadb([_-][0-9]|[/\\]|$)'

  - id: arch-mariadb-pkginfo
    desc: Arch pkginfo names the mariadb package
    crit: notable
    conf: 0.99
    for: [text]
    platforms: [unix]
    if:
      type: text
      regex: '(?m)^pkgname\s*=\s*mariadb$'

composite_rules:
  - id: mariadb-wsrep-sst-helper-context
    desc: MariaDB Galera state-transfer helper context
    crit: exception
    conf: 0.99
    platforms: [unix]
    for: [shell]
    all:
      - id: wsrep-sst-helper
      - id: wsrep-sst-markers

  - id: mariadb-server-distribution
    desc: MariaDB server or tooling distribution artifact
    crit: notable
    conf: 0.97
    any:
      - id: mariadb-version-marker-elf
      - id: mariadb-version-marker-pe
      - id: mariadb-version-marker-text
      - id: mariadb-family-basename
      - id: aria-s3-copy-basename
      - id: libmarias3-marker
      - id: mariadb-mysql-share-path
      - id: mariadb-artifact-path
      - id: arch-mariadb-pkginfo
      - id: wsrep-sst-helper
      - id: mysqld-safe-launcher
      - id: galera-recovery-helper
      - id: galera-new-cluster-bootstrap
