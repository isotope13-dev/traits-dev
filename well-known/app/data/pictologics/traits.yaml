# pictologics — IBSI-compliant radiomic feature extraction package.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: pictologics Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: pictologics

  - id: package-metadata-name
    desc: pictologics PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: pictologics'

  - id: module-path
    desc: pictologics Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)pictologics/'

  - id: ibsi-radiomics-summary
    desc: IBSI radiomic feature extraction summary
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: IBSI-compliant radiomic feature extraction

  - id: github-repo
    desc: martonkolossvary pictologics GitHub repo
    for: [json, markdown, text, python]
    if:
      type: text
      substr: martonkolossvary/pictologics

composite_rules:
  - id: pictologics-package
    desc: Pictologics IBSI radiomics Python package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
