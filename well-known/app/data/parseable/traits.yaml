# Parseable, the Rust log analytics server. The repository URL alone could
# appear in a client; the P_STAGING_DIR setting is the server's own.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: component
  conf: 0.9
  size_min: 10485760

traits:
  - id: repository-url
    desc: Parseable GitHub repository reference
    if:
      type: text
      substr: github.com/parseablehq/parseable
      section: rodata
  - id: staging-dir-setting
    desc: Parseable P_STAGING_DIR setting name
    if:
      type: text
      substr: P_STAGING_DIR
      section: rodata

composite_rules:
  - id: server-binary
    desc: Parseable log analytics server binary
    crit: notable
    conf: 0.97
    all:
      - id: repository-url
      - id: staging-dir-setting
