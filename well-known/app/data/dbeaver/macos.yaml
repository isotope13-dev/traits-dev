defaults:
  platforms: [macos]
  size_max: 600000000

traits:
  - id: macos-app-bundle
    desc: DBeaver Community macOS app bundle
    crit: notable
    conf: 0.96
    for: [macho, binaries, jar, zip, java_class, class]
    if:
      type: path
      regex: 'DBeaver\.app[\\/]'
  - id: plugin-jar
    desc: DBeaver plugin JAR
    crit: notable
    conf: 0.96
    for: [jar, zip, java_class, class]
    size_max: 100000000
    if:
      type: path
      regex: 'org\.jkiss\.dbeaver\.[^\\/]+\.jar'
  - id: java-package
    desc: DBeaver Java package class
    crit: notable
    conf: 0.96
    for: [java_class, class]
    size_max: 5000000
    if:
      type: path
      regex: 'jkiss[\\/]dbeaver'
