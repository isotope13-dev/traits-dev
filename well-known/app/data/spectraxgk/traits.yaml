# SPECTRAX-GK — JAX gyrokinetic plasma physics solver (uwplasma).
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: spectraxgk Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: spectraxgk

  - id: package-metadata-name
    desc: spectraxgk PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: spectraxgk'

  - id: spectraxgk-module-path
    desc: spectraxgk Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)spectraxgk/'

  - id: spectrax-gk-github-repo
    desc: uwplasma SPECTRAX-GK GitHub repository
    for: [json, markdown, text, python]
    if:
      type: text
      substr: uwplasma/SPECTRAX-GK

  - id: gyrokinetic-summary-marker
    desc: SPECTRAX-GK gyrokinetic solver summary marker
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: JAX gyrokinetic solver

composite_rules:
  - id: spectraxgk-package-context
    desc: SPECTRAX-GK JAX gyrokinetic plasma solver
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: spectraxgk-module-path
