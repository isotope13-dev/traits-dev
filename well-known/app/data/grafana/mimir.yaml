defaults:
  platforms: [linux]
  crit: baseline
  conf: 0.98

traits:
  - id: grafana-mimir-container-archive
    crit: notable
    desc: Grafana Mimir container archive
    for: [tar]
    size_min: 1000000
    size_max: 2000000000
    if:
      type: path
      basename: true
      regex: 'docker\.io_grafana_mimir_.*\.tar\.xz$'
