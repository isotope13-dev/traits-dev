# Aether-9 — deterministic resonance-constrained language with VM bytecode.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: aether9 Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: aether9

  - id: package-metadata-name
    desc: aether9 PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: aether9'

  - id: aether9-module-path
    desc: aether9 Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)aether9/'

  - id: aether9-core-class
    desc: Aether9Core language runtime class
    for: [python]
    if:
      type: text
      substr: Aether9Core

  - id: aether-console-entry
    desc: aether CLI console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: aether = aether9.cli

composite_rules:
  - id: aether9-package
    desc: Aether-9 deterministic VM language package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: aether9-module-path
