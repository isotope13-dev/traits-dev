# curatorbin — pip wrapper shipping MongoDB Curator binaries (evergreen-ci/curatorbin).
# Bundled curator uses baobab/jasper LaunchAgent plist templates for CI process
# supervision, not user persistence.
defaults:
  platforms: [unix, windows]
  for: [whl, python, elf, macho, pe]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 100000000

traits:
  - id: wheel-distribution
    desc: curatorbin wheel distribution name
    for: [whl, pkginfo]
    if:
      type: value
      path: whl.distribution
      exact: curatorbin

  - id: package-module-path
    desc: curatorbin package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])curatorbin[\\/]'

  - id: evergreen-homepage
    desc: curatorbin Evergreen CI homepage
    if:
      type: text
      substr: github.com/evergreen-ci/curatorbin

  - id: mongodb-curator-vendor
    desc: MongoDB Curator vendor path in binary
    for: [elf, macho, pe]
    if:
      type: text
      section: __cstring
      substr: github.com/mongodb/curator

composite_rules:
  - id: curatorbin-package-context
    desc: curatorbin MongoDB Curator pip wrapper
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: wheel-distribution
      - id: evergreen-homepage
      - id: package-module-path

  - id: baobab-launchagent-template-context
    desc: MongoDB Curator baobab LaunchAgent plist template
    crit: exception
    conf: 0.99
    for: [elf, macho, pe]
    all:
      - id: mongodb-curator-vendor
    any:
      - id: curatorbin-package-context
      - id: package-module-path
