# honeybee-openstudio — Ladybug Tools OpenStudio translation extension.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: honeybee-openstudio Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: honeybee-openstudio

  - id: package-metadata-name
    desc: honeybee-openstudio PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: honeybee-openstudio'

  - id: module-path
    desc: honeybee_openstudio Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)honeybee_openstudio/'

  - id: openstudio-translation-summary
    desc: Honeybee OpenStudio HBJSON translation summary
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: translating HBJSON models to OpenStudio

  - id: console-entry
    desc: honeybee-openstudio console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: honeybee-openstudio = honeybee_openstudio.cli:openstudio

  - id: ladybug-github-repo
    desc: ladybug-tools honeybee-openstudio GitHub repo
    for: [json, markdown, text, python]
    if:
      type: text
      substr: ladybug-tools/honeybee-openstudio

composite_rules:
  - id: honeybee-openstudio-package
    desc: Ladybug Honeybee OpenStudio translation package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
