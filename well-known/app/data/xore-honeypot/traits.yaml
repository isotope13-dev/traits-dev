# xore//honeypot is a defensive dashboard for aggregating honeypot and IDS
# telemetry.  Its embedded payload-analysis UI intentionally contains command
# and malware vocabulary; identify the application before interpreting those
# strings as execution or delivery behavior.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, go]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: maxminddb-golang-dependency
    desc: MaxMind dependency in xore dashboard
    if:
      type: value
      path: pe.go.deps
      substr: github.com/oschwald/maxminddb-golang
  - id: dashboard-package-name
    desc: Go dashboard package name
    if:
      type: value
      path: pe.go.path
      exact: dashboard

composite_rules:
  - id: dashboard
    desc: xore honeypot telemetry dashboard
    crit: notable
    conf: 0.99
    all:
      - id: dashboard-package-name
      - id: maxminddb-golang-dependency

  - id: benign-context
    desc: Recognized xore honeypot dashboard context
    crit: exception
    conf: 0.99
    all:
      - id: dashboard
      - id: maxminddb-golang-dependency
