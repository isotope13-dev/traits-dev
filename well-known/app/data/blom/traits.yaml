# BLOM (Bergen Layered Ocean Model) — NorESM ocean/iHAMOCC source tree.
# GitHub source zips are often typed as odf (ZIP magic + a "mimetype" member).
defaults:
  platforms: [unix, windows]
  for: [zip, odf]
  conf: 0.98
  size_max: 524288000

traits:
  - id: noresmhub-blom-path
    desc: NorESMhub BLOM source path
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)noresmhub/blom'

  - id: externals-blom-cfg
    desc: BLOM externals config basename
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)Externals_BLOM\.cfg$'

  - id: ihamocc-model-name
    desc: iHAMOCC biogeochemistry model name
    crit: notable
    if:
      type: text
      substr: iHAMOCC

composite_rules:
  - id: blom-ocean-model-source
    desc: BLOM ocean model source tree
    crit: notable
    needs: 2
    any:
      - id: noresmhub-blom-path
      - id: externals-blom-cfg
      - id: ihamocc-model-name
