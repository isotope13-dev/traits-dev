# cubit-mesh-export — Coreform Cubit to NGSolve/Netgen mesh export plugin.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: cubit-mesh-export Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: cubit-mesh-export

  - id: package-metadata-name
    desc: cubit-mesh-export PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: cubit-mesh-export'

  - id: cubit-module-path
    desc: cubit_mesh_export Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)cubit_mesh_export/'

  - id: cubit-plugin-install-entrypoint
    desc: cubit-plugin-install console entry point
    for: [json, markdown, text, python]
    if:
      type: text
      substr: cubit-plugin-install

  - id: radia-export-command
    desc: Coreform Cubit radia_export command marker
    for: [python, markdown, text]
    if:
      type: text
      substr: radia_export

composite_rules:
  - id: cubit-mesh-export-package
    desc: Coreform Cubit mesh export Python package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: cubit-module-path
