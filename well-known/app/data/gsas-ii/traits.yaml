# GSAS-II — General Structure Analysis System II crystallography package (Advanced Photon Source / Argonne National Lab).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: pyproject-project-name
    desc: GSAS-II pyproject project name
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      exact: GSAS-II

  - id: github-repo-reference
    desc: AdvancedPhotonSource GSAS-II GitHub repository
    for: [python, pyproject.toml, text, markdown, json]
    if:
      type: text
      substr: AdvancedPhotonSource/GSAS-II

  - id: diffraction-analysis-description
    desc: GSAS-II diffraction analysis description
    for: [pyproject.toml, pkginfo, text, markdown]
    if:
      type: text
      substr: Structural analysis from neutron and x-ray diffraction

  - id: package-module-path
    desc: GSAS-II Python package module path
    for: [python, whl, zip, python-sdist]
    if:
      type: path
      regex: '(?i)(^|/)GSASII/'

  - id: local-user-directory-path
    desc: GSAS-II local user overrides directory
    for: [python]
    if:
      type: text
      regex: '(?i)[~''"/]\.G2local[/''"]'

  - id: mac-app-droplet-name
    desc: GSAS-II macOS application droplet name
    for: [plist, text]
    if:
      type: text
      substr: GSAS-II project

  - id: app-template-archive-basename
    desc: GSAS-II macOS app droplet template archive
    for: [tar, tar.gz]
    if:
      type: basename
      regex: '^g2app\.tar(\.gz)?$'

composite_rules:
  - id: gsas-ii-package-context
    desc: GSAS-II crystallography analysis package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: pyproject-project-name
      - id: github-repo-reference
      - id: diffraction-analysis-description
      - id: package-module-path

  - id: gsas-ii-app-context
    desc: Recognized GSAS-II scientific analysis application context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: gsas-ii-package-context
      - id: app-template-archive-basename
      - id: mac-app-droplet-name

  - id: gsas-ii-local-plugin-context
    desc: GSAS-II local user plugin directory context
    crit: exception
    conf: 0.99
    all:
      - id: local-user-directory-path
      - id: micro-behaviors/os/module/search-path::sys-path-mutate
