# autojudge-base — TREC AutoJudge IR evaluation infrastructure.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: autojudge-base Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: autojudge-base

  - id: package-metadata-name
    desc: autojudge-base PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: autojudge-base'

  - id: autojudge-module-path
    desc: autojudge_base Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)autojudge_base/'

  - id: autojudge-github-repo
    desc: trec-autojudge auto-judge-base GitHub repo
    for: [json, markdown, text, python]
    if:
      type: text
      substr: trec-autojudge/auto-judge-base

  - id: auto-judge-console-entry
    desc: auto-judge CLI console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: auto-judge = autojudge_base.cli

composite_rules:
  - id: autojudge-base-package
    desc: TREC AutoJudge evaluation infrastructure package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: autojudge-module-path
