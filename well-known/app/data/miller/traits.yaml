# Miller (mlr) is an open-source name-indexed data processing CLI tool (johnkerl/miller)
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: baseline
  conf: 0.98
  size_min: 100000
  size_max: 200000000

traits:
  - id: miller-pe-go-module-path
    crit: notable
    desc: Miller Windows Go module path
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      regex: '^github\.com/johnkerl/miller(/v[0-9]+)?$'

  - id: miller-elf-go-module-path
    crit: notable
    desc: Miller Linux Go module path
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      regex: '^github\.com/johnkerl/miller(/v[0-9]+)?$'

  - id: miller-macho-go-module-path
    crit: notable
    desc: Miller macOS Go module path
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      regex: '^github\.com/johnkerl/miller(/v[0-9]+)?$'

composite_rules:
  - id: miller-data-tool-binary
    desc: Miller structured data processing tool
    crit: notable
    conf: 0.99
    any:
      - id: miller-pe-go-module-path
      - id: miller-elf-go-module-path
      - id: miller-macho-go-module-path
