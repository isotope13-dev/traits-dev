# AppGrowing CLI — AppGrowing Global ad intelligence monitoring CLI.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: appgrowing-cli Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: appgrowing-cli

  - id: package-metadata-name
    desc: appgrowing-cli PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: appgrowing-cli'

  - id: module-path
    desc: appgrowing_cli Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)appgrowing_cli/'

  - id: appgrowing-client-class
    desc: AppGrowingClient API adapter class
    for: [python]
    if:
      type: text
      substr: class AppGrowingClient

  - id: console-entry
    desc: appgrowing CLI console entry point
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: appgrowing = appgrowing_cli.cli

composite_rules:
  - id: appgrowing-cli-package
    desc: AppGrowing Global competitive monitoring CLI
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
