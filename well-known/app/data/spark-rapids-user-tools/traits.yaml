# spark-rapids-user-tools — NVIDIA RAPIDS Accelerator for Apache Spark tooling.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: spark-rapids-user-tools PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: spark-rapids-user-tools

  - id: nvidia-support-email
    desc: NVIDIA spark-rapids-support contact marker
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: spark-rapids-support@nvidia.com

  - id: rapids-accelerator-summary
    desc: RAPIDS Accelerator for Apache Spark summary
    for: [python, pkginfo, markdown]
    if:
      type: text
      substr: RAPIDS Accelerator for Apache Spark

  - id: csppath-class
    desc: spark-rapids-tools cloud storage path class
    for: [python]
    if:
      type: text
      substr: class CspPath

composite_rules:
  - id: spark-rapids-toolkit-context
    desc: NVIDIA spark-rapids-user-tools cloud Spark toolkit
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: rapids-accelerator-summary

  - id: spark-rapids-cloud-path-context
    desc: spark-rapids-tools multi-cloud storage path library
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: csppath-class
