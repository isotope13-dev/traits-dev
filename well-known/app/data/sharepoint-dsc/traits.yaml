# Benign SharePoint Desired State Configuration PowerShell module identity.
# This context is used only to suppress generic anti-static/discovery
# heuristics that match normal DSC resource-kit implementation code, the
# same role well-known/app/data/sql-server-dsc plays for SqlServerDsc.
defaults:
  platforms: [windows]
  for: [powershell, nupkg]
  crit: notable
  conf: 0.98

traits:
  - id: module-path-identity
    desc: SharePoint DSC module path identity
    if:
      type: path
      regex: '(?i)SharePointDsc'

  - id: module-name-identity
    desc: SharePoint DSC module name
    if:
      type: text
      substr: SharePointDsc

  - id: dsc-resource-implementation-marker
    desc: SharePoint DSC resource implementation marker
    if:
      type: text
      regex: '(?i)MSFT_SP[A-Za-z]+'

composite_rules:
  - id: benign-module-context
    desc: Recognized SharePoint DSC module context
    crit: exception
    conf: 0.99
    all:
      - id: module-path-identity
    any:
      - id: module-name-identity
      - id: dsc-resource-implementation-marker
