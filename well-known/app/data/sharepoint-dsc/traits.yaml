defaults:
  platforms:
  - windows
  for:
  - powershell
  - nupkg
  crit: notable
  conf: 0.98
traits:
- id: module-path-identity
  desc: SharePoint DSC module path identity
  if:
    type: path
    regex: (?i)SharePointDsc
- id: module-name-identity
  desc: SharePoint DSC module name
  for:
  - powershell
  if:
    type: text
    substr: SharePointDsc
- id: dsc-resource-implementation-marker
  desc: SharePoint DSC resource implementation marker
  for:
  - powershell
  if:
    type: text
    regex: (?i)MSFT_SP[A-Za-z]+
