# geneinfo — munch-group genomics annotation Python package.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: geneinfo Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: geneinfo

  - id: package-metadata-name
    desc: geneinfo PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: geneinfo'

  - id: module-path
    desc: geneinfo Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)geneinfo/'

  - id: munch-group-homepage
    desc: munch-group geneinfo project homepage
    for: [json, markdown, text, pkginfo, python]
    if:
      type: text
      substr: munch-group.org/geneinfo

  - id: github-repo
    desc: munch-group geneinfo GitHub repository
    for: [json, markdown, text, python]
    if:
      type: text
      substr: munch-group/geneinfo

composite_rules:
  - id: geneinfo-package
    desc: geneinfo genomics annotation Python package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
