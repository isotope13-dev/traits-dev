# Datatailr — enterprise analytics and data platform SDK (Datatailr Inc.)
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Datatailr Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: datatailr

  - id: package-metadata-name
    desc: Datatailr PyPI package name
    for: [pkginfo, text]
    if:
      type: text
      substr: 'Name: datatailr'

  - id: package-module-path
    desc: Datatailr package member path
    for: [python, whl, zip, python-sdist]
    if:
      type: path
      regex: '(?i)(^|[\\/])datatailr[\\/]'

  - id: install-notice-module
    desc: Datatailr install notice module
    for: [python]
    if:
      type: text
      substr: 'show_install_notice_safely'

  - id: install-notice-pth-file
    desc: Datatailr install notice .pth file
    for: [python, text]
    if:
      type: path
      basename: true
      exact: datatailr_install_notice.pth

composite_rules:
  - id: package-context
    desc: Datatailr enterprise data platform SDK
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: package-module-path

  - id: install-notice-context
    desc: Datatailr CLI install notice context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: install-notice-pth-file
    any:
      - id: package-context
      - id: package-module-path
      - id: install-notice-module
