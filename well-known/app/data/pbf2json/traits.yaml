# Pelias pbf2json - OpenStreetMap PBF parser with npm wrapper
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, pe, elf, macho]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: pbf2json package name
    for: [package.json]
    size_min: 1
    size_max: 1000000
    if:
      type: value
      path: name
      exact: pbf2json

  - id: repository-url
    desc: pbf2json repository URL
    for: [package.json]
    size_min: 1
    size_max: 1000000
    if:
      type: text
      substr: github.com/pelias/pbf2json

  - id: binary-name
    desc: pbf2json precompiled binary name
    for: [pe, elf, macho]
    size_min: 1000000
    size_max: 20000000
    if:
      type: path
      regex: '(^|[\\/])pbf2json\.(darwin|linux|win32)-[a-zA-Z0-9_-]+$'

composite_rules:
  - id: pbf2json-package
    desc: pbf2json package identity
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: package-name
      - id: repository-url
