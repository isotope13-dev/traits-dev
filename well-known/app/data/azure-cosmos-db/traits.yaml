# Azure Cosmos DB document-export structure.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.95
  size_min: 128
  size_max: 8000000

traits:
  - id: document-self-link-in-settings
    desc: Cosmos DB document self-link in settings array
    if:
      type: value
      path: settings[*]._self
      regex: '^dbs/.+/colls/.+/docs/'
