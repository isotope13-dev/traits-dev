defaults:
  platforms: [unix, windows]
  for: [php, archives]
  crit: notable
  conf: 0.99

traits:
  - id: child-package-path
    desc: MainWP Child plugin package path
    crit: notable
    if:
      type: path
      regex: '(?i)(^|[\\/])mainwp-child([\\/]|$)'

  - id: child-plugin-header
    desc: MainWP Child WordPress plugin header
    crit: notable
    for: [php]
    if:
      type: text
      regex: '(?im)^\\s*\\*\\s*Plugin Name:\s*MainWP Child\\s*$'

composite_rules:
  - id: child-plugin-identity
    desc: MainWP Child WordPress plugin identity
    crit: notable
    conf: 0.99
    for: [php]
    scope: archive
    all:
      - id: child-package-path
      - id: child-plugin-header

  - id: child-plugin-archive-context
    desc: MainWP Child backup-management context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: child-plugin-identity
      - id: child-package-path
