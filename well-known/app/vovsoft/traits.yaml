# VOVSOFT utilities legitimately combine WinHTTP, clipboard/input, GDI, and
# screenshot functionality. The personal Authenticode signer is not enough to
# establish trust, so these contexts require the exact PE product identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 100000000
traits:
  - id: vovsoft-company
    desc: VOVSOFT PE company identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.version.company
      exact: VOVSOFT
  - id: ai-requester-product
    desc: VOVSOFT AI Requester product identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.version.product_name
      exact: AI Requester
  - id: filename-lister-product
    desc: VOVSOFT Filename Lister product identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.version.product_name
      exact: Filename Lister

composite_rules:
  - id: ai-requester-known-app-context
    desc: Recognized VOVSOFT AI Requester context
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/vovsoft::vovsoft-company
      - id: well-known/app/vovsoft::ai-requester-product
  - id: filename-lister-known-app-context
    desc: Recognized VOVSOFT Filename Lister context
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/vovsoft::vovsoft-company
      - id: well-known/app/vovsoft::filename-lister-product
