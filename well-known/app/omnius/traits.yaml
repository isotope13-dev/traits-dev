# Omnius — local-first agentic coding runtime (robit-man/open-agents). npm
# install hooks stop and restart a per-user REST daemon; bundled OSINT catalog
# entries reference OAST and onion URLs as tool metadata, not install callbacks.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text, json, package.json, npm, shell]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: Omnius npm package name
    for: [package.json, json, npm]
    if:
      type: text
      regex: '(?i)"name"\s*:\s*"omnius"'

  - id: upstream-repository
    desc: Omnius open-agents upstream repository
    if:
      type: text
      substr: github.com/robit-man/open-agents

  - id: daemon-postinstall-script
    desc: Omnius daemon postinstall script path
    for: [javascript, shell, npm]
    if:
      type: basename
      exact: postinstall-daemon.cjs

  - id: daemon-preinstall-script
    desc: Omnius daemon preinstall handoff script path
    for: [javascript, shell, npm]
    if:
      type: basename
      exact: preinstall.cjs

  - id: daemon-install-opt-out-env
    desc: Omnius daemon install opt-out env var
    if:
      type: text
      substr: OMNIUS_SKIP_DAEMON_INSTALL

  - id: launchd-daemon-label
    desc: Omnius macOS launchd daemon label
    if:
      type: text
      substr: ai.omnius.daemon

  - id: loopback-rest-port
    desc: Omnius default loopback REST daemon port
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: 127.0.0.1:11435

  - id: nexus-peer-dependency
    desc: Omnius open-agents-nexus peer mesh dependency
    for: [package.json, json, npm, javascript, typescript]
    if:
      type: text
      substr: open-agents-nexus

  - id: bundled-loader-marker
    desc: Omnius bundled JavaScript loader marker
    for: [javascript]
    if:
      type: text
      substr: __omnius_createRequire

  - id: runtime-environment-namespace
    desc: Omnius runtime environment variable namespace
    for: [javascript]
    if:
      type: text
      regex: '\bOMNIUS_[A-Z0-9_]+\b'

composite_rules:
  - id: omnius-coding-agent
    desc: Omnius local-first agentic coding runtime
    crit: notable
    conf: 0.99
    scope: archive
    for: [archives, npm]
    all:
      - id: npm-package-name
      - id: upstream-repository
    any:
      - id: daemon-postinstall-script
      - id: daemon-preinstall-script
      - id: daemon-install-opt-out-env
      - id: launchd-daemon-label
      - id: nexus-peer-dependency

  - id: bundled-runtime-context
    desc: Recognized Omnius bundled runtime source context
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: bundled-loader-marker
      - id: runtime-environment-namespace

  - id: daemon-script-context
    desc: Recognized Omnius daemon installer source context
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: daemon-postinstall-script
      - id: daemon-install-opt-out-env
      - id: launchd-daemon-label
