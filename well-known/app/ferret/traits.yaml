# Ferret is a documented self-hosted VPN/tunnel agent. Its remote tunnel
# handlers and optional systemd installer are expected product capabilities,
# not evidence of an undocumented backdoor in this named application.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl]

traits:
  - id: package-name
    desc: Ferret Agent Python package name
    crit: notable
    conf: 1.0
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: ferret-agent

  - id: source-marker
    desc: Ferret Agent project source marker
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      regex: 'ferret-agent|Dejan-Port/ferret'

composite_rules:
  - id: ferret-agent-tunnel-context
    desc: Ferret Agent documented tunnel context
    crit: exception
    conf: 1.0
    any:
      - id: package-name
      - id: source-marker
