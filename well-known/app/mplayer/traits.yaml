defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.95
  size_min: 1000000
  size_max: 100000000

traits:
  - id: binary-name
    desc: MPlayer executable basename
    if:
      type: value
      path: file.basename
      exact: mplayer

  - id: runtime-banner
    desc: MPlayer version banner string
    if:
      type: text
      section: .rodata
      substr: "MPlayer "

  - id: configuration-path
    desc: MPlayer configuration path
    if:
      type: text
      section: .rodata
      exact: /etc/mplayer/mplayer.conf

composite_rules:
  - id: application-binary
    desc: MPlayer media player binary
    crit: notable
    conf: 0.99
    all:
      - id: binary-name
      - id: runtime-banner
      - id: configuration-path
