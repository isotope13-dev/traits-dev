defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
  size_min: 1024
  size_max: 524288000
traits:
  - id: codebuddy-marker
    desc: Tencent Cloud CodeBuddy assistant marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      # The bare product name also appears in generic adapter registries and
      # command-line help. Require the vendor-qualified product marker here;
      # the archive-path atom below covers packaged CodeBuddy applications.
      substr: Tencent Cloud CodeBuddy
  - id: codebuddy-archive-path
    desc: Tencent CodeBuddy VSIX archive path
    crit: baseline
    conf: 0.95
    if:
      type: path
      substr: "Tencent-Cloud.coding-copilot"
  - id: tencent-cloud-sdk-bundle-marker
    desc: Tencent Cloud SDK bundled module marker
    crit: component
    conf: 0.95
    if:
      type: text
      substr: TENCENTCLOUD_SECRETID
  - id: codebuddy-cookiejar-marker
    desc: CodeBuddy CookieJar bundle marker
    crit: component
    for: [javascript]
    if:
      type: text
      word: CookieJar
  - id: codebuddy-sig-zip64-marker
    desc: CodeBuddy SIG_ZIP64 bundle marker
    crit: component
    for: [javascript]
    if:
      type: text
      word: SIG_ZIP64
  - id: codebuddy-zod-patterns-marker
    desc: CodeBuddy zodPatterns bundle marker
    crit: component
    for: [javascript]
    if:
      type: text
      word: zodPatterns
  - id: codebuddy-define-locale-marker
    desc: CodeBuddy defineLocale bundle marker
    crit: component
    for: [javascript]
    if:
      type: text
      word: defineLocale

composite_rules:
  - id: codebuddy-decoded-vendor-library-bundle
    desc: CodeBuddy decoded vendor library bundle
    crit: baseline
    conf: 0.9
    for: [javascript]
    any:
      - id: codebuddy-cookiejar-marker
      - id: codebuddy-sig-zip64-marker
      - id: codebuddy-zod-patterns-marker
      - id: codebuddy-define-locale-marker
  - id: tencent-codebuddy
    desc: Tencent Cloud CodeBuddy assistant
    crit: notable
    conf: 0.95
    any:
      - id: codebuddy-marker
      - id: codebuddy-archive-path
  - id: tencent-codebuddy-sdk-bundle
    desc: Tencent CodeBuddy bundled Tencent Cloud SDK
    crit: notable
    conf: 0.98
    all:
      - id: tencent-codebuddy
    any:
      - id: tencent-cloud-sdk-bundle-marker
      - id: codebuddy-decoded-vendor-library-bundle
