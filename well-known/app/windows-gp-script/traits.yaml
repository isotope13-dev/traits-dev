# GPSCRIPT.EXE runs scripts assigned through Windows Group Policy. Its
# registry and process-launch behavior is expected for this system component.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 5242880
  crit: notable
  conf: 0.99

traits:
  - id: gpscript-original-filename
    desc: GPScript original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: GPSCRIPT.EXE
      case_insensitive: true

  - id: gpscript-internal-name
    desc: GPScript internal name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: gpscript
      case_insensitive: true

  - id: gpscript-description
    desc: Group Policy Script Application description
    if:
      type: value
      path: pe.version.description
      exact: Group Policy Script Application

  - id: gpscript-manifest-identity
    desc: Microsoft GPScript manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Microsoft.Windows.GroupPolicy.GPScript

  - id: gpscript-pdb
    desc: GPScript PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      exact: gpscript.pdb
      case_insensitive: true

composite_rules:
  - id: gpscript-identity
    desc: Microsoft Group Policy Script Application identity
    crit: notable
    conf: 0.99
    all:
      - id: gpscript-original-filename
      - id: gpscript-internal-name
      - id: gpscript-description
      - id: gpscript-manifest-identity
      - id: gpscript-pdb

  - id: gpscript-system-context
    desc: Microsoft Group Policy Script Application context
    crit: exception
    conf: 0.99
    all:
      - id: gpscript-identity
      - id: metadata/binary/vendor::microsoft-prefixed-company
