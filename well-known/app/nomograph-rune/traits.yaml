# nomograph-rune — AI agent skill registry manager Rust crate.
defaults:
  platforms: [unix, windows]
  for: [rust, crate, cargo.toml, markdown, text]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: nomograph-rune-crate-name
    desc: nomograph-rune Rust crate archive name
    for: [archives, crate]
    crit: notable
    if:
      type: path
      regex: '(?i)nomograph-rune-.*\.crate$'

  - id: nomograph-rune-cargo-name
    desc: nomograph-rune Cargo package name
    for: [cargo.toml, crate]
    if:
      type: text
      regex: '(?i)^name\s*=\s*"nomograph-rune"'

  - id: nomograph-rune-repository-marker
    desc: nomograph rune upstream repository marker
    for: [rust, crate, cargo.toml, markdown]
    crit: notable
    if:
      type: text
      substr: gitlab.com/nomograph/rune

composite_rules:
  - id: nomograph-rune-rust-crate
    desc: nomograph rune AI skill registry crate
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: nomograph-rune-crate-name
      - id: nomograph-rune-cargo-name
      - id: nomograph-rune-repository-marker
