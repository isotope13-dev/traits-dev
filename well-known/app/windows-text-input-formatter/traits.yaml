# TextInputMethodFormatter.dll is a Windows mincore text-input virtualization
# component (RDP/remote IME PDU formatting). Multiple TLS callbacks and mid-
# range overall entropy are normal for this MSVC C++ DLL and must not be read
# as an unsigned packed loader.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
  size_max: 4194304
  crit: notable
  conf: 0.99

traits:
  - id: timf-original-filename
    desc: TextInputMethodFormatter original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: TextInputMethodFormatter.dll
      case_insensitive: true

  - id: timf-internal-name
    desc: TextInputMethodFormatter internal name
    if:
      type: value
      path: pe.version.internal_name
      exact: TextInputMethodFormatter
      case_insensitive: true

  - id: timf-description
    desc: TextInputMethodFormatter DLL description
    if:
      type: value
      path: pe.version.description
      exact: TextInputMethodFormatter DLL

  - id: timf-pdb
    desc: TextInputMethodFormatter PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[/\\])TextInputMethodFormatter\.pdb$'

  - id: timf-dll-get-activation-factory
    desc: Exports DllGetActivationFactory WinRT entry
    if:
      type: export
      exact: DllGetActivationFactory

  - id: timf-source-path-marker
    desc: mincore TextInputMethodFormatter source path
    if:
      type: text
      section: .rdata
      substr: 'mincore\textinput\dev\virtualization\textinputmethodformatter'

composite_rules:
  - id: text-input-method-formatter-identity
    desc: Windows TextInputMethodFormatter component identity
    crit: notable
    conf: 0.99
    all:
      - id: timf-original-filename
      - id: timf-internal-name
      - id: timf-description
      - id: timf-pdb
    any:
      - id: timf-dll-get-activation-factory
      - id: timf-source-path-marker
