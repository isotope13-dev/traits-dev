# libadb-android — an ADB client implemented as an Android library, so an app
# can speak the ADB protocol to the daemon on its own device.
# https://github.com/MuntashirAkon/libadb-android
#
# Legitimate consumers exist (App Manager uses it to run privileged commands a
# user has explicitly enabled), which is why identity alone is notable. It is
# listed here beside Shizuku and KernelSU because the capability it grants —
# shell-UID execution from inside an ordinary app — is the same one malware
# reaches for once it can turn Wireless Debugging on by itself.
defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  attack: T1021

traits:
  - id: libadb-android-package-namespace
    desc: libadb-android package namespace
    conf: 0.98
    if:
      type: text
      substr: "io.github.muntashirakon.adb"

  - id: libadb-android-dex-namespace
    desc: libadb-android Dalvik class namespace
    conf: 0.98
    if:
      type: text
      substr: "Lio/github/muntashirakon/adb/"

  - id: libadb-android-connection-manager-class
    desc: libadb-android connection manager class
    conf: 0.96
    if:
      type: text
      word: AbsAdbConnectionManager

  - id: libadb-android-gradle-coordinate
    desc: libadb-android Gradle coordinate
    conf: 0.98
    for: [java, kotlin]
    if:
      type: text
      substr: "com.github.MuntashirAkon:libadb-android"

composite_rules:
  - id: libadb-android-library
    desc: Embeds the libadb-android ADB client
    conf: 0.99
    any:
      - id: libadb-android-package-namespace
      - id: libadb-android-dex-namespace
      - id: libadb-android-connection-manager-class
      - id: libadb-android-gradle-coordinate
