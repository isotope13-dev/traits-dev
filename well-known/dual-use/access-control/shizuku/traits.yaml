# Shizuku (RikkaApps) is a documented Android ADB/root privilege broker.
# Binder proxying, native starter exec/popen, and WRITE_SECURE_SETTINGS are
# the product; identify it without treating those dual-use capabilities as
# malware on their own.
defaults:
  platforms: [linux, android]
  for: [c, cpp, kotlin, java, markdown, xml, archives]
  crit: notable
  conf: 0.95
  size_min: 32
  size_max: 50000000

traits:
  - id: privileged-api-package
    desc: Shizuku privileged API package name
    for: [c, cpp, java, kotlin]
    if:
      type: text
      substr: moe.shizuku.privileged.api

  - id: manager-package
    desc: Shizuku manager Java package
    for: [java, kotlin]
    if:
      type: text
      substr: moe.shizuku.manager

  - id: server-class
    desc: Shizuku server service class
    for: [c, cpp, java, kotlin]
    if:
      type: text
      substr: rikka.shizuku.server.ShizukuService

  - id: github-repo
    desc: RikkaApps Shizuku GitHub repository
    for: [markdown]
    if:
      type: text
      substr: github.com/RikkaApps/Shizuku
