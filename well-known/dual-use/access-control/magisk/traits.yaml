# Magisk is an Android root-management framework. These content markers
# identify its boot-image and init components without treating root access,
# init replacement, or SELinux policy changes as malware on their own.
defaults:
  platforms: [android, linux]
  for: [elf]
  crit: notable
  conf: 0.95
  size_min: 100000
  size_max: 2000000

traits:
  - id: magiskinit-temp-marker
    desc: Magisk init temporary-directory marker
    if:
      type: raw
      offset_range: [0, null]
      substr: Setup Magisk tmp at

  - id: magiskinit-rootdir-marker
    desc: Magisk init ramdisk path marker
    if:
      type: raw
      offset_range: [0, null]
      substr: .magisk/rootdir/init

  - id: magiskboot-banner
    desc: Magisk boot-image tool banner
    if:
      type: raw
      offset_range: [0, null]
      substr: MagiskBoot - Boot Image Modification Tool

composite_rules:
  - id: magiskinit
    desc: Magisk init component
    crit: notable
    conf: 0.98
    all:
      - id: magiskinit-temp-marker
      - id: magiskinit-rootdir-marker

