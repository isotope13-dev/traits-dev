# amfidont — macOS AMFI signature-validation bypass via LLDB. A documented
# developer utility that requires SIP debugging disabled and root; identify
# the project without treating those dual-use capabilities as malware.
defaults:
  platforms: [macos]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: pypi-name
    desc: amfidont PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: amfidont

  - id: wheel-distribution
    desc: amfidont wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: amfidont

  - id: github-repo
    desc: zqxwce amfidont GitHub repository URL
    if:
      type: text
      substr: github.com/zqxwce/amfidont

  - id: help-banner
    desc: amfidont CLI help banner
    for: [python]
    if:
      type: text
      substr: bypassing amfid signature verification

  - id: daemon-started-banner
    desc: amfidont daemon started banner
    for: [python]
    if:
      type: text
      substr: 'amfidont daemon started'

  - id: module-launch-argv
    desc: amfidont module launch argv
    for: [python]
    if:
      type: text
      substr: '"-m", "amfidont"'

composite_rules:
  - id: amfidont-identity
    desc: Recognized amfidont AMFI bypass tool
    needs: 2
    any:
      - id: pypi-name
      - id: wheel-distribution
      - id: github-repo
      - id: help-banner
      - id: daemon-started-banner
      - id: module-launch-argv
      - id: micro-behaviors/os/security/gatekeeper::amfid-daemon-path
      - id: micro-behaviors/os/security/gatekeeper::amfi-path-validator-class
