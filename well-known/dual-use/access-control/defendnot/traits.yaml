defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 8388608
traits:
- id: project-url
  desc: Defendnot project URL in native code data
  if:
    type: text
    substr: https://github.com/es3n1n/defendnot
    section: .rdata
- id: ipc-name
  desc: Defendnot shared-memory IPC channel name
  if:
    type: text
    exact: defender-disabler-ipc
    section: .rdata
- id: wsc-unavailable-message
  desc: Defendnot Windows Security Center diagnostic
  if:
    type: text
    substr: Windows Security Center (WSC) is not available
    section: .rdata
composite_rules:
- id: native-loader
  desc: Defendnot fake antivirus registration loader
  all:
  - id: project-url
  - id: ipc-name
  - id: wsc-unavailable-message
