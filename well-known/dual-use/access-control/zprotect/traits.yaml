defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.95
traits:
  - id: zprotect-plugin-description
    crit: notable
    desc: ZProtect plugin resource text
    if:
      type: text
      substr: A plugin for Zprotect System.
      section: .rsrc
  - id: zprotect-plugin-import
    crit: notable
    desc: ZProtect plugin API import
    if:
      type: symbol
      exact: ZPPC_SetCfgIntValue
  - id: zprotect-plugin-exports
    desc: ZProtect plugin export surface
    crit: notable
    conf: 0.98
    count_min: 6
    if:
      type: symbol
      regex: ^ZPCP_
composite_rules:
  - id: zprotect-plugin
    desc: ZProtect plugin metadata
    crit: notable
    conf: 0.99
    all:
      - id: metadata/vendor/identity::pash-corp-string
      - id: zprotect-plugin-import
    any:
      - id: zprotect-plugin-description
      - id: zprotect-plugin-exports
