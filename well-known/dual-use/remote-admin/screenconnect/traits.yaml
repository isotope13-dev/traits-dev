# ConnectWise ScreenConnect (formerly ScreenConnect / ConnectWise Control) —
# a commercial remote-monitoring-and-management product.
#
# It is legitimate software with a legitimate installer, and it is also one of
# the most frequently abused remote-access tools in intrusion sets: the client
# is a single self-contained executable whose relay host, instance key, and
# unattended-access flag are baked in at build time on the *server* side, so
# an operator can hand a victim a stock, validly signed binary that phones a
# relay the operator controls. Nothing in the file has to be modified, which is
# why byte-level malware signatures do not catch the abuse — the identity of
# the tool is the finding, and the deployment context decides the verdict.
#
# Kept in dual-use/ rather than malware/: this fingerprints the product, not a
# campaign. Analysts need it surfaced wherever an RMM client turns up in an
# artifact that should not contain one.
defaults:
  platforms: [windows]
  for: [pe, dll, msi]
  crit: notable
  conf: 0.95
  size_min: 10000
  size_max: 209715200

traits:
  - id: screenconnect-core-assembly
    desc: ScreenConnect.Core assembly reference
    if:
      type: text
      substr: ScreenConnect.Core.dll

  # The always-on service half of the client — this is what makes access
  # unattended and survive logoff, as opposed to a one-shot support session.
  - id: screenconnect-client-service-binary
    desc: ScreenConnect unattended client service binary
    if:
      type: text
      substr: ScreenConnect.ClientService.exe

  # "Backstage" is the product's hidden-session mode: the operator gets a
  # private desktop and shell on the host without the logged-on user seeing it.
  - id: screenconnect-backstage-shell
    desc: ScreenConnect hidden Backstage shell binary
    if:
      type: text
      substr: ScreenConnect.WindowsBackstageShell.exe

  # Client-side relay plumbing: the instance fingerprint and relay URI scheme
  # are how the client finds the server that will drive it.
  - id: screenconnect-relay-uri-scheme
    desc: ScreenConnect relay URI scheme handling
    if:
      type: text
      substr: GetInstanceFingerprintFromUrlScheme

composite_rules:
  # Core assembly plus the unattended service or the hidden-desktop shell:
  # this artifact is a deployable remote-control agent, not the product's
  # documentation or a viewer stub.
  - id: screenconnect-unattended-access-client
    desc: ScreenConnect unattended remote-access client
    crit: suspicious
    conf: 0.94
    attack: T1219
    all:
      - id: screenconnect-core-assembly
    any:
      - id: screenconnect-client-service-binary
      - id: screenconnect-backstage-shell
      - id: screenconnect-relay-uri-scheme
