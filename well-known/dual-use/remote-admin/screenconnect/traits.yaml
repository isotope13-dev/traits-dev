composite_rules:
- id: screenconnect-authenticode-signer
  size_min: 512
  size_max: 500000000
  desc: ConnectWise ScreenConnect signer
  crit: notable
  conf: 0.98
  platforms:
  - windows
  mbc: C0048
  all:
  - id: connectwise-authenticode-subject
  - id: metadata/signed/certificate/identity::pe-cert-issuer-digicert
- id: screenconnect-component-detected
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect component
  crit: notable
  conf: 0.95
  platforms:
  - windows
  mbc: C0048
  needs: 3
  any:
  - id: screenconnect-clientservice-dll
  - id: screenconnect-client-dll
  - id: screenconnect-core-dll
  - id: screenconnect-windows-dll
  - id: screenconnect-client-exe
  - id: screenconnect-backstage-shell
  - id: screenconnect-file-manager
  - id: screenconnect-auth-package
  - id: screenconnect-credential-provider
  - id: screenconnect-rdata-client-marker
  - id: screenconnect-rdata-core-marker
  - id: screenconnect-rdata-product-marker
- id: screenconnect-service-persistence
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect service
  crit: notable
  conf: 0.95
  platforms:
  - windows
  mbc: C0048
  all:
  - id: screenconnect-component-detected
  - id: objectives/persistence/system/service/install::service-startup
# Identity verdict for the product, and deliberately SUSPICIOUS rather than
# notable.
#
# ScreenConnect is licensed software with real customers, so the instinct is to
# call its presence neutral and let context decide. That instinct is calibrated
# to a corporate estate that has bought it. It is wrong for the population this
# ruleset actually sees: loose artifacts pulled from malware feeds, mail
# attachments, sandbox submissions and incoming packages. In that population an
# unattended ScreenConnect client is overwhelmingly initial access — the
# tech-support-scam and ransomware-affiliate crews reach for it precisely
# because the binary is stock, validly signed by ConnectWise, and therefore
# invisible to signature-based detection. The relay host and the access flag are
# baked in server-side at build time, so there is nothing in the file to modify
# and nothing for a hash to catch.
#
# `suspicious` is the honest reading of "potentially unwanted": it says an
# analyst should look, not that the file is malicious. An estate that deploys
# ScreenConnect on purpose will see it on its own agents and can suppress it
# there, where the deployment context is actually known; we do not have that
# context and must not assume it. `hostile` still requires an anomaly on top —
# see `objectives/command-and-control/backdoor/control/rmm::
# screenconnect-anomalous-deployment` for what counts.
- id: screenconnect-family
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect remote access tool
  crit: suspicious
  conf: 0.95
  platforms:
  - windows
  # The file default is `for: [pe]`; msi/xml are needed so the packaged
  # installer and the extracted system.config reach the same verdict as a
  # loose client executable.
  for: [pe, dll, msi, xml]
  mbc: C0048
  needs: 2
  any:
  - id: screenconnect-component-detected
  # The MSI/package spelling of the same identity, so a ScreenConnect installer
  # reaches this verdict too. Without it an .msi payload produced only the
  # component-bundle observation and never the product conclusion.
  - id: msi-screenconnect-components
  - id: connectwisecontrol-client-marker
  - id: screenconnect-product-marker
  - id: screenconnect-authenticode-signer
  - id: screenconnect-clickonce-runner-pdb
  - id: screenconnect-dotnet-service-runner-pdb
  - id: screenconnect-dotnet-runner-pdb
  - id: connectvpn-c2-domain
  - id: screenconnect-rdata-product-marker
  - id: screenconnect-product-version-resource

- id: screenconnect-signed-launcher-context
  desc: Verified vendor-hosted ScreenConnect signed launcher context
  crit: exception
  conf: 0.98
  platforms:
  - windows
  all:
  - id: screenconnect-authenticode-signer
  - id: screenconnect-clickonce-runner-pdb
  - id: objectives/command-and-control/backdoor/control/rmm::screenconnect-clickonce-application-url
  - id: screenconnect-vendor-hosted-endpoint

- id: screenconnect-vendor-binary-context
  desc: Official ScreenConnect vendor binary
  crit: exception
  conf: 0.98
  platforms:
  - windows
  all:
  - id: screenconnect-authenticode-signer
  any:
  - id: screenconnect-clickonce-runner-pdb
  - id: screenconnect-dotnet-service-runner-pdb
  - id: screenconnect-dotnet-runner-pdb
- id: screenconnect-unattended-access-client
  desc: ScreenConnect unattended remote-access client
  crit: suspicious
  conf: 0.94
  platforms:
  - windows
  all:
  - id: screenconnect-core-dll
  any:
  - id: screenconnect-clientservice-dll
  - id: screenconnect-backstage-shell
  - id: screenconnect-relay-uri-scheme
