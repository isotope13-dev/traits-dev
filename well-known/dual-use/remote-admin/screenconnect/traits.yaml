# ConnectWise ScreenConnect (formerly ScreenConnect / ConnectWise Control) —
# a commercial remote-monitoring-and-management product.
#
# It is legitimate software with a legitimate installer, and it is also one of
# the most frequently abused remote-access tools in intrusion sets: the client
# is a single self-contained executable whose relay host, instance key, and
# unattended-access flag are baked in at build time on the *server* side, so
# an operator can hand a victim a stock, validly signed binary that phones a
# relay the operator controls. Nothing in the file has to be modified, which is
# why byte-level malware signatures do not catch the abuse — the identity of
# the tool is the finding, and the deployment context decides the verdict.
#
# Kept in dual-use/ rather than malware/: this fingerprints the product, not a
# campaign. Analysts need it surfaced wherever an RMM client turns up in an
# artifact that should not contain one.
defaults:
  attack: T1219
  platforms:
  - linux
  - unix
  - windows
  - macos
  - ios
  - android
  for:
  - pe
  size_max: 5000000
traits:
- id: screenconnect-client-launch-parameters
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect ClientLaunchParameters property
  crit: notable
  conf: 0.93
  platforms:
  - windows
  if:
    type: text
    regex: '(?i)\bClientLaunchParameters\b'
    section: ".text"
- id: screenconnect-clientservice-dll
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect ClientService
  crit: notable
  conf: 0.95
  platforms:
  - windows
  if:
    type: text
    substr: ScreenConnect.ClientService
    section: ".text"
  mbc: C0048
- id: screenconnect-client-dll
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect Client DLL
  crit: notable
  conf: 0.95
  platforms:
  - windows
  if:
