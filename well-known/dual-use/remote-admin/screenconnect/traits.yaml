  crit: notable
  conf: 0.99
  platforms:
  - windows
  if:
    type: value
    path: pe.version.product_name
    exact: ScreenConnect
  mbc: C0048
- id: screenconnect-clientsetup-filename
  desc: ScreenConnect client installer filename
  crit: notable
  conf: 0.98
  platforms: [windows]
  if:
    type: basename
    exact: ScreenConnect.ClientSetup.exe
    case_insensitive: true
  mbc: C0048
# ClickOnceRunner keeps its per-instance URL in the Authenticode
# unauthenticated-attributes table. That table is outside normal PE string
# sections, so extracted-text matching cannot see its UTF-16 form. These three
# fragments are correlated below to avoid treating a generic URL parameter as
# ScreenConnect configuration.
- id: screenconnect-clickonce-application-wide
  desc: Wide ScreenConnect ClickOnce URL marker
  crit: component
  conf: 0.98
  platforms: [windows]
  for: [pe, dll, csharp]
  if:
    type: hex
    pattern: "53 00 63 00 72 00 65 00 65 00 6E 00 43 00 6F 00 6E 00 6E 00 65 00 63 00 74 00 2E 00 43 00 6C 00 69 00 65 00 6E 00 74 00 2E 00 61 00 70 00 70 00 6C 00 69 00 63 00 61 00 74 00 69 00 6F 00 6E 00 3F 00"
    offset_range: [-4096, null]
- id: screenconnect-bare-ip-host-wide
  desc: Wide ScreenConnect bare-IP host parameter
  crit: component
  conf: 0.97
  platforms: [windows]
  for: [pe, dll, csharp]
  if:
    type: raw
    regex: '\?\x00h\x00=\x00([0-9]\x00){1,3}(\.\x00([0-9]\x00){1,3}){3}'
    offset_range: [-4096, null]
- id: screenconnect-relay-port-key-wide
  desc: Wide ScreenConnect port and key parameters
  crit: component
  conf: 0.97
  platforms: [windows]
  for: [pe, dll, csharp]
  if:
    type: raw
    regex: '&\x00p\x00=\x00([0-9]\x00){2,5}&\x00k\x00=\x00'
    offset_range: [-4096, null]
- id: screenconnect-clientsetup-name-script
  desc: ScreenConnect client installer name
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, html, php, source]
  if:
    type: text
    regex: '(?i)\bScreenConnect\.ClientSetup\.(exe|msi)\b'
  mbc: C0048
- id: screenconnect-clientservice-name-script
  desc: ScreenConnect client service name
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, html, php, source]
  if:
    type: text
    regex: '(?i)\bScreenConnect\.ClientService\.exe\b'
  mbc: C0048
- id: connectwise-authenticode-subject
  size_min: 512
  size_max: 500000000
  desc: ConnectWise Authenticode signer identity
  crit: notable
  conf: 0.98
  platforms:
  - windows
  if:
    type: value
    path: pe.signatures[0].subject
    regex: 'Connectwise\\?, LLC'
    case_insensitive: true
  mbc: C0048
- id: screenconnect-clickonce-runner-pdb
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect ClickOnce runner PDB
  crit: notable
  conf: 0.96
  platforms:
  - windows
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '\\cwcontrol\\.*ClickOnceRunner\.pdb$'
    case_insensitive: true
  mbc: C0048
- id: screenconnect-dotnet-service-runner-pdb
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect native .NET service runner PDB
  crit: notable
  conf: 0.99
  platforms:
  - windows
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '\\cwcontrol\\Custom\\DotNetRunner\\Release\\DotNetServiceRunner\.pdb$'
    case_insensitive: true
  mbc: C0048
- id: screenconnect-dotnet-runner-pdb
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect native .NET resource runner PDB
  crit: notable
  conf: 0.99
  platforms:
  - windows
  if:
    type: text
    regex: '\\cwcontrol\\Custom\\DotNetRunner\\Release\\DotNetRunner\.pdb$'
    case_insensitive: true
    section: .rdata
  mbc: C0048
- id: screenconnect-vendor-hosted-endpoint
  size_min: 512
  size_max: 500000000
  desc: ScreenConnect vendor-hosted launch endpoint
  crit: notable
  conf: 0.98
  platforms:
  - windows
  if:
    type: text
    regex: '(?i)https?://[A-Za-z0-9.-]{1,120}\.screenconnect\.com/'
    section: overlay
  mbc: C0002
- id: connectvpn-c2-domain
  size_min: 512
  size_max: 500000000
  desc: ConnectVPN C2 domain
  crit: notable
  conf: 0.9
  platforms:
  - windows
  if:
