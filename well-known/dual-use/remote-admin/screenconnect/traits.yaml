    section: ".text"
  mbc: C0002
- id: screenconnect-rdata-client-marker
  size_min: 512
  size_max: 5000000
  desc: ScreenConnect NativeAOT client marker
  crit: notable
  conf: 0.95
  platforms:
  - windows
