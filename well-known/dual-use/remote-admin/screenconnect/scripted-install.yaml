# Self-hosted deployment is dual-use. UAC RunAs requests consent; it does
# not bypass UAC. Hidden installer windows do not prove hidden session UI.
defaults:
  platforms: [windows]
  for: [scripts, javascript, typescript, python, powershell, batch, shell]

composite_rules:
  - id: scripted-hidden-ip-guest-service-install
    desc: ScreenConnect hidden guest-install configuration
    crit: suspicious
    conf: 0.97
    attack: T1219,T1564.003
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-access-guest-parameters
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/os/firewall/netsh::batch-firewall-action-allow
      - id: micro-behaviors/os/service/configure::service-auto-start-argument
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
