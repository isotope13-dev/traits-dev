defaults:
  attack: T1219
  platforms:
  - windows
  # MSI containers route as Unknown (oledoc rules never see the package body).
  # ScreenConnect component/stealth markers live in nested PE members extracted
  # from the CAB, so target pe/dll rather than for:[all] (filetype-cap).
  for:
  - pe
  - dll
  conf: 0.95
  size_max: 50000000
traits:
# Assembly-name stems (`ScreenConnect.ClientService`, BackstageShell, …) live
# in traits.yaml as screenconnect-* atoms. Keep only MSI/config-oriented
# markers here so pe/dll coverage does not duplicate those substrings.
- id: msi-remote-control-banner
  desc: ScreenConnect remote control banner
  crit: suspicious
  if:
    type: text
    substr: Your computer is being controlled by {0}
    section: ".text"
- id: msi-client-service-executable-name
  desc: ScreenConnect client service executable setting
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: ClientServiceExecutableName
    section: ".text"
- id: msi-launch-parameters-constraint
  desc: ScreenConnect launch parameters config
  crit: notable
  if:
    type: text
    substr: ClientLaunchParametersConstraint
    section: ".text"
- id: msi-relay-host-parameter
  desc: ScreenConnect relay host parameter
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: "\\?h=[a-z0-9-]+-relay\\.screenconnect\\.com(&amp;|&)p=443"
    section: ".text"
- id: msi-rsa-key-parameter
  desc: ScreenConnect RSA key parameter
  crit: component
  conf: 0.96
  if:
    type: text
    substr: BgIAAACkAABSU0Ex
    section: ".text"
- id: msi-feedback-survey-hidden
  desc: ScreenConnect hides survey prompt
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: ShowFeedbackSurveyForm
    section: ".text"
- id: msi-under-control-banner-hidden
  desc: ScreenConnect hides control banner
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: AccessShowUnderControlBanner
    section: ".text"
- id: msi-balloon-connect-hidden
  desc: ScreenConnect hides connect balloon
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: AccessShowBalloonOnConnect
    section: ".text"
- id: msi-balloon-hide-hidden
  desc: ScreenConnect hides hide balloon
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: AccessShowBalloonOnHide
    section: ".text"
- id: msi-tray-icon-hidden
  desc: ScreenConnect hides tray icon
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: AccessShowSystemTrayIcon
    section: ".text"
- id: msi-wallpaper-hiding
  desc: ScreenConnect toggles wallpaper hiding
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: HideWallpaperOnConnect
    section: ".text"
composite_rules:
- id: msi-screenconnect-components
  desc: ScreenConnect component bundle in MSI
  crit: suspicious
  conf: 0.98
  scope: outer
  needs: 3
  any:
  - id: screenconnect-clientservice-dll
  - id: screenconnect-backstage-shell
  - id: screenconnect-credential-provider
  - id: screenconnect-auth-package
  - id: msi-remote-control-banner
  - id: msi-client-service-executable-name
- id: msi-stealth-feedback-group
  desc: ScreenConnect suppresses local feedback
  crit: suspicious
  conf: 0.99
  needs: 2
  any:
  - id: msi-feedback-survey-hidden
  - id: msi-under-control-banner-hidden
  - id: msi-wallpaper-hiding
- id: msi-stealth-access-group
  desc: ScreenConnect suppresses access indicators
  crit: suspicious
  conf: 0.99
  needs: 2
  any:
  - id: msi-balloon-connect-hidden
  - id: msi-balloon-hide-hidden
  - id: msi-tray-icon-hidden
- id: msi-screenconnect-stealth-config
  desc: ScreenConnect stealth config in MSI
  crit: suspicious
  conf: 0.99
  all:
  - id: msi-launch-parameters-constraint
  - id: msi-stealth-feedback-group
  - id: msi-stealth-access-group
- id: msi-screenconnect-relay-config
  desc: ScreenConnect relay config in MSI
  crit: suspicious
  conf: 0.99
  all:
  - id: msi-launch-parameters-constraint
  - id: msi-relay-host-parameter
  - id: msi-rsa-key-parameter
# ServiceExe(With|Without)Service names often live only in the MSI file table.
# Nested PE members expose ClientServiceExecutableName as the service wiring
# signal when the wrapper blobs are not extracted.
- id: msi-screenconnect-service-persistence
  desc: ScreenConnect MSI service persistence signal
  crit: component
  conf: 0.97
  scope: outer
  any:
  - id: objectives/persistence/system/service/install::msi-service-wrapper-binaries
  - id: objectives/persistence/system/service/install::msi-serviceinstall-table
  - id: msi-client-service-executable-name
- id: msi-screenconnect-service-installer
  desc: ScreenConnect service installer MSI
  crit: hostile
  conf: 0.99
  # Pool MSI table signals with nested PE assembly/stealth markers.
  scope: outer
  all:
  - id: msi-screenconnect-components
  - id: msi-screenconnect-service-persistence
  any:
  - id: msi-screenconnect-stealth-config
  - id: msi-screenconnect-relay-config
