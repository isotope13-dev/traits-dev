# A guest-access client launched from a script that also pulls a remote MSI
# and re-enables Secondary Logon is attacker staging, not an MSP deployment.
defaults:
  platforms: [windows]
  for: [batch, powershell]
composite_rules:
  - id: script-staged-remote-msi-guest-client-seclogon
    desc: Script stages remote MSI, enables seclogon, launches guest client
    crit: hostile
    conf: 0.95
    attack: T1219,T1218.007,T1569.002
    near_lines: 30
    all:
      - id: objectives/execution/payload/file-exec/installer/invocation::remote-msi-download-install
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-access-guest-parameters
      - id: micro-behaviors/os/service/name::batch-seclogon-service-enable
    unless:
      - id: metadata/path/directory::test-directory-component
