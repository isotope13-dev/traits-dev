# ScreenConnect's file-transfer classes are legitimate RMM internals. They are
# kept as notable product capabilities here; attacker intent is inferred only
# when lateral-movement rules correlate them with automatic Host-session
# selection and payload collection.
defaults:
  for: [csharp, pe, dll, powershell, python, javascript]
  platforms: [windows, linux, macos]
  size_min: 512
  size_max: 500000000
  attack: T1219

traits:
  - id: transfer-files-message-type
    desc: ScreenConnect file-transfer message type
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\bScreenConnect\.TransferFilesMessage\b'

  - id: file-action-run-selection
    desc: ScreenConnect transferred-file run action
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(ScreenConnect\.FileAction[\s\S]{0,180}["'']Run["'']|FileAction\s*\.\s*Run)'

  - id: virtual-file-registration-method
    desc: ScreenConnect virtual-file registration method
    crit: notable
    conf: 0.97
    if:
      type: text
      word: RegisterVirtualFiles

  - id: outgoing-message-enqueue-method
    desc: ScreenConnect outgoing-message enqueue method
    crit: notable
    conf: 0.97
    if:
      type: text
      word: EnqueueOutgoingMessage

composite_rules:
  - id: programmatic-run-file-transfer
    desc: ScreenConnect programmatic run-file transfer
    crit: notable
    conf: 0.99
    all:
      - id: transfer-files-message-type
      - id: file-action-run-selection
      - id: virtual-file-registration-method
      - id: outgoing-message-enqueue-method
    near_bytes: 2048
