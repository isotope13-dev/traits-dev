# Whalent Agent is a disclosed managed AI-agent runtime. Its gateway, remote
# terminal, tunnel, and self-update features are sensitive dual-use behavior,
# but their product-labelled implementation is not evidence of a backdoor.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: whalent-agent-home-setting
    desc: Whalent Agent home environment setting
    if:
      type: text
      substr: WHALENT_AGENT_HOME

  - id: whalent-gateway-setting
    desc: Whalent gateway environment setting
    if:
      type: text
      substr: WHALENT_GATEWAY

  - id: whalent-npm-registry-setting
    desc: Whalent npm registry environment setting
    if:
      type: text
      substr: WHALENT_NPM_REGISTRY

composite_rules:
  - id: whalent-managed-agent-context
    desc: Recognized Whalent managed-agent runtime context
    crit: exception
    conf: 0.99
    all:
      - id: whalent-agent-home-setting
      - id: whalent-gateway-setting
      - id: whalent-npm-registry-setting
