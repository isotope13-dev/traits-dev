# SKB Kontur (Kontur.Admin / Kontur.Dostup) — Russian commercial remote-support / RMM agent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  attack: T1219
  size_min: 1000
  size_max: 50000000

traits:
  - id: kontur-company-name
    desc: SKB Kontur publisher metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)(SKB Kontur|СКБ Контур)'

  - id: kontur-admin-product-name
    desc: Kontur.Admin or Kontur.Dostup product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)(Контур\.Админ|Контур\.Доступ|Kontur\.Admin|Kontur\.Dostup)'

composite_rules:
  - id: kontur-remote-admin-client
    desc: Genuine SKB Kontur remote administration agent
    crit: notable
    conf: 0.99
    all:
      - id: kontur-company-name
      - id: kontur-admin-product-name
