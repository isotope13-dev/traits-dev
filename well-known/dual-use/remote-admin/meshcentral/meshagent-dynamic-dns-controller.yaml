# MeshCentral agent compiled to reach a controller on a dynamic-DNS host instead of the
# project's own servers. MeshAgent is a legitimate, open-source RMM client, so the
# product identity and the agent.ashx route are notable on their own. A controller
# on a free dynamic-DNS name, reached by the agent binary itself, is the remote-control
# backdoor configuration. The composite requires both legs in the same file.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1219

traits:
  - id: meshagent-product-identity
    desc: MeshCentral Agent product identity string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: MeshCentral Agent

  - id: meshagent-dynamic-dns-controller-url
    desc: MeshAgent websocket to a dynamic-DNS controller
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wss://[A-Za-z0-9-]{2,40}\.(duckdns\.org|no-ip\.(com|org|biz))[^"\s]{0,20}/agent\.ashx'

composite_rules:
  - id: meshagent-dynamic-dns-backdoor
    desc: MeshAgent bound to a dynamic-DNS controller is a remote-control backdoor
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: well-known/dual-use/remote-admin/meshcentral::meshagent-product-identity
      - id: well-known/dual-use/remote-admin/meshcentral::meshagent-dynamic-dns-controller-url
