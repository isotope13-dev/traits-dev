# Famatech Radmin Viewer 3.0 — genuine dual-use remote-administration client.
# The Radmin trademark strings also match SigBase's Remoteadmin third-party
# rule (downgraded to notable in third-party/config.yaml): this identity keeps
# the legitimate viewer attributable as program identity rather than malware.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 5000000

traits:
  - id: famatech-company
    desc: Famatech publisher metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^\s*Famatech,?\s+Inc\.?\s*$'

  - id: radmin-viewer-product
    desc: Radmin Viewer product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^\s*Radmin Viewer\s*$'

  - id: radmin-trademark-text
    desc: Radmin Remote Administrator trademark string
    if:
      type: encoded
      encoding: wide
      section: .rsrc
      substr: Radmin, Remote Administrator

composite_rules:
  - id: radmin-viewer-identity
    desc: Genuine Famatech Radmin Viewer binary
    crit: notable
    conf: 0.99
    all:
      - id: famatech-company
      - id: radmin-viewer-product
