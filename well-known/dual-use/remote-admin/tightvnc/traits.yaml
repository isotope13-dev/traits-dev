# TightVNC Viewer is embedded by PoSh-oVirt as an optional console client.
# Its input, clipboard, screen, and Winsock APIs are real viewer capabilities;
# the signed product identity lets surveillance composites attribute those
# APIs to the remote-control component that provides them.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 5000000

traits:
  - id: viewer-product
    desc: TightVNC Viewer product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: TightVNC

composite_rules:
  - id: tightvnc-viewer-intact-signature
    desc: GlavSoft-signed PE with a valid Authenticode signature
    crit: notable
    all:
      - id: metadata/signed/leaf::glavsoft-ooo
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv

  - id: tightvnc-viewer-verified-identity
    desc: Intact Authenticode-signed TightVNC Viewer identity
    crit: notable
    all:
      - id: viewer-product
      - id: tightvnc-viewer-intact-signature
