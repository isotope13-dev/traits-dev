defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 512
  size_max: 500000000

traits:
  - id: product-name
    desc: TeamViewer PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: TeamViewer

  - id: original-filename
    desc: TeamViewer Windows executable identity
    if:
      type: value
      path: pe.version.original_filename
      exact: tv_w32.exe

  - id: outlook-addin-marker
    desc: TeamViewer Outlook add-in marker
    if:
      type: text
      substr: TeamViewerMeetingAddIn.AddIn
      section: .rdata

composite_rules:
  - id: teamviewer-windows-client
    desc: Verified TeamViewer Windows client
    crit: notable
    conf: 0.99
    all:
      - id: product-name
      - id: original-filename
      - id: metadata/signed/leaf::teamviewer-gmbh

  - id: teamviewer-office-addin-context
    desc: TeamViewer Office add-in context
    crit: exception
    conf: 0.99
    all:
      - id: teamviewer-windows-client
      - id: outlook-addin-marker
