defaults:
  for: [text]
  platforms: [windows]
  crit: component

traits:
  - id: machine-security-config
    desc: TeamViewer machine security setting
    if:
      type: text
      regex: '(?m)^Machine:Security_AutostartMode=[0-9]+\r?$'

  - id: machine-password-config
    desc: TeamViewer password strength setting
    if:
      type: text
      regex: '(?m)^Machine:Security_PasswordStrength=[0-9]+\r?$'

composite_rules:
  - id: portable-config
    desc: TeamViewer portable machine configuration
    crit: notable
    all:
      - id: machine-security-config
      - id: machine-password-config
