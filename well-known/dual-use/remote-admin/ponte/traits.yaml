# Ponte — cross-device daemon and CLI (ponte.sh, @openmono/ponte-*). It runs
# commands on paired nodes (`ponte exec --node <id> -- <command>`) and lets a
# device owner approve or deny remote tool execution per peer. Remote execution
# across a user's own machines is dual-use: the same mesh can be pointed at a
# host the operator does not control.
defaults:
  conf: 0.97
  platforms: [unix, windows]
  for: [macho, elf, pe]
  size_min: 1000000
  size_max: 400000000

traits:
  - id: ponte-exec-usage
    desc: Ponte cross-node exec usage string
    crit: notable
    if:
      type: text
      substr: 'Usage: ponte exec --node <id> -- <command>'

  - id: ponte-direct-proof-protocol
    desc: Ponte direct peer proof protocol token
    crit: notable
    if:
      type: text
      substr: ponte-direct-proof-v1

composite_rules:
  - id: ponte-remote-exec-mesh
    desc: Ponte cross-device remote exec mesh CLI
    crit: notable
    any:
      - id: ponte-exec-usage
      - id: ponte-direct-proof-protocol
