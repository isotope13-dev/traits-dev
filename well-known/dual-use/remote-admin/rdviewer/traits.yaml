defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
traits:
  - id: rdviewer-native-client
    desc: RdViewer native remote administration client
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule rdviewer_native_client {
          strings:
            $project = "RdViewer\\RdViewer\\RdClient\\uCrypto.pas" wide nocase
            $update = "rdviewer.oss-cn-hangzhou.aliyuncs.com/qyupdate/rdclient.exe" wide
            $screen = "RemoteScreenTypes" ascii
          condition:
            pe.is_pe and all of them and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              @project >= pe.sections[s].raw_data_offset and
              @project < pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
              @update >= pe.sections[s].raw_data_offset and
              @update < pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
            )
        }
