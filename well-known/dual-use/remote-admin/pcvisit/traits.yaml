defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 512
  size_max: 500000000

traits:
  - id: product-name
    desc: PCVisit PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: pcvisit

  - id: company-name
    desc: PCVisit Software company metadata
    if:
      type: value
      path: pe.version.company
      exact: pcvisit Software ag

composite_rules:
  - id: pcvisit-windows-client
    desc: PCVisit Windows remote-support client
    crit: notable
    conf: 0.95
    all:
      - id: product-name
      - id: company-name
