# UltraVNC component filename references in batch source.
defaults:
  platforms:
  - windows
  for: [batch]
traits:
- id: ultravnc-ini-filename
  desc: References UltraVNC configuration filename
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: UltraVNC.ini
- id: ultravnc-settings-filename
  desc: References UltraVNC settings helper filename
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: uvnc_settings.exe
- id: ultravnc-hooks-filename
  desc: References UltraVNC hook DLL filename
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: vnchooks.dll
- id: ultravnc-viewer-filename
  desc: References VNC viewer filename
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: vncviewer.exe
composite_rules:
- id: ultravnc-component-filenames
  desc: References UltraVNC component filenames
  crit: notable
  conf: 0.94
  needs: 3
  any:
  - id: ultravnc-ini-filename
  - id: ultravnc-settings-filename
  - id: ultravnc-hooks-filename
  - id: ultravnc-viewer-filename
