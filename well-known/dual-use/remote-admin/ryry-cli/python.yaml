# ryry-cli remote worker identity. The published MAL-2026-10759 advisory
# describes 6.26/6.28; these broad identity matchers do not identify a malicious
# variant. Capabilities remain visible without calling all versions malware.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-package-name
    desc: ryry-cli Python wheel package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: ryry-cli

  - id: dalipen-task-api-domain
    desc: dalipen.com ryry task API domain
    for: [python]
    if:
      type: text
      substr: api.dalipen.com

  - id: get-task-api-endpoint
    desc: ryry getTask API endpoint path
    for: [python]
    if:
      type: text
      substr: aigc/task/getTask

composite_rules:
  - id: ryry-cli-remote-task-worker
    desc: ryry-cli remote widget task worker
    crit: notable
    conf: 0.99
    scope: archive
    for: [whl, python, pkginfo]
    all:
      - id: wheel-package-name
      - id: dalipen-task-api-domain
      - id: get-task-api-endpoint
      - id: metadata/lang/source/naming/interface::python-task-notify-name
      - id: micro-behaviors/process/argument/option::python-widget-process-arguments

  - id: ryry-cli-host-profile-context
    desc: ryry-cli identity with host-profile capabilities
    crit: notable
    conf: 0.99
    scope: archive
    for: [whl, python, pkginfo]
    all:
      - id: wheel-package-name
      - id: dalipen-task-api-domain
      - id: "metadata/lang/source/syntax/key-value::device-id-field-python"
      - id: micro-behaviors/os/sysinfo/hardware::python-hardware-resource-field
      - id: micro-behaviors/communications/http/request/client::request-python
