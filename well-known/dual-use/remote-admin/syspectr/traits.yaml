# O&O Syspectr — a commercial Windows remote-monitoring and management
# service from O&O Software GmbH.  Its Remote Console gives the account holder
# command execution, file browsing and software installation on every enrolled
# machine, which is why distribution crews install it instead of writing an
# implant: the agent is signed by the vendor, its traffic is vendor-hosted TLS,
# and an endpoint suite has no grounds to block it.
#
# These are identity traits, not convictions.  The vendor personalises the
# installer per account and stamps the account identifier into the download
# filename, so the same binary is both a legitimate managed-estate agent and,
# handed to somebody who does not hold the account, a pre-enrolled backdoor.
# The distinction is made by the composites in
# objectives/evasion/masquerade/version-resource/contradiction/ and
# objectives/command-and-control/backdoor/control/rmm/, which read what the
# file on disk is called; the version resource read here only says what it is.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 512
  size_max: 500000000
  crit: notable
  conf: 0.97
  attack: T1219
  mbc: B0030

traits:
  - id: syspectr-product-version-resource
    desc: PE ProductName identifies O&O Syspectr
    if:
      type: value
      path: pe.version.product_name
      exact: "O&O Syspectr"

  - id: syspectr-agent-original-filename
    desc: PE OriginalFilename names an O&O Syspectr image
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^oo-syspectr[a-z0-9-]{0,24}\.exe$'

  - id: syspectr-agent-image-name
    desc: O&O Syspectr agent or installer image name
    # The installed service image is `oo-syspectr-agent.exe` and the download
    # is `oo-syspectr-setup<account-id>.exe`; both are the names a responder
    # hunts for, and both appear in deployment scripts and download pages.
    for: [pe, dll, html, scripts, javascript, batch, powershell]
    if:
      type: text
      regex: '(?i)\boo-syspectr-(agent|setup)[a-z0-9_.-]{0,44}\.exe\b'
