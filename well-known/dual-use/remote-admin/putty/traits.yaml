defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 100000
  size_max: 20000000

traits:
  - id: putty-product-name
    desc: PuTTY suite PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: PuTTY suite

composite_rules:
  - id: putty-suite-client
    desc: PuTTY terminal and SSH client
    crit: notable
    conf: 0.98
    all:
      - id: putty-product-name
      - id: micro-behaviors/os/application/target::putty-product-reference
