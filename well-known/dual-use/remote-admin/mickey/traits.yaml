defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.94

# Mickey shares one keyboard and mouse across PCs and can control or be
# controlled by paired PCs. It is a legitimate open-source product (GPL-3.0),
# so it belongs under dual-use remote-admin, not under an objective.
traits:
  - id: mickey-product-name
    desc: Mickey PE product name
    if:
      type: value
      path: pe.version.product_name
      exact: Mickey

  - id: mickey-original-filename
    desc: Mickey executable original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: mickey.exe

  - id: mickey-crate-source-path
    desc: Mickey Rust crate source path
    if:
      type: text
      substr: 'crates\mickey\src\'

  - id: mickey-release-url
    desc: Mickey GitHub release download URL
    if:
      type: text
      substr: github.com/EduardoMG12/mickey/releases/download

composite_rules:
  - id: mickey-remote-control-identity
    desc: Mickey cross-PC keyboard and mouse sharing product
    conf: 0.95
    needs: 2
    any:
      - id: mickey-product-name
      - id: mickey-original-filename
      - id: mickey-crate-source-path
      - id: mickey-release-url
