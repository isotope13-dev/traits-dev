# Action1 Endpoint Security agent. Legitimate RMM with embedded remote-session
# tooling (TightVNC-derived). PE identity from version resources and .rdata.
# MSI installer identity: metadata/package/files/msi/action1.yaml atoms plus
# the composite in msi.yaml.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 20971520

traits:
  - id: action1-corporation-claim
    desc: Claims Action1 Corporation publisher identity
    if:
      type: value
      path: pe.version.company
      exact: Action1 Corporation

  - id: action1-agent-product-name
    desc: Action1 Endpoint Security product name
    if:
      type: value
      path: pe.version.product_name
      exact: Action1 Endpoint Security

  - id: action1-server-endpoint
    desc: Action1 cloud control endpoint
    if:
      type: text
      exact: server.action1.com
      section: .rdata

  # TightVNC-derived remote helper shipped with Action1 Agent. Explains
  # Riskware.VNC labels and clipboard/hook stealer FPs on this dual-use PE.
  - id: action1-remote-original-filename
    desc: Original filename is action1_remote.exe
    if:
      type: value
      path: pe.version.original_filename
      exact: action1_remote.exe

  - id: action1-remote-internal-name
    desc: Internal name is a1_remote
    if:
      type: value
      path: pe.version.internal_name
      exact: a1_remote

composite_rules:
  - id: action1-agent-identity
    desc: Action1 Endpoint agent identity
    conf: 0.98
    scope: outer
    all:
      - id: action1-corporation-claim
      - id: action1-agent-product-name
      - id: action1-server-endpoint

  - id: action1-remote-identity
    desc: Action1 TightVNC-derived remote helper identity
    conf: 0.98
    scope: outer
    all:
      - id: action1-corporation-claim
      - id: action1-agent-product-name
      - id: action1-remote-original-filename
      - id: action1-remote-internal-name
