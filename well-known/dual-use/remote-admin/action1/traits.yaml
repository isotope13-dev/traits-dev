# Action1 Endpoint Security agent. Legitimate RMM with embedded remote-session
# tooling (TightVNC-derived). PE identity from version resources and .rdata.
# MSI installer identity: metadata/package/files/msi/action1.yaml atoms plus
# the composite in msi.yaml.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 20971520

traits:
  - id: action1-corporation-claim
    desc: Claims Action1 Corporation publisher identity
    if:
      type: value
      path: pe.version.company
      exact: Action1 Corporation

  - id: action1-agent-product-name
    desc: Action1 Endpoint Security product name
    if:
      type: value
      path: pe.version.product_name
      exact: Action1 Endpoint Security

  - id: action1-server-endpoint
    desc: Action1 cloud control endpoint
    if:
      type: text
      exact: server.action1.com
      section: .rdata

composite_rules:
  - id: action1-agent-identity
    desc: Action1 Endpoint agent identity
    conf: 0.98
    scope: outer
    all:
      - id: action1-corporation-claim
      - id: action1-agent-product-name
      - id: action1-server-endpoint
