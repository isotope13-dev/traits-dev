# Action1 Endpoint Security agent. Legitimate RMM with embedded remote-session
# tooling (TightVNC-derived). PE identity from version resources and .rdata.
# MSI installer identity uses vendor SummaryInformation and component atoms
# from the sibling msi.yaml.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 20971520

traits:
  - id: action1-corporation-claim
    desc: Claims Action1 Corporation publisher identity
    if:
      type: value
      path: pe.version.company
      exact: Action1 Corporation

  - id: action1-agent-product-name
    desc: Action1 Endpoint Security product name
    if:
      type: value
      path: pe.version.product_name
      exact: Action1 Endpoint Security

  - id: action1-server-endpoint
    desc: Action1 cloud control endpoint
    if:
      type: text
      exact: server.action1.com
      section: .rdata

  # TightVNC-derived remote helper shipped with Action1 Agent. Explains
  # Riskware.VNC labels and clipboard/hook stealer FPs on this dual-use PE.
  - id: action1-remote-original-filename
    desc: Original filename is action1_remote.exe
    if:
      type: value
      path: pe.version.original_filename
      exact: action1_remote.exe

  - id: action1-remote-internal-name
    desc: Internal name is a1_remote
    if:
      type: value
      path: pe.version.internal_name
      exact: a1_remote

  - id: action1-agent-registry-path
    desc: Action1 Agent registry path
    if:
      type: text
      exact: SOFTWARE\Action1\Agent
      section: .rdata

  # Upstream TightVNC HTML desktop title left in the Action1 fork of tvnserver.
  - id: action1-tightvnc-desktop-title
    desc: TightVNC desktop HTML title string
    if:
      type: text
      substr: TightVNC desktop
      section: .rdata

  # PDB path from Action1's tvnserver fork build (tvnserver-*-a1).
  - id: action1-tvnserver-fork-pdb
    desc: Action1 tvnserver fork PDB path
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\tvnserver-[0-9.]+-a1\\Release\\action1_remote\.pdb$'

composite_rules:
  # A vendor/product VERSIONINFO pair is sufficient benign context for
  # suppressing intent inferences on an Action1 component, but remains an
  # assembly-only exception rather than a weaker public product identity.
  - id: action1-version-resource-context
    desc: Action1 vendor and product version context
    crit: exception
    conf: 0.98
    all:
      - id: action1-corporation-claim
      - id: action1-agent-product-name

  - id: action1-agent-identity
    desc: Action1 Endpoint agent identity
    conf: 0.98
    scope: outer
    all:
      - id: action1-corporation-claim
      - id: action1-agent-product-name
      - id: action1-server-endpoint

  - id: action1-remote-identity
    desc: Action1 TightVNC-derived remote helper identity
    conf: 0.98
    scope: outer
    all:
      - id: action1-corporation-claim
      - id: action1-agent-product-name
      - id: action1-remote-original-filename
      - id: action1-remote-internal-name
      - id: action1-tightvnc-desktop-title
      - id: action1-tvnserver-fork-pdb
