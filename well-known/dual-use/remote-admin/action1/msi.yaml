# Action1 Agent MSI installer identity. These vendor-specific
# SummaryInformation and component markers identify a well-known dual-use RMM
# product rather than generic MSI structure, so their canonical home is here.
defaults:
  platforms: [windows]
  for: [msi]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 500000000

traits:
  - id: action1-msi-creator
    desc: MSI creator is Action1 Corporation
    if:
      type: value
      path: office.creator
      exact: Action1 Corporation

  - id: action1-msi-agent-subject
    desc: MSI subject describes Action1 Agent platform
    if:
      type: value
      path: office.subject
      regex: '(?i)\bAction1 Agent\b.{0,80}\bAction1 Platform\b'

  - id: action1-msi-agent-keywords
    desc: MSI keywords tag Action1 Agent
    if:
      type: value
      path: office.keywords
      exact: Action1,Agent

  # Org-bound Action1 installers ship action1_remote.exe, the vendor's
  # TightVNC-derived remote-session helper, and an A1_PRIVATEKEY enrollment
  # property. MSI analysis does not expose database strings to text matchers,
  # so match their ASCII bytes in the installer database.
  - id: action1-remote-exe-component
    desc: Action1 remote session executable component
    if:
      type: hex
      pattern: "61 63 74 69 6F 6E 31 5F 72 65 6D 6F 74 65 2E 65 78 65"

  - id: action1-enrollment-privatekey-property
    desc: Action1 agent enrollment private-key property
    if:
      type: hex
      pattern: "41 31 5F 50 52 49 56 41 54 45 4B 45 59"

  - id: action1-enrollment-certificate-property
    desc: Action1 agent enrollment certificate property
    if:
      type: hex
      pattern: "41 31 5F 43 45 52 54 49 46 49 43 41 54 45"

  - id: action1-enrollment-customer-id-property
    desc: Action1 agent enrollment customer ID property
    if:
      type: hex
      pattern: "41 31 5F 43 55 53 54 4F 4D 45 52 49 44"

composite_rules:
  - id: action1-msi-agent-identity
    desc: Action1 Agent MSI installer identity
    crit: notable
    conf: 0.98
    all:
      - id: action1-msi-creator
      - id: action1-msi-agent-subject
      - id: action1-msi-agent-keywords

  # Org-provisioned Action1 MSI: remote helper + enrollment key property.
  # Explains VNC riskware labels on otherwise-signed WiX Action1 packages.
  - id: action1-msi-org-bound-agent
    desc: Action1 org-bound remote service agent
    crit: notable
    conf: 0.97
    all:
      - id: action1-msi-agent-identity
      - id: action1-remote-exe-component
      - id: action1-enrollment-privatekey-property
      - id: action1-enrollment-certificate-property
      - id: action1-enrollment-customer-id-property
      - id: metadata/file/encoded::rsa-private-key-header
      - id: micro-behaviors/os/service/source::msi-serviceinstall-table
