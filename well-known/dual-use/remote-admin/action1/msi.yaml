# Action1 Agent MSI installer identity. Atomic SummaryInformation matchers
# live under metadata/package/files/msi/ (Unknown-container for:[all] route);
# this composite supplies the well-known dual-use identity label. for:[all] is
# safe here because the composite has no text/value matcher of its own.
defaults:
  platforms: [windows]
  for: [all]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 500000000

composite_rules:
  - id: action1-msi-agent-identity
    desc: Action1 Agent MSI installer identity
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/files/msi::action1-msi-creator
      - id: metadata/package/files/msi::action1-msi-agent-subject
      - id: metadata/package/files/msi::action1-msi-agent-keywords
