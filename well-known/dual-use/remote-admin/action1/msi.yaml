# Action1 Agent MSI installer identity. Atomic SummaryInformation matchers
# live under metadata/package/files/msi/ (first-class `for: [msi]` route);
# this composite supplies the well-known dual-use identity label. for:[all] is
# safe here because the composite has no text/value matcher of its own.
defaults:
  platforms: [windows]
  for: [msi]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 500000000

composite_rules:
  - id: action1-msi-agent-identity
    desc: Action1 Agent MSI installer identity
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/files/msi::action1-msi-creator
      - id: metadata/package/files/msi::action1-msi-agent-subject
      - id: metadata/package/files/msi::action1-msi-agent-keywords

  # Org-provisioned Action1 MSI: remote helper + enrollment key property.
  # Explains VNC riskware labels on otherwise-signed WiX Action1 packages.
  - id: action1-msi-org-bound-agent
    desc: Action1 org-bound agent MSI with remote helper
    crit: notable
    conf: 0.97
    all:
      - id: action1-msi-agent-identity
      - id: metadata/package/files/msi::action1-remote-exe-component
      - id: metadata/package/files/msi::action1-enrollment-privatekey-property
