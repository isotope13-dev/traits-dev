# N-able N-central remote monitoring and management (RMM) platform.
#
# The remoteControlAction/getPierDetails request is a product-specific control
# surface.  It is useful as context for both legitimate N-central tooling and
# exploit clients, while the objective rules decide whether nearby API and
# account operations make that use hostile.
defaults:
  platforms: [windows, unix, appliance]
  for: [scripts, source, text]
  crit: notable
  conf: 0.94

traits:
  - id: get-pier-details-request
    desc: N-central getPierDetails appliance request
    if:
      type: text
      regex: '(?i)/remoteControlAction\.do\?[^\s"''`]{0,320}\bmethod=getPierDetails\b'

