defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 16777216
traits:
  - id: address-message-pair
    desc: Pulsar address message type pair in metadata
    if:
      type: raw
      # Retained protocol type names in the managed #Strings heap. Neither
      # a GetAddress API nor a bare Clipboard mention identifies this schema.
      regex: '(?s)DoSendAddress\x00.{0,512}DoGetAddress\x00'
      section: .text
  - id: clipboard-command-namespace
    desc: Pulsar clipboard command namespace
    if:
      type: text
      exact: Pulsar.Common.Messages.Monitoring.Clipboard
      section: .text
  - id: common-resource-name
    desc: Costura resource embeds Pulsar.Common assembly
    if:
      type: text
      substr: costura.pulsar.common.dll.compressed
      section: .text
  - id: networking-namespace
    desc: Pulsar.Common networking namespace reference
    if:
      type: text
      exact: Pulsar.Common.Networking
      section: .text
  - id: remote-shell-namespace
    desc: Pulsar remote-shell message namespace reference
    if:
      type: text
      exact: Pulsar.Common.Messages.Administration.RemoteShell
      section: .text
composite_rules:
  - id: pulsar-client
    desc: Pulsar client embeds its common assembly and command namespaces
    all:
      - id: common-resource-name
      - id: networking-namespace
      - id: remote-shell-namespace
