defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 4194304
traits:
  - id: wrapper-library-description
    desc: RDP Wrapper library version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Terminal Services Wrapper Library
  - id: rdp-host-product-name
    desc: RDP Host Support version product name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: RDP Host Support
composite_rules:
  - id: rdp-wrapper-library
    desc: RDP Wrapper Terminal Services support library
    crit: notable
    conf: 0.99
    all:
      - id: wrapper-library-description
      - id: rdp-host-product-name
