# malinakod — MalinaKod Studio client TUI/agent. Dual-use remote-admin:
# GitHub control-plane sync, HMAC-gated /exec, and user systemd units.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: malinakod PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: malinakod

  - id: wheel-distribution
    desc: malinakod wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: malinakod

  - id: wheel-author
    desc: MalinaKod Studio wheel author
    for: [whl]
    if:
      type: value
      path: whl.author
      exact: MalinaKod Studio

  - id: agent-product-name
    desc: MalinaKod Agent product name
    for: [python]
    if:
      type: text
      substr: 'MalinaKod Agent'

  - id: hmac-timestamp-header
    desc: X-Malina-Timestamp HMAC header name
    for: [python]
    if:
      type: text
      substr: X-Malina-Timestamp

  - id: hmac-signature-header
    desc: X-Malina-Signature HMAC header name
    for: [python]
    if:
      type: text
      substr: X-Malina-Signature

  - id: mlnk-license-prefix
    desc: MalinaKod MLNK license prefix
    for: [python]
    if:
      type: text
      substr: 'MLNK-'

  - id: license-secret-env
    desc: MALINAKOD_LICENSE_SECRET env variable name
    for: [python]
    if:
      type: text
      substr: MALINAKOD_LICENSE_SECRET

  - id: agent-unit-name
    desc: malinakod-agent systemd unit name
    for: [python]
    if:
      type: text
      substr: malinakod-agent.service

  - id: watchdog-unit-name
    desc: malinakod-watchdog systemd unit name
    for: [python]
    if:
      type: text
      substr: malinakod-watchdog.service

  - id: github-releases-repo
    desc: Medenchi Malinacode-releases GitHub repository
    if:
      type: text
      substr: Medenchi/Malinacode-releases

composite_rules:
  - id: malinakod-identity
    desc: Recognized MalinaKod remote-admin client
    needs: 2
    any:
      - id: pkginfo-name
      - id: wheel-distribution
      - id: wheel-author
      - id: agent-product-name
      - id: hmac-timestamp-header
      - id: hmac-signature-header
      - id: mlnk-license-prefix
      - id: license-secret-env
      - id: agent-unit-name
      - id: watchdog-unit-name
      - id: github-releases-repo
