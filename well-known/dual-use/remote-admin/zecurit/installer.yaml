# Zecurit is a commercial endpoint-management and remote-support platform.  Its
# agent installer is an Inno Setup wrapper around a signed MSI that ships the
# agent services, screen and device-control helpers and an enrollment token for
# one tenant.  The identity is the product's own service binary and its
# publisher signature; the file name an installer is distributed under is not
# evidence either way.
defaults:
  platforms: [windows]
  for: [msi, cab, 7z, pe]
  size_min: 1000000
  size_max: 200000000

traits:
  - id: zecurit-agent-service-member
    desc: Archive member is the Zecurit agent service
    for: [cab, 7z]
    crit: notable
    conf: 0.95
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(^|/)ZecuritAgentService\.exe$'

composite_rules:
  - id: zecurit-agent-installer
    desc: Zecurit endpoint-management agent installer
    crit: notable
    conf: 0.95
    scope: outer
    any:
      - id: zecurit-agent-service-member
      - id: metadata/signed/leaf::zecurit-technologies-private-limited
