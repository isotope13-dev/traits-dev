# Ninite Agent, the remote software-deployment agent sold as Ninite Pro.
# Once installed it runs as a service and takes install/update orders from the
# Ninite account whose key the installer was built with, so its identity is a
# dual-use remote-administration identity rather than an installer structure.
#
# Which account it answers to is decided at download time: Ninite stamps the
# account key into a fixed-width slot carried in the installer's Authenticode
# certificate bag, so one signature covers every personalized copy. The slot
# marker below is that mechanism; on an un-personalized build it still holds
# the placeholder run.
defaults:
  platforms: [windows]
  attack: T1219
  size_min: 512
  size_max: 500000000
  for: [pe, dll]

traits:
  - id: ninite-agent-product-name
    desc: PE ProductName identifies Ninite
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Ninite

  - id: ninite-agent-company-name
    desc: PE CompanyName is Ninite's publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Secure By Design Inc.

  # The delimiter Ninite writes around the account key. In the MSI custom
  # action DLL it is the read-only literal the code searches its own container
  # for; in the personalized installer it brackets the account identifier
  # itself. Either way it is Ninite's wording, not a generic marker.
  - id: ninite-installer-account-key-marker
    desc: Ninite installer account-key slot marker
    crit: notable
    conf: 0.97
    if:
      type: text
      section: rdata
      substr: '>>key_begin|'
