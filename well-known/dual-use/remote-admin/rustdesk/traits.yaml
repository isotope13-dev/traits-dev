defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.94

traits:
  - id: rustdesk-source-tree
    desc: RustDesk source-tree path
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [cargo.toml, rust, shell, python, github-actions]
    if:
      type: path
      regex: 'github\.com[\\/]rustdesk[\\/]rustdesk@'

  - id: rustdesk-product-name
    desc: RustDesk PE product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: RustDesk

  - id: rustdesk-original-filename
    desc: RustDesk Windows executable identity
    if:
      type: value
      path: pe.version.original_filename
      exact: rustdesk.exe

  - id: rustdesk-app-name
    desc: RustDesk app name string
    if:
      type: text
      exact: RustDesk
      section: rdata
  - id: rustdesk-core-dll
    desc: RustDesk core DLL reference
    if:
      type: text
      substr: librustdesk.dll
      section: rdata
  - id: rustdesk-core-entrypoint
    desc: RustDesk core entrypoint string
    if:
      type: text
      exact: rustdesk_core_main_args
      section: rdata
  - id: rustdesk-app-name-export
    desc: RustDesk app-name export string
    if:
      type: text
      exact: get_rustdesk_app_name
      section: rdata
  - id: linux-share-path
    desc: RustDesk Linux share path
    platforms: [linux]
    for: [elf, so, systemd, shell]
    if:
      type: path
      regex: '.{0,120}usr[\\/]share[\\/]rustdesk.{0,120}'
  - id: linux-etc-path
    desc: RustDesk Linux etc path
    platforms: [linux]
    for: [elf, so, systemd, shell]
    if:
      type: path
      regex: '.{0,120}etc[\\/]rustdesk.{0,120}'
  - id: linux-desktop-path
    desc: RustDesk desktop file path
    platforms: [linux]
    for: [elf, so, systemd, shell]
    if:
      type: path
      regex: '.{0,120}applications[\\/]rustdesk.{0,120}'
  - id: linux-service-path
    desc: RustDesk service file path
    platforms: [linux]
    for: [systemd]
    if:
      type: path
      basename: true
      exact: rustdesk.service
  - id: linux-service-binary
    desc: RustDesk Linux service binary
    platforms: [linux]
    for: [elf, so, shell, javascript, data, systemd]
    if:
      type: text
      exact: /usr/bin/rustdesk --service
  - id: android-libname
    desc: RustDesk Android native library basename
    platforms: [android]
    for: [elf, so]
    if:
      type: path
      basename: true
      exact: librustdesk.so
  - id: android-core-symbol
    desc: RustDesk core entrypoint symbol
    platforms: [android]
    for: [elf, so]
    if:
      type: symbol
      exact: rustdesk_core_main

composite_rules:
  - id: rustdesk-windows-runner-markers
    desc: RustDesk Windows runner markers
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: rustdesk-product-name
      - id: rustdesk-original-filename
      - id: rustdesk-app-name
      - id: rustdesk-core-dll
      - id: rustdesk-core-entrypoint
      - id: rustdesk-app-name-export
  - id: rustdesk-windows-client
    desc: Verified RustDesk Windows client
    crit: notable
    conf: 0.99
    all:
      - id: rustdesk-product-name
      - id: rustdesk-original-filename
      - id: metadata/signed/leaf::purslane
  - id: rustdesk-linux-package
    desc: RustDesk Linux package markers
    crit: notable
    conf: 0.98
    any:
      - id: linux-share-path
      - id: linux-etc-path
      - id: linux-desktop-path
      - id: linux-service-path
      - id: linux-service-binary
  - id: rustdesk-android-package
    desc: RustDesk Android package markers
    crit: notable
    conf: 0.98
    platforms: [android, linux]
    for: [elf, so, zip, ipa]
    needs: 2
    any:
      - id: android-libname
      - id: android-core-symbol
