# Third-party remote-monitoring-and-management / remote-support agents, matched
# by the installer or agent executable name as it appears inside a deployment
# script.
#
# These are legitimate commercial products. What makes the name worth carrying
# as its own identity trait is that post-exploitation crews install them
# instead of writing an implant: the agent is signed, its traffic is
# vendor-hosted TLS, and the endpoint suite treats it as approved software.
# After an RMM-platform compromise the operator typically layers several
# different vendors on one host so that removing one leaves the others intact
# — a shape an administrator never produces, because a managed estate
# standardises on a single product.
#
# Scope: script-facing references only. The products that also have
# binary-level identities keep them where they already live
# (well-known/dual-use/remote-admin/anydesk, .../rustdesk, well-known/dual-use/
# screenconnect, .../simplehelp, .../netsupport, .../dwagent); this file does
# not restate those matchers, it adds the deployment-script view they lack.
# The vendor-stacking and unattended-provisioning inferences live in
# objectives/command-and-control/backdoor/control/rmm/unattended.yaml, which
# reaches this directory as a whole.
#
# Every pattern requires a coined product name immediately followed by an
# executable/installer extension, so an ordinary English word or an unrelated
# identifier cannot carry one of these on its own.
defaults:
  platforms: [windows]
  for: [scripts, source, data, text]
  crit: notable
  conf: 0.9
  attack: T1219

traits:
  - id: breeze-rmm-msi-subject
    desc: Breeze RMM agent MSI identity
    for: [msi]
    conf: 0.99
    if:
      type: value
      path: office.subject
      exact: Breeze RMM endpoint agent

  - id: anydesk-installer-name
    desc: AnyDesk agent or installer filename
    if:
      type: text
      regex: '(?i)\bAnyDesk[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: chrome-remote-desktop-host-name
    desc: Chrome Remote Desktop host executable filename
    if:
      type: text
      regex: '(?i)\bremoting[_-]start[_-]host\.exe\b'

  - id: chrome-remote-desktop-product-name
    desc: Chrome Remote Desktop product reference
    if:
      type: text
      regex: '(?i)\b(Chrome|Google) Remote Desktop\b'

  - id: teamviewer-installer-name
    desc: TeamViewer agent or installer filename
    if:
      type: text
      regex: '(?i)\bTeamViewer[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: rustdesk-installer-name
    desc: RustDesk agent or installer filename
    if:
      type: text
      regex: '(?i)\brustdesk[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: hoptodesk-installer-name
    desc: HopToDesk agent or installer filename
    if:
      type: text
      regex: '(?i)\bHopToDesk[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: tacticalrmm-agent-binary-name
    desc: TacticalRMM agent executable filename
    # Release assets are named `tacticalagent-v<ver>-windows-amd64.exe`; the
    # installed service image is `tacticalrmm.exe` / `rmmagent.exe`.
    if:
      type: text
      regex: '(?i)\b(tacticalagent|rmmagent)[A-Za-z0-9_.-]{0,32}\.(exe|msi)\b'

  - id: tacticalrmm-product-name
    desc: TacticalRMM product name
    # The server-side bootstrap (install_server.ps1) names the product rather
    # than a binary, so the bare coined word is carried separately.
    if:
      type: text
      word: tacticalrmm
      case_insensitive: true

  - id: meshcentral-agent-name
    desc: MeshCentral agent filename
    # MeshAgent is the remote-control component TacticalRMM and several hosted
    # panels ship, and is deployed standalone by operators as well.
    if:
      type: text
      regex: '(?i)\bmeshagent[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: splashtop-agent-name
    desc: Splashtop agent or installer filename
    if:
      type: text
      regex: '(?i)\bSplashtop[A-Za-z0-9_.-]{0,32}\.(exe|msi)\b'

  - id: atera-agent-name
    desc: Atera agent or installer filename
    if:
      type: text
      regex: '(?i)\bAtera[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: action1-agent-name
    desc: Action1 agent or installer filename
    if:
      type: text
      regex: '(?i)\baction1[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: pulseway-agent-name
    desc: Pulseway agent or installer filename
    if:
      type: text
      regex: '(?i)\bPulseway[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: syncro-agent-name
    desc: Syncro agent or installer filename
    if:
      type: text
      regex: '(?i)\bSyncro(Setup|Service)[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: logmein-agent-name
    desc: LogMeIn or GoToAssist agent filename
    if:
      type: text
      regex: '(?i)\b(LogMeIn|GoToAssist)[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: gotoresolve-agent-name
    desc: GoTo Resolve agent or installer filename
    if:
      type: text
      regex: '(?i)\bGoToResolve[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: supremo-ammyy-agent-name
    desc: Supremo or Ammyy remote-support filename
    if:
      type: text
      regex: '(?i)\b(Supremo|Ammyy)[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'

  - id: getscreen-remoteutilities-agent-name
    desc: GetScreen or RemoteUtilities filename
    if:
      type: text
      regex: '(?i)\b(GetScreen|RemoteUtilities)[A-Za-z0-9_.-]{0,24}\.(exe|msi)\b'
