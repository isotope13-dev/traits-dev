defaults:
  platforms: [windows]
  for: [vbs]


composite_rules:
  - id: hidden-wsh-powershell-agent-reference-clues
    crit: notable
    desc: Hidden WSH PowerShell and remote-admin agent references
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/hidden::wsh-hidden-run-powershell-syntax
    any:
      - id: well-known/dual-use/remote-admin/rmm::logmein-agent-name
      - id: well-known/dual-use/remote-admin/rmm::gotoresolve-agent-name
