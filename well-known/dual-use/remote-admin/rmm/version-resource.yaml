# Remote-administration products identified from the PE version resource.
#
# The sibling traits.yaml reads the agent's filename as it appears inside a
# deployment script.  This file reads the other end — the VS_VERSIONINFO block
# compiled into the binary — because that is the one identity a redistributor
# cannot rewrite without breaking the vendor's signature.  It is also what a
# responder reads off the Details tab when an unexplained agent turns up: the
# file on disk may be called anything, the resource still names the product.
#
# Products that already own a version-resource identity keep it in their own
# directory (well-known/dual-use/remote-admin/teamviewer, .../syspectr); this
# matcher covers the remainder of the family as one fact.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 512
  size_max: 500000000
  crit: notable
  conf: 0.95
  attack: T1219
  mbc: B0030

traits:
  - id: rmm-product-version-resource
    desc: PE ProductName names a remote-admin agent
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\b(AnyDesk|Splashtop|ScreenConnect|Atera|Pulseway|NetSupport)\b'
