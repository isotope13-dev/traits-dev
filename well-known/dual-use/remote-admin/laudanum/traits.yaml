defaults:
  platforms: [linux, macos, windows]
  for: [php, asp]
  crit: notable
  conf: 0.98
traits:
  - id: php-shell-title
    desc: Laudanum PHP shell page title
    for: [php]
    if:
      type: text
      substr: '<title>Laudanum PHP Shell Access</title>'
  - id: asp-shell-title
    desc: Laudanum ASP shell page title
    platforms: [windows]
    for: [asp]
    if:
      type: text
      substr: '<title>Laundanum ASP Shell</title>'
  - id: project-banner
    desc: Laudanum pentest-tool project banner
    conf: 0.98
    if:
      type: text
      substr: Laudanum Project

  - id: contact-reference
    desc: Laudanum project website reference
    conf: 0.98
    if:
      type: text
      substr: laudanum.secureideas.net

composite_rules:
  - id: php-command-shell-payload
    desc: Laudanum PHP request-command shell payload
    for: [php]
    crit: hostile
    attack: T1505.003
    mbc: B0030
    all:
      - id: php-shell-title
      - id: objectives/command-and-control/backdoor/webshell/exec::php-variable-command-webshell
  - id: asp-command-shell-payload
    desc: Laudanum ASP request-command shell payload
    platforms: [windows]
    for: [asp]
    crit: hostile
    attack: T1505.003
    mbc: B0030
    all:
      - id: asp-shell-title
      - id: objectives/command-and-control/backdoor/webshell/request/command::classic-asp-variable-command-webshell
