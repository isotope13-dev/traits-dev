defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 16777216
traits:
  - id: quasar-client-resource-namespace
    desc: Quasar client managed resource namespace
    if:
      type: text
      section: .text
      exact: Quasar.Client.Properties.Resources.resources
  - id: quasar-message-namespace
    desc: Quasar managed command-message namespace
    if:
      type: text
      section: .text
      exact: Quasar.Common.Messages
composite_rules:
  - id: quasar-client
    desc: Quasar remote-administration client implementation
    all:
      - id: quasar-client-resource-namespace
      - id: quasar-message-namespace
    # Product identity alone does not prove unauthorized deployment.
