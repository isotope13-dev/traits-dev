# LogMeIn Resolve (formerly GoTo Resolve) -- GoTo's remote-monitoring and
# support platform. Its "Unattended" package is the always-on variant: the agent
# installs as a service and accepts an incoming session with nobody at the
# keyboard, which is what makes it a product an analyst needs named rather than
# merely allowed. Post-exploitation crews reach for exactly these packages
# instead of writing an implant, because the binary is vendor-signed and the
# traffic is vendor-hosted TLS.
#
# Read from the installer database's own summary stream, so the identity holds
# however the file was named when it arrived.
defaults:
  platforms: [windows]
  for: [msi, oledoc]
  crit: notable
  conf: 0.98
  attack: T1219

traits:
  - id: resolve-summary-description
    desc: MSI summary names LogMeIn/GoTo Resolve
    if:
      type: value
      path: office.description
      regex: '(?i)^(LogMeIn|GoTo) Resolve\b'

  - id: logmein-msi-creator
    desc: MSI creator names LogMeIn
    if:
      type: value
      path: office.creator
      regex: '(?i)^LogMeIn,? Inc'

composite_rules:
  - id: logmein-resolve-installer
    desc: LogMeIn Resolve agent installer identity
    crit: notable
    conf: 0.99
    all:
      - id: resolve-summary-description
      - id: logmein-msi-creator
