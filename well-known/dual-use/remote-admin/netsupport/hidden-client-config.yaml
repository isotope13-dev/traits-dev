defaults:
  for: [text, scripts, source]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: client32-ini-basename
    desc: NetSupport client configuration filename
    for: [text]
    if:
      type: path
      basename: true
      exact: client32.ini
      case_insensitive: true
  - id: netsupport-client-section
    desc: NetSupport client INI section header
    crit: component
    if:
      type: text
      regex: '(?im)^\[Client\][ \t]*\r?$'
  - id: client-silent-enabled
    desc: Remote client silent mode enabled
    if:
      type: text
      regex: '(?im)^silent[ \t]*=[ \t]*1[ \t]*\r?$'
  - id: client-tray-disabled
    desc: Remote client tray icon disabled
    if:
      type: text
      regex: '(?im)^SysTray[ \t]*=[ \t]*0[ \t]*\r?$'
  - id: client-hide-idle-enabled
    desc: Remote client hides while idle
    if:
      type: text
      regex: '(?im)^HideWhenIdle[ \t]*=[ \t]*1[ \t]*\r?$'
  - id: client-disconnect-disabled
    desc: Remote client disconnect disabled
    if:
      type: text
      regex: '(?im)^DisableDisconnect[ \t]*=[ \t]*1[ \t]*\r?$'
  - id: client-chat-disabled
    desc: Remote client operator chat disabled
    if:
      type: text
      regex: '(?im)^DisableChat[ \t]*=[ \t]*1[ \t]*\r?$'
  - id: client-message-disabled
    desc: Remote client user messaging disabled
    if:
      type: text
      regex: '(?im)^DisableMessage[ \t]*=[ \t]*1[ \t]*\r?$'
  - id: client-wildcard-operators
    desc: Remote client allows wildcard operators
    if:
      type: text
      regex: '(?im)^Usernames[ \t]*=[ \t]*\*[ \t]*\r?$'
  - id: client-wildcard-tcp-addresses
    desc: Remote client accepts wildcard TCP addresses
    if:
      type: text
      regex: '(?im)^ValidAddresses\.TCP[ \t]*=[ \t]*\*[ \t]*\r?$'
  - id: client-gateway-configured
    desc: Remote client gateway configured
    if:
      type: text
      regex: '(?im)^GatewayAddress[ \t]*=[ \t]*[^\r\n \t;]{3,255}'

composite_rules:
  - id: netsupport-client-identity
    desc: NetSupport client filename or INI section
    crit: component
    conf: 0.92
    any:
      - id: client32-ini-basename
      - id: netsupport-client-section

  - id: hidden-nondisconnectable-client-config
    desc: Hidden NetSupport client restricts disconnects
    crit: hostile
    conf: 0.98
    attack: T1219,T1564.003
    all:
      - id: netsupport-client-identity
      - id: client-silent-enabled
      - id: client-tray-disabled
      - id: client-disconnect-disabled
    any:
      - id: client-hide-idle-enabled
      - id: client-chat-disabled
      - id: client-message-disabled
      - id: client-gateway-configured

  - id: wildcard-operator-hidden-client-config
    desc: Hidden NetSupport client grants wildcard access
    crit: hostile
    conf: 0.99
    attack: T1219,T1564.003
    all:
      - id: hidden-nondisconnectable-client-config
      - id: client-wildcard-operators
      - id: client-wildcard-tcp-addresses
