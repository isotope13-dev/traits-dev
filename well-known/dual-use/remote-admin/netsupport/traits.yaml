defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: client32-config-name
    desc: NetSupport client32 config filename
    crit: notable
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)client32\.ini$'
  - id: nsm-config-name
    desc: NetSupport Manager config filename
    crit: notable
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)NSM\.ini$'
  - id: pcicl32-dll-name
    desc: NetSupport PCICL32 DLL filename
    crit: notable
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)PCICL32\.DLL$'
  - id: remcmdstub-exe-name
    desc: NetSupport remote command stub
    crit: notable
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)remcmdstub\.exe$'
  - id: audiocapture-dll-name
    desc: NetSupport audio capture DLL
    crit: notable
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)AudioCapture\.dll$'
  - id: netsupport-manager-string
    desc: NetSupport Manager product metadata
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: value
      path: pe.version.product_name
      exact: NetSupport Manager
  - id: netsupport-client-application-string
    desc: NetSupport Client Application description
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: value
      path: pe.version.description
      exact: NetSupport Client Application
  - id: netsupport-remote-control-string
    desc: NetSupport Remote Control version string
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: text
      section: .rsrc
      substr: NetSupport Remote Control
  - id: pcicl32-import
    desc: NetSupport client launcher import
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: import
      exact: _NSMClient32@8
  - id: msi-client32-config-stage
    desc: MSI stages NetSupport client config
    crit: notable
    for: [oledoc]
    size_min: 100000
    size_max: 50000000
    if:
      type: raw
      regex: '(?i)\\client32\.ini[\s\S]{0,180}(MoveFile|CopyFile)'

  # Stealth-posture configuration. A remote-administration client that points
  # its gateway at cleartext HTTP, or that switches off every surface the user
  # could notice the session through, has been configured as a RAT: the
  # post-DEF CON Google Doc / DocSend deployment paired both with Edge
  # WebView-lookalike gateway names on port 443.
  - id: cleartext-gateway-transport
    desc: NetSupport gateway transport set to HTTP
    crit: suspicious
    conf: 0.93
    for: [scripts, binaries]
    size_min: 64
    size_max: 50000000
    if:
      type: text
      regex: '(?i)GatewayTransport\s*=\s*HTTP\b'
  - id: silent-presence-config
    desc: Remote client config hides its session
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    size_min: 64
    size_max: 50000000
    if:
      type: text
      regex: '(?i)(ShowTrayIcon\s*=\s*0|SilentMode\s*=\s*1|HideWhenIdle\s*=\s*1)'
composite_rules:
  - id: stealth-gateway-client-config
    desc: Hidden remote client configured over cleartext gateways
    crit: suspicious
    conf: 0.95
    all:
      - id: silent-presence-config
      - id: cleartext-gateway-transport

  - id: netsupport-client-archive-layout
    desc: NetSupport client archive layout
    crit: notable
    conf: 0.95
    for: [archive]
    size_min: 100000
    size_max: 50000000
    all:
      - id: client32-config-name
      - id: nsm-config-name
    any:
      - id: pcicl32-dll-name
      - id: remcmdstub-exe-name
      - id: audiocapture-dll-name
    needs: 2
  - id: netsupport-client-binary
    desc: NetSupport client launcher identity
    crit: notable
    conf: 0.95
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    all:
      - id: netsupport-manager-string
      - id: netsupport-client-application-string
      - id: pcicl32-import
  - id: netsupport-client-embedded-bundle
    desc: PE embeds a NetSupport remote-control client bundle
    crit: notable
    conf: 0.99
    for: [pe]
    size_min: 100000
    size_max: 50000000
    all:
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-client32-config
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-nsm-config
    any:
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-pcicl32-dll
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-remcmdstub-exe
