defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: client32-config-name
    desc: NetSupport client32 config filename
    crit: component
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)client32\.ini$'
  - id: nsm-config-name
    desc: NetSupport Manager config filename
    crit: component
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)NSM\.ini$'
  - id: pcicl32-dll-name
    desc: NetSupport PCICL32 DLL filename
    crit: component
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)PCICL32\.DLL$'
  - id: remcmdstub-exe-name
    desc: NetSupport remote command stub
    crit: component
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)remcmdstub\.exe$'
  - id: audiocapture-dll-name
    desc: NetSupport audio capture DLL
    crit: component
    for: [archive]
    size_min: 100000
    size_max: 50000000
    if:
      type: path
      regex: '(^|/)AudioCapture\.dll$'
  - id: netsupport-manager-string
    desc: NetSupport Manager product metadata
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: value
      path: pe.version.product_name
      exact: NetSupport Manager
  - id: netsupport-client-application-string
    desc: NetSupport Client Application description
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: value
      path: pe.version.description
      exact: NetSupport Client Application
  - id: netsupport-remote-control-string
    desc: NetSupport Remote Control version string
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: text
      section: .rsrc
      substr: NetSupport Remote Control
  - id: pcicl32-import
    desc: NetSupport client launcher import
    crit: notable
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    if:
      type: import
      exact: _NSMClient32@8
  - id: msi-client32-config-stage
    desc: MSI stages NetSupport client config
    crit: notable
    for: [oledoc]
    size_min: 100000
    size_max: 50000000
    if:
      type: raw
      regex: '(?i)\\client32\.ini[\s\S]{0,180}(MoveFile|CopyFile)'
composite_rules:
  - id: netsupport-client-archive-layout
    desc: NetSupport client archive layout
    crit: notable
    conf: 0.95
    for: [archive]
    size_min: 100000
    size_max: 50000000
    all:
      - id: client32-config-name
      - id: nsm-config-name
    any:
      - id: pcicl32-dll-name
      - id: remcmdstub-exe-name
      - id: audiocapture-dll-name
    needs: 2
  - id: netsupport-client-binary
    desc: NetSupport client launcher identity
    crit: notable
    conf: 0.95
    for: [pe, dll]
    size_min: 10000
    size_max: 10000000
    all:
      - id: netsupport-manager-string
      - id: netsupport-client-application-string
      - id: pcicl32-import
  - id: netsupport-client-embedded-bundle
    desc: PE embeds a NetSupport remote-control client bundle
    crit: notable
    conf: 0.99
    for: [pe]
    size_min: 100000
    size_max: 50000000
    all:
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-client32-config
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-nsm-config
    any:
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-pcicl32-dll
      - id: micro-behaviors/data/embedded/payload/installer::netsupport-remcmdstub-exe
