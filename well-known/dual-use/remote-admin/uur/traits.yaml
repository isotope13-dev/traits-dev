# uur is an open-source native Linux companion and compatibility runtime for
# the official NetEase UU Remote (GameViewer) remote desktop client. It
# provisions a managed Wine prefix, proxies capture and input through native
# Linux PipeWire and uinput, and provides stub Windows helper binaries
# (such as winlogon.exe to satisfy session presence checks).
defaults:
  platforms: [linux, windows]
  for: [cargo.toml, rust, shell, c, markdown, tar, binaries, text]
  crit: notable
  conf: 0.98
  size_max: 50000000

traits:
  - id: repository-url
    desc: uur source repository URL
    for: [cargo.toml, markdown, text, rust]
    if:
      type: text
      substr: github.com/panxuc/uur

  - id: cargo-package-name
    desc: uur Cargo package manifest
    for: [cargo.toml]
    if:
      type: text
      regex: 'name\s*=\s*"uur"'

  - id: source-tree-path
    desc: uur source-tree path
    for: [c, rust, shell, markdown, cargo.toml]
    if:
      type: path
      regex: 'uur-[0-9][^/]*/'

  - id: hook-binary-name
    desc: uur hook DLL or proxy component name
    for: [shell, c, rust, pe]
    size_max: 50000000
    if:
      type: text
      regex: 'uur-(hook\.dll|terminal-proxy|mux-proxy|launch-proxy)'

composite_rules:
  - id: uur-package-context
    desc: Recognized uur NetEase UU Remote companion package context
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: repository-url
      - id: cargo-package-name
      - id: source-tree-path
      - id: hook-binary-name
