# NSPack (North Star) i386 packer. The entry stub installs an SEH frame, then
# faults through a null write so the handler can run an aPLib-decoded LZMA
# decompressor into an empty writable-executable .nsp0. Legitimate installers
# and malware both ship this stub, so the packer identity stays notable.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 4096
  size_max: 104857600

traits:
  - id: nspack-i386-entry-stub
    desc: NSPack i386 SEH unpacker at entry
    arch: [x86]
    if:
      type: yara
      source: |
        import "pe"
        rule nspack_i386_entry_stub {
          strings:
            // call $+5; add dword [esp], 0x1c; push dword fs:[0]; mov fs:[0], esp; xor eax, eax; mov [eax], ecx
            $stub = { E8 00 00 00 00 83 04 24 1C 64 FF 35 00 00 00 00 64 89 25 00 00 00 00 33 C0 89 08 }
          condition:
            pe.machine == pe.MACHINE_I386 and $stub at pe.entry_point
        }

  - id: empty-rwx-nsp0
    desc: Empty writable-executable NSPack nsp0
    if:
      type: section
      exact: ".nsp0"
      writable: true
      executable: true
      length_max: 1
