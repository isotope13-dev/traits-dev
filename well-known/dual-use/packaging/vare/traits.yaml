# Vare — a public Python source obfuscator, filed beside PyArmor for the same
# reason: it is a real tool whose abuse-relevant function is making Python
# unreadable, so analysts want the identity named rather than inferred.
#
# Its output has a stamp. Every obfuscated module opens with
# `__VareObfuscator__ = ''`, followed by hundreds of kilobytes of dead
# scaffolding -- functions whose bodies are unreachable branches
# (`if 5212869 == 1641006:`) over random numeric identifiers -- with the real
# payload on a single line near the end.
#
# Notable, not hostile: obfuscating your own code is not an attack, and the
# marker says nothing about what the payload does. It is the identity half. The
# loader composites in objectives/anti-static/obfuscation/payload/loader/
# describe the behaviour, and are what convict.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: vare-obfuscator-banner
    desc: Vare obfuscator output marker
    attack: T1027
    if:
      type: text
      substr: "__VareObfuscator__"
