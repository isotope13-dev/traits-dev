defaults:
  size_min: 512
  platforms: [windows]
  for: [pe]
composite_rules:
  # The name also occurs in file-identification catalogs. Require independent
  # packer output before using it as identity or as a packer exclusion.
  - id: pecompact-packer
    desc: Packed with PECompact
    crit: notable
    conf: 1.0
    all:
      - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
    any:
      - id: micro-behaviors/os/application/target/utility::pecompact-name-reference
      - id: well-known/dual-use/packaging/pecompact::pec2-stub-marker
