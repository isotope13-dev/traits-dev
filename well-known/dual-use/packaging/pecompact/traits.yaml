defaults:
  size_min: 512
  platforms:
    - windows
  for:
    - pe
traits:
  - id: pecompact-signature
    desc: PECompact packer banner
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: PECompac
      section: any
  - id: pecompact-seh-trick
    desc: PECompact SEH unpacking stub
    crit: notable
    conf: 0.95
    if:
      type: hex
      # The stub sits at the start of the first section, whatever builds name
      # it (`.text`, `CODE`, blank), so the file-offset window replaces a
      # section filter that missed every renamed variant.
      offset_range: [0, 4096]
      pattern: 50 64 FF 35 00 00 00 00 64 89 25 00 00 00 00 33 C0 89 08
  - id: pec2-stub-marker
    desc: PECompact2 stub marker
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 50 45 43 32 00
      offset_range: [0, 4096]
  - id: pec2no-header-marker
    desc: PECompact PEC2NO header marker
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: 50 45 43 32 4E 4F
      offset_range: [0, 4096]
  - id: pec2to-header-marker
    desc: PECompact PEC2TO header marker
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 50 45 43 32 54 4F
      offset_range: [0, 4096]
