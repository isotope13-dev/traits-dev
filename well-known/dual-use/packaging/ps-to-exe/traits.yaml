defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.98
  size_min: 512
traits:
  - id: negated-converter-vocabulary
    desc: PowerShell-to-EXE negated runtime vocabulary
    if:
      type: yara
      source: |
        rule ps_to_exe_vocabulary {
          strings:
            // Arithmetic negation modulo 256, distinct from bitwise NOT.
            $path = { 90 CE 9B 97 92 9D 9A 97 94 9B 90 9F 8C 98 }
            $count = { 90 CE 9B 97 92 9D 9A 97 94 9B 9D 91 8B 92 8C }
            $powershell = { 90 91 89 9B 8E 8D 98 9B 94 94 }
          condition:
            all of them
        }
