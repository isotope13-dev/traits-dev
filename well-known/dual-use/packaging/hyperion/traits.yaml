# Hyperion (billythegoat356/Hyperion) -- a public Python obfuscator. Its output
# drove the W4SP-stealer PyPI typosquats (pyquest, ultrarequests) and their npm
# repackagings, which is why analysts want the identity called out.
#
# The output opens with a fixed dunder header:
#
#   __obfuscator__ = 'Hyperion'
#   __authors__ = ('billythegoat356', 'BlueRed')
#
# Both are anchored at line start as assignments. A deobfuscator or scanner
# that tests for the header holds it inside a string literal, so it does not
# match. The header can be deleted; the obfuscated body is left to the
# concealment rules in objectives/anti-static.
defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
- id: output-header
  desc: Hyperion obfuscator output header
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?m)^(__obfuscator__\s*=\s*[''"]Hyperion[''"]|__authors__\s*=\s*\(\s*[''"]billythegoat356)'
