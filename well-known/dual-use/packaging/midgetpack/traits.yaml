defaults:
  platforms: [unix]
  for: [elf]
  size_min: 8192
  size_max: 16777216

traits:
  - id: midgetpack-banner
    desc: Midgetpack ELF packer banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Midgetpack: an ELF file packer'
      section: rodata

  - id: stub-linux-amd64-name
    desc: Midgetpack linux/amd64 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_linux_amd64_start
      section: .dynstr

  - id: stub-linux-x86-name
    desc: Midgetpack linux/x86 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_linux_x86_start
      section: .dynstr

  - id: stub-linux-armv6-name
    desc: Midgetpack linux/armv6 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_linux_armv6_start
      section: .dynstr

  - id: stub-freebsd-amd64-name
    desc: Midgetpack freebsd/amd64 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_freebsd_amd64_start
      section: .dynstr

  - id: stub-freebsd-x86-name
    desc: Midgetpack freebsd/x86 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_freebsd_x86_start
      section: .dynstr

  - id: starting-stub-msg
    desc: Midgetpack starting stub runtime message
    crit: component
    conf: 0.9
    if:
      type: text
      exact: 'starting stub ...'
      section: rodata

  - id: integrity-good-password-msg
    desc: Midgetpack integrity HMAC failure message
    crit: component
    conf: 0.95
    if:
      type: text
      exact: 'Integrity error. Good password ?'
      section: rodata

  - id: curve25519-failed-msg
    desc: Midgetpack curve25519 key exchange failure
    crit: component
    conf: 0.95
    if:
      type: text
      exact: 'Curve25519 key exchange failed !'
      section: rodata

  - id: x64-runtime-stub-header
    desc: Midgetpack x64 runtime stub ELF header
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset: 0
      pattern: >-
        7F 45 4C 46 02 01 01 00 00 00 00 00 00 00 00 00
        02 00 3E 00 01 00 00 00 F0 00 A0 0B 00 00 00 00
        40 00 00 00 00 00 00 00 68 01 01 00 00 00 00 00
        00 00 00 00 40 00 38 00 02 00 40 00 08 00 07 00

composite_rules:
  - id: midgetpack-builder
    desc: Midgetpack ELF packer builder binary
    crit: notable
    conf: 0.99
    attack: T1027.002
    all:
      - id: midgetpack-banner
    any:
      - id: stub-linux-amd64-name
      - id: stub-linux-x86-name
      - id: stub-linux-armv6-name
      - id: stub-freebsd-amd64-name
      - id: stub-freebsd-x86-name

  - id: midgetpack-packed-output
    desc: Midgetpack packed ELF output payload
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: starting-stub-msg
      - id: integrity-good-password-msg
    any:
      - id: curve25519-failed-msg
      - id: metadata/binary/anomaly/format::elf-entry-in-writable-segment
