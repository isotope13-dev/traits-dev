# The Midgetpack builder binary itself. Strings and the runtime stub header
# that Midgetpack leaves in packed output live in metadata/build/packer/midgetpack;
# the packed-output profile in objectives/anti-static/pack/midgetpack.
defaults:
  platforms: [unix]
  for: [elf]
  size_min: 8192
  size_max: 16777216

traits:
  - id: midgetpack-banner
    desc: Midgetpack ELF packer banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Midgetpack: an ELF file packer'
      section: rodata

  - id: stub-linux-amd64-name
    desc: Midgetpack linux/amd64 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_linux_amd64_start
      section: .dynstr

  - id: stub-linux-x86-name
    desc: Midgetpack linux/x86 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_linux_x86_start
      section: .dynstr

  - id: stub-linux-armv6-name
    desc: Midgetpack linux/armv6 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_linux_armv6_start
      section: .dynstr

  - id: stub-freebsd-amd64-name
    desc: Midgetpack freebsd/amd64 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_freebsd_amd64_start
      section: .dynstr

  - id: stub-freebsd-x86-name
    desc: Midgetpack freebsd/x86 embedded stub name
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: _binary_stub_freebsd_x86_start
      section: .dynstr

composite_rules:
  - id: midgetpack-builder
    desc: Midgetpack ELF packer builder binary
    crit: notable
    conf: 0.99
    attack: T1027.002
    all:
      - id: midgetpack-banner
    any:
      - id: stub-linux-amd64-name
      - id: stub-linux-x86-name
      - id: stub-linux-armv6-name
      - id: stub-freebsd-amd64-name
      - id: stub-freebsd-x86-name
