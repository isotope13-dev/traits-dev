# Enigma Protector 1.x uses a position-independent DLL entry stub followed by
# its ENIGMA loader header. The structured stub is more precise than the bare
# product word, which also occurs in documentation and unrelated resources.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
  size_max: 500000000

traits:
  - id: v1-loader-stub
    desc: Enigma Protector v1 loader stub
    crit: notable
    conf: 0.99
    arch: [x86]
    if:
      type: hex
      section: .data
      pattern: 60 E8 00 00 00 00 5D 81 ED 06 00 00 00 81 ED ?? ?? ?? 00 E9 ?? ?? ?? ?? 45 4E 49 47 4D 41
