# JavaScript Obfuscator is a widely used source-protection tool. Its own
# distribution embeds the decode, self-defending, and debug-protection
# templates that it emits into customer output; those templates identify the
# tool's implementation here rather than concealed behavior by the package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: archive-package-name
    desc: JavaScript Obfuscator package member
    if:
      type: value
      path: package.json::name
      exact: javascript-obfuscator

  - id: archive-upstream-repository
    desc: JavaScript Obfuscator upstream repository
    if:
      type: value
      path: package.json::repository.url
      exact: 'git+https://github.com/javascript-obfuscator/javascript-obfuscator.git'

  # These are implementation symbols in the obfuscator itself. Generated
  # customer output contains the emitted rotate/debug templates, not the
  # transformer classes that build those templates.
  - id: implementation-interface-name
    desc: JavaScript Obfuscator implementation interface
    if:
      type: literal
      exact: IJavaScriptObfuscator

  - id: implementation-rotate-transformer
    desc: JavaScript Obfuscator rotate transformer
    if:
      type: literal
      exact: StringArrayRotateFunctionTransformer

  # These option names are the tool's public configuration surface. They
  # travel together only in the tool's own bundles and sourcemaps: emitted
  # customer output carries the generated templates, never the option
  # registry. All three must be present; any single one is too generic.
  - id: option-debug-protection-name
    desc: Obfuscator debugProtection option name
    for: [javascript, typescript, data]
    if:
      type: text
      substr: 'debugProtection'

  - id: option-string-array-encoding-name
    desc: Obfuscator stringArrayEncoding option name
    for: [javascript, typescript, data]
    if:
      type: text
      substr: 'stringArrayEncoding'

  - id: option-self-defending-name
    desc: Obfuscator selfDefending option name
    for: [javascript, typescript, data]
    if:
      type: text
      substr: 'selfDefending'

  # The tool's code templates are factory functions returning the emitted
  # source string (`export function XxxTemplate (): string`). Only the
  # tool's own sources (and code-generator authors copying its shape) define
  # such factories; emitted customer output inlines the returned code.
  - id: template-factory-function
    desc: Obfuscator code-template factory function
    if:
      type: text
      regex: 'export function \w+Template\s*\(\s*\)\s*:\s*string'

composite_rules:
  - id: official-archive-context
    desc: Official JavaScript Obfuscator archive context
    crit: exception
    conf: 0.99
    all:
      - id: archive-package-name
      - id: archive-upstream-repository

  - id: implementation-context
    desc: JavaScript Obfuscator implementation context
    crit: exception
    conf: 0.99
    all:
      - id: implementation-interface-name
      - id: implementation-rotate-transformer

  - id: tool-option-surface-context
    desc: JavaScript Obfuscator tool bundle context
    crit: exception
    conf: 0.99
    scope: file
    for: [javascript, typescript, data]
    all:
      - id: option-debug-protection-name
      - id: option-string-array-encoding-name
      - id: option-self-defending-name
