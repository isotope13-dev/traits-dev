# JavaScript Obfuscator is a widely used source-protection tool. Its own
# distribution embeds the decode, self-defending, and debug-protection
# templates that it emits into customer output; those templates identify the
# tool's implementation here rather than concealed behavior by the package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: archive-package-name
    desc: JavaScript Obfuscator package member
    if:
      type: value
      path: package.json::name
      exact: javascript-obfuscator

  - id: archive-upstream-repository
    desc: JavaScript Obfuscator upstream repository
    if:
      type: value
      path: package.json::repository.url
      regex: '^git\+https://github\.com/javascript-obfuscator/javascript-obfuscator\.git$'

  # These are implementation symbols in the obfuscator itself. Generated
  # customer output contains the emitted rotate/debug templates, not the
  # transformer classes that build those templates.
  - id: implementation-interface-name
    desc: JavaScript Obfuscator implementation interface
    if:
      type: literal
      exact: IJavaScriptObfuscator

  - id: implementation-rotate-transformer
    desc: JavaScript Obfuscator rotate transformer
    if:
      type: literal
      exact: StringArrayRotateFunctionTransformer

composite_rules:
  - id: official-archive-context
    desc: Official JavaScript Obfuscator archive context
    crit: exception
    conf: 0.99
    all:
      - id: archive-package-name
      - id: archive-upstream-repository

  - id: implementation-context
    desc: JavaScript Obfuscator implementation context
    crit: exception
    conf: 0.99
    all:
      - id: implementation-interface-name
      - id: implementation-rotate-transformer
