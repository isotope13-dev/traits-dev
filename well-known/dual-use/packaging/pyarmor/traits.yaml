# PyArmor (dashingsoft/pyarmor) — the widely used commercial Python obfuscator
# and license binder.
#
# Detecting PyArmor *output* is the point of
# objectives/anti-static/obfuscation/obfuscator/signature/, and that stays.
# What is wrong is reporting the tool's own distribution: the pyarmor wheel
# contains the runtime it injects, so `import pytransform`, `__pyarmor__(...)`
# and the packed bootstrap all appear as the tool's source. Combined with the
# subprocess and eval calls any build tool makes, that produced two hostile
# findings on the vendor's own release.
#
# Filed under dual-use/packaging/ with the other packers and converters: PyArmor
# is legitimate software whose abuse-relevant function (making Python
# unreadable) is exactly why analysts want the identity called out.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: PyArmor wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^pyarmor$'

  - id: wheel-author-email
    desc: PyArmor wheel author email
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.author_email
      regex: '(?i)^pyarmor@'

  - id: package-member-path
    desc: PyArmor distribution member path
    for: [whl, egg, zip, python-sdist, python, text, data]
    if:
      type: path
      regex: '(^|[\\/])pyarmor[\\/]'

  # Every PyArmor source file opens with the vendor's banner comment. The
  # wheel-level atoms above cannot be evaluated at an inner .py node, so this
  # is the marker that lets the exception reach the files the objectives fire
  # on.
  - id: vendor-copyright-banner
    desc: Dashingsoft PyArmor copyright banner
    for: [python]
    if:
      type: text
      substr: 'Dashingsoft corp'

  - id: upstream-repository
    desc: PyArmor upstream repository reference
    for: [python, text, data]
    if:
      type: text
      substr: 'github.com/dashingsoft/pyarmor'

  - id: cli-banner-name
    desc: PyArmor CLI banner name
    for: [python]
    if:
      type: text
      regex: "(?i)\\bpyarmor\\s+(version|command)\\b"

composite_rules:
  - id: pyarmor-distribution
    desc: Recognized PyArmor distribution
    crit: exception
    conf: 0.99
    scope: outer
    for: [whl, python-sdist, egg, zip, python, text, data]
    any:
      - id: wheel-distribution-name
      - id: wheel-author-email
      - id: package-member-path
      - id: vendor-copyright-banner
      - id: upstream-repository
      - id: cli-banner-name
