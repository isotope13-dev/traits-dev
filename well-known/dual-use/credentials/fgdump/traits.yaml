defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: foofus-team-attribution
    desc: Foofus Networking dump-tool attribution
    # Whole PwDump.exe clients are ~393 KiB; carved client extents sit
    # near 160 KiB. The banner/attribution strings are unique to the
    # published tool, so the ceiling is only a coarse bound.
    size_max: 2000000
    if:
      type: text
      substr: foofus.net
      section: ".rdata"
  - id: cachedump-banner
    desc: CacheDump domain-cache dump banner
    size_max: 300000
    if:
      type: text
      substr: 'CacheDump 1.4 - Dump Cache Entries'
      section: ".rdata"
  - id: pwdump6-banner
    desc: Pwdump6 SAM dump banner
    size_max: 2000000
    if:
      type: text
      substr: 'pwdump6 Version'
      section: ".rdata"
  - id: pstgdump-banner
    desc: pstgdump Protected Storage dump banner
    size_max: 80000
    if:
      type: text
      substr: 'pstgdump 0.1.0-BETA2'
      section: ".rdata"
  - id: fgexec-remote-exec-banner
    desc: fgexec remote process execution banner
    size_max: 60000
    if:
      type: text
      substr: 'fgexec Remote Process Execution Tool'
      section: ".rdata"
  - id: fgexec-target-service-usage
    desc: fgexec target-service usage string
    size_max: 60000
    if:
      type: text
      substr: 'Run as a service (use this on the target machine)'
      section: ".rdata"

  - id: fgdump-banner
    desc: Foofus fgdump credential-auditing banner
    size_max: 2000000
    if:
      type: text
      substr: 'fgDump 2.1.0 - fizzgig and the mighty group at foofus.net'
      section: .rdata
  - id: lsremora-image-name
    desc: Pwdump lsremora hash-engine image name
    size_max: 200000
    if:
      type: text
      regex: '^lsremora(64)?\.dll$'
      section: .rdata
  - id: servpw-image-name
    desc: Pwdump servpw service image name
    size_max: 200000
    if:
      type: text
      regex: '^servpw(64)?(\.exe)?$'
      section: .rdata

  - id: gethash-export
    desc: GetHash named function export
    size_max: 200000
    if:
      type: export
      exact: GetHash

composite_rules:
  - id: fgexec-named-pipe-remote-exec
    desc: fgexec runs commands over a named pipe
    crit: notable
    conf: 0.99
    size_max: 60000
    attack: T1021.002,T1569.002
    all:
      - id: fgexec-remote-exec-banner
      - id: micro-behaviors/communications/ipc/named-pipe::call-named-pipe-name
      - id: micro-behaviors/process/create/spawn::create-process-a
  - id: fgexec-service-stub
    desc: fgexec target-side service dispatcher
    crit: notable
    conf: 0.98
    size_max: 60000
    attack: T1569.002
    all:
      - id: fgexec-target-service-usage
      - id: micro-behaviors/os/service/dispatch::start-service-dispatcher
  - id: pwdump6-remote-client
    desc: Pwdump6 remote service hash client
    crit: notable
    conf: 0.98
    attack: T1003.002,T1021.002
    all:
      - id: pwdump6-banner
      - id: foofus-team-attribution
      - id: micro-behaviors/os/service/create::create-service
  # fgexec ships both ends of remote command execution in one image: the
  # named-pipe client that sends commands and the service dispatcher that
  # runs them on the target. Both ends describe ordinary remote administration; the pair identifies
  # the remote-exec tool without establishing abuse.
  - id: fgexec-remote-command-service
    desc: fgexec remote command service pair
    crit: notable
    conf: 0.98
    size_max: 60000
    attack: T1021.002,T1569.002
    all:
      - id: fgexec-named-pipe-remote-exec
      - id: fgexec-service-stub
  - id: fgdump-auditing-client
    desc: Foofus fgdump service-deployment auditing client
    all:
      - id: fgdump-banner
      - id: micro-behaviors/os/service/create::create-service
  - id: cachedump-auditing-client
    desc: CacheDump domain-cache auditing utility
    all:
      - id: cachedump-banner
      - id: micro-behaviors/os/registry/keys::nlkm-lsa-secret-path
      - id: micro-behaviors/os/service/dispatch::start-service-dispatcher
  - id: pstgdump-auditing-client
    desc: Foofus Protected Storage auditing utility
    all:
      - id: pstgdump-banner
      - id: micro-behaviors/os/security/protected-storage::pstore-create-instance-reference
  - id: lsremora-hash-engine
    desc: Pwdump lsremora SAM hash-export DLL
    all:
      - id: lsremora-image-name
      - id: gethash-export
      - id: micro-behaviors/os/security/lsa::lsa-open-policy
  - id: servpw-hash-service
    desc: Pwdump servpw hash-engine service helper
    all:
      - id: servpw-image-name
      - id: micro-behaviors/os/security/lsa::gethash-routine-name
      - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
  - id: credential-auditing-tool-context
    desc: Published Foofus credential-auditing tool implementations
    crit: exception
    any:
      - id: fgdump-auditing-client
      - id: pwdump6-remote-client
      - id: cachedump-auditing-client
      - id: pstgdump-auditing-client
      - id: lsremora-hash-engine
      - id: servpw-hash-service
