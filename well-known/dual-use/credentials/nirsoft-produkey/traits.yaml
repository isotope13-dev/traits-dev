# NirSoft ProduKey — legitimate Windows / Office / SQL / Exchange / IE
# product-key recovery utility, freely redistributable. Frequently
# repacked and bundled into stealer toolkits as a credential-recovery
# component.
#
# Version-resource spelling across shipped builds: ProductName is the
# asterisk-wrapped "*ProduKey*"; OriginalFilename/InternalName exist in
# some builds but not the 2021 x64 1.97 build, so each identity field is
# an alternate leg and the utility composite anchors on CompanyName.
# No ATT&CK mapping: license-key recovery is not credential dumping.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 16384
  size_max: 5242880
traits:
  - id: produkey-versioninfo-original-name
    desc: ProduKey OriginalFilename version info
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.original_filename
      exact: ProduKey.exe

  - id: produkey-versioninfo-internal-name
    desc: ProduKey InternalName version info
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.internal_name
      exact: ProduKey

  - id: produkey-product-name
    desc: ProduKey ProductName version info
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.product_name
      regex: '^\*?ProduKey\*?$'

composite_rules:
  - id: produkey-utility
    desc: NirSoft ProduKey product-key recovery utility
    crit: notable
    conf: 0.99
    all:
      - id: well-known/tool/sysadmin/nirsoft::nirsoft-company-versioninfo
    any:
      - id: produkey-versioninfo-original-name
      - id: produkey-versioninfo-internal-name
      - id: produkey-product-name

  - id: produkey-scrambled-upx-repack
    desc: Repacked NirSoft ProduKey with scrambled UPX header
    crit: hostile
    conf: 0.99
    all:
      - id: produkey-utility
      - id: objectives/anti-static/pack/upx::scrambled-upx-header
