defaults:
  for: [scripts, source, pe, dll]
  platforms: [windows]
  size_max: 500000000
  crit: notable
  conf: 0.95
traits:
  - id: executable-reference
    desc: NirSoft WebBrowserPassView executable reference
    if:
      type: text
      regex: '(?i)\bWebBrowserPassView\.exe\b'

  - id: webbrowserpassview-description-versioninfo
    desc: WebBrowserPassView description
    conf: 0.97
    for: [pe, dll]
    if:
      type: value
      path: pe.version.description
      exact: Web Browser Password Viewer

  - id: webbrowserpassview-internal-name
    desc: WebBrowserPassView internal name
    conf: 0.98
    for: [pe, dll]
    if:
      type: value
      path: pe.version.internal_name
      exact: Web Browser Pass View

  - id: webbrowserpassview-product-versioninfo
    desc: WebBrowserPassView product name
    conf: 0.97
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      exact: WebBrowserPassView

  - id: webbrowserpassview-original-filename
    desc: WebBrowserPassView original filename
    conf: 0.98
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: WebBrowserPassView.exe

composite_rules:
  - id: webbrowserpassview-utility
    desc: NirSoft WebBrowserPassView credential recovery utility
    crit: notable
    conf: 0.99
    all:
      - id: well-known/tool/sysadmin/nirsoft::nirsoft-company-versioninfo
    any:
      - id: webbrowserpassview-description-versioninfo
      - id: webbrowserpassview-internal-name
      - id: webbrowserpassview-product-versioninfo
      - id: webbrowserpassview-original-filename
