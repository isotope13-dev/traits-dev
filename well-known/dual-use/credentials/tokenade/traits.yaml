# Content recognition for the explicit browser-session portability workflow.
# Names and archive paths alone must never suppress credential-theft findings.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: share-scheme
    desc: Tokenade self-contained share link scheme
    for: [python]
    if:
      type: literal
      substr: 'tokenade://share/'
  - id: session-packager-class
    desc: Tokenade session-package implementation
    for: [python]
    if:
      type: text
      substr: 'class SessionPackager:'

composite_rules:
  - id: tokenade-package-context
    desc: Tokenade session-package and sharing workflow
    crit: exception
    scope: archive
    all:
      - id: share-scheme
      - id: session-packager-class
