# Tokenade (PyPI `tokenade`) — session portability tool: extracts the user's
# own browser cookies/sessions (desktop, mobile, iTunes backups) into
# encrypted `.tokenade` files and moves them through explicit user-directed
# flows (share links, QR, user-configured webhooks, opt-out-able relay).
# Cookie-store reads, cookie-table SQL, and HTTP delivery are its documented
# purpose, the same dual-use shape as browser-cookie3, yt-dlp, and gallery-dl.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-path
    desc: Tokenade wheel or extracted member path
    if:
      type: path
      regex: '(^|[\\\\/])tokenade-[0-9][^\\\\/]*\\.whl'

  - id: member-path
    desc: Tokenade Python package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\\\/])tokenade[\\\\/]'

  - id: share-scheme
    desc: Tokenade self-contained share link scheme
    for: [python]
    if:
      type: text
      substr: 'tokenade://share/'

composite_rules:
  - id: tokenade-package-context
    desc: Recognized Tokenade session-portability package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: wheel-path
      - id: member-path
      - id: share-scheme
