# Path naming a Hashcat executable inside a Hashcat directory.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 2147483648
traits:
- id: hashcat-archive-exe-path
  desc: Hashcat archive executable path
  crit: notable
  conf: 0.98
  if:
    type: path
    regex: (?i)hashcat[^\\/]*[\\/]hashcat\.exe$
