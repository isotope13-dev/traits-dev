defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, pe, elf]
traits:
  - id: iodine-dns-reference
    desc: Iodine DNS tunnel tool reference
    crit: notable
    size_min: 10
    conf: 0.6
    if:
      type: text
      regex: '(?i)\biodine\b.{0,40}\b(dns|tunnel)\b'
composite_rules:
  - id: iodine-dns-tunnel
    desc: Iodine DNS tunnel context
    crit: suspicious
    conf: 0.95
    any:
      - id: metadata/lang/natural/vocabulary/dns::dns-tunnel-phrase
    all:
      - id: iodine-dns-reference
      - id: micro-behaviors/network/tunnel::dev-net-tun
