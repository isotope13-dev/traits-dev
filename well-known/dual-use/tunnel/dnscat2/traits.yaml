defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, pe, elf]
  size_max: 10485760

traits:
  - id: dnscat-name
    desc: dnscat or dnscat2 product name
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)\bdnscat2?\b'

  - id: dnscat-secret
    desc: dnscat2 shared-secret environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: DNSCAT_SECRET

  - id: dnscat-msg-packet
    desc: dnscat2 established-session packet diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: In SESSION_STATE_ESTABLISHED, sending a MSG packet

  - id: dnscat2-client-banner
    desc: dnscat2 client version banner
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bdnscat2 v[0-9]+\.[0-9]+ \(client\)'

  - id: dnscat2-shell-request
    desc: dnscat2 shell-request protocol diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: COMMAND_SHELL

composite_rules:
  - id: dnscat2-client
    desc: dnscat2 DNS tunnel client identity
    crit: suspicious
    conf: 0.99
    all:
      - id: dnscat2-client-banner
      - id: dnscat-msg-packet
      - id: dnscat2-shell-request
