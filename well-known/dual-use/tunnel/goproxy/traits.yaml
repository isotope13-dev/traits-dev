# GoProxy's installer names the upstream project and stages its executable
# into a system command directory. Keep generic download behavior in the
# micro-behavior rules; this identity needs both project and install evidence.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: upstream-repository-reference
    desc: References the snail007 GoProxy repository
    if:
      type: text
      substr: github.com/snail007/goproxy

  - id: installs-proxy-system-command
    desc: Copies proxy executable into /usr/bin
    if:
      type: text
      substr: 'cp -f proxy /usr/bin/'

composite_rules:
  - id: goproxy-system-installer
    desc: GoProxy tunnel software installer
    all:
      - id: upstream-repository-reference
      - id: installs-proxy-system-command
