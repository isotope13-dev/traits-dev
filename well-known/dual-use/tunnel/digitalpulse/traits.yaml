defaults:
  platforms: [windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.94
  attack: T1090
  size_min: 1
  size_max: 500000000

traits:
  - id: pluton-agent-executable
    desc: DigitalPulse PlutonAgent executable name
    if:
      type: text
      regex: '(?i)\bPlutonAgent\.exe\b'

  - id: pluton-install-path
    desc: DigitalPulse Pluton installation path
    if:
      type: text
      regex: '(?i)(%SystemRoot%|\$env:SystemRoot|[A-Z]:\\Windows)\\pluton\\'

composite_rules:
  - id: digitalpulse-proxy-agent
    desc: DigitalPulse PlutonAgent proxyware identity
    any:
      - id: pluton-agent-executable
      - id: pluton-install-path
