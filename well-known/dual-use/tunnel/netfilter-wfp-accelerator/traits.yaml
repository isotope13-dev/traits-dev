defaults:
  platforms: [windows]
  for: [pe, data]
  crit: notable

traits:
  - id: embedded-wfp-proxy-driver-name
    desc: Embedded WFP proxy driver version name
    conf: 0.9
    if:
      type: text
      substr: Windows Proxy Driver

  - id: embedded-wfp-driver-build-pdb
    desc: Embedded WFP driver netfilter2 build path
    conf: 0.9
    if:
      type: text
      substr: netfilter2.pdb

composite_rules:
  # An accelerator that embeds a NetFilter-style WFP driver. The SOCKS5 and
  # WFP-filter atoms are typed for binaries only, so the family identity is
  # the two embedded-driver identifiers.
  # Dual-use traffic-tunnel identity: the driver can redirect user traffic for
  # an accelerator or VPN product, and the same capability can intercept it.
  - id: netfilter-wfp-accelerator-driver-bundle
    desc: Accelerator bundles a NetFilter WFP proxy driver
    crit: notable
    conf: 0.9
    attack: T1090
    all:
      - id: embedded-wfp-proxy-driver-name
      - id: embedded-wfp-driver-build-pdb
