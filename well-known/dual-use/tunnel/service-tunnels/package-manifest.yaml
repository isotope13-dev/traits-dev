# service-tunnels (aiti-ai) discovers local ports and publishes them through
# ngrok, frpc, ssh, cloudflared or localtunnel behind an auth portal. Like the
# tunnel clients it wraps, it is dual-use: developer sharing and demos on one
# side, covert public exposure of internal services on the other. The package
# has no install hook and downloads provider binaries only on demand.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: service-tunnels-package
    desc: service-tunnels tunnel orchestrator package
    for: [package.json]
    if:
      type: value
      path: npm.name
      exact: service-tunnels
