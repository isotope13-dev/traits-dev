# Suo5 — high-performance HTTP forward proxy / tunnel built on HTTP/1.1
# chunked transfer (github.com/zema1/suo5). Release binaries are Go builds,
# so build metadata is the discriminating identity signal; the canonical
# release assets share the suo5 stem. Identity only: tunneling is a dual-use
# capability, and the project's demo GIF and documentation are not the tool.
defaults:
  platforms: [windows, linux, macos]
  attack: T1572

traits:
  - id: suo5-binary-basename
    desc: Suo5 tunnel agent binary name
    crit: notable
    conf: 0.95
    for: [pe, elf, macho]
    if:
      type: basename
      regex: '^suo5(-[a-z0-9]+)?(\.exe)?$'

  # Go build metadata is a stronger identity signal than a basename. Keep a
  # format-specific matcher because cleave exposes the metadata under the
  # corresponding object (pe.go, elf.go, or macho.go).
  - id: suo5-go-module-pe
    desc: Suo5 Go module identity
    crit: notable
    conf: 0.99
    size_min: 500000
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/zema1/suo5

  - id: suo5-go-module-elf
    desc: Suo5 Go module identity
    crit: notable
    conf: 0.99
    size_min: 500000
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/zema1/suo5

  - id: suo5-go-module-macho
    desc: Suo5 Go module identity
    crit: notable
    conf: 0.99
    size_min: 500000
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/zema1/suo5
