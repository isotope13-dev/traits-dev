# MetaCubeXD — open-source web dashboard for the MetaCubeX Mihomo/Clash
# proxy core (https://github.com/MetaCubeX/metacubexd). Static gh-pages
# bundles embed proxy rule demos, Cloudflare fallback IPs, connectivity
# probes, and SPA navigation that otherwise resemble captive-portal or
# injection heuristics.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, tar, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: html-title
    desc: MetaCubeXD page title marker
    for: [html]
    if:
      type: text
      substr: '<title>MetaCubeXD</title>'

  - id: config-global
    desc: MetaCubeXD runtime config global
    for: [html, javascript, typescript]
    if:
      type: text
      substr: __METACUBEXD_CONFIG__

  - id: locale-cookie-key
    desc: MetaCubeXD locale cookie key
    for: [javascript, typescript]
    if:
      type: text
      substr: metacubexd_lang

  - id: github-repo-path
    desc: MetaCubeX metacubexd GitHub repository
    for: [javascript, typescript]
    if:
      type: text
      substr: MetaCubeX/metacubexd

  - id: mihomo-release-repo
    desc: MetaCubeX mihomo release API path
    for: [javascript, typescript]
    if:
      type: text
      substr: repos/MetaCubeX/mihomo

composite_rules:
  - id: metacubexd-dashboard-context
    desc: MetaCubeXD Mihomo proxy dashboard context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: html-title
      - id: config-global
      - id: github-repo-path
      - id: mihomo-release-repo
