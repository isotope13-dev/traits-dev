# Flowseal zapret-discord-youtube: a Windows launcher that runs zapret's winws
# with the WinDivert packet driver to bypass DPI filtering of Discord and
# YouTube. Circumvention tooling of this kind is used by ordinary users and
# by people evading filters, so it is dual-use context, not a payload.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: zapret-discord-repo-reference
    desc: Flowseal zapret-discord repo reference
    for: [markdown, text]
    conf: 0.97
    if:
      type: text
      substr: 'Flowseal/zapret-discord-youtube'

  - id: zapret-discord-launcher-line
    desc: Batch launcher starts DiscordZapret executable
    for: [batch]
    if:
      type: text
      exact: 'start DiscordZapret.exe'

  - id: zapret-clienthello-payload-file
    desc: zapret TLS or QUIC handshake payload file
    for: [markdown, text, batch]
    if:
      type: path
      basename: true
      regex: '^(tls_clienthello_|quic_initial_)[A-Za-z0-9_.]{1,60}\.bin$'

composite_rules:
  - id: zapret-discord-package
    desc: Flowseal zapret-discord DPI-bypass launcher package
    crit: notable
    conf: 0.97
    scope: archive
    for: [archives, markdown, text, batch]
    needs: 2
    any:
      - id: zapret-discord-repo-reference
      - id: zapret-discord-launcher-line
      - id: zapret-clienthello-payload-file
