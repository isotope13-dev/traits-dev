defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, batch, powershell, zip]
  crit: notable
  conf: 0.94
  size_min: 32
  size_max: 500000000

traits:
  - id: sagernet-tailscale-module
    desc: SagerNet Tailscale module path
    if:
      type: text
      substr: github.com/sagernet/tailscale

  - id: tailscale-source-token
    desc: Tailscale source token
    if:
      type: text
      substr: tailscale.com/

  - id: install-script-url
    desc: Tailscale installation script URL
    crit: notable
    conf: 0.92
    for: [go, go.mod, shell, batch, powershell, python]
    if:
      type: text
      substr: tailscale.com/install.sh

  - id: tailscale-init-script-name
    desc: Tailscale SysV init script basename
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: basename
      exact: tailscale.init

  - id: tailscale-init-script-marker
    desc: Tailscale VPN init marker
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: text
      substr: Tailscale VPN

  - id: tailscale-copyright-header
    desc: Tailscale Inc copyright header
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: Copyright (c) Tailscale Inc

  - id: tailscale-omit-build-tag
    desc: Tailscale ts_omit modular build tag
    crit: notable
    conf: 0.97
    for: [go]
    if:
      type: text
      regex: '//go:build !?ts_omit_[a-z0-9]+\s*$'

  - id: tailscale-buildfeatures-package
    desc: Tailscale buildfeatures package clause
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      exact: package buildfeatures

  - id: socks-wrap-func
    desc: Tailscale SOCKS dialer wrap
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      substr: 'func wrapSocks'

  - id: omit-useproxy-tag
    desc: Tailscale useproxy omit build tag
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      word: ts_omit_useproxy

  - id: tailscale-go-build-tag
    desc: tailscale_go toolchain build constraint
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: '//go:build tailscale_go'

  - id: tailscale-current-p
    desc: TailscaleCurrentP runtime CPU shard
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: TailscaleCurrentP

composite_rules:
  - id: sagernet-source-tree
    desc: SagerNet Tailscale source tree
    crit: notable
    conf: 0.96
    all:
      - id: sagernet-tailscale-module
    any:
      - id: tailscale-source-token

  - id: tailscale-init-script-context
    desc: Tailscale SysV service script context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: tailscale-init-script-name
      - id: tailscale-init-script-marker
  - id: sagernet-tailscale-source-context
    desc: SagerNet Tailscale upstream source context
    crit: exception
    conf: 0.99
    for: [go]
    all:
      - id: sagernet-tailscale-module
      - id: tailscale-copyright-header
  - id: tailscale-generated-omit-stub
    desc: Tailscale generated feature-omit stub
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: tailscale-omit-build-tag
      - id: tailscale-buildfeatures-package
      - id: metadata/build/artifact::go-generated-source-header

  - id: tailscale-netns-socks-wrap
    desc: Tailscale netns SOCKS environment wrap
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: socks-wrap-func
      - id: omit-useproxy-tag

  - id: tailscale-omit-source-stub
    desc: Tailscale ts_omit source stub
    crit: notable
    conf: 0.96
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: tailscale-omit-build-tag

  - id: tailscale-go-runtime-source
    desc: Recognized Tailscale Go runtime source
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
    any:
      - id: tailscale-go-build-tag
      - id: tailscale-current-p
