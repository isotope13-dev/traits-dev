defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, batch, powershell, zip]
  crit: notable
  conf: 0.94
  size_min: 32
  size_max: 500000000

traits:
  - id: sagernet-tailscale-module
    desc: SagerNet Tailscale module path
    if:
      type: text
      substr: github.com/sagernet/tailscale

  - id: tailscale-source-token
    desc: Tailscale source token
    if:
      type: text
      substr: tailscale.com/

  - id: local-api-socket-host
    desc: Tailscale local API socket host
    for: [go, c, cpp, pe, dll, shell, python]
    if:
      type: text
      substr: local-tailscaled.sock

  - id: install-script-url
    desc: Tailscale installation script URL
    crit: notable
    conf: 0.92
    for: [go, go.mod, shell, batch, powershell, python]
    if:
      type: text
      substr: tailscale.com/install.sh

  - id: tailscale-init-script-name
    desc: Tailscale SysV init script basename
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: basename
      exact: tailscale.init

  - id: tailscale-init-script-marker
    desc: Tailscale VPN init marker
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: text
      substr: Tailscale VPN

  - id: tailscale-copyright-header
    desc: Tailscale Inc copyright header
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: Copyright (c) Tailscale Inc

  - id: tailscale-feature-enabled-build-tag
    desc: Tailscale enabled-feature build constraint
    crit: notable
    conf: 0.97
    for: [go]
    if:
      type: text
      regex: '//go:build !ts_omit_[a-z0-9_]+\s*$'

  - id: tailscale-feature-disabled-build-tag
    desc: Tailscale disabled-feature build constraint
    crit: notable
    conf: 0.97
    for: [go]
    if:
      type: text
      regex: '//go:build ts_omit_[a-z0-9_]+\s*$'

  - id: tailscale-buildfeatures-package
    desc: Tailscale buildfeatures package clause
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      exact: package buildfeatures

  - id: socks-wrap-func
    desc: Tailscale SOCKS dialer wrap
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      substr: 'func wrapSocks'

  - id: omit-useproxy-tag
    desc: Tailscale useproxy omit build tag
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      word: ts_omit_useproxy

  - id: tailscale-go-build-tag
    desc: tailscale_go toolchain build constraint
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: '//go:build tailscale_go'

  - id: tailscale-current-p
    desc: TailscaleCurrentP runtime CPU shard
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      substr: TailscaleCurrentP

  - id: mapx-package-clause
    desc: Go mapx package clause
    crit: notable
    conf: 0.97
    for: [go]
    if:
      type: text
      substr: package mapx

  - id: ordered-map-generic-struct
    desc: OrderedMap generic comparable struct
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      substr: 'type OrderedMap[K comparable, V any] struct'

  - id: tailscale-ipn-exe-name
    desc: Tailscale IPN executable name
    crit: notable
    conf: 0.97
    for: [go]
    if:
      type: literal
      exact: tailscale-ipn

  - id: tailscale-gui-exe-name
    desc: Tailscale GUI executable name
    crit: notable
    conf: 0.97
    for: [go]
    if:
      type: literal
      exact: tailscale-gui

composite_rules:
  - id: sagernet-source-tree
    desc: SagerNet Tailscale source tree
    crit: notable
    conf: 0.96
    all:
      - id: sagernet-tailscale-module
    any:
      - id: tailscale-source-token

  - id: tailscale-init-script-context
    desc: Tailscale SysV service script context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: tailscale-init-script-name
      - id: tailscale-init-script-marker
  - id: sagernet-tailscale-source-context
    desc: SagerNet Tailscale upstream source context
    crit: exception
    conf: 0.99
    for: [go]
    all:
      - id: sagernet-tailscale-module
      - id: tailscale-copyright-header
  - id: tailscale-generated-enabled-feature
    desc: Tailscale generated enabled-feature source
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: tailscale-feature-enabled-build-tag
      - id: tailscale-buildfeatures-package
      - id: metadata/build/artifact::go-generated-source-header

  - id: tailscale-generated-disabled-feature
    desc: Tailscale generated disabled-feature source
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: tailscale-feature-disabled-build-tag
      - id: tailscale-buildfeatures-package
      - id: metadata/build/artifact::go-generated-source-header

  - id: tailscale-netns-socks-wrap
    desc: Tailscale netns SOCKS environment wrap
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: socks-wrap-func
      - id: omit-useproxy-tag

  - id: tailscale-go-runtime-source
    desc: Recognized Tailscale Go runtime source
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
    any:
      - id: tailscale-go-build-tag
      - id: tailscale-current-p

  - id: tailscale-mapx-ordered-map
    desc: Tailscale mapx OrderedMap source
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: mapx-package-clause
      - id: ordered-map-generic-struct

  - id: tailscale-gui-exe-helper
    desc: Tailscale GUI executable-name helper
    crit: notable
    conf: 0.98
    for: [go]
    all:
      - id: tailscale-copyright-header
      - id: tailscale-ipn-exe-name
      - id: tailscale-gui-exe-name
