# Public tunnel hosts that expose a local port on a throwaway subdomain. A
# literal host is only a notable clue on its own: developers use these tunnels
# too. Composites in objectives/exfiltration decide whether the tunnel is a
# drop point for collected data.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
traits:
- id: ephemeral-tunnel-host-literal
  desc: Ephemeral public tunnel host literal
  conf: 0.9
  if:
    type: text
    regex: \.(telebit\.io|localhost\.run|serveo\.net|pagekite\.me)\b
