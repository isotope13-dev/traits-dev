defaults:
  attack: T1090
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000
traits:
- id: venom-dliv3
  size_min: 512
  size_max: 500000000
  desc: Venom Dliv3 GitHub reference
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: Dliv3/Venom
    section: ".text"
- id: venom-agent-path
  size_min: 512
  size_max: 500000000
  desc: Venom agent path reference
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: "/Venom/agent"
    section: ".text"
- id: venom-agent-name
  size_min: 512
  size_max: 500000000
  desc: Venom agent name reference
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: venom_agent
    section: ".text"
