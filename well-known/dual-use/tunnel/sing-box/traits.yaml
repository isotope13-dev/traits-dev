defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, makefile, tar, zip]
  crit: notable
  conf: 0.94

traits:
  - id: sagernet-sing-box-source
    desc: SagerNet sing-box source tree
    if:
      type: text
      substr: github.com/sagernet/sing-box

  - id: universal-proxy-platform
    desc: sing-box proxy platform text
    if:
      type: text
      exact: The universal proxy platform.

  - id: wheel-distribution
    desc: sing-box Python wrapper wheel distribution
    for: [whl]
    size_min: 512
    size_max: 500000000
    if:
      type: value
      path: whl.distribution
      exact: sing_box_bin

  - id: sagernet-sing-box-go-module-elf
    desc: SagerNet sing-box Go module in ELF
    for: [elf]
    size_min: 1000000
    size_max: 300000000
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/sagernet/sing-box

  - id: sagernet-sing-box-go-module-pe
    desc: SagerNet sing-box Go module in PE
    for: [pe]
    size_min: 1000000
    size_max: 300000000
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/sagernet/sing-box

  - id: wrapper-project-marker
    desc: sing-box Python wrapper project marker
    for: [whl, pkginfo]
    size_min: 512
    size_max: 500000000
    if:
      type: text
      regex: '(?i)github\.com/(AtticusZeller|atticuszeller)/sing-box-bin'

composite_rules:
  - id: source-tree
    desc: SagerNet sing-box source tree
    crit: notable
    conf: 0.96
    any:
      - id: sagernet-sing-box-source
      - id: universal-proxy-platform

  - id: sing-box-package-context
    desc: Recognized sing-box Python wrapper package
    crit: notable
    conf: 0.99
    scope: archive
    for: [whl]
    size_min: 512
    size_max: 500000000
    all:
      - id: wheel-distribution
    any:
      - id: wrapper-project-marker
      - id: metadata/package/manifest/ecosystem::wheel-archive-member
