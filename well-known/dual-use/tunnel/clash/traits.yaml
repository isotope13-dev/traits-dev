# Dreamacro/clash — the original open-source Clash proxy core and mihomo's
# upstream, distributed as a static Go binary by installer projects such as
# nelvko/clash-for-linux-install. A proxy core legitimately carries a TUN
# stack, eBPF redirect, DNS hijacking, and shadowsocks/vmess/trojan
# transports; naming the core stops that surface from reading as an opaque
# tunneling implant. mihomo (Clash Meta) renamed the module and has its own
# identity in well-known/dual-use/tunnel/mihomo.
defaults:
  platforms: [unix, windows]
  for: [pe, elf, go]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  # Go build info lands under an `elf.`/`pe.` prefixed value path depending on
  # the container, so the module identity needs one trait per format.
  - id: clash-go-module-elf
    desc: Dreamacro clash Go module identity
    for: [elf, go]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/Dreamacro/clash

  - id: clash-go-module-pe
    desc: Dreamacro clash Go module identity
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/Dreamacro/clash

  # Survives when build info is stripped: the package paths are compiled into
  # the symbol and type names of every clash build.
  - id: clash-package-path
    desc: Dreamacro clash package import path
    if:
      type: text
      substr: github.com/Dreamacro/clash/
