# Ngrok is a legitimate tunneling service that is also used to expose attacker
# infrastructure. These traits identify the service or CLI; intent must come
# from an objective-level composite that adds the surrounding behavior.
defaults:
  platforms: [linux, macos, windows]
  size_min: 32
  size_max: 500000000

traits:
  - id: name-reference
    desc: References the ngrok tunneling service
    crit: notable
    conf: 0.6
    for: [go, c, cpp, elf, pe, macho]
    if:
      type: text
      word: ngrok
      case_insensitive: true
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/qt
      - id: metadata/package/quality/benign-context::password-strength-blocklist-context
      - id: metadata/library/data::public-suffix-list-content
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - type: text
        substr: ngrok
        case_insensitive: true
        section: .rsrc

  - id: ngrok-io-domain
    desc: References the ngrok.io tunnel domain
    crit: notable
    conf: 0.85
    count_min: 2
    for: [go, c, cpp, elf, pe, macho]
    if:
      type: text
      word: ngrok.io
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/qt
      - id: metadata/package/quality/benign-context::password-strength-blocklist-context
      - id: metadata/library/data::public-suffix-list-content
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - type: text
        substr: ngrok.io
        section: .rsrc

  - id: ngrok-com-domain
    desc: References the ngrok.com service domain
    crit: notable
    conf: 0.7
    for: [go, c, cpp, elf, pe, macho]
    if:
      type: text
      substr: ngrok.com
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/qt
      - id: metadata/package/quality/benign-context::password-strength-blocklist-context
      - id: metadata/library/data::public-suffix-list-content

  - id: ngrok-free-domain
    desc: References an ngrok-free tunnel domain
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '[a-z0-9-]+\.ngrok-free\.(app|dev)\b'
    not:
      - regex: '\b(abcd1234|abc123|example)\.ngrok-free\.'
      - regex: '\b(your-subdomain|xxx)\.ngrok-free\.'
      # CLI help and docs that show how to point a tool at a tunnel spell the
      # subdomain as a stand-in (`--mcp-url https://my-app.ngrok-free.dev`).
      - regex: '\b(my-app|myapp|your-app)\.ngrok-free\.'
      - regex: '\b(x|app)\.ngrok-free\.'
      - regex: '(?i)#\s*openapi:.*ngrok-free\.'

  - id: cli-invocation
    desc: Invokes the ngrok command-line client
    crit: notable
    conf: 0.85
    for: [batch, shell, powershell]
    if:
      type: text
      regex: (?i)(^|[;&|\r\n])\s*ngrok(\.exe)?\b

composite_rules:
  - id: service-reference
    desc: References the ngrok tunneling service or client
    crit: notable
    conf: 0.85
    any:
      - id: name-reference
      - id: ngrok-io-domain
      - id: ngrok-com-domain
      - id: ngrok-free-domain
      - id: cli-invocation
