---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - rust
composite_rules:
- id: rust-ngrok-http-tunnel
  desc: Ngrok builder and forwarding call text
  conf: 0.94
  all:
  - id: well-known/dual-use/tunnel/ngrok::rust-ngrok-session-builder
  - id: micro-behaviors/communications/proxy/relay::rust-http-listen-and-forward
  any:
  - id: micro-behaviors/os/security/auth/secret::rust-authtoken-method-call
  - id: micro-behaviors/communications/http/request/target::rust-session-http-endpoint-member
