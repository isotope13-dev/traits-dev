# net-mesh: encrypted mesh overlay CLI. `serve` and `wrap` expose local MCP
# tools to peers admitted by grant, and NAT traversal asks the router to map
# ports. A tunnel/overlay product keeps the dual-use/tunnel home; the sysadmin
# utility bucket yields to dual-use. The product prompts are shipped text, so
# they identify the build even when the PDB name is stripped.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1000000
  size_max: 100000000
  crit: notable
  conf: 0.97

traits:
  - id: pe-pdb-project-name
    desc: Net mesh executable PDB project name
    conf: 0.98
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: net_mesh.pdb

  - id: mcp-serve-identity-error
    desc: Net-mesh MCP operator identity prompt
    if:
      type: text
      section: .rdata
      substr: 'net-mesh mcp serve needs an operator identity'

  - id: typegen-live-discovery-prompt
    desc: Net-mesh live discovery prompt
    if:
      type: text
      section: .rdata
      substr: 'net-mesh typegen live discovery needs a mesh target'

composite_rules:
  - id: net-mesh-cli
    desc: Net-mesh encrypted mesh operator CLI identity
    all:
      - id: mcp-serve-identity-error
      - id: typegen-live-discovery-prompt
