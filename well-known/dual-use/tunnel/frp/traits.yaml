# FRP — Fast Reverse Proxy
# https://github.com/fatedier/frp
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, scripts, systemd-service]
  attack: "T1090.003"
  size_max: 524288000

traits:
  - id: frp-binary-basename
    desc: FRP client/server binary name
    crit: component
    conf: 0.98
    for: [pe, elf, macho]
    if:
      type: basename
      regex: '^frp[cs](\.exe)?$'

  # Go build metadata is a stronger identity signal than a basename. Keep a
  # format-specific matcher because cleave exposes the metadata under the
  # corresponding object (pe.go, elf.go, or macho.go).
  - id: frp-go-module-pe
    desc: FRP Go module identity
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/fatedier/frp

  - id: frp-go-module-elf
    desc: FRP Go module identity
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/fatedier/frp

  - id: frp-go-module-macho
    desc: FRP Go module identity
    crit: notable
    conf: 0.99
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/fatedier/frp

  - id: frp-client-command-pe
    desc: FRP client Go command
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.go.path
      exact: github.com/fatedier/frp/cmd/frpc

  - id: frp-server-command-pe
    desc: FRP server Go command
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.go.path
      exact: github.com/fatedier/frp/cmd/frps

  - id: frp-repo
    desc: FRP GitHub repository reference
    crit: notable
    conf: 0.98
    for: [binaries, scripts]
    if:
      type: text
      regex: 'github\.com/fatedier/frp(/|$)'

  - id: frp-client-admin-ui
    desc: FRP client admin UI title
    crit: notable
    conf: 0.98
    for: [binaries, scripts]
    if:
      type: text
      substr: "<title>frp client admin UI</title>"

  - id: frp-client-description
    desc: FRP client description string
    crit: notable
    conf: 0.97
    for: [binaries, scripts]
    if:
      type: text
      substr: "client of frp (https://github.com/fatedier/frp)"

  - id: frp-server-source-name
    desc: FRP server name in source
    crit: component
    conf: 0.9
    # The file-level size floor exists for the compiled-binary atoms; an frp
    # install script is routinely under 1 KB, so it must not apply here.
    size_min: 1
    for: [shell, python, javascript, php, powershell, batch, systemd-service]
    if:
      type: text
      regex: '\bfrps(\.(ini|toml))?\b'

  - id: frp-client-source-name
    desc: FRP client name in source
    crit: component
    conf: 0.9
    # Batch and systemd units are how frpc is actually deployed on a host —
    # without them these atoms only ever fired from interpreted-language
    # sources, which is not where an frp install script lives.
    size_min: 1
    for: [shell, python, javascript, php, powershell, batch, systemd-service]
    if:
      type: text
      regex: '\bfrpc(\.(ini|toml))?\b'

composite_rules:
  - id: frp-binary-context
    desc: FRP named binary context
    crit: notable
    conf: 0.99
    for: [binaries]
    all:
      - id: frp-binary-basename
    any:
      - id: frp-repo
      - id: frp-client-admin-ui
      - id: frp-client-description

  - id: frp-tool
    desc: FRP reverse proxy tool
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: frp-go-module-pe
      - id: frp-go-module-elf
      - id: frp-go-module-macho
      - id: frp-client-command-pe
      - id: frp-server-command-pe
      - id: frp-binary-context
