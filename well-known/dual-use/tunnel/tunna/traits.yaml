# Identity corroborates the source header with the implemented relay. A
# mention in a report or copied comment alone does not identify Tunna.
defaults:
  platforms: [unix, windows]
  for: [jsp]
traits:
  - id: jsp-author-version-header
    desc: Tunna JSP author and version header
    crit: notable
    conf: 0.99
    size_max: 131072
    if:
      type: text
      regex: 'Tunna JSP webshell v[0-9][^\r\n]{0,48}Nikos Vassakis'
composite_rules:
  - id: jsp-tunnel
    desc: Tunna JSP HTTP tunnel implementation
    crit: notable
    conf: 0.99
    size_max: 131072
    all:
      - id: jsp-author-version-header
      - id: micro-behaviors/communications/proxy/relay::jsp-session-socket-buffer-bridge
