---
defaults:
  platforms:
  - windows
  - unix
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - go
  crit: notable
  conf: 0.86
traits:
- id: cloudflared-binary-name
  desc: cloudflared binary reference
  crit: notable
  conf: 0.88
  if:
    type: literal
    kind: string
    substr: cloudflared
- id: trycloudflare-domain
  desc: References a trycloudflare tunnel domain
  crit: notable
  conf: 0.86
  if:
    type: literal
    kind: string
    substr: trycloudflare
  unless:
  - id: micro-behaviors/os/security/scan/signature::scanner-module-wording-context
  - id: metadata/file/catalog/network::public-suffix-list
  - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
- id: cloudflared-service-install-command
  desc: cloudflared service install subcommand
  crit: notable
  conf: 0.9
  for:
  - scripts
  - systemd-service
  platforms:
  - windows
  - linux
  if:
    type: text
    regex: "(?i)\\bcloudflared(\\.exe)?\\b[^\\r\\n]{0,80}\\bservice\\s+install\\b"
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
- id: cloudflared-systemd-service
  desc: Systemd ExecStart references cloudflared
  crit: notable
  conf: 0.9
  for:
  - systemd-service
  platforms:
  - linux
  if:
    type: text
    regex: "(?i)\\bExecStart=[^\\r\\n]{0,160}\\bcloudflared(\\.exe)?\\b"
composite_rules:
- id: cloudflared-url-flag
  desc: Cloudflared reference with URL forwarding option
  crit: notable
  conf: 0.9
  scope: file
  all:
  - id: well-known/dual-use/tunnel/cloudflared::cloudflared-binary-name
  - id: micro-behaviors/process/info/commandline::url-option-literal
- id: cloudflared-local-service-tunnel
  desc: Cloudflared and URL option clues
  crit: notable
  conf: 0.9
  all:
  - id: well-known/dual-use/tunnel/cloudflared::cloudflared-binary-name
  - id: metadata/lang/natural/vocabulary/tunneling::cloudflared-tunnel-subcommand
  - id: well-known/dual-use/tunnel/cloudflared::cloudflared-url-flag
- id: cloudflared-node-quick-tunnel
  for:
  - javascript
  desc: Cloudflared package and quick-tunnel text
  crit: notable
  conf: 0.9
  all:
  - id: well-known/dual-use/tunnel/cloudflared::cloudflared-node-package-require
  - id: micro-behaviors/communications/proxy/tunnel::localhost-quick-tunnel-call
