# Cloudflare Tunnel's official Windows client is a signed Go networking tool.
# Its Go build metadata is a stronger product identity than generic strings,
# and its generated data section legitimately contains Base64-shaped data.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, go]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: cloudflared-go-path
    desc: Cloudflare Tunnel Go main module path
    for: [pe]
    if:
      type: value
      path: pe.go.path
      exact: github.com/cloudflare/cloudflared/cmd/cloudflared

  - id: cloudflared-go-path-elf
    desc: Cloudflare Tunnel Go main module path
    for: [elf, go]
    if:
      type: value
      path: elf.go.path
      exact: github.com/cloudflare/cloudflared/cmd/cloudflared

composite_rules:
  - id: cloudflared-client
    desc: Cloudflare Tunnel client
    crit: notable
    conf: 0.99
    any:
      - id: cloudflared-go-path
      - id: cloudflared-go-path-elf
