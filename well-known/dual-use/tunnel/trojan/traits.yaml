# Trojan (trojan-gfw) — a proxy whose transport is deliberately
# indistinguishable from ordinary HTTPS.
#
# Source: https://github.com/trojan-gfw/trojan
#
# Dual-use, and the most abuse-salient member of the family already modelled
# in the sibling directories here (shadowsocks, clash, sing-box, gost). Unlike
# a VPN it does not merely encrypt: on a wrong password it serves a real
# website over the same TLS listener, so an observer probing the port sees a
# web server. That anti-probing design is the point of the product for a user
# behind national filtering, and equally the point for an operator who wants a
# covert egress channel that survives DPI and a curious blue team.
#
# Identity only. A trojan build or config on a host is worth an analyst's
# attention -- an unauthorized covert tunnel is an IR finding -- but the
# product is legitimate, so this stays notable and leaves any stronger
# conclusion to composites that add context.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
  attack: T1090
  mbc: B0030
  size_min: 64
  size_max: 500000000

traits:
  - id: repo
    desc: Trojan proxy repository path
    for: [binaries, scripts, dockerfile, github-actions]
    if:
      type: text
      substr: trojan-gfw/trojan

  - id: config-plain-http-response-field
    desc: Trojan TLS fallback response field
    crit: component
    conf: 0.92
    for: [json, chrome-manifest]
    if:
      type: value
      path: ssl.plain_http_response
      exists: true

  - id: config-fast-open-queue-field
    desc: Trojan TCP fast-open queue field
    crit: component
    conf: 0.92
    for: [json, chrome-manifest]
    if:
      type: value
      path: tcp.fast_open_qlen
      exists: true

  - id: container-entrypoint
    desc: Container runs the trojan proxy binary
    for: [dockerfile, github-actions]
    if:
      # `CMD ["trojan", "config.json"]` -- the image exists to run the proxy.
      # Anchored to the instruction so the heavily overloaded word "trojan"
      # cannot match prose, a malware family name, or a path component.
      type: text
      regex: '(?im)^\s*(CMD|ENTRYPOINT)\s*\[\s*"trojan"'

composite_rules:
  - id: config-schema
    desc: Trojan proxy configuration schema
    crit: notable
    conf: 0.98
    for: [json, chrome-manifest]
    all:
      - id: metadata/file/policy/identity::run-type-mode
      - id: config-plain-http-response-field
      - id: config-fast-open-queue-field
