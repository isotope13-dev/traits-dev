# KuaiKuai Cloud Accelerator / YunJiaSu (Cloud Application / CloudM).
# The vendor describes its application acceleration and DDoS protection:
# https://www.kkidc.com/monthly/
# Identity requires the agent's configuration and protocol diagnostics, not
# an application merely using its SDK or mentioning its service URL.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
traits:
  - id: agent-config-name
    desc: Kuai cloud agent configuration name
    if:
      type: text
      section: .rdata
      exact: cloudeconfig.ini
  - id: agent-node-registration-log
    desc: Kuai cloud agent node registration log
    if:
      type: text
      section: .rdata
      substr: 'Yjs Register Def node success, connect Sec node.'
  - id: agent-config-service
    desc: Kuai cloud agent configuration service
    if:
      type: text
      section: .data
      substr: 'http://config.yunjiasu.kkidc.com:'
composite_rules:
  - id: kuai-cloud-agent
    desc: KuaiKuai Cloud Accelerator proxy agent
    conf: 0.99
    all:
      - id: agent-config-name
      - id: agent-node-registration-log
      - id: agent-config-service
