# Generic Rathole identity; CnC-fork evidence remains in the malware catalog.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  size_min: 100000
  size_max: 500000000
  crit: notable

traits:
  - id: rathole-source-path
    desc: Rathole source path marker
    conf: 0.95
    if:
      type: text
      regex: '/rathole/src/(client|protocol|transport|helper)\.rs'
  - id: rathole-namespace
    desc: Rathole crate namespace marker
    conf: 0.95
    if:
      type: text
      regex: 'rathole::(client|transport|protocol|helper)'
  - id: rathole-update-banner
    desc: Rathole update banner string
    conf: 0.95
    if:
      type: text
      substr: 'Please update `rathole`'
  - id: rathole-compile-banner
    desc: Rathole compile-version banner
    conf: 0.9
    if:
      type: text
      substr: 'is compiled in this binary. Please re-compile rathole'
  - id: rathole-noise-protocol-marker
    desc: Rathole Noise protocol marker
    crit: component
    conf: 0.97
    if:
      type: text
      substr: Noise_NK_25519_ChaChaPoly_BLAKE2s
  - id: rathole-local-private-key-field
    desc: Rathole local private-key field
    crit: component
    conf: 0.95
    if:
      type: text
      substr: local_private_key
  - id: rathole-remote-public-key-field
    desc: Rathole remote public-key field
    crit: component
    conf: 0.95
    if:
      type: text
      substr: remote_public_key
  - id: rathole-client-service-config
    desc: Rathole client service config type
    crit: component
    conf: 0.95
    if:
      type: text
      substr: ClientServiceConfig
  - id: rathole-server-service-config
    desc: Rathole server service config type
    crit: component
    conf: 0.95
    if:
      type: text
      substr: ServerServiceConfig

composite_rules:
  - id: rathole-noise-service-config-profile
    desc: Rathole Noise client/server service profile
    crit: notable
    conf: 0.97
    near_bytes: 8192
    all:
      - id: rathole-noise-protocol-marker
      - id: rathole-local-private-key-field
      - id: rathole-remote-public-key-field
      - id: rathole-client-service-config
      - id: rathole-server-service-config
  - id: rathole-banner-pair
    desc: Rathole compile and update banners
    conf: 0.95
    all:
      - id: rathole-update-banner
      - id: rathole-compile-banner
  - id: rathole-base
    desc: Rathole reverse proxy identity markers
    conf: 0.97
    any:
      - id: rathole-source-path
      - id: rathole-namespace
      - id: rathole-noise-service-config-profile
      - id: rathole-banner-pair
