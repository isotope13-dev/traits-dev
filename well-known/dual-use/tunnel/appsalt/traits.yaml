defaults:
  platforms: [windows, linux, macos]
  for: [binaries, scripts]
  crit: notable
  conf: 0.97
  attack: T1090
  size_min: 1
  size_max: 500000000

traits:
  - id: appsalt-initialize-api
    desc: Appsalt SDK initialization API
    if:
      type: text
      word: appsalt_init

  - id: appsalt-consent-api
    desc: Appsalt SDK opt-in API
    if:
      type: text
      word: appsalt_opt_in

  - id: appsalt-sdk-library-name
    desc: Appsalt SDK library name
    if:
      type: text
      regex: '(?i)\bappsalt\.dll\b'

composite_rules:
  - id: appsalt-proxy-sdk
    desc: Appsalt proxy SDK identity
    all:
      - id: appsalt-initialize-api
      - id: appsalt-consent-api
