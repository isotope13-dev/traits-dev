# Tunnel Pizza's tunneld is a developer-facing public tunnel and web terminal.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98
  size_max: 200000000

traits:
  - id: npm-package-name
    desc: Tunnel Pizza tunneld npm package identity
    for: [package.json]
    size_min: 200
    if:
      type: value
      path: name
      regex: '^@tunnel-pizza/tunneld(-[a-z0-9_-]+)?$'

  - id: official-repository
    desc: Tunnel Pizza tunneld repository reference
    for: [package.json]
    size_min: 200
    if:
      type: text
      substr: github.com/tunnel-pizza/tunneld

  - id: tunneld-executable-basename
    desc: Tunnel Pizza tunneld executable basename
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: basename
      regex: '^tunneld(-[a-z0-9_-]+)?(\.exe)?$'

  - id: tunneld-go-module
    desc: Tunnel Pizza tunneld Go module path
    for: [elf, macho, pe]
    size_min: 1000000
    if:
      type: text
      section: .rodata
      substr: github.com/tunnel-pizza/tunneld

composite_rules:
  - id: tunneld-package
    desc: Tunnel Pizza tunneld npm package
    for: [package.json]
    all:
      - id: npm-package-name
      - id: official-repository

  - id: tunneld-binary
    desc: Tunnel Pizza tunneld executable
    for: [elf, macho, pe]
    all:
      - id: tunneld-executable-basename
      - id: tunneld-go-module

  - id: tunneld-client
    desc: Tunnel Pizza tunneld client identity
    any:
      - id: tunneld-package
      - id: tunneld-binary
