# Tunnel Pizza's tunneld is a developer-facing public tunnel and web terminal.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  crit: notable
  conf: 0.98
  size_min: 200

traits:
  - id: npm-package-name
    desc: Tunnel Pizza tunneld npm package identity
    if:
      type: value
      path: name
      exact: '@tunnel-pizza/tunneld-darwin-arm64'

  - id: official-repository
    desc: Tunnel Pizza tunneld repository reference
    if:
      type: text
      substr: github.com/tunnel-pizza/tunneld

composite_rules:
  - id: tunneld-client
    desc: Tunnel Pizza tunneld client identity
    all:
      - id: npm-package-name
      - id: official-repository
