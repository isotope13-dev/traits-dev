# Invoked subcommands identify the tool; the executable name alone does not.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, systemd-service]
  crit: notable
  conf: 0.95
traits:
  - id: mode-command
    desc: Chisel client or server subcommand
    if:
      type: text
      regex: '(?i)\bchisel(\.exe)?\s+(client|server)\b'
