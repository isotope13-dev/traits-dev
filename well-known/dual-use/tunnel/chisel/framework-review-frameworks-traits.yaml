defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: chisel-ref
  size_min: 512
  size_max: 500000000
  desc: Chisel TCP/UDP tunnel tool
  crit: notable
  conf: 0.9
  attack: T1572
  if:
    type: text
    substr: jpillora/chisel
    section: ".text"
# Notable, not suspicious: Kali sets `X-Kali-Package=` on *every* menu entry it
# ships, so this says "the launcher came from a Kali package" and nothing about
# what the launcher runs -- kali-menu's own About/Help entries carry it. That is
# provenance, which is what `notable` is for. The entries that describe an
# offensive tool are caught by the siblings that read the Exec line or the
# comment (`desktop-backdoor-generator-comment` and friends).
- id: chisel-tls-letsencrypt
  size_min: 512
  size_max: 500000000
  desc: References Chisel tlsLetsEncrypt helper
  crit: notable
  if:
    type: text
    substr: tlsLetsEncrypt
    section: ".text"
- id: chisel-tls-keycert
  size_min: 512
  size_max: 500000000
  desc: References Chisel tlsKeyCert helper
  crit: notable
  if:
    type: text
    substr: tlsKeyCert
    section: ".text"
- id: chisel-tunnel-out-ssh
  size_min: 512
  size_max: 500000000
  desc: References Chisel tunnel_out_ssh helper
  crit: notable
  if:
    type: text
    substr: tunnel_out_ssh
    section: ".text"

composite_rules:
- id: chisel-functions
  size_min: 512
  size_max: 500000000
  desc: Chisel TLS/tunnel helper-name fingerprint
  crit: notable
  conf: 0.85
  needs: 3
  any:
  - id: well-known/dual-use/tunnel/chisel::chisel-tls-letsencrypt
  - id: metadata/binary/symbols/name/token::auth-user-name
  - id: metadata/file/profile/tunnel-implementation::go-websocket-handler
  - id: well-known/dual-use/tunnel/chisel::chisel-tls-keycert
  - id: well-known/dual-use/tunnel/chisel::chisel-tunnel-out-ssh
