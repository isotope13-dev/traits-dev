# nelvko/clash-for-linux-install is a popular open-source Clash/mihomo
# installer. Its systemd unit template requests TUN-oriented capabilities
# (including DAC/PTRACE) that look broad out of context.
defaults:
  platforms: [linux]
  for: [shell, markdown, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-repository
    desc: Clash-for-Linux installer upstream repository
    for: [markdown, shell]
    if:
      type: text
      substr: github.com/nelvko/clash-for-linux-install

  - id: readme-title
    desc: Clash-for-Linux installer README title
    for: [markdown]
    if:
      type: text
      substr: 'Linux 一键安装 Clash'

  - id: clashctl-base-dir-marker
    desc: Clashctl installer base directory marker
    for: [shell]
    if:
      type: text
      regex: '\bCLASH_BASE_DIR='

  - id: systemd-unit-basename
    desc: Clash installer systemd unit basename
    for: [shell]
    if:
      type: basename
      exact: systemd.sh

  - id: systemd-placeholder-kernel-desc
    desc: Clash installer systemd placeholder description
    for: [shell]
    if:
      type: text
      substr: 'Description=placeholder_kernel_desc'

composite_rules:
  - id: clash-for-linux-install-context
    desc: Recognized Clash-for-Linux installer package context
    crit: exception
    conf: 0.99
    scope: outer
    for: [shell, markdown, tar, archives, scripts]
    all:
      - id: upstream-repository
      - id: clashctl-base-dir-marker

  - id: clash-systemd-unit-template-context
    desc: Recognized Clash installer systemd unit template
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: systemd-unit-basename
      - id: systemd-placeholder-kernel-desc
