defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: amnezia-client-source-path
    for: [c, cpp, cmake]
    desc: Amnezia VPN client source tree path
    if:
      type: path
      regex: 'github\.com[\\/]amnezia-vpn[\\/]amnezia-client@'

  - id: amnezia-vpn-cmakelists
    for: [cmake]
    desc: AmneziaVPN CMake project
    if:
      type: text
      regex: 'project\(\$\{PROJECT\}\s+VERSION.{0,40}DESCRIPTION\s+"AmneziaVPN"'

  - id: amnezia-vpn-go-module
    for: [pe]
    desc: Amnezia VPN Go module import path
    crit: notable
    conf: 0.98
    size_min: 100000
    size_max: 268435456
    if:
      type: text
      section: .rdata
      regex: 'github\.com/amnezia-vpn/amnezia(wg)?-(windows|go|client)'

  - id: amnezia-vpn-product-claim
    for: [pe]
    desc: Amnezia VPN product or description claim
    crit: notable
    conf: 0.95
    size_min: 100000
    size_max: 268435456
    if:
      type: text
      section: .rdata
      regex: '(?i)Amnezia(WG|VPN)'

composite_rules:
  - id: amnezia-vpn-client-binary
    desc: Recognized Amnezia VPN client binary
    crit: notable
    conf: 0.98
    for: [pe]
    all:
      - id: amnezia-vpn-go-module
      - id: amnezia-vpn-product-claim

  - id: amnezia-client-source-context
    desc: Recognized Amnezia VPN client source package
    crit: notable
    conf: 0.99
    all:
      - id: amnezia-client-source-path
      - id: amnezia-vpn-cmakelists
