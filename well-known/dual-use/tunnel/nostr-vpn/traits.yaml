defaults:
  platforms: [unix, windows]
  for: [cargo.toml, rust, archives]
  crit: notable
  conf: 0.99

traits:
  - id: product-name
    desc: Nostr VPN product name
    for: [elf]
    platforms: [linux]
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rodata
      substr: Nostr VPN

  - id: cli-marker
    desc: Nostr VPN CLI marker
    for: [elf]
    platforms: [linux]
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rodata
      substr: nvpn CLI

  - id: source-tree-marker
    desc: Nostr VPN source-tree marker
    for: [elf]
    platforms: [linux]
    size_min: 1000000
    size_max: 100000000
    if:
      type: text
      section: .rodata
      regex: '/nostr-vpn/nostr-vpn/(crates|src)/'

  - id: workspace-repository
    desc: Nostr VPN workspace repository coordinate
    if:
      type: text
      substr: repository = "https://github.com/mmalmi/nostr-vpn"

  - id: cli-crate-path
    desc: Nostr VPN CLI crate source path
    if:
      type: text
      substr: crates/nostr-vpn-cli

composite_rules:
  - id: cli-identity
    desc: Nostr VPN CLI product identity
    for: [elf]
    platforms: [linux]
    size_min: 1000000
    size_max: 100000000
    all:
      - id: product-name
      - id: cli-marker

  - id: source-tree-identity
    desc: Recognized Nostr VPN source tree
    scope: archive
    all:
      - id: workspace-repository
      - id: cli-crate-path
