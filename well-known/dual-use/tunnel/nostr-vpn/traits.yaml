defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: product-name
    desc: Nostr VPN product name
    if:
      type: text
      section: .rodata
      substr: Nostr VPN

  - id: cli-marker
    desc: Nostr VPN CLI marker
    if:
      type: text
      section: .rodata
      substr: nvpn CLI

  - id: source-tree-marker
    desc: Nostr VPN source-tree marker
    if:
      type: text
      section: .rodata
      regex: '/nostr-vpn/nostr-vpn/(crates|src)/'

composite_rules:
  - id: cli-identity
    desc: Nostr VPN CLI product identity
    all:
      - id: product-name
      - id: cli-marker
