# NHAS reverse_ssh is an open-source SSH reverse-access client.  It is
# dual-use: the identity is useful for triage, while objective rules below
# combine it with forwarding or persistence evidence before raising concern.
# https://github.com/NHAS/reverse_ssh
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, go, binaries, source, scripts]
  attack: T1572,T1021.004
  size_max: 104857600

traits:
  - id: nhas-go-module-elf
    desc: NHAS reverse_ssh Go module identity
    crit: notable
    conf: 0.99
    for: [elf, go]
    if:
      type: value
      path: elf.go.module.path
      exact: github.com/NHAS/reverse_ssh

  - id: nhas-go-module-pe
    desc: NHAS reverse_ssh Go module identity
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      exact: github.com/NHAS/reverse_ssh

  - id: nhas-go-module-macho
    desc: NHAS reverse_ssh Go module identity
    crit: notable
    conf: 0.99
    for: [macho]
    if:
      type: value
      path: macho.go.module.path
      exact: github.com/NHAS/reverse_ssh

  - id: nhas-client-source-internal
    desc: NHAS reverse_ssh internal client package path
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: github.com/NHAS/reverse_ssh/internal/client

  - id: nhas-client-source-command
    desc: NHAS reverse_ssh client command package path
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: github.com/NHAS/reverse_ssh/cmd/client

  - id: nhas-client-source-handlers
    desc: NHAS reverse_ssh client handlers package path
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: github.com/NHAS/reverse_ssh/internal/client/handlers

  - id: nhas-client-source-mux
    desc: NHAS reverse_ssh multiplexing package path
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: github.com/NHAS/reverse_ssh/pkg/mux

  - id: nhas-client-source-keys
    desc: NHAS reverse_ssh client keys package path
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: github.com/NHAS/reverse_ssh/internal/client/keys

  - id: nhas-remote-forward-handler
    desc: NHAS reverse_ssh remote-forward handler
    crit: notable
    conf: 0.98
    for: [elf, macho, pe, go]
    if:
      type: text
      substr: github.com/NHAS/reverse_ssh/internal/client/handlers.StartRemoteForward

  - id: nhas-connect-back-option
    desc: NHAS reverse_ssh connect-back address option
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: "Server connect back address (can be baked in)"

  - id: nhas-server-key-option
    desc: NHAS reverse_ssh server-key fingerprint option
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: "Server public key SHA256 hex fingerprint for auth"

  - id: nhas-unverified-key-warning
    desc: NHAS reverse_ssh unverified-server-key warning
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: "No server key specified, allowing connection to %s"

  - id: nhas-proxy-credentials-option
    desc: NHAS reverse_ssh proxy-credentials option
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: "NTLM proxy credentials in format DOMAIN\\USER:PASS"

  - id: nhas-connect-back-file-option
    desc: NHAS reverse_ssh connect-back file option
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: "Read server connect back address as file"

  - id: nhas-server-key-file-option
    desc: NHAS reverse_ssh server-key file option
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    if:
      type: text
      substr: "Read server public key SHA256 hex fingerprint from file"

composite_rules:
  - id: nhas-reverse-ssh-source-build
    desc: NHAS reverse_ssh client source/build signature
    crit: notable
    conf: 0.99
    for: [elf, pe, macho, go, binaries]
    all:
      - id: nhas-client-source-paths
      - id: nhas-client-config-strings

  - id: nhas-client-source-paths
    desc: NHAS reverse_ssh client package path set
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    any:
      - id: nhas-client-source-internal
      - id: nhas-client-source-command
      - id: nhas-client-source-handlers
      - id: nhas-client-source-mux
      - id: nhas-client-source-keys
    needs: 2

  - id: nhas-client-config-strings
    desc: NHAS reverse_ssh client configuration interface
    crit: notable
    conf: 0.98
    for: [elf, pe, macho, go, binaries]
    any:
      - id: nhas-connect-back-option
      - id: nhas-server-key-option
      - id: nhas-unverified-key-warning
      - id: nhas-proxy-credentials-option
      - id: nhas-connect-back-file-option
      - id: nhas-server-key-file-option
    needs: 2

  - id: nhas-reverse-ssh-client
    desc: NHAS reverse_ssh client
    crit: notable
    conf: 0.99
    for: [elf, pe, macho, go, binaries]
    any:
      - id: nhas-go-module-elf
      - id: nhas-go-module-pe
      - id: nhas-go-module-macho
      - id: nhas-reverse-ssh-source-build
