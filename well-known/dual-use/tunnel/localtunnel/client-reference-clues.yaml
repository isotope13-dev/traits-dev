---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.9
traits:
- id: localtunnel-client-error-text
  desc: Localtunnel client error strings
  if:
    type: text
    regex: Localtunnel (exited|timeout)|localtunnel server returned an error
- id: localtunnel-debug-namespace
  desc: Localtunnel client debug namespace
  if:
    type: text
    substr: localtunnel:client
composite_rules:
- id: localtunnel-client-context
  desc: Localtunnel client integration context
  any:
  - id: well-known/dual-use/tunnel/localtunnel::localtunnel-client-error-text
  - id: micro-behaviors/network/tunnel::localtunnel-provider-selection-text
  - id: well-known/dual-use/tunnel/localtunnel::localtunnel-debug-namespace
  needs: 2
