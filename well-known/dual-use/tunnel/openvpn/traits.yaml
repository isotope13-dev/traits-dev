defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.96
  size_max: 5000000

traits:
  - id: source-path
    desc: OpenVPN source tree path
    crit: notable
    for: [source, scripts, data, c, cpp]
    if:
      type: path
      regex: 'github\.com[\\/]OpenVPN[\\/]openvpn@'

  - id: doc-apk-filename
    desc: Named like an openvpn-doc apk
    crit: notable
    for: [alpine_apk, shell]
    platforms: [linux]
    conf: 0.5
    size_max: 400000000
    if:
      type: path
      basename: true
      regex: '^openvpn-doc-[0-9][^\\/]*\.apk$'

composite_rules:
