defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.95

traits:
  - id: expert-bundle-artifact
    desc: References Tor Expert Bundle archive
    size_min: 32
    size_max: 104857600
    if:
      type: text
      substr: tor-expert-bundle-


  # The Linux daemon's banner is matched by the micro-behaviors atom
  # referenced from the tor-version-banner exception composite below; this
  # file keeps the Windows-specific fingerprints, which can carry the section
  # filter well-known/ binary matchers require.

  - id: windows-tor-version-banner
    desc: Tor Windows native runtime version banner
    crit: notable
    conf: 0.99
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    size_max: 20000000
    if:
      type: text
      section: .rdata
      substr: "Tor version %s."

  - id: windows-ntor-protocol-constant
    desc: Tor Windows runtime NTOR protocol constant
    crit: notable
    conf: 0.99
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    size_max: 20000000
    if:
      type: text
      section: .rdata
      exact: ntor-curve25519-sha256-1

composite_rules:
  # The Linux banner lives in the micro-behaviors tor atom below
  # (well-known/ binary matchers must carry a section filter, and distro
  # builds ship the daemon stripped, without section headers). The identity
  # stays referenceable at this id for the consumers that suppress on the
  # genuine Tor daemon: the daemon's own version format string plus the
  # NTOR handshake protocol constant it implements.
  - id: tor-version-banner
    desc: Official Tor version banner
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tor::tor-daemon-version-banner
      - id: micro-behaviors/communications/proxy/tor::tor-ntor-protocol-constant

  - id: windows-tor-native-runtime
    desc: MinGW Tor runtime with its version and NTOR protocol markers
    crit: exception
    conf: 0.99
    all:
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: windows-tor-version-banner
      - id: windows-ntor-protocol-constant
