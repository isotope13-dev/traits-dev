defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.95

traits:
  - id: expert-bundle-artifact
    desc: References Tor Expert Bundle archive
    size_min: 32
    size_max: 104857600
    if:
      type: text
      substr: tor-expert-bundle-

  - id: project-archive-host
    desc: References Tor Project archive host
    size_min: 32
    size_max: 104857600
    if:
      type: text
      substr: archive.torproject.org
