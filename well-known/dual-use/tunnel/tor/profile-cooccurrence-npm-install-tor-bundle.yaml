defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: npm-install-hook-tor-bundle-reference
    desc: npm install hook and Tor bundle reference
    crit: notable
    conf: 0.97
    scope: archive
    for: [binaries, '!dex', scripts, '!jcl', npm, tar]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: well-known/dual-use/tunnel/tor::expert-bundle-artifact
