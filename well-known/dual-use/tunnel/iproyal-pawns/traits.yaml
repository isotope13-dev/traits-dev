defaults:
  platforms: [windows, linux, android]
  for: [binaries, scripts]
  crit: notable
  conf: 0.95
  attack: T1090
  size_min: 1
  size_max: 500000000

traits:
  - id: pawns-sdk-library-name
    desc: IPRoyal Pawns SDK library name
    if:
      type: text
      regex: '(?i)\bpawns-sdk\.dll\b'

  - id: pawns-main-routine-api
    desc: startMainRoutine API name
    crit: component
    if:
      type: text
      word: startMainRoutine

  - id: pawns-product-brand
    desc: IPRoyal Pawns product identity
    if:
      type: text
      regex: '(?i)\bIPROYAL PAWNS\b|\bPAWNS_API_URL\b|go-pawns/mole'

composite_rules:
  - id: pawns-windows-sdk-loader
    desc: IPRoyal Pawns Windows SDK loader API pair
    all:
      - id: pawns-sdk-library-name
      - id: pawns-main-routine-api
    near_bytes: 2048

  - id: pawns-proxy-sdk
    desc: IPRoyal Pawns proxy SDK identity
    any:
      - id: pawns-product-brand
      - id: pawns-windows-sdk-loader
