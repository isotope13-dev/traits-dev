# TunnelMate is a Cloudflare Quick Tunnel manager with CLI, Interactive TUI,
# Daemon IPC, and Telegram Bot.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: TunnelMate PyPI package identity
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: tunnelmate-cli

  - id: wheel-distribution
    desc: TunnelMate wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: tunnelmate_cli

  - id: product-summary
    desc: TunnelMate product summary
    for: [pkginfo, text]
    if:
      type: text
      regex: '(?i)Cloudflare Quick Tunnel manager with CLI.{0,60}Telegram Bot'

  - id: telegram-bot-module
    desc: TunnelMate Telegram bot module
    for: [python]
    if:
      type: text
      substr: 'logging.getLogger("tunnelmate.bot")'

  - id: bot-set-token-command
    desc: TunnelMate bot set-token command text
    for: [python, text]
    if:
      type: text
      substr: "tunnelmate bot set-token"

composite_rules:
  - id: tunnelmate-tunnel-manager-context
    desc: TunnelMate tunnel manager context
    crit: exception
    conf: 0.99
    for: [whl, python, pkginfo]
    scope: archive
    any:
      - id: package-name
      - id: wheel-distribution
      - id: product-summary
      - id: telegram-bot-module
      - id: bot-set-token-command
