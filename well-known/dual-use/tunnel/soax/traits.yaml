defaults:
  platforms: [windows, linux, macos]
  for: [binaries, scripts]
  crit: notable
  conf: 0.97
  attack: T1090
  size_min: 1
  size_max: 500000000

traits:
  - id: livenet-initialize-api
    desc: SOAX LiveNet SDK initialization API
    if:
      type: text
      word: liblivenet_init

  - id: livenet-user-consent-api
    desc: SOAX LiveNet SDK user-consent API
    if:
      type: text
      word: liblivenet_set_user_consent

  - id: livenet-sdk-library-name
    desc: SOAX LiveNet SDK library name
    if:
      type: text
      regex: '(?i)\bliblivenet(_amd64)?\.dll\b'

composite_rules:
  - id: soax-proxy-sdk
    desc: SOAX LiveNet proxy SDK identity
    all:
      - id: livenet-initialize-api
      - id: livenet-user-consent-api
