# 7zb Sovite: a .NET port-exposure tool. It relays a local TCP port through a
# public relay, maps the port on the router with UPnP, and can register itself as an
# auto-start service. Those are remote-access capabilities, so the atoms are
# notable identity only. The tool is not hostile by itself; the operator's
# relay and port choices decide the use.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
  attack: T1572

traits:
  - id: sovite-product-identity
    desc: 7zb Sovite port relay product name
    if:
      type: text
      substr: 7zb Sovite

  - id: sovite-default-public-relay
    desc: Default public relay host bore.pub
    if:
      type: text
      substr: bore.pub

  - id: sovite-relay-environment-config
    desc: Relay host and secret environment settings
    if:
      type: text
      regex: 'SHGA3_RELAY_(HOST|SECRET|TLS)'
