# Sauce Connect is Sauce Labs' legitimate tunnel client for routing local test
# traffic to its cloud browser infrastructure. Its heartbeat, SOCKS, and helper
# process support can otherwise resemble a native backdoor when viewed without
# the product identity.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000

traits:
  - id: version-banner
    desc: Sauce Connect version banner
    if:
      type: text
      regex: 'Sauce Connect [0-9]+\.[0-9]+\.[0-9]+([, ]|$)'
      section: .rodata

  - id: official-rest-endpoint
    desc: Sauce Labs REST endpoint
    if:
      type: text
      exact: https://saucelabs.com/rest/v1
      section: .rodata

composite_rules:
  - id: client
    desc: Sauce Connect tunnel client
    all:
      - id: version-banner
      - id: official-rest-endpoint
