# Sauce Connect is Sauce Labs' legitimate tunnel client for routing local test
# traffic to its cloud browser infrastructure. Its heartbeat, SOCKS, and helper
# process support can otherwise resemble a native backdoor when viewed without
# the product identity.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 100000

traits:
  - id: version-banner-linux
    desc: Sauce Connect version banner (Linux ELF)
    platforms: [unix]
    for: [elf]
    if:
      type: text
      regex: 'Sauce Connect [0-9]+\.[0-9]+\.[0-9]+([, ]|$)'
      section: .rodata

  - id: version-banner-windows
    desc: Sauce Connect version banner (Windows PE)
    platforms: [windows]
    for: [pe]
    if:
      type: text
      regex: 'Sauce Connect [0-9]+\.[0-9]+\.[0-9]+([, ]|$)'
      section: .rdata

  - id: version-banner-macos
    desc: Sauce Connect version banner (macOS Mach-O)
    platforms: [macos]
    for: [macho]
    if:
      type: text
      regex: 'Sauce Connect [0-9]+\.[0-9]+\.[0-9]+([, ]|$)'
      section: __TEXT,__cstring

  - id: official-rest-endpoint-linux
    desc: Sauce Labs REST endpoint (Linux ELF)
    platforms: [unix]
    for: [elf]
    if:
      type: text
      exact: https://saucelabs.com/rest/v1
      section: .rodata

  - id: official-rest-endpoint-windows
    desc: Sauce Labs REST endpoint (Windows PE)
    platforms: [windows]
    for: [pe]
    if:
      type: text
      exact: https://saucelabs.com/rest/v1
      section: .rdata

  - id: official-rest-endpoint-macos
    desc: Sauce Labs REST endpoint (macOS Mach-O)
    platforms: [macos]
    for: [macho]
    if:
      type: text
      exact: https://saucelabs.com/rest/v1
      section: __TEXT,__cstring

composite_rules:
  - id: version-banner
    desc: Sauce Connect version banner
    any:
      - id: version-banner-linux
      - id: version-banner-windows
      - id: version-banner-macos

  - id: official-rest-endpoint
    desc: Sauce Labs REST endpoint
    any:
      - id: official-rest-endpoint-linux
      - id: official-rest-endpoint-windows
      - id: official-rest-endpoint-macos

  - id: client
    desc: Sauce Connect tunnel client
    all:
      - id: version-banner
      - id: official-rest-endpoint
