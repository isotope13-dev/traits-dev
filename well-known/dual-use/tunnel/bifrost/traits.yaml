# Bifrost is an open-source, MIT-licensed HTTP/HTTPS/SOCKS5 proxy
# (bifrost-proxy/bifrost, whistle-inspired debugging proxy). Its management
# API declares an X-Client-Id header in its CORS policy and its relay
# protocol addresses client instances by ID: first-party protocol use in a
# proxy, not a libcurl C2 trigger.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 100000
  for: [elf]

traits:
  - id: management-cors-marker
    desc: Bifrost management API CORS marker header
    if:
      type: text
      substr: "X-Bifrost-CSRF"
      section: .rodata
  - id: proxy-crate-path
    desc: Bifrost proxy crate source path
    if:
      type: text
      substr: "crates/bifrost-proxy/"
      section: .rodata

composite_rules:
  - id: client
    desc: Bifrost proxy client
    all:
      - id: management-cors-marker
      - id: proxy-crate-path
