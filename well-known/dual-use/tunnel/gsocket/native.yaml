defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  - id: native-authcookie-setting
    desc: GSocket auth-cookie environment setting
    if:
      type: text
      exact: _GSOCKET_WANT_AUTHCOOKIE

  - id: native-greetings-setting
    desc: GSocket greetings environment setting
    if:
      type: text
      exact: GSOCKET_NO_GREETINGS

composite_rules:
  - id: native-client
    desc: GSocket native relay client
    ref: https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/
    all:
      - id: native-authcookie-setting
      - id: native-greetings-setting
