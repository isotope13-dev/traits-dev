# GSocket / gs-netcat — Global Socket overlay used to link hosts across private
# networks and bypass firewalls. Dual-use; C2 intent comes from shell bind/-e.
defaults:
  platforms: [unix, windows]
  for: [shell, scripts, elf, pe]
  attack: T1090,T1572
  mbc: B0030
  crit: notable
  conf: 0.94
  size_min: 32
  size_max: 500000000

traits:
  - id: gs-netcat-invocation
    desc: Invokes the gs-netcat Global Socket client
    if:
      type: text
      regex: '(?i)(^|[;&|\r\n\s])gs-netcat\b'

  - id: gsocket-invocation
    desc: Invokes the gsocket helper command
    if:
      type: text
      regex: '(?i)(^|[;&|\r\n\s])gsocket\b'

  - id: gs-netcat-listen-flag
    desc: gs-netcat listens for inbound overlay peers
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bgs-netcat\b[^\r\n]{0,100}\s-l\b'

  - id: gs-netcat-secret-flag
    desc: gs-netcat uses a shared -s secret
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgs-netcat\b[^\r\n]{0,120}-s\s+\S+'

  - id: gs-netcat-exec-shell
    desc: gs-netcat executes a shell via -e
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bgs-netcat\b[^\r\n]{0,120}-e\s+(/bin/)?(ba|da|z|k)?sh\b'

composite_rules:
  - id: gsocket-overlay-tool
    desc: GSocket / gs-netcat overlay tooling
    crit: notable
    conf: 0.94
    any:
      - id: gs-netcat-invocation
      - id: gsocket-invocation

  - id: gsocket-secret-listener
    desc: gs-netcat secret-authenticated listener
    crit: suspicious
    conf: 0.96
    all:
      - id: gs-netcat-listen-flag
      - id: gs-netcat-secret-flag
    near_lines: 12

  - id: gsocket-reverse-shell-overlay
    desc: gs-netcat overlay reverse shell
    crit: hostile
    conf: 0.97
    all:
      - id: gs-netcat-exec-shell
      - id: gs-netcat-secret-flag
    any:
      - id: gs-netcat-listen-flag
      - id: gsocket-invocation
    near_lines: 20

  # Deploy-script shape: gs-netcat is installed, persisted through cron /
  # systemd / rc.local, and started under a hidden argv[0]. The overlay
  # composite above needs a literal `-e shell` command line, which deploy
  # scripts never carry: they pass `-liqD` through the environment and let
  # the tool spawn the login shell itself. No near_lines: an installer
  # legitimately spreads these across functions.
  - id: gsocket-hidden-persistent-shell
    desc: gs-netcat persists under a hidden identity
    crit: hostile
    conf: 0.95
    all:
      - id: gs-netcat-invocation
      - id: objectives/evasion/masquerade/process/name::hidden-argv0-dispatch
    any:
      - id: objectives/persistence/system/cron/schedule::pipe-crontab
      - id: objectives/persistence/system/service/systemd::systemctl-enable
      - id: objectives/persistence/system/init/boot::etc-rc-local
