# Sidedoor is a configurable SSH connection and tunnel daemon. Its packaged
# systemd unit is normal service configuration; identify it as dual-use
# software without treating the tunnel or autostart as evidence of compromise.
defaults:
  platforms: [linux]
  for: [systemd]
  crit: notable
  conf: 0.96

traits:
  - id: executable
    desc: Sidedoor executable in systemd service
    if:
      type: value
      path: service.exec_start
      regex: '(^|/)sidedoor\b'

  - id: packaged-envfile
    desc: Sidedoor package environment file
    if:
      type: text
      substr: 'EnvironmentFile=-/etc/default/sidedoor'

  - id: dedicated-user
    desc: Dedicated sidedoor service account
    if:
      type: text
      regex: '(?m)^User=sidedoor\s*$'

  - id: packaged-manpage
    desc: Sidedoor manual page reference
    if:
      type: text
      substr: 'Documentation=man:sidedoor(1)'

composite_rules:
  - id: systemd-service
    desc: Sidedoor SSH tunnel systemd service
    all:
      - id: executable
      - id: packaged-envfile
      - id: dedicated-user
