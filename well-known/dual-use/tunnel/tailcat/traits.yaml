# tailcat — Tailscale's "netcat over the data plane, without the control
# plane". One side runs `tailcat serve`/`listen` and prints a compact,
# "tc"-prefixed base64url address; the other side passes that address to
# `tailcat forward`/`browse` and gets a WireGuard-encrypted pipe between the
# two, bootstrapped over DERP and upgraded to direct UDP. No account, no
# device registration, no admin console.
#
# That is exactly what makes it attractive as a C2 transport: the tc-address
# is the only endpoint identifier, so there is no operator domain or IP to
# block or pivot on from network logs. The product is dual-use — these atoms
# state identity only (notable). The C2-abuse convictions live in
# objectives/command-and-control/channel/tunnel/tailscale/tailcat.yaml, which
# pairs this identity with covert deployment (hidden execution, user-writable
# staging, Defender exclusion).
defaults:
  platforms: [unix, windows]
  for: [c, cpp, go, go.mod, pe, dll, scripts]
  crit: notable
  conf: 0.9
  # Smallest real carrier is a one-line launcher (`tailcat forward tc... N:M`);
  # the largest is an implant bundling the ~30 MB Go tailcat build as a
  # resource, so leave generous headroom above it.
  size_min: 48
  size_max: 200000000

traits:
  - id: tailcat-binary-name
    desc: tailcat connector executable name
    if:
      type: text
      regex: '(?i)\btailcat\.exe\b'

  - id: tailcat-subcommand
    desc: tailcat tunnel subcommand invocation
    # The CLI driven as a tunnel: `tailcat [serve|forward|browse|listen] ...`.
    if:
      type: text
      regex: '(?i)\btailcat(\.exe)?\s+(serve|forward|browse|listen)\b'

  - id: tailcat-forward-address
    desc: tailcat forward to a peer address
    # A tailcat subcommand immediately followed by a "tc"-prefixed base64url
    # ConnInfo address — i.e. dialing a specific control-plane-free peer, the
    # only endpoint identifier the protocol exposes. Anchored on the
    # subcommand so the long base64 tail is not matched on its own.
    if:
      type: text
      regex: '(?i)\b(forward|serve|browse)\b[''"\s,]{1,4}tc[A-Za-z0-9_-]{40,}'

  - id: tailcat-module-path
    desc: tailcat Go module import path
    for: [go, go.mod]
    if:
      type: text
      substr: github.com/tailscale/tailcat

  - id: tailcat-derpmap-url
    desc: tailcat default DERP map URL
    if:
      type: text
      substr: tailcat.dev/derpmap.json

  - id: tailcat-listen-banner
    desc: tailcat server address banner
    if:
      type: text
      substr: 'Server listening with new address: tc'

composite_rules:
  - id: tailcat-tool-identity
    desc: tailcat data-plane tunnel tool present
    crit: notable
    conf: 0.95
    any:
      - id: tailcat-subcommand
      - id: tailcat-module-path
      - id: tailcat-derpmap-url
      - id: tailcat-listen-banner
      - id: tailcat-binary-name
