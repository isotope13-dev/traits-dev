# cloud-tailscale (github.com/Dasannn/Cloud-Tailscale) — an open-source MIT CLI
# that joins the user's own tailnet from a cloud coding-agent container and
# opens SSH/TCP to their devices. It launches the official tailscaled with
# `--state=mem:` (the container is ephemeral), `--no-logs-no-support` (its own
# writer masks secrets in the log) and an auth key read from a private file.
# That is the documented purpose, so the generic Tailscale tradecraft traits
# are downgraded here; the hostile tunnel composites still fire on their extra
# legs.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Package is cloud-tailscale
    size_min: 1
    if:
      type: value
      path: name
      exact: cloud-tailscale

  - id: upstream-repository
    desc: Package repository is Dasannn/Cloud-Tailscale
    size_min: 1
    if:
      type: value
      path: repository.url
      substr: Dasannn/Cloud-Tailscale

composite_rules:
  - id: package-context
    desc: Archive is the cloud-tailscale agent CLI
    crit: exception
    scope: archive
    for: [package.json, npm, tar, javascript]
    all:
      - id: package-name
      - id: upstream-repository
