# Agentics Companion — Tailscale-derived mesh VPN companion daemon
# (agentics.co.za) that probes cloud metadata endpoints during bootstrap.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, dll, go]
  crit: notable
  conf: 0.98
  size_min: 1000000
  size_max: 104857600

traits:
  - id: agentics-router-module
    desc: agentics.co.za Tailscale router module path
    if:
      type: text
      substr: agentics.co.za/router/

  - id: tailscale-hujson-module
    desc: Tailscale hujson dependency path
    if:
      type: text
      substr: github.com/tailscale/hujson

composite_rules:
  - id: agentics-tailscale-companion
    desc: Agentics Tailscale mesh VPN companion daemon
    crit: exception
    conf: 0.99
    all:
      - id: agentics-router-module
    any:
      - id: tailscale-hujson-module
      - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
