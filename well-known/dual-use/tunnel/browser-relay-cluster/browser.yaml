# Shared proxy-extension infrastructure and message vocabulary identify a
# software cluster; they do not establish interception or deception.
defaults:
  conf: 0.99
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: proxy-farm-domain-vpn-brands
  desc: Proxy cluster VPN-branded relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(vaultvpn|atlasvpn|zhuzhvpn|vpnfasters)\.space\b
- id: proxy-farm-domain-shield-brands
  desc: Proxy cluster shield-branded relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(silashield|zenshield|nimbusshield|routeshield)\.space\b
- id: proxy-farm-domain-tunnel-proxy-brands
  desc: Proxy cluster tunnel-branded relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(shieldtunnel|turbotunnel|skyproxy|ironproxy)\.space\b
- id: proxy-farm-domain-prime-mur-pauk-horizon
  desc: Prime/mur/pauk/horizon relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(primeproxy|murvpn|pauktun|horizonguard)\.space\b
- id: proxy-farm-domain-security-brands
  desc: Proxy cluster security-branded relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(echosecure|bezopasnet|routekeeper|stealthpath)\.space\b
- id: proxy-farm-domain-pulse-mask-speed-cloud
  desc: Known pulse/mask/speed/cloud relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(securepulse|maskirovka|skorostvpn|cloudmask)\.space\b
- id: proxy-farm-domain-neon-sverch-route
  desc: Known neon/sverch/netroute relay domains
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(neoncloak|sverchvpn|netroutehub)\.space\b
- id: proxy-farm-domain-online-vpn-brands
  desc: Proxy cluster relay domains under online
  crit: notable
  if:
    type: text
    case_insensitive: true
    regex: \b(gusenvpn|spidervpn)\.online\b
- id: relay-engage-action
  desc: Proxy cluster relay engage action
  crit: notable
  if:
    type: text
    substr: RELAY_ENGAGE
- id: relay-release-action
  desc: Proxy cluster relay release action
  crit: notable
  if:
    type: text
    substr: RELAY_RELEASE
- id: relay-poll-action
  desc: Proxy cluster relay status action
  crit: notable
  if:
    type: text
    substr: RELAY_POLL
composite_rules:
- id: fixed-socks5-proxy-farm-relay
  desc: SOCKS5 relay references shared proxy-extension domains
  crit: notable
  all:
  - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
  any:
  - id: proxy-farm-domain-vpn-brands
  - id: proxy-farm-domain-shield-brands
  - id: proxy-farm-domain-tunnel-proxy-brands
  - id: proxy-farm-domain-prime-mur-pauk-horizon
  - id: proxy-farm-domain-security-brands
  - id: proxy-farm-domain-pulse-mask-speed-cloud
  - id: proxy-farm-domain-neon-sverch-route
  - id: proxy-farm-domain-online-vpn-brands
- id: fixed-socks5-install-redirect
  desc: SOCKS5 relay uses shared extension message actions
  crit: notable
  all:
  - id: relay-engage-action
  - id: relay-release-action
  - id: relay-poll-action
  - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
  - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
