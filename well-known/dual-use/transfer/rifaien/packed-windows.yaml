# Rifaien self-submission utility. Its banner and multipart submission
# mechanics identify the program; they do not establish unauthorized spread.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 32768
  size_max: 4194304

traits:
  - id: rifaien-packed-banner
    desc: Rifaien self-upload agent version banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: rifaien yanje
      section: UPX1

  - id: rifaien-unpacked-banner
    desc: Rifaien self-upload banner in unpacked build
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: rifaien yanje
      section: .rdata

composite_rules:
  - id: rifaien-self-upload-exception
    desc: Rifaien executable self-submission utility context
    crit: exception
    conf: 0.98
    all:
      - id: rifaien-packed-banner
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
  - id: rifaien-self-submission-utility
    desc: Rifaien executable self-submission utility
    crit: notable
    conf: 0.98
    all:
      - id: rifaien-packed-banner
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
    any:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
  - id: rifaien-unpacked-self-submission-utility
    desc: Rifaien unpacked self-submission utility
    crit: notable
    conf: 0.98
    all:
      - id: rifaien-unpacked-banner
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
