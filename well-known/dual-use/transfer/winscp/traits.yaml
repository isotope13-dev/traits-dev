defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.95
  size_min: 10000000
  size_max: 50000000
traits:
  - id: exe-basename
    crit: notable
    desc: WinSCP executable or console filename
    if:
      type: path
      basename: true
      regex: '^winscp\.(exe|com)$'
      case_insensitive: true
  - id: product-string
    crit: notable
    desc: WinSCP product string
    if:
      type: text
      word: WinSCP
      section: .rsrc
  - id: msi-product-subject
    desc: WinSCP installer subject names the product
    crit: notable
    for: [oledoc]
    if:
      type: value
      path: office.subject
      exact: WinSCP
composite_rules:
  - id: app
    desc: WinSCP file transfer client
    crit: notable
    conf: 0.98
    all:
      - id: exe-basename
      - id: product-string
  # The WiX installer names the product as its subject. The verified Authenticode
  # signer of the embedded WinSCP.exe ties that name to the vendor. A repack
  # signed by anyone else lacks this leg and stays visible to masquerade rules.
  - id: msi-installer
    desc: WinSCP installer carries its verified WinSCP client
    crit: exception
    conf: 0.97
    scope: outer
    for: [oledoc, pe]
    all:
      - id: msi-product-subject
      - id: app
      - id: metadata/signature/verified/signer::martin-p-ikryl-36393872
