defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.99
  size_min: 1024
traits:
  - id: croc-cli-implementation
    desc: Croc file-transfer CLI implementation
    if:
      type: text
      section: any
      # Executable CLI implementation, rather than a project URL or a generic
      # PAKE/Tailscale dependency shared by unrelated programs.
      regex: 'github\.com/schollz/croc/v[0-9]+/src/cli\.(RunContext|newApp)\b'
