defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.98

traits:
  # The server's own page title binds the product to its Go version field.
  # A documentation link or a mention of goshs is not product identity.
  # Identity does not suppress command, credential, or shell observations.
  - id: web-template
    desc: goshs file server HTML template
    if:
      type: text
      regex: '<title>\s*goshs\s+\{\{\s*\.GoshsVersion\s*\}\}'
      exclude_html_comments: true
