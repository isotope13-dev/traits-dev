# rclone — open-source cross-cloud sync tool widely abused by ransomware
# affiliates (Qilin/Agenda, BlackBasta, ALPHV/BlackCat, Akira, LockBit)
# for double-extortion data exfiltration before encryption. Detected by
# the binary's distinctive package paths and command vocabulary.
defaults:
  platforms: [windows, unix]
  attack: T1567.002
  mbc: B0030
  size_min: 256
  size_max: 500000000
traits:
  # Presence of a rclone Go subpackage identifies a dual-use tool (rclone itself is
  # ubiquitous legitimate software) — analyst-relevant but not suspicious on its
  # own (cf. rclone-config-flag, notable). Exfil intent comes from composites that
  # pair rclone with C2/staging/scheduling context. Require a subpackage path so
  # a documentation link such as https://github.com/rclone/rclone is not called
  # a Go package.
  - id: rclone-package-path
    desc: rclone Go subpackage path
    crit: notable
    conf: 0.97
    for: [pe, dll, elf, macho, batch, powershell, shell]
    if:
      type: text
      regex: 'github\.com/rclone/rclone(/v[0-9]+)?/[A-Za-z0-9_.-]+'
  - id: rclone-release-archive-url
    desc: rclone release archive URL
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'downloads\.rclone\.org/[^\s]{1,200}\.zip'
  - id: rclone-release-helper-call
    desc: Runs an rclone release helper
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawnSync$'
  - id: rclone-release-executable-mode
    desc: Marks an rclone release executable
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      word: chmod
  - id: rclone-config-flag
    desc: rclone command selects a configuration file
    crit: notable
    conf: 0.85
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brclone(\.exe)?\b[^\r\n]{0,80}(--|–)config(=|\s+)\S{1,80}'
  - id: rclone-copy-cmd
    desc: rclone copy/sync/move command
    crit: notable
    conf: 0.85
    for: [batch, powershell, shell]
    if:
      type: text
      regex: '\brclone(\.exe)?\s+(copy|sync|move)\b'
      case_insensitive: true

  - id: rclone-config-command
    desc: rclone script invokes the configuration command
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '\brclone(\.exe)?\s+config(\s+show)?\b'
      case_insensitive: true

  - id: rclone-ignore-existing-flag
    desc: rclone command skips existing destination files
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brclone(\.exe)?\b[^\r\n]{0,240}(--|–)ignore-existing\b'

  - id: rclone-auto-confirm-flag
    desc: rclone command auto-confirms prompts
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brclone(\.exe)?\b[^\r\n]{0,240}(--|–)auto-confirm\b'

  - id: rclone-multistream-flag
    desc: rclone command enables multi-stream transfers
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brclone(\.exe)?\b[^\r\n]{0,240}(--|–)multi-thread-streams\b'

  - id: rclone-transfer-count-flag
    desc: rclone command sets concurrent transfer count
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brclone(\.exe)?\b[^\r\n]{0,240}(--|–)transfers\b'

  - id: rclone-no-certificate-flag
    desc: rclone command skips TLS certificate checks
    crit: suspicious
    conf: 0.93
    for: [scripts]
    if:
      type: text
      regex: '(?i)\brclone(\.exe)?\b[^\r\n]{0,240}(--|–)no-check-certificate\b'

  - id: rclone-listing-cmd
    desc: rclone ls/lsd/ncdu command
    crit: notable
    conf: 0.8
    for: [batch, powershell, shell]
    if:
      type: text
      regex: '\brclone\s+(ls|lsd|ncdu)\b'
  - id: rclone-conf-basename
    desc: rclone configuration filename
    crit: component
    conf: 0.95
    for: [data]
    if:
      type: path
      basename: true
      exact: rclone.conf
  - id: rclone-conf-archive-member
    desc: Archive contains rclone.conf
    crit: notable
    conf: 0.9
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)rclone\.conf$'
    downgrade:
      any:
        - id: metadata/package/files/included::github-module-zip-basename
        - id: well-known/tool/sysadmin/kubernetes/iac/
  - id: rclone-conf-remote-section
    desc: rclone config remote section
    crit: component
    conf: 0.9
    for: [data]
    if:
      type: raw
      regex: '(?m)^\[[A-Za-z0-9_. -]{1,80}\]\r?\n'
  - id: rclone-conf-remote-type
    desc: rclone config remote type field
    crit: component
    conf: 0.9
    for: [data]
    if:
      type: raw
      regex: '(?m)^type\s*=\s*[a-z][a-z0-9_-]{1,30}\b'
  - id: rclone-conf-credential-field
    desc: rclone config credential-like field
    # This is only a field fragment; the surrounding rclone config identity
    # and remote shape are supplied by rclone-config-with-credentials.
    crit: component
    conf: 0.9
    for: [data]
    if:
      type: raw
      # Avoid matching ordinary TOML/package metadata such as `keywords`.
      regex: '(?mi)^(pass|token|secret)[A-Za-z_]*\s*=\s*\S{8,}'
  - id: rclone-release-archive-path
    desc: rclone versioned release archive path
    crit: notable
    for: [archives, binaries]
    if:
      type: path
      regex: '(?i)rclone-v[0-9][^\\/]*[\\/](rclone|git-log\.txt)'
  - id: rclone-release-readme-path
    desc: rclone release README documentation path
    crit: notable
    for: [text, documents, archives]
    if:
      type: path
      regex: '(?i)rclone-v[0-9][^\\/]*[\\/]README\.(txt|html|md)$'
  - id: rclone-release-readme-banner
    desc: rclone User Manual documentation banner
    crit: notable
    for: [text, documents]
    if:
      type: text
      substr: rclone - manage files on cloud storage
composite_rules:
  - id: rclone-transfer-operator-options
    desc: rclone script uses multiple transfer options
    crit: notable
    conf: 0.93
    for: [scripts]
    needs: 2
    any:
      - id: rclone-ignore-existing-flag
      - id: rclone-auto-confirm-flag
      - id: rclone-multistream-flag
      - id: rclone-transfer-count-flag
      - id: rclone-no-certificate-flag

  - id: rclone-official-release-downloader
    desc: Official rclone release downloader
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: rclone-release-archive-url
      - id: rclone-release-helper-call
      - id: rclone-release-executable-mode
  - id: rclone-config-with-credentials
    desc: rclone config contains remote credentials
    crit: suspicious
    conf: 0.94
    all:
      - id: rclone-conf-basename
      - id: rclone-conf-remote-section
      - id: rclone-conf-remote-type
      - id: rclone-conf-credential-field
  - id: rclone-tool
    desc: rclone cross-cloud sync tool
    crit: notable
    conf: 0.95
    any:
      - id: well-known/dual-use/transfer/rclone::rclone-conf-archive-member
      - id: well-known/dual-use/transfer/rclone::rclone-conf-basename
      - id: well-known/dual-use/transfer/rclone::rclone-config-flag
      - id: well-known/dual-use/transfer/rclone::rclone-copy-cmd
      - id: well-known/dual-use/transfer/rclone::rclone-listing-cmd
      - id: well-known/dual-use/transfer/rclone::rclone-package-path
  - id: rclone-release-documentation-context
    desc: rclone official release documentation
    crit: exception
    conf: 0.99
    scope: outer
    for: [text, archives]
    all:
      - id: rclone-release-readme-path
      - id: rclone-release-readme-banner
  - id: rclone-official-release-archive
    desc: Official rclone release archive
    crit: notable
    conf: 0.98
    scope: archive
    for: [archives]
    any:
      - id: rclone-release-archive-path
      - id: rclone-release-readme-path
      - id: rclone-package-path
