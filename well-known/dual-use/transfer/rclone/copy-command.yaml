defaults:
  platforms: [windows, unix]
  size_min: 256
  size_max: 500000000
traits:
  - id: rclone-copy-cmd
    desc: rclone copy/sync/move command
    crit: notable
    conf: 0.85
    for: [batch, powershell, shell]
    if:
      type: text
      regex: '\brclone(\.exe)?\s+(copy|sync|move)\b'
      case_insensitive: true

