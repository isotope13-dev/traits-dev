defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 20971520

traits:
  - id: aria2c-basename
    desc: aria2c downloader binary
    if:
      type: path
      basename: true
      regex: '^aria2c(-win)?\.exe$'
      case_insensitive: true

  - id: aria2-downloader-context
    desc: Recognized aria2c downloader binary context
    if:
      id: aria2c-basename
