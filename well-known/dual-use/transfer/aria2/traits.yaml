defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 20971520

traits:
  - id: aria2c-basename
    desc: aria2c downloader binary
    if:
      type: path
      basename: true
      regex: '^aria2c(-win)?(\.exe)?$'
      case_insensitive: true

  - id: aria2c-program-banner-macos
    desc: aria2c macOS program copyright banner
    for: [macho]
    if:
      type: text
      substr: Tatsuhiro Tsujikawa
      section: __TEXT,__cstring

  - id: aria2c-program-banner-windows
    desc: aria2c Windows program copyright banner
    for: [pe]
    if:
      type: text
      substr: Tatsuhiro Tsujikawa
      section: .rdata

  - id: aria2c-program-banner-unix
    desc: aria2c Unix program copyright banner
    for: [elf]
    if:
      type: text
      substr: Tatsuhiro Tsujikawa
      section: .rodata

composite_rules:
  # Packages often rename aria2c (the LKY bundle calls it lot_aria2c.exe),
  # so the stable upstream banner is an identity signal alongside the normal
  # basename. This context is used only to suppress generic attack composites
  # that mistake downloader features for malicious behavior.
  - id: aria2-downloader-context
    desc: Recognized aria2 downloader program context
    crit: exception
    conf: 0.99
    any:
      - id: aria2c-basename
      - id: aria2c-program-banner-macos
      - id: aria2c-program-banner-windows
      - id: aria2c-program-banner-unix
