# github.com/sigstore/protobuf-specs — Sigstore protocol buffer message definitions.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: sigstore protobuf-specs archive path
    if:
      type: path
      regex: 'sigstore/protobuf-specs@'

  - id: module-import
    desc: sigstore protobuf-specs import path
    for: [go]
    if:
      type: import
      substr: github.com/sigstore/protobuf-specs

composite_rules:
  - id: sigstore-protobuf-specs-library
    desc: Sigstore protobuf specifications module
    any:
      - id: archive-path
      - id: module-import
