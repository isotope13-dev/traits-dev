# @antv/g-plugin-physx adds PhysX simulation to AntV G rendering scenes.
# These identity traits are informational and must not suppress its remote
# runtime load: a compromised release can retain the package's normal name.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV PhysX plugin package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/g-plugin-physx'

  - id: source-package-marker
    desc: AntV PhysX plugin source marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@antv/g-plugin-physx'

  - id: physx-plugin-class
    desc: AntV PhysX plugin class
    for: [javascript, typescript]
    if:
      type: symbol
      exact: PhysXPlugin

composite_rules:
  - id: antv-g-plugin-physx-library
    desc: AntV G PhysX rendering plugin identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: source-package-marker
      - id: physx-plugin-class
