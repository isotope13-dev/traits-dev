# Extensionless MSVC STL headers can be heuristically parsed as JavaScript.
# These are implementation-specific source constructs, not a basename allowlist.
defaults:
  platforms: [windows]
  for: [c, cpp, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: msvc-stl-header
    desc: Microsoft STL implementation header
    if:
      type: text
      regex: '_STL_DISABLE_CLANG_WARNINGS\s+#pragma push_macro\("new"\)\s+#undef new'
