# Content identity survives vendoring under __init__.py or another filename.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: six-compatibility-module
    desc: six Python compatibility module implementation
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition
            name: (identifier) @importer
            body: (block
              (function_definition name: (identifier) @finder)
              (function_definition name: (identifier) @loader)))
          (function_definition name: (identifier) @helper)) @module
          (#eq? @importer "_SixMetaPathImporter")
          (#eq? @finder "find_module")
          (#eq? @loader "load_module")
          (#eq? @helper "with_metaclass"))
