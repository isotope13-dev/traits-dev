# six.py is a widely vendored Python 2/3 compatibility shim.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: six-py-basename
    desc: six.py compatibility module basename
    crit: notable
    if:
      type: path
      basename: true
      exact: six.py
