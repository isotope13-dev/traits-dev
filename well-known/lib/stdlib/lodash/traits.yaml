# Lodash library identity
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: package-name
    desc: Lodash npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: lodash
  - id: version-string
    desc: Lodash version string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'lodash v[0-9]+\.[0-9]+\.[0-9]+'
  - id: domain
    desc: Lodash copyright domain reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Lodash(\s+\([^)]{1,80}\))?\s+<https?://lodash\.com(/[^ >]{0,120})?>'
  - id: run-in-context
    desc: lodash.runInContext API method
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "lodash.runInContext"
  - id: lodash-module-memberof
    desc: Lodash modular source member marker
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '@memberOf _'
  # Lodash internals are camelCase (./_baseClone, ./_arrayMap); core-js and
  # other webpacked bundles use kebab-case (./_array-includes,
  # ./_create-property). Require an uppercase letter after the prefix so the
  # matcher only detects lodash-style internal modules.
  - id: lodash-internal-module-require-a
    desc: Lodash internal module require
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: "require\\('./_(base|create|array)[A-Z]"
  - id: lodash-internal-module-require-b
    desc: Lodash internal module require
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: "require\\('./_(assign|native|free)[A-Z]"
composite_rules:
  - id: library
    desc: File contains lodash library
    crit: notable
    conf: 0.9
    any:
      - id: version-string
      - id: domain
      - id: run-in-context
      - id: modular-source
  - id: modular-source
    desc: Lodash modular source file
    crit: notable
    conf: 0.9
    any:
      - id: lodash-module-memberof
      - id: lodash-internal-module-require-a
      - id: lodash-internal-module-require-b
