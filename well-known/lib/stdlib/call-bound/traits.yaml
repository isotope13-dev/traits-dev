# ljharb/call-bound — robust call-bound JavaScript intrinsics.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: call-bound npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: call-bound

  - id: vendored-path
    desc: call-bound package path
    if:
      type: path
      regex: '(^|[\\/])call-bound([\\/]|$)'
