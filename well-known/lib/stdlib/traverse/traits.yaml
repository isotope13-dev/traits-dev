defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: traverse npm package name
    if:
      type: value
      path: name
      exact: traverse

composite_rules:
  - id: traverse-expresso-test-dependency
    desc: traverse package uses expresso for tests
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: metadata/package/dependencies/manifest/identity::npm-expresso-devdependency
