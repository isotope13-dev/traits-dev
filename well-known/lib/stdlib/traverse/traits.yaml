defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: traverse npm package name
  if:
    type: value
    path: name
    exact: traverse
composite_rules:
- id: traverse-expresso-test-dependency
  desc: traverse package uses expresso for tests
  all:
  - id: package-name
  - id: metadata/package/dependencies/identity::npm-expresso-devdependency
