defaults:
  platforms: [unix, windows]
  for: [php]
  crit: component
  conf: 0.98
  size_max: 5000000

traits:
  - id: safe-namespace
    crit: notable
    desc: TheCodingMachine Safe namespace
    if:
      type: text
      regex: 'namespace\s+Safe\s*;'

  - id: safe-zlib-exception
    crit: notable
    desc: TheCodingMachine Safe zlib exception
    if:
      type: text
      substr: Safe\Exceptions\ZlibException

  - id: safe-exception
    crit: notable
    desc: TheCodingMachine Safe exception reference
    if:
      type: text
      regex: 'Safe\\Exceptions\\[A-Za-z0-9_]+Exception'

composite_rules:
  - id: thecodingmachine-safe-library
    desc: TheCodingMachine Safe generated wrapper library
    crit: notable
    conf: 0.99
    all:
      - id: safe-namespace
    any:
      - id: safe-exception
      - id: safe-zlib-exception
