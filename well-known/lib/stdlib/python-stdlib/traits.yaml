defaults:
  platforms: [linux, macos, windows]
  for: [python]
traits:
  - id: zipfile-module
    desc: Python zipfile standard library module
    crit: notable
    conf: 0.98
    for: [python, pyc]
    if:
      type: text
      substr: zipfile._path
  - id: zipfile-module-path
    desc: Python zipfile module path
    crit: notable
    conf: 0.98
    for: [python, pyc]
    if:
      type: path
      regex: 'zipfile[\\/].*__init__.*\.pyc$'
  - id: zipimport-module-bytecode
    # zipimport.py *implements* zipimporter.load_module, so its own bytecode
    # trips the zipimporter-load reflection rule. Use the parser's co_filename
    # projection rather than a basename: the cached form is written as
    # zipimport.cpython-3XX.pyc and again as zipimport.cpython-3XX.opt-{1,2}.pyc,
    # while the interpreter-frozen copy reports <frozen zipimport>.
    desc: Compiled zipimport standard library module
    crit: notable
    conf: 0.97
    for: [pyc]
    if:
      type: value
      # The bytecode fact is an array; the value matcher exposes the array as
      # one structured value here. The module filename is the reusable identity
      # signal, independent of the interpreter's cache suffix.
      path: pyc.source_files
      regex: 'zipimport\.py|<frozen zipimport>'
  # An installed CPython standard library lives under <prefix>/lib/pythonX.Y/.
  # Modules there (pdb, bdb, doctest, timeit) legitimately compile and execute
  # user-supplied source; that is the interpreter's own tooling, not a payload.
  - id: python-stdlib-install-path
    desc: Installed CPython standard library module path
    crit: notable
    conf: 0.97
    for: [python, pyc]
    if:
      type: path
      regex: '(?i)lib(64|32)?[\\/]python[23]\.[0-9]'
  - id: python-stdlib-test-file
    desc: Python standard library test file
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'Lib[\\/]test[\\/]'
  - id: python-stdlib-idlelib
    desc: Python idlelib standard library source
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'idlelib[\\/]'
  - id: python-stdlib-test-support
    desc: Python standard library test support source
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'test[\\/]support[\\/]'
  - id: python-stdlib-fixture-wheel
    desc: Python stdlib packaged test fixture wheel
    crit: notable
    conf: 0.98
    for: [whl]
    if:
      type: basename
      exact: example2-1.0.0-py3-none-any.whl
  - id: python-stdlib-example2-fixture-pkginfo
    desc: Python stdlib example2 test fixture
    crit: notable
    conf: 0.98
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*example2\s*$[\s\S]{0,120}^Version:\s*1\.0\.0\s*$'
