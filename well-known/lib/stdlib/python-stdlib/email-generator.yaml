# Content fingerprints survive copying, renaming and ordinary CPython updates.
# Identity does not suppress behavior in a modified or bundled copy.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: email-generator-export-list
    desc: Python email.generator exported class list
    if:
      type: text
      regex: "__all__\\s*=\\s*\\['Generator', 'DecodedGenerator', 'BytesGenerator'\\]"
  - id: email-generator-part-placeholder
    desc: Python email.generator part placeholder
    if:
      type: literal
      exact: '[Non-text (%(type)s) part of message omitted, filename %(filename)s]'

composite_rules:
  - id: email-generator-module
    desc: Python email.generator implementation
    all:
      - id: email-generator-export-list
      - id: email-generator-part-placeholder
