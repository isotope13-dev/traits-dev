defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 120000000
traits:
  - id: esm-distribution
    desc: Underscore.js ESM distribution file
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: underscore-esm-min.js

  - id: package-name
    desc: underscore npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: underscore

  - id: vendored-path
    desc: vendored underscore package path
    crit: notable
    conf: 0.99
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/underscore/'
