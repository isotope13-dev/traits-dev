defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: osano-service-domain
    desc: Osano consent API domain
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: consent.api.osano.com

  - id: osano-runtime-namespace
    desc: Osano consent runtime namespace
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: OSANO_IFRAME_URI

composite_rules:
  - id: osano-consent-manager
    desc: Osano consent-management library
    crit: exception
    conf: 0.99
    all:
      - id: osano-service-domain
      - id: osano-runtime-namespace
