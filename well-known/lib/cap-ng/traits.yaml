# libcap-ng's small helper for clearing ambient Linux capabilities.
# The FDO package note is build-time package provenance; pairing it with the
# helper SONAME distinguishes the library from unrelated prctl users.
defaults:
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 1048576

traits:
  - id: libcap-ng-package
    desc: libcap-ng ELF package identity
    crit: notable
    conf: 1.0
    if:
      type: value
      path: elf.package.name
      exact: libcap-ng

  - id: ambient-helper-soname
    desc: libcap-ng ambient-capability helper SONAME
    crit: notable
    conf: 0.99
    if:
      type: value
      path: elf.soname
      exact: libdrop_ambient.so.0

composite_rules:
  - id: libcap-ng-ambient-helper
    desc: libcap-ng ambient-capability helper library
    crit: notable
    conf: 1.0
    all:
      - id: libcap-ng-package
      - id: ambient-helper-soname
