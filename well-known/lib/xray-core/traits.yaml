# Xray-core source identity.  The custom finalmask schema describes a
# configurable traffic-header/padding format; the schema itself is not
# executable and must not be treated as hostile behavior.
defaults:
  platforms: [unix, windows]
  for: [go, text]
  crit: notable
  conf: 0.99

traits:
  - id: xray-core-module-path
    desc: Xray-core Go module path
    if:
      type: text
      substr: 'github.com/xtls/xray-core'

  - id: xray-xdns-package
    desc: Xray XDNS transport package declaration
    for: [go]
    if:
      type: text
      regex: '(?m)^package\s+xdns\b'

  - id: xray-browser-dialer-package
    desc: Xray browser dialer package declaration
    for: [go]
    if:
      type: text
      regex: '(?m)^package\s+browser_dialer\b'

  - id: xray-browser-dialer-address-flag
    desc: Xray browser dialer address configuration flag
    for: [go]
    if:
      type: text
      substr: BrowserDialerAddress

  - id: xray-pipe-transport-import
    desc: Xray pipe transport package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/transport/pipe'

  - id: xray-custom-udp-finalmask-import
    desc: Xray custom UDP Finalmask package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/transport/internet/finalmask'

  - id: xray-common-net-package-import
    desc: Xray common net package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/net'

  - id: xray-system-dialer-interface
    desc: Xray system dialer interface
    for: [go]
    if:
      type: text
      substr: 'type SystemDialer interface'

  - id: xray-dialer-controller-api
    desc: Xray dialer controller registration API
    for: [go]
    if:
      type: function
      exact: RegisterDialerController

  - id: xray-legacy-finalmask-header-registry
    desc: Xray legacy Finalmask header registry
    for: [go]
    if:
      type: text
      regex: 'type\s+HeaderID\s+int[\s\S]{0,180}WIREGUARD'

  - id: xray-custom-finalmask-package
    desc: Xray custom finalmask package
    if:
      type: text
      substr: 'xray.transport.internet.finalmask.header.custom'

  - id: xray-finalmask-realm-package
    desc: Xray Finalmask realm package
    for: [text]
    if:
      type: text
      substr: 'xray.transport.internet.finalmask.realm'

  - id: xray-dns-protocol-import
    desc: Xray DNS protocol helper import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/protocol/dns'

  - id: xray-dns-proxy-import
    desc: Xray DNS proxy package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/proxy/dns'

  - id: xray-finalmask-salamander-package
    desc: Xray Salamander Finalmask package
    if:
      type: text
      substr: 'finalmask.salamander'

  - id: xray-proxyman-command-import
    desc: Xray proxyman command API import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/app/proxyman/command'

  - id: xray-handler-service-client
    desc: Xray handler service API client constructor
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.NewHandlerServiceClient$'

  - id: xray-alter-inbound-call
    desc: Xray inbound alteration API call
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.AlterInbound$'

  - id: xray-remove-user-operation
    desc: Xray inbound remove-user operation
    for: [go]
    if:
      type: text
      substr: RemoveUserOperation

  - id: xray-vless-encoding-import
    desc: Xray VLESS encoding package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/proxy/vless/encoding'

  - id: xray-vless-inbound-package
    desc: Xray VLESS inbound package declaration
    for: [go]
    if:
      type: text
      regex: '(?m)^package\s+inbound\b'

  - id: xray-vless-request-header-decoder
    desc: Xray VLESS request-header decoder call
    for: [go]
    if:
      type: symbol
      kind: call
      exact: encoding.DecodeRequestHeader

  - id: xray-routing-context-import
    desc: Xray routing context package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/features/routing'

  - id: xray-routing-session-import
    desc: Xray routing session package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/features/routing/session'

  - id: xray-version-package-import
    desc: Xray version configuration package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/app/version'

  - id: xray-serial-config-import
    desc: Xray configuration model package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/infra/conf'

  - id: xray-serial-json-reader-import
    desc: Xray permissive JSON reader package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/infra/conf/json'

  - id: xray-webhook-notifier-constructor
    desc: Xray routing webhook notifier constructor
    for: [go]
    if:
      type: function
      exact: NewWebhookNotifier

  - id: xray-transport-config-creator
    desc: Xray transport protocol creator registry
    for: [go]
    if:
      type: function
      exact: RegisterProtocolConfigCreator

  - id: xray-transport-config-factory
    desc: Xray transport protocol config factory
    for: [go]
    if:
      type: function
      exact: CreateTransportConfig

  - id: xray-vmess-validator-constructor
    desc: Xray VMess validator constructor
    for: [go]
    if:
      type: symbol
      kind: call
      exact: vmess.NewTimedUserValidator

  - id: xray-vmess-server-session-constructor
    desc: Xray VMess server-session constructor
    for: [go]
    if:
      type: symbol
      kind: call
      exact: encoding.NewServerSession

  - id: xray-proxyman-outbound-import
    desc: Xray outbound proxyman import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/app/proxyman'

  - id: xray-outbound-feature-import
    desc: Xray outbound feature import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/features/outbound'

  - id: xray-finalmask-mkcp-header-package
    desc: Xray Finalmask mKCP header package
    for: [text]
    if:
      type: text
      substr: 'xray.transport.internet.finalmask.mkcp.header'

  - id: xray-finalmask-mkcp-header-go-package
    desc: Xray Finalmask mKCP Go package
    for: [text]
    if:
      type: text
      substr: 'github.com/xtls/xray-core/transport/internet/finalmask/mkcp/header'

  - id: xray-router-command-import
    desc: Xray router command import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/app/router/command'

  - id: xray-routing-api-client-call
    desc: Xray routing API client constructor
    for: [go]
    if:
      type: symbol
      kind: call
      exact: 'routerService.NewRoutingServiceClient'

  - id: xray-routing-remove-rule-call
    desc: Xray routing rule removal call
    for: [go]
    if:
      type: symbol
      kind: call
      exact: 'client.RemoveRule'

  - id: xray-dns-config-proto-source
    desc: Xray DNS configuration protobuf source
    for: [go]
    if:
      type: text
      substr: 'source: proxy/dns/config.proto'

  - id: xray-dns-protobuf-package
    desc: Xray DNS protobuf package
    for: [text]
    if:
      type: text
      regex: '(?m)^package\s+xray\.proxy\.dns\s*;'

  - id: xray-tls-protobuf-package
    desc: Xray TLS protobuf package
    for: [text]
    if:
      type: text
      regex: '(?m)^package\s+xray\.transport\.internet\.tls\s*;'

  - id: xray-dns-header-dice-import
    desc: Xray DNS header dice import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/dice'

  - id: xray-dokodemo-package
    desc: Xray dokodemo inbound package
    for: [go]
    if:
      type: text
      regex: '(?m)^package\s+dokodemo\b'

  - id: xray-dokodemo-door-type
    desc: Xray dokodemo door implementation type
    for: [go]
    if:
      type: text
      substr: 'type DokodemoDoor struct'

  - id: xray-dokodemo-dispatch-link
    desc: Xray dokodemo dispatcher link
    for: [go]
    if:
      type: symbol
      kind: call
      exact: dispatcher.DispatchLink

  - id: xray-config-loader-package-import
    desc: Xray external config loader import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/main/confloader'

  - id: xray-config-loader-function
    desc: Xray external config loader function
    for: [go]
    if:
      type: function
      exact: ConfigLoader

  - id: xray-protobuf-command-import
    desc: Xray command framework package import
    for: [go]
    if:
      type: import
      exact: 'github.com/xtls/xray-core/main/commands/base'

  - id: xray-protobuf-converter-function
    desc: Xray protobuf conversion command function
    for: [go]
    if:
      type: function
      exact: executeConvertConfigsToProtobuf

  - id: xray-udp-client-wrapper
    desc: Xray Finalmask UDP client wrapper constructor
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^(NewSalamander|NewGecko)ConnClient$'

  - id: xray-udp-server-wrapper
    desc: Xray Finalmask UDP server wrapper constructor
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^(NewSalamander|NewGecko)ConnServer$'

  - id: xray-gvisor-device-interface
    desc: Xray gVisor TUN device interface
    for: [go]
    if:
      type: text
      regex: '(?m)^type\s+GVisorDevice\s+interface\s*\{'

  - id: xray-gvisor-link-endpoint-assertion
    desc: Xray gVisor link endpoint assertion
    for: [go]
    if:
      type: text
      substr: 'var _ stack.LinkEndpoint = (*LinkEndpoint)(nil)'

  - id: xray-gvisor-packet-read-call
    desc: Xray gVisor TUN packet read call
    for: [go]
    if:
      type: symbol
      kind: call
      exact: e.device.ReadPacket

  - id: xray-gvisor-packet-dispatch-call
    desc: Xray gVisor network packet dispatch call
    for: [go]
    if:
      type: symbol
      kind: call
      exact: dispatcher.DeliverNetworkPacket

  - id: xray-routing-add-command-function
    desc: Xray routing add-rules command function
    for: [go]
    if:
      type: function
      exact: executeAddRules

  - id: xray-routing-add-rule-call
    desc: Xray routing service AddRule call
    for: [go]
    if:
      type: symbol
      kind: call
      exact: client.AddRule

  - id: xray-routing-add-request
    desc: Xray routing AddRule request construction
    for: [go]
    if:
      type: text
      substr: 'routerService.AddRuleRequest'

composite_rules:
  - id: xray-custom-finalmask-schema
    desc: Xray custom finalmask protobuf schema
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-custom-finalmask-package

  - id: xray-finalmask-realm-schema
    desc: Xray Finalmask realm protobuf schema
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-finalmask-realm-package

  - id: xray-outbound-manager-source
    desc: Xray outbound manager source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-proxyman-outbound-import
      - id: xray-outbound-feature-import

  - id: xray-finalmask-mkcp-header-schema
    desc: Xray Finalmask mKCP header schema
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-finalmask-mkcp-header-package
      - id: xray-finalmask-mkcp-header-go-package

  - id: xray-routing-rule-removal-command
    desc: Xray routing rule removal command
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-router-command-import
      - id: xray-routing-api-client-call
      - id: xray-routing-remove-rule-call

  - id: xray-dns-component
    desc: Xray DNS protocol helper component
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-dns-protocol-import

  - id: xray-dns-proxy-component
    desc: Xray DNS proxy component
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-dns-proxy-import

  - id: xray-salamander-finalmask-schema
    desc: Xray Salamander Finalmask protobuf schema
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-finalmask-salamander-package

  - id: xray-inbound-user-removal-command
    desc: Xray API command removes inbound users
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-proxyman-command-import
      - id: xray-handler-service-client
      - id: xray-alter-inbound-call
      - id: xray-remove-user-operation

  - id: xray-vless-encoding-component
    desc: Xray VLESS encoding component
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-vless-encoding-import

  - id: xray-vless-inbound-handler
    desc: Xray VLESS inbound handler source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-vless-encoding-import
      - id: xray-vless-inbound-package
      - id: xray-vless-request-header-decoder

  - id: xray-system-dialer-source
    desc: Xray configurable system dialer source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-common-net-package-import
      - id: xray-outbound-feature-import
      - id: xray-system-dialer-interface
      - id: xray-dialer-controller-api

  - id: xray-routing-context-component
    desc: Xray routing context component
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-routing-context-import

  - id: xray-routing-webhook-notifier
    desc: Xray routing webhook notifier source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-routing-context-import
      - id: xray-routing-session-import
      - id: xray-webhook-notifier-constructor

  - id: xray-version-config-adapter
    desc: Xray version configuration adapter source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-version-package-import

  - id: xray-serial-config-loader
    desc: Xray serial configuration loader source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-serial-config-import
      - id: xray-serial-json-reader-import

  - id: xray-transport-config-registry
    desc: Xray transport config registry source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-transport-config-creator
      - id: xray-transport-config-factory

  - id: xray-vmess-inbound-handler
    desc: Xray VMess inbound handler
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-vmess-validator-constructor
      - id: xray-vmess-server-session-constructor

  - id: xray-dns-config-source
    desc: Xray generated DNS configuration source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-dns-config-proto-source

  - id: xray-dns-protobuf-schema
    desc: Xray DNS protobuf schema
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-dns-protobuf-package

  - id: xray-tls-protobuf-schema
    desc: Xray TLS protobuf schema
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-tls-protobuf-package

  - id: xray-dns-header-source
    desc: Xray DNS header implementation
    crit: notable
    conf: 1.0
    for: [go]
    all:
      - id: xray-dns-header-dice-import
      - id: micro-behaviors/communications/dns/struct::go-dns-header-wire-builder

  - id: xray-dokodemo-inbound-proxy
    desc: Xray dokodemo inbound proxy implementation
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-dokodemo-package
      - id: xray-dokodemo-door-type
      - id: xray-dokodemo-dispatch-link

  - id: xray-external-config-loader
    desc: Xray external configuration loader implementation
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-config-loader-package-import
      - id: xray-config-loader-function

  - id: xray-protobuf-conversion-command
    desc: Xray protobuf conversion command implementation
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-protobuf-command-import
      - id: xray-protobuf-converter-function

  - id: xray-udp-packet-wrappers
    desc: Xray UDP packet connection wrappers
    crit: notable
    conf: 1.0
    all:
      - id: xray-udp-client-wrapper
      - id: xray-udp-server-wrapper

  - id: xray-gvisor-tun-link-endpoint
    desc: Xray gVisor TUN link endpoint source
    crit: notable
    conf: 1.0
    all:
      - id: xray-gvisor-device-interface
      - id: xray-gvisor-link-endpoint-assertion
      - id: xray-gvisor-packet-read-call
      - id: xray-gvisor-packet-dispatch-call

  - id: xray-gvisor-stack-source
    desc: Xray gVisor network stack source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: well-known/lib/gvisor::network-stack-source

  - id: xray-routing-rule-addition-command
    desc: Xray API command adds routing rules
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-router-command-import
      - id: xray-routing-api-client-call
      - id: xray-routing-add-command-function
      - id: xray-routing-add-rule-call
      - id: xray-routing-add-request

  - id: xray-pipe-transport-source
    desc: Xray pipe transport source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-pipe-transport-import

  - id: xray-custom-udp-finalmask-source
    desc: Xray custom UDP Finalmask source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-custom-udp-finalmask-import

  - id: xray-xdns-transport-source
    desc: Xray XDNS Finalmask transport source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-custom-udp-finalmask-import
      - id: xray-xdns-package

  - id: xray-browser-dialer-source
    desc: Xray browser dialer source
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-browser-dialer-package
      - id: xray-browser-dialer-address-flag

  - id: xray-routing-balancer-info-command
    desc: Xray routing balancer information command
    crit: notable
    conf: 1.0
    all:
      - id: xray-core-module-path
      - id: xray-router-command-import
      - id: xray-protobuf-command-import
      - id: xray-routing-api-client-call
      - id: micro-behaviors/communications/ipc/rpc::go-get-balancer-info-method
