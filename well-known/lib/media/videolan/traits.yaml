# VideoLAN VLC engine and bundled media codec libraries (libvlccore, libx265,
# codec/demux plugins). These are heavily-optimized native media libraries that
# legitimately use W^X memory, large stack-string tables (codec parameter names)
# and worker threads — a shape that trips generic shellcode-injection heuristics.
# Used as a false-positive exclusion for those capability composites. Requires
# two independent VideoLAN/codec strings so a thin masquerading loader that only
# copies the "VideoLAN.VLC" identity string is NOT exempted.
defaults:
  size_max: 52428800
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  crit: component
  conf: 0.9
traits:
  - id: x264-windows-codec-library
    desc: x264 Windows codec library
    crit: notable
    conf: 0.99
    for: [dll]
    platforms: [windows]
    if:
      type: basename
      regex: '(?i)^libx264-[0-9]+\.dll$'
  - id: vlc-media-player-identity
    desc: VLC media player identity string
    crit: notable
    conf: 0.9
    for: [elf]
    if:
      type: text
      regex: '(?i)\bVLC media player\b'
      section: .rodata
    # RMM inventory rules embed ^VLC media player$ (e.g. Action1); not VLC itself.
    unless:
      - type: text
        regex: '\^(\()?VLC media player(\))?\$'
        section: .rodata

  - id: vlc-media-player-identity-pe
    desc: VLC media player identity in PE data
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: text
      regex: '(?i)\bVLC media player\b'
      section: .rdata
    unless:
      - type: text
        regex: '\^(\()?VLC media player(\))?\$'
        section: .rdata

  - id: vlc-media-player-identity-macho
    desc: VLC media player identity in Mach-O data
    crit: notable
    conf: 0.9
    for: [macho]
    if:
      type: text
      regex: '(?i)\bVLC media player\b'
      section: __cstring
    unless:
      - type: text
        regex: '\^(\()?VLC media player(\))?\$'
        section: __cstring

  - id: libvlc-string
    desc: libvlc runtime string
    if:
      type: text
      substr: libvlc
      section: rdata
  - id: videolan-string
    crit: notable
    desc: VideoLAN identity string
    if:
      type: text
      substr: VideoLAN
      section: rdata
  - id: vlc-prefix-symbol
    desc: libvlc internal symbol prefix
    if:
      type: text
      substr: vlc_
      section: rdata
  - id: x265-encoder-string
    desc: x265 HEVC encoder string
    if:
      type: text
      substr: x265
      section: rdata
  - id: hevc-codec-string
    desc: HEVC codec identifier string
    if:
      type: text
      substr: HEVC
      section: rdata
composite_rules:
  - id: videolan-codec-lib
    desc: VideoLAN VLC engine or bundled media codec library
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: hevc-codec-string
      - id: libvlc-string
      - id: videolan-string
      - id: vlc-prefix-symbol
      - id: vlc-media-player-identity
      - id: vlc-media-player-identity-pe
      - id: vlc-media-player-identity-macho
      - id: x265-encoder-string
  - id: media-codec-lib
    desc: Recognized media codec/engine library (FFmpeg or VideoLAN)
    crit: notable
    conf: 0.95
    any:
      - id: videolan-codec-lib
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
