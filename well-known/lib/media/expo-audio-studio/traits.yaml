# @siteed/expo-audio-studio — Expo/React Native audio recording, analysis,
# and streaming library. Android MediaRecorder/MIC capture is the product.
defaults:
  platforms: [unix, windows, android]
  for: [package.json, npm, tar, javascript, typescript, kotlin, java]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: npm-package
    desc: expo-audio-studio npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@siteed/expo-audio-studio'

  - id: archive-package-name
    desc: expo-audio-studio npm archive name
    for: [npm, tar]
    conf: 0.99
    if:
      type: value
      path: npm.name
      exact: '@siteed/expo-audio-studio'

  - id: github-repo
    desc: siteed expo-audio-stream GitHub repo
    conf: 0.98
    if:
      type: text
      substr: github.com/deeeed/expo-audio-stream

  - id: android-package
    desc: siteed audiostream Android package
    for: [kotlin, java]
    conf: 0.98
    if:
      type: text
      substr: net.siteed.audiostream
