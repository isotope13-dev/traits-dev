# iTwin.js core -- Bentley Systems' open-source digital-twin / BIM viewer
# libraries (https://github.com/iTwin/itwinjs-core), published as @itwin/*.
# The frontend package ships large bundled WASM/base64 decoder assets and
# source maps, which look dense and opaque to byte statistics.
defaults:
  platforms: [unix, windows]
  for: [npm]
  crit: notable
  conf: 0.95

traits:
  - id: archive-package-name
    desc: iTwin.js scoped npm package name
    if:
      type: value
      path: npm.name
      regex: '^@itwin/[a-z0-9-]{3,40}$'

  - id: upstream-repository
    desc: iTwin.js upstream GitHub repository
    if:
      type: value
      path: npm.repository.url
      substr: github.com/iTwin/itwinjs-core

composite_rules:
  - id: itwin-package-context
    desc: iTwin.js package from the upstream repository
    conf: 0.97
    all:
      - id: archive-package-name
      - id: upstream-repository
