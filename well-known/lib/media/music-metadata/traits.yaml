# Borewit music-metadata — audio tag parser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: music-metadata npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: music-metadata
  - id: vendored-path
    desc: vendored music-metadata package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/music-metadata/'

composite_rules:
  - id: music-metadata-library
    desc: music-metadata audio tag parser
    any:
      - id: package-name
      - id: vendored-path
