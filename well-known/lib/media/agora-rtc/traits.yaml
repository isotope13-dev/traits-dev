# Agora (Shengwang) ships a native OS-abstraction library, libaosl.so, across
# its RTC and native media SDKs: 600+ `aosl_*` exports covering sockets,
# threads, files and /proc introspection (its TracerPid read sits beside the
# /proc/self/status parsing table). That is vendor runtime, not anti-analysis
# added by the application that bundles the SDK.
defaults:
  crit: notable
  conf: 0.95
  platforms: [android, unix]
  for: [so]
  size_min: 10240
  size_max: 20000000
traits:
  - id: aosl-os-abstraction-exports
    desc: Agora aosl OS-abstraction export set
    if:
      type: export
      exact: aosl_mpq_add_dgram_socket
