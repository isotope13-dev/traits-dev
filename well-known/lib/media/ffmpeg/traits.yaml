defaults:
  size_max: 268435456
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  crit: baseline
  conf: 0.9
traits:
  - id: ffmpeg-windows-utility
    desc: FFmpeg Windows utility
    crit: notable
    conf: 0.99
    for: [pe]
    platforms: [windows]
    if:
      type: basename
      regex: '(?i)^(ffmpeg|ffplay|ffprobe)\.exe$'
  - id: ffmpeg-product-versioninfo
    desc: FFmpeg ProductName version info
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: FFmpeg

  - id: ffmpeg-description-versioninfo
    desc: FFmpeg FileDescription version info
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '^FFmpeg\b'

  - id: ffmpeg-av-malloc
    desc: FFmpeg av_malloc symbol
    crit: component
    if:
      type: symbol
      exact: av_malloc
  - id: ffmpeg-av-free
    desc: FFmpeg av_free symbol
    crit: component
    if:
      type: symbol
      exact: av_free
  - id: ffmpeg-av-log
    desc: FFmpeg av_log symbol
    crit: component
    if:
      type: symbol
      exact: av_log
  - id: ffmpeg-program-debug-name
    desc: FFmpeg program debug name string
    crit: component
    conf: 0.98
    if:
      type: text
      section: .edata
      substr: ffmpeg_g.exe
  - id: ffmpeg-version-string
    desc: FFmpeg program version string
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      section: .rdata
      regex: '(?i)^FFmpeg version ([0-9]+\.[0-9]+|N-[0-9]+(-g[0-9a-f]+)?)\b'
  - id: ffmpeg-version-string-elf
    desc: FFmpeg program version string in ELF data
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: '(?i)^FFmpeg version ([0-9]+\.[0-9]+|N-[0-9]+(-g[0-9a-f]+)?)\b'
  - id: ffmpeg-source-tree-marker
    desc: FFmpeg embedded source tree marker
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      section: .rdata
      regex: '(?i)(^|[/\\])ffmpeg[/\\]src[/\\]fftools[/\\]'
  - id: ffmpeg-source-tree-marker-elf
    desc: FFmpeg source-tree marker in ELF data
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: '(?i)(^|[/\\])src[/\\]fftools[/\\]'
  - id: ffmpeg-version-string-macho
    desc: FFmpeg program version string in Mach-O data
    crit: notable
    conf: 0.99
    for: [macho]
    if:
      type: text
      section: __cstring
      regex: '(?i)^FFmpeg version ([0-9]+\.[0-9]+|N-[0-9]+(-g[0-9a-f]+)?)\b'
  - id: ffmpeg-source-tree-marker-macho
    desc: FFmpeg source-tree marker in Mach-O data
    crit: notable
    conf: 0.99
    for: [macho]
    if:
      type: text
      section: __cstring
      regex: '(?i)(^|[/\\])src[/\\]fftools[/\\]'

  - id: ffmpeg-source-archive-path
    desc: FFmpeg upstream source archive path
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, makefile, text]
    if:
      type: path
      regex: 'FFmpeg-(n[0-9]|HEAD)'

  - id: ffmpeg-configure-script-marker
    desc: FFmpeg configure script banner
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      substr: '# FFmpeg configure script'
  - id: ffmpeg-wasm-core-factory
    desc: ffmpeg.wasm createFFmpegCore factory
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: 'var createFFmpegCore'
  - id: ffmpeg-wasm-mxf-encrypted-string
    desc: FFmpeg MXF encrypted-file diagnostic string
    crit: notable
    conf: 0.97
    for: [wasm, binaries]
    if:
      type: text
      substr: 'broken encrypted mxf file'
  - id: fluent-ffmpeg-path-setter
    desc: fluent-ffmpeg binary path setter
    crit: notable
    conf: 0.99
    for: [javascript]
    platforms: [windows, unix]
    if:
      type: symbol
      exact: FfmpegCommand.setFfmpegPath
composite_rules:
  - id: ffmpeg-lib-marker
    desc: FFmpeg/Libav multimedia library marker
    crit: baseline
    conf: 0.95
    needs: 2
    any:
      - id: well-known/lib/media/ffmpeg::ffmpeg-av-free
      - id: well-known/lib/media/ffmpeg::ffmpeg-av-log
      - id: well-known/lib/media/ffmpeg::ffmpeg-av-malloc
      - id: well-known/lib/media/ffmpeg::ffmpeg-description-versioninfo
      - id: well-known/lib/media/ffmpeg::ffmpeg-program-debug-name
      - id: well-known/lib/media/ffmpeg::ffmpeg-product-versioninfo
      - id: well-known/lib/media/ffmpeg::ffmpeg-version-string
      - id: well-known/lib/media/ffmpeg::ffmpeg-source-tree-marker
  - id: ffmpeg-source-context
    desc: FFmpeg upstream interpreter source tree
    crit: exception
    conf: 0.99
    any:
      - id: ffmpeg-source-archive-path
      - id: ffmpeg-configure-script-marker
      - id: ffmpeg-source-tree-marker
      - id: ffmpeg-source-tree-marker-elf
      - id: ffmpeg-source-tree-marker-macho
  - id: ffmpeg-wasm-runtime-context
    desc: ffmpeg.wasm runtime identity context
    crit: exception
    conf: 0.99
    for: [javascript, wasm, binaries, archives, crx, zip]
    scope: archive
    all:
      - id: ffmpeg-wasm-core-factory
      - id: ffmpeg-wasm-mxf-encrypted-string
