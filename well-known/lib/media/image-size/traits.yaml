# image-size — image dimension reader.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: image-size npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: image-size

  - id: vendored-path
    desc: vendored image-size package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/image-size/'
