defaults:
  platforms: [windows]
  for: [dll]
  size_min: 16000
  size_max: 1000000

traits:
  - id: libogg-stream-export
    desc: libogg stream API export
    crit: component
    conf: 0.99
    if:
      type: symbol
      exact: ogg_stream_packetin

  - id: libogg-sync-export
    desc: libogg sync API export
    crit: component
    conf: 0.99
    if:
      type: symbol
      exact: ogg_sync_pageout

  - id: libogg-hashed-basename
    desc: Hashed libogg DLL basename
    crit: component
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '^libogg-0-[0-9a-f]{16,}\.dll$'

composite_rules:
  - id: libogg-codec-library
    desc: libogg Ogg container codec library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: libogg-stream-export
      - id: libogg-sync-export
      - id: libogg-hashed-basename
