# rlottie is Samsung's Lottie animation renderer. Applications that show
# Lottie/JSON animations ship it as `rlottie-image-loader.dll`, the Qt image
# format plugin built around it — an ordinary bundled media library, and one
# whose "loader" filename otherwise reads as a payload dropper.
defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.98

traits:
  - id: rlottie-image-loader-library
    desc: rlottie image loader library
    crit: notable
    size_min: 4096
    size_max: 52428800
    if:
      type: basename
      exact: rlottie-image-loader.dll
