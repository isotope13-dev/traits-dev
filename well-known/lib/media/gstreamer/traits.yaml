# GStreamer plugin DLLs bundled with applications (voice/media hosts).
# A GStreamer plugin is a tiny DLL whose whole purpose is exporting the
# plugin descriptor and register entry that GStreamer's registry loader
# calls, so its import table stays minimal while still importing
# LoadLibraryExW/GetProcAddress through the MSVC static-CRT delay-load
# helper. That shape is easily mistaken for import-table concealment.
defaults:
  crit: notable
  conf: 0.98
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 10485760

traits:
  # GST_PLUGIN_DEFINE exports gst_plugin_<name>_get_desc and
  # gst_plugin_<name>_register for every plugin.
  - id: gst-plugin-desc-export
    desc: GStreamer plugin descriptor export
    if:
      type: export
      regex: '^gst_plugin_[a-z0-9_]+_get_desc$'

  - id: gst-plugin-register-export
    desc: GStreamer plugin register export
    if:
      type: export
      regex: '^gst_plugin_[a-z0-9_]+_register$'
