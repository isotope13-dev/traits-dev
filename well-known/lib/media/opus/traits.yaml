defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  size_min: 16000
  size_max: 5000000

traits:
  - id: libopus-encode-export
    desc: libopus encode API export
    conf: 0.99
    if:
      type: symbol
      exact: opus_encode

  - id: libopus-decode-export
    desc: libopus decode API export
    conf: 0.99
    if:
      type: symbol
      exact: opus_decode

  - id: libopus-basename
    desc: libopus DLL basename
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)^libopus(-[0-9]+)?(\.(x64|x86))?\.dll$'

composite_rules:
  - id: libopus-codec-library
    desc: libopus Opus audio codec library
    conf: 0.99
    needs: 2
    any:
      - id: libopus-encode-export
      - id: libopus-decode-export
      - id: libopus-basename
