# Tencent Cloud RTC (TRTC) SDK for Web — WebRTC audio, video and calling SDK.
# Official releases ship build-obfuscated beauty and video-effect plugins.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: tencent-trtc-package-name
    desc: Tencent TRTC Web SDK package name
    if:
      type: value
      path: name
      regex: '^trtc-(sdk-v5|js-sdk)$'

  - id: tencent-trtc-repository
    desc: Tencent TRTC Git repository URL
    if:
      type: value
      path: repository.url
      substr: github.com:LiteAVSDK/TRTC_Web

  - id: tencent-trtc-author
    desc: Tencent Cloud RTC author identity
    if:
      type: value
      path: author
      exact: 'Tencent Cloud Client R&D Center'

composite_rules:
  - id: tencent-trtc-package-context
    desc: Tencent Cloud TRTC Web SDK package context
    crit: exception
    conf: 0.99
    all:
      - id: tencent-trtc-package-name
      - id: tencent-trtc-repository
      - id: tencent-trtc-author
