defaults:
  platforms: [macos, linux, windows]
  crit: baseline
  conf: 0.98
  size_max: 536870912

traits:
  - id: source-tree
    desc: Skia graphics library source tree
    crit: notable
    for: [source, c, cpp, shell, python, javascript, text, tar]
    if:
      type: path
      regex: '(^|[\\/])skia([\\/]|$)'

  - id: napi-rs-canvas-native-addon-path
    crit: notable
    desc: napi-rs canvas Skia native addon path
    for: [macho, elf, pe]
    if:
      type: path
      regex: '@napi-rs[\\/]canvas.{0,80}\.node$'
  - id: skia-embedded-source-path
    crit: notable
    desc: Embedded Skia source header path string
    for: [macho, elf, pe]
    if:
      type: text
      substr: ./skia/include/

  - id: skia-node-addon-basename
    crit: notable
    desc: Skia Node native addon basename
    for: [macho, elf, pe]
    if:
      type: path
      basename: true
      regex: '^skia\.[^\\/]*\.node$'

composite_rules:
  - id: node-canvas-native-addon
    desc: Skia-backed Node canvas native addon
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/linking/addon-abi::node-api-addon-export
    any:
      - id: napi-rs-canvas-native-addon-path
      - id: skia-node-addon-basename

  # A shipped Skia build embeds its own ./skia/include header paths. Those
  # builds carry Skia's SkRandom LCG constants (1664525, 1013904223), which
  # matched masked-arithmetic-dispatch-state. The header paths, the Skia addon
  # name or path, and the Node-API export must all hold, so a renamed loader
  # that only copies the constants does not clear.
  - id: node-canvas-skia-exception
    desc: Shipped Skia-backed Node canvas addon with Skia headers
    crit: exception
    conf: 0.98
    for: [macho, elf, pe]
    all:
      - id: skia-embedded-source-path
      - id: node-canvas-native-addon
