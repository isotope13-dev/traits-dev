# matplotlib-base — conda-forge matplotlib 2D plotting library.
# Native backends, LaTeX/Ghostscript helpers, and testdata are product.
defaults:
  platforms: [unix, windows]
  for: [conda, python, json, text, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 100000000

traits:
  - id: conda-basename
    desc: matplotlib-base conda package basename
    for: [conda]
    if:
      type: value
      path: file.basename
      regex: '(?i)^matplotlib-base-'

  - id: conda-index-name
    desc: matplotlib-base conda index name
    for: [json]
    if:
      type: text
      regex: '"name":\s*"matplotlib-base"'

  - id: github-repo
    desc: matplotlib GitHub repository
    for: [json, text, markdown, python]
    if:
      type: text
      substr: github.com/matplotlib/matplotlib

  - id: conda-forge-feedstock
    desc: conda-forge matplotlib feedstock URL
    for: [json, text]
    if:
      type: text
      substr: github.com/conda-forge/matplotlib-feedstock

  - id: package-path
    desc: matplotlib site-packages directory path
    for: [python, conda]
    if:
      type: path
      regex: 'site-packages[\\/]matplotlib'

composite_rules:
  - id: matplotlib-base-package
    desc: matplotlib-base conda plotting library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: conda-basename
      - id: conda-index-name
      - id: github-repo
      - id: conda-forge-feedstock
      - id: package-path
    needs: 2
