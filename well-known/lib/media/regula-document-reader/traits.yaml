# @regulaforensics/react-native-document-reader-api — official RN bridge
# for Regula ID-document scanning. NFC, camera, and the example app's
# debug overlay permission are product/scaffold, not overlay malware.
defaults:
  platforms: [unix, windows, android]
  for: [package.json, npm, tar, javascript, typescript]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 80000000

traits:
  - id: npm-package
    desc: Regula document-reader npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@regulaforensics/react-native-document-reader-api'

  - id: archive-package-name
    desc: Regula document-reader npm archive name
    for: [npm, tar]
    conf: 0.99
    if:
      type: value
      path: npm.name
      exact: '@regulaforensics/react-native-document-reader-api'

  - id: github-repo
    desc: Regula document-reader GitHub repository
    for: [javascript, markdown, xml]
    conf: 0.98
    if:
      type: text
      substr: github.com/regulaforensics/react-native-document-reader

  - id: android-package
    desc: Regula document-reader Android package
    for: [kotlin, java]
    conf: 0.98
    if:
      type: text
      substr: com.regula.plugin.documentreader

  - id: nuget-package-id
    desc: Xamarin DocumentReader NuGet package id
    for: [nupkg, xml]
    conf: 0.99
    if:
      type: text
      substr: Xamarin.DocumentReader.Core

  - id: android-sdk-soname
    desc: Regula AndroidSdk JNI library name
    for: [elf, so]
    conf: 0.98
    if:
      type: basename
      exact: libAndroidSdk.so

  - id: jni-native-wrapper
    desc: Regula NativeWrapper JNI export
    for: [elf, so]
    conf: 0.99
    if:
      type: symbol
      exact: Java_com_regula_core_NativeWrapper_process

  - id: license-api-host
    desc: Regula license API hostname
    for: [elf, so]
    conf: 0.98
    if:
      type: text
      section: .rodata
      substr: lic2.regulaforensics.com

composite_rules:
  - id: regula-android-sdk-context
    desc: Official Regula Android document SDK
    crit: exception
    conf: 0.99
    for: [elf, so]
    all:
      - id: android-sdk-soname
      - id: jni-native-wrapper
      - id: license-api-host
