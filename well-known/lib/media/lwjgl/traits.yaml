# Lightweight Java Game Library (org.lwjgl).
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.98

traits:
  - id: lwjgl-class
    desc: LWJGL library class
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '^org/lwjgl/'
