# miniaudio — public-domain C audio library (mackron/miniaudio), often
# compiled into Bun and game/runtime helpers as a WASAPI/DirectSound backend.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 50000
  size_max: 8000000

traits:
  - id: miniaudio-wasapi-capture-start-error
    desc: miniaudio WASAPI capture-start error string
    if:
      type: text
      substr: '[WASAPI] Failed to start internal capture device'
      section: .rdata

  - id: miniaudio-wasapi-playback-start-error
    desc: miniaudio WASAPI playback-start error string
    if:
      type: text
      substr: '[WASAPI] Failed to start internal playback device'
      section: .rdata

  - id: miniaudio-directsound-unlock-error
    desc: miniaudio DirectSound buffer-unlock error string
    if:
      type: text
      substr: '[DirectSound] Failed to unlock internal buffer from playback device'
      section: .rdata

composite_rules:
  - id: miniaudio-windows-backend
    desc: miniaudio Windows audio backend
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: miniaudio-wasapi-capture-start-error
      - id: miniaudio-wasapi-playback-start-error
      - id: miniaudio-directsound-unlock-error
