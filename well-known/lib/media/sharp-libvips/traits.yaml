defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, so, macho, dylib]
  crit: baseline
  conf: 0.98
  size_min: 4096
  size_max: 104857600

traits:
  - id: sharp-bundled-libvips
    desc: sharp bundled libvips binary
    if:
      type: path
      basename: true
      regex: '^libvips(-[^\\/]+(\.dll)?|-cpp\.so(\.[0-9]+)*)$'
  - id: libvips-runtime-strings-pe
    desc: libvips runtime string markers in PE
    for: [pe, dll]
    if:
      type: text
      section: .rdata
      regex: 'VIPS_STALL|libvips|Cannot write more than [0-9]+ PPS into avcC box'
  - id: libvips-runtime-strings-elf
    desc: libvips runtime string markers in ELF
    for: [elf, so]
    if:
      type: text
      section: .rodata
      regex: 'VIPS_STALL|libvips|Cannot write more than [0-9]+ PPS into avcC box'

composite_rules:
  - id: sharp-libvips-binary
    desc: sharp bundled libvips image library
    crit: notable
    conf: 0.98
    any:
      - id: sharp-bundled-libvips
      - id: libvips-runtime-strings-pe
      - id: libvips-runtime-strings-elf
