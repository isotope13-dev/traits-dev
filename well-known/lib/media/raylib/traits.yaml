defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, macho]
  crit: component
  conf: 0.98
  size_min: 100000
  size_max: 52428800
traits:
  - id: raylib-dll-basename
    desc: raylib runtime library basename
    platforms: [windows]
    for: [dll]
    if:
      type: path
      basename: true
      exact: raylib.dll
      case_insensitive: true
  - id: raylib-github-project-string
    desc: raylib GitHub project string
    if:
      type: text
      substr: github.com/raysan5/raylib
      section: rdata
composite_rules:
  - id: raylib-runtime-component
    desc: raylib graphics runtime component
    crit: notable
    conf: 0.98
    any:
      - id: raylib-dll-basename
      - id: raylib-github-project-string
