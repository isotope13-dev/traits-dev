# JPEG XL source tree identity.
defaults:
  platforms: [unix, windows]
  for: [shell, c, cpp, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 200000000

traits:
  - id: libjxl-source-tree
    desc: JPEG XL source tree member
    if:
      type: path
      regex: '(?i)(^|[\\/])libjxl([\\/]|$)'
