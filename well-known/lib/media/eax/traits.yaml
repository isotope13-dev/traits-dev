# Creative EAX (Environmental Audio Extensions) is a 3D audio runtime
# library developed by Creative Technology Ltd for legacy DirectSound / OpenAL.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 5000000

traits:
  - id: creative-eax-product-name
    desc: Creative EAX audio library product name
    if:
      type: value
      path: pe.version.product_name
      exact: EAX Unified

  - id: creative-eax-company-name
    desc: Creative Technology Ltd company name
    if:
      type: value
      path: pe.version.company
      substr: Creative Technology

  - id: creative-eax-export-create
    desc: Creative EAX DirectSoundCreate export
    if:
      type: symbol
      regex: '^_?EAXDirectSoundCreate8?(@\d+)?$'

composite_rules:
  - id: creative-eax-audio-library
    desc: Recognized Creative EAX audio library
    crit: notable
    conf: 0.99
    all:
      - id: creative-eax-company-name
    any:
      - id: creative-eax-product-name
      - id: creative-eax-export-create
