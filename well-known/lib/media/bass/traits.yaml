# BASS/BASSOPUS audio runtime DLLs from Un4seen Developments use large
# anonymous high-entropy sections for legitimate codec data.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 50000000
traits:
  - id: bass-un4seen-signed
    desc: Un4seen-signed BASS library
    crit: notable
    conf: 1.0
    # Cite the verified signer only. Claims are component-level and are not
    # emitted in full scans, so an exemption on them never fires there.
    if:
      type: trait
      id: metadata/signature/verified/signer::un4seen-developments-ltd
  - id: bass-library-basename
    desc: BASS audio library filename
    crit: notable
    conf: 1.0
    if:
      type: path
      basename: true
      regex: '(?i)^bass(enc_[a-z0-9_]+|[a-z0-9_]+)?[.]dll$'
  # macOS BASS builds are ad hoc re-signed by app packaging (lib/bass/Bass.targets),
  # so no Un4seen signer exists to anchor identity. The install name and the
  # runtime banner are weaker evidence; the composite is an exception only for
  # ad hoc loader and dispatch shapes that carry no behavior of their own.
  - id: bass-macho-library-name
    desc: BASS macOS library install name
    crit: notable
    conf: 0.9
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.install_name
      regex: '^(@rpath/)?libbass(_fx|mix|flac|opus|alac|wasapi)?[.]dylib$'
  - id: bass-macho-version-banner
    desc: BASS runtime plugin or version text
    crit: notable
    conf: 0.9
    for: [macho]
    platforms: [macos]
    if:
      type: text
      regex: 'BASS(plugin|OPUS: Incorrect BASS version [(]2[.]4)'

composite_rules:
  - id: bass-known-library-context
    desc: Recognized signed BASS runtime library
    crit: exception
    conf: 0.99
    all:
      - id: well-known/lib/media/bass::bass-un4seen-signed
      - id: well-known/lib/media/bass::bass-library-basename
  - id: bass-macho-known-library-context
    desc: Recognized ad hoc macOS BASS 2.4 runtime library
    crit: exception
    conf: 0.9
    for: [macho]
    platforms: [macos]
    all:
      - id: well-known/lib/media/bass::bass-macho-library-name
      - id: well-known/lib/media/bass::bass-macho-version-banner
