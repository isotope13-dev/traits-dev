# BASS/BASSOPUS audio runtime DLLs from Un4seen Developments use large
# anonymous high-entropy sections for legitimate codec data.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 50000000
traits:
  - id: bass-un4seen-signed
    desc: Un4seen-signed BASS library
    crit: notable
    conf: 1.0
    if:
      type: trait
      id: metadata/signed/leaf::un4seen-developments-ltd
  - id: bass-library-basename
    desc: BASS audio library filename
    crit: notable
    conf: 1.0
    if:
      type: path
      basename: true
      regex: '(?i)^bass(enc_[a-z0-9_]+|[a-z0-9_]+)?[.]dll$'

composite_rules:
  - id: bass-known-library-context
    desc: Recognized signed BASS runtime library
    crit: exception
    conf: 0.99
    all:
      - id: well-known/lib/media/bass::bass-un4seen-signed
      - id: well-known/lib/media/bass::bass-library-basename
