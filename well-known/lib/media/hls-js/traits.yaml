# hls.js — official JavaScript HLS client (https://github.com/video-dev/hls.js).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package
    desc: hls.js npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: hls.js

  - id: archive-package-name
    desc: hls.js npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: hls.js

  - id: package-member-context
    desc: hls.js package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: hls.js

  - id: upstream-repository
    desc: hls.js upstream GitHub repository
    if:
      type: text
      substr: github.com/video-dev/hls.js

composite_rules:
  - id: hls-js-package-context
    desc: hls.js HLS media client package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: npm-package
      - id: archive-package-name
      - id: package-member-context
      - id: upstream-repository
