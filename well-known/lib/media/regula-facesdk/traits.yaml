defaults:
  platforms: [unix, windows]

traits:
  - id: face-components-package-name
    desc: Regula Face SDK web-components package identity
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@regulaforensics/vp-frontend-face-components'
  - id: regula-facesdk-brand-marker
    desc: Regula Face SDK web-components runtime marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript, markdown, package.json]
    if:
      type: text
      regex: '(?i)faceapi\.regulaforensics\.com'
  - id: regula-facesdk-package-marker
    desc: Regula Face SDK package marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript, markdown, package.json]
    if:
      type: text
      regex: '(?i)@regulaforensics/(facesdk-webclient|vp-frontend-face-components)'
  - id: regula-storybook-host-marker
    desc: Regula Face SDK Storybook host
    crit: notable
    conf: 0.99
    for: [javascript, typescript, markdown, package.json]
    if:
      type: text
      regex: '(?i)storybook-face\.regulaforensics\.com'
  - id: face-capture-component-marker
    desc: Face capture or liveness marker
    # AWS Rekognition release notes use the same product phrase; the AWS SDK
    # identity is a narrow benign context for this otherwise useful marker.
    crit: notable
    conf: 0.99
    for: [javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)\bface[- ](capture|liveness)\b'
    unless:
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
  - id: liveness-assessment-marker
    desc: Face liveness assessment marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)\bliveness assessment\b'
    unless:
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
  - id: web-components-camera-marker
    desc: Web Components camera marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)\bWeb Components\b.{0,40}\bcamera\b'

composite_rules:
  - id: camera-liveness-component-marker
    desc: Camera or face-liveness component marker
    crit: notable
    conf: 0.99
    any:
      - id: face-capture-component-marker
      - id: liveness-assessment-marker
      - id: web-components-camera-marker

  - id: official-face-components-context
    desc: Recognized Regula Face SDK web-components package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: face-components-package-name
    any:
      - id: regula-facesdk-brand-marker
      - id: regula-facesdk-package-marker
      - id: regula-storybook-host-marker
      - id: camera-liveness-component-marker
