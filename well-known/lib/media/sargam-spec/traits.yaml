# sargam-spec — Clojure/JSON spec for Bhatkhande Hindustani notation
# (Studio Kalavati). Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: sargam-spec Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: sargam-spec

  - id: pom-group
    desc: Studio Kalavati Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: studiokalavati

  - id: package-path
    desc: sargam notation package path
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])sargam[\\/]'

  - id: github-repo
    desc: Studio-kalavati sargam-spec repository
    conf: 0.97
    if:
      type: text
      substr: Studio-kalavati/sargam-spec
