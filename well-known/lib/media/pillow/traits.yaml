# Pillow (PIL) -- the Python imaging library. Its package directory is named
# PIL both in a source tree and alongside its compiled extension modules.
defaults:
  platforms: [unix, windows]
  for: [python, pe, dll, macho, elf, so]
  crit: notable
  conf: 0.96
  # A path match needs no floor -- a package holds legitimately tiny files
  # (`py.typed` is empty). The ceiling is the operative bound: the largest
  # thing that genuinely matches is a compiled extension module, tens of
  # megabytes at the outside, so this keeps the path off bulk archives.
  size_max: 104857600
traits:
  - id: pillow-source
    desc: Pillow imaging library source
    if:
      type: path
      regex: '(^|[\\/])PIL[\\/]'
