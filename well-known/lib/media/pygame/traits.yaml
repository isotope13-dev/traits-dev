defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  conf: 0.98

traits:
  - id: platform-header-guard
    desc: Pygame platform header guard
    crit: component
    if:
      type: text
      exact: '#ifndef PG_PLATFORM_H'

  - id: sse42-target-macro
    desc: Pygame SSE4.2 target macro
    crit: component
    if:
      type: text
      word: PG_FUNCTION_TARGET_SSE4_2

composite_rules:
  - id: platform-compatibility-header
    desc: Pygame platform compatibility header
    crit: notable
    all:
      - id: platform-header-guard
      - id: sse42-target-macro
