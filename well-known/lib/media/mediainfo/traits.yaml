# MediaInfoLib (MediaArea.net) reads media over libcurl, including sftp://,
# and points CURLOPT_SSH_*_KEYFILE at the user's $HOME/.ssh defaults.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1048576
  size_max: 67108864

traits:
  - id: mediaarea-company
    desc: MediaArea.net PE company identity
    if:
      type: value
      path: pe.version.company
      exact: MediaArea.net

  - id: mediainfo-product
    desc: MediaInfo PE product identity
    if:
      type: value
      path: pe.version.product_name
      exact: MediaInfo

composite_rules:
  - id: mediainfo-library
    desc: MediaArea MediaInfo library
    all:
      - id: mediaarea-company
      - id: mediainfo-product
