defaults:
  crit: notable
  platforms: [unix, windows]
  for: [c, text]

traits:
  - id: spandsp-source-marker
    desc: SpanDSP source marker
    conf: 0.95
    if:
      type: text
      substr: spandsp

composite_rules:
  - id: spandsp-library
    desc: SpanDSP telephony signal-processing library
    conf: 0.95
    all:
      - id: spandsp-source-marker
    any:
      - id: spandsp-source-marker
      - id: metadata/lang/source/naming/target::g726-codec-name-reference