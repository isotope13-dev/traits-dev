# Independent JPEG Group (IJG) libjpeg — classic JPEG codec sources.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, source, data, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: ijg-copyright-banner
    desc: Independent JPEG Group copyright banner
    conf: 0.99
    if:
      type: text
      substr: Independent JPEG Group's software
      offset_range: [0, 1024]

  - id: jpeg-lib-version-macro
    desc: JPEG_LIB_VERSION macro definition
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: '#\s*define\s+JPEG_LIB_VERSION\b'

  - id: libjpeg-source-path
    desc: libjpeg source tree path fragment
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[\\/])libjpeg([\\/]|$)'

  - id: jdos-backing-store-export
    desc: libjpeg DOS backing-store ASM export
    for: [c, text]
    if:
      type: text
      substr: _jdos_open

composite_rules:
  - id: libjpeg-codec-sources
    desc: Independent JPEG Group libjpeg codec sources
    crit: notable
    conf: 0.98
    any:
      - id: ijg-copyright-banner
      - id: jpeg-lib-version-macro
      - id: libjpeg-source-path
      - id: jdos-backing-store-export
