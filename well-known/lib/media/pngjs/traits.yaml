# pngjs — Pure JavaScript PNG encoder/decoder.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: pngjs-package-name
    desc: pngjs package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pngjs

  - id: pngjs-constants-marker
    desc: pngjs constants definitions
    for: [javascript, typescript]
    if:
      type: text
      regex: 'PNG_SIGNATURE:\s*\[137,\s*80,\s*78,\s*71,\s*13,\s*10,\s*26,\s*10\]'

  - id: pngjs-adam7-interlace-marker
    desc: pngjs Adam7 interlace passes
    for: [javascript, typescript]
    if:
      type: text
      regex: 'exports\.getImagePasses\s*=\s*function'

composite_rules:
  - id: pngjs-library-context
    desc: pngjs PNG codec library context
    crit: notable
    conf: 0.98
    any:
      - id: pngjs-package-name
      - id: pngjs-constants-marker
      - id: pngjs-adam7-interlace-marker
