# RecordRTC-to-ASPNETMVC — a bundled integration-example ASP.NET MVC project
# shipped inside the widely-used recordrtc npm package (a WebRTC audio/video
# recording library). Built by the library's own author from an unedited
# Visual Studio MVC project template: the stock AssemblyInfo.cs leaves
# `[assembly: AssemblyCompany("Microsoft")]` and the 2014 copyright
# placeholder untouched, which reads as a Microsoft vendor claim to a naive
# scan. It is not one -- the embedded PDB path
# (`D:\Muaz Khan Data\Projects\Elance Work\RecordRTC_to_ASPNETMVC\...`) is the
# author's own personal/freelance development tree, matching the exact
# author credited in this same package's PHP example scripts.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  size_min: 1024
  size_max: 1048576

traits:
  - id: recordrtc-aspnetmvc-example-basename
    desc: RecordRTC ASP.NET MVC example DLL basename
    if:
      type: basename
      exact: RecordRTC_to_ASPNETMVC.dll

  - id: recordrtc-aspnetmvc-example-product-metadata
    desc: RecordRTC ASP.NET MVC example product metadata
    if:
      type: value
      path: pe.version.description
      exact: RecordRTC_to_ASPNETMVC

composite_rules:
  - id: recordrtc-aspnetmvc-example-context
    desc: Bundled RecordRTC ASP.NET MVC integration example
    crit: notable
    conf: 0.99
    all:
      - id: recordrtc-aspnetmvc-example-basename
      - id: recordrtc-aspnetmvc-example-product-metadata
