defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - tar
  crit: notable
  conf: 0.98
traits:
- id: npm-package
  desc: Howler.js npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: howler
- id: archive-package-name
  desc: Howler.js npm archive identity
  for:
  - npm
  - tar
  if:
    type: value
    path: npm.name
    exact: howler
- id: package-member-context
  desc: Howler.js package member
  for:
  - javascript
  - typescript
  if:
    type: value
    path: package.json::name
    exact: howler
- id: core-source-marker
  desc: Howler.js core source marker
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: howlerjs.com
