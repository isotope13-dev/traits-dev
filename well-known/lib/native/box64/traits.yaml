defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - elf
  - tar
  - gz
  - zip
  - go
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 200000000
traits:
- id: source-tree-path
  desc: Box64 source tree path
  if:
    type: path
    regex: box64-[0-9][^/]*
- id: source-archive-member
  desc: Box64 source archive root member
  for:
  - gz
  if:
    type: value
    path: archive.members[*].path
    regex: ^box64-[0-9][^/]+/README\.md$
- id: wrappedlibc-source
  desc: Box64 wrapped libc translation unit
  for:
  - c
  - cpp
  if:
    type: basename
    exact: wrappedlibc.c
- id: box64-logo-marker
  desc: Box64 project README marker
  for:
  - elf
  - c
  - go
  - gz
  if:
    type: text
    substr: Box64Logo.png
composite_rules:
- id: wrappedlibc-tree-context
  desc: Box64 wrapped libc source file
  crit: notable
  conf: 0.99
  all:
  - id: wrappedlibc-source
  - id: box64-logo-marker
