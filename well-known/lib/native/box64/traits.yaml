# Box64 — Linux userspace x86-64 emulator (ptitSeb/box64). Source and
# binaries legitimately invoke raw getdents, manipulate dirent layouts, and
# read /proc/{pid}/mem while emulating guest processes.
defaults:
  platforms: [unix]
  for: [c, cpp, elf, tar, gz, zip, go]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 200000000

traits:
  - id: source-tree-path
    desc: Box64 source tree path
    if:
      type: path
      regex: 'box64-[0-9][^/]*'

  - id: source-archive-member
    desc: Box64 source archive root member
    for: [tar, gz, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^box64-[0-9][^/]+/README\.md$'

  - id: wrappedlibc-source
    desc: Box64 wrapped libc translation unit
    for: [c, cpp]
    if:
      type: basename
      exact: wrappedlibc.c

  - id: box64-logo-marker
    desc: Box64 project README marker
    if:
      type: text
      substr: Box64Logo.png

composite_rules:
  - id: wrappedlibc-tree-context
    desc: Box64 wrapped libc source file
    crit: notable
    conf: 0.99
    all:
      - id: wrappedlibc-source
      - id: box64-logo-marker

  - id: box64-source-archive-context
    desc: Recognized Box64 source release archive
    crit: exception
    conf: 0.99
    for: [tar, gz, zip]
    scope: outer
    all:
      - id: source-archive-member
      - id: box64-logo-marker

  - id: box64-source-tree-context
    desc: Recognized Box64 source tree
    crit: exception
    conf: 0.99
    any:
      - id: source-tree-path
      - id: wrappedlibc-tree-context
