# musl libc — the lightweight C library (Rich Felker et al.). Its dynamic
# linker (ldso/dynlink.c) is the component that implements RTLD_NEXT symbol
# resolution and defines the libc entry points, so hook-shaped code in this
# tree is the linker's own implementation, not an injected interposer.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_max: 104857600

traits:
  # Release and snapshot tarballs unpack under a musl-<version-or-commit>
  # directory; the path is how a member file identifies its tree.
  - id: musl-source-archive-path
    desc: musl libc source tree path
    for: [c, cpp, text, makefile, shell]
    if:
      type: path
      regex: 'musl-[0-9][\w.-]*/'
  - id: musl-copyright-banner
    desc: musl libc copyright banner
    for: [c, cpp, text]
    if:
      type: text
      substr: 'musl as a whole is licensed under the following standard MIT license'
