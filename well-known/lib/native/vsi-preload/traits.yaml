defaults:
  conf: 0.95
  platforms: [unix, windows]
  for: [c, cpp]

traits:
  - id: virtual-filesystem-preload-api-marker
    desc: Virtual filesystem preload API marker
    crit: notable
    if:
      type: text
      substr: VSI Virtual FILE API
  - id: virtual-filesystem-preload-description-marker
    desc: Preload wrapper description marker
    crit: notable
    if:
      type: text
      substr: Standalone shared library that can be LD_PRELOAD

composite_rules:
  - id: virtual-filesystem-preload-wrapper-context
    desc: Virtual filesystem LD_PRELOAD wrapper source
    crit: exception
    all:
      - id: virtual-filesystem-preload-api-marker
      - id: virtual-filesystem-preload-description-marker
