# LIEF native bindings. The Windows builds include generated API-name tables
# used while parsing PE files; these are data returned by lookup thunks, not
# calls made by the addon.
defaults:
  platforms: [windows]
  for: [npm, pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: node-lief-package
    desc: node-lief npm package identity
    for: [npm]
    if:
      type: value
      path: name
      exact: node-lief

  - id: node-lief-api-name-catalog-build
    desc: LIEF Windows build PDB identity
    for: [pe, dll]
    size_min: 1000000
    size_max: 10000000
    if:
      type: text
      section: .rdata
      regex: '(?i)[A-Z]:\\a\\node-lief\\node-lief\\build\\Release\\node_lief\.pdb'

  # Every LIEF build carries its parser class symbols, including Bare builds
  # that have no PDB path. Those symbols identify the binding on its own.
  - id: lief-parser-symbol-identity
    desc: LIEF PE parser symbol identity
    for: [pe, dll]
    size_min: 1000000
    size_max: 10000000
    if:
      type: text
      substr: 'LIEF::PE::'

composite_rules:
  - id: lief-binding-identity
    desc: LIEF binding identity from PDB or parser symbols
    crit: notable
    conf: 0.99
    for: [pe, dll]
    any:
      - id: node-lief-api-name-catalog-build
      - id: lief-parser-symbol-identity
  - id: lief-native-module-registration
    desc: Node-API or Bare module registration export
    crit: notable
    conf: 0.99
    for: [pe, dll]
    any:
      - id: well-known/lib/native/node-addon-api::napi-module-registration-export
      - id: well-known/lib/native/bare-addon::bare-module-registration-export
  - id: node-lief-native-addon-context
    desc: LIEF Windows native addon or Bare binding context
    crit: exception
    conf: 0.99
    for: [pe, dll]
    all:
      - id: lief-binding-identity
      - id: lief-native-module-registration
