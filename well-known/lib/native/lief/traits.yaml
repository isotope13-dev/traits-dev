# LIEF native bindings. The Windows builds include generated API-name tables
# used while parsing PE files; these are data returned by lookup thunks, not
# calls made by the addon.
defaults:
  platforms: [windows]
  for: [npm, pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: node-lief-package
    desc: node-lief npm package identity
    for: [npm]
    if:
      type: value
      path: name
      exact: node-lief

  - id: node-lief-api-name-catalog-build
    desc: LIEF Windows build PDB identity
    for: [pe, dll]
    size_min: 1000000
    size_max: 10000000
    if:
      type: text
      section: .rdata
      regex: '(?i)[A-Z]:\\a\\node-lief\\node-lief\\build\\Release\\node_lief\.pdb'

composite_rules:
  - id: node-lief-native-addon-context
    desc: LIEF Windows Node native addon context
    crit: exception
    conf: 0.99
    for: [pe, dll]
    all:
      - id: node-lief-api-name-catalog-build
      - id: well-known/lib/native/node-addon-api::napi-module-registration-export
