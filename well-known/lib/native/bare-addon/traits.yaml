# Bare runtime native addons register through an exported entry that the Bare
# loader calls, not as standalone programs. Like the Node-API registration
# export, the kernel32 and process APIs such an addon carries are runtime and
# toolchain plumbing, not a behavior chain by themselves.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: bare-module-registration-export
    desc: Bare runtime addon module registration export
    size_max: 30000000
    if:
      type: export
      exact: bare_register_module_v0
