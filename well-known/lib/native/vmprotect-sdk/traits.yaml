# VMProtect SDK runtime DLL (VMProtectSDK32.dll / VMProtectSDK64.dll)
# Exported runtime helpers bundled alongside VMProtect-protected binaries.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 2000000

traits:
  - id: vmprotect-sdk-begin-export
    desc: VMProtectSDK virtualization begin export
    if:
      type: export
      regex: '^VMProtectBegin'

  - id: vmprotect-sdk-decrypt-export
    desc: VMProtectSDK string decrypt export
    if:
      type: export
      regex: '^VMProtectDecryptString'

  - id: vmprotect-sdk-anti-analysis-export
    desc: VMProtectSDK anti-analysis check export
    if:
      type: export
      regex: '^VMProtectIs(Debugger|VirtualMachine)Present$'

composite_rules:
  - id: vmprotect-sdk-dll
    desc: VMProtect SDK runtime DLL
    all:
      - id: vmprotect-sdk-begin-export
      - id: vmprotect-sdk-decrypt-export
      - id: vmprotect-sdk-anti-analysis-export
