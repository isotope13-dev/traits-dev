# rdbo/libmem: an open-source process/memory manipulation library (hooking,
# VMT patching, signature scanning). Identity only; consumers that hook or
# inject still need their own behavioral evidence.
defaults:
  platforms: [windows, linux]
  for: [pe, dll, elf, so]
  crit: notable
  conf: 0.95
  size_min: 10000
  size_max: 50000000
traits:
  - id: libmem-hookcode-symbol
    desc: References libmem LM_HookCode API
    if:
      type: symbol
      regex: '^LM_HookCode(Ex)?$'
  - id: libmem-vmthook-symbol
    desc: References libmem LM_VmtHook API
    if:
      type: symbol
      exact: LM_VmtHook
  - id: libmem-sigscan-symbol
    desc: References libmem LM_SigScan API
    if:
      type: symbol
      regex: '^LM_SigScan(Ex)?$'
  - id: libmem-deeppointer-symbol
    desc: References libmem LM_DeepPointer API
    if:
      type: symbol
      regex: '^LM_DeepPointer(Ex)?$'
composite_rules:
  - id: libmem-library
    desc: Links the rdbo/libmem memory library
    needs: 3
    any:
      - id: libmem-hookcode-symbol
      - id: libmem-vmthook-symbol
      - id: libmem-sigscan-symbol
      - id: libmem-deeppointer-symbol
