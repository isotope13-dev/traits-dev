# node-addon-api — C++ Node-API wrapper headers.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: node-addon-api npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: node-addon-api

  - id: vendored-path
    desc: vendored node-addon-api package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/node-addon-api/'

  # A PE/DLL that exports the Node-API registration entry is a native addon
  # loaded by Node, not a standalone executable: its kernel32 imports
  # (debugger checks, process termination, library loading) are toolchain
  # and runtime plumbing, not a behavior chain.
  - id: napi-module-registration-export
    desc: Node-API native addon module registration export
    for: [pe, dll]
    size_max: 30000000
    if:
      type: export
      exact: napi_register_module_v1
