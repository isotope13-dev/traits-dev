# node-addon-api — C++ Node-API wrapper headers.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: node-addon-api npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: node-addon-api

  - id: vendored-path
    desc: vendored node-addon-api package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/node-addon-api/'
