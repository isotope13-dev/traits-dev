defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.98
  size_max: 104857600

traits:
  # GNU gconv modules are shared objects, not network clients.  The entry
  # point pair is the ABI identity shared by glibc's charset converters.
  - id: gconv-symbol
    desc: GNU gconv conversion entry point
    crit: component
    conf: 0.99
    for: [elf, so]
    if:
      type: symbol
      kind: export
      exact: gconv

  - id: gconv-init-symbol
    desc: GNU gconv initialization entry point
    crit: component
    conf: 0.99
    for: [elf, so]
    if:
      type: symbol
      kind: export
      exact: gconv_init

  - id: cns-gconv-soname
    desc: GNU CNS character conversion module SONAME
    crit: component
    conf: 0.99
    for: [elf, so]
    if:
      type: value
      path: elf.soname
      exact: libCNS.so

  - id: cns11643-export-table
    desc: CNS11643 character conversion export table
    crit: component
    conf: 0.99
    for: [elf, so]
    count_min: 4
    if:
      type: symbol
      kind: export
      # cleave strips ABI-leading underscores before matching symbol facts.
      regex: '^cns11643'

  # glibc ships character-set conversion modules as shared objects under
  # /usr/lib*/gconv. libJIS.so is a lookup-table module: its exported
  # __jisx0208/__jisx0212 objects are conversion tables, not executable
  # payloads. Keep this identity separate from libc-soname, which identifies
  # the libc runtime itself.
  - id: jis-gconv-soname
    desc: GNU JIS gconv module SONAME
    crit: notable
    conf: 0.99
    for: [elf, so]
    if:
      type: value
      path: elf.soname
      exact: libJIS.so

  - id: jis-gconv-export-table
    desc: JIS character conversion export table
    crit: notable
    conf: 0.99
    for: [elf, so]
    if:
      type: symbol
      kind: export
      # cleave normalizes ELF symbol names by removing the ABI-leading
      # underscores before matching symbol facts.
      regex: '^jisx(0201|0208|0212)_'

  - id: source-archive-basename
    desc: GNU C Library source archive
    for: [archive]
    if:
      type: path
      basename: true
      regex: '^glibc[-_][0-9][^\\/]*$'

  - id: source-tree-path
    desc: GNU C Library source tree path
    for: [c, cpp, makefile, shell]
    if:
      type: path
      regex: 'glibc-[0-9][^\\/]*[\\/]'

  # Identifies libc.so.N itself — the object that *implements* the C library,
  # as opposed to anything that merely links against it. Keyed on the SONAME
  # rather than on a vendor banner string because this is referenced from
  # credential-dumping / fileless `unless:` clauses: a banner string is one
  # line for an attacker to embed, whereas an LD_PRELOAD shim cannot claim
  # SONAME libc.so.N without displacing the real libc and breaking its host.
  # Matches GNU, NetBSD, and other libc.so.N runtimes.
  - id: libc-soname
    desc: libc shared-object SONAME
    crit: notable
    for: [elf, so]
    if:
      type: value
      path: elf.soname
      regex: '^libc\.so\.[0-9]+$'

  - id: libresolv-soname
    desc: glibc resolver shared-object SONAME
    crit: notable
    for: [elf, so]
    if:
      type: value
      path: elf.soname
      regex: '^libresolv\.so\.[0-9]+$'

  - id: debian-release-banner-prefix
    desc: Debian GNU C Library banner prefix
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: GNU C Library (Debian GLIBC

  - id: glibc-release-banner-version
    desc: GNU C Library stable release version
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: 'stable release version [0-9]+\.[0-9]+'

  - id: source-file-marker
    desc: GNU C Library source marker

    for: [c, cpp, elf, macho]
    if:
      type: text
      substr: GNU C Library

composite_rules:
  - id: gnu-jis-gconv-module
    desc: GNU JIS character conversion module
    crit: notable
    conf: 0.99
    for: [elf, so]
    all:
      - id: jis-gconv-soname
      - id: jis-gconv-export-table

  - id: gnu-gconv-module
    desc: GNU gconv character conversion module
    crit: notable
    conf: 0.99
    for: [elf, so]
    all:
      - id: gconv-symbol
      - id: gconv-init-symbol

  - id: gnu-cns-gconv-table
    desc: GNU CNS11643 character conversion table module
    crit: notable
    conf: 0.99
    for: [elf, so]
    all:
      - id: cns-gconv-soname
      - id: cns11643-export-table

  - id: gnu-character-conversion-module
    desc: GNU character conversion module
    crit: notable
    conf: 0.99
    for: [elf, so]
    any:
      - id: gnu-gconv-module
      - id: gnu-cns-gconv-table
      - id: gnu-jis-gconv-module

  - id: libc-runtime
    desc: GNU C Library runtime identity
    crit: notable
    conf: 0.99
    for: [elf, so]
    all:
      - id: libc-soname
      - id: micro-behaviors/dylib/library/libc::is-libc-binary

  - id: debian-release-banner
    desc: Debian GNU C Library release banner
    crit: notable
    conf: 0.99
    for: [elf]
    all:
      - id: debian-release-banner-prefix
      - id: glibc-release-banner-version

  - id: debian-libc-runtime
    desc: Debian GNU C Library runtime shared object
    crit: notable
    conf: 0.99
    for: [elf]
    all:
      - id: libc-runtime
      - id: debian-release-banner
