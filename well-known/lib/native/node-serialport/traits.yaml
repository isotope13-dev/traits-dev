# node-serialport native bindings (@serialport/bindings-cpp).
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.99

traits:
  - id: win-header-guard
    desc: serialport Windows binding header guard
    if:
      type: text
      substr: PACKAGES_SERIALPORT_SRC_SERIALPORT_WIN_H_

  - id: vendored-path
    desc: vendored serialport bindings-cpp path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@serialport/bindings-cpp/'
