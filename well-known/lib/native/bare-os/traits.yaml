defaults:
  platforms: [windows, unix]
  for: [package.json, scripts, source, text, pe, elf, macho]
  size_min: 64
  size_max: 500000
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: bare-os npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: bare-os

  - id: vendored-path
    desc: vendored bare-os package path
    if:
      type: path
      regex: 'node_modules[\\/]bare-os[\\/]'

  - id: native-addon-basename
    desc: bare-os native addon filename
    for: [pe, elf, macho]
    if:
      type: basename
      exact: bare-os.bare

composite_rules:
  - id: bare-os-library
    desc: bare-os operating-system utility addon
    any:
      - id: package-name
      - id: vendored-path
      - id: native-addon-basename
