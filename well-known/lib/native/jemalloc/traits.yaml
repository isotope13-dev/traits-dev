defaults:
  platforms: [unix]
  for: [elf, so]
  crit: baseline
  conf: 0.99
  size_max: 50000000

traits:
  - id: jemalloc-soname
    desc: jemalloc memory allocator shared library
    crit: notable
    if:
      type: value
      path: elf.soname
      exact: libjemalloc.so.2

  # Programs may statically embed jemalloc, including its legitimate
  # dlsym(RTLD_NEXT) wrapper around pthread_create. The prefixed control API
  # export identifies that allocator context without relying on product text.
  - id: jemalloc-mallctl-export
    desc: Exports the jemalloc mallctl control API
    crit: notable
    if:
      type: export
      exact: je_mallctl
