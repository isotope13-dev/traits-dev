defaults:
  platforms: [windows, unix]
  size_max: 67108864
  for: [elf, pe, dll, dylib, static-lib]

traits:
  - id: jffi-native-basename
    desc: JFFI native library basename
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '^(libjffi-[0-9.]+\.(so|jnilib|a)|jffi-[0-9.]+\.dll)(@0x\w+)?$'
  - id: jffi-native-export
    desc: JFFI native JNI export marker
    crit: notable
    conf: 0.99
    if:
      type: export
      regex: '^Java_com_kenai_jffi_Foreign_dl(sym|open|close)$'
