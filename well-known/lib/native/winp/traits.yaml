# winp (org.jvnet.winp) is Kohsuke Kawaguchi's Windows-process library for
# the JVM -- Jenkins and JetBrains IDEs ship its JNI helpers (winp.dll,
# sendctrlc.exe) to enumerate and manage processes. It is a binding layer,
# not the program that decides which processes die: by design it re-exports
# Toolhelp traversal plus TerminateProcess behind Java_org_jvnet_winp kill
# entry points, which is exactly the API cluster the backdoor process-killer
# composites key on. Referenced as benign context so those composites do not
# fire on the binding library itself. The JNI export prefix embeds the Java
# package name, so it identifies winp specifically rather than any process
# tool.
defaults:
  crit: notable
  conf: 0.98
  size_min: 2000
  size_max: 10000000

traits:
  - id: winp-jni-export-prefix
    desc: winp JNI native method export
    platforms: [windows]
    for: [pe, dll]
    if:
      type: export
      regex: '^Java_org_jvnet_winp_'
  - id: winp-java-package-reference
    desc: References the winp Java process API
    platforms: [unix, windows]
    for: [class, java, kotlin]
    if:
      type: text
      substr: org/jvnet/winp
  # The JNI mangled name embeds the Java package, so a PE that merely
  # references winp's native entry points (a launcher, a delay-load table)
  # is covered even where the export directory is unavailable. Same
  # library-and-callers rationale as the JSch text marker. The export name
  # table lives in rdata, which is also where the scope is pinned.
  - id: winp-jni-name-reference
    desc: References winp JNI native entry points
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      substr: Java_org_jvnet_winp_
      section: rdata
  # No basename trait: sendctrlc.exe carries no winp-specific content marker,
  # and a name-only notable would let an unrelated binary suppress the
  # process-killer composites by renaming itself. The JNI export prefix above
  # embeds the Java package, so it identifies winp content, not a filename.
