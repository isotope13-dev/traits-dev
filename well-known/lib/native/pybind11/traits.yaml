# pybind11 -- the C++/Python binding header library. A native Python extension
# built with it keeps the name in its read-only data. Sits with the other
# native-binding libraries (node-addon-api, jffi) rather than with build
# tooling: what it produces is a shared object, not a build step.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, dylib, dll]
  crit: notable
  # A compiled extension module; below this there is no binding code to hold
  # the marker, and the ceiling keeps it off bundled runtime images.
  size_min: 4096
  size_max: 200000000
traits:
  - id: pybind11-marker
    desc: pybind11 C++ to Python library marker
    conf: 0.95
    if:
      type: text
      substr: pybind11
      section: .rdata
