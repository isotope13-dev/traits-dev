# madExcept (madshi) is a Delphi/C++Builder exception and crash-reporting
# library.  Embedded apps legitimately capture a desktop screenshot and upload
# a multipart bug report over HTTP/SMTP.  Identify that library so those
# report-delivery capabilities are not labeled as screenshot theft or a
# self-copy dropper.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 8000000

traits:
  - id: madshi-site
    desc: madshi madExcept vendor website
    if:
      type: text
      substr: www.madshi.net
      # Delphi Borland binaries keep literals in CODE.
      section: CODE

  - id: madexcept-settings-mutex
    desc: madExcept settings mutex name
    if:
      type: text
      exact: madExceptSettingsMtx
      section: CODE

  - id: madexcept-window-class
    desc: madExcept window class name
    if:
      type: text
      exact: madExceptWndClass
      section: CODE

  - id: madexcept-bugreport-file
    desc: madExcept bugreport.mbr artifact name
    if:
      type: text
      exact: bugreport.mbr
      section: CODE

  - id: madexcept-send-bug-report
    desc: madExcept send-bug-report UI string
    if:
      type: text
      exact: send bug report
      section: CODE

  - id: madexcept-screenshot-png
    desc: madExcept bug-report screenshot.png name
    if:
      type: text
      exact: screenshot.png
      section: CODE

  - id: madexcept-collection-regpath
    desc: madshi madCollection registry path
    if:
      type: text
      substr: madshi\madCollection
      section: CODE

  - id: madexcept-trace-process-export
    desc: madExcept madTraceProcess export
    if:
      type: export
      exact: madTraceProcess

composite_rules:
  - id: madexcept-library
    desc: Delphi madExcept crash-reporting library
    crit: notable
    conf: 0.999
    all:
      - id: madshi-site
    any:
      - id: madexcept-settings-mutex
      - id: madexcept-window-class
      - id: madexcept-bugreport-file
      - id: madexcept-collection-regpath
      - id: madexcept-trace-process-export
    needs: 2

  - id: madexcept-bug-report-delivery-context
    desc: madExcept screenshot-and-upload bug-report delivery
    crit: exception
    conf: 1.0
    all:
      - id: madexcept-library
      - id: madexcept-send-bug-report
      - id: madexcept-screenshot-png
