defaults:
  size_max: 52428800
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: source-tree
    desc: modernc libc generated source or package path
    crit: notable
    for: [go, c, cpp, text, zip]
    if:
      type: path
      regex: 'modernc\.org(:|[/\\])libc(@v|[-:]v)'
  - id: langinfo-generated-source
    desc: modernc libc langinfo generated source
    crit: notable
    for: [go]
    if:
      type: text
      regex: 'ccgo langinfo/gen\.c.{0,330}-pkgname langinfo'
  - id: ccgo-generated-source
    desc: ccgo-transpiled Go source banner
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      # Every ccgo (modernc.org/ccgo) transpile stamps the emitting command
      # line, ending in the target package name; the langinfo trait above is
      # the narrow spelling of the same banner family.
      regex: 'ccgo \S+\.c.{0,330}-pkgname '
  - id: libc-xdlsym-runtime
    desc: modernc libc dynamic symbol shim
    if:
      type: text
      exact: modernc.org/libc.Xdlsym
      section: rdata
