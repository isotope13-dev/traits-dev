# pywin32 Windows API binding modules (win32api, win32com, win32file, ...).
#
# pywin32's compiled extensions are thin Python bindings that re-export the
# entire Win32 API surface, so by design they reference clusters of powerful
# native calls (SetSystemTime, SetComputerName, CreateHardLink, registry/COM
# CLSIDs, ...) that backdoor/tamper composites key on. The module is a binding
# layer, not the program that calls those APIs — referenced as benign context so
# the API-cluster composites do not fire on the binding library itself.
defaults:
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll, pyc, python, xml, vbs]
  crit: baseline
traits:
  - id: pywin32-init-export
    desc: pywin32 module init export (init/PyInit_win32*)
    crit: notable
    conf: 0.9
    if:
      type: text
      # Python 3 modules export PyInit_win32api; Python 2 ones (SWIG) export
      # initwin32api. Both spellings identify a pywin32 extension module.
      regex: '(PyInit_|init)win32[a-z0-9_]+'
  - id: pywin32-module-basename
    desc: pywin32 extension module filename
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^win32[a-z_]*\.(pyd|pyc)$'
  - id: pywintypes-runtime-ref
    desc: pywintypes runtime DLL reference
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'pywintypes[0-9]{2,3}\.dll'
  - id: pywin32-upstream-repo
    desc: pywin32 upstream repository reference
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: github.com/mhammond/pywin32
  - id: pywin32-source-path
    desc: pywin32 Python source path
    crit: notable
    conf: 0.95
    for: [python, pe, dll, xml, vbs]
    if:
      type: path
      regex: '(^|[\\/])(win32com|win32comext|pythonwin)[\\/]'
  - id: pywin32-postinstall
    desc: pywin32 postinstall script
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: basename
      exact: pywin32_postinstall.py
  - id: pywin32-security-constants
    desc: pywin32 Windows security constants
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: basename
      exact: ntsecuritycon.py
  - id: pywin32-error-constants
    desc: pywin32 Windows error constants
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: basename
      exact: winerror.py
  - id: pywin32-adsi-constants
    desc: pywin32 ADSI constants
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: basename
      exact: adsicon.py
  - id: pywin32-dde-extension
    desc: pywin32 DDE extension module
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: basename
      exact: dde.pyd
composite_rules:
  - id: pywin32-binding-module
    desc: pywin32 Windows API binding module
    crit: exception
    conf: 0.99
    any:
      - id: pywin32-init-export
      - id: pywin32-module-basename
      - id: pywintypes-runtime-ref
      - id: pywin32-upstream-repo
      - id: pywin32-source-path
      - id: pywin32-postinstall
