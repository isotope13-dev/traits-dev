# CrashRpt's native CrashSender component legitimately captures a desktop
# image when configured and uploads it as part of an error report.  Identify
# the component from its PE version identity so that this report-delivery
# path is not mislabeled as screenshot theft.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 5000000

traits:
  - id: crashrpt-product-name
    desc: CrashRpt PE product identity
    if:
      type: value
      path: pe.version.product_name
      exact: CrashRpt

  - id: crashsender-internal-name
    desc: CrashRpt sender internal name
    if:
      type: value
      path: pe.version.internal_name
      exact: CrashSender

  - id: crashsender-original-filename
    desc: CrashRpt sender original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: CrashSender.exe

composite_rules:
  - id: crashsender-report-delivery-context
    desc: CrashRpt CrashSender error-report delivery component
    crit: exception
    conf: 0.99
    all:
      - id: crashrpt-product-name
      - id: crashsender-internal-name
      - id: crashsender-original-filename
