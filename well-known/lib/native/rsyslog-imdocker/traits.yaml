# rsyslog's imdocker input module.  The module's SONAME, source filename
# marker, and exported Docker API object together identify the benign logging
# plugin without treating every Docker client as rsyslog.
defaults:
  platforms: [linux]
  for: [elf]
  size_min: 16384
  size_max: 10485760

traits:
  - id: imdocker-soname
    desc: rsyslog imdocker module SONAME
    crit: notable
    conf: 0.99
    if:
      type: value
      path: elf.soname
      exact: imdocker.so

  - id: imdocker-source-marker
    desc: imdocker source filename marker
    crit: component
    conf: 0.99
    if:
      type: text
      exact: imdocker.c
      section: .rodata

  - id: imdocker-docker-api-export
    desc: imdocker Docker API export
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: DFLT_dockerAPIUnixSockAddr

composite_rules:
  - id: imdocker-module-identity
    desc: rsyslog Docker input module
    crit: notable
    conf: 1.0
    all:
      - id: imdocker-soname
      - id: imdocker-source-marker
      - id: imdocker-docker-api-export

  # This module legitimately combines a Docker endpoint, libcurl, and the
  # standard Docker API port.  It is benign context for the cloud-port atom,
  # not evidence that the plugin probes management services.
  - id: imdocker-docker-input-context
    desc: rsyslog Docker input endpoint context
    crit: exception
    conf: 1.0
    all:
      - id: imdocker-module-identity
      - id: micro-behaviors/os/container/runtime::docker-var-run-sock
      - id: micro-behaviors/communications/http/download/curl::curl-easy-init
      - id: micro-behaviors/communications/http/download/curl::curl-easy-perform
