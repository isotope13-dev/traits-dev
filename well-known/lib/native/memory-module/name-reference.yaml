defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  size_max: 5000000
traits:
  - id: memorymodule-name-reference
    size_min: 512
    size_max: 500000000
    desc: MemoryModule name in executable section
    crit: notable
    if:
      type: text
      substr: MemoryModule
      section: ".text"
