defaults:
  platforms: [unix]
  for: [elf, so]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 20000000

traits:
  - id: libsystemd-shared-library
    desc: libsystemd shared library basename
    if:
      type: basename
      # Distribution builds also ship the private shared runtime as
      # libsystemd-shared-<release>.so.
      regex: '^libsystemd(-shared)?(-[0-9][0-9A-Za-z.-]*)?\.so(\.[0-9.]+)?$'

  - id: libnss-resolve-systemd-library
    desc: systemd NSS resolve library basename
    if:
      type: basename
      regex: '^libnss_resolve\.so(\.[0-9.]+)?$'

  - id: libnss-systemd-systemd-library
    desc: systemd NSS systemd library basename
    if:
      type: basename
      regex: '^libnss_systemd\.so(\.[0-9.]+)?$'

  - id: libnss-myhostname-systemd-library
    desc: systemd NSS myhostname library basename
    if:
      type: value
      path: file.basename
      regex: '^libnss_myhostname\.so(\.[0-9.]+)?$'

  # `pam_systemd.so` and its siblings (`pam_systemd_loadkey.so`, `pam_systemd_home.so`)
  # are all built from the systemd tree and link the same shared code.
  - id: pam-systemd-library
    desc: systemd PAM session library basename
    if:
      type: basename
      regex: '^pam_systemd(_[a-z]+)?\.so$'

  - id: libudev-shared-library
    desc: libudev shared library basename
    if:
      type: basename
      # auditwheel embeds an eight-hex content tag before the SONAME suffix.
      regex: '^libudev(-[0-9a-f]{8})?\.so(\.[0-9.]+)?$'

composite_rules:
  - id: systemd-shared-library
    desc: systemd runtime, PAM, or NSS shared library
    crit: notable
    conf: 0.99
    any:
      - id: libsystemd-shared-library
      - id: libudev-shared-library
      - id: libnss-systemd-systemd-library
      - id: libnss-resolve-systemd-library
      - id: libnss-myhostname-systemd-library

  - id: systemd-native-library-context
    desc: Recognized systemd native library context
    crit: exception
    conf: 1.0
    any:
      - id: systemd-shared-library
      - id: pam-systemd-library
