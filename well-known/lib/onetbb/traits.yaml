# Intel oneTBB source-tree identity. Build probes and test launchers in this
# upstream library intentionally use compiler shells and DYLD/LD_PRELOAD test
# variables; the identity is gated by path and upstream copyright.
defaults:
  platforms: [unix, windows]
  for: [javascript, shell, plist]
  crit: notable
  conf: 0.99
traits:
  - id: source-tree
    desc: Intel oneTBB source tree
    if:
      type: path
      regex: '(^|[\\/])oneTBB-[0-9][^\\/]*'
  - id: intel-copyright
    desc: oneTBB Intel copyright marker
    if:
      type: text
      regex: '(?i)Copyright \(c\) 2005-2019 Intel Corporation|oneTBB'
  - id: bundled-runtime-basename
    desc: Intel oneTBB bundled shared library basename
    crit: notable
    conf: 0.99
    size_min: 10000
    size_max: 50000000
    for: [elf]
    platforms: [linux, macos]
    if:
      type: path
      basename: true
      regex: '^libtbb.*\.so'
  - id: bundled-runtime-symbol
    desc: Intel oneTBB runtime C++ symbol
    crit: notable
    conf: 0.99
    size_min: 10000
    size_max: 50000000
    for: [elf]
    platforms: [linux, macos]
    if:
      type: text
      substr: _ZN3tbb6detail2r1
      section: .rodata
composite_rules:
  - id: source-context
    desc: Recognized Intel oneTBB upstream source context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree
      - id: intel-copyright
  - id: bundled-runtime-library
    desc: Bundled Intel oneTBB shared library
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [linux, macos]
    any:
      - id: bundled-runtime-basename
      - id: bundled-runtime-symbol
