# cloud.google.com/go/auth — Google Cloud client authentication library for Go.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: cloud.google.com/go/auth archive path
    if:
      type: path
      regex: 'cloud\.google\.com/go/auth@'

  - id: module-import
    desc: cloud.google.com/go/auth import path
    for: [go]
    if:
      type: import
      substr: cloud.google.com/go/auth

composite_rules:
  - id: google-cloud-go-auth-library
    desc: Google Cloud Go auth library
    any:
      - id: archive-path
      - id: module-import
