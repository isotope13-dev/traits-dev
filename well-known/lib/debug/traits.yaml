defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99
# The npm debug package is a logging dependency. These implementation markers
# identify the library; they do not indicate hostile behavior.
traits:
  - id: common-api-marker
    desc: debug logger humanize API marker
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'createDebug.humanize = requireMs()'

  - id: browser-storage-marker
    desc: debug logger browser storage marker
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'exports\.storage\.getItem\(\s*["'']debug["'']\s*\)'

  - id: node-formatter-marker
    desc: debug logger Node formatter marker
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'util\.formatWithOptions\(exports\.inspectOpts'

composite_rules:
  - id: debug-library
    desc: Recognized debug JavaScript library bundle
    crit: notable
    conf: 0.99
    all:
      - id: common-api-marker
      - id: browser-storage-marker
      - id: node-formatter-marker
