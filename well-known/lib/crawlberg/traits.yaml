# Crawlberg's browser crate is a benign headless-browser dependency.  Keep the
# identity separate from browser capabilities so the package can be attributed
# without treating its ordinary network and JavaScript support as hostile.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

traits:
  - id: crawlberg-browser-package-name
    desc: Crawlberg browser Rust crate
    crit: notable
    conf: 1.0
    if:
      type: value
      path: package.name
      exact: crawlberg-browser
