# AntV's mobile interaction plugin is a browser event adapter for g-lite.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: source-package-marker
    desc: AntV mobile interaction package marker
    for: [javascript, typescript]
    if:
      type: text
      exact: '@antv/g-plugin-mobile-interaction'

  - id: mobile-interaction-plugin-class
    desc: AntV mobile plugin class in package source
    for: [javascript, typescript]
    if:
      # g-lite bundles this implementation as a built-in export.  The class
      # name alone is therefore not a package identity; require the package
      # marker in the same source unit as the class.
      type: text
      regex: '(?s)@antv/g-plugin-mobile-interaction.{0,800}\bMobileInteractionPlugin\b'

  - id: package-name
    desc: AntV mobile interaction package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/g-plugin-mobile-interaction'

composite_rules:
  - id: mobile-interaction-library
    desc: AntV mobile interaction library identity
    any:
      - id: source-package-marker
      - id: mobile-interaction-plugin-class
      - id: package-name
