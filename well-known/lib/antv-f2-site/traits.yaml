# @antv/f2-site is AntV's Gatsby documentation/site package for F2.
# These rules identify the published package and its site-build context; they
# do not infer anything hostile from the package name or its dependencies.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV F2 site package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/f2-site'

  - id: source-package-marker
    desc: AntV F2 site package marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@antv/f2-site'

  - id: package-repository
    desc: AntV F2 site repository identity
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: https://github.com/antvis/f2

  - id: archive-package-name
    desc: AntV F2 site npm archive name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@antv/f2-site'

  - id: archive-package-repository
    desc: AntV F2 site archive repository identity
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: https://github.com/antvis/f2

  - id: gatsby-site-build-script
    desc: Gatsby site build script
    for: [package.json]
    if:
      type: value
      path: scripts.site:build
      regex: '(^|&&\s*)gatsby\s+build\b'

composite_rules:
  - id: official-package
    desc: Official AntV F2 site package identity
    crit: notable
    for: [package.json]
    all:
      - id: package-name
      - id: package-repository

  - id: official-archive
    desc: Official AntV F2 site npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-package-repository

  - id: site-package
    desc: AntV F2 Gatsby site package context
    crit: notable
    for: [package.json]
    all:
      - id: official-package
      - id: gatsby-site-build-script
