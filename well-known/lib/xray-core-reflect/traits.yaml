# Xray-core configuration JSON marshaller identity. Reflection and JSON
# serialization are neutral data-handling capabilities in this package.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: reflect-package-declaration
    desc: Xray reflection package declaration
    if:
      type: text
      regex: '(?m)^package\s+reflect\b'

  - id: json-marshaller-function
    desc: Xray configuration JSON marshaller
    if:
      type: function
      exact: MarshalToJson

  - id: json-without-escape-function
    desc: Xray JSON encoder without HTML escaping
    if:
      type: function
      exact: JSONMarshalWithoutEscape

  - id: typed-message-marshaller
    desc: Xray typed-message marshaller
    if:
      type: function
      exact: marshalTypedMessage

  - id: port-list-serializer
    desc: Xray port-list serializer
    if:
      type: function
      exact: serializePortList

composite_rules:
  - id: configuration-marshaller-source
    desc: Xray-core configuration marshaller source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-common-net-package-import
      - id: well-known/lib/xray-core::xray-serial-config-import
      - id: reflect-package-declaration
      - id: json-marshaller-function
      - id: json-without-escape-function
      - id: typed-message-marshaller
      - id: port-list-serializer
