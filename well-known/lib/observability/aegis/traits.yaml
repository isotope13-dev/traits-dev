# Tencent Aegis web monitoring SDK, bundled into Tencent's own web panels. Its
# XHR and fetch wrappers copy request bodies and its remote loaders fetch
# Tencent-hosted helpers. The bookkeeping names are SDK internals, so they
# identify the bundle rather than a payload. Only the unless: clauses of the
# body-relay and script-loader composites use this trait.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: aegis-sdk-bookkeeping
    desc: Tencent Aegis SDK request hook bookkeeping
    if:
      type: text
      regex: 'sendByAegis|aegisXhrStartTime'
