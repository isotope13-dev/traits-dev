defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - typescript
  - markdown
traits:
- id: pino-package-name
  desc: Pino logging library package name
  crit: notable
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: name
    exact: pino
- id: pino-upstream-source-marker
  desc: Pino README transport wording
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: In Pino terminology[\s\S]{0,200}pino\.transport
- id: pino-source-branding
  desc: Pino transport API or README wording
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\bPino terminology\b|\bpino\.transport\b|\bpino-std-serializers\b
- id: pino-transport-source-path
  desc: Bundled Pino transport module path
  crit: notable
  conf: 0.99
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: pino(@[0-9.]+)?/node_modules/pino/lib/transport\.js
- id: pino-preload-sanitizer-source
  desc: Pino worker preload sanitizer source
  crit: notable
  conf: 0.99
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: function sanitizeNodeOptions\s*\(\s*nodeOptions\s*\)
composite_rules:
- id: pino-minified-preload-sanitizer
  desc: Minified Pino preload sanitizer
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  near_bytes: 400
  all:
  - id: micro-behaviors/os/env/runtime::node-options-inherited-comparison
  - id: micro-behaviors/os/env/runtime::node-options-child-env-override
- id: pino-library-context
  desc: Recognized Pino logging library package context
  crit: exception
  conf: 0.99
  for:
  - package.json
  - javascript
  - typescript
  - markdown
  - npm
  scope: archive
  all:
  - id: pino-package-name
  - id: pino-upstream-source-marker
