defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.98
  size_max: 8000000
traits:
- id: lrkt-cdn-logger-banner
  desc: LogRocket lrkt-in CDN logger banner
  crit: notable
  size_min: 1024
  if:
    type: text
    substr: cdn.lrkt-in.com/logger.min.js
- id: logrocket-product-marker
  desc: LogRocket product string marker
  crit: notable
  size_min: 1024
  if:
    type: text
    substr: 'LogRocket:'
- id: logrocket-init-call
  desc: Initializes LogRocket session recording
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '\b[lL]og[Rr]ocket\s*\.\s*init\s*\('
    exclude_comments: true
- id: logrocket-identify-call
  desc: Identifies LogRocket session user
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b[lL]og[Rr]ocket\s*\.\s*identify\s*\('
    exclude_comments: true
- id: logrocket-session-url-callback
  desc: Retrieves LogRocket session replay URL
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: '(^|\.)getSessionURL$'
