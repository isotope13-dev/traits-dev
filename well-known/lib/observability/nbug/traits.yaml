# NBug is a .NET crash-reporting library. Its encrypted HTTP reporting loop is
# diagnostic telemetry, so it suppresses the generic backdoor composite when
# the library identity is present.
defaults:
  platforms: [windows, unix]
  for: [csharp, dll, exe]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 10000000

traits:
  - id: nbug-library
    desc: NBug crash-reporting library
    if:
      type: text
      regex: '(?i)(\bNBug\b|NBug\.Configure|NBug\.Deployment)'
