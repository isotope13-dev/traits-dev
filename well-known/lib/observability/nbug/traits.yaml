# NBug (Teoman Soygul) is an open-source .NET crash-reporting library: an
# unhandled exception is serialized, encrypted and posted to whatever endpoint
# the host application configured -- HTTP, mail or FTP. That is every leg of a
# "unsigned .NET assembly decrypts traffic from an HTTP client" composite, with
# nothing that establishes tasking, so applications that embed it (Bulk Crap
# Uninstaller ships NBug.dll beside its own binaries) read as implants.
defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: nbug-product-name
    desc: NBug crash reporting library name
    if:
      type: value
      path: pe.version.product_name
      exact: NBug

  - id: nbug-comments
    desc: NBug crash reporting library comment
    if:
      type: value
      path: pe.version.comments
      substr: NBug bug reporting library

  - id: nbug-api-strings
    desc: NBug crash reporting library strings
    for: [csharp, dll, exe]
    size_min: 1000
    if:
      type: text
      regex: '(?i)(\bNBug\b|NBug\.Configure|NBug\.Deployment)'

composite_rules:
  - id: nbug-library
    desc: Recognized NBug crash reporting library
    crit: notable
    conf: 0.99
    all:
      - id: nbug-product-name
      - id: nbug-comments
