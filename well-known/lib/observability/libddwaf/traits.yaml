# libddwaf — Datadog WAF Ruby gem (DataDog/libddwaf-rb).
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 1073741824

traits:
  - id: gem-name
    desc: libddwaf Ruby gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: libddwaf

  - id: vendor-libddwaf-member
    desc: vendored libddwaf native bundle member basename
    for: [ruby, so, elf]
    if:
      type: path
      regex: '(^|[\\/])libddwaf-[0-9]'

  - id: libddwaf-shared-library
    desc: libddwaf shared library basename
    for: [so, elf]
    if:
      type: basename
      exact: libddwaf.so

  - id: datadog-waf-module
    desc: Datadog AppSec WAF Ruby module namespace
    for: [ruby]
    if:
      type: text
      substr: module Datadog::AppSec::WAF

  - id: libddwaf-upstream-reference
    desc: DataDog libddwaf upstream reference
    for: [ruby]
    if:
      type: text
      substr: github.com/DataDog/libddwaf

composite_rules:
  - id: package-identity
    desc: Datadog libddwaf WAF library identity
    for: [gem, ruby, so, elf]
    needs: 2
    any:
      - id: gem-name
      - id: datadog-waf-module
      - id: vendor-libddwaf-member
      - id: libddwaf-shared-library
      - id: libddwaf-upstream-reference

  - id: package-context
    desc: Datadog libddwaf WAF library context
    crit: exception
    for: [gem, ruby, so, elf]
    any:
      - id: gem-name
      - id: vendor-libddwaf-member
      - id: libddwaf-shared-library
      - id: datadog-waf-module
    all:
      - id: libddwaf-upstream-reference
