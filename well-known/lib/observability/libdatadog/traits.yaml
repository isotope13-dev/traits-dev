# libdatadog — Datadog Ruby gem shipping native profiling and crashtracker libs.
defaults:
  platforms: [unix]
  for: [gem, ruby, elf, so, c]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 1073741824

traits:
  - id: libdatadog-gem-name
    desc: libdatadog Ruby gem name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: libdatadog

  - id: libdatadog-vendor-path
    desc: libdatadog vendored native dependency path
    if:
      type: path
      regex: '(^|[\\/])vendor[\\/]libdatadog-'

  - id: libdatadog-profiling-library
    desc: libdatadog profiling shared library basename
    for: [so, elf]
    if:
      type: basename
      exact: libdatadog_profiling.so

  - id: libdatadog-crashtracker-receiver
    desc: libdatadog crashtracker receiver binary
    for: [elf]
    if:
      type: basename
      exact: libdatadog-crashtracking-receiver
