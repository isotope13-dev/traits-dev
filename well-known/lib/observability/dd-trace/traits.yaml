# dd-trace — Datadog APM tracing client for JavaScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

traits:
  - id: dd-trace-package-name
    desc: Datadog APM tracing client package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: dd-trace

  - id: dd-trace-preload-instruction
    desc: Datadog tracer Node preload instruction
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(--require[= ]|-r\s+|--import[= ])\s*dd-trace/(init|ci/init|initialize|register)\b'

composite_rules:
  - id: dd-trace-preload-context
    desc: Datadog tracer Node preload instruction context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/runtime::node-options-preload-value
      - id: dd-trace-preload-instruction
