# Rollbar error monitoring and crash reporting SDK for Go.
defaults:
  platforms: [unix, windows]
  for: [go, zip]
  crit: notable
  conf: 0.98

traits:
  - id: rollbar-api-endpoint
    desc: Rollbar API item reporting endpoint
    for: [go]
    if:
      type: text
      substr: 'https://api.rollbar.com/api/1/item/'

  - id: rollbar-go-package-declaration
    desc: Rollbar Go SDK package declaration
    for: [go]
    if:
      type: text
      regex: '(?m)^package rollbar\b'

  - id: rollbar-go-module-path
    desc: Rollbar Go client module path
    if:
      type: path
      regex: '(?i)github\.com[\\/](rollbar|ActiveState)[\\/]rollbar-go'

  - id: rollbar-notifier-name
    desc: Rollbar notifier client identity
    for: [go]
    if:
      type: text
      substr: 'rollbar/rollbar-go'

composite_rules:
  - id: rollbar-go-client
    desc: Rollbar Go error reporting client
    crit: notable
    conf: 0.99
    all:
      - id: rollbar-api-endpoint
    any:
      - id: rollbar-go-package-declaration
      - id: rollbar-go-module-path
      - id: rollbar-notifier-name
