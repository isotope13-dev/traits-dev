# BugTrap (IntelleSoft / Maksim Pyatkovskiy) is an open-source Win32/x64 C++
# crash reporting library for unhandled SEH/C++ exceptions. It captures mini-dumps,
# reads process memory, and submits reports over HTTP/WinInet or email.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: bugtrap-product-name
    desc: BugTrap crash reporting library name
    if:
      type: value
      path: pe.version.product_name
      exact: BugTrap

  - id: bugtrap-export-filter
    desc: BugTrap SEH filter export
    if:
      type: symbol
      regex: '^_?BT_InstallSehFilter(@\d+)?$'

  - id: bugtrap-export-snapshot
    desc: BugTrap send snapshot export
    if:
      type: symbol
      regex: '^_?BT_SendSnapshot(@\d+)?$'

composite_rules:
  - id: bugtrap-crash-reporting-library
    desc: Recognized BugTrap crash reporting library
    crit: notable
    conf: 0.99
    all:
      - id: bugtrap-product-name
    any:
      - id: bugtrap-export-filter
      - id: bugtrap-export-snapshot
