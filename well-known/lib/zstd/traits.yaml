defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, macho]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: zstandard-native-library
    desc: Zstandard native compression library
    if:
      type: value
      path: pe.version.product_name
      exact: Zstandard
