# tap — Node.js Test-Anything Protocol test runner.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, text]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-name
    desc: tap npm test runner package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: tap

  - id: archive-path
    desc: tap npm pack archive path
    if:
      type: path
      regex: '(^|[\\/])tap@[0-9]'

composite_rules:
  - id: tap-test-runner
    desc: tap Test-Anything Protocol runner
    any:
      - id: package-name
      - id: archive-path
