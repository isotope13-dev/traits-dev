# gRPC (https://github.com/grpc/grpc) — Google's multi-language RPC framework.
# Source trees are widely mirrored (Packagist PIE, vendored third_party/, language
# bindings) and their build/test helpers frequently trip capability heuristics
# (hosts-file edits in CFStream tests, setuptools build_ext linker probes, etc.).
# Stable content markers identify the tree so those contexts can be understood.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: grpc-authors-line
    desc: gRPC authors attribution line
    for: [c, cpp, python, php, ruby, go, java]
    if:
      type: text
      regex: 'gRPC authors\.|Copyright [0-9]{4} gRPC authors'
  - id: grpc-core-header-include
    desc: Includes grpc/grpc.h core header
    for: [c, cpp]
    if:
      type: text
      regex: '#\s*include\s*[<"]grpc/grpc\.h[>"]'
  - id: pie-mirror-manifest
    desc: PIE PHP extension mirror manifest
    for: [json]
    if:
      type: value
      path: php_ext_name
      exists: true
  - id: pie-mirror-upstream-github
    desc: PIE mirror declares GitHub upstream
    for: [json]
    if:
      type: value
      path: upstream.type
      exact: github
  - id: pie-extensions-grpc-package
    desc: pie-extensions/grpc Packagist package
    for: [composer.json, json]
    if:
      type: value
      path: name
      exact: pie-extensions/grpc

composite_rules:
  - id: grpc-source-tree
    desc: gRPC upstream source tree
    crit: notable
    conf: 0.96
    any:
      - id: grpc-authors-line
      - id: grpc-core-header-include
  - id: pie-php-extension-mirror
    desc: PIE PHP extension mirror package
    crit: notable
    conf: 0.96
    for: [json, zip, tar]
    all:
      - id: pie-mirror-manifest
      - id: pie-mirror-upstream-github
  - id: pie-extensions-grpc-mirror
    desc: pie-extensions gRPC PIE mirror
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: pie-extensions-grpc-package
      - id: pie-php-extension-mirror
