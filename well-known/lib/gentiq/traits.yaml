# Gentiq: modular Python framework for production AI chatbot backends.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: distribution-name
    desc: Gentiq Python distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: gentiq

  - id: package-name
    desc: Gentiq package metadata name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: gentiq

  - id: upstream-repository
    desc: Gentiq upstream repository marker
    for: [pkginfo, python, markdown]
    conf: 0.99
    if:
      type: text
      regex: 'github\.com/arxyzan/gentiq'

composite_rules:
  - id: package-identity
    desc: Gentiq AI backend framework
    conf: 0.99
    any:
      - id: distribution-name
      - id: package-name
      - id: upstream-repository
