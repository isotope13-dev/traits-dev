# This package is AntV's empty CSS Typed OM API compatibility surface.
# It contains no runtime implementation or install-time behavior.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV CSS Typed OM API package name
    if:
      type: value
      path: name
      exact: '@antv/g-css-typed-om-api'

  - id: css-typed-om-description
    desc: AntV CSS Typed OM API package description
    if:
      type: value
      path: description
      regex: '(?i)CSS Typed OM API'

  - id: antv-g-lite-peer-dependency
    desc: AntV g-lite peer dependency
    if:
      type: value
      path: peerDependencies.@antv/g-lite
      exists: true
