# Dropwizard Metrics Core is a legitimate metrics/reporting library. These
# markers identify the upstream library; they do not suppress its file-output
# capability or infer anything hostile from CSV reporting.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: dropwizard-metrics-core-jar
    desc: Dropwizard Metrics Core JAR identity
    for: [jar]
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: io.dropwizard.metrics.core

  - id: dropwizard-metrics-core-namespace
    desc: Dropwizard Metrics Core class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^com/codahale/metrics/'
