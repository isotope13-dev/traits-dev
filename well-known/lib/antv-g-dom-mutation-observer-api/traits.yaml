# This package is AntV's DOM MutationObserver compatibility implementation.
# The package identity is distinct from neutral DOM event and rendering APIs.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV DOM MutationObserver package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/g-dom-mutation-observer-api'

  - id: source-package-marker
    desc: AntV DOM MutationObserver package marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@antv/g-dom-mutation-observer-api'

  - id: antv-g-lite-dependency
    desc: AntV g-lite rendering dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.@antv/g-lite
      exists: true
