# Xray-core Finalmask XICMP schema identity.  This is a protobuf definition,
# not executable traffic or a payload.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.99

traits:
  - id: xicmp-package
    desc: Xray Finalmask XICMP package
    if:
      type: text
      regex: '(?m)^package\s+xray\.transport\.internet\.finalmask\.xicmp\s*;'

composite_rules:
  - id: xicmp-schema
    desc: Xray Finalmask XICMP schema
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: xicmp-package
