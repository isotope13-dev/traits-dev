# google.golang.org/genproto — generated Go protobuf types for Google APIs.
defaults:
  platforms: [unix, windows]
  for: [go, text, zip]
  crit: notable
  conf: 0.98

traits:
  - id: archive-path
    desc: google.golang.org/genproto module archive path
    if:
      type: path
      regex: 'google\.golang\.org/genproto@'

  - id: module-import
    desc: google.golang.org/genproto import path
    for: [go]
    if:
      type: import
      substr: google.golang.org/genproto/

composite_rules:
  - id: google-genproto-library
    desc: Google genproto generated protobuf module
    any:
      - id: archive-path
      - id: module-import
