# @antv/f-charts is AntV's small F2 column-chart component wrapper.  These
# rules identify the library; dependency behavior and future compromised
# releases must still be evaluated by their own traits.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV F Charts package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/f-charts'

  - id: source-package-marker
    desc: AntV F Charts package marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@antv/f-charts'

  - id: source-repository
    desc: AntV F Charts source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/antvis/FEngine

composite_rules:
  - id: f-charts-library
    desc: AntV F Charts chart component library identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: source-package-marker
      - id: source-repository
