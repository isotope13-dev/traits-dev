defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: mapstruct-processor-pom-group
    desc: MapStruct annotation processor Maven group
    for: [jar]
    if:
      type: value
      path: jar.pom.group_id
      exact: org.mapstruct

  - id: mapstruct-processor-pom-artifact
    desc: MapStruct annotation processor Maven artifact
    for: [jar]
    if:
      type: value
      path: jar.pom.artifact_id
      exact: mapstruct-processor

  - id: mapstruct-processor-jar
    desc: MapStruct annotation processor JAR
    for: [jar]
    if:
      type: basename
      regex: '(^|[-_.])mapstruct-processor-[0-9][A-Za-z0-9._-]*\.jar$'

  - id: mapstruct-class-namespace
    desc: MapStruct annotation processor class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^org/mapstruct(/|$)'

composite_rules:
  - id: mapstruct-processor-library
    desc: MapStruct annotation processor library
    for: [jar]
    all:
      - id: mapstruct-processor-pom-group
      - id: mapstruct-processor-pom-artifact
