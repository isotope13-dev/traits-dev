# Jetty Servlet is a legitimate servlet-container component. Reflective class
# loading and servlet instantiation are core container behavior, not a loader
# or injection signal by themselves.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: jetty-servlet-jar
    desc: Jetty Servlet JAR identity
    for: [jar]
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: org.eclipse.jetty.servlet

  - id: jetty-servlet-namespace
    desc: Jetty Servlet class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^org/eclipse/jetty/servlet/'
