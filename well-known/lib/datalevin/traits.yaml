defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: datalevin-package-name
    desc: Datalevin Node bindings package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: datalevin-node
  - id: datalevin-repository
    desc: Datalevin upstream repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/datalevin/datalevin(\.git)?$'
  - id: datalevin-java-bridge-import
    desc: Datalevin dynamically loads JVM bridge
    for: [javascript]
    if:
      type: text
      regex: 'bridgeModulePromise[\s\S]{0,180}import\s*\(\s*["'']java-bridge["'']\s*\)'

composite_rules:
  - id: datalevin-package-context
    desc: Recognized Datalevin Node binding package context
    crit: exception
    conf: 0.99
    for: [npm, tar]
    scope: archive
    all:
      - id: datalevin-package-name
      - id: datalevin-repository
