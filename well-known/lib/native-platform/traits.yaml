# net.rubygrapefruit native-platform — the JNI filesystem/terminal/process
# shim that Gradle loads on every build. Its per-platform binaries
# (native-platform.dll, libnative-platform.so/.dylib, and the -curses
# variants) are unsigned native code that ships inside every Gradle
# distribution, every Gradle wrapper cache, and every shadowed Gradle plugin
# fat-jar, so analysts meet them constantly with no identity attached.
#
# Its job explains the capability set an analyst sees: enumerating logical
# drives and volumes (FileSystems.listFileSystems), walking directories,
# reading/writing files, switching the working directory, driving the Windows
# console, and reading the registry.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, dll, elf, so, macho, dylib]
  conf: 0.99

traits:
  - id: native-platform-jni-exports
    desc: Gradle native-platform JNI exports
    crit: notable
    count_min: 3
    size_min: 4096
    size_max: 8388608
    if:
      type: export
      substr: "Java_net_rubygrapefruit_platform_internal_jni_"

  - id: native-platform-java-package
    desc: Gradle native-platform Java package referenced
    crit: notable
    for: [jar, class, java]
    if:
      type: text
      substr: "net/rubygrapefruit/platform/internal/jni/"
