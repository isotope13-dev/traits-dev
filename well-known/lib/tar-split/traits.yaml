# github.com/vbatts/tar-split — tar archive split/merge library.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: github.com/vbatts/tar-split module archive path
    if:
      type: path
      regex: 'github\.com/vbatts/tar-split@'

  - id: module-import
    desc: github.com/vbatts/tar-split import path
    for: [go]
    if:
      type: import
      substr: github.com/vbatts/tar-split

composite_rules:
  - id: tar-split-library
    desc: vbatts tar-split Go module
    any:
      - id: archive-path
      - id: module-import
