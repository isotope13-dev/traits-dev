# These identities are specific to JRebel's vendor libraries and provide
# benign context for generic JVM behavior traits.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar]
  crit: notable
  conf: 0.99

traits:
  - id: browser-controller-class
    desc: JRebel browser controller class
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      exact: org/zeroturnaround/javarebel/reporting/backend/impl/BrowserController

  - id: ide-remoting-client-jar
    desc: JRebel IDE remoting client JAR
    for: [jar]
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: jr-ide-remoting-client
