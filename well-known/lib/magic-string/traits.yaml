# magic-string is a legitimate JavaScript/TypeScript source transformation
# library. These markers identify its declaration surface; they do not infer
# anything hostile from string rewriting or source-map generation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: default-magic-string-class
    desc: magic-string default class declaration
    crit: component
    if:
      type: text
      regex: 'export\s+default\s+class\s+MagicString\b'

  - id: magic-string-sourcemap-api
    desc: magic-string decoded sourcemap API
    crit: component
    if:
      type: text
      regex: 'generateDecodedMap\s*\(.{0,80}\)\s*:\s*DecodedSourceMap\b'

  - id: magic-string-range-editing-api
    desc: magic-string indexed editing API
    crit: component
    if:
      type: text
      regex: '\b(appendLeft|appendRight|overwrite|snip)\s*\([^\n]{0,120}\)\s*:\s*MagicString\b'

composite_rules:
  - id: magic-string-library
    desc: magic-string source transformation library
    crit: notable
    conf: 0.99
    all:
      - id: default-magic-string-class
      - id: magic-string-sourcemap-api
      - id: magic-string-range-editing-api
