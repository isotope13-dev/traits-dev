# LuaFileSystem (lfs) is a legitimate native Lua module.  Some legacy builds
# place the first PT_LOAD over both code and data, making the ELF entry point
# appear writable and the load segment W+X.  That layout is a library build
# artifact, not evidence of a self-unpacking loader when the lfs ABI is present.
defaults:
  platforms: [unix]
  for: [elf, so]

traits:
  - id: luaopen-lfs-export
    desc: LuaFileSystem module entry-point export
    crit: notable
    conf: 0.99
    size_min: 1000
    size_max: 2000000
    if:
      type: export
      exact: luaopen_lfs

  - id: directory-api
    desc: LuaFileSystem directory API import
    crit: notable
    conf: 0.98
    size_min: 1000
    size_max: 2000000
    if:
      type: import
      exact: opendir

  - id: file-status-api
    desc: LuaFileSystem file-status API import
    crit: notable
    conf: 0.98
    size_min: 1000
    size_max: 2000000
    if:
      type: import
      exact: fstat

composite_rules:
  - id: luafilesystem-native-module
    desc: Recognized LuaFileSystem native module
    crit: notable
    conf: 0.99
    all:
      - id: luaopen-lfs-export
      - id: directory-api
    any:
      - id: file-status-api
      - id: micro-behaviors/fs/directory/readdir::readdir-readdir
