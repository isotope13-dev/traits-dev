defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  - javascript
  crit: baseline
  conf: 0.95
  size_max: 5000000
traits:
- id: freemius-copyright
  desc: Freemius SDK copyright header
  for:
  - php
  if:
    type: text
    substr: Freemius, Inc.
- id: freemius-sdk-constant
  desc: Freemius WP_FS__ SDK constant
  for:
  - php
  if:
    type: text
    regex: WP_FS__[A-Z_]{2,40}
- id: freemius-js-ref
  desc: Freemius SDK JavaScript asset
  for:
  - javascript
  if:
    type: text
    substr: freemius
    case_insensitive: true

- id: freemius-lite-class
  desc: Freemius Lite SDK class
  crit: notable
  conf: 0.99
  for:
  - php
  if:
    type: text
    regex: '\bclass\s+Freemius_Lite\b'

- id: freemius-lite-initializer
  desc: Freemius Lite SDK initializer
  crit: notable
  conf: 0.99
  for:
  - php
  if:
    type: function
    exact: fs_lite_dynamic_init

- id: freemius-lite-api-endpoint
  desc: Freemius Lite API endpoint
  crit: notable
  conf: 0.99
  for:
  - php
  if:
    type: literal
    substr: freemius/v1/middleware

composite_rules:
- id: freemius-sdk
  desc: Freemius monetization SDK
  crit: notable
  conf: 0.97
  needs: 2
  any:
  - id: freemius-copyright
  - id: freemius-sdk-constant
  - id: freemius-js-ref

- id: freemius-lite-sdk
  desc: Freemius Lite monetization SDK
  crit: notable
  conf: 0.99
  for:
  - php
  scope: archive
  all:
  - id: freemius-lite-class
  - id: freemius-lite-initializer
