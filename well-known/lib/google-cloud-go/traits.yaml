# cloud.google.com/go — Google Cloud client libraries for Go (monorepo).
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: cloud.google.com/go module archive path
    if:
      type: path
      regex: 'cloud\.google\.com/go@'

  - id: module-import
    desc: cloud.google.com/go import path
    for: [go]
    if:
      type: import
      substr: cloud.google.com/go/

composite_rules:
  - id: google-cloud-go-library
    desc: Google Cloud Go client libraries module
    any:
      - id: archive-path
      - id: module-import
