defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: notable
  conf: 0.98
  size_min: 4096

traits:
  - id: libgit2-init-api
    desc: libgit2 initialization API
    if:
      type: import
      exact: git_libgit2_init

  - id: libgit2-ssh-credential-api
    desc: libgit2 SSH credential API
    if:
      type: import
      regex: '^git_cred_ssh_key_(new|from_agent)$'

  - id: libgit2-product-name
    desc: libgit2 product metadata
    platforms: [windows]
    for: [dll]
    size_min: 500000
    size_max: 8388608
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: libgit2

  - id: libgit2-file-description
    desc: libgit2 file description metadata
    platforms: [windows]
    for: [dll]
    size_min: 500000
    size_max: 8388608
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: libgit2 - the Git linkable library

  - id: libgit2-init-export
    desc: libgit2 initialization export
    platforms: [windows]
    for: [dll]
    size_min: 500000
    size_max: 8388608
    crit: component
    conf: 0.99
    if:
      type: symbol
      exact: git_libgit2_init

composite_rules:
  - id: libgit2-ssh-credential-support
    desc: libgit2 SSH credential support
    all:
      - id: libgit2-init-api
      - id: libgit2-ssh-credential-api

  - id: libgit2-windows-library
    desc: Windows libgit2 linkable Git library
    platforms: [windows]
    for: [dll]
    size_min: 500000
    size_max: 8388608
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: libgit2-product-name
      - id: libgit2-file-description
      - id: libgit2-init-export
