# gVisor's userspace TCP/IP stack is a legitimate networking dependency.
# These markers identify its Go stack implementation; they do not imply that
# a caller using the stack or raw-packet API is malicious.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: tcpip-package-import
    desc: Imports the gVisor TCP/IP package
    if:
      type: import
      regex: '^gvisor\.dev/gvisor/pkg/tcpip($|/)'

  - id: stack-constructor-call
    desc: Calls a stack.New constructor
    crit: component
    if:
      type: symbol
      kind: call
      exact: stack.New

  - id: raw-packet-writer-call
    desc: Calls a WriteRawPacket method
    crit: component
    if:
      type: symbol
      kind: call
      regex: '(^|\.)WriteRawPacket$'

composite_rules:
  - id: network-stack-source
    desc: GVisor network stack source
    crit: notable
    conf: 0.99
    all:
      - id: tcpip-package-import
      - id: stack-constructor-call
      - id: raw-packet-writer-call
