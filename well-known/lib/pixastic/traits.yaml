defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: pixastic-source-path
    desc: Pixastic image-processing source path
    if:
      type: path
      regex: '(^|[\\/])pixastic([\\/]|$)'
  - id: pixastic-library-marker
    desc: Pixastic image-processing library marker
    if:
      type: text
      substr: Pixastic

composite_rules:
  - id: pixastic-library-context
    desc: Recognized Pixastic image-processing library source
    crit: exception
    conf: 0.99
    all:
      - id: pixastic-source-path
      - id: pixastic-library-marker
