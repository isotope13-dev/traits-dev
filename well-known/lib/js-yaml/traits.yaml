# js-yaml is the standard Node.js YAML 1.2 parser. Its dumper indexes
# escape-sequence tables with hex code points, not obfuscated strings.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: js-yaml npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: js-yaml

  - id: nodeca-repository
    desc: js-yaml nodeca upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/nodeca/js-yaml(\.git)?'

  - id: escape-sequence-table
    desc: js-yaml dumper escape sequence table
    for: [javascript]
    if:
      type: text
      substr: ESCAPE_SEQUENCES

composite_rules:
  - id: package-context
    desc: Recognized js-yaml parser package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: nodeca-repository
