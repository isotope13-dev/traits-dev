# @kudoai/ai-personas bundles persona prompt text that may quote phrases like
# "without human approval" inside fictional persona definitions.
defaults:
  platforms: [unix, windows]
  for: [package.json, json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: KudoAI ai-personas npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@kudoai/ai-personas'

  - id: persona-distribution-artifact
    desc: ai-personas bundled persona JSON artifact
    for: [json]
    if:
      type: path
      regex: 'ai-personas\.(min\.)?json$'

composite_rules:
  - id: persona-library-context
    desc: KudoAI ai-personas persona definition library
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: persona-distribution-artifact
