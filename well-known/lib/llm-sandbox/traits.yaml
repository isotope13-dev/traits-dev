defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl]
  crit: baseline
  conf: 0.99

traits:
  - id: package-name
    desc: llm-sandbox PyPI package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: llm-sandbox

  - id: package-repository
    desc: llm-sandbox project repository
    crit: component
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      regex: 'github\.com/vndee/llm-sandbox([/\s]|$)'

  - id: python-package-path
    desc: llm-sandbox Python package path
    crit: component
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])llm_sandbox[\\/]'

composite_rules:
  - id: package-context
    desc: Recognized llm-sandbox Python package
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: package-repository
      - id: python-package-path
