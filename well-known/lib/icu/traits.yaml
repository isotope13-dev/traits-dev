defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000000
  size_max: 100000000

traits:
  - id: icu-data-runtime-library
    desc: ICU Unicode data runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^(lib)?icudt[0-9]*\.dll$'
  - id: icu-i18n-runtime-library
    desc: ICU internationalization runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^(lib)?icuin[0-9]*\.dll$'
  - id: icu-common-runtime-library
    desc: ICU common runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '(?i)^(lib)?icuuc[0-9]*\.dll$'
