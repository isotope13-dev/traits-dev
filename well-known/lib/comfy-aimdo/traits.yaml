defaults:
  platforms: [windows]
  for: [dll]
  size_min: 100000
  size_max: 500000

traits:
  - id: comfy-aimdo-source-tree
    desc: Comfy-Aimdo source tree marker
    crit: component
    conf: 0.99
    if:
      type: text
      section: .rdata
      regex: '(?i)[\\/]comfy-aimdo[\\/]comfy-aimdo[\\/]src[\\/]'

  - id: comfy-aimdo-detours-source
    desc: Comfy-Aimdo CUDA detour source marker
    crit: component
    conf: 0.99
    if:
      type: text
      section: .rdata
      substr: src-win/cuda-detour.c

  - id: comfy-aimdo-model-map-export
    desc: Comfy-Aimdo model mapping export
    crit: component
    conf: 0.99
    if:
      type: symbol
      exact: model_mmap_allocate

  - id: comfy-aimdo-hook-setup
    desc: Comfy-Aimdo GPU hook setup marker
    crit: component
    conf: 0.98
    if:
      type: text
      section: .rdata
      substr: aimdo_setup_hooks

composite_rules:
  - id: comfy-aimdo-library
    desc: Comfy-Aimdo GPU memory-management library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: comfy-aimdo-source-tree
      - id: comfy-aimdo-detours-source
      - id: comfy-aimdo-model-map-export
      - id: comfy-aimdo-hook-setup
