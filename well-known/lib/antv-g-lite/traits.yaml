# AntV's g-lite rendering core.  Keep its package identity separate from
# similarly named DOM compatibility packages: the matcher below identifies a
# dependency, not g-dom-mutation-observer-api itself.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: dependency
    desc: AntV g-lite rendering dependency
    if:
      type: value
      path: dependencies.@antv/g-lite
      exists: true
