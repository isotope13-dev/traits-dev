# Xray-core's transport/pipe constructor source.  This package creates an
# in-memory buffered Reader/Writer pair; it does not create an OS named pipe.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: pipe-package-declaration
    desc: Go in-memory pipe package declaration
    if:
      type: text
      regex: '(?m)^package\s+pipe\b'

  - id: pipe-option-type
    desc: Go pipe option function type
    if:
      type: text
      regex: '(?m)^type\s+Option\s+func\(\*pipeOption\)'

  - id: pipe-constructor-function
    desc: Go pipe Reader Writer constructor
    if:
      type: text
      regex: '(?m)^func\s+New\s*\(opts\s+\.\.\.Option\)\s+\(\*Reader,\s+\*Writer\)'

  - id: buffer-policy-context-call
    desc: Xray buffer policy context call
    if:
      type: symbol
      kind: call
      exact: policy.BufferPolicyFromContext

  - id: notifier-constructor-calls
    desc: Xray pipe notifier constructor calls
    count_min: 2
    if:
      type: symbol
      kind: call
      exact: signal.NewNotifier

  - id: completion-signal-constructor
    desc: Xray pipe completion signal constructor
    if:
      type: symbol
      kind: call
      exact: done.New

composite_rules:
  - id: pipe-constructor-source
    desc: Xray in-memory pipe constructor source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: pipe-package-declaration
      - id: pipe-option-type
      - id: pipe-constructor-function
      - id: buffer-policy-context-call
      - id: notifier-constructor-calls
      - id: completion-signal-constructor
