# AWS IAM API TypeScript declarations — typed shapes for Users/Groups/Roles/
# Policies and an IAMClient that speaks the IAM XML wire protocol. Pure type
# surface; no runtime behavior of its own.
defaults:
  platforms: [unix, windows]
  for: [typescript, javascript]
  crit: notable
  conf: 0.95
  size_min: 2000
  size_max: 500000

traits:
  - id: iam-user-interface
    desc: IAMUser TypeScript interface declaration
    conf: 0.95
    if:
      type: text
      substr: 'export interface IAMUser'

  - id: iam-client-class
    desc: IAMClient TypeScript class declaration
    conf: 0.98
    if:
      type: text
      substr: 'export declare class IAMClient'

  - id: iam-simulate-principal-policy
    desc: IAM simulatePrincipalPolicy method declaration
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'simulatePrincipalPolicy(params: SimulatePrincipalPolicyParams)'

composite_rules:
  # Any two of the three declaration markers identify the file: the resource
  # interfaces, the client class, and the simulate-policy method each cover a
  # different part of the IAM declaration surface, and generated or split
  # `.d.ts` bundles do not always carry all three.
  - id: aws-iam-typescript-declarations
    desc: AWS IAM TypeScript API declaration file
    conf: 0.97
    any:
      - id: iam-user-interface
      - id: iam-client-class
      - id: iam-simulate-principal-policy
    needs: 2
