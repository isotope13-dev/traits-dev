# Xray-core AES-128-GCM packet adapter identity. The adapter is a transport
# codec over a caller-provided PacketConn; it is not a payload or C2 verdict.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: package-declaration
    desc: Xray AES-128-GCM package declaration
    crit: component
    if:
      type: text
      regex: '(?m)^package\s+aes128gcm\b'

  - id: packet-connection-type
    desc: Xray AES-128-GCM PacketConn type
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+aes128gcmConn\s+struct\s*\{'

  - id: key-size
    desc: Xray AES-128-GCM key slice
    crit: component
    if:
      type: text
      regex: 'crypto\.NewAesGcm\(\s*[A-Za-z_$][A-Za-z0-9_$]*\[:16\]\s*\)'

composite_rules:
  - id: packet-adapter
    desc: Xray AES-128-GCM PacketConn adapter
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-common-crypto-package-import
      - id: package-declaration
      - id: packet-connection-type
      - id: key-size
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-aes-gcm-helper
      - id: micro-behaviors/os/random/crypto::go-crypto-rand-import
