defaults:
  for: [pe, elf, macho]
  platforms: [linux, macos, windows]
  size_min: 1048576
  size_max: 2147483647
traits:
  - id: gc-guide-heading
    desc: V8 garbage collection guide heading
    crit: notable
    conf: 0.99
    for: [markdown]
    size_min: 0
    if:
      type: value
      path: markdown.first_heading
      exact: V8 Garbage Collection
  - id: node-v8-heap-api-example
    desc: Node.js V8 heap API example
    crit: notable
    conf: 0.98
    for: [markdown]
    size_min: 0
    if:
      type: text
      regex: "require\\('node:v8'\\)[\\s\\S]{0,180}getHeapStatistics\\(\\)"
  - id: isolate-symbol
    desc: V8 isolate API symbol
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: v8::Isolate
      section: rdata
  - id: build-configuration-flag
    desc: V8 build configuration flag string
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: v8_enable_
      section: rdata
  - id: node-runtime-basename
    desc: Node.js runtime executable basename
    crit: component
    conf: 0.98
    if:
      type: value
      path: file.basename
      exact: node
composite_rules:
  - id: v8-gc-guide
    desc: V8 garbage collection documentation guide
    crit: notable
    conf: 0.99
    for: [markdown]
    size_min: 0
    all:
      - id: gc-guide-heading
      - id: node-v8-heap-api-example
  - id: v8-runtime-multi-marker
    desc: V8 JavaScript runtime (API symbol and build configuration markers)
    crit: notable
    conf: 0.96
    all:
      - id: well-known/lib/v8::isolate-symbol
      - id: well-known/lib/v8::build-configuration-flag
  - id: nodejs-runtime
    desc: Node.js V8 runtime executable
    crit: notable
    conf: 0.98
    all:
      - id: node-runtime-basename
      - id: v8-runtime-multi-marker
