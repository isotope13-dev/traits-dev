# ieee754 — JavaScript IEEE-754 floating-point buffer codec.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ieee754 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ieee754

  - id: vendored-path
    desc: Vendored ieee754 package path
    for: [javascript]
    if:
      type: path
      regex: '(^|[\\/])ieee754[\\/]'

  - id: buffer-codec-description
    desc: IEEE-754 buffer codec description
    for: [package.json]
    if:
      type: value
      path: description
      exact: Read/write IEEE754 floating point numbers from/to a Buffer or array-like object

composite_rules:
  - id: ieee754-buffer-codec
    desc: JavaScript IEEE-754 buffer codec library
    for: [package.json]
    all:
      - id: package-name
      - id: buffer-codec-description
