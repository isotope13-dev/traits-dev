# google.golang.org/api — Google API Go client library (generated clients).
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: google.golang.org/api module archive path
    if:
      type: path
      regex: 'google\.golang\.org/api@'

  - id: module-import
    desc: google.golang.org/api import path
    for: [go]
    if:
      type: import
      substr: google.golang.org/api/

composite_rules:
  - id: google-api-go-library
    desc: Google API Go client library module
    any:
      - id: archive-path
      - id: module-import
