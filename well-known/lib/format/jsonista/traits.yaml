# jsonista — the other de-facto JSON library for Clojure (metosin/jsonista), a
# Jackson Databind wrapper, and the counterpart to cheshire next door.
#
# Same reason for the identity as cheshire: a Clojure JSON codec otherwise
# analyses to almost nothing. `com.jeaye/jsonista` — a fork that is the library
# and nothing else — produced a single notable, `clojure-class-for-name`, which
# says nothing about what the artifact is for. The encode/decode capability
# atoms belong beside java.yaml and python.yaml in
# micro-behaviors/data/serialize/json, but that directory is at its 80-trait
# cap, so the library identity is what an analyst gets until it is split.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: jsonista-clojure-namespace
    desc: jsonista Clojure JSON namespace
    for: [clojure, java, text]
    if:
      type: text
      regex: 'jsonista\.(core|tagged-value)\b'
