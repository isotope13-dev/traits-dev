defaults:
  platforms: [unix, windows]
  for: [php]
  crit: component
  conf: 0.99
  size_max: 5000000

traits:
  - id: dompdf-namespace-marker
    desc: Dompdf PHP namespace marker
    if:
      type: text
      regex: 'namespace\s+Dompdf\s*;'
  - id: dompdf-php-evaluator-class
    desc: Dompdf PHP inline evaluator class marker
    if:
      type: text
      regex: '\bclass\s+PhpEvaluator\b'
  - id: dompdf-inline-eval-code
    desc: Dompdf evaluates inline PHP code
    if:
      type: text
      regex: '\beval\s*\(\s*\$code\s*\)'

composite_rules:
  - id: dompdf-php-evaluator-source
    desc: Dompdf PHP inline evaluator source
    crit: notable
    conf: 0.99
    all:
      - id: dompdf-namespace-marker
      - id: dompdf-php-evaluator-class
      - id: dompdf-inline-eval-code
    near_lines: 60
