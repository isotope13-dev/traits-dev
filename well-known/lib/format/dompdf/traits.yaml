defaults:
  platforms: [unix, windows]
  for: [php]
  crit: component
  conf: 0.99
  size_max: 5000000

traits:
  - id: composer-package-name
    desc: Dompdf Composer package name
    for: [composer.json]
    crit: notable
    if:
      type: value
      path: name
      exact: dompdf/dompdf
  - id: dompdf-namespace-marker
    desc: Dompdf PHP namespace marker
    if:
      type: text
      # Composer-prefixed vendors retain Dompdf's terminal namespace while
      # adding their own package namespace (for example, Kudos does this).
      regex: 'namespace\s+(Dompdf|.{0,120}\\Dompdf)\s*;'
  - id: dompdf-php-evaluator-class
    desc: Dompdf PHP inline evaluator class marker
    if:
      type: text
      regex: '\bclass\s+PhpEvaluator\b'
composite_rules:
  - id: dompdf-php-evaluator-source
    desc: Dompdf PHP inline evaluator source
    crit: notable
    conf: 0.99
    all:
      - id: dompdf-namespace-marker
      - id: dompdf-php-evaluator-class
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
    near_lines: 60
