# @leichtgewicht/ip-codec — IPv4/IPv6 encode/decode.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: '@leichtgewicht/ip-codec package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@leichtgewicht/ip-codec'

  - id: vendored-path
    desc: vendored ip-codec package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@leichtgewicht/ip-codec/'
  - id: v4-size
    desc: ip-codec IPv4 size constant
    if:
      type: text
      substr: 'const v4Size = 4'

composite_rules:
  - id: library
    desc: '@leichtgewicht/ip-codec library'
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: v4-size
