# github.com/tinywasm/fmt is a TinyGo/WASM-oriented fmt/strings library fork.
# It ships extensive benchmarks, WASM examples, and test fixtures — not malware.
defaults:
  platforms: [unix, windows]
  for: [go, zip, wasm]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 104857600

traits:
  - id: source-archive-member
    desc: tinywasm/fmt module source archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/tinywasm/fmt@v[0-9][^/]+/go\.mod$'

  - id: source-archive-path
    desc: tinywasm/fmt module source path
    for: [go, text]
    if:
      type: path
      regex: 'github\.com/tinywasm/fmt@v'

  - id: module-path
    desc: tinywasm/fmt module import path
    if:
      type: text
      substr: 'github.com/tinywasm/fmt'

composite_rules:
  - id: tinywasm-fmt-library
    desc: tinywasm/fmt formatting library
    crit: notable
    conf: 0.99
    any:
      - id: source-archive-member
      - id: source-archive-path
      - id: module-path

  - id: tinywasm-fmt-source-archive-context
    desc: tinywasm/fmt source archive context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: source-archive-member
      - id: module-path
