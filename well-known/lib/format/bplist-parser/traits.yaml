# bplist-parser — binary Apple property-list parser.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: bplist-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: bplist-parser

  - id: description
    desc: bplist-parser package description
    for: [package.json]
    if:
      type: value
      path: description
      exact: Binary plist parser.

  - id: dd-plist-attribution
    desc: bplist-parser dd-plist port attribution
    for: [javascript]
    if:
      type: text
      substr: 'adapted from https://github.com/3breadt/dd-plist'

  - id: vendored-path
    desc: vendored bplist-parser package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/bplist-parser/'

composite_rules:
  - id: bplist-parser-library
    desc: bplist-parser binary plist library
    needs: 2
    any:
      - id: package-name
      - id: description
      - id: dd-plist-attribution
      - id: vendored-path
