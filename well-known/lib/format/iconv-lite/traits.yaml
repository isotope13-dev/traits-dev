# iconv-lite bundles large DBCS lookup tables as encoded JavaScript strings.
# Their localized entropy is library data, not evidence of a concealed payload.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

traits:
  - id: iconv-lite-decoding-table-runtime
    desc: iconv-lite DBCS decoding-table implementation
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "iconv-lite internal error: invalid decoding table value"

  - id: iconv-lite-decode-runtime
    desc: iconv-lite string decoder implementation
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "Iconv-lite warning: decode()-ing strings"

  # The tables also ship as standalone JSON (`cp936.json`, `big5-added.json`,
  # `gb18030-ranges.json`, ...). Those were enumerated by basename in a
  # 97-character alternation; the directory that holds them names the library
  # in a quarter of the characters and does not go stale when a table is added.
  - id: iconv-lite-encoding-table-path
    desc: iconv-lite encoding table path
    crit: notable
    conf: 0.95
    for: [json]
    if:
      type: path
      regex: 'iconv-lite[\\/]encodings[\\/]'

