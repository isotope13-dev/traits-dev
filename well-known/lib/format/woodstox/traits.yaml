# Woodstox — StAX XML processor.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar]
  crit: notable
  conf: 0.99

traits:
  - id: class-namespace
    desc: Woodstox Java package namespace
    if:
      type: import
      regex: '^com/ctc/wstx/'
  - id: vendored-path
    desc: Woodstox StAX XML parser path
    if:
      type: path
      regex: 'com/ctc/wstx'

composite_rules:
  - id: woodstox-library
    desc: Woodstox StAX XML processor
    any:
      - id: class-namespace
      - id: vendored-path
