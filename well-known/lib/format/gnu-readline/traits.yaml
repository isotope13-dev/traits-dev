defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, so, dylib]
  size_max: 5242880

traits:
  # `libreadlineN.dll` / `libreadline.so.N` is the canonical GNU Readline
  # shared-library naming convention (versioned by soname), bundled by MSYS2,
  # MinGW toolchains, Cygwin, and most Unix package managers to give a
  # terminal program line-editing and history.
  - id: readline-shared-library-basename
    desc: GNU Readline shared library filename
    crit: baseline
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)^(cyg|lib)?readline[0-9]*\.(dll|so(\.[0-9]+)*|dylib)$'
  - id: readline-version-symbol
    desc: GNU Readline version export symbol
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      exact: rl_readline_version

composite_rules:
  - id: gnu-readline-library
    desc: GNU Readline line-editing library
    crit: notable
    conf: 0.95
    all:
      - id: readline-shared-library-basename
      - id: readline-version-symbol
