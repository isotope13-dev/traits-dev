# fb55/domutils — utilities for htmlparser2 DOMs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: domutils npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: domutils

  - id: vendored-path
    desc: vendored domutils package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/domutils/'


composite_rules:
  - id: domutils-library
    desc: domutils DOM helpers
    any:
      - id: package-name
      - id: vendored-path
