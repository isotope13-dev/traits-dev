# @react-pdf/renderer is a React PDF document-generation library. It
# bundles CryptoJS RC4 for legacy PDF encryption; identify that library
# before generic RC4 triage labels it suspicious.
defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: stylesheet-parse-error
    desc: '@react-pdf stylesheet parse error'
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '@react-pdf/stylesheet parsing error'
