# NaturalIntelligence fast-xml-parser — XML parse/build for Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: fast-xml-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: fast-xml-parser

  - id: vendored-path
    desc: vendored fast-xml-parser package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/fast-xml-parser/'
