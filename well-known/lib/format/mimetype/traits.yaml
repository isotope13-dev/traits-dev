# gabriel-vasile/mimetype is a benign Go MIME-detection library.  Its source
# archive intentionally contains samples of executable, shortcut, cabinet,
# CRX, and high-expansion archive formats for parser tests.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: source-archive
    desc: gabriel-vasile/mimetype Go source archive
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/gabriel-vasile/mimetype@[^/]+/go\.mod$'
  - id: testdata-member
    desc: mimetype format-test data member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/gabriel-vasile/mimetype@[^/]+/testdata/'
  - id: source-tree-member
    desc: gabriel-vasile/mimetype source-tree member
    crit: notable
    for: [7z]
    if:
      type: path
      regex: 'gabriel-vasile/mimetype@[^/]+'
  - id: testdata-tree-member
    desc: mimetype format-test tree member
    crit: notable
    for: [7z]
    if:
      type: path
      regex: 'mimetype@[^[:space:]]+/testdata/'

composite_rules:
  - id: zip-testdata-context
    desc: mimetype ZIP testdata context
    crit: notable
    conf: 0.99
    for: [zip]
    all:
      - id: source-archive
      - id: testdata-member
  - id: nested-testdata-context
    desc: mimetype nested testdata context
    crit: notable
    conf: 0.99
    for: [7z]
    all:
      - id: source-tree-member
      - id: testdata-tree-member
  - id: mimetype-testdata-archive-context
    desc: mimetype format-test source archive context
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, 7z]
    any:
      - id: zip-testdata-context
      - id: nested-testdata-context
