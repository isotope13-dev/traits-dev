# pycparser -- the pure-Python C parser. Its LALR tables are generated by PLY
# into a fixed filename; the file is thousands of lines of opaque state-machine
# data, which reads as obfuscation until the library is named.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: pycparser-generated-yacctab
    desc: pycparser generated parser table
    if:
      type: basename
      exact: yacctab.py
