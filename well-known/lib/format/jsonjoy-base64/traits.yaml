# @jsonjoy.com/base64 — JSON Joy base64 helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: '@jsonjoy.com/base64 package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@jsonjoy.com/base64'

  - id: vendored-path
    desc: vendored jsonjoy base64 package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@jsonjoy.com/base64/'
composite_rules:
  - id: library
    desc: '@jsonjoy.com/base64 library'
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: metadata/lang/source/syntax/declaration::declared-alphabet-constant
