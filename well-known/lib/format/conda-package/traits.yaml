defaults:
  platforms:
  - unix
  - windows
  size_max: 60000000
traits:
- id: tk-libtcl-shared-library
  desc: conda Tk Tcl shared library
  crit: notable
  conf: 0.98
  for:
  - elf
  if:
    type: path
    basename: true
    regex: ^libtcl[0-9.]+\.so$
- id: basename-mtls-helper
  desc: google-auth mTLS helper basename
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: path
    basename: true
    exact: _mtls_helper.py
- id: google-auth-mtls-marker
  desc: google-auth mTLS helper marker
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: text
    substr: CERTIFICATE_CONFIGURATION_DEFAULT_PATH
- id: sphinx-epub-marker
  desc: Sphinx EPUB builder marker
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: text
    word: epub
- id: ipython-completer-marker
  desc: IPython completer marker
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: text
    substr: IPCompleter
- id: gevent-conda-outer-archive
  desc: conda gevent outer package archive
  crit: notable
  conf: 0.98
  for:
  - conda
  if:
    type: path
    basename: true
    exact: gevent-26.5.0-py310h914a7a9_0.conda
- id: gevent-conda-inner-archive
  desc: conda gevent inner package archive
  crit: notable
  conf: 0.98
  for:
  - data
  if:
    type: path
    basename: true
    regex: ^pkg-gevent(-[^\\/]+)?\.tar\.zst$
- id: basename-bokeh-min-js
  desc: Bokeh minified server bundle basename
  crit: notable
  conf: 0.98
  for:
  - javascript
  if:
    type: path
    basename: true
    exact: bokeh.min.js
- id: bokeh-server-js-marker
  desc: Bokeh server websocket bundle marker
  crit: notable
  conf: 0.98
  for:
  - javascript
  if:
    type: text
    substr: DEFAULT_SERVER_WEBSOCKET_URL
- id: conda-unpack-basename
  desc: conda prefix relocation script basename
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: path
    basename: true
    exact: conda-unpack
- id: conda-prefix-relocation-marker
  desc: conda prefix relocation record table
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: text
    substr: _prefix_records
composite_rules:
- id: docker-py-auth-helper
  desc: conda docker-py auth helper module
  crit: notable
  conf: 0.98
  all:
  - id: metadata/filename/name-form::auth-py-basename
  - id: metadata/lang/source/naming/setting::registry-index-url-template
- id: sphinx-epub-builder
  desc: conda Sphinx EPUB builder module
  crit: notable
  conf: 0.98
  all:
  - id: metadata/filename/name-form::epub-base-py-basename
  - id: sphinx-epub-marker
- id: ipython-completer-module
  desc: conda IPython completer module
  crit: notable
  conf: 0.98
  all:
  - id: metadata/filename/name-form::completer-py-basename
  - id: ipython-completer-marker
- id: jax-k8s-cluster-module
  desc: conda JAX Kubernetes cluster helper
  crit: notable
  conf: 0.98
  all:
  - id: metadata/filename/name-form::k8s-cluster-py-basename
  - id: micro-behaviors/os/env/provider::kubernetes-service-host-name
- id: gevent-conda-archive
  desc: conda gevent package archive
  crit: notable
  conf: 0.98
  any:
  - id: gevent-conda-outer-archive
  - id: gevent-conda-inner-archive
- id: bokeh-server-js-bundle
  desc: conda Bokeh server JavaScript bundle
  crit: notable
  conf: 0.98
  all:
  - id: basename-bokeh-min-js
  - id: bokeh-server-js-marker
- id: conda-prefix-relocation-script
  desc: conda prefix relocation script
  crit: exception
  conf: 0.99
  for:
  - python
  all:
  - id: conda-unpack-basename
  - id: conda-prefix-relocation-marker
