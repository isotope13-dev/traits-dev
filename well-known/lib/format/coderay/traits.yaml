# CodeRay: Ruby syntax-highlighting library. It ships scanner definitions full
# of language keywords and `eval`-ish metaprogramming, which is why shell and
# metaprogramming rules treat its module marker as library code.
defaults:
  platforms: [unix, windows]
  for: [ruby, source]
  crit: notable
  conf: 0.95
  size_max: 10485760
traits:
  - id: coderay-module-declaration
    desc: CodeRay module declaration
    if:
      type: text
      substr: module CodeRay
