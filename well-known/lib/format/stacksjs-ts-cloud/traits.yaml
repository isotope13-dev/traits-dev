# @stacksjs/ts-cloud is an infrastructure-as-code library. Its AWS credential
# resolution and cloud API requests are used to authenticate the user's own
# deployment, not to collect unrelated local credentials. Keep those generic
# capabilities visible while suppressing credential-stealer composites only
# when the published package identity and repository agree. The context is
# input-scoped so package-wide composites can use it.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 1.0

traits:
  - id: ts-cloud-package-name
    desc: Stacks TS Cloud npm package identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@stacksjs/ts-cloud|@ts-cloud/core)$'

  - id: ts-cloud-repository
    desc: Stacks TS Cloud upstream repository
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/stacksjs/ts-cloud(\.git)?'

  - id: ts-cloud-npm-package-name
    desc: Stacks TS Cloud npm archive identity
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^(@stacksjs/ts-cloud|@ts-cloud/core)$'

  - id: ts-cloud-npm-repository
    desc: Stacks TS Cloud npm archive upstream repository
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: 'github\.com/stacksjs/ts-cloud(\.git)?'

  - id: ts-cloud-archive-package-name
    desc: TS Cloud package name in archive manifest
    crit: notable
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      regex: '^(@stacksjs/ts-cloud|@ts-cloud/core)$'

  - id: ts-cloud-archive-repository
    desc: TS Cloud repository in archive manifest
    crit: notable
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::repository.url
      regex: 'github\.com/stacksjs/ts-cloud(\.git)?'

  - id: ts-cloud-generated-output-marker
    desc: TS Cloud generated output marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Generated by ts-cloud'

  - id: ts-cloud-managed-path-marker
    desc: TS Cloud managed filesystem path marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: '/etc/ts-cloud'

  - id: ts-cloud-bootstrap-path-marker
    desc: TS Cloud bootstrap script path marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'ts-cloud.{0,50}bootstrap'

  - id: ts-cloud-managed-label-marker
    desc: TS Cloud managed resource label marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'ts-cloud-managed'

  # TS Cloud manages DNS records (Porkbun, GoDaddy, Cloudflare, Route53) as
  # part of deploying an app: its provider clients send the operator's own
  # API keys to the providers' own endpoints. The change-batch comments below
  # are stable product strings, not build hashes.
  - id: ts-cloud-dns-provider-marker
    desc: TS Cloud DNS provider management marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'ts-cloud DNS provider'

  # TS Cloud renders cloud-init user-data (deploy user, locked password,
  # provisioned SSH key) and prints preflight remediation text for its own
  # documented /etc/sudoers.d/ts-cloud drop-in. Both reference sudo access
  # without creating a drop-in on the scanned host.
  - id: ts-cloud-own-sudoers-path-marker
    desc: TS Cloud sudoers path reference
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'sudoers.d/ts-cloud'

  # TS Cloud generates nftables/sysctl DDoS-mitigation configuration to
  # protect the boxes it provisions. The render entry points below are
  # product API names; a declaration file carrying them implements no flood.
  - id: ts-cloud-ddos-mitigation-marker
    desc: TS Cloud DDoS mitigation render marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'renderNftablesRuleset'

  - id: ts-cloud-ddos-config-marker
    desc: TS Cloud DDoS mitigation config marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'DdosThresholds'

  - id: ts-cloud-log-prefix-marker
    desc: TS Cloud log prefix marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: '[ts-cloud]'

composite_rules:
  - id: ts-cloud-runtime-source-context
    desc: TS Cloud infrastructure provisioning runtime source
    crit: exception
    conf: 1.0
    scope: file
    for: [javascript, typescript]
    all:
      - id: ts-cloud-generated-output-marker
    any:
      - id: ts-cloud-managed-path-marker
      - id: ts-cloud-bootstrap-path-marker
      - id: ts-cloud-managed-label-marker
      - id: ts-cloud-dns-provider-marker

  - id: ts-cloud-archive-identity-evidence
    desc: TS Cloud archive manifest identity evidence
    crit: notable
    conf: 1.0
    scope: file
    for: [javascript, typescript]
    all:
      - id: ts-cloud-archive-package-name
      - id: ts-cloud-archive-repository
      - id: ts-cloud-generated-output-marker

  - id: ts-cloud-package-identity-evidence
    desc: TS Cloud package manifest identity evidence
    crit: notable
    conf: 1.0
    scope: outer
    all:
      - id: ts-cloud-package-name
      - id: ts-cloud-repository
      - id: ts-cloud-generated-output-marker

  - id: ts-cloud-npm-identity-evidence
    desc: TS Cloud npm archive identity evidence
    crit: notable
    conf: 1.0
    scope: outer
    all:
      - id: ts-cloud-npm-package-name
      - id: ts-cloud-npm-repository
      - id: ts-cloud-generated-output-marker

  - id: ts-cloud-package-context
    desc: Recognized Stacks TS Cloud package context for archive-wide analysis
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: ts-cloud-package-name
      - id: ts-cloud-repository

  - id: ts-cloud-npm-package-context
    desc: Recognized Stacks TS Cloud npm archive context for archive-wide analysis
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: ts-cloud-npm-package-name
      - id: ts-cloud-npm-repository

  - id: ts-cloud-aws-runtime-context
    desc: Recognized TS Cloud AWS credential-resolution and signing runtime
    crit: exception
    conf: 1.0
    scope: file
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
    any:
      - id: ts-cloud-runtime-source-context
      - id: ts-cloud-archive-identity-evidence

  - id: ts-cloud-dns-management-context
    desc: Recognized TS Cloud DNS provider management context
    crit: exception
    conf: 1.0
    scope: file
    for: [javascript, typescript]
    all:
      - id: ts-cloud-dns-provider-marker
      - id: ts-cloud-log-prefix-marker

  - id: ts-cloud-ddos-protection-context
    desc: Recognized TS Cloud DDoS mitigation module context
    crit: exception
    conf: 1.0
    scope: file
    for: [javascript, typescript]
    all:
      - id: ts-cloud-ddos-mitigation-marker
      - id: ts-cloud-ddos-config-marker
