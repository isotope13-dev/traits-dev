# PHP protobuf codegen emits GPBMetadata classes that embed the .proto descriptor
# as a hex2bin() blob. Those blobs collide with hex-of-keyword webshell heuristics
# (e.g. ASCII "system" inside field names), so identity helps suppress those FPs.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: php-protobuf-hex2bin-descriptor
    desc: PHP protobuf hex2bin descriptor blob
    if:
      type: text
      substr: 'internalAddGeneratedFile(hex2bin('
  - id: php-gpbmetadata-namespace
    desc: PHP GPBMetadata generated namespace
    if:
      type: text
      regex: 'namespace\s+GPBMetadata\\'

composite_rules:
  - id: php-protobuf-generated-source
    desc: Generated PHP protobuf metadata source
    crit: notable
    conf: 0.98
    all:
      - id: php-protobuf-hex2bin-descriptor
      - id: php-gpbmetadata-namespace
