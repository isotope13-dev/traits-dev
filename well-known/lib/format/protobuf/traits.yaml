defaults:
  platforms: [linux, macos, windows]
  for: [macho]
  crit: baseline

traits:
  - id: nanopb-runtime-marker
    desc: nanopb protobuf runtime marker
    conf: 0.9
    size_min: 65536
    size_max: 134217728
    if:
      type: text
      substr: nanopb
      section: __cstring

  - id: protobuf-framework-marker
    desc: Google protobuf framework marker
    conf: 0.95
    size_min: 65536
    size_max: 134217728
    if:
      type: text
      substr: GPBMessage
      section: __cstring

  - id: google-protobuf-cpp-runtime
    desc: Google Protobuf C++ runtime marker
    for: [pe, dll]
    platforms: [windows]
    crit: notable
    conf: 0.98
    size_min: 65536
    size_max: 134217728
    if:
      type: text
      substr: '[libprotobuf '
      section: .rdata

  - id: protobuf-net-runtime
    desc: .NET protobuf-net library marker
    for: [pe, dll]
    platforms: [windows]
    crit: notable
    conf: 0.96
    size_min: 4096
    size_max: 134217728
    if:
      type: text
      regex: '(?i)\bprotobuf-net\b'
      section: .text

  - id: go-protobuf-runtime-import
    desc: Go protobuf runtime import
    for: [go]
    platforms: [unix, windows]
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: google.golang.org/protobuf/runtime/protoimpl

composite_rules:
  - id: go-protobuf-generated-source
    desc: Go source generated with the protobuf runtime
    for: [go]
    platforms: [unix, windows]
    crit: notable
    conf: 0.98
    all:
      - id: go-protobuf-runtime-import
      - id: metadata/lang/source::generated-code-do-not-edit-text
