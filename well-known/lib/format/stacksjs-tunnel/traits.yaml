# @stacksjs/tunnel is the Stacks framework's localtunnel client. Its agent
# skill guide (ai/skills/stacks-tunnel/SKILL.md) documents the client's own
# API with example endpoint strings. A tunnel URL mentioned in the client's
# own documentation is not command-and-control infrastructure.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown]
  crit: notable
  conf: 1.0

traits:
  - id: stacks-tunnel-client-import-marker
    desc: Stacks tunnel client import marker
    crit: notable
    if:
      type: text
      substr: '@stacksjs/tunnel'

  - id: stacks-tunnel-client-api-marker
    desc: Stacks tunnel client API marker
    crit: notable
    if:
      type: text
      regex: '(createLocalTunnel|localTunnel)\s*[(={]'

composite_rules:
  - id: stacks-tunnel-skill-doc-context
    desc: Recognized Stacks tunnel client documentation context
    crit: exception
    conf: 1.0
    scope: file
    all:
      - id: stacks-tunnel-client-import-marker
      - id: stacks-tunnel-client-api-marker
