# mPDF is a PHP PDF-generation library. Its barcode and font code contains
# dense character tables that are data/formatting logic, not string hiding.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: mpdf-library-source-tree
    desc: mPDF library source-tree member
    if:
      type: path
      regex: '(?i)mpdf[\\/](src|data)[\\/]'
