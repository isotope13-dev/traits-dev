defaults:
  platforms: [windows, unix, android]
  crit: baseline
  conf: 0.98
  size_min: 1024
  size_max: 500000000

traits:
  # JavaScript Brotli decoders (hyparquet's parquet reader, brotli.js) carry the
  # RFC 7932 static dictionary, 122,784 bytes, as a base64 gzip string that is
  # inflated into a buffer of exactly that length at first use. The engine's
  # built-in base64-gz finding fires on that string; this records what it is.
  - id: js-static-dictionary-buffer
    desc: Brotli static dictionary buffer in JavaScript
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: Uint8Array(122784)
  - id: brotli-windows-runtime-library
    desc: Brotli Windows runtime library
    crit: notable
    conf: 0.99
    for: [dll]
    platforms: [windows]
    if:
      type: basename
      regex: '(?i)^(brotlicommon|brotlidec|brotlienc)\.dll$'
  - id: java-decoder-jar-group
    crit: notable
    desc: Brotli Java decoder group
    for: [jar]
    if:
      type: value
      path: jar.pom.group_id
      exact: org.brotli
  - id: java-decoder-dictionary-error
    crit: notable
    desc: Brotli dictionary error string
    for: [class, java_class]
    if:
      type: hex
      pattern: 43 6F 72 72 75 70 74 65 64 20 62 72 6F 74 6C 69 20 64 69 63 74 69 6F 6E 61 72 79
  - id: java-dictionary-data-holder
    desc: Brotli Java static dictionary holder
    crit: notable
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      exact: 'org/brotli/dec/Dictionary$DataHolder0'
  - id: js-decode-factory
    desc: Google Brotli JS decoder factory
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: makeBrotliDecode

composite_rules:
  - id: java-decoder-jar
    desc: Brotli Java decoder JAR
    crit: notable
    for: [jar]
    all:
      - id: java-decoder-jar-group
      - id: metadata/package/name/vocabulary::jar-dec-artifact-id
  - id: java-decoder-class
    desc: Brotli Java decoder class
    crit: notable
    for: [class, java_class]
    all:
      - id: metadata/filename/name-form::f-dollar-a-class-basename
      - id: java-decoder-dictionary-error
