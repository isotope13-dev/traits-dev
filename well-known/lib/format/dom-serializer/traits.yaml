# cheeriojs/dom-serializer — render a DOM to HTML.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: dom-serializer npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: dom-serializer

  - id: vendored-path
    desc: vendored dom-serializer package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/dom-serializer/'


composite_rules:
  - id: dom-serializer-library
    desc: dom-serializer HTML renderer
    any:
      - id: package-name
      - id: vendored-path
