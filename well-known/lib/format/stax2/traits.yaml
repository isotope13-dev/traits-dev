# StAX2 — StAX extension API.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar]
  crit: notable
  conf: 0.99

traits:
  - id: class-namespace
    desc: StAX2 Java package namespace
    if:
      type: import
      regex: '^org/codehaus/stax2/'
  - id: vendored-path
    desc: StAX2 API class path
    if:
      type: path
      regex: 'org/codehaus/stax2'

composite_rules:
  - id: stax2-library
    desc: StAX2 XML streaming API
    any:
      - id: class-namespace
      - id: vendored-path
