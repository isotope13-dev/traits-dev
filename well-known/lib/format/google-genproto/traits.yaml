# google.golang.org/genproto — generated Google API protobuf stubs for Go.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: google.golang.org/genproto module archive path
    if:
      type: path
      substr: 'google.golang.org/genproto'


composite_rules:
  - id: google-genproto-library
    desc: Google API genproto Go stubs module
    all:
      - id: archive-path
      - id: metadata/import/package::google-genproto-module-import
