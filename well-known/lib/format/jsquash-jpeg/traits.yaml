# @jsquash/jpeg ships MozJPEG WASM codecs from the jSquash project. The scoped
# npm name and jamsinclair/jSquash repository slug differ by design, and
# Emscripten emits the usual single-line glue that packed-loader heuristics
# otherwise treat as obfuscation.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: jsquash-jpeg-package-name
    desc: jSquash JPEG npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@jsquash/jpeg'

  - id: jsquash-repository-coordinate
    desc: jSquash GitHub repository coordinate
    for: [package.json]
    if:
      type: value
      path: repository
      substr: jamsinclair/jSquash

  - id: mozjpeg-codec-module-path
    desc: MozJPEG codec module archive path
    if:
      type: path
      regex: 'codec/(enc|dec)/mozjpeg_(enc|dec)\.(wasm|js)$'

  - id: mozjpeg-emscripten-glue-marker
    desc: MozJPEG Emscripten codec glue marker
    for: [javascript, typescript]
    if:
      type: text
      substr: mozjpeg_enc.wasm

composite_rules:
  - id: jsquash-jpeg-package-context
    desc: Recognized jSquash JPEG WASM codec package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: jsquash-jpeg-package-name
      - id: jsquash-repository-coordinate
