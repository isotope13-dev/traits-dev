# mdevils/html-entities — HTML entity encode/decode.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-name
    desc: html-entities npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: html-entities

  - id: github-repository
    desc: html-entities GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/mdevils/html-entities

  - id: vendored-path
    desc: vendored html-entities package path
    if:
      type: path
      regex: 'node_modules/html-entities/'

  - id: all-named-references
    desc: html-entities named-reference table
    if:
      type: text
      substr: allNamedReferences

  - id: high-surrogate-from
    desc: html-entities high-surrogate bound
    if:
      type: text
      substr: exports.highSurrogateFrom

  - id: body-regexps-export
    desc: html-entities bodyRegExps export
    if:
      type: text
      substr: exports.bodyRegExps

composite_rules:
  - id: html-entities-library
    desc: mdevils html-entities encoder/decoder
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: github-repository
      - id: all-named-references
      - id: high-surrogate-from
      - id: body-regexps-export
