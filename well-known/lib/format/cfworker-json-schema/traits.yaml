# @cfworker/json-schema — JSON Schema validator for Cloudflare Workers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: cfworker-json-schema-package-name
    desc: cfworker JSON Schema package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@cfworker/json-schema'

  - id: cfworker-json-schema-package-path
    desc: cfworker JSON Schema package member path
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@cfworker[/\\]json-schema'
