# @bufbuild/protobuf — Protocol Buffers for TypeScript (protobuf-es).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: bufbuild protobuf npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@bufbuild/protobuf"

  - id: github-repository
    desc: bufbuild protobuf-es repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/bufbuild/protobuf-es

  - id: vendored-path
    desc: vendored bufbuild protobuf package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@bufbuild/protobuf/'

  - id: proto-delimited-export
    desc: protobuf-es protoDelimited helper export
    if:
      type: text
      substr: 'export declare const protoDelimited'

  - id: proto-base64-export
    desc: protobuf-es protoBase64 helper export
    if:
      type: text
      substr: 'export declare const protoBase64'

  - id: proto-int64-export
    desc: protobuf-es protoInt64 helper export
    if:
      type: text
      substr: 'export declare const protoInt64'

  - id: proto-double-export
    desc: protobuf-es protoDouble helper export
    if:
      type: text
      substr: 'export declare const protoDouble'

  - id: proto2-runtime-export
    desc: protobuf-es proto2 runtime export
    if:
      type: text
      substr: 'export declare const proto2:'

  - id: proto3-runtime-export
    desc: protobuf-es proto3 runtime export
    if:
      type: text
      substr: 'export declare const proto3:'

  - id: scalar-type-enum
    desc: protobuf-es ScalarType field enum
    if:
      type: text
      substr: 'export declare enum ScalarType'

  - id: to-plain-message-export
    desc: protobuf-es toPlainMessage helper export
    if:
      type: text
      substr: 'export declare function toPlainMessage'

  - id: service-type-interface
    desc: protobuf-es ServiceType reflection interface
    if:
      type: text
      substr: 'export interface ServiceType'

composite_rules:
  - id: protobuf-es-library
    desc: bufbuild protobuf-es TypeScript runtime
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: github-repository
      - id: proto-delimited-export
      - id: proto-base64-export
      - id: proto-int64-export
      - id: proto-double-export
      - id: proto2-runtime-export
      - id: proto3-runtime-export
      - id: scalar-type-enum
      - id: to-plain-message-export
      - id: service-type-interface
