# goblin (and its metagoblin fork) is the standard Rust crate for parsing ELF,
# Mach-O, PE and Unix archives. Code that depends on it carries executable-format
# constants, section/symbol tables and relocation names for reading binaries, not
# for producing them — the identity an analyst needs before reading those
# constants as a loader or infector.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: crate-use-statement
    desc: Uses the goblin binary-parsing Rust crate
    for: [rust]
    if:
      type: text
      regex: '(?m)^\s*use\s+(meta)?goblin(::|;)'

  - id: cargo-dependency
    desc: Declares a goblin Cargo dependency
    for: [cargo.toml]
    if:
      type: value
      path: dependencies.goblin
      exists: true

  - id: cargo-dependency-fork
    desc: Declares a metagoblin Cargo dependency
    for: [cargo.toml]
    if:
      type: value
      path: dependencies.metagoblin
      exists: true
