# zstd-jni — Luben JNI bindings for Facebook Zstandard.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 15000000

traits:
  - id: implementation-title
    desc: zstd-jni JAR implementation title
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: zstd-jni

  - id: bundle-symbolic-name
    desc: zstd-jni OSGi bundle symbolic name
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: com.github.luben.zstd-jni

  - id: implementation-vendor
    desc: zstd-jni implementation vendor
    for: [jar, zip]
    conf: 0.98
    if:
      type: value
      path: jar.manifest.implementation_vendor
      exact: com.github.luben

  - id: package-path
    desc: Luben zstd-jni package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)luben[\\/]zstd'

composite_rules:
  - id: zstd-jni-library
    desc: Luben zstd-jni JNI compression library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: bundle-symbolic-name
      - id: implementation-title
      - id: implementation-vendor
      - id: package-path
