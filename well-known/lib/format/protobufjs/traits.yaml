# protobufjs — Protocol Buffers for JavaScript and TypeScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: protobufjs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: protobufjs

  - id: vendored-path
    desc: vendored protobufjs package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/protobufjs/'

  - id: github-homepage
    desc: protobufjs GitHub Pages homepage
    for: [package.json]
    if:
      type: text
      substr: protobufjs.github.io/protobuf.js
