# protobufjs — Protocol Buffers for JavaScript and TypeScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: protobufjs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: protobufjs

  - id: vendored-path
    desc: vendored protobufjs package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/protobufjs/'

  - id: github-homepage
    desc: protobufjs GitHub Pages homepage
    for: [package.json]
    if:
      type: text
      substr: protobufjs.github.io/protobuf.js

  - id: scoped-helper-package-name
    desc: protobufjs scoped helper package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@protobufjs/[a-z][a-z0-9-]*$'

  - id: scoped-helper-vendored-path
    desc: vendored protobufjs scoped helper path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@protobufjs/[a-z][a-z0-9-]*/'

  # @protobufjs/inquire hides an optional require() from bundlers by building
  # the name with eval; bundles of protobufjs/protons-runtime carry it inline.
  - id: inquire-optional-require-shim
    desc: protobufjs inquire optional-require shim
    for: [javascript, typescript]
    if:
      type: text
      regex: 'function inquire\(\w+\)\s*\{\s*try\s*\{\s*var mod\s*=\s*eval\("quire"\.replace\('
