# Six internal callbacks identify this source component. This identity is
# corroboration for triage and does not suppress behavioral findings.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
traits:
  - id: shar-writer-source-implementation
    desc: libarchive SHAR writer source implementation
    crit: notable
    conf: 0.98
    count_min: 6
    if:
      type: symbol
      kind: function
      regex: '^archive_write_shar_(header|data_(sed|uuencode)|finish_entry|close|free)$'
