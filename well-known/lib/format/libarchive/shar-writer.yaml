# Internal writer callbacks identify this source component. Identity never
# suppresses behavioral findings on the same file.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98
traits:
  - id: shar-header-writer-function
    desc: libarchive SHAR header writer function
    if:
      type: symbol
      kind: function
      exact: archive_write_shar_header
  - id: shar-sed-data-writer-function
    desc: libarchive SHAR sed data writer function
    if:
      type: symbol
      kind: function
      exact: archive_write_shar_data_sed
  - id: shar-uuencode-data-writer-function
    desc: libarchive SHAR UUEncode data writer function
    if:
      type: symbol
      kind: function
      exact: archive_write_shar_data_uuencode
composite_rules:
  - id: shar-writer-source-implementation
    desc: libarchive SHAR writer source implementation
    all:
      - id: shar-header-writer-function
      - id: shar-sed-data-writer-function
      - id: shar-uuencode-data-writer-function
