# cheshire — the de-facto JSON library for Clojure (github.com/dakrone/cheshire),
# a Jackson wrapper. Worth an explicit identity for two reasons.
#
# The name collides with the unrelated Virus:Java/Cheshire.A family in
# well-known/malware/virus/cheshire, so an analyst looking at a jar full of
# `cheshire/…` classes needs the library fingerprint to tell the two apart.
#
# It is also the only notable these artifacts get: a Clojure JSON codec
# (fullcontact/full.json wraps cheshire) otherwise produced no finding at all,
# and micro-behaviors/data/serialize/json is at its 80-trait cap, so the
# encode/decode capability atoms that belong beside java.yaml and python.yaml
# there cannot be added until that directory is split.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: cheshire-clojure-namespace
    desc: cheshire Clojure JSON namespace
    for: [clojure, java, text]
    if:
      type: text
      regex: 'cheshire\.(core|generate|parse|factory)\b'

  # AOT-compiled Clojure emits one class per fn, named `<ns>$<fn>.class`, so a
  # jar that bundles cheshire carries a hundred-odd of them. Read the archive
  # member list rather than the per-entry path: a `.class` entry is analysed as
  # a JVM class, not as a path-bearing member of the jar.
  - id: cheshire-aot-class-member
    desc: Jar bundles cheshire AOT classes
    for: [jar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)cheshire/(core|generate|parse|factory)\$'
