# blosc-src — Rust FFI crate vendoring the Blosc C compression library.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, c, cpp, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 104857600

traits:
  - id: blosc-src-crate-package-name
    desc: blosc-src crate package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: blosc-src

  - id: blosc-src-vendored-tree-path
    desc: vendored c-blosc source tree path
    if:
      type: path
      regex: 'c-blosc/'

  - id: blosc-src-cmake-build-script-marker
    desc: blosc-src cmake build.rs marker
    for: [rust]
    if:
      type: text
      substr: 'cmake::Config::new("c-blosc")'

  - id: blosc-src-crate-tarball-prefix-path
    desc: blosc-src crate tarball filename prefix
    for: [crate, tar, zip]
    if:
      type: path
      regex: 'blosc-src-'

composite_rules:
  - id: blosc-src-native-compression-bindings
    desc: blosc-src vendored Blosc C library crate
    crit: exception
    conf: 0.97
    any:
      - id: blosc-src-crate-package-name
      - id: blosc-src-vendored-tree-path
      - id: blosc-src-cmake-build-script-marker
      - id: blosc-src-crate-tarball-prefix-path
