# printpdf is a Rust library for creating and reading PDF files.
# It embeds compressed standard PDF 14 fonts in defaultfonts/ named *.subset.ttf
# which are decompressed at runtime.
defaults:
  platforms: [unix, windows]
  for: [gz, cargo.toml]
  crit: notable
  conf: 0.98

traits:
  - id: printpdf-default-font-asset
    desc: printpdf library default font subset asset
    for: [gz]
    if:
      type: path
      regex: '(?i)(^|[/\\])(defaultfonts[/\\].*|.*\.subset)\.[ot]tf$'

  - id: printpdf-crate-manifest
    desc: printpdf crate Cargo manifest
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: printpdf
