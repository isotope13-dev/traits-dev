# pdf-lib JavaScript library identity.
# pdf-lib includes the legacy PDF encryption implementation from CryptoJS;
# identify that known library before generic RC4 triage labels it suspicious.
defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: pdf-lib-namespace-or-document-api
    desc: pdf-lib namespace or PDFDocument API
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'PDFLib(\s*=\s*\{\}|\.PDFDocument)'
