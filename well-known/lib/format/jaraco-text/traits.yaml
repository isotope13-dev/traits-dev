# jaraco.text -- text-handling utilities, vendored into setuptools and pip.
# FoldedCase is its case-insensitive string subclass.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: jaraco-text-foldedcase
    desc: jaraco.text FoldedCase source
    if:
      type: text
      substr: 'class FoldedCase(str):'
