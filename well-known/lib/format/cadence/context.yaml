defaults:
  platforms: [unix, windows]

composite_rules:
  - id: update-tool-context
    desc: Recognized Cadence repository updater context
    crit: exception
    conf: 0.98
    all:
      - id: updater-marker
      # Cadence uses the `executive` package rather than Node's child_process
      # module, so the generic child_process composite cannot establish this
      # context.  The authenticated-user API call instead ties the credential
      # lookup to the updater's declared GitHub operation.
      - id: micro-behaviors/communications/http/services/github::github-get-authenticated-user
