# tar-no-std — no_std GNU tar reader (phip1611/tar-no-std on crates.io).
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, tar]
  crit: notable
  conf: 0.98

traits:
  - id: tar-no-std-crate-name
    desc: tar-no-std crates.io package name
    for: [crate]
    if:
      type: value
      path: crate.name
      exact: tar-no-std

  - id: tar-no-std-upstream-repository-crate
    desc: tar-no-std crate registry repository field
    for: [crate]
    if:
      type: value
      path: crate.repository
      substr: github.com/phip1611/tar-no-std

  - id: tar-no-std-no-std-tar-description
    desc: tar-no-std no_std tar reader crate description
    for: [crate]
    if:
      type: value
      path: crate.description
      regex: '(?i)no_std.{0,80}tar'

composite_rules:
  - id: tar-no-std-library-context
    desc: tar-no-std no_std tar archive reader crate
    crit: exception
    conf: 0.99
    scope: archive
    for: [crate, tar]
    all:
      - id: tar-no-std-crate-name
    any:
      - id: tar-no-std-upstream-repository-crate
      - id: tar-no-std-no-std-tar-description
