# HashiCorp HCL / hcldec specsuite parse-only fixtures (often magic-typed as perl via .t).
defaults:
  platforms: [unix, windows]
  for: [perl, text]
  crit: notable
  conf: 0.96

traits:
  - id: hcldec-spec-parse-only-comment
    desc: hcldec parse-only test comment
    if:
      type: text
      substr: so the hcldec spec for this test is just a literal value given below.

  - id: hcldec-parse-only-result-ok
    desc: hcldec parse-only result assignment
    if:
      type: text
      exact: 'result = "ok"'

composite_rules:
  - id: hcldec-comment-only-parse-test
    desc: hcldec comment-only parse fixture
    conf: 0.98
    all:
      - id: hcldec-spec-parse-only-comment
      - id: hcldec-parse-only-result-ok
