# josdejong/jsonrepair — repair invalid JSON text.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: jsonrepair npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jsonrepair

  - id: cli-usage-banner
    desc: jsonrepair CLI usage banner
    for: [javascript]
    if:
      type: text
      substr: 'jsonrepair [filename] {OPTIONS}'

  - id: vendored-path
    desc: vendored jsonrepair package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/jsonrepair/'
