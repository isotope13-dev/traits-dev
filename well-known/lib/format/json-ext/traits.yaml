# @discoveryjs/json-ext — JSON stringify/parse extras.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: '@discoveryjs/json-ext package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@discoveryjs/json-ext'

  - id: vendored-path
    desc: vendored json-ext package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@discoveryjs/json-ext/'

composite_rules:
  - id: library
    desc: '@discoveryjs/json-ext library'
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
