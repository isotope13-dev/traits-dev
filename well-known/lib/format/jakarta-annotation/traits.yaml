# Jakarta Annotations API (jakarta.annotation).
defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: annotation-api-jar-basename
    desc: Jakarta Annotation API JAR name
    if:
      type: basename
      regex: '^jakarta\.annotation-api-[0-9][A-Za-z0-9._-]*\.jar$'
