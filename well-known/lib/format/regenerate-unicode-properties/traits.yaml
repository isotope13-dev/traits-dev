# regenerate-unicode-properties — Unicode set tables.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: regenerate-unicode-properties npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'regenerate-unicode-properties'

  - id: vendored-path
    desc: vendored regenerate Unicode-set path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'regenerate-unicode-properties/'
  - id: regenerate-require
    desc: regenerate() Unicode set builder
    if:
      type: text
      substr: "require('regenerate')"

composite_rules:
  - id: library
    desc: regenerate-unicode-properties library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: regenerate-require
