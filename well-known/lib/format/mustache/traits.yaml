# mustache.js — logic-less {{mustache}} templates.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: mustache-package-name
    desc: mustache package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mustache

  - id: mustache-package-path
    desc: mustache package member path
    for: [javascript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])mustache([/\\]|$)'
