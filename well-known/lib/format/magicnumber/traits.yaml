defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 104857600

traits:
  - id: go-module-cache-path
    desc: Defacto2 magicnumber Go module cache path
    for: [zip, tar, rar, 7z, go, pe, rtf, data]
    if:
      type: path
      regex: 'Defacto2[\\/]magicnumber@'
  - id: go-mod-module-declaration
    desc: Defacto2 magicnumber go.mod module path
    for: [go.mod, go]
    if:
      type: text
      substr: github.com/Defacto2/magicnumber

composite_rules:
  - id: file-identification-library
    desc: magicnumber file-identification library
    crit: notable
    conf: 0.98
    any:
      - id: go-module-cache-path
      - id: go-mod-module-declaration
  - id: test-fixture-context
    desc: magicnumber format-identification test fixtures
    crit: exception
    conf: 0.98
    for: [rar, zip, tar, 7z, pe, rtf, data, go]
    any:
      - id: go-module-cache-path
      - id: go-mod-module-declaration
