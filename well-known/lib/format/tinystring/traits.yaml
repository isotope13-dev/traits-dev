# TinyString is a benign Go string/conversion library.  Its source archive
# includes benchmark shell scripts, one of which deliberately removes only
# generated benchmark logs and other local build artifacts.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: source-archive
    desc: cdvelop/tinystring Go source archive
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/cdvelop/tinystring@[^/]+/go\.mod$'
  - id: benchmark-script-member
    desc: TinyString benchmark shell-script member
    for: [shell]
    if:
      type: path
      regex: 'tinystring@[^[:space:]]+/benchmark/[^[:space:]]+\.sh$'
  - id: source-tree-member
    desc: cdvelop/tinystring source-tree member
    crit: notable
    for: [shell]
    if:
      type: path
      regex: 'cdvelop/tinystring@[^/]+'

composite_rules:
  - id: tinystring-benchmark-archive-context
    desc: TinyString benchmark source archive context
    crit: exception
    conf: 0.99
    for: [shell]
    all:
      - id: source-tree-member
      - id: benchmark-script-member
