defaults:
  platforms: [unix, windows]
  for: [shell, javascript, c, xml]
  crit: baseline
  conf: 0.97
  size_max: 268435456

traits:
- id: source-path-marker
  crit: notable
  desc: Path includes versioned libxslt directory
  if:
    type: path
    regex: '(^|[\\/])libxslt-[0-9].{0,120}'
- id: source-text-marker--libxslt
  crit: notable
  desc: libxslt configure package declaration
  if:
    type: text
    regex: "(?m)^PACKAGE_NAME=['\"]libxslt['\"]$"
- id: source-text-marker--libxslt-2
  crit: notable
  desc: libxslt version macro declaration
  if:
    type: text
    regex: '(?m)^#define LIBXSLT_DOTTED_VERSION '
composite_rules:
- id: source-text-marker
  crit: notable
  desc: libxslt configure or version declaration
  any:
  - id: source-text-marker--libxslt
  - id: source-text-marker--libxslt-2
- id: source-bundle
  desc: libxslt source path or self-declaration
  crit: notable
  conf: 0.97
  any:
  - id: well-known/lib/format/xslt::source-path-marker
  - id: well-known/lib/format/xslt::source-text-marker--libxslt
  - id: well-known/lib/format/xslt::source-text-marker--libxslt-2
