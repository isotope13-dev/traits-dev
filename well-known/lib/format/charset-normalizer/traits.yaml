# charset-normalizer — widely used Python text-encoding detector distributed
# on PyPI and conda-forge. Dynamic imports load Python codec implementations.
defaults:
  platforms: [unix, windows]
  for: [conda, python, pkginfo, json, text]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 50000000

traits:
  - id: conda-basename
    desc: charset-normalizer conda package basename
    for: [conda]
    if:
      type: value
      path: file.basename
      regex: '^charset-normalizer-[0-9][0-9A-Za-z._-]*\.conda$'
      case_insensitive: true

  - id: pkginfo-name
    desc: charset-normalizer Python package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: charset-normalizer

  - id: detector-summary
    desc: charset-normalizer detector summary
    for: [python, pkginfo]
    if:
      type: text
      substr: The Real First Universal Charset Detector.

  - id: upstream-repository
    desc: charset-normalizer upstream repository
    for: [python, pkginfo, json, text]
    if:
      type: text
      substr: github.com/jawah/charset_normalizer

composite_rules:
  - id: charset-normalizer-package
    desc: charset-normalizer text encoding library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: conda-basename
      - id: pkginfo-name
      - id: detector-summary
      - id: upstream-repository
    needs: 2
