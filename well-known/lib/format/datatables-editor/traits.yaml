# DataTables Editor is a commercial table-editing library for DataTables. Its
# distributed bundles are license-protected builds whose string-splitting
# minification scatters single-character fragments (`V_J="r"`) that are
# reassembled at runtime -- single-character assignments by construction,
# not anti-AV padding. Keep those generic capabilities visible while
# suppressing dead-store padding only when the bundle path and the Editor
# namespace agree.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 1.0

traits:
  - id: editor-bundle-path
    desc: DataTables Editor bundle path
    crit: notable
    if:
      type: path
      basename: true
      regex: '(?i)^dataTables\.editor\.min\.(js|mjs)$'

  - id: editor-display-namespace-marker
    desc: DataTables Editor display namespace marker
    crit: notable
    if:
      type: text
      substr: 'DTED_'

composite_rules:
  - id: vendor-bundle-context
    desc: Recognized vendored DataTables Editor bundle
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: editor-bundle-path
      - id: editor-display-namespace-marker
