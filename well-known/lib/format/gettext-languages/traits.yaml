# gettext/languages — PHP language metadata and exporter library.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: exporter-namespace
    desc: Gettext Languages Exporter namespace
    for: [php]
    if:
      type: text
      substr: namespace Gettext\Languages\Exporter

  - id: get-exporter-class-name
    desc: Gettext Languages getExporterClassName method
    for: [php]
    if:
      type: text
      substr: getExporterClassName

composite_rules:
  - id: library-context
    desc: Recognized gettext languages exporter library
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: exporter-namespace
      - id: get-exporter-class-name
