# fb55/encoding-sniffer — HTML encoding sniffer.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: encoding-sniffer npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: encoding-sniffer

  - id: vendored-path
    desc: vendored encoding-sniffer package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/encoding-sniffer/'
