# @elisym/sdk — Elisym Nostr AI agent marketplace and Solana payments SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, zip, text]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-name
    desc: elisym/sdk npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@elisym/sdk"

  - id: archive-path
    desc: elisym/sdk npm archive path
    if:
      type: path
      regex: '(^|[\\/])sdk-[0-9]'

  - id: module-import
    desc: elisym/sdk import path
    for: [javascript, typescript]
    if:
      type: import
      substr: "@elisym/sdk"

composite_rules:
  - id: elisym-sdk-library
    desc: Elisym agent marketplace SDK package
    any:
      - id: package-name
      - id: archive-path
      - id: module-import
