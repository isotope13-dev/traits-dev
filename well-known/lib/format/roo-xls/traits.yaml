# roo-xls — Ruby gem for reading Excel files; ships OLE fixtures under test/.
defaults:
  platforms: [unix, windows]
  for: [gem, zip, oledoc, ruby]
  crit: notable
  conf: 0.99

traits:
  - id: gem-archive-path
    desc: roo-xls gem archive member path
    for: [gem, zip, oledoc]
    if:
      type: path
      regex: 'roo-xls'

  - id: test-files-ole-path
    desc: Spreadsheet fixture under test/files
    for: [oledoc, zip, xls]
    if:
      type: path
      regex: 'test/files'

  - id: github-repo
    desc: roo-xls GitHub repository
    for: [ruby, gem]
    if:
      type: text
      substr: github.com/roo-rb/roo-xls
