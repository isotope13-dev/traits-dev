# kaptinlin/jsonschema (Go) keeps its validation error messages in
# i18n/locales/<tag>.json — nine bundles (en, de-DE, es-ES, fr-FR, ja-JP,
# ko-KR, pt-BR, zh-Hans, zh-Hant) that all carry the same 61 message keys.
# Modules that vendor the library ship those bundles verbatim, where they scan
# as anonymous small JSON: no name, no version, and mostly non-Latin text, so
# nothing else identifies them.
#
# Keyed on the library's own snake_case message-key vocabulary rather than on
# any message text, which is what varies between the bundles. The three chosen
# keys are the ones with no life outside this table: `dynamic_ref_mismatch`
# names a 2020-12 `$dynamicRef` failure, `unevaluated_property_mismatch` an
# `unevaluatedProperties` failure, and `one_of_multiple_matches` the
# more-than-one-branch-matched case of `oneOf`. A JSON Schema document itself
# uses the camelCase keyword spellings, so a schema cannot match this.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: component
  conf: 0.92

traits:
  - id: jsonschema-dynamic-ref-message-key
    desc: Validator dynamicRef error message key
    if:
      type: value
      path: dynamic_ref_mismatch

  - id: jsonschema-unevaluated-property-message-key
    desc: Validator unevaluatedProperties error key
    if:
      type: value
      path: unevaluated_property_mismatch

  - id: jsonschema-one-of-multiple-message-key
    desc: Validator oneOf multiple-match error key
    if:
      type: value
      path: one_of_multiple_matches

composite_rules:
  - id: kaptinlin-jsonschema-locale-bundle
    desc: kaptinlin/jsonschema locale message bundle
    crit: notable
    conf: 0.97
    all:
      - id: jsonschema-dynamic-ref-message-key
      - id: jsonschema-unevaluated-property-message-key
      - id: jsonschema-one-of-multiple-message-key
