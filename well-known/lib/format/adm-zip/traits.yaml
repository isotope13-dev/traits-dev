# cthackers/adm-zip — Node.js ZIP archive library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: zip-name-missing-error
    desc: adm-zip missing ZIP filename error
    if:
      type: text
      substr: 'ADM-ZIP: ZIP File Name Missing'

  - id: wrong-password-error
    desc: adm-zip ZipCrypto wrong-password error
    if:
      type: text
      substr: 'ADM-ZIP: Wrong Password'

  - id: error-messages-banner
    desc: adm-zip error-message catalog banner
    if:
      type: text
      substr: '/* ADM-ZIP error messages */'

  - id: inflate-avail-data-error
    desc: adm-zip inflater available-data error
    if:
      type: text
      substr: 'inflate::Available inflate data did not terminate'

  - id: sanitize-absolute-comment
    desc: adm-zip path-sanitize helper comment
    if:
      type: text
      substr: 'make abolute paths taking prefix as root folder'

  - id: fattr-executable-comment
    desc: adm-zip file-attribute executable comment
    if:
      type: text
      substr: 'who ever har right not just owner'

  - id: fileattr-export
    desc: adm-zip FileAttr util re-export
    if:
      type: text
      substr: 'module.exports.FileAttr = require("./fattr")'

  - id: vendored-path
    desc: vendored adm-zip library path
    if:
      type: path
      regex: 'bundle/adm-zip'

composite_rules:
  - id: adm-zip-library
    desc: cthackers adm-zip Node ZIP library
    any:
      - id: zip-name-missing-error
      - id: wrong-password-error
      - id: error-messages-banner
      - id: inflate-avail-data-error
      - id: sanitize-absolute-comment
      - id: fattr-executable-comment
      - id: fileattr-export
      - id: vendored-path
