# snappy-java — Xerial JNI wrapper for Google Snappy. Ships per-OS
# natives and uses Runtime.exec in OSInfo for arch detection.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 15000000

traits:
  - id: implementation-title
    desc: snappy-java JAR implementation title
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: snappy-java

  - id: bundle-symbolic-name
    desc: snappy-java OSGi bundle symbolic name
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: org.xerial.snappy.snappy-java

  - id: implementation-vendor
    desc: snappy-java implementation vendor
    for: [jar, zip]
    conf: 0.98
    if:
      type: value
      path: jar.manifest.implementation_vendor
      exact: xerial.org

  - id: package-path
    desc: Xerial snappy-java package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)xerial[\\/]snappy'

composite_rules:
  - id: snappy-java-library
    desc: Xerial snappy-java JNI compression library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: bundle-symbolic-name
      - id: implementation-title
      - id: implementation-vendor
      - id: package-path
