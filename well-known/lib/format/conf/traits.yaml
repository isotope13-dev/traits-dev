# sindresorhus/conf — simple app/module config handling.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: conf-package-name
    desc: conf npm package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: conf

  - id: conf-package-description
    desc: conf package description text
    for: [package.json]
    conf: 0.95
    if:
      type: value
      path: description
      exact: Simple config handling for your app or module

  - id: conf-dist-path
    desc: conf package dist member path
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])conf[/\\]dist'
