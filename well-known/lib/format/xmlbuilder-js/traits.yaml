# oozcitak/xmlbuilder-js — XML document builder for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: xmlbuilder npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: xmlbuilder

  - id: repository
    desc: xmlbuilder-js source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: oozcitak/xmlbuilder-js

composite_rules:
  - id: xmlbuilder-js-library
    desc: xmlbuilder-js XML builder library
    any:
      - id: package-name
      - id: repository
