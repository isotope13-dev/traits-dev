defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  for: [pkginfo]

traits:
  - id: python-runtime-package-name
    desc: Kaitai Python runtime package name
    if:
      type: text
      regex: '(?im)^Name:\s*kaitaistruct\s*$'

  - id: python-runtime-homepage
    desc: Kaitai project homepage in Python metadata
    if:
      type: text
      regex: '(?im)^Home-page:\s*https?://kaitai\.io/?\s*$'

composite_rules:
  - id: kaitai-python-runtime
    desc: Kaitai Struct Python runtime package
    crit: notable
    conf: 0.99
    for: [python-sdist, pkginfo]
    scope: outer
    all:
      - id: python-runtime-package-name
      - id: python-runtime-homepage
