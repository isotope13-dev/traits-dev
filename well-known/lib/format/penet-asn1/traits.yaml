# PeNet.Asn1 — secana ASN.1 parser used by PeNet (NuGet PeNet.Asn1).
defaults:
  platforms: [unix, windows]
  for: [pe, dll, nupkg]
  crit: notable
  conf: 0.97
  size_min: 512
  size_max: 8000000

traits:
  - id: nuget-package-id
    desc: PeNet.Asn1 NuGet package id
    for: [nupkg]
    if:
      type: value
      path: nupkg.id
      exact: PeNet.Asn1

  - id: nuget-repository-url
    desc: secana asn1 NuGet repository URL
    for: [nupkg]
    if:
      type: value
      path: nupkg.repository_url
      exact: https://github.com/secana/asn1

  - id: product-versioninfo
    desc: PeNet.Asn1 ProductName version info
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      exact: PeNet.Asn1

  - id: original-filename
    desc: PeNet.Asn1 original filename field
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: PeNet.Asn1.dll

  - id: authors-company
    desc: PeNet.Asn1 authors CompanyName field
    for: [pe, dll]
    if:
      type: value
      path: pe.version.company
      exact: Sergey Savchuk, Jan Jansen, Stefan Hausotte

composite_rules:
  - id: penet-asn1-library
    desc: PeNet.Asn1 ASN.1 parser library
    crit: notable
    conf: 0.98
    for: [pe, dll]
    all:
      - id: product-versioninfo
      - id: original-filename
      - id: authors-company
  - id: penet-asn1-nupkg
    desc: PeNet.Asn1 NuGet package
    crit: notable
    conf: 0.98
    for: [nupkg]
    all:
      - id: nuget-package-id
      - id: nuget-repository-url
