# Nodemailer mailparser — MIME email parser for Node.js.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-name
    desc: Manifest names mailparser
    for: [package.json]
    crit: component
    if:
      type: value
      path: name
      exact: mailparser

  - id: mail-parser-class
    desc: Defines the MailParser class
    for: [javascript]
    crit: component
    if:
      type: text
      regex: '\bclass MailParser extends\b'

  - id: simple-parser-function
    desc: Defines the simpleParser function
    for: [javascript]
    crit: component
    if:
      type: text
      regex: '\bfunction simpleParser\('

composite_rules:
  - id: library
    desc: mailparser email parsing library
    for: [npm, package.json, javascript]
    scope: archive
    needs: 2
    all:
      - id: manifest-name
    any:
      - id: mail-parser-class
      - id: simple-parser-function
