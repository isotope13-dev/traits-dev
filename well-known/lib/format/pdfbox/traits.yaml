defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin, source]
  crit: notable
  conf: 0.98

traits:
  - id: pdfbox-source-package
    desc: Apache PDFBox library package or namespace
    if:
      type: text
      regex: '(?i)(package\s+[a-z0-9_.]{0,80}pdfbox\b|import\s+[a-z0-9_.]{0,80}pdfbox\b)'

  - id: pdfbox-asf-license-notice
    desc: Apache PDFBox ASF license header
    if:
      type: text
      regex: 'Licensed to the Apache Software Foundation.{0,100}PDFBox'
