# EPPlus is a .NET spreadsheet library. Its encrypted OOXML and image/HTTP
# support can resemble a pixel dropper without being payload delivery.
defaults:
  platforms: [windows, unix]
  for: [csharp, dll, exe]
  crit: notable
  conf: 0.99
  size_min: 1000
  size_max: 10000000

traits:
  - id: epplus-library
    desc: EPPlus spreadsheet library
    if:
      type: text
      regex: '(?i)(\bEPPlus\b|OfficeOpenXml|ExcelPackage)'
