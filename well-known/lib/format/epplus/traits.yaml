# EPPlus -- Jan Källman's .NET library for reading and writing OOXML
# spreadsheets, shipped inside the ImportExcel PowerShell module and hundreds
# of other packages. It carries the whole set a stego-dropper rule looks for
# and needs every one of them to do its job: GDI pixel access for the images
# and charts embedded in a worksheet, Rijndael for OOXML's own workbook
# encryption, base64 for the parts it stores as text, and an HTTP client for
# external data connections.
defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 20000000

traits:
  - id: epplus-product-name
    desc: EPPlus spreadsheet library product name
    if:
      type: value
      path: pe.version.product_name
      exact: EPPlus

  - id: epplus-company
    desc: EPPlus spreadsheet library author
    if:
      type: value
      path: pe.version.company
      substr: 'Jan Källman'

  - id: epplus-api-strings
    desc: EPPlus spreadsheet library API strings
    for: [csharp, dll, exe]
    size_min: 1000
    size_max: 10000000
    if:
      type: text
      regex: '(?i)(\bEPPlus\b|OfficeOpenXml|ExcelPackage)'

composite_rules:
  - id: epplus-library
    desc: Recognized EPPlus spreadsheet library
    crit: exception
    conf: 0.99
    all:
      - id: epplus-product-name
      - id: epplus-company
