defaults:
  platforms:
  - unix
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 20000000
traits:
- id: epplus-product-name
  desc: EPPlus spreadsheet library product name
  if:
    type: value
    path: pe.version.product_name
    exact: EPPlus
- id: epplus-company
  desc: EPPlus spreadsheet library author
  if:
    type: value
    path: pe.version.company
    substr: Jan Källman
- id: epplus-api-strings
  desc: EPPlus spreadsheet library API strings
  for:
  - csharp
  - dll
  - exe
  size_min: 1000
  size_max: 10000000
  if:
    type: text
    regex: (?i)(\bEPPlus\b|OfficeOpenXml|ExcelPackage)
