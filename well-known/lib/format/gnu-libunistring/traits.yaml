defaults:
  platforms: [windows, linux, macos]
  size_min: 1024

traits:
  - id: libunistring-dll-basename
    desc: GNU libunistring DLL basename
    crit: notable
    conf: 0.95
    for: [pe, elf, macho]
    if:
      type: basename
      regex: '(?i)^libunistring(-[0-9]+)?\.dll$'

  - id: libunistring-export
    desc: GNU libunistring export
    crit: notable
    conf: 0.9
    for: [pe, elf, macho]
    if:
      type: symbol
      regex: '^libunistring_'

  - id: libunistring-product-name
    desc: GNU libunistring PE product name
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: text
      section: .rsrc
      substr: 'GNU libunistring: Unicode string library'

composite_rules:
  - id: gnu-libunistring-library
    for: [pe, elf, macho]
    desc: GNU libunistring Unicode library
    crit: notable
    conf: 0.95
    any:
      - id: libunistring-dll-basename
      - id: libunistring-export
      - id: libunistring-product-name
