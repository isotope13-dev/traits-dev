defaults:
  platforms: [windows, linux]
  for: [python, whl, alpine_apk, conda]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: pyyaml-reader-module-header
    desc: PyYAML reader module header
    crit: notable
    for: [python]
    if:
      type: text
      substr: This module contains abstractions for the input stream

composite_rules:
  - id: pyyaml-library-context
    desc: PyYAML library context
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/files/runtime::yaml-reader-py-path
      - id: pyyaml-reader-module-header
