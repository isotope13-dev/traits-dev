defaults:
  platforms: [windows, linux]
  for: [python, whl, alpine_apk, conda]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: pyyaml-reader-path
    desc: PyYAML reader module path
    if:
      type: path
      regex: '(^|[\\/])(py)?yaml[0-9]*[\\/]reader\.py$'
  - id: pyyaml-reader-module-header
    desc: PyYAML reader module header
    crit: notable
    for: [python]
    if:
      type: text
      substr: This module contains abstractions for the input stream
  - id: pyyaml-package-name
    desc: PyYAML package name
    for: [python]
    if:
      type: text
      regex: '(?i)\bpyyaml\b'

composite_rules:
  - id: pyyaml-library-context
    desc: PyYAML library context
    crit: notable
    conf: 0.98
    any:
      - id: pyyaml-reader-path
      - id: pyyaml-package-name
