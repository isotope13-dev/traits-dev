# fb55/htmlparser2 — forgiving HTML/XML parser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: htmlparser2 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: htmlparser2

  - id: vendored-path
    desc: vendored htmlparser2 package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/htmlparser2/'


composite_rules:
  - id: htmlparser2-library
    desc: htmlparser2 HTML/XML parser
    any:
      - id: package-name
      - id: vendored-path
