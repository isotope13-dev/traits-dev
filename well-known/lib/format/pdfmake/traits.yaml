# pdfmake is a benign JavaScript PDF-generation library. Its bundled PDFKit
# encryption code includes an RC4 implementation for legacy PDF output.
defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: pdfmake-version-banner
    desc: pdfmake PDF-generation library banner
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '/\*!\s*pdfmake v\d+\.\d+\.\d+'
