# py-moneyed — Python Currency and Money types (ISO 4217 tables + localization).
defaults:
  platforms: [unix, windows]
  for: [python, python-sdist]
  crit: notable
  conf: 0.98

traits:
  - id: py-moneyed-wheel-name
    desc: py-moneyed wheel distribution name
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: py-moneyed

  - id: moneyed-package-module
    desc: moneyed Python package module path
    if:
      type: path
      regex: '(^|[\\/])moneyed[\\/]'

  - id: currency-localization-sign-table
    desc: py-moneyed currency sign definition table
    for: [python]
    if:
      type: text
      regex: '_sign\(.{0,120}moneyed\.'

composite_rules:
  - id: py-moneyed-package-context
    desc: py-moneyed currency library package
    for: [python, python-sdist, whl]
    any:
      - id: py-moneyed-wheel-name
      - id: moneyed-package-module
