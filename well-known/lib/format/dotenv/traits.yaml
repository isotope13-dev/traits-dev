# README identity markers for motdotla/dotenv. These establish the upstream
# library whose documentation a republished package retained; neither marker
# implies malicious behavior on its own.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.95

traits:
  - id: readme-registry-link
    desc: README links official dotenv registry package
    if:
      type: text
      substr: npmjs.com/package/dotenv

  - id: readme-install-command
    desc: README installs the unscoped dotenv package
    if:
      type: text
      regex: '(?m)^\s*(npm install|yarn add|pnpm add|bun add) dotenv(\s|$)'
