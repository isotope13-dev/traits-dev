defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - class
  - java_class
  - jar
  - zip
  size_min: 64
  size_max: 5000000
traits:
- id: generated-message-lite-class
  desc: Google protobuf GeneratedMessageLite class
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: com/google/protobuf/GeneratedMessageLite

- id: protobuf-java-this-class
  desc: Google protobuf Java this_class package
  crit: notable
  conf: 0.98
  for:
  - class
  - java_class
  if:
    type: value
    path: class.this_class
    regex: '^com/google/protobuf/'

- id: protobuf-java-package-path
  desc: Google protobuf Java package path fragment
  crit: notable
  conf: 0.96
  if:
    type: path
    regex: '(?i)google/protobuf'
