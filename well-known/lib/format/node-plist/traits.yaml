# node-plist (TooTallNate) — Apple property-list parser for Node.js/browsers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: tootallnate-issue-ref
    desc: node-plist upstream GitHub issue reference
    for: [javascript, typescript]
    if:
      type: text
      substr: github.com/TooTallNate/plist.js

  - id: package-name
    desc: node-plist npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: plist

  - id: repository-url
    desc: node-plist source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: TooTallNate/node-plist

  - id: should-ignore-node
    desc: node-plist XML empty-node skip helper
    for: [javascript, typescript]
    if:
      type: text
      substr: 'function shouldIgnoreNode(node)'

  - id: vendored-path
    desc: vendored node-plist npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/plist/'

composite_rules:
  - id: node-plist-package
    desc: node-plist npm package manifest
    all:
      - id: package-name
      - id: repository-url
  - id: node-plist-library
    desc: node-plist Apple property-list library
    needs: 2
    any:
      - id: tootallnate-issue-ref
      - id: node-plist-package
      - id: vendored-path
      - id: should-ignore-node
      - id: package-name
