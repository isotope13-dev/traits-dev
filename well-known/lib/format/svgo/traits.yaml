# SVGO is the reference SVG optimizer. Its browser bundle embeds the
# path-data parser, which normalizes absolute SVG path commands to relative
# ones (`command==="H"` becomes `command="h"`); those single-character
# command constants are the file format's vocabulary, not anti-AV padding.
# Keep generic capabilities visible while suppressing dead-store padding
# only when the bundle path and an SVGO plugin marker agree.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 1.0

traits:
  - id: browser-bundle-path
    desc: SVGO browser bundle path
    crit: notable
    if:
      type: path
      basename: true
      exact: svgo.browser.js
      case_insensitive: true

  - id: optimizer-plugin-marker
    desc: SVGO optimizer plugin marker
    crit: notable
    if:
      type: text
      substr: removeViewBox

composite_rules:
  - id: vendor-bundle-context
    desc: Recognized vendored SVGO browser bundle
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: browser-bundle-path
      - id: optimizer-plugin-marker
