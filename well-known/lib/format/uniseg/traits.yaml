# github.com/rivo/uniseg — Go Unicode segmentation library. Its MIT
# license is the 2019 Oliver Kuederle grant commonly vendored as LICENSE.txt.
defaults:
  platforms: [unix, windows]
  for: [text, go]
  crit: notable
  conf: 0.98
  size_min: 32
  size_max: 200000

traits:
  - id: kuederle-2019-copyright
    desc: Oliver Kuederle 2019 copyright line
    if:
      type: text
      substr: Copyright (c) 2019 Oliver Kuederle

  - id: module-path
    desc: rivo uniseg Go module path
    for: [go]
    if:
      type: text
      substr: github.com/rivo/uniseg

composite_rules:
  - id: uniseg-license-identity
    desc: Recognized rivo uniseg MIT license
    all:
      - id: kuederle-2019-copyright
      - id: metadata/package/license::mit-license-grant-text
