# Poppler's Windows runtime DLL.  Its PDF/NSS certificate-validation paths
# enumerate Firefox and system certificate stores as part of normal signature
# verification, so the library identity is useful to generic file-targeting
# composites.
defaults:
  platforms: [windows]
  for: [dll]
  crit: component
  conf: 0.99
  size_min: 100000
  size_max: 50000000

traits:
  - id: poppler-dll-basename
    desc: Poppler PDF library basename
    if:
      type: path
      basename: true
      exact: poppler.dll
      case_insensitive: true

  - id: poppler-pdb-basename
    desc: Poppler PDF library PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: poppler.pdb
      case_insensitive: true

composite_rules:
  - id: poppler-library-identity
    desc: Poppler PDF library
    crit: notable
    conf: 0.99
    all:
      - id: poppler-dll-basename
      - id: poppler-pdb-basename
