# form-data-encoder — spec-compliant FormData encoder.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: form-data-encoder npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: form-data-encoder

  - id: vendored-path
    desc: vendored form-data-encoder package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/form-data-encoder/'


composite_rules:
  - id: form-data-encoder-library
    desc: form-data-encoder FormData encoder
    any:
      - id: package-name
      - id: vendored-path
