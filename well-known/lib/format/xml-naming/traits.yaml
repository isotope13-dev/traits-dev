# xml-naming — XML Name/NCName/QName production checks.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: xml-naming npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: xml-naming

  - id: vendored-path
    desc: vendored xml-naming package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/xml-naming/'
