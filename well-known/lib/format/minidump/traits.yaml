# rust-minidump — parser and writer for the Microsoft minidump format.
defaults:
  platforms: [unix, windows]
  for: [rust, crate, cargo.toml, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: minidump-crate-name
    desc: rust-minidump crate package name
    for: [crate, cargo.toml]
    if:
      type: value
      path: crate.name
      exact: minidump

  - id: rust-minidump-repository
    desc: rust-minidump upstream repository
    if:
      type: text
      substr: github.com/rust-minidump/rust-minidump

  - id: minidump-crate-path
    desc: minidump crate source archive path
    for: [rust]
    if:
      type: path
      regex: 'minidump-[0-9]'

  - id: minidump-writer-crate-path
    desc: minidump-writer crate source path
    for: [rust]
    if:
      type: path
      regex: '(^|[\\/])minidump-writer-[0-9]'

composite_rules:
  - id: rust-minidump-parser-context
    desc: rust-minidump crash dump parser crate
    crit: notable
    conf: 0.99
    any:
      - id: minidump-crate-name
      - id: rust-minidump-repository
      - id: minidump-crate-path
