# @xmldom/xmldom — W3C DOMParser/XMLSerializer JavaScript ponyfill.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: sax-w3c-name-start
    desc: xmldom SAX NameStartChar production comment
    for: [javascript]
    if:
      type: text
      substr: '[4]   	NameStartChar	   ::=   	":" | [A-Z] | "_" | [a-z]'

  - id: package-name
    desc: '@xmldom/xmldom npm package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@xmldom/xmldom'

  - id: vendored-path
    desc: '@xmldom/xmldom vendored package path'
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@xmldom/xmldom'

composite_rules:
  - id: xmldom-js-library
    desc: xmldom W3C XML DOM library
    any:
      - id: sax-w3c-name-start
      - id: package-name
      - id: vendored-path
