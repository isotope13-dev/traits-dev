# python-barcode — barcode generation library (whynothugo/python-barcode).
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
  conf: 0.98

traits:
  - id: python-barcode-wheel-name
    desc: python-barcode PyPI wheel distribution name
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: python-barcode

  - id: barcode-package-module-path
    desc: barcode Python package tree in wheel
    if:
      type: path
      regex: '(^|[\\/])barcode[\\/]'

  - id: python-barcode-upstream-homepage
    desc: python-barcode upstream GitHub homepage
    for: [whl]
    if:
      type: value
      path: METADATA::Home-page
      substr: github.com/whynothugo/python-barcode

  - id: pybarcode-console-script-entry
    desc: python-barcode console_scripts entry point
    for: [whl]
    if:
      type: text
      regex: 'python-barcode\s*=\s*barcode\.pybarcode:main'

composite_rules:
  - id: python-barcode-library-context
    desc: python-barcode barcode generation library
    any:
      - id: python-barcode-wheel-name
      - id: barcode-package-module-path
