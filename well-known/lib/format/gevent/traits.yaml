# gevent ships an explicitly documented, unauthenticated network REPL named
# BackdoorServer for local debugging.  Its source, tests, and bytecode are
# benign library context for the generic backdoor-server label rule.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  crit: notable
  conf: 0.99

traits:
  - id: gevent-backdoor-basename
    desc: gevent backdoor module or test basename
    size_max: 200000
    if:
      type: basename
      regex: '(?i)^(backdoor|test__backdoor)(\.[A-Za-z0-9_-]{1,32})?\.pyc?$'

  - id: gevent-pywsgi-test-basename
    desc: gevent WSGI parser test basename
    size_max: 200000
    for: [python]
    if:
      type: basename
      regex: '(?i)^test__pywsgi\.pyc?$'

  - id: gevent-native-package-path
    desc: gevent package native path
    for: [so]
    size_max: 2000000
    if:
      type: path
      regex: '(?i)(^|[\\/])gevent[\\/]'

  - id: gevent-native-extension-basename
    desc: gevent bundled native extension basename
    for: [so]
    size_max: 2000000
    if:
      type: basename
      regex: '(?i)^(_corecffi|cares)(\.[^\\/]+)?\.so$'

  - id: gevent-package-marker
    desc: gevent package namespace marker
    if:
      type: text
      regex: '\bgevent\.'

composite_rules:
  - id: gevent-backdoor-debug-context
    desc: Recognized gevent backdoor debugging context
    crit: exception
    conf: 0.99
    all:
      - id: gevent-backdoor-basename
      - id: gevent-package-marker

  - id: gevent-pywsgi-test-context
    desc: Recognized gevent WSGI parser test context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: gevent-pywsgi-test-basename
      - id: gevent-package-marker

  - id: gevent-native-extension-context
    desc: Recognized gevent native runtime extension context
    crit: exception
    conf: 0.99
    for: [so]
    all:
      - id: gevent-native-package-path
      - id: gevent-native-extension-basename
