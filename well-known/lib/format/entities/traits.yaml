# fb55/entities — HTML/XML entity encoder/decoder.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: entities npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: entities

  - id: vendored-path
    desc: vendored entities package path
    if:
      type: path
      regex: 'node_modules/entities/'

composite_rules:
  - id: entities-library
    desc: HTML/XML entities encoder/decoder
    any:
      - id: package-name
      - id: vendored-path
