# SnakeYAML — YAML parser for Java.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar]
  crit: notable
  conf: 0.99

traits:
  - id: class-namespace
    desc: SnakeYAML Java package namespace
    if:
      type: import
      regex: '^org/yaml/snakeyaml/'
  - id: vendored-path
    desc: SnakeYAML Java parser path
    if:
      type: path
      regex: 'org/yaml/snakeyaml'

composite_rules:
  - id: snakeyaml-library
    desc: SnakeYAML Java YAML parser
    any:
      - id: class-namespace
      - id: vendored-path
