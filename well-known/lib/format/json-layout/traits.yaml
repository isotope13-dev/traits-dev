# @json-layout/vocabulary — JSON Layout schema vocabulary and normalizers.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: json-layout-vocabulary-npm-name
    desc: JSON Layout vocabulary npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@json-layout/vocabulary'

  - id: json-layout-vocabulary-package-json-name
    desc: JSON Layout vocabulary package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@json-layout/vocabulary'

  - id: json-layout-schema-ref-host
    desc: JSON Layout published schema reference host
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      substr: json-layout.github.io/normalized-layout-keyword

composite_rules:
  - id: json-layout-vocabulary-package-context
    desc: JSON Layout vocabulary npm package
    for: [npm, package.json, tar, zip]
    scope: archive
    any:
      - id: json-layout-vocabulary-npm-name
      - id: json-layout-vocabulary-package-json-name
