# xss-clean — Express middleware that sanitizes request input via xss-filters.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: xss-clean npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: xss-clean

  - id: xss-filters-dependency
    desc: xss-clean depends on xss-filters
    for: [package.json]
    if:
      type: value
      path: dependencies.xss-filters
      regex: '\S'

  - id: in-html-data-sanitizer
    desc: Sanitizes input with xss-filters inHTMLData
    for: [javascript]
    if:
      type: text
      substr: inHTMLData

composite_rules:
  - id: xss-sanitizer-package-context
    desc: xss-clean defensive input sanitization package
    crit: exception
    conf: 0.99
    all:
      - id: package-name
      - id: xss-filters-dependency

  - id: xss-sanitizer-code-context
    desc: xss-clean inHTMLData sanitization implementation
    crit: exception
    conf: 0.99
    # Archive-scope: `in-html-data-sanitizer` matches the javascript
    # implementation file while `package-name` matches package.json, so pool
    # both legs across the npm package's members instead of requiring both on
    # one node.
    scope: archive
    all:
      - id: in-html-data-sanitizer
      - id: package-name
