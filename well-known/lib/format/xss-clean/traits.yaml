defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - npm
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: xss-clean npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: xss-clean
- id: xss-filters-dependency
  desc: xss-clean depends on xss-filters
  for:
  - package.json
  if:
    type: value
    path: dependencies.xss-filters
    regex: \S
- id: in-html-data-sanitizer
  desc: Sanitizes input with xss-filters inHTMLData
  for:
  - javascript
  if:
    type: text
    substr: inHTMLData
