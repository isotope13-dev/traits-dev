# npm/ini — INI file encoder/decoder for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ini npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ini

  - id: repository
    desc: npm/ini source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/npm/ini

  - id: vendored-path
    desc: vendored ini package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/ini/'

composite_rules:
  - id: npm-ini-library
    desc: npm ini encoder/decoder library
    needs: 2
    any:
      - id: package-name
      - id: repository
      - id: vendored-path
