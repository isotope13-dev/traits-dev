# racker/node-elementtree — Python ElementTree-style XML parser for Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, text, makefile]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: elementtree npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: elementtree

  - id: homepage
    desc: node-elementtree GitHub homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://github.com/racker/node-elementtree

  - id: rackspace-copyright
    desc: node-elementtree Rackspace copyright header
    for: [javascript, text]
    if:
      type: text
      substr: 'Copyright 2011 Rackspace'

  - id: whiskey-make-target
    desc: node-elementtree whiskey test Makefile target
    for: [text, makefile]
    if:
      type: text
      substr: '${WHISKEY} --scope-leaks --sequential'

  - id: vendored-path
    desc: vendored elementtree npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/elementtree'

composite_rules:
  - id: node-elementtree-library
    desc: node-elementtree XML parser
    any:
      - id: package-name
      - id: homepage
      - id: rackspace-copyright
      - id: whiskey-make-target
      - id: vendored-path
