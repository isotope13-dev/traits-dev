# racker/node-elementtree — Python ElementTree-style XML parser for Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: elementtree npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: elementtree

  - id: homepage
    desc: node-elementtree GitHub homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://github.com/racker/node-elementtree

composite_rules:
  - id: node-elementtree-library
    desc: node-elementtree XML parser
    all:
      - id: package-name
      - id: homepage
