# The netrc Ruby library parses the user's `.netrc` file by design. Its own
# parser and tests are credential-path handling, not an install-time stealer.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, tar]
  crit: notable
  conf: 0.99

traits:
- id: netrc-gem-path
  desc: Ruby netrc library package path
  if:
    type: path
    regex: 'netrc-[0-9][^\\/]*(\.gem$|[\\/])'

- id: netrc-class
  desc: Ruby Netrc parser class
  for: [ruby]
  if:
    type: text
    regex: '(?m)^class Netrc\b'

composite_rules:
- id: netrc-library-context
  desc: Recognized Ruby netrc library context
  crit: exception
  conf: 0.99
  any:
  - id: netrc-gem-path
  - id: netrc-class
