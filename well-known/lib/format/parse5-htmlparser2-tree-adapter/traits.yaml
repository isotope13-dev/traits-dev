# parse5 htmlparser2 tree adapter.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: parse5-htmlparser2-tree-adapter name
    for: [package.json]
    if:
      type: value
      path: name
      exact: parse5-htmlparser2-tree-adapter

  - id: vendored-path
    desc: vendored parse5 htmlparser2 adapter path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/parse5-htmlparser2-tree-adapter/'
