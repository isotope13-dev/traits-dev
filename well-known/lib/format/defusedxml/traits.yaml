defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data, pkginfo, archives, python]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: defusedxml Python package name
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: name
      exact: defusedxml

  - id: package-summary
    desc: defusedxml package summary
    for: [pkginfo, pyproject.toml]
    if:
      type: value
      path: summary
      substr: XML bomb protection for Python

  - id: package-path
    desc: defusedxml Python package path
    for: [scripts, source, text, data]
    if:
      type: path
      regex: '(?i)(^|[\\/])defusedxml([\\/]|-[0-9])'

  - id: python-module-import
    desc: Python module imports defusedxml
    for: [python]
    if:
      type: text
      regex: '(?im)^\s*(import\s+defusedxml|from\s+defusedxml\b)'

composite_rules:
  - id: defusedxml-package
    desc: Member of defusedxml security library distribution
    crit: notable
    conf: 0.98
    scope: archive
    needs: 2
    any:
      - id: package-name
      - id: package-summary
      - id: package-path
