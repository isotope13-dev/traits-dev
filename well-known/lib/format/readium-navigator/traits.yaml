# Readium ts-toolkit navigator (@readium/navigator) — EPUB/WebPub reader SDK.
# Its optional protection modules (DevToolsDetector, copy/print guards) are
# publisher-requested content-protection hooks that report back to the host
# app through callbacks; they are not anti-analysis for hidden payloads.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Readium navigator package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@readium/navigator"

  - id: helpers-import
    desc: Imports the Readium helpers package
    if:
      type: text
      regex: 'from\s*["'']@readium/helpers["'']'

  - id: helpers-sml-bundled-import
    desc: Imports bundled Readium sML helper
    if:
      type: text
      regex: 'from\s*["'']\.\./helpers/dist/sML\.(js|ts)["'']'

  - id: worker-console-import
    desc: Imports Readium WorkerConsole utility
    if:
      type: text
      regex: 'from\s*["'']\./utils/WorkerConsole\.(js|ts)["'']'

  - id: bundled-protection-module-path
    desc: Bundled Readium protection module path
    if:
      type: text
      substr: 'node_modules/@readium/navigator/dist/protection/'

composite_rules:
  - id: protection-module-context
    desc: Readium navigator protection module
    crit: exception
    conf: 0.95
    all:
      - id: worker-console-import
    any:
      - id: helpers-import
      - id: helpers-sml-bundled-import

