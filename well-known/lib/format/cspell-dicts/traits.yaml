# @cspell/dict-en-common-misspellings — cspell English typo dictionary.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, json, javascript, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cspell en-common-misspellings package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: '@cspell/dict-en-common-misspellings'

  - id: cspell-dicts-repository
    desc: cspell-dicts upstream repository
    for: [package.json, npm]
    if:
      type: text
      substr: github.com/streetsidesoftware/cspell-dicts

  - id: cspell-ext-export
    desc: cspell dictionary extension export
    for: [package.json, json]
    if:
      type: text
      substr: cspell-ext.json

composite_rules:
  - id: cspell-misspellings-dictionary-context
    desc: cspell English misspellings dictionary package
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: cspell-dicts-repository
