# inikulin/parse5 — WHATWG HTML parser and serializer.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: parse5 npm package name
    if:
      type: value
      path: name
      exact: parse5

  - id: homepage
    desc: parse5 project homepage
    if:
      type: value
      path: homepage
      exact: https://parse5.js.org

composite_rules:
  - id: parse5-html-parser
    desc: parse5 HTML parser
    all:
      - id: package-name
      - id: homepage
