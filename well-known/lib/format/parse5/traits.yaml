# inikulin/parse5 — WHATWG HTML parser and serializer.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: parse5 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: parse5

  - id: homepage
    desc: parse5 project homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://parse5.js.org

  - id: vendored-path
    desc: vendored parse5 npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/parse5/'

composite_rules:
  - id: parse5-html-parser
    desc: parse5 HTML parser
    any:
      - id: vendored-path
      - id: package-name
