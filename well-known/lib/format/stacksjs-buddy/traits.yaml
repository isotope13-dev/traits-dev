# @stacksjs/buddy ("Meet Buddy. The Stacks runtime") is the Stacks framework
# CLI. Its mail commands provision and operate the operator's own mail
# infrastructure (SES relay, KMS keys, restic backups): resolving the
# operator's own AWS credentials to call the operator's own AWS APIs is the
# documented workflow, not credential theft. Keep those generic capabilities
# visible while suppressing credential-stealer composites only when Buddy's
# own CLI command registration and mail-subsystem markers agree.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 1.0

traits:
  - id: buddy-package-name
    desc: Stacks Buddy npm package identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stacksjs/buddy'

  - id: buddy-npm-package-name
    desc: Stacks Buddy npm archive identity
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@stacksjs/buddy'

  # Buddy registers CLI commands through its clapp command object; the mail
  # commands below are the ones resolving AWS credentials for SES/KMS use.
  - id: buddy-cli-command-marker
    desc: Buddy CLI command registration marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'buddy.command('

  # Buddy's mail subsystem (encrypted mail storage, KMS-escrowed LUKS keys,
  # restic backups) names every secret, path and unit after mail-storage.
  - id: buddy-mail-storage-marker
    desc: Buddy mail storage subsystem marker
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'mail-storage'

composite_rules:
  - id: buddy-mail-provisioning-context
    desc: Recognized Buddy mail provisioning runtime context
    crit: exception
    conf: 1.0
    scope: file
    for: [javascript, typescript]
    all:
      - id: buddy-cli-command-marker
      - id: buddy-mail-storage-marker

  - id: buddy-package-context
    desc: Recognized Stacks Buddy package context for archive-wide analysis
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: buddy-package-name
      - id: well-known/lib/web/stacksjs/stacks::stacks-monorepo-repository

  - id: buddy-npm-package-context
    desc: Recognized Stacks Buddy npm archive context for archive-wide analysis
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: buddy-npm-package-name
      - id: well-known/lib/web/stacksjs/stacks::stacks-monorepo-repository
