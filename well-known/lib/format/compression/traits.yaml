defaults:
  size_max: 20000000
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.8
  for: [elf, macho, pe]
traits:
  # A compression *library* is identified by the API it exports. These were
  # `type: text` in `section: .text`, where no symbol name ever lives, and the
  # `\b` after a partial name (`BZ2_bz`, `lzma_stream`) failed on the real
  # names, so none fired on liblzma, libbz2 or any other library and the xz
  # backdoor composites that build on compression-lib could not either.
  - id: lzma-marker
    desc: Exports the liblzma API
    if:
      type: export
      regex: '^lzma_(code|end|stream_decoder|stream_encoder|easy_encoder|auto_decoder)$'
  - id: xz-marker
    desc: Exports XZ Utils CRC routines
    if:
      type: export
      regex: '^(lzma|xz)_crc(32|64)$'
  - id: bzip2-marker
    desc: Exports the libbz2 API
    if:
      type: export
      regex: '^BZ2_bz(Compress|Decompress)(Init|End)?$'
composite_rules:
  - id: compression-lib
    desc: File is a compression library
    crit: notable
    conf: 0.85
    any:
      - id: lzma-marker
      - id: xz-marker
      - id: bzip2-marker
