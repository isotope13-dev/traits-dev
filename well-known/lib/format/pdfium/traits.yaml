defaults:
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.98
  size_max: 268435456

traits:
  - id: source-tree
    crit: notable
    desc: PDFium source tree or parser test corpus
    for: [source, c, cpp, pdf, javascript, text, tar]
    if:
      type: path
      regex: '(^|[\\/])pdfium([\\/]|-|_)'

  - id: pdfium-c-api-symbols
    desc: PDFium FPDF C API symbol names
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 65536
    # A dozen of them: a passing mention of one FPDF_ name in unrelated code is
    # not an embedded rendering engine.
    count_min: 12
    if:
      type: text
      regex: '\bFPDF_[A-Za-z_]{4,40}\b'
      section: rdata

  - id: pdfium-render-crate-path
    desc: pdfium-render Rust crate source path
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 65536
    if:
      type: text
      regex: 'pdfium-render-[0-9]+\.[0-9]+\.[0-9]+[\\/]src'
      section: rdata

composite_rules:
  - id: pdfium-rendering-engine
    desc: Embeds the PDFium rendering engine
    crit: notable
    conf: 0.98
    any:
      - id: pdfium-c-api-symbols
      - id: pdfium-render-crate-path
