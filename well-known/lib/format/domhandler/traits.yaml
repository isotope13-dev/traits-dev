# fb55/domhandler — htmlparser2 DOM handler.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: domhandler npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: domhandler

  - id: vendored-path
    desc: vendored domhandler package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/domhandler/'


composite_rules:
  - id: domhandler-library
    desc: domhandler DOM tree builder
    any:
      - id: package-name
      - id: vendored-path
