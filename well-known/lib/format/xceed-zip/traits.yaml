defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 16777216

traits:
  - id: xceed-company
    desc: Xceed Software publisher metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Xceed Software Inc\b'

  - id: xceed-zip-product
    desc: Xceed Zip library product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Xceed Zip for COM/ActiveX$'

composite_rules:
  - id: xceed-zip-library-context
    desc: Xceed Zip signed library context
    crit: exception
    all:
      - id: well-known/lib/format/xceed-zip::xceed-company
      - id: well-known/lib/format/xceed-zip::xceed-zip-product
