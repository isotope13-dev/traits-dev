# Apache Tika's server distribution bundles a SysV init script for running the
# server as a service; its header says so in the standard Provides and
# Description lines.  The script installs itself with update-rc.d by design.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.99

traits:
  - id: tika-init-provides
    desc: Apache Tika SysV init Provides line
    if:
      type: text
      regex: '#\s*Provides:\s+tika\b'

  - id: tika-init-description
    desc: Apache Tika SysV init Description line
    if:
      type: text
      substr: Controls Apache Tika as a Service

composite_rules:
  - id: tika-init-script-context
    desc: Apache Tika bundled SysV init script
    crit: exception
    all:
      - id: tika-init-provides
      - id: tika-init-description
