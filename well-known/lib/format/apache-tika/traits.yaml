# Apache Tika's PDF parser enumerates ISO 32000 action triggers, including a
# form-field keystroke action. These classes extract action types and embedded
# JavaScript as XHTML metadata; they do not register a keyboard hook or capture
# user input.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: pdf-action-extractor-class
    desc: Apache Tika PDF action extractor class
    if:
      type: value
      path: class.this_class
      regex: '^org/apache/tika/parser/pdf/AbstractPDF2XHTML(\$ActionTrigger)?$'
