# kXML2 (Stefan Haustein's small XmlPull parser and serializer). Its parser
# declares keyword tables as `new char[] {'E','M','P','T','Y'}` constants,
# which the inline-character-array rule reads as hidden strings.
defaults:
  for: [java]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: kxml-author-header
    desc: kXML author copyright header
    if:
      type: text
      substr: Stefan Haustein

  - id: kxml-class-declaration
    desc: kXML parser or serializer class declaration
    if:
      type: text
      regex: 'class KXml(Parser|Serializer)\b'

composite_rules:
  - id: kxml2-source-file
    desc: kXML2 parser or serializer source file
    crit: exception
    all:
      - id: kxml-author-header
      - id: kxml-class-declaration
