# formatjs / react-intl message extract and compile toolchain.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: formatjs-cli-lib-require
    desc: Requires @formatjs/cli-lib package
    if:
      type: text
      regex: '''@formatjs/cli-lib''|"@formatjs/cli-lib"'

  - id: babel-plugin-formatjs-require
    desc: Requires babel-plugin-formatjs package
    if:
      type: text
      regex: '''babel-plugin-formatjs''|"babel-plugin-formatjs"'

  - id: formatjs-on-msg-extracted
    desc: formatjs onMsgExtracted extract callback
    if:
      type: text
      substr: onMsgExtracted

  - id: formatjs-cli-compile-call
    desc: Compiles messages via formatjs compile()
    if:
      type: text
      regex: '(?s)\bcompile\s*\(\s*\[[^\]]{0,80}\]\s*,\s*\{.{0,120}?\bformat\s*:'

composite_rules:
  - id: formatjs-translation-extract-toolchain
    desc: formatjs message extract/compile toolchain
    conf: 0.96
    any:
      - id: formatjs-extract-and-compile
      - id: formatjs-extract-pipeline
  - id: formatjs-extract-pipeline
    desc: formatjs babel extract pipeline
    conf: 0.95
    all:
      - id: babel-plugin-formatjs-require
      - id: formatjs-on-msg-extracted
  - id: formatjs-extract-and-compile
    desc: formatjs extract plus compile pipeline
    conf: 0.96
    all:
      - id: formatjs-cli-lib-require
      - id: formatjs-cli-compile-call
    any:
      - id: babel-plugin-formatjs-require
      - id: formatjs-on-msg-extracted
