# zlib — classic deflate/inflate compression library (Mark Adler / Jean-loup Gailly).
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: inflate-copyright-string
    desc: zlib inflate copyright string
    conf: 0.99
    for: [c, cpp, data]
    if:
      type: text
      regex: 'inflate \d+\.\d+\.\d+ Copyright .{0,40}Mark Adler'

  - id: zlib-source-basename
    desc: classic zlib inflate helper source basename
    conf: 0.96
    if:
      type: basename
      regex: '(?i)^inf(trees|block|codes|util)\.[ch]$'

  - id: zlib-masm-fastinflate-basename
    desc: zlib MASM fast inflate helper basename
    for: [text, c, cpp]
    if:
      type: basename
      exact: inffas32.asm
      case_insensitive: true

  - id: zlib-pe-product-name
    desc: zlib PE ProductName version info
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^zlib$'

  - id: zlib-pe-file-description
    desc: zlib PE FileDescription version info
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^zlib data compression library'

  - id: zlib-shared-library-filename
    desc: zlib shared library filename
    conf: 0.95
    for: [pe, dll, elf, so, macho, dylib]
    if:
      type: basename
      regex: '(?i)^(lib)?z(lib)?1?(\.dll|\.so(\.[0-9]+)*|\.dylib)$'

  - id: zlib-version-symbol
    desc: zlib library version symbol
    conf: 0.98
    for: [pe, dll, elf, so, macho, dylib]
    if:
      type: symbol
      exact: zlibVersion

composite_rules:
  - id: zlib-compression-library
    desc: zlib compression library sources
    crit: notable
    conf: 0.98
    any:
      - id: inflate-copyright-string
      - id: zlib-source-basename
      - id: zlib-masm-fastinflate-basename

  - id: zlib-shared-library
    desc: zlib compression shared library
    crit: notable
    conf: 0.98
    for: [pe, dll, elf, so, macho, dylib]
    needs: 2
    any:
      - id: zlib-pe-product-name
      - id: zlib-pe-file-description
      - id: zlib-shared-library-filename
      - id: zlib-version-symbol
      - id: micro-behaviors/data/compress::deflate
      - id: micro-behaviors/data/decompress/zlib::inflate
