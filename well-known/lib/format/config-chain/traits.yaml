# dominictarr/config-chain — layered INI/JSON config merger.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: config-chain npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: config-chain

  - id: vendored-path
    desc: vendored config-chain package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/config-chain/'

  - id: proto-list-require
    desc: config-chain proto-list dependency require
    if:
      type: text
      substr: "require('proto-list')"

  - id: config-chain-ctor
    desc: config-chain ConfigChain constructor
    if:
      type: text
      substr: 'conf = new ConfigChain()'

composite_rules:
  - id: library
    desc: dominictarr config-chain library
    needs: 2
    any:
      - id: package-name
      - id: vendored-path
      - id: proto-list-require
      - id: config-chain-ctor
