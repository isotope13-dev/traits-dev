# lgeiger/escape-carriage — terminal CR overwrite for Node streams.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: escape-carriage npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: escape-carriage

  - id: vendored-path
    desc: vendored escape-carriage package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/escape-carriage/'

  - id: api-function
    desc: escapeCarriageReturn API function
    if:
      type: text
      substr: escapeCarriageReturn

  - id: github-repository
    desc: escape-carriage GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/lgeiger/escape-carriage

composite_rules:
  - id: escape-carriage-library
    desc: lgeiger/escape-carriage CR overlay
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: api-function
      - id: github-repository
