# mime — MIME type lookup from filenames.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mime npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mime

  - id: vendored-path
    desc: vendored mime package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/mime/'


composite_rules:
  - id: mime-library
    desc: mime Content-Type lookup
    any:
      - id: package-name
      - id: vendored-path
