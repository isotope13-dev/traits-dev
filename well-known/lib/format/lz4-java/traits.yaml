# lz4-java — Yawnoc / at.yawk LZ4 compression for Java.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 15000000

traits:
  - id: pom-group
    desc: lz4-java Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: at.yawk.lz4

  - id: pom-artifact
    desc: lz4-java Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: lz4-java

  - id: bundle-symbolic-name
    desc: lz4-java OSGi bundle symbolic name
    for: [jar, zip]
    conf: 0.98
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: lz4-java

  - id: maven-group-path
    desc: yawk lz4-java Maven group path
    conf: 0.96
    if:
      type: path
      substr: at.yawk.lz4

composite_rules:
  - id: lz4-java-library
    desc: yawk lz4-java compression library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
