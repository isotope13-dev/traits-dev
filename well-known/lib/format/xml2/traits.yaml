defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, c, xml]
  crit: baseline
  conf: 0.97
  size_max: 268435456

traits:
  - id: libxml2-native-library
    desc: libxml2 native XML library
    crit: notable
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    if:
      type: value
      path: pe.version.product_name
      exact: libxml2

  - id: source-path-marker
    crit: notable
    for: [c, cpp, makefile, shell]
    desc: Path includes versioned libxml2 directory
    if:
      type: path
      regex: '(^|[\\/])libxml2-[0-9].{0,120}'
  - id: source-text-marker--libxml2
    crit: notable
    desc: libxml2 configure package declaration
    if:
      type: text
      regex: "(?m)^PACKAGE_NAME=['\"]libxml2['\"]$"
  - id: source-text-marker--libxml
    crit: notable
    desc: libxml2 version macro declaration
    if:
      type: text
      regex: '(?m)^#define LIBXML_DOTTED_VERSION '

composite_rules:
- id: source-text-marker
  crit: notable
  desc: libxml2 configure or version declaration
  any:
  - id: source-text-marker--libxml2
  - id: source-text-marker--libxml
- id: source-bundle
  desc: libxml2 source path or self-declaration
  crit: notable
  conf: 0.97
  any:
  - id: well-known/lib/format/xml2::source-path-marker
  - id: well-known/lib/format/xml2::source-text-marker--libxml
  - id: well-known/lib/format/xml2::source-text-marker--libxml2
