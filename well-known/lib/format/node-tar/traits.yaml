# isaacs/node-tar — Node.js tar archive library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: testing-fake-platform-env
    desc: node-tar test platform override env
    for: [javascript, typescript]
    if:
      type: text
      substr: TESTING_TAR_FAKE_PLATFORM

  - id: package-repository
    desc: node-tar source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: isaacs/node-tar

  - id: pack-stream-usage
    desc: node-tar Pack stream usage comment
    for: [javascript, typescript]
    if:
      type: text
      substr: "new Pack(opt).add('files').add('dir').end().pipe(output)"

  - id: vendored-path
    desc: vendored node-tar package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/tar/'

composite_rules:
  - id: node-tar-library
    desc: isaacs node-tar archive library
    any:
      - id: testing-fake-platform-env
      - id: package-repository
      - id: pack-stream-usage
      - id: vendored-path
