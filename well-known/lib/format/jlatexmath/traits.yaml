# JLaTeXMath's GWT build (used by GeoGebra's web math renderer) ships each font as
# a script assigning `JSON.parse('[1000,[33,"...",272,440,...]]')` to
# `__JLM2_GWT_FONTS__[<name>]`: glyph advances and outline points as bare integer
# lists, which read like character-code encoding to a string-concealment rule.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
  size_min: 500
  size_max: 5000000

traits:
  - id: gwt-font-table
    desc: JLaTeXMath GWT font metrics table
    if:
      type: text
      substr: __JLM2_GWT_FONTS__
