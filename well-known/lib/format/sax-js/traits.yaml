# sax-js — streaming SAX XML parser for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: max-buffer-length-constant
    desc: sax-js MAX_BUFFER_LENGTH default
    for: [javascript, typescript]
    if:
      type: text
      substr: 'sax.MAX_BUFFER_LENGTH = 64 * 1024'

  - id: package-name
    desc: sax npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: sax

composite_rules:
  - id: sax-js-library
    desc: sax-js streaming XML parser
    any:
      - id: max-buffer-length-constant
      - id: package-name
