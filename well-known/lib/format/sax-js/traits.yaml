# isaacs/sax-js — SAX-style XML parser for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: sax npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: sax
  - id: sax-parser-export
    desc: sax SAXParser constructor export
    for: [javascript]
    if:
      type: text
      substr: 'sax.SAXParser = SAXParser'
  - id: vendored-path
    desc: vendored sax package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/sax/'

composite_rules:
  - id: sax-js-library
    desc: sax-js XML streaming parser
    needs: 2
    any:
      - id: package-name
      - id: sax-parser-export
      - id: vendored-path
