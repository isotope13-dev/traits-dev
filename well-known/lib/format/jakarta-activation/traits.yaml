# Jakarta Activation (jakarta.activation) MIME/data-source API.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: activation-this-class
    desc: Jakarta Activation this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^jakarta/activation/'

  - id: activation-jar-basename
    desc: Jakarta Activation library JAR name
    for: [jar, zip]
    if:
      type: basename
      regex: '^jakarta\.activation-[0-9][A-Za-z0-9._-]*\.jar$'
