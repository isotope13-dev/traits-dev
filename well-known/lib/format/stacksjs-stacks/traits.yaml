# @stacksjs/* packages from the stacksjs/stacks monorepo.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: stacks-monorepo-repository
    desc: stacksjs stacks monorepo repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/stacksjs/stacks(\.git)?'

  - id: stacks-monorepo-package-name
    desc: Stacks monorepo npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(stacks|@stacksjs/)'

  - id: archive-path
    desc: stacksjs scoped npm archive path
    if:
      type: path
      regex: '(@stacksjs|i18n|tinker|buddy|utils)-[0-9]'

  - id: hetzner-ssh-bun-remote-probe-marker
    desc: Stacks Hetzner deploy SSH bun probe
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'reconcilePartialDeployManagementDashboardsWithLiveBox'

composite_rules:
  - id: stacks-package-context
    desc: Stacks.js monorepo npm package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: stacks-monorepo-package-name
      - id: stacks-monorepo-repository

  - id: stacks-hetzner-deploy-runtime-context
    desc: Stacks Hetzner SSH deploy probe runtime
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: stacks-monorepo-package-name
      - id: stacks-monorepo-repository
      - id: hetzner-ssh-bun-remote-probe-marker
