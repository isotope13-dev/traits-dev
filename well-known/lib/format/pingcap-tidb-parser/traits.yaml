# PingCAP TiDB SQL parser (github.com/pingcap/tidb/pkg/parser).
defaults:
  platforms: [unix, windows]
  for: [go, archives, zip, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: pingcap-tidb-parser-module-path
    desc: tidb/pkg/parser module tree path segment
    if:
      type: path
      regex: 'tidb/pkg/parser'

composite_rules:
  - id: pingcap-tidb-parser-context
    desc: PingCAP TiDB SQL parser source tree
    crit: exception
    conf: 0.99
    any:
      - id: pingcap-tidb-parser-module-path
      - id: well-known/lib/development/pingcap-tidb-parser::archive-module-path
