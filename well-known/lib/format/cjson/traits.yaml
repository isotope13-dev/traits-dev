defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.99

traits:
  # Definitions distinguish the library from programs merely calling its API.
  # No version, filename, file size or benign-behavior exclusion is required.
  - id: version-function
    desc: cJSON version function implementation
    if:
      type: function
      exact: cJSON_Version
  - id: allocator-hooks-function
    desc: cJSON allocator hook implementation
    if:
      type: function
      exact: cJSON_InitHooks
  - id: parse-options-function
    desc: cJSON parser options implementation
    if:
      type: function
      exact: cJSON_ParseWithOpts
  - id: unformatted-printer-function
    desc: cJSON unformatted printer implementation
    if:
      type: function
      exact: cJSON_PrintUnformatted

composite_rules:
  - id: cjson-implementation
    desc: cJSON parser and printer implementation
    all:
      - id: version-function
      - id: allocator-hooks-function
      - id: parse-options-function
      - id: unformatted-printer-function
