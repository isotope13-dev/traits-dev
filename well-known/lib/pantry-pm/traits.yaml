# ts-pantry is the TypeScript library and CLI for the Pantry package manager.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: ts-pantry-package-name
    desc: Pantry ts-pantry npm package identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: ts-pantry

  - id: ts-pantry-repository
    desc: Pantry upstream repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/pantry-pm/pantry(\.git)?'

  - id: pkgx-catalog-package-yml-url
    desc: Pantry pkgx catalog package.yml reference
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'github.com/pkgxdev/pantry/tree/main/projects/'

composite_rules:
  - id: ts-pantry-package-context
    desc: Recognized Pantry ts-pantry package manager context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: ts-pantry-package-name
      - id: ts-pantry-repository
