defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: gpt-tokenizer-package-path
    desc: GPT tokenizer package path
    crit: component
    if:
      type: path
      regex: '(^|[\\/])gpt-tokenizer([\\/]|$)'

  - id: cl100k-bpe-ranks-basename
    desc: cl100k BPE ranks filename
    crit: component
    if:
      type: path
      exact: cl100k_base.js
      basename: true

composite_rules:
  - id: cl100k-bpe-ranks-table
    desc: GPT tokenizer cl100k BPE ranks table
    all:
      - id: gpt-tokenizer-package-path
      - id: cl100k-bpe-ranks-basename
