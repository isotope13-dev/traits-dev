defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: leptonica-library
    desc: Leptonica image-processing library
    if:
      type: path
      regex: '(?i)(^|[\\/])leptonica([-_.][^\\/]*)?\.(dll|so(\.[0-9]+)*)$'
