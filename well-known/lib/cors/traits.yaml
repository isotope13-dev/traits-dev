defaults:
  platforms: [unix, windows]
  for: [package.json, markdown]

traits:
  - id: express-cors-upstream-repository
    desc: Metadata points to Express CORS repository
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(^|[/.:])expressjs/cors(\.git)?$'

  - id: express-cors-upstream-repository-url
    desc: URL points to Express CORS repository
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(^|[/.:])expressjs/cors(\.git)?$'

  - id: express-cors-readme-heading
    desc: README heading identifies CORS middleware
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?m)^#\s*cors([- ][A-Za-z0-9._-]+)?\s*$'
