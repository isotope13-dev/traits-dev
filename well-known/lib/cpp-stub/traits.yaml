# cpp-stub (github.com/coolxv/cpp-stub) — a header-only C++ unit-test library
# that stubs a function by inline-patching it: it makes the target's code page
# RWX, writes an architecture-specific absolute jump over the prologue, flushes
# the instruction cache, and restores the saved bytes on teardown.
#
# That is inline hooking, and the hook detections that fire on it are correct —
# this file does not suppress them. What it adds is the missing half of the
# triage: naming the library, so an analyst reading a source tree that patches
# code pages can tell a vendored test harness from an implant without opening
# the header. It is vendored under 3rdparty/ in a great many Qt/C++ projects
# (the Deepin and UOS desktop stack ships it in nearly every component), so the
# identity is worth carrying across samples.
defaults:
  platforms: [linux, windows, macos]
  for: [c, cpp]
  crit: notable
  conf: 0.97

traits:
  # `#define ADDR(CLASS_NAME,MEMBER_NAME) (&CLASS_NAME::MEMBER_NAME)` — the
  # member-pointer helper callers use to name the function being stubbed.
  - id: stub-addr-member-macro
    desc: cpp-stub ADDR member-pointer macro
    crit: component
    if:
      type: text
      regex: 'define\s+ADDR\s*\(\s*CLASS_NAME\s*,\s*MEMBER_NAME\s*\)'

  # The two jump-emitting macros, one per branch distance, defined once per
  # supported architecture.
  - id: stub-replace-jump-macros
    desc: cpp-stub REPLACE_FAR/NEAR jump macros
    crit: component
    if:
      type: text
      regex: 'REPLACE_(FAR|NEAR)\s*\(\s*t\s*,\s*fn\s*,\s*fn_stub\s*\)'

  # The per-stub bookkeeping record holding the patched address and the saved
  # original bytes.
  - id: stub-func-record-struct
    desc: cpp-stub func_stub record struct
    crit: component
    if:
      type: text
      regex: 'struct\s+func_stub\b'

composite_rules:
  - id: cpp-stub-library
    desc: cpp-stub function stubbing library
    crit: notable
    conf: 0.98
    any:
      - id: stub-addr-member-macro
      - id: stub-replace-jump-macros
      - id: stub-func-record-struct
    needs: 2
