# google.golang.org/genproto/googleapis/api — generated Go types for Google API
# protobuf annotations (HTTP rules, field behavior, CEL expr conformance, etc.).
defaults:
  platforms: [unix, windows]
  for: [go, text, zip]
  crit: notable
  conf: 0.98

traits:
  - id: archive-path
    desc: genproto googleapis api archive path
    if:
      type: path
      regex: 'genproto/googleapis/api@'

  - id: module-import
    desc: genproto googleapis api import path
    for: [go]
    if:
      type: import
      substr: google.golang.org/genproto/googleapis/api

composite_rules:
  - id: google-genproto-api-library
    desc: Google genproto googleapis api module
    any:
      - id: archive-path
      - id: module-import
