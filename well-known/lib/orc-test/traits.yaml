# ORC's test support shared library.  The SONAME identifies the test helper;
# the exported orc_test_* API confirms it is not an arbitrary library that
# merely mentions ORC in a string.
defaults:
  platforms: [linux]
  for: [elf]
  size_min: 8192
  size_max: 10485760

traits:
  - id: orc-test-soname
    desc: ORC test helper shared-library SONAME
    crit: notable
    conf: 0.99
    if:
      type: value
      path: elf.soname
      exact: liborc-test-0.4.so.0

  - id: orc-test-exported-api
    desc: ORC test helper exported API
    crit: notable
    conf: 0.99
    count_min: 3
    if:
      type: export
      substr: orc_test_

composite_rules:
  - id: orc-test-helper
    desc: ORC compiler test helper library
    crit: notable
    conf: 1.0
    all:
      - id: orc-test-soname
      - id: orc-test-exported-api
