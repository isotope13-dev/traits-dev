# github.com/rabbitmq/amqp091-go — RabbitMQ AMQP 0-9-1 client for Go.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: rabbitmq amqp091-go module archive path
    if:
      type: path
      regex: 'rabbitmq/amqp091-go@'

  - id: module-import
    desc: rabbitmq amqp091-go import path
    for: [go]
    if:
      type: import
      substr: github.com/rabbitmq/amqp091-go

composite_rules:
  - id: amqp091-go-library
    desc: RabbitMQ AMQP 0-9-1 Go client library
    any:
      - id: archive-path
      - id: module-import
