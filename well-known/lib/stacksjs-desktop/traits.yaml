# @stacksjs/desktop is the native desktop framework for Stacks STX,
# powered by Craft. Documented auto-launch and LaunchAgent support are
# legitimate cross-platform desktop application behavior.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, archives]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Stacks desktop npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stacksjs/desktop'

  - id: craft-native-dependency
    desc: craft-native desktop runtime dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.craft-native
      exists: true

  - id: auto-launch-api-marker
    desc: Stacks desktop auto-launch API marker
    for: [javascript, typescript]
    if:
      type: text
      substr: setAutoLaunchLinux

composite_rules:
  - id: package-context
    desc: Recognized Stacks desktop framework package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: well-known/lib/stacksjs-stx::stx-repository

  - id: bundle-context
    desc: Recognized Stacks desktop framework bundle
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: auto-launch-api-marker
      - id: craft-native-dependency
