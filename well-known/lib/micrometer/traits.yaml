# Micrometer Core is a legitimate application-observability library. Its
# optional HTTP, reflection, and JVM-management integrations are ordinary
# instrumentation surfaces, not malware behavior.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: micrometer-core-jar
    desc: Micrometer Core JAR identity
    for: [jar]
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: micrometer-core

  - id: micrometer-core-namespace
    desc: Micrometer Core class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^io/micrometer/core/'
