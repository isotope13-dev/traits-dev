# Electron Builder's normal publishing helper resolves cloud credentials to
# sign uploads; that is release infrastructure, not credential harvesting.
defaults:
  platforms: [windows, unix]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: electron-publish npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: electron-publish

  - id: repository-url
    desc: Electron Builder upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/electron-userland/electron-builder'

  - id: aws-credential-provider
    desc: Electron publish AWS credential provider
    for: [javascript, typescript]
    if:
      type: text
      word: resolveAwsCredentials

  - id: bitbucket-publisher
    desc: Electron publish Bitbucket publisher
    for: [javascript, typescript]
    if:
      type: text
      word: BitbucketPublisher

  - id: gitlab-publisher
    desc: Electron publish GitLab publisher
    for: [javascript, typescript]
    if:
      type: text
      word: GitlabPublisher

composite_rules:
  - id: library-context
    desc: Recognized electron-publish package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: repository-url
