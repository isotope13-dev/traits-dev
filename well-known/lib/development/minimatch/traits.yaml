# isaacs/minimatch — glob matcher for JavaScript.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: minimatch-package-name
    desc: minimatch package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: minimatch

  - id: minimatch-package-path
    desc: minimatch package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])minimatch([/\\]|$)'

  - id: minimatch-globstar-symbol
    desc: minimatch globstar Symbol label
    for: [javascript]
    conf: 0.99
    if:
      type: literal
      exact: globstar **
