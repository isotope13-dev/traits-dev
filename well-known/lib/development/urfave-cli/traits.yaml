# urfave/cli — popular Go command-line application framework.
defaults:
  platforms: [unix, windows]
  for: [go, archives, zip, powershell, shell]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: urfave/cli Go module path
    for: [go]
    if:
      type: text
      substr: github.com/urfave/cli

  - id: archive-module-path
    desc: urfave/cli module archive path
    if:
      type: path
      regex: 'urfave/cli/v[0-9]@'

  - id: bash-completion-flag
    desc: urfave/cli bash completion generator flag
    for: [go, shell, powershell]
    if:
      type: text
      substr: --generate-bash-completion

composite_rules:
  - id: urfave-cli-framework-context
    desc: urfave/cli Go CLI framework source
    crit: exception
    conf: 0.99
    any:
      - id: module-path
      - id: archive-module-path
      - id: bash-completion-flag
