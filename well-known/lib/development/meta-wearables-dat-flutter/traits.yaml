# meta_wearables_dat_flutter — unofficial Flutter plugin for Meta's
# Wearables Device Access Toolkit. Foreground-service streaming, BLE,
# and install-skills.sh curl|tar are the product SDK path, not C2.
defaults:
  platforms: [unix, windows, android]
  for: [kotlin, swift, tar, archives, text, javascript, shell, markdown]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pub-name
    desc: meta_wearables_dat_flutter pub.dev name
    for: [text]
    conf: 0.99
    if:
      type: text
      regex: '(?m)^name:\s*meta_wearables_dat_flutter\s*$'

  - id: pub-dev-url
    desc: meta_wearables_dat_flutter pub.dev URL
    for: [markdown, text]
    conf: 0.98
    if:
      type: text
      substr: pub.dev/packages/meta_wearables_dat_flutter

  - id: method-channel
    desc: meta_wearables_dat_flutter method channel
    for: [kotlin, javascript, text]
    conf: 0.98
    if:
      type: text
      regex: '[''"]meta_wearables_dat_flutter[''"]'

  - id: android-package
    desc: iseelabs Meta DAT Android package
    for: [kotlin, text]
    conf: 0.98
    if:
      type: text
      substr: com.iseelabs.meta_wearables_dat_flutter

  - id: github-repo
    desc: iSee-Labs meta-wearables DAT GitHub repo
    for: [shell, markdown, text, tar, archives]
    conf: 0.97
    if:
      type: text
      substr: iSee-Labs/meta-wearables-dat-flutter

  - id: source-path
    desc: meta_wearables_dat_flutter source path
    conf: 0.97
    if:
      type: path
      regex: '(?i)(^|[\\/])meta_wearables_dat_flutter([\\/-]|$)'
