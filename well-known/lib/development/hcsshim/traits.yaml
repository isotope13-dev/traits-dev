# github.com/Microsoft/hcsshim — Windows container shim for containerd.
defaults:
  platforms: [unix, windows]
  for: [go, archives, zip, powershell, shell]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: hcsshim Go module path
    for: [go]
    if:
      type: text
      substr: github.com/Microsoft/hcsshim

  - id: archive-module-path
    desc: hcsshim module archive path
    if:
      type: path
      regex: '[/\\]Microsoft[/\\]hcsshim@v[0-9]'

  - id: runhcs-shim-marker
    desc: containerd runhcs shim package path
    for: [go]
    if:
      type: text
      substr: containerd-shim-runhcs
