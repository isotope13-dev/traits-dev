# Official electron-builder app-builder-lib package context.  This identity
# lets build-time file operations and signing credentials be distinguished from
# supply-chain tampering and credential harvesting.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: electron-builder app-builder-lib package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: app-builder-lib

  - id: repository-url
    desc: Electron Builder upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/electron-userland/electron-builder'

composite_rules:
  - id: library-context
    desc: Recognized electron-builder app-builder-lib package context
    crit: exception
    scope: archive
    all:
      - id: package-name
      - id: repository-url
