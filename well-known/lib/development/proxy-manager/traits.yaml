defaults:
  platforms: [unix, windows]
  for: [php]
  crit: component
  conf: 0.99
  size_max: 5000000

traits:
  - id: proxy-manager-generator-namespace
    desc: ProxyManager generator namespace marker
    if:
      type: text
      regex: 'namespace\s+(ProxyManager\\GeneratorStrategy|.{0,80}\\ProxyManager\\GeneratorStrategy)\s*;'
  - id: proxy-manager-evaluating-class
    desc: ProxyManager evaluating strategy class marker
    if:
      type: text
      regex: '\bclass\s+EvaluatingGeneratorStrategy\b'

composite_rules:
  - id: proxy-manager-evaluating-strategy-source
    desc: ProxyManager generated-code evaluator source
    crit: notable
    conf: 0.99
    all:
      - id: proxy-manager-generator-namespace
      - id: proxy-manager-evaluating-class
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
    near_lines: 80
