# microsoft vscode-css-languageservice — CSS language server.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: vscode-css-languageservice package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vscode-css-languageservice

  - id: vendored-path
    desc: vendored vscode-css-languageservice path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/vscode-css-languageservice/'
