# GitPython -- the Python Git library, which installs as the `git` package.
# Naming a library is identity, which TAXONOMY places at notable; that a
# project can still vendor its own top-level `git` module is what the
# lowered `conf:` expresses. The match is anchored to the statement start
# so `from other.pkg import git` (a foreign submodule, e.g. flake8's own
# git-hook helper) and prose such as "output from git" do not match.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.7
traits:
  - id: git-module-import
    desc: GitPython module import
    if:
      type: text
      regex: '(?m)^\s*(import\s+git\b|from\s+git[\s.])'
