# GitPython -- the Python Git library, which installs as the `git` package.
# Naming a library is identity, which TAXONOMY places at notable; that the
# module name is short enough to collide with a local `git.py` is what the
# lowered `conf:` expresses.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.7
traits:
  - id: git-module-import
    desc: GitPython module import
    if:
      type: text
      regex: \b(from|import)\s+git\b
