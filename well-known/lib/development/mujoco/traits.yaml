# MuJoCo's native Python bindings are identified by MuJoCo-specific symbols.
# A generic pybind11/Python version diagnostic is kept in the Python runtime
# library taxonomy and only becomes MuJoCo evidence when paired with one of
# those symbols.
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.99
  size_min: 512
  size_max: 500000000

traits:
  - id: mujoco-python-native-symbol
    desc: MuJoCo Python native binding symbol
    if:
      type: text
      substr: mujoco6python
      section: '__TEXT,__const'

  - id: mujoco-python-error-symbol
    desc: MuJoCo Python error symbol
    if:
      type: text
      substr: __MUJOCO_ERROR_
      section: '__TEXT,__cstring'

composite_rules:
  - id: mujoco-python-native-identity
    desc: MuJoCo Python native identity
    crit: notable
    conf: 0.99
    any:
      - id: mujoco-python-native-symbol
      - id: mujoco-python-error-symbol

  - id: mujoco-python-binding-diagnostic
    desc: MuJoCo Python binding version-mismatch diagnostic
    crit: notable
    conf: 0.99
    all:
      - id: mujoco-python-native-identity
      - id: metadata/library/python-runtime::python-native-binding-version-mismatch-diagnostic
