# Before pip, every Python project that wanted setuptools shipped the
# zc.buildout `bootstrap.py` boilerplate, whose whole job is
# `exec(urlopen("http://peak.telecommunity.com/dist/ez_setup.py").read())`.
# It is download-and-execute over cleartext HTTP, and it is also public,
# unchanged-since-2006 build tooling copied verbatim into thousands of
# packages -- Breezy still carries it as tools/win32/bootstrap.py. The
# canonical host and filename are what separate it from a dropper stage.
defaults:
  platforms: [unix, windows]
  for: [python, source]
  crit: notable
  conf: 0.98
  size_min: 200
  size_max: 200000

traits:
  - id: ez-setup-bootstrap-url
    desc: Canonical ez_setup bootstrap URL
    if:
      type: text
      regex: '(peak\.telecommunity\.com/dist|bootstrap\.pypa\.io)/ez_setup\.py'
