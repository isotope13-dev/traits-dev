# ClassGraph — classpath/module scanner (io.github.classgraph).
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: classgraph-this-class
    desc: ClassGraph this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^(io/github/classgraph/|nonapi/io/github/classgraph/)'
