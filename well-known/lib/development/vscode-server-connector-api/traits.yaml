# vscode-server-connector-api — RSP client API.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: vscode-server-connector-api npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vscode-server-connector-api
  - id: vendored-path
    desc: vendored RSP connector API path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/vscode-server-connector-api/'

composite_rules:
  - id: vscode-server-connector-api-library
    desc: RSP connector API package
    any:
      - id: package-name
      - id: vendored-path
