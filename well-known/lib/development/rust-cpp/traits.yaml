# The `cpp` crate embeds C++ inside Rust. Its proc-macro half, `cpp_macros`,
# has to run a helper at expansion time: the build script compiles a
# `print_sizes` executable and the macro executes it to learn the sizes and
# alignments of the C++ types being bridged. That is compile-time process
# execution by design, on a binary the same crate just built -- not a payload
# fetched from anywhere.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 10000000

traits:
  - id: cpp-macros-crate-manifest
    desc: cpp_macros crate manifest name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^cpp(_macros|_build)?$'

  - id: cpp-macros-print-sizes-helper
    desc: cpp_macros print_sizes size helper
    for: [rust]
    if:
      type: text
      substr: print_sizes
