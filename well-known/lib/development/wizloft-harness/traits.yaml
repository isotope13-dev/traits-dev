# @wizloft/harness* — typed capability / evidence SDK (nic269/wizloft-harness).
# Clean 0.1.0-alpha.2 packages are small TypeScript facades with no install
# hooks and no network. OSV MAL-2026-14285/14286/14289 flag 0.1.1-alpha.3,
# which appends an obfuscator.io EtherHiding loader to dist/index.js.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.95

traits:
  - id: harness-facade-package-name
    desc: "@wizloft/harness npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@wizloft/harness"

  - id: harness-context-package-name
    desc: "@wizloft/harness-context npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@wizloft/harness-context"

  - id: harness-validation-package-name
    desc: "@wizloft/harness-validation npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@wizloft/harness-validation"

  - id: harness-upstream-repository
    desc: wizloft-harness GitHub upstream repository
    if:
      type: text
      substr: github.com/nic269/wizloft-harness

  - id: harness-runtime-factory
    desc: createHarnessRuntime factory export
    for: [javascript]
    if:
      type: text
      substr: createHarnessRuntime

  - id: context-capability-id-literal
    desc: CONTEXT_CAPABILITY_ID literal
    for: [javascript]
    if:
      type: text
      substr: CONTEXT_CAPABILITY_ID

  - id: validation-capability-id-literal
    desc: VALIDATION_CAPABILITY_ID literal
    for: [javascript]
    if:
      type: text
      substr: VALIDATION_CAPABILITY_ID

composite_rules:
  - id: harness-facade-identity
    desc: "@wizloft/harness SDK facade identity"
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: harness-facade-package-name
      - id: harness-upstream-repository
      - id: harness-runtime-factory

  - id: harness-context-identity
    desc: "@wizloft/harness-context package identity"
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: harness-context-package-name
      - id: harness-upstream-repository
      - id: context-capability-id-literal

  - id: harness-validation-identity
    desc: "@wizloft/harness-validation package identity"
    crit: notable
    conf: 0.98
    scope: outer
    all:
      - id: harness-validation-package-name
      - id: harness-upstream-repository
      - id: validation-capability-id-literal
