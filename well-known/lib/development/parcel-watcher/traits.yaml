# @parcel/watcher — native filesystem watcher prebuilds bundled in JS tooling.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, package.json, javascript, archives]
  crit: notable
  conf: 0.98

traits:
  - id: parcel-watcher-pdb-path
    desc: Parcel watcher CI PDB build path
    for: [pe, dll]
    size_min: 200000
    size_max: 600000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\watcher\\watcher\\build\\Release\\watcher\.pdb$'

  - id: parcel-watcher-package-scope
    desc: Parcel watcher npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@parcel/watcher'

  - id: parcel-watcher-platform-package
    desc: Parcel watcher platform-specific npm package
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@parcel/watcher-'

  - id: parcel-watcher-node-basename
    desc: Parcel watcher native module basename
    for: [pe, dll]
    size_min: 200000
    size_max: 600000
    if:
      type: path
      regex: '(?i)watcher\.node$'

composite_rules:
  - id: parcel-watcher-native-binary
    desc: Parcel watcher prebuilt native module
    crit: exception
    conf: 0.99
    for: [pe, dll]
    size_min: 200000
    size_max: 600000
    all:
      - id: parcel-watcher-node-basename
      - id: parcel-watcher-pdb-path
