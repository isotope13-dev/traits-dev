# Jiti runtime TypeScript/ESM loader and its maintained virtual-module fork.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Jiti runtime loader package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@mariozechner/)?jiti$'

  - id: package-member-path
    desc: Jiti runtime loader package member
    for: [javascript, typescript]
    if:
      type: path
      regex: '(^|[\\/])jiti[\\/]'
