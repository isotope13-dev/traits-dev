# sveltejs/esrap — print ESTree as JavaScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: esrap npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: esrap

  - id: vendored-path
    desc: vendored esrap package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/esrap/'
