# chaijs/type-detect — improved typeof helper used by Chai.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: type-detect npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: type-detect

  - id: github-repository
    desc: type-detect GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/chaijs/type-detect'
