defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.98

traits:
  - id: jasmine-module-namespace
    desc: Jasmine Ruby module namespace
    if:
      type: text
      regex: '(?m)^module Jasmine\b'

  - id: jasmine-gem-name
    desc: Jasmine gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: jasmine

  - id: jasmine-headless-runner-path
    desc: Jasmine headless browser runner source path
    if:
      type: path
      regex: 'jasmine/runners/chrome_headless\.rb$'

composite_rules:
  - id: jasmine-source-context
    desc: Jasmine JavaScript test framework source
    crit: notable
    conf: 0.99
    any:
      - id: jasmine-module-namespace
      - id: jasmine-gem-name
      - id: jasmine-headless-runner-path
