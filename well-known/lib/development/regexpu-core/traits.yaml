# regexpu-core — rewrite ES2015 Unicode regexps.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: regexpu-core npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'regexpu-core'

  - id: vendored-path
    desc: vendored regexpu-core package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/regexpu-core/'

composite_rules:
  - id: library
    desc: regexpu-core library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
