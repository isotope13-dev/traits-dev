# babel-plugin-polyfill-corejs2 — core-js2 polyfills.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: babel-plugin-polyfill-corejs2 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'babel-plugin-polyfill-corejs2'

  - id: vendored-path
    desc: vendored corejs2 polyfill-plugin path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/babel-plugin-polyfill-corejs2/'
  - id: corejs2-builtins
    desc: corejs2 built-ins compat import
    if:
      type: text
      substr: '@babel/compat-data/corejs2-built-ins'

composite_rules:
  - id: library
    desc: babel-plugin-polyfill-corejs2 library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: corejs2-builtins
