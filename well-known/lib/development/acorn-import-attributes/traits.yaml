# acorn-import-attributes — import-attributes plugin for acorn.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: acorn-import-attributes package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: acorn-import-attributes

  - id: vendored-path
    desc: acorn-import-attributes package path
    if:
      type: path
      regex: '(^|[\\/])acorn-import-attributes([\\/]|$)'
