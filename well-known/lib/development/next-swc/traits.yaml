defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Next.js ships its Rust SWC/Turbopack compiler as a Node-API addon. The
  # stable PDB identity survives release builds and distinguishes the compiler
  # from applications that merely contain JavaScript DOM or Bun API names.
  - id: next-swc-native-compiler-pdb
    desc: Next.js SWC native compiler PDB
    crit: notable
    conf: 0.99
    size_min: 1048576
    if:
      type: value
      path: pe.debug.pdb.basename
      # Older Next.js releases used next_swc.pdb; current releases use the
      # next_napi_bindings name for the same native compiler component.
      regex: '(?i)^next_(swc|napi_bindings)\.pdb$'
