# Official Babel compiler packages (@babel/*).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: scoped-package-name
    desc: Babel scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@babel/'

  - id: monorepo-url
    desc: Babel monorepo GitHub URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/babel/babel'

  - id: vendored-path
    desc: Babel scoped package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@babel/'

  - id: mckenzie-copyright
    desc: Sebastian McKenzie Babel copyright line
    for: [text]
    if:
      type: text
      substr: Copyright (c) 2014-present Sebastian McKenzie

  - id: regenerator-facebook-copyright
    desc: Facebook regenerator helper copyright
    for: [text]
    if:
      type: text
      substr: 'ONLY ./src/helpers/regenerator'

  - id: standalone-umd-global
    desc: Babel standalone UMD global export
    for: [javascript]
    if:
      type: text
      # babel-standalone assigns its compiler API to the `Babel` global via
      # a UMD wrapper. The bundle is multi-megabyte generated compiler and
      # parser tables, which legitimately nest past static-analysis bounds.
      substr: 'exports.Babel='

  - id: runtime-set-helper
    desc: Babel runtime set-property helper source
    for: [javascript]
    if:
      type: literal
      # The error thrown only by @babel/runtime's `_set` helper; helpers are
      # verbatim-copied into bundles, so the literal survives minification and
      # identifies the vendored helper even with no @babel path or manifest.
      exact: failed to set property

  - id: types-relative-validators-import
    desc: Babel types relative validators import
    for: [javascript]
    if:
      type: text
      # The compiled @babel/types layout reaches its validators through the
      # package's src/ tree; combined with the validator package import below
      # this identifies babel-types converter/validator modules shipped
      # without any @babel path or manifest.
      regex: 'require\("\.\./validators/(isValidIdentifier|generated/index)\.js"\)'

composite_rules:
  - id: babel-official-package
    desc: Official Babel compiler package
    any:
      - id: scoped-package-name
      - id: monorepo-url
      - id: vendored-path

  - id: types-converter-module
    desc: Babel types converter module layout
    for: [javascript]
    conf: 0.9
    all:
      - id: metadata/import/npm/babel/helper-validator-identifier
      - id: types-relative-validators-import

  - id: babel-license-identity
    desc: Recognized Babel MIT license
    for: [text]
    all:
      - id: mckenzie-copyright
      - id: regenerator-facebook-copyright
      - id: metadata/package/license::mit-license-grant-text
