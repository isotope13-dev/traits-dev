# Official Babel compiler packages (@babel/*).
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: scoped-package-name
    desc: Babel scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@babel/'

  - id: monorepo-url
    desc: Babel monorepo GitHub URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/babel/babel'

  - id: vendored-path
    desc: Babel scoped package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@babel/'

  - id: mckenzie-copyright
    desc: Sebastian McKenzie Babel copyright line
    for: [text]
    if:
      type: text
      substr: Copyright (c) 2014-present Sebastian McKenzie

  - id: regenerator-facebook-copyright
    desc: Facebook regenerator helper copyright
    for: [text]
    if:
      type: text
      substr: 'ONLY ./src/helpers/regenerator'

composite_rules:
  - id: babel-official-package
    desc: Official Babel compiler package
    any:
      - id: scoped-package-name
      - id: monorepo-url
      - id: vendored-path

  - id: babel-license-identity
    desc: Recognized Babel MIT license
    for: [text]
    all:
      - id: mckenzie-copyright
      - id: regenerator-facebook-copyright
      - id: metadata/package/license::mit-license-grant-text
