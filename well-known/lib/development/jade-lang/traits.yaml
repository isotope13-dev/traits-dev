# jade-lang — Jade template language Ruby gem (compiled to Ruby/JS).
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: jade-module-marker
    desc: Jade Ruby module marker
    for: [ruby]
    if:
      type: text
      regex: '\bmodule\s+Jade\b'

  - id: jade-codegen-path
    desc: Jade codegen tree path
    for: [ruby]
    if:
      type: path
      regex: 'jade/codegen'

  - id: jade-lang-gem-name
    desc: jade-lang Ruby gem name
    for: [gem]
    if:
      type: value
      path: name
      exact: jade-lang

composite_rules:
  - id: jade-template-engine-context
    desc: jade-lang template compiler Ruby gem
    crit: exception
    conf: 0.99
    any:
      - id: jade-module-marker
      - id: jade-codegen-path
      - id: jade-lang-gem-name
