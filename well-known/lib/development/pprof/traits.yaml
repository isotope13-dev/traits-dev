# google/pprof is a benign Go profiling and symbolization tool. Its module
# source archives intentionally include platform-specific symbolization
# fixtures, including malformed object files used to test parser handling.
defaults:
  platforms: [unix, windows]
  for: [zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-archive
    desc: google/pprof Go module source archive
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/google/pprof@[^/]+/go\.mod$'

  - id: binutils-test-fixture-member
    desc: google/pprof binutils test fixture member
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/google/pprof@[^/]+/internal/binutils/testdata/'
