# google/pprof is a benign Go profiling and symbolization tool. Its module
# source archives intentionally include platform-specific symbolization
# fixtures, including malformed object files used to test parser handling.
defaults:
  platforms: [unix, windows]
  for: [zip, go_module]
  crit: notable
  conf: 0.99

traits:
  - id: source-archive
    desc: google/pprof Go module source archive
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/google/pprof@[^/]+/go\.mod$'

  - id: binutils-test-fixture-member
    desc: google/pprof binutils test fixture member
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/google/pprof@[^/]+/internal/binutils/testdata/'

  - id: pprof-google-copyright
    desc: google/pprof Google copyright header
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      substr: "Google Inc. All Rights Reserved."

  - id: pprof-elfexec-package
    desc: google/pprof elfexec package declaration
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '(?m)^package elfexec\b'

composite_rules:
  - id: pprof-elfexec-source
    desc: google/pprof elfexec source
    crit: notable
    conf: 0.98
    for: [go]
    all:
      - id: pprof-google-copyright
      - id: pprof-elfexec-package
