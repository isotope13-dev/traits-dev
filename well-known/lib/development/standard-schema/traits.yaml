# @standard-schema/spec — Standard Schema TypeScript interfaces.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Standard Schema spec package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@standard-schema/spec'

  - id: homepage
    desc: Standard Schema project homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://standardschema.dev

  - id: vendored-path
    desc: Standard Schema spec package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@standard-schema/spec'

composite_rules:
  - id: standard-schema-spec
    desc: Standard Schema TypeScript spec
    any:
      - id: package-name
      - id: homepage
      - id: vendored-path
