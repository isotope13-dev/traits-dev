# browser_cookie3 (browser-cookie3 on PyPI) loads the user's own browser
# cookies into a cookiejar for urllib, requests, and similar clients.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: package-docstring
    desc: browser_cookie3 package docstring
    if:
      type: text
      substr: Load browser cookies into a cookiejar

  - id: chromium-default-password
    desc: Chromium default cookie key constant
    if:
      type: text
      substr: "CHROMIUM_DEFAULT_PASSWORD = b'peanuts'"

  - id: setup-package-name
    desc: browser-cookie3 setuptools name
    if:
      type: text
      substr: "name='browser-cookie3'"

  - id: github-url
    desc: browser_cookie3 upstream repository
    if:
      type: text
      substr: github.com/borisbabic/browser_cookie3

  - id: firefox-profile-tar-xz-b64-fixture
    desc: Firefox profile tar.xz base64 test fixture
    if:
      type: text
      substr: FIREFOX_BASED_PROFILE_DIR_TAR_XZ_B64

  - id: firefox-profile-fixture-directory
    desc: Firefox profile fixture directory name
    if:
      type: text
      substr: 4xutesqi.default-release

composite_rules:
  - id: browser-cookie3-library-context
    desc: browser_cookie3 library source context
    crit: exception
    conf: 0.99
    all:
      - id: package-docstring
    any:
      - id: chromium-default-password
      - id: github-url

  - id: browser-cookie3-package-archive
    desc: browser_cookie3 distribution archive
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, archives]
    all:
      - id: setup-package-name
      - id: package-docstring

  - id: browser-cookie3-test-fixture-context
    desc: browser_cookie3 integration test fixture context
    crit: exception
    conf: 0.99
    scope: outer
    for: [python, archives, tar, tar.gz, python-sdist]
    all:
      - id: firefox-profile-tar-xz-b64-fixture
      - id: firefox-profile-fixture-directory
