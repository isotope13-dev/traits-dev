# piccolore is a legitimate JavaScript color utility. Its presence identifies
# the library; attacker intent requires separate package/campaign context.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: dependency
    desc: Declares piccolore color utility dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.piccolore
      exists: true

  - id: import
    desc: Imports piccolore color utility package
    for: [javascript, typescript]
    if:
      type: import
      exact: piccolore

composite_rules:
  - id: package-reference
    desc: References piccolore color utility package
    for: [package.json, javascript, typescript, archives]
    any:
      - id: dependency
      - id: import
