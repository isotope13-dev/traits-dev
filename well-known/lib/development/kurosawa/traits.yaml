# org.purefn/kurosawa.core — PureFn Clojure config/error/k8s utilities.
# eval of aws.s3/fetch is an optional classpath require, not a loader.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text, xml]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: kurosawa.core Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: kurosawa.core

  - id: pom-group
    desc: org.purefn Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: org.purefn

  - id: github-repo
    desc: PureFnOrg kurosawa GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/PureFnOrg/kurosawa

  - id: namespace-path
    desc: kurosawa Clojure namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)org/purefn/kurosawa'
