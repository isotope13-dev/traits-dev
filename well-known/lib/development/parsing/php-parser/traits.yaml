defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: composer-package
    desc: nikic PHP-Parser Composer package
    for: [composer.json]
    if:
      type: value
      path: name
      exact: nikic/php-parser

  # PHP-Parser 4's legacy corpus stores source and its expected AST or
  # pretty-printed source in one .test file. The anchored separator/version
  # sequence identifies that format without trusting a caller-controlled test
  # filename or directory.
  - id: legacy-test-expected-output
    desc: PHP-Parser legacy expected-output fixture
    for: [php]
    if:
      type: text
      regex: '(?m)^-----\r?$\n!!php[57]\r?$'
