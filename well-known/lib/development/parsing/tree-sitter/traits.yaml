defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, so, dylib, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 8388608
traits:
  - id: tree-sitter-grammar-library
    desc: Tree-sitter parser grammar library
    size_max: 268435456
    if:
      type: symbol
      kind: export
      regex: '^_?tree_sitter_[a-z0-9_]+$'
  - id: tree-sitter-grammar-source
    desc: Tree-sitter grammar DSL source
    for: [javascript, typescript]
    size_min: 0
    size_max: 5000000
    if:
      type: text
      substr: 'module.exports = grammar('

  - id: tree-sitter-crate-source-path
    desc: Rust tree-sitter crate source path
    for: [pe, dll]
    size_min: 0
    size_max: 268435456
    crit: notable
    if:
      type: text
      regex: '(?i)tree-sitter-[0-9][^\\/]{0,30}[\\/]binding_rust[\\/]lib\.rs'
      section: .rdata
