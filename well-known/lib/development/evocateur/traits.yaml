defaults:
  for: [package.json, npm]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.99

traits:
  # Lerna maintainer Daniel Stockman (@evocateur) published maintained forks of
  # npm internal packages under the `@evocateur/*` namespace while retaining
  # repositories under the `evocateur` GitHub user account.
  - id: scoped-package-identity
    desc: evocateur scoped package identity
    if:
      type: value
      path: name
      regex: '^@evocateur/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: evocateur GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/evocateur/[a-z0-9._-]+(\.git)?$'

  - id: github-repository-url
    desc: evocateur GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/evocateur/[a-z0-9._-]+(\.git)?$'

composite_rules:
  - id: official-scope-repository-pair
    desc: Official evocateur package repository pairing
    crit: exception
    all:
      - id: scoped-package-identity
    any:
      - id: github-repository-string
      - id: github-repository-url
