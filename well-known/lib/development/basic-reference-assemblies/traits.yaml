defaults:
  for: [pe]
  platforms: [windows]
  crit: notable

traits:
  - id: product-name
    desc: Basic Reference Assemblies product name
    if:
      type: value
      path: pe.version.product_name
      substr: Basic.Reference.Assemblies

  - id: roslyn-reference-info
    desc: Roslyn reference assembly API names
    if:
      type: text
      substr: Microsoft.CodeAnalysis

  - id: framework-resource-names
    desc: Framework assembly resource names
    if:
      type: text
      substr: net35.Microsoft.Build.Tasks

composite_rules:
  - id: framework-bundle
    desc: Basic Reference Assemblies framework resource bundle
    all:
      - id: product-name
      - id: roslyn-reference-info
      - id: framework-resource-names
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
