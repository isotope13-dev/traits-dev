# tauri-macros — proc-macro crate from the official Tauri desktop framework.
defaults:
  platforms: [unix, windows]
  for: [rust, crate, cargo.toml, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: tauri-macros-crate-name
    desc: tauri-macros Rust crate name
    for: [crate, cargo.toml]
    if:
      type: value
      path: crate.name
      exact: tauri-macros

  - id: tauri-macros-crate-path
    desc: tauri-macros crate source path
    for: [rust]
    if:
      type: path
      regex: 'tauri-macros-[0-9]'

  - id: upstream-repository
    desc: Tauri upstream GitHub repository
    if:
      type: text
      substr: github.com/tauri-apps/tauri

  - id: tauri-codegen-reference
    desc: tauri-codegen macro dependency marker
    for: [rust, crate, cargo.toml]
    if:
      type: text
      substr: tauri-codegen

composite_rules:
  - id: tauri-macros-context
    desc: Official Tauri proc-macro crate context
    crit: exception
    conf: 0.99
    any:
      - id: tauri-macros-crate-name
      - id: tauri-macros-crate-path
      - id: upstream-repository
