# Testing Library — DOM and React testing utilities.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: package-scope-reference
    desc: References Testing Library package scope
    if:
      type: literal
      substr: '@testing-library'

  - id: package-require
    desc: Requires a Testing Library package
    if:
      type: text
      substr: require('@testing-library

  - id: react-umd-bundle
    desc: Testing Library React UMD bundle
    conf: 0.98
    if:
      type: text
      substr: TestingLibraryReact

  - id: dom-umd-bundle
    desc: Testing Library DOM UMD bundle
    conf: 0.98
    if:
      type: text
      substr: TestingLibraryDom

  - id: react-dom-test-utils-dependency
    desc: Testing Library ReactDOM test-utils dependency
    conf: 0.98
    if:
      type: text
      substr: react-dom/test-utils
