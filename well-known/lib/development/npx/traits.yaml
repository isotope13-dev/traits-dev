defaults:
  conf: 1.0
  for: [package.json]
  platforms:
  - unix
  - windows
traits:
- id: libnpx-package-identity
  desc: Published libnpx package name
  crit: notable
  if:
    type: value
    path: name
    exact: libnpx
- id: libnpx-repository-identity
  desc: npm npx repository URL
  crit: notable
  if:
    type: value
    path: repository.url
    regex: github\.com/npm/npx(\.git)?$
