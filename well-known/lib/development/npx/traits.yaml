defaults:
  platforms: [unix, windows]

traits:
  - id: libnpx-package-identity
    desc: Published libnpx package name
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: name
      exact: libnpx
  - id: libnpx-repository-identity
    desc: npm npx repository URL
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/npm/npx(\.git)?$'

composite_rules:
  - id: libnpx-package-context
    desc: Recognized libnpx package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: libnpx-package-identity
      - id: libnpx-repository-identity
