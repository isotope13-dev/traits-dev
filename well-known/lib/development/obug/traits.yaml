# obug is a legitimate JavaScript debug utility. Its presence identifies the
# library; attacker intent requires separate package/campaign context.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: dependency
    desc: Declares obug debug utility dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.obug
      exists: true

  - id: import
    desc: Imports obug debug utility package
    for: [javascript, typescript]
    if:
      type: import
      exact: obug

composite_rules:
  - id: package-reference
    desc: References obug debug utility package
    for: [package.json, javascript, typescript, archives]
    any:
      - id: dependency
      - id: import
