# Janino — embedded Java compiler and its commons-compiler API.
defaults:
  platforms: [windows, unix]
  for: [class, jar, archives]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 200000000

traits:
  - id: compiler-package-path
    desc: Janino compiler package path
    if:
      type: path
      regex: 'codehaus[\\/]janino[\\/]'

  - id: commons-package-path
    desc: Janino commons-compiler package path
    if:
      type: path
      regex: 'commons[\\/]compiler[\\/]'

  - id: jar-name
    desc: Janino compiler JAR name
    for: [jar]
    if:
      type: basename
      regex: '^(janino|commons-compiler)-[0-9].*[.]jar$'

composite_rules:
  - id: janino-compiler-library
    desc: Janino embedded compiler library
    any:
      - id: compiler-package-path
      - id: commons-package-path
      - id: jar-name
