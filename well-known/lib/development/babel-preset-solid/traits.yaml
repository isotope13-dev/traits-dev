# solidjs babel-preset-solid — JSX transform for Solid.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: babel-preset-solid npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: babel-preset-solid

  - id: github-repository
    desc: babel-preset-solid GitHub path
    for: [package.json]
    if:
      type: value
      path: repository
      substr: github.com/solidjs/solid

  - id: vendored-path
    desc: vendored babel-preset-solid path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/babel-preset-solid/'

  - id: solid-web-module-name
    desc: Solid.js web JSX moduleName option
    if:
      type: text
      substr: 'moduleName: "solid-js/web"'

composite_rules:
  - id: babel-preset-solid-library
    desc: Solid.js Babel JSX preset
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: github-repository
      - id: solid-web-module-name
