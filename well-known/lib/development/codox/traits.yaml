# weavejester/codox — Clojure API documentation generator. Bundled
# jquery.min.js is the HTML writer template; Function/innerHTML/XHR are
# jQuery, and resolve of the writer var is plugin dispatch, not a loader.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: codox.core Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: codox.core

  - id: pom-group
    desc: codox Maven group id
    for: [jar, zip]
    conf: 0.97
    if:
      type: value
      path: jar.pom.group_id
      exact: codox

  - id: github-repo
    desc: weavejester codox GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/weavejester/codox

  - id: namespace-path
    desc: codox Clojure main namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)codox/main\.clj$'
