# Bundled TypeScript compiler standard-library trees ship inside
# language servers and editor extensions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: baseline
  conf: 0.98

traits:
  - id: bundled-lib-path
    desc: Bundled TypeScript compiler library path
    if:
      type: path
      regex: '(?i)typescript-lib[\\/]'

  - id: bundled-lib-directory-marker
    desc: Bundled TypeScript compiler library tree
    if:
      type: text
      substr: typescript-lib/

  - id: npm-lib-directory-marker
    desc: npm TypeScript compiler lib path
    if:
      type: text
      substr: typescript/lib/lib.

  - id: npm-stdlib-dts-path
    desc: TypeScript stdlib declaration path
    crit: notable
    for: [typescript]
    if:
      type: path
      regex: 'typescript[/\\]lib[/\\]lib\.'

  - id: no-default-lib-pragma
    desc: TypeScript no-default-lib reference
    crit: notable
    for: [typescript]
    if:
      type: text
      substr: '<reference no-default-lib="true"/>'

  - id: types-map-json-marker
    desc: TypeScript typesMap.json mapping file
    for: [json]
    if:
      type: text
      substr: '"typesMap":'

composite_rules:
  - id: typescript-compiler-lib-context
    desc: Bundled TypeScript compiler library identity
    crit: notable
    any:
      - id: bundled-lib-path
      - id: bundled-lib-directory-marker
      - id: npm-lib-directory-marker
      - id: npm-stdlib-dts-path
      - id: no-default-lib-pragma
      - id: types-map-json-marker
