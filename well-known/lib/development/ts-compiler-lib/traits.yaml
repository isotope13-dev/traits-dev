# Bundled TypeScript compiler standard-library trees ship inside
# language servers and editor extensions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: baseline
  conf: 0.98

traits:
  - id: bundled-lib-directory-marker
    desc: Bundled TypeScript compiler library tree
    if:
      type: text
      substr: typescript-lib/

  - id: npm-lib-directory-marker
    desc: npm TypeScript compiler lib path
    if:
      type: text
      substr: typescript/lib/lib.

  - id: types-map-json-marker
    desc: TypeScript typesMap.json mapping file
    for: [json]
    if:
      type: text
      substr: '"typesMap":'

composite_rules:
  - id: typescript-compiler-lib-context
    desc: Bundled TypeScript compiler library identity
    crit: notable
    any:
      - id: bundled-lib-directory-marker
      - id: npm-lib-directory-marker
      - id: types-map-json-marker
