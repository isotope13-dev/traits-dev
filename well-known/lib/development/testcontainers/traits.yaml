# Testcontainers — JVM integration-test container orchestration library.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, java]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: testcontainers-package-path
    desc: Testcontainers Java package path
    if:
      type: text
      substr: org/testcontainers/
