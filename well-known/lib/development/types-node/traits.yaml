# @types/node — DefinitelyTyped TypeScript stubs for Node.js APIs.
# child_process/fs/net declarations describe dual-use host APIs; identity
# only, do not treat the stubs as runtime exec.
defaults:
  platforms: [unix, windows]
  for: [package.json, typescript, javascript, json]
  crit: notable
  conf: 0.98
  size_min: 32
  size_max: 20000000

traits:
  - id: package-name
    desc: DefinitelyTyped Node types package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@types/node'

  - id: child-process-stub
    desc: Node child_process TypeScript stub path
    for: [typescript]
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])node[\\/]child_process\.d\.ts$'

  - id: types-description
    desc: TypeScript definitions for Node
    for: [package.json, json, text]
    conf: 0.97
    if:
      type: text
      substr: 'TypeScript definitions for node'
