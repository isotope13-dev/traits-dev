# cosmiconfig — find and load project config files.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cosmiconfig npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'cosmiconfig'

  - id: vendored-path
    desc: vendored cosmiconfig package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cosmiconfig/'

  - id: sync-export
    desc: cosmiconfigSync export
    if:
      type: text
      substr: 'exports.cosmiconfigSync'

composite_rules:
  - id: library
    desc: cosmiconfig config loader
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: sync-export
