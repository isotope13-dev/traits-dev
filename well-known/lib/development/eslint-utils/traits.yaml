# @eslint-community/eslint-utils — helpers for ESLint plugins.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: eslint-utils community package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@eslint-community/eslint-utils'

  - id: reference-tracker-read
    desc: eslint-utils ReferenceTracker.READ flag
    for: [javascript]
    if:
      type: text
      substr: 'ReferenceTracker.READ = READ'

  - id: vendored-path
    desc: eslint-utils vendored package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@eslint-community/eslint-utils'

composite_rules:
  - id: eslint-utils-library
    desc: ESLint community eslint-utils library
    any:
      - id: package-name
      - id: reference-tracker-read
      - id: vendored-path
