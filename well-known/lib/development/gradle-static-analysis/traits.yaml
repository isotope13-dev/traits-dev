# novoda/gradle-static-analysis-plugin — Gradle plugin that applies
# Checkstyle/PMD/SpotBugs/Detekt/Lint. Wrapper exec in gradlew is the
# standard launcher; evaluator.evaluate is a domain method, not GroovyShell.
defaults:
  platforms: [unix, windows]
  for: [groovy, markdown, archives, xml]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: github-repo
    desc: gradle-static-analysis-plugin GitHub repo
    conf: 0.99
    if:
      type: text
      substr: github.com/novoda/gradle-static-analysis-plugin

  - id: plugin-id
    desc: novoda static-analysis Gradle plugin id
    conf: 0.99
    if:
      type: text
      substr: com.novoda.static-analysis

  - id: groovy-package
    desc: novoda staticanalysis Groovy package
    for: [groovy]
    conf: 0.98
    if:
      type: text
      substr: com.novoda.staticanalysis

  - id: source-path
    desc: novoda staticanalysis source path
    conf: 0.96
    if:
      type: path
      regex: 'com/novoda/staticanalysis'
