defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  - pe
  - elf
  - dll
  - so
  - dylib
  crit: notable
  conf: 0.99
traits:
- id: rollup-platform-package-name
  desc: Rollup platform native binding package name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^@rollup/rollup-
- id: rollup-native-addon-basename
  desc: Rollup platform native addon basename
  size_min: 65536
  size_max: 50000000
  for:
  - pe
  - elf
  - dll
  - so
  - dylib
  if:
    type: basename
    regex: ^rollup\.[a-z0-9]+-
- id: upstream-repository
  desc: Rollup upstream GitHub repository
  for:
  - package.json
  if:
    type: text
    substr: github.com/rollup/rollup
- id: rollup-homepage
  desc: Rollup product homepage marker
  for:
  - package.json
  if:
    type: text
    substr: rollupjs.org
