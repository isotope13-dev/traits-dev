# Rollup — official JavaScript bundler platform native bindings (@rollup/rollup-*).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, pe, elf, dll, so, dylib]
  crit: notable
  conf: 0.99

traits:
  - id: rollup-platform-package-name
    desc: Rollup platform native binding package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      regex: '^@rollup/rollup-'

  - id: rollup-native-addon-basename
    desc: Rollup platform native addon basename
    size_min: 65536
    size_max: 50000000
    for: [pe, elf, dll, so, dylib]
    if:
      type: basename
      regex: '^rollup\.[a-z0-9]+-'

  - id: upstream-repository
    desc: Rollup upstream GitHub repository
    for: [package.json, npm]
    if:
      type: text
      substr: github.com/rollup/rollup

  - id: rollup-homepage
    desc: Rollup product homepage marker
    for: [package.json, npm]
    if:
      type: text
      substr: rollupjs.org

composite_rules:
  - id: rollup-native-binding-context
    desc: Rollup platform native binding package
    crit: exception
    conf: 0.99
    any:
      - id: rollup-platform-package-name
      - id: rollup-native-addon-basename
      - id: upstream-repository
      - id: rollup-homepage
