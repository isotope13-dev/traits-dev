# assertion-error — Chai-compatible AssertionError constructor.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: assertion-error-package-name
    desc: assertion-error npm package name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: assertion-error

  - id: assertion-error-github-repo
    desc: assertion-error GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/chaijs/assertion-error'
