# acornjs/acorn — ECMAScript parser used by Node and bundlers.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: acorn npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: acorn

  - id: issue-575-ref
    desc: acorn identifier-parsing GitHub issue reference
    for: [javascript]
    if:
      type: text
      substr: github.com/acornjs/acorn/issues/575

  - id: global-export
    desc: acorn UMD global export assignment
    for: [javascript]
    if:
      type: text
      substr: 'factory(global.acorn = {})'

composite_rules:
  - id: acorn-parser
    desc: acorn ECMAScript parser
    any:
      - id: issue-575-ref
      - id: global-export
      - id: package-name
