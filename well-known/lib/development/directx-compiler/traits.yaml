defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536

traits:
  - id: dxcompiler-basename
    desc: DirectX shader compiler runtime basename
    conf: 0.95
    if:
      type: path
      basename: true
      exact: dxcompiler.dll
      case_insensitive: true

  - id: directx-compiler-version
    desc: DirectX shader compiler version identity
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      regex: '(?i)DirectX Compiler'

composite_rules:
  - id: directx-shader-compiler-runtime
    desc: DirectX shader compiler runtime identity
    conf: 0.97
    all:
      - id: dxcompiler-basename
      - id: directx-compiler-version
