defaults:
  platforms: [windows, unix]
  for: [class, java_class]

traits:
  - id: antlr-build-tool-symbol
    desc: ANTLR build tool class symbol
    crit: notable
    conf: 0.99
    if:
      type: symbol
      exact: "class$antlr$build$Tool"

  - id: antlr-build-tool-class
    desc: ANTLR build tool class identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: class.this_class
      exact: "antlr/build/Tool"
