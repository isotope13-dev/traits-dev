# munge / munge_macro — Rust proc-macro crate for safe custom destructuring.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml]
  crit: notable
  conf: 0.99

traits:
  - id: munge-macro-crate-name
    desc: munge_macro Cargo.toml package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: munge_macro

  - id: munge-macro-source-path
    desc: munge_macro crate source tree path
    for: [rust]
    if:
      type: path
      regex: 'munge_macro-[0-9]'

  - id: upstream-repository
    desc: munge upstream GitHub repository
    if:
      type: text
      substr: github.com/djkoloski/munge
