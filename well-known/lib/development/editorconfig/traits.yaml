# editorconfig-core-js — EditorConfig file locator/interpreter.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: editorconfig-package-name
    desc: editorconfig package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: editorconfig

  - id: editorconfig-package-path
    desc: editorconfig package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])editorconfig[/\\]lib'
