# style-dictionary — design token build system (https://styledictionary.com).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package
    desc: style-dictionary npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: style-dictionary

  - id: archive-package-name
    desc: style-dictionary npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: style-dictionary

  - id: package-member-context
    desc: style-dictionary package member context
    for: [javascript, typescript, package.json]
    if:
      type: value
      path: package.json::name
      exact: style-dictionary

  - id: upstream-homepage
    desc: style-dictionary project homepage
    if:
      type: text
      substr: styledictionary.com

composite_rules:
  - id: style-dictionary-package-context
    desc: style-dictionary design token build system
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: npm-package
      - id: archive-package-name
      - id: package-member-context
      - id: upstream-homepage
