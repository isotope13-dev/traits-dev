# launch-editor — webpack/vue-cli editor launcher helper (guess.js).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: guess-editor-module-path
    desc: launch-editor guess.js module path
    if:
      type: path
      regex: '(?i)launch-editor[/\\\\]guess\.js$'

  - id: guess-editor-function-marker
    desc: launch-editor guessEditor function marker
    if:
      type: text
      substr: 'function guessEditor'

  - id: open-in-editor-client-request
    desc: launch-editor middleware endpoint request
    if:
      type: text
      substr: '__open-in-editor?file='

composite_rules:
  - id: launch-editor-guess-context
    desc: webpack launch-editor guess helper module
    crit: exception
    conf: 0.99
    any:
      - id: guess-editor-module-path
      - id: guess-editor-function-marker
