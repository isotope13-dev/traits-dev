# TeleportHQ code generators — @teleporthq/* packages from the
# teleporthq/teleport-code-generators monorepo.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: TeleportHQ scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@teleporthq/[a-z0-9][a-z0-9._-]{0,100}$'

  - id: scoped-npm-package-identity
    desc: TeleportHQ scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@teleporthq/[a-z0-9][a-z0-9._-]{0,100}$'

  - id: github-https-repository-url
    desc: TeleportHQ generators HTTPS GitHub URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]teleporthq/teleport-code-generators'

  - id: github-ssh-repository-url
    desc: TeleportHQ generators SSH GitHub URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: git+ssh://git@github.com/teleporthq/teleport-code-generators.git

  - id: github-npm-https-repository
    desc: TeleportHQ npm archive HTTPS repository
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]teleporthq/teleport-code-generators'

  - id: github-npm-ssh-repository
    desc: TeleportHQ npm archive SSH repository
    for: [npm]
    if:
      type: value
      path: npm.repository
      substr: git@github.com:teleporthq/teleport-code-generators

composite_rules:
  - id: official-package-scope
    desc: Official TeleportHQ scoped package
    crit: notable
    conf: 0.99
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official TeleportHQ code generators repository
    crit: exception
    any:
      - id: github-https-repository-url
      - id: github-ssh-repository-url
      - id: github-npm-https-repository
      - id: github-npm-ssh-repository

  - id: official-scope-repository-pair
    desc: Official TeleportHQ monorepo package pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
