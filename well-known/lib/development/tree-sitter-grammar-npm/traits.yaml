# tree-sitter grammar npm packages — monorepos with bindings/node native
# addons and per-language nested package.json stubs (php/, typescript/, etc.).
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: grammar-package-name
    desc: tree-sitter grammar npm package name
    if:
      type: value
      path: name
      regex: '^tree-sitter-[a-z][a-z0-9_-]*$'

  - id: github-tree-sitter-repository
    desc: github.com/tree-sitter grammar repository
    if:
      type: value
      path: repository
      regex: '(github\.com[/:]tree-sitter/tree-sitter-|tree-sitter\.git)'

composite_rules:
  - id: tree-sitter-grammar-npm-package
    desc: Tree-sitter grammar npm package
    any:
      - id: grammar-package-name
    all:
      - id: github-tree-sitter-repository
