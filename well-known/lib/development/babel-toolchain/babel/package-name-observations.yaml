defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - package.json
traits:
  - id: babel-cli-package
    desc: Babel CLI package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@babel/cli'
  - id: babel-core-package
    desc: Babel core package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@babel/core'
