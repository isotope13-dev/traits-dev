# babel-preset-env — Babel env preset and data.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: babel-preset-env npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'babel-preset-env'

  - id: vendored-path
    desc: vendored babel-preset-env package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/babel-preset-env/'

  - id: compat-data-plugins-import
    desc: babel compat-data plugins import
    for: [javascript]
    if:
      type: text
      # preset-env's target filtering (filter-items, targets-supported) loads
      # its plugin support data through this mandated companion package; the
      # require survives standalone dist files with no path or manifest.
      substr: 'require("@babel/compat-data/plugins")'

composite_rules:
  - id: library
    desc: babel-preset-env library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
