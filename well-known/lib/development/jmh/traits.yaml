# JMH (Java Microbenchmark Harness, org.openjdk.jmh) identity markers.
#
# JMH's whole job is to fork JVMs and run generated benchmark code, so its
# util/runner classes pair java.lang.ProcessBuilder / Runtime.exec with
# reflective Method.invoke (for setAccessible portability across JDKs). It is
# bundled into a large number of build/benchmark uber-JARs, where that pairing
# otherwise reads as reflective command execution.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  crit: notable
  conf: 0.95

traits:
  - id: jmh-util-package-class
    desc: JMH benchmark harness util package
    if:
      type: text
      substr: org/openjdk/jmh/util/

  - id: jmh-runner-package-class
    desc: JMH benchmark harness runner package
    if:
      type: text
      substr: org/openjdk/jmh/runner/

  - id: jmh-force-set-accessible-property
    desc: JMH forceSetAccessible reflection property
    if:
      type: text
      substr: jmh.forceSetAccessible
