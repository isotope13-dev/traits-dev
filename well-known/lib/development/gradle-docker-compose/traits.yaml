# avast/gradle-docker-compose-plugin — Gradle plugin that runs Docker
# Compose for local/IT tests. Wrapper URLClassLoader and commandLine exec
# of docker compose are product launchers, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [groovy, markdown, archives, xml]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: github-repo
    desc: gradle-docker-compose-plugin GitHub repo
    conf: 0.99
    if:
      type: text
      substr: github.com/avast/gradle-docker-compose-plugin

  - id: plugin-id
    desc: avast docker-compose Gradle plugin id
    conf: 0.99
    if:
      type: text
      substr: com.avast.gradle.docker-compose

  - id: groovy-package
    desc: avast dockercompose Groovy package
    for: [groovy]
    conf: 0.98
    if:
      type: text
      substr: com.avast.gradle.dockercompose

  - id: source-path
    desc: avast dockercompose source path
    conf: 0.96
    if:
      type: path
      regex: 'avast/gradle/dockercompose'
