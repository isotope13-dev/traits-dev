# Bundler — Ruby's dependency manager (https://bundler.io), now part of
# RubyGems. Official gems vendor Thor and FileUtils and legitimately exec,
# chmod, and fetch over HTTP while resolving gems. Identify the package so
# those package-manager capabilities are not mistaken for droppers.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, tar]
  crit: notable
  conf: 0.99

traits:
  - id: gem-name
    desc: Bundler RubyGems package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: bundler

  - id: gem-homepage
    desc: Bundler project homepage
    for: [gem]
    if:
      type: value
      path: gem.homepage
      regex: '(?i)bundler\.io'

  - id: module-version
    desc: Bundler module VERSION constant
    for: [ruby]
    if:
      type: text
      regex: '(?m)^module Bundler\b[\s\S]{0,200}^\s*VERSION\s*='

  - id: environment-preserver
    desc: Bundler EnvironmentPreserver.from_env
    for: [ruby]
    if:
      type: text
      substr: EnvironmentPreserver.from_env

  - id: upstream-repository
    desc: Bundler/RubyGems upstream repository
    if:
      type: text
      substr: github.com/rubygems/rubygems

composite_rules:
  - id: bundler-gem-context
    desc: Recognized Bundler RubyGems package
    crit: notable
    conf: 0.99
    for: [gem]
    scope: archive
    all:
      - id: gem-name
      - id: gem-homepage

  - id: bundler-core-library
    desc: Bundler core library module
    crit: notable
    conf: 0.99
    for: [ruby]
    scope: archive
    all:
      - id: module-version
      - id: environment-preserver

  - id: bundler-package-manager-context
    desc: Bundler package-manager benign context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: gem-name
      - id: gem-homepage
