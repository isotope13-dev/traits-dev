defaults:
  platforms:
  - unix
  - windows
  for:
  - gem
  - package.json
  - ruby
  - elf
  - macho
  - tar
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 200000000
traits:
- id: sorbet-static-gem-name
  desc: sorbet-static Ruby gem name
  for:
  - gem
  if:
    type: value
    path: name
    exact: sorbet-static
- id: sorbet-homepage
  desc: Sorbet product homepage marker
  for:
  - package.json
  - ruby
  - elf
  - macho
  if:
    type: text
    substr: sorbet.org
- id: sorbet-repository
  desc: Sorbet upstream GitHub repository
  for:
  - package.json
  - ruby
  - elf
  - macho
  if:
    type: text
    substr: github.com/sorbet/sorbet
- id: sorbet-typechecker-description
  desc: Sorbet typechecker binary description
  for:
  - gem
  if:
    type: value
    path: description
    regex: (?i)Sorbet typechecker
