# sorbet-static — Stripe Sorbet Ruby typechecker native binary gem.
defaults:
  platforms: [unix, windows]
  for: [gem, package.json, ruby, elf, macho, archives, tar]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 200000000

traits:
  - id: sorbet-static-gem-name
    desc: sorbet-static Ruby gem name
    for: [gem]
    if:
      type: value
      path: name
      exact: sorbet-static

  - id: sorbet-homepage
    desc: Sorbet product homepage marker
    if:
      type: text
      substr: sorbet.org

  - id: sorbet-repository
    desc: Sorbet upstream GitHub repository
    if:
      type: text
      substr: github.com/sorbet/sorbet

  - id: sorbet-typechecker-description
    desc: Sorbet typechecker binary description
    for: [gem]
    if:
      type: value
      path: description
      regex: '(?i)Sorbet typechecker'

composite_rules:
  - id: sorbet-static-typechecker-context
    desc: Stripe Sorbet static typechecker binary gem
    crit: exception
    conf: 0.99
    any:
      - id: sorbet-static-gem-name
      - id: sorbet-homepage
      - id: sorbet-repository
      - id: sorbet-typechecker-description
