# @webassemblyjs/* — WebAssembly toolchain helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: '@webassemblyjs scoped npm package name'
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@webassemblyjs/'

  - id: vendored-path
    desc: vendored @webassemblyjs package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@webassemblyjs/'

composite_rules:
  - id: library
    desc: '@webassemblyjs toolchain helper'
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
