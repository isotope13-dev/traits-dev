# GCC / LLVM sanitizer runtimes: libtsan, libasan, liblsan, libubsan, libmsan,
# libhwasan. Shipped by every gcc-N / clang installation and by the distro
# libasan*/libtsan* packages, so they are present in essentially every dev
# container, CI image, and build host.
#
# A sanitizer runtime interposes on the whole libc surface — it exports
# hundreds of `__interceptor_*` stubs including connect/listen/accept/bind/
# dup2/execve/openpty — which is precisely the symbol set the socket+exec
# reverse-shell composites look for. Same structural false positive the
# dbus/nspr/guile/systemd carve-outs in those composites already handle.
defaults:
  platforms: [linux, macos]
  for: [elf, so, macho, dylib]
  crit: baseline
  conf: 0.98
  size_max: 200000000

traits:
  - id: address-sanitizer-runtime-path
    desc: AddressSanitizer runtime library path
    crit: notable
    conf: 0.98
    for: [scripts, c, cpp]
    if:
      type: text
      regex: '(?i)(libclang_rt\.asan|libasan\.)'

  - id: sanitizer-runtime-source-path
    desc: Sanitizer runtime source path
    crit: notable
    conf: 0.99
    for: [c, cpp, scripts]
    if:
      type: path
      regex: '(?i)libtsan'

  # Hundreds of interceptors is the shape no ordinary library has; a program
  # that merely *calls* an intercepted function does not export these stubs.
  - id: sanitizer-interceptor-exports
    desc: Sanitizer __interceptor_ export table
    count_min: 50
    if:
      type: symbol
      # Leading underscores are stripped from loaded symbols and regex
      # patterns are NOT normalized, so `^__interceptor_` can never match.
      regex: '^interceptor_'

  - id: sanitizer-runtime-banner
    desc: Sanitizer runtime diagnostic banner
    crit: notable
    if:
      type: text
      section: .rodata
      regex: '\b(Thread|Address|Leak|Memory)Sanitizer\b'

  - id: sanitizer-common-runtime-symbol
    desc: Sanitizer common runtime symbol prefix
    if:
      type: symbol
      regex: '^sanitizer_[a-z]'

composite_rules:
  - id: sanitizer-runtime-library
    desc: GCC/LLVM sanitizer runtime library
    crit: notable
    conf: 0.98
    any:
      - id: sanitizer-interceptor-exports
      - id: sanitizer-common-runtime-symbol
    all:
      - id: sanitizer-runtime-banner
