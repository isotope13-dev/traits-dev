# dorongold/gradle-task-tree — Gradle plugin that prints a task
# dependency tree. Wrapper exec in gradlew is the standard launcher.
defaults:
  platforms: [unix, windows]
  for: [groovy, markdown, archives, xml]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: github-repo
    desc: gradle-task-tree GitHub repository
    conf: 0.99
    if:
      type: text
      substr: github.com/dorongold/gradle-task-tree

  - id: plugin-id
    desc: dorongold task-tree Gradle plugin id
    conf: 0.99
    if:
      type: text
      substr: com.dorongold.task-tree

  - id: groovy-package
    desc: dorongold tasktree Groovy package
    for: [groovy]
    conf: 0.98
    if:
      type: text
      substr: com.dorongold.gradle.tasktree

  - id: source-path
    desc: dorongold tasktree source path
    conf: 0.96
    if:
      type: path
      regex: 'dorongold/gradle/tasktree'
