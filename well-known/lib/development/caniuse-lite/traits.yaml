# caniuse-lite stores each browser feature as a generated CommonJS module.
# Its packed A/B/C/D schema uses base-62 browser-version keys and contains no
# executable logic beyond exporting the compatibility table.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: packed-feature-module-prefix
    desc: CommonJS packed feature prefix fragment
    crit: component
    if:
      type: text
      substr: 'module.exports={A:{A:{'

  - id: packed-feature-metadata-suffix
    desc: Packed feature metadata suffix fragment
    crit: component
    if:
      type: text
      regex: '\},B:\d+,C:"[^"]{1,160}",D:(true|false)\};$'

composite_rules:
  - id: packed-feature-data
    desc: caniuse-lite packed browser feature data
    all:
      - id: packed-feature-module-prefix
      - id: packed-feature-metadata-suffix
    near_lines: 1
