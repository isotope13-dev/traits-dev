# caniuse-lite stores each browser feature as a generated CommonJS module.
# Its packed A/B/C/D schema uses base-62 browser-version keys and contains no
# executable logic beyond exporting the compatibility table.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: packed-feature-module-prefix
    desc: CommonJS packed feature prefix fragment
    crit: notable
    if:
      type: text
      substr: 'module.exports={A:{A:{'

  - id: packed-feature-metadata-suffix
    desc: Packed feature metadata suffix fragment
    crit: notable
    if:
      type: text
      regex: '\},B:\d+,C:"[^"]{1,160}",D:(true|false)\};$'

  - id: region-module-commonjs-prefix
    desc: Regional browser table CommonJS prefix fragment
    crit: component
    if:
      type: text
      substr: 'module.exports={C:{'

  - id: region-module-second-browser-table
    desc: Second browser usage table fragment
    crit: component
    if:
      type: text
      regex: '\},D:\{"[0-9]{1,3}":[0-9]'

  - id: region-module-legacy-version-list
    desc: Packed legacy browser version list fragment
    crit: component
    if:
      type: text
      substr: ',_:'

composite_rules:
  - id: packed-feature-data
    desc: caniuse-lite packed browser feature data
    all:
      - id: packed-feature-module-prefix
      - id: packed-feature-metadata-suffix
    near_lines: 1

  - id: regional-browser-usage-table
    desc: caniuse-lite regional browser usage table
    conf: 0.99
    size_min: 1000
    size_max: 12000
    needs: 2
    any:
      - id: region-module-commonjs-prefix
      - id: region-module-second-browser-table
      - id: region-module-legacy-version-list
