# Rich-Harris/magic-string — string edits with source maps.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: magic-string npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: magic-string

  - id: vendored-path
    desc: vendored magic-string package path
    for: [scripts, manifests, data, source, json, text]
    if:
      type: path
      regex: 'node_modules/magic-string/'
