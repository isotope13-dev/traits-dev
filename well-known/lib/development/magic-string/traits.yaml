# Rich-Harris/magic-string — string edits with source maps.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: magic-string npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: magic-string

  - id: vendored-path
    desc: vendored magic-string package path
    for: [scripts, manifests, data, source, json, text]
    if:
      type: path
      regex: 'node_modules/magic-string/'

  # Content corroborates the declared output name, independent of disk name.
  - id: sourcemap-output-name
    desc: Source map names a MagicString output
    for: [json, data]
    if:
      type: text
      regex: '"file"\s*:\s*"magic-string\.((cjs|umd)\.js|es\.m?js)"'

  - id: chunk-edit-diagnostic
    desc: MagicString chunk-splitting edit diagnostic
    for: [javascript, typescript, json, data]
    if:
      type: text
      substr: Cannot overwrite across a split point

composite_rules:
  - id: source-map-implementation
    desc: MagicString source map with implementation
    for: [json, data]
    all:
      - id: metadata/file/format/source-map::sourcemap
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: sourcemap-output-name
      - id: chunk-edit-diagnostic
