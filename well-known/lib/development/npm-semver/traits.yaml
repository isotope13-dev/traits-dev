# npm/node-semver — the semantic version parser used by npm
# (https://github.com/npm/node-semver). Extremely common dependency; identify
# it so domain methods like Range.test(version) are not mistaken for harnesses
# and so hostile composites can exclude the real library.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: npm semver package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: semver

  - id: registry-package-name
    desc: npm semver registry package name
    for: [registry]
    if:
      type: value
      path: registry.name
      exact: semver

  - id: archive-package-name
    desc: npm semver archive package name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: semver

  # A link to the upstream repo, nothing more: docs that merely cite
  # node-semver (type-fest's PackageJson, conf's migration docs) match it too,
  # so the composites below always pair it with real semver code.
  - id: upstream-repository
    desc: Links to the npm node-semver repository
    if:
      type: text
      substr: github.com/npm/node-semver

  - id: vendored-path
    desc: Vendored npm node-semver package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/semver/'

  - id: semver-class-text
    desc: npm semver SemVer class text
    crit: component
    for: [javascript]
    if:
      type: text
      substr: class SemVer

  - id: semver-invalid-version-typeerror
    desc: npm semver invalid-version TypeError
    crit: component
    for: [javascript]
    if:
      type: text
      # 7.3.x: "Invalid Version: …" — 7.8.x: "Invalid version. Must be a string"
      regex: 'Invalid [Vv]ersion'

  - id: range-class-text
    desc: npm semver Range class text
    crit: component
    for: [javascript]
    if:
      type: text
      substr: class Range

  - id: range-testset-helper
    desc: npm semver range testSet helper
    crit: component
    for: [javascript]
    if:
      type: text
      substr: 'const testSet = (set, version, options)'

  # bin/semver.js help banner. Stable across every 5.x-7.x release and the only
  # identity string in the CLI entry point, which otherwise carries no
  # semver-specific marker at all.
  - id: cli-help-banner
    desc: npm semver CLI help banner
    for: [javascript]
    if:
      type: text
      substr: 'A JavaScript implementation of the https://semver.org/ specification'

  - id: preload-reexport
    desc: npm semver preload re-export shim
    for: [javascript]
    if:
      type: text
      substr: 'XXX remove in v8 or beyond'

  # Pre-v6 layout: one semver.js with prototype methods (still widely cached).
  - id: semver-spec-version-export
    desc: npm semver SEMVER_SPEC_VERSION export
    crit: component
    for: [javascript]
    if:
      type: text
      substr: exports.SEMVER_SPEC_VERSION

  - id: comparator-prototype-test
    desc: npm semver Comparator.prototype.test
    crit: component
    for: [javascript]
    if:
      type: text
      substr: Comparator.prototype.test

  - id: range-prototype-test
    desc: npm semver Range.prototype.test
    crit: component
    for: [javascript]
    if:
      type: text
      substr: Range.prototype.test

composite_rules:
  - id: semver-class
    desc: npm semver SemVer class module
    crit: notable
    for: [javascript]
    all:
      - id: semver-class-text
      - id: semver-invalid-version-typeerror

  - id: range-class
    desc: npm semver Range class module
    crit: notable
    for: [javascript]
    all:
      - id: range-class-text
      - id: range-testset-helper

  - id: legacy-single-file
    desc: npm semver legacy single-file module
    crit: notable
    for: [javascript]
    all:
      - id: semver-spec-version-export
      - id: comparator-prototype-test
      - id: range-prototype-test

  - id: npm-semver-context
    desc: Recognized npm node-semver package tree
    crit: exception
    conf: 0.99
    scope: outer
    # `all:` keeps this exception in the finding set (bare any/needs<=1 is
    # filtered and would not suppress host traits via unless:).
    all:
      - id: upstream-repository
    any:
      - id: package-name
      - id: registry-package-name
      - id: archive-package-name
      - id: semver-class
      - id: range-class
      - id: legacy-single-file
      - id: preload-reexport
      - id: cli-help-banner
