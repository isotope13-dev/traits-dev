# JetBrains Fernflower Java decompiler (java-decompiler.jar).
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class, zip]
  crit: notable
  conf: 0.99

traits:
  - id: jar-basename
    desc: JetBrains java-decompiler JAR basename
    for: [jar, zip]
    if:
      type: basename
      exact: java-decompiler.jar

  - id: class-namespace
    desc: Fernflower Java decompiler class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^org/jetbrains/java/decompiler/'

  - id: fernflower-internal-name
    desc: Fernflower main class internal name
    for: [class, java_class]
    if:
      type: text
      substr: 'Lorg/jetbrains/java/decompiler/main/Fernflower;'

composite_rules:
  - id: fernflower-decompiler
    desc: JetBrains Fernflower Java decompiler
    any:
      - id: jar-basename
      - id: class-namespace
      - id: fernflower-internal-name
