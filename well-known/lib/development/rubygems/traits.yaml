# RubyGems' own implementation, as shipped in the Ruby stdlib under
# lib/ruby/<ver>/rubygems/.
#
# This matters because RubyGems registers install hooks on itself: both
# install_message.rb and install_default_message.rb call `Gem.post_install` to
# print "Successfully installed <gem>". The hook traits in
# objectives/supply-chain/install-hook/package/rubygems/ are looking for a
# *gem* that registers a hook at install time, and the package manager
# announcing its own installs is not that.
#
# Two markers, not one, because the composite below disarms a suspicious
# finding and a single line is cheap for a hostile gem to copy:
#   * `require_relative "../rubygems"` names the sibling rubygems.rb one
#     directory up — a path only a file inside that tree resolves (14 files in
#     Ruby 3.4.9 use it; a gem's own lib/ directory has no such sibling, so
#     copying the line there is a load error, not a bypass).
#   * `Gem::DefaultUserInteraction` is the internal console-output mixin those
#     hook files use to say the line. Four files in the tree reference it.
# Both hook-registering files carry both markers, so the pair costs nothing in
# coverage.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95

traits:
  - id: rubygems-core-relative-require
    desc: File requires the RubyGems core relatively
    if:
      type: text
      regex: 'require_relative\s+[''"]\.\./rubygems[''"]'

  - id: rubygems-default-user-interaction
    desc: RubyGems internal console output mixin
    if:
      type: text
      substr: 'Gem::DefaultUserInteraction'

  - id: chad-fowler-copyright
    desc: RubyGems Chad Fowler copyright header
    if:
      type: text
      substr: 'Copyright 2006 by Chad Fowler'

  - id: rubygems-library-path
    desc: RubyGems library member path
    if:
      type: path
      regex: 'lib/rubygems/'

  - id: update-rubygems-basename
    desc: update_rubygems installer basename
    if:
      type: basename
      exact: update_rubygems

composite_rules:
  - id: rubygems-own-library-file
    desc: File belongs to the RubyGems implementation
    crit: exception
    conf: 0.97
    all:
      - id: rubygems-core-relative-require
      - id: rubygems-default-user-interaction
