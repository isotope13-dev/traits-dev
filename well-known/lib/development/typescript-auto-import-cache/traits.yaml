# volarjs typescript-auto-import-cache — TS auto-import cache.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: typescript-auto-import-cache package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: typescript-auto-import-cache

  - id: vendored-path
    desc: vendored typescript-auto-import-cache path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/typescript-auto-import-cache/'
