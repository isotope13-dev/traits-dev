# @csstools/* PostCSS plugins published from the csstools/postcss-plugins
# monorepo. Those manifests commonly list contributors instead of author while
# still carrying full repository, homepage, and funding metadata.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: CSSTools scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@csstools/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-name
    desc: CSSTools scoped npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@csstools/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-url
    desc: CSSTools postcss-plugins repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/csstools/postcss-plugins(\.git)?$'

  - id: github-npm-repository-url
    desc: CSSTools npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/csstools/postcss-plugins(\.git)?$'

composite_rules:
  - id: package-identity
    desc: CSSTools postcss plugin package identity
    crit: notable
    all:
      - id: scoped-package-name
    any:
      - id: github-repository-url
      - id: github-npm-repository-url
