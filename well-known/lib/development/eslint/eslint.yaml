defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.99
traits:
- id: eslint-rule-module-annotation
  desc: ESLint rule module type annotation
  if:
    type: text
    substr: '@type {import(''eslint'').Rule.RuleModule}'
- id: eslint-core-rule-module-annotation
  desc: ESLint core rule module annotation
  if:
    type: text
    substr: '@type {import(''../types'').Rule.RuleModule}'
- id: eslint-community-utils-import
  desc: ESLint community utils import
  if:
    type: text
    substr: '@eslint-community/eslint-utils'
- id: eslint-utils-legacy-import
  desc: Legacy eslint-utils package import
  if:
    type: text
    substr: require('eslint-utils')
composite_rules:
- id: eslint-rule-source-context
  for:
  - javascript
  - typescript
  - package.json
  - npm
  desc: ESLint rule source context
  crit: exception
  scope: outer
  all:
  - id: metadata/path::rules-source-path
  any:
  - id: eslint-rule-module-annotation
  - id: eslint-core-rule-module-annotation
  - id: eslint-community-utils-import
  - id: eslint-utils-legacy-import
  - id: eslint-package-context
  needs: 1
- id: eslint-package-context
  for:
  - javascript
  - typescript
  - package.json
  - npm
  desc: ESLint package context
  crit: exception
  scope: outer
  any:
  - id: metadata/package/name/convention::eslint-package-name
  - id: metadata/package/name/convention::eslint-npm-name
