# Official npm libnpm* API clients.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: vendored-path
    desc: vendored libnpm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/libnpm'
