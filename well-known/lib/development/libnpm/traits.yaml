# npm libnpm* client libraries.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: vendored-path
    desc: vendored libnpm client package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/libnpm'

composite_rules:
  - id: library
    desc: npm libnpm client library
    all:
      - id: vendored-path
    any:
      - id: vendored-path
