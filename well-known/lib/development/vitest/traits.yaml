# Official Vitest npm package identity. Vitest imports `obug` as its
# documented debug utility; do not treat that dependency as a substitution
# indicator in an upstream Vitest release.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: vitest-package-name
    desc: Official Vitest npm package name
    if:
      type: value
      path: name
      exact: vitest

  - id: vitest-upstream-repository
    desc: Official Vitest GitHub repository
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/vitest-dev/vitest(\.git)?$'

composite_rules:
  - id: vitest-upstream-release-context
    desc: Official Vitest upstream release context
    crit: exception
    conf: 0.99
    for: [package.json, javascript, typescript, archives]
    scope: outer
    all:
      - id: vitest-package-name
      - id: vitest-upstream-repository
