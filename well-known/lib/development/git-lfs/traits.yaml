# Git LFS — the ubiquitous Git large-file filter driver. Its clean/smudge
# lines inside .git/config or .gitattributes (`clean = git-lfs clean -- %f`)
# are the one benign reason a repository config carries filter commands, so
# repo-config attack composites use this identifier to carve that context out.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.92

traits:
  - id: git-lfs-filter-driver-config
    desc: git-lfs filter driver config lines
    if:
      type: text
      regex: '=\s*git-lfs\s+(clean|smudge|filter-process)'
