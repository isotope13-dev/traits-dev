# Apache Ant build-tool library identity. Ant is bundled by many Java tools,
# including (but not limited to) the Red Hat Java VS Code extension.
defaults:
  platforms: [windows, unix]
  for: [archives, jar, class, java_class, vsix]
  crit: notable
  conf: 0.98

traits:
  - id: package-path
    desc: Apache Ant package path
    if:
      type: path
      regex: '(?i)apache\.ant_|tools/ant/'
