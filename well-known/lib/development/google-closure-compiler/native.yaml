# The Windows npm distribution ships compiler.exe as a GraalVM Native Image.
# Native-image support code legitimately contains debugger, registry, crypto,
# and virtual-memory APIs, plus the PE-header handling used by the runtime.
# Keep this product identity separate from the Java/JAR identity in traits.yaml
# so those normal compiler mechanisms suppress loader heuristics only here.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 10000000
  size_max: 100000000

traits:
  - id: graalvm-native-image-runtime
    desc: GraalVM Native Image runtime marker
    if:
      type: text
      section: .data
      substr: com.oracle.svm.core.VM=GraalVM

  - id: closure-compiler-native-marker
    desc: Closure Compiler native binary marker
    if:
      type: text
      section: .data
      substr: Copyright The Closure Compiler Authors.

composite_rules:
  - id: closure-compiler-native-image
    desc: Google Closure Compiler GraalVM native image
    crit: notable
    conf: 0.99
    all:
      - id: graalvm-native-image-runtime
      - id: closure-compiler-native-marker
