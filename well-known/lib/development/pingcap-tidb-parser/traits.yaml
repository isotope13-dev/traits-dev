# pingcap/tidb/pkg/parser — TiDB SQL parser library (Go module subtree).
defaults:
  platforms: [unix, windows]
  for: [go, archives, zip]
  crit: notable
  conf: 0.99

traits:
  - id: archive-module-path
    desc: TiDB parser module archive path
    if:
      type: path
      regex: 'tidb/pkg/parser@'

  - id: parser-new-constructor
    desc: TiDB parser.New constructor call
    for: [go]
    if:
      type: text
      substr: parser.New()

composite_rules:
  - id: pingcap-tidb-parser-context
    desc: PingCAP TiDB SQL parser library source
    crit: exception
    conf: 0.99
    any:
      - id: well-known/lib/format/pingcap-tidb-parser::pingcap-tidb-parser-module-path
      - id: archive-module-path
      - id: parser-new-constructor
