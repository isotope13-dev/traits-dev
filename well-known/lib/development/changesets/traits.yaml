# Changesets packages published under the @changesets/ scope.
# Official packages in the Changesets project live in the changesets/changesets
# monorepo. Individual @changesets/* packages therefore do not share the repository
# basename and their README files routinely use product headings and link sibling
# packages.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Changesets scoped package identity
    if:
      type: value
      path: name
      regex: '^@changesets/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Changesets scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@changesets/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Changesets GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/changesets/changesets(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Changesets GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/changesets/changesets(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Changesets GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/changesets/changesets(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Changesets official package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Changesets official package repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Changesets package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
