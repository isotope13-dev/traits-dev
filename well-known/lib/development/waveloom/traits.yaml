# Waveloom is a Go CLI that scores shell command safety and ships regression
# tests with dangerous-command fixtures to prevent false positives.
defaults:
  platforms: [unix, windows]
  for: [go, zip]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 104857600

traits:
  - id: source-archive-member
    desc: waveloom module source archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/Menfre01/waveloom@v[0-9][^/]+/go\.mod$'

  - id: source-archive-path
    desc: waveloom module source path
    for: [go, text]
    if:
      type: path
      regex: 'github\.com/Menfre01/waveloom@'

  - id: module-path
    desc: waveloom module import path
    if:
      type: text
      substr: 'github.com/Menfre01/waveloom'

composite_rules:
  - id: waveloom-library
    desc: Waveloom shell safety checker
    crit: notable
    conf: 0.99
    any:
      - id: source-archive-member
      - id: source-archive-path
      - id: module-path

  - id: waveloom-source-archive-context
    desc: waveloom source archive context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: source-archive-member
      - id: module-path
