# JUCE is a widely vendored C++ application framework.  Its macOS process
# helper legitimately checks P_TRACED to report debugger state, so the
# recognizable upstream source context is used only as a debugger-detection
# false-positive suppressor.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, objc]
  crit: notable
  conf: 0.99
  size_max: 2000000

traits:
  - id: source-header
    desc: JUCE library source header
    if:
      type: text
      substr: This file is part of the JUCE library.

  - id: copyright-header
    desc: JUCE Raw Material Software copyright
    if:
      type: text
      substr: Raw Material Software Limited

  - id: namespace
    desc: JUCE C++ namespace
    if:
      type: text
      regex: '(?m)^\s*namespace\s+juce\b'

composite_rules:
  - id: juce-source-context
    desc: Recognized JUCE source context
    crit: exception
    conf: 0.99
    all:
      - id: source-header
      - id: copyright-header
      - id: namespace
