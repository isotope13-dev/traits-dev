defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  - json
  - javascript
  - tar
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: cspell en-common-misspellings package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@cspell/dict-en-common-misspellings'
