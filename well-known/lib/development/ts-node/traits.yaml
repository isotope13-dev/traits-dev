defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: ntypescript-dev-dependency
    desc: ts-node declares ntypescript for development
    if:
      type: value
      path: devDependencies.ntypescript
      exists: true

  - id: typestrong-ts-node-repository
    desc: TypeStrong ts-node GitHub repository URL
    crit: component
    conf: 0.99
    if:
      type: value
      path: repository.url
      regex: 'github\.com[/:]TypeStrong/ts-node(\.git)?/?$'
      case_insensitive: true

  - id: ts-node-variant-package-name
    desc: ts-node variant package name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: name
      regex: '^ts-node[-_][A-Za-z0-9._-]+$'
      case_insensitive: true

  - id: ts-node-bin-entry
    desc: package.json declares ts-node binary
    crit: component
    conf: 0.95
    if:
      type: value
      path: bin.ts-node
      exists: true

composite_rules:
  - id: ts-node-ntypescript-dev-context
    desc: ts-node legacy ntypescript development context
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/manifest/name::ts-node-package-name
      - id: ntypescript-dev-dependency

  - id: ts-node-variant-claims-official-repository
    desc: Variant claims official ts-node repository
    crit: suspicious
    conf: 0.99
    all:
      - id: typestrong-ts-node-repository
      - id: ts-node-variant-package-name

  - id: ts-node-bin-with-variant-package-name
    desc: ts-node bin under variant package name
    crit: suspicious
    conf: 0.97
    all:
      - id: ts-node-bin-entry
      - id: ts-node-variant-package-name
      - id: typestrong-ts-node-repository
