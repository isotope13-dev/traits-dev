# google/protobuf-gradle-plugin — compiles .proto files in Gradle.
# Bundled gradlew launchers are the Gradle wrapper, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [groovy, markdown, archives, xml]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: github-repo
    desc: protobuf-gradle-plugin GitHub repository
    conf: 0.99
    if:
      type: text
      substr: github.com/google/protobuf-gradle-plugin

  - id: plugin-class
    desc: protobuf Gradle plugin implementation class
    conf: 0.99
    if:
      type: text
      substr: com.google.protobuf.gradle.ProtobufPlugin

  - id: groovy-package
    desc: protobuf.gradle Groovy plugin package
    for: [groovy]
    conf: 0.98
    if:
      type: text
      substr: com.google.protobuf.gradle

  - id: source-path
    desc: protobuf.gradle plugin source path
    conf: 0.96
    if:
      type: path
      regex: 'google/protobuf/gradle'
