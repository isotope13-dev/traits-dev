# @one-ini/wasm — EditorConfig-INI parser (WASM bindings).
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: one-ini-wasm-package-name
    desc: one-ini wasm package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@one-ini/wasm'

  - id: one-ini-wasm-package-path
    desc: one-ini wasm package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@one-ini[/\\]wasm'
