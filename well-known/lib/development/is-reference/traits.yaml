# Rich-Harris/is-reference — ESTree identifier is a reference.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: is-reference npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: is-reference

  - id: vendored-path
    desc: vendored is-reference package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/is-reference/'
