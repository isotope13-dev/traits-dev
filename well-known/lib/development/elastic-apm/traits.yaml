# The Elastic APM Go agent's Jenkins scripts bootstrap the pinned Go toolchain.
defaults:
  platforms: [unix, windows]
  for: [go, shell, zip]
  crit: notable
  conf: 0.99

traits:
  # `for: [go]` here was a dead gate: this regex only ever matches go.mod
  # content, and a go.mod is typed GoMod, not Go, so the trait could never
  # fire. It is the identity to use when the module is scanned as an
  # extracted tree rather than as the published zip.
  - id: module-path
    desc: Elastic APM Go module identity
    for: [go.mod]
    if:
      type: text
      regex: '(?m)^module\s+go\.elastic\.co/apm\s*$'
  - id: source-tree-path
    desc: Elastic APM source tree path
    for: [go, shell]
    if:
      type: path
      regex: 'go\.elastic\.co[\\/]apm@v'
  - id: source-archive-module
    desc: Elastic APM source archive module
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^go\.elastic\.co/apm@v[0-9][^/]+/go\.mod$'
  - id: source-archive-jenkins
    desc: Elastic APM Jenkins archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^go\.elastic\.co/apm@v[0-9][^/]+/scripts/jenkins/[^/]+\.sh$'

composite_rules:
  - id: jenkins-script-context
    desc: Official Elastic APM Jenkins script context
    crit: exception
    conf: 0.99
    for: [shell]
    scope: file
    all:
      # The Elastic-specific half is the module path; the CI-layout half is a
      # neutral metadata fact (a `scripts/jenkins/` directory is not evidence
      # of any particular project, so it is not named for one here).
      - id: source-tree-path
      - id: metadata/build/jenkins::jenkins-script-directory-path
  - id: source-archive-context
    desc: Official Elastic APM source archive context
    crit: exception
    conf: 0.99
    for: [zip]
    scope: outer
    all:
      - id: source-archive-module
      - id: source-archive-jenkins
