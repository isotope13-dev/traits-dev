# integration-automation-patterns — enterprise integration pattern library.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: integration-automation-patterns wheel
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: integration-automation-patterns

  - id: package-metadata-name
    desc: integration-automation-patterns PyPI name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: integration-automation-patterns'

  - id: module-path
    desc: integration_automation_patterns module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)integration_automation_patterns/'

  - id: enterprise-integration-summary
    desc: enterprise integration patterns package summary
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: enterprise integration, workflow automation

  - id: webhook-handler-class
    desc: WebhookHandler HMAC verification class
    for: [python]
    if:
      type: text
      substr: class WebhookHandler

  - id: github-repo
    desc: ashutoshrana integration-patterns GitHub repo
    for: [json, markdown, text, python]
    if:
      type: text
      substr: ashutoshrana/integration-automation-patterns

composite_rules:
  - id: integration-automation-patterns-package
    desc: Enterprise integration automation patterns library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
