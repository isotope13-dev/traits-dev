# DefinitelyTyped @types/* TypeScript stub packages.
defaults:
  platforms: [unix, windows]
  for: [package.json, json]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: DefinitelyTyped @types package name
    if:
      type: value
      path: name
      regex: '^@types/'

  - id: vendored-path
    desc: vendored @types package path
    for: [scripts, manifests, data, source, typescript]
    if:
      type: path
      regex: 'node_modules/@types/'
