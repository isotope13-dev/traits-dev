# DefinitelyTyped @types/* TypeScript stub packages.
defaults:
  platforms: [unix, windows]
  for: [package.json, json]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: DefinitelyTyped @types package name
    if:
      type: value
      path: name
      regex: '^@types/'

  - id: vendored-path
    desc: vendored @types package path
    for: [scripts, manifests, data, source, typescript]
    if:
      type: path
      regex: 'node_modules/@types/'

  - id: deprecated-stub-types-notice
    desc: Deprecated DefinitelyTyped stub types notice
    for: [package.json]
    if:
      type: value
      path: deprecated
      substr: stub types definition

composite_rules:
  - id: deprecated-stub-types-package
    desc: Deprecated DefinitelyTyped stub types package
    for: [package.json]
    all:
      - id: scoped-package-name
      - id: deprecated-stub-types-notice
