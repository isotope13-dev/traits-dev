# ast-parents — attach parent pointers on an AST.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ast-parents npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'ast-parents'

  - id: vendored-path
    desc: vendored ast-parents package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/ast-parents/'

composite_rules:
  - id: library
    desc: ast-parents AST helper
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
