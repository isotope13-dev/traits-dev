# Integration, request, jitter and CI references do not prove gated staging.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  size_max: 2147483648
composite_rules:
- id: vscode-https-random-delay-ci-references
  desc: VS Code HTTPS, random delay and CI references
  crit: notable
  conf: 0.97
  near_lines: 80
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/time/schedule/delay::settimeout-random-delay
  any:
  - id: micro-behaviors/os/env/read/named::ci-env-reference-set
