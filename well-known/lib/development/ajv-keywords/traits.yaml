# ajv-keywords — extra Ajv JSON-schema keywords.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ajv-keywords npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'ajv-keywords'

  - id: vendored-path
    desc: vendored ajv-keywords package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/ajv-keywords/'
  - id: pattern-required
    desc: ajv-keywords patternRequired keyword
    if:
      type: text
      substr: 'patternRequired'

composite_rules:
  - id: library
    desc: ajv-keywords library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: pattern-required
