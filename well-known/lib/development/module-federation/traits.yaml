# Module Federation DTS plugin — TypeScript declaration generation and dev server support.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: dts-plugin-package-name
    desc: Module Federation dts-plugin npm package name
    if:
      type: value
      path: name
      exact: "@module-federation/dts-plugin"
