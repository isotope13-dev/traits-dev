defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: commander-legacy
    desc: Commander.js legacy prototype pattern
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/source/naming/declaration::cmd-proto-command
      - id: metadata/lang/source/naming/declaration::cmd-proto-option
      - id: metadata/lang/source/naming/declaration::cmd-proto-parse
  - id: commander-modern
    desc: Commander.js class pattern
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/declaration::cmd-class-def-regex
      - id: metadata/lang/source/syntax/declaration::cmd-exports-regex
  - id: commander
    desc: Commander.js CLI framework
    crit: notable
    conf: 0.95
    any:
      - id: commander-legacy
      - id: commander-modern
