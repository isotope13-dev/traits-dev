# distlib -- the low-level packaging library vendored into pip. Its
# PackageIndex class talks to PyPI, which is the library's own job rather
# than a program reaching for a package index.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: distlib-package-index
    desc: Python distlib package index
    if:
      type: text
      regex: 'class\s+PackageIndex\(Environment\)'
  # setuptools vendors distlib's cli.exe / gui.exe (and the -32/-64 copies)
  # as packaging launchers. A member of that name is the launcher, not a
  # payload the install hook is delivering.
  - id: distlib-launcher-executable
    desc: distlib Windows launcher executable
    for: [tar, zip, python_sdist, whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(cli|gui)(-32|-64)?\.exe$'
