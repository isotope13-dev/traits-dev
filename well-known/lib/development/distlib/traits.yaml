# distlib -- the low-level packaging library vendored into pip. Its
# PackageIndex class talks to PyPI, which is the library's own job rather
# than a program reaching for a package index.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: distlib-package-index
    desc: Python distlib package index
    if:
      type: text
      regex: 'class\s+PackageIndex\(Environment\)'
