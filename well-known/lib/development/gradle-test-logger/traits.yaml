# radarsh/gradle-test-logger-plugin — Gradle console test-log theme plugin.
# AppVeyor WebClient.UploadFile in uploadTestResults.ps1 is CI result
# reporting, not exfil.
defaults:
  platforms: [unix, windows]
  for: [groovy, markdown, archives, xml]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: github-repo
    desc: gradle-test-logger-plugin GitHub repository
    for: [markdown]
    conf: 0.99
    if:
      type: text
      substr: github.com/radarsh/gradle-test-logger-plugin

  - id: plugin-id
    desc: adarshr test-logger Gradle plugin id
    conf: 0.99
    if:
      type: text
      substr: com.adarshr.test-logger

  - id: groovy-package
    desc: adarshr testlogger Groovy package
    for: [groovy]
    conf: 0.98
    if:
      type: text
      substr: com.adarshr.gradle.testlogger

  - id: source-path
    desc: adarshr testlogger source path
    conf: 0.96
    if:
      type: path
      regex: 'adarshr/gradle/testlogger'
