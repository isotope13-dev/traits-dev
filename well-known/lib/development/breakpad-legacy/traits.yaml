# Google Breakpad crash-reporting library markers
# https://chromium.googlesource.com/breakpad/breakpad
# Present in any application that links the Breakpad crash reporter.
defaults:
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
  - id: crashpad-handler
    desc: Crashpad handler binary
    crit: notable
    conf: 0.96
    platforms: [macos]
    for: [macho]
    size_min: 100000
    size_max: 10000000
    if:
      type: basename
      exact: crashpad_handler
  - id: crashreportsender-symbol
    crit: notable
    desc: 'crashreportsender symbol'
    if:
      type: text
      substr: "google_breakpad::CrashReportSender::SendCrashReport"
      section: ".rdata"

  - id: crashreportsender-file
    crit: notable
    desc: Breakpad crash_report_sender.cc source path
    if:
      type: text
      substr: "crash_report_sender.cc"
      section: ".rdata"

  - id: crash-context-string
    crit: notable
    desc: Breakpad crash_context handoff string
    if:
      type: text
      exact: "crash_context"
      section: ".rdata"

  # CrashpadInfo begins with kSignature='CPad', its byte size, and version 1.
  # Little-endian Windows stores the signature as 64 61 50 43. A bare
  # CPADinfo label is not product identity: ransomware renames .rdata to it.
  # Upstream format: chromium/crashpad client/crashpad_info.{h,cc}.
  - id: crashpad-client-section
    desc: CrashpadInfo versioned header in CPADinfo
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: CPADinfo
      section_offset_range: [0, 12]
      pattern: '64 61 50 43 ?? ?? 00 00 01 00 00 00'

  - id: dump-file-string
    crit: notable
    desc: Breakpad dump_file handoff string
    if:
      type: text
      exact: "dump_file"
      section: ".rdata"

composite_rules:
  - id: crashreportsender
    desc: Google Breakpad CrashReportSender uploader
    crit: notable
    conf: 0.99
    all:
      - id: crashreportsender-symbol
      - id: crashreportsender-file
