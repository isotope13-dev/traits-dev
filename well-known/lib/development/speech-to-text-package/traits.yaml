# speech_to_text_package — Flutter plugin wrapping platform speech
# APIs. RECORD_AUDIO / SpeechRecognizer are the product STT path.
defaults:
  platforms: [unix, windows, android]
  for: [kotlin, tar, archives, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 20000000

traits:
  - id: pub-name
    desc: speech_to_text_package pub.dev name
    for: [text]
    conf: 0.99
    if:
      type: text
      regex: '(?m)^name:\s*speech_to_text_package\s*$'

  - id: method-channel
    desc: speech_to_text_package method channel
    for: [kotlin, text]
    conf: 0.98
    if:
      type: text
      substr: '"speech_to_text_package"'

  - id: source-path
    desc: speech_to_text_package source path
    conf: 0.97
    if:
      type: path
      regex: '(?i)(^|[\\/])speech_to_text_package([\\/-]|$)'
