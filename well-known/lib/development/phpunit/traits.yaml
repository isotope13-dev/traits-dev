# PHPUnit is a legitimate PHP unit-testing framework.  Its runtime queries
# the PHP environment while loading tests, so the package identity provides a
# narrow benign context for generic fingerprinting heuristics.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json, zip]
  crit: notable
  conf: 0.99

traits:
  - id: composer-package-name
    desc: PHPUnit Composer package name
    for: [composer.json]
    if:
      type: value
      path: name
      exact: phpunit/phpunit

  - id: source-tree
    desc: PHPUnit source tree
    for: [php, zip]
    if:
      type: path
      substr: sebastianbergmann-phpunit-

  - id: legacy-testcase-class-reference
    desc: Legacy PHPUnit TestCase class reference
    for: [php]
    conf: 0.98
    if:
      type: text
      word: PHPUnit_Framework_TestCase

composite_rules:
  - id: phpunit-source-context
    desc: Recognized PHPUnit source package context
    crit: exception
    conf: 0.99
    any:
      - id: source-tree
      - id: composer-package-name
