# The Cargo team's test proc-macro intentionally probes the build toolchain.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Cargo test macro package identity
    if:
      type: value
      path: package.name
      exact: cargo-test-macro
  - id: upstream-repository
    desc: Cargo test macro upstream repository
    if:
      type: value
      path: package.repository
      substr: 'https://github.com/rust-lang/cargo'
  # The per-file suppressor: the proc-macro rules that need quieting fire on
  # src/lib.rs, and a Cargo.toml-gated identity composite does not resolve
  # there, so the versioned crate directory name is what is checkable.
  - id: source-tree-path
    desc: Cargo test macro source tree path
    for: [rust]
    crit: notable
    if:
      type: path
      regex: 'cargo-test-macro-[0-9]'
