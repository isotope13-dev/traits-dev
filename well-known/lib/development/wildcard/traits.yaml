# bcoe/wildcard — glob-style string matching.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: wildcard npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'wildcard'

  - id: vendored-path
    desc: vendored wildcard package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/wildcard/'
  - id: wildcard-require
    desc: wildcard package require in tests
    if:
      type: text
      substr: "wildcard = require('../')"

composite_rules:
  - id: library
    desc: wildcard library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: wildcard-require
