# Crashpad source identity (chromium/crashpad). Vendored client and handler
# sources spell the project's own class and macro names; their remote
# exception injection and lock-marker renames are the library's design.
# Notable identity for vendored Crashpad source. Suspicious rules also consume
# it as an unless: carve-out.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  crit: component
  conf: 0.9
  size_max: 20000000

traits:
  - id: crashpad-source-identifier
    desc: Crashpad client or handler identifier in source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bCrashpad[A-Z][A-Za-z]{2,}\b|\bCRASHPAD_[A-Z_]{3,}\b'
