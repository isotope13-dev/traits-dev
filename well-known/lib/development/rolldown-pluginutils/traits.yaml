# @rolldown/pluginutils — plugin helpers for the Rolldown bundler.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Rolldown pluginutils npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@rolldown/pluginutils'

  - id: vendored-path
    desc: Vendored Rolldown pluginutils path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/@rolldown/pluginutils'
