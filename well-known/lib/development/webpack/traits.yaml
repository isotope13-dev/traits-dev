# Official webpack npm package and established ecosystem dependencies.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: webpack-package-name
    desc: Official webpack npm package name
    if:
      type: value
      path: name
      exact: webpack

  - id: vendored-path
    desc: vendored webpack package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/webpack/'

  - id: webpack-sources-dependency
    desc: webpack-sources first-party webpack dependency
    if:
      type: text
      regex: '"webpack-sources"\s*:'

  - id: webpack-node-externals-dependency
    desc: webpack-node-externals ecosystem dependency
    if:
      type: text
      regex: '"webpack-node-externals"\s*:'

  - id: webpack-manifest-plugin-dependency
    desc: Official webpack-manifest-plugin dependency
    if:
      type: text
      regex: '"webpack-manifest-plugin"\s*:'

  - id: webpack-command-dependency
    desc: webpack-command development dependency
    if:
      type: text
      regex: '"webpack-command"\s*:'

  - id: webpack-notifier-dependency
    desc: webpack-notifier build notification dependency
    if:
      type: text
      regex: '"webpack-notifier"\s*:'

  - id: no-file-system-available
    desc: webpack virtual FS unavailable error
    for: [javascript, typescript]
    if:
      type: text
      substr: 'No file system is available.'

  - id: sokra-mit-header
    desc: Tobias Koppers webpack MIT header
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Author Tobias Koppers @sokra'

  - id: enhanced-resolve-path
    desc: vendored enhanced-resolve package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/enhanced-resolve/'

  - id: webpack-sources-path
    desc: vendored webpack-sources package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/webpack-sources/'

  - id: watchpack-path
    desc: vendored watchpack package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/watchpack/'

  - id: loader-utils-path
    desc: vendored loader-utils package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/loader-utils/'

  - id: webpack-cli-path
    desc: vendored webpack-cli package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@webpack-cli/'

  - id: copy-webpack-plugin-path
    desc: vendored copy-webpack-plugin path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/copy-webpack-plugin/'

  - id: babel-loader-path
    desc: vendored babel-loader package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/babel-loader/'
