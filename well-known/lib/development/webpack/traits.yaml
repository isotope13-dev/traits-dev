# Official webpack npm package and established ecosystem dependencies.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: webpack-package-name
    desc: Official webpack npm package name
    if:
      type: value
      path: name
      exact: webpack

  - id: vendored-path
    desc: vendored webpack package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/webpack/'

  - id: webpack-sources-dependency
    desc: webpack-sources first-party webpack dependency
    if:
      type: text
      regex: '"webpack-sources"\s*:'

  - id: webpack-node-externals-dependency
    desc: webpack-node-externals ecosystem dependency
    if:
      type: text
      regex: '"webpack-node-externals"\s*:'

  - id: webpack-manifest-plugin-dependency
    desc: Official webpack-manifest-plugin dependency
    if:
      type: text
      regex: '"webpack-manifest-plugin"\s*:'

  - id: webpack-command-dependency
    desc: webpack-command development dependency
    if:
      type: text
      regex: '"webpack-command"\s*:'

  - id: webpack-notifier-dependency
    desc: webpack-notifier build notification dependency
    if:
      type: text
      regex: '"webpack-notifier"\s*:'
