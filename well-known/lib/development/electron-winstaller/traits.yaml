# electron-winstaller (electron/windows-installer) -- the canonical module for
# generating Windows installers for Electron apps. It vendors its installer
# toolchain (7z, WiX, Squirrel.Windows, NuGet) as DLL/EXE members and its
# `install` hook only runs node ./script/select-7z-arch.js to pick the right
# 7z binary for the host arch -- no network fetch, no DLL execution. A DLL
# member beside an install hook is this package's normal shape, not an
# install-time payload signal.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: electron-winstaller npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: electron-winstaller

  - id: windows-installer-repository
    desc: electron/windows-installer repository reference
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: https://github.com/electron/windows-installer

composite_rules:
  - id: electron-winstaller-tool-context
    desc: electron-winstaller installer-builder package
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: npm-package-name
      - id: windows-installer-repository
