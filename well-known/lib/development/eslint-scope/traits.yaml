# eslint-scope — ESLint scope analysis.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: eslint-scope npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'eslint-scope'

  - id: vendored-path
    desc: vendored eslint-scope package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/eslint-scope/'
  - id: scope-class
    desc: eslint-scope Scope class definition
    if:
      type: text
      substr: 'class Scope {'

composite_rules:
  - id: library
    desc: eslint-scope library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: scope-class
