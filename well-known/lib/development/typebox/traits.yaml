# Sinclair TypeBox — JSON Schema TypeScript builder.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@sinclair/typebox npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@sinclair/typebox'
  - id: vendored-path
    desc: vendored TypeBox package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@sinclair/typebox/'

composite_rules:
  - id: typebox-library
    desc: Sinclair TypeBox schema library
    any:
      - id: package-name
      - id: vendored-path
