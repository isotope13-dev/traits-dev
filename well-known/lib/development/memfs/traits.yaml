# streamich/memfs — in-memory Node filesystem.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: memfs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'memfs'

  - id: vendored-path
    desc: vendored memfs package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/memfs/'
  - id: fsa-directory-handle
    desc: memfs FileSystemDirectoryHandle class
    if:
      type: text
      substr: 'class NodeFileSystemDirectoryHandle'

composite_rules:
  - id: library
    desc: memfs library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: fsa-directory-handle
