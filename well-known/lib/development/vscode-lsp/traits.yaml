# vscode-jsonrpc / vscode-languageserver / vscode-languageclient (Microsoft LSP).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: languageclient-package-name
    desc: vscode-languageclient package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vscode-languageclient

  - id: jsonrpc-package-path
    desc: vscode-jsonrpc package member path
    for: [javascript, typescript]
    if:
      type: path
      substr: vscode-jsonrpc

  - id: languageserver-package-path
    desc: vscode-languageserver package member path
    for: [javascript, typescript]
    if:
      type: path
      substr: vscode-languageserver

  - id: languageclient-package-path
    desc: vscode-languageclient package member path
    for: [javascript, typescript]
    if:
      type: path
      substr: vscode-languageclient

  - id: languageserver-types-path
    desc: vscode-languageserver-types package path
    for: [javascript, typescript]
    if:
      type: path
      substr: vscode-languageserver-types

  - id: languageserver-protocol-path
    desc: vscode-languageserver-protocol package path
    for: [javascript, typescript]
    if:
      type: path
      substr: vscode-languageserver-protocol

  - id: microsoft-lsp-license-banner
    desc: Microsoft LSP library license banner
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Licensed under the MIT License. See License.txt in the project root'
