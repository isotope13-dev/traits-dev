# ansi-html-community — ANSI sequences to HTML.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ansi-html-community npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'ansi-html-community'

  - id: vendored-path
    desc: vendored ansi-html-community package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/ansi-html-community/'
  - id: ansihtml-export
    desc: ansiHTML converter export
    if:
      type: text
      substr: 'module.exports = ansiHTML'

composite_rules:
  - id: library
    desc: ansi-html-community library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: ansihtml-export
