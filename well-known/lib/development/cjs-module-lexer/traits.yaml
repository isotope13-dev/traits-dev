# cjs-module-lexer (Guy Bedford) — CJS named-export lexer used by Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: parse-cjs-export
    desc: cjs-module-lexer parseCJS export
    for: [javascript]
    if:
      type: text
      substr: 'module.exports.parse = parseCJS'

  - id: wasm-not-initialized
    desc: cjs-module-lexer WASM init guard
    for: [javascript]
    if:
      type: text
      substr: 'if(!A)throw new Error("Not initialized")'

  - id: package-name
    desc: cjs-module-lexer npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cjs-module-lexer

  - id: vendored-path
    desc: vendored cjs-module-lexer package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cjs-module-lexer/'

composite_rules:
  - id: cjs-module-lexer-library
    desc: cjs-module-lexer CommonJS export lexer
    any:
      - id: parse-cjs-export
      - id: wasm-not-initialized
      - id: package-name
      - id: vendored-path
