# CoffeeScript compiler (legacy npm name coffee-script; later coffeescript).
# eval, Function, and vm.RunInContext are the compile-and-run CLI; identity
# only — do not loosen interpreter traits.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 5000000

traits:
  - id: package-name
    desc: CoffeeScript npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(coffee-script|coffeescript)$'

  - id: generated-header
    desc: CoffeeScript generated-by header
    for: [javascript]
    if:
      type: text
      substr: 'Generated by CoffeeScript'

  - id: cli-banner
    desc: CoffeeScript coffee CLI usage banner
    for: [javascript]
    if:
      type: text
      substr: 'Usage: coffee [options] path/to/script.coffee'

  - id: literate-extensions
    desc: CoffeeScript literate file extension list
    for: [javascript]
    if:
      type: text
      substr: "'.coffee', '.litcoffee', '.coffee.md'"
