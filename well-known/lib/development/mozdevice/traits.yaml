# Mozilla's mozdevice library is an Android ADB test and device-management
# interface.  It can deliberately enter SELinux permissive mode while
# testing rooted or debuggable devices; that capability is expected library
# behavior, not host-defense tampering by the package itself.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python, whl, zip]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mozdevice package metadata name
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*mozdevice\s*$'

  - id: package-summary
    desc: mozdevice package summary
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Summary:\s*Mozilla-authored device management\s*$'

  - id: package-author
    desc: Mozilla automation team package author
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Author:\s*Mozilla Automation and Testing Team\s*$'

composite_rules:
  - id: mozdevice-library
    desc: Mozilla mozdevice Android ADB library
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: package-summary
      - id: package-author
