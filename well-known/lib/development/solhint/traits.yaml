# protofire/solhint — Solidity linter.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: solhint npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'solhint'

  - id: vendored-path
    desc: vendored solhint package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/solhint/'

  - id: homepage-host
    desc: solhint GitHub Pages homepage
    if:
      type: text
      substr: 'protofire.github.io/solhint'

composite_rules:
  - id: library
    desc: solhint Solidity linter
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: homepage-host
