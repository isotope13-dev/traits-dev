# chaijs/loupe — object inspect helper used by Chai.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: loupe npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: loupe

  - id: github-homepage
    desc: loupe GitHub homepage
    for: [package.json, javascript]
    if:
      type: text
      substr: github.com/chaijs/loupe

  - id: chai-loupe-weakmap-key
    desc: Chai loupe WeakMap key prefix
    for: [javascript]
    if:
      type: text
      substr: 'chai/loupe__'
