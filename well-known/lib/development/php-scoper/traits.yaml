defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: php-scoper-source-tree
    desc: PHP-Scoper source tree
    if:
      type: path
      regex: '(?i)(^|[\\/])php-scoper([\\/]|$)'

  - id: php-scoper-phpstorm-stubs-patcher
    desc: PHP-Scoper PhpStorm stubs map patcher
    if:
      type: text
      substr: PhpStormStubsMap

composite_rules:
  - id: php-scoper-patcher-context
    desc: PHP-Scoper stubs patcher context
    crit: exception
    all:
      - id: php-scoper-source-tree
      - id: php-scoper-phpstorm-stubs-patcher
