# recast — JavaScript AST pretty-printer (benjamn/recast).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: recast-package-name
    desc: recast npm package name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: recast

  - id: recast-github-repo
    desc: recast GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/benjamn/recast'
