# @pnpm/npm-conf — read npm configuration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: npm-conf npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@pnpm/npm-conf'

  - id: vendored-path
    desc: vendored npm-conf package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@pnpm/npm-conf/'

  - id: make-js-banner
    desc: npm-conf make.js generated banner
    if:
      type: text
      substr: 'Generated with `lib/make.js`'

composite_rules:
  - id: library
    desc: pnpm npm-conf reader
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: make-js-banner
