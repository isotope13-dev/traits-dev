---
# PHP-CS-Fixer is a legitimate PHP formatter. Its source contains examples
# and fixer logic that mention eval() and pack() without being a payload.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php, composer.json]

traits:
  - id: php-cs-fixer-package-name
    desc: PHP-CS-Fixer Composer package identity
    conf: 1.0
    for: [composer.json]
    if:
      type: value
      path: name
      exact: friendsofphp/php-cs-fixer

  - id: php-cs-fixer-source-tree
    desc: PHP-CS-Fixer source tree
    conf: 0.99
    for: [php]
    if:
      type: path
      substr: PHP-CS-Fixer-PHP-CS-Fixer-

  - id: php-cs-fixer-config-file
    desc: PHP-CS-Fixer project config file
    conf: 0.99
    for: [php]
    if:
      type: text
      substr: PHP Code Style Fixer

  - id: php-cs-fixer-executable-path
    desc: PHP-CS-Fixer executable or PHAR path
    conf: 0.99
    for: [php]
    if:
      type: path
      basename: true
      regex: '^php-cs-fixer(\.phar)?$'

  - id: php-cs-fixer-tree-path
    desc: File within a php-cs-fixer tree
    conf: 0.99
    for: [php]
    if:
      type: path
      regex: '(?i)(^|[\\/])php-cs-fixer(\.phar)?([\\/]|$)'

  - id: php-cs-fixer-namespace
    desc: PHP-CS-Fixer namespace declaration
    conf: 0.99
    for: [php]
    if:
      type: text
      regex: 'namespace\s+PhpCsFixer\b'


