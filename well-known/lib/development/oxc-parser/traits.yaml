# Oxc JavaScript/TypeScript parser — Rust napi-rs native bindings per platform.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json, npm, elf, so, dylib, pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: oxc-parser-package-name
    desc: Oxc parser npm binding package name
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@oxc-parser/binding-'

  - id: oxc-project-repository
    desc: Oxc project GitHub repository URL
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/oxc-project/oxc

  - id: oxc-parser-native-addon-basename
    desc: Oxc parser platform native addon basename
    size_min: 65536
    size_max: 50000000
    for: [elf, so, dylib, pe, dll]
    if:
      type: basename
      regex: '^parser\.(linux|darwin|win32)-'

composite_rules:
  - id: oxc-parser-binding
    desc: Oxc parser platform native binding package
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: oxc-parser-package-name
      - id: oxc-project-repository
      - id: oxc-parser-native-addon-basename


  # Exception suppressor for ELF mmap/mprotect loaders that are napi-rs bindings.
  - id: oxc-parser-native-binding-context
    desc: Oxc parser native binding benign context
    crit: exception
    conf: 0.99
    for: [elf, so, dylib, pe, dll]
    any:
      - id: oxc-parser-package-name
      - id: oxc-parser-native-addon-basename
      - id: oxc-parser-binding

