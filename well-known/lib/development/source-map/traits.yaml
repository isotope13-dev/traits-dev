# mozilla/source-map — VLQ source map library.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: source-map npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: source-map

  - id: vendored-path
    desc: vendored source-map package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/source-map/'
