# Zig ships its std library, bundled libc headers, libc++, and sanitizer
# sources under lib/zig/. Those trees contain process/network/syscall
# vocabulary that otherwise looks dual-use when scanned out of context.
#
# Path atoms stay shallow (≤2 '/' separators) so they still match when the
# same bytes are scanned inside an archive or extracted to disk.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  size_max: 5000000

traits:
  - id: zig-lib-tree-path
    desc: Zig lib/zig tree path fragment
    conf: 0.97
    for: [zig, c, cpp, javascript, scripts]
    if:
      type: path
      regex: '(?i)lib/zig'

  - id: zig-std-tree-path
    desc: Zig std library path fragment
    conf: 0.96
    for: [zig, c, cpp, javascript, scripts]
    if:
      type: path
      regex: '(?i)zig/std'

  - id: zig-libc-tree-path
    desc: Zig bundled libc path fragment
    conf: 0.96
    for: [c, cpp, scripts]
    if:
      type: path
      regex: '(?i)zig/libc'

  - id: zig-libcxx-tree-path
    desc: Zig bundled libc++ path fragment
    conf: 0.96
    for: [c, cpp, javascript, scripts]
    if:
      type: path
      regex: '(?i)zig/libcxx'

  - id: zig-libtsan-tree-path
    desc: Zig bundled libtsan path fragment
    conf: 0.96
    for: [c, cpp, scripts]
    if:
      type: path
      regex: '(?i)zig/libtsan'

  - id: zig-h-basename
    desc: Zig C header basename
    conf: 0.95
    for: [c, cpp]
    if:
      type: path
      basename: true
      exact: zig.h
      case_insensitive: true

  - id: zig-builtin-import
    desc: Zig @import builtin module reference
    conf: 0.96
    for: [zig]
    if:
      type: text
      regex: '@import\("builtin"\)'

  - id: zig-std-zig-import
    desc: Zig std.zig module import
    conf: 0.96
    for: [zig]
    if:
      type: text
      regex: '@import\("std\.zig"\)'

  - id: zig-lang-issue-url
    desc: Zig language GitHub issue URL
    conf: 0.97
    for: [zig, c, cpp, javascript, scripts]
    if:
      type: text
      regex: '(?i)github\.com/ziglang/zig'

  - id: zig-c-backend-macro
    desc: Zig C backend compiler macro marker
    conf: 0.98
    for: [c, cpp]
    if:
      type: text
      regex: '#define\s+zig_(msvc|clang|gcc|gnuc|aarch64|arm)\b'

  - id: zig-libcxx-header-guard
    desc: libc++ header guard in Zig tree
    conf: 0.95
    for: [c, cpp, javascript, scripts]
    if:
      type: text
      regex: '#ifndef\s+_LIBCPP_[A-Z0-9_]+'

composite_rules:
  - id: zig-stdlib-source-identity
    desc: Zig standard library source identity
    conf: 0.97
    for: [zig]
    all:
      - id: zig-lib-tree-path
    any:
      - id: zig-builtin-import
      - id: zig-std-zig-import
      - id: zig-lang-issue-url
      - id: zig-std-tree-path

  - id: zig-bundled-c-support-identity
    desc: Zig bundled C/C++ support library identity
    conf: 0.96
    for: [c, cpp, javascript, scripts]
    all:
      - id: zig-lib-tree-path
    any:
      - id: zig-c-backend-macro
      - id: zig-libcxx-header-guard
      - id: zig-libc-tree-path
      - id: zig-libcxx-tree-path
      - id: zig-libtsan-tree-path
      - id: zig-h-basename
      - id: zig-lang-issue-url
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
