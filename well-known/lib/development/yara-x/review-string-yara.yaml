# YARA-X name and module-path references do not alone prove the engine is linked.
defaults:
  size_min: 1
  platforms: [unix, windows]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: yara-x-engine-marker
    desc: YARA-X engine name reference
    if:
      type: text
      section: .rodata
      substr: YARA-X
  # Go binaries keep the module path in .rodata. The uppercase "YARA-X"
  # immediate often lives in .text, so the section-scoped marker above misses
  # the engine that actually linked the rules.
  - id: yara-x-go-module
    desc: YARA-X Go module path reference
    if:
      type: text
      section: .rodata
      substr: github.com/VirusTotal/yara-x
