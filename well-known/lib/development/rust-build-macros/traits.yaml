# Rust proc-macro crates that reach the build environment or the process table
# while the compiler runs. Two shapes land here and both look like an install
# hook to a rule that only sees `proc_macro_derive` next to `Command::new`:
#
#   * build-introspection crates (vergen, shadow-rs, git-testament) that shell
#     out to git or the toolchain to stamp version metadata into the caller;
#   * macros that *emit* a `std::process::Command` into the caller's crate --
#     magiclen's `execute-command-macro-impl` is a `quote!` template and never
#     runs anything itself -- or that *do* run a helper during expansion
#     because that is the documented build step, as `cpp_macros` executes
#     rust-cpp's `print_sizes` probe to learn C++ type layouts.
#
# This is an exception context, not a claim that arbitrary proc-macro process
# execution is benign. Matched on the versioned crate directory, the way
# well-known/lib/testing/cargo-test-macro does: the proc-macro rules fire on
# src/lib.rs, where a Cargo.toml-gated identity composite cannot reach.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_max: 20000000

traits:
  - id: rust-build-macro-crate-context
    desc: Known Rust build-introspection macro crate
    for: [rust, crate, cargo.toml, archives, tar]
    if:
      type: path
      regex: '(?i)(git-testament-derive|rbtag_derive|vergen|shadow-rs)'

  - id: execute-command-macro-package-name
    desc: execute-command-macro package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^execute-command-macro(-impl)?$'

  - id: execute-command-macro-source-path
    desc: execute-command-macro source tree path
    for: [rust]
    if:
      type: path
      regex: 'execute-command-macro(-impl)?-[0-9]'

  - id: cpp-macros-package-name
    desc: rust-cpp macro package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: cpp_macros

  - id: cpp-macros-source-path
    desc: rust-cpp macro source tree path
    for: [rust]
    if:
      type: path
      regex: 'cpp_macros-[0-9]'
