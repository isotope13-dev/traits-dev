# Known Rust proc-macro crates that inspect the build environment or process
# table as part of code generation. This is an exception context, not a claim
# that arbitrary proc-macro process execution is benign.
defaults:
  platforms: [unix, windows]
  for: [rust, crate, cargo.toml, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: rust-build-macro-crate-context
    desc: Known Rust build-introspection macro crate
    if:
      type: path
      regex: '(?i)(git-testament-derive|rbtag_derive|vergen|shadow-rs)'
