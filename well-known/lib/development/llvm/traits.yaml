defaults:
  platforms: [windows]
  for: [pe]
  size_min: 100000
  size_max: 67108864

traits:
  - id: llvm-product-name
    desc: LLVM tool product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: LLVM

  - id: clang-product-name
    desc: Clang tool product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: clang

  - id: llvm-objdump-internal-name
    desc: LLVM objdump internal tool name
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: llvm-objdump

  - id: clang-offload-packager-basename
    desc: Clang offload packager executable name
    crit: component
    conf: 0.99
    if:
      type: path
      basename: true
      exact: clang-offload-packager.exe

  - id: llvm-openmp-runtime-basename
    desc: LLVM OpenMP runtime DLL basename
    crit: component
    conf: 0.99
    for: [pe, dll]
    size_min: 100000
    size_max: 4194304
    if:
      type: path
      basename: true
      regex: '^libomp[0-9]+\.x86_64\.dll$'

  - id: llvm-openmp-runtime-product
    desc: LLVM OpenMP runtime product metadata
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      exact: 'LLVM* OpenMP* Runtime Library'

  - id: llvm-openmp-runtime-export
    desc: LLVM OpenMP runtime API export
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: export
      regex: '^(omp_|__kmpc_)'

composite_rules:
  - id: llvm-toolchain-binary
    desc: LLVM or Clang toolchain binary
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: llvm-product-name
      - id: clang-product-name
      - id: llvm-objdump-internal-name
      - id: clang-offload-packager-basename

  - id: llvm-openmp-runtime-library
    desc: LLVM OpenMP runtime library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: llvm-openmp-runtime-basename
      - id: llvm-openmp-runtime-product
      - id: llvm-openmp-runtime-export
