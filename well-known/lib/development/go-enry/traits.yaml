# go-enry is the Go port of GitHub linguist. Its compiled language tables
# list shell rc files (.bashrc, .zshrc), crontab and systemd unit names as
# source-file types, so code-indexing tools carry those strings as data.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, go, go.mod]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 536870912

traits:
  - id: go-enry-module
    desc: go-enry language-detection module path
    if:
      type: text
      substr: github.com/go-enry/go-enry/
