defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    for: [package.json]
    desc: js-beautify package identity
    if:
      type: value
      path: name
      exact: js-beautify
  - id: package-path
    desc: js-beautify package member path
    for: [javascript, scripts, manifests, data, source]
    if:
      type: path
      regex: '(?i)(^|[/\\])js-beautify([-_.]|[/\\]|$)'
  - id: cli-banner
    desc: js-beautify Node.js CLI banner
    for: [javascript]
    if:
      type: text
      substr: 'Js-Beautify Command-line for node.js'
  - id: packer-unpacker-implementation
    desc: js-beautify Packer unpacker implementation
    for: [javascript]
    if:
      type: text
      substr: 'var P_A_C_K_E_R ='
  - id: python-package-path
    desc: jsbeautifier Python package member path
    for: [python]
    if:
      type: path
      regex: '(^|[/\\])jsbeautifier[/\\]'
