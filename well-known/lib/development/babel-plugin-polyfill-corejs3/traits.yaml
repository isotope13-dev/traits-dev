# babel-plugin-polyfill-corejs3 — core-js polyfills.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: babel-plugin-polyfill-corejs3 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: babel-plugin-polyfill-corejs3

  - id: vendored-path
    desc: vendored babel-plugin-polyfill-corejs3 package p
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/babel-plugin-polyfill-corejs3/'


composite_rules:
  - id: babel-plugin-polyfill-corejs3-library
    desc: Babel core-js3 polyfill plugin
    any:
      - id: package-name
      - id: vendored-path
