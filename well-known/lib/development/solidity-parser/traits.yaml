# @solidity-parser/parser — ANTLR Solidity parser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@solidity-parser/parser'

  - id: vendored-path
    desc: vendored parser package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@solidity-parser/parser/'

composite_rules:
  - id: library
    desc: Solidity ANTLR parser
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
