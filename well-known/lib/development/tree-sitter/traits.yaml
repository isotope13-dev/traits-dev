defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, so, dylib, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 8388608
traits:
  - id: tree-sitter-grammar-library
    desc: Tree-sitter parser grammar library
    if:
      type: symbol
      kind: export
      regex: '^_?tree_sitter_[a-z0-9_]+$'
  - id: tree-sitter-grammar-source
    desc: Tree-sitter grammar DSL source
    for: [javascript, typescript]
    size_min: 0
    size_max: 5000000
    if:
      type: text
      substr: 'module.exports = grammar('
