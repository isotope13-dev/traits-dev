# feng3d — Chinese WebGPU 3D engine ecosystem (gitee.com/feng3d).
# Addons and math packages are explicit three.js ports, not plugin droppers.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: npm-scope-package-name
    desc: feng3d scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@feng3d/'

  - id: gitee-repository-url
    desc: feng3d Gitee repository URL
    if:
      type: text
      regex: '(?i)gitee\.com/feng3d/'

  - id: threejs-addons-port-reference
    desc: feng3d three.js addons port reference
    if:
      type: text
      regex: '(?i)three\.js addons/'

composite_rules:
  - id: feng3d-ecosystem-identity
    desc: feng3d 3D engine ecosystem identity
    crit: notable
    conf: 0.98
    for: [package.json]
    all:
      - id: npm-scope-package-name
      - id: gitee-repository-url
