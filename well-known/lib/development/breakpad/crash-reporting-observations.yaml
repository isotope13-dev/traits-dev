# Google Breakpad crash-reporting library markers
# https://chromium.googlesource.com/breakpad/breakpad
# Present in any application that links the Breakpad crash reporter.
defaults:
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
  - id: crashreportsender-symbol
    crit: notable
    desc: Breakpad CrashReportSender symbol text
    if:
      type: text
      substr: "google_breakpad::CrashReportSender::SendCrashReport"
      section: ".rdata"

composite_rules:
  - id: crashreportsender
    desc: Breakpad CrashReportSender library references
    crit: notable
    conf: 0.99
    all:
      - id: crashreportsender-symbol
      - id: metadata/lang/source/naming/source-text::crashreportsender-file
