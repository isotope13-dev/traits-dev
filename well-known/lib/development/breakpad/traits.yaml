defaults:
  platforms: [unix]
  for: [c, cpp, objc]
  crit: component
  conf: 0.99

traits:
  - id: ignore-debugger-variable
    desc: Breakpad ignore-debugger setting
    if:
      type: text
      word: BREAKPAD_IGNORE_DEBUGGER

  - id: exception-handler-type
    desc: Breakpad ExceptionHandler type
    if:
      type: text
      substr: google_breakpad::ExceptionHandler

composite_rules:
  - id: mac-source-context
    desc: Google Breakpad macOS source context
    crit: notable
    conf: 0.99
    near_lines: 180
    all:
      - id: ignore-debugger-variable
      - id: exception-handler-type
