# modernc.org/ccorpus2 — embedded C compiler test corpus (git, postgres,
# redis, CompCert tarballs used as parse fixtures, not production code).
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod, tar, tar.gz]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 500000000

traits:
  - id: module-path
    desc: modernc ccorpus2 Go module path
    if:
      type: text
      substr: modernc.org/ccorpus2

  - id: zip-basename
    desc: modernc ccorpus2 module zip name
    for: [zip]
    if:
      type: basename
      regex: 'modernc\.org_ccorpus2'

  - id: archive-member-prefix
    desc: modernc ccorpus2 archive member prefix
    for: [zip, gem, tar, tar.gz]
    if:
      type: value
      path: archive.members[*].path
      regex: '^modernc\.org/ccorpus2@'

  - id: source-archive-path
    desc: modernc ccorpus2 module source path
    for: [go, zip, tar, tar.gz, c, cpp, shell, text, scripts, source, archives]
    if:
      type: path
      regex: 'modernc\.org[/_]ccorpus2'

composite_rules:
  - id: package-context
    desc: modernc ccorpus2 corpus package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: zip-basename
      - id: archive-member-prefix
      - id: module-path
      - id: source-archive-path
