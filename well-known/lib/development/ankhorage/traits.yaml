# Ankhorage packages published under the @ankhorage/ scope.
# The Ankhorage orchestrator ecosystem ships scoped npm modules (for example
# @ankhorage/orchestrator-module-expo-google-fonts) from individual
# github.com/ankhorage/* repositories. Those manifests often omit an author
# field while still carrying full repository, homepage, and license metadata.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Ankhorage scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@ankhorage/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Ankhorage scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@ankhorage/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Ankhorage GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/ankhorage/[a-z0-9._-]+(\.git)?$'

  - id: github-repository-url
    desc: Ankhorage GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/ankhorage/[a-z0-9._-]+(\.git)?$'

  - id: github-npm-repository-url
    desc: Ankhorage GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/ankhorage/[a-z0-9._-]+(\.git)?$'

composite_rules:
  - id: official-package-scope
    desc: Ankhorage official package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Ankhorage official package repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Ankhorage package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo

  - id: package-identity
    desc: Ankhorage orchestrator package identity
    crit: notable
    all:
      - id: scoped-package-identity
    any:
      - id: github-repository-string
      - id: github-repository-url
