defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: phpstan-phar-basename
    desc: PHPStan PHAR basename
    for: [php]
    size_min: 1000000
    size_max: 50000000
    if:
      type: basename
      exact: phpstan.phar

  - id: phpstan-src-composer-package
    desc: PHPStan source Composer package
    for: [composer.json]
    conf: 1.0
    if:
      type: value
      path: name
      exact: phpstan/phpstan-src

  - id: phpstan-composer-package
    desc: PHPStan Composer package
    for: [composer.json]
    conf: 1.0
    if:
      type: value
      path: name
      exact: phpstan/phpstan

  - id: phpstan-namespace
    desc: PHPStan namespace declaration
    for: [php]
    conf: 0.99
    if:
      type: text
      regex: 'namespace\s+PHPStan\b'

  - id: phpstan-assert-type-test
    desc: PHPStan NSRT assertion test fixture
    for: [php]
    if:
      type: text
      regex: 'PHPStan\\Testing\\assert(Native)?Type'

