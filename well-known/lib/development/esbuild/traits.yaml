# esbuild — official JavaScript/CSS bundler (https://github.com/evanw/esbuild).
# install.js downloads platform-native binaries via HTTPS and validates them.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: esbuild npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: esbuild

  - id: archive-package-name
    desc: esbuild npm archive package name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: esbuild

  - id: postinstall-script
    desc: esbuild postinstall install.js hook
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      exact: node install.js

  - id: install-binary-hashes
    desc: esbuild install.js binary hash table
    for: [javascript]
    if:
      type: text
      substr: esbuild.binaryHashes

  - id: upstream-repository
    desc: esbuild upstream GitHub repository
    if:
      type: text
      substr: github.com/evanw/esbuild

composite_rules:
  - id: esbuild-npm-context
    desc: esbuild npm package context
    any:
      - id: package-name
      - id: archive-package-name

  - id: esbuild-package-identity
    desc: Recognized esbuild npm package
    crit: notable
    conf: 0.99
    all:
      - id: esbuild-npm-context
      - id: postinstall-script
      - id: install-binary-hashes
