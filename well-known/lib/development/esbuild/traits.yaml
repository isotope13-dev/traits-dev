# esbuild — official JavaScript/CSS bundler (https://github.com/evanw/esbuild).
# install.js downloads platform-native binaries via HTTPS and validates them.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: esbuild npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: esbuild

  - id: platform-package-name
    desc: esbuild platform binary package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^esbuild-[a-z0-9-]+-(32|64|arm64|x64)$'

  - id: go-binary-identity
    desc: esbuild Go command binary identity
    for: [elf]
    size_min: 262144
    size_max: 67108864
    if:
      type: value
      path: elf.go.path
      exact: github.com/evanw/esbuild/cmd/esbuild

  - id: archive-package-name
    desc: esbuild npm archive package name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: esbuild

  - id: install-binary-hashes
    desc: esbuild install.js binary hash table
    for: [javascript]
    if:
      type: text
      substr: esbuild.binaryHashes

  - id: upstream-repository
    desc: esbuild upstream GitHub repository
    if:
      type: text
      substr: github.com/evanw/esbuild

composite_rules:
  - id: esbuild-npm-context
    desc: esbuild npm package context
    any:
      - id: package-name
      - id: archive-package-name

  - id: esbuild-package-identity
    desc: Recognized esbuild npm package
    crit: notable
    conf: 0.99
    all:
      - id: esbuild-npm-context
      - id: install-binary-hashes
