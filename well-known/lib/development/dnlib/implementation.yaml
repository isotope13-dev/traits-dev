# Match defined implementation methods, rather than dnlib references in a
# consumer such as a debugger, decompiler, or malware builder.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  size_min: 1024
  size_max: 20000000
  crit: notable
traits:
  - id: dnlib-module-reader-implementation
    desc: dnlib managed-module reader implementation
    conf: 0.99
    if:
      type: symbol
      kind: function
      exact: dnlib.DotNet.ModuleDefMD.Load
