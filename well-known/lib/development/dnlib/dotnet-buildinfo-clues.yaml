defaults:
  for: [csharp]
  platforms: [windows]
traits:
  - id: dnlib-dotnet-import
    desc: dnlib .NET import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '^dnlib\.DotNet(\.Emit)?$'
  - id: dnlib-module-load-call
    desc: dnlib module load call
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: ModuleDefMD.Load
composite_rules:
  - id: dnlib-module-string-buildinfo-clues
    desc: dnlib module, string and BuildInfo clues
    crit: notable
    conf: 0.97
    all:
      - id: well-known/lib/development/dnlib::dnlib-dotnet-import
      - id: well-known/lib/development/dnlib::dnlib-module-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/instruction::dotnet-ldstr-operand-text
      - id: metadata/lang/source/naming/record::buildinfo-selected-field-clues
    any:
      - id: micro-behaviors/fs/path/file::client-bin-literal
      - id: objectives/command-and-control/backdoor/control/hvnc::hvnc-browser-title-source
