# Halide — MIT embedded C++ language for image/array pipelines.
# HelloAndroidCamera2 is the Camera2 sample that runs Halide filters on
# live frames; Hexagon remote bins are the DSP runtime, not an implant.
defaults:
  platforms: [unix, windows, android]
  for: [tar, archives, text, cpp, c, java]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 200000000

traits:
  - id: cmake-project
    desc: Halide CMake project declaration
    for: [text]
    conf: 0.99
    if:
      type: text
      substr: 'project(Halide'

  - id: cmake-homepage
    desc: halide-lang.org CMake homepage URL
    for: [text]
    conf: 0.98
    if:
      type: text
      substr: https://halide-lang.org

  - id: source-tree
    desc: Halide versioned source tree path
    for: [tar, archives, text, cpp, java]
    conf: 0.97
    if:
      type: path
      regex: '(?i)(^|[\\/])Halide-[0-9]'
