# robolectric/robolectric-gradle-plugin — configures Android Gradle
# test tasks for Robolectric. Bundled gradlew is the Gradle wrapper.
defaults:
  platforms: [unix, windows]
  for: [groovy, markdown, archives, tar, text, shell]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 20000000

traits:
  - id: github-repo
    desc: robolectric-gradle-plugin GitHub repository
    if:
      type: text
      substr: github.com/robolectric/robolectric-gradle-plugin

  - id: plugin-class
    desc: Robolectric Gradle plugin class
    for: [groovy, text]
    if:
      type: text
      substr: org.robolectric.gradle.RobolectricPlugin

  - id: source-path
    desc: robolectric-gradle-plugin source path
    if:
      type: path
      regex: '(?i)(^|[\\/])robolectric-gradle-plugin'
