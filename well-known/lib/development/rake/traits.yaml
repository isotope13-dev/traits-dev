defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: rake-source-path
    desc: Rake library source path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])rake([\\/]|\.rb$)'

  - id: rake-module-marker
    desc: Rake Ruby module marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bmodule\s+Rake\b|\bRake::Application\b'

composite_rules:
  - id: rake-library
    desc: Rake Ruby build-task library
    crit: notable
    conf: 0.98
    all:
      - id: rake-source-path
      - id: rake-module-marker
