# Psalm static analysis PHAR shipped in PHP project dev tooling.
defaults:
  platforms: [unix, windows]
  for: [php, archives]
  crit: baseline
  conf: 0.96

traits:
  - id: psalm-phar-path
    desc: Psalm PHAR in tools/phar directory
    if:
      type: path
      regex: '(?i)tools[/+]phar[/+]psalm$'

  - id: psalm-namespace-marker
    desc: Psalm static analysis namespace marker
    if:
      type: text
      substr: namespace Psalm

composite_rules:
  - id: psalm-phar-tool
    desc: Psalm static analysis PHAR tool
    crit: notable
    all:
      - id: psalm-phar-path
    any:
      - id: psalm-namespace-marker
