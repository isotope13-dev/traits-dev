# Red Hat developer VS Code packages.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: telemetry-package-name
    desc: vscode-redhat-telemetry package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@redhat-developer/vscode-redhat-telemetry'
  - id: proposals-package-name
    desc: vscode-extension-proposals package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@redhat-developer/vscode-extension-proposals'
  - id: vendored-path
    desc: vendored redhat-vscode package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@redhat-developer/'

composite_rules:
  - id: redhat-vscode-library
    desc: Red Hat VS Code helper packages
    any:
      - id: telemetry-package-name
      - id: proposals-package-name
      - id: vendored-path
