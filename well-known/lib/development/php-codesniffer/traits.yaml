defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: php-codesniffer-php-token-path
    desc: PHP_CodeSniffer PHP-Token source path
    crit: component
    if:
      type: path
      regex: '(?i)php-codesniffer-php-token'
  - id: phpcsstandards-source-root
    desc: PHP_CodeSniffer source tree root
    crit: component
    if:
      type: path
      regex: 'PHPCSStandards-PHP_CodeSniffer-[^\\/]+'

composite_rules:
  - id: php-codesniffer-library
    desc: PHP_CodeSniffer source library
    any:
      - id: php-codesniffer-php-token-path
      - id: phpcsstandards-source-root
