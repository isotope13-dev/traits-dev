# Identity for the official Sass npm package.  This is provenance context;
# install hooks, native dependencies, network access, and process execution
# still require their own behavioral evidence.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Sass npm package name
    if:
      type: value
      path: name
      exact: sass

  - id: source-repository
    desc: Sass official source repository
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/sass/dart-sass/?$'

composite_rules:
  - id: official-package
    desc: Official Sass JavaScript package identity
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: source-repository
