# MSI Wrapper custom-action modules are ordinary installer support code.  The
# runtime banner and module name together identify the framework whose helper
# legitimately extracts resources, edits installer state, and launches setup.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: msi-wrapper-runtime-banner
    desc: MSI Wrapper runtime banner
    if:
      type: text
      section: .rdata
      substr: UNREGISTERED - Wrapped using MSI Wrapper from www.exemsi.com

  - id: msi-wrapper-custom-action-module
    desc: MSI Wrapper custom-action module marker
    if:
      type: text
      section: .rdata
      exact: MsiCustomActions.dll

composite_rules:
  - id: msi-wrapper-custom-action-context
    desc: Recognized MSI Wrapper custom-action context
    crit: exception
    conf: 0.99
    all:
      - id: msi-wrapper-runtime-banner
      - id: msi-wrapper-custom-action-module
