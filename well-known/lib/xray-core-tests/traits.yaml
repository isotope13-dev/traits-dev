# Xray-core outbound unit-test identity.  These tests exercise handler
# bookkeeping and statistics; they are not an operational proxy component.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: outbound-without-stat-test
    desc: Outbound uninstrumented test marker
    crit: component
    if:
      type: function
      exact: TestOutboundWithoutStatCounter

  - id: outbound-with-stat-test
    desc: Outbound statistics test marker
    crit: component
    if:
      type: function
      exact: TestOutboundWithStatCounter

  - id: outbound-tags-cache-test
    desc: Outbound cache test marker
    crit: component
    if:
      type: function
      exact: TestTagsCache

  - id: custom-udp-match-test
    desc: Custom UDP DSL match test marker
    crit: component
    if:
      type: function
      exact: TestDSLUDPServerMatchCapturesSavedValues

  - id: custom-udp-malformed-reference-test
    desc: Custom UDP malformed-reference test marker
    crit: component
    if:
      type: function
      exact: TestDSLUDPServerRejectsMalformedVarReference

  - id: quic-sniffer-package-import
    desc: Xray QUIC sniffer package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/protocol/quic'

  - id: quic-sniffer-test
    desc: Xray QUIC sniffer test marker
    crit: component
    if:
      type: function
      exact: TestSniffQUIC

  - id: quic-sniffer-complex-test
    desc: Xray QUIC sniffer edge-case test marker
    crit: component
    if:
      type: function
      exact: TestSniffQUICComplex

  - id: transport-internet-package-import
    desc: Xray transport internet package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/transport/internet'

  - id: finalmask-custom-header-import
    desc: Xray custom Finalmask header package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/transport/internet/finalmask/header/custom'

  - id: socket-config-test
    desc: Xray transport socket configuration test
    crit: component
    if:
      type: function
      exact: TestSocketConfig

  - id: custom-udp-header-tests
    desc: Xray custom UDP header builder tests
    crit: component
    if:
      type: function
      regex: '^TestHeaderCustom[A-Z][A-Za-z0-9_]*Build'

  - id: marshal-account-test
    desc: Xray Shadowsocks account marshal test marker
    crit: component
    if:
      type: function
      exact: TestMashalAccount

  - id: marshal-struct-test
    desc: Xray struct marshal test marker
    crit: component
    if:
      type: function
      exact: TestMashalStruct

  - id: marshal-config-json-test
    desc: Xray configuration JSON marshal test marker
    crit: component
    if:
      type: function
      exact: TestMarshalConfigJson

  - id: shadowsocks-package-import
    desc: Xray Shadowsocks proxy package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/proxy/shadowsocks'

composite_rules:
  - id: outbound-handler-tests
    desc: Xray outbound handler tests
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-proxyman-package-import
      - id: well-known/lib/xray-core::xray-outbound-feature-import
      - id: outbound-without-stat-test
      - id: outbound-with-stat-test
      - id: outbound-tags-cache-test

  - id: custom-udp-dsl-tests
    desc: Xray custom UDP DSL unit tests
    crit: notable
    conf: 1.0
    all:
      - id: custom-udp-match-test
      - id: custom-udp-malformed-reference-test
      - id: metadata/package/testing/harness/unit::go-test

  - id: quic-sniffer-tests
    desc: Xray QUIC SNI sniffer unit tests
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: quic-sniffer-package-import
      - id: quic-sniffer-test
      - id: quic-sniffer-complex-test
      - id: metadata/package/testing/harness/unit::go-test

  - id: transport-configuration-tests
    desc: Xray transport and custom-header unit tests
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: transport-internet-package-import
      - id: finalmask-custom-header-import
      - id: socket-config-test
      - id: custom-udp-header-tests
      - id: metadata/package/testing/harness/unit::go-test

  - id: marshal-json-tests
    desc: Xray Shadowsocks and configuration JSON marshal tests
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: marshal-account-test
      - id: marshal-struct-test
      - id: marshal-config-json-test
      - id: shadowsocks-package-import
      - id: metadata/package/testing/harness/unit::go-test
