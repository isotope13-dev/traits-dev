# Xray-core outbound unit-test identity.  These tests exercise handler
# bookkeeping and statistics; they are not an operational proxy component.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: outbound-without-stat-test
    desc: Outbound uninstrumented test marker
    crit: component
    if:
      type: function
      exact: TestOutboundWithoutStatCounter

  - id: outbound-with-stat-test
    desc: Outbound statistics test marker
    crit: component
    if:
      type: function
      exact: TestOutboundWithStatCounter

  - id: outbound-tags-cache-test
    desc: Outbound cache test marker
    crit: component
    if:
      type: function
      exact: TestTagsCache

composite_rules:
  - id: outbound-handler-tests
    desc: Xray outbound handler tests
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-proxyman-package-import
      - id: well-known/lib/xray-core::xray-outbound-feature-import
      - id: outbound-without-stat-test
      - id: outbound-with-stat-test
      - id: outbound-tags-cache-test
