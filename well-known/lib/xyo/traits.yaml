# XYO provider packages import application-supplied peer APIs. The imports are
# visible in the published bundle and the matching peer declarations are in the
# same package manifest; this is a normal plugin/provider dependency boundary.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]

traits:
  - id: xyo-provider-package
    desc: XYO XL1 S3 provider package identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::name
      exact: '@xyo-network/xl1-s3-providers'

  - id: xyo-repository
    desc: XYO protocol repository metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::repository.url
      regex: '(?i)github\.com/XYOracleNetwork/xl1-protocol(\.git)?$'

  - id: xyo-peer-ariestools
    desc: XYO package peer SDK declaration
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::peerDependencies.@ariestools/sdk
      exists: true

  - id: xyo-peer-sdk
    desc: XYO package peer protocol SDK declaration
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::peerDependencies.@xyo-network/sdk
      exists: true

  - id: xyo-peer-mutex
    desc: XYO package peer mutex declaration
    crit: notable
    conf: 0.99
    if:
      type: value
      path: package.json::peerDependencies.async-mutex
      exists: true

composite_rules:
  - id: xyo-peer-package-context
    desc: XYO provider peer dependency context
    crit: exception
    conf: 0.99
    all:
      - id: xyo-provider-package
      - id: xyo-repository
      - id: xyo-peer-ariestools
      - id: xyo-peer-sdk
      - id: xyo-peer-mutex
