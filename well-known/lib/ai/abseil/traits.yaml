# Abseil (abseil-cpp) is Google's C++ standard-library extension and one of the
# most widely vendored C++ dependencies — gRPC, protobuf, RE2, TensorFlow and
# Chromium all ship a copy — so its sources turn up constantly inside scanned
# archives, and on their own (a lone `absl/functional/internal/any_invocable.h`
# pulled out of a feed) with no identity at all: template-metaprogramming
# headers call nothing, so nothing else in the trait set has anything to say
# about them.
#
# ABSL_NAMESPACE_BEGIN is the inline-namespace macro that opens every Abseil
# header and translation unit. It is defined by absl/base/config.h, is spelled
# out verbatim in the source (no other project uses the token), and survives
# the file being extracted from its tree, so it identifies Abseil on content
# rather than on an `absl/` path that a repackager can drop.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: abseil-source-namespace-macro
    desc: Abseil C++ source (ABSL_NAMESPACE_BEGIN macro)
    if:
      type: text
      word: ABSL_NAMESPACE_BEGIN

  # Relocated from well-known/lib/core/re2/, where it was filed because the sample
  # that prompted it was an RE2 tarball with Abseil vendored inside it.
  # macos_xcode_bazel.sh is an abseil-cpp ci/ script, so the identity it
  # establishes is Abseil's, not RE2's.
  - id: abseil-vendored-ci-script
    desc: Vendored Abseil CI script
    for: [shell]
    if:
      type: path
      basename: true
      exact: macos_xcode_bazel.sh
