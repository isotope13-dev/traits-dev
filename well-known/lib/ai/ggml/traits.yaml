defaults:
  platforms: [windows, unix]
  for: [c, cpp, javascript, text]

traits:
  - id: ggml-source-path
    desc: ggml native inference source path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])ggml'

  - id: ggml-source-marker
    desc: ggml native inference source marker
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: ggml
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      # A whole-file Base64 ciphertext module contains every short token by
      # chance. mathsbase's encrypted stage matched "ggml" inside one blob.
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only

  - id: ggml-shared-library-basename
    desc: ggml inference shared library basename
    crit: notable
    conf: 0.99
    for: [elf, dll, pe]
    size_min: 65536
    size_max: 67108864
    if:
      type: path
      basename: true
      regex: '^libggml.*\.so'

  - id: ggml-binary-backend-marker
    desc: ggml native backend function marker
    crit: notable
    conf: 0.99
    for: [elf, so]
    size_min: 65536
    if:
      type: text
      section: .rodata
      exact: ggml_backend_score

  - id: ggml-backtrace-disable-env
    desc: ggml backtrace-disable environment marker
    crit: notable
    conf: 0.99
    for: [elf, so]
    size_min: 65536
    if:
      type: text
      section: .rodata
      # substr: linked binaries merge rodata C strings into one blob, so a
      # whole-value exact match cannot hit the token inside (seen in a
      # whisper.cpp-bundled ggml that carries the token yet missed).
      substr: GGML_NO_BACKTRACE

  - id: llama-cpp-cmake-project
    desc: llama.cpp CMake project declaration
    crit: notable
    conf: 0.99
    for: [c, cpp]
    if:
      type: text
      regex: 'project\("llama\.cpp"\s+C\s+CXX\)'

  - id: llama-cpp-archive-path
    desc: llama.cpp source tree archive path
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, batch, python, javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])[a-z0-9_-]*llama\.cpp'

  # llama.cpp/ggml native inference DLLs (koboldcpp_*.dll, oobabooga and
  # whisper.cpp bundles) materialize tensor-type names, GGML_ASSERT call
  # sites and ggml source paths as immediate stack stores, the same
  # compiler-constant-table shape the stack-string atom misreads as
  # obfuscation. Mirrors libvips-runtime-strings-pe next door.
  - id: ggml-runtime-strings-pe
    desc: ggml runtime string markers in PE
    crit: notable
    conf: 0.99
    for: [pe, dll]
    size_min: 65536
    if:
      type: text
      section: .rdata
      regex: 'ggml_tensor|GGML_ASSERT|ggml/src/'

composite_rules:
  - id: ggml-inference-source
    desc: ggml native inference (llama.cpp) source
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: ggml-source-path
      - id: ggml-source-marker

  - id: llama-cpp-cmake-ggml-context
    for: [c]
    desc: llama.cpp CMake project with ggml sources
    crit: notable
    conf: 0.99
    all:
      - id: llama-cpp-cmake-project
      - id: ggml-source-marker

  - id: llama-cpp-source-context
    desc: llama.cpp upstream source tree context
    crit: exception
    conf: 0.99
    for: [source, javascript, text, tar, zip, gz, npm, whl, python-sdist]
    scope: outer
    any:
      - id: llama-cpp-archive-path
      - id: llama-cpp-cmake-ggml-context

  - id: ggml-native-debugger-helper-context
    desc: ggml native diagnostic debugger helper
    crit: exception
    conf: 0.99
    for: [elf, so]
    # Either marker proves ggml's backtrace-diagnostic facility is linked in:
    # whisper.cpp-bundled ggml vintages (e.g. via whisper-rs-sys) predate the
    # backend-registry marker, so requiring both misses them entirely.
    any:
      - id: ggml-binary-backend-marker
      - id: ggml-backtrace-disable-env
