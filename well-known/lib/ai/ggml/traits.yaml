defaults:
  platforms: [windows, unix]
  for: [c, cpp, javascript, text]

traits:
  - id: ggml-source-path
    desc: ggml native inference source path
    crit: baseline
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])(ggml|native_llama[^\\/]*)'

  - id: ggml-source-marker
    desc: ggml native inference source marker
    crit: baseline
    conf: 0.94
    if:
      type: text
      substr: ggml

  - id: ggml-shared-library-basename
    desc: ggml inference shared library basename
    crit: notable
    conf: 0.99
    for: [elf, dll, pe]
    size_min: 65536
    size_max: 67108864
    if:
      type: path
      basename: true
      regex: '^libggml.*\.so'

  - id: ggml-binary-backend-marker
    desc: ggml native backend function marker
    crit: notable
    conf: 0.99
    for: [elf, so]
    size_min: 65536
    if:
      type: text
      section: .rodata
      exact: ggml_backend_score

  - id: ggml-backtrace-disable-env
    desc: ggml backtrace-disable environment marker
    crit: notable
    conf: 0.99
    for: [elf, so]
    size_min: 65536
    if:
      type: text
      section: .rodata
      exact: GGML_NO_BACKTRACE

  - id: llama-cpp-cmake-project
    desc: llama.cpp CMake project declaration
    crit: notable
    conf: 0.99
    for: [c, cpp]
    if:
      type: text
      regex: 'project\("llama\.cpp"\s+C\s+CXX\)'

  - id: llama-cpp-archive-path
    desc: llama.cpp source tree archive path
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, batch, python, javascript]
    if:
      type: path
      basename: true
      regex: '^llama\.cpp'

composite_rules:
  - id: ggml-inference-source
    desc: ggml native inference (llama.cpp) source
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: ggml-source-path
      - id: ggml-source-marker

  - id: llama-cpp-cmake-ggml-context
    desc: llama.cpp CMake project with ggml sources
    crit: notable
    conf: 0.99
    all:
      - id: llama-cpp-cmake-project
      - id: ggml-source-marker

  - id: llama-cpp-source-context
    desc: llama.cpp upstream source tree context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: llama-cpp-archive-path
      - id: llama-cpp-cmake-ggml-context

  - id: ggml-native-debugger-helper-context
    desc: ggml native diagnostic debugger helper
    crit: exception
    conf: 0.99
    for: [elf, so]
    all:
      - id: ggml-binary-backend-marker
      - id: ggml-backtrace-disable-env
