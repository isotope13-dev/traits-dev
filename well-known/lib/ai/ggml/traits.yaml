defaults:
  platforms: [windows, unix]
  for: [c, cpp, javascript, text]

traits:
  - id: ggml-source-path
    desc: ggml native inference source path
    crit: baseline
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])(ggml|native_llama[^\\/]*)'

  - id: ggml-source-marker
    desc: ggml native inference source marker
    crit: baseline
    conf: 0.94
    if:
      type: text
      substr: ggml

  - id: ggml-shared-library-basename
    desc: ggml inference shared library basename
    crit: notable
    conf: 0.99
    for: [elf, dll, pe]
    size_min: 65536
    size_max: 67108864
    if:
      type: path
      basename: true
      regex: '^libggml.*\.so'

composite_rules:
  - id: ggml-inference-source
    desc: ggml native inference (llama.cpp) source
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: ggml-source-path
      - id: ggml-source-marker
