defaults:
  platforms: [macos, linux, windows]
  for: [whl]
  crit: component
  conf: 0.99

traits:
  - id: ray-wheel-distribution
    desc: Declares Ray wheel distribution
    if:
      type: value
      path: whl.distribution
      exact: ray

  - id: ray-wheel-homepage
    desc: Declares Ray project homepage
    if:
      type: value
      path: whl.homepage
      exact: https://github.com/ray-project/ray

  - id: ray-wheel-raylet
    desc: Contains Raylet worker executable path
    if:
      type: value
      path: archive.members[*].path
      regex: '^ray/core/src/ray/raylet/raylet(\.exe)?$'

  - id: ray-wheel-gcs-server
    desc: Contains Ray GCS server executable path
    if:
      type: value
      path: archive.members[*].path
      regex: '^ray/core/src/ray/gcs/gcs_server(\.exe)?$'

  - id: raylet-native-extension
    desc: Raylet Python extension initializer export
    for: [elf, macho, pe]
    crit: notable
    if:
      type: export
      regex: '^_?PyInit__raylet$'

composite_rules:
  - id: ray-package-context
    desc: Ray distributed computing wheel
    crit: notable
    scope: file
    all:
      - id: ray-wheel-distribution
      - id: ray-wheel-homepage
      - id: ray-wheel-raylet
      - id: ray-wheel-gcs-server
