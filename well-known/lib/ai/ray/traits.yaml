# Ray bundles Kubernetes deployment helpers and JVM dependencies. Those
# bundled components use service-account files and custom TLS managers as
# ordinary platform integration code.
defaults:
  platforms: [macos, linux, windows]
  for: [whl, python, jar, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: ray-package-path
    desc: Ray wheel or extracted member path
    if:
      type: path
      regex: '(^|[\\/])ray-[0-9][^\\/]*\\.whl'

  - id: ray-member-path
    desc: Ray package member path
    for: [python, jar, java_class]
    if:
      type: path
      regex: '(^|[\\/])ray[\\/]'

  - id: ray-private-constants-import
    desc: Ray private constants module import
    for: [python]
    if:
      type: text
      substr: import ray._private.ray_constants

composite_rules:
  - id: ray-package-context
    desc: Recognized Ray package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: ray-package-path
      - id: ray-member-path
      - id: ray-private-constants-import
