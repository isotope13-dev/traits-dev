defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  - javascript
  - typescript
  crit: notable
  conf: 0.99
composite_rules:
- id: mastra-core-package
  desc: Mastra AI agent framework core package
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/communications/http/url/github::mastra-repository-reference
  - id: metadata/package/homepage::mastra-homepage
  all:
  - id: mastra-core-package-name
- id: mastra-server-package
  desc: Mastra AI agent framework server package
  crit: notable
  conf: 0.99
  all:
  - id: mastra-server-package-name
  any:
  - id: micro-behaviors/communications/http/url/github::mastra-repository-reference
  - id: metadata/package/homepage::mastra-homepage
traits:
- id: mastra-core-package-name
  desc: Mastra core npm package name
  size_max: 100000
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@mastra/core'
- id: mastra-server-package-name
  desc: Mastra server npm package name
  size_max: 100000
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@mastra/server'
- id: mastra-runtime-class
  desc: Mastra runtime class declaration
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \b(class Mastra\b|Mastra\s*=\s*class\b)
