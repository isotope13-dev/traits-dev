defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: package-name
    desc: Official A2A JavaScript SDK package
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: "@a2a-js/sdk"

  - id: official-spec-codegen-script
    desc: A2A SDK generates from official specification
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.generate
      exact: curl https://raw.githubusercontent.com/google-a2a/A2A/refs/heads/main/specification/json/a2a.json > spec.json && node scripts/generateTypes.js && rm spec.json

composite_rules:
  - id: official-codegen-context
    desc: Official A2A SDK specification codegen
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: official-spec-codegen-script
