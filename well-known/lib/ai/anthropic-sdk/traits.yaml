# Official Anthropic TypeScript SDK (@anthropic-ai/sdk).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: anthropic-sdk-package-name
    desc: Anthropic SDK package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@anthropic-ai/sdk'

  - id: anthropic-sdk-package-path
    desc: Anthropic SDK package member path
    for: [javascript, typescript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@anthropic-ai[/\\]sdk'
