# Official Anthropic TypeScript SDK package and import context.
# This identifies the named library; its agent-toolset and credential helpers
# remain visible through the neutral capability traits that describe them.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Anthropic TypeScript SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@anthropic-ai/sdk'

  - id: archive-package-name
    desc: Anthropic TypeScript SDK archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@anthropic-ai/sdk'

  - id: package-member-context
    desc: Anthropic TypeScript SDK package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@anthropic-ai/sdk'

  - id: module-import
    desc: Anthropic TypeScript SDK import path
    for: [javascript, typescript]
    if:
      type: import
      exact: '@anthropic-ai/sdk'

  - id: upstream-repository
    desc: Anthropic TypeScript SDK GitHub repository
    if:
      type: text
      substr: github.com/anthropics/anthropic-sdk-typescript

composite_rules:
  - id: anthropic-sdk-library-context
    desc: Anthropic TypeScript SDK library context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: module-import
      - id: upstream-repository
