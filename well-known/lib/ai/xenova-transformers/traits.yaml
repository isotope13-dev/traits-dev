# @xenova/transformers (Transformers.js) — Hugging Face on-device inference
# runtime vendored as transformers.min.js. Webpack/onnxruntime bundles carry
# numeric-array + fromCharCode + eval shapes that match obfuscated droppers;
# identity only.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: transformers-min-basename
    desc: Transformers.js minified bundle basename
    if:
      type: basename
      exact: transformers.min.js

  - id: transformers-js-product-marker
    desc: Transformers.js product string marker
    if:
      type: literal
      exact: Transformers.js

composite_rules:
  - id: xenova-transformers-runtime-bundle
    desc: Xenova Transformers.js browser runtime bundle
    crit: exception
    conf: 0.99
    all:
      - id: transformers-min-basename
    any:
      - id: micro-behaviors/os/module/require::dynamic-import-xenova-transformers
      - id: transformers-js-product-marker
