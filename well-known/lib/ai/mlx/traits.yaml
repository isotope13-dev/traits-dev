# Apple MLX (ml-explore/mlx) — the Metal machine-learning framework for
# Apple silicon. Its C++ core compiles generated Metal/C++ kernel sources at
# runtime by invoking the system C++ compiler through popen, and its ObjC
# helper layer downloads models over NSURLSession. Wheels ship the prebuilt
# shader library as mlx.metallib beside the native library, so an MLX-bearing
# dylib legitimately pairs an HTTP client with a popen shell pipe.
defaults:
  platforms: [macos]
  for: [macho, dylib]
  size_min: 4096
  size_max: 500000000

traits:
  - id: mlx-core-symbols
    desc: Apple MLX core library symbols
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: mlx::core
      section: __cstring

  - id: mlx-metallib-resource
    desc: MLX prebuilt Metal shader library name
    crit: notable
    conf: 0.95
    if:
      type: raw
      substr: mlx.metallib
      section: __cstring

  - id: mlx-kernel-jit-compile-command
    desc: MLX runtime kernel compiler invocation
    crit: notable
    conf: 0.93
    if:
      type: text
      # The generated-kernel build line MLX shells out through popen; the
      # invoked compiler spelling varies (g++/c++) across toolchains.
      regex: '[cg]\+\+ -std=c\+\+17 -O3 -Wall -fPIC -shared "\{0\}" -o "\{1\}"'
      section: __cstring
