# Unsloth — official LLM fine-tuning SDK (unsloth.ai). Security tests and
# scanners quote malware snippets as fixtures, not as droppers.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 200000000

traits:
  - id: copyright-header
    desc: Official Unsloth team copyright header
    for: [python, text]
    if:
      type: text
      regex: 'Copyright 20[0-9]{2}-present .{0,80}the Unsloth (AI Inc\. )?team'

  - id: github-repository
    desc: Unsloth GitHub repository URL
    for: [python, markdown, text]
    if:
      type: text
      regex: '(?i)github\.com/unslothai/unsloth'

  - id: source-archive-path
    desc: Unsloth versioned source archive path
    for: [python, pyproject.toml, markdown, text]
    if:
      type: path
      regex: 'unsloth[@-]v?[0-9]'

composite_rules:
  - id: unsloth-package-context
    desc: Official Unsloth training package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: copyright-header
      - id: github-repository
      - id: source-archive-path
