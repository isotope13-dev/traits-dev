# MetaCountRegressor — GPL-licensed scientific model-fitting library.
# https://github.com/zahern/MetaCount
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: metacountregressor-package-name
    desc: PyPI name is metacountregressor
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: metacountregressor

  - id: metacountregressor-repository
    desc: MetaCountRegressor project repository URL
    for: [pkginfo, python, text]
    if:
      type: text
      substr: github.com/zahern/MetaCount

  - id: metacountregressor-module-path
    desc: MetaCountRegressor Python package path
    for: [python]
    if:
      type: path
      regex: '(^|[/\\])metacountregressor([/\\]|$)'

composite_rules:
  - id: metacountregressor-package
    desc: MetaCountRegressor Python scientific package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: metacountregressor-package-name
    any:
      - id: metacountregressor-repository
      - id: metacountregressor-module-path
