# AstrBot's knowledge-base repair prompt quotes an override phrase as text
# supplied to a separate system prompt. Keep that defensive pattern distinct
# from general prompt-injection specification markers.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, text]

traits:
  - id: repair-service-marker
    desc: AstrBot repair service marker
    crit: notable
    if:
      type: text
      substr: repair_llm_service
  - id: repair-chunk-marker
    desc: AstrBot untrusted chunk marker
    crit: notable
    if:
      type: text
      substr: Text chunk to process

composite_rules:
  - id: repair-prompt-context
    desc: AstrBot repair prompt context
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: repair-service-marker
      - id: repair-chunk-marker
      # Preserve the original raw phrase requirement without treating it as
      # product identity. This leaf has no dependency on this suppressor.
      - id: objectives/evasion/security-bypass/llm/override::llm-uppercase-ignore-prior-phrase
