# inspect_evals — the UK AI Safety Institute's open evaluation suite for the
# Inspect framework.
#
# A large part of the corpus is deliberately offensive by design: cybench and
# gdm_in_house_ctf ship CTF challenges together with their solutions,
# agentharm ships paired benign_tools/ and harmful_tools/ used to measure
# refusal, threecb ships attack task configs, and cyberseceval_4 vendors Meta's
# insecure_code_detector rule pack. The vulnerable web app under
# challenges/cmd_injection/ is a real command-injection target -- that is the
# challenge -- and it is not what this package does to the host that installs
# it.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution-name
    desc: inspect_evals wheel distribution name
    for: [whl, egg, zip]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^inspect[_-]evals$'

  - id: package-member-path
    desc: inspect_evals package member path
    for: [whl, egg, zip, python-sdist, python, text, data, source, scripts]
    if:
      type: path
      regex: '(^|[\\/])inspect_evals[\\/]'

  - id: challenge-tree-path
    desc: inspect_evals challenge or task tree path
    for: [python, text, data, source, scripts]
    if:
      type: path
      regex: '(^|[\\/])(challenges|harmful_tools|task_configs)[\\/]'

composite_rules:
  # The distribution name or the package tree, plus (for the loosest of the
  # three) the challenge layout that only appears inside it.
  - id: eval-corpus-context
    desc: Recognized inspect_evals evaluation corpus
    crit: exception
    conf: 0.99
    scope: outer
    for: [whl, egg, zip, python-sdist, python, text, data, source, scripts]
    any:
      - id: wheel-distribution-name
      - id: package-member-path
