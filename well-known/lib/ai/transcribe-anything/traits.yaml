# transcribe-anything — Whisper frontend CLI (zackees). Subprocess
# ffmpeg/whisper backends and nvidia-smi probes are product, not a
# dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: transcribe_anything PyPI wheel name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: transcribe_anything

  - id: package-metadata-name
    desc: transcribe-anything PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*transcribe-anything\s*$'

  - id: github-repo
    desc: zackees transcribe-anything GitHub repo
    for: [pkginfo, markdown, python, text]
    if:
      type: text
      substr: github.com/zackees/transcribe-anything

  - id: console-entry
    desc: transcribe-anything console-script entry
    for: [text]
    if:
      type: text
      substr: 'transcribe-anything = transcribe_anything._cmd:main'

  - id: nvidia-cache-file
    desc: transcribe-anything NVIDIA detection cache
    for: [python, text]
    if:
      type: text
      substr: .transcribe_anything_nvidia_cache.json

composite_rules:
  - id: transcribe-anything-package
    desc: transcribe-anything Whisper frontend package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: github-repo
      - id: console-entry
      - id: nvidia-cache-file
    needs: 2
