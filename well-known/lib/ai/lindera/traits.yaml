# Lindera — open-source Rust morphological analyzer (MeCab alternative).
# Its dictionary crates' build.rs downloads the dictionary source tarball
# from the project's own GitHub org at build time, then compiles the
# dictionary locally. No executable code is fetched: the tarball holds
# MeCab CSV/dictionary sources consumed by the local dictionary builder.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.99

traits:
  - id: lindera-dictionary-download-url
    desc: Lindera official GitHub dictionary download URL
    if:
      type: text
      substr: github.com/lindera-morphology/

  - id: lindera-dic-crate-name
    desc: Lindera dictionary Rust crate name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^lindera-(ko-dic|ipadic|unidic|cc-cedict|ipadic-neologd)$'

composite_rules:
  - id: official-project-context
    desc: Official Lindera project build context
    crit: exception
    conf: 0.99
    any:
      - id: lindera-dictionary-download-url
      - id: lindera-dic-crate-name
