# mcp — official Model Context Protocol Python SDK (modelcontextprotocol/python-sdk).
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 52428800

traits:
  - id: mcp-package-module-path
    desc: MCP Python SDK package tree path
    if:
      type: path
      regex: '(^|/)mcp/'

  - id: mcp-get-task-result-api
    desc: MCP experimental tasks get_task_result API
    if:
      type: text
      substr: get_task_result

  - id: mcp-python-sdk-repository
    desc: modelcontextprotocol python-sdk repository URL
    if:
      type: text
      substr: github.com/modelcontextprotocol/python-sdk

composite_rules:
  - id: mcp-python-sdk-library
    desc: Model Context Protocol official Python SDK
    crit: exception
    conf: 0.97
    any:
      - id: mcp-package-module-path
      - id: mcp-get-task-result-api
      - id: mcp-python-sdk-repository
