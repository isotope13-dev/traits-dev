defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: component
  conf: 0.98
  size_max: 5000000
traits:
- id: official-source-header
  desc: Official Ultralytics source header
  crit: notable
  if:
    type: text
    regex: Ultralytics.{0,40}AGPL-3\.0 License - https://ultralytics\.com/license
- id: yolo-source-header
  desc: Ultralytics YOLO Python source header
  crit: notable
  if:
    type: text
    regex: '(?im)^#\s*Ultralytics YOLO\b.{0,80}AGPL-3\.0 license\b'
- id: triton-remote-model-class
  desc: Ultralytics Triton remote model adapter
  crit: notable
  if:
    type: text
    regex: '(?m)^class\s+TritonRemoteModel\b'
- id: model-config-call
  desc: Calls model configuration API
  crit: component
  if:
    type: symbol
    kind: call
    regex: '(^|\.)get_model_config$'

composite_rules:
- id: triton-model-config-fetch
  desc: Triton model-server configuration fetch
  crit: notable
  near_bytes: 3000
  all:
  - id: triton-remote-model-class
  - id: model-config-call
# Ultralytics' own TritonRemoteModel unpacks server-supplied model metadata
# with a bare eval(). It is a real remote-code-execution surface — whoever
# controls the inference server controls the client — and a security engineer
# reviewing a diff should see it. It is not evidence of compromise: this is
# upstream code, shipped deliberately since 8.3.44, and every clean release
# since carries it. `hostile` means "attack pattern, no legitimate use"
# (RULES.md), and a rule that can fire *only* on a known library's own source
# has legitimate use by construction; grading it hostile made every clean
# ultralytics upgrade read as malware.
- id: triton-server-metadata-eval
  desc: Ultralytics Triton client eval()s server-supplied model metadata (RCE surface)
  crit: suspicious
  conf: 0.99
  attack: "T1059.006"
  near_bytes: 3000
  all:
  - id: triton-remote-model-class
  - id: triton-model-config-fetch
  - id: objectives/execution/interpreter/eval/remote::eval-chained-get
