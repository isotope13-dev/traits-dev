# svar (Blockether) — type-safe LLM structured output for Clojure.
# JsonishParser hex-pair decode is JSON-ish unescaping; llm.clj HTTP
# is the product's LLM client. Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, java, class, java_class, text, xml]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-group
    desc: com.blockether Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: com.blockether

  - id: pom-artifact
    desc: svar Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: svar

  - id: github-repo
    desc: Blockether svar GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/Blockether/svar

  - id: namespace-path
    desc: svar Clojure namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)com/blockether/svar'

composite_rules:
  - id: svar-maven-library
    desc: Blockether svar Clojure LLM library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
