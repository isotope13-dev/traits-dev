# Microsoft's Agent Governance Toolkit SDK (@microsoft/agent-governance-sdk,
# github.com/microsoft/agent-governance-toolkit): agent identity, trust
# scoring, policy evaluation, audit logging, and LLM threat detectors
# (ContextPoisoningDetector, OWASP ASI-06). Its detector modules quote
# prompt-injection phrases as the labeled threat signatures they exist to
# block, so override-prompt rules except this identity the same way they
# except other agent safety scanners.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: Package is @microsoft/agent-governance-sdk
    size_min: 1
    if:
      type: value
      path: name
      exact: "@microsoft/agent-governance-sdk"

  - id: upstream-repository
    desc: Repository is agent-governance-toolkit
    size_min: 1
    if:
      type: value
      path: repository.url
      substr: microsoft/agent-governance-toolkit

composite_rules:
  - id: package-context
    desc: Archive is the Microsoft Agent Governance SDK
    crit: exception
    conf: 0.95
    all:
      - id: package-name
      - id: upstream-repository
