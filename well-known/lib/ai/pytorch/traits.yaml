# PyTorch's Intel XPU extension contains generated C++/SYCL symbols.  Those
# symbols can resemble marker-based junking but are ordinary backend code.
defaults:
  platforms: [windows]
  for: [dll, pe]

traits:
  - id: pytorch-xpu-native-library
    desc: PyTorch Intel XPU native library
    crit: notable
    conf: 0.98
    size_min: 4096
    size_max: 500000000
    if:
      type: basename
      exact: torch_xpu.dll
      case_insensitive: true
