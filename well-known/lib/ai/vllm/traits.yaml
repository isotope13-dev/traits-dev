defaults:
  platforms: [linux, macos]
  for: [python-sdist]
  crit: component

traits:
  - id: source-distribution-name
    desc: Declares vLLM source distribution
    if: {type: value, path: python.name, exact: vllm}

  - id: inference-engine-module
    desc: Contains vLLM inference engine source
    if:
      type: value
      path: archive.members[*].path
      regex: '^vllm-[^/]{1,48}/vllm/engine/llm_engine\.py$'

  - id: api-server-module
    desc: Contains vLLM API server source
    if:
      type: value
      path: archive.members[*].path
      regex: '^vllm-[^/]{1,48}/vllm/entrypoints/openai/api_server\.py$'

composite_rules:
  - id: source-package
    desc: vLLM inference and serving source package
    crit: notable
    scope: file
    all:
      - id: source-distribution-name
      - id: inference-engine-module
      - id: api-server-module
