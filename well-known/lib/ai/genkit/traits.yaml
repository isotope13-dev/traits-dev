# Genkit — open-source framework by Google/Firebase for building AI-powered apps.
# Repository: github.com/firebase/genkit
# Published under the @genkit-ai/* scope on npm.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: genkit-package-scope
    desc: Genkit npm package scope
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@genkit-ai/'

  - id: genkit-upstream-repo
    desc: Genkit upstream repository URL
    for: [package.json, javascript, typescript, markdown, text]
    if:
      type: text
      regex: 'github\.com/firebase/genkit([./\s"''`?#]|$)'

  - id: genkit-tools-identifier
    desc: Genkit tools identifier
    for: [javascript, typescript]
    if:
      type: text
      substr: genkit-tools

  - id: genkit-analytics-notice
    desc: Genkit CLI usage analytics notification
    for: [javascript, typescript]
    if:
      type: text
      substr: Genkit CLI and Developer UI use cookies

composite_rules:
  - id: genkit-analytics-telemetry
    desc: Genkit CLI usage analytics telemetry module
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: genkit-tools-identifier
      - id: micro-behaviors/ui/dialog/prompt::press-to-continue
