# haystack-ai — Deepset Haystack LLM application framework (Python).
defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, source]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 524288000

traits:
  - id: haystack-package-path
    desc: Haystack AI Python package tree path
    if:
      type: path
      substr: haystack/

  - id: haystack-pipeline-run-example
    desc: Haystack Pipeline.run usage in source
    for: [python]
    if:
      type: text
      substr: pipe.run(

  - id: haystack-bytestream-response-content
    desc: Haystack ByteStream from HTTP response content
    for: [python]
    if:
      type: text
      substr: ByteStream(data=response.content)

composite_rules:
  - id: haystack-telemetry-containerenv-doc
    desc: Haystack telemetry cites containerenv path
    for: [python]
    all:
      - id: haystack-package-path
      - id: micro-behaviors/os/container/runtime::containerenv
