# lm15 -- low-level multi-provider foundation library for talking to LLM APIs.
# Implements unified data types, HTTP transports, and cloud credential chains
# (AWS, Azure, GCP) resolved per provider policy.

defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: lm15-cloud-chains-credential-provider
    desc: lm15 multi-cloud credential chain resolver
    if:
      type: text
      regex: '["'']aws-chain["'']\s*:\s*_aws_chain'
