# LangSmith observability SDK (langsmith npm package).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: langsmith-package-name
    desc: LangSmith package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: langsmith

  - id: langsmith-package-path
    desc: LangSmith package member path
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])langsmith[/\\]dist'
