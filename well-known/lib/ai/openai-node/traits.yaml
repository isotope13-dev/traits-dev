# Official OpenAI TypeScript/JavaScript SDK (openai-node / Stainless).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: openai-node-package-name
    desc: OpenAI Node SDK package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: openai

  - id: openai-stainless-codegen-banner
    desc: OpenAI SDK Stainless OpenAPI codegen banner
    for: [javascript, typescript]
    conf: 0.97
    if:
      type: text
      substr: 'File generated from our OpenAPI spec by Stainless'

  - id: openai-node-package-path
    desc: OpenAI Node SDK package member path
    for: [javascript, typescript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])openai[/\\](resources|src|internal|auth|core)'
