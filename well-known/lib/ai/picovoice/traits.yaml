defaults:
  platforms: [macos, linux, windows]
  crit: notable
  conf: 0.98
  size_max: 536870912

traits:
  - id: pvrecorder-native-addon-path
    desc: Picovoice pvrecorder native addon path
    for: [macho, elf, pe]
    if:
      type: path
      regex: 'pvrecorder-node[\\/].*[\\/]pv_recorder\.node$'

  - id: porcupine-library-export
    desc: Picovoice Porcupine wake-word engine export
    for: [pe, elf, macho, dll, so, dylib]
    if:
      type: export
      regex: '^pv_porcupine_(init|process|version|delete)$'

  - id: porcupine-library-filename
    desc: Picovoice Porcupine library filename
    for: [pe, elf, macho, dll, so, dylib]
    if:
      type: path
      basename: true
      regex: '^libpv_porcupine\.(dll|so|dylib)$'

composite_rules:
  - id: porcupine-native-library
    desc: Picovoice Porcupine wake-word engine library
    crit: notable
    conf: 0.99
    all:
      - id: porcupine-library-export
      - id: porcupine-library-filename

