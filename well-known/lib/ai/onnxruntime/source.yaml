# Source-level ONNX Runtime bindings. traits.yaml fingerprints the shipped
# native library; these recognise source that loads and runs a local ONNX model.
# ONNX Runtime is the identity behind most on-device inference programs, so the
# binding import is the fact that explains why a package ships model blobs,
# reads .onnx files, and links a large native library.
defaults:
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.95

traits:
  - id: python-binding-import
    desc: Imports the onnxruntime Python package
    for: [python]
    if:
      type: import
      exact: onnxruntime

  - id: javascript-binding-import
    desc: Imports an onnxruntime JavaScript binding
    for: [javascript, typescript]
    if:
      type: import
      regex: '^onnxruntime-(node|web|react-native|common)$'

  - id: javascript-package-path
    desc: ONNX Runtime JS package path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'onnxruntime-(node|common)/'

  - id: node-session-handler
    desc: ONNX Runtime Node session handler
    for: [javascript, typescript]
    if:
      type: text
      substr: OnnxruntimeSessionHandler

  - id: ort-wasm-asset-name
    desc: ONNX Runtime WebAssembly asset name
    for: [javascript, typescript]
    if:
      type: text
      substr: 'ort-wasm.wasm'

  - id: dotnet-binding-import
    desc: Imports the Microsoft.ML.OnnxRuntime namespace
    for: [csharp]
    if:
      type: import
      substr: Microsoft.ML.OnnxRuntime

  - id: java-binding-import
    desc: Imports the ai.onnxruntime Java package
    for: [java]
    if:
      type: import
      substr: ai.onnxruntime

  - id: go-binding-import
    desc: Imports an onnxruntime Go binding module
    for: [go]
    if:
      type: import
      substr: onnxruntime_go

  - id: swift-binding-import
    desc: Imports the ONNX Runtime Swift bindings
    for: [swift]
    if:
      type: import
      exact: OnnxRuntimeBindings

  - id: rust-crate-use
    desc: Uses the ort ONNX Runtime Rust crate
    for: [rust]
    if:
      type: text
      regex: '(?m)^\s*use\s+ort::'

  - id: inference-session-create
    desc: Creates an ONNX Runtime InferenceSession
    for: [python, javascript, typescript, csharp]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)InferenceSession(\.create)?$'

  - id: ort-session-create
    desc: Creates an ONNX Runtime ORTSession
    for: [java, swift]
    if:
      type: symbol
      regex: '(?i)^ORTSession'

composite_rules:
  - id: onnxruntime-javascript-binding
    desc: ONNX Runtime JavaScript API binding
    all:
      - id: javascript-package-path
    any:
      - id: javascript-binding-import
      - id: node-session-handler
      - id: ort-wasm-asset-name
      - id: inference-session-create
