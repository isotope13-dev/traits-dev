# e3nn — Euclidean neural networks library for PyTorch (e3nn.org).
# Computes tensor products and Wigner D-matrices for SE(3)/E(3) equivariance.
defaults:
  platforms: [unix, windows]
  for: [python, source, text, markdown, whl, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: e3nn source tree path
    for: [python, source, whl, zip, tar]
    if:
      type: path
      regex: '(?i)(^|[\\/])e3nn([\\/]|$)'

  - id: repository-url
    desc: e3nn upstream GitHub repository URL
    for: [markdown, python, text]
    if:
      type: text
      substr: github.com/e3nn/e3nn

  - id: wigner-coefficients-loader
    desc: e3nn Wigner D-matrix constant table loader
    for: [python]
    if:
      type: text
      regex: '(?i)(_Jd\s*=\s*torch\.load\([^)\n]{0,80}Jd\.pt|wigner_D\b|_wigner_constants\b)'

composite_rules:
  - id: e3nn-wigner-context
    desc: Recognized e3nn Wigner matrix computation context
    crit: exception
    conf: 0.99
    scope: outer
    for: [python, whl, zip, tar]
    any:
      - id: source-path
      - id: repository-url
      - id: wigner-coefficients-loader
