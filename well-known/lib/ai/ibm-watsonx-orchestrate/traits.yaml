# IBM watsonx Orchestrate — official Python ADK for IBM watsonx Orchestrate.
# Developer edition provisions local WSL / Lima VMs with passwordless sudo for the container user.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: ibm_watsonx_orchestrate wheel distribution name
    for: [whl, pkginfo]
    if:
      type: value
      path: whl.distribution
      exact: ibm_watsonx_orchestrate

  - id: package-module-path
    desc: ibm_watsonx_orchestrate package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])ibm_watsonx_orchestrate[\\/]'

  - id: developer-edition-wsl-distro
    desc: Watsonx Orchestrate developer WSL distro
    for: [python]
    if:
      type: text
      regex: '\b(DISTRO_NAME|VM_NAME)\s*=\s*["'']ibm-watsonx-orchestrate["'']'

composite_rules:
  - id: ibm-watsonx-orchestrate-context
    desc: IBM watsonx Orchestrate official ADK context
    crit: exception
    conf: 0.99
    scope: archive
    for: [python, whl]
    all:
      - id: package-module-path
    any:
      - id: wheel-distribution
      - id: developer-edition-wsl-distro
