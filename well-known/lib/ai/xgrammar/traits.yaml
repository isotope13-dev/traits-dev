defaults:
  platforms: [linux, macos, windows]
  for: [python-sdist, whl]
  crit: component

traits:
  - id: source-distribution-name
    desc: Declares XGrammar source distribution
    for: [python-sdist]
    if: {type: value, path: python.name, exact: xgrammar}

  - id: wheel-distribution-name
    desc: Declares XGrammar wheel distribution
    for: [whl]
    if: {type: value, path: whl.distribution, exact: xgrammar}

  - id: grammar-compiler-module
    desc: Contains XGrammar compiler module
    if:
      type: value
      path: archive.members[*].path
      regex: '^(xgrammar-[^/]{1,48}/python/)?xgrammar/compiler\.py$'

  - id: native-grammar-matcher-source
    desc: Contains XGrammar native matcher source
    for: [python-sdist]
    if:
      type: value
      path: archive.members[*].path
      regex: '^xgrammar-[^/]{1,48}/cpp/grammar_matcher\.cc$'

  - id: wheel-native-binding
    desc: Contains XGrammar native Python binding
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '^xgrammar/xgrammar_bindings(\.[^/]{1,64})?\.(so|pyd)$'

composite_rules:
  - id: source-package
    desc: XGrammar structured generation source package
    for: [python-sdist]
    crit: notable
    scope: file
    all:
      - id: source-distribution-name
      - id: grammar-compiler-module
      - id: native-grammar-matcher-source

  - id: wheel-package
    desc: XGrammar structured generation wheel
    for: [whl]
    crit: notable
    scope: file
    all:
      - id: wheel-distribution-name
      - id: grammar-compiler-module
      - id: wheel-native-binding
