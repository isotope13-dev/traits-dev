# CrispASR — unified C++ speech recognition and text-to-speech engine.
defaults:
  platforms: [unix, windows]
  for: [source, c, cpp, python, text, markdown, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: CrispASR source tree path
    if:
      type: path
      regex: '(?i)(^|[/\\])crispasr([/\\]|[-_@.]|$)'

  - id: repository-url
    desc: CrispASR upstream GitHub repository URL
    for: [markdown, python, text]
    if:
      type: text
      substr: github.com/CrispStrobe/CrispASR

  - id: cmake-project
    desc: CrispASR CMake project declaration
    for: [c, cpp, text]
    if:
      type: text
      regex: 'project\("?crispasr"?\s+VERSION'

composite_rules:
  - id: crispasr-speech-engine
    desc: CrispASR speech and audio inference engine context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: source-path
      - id: repository-url
      - id: cmake-project
