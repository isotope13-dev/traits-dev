# Lisette is AnswerDotAI's small Python helper around LiteLLM. Its agent,
# tool-call, Base64, and API-key parameter markers are expected library
# functionality; identify the library separately so those capabilities retain
# their neutral meanings during triage.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Lisette Python package name
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*lisette\s*$'

  - id: upstream-repository
    desc: Lisette upstream GitHub repository
    for: [python, pkginfo]
    if:
      type: text
      substr: github.com/AnswerDotAI/lisette
