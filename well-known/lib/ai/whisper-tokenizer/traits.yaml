# OpenAI Whisper tokenizer special-token map as shipped with Hugging
# Face transformers checkpoints. Language-id and task tokens are model
# vocabulary, not obfuscation.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99

traits:
  - id: startoftranscript-token
    desc: Whisper startoftranscript special token
    if:
      type: value
      path: additional_special_tokens
      exact: '<|startoftranscript|>'

  - id: notimestamps-token
    desc: Whisper notimestamps special token
    if:
      type: value
      path: additional_special_tokens
      exact: '<|notimestamps|>'

  - id: startoflm-token
    desc: Whisper startoflm special token
    if:
      type: value
      path: additional_special_tokens
      exact: '<|startoflm|>'

composite_rules:
  - id: whisper-special-tokens-map
    desc: OpenAI Whisper tokenizer special tokens
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: startoftranscript-token
      - id: notimestamps-token
      - id: startoflm-token
