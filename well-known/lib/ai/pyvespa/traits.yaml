defaults:
  platforms:
  - unix
  - windows
  for:
  - whl
  - python
  crit: notable
  conf: 0.99
traits:
- id: pyvespa-package-path
  desc: PyVespa wheel or extracted member path
  if:
    type: path
    regex: (^|[\\/])pyvespa-[0-9][^\\/]*\\.whl
- id: pyvespa-source-member-path
  desc: PyVespa source member path
  if:
    type: path
    regex: (^|[\\/])vespa[\\/]
