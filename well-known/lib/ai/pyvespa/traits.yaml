# PyVespa builds and uploads deployment application packages. Its archive
# upload path is a product workflow, not credential-tree collection.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: pyvespa-package-path
    desc: PyVespa wheel or extracted member path
    if:
      type: path
      regex: '(^|[\\/])pyvespa-[0-9][^\\/]*\\.whl'

  - id: pyvespa-source-member-path
    desc: PyVespa source member path
    if:
      type: path
      regex: '(^|[\\/])vespa[\\/]'

composite_rules:
  - id: pyvespa-package-context
    desc: Recognized PyVespa deployment package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: pyvespa-package-path
      - id: pyvespa-source-member-path
