# bevy_brp_mcp — MCP server for Bevy Remote Protocol. Launching Bevy
# apps, HTTP BRP, and process spawn are product agent tooling, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: crate-name
    desc: bevy_brp_mcp crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: bevy_brp_mcp

  - id: crate-repository
    desc: bevy_brp_mcp crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/natepiano/bevy_brp

  - id: cargo-package-name
    desc: bevy_brp_mcp Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: bevy_brp_mcp

  - id: github-repo
    desc: natepiano bevy_brp GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/natepiano/bevy_brp

  - id: product-description
    desc: Bevy Remote Protocol MCP server description
    conf: 0.97
    if:
      type: text
      substr: 'MCP server for Bevy Remote Protocol (BRP) integration'
