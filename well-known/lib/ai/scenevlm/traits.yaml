# SceneVLM — SceneAPI vision-language package scaffold. This wheel is
# an empty PyPI stub (version metadata only); identify the distribution.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: scenevlm PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: scenevlm

  - id: package-metadata-name
    desc: SceneVLM PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*SceneVLM\s*$'

  - id: github-repo
    desc: SceneAPI SceneVLM GitHub repository
    for: [pkginfo, markdown, python, text]
    if:
      type: text
      substr: github.com/SceneAPI/SceneVLM

  - id: package-init-path
    desc: scenevlm package init module path
    for: [python, whl]
    if:
      type: path
      regex: 'scenevlm[\\/]__init__\.py'

composite_rules:
  - id: scenevlm-package
    desc: SceneVLM SceneAPI package identity
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: github-repo
      - id: package-init-path
    needs: 2
