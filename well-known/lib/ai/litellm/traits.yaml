# LiteLLM (BerriAI) -- the unified client and proxy that fronts a hundred model
# providers behind one OpenAI-shaped call. It is one of the most widely
# installed pieces of LLM plumbing, so an analyst recognises the name, and it
# turns up inside other people's distributions often enough for the identity to
# earn its keep.
#
# Identified by the internal key names its own request pipeline threads through
# every call site -- `litellm_params`, `litellm_call_id`, `litellm_provider`.
# Those are the library's data model, not its package name: a fork can rename
# the distribution, rename the top-level module and rewrite the README, and
# these stay, because renaming them would mean rewriting the pipeline. That is
# exactly what makes them the right matcher for the rebranding composite in
# objectives/supply-chain/impersonation/clone-and-rename/.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: litellm-proxy-module-import
    desc: Imports the LiteLLM proxy server module
    for: [python]
    if:
      type: import
      regex: '^litellm(\.proxy(\.proxy_server)?)?$'

  - id: litellm-params-key
    desc: LiteLLM request params key
    for: [python]
    if:
      type: text
      word: litellm_params

  - id: litellm-call-id-key
    desc: LiteLLM call identifier key
    for: [python]
    if:
      type: text
      word: litellm_call_id

  - id: litellm-provider-key
    desc: LiteLLM provider or settings key
    for: [python]
    if:
      type: text
      regex: '\blitellm_(provider|settings)\b'

  # The honest publication of the same code: the distribution says it is
  # LiteLLM. Referenced from `unless:` so the rebranding composite cannot fire
  # on upstream's own releases.
  - id: litellm-distribution-name
    desc: Distribution is named LiteLLM
    for: [whl, python-sdist, pkginfo, egg]
    if:
      type: value
      path: METADATA::Name
      regex: '(?i)^litellm'

  # The other honest shape: a wrapper that depends on LiteLLM instead of
  # vendoring it. Also an `unless:` leg.
  - id: litellm-declared-dependency
    desc: Distribution depends on LiteLLM
    for: [pkg-info]
    if:
      type: text
      regex: '(?im)^Requires-Dist:\s*litellm\b'

composite_rules:
  - id: litellm-codebase
    desc: LiteLLM library source
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: litellm-params-key
      - id: litellm-call-id-key
      - id: litellm-provider-key
