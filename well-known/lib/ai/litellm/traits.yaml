# LiteLLM (BerriAI) -- the unified client and proxy that fronts a hundred model
# providers behind one OpenAI-shaped call. It is one of the most widely
# installed pieces of LLM plumbing, so an analyst recognises the name, and it
# turns up inside other people's distributions often enough for the identity to
# earn its keep.
#
# Source identity requires a completion-pipeline helper definition together
# with the request fields it implements. The fields alone are public callback
# vocabulary, also used by independent clients, adapters and tests. Their
# matchers live under metadata/lang/source/naming/setting. A renamed copy of
# the implementation retains both definitions and fields, regardless of its
# distribution or top-level module name.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: litellm-proxy-module-import
    desc: Imports the LiteLLM proxy server module
    for: [python]
    if:
      type: import
      regex: '^litellm(\.proxy(\.proxy_server)?)?$'

  - id: litellm-root-import
    desc: Imports the litellm package root
    for: [python]
    if:
      type: import
      exact: litellm

  # Public callback fields also occur in independent adapters and their tests.
  # Require an internal implementation definition before claiming library code.
  - id: litellm-completion-internal-definition
    desc: Defines LiteLLM completion pipeline helper
    for: [python]
    if:
      type: symbol
      kind: function
      regex: '^(responses_api_bridge_check|_*async_streaming)$'

  # Upstream lays its own source under litellm/ (or a top-level litellm.py);
  # a member carrying the pipeline keys from anywhere else is relocated
  # code, which is what the rebranding composite must require. Suppression
  # only: never a conviction leg on its own.
  - id: litellm-module-path
    desc: Member path places file in LiteLLM distribution
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[\\/])litellm([\\/]|\\.py$)'

  # The honest publication of the same code: the distribution says it is
  # LiteLLM. Referenced from `unless:` so the rebranding composite cannot fire
  # on upstream's own releases.

  - id: litellm-pyproject-name
    desc: pyproject.toml package is named LiteLLM
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      regex: '(?i)^litellm'

  # The other honest shape: a wrapper that depends on LiteLLM instead of
  # vendoring it. Also an `unless:` leg.
  - id: litellm-declared-dependency
    desc: Distribution depends on LiteLLM
    for: [pkg-info]
    if:
      type: text
      # PEP 508 tails (pins, extras, markers) follow the name, so accept an
      # explicit terminator instead of end-of-line: `litellm>=1.0`,
      # `litellm[proxy]`, `litellm; extra == 'x'` all declare it, while
      # `litellm-foo` and `litellmlib` do not (`\b` alone would accept the
      # hyphenated prefix, so the class spells the boundary out).
      regex: '(?im)^Requires-Dist:\s*litellm([\s;,<>=!~\[()\]]|$)'

  # The same wrapper shape in a source tree: pyproject.toml lists litellm,
  # optionally with extras and a pin, as one of its dependencies.
  - id: litellm-pyproject-dependency
    desc: pyproject.toml depends on LiteLLM
    for: [pyproject.toml]
    if:
      type: text
      regex: '(?im)^\s*"litellm(\[[a-z0-9_,\s-]{0,40}\])?\s*([<>=!~;,]|")'

  # The disclosed redistribution: the summary names LiteLLM as the code's
  # origin ("AIYou distribution of LiteLLM ..."). The rebranding composites
  # target republishes that hide their lineage, so a summary that states it
  # is an `unless:` leg, like the name and dependency legs above.
  - id: litellm-redistribution-disclosure
    desc: Summary discloses LiteLLM redistribution
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)\b(distribution|fork)\s+of\s+litellm\b'

  # Upstream publisher identity: PKG-INFO Author names BerriAI.
  - id: litellm-upstream-author
    desc: Author names upstream BerriAI
    crit: notable
    conf: 0.95
    for: [pkginfo]
    if:
      type: value
      path: author
      exact: BerriAI

  # Upstream repository: PKG-INFO Project-URL points to BerriAI/litellm repository.
  - id: litellm-upstream-repository
    desc: Project-URL points to BerriAI/litellm
    crit: notable
    conf: 0.98
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Project-URL:\s*Repository,\s*https://github\.com/BerriAI/litellm(\.git)?/?$'

composite_rules:
  - id: litellm-upstream-provenance
    desc: Package declares BerriAI upstream provenance
    crit: notable
    conf: 0.98
    for: [pkginfo]
    all:
      - id: litellm-upstream-author
      - id: litellm-upstream-repository

  - id: litellm-distribution-name
    desc: Distribution is named LiteLLM
    crit: notable
    conf: 0.99
    any:
      - id: metadata/package/name/identity::litellm-pkginfo-name
      - id: litellm-pyproject-name

  - id: litellm-codebase
    desc: LiteLLM library source
    crit: notable
    conf: 0.97
    all:
      - id: litellm-completion-internal-definition
    needs: 2
    any:
      - id: metadata/lang/source/naming/setting::litellm-params-key
      - id: metadata/lang/source/naming/setting::litellm-call-id-key
      - id: metadata/lang/source/naming/setting::litellm-provider-key

  # The relocation-sensitive form of the codebase fact: the pipeline keys
  # in a member outside the module path. Upstream's own members never
  # satisfy the `unless:`, so the rebranding composite built on this leg
  # cannot fire on upstream's releases at any criticality.
  - id: litellm-codebase-outside-module-path
    desc: LiteLLM codebase outside its module path
    crit: notable
    conf: 0.97
    for: [python]
    all:
      - id: litellm-codebase
      # `litellm_params` and `litellm_settings` are also the keys of a LiteLLM
      # proxy config, which wrappers write for the library they launch. The
      # call id corroborates the implementation definition required by
      # litellm-codebase; by itself it also occurs in callback adapters.
      - id: metadata/lang/source/naming/setting::litellm-call-id-key
    unless:
      - id: litellm-module-path
