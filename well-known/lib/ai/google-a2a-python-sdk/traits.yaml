# a2a-sdk — official Agent2Agent (A2A) protocol Python SDK.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 52428800

traits:
  - id: a2a-python-package-path
    desc: A2A Python SDK package tree path
    if:
      type: path
      regex: '(^|/)a2a/'
  - id: a2a-message-send-params-type
    desc: A2A MessageSendParams protocol type
    if:
      type: text
      substr: MessageSendParams
  - id: a2a-python-sdk-homepage
    desc: A2A protocol Python SDK homepage URL
    if:
      type: text
      substr: a2a-protocol.org

composite_rules:
  - id: google-a2a-python-sdk-library
    desc: Official A2A protocol Python SDK
    crit: exception
    conf: 0.99
    any:
      - id: a2a-python-package-path
      - id: a2a-message-send-params-type
      - id: a2a-python-sdk-homepage
