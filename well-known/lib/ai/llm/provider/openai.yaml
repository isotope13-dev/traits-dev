defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  size_max: 5000000
traits:
- id: openai-reject-check
  desc: Checks for 'reject' key in LLM response
  crit: suspicious
  if:
    type: text
    regex: 'reject[^t\n]{1,100}false[^e\n]{1,100}lower[^r\n]{1,100}true'
- id: openai-workload-identity-source
  desc: OpenAI workload-identity token provider source
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: AZURE_IMDS_BASE_URL
# Official openai Python SDK auth/_workload.py: Kubernetes subject-token
# helper used for OpenAI workload identity federation.
- id: openai-python-k8s-workload-identity
  desc: OpenAI Python k8s workload-identity helper
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: k8s_service_account_token_provider
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
