# Mistral AI official TypeScript client (@mistralai/mistralai).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: mistralai-package-name
    desc: Mistral AI SDK package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@mistralai/mistralai'

  - id: mistralai-package-path
    desc: Mistral AI SDK package member path
    for: [javascript, typescript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@mistralai[/\\]mistralai'

  - id: speakeasy-generated-banner
    desc: Speakeasy generated SDK source banner
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Code generated by Speakeasy (https://speakeasy.com). DO NOT EDIT.'
