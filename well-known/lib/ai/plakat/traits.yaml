# plakat — local candle text-to-image / ControlNet / LoRA CLI
# (github.com/vulogov/plakat). HuggingFace model fetch, curl/wget in
# tutorials, and shell helpers are product, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: crate-name
    desc: plakat crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: plakat

  - id: crate-repository
    desc: plakat crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/vulogov/plakat

  - id: cargo-package-name
    desc: plakat Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: plakat

  - id: github-repo
    desc: vulogov plakat GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/vulogov/plakat

  - id: product-description
    desc: plakat candle text-to-image description
    conf: 0.97
    if:
      type: text
      substr: 'Local text-to-image, style transfer, LoRA'
