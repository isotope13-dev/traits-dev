# ArgutrackDNN.Runtime — commercial computer-vision DNN runtime (Emgu.CV /
# CUDA, PostgreSQL model store). Ships Reactor-protected; that packing is
# IP protection for the inference library, not a staged dropper.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 8000
  size_max: 20000000

traits:
  - id: original-filename
    desc: ArgutrackDNN.Runtime original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: ArgutrackDNN.Runtime.dll

  - id: product-name
    desc: ArgutrackDNN.Runtime product name
    if:
      type: value
      path: pe.version.product_name
      exact: ArgutrackDNN.Runtime

  - id: assembly-basename
    desc: ArgutrackDNN.Runtime assembly basename
    if:
      type: path
      basename: true
      exact: ArgutrackDNN.Runtime.dll

composite_rules:
  - id: official-runtime-binary
    desc: Official ArgutrackDNN.Runtime library
    crit: notable
    conf: 0.99
    all:
      - id: original-filename
      - id: product-name
      - id: assembly-basename
