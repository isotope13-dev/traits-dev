# agent-evaluator (github.com/bullpeng72/Agent-Evaluator) — an SDK that scores
# AI agents across deployment-readiness gates. Its Evaluator_Examples/ demos
# feed prompt-injection strings (directly and via mock web pages) into the
# agent under test to exercise the security trackers, and the output-leak
# tracker carries IBAN, resident-number and crypto-address patterns to flag
# data an agent should not emit. Those strings are evaluation inputs and
# detector tables, not behaviour of the package.
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]
  crit: notable
  conf: 0.95

traits:
  - id: pyproject-name
    desc: pyproject.toml package is agent-evaluator
    size_min: 1
    if:
      type: value
      path: project.name
      exact: agent-evaluator

  - id: pyproject-repository
    desc: pyproject.toml repository is Agent-Evaluator
    size_min: 1
    if:
      type: value
      path: project.urls.Repository
      exact: https://github.com/bullpeng72/Agent-Evaluator

composite_rules:
  - id: package-context
    desc: Archive is the agent-evaluator SDK source
    crit: exception
    all:
      - id: pyproject-name
      - id: pyproject-repository
