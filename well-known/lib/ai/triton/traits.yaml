# Triton ships native compiler and CUDA profiling/disassembly components.  The
# binaries intentionally inspect GPU hardware and may carry CUDA device-code
# ELF images inside a signed Windows PE.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: triton-package-binary
    desc: Triton package native binary
    crit: notable
    conf: 0.98
    size_min: 4096
    size_max: 500000000
    if:
      type: path
      regex: '(?i)(^|[\\/])triton[\\/]'

  - id: triton-native-extension
    desc: Triton native compiler extension
    crit: notable
    conf: 0.98
    size_min: 4096
    size_max: 500000000
    if:
      type: basename
      exact: libtriton.pyd
      case_insensitive: true
