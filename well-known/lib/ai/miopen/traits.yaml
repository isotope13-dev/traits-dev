# AMD MIOpen is the ROCm convolution library. Its generated kernel-name
# tables are stack stores, not a packed string table.
defaults:
  platforms: [windows]
  for: [dll, pe]
traits:
  - id: miopen-native-library
    desc: AMD MIOpen convolution library
    crit: notable
    conf: 0.98
    size_min: 1000000
    size_max: 2000000000
    if:
      type: basename
      exact: MIOpen.dll
      case_insensitive: true
