# Tiktoken.Encodings.* -- the tryAGI/Tiktoken .NET byte-pair-encoding
# vocabularies (cl100k, o200k, p50k, r50k). Each assembly is a multi-megabyte
# table of ranked tokens, so ordinary words and project names (`skuld`,
# `tvasion`) occur in it as vocabulary entries, not as tool branding.
defaults:
  platforms: [unix, windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 1000000
  size_max: 20000000

traits:
  - id: tiktoken-encoding-vocabulary-assembly
    desc: Tiktoken BPE vocabulary assembly
    if:
      type: basename
      regex: '(?i)^Tiktoken\.Encodings\.(cl100k|o200k|p50k|r50k)\.dll$'

  # The same vocabularies ship as a plain-text resource of `<base64 token>
  # <rank>` lines inside an AI library. The table opens with the single-byte
  # tokens '!', '"', '#', '$' at ranks 0-3. Its base64 entries decode to
  # ordinary identifiers (WebRequest, MemoryStream) at arbitrary ranks.
  - id: tiktoken-bpe-rank-table-resource
    desc: Embedded Tiktoken BPE rank table
    if:
      type: raw
      section: .text
      regex: 'IQ== 0\nIg== 1\nIw== 2\nJA== 3\n'
