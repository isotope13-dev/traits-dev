# ptxas, CUDA's PTX-to-SASS assembler, ships unsigned in NVIDIA's
# nvidia-cuda-nvcc wheels and inside Triton's backends/nvidia/bin. Its
# identity is its job: PTX ISA version and target diagnostics that a binary
# merely borrowing NVIDIA's name has no reason to carry.
defaults:
  platforms: [windows, linux]
  for: [pe, elf]
  crit: notable
  conf: 0.97
  size_min: 5000000
  size_max: 200000000
traits:
  - id: ptxas-isa-version-diagnostic
    desc: PTX ISA version requirement diagnostic
    if:
      type: text
      section: rdata
      substr: "requires PTX ISA .version %d.%d or later"
  - id: ptxas-unsupported-version-diagnostic
    desc: Unsupported PTX version diagnostic
    if:
      type: text
      section: rdata
      substr: "Unsupported .version %s; current version is"
  - id: ptxas-input-label
    desc: ptxas input source label
    if:
      type: text
      section: rdata
      substr: ptxas application ptx input

composite_rules:
  - id: cuda-ptx-assembler
    desc: NVIDIA CUDA ptxas PTX assembler
    all:
      - id: ptxas-isa-version-diagnostic
      - id: ptxas-unsupported-version-diagnostic
      - id: ptxas-input-label
