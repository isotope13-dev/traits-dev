# NVIDIA's CUDA math libraries ship unsigned inside PyTorch. They link
# IsDebuggerPresent through the CRT and call VirtualProtect, and they are
# almost entirely code. The versioned basename is the toolkit redistributable.
defaults:
  platforms: [windows]
  for: [dll, pe]
traits:
  - id: cuda-math-library-basename
    desc: NVIDIA CUDA math library DLL
    crit: notable
    conf: 0.98
    size_min: 1000000
    size_max: 2000000000
    if:
      type: basename
      regex: '(?i)^cu(blas|sparse)64_\d+\.dll$'

  - id: cuda-runtime-library-basename
    desc: NVIDIA CUDA runtime library DLL
    crit: notable
    conf: 0.98
    size_min: 100000
    size_max: 50000000
    if:
      type: basename
      regex: '(?i)^cudart64_\d+\.dll$'

  - id: cuda-runtime-export
    desc: NVIDIA CUDA runtime initialization export
    crit: notable
    conf: 0.99
    size_min: 100000
    size_max: 50000000
    if:
      type: export
      exact: cudaRuntimeGetVersion

composite_rules:
  - id: cuda-runtime-library
    desc: NVIDIA CUDA runtime library
    crit: notable
    conf: 0.99
    all:
      - id: cuda-runtime-library-basename
      - id: cuda-runtime-export
