# sherpa-onnx (k2-fsa) — open-source on-device speech toolkit (ASR/TTS/VAD
# built on onnxruntime). Its Rust sys crate's build.rs downloads prebuilt
# native libraries from the project's own GitHub releases at build time.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.99

traits:
  - id: sherpa-onnx-release-url
    desc: sherpa-onnx official GitHub release download URL
    if:
      type: text
      substr: github.com/k2-fsa/sherpa-onnx/releases/download

  - id: sherpa-onnx-sys-crate-name
    desc: sherpa-onnx-sys Rust crate name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: sherpa-onnx-sys

composite_rules:
  - id: official-project-context
    desc: Official sherpa-onnx project build context
    crit: exception
    conf: 0.99
    any:
      - id: sherpa-onnx-release-url
      - id: sherpa-onnx-sys-crate-name
