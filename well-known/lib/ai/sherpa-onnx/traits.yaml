defaults:
  platforms:
  - unix
  - windows
  for:
  - rust
  crit: notable
  conf: 0.99
traits:
- id: sherpa-onnx-release-url
  desc: sherpa-onnx official GitHub release download URL
  if:
    type: text
    substr: github.com/k2-fsa/sherpa-onnx/releases/download
- id: sherpa-onnx-sys-crate-name
  desc: sherpa-onnx-sys Rust crate name
  for:
  - cargo.toml
  if:
    type: value
    path: package.name
    exact: sherpa-onnx-sys
