# TensorFlow.
#
# Relocated from metadata/build/ci/ (was `tensorflow.yaml`). The matcher finds
# `with_the_same_user`, the name of TensorFlow's own Docker helper that
# re-executes a build under the invoking uid/gid. That is a named library's
# script, i.e. a software fingerprint — TAXONOMY sends those to well-known/,
# not to a CI-pipeline metadata bucket.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  # Notable, not component: `with_the_same_user` names TensorFlow's own Docker
  # helper, so on its own it says "this is TensorFlow's build tooling" — a
  # standalone identity, which is what well-known/ traits are for. As a
  # component reachable only from `unless:` it was a fragment feeding nothing.
  - id: tensorflow-user-wrapper
    desc: TensorFlow CI user wrapper script
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: with_the_same_user script
