# TensorFlow.
#
# Relocated from metadata/build/ci/ (was `tensorflow.yaml`). The matcher finds
# `with_the_same_user`, the name of TensorFlow's own Docker helper that
# re-executes a build under the invoking uid/gid. That is a named library's
# script, i.e. a software fingerprint — TAXONOMY sends those to well-known/,
# not to a CI-pipeline metadata bucket.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.95

traits:
  # Notable, not component: `with_the_same_user` names TensorFlow's own Docker
  # helper, so on its own it says "this is TensorFlow's build tooling" — a
  # standalone identity, which is what well-known/ traits are for. As a
  # component reachable only from `unless:` it was a fragment feeding nothing.
  - id: tensorflow-user-wrapper
    desc: TensorFlow CI user wrapper script
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: with_the_same_user script

  - id: tensorflow-pdb-path
    desc: TensorFlow build artifact PDB path
    for: [pe]
    platforms: [windows]
    size_min: 16384
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/](tensorflow|org_tensorflow)[\\/]'

  - id: tensorflow-c-extension-export
    desc: TensorFlow C extension export symbol
    for: [pe, elf, macho]
    size_min: 16384
    if:
      type: export
      regex: '^PyInit__pywrap_tensorflow'

  - id: tensorflow-c-api-export
    desc: TensorFlow C API export symbol
    for: [pe, elf, macho]
    size_min: 16384
    if:
      type: export
      exact: TF_NewTensor

composite_rules:
  - id: tensorflow-native-library
    desc: TensorFlow native library binary
    crit: notable
    conf: 0.99
    for: [pe, elf, macho]
    all:
      - id: tensorflow-pdb-path
    any:
      - id: tensorflow-c-extension-export
      - id: tensorflow-c-api-export
