# OpenAgent — MIT LLM agent framework with bundled MCP tools
# (openagent-framework on PyPI).
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, typescript, javascript]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name-openagent-framework
    desc: openagent-framework PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: openagent-framework

  - id: wheel-distribution-openagent-framework
    desc: openagent_framework wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: openagent_framework

  - id: computer-control-mcp-entry
    desc: OpenAgent computer-control MCP entry
    for: [typescript]
    if:
      type: path
      regex: 'computer-control[\\/]src[\\/]main\.ts$'

  - id: computer-use-mcp-stdio-banner
    desc: Computer Use MCP stdio banner
    for: [typescript]
    if:
      type: text
      substr: 'Computer Use MCP server running on stdio'

  - id: web-search-extractor-module
    desc: OpenAgent web-search extractor module
    for: [typescript]
    if:
      type: path
      regex: 'web-search[\\/]src[\\/]enhanced-content-extractor\.ts$'

  - id: enhanced-content-extractor-log
    desc: EnhancedContentExtractor debug log prefix
    for: [typescript, javascript]
    if:
      type: text
      substr: '[EnhancedContentExtractor]'

composite_rules:
  - id: openagent-framework-runtime
    desc: OpenAgent MCP agent framework
    needs: 2
    any:
      - id: pypi-name-openagent-framework
      - id: wheel-distribution-openagent-framework
      - id: computer-control-mcp-entry
      - id: computer-use-mcp-stdio-banner
      - id: web-search-extractor-module
      - id: enhanced-content-extractor-log
