# tokn-provider-copilot — GitHub Copilot token/OAuth provider for the
# tokn router. reqwest HTTP, Copilot token exchange, and `gh auth token`
# process spawn are product credential import, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 10000000

traits:
  - id: crate-name
    desc: tokn-provider-copilot crate package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: tokn-provider-copilot

  - id: crate-repository
    desc: tokn-provider-copilot crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/agentic-rs/tokn

  - id: cargo-package-name
    desc: tokn-provider-copilot Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: tokn-provider-copilot

  - id: github-repo
    desc: agentic-rs tokn GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/agentic-rs/tokn

  - id: copilot-internal-token-url
    desc: GitHub Copilot internal token API URL
    for: [rust]
    conf: 0.98
    if:
      type: text
      substr: api.github.com/copilot_internal/v2/token
