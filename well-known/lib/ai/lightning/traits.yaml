# Lightning (formerly PyTorch Lightning) — deep learning and model serving framework.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: lightning-ai-copyright-header
    desc: Lightning AI copyright header
    if:
      type: text
      regex: '(?i)#\s*Copyright\s+(The\s+)?Lightning\s+AI\s+team\.'

  - id: lightning-app-python-server
    desc: Lightning App PythonServer component path
    if:
      type: path
      regex: '(?i)serve[\\/]python_server\.py$'

  - id: lightning-server-image-sample
    desc: Lightning Server Image component sample data
    if:
      type: text
      substr: 'Lightning-AI/LAI-Triton-Server-Component/main/catimage.png'

composite_rules:
  - id: lightning-python-server-context
    desc: Lightning App PythonServer image-serving component context
    crit: exception
    conf: 0.99
    all:
      - id: lightning-app-python-server
      - id: lightning-ai-copyright-header
