# FPGAi — proprietary CLI FPGA/HDL assistant. Native Cython modules
# talk HTTP to the vendor API and may spawn local EDA tools; that is
# product behavior, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, text, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: fpgai PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: fpgai

  - id: package-metadata-name
    desc: fpgai PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*fpgai\s*$'

  - id: console-script
    desc: fpgai CLI console-script entry
    for: [text, pkginfo]
    if:
      type: text
      substr: 'fpgai = fpgai.cli:main'

  - id: cli-so-member
    desc: FPGAi Cython CLI shared object path
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: 'fpgai/cli\.cpython'

  - id: cli-module-symbol
    desc: FPGAi Cython CLI module symbol
    for: [elf, so]
    if:
      type: text
      substr: fpgai.cli.handle_command
      section: .rodata

composite_rules:
  - id: fpgai-package
    desc: FPGAi FPGA design assistant package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: console-script
      - id: cli-so-member
      - id: cli-module-symbol
    needs: 2
