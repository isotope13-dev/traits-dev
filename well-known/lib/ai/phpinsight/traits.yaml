# PHPInsight (jwhennessey/phpinsight) — Naive Bayes sentiment classifier for
# PHP. Dictionary reload uses require_once of local source.*.php word lists and
# _cleanString builds Latin-1 diacritic tables with dense chr() concatenation;
# those are library mechanics, not trojan wrappers or string obfuscation.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: phpinsight-namespace
    desc: PHPInsight sentiment library namespace
    if:
      type: text
      regex: '(?m)^namespace\s+PHPInsight\s*;'

  - id: phpinsight-package-header
    desc: PHPInsight library copyright header
    if:
      type: text
      substr: 'phpInsight is a Naive Bayes classifier to calculate sentiment'

  - id: phpinsight-composer-name
    desc: PHPInsight Composer package name
    for: [json]
    if:
      type: text
      substr: '"name": "jwhennessey/phpinsight"'

composite_rules:
  - id: phpinsight-library-context
    desc: Recognized PHPInsight sentiment library
    crit: notable
    conf: 0.99
    any:
      - id: phpinsight-namespace
      - id: phpinsight-package-header
      - id: phpinsight-composer-name
