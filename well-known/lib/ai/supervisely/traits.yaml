# Supervisely — Computer vision and deep learning platform SDK.
# https://github.com/supervisely/supervisely
defaults:
  platforms: [unix, windows]
  for: [whl, zip, python]
  crit: notable
  conf: 0.99

traits:
  - id: supervisely-package-path
    desc: Supervisely wheel or extracted member path
    if:
      type: path
      regex: '(^|[\\/])supervisely(-[0-9]|@[0-9])'

  - id: supervisely-member-path
    desc: Supervisely package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])supervisely[\\/]'

  - id: supervisely-import
    desc: Imports supervisely module
    for: [python]
    if:
      type: text
      regex: '\b(from\s+supervisely(\.\w+){0,5}\s+import|import\s+supervisely\b)'

composite_rules:
  - id: supervisely-package-context
    desc: Recognized Supervisely package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: supervisely-package-path
      - id: supervisely-member-path
      - id: supervisely-import
