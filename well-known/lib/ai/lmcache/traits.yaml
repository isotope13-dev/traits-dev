# LMCache — official LLM KV-cache / serving extension (PyPI lmcache,
# github.com/LMCache/LMCache). Network, GPU, and IPC patterns are product
# behavior; known CVEs are tracked separately from supply-chain malware.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: pypi-package-name
    desc: LMCache PyPI distribution name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: lmcache

  - id: wheel-distribution-name
    desc: LMCache wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: lmcache

  - id: upstream-repository
    desc: LMCache upstream GitHub repository
    for: [pkginfo, python, markdown]
    conf: 0.99
    if:
      type: text
      regex: '(?i)github\.com/LMCache/LMCache\b'

  - id: llm-serving-summary
    desc: LMCache LLM serving extension summary phrase
    for: [pkginfo]
    conf: 0.96
    if:
      type: value
      path: summary
      regex: '(?i)LLM serving engine extension'

  - id: wheel-member-prefix
    desc: LMCache wheel member path prefix
    for: [python, javascript, pyc, shell, binaries, so]
    if:
      type: path
      regex: '(?i)(^|[\\/])lmcache([\\/]|[-_][0-9])'

  - id: spdx-package-header
    desc: LMCache SPDX license header in source
    for: [python]
    conf: 0.95
    if:
      type: text
      substr: "SPDX-License-Identifier: Apache-2.0"

composite_rules:
  - id: package-identity
    desc: LMCache PyPI package identity
    conf: 0.99
    scope: archive
    any:
      - id: pypi-package-name
      - id: wheel-distribution-name
    all:
      - id: upstream-repository

  - id: wheel-member-context
    desc: File inside published LMCache wheel
    crit: exception
    conf: 0.99
    any:
      - id: wheel-member-prefix
      - id: package-identity
