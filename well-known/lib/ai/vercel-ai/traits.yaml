# Vercel AI SDK (`ai`) — documentation and runtime helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: rsc-experimental-note
    desc: Vercel AI SDK RSC experimental note
    if:
      type: text
      substr: 'AI SDK RSC is currently experimental'

  - id: vendored-path
    desc: vendored Vercel AI SDK package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/ai/'

composite_rules:
  - id: vercel-ai-sdk
    desc: Vercel AI SDK library
    any:
      - id: rsc-experimental-note
      - id: vendored-path
