# CueMap — open-source AI developer engine and tokenizer runtime.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, javascript, json]
  crit: notable
  conf: 0.95
  size_min: 100
  size_max: 536870912

traits:
  - id: cuemap-repository-url
    desc: Official CueMap GitHub repository URL
    if:
      type: text
      substr: github.com/cuemap-dev/cuemap

  - id: cuemap-engine-source-path
    desc: CueMap engine Rust source path
    if:
      type: text
      regex: 'cuemap/cuemap/src/(agent|project_sync|persistence)\.rs'

  - id: cuemap-namespace
    desc: CueMap Rust namespace reference
    if:
      type: text
      regex: '\bcuemap::(projects|semantic)\b'

composite_rules:
  - id: cuemap-engine-context
    desc: Recognized CueMap AI engine runtime context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: cuemap-repository-url
      - id: cuemap-engine-source-path
      - id: cuemap-namespace
