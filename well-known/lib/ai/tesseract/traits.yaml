# Tesseract OCR engine (open-source optical character recognition library).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 500000000

traits:
  - id: tesseract-c-api-export
    desc: Tesseract OCR C-API exported symbol
    for: [pe, dll, elf, so, macho, dylib]
    crit: baseline
    if:
      type: export
      regex: '^tess_(create|destroy|init|version|recognize)$'

  - id: tesseract-cpp-api-symbol
    desc: Tesseract OCR C++ namespace or class symbol
    for: [pe, dll, elf, so, macho, dylib]
    crit: baseline
    if:
      type: symbol
      substr: 'TessBaseAPI@tesseract'

  - id: tesseract-upstream-model-url
    desc: Official Tesseract OCR traineddata model URL
    crit: notable
    conf: 0.98
    for: [binaries, scripts, text]
    if:
      type: text
      substr: 'github.com/tesseract-ocr/tessdata'

composite_rules:
  - id: tesseract-ocr-engine
    desc: Tesseract OCR engine library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: tesseract-c-api-export
      - id: tesseract-cpp-api-symbol
      - id: tesseract-upstream-model-url
