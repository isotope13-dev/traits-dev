# jieba -- the Chinese text segmentation library.
#
# `_compat.py` bootstraps jieba's optional PaddlePaddle backend: inside
# enable_paddle(), `except ImportError` runs
# `os.system("pip install paddlepaddle-tiny")` with a log line saying so. The
# install target is a fixed public package, and it runs only when the caller
# explicitly enables the paddle backend -- a transparent optional-dependency
# bootstrap, not a silent fallback install.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: jieba-paddle-bootstrap
    desc: jieba optional PaddlePaddle bootstrap
    if:
      type: text
      substr: paddlepaddle-tiny
