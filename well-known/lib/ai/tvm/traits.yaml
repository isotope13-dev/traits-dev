# Apache TVM — ML compiler runtime bundled by TileLang and other stacks.
# RPC client writes a minrpc helper and chmods it for remote compilation;
# FX translators use self.env[node] lookups that are not dotenv paths.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.99
  size_max: 524288000

traits:
  - id: tvm-package-member-path
    desc: TVM Python package member path
    crit: notable
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])tvm[\\/]'

  - id: tvm-rpc-tracker-magic
    desc: TVM RPC tracker handshake marker
    crit: notable
    for: [python]
    if:
      type: text
      substr: RPC_TRACKER_MAGIC

  - id: tvm-base-import
    desc: TVM base module import
    crit: notable
    for: [python]
    if:
      type: import
      regex: '^tvm(\.|$)'

composite_rules:
  - id: tvm-compiler-runtime
    desc: Apache TVM compiler runtime package
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: tvm-package-member-path
      - id: tvm-rpc-tracker-magic
      - id: tvm-base-import
