# LangChain.js core abstractions (@langchain/core) and related SDK packages.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: langchain-community-package-path
    desc: LangChain community package path
    for: [python, source, scripts, conda, tar.zst]
    if:
      type: path
      regex: '(?i)langchain[-_]community'

  - id: langchain-core-package-name
    desc: LangChain core package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@langchain/core'

  - id: langgraph-sdk-package-name
    desc: LangGraph SDK package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@langchain/langgraph-sdk'

  - id: langgraph-checkpoint-package-name
    desc: LangGraph checkpoint package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@langchain/langgraph-checkpoint'

  - id: langgraph-checkpoint-npm-name
    desc: LangGraph checkpoint npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@langchain/langgraph-checkpoint'

  - id: langchain-core-package-path
    desc: LangChain core package member path
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@langchain[/\\]core'

  - id: langgraph-sdk-package-path
    desc: LangGraph SDK package member path
    for: [javascript, typescript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@langchain[/\\]langgraph-sdk'

  - id: langgraph-checkpoint-package-path
    desc: LangGraph checkpoint package member path
    for: [javascript, typescript, scripts, manifests, data, source, npm]
    conf: 0.96
    if:
      type: path
      regex: '(?i)@langchain[/\\]langgraph-checkpoint'

  - id: langchain-anthropic-package-path
    desc: LangChain Anthropic package member path
    conf: 0.96
    if:
      type: path
      regex: '(?i)@langchain[/\\]anthropic'
