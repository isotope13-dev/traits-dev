defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 500000000

traits:
  - id: whisper-cli-basename
    desc: whisper.cpp command-line binary basename
    crit: baseline
    if:
      type: path
      basename: true
      exact: whisper-cli
  - id: whisper-api-symbol
    desc: whisper.cpp native API symbol
    crit: baseline
    if:
      type: symbol
      exact: _whisper_version

composite_rules:
  - id: whisper-cpp-cli
    desc: whisper.cpp command-line binary
    crit: notable
    conf: 0.98
    all:
      - id: whisper-cli-basename
      - id: whisper-api-symbol
