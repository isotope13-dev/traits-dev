defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 500000000

traits:
  - id: whisper-cli-basename
    desc: whisper.cpp command-line binary basename
    crit: notable
    if:
      type: path
      basename: true
      exact: whisper-cli
  - id: whisper-api-symbol
    desc: whisper.cpp native API symbol
    crit: notable
    if:
      type: symbol
      exact: _whisper_version
  - id: whisper-cpp-github-release-download-url
    desc: whisper.cpp GitHub release download URL
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [python, shell, scripts, source, text]
    if:
      type: text
      substr: github.com/ggml-org/whisper.cpp/releases/download
  - id: huggingface-whisper-cpp-model-url
    desc: Hugging Face whisper.cpp GGML model URL
    crit: notable
    conf: 0.96
    platforms: [unix, windows]
    for: [python, shell, scripts, source, text]
    if:
      type: text
      regex: 'huggingface\.co/[\w.-]+/whisper\.cpp/resolve/'

composite_rules:
  - id: whisper-cpp-cli
    desc: whisper.cpp command-line binary
    crit: notable
    conf: 0.98
    all:
      - id: whisper-cli-basename
      - id: whisper-api-symbol
