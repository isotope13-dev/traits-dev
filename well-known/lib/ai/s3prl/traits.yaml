# S3PRL — Speech Pre-training and Representation Learning toolkit.
defaults:
  platforms: [unix, windows]
  for: [python, source, text, markdown, whl, zip, tar]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: s3prl source tree path
    if:
      type: path
      regex: '(?i)(^|[/\\])s3prl([/\\]|$)'

  - id: repository-path
    desc: s3prl repository checkout path
    if:
      type: path
      regex: 'self-supervised-speech-pretraining'

  - id: repository-url
    desc: s3prl upstream repository URL
    for: [markdown, python, text]
    if:
      type: text
      substr: github.com/andi611/self-supervised-speech-pretraining-and-representation-learning

composite_rules:
  - id: s3prl-speech-toolkit
    desc: S3PRL speech toolkit context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: source-path
      - id: repository-path
      - id: repository-url
