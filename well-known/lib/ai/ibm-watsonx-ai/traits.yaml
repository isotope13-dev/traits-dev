# IBM watsonx.ai — official Python SDK for IBM watsonx.ai (IBM/watsonx-ai-python-sdk).
# ML pipeline save/compress helpers stage model artifacts for upload, not theft.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: ibm_watsonx_ai wheel distribution name
    for: [whl, pkginfo]
    if:
      type: value
      path: whl.distribution
      exact: ibm_watsonx_ai

  - id: package-module-path
    desc: ibm_watsonx_ai package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])ibm_watsonx_ai[\\/]'

  - id: documentation-homepage
    desc: IBM watsonx.ai Python SDK documentation
    if:
      type: text
      substr: ibm.github.io/watsonx-ai-python-sdk

  - id: ml-pipeline-archive-save
    desc: watsonx.ai ML pipeline archive save helper
    for: [python]
    if:
      type: text
      substr: ml_pipeline.write().overwrite().save

composite_rules:
  - id: ibm-watsonx-ai-sdk-context
    desc: IBM watsonx.ai official Python SDK
    crit: exception
    conf: 0.99
    scope: archive
    for: [python, whl]
    all:
      - id: package-module-path
    any:
      - id: wheel-distribution
      - id: documentation-homepage
      - id: ml-pipeline-archive-save
