# AtomWorks (RosettaCommons) biomolecular ML data pipeline, often vendored
# into structure-prediction packages. Its transforms pass a local `data`
# sample dict between stages; some fields hold stringified Python literals.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: transform-base-import
    desc: Imports the AtomWorks ML Transform base
    if:
      type: import
      regex: '(^|\.)atomworks\.ml\.transforms\.base$'
