defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: llama2.c source tree path
    for: [source, c, python, shell, text, markdown]
    if:
      type: path
      regex: '(?i)(^|[\\/])llama2(\.c)?([\\/]|$)'

  - id: repository-url
    desc: llama2.c upstream GitHub repository URL
    for: [markdown, python, text]
    if:
      type: text
      substr: github.com/karpathy/llama2.c
