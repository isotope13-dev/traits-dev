defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: colord-dependency
    desc: Declares colord npm dependency
    if:
      type: value
      path: dependencies.colord
      exists: true
  - id: colord-dev-dependency
    desc: Declares colord npm development dependency
    if:
      type: value
      path: devDependencies.colord
      exists: true
  - id: colord-optional-dependency
    desc: Declares colord npm optional dependency
    if:
      type: value
      path: optionalDependencies.colord
      exists: true
  - id: colord-peer-dependency
    desc: Declares colord npm peer dependency
    if:
      type: value
      path: peerDependencies.colord
      exists: true

composite_rules:
  - id: colord-package-context
    desc: colord npm dependency context
    crit: exception
    conf: 0.99
    scope: outer
    for: [package.json, archives]
    any:
      - id: colord-dependency
      - id: colord-dev-dependency
      - id: colord-optional-dependency
      - id: colord-peer-dependency
