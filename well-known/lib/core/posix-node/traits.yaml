# posix-node is a native Node.js wrapper around POSIX calls, built with Zig.
defaults:
  platforms: [unix]
  for: [elf, macho, javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: native-addon-path
    desc: posix-node native addon path
    size_min: 65536
    size_max: 10000000
    for: [elf, macho]
    if:
      type: path
      regex: 'posix-node@[0-9]'

  - id: package-name
    desc: posix-node package manifest
    size_max: 100000
    for: [package.json]
    if:
      type: value
      path: name
      exact: posix-node

composite_rules:
  - id: posix-node-library
    desc: posix-node native library package
    any:
      - id: native-addon-path
      - id: package-name
