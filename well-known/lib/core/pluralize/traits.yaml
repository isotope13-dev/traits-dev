# pluralize — pluralize English words.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: pluralize npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'pluralize'

  - id: vendored-path
    desc: vendored pluralize package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/pluralize/'

composite_rules:
  - id: library
    desc: pluralize English inflection
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
