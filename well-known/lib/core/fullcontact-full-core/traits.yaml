# full.core — FullContact's Clojure(Script) logging, config, and sugar
# library. Logback Joran configure, FULL_CONFIG env, and System/exit on
# missing files are product startup, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: full.core Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: full.core

  - id: pom-group
    desc: fullcontact Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: fullcontact

  - id: github-repo
    desc: fullcontact full.core GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/fullcontact/full.core

  - id: defproject
    desc: fullcontact full.core Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject fullcontact/full.core'

  - id: log-namespace-path
    desc: full.core log namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)full[\\/]core[\\/]log\.cljc$'

composite_rules:
  - id: full-core-maven-library
    desc: FullContact full.core Clojure library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
