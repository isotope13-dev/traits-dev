# `events` — the ES5 EventEmitter shim that browserify/webpack inject in place
# of Node's built-in `events` module (github.com/browserify/events, originally
# Gozala/events). Identity only: this file answers "is this the events shim",
# not "is that bad". It is one of the most-installed packages on npm, which
# also makes it a standing name-squat target; the impersonation composites
# under objectives/supply-chain/impersonation/ reference these traits and add
# the "…published under a name that is not `events`" half themselves.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: events shim npm package name
    for: [package.json]
    conf: 0.97
    if:
      type: value
      path: name
      regex: '^events(-browserify)?$'

  # Introduced for `events.once()` EventTarget support; the name appears in no
  # other widely shipped module, so it identifies this implementation even
  # after minification-free bundling.
  - id: event-target-agnostic-add-listener
    desc: events shim EventTarget listener helper
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: 'function eventTargetAgnosticAddListener('

  - id: max-listeners-leak-warning
    desc: EventEmitter max-listeners leak warning text
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Possible EventEmitter memory leak detected.'

  - id: default-max-listeners-range-error
    desc: events shim defaultMaxListeners range error text
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: 'The value of "defaultMaxListeners" is out of range.'

composite_rules:
  - id: node-events-module-implementation
    desc: events EventEmitter shim implementation
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: event-target-agnostic-add-listener
      - id: max-listeners-leak-warning
    any:
      - id: default-max-listeners-range-error
      - id: metadata/package/testing/harness/runtime::joyent-copyright
