# sindresorhus/p-queue — promise queue with concurrency control.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: p-queue-package-name
    desc: p-queue package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: p-queue

  - id: p-queue-package-path
    desc: p-queue package member path
    for: [javascript, typescript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])p-queue([/\\]|$)'
