defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: baseline
  conf: 0.95
  size_max: 5000000
traits:
- id: sentry-global
  desc: Sentry JavaScript global
  if:
    type: text
    substr: __SENTRY__
- id: sentry-logger-text
  desc: Sentry JavaScript logger text
  if:
    type: text
    substr: Sentry Logger
- id: sentry-sdk-version-field
  desc: Sentry SDK version field
  if:
    type: text
    substr: sdkProcessingMetadata
- id: sentry-raven-legacy-bundle
  desc: Legacy Raven/Sentry bundled browser client
  crit: baseline
  conf: 0.95
  if:
      type: text
      regex: _\$Breadcrumb_[0-9]+[\s\S]{0,160}_\$breadcrumbTypes_[0-9]+
- id: sentry-browser-package-path
  desc: Sentry browser package path
  crit: notable
  conf: 0.99
  for: [scripts, manifests, data, source]
  if:
    type: path
    regex: 'node_modules[\\/]@sentry[\\/]browser'
- id: sentry-core-package-path
  desc: Sentry core package path
  crit: notable
  conf: 0.99
  for: [scripts, manifests, data, source]
  if:
    type: path
    regex: '@sentry[/\\]core'
- id: sentry-api-version
  desc: Sentry ingest API version constant
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: SENTRY_API_VERSION
- id: sentry-develop-docs
  desc: Sentry develop.sentry.dev documentation URL
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: develop.sentry.dev
- id: sentry-main-carrier
  desc: Sentry async context main carrier
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: getMainCarrier
- id: sentry-fetch-instrument
  desc: Sentry fetch instrumentation helper
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: addFetchInstrumentationHandler
- id: sentry-default-instance
  desc: Sentry integration default-instance flag
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: isDefaultInstance
# Relocated from objectives/collection/stealer/host-profile/. `Sentry.setUser`
# is the SDK's documented call for attaching user context to an error report;
# every Sentry-instrumented application makes it, and an npm CLI bundle matched
# on exactly that. The PII-collection intent lives in the composite there,
# which additionally requires `sendDefaultPii: true`, an `ip_address` field and
# a public-IP lookup endpoint.
- id: sentry-set-user-call
  desc: Sentry setUser call
  crit: notable
  conf: 0.9
  unless:
  - id: sentry-js-sdk
  if:
    type: symbol
    kind: call
    exact: Sentry.setUser

composite_rules:
- id: sentry-js-sdk
  desc: Sentry JavaScript SDK
  crit: notable
  conf: 0.98
  all:
    - id: sentry-core-package-path
  any:
    - id: sentry-global
    - id: sentry-logger-text
    - id: sentry-sdk-version-field
    - id: sentry-raven-legacy-bundle
    - id: sentry-api-version
    - id: sentry-develop-docs
    - id: sentry-main-carrier
    - id: sentry-fetch-instrument
    - id: sentry-default-instance
    - id: sentry-browser-package-path
