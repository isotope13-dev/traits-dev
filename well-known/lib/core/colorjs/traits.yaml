# color-normalize and color-rgba are official colorjs utilities. Their exact
# dependency identities are benign context for cleave's generic `color-*`
# suspicious-dependency heuristic.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: color-normalize-dependency
    desc: Declares color-normalize npm dependency
    if:
      type: value
      path: dependencies.color-normalize
      exists: true
  - id: color-normalize-dev-dependency
    desc: Declares color-normalize npm dev dependency
    if:
      type: value
      path: devDependencies.color-normalize
      exists: true
  - id: color-normalize-optional-dependency
    desc: Declares color-normalize npm optional dependency
    if:
      type: value
      path: optionalDependencies.color-normalize
      exists: true
  - id: color-normalize-peer-dependency
    desc: Declares color-normalize npm peer dependency
    if:
      type: value
      path: peerDependencies.color-normalize
      exists: true
  - id: color-rgba-dependency
    desc: Declares color-rgba npm dependency
    if:
      type: value
      path: dependencies.color-rgba
      exists: true
  - id: color-rgba-dev-dependency
    desc: Declares color-rgba npm dev dependency
    if:
      type: value
      path: devDependencies.color-rgba
      exists: true
  - id: color-rgba-optional-dependency
    desc: Declares color-rgba npm optional dependency
    if:
      type: value
      path: optionalDependencies.color-rgba
      exists: true
  - id: color-rgba-peer-dependency
    desc: Declares color-rgba npm peer dependency
    if:
      type: value
      path: peerDependencies.color-rgba
      exists: true
