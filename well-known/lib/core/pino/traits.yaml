# Pino logging library identity.  These markers are neutral on their own;
# supply-chain rules use them to distinguish a copied Pino codebase from
# ordinary Node logging code.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown]

traits:
  - id: pino-package-name
    desc: Pino logging library package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: pino

  - id: pino-upstream-source-marker
    desc: Pino README transport wording
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'In Pino terminology[\s\S]{0,200}pino\.transport'

  - id: pino-source-branding
    desc: Pino source or documentation branding
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bPino terminology\b|\bpino\.transport\b|\bpino-std-serializers\b'

composite_rules:
  - id: pino-library-context
    desc: Recognized Pino logging library package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: pino-package-name
      - id: pino-upstream-source-marker
