# Pino logging library identity.  These markers are neutral on their own;
# supply-chain rules use them to distinguish a copied Pino codebase from
# ordinary Node logging code.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown]

traits:
  - id: pino-package-name
    desc: Pino logging library package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: pino

  - id: pino-upstream-source-marker
    desc: Pino README transport wording
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'In Pino terminology[\s\S]{0,200}pino\.transport'

  - id: pino-source-branding
    desc: Pino source or documentation branding
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bPino terminology\b|\bpino\.transport\b|\bpino-std-serializers\b'

  - id: pino-transport-source-path
    desc: Bundled Pino transport module path
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: 'pino(@[0-9.]+)?/node_modules/pino/lib/transport\.js'

  - id: pino-preload-sanitizer-source
    desc: Pino worker preload sanitizer source
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      exact: function sanitizeNodeOptions(nodeOptions)

composite_rules:
  - id: pino-library-context
    desc: Recognized Pino logging library package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: pino-package-name
      - id: pino-upstream-source-marker

  # Pino removes broken inherited Node preload flags before it creates a
  # worker-thread transport. This is inspection and sanitization of an existing
  # NODE_OPTIONS value, not setup of an execution-flow hijack.
  - id: pino-preload-sanitizer-context
    desc: Pino transport sanitizes inherited Node preload flags
    crit: exception
    conf: 0.99
    near_bytes: 8192
    all:
      - id: pino-transport-source-path
      - id: pino-preload-sanitizer-source
