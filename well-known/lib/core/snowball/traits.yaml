defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe, dylib, so, dll]
  size_max: 52428800
traits:
  - id: snowball-stemmer-new-export
    desc: Snowball stemmer new export
    crit: component
    if:
      type: export
      exact: sb_stemmer_new
  - id: snowball-stemmer-stem-export
    desc: Snowball stemmer stem export
    crit: component
    if:
      type: export
      exact: sb_stemmer_stem
  - id: snowball-stemmer-delete-export
    desc: Snowball stemmer delete export
    crit: component
    if:
      type: export
      exact: sb_stemmer_delete
  - id: snowball-stemmer-length-export
    desc: Snowball stemmer length export
    crit: component
    if:
      type: export
      exact: sb_stemmer_length
  - id: snowball-stemmer-list-export
    desc: Snowball stemmer list export
    crit: component
    if:
      type: export
      exact: sb_stemmer_list
composite_rules:
  - id: snowball-stemmer-export
    desc: Snowball stemmer API export
    crit: notable
    conf: 0.98
    any:
      - id: snowball-stemmer-new-export
      - id: snowball-stemmer-stem-export
      - id: snowball-stemmer-delete-export
      - id: snowball-stemmer-length-export
      - id: snowball-stemmer-list-export
