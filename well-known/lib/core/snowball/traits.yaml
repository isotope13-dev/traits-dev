defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe, dylib, so, dll]
  size_max: 52428800
traits:
  - id: snowball-stemmer-new-export
    desc: Snowball stemmer new export
    crit: component
    if:
      type: export
      exact: sb_stemmer_new
  - id: snowball-stemmer-stem-export
    desc: Snowball stemmer stem export
    crit: component
    if:
      type: export
      exact: sb_stemmer_stem
  - id: snowball-stemmer-delete-export
    desc: Snowball stemmer delete export
    crit: component
    if:
      type: export
      exact: sb_stemmer_delete
  - id: snowball-stemmer-length-export
    desc: Snowball stemmer length export
    crit: component
    if:
      type: export
      exact: sb_stemmer_length
  - id: snowball-stemmer-list-export
    desc: Snowball stemmer list export
    crit: component
    if:
      type: export
      exact: sb_stemmer_list
  # Snowball's `algorithm_names` catalog, the table behind sb_stemmer_list():
  # each language's ISO-639-1, ISO-639-2/B and ISO-639-2/T codes followed by
  # its English name, NUL-separated and NUL-padded. A statically linked
  # Snowball exports none of the sb_stemmer_* symbols above, so inside a host
  # library — Kuzu's full-text-search extension, for one — this table is the
  # only thing that identifies the stemmer. Anchoring on the basque/catalan run
  # keeps the pattern inside the raw-regex budget while staying specific to the
  # interleaved code-plus-name layout, which no ordinary language list has.
  - id: snowball-algorithm-name-table
    desc: Snowball stemmer language catalog
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: 'basque\x00+ca\x00+cat\x00+catalan'
      section: rdata

composite_rules:
  - id: snowball-stemmer-export
    desc: Snowball stemmer API export
    crit: notable
    conf: 0.98
    any:
      - id: snowball-stemmer-new-export
      - id: snowball-stemmer-stem-export
      - id: snowball-stemmer-delete-export
      - id: snowball-stemmer-length-export
      - id: snowball-stemmer-list-export
