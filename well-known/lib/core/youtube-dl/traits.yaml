defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.95
  size_max: 5000000
traits:
- id: packaged-youtube-dl-exe
  desc: Packaged youtube-dl executable
  crit: notable
  conf: 0.97
  for: [pe]
  size_min: 1000000
  size_max: 100000000
  if:
    type: path
    substr: youtube-dl.exe
- id: packaged-youtube-dl-member
  desc: youtube-dl packaged member
  crit: notable
  conf: 0.97
  size_max: 1073741824
  if:
    type: path
    regex: '(^|[\\/])(yt_dlp|curl_cffi)([\\/]|$)'
# A cached extractor .pyc arrives for triage as a wall of site URLs, regex
# fragments and test fixtures with no source alongside it -- exactly the shape
# a URL-soup stager has. The marshalled co_filename is the one part of a .pyc
# that names where the bytecode was compiled from, so it settles the identity
# of any of the ~1800 yt-dlp/youtube-dl extractor modules in one read.
- id: extractor-module-bytecode-path
  desc: Bytecode compiled from a yt-dlp extractor module
  crit: notable
  conf: 0.99
  for: [pyc]
  size_max: 104857600
  if:
    type: value
    path: pyc.source_files
    regex: '[\\/](yt_dlp|youtube_dl)[\\/]extractor[\\/]'
- id: infoextractor-base
  desc: youtube-dl InfoExtractor base class reference
  size_min: 1
  size_max: 1073741824
  if:
    type: text
    substr: InfoExtractor
- id: valid-url-pattern-attr
  desc: youtube-dl extractor _VALID_URL attribute
  size_min: 1
  size_max: 1073741824
  if:
    type: text
    substr: _VALID_URL
- id: real-extract-method
  desc: youtube-dl extractor _real_extract method
  size_min: 1
  size_max: 1073741824
  if:
    type: text
    substr: _real_extract
composite_rules:
- id: youtube-dl-extractor-module
  desc: youtube-dl/yt-dlp site extractor module
  crit: notable
  conf: 0.97
  all:
  - id: infoextractor-base
  - id: valid-url-pattern-attr
  - id: real-extract-method
- id: youtube-dl-package-context
  desc: youtube-dl packaged executable context
  crit: notable
  conf: 0.98
  any:
  - id: packaged-youtube-dl-exe
  - id: packaged-youtube-dl-member
  - id: youtube-dl-extractor-module
  - id: extractor-module-bytecode-path
