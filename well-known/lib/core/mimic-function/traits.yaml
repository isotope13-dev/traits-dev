# sindresorhus/mimic-function — copy a function's name/length/toString.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: mimic-function-package-name
    desc: mimic-function package manifest name
    if:
      type: value
      path: name
      exact: mimic-function
