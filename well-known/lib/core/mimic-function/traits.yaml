# sindresorhus/mimic-function — copy a function's name/length/toString.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: mimic-function-package-name
    desc: mimic-function package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mimic-function

  - id: vendored-path
    desc: vendored mimic-function package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/mimic-function/'
