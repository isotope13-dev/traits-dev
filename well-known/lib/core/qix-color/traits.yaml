# Qix-/color — CSS color conversion library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: color npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'color'

  - id: vendored-path
    desc: vendored color package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/color/'
  - id: unknown-model-error
    desc: Qix color unknown-model error
    if:
      type: text
      substr: 'Unknown model: '

composite_rules:
  - id: library
    desc: color library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: unknown-model-error
