# taoensso/timbre — Clojure/Script logging library (ptaoussanis).
# OppLoans republishes the same sources as opploans/timbre. ns-resolve
# of cljs.analyzer and Logstash TCP appenders are product logging, not
# a dropper. Identity only. Do not match taoensso/trove or GNU Trove.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-group
    desc: opploans Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: opploans

  - id: pom-artifact
    desc: timbre Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: timbre

  - id: defproject
    desc: opploans timbre Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject opploans/timbre'

  - id: github-repo
    desc: ptaoussanis timbre GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/ptaoussanis/timbre

  - id: core-namespace
    desc: taoensso.timbre namespace declaration
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(ns taoensso.timbre'

  - id: core-namespace-path
    desc: taoensso timbre namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)taoensso[\\/]timbre\.clj$'

composite_rules:
  - id: taoensso-timbre-maven
    desc: opploans timbre Maven coordinates
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact

  - id: taoensso-timbre-library
    desc: taoensso timbre Clojure logging library
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: defproject
      - id: github-repo
      - id: core-namespace
      - id: core-namespace-path
      - id: taoensso-timbre-maven
