# jonschlinkert/is-extendable — JavaScript object eligibility helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: is-extendable npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: is-extendable

  - id: vendored-path
    desc: vendored is-extendable package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/is-extendable/'

  - id: object-eligibility-helper
    desc: is-extendable object eligibility helper
    for: [javascript]
    if:
      type: text
      substr: 'module.exports = function isExtendable(val)'

composite_rules:
  - id: library
    desc: jonschlinkert is-extendable helper library
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: object-eligibility-helper
