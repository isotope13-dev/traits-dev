# tagged-tag — tiny tagged-template helper used by vendored tooling.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: tagged-tag-package-name
    desc: tagged-tag package manifest name
    if:
      type: value
      path: name
      exact: tagged-tag
