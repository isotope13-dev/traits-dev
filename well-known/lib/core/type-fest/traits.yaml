# sindresorhus/type-fest — essential TypeScript utility types.
defaults:
  platforms: [windows, unix]
  for: [typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: type-fest-package-name
    desc: type-fest package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: type-fest

  - id: type-fest-source-path
    desc: type-fest source type definition path
    for: [typescript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)type-fest[/\\]source'
