# fabiospampinato/atomically — atomic file read/write helpers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: atomically-package-name
    desc: atomically package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: atomically

  - id: atomically-package-path
    desc: atomically package member path
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])atomically[/\\]dist'
