# @bobfrankston/miscinfo — Bob Frankston's shared infrastructure constants
# (service port map, MQTT broker settings, default FQDN). Static data only; no
# install hooks or runtime network I/O. Identity only — not a verdict.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.96

traits:
  - id: package-name
    desc: Bob Frankston miscinfo package name
    for: [package.json]
    conf: 0.98
    if:
      type: value
      path: name
      exact: '@bobfrankston/miscinfo'

  - id: package-member-context
    desc: Bob Frankston miscinfo package member
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@bobfrankston/miscinfo'

  - id: centralized-port-definitions-marker
    desc: Centralized port definitions module comment
    for: [javascript, typescript]
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'Centralized port definitions for all services'

composite_rules:
  - id: bobfrankston-miscinfo-library
    desc: Bob Frankston shared infrastructure constants
    crit: notable
    conf: 0.97
    any:
      - id: package-name
      - id: package-member-context
    all:
      - id: centralized-port-definitions-marker
