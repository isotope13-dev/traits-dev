defaults:
  platforms: [unix, windows]
  for: [jar, zip, class]
  crit: notable
  conf: 0.99

traits:
  - id: hutool-core-library
    desc: Hutool core utility library member
    if:
      type: path
      regex: '(?i)hutool-core-[0-9][^\\/]{0,32}\.jar'

  - id: hutool-core-class-member
    desc: Hutool core Java class member
    for: [java_class]
    if:
      type: text
      substr: cn/hutool/core/

  # Source-tree identity. The two traits above only recognize a compiled
  # artifact, so a Hutool source release — 2400 files of dual-use utility code
  # (Runtime.exec wrappers, script engines, reflection, crypto, sockets, AWT
  # screen capture) — arrived with no library identity at all to anchor triage.
  - id: hutool-source-package-declaration
    desc: Declares a cn.hutool source package
    for: [java]
    if:
      type: text
      regex: 'package\s+cn\.hutool[\w.]*\s*;'

  - id: hutool-maven-group-id
    desc: Hutool cn.hutool Maven groupId
    for: [xml]
    if:
      type: text
      regex: '<groupId>\s*cn\.hutool\s*</groupId>'
