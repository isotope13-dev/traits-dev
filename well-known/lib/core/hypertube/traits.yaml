# Hypertube is a commercial cross-language SDK. Its wheel intentionally ships
# native Node/PHP/Python/Ruby/JVM runtimes and a configurable remote transport.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, pkginfo, python, javascript, typescript, php, ruby, elf, macho, pe, dll, archives, zip, scripts]
  crit: notable
  conf: 0.99
  size_max: 200000000

traits:
  - id: wheel-distribution
    desc: Hypertube Python SDK wheel distribution
    for: [whl]
    size_min: 1000000
    size_max: 500000000
    if:
      type: value
      path: whl.distribution
      exact: hypertube_python_sdk
  - id: package-module-tree
    desc: Hypertube Python package module tree
    for: [python, javascript, typescript, php, ruby, pe, dll, elf, macho]
    size_max: 200000000
    if:
      type: path
      regex: '(?i)(^|[\\/])hypertube([\\/]|$)'
  - id: vendor-project-marker
    desc: Hypertube or Graftcode project marker
    for: [pkginfo, python, markdown, text, javascript, typescript, php, ruby, pe, dll]
    size_max: 5000000
    if:
      type: text
      regex: '(?i)hypertube\.dev|Graftcode S\.A\.|graftcode\.com|\bHypertube\.(Netcore|Clr|Jvm)\b'
  - id: netcore-assembly-basename
    desc: Hypertube Netcore assembly basename
    for: [pe, dll]
    size_min: 1024
    size_max: 50000000
    if:
      type: basename
      regex: '(?i)^Hypertube\.Netcore\.'

composite_rules:
  - id: hypertube-sdk-context
    desc: Hypertube cross-language Python SDK context
    crit: notable
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: wheel-distribution
    any:
      - id: package-module-tree
      - id: vendor-project-marker
  - id: hypertube-runtime-member
    desc: Hypertube SDK bundled runtime member
    crit: notable
    conf: 0.98
    for: [python, javascript, typescript, php, ruby, pe, dll, elf, macho]
    all:
      - id: package-module-tree
    any:
      - id: vendor-project-marker
      - id: netcore-assembly-basename
      - id: well-known/lib/runtime/php-runtime::runtime-shared-library
      - id: well-known/lib/runtime/node-runtime::node-shared-library
  - id: hypertube-benign-runtime-context
    desc: Hypertube SDK known-good runtime context
    crit: exception
    conf: 0.99
    for: [python, javascript, typescript, php, ruby, pe, dll, elf, macho, whl]
    any:
      - id: hypertube-sdk-context
      - id: hypertube-runtime-member
      - id: package-module-tree
