# @sindresorhus/merge-streams — merge Node streams.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: '@sindresorhus/merge-streams package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@sindresorhus/merge-streams'

  - id: vendored-path
    desc: vendored merge-streams package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@sindresorhus/merge-streams/'

composite_rules:
  - id: library
    desc: '@sindresorhus/merge-streams library'
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
