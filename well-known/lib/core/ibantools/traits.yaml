# ibantools is a legitimate IBAN/BBAN/BIC validation and formatting library.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ibantools npm package name
    if:
      type: value
      path: name
      exact: ibantools

  - id: upstream-repository
    desc: ibantools upstream repository reference
    for: [package.json, javascript, typescript]
    if:
      type: text
      regex: 'github\.com/Simplify/ibantools(\.git)?([/\\s"''`?#]|$)'

composite_rules:
  - id: library
    desc: ibantools financial-format validation library
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: upstream-repository
