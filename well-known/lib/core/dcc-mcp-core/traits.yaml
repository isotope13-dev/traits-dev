defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: DCC MCP Core package metadata identity
    if:
      type: value
      path: name
      exact: dcc-mcp-core

  - id: wheel-distribution-name
    desc: DCC MCP Core wheel distribution identity
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: dcc_mcp_core

  - id: repository
    desc: DCC MCP Core upstream repository marker
    if:
      type: text
      substr: github.com/dcc-mcp/dcc-mcp-core

  - id: readme-heading
    desc: DCC MCP Core README heading
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# dcc-mcp-core\s*$'

  - id: native-core-module-path
    desc: DCC MCP Core Rust extension module path
    crit: notable
    for: [elf, so]
    size_min: 10000000
    size_max: 100000000
    if:
      type: path
      regex: '(^|[\\/])dcc_mcp_core[\\/]_core\.cpython'

  - id: native-core-basename
    desc: DCC MCP Core Rust extension basename
    crit: notable
    for: [elf, so]
    size_min: 10000000
    size_max: 100000000
    if:
      type: basename
      regex: '^_core\.cpython.*\.so$'

  - id: official-vx-installer-url
    desc: DCC MCP official vx installer URL
    crit: notable
    conf: 1.0
    for: [markdown, python]
    if:
      type: text
      substr: raw.githubusercontent.com/loonghao/vx/main/install.sh
