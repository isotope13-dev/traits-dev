# full.http — FullContact async HTTP client/server on http-kit and
# core.async. Cookie wrap, JSON API middleware, and error-response
# handling are product HTTP, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: full.http Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: full.http

  - id: github-repo
    desc: fullcontact full.http GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/fullcontact/full.http

  - id: defproject
    desc: fullcontact full.http Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject fullcontact/full.http'

  - id: client-namespace
    desc: full.http.client namespace declaration
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(ns full.http.client'

  - id: client-namespace-path
    desc: full.http client namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)full[\\/]http[\\/]client\.clj$'

composite_rules:
  - id: full-http-maven-library
    desc: FullContact full.http Clojure library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: well-known/lib/core/fullcontact-full-core::pom-group
      - id: pom-artifact
