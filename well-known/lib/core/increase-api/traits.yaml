# Increase — official Ruby client for the Increase banking API.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: increase-module-marker
    desc: Increase API Ruby client module marker
    if:
      type: text
      substr: module Increase

  - id: increase-gem-name
    desc: increase Ruby gem package name
    if:
      type: text
      regex: '(?i)name:\s*increase\b'
