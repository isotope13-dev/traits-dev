# unjs/defu — recursive defaults merger.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: unjs defu package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: defu

  - id: vendored-path
    desc: vendored defu package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/defu/'

  - id: createdefu-factory
    desc: defu createDefu factory function
    if:
      type: text
      substr: 'function createDefu'

  - id: defu-instance-type
    desc: defu DefuInstance TypeScript interface
    for: [typescript]
    if:
      type: text
      substr: 'interface DefuInstance'

composite_rules:
  - id: library
    desc: unjs defu recursive defaults merger
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: createdefu-factory
      - id: defu-instance-type
