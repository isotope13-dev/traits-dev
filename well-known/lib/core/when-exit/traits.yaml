# when-exit — reliable process-exit hooks (dependency of atomically/conf).
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: when-exit-package-name
    desc: when-exit package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: when-exit

  - id: when-exit-package-path
    desc: when-exit package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])when-exit([/\\]|$)'
