# streamich/thingies — tiny JS utilities.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: thingies npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'thingies'

  - id: vendored-path
    desc: vendored thingies package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/thingies/'

composite_rules:
  - id: library
    desc: thingies library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
