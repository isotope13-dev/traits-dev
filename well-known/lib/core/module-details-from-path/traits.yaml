# watson/module-details-from-path — resolve npm package name from a file path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: module-details-from-path package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: module-details-from-path

  - id: vendored-path
    desc: module-details-from-path package path
    if:
      type: path
      regex: '(^|[\\/])module-details-from-path([\\/]|$)'
