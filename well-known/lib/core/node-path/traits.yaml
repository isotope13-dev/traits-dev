defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Node path npm package name
    if:
      type: value
      path: name
      regex: '^(path|path-browserify)$'

  # NOTE: there was a `package-main` trait here matching `"main": "index.js"`.
  # That is the `npm init` default, so it fired notable on most of npm while
  # claiming to identify the `path` package. It also broke the suppressor below:
  # the real `path` package ships `main: "./path.js"`, so requiring index.js meant
  # `package-identity` could never match it. The exact-name check is the identity.

  - id: node-path-module-exports
    desc: Node path module exports
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: module\.exports\.posix\s*=\s*posix[\s\S]{0,80}module\.exports\.win32\s*=\s*win32
  - id: node-normalize-array-function
    desc: Node path normalizeArray function
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: function\s+normalizeArray\s*\(
  - id: node-win32-split-path-function
    desc: Node path win32SplitPath function
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: function\s+win32SplitPath\s*\(
composite_rules:
  # The `package-identity` exception that used to sit here was `package-name`
  # AND `package-main`; with the bogus `package-main` leg gone it degenerated to
  # a single-item composite, so referencers now use `package-name` directly.
  - id: node-path-module-implementation
    desc: Node path module implementation
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: node-path-module-exports
      - id: node-path-core-functions
    any:
      - id: metadata/package/testing/harness/runtime::joyent-copyright
  - id: node-path-core-functions
    desc: Node path core functions appear nearby
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: node-normalize-array-function
      - id: node-win32-split-path-function
    near_bytes: 4000
