# @stacksjs/defaults is a published application scaffold. Its source tree
# intentionally imports the framework packages supplied by a consuming Stacks
# project, while its npm manifest declares only the assets needed by the
# scaffold package itself.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, archives]
  crit: notable
  conf: 0.99

traits:
  - id: defaults-package-name
    desc: Stacks defaults package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stacksjs/defaults'

  - id: defaults-upstream-homepage
    desc: Stacks defaults upstream homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      regex: 'github\.com/stacksjs/stacks(/|$)'

  - id: defaults-scaffold-description
    desc: Stacks managed scaffold description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)managed\s+Stacks\s+application\s+scaffold'

composite_rules:
  - id: scaffold-package-context
    desc: Recognized Stacks defaults scaffold package
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: defaults-package-name
      - id: defaults-upstream-homepage
      - id: defaults-scaffold-description
