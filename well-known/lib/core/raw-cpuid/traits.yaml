# crates.io/crates/raw-cpuid — benign Rust CPU-feature detection library.
# Its symbol names and hypervisor vendor checks trip VM-detection heuristics;
# used as unless/downgrade exclusions there.
defaults:
  platforms: [unix, windows]
  for: [rust, binaries]
  size_min: 1
  size_max: 1073741824

traits:
  - id: rust-raw-cpuid-lib
    desc: raw-cpuid Rust CPUID library markers
    crit: baseline
    conf: 0.99
    if:
      type: text
      substr: raw_cpuid

  - id: rust-raw-cpuid-crate
    desc: raw-cpuid crate registry reference
    crit: baseline
    conf: 0.99
    if:
      type: text
      substr: crates.io/crates/raw-cpuid

composite_rules:
  - id: rust-raw-cpuid-library
    desc: raw-cpuid Rust CPU-feature detection library
    crit: notable
    conf: 0.99
    any:
      - id: rust-raw-cpuid-lib
      - id: rust-raw-cpuid-crate
