# Apache Thrift's Delphi transport queries normal HTTP response headers while
# implementing a client protocol; that is not a command channel.
defaults:
  platforms: [unix, windows]
  for: [zip, archives, source, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: apache-thrift-source-path
    desc: Apache Thrift source member path
    if:
      type: path
      regex: 'apache[\\/]thrift@'

  - id: apache-thrift-git-path
    desc: Apache Thrift git-at source member path
    if:
      type: path
      regex: 'thrift\\.git@'

  - id: apache-thrift-delphi-path
    desc: Apache Thrift Delphi source member path
    for: [zip]
    if:
      type: basename
      exact: Thrift.WinHTTP.pas

composite_rules:
  - id: apache-thrift-source-context
    desc: Recognized Apache Thrift source package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: apache-thrift-source-path
      - id: apache-thrift-git-path
      - id: apache-thrift-delphi-path
