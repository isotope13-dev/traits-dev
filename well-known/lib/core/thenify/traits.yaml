# thenables/thenify — callback-to-Promise adapter.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: thenify npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: thenify

  - id: vendored-path
    desc: vendored thenify package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/thenify/'

  - id: callback-wrapper
    desc: thenify callback Promise wrapper
    for: [javascript]
    if:
      type: text
      substr: 'thenify.withCallback = function (fn, options)'

composite_rules:
  - id: library
    desc: thenify callback Promise adapter library
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: callback-wrapper
