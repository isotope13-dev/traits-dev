# Holepunch b4a bridges Node.js Buffer operations and typed arrays.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  size_min: 64
  size_max: 500000
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: b4a npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: b4a

  - id: vendored-path
    desc: Vendored b4a package path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'node_modules[\\/]b4a[\\/]'

composite_rules:
  - id: library
    desc: Holepunch b4a buffer compatibility library
    any:
      - id: package-name
      - id: vendored-path
