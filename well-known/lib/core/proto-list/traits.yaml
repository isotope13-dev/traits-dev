# isaacs/proto-list — prototype-chain list for config objects.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: proto-list npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: proto-list

  - id: vendored-path
    desc: vendored proto-list package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/proto-list/'

  - id: proto-list-ctor
    desc: proto-list ProtoList constructor
    if:
      type: text
      substr: 'function ProtoList ()'

composite_rules:
  - id: library
    desc: isaacs proto-list prototype chain list
    needs: 2
    any:
      - id: package-name
      - id: vendored-path
      - id: proto-list-ctor
