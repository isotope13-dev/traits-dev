# sindresorhus/slash — convert backslashes to slashes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: slash npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'slash'

  - id: vendored-path
    desc: vendored slash package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/slash/'
  - id: extended-length-path
    desc: Win32 extended-length path test
    if:
      type: text
      substr: 'isExtendedLengthPath'

composite_rules:
  - id: library
    desc: slash library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: extended-length-path
