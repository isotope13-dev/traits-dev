# Zod is a JavaScript/TypeScript schema-validation library.  Bundlers often
# leave its pnpm source comments and exported schema constructors in the
# output; those are library identity markers, not dynamic-code behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.99

traits:
  - id: pnpm-zod-source-marker
    desc: pnpm-bundled Zod source path marker
    for: [javascript]
    if:
      type: text
      regex: '\.pnpm[\\/]zod@[0-9][A-Za-z0-9._-]{0,32}[\\/]'

  - id: zod-v4-source-marker
    desc: Zod v4 source path marker
    for: [javascript]
    if:
      type: text
      regex: '[\\/]zod[\\/]v4[\\/]'

  - id: schema-object-runtime-marker
    desc: Zod object-schema runtime constructor marker
    for: [javascript]
    count_min: 2
    if:
      type: text
      regex: '\b\$?ZodObject\b'

  - id: schema-object-type-reference
    desc: Repeated Zod object-schema type references
    for: [typescript]
    count_min: 4
    crit: notable
    if:
      type: text
      regex: '\bz\.ZodObject\b'

composite_rules:
  - id: bundled-v4-runtime
    desc: Bundled Zod v4 schema-validation runtime
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: pnpm-zod-source-marker
      - id: zod-v4-source-marker
      - id: schema-object-runtime-marker
