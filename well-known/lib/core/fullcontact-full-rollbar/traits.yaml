# full.rollbar — FullContact Clojure client for the Rollbar error
# service. HTTP POST to api.rollbar.com is product telemetry, not C2.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: full.rollbar Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: full.rollbar

  - id: github-repo
    desc: fullcontact full.rollbar GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/fullcontact/full.rollbar

  - id: defproject
    desc: fullcontact full.rollbar Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject fullcontact/full.rollbar'

  - id: core-namespace-path
    desc: full.rollbar core namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)full[\\/]rollbar[\\/]core\.clj$'

composite_rules:
  - id: full-rollbar-maven-library
    desc: FullContact full.rollbar Clojure library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: well-known/lib/core/fullcontact-full-core::pom-group
      - id: pom-artifact
