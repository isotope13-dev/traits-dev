# sindresorhus/detect-indent — detect indentation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: detect-indent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'detect-indent'

  - id: vendored-path
    desc: vendored detect-indent package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/detect-indent/'
  - id: indent-re
    desc: detect-indent leading whitespace regex
    if:
      type: text
      substr: 'var INDENT_RE'

composite_rules:
  - id: library
    desc: detect-indent library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: indent-re
