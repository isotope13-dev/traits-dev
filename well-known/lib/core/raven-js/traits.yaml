# getsentry/raven-js — legacy Sentry browser SDK (now @sentry/browser).
# The "loader" npm script pipes source through Closure Compiler, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: raven-js npm package name
    if:
      type: value
      path: name
      exact: raven-js

  - id: repository-url
    desc: raven-js upstream repository
    if:
      type: value
      path: repository
      substr: github.com/getsentry/raven-js

  - id: loader-pipe-script
    desc: raven-js Closure Compiler loader pipe
    if:
      type: value
      path: scripts.loader
      regex: 'src/loader\.js[^\n|]{0,80}\|'
