# sindresorhus/p-limit — promise concurrency limiter.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: p-limit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'p-limit'

  - id: vendored-path
    desc: vendored p-limit package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/p-limit/'
  - id: plimit-export
    desc: pLimit concurrency limiter export
    if:
      type: text
      substr: 'export default function pLimit'

composite_rules:
  - id: library
    desc: p-limit library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: plimit-export
