# yt-dlp is a browser-facing media downloader. Cookie import, extractor URL
# parsing, and browser automation cleanup are part of its normal operation.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: yt-dlp-wheel-path
    desc: yt-dlp wheel or extracted member path
    if:
      type: path
      regex: '(^|[\\/])yt_dlp-[0-9][^\\/]*\\.whl'

  - id: yt-dlp-member-path
    desc: yt-dlp Python package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])yt_dlp[\\/]'

  # Third-party callers commonly reuse yt-dlp's mature, actively-maintained
  # browser cookie decryption instead of reimplementing it -- this is the
  # documented, intended way to consume yt_dlp.cookies as a library, not a
  # sign of the caller being yt-dlp itself.
  - id: imports-cookie-extraction-api
    desc: Imports yt-dlp's browser cookie extraction API
    for: [python]
    if:
      type: import
      regex: '^yt_dlp(\.cookies)?$'

composite_rules:
  - id: yt-dlp-package-context
    desc: Recognized yt-dlp package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: yt-dlp-wheel-path
      - id: yt-dlp-member-path
