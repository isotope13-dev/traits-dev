# gallery-dl is a browser-facing gallery and media downloader, the direct
# sibling of yt-dlp. Its `--cookies-from-browser` option reads the cookie
# stores of every supported browser so it can fetch galleries the user is
# already logged in to — the same multi-browser profile targeting a stealer
# performs, for the opposite reason. The cookies drive its own HTTP session
# and are never sent anywhere.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-path
    desc: gallery-dl wheel or extracted member path
    if:
      type: path
      regex: '(^|[\\/])gallery_dl-[0-9][^\\/]*\.whl'

  - id: member-path
    desc: gallery-dl Python package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])gallery_dl[\\/]'

composite_rules:
  - id: package-context
    desc: Recognized gallery-dl package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: wheel-path
      - id: member-path
