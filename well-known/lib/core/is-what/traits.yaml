# mesqueeb/is-what — JS/TS payload type checks.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: is-what npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: is-what

  - id: github-repository
    desc: is-what GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/mesqueeb/is-what

  - id: vendored-path
    desc: vendored is-what package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/is-what/'

  - id: type-not-class-error
    desc: is-what Type is not a class error
    if:
      type: text
      substr: 'Type is not a class'

composite_rules:
  - id: is-what-library
    desc: mesqueeb is-what type-check helpers
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: github-repository
      - id: type-not-class-error
