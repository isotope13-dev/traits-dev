# Flask-CORS — Cory Dolphin Flask extension for CORS headers.
# Access-Control-* setup and localhost origin examples are the
# product API, not a C2 beacon.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: flask-cors PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: flask-cors

  - id: wheel-distribution
    desc: flask_cors wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: flask_cors

  - id: github-repo
    desc: corydolphin/flask-cors GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/corydolphin/flask-cors
