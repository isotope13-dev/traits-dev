# Whop — official Ruby SDK for the Whop REST API.
defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.99

traits:
- id: gem-name
  desc: whop_sdk Ruby gem name
  for: [gem]
  if:
    type: value
    path: gem.name
    exact: whop_sdk

- id: api-base-url
  desc: Whop REST API base URL
  for: [ruby]
  if:
    type: text
    substr: https://api.whop.com/api/v1

- id: github-repository
  desc: Whop Ruby SDK source repository URL
  for: [ruby, markdown]
  if:
    type: text
    substr: github.com/whopio/whopsdk-ruby

composite_rules:
- id: whop-ruby-sdk
  desc: Recognized Whop Ruby REST API SDK
  crit: notable
  conf: 0.99
  for: [gem]
  scope: archive
  all:
  - id: gem-name
  - id: api-base-url
