# parkpana/drawrowfly TikTok scraper — JSDOM runs ByteDance acrawler
# signing code so unsigned feed requests are accepted. Packed eval in
# Signature.js is that vendor signer, not a remote-code dropper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 50000000

traits:
  - id: package-name
    desc: parkpana tiktok-scraper package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: parkpana-tiktok-scraper

  - id: github-repository
    desc: parkpana tiktok-scraper GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/parkpana/tiktok-scraper

  - id: byted-acrawler-sign
    desc: ByteDance acrawler sign call
    for: [javascript, typescript]
    if:
      type: text
      substr: window.byted_acrawler.sign

  - id: jsdom-tiktok-origin
    desc: JSDOM TikTok origin URL
    for: [javascript, typescript]
    if:
      type: text
      substr: "url: 'https://www.tiktok.com/'"

  - id: tiktok-scraper-class
    desc: TikTokScraper class name identifier
    for: [javascript, typescript]
    if:
      type: text
      substr: class TikTokScraper

  - id: tiktok-scraper-started
    desc: TikTok scraper started spinner text
    for: [javascript, typescript]
    if:
      type: text
      substr: 'TikTok Scraper Started'

composite_rules:
  - id: tiktok-acrawler-signer
    desc: TikTok JSDOM acrawler URL signer
    all:
      - id: byted-acrawler-sign
      - id: jsdom-tiktok-origin
      - id: micro-behaviors/process/interpreter/vm::jsdom-run-scripts

  - id: parkpana-tiktok-scraper-identity
    desc: Recognized parkpana TikTok scraper
    needs: 2
    any:
      - id: package-name
      - id: github-repository
      - id: byted-acrawler-sign
      - id: tiktok-scraper-class
      - id: tiktok-scraper-started
      - id: tiktok-acrawler-signer
