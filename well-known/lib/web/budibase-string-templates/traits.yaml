# @budibase/string-templates — Handlebars wrapper for Budibase templating.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Budibase string templates package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@budibase/string-templates'

  - id: raw-json-binding-prefix
    desc: Budibase raw JSON binding constant
    for: [javascript]
    if:
      type: text
      substr: "__budibaseRawJsonBinding"

  - id: js-binding-methods
    desc: Budibase JS binding encode and decode helpers
    for: [javascript]
    if:
      type: text
      substr: "decodeJSBinding"

composite_rules:
  - id: budibase-string-templates
    desc: Budibase string templates library
    any:
      - id: package-name
      - id: raw-json-binding-prefix
      - id: js-binding-methods
