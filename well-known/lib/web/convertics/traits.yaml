# Convertics visitor analytics script (@convertics-ai/script).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: npm-package-name
    desc: Convertics analytics npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@convertics-ai/script"

  - id: harbor-events-api-host
    desc: Convertics Harbor events API host
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: harbor.convertics.ai/events/

  - id: visitor-id-cookie-name
    desc: Convertics visitor id cookie name
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: _convertics_visitor_id

composite_rules:
  - id: convertics-script-package
    desc: Convertics visitor analytics npm or CDN bundle
    crit: notable
    conf: 0.99
    any:
      - id: npm-package-name
      - id: harbor-events-api-host
      - id: visitor-id-cookie-name
