# @stackframe/stack — Stack Auth SDK (hexclave/stack-auth).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: stackframe-npm-package-name
    desc: Stack Auth npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@stackframe/stack'

  - id: stackframe-package-json-name
    desc: Stack Auth package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stackframe/stack'

  - id: stripe-payment-method-expiry-fields
    desc: Stripe payment method expiry fields
    for: [javascript, typescript]
    if:
      type: text
      substr: pm.exp_month

composite_rules:
  - id: stack-auth-package-context
    desc: Stack Auth published SDK package context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: stackframe-npm-package-name
      - id: stackframe-package-json-name
