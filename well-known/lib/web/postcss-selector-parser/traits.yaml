# postcss-selector-parser — CSS selector AST.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: postcss-selector-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: postcss-selector-parser

  - id: vendored-path
    desc: vendored postcss-selector-parser package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/postcss-selector-parser/'


composite_rules:
  - id: postcss-selector-parser-library
    desc: postcss-selector-parser library
    any:
      - id: package-name
      - id: vendored-path
