# Vona (formerly Cabloy) publishes suite packages whose tarball is only a
# manifest: `files: []` plus runtime dependencies on the real modules.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: vona-suite-package-name
    desc: Vona suite or module package
    if:
      type: value
      path: name
      regex: '^vona-(suite|module)-[a-z0-9][a-z0-9.-]{0,60}$'
  - id: vona-module-runtime-dependency
    desc: Runtime dependency on a Vona module package
    if:
      type: value
      path: dependencies
      regex: '"vona-module-[a-z0-9][a-z0-9.-]{0,60}"\s*:'

composite_rules:
  # A genuine Vona suite metapackage: the suite name plus runtime
  # dependencies on the framework's own module packages. The name alone
  # only downgrades the hollow-wrapper rule (a squatted name costs
  # nothing); a suite that actually installs the Vona modules is the
  # documented distribution mechanism, not a placeholder.
  - id: vona-suite-metapackage-context
    desc: Vona suite metapackage installs Vona modules
    crit: exception
    conf: 0.97
    all:
      - id: vona-suite-package-name
      - id: vona-module-runtime-dependency
