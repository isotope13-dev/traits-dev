# Vona (formerly Cabloy) publishes suite packages whose tarball is only a
# manifest: `files: []` plus runtime dependencies on the real modules.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: vona-suite-package-name
    desc: Vona suite or module package
    if:
      type: value
      path: name
      regex: '^vona-(suite|module)-[a-z0-9][a-z0-9.-]{0,60}$'
