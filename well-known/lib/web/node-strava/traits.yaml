# node-strava-v3 — Strava API v3 client (node-strava/node-strava-v3).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: strava-v3-package-name
    desc: strava-v3 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: strava-v3

  - id: strava-v3-npm-archive-name
    desc: strava-v3 npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: strava-v3

  - id: node-strava-v3-repository
    desc: node-strava-v3 upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/node-strava/node-strava-v3'

  - id: node-strava-v3-repository-npm
    desc: node-strava-v3 npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/node-strava/node-strava-v3'

composite_rules:
  - id: node-strava-v3-upstream
    desc: node-strava-v3 upstream repository claim
    crit: notable
    any:
      - id: node-strava-v3-repository
      - id: node-strava-v3-repository-npm

  - id: node-strava-v3-package-identity
    desc: node-strava Strava API v3 client package
    crit: notable
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: node-strava-v3-upstream
    any:
      - id: strava-v3-package-name
      - id: strava-v3-npm-archive-name
