# Dart Sass — the reference Sass/SCSS compiler, published by the Sass team and
# distributed on npm as `sass` (pure JS) and `sass-embedded` (an AOT-compiled
# Dart binary plus a per-platform `sass-embedded-<os>-<arch>` sidecar that
# carries the `dart` runtime and a `sass.snapshot`).
#
# The sidecar packages are the reason this identity is worth having: they are
# multi-megabyte Dart AOT snapshots, so the Dart runtime's own machinery --
# isolate runners, Process_Start, the bundled BoringSSL crypto -- shows up in
# a scan with no Sass code responsible for it. Naming the compiler lets triage
# attribute those runtime behaviors to a known publisher instead of re-deriving
# it from the snapshot each time.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: sass-library-source-path
    desc: Dart Sass compiler library source path
    for: [binaries]
    # A Dart AOT snapshot carrying the whole Sass evaluator; the smallest
    # shipped `sass.snapshot` is several megabytes.
    size_min: 1048576
    if:
      type: text
      substr: "package:sass/src/visitor/async_evaluate.dart"

  - id: embedded-platform-package-name
    desc: sass-embedded platform sidecar package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^sass-embedded-[a-z0-9]+-[a-z0-9]+$'
