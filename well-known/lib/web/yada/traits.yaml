# JUXT yada — Clojure HTTP resource library (this Clojars fork is
# employeerepublic/yada-core). MD5 ETag hashing and class reflection
# are HTTP helpers, not a loader. edn/read-string parses request bodies.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text, xml, markdown]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: yada-core Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: yada-core

  - id: github-repo
    desc: juxt yada GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/juxt/yada

  - id: namespace-path
    desc: yada Clojure namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[\\/])yada/[a-z_]+\.clj$'
