# Telerik RadAsyncUpload's handler route and multipart/state field names are
# stable protocol structure. These identify the library surface without
# treating ordinary application use as exploitation.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: rau-handler-endpoint
    desc: Telerik RadAsyncUpload handler endpoint
    if:
      type: literal
      kind: string
      regex: 'Telerik\.Web\.UI\.WebResource\.axd\?type=rau($|[&#])'

  - id: rau-post-data-field
    desc: Telerik RadAsyncUpload configuration field
    if:
      type: literal
      kind: string
      exact: rauPostData

  - id: rau-file-part-field
    desc: Telerik RadAsyncUpload file field
    if:
      type: literal
      kind: string
      regex: '(^|name=["''])rauFiles(["''];|$)'

  - id: rau-async-type-field
    desc: Telerik asynchronous upload type field
    if:
      type: literal
      kind: string
      substr: AsyncUploadTypeName

  - id: rau-temp-filename-field
    desc: Telerik temporary upload filename field
    if:
      type: literal
      kind: string
      substr: TempFileName

  - id: rau-extension-allowlist-field
    desc: Telerik upload extension allowlist field
    if:
      type: literal
      kind: string
      substr: AllowedFileExtensions

composite_rules:
  - id: rau-upload-client
    desc: Telerik RadAsyncUpload client protocol
    all:
      - id: rau-handler-endpoint
      - id: rau-post-data-field
      - id: rau-file-part-field
    near_bytes: 2048

  - id: rau-type-metadata-schema
    desc: Telerik typed upload metadata schema
    all:
      - id: rau-async-type-field
      - id: rau-temp-filename-field
    near_bytes: 1024
