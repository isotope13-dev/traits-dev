# @mongez/* — hassanzohdy npm utilities (scoped publisher; not motdotla/dotenv).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: mongez-scoped-package-name
    desc: Mongez scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@mongez/'

  - id: mongez-scoped-npm-archive-name
    desc: Mongez scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@mongez/'

  - id: mongez-hassanzohdy-repository
    desc: hassanzohdy mongez-* upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/hassanzohdy/mongez-'

  - id: mongez-hassanzohdy-repository-npm
    desc: Mongez npm archive hassanzohdy mongez repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/hassanzohdy/mongez-'

composite_rules:
  - id: mongez-hassanzohdy-upstream
    desc: hassanzohdy mongez upstream repository
    crit: notable
    conf: 0.99
    any:
      - id: mongez-hassanzohdy-repository
      - id: mongez-hassanzohdy-repository-npm

  - id: mongez-npm-package-context
    desc: hassanzohdy @mongez scoped npm package context
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: mongez-hassanzohdy-upstream
    any:
      - id: mongez-scoped-package-name
      - id: mongez-scoped-npm-archive-name
