---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
composite_rules:
- crit: notable
  conf: 0.9
  id: wordpress-source-context
  desc: WordPress core, plugin, or test context
  any:
  - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
  - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
  - id: metadata/lang/source/naming/interface/runtime::wordpress-lowercase-api-symbol
  - id: metadata/lang/source/naming/interface/runtime::wordpress-uppercase-api-symbol
  - id: well-known/lib/web/server/wordpress-core::wordpress-plugin-filesystem-context
