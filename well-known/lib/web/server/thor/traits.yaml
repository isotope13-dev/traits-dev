# Thor -- the Ruby CLI/generator framework behind `rails generate`, `bundle
# gem`, and most `bin/*` gem executables. It is very widely vendored (bundler
# ships it as `Bundler::Thor`), and its Actions mixin legitimately fetches a
# remote template over open-uri and writes it to disk, which is the same shape
# as a Ruby dropper. These traits give that shape an identity so the dropper
# and CI/CD-exfil composites can except it by name instead of by a bare
# `input.binmode.read` substring.
defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: class-declaration
    desc: Thor CLI framework class declaration
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*class\s+([A-Z]\w*::)?Thor\b'

  - id: namespace-reference
    desc: References a Thor framework namespace
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bThor::(Actions|Base|Group|Shell)\b'

  # Thor::Actions#find_in_source_paths resolves a template against the
  # generator's source_paths. No other library defines it, and every
  # Thor action that reads a template calls it.
  - id: source-path-resolver
    desc: Thor Actions source-path template resolver
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: find_in_source_paths

composite_rules:
  # Referenced from `unless:` by the Ruby dropper and gem CI/CD exfil rules:
  # a file that declares the Thor class AND resolves templates through Thor's
  # source-path API is the framework itself, not a payload fetcher.
  - id: actions-file-generator
    desc: Thor CLI file-generator action library
    crit: exception
    conf: 0.97
    all:
      - id: class-declaration
      - id: source-path-resolver
