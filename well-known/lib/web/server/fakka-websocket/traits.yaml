# FAkka.WebSocket (Akka.NET to Suave WebSocket bridge). Its KillActor takes a
# "kill" string-array message naming a target file and an optional Base64
# PowerShell script, starts a monitor that waits for the file to change, runs
# that script, and exits the host: a rebuild/restart hook. Anyone able to
# reach the bridge can supply that script, so the runner stays suspicious.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 20000
  size_max: 5000000

# Managed images keep metadata names and the user-string heap in .text.
traits:
  - id: killactor-actor-name
    desc: FAkka.WebSocket KillActor actor name
    if:
      type: text
      exact: KillActor
      section: .text

  - id: killactor-command-payload-log
    desc: KillActor string-array command log text
    if:
      type: text
      exact: 'KillActor received string[] payload for command: {0}'
      section: .text

  - id: killactor-payload-log
    desc: KillActor payload log text
    if:
      type: text
      exact: 'KillActor received payload: {0}'
      section: .text

composite_rules:
  - id: killactor-restart-script-runner
    desc: KillActor runs supplied PowerShell on restart
    crit: suspicious
    attack: T1059.001
    all:
      - id: killactor-actor-name
      - id: killactor-command-payload-log
      - id: metadata/lang/source/syntax/command/invocation::pe-powershell-encodedcommand-launch-text
      - id: micro-behaviors/data/decode/base64::pe-powershell-frombase64string
      - id: micro-behaviors/metaprogramming/generation::pe-scriptblock-create-reference
