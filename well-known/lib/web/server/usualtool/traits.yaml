defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: usualtool-namespace
    desc: UsualTool library namespace
    if:
      type: text
      substr: 'namespace usualtool\Lib;'

  - id: usualtool-composer-package
    desc: UsualTool library composer package
    for: [composer.json]
    if:
      type: text
      substr: 'usualtool/ut-lib'

composite_rules:
  - id: usualtool-library
    desc: UsualTool Framework library
    crit: notable
    conf: 0.98
    for: [php, composer.json]
    any:
      - id: usualtool-namespace
      - id: usualtool-composer-package
