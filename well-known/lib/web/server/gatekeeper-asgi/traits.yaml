# gatekeeper-asgi — ASGI security middleware (WAF) for FastAPI/Starlette.
# Detects SQLi, XSS, path traversal, sensitive files, NoSQL injection, and SSRF.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: gatekeeper-package-name
    desc: Package metadata declares gatekeeper-asgi
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*gatekeeper[-_]asgi\s*$'

  - id: gatekeeper-middleware-class
    desc: Gatekeeper ASGI security middleware class
    for: [python]
    if:
      type: text
      regex: '\bclass\s+GatekeeperMiddleware\b'

  - id: gatekeeper-rules-marker
    desc: Gatekeeper WAF rule set definition
    for: [python]
    if:
      type: text
      regex: '\b(DEFAULT_SQLI_RULES|DEFAULT_XSS_RULES|DEFAULT_PATH_TRAVERSAL_RULES)\b'

  - id: gatekeeper-source-path
    desc: Gatekeeper ASGI package or wheel path
    if:
      type: path
      regex: '(?i)gatekeeper[-_]asgi-[0-9]'

composite_rules:
  - id: gatekeeper-waf-package
    desc: Recognized Gatekeeper ASGI security middleware package
    crit: notable
    for: [whl, zip, python, pkginfo]
    scope: archive
    any:
      - id: gatekeeper-package-name
      - id: gatekeeper-middleware-class
      - id: gatekeeper-rules-marker
      - id: gatekeeper-source-path
