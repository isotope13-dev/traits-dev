defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  crit: baseline
  conf: 0.98
  size_max: 536870912

traits:
  - id: executable-jar
    desc: Spring Boot executable JAR
    crit: notable
    if:
      type: text
      regex: '(BOOT-INF/lib/|org/springframework/boot/loader/)'

  - id: spring-boot-this-class
    desc: Spring Boot class this_class package
    crit: notable
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^org/springframework/boot/'
