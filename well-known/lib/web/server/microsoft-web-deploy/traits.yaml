# Microsoft Web Deploy's deployment assembly. It defines the IIS anonymous
# identity properties it synchronizes; those names are the library's API,
# not a harvest of the password.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: deployment-manager-type
    desc: Microsoft Web Deploy manager type
    # The assembly is about 1.5MB. Keep scripts that merely quote the type
    # name outside this range so they still count as a password read.
    size_min: 524288
    size_max: 4194304
    if:
      type: text
      substr: Microsoft.Web.Deployment.DeploymentManager
