# nonebot-adapter-matrix — NoneBot2 Client-Server adapter for Matrix.
# OAuth2/PKCE, homeserver HTTP, and a loopback callback server are
# product login, not C2. Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: nonebot_adapter_matrix wheel name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: nonebot_adapter_matrix

  - id: package-metadata-name
    desc: nonebot-adapter-matrix PyPI Name
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*nonebot-adapter-matrix\s*$'

  - id: github-repo
    desc: nonebot adapter-matrix GitHub repository
    for: [pkginfo, markdown, python]
    if:
      type: text
      substr: github.com/nonebot/adapter-matrix

  - id: adapter-package-path
    desc: nonebot Matrix adapter package path
    for: [python, whl]
    if:
      type: path
      regex: 'nonebot[\\/]adapters[\\/]matrix'

  - id: msc2965-auth-metadata
    desc: Matrix MSC2965 auth_metadata endpoint
    for: [python]
    if:
      type: text
      substr: org.matrix.msc2965/auth_metadata

composite_rules:
  - id: nonebot-adapter-matrix-package
    desc: NoneBot2 Matrix adapter package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: github-repo
      - id: adapter-package-path
      - id: msc2965-auth-metadata
    needs: 2
