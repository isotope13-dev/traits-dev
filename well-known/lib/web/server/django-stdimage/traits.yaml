# django-stdimage — Django StdImageField (Pillow-backed image variations).
defaults:
  platforms: [unix, windows]
  for: [python, python-sdist]
  crit: notable
  conf: 0.98

traits:
  - id: django-stdimage-wheel-name
    desc: django-stdimage wheel distribution name
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: django-stdimage

  - id: stdimage-package-module
    desc: stdimage Django app module path
    if:
      type: path
      regex: '(^|[\\/])stdimage[\\/]'

composite_rules:
  - id: django-stdimage-package-context
    desc: django-stdimage Django image field package
    for: [python, python-sdist, whl]
    any:
      - id: django-stdimage-wheel-name
      - id: stdimage-package-module
