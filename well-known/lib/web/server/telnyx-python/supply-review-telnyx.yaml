defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  size_min: 1

traits:
- id: telnyx-4872-package-info-member
  desc: Telnyx 4.87.2 package_info member
  crit: notable
  conf: 0.99
  for:
  - zip
  if:
    type: text
    substr: package_info-telnyx-4.87.2.json
- id: telnyx-source-pyproject-member
  desc: Telnyx source pyproject archive member
  crit: notable
  conf: 0.98
  for:
  - zip
  if:
    type: text
    substr: 'sources/telnyx/pyproject.toml'
- id: telnyx-upload-helper-member
  desc: Telnyx upload helper archive member
  crit: notable
  conf: 0.98
  for:
  - zip
  if:
    type: text
    substr: 'sources/telnyx/scripts/utils/upload-artifact.sh'

composite_rules:
- id: telnyx-4872-encrypted-source-archive
  desc: Telnyx 4.87.2 encrypted source archive
  crit: notable
  conf: 0.995
  for:
  - zip
  all:
  - id: well-known/lib/web/server/telnyx-python::telnyx-4872-package-info-member
  - id: well-known/lib/web/server/telnyx-python::telnyx-source-pyproject-member
  - id: well-known/lib/web/server/telnyx-python::telnyx-upload-helper-member
  - id: micro-behaviors/data/archive/zip::zipcrypto-many-encrypted-entries
