# Symfony source identity requires a package notice and corroborating API
# context. Imports alone are dependency facts emitted by the PHP analyzer;
# they do not identify an arbitrary consumer as Symfony library source.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.93

traits:
  - id: symfony-console-command-extends
    desc: Extends Symfony Console Command base class
    crit: notable
    if:
      type: text
      regex: 'extends\s+(\\?Symfony\\Component\\Console\\Command\\)?Command\b'

  - id: symfony-console-attribute
    desc: Uses Symfony AsCommand attribute
    crit: notable
    if:
      type: text
      regex: '#\[AsCommand\b'

  - id: symfony-route-attribute
    desc: Uses Symfony Route attribute
    crit: notable
    if:
      type: text
      regex: '#\[Route\b'

  - id: symfony-kernel-class
    desc: Symfony Kernel class reference
    crit: notable
    if:
      type: text
      regex: '\b(Symfony\\Component\\HttpKernel\\Kernel|extends\s+BaseKernel)\b'

  - id: symfony-container-builder
    desc: Symfony ContainerBuilder reference
    crit: notable
    if:
      type: text
      word: ContainerBuilder

  - id: symfony-config-interface
    desc: Implements Symfony configuration interface
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'implements\s+\\?ConfigurationInterface\b'

  - id: symfony-config-tree-builder
    desc: Builds a Symfony configuration tree
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bnew\s+TreeBuilder\s*\('

composite_rules:
  - id: symfony-context
    desc: Symfony source notice with API context
    crit: notable
    all:
      - id: package-doc
    any:
      - id: metadata/import/php/symfony/component
      - id: metadata/import/php/symfony/bundle
      - id: metadata/import/php/symfony/contracts
      - id: metadata/import/php/symfony/bridge
      - id: symfony-console-command-extends
      - id: symfony-console-attribute
      - id: symfony-route-attribute
      - id: symfony-kernel-class
      - id: symfony-container-builder
