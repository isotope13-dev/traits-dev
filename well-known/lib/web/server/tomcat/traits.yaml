defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: baseline
  conf: 0.98

traits:
  - id: embedded-core-jar
    desc: Apache Tomcat embedded core library
    crit: notable
    for: [jar]
    if:
      type: basename
      regex: '^tomcat-embed-core-[0-9][A-Za-z0-9._-]*\.jar$'

  - id: catalina-this-class
    desc: Tomcat Catalina class this_class package
    crit: notable
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^org/apache/(catalina|tomcat|coyote)/'
