# Strapi packages published under the @strapi/ scope.
# Strapi publishes its headless CMS core, CLI, and plugin packages (@strapi/strapi,
# @strapi/generate-new, @strapi/plugin-users-permissions, ...) from the
# github.com/strapi organization (monorepo strapi/strapi), so the package scope
# matches the repository owner while the repository basename differs — a shape the
# engine's folded-slug comparison reads as a clone-and-rename. The npm scope
# matching the repository owner is the identity consistency the slug check
# cannot express, so pair the two here: a differently named package that merely
# points at a strapi repository (or a @strapi/ package pointing elsewhere)
# still lacks this exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    for: [package.json]
    desc: Strapi scoped package identity
    if:
      type: value
      path: name
      regex: '^@strapi/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Strapi scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@strapi/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    for: [package.json]
    desc: Strapi GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git(\+https?)?://|https?://)github\.com/strapi/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-repository-shorthand
    for: [package.json]
    desc: Strapi GitHub repository shorthand string
    if:
      type: value
      path: repository
      regex: '^strapi/[a-z0-9._-]+$'

  - id: github-repository-url
    for: [package.json]
    desc: Strapi GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git(\+https?)?://|https?://)github\.com/strapi/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Strapi GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git(\+https?)?://|https?://)github\.com/strapi/[a-z0-9._-]+(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Strapi package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Strapi organization repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-shorthand
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Strapi package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
