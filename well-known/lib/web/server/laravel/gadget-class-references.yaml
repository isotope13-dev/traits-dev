traits:
- id: pending-broadcast-class-reference
  desc: References Laravel PendingBroadcast class
  conf: 0.98
  if:
    type: text
    regex: Illuminate[\\\\]+Broadcasting[\\\\]+PendingBroadcast
- id: events-dispatcher-class-reference
  desc: References Laravel Events Dispatcher class
  conf: 0.95
  if:
    type: text
    regex: Illuminate[\\\\]+Events[\\\\]+Dispatcher
defaults:
  for:
  - scripts
  - source
  - data
  - text
  - json
  platforms:
  - windows
  - unix
  crit: notable
