# jsdom/whatwg-encoding — WHATWG Encoding Standard decoder.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: whatwg-encoding npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: whatwg-encoding

  - id: encoding-get-spec-comment
    desc: WHATWG encoding-get concept comment
    for: [javascript, typescript]
    if:
      type: text
      substr: 'encoding.spec.whatwg.org/#concept-encoding-get'

  - id: vendored-path
    desc: vendored whatwg-encoding package path
    if:
      type: path
      regex: 'node_modules/whatwg-encoding'

composite_rules:
  - id: whatwg-encoding-library
    desc: WHATWG Encoding Standard decoder
    any:
      - id: package-name
      - id: encoding-get-spec-comment
      - id: vendored-path
