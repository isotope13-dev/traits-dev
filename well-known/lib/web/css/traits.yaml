# rework/css — CSS parser and stringifier.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: css npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: css

  - id: vendored-path
    desc: vendored css package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/css/'


composite_rules:
  - id: css-library
    desc: rework css parser package
    any:
      - id: package-name
      - id: vendored-path
