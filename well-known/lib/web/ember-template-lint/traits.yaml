# ember-template-lint — official Ember Handlebars template linter.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ember-template-lint npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ember-template-lint

  - id: github-repo
    desc: ember-template-lint upstream repository
    if:
      type: text
      substr: github.com/rwjblue/ember-template-lint
