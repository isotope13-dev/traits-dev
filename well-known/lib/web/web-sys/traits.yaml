# web-sys — official wasm-bindgen WebIDL bindings for Web APIs
# (https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/web-sys).
defaults:
  platforms: [unix, windows]
  for: [crate, tar, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 50000000

traits:
  - id: crate-name
    desc: web-sys crate archive package name
    for: [crate, tar]
    if:
      type: value
      path: crate.name
      exact: web-sys

  - id: cargo-package-name
    desc: web-sys Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: web-sys

  - id: wasm-bindgen-authors
    desc: wasm-bindgen Developers crate authors
    for: [crate, tar]
    if:
      type: value
      path: crate.authors
      exact: The wasm-bindgen Developers

  - id: upstream-repository
    desc: wasm-bindgen web-sys GitHub repository
    if:
      type: text
      substr: github.com/wasm-bindgen/wasm-bindgen

  - id: webidl-generated-bindings
    desc: WebIDL generated Web API bindings
    for: [crate, cargo.toml, markdown]
    if:
      type: text
      substr: procedurally generated crate from WebIDL
