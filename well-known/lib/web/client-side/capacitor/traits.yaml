defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [javascript, package.json]

traits:
  - id: core-package-name
    desc: Capacitor core package identity
    crit: notable
    for: [package.json]
    if:
      type: text
      regex: '"name"\s*:\s*"@capacitor/core"'
  - id: official-homepage
    desc: Capacitor official package homepage
    crit: notable
    for: [package.json]
    if:
      type: text
      substr: 'https://capacitorjs.com'
  - id: cli-package-name
    desc: Capacitor CLI package identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@capacitor/cli'
  - id: cli-vendored-path
    desc: vendored Capacitor CLI package path
    crit: notable
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@capacitor/cli/'
  - id: cordova-runtime-file
    desc: Capacitor Cordova runtime filename
    crit: notable
    for: [javascript]
    if:
      type: path
      basename: true
      exact: cordova.js
      case_insensitive: true

composite_rules:
  - id: capacitor-cordova-runtime-context
    for: [javascript, package.json, npm]
    desc: Recognized Capacitor Cordova runtime
    crit: exception
    scope: outer
    all:
      - id: core-package-name
      - id: official-homepage
      - id: cordova-runtime-file

  - id: capacitor-cli-library
    desc: Capacitor CLI npm package
    crit: notable
    any:
      - id: cli-package-name
      - id: cli-vendored-path
