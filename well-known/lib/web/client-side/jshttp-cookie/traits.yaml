# jshttp/cookie — HTTP cookie parse/serialize helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cookie npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cookie

  - id: vendored-path
    desc: vendored cookie package path
    if:
      type: path
      regex: 'node_modules/cookie/'

composite_rules:
  - id: jshttp-cookie-library
    desc: jshttp cookie parse/serialize library
    any:
      - id: package-name
      - id: vendored-path
