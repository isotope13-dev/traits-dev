# Analyst — WordPress plugin telemetry SDK (analyst_resolve_sdk).
defaults:
  platforms: [windows, unix]
  for: [php, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: resolver-function
    desc: Analyst WP SDK resolver function
    for: [php]
    if:
      type: text
      substr: 'function analyst_resolve_sdk'

  - id: cache-option-key
    desc: Analyst WP cache option key
    for: [php]
    if:
      type: text
      substr: "OPTION_KEY = 'analyst_cache'"

  - id: assets-helper
    desc: Analyst WP assets path helper
    for: [php]
    if:
      type: text
      substr: 'function analyst_assets_path'

  - id: notice-ajax
    desc: Analyst notice dismiss AJAX action
    for: [javascript]
    if:
      type: text
      substr: analyst_notification_dismiss

  - id: cache-namespace
    desc: Analyst cache PHP namespace
    for: [php]
    if:
      type: text
      substr: 'namespace Analyst\Cache'

  - id: database-cache-import
    desc: Analyst DatabaseCache use import
    for: [php]
    if:
      type: text
      substr: 'use Analyst\Cache\DatabaseCache'

  - id: accounts-option-key
    desc: Analyst accounts option key
    for: [php]
    if:
      type: text
      substr: "OPTIONS_KEY = 'analyst_accounts_data'"
