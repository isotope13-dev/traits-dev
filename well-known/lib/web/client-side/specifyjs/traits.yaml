# SpecifyJS — declarative TypeScript UI framework
# (https://github.com/asymmetric-effort/specifyjs). secureFetch ships SSRF
# protection error strings that read like defensive guardrail tooling.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: SpecifyJS scoped npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@asymmetric-effort/specifyjs'

  - id: scoped-npm-package-identity
    desc: SpecifyJS scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@asymmetric-effort/specifyjs'

  - id: github-repository-url
    desc: SpecifyJS GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/asymmetric-effort/specifyjs(\.git)?$'

  - id: secure-fetch-guard
    desc: SpecifyJS secureFetch SSRF guard
    for: [javascript, typescript]
    if:
      type: text
      substr: '[SpecifyJS] SSRF protection'

  - id: assert-secure-url
    desc: SpecifyJS assertSecureUrl helper
    for: [javascript, typescript]
    if:
      type: text
      substr: function assertSecureUrl

composite_rules:
  - id: package-identity
    desc: Official SpecifyJS package identity
    crit: notable
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity
    all:
      - id: github-repository-url

  - id: package-context
    desc: Official SpecifyJS package context
    crit: exception
    any:
      - id: package-identity
      - id: secure-fetch-guard
      - id: assert-secure-url
