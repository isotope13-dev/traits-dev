defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
- id: cookies-global-signature-fragment
  desc: Cookies global name in library signature
  crit: component
  conf: 0.9
  if:
    type: text
    substr: window.Cookies
- id: v2-api-signature-fragment
  desc: Paired getJSON and withConverter API names
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.getJSON[\s\S]{0,240}\.withConverter\s*='

composite_rules:
- id: recognized-js-cookie-library-bundle
  desc: js-cookie v2 cookie API implementation
  # The global Cookies export plus getJSON/withConverter identifies the v2
  # API. Generic cookie splitting also occurs in jquery.cookie, while unrelated
  # clients may implement getJSON and withConverter without a Cookies export.
  # The v3 distribution has a separate banner fingerprint.
  crit: notable
  conf: 0.9
  near_bytes: 2048
  all:
    - id: cookies-global-signature-fragment
    - id: v2-api-signature-fragment
