defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 1.0
  for:
    - javascript
traits:
  - id: copyright
    desc: Prototype.js copyright header
    if:
      type: string_literal
      substr: Prototype JavaScript framework
      case_insensitive: true
  - id: version-string
    desc: Prototype framework object declaration
    crit: notable
    if:
      type: text
      substr: var Prototype = {
