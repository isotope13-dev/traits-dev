# @feng3d/* — feng3d WebGL/WebGPU engine ecosystem (feng3d.com and
# gitee.com/feng3d). Addons and math packages include explicit three.js ports.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: feng3d-npm-package-name
    desc: feng3d scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@feng3d/'
  - id: feng3d-npm-archive-name
    desc: feng3d scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@feng3d/'
  - id: feng3d-gitee-repository
    desc: feng3d Gitee repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: gitee.com/feng3d/
  - id: feng3d-gitee-url-text
    desc: feng3d Gitee URL in text
    for: [javascript, typescript, package.json, markdown]
    if:
      type: text
      regex: '(?i)gitee\.com/feng3d/'
  - id: feng3d-homepage
    desc: feng3d project homepage URL
    for: [package.json]
    if:
      type: value
      path: homepage
      substr: feng3d.com
  - id: effect-reactivity-class
    desc: feng3d EffectReactivity class name
    for: [javascript, typescript]
    if:
      type: symbol
      exact: EffectReactivity
  - id: computed-reactivity-class
    desc: feng3d ComputedReactivity class name
    for: [javascript, typescript]
    if:
      type: symbol
      exact: ComputedReactivity
  - id: feng3d-threejs-addons-port
    desc: feng3d three.js addons port reference
    for: [javascript, typescript, package.json, markdown]
    if:
      type: text
      regex: '(?is)(feng3d.{0,128}three\.js addons/|three\.js addons/.{0,128}feng3d)'

composite_rules:
  - id: feng3d-library
    desc: feng3d engine support library
    conf: 0.98
    any:
      - id: feng3d-npm-package-name
      - id: feng3d-npm-archive-name
      - id: effect-reactivity-class
      - id: computed-reactivity-class

  - id: feng3d-ecosystem-identity
    desc: feng3d 3D engine ecosystem identity
    for: [package.json]
    all:
      - id: feng3d-npm-package-name
      - id: feng3d-gitee-url-text
