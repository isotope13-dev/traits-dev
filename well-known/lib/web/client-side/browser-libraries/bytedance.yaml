defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - html
  crit: notable
  conf: 0.99
traits:
- id: bytedance-acrawler-vm
  desc: ByteDance acrawler VM bytecode runtime
  if:
    type: text
    substr: HNOJ@?RC
- id: bytedance-unisec-core
  desc: ByteDance BSSDK Unisec security core
  if:
    type: text
    regex: bssdk\.unisec|__bssdk_unisec_detector
- id: package-static-bytedance-path
  desc: Scraper static Douyin or TikTok asset path
  if:
    type: path
    regex: static[\\/](douyin|tiktok)
