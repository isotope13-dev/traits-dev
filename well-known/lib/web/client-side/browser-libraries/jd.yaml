# JD.com (Jingdong) official web security and risk management client assets.
# Bundled by web scrapers and automation tools (ParamsSign, jdwebm, etc.)
# or fetched from JD CDN storage.360buyimg.com.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.99

traits:
  - id: cdn-path-storage-360buyimg
    desc: JD.com 360buyimg CDN path or URL
    if:
      type: path
      substr: storage.360buyimg.com

  - id: jd-paramssign-runtime
    desc: JD.com ParamsSign request signature runtime
    if:
      type: text
      regex: '(window\.)?ParamsSign\s*='

  - id: jdwebm-riskhandle-runtime
    desc: JD.com jdwebm risk handling runtime
    if:
      type: text
      regex: 'jdwebm(_hf|\.js)'

  - id: package-static-jd-path
    desc: Scraper static JD asset member path
    if:
      type: path
      regex: 'static[\\/]jd'

composite_rules:
  - id: jd-web-asset
    desc: Recognized JD.com web security or risk management asset
    crit: exception
    conf: 0.99
    any:
      - id: cdn-path-storage-360buyimg
      - id: package-static-jd-path
      - id: jd-paramssign-runtime
      - id: jdwebm-riskhandle-runtime
