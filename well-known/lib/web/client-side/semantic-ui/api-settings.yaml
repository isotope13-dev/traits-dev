defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, crx, xpi]
  size_max: 120000000
traits:
  - id: semantic-ui-api-settings
    desc: Semantic UI API settings implementation
    for: [javascript, text]
    if:
      type: text
      regex: 'semantic.{0,40}loadingDuration|loadingDuration.{0,80}apiSettings'
      case_insensitive: true
