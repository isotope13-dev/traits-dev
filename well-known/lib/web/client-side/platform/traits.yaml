# Platform.js (Benjamin Tan, John-David Dalton) — platform detection library.
# The packed distribution is Dean Edwards packer output carrying the library
# banner and distinctive OS/browser dictionary tokens.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: platform-js-banner
    desc: Platform.js copyright and banner
    conf: 0.99
    if:
      type: text
      substr: 'Platform.js <https://mths.be/platform>'

  - id: platform-js-packed-dictionary
    desc: Platform.js packer dictionary tokens
    conf: 0.98
    if:
      type: text
      substr: 'Trident|Nook|||Silk'

composite_rules:
  - id: packed-platform-library
    desc: Stock packed Platform.js library distribution
    crit: exception
    conf: 0.99
    all:
      - id: platform-js-banner
      - id: platform-js-packed-dictionary
