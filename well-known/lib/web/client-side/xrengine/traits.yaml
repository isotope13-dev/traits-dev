# XREngine — open source 3D and XR engine for the web.
# Official packages in the XREngine project live in the XRFoundation/XREngine
# monorepo. Individual @xrengine/* packages therefore do not share the repository
# basename and their documentation or subpackages can reference sibling components.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: XREngine scoped package identity
    if:
      type: value
      path: name
      regex: '^@xrengine/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-url
    desc: XREngine GitHub repository URL
    if:
      type: value
      path: repository.url
      regex: '(?i)^(git(\+https?)?://|https?://)github\.com/xrfoundation/xrengine(\.git)?(/.*)?$'

composite_rules:
  - id: official-scope-repository-pair
    desc: Official XREngine package repository pairing
    crit: exception
    all:
      - id: scoped-package-identity
      - id: github-repository-url
