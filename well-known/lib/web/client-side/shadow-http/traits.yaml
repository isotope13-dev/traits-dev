# shadow-http — Thomas Heller's HTTP server for shadow-cljs (proxy,
# websocket, classpath/file handlers). Clojars artifact com.thheller/shadow-http.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, java, class, java_class, clojure]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: shadow-http Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: shadow-http

  - id: pom-group
    desc: thheller Maven group id
    for: [jar, zip]
    conf: 0.97
    if:
      type: value
      path: jar.pom.group_id
      exact: com.thheller

  - id: server-package-path
    desc: shadow-http package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)shadow/http/'
