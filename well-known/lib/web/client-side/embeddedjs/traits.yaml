# EmbeddedJS (EJS 1.0, embeddedjs.com) -- the 2008-era client-side template
# engine still bundled by RabbitMQ's management UI (priv/www/js/ejs-1.0.js).
# Its request helper tries ActiveX Msxml2.XMLHTTP before XMLHttpRequest, loads
# templates synchronously, and evals a fetched JSON view: the exact legs of an
# ActiveX download-and-eval dropper, as the stock library's own plumbing.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97

traits:
  - id: ejs-scanner-class
    desc: EJS template scanner class
    if:
      type: text
      regex: 'EJS\.Scanner\s*=\s*function\s*\('
  - id: ejs-compiler-class
    desc: EJS template compiler class
    if:
      type: text
      regex: 'EJS\.Compiler\s*=\s*function\s*\('
  - id: ejs-request-helper
    desc: EJS template request helper
    if:
      type: text
      regex: 'EJS\.newRequest\s*=\s*function\s*\('

composite_rules:
  - id: embeddedjs-template-library
    desc: EmbeddedJS client-side template library
    crit: exception
    conf: 0.98
    all:
      - id: ejs-scanner-class
      - id: ejs-compiler-class
      - id: ejs-request-helper
