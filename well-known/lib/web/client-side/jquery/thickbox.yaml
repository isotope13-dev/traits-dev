defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  crit: notable
  conf: 0.99
traits:
  - id: thickbox-3-title
    desc: Thickbox 3 title and original author
    if:
      type: text
      regex: 'Thickbox 3 - One Box To Rule Them All\.[\s\S]{0,80}By Cody Lindley'
  - id: thickbox-packed-overlay-dictionary
    desc: Thickbox packed overlay/navigation dictionary
    if:
      type: text
      substr: 'TB_overlay|remove|TB_Counter|TB_TempArray|TB_ajaxContent|tb_remove'
composite_rules:
  - id: packed-thickbox-plugin
    desc: Stock packed jQuery Thickbox 3 plugin
    all:
      - id: thickbox-3-title
      - id: thickbox-packed-overlay-dictionary
