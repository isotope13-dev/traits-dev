# jQuery library identity and stock-build markers.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - html
traits:
  # Page or script code calling the jQuery API, as opposed to merely
  # carrying a jQuery filename. Used to tell a page that loads jQuery to
  # use it from one that includes a jquery-named file it never touches.
  - id: jquery-global-api-call
    desc: Calls the jQuery global function or object
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\bjQuery\s*[.(]'
  - id: version-string
    desc: jQuery version string
    crit: notable
    conf: 0.95
    # Banners live in file comments, not string literals — use text so stock
    # jquery-*.min.js (v1.2 era through current) still identifies as jQuery.
    if:
      type: text
      # Covers modern `jQuery v3.x`, classic `jQuery JavaScript Library v1.x`,
      # and early `jQuery 1.2.3 - New Wave` banners (optional leading 'v').
      regex: 'jQuery( JavaScript Library)? v?[0-9]\.[0-9]+\.[0-9]+'
      not:
        - substr: "Bootstrap's JavaScript requires at least jQuery"
        - substr: "Bootstrap\\'s JavaScript requires at least jQuery"
  - id: header-prefix
    desc: Contains a jQuery version banner
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: '/*! jQuery v'
  - id: license-url
    desc: jQuery license URL marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: jquery.org/license
  - id: copyright
    desc: jQuery copyright notice
    crit: notable
    conf: 0.95
    # Copyright lines are comment text, not JS string literals.
    if:
      type: text
      substr: jQuery JavaScript Library
  - id: fn-extend
    desc: jQuery.fn.extend signature
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: jQuery.fn.extend

  # Some packaged extensions run jQuery through a renamer/hex-escape pass,
  # removing the normal banner and global names.  These independent library
  # markers identify that transformed copy without treating its compatibility
  # code as an attacker behavior.  A bare version literal ('1.11.1') is NOT a
  # marker: any package of that version carries it (e.g. @emnapi/core 1.11.1).
  - id: sizzle-string-literal
    desc: Sizzle string literal
    crit: baseline
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: sizzle
      case_insensitive: true
  - id: ajax-settings-identifier
    desc: jQuery ajaxSettings identifier
    crit: notable
    conf: 0.98
    if:
      type: text
      word: ajaxSettings

  # Stock Tooltip 1.x packed distributions retain both their helper body and
  # the plugin-specific symbol dictionary. Neither a banner nor a filename
  # establishes this identity.
  - id: tooltip-packed-helper
    desc: jQuery Tooltip packed helper implementation
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: |-
        e.m=$(\'10\',e.3);e.f=$(\'t.f\',e.3);e.o=$(\'t.o\',e.3)
  - id: tooltip-packed-dictionary
    desc: jQuery Tooltip packed symbol dictionary
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'defaults|class|data|attr|unfixPNG|offsetHeight|offsetWidth|position|src|createHelper'

  # Stock Autocomplete 1.x packed distributions retain both their packed
  # request-handling body and the plugin-specific symbol dictionary. Neither
  # a banner nor a filename establishes this identity.
  - id: autocomplete-packed-helper
    desc: jQuery Autocomplete packed helper implementation
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '$.1u({},$.M.1T,{Y:c?b:P,y:c?P:b,1J:c?$.M.1T.1J:10'
  - id: autocomplete-packed-dictionary
    desc: jQuery Autocomplete packed symbol dictionary
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'unautocomplete||loadingClass||setOptions|minChars|teststring|flushCache'

  # Stock Treeview 1.4 packed distributions retain both their packed
  # class-map body and the plugin-specific symbol dictionary. Neither
  # a banner nor a filename establishes this identity.
  - id: treeview-packed-helper
    desc: jQuery Treeview packed class-map implementation
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '$.F.z.1J={W:"W",X:"X",q:"q",Y:"q-5",M:"t-5"'

  - id: treeview-packed-dictionary
    desc: jQuery Treeview packed symbol dictionary
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '|has|treeview|apply|parent|click|hide|swapClass|fn|not|show|'

  # Dean Edwards-packed jQuery plugins (pngFix, imgAreaSelect, Interface
  # Elements, jqMinMax, xml2json) ship only as packer output. What identifies
  # them is the packer's word dictionary: jQuery plugin vocabulary (`fn`,
  # `extend`, `jquery`) with none of the script-loader or network words a
  # packed dropper needs.
  - id: packed-plugin-jquery-dictionary
    desc: Packer dictionary of jQuery plugin vocabulary
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(?i)('|\\|)(fn|extend|jquery)(\\|[A-Za-z0-9_|]{0,500})?'\\.split\\('\\|'\\)"
      not:
        - regex: '(?i)\|(XMLHttpRequest|WScript|atob|cookie|script|createElement|iframe)\|'
composite_rules:
  - id: packed-jquery-plugin
    desc: Packed jQuery plugin by dictionary
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/data/string/replace::js-packer-token-substitution
      - id: packed-plugin-jquery-dictionary
  - id: packed-tooltip-plugin
    desc: Stock packed jQuery Tooltip plugin
    crit: exception
    conf: 0.99
    all:
      - id: tooltip-packed-helper
      - id: tooltip-packed-dictionary
  - id: packed-autocomplete-plugin
    desc: Stock packed jQuery Autocomplete plugin
    crit: exception
    conf: 0.99
    all:
      - id: autocomplete-packed-helper
      - id: autocomplete-packed-dictionary
  - id: packed-treeview-plugin
    desc: Stock packed jQuery Treeview plugin
    crit: exception
    conf: 0.99
    all:
      - id: treeview-packed-helper
      - id: treeview-packed-dictionary
  - id: sizzle-with-ajax-settings
    desc: Sizzle and jQuery AJAX implementation markers
    crit: notable
    conf: 0.99
    all:
      - id: sizzle-string-literal
      - id: ajax-settings-identifier
