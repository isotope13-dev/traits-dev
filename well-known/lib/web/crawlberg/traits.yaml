# crawlberg — high-performance web crawler and headless browser layer (xberg-io).
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: crawlberg-crate-name
    desc: crawlberg crate archive package name
    for: [crate]
    if:
      type: value
      path: crate.name
      regex: '^crawlberg(-[a-z0-9_-]+)?$'

  - id: crawlberg-crate-repo
    desc: crawlberg crate upstream repository
    for: [crate]
    if:
      type: value
      path: crate.repository
      substr: github.com/xberg-io/crawlberg

  - id: crawlberg-cargo-package-name
    desc: crawlberg Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '^crawlberg(-[a-z0-9_-]+)?$'

  - id: crawlberg-upstream-repository
    desc: crawlberg upstream repository URL
    for: [rust, cargo.toml, markdown]
    if:
      type: text
      substr: github.com/xberg-io/crawlberg

  - id: crawlberg-ssrf-validator
    desc: crawlberg SSRF validator symbol
    for: [rust]
    if:
      type: text
      substr: DefaultSsrfValidator

composite_rules:
  - id: crawlberg-package
    desc: crawlberg web crawler browser framework
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: crawlberg-crate-name
      - id: crawlberg-crate-repo
      - id: crawlberg-cargo-package-name
      - id: crawlberg-upstream-repository
      - id: crawlberg-ssrf-validator
