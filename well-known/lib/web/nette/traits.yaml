defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: nette-framework-comment
    desc: Nette framework source comment
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "This file is part of the Nette Framework"

  # The framework's own namespace declaration. Referenced rather than
  # repeated inline by the rules that treat Nette source as ordinary context.
  # Anchored on the separator so `NetteFoo` from an unrelated vendor does not
  # read as Nette itself.
  - id: nette-namespace
    desc: Nette PHP namespace declaration
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'namespace\s+Nette([\\;]|$)'

composite_rules:
  - id: nette-framework-source
    desc: Nette framework source
    crit: notable
    conf: 0.95
    all:
      - id: nette-framework-comment
      - id: nette-namespace
