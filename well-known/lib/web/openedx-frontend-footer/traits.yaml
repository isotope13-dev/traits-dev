# Open edX frontend-component-footer and white-label forks (KADEM / artistanbul).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript]
  conf: 0.98
  size_max: 524288000

traits:
  - id: kadem-footer-package-name
    desc: KADEM footer npm package name
    crit: notable
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: '@artistanbul/kadem-frontend-component-footer'

  - id: openedx-footer-github
    desc: Open edX footer GitHub repository
    crit: notable
    for: [package.json, npm]
    if:
      type: value
      path: repository.url
      substr: github.com/openedx/frontend-component-footer

  - id: edx-jwt-cookie-name
    desc: Open edX JWT cookie name
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: edx-jwt-cookie-header-payload

  - id: openedx-local-lms-url
    desc: Open edX local LMS base URL
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: "LMS_BASE_URL = 'http://localhost:18000'"

  - id: studio-footer-slot-import
    desc: StudioFooterSlot plugin import path
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: plugin-slots/StudioFooterSlot

  - id: help-toggle-button-testid
    desc: Help toggle button test id
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: helpToggleButton

  - id: openedx-demo-course-button
    desc: Open edX demo course button
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: openEdXDemoCourseButton

composite_rules:
  - id: openedx-frontend-footer
    desc: Open edX frontend footer component
    crit: notable
    needs: 2
    any:
      - id: kadem-footer-package-name
      - id: openedx-footer-github
      - id: edx-jwt-cookie-name
      - id: openedx-local-lms-url
      - id: studio-footer-slot-import
      - id: help-toggle-button-testid
      - id: openedx-demo-course-button
