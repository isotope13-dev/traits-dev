# tj/consolidate.js — Node template-engine consolidation library.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-pull-ref
    desc: consolidate.js GitHub pull request reference
    for: [javascript]
    if:
      type: text
      substr: github.com/tj/consolidate.js/pull/

  - id: package-name
    desc: consolidate npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: consolidate

  - id: repository
    desc: consolidate.js source repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: tj/consolidate.js

composite_rules:
  - id: consolidate-js-library
    desc: consolidate.js template engine library
    any:
      - id: upstream-pull-ref
      - id: package-name
