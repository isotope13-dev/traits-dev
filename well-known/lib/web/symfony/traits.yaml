defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.96
  size_max: 8388608

traits:
  - id: unicode-data-table
    desc: Symfony Unicode data table
    if:
      type: path
      regex: 'Resources[\\/]unidata[\\/]Regex\\.php$'
  - id: polyfill-namespace
    desc: Symfony Polyfill namespace
    if:
      type: text
      regex: 'namespace\s+.{0,80}Symfony\\Polyfill\\'
  - id: package-doc
    desc: Symfony package doc marker
    if:
      type: text
      substr: "This file is part of the Symfony package."

  - id: dependency-injection-package-name
    desc: symfony/dependency-injection package
    crit: notable
    for: [composer.json, json, text]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"symfony/dependency-injection"'

  - id: lazy-proxy-instantiator
    desc: Symfony lazy proxy instantiator class
    crit: notable
    if:
      type: text
      substr: 'Symfony\Component\DependencyInjection\LazyProxy\Instantiator\LazyServiceInstantiator'

composite_rules:
  - id: symfony-framework
    desc: Symfony PHP framework component
    crit: notable
    conf: 0.97
    any:
      - id: polyfill-namespace
      - id: unicode-data-table
      - id: package-doc

  - id: symfony-dependency-injection-package
    desc: symfony/dependency-injection component package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: dependency-injection-package-name
    any:
      - id: lazy-proxy-instantiator
