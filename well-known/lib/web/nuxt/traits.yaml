# Nuxt packages published under the @nuxt/ scope.
#
# The Nuxt framework ships every build-time helper (@nuxt/vite-builder,
# @nuxt/webpack-builder, @nuxt/kit, @nuxt/schema, ...) from the nuxt GitHub
# organization -- mostly the single nuxt/nuxt monorepo, plus sibling repos such
# as nuxt/ui and nuxt/image. Individual @nuxt/* packages therefore do not share
# the repository basename, and the engine's folded-slug comparison reads every
# official release as a clone-and-rename shape. The published README is the
# monorepo root README: its heading and npm links name the `nuxt` framework
# package, never the helper being published, and the manifest usually writes
# `repository` as the bare `owner/repo` shorthand (`"repository": "nuxt/nuxt"`)
# rather than a URL -- a spelling the URL-only pairing regexes never see.
#
# The npm scope matching the repository owner is the identity consistency the
# slug check cannot express, so pair the two here: a differently named package
# that merely points at a nuxt repository (or a @nuxt/ package pointing
# elsewhere) still lacks this exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Nuxt scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@nuxt/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Nuxt scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@nuxt/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Nuxt GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/nuxt/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-repository-shorthand
    # Nuxt manifests usually use the bare `owner/repo` shorthand
    # (`"repository": "nuxt/nuxt"`), so this atom accepts that spelling.
    desc: Nuxt owner/repo repository shorthand
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^nuxt/[a-z0-9][a-z0-9._-]{0,79}$'

  - id: github-repository-url
    desc: Nuxt GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/nuxt/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Nuxt GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/nuxt/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: npm-repository-shorthand
    # The engine normalizes the tarball's manifest repository to `nuxt/nuxt`.
    desc: Nuxt npm archive repository shorthand
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^nuxt/[a-z0-9][a-z0-9._-]{0,79}$'

composite_rules:
  - id: official-package-scope
    desc: Official Nuxt package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Nuxt organization repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-shorthand
      - id: github-repository-url
      - id: github-npm-repository-url
      - id: npm-repository-shorthand

  - id: official-scope-repository-pair
    desc: Official Nuxt package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
