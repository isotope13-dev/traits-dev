# JSHint's generated Unicode identifier table is a comma-separated list of
# code points. That shape is the Nemucod numeric-string pattern.
defaults:
  size_min: 1000
  size_max: 100000
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
  - id: jshint-non-ascii-identifier-data
    desc: JSHint non-ASCII identifier table
    conf: 0.95
    if:
      type: basename
      exact: non-ascii-identifier-part-only.js
