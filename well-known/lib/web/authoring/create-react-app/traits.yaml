# Create React App default src/index.js template.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: cra-pwa-docs-url
    desc: Create React App PWA docs shortlink
    if:
      type: text
      substr: 'https://bit.ly/CRA-PWA'
  - id: service-worker-unregister
    desc: CRA serviceWorker.unregister call
    if:
      type: text
      substr: 'serviceWorker.unregister()'

composite_rules:
  - id: create-react-app-index
    desc: Create React App index template
    all:
      - id: cra-pwa-docs-url
      - id: service-worker-unregister
