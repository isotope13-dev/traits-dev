# @donmccurdy/caporal — Node.js CLI framework (donmccurdy/caporal.js).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: caporal-scoped-package-name
    desc: Don McCurdy caporal scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@donmccurdy/caporal'

  - id: caporal-scoped-npm-archive-name
    desc: Don McCurdy caporal scoped npm name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@donmccurdy/caporal'

  - id: caporal-upstream-repository
    desc: caporal.js upstream repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/donmccurdy/caporal\.js'

  - id: caporal-upstream-repository-short
    desc: caporal.js shorthand repository field
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(?i)donmccurdy/caporal\.js'

  - id: caporal-upstream-repository-npm
    desc: caporal npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)(github\.com/)?donmccurdy/caporal\.js'

composite_rules:
  - id: caporal-upstream
    desc: caporal.js upstream repository claim
    crit: notable
    any:
      - id: caporal-upstream-repository
      - id: caporal-upstream-repository-short
      - id: caporal-upstream-repository-npm

  - id: caporal-package-identity
    desc: Don McCurdy caporal CLI framework package
    crit: notable
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: caporal-upstream
    any:
      - id: caporal-scoped-package-name
      - id: caporal-scoped-npm-archive-name
