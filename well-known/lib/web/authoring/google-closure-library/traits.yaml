# Google's Closure Library — the `goog.*` JavaScript library, distinct from the
# Closure Compiler at well-known/lib/development/google-closure-compiler/.
#
# The library ships CLDR-derived i18n data: files that enumerate every locale
# identifier and every IANA timezone on earth. Region-gating rules match those
# same tokens, and their `unless: well-known/lib/` clauses only work if the
# library has an identity here — so without this the whole `i18n/` tree read as
# CIS-region geofencing. Every source file carries the copyright header, which
# is what makes the identity per-file rather than package-level.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: closure-library-copyright
    desc: Closure Library copyright header
    conf: 0.97
    if:
      type: text
      regex: 'Copyright( \d{4})? The Closure Library Authors'

  - id: closure-dependency-catalog
    desc: Closure dependency catalog declaration
    conf: 0.95
    if:
      type: text
      substr: 'goog.addDependency('

  # Compiled bundles keep `goog.globalEval=function(e){(0,eval)(e)}` after the
  # copyright header is stripped. That sink is Closure's global-scope eval, not
  # a decoded stage, but a collapsed snippet offset can place it on top of an
  # unrelated alphabet lookup.
  - id: closure-compiled-global-eval
    desc: Compiled Closure globalEval sink
    conf: 0.96
    if:
      type: text
      substr: 'goog.globalEval=function'

composite_rules:
  - id: closure-library-source
    desc: Google Closure Library source file
    conf: 0.97
    any:
      - id: closure-library-copyright
      - id: closure-dependency-catalog
