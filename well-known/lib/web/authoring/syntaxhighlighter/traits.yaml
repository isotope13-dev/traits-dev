defaults:
  platforms: [windows, unix]
  crit: baseline
  for:
    - javascript
traits:
  - id: codepress-language-syntax-array
    desc: CodePress language syntax rule array
    crit: notable
    if:
      type: text
      substr: 'Language.syntax = ['
  - id: codepress-language-snippet-array
    desc: CodePress editor snippet template array
    crit: notable
    if:
      type: text
      substr: 'Language.snippets = ['
  - id: codepress-language-completion-array
    desc: CodePress editor completion template array
    crit: notable
    if:
      type: text
      substr: 'Language.complete = ['
  - id: syntaxhighlighter-core
    desc: SyntaxHighlighter core library
    crit: notable
    if:
      type: symbol
      regex: SyntaxHighlighter
  - id: ace-editor-core
    desc: Ace editor core library
    crit: notable
    if:
      type: text
      substr: 'define("ace/mode/text_highlight_rules"'
  - id: syntaxhighlighter-brush
    desc: SyntaxHighlighter brush definition
    crit: notable
    if:
      type: symbol
      regex: SyntaxHighlighter\.brushes|SyntaxHighlighter\.Highlighter
  - id: syntaxhighlighter-brush-export
    desc: SyntaxHighlighter brush export
    crit: notable
    if:
      type: symbol
      substr: 'exports.Brush'
  - id: syntaxhighlighter-header-url
    desc: SyntaxHighlighter project URL
    crit: notable
    if:
      type: string_literal
      substr: 'alexgorbatchev.com/SyntaxHighlighter'
  - id: prismjs-core
    desc: PrismJS syntax highlighter core
    if:
      type: text
      substr: Prism.languages
  - id: prismjs-file-highlight-plugin
    desc: PrismJS file highlight plugin
    if:
      type: text
      substr: before-highlightall
  - id: prismjs-package-reference
    desc: PrismJS package reference
    if:
      type: text
      substr: prismjs
  # A per-language component (prism-bash.js, prism-php.js) never spells
  # `Prism.languages` — it takes the global as an IIFE parameter and uses the
  # minified alias inside, so only the `}(Prism)` footer names the library.
  # Without this, a component file is just a grammar full of command and
  # keyword literals with no library identity attached to it.
  - id: prismjs-language-component
    desc: PrismJS language component wrapper
    if:
      type: text
      regex: '\(\s*function\s*\(\s*Prism\s*\)|\}\s*\(\s*Prism\s*\)'
  - id: shjs-namespace
    desc: SHJS language registry namespace
    if:
      type: text
      substr: sh_languages
  - id: shjs-highlighter-core
    desc: SHJS syntax highlighting core
    if:
      type: text
      substr: sh_highlightString
  - id: shjs-grammar-loader
    desc: SHJS remote grammar loader
    if:
      type: text
      regex: 'function\s+sh_load\s*\('
composite_rules:
  - id: codepress-language-definition
    desc: CodePress language definition
    crit: notable
    all:
      - id: codepress-language-syntax-array
      - id: codepress-language-snippet-array
      - id: codepress-language-completion-array
  - id: codepress-snippet-template-context
    desc: CodePress language definition contains editor snippet templates
    crit: exception
    all:
      - id: codepress-language-definition
      - id: codepress-language-snippet-array
  - id: prismjs-syntax-highlighter
    desc: PrismJS syntax highlighter bundle
    crit: notable
    conf: 0.95
    any:
      - id: prismjs-core
      - id: prismjs-file-highlight-plugin
      - id: prismjs-package-reference
      - id: prismjs-language-component
    needs: 2
  - id: shjs-syntax-highlighter
    desc: SHJS syntax highlighter source
    crit: notable
    conf: 0.99
    all:
      - id: shjs-namespace
      - id: shjs-highlighter-core
      - id: shjs-grammar-loader
