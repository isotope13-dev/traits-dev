# The official Astro project adopted these utility names in its 7.x releases.
# Keep supply-chain lookalike rules active for unrelated packages.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: astro-upstream-package-name
    desc: Official Astro package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: astro

  - id: astro-upstream-repository
    desc: Official Astro GitHub repository
    crit: notable
    conf: 0.99
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/withastro/astro(\.git)?$'

  - id: astro-upstream-author
    desc: Astro upstream publisher identity
    crit: notable
    conf: 0.95
    if:
      type: value
      path: author
      exact: withastro

  - id: astro-depup-package-name
    desc: DepUp repackaged Astro package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@depup/astro'

  - id: depup-original-astro-package
    desc: DepUp original Astro package
    crit: notable
    conf: 0.99
    if:
      type: value
      path: depup.originalPackage
      exact: astro

  - id: astrojs-vercel-scoped-package-name
    desc: Astro Vercel deployment adapter package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@astrojs/vercel'

  - id: astrojs-vercel-scoped-npm-name
    desc: Astro Vercel adapter npm archive name
    crit: notable
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@astrojs/vercel'

  - id: astro-upstream-repository-npm
    desc: Official Astro monorepo npm archive repository
    crit: notable
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/withastro/astro(\.git)?$'

  - id: vercel-insights-analytics-injector
    desc: Vercel Web Analytics script injection helper
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: getInjectableWebAnalyticsContent

composite_rules:
  - id: astro-upstream-release-context
    desc: Official Astro upstream release context
    crit: exception
    conf: 0.99
    for: [package.json, javascript, typescript, npm]
    scope: outer
    all:
      - id: astro-upstream-package-name
      - id: astro-upstream-repository
      - id: astro-upstream-author

  - id: astrojs-vercel-deployment-adapter-manifest-context
    desc: Astro Vercel adapter package.json identity
    crit: exception
    conf: 0.99
    for: [package.json, npm, tar, zip]
    scope: archive
    all:
      - id: astrojs-vercel-scoped-package-name
      - id: astro-upstream-repository

  - id: astrojs-vercel-deployment-adapter-npm-context
    desc: Astro Vercel adapter npm archive identity
    crit: exception
    conf: 0.99
    for: [npm, tar, zip]
    scope: archive
    all:
      - id: astrojs-vercel-scoped-npm-name
      - id: astro-upstream-repository-npm

  - id: astrojs-vercel-deployment-adapter-context
    desc: Official Astro Vercel deployment adapter package
    crit: exception
    conf: 0.99
    for: [package.json, npm, tar, zip, javascript]
    scope: archive
    any:
      - id: astrojs-vercel-deployment-adapter-manifest-context
      - id: astrojs-vercel-deployment-adapter-npm-context
