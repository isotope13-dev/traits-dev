# ByteDance (Douyin, TikTok) official web security, anti-bot, and acrawler VM assets.
# Bundled by web scrapers and automation tools (ac_vm.js, unisec core, etc.)
# or fetched from ByteDance CDN domains.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.99

traits:
  - id: bytedance-acrawler-vm
    desc: ByteDance acrawler VM bytecode runtime
    if:
      type: text
      substr: "HNOJ@?RC"

  - id: bytedance-unisec-core
    desc: ByteDance BSSDK Unisec security core
    if:
      type: text
      regex: 'bssdk\.unisec|__bssdk_unisec_detector'

  - id: package-static-bytedance-path
    desc: Scraper static Douyin or TikTok asset path
    if:
      type: path
      regex: 'static[\\/](douyin|tiktok)'

composite_rules:
  - id: bytedance-web-security-asset
    desc: Recognized ByteDance web security or anti-bot asset
    crit: exception
    conf: 0.99
    any:
      - id: bytedance-acrawler-vm
      - id: bytedance-unisec-core
      - id: package-static-bytedance-path
