# TrustedLogin (`trustedlogin/client`, often vendor-prefixed via Strauss or
# Mozart in WordPress plugins) provides opt-in, time-limited support access.
# Its `auth['api_key']` setting is a 16-hex-character public vendor identifier
# rather than a secret credential.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: trustedlogin-php-namespace
    desc: Declares TrustedLogin PHP namespace
    conf: 0.98
    if:
      type: text
      exclude_comments: true
      regex: 'namespace\s+([A-Za-z0-9_\\]{1,64}\\)?TrustedLogin(\\[A-Za-z0-9_\\]{1,48})?\s*;'

  - id: trustedlogin-client-class-ref
    desc: References TrustedLogin Client or Config class
    conf: 0.97
    if:
      type: text
      exclude_comments: true
      regex: '[\\A-Za-z0-9_]{0,64}TrustedLogin\\(Client|Config)\b'

  - id: trustedlogin-saas-api-domain
    desc: References app.trustedlogin.com service domain
    conf: 0.97
    for: [php, javascript, text]
    if:
      type: text
      substr: app.trustedlogin.com

  - id: trustedlogin-vendor-config-block
    desc: Configures TrustedLogin vendor support_url
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '[''"]vendor[''"]\s*=>\s*(array\s*\(|\[)[\s\S]{0,320}[''"]support_url[''"]\s*=>'

composite_rules:
  - id: trustedlogin-php-sdk
    desc: TrustedLogin WordPress support SDK
    conf: 0.98
    any:
      - id: trustedlogin-php-namespace
      - id: trustedlogin-client-class-ref
      - id: trustedlogin-saas-api-domain

  - id: trustedlogin-client-config-context
    desc: TrustedLogin public vendor configuration
    crit: exception
    conf: 0.98
    all:
      - id: trustedlogin-vendor-config-block
      - id: trustedlogin-php-sdk
