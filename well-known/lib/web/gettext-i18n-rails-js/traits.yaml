# gettext_i18n_rails_js packages frontend assets and uses a Windows-gated
# helper during installation; the extconf payload heuristic is not applicable
# to this known package.
defaults:
  platforms: [unix, windows]
  for: [gem, tar.gz]
  crit: notable
  conf: 0.99

traits:
  - id: gettext-i18n-rails-js-package-path
    desc: gettext Rails JS gem or member path
    if:
      type: path
      regex: '(^|[\\/])gettext_i18n_rails_js-[0-9][^\\/]*\\.gem'

  - id: gettext-i18n-rails-js-extconf-path
    desc: gettext Rails JS extconf member path
    if:
      type: path
      regex: '(^|[\\/])extconf\\.rb'

composite_rules:
  - id: gettext-i18n-rails-js-package-context
    desc: Recognized gettext_i18n_rails_js package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: gettext-i18n-rails-js-package-path
      - id: gettext-i18n-rails-js-package-path
      - id: gettext-i18n-rails-js-extconf-path
