# @macrostrat/* — UW-Macrostrat web-components monorepo (geology UI libraries).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: macrostrat-scoped-package-name
    desc: Macrostrat scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@macrostrat/'

  - id: macrostrat-scoped-npm-name
    desc: Macrostrat scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@macrostrat/'

  - id: macrostrat-web-components-monorepo-repository
    desc: UW-Macrostrat web-components monorepo repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/uw-macrostrat/web-components'

  - id: macrostrat-web-components-monorepo-repository-npm
    desc: Macrostrat npm archive web-components repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/uw-macrostrat/web-components'

  - id: macrostrat-bundle-library-build-script
    desc: Macrostrat bundle-library package build script
    for: [package.json]
    if:
      type: value
      path: scripts.build
      regex: '^bundle-library\b'

composite_rules:
  - id: macrostrat-web-components-package-context
    desc: UW-Macrostrat web-components monorepo npm package
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: macrostrat-web-components-monorepo-repository
    any:
      - id: macrostrat-scoped-package-name
      - id: macrostrat-scoped-npm-name
