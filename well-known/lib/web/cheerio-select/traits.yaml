# cheerio-select — CSS selector adapter for Cheerio.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cheerio-select npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cheerio-select

  - id: vendored-path
    desc: vendored cheerio-select package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cheerio-select/'


composite_rules:
  - id: cheerio-select-library
    desc: cheerio-select CSS engine
    any:
      - id: package-name
      - id: vendored-path
