# js-sys — wasm-bindgen bindings to JavaScript global APIs.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: js-sys-crate-name
    desc: js-sys crate archive package name
    for: [crate]
    if:
      type: value
      path: crate.name
      exact: js-sys

  - id: js-sys-cargo-package-name
    desc: js-sys Cargo package name
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: js-sys

  - id: js-sys-upstream-repository
    desc: js-sys upstream repository URL
    if:
      type: text
      substr: github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/js-sys

composite_rules:
  - id: js-sys-library
    desc: js-sys JavaScript global bindings library
    scope: outer
    any:
      - id: js-sys-crate-name
      - id: js-sys-cargo-package-name
      - id: js-sys-upstream-repository
    needs: 2
