# jsoup — Java HTML parser; optional insecure TLS for scraping.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, java]
  crit: notable
  conf: 0.99
  size_min: 64

traits:
  - id: jsoup-jar-basename
    desc: jsoup HTML parser JAR basename
    if:
      type: path
      basename: true
      regex: '(?i)^jsoup-[\d.]+\.jar$'

  - id: jsoup-package-path
    desc: org.jsoup Java package path prefix
    for: [jar, zip, class, java_class]
    if:
      type: path
      regex: '(?i)org/jsoup/'

  - id: jsoup-helper-class-basename
    desc: jsoup HttpConnection helper class basename
    for: [jar, zip, class, java_class]
    if:
      type: path
      basename: true
      exact: HttpConnection$Response.class
      case_insensitive: true

composite_rules:
  - id: jsoup-library-context
    desc: jsoup Java HTML parser library
    crit: notable
    conf: 0.99
    any:
      - id: jsoup-jar-basename
      - id: jsoup-package-path
      - id: jsoup-helper-class-basename
