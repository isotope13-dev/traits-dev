defaults:
  platforms:
  - unix
  - windows
  for:
  - gem
  - ruby
  - javascript
  - text
  crit: baseline
  conf: 0.96
  size_max: 5000000
traits:
- id: gem-package-name
  desc: Ruby gem name tina4ruby
  for:
  - gem
  - text
  if:
    type: text
    regex: '(?im)^name:\s*tina4ruby\s*$'
- id: tina4-module-declaration
  desc: Tina4 module declaration
  for:
  - ruby
  if:
    type: text
    regex: module\s+Tina4\b
- id: tina4-namespace-const
  desc: Tina4 namespaced constant reference
  for:
  - ruby
  if:
    type: text
    regex: Tina4::[A-Z]
- id: tina4-lib-path
  desc: Tina4Ruby library path under lib/tina4
  crit: notable
  for:
  - ruby
  - javascript
  - text
  if:
    type: path
    regex: '(?i)lib[/\\]tina4([/\\]|$)'
- id: tina4-entrypoint-require
  desc: Tina4Ruby gem alias require entrypoint
  for:
  - ruby
  if:
    type: text
    regex: require_relative\s+["']tina4["']
- id: tina4-cli-require
  desc: Tina4Ruby CLI module require
  for:
  - ruby
  if:
    type: text
    regex: require_relative\s+["'](\.\./)*lib/tina4/cli["']
- id: tina4-cli-bin-path
  desc: Tina4Ruby CLI executable basename
  crit: notable
  for:
  - ruby
  - text
  if:
    type: basename
    exact: tina4ruby
- id: tina4ruby-rb-path
  desc: Tina4Ruby alias entrypoint filename
  for:
  - ruby
  if:
    type: basename
    exact: tina4ruby.rb
- id: tina4-dev-admin-require
  desc: Tina4 dev admin require
  for:
  - ruby
  if:
    type: text
    regex: require_relative\s+["']tina4/dev_admin["']
- id: tina4-request-inspector-class
  desc: Tina4 request inspector class
  for:
  - ruby
  if:
    type: text
    regex: class\s+RequestInspector\b
- id: tina4-dev-api-mcp-path
  desc: Tina4 dev MCP API path
  for:
  - ruby
  if:
    type: text
    substr: "/__dev/api/mcp"
- id: tina4-dev-api-prefix
  desc: Tina4 local development API prefix
  for:
  - javascript
  - ruby
  if:
    type: text
    substr: "/__dev/api"
- id: dev-admin-js
  desc: Tina4 dev admin JS bundle
  for:
  - javascript
  size_min: 8192
  if:
    type: text
    substr: "/__dev/api/mcp/tools"
- id: dev-admin-js-path
  desc: Tina4 dev admin JavaScript bundle path
  crit: notable
  for:
  - javascript
  if:
    type: basename
    regex: '^tina4-dev-admin(\.min)?\.js$'
- id: frond-js
  desc: Tina4 Frond client bundle
  for:
  - javascript
  size_min: 8192
  if:
    type: text
    regex: window\.frond\s*=\s*(R|frond)
- id: tina4-window-client
  desc: Tina4 browser client window.tina4 binding
  for:
  - javascript
  if:
    type: text
    regex: window\.tina4\s*=
composite_rules:
- id: tina4ruby-gem
  desc: Tina4Ruby web framework Ruby gem package
  crit: notable
  conf: 0.97
  scope: outer
  for:
  - gem
  any:
  - id: gem-package-name
  - id: tina4-module-declaration
- id: framework-core
  desc: Tina4Ruby framework core
  crit: notable
  conf: 0.96
  for:
  - ruby
  near_bytes: 4096
  all:
  - id: tina4-module-declaration
  - id: tina4-dev-admin-require
- id: framework-lib-module
  desc: Tina4Ruby library file with module declaration
  crit: notable
  conf: 0.96
  for:
  - ruby
  all:
  - id: tina4-lib-path
  - id: tina4-module-declaration
- id: framework-lib-namespace
  desc: Tina4Ruby library file with namespaced API
  crit: notable
  conf: 0.96
  for:
  - ruby
  all:
  - id: tina4-lib-path
  - id: tina4-namespace-const
- id: framework-alias-entrypoint
  desc: Tina4Ruby gem alias Ruby entrypoint
  crit: notable
  conf: 0.96
  for:
  - ruby
  all:
  - id: tina4-entrypoint-require
  - id: tina4ruby-rb-path
- id: framework-cli
  desc: Tina4Ruby CLI executable
  crit: notable
  conf: 0.96
  for:
  - ruby
  all:
  - id: tina4-cli-require
  - id: tina4-cli-bin-path
- id: dev-admin-ruby
  desc: Tina4 dev admin Ruby module
  crit: notable
  conf: 0.96
  for:
  - ruby
  near_bytes: 40000
  all:
  - id: tina4-module-declaration
  - id: tina4-request-inspector-class
  - id: tina4-dev-api-mcp-path
- id: dev-admin-js-bundle
  desc: Tina4 dev admin JavaScript bundle
  crit: notable
  conf: 0.97
  for:
  - javascript
  all:
  - id: dev-admin-js
  - id: metadata/library/structure::js-any-bundle-output
- id: browser-client
  desc: Tina4Ruby browser client bundle
  crit: notable
  conf: 0.96
  for:
  - javascript
  any:
  - id: tina4-window-client
  - id: tina4-js-client
- id: browser-dev-admin
  desc: Tina4Ruby browser dev-admin client
  crit: notable
  conf: 0.96
  for:
  - javascript
  all:
  - id: tina4-lib-path
  - id: tina4-dev-api-prefix
  - id: dev-admin-js-path
