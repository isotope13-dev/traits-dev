# i18next — JavaScript internationalization framework.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: i18next npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: i18next

  - id: vendored-path
    desc: vendored i18next package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/i18next/'


composite_rules:
  - id: i18next-library
    desc: i18next internationalization library
    any:
      - id: package-name
      - id: vendored-path
