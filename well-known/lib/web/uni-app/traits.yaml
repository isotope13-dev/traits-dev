# DCloud uni-app — cross-platform application framework (H5, mini-programs, app).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: uni-h5-package-name
    desc: "@dcloudio/uni-h5 npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@dcloudio/uni-h5"

  - id: uni-h5-archive-name
    desc: "@dcloudio/uni-h5 npm archive identity"
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: "@dcloudio/uni-h5"

  - id: uni-app-manifest-name
    desc: uni-app manifest name in package.json
    for: [package.json]
    if:
      type: value
      path: uni-app.name
      exists: true

  - id: dcloudio-uni-app-repo
    desc: dcloudio uni-app GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/dcloudio/uni-app'

composite_rules:
  - id: dcloudio-uni-h5-package
    desc: DCloud uni-app H5 framework package
    crit: notable
    conf: 0.99
    all:
      - id: uni-h5-package-name
    any:
      - id: uni-app-manifest-name
      - id: dcloudio-uni-app-repo
