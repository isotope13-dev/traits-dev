# The Swagger UI dist bundle. It is vendored verbatim by anything that serves an
# OpenAPI explorer, and it is an API-documentation tool, so its own vocabulary is
# HTTP: it carries "POST", "application/octet-stream" and integer tables from its
# bundled dependencies. Minified to ~1.5 MB on two lines, that trio lands inside
# any byte-proximity window, which made
# objectives/command-and-control/infrastructure/config::exported-opaque-endpoint-beacon-config
# score grocy's image hostile. `swagger-core` next door is the Java library, not
# this, and matches `io/swagger/` class paths only.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, data]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 20971520

traits:
  - id: swagger-ui-bundle-global
    desc: Swagger UI dist bundle global
    if:
      type: text
      substr: SwaggerUIBundle
