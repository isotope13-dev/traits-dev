# Redux — official reduxjs predictable state container. Vendored Yarn
# berry (yarn-*.cjs) is the package-manager runtime, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: package-name
    desc: redux npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: redux

  - id: github-repo
    desc: reduxjs/redux GitHub repository
    for: [package.json, json, markdown]
    if:
      type: text
      substr: github.com/reduxjs/redux

  - id: github-shorthand
    desc: reduxjs/redux GitHub shorthand repo
    for: [package.json]
    if:
      type: text
      substr: github:reduxjs/redux

  - id: homepage
    desc: Redux project homepage
    for: [package.json, markdown]
    if:
      type: text
      substr: redux.js.org

composite_rules:
  - id: redux-library
    desc: Official reduxjs Redux library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: package-name
      - id: github-repo
      - id: github-shorthand
      - id: homepage
