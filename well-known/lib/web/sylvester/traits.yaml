# Sylvester (James Coglan) — vector and matrix mathematics library. The
# stock sylvester.js distribution ships only as Dean Edwards packer
# output; the packer word dictionary keeps the library's distinctive
# Vector/Matrix/Plane/Line vocabulary at both ends of the word list.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: sylvester-packed-dictionary-head
    desc: Sylvester packer dictionary head fragment
    conf: 0.98
    if:
      type: text
      substr: 'kj|Plane|ni|abs|Line|ki|precision|Sylvester|A2|push|A3|map|els'
  - id: sylvester-packed-dictionary-tail
    desc: Sylvester packer dictionary tail fragment
    conf: 0.98
    if:
      type: text
      substr: 'rk|tr|det|toDiagonalMatrix|toUpperTriangular|version|XZ'

composite_rules:
  - id: packed-sylvester-library
    desc: Stock packed Sylvester library distribution
    crit: exception
    conf: 0.99
    all:
      - id: sylvester-packed-dictionary-head
      - id: sylvester-packed-dictionary-tail
