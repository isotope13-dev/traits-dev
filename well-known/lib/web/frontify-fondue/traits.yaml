# @frontify/fondue* — Frontify design-system components monorepo.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: frontify-fondue-scoped-package-name
    desc: Frontify fondue scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@frontify/fondue'

  - id: frontify-fondue-scoped-npm-name
    desc: Frontify fondue scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@frontify/fondue'

  - id: frontify-fondue-repository
    desc: Frontify fondue monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/frontify/fondue'

  - id: frontify-fondue-repository-npm
    desc: Frontify fondue npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/frontify/fondue'

composite_rules:
  - id: frontify-fondue-upstream
    desc: Frontify fondue monorepo repository claim
    crit: notable
    any:
      - id: frontify-fondue-repository
      - id: frontify-fondue-repository-npm

  - id: package-identity
    desc: Frontify fondue design-system npm package
    crit: notable
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: frontify-fondue-upstream
    any:
      - id: frontify-fondue-scoped-package-name
      - id: frontify-fondue-scoped-npm-name
