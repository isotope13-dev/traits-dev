# Angular framework packages (@angular/compiler, etc.).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: angular-compiler-package-name
    desc: "@angular/compiler npm package name"
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: "@angular/compiler"

  - id: angular-compiler-jit-evaluator
    desc: Angular JIT evaluator Trusted Types adapter
    for: [javascript, typescript]
    if:
      type: text
      substr: class JitEvaluator

composite_rules:
  - id: angular-compiler-package-context
    desc: Angular compiler npm package context
    crit: exception
    conf: 0.99
    any:
      - id: angular-compiler-package-name
      - id: angular-compiler-jit-evaluator
