# Django web framework — published wheel and in-tree module layout.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: pkginfo-name-django
    desc: PyPI distribution name Django
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: Django

  - id: django-contrib-module-path
    desc: Django contrib package module path
    if:
      type: path
      regex: django/contrib/

  - id: django-core-module-path
    desc: Django core package module path
    if:
      type: path
      regex: django/core/

  - id: django-database-flush-warning
    desc: Django flush command data destruction warning
    if:
      type: text
      substr: IRREVERSIBLY DESTROY all data currently

composite_rules:
  - id: django-web-framework-package
    desc: Recognized Django framework package context
    any:
      - id: pkginfo-name-django
      - id: django-contrib-module-path
      - id: django-core-module-path
