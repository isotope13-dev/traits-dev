defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: hotwired-turbo-marker
    desc: Imports the Hotwired Turbo package
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '^@hotwired/turbo(/|$)'

  # Parsed Next/Nuxt imports already emit metadata/import/npm findings.
  # Source text resembling an import does not establish framework identity.
