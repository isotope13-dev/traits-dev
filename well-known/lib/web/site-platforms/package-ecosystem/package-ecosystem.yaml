defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: hotwired-turbo-marker
    desc: Imports the Hotwired Turbo package
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '^@hotwired/turbo(/|$)'

  - id: uses-web-framework-b
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Code uses established web framework
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (require\(['"]|from ['"])(next|nuxt)['"]
