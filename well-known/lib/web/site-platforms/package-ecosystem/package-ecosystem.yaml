defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: hotwired-turbo-marker
    desc: Imports the Hotwired Turbo package
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '^@hotwired/turbo(/|$)'

  - id: has-routes-app-a
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Code defines HTTP routes
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: app\.(get|post|put|delete)\s*\(['"]/
  - id: has-routes-app-patch
    desc: Code defines HTTP routes
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: app\.patch\s*\(['"]/
  - id: has-routes-router-a
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Code defines HTTP routes
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: router\.(get|post|put|delete)\s*\(['"]/
  - id: has-routes-router-patch
    desc: Code defines HTTP routes
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: router\.patch\s*\(['"]/
  - id: uses-web-framework-b
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Code uses established web framework
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (require\(['"]|from ['"])(next|nuxt)['"]
composite_rules:
  - id: has-routes
    desc: Code defines HTTP routes
    crit: notable
    conf: 0.8
    any:
      - id: has-routes-app-a
      - id: has-routes-app-patch
      - id: has-routes-router-a
      - id: has-routes-router-patch
