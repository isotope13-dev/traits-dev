# jupyter_server — Tornado backend that serves Jupyter web apps (notebook,
# lab, kernels, contents). Official Jupyter Development Team distribution.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 268435456

traits:
  - id: wheel-distribution
    desc: jupyter_server Python wheel distribution
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: jupyter_server

  - id: package-path
    desc: jupyter_server package path
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])jupyter_server[\\/]'

  - id: serverapp-class
    desc: Jupyter ServerApp application class
    for: [python]
    conf: 0.98
    if:
      type: text
      substr: 'class ServerApp(JupyterApp):'

  - id: console-entrypoint
    desc: jupyter-server console entrypoint
    for: [text]
    conf: 0.97
    if:
      type: text
      regex: '(?m)^jupyter-server\s*=\s*jupyter_server\.serverapp:main\s*$'
