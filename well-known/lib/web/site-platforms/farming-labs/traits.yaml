# Farming Labs Docs framework
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: farming-labs-docs-package-name
    desc: Farming Labs docs package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@farming-labs/docs"

  - id: farming-labs-docs-telemetry-endpoint
    desc: Farming Labs docs telemetry endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: "https://docs.farming-labs.dev/api/telemetry/events"

  - id: farming-labs-docs-package-name-string
    desc: Farming Labs docs package name string
    for: [javascript, typescript]
    if:
      type: text
      substr: "@farming-labs/docs"

composite_rules:
  - id: farming-labs-docs-telemetry-context
    desc: Farming Labs docs telemetry context
    crit: exception
    conf: 0.96
    any:
      - id: farming-labs-docs-telemetry-endpoint
      - id: farming-labs-docs-package-name
      - id: farming-labs-docs-package-name-string
