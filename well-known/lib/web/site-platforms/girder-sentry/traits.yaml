# girder-sentry — Kitware Girder plugin that reports issues to Sentry.
# sentry_sdk.init and the bundled UMD client are product telemetry, not a
# dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: girder-sentry PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: girder_sentry

  - id: package-metadata-name
    desc: girder-sentry PyPI Name field
    for: [pkginfo]
    if:
      type: text
      regex: '^Name:\s*girder-sentry\s*$'

  - id: package-init-path
    desc: girder_sentry package init module path
    for: [python, whl]
    if:
      type: path
      regex: 'girder_sentry[\\/]__init__\.py'

  - id: plugin-entry
    desc: Girder sentry plugin entry point
    for: [text, python]
    if:
      type: text
      substr: 'girder_sentry:SentryPlugin'

  - id: frontend-dsn-key
    desc: Girder sentry frontend DSN setting
    for: [python]
    if:
      type: text
      substr: sentry.frontend_dsn

composite_rules:
  - id: girder-sentry-package
    desc: Kitware Girder Sentry plugin
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: package-init-path
      - id: plugin-entry
      - id: frontend-dsn-key
    needs: 2
