# Crawl4AI is a browser-crawling and automation library. Its request
# capture, browser instrumentation, and webdriver handling are expected in
# this package and should not be promoted to supply-chain or anti-bot
# malware findings merely because the code is bundled in a wheel.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: package-metadata-name
    desc: Crawl4AI package metadata name
    for: [pkginfo]
    if:
      type: text
      regex: '(?mi)^Name:\s*crawl4ai\s*$'

  - id: package-path
    desc: Crawl4AI wheel or source package path
    for: [python, whl, javascript, typescript]
    if:
      type: path
      regex: '(?i)(^|[\\/])crawl4ai(-[0-9]|[\\/])'

composite_rules:
  - id: crawl4ai-package-context
    desc: Recognized Crawl4AI browser-crawling package
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: package-metadata-name
      - id: package-path
