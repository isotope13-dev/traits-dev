# Official @wix/* packages published from Wix's internal npm pipeline.
# Manifests often omit `author` while carrying `wix.artifact` Maven coordinates.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: Wix scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@wix/[a-z0-9][a-z0-9._-]{0,120}$'

  - id: scoped-npm-package-name
    desc: Wix scoped npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@wix/[a-z0-9][a-z0-9._-]{0,120}$'

  - id: wixpress-artifact-group
    desc: Wixpress Maven artifact groupId
    for: [package.json]
    if:
      type: value
      path: wix.artifact.groupId
      regex: '^com\.wixpress\.'

  - id: wixpress-npm-artifact-group
    desc: Wixpress artifact group on npm archive
    for: [npm]
    if:
      type: value
      path: npm.wix.artifact.groupId
      regex: '^com\.wixpress\.'

composite_rules:
  - id: manifest-package-identity
    desc: Wix scoped manifest with Wixpress artifact metadata
    crit: notable
    conf: 0.99
    all:
      - id: scoped-package-name
      - id: wixpress-artifact-group

  - id: npm-archive-package-identity
    desc: Wix scoped npm archive with Wixpress artifact metadata
    crit: notable
    conf: 0.99
    all:
      - id: scoped-npm-package-name
      - id: wixpress-npm-artifact-group

  - id: package-identity
    desc: Official Wix scoped package with Wixpress artifact metadata
    crit: notable
    conf: 0.99
    any:
      - id: manifest-package-identity
      - id: npm-archive-package-identity
