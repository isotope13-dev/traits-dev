defaults:
  platforms: [unix, windows]
  for: [html, javascript]

traits:
  - id: squarespace-static-context-global
    desc: Assigns the Squarespace static context global
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        (assignment_expression
          left: (member_expression
            object: (identifier) @owner
            property: (property_identifier) @property)
          (#eq? @owner "Static")
          (#eq? @property "SQUARESPACE_CONTEXT")) @assignment
