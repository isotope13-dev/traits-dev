# Plasmic visual builder and loader framework.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: plasmic-monorepo-name
    desc: Plasmic monorepo manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: plasmic-monorepo

  - id: plasmic-loader-hydrate-script
    desc: Plasmic loader hydrate script reference
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: text
      substr: "loader-hydrate.js"

  - id: plasmic-package-scope
    desc: Plasmic package scope reference
    conf: 0.95
    if:
      type: text
      substr: "@plasmicapp/"

composite_rules:
  - id: plasmic-bundle-renderer-context
    desc: Plasmic server-side render or bundle generation context
    crit: exception
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: plasmic-loader-hydrate-script
    any:
      - id: plasmic-package-scope
      - id: micro-behaviors/process/hook/console/assignment::console-log-noop
