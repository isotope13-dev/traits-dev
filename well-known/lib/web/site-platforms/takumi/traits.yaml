# Takumi packages published under the @takumi-rs/ scope.
# The takumi project splits framework libraries (@takumi-rs/image-response,
# @takumi-rs/core, ...) out of its single kane50613/takumi monorepo
# repository. Individual @takumi-rs/* packages therefore do not share the
# repository basename, and the engine's folded-slug comparison reads every one
# of them as a clone-and-rename shape. Pair the official scope with the
# canonical repository so a differently named package that merely points at the
# takumi repository (or a @takumi-rs/ package pointing elsewhere) still lacks
# this exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Takumi scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@takumi-rs/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Takumi scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@takumi-rs/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Takumi GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/kane50613/takumi(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Takumi GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/kane50613/takumi(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Takumi GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/kane50613/takumi(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Takumi package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Takumi repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Takumi package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
