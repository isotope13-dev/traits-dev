# Zhihu's web API requires x-zse-93 / x-zse-96 request signatures computed by
# a bytecode-VM script (XOR tables, eval of decoded operands). Feed readers
# and scrapers lift that signer verbatim and attach both headers to their
# Zhihu API calls; the VM is the site's own anti-bot code, not a payload.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: zse-signed-request-headers
    desc: Zhihu x-zse-96 and x-zse-93 request headers
    if:
      type: text
      regex: '"x-zse-96"\s*:\s*[\w.$]{1,40}\s*,\s*"x-zse-93"'
