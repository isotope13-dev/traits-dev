# malsup jquery-form — AJAX form submit plugin (ajaxSubmit / jqFormIO).
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: log-prefix
    desc: jQuery Form plugin log prefix
    if:
      type: text
      substr: '[jquery.form]'

  - id: iframe-name
    desc: jQuery Form iframe name prefix
    if:
      type: text
      substr: jqFormIO

  - id: vendored-path
    desc: jQuery Form script path
    if:
      type: path
      regex: '(?i)jquery\.form'
