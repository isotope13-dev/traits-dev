# @adobe/css-tools — CSS parser/stringifier (formerly css).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: adobe-css-tools-package-name
    desc: '@adobe/css-tools npm package name'
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@adobe/css-tools'

  - id: adobe-css-tools-github-repo
    desc: Adobe css-tools GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/adobe/css-tools'

  - id: adobe-css-tools-dist-basename
    desc: Adobe css-tools distribution basename
    conf: 0.96
    for: [javascript]
    if:
      type: path
      regex: '(?i)adobe-css-tools\.(cjs|mjs|js)$'
