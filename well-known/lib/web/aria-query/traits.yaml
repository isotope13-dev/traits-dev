# aria-query — ARIA role and element mapping tables (A11yProject).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: aria-query-package-name
    desc: aria-query npm package name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: aria-query

  - id: aria-query-github-repo
    desc: aria-query GitHub repository URL
    conf: 0.98
    if:
      type: text
      regex: '(?i)github\.com/A11yProject/aria-query'
