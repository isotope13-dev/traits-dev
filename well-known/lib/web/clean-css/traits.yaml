# clean-css — CSS minifier.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: clean-css npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: clean-css

  - id: vendored-path
    desc: vendored clean-css package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/clean-css/'
