# Pallets Flask — published wheel and source layouts.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: pkginfo-name-flask
    desc: PyPI distribution name Flask
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: Flask

  - id: pkginfo-flask-framework-classifier
    desc: "PKG-INFO declares Framework :: Flask"
    for: [pkginfo]
    if:
      type: text
      substr: 'Framework :: Flask'

  - id: flask-cli-module-path
    desc: Flask Click CLI module path
    for: [python]
    if:
      type: path
      regex: 'flask[\\/]cli\.py'

  - id: flask-json-init-module-path
    desc: Flask jsonify module path
    for: [python]
    if:
      type: path
      regex: 'flask[\\/]json'
