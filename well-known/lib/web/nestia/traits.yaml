# Nestia packages published under the @nestia/ scope.
# The nestia project splits framework libraries (@nestia/core,
# @nestia/sdk, @nestia/e2e, @nestia/fetcher, ...) out of its single
# samchon/nestia monorepo repository. Individual @nestia/* packages
# therefore do not share the repository basename, and the engine's folded-slug
# comparison reads every one of them as a clone-and-rename shape. The npm scope
# matching the repository owner is the identity consistency the slug check
# cannot express, so pair the two here: a differently named package that merely
# points at the nestia repository (or a @nestia/ package pointing
# elsewhere) still lacks this exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Nestia scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@nestia/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Nestia scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@nestia/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Nestia GitHub repository URL string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/samchon/nestia(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Nestia GitHub repository object URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/samchon/nestia(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Nestia GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/samchon/nestia(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Nestia package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Nestia repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Nestia package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
