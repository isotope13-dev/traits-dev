# @operato/* web components from the hatiolab/operato monorepo (open-wc / Lit).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip]
  crit: notable
  conf: 0.99

traits:
  - id: operato-scoped-package-name
    desc: Operato scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@operato/'

  - id: operato-monorepo-repository
    desc: Operato monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/(hatiolab/operato|things-scene/operato-scene)(\.git)?'

composite_rules:
  - id: operato-package-context
    desc: Operato monorepo web component package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: operato-scoped-package-name
      - id: operato-monorepo-repository
