# Intlayer packages published under the @intlayer/ scope.
# Intlayer ships its internationalization toolkit packages from the
# github.com/aymericzip/intlayer monorepo, so the package scope matches
# the repository project name while the repository owner is aymericzip.
# The folded-slug comparison reads each package as a clone-and-rename.
# Pair the @intlayer/ scope with the official aymericzip/intlayer repository.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    for: [package.json]
    desc: Intlayer scoped package identity
    if:
      type: value
      path: name
      regex: '^@intlayer/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Intlayer scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@intlayer/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    for: [package.json]
    desc: Intlayer GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https?://github\.com/aymericzip/intlayer(\.git)?(/.*)?$'

  - id: github-repository-url
    for: [package.json]
    desc: Intlayer GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https?://github\.com/aymericzip/intlayer(\.git)?(/.*)?$'

  - id: github-npm-repository
    desc: Intlayer GitHub npm archive repository string
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '^(git\+)?https?://github\.com/aymericzip/intlayer(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Intlayer GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https?://github\.com/aymericzip/intlayer(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Intlayer package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Intlayer repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Intlayer package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
