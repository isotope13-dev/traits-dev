# Zova publishes suite packages whose tarball is only a manifest:
# `files: []` plus runtime dependencies on the real modules.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: zova-suite-package-name
    desc: Zova suite or module package
    if:
      type: value
      path: name
      regex: '^zova-(suite|module)-[a-z0-9][a-z0-9.-]{0,60}$'
  - id: zova-module-runtime-dependency
    desc: Runtime dependency on a Zova module package
    if:
      type: value
      path: dependencies
      regex: '"zova-module-[a-z0-9][a-z0-9.-]{0,60}"\s*:'

composite_rules:
  # A genuine Zova suite metapackage: the suite name plus runtime
  # dependencies on the framework's own module packages. The name alone
  # proves nothing (a squatted name costs nothing); a suite that actually
  # installs the Zova modules is the documented distribution mechanism,
  # not a placeholder.
  - id: zova-suite-metapackage-context
    desc: Zova suite metapackage installs Zova modules
    crit: exception
    conf: 0.97
    all:
      - id: zova-suite-package-name
      - id: zova-module-runtime-dependency
