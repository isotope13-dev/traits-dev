defaults:
  platforms: [unix, windows]
  for: [python]
  crit: baseline
  conf: 0.96
  size_max: 1048576

traits:
  - id: package-source
    desc: Jinja2 template engine source
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])jinja2[\\/]'

  - id: immutable-sandbox-import
    desc: Jinja2 immutable sandbox environment import
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: ImmutableSandboxedEnvironment
