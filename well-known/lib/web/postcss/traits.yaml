# postcss — CSS transform framework.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: postcss npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: postcss

  - id: vendored-path
    desc: vendored postcss package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/postcss/'
