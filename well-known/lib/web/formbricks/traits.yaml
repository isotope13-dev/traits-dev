# Formbricks packages published under the @formbricks/ scope.
# Formbricks ships its browser SDK as @formbricks/js from the
# github.com/formbricks organization (repository formbricks/js), so the
# package scope matches the repository owner while the basenames agree only
# after the scope is dropped — a shape the engine's folded-slug comparison
# reads as a clone-and-rename. The npm scope matching the repository owner is
# the identity consistency the slug check cannot express, so pair the two
# here: a differently named package that merely points at a formbricks
# repository (or a @formbricks/ package pointing elsewhere) still lacks this
# exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Formbricks scoped package identity
    if:
      type: value
      path: name
      regex: '^@formbricks/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Formbricks scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@formbricks/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Formbricks GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/formbricks/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Formbricks GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/formbricks/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Formbricks GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/formbricks/[a-z0-9._-]+(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Formbricks package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Formbricks organization repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Formbricks package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
