# decode-uri-component — stricter decodeURIComponent.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: decode-uri-component npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: decode-uri-component

  - id: vendored-path
    desc: vendored decode-uri-component path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/decode-uri-component/'
