# @feng3d/* — feng3d WebGL engine support libraries (feng3d.com). Polyfill ships
# browser Blob/canvas/atob helpers; reactivity is a Vue-compatible reactive core.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.95

traits:
  - id: feng3d-npm-package-name
    desc: feng3d scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@feng3d/'
  - id: feng3d-npm-archive-name
    desc: feng3d scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@feng3d/'
  - id: feng3d-gitee-repository
    desc: feng3d Gitee repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: gitee.com/feng3d/
  - id: feng3d-homepage
    desc: feng3d project homepage URL
    for: [package.json]
    if:
      type: value
      path: homepage
      substr: feng3d.com
  - id: effect-reactivity-class
    desc: feng3d EffectReactivity class name
    for: [javascript, typescript]
    if:
      type: symbol
      exact: EffectReactivity
  - id: computed-reactivity-class
    desc: feng3d ComputedReactivity class name
    for: [javascript, typescript]
    if:
      type: symbol
      exact: ComputedReactivity

composite_rules:
  - id: feng3d-library
    desc: feng3d engine support library
    conf: 0.98
    any:
      - id: feng3d-npm-package-name
      - id: feng3d-npm-archive-name
      - id: effect-reactivity-class
      - id: computed-reactivity-class
