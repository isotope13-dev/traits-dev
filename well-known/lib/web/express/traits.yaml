# expressjs/express — Node HTTP application framework.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: express npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: express

  - id: vendored-path
    desc: vendored express package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/express/'

  - id: express-session-package-name
    desc: express-session npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: express-session

  - id: express-session-path
    desc: vendored express-session package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/express-session/'

  - id: finalhandler-package-name
    desc: finalhandler npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: finalhandler

  - id: finalhandler-path
    desc: vendored finalhandler package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/finalhandler/'

  - id: body-parser-package-name
    desc: body-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: body-parser

  - id: body-parser-path
    desc: vendored body-parser package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/body-parser/'

composite_rules:
  - id: express-library
    desc: Express HTTP application framework
    any:
      - id: package-name
      - id: vendored-path

  - id: express-session-library
    desc: express-session middleware
    any:
      - id: express-session-package-name
      - id: express-session-path

  - id: finalhandler-library
    desc: finalhandler HTTP error handler
    any:
      - id: finalhandler-package-name
      - id: finalhandler-path

  - id: body-parser-library
    desc: body-parser HTTP body parser
    any:
      - id: body-parser-package-name
      - id: body-parser-path

