# clj-http — Clojure HTTP client wrapping Apache HttpComponents
# (dakrone/clj-http; this Clojars fork is wkf/clj-http). Optional-codec
# ns-resolve and read-string are library features, not a loader.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: clj-http Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: clj-http

  - id: github-repo
    desc: mojotech clj-http GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/mojotech/clj-http

  - id: namespace-path
    desc: clj-http Clojure namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)clj_http/'
