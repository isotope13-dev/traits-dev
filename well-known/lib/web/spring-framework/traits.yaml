# Spring Framework — Apache-2.0 enterprise Java framework (spring.io).
# Official source trees are Gradle multi-module projects under
# org.springframework.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, archives]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 50000000

traits:
  - id: package-org-springframework
    desc: org.springframework Java package
    for: [java, kotlin]
    if:
      type: text
      regex: '^package org\.springframework(\.|$)'

  - id: spring-this-class
    desc: Spring Framework class this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^org/springframework/'

  - id: spring-package-path
    desc: Spring Framework package path fragment
    for: [class, java_class, jar, zip]
    conf: 0.96
    if:
      type: path
      regex: 'org/springframework/'

  - id: gradle-group
    desc: Spring Framework Gradle group
    for: [groovy]
    if:
      type: text
      regex: 'group\s*=\s*["'']org\.springframework["'']'

  - id: project-description
    desc: Spring Framework project description
    for: [groovy]
    if:
      type: text
      substr: 'description = "Spring Framework"'

  - id: apache-copyright-header
    desc: Spring Framework Apache copyright header
    for: [java, kotlin]
    if:
      type: text
      substr: 'Copyright 2002-present the original author or authors.'

composite_rules:
  - id: spring-framework-gradle-identity
    desc: Official Spring Framework Gradle project
    crit: notable
    conf: 0.99
    for: [groovy]
    all:
      - id: gradle-group
      - id: project-description

  - id: spring-framework-source-context
    desc: Official Spring Framework source context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: gradle-group
      - id: project-description
      - id: apache-copyright-header
