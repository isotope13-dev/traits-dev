# Jakarta RESTful Web Services (JAX-RS) API — jakarta.ws.rs.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: jakarta-rs-this-class
    desc: Jakarta RS class this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^jakarta/ws/rs/'

  - id: jakarta-rs-package-path
    desc: Jakarta RS package path fragment
    conf: 0.96
    if:
      type: path
      regex: '(?i)jakarta/ws/rs'

  - id: jakarta-rs-class-string
    desc: Jakarta RS package string in class pool
    conf: 0.95
    if:
      type: text
      substr: jakarta/ws/rs/
