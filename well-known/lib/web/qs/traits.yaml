# ljharb/qs — query-string parser with nesting and a depth limit.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: qs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: qs

  - id: github-repository
    desc: qs GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/ljharb/qs

  - id: vendored-path
    desc: vendored qs package path
    for: [scripts, manifests, data, source, markdown, javascript]
    if:
      type: path
      regex: 'node_modules/qs/'

  - id: charset-sentinel-const
    desc: qs charset sentinel constant
    for: [javascript]
    if:
      type: text
      substr: 'charsetSentinel="utf8=%E2%9C%93"'

  - id: cyclic-object-range-error
    desc: qs cyclic object stringify error
    for: [javascript]
    if:
      type: text
      substr: 'Cyclic object value'

composite_rules:
  - id: qs-library
    desc: ljharb qs query-string parser
    any:
      - id: package-name
      - id: github-repository
      - id: vendored-path
      - id: charset-sentinel-const
      - id: cyclic-object-range-error
