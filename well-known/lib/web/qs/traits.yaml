# ljharb/qs — query-string parser with nesting and a depth limit.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: qs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: qs

  - id: github-repository
    desc: qs GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/ljharb/qs

  - id: vendored-path
    desc: vendored qs package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/qs/'

composite_rules:
  - id: qs-library
    desc: ljharb qs query-string parser
    any:
      - id: package-name
      - id: github-repository
      - id: vendored-path
