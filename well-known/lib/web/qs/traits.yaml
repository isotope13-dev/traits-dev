# ljharb/qs — query-string parser with nesting and a depth limit.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: qs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: qs

  - id: github-repository
    desc: qs GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/ljharb/qs

  - id: vendored-path
    desc: vendored qs package path
    for: [scripts, manifests, data, source, markdown, javascript]
    if:
      type: path
      regex: 'node_modules/qs/'

  - id: charset-sentinel-const
    desc: qs charset sentinel constant
    for: [javascript]
    if:
      type: text
      substr: 'charsetSentinel="utf8=%E2%9C%93"'

  - id: utf8-sentinel-decoded
    desc: qs UTF-8 checkmark charset sentinel
    for: [javascript, text]
    if:
      type: text
      substr: "charsetSentinel=\"utf8=\u2713\""

  - id: iso-sentinel-decoded
    desc: qs ISO sentinel HTML entity form
    for: [javascript, text]
    if:
      type: text
      substr: 'utf8=&#10003;'

  - id: cyclic-object-range-error
    desc: qs cyclic object stringify error
    for: [javascript]
    if:
      type: text
      substr: 'Cyclic object value'

  - id: hextable-percent-encode
    desc: qs percent-encode hex lookup table
    for: [javascript, text]
    if:
      type: text
      substr: 'e.push("%"+((r<16?"0":"")+r.toString(16)).toUpperCase())'

  - id: url-layer-path
    desc: qs bundle URL-decode layer path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'qs\.js##url@'

composite_rules:
  - id: qs-library
    desc: ljharb qs query-string parser
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: github-repository
      - id: charset-sentinel-const
      - id: utf8-sentinel-decoded
      - id: iso-sentinel-decoded
      - id: cyclic-object-range-error
      - id: hextable-percent-encode
      - id: url-layer-path
