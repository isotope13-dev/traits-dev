# React DnD helper packages published under the @react-dnd/ scope.
# The react-dnd project splits drag-and-drop support libraries (@react-dnd/asap,
# @react-dnd/invariant, @react-dnd/shallow-equal, ...) out of its single
# react-dnd/react-dnd monorepo repository. Individual @react-dnd/* packages
# therefore do not share the repository basename, and the engine's folded-slug
# comparison reads every one of them as a clone-and-rename shape. The npm scope
# matching the repository owner is the identity consistency the slug check
# cannot express, so pair the two here: a differently named package that merely
# points at the react-dnd repository (or a @react-dnd/ package pointing
# elsewhere) still lacks this exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: React DnD scoped package identity
    if:
      type: value
      path: name
      regex: '^@react-dnd/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: React DnD scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@react-dnd/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: React DnD GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/react-dnd/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: React DnD GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/react-dnd/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: React DnD GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/react-dnd/[a-z0-9._-]+(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official React DnD package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official React DnD organization repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official React DnD package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
