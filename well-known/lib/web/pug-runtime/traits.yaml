# pug-runtime — Pug template runtime helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: pug-runtime npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pug-runtime

  - id: vendored-path
    desc: vendored pug-runtime package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/pug-runtime/'
