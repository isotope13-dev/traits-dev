# whatwg-url — standard WHATWG URL parser bundled in many Node packages.
# Its url-state-machine uses "hostname" and URL.prototype defines "username"
# as property names, which otherwise resemble obfuscated host-profile DNS terms.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: bundled-path-marker
    desc: Bundled whatwg-url library path marker
    if:
      type: text
      substr: whatwg-url/lib/url-state-machine

  - id: basic-url-parse-api
    desc: whatwg-url basicURLParse API marker
    if:
      type: text
      substr: basicURLParse

composite_rules:
  - id: whatwg-url-parser-context
    desc: Bundled WHATWG URL parser library context
    crit: exception
    conf: 0.99
    any:
      - id: bundled-path-marker
      - id: basic-url-parse-api
