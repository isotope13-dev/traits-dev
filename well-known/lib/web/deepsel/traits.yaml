# Deepsel — FastAPI/SQLAlchemy CMS (github.com/DeepselSystems/deepsel).
# Pytest fixtures include classic Jinja SSTI strings to prove the sandbox
# blocks them; those are regression tests, not template injection implants.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: deepsel PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: deepsel

  - id: wheel-distribution
    desc: deepsel wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: deepsel

  - id: github-repo
    desc: DeepselSystems/deepsel GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/DeepselSystems/deepsel
