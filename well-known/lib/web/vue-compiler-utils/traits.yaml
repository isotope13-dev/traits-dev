# @vue/component-compiler-utils — Vue SFC template/style compiler helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: template-es2015-compiler
    desc: Vue template ES2015 compiler require
    for: [javascript]
    if:
      type: text
      substr: "require('vue-template-es2015-compiler')"

  - id: package-name
    desc: Vue component-compiler-utils package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@vue/component-compiler-utils'

  - id: vendored-path
    desc: Vue component-compiler-utils package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@vue/component-compiler-utils'

composite_rules:
  - id: vue-component-compiler-utils
    desc: Vue SFC component-compiler-utils library
    any:
      - id: template-es2015-compiler
      - id: package-name
      - id: vendored-path
