defaults:
  platforms: [unix, windows]
  for: [javascript, php]
  size_max: 300000000

traits:
  - id: browser-password-blocklist
    desc: Jelix browser password-strength blocklist
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: JelixPasswordEditorPasswords
  - id: server-password-blocklist
    desc: Jelix server password-strength blocklist
    crit: notable
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: jAuthMostUsedPasswords.php
