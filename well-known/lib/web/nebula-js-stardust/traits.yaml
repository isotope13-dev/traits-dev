# Official Qlik Nebula.js Stardust package/library identity.  This is an
# identity marker only; the package's network and browser capabilities remain
# visible through neutral behavior traits.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Nebula.js Stardust npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@nebula.js/stardust'

  - id: archive-package-name
    desc: Nebula.js Stardust archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@nebula.js/stardust'

  - id: package-member-context
    desc: Nebula.js Stardust package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@nebula.js/stardust'

  - id: upstream-repository
    desc: Nebula.js upstream repository
    if:
      type: text
      substr: github.com/qlik-oss/nebula.js

composite_rules:
  - id: nebula-js-stardust-library-context
    desc: Nebula.js Stardust library context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: upstream-repository
