# mixmark-io/domino — server-side DOM based on Mozilla's dom.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: '@mixmark-io/domino package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@mixmark-io/domino'

  - id: vendored-path
    desc: vendored mixmark-io/domino package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@mixmark-io/domino/'

  - id: frozen-api-flag
    desc: Domino frozen-API global flag
    if:
      type: text
      substr: __domino_frozen__

  - id: url-userinfo-pattern
    desc: Domino URL userinfo parse pattern
    if:
      type: text
      substr: URL.userinfoPattern

  - id: w3c-dom-test-suite
    desc: W3C DOM Test Suite case URI
    if:
      type: text
      substr: www.w3.org/2001/DOM-Test-Suite/

  - id: angular-style-parser-copy
    desc: Angular style_parser.ts vendored copy
    if:
      type: text
      substr: render3/view/style_parser.ts

  - id: htmlparser-require
    desc: Domino HTMLParser module require
    if:
      type: text
      substr: "require('./HTMLParser')"

composite_rules:
  - id: mixmark-domino-library
    desc: mixmark-io/domino server-side DOM
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: frozen-api-flag
      - id: url-userinfo-pattern
      - id: w3c-dom-test-suite
      - id: angular-style-parser-copy
      - id: htmlparser-require
