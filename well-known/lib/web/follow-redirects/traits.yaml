# Node HTTP URL helpers — follow-redirects and url-parse are bundled with
# axios, socket.io, and other clients. Their URL property vocabularies include
# "hostname" and "userInfo", which otherwise resemble obfuscated host-profile
# DNS beacon terms.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: follow-redirects-browser-warning
    desc: follow-redirects browser-build exclusion warning
    if:
      type: text
      substr: The follow-redirects package should be excluded from browser builds

  - id: follow-redirects-property-vocabulary
    desc: follow-redirects URL property name list
    if:
      type: text
      substr: '["auth","host","hostname","href","path","pathname","port","protocol","query","search","hash"]'

  - id: url-parse-component-vocabulary
    desc: url-parse URL component property name list
    if:
      type: text
      substr: '["source","protocol","authority","userInfo","user","password","host","port","relative","path","directory","file","query","anchor"]'

composite_rules:
  - id: node-http-url-parser-context
    desc: Bundled Node HTTP URL parser library context
    crit: exception
    conf: 0.99
    any:
      - id: follow-redirects-browser-warning
      - id: follow-redirects-property-vocabulary
      - id: url-parse-component-vocabulary
