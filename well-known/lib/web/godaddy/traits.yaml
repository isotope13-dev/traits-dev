# GoDaddy packages published under the @godaddy/ scope.
# GoDaddy publishes its commerce, UI, and SDK packages (@godaddy/react,
# @godaddy/localizations, @godaddy/cli, ...) from the github.com/godaddy
# organization (monorepo godaddy/javascript), so the package scope matches
# the repository owner while the repository basename differs — a shape the
# engine's folded-slug comparison reads as a clone-and-rename. The npm scope
# matching the repository owner is the identity consistency the slug check
# cannot express, so pair the two here: a differently named package that merely
# points at a godaddy repository (or a @godaddy/ package pointing elsewhere)
# still lacks this exact pairing and remains detectable.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    for: [package.json]
    desc: GoDaddy scoped package identity
    if:
      type: value
      path: name
      regex: '^@godaddy/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: GoDaddy scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@godaddy/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    for: [package.json]
    desc: GoDaddy GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/[Gg]o[Dd]addy/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-repository-url
    for: [package.json]
    desc: GoDaddy GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/[Gg]o[Dd]addy/[a-z0-9._-]+(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: GoDaddy GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/[Gg]o[Dd]addy/[a-z0-9._-]+(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official GoDaddy package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official GoDaddy organization repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official GoDaddy package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
