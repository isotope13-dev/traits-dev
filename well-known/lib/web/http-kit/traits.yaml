# http-kit — event-driven HTTP client/server for Clojure (http-kit.org).
# Java NIO, Ring adapter, and WebSocket handshake hashing are product
# features; identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, java, class, java_class, clojure]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: http-kit Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: http-kit

  - id: package-path
    desc: http-kit Java package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)org/httpkit/'

  - id: homepage
    desc: http-kit project homepage URL
    for: [jar, zip, clojure, java, text]
    conf: 0.97
    if:
      type: text
      substr: http://http-kit.org/

  - id: taoensso-fork-group
    desc: taoensso forks http-kit Maven group
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: com.taoensso.forks

  - id: taoensso-fork-lein
    desc: taoensso forks http-kit Leiningen id
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: com.taoensso.forks/http-kit
