# jeluard/happy — Clojure(Script) HTTP async client. OkHttp, XHR, and
# cheshire JSON representors are product HTTP, not C2. Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: github-repo
    desc: jeluard happy GitHub repository
    conf: 0.99
    if:
      type: text
      substr: github.com/jeluard/happy

  - id: defproject
    desc: happy Leiningen defproject form
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject happy "'

  - id: representor-path
    desc: happy representor namespace path
    conf: 0.96
    if:
      type: path
      regex: 'happy[\\/]representor'

  - id: json-namespace
    desc: happy JSON representor ns form
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(ns happy.representor.json'

composite_rules:
  - id: jeluard-happy-library
    desc: jeluard happy Clojure HTTP client
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: github-repo
      - id: defproject
      - id: representor-path
      - id: json-namespace
    needs: 2
