# webpack schema-utils — JSON schema options validator.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: schema-utils npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: schema-utils

  - id: vendored-path
    desc: vendored schema-utils package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/schema-utils/'


composite_rules:
  - id: schema-utils-library
    desc: webpack schema-utils validator
    any:
      - id: package-name
      - id: vendored-path
