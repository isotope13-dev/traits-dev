# frenic/csstype — TypeScript CSS type definitions from MDN.
defaults:
  platforms: [unix, windows]
  for: [package.json, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: csstype npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: csstype

  - id: repository
    desc: csstype GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository
      exact: https://github.com/frenic/csstype

  - id: vendored-path
    desc: vendored csstype package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/csstype/'

composite_rules:
  - id: csstype-library
    desc: csstype CSS TypeScript types
    any:
      - id: package-name
      - id: repository
      - id: vendored-path
