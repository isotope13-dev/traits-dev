defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.96
  size_min: 1
  size_max: 50000000

traits:
  - id: npm-package-name
    desc: Next.js npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: next
  - id: npm-package-repository
    desc: Next.js npm repository identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository
      exact: vercel/next.js
  - id: npm-package-homepage
    desc: Next.js npm homepage identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://nextjs.org
  - id: archive-package-name
    desc: Next.js npm archive name
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: next
  - id: archive-package-repository
    desc: Next.js npm archive repository
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: vercel/next.js
  - id: archive-package-homepage
    desc: Next.js npm archive homepage
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.homepage
      exact: https://nextjs.org
  - id: package-member-context
    desc: Next.js package member identity
    crit: notable
    if:
      type: value
      path: package.json::name
      exact: next
  - id: next-server-build-path
    desc: Next.js server build path
    if:
      type: path
      regex: '\.next[\\/]server'
  - id: next-node-modules-path
    desc: Next.js node_modules path
    if:
      type: path
      regex: 'node_modules[\\/]next'
  - id: next-dist-path
    desc: Next.js dist path
    if:
      type: path
      regex: 'next[\\/]dist'
  # Client build output. Next.js names these chunks from a content hash, so an
  # opaque filename here is the framework's doing, not a choice by whoever
  # shipped the package.
  - id: next-client-chunk-path
    desc: Next.js client build chunk path
    if:
      type: path
      regex: '_next[\\/]static[\\/]chunks'
  - id: next-info-cli-entrypoint
    desc: Next.js info CLI entrypoint path
    crit: component
    conf: 0.99
    if:
      type: basename
      exact: next-info.js
  - id: next-info-registry-query
    desc: Next.js release metadata registry query
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '/package/next/dist-tags'
  - id: eval-source-map-plugin-basename
    desc: Eval source-map plugin basename
    if:
      type: path
      basename: true
      exact: eval-source-map-dev-tool-plugin.js
  - id: eval-source-map-plugin-marker
    desc: Eval source-map plugin marker
    if:
      type: text
      substr: eval-source-map-dev-tool-plugin.js.map
  - id: node-crypto-shim-basename
    desc: Node crypto shim basename
    if:
      type: path
      basename: true
      exact: node-crypto.js
  - id: node-crypto-shim-marker
    desc: Node crypto shim marker
    if:
      type: text
      substr: generateKeyPairSyncExpression
  - id: next-build-telemetry-writer
    desc: Next.js build telemetry writer
    if:
      type: text
      substr: "writeFileSync(_path.default.join(this.distDir, '_events.json')"
  - id: next-production-build-phase
    desc: Next.js production build phase
    if:
      type: text
      substr: PHASE_PRODUCTION_BUILD
  - id: next-prerender-manifest-writer
    desc: Next.js prerender manifest writer
    if:
      type: text
      substr: writePrerenderManifest
  - id: next-build-source-flow--rx-7
    desc: Next loadConfig with production-build phase
    if:
      type: text
      regex: "loadConfig.{0,240}PHASE_PRODUCTION_BUILD"
    count_max: 1028192
  - id: next-build-source-flow--rx-8
    desc: Next writeManifest with prerender manifest
    if:
      type: text
      regex: "writeManifest.{0,240}PRERENDER_MANIFEST"
    count_max: 1028193
  - id: next-build-source-flow--rx-9
    desc: Next build context marker
    if:
      type: text
      substr: NextBuildContext
    count_max: 1028194

  # @vercel/next is the official Vercel deployment builder, distinct from
  # the similarly named end-user `next` framework package. The builder
  # creates a temporary .npmrc from NPM_AUTH_TOKEN so private application
  # dependencies can be installed, then removes it after the build.
  - id: vercel-builder-package-name
    desc: Official Vercel Next builder package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@vercel/next'
  - id: vercel-builder-package-repository
    desc: Vercel builder repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^https?://github\.com/vercel/vercel(\.git)?/?$'
  - id: vercel-builder-package-homepage
    desc: Vercel builder documentation URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: homepage
      regex: '^https://vercel\.com/docs/runtimes#official-runtimes/next-js$'
  - id: vercel-builder-archive-name
    desc: Official Vercel Next builder archive name
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@vercel/next'
  - id: vercel-builder-archive-repository
    desc: Vercel builder archive repository
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      regex: '^https?://github\.com/vercel/vercel(\.git)?/?$'
  - id: vercel-builder-archive-homepage
    desc: Vercel builder archive homepage
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.homepage
      regex: '^https://vercel\.com/docs/runtimes#official-runtimes/next-js$'
  - id: vercel-builder-member-context
    desc: '@vercel/next builder package member identity'
    crit: notable
    if:
      type: value
      path: package.json::name
      exact: '@vercel/next'
  - id: vercel-builder-build-utils-marker
    desc: Vercel builder utility marker
    crit: notable
    if:
      type: text
      substr: getLambdaOptionsFromFunction
  - id: middleware-template-markers
    desc: Next.js middleware template markers
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'VAR_USERLAND[\s\S]{0,800}ProxyMissingExportError'

composite_rules:
  - id: official-npm-package
    desc: Official Next.js npm package identity
    crit: notable
    for: [package.json]
    all:
      - id: npm-package-name
      - id: npm-package-repository
      - id: npm-package-homepage
  - id: official-npm-archive
    desc: Official Next.js npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-package-repository
      - id: archive-package-homepage
  - id: next-build-source-flow
    desc: Next.js build source flow
    conf: 0.98
    any:
      - id: next-build-source-flow--rx-7
      - id: next-build-source-flow--rx-8
      - id: next-build-source-flow--rx-9
  - id: next-build-pipeline-context
    desc: Next.js build pipeline source
    crit: notable
    conf: 0.98
    all:
      - id: metadata/library/structure::js-large-module-bundle
      - id: next-build-source-flow
    any:
      - id: next-production-build-phase
      - id: next-prerender-manifest-writer
  - id: next-node-modules-runtime
    desc: Next.js node_modules runtime file
    crit: baseline
    conf: 0.98
    all:
      - id: next-node-modules-path
      - id: next-dist-path
  - id: next-info-cli
    desc: Next.js installation diagnostics CLI
    crit: notable
    conf: 0.99
    all:
      - id: next-info-cli-entrypoint
      - id: next-info-registry-query
  - id: next-eval-source-map-plugin
    desc: Next.js eval source-map plugin
    crit: baseline
    conf: 0.99
    all:
      - id: eval-source-map-plugin-basename
      - id: eval-source-map-plugin-marker
  - id: official-vercel-next-builder
    desc: Official Vercel Next builder npm identity
    crit: notable
    for: [package.json]
    all:
      - id: vercel-builder-package-name
      - id: vercel-builder-package-repository
      - id: vercel-builder-package-homepage
  - id: official-vercel-next-builder-archive
    desc: Official Vercel Next builder npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: vercel-builder-archive-name
      - id: vercel-builder-archive-repository
      - id: vercel-builder-archive-homepage
  - id: vercel-builder-benign-npm-auth-context
    desc: Vercel Next builder npm authentication context
    crit: exception
    conf: 0.99
    all:
      - id: vercel-builder-build-utils-marker
      - id: micro-behaviors/os/env/vars/credentials::npm-auth-token-env-read
  - id: vercel-builder-benign-npm-auth-archive-context
    desc: Vercel builder archive auth context
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar]
    all:
      - id: official-vercel-next-builder-archive
      - id: vercel-builder-build-utils-marker
      - id: micro-behaviors/os/env/vars/credentials::npm-auth-token-env-read
  - id: next-crypto-extension-shim
    desc: Next.js crypto extension shim
    crit: baseline
    conf: 0.99
    all:
      - id: node-crypto-shim-basename
      - id: node-crypto-shim-marker
  - id: nextjs-build-identity
    desc: Next.js build output identity
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: next-server-build-path
      - id: next-client-chunk-path
      - id: next-build-telemetry-writer
      - id: next-eval-source-map-plugin
      - id: next-crypto-extension-shim
  - id: next-middleware-source-map-template
    desc: Next.js middleware source map template
    crit: notable
    conf: 0.99
    all:
      - id: metadata/file/format/structured::sourcemap
      - id: middleware-template-markers
