# com.jspsmart.upload — early-2000s JSP multipart upload library.
defaults:
  platforms: [unix, windows]
  for: [java_class, class, jar, java]
  crit: notable
  conf: 0.97

traits:
  - id: smartupload-class-name
    desc: JSPSmart Upload class name
    if:
      type: text
      substr: 'com/jspsmart/upload/SmartUpload'

  - id: database-save-error
    desc: JSPSmart database save error
    if:
      type: text
      substr: 'Unable to save file from the DataBase (1020).'

composite_rules:
  - id: jspsmart-upload-library
    desc: JSPSmart Upload library code
    any:
      - id: smartupload-class-name
      - id: database-save-error
