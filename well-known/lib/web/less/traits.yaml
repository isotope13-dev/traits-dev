# less.js — CSS preprocessor.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: less npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: less

  - id: vendored-path
    desc: vendored less package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/less/'
