# Microsoft Azure Maps Web SDK (atlas.min.js / atlas-service.js).
# Minified map control, HTTP client, and auth helpers are product code.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98
  size_min: 64
  size_max: 8000000

traits:
  - id: sdk-license-banner
    desc: Microsoft Azure Maps Web SDK banner
    if:
      type: text
      substr: MICROSOFT AZURE MAPS WEB SDK

  - id: atlas-service-export
    desc: Azure Maps atlas.service export
    if:
      type: text
      substr: global.atlas.service
