# Ruby on Rails web application framework runtime markers.
defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: development-server-command
    desc: Rails development server command
    crit: notable
    conf: 0.97
    if:
      type: text
      # The explicit environment switch separates a development fixture from
      # production Rails launchers and from prose that merely names Rails.
      regex: '\b(bin/)?rails\s+(server|s)\b[^\n]{0,80}-e\s+development\b'
