# Docsify — markdown docs site generator often vendored under node_modules
# (e.g. noty/docs). Its playground assigns window.__EXECUTE_RESULT__ via
# new Function; that is documentation tooling, not string obfuscation.
defaults:
  platforms: [unix, windows]
  for: [javascript, html]
  crit: notable
  conf: 0.95

traits:
  - id: docsify-basename
    desc: Docsify script basename
    if:
      type: basename
      exact: docsify.js
  - id: docsify-execute-result-marker
    desc: Docsify code-playground execute-result marker
    if:
      type: text
      substr: window.__EXECUTE_RESULT__
  - id: docsify-version-banner
    desc: Docsify version banner
    if:
      type: text
      regex: '(?i)\bdocsify\s+v?[0-9]+\.[0-9]+(\.[0-9]+)?\b'

composite_rules:
  - id: docsify-library
    desc: Docsify documentation generator library
    crit: notable
    conf: 0.96
    any:
      - id: docsify-basename
      - id: docsify-execute-result-marker
      - id: docsify-version-banner
