# JSDOM is a browser-DOM implementation for Node.js.  These markers identify
# the package without treating its DOM, URL, or XHR mechanics as hostile.
defaults:
  platforms: [windows, unix]

traits:
  - id: package-name
    desc: JSDOM package manifest name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: jsdom

  - id: constructor-api
    desc: JSDOM DOM-emulation constructor API
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: symbol
      exact: JSDOM
