# NativeScript webpack configuration package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: NativeScript webpack npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@nativescript/webpack'

  - id: vendored-path
    desc: vendored @nativescript/webpack package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@nativescript/webpack/'


composite_rules:
  - id: nativescript-webpack-library
    desc: NativeScript webpack package
    any:
      - id: package-name
      - id: vendored-path
