# Phusion Passenger is an Apache/nginx module and application server. Its
# watchdog, privilege handoff, process naming, OOM-score tuning, and native
# extension bootstrap are expected implementation details of the server.
#
# The two path traits below only ever matched the OUTER artifact: inside
# passenger-6.2.0.gem the members are `src/apache2_module/Hooks.cpp`, which
# carry no `passenger-` component, so the exception never reached the files the
# objectives actually fire on. (`passenger-gem-path` matched nothing at all --
# in single-quoted YAML `\\.gem` is an escaped backslash, not an escaped dot.)
# Every Passenger source file carries the project's copyright header, so that
# is the marker that travels with the code.
defaults:
  platforms: [unix, windows]
  for: [gem, tar, c, cpp, ruby, python, scripts]
  crit: notable
  conf: 0.99

traits:
  - id: passenger-source-header
    desc: Phusion Passenger source copyright header
    for: [c, cpp, ruby, python, scripts]
    if:
      type: text
      substr: 'Phusion Passenger - https://www.phusionpassenger.com/'

  - id: passenger-gem-path
    desc: Phusion Passenger gem or member path
    if:
      type: path
      regex: '(^|[\\/])passenger-[0-9][^\\/]*\.gem'

  - id: passenger-source-path
    desc: Passenger native source member path
    if:
      type: path
      regex: '(^|[\\/])passenger-[0-9]'

composite_rules:
  - id: passenger-package-context
    desc: Recognized Phusion Passenger source package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: passenger-source-header
      - id: passenger-gem-path
      - id: passenger-source-path
