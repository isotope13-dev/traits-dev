# Phusion Passenger is an Apache module and application server. Its watchdog,
# privilege handoff, process naming, and native extension bootstrap are
# expected implementation details of the server.
defaults:
  platforms: [unix, windows]
  for: [gem, tar.gz, c, cpp, ruby]
  crit: notable
  conf: 0.99

traits:
  - id: passenger-gem-path
    desc: Phusion Passenger gem or extracted member path
    if:
      type: path
      regex: '(^|[\\/])passenger-[0-9][^\\/]*\\.gem'

  - id: passenger-source-path
    desc: Passenger native source member path
    if:
      type: path
      regex: '(^|[\\/])src[\\/]'

composite_rules:
  - id: passenger-package-context
    desc: Recognized Phusion Passenger source package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: passenger-gem-path
      - id: passenger-source-path
