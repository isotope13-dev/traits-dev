# @microsoft/teams.api — official Microsoft Teams SDK API package
# (https://github.com/microsoft/teams.ts).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Microsoft Teams API npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@microsoft/teams.api'

  - id: archive-package-name
    desc: Microsoft Teams API npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@microsoft/teams.api'

  - id: package-member-context
    desc: Microsoft Teams API package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@microsoft/teams.api'

  - id: upstream-repository
    desc: Microsoft Teams SDK GitHub repository
    if:
      type: text
      substr: github.com/microsoft/teams.ts

composite_rules:
  - id: microsoft-teams-api-context
    desc: Microsoft Teams SDK API package context
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: upstream-repository
