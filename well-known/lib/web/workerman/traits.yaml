defaults:
  platforms: [unix, windows]
  for: [php, composer.json]
  crit: notable
  conf: 0.98

traits:
  - id: composer-package-name
    desc: Workerman Composer package
    for: [composer.json]
    if:
      type: value
      path: name
      exact: workerman/workerman

  - id: php-namespace
    desc: Workerman PHP namespace
    for: [php]
    if:
      type: text
      regex: '(?m)^namespace\s+Workerman(\\|;)'

  - id: author-header
    desc: Workerman source author header
    for: [php]
    if:
      type: text
      substr: 'walkor<walkor@workerman.net>'

  - id: worker-class
    desc: Workerman Worker class definition
    for: [php]
    if:
      type: text
      regex: '\bclass\s+Worker\b'

composite_rules:
  - id: php-source-file
    desc: Workerman PHP source file
    crit: notable
    conf: 0.99
    for: [php]
    all:
      - id: php-namespace
      - id: author-header

  - id: worker-core-source
    desc: Workerman Worker core source
    crit: notable
    conf: 0.99
    for: [php]
    all:
      - id: php-source-file
      - id: worker-class
