# The historical `bs4` PyPI distribution is a compatibility stub that asks
# users to install `beautifulsoup4`; it does not ship the scraping library.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  for: [pkginfo, python-sdist, python]

traits:
  - id: pypi-compatibility-package-name
    desc: bs4 PyPI compatibility package name
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*bs4\s*$'

  - id: pypi-canonical-homepage
    desc: beautifulsoup4 canonical PyPI homepage
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Home-page:\s*https://pypi\.python\.org/pypi/beautifulsoup4\s*$'

  - id: pypi-author
    desc: Leonard Richardson author in bs4 metadata
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Author:\s*Leonard Richardson\s*$'

  - id: setup-depends-on-canonical-package
    desc: setup.py depends on beautifulsoup4
    for: [python]
    if:
      type: text
      regex: "install_requires\\s*=\\s*\\[\\s*['\"]beautifulsoup4['\"]\\s*\\]"

  - id: setup-recommends-canonical-package
    desc: setup.py redirects users to beautifulsoup4
    for: [python]
    if:
      type: text
      substr: Use `beautifulsoup4

composite_rules:
  - id: pypi-compatibility-stub
    desc: bs4 PyPI compatibility stub for beautifulsoup4
    crit: exception
    scope: outer
    all:
      - id: pypi-compatibility-package-name
      - id: pypi-canonical-homepage
      - id: pypi-author
      - id: setup-depends-on-canonical-package
      - id: setup-recommends-canonical-package
