# jsdom/whatwg-mimetype — WHATWG MIME Sniffing parser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: whatwg-mimetype npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: whatwg-mimetype

  - id: mime-parse-error
    desc: whatwg-mimetype parse failure message
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Could not parse MIME type string "'

  - id: vendored-path
    desc: vendored whatwg-mimetype package path
    if:
      type: path
      regex: 'node_modules/whatwg-mimetype'

composite_rules:
  - id: whatwg-mimetype-library
    desc: WHATWG MIME type parser library
    any:
      - id: package-name
      - id: mime-parse-error
      - id: vendored-path
