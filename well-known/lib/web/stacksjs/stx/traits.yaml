# stacksjs `stx` -- the template framework.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: stacksjs-stx-framework-context
    desc: Recognized Stacks STX framework bundle context
    crit: exception
    conf: 1.0
    all:
      - id: well-known/lib/data/stacksjs-stx::stx-bun-framework-bundle
      - id: well-known/lib/data/stacksjs-stx::stx-deploy-user-agent
