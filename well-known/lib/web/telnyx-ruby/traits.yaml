# telnyx — official Telnyx Ruby API client (Stainless-generated).
defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.99

traits:
  - id: gem-name
    desc: telnyx Ruby gem name
    for: [gem]
    if:
      type: value
      path: name
      exact: telnyx

  - id: telnyx-api-base-url
    desc: Telnyx API v2 base URL
    for: [ruby]
    if:
      type: text
      substr: https://api.telnyx.com/v2

  - id: stainless-ruby-runtime-header
    desc: Stainless Ruby SDK runtime header
    for: [ruby]
    if:
      type: text
      substr: '"x-stainless-lang" => "ruby"'

  - id: standardwebhooks-verify
    desc: Telnyx StandardWebhooks signature verification
    for: [ruby]
    if:
      type: text
      substr: StandardWebhooks::Webhook.new

composite_rules:
  - id: telnyx-ruby-sdk-context
    desc: Recognized Telnyx Ruby API client gem
    crit: notable
    conf: 0.99
    scope: archive
    for: [gem]
    all:
      - id: gem-name
      - id: telnyx-api-base-url
    any:
      - id: stainless-ruby-runtime-header
      - id: standardwebhooks-verify
