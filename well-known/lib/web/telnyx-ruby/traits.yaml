# telnyx — official Telnyx Ruby API client (Stainless-generated).
defaults:
  platforms: [unix, windows]
  for: [ruby, gem]
  crit: notable
  conf: 0.99

traits:
  - id: gem-name
    desc: telnyx Ruby gem name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: telnyx

  - id: telnyx-api-base-url
    desc: Telnyx API v2 base URL
    for: [ruby]
    if:
      type: text
      substr: https://api.telnyx.com/v2

composite_rules:
  - id: telnyx-ruby-sdk-context
    desc: Recognized Telnyx Ruby API client gem
    crit: notable
    conf: 0.99
    scope: archive
    for: [gem]
    all:
      - id: gem-name
      - id: telnyx-api-base-url
    any:
      - id: well-known/tool/development/stainless::stainless-ruby-runtime-header
      - id: well-known/lib/web/standardwebhooks::webhook-verify
