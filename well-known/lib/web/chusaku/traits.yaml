# Chusaku — nshki Rails gem that annotates controller actions with
# @route comments. Kernel.load of bundled rake tasks is product loading.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 5000000

traits:
  - id: gem-name
    desc: chusaku Ruby gem package name
    for: [gem]
    conf: 0.99
    if:
      type: value
      path: gem.name
      exact: chusaku

  - id: gemspec-name
    desc: chusaku gemspec package name
    for: [ruby]
    conf: 0.99
    if:
      type: text
      substr: 'spec.name = "chusaku"'

  - id: github-repo
    desc: nshki chusaku GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/nshki/chusaku

  - id: module-declaration
    desc: Chusaku Ruby module declaration
    for: [ruby]
    conf: 0.96
    if:
      type: text
      regex: 'module Chusaku\b'
