# React on Rails — shakacode Rails React server rendering gem.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, javascript, text]
  crit: notable
  conf: 0.98

traits:
  - id: gem-package-name
    desc: Ruby gem name react_on_rails
    for: [gem, text, ruby]
    if:
      type: text
      regex: '(?im)^name:\s*react_on_rails\s*$'

  - id: react-on-rails-module
    desc: ReactOnRails Ruby module declaration
    for: [ruby]
    if:
      type: text
      regex: 'module ReactOnRails\b'

  - id: shakacode-github-repo
    desc: shakacode react_on_rails GitHub repository
    for: [gem, text, ruby, markdown]
    if:
      type: text
      substr: github.com/shakacode/react_on_rails

  - id: server-rendering-marker
    desc: React on Rails server rendering marker
    for: [ruby, gem, text]
    if:
      type: text
      substr: react server rendering

composite_rules:
  - id: react-on-rails-gem
    desc: React on Rails shakacode Ruby gem package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: gem-package-name
      - id: react-on-rails-module
      - id: shakacode-github-repo
