# ws — the dominant Node WebSocket implementation, bundled with collaborative
# clients (y-websocket, hocuspocus, liveblocks stacks). Its option vocabulary
# and URL parsing (`hostname`, `username`/`password` basic auth) otherwise
# resemble obfuscated host-profile DNS terms.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: permessage-deflate-option
    desc: ws permessage-deflate option name
    if:
      type: text
      substr: perMessageDeflate

  - id: skip-utf8-validation-option
    desc: ws skipUTF8Validation option name
    if:
      type: text
      substr: skipUTF8Validation

composite_rules:
  - id: ws-websocket-library-context
    desc: Bundled ws WebSocket library context
    crit: exception
    conf: 0.99
    all:
      - id: permessage-deflate-option
      - id: skip-utf8-validation-option
