# fb55/css-select — CSS selector engine on a DOM.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: css-select npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: css-select

  - id: vendored-path
    desc: vendored css-select package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/css-select/'


composite_rules:
  - id: css-select-library
    desc: css-select CSS selector engine
    any:
      - id: package-name
      - id: vendored-path
