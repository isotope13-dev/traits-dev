# A packed legacy event-listener shim (the IE8 attachEvent polyfill that Dean
# Edwards-style packers wrap in eval) keeps its vocabulary in the packer's
# keyword dictionary. Stock packed libraries are already listed by name in
# packer-eval-pattern; this covers the shim class wherever it ships. The three
# tokens cluster in IE event shims, and a packed eval carrying all of them is
# legacy compatibility code. Keep the suppression narrow: it only exempts the
# packer-eval wrapper, never a decoded payload that names other APIs.
defaults:
  platforms: [unix, windows]
  for: [javascript, shell, html, text]
  crit: notable
  conf: 0.95

traits:
  - id: ie-event-shim-attach-token
    desc: Packer dictionary names attachEvent
    if:
      type: text
      word: attachEvent

  - id: ie-event-shim-detach-token
    desc: Packer dictionary names detachEvent
    if:
      type: text
      word: detachEvent

  - id: ie-event-shim-srcelement-token
    desc: Packer dictionary names srcElement
    if:
      type: text
      word: srcElement

composite_rules:
  - id: packed-ie-event-shim-dictionary
    desc: Packed IE event-listener shim dictionary
    crit: exception
    conf: 0.95
    all:
      - id: ie-event-shim-attach-token
      - id: ie-event-shim-detach-token
      - id: ie-event-shim-srcelement-token
