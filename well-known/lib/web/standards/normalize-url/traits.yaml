# sindresorhus/normalize-url — URL normalization helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: normalize-url npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: normalize-url

  - id: repository
    desc: sindresorhus/normalize-url repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: sindresorhus/normalize-url

  - id: vendored-path
    desc: vendored normalize-url package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/normalize-url/'

  - id: data-url-default-mime
    desc: normalize-url data-URL default MIME type
    if:
      type: text
      substr: "DATA_URL_DEFAULT_MIME_TYPE = 'text/plain'"

composite_rules:
  - id: library
    desc: sindresorhus normalize-url helper
    needs: 2
    any:
      - id: package-name
      - id: repository
      - id: vendored-path
      - id: data-url-default-mime
