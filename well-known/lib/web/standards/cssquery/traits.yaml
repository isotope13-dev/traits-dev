# cssQuery (Dean Edwards) — CSS selector engine for browsers. The stock
# cssQuery-p.js distribution ships only as Dean Edwards packer output; the
# release banner is retained ahead of the packed body, and the packer word
# dictionary keeps the selector-engine vocabulary.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: cssquery-release-banner
    desc: cssQuery release banner text
    if:
      type: text
      substr: 'cssQuery, version 2.0.2 (2005-08-19)'
  - id: cssquery-packed-dictionary
    desc: cssQuery packer symbol dictionary fragment
    conf: 0.98
    if:
      type: text
      substr: 'x5fwin32|cc_on|standard||odd|even|enabled|hash|location|target|not|only|empty|root|contains|level3'

composite_rules:
  - id: packed-cssquery-library
    desc: Stock packed cssQuery library distribution
    crit: exception
    conf: 0.99
    all:
      - id: cssquery-release-banner
      - id: cssquery-packed-dictionary
