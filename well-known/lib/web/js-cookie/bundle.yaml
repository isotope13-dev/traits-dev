defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
- id: recognized-js-cookie-library-bundle
  desc: "Matches 'export default { getValue...'"
  # js-cookie is a normal browser dependency; the hostile skimmer composite
  # additionally requires cookie enumeration, POST serialization, and a
  # tracking/external-navigation indicator.
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '("js-cookie":"|''js-cookie'':''|document\.cookie\?document\.cookie\.split\("; "\))'
