# js-cookie browser cookie helper library.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: distribution-banner
    desc: js-cookie distribution banner
    if:
      type: text
      regex: '^/\*!\s+js-cookie\s+v[0-9]+\.[0-9]+\.[0-9]+\s+\|\s+MIT\s+\*/'
