# Pagy — Ruby pagination gem (ddnexus).
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, javascript, text]
  crit: notable
  conf: 0.98

traits:
  - id: gem-package-name
    desc: Ruby gem name pagy
    for: [gem, text]
    if:
      type: text
      regex: '(?im)^name:\s*pagy\s*$'

  - id: pagy-class-declaration
    desc: Pagy pagination class declaration
    for: [ruby]
    if:
      type: text
      regex: 'class Pagy\b'

  - id: pagy-version-constant
    desc: Pagy VERSION constant marker
    for: [ruby]
    if:
      type: text
      substr: Pagy::VERSION

  - id: pagy-playground-demo-marker
    desc: Pagy playground demo rackup app marker
    for: [ruby, gem, text, python]
    if:
      type: text
      substr: ddnexus.github.io/pagy/playground

  - id: pagy-github-homepage
    desc: ddnexus pagy GitHub repository marker
    for: [gem, text, ruby, markdown]
    if:
      type: text
      substr: github.com/ddnexus/pagy

composite_rules:
  - id: pagy-ruby-gem
    desc: Pagy Ruby pagination gem package
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: gem-package-name
      - id: pagy-class-declaration
      - id: pagy-github-homepage
