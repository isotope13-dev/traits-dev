# cherrypy_foundation — CherryPy web framework foundation library (IKUS Software).
defaults:
  platforms: [unix, windows]
  for: [python, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: cherrypy-foundation-package
    desc: cherrypy_foundation PyPI package identity
    if:
      type: text
      regex: '(?i)Name:\s*cherrypy_foundation\b'

  - id: cherrypy-foundation-field-css
    desc: cherrypy_foundation form field CSS marker
    if:
      type: text
      substr: cf-field-password
