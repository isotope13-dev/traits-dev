defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
  size_max: 1000000

traits:
  - id: blessed-unicode-module-path
    desc: Blessed unicode module path
    crit: component
    conf: 0.94
    if:
      type: basename
      regex: '(^|[\\/])unicode\.js$'

  # Was `substr: "unicode"`, so the composite reduced to "a .js file named
  # unicode.js that contains the word unicode" — i.e. essentially every
  # unicode.js in existence (MathJax's extensions/TeX/unicode.js, and the
  # unicode tables countless projects ship). That matters because this identity
  # sits in the `unless:` of the unicode-steganography composite, so the loose
  # form was a trivially-spoofable suppressor on invisible-unicode stego:
  # name the dropper unicode.js and it was exempt. Every blessed lib file
  # carries the package's own header banner, so require the library name.
  - id: blessed-unicode-helper-text
    desc: Blessed library name in unicode module
    crit: component
    conf: 0.9
    if:
      type: text
      substr: blessed

composite_rules:
  - id: blessed-terminal-unicode-module
    desc: Blessed terminal unicode helper
    crit: notable
    conf: 0.94
    all:
      - id: blessed-unicode-module-path
      - id: blessed-unicode-helper-text
