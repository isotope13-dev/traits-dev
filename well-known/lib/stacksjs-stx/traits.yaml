# @stacksjs/stx is a UI/rendering framework. Its optional desktop-preview
# import is intentionally attempted and caught when the optional desktop
# package is absent.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, archives]
  crit: notable
  conf: 1.0

traits:
  - id: stx-package-name
    desc: Stacks STX npm package identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stacksjs/stx'

  - id: stx-repository
    desc: Stacks STX upstream repository
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/stacksjs/stx(\.git)?'

  # The published CLI is a Bun bundle rather than a package manifest.  The
  # generic Bun banner lives in metadata/build/bun; the deployment client and
  # directive runtime below identify this library's source layout without
  # treating its capabilities as malicious behavior.
  - id: stx-netlify-deploy-client
    desc: Stacks STX Netlify deploy client
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: 'stx-deploy/1.0'

  - id: stx-directive-runtime-marker
    desc: Stacks STX directive runtime marker
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: '__stx_directives__'

composite_rules:
  - id: stx-package-context
    desc: Recognized Stacks STX framework package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: stx-package-name
      - id: stx-repository

  - id: stx-cli-source-context
    desc: Recognized Stacks STX CLI source bundle
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: metadata/build/bun::bun-bundled-source-marker
      - id: stx-netlify-deploy-client
      - id: stx-directive-runtime-marker
