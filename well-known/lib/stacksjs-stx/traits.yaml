# @stacksjs/stx is a UI/rendering framework. Its optional desktop-preview
# import is intentionally attempted and caught when the optional desktop
# package is absent.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, archives]
  crit: notable
  conf: 1.0

traits:
  - id: stx-package-name
    desc: Stacks STX npm package identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stacksjs/stx'

  - id: stx-repository
    desc: Stacks STX upstream repository
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/stacksjs/stx(\.git)?'

  # Published STX framework bundles are Bun bundles rather than package
  # manifests.  The generic Bun banner lives in metadata/build/bun; the
  # deployment User-Agent and directive runtime below identify this library's
  # source layout without treating its capabilities as malicious behavior.
  - id: stx-deploy-user-agent
    desc: Stacks STX deploy User-Agent marker
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: 'stx-deploy/1.0'

  - id: stx-source-repository-reference
    desc: STX source repository reference
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: 'github.com/stacksjs/stx'

  - id: stx-directive-runtime-marker
    desc: Stacks STX directive runtime marker
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: '__stx_directives__'

  # Minified bundles may retain package imports even when raw-text matching
  # is unavailable to the source matcher.  Keep both imports as separate
  # observations so the composite does not rely on one generic package name.
  - id: stx-bun-plugin-import
    desc: Imports the STX Bun plugin
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: import
      exact: bun-plugin-stx

  - id: stx-router-import
    desc: Imports the STX router
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: import
      exact: stx-router

  - id: stx-netlify-api-base-url
    desc: STX Netlify API base URL
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: literal
      exact: 'https://api.netlify.com/api/v1'

  - id: stx-netlify-auth-token-access
    desc: STX Netlify auth token environment access
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.NETLIFY_AUTH_TOKEN

  - id: stx-heatmap-runtime-marker
    desc: STX privacy-compliant heatmap runtime marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: 'stx Heatmap - Privacy-Compliant Tracking'

composite_rules:
  - id: stx-package-context
    desc: Recognized Stacks STX framework package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: stx-package-name
      - id: stx-repository

  - id: stx-bun-framework-bundle
    desc: Recognized Stacks STX Bun framework bundle
    crit: notable
    conf: 0.99
    for: [javascript]
    # Release bundles retain the Bun plugin and router imports even when
    # package metadata and source-repository text are absent.
    all:
      - id: stx-bun-plugin-import
      - id: stx-router-import

  - id: stx-netlify-deploy-client
    desc: STX Netlify deployment API client
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: stx-netlify-api-base-url
      - id: stx-netlify-auth-token-access
      - id: stx-deploy-user-agent

  - id: stx-heatmap-runtime
    desc: STX browser heatmap analytics runtime
    crit: notable
    conf: 1.0
    for: [javascript, typescript]
    all:
      - id: stx-heatmap-runtime-marker
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/ui/window/manage/click::browser-click-listener
