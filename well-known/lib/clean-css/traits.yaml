# clean-css — CSS minifier for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, text]
  crit: notable
  conf: 0.99
  size_max: 20000000

traits:
  - id: package-name
    desc: clean-css npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: clean-css

  - id: archive-path
    desc: clean-css npm pack archive path
    if:
      type: path
      regex: '(^|[\\/])clean-css@[0-9]'

composite_rules:
  - id: clean-css-library
    desc: clean-css CSS minifier package
    any:
      - id: package-name
      - id: archive-path
