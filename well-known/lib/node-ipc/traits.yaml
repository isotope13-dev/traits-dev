# node-ipc is a Node.js TCP/UDP/Unix-socket IPC library.  These markers
# identify the library implementation; they do not imply that a caller using
# its transport APIs is malicious.  Trojanized releases should retain this
# identity while separate behavior/objective traits describe any added code.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: node-ipc-package-name
    desc: node-ipc npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: node-ipc

  - id: node-ipc-bundle-marker
    desc: node-ipc bundled module marker
    for: [javascript]
    if:
      type: text
      regex: '(?m)^// node-ipc\.js$'

  - id: node-ipc-connect-api
    desc: node-ipc connection API marker
    crit: component
    for: [javascript]
    if:
      type: text
      substr: connectToNet

  - id: node-ipc-serve-api
    desc: node-ipc service API marker
    crit: component
    for: [javascript]
    if:
      type: text
      substr: serveNet

composite_rules:
  - id: node-ipc-api-surface
    desc: node-ipc connection and service APIs
    crit: notable
    conf: 0.99
    for: [javascript]
    near_bytes: 12000
    all:
      - id: node-ipc-connect-api
      - id: node-ipc-serve-api

  - id: node-ipc-library
    desc: Recognized node-ipc JavaScript library bundle
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: node-ipc-bundle-marker
      - id: node-ipc-api-surface
