defaults:
  platforms: [unix]
  for: [elf, so]
  crit: notable
  conf: 0.99
  size_min: 512
  size_max: 52428800

traits:
  - id: libguestfs-soname
    desc: libguestfs virtualization library
    if:
      type: value
      path: elf.soname
      exact: libguestfs.so.0

  - id: libguestfs-test-tool
    desc: libguestfs diagnostic test tool
    for: [elf]
    if:
      type: basename
      exact: libguestfs-test-tool
