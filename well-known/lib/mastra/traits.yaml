# Identities for official Mastra npm libraries.  These are library
# context only: install hooks, network access, process execution, and file
# operations still need their own behavioral evidence.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: core-package-name
    desc: Mastra core npm package name
    if:
      type: value
      path: name
      exact: '@mastra/core'

  - id: mastra-monorepo-repository
    desc: Mastra monorepo source repository
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/mastra-ai/mastra(\.git)?$'

  # No `repository.directory` atoms here: `packages/core` is the workspace
  # layout of most npm monorepos (it matched intl-tel-input), so as a
  # well-known/ trait it asserted a Mastra identity from a generic path. The
  # scoped package name plus the mastra-ai/mastra repository URL already
  # identify these packages uniquely.
  - id: schema-compat-package-name
    desc: Mastra schema compatibility npm package
    if:
      type: value
      path: name
      exact: '@mastra/schema-compat'

composite_rules:
  - id: official-core-package
    desc: Official Mastra core package identity
    crit: notable
    conf: 0.99
    all:
      - id: core-package-name
      - id: mastra-monorepo-repository

  - id: official-schema-compat-package
    desc: Official Mastra schema compatibility package identity
    crit: notable
    conf: 0.99
    all:
      - id: schema-compat-package-name
      - id: mastra-monorepo-repository
