# robolectric/robolectric — the Android framework emulation and test runner.
# Its shadow classes and tests mirror Android platform APIs (SMS, telephony,
# connectivity, Wi-Fi Direct, Bluetooth, PackageInstaller) so JVM tests can
# exercise them. Those API references are the framework's own surface, not an
# app's behavior, so suspicious-tier API clusters can be suppressed when the
# file is framework source. Identity is the framework's own package declaration;
# consumer apps import org.robolectric.* but do not declare its packages.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: robolectric-framework-source
    desc: Declares a Robolectric framework package
    if:
      type: text
      regex: '(?m)^package org\.robolectric\.'
