# Official Vitest npm package identity.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: vitest-source-path
    desc: Vitest published source path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      regex: 'node_modules[\\/]vitest[\\/]'

  - id: vitest-package-name
    desc: Official Vitest npm package name
    if:
      type: value
      path: name
      exact: vitest

  - id: vitest-upstream-repository
    desc: Official Vitest GitHub repository
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/vitest-dev/vitest(\.git)?$'
