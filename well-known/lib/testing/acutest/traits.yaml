# Acutest (mity/acutest) — a single-header C/C++ unit-test framework that is
# vendored verbatim into a great many C projects (Unicorn Engine, Capstone,
# tinyusdz, FreeRADIUS, ...). Its runner reads TracerPid from
# /proc/self/status in acutest_is_tracer_present_() so it can skip its own
# crash handling and child-process forking when a developer is stepping
# through a test — a real debugger check, correctly detected, in a file that
# is not malware.
#
# Recognising the library ONCE here replaces the former per-project acutest
# workarounds (one for tinyusdz, one for FreeRADIUS, and Unicorn would have
# been the third). The suppressor below
# is deliberately hard to forge: it wants the upstream banner, the exact
# TEST_LIST expansion, AND dense acutest_ internal naming, all in the same
# file as the finding — i.e. the whole framework, not a pasted decoy comment.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 1.0

traits:
  - id: banner
    desc: Acutest upstream header banner
    if:
      type: text
      regex: 'Acutest\s+--\s+Another C/C\+\+ Unit Test'

  - id: test-list-macro
    desc: Acutest TEST_LIST macro expansion
    if:
      type: text
      substr: 'const struct acutest_test_ acutest_list_[]'

  - id: internal-symbols
    desc: Dense Acutest internal symbol naming
    count_min: 50
    if:
      type: text
      substr: acutest_

  - id: tracer-probe-function
    desc: Acutest tracer-present probe function
    if:
      type: text
      substr: acutest_is_tracer_present_

  - id: nng-test-list-macro
    desc: NNG Acutest fork TEST_LIST macro expansion
    if:
      type: text
      substr: 'const struct test_ test_list_[]'

  - id: nng-tracer-probe-function
    desc: NNG Acutest fork tracer-present probe function
    if:
      type: text
      substr: test_is_tracer_present_

composite_rules:
  - id: source-context
    desc: Recognized Acutest test-framework source
    crit: exception
    conf: 1.0
    all:
      - id: banner
      - id: test-list-macro
      - id: internal-symbols
      - id: tracer-probe-function

  - id: nng-fork-source-context
    desc: Recognized NNG Acutest fork source
    crit: exception
    conf: 1.0
    all:
      - id: banner
      - id: nng-test-list-macro
      - id: nng-tracer-probe-function
