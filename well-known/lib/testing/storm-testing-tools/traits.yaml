# @storm-software/testing-tools — Jest/Nx testing helpers for Storm-Ops workspaces.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: package-name
    desc: Storm testing-tools npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@storm-software/testing-tools'

  - id: upstream-repository
    desc: Storm-Ops monorepo repository
    for: [package.json, javascript, typescript, markdown]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/storm-software/storm-ops(\.git)?$'

  - id: declare-package-preset-path
    desc: Storm testing-tools Jest preset path
    for: [javascript, typescript]
    if:
      type: text
      substr: '@storm-software/testing-tools/jest/preset'

  - id: declare-package-export
    desc: Storm declarePackage Jest helper export
    for: [javascript, typescript]
    if:
      type: text
      substr: declarePackage

composite_rules:
  - id: storm-testing-tools-package
    desc: Storm Software testing-tools Jest package
    crit: notable
    conf: 0.99
    scope: archive
    for: [npm, package.json, javascript, typescript, markdown]
    all:
      - id: package-name
    any:
      - id: declare-package-preset-path
      - id: upstream-repository
