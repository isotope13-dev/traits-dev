defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  crit: notable
  conf: 1.0
traits:
- id: header-banner
  desc: Doctest single-header framework banner
  if:
    type: text
    substr: doctest.h - the lightest feature-rich C++ single-header testing framework
- id: include-guard
  desc: Doctest single-header include guard
  if:
    type: text
    substr: DOCTEST_LIBRARY_INCLUDED
- id: debugger-helper
  desc: Doctest debugger helper implementation
  if:
    type: text
    regex: bool\s+isDebuggerActive\s*\(
