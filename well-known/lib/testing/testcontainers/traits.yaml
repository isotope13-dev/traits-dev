# Testcontainers — integration-test container orchestration (JVM, Go, Node).
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, java, go, go.mod]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: testcontainers-package-path
    desc: Testcontainers Java package path
    for: [class, java_class, java, go, go.mod]
    if:
      type: text
      substr: org/testcontainers/

  - id: testcontainers-go-module
    desc: Testcontainers Go module path
    for: [go, go-mod]
    if:
      type: text
      substr: github.com/testcontainers/testcontainers-go

  - id: testcontainers-node-scoped-package
    desc: Testcontainers Node scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@testcontainers/'

  - id: testcontainers-node-monorepo-repository
    desc: Testcontainers Node monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/testcontainers/testcontainers-node(\.git)?'

composite_rules:
  - id: testcontainers-node-monorepo-package-context
    desc: Official Testcontainers Node monorepo package
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: testcontainers-node-scoped-package
      - id: testcontainers-node-monorepo-repository
