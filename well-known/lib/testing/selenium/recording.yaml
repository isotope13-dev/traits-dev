# Selenium browser-recording workflows.
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: selenium-browser-recording-context
    desc: Selenium browser recorder source context
    crit: exception
    conf: 0.99
    for: [python]
    scope: file
    all:
      - id: well-known/lib/testing/selenium::python-webdriver-import
      - id: metadata/package/scripts/lifecycle::browser-recording-workflow-marker
