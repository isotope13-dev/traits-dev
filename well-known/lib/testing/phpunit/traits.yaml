defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  - composer.json
  - zip
  crit: notable
  conf: 0.99
traits:
- id: composer-package-name
  desc: PHPUnit Composer package name
  for:
  - composer.json
  if:
    type: value
    path: name
    exact: phpunit/phpunit
- id: source-tree
  desc: PHPUnit source tree
  for:
  - php
  - zip
  if:
    type: path
    substr: sebastianbergmann-phpunit-
- id: legacy-testcase-class-reference
  desc: Legacy PHPUnit TestCase class reference
  for:
  - php
  conf: 0.98
  if:
    type: text
    word: PHPUnit_Framework_TestCase
- id: selenium-coverage-request-format
  desc: Selenium coverage request URL format
  for:
  - php
  conf: 0.98
  if:
    type: literal
    kind: string
    substr: '%s?PHPUNIT_SELENIUM_TEST_ID=%s'
- id: selenium-coverage-error-text
  desc: Selenium coverage fetch error text
  for:
  - php
  conf: 0.98
  if:
    type: literal
    kind: string
    substr: Empty or invalid code coverage data received from url
composite_rules:
- id: selenium-coverage-retrieval-context
  desc: PHPUnit Selenium coverage retrieval context
  crit: exception
  conf: 0.99
  for:
  - php
  all:
  - id: selenium-coverage-request-format
  - id: selenium-coverage-error-text
