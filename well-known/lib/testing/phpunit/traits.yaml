# PHPUnit is a legitimate PHP unit-testing framework.  Its runtime queries
# the PHP environment while loading tests, so the package identity provides a
# narrow benign context for generic fingerprinting heuristics.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json, zip]
  crit: notable
  conf: 0.99

traits:
  - id: composer-package-name
    desc: PHPUnit Composer package name
    for: [composer.json]
    if:
      type: value
      path: name
      exact: phpunit/phpunit

  - id: source-tree
    desc: PHPUnit source tree
    for: [php, zip]
    if:
      type: path
      substr: sebastianbergmann-phpunit-

  - id: legacy-testcase-class-reference
    desc: Legacy PHPUnit TestCase class reference
    for: [php]
    conf: 0.98
    if:
      type: text
      word: PHPUnit_Framework_TestCase

  # PHPUnit_Selenium's RemoteCoverage fetches serialized code-coverage from
  # the operator-configured coverage URL of the system under test and
  # unserializes it. Both literals below are parser-extracted string
  # constants, so neither fires on a comment mention. Together they identify
  # that coverage-retrieval logic rather than a bare class or token name.
  - id: selenium-coverage-request-format
    desc: Selenium coverage request URL format
    for: [php]
    conf: 0.98
    if:
      type: literal
      kind: string
      substr: '%s?PHPUNIT_SELENIUM_TEST_ID=%s'
  - id: selenium-coverage-error-text
    desc: Selenium coverage fetch error text
    for: [php]
    conf: 0.98
    if:
      type: literal
      kind: string
      substr: 'Empty or invalid code coverage data received from url'

composite_rules:
  - id: phpunit-source-context
    desc: Recognized PHPUnit source package context
    crit: exception
    conf: 0.99
    any:
      - id: source-tree
      - id: composer-package-name
  - id: selenium-coverage-retrieval-context
    desc: PHPUnit Selenium coverage retrieval context
    crit: exception
    conf: 0.99
    for: [php]
    all:
      - id: selenium-coverage-request-format
      - id: selenium-coverage-error-text
