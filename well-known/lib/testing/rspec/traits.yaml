defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: rspec-core-source-path
    desc: RSpec Core source path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'rspec/core'
  - id: rspec-core-module
    desc: RSpec Core module marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bmodule\s+RSpec\b|\bRSpec::Core\b'

composite_rules:
  - id: rspec-core-library
    desc: RSpec Core Ruby testing framework
    crit: notable
    conf: 0.98
    all:
      - id: rspec-core-source-path
      - id: rspec-core-module
