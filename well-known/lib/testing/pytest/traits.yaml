defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: pytest-package-path
    desc: pytest package path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])_pytest[\\/]'

  - id: pytest-standalone-template
    desc: pytest standalone script template
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'class DictImporter\(object\):[\s\S]{0,500}def find_module'

  - id: pytest-genscript-runner
    desc: pytest standalone script generator or entrypoint
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(@SOURCES@|pytest\.cmdline\.main\(\))'

composite_rules:
  - id: pytest-standalone-context
    desc: pytest standalone script template context
    crit: exception
    conf: 0.98
    all:
      - id: pytest-standalone-template
    any:
      - id: pytest-package-path
      - id: pytest-genscript-runner
