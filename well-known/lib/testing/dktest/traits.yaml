# github.com/dhui/dktest — Go helper for Docker-backed integration tests.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: dktest Go module path
    if:
      type: text
      substr: github.com/dhui/dktest

  - id: source-archive-path
    desc: dktest module source archive path
    for: [go, zip]
    if:
      type: path
      regex: 'dhui/dktest@'
