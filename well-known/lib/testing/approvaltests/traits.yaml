defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - powershell
  - markdown
  - text
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000
traits:
- id: package-name
  desc: Official approvals npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: approvals
- id: approvaltests-github-url
  desc: ApprovalTests GitHub or raw content URL
  for:
  - powershell
  - text
  - markdown
  if:
    type: text
    substr: approvals/Approvals.NodeJS
- id: jaybazuzi-machine-setup-url
  desc: Jay Bazuzi machine setup script URL
  for:
  - powershell
  - text
  - markdown
  if:
    type: text
    substr: raw.githubusercontent.com/JayBazuzi/machine-setup
