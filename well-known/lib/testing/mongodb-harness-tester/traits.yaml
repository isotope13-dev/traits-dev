defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  - json
  - text
  crit: notable
  conf: 0.95
traits:
- id: mongodb-harness-tester-package-name
  desc: mongodb-js harness-tester npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@mongodb-js/harness-tester'
- id: mongodb-mcp-server-github-repo
  desc: mongodb-mcp-server GitHub repository URL
  if:
    type: text
    substr: mongodb-js/mongodb-mcp-server
- id: mongodb-harness-tester-import
  desc: MongoDB harness-tester package import
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: '@mongodb-js/harness-tester'
- id: mongodb-harness-tester-class-name
  desc: MongoDB coding agent harness class name
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \b(CodexHarnessConfig|ClaudeHarnessConfig|CodexTuiHarness|ClaudeTuiHarness)\b
- id: mongodb-mcp-agent-e2e-marker
  desc: MongoDB MCP server agent e2e test marker
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: MongoDB MCP server agent e2e test
