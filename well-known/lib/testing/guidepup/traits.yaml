# Guidepup — Screen reader automation library for testing (VoiceOver, NVDA).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: guidepup-package-name
    desc: guidepup npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@guidepup/guidepup"

  - id: guidepup-github-repo
    desc: guidepup GitHub repository URL
    for: [package.json]
    if:
      type: text
      substr: "github.com/guidepup/guidepup"

  - id: guidepup-docs-url
    desc: guidepup documentation URL
    for: [javascript, typescript]
    if:
      type: text
      substr: "guidepup.dev/docs"

  - id: guidepup-nvda-channel
    desc: guidepup NVDA client channel marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 'channel: "guidepup"'

  - id: guidepup-macos-applications-context
    desc: Guidepup macOS application enum context
    crit: notable
    conf: 0.99
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(Applications\["VoiceOver"\]|VoiceOver)\s*=\s*"VoiceOver"'

  - id: guidepup-windows-quit-context
    desc: Guidepup Windows taskkill quit helper context
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [javascript, typescript]
    if:
      type: text
      substr: 'WshShell.Run "taskkill /im '

composite_rules:
  - id: guidepup-package
    desc: Guidepup screen reader testing package
    crit: notable
    conf: 0.98
    for: [npm, package.json]
    scope: outer
    any:
      - id: guidepup-package-name
      - id: guidepup-github-repo

  - id: guidepup-nvda-tls-context
    desc: Guidepup NVDA client local TLS context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    any:
      - id: guidepup-nvda-channel
      - id: guidepup-docs-url
