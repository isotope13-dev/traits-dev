# Enzyme — JavaScript testing utilities for React.
# Official packages in the Enzyme project live in the airbnb/enzyme (now enzymejs/enzyme)
# monorepo. Individual enzyme-adapter-* and helper packages do not share the repository
# basename with the monorepo root, and their README files use product headings and link
# sibling packages.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Enzyme official package name
    if:
      type: value
      path: name
      regex: '^enzyme(-adapter-(react-[0-9.]+|utils)|-example-[a-z0-9-]+)?$'

  - id: npm-package-name
    desc: Enzyme official npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^enzyme(-adapter-(react-[0-9.]+|utils)|-example-[a-z0-9-]+)?$'

  - id: github-repository-string
    desc: Enzyme GitHub repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https?://github\.com/(airbnb|enzymejs)/enzyme(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Enzyme GitHub repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https?://github\.com/(airbnb|enzymejs)/enzyme(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Enzyme GitHub npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https?://github\.com/(airbnb|enzymejs)/enzyme(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-name
    desc: Enzyme official package name
    crit: exception
    scope: archive
    any:
      - id: package-name
      - id: npm-package-name

  - id: official-package-repo
    desc: Enzyme official package repository
    crit: exception
    scope: archive
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-package-repository-pair
    desc: Official Enzyme package repository pairing
    crit: exception
    scope: archive
    all:
      - id: official-package-name
      - id: official-package-repo
