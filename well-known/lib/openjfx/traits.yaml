# OpenJFX source identity.  Browser and graphics source naturally contain
# networking, UI, serialization, and build APIs without being an implant.
defaults:
  platforms: [unix, windows]
  for: [c, java]
  crit: baseline
  conf: 0.98

traits:
  - id: openjfx-source-tree
    desc: OpenJFX module source tree
    if:
      type: path
      regex: 'javafx\.(base|controls|fxml|graphics|media|swing|web)[\\/]'

  # WebKit's build/test helpers are source tooling too, but use shell/Perl/
  # Python/Ruby analyzers rather than the C/Java analyzer.
  - id: openjfx-tooling-tree
    desc: OpenJFX source-tree tooling file
    for: [shell, perl, python, ruby]
    if:
      type: path
      regex: 'jfx21u-[^\\/]+[\\/]'

composite_rules:
  - id: openjfx-source-context
    desc: OpenJFX source or tooling tree
    crit: notable
    conf: 0.98
    any:
      - id: openjfx-source-tree
      - id: openjfx-tooling-tree
