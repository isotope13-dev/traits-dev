defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: component
  conf: 0.98
  size_max: 5000000
traits:
- id: official-source-header
  desc: Official Ultralytics source header
  crit: notable
  if:
    type: text
    regex: Ultralytics.{0,40}AGPL-3\.0 License - https://ultralytics\.com/license
- id: yolo-source-header
  desc: Ultralytics YOLO Python source header
  crit: notable
  if:
    type: text
    regex: '(?im)^#\s*Ultralytics YOLO\b.{0,80}AGPL-3\.0 license\b'
- id: triton-remote-model-class
  desc: Ultralytics Triton remote model adapter
  crit: notable
  if:
    type: text
    regex: '(?m)^class\s+TritonRemoteModel\b'
- id: triton-model-config-fetch
  desc: Triton model-server configuration fetch
  crit: notable
  if:
    type: text
    substr: get_model_config

composite_rules:
- id: triton-server-metadata-eval
  desc: Triton client evaluates model-server metadata
  crit: hostile
  conf: 0.99
  attack: "T1059.006,T1195.002"
  mbc: B0024
  near_bytes: 3000
  all:
  - id: triton-remote-model-class
  - id: triton-model-config-fetch
  - id: objectives/execution/interpreter/eval/remote::eval-chained-get
