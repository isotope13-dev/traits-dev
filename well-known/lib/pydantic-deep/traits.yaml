# pydantic-deep — Python deep-agent framework (Pydantic AI, skills, memory).
defaults:
  platforms: [unix, windows]
  for: [python, markdown, json]
  crit: notable
  conf: 0.98

traits:
  - id: pydantic-deep-package-name
    desc: pydantic-deep Python package name
    if:
      type: text
      regex: '(?i)\bpydantic[-_]deep\b'

  - id: pydantic-deep-import
    desc: pydantic_deep module import
    if:
      type: text
      substr: from pydantic_deep

  - id: pydantic-deep-config-dir
    desc: pydantic-deep per-project config directory
    if:
      type: text
      substr: .pydantic-deep/

composite_rules:
  - id: pydantic-deep-package-context
    desc: pydantic-deep agent framework identity
    crit: notable
    all:
      - id: pydantic-deep-package-name
      - id: pydantic-deep-import
