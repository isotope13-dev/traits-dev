defaults:
  platforms: [windows, unix, macos]
  crit: notable
  conf: 0.99

traits:
  - id: kde-framework-windows-library
    desc: KDE Frameworks Windows runtime library
    for: [pe, dll]
    platforms: [windows]
    if:
      type: basename
      regex: '(?i)^(KF6[A-Za-z0-9]+|KirigamiControls|org_kde_desktop)\.dll$'

  - id: kde-kpackage-translation-catalog
    desc: KDE KPackage translation catalog
    for: [data, kotlin]
    if:
      type: path
      basename: true
      exact: libkpackage6.mo
