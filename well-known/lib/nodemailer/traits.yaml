# Nodemailer is the de-facto Node.js SMTP client library (used by tens of
# thousands of packages). Recognizing the dependency is a neutral identity
# fact; sending mail is the library's whole purpose, so intent has to come
# from the composites that pair this with a credential or recon source.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, package.json]
  crit: notable
  conf: 0.95

traits:
  # Relocated from well-known/tool/development/github-action-send-mail
  # (2026-08). The matcher only proves "this project imports or declares
  # nodemailer" -- it fired on @bobfrankston/mailx's own outbound mail module,
  # which is not a GitHub Action. The action identity is still assembled in
  # that directory, which now references this atom.
  - id: nodemailer-package-reference
    desc: Imports or declares the Nodemailer package
    if:
      type: text
      regex: '(?i)\b(from|require)\b.{0,24}nodemailer|nodemailer.{0,24}:'
    unless:
      - id: well-known/lib/ts-compiler-lib::typescript-compiler-lib-context
