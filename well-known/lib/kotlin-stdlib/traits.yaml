# JetBrains Kotlin standard library identity.
#
# Kotlin stdlib classes routinely expose file traversal, process-adjacent, and
# encoding primitives.  Naming the library improves triage without excusing
# those behaviors or treating a kotlin.* namespace as trusted code.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 100000000

traits:
  - id: kotlin-stdlib-manifest
    desc: Kotlin standard library JAR manifest
    for: [jar]
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: kotlin-stdlib

  - id: kotlin-stdlib-class
    desc: Kotlin standard library class namespace
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '^kotlin/'

  - id: kotlin-stdlib-jar-path
    desc: Kotlin standard library JAR path
    if:
      type: path
      regex: '(^|[\\/])kotlin-stdlib-[0-9][^\\/]*\.jar'

composite_rules:
  - id: kotlin-stdlib-library
    desc: Kotlin standard library component
    crit: notable
    conf: 0.99
    any:
      - id: kotlin-stdlib-manifest
      - id: kotlin-stdlib-class
      - id: kotlin-stdlib-jar-path
