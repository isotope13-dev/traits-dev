defaults:
  platforms: [unix, windows]
  for: [go]
  conf: 0.99

traits:
  - id: source-directory
    desc: VMware govmomi source directory
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])govmomi(@|[\\/]|$)'
  - id: vim-api-directory
    desc: VMware vim API types directory
    crit: notable
    if:
      type: path
      # Module paths may be vim/api@version/... (Go module version suffix).
      regex: 'vim[\\/]api'
  - id: broadcom-source-marker
    desc: Broadcom govmomi source marker
    crit: notable
    if:
      type: text
      substr: '© Broadcom. All Rights Reserved.'

composite_rules:
  - id: govmomi-source-context
    desc: Vendored VMware govmomi source context
    crit: exception
    all:
      - id: source-directory
      - id: broadcom-source-marker
  - id: vim-api-source-context
    desc: Vendored VMware vim API types context
    crit: exception
    all:
      - id: vim-api-directory
      - id: broadcom-source-marker
