# cloudevents — official CNCF CloudEvents JavaScript SDK.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: CloudEvents npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cloudevents

  - id: upstream-repository
    desc: CloudEvents JS SDK repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/cloudevents/sdk-javascript
