# Microsoft azure-devops-node-api — Azure DevOps / TFS REST client.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: azure-devops-node-api npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: azure-devops-node-api

  - id: repository-url
    desc: azure-devops-node-api source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: https://github.com/Microsoft/azure-devops-node-api

  - id: vendored-path
    desc: azure-devops-node-api package path
    for: [javascript]
    if:
      type: path
      regex: '(^|[\\/])azure-devops-node-api([\\/]|$)'

  - id: git-api-client-id
    desc: Azure DevOps Git API client id
    for: [javascript]
    if:
      type: text
      substr: "'node-Git-api'"

composite_rules:
  - id: azure-devops-node-api-client
    desc: Azure DevOps Node REST API client
    any:
      - id: package-name
      - id: repository-url
      - id: vendored-path
      - id: git-api-client-id
