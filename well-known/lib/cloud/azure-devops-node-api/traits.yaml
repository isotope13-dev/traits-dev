# Microsoft azure-devops-node-api — Azure DevOps / TFS REST client.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: azure-devops-node-api npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: azure-devops-node-api

  - id: repository-url
    desc: azure-devops-node-api source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: https://github.com/Microsoft/azure-devops-node-api

composite_rules:
  - id: azure-devops-node-api-client
    desc: Azure DevOps Node REST API client
    all:
      - id: package-name
      - id: repository-url
