# pycognito — AWS Cognito authentication helper for Python (pvizeli/pycognito).
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-package-name
    desc: pycognito Python wheel package name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: pycognito

  - id: github-homepage
    desc: pycognito GitHub project homepage
    if:
      type: value
      path: home-page
      regex: '(?i)github\.com/pvizeli/pycognito'

  - id: cognito-idp-client-usage
    desc: AWS Cognito IDP boto3 client usage
    for: [python]
    if:
      type: text
      substr: client("cognito-idp")

  - id: package-member-path
    desc: pycognito package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])pycognito[\\/]'

composite_rules:
  - id: pycognito-aws-cognito-library
    desc: pycognito AWS Cognito Python authentication library
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: wheel-package-name
      - id: github-homepage
      - id: package-member-path
      - id: cognito-idp-client-usage
