defaults:
  platforms:
  - unix
  - windows
  for:
  - data
  - json
  - source
  - scripts
  crit: notable
  conf: 0.97
  size_max: 200000000
traits:
- id: aws-service-model
  desc: AWS endpoint and Amazon service-model name
  if:
    type: text
    regex: '"endpointPrefix"[\s\S]{0,500}"serviceFullName"\s*:\s*"(Amazon|AWS)'
# Smithy JSON AST models (aws/api-models-aws and forks) describe each service's
# operations with the vendor's own documentation and examples embedded, including
# the canned AllUsers/AuthenticatedUsers group URIs used in S3 ACL examples.
- id: smithy-service-model
  desc: Smithy JSON service model
  if:
    type: text
    regex: '\A\s*\{\s*"smithy"\s*:\s*"[0-9.]{1,6}"'
# AWS service model documentation example tables (models/apis/*/examples-1.json,
# botocore/data/*/examples-1.json) embed SDK input/output examples for operations,
# including canned AllUsers/AuthenticatedUsers group URIs used in S3 ACL examples.
- id: aws-service-model-examples
  desc: AWS service model documentation examples
  if:
    type: text
    regex: '\A\s*\{\s*"version"\s*:\s*"[0-9.]+"\s*,\s*"examples"\s*:\s*\{'

