defaults:
  platforms:
  - unix
  - windows
  for:
  - data
  - json
  - source
  - scripts
  crit: notable
  conf: 0.97
  size_max: 200000000
traits:
- id: aws-service-model
  desc: AWS endpoint and Amazon service-model name
  if:
    type: text
    regex: '"endpointPrefix"[\s\S]{0,500}"serviceFullName"\s*:\s*"(Amazon|AWS)'
