# The AWS API service model, embedded as data by every AWS SDK in every
# language. Each `service-2.json` carries AWS's own documentation prose in its
# `documentation` fields, and that prose names the things AWS services do to
# machines: EC2's shutdown behaviour documents `shutdown -h`, Shield lists
# `ACK_FLOOD` and `UDP_REFLECTION` among its attack-type enums, GuardDuty and
# Inspector describe malware and Defender logging. The impact, DoS and
# indicator-removal objectives fire on the reference data, in whichever SDK
# happens to vendor it -- the Lua binding api7-lua-resty-aws hit three at once.
#
# Keyed on the model's own envelope rather than on any one SDK's package name,
# because the file is copied verbatim into all of them.
defaults:
  platforms: [unix, windows]
  # The model ships as JSON and is also vendored verbatim into SDK source in
  # every language AWS publishes a binding for.
  for: [data, source, scripts]
  crit: notable
  conf: 0.97
  size_max: 200000000

traits:
  - id: service-model-endpoint-prefix
    desc: AWS API model endpoint prefix field
    if:
      type: text
      regex: '"endpointPrefix"\s*:\s*"'

  - id: service-model-service-name
    desc: AWS API model service name field
    if:
      type: text
      regex: '"(serviceFullName|serviceId)"\s*:\s*"'

composite_rules:
  - id: aws-service-model
    desc: Embedded AWS API service model
    crit: notable
    conf: 0.98
    all:
      - id: service-model-endpoint-prefix
      - id: service-model-service-name
