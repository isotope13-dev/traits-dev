# Identity markers for Amazon Kinesis Producer Library (KPL) native daemon.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000

traits:
  - id: kinesis-producer-source-path
    desc: Amazon Kinesis Producer C++ source path
    if:
      type: text
      substr: "/kpl/aws/kinesis/core/kinesis_producer.cc"
      section: .rodata

  - id: kinesis-producer-user-agent
    desc: Amazon Kinesis Producer User-Agent literal
    if:
      type: text
      substr: "KinesisProducerLibrary/"
      section: .rodata

composite_rules:
  - id: amazon-kinesis-producer-daemon
    desc: Amazon Kinesis Producer native daemon
    all:
      - id: kinesis-producer-source-path
      - id: kinesis-producer-user-agent
