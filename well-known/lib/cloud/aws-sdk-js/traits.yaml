defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  crit: notable
  conf: 0.98

traits:
  - id: v2-package-path
    desc: AWS SDK JS v2 package path
    if:
      type: path
      regex: '(^|[\\/])aws-sdk-[0-9][^\\/]*\.tgz$'

  - id: v2-package-lib-path
    desc: AWS SDK JS v2 package lib path
    if:
      type: path
      regex: 'aws-sdk-[0-9][^\\/]*[\\/]package'

  - id: package-manifest
    desc: AWS SDK JS package manifest
    for: [package.json]
    if:
      type: value
      path: name
      exact: aws-sdk

  - id: v3-scoped-package-name
    desc: AWS SDK JS v3 scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@aws-sdk/'

  - id: v3-official-repository
    desc: AWS SDK JS v3 official repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/aws/aws-sdk-js-v3(\.git)?$'

  - id: v3-official-author
    desc: AWS SDK JS v3 official author name
    for: [package.json]
    if:
      type: value
      path: author.name
      exact: AWS SDK for JavaScript Team

  - id: v2-client-loader
    for: [javascript, typescript]
    desc: AWS SDK JS v2 generated client loader
    if:
      type: text
      regex: 'var Service = AWS\.Service;[\s\S]{0,80}var apiLoader = AWS\.apiLoader;'

  - id: v2-typescript-service
    for: [javascript, typescript]
    desc: AWS SDK JS v2 TypeScript service declaration
    if:
      type: text
      regex: "import \\{Service\\} from '../lib/service';[\\s\\S]{0,180}extends Service"

  - id: v3-imds-endpoint-marker
    desc: AWS SDK JS v3 IMDS endpoint
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: AWS_EC2_METADATA_SERVICE_ENDPOINT

  - id: v3-imds-credential-path
    desc: AWS SDK JS v3 IMDS credential path
    crit: baseline
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: /latest/meta-data/iam/security-credentials/

  - id: v3-package-member-path
    desc: AWS SDK JS v3 package member path
    crit: notable
    conf: 0.99
    for: [javascript, typescript, package.json]
    if:
      type: path
      regex: '(^|[^A-Za-z0-9_-])aws-sdk[\\/]'

  - id: smithy-package-member-path
    desc: Smithy JS runtime package member path
    crit: notable
    conf: 0.99
    for: [javascript, typescript, package.json]
    if:
      type: path
      regex: '(^|[^A-Za-z0-9_-])smithy[\\/]'

  - id: smithy-typescript-codegen-schema
    desc: Smithy TypeScript codegen schema module
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: smithy.ts.sdk.synthetic.

  # v3 is published as one scoped package per service, so a bundle carries the
  # scope rather than a single SDK path.
  - id: aws-sdk-js-v3-bundle
    for: [javascript, typescript]
    desc: AWS SDK JS v3 bundle
    conf: 0.96
    if:
      type: text
      regex: '@aws-sdk/(client-[a-z0-9-]+|credential-providers?|signature-v4)'

  # v3 service clients are codegen barrels: each service root re-exports its
  # *Command classes from a sibling commands/ directory. Tarball member paths
  # strip the @aws-sdk scope (root is package/) and dist bundles resolve the
  # scope away, so this import layout is the member-local SDK signal.
  - id: v3-client-command-barrel
    for: [javascript, typescript]
    desc: AWS SDK JS v3 client command barrel
    conf: 0.97
    if:
      type: text
      regex: 'from\s+["'']\./commands/[A-Za-z]+Command["'']'

composite_rules:
  - id: aws-sdk-js-v3-official-package-context
    desc: Recognized official AWS SDK JS v3 npm package
    crit: notable
    conf: 0.99
    scope: archive
    for: [package.json, npm]
    all:
      - id: v3-scoped-package-name
      - id: v3-official-repository
      - id: v3-official-author

  - id: aws-sdk-js-archive-context
    desc: Recognized AWS SDK for JavaScript v2 package context
    crit: notable
    conf: 0.99
    scope: archive
    for: [javascript, typescript, npm, package.json]
    any:
      - id: package-manifest
      - id: v2-package-path

  - id: aws-sdk-js-member-context
    desc: Recognized AWS SDK JS v2 member file context
    for: [javascript, typescript, npm, package.json]
    crit: notable
    conf: 0.99
    any:
      - id: v2-package-lib-path
      - id: package-manifest
      - id: v2-client-loader

  - id: aws-sdk-js-v3-imds-provider
    desc: Recognized AWS SDK JS v3 IMDS credential provider context
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: v3-imds-endpoint-marker
      - id: v3-imds-credential-path


