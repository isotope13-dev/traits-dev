# Fog — the Ruby cloud services library (fog, fog-core, fog-aws, fog-azure-rm,
# gitlab-fog-azure-rm, fog-google, etc.).
# Fog provides an object storage and cloud resource abstraction layer across
# providers. Its service classes declare standard request methods (such as
# `request :copy_object` and `request :delete_object`) in their DSL, which are
# interface registrations rather than a ransomware move-and-destroy sequence.
defaults:
  platforms:
    - windows
    - unix
  for:
    - ruby
    - tar
    - gem
  crit: notable
  conf: 0.95

traits:
  - id: package-path
    desc: Fog package path marker
    if:
      type: path
      case_insensitive: true
      regex: '(^|[\\/])(gitlab-)?fog(-[a-z0-9_-]+)?\.(gem|tar|tar\.gz)(:|$)'

  - id: gem-name
    desc: Fog gem name
    for:
      - gem
    if:
      type: value
      path: gem.name
      regex: '^(gitlab-)?fog(-[a-z0-9_-]+)?$'

  - id: namespace
    desc: Fog Ruby namespace marker
    for:
      - ruby
    if:
      type: text
      regex: '\bmodule\s+Fog\b'

  - id: service-base-class
    desc: Fog service base class marker
    for:
      - ruby
    if:
      type: text
      regex: 'class\s+\w+\s*<\s*Fog::Service\b'

  - id: request-path-registration
    desc: Fog request path registration marker
    for:
      - ruby
    if:
      type: text
      regex: '\brequest_path\s+[''"]fog\/'

composite_rules:
  - id: fog-cloud-library-context
    desc: Recognized Fog cloud library source or package context
    crit: exception
    conf: 0.99
    any:
      - id: package-path
      - id: gem-name
      - id: namespace
      - id: service-base-class
      - id: request-path-registration
