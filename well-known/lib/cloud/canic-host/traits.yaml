# canic-host — host-side build, install, fleet, and release-set library
# for Canic Internet Computer workspaces (dragginzgame/canic). Cargo/icp
# process exec, replica HTTP, and README curl|bash installer docs are
# product, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: crate-name
    desc: canic-host crate archive package name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: canic-host

  - id: crate-repository
    desc: canic-host crate repository URL
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/dragginzgame/canic

  - id: cargo-package-name
    desc: canic-host Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: canic-host

  - id: github-repo
    desc: dragginzgame canic GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/dragginzgame/canic

  - id: product-description
    desc: canic-host host-side library description
    conf: 0.97
    if:
      type: text
      substr: 'Host-side build, install, fleet, and release-set'

composite_rules:
  - id: canic-host-library
    desc: canic-host ICP host-side library
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: crate-name
      - id: crate-repository
      - id: cargo-package-name
      - id: github-repo
      - id: product-description
