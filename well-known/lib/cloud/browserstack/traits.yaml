defaults:
  platforms: [unix, windows]
  for: [gem, ruby, tar, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: gem-name
    desc: BrowserStack Ruby SDK gem name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: browserstack-ruby-sdk

  - id: gem-homepage
    desc: BrowserStack Ruby SDK gem homepage
    for: [gem]
    if:
      type: value
      path: gem.homepage
      exact: https://github.com/browserstack/browserstack-ruby-sdk

  - id: readme-heading
    desc: BrowserStack Ruby SDK README heading
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: BrowserStack Ruby SDK

  - id: upstream-repository
    desc: BrowserStack Ruby SDK repository reference
    if:
      type: text
      regex: 'github\.com/browserstack/browserstack-ruby-sdk([./[:space:]"''`]|$)'

  # Release documentation declares an obfuscated gem build. This shallow,
  # extraction-stable path is the leaf-local context used to suppress only
  # generic decoder-wrapper objectives on the SDK sources themselves.
  - id: package-member-path
    desc: BrowserStack Ruby SDK source path
    for: [ruby]
    if:
      type: path
      regex: '(^|[\\/])browserstack([\\/]|_sdk[.]rb$|_plugin[.]rb$)'

composite_rules:
  - id: gem-package
    desc: Recognized BrowserStack Ruby SDK gem
    crit: notable
    conf: 0.99
    for: [gem]
    all:
      - id: gem-name
      - id: gem-homepage

  - id: source-package
    desc: Recognized BrowserStack Ruby SDK source
    crit: notable
    conf: 0.99
    for: [markdown]
    all:
      - id: readme-heading
      - id: upstream-repository
