# AWS SDK for .NET. The core assembly name is linked into every managed
# binary that uses the SDK.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  # A managed assembly linking the SDK; the floor skips stubs too small to
  # hold an import table, the ceiling keeps it off bundled runtime images.
  size_min: 4096
  size_max: 200000000
traits:
  - id: aws-sdk-dotnet-core
    desc: AWS SDK for .NET Core assembly
    if:
      type: text
      substr: AWSSDK.Core
      section: .text
