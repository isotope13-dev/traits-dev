defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  - typescript
  - markdown
  crit: notable
  conf: 0.98
traits:
- id: qbraid-core-scoped-npm-name
  desc: qBraid core scoped npm package name
  for:
  - npm
  if:
    type: value
    path: npm.name
    regex: ^@qbraid-core/
- id: qbraid-core-scoped-package-json-name
  desc: qBraid core scoped package.json name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^@qbraid-core/
- id: qbraid-core-js-upstream-repository-npm
  desc: qBraid core-js npm archive repository field
  for:
  - npm
  if:
    type: value
    path: npm.repository.url
    substr: github.com/qBraid/qbraid-core-js
- id: qbraid-core-js-upstream-repository-text
  desc: qBraid core-js monorepo GitHub repository marker
  for:
  - javascript
  - typescript
  - markdown
  - package.json
  if:
    type: text
    substr: github.com/qBraid/qbraid-core-js
- id: qbraid-static-brand-asset-host
  desc: qBraid README static logo on S3
  for:
  - markdown
  - documents
  - javascript
  - typescript
  if:
    type: text
    substr: qbraid-static.s3.amazonaws.com
- id: qbraid-sdk-config-root-require
  desc: qBraid SDK config module requires package root
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: qBraid Development Team[\s\S]{0,360}require\(["']\.\.?["']\)
