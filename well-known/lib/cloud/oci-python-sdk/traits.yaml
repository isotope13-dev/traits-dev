# Oracle OCI Python SDK — official cloud client with Kubernetes
# workload-identity and resource-principal auth helpers.
defaults:
  platforms: [unix, windows]
  for: [python, tar, zip, archives, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: archive-member-path
    desc: OCI Python SDK archive member path
    if:
      type: path
      regex: '(?i)oci-python-sdk-[0-9]'

  - id: k8s-workload-identity-token-path
    desc: OCI Python SDK k8s token path constant
    for: [python]
    if:
      type: text
      substr: OCI_KUBERNETES_SERVICE_ACCOUNT_TOKEN_PATH

  - id: resource-principal-marker
    desc: OCI resource principal auth marker
    for: [python]
    if:
      type: text
      substr: OCI_RESOURCE_PRINCIPAL_RPT_PATH

composite_rules:
  - id: oci-python-sdk-context
    desc: Official Oracle OCI Python SDK context
    crit: notable
    conf: 0.99
    any:
      - id: archive-member-path
      - id: k8s-workload-identity-token-path
      - id: resource-principal-marker
