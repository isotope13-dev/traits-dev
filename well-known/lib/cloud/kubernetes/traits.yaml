defaults:
  size_max: 20000000
  crit: baseline
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: kubernetes-example-or-operator-path
    desc: Kubernetes example or operator path
    conf: 0.9
    for: [shell, go]
    if:
      type: path
      regex: '(^|[\\/])(helmchart-samples|operator)[\\/]'
  - id: kubernetes-incluster-client-text
    desc: Kubernetes in-cluster client text
    conf: 0.9
    # A statically linked Go controller carrying client-go is 40-80 MB.
    size_max: 150000000
    if:
      type: text
      regex: 'kubernetes\.default\.svc|KUBERNETES_SERVICE_HOST'
composite_rules:
  - id: legitimate-kubernetes-incluster-client-marker
    desc: Kubernetes in-cluster client context
    crit: notable
    conf: 0.93
    size_max: 150000000
    any:
      - id: kubernetes-example-or-operator-path
      - id: kubernetes-incluster-client-text
      - id: metadata/build/generated::kubernetes-python-openapi-client-source
      - id: metadata/build/generated::kubernetes-node-openapi-client-source
