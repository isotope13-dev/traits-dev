# The Rust `object_store` crate -- a uniform API over S3, Azure Blob and GCS.
# A statically linked binary keeps the crate's source paths, version and all,
# in its panic metadata. Its provider modules reference every cloud credential
# environment variable by design, so naming the crate is what separates a data
# tool from a cloud-credential stealer.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.95
  # A linked Rust binary; the crate path cannot appear in anything smaller.
  size_min: 100000
traits:
  - id: rust-object-store-crate
    desc: Rust object_store crate
    if:
      type: text
      regex: '[/\\]object_store-\d+\.\d+\.\d+[/\\]src[/\\]'
  - id: rust-object-store-cloud-provider
    desc: Rust object_store cloud provider
    if:
      type: text
      regex: '[/\\]object_store-\d+\.\d+\.\d+[/\\]src[/\\](aws|azure|gcp)[/\\]'
composite_rules:
  - id: rust-cloud-object-store-sdk
    desc: Rust cloud object store SDK context
    crit: notable
    conf: 0.98
    all:
      - id: rust-object-store-crate
    any:
      - id: rust-object-store-cloud-provider
      - id: well-known/lib/cloud/aws-sdk-rust::rust-aws-config-crate
