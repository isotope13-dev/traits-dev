defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: auth-js-web3-module
    desc: Supabase Auth Web3 module
    if:
      type: text
      substr: node_modules/@supabase/auth-js/dist/module/lib/web3/ethereum.js

  - id: storage-js-package-reference
    desc: References the Supabase JS SDK package
    if:
      type: text
      regex: '@supabase/(storage-js|supabase-js)|new StorageClient\('

  - id: supabase-anon-jwt-constant
    desc: Supabase public anon JWT constant
    crit: notable
    conf: 0.95
    # Either quote style: extensions that vendor the SDK by hand write the
    # constant with single quotes just as often as double.
    if:
      type: text
      regex: 'SUPABASE_ANON_KEY\s*=\s*[''"]eyJ[A-Za-z0-9_-]+\.'

  # Bundled/minified supabase-js keeps the per-sub-client `X-Client-Info` header
  # it stamps on every request, so these survive webpack and identify a vendored
  # copy that carries no package path. Without them a hand-vendored
  # `libs/supabase.js` reads as an anonymous 100KB blob doing OAuth PKCE, token
  # storage, WebSockets and pre-signed uploads — the shape of a session stealer.
  # The four sub-clients are variants of one identity, not separate signals.
  - id: supabase-js-client-info-header
    desc: Bundled Supabase JS SDK client header
    if:
      type: text
      regex: 'X-Client-Info["'']?\s*:\s*[`"'']?(gotrue|postgrest|realtime|storage)-js/'

  - id: supabase-api-version-header
    desc: Supabase API version request header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-Supabase-Api-Version
