# go.opentelemetry.io otlptracegrpc — official OTLP gRPC trace exporter.
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: module-path
    desc: OpenTelemetry OTLP gRPC exporter module
    if:
      type: text
      substr: go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc

  - id: source-archive-path
    desc: OTLP gRPC exporter module source path
    for: [go, zip]
    if:
      type: path
      regex: 'otlptrace/otlptracegrpc@'
