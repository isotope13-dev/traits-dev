# smithy-go -- the AWS Smithy runtime that the generated Go SDK clients are
# built on. Its module path is linked into any binary using aws-sdk-go-v2.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, pe, elf, macho]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 600000000
traits:
  - id: smithy-go-sdk
    desc: Smithy Go module path
    if:
      type: text
      substr: github.com/aws/smithy-go
