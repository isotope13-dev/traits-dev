# Azure Storage SDK for JavaScript (@azure/storage-blob, -file-share, -queue,
# -file-datalake, @azure/storage-common). The SDK legitimately parses account
# keys out of connection strings, computes HMAC-SHA256 request signatures and
# mints SAS tokens; naming the library keeps those credential and crypto
# capabilities attributable instead of reading as a stealer.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Azure Storage JavaScript SDK package name
    if:
      type: value
      path: name
      regex: '^@azure/storage-(blob|queue|file-share|file-datalake|common|internal-avro)$'

  - id: package-reference
    desc: Azure Storage JavaScript SDK package reference
    if:
      type: text
      regex: '@azure/storage-(blob|queue|file-share|file-datalake|common)'

  - id: shared-key-credential-symbol
    desc: Azure StorageSharedKeyCredential symbol
    for: [javascript, typescript]
    if:
      type: text
      word: StorageSharedKeyCredential

  - id: sas-signature-values-symbol
    desc: Azure SAS signature-values builder symbol
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(Blob|Account|Container)SASSignatureValues\b'

composite_rules:
  - id: azure-storage-js-sdk
    desc: Azure Storage SDK for JavaScript
    any:
      - id: package-name
      - id: package-reference
      - id: shared-key-credential-symbol
      - id: sas-signature-values-symbol
