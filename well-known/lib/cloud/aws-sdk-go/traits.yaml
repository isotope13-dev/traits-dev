# AWS SDK for Go v1 library identity.  The SDK intentionally implements
# environment, shared-file, process, and EC2 metadata credential providers;
# those APIs remain visible as capabilities, but the package identity keeps
# generic malware signatures from calling the SDK itself a stealer.
defaults:
  platforms: [unix, windows]
  for: [zip, go, go.mod, markdown, json, github-actions, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: archive-member-path
    desc: AWS SDK Go v1 archive member path
    for: [zip, go, go.mod, markdown, json, github-actions]
    if:
      type: path
      regex: '(?i)aws-sdk-go@v1[.]'

  # The v1 module path is a strict prefix of the v2 one, so both matchers
  # below must reject a trailing `-v2`; an unanchored substring reported every
  # aws-sdk-go-v2 checkout as also containing the v1 SDK.
  - id: module-path
    desc: AWS SDK for Go v1 module declaration
    for: [go.mod, go]
    if:
      type: text
      regex: '(?m)^module github[.]com/aws/aws-sdk-go[ \t]*$'

  - id: source-import
    desc: AWS SDK for Go v1 source import
    for: [go]
    if:
      type: text
      regex: 'github[.]com/aws/aws-sdk-go/'

  - id: repository-reference
    desc: AWS SDK for Go v1 repository reference
    for: [markdown, json, github-actions]
    if:
      type: text
      regex: 'github[.]com/aws/aws-sdk-go([^-\w]|$)'

composite_rules:
  - id: aws-sdk-go-context
    desc: Recognized AWS SDK for Go v1 source context
    crit: notable
    conf: 0.99
    any:
      - id: archive-member-path
      - id: module-path
      - id: source-import
      - id: repository-reference
