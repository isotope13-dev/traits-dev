# gRPC C++ core library embeds Google Default Credentials lookup paths
# (`gcloud/application_default_credentials.json`, `GOOGLE_APPLICATION_CREDENTIALS`)
# in `src/core/lib/security/credentials/google_default/`.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.95
  size_min: 100000

traits:
  - id: grpc-core-source-path
    desc: gRPC C++ core source path
    if:
      type: text
      regex: '[/\\]grpc[/\\]src[/\\]core[/\\]'

  - id: grpc-status-details-bin
    desc: gRPC status details binary header string
    if:
      type: text
      substr: grpc-status-details-bin

composite_rules:
  - id: grpc-core-library-context
    desc: gRPC C++ core library context
    crit: notable
    conf: 0.96
    all:
      - id: grpc-core-source-path
      - id: grpc-status-details-bin
