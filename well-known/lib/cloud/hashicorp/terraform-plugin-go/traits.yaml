# Go proxy archives preserve the canonical module path at the archive root.
# Match that structural identity rather than README text or generic Terraform
# protocol symbols, which also occur in downstream provider implementations.
defaults:
  platforms: [unix, windows]
  for: [zip]
  crit: notable
  conf: 0.99

traits:
  - id: module-archive
    desc: HashiCorp Terraform Plugin Go module archive
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/hashicorp/terraform-plugin-go@v[0-9][^/]*/go\.mod$'
