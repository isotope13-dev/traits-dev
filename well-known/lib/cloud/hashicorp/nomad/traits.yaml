# HashiCorp Nomad job specification markers.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: nomad-job-spec-marker
    desc: HashiCorp Nomad job specification marker
    if:
      type: text
      substr: '"TaskGroups"'

  - id: nomad-archive-basename
    desc: HashiCorp Nomad source archive basename
    for: [zip]
    if:
      type: basename
      regex: '(?i)github[.]com[_-]hashicorp[_-]nomad-v[0-9][^\\/]*[.]zip$'

  - id: nomad-member-path
    desc: HashiCorp Nomad source member path
    for: [go, scripts, binaries, json, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])nomad@v[0-9]'

composite_rules:
  - id: nomad-package-context
    desc: Recognized HashiCorp Nomad source archive context
    for: [json, zip]
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: nomad-job-spec-marker
      - id: nomad-archive-basename
      - id: nomad-member-path
