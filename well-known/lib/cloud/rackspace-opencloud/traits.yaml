# Rackspace OpenCloud PHP SDK (official SDK for Rackspace Cloud and OpenStack APIs).
# Includes example usage in class docblocks that display illustrative API credentials.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json]
  crit: notable
  conf: 0.98

traits:
  - id: rackspace-opencloud-path
    desc: Rackspace OpenCloud PHP SDK path
    if:
      type: path
      substr: rackspace/php-opencloud

  - id: rackspace-opencloud-namespace
    desc: Rackspace OpenCloud PHP namespace
    for: [php]
    if:
      type: text
      substr: 'namespace OpenCloud;'

composite_rules:
  - id: rackspace-opencloud-sdk
    desc: Rackspace OpenCloud PHP SDK
    any:
      - id: rackspace-opencloud-path
      - id: rackspace-opencloud-namespace
