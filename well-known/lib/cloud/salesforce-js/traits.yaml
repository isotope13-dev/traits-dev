# Salesforce Node libraries used by DX agents and metadata tools.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: salesforce-scoped-package-name
    desc: Salesforce scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@salesforce/'

  - id: salesforce-scoped-npm-archive-name
    desc: Salesforce scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@salesforce/'

  - id: platform-sdk-package-name
    desc: Salesforce platform SDK package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@salesforce/platform-sdk'

  - id: platform-sdk-npm-archive-name
    desc: Salesforce platform SDK npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@salesforce/platform-sdk'

  - id: platform-sdk-o11y-mcp-analytics
    desc: Salesforce platform SDK o11y analytics
    for: [javascript, typescript]
    if:
      type: text
      substr: o11y_schema/sf_mcpanalytics

  - id: platform-sdk-embedding-chat-sdk
    desc: Salesforce platform SDK embedding chat session
    for: [javascript, typescript]
    if:
      type: text
      substr: EmbeddingChatSDK

  - id: agentforce-conversation-client-package-name
    desc: Agentforce conversation client package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@salesforce/agentforce-conversation-client'

  - id: agentforce-conversation-client-npm-archive-name
    desc: Agentforce conversation client npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@salesforce/agentforce-conversation-client'

  - id: agentforce-lightning-out-dependency
    desc: Agentforce Lightning Out dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.@salesforce/lightning-out
      exists: true

  - id: agentforce-client-element-tag
    desc: Agentforce client custom element tag
    for: [javascript, typescript]
    if:
      type: text
      substr: runtime_copilot-acc-sdk-wrapper

  - id: salesforce-copyright-header
    desc: Salesforce copyright header
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: 'Copyright (c) 2026, Salesforce, Inc.'

  - id: agents-package-name
    desc: Salesforce agents npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@salesforce/agents'

  - id: agents-vendored-path
    desc: vendored Salesforce agents package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@salesforce/agents/'

  - id: core-vendored-path
    desc: vendored Salesforce core package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@salesforce/core/'

  - id: sdr-vendored-path
    desc: vendored source-deploy-retrieve path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@salesforce/source-deploy-retrieve/'

  - id: core-npm-archive-name
    desc: Salesforce core npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@salesforce/core'

  - id: sfdx-core-github-repository
    desc: Salesforce sfdx-core GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/forcedotcom/sfdx-core(\.git)?$'

  - id: sfdx-core-npm-github-repository
    desc: Salesforce sfdx-core npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/forcedotcom/sfdx-core(\.git)?$'

  - id: ui-bundle-package-name
    desc: Salesforce UI bundle npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@salesforce/ui-bundle'

  - id: ui-bundle-npm-archive-name
    desc: Salesforce UI bundle npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@salesforce/ui-bundle'

  - id: ui-bundle-proxy-handler
    desc: Salesforce UI bundle proxy handler class
    for: [javascript, typescript]
    if:
      type: text
      substr: UIBundleProxyHandler

  - id: ui-bundle-proxy-header
    desc: Salesforce UI bundle proxy request header
    for: [javascript, typescript]
    if:
      type: text
      substr: X-Salesforce-UIBundle-Proxy

  - id: ui-bundle-live-preview-marker
    desc: Salesforce UI bundle live preview marker
    for: [javascript, typescript]
    if:
      type: text
      substr: data-live-preview

composite_rules:
  - id: salesforce-scoped-package-identity
    desc: Official Salesforce scoped npm package
    crit: exception
    for: [package.json, npm]
    any:
      - id: salesforce-scoped-package-name
      - id: salesforce-scoped-npm-archive-name

  - id: platform-sdk-package-identity
    desc: Official Salesforce platform SDK package
    crit: notable
    conf: 0.99
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    needs: 2
    any:
      - id: platform-sdk-package-name
      - id: platform-sdk-npm-archive-name
      - id: platform-sdk-o11y-mcp-analytics
      - id: platform-sdk-embedding-chat-sdk

  - id: agentforce-conversation-client-identity
    desc: Official Agentforce conversation client SDK
    crit: notable
    conf: 0.99
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    needs: 2
    any:
      - id: agentforce-conversation-client-package-name
      - id: agentforce-conversation-client-npm-archive-name
      - id: agentforce-lightning-out-dependency
      - id: agentforce-client-element-tag
      - id: salesforce-copyright-header

  - id: official-core-package-identity
    desc: Official Salesforce core package identity
    crit: exception
    for: [package.json, npm]
    any:
      - id: well-known/tool/development/cli/salesforce-cli::salesforce-core-package-name
      - id: core-npm-archive-name

  - id: official-sfdx-core-repository
    desc: Official Salesforce sfdx-core repository
    crit: exception
    for: [package.json, npm]
    any:
      - id: sfdx-core-github-repository
      - id: sfdx-core-npm-github-repository

  - id: official-core-repository-pair
    desc: Official Salesforce core repository pairing
    crit: exception
    for: [package.json, npm]
    all:
      - id: official-core-package-identity
      - id: official-sfdx-core-repository

  - id: salesforce-ui-bundle-package
    desc: Official Salesforce UI bundle package
    crit: notable
    conf: 0.99
    any:
      - id: ui-bundle-package-name
      - id: ui-bundle-npm-archive-name
