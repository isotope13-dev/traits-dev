# Salesforce Node libraries used by DX agents and metadata tools.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: agents-package-name
    desc: Salesforce agents npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@salesforce/agents'

  - id: agents-vendored-path
    desc: vendored Salesforce agents package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@salesforce/agents/'

  - id: core-vendored-path
    desc: vendored Salesforce core package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@salesforce/core/'

  - id: sdr-vendored-path
    desc: vendored source-deploy-retrieve path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@salesforce/source-deploy-retrieve/'
