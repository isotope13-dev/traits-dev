# pipedream — official Pipedream Connect Python SDK (Fern-generated).
defaults:
  platforms: [windows, unix]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: PyPI package name pipedream
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*pipedream\s*$'

  - id: pipedream-sdk-github-repo
    desc: PipedreamHQ/pipedream-sdk-python repository URL
    if:
      type: text
      substr: PipedreamHQ/pipedream-sdk-python

  - id: fern-generated-client-module
    desc: Fern auto-generated Pipedream SDK client
    for: [python]
    if:
      type: text
      substr: auto-generated by Fern

composite_rules:
  - id: pipedream-sdk-package
    desc: Official Pipedream Connect Python SDK package
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: pkginfo-name
    any:
      - id: pipedream-sdk-github-repo
      - id: fern-generated-client-module
