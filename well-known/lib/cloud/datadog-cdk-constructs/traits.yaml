# datadog-cdk-constructs / datadog-cdk-constructs-v2 -- Datadog's AWS CDK
# construct library (jsii; published to npm, PyPI, NuGet and Maven). The
# package ships `lib/sample/` demo stacks, including an ECS Fargate stack whose
# "DummyCWS" container runs a simulated-malware command line so that Datadog
# Cloud Workload Security has events to report.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: datadog-cdk-constructs package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^datadog-cdk-constructs(-v2)?$'

  - id: sample-stack-path
    desc: Package sample directory
    for: [javascript, typescript]
    if:
      type: path
      regex: '(^|[\\/])sample[\\/]'

  - id: dummy-cws-container
    desc: Container declared as a dummy CWS workload
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)dummy[-_ ]?cws'

composite_rules:
  - id: sample-stack-context
    desc: Demo stack with a dummy CWS workload
    crit: exception
    conf: 0.98
    all:
      - id: sample-stack-path
      - id: dummy-cws-container
