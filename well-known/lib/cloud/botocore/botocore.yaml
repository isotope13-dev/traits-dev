defaults:
  size_max: 20000000
  platforms: [windows, unix]
  for: [python]
  crit: baseline

traits:
  - id: botocore-lib
    desc: botocore library detected
    crit: notable
    for: [binaries]
    if:
      type: text
      substr: botocore
      section: .text
  # Path under boto3|botocore marks official SDK package trees for FP
  # suppression. Kept as a single atom (not path+copyright composite): the
  # prior all: composite silently dropped matches on busy files like
  # inject.py/session.py once other notables fired.
  - id: aws-python-sdk-source
    desc: AWS SDK package source file
    crit: notable
    for: [python, pyc, json]
    if:
      type: path
      regex: '(?i)(^|[\\/])(botocore|boto3)([\\/]|$)'
  - id: botocore-service-data-tree
    desc: Botocore service data path
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: path
      regex: '(?i)botocore[\\/]data[\\/]'
  - id: botocore-example-json-basename
    desc: Botocore example JSON basename
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: path
      basename: true
      regex: '^examples-[0-9]+\.json$'
  - id: amazon-sdk-copyright
    desc: Amazon source copyright header
    if:
      type: text
      substr: 'Amazon.com, Inc. or its affiliates'

composite_rules:
  - id: botocore-library-source-context
    desc: Botocore library source context
    crit: notable
    conf: 0.96
    all:
      - id: botocore-lib
      - id: amazon-sdk-copyright
  - id: botocore-service-example-data
    desc: Botocore service example data
    crit: notable
    conf: 0.99
    for: [json]
    all:
      - id: botocore-service-data-tree
      - id: botocore-example-json-basename
