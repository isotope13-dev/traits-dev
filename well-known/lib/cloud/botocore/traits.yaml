# botocore is the low-level AWS SDK core distributed on PyPI.
defaults:
  platforms: [linux, macos, windows]
  for: [whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: botocore Python wheel distribution
    if:
      type: value
      path: whl.distribution
      exact: botocore
