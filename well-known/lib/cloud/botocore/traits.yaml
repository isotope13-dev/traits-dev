# botocore is the low-level AWS SDK core distributed on PyPI.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: botocore Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: botocore

  # SigV4 is how every AWS query-protocol caller signs requests. Tools that
  # proxy a signed STS request (machine-identity auth flows) legitimately
  # pair an x-www-form-urlencoded Content-Type with base64-wrapped body and
  # header material for server-side re-verification.
  - id: sigv4-auth-import
    desc: Imports botocore SigV4Auth request signer
    for: [python]
    if:
      type: import
      exact: 'SigV4Auth'

  - id: package-init-member
    desc: botocore package __init__ module member
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      exact: 'botocore/__init__.py'

  - id: package-path
    desc: botocore package source path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])botocore([\\/]|$)'

composite_rules:
  - id: botocore-aws-sdk-wheel-context
    desc: botocore AWS SDK wheel benign context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: wheel-distribution
      - id: package-init-member
