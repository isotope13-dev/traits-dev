# botocore is the low-level AWS SDK core distributed on PyPI.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: botocore Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: botocore

  - id: package-init-member
    desc: botocore package __init__ module member
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '^botocore/__init__\.py$'

  - id: package-path
    desc: botocore package source path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])botocore([\\/]|$)'

composite_rules:
  - id: botocore-wheel-context
    desc: Recognized botocore Python wheel
    crit: notable
    conf: 0.99
    for: [whl]
    all:
      - id: wheel-distribution
      - id: package-init-member

  - id: botocore-aws-sdk-wheel-context
    desc: botocore AWS SDK wheel benign context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: wheel-distribution
      - id: package-init-member
