# Upstash — serverless Redis / Kafka / Vector cloud (upstash.com).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, package.json]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 5000000

traits:
  - id: redis-host
    desc: Upstash Redis cloud hostname
    if:
      type: text
      substr: .upstash.io

  - id: npm-package
    desc: Upstash Redis npm package name
    if:
      type: text
      substr: '@upstash/redis'

composite_rules:
  - id: upstash-redis-client
    desc: Upstash Redis cloud client
    any:
      - id: redis-host
      - id: npm-package
