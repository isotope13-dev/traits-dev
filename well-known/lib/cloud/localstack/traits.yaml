# LocalStack -- a local emulator of the AWS cloud APIs.
#
# An emulator is the server side of the surface it emulates, so it necessarily
# implements every operation and parameter AWS exposes: RunInstances with
# UserData, Secrets Manager inventory calls, the managed-policy corpus. Those
# are the API being reimplemented, not a payload being built. Same reasoning the
# aws-sdk-go exclusion already carries for the client side.
#
# These markers identify the package; they do not make an actual credential
# theft, dropper, or exfiltration implementation inside it benign.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, python-sdist, tar, zip]
  crit: notable
  conf: 0.98

traits:
  - id: wheel-distribution-name
    desc: LocalStack wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '(?i)^localstack[-_](core|ext)$'
  - id: maintainer-email
    desc: LocalStack maintainer email domain
    if:
      type: text
      substr: 'info@localstack.cloud'
  - id: aws-api-tree-member
    desc: LocalStack generated AWS API tree member
    for: [whl, tar, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^localstack/aws/api/[a-z0-9_]+/__init__\.py$'
  - id: service-provider-tree-member
    desc: LocalStack service provider tree member
    for: [whl, tar, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^localstack/services/[a-z0-9_]+/provider\.py$'

composite_rules:
  # Two independent markers, so a package that merely mentions the name or
  # vendors one module does not inherit the identity.
  - id: localstack-package-context
    desc: Recognized LocalStack cloud-emulator package
    crit: notable
    conf: 0.98
    scope: outer
    needs: 2
    any:
      - id: wheel-distribution-name
      - id: maintainer-email
      - id: aws-api-tree-member
      - id: service-provider-tree-member
