# Tencent Cloud's .NET SDK is generated from service schemas. Names such as
# ReverseShell and SynFloodThreshold describe defensive API model properties;
# they are not implementations of those behaviors.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 1000000000

traits:
  - id: sdk-product-name
    desc: Tencent Cloud .NET SDK product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: TencentCloud

  - id: sdk-comments
    desc: Tencent Cloud API 3.0 .NET SDK metadata
    if:
      type: value
      path: pe.version.comments
      exact: Tencent Cloud API 3.0 SDK for .NET

composite_rules:
  - id: tencentcloud-dotnet-sdk
    desc: Tencent Cloud API 3.0 .NET SDK assembly
    all:
      - id: sdk-product-name
      - id: sdk-comments
