# firebase-admin — official Firebase Admin SDK for Node.js.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: firebase-admin-package-name
    desc: firebase-admin npm package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: firebase-admin

  - id: firebase-admin-homepage
    desc: Firebase product homepage marker
    for: [package.json, npm, javascript]
    if:
      type: text
      substr: firebase.google.com

  - id: firebase-admin-node-repository
    desc: firebase-admin-node upstream repository
    for: [package.json, npm]
    if:
      type: text
      substr: github.com/firebase/firebase-admin-node

composite_rules:
  - id: firebase-admin-sdk-context
    desc: Firebase Admin SDK for Node.js package
    crit: exception
    conf: 0.99
    any:
      - id: firebase-admin-package-name
      - id: firebase-admin-homepage
      - id: firebase-admin-node-repository
