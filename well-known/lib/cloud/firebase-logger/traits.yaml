# @firebase/logger — log helper used by the Firebase JS SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Firebase JS logger package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@firebase/logger'

  - id: vendored-path
    desc: vendored Firebase logger package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@firebase/logger/'
