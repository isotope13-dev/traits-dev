# Capo — Python SDK for AWS generated from Smithy models (capo-*)
defaults:
  platforms: [linux, macos, windows]
  for: [python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: Capo AWS SDK Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '^capo[-_]'

  - id: package-path
    desc: Capo AWS SDK package source path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])capo_[a-z0-9_]+[\\/]'

  - id: smithy-codegen-shape
    desc: Smithy AWS service shape codegen header
    for: [python]
    if:
      type: text
      substr: 'Generated from Smithy shape ``com.amazonaws.'

composite_rules:
  - id: capo-aws-sdk-context
    desc: Capo AWS SDK client library context
    any:
      - id: wheel-distribution
      - id: package-path
      - id: smithy-codegen-shape
