# OneReach SDK npm package family.  This is library identity/context only;
# HTTP requests and token handling remain visible through neutral behavior
# traits so a compromised release is not treated as trusted.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: OneReach SDK npm package namespace
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@or-sdk/[a-z0-9._-]+$'

  - id: archive-package-name
    desc: OneReach SDK npm archive namespace
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      regex: '^@or-sdk/[a-z0-9._-]+$'

  - id: package-member-context
    desc: OneReach SDK package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      regex: '^@or-sdk/[a-z0-9._-]+$'

  - id: module-import
    desc: OneReach SDK module import path
    for: [javascript, typescript]
    if:
      type: import
      regex: '^@or-sdk/[a-z0-9._-]+(/.*)?$'

composite_rules:
  - id: onereach-sdk-library-context
    desc: Recognized OneReach SDK package context
    crit: notable
    conf: 0.98
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: module-import
