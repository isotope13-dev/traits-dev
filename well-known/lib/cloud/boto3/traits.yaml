# boto3 — the AWS SDK for Python (https://github.com/boto/boto3).
# High-level resource/session layer over botocore. Identify the official
# wheel so S3/credential helpers defined by the SDK are not treated as
# application reconnaissance or exfil.
defaults:
  platforms: [linux, macos, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: boto3 Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: boto3

  - id: package-init-member
    desc: boto3 package __init__ module member
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '^boto3/__init__\.py$'

  - id: default-session-setup
    desc: boto3 default session setup helper
    for: [python]
    if:
      type: text
      substr: 'def setup_default_session('

  - id: upstream-repository
    desc: boto3 upstream repository
    if:
      type: text
      substr: github.com/boto/boto3

composite_rules:
  - id: boto3-wheel-context
    desc: Recognized boto3 Python wheel
    crit: notable
    conf: 0.99
    for: [whl]
    all:
      - id: wheel-distribution
      - id: package-init-member

  - id: boto3-aws-sdk-wheel-context
    desc: boto3 AWS SDK wheel benign context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: wheel-distribution
      - id: package-init-member
