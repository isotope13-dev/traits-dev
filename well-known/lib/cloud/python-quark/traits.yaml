# python-quark — PyPI client for Quark Cloud Drive (夸克网盘).
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo, text]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: wheel-distribution
    desc: python-quark wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: python_quark

  - id: github-repo
    desc: python-quark GitHub repository URL
    for: [pkginfo, text]
    conf: 0.98
    if:
      type: text
      substr: github.com/ChenyangGao/python-quark

  - id: pc-drive-api-host
    desc: Quark Cloud Drive PC API host
    for: [python, text]
    conf: 0.97
    if:
      type: text
      substr: drive-pc.quark.cn
