# Microsoft Graph client SDK surface. The SDKs are machine-generated from
# the Graph OpenAPI description, so one file declares every endpoint path,
# attachment shape and MIME union. Those declaration strings co-occur here
# by generation breadth, not by runtime dead-drop behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  # Tool-inserted comment fingerprint, not hand-written code. Matched on raw
  # text because generator banners live in comments, not string literals.
  - id: openapi-typescript-discriminator-marker
    desc: openapi-typescript discriminator marker
    if:
      type: text
      substr: discriminator enum property added by openapi-typescript

composite_rules:
  - id: generated-graph-declarations
    desc: Generated Graph API declarations file
    crit: exception
    conf: 0.99
    all:
      - id: openapi-typescript-discriminator-marker
      - id: micro-behaviors/communications/http/services/microsoft::microsoft-graph-domain
