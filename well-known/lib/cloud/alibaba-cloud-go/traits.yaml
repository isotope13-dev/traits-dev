# Alibaba Cloud Go SDK source and module archive identity.
defaults:
  platforms: [unix, windows]
  for: [go, zip]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: Alibaba Cloud Go SDK module archive path
    if:
      type: path
      regex: 'alibaba-cloud-sdk-go@v[0-9]'

  - id: module-import
    desc: Alibaba Cloud Go SDK import path
    for: [go]
    if:
      type: import
      substr: github.com/aliyun/alibaba-cloud-sdk-go

composite_rules:
  - id: alibaba-cloud-go-library
    desc: Alibaba Cloud Go SDK library
    any:
      - id: archive-path
      - id: module-import
