# oss2 is the official Aliyun OSS (Object Storage Service) Python SDK.
defaults:
  platforms: [unix, windows]
  for: [python, python-sdist, tar, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name-setup
    desc: oss2 setuptools package name
    for: [python-sdist, tar, python]
    if:
      type: text
      regex: "(?m)^\\s*name\\s*=\\s*['\"]oss2['\"]"

  - id: package-init-member
    desc: oss2 package init module member
    for: [tar, python-sdist]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|[\\/])oss2[\\/]__init__\.py$'

  - id: package-init-path
    desc: oss2 package source path
    for: [python, tar]
    if:
      type: path
      regex: '(^|[\\/])oss2[\\/]'

  - id: aliyun-oss-sdk-description
    desc: Aliyun OSS SDK description marker
    for: [python-sdist, tar, text, python]
    if:
      type: text
      substr: Aliyun OSS (Object Storage Service) SDK

composite_rules:
  - id: oss2-sdk-source-context
    desc: Recognized Aliyun oss2 SDK source tree
    crit: exception
    conf: 0.99
    scope: outer
    for: [python, python-sdist, tar, text]
    all:
      - id: package-init-member
    any:
      - id: package-name-setup
      - id: aliyun-oss-sdk-description
