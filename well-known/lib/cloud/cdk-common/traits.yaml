# cdk-common — Neil Kuan's reusable AWS CDK construct library.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, manifests, data, archives]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 200000000

traits:
  - id: package-name
    desc: cdk-common package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cdk-common

  - id: jsii-bundle-path
    desc: cdk-common jsii bundle path
    if:
      type: path
      regex: '(^|[\\/])cdk[-_]common(@|[\\/])'

composite_rules:
  - id: cdk-common-library
    desc: cdk-common construct library
    any:
      - id: package-name
      - id: jsii-bundle-path
