# Official Google Cloud Node.js client libraries (@google-cloud/*).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: resource-manager-package-string
    desc: Google Cloud Resource Manager JS package
    for: [javascript, typescript]
    if:
      type: text
      substr: '@google-cloud/resource-manager'

  - id: bigquery-package-string
    desc: Google Cloud BigQuery JS package
    for: [javascript, typescript]
    if:
      type: text
      substr: '@google-cloud/bigquery'

  - id: cloud-platform-oauth-scope
    desc: Google Cloud platform OAuth scope URL
    for: [javascript, typescript]
    if:
      type: text
      substr: googleapis.com/auth/cloud-platform

  - id: vendor-google-cloud-path
    desc: Bundled @google-cloud JavaScript vendor path
    if:
      type: path
      substr: '@google-cloud/'

composite_rules:
  - id: google-cloud-js-vendor-bundle
    desc: Bundled Google Cloud JS client with OAuth scope
    all:
      - id: vendor-google-cloud-path
      - id: cloud-platform-oauth-scope
  - id: google-cloud-js-client
    desc: Google Cloud official JavaScript client
    needs: 2
    any:
      - id: resource-manager-package-string
      - id: bigquery-package-string
      - id: google-cloud-js-vendor-bundle
      - id: vendor-google-cloud-path
      - id: cloud-platform-oauth-scope
