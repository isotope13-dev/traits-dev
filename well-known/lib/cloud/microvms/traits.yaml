# microvms napi client for AWS Lambda MicroVMs. The linux addon embeds the
# guest upload helper (`mktemp -d /tmp/.microvms-upload-…`, `/bin/sh`,
# `echo 'unknown upload operation'`). Those strings are the sandbox
# staging script, not a native addon dropping a host shell.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 80000000

traits:
  - id: guest-upload-mktemp
    desc: MicroVM guest upload directory template
    if:
      type: text
      substr: mktemp -d /tmp/.microvms-upload-
      section: .rodata

  - id: domain-crate-path
    desc: MicroVM domain crate source path
    if:
      type: text
      substr: crates/microvms-domain/
      section: .rodata

composite_rules:
  - id: official-native-addon
    desc: Official MicroVM native addon
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: guest-upload-mktemp
      - id: domain-crate-path
