# boto pyami installers configure EC2 AMI packages (MySQL, Apache, etc.)
# and legitimately stop services during image customization.
defaults:
  platforms: [unix, windows]
  for: [python, whl, gem]
  crit: notable
  conf: 0.98

traits:
  - id: boto-pyami-installer-path
    desc: boto pyami EC2 AMI installer script path
    if:
      type: path
      substr: pyami/installers

  - id: boto-pyami-installer-import
    desc: boto pyami installer module import
    for: [python]
    if:
      type: text
      substr: boto.pyami.installers

composite_rules:
  - id: boto-pyami-installer-context
    desc: boto pyami EC2 AMI installer source
    crit: notable
    conf: 0.99
    any:
      - id: boto-pyami-installer-path
      - id: boto-pyami-installer-import
