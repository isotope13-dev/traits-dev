# Auto-generated cloud SDK / API-client model surfaces (googleapiclient,
# apitools, protorpc). Used as benign-context exclusions for objectives that
# otherwise fire on dense docstring annotations in generated clients.
defaults:
  platforms: [unix, windows]
  for: [python]
  conf: 0.95

traits:
  - id: dense-epydoc-type-annotations
    desc: "Dense Sphinx/epydoc :type: field annotations"
    crit: component
    conf: 0.9
    count_min: 15
    if:
      type: text
      regex: ":type \\w{1,40}:"

  - id: cloud-sdk-codegen-marker-google
    desc: Google API client / apitools codegen marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)(googleapiclient|apitools\.base|discovery_cache)'

  - id: cloud-sdk-codegen-marker-proto
    desc: Protobuf / protorpc API-model codegen marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)(protorpc|_messages\.Message|Code generated by the protocol buffer)'

  # The other generated shape: a Smithy/botocore-style API *model* module, which
  # carries no docstrings at all -- just the service's type graph. One scalar
  # alias per named shape (`NameType = str`, `MaxResultsType = int`) is what a
  # model generator emits and what nobody writes by hand at this density.
  - id: dense-scalar-type-aliases
    desc: Dense run of scalar type aliases
    crit: component
    conf: 0.92
    count_min: 15
    if:
      type: text
      # `= str` only: a model generator emits one alias per named string shape,
      # and counting a single alternative keeps the tally unambiguous.
      regex: '(?m)^[A-Za-z_]\w{1,60} = str$'

  - id: typed-dict-shape-declaration
    desc: TypedDict request/response shape
    crit: component
    conf: 0.9
    if:
      type: text
      word: 'TypedDict'

composite_rules:
  - id: annotated-cloud-client-module
    desc: Generated cloud client with dense type annotations
    crit: notable
    conf: 0.95
    # Dense :type: annotations alone are ordinary Sphinx docstrings. Require a
    # codegen/cloud-client marker before treating the file as generated API
    # model surface.
    all:
      - id: dense-epydoc-type-annotations
    any:
      - id: cloud-sdk-codegen-marker-google
      - id: cloud-sdk-codegen-marker-proto

  # Neither leg is conclusive alone -- a hand-written module may use TypedDict,
  # and a constants module may alias a few scalars -- but 15+ scalar aliases
  # beside TypedDict shapes is a generated service model. localstack ships one
  # per emulated AWS service (localstack/aws/api/<service>/__init__.py: 43
  # aliases, 33 TypedDicts), which is why it read as a secret-inventory client.
  - id: generated-api-shape-module
    desc: Generated API shape model module
    crit: notable
    conf: 0.95
    all:
      - id: dense-scalar-type-aliases
      - id: typed-dict-shape-declaration

  - id: cloud-sdk-api-model
    desc: Auto-generated cloud-SDK API-model code
    crit: notable
    conf: 0.95
    any:
      - id: annotated-cloud-client-module
      - id: generated-api-shape-module
