# Databricks SDK for JavaScript/TypeScript (@databricks/sdk-core).
# The published dist omits some declared runtime helpers (for example
# json-bigint) that other entrypoints or generated clients consume.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Databricks scoped npm package identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@databricks/sdk-core'

  - id: scoped-npm-package-identity
    desc: Databricks scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@databricks/sdk-core'

  - id: databricks-author
    desc: Databricks npm package author
    for: [package.json]
    if:
      type: value
      path: author
      exact: Databricks

  - id: clientinfo-module
    desc: Databricks clientinfo module export
    for: [javascript, typescript]
    if:
      type: text
      substr: export { agentProvider, clearAgentCache, lookupAgentProvider }

  - id: profile-resolver
    desc: Databricks databrickscfg profile resolver
    for: [javascript, typescript]
    if:
      type: text
      substr: isPhantomDefault

composite_rules:
  - id: package-identity
    desc: Official Databricks sdk-core package identity
    crit: notable
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity
    all:
      - id: databricks-author

  - id: package-context
    desc: Official Databricks sdk-core package context
    crit: exception
    any:
      - id: package-identity
      - id: clientinfo-module
