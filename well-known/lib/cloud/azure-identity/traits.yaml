# Azure Identity SDK for JavaScript. These identity signals distinguish the
# SDK's legitimate CLI execution and cloud-token flows from credential theft.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: managed-identity-imds-label
    desc: Azure managed identity IMDS label
    for: [javascript, typescript]
    if:
      type: literal
      exact: ManagedIdentityCredential - IMDS

  - id: package-path
    desc: Azure Identity package path
    if:
      type: path
      substr: '@azure/identity'

composite_rules:
  - id: azure-identity-js-sdk
    for: [javascript, typescript]
    desc: Azure Identity JavaScript SDK
    # A package mention in an advisory is not SDK identity. Require the
    # implementation's diagnostic label as well as package context.
    all:
      - id: managed-identity-imds-label
    any:
      - id: metadata/lang/source/naming/resource::azure-identity-package-reference
      - id: package-path
