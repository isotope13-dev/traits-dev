# Tencent Cloud HCM PHP SDK. This generated client submits arithmetic-problem
# images to Tencent's HCM evaluation API and deserializes the service response.
defaults:
  platforms: [unix, windows]
  for: [composer.json, php, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: composer-package-name
    desc: Tencent Cloud HCM PHP SDK package name
    for: [composer.json]
    if:
      type: value
      path: name
      exact: tencentcloud/hcm

  - id: hcm-client-namespace
    desc: Tencent Cloud HCM versioned client namespace
    for: [php]
    if:
      type: text
      substr: 'namespace TencentCloud\Hcm\V20181106;'

  - id: hcm-service-endpoint
    desc: Tencent Cloud HCM API service endpoint
    for: [php, markdown]
    if:
      type: text
      substr: hcm.tencentcloudapi.com

composite_rules:
  - id: hcm-php-sdk
    desc: Tencent Cloud HCM PHP SDK
    any:
      - id: composer-package-name
      - id: hcm-client-namespace
      - id: hcm-service-endpoint
