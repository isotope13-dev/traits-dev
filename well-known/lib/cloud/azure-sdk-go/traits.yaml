# Azure SDK for Go. The module path is linked into any binary using it.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, pe, elf, macho]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 600000000
traits:
  - id: azure-go-sdk
    desc: Azure SDK for Go module path
    if:
      type: text
      substr: github.com/Azure/azure-sdk-for-go/
