# Identity markers for the AWS SDK for C++ (aws-sdk-cpp). Statically-linked
# copies ship inside ordinary cloud client libraries -- Apache Arrow's S3
# filesystem, language SDKs with a native layer -- so these symbols identify
# the embedded SDK, not attacker infrastructure. The SDK's own POSIX
# diagnostics also call popen (OS-version lookup for the User-Agent header),
# which is the benign explanation for a popen import in a cloud client dylib.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, dylib, so, dll, pe]
  crit: notable
  conf: 0.95
  size_min: 4096
  size_max: 500000000

traits:
  - id: osversioninfo-sys-command-output
    desc: AWS SDK C++ GetSysCommandOutput symbol
    conf: 0.97
    if:
      # Matches the mangled (`__ZN3Aws13OSVersionInfo19GetSysCommandOutputEPKc`)
      # and demangled spellings alike; the Aws::OSVersionInfo namespace makes
      # the token family-specific.
      type: symbol
      substr: GetSysCommandOutput
