# AWS SDK for Go v2 library identity. Generated service clients implement
# Describe* discovery and export APIs by design; package identity keeps those
# neutral capabilities from being scored as attacker discovery bursts.
defaults:
  platforms: [unix, windows]
  for: [zip, go, go.mod, markdown, json, github-actions, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: archive-member-path
    desc: AWS SDK Go v2 archive member path
    for: [zip, go, go.mod, markdown, json, github-actions]
    if:
      type: path
      regex: '(?i)aws-sdk-go-v2/'

  - id: module-path
    desc: AWS SDK for Go v2 module declaration
    for: [go.mod, go]
    if:
      type: text
      substr: 'module github.com/aws/aws-sdk-go-v2'

  - id: source-import
    desc: AWS SDK for Go v2 source import
    for: [go]
    if:
      type: text
      regex: 'github[.]com/aws/aws-sdk-go-v2/'

  - id: repository-reference
    desc: AWS SDK for Go v2 repository reference
    for: [markdown, json, github-actions]
    if:
      type: text
      substr: 'github.com/aws/aws-sdk-go-v2'

composite_rules:
  - id: aws-sdk-go-v2-context
    desc: Recognized AWS SDK for Go v2 source context
    crit: notable
    conf: 0.99
    any:
      - id: archive-member-path
      - id: module-path
      - id: source-import
      - id: repository-reference
