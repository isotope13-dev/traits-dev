defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
traits:
  - id: buildspec-from-object-text
    desc: BuildSpec.fromObject text
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: BuildSpec.fromObject
composite_rules:
  - id: buildspec-object-s3-script-env
    desc: BuildSpec object and S3 script names
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    all:
      - type: trait
        id: metadata/lang/source/naming/variable::script-s3-bucket-or-key-name
      - type: trait
        id: well-known/lib/cloud/aws-cdk::buildspec-from-object-text
