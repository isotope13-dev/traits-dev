# @firebase/component — component container for the Firebase JS SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Firebase JS component package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@firebase/component'

  - id: vendored-path
    desc: vendored Firebase component path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@firebase/component/'
