defaults:
  platforms:
  - windows
  - unix
  for:
  - package.json
  - javascript
  - typescript
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: electron-publish npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: electron-publish
- id: aws-credential-provider
  desc: Electron publish AWS credential provider
  for:
  - javascript
  - typescript
  if:
    type: text
    word: resolveAwsCredentials
- id: bitbucket-publisher
  desc: Electron publish Bitbucket publisher
  for:
  - javascript
  - typescript
  if:
    type: text
    word: BitbucketPublisher
- id: gitlab-publisher
  desc: Electron publish GitLab publisher
  for:
  - javascript
  - typescript
  if:
    type: text
    word: GitlabPublisher
