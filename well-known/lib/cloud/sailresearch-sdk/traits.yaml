# @sailresearch/sdk-* — official napi-rs addon for Sail sandbox VMs.
# The guest image starts a CA-pinned sshd; /bin/sh and tmp writes are
# sandbox exec/staging, not a native-addon dropper.
defaults:
  platforms: [linux]
  for: [elf, package.json, npm]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 80000000

traits:
  - id: npm-package-name
    desc: Sail research SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@sailresearch/sdk-'

  - id: sail-user-ca-path
    desc: Sail sandbox SSH user CA path
    for: [elf]
    if:
      type: text
      substr: /etc/ssh/sail_user_ca.pub
      section: .rodata

composite_rules:
  - id: official-native-addon
    desc: Official Sail sandbox native addon
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/framework::node-api-addon-export
      - id: sail-user-ca-path
