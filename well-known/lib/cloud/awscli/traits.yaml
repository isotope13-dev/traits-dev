# awscli — official AWS Command Line Interface (PyPI awscli wheel).
defaults:
  platforms: [linux, macos, windows]
  for: [whl, python]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 200000000

traits:
  - id: wheel-distribution
    desc: awscli Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: awscli

  - id: package-init-member
    desc: awscli package __init__ module member
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      exact: awscli/__init__.py

composite_rules:
  - id: awscli-wheel-context
    desc: Official AWS CLI wheel benign context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: wheel-distribution
      - id: package-init-member
