# AWS Amplify Auth and direct AWS Cognito authentication helpers.
# The Cognito provider builds the Cognito Hosted UI logout URL from the
# developer-configured user-pool domain with client_id and logout_uri,
# which matches the generic dynamic host logout template. The markers below
# identify that SDK and IdP configuration logic.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  # `logout_uri` is the Cognito Hosted UI logout query parameter (Auth0 uses
  # `returnTo`, Okta uses `post_logout_redirect_uri`).
  - id: cognito-logout-uri-param
    desc: Cognito logout URI query parameter
    if:
      type: text
      word: logout_uri
  # Amplify feature code imports shared helpers from the core internals
  # entrypoint rather than inlining them.
  - id: amplify-core-internals-import
    desc: Amplify core internals import
    if:
      type: literal
      kind: string
      substr: '@aws-amplify/core/internals/utils'

composite_rules:
  - id: amplify-cognito-signout-context
    desc: Amplify Cognito sign-out context
    crit: exception
    conf: 0.99
    all:
      - id: cognito-logout-uri-param
      - id: amplify-core-internals-import

  - id: cognito-hosted-ui-signout-context
    desc: Cognito Hosted UI sign-out context
    crit: exception
    conf: 0.98
    near_bytes: 512
    all:
      - id: cognito-logout-uri-param
      - id: metadata/lang/source/naming/setting::client-id-token
