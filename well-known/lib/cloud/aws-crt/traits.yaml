# AWS Common Runtime native/JNI library identity.
# These paths identify the upstream AWS CRT library shipped as a dependency;
# they are context for its documented S3/TLS/credential-provider capabilities,
# not evidence that the containing program is exfiltrating data.
defaults:
  platforms: [unix, windows]
  for: [jar, binaries]
  crit: notable
  conf: 0.98
  size_min: 100
  size_max: 100000000

traits:
  - id: jar-package-path
    desc: AWS CRT JAR package path
    for: [jar]
    if:
      type: path
      basename: true
      regex: '^aws-crt-[^/]+\.jar$'
  - id: native-library-path
    desc: AWS CRT JNI native library path
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '^(lib)?aws-crt-jni\.(so|dylib|dll)$'
  - id: node-native-addon-path
    desc: AWS CRT Node native addon path
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      exact: aws-crt-nodejs.node

  - id: aws-c-common-backtrace-source-path
    desc: AWS C common crash backtrace source path
    for: [elf, macho, pe]
    if:
      type: text
      section: .rodata
      # aws-c-common embeds its own translation-unit path in the crash
      # backtrace printer (posix/system_info.c reads TracerPid to decide
      # debugger vs dump behavior); every shim statically linking it --
      # Node, JNI, Python, .NET -- carries this marker.
      regex: 'aws-c-common[/\\]source[/\\]posix[/\\]system_info\.c'

  - id: aws-c-common-run-command
    desc: AWS C common run-command helper symbol
    for: [elf, macho, pe]
    if:
      # aws-c-common's posix command runner (`atos`/addr2line backtrace
      # symbolication); its popen use is the CRT's own crash diagnostics.
      # Leading-underscore normalization makes the Mach-O spelling
      # (`_aws_run_command`) match the ELF one.
      type: symbol
      exact: aws_run_command

  - id: python-module-path
    desc: AWS CRT Python module path
    for: [python]
    if:
      type: path
      regex: 'awscrt([\\/]|$)'

  - id: python-native-addon-path
    desc: AWS CRT Python native addon path
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^_awscrt[^/]*\.so$'

composite_rules:
  - id: aws-crt-library-context
    desc: Recognized AWS Common Runtime library context
    crit: exception
    conf: 0.99
    any:
      - id: jar-package-path
      - id: native-library-path
      - id: node-native-addon-path
      - id: python-module-path
      - id: python-native-addon-path
      - id: aws-c-common-backtrace-source-path
      - id: aws-c-common-run-command
