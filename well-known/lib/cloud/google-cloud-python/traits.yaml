# Official google-cloud-* Python client libraries from googleapis/google-cloud-python.
defaults:
  platforms: [linux, macos, windows]
  for: [python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: google-cloud-wheel-distribution
    desc: Official google-cloud Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      regex: '^google[-_]cloud[-_]'

  - id: package-path
    desc: Google Cloud Python package source path
    for: [python]
    if:
      type: path
      substr: 'google/cloud/'

  - id: proto-package-definition
    desc: Google Cloud proto module package declaration
    for: [python]
    if:
      type: text
      regex: 'proto\.module\(\s*package="google\.cloud\.'

composite_rules:
  - id: google-cloud-python-sdk
    desc: Official Google Cloud Python SDK client library
    any:
      - id: google-cloud-wheel-distribution
      - id: proto-package-definition
      - id: package-path
