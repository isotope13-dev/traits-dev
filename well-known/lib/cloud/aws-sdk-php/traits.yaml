# AWS SDK for PHP. Its service clients are generated from the shared API
# models and each generated file carries the provenance banner below.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: aws-sdk-php-generated-model
    desc: AWS SDK PHP generated service model
    if:
      type: text
      regex: '(?i)(generated|auto-generated) from sdk-root/src/data/'
