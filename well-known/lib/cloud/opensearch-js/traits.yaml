# Official @opensearch-project/opensearch Node.js client, including AWS SigV4.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-string
    desc: OpenSearch JS client package name
    for: [javascript, typescript]
    if:
      type: text
      substr: '@opensearch-project/opensearch'

  - id: package-manifest-name
    desc: OpenSearch JS client manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@opensearch-project/opensearch'

  - id: aws-sigv4-signer-error
    desc: OpenSearch AWS SigV4 signer error type
    for: [javascript, typescript]
    if:
      type: text
      substr: AwsSigv4SignerError

  - id: official-client-blurb
    desc: OpenSearch official Node.js client description
    for: [javascript, typescript]
    if:
      type: text
      substr: The official OpenSearch client for Node.js

composite_rules:
  - id: opensearch-js-client
    desc: OpenSearch official JavaScript client
    all:
      - id: package-string
    any:
      - id: aws-sigv4-signer-error
      - id: official-client-blurb
