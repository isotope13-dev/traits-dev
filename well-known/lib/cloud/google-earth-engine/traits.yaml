# Google Earth Engine Python client library.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: earth-engine-api-endpoint
    desc: Google Earth Engine API endpoint URL
    if:
      type: text
      regex: 'https?://earthengine(-highvolume)?\.googleapis\.com'

  - id: earth-engine-init-marker
    desc: Earth Engine client init message
    if:
      type: text
      substr: 'Earth Engine client library not initialized'

  - id: earth-engine-wheel-distribution
    desc: Google Earth Engine API wheel distribution
    for: [whl]
    crit: notable
    if:
      type: value
      path: whl.distribution
      exact: 'earthengine_api'

composite_rules:
  - id: google-earth-engine-client
    desc: Google Earth Engine client library
    for: [python, whl]
    conf: 0.95
    needs: 2
    any:
      - id: earth-engine-wheel-distribution
      - id: earth-engine-init-marker
      - id: earth-engine-api-endpoint
