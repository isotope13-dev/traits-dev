# Azure SDK for JavaScript packages are published from the Azure/azure-sdk-for-js
# monorepo. Individual @azure packages therefore do not share the repository
# basename and their README files routinely use product headings and link sibling
# packages. The scoped package name and official repository together provide a
# strong library identity without treating either generic marker as sufficient.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: azure-sdk-package-name
    desc: Azure SDK JavaScript scoped package
    if:
      type: value
      path: name
      regex: '^@azure/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: azure-sdk-js-repository
    desc: Azure SDK JavaScript monorepo
    if:
      type: value
      path: repository
      substr: Azure/azure-sdk-for-js

composite_rules:
  - id: azure-sdk-js-package
    desc: Official Azure SDK JavaScript package
    all:
      - id: azure-sdk-package-name
      - id: azure-sdk-js-repository
