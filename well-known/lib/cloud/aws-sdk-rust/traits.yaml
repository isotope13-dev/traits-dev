# The `aws-config` crate -- credential and region resolution for the AWS SDK
# for Rust. It implements the environment, profile, process and IMDS credential
# providers by design; the crate path says the providers belong to the SDK.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.95
  # A linked Rust binary; the crate path cannot appear in anything smaller.
  size_min: 100000
traits:
  - id: rust-aws-config-crate
    desc: Rust aws-config crate
    if:
      type: text
      regex: '[/\\]aws-config-\d+\.\d+\.\d+[/\\]src[/\\]'
