# Official google-cloud-* Ruby gems from googleapis/google-cloud-ruby.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: google-cloud-ruby-gem-name
    desc: Official google-cloud Ruby gem name
    for: [gem]
    if:
      type: value
      path: gem.name
      regex: '^google-cloud-'

  - id: google-cloud-ruby-readme-upstream
    desc: google-cloud-ruby GitHub upstream reference
    for: [markdown, text]
    if:
      type: text
      substr: github.com/googleapis/google-cloud-ruby

  - id: gapic-generator-ruby-marker
    desc: gapic-generator-ruby auto-generated client
    for: [ruby]
    if:
      type: text
      substr: Auto-generated by gapic-generator-ruby
