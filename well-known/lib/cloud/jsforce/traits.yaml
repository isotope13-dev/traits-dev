# jsforce — Salesforce API client for JavaScript (jsforce/jsforce).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 2000000

traits:
  - id: jsforce-node-package-name
    desc: jsforce-node npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@jsforce/jsforce-node'

  - id: jsforce-node-npm-archive
    desc: jsforce-node npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@jsforce/jsforce-node'

  - id: jsforce-github-repo
    desc: jsforce GitHub repository
    if:
      type: text
      substr: github.com/jsforce/jsforce

  - id: jsforce-local-require
    desc: Requires local jsforce module
    for: [javascript]
    if:
      type: text
      substr: 'require("./jsforce")'

  - id: salesforce-login-url-literal
    desc: Salesforce login URL string literal
    for: [javascript]
    if:
      type: text
      substr: 'https://login.salesforce.com'
