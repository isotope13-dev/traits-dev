# Google Cloud Go client source and module archive identity.
# Covers the root module (`cloud.google.com/go@…`) and per-API modules
# (`cloud.google.com/go/deploy@…`, `…/dataplex@…`, …).
defaults:
  platforms: [unix, windows]
  for: [go, zip]
  crit: notable
  conf: 0.99
  # The marker is a ~20-byte module path, so the floor is only the string
  # itself -- `source-tree` and `module-import` match Go source, where a
  # 100-byte doc.go is normal. `binary-module-path` carries the real floor.
  size_min: 20
  size_max: 600000000

traits:
  - id: source-tree
    desc: Google Cloud Go source-tree path
    if:
      type: path
      regex: 'cloud\.google\.com/go(/[A-Za-z0-9._-]+)?@v?[0-9]'

  - id: module-import
    desc: cloud.google.com/go import path
    for: [go]
    if:
      type: import
      substr: cloud.google.com/go/


  # A compiled Go binary keeps its dependency module paths; `source-tree` is a
  # path matcher and `module-import` needs parsed Go source, so neither sees a
  # linked binary.
  - id: binary-module-path
    desc: cloud.google.com/go binary module path
    for: [pe, elf, macho]
    if:
      type: text
      substr: 'cloud.google.com/go/'
      section: rodata
    # A linked Go binary cannot be small: the runtime alone is over a megabyte
    # before any cloud client is compiled in.
    size_min: 1000000

composite_rules:
  - id: google-cloud-go-library
    desc: Google Cloud Go client library module
    any:
      - id: source-tree
      - id: module-import
      - id: binary-module-path
