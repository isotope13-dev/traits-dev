defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.95
  # The framework identity is embedded in linked Rust binaries' source and
  # symbol strings; small artifacts cannot contain this implementation.
  size_min: 100000

traits:
  - id: rust-opendal-s3-backend-source
    desc: Rust OpenDAL S3 backend source path
    if:
      type: text
      regex: '[/\\]opendal[/\\]opendal[/\\]core[/\\]src[/\\]services[/\\]s3[/\\]backend\.rs'

  - id: rust-opendal-gcs-backend-source
    desc: Rust OpenDAL GCS backend source path
    if:
      type: text
      regex: '[/\\]opendal[/\\]opendal[/\\]core[/\\]src[/\\]services[/\\]gcs[/\\]backend\.rs'

composite_rules:
  - id: rust-opendal-cloud-storage-sdk
    desc: Rust OpenDAL cloud storage SDK context
    crit: notable
    conf: 0.98
    all:
      - id: rust-opendal-s3-backend-source
      - id: rust-opendal-gcs-backend-source
