# MathJax — packaged math rendering engine (Apache-2.0). Bundled builds embed
# font tables as base64 string shards and shuffle them into typed arrays;
# that layout is font packaging, not payload reassembly.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: MathJax package.json name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mathjax

  - id: mathjax-source-marker
    desc: MathJax product name marker
    for: [javascript]
    if:
      type: text
      word: MathJax

  - id: vendor-path
    desc: MathJax vendor directory path
    for: [javascript]
    if:
      type: path
      regex: '(?i)(^|[/\\])MathJax(-master|-src)?([/\\]|$)'

composite_rules:
  - id: mathjax-bundle-context
    desc: Recognized MathJax vendor bundle
    crit: notable
    conf: 0.99
    all:
      - id: vendor-path
      - id: mathjax-source-marker

  - id: mathjax-package-context
    desc: Recognized MathJax package context
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: mathjax-source-marker
