# Xray-core command API sources and integration tests.  These commands exercise
# local administrative endpoints; they are source identity, not C2 or remote
# command evidence.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: commander-package-import
    desc: Xray commander package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/app/commander'

  - id: command-test-functions
    desc: Go commander scenario test functions
    count_min: 4
    if:
      type: function
      regex: '^TestCommander[A-Z0-9_]'

  - id: inbound-management-rpc-calls
    desc: Xray inbound management RPC calls
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.(AlterInbound|ListInbounds|RemoveInbound)$'

  - id: inbound-user-add-operation
    desc: Xray inbound add-user operation
    crit: component
    if:
      type: text
      substr: AddUserOperation

  - id: outbound-list-rpc-call
    desc: Xray outbound listing RPC call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.ListOutbounds$'

  - id: stats-service-client-call
    desc: Xray statistics service client constructor
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.NewStatsServiceClient$'

  - id: source-ip-block-command-function
    desc: Xray source-IP block command function
    crit: component
    if:
      type: function
      exact: executeSourceIpBlock

  - id: typed-message-json-function
    desc: Xray typed-message JSON converter function
    crit: component
    if:
      type: function
      exact: executeTypedMessageToJson

  - id: common-reflect-package-import
    desc: Xray reflection package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/reflect'

  - id: common-serial-package-import
    desc: Xray typed-message package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/serial'

composite_rules:
  - id: command-api-integration-tests
    desc: Xray command API integration-test source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-proxyman-command-import
      - id: commander-package-import
      - id: command-test-functions
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: micro-behaviors/communications/grpc::grpc-go-client
      - id: micro-behaviors/communications/grpc::grpc-go-insecure-transport
      - id: inbound-management-rpc-calls
      - id: outbound-list-rpc-call
      - id: stats-service-client-call

  - id: source-ip-block-command
    desc: Xray source-IP routing command
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-router-command-import
      - id: well-known/lib/xray-core::xray-routing-api-client-call
      - id: source-ip-block-command-function
      - id: well-known/lib/xray-core::xray-routing-add-rule-call
      - id: well-known/lib/xray-core::xray-routing-add-request
      - id: well-known/lib/xray-core::xray-routing-remove-rule-call

  - id: typed-message-json-command
    desc: Xray typed-message JSON command implementation
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-protobuf-command-import
      - id: well-known/lib/xray-core::xray-config-loader-package-import
      - id: typed-message-json-function
      - id: common-reflect-package-import
      - id: common-serial-package-import
      - id: micro-behaviors/data/serialize/json::go-json-unmarshal
