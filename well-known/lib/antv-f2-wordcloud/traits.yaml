# AntV F2 WordCloud — mobile chart word-cloud extension for @antv/f2.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: AntV F2 wordcloud package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/f2-wordcloud'

  - id: source-package-marker
    desc: AntV F2 wordcloud package marker string
    for: [javascript, typescript]
    if:
      type: text
      exact: '@antv/f2-wordcloud'

  - id: f2-wordcloud-description
    desc: F2 wordcloud extension package description
    for: [package.json]
    if:
      type: value
      path: description
      exact: F2 wordcloud extension

composite_rules:
  - id: f2-wordcloud-library
    desc: AntV F2 wordcloud library identity
    any:
      - id: package-name
      - id: source-package-marker
      - id: f2-wordcloud-description
