# FullCalendar locale resources, one atom per registration API generation:
#   2.x  `$.fullCalendar.datepickerLang(...)` / `.lang(...)` beside a Moment locale
#   3.x  `$.fullCalendar.locale("ar", { buttonText: ... })`
#   4.x+ `FullCalendar.globalLocales.push(locale)`, or the bare locale object
#        exported by the @fullcalendar/core ESM locale modules
# Locale assets are the bulk of a shipped FullCalendar tree, so identifying all
# generations keeps a vendor calendar asset from reading as an unattributed
# script full of foreign-script text.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: fullcalendar-jquery-plugin
    desc: FullCalendar jQuery plugin API
    size_min: 1000
    if:
      type: text
      regex: '\.fn\.fullCalendar\s*='

  - id: fullcalendar-legacy-locale-api
    desc: FullCalendar legacy locale registration API
    for: [javascript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.fullCalendar\.(datepickerLang|lang)\s*\('

  - id: fullcalendar-locale-registration
    desc: FullCalendar 3.x locale registration call
    for: [javascript]
    if:
      type: text
      regex: '\bfullCalendar\.locale\s*\(\s*["''][\w-]{2,7}["'']\s*,\s*\{\s*buttonText'

  - id: fullcalendar-global-locale-push
    desc: FullCalendar global locale registration
    if:
      type: text
      regex: '\bFullCalendar\.globalLocales\.push\s*\('

  # The bare locale object exported by the @fullcalendar/core ESM locale
  # modules has no registration call to key on — only FullCalendar's own option
  # names. Each key is one line of a table, hence two fragments plus proximity.
  - id: fullcalendar-all-day-text-option
    desc: FullCalendar allDayText locale option key
    crit: component
    if:
      type: text
      regex: '\ballDayText\s*:'

  - id: fullcalendar-more-link-text-option
    desc: FullCalendar moreLinkText locale option key
    crit: component
    if:
      type: text
      regex: '\bmoreLinkText\s*:'

composite_rules:
  - id: fullcalendar-locale-option-set
    desc: FullCalendar locale option table
    crit: notable
    conf: 0.97
    all:
      - id: fullcalendar-all-day-text-option
      - id: fullcalendar-more-link-text-option
    near_bytes: 200


  - id: fullcalendar-moment-legacy-locale
    desc: FullCalendar locale resource with Moment registration
    crit: notable
    conf: 1.0
    for: [javascript]
    all:
      - id: fullcalendar-legacy-locale-api
      - id: metadata/file/profile/locale::moment-legacy-locale-fallback
