# The stylesheet half of a shipped FullCalendar tree. traits.yaml identifies the
# JavaScript locale assets; a `.css` file is classified as `text`, so a vendored
# fullcalendar.css / fullcalendar.print.css otherwise carries nothing but the
# generic CSS content-type baseline and reads as an unattributed text blob.
#
# Two atoms because the two generations look different:
#   * 2.x/3.x and the 6.x global bundles keep a preserved `/*!` release banner
#     ("FullCalendar v2.2.3 Print Stylesheet" / "FullCalendar Standard Bundle
#     v6.1.15") immediately above the "Docs & License:" line.
#   * The 4.x/5.x `@fullcalendar/*` packages ship no banner at all, so identity
#     there rests on the class namespace, which every generation from 2.x to 6.x
#     has prefixed `fc-`.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.97

traits:
  - id: fullcalendar-release-banner
    desc: FullCalendar release banner comment
    for: [text, javascript]
    if:
      type: text
      regex: 'FullCalendar[\w ]{0,32}v[0-9][^\n]{0,32}\s+\*?\s*Docs & License'

  # 59 hits in the 5 KB print stylesheet, 342-519 in a full theme. A dozen
  # distinct `.fc-`-prefixed class selectors in one stylesheet is FullCalendar;
  # no other widely vendored CSS package claims that prefix.
  - id: fullcalendar-fc-class-namespace
    desc: FullCalendar fc- CSS class namespace
    conf: 0.95
    count_min: 12
    if:
      type: text
      regex: '\.fc-[a-z][a-z-]{2,30}'
