defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  crit: notable
  conf: 0.96

traits:
  - id: package-name
    desc: MySQL2 package manifest name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: mysql2

  - id: archive-package-name
    desc: MySQL2 npm archive name
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: mysql2

  - id: mysql2-charset-encoding-marker
    desc: MySQL2 charset encoding mapping reference
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      substr: CharsetToEncoding

  - id: mysql2-promise-entrypoint
    desc: MySQL2 Promise API entry point
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'exports\.createConnection\s*=\s*createConnectionPromise'

  - id: mysql2-auth41-implementation
    desc: MySQL 4.1 authentication implementation
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: '4.1 authentication:'

  - id: mysql2-caching-sha2-plugin
    desc: MySQL2 caching SHA2 authentication plugin
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: "const PLUGIN_NAME = 'caching_sha2_password'"

composite_rules:
  - id: mysql2-tls-connection
    desc: MySQL2 TLS connection implementation
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: mysql2-charset-encoding-marker
      - id: micro-behaviors/communications/socket/ssl::node-tls-connect
      - id: micro-behaviors/communications/socket/ssl::node-tls-create-secure-context
