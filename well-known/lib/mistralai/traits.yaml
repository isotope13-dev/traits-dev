# The Mistral AI Python client is a published API SDK. Its optional workflow
# encryption, cloud offloading, MCP, and OpenTelemetry features are expected
# library behavior; the package identity is kept narrow and non-hostile.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Mistral AI Python SDK package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: mistralai

  - id: upstream-repository
    desc: Mistral AI Python SDK upstream repository
    for: [pkginfo]
    if:
      type: value
      path: project-url
      regex: '(?i)github\.com/mistralai/client-python(\.git)?$'

composite_rules:
  - id: python-sdk
    desc: Recognized Mistral AI Python SDK package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository
