# hash-sum — unique hash / checksum helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: hash-sum npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: hash-sum

  - id: vendored-path
    desc: vendored hash-sum package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/hash-sum/'


composite_rules:
  - id: hash-sum-library
    desc: hash-sum unique ID hasher
    any:
      - id: package-name
      - id: vendored-path
