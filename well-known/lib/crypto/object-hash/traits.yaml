# object-hash — hash JS objects.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: object-hash npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: object-hash
  - id: vendored-path
    desc: vendored object-hash package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/object-hash/'

composite_rules:
  - id: object-hash-library
    desc: object-hash digest library
    any:
      - id: package-name
      - id: vendored-path
