# Miden — zero-knowledge blockchain client SDK (WASM/web bindings).
defaults:
  platforms: [linux, macos, windows]
  for: [rust, cargo.toml, crate, javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: miden-client-repo
    desc: Miden client GitHub repository marker
    if:
      type: text
      substr: github.com/0xMiden/miden-client

  - id: miden-sdk-package-name
    desc: Miden SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@miden-sdk/miden-sdk"

  - id: miden-client-web-crate
    desc: miden-client-web crate name
    for: [cargo.toml, crate]
    if:
      type: value
      path: crate.name
      exact: miden-client-web

composite_rules:
  - id: miden-client-web-context
    desc: Miden blockchain client web SDK
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: miden-client-web-crate
      - id: miden-sdk-package-name
    all:
      - id: miden-client-repo
