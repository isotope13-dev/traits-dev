# PyCryptodome / PyCryptodomex identity read out of compiled bytecode.
#
# metadata/library/data::pycryptodome-source fingerprints the library by its
# install path, which works on a source tree but not on a .pyc handed over on
# its own: a standalone cached module has no path of its own, only the
# co_filename recorded in the marshal stream. That matters because a cached
# crypto module is one of the worst-shaped things on the .pyc route — PBKDF2
# and HMAC references, XOR-decoded strings, an `~/.ssh/id_ecdsa` path in a
# docstring and long hex constants are exactly an embedded-key stager's
# profile. Naming the library is what separates the two in one read.
defaults:
  platforms: [unix, windows]
  for: [pyc]
  crit: notable
  conf: 0.97
  size_max: 104857600

traits:
  - id: pycryptodome-bytecode-path
    desc: Bytecode compiled from PyCryptodome
    if:
      type: value
      path: pyc.source_files[*]
      regex: '[\\/](Crypto|Cryptodome)[\\/][A-Z][A-Za-z]{1,12}[\\/][A-Za-z_]'
