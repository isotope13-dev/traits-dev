# c2-chacha is the ChaCha20 stream-cipher crate from the CryptoCorrosion
# project — the name is cryptographic shorthand, not command-and-control.
defaults:
  platforms: [unix, windows]
  for: [gz, crate, rust, cargo.toml]
  crit: notable
  conf: 0.99

traits:
  - id: c2-chacha-crypto-crate-path
    desc: c2-chacha ChaCha cipher crate path
    if:
      type: path
      substr: c2-chacha
