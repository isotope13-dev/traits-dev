# @metamask/ethjs-util — Ethereum encoding and unit conversion utilities.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.97

traits:
  - id: ethjs-util-package-name
    desc: MetaMask ethjs-util npm package
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@metamask/)?ethjs-util$'

  - id: ethjs-util-archive-path
    desc: ethjs-util npm package path
    if:
      type: path
      regex: 'ethjs-util'

  - id: ethjs-util-npm-member-path
    desc: ethjs-util npm archive member path
    if:
      type: path
      regex: 'ethjs-util@'

  - id: ethjs-util-dist-basename
    desc: ethjs-util distribution bundle basename
    for: [javascript, typescript]
    if:
      type: basename
      regex: '^ethjs-util(\.min)?\.js$'

  - id: ethjs-util-stack-import
    desc: Imports MetaMask ethjs-util module
    for: [javascript, typescript]
    if:
      type: text
      regex: '@metamask/ethjs-util\b|require\([''"]ethjs-util[''"]\)'

composite_rules:
  - id: ethjs-util-library
    desc: MetaMask ethjs-util utility library
    crit: exception
    conf: 0.97
    any:
      - id: ethjs-util-package-name
      - id: ethjs-util-archive-path
      - id: ethjs-util-npm-member-path
      - id: ethjs-util-dist-basename
      - id: ethjs-util-stack-import
