defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: backend-package-name
    desc: Clerk backend npm package name
    for: [package.json, npm, tar]
    if:
      type: value
      path: name
      exact: "@clerk/backend"

  - id: backend-sdk-marker
    desc: Clerk Backend SDK package marker
    for: [javascript, typescript]
    if:
      type: text
      substr: "@clerk/backend"

  - id: clerk-api-url
    desc: Clerk API endpoint URL
    for: [javascript, typescript]
    if:
      type: text
      substr: "https://api.clerk.com"

composite_rules:
  - id: clerk-backend-sdk
    desc: Clerk Backend authentication SDK
    crit: notable
    conf: 0.99
    any:
      - id: backend-package-name
      - id: backend-sdk-marker
