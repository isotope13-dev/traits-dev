# miguelmota/keccak256 — the npm wrapper that computes a 256-bit Keccak hash
# by delegating to cryptocoinjs/keccak.
#
# These atoms describe the published upstream identity: the manifest fields
# and README title that a republisher inherits when it copies the package and
# changes only the name. They are identity facts, not behaviour; the
# impersonation conclusion is composed in objectives/supply-chain/.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: npm-package-name
    desc: keccak256 npm package name
    if:
      type: value
      path: name
      exact: keccak256

  - id: npm-package-description
    desc: keccak256 npm package description
    # 1.0.0-1.0.3 shipped the bare sentence; 1.0.4+ prefixed "A wrapper for the".
    if:
      type: value
      path: description
      regex: '^(A wrapper for the )?[Kk]eccak library to compute 256 bit keccak hash in JavaScript$'

  - id: npm-package-keyword
    desc: keccak256 listed as a package keyword
    crit: component
    conf: 0.9
    if:
      type: value
      path: 'keywords[*]'
      exact: keccak256

  - id: npm-package-author
    desc: keccak256 upstream author attribution
    crit: component
    conf: 0.9
    if:
      type: value
      path: author.name
      exact: Miguel Mota

  - id: npm-package-repository
    desc: keccak256 upstream repository URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https?://github\.com/miguelmota/keccak256(\.git)?/?$'

  - id: readme-heading
    desc: keccak256 README title
    for: [markdown]
    if:
      type: value
      path: markdown.first_heading
      exact: keccak256

  - id: archive-package-name
    desc: keccak256 archive package name
    for: [npm, tar, zip]
    if:
      type: value
      path: npm.name
      exact: keccak256
