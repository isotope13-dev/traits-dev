# golang.org/x/crypto is the official Go supplementary cryptography library.
# Its source tree includes SSH, ACME, and OTR implementations with extensive
# unit and integration tests that exercise network and crypto primitives.
defaults:
  platforms: [unix, windows]
  for: [go, zip]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 104857600

traits:
  - id: source-archive-member
    desc: golang.org/x/crypto module source archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^golang\.org/x/crypto@v[0-9][^/]+/go\.mod$'

  - id: source-archive-path
    desc: golang.org/x/crypto module source path
    for: [go, text]
    if:
      type: path
      regex: 'golang\.org/x/crypto@v'

  - id: module-path
    desc: golang.org/x/crypto module import path
    if:
      type: text
      substr: 'golang.org/x/crypto'

composite_rules:
  - id: golang-x-crypto-library
    desc: golang.org/x/crypto supplementary crypto library
    crit: notable
    conf: 0.99
    any:
      - id: source-archive-member
      - id: source-archive-path
      - id: module-path

  - id: golang-x-crypto-source-archive-context
    desc: golang.org/x/crypto source archive context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: source-archive-member
      - id: module-path
