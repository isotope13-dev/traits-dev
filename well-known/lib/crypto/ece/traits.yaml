# Upstream documents macOS/*nix and Windows builds. No mobile-target build
# support is established by this API-name matcher.
# https://github.com/web-push-libs/ecec#building
defaults:
  platforms: [unix, windows]
  for:
  - c

traits:
- id: webpush-ece-message-api
  desc: ECE Web Push record and decryption API
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '\bece_(webpush_aesgcm_decrypt|aesgcm_needs_trailer)\b'
