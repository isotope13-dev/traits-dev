# @azure/msal-browser is Microsoft's legitimate browser OAuth/MSAL client.
# Package identity is kept separate from generic token and login-endpoint
# capability traits so those capabilities remain visible when unowned.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, javascript, typescript]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: package-name
    desc: Microsoft MSAL browser package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@azure/msal-browser'

  - id: archive-package-name
    desc: MSAL browser npm archive name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@azure/msal-browser'

  - id: bundled-module-path
    desc: Bundled @azure/msal-browser import
    for: [javascript, typescript]
    if:
      type: text
      regex: '@azure/msal-browser(/dist|/lib)'

  - id: bundled-version-banner
    desc: Bundled @azure/msal-browser version banner
    for: [javascript, typescript]
    if:
      type: text
      regex: '@azure/msal-browser v[0-9]'
