# webpki-roots — Mozilla CA root store for webpki/rustls (github.com/rustls/webpki-roots).
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, crate, tar, python]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 500000000

traits:
  - id: crate-name
    desc: webpki-roots crate name in Cargo.toml
    for: [cargo.toml, crate]
    if:
      type: value
      path: package.name
      exact: webpki-roots

  - id: repository-url
    desc: webpki-roots upstream repository URL
    if:
      type: text
      substr: github.com/rustls/webpki-roots

  - id: tls-server-roots-export
    desc: webpki-roots TLS_SERVER_ROOTS export
    for: [rust]
    if:
      type: text
      substr: 'pub static TLS_SERVER_ROOTS:'
  - id: mozilla-mkcert-generator-header
    desc: webpki-roots Mozilla mkcert generation banner
    for: [rust, python]
    if:
      type: text
      substr: automatically generated from the Mozilla certificate

composite_rules:
  - id: crate-context
    desc: webpki-roots Mozilla CA root crate
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: crate-name
      - id: repository-url
      - id: tls-server-roots-export
      - id: mozilla-mkcert-generator-header
