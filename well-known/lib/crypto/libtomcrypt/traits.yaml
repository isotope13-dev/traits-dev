# LibTomCrypt-derived routine identifiers.
# The embedded source paths identify compiled Fortuna, AES, and SHA routines;
# their presence alone does not establish concealment or hostile intent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 15000000

traits:
  - id: fortuna-prng-src-path
    desc: Fortuna PRNG source path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '[./\\]+src[/\\]Encryption[/\\]prngs[/\\]fortuna\.c'
      section: .rdata

  - id: aes-cipher-src-path
    desc: AES cipher source path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '[./\\]+src[/\\]Encryption[/\\]ciphers[/\\]aes[/\\]aes\.c'
      section: .rdata

  - id: sha512-src-path
    desc: SHA-512 source path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '[./\\]+src[/\\]Encryption[/\\]hashes[/\\]sha'
      section: .rdata

  - id: zeromem-src-path
    desc: Secure wipe source path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[./\\]+src[/\\]Encryption[/\\]misc[/\\]zeromem\.c'
      section: .rdata

composite_rules:
  - id: libtomcrypt-derived-crypto-routines
    desc: LibTomCrypt-derived crypto routine markers
    crit: notable
    conf: 0.95
    all:
      - id: fortuna-prng-src-path
      - id: aes-cipher-src-path
    any:
      - id: sha512-src-path
      - id: zeromem-src-path
