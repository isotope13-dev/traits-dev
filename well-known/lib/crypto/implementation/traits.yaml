# Library identity composites shared by crypto-related objective rules.  These
# are deliberately kept outside any backdoor family: linking a standard crypto
# implementation is software provenance, not evidence of hostile behavior.
defaults:
  platforms: [unix, windows]

traits:
  # BoringSSL and OpenSSL 3.x both keep their primitive implementations under
  # `crypto/fipsmodule/`. Those files necessarily contain the shape that
  # block-cipher-mode rules look for -- CBC and IGE *are* "decrypt a block,
  # then XOR it with the previous one" -- so an AES implementation matches
  # them by construction. Telegram vendors BoringSSL at
  # TMessagesProj/jni/boringssl/crypto/fipsmodule/aes/.
  - id: fipsmodule-source-path
    desc: Crypto library FIPS module source path
    crit: notable
    conf: 0.97
    for: [c, cpp, source]
    if:
      type: path
      regex: 'crypto/fipsmodule/'

  - id: heimdal-hcrypto-path
    desc: Heimdal hcrypto implementation path
    crit: notable
    conf: 0.97
    for: [c, cpp]
    if:
      type: path
      regex: '(^|[\\/])hcrypto[\\/]'

  # LibreSSL and older OpenSSL keep IGE/wrap next to the block cipher, not
  # under crypto/fipsmodule/. Those files are the mode implementation.
  - id: openssl-aes-mode-source-path
    desc: OpenSSL-family AES mode source
    crit: notable
    conf: 0.97
    for: [c, cpp]
    if:
      type: path
      regex: '(^|[\\/])aes_(ige|wrap)\.c$'

composite_rules:
  - id: known-crypto-library-implementation
    desc: Known cryptographic library implementation or binding
    crit: notable
    conf: 0.99
    any:
      - id: micro-behaviors/dylib/library/ssl::libcrypto-ref
      - id: well-known/lib/crypto/openssl::openssl-cryptogams
      - id: well-known/lib/crypto/cryptography::cryptography-binding
      - id: fipsmodule-source-path
      - id: heimdal-hcrypto-path
      - id: openssl-aes-mode-source-path
