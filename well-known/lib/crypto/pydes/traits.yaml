# pyDes — Todd Whiteman's pure Python implementation of DES and Triple DES algorithms
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: pydes-author-header
    desc: Todd Whiteman pyDes author header
    if:
      type: text
      substr: "Author:   Todd Whiteman"

  - id: pydes-docstring
    desc: Todd Whiteman pyDes documentation string
    if:
      type: text
      substr: "A pure python implementation of the DES and TRIPLE DES encryption algorithms."

  - id: pydes-homepage
    desc: Todd Whiteman pyDes homepage URL
    if:
      type: text
      substr: "http://twhiteman.netfirms.com/des.html"

  - id: pydes-base-class
    desc: pyDes internal DES base class
    if:
      type: text
      substr: "class _baseDes(object):"

  - id: pydes-consumer
    desc: Uses Todd Whiteman pyDes cryptographic library
    conf: 0.95
    if:
      type: text
      regex: '\b(pyDes\.triple_des|pyDes\.des|pyDes\.PAD_PKCS5|pyDes\.PAD_NORMAL|pydes_b64)\b'

composite_rules:
  - id: pydes-library
    desc: Todd Whiteman pyDes pure Python cryptographic library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: pydes-author-header
      - id: pydes-docstring
      - id: pydes-homepage
      - id: pydes-base-class
