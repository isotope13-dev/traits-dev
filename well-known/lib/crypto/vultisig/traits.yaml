# @vultisig/sdk — official Vultisig self-custody multi-chain MPC wallet SDK
# (https://github.com/vultisig/vultisig-sdk, https://vultisig.com).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: "@vultisig npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@vultisig/'

  - id: archive-package-name
    desc: "@vultisig npm archive identity"
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      regex: '^@vultisig/'

  - id: package-member-context
    desc: "@vultisig package member context"
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      regex: '^@vultisig/'

  - id: repository-coordinate
    desc: Vultisig GitHub repository
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: 'github.com/vultisig/vultisig-sdk'

  - id: vultisig-sdk-marker
    desc: Vultisig SDK identifier
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(vultisig|vulti)\b'

composite_rules:
  - id: vultisig-sdk-context
    desc: Official Vultisig SDK and tooling framework
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: repository-coordinate
      - id: vultisig-sdk-marker
