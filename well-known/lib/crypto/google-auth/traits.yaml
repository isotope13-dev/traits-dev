defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: component
  conf: 0.96
  size_max: 5000000
traits:
- id: namespace
  desc: Google Auth namespace marker
  if:
    type: text
    regex: namespace\s+.{0,80}Google\\Auth\\
- id: credentials-loader
  desc: Google Auth credentials loader
  if:
    type: text
    regex: class\s+CredentialsLoader\b
- id: gce-credentials-class
  desc: Google Auth GCE metadata credentials class
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: class\s+GCECredentials\b
- id: python-package-path
  desc: Python google-auth package path
  crit: notable
  conf: 0.96
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])google[\\/]auth'
- id: python-package-version-module
  desc: Google Auth Python version module path
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])auth[\\/]version\.py$'
- id: js-sdk-bundle
  desc: Google Auth Library JavaScript SDK
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    substr: GoogleAuthExceptionMessages
# ncc/webpack embeds the dependency package.json; GoogleAuthExceptionMessages
# is absent from recent google-auth-library builds, so also match the name.
- id: js-package-name-embedded
  desc: Embedded google-auth-library package name
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    substr: '"name":"google-auth-library"'
composite_rules:
- id: js-sdk-context
  desc: Recognized Google Auth Library JavaScript SDK
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  # Either marker identifies the SDK; referenced from unless: (scan may hide
  # needs<=1 any-only composites from CLI output, but unless still applies).
  any:
  - id: js-sdk-bundle
  - id: js-package-name-embedded

- id: credentials-loader-context
  desc: Google Auth credentials loader context
  crit: notable
  conf: 0.99
  all:
  - id: namespace
  - id: credentials-loader
- id: gce-credentials-context
  desc: Google Auth GCE metadata credentials context
  crit: notable
  conf: 0.99
  all:
  - id: namespace
  - id: gce-credentials-class
- id: python-package-context
  desc: Recognized Python google-auth package context
  crit: exception
  conf: 0.99
  for: [python]
  scope: archive
  all:
  - id: python-package-path
  - id: python-package-version-module
