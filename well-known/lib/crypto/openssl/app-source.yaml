defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.98

traits:
  - id: openssl-source-member
    desc: OpenSSL source archive member
    for: [c, shell, perl, text, javascript, source, data]
    if:
      type: path
      substr: openssl-
  - id: http-server-c-basename
    desc: http_server.c basename
    for: [c]
    if:
      type: basename
      exact: http_server.c
  - id: shlib-wrap-basename
    desc: OpenSSL shared-library wrapper script
    for: [shell]
    if:
      type: basename
      exact: shlib_wrap.sh.in
  # OpenSSL's own Perl test framework namespace. The openssl-source-member path
  # marker only matches the `openssl-<ver>/` release-tarball layout, so files
  # installed under `usr/src/openssl/` by distro -dbg/-src packages (Alpine)
  # were not recognized as OpenSSL. The OpenSSL::Test / TLSProxy:: namespace is
  # unique to OpenSSL's test suite (its .pm/.t helpers open listeners, run
  # commands, and reference EncryptedExtensions — all of which trip generic
  # backdoor/ransomware heuristics), so it is a reliable source-tree identity.
  - id: openssl-perl-test-framework
    desc: OpenSSL Perl test framework module
    for: [perl, text]
    if:
      type: text
      regex: '(?m)^\s*(package|use)\s+OpenSSL::Test\b|^\s*use\s+TLSProxy::'

composite_rules:
  - id: openssl-http-server-source
    desc: OpenSSL HTTP server source
    crit: notable
    conf: 0.98
    all:
      - id: openssl-source-member
      - id: http-server-c-basename
  - id: openssl-source-identity
    desc: OpenSSL source tree identity
    crit: notable
    conf: 0.98
    any:
      - id: openssl-source-member
      - id: openssl-http-server-source
      - id: shlib-wrap-basename
      - id: openssl-perl-test-framework
