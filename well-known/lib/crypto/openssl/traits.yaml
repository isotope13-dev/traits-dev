defaults:
  size_max: 52428800
  platforms: [windows, linux, macos]
traits:
  - id: openssl-version-symbol
    desc: Exports OpenSSL version API
    crit: notable
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: export
      exact: OpenSSL_version
  - id: ssleay-version-symbol
    desc: SSLeay_version export symbol
    crit: baseline
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSLeay_version
  - id: openssl-098y-banner
    desc: OpenSSL 0.9.8y version banner
    crit: baseline
    conf: 0.92
    for: [binaries]
    if:
      type: text
      substr: OpenSSL 0.9.8y 5 Feb 2013
      section: .rdata
  - id: openssl-source-paths
    desc: OpenSSL source path strings
    crit: baseline
    conf: 0.82
    for: [binaries]
    if:
      type: text
      substr: .\crypto\
      section: .rdata
  # The e_capi engine plugin (capi.dll / capieay32.dll) is OpenSSL's own
  # bridge to the Windows CertOpenStore/CertEnumCertificatesInStore API --
  # its entire job is walking the CryptoAPI store, so it exports neither
  # OpenSSL_version nor EVP_EncryptInit (those live in libcrypto, which the
  # engine dynamically loads rather than statically links). bind_engine is
  # the fixed entry point every OpenSSL ENGINE plugin exports.
  - id: openssl-capi-engine-exports
    desc: OpenSSL CAPI engine plugin exports
    crit: baseline
    conf: 0.92
    for: [pe, dll]
    if:
      type: export
      exact: bind_engine
  - id: openssl-capi-engine-source-marker
    desc: OpenSSL CAPI engine source string
    crit: notable
    conf: 0.95
    for: [binaries]
    if:
      type: text
      substr: e_capi.c
  # MinGW still ships OpenSSL 1.0 as libeay32/ssleay32. The basename is only
  # a leg; the library composite also requires the EVP key API.
  - id: openssl-legacy-windows-dll-name
    desc: OpenSSL 1.0 libeay or ssleay DLL name
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: path
      basename: true
      regex: '(?i)^(libeay|ssleay)32\.dll$'
composite_rules:
  - id: openssl-capi-engine
    desc: OpenSSL CryptoAPI (CAPI) engine plugin
    crit: notable
    conf: 0.95
    all:
      - id: openssl-capi-engine-exports
      - id: openssl-capi-engine-source-marker
  - id: openssl-library
    desc: OpenSSL cryptographic library binary
    crit: notable
    conf: 0.95
    all:
      - id: openssl-version-symbol
      - id: micro-behaviors/crypto/encrypt::openssl-evp-encrypt-init
  - id: openssl-102-library
    desc: OpenSSL 1.0 libcrypto exports
    crit: baseline
    conf: 0.95
    all:
      - id: ssleay-version-symbol
      - id: micro-behaviors/crypto/encrypt::openssl-evp-encrypt-init
  - id: openssl-static-fingerprint
    desc: Static OpenSSL build fingerprint
    crit: baseline
    conf: 0.9
    all:
      - id: openssl-098y-banner
      - id: openssl-source-paths
  - id: openssl-implementation-identifiers
    desc: OpenSSL implementation identifiers
    crit: notable
    conf: 0.95
    any:
      - id: openssl-library
      - id: openssl-102-library
      - id: openssl-static-fingerprint
  - id: openssl-legacy-windows-library
    desc: OpenSSL 1.0 Windows DLL with EVP API
    crit: notable
    conf: 0.96
    for: [pe, dll]
    all:
      - id: openssl-legacy-windows-dll-name
      - id: micro-behaviors/crypto/provider::openssl-evp-pkey-api-reference
  - id: openssl-section-layout-context
    desc: OpenSSL build whose section layout is the library
    crit: exception
    any:
      - id: openssl-implementation-identifiers
      - id: openssl-legacy-windows-library

  # A stripped static build carries none of the banners or export symbols above
  # -- Telegram Desktop's Windows binary has no `OpenSSL_version` export, no
  # CRYPTOGAMS attribution and no copyright string -- but OpenSSL's own
  # OSSL_HTTP diagnostics survive as exact literals. Two of them establish the
  # embedded library, which is what the cert-store rules' `unless:` on this
  # directory needs in order to recognise a TLS stack building its trust store
  # from the Windows roots.
  - id: openssl-embedded-static-build
    desc: Embedded OpenSSL library in a stripped build
    crit: notable
    conf: 0.95
    # The file default caps at 50 MB, which a bundled desktop application
    # exceeds by design -- Telegram Desktop's Windows build is 218 MB, and the
    # identity was skipped on exactly the files that need it most.
    size_max: 1073741824
    all:
      - id: micro-behaviors/communications/http/client/library::openssl-http-client-diagnostics
    any:
      - id: micro-behaviors/crypto/library/keyword::openssl-evp-encrypt
      - id: micro-behaviors/crypto/provider::openssl-evp-pkey-api-reference
