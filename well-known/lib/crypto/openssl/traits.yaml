defaults:
  size_max: 52428800
  platforms: [windows, linux, macos]
traits:
  # Both copyright banners are `for: [source]`, where there are no binary
  # sections at all — the inherited `section: text` gate could never be
  # satisfied, so neither trait (nor the `openssl-cryptogams` identity
  # composite they feed) has ever fired on an OpenSSL source tree. Kept
  # source-only on purpose: widening to binaries would let any implant that
  # statically links libcrypto pick up the banner from .rodata and satisfy the
  # `unless: well-known/lib/crypto/openssl/` carve-outs on the binary-scoped hostile
  # rules (tor native-crypto implant, ransom locker, injection toolkit).
  - id: openssl-project-copyright
    desc: OpenSSL Project copyright banner in source
    crit: baseline
    conf: 0.95
    for: [source]
    if:
      type: text
      substr: The OpenSSL Project Authors
  - id: openssl-eric-young-copyright
    desc: Eric Young SSLeay copyright banner in source
    crit: baseline
    conf: 0.9
    for: [source]
    if:
      type: text
      substr: Eric Young (eay@cryptsoft.com)
  - id: openssl-version-symbol
    desc: OpenSSL_version export symbol
    crit: baseline
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: OpenSSL_version
  - id: openssl-evp-api
    desc: OpenSSL EVP API symbols
    crit: baseline
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: EVP_EncryptInit
  - id: openssl-098y-banner
    desc: OpenSSL 0.9.8y version banner
    crit: baseline
    conf: 0.92
    for: [binaries]
    if:
      type: text
      substr: OpenSSL 0.9.8y 5 Feb 2013
      section: .rdata
  - id: openssl-source-paths
    desc: OpenSSL source path strings
    crit: baseline
    conf: 0.82
    for: [binaries]
    if:
      type: text
      substr: .\crypto\
      section: .rdata
  - id: cryptogams-attrib
    desc: CRYPTOGAMS assembly attribution string
    crit: baseline
    conf: 0.95
    for: [binaries]
    if:
      type: text
      substr: CRYPTOGAMS by <appro@openssl.org>
  - id: cryptogams-attrib-dotasm
    desc: CRYPTOGAMS dot-asm attribution string
    crit: baseline
    conf: 0.95
    for: [binaries]
    if:
      type: text
      substr: 'CRYPTOGAMS by <https://github.com/dot-asm>'
  # The e_capi engine plugin (capi.dll / capieay32.dll) is OpenSSL's own
  # bridge to the Windows CertOpenStore/CertEnumCertificatesInStore API --
  # its entire job is walking the CryptoAPI store, so it exports neither
  # OpenSSL_version nor EVP_EncryptInit (those live in libcrypto, which the
  # engine dynamically loads rather than statically links). bind_engine is
  # the fixed entry point every OpenSSL ENGINE plugin exports.
  - id: openssl-capi-engine-exports
    desc: OpenSSL CAPI engine plugin exports
    crit: baseline
    conf: 0.92
    for: [pe, dll]
    if:
      type: export
      exact: bind_engine
  - id: openssl-capi-engine-source-marker
    desc: OpenSSL CAPI engine source string
    crit: baseline
    conf: 0.95
    for: [binaries]
    if:
      type: text
      substr: e_capi.c
composite_rules:
  - id: openssl-capi-engine
    desc: OpenSSL CryptoAPI (CAPI) engine plugin
    crit: notable
    conf: 0.95
    all:
      - id: openssl-capi-engine-exports
      - id: openssl-capi-engine-source-marker
  - id: openssl-library
    desc: OpenSSL cryptographic library binary
    crit: baseline
    conf: 0.95
    all:
      - id: openssl-version-symbol
      - id: openssl-evp-api
  - id: openssl-static-fingerprint
    desc: Static OpenSSL build fingerprint
    crit: baseline
    conf: 0.9
    all:
      - id: openssl-098y-banner
      - id: openssl-source-paths
  - id: openssl-cryptogams
    desc: OpenSSL cryptographic library
    crit: notable
    conf: 0.95
    any:
      - id: openssl-library
      - id: openssl-static-fingerprint
      - id: cryptogams-attrib
      - id: cryptogams-attrib-dotasm
      - id: openssl-project-copyright
      - id: openssl-eric-young-copyright

  # A stripped static build carries none of the banners or export symbols above
  # -- Telegram Desktop's Windows binary has no `OpenSSL_version` export, no
  # CRYPTOGAMS attribution and no copyright string -- but OpenSSL's own
  # OSSL_HTTP diagnostics survive as exact literals. Two of them establish the
  # embedded library, which is what the cert-store rules' `unless:` on this
  # directory needs in order to recognise a TLS stack building its trust store
  # from the Windows roots.
  - id: openssl-embedded-static-build
    desc: Embedded OpenSSL library in a stripped build
    crit: notable
    conf: 0.95
    # The file default caps at 50 MB, which a bundled desktop application
    # exceeds by design -- Telegram Desktop's Windows build is 218 MB, and the
    # identity was skipped on exactly the files that need it most.
    size_max: 1073741824
    all:
      - id: micro-behaviors/communications/http/client/library::openssl-http-client-diagnostics
    any:
      - id: micro-behaviors/crypto/library/keyword::openssl-evp-encrypt
      - id: micro-behaviors/crypto/library/provider::openssl-evp-pkey-api-reference
