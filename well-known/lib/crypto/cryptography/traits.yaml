# pyca/cryptography -- the Python cryptography library. The hazmat bindings
# directory holds its native OpenSSL binding, so the path names the library
# from either the source tree or the shipped extension module.
defaults:
  platforms: [unix, windows]
  for: [python, pe, dll]
  crit: notable
  conf: 0.96
  # A path match needs no floor -- a package holds legitimately tiny files
  # (`py.typed` is empty). The ceiling is the operative bound: the largest
  # thing that genuinely matches is a compiled extension module, tens of
  # megabytes at the outside, so this keeps the path off bulk archives.
  size_max: 104857600
traits:
  - id: cryptography-binding
    desc: Python cryptography native binding
    if:
      type: path
      regex: 'cryptography[\\/]hazmat[\\/]bindings'
