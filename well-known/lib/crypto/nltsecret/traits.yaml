# nltsecret — lightweight Python secrets manager (Fernet + local/SQLite store).
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: nltsecret-package-name
    desc: nltsecret wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: nltsecret

  - id: nltsecret-module-import
    desc: Imports the nltsecret package
    for: [python]
    if:
      type: text
      regex: '(?m)^(from|import)\s+nltsecret\b'

  - id: nltsecret-github-repo
    desc: nltsecret GitHub repository URL
    for: [pkginfo, python, text]
    if:
      type: text
      substr: github.com/farfarfun/nltsecret
