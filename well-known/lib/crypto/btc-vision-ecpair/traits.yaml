# @btc-vision/ecpair — Bitcoin secp256k1 signer; optional tiny-secp256k1 peer is expected.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: ecpair-package-name
    desc: Official @btc-vision/ecpair package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@btc-vision/ecpair'

  - id: ecpair-npm-package-name
    desc: Official @btc-vision/ecpair npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@btc-vision/ecpair'

  - id: ecpair-repository-marker
    desc: btc-vision ecpair upstream repository
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: github.com/btc-vision/ecpair

composite_rules:
  - id: archive-context
    desc: Recognized @btc-vision/ecpair Bitcoin signer package
    crit: exception
    scope: archive
    for: [npm, tar, zip, package.json]
    any:
      - id: ecpair-package-name
      - id: ecpair-npm-package-name
