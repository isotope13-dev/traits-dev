# pyasn1-modules — Ilya Etingof's ASN.1 protocol modules for pyasn1
# (RFC 2459/X.509 and related PKIX grammars).
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: pyasn1-modules-source-banner
    desc: pyasn1-modules source file banner
    if:
      type: text
      substr: This file is part of pyasn1-modules software

  - id: ilya-etingof-copyright
    desc: Ilya Etingof pyasn1 copyright
    if:
      type: text
      substr: Ilya Etingof <etingof@gmail.com>

  - id: rfc2459-asn1-source-url
    desc: RFC 2459 ASN.1 source URL
    if:
      type: text
      substr: http://www.ietf.org/rfc/rfc2459.txt

  - id: pkix1-explicit88-module
    desc: PKIX1Explicit88 ASN.1 module marker
    if:
      type: text
      substr: PKIX1Explicit88

composite_rules:
  - id: pyasn1-modules-library
    desc: pyasn1-modules ASN.1 protocol library
    crit: notable
    conf: 0.99
    all:
      - id: pyasn1-modules-source-banner
    any:
      - id: ilya-etingof-copyright
      - id: rfc2459-asn1-source-url
      - id: pkix1-explicit88-module

