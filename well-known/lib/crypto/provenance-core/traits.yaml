# provenance-core — reproducible science digest and git reference primitives (Elliot Tower).
# Integrates OpenTimestamps for cryptographic proof of digest existence.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist]
  crit: notable
  conf: 0.98

traits:
  - id: provenance-core-wheel
    desc: provenance-core Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: provenance-core

  - id: provenance-core-repo
    desc: reproducible-science upstream repository
    for: [python, text]
    if:
      type: text
      substr: 'github.com/elliottower/reproducible-science'

  - id: provenance-core-module
    desc: provenance_core module path
    if:
      type: path
      regex: '(^|[\\/])provenance_core[\\/]'

composite_rules:
  - id: provenance-core-package
    desc: provenance-core reproducible science toolkit
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: provenance-core-wheel
      - id: provenance-core-repo
      - id: provenance-core-module
