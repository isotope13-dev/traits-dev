# Web3 contract codegen and ABI declarations.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: contract-abi-const
  desc: Web3 contract ABI constant
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(export\s+)?(declare\s+)?const\s+[A-Za-z0-9_$]+Abi\b'

- id: contract-abi-function-entry
  desc: Web3 contract ABI function entry
  # A repeated `type: "function"` also describes LLM tools and other schemas.
  # Other Web3 signals in generated-contract-abi establish ABI context.
  crit: component
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: '\btype:\s*["'']function["'']'

- id: contract-abi-typed-name-field
  desc: Web3 contract ABI typed name field
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    regex: '\breadonly\s+name:\s*["''][A-Za-z0-9_]+["'']'

- id: contract-address-field
  desc: Web3 contract address field
  crit: notable
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: '\breadonly\s+address:\s*["'']0x[a-fA-F0-9]{40}["'']'

- id: contract-address-const
  desc: Web3 contract address constant
  crit: notable
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: '\bconst\s+[A-Za-z0-9_$]+Address\s*=\s*["'']0x[a-fA-F0-9]{40}["'']'

- id: phantom-wallet-word
  desc: Phantom wallet name reference
  crit: notable
  conf: 0.5
  for: [python, javascript, typescript, csharp, go]
  count_min: 2
  if:
    type: text
    word: phantom
  not:
  - substr: PhantomJS
  - substr: phantomjs
  - substr: phantom_
  - substr: _phantom
  - substr: callPhantom
  - substr: phantom_soft
  - regex: '(?i)phantom (row|rows|sweep|delete|message)'
  - regex: '(?i)phantom:'

- id: defi-meme-token-vocabulary
  desc: DeFi meme-token and trading vocabulary
  crit: notable
  conf: 0.65
  for: [shell, javascript, typescript]
  if:
    type: string_literal
    regex: '(?i)\b(meme.?token|token.?hunter|sniper bot|trading bot)\b'

- id: defi-reward-claim-text
  desc: Natural-language reward claim or withdrawal text
  crit: notable
  conf: 0.65
  for: [shell, javascript, typescript, python]
  if:
    type: string_literal
    regex: '(?i)\b(claim|withdraw)\s+(the\s+)?(staking\s+)?rewards?\b'

- id: wagmi-read-write-action--readcontract
  desc: Wagmi contract read or write (readContract)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: readContract
- id: wagmi-read-write-action--writecontract
  desc: Wagmi contract read or write (writeContract)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: writeContract
- id: wagmi-read-write-action--simulatecontract
  desc: Wagmi contract read or write (simulateContract)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: simulateContract
- id: wagmi-watch-get-action--watchcontractevent
  desc: Wagmi contract watch or get (watchContractEvent)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: watchContractEvent
- id: wagmi-watch-get-action--getcontract
  desc: Wagmi contract watch or get (getContract)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: getContract

# ethers.js, the Ethereum JavaScript library. Its HTTP helper sets
# `method="POST"` and `Content-Type: application/octet-stream` whenever a
# request has a body, and the bundle is full of constant tables -- which is
# `exported-opaque-endpoint-beacon-config`'s entire evidence. Rabby Wallet
# bundles it and scored hostile for it.
#
# Two legs, because neither is enough alone: `_isProvider` is an ethers v5
# Provider brand check, and `Logger.errors.` is its error namespace, which
# appears 18 times in one chunk of that bundle.
- id: ethers-provider-brand
  desc: ethers.js provider brand check
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: _isProvider

- id: ethers-logger-error-namespace
  desc: ethers.js Logger error namespace
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    substr: 'Logger.errors.'

composite_rules:
- id: wagmi-read-write-action
  desc: Wagmi contract read or write wrapper
  crit: notable
  conf: 0.9
  any:
  - id: wagmi-read-write-action--readcontract
  - id: wagmi-read-write-action--writecontract
  - id: wagmi-read-write-action--simulatecontract
- id: wagmi-watch-get-action
  desc: Wagmi contract watch or get wrapper
  crit: notable
  conf: 0.9
  any:
  - id: wagmi-watch-get-action--watchcontractevent
  - id: wagmi-watch-get-action--getcontract
- id: generated-contract-abi
  desc: Generated Web3 contract ABI and type declarations
  crit: notable
  conf: 0.93
  needs: 2
  any:
  - id: well-known/lib/crypto/web3::contract-abi-const
  - id: well-known/lib/crypto/web3::contract-abi-function-entry
  - id: well-known/lib/crypto/web3::contract-abi-typed-name-field
  - id: well-known/lib/crypto/web3::contract-address-const
  - id: well-known/lib/crypto/web3::contract-address-field
  - id: well-known/lib/crypto/web3::wagmi-read-write-action--readcontract
  - id: well-known/lib/crypto/web3::wagmi-read-write-action--simulatecontract
  - id: well-known/lib/crypto/web3::wagmi-read-write-action--writecontract
  - id: well-known/lib/crypto/web3::wagmi-watch-get-action--getcontract
  - id: well-known/lib/crypto/web3::wagmi-watch-get-action--watchcontractevent

- id: ethers-js-bundle
  desc: ethers.js library bundle
  crit: notable
  conf: 0.97
  all:
    - id: ethers-provider-brand
    - id: ethers-logger-error-namespace
