# secure-library-loader (npm) -- packs a directory of JavaScript modules into a
# password-protected `.sll` container (scrypt + AES-256-GCM, `SLL1` magic) and,
# at runtime, decrypts that container into a lib folder and `require()`s the
# modules by name. The library itself is a neutral packaging tool; these atoms
# identify a consumer that ships code in that form so the objectives tier can
# judge what is being hidden and how the password is chosen.
#
# The `.sll` members themselves are not reachable: cleave skips archive members
# of unknown type, so a consumer is recognised by its calls into the loader
# API, its reference to a bundled `.sll` file, and its manifest dependency.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: install-library-call
    desc: Decrypts an .sll library to disk
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(installLibrary|installLibrarySync|loadEncryptedModule)$'

  - id: get-module-by-name-call
    desc: Requires a decrypted .sll module by name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getModuleByName$'

  - id: sll-container-path-literal
    desc: References a bundled .sll library file
    if:
      type: literal
      regex: '^[\w./-]{1,120}\.sll$'

  - id: npm-dependency
    desc: Manifest depends on secure-library-loader
    for: [package.json]
    if:
      type: value
      path: dependencies.secure-library-loader
      exists: true

composite_rules:
  # Consumer code that decrypts a container it ships and then loads a module
  # out of it: the three calls/literals sit together in one loader helper.
  - id: bundled-encrypted-module-loader
    desc: Decrypts bundled .sll modules and requires them
    near_lines: 40
    all:
      - id: install-library-call
      - id: get-module-by-name-call
      - id: sll-container-path-literal
