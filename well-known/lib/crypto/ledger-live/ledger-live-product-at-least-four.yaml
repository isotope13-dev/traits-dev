# Count text occurrences directly. A trait reference counts one finding,
# regardless of how many times the referenced product name occurs. This
# population proves neither app access nor collection.
defaults:
  for: [scripts, binaries, csharp]
  platforms: [macos, windows, linux]
traits:
  - id: ledger-live-product-at-least-four
    desc: At least four Ledger Live name occurrences
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      substr: Ledger Live
