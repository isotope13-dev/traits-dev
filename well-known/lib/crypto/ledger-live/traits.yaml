# Ledger Live coin modules and hardware-wallet signing integrations.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: coin-concordium-package
    desc: Ledger Live Concordium coin module
    if:
      type: value
      path: package.json::name
      exact: '@ledgerhq/coin-concordium'

  - id: ledger-wallet-framework-import
    desc: Ledger wallet framework signer import
    if:
      type: text
      substr: '@ledgerhq/ledger-wallet-framework'

  - id: sign-credential-deployment-api
    desc: Concordium credential deployment signer
    if:
      type: text
      substr: signCredentialDeployment

composite_rules:
  - id: ledger-live-coin-module-context
    desc: Ledger Live hardware-wallet coin module
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: coin-concordium-package
      - id: ledger-wallet-framework-import
      - id: sign-credential-deployment-api
