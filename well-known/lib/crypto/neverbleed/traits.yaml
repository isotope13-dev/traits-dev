# Neverbleed — privilege separation engine for OpenSSL / LibreSSL (h2o/neverbleed).
# Runs RSA and ECC private key operations in an isolated daemon process to protect keys against memory leaks.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: neverbleed-source-copyright
    desc: Neverbleed library copyright notice
    if:
      type: text
      substr: 'Copyright (c) 2015 Kazuho Oku, DeNA Co., Ltd.'

  - id: neverbleed-header-include
    desc: Neverbleed C header include
    if:
      type: text
      regex: '#include\s*["<]neverbleed\.h[">]'

  - id: neverbleed-api-symbol
    desc: Neverbleed OpenSSL engine API symbol
    if:
      type: text
      regex: '\bneverbleed_(init|load_private_key_file|setuidgid|transaction_read)\b'

composite_rules:
  - id: neverbleed-privilege-separation-engine
    desc: Neverbleed OpenSSL RSA privilege separation engine
    conf: 0.98
    crit: notable
    any:
      - id: neverbleed-source-copyright
      - id: neverbleed-header-include
      - id: neverbleed-api-symbol
