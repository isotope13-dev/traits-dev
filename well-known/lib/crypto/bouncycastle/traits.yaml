# Bouncy Castle is the JVM's general-purpose crypto provider, bundled by a
# large share of Java and Android software. Its ASN.1 packages exist to name
# every algorithm identifier there is, so its constant pools carry the
# vocabulary of key handling -- `id_dsa`, `id_ecdsa_with_sha3_256`,
# PKCS#10, PEM, private-key factories -- purely as X9/NIST OID constants.
# Credential- and key-handling rules see an implementer here, never a caller.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java, kotlin]
  crit: notable
  conf: 0.98

traits:
  - id: bouncycastle-package-namespace
    desc: References the Bouncy Castle package
    for: [class, java, kotlin]
    if:
      type: text
      substr: org/bouncycastle/

  - id: bouncycastle-provider-jar
    desc: Bouncy Castle provider library JAR
    if:
      type: basename
      regex: '^bc(prov|pkix|util|mail|pg)-jdk[0-9a-z]+-[0-9]'
