# MIT Kerberos 5 reference implementation source tree. Networked admin
# utilities (krcp, krshd) and platform installers are upstream code.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, shell, perl, python, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: krb5-source-tree-path
    desc: MIT krb5 source tree path
    if:
      type: path
      regex: '(^|[\\/])krb5-[0-9]+\.[0-9]+\.[0-9]+([\\/]|\.tar\.gz)'

  - id: krb5-appl-krcp
    desc: MIT krb5 krcp application source
    for: [c]
    if:
      type: basename
      exact: krcp.c

  - id: krb5-appl-krshd
    desc: MIT krb5 krshd daemon source
    for: [c]
    if:
      type: basename
      exact: krshd.c

composite_rules:
  - id: source-tree-context
    desc: Recognized MIT Kerberos 5 upstream source tree
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: krb5-source-tree-path
      - id: krb5-appl-krcp
      - id: krb5-appl-krshd
