# Official TweetNaCl.js package identity (dchest/tweetnacl-js).
# Brand atoms describe upstream metadata an impersonator can retain;
# hostile conclusions belong in objectives/supply-chain/.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.96

traits:
  - id: npm-package-name
    desc: Official TweetNaCl.js npm package name
    if:
      type: value
      path: name
      exact: tweetnacl

  - id: npm-util-package-name
    desc: Official TweetNaCl.js utility package name
    if:
      type: value
      path: name
      exact: tweetnacl-util

  - id: npm-package-repository
    desc: TweetNaCl.js upstream GitHub repository URL
    if:
      type: value
      path: repository.url
      substr: dchest/tweetnacl-js

  - id: npm-package-homepage
    desc: TweetNaCl.js official project homepage
    if:
      type: value
      path: homepage
      regex: '^https?://tweetnacl\.js\.org/?$'

composite_rules:
  - id: official-npm-package
    desc: Official TweetNaCl.js npm identity
    all:
      - id: npm-package-name
      - id: npm-package-repository
      - id: npm-package-homepage
