# uuidjs/uuid — RFC9562 UUID generation library.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: uuid-package-name
    desc: uuid npm package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: uuid

  - id: uuid-dist-path
    desc: uuid package dist member path
    for: [javascript, typescript, scripts, manifests, data, source]
    conf: 0.96
    if:
      type: path
      regex: '(?i)uuid[/\\]dist'

  - id: libuuid-theodore-tso-notice
    desc: Theodore Ts'o libuuid copyright notice
    for: [c, cpp]
    if:
      type: text
      substr: "Theodore Ts'o"

  - id: libuuid-dce-comment
    desc: DCE UUID generator comment
    for: [c, cpp]
    if:
      type: text
      substr: "generate a DCE-compatible uuid"

composite_rules:
  - id: libuuid-source-identity
    desc: libuuid DCE UUID library source identity
    for: [c, cpp]
    any:
      - id: libuuid-theodore-tso-notice
      - id: libuuid-dce-comment
