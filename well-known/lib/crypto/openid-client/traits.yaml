# panva/openid-client — OpenID Connect relying-party client.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: openid-client npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: openid-client

  - id: vendored-path
    desc: vendored openid-client package path
    if:
      type: path
      regex: 'node_modules/openid-client/'

composite_rules:
  - id: openid-client-library
    desc: openid-client OIDC relying party
    any:
      - id: package-name
      - id: vendored-path
