defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - tar
  - zip
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000
traits:
- id: package-name
  desc: '@ton-community/assets-sdk npm package name'
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@ton-community/assets-sdk'
- id: github-repository
  desc: TON assets-sdk GitHub repository
  for:
  - javascript
  - typescript
  - package.json
  if:
    type: text
    substr: github.com/ton-community/assets-sdk
- id: sdk-marker
  desc: AssetsSDK library marker
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: AssetsSDK
