defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: core-path
    desc: Better Auth core dependency path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '@better-auth[\\/]core'
  - id: social-provider-path
    desc: Better Auth social-provider path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: 'social-providers'
  - id: dropbox-provider-file
    desc: Better Auth Dropbox provider file
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^dropbox\.(m?js|ts)$'

composite_rules:
  - id: dropbox-oauth-provider-context
    desc: Better Auth Dropbox OAuth provider
    crit: exception
    conf: 0.99
    all:
      - id: core-path
      - id: social-provider-path
      - id: dropbox-provider-file
