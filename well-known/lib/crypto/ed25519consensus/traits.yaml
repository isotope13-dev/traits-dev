# github.com/hdevalence/ed25519consensus — ZIP215 Ed25519 verification.
# Its BSD LICENSE is the Go Authors grant plus Henry de Valence 2020.
defaults:
  platforms: [unix, windows]
  for: [text, go]
  crit: notable
  conf: 0.98
  size_min: 32
  size_max: 200000

traits:
  - id: valence-2020-copyright
    desc: Henry de Valence 2020 copyright line
    if:
      type: text
      substr: Copyright (c) 2020 Henry de Valence

  - id: go-authors-2009-copyright
    desc: Go Authors 2009 copyright line
    if:
      type: text
      substr: Copyright (c) 2009 The Go Authors

composite_rules:
  - id: ed25519consensus-license-identity
    desc: Recognized ed25519consensus BSD license
    all:
      - id: valence-2020-copyright
      - id: go-authors-2009-copyright
