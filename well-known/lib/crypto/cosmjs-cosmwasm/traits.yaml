# @cosmjs/cosmwasm — CosmJS CosmWasm smart-contract client SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, zip]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 52428800

traits:
  - id: cosmjs-cosmwasm-package-name
    desc: CosmJS cosmwasm npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@cosmjs/cosmwasm'

  - id: cosmjs-cosmwasm-repository
    desc: cosmjs cosmwasm GitHub repository path
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: cosmjs/tree/main/packages/cosmwasm

  - id: cosmjs-wasm-amino-messages-basename
    desc: CosmJS wasm amino messages module basename
    for: [javascript, typescript]
    if:
      type: basename
      exact: aminomessages.js

  - id: cosmjs-cosmwasm-wasm-msg-marker
    desc: CosmWasm wasm v1 message type marker
    for: [javascript, typescript]
    if:
      type: text
      substr: cosmwasm.wasm.v1.Msg

composite_rules:
  - id: cosmjs-cosmwasm-library
    desc: CosmJS CosmWasm client SDK
    crit: exception
    conf: 0.97
    any:
      - id: cosmjs-cosmwasm-package-name
      - id: cosmjs-cosmwasm-repository
      - id: cosmjs-wasm-amino-messages-basename
      - id: cosmjs-cosmwasm-wasm-msg-marker
