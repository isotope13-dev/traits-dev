# RSAEuro, J.S.A. Kapp's 1990s RSA toolkit (an RSAREF reimplementation),
# linked into binaries that need RSA without a system crypto API.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 16384
  size_max: 33554432
traits:
  - id: rsaeuro-copyright-banner
    desc: RSAEuro library copyright banner
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rdata
      regex: '^Copyright \(c\) J\.S\.A\.Kapp 9[0-9]-9[0-9]\.?$'
