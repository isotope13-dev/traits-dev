# OpenPGP.js / browser PGP UI helpers.
# FP context: private-key + passphrase password fields resemble wallet phish.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, xpi, archives]
  conf: 0.98
  size_max: 5000000

traits:
  - id: openpgp-ui-controller-banner
    desc: OpenPGP extension UI controller banner
    crit: notable
    size_min: 64
    if:
      type: text
      substr: 'UI Controller for OpenPGP Extension'

  - id: openpgp-ui-logger-tag
    desc: OpenPGP UI logger tag
    crit: notable
    size_min: 64
    if:
      type: text
      substr: 'OpenPGP UI'

composite_rules:
  - id: openpgp-extension-ui-context
    desc: OpenPGP browser extension UI context
    crit: exception
    all:
      - id: openpgp-ui-controller-banner
      - id: openpgp-ui-logger-tag
