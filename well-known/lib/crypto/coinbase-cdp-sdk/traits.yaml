# @coinbase/cdp-sdk — official Coinbase Developer Platform Wallet API SDK
# (https://github.com/coinbase/cdp-sdk).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Coinbase CDP SDK package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@coinbase/cdp-sdk'

  - id: archive-package-name
    desc: Coinbase CDP SDK npm archive identity
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@coinbase/cdp-sdk'

  - id: package-member-context
    desc: Coinbase CDP SDK package member context
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@coinbase/cdp-sdk'

  - id: repository-coordinate
    desc: Coinbase CDP SDK GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository
      regex: 'github\.com/coinbase/cdp-sdk'

  - id: cdp-api-endpoint
    desc: Coinbase CDP API endpoint constant
    for: [javascript, typescript]
    if:
      type: text
      substr: api.cdp.coinbase.com

composite_rules:
  - id: coinbase-cdp-sdk-context
    desc: Coinbase Developer Platform Wallet API SDK
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
