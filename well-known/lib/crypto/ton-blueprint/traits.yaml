# @ton/blueprint — official TON smart-contract development framework.
# Documented WALLET_MNEMONIC deploy env reads are expected dev-tool behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: "@ton/blueprint npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@ton/blueprint"

  - id: github-repository
    desc: TON Blueprint GitHub repository
    if:
      type: text
      substr: github.com/ton-org/blueprint

  - id: framework-description
    desc: TON Blueprint framework description
    if:
      type: text
      substr: Framework for development of TON smart contracts

  - id: network-provider-module-path
    desc: TON Blueprint network provider dist module
    if:
      type: path
      regex: '(?i)dist/network/createNetworkProvider'

composite_rules:
  - id: ton-blueprint-context
    desc: Official TON Blueprint smart-contract dev framework
    crit: exception
    conf: 0.99
    any:
      - id: package-name
      - id: github-repository
      - id: framework-description
      - id: network-provider-module-path
