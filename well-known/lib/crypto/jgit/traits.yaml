# JGit is a Java implementation of Git. Git transport, repository storage,
# and SSH/TLS support naturally use sockets, crypto, and file output; those
# capabilities are not a loader or a backdoor on their own.
defaults:
  platforms: [unix, windows]
  for: [jar]
  crit: notable
  conf: 0.99
  size_min: 100000
  size_max: 100000000

traits:
  - id: eclipse-jgit-jar
    desc: Eclipse JGit library JAR
    if:
      type: basename
      regex: '^org\.eclipse\.jgit-[0-9][A-Za-z0-9._-]*\.jar$'

  - id: openrewrite-jgit-jar
    desc: OpenRewrite JGit library JAR
    if:
      type: basename
      regex: '^jgit-[0-9][A-Za-z0-9._-]*\.jar$'

  # Package namespaces identify JGit from an individual extracted .class as
  # well as from the jar, because the constant pool stores the internal name
  # of every type the class references. The jar-sized `size_min` above would
  # exclude a single class file, so these two opt out of it.
  - id: eclipse-jgit-package-namespace
    desc: Eclipse JGit package namespace
    for: [class, jar, java, kotlin]
    size_min: 200
    if:
      type: text
      substr: org/eclipse/jgit/

  - id: openrewrite-jgit-package-namespace
    desc: OpenRewrite JGit package namespace
    for: [class, jar, java, kotlin]
    size_min: 200
    if:
      type: text
      substr: org/openrewrite/jgit/
