defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: SwapKit SDK package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@swapkit/(api|core|helpers|tokens|toolboxes|types|utxo-signer|wallet-[a-z0-9-]+)$'

  - id: repository-marker
    desc: SwapKit repository marker
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: 'github.com/swapkit/SwapKit'

  - id: swapkit-package-path
    desc: SwapKit package archive path
    for: [npm]
    if:
      type: path
      regex: '(^|[\\/])@swapkit-[a-z0-9-]+-[0-9][^\\/]*\.tgz$'

  - id: swapkit-import
    desc: SwapKit package import
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']@swapkit/[a-z0-9-]+["'']'

composite_rules:
  - id: swapkit-package-context
    desc: Recognized SwapKit package context
    crit: notable
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: repository-marker
      - id: swapkit-package-path
      - id: swapkit-import
