# Browserify's crypto polyfill ecosystem. These package names identify a
# recognizable library bundle; they are software identity, not runtime metadata.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: polyfill-bundle
    desc: Browserify crypto polyfill bundle
    if:
      type: text
      regex: 'crypto-browserify|browserify-aes|browserify-sign|public-encrypt'
