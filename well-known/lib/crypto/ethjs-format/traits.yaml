# @metamask/ethjs-format — Ethereum unit/address formatting utilities.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.97

traits:
  - id: ethjs-format-package-name
    desc: MetaMask ethjs-format npm package
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@metamask/)?ethjs-format$'

  - id: ethjs-format-archive-path
    desc: ethjs-format npm package path
    if:
      type: path
      regex: 'ethjs-format'

  - id: ethjs-format-npm-member-path
    desc: ethjs-format npm archive member path
    if:
      type: path
      regex: 'ethjs-format@'

  - id: ethjs-format-dist-basename
    desc: ethjs-format distribution bundle basename
    for: [javascript, typescript]
    if:
      type: basename
      regex: '^ethjs-format(\.min)?\.js$'

  - id: ethjs-format-stack-import
    desc: Imports MetaMask ethjs-format module
    for: [javascript, typescript]
    if:
      type: text
      regex: '@metamask/ethjs-format\b|require\([''"]ethjs-format[''"]\)'

composite_rules:
  - id: ethjs-format-library
    desc: MetaMask ethjs-format utility library
    crit: exception
    conf: 0.97
    any:
      - id: ethjs-format-package-name
      - id: ethjs-format-archive-path
      - id: ethjs-format-npm-member-path
      - id: ethjs-format-dist-basename
      - id: ethjs-format-stack-import
