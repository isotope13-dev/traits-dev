# defillama-adapters — TVL adapters for DefiLlama chain coverage.
# Multi-RPC env defaults are chain data sources, not blockchain C2.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: defillama-adapters npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: defillama-adapters

  - id: github-repo
    desc: DefiLlama adapters GitHub repository
    if:
      type: text
      substr: github.com/defillama/defillama-adapters

  - id: adapters-tree
    desc: DefiLlama adapters source tree path
    if:
      type: path
      regex: 'defillama-adapters'
