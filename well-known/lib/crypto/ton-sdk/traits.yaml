# @ton/ton — official TON JavaScript SDK (ton-org).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, zip, archives]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: "@ton/ton npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@ton/ton"

  - id: github-repository
    desc: TON JavaScript SDK GitHub repository
    if:
      type: text
      substr: github.com/ton-org/ton

  - id: multisig-wallet-class
    desc: TON SDK multisig wallet contract class
    for: [javascript, typescript]
    if:
      type: text
      substr: export declare class MultisigWallet

composite_rules:
  - id: ton-sdk-context
    desc: Official TON JavaScript SDK context
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: github-repository
      - id: multisig-wallet-class
