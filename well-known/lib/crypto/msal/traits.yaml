# MSAL -- Microsoft Authentication Library; test and helper paths.
defaults:
  crit: notable
  conf: 0.98
  platforms: [unix, windows]
traits:
- id: msal-win-installer-helper-path
  desc: MSAL Windows installer helper path
  crit: notable
  conf: 0.98
  for: [powershell]
  if:
    type: path
    regex: '(^|[\\/])build[\\/]win-installer-helper\.psm1$'
- id: msal-netcore-listener-test-path
  desc: MSAL NetCore listener dev test path
  crit: notable
  conf: 0.98
  for: [csharp]
  if:
    type: path
    regex: '(^|[\\/])SingleMessageTcpListener\.cs$'
- id: msal-headless-cache-test-path
  desc: MSAL headless cache integration test path
  crit: notable
  conf: 0.98
  for: [csharp]
  if:
    type: path
    regex: '(^|[\\/])MsalCacheStorageIntegrationTests\.cs$'
- id: msalruntime-product-name
  desc: MSAL runtime PE product name
  crit: notable
  conf: 0.99
  for: [pe, dll]
  size_min: 10000
  size_max: 50000000
  if:
    type: value
    path: pe.version.product_name
    exact: msalruntime
- id: msalruntime-dll-basename
  desc: MSAL runtime DLL basename
  crit: notable
  conf: 0.99
  for: [pe, dll]
  size_min: 10000
  size_max: 50000000
  if:
    type: basename
    exact: msalruntime.dll

composite_rules:
- id: msalruntime-dll-context
  desc: MSAL native runtime DLL context
  crit: notable
  conf: 0.99
  for: [pe, dll]
  all:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  any:
  - id: msalruntime-product-name
  - id: msalruntime-dll-basename

