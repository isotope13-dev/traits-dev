# @ton-api/* — Tonkeeper TonAPI JavaScript client and blockchain adapters.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: ton-api-client-import
    desc: Imports @ton-api/client module
    for: [javascript, typescript]
    if:
      type: text
      substr: "@ton-api/client"

  - id: ton-adapter-package-name
    desc: "@ton-api/ton-adapter npm package name"
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@ton-api/ton-adapter"

  - id: tonkeeper-tonapi-js-repo
    desc: Tonkeeper tonapi-js GitHub repository
    for: [javascript, typescript, package.json]
    if:
      type: text
      substr: github.com/tonkeeper/tonapi-js

  - id: tonapi-adapter-source-marker
    desc: TonAPI adapter source artifact marker
    for: [javascript, typescript]
    if:
      type: text
      substr: tonapi-adapter
