# libsignal — Signal Messenger cryptographic protocol implementation.
defaults:
  platforms: [unix, windows, android]
  for: [rust, crate, cargo.toml, python, javascript, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: signal-messenger-copyright
    desc: Signal Messenger copyright header
    if:
      type: text
      substr: Copyright (C) 2023 Signal Messenger, LLC

  - id: libsignal-repository
    desc: libsignal upstream repository
    if:
      type: text
      substr: github.com/signalapp/libsignal

  - id: libsignal-archive-path
    desc: libsignal source archive path
    for: [rust, python, javascript]
    if:
      type: path
      regex: 'libsignal-[0-9]'

  - id: message-backup-key-module
    desc: libsignal message backup key module path
    for: [rust]
    if:
      type: path
      regex: 'message-backup[/\\]src[/\\]key\.rs'

composite_rules:
  - id: libsignal-source-context
    desc: Signal libsignal upstream source tree
    crit: exception
    conf: 0.99
    any:
      - id: signal-messenger-copyright
      - id: libsignal-repository
      - id: libsignal-archive-path
      - id: message-backup-key-module
