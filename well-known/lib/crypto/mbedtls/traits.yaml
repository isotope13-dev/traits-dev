# Mbed TLS (formerly PolarSSL) — TLS/crypto C library source tree.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, python, perl, shell]
  crit: notable
  conf: 0.99

traits:
  - id: contributors-copyright
    desc: Mbed TLS contributors copyright line
    if:
      type: text
      substr: Copyright The Mbed TLS Contributors

  - id: public-header-include
    desc: mbedtls public header include
    if:
      type: text
      substr: '#include "mbedtls/'

  - id: versioned-tree-path
    desc: Mbed TLS versioned source tree path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'mbedtls-[0-9]+\.[0-9]+'

  - id: p256m-vendor-path
    desc: vendored p256-m curve implementation path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '3rdparty/p256-m/'

  # Compiled and stripped artifacts keep neither the contributors banner nor
  # the include lines, but mbedtls's assert/__FILE__ strings preserve the
  # vendored tree path they were built from. This is the linked-binary
  # spelling of the library identity.
  - id: vendored-source-path
    desc: Vendored mbedtls source tree path
    crit: notable
    conf: 0.92
    size_min: 51200
    for: [binaries]
    if:
      # Linked binaries keep the vendored tree in __FILE__ strings.
      type: text
      regex: 'vendor[/\\]mbedtls[/\\]'

composite_rules:
  - id: mbedtls-library
    desc: Mbed TLS cryptography library
    all:
      - id: versioned-tree-path
    any:
      - id: contributors-copyright
      - id: public-header-include
      - id: p256m-vendor-path
