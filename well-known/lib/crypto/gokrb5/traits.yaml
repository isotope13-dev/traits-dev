# gokrb5 is a pure Go Kerberos client library. Weak etypes, Docker test
# fixtures, and bundled MIT krb5 sources are expected in this tree.
defaults:
  platforms: [unix, windows]
  for: [go, shell, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: module-path
    desc: jcmturner gokrb5 Go module path
    for: [go]
    if:
      type: text
      substr: gopkg.in/jcmturner/gokrb5

  - id: release-tree-path
    desc: jcmturner gokrb5 release source tree path
    if:
      type: path
      regex: '(^|[\\/])gokrb5\.v[0-9]'

  - id: testenv-bootstrap-script
    desc: gokrb5 Kerberos test bootstrap script
    for: [shell]
    if:
      type: path
      regex: 'gokrb5\.v[0-9].{0,80}testenv.{0,80}bootstrap\.sh$'

composite_rules:
  - id: library-context
    desc: Recognized jcmturner gokrb5 Kerberos library context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: module-path
      - id: release-tree-path
