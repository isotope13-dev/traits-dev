# ChainSafe Lodestar-Z is a Zig implementation of Ethereum consensus state
# transitions exposed to Node.js as a native addon. Platform packages carry a
# small manifest beside a large, unstripped Zig binary with stable source-root
# and beacon-state symbols.
defaults:
  platforms: [linux]
  for: [package.json, npm, elf, so]
  crit: notable
  conf: 0.98
  size_max: 200000000

traits:
  - id: platform-package-name
    desc: ChainSafe Lodestar-Z platform package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@chainsafe/lodestar-z(-[A-Za-z0-9_]+-unknown-[A-Za-z0-9_-]+)?$'

  - id: repository-url
    desc: ChainSafe Lodestar-Z repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: git+https://github.com/ChainSafe/lodestar-z.git

  - id: native-build-root
    desc: Lodestar-Z native build source root
    for: [elf, so]
    size_min: 1048576
    if:
      type: raw
      substr: /home/runner/work/lodestar-z/lodestar-z
      section: .debug_str

  - id: beacon-state-transition-marker
    desc: Lodestar-Z beacon transition symbol string
    for: [elf, so]
    size_min: 1048576
    if:
      type: text
      exact: state_transition.processSlots
      section: .debug_str

composite_rules:
  - id: package-identity
    desc: ChainSafe Lodestar-Z platform package identity
    for: [package.json, npm]
    all:
      - id: platform-package-name
      - id: repository-url

  - id: native-addon-identity
    desc: ChainSafe Lodestar-Z consensus native addon
    for: [elf, so]
    all:
      - id: native-build-root
      - id: beacon-state-transition-marker
      - id: metadata/binary/framework::node-api-addon-export
