# Yubico's PHP OTP client (Auth_Yubico) exposes optional HTTPS verify flags;
# CURLOPT_SSL_VERIFYPEER is toggled only when the caller sets _httpsverify off.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95
traits:
  - id: auth-yubico-class
    desc: Auth_Yubico OTP client class
    if:
      type: text
      regex: class\s+Auth_Yubico\b
  - id: auth-yubico-package-tag
    desc: Auth_Yubico package doc tag
    conf: 0.9
    if:
      type: text
      substr: "@package     Auth_Yubico"
  - id: yubico-verify-api-path
    desc: Yubico OTP verify API path
    conf: 0.9
    if:
      type: text
      substr: api.yubico.com/wsapi/verify
composite_rules:
  - id: yubico-php-client-library
    desc: Yubico PHP OTP verification client library
    crit: notable
    conf: 0.97
    any:
      - id: auth-yubico-class
      - id: auth-yubico-package-tag
      - id: yubico-verify-api-path
