# @metamask/* packages from the MetaMask/core monorepo on GitHub.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: MetaMask scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@metamask/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-archive-name
    desc: MetaMask scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@metamask/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: core-monorepo-repository-url
    desc: MetaMask core monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^(git\+)?https://github\.com/metamask/core(\.git)?$'

  - id: core-monorepo-repository-string
    desc: MetaMask core monorepo repo string
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(?i)^(git\+)?https://github\.com/metamask/core(\.git)?$'

  - id: core-monorepo-npm-repository-url
    desc: MetaMask core npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)^(git\+)?https://github\.com/metamask/core(\.git)?$'

  - id: npm-member-path
    desc: MetaMask core npm archive member path
    if:
      type: path
      regex: '@metamask/'

composite_rules:
  - id: package-identity
    desc: MetaMask core monorepo package identity
    crit: notable
    conf: 0.99
    all:
      - id: scoped-package-name
    any:
      - id: core-monorepo-repository-url
      - id: core-monorepo-repository-string

  - id: metamask-core-library
    desc: MetaMask core monorepo published library
    crit: exception
    conf: 0.97
    scope: archive
    any:
      - id: package-identity
      - id: scoped-npm-archive-name
      - id: npm-member-path
      - id: core-monorepo-npm-repository-url
