# panva/jose — JSON Object Signing and Encryption for Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: jose npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jose

  - id: vendored-path
    desc: vendored jose package path
    if:
      type: path
      regex: 'node_modules/jose/'

composite_rules:
  - id: jose-library
    desc: panva jose JWS/JWE library
    any:
      - id: package-name
      - id: vendored-path
