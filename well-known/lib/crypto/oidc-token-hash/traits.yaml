# panva/oidc-token-hash — OpenID token hash helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: oidc-token-hash npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: oidc-token-hash

  - id: vendored-path
    desc: vendored oidc-token-hash package path
    if:
      type: path
      regex: 'node_modules/oidc-token-hash/'

composite_rules:
  - id: oidc-token-hash-library
    desc: oidc-token-hash at_hash helper
    any:
      - id: package-name
      - id: vendored-path
