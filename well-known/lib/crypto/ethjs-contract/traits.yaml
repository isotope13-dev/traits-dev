# @metamask/ethjs-contract — Ethereum contract RPC helper library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.97

traits:
  - id: ethjs-contract-package-name
    desc: MetaMask ethjs-contract npm package
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@metamask/)?ethjs-contract$'

  - id: ethjs-contract-archive-path
    desc: ethjs-contract npm package path
    if:
      type: path
      regex: 'ethjs-contract'

  - id: ethjs-contract-npm-member-path
    desc: ethjs-contract npm archive member path
    if:
      type: path
      regex: 'ethjs-contract@'

  - id: ethjs-contract-dist-basename
    desc: ethjs-contract distribution bundle basename
    for: [javascript, typescript]
    if:
      type: basename
      regex: '^ethjs-contract(\.min)?\.js$'

  - id: ethjs-contract-stack-import
    desc: Imports MetaMask ethjs contract RPC module
    for: [javascript, typescript]
    if:
      type: text
      regex: '@metamask/ethjs-(filter|query|contract)\b'

composite_rules:
  - id: ethjs-contract-contract-integration-test
    desc: ethjs-contract ganache mocha integration test
    crit: exception
    conf: 0.96
    all:
      - id: metadata/import/npm/ganache-cli::ganache-cli
      - id: metadata/package/testing/presence/scripted::it-call

  - id: ethjs-contract-library
    desc: MetaMask ethjs-contract utility library
    crit: exception
    conf: 0.97
    any:
      - id: ethjs-contract-package-name
      - id: ethjs-contract-archive-path
      - id: ethjs-contract-npm-member-path
      - id: ethjs-contract-dist-basename
      - id: ethjs-contract-stack-import
      - id: ethjs-contract-contract-integration-test
