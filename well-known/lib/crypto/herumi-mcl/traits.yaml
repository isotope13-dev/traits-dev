# herumi/mcl — pairing-based crypto (BLS12-381). Native Windows builds
# use VirtualProtect for generated pairing code and nonstandard sections
# from MSVC; the COFF stamp is hash-derived, not an evasive layout.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 8000000

traits:
  - id: bls12-g1-sig-scheme
    desc: MCL BLS12-381 G1 signature scheme id
    if:
      type: text
      substr: BLS_SIG_BLS12381G1_XMD:SHA-256_SSWU_RO_POP_
      section: .rdata

  - id: mcl-cpu-flag
    desc: MCL CPU capability token
    if:
      type: text
      substr: MCL_CPU
      section: .rdata

  - id: dll-basename
    desc: Bundled mcl.dll basename
    if:
      type: path
      basename: true
      exact: mcl.dll

composite_rules:
  - id: pairing-library-binary
    desc: herumi MCL pairing library binary
    crit: notable
    conf: 0.99
    all:
      - id: bls12-g1-sig-scheme
      - id: mcl-cpu-flag
      - id: dll-basename

  # Groups signed MS/SAP leaves, Next SWC, and MCL so the random-layout
  # hostile stays under the unless budget instead of N separate carve-outs.
  - id: known-nonrandom-pe-layout
    desc: Known non-random native PE layout
    crit: exception
    conf: 0.99
    any:
      - id: bls12-g1-sig-scheme
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/leaf::sap-se
