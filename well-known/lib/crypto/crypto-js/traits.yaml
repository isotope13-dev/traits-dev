defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: crypto-js-buffered-block-algorithm
    desc: CryptoJS BufferedBlockAlgorithm identifier
    conf: 0.95
    if:
      type: text
      word: BufferedBlockAlgorithm
  - id: crypto-js-hmac-helper-factory
    desc: CryptoJS HMAC helper factory identifier
    conf: 0.95
    if:
      type: text
      word: _createHmacHelper
composite_rules:
  - id: crypto-js-library-implementation
    desc: Contains CryptoJS cryptography implementation
    conf: 0.98
    all:
      - id: crypto-js-buffered-block-algorithm
      - id: crypto-js-hmac-helper-factory
