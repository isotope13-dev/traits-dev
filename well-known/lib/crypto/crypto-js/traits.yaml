defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: crypto-js-buffered-block-algorithm
    desc: CryptoJS BufferedBlockAlgorithm identifier
    conf: 0.95
    if:
      type: text
      word: BufferedBlockAlgorithm
  - id: crypto-js-hmac-helper-factory
    desc: CryptoJS HMAC helper factory identifier
    conf: 0.95
    if:
      type: text
      word: _createHmacHelper
  # Manifest identity: the upstream package's name and its description, as a
  # clone copies them. Neither alone says which package this is.
  - id: crypto-js-package-name
    desc: npm manifest names the crypto-js package
    conf: 0.95
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: crypto-js
  - id: crypto-js-manifest-description
    desc: npm manifest carries the CryptoJS description
    conf: 0.9
    for: [npm]
    if:
      type: value
      path: npm.description
      exact: JavaScript library of cryptography standards.
composite_rules:
  - id: crypto-js-library-implementation
    desc: Contains CryptoJS cryptography implementation
    conf: 0.98
    all:
      - id: crypto-js-buffered-block-algorithm
      - id: crypto-js-hmac-helper-factory
