# crypto-js library identity - legitimate JavaScript cryptography library that
# implements RC4, AES, and other ciphers for normal document and data encryption.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: crypto-js-library-marker
    desc: crypto-js library import or usage
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'require\(["'']crypto-js["'']\)|CryptoJS\.(AES|RC4|DES|Rabbit|TripleDES)\b'
  - id: crypto-js-package-dependency
    desc: crypto-js npm dependency declaration
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: dependencies.crypto-js
      exists: true
composite_rules:
  - id: crypto-js-library-context
    desc: File bundles crypto-js cryptography library
    crit: notable
    conf: 0.9
    any:
      - id: crypto-js-library-marker
      - id: crypto-js-package-dependency
