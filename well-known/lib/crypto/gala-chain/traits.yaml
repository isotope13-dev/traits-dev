# @gala-chain — official GalaChain blockchain SDK and tooling
# (https://gitlab.com/gala-games/defi/launchpad/sdk).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: "@gala-chain npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@gala-chain/'

  - id: archive-package-name
    desc: "@gala-chain npm archive identity"
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      regex: '^@gala-chain/'

  - id: package-member-context
    desc: "@gala-chain package member context"
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      regex: '^@gala-chain/'

  - id: repository-coordinate
    desc: GalaChain GitLab repository
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: 'gitlab.com/gala-games'

  - id: galachain-sdk-marker
    desc: GalaChain SDK or Launchpad identifier
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(createLaunchpadSDK|GalaChain|Gala\s*Launchpad)\b'

composite_rules:
  - id: gala-chain-context
    desc: Official GalaChain SDK and tooling framework
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: archive-package-name
      - id: package-member-context
      - id: repository-coordinate
      - id: galachain-sdk-marker
