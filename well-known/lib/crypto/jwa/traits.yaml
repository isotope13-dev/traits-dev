# brianloveswords/node-jwa — JSON Web Algorithms (JWS) helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: jwa npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jwa

  - id: repository
    desc: jwa GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: brianloveswords/node-jwa

  - id: vendored-path
    desc: jwa package path
    if:
      type: path
      regex: '(^|[\\/])jwa([\\/]|$)'
