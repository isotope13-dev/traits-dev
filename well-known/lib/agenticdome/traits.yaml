# AgenticDome is a security guardrails SDK.  Its identity is kept separate
# from the neutral HTTP, cryptographic, MCP, and agent-hook capabilities used
# by its adapters.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AgenticDome SDK package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: agenticdome-python-sdk

  - id: wheel-distribution-name
    desc: AgenticDome SDK wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: agenticdome_python_sdk

  - id: project-homepage
    desc: AgenticDome SDK project homepage
    for: [pkginfo]
    if:
      type: text
      substr: https://www.agenticdome.io
