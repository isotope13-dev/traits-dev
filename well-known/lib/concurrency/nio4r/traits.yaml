defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
traits:
- id: gem-name
  desc: nio4r Ruby gem package name
  for:
  - gem
  if:
    type: value
    path: gem.name
    exact: nio4r
- id: gem-homepage
  desc: socketry/nio4r official gem homepage
  for:
  - gem
  if:
    type: value
    path: gem.homepage
    substr: github.com/socketry/nio4r
- id: socketry-github-repo
  desc: socketry/nio4r upstream repository URL
  for:
  - ruby
  - c
  - java
  - markdown
  if:
    type: text
    substr: github.com/socketry/nio4r
- id: jruby-nio4r-package
  desc: JRuby nio4r Java package namespace
  for:
  - java
  if:
    type: text
    substr: package org.nio4r
composite_rules:
- id: package-identity
  desc: Recognized socketry nio4r IO library
  for:
  - gem
  - ruby
  - c
  - java
  - markdown
  - elf
  - macho
  any:
  - id: gem-name
  - id: gem-homepage
  - id: jruby-nio4r-package
  - id: micro-behaviors/os/event/loop::libev-error
  all:
  - id: socketry-github-repo
