# eventlet ships an interactive Python REPL module (eventlet.backdoor)
# for network debugging over a socket connection.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  crit: notable
  conf: 0.99

traits:
  - id: eventlet-backdoor-path
    desc: eventlet backdoor module path
    size_max: 200000
    if:
      type: path
      regex: '(?i)(^|[\\/])eventlet[\\/]backdoor\.pyc?$'

  - id: eventlet-package-marker
    desc: Uses the eventlet library
    if:
      type: text
      regex: '\beventlet\.'

composite_rules:
  - id: eventlet-backdoor-debug-context
    desc: Eventlet backdoor debugging context
    crit: exception
    conf: 0.99
    all:
      - id: eventlet-backdoor-path
      - id: eventlet-package-marker
