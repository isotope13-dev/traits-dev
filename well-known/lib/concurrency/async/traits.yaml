defaults:
  crit: notable
  conf: 0.95
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: async-exports-utility-regex
    desc: caolan async utility export family A
    if:
      type: text
      regex: async\.(forEach|series|parallel|waterfall)\s*=

  - id: async-exports-utility-regex-b
    desc: caolan async utility export family B
    if:
      type: text
      regex: async\.(map|filter|reduce)\s*=
