# PRRTE, the PMIx Reference RunTime Environment used to launch HPC jobs.
# libprrte exports the prte_* runtime API; its daemons log peer-connection
# diagnostics that resemble mesh-implant status messages.
defaults:
  platforms: [linux]
  for: [elf, so]
  crit: component
  conf: 0.9
  size_min: 262144

traits:
  - id: prte-init-export
    desc: Exports prte_init runtime entry point
    if:
      type: symbol
      kind: export
      exact: prte_init
  - id: prte-finalize-export
    desc: Exports prte_finalize runtime entry point
    if:
      type: symbol
      kind: export
      exact: prte_finalize
  - id: oversubscribe-help-text
    desc: PRRTE oversubscription help text
    if:
      type: text
      substr: You can force PRRTE to oversubscribe
      section: rodata

composite_rules:
  - id: runtime-library
    desc: PRRTE runtime library
    crit: notable
    conf: 0.97
    all:
      - id: prte-init-export
      - id: prte-finalize-export
      - id: oversubscribe-help-text
