# Bluebird — JavaScript Promise implementation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Bluebird npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: bluebird

  - id: vendored-path
    desc: Vendored Bluebird package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/bluebird/'
