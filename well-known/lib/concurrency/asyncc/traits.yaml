# commenthol/asyncc is a legitimate async utility package. Its name is one
# character from `async`, which trips the built-in typosquat edit-distance hook.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: asyncc npm package name
    if:
      type: value
      path: name
      exact: asyncc

  - id: asyncc-dependency
    desc: Declares asyncc dependency
    if:
      type: value
      path: dependencies.asyncc
      exists: true

  - id: asyncc-dev-dependency
    desc: Declares asyncc dev dependency
    if:
      type: value
      path: devDependencies.asyncc
      exists: true

  - id: asyncc-optional-dependency
    desc: Declares asyncc optional dependency
    if:
      type: value
      path: optionalDependencies.asyncc
      exists: true
