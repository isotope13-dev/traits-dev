# commenthol/asyncc is a legitimate async utility package. Its name is one
# character from `async`, which trips the built-in typosquat edit-distance hook.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: asyncc npm package name
    if:
      type: value
      path: name
      exact: asyncc

  - id: asyncc-dependency
    desc: Declares asyncc dependency
    if:
      type: value
      path: dependencies.asyncc
      exists: true

  - id: asyncc-dev-dependency
    desc: Declares asyncc dev dependency
    if:
      type: value
      path: devDependencies.asyncc
      exists: true

  - id: asyncc-optional-dependency
    desc: Declares asyncc optional dependency
    if:
      type: value
      path: optionalDependencies.asyncc
      exists: true

  # The upstream manifest names its own GitHub repository. Together with the
  # exact package name it identifies the real commenthol release rather than
  # an unrelated manifest that merely borrows the name.
  - id: upstream-repository
    desc: asyncc upstream GitHub repository
    if:
      type: value
      path: repository.url
      regex: 'github\.com/commenthol/asyncc(\.git)?$'

composite_rules:
  - id: upstream-asyncc-manifest
    desc: Manifest of the upstream commenthol asyncc package
    crit: exception
    all:
      - id: package-name
      - id: upstream-repository
