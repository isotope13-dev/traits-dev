# Xray-core Finalmask mKCP source identity. These signatures describe the
# PacketConn adapter and its protocol-header selector; they do not imply C2,
# payload delivery, or hostile intent.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: config-udp-marker
    desc: Empty UDP configuration marker method
    crit: component
    if:
      type: text
      exact: 'func (c *Config) UDP() {}'

  - id: config-header-conn-marker
    desc: Empty HeaderConn configuration marker method
    crit: component
    if:
      type: text
      exact: 'func (c *Config) HeaderConn() {}'

  - id: config-client-wrapper-signature
    desc: PacketConn client wrapper signature
    crit: component
    if:
      type: text
      regex: '^func \(c \*Config\) WrapPacketConnClient\(raw net\.PacketConn'

  - id: config-server-wrapper-signature
    desc: PacketConn server wrapper signature
    crit: component
    if:
      type: text
      regex: '^func \(c \*Config\) WrapPacketConnServer\(raw net\.PacketConn'

  - id: header-conn-type
    desc: Header PacketConn adapter type
    crit: component
    if:
      type: text
      exact: 'type headerConn struct {'

  - id: header-id-selector
    desc: Header protocol ID selector
    crit: component
    if:
      type: text
      exact: 'switch HeaderID(c.ID) {'

  - id: header-dns-constructor
    desc: DNS header constructor call
    crit: component
    if:
      type: symbol
      kind: call
      exact: NewHeaderDNS

  - id: srtp-header-type
    desc: SRTP header type declaration
    crit: component
    if:
      type: text
      exact: 'type srtp struct {'

  - id: srtp-header-serializer
    desc: SRTP header serializer method
    crit: component
    if:
      type: text
      exact: 'func (h *srtp) Serialize(b []byte) {'

  - id: srtp-header-sequence-counter
    desc: SRTP header sequence increment
    crit: component
    if:
      type: text
      exact: 'h.number++'

  - id: wechat-header-type
    desc: WeChat header type declaration
    crit: component
    if:
      type: text
      exact: 'type wechat struct {'

  - id: wechat-header-serializer
    desc: WeChat header serializer method
    crit: component
    if:
      type: text
      exact: 'func (h *wechat) Serialize(b []byte) {'

  - id: wechat-header-sequence-counter
    desc: WeChat header sequence increment
    crit: component
    if:
      type: text
      exact: 'h.sn++'

  - id: wechat-header-marker-a1
    desc: WeChat header start marker byte
    crit: component
    if:
      type: text
      exact: 'b[0] = 0xa1'

  - id: wechat-header-marker-08
    desc: WeChat header marker second byte
    crit: component
    if:
      type: text
      exact: 'b[1] = 0x08'

composite_rules:
  - id: mkcp-header-config-source
    desc: Xray mKCP PacketConn wrapper configuration
    crit: notable
    conf: 1.0
    all:
      - id: config-udp-marker
      - id: config-header-conn-marker
      - id: config-client-wrapper-signature
      - id: config-server-wrapper-signature
      - id: micro-behaviors/communications/socket/create-wrapper::go-network-wrapper-constructor-family
      - id: micro-behaviors/communications/socket/create-wrapper::go-packet-connection-wrapper-method

  - id: mkcp-header-connection-source
    desc: Xray mKCP protocol-header PacketConn adapter
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: header-conn-type
      - id: header-id-selector
      - id: header-dns-constructor
      - id: micro-behaviors/communications/socket/framing::go-packet-header-serialize-call

  - id: srtp-header-source
    desc: Xray mKCP SRTP header source
    crit: notable
    conf: 0.99
    all:
      - id: srtp-header-type
      - id: srtp-header-serializer
      - id: srtp-header-sequence-counter
      - id: micro-behaviors/data/buffer::go-big-endian-uint16-write
    near_lines: 16

  - id: wechat-header-source
    desc: Xray mKCP WeChat header source
    crit: notable
    conf: 0.99
    all:
      - id: wechat-header-type
      - id: wechat-header-serializer
      - id: wechat-header-sequence-counter
      - id: wechat-header-marker-a1
      - id: wechat-header-marker-08
      - id: micro-behaviors/data/buffer::go-big-endian-uint32-write
    near_lines: 16
