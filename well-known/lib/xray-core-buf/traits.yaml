# Xray-core's common buffer implementation is a neutral reusable data
# structure, not evidence of proxy execution or hostile network behavior.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: xray-multibuffer-type
    desc: Xray MultiBuffer type declaration
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+MultiBuffer\s+\[\]\*Buffer\s*$'

composite_rules:
  - id: xray-common-multibuffer-implementation
    desc: Xray common MultiBuffer implementation
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: xray-multibuffer-type
