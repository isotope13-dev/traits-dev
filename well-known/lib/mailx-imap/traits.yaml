# @bobfrankston/mailx-imap orchestrates multi-account IMAP sync, OAuth, SMTP
# outbox delivery, and local message storage for the mailx desktop client.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mailx-imap package metadata name
    if:
      type: value
      path: name
      exact: '@bobfrankston/mailx-imap'

  - id: source-marker
    desc: mailx-imap orchestration source marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@bobfrankston/mailx-imap'

  - id: mailx-store-import
    desc: mailx-imap imports mailx-store storage layer
    for: [javascript, typescript]
    if:
      type: import
      exact: '@bobfrankston/mailx-store'

composite_rules:
  - id: package-identity
    desc: Recognized mailx-imap mail client package context
    crit: exception
    conf: 0.99
    for: [package.json, javascript, typescript]
    scope: archive
    any:
      - id: package-name
      - id: source-marker
      - id: mailx-store-import
