# xerial snappy-java bundles a prebuilt JNI shim for every platform it
# supports (Linux/Mac/Windows/FreeBSD/SunOS x {x86, x86_64, aarch64, arm,
# ppc64, riscv64, s390x, mips64}), all named libsnappyjava with the host's
# native suffix. It ships inside almost every JVM data stack -- Kafka, Spark,
# Hadoop, Trino -- so an analyst wants it identified by name rather than
# rediscovered as "an unsigned native blob in a JAR".
#
# Consolidated from two basename copies that each identified the same library
# from a different platform bucket: well-known/app/macos-benign
# (libsnappyjava.jnilib) and well-known/tool/sysadmin/unix-benign
# (libsnappyjava.so). snappy-java is a third-party library, so per the
# TAXONOMY metadata boundary rubric its fingerprint belongs in well-known/lib.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: snappy-java-jni-library
    desc: snappy-java JNI native library
    size_min: 10000
    size_max: 5000000
    for: [elf, macho, dylib, so, dll, pe, static-lib]
    if:
      type: basename
      regex: '^(libsnappyjava\.(so|jnilib|dylib|a)|snappyjava\.dll)$'
      case_insensitive: true
