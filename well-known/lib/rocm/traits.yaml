defaults:
  platforms: [windows]
  for: [dll]
  size_min: 1000000
  size_max: 67108864

traits:
  - id: amd-hip-runtime-description
    desc: AMD HIP runtime version description
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      regex: '^AMD Accelerated Parallel Processing amdhip64\b'

  - id: amd-hip-runtime-product
    desc: AMD HIP runtime product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '^amdhip64\b.*AMD-APP'

  - id: amd-hip-runtime-internal-name
    desc: AMD HIP runtime internal filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      regex: '^amdhip64(_\d+)?$'

  - id: amd-opencl-runtime-description
    desc: AMD OpenCL runtime version description
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      regex: '^AMD Accelerated Parallel Processing OpenCL\b'

  - id: amd-opencl-runtime-product
    desc: AMD OpenCL runtime product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '^OpenCL\b.*AMD-APP'

  - id: amd-opencl-runtime-internal-name
    desc: AMD OpenCL runtime internal filename
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: OpenCL

composite_rules:
  - id: amd-hip-runtime-library
    desc: AMD HIP runtime library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: amd-hip-runtime-description
      - id: amd-hip-runtime-product
      - id: amd-hip-runtime-internal-name

  - id: amd-opencl-runtime-library
    desc: AMD OpenCL runtime library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: amd-opencl-runtime-description
      - id: amd-opencl-runtime-product
      - id: amd-opencl-runtime-internal-name
