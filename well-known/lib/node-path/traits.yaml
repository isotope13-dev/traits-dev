defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: package-name
    desc: Node path npm package name
    if:
      type: value
      path: name
      regex: '^(path|path-browserify)$'

  - id: package-main
    desc: Node path package index entrypoint
    if:
      type: value
      path: main
      exact: index.js

composite_rules:
  - id: package-identity
    desc: Recognized Node path package identity
    crit: exception
    conf: 0.99
    all:
      - id: package-name
      - id: package-main
