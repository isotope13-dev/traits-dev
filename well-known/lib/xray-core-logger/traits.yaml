# Xray-core logger implementation identity. These markers identify the
# upstream logging package and its writer factories; they do not imply log
# tampering, collection, or any other hostile behavior.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: platform-package-import
    desc: Xray platform helper package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/platform'

  - id: done-package-import
    desc: Xray completion signal package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/signal/done'

  - id: semaphore-package-import
    desc: Xray semaphore package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/signal/semaphore'

  - id: common-log-package-path
    desc: Xray common log package path
    if:
      type: path
      regex: '(?i)(^|[\\/])common.{0,8}log'

  - id: severity-logger-replacement
    desc: Xray severity logger replacement
    if:
      type: function
      exact: ReplaceWithSeverityLogger

  - id: file-writer-factory
    desc: Xray file log-writer factory
    if:
      type: function
      exact: CreateFileLogWriter

  - id: stdout-writer-factory
    desc: Xray stdout log-writer factory
    if:
      type: function
      exact: CreateStdoutLogWriter

  - id: stderr-writer-factory
    desc: Xray stderr log-writer factory
    if:
      type: function
      exact: CreateStderrLogWriter

composite_rules:
  - id: logger-source
    desc: Xray-core logger implementation source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: platform-package-import
      - id: done-package-import
      - id: semaphore-package-import
      - id: common-log-package-path
      - id: severity-logger-replacement
      - id: file-writer-factory
      - id: stdout-writer-factory
      - id: stderr-writer-factory
