# dll-syringe is a documented Windows DLL injection and remote-call library.
# Its identity provides context for neutral injection primitives; it is not a
# malware classification.
defaults:
  platforms: [windows]
  for: [crate]
  crit: notable
  conf: 0.99

traits:
  - id: crate-name
    desc: dll-syringe Rust crate name
    if:
      type: value
      path: crate.name
      exact: dll-syringe

  - id: source-repository
    desc: dll-syringe upstream repository
    if:
      type: value
      path: crate.repository
      exact: https://github.com/OpenByteDev/dll-syringe

composite_rules:
  - id: library-identity
    desc: dll-syringe Windows DLL injection library identity
    crit: notable
    conf: 0.99
    all:
      - id: crate-name
      - id: source-repository
