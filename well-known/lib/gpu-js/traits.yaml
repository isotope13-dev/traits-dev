# GPU.js is an open-source JavaScript GPU-computation library.  The optional
# headless-gl native dependency is its documented server-side WebGL backend.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: GPU.js npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: gpu.js

  - id: upstream-repository
    desc: GPU.js upstream repository reference
    for: [package.json, markdown, text]
    if:
      type: text
      substr: github.com/gpujs/gpu.js

  - id: headless-gl-backend
    desc: GPU.js headless WebGL backend marker
    for: [javascript, typescript]
    if:
      type: text
      regex: "require\\(['\"]gl['\"]\\)|HeadlessGLKernel"

composite_rules:
  - id: package-context
    desc: Recognized GPU.js npm package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: upstream-repository

  - id: headless-backend-context
    desc: GPU.js headless WebGL implementation
    crit: notable
    conf: 0.99
    all:
      - id: upstream-repository
      - id: headless-gl-backend
