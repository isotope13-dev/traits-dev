# Xray-core Finalmask realm client identity.  This source implements a
# configured UDP NAT-traversal client; the identity is not a hostile verdict.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: realm-client-structure
    desc: Xray realm UDP client type
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+realmConnClient\s+struct\b'

composite_rules:
  - id: realm-client-source
    desc: Xray Finalmask realm UDP client
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: realm-client-structure
      - id: micro-behaviors/communications/proxy/turn::go-udp-hole-punching-handshake
