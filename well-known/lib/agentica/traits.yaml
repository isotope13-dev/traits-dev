defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Agentica SDK package metadata identity
    if:
      type: value
      path: name
      exact: agentica

  - id: repository
    desc: Agentica upstream repository marker
    if:
      type: text
      substr: github.com/shibing624/agentica
