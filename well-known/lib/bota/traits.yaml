defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Botasaurus bota package metadata identity
    if:
      type: value
      path: name
      exact: bota

  - id: repository
    desc: Botasaurus upstream repository marker
    if:
      type: text
      substr: github.com/omkarcloud/botasaurus
