defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: dayjs-package
    desc: Day.js package manifest identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: dayjs

  - id: dayjs-locale-path
    desc: Day.js locale module path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)dayjs[/\\]locale'

  - id: dayjs-plugin-path
    desc: Day.js plugin module path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)dayjs[/\\]plugin'

composite_rules:
  - id: dayjs-library-asset
    desc: Day.js date library asset
    crit: notable
    conf: 0.97
    for: [javascript, package.json]
    any:
      - id: dayjs-package
      - id: dayjs-locale-path
      - id: dayjs-plugin-path
