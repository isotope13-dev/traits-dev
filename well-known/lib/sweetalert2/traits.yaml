# SweetAlert2 is a widely used browser dialog library. Library identity is
# useful context, but it must not suppress independent findings for executable
# behavior embedded in a bundled copy. In particular, a region-gated payload
# that disables page input and loops remote audio remains sabotage even when
# it is located inside this library's code.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: version-identity
    desc: SweetAlert2 version identity
    conf: 0.99
    if:
      type: text
      regex: '(?i)(sweetalert2\s+v|(jn|swal|sweetalert2)\.version\s*=\s*["''])\d+\.\d+'

  - id: swal2-popup-class
    desc: SweetAlert2 popup CSS class name
    conf: 0.95
    if:
      type: text
      substr: swal2-popup

composite_rules:
  - id: sweetalert2-library
    desc: Recognized SweetAlert2 dialog library
    crit: notable
    conf: 0.99
    all:
      - id: version-identity
      - id: swal2-popup-class
