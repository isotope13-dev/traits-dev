# SweetAlert2 is a widely used browser dialog library. Certain releases
# embed disclosed region-gated protestware (RU-language + .ru/.su/.рф hosts
# → disable pointer-events and loop the Ukrainian anthem). That payload is
# not malware; keep library identity here and suppress the UI-sabotage
# composites via the exception below.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: version-identity
    desc: SweetAlert2 version identity
    conf: 0.99
    if:
      type: text
      regex: '(?i)(sweetalert2\s+v|(jn|swal|sweetalert2)\.version\s*=\s*["''])\d+\.\d+'

  - id: swal2-popup-class
    desc: SweetAlert2 popup CSS class name
    conf: 0.95
    if:
      type: text
      substr: swal2-popup

  - id: swal-initiation-storage-key
    desc: SweetAlert2 protest localStorage key
    conf: 0.99
    if:
      type: text
      substr: swal-initiation

composite_rules:
  - id: sweetalert2-library
    desc: Recognized SweetAlert2 dialog library
    crit: notable
    conf: 0.99
    all:
      - id: version-identity
      - id: swal2-popup-class

  - id: sweetalert2-protest-context
    desc: Recognized SweetAlert2 region protest library context
    crit: exception
    conf: 0.99
    all:
      - id: version-identity
      - id: swal2-popup-class
      - id: swal-initiation-storage-key
