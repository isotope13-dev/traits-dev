# pyspart: Python bindings for the Spart spatial-index library (PyO3/maturin).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
  size_min: 100
  size_max: 50000000

traits:
  - id: pypi-package-name
    desc: pyspart PyPI package name
    for: [pkginfo, whl]
    conf: 0.99
    size_min: 50
    size_max: 2000000
    if:
      type: value
      path: name
      exact: pyspart

  - id: pyinit-export
    desc: Exports PyInit_pyspart CPython entry point
    for: [macho, elf, pe, dll]
    conf: 0.99
    size_min: 50000
    size_max: 50000000
    if:
      type: export
      exact: PyInit_pyspart

  - id: abi3-extension-basename
    desc: pyspart abi3 native extension basename
    for: [macho, elf, pe, dll]
    conf: 0.98
    size_min: 50000
    size_max: 50000000
    if:
      type: path
      basename: true
      exact: pyspart.abi3.so

  - id: spatial-quadtree-type
    desc: Quadtree spatial index type name
    for: [macho, elf, pe, dll, python]
    conf: 0.9
    size_min: 1000
    size_max: 50000000
    if:
      type: text
      word: Quadtree

  - id: spatial-kdtree-type
    desc: KdTree spatial index type name
    for: [macho, elf, pe, dll, python]
    conf: 0.9
    size_min: 1000
    size_max: 50000000
    if:
      type: text
      word: KdTree

  - id: spatial-octree-type
    desc: Octree spatial index type name
    for: [macho, elf, pe, dll, python]
    conf: 0.9
    size_min: 1000
    size_max: 50000000
    if:
      type: text
      word: Octree

  - id: spatial-rstartree-type
    desc: RStarTree spatial index type name
    for: [macho, elf, pe, dll, python]
    conf: 0.9
    size_min: 1000
    size_max: 50000000
    if:
      type: text
      word: RStarTree

composite_rules:
  - id: spatial-index-type-cluster
    desc: Spart spatial index type name cluster
    conf: 0.94
    needs: 2
    any:
      - id: spatial-quadtree-type
      - id: spatial-kdtree-type
      - id: spatial-octree-type
      - id: spatial-rstartree-type

  - id: pyspart-extension
    desc: pyspart PyO3 spatial-index extension
    conf: 0.98
    all:
      - id: well-known/lib/pyo3::pyo3-extension-runtime
    any:
      - id: pypi-package-name
      - id: pyinit-export
      - id: abi3-extension-basename
