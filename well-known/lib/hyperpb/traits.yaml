# buf.build/go/hyperpb — Buf's high-performance Protocol Buffers runtime for Go.
# Uses arena allocation, unsafe, and reflection for throughput; ships internal
# test/benchmark tooling (hypertest SSH runner, hyperdump, hyperstencil).
defaults:
  platforms: [unix, windows]
  for: [go, text, zip]
  crit: notable
  conf: 0.98

traits:
  - id: module-path
    desc: hyperpb Go module path
    for: [go, text]
    if:
      type: text
      regex: '(?m)^module buf\.build/go/hyperpb\s*$'

  - id: archive-path
    desc: hyperpb source archive path
    if:
      type: path
      regex: 'buf\.build/go/hyperpb@'

  - id: buf-copyright-header
    desc: Buf Technologies copyright header
    if:
      type: text
      substr: Copyright 2025 Buf Technologies, Inc.

composite_rules:
  - id: hyperpb-library
    desc: Buf hyperpb protobuf library
    any:
      - id: module-path
      - id: archive-path
