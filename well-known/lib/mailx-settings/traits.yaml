# @bobfrankston/mailx-settings is the settings/configuration library used by
# the mailx desktop client.  Its cloud helpers deliberately use the user's
# selected Google Drive or OneDrive account for settings synchronization.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mailx-settings package metadata name
    if:
      type: value
      path: name
      exact: '@bobfrankston/mailx-settings'

  - id: oauthsupport-import
    desc: mailx-settings OAuth helper import
    for: [javascript, typescript]
    if:
      type: import
      exact: '@bobfrankston/oauthsupport'

  - id: gdrive-folder-helper
    desc: mailx-settings Google Drive folder helper
    for: [javascript, typescript]
    if:
      type: function
      exact: gDriveFindOrCreateFolder

composite_rules:
  - id: source-marker
    desc: mailx-settings cloud synchronization source marker
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: oauthsupport-import
      - id: gdrive-folder-helper

  - id: package-identity
    desc: Recognized mailx-settings library package context
    crit: notable
    conf: 0.99
    for: [package.json, javascript, typescript]
    scope: archive
    any:
      - id: package-name
      - id: source-marker
