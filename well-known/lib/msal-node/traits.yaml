# MSAL Node is Microsoft's legitimate OAuth and managed-identity client. The
# package identity is kept separate from generic token and metadata-endpoint
# capability traits so those capabilities remain visible when unowned.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Microsoft MSAL Node package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@azure/msal-node'

  - id: repository-url
    desc: MSAL JavaScript upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/AzureAD/microsoft-authentication-library-for-js(\.git)?'

composite_rules:
  - id: library-context
    desc: Recognized Microsoft MSAL Node package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: repository-url
