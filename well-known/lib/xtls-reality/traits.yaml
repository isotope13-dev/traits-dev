# XTLS REALITY package identity. This is a neutral library signature, not
# evidence of hostile network use.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: reality-package-import
    desc: XTLS REALITY package import
    if:
      type: import
      exact: 'github.com/xtls/reality'

composite_rules:
  - id: xray-reality-adapter-source
    desc: Xray adapter for XTLS REALITY
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: reality-package-import
