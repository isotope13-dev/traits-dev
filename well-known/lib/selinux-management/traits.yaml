defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 100000
  size_max: 2000000

traits:
  - id: semanage-soname
    desc: libsemanage shared object SONAME
    conf: 1.0
    if:
      type: value
      path: elf.soname
      exact: libsemanage.so.2

  - id: api-export-connection
    desc: libsemanage connection API export
    if:
      type: export
      regex: '^semanage_(begin_transaction|commit|connect|disconnect)$'

  - id: api-export-module
    desc: libsemanage module API export
    if:
      type: export
      regex: '^semanage_(module_install|module_remove)$'

  - id: api-export-reload-policy
    desc: libsemanage policy reload export
    if:
      type: export
      exact: semanage_reload_policy

  - id: api-export-install-file
    desc: libsemanage module-file install export
    if:
      type: export
      exact: semanage_module_install_file

  - id: api-export-managed
    desc: libsemanage management-state export
    if:
      type: export
      exact: semanage_is_managed

  - id: api-export-policy-root
    desc: libsemanage policy-store root export
    if:
      type: export
      exact: semanage_set_root

  - id: api-export-store-selection
    desc: libsemanage policy-store selection export
    if:
      type: export
      exact: semanage_select_store

composite_rules:
  - id: api-export-family
    desc: libsemanage API export family
    any:
      - id: api-export-connection
      - id: api-export-module
      - id: api-export-reload-policy
      - id: api-export-install-file
      - id: api-export-managed

  - id: libsemanage-library
    desc: SELinux management shared library
    crit: notable
    conf: 0.99
    all:
      - id: semanage-soname
      - id: api-export-family

  - id: libsemanage-policy-store-control
    desc: libsemanage policy-store selection and root control
    crit: notable
    conf: 0.99
    all:
      - id: libsemanage-library
      - id: api-export-policy-root
      - id: api-export-store-selection
