# The Stellar JavaScript SDK is a legitimate client library. These markers
# identify the package so its normal network and signing code is attributable
# to the library rather than mistaken for an unrelated payload.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Stellar JavaScript SDK package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stellar/stellar-sdk'

  - id: repository-url
    desc: Stellar JavaScript SDK upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/stellar/js-stellar-sdk(\.git)?'

composite_rules:
  - id: library-context
    desc: Recognized Stellar JavaScript SDK package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: repository-url
