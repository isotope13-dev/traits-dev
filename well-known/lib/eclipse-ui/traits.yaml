defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: eclipse-ui-key-namespace
    desc: Eclipse UI internal keybinding namespace
    if:
      type: import
      regex: '^org/eclipse/ui/internal/keys/'

  - id: eclipse-ui-quickaccess-namespace
    desc: Eclipse UI internal quick-access namespace
    if:
      type: import
      regex: '^org/eclipse/ui/internal/quickaccess/'

  - id: eclipse-ui-internal-namespace
    desc: Eclipse UI internal namespace
    if:
      type: import
      regex: '^org/eclipse/ui/internal/'

  - id: eclipse-jface-bindings-namespace
    desc: Eclipse JFace keybinding namespace
    if:
      type: import
      regex: '^org/eclipse/jface/bindings/keys/'

  - id: eclipse-e4-bindings-namespace
    desc: Eclipse e4 keybinding namespace
    if:
      type: import
      regex: '^org/eclipse/e4/ui/bindings/'
