# wysihtml5 (renamed `wysihtml` from 0.5 onward) is the open-source rich-text
# editor behind bootstrap-wysihtml5, bundled as a vendor asset by many admin
# templates and CMS themes. Its foreColor command tags selected text with
# `wysiwyg-color-<name>` classes, and the editor ships the colour stylesheet
# (wysihtml5-color.css) that defines that class family.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: wysihtml5-color-class-stylesheet
    desc: wysihtml5 editor color-class stylesheet
    for: [text]
    # The editor emits one class per CSS colour keyword; a handful of them
    # together is the shipped stylesheet rather than an incidental class name.
    count_min: 4
    if:
      type: text
      regex: '\.wysiwyg-color-[a-z]{3,12}\s*\{'

  - id: wysihtml5-editor-namespace
    desc: wysihtml5 rich-text editor namespace object
    for: [javascript]
    if:
      type: text
      regex: '\bvar\s+wysihtml5?\s*=\s*\{'
