defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe, archives]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: dotnet-nativeaot-runtime
    desc: Microsoft .NET NativeAOT runtime member
    if:
      type: path
      regex: '(?i)Microsoft\.NETCore\.App\.Runtime|iossimulator-x64'

  # System.Private.CoreLib is the assembly that *implements* AssemblyResolve,
  # ResourceManager, reflection, AppDomain and GZip, so any rule keyed on
  # "uses those APIs" matches the library that defines them. It ships in every
  # self-contained `dotnet publish` output and every runtime install, and the
  # copy is frequently not Authenticode-signed, so signed-platform downgrades
  # miss it. Paired with an internal marker so a renamed dropper cannot claim
  # the identity on basename alone.
  - id: corelib-self-assembly-name
    desc: CoreLib self-referential assembly name
    crit: baseline
    platforms: [windows]
    for: [pe, dll]
    count_min: 4
    if:
      type: text
      section: .text
      substr: System.Private.CoreLib

composite_rules:
  - id: dotnet-corelib-assembly
    desc: Microsoft .NET runtime core library assembly
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/file/extension/identity::corelib-dll-basename
      - id: corelib-self-assembly-name
