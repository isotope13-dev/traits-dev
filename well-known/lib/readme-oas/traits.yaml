# oas (ReadMe) — OpenAPI definition tooling for JavaScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ReadMe oas npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: oas

  - id: archive-path
    desc: ReadMe oas npm archive path
    if:
      type: path
      regex: '(^|[\\/])oas-[0-9]'

  - id: module-import
    desc: oas package import
    for: [javascript, typescript]
    if:
      type: import
      substr: from "oas"

composite_rules:
  - id: readme-oas-library
    desc: ReadMe oas OpenAPI tooling package
    any:
      - id: package-name
      - id: archive-path
      - id: module-import
