# Xray-core statistics package source identity. The unit-test signature is
# kept separate from the broad xray-core library directory so the ML feature
# remains specific without making the parent directory oversized.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: stats-package-import
    desc: Xray statistics package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/app/stats'

  - id: stats-channel-test-function
    desc: Xray statistics channel test function
    if:
      type: function
      exact: TestStatsChannelRunnable

  - id: register-channel-call
    desc: Go RegisterChannel call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.RegisterChannel$'

composite_rules:
  - id: stats-channel-unit-test
    desc: Xray statistics channel unit test
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: stats-package-import
      - id: stats-channel-test-function
      - id: register-channel-call
