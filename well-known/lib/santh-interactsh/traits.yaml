# santh-interactsh — Async Rust OAST client by Santh Project
# (github.com/santhreal/interactsh). Polls out-of-band interaction servers for
# blind SSRF/XSS/SQLi detection; payload_helpers exports dual-use security-
# testing payload templates. Shares a name with ProjectDiscovery interactsh but
# is an independent MIT-licensed client library, not a trojanized namesake.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml, crate, rust, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Santh interactsh Cargo package identity
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: interactsh

  - id: repository-marker
    desc: Santh interactsh source repository marker
    for: [cargo.toml, rust, text]
    if:
      type: text
      substr: github.com/santhreal/interactsh

  - id: interactsh-client-type
    desc: Santh interactsh client public API
    for: [rust]
    if:
      type: text
      regex: '\bpub struct InteractshClient\b'

composite_rules:
  - id: santh-interactsh-library
    desc: Santh Project interactsh OAST client library
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: repository-marker
