# Xray-core geodata IP matcher test identity. The addresses are test fixtures;
# these markers describe the matcher and its test/benchmark source, not network
# activity or endpoint targeting.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: geodata-package-declaration
    desc: Xray geodata package declaration
    if:
      type: text
      regex: '(?m)^package\s+geodata\b'

  - id: ip-matcher-builder
    desc: Xray IP matcher test builder
    if:
      type: function
      exact: buildIPMatcher

  - id: ip-matcher-core-test
    desc: Xray IP matcher unit test
    if:
      type: function
      exact: TestIPMatcher

  - id: ip-matcher-filter-test
    desc: Xray IP matcher filtering test
    if:
      type: function
      exact: TestIPMatcherFilterIPs

  - id: ip-matcher-geoip-test
    desc: Xray GeoIP matcher test
    if:
      type: function
      exact: TestIPMatcher4CN

  - id: ip-matcher-asset-environment
    desc: Xray geodata asset environment key
    if:
      type: text
      substr: xray.location.asset

  - id: ip-matcher-benchmark
    desc: Xray IP matcher benchmark
    if:
      type: function
      exact: BenchmarkIPMatcher4CN

composite_rules:
  - id: ip-matcher-test-source
    desc: Xray-core IP matcher test source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-common-net-package-import
      - id: geodata-package-declaration
      - id: ip-matcher-builder
      - id: ip-matcher-core-test
      - id: ip-matcher-filter-test
      - id: ip-matcher-asset-environment
