# Glamour (github.com/charmbracelet/glamour) renders Markdown to ANSI for Go
# terminal programs, and its ansi.StyleConfig is loaded from a JSON style sheet.
# Every Go CLI that themes its own help/README output vendors one or more of
# these (glamour ships ascii/dark/dracula/light/notty/pink/tokyo-night), so they
# turn up inside scanned Go repositories and release archives as anonymous small
# JSON with no name, no version, and no other identifying field.
#
# Keyed on nested StyleConfig paths rather than top-level element names: `task`,
# `link`, and `image` alone are ordinary JSON keys, but a `task.ticked` glyph, a
# `definition_description.block_prefix`, and an `image_text.format` template
# together are glamour's schema and nothing else. All three are present in every
# style glamour ships, so the composite holds for custom user styles too.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: component
  conf: 0.9

traits:
  - id: glamour-task-checkbox-glyphs
    desc: Glamour task list ticked glyph
    if:
      type: value
      path: task.ticked

  - id: glamour-definition-description-prefix
    desc: Glamour definition description prefix
    if:
      type: value
      path: definition_description.block_prefix

  - id: glamour-image-text-format
    desc: Glamour image alt-text format template
    if:
      type: value
      path: image_text.format

composite_rules:
  - id: glamour-terminal-style-sheet
    desc: Glamour terminal Markdown style sheet
    crit: notable
    conf: 0.97
    all:
      - id: glamour-task-checkbox-glyphs
      - id: glamour-definition-description-prefix
      - id: glamour-image-text-format
