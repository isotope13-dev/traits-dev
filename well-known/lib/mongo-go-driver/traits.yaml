# go.mongodb.org/mongo-driver — official MongoDB Go driver.
defaults:
  platforms: [unix, windows]
  for: [go, text, zip]
  crit: notable
  conf: 0.98

traits:
  - id: archive-path
    desc: mongo-go-driver source archive path
    if:
      type: path
      regex: 'mongo-driver/v2@'

  - id: module-path
    desc: mongo-go-driver Go module path
    for: [go, text]
    if:
      type: text
      regex: '(?m)^module go\.mongodb\.org/mongo-driver'

composite_rules:
  - id: mongo-go-driver-library
    desc: MongoDB official Go driver module
    any:
      - id: archive-path
      - id: module-path
