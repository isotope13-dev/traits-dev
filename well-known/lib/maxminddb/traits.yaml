# MaxMind GeoIP reader library (oschwald/maxminddb-golang). Used by
# proxy cores, honeypot dashboards, and many network tools — identify
# the dependency without attributing it to a single application.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, go]
  crit: notable
  conf: 0.95
  size_min: 500000
  size_max: 100000000

traits:
  - id: maxminddb-golang-dependency
    desc: MaxMind GeoIP Go library dependency
    if:
      type: value
      path: pe.go.deps
      substr: github.com/oschwald/maxminddb-golang
