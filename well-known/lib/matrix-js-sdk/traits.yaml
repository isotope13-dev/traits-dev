# matrix-js-sdk — Matrix client-server JavaScript SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, text]
  crit: notable
  conf: 0.99
  size_max: 100000000

traits:
  - id: package-name
    desc: matrix-js-sdk npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: matrix-js-sdk

  - id: archive-path
    desc: matrix-js-sdk npm archive path
    if:
      type: path
      regex: 'matrix-js-sdk[-@][0-9]'

  - id: repository-url
    desc: matrix-org matrix-js-sdk repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/matrix-org/matrix-js-sdk'

composite_rules:
  - id: matrix-js-sdk-library
    desc: Matrix client-server JavaScript SDK
    any:
      - id: package-name
      - id: archive-path
      - id: repository-url
