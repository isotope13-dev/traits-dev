# @antv/g-plugin-yoga integrates Yoga layout with AntV G/g-lite.
# These identity traits are informational; they must not suppress review of
# package lifecycle scripts or bundled runtime code in a future release.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV Yoga plugin package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/g-plugin-yoga'

  - id: source-package-marker
    desc: AntV Yoga plugin source marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@antv/g-plugin-yoga'

  - id: yoga-plugin-class
    desc: AntV Yoga plugin class
    for: [javascript, typescript]
    if:
      type: symbol
      exact: YogaPlugin

composite_rules:
  - id: antv-g-plugin-yoga-library
    desc: AntV Yoga layout plugin identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: source-package-marker
      - id: yoga-plugin-class
