# Xray-core blackhole outbound configuration source identity.  Blackhole is a
# documented proxy component that discards or synthesizes outbound responses;
# these rules identify its configuration adapter and do not imply malware.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: proxy-package-import
    desc: Xray blackhole proxy package import
    crit: component
    if:
      type: import
      exact: 'github.com/xtls/xray-core/proxy/blackhole'

  - id: config-type
    desc: Xray blackhole configuration type
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+BlackholeConfig\s+struct\b'

  - id: none-response-type
    desc: Xray blackhole empty-response type
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+NoneResponse\s+struct\b'

  - id: http-response-type
    desc: Xray blackhole HTTP-response type
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+HTTPResponse\s+struct\b'

  - id: config-loader-constructor
    desc: Xray JSON config-loader constructor call
    crit: component
    if:
      type: symbol
      kind: call
      exact: NewJSONConfigLoader

composite_rules:
  - id: blackhole-config-source
    desc: Xray blackhole outbound configuration source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: proxy-package-import
      - id: config-type
      - id: none-response-type
      - id: http-response-type
      - id: config-loader-constructor
