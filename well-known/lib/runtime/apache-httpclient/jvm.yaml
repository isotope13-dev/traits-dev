# Apache HttpComponents HttpClient — documents TrustAllStrategy for opt-in TLS.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java_class]
  crit: notable
  conf: 0.98

traits:
  - id: apache-httpclient-trust-all-strategy
    desc: Apache HttpClient TrustAllStrategy class
    if:
      type: text
      substr: org/apache/http/conn/ssl/TrustAllStrategy

  - id: apache-httpclient-jar-name
    desc: Apache HttpClient JAR basename
    if:
      type: path
      basename: true
      regex: '(?i)httpclient-[\d.]+\.jar'

composite_rules:
  - id: apache-httpclient-library-context
    desc: Apache HttpComponents HttpClient library
    any:
      - id: apache-httpclient-trust-all-strategy
      - id: apache-httpclient-jar-name
