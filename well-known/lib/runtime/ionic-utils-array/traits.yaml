# @ionic/utils-array — Ionic CLI array helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ionic utils-array package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ionic/utils-array'

  - id: vendored-path
    desc: Ionic utils-array package path
    if:
      type: path
      regex: '@ionic/utils-array'

composite_rules:
  - id: ionic-utils-array-library
    desc: Ionic utils-array helper library
    any:
      - id: package-name
      - id: vendored-path
