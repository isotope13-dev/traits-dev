# taoensso/trove — modern logging facade for Clojure/Script
# (www.taoensso.com/trove). Backend dispatch is product logging, not a
# dropper. Identity only. Do not match GNU Trove collections alone.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-group
    desc: taoensso Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: com.taoensso

  - id: pom-artifact
    desc: taoensso trove Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: trove

  - id: github-repo
    desc: taoensso trove GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/taoensso/trove

  - id: defproject
    desc: taoensso trove Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject com.taoensso/trove'

  - id: core-namespace
    desc: taoensso.trove namespace declaration
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(ns taoensso.trove'

composite_rules:
  - id: taoensso-trove-library
    desc: taoensso trove Clojure logging facade
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
