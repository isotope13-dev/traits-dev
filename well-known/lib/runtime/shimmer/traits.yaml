# othiym23/shimmer — safe(r) JavaScript monkeypatching helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: shimmer npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: shimmer

  - id: mass-unwrap-export
    desc: shimmer massUnwrap export
    for: [javascript]
    if:
      type: text
      substr: shimmer.massUnwrap = massUnwrap

  - id: vendored-path
    desc: vendored shimmer npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/shimmer/'

composite_rules:
  - id: shimmer-monkeypatch-library
    desc: shimmer monkeypatch helper
    any:
      - id: package-name
      - id: mass-unwrap-export
      - id: vendored-path
