# @ionic/cli-framework-output — Ionic CLI logger/spinner helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ionic CLI framework-output package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ionic/cli-framework-output'

  - id: vendored-path
    desc: Ionic CLI framework-output package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@ionic/cli-framework-output/'

composite_rules:
  - id: ionic-cli-framework-output-library
    desc: Ionic CLI logger and spinner library
    needs: 2
    any:
      - id: package-name
      - id: vendored-path
