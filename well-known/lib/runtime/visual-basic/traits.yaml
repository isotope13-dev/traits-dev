# Microsoft's Visual Basic 6 runtime (MSVBVM60.DLL). Every heuristic written to
# describe "a VB6 program hiding its dispatch behind the runtime" is satisfied
# by the runtime itself: it *is* the VB6 application framework, it *is* the
# ordinal API dispatcher, and its .text is full of numbered internal
# identifiers. It also legitimately calls GetSystemDirectory + WinExec, which
# is what VB's Shell() compiles down to.
#
# Identity is taken from the two version fields that only this DLL carries.
# Generic "company is Microsoft" / "signature verified" facts are deliberately
# not redefined here -- they already exist canonically under metadata/signed/
# and metadata/binary/vendor/, and a Microsoft vendor string is not a VB6
# runtime identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  # Every shipped MSVBVM60.DLL build sits near 1.3-1.4 MB; the bounds are a
  # cheap gate, the version fields below carry the identity.
  size_min: 500000
  size_max: 4000000

traits:
  - id: msvbvm60-original-filename
    desc: VB6 runtime original filename
    crit: notable
    conf: 0.999
    if:
      type: value
      path: pe.version.internal_name
      exact: MSVBVM60.DLL
      case_insensitive: true

  - id: msvbvm60-description
    desc: VB6 runtime version description
    crit: notable
    conf: 0.999
    if:
      type: value
      path: pe.version.description
      exact: Visual Basic Virtual Machine

composite_rules:
  # The signing leg uses the canonical Microsoft leaf-signer trait. The
  # stricter "Authenticode verified" atoms (metadata/signed/platform::
  # microsoft-signature-verified, metadata/signed/certificate/identity::
  # pe-signature-verified-kv) are baseline, and an exception's members must
  # resolve to notable, so they cannot be legs here.
  - id: msvbvm60-runtime-context
    desc: Recognized Microsoft Visual Basic 6 runtime DLL
    crit: exception
    conf: 0.999
    all:
      - id: msvbvm60-original-filename
      - id: msvbvm60-description
      - id: metadata/signed/leaf::microsoft-corporation
