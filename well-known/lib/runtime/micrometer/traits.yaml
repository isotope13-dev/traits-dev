# Micrometer — application metrics facade for the JVM.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: micrometer-this-class
    desc: Micrometer class this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^io/micrometer/'

  - id: micrometer-package-path
    desc: Micrometer package path fragment
    conf: 0.96
    if:
      type: path
      regex: 'io/micrometer/'
