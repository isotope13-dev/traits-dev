# sindresorhus/open — cross-platform opener for URLs, files, and apps.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: local-xdg-open-path
    desc: Bundled xdg-open helper path join
    for: [javascript, typescript]
    if:
      type: text
      substr: 'const localXdgOpenPath = path.join(__dirname, ''xdg-open'')'

  - id: package-repository
    desc: sindresorhus/open package repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: sindresorhus/open

  - id: windows-quotes-docs
    desc: sindresorhus/open Windows quotes caveat docs
    for: [javascript, typescript]
    if:
      type: text
      substr: 'sindresorhus/open#double-quotes-on-windows'

composite_rules:
  - id: sindresorhus-open-library
    desc: sindresorhus/open URL and file launcher
    any:
      - id: local-xdg-open-path
      - id: package-repository
      - id: windows-quotes-docs
