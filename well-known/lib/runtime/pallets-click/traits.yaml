# Pallets Click — vendored Python CLI toolkit.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: pallets-docs-url
    desc: Click Pallets documentation URL
    if:
      type: text
      substr: 'https://click.palletsprojects.com/'
  - id: vendored-path
    desc: vendored Click package path
    if:
      type: path
      regex: '_vendor/click/'

composite_rules:
  - id: pallets-click-library
    desc: Pallets Click CLI toolkit
    any:
      - id: pallets-docs-url
      - id: vendored-path
