# Bun's Windows package bin shim resolves the real node_modules executable,
# launches it, waits, and propagates its exit code. Its missing-runtime help
# text mentions PowerShell installation but does not execute that command.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.99
  size_min: 8000

traits:
  - id: bin-shim-remap-error
    desc: Bun package bin shim remapping error
    if:
      type: text
      substr: Bun failed to remap this bin to its proper location within node_modules
      section: .rdata

  - id: bin-shim-force-install-guidance
    desc: Bun package bin shim force-install guidance
    if:
      type: text
      substr: bun install --force
      section: .rdata

composite_rules:
  - id: bun-package-bin-shim
    desc: Bun Windows package binary launcher shim
    crit: notable
    conf: 0.99
    all:
      - id: bin-shim-remap-error
      - id: bin-shim-force-install-guidance
