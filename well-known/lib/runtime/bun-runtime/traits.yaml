defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # `bun build --compile` appends the module graph (the bundled JS plus assets)
  # after the host executable and closes the file with this trailer, so modern
  # single-file Bun executables have NO `.bun` / `__BUN,__bun` section at all
  # and the section-name atoms below miss them entirely. Newer compile layouts
  # leave tens of KB after the marker (hashes/padding), so search the last 64KB.
  - id: bun-standalone-graph-trailer
    desc: Bun single-file executable trailer
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    platforms: [unix, windows]
    size_min: 1000000
    if:
      type: raw
      substr: "---- Bun! ----"
      offset_range: [-65536, null]

  - id: bun-elf-version-def
    desc: Bun ELF version definition symbol
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [unix]
    size_min: 1000000
    if:
      type: value
      path: elf.verdef[*].name
      regex: '^BUN_[0-9]+\.[0-9]+$'

  - id: bun-elf-profile-verdef
    desc: Bun ELF profile version definition
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [unix]
    size_min: 1000000
    if:
      type: value
      path: elf.verdef[*].name
      exact: bun-profile

  - id: bun-powershell-command-template
    desc: Bun PowerShell command template
    crit: component
    conf: 0.98
    size_min: 1000000
    if:
      type: text
      substr: 'powershell -ExecutionPolicy Bypass -File'
      section: .rdata

composite_rules:
  - id: runtime-context
    desc: Bun runtime bundle context
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/section/name::bun-section-name
      - id: bun-powershell-command-template
  - id: unix-runtime-context
    desc: Bun runtime bundle in Unix binary
    crit: notable
    conf: 0.99
    size_min: 1000000
    for: [elf, macho]
    platforms: [unix, macos]
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/binary/section/name::bun-macho-section-name
      - id: bun-standalone-graph-trailer
      - id: bun-elf-version-def
      - id: bun-elf-profile-verdef
