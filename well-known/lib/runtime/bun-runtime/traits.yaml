defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000000

traits:
  - id: bun-pe-product-name
    desc: Bun PE product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Bun

  - id: bun-pe-company
    desc: Bun PE company metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Oven

  - id: bun-pe-original-filename
    desc: Bun PE original filename metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: bun.exe

  # `bun build --compile` appends the module graph (the bundled JS plus assets)
  # after the host executable and closes the file with this trailer, so modern
  # single-file Bun executables have NO `.bun` / `__BUN,__bun` section at all
  # and the section-name atoms below miss them entirely. Newer compile layouts
  # leave tens of KB after the marker (hashes/padding), so search the last 64KB.
  - id: bun-standalone-graph-trailer
    desc: Bun single-file executable trailer
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    platforms: [unix, windows]
    size_min: 1000000
    if:
      type: raw
      substr: "---- Bun! ----"
      # Bun compile appends the module graph in the Mach-O overlay; on current
      # releases the trailer can sit ~700KB from EOF, well past the old 64KB tail.
      offset_range: [-1048576, null]

  - id: bun-elf-version-def
    desc: Bun ELF version definition symbol
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [unix]
    size_min: 1000000
    if:
      type: value
      path: elf.verdef[*].name
      regex: '^BUN_[0-9]+\.[0-9]+$'

  - id: bun-elf-profile-verdef
    desc: Bun ELF profile version definition
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [unix]
    size_min: 1000000
    if:
      type: value
      path: elf.verdef[*].name
      exact: bun-profile

  - id: bun-source-repository-reference
    desc: Bun source repository reference
    crit: notable
    conf: 0.99
    for: [macho]
    platforms: [macos]
    size_min: 1000000
    if:
      type: text
      section: __TEXT,__cstring
      substr: github.com/oven-sh/bun

  - id: bun-powershell-command-template
    desc: Bun PowerShell command template
    crit: component
    conf: 0.98
    size_min: 1000000
    if:
      type: text
      substr: 'powershell -ExecutionPolicy Bypass -File'
      section: .rdata

composite_rules:
  - id: bun-windows-runtime-binary
    desc: Bun Windows runtime binary
    crit: notable
    conf: 0.99
    all:
      - id: bun-pe-product-name
      - id: bun-pe-company
    any:
      - id: bun-pe-original-filename

  - id: runtime-context
    desc: Bun runtime bundle context
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/section/name::bun-section-name
      - id: bun-powershell-command-template
  - id: unix-runtime-context
    desc: Bun runtime bundle in Unix binary
    crit: notable
    conf: 0.99
    size_min: 1000000
    for: [elf, macho]
    platforms: [unix, macos]
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/binary/section/name::bun-macho-section-name
      - id: bun-standalone-graph-trailer
      - id: bun-elf-version-def
      - id: bun-elf-profile-verdef
      - id: bun-source-repository-reference

  # Windows counterpart of the Mach-O exception below. `bun build --compile`
  # produces a Zig-linked PE with a `.bun` section and two sections sharing the
  # truncated 8-byte name `__DATA,_`; cleave's Authenticode digest walk reports
  # `pe.signature_integrity: invalid` on that layout. Recomputing the digest by
  # hand over ZencoderAI.zencoder's zencoder-cli.exe -- everything except the
  # checksum field, the certificate-table directory entry and the certificate
  # blob -- reproduces the SHA-256 digest embedded in the SignedData exactly,
  # so the signature is intact and the engine reading is wrong for this shape.
  - id: bun-compiled-pe-exception
    desc: Bun single-file compile PE signature benign context
    crit: exception
    conf: 0.99
    for: [pe]
    size_min: 1000000
    all:
      - id: bun-windows-runtime-binary
    any:
      - id: bun-standalone-graph-trailer
      - id: runtime-context

  - id: bun-compiled-macho-exception
    desc: Bun single-file compile Mach-O CodeDirectory benign context
    crit: exception
    conf: 0.99
    for: [macho]
    platforms: [macos]
    size_min: 1000000
    any:
      - id: bun-standalone-graph-trailer
      - id: metadata/binary/section/name::bun-macho-section-name
