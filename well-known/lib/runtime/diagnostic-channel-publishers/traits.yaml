# Microsoft diagnostic-channel-publishers for Node telemetry.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: diagnostic-channel-publishers package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: diagnostic-channel-publishers

  - id: vendored-path
    desc: vendored diagnostic-channel-publishers path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/diagnostic-channel-publishers/'
