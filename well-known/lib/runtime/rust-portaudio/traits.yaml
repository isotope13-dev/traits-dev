# rust-portaudio — PortAudio bindings for Rust (RustAudio/rust-portaudio).
# Older releases bootstrap upstream PortAudio sources from portaudio.com in build.rs.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, tar]
  crit: notable
  conf: 0.98

traits:
  - id: portaudio-crate-name
    desc: portaudio crates.io package name
    for: [crate]
    if:
      type: value
      path: crate.name
      exact: portaudio

  - id: portaudio-upstream-repository-crate
    desc: rust-portaudio crate registry repository field
    for: [crate]
    if:
      type: value
      path: crate.repository
      regex: '(?i)github\.com/(rustaudio|jeremyletang)/rust-portaudio'

  - id: portaudio-bindings-description
    desc: PortAudio bindings for Rust crate description
    for: [crate]
    if:
      type: value
      path: crate.description
      regex: '(?i)portaudio bindings'

  - id: portaudio-build-upstream-archive-url
    desc: build.rs cites portaudio.com source archive
    for: [rust]
    if:
      type: text
      substr: www.portaudio.com/archives/

composite_rules:
  - id: rust-portaudio-library-identity
    desc: rust-portaudio PortAudio bindings crate
    crit: notable
    scope: archive
    for: [crate, tar]
    all:
      - id: portaudio-crate-name
    any:
      - id: portaudio-upstream-repository-crate
      - id: portaudio-bindings-description

  - id: rust-portaudio-library-context
    desc: rust-portaudio crate bootstraps upstream PortAudio in build.rs
    crit: exception
    conf: 0.99
    scope: archive
    for: [crate, tar, rust]
    all:
      - id: portaudio-crate-name
    any:
      - id: portaudio-upstream-repository-crate
      - id: portaudio-bindings-description
      - id: portaudio-build-upstream-archive-url
