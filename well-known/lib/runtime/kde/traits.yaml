defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 500000000

traits:
  - id: kde-framework-windows-library
    desc: KDE Frameworks Windows runtime library
    for: [pe, dll]
    platforms: [windows]
    if:
      type: basename
      regex: '(?i)^(KF6[A-Za-z0-9]+|KirigamiControls|org_kde_desktop)\.dll$'

  - id: kde-kpackage-translation-catalog
    desc: KDE KPackage translation catalog
    for: [data, kotlin]
    if:
      type: path
      basename: true
      exact: libkpackage6.mo

  # KDE ships thousands of KPackage descriptors — look-and-feel themes,
  # plasmoids, wallpapers, KWin scripts — each a `metadata.json` whose
  # `KPackageStructure` key names the package type. They carry no code, so
  # without an identity they analyse to nothing at all, and the generic
  # `metadata.json` basename rules are what end up speaking for them (a Plasma
  # Look-and-Feel descriptor was being read as an npm packument).
  - id: kde-kpackage-descriptor
    desc: KDE KPackage plugin descriptor
    for: [json, pkginfo]
    size_min: 0
    if:
      type: text
      regex: '"KPackageStructure"\s*:'

  # kdoctools renders every KDE handbook to a pre-built HTML cache and ships it
  # bz2-compressed next to the DocBook source, so `/usr/share/doc/HTML/**` holds
  # thousands of these on any Plasma install. Compressed, one exposes nothing
  # but the BZh magic and entropy ~7.9 -- indistinguishable from an encrypted
  # blob -- so the kdoctools naming convention is the only identity available.
  - id: kdoctools-help-cache-archive
    desc: KDE kdoctools bz2 help cache
    for: [data, archive, bz2]
    conf: 0.95
    size_min: 0
    if:
      type: path
      basename: true
      exact: index.cache.bz2

  # Decompressed, the cache is a concatenation of rendered handbook pages, each
  # introduced by the `<FILENAME filename="...">` separator khelpcenter splits
  # on, with stylesheets resolved through the `help:/kdoctools*-common/` KIO
  # protocol. Neither marker occurs in ordinary web HTML.
  - id: kdoctools-cache-filename-separator
    desc: kdoctools help-cache FILENAME separator
    for: [html]
    conf: 0.96
    size_min: 0
    if:
      type: text
      regex: '<FILENAME filename="[^"]{1,120}"><html'

  - id: kdoctools-common-stylesheet-link
    desc: kdoctools KIO help stylesheet link
    for: [html]
    conf: 0.96
    size_min: 0
    if:
      type: text
      regex: 'help:/kdoctools[0-9]{0,2}-common/kde-'

composite_rules:
  - id: kdoctools-help-cache-document
    desc: KDE kdoctools rendered help cache
    crit: notable
    conf: 0.98
    for: [html]
    all:
      - id: kdoctools-cache-filename-separator
      - id: kdoctools-common-stylesheet-link
