# @log4js-node/log4js-api — version-neutral log4js facade for library authors.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: log4js-node-api-scoped-package-name
    desc: log4js-node scoped log4js-api package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@log4js-node/log4js-api'

  - id: log4js-node-api-scoped-npm-name
    desc: log4js-node log4js-api npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@log4js-node/log4js-api'

  - id: log4js-node-api-upstream-repository-package-json
    desc: log4js-node log4js-api package.json repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/log4js-node/log4js-api'

  - id: log4js-node-api-upstream-repository-npm
    desc: log4js-node log4js-api npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/log4js-node/log4js-api'

composite_rules:
  - id: log4js-node-api-package-context
    desc: Official log4js-node log4js-api compatibility package
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json]
    any:
      - id: log4js-node-api-scoped-package-name
      - id: log4js-node-api-scoped-npm-name
    all:
      - id: log4js-node-api-upstream-repository-package-json
