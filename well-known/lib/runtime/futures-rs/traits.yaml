# futures-rs — Rust async primitives (https://github.com/rust-lang/futures-rs).
# Core ecosystem crate; older yanked releases remain widely depended upon.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, tar, crate]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 50000000

traits:
  - id: crate-name
    desc: futures crate name in Cargo.toml
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: futures

  - id: archive-crate-name
    desc: futures crate archive package name
    for: [crate, tar]
    if:
      type: value
      path: crate.name
      exact: futures

  - id: repository-url
    desc: rust-lang/futures-rs upstream repository URL
    for: [rust, cargo.toml]
    if:
      type: text
      substr: github.com/rust-lang/futures-rs

  - id: futures-util-import
    desc: futures crate futures_util module import
    for: [rust]
    if:
      type: text
      substr: 'use futures_util::'

composite_rules:
  - id: package-identity
    desc: Official rust-lang futures-rs crate identity
    crit: notable
    any:
      - id: archive-crate-name
      - id: crate-name
      - id: futures-util-import
    all:
      - id: repository-url

  - id: package-context
    desc: Official rust-lang futures-rs crate context
    crit: exception
    any:
      - id: archive-crate-name
      - id: crate-name
    all:
      - id: repository-url
