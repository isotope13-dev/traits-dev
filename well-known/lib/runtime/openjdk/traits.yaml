defaults:
  platforms: [linux, macos, windows]
  for: [jar, java, elf, macho, pe, archives, zip]
  crit: notable
  conf: 0.96
  size_max: 600000000
traits:
  - id: awt-x11-runtime
    desc: OpenJDK AWT X11 runtime library
    for: [elf, so]
    if:
      type: basename
      exact: libawt_xawt.so
  - id: source-archive-path
    desc: JDK source archive path
    for: [zip, java]
    if:
      type: path
      regex: '(^|[\\/])src\.zip'
  - id: module-source-root
    desc: OpenJDK module source path prefix
    for: [java]
    if:
      type: path
      regex: '^java\.[a-z.]+[/\\]'
  - id: sun-internal-package
    desc: sun or com.sun Java package
    for: [java]
    if:
      type: text
      regex: '(?m)^package (sun\.|com\.sun\.)'
  - id: rt-jar-basename
    desc: Java runtime archive basename
    crit: component
    for: [jar]
    if:
      type: basename
      exact: rt.jar
  - id: large-runtime-jar
    desc: Large Java runtime jar
    crit: component
    for: [jar]
    size_min: 10485760
    if:
      type: metrics
      field: archive.file_count
      min: 10000
  - id: testimage-archive
    desc: OpenJDK test image archive
    for: [archive, zip]
    if:
      type: basename
      regex: '(?i)OpenJDK[0-9A-Za-z_-]*-testimage_[^\\/]+\.zip$'
composite_rules:
  - id: bundled-jdk-src-context
    desc: Official OpenJDK module source member
    crit: exception
    conf: 0.99
    for: [java]
    all:
      - id: module-source-root
      - id: sun-internal-package
  - id: rt-jar
    desc: OpenJDK runtime class archive
    crit: notable
    conf: 0.98
    for: [jar]
    all:
      - id: rt-jar-basename
      - id: large-runtime-jar
