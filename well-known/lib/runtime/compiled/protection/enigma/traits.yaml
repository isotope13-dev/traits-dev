defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  size_min: 65536
  size_max: 16777216
traits:
  - id: registration-key-check-export
    desc: Enigma registration-key check export
    conf: 0.97
    if:
      type: export
      regex: '^EP_RegCheckKey(A|W)?$'
  - id: registration-key-save-export
    desc: Enigma registration-key save export
    conf: 0.97
    if:
      type: export
      regex: '^EP_RegSaveKey(A|W)?$'
  - id: registration-key-load-export
    desc: Enigma registration-key load export
    conf: 0.97
    if:
      type: export
      regex: '^EP_RegLoadKey(A|W)?$'
  - id: hardware-id-export
    desc: Enigma hardware-ID API export
    conf: 0.97
    if:
      type: export
      exact: EP_RegHardwareID
  - id: hardware-id-ansi-export
    desc: Enigma ANSI hardware-ID API export
    conf: 0.97
    if:
      type: export
      exact: EP_RegHardwareIDA
  - id: hardware-id-wide-export
    desc: Enigma wide hardware-ID API export
    conf: 0.97
    if:
      type: export
      exact: EP_RegHardwareIDW
  - id: product-url
    desc: Enigma Protector product URL
    conf: 0.95
    if:
      type: text
      section: any
      substr: www.enigmaprotector.com
  # Loader header/body shape does not establish an exact product version.
  - id: pic-loader-stub
    desc: Enigma position-independent loader stub
    crit: notable
    conf: 0.99
    arch: [x86]
    size_min: 65536
    size_max: 500000000
    if:
      type: hex
      section: any
      pattern: 60 E8 00 00 00 00 5D 81 ED 06 00 00 00 81 ED ?? ?? ?? 00 E9 ?? ?? ?? ?? 45 4E 49 47 4D 41

composite_rules:
  - id: registration-key-exports
    desc: Enigma registration-key API export families
    conf: 0.99
    all:
      - id: registration-key-check-export
      - id: registration-key-save-export
      - id: registration-key-load-export
  - id: hardware-id-exports
    desc: Enigma hardware-ID API export variants
    conf: 0.99
    needs: 2
    any:
      - id: hardware-id-export
      - id: hardware-id-ansi-export
      - id: hardware-id-wide-export
  - id: runtime-library
    desc: Enigma Protector runtime library
    conf: 0.99
    all:
      - id: registration-key-exports
      - id: hardware-id-exports
      - id: product-url
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
