defaults:
  conf: 0.98
  platforms: [unix, windows]
  for: [rust, shell]
  size_max: 1000000
traits:
  - id: rootcx-service-content
    desc: rootcx-platform service helper content
    crit: notable
    if:
      type: text
      substr: RootCX\\
  - id: ocgcore-setup-ndk-content
    desc: ocgcore Android NDK setup helper content
    crit: notable
    if:
      type: text
      substr: ndk-bundle
composite_rules:
  - id: rootcx-platform-service-module
    desc: rootcx-platform crate service helper
    crit: notable
    all:
      - id: metadata/package/files/runtime::service-rust-basename
      - id: rootcx-service-content
