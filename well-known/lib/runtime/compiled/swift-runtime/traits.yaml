# Identity markers for binaries linked against the Swift language runtime on
# ELF platforms. Every Swift-compiled binary carries the `swift5_*` reflection
# sections (and Demangler emits `.swift_modhash`), and any binary that embeds
# the Swift standard library carries its runtime failure banner. Together they
# identify the Swift toolchain and provide benign context for Swift's ELF
# layout quirks -- notably the writable `.rodata` section the toolchain emits
# for runtime metadata that needs loader fixups.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.99
  size_min: 100000
  size_max: 1073741824

traits:
  - id: abi-metadata-section
    desc: Swift ABI reflection metadata sections
    if:
      type: value
      path: elf.sections[*].name
      regex: '^(\.swift_modhash|swift5_[a-z0-9_]+)$'

  - id: runtime-failure-banner
    desc: Swift standard runtime failure banner
    if:
      type: text
      substr: 'Swift runtime failure:'
      section: .rodata

composite_rules:
  - id: swift-runtime-binary
    desc: Binary built with the Swift toolchain
    crit: notable
    any:
      - id: abi-metadata-section
      - id: runtime-failure-banner
