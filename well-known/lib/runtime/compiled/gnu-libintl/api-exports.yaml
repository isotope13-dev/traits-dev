defaults:
  platforms: [windows]
  for: [dll]
  crit: notable
  size_min: 512
traits:
  - id: gettext-gettext-export
    desc: Exports GNU gettext gettext
    conf: 0.95
    if:
      type: export
      exact: gettext
  - id: gettext-bindtextdomain-export
    desc: Exports GNU gettext bindtextdomain
    conf: 0.95
    if:
      type: export
      exact: bindtextdomain
  - id: gettext-textdomain-export
    desc: Exports GNU gettext textdomain
    conf: 0.95
    if:
      type: export
      exact: textdomain
  - id: gettext-ngettext-export
    desc: Exports GNU gettext ngettext
    conf: 0.95
    if:
      type: export
      exact: ngettext
  - id: gettext-dgettext-export
    desc: Exports GNU gettext dgettext
    conf: 0.95
    if:
      type: export
      exact: dgettext
composite_rules:
  - id: gettext-api-exports
    desc: Exports multiple GNU gettext API functions
    conf: 0.98
    needs: 3
    any:
      - id: gettext-gettext-export
      - id: gettext-bindtextdomain-export
      - id: gettext-textdomain-export
      - id: gettext-ngettext-export
      - id: gettext-dgettext-export
