defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - binaries
  size_min: 1024
  size_max: 10485760
  crit: notable
traits:
- id: libintl-dll-basename
  desc: GNU libintl DLL basename
  conf: 0.95
  if:
    type: text
    substr: libintl3.dll
- id: gettext-sys-crate-archive
  desc: gettext-sys Rust crate archive
  conf: 0.99
  for:
  - gz
  if:
    type: raw
    regex: gettext-sys-[0-9]+\.[0-9]+\.[0-9]+\.crate
- id: gettext-sys-source-tree
  desc: gettext-sys source tree member path
  conf: 0.99
  for:
  - gz
  - rust
  - c
  - cpp
  - shell
  if:
    type: path
    regex: gettext-sys-[0-9]+\.[0-9]+\.[0-9]+
