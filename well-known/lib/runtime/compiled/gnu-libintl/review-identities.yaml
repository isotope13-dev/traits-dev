composite_rules:
- platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  size_min: 1024
  size_max: 10485760
  id: gnu-libintl-library
  desc: GNU libintl gettext library
  crit: notable
  conf: 0.95
  all:
  - id: well-known/lib/runtime/compiled/gnu-libintl::libintl-dll-basename
  - id: metadata/binary/symbols/name/qualified::libintl-prefixed-export
