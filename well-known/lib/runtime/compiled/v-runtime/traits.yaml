# V programming language (vlang.io) compiled binaries.
# V compiles to native binaries (C code generation) and statically links
# its runtime library (vlib) including garbage collection, string formatting,
# and panic handling.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 10000

traits:
  - id: v-panic-banner
    desc: V language panic handler banner
    if:
      type: text
      substr: "V panic: "
      section: rodata

  - id: vlib-source-path
    desc: V standard library source path
    if:
      type: text
      regex: 'vlib/[a-zA-Z0-9_/-]+\.v'
      section: rodata

  - id: v-runtime-gc-debugger-symbol
    desc: V runtime GC debugger check symbol
    if:
      type: symbol
      substr: v__gc_debugger_present_linux

composite_rules:
  - id: v-panic-source-combo
    desc: V language panic and vlib source combo
    crit: notable
    conf: 0.98
    all:
      - id: v-panic-banner
      - id: vlib-source-path

  - id: v-native-runtime
    desc: V language compiled native runtime
    crit: notable
    conf: 0.99
    any:
      - id: v-runtime-gc-debugger-symbol
      - id: v-panic-source-combo
