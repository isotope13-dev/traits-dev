defaults:
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: libtcc-export
    desc: Tiny C Compiler runtime export
    size_min: 4096
    size_max: 33554432
    if:
      type: export
      regex: '^tcc_(new|delete|compile_string|relocate|run)$'

  - id: libtcc-path
    desc: Tiny C Compiler binary path
    size_min: 256
    size_max: 33554432
    if:
      type: path
      regex: '(?i)(^|[\\/])libtcc\.dll'

composite_rules:
  - id: tiny-c-compiler-library
    desc: Tiny C Compiler runtime library
    any:
      - id: libtcc-export
      - id: libtcc-path
