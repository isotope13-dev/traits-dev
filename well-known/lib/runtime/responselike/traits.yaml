# responselike — fake Node IncomingMessage.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: responselike npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: responselike

  - id: vendored-path
    desc: vendored responselike package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/responselike/'


composite_rules:
  - id: responselike-library
    desc: responselike IncomingMessage shim
    any:
      - id: package-name
      - id: vendored-path
