# sindresorhus/define-lazy-prop — lazy object property helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: import-example
    desc: define-lazy-prop TypeScript import example
    for: [typescript]
    if:
      type: text
      substr: "import defineLazyProp = require('define-lazy-prop')"

  - id: lazy-define-export
    desc: define-lazy-prop getter then lock
    if:
      type: text
      substr: 'module.exports = (object, propertyName, fn)'

  - id: vendored-path
    desc: vendored define-lazy-prop package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/define-lazy-prop/'

composite_rules:
  - id: define-lazy-prop-library
    desc: define-lazy-prop lazy property helper
    needs: 2
    any:
      - id: import-example
      - id: vendored-path
      - id: lazy-define-export
