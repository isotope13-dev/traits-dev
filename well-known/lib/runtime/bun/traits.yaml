defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: bun-types-package-name
    desc: Bun TypeScript definitions package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: bun-types

  - id: bun-dts-declaration
    desc: Bun runtime TypeScript declaration file
    for: [typescript, javascript]
    if:
      type: path
      basename: true
      exact: bun.d.ts

  - id: bun-types-package-docs-path
    desc: Bun types package docs tree path
    for: [markdown, text, typescript, javascript, shell]
    if:
      type: path
      regex: '(^|[\\/])package[\\/]docs'

  - id: bun-types-archive-path
    desc: Bun types package archive path segment
    for: [markdown, text, typescript, javascript, package.json, npm, shell]
    if:
      type: path
      regex: '(^|[\\/])bun-types'

composite_rules:
  - id: bun-types-package-context
    desc: Official Bun runtime type definitions package
    crit: exception
    conf: 0.99
    any:
      - id: bun-types-package-name
      - id: bun-dts-declaration
      - id: bun-types-package-docs-path
      - id: bun-types-archive-path
