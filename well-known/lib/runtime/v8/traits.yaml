defaults:
  for: [pe, elf, macho]
  platforms: [linux, macos, windows]
  size_min: 1048576
  size_max: 2147483647
traits:
  - id: gc-guide-heading
    desc: V8 garbage collection guide heading
    crit: notable
    conf: 0.99
    for: [markdown]
    size_min: 0
    if:
      type: value
      path: markdown.first_heading
      exact: V8 Garbage Collection
  - id: node-v8-heap-api-example
    desc: Node.js V8 heap API example
    crit: notable
    conf: 0.98
    for: [markdown]
    size_min: 0
    if:
      type: text
      regex: "require\\('node:v8'\\)[\\s\\S]{0,180}getHeapStatistics\\(\\)"

  - id: node-v8-heap-snapshot-example
    desc: Node.js V8 heap snapshot example
    crit: notable
    conf: 0.98
    for: [markdown]
    size_min: 0
    if:
      type: text
      regex: "require\\('node:v8'\\)[\\s\\S]{0,240}writeHeapSnapshot\\("

  - id: node-inspector-heap-profiler-example
    desc: Node.js inspector heap profiler example
    crit: notable
    conf: 0.98
    for: [markdown]
    size_min: 0
    if:
      type: text
      substr: HeapProfiler.takeHeapSnapshot

  - id: node-async-resource-tracker-example
    desc: Node.js async resource tracker example
    crit: notable
    conf: 0.98
    for: [markdown]
    size_min: 0
    if:
      type: text
      regex: "require\\('node:async_hooks'\\)[\\s\\S]{0,220}createHook\\("
  - id: isolate-symbol
    desc: V8 isolate API symbol
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: v8::Isolate
      section: rdata
  - id: build-configuration-flag
    desc: V8 build configuration flag string
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: v8_enable_
      section: rdata
  - id: node-runtime-basename
    desc: Node.js runtime executable basename
    crit: component
    conf: 0.98
    if:
      type: path
      regex: '(^|[\\/])node$'
  - id: node-runtime-registration-symbol
    desc: Node.js V8 registration symbol
    crit: notable
    conf: 0.99
    if:
      type: symbol
      regex: register_v8

  - id: isolate-debugger-attached-fn
    desc: V8 IsDebuggerAttached helper
    for: [c, cpp]
    crit: notable
    conf: 0.99
    size_min: 0
    size_max: 2147483647
    if:
      type: text
      substr: bool IsDebuggerAttached()
composite_rules:
  - id: v8-gc-guide
    desc: V8 garbage collection documentation guide
    crit: notable
    conf: 0.99
    for: [markdown]
    size_min: 0
    all:
      - id: gc-guide-heading
      - id: node-v8-heap-api-example

  - id: node-memory-debugging-guide
    desc: Node.js memory debugging guide
    crit: notable
    conf: 0.98
    for: [markdown]
    size_min: 0
    all:
      - id: node-v8-heap-snapshot-example
      - id: node-inspector-heap-profiler-example
      - id: node-async-resource-tracker-example
  - id: v8-runtime-multi-marker
    desc: V8 JavaScript runtime (API symbol and build configuration markers)
    crit: notable
    conf: 0.96
    all:
      - id: well-known/lib/runtime/v8::isolate-symbol
      - id: well-known/lib/runtime/v8::build-configuration-flag
  - id: nodejs-runtime
    desc: Node.js V8 runtime executable
    crit: notable
    conf: 0.98
    all:
      - id: node-runtime-basename
      - id: node-runtime-registration-symbol
