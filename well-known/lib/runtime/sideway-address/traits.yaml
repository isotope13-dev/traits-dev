# sideway/address — email/URI/IP validators.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@sideway/address npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@sideway/address'
  - id: vendored-path
    desc: vendored @sideway/address package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@sideway/address/'

composite_rules:
  - id: sideway-address-library
    desc: sideway address validators
    any:
      - id: package-name
      - id: vendored-path
