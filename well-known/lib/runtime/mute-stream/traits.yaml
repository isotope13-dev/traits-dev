# isaacs/mute-stream — mute a stream.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mute-stream npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mute-stream

  - id: vendored-path
    desc: vendored mute-stream package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/mute-stream/'


composite_rules:
  - id: mute-stream-library
    desc: mute-stream stdio mute helper
    any:
      - id: package-name
      - id: vendored-path
