# request/caseless — case-insensitive object keys.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: caseless npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: caseless

  - id: repository-url
    desc: mikeal/caseless source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/mikeal/caseless

  - id: missing-header-error
    desc: caseless missing-header match error
    for: [javascript]
    if:
      type: text
      substr: 'There is no header than matches "'

  - id: vendored-path
    desc: vendored caseless package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/caseless/'

composite_rules:
  - id: caseless-library
    desc: caseless HTTP header key helper
    any:
      - id: package-name
      - id: repository-url
      - id: missing-header-error
      - id: vendored-path
