# emitter-listener — EventEmitter observability helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: emitter-listener npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: emitter-listener

  - id: vendored-path
    desc: vendored emitter-listener package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/emitter-listener/'
