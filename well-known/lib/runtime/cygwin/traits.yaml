# The Cygwin POSIX emulation runtime and its MSYS2 fork.
#
# cygwin1.dll (and msys-2.0.dll, which is the same codebase rebranded) provides
# fork(), signals and a POSIX heap on top of Win32. Doing that requires a set of
# primitives that read as an in-memory loader in any other program: the DLL
# re-reads its own image to rebuild a forked child's address space, stages it
# with VirtualAlloc/VirtualProtect, and delivers signals through QueueUserAPC.
# It also ships unsigned, with GNU-toolchain section names and a hash-derived
# link timestamp. Identifying the runtime is what lets the injection and
# self-read composites exclude it by name instead of by weakening themselves.
#
# Every Cygwin-based tool redistributes this DLL, so the identity is worth
# recording on its own: it tells an analyst the package carries a full POSIX
# emulation layer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  # The POSIX runtime is a multi-megabyte DLL; the identity never applies to a
  # stub or a same-named placeholder.
  size_min: 65536
  size_max: 33554432

traits:
  - id: cygwin-runtime-basename
    desc: Cygwin POSIX runtime DLL basename
    if:
      type: basename
      exact: cygwin1.dll

  - id: msys2-runtime-basename
    desc: MSYS2 POSIX runtime DLL basename
    if:
      type: basename
      exact: msys-2.0.dll

  # Both builds carry Cygwin's own description string; MSYS2 keeps it verbatim
  # and distinguishes itself with the product name below.
  - id: cygwin-posix-emulation-description
    desc: Cygwin POSIX emulation DLL description
    if:
      type: value
      path: pe.version.description
      exact: Cygwin POSIX Emulation DLL

  - id: msys2-runtime-product
    desc: MSYS2 product version identity
    if:
      type: value
      path: pe.version.product_name
      exact: MSYS2

  - id: cygwin-runtime-product
    desc: Cygwin product version identity
    if:
      type: value
      path: pe.version.product_name
      exact: Cygwin

composite_rules:
  - id: msys2-runtime
    desc: MSYS2 POSIX emulation runtime
    conf: 0.99
    all:
      - id: msys2-runtime-basename
      - id: cygwin-posix-emulation-description
      - id: msys2-runtime-product

  - id: cygwin-runtime
    desc: Cygwin POSIX emulation runtime
    conf: 0.99
    all:
      - id: cygwin-posix-emulation-description
    any:
      - id: cygwin-runtime-basename
      - id: cygwin-runtime-product

  # One name for "this file is the Cygwin/MSYS2 POSIX runtime", for the
  # composites that need to exclude its fork/signal machinery.
  - id: cygwin-family-runtime
    desc: Cygwin or MSYS2 POSIX emulation runtime
    conf: 0.99
    any:
      - id: cygwin-runtime
      - id: msys2-runtime
