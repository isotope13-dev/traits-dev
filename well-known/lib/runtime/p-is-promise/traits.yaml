# p-is-promise — detect Promise-like values.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: p-is-promise npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: p-is-promise
  - id: vendored-path
    desc: vendored p-is-promise package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/p-is-promise/'

composite_rules:
  - id: p-is-promise-library
    desc: p-is-promise type check
    any:
      - id: package-name
      - id: vendored-path
