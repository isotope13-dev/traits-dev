# Netty ships this intentionally permissive trust-manager utility as a
# reusable transport helper; it is not evidence of sample-specific bypass.
# Match the public class name so shaded embeds (e.g. grpc-netty-shaded) and
# Android DEX string tables are covered, not only unshaded JVM .class files.
defaults:
  platforms: [unix, windows, android]
  for: [class, java_class, jar, zip, java]
  crit: notable
  conf: 0.99

traits:
  - id: insecure-trust-manager-utility
    desc: Netty insecure trust manager utility class
    if:
      type: text
      substr: InsecureTrustManagerFactory
