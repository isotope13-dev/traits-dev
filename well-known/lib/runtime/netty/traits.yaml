# Netty ships this intentionally permissive trust-manager utility as a
# reusable transport helper; it is not evidence of sample-specific bypass.
# Match the public class name so shaded embeds (e.g. grpc-netty-shaded) and
# Android DEX string tables are covered, not only unshaded JVM .class files.
defaults:
  platforms: [unix, windows, android]
  for: [class, java_class, jar, zip, java]
  crit: notable
  conf: 0.99

traits:
  - id: insecure-trust-manager-utility
    desc: Netty insecure trust manager utility class
    if:
      type: text
      substr: InsecureTrustManagerFactory

  # tcnative KeyLogCallback is OpenSSL/BoringSSL TLS session-key logging for
  # SSLKEYLOGFILE / Wireshark debugging — not keyboard capture. Tiny .class
  # files often skip raw text indexes, so identify via class facts + basename.
  - id: tcnative-keylog-callback-basename
    desc: Netty tcnative KeyLogCallback class basename
    crit: component
    conf: 0.95
    for: [class, java_class, jar, zip]
    if:
      type: path
      basename: true
      exact: KeyLogCallback.class

  - id: tcnative-package-this-class
    desc: Netty tcnative package this_class value
    crit: component
    conf: 0.95
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '(?i)/tcnative/'

  - id: tcnative-keylog-callback-class-string
    desc: Netty tcnative KeyLogCallback class string
    crit: component
    conf: 0.95
    for: [class, java_class]
    if:
      type: value
      path: class.strings
      substr: KeyLogCallback

composite_rules:
  - id: tcnative-tls-keylog-callback
    desc: Netty tcnative TLS key-log callback class
    crit: notable
    conf: 0.99
    for: [class, java_class]
    all:
      - id: tcnative-package-this-class
    any:
      - id: tcnative-keylog-callback-basename
      - id: tcnative-keylog-callback-class-string
