defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 5242880

traits:
  - id: graphviz-cgraph-library
    desc: Graphviz cgraph runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: libcgraph-6.dll

  - id: graphviz-gvc-library
    desc: Graphviz gvc runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: libgvc-6.dll

  - id: graphviz-pathplan-library
    desc: Graphviz pathplan runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: libpathplan-4.dll

  - id: graphviz-plugin-library
    desc: Graphviz plugin runtime library
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^libgvplugin_[a-z0-9_-]+-6\.dll$'
