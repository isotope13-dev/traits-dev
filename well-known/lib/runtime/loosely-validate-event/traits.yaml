# Segment loosely-validate-event helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Segment loosely-validate-event package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@segment/loosely-validate-event'
  - id: vendored-path
    desc: vendored @segment/loosely-validate-event package
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@segment/loosely-validate-event'

composite_rules:
  - id: loosely-validate-event-library
    desc: Segment event validator
    any:
      - id: package-name
      - id: vendored-path
