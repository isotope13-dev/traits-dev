defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: browser-vm-run-in-context
    desc: Browser VM compatibility run-in-context method
    size_min: 4096
    size_max: 100000000
    if:
      type: text
      substr: Script.prototype.runInContext
  - id: browser-vm-run-this-context
    desc: Browser VM run-in-this-context method
    size_min: 4096
    size_max: 100000000
    if:
      type: text
      substr: Script.prototype.runInThisContext

composite_rules:
  - id: browser-vm-compatibility-module
    desc: Browser VM compatibility module
    crit: exception
    conf: 0.99
    all:
      - id: browser-vm-run-in-context
      - id: browser-vm-run-this-context
