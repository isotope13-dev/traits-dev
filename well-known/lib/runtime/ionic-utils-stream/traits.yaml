# @ionic/utils-stream — Ionic CLI Node stream helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ionic utils-stream package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ionic/utils-stream'

  - id: vendored-path
    desc: Ionic utils-stream package path
    if:
      type: path
      regex: '@ionic/utils-stream'

composite_rules:
  - id: ionic-utils-stream-library
    desc: Ionic utils-stream helper library
    any:
      - id: package-name
      - id: vendored-path
