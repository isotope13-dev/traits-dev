# Eclipse Vert.x — async JVM application toolkit (ships permissive dev TLS helpers).
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class, java]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000

traits:
  - id: vertx-core-package-marker
    desc: Vert.x core Java package marker
    if:
      type: text
      substr: vertx/core/

  - id: trust-all-trust-manager-class
    desc: Vert.x TrustAllTrustManager class name
    if:
      type: text
      substr: TrustAllTrustManager

composite_rules:
  - id: vertx-runtime-library
    desc: Vert.x async application toolkit
    crit: notable
    conf: 0.96
    any:
      - id: vertx-core-package-marker
      - id: trust-all-trust-manager-class
