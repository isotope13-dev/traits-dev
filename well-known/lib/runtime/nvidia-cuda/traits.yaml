defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000000
  size_max: 134217728

traits:
  - id: nvidia-cupti-library-basename
    desc: NVIDIA CUPTI profiler library basename
    crit: component
    conf: 0.99
    platforms: [linux]
    for: [elf, so]
    if:
      type: basename
      regex: '^libcupti\.so'

  - id: nvidia-nvperf-host-linux-basename
    desc: NVIDIA Nsight Perf host library Linux basename
    crit: component
    conf: 0.99
    platforms: [linux]
    for: [elf, so]
    if:
      type: basename
      exact: libnvperf_host.so

  - id: nvidia-cuda-cupti-wheel-name
    desc: NVIDIA CUDA CUPTI Python wheel package name
    crit: component
    conf: 0.99
    platforms: [linux, windows]
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      regex: '^nvidia-cuda-cupti-cu[0-9]+$'

  - id: nvidia-cuda-cupti-installer-email
    desc: NVIDIA CUDA installer team contact email
    crit: component
    conf: 0.99
    for: [whl]
    if:
      type: value
      path: METADATA::Author-email
      substr: compute_installer@nvidia.com

  - id: nvidia-nvperf-host-basename
    desc: NVIDIA Nsight Perf SDK host DLL basename
    crit: component
    conf: 0.99
    if:
      type: path
      basename: true
      exact: nvperf_host.dll

  - id: nvidia-nvperf-host-product
    desc: NVIDIA Nsight Perf SDK product metadata
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Nsight Perf SDK

  - id: nvidia-nvperf-host-export
    desc: NVIDIA Nsight GPU profiler API export
    crit: component
    conf: 0.99
    if:
      type: export
      regex: '^NVPW_(CUDA|D3D11|D3D12|VK)_Profiler_IsGpuSupported$'

composite_rules:
  - id: nvidia-cuda-cupti-runtime
    desc: NVIDIA CUDA CUPTI profiling runtime package
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: nvidia-cupti-library-basename
      - id: nvidia-nvperf-host-linux-basename
      - id: nvidia-cuda-cupti-wheel-name
      - id: nvidia-cuda-cupti-installer-email
  - id: nvidia-nvperf-host-library
    desc: NVIDIA Nsight Perf SDK host library
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: nvidia-nvperf-host-basename
      - id: nvidia-nvperf-host-product
      - id: nvidia-nvperf-host-export
