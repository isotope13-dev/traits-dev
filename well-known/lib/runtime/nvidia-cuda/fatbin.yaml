# nvcc embeds compiled GPU device code (PTX + cubin) for every targeted
# compute capability into a `.nv_fatb`/`.nvFatBi` section of the host object.
# A CUDA library built for many architectures (sm_50 .. sm_90+) routinely
# carries tens to hundreds of MB of this in a single DLL/SO — OpenCV's
# opencv_cuda*.dll builds are a common example. That bulk is legitimate
# device-code packaging, not anti-scanner padding, so it should not count
# toward "PE padded past scanner limits" style composites.
defaults:
  platforms: [windows, linux]
  for: [pe, dll, elf, so]
  crit: notable
  conf: 0.97
  size_min: 1000000

traits:
  - id: nv-fatbin-section
    desc: NVIDIA CUDA fat binary section (.nv_fatb)
    if:
      type: section
      regex: '^\.nv[Ff]at[Bb]i?n?$'
