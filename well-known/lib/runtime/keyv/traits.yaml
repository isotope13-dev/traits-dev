# Keyv is a benign JavaScript key-value storage library. Its adapter registry
# names database backends such as mysql, postgres, and redis; those names are
# not an embedded brute-force credential dictionary.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: keyv-package-manifest
    desc: Keyv package manifest identity
    for: [package.json]
    if:
      type: value
      path: name
      exact: keyv

  - id: keyv-library-source-tree
    desc: Keyv library source-tree member
    if:
      type: path
      regex: '(?i)keyv[\\/]src[\\/]'

  - id: keyv-redis-adapter-mapping
    desc: Maps Redis to Keyv adapter
    for: [javascript]
    if:
      type: text
      substr: "redis: '@keyv/redis'"
