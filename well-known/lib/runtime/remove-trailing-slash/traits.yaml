# remove-trailing-slash string helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: remove-trailing-slash npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: remove-trailing-slash
  - id: vendored-path
    desc: vendored remove-trailing-slash package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/remove-trailing-slash/'

composite_rules:
  - id: remove-trailing-slash-library
    desc: remove-trailing-slash helper
    any:
      - id: package-name
      - id: vendored-path
