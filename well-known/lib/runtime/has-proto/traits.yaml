# ljharb/has-proto — detect [[Prototype]] support.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: has-proto npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: has-proto

  - id: vendored-path
    desc: vendored has-proto package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/has-proto/'
