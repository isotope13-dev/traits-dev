# kotlinx-coroutines-core (JetBrains). The debug agent swaps in its own
# kotlin.coroutines.jvm.internal.DebugProbesKt at attach time, so the library
# ships that class as the resource `DebugProbesKt.bin` rather than a .class.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.97
traits:
  - id: debug-probes-agent-class
    desc: kotlinx-coroutines DebugProbesKt agent class
    if:
      type: value
      path: class.this_class
      exact: kotlin/coroutines/jvm/internal/DebugProbesKt
