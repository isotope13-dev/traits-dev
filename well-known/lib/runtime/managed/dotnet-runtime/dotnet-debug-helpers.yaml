# CoreCLR ships a debugger helper -- and its TracerPid support -- into every
# single-file apphost and self-contained publish. Both spellings of the
# helper evidence fold into one exception composite so consumers need a
# single reference; exception consumers that already reference the managed
# runtime directory pick it up through that reference.
defaults:
  platforms: [unix, windows]
  for: [elf, pe]
composite_rules:
  - id: dotnet-runtime-debug-helper-variants
    desc: CoreCLR runtime debugger helper evidence
    crit: exception
    conf: 0.99
    any:
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper-marker
