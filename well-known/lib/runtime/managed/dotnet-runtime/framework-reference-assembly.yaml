# Basename and version-resource identity for Microsoft framework / reference
# assemblies (netstandard, mscorlib, CoreLib, System.* facades). Grouped so
# objective rules can suppress once instead of listing each leaf.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 50000000

traits:
  - id: mscorlib-dll-basename
    desc: mscorlib.dll reference assembly basename
    if:
      type: path
      basename: true
      exact: mscorlib.dll

  - id: mono-common-language-infrastructure-product
    desc: Mono Common Language Infrastructure product
    if:
      type: value
      path: pe.version.product_name
      exact: Mono Common Language Infrastructure

  - id: microsoft-diagnostics-traceevent-basename
    desc: Microsoft TraceEvent assembly basename
    if:
      type: path
      basename: true
      exact: Microsoft.Diagnostics.Tracing.TraceEvent.dll

  # A tool that compiles user code (Roslyn scaffolding, code generators) ships
  # the framework's reference assemblies as managed resources.  Each carries
  # ReferenceAssemblyAttribute, so a run of them is an API-surface bundle:
  # its metadata-only copies of AppDomain, TripleDES or Activator are lists of
  # names, not an encrypted payload being activated.  One marker alone is
  # not enough to count.
  # Hex, not text: identical strings collapse to one extracted string, which
  # would hide the repetition this trait counts.
  - id: embedded-reference-assembly-bundle
    desc: Bundle of embedded .NET reference assemblies
    count_min: 8
    if:
      type: hex
      section: .text
      pattern: "52 65 66 65 72 65 6E 63 65 41 73 73 65 6D 62 6C 79 41 74 74 72 69 62 75 74 65"

composite_rules:
  - id: mono-mscorlib-runtime-context
    desc: Mono mscorlib runtime assembly context
    crit: exception
    conf: 0.99
    all:
      - id: mscorlib-dll-basename
      - id: mono-common-language-infrastructure-product

  - id: mono-framework-assembly-context
    desc: Mono framework runtime assembly context
    crit: exception
    conf: 0.99
    all:
      - id: mono-common-language-infrastructure-product
      - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-system-assembly-original

  - id: framework-reference-assembly-context
    desc: Microsoft .NET framework or reference assembly context
    crit: exception
    conf: 0.99
    any:
      - id: metadata/file/extension/identity::netstandard-dll-basename
      - id: mscorlib-dll-basename
      - id: metadata/file/extension/identity::corelib-dll-basename
      - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-framework-facade-context
      - id: metadata/binary/framework::dotnet-reference-assembly
      - id: embedded-reference-assembly-bundle
      - id: mono-framework-assembly-context
      - id: microsoft-diagnostics-traceevent-basename
