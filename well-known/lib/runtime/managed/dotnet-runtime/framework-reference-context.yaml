defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-signed-reference-assembly-attribute
    desc: Microsoft-signed binary with reference attribute
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/compiler/managed::dotnet-reference-assembly-attribute
      - id: metadata/signature/verified/platform::microsoft
  - id: dotnet-framework-reference-context
    desc: CoreLib or signed reference-assembly context
    crit: notable
    conf: 0.99
    any:
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
      - id: dotnet-signed-reference-assembly-attribute
