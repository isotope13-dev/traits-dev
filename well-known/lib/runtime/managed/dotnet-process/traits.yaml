defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-system-diagnostics-process-resource
    desc: System.Diagnostics.Process resource reference
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: FxResources.System.Diagnostics.Process
      section: rdata
  - id: dotnet-system-diagnostics-process-pdb
    desc: System.Diagnostics.Process native image PDB
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])System\.Diagnostics\.Process\.ni\.pdb$'
composite_rules:
  - id: dotnet-system-diagnostics-process-reference
    desc: System.Diagnostics.Process library reference
    crit: notable
    conf: 0.99
    any:
      - id: dotnet-system-diagnostics-process-resource
      - id: dotnet-system-diagnostics-process-pdb
