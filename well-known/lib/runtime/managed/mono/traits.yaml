# Native libraries of the managed runtimes. wine-mono ships both: the Mono
# runtime itself (libmono-2.0-*.dll), which is MinGW-built, unsigned, speaks
# Winsock in both client and server roles and registers several TLS callbacks
# because that is what a CLR host does; and WPF's Media Integration Layer
# (wpfgfx_cor3.dll), which unpacks its own resources, queries and reprotects
# memory for the composition engine, and imports IsDebuggerPresent.
#
# Both are the runtime, not a program using it, so the loader objectives read
# their ordinary startup as a staged payload.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, macho]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 200000000

traits:
  - id: mono-embedding-api-export
    desc: Mono runtime embedding API export
    if:
      type: symbol
      exact: mono_add_internal_call
  - id: mono-domain-api-export
    desc: Mono runtime domain API export
    if:
      type: symbol
      exact: mono_domain_assembly_open
  - id: wpf-milcore-interop-export
    desc: WPF composition interop export
    if:
      type: symbol
      exact: InteropDeviceBitmap_Create
  - id: mono-cli-product-name
    desc: Mono Common Language Infrastructure product name
    if:
      type: value
      path: pe.version.product_name
      exact: "MONO Common language infrastructure"
      case_insensitive: true
  - id: mono-development-team-company
    desc: Mono development team company name
    if:
      type: value
      path: pe.version.company
      exact: "MONO development team"
      case_insensitive: true

composite_rules:
  - id: managed-runtime-native-library
    desc: Managed runtime native library
    crit: notable
    conf: 0.99
    any:
      - id: mono-embedding-api-export
      - id: mono-domain-api-export
      - id: wpf-milcore-interop-export
  - id: mono-bcl-assembly-context
    desc: Mono Base Class Library assembly context
    crit: exception
    all:
      - id: mono-cli-product-name
      - id: mono-development-team-company
