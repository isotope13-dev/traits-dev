# Metalama (PostSharp Technologies) — aspect-oriented programming framework for C# and Roslyn.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1000
  size_max: 100000000

traits:
  - id: product-name
    desc: Metalama framework PE product name
    if:
      type: value
      path: pe.version.product_name
      regex: '^Metalama\.'

  - id: signer-organization
    desc: SharpCrafters PostSharp code signing cert
    if:
      type: value
      path: pe.signatures[0].organization
      exact: SharpCrafters s.r.o.

  - id: embedded-resource-namespace
    desc: Metalama embedded framework resource prefix
    if:
      type: text
      substr: 'Metalama.Framework.CompilerExtensions.Resources.Metalama.'
      section: .text

composite_rules:
  - id: binary
    desc: Metalama framework compiler extension assembly
    crit: notable
    conf: 0.99
    any:
      - id: product-name
      - id: signer-organization
      - id: embedded-resource-namespace
