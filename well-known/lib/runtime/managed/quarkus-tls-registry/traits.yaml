# Quarkus TLS Registry runtime provides an explicit trust-all option for
# development and opt-in runtime configurations.  Its implementation is a
# library capability, not evidence that an application has disabled TLS
# validation.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip, java]
  crit: notable
  conf: 0.99

traits:
  - id: quarkus-tls-runtime-path
    desc: Quarkus TLS runtime path
    if:
      type: path
      regex: 'io[\\/]quarkus[\\/]tls'
  # The same library as a packaged artifact. Quarkus lays its dependencies out
  # as `<groupId>.<artifactId>-<version>.jar`, where the group separator is a
  # dot, so the path form above never matches the jar itself.
  - id: quarkus-tls-registry-jar
    desc: Quarkus TLS registry library JAR
    if:
      type: basename
      regex: '^io\.quarkus\.quarkus-tls-registry-[0-9]'
