# Swagger Parser's RemoteUrl helper has an opt-in property that installs an
# accept-all trust manager for parsing remote API descriptions. Identify the
# implementation from class/archive content; the helper is dormant by default.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.98
  size_min: 64

traits:
  - id: swagger-parser-remote-url-class
    desc: Swagger Parser RemoteUrl class identity
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '^io/swagger/v3/parser/util/RemoteUrl(\$[0-9]+)?$'

  - id: swagger-parser-remote-url-archive-member
    desc: Swagger Parser RemoteUrl archive member identity
    for: [jar, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^io/swagger/v3/parser/util/RemoteUrl(\$[0-9]+)?\.class$'
