defaults:
  for: [pe, dll, macho]
  platforms: [windows, macos]
traits:
  - id: jli-launch
    desc: Java launcher symbol JLI_Launch
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "JLI_Launch"
  - id: jli-cmd-to-args
    desc: Java launcher symbol JLI_CmdToArgs
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "JLI_CmdToArgs"
  - id: jli-get-std-args
    desc: Java launcher symbol JLI_GetStdArgs
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "JLI_GetStdArgs"
  - id: jli-init-arg-processing
    desc: Java launcher symbol JLI_InitArgProcessing
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "JLI_InitArgProcessing"
  - id: jli-mem-alloc
    desc: Java launcher symbol JLI_MemAlloc
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "JLI_MemAlloc"
  - id: jli-report-error
    desc: Java launcher symbol JLI_ReportErrorMessage
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "JLI_ReportErrorMessage"
composite_rules:
  - id: jli-symbol-set
    desc: Java launcher symbol set
    crit: notable
    conf: 0.98
    needs: 4
    any:
      - id: jli-launch
      - id: jli-cmd-to-args
      - id: jli-get-std-args
      - id: jli-init-arg-processing
      - id: jli-mem-alloc
      - id: jli-report-error
  - id: jli-symbol-set-exe-path
    for: [pe]
    desc: Java launcher symbol set and EXE extension
    crit: notable
    conf: 0.96
    all:
      - id: jli-symbol-set
      - id: metadata/file/extension/identity::exe-extension
