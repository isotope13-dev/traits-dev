# Apache Log4j 2 — Java logging framework (org.apache.logging.log4j).
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: log4j-this-class
    desc: Log4j class this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^org/apache/logging/log4j/'

  - id: log4j-package-path
    desc: Log4j package path fragment
    conf: 0.96
    if:
      type: path
      regex: '(?i)logging/log4j'

  - id: log4j-class-string
    desc: Log4j package string in class pool
    conf: 0.95
    if:
      type: text
      substr: org/apache/logging/log4j/

  - id: log4j-api-jar-basename
    desc: Log4j API library JAR name
    for: [jar, zip]
    if:
      type: basename
      regex: '^log4j-api-[0-9][A-Za-z0-9._-]*\.jar$'
