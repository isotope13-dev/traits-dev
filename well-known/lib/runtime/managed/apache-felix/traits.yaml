defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: apache-felix-framework-manifest
    desc: Apache Felix OSGi framework manifest
    for: [jar]
    if:
      type: text
      regex: 'Bundle-SymbolicName:\s*org\.apache\.felix\.'

  - id: apache-felix-framework-namespace
    desc: Apache Felix framework class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^org/apache/felix/'

  - id: felix-class-path
    desc: Apache Felix class path
    if:
      type: path
      regex: 'apache/felix/'

  - id: osgi-framework-path
    desc: OSGi framework class path
    if:
      type: path
      regex: 'org/osgi/framework'

composite_rules:
  - id: apache-felix-library
    desc: Apache Felix OSGi framework
    any:
      - id: apache-felix-framework-manifest
      - id: apache-felix-framework-namespace
      - id: felix-class-path
      - id: osgi-framework-path
