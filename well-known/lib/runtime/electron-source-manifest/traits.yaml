defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: electron-source-app-manifest
    desc: Electron source application manifest
    crit: notable
    conf: 0.99
    all:
      - id: well-known/lib/runtime/electron::electron-source-main-entrypoint
    any:
      - id: well-known/lib/runtime/electron::electron-runtime-dependency
      - id: well-known/lib/runtime/electron::electron-development-runtime-dependency
