# core-js-compat — core-js compatibility data.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: core-js-compat npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: core-js-compat

  - id: vendored-path
    desc: vendored core-js-compat package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/core-js-compat/'


composite_rules:
  - id: core-js-compat-library
    desc: core-js-compat data package
    any:
      - id: package-name
      - id: vendored-path
