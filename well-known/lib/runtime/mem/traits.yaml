# sindresorhus/mem — memoize functions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mem npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mem
  - id: vendored-path
    desc: vendored mem package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/mem/'

composite_rules:
  - id: mem-library
    desc: mem memoize library
    any:
      - id: package-name
      - id: vendored-path
