# join-component — join URI components.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: join-component npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: join-component
  - id: vendored-path
    desc: vendored join-component package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/join-component/'

composite_rules:
  - id: join-component-library
    desc: join-component URI helper
    any:
      - id: package-name
      - id: vendored-path
