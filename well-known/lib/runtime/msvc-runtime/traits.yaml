defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.98
  size_min: 16384
  size_max: 536870912

traits:
  - id: runtime-basename
    desc: Microsoft C++ runtime DLL filename
    if:
      type: basename
      regex: '(?i)(MSVCP|MSVCR|VCRUNTIME)[0-9]{2,3}D?(_[0-9]+)?\.DLL'

  - id: runtime-version-info
    desc: MSVC runtime internal name
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^(MSVCP|MSVCR|VCRUNTIME)[0-9]{2,3}D?(_[0-9]+)?\.DLL$'

  - id: runtime-import-marker
    desc: MSVC runtime DLL import marker
    if:
      type: text
      section: .rdata
      regex: '(?i)(MSVCP|MSVCR|VCRUNTIME)[0-9]{2,3}D?(_[0-9]+)?\.DLL'

  - id: runtime-resource-marker
    desc: MSVC runtime version resource marker
    if:
      type: text
      section: .rsrc
      regex: '(?i)(MSVCP|MSVCR|VCRUNTIME)[0-9]{2,3}D?(_[0-9]+)?\.DLL'

  - id: runtime-path-marker
    desc: Embedded MSVC runtime DLL path
    if:
      type: path
      basename: true
      regex: '(?i)^(MSVC[PR]|VCRUNTIME)[0-9]{2,3}D?(_[0-9]+)?\.DLL$'

composite_rules:
  - id: msvc-runtime-library
    desc: Microsoft C++ runtime library evidence
    crit: notable
    needs: 2
    any:
      - id: runtime-basename
      - id: runtime-version-info
      - id: runtime-import-marker
      - id: runtime-resource-marker
      - id: runtime-path-marker

  - id: microsoft-visual-cpp-runtime
    desc: Microsoft Visual C++ runtime library
    crit: notable
    conf: 0.99
    all:
      - id: runtime-basename
      - id: runtime-version-info
      - id: metadata/binary/vendor::microsoft-prefixed-company
