# npm-install-checks — engine/platform checks.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: npm-install-checks npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: npm-install-checks

  - id: vendored-path
    desc: vendored npm-install-checks package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/npm-install-checks/'


composite_rules:
  - id: npm-install-checks-library
    desc: npm-install-checks library
    any:
      - id: package-name
      - id: vendored-path
