defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: string-obfuscation-crate-path
    desc: RustAegis string-obfuscation crate path
    crit: component
    conf: 0.99
    size_max: 10000000
    if:
      type: text
      section: .rdata
      regex: '(?i)aegis_vm-[0-9.]+[\\/]src[\\/]string_obfuscation\.rs'

  - id: vm-handler-crate-path
    desc: RustAegis virtual-machine handler crate path
    crit: component
    conf: 0.99
    size_max: 10000000
    if:
      type: text
      section: .rdata
      regex: '(?i)aegis_vm-[0-9.]+[\\/]src[\\/]handlers[\\/]exec\.rs'

composite_rules:
  - id: rustaegis-protected-binary
    desc: Binary protected by the RustAegis virtualizer
    crit: notable
    conf: 0.99
    all:
      - id: string-obfuscation-crate-path
      - id: vm-handler-crate-path
