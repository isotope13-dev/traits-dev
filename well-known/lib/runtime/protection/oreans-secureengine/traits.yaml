# Oreans Themida / WinLicense SecureEngine custom-message plugins export a
# fixed SecureEngine* callback set and are often shipped as TestPlugin.dll
# (the SDK "Test Plugin" action).  Identify that plugin surface so embedded
# Delphi crash-reporting stacks are attributed to the SDK sample rather than
# treated as standalone malware.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 8000000

traits:
  - id: secureengine-initialize-export
    desc: SecureEngineInitialize plugin export
    if:
      type: export
      substr: SecureEngineInitialize

  - id: secureengine-finalize-export
    desc: SecureEngineFinalize plugin export
    if:
      type: export
      substr: SecureEngineFinalize

  - id: secureengine-custom-message-export
    desc: SecureEngineShowCustomMessage plugin export
    if:
      type: export
      substr: SecureEngineShowCustomMessage

  - id: secureengine-encryption-key-export
    desc: SecureEngineGetEncryptionKey plugin export
    if:
      type: export
      substr: SecureEngineGetEncryptionKey

  - id: custommsgs-product-name
    desc: Oreans CustomMsgs plugin product name
    if:
      type: value
      path: pe.version.product_name
      exact: CustomMsgs

composite_rules:
  - id: oreans-secureengine-custom-message-plugin
    desc: Oreans SecureEngine custom-message plugin DLL
    crit: notable
    conf: 0.999
    all:
      - id: secureengine-initialize-export
      - id: secureengine-finalize-export
      - id: secureengine-custom-message-export
    any:
      - id: secureengine-encryption-key-export
      - id: custommsgs-product-name
    needs: 1

  - id: oreans-secureengine-plugin-context
    desc: Recognized Oreans SecureEngine plugin context
    crit: exception
    conf: 1.0
    all:
      - id: oreans-secureengine-custom-message-plugin
      - id: custommsgs-product-name
