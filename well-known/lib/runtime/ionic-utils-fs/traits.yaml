# @ionic/utils-fs — Ionic CLI filesystem helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ionic utils-fs package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ionic/utils-fs'

  - id: vendored-path
    desc: Ionic utils-fs package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@ionic/utils-fs/'

  - id: statsafe-export
    desc: Ionic utils-fs statSafe export
    if:
      type: text
      substr: 'exports.statSafe'

composite_rules:
  - id: ionic-utils-fs-library
    desc: Ionic utils-fs filesystem helper library
    needs: 2
    any:
      - id: package-name
      - id: vendored-path
      - id: statsafe-export
