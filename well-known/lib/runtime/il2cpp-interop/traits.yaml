# Il2CppInterop (successor to Il2CppAssemblyUnhollower) emits managed proxy
# assemblies so MelonLoader/BepInEx mods can call Unity IL2CPP game APIs.
# VirusSign / AV often mislabel these as MSIL trojans because Unity native
# bridge methods end in `_Injected` — that suffix is interop naming, not
# process injection.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 4096
  size_max: 50000000

traits:
  - id: il2cpp-interop-runtime-assembly
    desc: References Il2CppInterop.Runtime assembly
    if:
      type: text
      exact: Il2CppInterop.Runtime
      section: .text

  - id: il2cpp-interop-common-assembly
    desc: References Il2CppInterop.Common assembly
    if:
      type: text
      exact: Il2CppInterop.Common
      section: .text

  - id: il2cpp-interop-xref-range-marker
    desc: Il2CppInterop XrefRangeStart generator marker
    if:
      type: text
      exact: XrefRangeStart
      section: .text

  # Generated proxy field naming — unique to Il2CppInterop unhollowed assemblies.
  - id: il2cpp-interop-native-method-info-ptr
    desc: Il2CppInterop NativeMethodInfoPtr field prefix
    conf: 0.98
    count_min: 3
    if:
      type: text
      substr: NativeMethodInfoPtr_
      section: .text

  # Token-based method resolver emitted into every Il2CppInterop proxy assembly.
  - id: il2cpp-interop-get-method-by-token
    desc: Il2CppInterop GetIl2CppMethodByToken resolver
    conf: 0.98
    if:
      type: text
      exact: GetIl2CppMethodByToken
      section: .text

  # Unity IL2CPP P/Invoke bridge suffix that AV heuristics often treat as injection.
  # Incomplete alone — only meaningful with Il2CppInterop/Unity proxy context.
  - id: unity-il2cpp-injected-method-suffix
    desc: Unity IL2CPP native _Injected method suffix
    crit: component
    conf: 0.9
    count_min: 5
    if:
      type: text
      regex: '_Injected$'
      section: .text

composite_rules:
  - id: il2cpp-interop-generated-proxy
    desc: Il2CppInterop-generated Unity proxy assembly
    crit: notable
    conf: 0.98
    all:
      - id: il2cpp-interop-xref-range-marker
    any:
      - id: il2cpp-interop-runtime-assembly
      - id: il2cpp-interop-common-assembly
      - id: il2cpp-interop-native-method-info-ptr
      - id: il2cpp-interop-get-method-by-token

  - id: unity-xrmodule-il2cpp-interop-proxy
    desc: UnityEngine.XRModule Il2CppInterop proxy
    crit: notable
    conf: 0.98
    all:
      - id: well-known/lib/runtime/unity::unity-xr-managed-module
      - id: il2cpp-interop-generated-proxy

  # Dense _Injected bridges plus Il2CppInterop markers — the AV false-positive shape.
  - id: il2cpp-interop-injected-bridge-proxy
    desc: Il2CppInterop proxy with dense _Injected bridges
    crit: notable
    conf: 0.97
    all:
      - id: il2cpp-interop-generated-proxy
      - id: unity-il2cpp-injected-method-suffix
