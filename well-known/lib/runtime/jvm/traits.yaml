defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: baseline
  conf: 0.98
  size_max: 536870912

traits:
  - id: airlift-launcher-version-banner
    desc: Airlift launcher version banner
    crit: notable
    conf: 0.995
    platforms: [linux]
    for: [elf]
    if:
      type: raw
      substr: "Airlift launcher version: %s"
      section: rodata

  - id: runtime-library-basename
    desc: OpenJDK JVM runtime library basename
    if:
      type: path
      basename: true
      regex: '^((libjvm\.(so|dylib))|jvm\.dll)$'

  - id: runtime-support-library-basename
    desc: OpenJDK JVM support library basename
    if:
      type: path
      basename: true
      regex: '^(lib(javajpeg|jawt|awt)\.|awt\.dll$)'

  # The Windows AWT DLL is a GUI runtime component.  Keep the identity
  # evidence separate from the generic filename so a keylogging exception
  # requires both the JDK product metadata and the expected library name.
  - id: windows-jdk-product-identity
    desc: Windows JDK runtime product identity
    crit: notable
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^(OpenJDK Platform|Java(\(TM\))? Platform SE)\b'

  - id: windows-java-console-launcher-original-filename
    desc: java.exe original filename metadata
    crit: notable
    for: [pe]
    if:
      type: value
      path: pe.version.original_filename
      exact: java.exe

  - id: windows-java-gui-launcher-original-filename
    desc: javaw.exe original filename metadata
    crit: notable
    for: [pe]
    if:
      type: value
      path: pe.version.original_filename
      exact: javaw.exe

  - id: windows-java-se-versioninfo
    desc: Java SE version-resource identity
    crit: notable
    for: [pe]
    if:
      type: value
      path: pe.version
      regex: 'Java\(TM\) Platform SE (binary|8)'

  - id: windows-jjs-original-filename
    desc: Oracle Java jjs.exe original-filename metadata
    crit: notable
    for: [pe]
    if:
      type: value
      path: pe.version.original_filename
      exact: jjs.exe

  - id: windows-jjs-pdb-reference
    desc: Oracle Java jjs PDB path reference
    crit: notable
    for: [pe]
    if:
      type: text
      substr: \jjs_objs\jjs.pdb
      section: .rdata

  - id: windows-jli-library-reference
    desc: Java launcher jli.dll library reference
    crit: notable
    for: [pe]
    if:
      type: text
      exact: jli.dll
      section: .rdata

  - id: windows-oracle-javaw-imphash
    desc: Oracle javaw.exe import hash
    crit: notable
    conf: 0.995
    for: [pe]
    if:
      type: value
      path: pe.imphash
      exact: e8430c833f339cd7cf45c7f2a8132cef

  - id: windows-javaw-pdb-path
    desc: javaw.exe PDB path marker
    crit: notable
    for: [pe]
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])javaw\.pdb$'

  - id: windows-java-jni-create-vm
    desc: JNI_CreateJavaVM launcher entry string
    crit: notable
    for: [pe]
    if:
      type: text
      exact: JNI_CreateJavaVM
      section: rdata

  - id: windows-awt-library-basename
    desc: Windows AWT library basename
    crit: notable
    for: [pe, dll]
    if:
      type: value
      path: file.basename
      exact: awt.dll

  - id: runtime-awt-library-basename
    desc: OpenJDK AWT support library basename
    if:
      type: path
      basename: true
      regex: '^lib(awt_lwawt|fontmanager|freetype)\.'

  - id: runtime-x11-awt-library-basename
    desc: OpenJDK X11 AWT backend library basename
    if:
      type: path
      basename: true
      regex: '^libawt_xawt\.'

  - id: runtime-io-library-basename
    desc: OpenJDK NIO support library basename
    if:
      type: path
      basename: true
      regex: '^libnio\.'

  - id: runtime-network-library-basename
    desc: OpenJDK network support library basename
    if:
      type: path
      basename: true
      regex: '^(lib(net|nio)\.|net\.dll$)'

  - id: runtime-media-library-basename
    desc: OpenJDK media support library basename
    if:
      type: path
      basename: true
      regex: '^lib(lcms|mlib_image|splashscreen)\.'

  - id: runtime-windows-media-library-basename
    desc: OpenJDK Windows media library basename
    ref: sha256:c1ec4978244ad1305c90a99e2b74741749066e105038c3621ad319de988ece74
    if:
      type: basename
      exact: mlib_image.dll

  - id: runtime-sspi-bridge-basename
    desc: OpenJDK SSPI bridge library basename
    ref: sha256:c1ec4978244ad1305c90a99e2b74741749066e105038c3621ad319de988ece74
    if:
      type: path
      basename: true
      exact: sspi_bridge.dll

  - id: runtime-syslookup-library-basename
    desc: OpenJDK syslookup support library basename
    if:
      type: path
      basename: true
      substr: libsyslookup.

  - id: runtime-spawn-helper-basename
    desc: OpenJDK spawn helper basename
    if:
      type: path
      basename: true
      exact: jspawnhelper

  - id: bundled-runtime-path
    desc: Bundled OpenJDK runtime path
    if:
      type: path
      regex: 'runtime[\\/]Contents[\\/]Home'

  - id: runtime-library
    desc: OpenJDK JVM runtime library
    if:
      type: text
      regex: '(Java HotSpot|OpenJDK|JVM_EnqueueOperation)'
      section: rdata

  - id: jpackage-app-launcher-marker
    desc: jpackage application launcher marker
    for: [macho]
    if:
      type: text
      substr: jpackage
      section: __TEXT.__cstring

  - id: jli-launcher-marker
    desc: JLI_Launch application launcher marker
    for: [macho]
    if:
      type: text
      substr: JLI_Launch
      section: __TEXT.__cstring
  - id: java-launcher-basename
    desc: Java launcher executable basename
    if:
      type: path
      basename: true
      regex: '^(java|javaw|java\.exe|javaw\.exe)$'
      case_insensitive: true
  - id: jli-launcher-symbol
    desc: JLI_Launch Java launcher symbol
    for: [macho]
    if:
      type: symbol
      exact: _JLI_Launch
  - id: macos-libjli-rpath
    desc: macOS Java launcher libjli rpath
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.libraries[*]
      exact: '@rpath/libjli.dylib'
  - id: azul-zulu-code-signature
    desc: Azul Zulu Java code signature
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.code_signature.identifier
      exact: com.azul.zulu.java
  - id: keytool-basename
    desc: Java keytool executable basename
    for: [macho]
    platforms: [macos]
    if:
      type: basename
      exact: keytool
  - id: azul-zulu-keytool-code-signature
    desc: Azul Zulu keytool code signature
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.code_signature.identifier
      exact: com.azul.zulu.keytool

composite_rules:
  - id: windows-oracle-jjs-launcher
    desc: Oracle Java jjs scripting launcher
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: windows-jdk-product-identity
      - id: windows-java-se-versioninfo
      - id: windows-jjs-original-filename
      - id: metadata/vendor/string::java-platform-se-binary-resource

  - id: windows-jdk-awt-runtime
    desc: Windows JDK AWT runtime library
    crit: notable
    conf: 0.99
    for: [pe, dll]
    all:
      - id: windows-jdk-product-identity
      - id: windows-awt-library-basename

  - id: windows-java-launcher
    desc: Windows Java SE launcher binary
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: windows-jdk-product-identity
      - id: windows-java-jni-create-vm
    any:
      - id: windows-java-console-launcher-original-filename
      - id: windows-java-gui-launcher-original-filename
      - id: java-launcher-basename

  - id: jpackage-macho-launcher
    desc: jpackage Mach-O Java application launcher
    crit: baseline
    conf: 0.96
    for: [macho]
    platforms: [macos]
    all:
      - id: jli-launcher-marker
      - id: jpackage-app-launcher-marker
  - id: macos-java-launcher
    desc: macOS Java runtime launcher
    crit: notable
    conf: 0.98
    for: [macho]
    platforms: [macos]
    all:
      - id: java-launcher-basename
      - id: jli-launcher-symbol
      - id: macos-libjli-rpath
  - id: azul-zulu-macos-java-launcher
    desc: Azul Zulu macOS Java launcher
    crit: notable
    conf: 0.99
    for: [macho]
    platforms: [macos]
    all:
      - id: java-launcher-basename
      - id: jli-launcher-symbol
      - id: macos-libjli-rpath
      - id: azul-zulu-code-signature
  - id: azul-zulu-macos-keytool
    desc: Azul Zulu macOS keytool
    crit: notable
    conf: 0.99
    for: [macho]
    platforms: [macos]
    all:
      - id: keytool-basename
      - id: azul-zulu-keytool-code-signature
  # Vendor-neutral counterpart to the two Azul Zulu composites above. Every
  # macOS JDK command-line tool (java/javac/jdb/keytool/jarsigner...) is the
  # same launcher stub: it links @rpath/libjli.dylib and exports JLI_Launch.
  # They all carry com.apple.security.cs.debugger because HotSpot needs attach
  # and JVMTI, and jdb *is* a debugger. Pinning that carve-out to Zulu's
  # signing identity left every other distribution — the OpenJDK reference
  # builds (net.java.openjdk.*), Temurin, Corretto, Liberica, GraalVM,
  # Microsoft Build of OpenJDK, and jlink/jpackage runtimes — reporting one
  # suspicious per bundled tool, which hits any app or IDE extension that
  # ships a JRE.
  - id: macos-jdk-launcher-tool
    desc: macOS JDK launcher tool binary
    crit: notable
    conf: 0.98
    for: [macho]
    platforms: [macos]
    all:
      - id: macos-libjli-rpath
      - id: jli-launcher-symbol
