# wazero is a general-purpose, sandboxed WebAssembly runtime for Go. Runtime
# presence is library identity; suspiciousness requires a separate concealed
# payload or native-memory-loader behavior.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: notable
  conf: 0.9
  size_min: 100000
  size_max: 2000000000

traits:
  - id: module-path
    desc: wazero Go module path
    if:
      type: text
      substr: tetratelabs/wazero

  - id: panic-recovery-string
    desc: wazero panic recovery message
    conf: 0.85
    if:
      type: text
      substr: recovered by wazero

composite_rules:
  - id: wazero-runtime
    desc: Embedded wazero WebAssembly runtime
    any:
      - id: module-path
      - id: panic-recovery-string
