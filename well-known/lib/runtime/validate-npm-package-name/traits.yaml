# npm validate-npm-package-name utility.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: validate-npm-package-name npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: validate-npm-package-name

  - id: vendored-path
    desc: vendored validate-npm-package-name package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/validate-npm-package-name/'


composite_rules:
  - id: validate-npm-package-name-library
    desc: validate-npm-package-name helper
    any:
      - id: package-name
      - id: vendored-path
