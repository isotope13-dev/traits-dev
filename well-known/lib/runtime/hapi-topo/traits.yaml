# hapi Topo — topological sort.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@hapi/topo npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@hapi/topo'
  - id: vendored-path
    desc: vendored @hapi/topo package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@hapi/topo/'

composite_rules:
  - id: hapi-topo-library
    desc: hapi Topo sort library
    any:
      - id: package-name
      - id: vendored-path
