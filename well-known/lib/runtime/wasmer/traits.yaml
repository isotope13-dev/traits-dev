# Wasmer — open-source WebAssembly runtime (wasmerio). Compilers map ELF
# images with mmap/copy/mprotect; optional V8/wee8 builds download pinned
# GitHub release archives from the project's own custom-builds repo.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.99

traits:
  - id: wasmer-vm-libcall
    desc: Wasmer VM libcall import
    if:
      type: text
      substr: use wasmer_vm::LibCall

  - id: wasmer-wee8-release-url
    desc: Wasmer wee8 custom-build GitHub release URL
    if:
      type: text
      substr: github.com/wasmerio/wee8-custom-builds/releases/download/

composite_rules:
  - id: official-runtime-context
    desc: Official Wasmer WASM runtime context
    crit: exception
    conf: 0.99
    any:
      - id: wasmer-vm-libcall
      - id: wasmer-wee8-release-url
