# maxogden/concat-stream — writable that concatenates chunks.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: concat-stream npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: concat-stream

  - id: vendored-path
    desc: vendored concat-stream package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/concat-stream/'
