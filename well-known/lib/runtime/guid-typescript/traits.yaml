# guid-typescript — TypeScript GUID generator.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: guid-typescript npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: guid-typescript

  - id: vendored-path
    desc: vendored guid-typescript package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/guid-typescript/'
