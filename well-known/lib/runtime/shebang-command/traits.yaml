# kevva/shebang-command — get a shebang command.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: shebang-command npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: shebang-command

  - id: vendored-path
    desc: vendored shebang-command package path
    for: [scripts, manifests, data, source, text]
    if:
      type: path
      regex: 'node_modules/shebang-command/'
