defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, source, php, javascript, archives]
  crit: notable
  conf: 0.96
  size_max: 600000000
traits:
  - id: source-archive
    desc: PHP source archive basename
    for: [archive, tar, zst]
    if:
      type: basename
      exact: php.tar.xz
  - id: version-source-dir
    desc: PHP version source directory
    for: [binaries, scripts, source, github-actions, jpeg, zip, php, javascript]
    if:
      type: path
      regex: 'php-[0-9][^\\/]*[\\/]'
  - id: core-subtree-path
    desc: PHP core source subtree
    for: [binaries, scripts, source, github-actions, jpeg, zip, php, javascript]
    if:
      type: path
      regex: '(^|[\\/])(Zend|sapi)[\\/]'
  - id: runtime-lib-path
    desc: PHP runtime library path
    for: [binaries, scripts, source, php]
    if:
      type: path
      regex: 'lib[\\/]php[\\/]'
  - id: pear-share-path
    desc: PEAR library share path
    for: [binaries, scripts, source, php]
    if:
      type: path
      regex: 'php[\\/]pear([\\/]|$)'
  - id: runtime-include-path
    desc: PHP runtime include path
    for: [source]
    if:
      type: path
      regex: 'include[\\/]php[\\/]'
  - id: runtime-binary
    desc: PHP runtime binary basename
    for: [elf, pe, macho]
    if:
      type: basename
      regex: '^php(-fpm)?$'
  - id: runtime-product-name
    desc: PHP runtime PE product identity
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: PHP
  - id: runtime-company
    desc: PHP Group PE runtime publisher identity
    for: [pe]
    if:
      type: value
      path: pe.version.company
      exact: The PHP Group
composite_rules:
  - id: source-tree
    desc: PHP source tree path
    crit: notable
    conf: 0.98
    for: [binaries, scripts, source, github-actions, jpeg, zip, tar, archive, zst, php, javascript]
    any:
      - id: source-archive
      - id: version-source-dir
      - id: core-subtree-path
  - id: runtime-package
    desc: PHP runtime package path
    crit: notable
    conf: 0.98
    for: [binaries, scripts, source, php]
    any:
      - id: runtime-lib-path
      - id: runtime-include-path
      - id: runtime-binary
      - id: well-known/lib/network/curl::runtime-library
      - id: pear-share-path
  - id: runtime-binary-context
    desc: Official PHP runtime PE identity context
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      - id: runtime-product-name
      - id: runtime-company
