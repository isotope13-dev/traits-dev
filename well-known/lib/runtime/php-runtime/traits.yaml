defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, source, php, javascript, archives]
  crit: notable
  conf: 0.96
  size_max: 600000000
traits:
  - id: source-archive
    desc: PHP source archive basename
    for: [archive, tar, zst]
    if:
      type: basename
      exact: php.tar.xz
  - id: version-source-dir
    desc: PHP version source directory
    for: [binaries, scripts, source, github-actions, jpeg, zip, php, javascript]
    if:
      type: path
      regex: 'php-[0-9][^\\/]*[\\/]'
  - id: core-subtree-path
    desc: PHP core source subtree
    for: [binaries, scripts, source, github-actions, jpeg, zip, php, javascript]
    if:
      type: path
      regex: '(^|[\\/])(Zend|sapi)[\\/]'
  - id: runtime-lib-path
    desc: PHP runtime library path
    for: [binaries, scripts, source, php]
    if:
      type: path
      regex: 'lib[\\/]php[\\/]'
  - id: pear-share-path
    desc: PEAR library share path
    for: [binaries, scripts, source, php]
    if:
      type: path
      regex: 'php[\\/]pear([\\/]|$)'
  - id: runtime-include-path
    desc: PHP runtime include path
    for: [source]
    if:
      type: path
      regex: 'include[\\/]php[\\/]'
  - id: runtime-binary
    desc: PHP runtime binary basename
    for: [elf, pe, macho]
    if:
      type: basename
      regex: '^php(-cgi|-fpm)?[0-9]*$'
  - id: runtime-so-library
    desc: PHP Linux shared runtime library
    for: [elf]
    if:
      type: basename
      regex: '(?i)^libphp\.so'
  - id: opcache-extension
    desc: PHP Zend OPcache extension library
    for: [elf]
    if:
      type: basename
      exact: opcache.so
  - id: runtime-dylib-library
    desc: PHP macOS shared runtime library
    for: [macho]
    if:
      type: basename
      regex: '(?i)^libphp(\.[0-9]+)?\.dylib$'
  - id: runtime-libphp-dylib
    desc: PHP macOS runtime library basename
    for: [macho]
    if:
      type: basename
      exact: libphp.dylib
  - id: runtime-dll-library
    desc: PHP Windows shared runtime library
    for: [pe]
    if:
      type: basename
      regex: '(?i)^php[0-9]*(ts|nts)?\.dll$'
  - id: phpdbg-binary
    desc: PHP interactive debugger binary basename
    crit: notable
    for: [elf]
    if:
      type: basename
      exact: phpdbg
  # `.phpt` is the PHP test-file extension and is unique to PHP. The previous
  # matcher was a bare `[\\/]tests[\\/]` path regex, which is not a PHP marker at
  # all: it claimed PHP identity for every C/C++/JS/archive file that merely
  # sits under a `tests/` directory (libuv's deps/lua-compat-5.3/tests/
  # testmod.c, for one). It fed `source-tree`, which 59 `unless:` sites across
  # 39 files use as a benign-PHP suppressor, so anything under a `tests/` path
  # silenced kernel-privesc, ebpf kernel-hide, argv0 masquerade, self-delete,
  # dropper self-extract and the Havoc implant rules — and suppressed the
  # zip-bomb hook for any zip under `tests/`. Real PHP source trees stay
  # covered by version-source-dir (`php-N/`) and core-subtree-path (Zend|sapi).
  - id: phpt-test-file-basename
    desc: PHP phpt test file basename
    crit: notable
    for: [php]
    if:
      type: basename
      regex: '\.phpt$'
  - id: runtime-product-name
    desc: PHP runtime PE product identity
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: PHP
  - id: runtime-company
    desc: PHP Group PE runtime publisher identity
    for: [pe]
    if:
      type: value
      path: pe.version.company
      exact: The PHP Group
composite_rules:
  - id: runtime-shared-library
    desc: PHP embedded shared runtime library
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    any:
      - id: runtime-so-library
      - id: runtime-dylib-library
      - id: runtime-libphp-dylib
      - id: runtime-dll-library
  - id: runtime-library-cache-exception
    desc: PHP runtime cache exception
    crit: exception
    conf: 0.99
    for: [macho]
    any:
      - id: runtime-shared-library
      - id: runtime-libphp-dylib
  - id: source-tree
    desc: PHP source tree path
    crit: notable
    conf: 0.98
    for: [binaries, scripts, source, github-actions, jpeg, zip, tar, archive, zst, php, javascript]
    any:
      - id: source-archive
      - id: version-source-dir
      - id: core-subtree-path
      - id: phpt-test-file-basename
  - id: runtime-package
    desc: PHP runtime package path
    crit: notable
    conf: 0.98
    for: [binaries, scripts, source, php]
    any:
      - id: runtime-lib-path
      - id: runtime-include-path
      - id: runtime-binary
      - id: runtime-shared-library
      - id: well-known/lib/network/curl::runtime-library
      - id: pear-share-path
      - id: opcache-extension
  - id: runtime-binary-context
    desc: Official PHP runtime PE identity context
    crit: exception
    conf: 0.99
    for: [pe]
    all:
      - id: runtime-product-name
      - id: runtime-company
  - id: php-debug-runtime-binary
    desc: PHP debugger or CGI runtime binary context
    crit: exception
    conf: 0.98
    for: [elf]
    any:
      - id: runtime-binary
      - id: phpdbg-binary
      - id: runtime-shared-library
  - id: php-source-tracerpid-diagnostic-context
    desc: PHP source tree TracerPid diagnostic context
    crit: exception
    conf: 0.98
    for: [c, cpp]
    all:
      - id: version-source-dir
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
