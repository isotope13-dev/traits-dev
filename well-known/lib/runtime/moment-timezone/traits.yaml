# moment-timezone — IANA timezone data plugin for Moment.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: moment-timezone npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: moment-timezone

  - id: homepage
    desc: moment-timezone project homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: http://momentjs.com/timezone/

composite_rules:
  - id: moment-timezone-library
    desc: moment-timezone IANA timezone library
    all:
      - id: package-name
      - id: homepage
