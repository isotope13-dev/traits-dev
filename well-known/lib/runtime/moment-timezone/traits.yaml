# moment-timezone — IANA timezone data plugin for Moment.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: moment-timezone npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: moment-timezone

  - id: homepage
    desc: moment-timezone project homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: http://momentjs.com/timezone/

  - id: tz-version-api
    desc: moment-timezone version API comment
    for: [javascript, typescript]
    if:
      type: text
      substr: 'moment.tz.version'

  - id: vendored-path
    desc: vendored moment-timezone package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/moment-timezone/'

composite_rules:
  - id: moment-timezone-library
    desc: moment-timezone IANA timezone library
    any:
      - id: tz-version-api
      - id: vendored-path
      - id: package-name
