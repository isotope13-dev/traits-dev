# map-age-cleaner — expire Map entries by age.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: map-age-cleaner npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: map-age-cleaner
  - id: vendored-path
    desc: vendored map-age-cleaner package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/map-age-cleaner/'

composite_rules:
  - id: map-age-cleaner-library
    desc: map-age-cleaner cache helper
    any:
      - id: package-name
      - id: vendored-path
