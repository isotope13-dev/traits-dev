# isaacs/rimraf — recursive filesystem removal for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: windows-tmp-busy-comment
    desc: rimraf Windows temp EBUSY comment
    for: [javascript, typescript]
    if:
      type: text
      substr: 'rimraf(path).then(() => rimraf(dirname(path)))'

  - id: package-name
    desc: rimraf npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: rimraf

composite_rules:
  - id: rimraf-library
    desc: rimraf recursive delete library
    any:
      - id: windows-tmp-busy-comment
      - id: package-name
