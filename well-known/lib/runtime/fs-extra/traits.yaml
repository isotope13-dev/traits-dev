# jprichardson/node-fs-extra — extra fs methods.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: fs-extra npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: fs-extra

  - id: vendored-path
    desc: vendored fs-extra package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/fs-extra/'

composite_rules:
  - id: fs-extra-library
    desc: fs-extra filesystem helpers
    any:
      - id: package-name
      - id: vendored-path
