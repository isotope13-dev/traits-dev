# paulmillr/readdirp — recursive readdir.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: readdirp npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: readdirp

  - id: vendored-path
    desc: vendored readdirp package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/readdirp/'
