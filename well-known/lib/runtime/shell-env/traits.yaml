# sindresorhus/shell-env — read a login shell's environment.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: shell-env npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: shell-env

  - id: delimiter-marker
    desc: shell-env env dump delimiter
    for: [javascript]
    if:
      type: text
      substr: '_SHELL_ENV_DELIMITER_'

  - id: vendored-path
    desc: vendored shell-env package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/shell-env/'
