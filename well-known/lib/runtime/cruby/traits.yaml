# Official CRuby / MRI source and the RubyGems library shipped with it.
# Used as an unless: context so filesystem/process/env patterns that are
# routine inside the interpreter are not treated as attack signals.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, ruby, shell, github-actions]
  crit: notable
  conf: 0.96
  size_max: 600000000

traits:
  - id: include-ruby-ruby-h
    desc: Includes Ruby MRI ruby.h header
    for: [c, cpp]
    if:
      type: text
      substr: '#include "ruby/ruby.h"'

  - id: rb-w32-api-prefix
    desc: Ruby MRI Windows API rb_w32_ prefix
    for: [c, cpp]
    count_min: 5
    if:
      type: text
      substr: rb_w32_

  - id: github-archive-path
    desc: Ruby MRI GitHub archive source path
    if:
      type: path
      # github.com/ruby/ruby archives unpack as ruby-ruby_3_4/, ruby-ruby_4_0/, or ruby-master/
      regex: 'ruby-(ruby_[0-9_]+|master)([/\\-]|$)'

  - id: rubygems-lib-path
    desc: RubyGems lib tree path
    for: [ruby]
    if:
      type: path
      regex: 'lib[/\\]rubygems'

  - id: rubygems-test-path
    desc: RubyGems test tree path
    for: [ruby]
    if:
      type: path
      regex: 'test[/\\]rubygems'

  - id: stdlib-rubygems-path
    desc: Stdlib RubyGems tree path
    for: [ruby]
    if:
      type: path
      regex: 'stdlib[/\\]rubygems'

  - id: gen-github-release-tool
    desc: Ruby MRI GitHub release generator tool
    for: [ruby]
    if:
      type: basename
      exact: gen-github-release.rb

composite_rules:
  - id: mri-archive-rubygems-lib
    desc: RubyGems lib path in MRI source archive
    crit: notable
    conf: 0.97
    all:
      - id: github-archive-path
      - id: rubygems-lib-path

  - id: rubygems-stdlib-path
    desc: RubyGems path inside MRI or stdlib tree
    crit: notable
    conf: 0.97
    any:
      - id: mri-archive-rubygems-lib
      - id: rubygems-test-path
      - id: stdlib-rubygems-path

  - id: source-tree
    desc: Ruby MRI interpreter source tree
    crit: notable
    conf: 0.98
    any:
      - id: include-ruby-ruby-h
      - id: rb-w32-api-prefix
      - id: github-archive-path
      - id: rubygems-stdlib-path
      - id: gen-github-release-tool
