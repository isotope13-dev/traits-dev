# wait-on — wait for sockets/HTTP/files.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: wait-on npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: wait-on
  - id: vendored-path
    desc: vendored wait-on package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/wait-on/'

composite_rules:
  - id: wait-on-library
    desc: wait-on resource waiter
    any:
      - id: package-name
      - id: vendored-path
