defaults:
  crit: suspicious
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  - go
  - json
  size_max: 5000000
traits:
  - id: realm-eldritch-browser-repl-api
    desc: Realm Eldritch browser REPL WebAssembly API
    crit: notable
    conf: 0.98
    for: [wasm]
    if:
      type: value
      path: wasm.exports[*]
      regex: '^browserrepl_(complete|input|new|reset)$'

  - id: realm-eldritch-repl-state-api
    desc: Realm Eldritch REPL state WebAssembly API
    crit: notable
    conf: 0.98
    for: [wasm]
    if:
      type: value
      path: wasm.exports[*]
      regex: '^wasmrepl_(get_history|get_state|handle_key|handle_paste|load_history|new)$'


composite_rules:
  - id: realm-eldritch-browser-repl
    desc: Realm Eldritch browser REPL WebAssembly module
    crit: notable
    conf: 0.99
    for: [wasm]
    all:
      - id: well-known/lib/runtime/eldritch::realm-eldritch-browser-repl-api
      - id: well-known/lib/runtime/eldritch::realm-eldritch-repl-state-api
