defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable

traits:
  - id: cpython-windows-installer
    desc: CPython Windows installer filename
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bpython-[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]*)-(amd64|win32|arm64)\.exe\b'

  - id: cpython-root-install-target
    desc: Versioned root CPython install target
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bTargetDir\s*=\s*"?C:\\Python[0-9]{2,3}\b'

composite_rules:
  - id: unattended-cpython-runtime-install
    desc: Unattended CPython runtime installation
    conf: 0.94
    all:
      - id: cpython-windows-installer
      - id: micro-behaviors/process/create/installer::quiet-explicit-target-install
