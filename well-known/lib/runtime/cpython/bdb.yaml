# CPython's bdb module intentionally compiles caller-supplied statements and
# immediately executes the resulting code object so a debugger can trace them.
# Identify the module from independent source markers rather than trusting its
# basename or archive location alone.
defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: cpython-bdb-basename
    desc: CPython bdb module filename
    crit: component
    conf: 0.9
    if:
      type: basename
      exact: bdb.py

  - id: cpython-bdb-debugger-class
    desc: CPython Bdb debugger class
    crit: component
    conf: 0.94
    if:
      type: text
      substr: "class Bdb:"

  - id: cpython-bdb-run-docstring
    desc: CPython Bdb run method docstring
    crit: component
    conf: 0.96
    if:
      type: text
      substr: "Debug a statement executed via the exec() function."

composite_rules:
  - id: cpython-bdb-module
    desc: CPython bdb debugger module
    crit: notable
    conf: 0.98
    all:
      - id: cpython-bdb-basename
      - id: cpython-bdb-debugger-class
      - id: cpython-bdb-run-docstring
