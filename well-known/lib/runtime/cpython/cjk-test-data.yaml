# CPython ships codec round-trip fixtures in `Lib/test/cjkencodings/`: one file
# per legacy CJK encoding (`big5.txt`, `gb18030.txt`, `shift_jisx0213.txt`, ...)
# plus a `-utf8` counterpart for each. Held side by side they are the same text
# in fifteen incompatible encodings, which reads as high-entropy mixed-charset
# data until the directory is named.
#
# Fifteen basenames used to be enumerated across four traits split `-a` to `-d`
# to keep each regex short. The directory is the thing they were all reaching
# for, and it says it in sixteen characters instead of a hundred and thirty-nine.
defaults:
  platforms: [linux, macos, windows]
  for: [text]
  crit: notable
  conf: 0.95
traits:
  - id: cpython-cjk-codec-test-data
    desc: CPython CJK codec test data
    if:
      type: path
      regex: 'cjkencodings[\\/]'
