# NAPI-RS emits CommonJS loaders that replace the local `require` binding so
# createRequire(__filename) can resolve platform-specific native addons.  This
# is generated loader plumbing, not supply-chain function shadowing.
defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: napi-rs-generated-binding-loader
    desc: NAPI-RS generated native binding loader
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '@ts-nocheck[\s\S]{0,160}auto-generated by NAPI-RS[\s\S]{0,260}createRequire\(__filename\)'

  # Newer NAPI-RS templates (both the CJS `index.js` and the ESM
  # `bindings.js` form) emit the same skeleton: the generator banner, then
  # `let nativeBinding = null` / `const loadErrors = []`, then a
  # `requireNative()` that walks process.platform/process.arch and `require()`s
  # the matching prebuilt `.node` addon, with an `execSync('ldd --version')`
  # musl probe as the last-resort libc test. By shape that is a platform
  # branch plus child_process execution, so the generated identity has to be
  # matched directly. Nothing is fetched or written: every branch loads an
  # addon that already ships in the package.
  - id: napi-rs-generated-native-loader-skeleton
    desc: NAPI-RS generated native binding loader skeleton
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'auto-generated by NAPI-RS[\s\S]{0,400}let nativeBinding = null'

  # napi prepublish commonly minifies away the generator banner and spacing,
  # but this loader-only environment switch remains a stable NAPI-RS marker.
  - id: napi-rs-native-loader-version-check
    desc: NAPI-RS native binding version-check loader
    crit: notable
    conf: 0.99
    if:
      type: text
      word: NAPI_RS_ENFORCE_VERSION_CHECK

composite_rules:
  - id: napi-rs-require-reassignment-context
    desc: NAPI-RS generated loader require reassignment context
    crit: exception
    conf: 0.99
    all:
      - id: napi-rs-generated-binding-loader
      - id: micro-behaviors/os/module/load::node-require-binding-reassignment

  # Suppressor for platform-branched-dropper: the generated loader's
  # platform/arch branch over bundled `.node` addons is not payload delivery.
  - id: napi-rs-generated-loader-context
    desc: NAPI-RS generated native binding loader context
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::multi-platform-branch
    any:
      - id: napi-rs-generated-native-loader-skeleton
      - id: napi-rs-native-loader-version-check
