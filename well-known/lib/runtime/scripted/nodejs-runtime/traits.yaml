# The official Node.js macOS executable: a very large V8/OpenSSL/ICU build that
# carries generic LCG-style arithmetic in compiled code. Identity needs both
# the Node.js Foundation Apple team ID and Node's own embedder entry points, so
# a binary copying only one of them is not exempted.
defaults:
  platforms: [macos]
  for: [macho]
  size_min: 20000000
  conf: 0.98

traits:
  - id: nodejs-foundation-team-id
    desc: Mach-O signed by Node.js Foundation team
    crit: notable
    if:
      type: value
      path: macho.code_signature.team_id
      exact: HX7739G8FX

  # Current Windows builds (Node 26.x libnode.dll) keep the mangled symbol
  # InternalMakeCallback without the node:: qualifier, so the qualified
  # spelling alone missed the official runtime. Large Windows builds exceed
  # the text extractor's string cap (200000 strings); the official node.exe
  # (v26.13.1 win-x64) is not matched by type: text, so the byte-level raw
  # matcher is required here.
  - id: nodejs-embedder-entry-points
    desc: Node.js embedder callback entry points
    for: [macho, pe]
    platforms: [macos, windows]
    crit: notable
    if:
      type: raw
      section: any
      substr: InternalMakeCallback

composite_rules:
  - id: nodejs-official-macho-runtime
    desc: Official Node.js macOS runtime executable
    crit: exception
    all:
      - id: nodejs-foundation-team-id
      - id: nodejs-embedder-entry-points
