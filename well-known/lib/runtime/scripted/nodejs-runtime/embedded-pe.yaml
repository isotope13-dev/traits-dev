# Node.js embedded as a Windows shared library (libnode.dll) or executable.
# Node's embedder ships its builtin JavaScript sources as `node:internal/...`
# specifiers in read-only data and exposes the InternalMakeCallback embedder
# entry point. A PE carrying both is the Node runtime itself: its runtime
# debugger endpoints, MiniDumpWriteDump diagnostic reports, and loopback
# inspector port are expected, not a loader. Either leg alone is common in
# strings copied by other programs, so both are required.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 20000000
  conf: 0.98

traits:
  - id: nodejs-builtin-module-specifiers
    desc: Node.js builtin module specifiers embedded
    crit: notable
    if:
      type: text
      substr: 'node:internal/'

composite_rules:
  - id: nodejs-embedded-pe-runtime
    desc: Node.js embedded runtime library
    crit: exception
    all:
      - id: nodejs-builtin-module-specifiers
      - id: nodejs-embedder-entry-points
