# Vendor runtime loaders that execute ionCube- and SourceGuardian-encoded
# PHP. Each ships as a PHP extension (get_module export) and names its vendor
# in strings no client of the loader carries. Vendors distribute them as
# ioncube_loader_<os>_<ver>.dll/.so and ixed.<ver>[ts].<os>.
defaults:
  platforms: [windows, linux]
  for: [pe, elf]
  crit: notable
  conf: 0.95

traits:
  - id: ioncube-loader-vendor-string
    desc: ionCube Loader vendor identity string
    crit: component
    if:
      type: text
      substr: ionCube Loader

  - id: sourceguardian-loader-version-symbol
    desc: SourceGuardian sg_loader_version function name
    crit: component
    if:
      type: text
      exact: sg_loader_version

composite_rules:
  - id: ioncube-loader-extension
    desc: ionCube Loader PHP extension binary
    all:
      - id: metadata/binary/linking/addon-abi::php-extension-get-module-export
      - id: ioncube-loader-vendor-string

  - id: sourceguardian-loader-extension
    desc: SourceGuardian loader PHP extension binary
    all:
      - id: metadata/binary/linking/addon-abi::php-extension-get-module-export
      - id: sourceguardian-loader-version-symbol
