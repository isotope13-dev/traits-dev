defaults:
  platforms: [windows, unix]
  for: [pe]
  size_max: 67108864

traits:
  - id: ironpython-product-name
    desc: IronPython product name in PE version info
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^IronPython'

  - id: ironpython-assembly-title
    desc: IronPython assembly name in PE version info
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^IronPython(\..*)?\.dll$'

composite_rules:
  - id: ironpython-runtime-library
    desc: IronPython runtime library
    crit: notable
    conf: 0.99
    any:
      - id: ironpython-product-name
      - id: ironpython-assembly-title
