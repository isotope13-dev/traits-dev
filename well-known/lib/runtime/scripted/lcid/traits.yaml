# lcid — Windows LCID locale mapping.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: lcid npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: lcid
  - id: vendored-path
    desc: vendored lcid package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/lcid/'

composite_rules:
  - id: lcid-library
    desc: lcid locale ID mapping
    any:
      - id: package-name
      - id: vendored-path
