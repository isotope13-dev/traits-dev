# Pallets Click — vendored Python CLI toolkit.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: pallets-docs-url
    desc: Click Pallets documentation URL
    if:
      type: text
      substr: 'https://click.palletsprojects.com/'
  - id: vendored-path
    desc: vendored Click package path
    if:
      type: path
      regex: '_vendor/click/'

  - id: termui-impl-module-filename
    desc: Click _termui_impl.py module filename
    if:
      type: path
      basename: true
      exact: _termui_impl.py

  - id: editor-mtime-backdate
    desc: Click editor backdates file mtime
    if:
      type: text
      regex: 'getmtime\(name\)\s*-\s*2'

  - id: editor-require-save-option
    desc: Click editor require_save option
    if:
      type: text
      substr: require_save

composite_rules:
  - id: pallets-click-library
    desc: Pallets Click CLI toolkit
    any:
      - id: pallets-docs-url
      - id: vendored-path
