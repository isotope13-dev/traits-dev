# hapi Boom — HTTP-friendly error objects.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@hapi/boom npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@hapi/boom'
  - id: vendored-path
    desc: vendored @hapi/boom package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@hapi/boom/'

composite_rules:
  - id: hapi-boom-library
    desc: hapi Boom HTTP error helpers
    any:
      - id: package-name
      - id: vendored-path
