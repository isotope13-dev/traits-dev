# sindresorhus/default-shell — default user shell path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: default-shell npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: default-shell

  - id: vendored-path
    desc: vendored default-shell package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/default-shell/'
