# The official Dart SDK binary stamps a version banner in .rodata
# ("Dart SDK 1.12"). A statically linked SDK carries glibc string IFUNCs
# (memcpy, strlen) beside its own RSA routines; that pairing is the runtime,
# not an IFUNC resolver planted on RSA_public_decrypt.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  size_max: 50000000
traits:
  - id: dart-sdk-version-banner
    desc: Dart SDK version banner
    conf: 0.98
    size_min: 1000000
    if:
      type: text
      regex: 'Dart SDK \d+\.\d+'
      section: .rodata
