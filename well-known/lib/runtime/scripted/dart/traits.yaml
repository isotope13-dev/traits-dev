# The official Dart SDK binary stamps a version banner in .rodata
# ("Dart SDK 1.12"). A statically linked SDK carries glibc string IFUNCs
# (memcpy, strlen) beside its own RSA routines; that pairing is the runtime,
# not an IFUNC resolver planted on RSA_public_decrypt.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  size_max: 50000000
traits:
  - id: dart-sdk-version-banner
    desc: Dart SDK version banner
    conf: 0.98
    size_min: 1000000
    if:
      type: text
      regex: 'Dart SDK \d+\.\d+'
      section: .rodata
  # Path observation only: a `dart` directory component, e.g. inside the
  # Wolfi dart apk. It does not establish that a file is the Dart SDK.
  - id: dart-directory-path
    desc: Path has a dart directory component
    for: [alpine_apk, elf, javascript]
    conf: 0.5
    platforms: [linux]
    size_max: 400000000
    if:
      type: path
      regex: '(^|[\\/])dart([\\/]|$)'
