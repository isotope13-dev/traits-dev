# sindresorhus/is — type-checking helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@sindresorhus/is npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@sindresorhus/is'

  - id: vendored-path
    desc: vendored @sindresorhus/is package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@sindresorhus/is/'


composite_rules:
  - id: sindresorhus-is-library
    desc: sindresorhus/is type library
    any:
      - id: package-name
      - id: vendored-path
