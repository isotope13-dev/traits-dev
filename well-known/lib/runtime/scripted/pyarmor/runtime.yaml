# Identity does not suppress behavior findings in the protected application.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho, dll, dylib, so]
  size_max: 8388608
  crit: notable
traits:
  - id: native-runtime-marker
    desc: PyArmor native runtime marker
    conf: 0.99
    if:
      type: raw
      regex: 'pyarmor-vax-[0-9]{6}'
      section: data
