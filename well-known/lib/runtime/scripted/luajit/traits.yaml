# Identity of the LuaJIT runtime: its banner, module name and
# bytecode-preload symbol format. Every luajit.exe and
# lua51.dll carries these, and so does any program that embeds LuaJIT as a
# scripting engine. Renamed-interpreter and loader intent is judged by
# objectives/evasion/masquerade/wrapper and objectives/command-and-control/
# dropper/execution/loader, which reference these atoms.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  # The runtime is a few MB at most; hosts that embed it stay well under this.
  size_max: 50000000
traits:
- id: interpreter-module-name
  # MSVC builds name themselves in the export directory, merged into .rdata.
  desc: Binary embeds the luajit.exe module name
  conf: 0.95
  if:
    type: text
    exact: "luajit.exe"
    section: rdata

- id: version-banner
  desc: LuaJIT version banner string
  conf: 0.95
  if:
    type: text
    regex: 'LuaJIT \d+\.\d+\.\d+'
    section: rdata

- id: interpreter-filename
  desc: File is named as the LuaJIT interpreter
  conf: 0.95
  if:
    type: path
    basename: true
    regex: '^luajit'
    case_insensitive: true

- id: bytecode-preload-format
  desc: LuaJIT bytecode preload format (luaJIT_BC_)
  conf: 0.97
  if:
    type: text
    substr: 'luaJIT_BC_'
    section: rdata

- id: embedded-script-chunkname
  desc: Embedded Lua script chunk path (@../scripts/)
  conf: 0.92
  if:
    type: text
    regex: '@\.\./[^"\n]{1,80}/scripts/[a-z][a-z0-9_-]{0,32}\.lua'
    section: rdata

composite_rules:
- id: runtime-strings-cluster
  desc: LuaJIT preload format with runtime env names
  conf: 0.95
  all:
  - id: bytecode-preload-format
  - id: micro-behaviors/os/env/runtime::lua-configuration-env-name

- id: runtime-context
  desc: LuaJIT runtime context
  conf: 0.96
  all:
  - id: micro-behaviors/os/env/runtime::lua-configuration-env-name
  - id: micro-behaviors/process/interpreter/lua::embedded-lua-vm
  - id: runtime-strings-cluster
