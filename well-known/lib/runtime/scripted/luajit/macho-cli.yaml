defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  size_max: 50000000

traits:
  - id: macho-version-banner
    desc: LuaJIT version banner in Mach-O
    conf: 0.95
    if:
      type: text
      section: __cstring
      regex: 'LuaJIT \d+\.\d+\.\d+'
  - id: macho-bytecode-preload-format
    desc: LuaJIT bytecode preload format in Mach-O
    conf: 0.97
    if:
      type: text
      section: __cstring
      substr: 'luaJIT_BC_%s'
  - id: macho-cli-control-help
    desc: LuaJIT command-line control help
    conf: 0.97
    if:
      type: text
      section: __cstring
      substr: 'Perform LuaJIT control command.'

composite_rules:
  - id: macho-command-line-interpreter
    desc: Mach-O LuaJIT command-line interpreter strings
    conf: 0.98
    all:
      - id: macho-version-banner
      - id: macho-bytecode-preload-format
      - id: macho-cli-control-help
