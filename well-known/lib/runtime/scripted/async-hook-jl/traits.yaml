# async-hook-jl — inspect Node handle object lifetime.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: async-hook-jl npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: async-hook-jl

  - id: vendored-path
    desc: vendored async-hook-jl package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/async-hook-jl/'
