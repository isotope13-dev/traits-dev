defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: generated-module-class
    desc: JPHP generated-module JVM class name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: class.this_class
      regex: '^\$php_module_m[a-f0-9]{20,40}(_class[0-9]+|_closure[0-9]+)?$'
