# JPHP compiles PHP to JVM bytecode and packages the generated module classes
# in .phb wrappers inside a jar. Class-level facts (class.this_class names,
# import references) cover those frames once engine parsing reaches them; the
# observations here read the same evidence from stored archive bytes, so a
# packaged module is identified by every deployed build.
defaults:
  platforms: [windows, unix]
  for: [jar, zip]

traits:
  - id: jar-compiled-php-module-name
    desc: Archive stores a generated JPHP module name
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '\$php_module_m[0-9a-f]{16,}'

  - id: jar-php-static-invocation-binding
    desc: Archive stores JPHP static invocation binding
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: 'php/runtime/invoke/InvokeHelper[\x00-\xff]{0,48}callStatic'

  - id: jar-temporary-exe-path-constants
    desc: Adjacent temp dir and executable constants
    crit: notable
    conf: 0.85
    if:
      type: raw
      regex: 'java\.io\.tmpdir.{0,16}\.exe'

composite_rules:
  - id: jphp-temporary-executable-staging
    desc: Compiled PHP module builds temp executable path
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/lib/runtime/scripted/jphp::jar-compiled-php-module-name
      - id: well-known/lib/runtime/scripted/jphp::jar-temporary-exe-path-constants

  - id: jphp-temporary-executable-invocation
    desc: Compiled PHP module stages and runs temp executable
    crit: hostile
    conf: 0.94
    attack: T1059
    all:
      - id: well-known/lib/runtime/scripted/jphp::jar-compiled-php-module-name
      - id: well-known/lib/runtime/scripted/jphp::jar-temporary-exe-path-constants
      - id: well-known/lib/runtime/scripted/jphp::jar-php-static-invocation-binding
