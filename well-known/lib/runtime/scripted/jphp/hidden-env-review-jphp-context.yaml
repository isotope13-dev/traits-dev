defaults:
  platforms:
  - windows
  for:
  - pe
  - data
  - php
  - xml
composite_rules:
- id: jphp-opacity-zero-context
  desc: JPHP and zero opacity context
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/format/html::opacity-zero-attribute
  any:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-robot-script-component
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-macro-script-component
- id: jphp-process-url-tiny-ui-clues
  desc: JPHP process URL and tiny UI clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
  - id: metadata/lang/source/syntax/assignment/value::xml-preferred-height-five
  - id: metadata/lang/source/syntax/assignment/value::xml-preferred-width-five
- id: jphp-robot-macro-tiny-ui-clues
  desc: JPHP robot macro and tiny UI clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-robot-script-component
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-macro-script-component
  - id: metadata/lang/source/syntax/assignment/value::xml-preferred-height-five
  - id: well-known/lib/runtime/scripted/jphp::jphp-opacity-zero-context
- id: jphp-admin-tiny-ui-clues
  desc: JPHP admin and tiny UI clues
  crit: suspicious
  conf: 0.97
  scope: outer
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: metadata/build/manifest::admin-manifest
  - id: metadata/lang/source/syntax/assignment/value::xml-preferred-height-five
  - id: well-known/lib/runtime/scripted/jphp::jphp-opacity-zero-context
