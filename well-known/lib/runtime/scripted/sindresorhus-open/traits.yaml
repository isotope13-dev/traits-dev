# sindresorhus/open — cross-platform opener for URLs, files, and apps.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: local-xdg-open-path
    desc: Bundled xdg-open helper path join
    for: [javascript, typescript]
    if:
      type: text
      # open resolves its bundled xdg-open shim relative to __dirname (v7)
      # or os.tmpdir() (v8+). Rollup/esbuild bundles rename the receiver
      # (path$8, Zh, node_path) and drop the `localXdgOpenPath` const, so
      # match the join shape itself.
      regex: '\bjoin\((__dirname\w*|.{0,30}tmpdir\(\)),\s*[''"]xdg-open[''"]'
  - id: wsl-mountpoint-helper
    desc: sindresorhus/open WSL mount-point helper
    for: [javascript, typescript]
    if:
      type: text
      # Source spelled the helper `getWslDrivesMountPoint`; v7 renamed it
      # `wslToWindowsPath`. The minified bundle keeps the `/etc/wsl.conf`
      # read it performs.
      regex: 'getWslDrivesMountPoint|wslToWindowsPath|wsl\.conf'

  - id: package-repository
    desc: sindresorhus/open package repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: sindresorhus/open

  - id: windows-quotes-docs
    desc: sindresorhus/open Windows quotes caveat docs
    for: [javascript, typescript]
    if:
      type: text
      substr: 'sindresorhus/open#double-quotes-on-windows'

  - id: vendored-path
    desc: vendored sindresorhus/open package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/open/'

composite_rules:
  - id: sindresorhus-open-library
    desc: sindresorhus/open URL and file launcher
    needs: 2
    any:
      - id: local-xdg-open-path
      - id: wsl-mountpoint-helper
      - id: package-repository
      - id: windows-quotes-docs
      - id: vendored-path
