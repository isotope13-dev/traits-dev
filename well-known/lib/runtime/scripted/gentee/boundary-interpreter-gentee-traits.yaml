defaults:
  size_min: 1024
  size_max: 524288000
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: suspicious
  conf: 0.93
traits:
- id: gentee-launcher-decode-get
  desc: Gentee launcher get API
  if:
    type: text
    section: .rdata
    exact: launcher_get
- id: gentee-launcher-decode-lzge
  desc: Gentee launcher decode API
  if:
    type: text
    section: .rdata
    exact: lzge_decode
composite_rules:
- id: gentee-launcher-decode-apis
  desc: Gentee launcher decode API names
  all:
  - id: gentee-launcher-decode-get
  - id: gentee-launcher-decode-lzge