---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: gentee-runtime-api-context
  desc: Gentee runtime API and DLL references
  crit: notable
  conf: 0.95
  all:
  - id: well-known/lib/runtime/scripted/gentee::gentee-runtime-init
  - id: well-known/lib/runtime/scripted/gentee::gentee-runtime-load
  - id: well-known/lib/runtime/scripted/gentee::gentee-runtime-dll-name
  any:
  - id: metadata/binary/symbols/name/function::gentee-launcher-decode-get
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: micro-behaviors/process/sync/mutex::create-mutex
  needs: 3
