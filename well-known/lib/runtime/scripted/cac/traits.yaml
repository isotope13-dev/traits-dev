# egoist/cac — Command And Conquer CLI helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cac npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cac

  - id: vendored-path
    desc: vendored cac package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/cac/'
