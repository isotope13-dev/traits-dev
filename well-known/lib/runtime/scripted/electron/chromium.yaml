# Portable identity for compiled Chromium browser-engine binaries. Keep this
# independent of code-signing and bundle metadata: Linux builds do not carry
# either, and Windows/macOS embedders may sign the same CEF build themselves.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, dll, elf, macho]
  size_min: 10485760
  size_max: 1073741824
  crit: notable
  conf: 0.98

traits:
  - id: chrome-engine-binary-basename
    desc: Chrome engine binary basename
    if:
      type: basename
      regex: '(?i)^(Google Chrome Framework|chrome([.]dll)?)$'

  - id: cef-engine-binary-basename
    desc: CEF engine binary basename
    if:
      type: basename
      regex: '(?i)^(Chromium Embedded Framework|libcef[.](dll|so))$'

  - id: chromium-network-service-mojo
    desc: Chromium NetworkService Mojo interface
    if:
      type: text
      substr: network.mojom.NetworkService
      section: rdata

  - id: chromium-default-search-policy
    desc: Chromium default-search policy family
    if:
      type: text
      substr: DefaultSearchProviderAlternateURLs
      section: rdata

  - id: chromium-startup-urls-policy
    desc: Chromium startup URLs policy
    if:
      type: text
      substr: RestoreOnStartupURLs
      section: rdata

composite_rules:
  - id: chromium-engine-binary-basename
    desc: Chromium or CEF engine binary basename
    any:
      - id: chrome-engine-binary-basename
      - id: cef-engine-binary-basename

  - id: chromium-engine-marker-cluster
    desc: Compiled Chromium browser-engine marker cluster
    needs: 2
    any:
      - id: chromium-network-service-mojo
      - id: chromium-default-search-policy
      - id: chromium-startup-urls-policy

  - id: chromium-engine-binary-context
    desc: Compiled Chromium or CEF browser engine
    crit: exception
    conf: 0.99
    # Universal Mach-O slices are separate leaves beneath the fat wrapper;
    # pool the portable basename and engine markers at the input boundary.
    scope: outer
    all:
      - id: chromium-engine-binary-basename
      - id: chromium-engine-marker-cluster
