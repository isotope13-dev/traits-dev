# Benign-context suppressor for npm supply-chain rules evaluated over an
# Electron application bundle.
#
# An Electron app ships hundreds of npm packages inside one archive. Package
# rules declared `scope: archive` pool evidence across every member, so
# ingredients contributed by four unrelated dependencies combine into a single
# package-level verdict -- the failure mode those rules already guard against
# for Android APK and Alpine apk containers. An Electron bundle is the same
# kind of container: a shipped application, not a package published to a
# registry.
#
# Observed concretely: one 107 MB reader app pooled 1588 traits at its payload
# archive, producing hostile verdicts from https-get + fromCharCode +
# vm.runInContext + variable-require, and from a hollow-package manifest paired
# with the Karma test runner's detached browser launcher.
defaults:
  platforms: [unix, windows]
traits:
  - id: electron-app-asar-member-path
    desc: Electron app.asar member path
    crit: notable
    conf: 1.0
    for: [binaries, scripts, source, manifests, data, package.json]
    size_max: 1000000000
    if:
      type: path
      regex: '(?i)app[.]asar'
  - id: electron-app-asar-archive-member
    desc: Archive contains Electron asar member
    crit: notable
    conf: 0.98
    for: [tar, zip, 7z, rar]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)app\.asar(\.unpacked)?/'
  - id: electron-webpack-main-entrypoint
    desc: Electron webpack main entrypoint
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: main
      regex: '(?i)(^\./|^|/)\.webpack/main$'
  - id: electron-source-main-entrypoint
    desc: Electron source application main entrypoint
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: main
      regex: '(?i)^electron/(dist|build)/main\.js$'
  - id: electron-runtime-dependency
    desc: Manifest declares Electron runtime dependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: dependencies.electron
  - id: electron-development-runtime-dependency
    desc: Manifest declares Electron dev dependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: devDependencies.electron
  - id: electron-npm-package-name
    desc: Electron npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: electron
  - id: electron-prebuilt-repository-url
    desc: electron-prebuilt GitHub repository URL
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https?://github\.com/(electron-userland|electron|atom)/electron-prebuilt(\.git)?$'
  - id: electron-prebuilt-repository-string
    desc: electron-prebuilt GitHub repository string
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https?://github\.com/(electron-userland|electron|atom)/electron-prebuilt(\.git)?$'
  - id: apollo-client-devtools-extension-id
    desc: Apollo Client DevTools Chrome extension ID
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: jdkknkkbebbapilgoeccciglkfbmbnfm
  - id: redux-devtools-extension-id
    desc: Redux DevTools Chrome extension ID
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: lmhkpmbekcpmknklioeibfkpmmfibljd
  - id: electron-session-load-extension
    desc: Electron session loads a browser extension
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: session.defaultSession.loadExtension

composite_rules:
  - id: electron-known-debug-extension-loader
    desc: Electron loads known browser developer-tool extensions
    crit: notable
    conf: 0.99
    all:
      - id: apollo-client-devtools-extension-id
      - id: redux-devtools-extension-id
      - id: electron-session-load-extension

  - id: electron-source-symlink-archive-context
    desc: Electron source archive with a system-runtime symlink
    crit: exception
    conf: 0.995
    scope: outer
    for: [tar, package.json, javascript]
    all:
      - id: well-known/lib/runtime/scripted/electron::electron-development-runtime-dependency
      - id: micro-behaviors/process/interpreter/node::js-electron-main-require
      - id: micro-behaviors/ui/window/electron::electron-browserwindow-constructor

  # A desktop app can show a UAC prompt and keep the elevated helper's PID.
  # That launch path is not the npm preinstall script.
  - id: electron-consented-uac-helper
    desc: Electron app tracks its elevated helper
    crit: exception
    conf: 0.97
    scope: outer
    for: [javascript, typescript, tar, npm, zip]
    all:
      - id: micro-behaviors/ui/window/electron::electron-browserwindow-constructor
      - id: micro-behaviors/os/privilege/elevation::start-process-runas-passthru-pid

  - id: electron-app-bundle-exception
    desc: Electron application bundle context
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      - id: well-known/lib/runtime/scripted/electron::electron-app-runtime
      - id: micro-behaviors/fs/path/application/bundle::electron-asar-path
      - id: well-known/lib/runtime/scripted/electron::electron-webpack-main-entrypoint
      - id: well-known/lib/runtime/native-platform/electron-source-manifest/

  - id: electron-prebuilt-repository-identity
    desc: Official electron-prebuilt GitHub repository identity
    crit: notable
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json]
    any:
      - id: electron-prebuilt-repository-url
      - id: electron-prebuilt-repository-string

  # Starting in 1.3.1, the official Electron prebuilt installer dual-published
  # under both `electron` and `electron-prebuilt` from the canonical
  # electron-userland/electron-prebuilt repository before the README and
  # repository moved to `electron`. Require both the exact `electron` package
  # name and the `electron-prebuilt` repository so a renamed third-party clone
  # claiming that repository still fires.
  - id: official-electron-prebuilt-repository-pair
    desc: Official Electron package and electron-prebuilt repository pair
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar, package.json]
    all:
      - id: electron-npm-package-name
      - id: electron-prebuilt-repository-identity
