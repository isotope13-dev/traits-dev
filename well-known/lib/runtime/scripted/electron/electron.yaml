---
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: macos-framework
    desc: Electron macOS framework
    conf: 0.96
    platforms: [macos]
    for: [macho, dylib]
    size_min: 1000000
    # A universal build carries both the x86_64 and arm64 slices: Signal
    # Desktop 8.23.0 ships a 398 MB Electron Framework, which the previous
    # 300 MB ceiling put outside its own identity.
    size_max: 800000000
    if:
      type: path
      regex: 'Electron Framework\.framework[\\/]'
