defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 2147483647

traits:
  # Runtime identity does not establish that its application is benign.
  - id: electron-runtime-js2c-marker
    desc: Electron embedded JavaScript runtime marker
    if:
      type: text
      regex: 'electron/js2c/|process\._linkedBinding\("electron_'
      # Any mapped section retains the runtime marker surface across linker
      # layouts while excluding signature/overlay bytes from identity.
      section: any
