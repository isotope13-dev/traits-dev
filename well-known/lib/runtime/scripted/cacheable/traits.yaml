# @cacheable/utils and related packages (jaredwray/cacheable). Runtime uses a
# reserved tag prefix and depends on hashery + keyv.
defaults:
  platforms: [unix, windows]
  for: [javascript, text, markdown, package.json, json, npm]
  crit: baseline
  conf: 0.99

traits:
  - id: cacheable-tags-reserved-prefix
    desc: Cacheable tags reserved key prefix
    crit: notable
    conf: 0.99
    for: [javascript, text, markdown, package.json, json]
    if:
      type: text
      substr: "--cacheable--tags--"

  - id: cacheable-jared-wray-license
    desc: Jared Wray cacheable ecosystem license header
    crit: notable
    conf: 0.99
    for: [text, markdown]
    if:
      type: text
      regex: 'MIT License.{0,20}Jared Wray'

  - id: cacheable-hashery-keyv-runtime
    desc: Cacheable utils runtime imports hashery and keyv
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'require\("hashery"\)[\s\S]{0,200}require\("keyv"\)'

  - id: cacheable-utils-package-name
    desc: Legitimate @cacheable/utils package name
    crit: notable
    conf: 0.99
    for: [package.json, json]
    if:
      type: value
      path: name
      exact: "@cacheable/utils"

  - id: cacheable-upstream-repository
    desc: cacheable upstream monorepo repository
    crit: notable
    conf: 0.99
    for: [javascript, text, markdown, package.json, json]
    if:
      type: text
      substr: github.com/jaredwray/cacheable

  - id: cache-manager-upstream-repository-pair
    desc: cache-manager uses official cacheable repo
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '(?s)"name"\s*:\s*"cache-manager".{0,1000}github\.com/jaredwray/cacheable'

composite_rules:
  - id: cacheable-utils-library
    desc: Legitimate @cacheable/utils library package
    crit: notable
    conf: 0.99
    scope: archive
    for: [npm, json, package.json]
    all:
      - id: cacheable-utils-package-name
    any:
      - id: cacheable-upstream-repository
      - id: cacheable-tags-reserved-prefix
