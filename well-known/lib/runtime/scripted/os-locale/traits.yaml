# os-locale — get the system locale.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: os-locale npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: os-locale
  - id: vendored-path
    desc: vendored os-locale package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/os-locale/'

composite_rules:
  - id: os-locale-library
    desc: os-locale system locale
    any:
      - id: package-name
      - id: vendored-path
