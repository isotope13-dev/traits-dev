# clr-loader — pythonnet companion for loading .NET CoreCLR from Python.
#
# Ships a maintainer script (coreclr_errors.py) that regenerates HRESULT
# tables from corerror.xml via open(__file__); not a bytecode payload.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.99
  size_max: 52428800

traits:
  - id: clr-loader-wheel-package-name
    desc: clr-loader Python wheel package name
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: clr_loader

  - id: clr-loader-github-repo
    desc: pythonnet clr-loader GitHub repository
    for: [python]
    if:
      type: text
      substr: github.com/pythonnet/clr-loader

  - id: corerror-autogen-marker
    desc: corerror.xml autogeneration marker
    for: [python]
    if:
      type: text
      substr: "# == Autogenerated from corerror.xml"

composite_rules:
  - id: clr-loader-pythonnet-runtime
    desc: pythonnet clr-loader .NET runtime bridge
    needs: 2
    any:
      - id: clr-loader-wheel-package-name
      - id: clr-loader-github-repo
      - id: corerror-autogen-marker
