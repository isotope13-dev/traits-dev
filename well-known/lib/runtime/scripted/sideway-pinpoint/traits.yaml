# sideway/pinpoint — error location helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@sideway/pinpoint npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@sideway/pinpoint'
  - id: vendored-path
    desc: vendored @sideway/pinpoint package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@sideway/pinpoint/'

composite_rules:
  - id: sideway-pinpoint-library
    desc: sideway pinpoint location
    any:
      - id: package-name
      - id: vendored-path
