# sindresorhus/p-cancelable — cancelable promises.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: p-cancelable npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: p-cancelable

  - id: vendored-path
    desc: vendored p-cancelable package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/p-cancelable/'


composite_rules:
  - id: p-cancelable-library
    desc: p-cancelable Promise wrapper
    any:
      - id: package-name
      - id: vendored-path
