# async-mutex — mutex for async JavaScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: async-mutex npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: async-mutex

  - id: vendored-path
    desc: vendored async-mutex package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/async-mutex/'


composite_rules:
  - id: async-mutex-library
    desc: async-mutex lock library
    any:
      - id: package-name
      - id: vendored-path
