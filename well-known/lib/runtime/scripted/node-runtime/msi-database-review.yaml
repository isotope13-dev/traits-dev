defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.85
traits:
  - id: embedded-node-runtime-raw
    desc: NodeRuntime debugger-status text in MSI
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'NodeRuntime\.(waitingFor(Debugger|Disconnect)|notifyWhenWaitingForDisconnect)'
