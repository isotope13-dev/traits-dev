defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576
  size_max: 209715200
composite_rules:
  # This describes the image as found. It does not assert which bytes changed
  # or infer an embedded attacker payload from a generic runtime modification.
  - id: gui-runtime-signed-image-mismatch
    desc: GUI Node runtime has an invalid image digest
    crit: suspicious
    conf: 0.99
    all:
      - id: runtime-product-name
      - id: metadata/binary/header/characteristics::pe-windows-gui-subsystem
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
