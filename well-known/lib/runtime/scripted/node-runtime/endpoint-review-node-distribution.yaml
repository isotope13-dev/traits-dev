# Distribution URL reference only: no download or execution is implied.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, markdown]
traits:
  - id: node-versioned-distribution-url
    size_min: 1
    desc: URL path contains a node-v version prefix
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?://[^"''\s]{1,160}/node-v[0-9]'
