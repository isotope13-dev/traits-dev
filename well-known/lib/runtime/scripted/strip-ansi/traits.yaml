# chalk/strip-ansi — strip ANSI escape codes from a string.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: strip-ansi npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: strip-ansi

  - id: vendored-path
    desc: vendored strip-ansi package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/strip-ansi/'
