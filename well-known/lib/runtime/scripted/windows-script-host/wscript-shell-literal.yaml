defaults:
  crit: notable
  for: [scripts, go, pe, html, xml]
  platforms:
    - windows
traits:
  - id: wscript-shell-literal
    for: [scripts, source, pe, html, xml, asp]
    desc: References the WScript.Shell COM object
    conf: 0.8
    if:
      type: text
      regex: WScript\.Shell(\.1)?
      case_insensitive: true
