defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.7
composite_rules:
  - id: wscript-engine-markers
    desc: WScript ProgID or executable name reference
    any:
      - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell
      - id: well-known/app/system/microsoft/core-utilities::wscript-exe
      - id: well-known/app/system/microsoft/core-utilities::cscript-exe
