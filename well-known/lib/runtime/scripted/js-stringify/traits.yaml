# js-stringify — JS-literal stringifier.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: js-stringify npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: js-stringify

  - id: vendored-path
    desc: vendored js-stringify package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/js-stringify/'
