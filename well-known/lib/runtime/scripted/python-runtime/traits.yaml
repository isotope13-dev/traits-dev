defaults:
  size_max: 20000000
  platforms: [linux, macos, windows]
traits:
  # CPython's own Windows build tree. `$(PySourcePath)` is a property defined
  # and consumed only by the MSBuild files under PCbuild/, PC/layout/ and
  # Tools/msi/ -- `pyproject.props`, `regen.targets`, `python.props`. Those
  # files declare inline build tasks and package restore, which is what
  # `msbuild-inline-task` and `msbuild-property-task-with-precompile-target` look for.
  #
  # Content rather than path on purpose: the CPython samples in this corpus
  # arrive both as a `Python-3.12.3/` release tarball and as a
  # `python-cpython-v3.14.3` git export, so no root name covers both.
  - id: cpython-msbuild-source-property
    desc: CPython Windows build property
    crit: notable
    conf: 0.97
    for: [xml, data]
    if:
      type: text
      substr: '$(PySourcePath)'

  - id: python-native-binding-version-mismatch-diagnostic
    desc: Python binding mismatch diagnostic
    crit: notable
    conf: 0.9
    for: [macho, dylib]
    if:
      type: text
      substr: 'Python version mismatch: module was compiled for Python'
      section: '__TEXT,__cstring'

  # CPython 2.x's import machinery requires every extension module to export
  # a C function named `init<modulename>` (the Python 3 equivalent is
  # `PyInit_<modulename>`, already covered by python-pyinit-export). Paired
  # with the .pyd extension this identifies the file as a CPython C extension
  # rather than a hand-written PE, regardless of what capability the module
  # itself wraps (sockets, ctypes, ssl, ...).
