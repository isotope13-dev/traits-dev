# ljharb/gopd — Object.getOwnPropertyDescriptor helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: gopd npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: gopd

  - id: vendored-path
    desc: vendored gopd package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/gopd/'
