# isaacs/lru-cache — least-recently-used cache for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: lru-cache npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: lru-cache

  - id: vendored-path
    desc: vendored lru-cache npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/lru-cache/'

  - id: metrics-channel
    desc: lru-cache diagnostics metrics channel
    if:
      type: text
      substr: "channel('lru-cache:metrics')"

composite_rules:
  - id: lru-cache-library
    desc: isaacs lru-cache library
    needs: 2
    any:
      - id: package-name
      - id: vendored-path
      - id: metrics-channel
