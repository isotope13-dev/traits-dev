defaults:
  platforms: [windows, unix]
  for: [php, c, cpp, shell]
  crit: baseline
traits:
- id: upstream-php-source-tree-path
  desc: Upstream PHP source tree path
  crit: notable
  conf: 0.98
  if:
    type: path
    regex: '(^|[\\/])php-[0-9]+\.[0-9]+\.[0-9]+([\\/]|$)'
- id: upstream-php-source-archive-path
  desc: Upstream PHP source archive path
  crit: notable
  for: [tar]
  conf: 0.98
  if:
    type: path
    regex: '(^|[\\/])php\.tar\.xz$'
- id: htmlpurifier-library
  desc: HTMLPurifier library source
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "HTMLPurifier_"
- id: pel-exif-library
  desc: PEL PHP Exif library
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "PEL: PHP Exif Library"
- id: pope-framework-library
  desc: POPE framework helper class definitions
  crit: notable
  conf: 0.96
  for: [php]
  if:
    type: text
    # Popen in embedded Python is not POPE. Require the framework's actual
    # helper/cache class declarations, including the file that implements eval.
    regex: '\bclass\s+(PopeHelpers|C_Pope_Cache)\b'
composite_rules:
- id: upstream-php-source
  desc: Upstream PHP source distribution
  crit: notable
  any:
  - id: upstream-php-source-tree-path
  - id: upstream-php-source-archive-path
