defaults:
  platforms: [unix, windows]
  for: [c]

traits:
  - id: generated-unicode-keyword-table
    desc: Perl generated Unicode keyword table
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'built by regen/mk_invlists.pl from mph.pl'

  - id: perl-xs-dll
    desc: Perl XS extension installed under auto/
    crit: notable
    conf: 0.95
    for: [pe]
    size_max: 4194304
    if:
      type: path
      regex: '(?i)[\\/]auto[\\/].{1,80}\.xs\.dll$'
