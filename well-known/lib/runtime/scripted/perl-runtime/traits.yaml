defaults:
  platforms: [unix, windows]

traits:
  - id: perl-win32-copyfile-extension
    desc: Perl Win32 CopyFile extension
    crit: notable
    conf: 0.98
    for: [pe]
    size_max: 200000
    if:
      type: text
      substr: 'usage: Win32::CopyFile'
      section: .rdata

  - id: generated-unicode-keyword-table
    desc: Perl generated Unicode keyword table
    crit: notable
    conf: 0.99
    for: [c]
    if:
      type: text
      substr: 'built by regen/mk_invlists.pl from mph.pl'

  - id: perl-xs-dll
    desc: Perl XS extension installed under auto/
    crit: notable
    conf: 0.95
    for: [pe]
    size_max: 4194304
    if:
      type: path
      regex: '(?i)[\\/]auto[\\/].{1,80}\.xs\.dll$'

  # Perl core Storable module strings. A PE that embeds the perl interpreter
  # (PAR/pp-style packed executables) carries these even with no auto/ XS path,
  # and it is the runtime whose GetTickCount/QueryPerformanceCounter use seeds
  # rand(). Used as a runtime-identity leg, not as a verdict on its own.
  - id: perl-core-storable-pe-text
    desc: Embedded Perl core Storable module text
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: text
      substr: Storable::recursion_limit

  # Perl XS source (cpan/Win32/Win32.xs and its siblings) binds host, user and
  # network APIs for the Perl standard library; the module declaration plus
  # the XSUB header identify it as a binding, not an implant.
  - id: perl-xs-source-module
    desc: Perl XS source declares a MODULE package
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      regex: '(?m)^MODULE\s*=\s*[A-Za-z0-9:_]{1,60}\s+PACKAGE\s*='

  - id: perl-xsub-header-include
    desc: Includes the Perl XSUB header
    crit: notable
    conf: 0.95
    for: [c]
    if:
      type: text
      substr: '#include "XSUB.h"'

composite_rules:
  - id: perl-xs-source
    desc: Perl XS extension source file
    crit: notable
    conf: 0.95
    for: [c]
    all:
      - id: perl-xs-source-module
      - id: perl-xsub-header-include

  - id: perl-xs-extension
    desc: Perl XS dynamic extension library
    crit: notable
    conf: 0.98
    for: [pe, dll, elf, macho]
    any:
      - id: perl-xs-dll
      - id: metadata/lang/compiler/native::perl-xs-extension-export
