# SolidRT is a declarative native desktop GUI runtime by WellAware Tech for
# SolidJS applications. Its binaries expose SDL3 clipboard, named-pipe IPC,
# and child-process spawning as standard desktop GUI runtime capabilities.
defaults:
  crit: notable
  conf: 0.98

traits:
  - id: solidrt-pe-debug-pdb
    desc: SolidRT Windows PE debug PDB identity
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    if:
      type: value
      path: pe.debug.pdb.basename
      regex: '^solidrt(_go)?\.pdb$'

  - id: solidrt-build-source-path
    desc: SolidRT source build repository path
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    if:
      type: text
      section: .rdata
      substr: '\solidrt\solidrt\'

  - id: solidrt-version-banner
    desc: SolidRT runtime version banner string
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    if:
      type: text
      section: .rdata
      substr: '[sol] SolidRT version '

  - id: solidrt-package-name
    desc: SolidRT scoped npm package name
    for: [package.json]
    platforms: [unix, windows]
    if:
      type: value
      path: name
      regex: '^@solidrt/'

composite_rules:
  - id: solidrt-windows-runtime-binary
    desc: SolidRT Windows native runtime binary
    crit: exception
    conf: 0.99
    for: [pe]
    platforms: [windows]
    size_min: 1000000
    any:
      - id: solidrt-pe-debug-pdb
      - id: solidrt-build-source-path
      - id: solidrt-version-banner
