# fancycompleter — pdbpp colorful Python REPL tab completion.
defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: fancycompleter-wheel-name
    desc: fancycompleter PyPI wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: fancycompleter

  - id: fancycompleter-module-path
    desc: fancycompleter Python module path
    for: [python, whl, zip]
    if:
      type: path
      regex: '(^|/)fancycompleter\.py$'

  - id: fancycompleter-product-marker
    desc: fancycompleter package name marker
    for: [python, pkginfo, markdown, text]
    if:
      type: text
      regex: '(?im)^Name:\s*fancycompleter\s*$|import fancycompleter\b'

composite_rules:
  - id: fancycompleter-package
    desc: pdbpp fancycompleter REPL completion utility
    crit: exception
    conf: 0.97
    any:
      - id: fancycompleter-wheel-name
      - id: fancycompleter-module-path
      - id: fancycompleter-product-marker
