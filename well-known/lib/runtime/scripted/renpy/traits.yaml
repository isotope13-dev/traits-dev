# Ren'Py's package initializer snapshots its own modules with pickle and
# uses the caller frame only to extend that package's __path__.
defaults:
  platforms: [unix, windows]
  size_min: 256
  size_max: 2000000
  crit: notable
  conf: 0.96

traits:
  - id: engine-package-init
    desc: Ren'Py engine package initializer
    for: [python]
    if:
      type: path
      regex: 'renpy[/\\]__init__\.py'
