# NativeScript runtime for iOS and macOS.
# Embeds native framework binaries and typings for Apple platform APIs.
defaults:
  platforms: [macos]
  crit: notable
  conf: 0.98

traits:
  - id: nativescript-runtime-framework-path
    desc: NativeScript framework path segment
    for: [macho, binaries]
    size_min: 1024
    size_max: 52428800
    if:
      type: path
      substr: NativeScript.framework

  - id: nativescript-runtime-manifest-name
    desc: NativeScript runtime package.json name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@nativescript/(macos|ios)-node-api$'

  - id: nativescript-runtime-package-name
    desc: NativeScript runtime npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@nativescript/(macos|ios)-node-api$'

composite_rules:
  - id: nativescript-runtime
    desc: NativeScript runtime identity
    crit: notable
    conf: 0.99
    any:
      - id: nativescript-runtime-framework-path
      - id: nativescript-runtime-manifest-name
      - id: nativescript-runtime-package-name
