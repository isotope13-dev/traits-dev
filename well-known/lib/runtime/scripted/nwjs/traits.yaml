# NW.js embeds Chromium and Node.js in a desktop application runtime. Its
# Windows browser-process executable therefore imports Chromium's sandbox and
# process-broker surface, including CreateRemoteThread, ReadProcessMemory,
# WriteProcessMemory, VirtualAllocEx, and named-pipe APIs. Those imports are
# legitimate framework machinery and can otherwise combine into injection
# findings when the runtime executable is renamed by an application bundle.
#
# Keep this exception tied to the coherent upstream PE identity. A basename is
# deliberately not required because packaged NW.js applications routinely
# rename nw.exe, and version metadata alone is not used without an NW/Chromium
# runtime-specific PDB or import marker.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 500000
  size_max: 500000000

traits:
  - id: product-name
    desc: NW.js runtime product identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: nwjs
      case_insensitive: true

  - id: company-name
    desc: NW.js Community publisher identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: The NW.js Community
      case_insensitive: true

  - id: original-filename
    desc: NW.js runtime original filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: nw.exe
      case_insensitive: true

  - id: internal-name
    desc: NW.js runtime internal executable name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: nw_exe
      case_insensitive: true

  - id: runtime-pdb
    desc: NW.js Windows runtime PDB identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: nw.exe.pdb
      case_insensitive: true

  - id: chrome-elf-install-details-import
    desc: NW.js Chromium ELF install-details import
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: GetInstallDetailsPayload

composite_rules:
  - id: windows-runtime-context
    desc: Recognized NW.js Windows application runtime
    crit: exception
    conf: 0.999
    all:
      - id: product-name
      - id: company-name
      - id: original-filename
      - id: internal-name
    any:
      - id: runtime-pdb
      - id: chrome-elf-install-details-import
