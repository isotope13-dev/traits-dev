# A `bun build --compile` application embeds one whole npm dependency
# graph after the host runtime. Tool names inside it (PuTTY PPK format
# helpers, 7-Zip strings, CPUID vendor text) are bundled-library output,
# not claims about the executable's identity.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: bun-single-file-app-bundle
    desc: Bun single-file application bundle, library-borne tool names
    crit: exception
    conf: 0.96
    all:
      - id: bun-standalone-graph-trailer
      - id: bun-pe-company
