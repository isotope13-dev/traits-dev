defaults:
  platforms: [windows, unix]
traits:
- id: bun-release-zip-templated-asset-url
  desc: Bun release URL with templated asset
  crit: notable
  conf: 0.9
  for: [javascript]
  if:
    type: text
    regex: 'github\.com/oven-sh/bun/releases/download/bun-v.{0,40}/\$\{?asset\}?\.zip'
# Host-free so it survives a URL split into a host prefix and an f-string
# or concatenated asset path, as Python .pth bootstraps do.
- id: bun-release-download-path
  desc: Bun release archive download path
  crit: notable
  conf: 0.92
  for: [javascript, typescript, python]
  if:
    type: text
    regex: '/bun/releases/download/bun-v[0-9]+\.[0-9]+\.[0-9]+/bun-'
- id: globalthis-bun-path-resolver
  desc: globalThis BunPath-named function
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: text
    regex: 'globalThis\.[A-Za-z_$]\w*BunPath\s*=\s*function\b'
