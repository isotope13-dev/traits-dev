# othiym23 continuation-local-storage — CLS for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: continuation-local-storage npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: continuation-local-storage

  - id: vendored-path
    desc: vendored continuation-local-storage path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/continuation-local-storage/'
