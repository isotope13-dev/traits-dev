defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 4096
  size_max: 50000000

composite_rules:
  - id: python-core-native-component
    desc: PSF CPython runtime or extension ABI
    all:
      - id: metadata/binary/provenance/version-info::python-core-product-field
      - id: metadata/binary/provenance/version-info::python-core-publisher-field
    any:
      - id: cpython-py-initialize-export
      - id: metadata/lang/compiler/native::python-pyinit-export
