# CPython zoneinfo walks TZPATH and set.remove's the posix/right keys.
# Those name records are not a directory walk that deletes files.
defaults:
  platforms: [unix, windows]
  size_min: 256
  size_max: 2000000
  crit: notable
  conf: 0.97

traits:
  - id: zoneinfo-tzpath-module
    desc: CPython zoneinfo path module
    for: [pyc, python]
    if:
      type: path
      regex: 'zoneinfo[/\\]_tzpath'
