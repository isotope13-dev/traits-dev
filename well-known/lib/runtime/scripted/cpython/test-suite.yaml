# CPython's regression suite (Lib/test) imports its private test.support
# package. Its modules read their own source, compile and exec snippets to
# test the interpreter, so loader-shaped composites describe the tests.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.95
  size_max: 2097152

traits:
  - id: cpython-test-support-import
    desc: Imports CPython regression test.support
    if:
      type: text
      regex: '(?m)^\s*from test(\.support| import support)\b'
