# CPython's asyncio and _pyrepl entry points load PYTHONSTARTUP with
# tokenize.open, compile, and exec. That is the REPL, not a dropper.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  conf: 0.95
traits:
  - id: cpython-repl-startup-path
    desc: CPython REPL startup module
    if:
      type: path
      regex: 'python3\.\d+/(asyncio|_pyrepl)'
