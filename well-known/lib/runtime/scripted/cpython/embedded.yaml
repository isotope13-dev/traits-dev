# Embedded CPython interpreter markers: C-API symbol strings present in any
# native binary that embeds the CPython runtime (Py_Initialize, PyEval_, the
# frozen importlib bootstrap, etc.). Neutral — appears in PyInstaller/py2exe
# output and any legitimately embedded interpreter; composites in other tiers
# reference these to require an embedded interpreter as one leg.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  size_min: 512
  size_max: 500000000
  crit: notable
traits:
  - id: cpython-runtime-basename
    desc: CPython runtime or interpreter basename
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: basename
      regex: '^(libpython[0-9.]+\.so(\.[0-9.]+)*|python(3(\.[0-9]+)?)?)$'

  - id: cpython-runtime-dll
    crit: notable
    desc: CPython runtime DLL
    for: [pe]
    if:
      type: basename
      regex: '^python3[0-9]*\.dll$'
  # The macOS counterpart of the ELF/PE basenames above, which had no Mach-O
  # form. Every delocate-repaired Python wheel that vendors the interpreter
  # ships it as `.dylibs/libpython3.X.dylib`, so without this the taxonomy
  # could not recognise a bundled CPython on macOS at all.
  - id: cpython-runtime-dylib
    crit: notable
    desc: CPython runtime dylib basename
    conf: 0.99
    for: [macho, dylib]
    platforms: [macos]
    if:
      type: basename
      regex: '^libpython[0-9]+(\.[0-9]+)*\.dylib$'
  # `type: export` is format-neutral, so this covers the Mach-O dylib form of
  # the runtime as well as the ELF shared object. Do not add a section: filter
  # here -- the sibling string traits pin `.text`, which is why they silently
  # miss on Mach-O, where constants live in __TEXT.__cstring.
  - id: cpython-py-initialize-export
    desc: CPython interpreter initialization export
    crit: notable
    conf: 0.99
    for: [elf, macho, dylib]
    if:
      type: export
      exact: Py_Initialize
  - id: cpython-py-initialize
    desc: Py_Initialize embedded-interpreter symbol
    if:
      type: text
      substr: Py_Initialize
      section: .text
    unless:
      - id: micro-behaviors/fs/temp/pyinstaller/
  - id: cpython-py-initializeex
    desc: Py_InitializeEx embedded-interpreter symbol
    if:
      type: text
      substr: Py_InitializeEx
      section: .text
  - id: cpython-pyrun-simplestring
    desc: PyRun_SimpleString embedded-interpreter symbol
    if:
      type: text
      substr: PyRun_SimpleString
      section: .text
    unless:
      - id: micro-behaviors/fs/temp/pyinstaller/
  - id: cpython-pyeval
    desc: PyEval_ embedded-interpreter symbol family
    if:
      type: text
      substr: PyEval_
      section: .text
    unless:
      - id: micro-behaviors/fs/temp/pyinstaller/
  - id: cpython-py-setprogramname
    desc: Py_SetProgramName embedded-interpreter symbol
    if:
      type: text
      substr: Py_SetProgramName
      section: .text
  - id: cpython-py-setpythonhome
    desc: Py_SetPythonHome embedded-interpreter symbol
    if:
      type: text
      substr: Py_SetPythonHome
      section: .text
  - id: cpython-importlib
    desc: importlib string in embedded interpreter
    if:
      type: text
      substr: importlib
      section: .text
    unless:
      - id: micro-behaviors/fs/temp/pyinstaller/
  - id: cpython-frozen-importlib
    desc: _frozen_importlib bootstrap string
    if:
      type: text
      substr: _frozen_importlib
      section: .text

composite_rules:
  # Both legs required: the basename alone would let a dropper masquerade as a
  # vendored interpreter by renaming itself, while an exported `Py_Initialize`
  # means the file really does provide the CPython C-API to its loader.
  - id: cpython-macos-runtime-library
    desc: Vendored CPython runtime dylib identity
    crit: notable
    conf: 0.99
    for: [macho, dylib]
    platforms: [macos]
    all:
      - id: cpython-runtime-dylib
      - id: cpython-py-initialize-export

  - id: cpython-interpreter-binary
    desc: CPython interpreter executable identity
    crit: notable
    conf: 0.99
    all:
      - id: cpython-runtime-basename
      - id: cpython-py-initialize-export
