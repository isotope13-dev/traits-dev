# npm normalize-package-data helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: normalize-package-data npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: normalize-package-data

  - id: vendored-path
    desc: vendored normalize-package-data package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/normalize-package-data/'

  - id: repositories-warning
    desc: normalize-package-data repositories warning
    if:
      type: text
      substr: "'repositories' (plural) Not supported. Please pick one as the 'repository' field"


composite_rules:
  - id: normalize-package-data-library
    desc: normalize-package-data library
    any:
      - id: package-name
      - id: vendored-path
      - id: repositories-warning
