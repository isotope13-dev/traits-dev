defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: notable
  conf: 0.98
  size_min: 512
  size_max: 100000000

traits:
  - id: lua-version-banner-macho
    desc: Lua interpreter version banner in Mach-O
    for: [macho]
    platforms: [macos]
    if:
      type: text
      regex: '(\$Lua: )?Lua 5\.[0-9](\.[0-9]+)? Copyright \(C\) 1994-20[0-9]{2} Lua\.org'
      section: '__TEXT,__const'

  - id: lua-version-banner-elf
    desc: Lua interpreter version banner in ELF
    for: [elf]
    platforms: [linux]
    if:
      type: text
      regex: '(\$Lua: )?Lua 5\.[0-9](\.[0-9]+)? Copyright \(C\) 1994-20[0-9]{2} Lua\.org'
      section: .rodata

  - id: lua-version-banner-pe
    desc: Lua interpreter version banner in PE
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: '(\$Lua: )?Lua 5\.[0-9](\.[0-9]+)? Copyright \(C\) 1994-20[0-9]{2} Lua\.org'
      section: .rdata

  - id: lua-pcall-export
    desc: Lua lua_pcall export
    if:
      type: export
      exact: lua_pcall

  - id: lua-newstate-export
    desc: Lua lua_newstate or luaL_newstate export
    if:
      type: export
      regex: '^lua(L)?_newstate$'

  - id: lua-openlibs-export
    desc: Lua luaL_openlibs export
    if:
      type: export
      exact: luaL_openlibs

composite_rules:
  - id: lua-embedded-runtime
    desc: Embedded Lua scripting language runtime
    any:
      - id: lua-version-banner-macho
      - id: lua-version-banner-elf
      - id: lua-version-banner-pe
      - id: lua-pcall-export
      - id: lua-newstate-export
      - id: lua-openlibs-export
    needs: 2
