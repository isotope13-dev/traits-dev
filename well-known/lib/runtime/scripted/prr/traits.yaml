# Domenic Denicola prr — define enumerable properties.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: prr npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: prr

  - id: vendored-path
    desc: vendored prr package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/prr/'
