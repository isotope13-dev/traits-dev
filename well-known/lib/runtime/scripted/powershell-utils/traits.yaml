# powershell-utils is a small helper used by sindresorhus/open on Windows.
# It encodes a Start command so the default browser can be launched without
# shell-quoting user paths. The helper is a process-launch primitive, but its
# presence alone does not show that a package uses PowerShell as a payload sink.
defaults:
  platforms:
  - windows
  for:
  - javascript
  - typescript
  conf: 0.98
traits:
- id: powershell-utils-module-path
  desc: powershell-utils package module path
  crit: notable
  if:
    type: path
    regex: node_modules/powershell-utils/index\.js$
- id: powershell-utils-encoded-command-prefix
  desc: powershell-utils encoded-command prefix
  crit: notable
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((assignment_expression
        left: (member_expression object: (identifier) @owner property: (property_identifier) @property)
        right: (array
          (string (string_fragment) @policy)
          . (string (string_fragment) @value)
          . (string (string_fragment) @encoded)))
      (#eq? @owner "executePowerShell")
      (#eq? @property "argumentsPrefix")
      (#eq? @policy "-ExecutionPolicy")
      (#eq? @value "Bypass")
      (#eq? @encoded "-EncodedCommand"))
- id: powershell-utils-utf16-base64-encoder
  desc: powershell-utils UTF-16LE Base64 encoder
  crit: notable
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((assignment_expression
        left: (member_expression object: (identifier) @owner property: (property_identifier) @property)
        right: (arrow_function
          [parameter: (identifier) @input
           parameters: (formal_parameters . (identifier) @input .)]
          body: (call_expression
            function: (member_expression
              object: (call_expression
                function: (member_expression object: (identifier) @buffer property: (property_identifier) @from)
                arguments: (arguments . (identifier) @source . (string (string_fragment) @charset) .))
              property: (property_identifier) @to_string)
            arguments: (arguments . (string (string_fragment) @encoding) .))))
      (#eq? @owner "executePowerShell")
      (#eq? @property "encodeCommand")
      (#eq? @buffer "Buffer")
      (#eq? @from "from")
      (#eq? @to_string "toString")
      (#eq? @charset "utf16le")
      (#eq? @encoding "base64")
      (#eq? @input @source))
- id: powershell-utils-execfile-launch
  desc: powershell-utils encoded execFile launch
  crit: notable
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((statement_block
        (lexical_declaration
          (variable_declarator name: (identifier) @encoded
            value: (call_expression function: (member_expression
              object: (identifier) @encoder_owner property: (property_identifier) @encoder_method))))
        . (return_statement
          (call_expression function: (identifier) @exec
            arguments: (arguments
              (_)
              . (array . (spread_element
                (member_expression object: (identifier) @prefix_owner property: (property_identifier) @prefix))
                . (identifier) @used .)))))
      (#eq? @encoder_owner "executePowerShell")
      (#eq? @encoder_method "encodeCommand")
      (#eq? @exec "execFile")
      (#eq? @prefix_owner "executePowerShell")
      (#eq? @prefix "argumentsPrefix")
      (#eq? @encoded @used))
composite_rules:
- id: powershell-utils-encoded-command-launcher
  desc: powershell-utils encoded PowerShell launcher library
  crit: exception
  conf: 0.99
  all:
  - id: powershell-utils-module-path
  - id: powershell-utils-encoded-command-prefix
  - id: powershell-utils-utf16-base64-encoder
  - id: powershell-utils-execfile-launch
