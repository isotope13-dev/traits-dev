# Existing source-path context is retained for the credential-list consumers.
# Manifest-name and adapter-mapping observations now have metadata homes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
traits:
  - id: keyv-library-source-tree
    desc: Keyv library source-tree member
    if:
      type: path
      regex: '(?i)keyv[\\/]src[\\/]'
