# @cdm-logger/* packages (CDMBase LLC) publish from the cdm-logger monorepo.
# The scoped name does not fold to the repository slug, which otherwise reads
# as a clone-and-rename manifest mismatch.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Official @cdm-logger scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@cdm-logger/'

  - id: scoped-npm-package-identity
    desc: Official @cdm-logger npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@cdm-logger/'

  - id: github-repository-url
    desc: CDM logger monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]cdmbase/cdm-logger'

  - id: github-npm-repository-url
    desc: CDM logger monorepo npm repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com[:/]cdmbase/cdm-logger'

composite_rules:
  - id: official-scope-repository-pair
    desc: Official @cdm-logger package repository pairing
    crit: exception
    for: [package.json]
    all:
      - id: scoped-package-identity
      - id: github-repository-url
  - id: official-npm-scope-repository-pair
    desc: Official @cdm-logger npm repository pairing
    crit: exception
    for: [npm]
    all:
      - id: scoped-npm-package-identity
      - id: github-npm-repository-url
