defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - typescript
  - npm
  crit: notable
  conf: 0.99
traits:
- id: package-name
  desc: Stacks desktop npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@stacksjs/desktop'
- id: desktop-build-package-name
  desc: Stacks desktop build npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@stacksjs/desktop-build'
- id: auto-launch-api-marker
  desc: Stacks desktop auto-launch API marker
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: setAutoLaunchLinux
composite_rules:
- id: desktop-build-package-context
  desc: Recognized Stacks desktop build package
  crit: exception
  conf: 0.99
  scope: archive
  all:
  - id: desktop-build-package-name
  - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-monorepo-repository
