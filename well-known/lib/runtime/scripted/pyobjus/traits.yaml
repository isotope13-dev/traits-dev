# pyobjus ships a generated catalog of Objective-C protocol names, including
# Apple's FIFinderSync host protocol. The file does not register an extension.
defaults:
  platforms: [unix, windows]
  size_min: 256
  size_max: 2000000
  crit: notable
  conf: 0.97

traits:
  - id: protocol-catalog-path
    desc: pyobjus Objective-C protocol catalog
    for: [pyc, python, binaries]
    if:
      type: path
      regex: 'pyobjus[/\\]protocols'
