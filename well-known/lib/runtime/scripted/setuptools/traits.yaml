# Official setuptools / pkg_resources wheel layout (PyPA).
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, zip, whl]
  crit: notable
  conf: 0.99

traits:
  - id: pkginfo-name-setuptools
    desc: PyPI distribution name setuptools
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: setuptools

  - id: distutils-precedence-pth-basename
    desc: setuptools distutils-precedence.pth hook
    if:
      type: path
      substr: 'distutils-precedence.pth'

  - id: setuptools-gui-launcher-path
    desc: setuptools Windows GUI launcher path
    if:
      type: path
      regex: 'setuptools[\\/]gui'

composite_rules:
  - id: setuptools-official-wheel-context
    desc: Official setuptools wheel distribution
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: pkginfo-name-setuptools
      - id: distutils-precedence-pth-basename
