# sindresorhus/supports-color — detect color terminal support.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: supports-color npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: supports-color

  - id: vendored-path
    desc: vendored supports-color package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/supports-color/'
