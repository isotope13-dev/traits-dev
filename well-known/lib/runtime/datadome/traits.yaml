# DataDome — client-side bot detection and anti-fraud JavaScript tag.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  size_max: 5000000

traits:
  - id: vendor-header-comment
    desc: DataDome vendor script header comment
    crit: notable
    if:
      type: text
      regex: 'DataDome is a cyberfraud solution.{0,120}datadome\.co'

  - id: runtime-global
    desc: DataDomeJsTag runtime global
    crit: notable
    if:
      type: text
      substr: DataDomeJsTag

composite_rules:
  - id: datadome-client-tag
    desc: DataDome bot detection client script
    any:
      - id: vendor-header-comment
      - id: runtime-global
