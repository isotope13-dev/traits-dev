defaults:
  platforms: [linux, macos, windows]
  for: [binaries, javascript, typescript, batch, archives, zip]
  crit: notable
  conf: 0.96
  size_max: 600000000
traits:
  - id: source-tree
    desc: Node.js source tree path
    for: [source, scripts, javascript, typescript, c, cpp, rust, python, perl, makefile, json, package.json, pdf, zip, archives]
    if:
      type: path
      regex: 'node-v[0-9][^\\/]*[\\/]'
  - id: windows-distribution-archive
    desc: Node.js Windows distribution archive
    for: [archive, zip, 7z]
    if:
      type: basename
      regex: '(?i)node-v[0-9][^-]*-win-(x64|x86|arm64)\.(zip|7z)$'
  - id: windows-runtime-binary
    desc: Node.js Windows runtime binary
    for: [pe]
    size_min: 1048576
    size_max: 209715200
    if:
      type: basename
      exact: node.exe
  - id: node-so-library
    desc: Node.js Linux shared runtime library
    for: [elf]
    if:
      type: basename
      regex: '(?i)^libnode\.so(\.[0-9]+)?$'
  - id: node-dylib-library
    desc: Node.js macOS shared runtime library
    for: [macho]
    if:
      type: basename
      regex: '(?i)^libnode(\.[0-9]+)?\.dylib$'
  - id: node-dll-library
    desc: Node.js Windows shared runtime library
    for: [pe]
    if:
      type: basename
      exact: libnode.dll
      case_insensitive: true
  - id: runtime-pdb-identity
    desc: Node.js runtime PDB identity
    for: [pe]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: node.pdb
  - id: runtime-original-filename
    desc: Node.js runtime original filename
    for: [pe]
    if:
      type: value
      path: pe.version.original_filename
      exact: node.exe
  - id: runtime-product-name
    desc: Node.js runtime product identity
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: Node.js
  - id: bundled-npm-source
    desc: Bundled npm source path
    for: [javascript, markdown, batch]
    size_max: 2097152
    if:
      type: path
      regex: 'node_modules[\\/]npm[\\/]'
  - id: install-tools-batch
    desc: Node.js Windows install_tools helper
    for: [batch]
    size_max: 65536
    if:
      type: basename
      exact: install_tools.bat
composite_rules:
  - id: node-shared-library
    desc: Node.js embedded shared runtime library
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    any:
      - id: node-so-library
      - id: node-dylib-library
      - id: node-dll-library
  # Packaged Node/V8 executables are often renamed by application bundlers.
  # The runtime PDB identity and V8 build markers remain stronger evidence than
  # a basename alone.
  - id: bundled-node-v8-runtime
    desc: Bundled Node.js runtime with V8 build markers
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: runtime-pdb-identity
      - id: well-known/lib/runtime/v8::v8-runtime-multi-marker
  - id: signed-node-v8-runtime
    desc: Authenticode-verified bundled Node.js runtime
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: bundled-node-v8-runtime
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  - id: embedded-js-runtime-safe-context
    desc: Embedded Node V8 or Electron runtime context
    crit: exception
    conf: 0.99
    for: [elf, macho, pe]
    any:
      - id: node-shared-library
      - id: well-known/lib/runtime/v8::nodejs-runtime
      - id: well-known/lib/runtime/electron::electron-app-runtime
  - id: windows-runtime-identity
    desc: Node.js Windows runtime identity
    crit: notable
    conf: 0.99
    for: [pe]
    any:
      - id: windows-runtime-binary
      - id: runtime-pdb-identity
      - id: runtime-version-identity
  - id: runtime-version-identity
    desc: Node.js runtime version-resource identity
    crit: notable
    conf: 0.99
    for: [pe]
    all:
      - id: runtime-original-filename
      - id: runtime-product-name
