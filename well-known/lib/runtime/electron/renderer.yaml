# Identity markers embedded in Electron's renderer bootstrap bundles.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: sandboxed-renderer-error-banner
    desc: Electron sandboxed renderer error banner
    if:
      type: literal
      exact: Electron sandboxed_renderer.bundle.js script failed to run
