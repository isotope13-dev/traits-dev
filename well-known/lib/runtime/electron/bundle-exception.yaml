# Benign-context suppressor for npm supply-chain rules evaluated over an
# Electron application bundle.
#
# An Electron app ships hundreds of npm packages inside one archive. Package
# rules declared `scope: archive` pool evidence across every member, so
# ingredients contributed by four unrelated dependencies combine into a single
# package-level verdict -- the failure mode those rules already guard against
# for Android APK and Alpine apk containers. An Electron bundle is the same
# kind of container: a shipped application, not a package published to a
# registry.
#
# Observed concretely: one 107 MB reader app pooled 1588 traits at its payload
# archive, producing hostile verdicts from https-get + fromCharCode +
# vm.runInContext + variable-require, and from a hollow-package manifest paired
# with the Karma test runner's detached browser launcher.
defaults:
  platforms: [unix, windows]
traits:
  - id: electron-app-asar-member-path
    desc: Electron app.asar member path
    crit: notable
    conf: 1.0
    for: [binaries, scripts, source, manifests, data, package.json, archives]
    size_max: 1000000000
    if:
      type: path
      regex: '(?i)app[.]asar'
  - id: electron-webpack-main-entrypoint
    desc: Electron webpack main entrypoint
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: main
      regex: '(?i)(^\./|^|/)\.webpack/main$'
  - id: electron-source-main-entrypoint
    desc: Electron source application main entrypoint
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: main
      regex: '(?i)^electron/(dist|build)/main\.js$'
  - id: electron-runtime-dependency
    desc: Manifest declares Electron runtime dependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: dependencies.electron
  - id: electron-development-runtime-dependency
    desc: Manifest declares Electron dev dependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: devDependencies.electron

composite_rules:
  - id: electron-source-symlink-archive-context
    desc: Electron source archive with a system-runtime symlink
    crit: exception
    conf: 0.995
    scope: outer
    for: [tar]
    all:
      - id: well-known/lib/runtime/electron::electron-development-runtime-dependency
      - id: micro-behaviors/process/interpreter/node::js-electron-main-require
      - id: micro-behaviors/ui/window/manage/electron::electron-browserwindow-constructor

  - id: electron-app-bundle-exception
    desc: Electron application bundle context
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
      - id: well-known/lib/runtime/electron::electron-app-runtime
      - id: micro-behaviors/fs/path/application/bundle::electron-asar-path
      - id: well-known/lib/runtime/electron::electron-webpack-main-entrypoint
      - id: well-known/lib/runtime/electron-source-manifest/
