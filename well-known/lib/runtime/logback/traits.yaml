# Logback — Java logging backend (ch.qos.logback), often configured via
# logback.xml and JoranConfigurator.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, xml, text, clojure, class, java_class]
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 8000000

traits:
  - id: config-basename
    desc: Logback XML configuration basename
    conf: 0.95
    if:
      type: path
      basename: true
      exact: logback.xml

  - id: package-string
    desc: Logback package string
    conf: 0.96
    if:
      type: text
      # Require a class/package suffix so Maven coords such as
      # ch.qos.logback/logback-classic in a Leiningen :dependencies
      # vector are not treated as a bundled Logback runtime.
      regex: 'ch\.qos\.logback\.[A-Za-z]'

  - id: joran-configurator
    desc: Logback JoranConfigurator class
    for: [clojure, text, class, java_class]
    conf: 0.98
    if:
      type: text
      substr: JoranConfigurator
