# @ionic/utils-object — Ionic CLI object helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Ionic utils-object package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ionic/utils-object'

  - id: vendored-path
    desc: Ionic utils-object package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@ionic/utils-object/'

  - id: case-insensitive-object
    desc: Ionic case-insensitive object factory
    if:
      type: text
      substr: 'function createCaseInsensitiveObject()'

composite_rules:
  - id: ionic-utils-object-library
    desc: Ionic utils-object helper library
    needs: 2
    any:
      - id: package-name
      - id: vendored-path
      - id: case-insensitive-object
