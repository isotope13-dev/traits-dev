# memorystore — express-session memory store.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: memorystore npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: memorystore

  - id: vendored-path
    desc: vendored memorystore package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/memorystore/'


composite_rules:
  - id: memorystore-library
    desc: memorystore express session store
    any:
      - id: package-name
      - id: vendored-path
