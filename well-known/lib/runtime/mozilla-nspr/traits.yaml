defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.95
  size_min: 512
  size_max: 52428800

traits:
  - id: nspr-unix-library
    desc: NSPR Unix shared library basename
    crit: notable
    conf: 0.99
    for: [elf, so]
    platforms: [unix]
    if:
      type: basename
      regex: '^libnspr4\.so(\.[0-9.]+)?$'

  - id: nspr-library-reference
    desc: NSPR library reference in C source
    crit: notable
    conf: 0.8
    for: [c]
    platforms: [unix]
    if:
      type: text
      substr: libnspr4.so

  - id: nspr-library-dependency
    desc: ELF binary depends on NSPR
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [unix]
    if:
      type: value
      path: elf.needed
      regex: '^libnspr4\.so(\.[0-9.]+)?$'

  - id: nspr-product-versioninfo
    desc: "NSPR ProductName VERSIONINFO"
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: Netscape Portable Runtime

  - id: nspr-original-filename-versioninfo
    desc: NSPR libnspr4 original filename version info
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.original_filename
      exact: libnspr4.dll
  - id: nspr-windows-library-basename
    desc: Mozilla NSPR Windows runtime library
    crit: notable
    conf: 0.99
    for: [dll]
    if:
      type: basename
      exact: libnspr4.dll
      case_insensitive: true

  - id: mozilla-foundation-company-versioninfo
    desc: Mozilla Foundation CompanyName version info
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: Mozilla Foundation

  - id: nspr-pr-abort-export
    desc: NSPR PR_Abort export
    crit: component
    conf: 0.95
    if:
      type: symbol
      exact: PR_Abort

  - id: nspr-monitor-export
    desc: NSPR monitor export
    crit: component
    conf: 0.92
    if:
      type: symbol
      exact: PR_GetMonitorEntryCount

composite_rules:
  - id: nspr-library
    desc: Mozilla Netscape Portable Runtime library
    crit: baseline
    conf: 0.99
    all:
      - id: nspr-product-versioninfo
      - id: nspr-original-filename-versioninfo
    any:
      - id: mozilla-foundation-company-versioninfo
      - id: nspr-pr-abort-export
      - id: nspr-monitor-export
