defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105

traits:
  - id: use-m-unpkg-fetch-eval-bootstrap
    desc: Evaluated fetch targets use-m on unpkg
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: eval[\s\S]{0,32}fetch[\s\S]{0,8}https://unpkg\.com/use-m/
  - id: use-m-unpkg-fetch-response-eval-bootstrap
    desc: unpkg use-m fetch then eval response
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: fetch\s*\(\s*[''"]https://unpkg\.com/use-m/.{0,32}[''"]\s*\)[\s\S]{0,200}eval\s*\(
  - id: use-m-jsdelivr-fetch-eval-bootstrap
    desc: Evaluated fetch targets use-m on jsDelivr
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: eval[\s\S]{0,32}fetch[\s\S]{0,8}https://cdn\.jsdelivr\.net/npm/use-m/

composite_rules:
  - id: use-m-published-cdn-bootstrap
    desc: Published use-m CDN loader bootstrap
    crit: exception
    any:
      - id: well-known/lib/runtime/use-m::use-m-unpkg-fetch-eval-bootstrap
      - id: well-known/lib/runtime/use-m::use-m-unpkg-fetch-response-eval-bootstrap
      - id: well-known/lib/runtime/use-m::use-m-jsdelivr-fetch-eval-bootstrap
