# ReactiveX rxjs — Observable streams for JS.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: rxjs npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: rxjs
  - id: vendored-path
    desc: vendored rxjs package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/rxjs/'

composite_rules:
  - id: rxjs-library
    desc: rxjs Reactive Extensions library
    any:
      - id: package-name
      - id: vendored-path
