# terkelg/prompts — lightweight interactive CLI prompt library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: prompts npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: prompts

  - id: repository
    desc: prompts source repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: terkelg/prompts

  - id: sisteransi-cursor
    desc: prompts sisteransi cursor/beep import
    for: [javascript, typescript]
    if:
      type: text
      substr: "require('sisteransi')"

  - id: vendored-path
    desc: vendored prompts npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/prompts/'

composite_rules:
  - id: terkelg-prompts-library
    desc: terkelg/prompts CLI prompt library
    needs: 2
    any:
      - id: package-name
      - id: repository
      - id: sisteransi-cursor
      - id: vendored-path
