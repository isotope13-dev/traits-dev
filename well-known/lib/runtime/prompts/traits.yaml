# terkelg/prompts — lightweight interactive CLI prompt library.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: prompts npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: prompts

  - id: repository
    desc: prompts source repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: terkelg/prompts

composite_rules:
  - id: terkelg-prompts-library
    desc: terkelg/prompts CLI prompt library
    all:
      - id: package-name
      - id: repository
