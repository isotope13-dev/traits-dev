# libseat — safe Rust bindings to libseat (PolyMeilex/libseat-rs).
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, tar]
  crit: notable
  conf: 0.98

traits:
  - id: libseat-crate-name
    desc: libseat crates.io package name
    for: [crate]
    if:
      type: value
      path: crate.name
      exact: libseat

  - id: libseat-upstream-repository-crate
    desc: libseat crate registry repository field
    for: [crate]
    if:
      type: value
      path: crate.repository
      regex: '(?i)github\.com/polymeilex/libseat-rs'

  - id: libseat-safe-bindings-description
    desc: libseat safe bindings crate description
    for: [crate]
    if:
      type: value
      path: crate.description
      regex: '(?i)libseat'

composite_rules:
  - id: libseat-library-context
    desc: libseat safe libseat bindings crate
    crit: exception
    conf: 0.99
    scope: archive
    for: [crate, tar]
    all:
      - id: libseat-crate-name
    any:
      - id: libseat-upstream-repository-crate
      - id: libseat-safe-bindings-description
