# getos — detect Linux distribution.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: getos npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: getos
  - id: vendored-path
    desc: vendored getos package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/getos/'

composite_rules:
  - id: getos-library
    desc: getos Linux distro detector
    any:
      - id: package-name
      - id: vendored-path
