# cls-hooked — continuation-local storage via async hooks.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cls-hooked npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cls-hooked

  - id: vendored-path
    desc: vendored cls-hooked package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cls-hooked/'
