defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: package-name
    desc: Official core-js package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      exact: core-js

  - id: repository-url
    desc: Official core-js repository URL
    crit: notable
    conf: 0.99
    if:
      type: value
      path: repository.url
      exact: git+https://github.com/zloirock/core-js.git

composite_rules:
  - id: package-identity
    desc: Official core-js package identity
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: repository-url
