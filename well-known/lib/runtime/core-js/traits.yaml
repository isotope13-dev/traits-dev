defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  # zloirock publishes four packages from the one repository -- `core-js`
  # itself plus the `-pure`, `-bundle` and `-compat` builds -- and they all
  # ship the same banner postinstall. Matching only the bare name left the
  # three siblings outside every core-js exception. The repository leg below
  # is what actually anchors the identity, so accepting the family here does
  # not loosen it: an impostor still has to claim zloirock/core-js.
  - id: package-name
    desc: Official core-js package family name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^core-js(-pure|-bundle|-compat)?$'

  - id: repository-url
    desc: Official core-js repository URL
    crit: notable
    conf: 0.99
    if:
      type: value
      # core-js 3.x publishes `git+https://…`; the 2.x line (still widely
      # vendored, and the line that carries the `postinstall` banner script)
      # publishes the same URL without the `git+` prefix.
      path: repository.url
      regex: '^(git\+)?https://github\.com/zloirock/core-js\.git$'

composite_rules:
  - id: package-identity
    desc: Official core-js package identity
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: repository-url
