# uruntime — Universal RunImage/AppImage runtime. It mounts or extracts an
# embedded filesystem and can execute the contained application from a memfd.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
  size_min: 250000
  size_max: 500000000

traits:
  - id: runtime-banner
    desc: uruntime AppImage runtime banner
    if:
      type: text
      substr: Universal RunImage and AppImage runtime
      section: rodata

  - id: source-repository
    desc: uruntime source repository URL
    if:
      type: text
      substr: github.com/VHSgunzo/uruntime
      section: rodata

composite_rules:
  - id: appimage-fileless-context
    desc: uruntime memfd AppImage bootstrap
    crit: exception
    conf: 0.99
    all:
      - id: runtime-banner
      - id: source-repository
