# sideway/joi — object schema validation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: joi npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: joi
  - id: vendored-path
    desc: vendored joi package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/joi/'

composite_rules:
  - id: joi-library
    desc: joi schema validator
    any:
      - id: package-name
      - id: vendored-path
