# Clojure on the JVM. AOT class files look "obfuscated" (gensym method
# names, few live functions, many clojure.lang imports) unless the runtime
# is identified. `loading__6789__auto__` is the compiler's hardcoded
# load-form gensym, not a random identifier.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip, clojure]
  crit: notable
  conf: 0.96
  size_min: 64
  size_max: 8000000

traits:
  - id: rt-class-ref
    desc: Clojure RT runtime class reference
    for: [class, java_class]
    conf: 0.97
    if:
      type: value
      path: class.class_refs[*]
      exact: clojure/lang/RT

  - id: loading-gensym
    desc: Clojure AOT loading-form gensym
    for: [class, java_class]
    conf: 0.99
    if:
      type: text
      substr: loading__6789__auto__

  - id: lang-package-path
    desc: Clojure lang package path
    conf: 0.95
    if:
      type: path
      regex: '(?i)clojure/lang/'

  - id: main-class
    desc: Clojure main-class JAR entrypoint
    for: [jar, zip]
    conf: 0.97
    if:
      type: value
      path: jar.manifest.main_class
      exact: clojure.main
