# js-sdsl — JavaScript standard data structure library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: js-sdsl npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: js-sdsl

  - id: vendored-path
    desc: vendored js-sdsl package path
    for: [scripts, manifests, data, source, text]
    if:
      type: path
      regex: 'node_modules/js-sdsl/'


composite_rules:
  - id: js-sdsl-library
    desc: js-sdsl JavaScript data structures
    any:
      - id: package-name
      - id: vendored-path
