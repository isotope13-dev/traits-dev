# azjezz/psl — PHP Standard Library (Psl).
defaults:
  platforms: [unix, windows]
  for: [php, zip, archives, json, text]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: composer-package-name
    desc: azjezz/psl Composer package name
    for: [json, text]
    if:
      type: text
      regex: '(?m)"name"\s*:\s*"azjezz/psl"'

  - id: psl-namespace
    desc: Psl PHP Standard Library namespace
    for: [php]
    if:
      type: text
      regex: 'namespace\s+Psl\\'

composite_rules:
  - id: php-standard-library-package
    desc: azjezz/psl PHP Standard Library package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: composer-package-name
    any:
      - id: psl-namespace
