# isaacs/read — read user input from stdin.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: read npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: read

  - id: vendored-path
    desc: vendored read package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/read/'


composite_rules:
  - id: read-prompt-library
    desc: isaacs read CLI prompt
    any:
      - id: package-name
      - id: vendored-path
