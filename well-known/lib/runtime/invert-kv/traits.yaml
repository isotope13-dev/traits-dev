# invert-kv — invert object keys and values.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: invert-kv npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: invert-kv
  - id: vendored-path
    desc: vendored invert-kv package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/invert-kv/'

composite_rules:
  - id: invert-kv-library
    desc: invert-kv object helper
    any:
      - id: package-name
      - id: vendored-path
