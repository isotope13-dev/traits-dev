# sindresorhus/p-timeout — timeout a promise.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: p-timeout npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: p-timeout

  - id: timeout-error-class
    desc: p-timeout TimeoutError class name
    for: [javascript, typescript]
    if:
      type: text
      substr: 'export class TimeoutError extends Error'

  - id: vendored-path
    desc: vendored p-timeout package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/p-timeout/'

composite_rules:
  - id: p-timeout-library
    desc: sindresorhus p-timeout library
    any:
      - id: package-name
      - id: timeout-error-class
      - id: vendored-path
