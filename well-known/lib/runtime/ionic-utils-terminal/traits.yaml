# @ionic/utils-terminal — Ionic CLI terminal/CI detection helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: debug-namespace
    desc: Ionic utils-terminal debug namespace
    for: [javascript, typescript]
    if:
      type: text
      substr: 'ionic:utils-terminal:info'

  - id: package-name
    desc: Ionic utils-terminal package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ionic/utils-terminal'

composite_rules:
  - id: ionic-utils-terminal-library
    desc: Ionic utils-terminal helper library
    any:
      - id: debug-namespace
      - id: package-name
