# @swc/helpers — SWC compiler runtime helpers. Dual CJS/ESM builds ship one
# anonymous package.json per helper that points two levels up into cjs/esm.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 4096

traits:
  - id: cjs-helper-main
    desc: SWC helpers CJS subpath main
    if:
      type: value
      path: main
      regex: '^\.\./\.\./cjs/_[a-z0-9_]{1,60}\.cjs$'

  - id: esm-helper-module
    desc: SWC helpers ESM subpath module
    if:
      type: value
      path: module
      regex: '^\.\./\.\./esm/_[a-z0-9_]{1,60}\.js$'

composite_rules:
  - id: subpath-helper-shim
    desc: SWC helpers dual-build subpath shim
    all:
      - id: cjs-helper-main
      - id: esm-helper-module
