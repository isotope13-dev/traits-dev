# rvagg/through2 — Node.js Transform stream wrapper.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: through2 npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: through2

  - id: repository
    desc: through2 source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: rvagg/through2

composite_rules:
  - id: through2-library
    desc: through2 Transform stream wrapper
    any:
      - id: package-name
      - id: repository
