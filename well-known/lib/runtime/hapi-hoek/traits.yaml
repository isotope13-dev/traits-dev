# hapi Hoek — utilities for hapi.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@hapi/hoek npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@hapi/hoek'
  - id: vendored-path
    desc: vendored @hapi/hoek package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@hapi/hoek/'

composite_rules:
  - id: hapi-hoek-library
    desc: hapi Hoek utility library
    any:
      - id: package-name
      - id: vendored-path
