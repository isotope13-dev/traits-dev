# component-type — JS type-of helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: component-type npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: component-type
  - id: vendored-path
    desc: vendored component-type package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/component-type/'

composite_rules:
  - id: component-type-library
    desc: component-type type checker
    any:
      - id: package-name
      - id: vendored-path
