defaults:
  crit: notable
  platforms: [windows]
  for: [dll]
  size_min: 4096
  size_max: 4194304

traits:
  - id: glib-company-version
    desc: GLib developer version info
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: The GLib developer community

  - id: gthread-original-filename
    desc: GThread original DLL filename
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: libgthread-2.0-0.dll

  - id: gthread-export
    desc: GThread initialization export
    conf: 0.98
    if:
      type: symbol
      exact: g_thread_init

  # proxy-libintl (intl-8.dll) is the gettext shim the GLib/GTK Windows
  # bundle ships so GLib can translate messages; its whole ABI is the
  # g_libintl_* export set.
  - id: proxy-libintl-gettext-export
    desc: proxy-libintl gettext ABI export
    conf: 0.98
    if:
      type: export
      regex: '^g_libintl_[a-z_]+$'

  - id: libglib-basename
    desc: GLib shared library basename
    platforms: [linux]
    for: [elf]
    size_max: 20000000
    if:
      type: basename
      regex: '(?i)^libglib-2\.0\.so(\.\d+)*$'

composite_rules:
  - id: glib-gthread-library
    desc: GLib GThread runtime library
    conf: 0.99
    all:
      - id: glib-company-version
    any:
      - id: gthread-original-filename
      - id: gthread-export
