# Unity runtime module identities. These are named third-party runtime
# components, so they belong in well-known/lib rather than binary metadata.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  size_min: 4096
  size_max: 50000000

traits:
  - id: unity-player-loader-reference
    desc: References Unity Windows player loader
    conf: 0.95
    if:
      type: text
      exact: UnityPlayer.dll
      section: .rdata

  - id: unity-xr-managed-module
    desc: References Unity XR managed module
    conf: 0.98
    if:
      type: text
      exact: UnityEngine.XRModule.dll
      section: .text

  - id: linux-player-debugger-support
    desc: Unity Linux player debugger attachment support
    crit: notable
    conf: 0.99
    platforms: [linux]
    for: [elf]
    size_max: 200000000
    if:
      type: text
      exact: UNITY_GIVE_CHANCE_TO_ATTACH_DEBUGGER
      section: .rodata
