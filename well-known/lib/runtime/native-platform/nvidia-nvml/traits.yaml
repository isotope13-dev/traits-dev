defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.9
  size_min: 64
  size_max: 100000000
traits:
  - id: nvml-wrapper-rust-crate
    desc: Rust nvml-wrapper-sys crate path
    crit: notable
    if:
      type: text
      substr: nvml-wrapper-sys
      section: rdata

  - id: nvidia-gpu-classifier-token
    desc: NVIDIA GPU classification token cluster
    crit: notable
    if:
      type: text
      substr: NvidiaQuadroTeslaNVSGRIDGeForceTitanV
      section: rdata

composite_rules:
  - id: nvml-symbol-cluster
    desc: NVIDIA NVML symbol cluster
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/hardware/gpu::nvml-init-symbol
      - id: micro-behaviors/hardware/gpu::nvml-driver-version-symbol
      - id: micro-behaviors/hardware/gpu::nvml-vbios-version-symbol
      - id: well-known/lib/runtime/native-platform/nvidia-nvml::nvml-wrapper-rust-crate
      - id: well-known/lib/runtime/native-platform/nvidia-nvml::nvidia-gpu-classifier-token
    needs: 2
