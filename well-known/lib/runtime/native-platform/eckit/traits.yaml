# eckit — ECMWF C++ runtime toolkit.
defaults:
  crit: notable
  platforms: [macos, linux, windows]
  size_min: 100
  size_max: 50000000

traits:
  - id: eckit-dylib-install-name
    desc: eckit Mach-O install name
    for: [macho]
    conf: 0.99
    if:
      type: value
      path: macho.libraries
      regex: '(^|[\\/])libeckit(\.[0-9]+)*\.dylib$'

  - id: eckit-symbol-namespace
    desc: eckit C++ runtime namespace symbol
    conf: 0.98
    for: [macho, elf, dll]
    if:
      type: symbol
      regex: '^_?(ZN5eckit|eckit::)'

  - id: eckit-header-namespace
    desc: eckit C++ header namespace declaration
    conf: 0.98
    for: [c, cpp]
    if:
      type: text
      regex: '(?m)^\s*namespace\s+eckit\s*\{'

composite_rules:
  - id: eckit-runtime-library
    desc: ECMWF EcKit C++ runtime toolkit
    conf: 0.99
    any:
      - id: eckit-dylib-install-name
      - id: eckit-symbol-namespace
      - id: eckit-header-namespace
