# BepInEx is a legitimate Unity/XNA/.NET game modding and plugin framework.
# Keep the identity exact: generic managed reflection or assembly loading is
# capability evidence, not a BepInEx signature and not malware intent.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 512
  size_max: 30000000

traits:
  - id: bepinex-net-common-product
    desc: BepInEx.NET.Common product identity
    if:
      type: value
      path: pe.version.product_name
      exact: BepInEx.NET.Common

  - id: bepinex-net-common-filename
    desc: BepInEx.NET.Common assembly filename
    if:
      type: value
      path: pe.version.original_filename
      exact: BepInEx.NET.Common.dll

composite_rules:
  - id: bepinex-net-common
    desc: BepInEx .NET common framework assembly
    all:
      - id: bepinex-net-common-product
      - id: bepinex-net-common-filename
