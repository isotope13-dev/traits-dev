defaults:
  platforms: [unix]
  for: [elf, so]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: libdbus-shared-library
    desc: libdbus shared library
    size_min: 100000
    size_max: 2000000
    if:
      type: basename
      regex: '^libdbus-1\.so(\.[0-9]+)*$'
  - id: dbus-windows-runtime-library
    desc: D-Bus Windows runtime library
    platforms: [windows]
    for: [dll]
    if:
      type: basename
      regex: '(?i)^dbus-1-[0-9]+\.dll$'
