# knot — lpgauth Erlang NIF for wyrand non-cryptographic PRNG.
# NIF argv[0] is the first Erlang term argument, not process self-path.
# c_src/build.sh compiles knot.so with cc; that is the NIF build, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [c, text, xml, tar, archives, markdown]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 5000000

traits:
  - id: github-repo
    desc: lpgauth knot GitHub repository
    conf: 0.99
    if:
      type: text
      substr: github.com/lpgauth/knot

  - id: nif-init
    desc: knot Erlang NIF module init
    for: [c]
    conf: 0.98
    if:
      type: text
      substr: ERL_NIF_INIT(knot

  - id: hex-app-name
    desc: knot Hex metadata application name
    for: [text, xml]
    conf: 0.96
    if:
      type: text
      substr: '{<<"app">>,<<"knot">>}'
