# wazero is a general-purpose, sandboxed WebAssembly runtime for Go. Runtime
# presence is library identity; suspiciousness requires a separate concealed
# payload or native-memory-loader behavior.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: notable
  conf: 0.9
  size_min: 100000
  size_max: 2000000000

traits:
  - id: module-path
    desc: wazero Go module path
    if:
      type: text
      substr: tetratelabs/wazero

  - id: panic-recovery-string
    desc: wazero panic recovery message
    conf: 0.85
    if:
      type: text
      substr: recovered by wazero

  # Garble mangles package paths but keeps exported interface method names, so
  # obfuscated builds still carry the wazero Runtime API surface. The pair of
  # internal functions is distinctive to wazero's Runtime interface.
  - id: runtime-compile-module-fn
    desc: wazero CompileModule function name
    conf: 0.85
    for: [elf, macho, pe]
    if:
      type: function
      regex: '\.CompileModule$'
  - id: runtime-instantiate-module-fn
    desc: wazero InstantiateModule function name
    conf: 0.85
    for: [elf, macho, pe]
    if:
      type: function
      regex: '\.InstantiateModule$'

composite_rules:
  - id: runtime-api-method-names
    desc: wazero Runtime API method-name pair
    conf: 0.85
    all:
      - id: runtime-compile-module-fn
      - id: runtime-instantiate-module-fn
  - id: wazero-runtime
    desc: Embedded wazero WebAssembly runtime
    any:
      - id: module-path
      - id: panic-recovery-string
      - id: runtime-api-method-names
