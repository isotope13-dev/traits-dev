# Well-known interpreter / helper executable basenames, used as FP-suppression
# context by other rules (e.g. "unless the file is the python3 interpreter").
defaults:
  platforms: [windows, unix]
  size_min: 1
  size_max: 500000000
  crit: notable
traits:
  - id: chrome-sandbox-basename
    desc: "Chrome/Electron sandbox helper name"
    for: [elf]
    if:
      type: path
      basename: true
      exact: chrome-sandbox
  - id: chrome-crashpad-handler-basename
    desc: "Chrome/Electron Crashpad helper name"
    for: [elf, macho]
    if:
      type: path
      basename: true
      exact: chrome_crashpad_handler
