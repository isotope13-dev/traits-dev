defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [pe, dll, so, dylib]
  size_max: 15000000

traits:
  - id: tcl-tk-product-version-metadata
    desc: Tcl/Tk Windows product version metadata
    for: [pe, dll]
    platforms: [windows]
    if:
      type: value
      path: pe.version.product_name
      regex: '^(Tcl|Tk) [0-9]+\.[0-9]+ for Windows$'
  - id: tcl-tk-runtime-library
    desc: Tcl/Tk runtime shared library
    if:
      type: path
      basename: true
      regex: '^(lib)?(tcl|tk)[0-9]+(\.[0-9]+)?t?\.(dll|so|dylib)$'
      case_insensitive: true
  - id: tcl-tk-extension-library
    desc: Tcl/Tk extension shared library
    if:
      type: path
      basename: true
      regex: '^(tix|tcldde)[0-9]{2}\.(dll|so|dylib)$'
      case_insensitive: true
  - id: tcl-macos-bundle-id
    desc: Tcl macOS framework bundle identifier
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.info_plist.CFBundleIdentifier
      exact: com.tcltk.tcllibrary
  - id: tcl-create-interp-export
    desc: Tcl Tcl_CreateInterp export
    for: [macho, elf, pe]
    if:
      type: export
      exact: Tcl_CreateInterp
  - id: tcl-eval-ex-export
    desc: Tcl Tcl_EvalEx export
    for: [macho, elf, pe]
    if:
      type: export
      exact: Tcl_EvalEx
  - id: tcl-init-export
    desc: Tcl Tcl_Init export
    for: [macho, elf, pe]
    if:
      type: export
      exact: Tcl_Init
composite_rules:
  # Keyboard handling belongs to this GUI runtime. Require product identity
  # in a digest-matching signed image; a renamed unsigned DLL gets no bypass.
  # This is signature integrity plus product metadata, not PKI chain trust.
  - id: signed-tcl-tk-product
    desc: Signed Tcl/Tk runtime product with matching digest
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: tcl-tk-product-version-metadata
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
      - id: metadata/signature/verified/
  - id: tcl-tk-runtime-component
    desc: Tcl/Tk runtime or extension library
    any:
      - id: tcl-tk-runtime-library
      - id: tcl-tk-extension-library
  - id: tcl-macos-framework
    desc: Tcl macOS scripting runtime framework
    for: [macho]
    platforms: [macos]
    all:
      - id: tcl-macos-bundle-id
      - id: tcl-create-interp-export
      - id: tcl-eval-ex-export
      - id: tcl-init-export
