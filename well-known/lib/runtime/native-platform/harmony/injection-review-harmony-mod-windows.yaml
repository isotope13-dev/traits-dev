defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.93

composite_rules:
  - id: harmony-writealltext-reference
    desc: Harmony and WriteAllText references
    crit: notable
    all:
      - id: well-known/lib/runtime/native-platform/harmony::harmonylib-marker
      - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-token
    unless:
      # QuickLook hooks Explorer with Harmony and writes preview files.
      - id: well-known/app/utility/quicklook::release-path
      - id: well-known/lib/runtime/native-platform/harmony::harmony-library-assembly
  - id: harmony-future-timestamp
    crit: notable
    desc: Harmony and future PE timestamp
    all:
      - id: well-known/lib/runtime/native-platform/harmony::harmonylib-marker
      - id: metadata/binary/provenance/build::header-timestamp-post-2030
    unless:
      - id: well-known/lib/runtime/native-platform/harmony::harmony-library-assembly
  - id: harmony-patch-write-reference
    desc: HarmonyPatch and WriteAllText references
    crit: notable
    all:
      - id: well-known/lib/runtime/native-platform/harmony::harmony-patch-attribute
      - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-token
    unless:
      - id: well-known/lib/runtime/native-platform/harmony::harmony-library-assembly
