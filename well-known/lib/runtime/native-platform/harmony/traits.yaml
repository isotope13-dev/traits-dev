defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [pe, dll]
  size_min: 16384
traits:
  - id: harmonylib-marker
    desc: HarmonyLib runtime-patching library marker
    conf: 0.99
    if:
      type: text
      substr: HarmonyLib
      section: .text
  - id: harmony-method-attribute
    desc: HarmonyMethod attribute (patch annotation)
    conf: 0.95
    if:
      type: text
      substr: HarmonyTargetMethod
      section: .text
  - id: harmony-patch-attribute
    desc: HarmonyPatch runtime patch annotation
    conf: 0.95
    if:
      type: text
      substr: HarmonyPatch
      section: .text
  - id: harmony-assembly-original-filename
    desc: Harmony library original filename
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: 0Harmony.dll
  - id: harmony-assembly-product-name
    desc: Harmony library product name
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Harmony
  - id: harmony-assembly-company
    desc: Harmony author Andreas Pardeike company identity
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Andreas Pardeike
composite_rules:
  - id: harmony-runtime-patcher
    desc: Harmony runtime detour/patching library
    conf: 0.99
    any:
      - id: harmonylib-marker
      - id: harmony-method-attribute
      - id: harmony-patch-attribute
  - id: harmony-library-assembly
    desc: Official Harmony runtime library assembly
    conf: 0.99
    all:
      - id: harmonylib-marker
      - id: harmony-assembly-company
    any:
      - id: harmony-assembly-original-filename
      - id: harmony-assembly-product-name
