# typeset.logback — JSON layout for Logback Classic (com.kroo / b-social).
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text, xml]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: typeset.logback Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: typeset.logback

  - id: github-repo
    desc: typeset.logback GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/b-social/typeset.logback

  - id: layout-namespace
    desc: typeset.logback JsonLayout namespace
    for: [clojure, text]
    conf: 0.96
    if:
      type: text
      substr: com.kroo.typeset.logback.JsonLayout
