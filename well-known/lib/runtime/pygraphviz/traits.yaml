defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 5242880

traits:
  - id: pygraphviz-python-extension
    desc: PyGraphviz CPython extension
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^pygraphviz\._graphviz\.(cp[0-9]+|abi3)-[^\\/]+\.pyd$'
