---
defaults:
  platforms: [unix, windows]
  for: [pe, xml]
  size_max: 300000000

traits:
  - id: dotnet-reference-pack-name
    desc: Microsoft .NET reference pack name
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)Microsoft\.NETCore\.App\.Ref|NETStandard\.Library\.Ref'
  - id: dotnet-reference-pack-ref-directory
    desc: .NET reference assembly directory path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)ref[\\/]'

composite_rules:
  - id: dotnet-reference-pack-context
    desc: Microsoft .NET reference pack context
    crit: exception
    conf: 0.99
    # Pack identity often lives on the enclosing nupkg path while the ref/
    # member is the leaf PE; pool at archive scope so both legs can combine.
    scope: archive
    all:
      - id: dotnet-reference-pack-name
      - id: dotnet-reference-pack-ref-directory
