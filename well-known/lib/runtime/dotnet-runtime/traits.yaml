defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe, archives]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: aspnetcore-dataprotection
    desc: ASP.NET Core DataProtection runtime library
    for: [pe, dll]
    if:
      type: basename
      exact: Microsoft.AspNetCore.DataProtection.dll
  - id: aspnetcore-keyderivation
    desc: ASP.NET Core KeyDerivation runtime library
    for: [pe, dll]
    if:
      type: basename
      exact: Microsoft.AspNetCore.Cryptography.KeyDerivation.dll
  - id: aspnetcore-crypto-internal
    desc: ASP.NET Core cryptography internal runtime
    for: [pe, dll]
    if:
      type: basename
      exact: Microsoft.AspNetCore.Cryptography.Internal.dll
  - id: dotnet-nativeaot-runtime
    desc: Microsoft .NET NativeAOT runtime member
    if:
      type: path
      regex: '(?i)Microsoft\.NETCore\.App\.Runtime|iossimulator-x64'

  # System.Private.CoreLib is the assembly that *implements* AssemblyResolve,
  # ResourceManager, reflection, AppDomain and GZip, so any rule keyed on
  # "uses those APIs" matches the library that defines them. It ships in every
  # self-contained `dotnet publish` output and every runtime install, and the
  # copy is frequently not Authenticode-signed, so signed-platform downgrades
  # miss it. Paired with an internal marker so a renamed dropper cannot claim
  # the identity on basename alone.
  - id: corelib-self-assembly-name
    desc: CoreLib self-referential assembly name
    crit: baseline
    platforms: [windows]
    for: [pe, dll]
    count_min: 4
    if:
      type: text
      section: .text
      substr: System.Private.CoreLib

  # CoreCLR legitimately resolves AMSI APIs while initializing its managed
  # content scanner. Its official PE identity is stronger benign evidence
  # than the generic byte sequence used by the AMSI patch heuristic.
  - id: coreclr-original-filename
    desc: CoreCLR runtime original filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: CoreCLR.dll
      case_insensitive: true
  - id: coreclr-description
    desc: CoreCLR runtime version description
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.description
      substr: .NET Runtime
      case_insensitive: true

  # .NET Framework NGEN images are native PE files that retain the managed
  # assembly's metadata and API surface.  In particular, System.ni.dll
  # contains the framework implementations of ResourceManager, Activator,
  # Reflection.Emit, Process, and the crypto/network APIs.  Those definitions
  # must not be interpreted as an application using the APIs.  Require the
  # coherent Microsoft version identity and PDB name; the basename alone is
  # not a sufficient identity for an exception.
  - id: dotnet-framework-system-native-image-basename
    desc: .NET Framework System native image filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: basename
      exact: System.ni.dll
      case_insensitive: true
  - id: dotnet-framework-system-original-name
    desc: .NET Framework System assembly original filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: System.dll
      case_insensitive: true
  - id: dotnet-framework-system-description
    desc: .NET Framework System assembly description
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.description
      exact: .NET Framework
      case_insensitive: true
  # The company leg of the native-image composite below is deliberately NOT a
  # trait of this directory. It used to be `dotnet-framework-system-company`,
  # whose whole matcher was `pe.version.company == "Microsoft Corporation"` --
  # a string carried by every Microsoft product and by every forgery of one,
  # saying nothing whatsoever about .NET Framework. Naming it ".NET Framework
  # vendor metadata" and filing it under dotnet-runtime/ overclaimed what the
  # matcher searches for, which TAXONOMY forbids at every criticality; it was
  # also a second spelling of a fact the tree already had an atom for.
  #
  # The canonical atom is metadata/binary/vendor::microsoft-corp-versioninfo,
  # correctly named, correctly filed, and accepting the localized spellings
  # too. It is `component`, so it cannot be a member of the `crit: exception`
  # composite below -- hence that rule drops the vendor leg entirely rather
  # than re-pointing it.
  - id: dotnet-framework-system-pdb
    desc: .NET Framework System native image PDB basename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: System.pdb
      case_insensitive: true

  # Self-contained `dotnet publish` copies Microsoft framework facades without
  # Authenticode. Their version resource still carries the coherent Microsoft
  # .NET identity (company + product + System.*/mscorlib/netstandard original
  # filename). SuppressIldasmAttribute in those assemblies is CLR metadata
  # surface, not anti-decompilation.
  - id: microsoft-dotnet-product-name
    desc: Microsoft .NET product version identity
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft® .NET
  - id: microsoft-dotnet-system-assembly-original
    desc: Microsoft System/mscorlib original filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^(System(\.[A-Za-z0-9.]+)?|mscorlib|netstandard)\.dll$'

  # dbgshim is shipped in every Microsoft.NETCore.App.Runtime pack and in
  # self-contained publishes. It opens /proc/%lu/mem while attaching the
  # managed debugger — process inspection for debugging, not scraping.
  - id: dbgshim-so-basename
    desc: .NET dbgshim native helper basename
    crit: notable
    platforms: [unix]
    for: [elf, so]
    size_min: 50000
    size_max: 10000000
    if:
      type: basename
      regex: '^libdbgshim\.so(\.[0-9]+)?$'
  - id: dbgshim-dll-basename
    desc: .NET dbgshim Windows helper basename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    size_min: 50000
    size_max: 10000000
    if:
      type: basename
      exact: dbgshim.dll
      case_insensitive: true
  - id: dbgshim-create-debugging-export
    desc: .NET dbgshim CreateDebuggingInterface export
    crit: notable
    platforms: [unix, windows]
    for: [elf, so, pe, dll]
    if:
      type: export
      regex: '^CreateDebuggingInterfaceFromVersion(2|Ex)?$'

  # CoreCLR / JIT / DAC natives embed the same /proc/%lu/mem printf path for
  # dump and debugger support. Basename alone is forgeable; pair with the
  # CoreCLR version banner that ships in Microsoft runtime packs.
  - id: coreclr-runtime-native-so-basename
    desc: .NET CoreCLR native runtime library basename
    crit: notable
    platforms: [unix]
    for: [elf, so]
    size_min: 50000
    size_max: 50000000
    if:
      type: basename
      regex: '^lib(coreclr|clrjit|dbgshim|mscorda)'
  - id: coreclr-version-banner
    desc: CoreCLR version banner string
    crit: notable
    platforms: [unix, windows]
    for: [elf, so, pe, dll]
    if:
      type: text
      substr: 'CoreCLR Version:'
      section: .rodata

  # A self-contained .NET application embeds CoreCLR and CoreLib into the
  # application executable. The runtime's JIT necessarily allocates executable
  # mappings and its native host resolves libraries at runtime; those mechanics
  # describe the CLR, not application-level anti-static intent. Repetition keeps
  # this atom from treating a lone application reference as a bundled runtime.
  - id: repeated-corelib-assembly-reference
    desc: Repeated System.Private.CoreLib references
    crit: notable
    conf: 0.99
    platforms: [unix]
    for: [elf, macho]
    count_min: 4
    if:
      type: text
      substr: System.Private.CoreLib
      section: .rodata

composite_rules:
  - id: aspnetcore-crypto-runtime
    desc: ASP.NET Core cryptography runtime libraries
    crit: notable
    conf: 0.96
    any:
      - id: aspnetcore-dataprotection
      - id: aspnetcore-keyderivation
      - id: aspnetcore-crypto-internal
  - id: dotnet-corelib-assembly
    desc: Microsoft .NET runtime core library assembly
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/file/extension/identity::corelib-dll-basename
      - id: corelib-self-assembly-name
  - id: coreclr-runtime-context
    desc: Official Microsoft CoreCLR runtime context
    crit: exception
    conf: 1.0
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: coreclr-original-filename
      - id: coreclr-description
      - id: metadata/signed/leaf::microsoft-corporation
  - id: dotnet-framework-system-native-image
    desc: Microsoft .NET Framework System native image context
    crit: exception
    conf: 1.0
    platforms: [windows]
    for: [pe, dll]
    # Four legs, no vendor-string leg. The basename `System.ni.dll`, the
    # original filename `System.dll`, the `.NET Framework` description and the
    # `System.pdb` debug name are jointly conclusive for the genuine NGen
    # native image, and none of them is a string that merely names Microsoft.
    # The company leg that used to sit here is dropped rather than replaced:
    # the sibling coreclr-runtime-context above proves vendor identity from the
    # signing certificate, but NGen images are generated on the local machine
    # and are not Authenticode-signed, so that evidence is unavailable here.
    all:
      - id: dotnet-framework-system-native-image-basename
      - id: dotnet-framework-system-original-name
      - id: dotnet-framework-system-description
      - id: dotnet-framework-system-pdb
  - id: microsoft-dotnet-framework-facade-context
    desc: Unsigned Microsoft .NET framework facade assembly context
    crit: exception
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: microsoft-dotnet-product-name
      - id: microsoft-dotnet-system-assembly-original
  - id: dotnet-dbgshim-runtime-context
    desc: Official .NET dbgshim runtime helper context
    crit: exception
    conf: 0.99
    platforms: [unix, windows]
    for: [elf, so, pe, dll]
    all:
      - id: dbgshim-create-debugging-export
    any:
      - id: dbgshim-so-basename
      - id: dbgshim-dll-basename
  - id: dotnet-coreclr-native-runtime-context
    desc: Official .NET CoreCLR native runtime context
    crit: exception
    conf: 0.99
    platforms: [unix]
    for: [elf, so, archives]
    scope: outer
    all:
      - id: coreclr-runtime-native-so-basename
      - id: coreclr-version-banner
  - id: dotnet-bundled-coreclr-runtime-context
    desc: Self-contained application bundles CoreCLR
    crit: exception
    conf: 0.99
    platforms: [unix]
    for: [elf, macho]
    all:
      - id: coreclr-version-banner
      - id: repeated-corelib-assembly-reference
