defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe, archives]
  crit: notable
  conf: 0.99
  size_max: 600000000

traits:
  - id: aspnetcore-dataprotection
    desc: ASP.NET Core DataProtection runtime library
    for: [pe, dll]
    if:
      type: basename
      exact: Microsoft.AspNetCore.DataProtection.dll
  - id: aspnetcore-keyderivation
    desc: ASP.NET Core KeyDerivation runtime library
    for: [pe, dll]
    if:
      type: basename
      exact: Microsoft.AspNetCore.Cryptography.KeyDerivation.dll
  - id: aspnetcore-crypto-internal
    desc: ASP.NET Core cryptography internal runtime
    for: [pe, dll]
    if:
      type: basename
      exact: Microsoft.AspNetCore.Cryptography.Internal.dll
  - id: dotnet-nativeaot-runtime
    desc: Microsoft .NET NativeAOT runtime member
    if:
      type: path
      regex: '(?i)Microsoft\.NETCore\.App\.Runtime|iossimulator-x64'

  # System.Private.CoreLib is the assembly that *implements* AssemblyResolve,
  # ResourceManager, reflection, AppDomain and GZip, so any rule keyed on
  # "uses those APIs" matches the library that defines them. It ships in every
  # self-contained `dotnet publish` output and every runtime install, and the
  # copy is frequently not Authenticode-signed, so signed-platform downgrades
  # miss it. Paired with an internal marker so a renamed dropper cannot claim
  # the identity on basename alone.
  - id: corelib-self-assembly-name
    desc: CoreLib self-referential assembly name
    crit: baseline
    platforms: [windows]
    for: [pe, dll]
    count_min: 4
    if:
      type: text
      section: .text
      substr: System.Private.CoreLib

  # CoreCLR legitimately resolves AMSI APIs while initializing its managed
  # content scanner. Its official PE identity is stronger benign evidence
  # than the generic byte sequence used by the AMSI patch heuristic.
  - id: coreclr-original-filename
    desc: CoreCLR runtime original filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: CoreCLR.dll
      case_insensitive: true
  - id: coreclr-description
    desc: CoreCLR runtime version description
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.description
      substr: .NET Runtime
      case_insensitive: true

  # .NET Framework NGEN images are native PE files that retain the managed
  # assembly's metadata and API surface.  In particular, System.ni.dll
  # contains the framework implementations of ResourceManager, Activator,
  # Reflection.Emit, Process, and the crypto/network APIs.  Those definitions
  # must not be interpreted as an application using the APIs.  Require the
  # coherent Microsoft version identity and PDB name; the basename alone is
  # not a sufficient identity for an exception.
  - id: dotnet-framework-system-native-image-basename
    desc: .NET Framework System native image filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: basename
      exact: System.ni.dll
      case_insensitive: true
  - id: dotnet-framework-system-original-name
    desc: .NET Framework System assembly original filename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      exact: System.dll
      case_insensitive: true
  - id: dotnet-framework-system-description
    desc: .NET Framework System assembly description
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.description
      exact: .NET Framework
      case_insensitive: true
  - id: dotnet-framework-system-company
    desc: Microsoft .NET Framework vendor metadata
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.company
      exact: Microsoft Corporation
      case_insensitive: true
  - id: dotnet-framework-system-pdb
    desc: .NET Framework System native image PDB basename
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: System.pdb
      case_insensitive: true

composite_rules:
  - id: aspnetcore-crypto-runtime
    desc: ASP.NET Core cryptography runtime libraries
    crit: notable
    conf: 0.96
    any:
      - id: aspnetcore-dataprotection
      - id: aspnetcore-keyderivation
      - id: aspnetcore-crypto-internal
  - id: dotnet-corelib-assembly
    desc: Microsoft .NET runtime core library assembly
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/file/extension/identity::corelib-dll-basename
      - id: corelib-self-assembly-name
  - id: coreclr-runtime-context
    desc: Official Microsoft CoreCLR runtime context
    crit: exception
    conf: 1.0
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: coreclr-original-filename
      - id: coreclr-description
      - id: metadata/signed/leaf::microsoft-corporation
  - id: dotnet-framework-system-native-image
    desc: Microsoft .NET Framework System native image context
    crit: exception
    conf: 1.0
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: dotnet-framework-system-native-image-basename
      - id: dotnet-framework-system-original-name
      - id: dotnet-framework-system-description
      - id: dotnet-framework-system-company
      - id: dotnet-framework-system-pdb
