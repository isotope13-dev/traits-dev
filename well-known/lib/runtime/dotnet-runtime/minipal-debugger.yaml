# .NET runtime minipal ships a portable native-debugger probe used by
# CoreCLR / NativeAOT / corerun. Reading TracerPid from /proc/self/status is
# the Linux implementation of minipal_is_native_debugger_present — runtime
# support for managed debugging, not application anti-analysis.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: minipal-debugger-source-path
    desc: .NET minipal debugger source path
    for: [c, cpp]
    size_min: 1
    size_max: 50000
    if:
      type: path
      regex: '(^|[\\/])minipal[\\/]debugger\.(c|h)$'

  # corerun / apphost / NativeAOT binaries statically link this API as their
  # TracerPid probe — runtime debugger support, not application anti-analysis.
  # Referenced directly from unix-tracerpid-safe-context (no single-leg wrapper).
  - id: minipal-native-debugger-api
    desc: minipal native debugger present API
    for: [c, cpp, elf, so]
    size_min: 200
    size_max: 500000000
    if:
      type: text
      substr: minipal_is_native_debugger_present

composite_rules:
  # Covers both debugger.c (API) and debugger.h (present-check macro) forms.
  - id: minipal-debugger-source-context
    desc: .NET minipal native debugger helper source
    crit: exception
    conf: 0.99
    for: [c, cpp]
    all:
      - id: minipal-debugger-source-path
    any:
      - id: minipal-native-debugger-api
      - id: well-known/lib/runtime/dotnet-runtime::minipal-debugger-present-macro
