# Microsoft .NET source-built artifacts — Arch/source-build packaging of the
# official SDK rebuild (Private.SourceBuilt.Artifacts + minipal helpers).
# TracerPid checks in minipal/debugger.c are CoreCLR diagnostic APIs, not
# anti-analysis malware.
defaults:
  platforms: [unix, windows]
  for: [archives, tar, nupkg, c, cpp, pe, dll, elf, so]
  crit: notable
  conf: 0.99

traits:
  - id: source-built-artifacts-member
    desc: Private SourceBuilt Artifacts archive member
    size_min: 1
    if:
      type: path
      regex: 'SourceBuilt\.Artifacts'

  - id: source-built-artifacts-pkg-path
    desc: dotnet-source-built-artifacts package path
    size_min: 1
    if:
      type: path
      regex: 'dotnet-source-built-artifacts'

  - id: source-built-artifacts-pkgname
    desc: Arch pkgname for .NET source-built artifacts
    for: [text, archives]
    size_min: 1
    if:
      type: text
      substr: 'pkgname = dotnet-source-built-artifacts'

  - id: minipal-debugger-header
    desc: .NET minipal debugger helper header include
    for: [c, cpp]
    size_min: 1
    if:
      type: text
      substr: 'minipal/debugger.h'

  - id: minipal-debugger-present-macro
    desc: .NET minipal debugger present check macro
    for: [c, cpp]
    size_min: 1
    if:
      type: text
      substr: MINIPAL_DEBUGGER_PRESENT_CHECK

  - id: corerun-basename
    desc: .NET CoreRun test host basename
    for: [elf]
    size_min: 1
    if:
      type: basename
      exact: corerun

  - id: msbuild-dll-basename
    desc: MSBuild.dll assembly basename
    for: [pe, dll]
    size_min: 1
    if:
      type: basename
      exact: MSBuild.dll
      case_insensitive: true

  - id: msbuild-original-filename
    desc: MSBuild.dll original filename version identity
    for: [pe, dll]
    size_min: 1
    if:
      type: value
      path: pe.version.original_filename
      exact: MSBuild.dll
      case_insensitive: true

  - id: microsoft-build-runtime-nupkg
    desc: Microsoft.Build.Runtime nupkg path
    size_min: 1
    if:
      type: path
      regex: 'Microsoft\.Build\.Runtime'

  - id: ilcompiler-nupkg-path
    desc: Microsoft DotNet ILCompiler runtime nupkg path
    size_min: 1
    if:
      type: path
      regex: 'Microsoft\.DotNet\.ILCompiler'

composite_rules:
  - id: msbuild-runtime-assembly-context
    desc: Official Microsoft MSBuild runtime assembly context
    crit: exception
    conf: 0.99
    for: [pe, dll, nupkg, archives]
    any:
      - id: msbuild-dll-basename
      - id: msbuild-original-filename
      - id: microsoft-build-runtime-nupkg

  - id: source-built-artifacts-context
    desc: Microsoft .NET source-built artifacts package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: source-built-artifacts-member
      - id: source-built-artifacts-pkg-path
      - id: source-built-artifacts-pkgname
      - id: ilcompiler-nupkg-path
