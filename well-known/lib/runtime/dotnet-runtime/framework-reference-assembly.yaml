# Basename and version-resource identity for Microsoft framework / reference
# assemblies (netstandard, mscorlib, CoreLib, System.* facades). Grouped so
# objective rules can suppress once instead of listing each leaf.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 50000000

traits:
  - id: mscorlib-dll-basename
    desc: mscorlib.dll reference assembly basename
    if:
      type: path
      basename: true
      exact: mscorlib.dll

  - id: mono-common-language-infrastructure-product
    desc: Mono Common Language Infrastructure product
    if:
      type: value
      path: pe.version.product_name
      exact: Mono Common Language Infrastructure

composite_rules:
  - id: mono-mscorlib-runtime-context
    desc: Mono mscorlib runtime assembly context
    crit: exception
    conf: 0.99
    all:
      - id: mscorlib-dll-basename
      - id: mono-common-language-infrastructure-product

  - id: framework-reference-assembly-context
    desc: Microsoft .NET framework or reference assembly context
    crit: exception
    conf: 0.99
    any:
      - id: metadata/file/extension/identity::netstandard-dll-basename
      - id: mscorlib-dll-basename
      - id: metadata/file/extension/identity::corelib-dll-basename
      - id: well-known/lib/runtime/dotnet-runtime::microsoft-dotnet-framework-facade-context
