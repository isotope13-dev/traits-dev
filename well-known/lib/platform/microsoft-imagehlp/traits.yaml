defaults:
  size_max: 52428800
  platforms: [windows]
  for: [dll]
  crit: baseline
  conf: 0.97

traits:
  - id: imagehlp-description
    crit: notable
    desc: Windows Image Helper metadata
    if:
      type: value
      path: pe.version.description
      substr: Windows NT Image Helper

  - id: imagehlp-original-filename
    crit: notable
    desc: IMAGEHLP.DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: IMAGEHLP.DLL

  - id: dbghelp-original-filename
    crit: notable
    desc: DBGHELP.DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: DBGHELP.DLL
      case_insensitive: true

  - id: symsrv-original-filename
    crit: notable
    desc: SYMSRV.DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: symsrv.dll
      case_insensitive: true

  - id: dbgeng-original-filename
    crit: notable
    desc: DBGENG.DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: dbgeng.dll
      case_insensitive: true

  - id: srcsrv-original-filename
    crit: notable
    desc: SRCSRV.DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: srcsrv.dll
      case_insensitive: true

  - id: dbgmodel-original-filename
    crit: notable
    desc: DBGMODEL.DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: dbgmodel.dll
      case_insensitive: true

  - id: imagehlp-pdb-path
    desc: ImageHlp PDB path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.debug.pdb.path
      exact: imagehlp.pdb

  - id: imagehlp-api-version-export
    desc: ImageHlp API version export
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: ImagehlpApiVersion

composite_rules:
  - id: microsoft-imagehlp-dll
    desc: Microsoft Windows ImageHlp DLL
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: imagehlp-original-filename
    any:
      - id: imagehlp-description
      - id: imagehlp-pdb-path
      - id: imagehlp-api-version-export
      - id: micro-behaviors/process/debug/symbol::remove-relocations
    needs: 2

  - id: microsoft-debug-helper-dll
    desc: Microsoft Windows debug helper DLL
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/signed/platform::microsoft
    any:
      - id: dbghelp-original-filename
      - id: symsrv-original-filename
      - id: dbgeng-original-filename
      - id: srcsrv-original-filename
      - id: dbgmodel-original-filename
