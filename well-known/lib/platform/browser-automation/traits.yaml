# Benign browser-automation helper scripts (Playwright capture, real-device probe).
# FP context: headless-browser drivers resemble stealer collection.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript]
  size_max: 20000000
traits:
  - id: playwright-package-name
    desc: Playwright package manifest name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: playwright

  - id: playwright-core-package-name
    desc: Playwright Core package manifest name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: playwright-core

  - id: playwright-core-package-path
    desc: Playwright Core package member path
    crit: notable
    conf: 0.96
    for: [javascript, typescript, scripts, manifests, data, source]
    if:
      type: path
      regex: '(?i)playwright-core([/\\]|$)'

  - id: playwright-internal-source-package-name
    desc: Playwright internal source package manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: playwright-internal

  - id: playwright-source-repository
    desc: Microsoft Playwright source repository manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)(^|[/:])github\.com/microsoft/playwright(\.git)?$'

  - id: playwright-capture-helper
    desc: Playwright capture helper script
    crit: component
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '.*playwright.*capture.*\.mjs$'
  - id: browser-real-device-probe-helper
    desc: Browser real device probe helper script
    crit: component
    conf: 0.95
    if:
      type: path
      basename: true
      regex: 'browser_real_device_probe\.mjs$'
  - id: puppeteer-core-library-path
    desc: Contains bundled Puppeteer Core library paths
    crit: notable
    conf: 0.9
    size_min: 1000
    size_max: 100000000
    for: [javascript, typescript, python, pe, dll, csharp, go]
    if:
      type: text
      substr: puppeteer-core/lib/
  - id: puppeteer-cdp-preload-script-class
    desc: Puppeteer CdpPreloadScript class marker
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: CdpPreloadScript
  # Puppeteer's own runtime constants. Unlike a require()/node_modules path,
  # these survive bundling and minification because they are meaningful string
  # VALUES at runtime — the sourceURL Puppeteer stamps on every evaluated
  # script, and the name of the isolated world it creates. They are what still
  # identifies Puppeteer once a build step has vendored it into one .mjs
  # (e.g. @remotion/renderer ships a Puppeteer fork inside dist/esm/index.mjs),
  # which is precisely when the package-path markers above go blind.
  - id: puppeteer-evaluation-script-url
    desc: Puppeteer evaluation script sourceURL marker
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: __puppeteer_evaluation_script__

  - id: puppeteer-utility-world-name
    desc: Puppeteer isolated utility world name
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: __puppeteer_utility_world__

  - id: puppeteer-core-require
    desc: JavaScript imports Puppeteer Core
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'require\s*\(\s*["'']puppeteer-core["'']\s*\)'

  - id: puppeteer-device-emulation-catalog
    desc: Puppeteer device emulation catalog
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: 'const knownDevices ='

  - id: chrome-devtools-ad-tracker-entity-catalog
    desc: Chrome DevTools ad-tracker entity catalog
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: package/dist/entities-nostats.json

  - id: chrome-devtools-frontend-package-name
    desc: Chrome DevTools frontend npm package manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: chrome-devtools-frontend

  - id: playwright-mcp-extension-name
    desc: Playwright MCP Chrome extension name
    crit: notable
    conf: 0.98
    for: [javascript, typescript, json, chrome-manifest]
    size_min: 64
    size_max: 200000
    if:
      type: text
      substr: 'Playwright MCP Extension'

  - id: playwright-mcp-extension-purpose
    desc: Playwright MCP automation purpose
    crit: notable
    conf: 0.97
    for: [javascript, typescript, json, chrome-manifest]
    size_min: 64
    size_max: 200000
    if:
      type: text
      substr: 'bot-detection-free browser automation'

  - id: playwright-core-chrome-reinstall-helper
    desc: Playwright Core Chrome reinstall helper
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: path
      basename: true
      regex: '(?i)reinstall_chrome_(stable|beta)_win\.ps1$'

  - id: playwright-core-browser-reinstall-mac-script
    desc: Playwright Core browser reinstall macOS script
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: path
      basename: true
      regex: '(?i)reinstall_(msedge|chrome|chromium).*_mac\.sh$'

  - id: playwright-user-agent-utility
    desc: Playwright Core user-agent utility module
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      # The bundled runtime emits this as `Playwright/${_()}` after minifying
      # the version helper; the stable identity is the product prefix.
      substr: 'Playwright/'

  - id: playwright-trace-viewer-banner
    desc: Playwright Trace Viewer application banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: Playwright Trace Viewer

  - id: playwright-trace-replay-marker
    desc: Playwright trace replay DOM marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: __playwright_bounding_rect__

  # Vite emits the viewer's chunks as `<entry>-<hash>.js` / `<entry>.<hash>.js`.
  # Both halves of the name matter: the entry names are Trace Viewer's own
  # modules, and requiring the content hash keeps an unrelated `snapshot.js`
  # or `urlMatch.js` in some other project from claiming the identity.
  - id: playwright-trace-viewer-view-chunk-basename
    desc: Trace Viewer UI chunk filename
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      # Preserve identity on cleave's decoded-string virtual members.
      regex: '^(defaultSettingsView|uiMode|urlMatch)[-.]\w{6,}\.js(##.+)?$'

  - id: playwright-trace-viewer-render-chunk-basename
    desc: Trace Viewer CodeMirror or worker chunk
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '^(codeMirrorModule[-.]\w{6,}|sw\.bundle)\.js(##.+)?$'

  - id: playwright-trace-report-archive-path
    desc: Trace report archive path
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)playwright-report[^/\\]*\.tar\.gz'

  - id: puppeteer-core-package-name
    desc: puppeteer-core npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: puppeteer-core

  - id: puppeteer-core-vendored-path
    desc: Vendored Puppeteer Core package path
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: path
      regex: 'node_modules[\\/]puppeteer-core[\\/]'

  # Official packages ship src/generated/injected.ts as one giant string of the
  # page-side helpers (createFunction → new Function). High string entropy plus
  # Function construction is expected there, not a backdoor.
  - id: puppeteer-injected-utilities-header
    desc: Puppeteer injected utilities source header
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: 'provides the puppeteer utilities'

  - id: puppeteer-generated-injected-script-path
    desc: Puppeteer generated injected script path
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)generated[/\\]injected(\.d)?\.(ts|js|mjs|cjs)$'

  - id: urlpattern-polyfill-module-path
    desc: URLPattern polyfill module path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      substr: urlpattern-polyfill

  - id: chromium-bisect-builds-helper
    desc: Chromium bisect-builds helper reference
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: bisect-builds.py

composite_rules:
  # A bundled viewer can expose either its application banner or the DOM
  # marker used while replaying a trace. Keep this identity separate from the
  # viewer's expected fetch, worker, clipboard, and browser-API capabilities.
  - id: playwright-trace-viewer-bundle
    desc: Playwright Trace Viewer bundle identity
    crit: notable
    conf: 0.98
    any:
      - id: playwright-trace-viewer-banner
      - id: playwright-trace-replay-marker
      - id: playwright-trace-asset-path

  - id: playwright-trace-asset-path
    desc: Playwright Trace Viewer asset path
    crit: notable
    conf: 0.98
    any:
      - id: playwright-trace-viewer-view-chunk-basename
      - id: playwright-trace-viewer-render-chunk-basename
      - id: playwright-trace-report-archive-path

  # Canonical "Puppeteer is present" identity, covering both a dependency on the
  # package and a copy vendored into a bundle. Consumers outside this directory
  # should reference this one composite rather than the individual markers.
  - id: puppeteer-library-present
    desc: Puppeteer browser-automation library present
    crit: notable
    conf: 0.95
    size_max: 100000000
    any:
      - id: puppeteer-core-library-path
      - id: puppeteer-core-vendored-path
      - id: puppeteer-core-require
      - id: puppeteer-cdp-preload-script-class
      - id: puppeteer-evaluation-script-url
      - id: puppeteer-utility-world-name

  - id: browser-automation-helper-script
    desc: Browser automation helper script
    crit: notable
    conf: 0.95
    any:
      - id: playwright-capture-helper
      - id: browser-real-device-probe-helper

  - id: playwright-mcp-extension-context
    desc: Playwright MCP automation extension context
    crit: exception
    for: [javascript, typescript, json, chrome-manifest]
    all:
      - id: playwright-mcp-extension-name
      - id: playwright-mcp-extension-purpose

  - id: browser-device-emulation-context
    desc: Recognized Puppeteer device-emulation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: puppeteer-core-library-path
      - id: puppeteer-device-emulation-catalog

  - id: puppeteer-injected-source-exception
    desc: Puppeteer generated injected utilities source
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: puppeteer-injected-utilities-header
      - id: puppeteer-generated-injected-script-path

  - id: chrome-devtools-ad-catalog-context
    desc: Recognized Chrome DevTools ad-catalog context
    crit: exception
    conf: 0.99
    all:
      - id: puppeteer-core-library-path
      - id: chrome-devtools-ad-tracker-entity-catalog

  - id: puppeteer-archive-context
    desc: Puppeteer npm package archive context
    crit: exception
    conf: 0.99
    scope: archive
    for: [npm, tar]
    any:
      - id: puppeteer-core-package-name
      - id: puppeteer-library-present
