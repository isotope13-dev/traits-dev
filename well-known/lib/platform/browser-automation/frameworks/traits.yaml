---
defaults:
  size_max: 20000000
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: puppeteer-extra-stealth-plugin-import
  desc: Puppeteer Extra stealth plugin import
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: puppeteer-extra-plugin-stealth
- id: mac-chrome-safe-storage-helper
  desc: macOS Chrome Safe Storage helper
  crit: notable
  if:
    type: text
    substr: readMacChromeSafeStoragePassword
- id: windows-chrome-master-key-helper
  desc: Windows Chrome master-key helper
  crit: notable
  if:
    type: text
    substr: readWindowsChromeMasterKey
- id: cypress-require
  desc: require('cypress')
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: require('cypress')
- id: cypress-import
  desc: from 'cypress'
  crit: notable
  conf: 0.6
  if:
    type: string_literal
    substr: from 'cypress'
- id: playwright-require
  desc: require('playwright')
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: require('playwright')
- id: playwright-import
  desc: from 'playwright'
  crit: notable
  conf: 0.6
  if:
    type: string_literal
    substr: from 'playwright'
- id: playwright-scoped-import
  desc: from '@playwright
  crit: notable
  conf: 0.6
  if:
    type: string_literal
    substr: from '@playwright
- id: playwright-browser-install-script
  desc: Playwright browser runtime install script
  crit: notable
  conf: 0.9
  for:
  - package.json
  if:
    type: value
    path: scripts[*]
    regex: "\\bnpx\\s+playwright\\s+install\\s+(chromium|chrome|firefox|webkit)\\b"
- id: playwright-browser-install-command
  desc: Playwright browser install command
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: "\\bnpx\\s+playwright\\s+install\\s+(chromium|chrome|firefox|webkit)\\b"
- id: baoyu-chrome-cdp-import
  desc: baoyu Chrome CDP automation import
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: baoyu-chrome-cdp
- id: patchright-python-import
  desc: Imports Patchright browser automation for Python
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    substr: patchright.async_api
- id: patchright-pypi-dependency
  desc: PyPI Patchright browser automation dependency
  crit: notable
  conf: 0.85
  for:
  - pkginfo
  if:
    type: text
    regex: "(?i)Requires-Dist:\\s*patchright\\b"
- id: tilion-pypi-package
  desc: PyPI Tilion browser automation package
  crit: notable
  conf: 0.95
  for:
  - pkginfo
  if:
    type: text
    regex: "(?im)^Name:\\s*tilion\\s*$"
- id: tilion-fortress-dependency
  desc: PyPI Tilion Fortress dependency
  crit: notable
  conf: 0.92
  for:
  - pkginfo
  if:
    type: text
    regex: "(?im)^Requires-Dist:\\s*tilion-fortress\\b"
- id: tilion-fortress-browser-doc
  desc: Tilion Fortress browser automation doc
  crit: notable
  conf: 0.9
  for:
  - python
  - pyc
  - pkginfo
  if:
    type: text
    substr: Fortress stealth browser
- id: chromium-browser-process-doc
  desc: Chromium browser process automation doc
  crit: notable
  conf: 0.86
  for:
  - python
  - pyc
  if:
    type: text
    substr: Chromium browser process
- id: fortress-stealth-binary-doc
  desc: Fortress stealth binary automation doc
  crit: notable
  conf: 0.88
  for:
  - python
  - pyc
  if:
    type: text
    substr: Fortress stealth binary
- id: cloakbrowser-pypi-dependency
  desc: PyPI CloakBrowser stealth dependency
  crit: notable
  conf: 0.9
  for:
  - pkginfo
  if:
    type: text
    regex: "(?i)Requires-Dist:\\s*cloakbrowser\\b"
- id: puppeteer-require
  desc: require('puppeteer')
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: require('puppeteer')
- id: puppeteer-import
  desc: from 'puppeteer'
  crit: notable
  conf: 0.6
  if:
    type: string_literal
    substr: from 'puppeteer'
- id: selenium-require
  desc: require('selenium import
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: require('selenium
- id: selenium-import
  desc: from 'selenium import
  crit: notable
  conf: 0.6
  if:
    type: string_literal
    substr: from 'selenium
