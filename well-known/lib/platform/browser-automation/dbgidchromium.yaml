# dbgidchromium — Android Termux/Pydroid3 WebDriver (DBG-ID Browser).
# Dual-use automation library; IPC decodes JSON-ish values with eval, which
# is protocol parsing rather than a packed payload loader.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 50000000

traits:
  - id: pypi-name
    desc: dbgidchromium PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: dbgidchromium

  - id: wheel-distribution
    desc: dbgidchromium wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: dbgidchromium

  - id: github-repo
    desc: dbgidchromium GitHub repository URL
    if:
      type: text
      substr: github.com/dbgid/dbgidchromium

  - id: android-package
    desc: DBG-ID Browser Android package id
    for: [python]
    if:
      type: text
      substr: com.dbgid.browser

  - id: seledroid-script-attr
    desc: Seledroid script-result DOM attribute
    for: [python]
    if:
      type: text
      substr: data-seledroid-script-result

  - id: package-member-path
    desc: dbgidchromium package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])dbgidchromium[\\/]'

composite_rules:
  - id: dbgidchromium-identity
    desc: dbgidchromium Android WebDriver toolkit
    needs: 2
    any:
      - id: pypi-name
      - id: wheel-distribution
      - id: github-repo
      - id: android-package
      - id: seledroid-script-attr
      - id: package-member-path
