# Microsoft Shell32 is a Windows system library. Its implementation naturally
# contains shell, registry, process, file, UI, networking, and task-policy
# strings that generic behavior rules must not interpret as attacker intent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1048576
  size_max: 16777216

traits:
  - id: shell32-original-filename
    desc: Shell32 original filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: SHELL32.DLL
      case_insensitive: true

  - id: shell32-internal-name
    desc: Shell32 internal name metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: SHELL32
      case_insensitive: true

  - id: shell32-description
    desc: Windows Shell Common DLL description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Windows Shell Common Dll
      case_insensitive: true

  - id: shell32-pdb
    desc: Shell32 PDB filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])shell32\.pdb$'

composite_rules:
  - id: microsoft-shell32-library
    desc: Microsoft Windows Shell32 system library
    crit: notable
    conf: 0.999
    all:
      - id: shell32-original-filename
      - id: shell32-internal-name
      - id: shell32-description
      - id: metadata/binary/vendor::microsoft-prefixed-company
    any:
      - id: shell32-pdb
      - id: metadata/signed/leaf::microsoft-corporation
    needs: 1

  - id: microsoft-shell32-system-context
    desc: Recognized Microsoft Shell32 implementation context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-shell32-library
      - id: metadata/signed/leaf::microsoft-corporation
