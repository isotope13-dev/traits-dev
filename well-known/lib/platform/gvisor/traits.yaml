defaults:
  platforms: [unix]
  for: [go, c, cpp, source]
  crit: notable
  conf: 0.98

traits:
  - id: gvisor-copyright-header
    desc: gVisor project copyright header
    if:
      type: text
      substr: The gVisor Authors

  - id: gvisor-module-path
    desc: gVisor Go module path
    if:
      type: text
      substr: gvisor.dev/gvisor

  - id: gvisor-sentry-package-marker
    desc: gVisor sentry package marker
    if:
      type: text
      substr: pkg/sentry/

  # Go module zips are gvisor.dev/gvisor@<version>/ rooted; every member
  # path carries that root. Covers Starlark and other non-Go members that
  # carry no gVisor text markers of their own (e.g. website/defs.bzl).
  - id: gvisor-module-root-path
    desc: gVisor module tree member path
    for: [go, python]
    if:
      type: path
      regex: '(^|[/])gvisor\.dev/'

composite_rules:
  - id: gvisor-source-tree
    desc: gVisor sandbox runtime source tree
    crit: notable
    conf: 0.99
    any:
      - id: gvisor-copyright-header
      - id: gvisor-module-path
      - id: gvisor-sentry-package-marker
