defaults:
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.95
  size_max: 5000000
  for: [rust, cargo.toml]
traits:
# Cargo's published windows crate is a gzip-wrapped archive whose header
# retains the crate filename. Identify the wrapper as well as its extracted
# generated source, so registry scans do not lose the library provenance.
- id: windows-rs-crate-archive
  desc: Microsoft windows-rs crate archive
  crit: notable
  conf: 0.99
  for: [gz]
  size_max: 12000000
  if:
    type: raw
    regex: 'windows-[0-9]+\.[0-9]+\.[0-9]+\.crate'
# `cargo vendor` writes the primary copy of a crate under its bare name
# (`vendor/windows-sys/`) and only appends `-<version>` to *additional*
# duplicate versions (`vendor/windows-sys-0.48.0/`). A regex requiring the
# version suffix therefore matches the duplicates and never the canonical
# copy — so the windows-sys feature catalog, which enumerates every Win32 and
# WDK API family as a cargo feature, tripped the whole cargo-windows-*-feature
# family on every `cargo vendor` tree (i.e. every distro Rust source package).
- id: windows-rs-binding-core-crate
  desc: Windows Rust binding crate
  if:
    type: path
    regex: '(^|[\\/])(windows|winapi)(-sys|-targets)?(-[0-9][0-9.]*)?[\\/]'
  unless:
  - type: path
    regex: '[\\/]src[\\/]windows'
- id: windows-rs-binding-target-crate
  desc: Windows Rust import-library crate
  for: [rust, cargo.toml, static-lib]
  size_max: 20000000
  if:
    type: path
    regex: '(^|[\\/])windows_(i686|x86_64|aarch64)_[a-z0-9_]+'
- id: windows-rs-binding-api-crate
  desc: Windows Rust binding crate
  if:
    type: path
    regex: "(windows-core|windows-implement|windows-interface)-[0-9]+\\."
- id: windows-rs-binding-types-crate
  desc: Windows Rust binding crate
  if:
    type: path
    regex: "(windows-result|windows-strings|windows-numerics)-[0-9]+\\."
- id: windows-rs-binding-tool-crate
  desc: Windows Rust binding crate
  if:
    type: path
    regex: "(windows-version|windows-link|windows-registry)-[0-9]+\\."
- id: windows-rs-generated-api-source
  desc: Generated Rust Windows API binding source
  for: [rust]
  if:
    type: path
    regex: '(^|[\\/])Windows[\\/]Win32'
# Same `cargo vendor` naming split as the windows-rs crates above: the
# registry/duplicate copies carry a `-<version>` suffix, the canonical copy does
# not. Kept as two atoms rather than one loosened regex — a bare `/nix/` would
# match every NixOS store path, so the unversioned form is anchored on the
# `vendor/` parent that only `cargo vendor` output produces.
- id: rust-syscall-binding-crate-versioned
  crit: notable
  desc: Rust syscall binding crate (versioned dir)
  unless:
  - id: metadata/package/testing/
  if:
    type: path
    regex: "(libc|nix|rustix|redox_syscall|linux-raw-sys|errno)-[0-9]+\\."
- id: rust-syscall-binding-vendor-dir
  crit: notable
  desc: Rust syscall binding crate in vendor dir
  unless:
  - id: metadata/package/testing/
  if:
    type: path
    regex: "vendor/(libc|nix|rustix|redox_syscall|linux-raw-sys|errno)/"
composite_rules:
# Keeps the id every consumer already references in its `unless:`.
- id: rust-syscall-binding-crate
  desc: Rust syscall binding crate
  crit: notable
  conf: 0.95
  any:
  - id: rust-syscall-binding-crate-versioned
  - id: rust-syscall-binding-vendor-dir
- id: windows-rs-binding-crate
  desc: Microsoft windows-rs binding crate family
  crit: notable
  conf: 0.95
  for: [rust, cargo.toml, static-lib]
  size_max: 20000000
  any:
  - id: windows-rs-binding-core-crate
  - id: windows-rs-binding-target-crate
  - id: windows-rs-binding-api-crate
  - id: windows-rs-binding-types-crate
  - id: windows-rs-binding-tool-crate
