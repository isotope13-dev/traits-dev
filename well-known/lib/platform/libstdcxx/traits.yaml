# MinGW's libstdc++-6.dll is the GCC C++ runtime. It builds digit and
# symbol tables with stack stores that look like packed alphanumeric strings.
defaults:
  size_min: 500000
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
traits:
  - id: libstdcxx-runtime-basename
    desc: MinGW libstdc++ runtime DLL
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^libstdc\+\+-\d+(-[a-f0-9]{8,})?\.dll$'

  # libstdc++ headers, and the builds that vendor or configure them, reference
  # _GLIBCXX_<NAME> internal macros (visibility, namespace versioning, ABI
  # switches); the token identifies GCC C++ library source even with no path
  # or package manifest. The include guard itself is not always _GLIBCXX_-
  # prefixed (GCC 6's bits/shared_ptr.h uses _SHARED_PTR_H), so this is a
  # macro-reference observation rather than a guard claim.
  - id: glibcxx-macro-reference
    desc: libstdc++ _GLIBCXX_ macro reference
    crit: notable
    conf: 0.95
    size_min: 1
    platforms: [unix, windows]
    for: [c, cpp]
    if:
      type: text
      regex: '\b_GLIBCXX_[A-Z0-9_]{3,48}\b'
