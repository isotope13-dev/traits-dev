# MinGW's libstdc++-6.dll is the GCC C++ runtime. It builds digit and
# symbol tables with stack stores that look like packed alphanumeric strings.
defaults:
  size_min: 500000
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
traits:
  - id: libstdcxx-runtime-basename
    desc: MinGW libstdc++ runtime DLL
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^libstdc\+\+-\d+(-[a-f0-9]{8,})?\.dll$'

  # Every libstdc++ header carries the _GLIBCXX_<NAME> include guard; source
  # collections that vendor GCC's C++ library therefore identify themselves
  # through it with no path or package manifest.
  - id: glibcxx-header-include-guard
    desc: libstdc++ header include guard
    crit: notable
    conf: 0.95
    size_min: 1
    platforms: [unix, windows]
    for: [c, cpp]
    if:
      type: text
      regex: '\b_GLIBCXX_[A-Z0-9_]{3,48}\b'
