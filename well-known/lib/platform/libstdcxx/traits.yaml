# MinGW's libstdc++-6.dll is the GCC C++ runtime. It builds digit and
# symbol tables with stack stores that look like packed alphanumeric strings.
defaults:
  size_min: 500000
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
traits:
  - id: libstdcxx-runtime-basename
    desc: MinGW libstdc++ runtime DLL
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^libstdc\+\+-\d+\.dll$'
