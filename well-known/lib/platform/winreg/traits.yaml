# winreg — Windows registry access.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: winreg npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: winreg
  - id: vendored-path
    desc: vendored winreg package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/winreg/'

composite_rules:
  - id: winreg-library
    desc: winreg Windows registry helper
    any:
      - id: package-name
      - id: vendored-path
