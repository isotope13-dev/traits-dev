# TerraFX.Interop.Windows (Tanner Gooding and contributors) is the open-source
# set of complete C# bindings for the Windows and DirectX SDKs. Declaring
# CreateProcess, WriteProcessMemory, VirtualAllocEx, CreateRemoteThread and the
# rest is its purpose; a binding assembly carries the whole API surface and
# injects into nothing.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  size_min: 100000
  size_max: 200000000

traits:
  - id: terrafx-company-versioninfo
    desc: TerraFX CompanyName version info
    if:
      type: value
      path: pe.version.company
      exact: TerraFX

  - id: terrafx-bindings-comments-versioninfo
    desc: Windows SDK interop bindings comment
    if:
      type: value
      path: pe.version.comments
      substr: Interop bindings for the Windows

composite_rules:
  - id: terrafx-interop-windows-bindings
    desc: TerraFX Windows interop binding assembly
    conf: 0.98
    all:
      - id: terrafx-company-versioninfo
      - id: terrafx-bindings-comments-versioninfo
