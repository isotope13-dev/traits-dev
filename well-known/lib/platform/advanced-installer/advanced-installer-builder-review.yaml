defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: external-ui-started-marker
    desc: Advanced Installer external UI marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: Advanced Installer External UI started.
      section: .rdata
  - id: bootstrapper-flag
    desc: Advanced Installer bootstrapper flag
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: AI_BOOTSTRAPPER
      section: .rdata
  - id: caphyon-registry-root
    desc: Caphyon registry root marker
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: Software\Caphyon\Advanced Installer\
      section: .rdata
  - id: prerequisite-install-marker
    desc: Advanced Installer prerequisite marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: AI_InstallPrerequisite
      section: .rdata
  - id: ai-custom-action-dll
    desc: AICustAct.dll custom-action binary
    crit: notable
    conf: 0.97
    if:
      type: path
      basename: true
      regex: (?i)^AICustAct(_x64)?\.dll$
  - id: ai-custom-action-dll-raw
    desc: Advanced Installer custom-action DLL
    crit: notable
    conf: 0.9
    for: [oledoc]
    if:
      type: raw
      regex: (?i)aicustact\.dll
  - id: packaging-tool-banner-raw
    desc: Advanced Installer packaging banner
    crit: notable
    conf: 0.97
    for: [oledoc]
    if:
      type: text
      substr: AI_PACKAGING_TOOLAdvanced Installer
composite_rules:
  - id: advanced-installer-bootstrapper
    desc: Advanced Installer bootstrapper marker
    crit: notable
    conf: 0.99
    any:
      - id: well-known/lib/platform/advanced-installer::external-ui-started-marker
      - id: well-known/lib/platform/advanced-installer::packaging-tool-banner-raw
      - id: well-known/lib/platform/advanced-installer::bootstrapper-flag
      - id: well-known/lib/platform/advanced-installer::caphyon-registry-root
      - id: well-known/lib/platform/advanced-installer::prerequisite-install-marker
