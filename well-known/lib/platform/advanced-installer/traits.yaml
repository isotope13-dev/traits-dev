# Caphyon Advanced Installer helper binaries are ordinary installer support
# components.  Their custom actions legitimately inspect processes, services,
# privileges, and embedded data while evaluating installation prerequisites.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: advanced-updater-registry-root
    desc: Advanced Updater registry root
    if:
      type: text
      section: .rdata
      exact: Software\Caphyon\Advanced Updater

  - id: advanced-updater-pdb
    desc: Advanced Installer updater build path
    if:
      type: value
      path: pe.debug.pdb.path
      substr: '\ReleaseAI\win\Release\stubs\x86\Updater.pdb'
  - id: caphyon-company
    desc: Caphyon Advanced Installer company metadata
    if:
      type: value
      path: pe.version.company
      exact: Caphyon LTD

  - id: advanced-installer-product
    desc: Advanced Installer product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Advanced Installer

composite_rules:
  - id: advanced-updater-context
    desc: Advanced Installer updater stub
    crit: exception
    all:
      - id: advanced-updater-registry-root
      - id: advanced-updater-pdb
  - id: advanced-installer-launcher-context
    desc: Advanced Installer PowerShell launcher runtime
    crit: exception
    conf: 0.99
    any:
      - id: advanced-installer-bootstrapper
      - id: advanced-updater-context
  - id: advanced-installer-helper-context
    desc: Caphyon Advanced Installer helper binary
    crit: exception
    conf: 0.99
    all:
      - id: caphyon-company
      - id: advanced-installer-product

  - id: advanced-installer-package-context
    desc: Caphyon Advanced Installer package context
    crit: exception
    conf: 0.98
    scope: outer
    for: [cab, msi, oledoc, pe]
    all:
      - id: well-known/lib/platform/advanced-installer::msi-bytes-advanced-installer-product
      - id: caphyon-company
      - id: advanced-installer-product
