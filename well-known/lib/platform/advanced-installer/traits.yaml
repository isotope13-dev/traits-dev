# Caphyon Advanced Installer helper binaries are ordinary installer support
# components.  Their custom actions legitimately inspect processes, services,
# privileges, and embedded data while evaluating installation prerequisites.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: caphyon-company
    desc: Caphyon Advanced Installer company metadata
    if:
      type: value
      path: pe.version.company
      exact: Caphyon LTD

  - id: advanced-installer-product
    desc: Advanced Installer product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: Advanced Installer

  - id: ai-file-download-action
    desc: Advanced Installer FileDownload action marker
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      substr: AI_FileDownload

  - id: ai-expand-archive-action
    desc: Advanced Installer ExpandArchive action marker
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      substr: AI_ExpandArchive

  - id: ai-powershell-script-launcher
    desc: PowerShellScriptLauncher helper identity
    crit: notable
    conf: 0.96
    if:
      type: text
      section: .rdata
      substr: PowerShellScriptLauncher

composite_rules:
  - id: advanced-installer-helper-context
    desc: Caphyon Advanced Installer helper binary
    crit: exception
    conf: 0.99
    all:
      - id: caphyon-company
      - id: advanced-installer-product
