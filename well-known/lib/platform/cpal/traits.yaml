# CPAL (Cross-Platform Audio Library) records microphone input in examples
# and tests; that capability is the library's documented purpose.
defaults:
  platforms: [unix, windows]
  for: [gz, crate, rust]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: cpal-crate-package-path
    desc: CPAL Rust crate package path
    if:
      type: path
      regex: '(?i)(^|[/\\:])cpal(@|-)[0-9]'
