# Microsoft Windows Media Center helper DLL identity.
#
# ehuihlp.dll has broad Windows integration capabilities, including registry,
# credential, process-launch, and optional network APIs.  Keep the identity
# match dependent on corroborating metadata so those capabilities remain
# distinguishable from hostile behavior.
defaults:
  platforms: [windows]
  for: [dll, pe]
  crit: component
  conf: 0.99
  size_min: 500000
  size_max: 3000000

traits:
  - id: media-center-helper-original-filename
    desc: ehuihlp.dll original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: ehuihlp.dll
      case_insensitive: true

  - id: media-center-helper-internal-name
    desc: ehuihlp.dll internal name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: ehuihlp.dll
      case_insensitive: true

  - id: media-center-helper-description
    desc: Media Center module description metadata
    if:
      type: value
      path: pe.version.description
      exact: Media Center Module

  - id: media-center-helper-pdb
    desc: ehuihlp PDB file identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])ehuihlp\.pdb$'

composite_rules:
  - id: microsoft-media-center-helper
    desc: Microsoft Windows Media Center helper DLL
    crit: notable
    conf: 0.999
    all:
      - id: media-center-helper-original-filename
      - id: media-center-helper-internal-name
      - id: media-center-helper-description
      - id: media-center-helper-pdb
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/binary/vendor::windows-os-product-name
