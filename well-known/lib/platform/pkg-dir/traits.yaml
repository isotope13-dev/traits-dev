# sindresorhus/pkg-dir — find nearest package.json dir.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: pkg-dir npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'pkg-dir'

  - id: vendored-path
    desc: vendored pkg-dir package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/pkg-dir/'

composite_rules:
  - id: library
    desc: pkg-dir library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
