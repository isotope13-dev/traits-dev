# XSharp's VO-compatible Win32 API library is a managed P/Invoke binding:
# DllImport declarations for Win32 entry points plus a few SendMessage
# wrappers. Declaring an API is not calling it. Its import tables carry the
# keyboard, clipboard, screen, and WinINet names without any call site, so
# API-presence composites fire on it. Identity needs the verified XSharp BV
# signature; a claimed company name alone supplies no trust.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vo-win32-pdb-stem
    desc: VO Win32 API library PDB stem
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.stem
      exact: VOWin32APILibrary

composite_rules:
  - id: vo-win32-binding-library
    desc: XSharp VO Win32 API binding library, XSharp BV signed
    crit: notable
    conf: 0.97
    all:
      - id: metadata/signature/verified/signer::xsharp-bv
      - id: vo-win32-pdb-stem
