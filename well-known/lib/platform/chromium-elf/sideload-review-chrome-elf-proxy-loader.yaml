defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1

traits:
  - id: export-install-details-payload
    desc: Chromium GetInstallDetailsPayload export
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: GetInstallDetailsPayload
  - id: export-is-browser-process
    desc: Chromium IsBrowserProcess export
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: IsBrowserProcess
  - id: export-signal-chrome-elf
    desc: Chromium SignalChromeElf export
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: SignalChromeElf
