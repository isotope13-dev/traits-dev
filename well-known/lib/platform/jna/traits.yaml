defaults:
  platforms:
  - unix
  - windows
  for:
  - jar
  - zip
  - class
  crit: baseline
  conf: 0.98
  size_max: 5000000
traits:
- id: platform-jar-basename
  desc: JNA platform JAR
  if:
    type: path
    basename: true
    regex: "^jna-platform-[0-9][A-Za-z0-9._-]*\\.jar$"
- id: platform-win32-package
  desc: JNA Win32 platform package marker
  if:
    type: text
    substr: com/sun/jna/platform/win32/
- id: native-dispatch-library
  desc: JNA native dispatch library
  crit: notable
  for:
  - pe
  - dll
  - elf
  - macho
  size_max: 5000000
  if:
    type: path
    basename: true
    regex: "^(lib)?jnidispatch\\.(dll|so|jnilib|dylib)$"
- id: native-init-ids-export
  desc: JNA native initialization export
  crit: notable
  for: [pe, dll, elf, macho]
  if:
    type: export
    exact: Java_com_sun_jna_Native_initIDs
- id: pointer-get-string-export
  desc: JNA pointer string export
  crit: notable
  for: [pe, dll, elf, macho]
  if:
    type: export
    exact: Java_com_sun_jna_Pointer__1getString
composite_rules:
- id: jna-library
  desc: Java Native Access (JNA) library
  crit: notable
  conf: 0.98
  any:
  - id: platform-jar-basename
  - id: platform-win32-package
  - id: native-dispatch-library
- id: native-dispatch-identity
  desc: Verified JNA native dispatch library
  crit: exception
  conf: 0.99
  for: [pe, dll, elf, macho]
  all:
  - id: native-dispatch-library
  - id: native-init-ids-export
  - id: pointer-get-string-export
