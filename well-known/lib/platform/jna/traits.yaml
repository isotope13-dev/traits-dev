defaults:
  platforms:
  - unix
  - windows
  for:
  - jar
  - zip
  - class
  crit: baseline
  conf: 0.98
  size_max: 5000000
traits:
- id: platform-jar-basename
  desc: JNA platform JAR
  if:
    type: path
    basename: true
    regex: "^jna-platform-[0-9][A-Za-z0-9._-]*\\.jar$"
# Imports of JNA's own core types. These identify the library a class links
# against -- a declared import, which TAXONOMY.md places at notable -- and were
# previously two `suspicious` traits inside objectives/evasion/fileless/memory/.
# Their matchers say only "this class imports com.sun.jna", which is true of
# every Java program that calls a native function at all, so any application
# using JNA reported an evasion objective. The composites that pair JNA with
# RWX allocation, shellcode words or manual mapping still live there and now
# reference these.
- id: core-types-import
  desc: JNA core bridge types imported
  crit: notable
  conf: 0.9
  for: [java, class]
  size_max: 2147483647
  if:
    type: text
    regex: com/sun/jna/(Pointer|Function|Native)
- id: win32-stdcall-import
  desc: JNA Win32 stdcall types imported
  crit: notable
  conf: 0.92
  for: [java, class]
  size_max: 2147483647
  if:
    type: text
    regex: com/sun/jna/win32/(StdCallLibrary|W32APIOptions)
- id: platform-win32-package
  desc: JNA Win32 platform package marker
  if:
    type: text
    substr: com/sun/jna/platform/win32/
- id: native-dispatch-library
  desc: JNA native dispatch library
  crit: notable
  for:
  - pe
  - dll
  - elf
  - macho
  size_max: 5000000
  if:
    type: path
    basename: true
    regex: "^(lib)?jnidispatch\\.(dll|so|jnilib|dylib)$"
- id: native-init-ids-export
  desc: JNA native initialization export
  crit: notable
  for: [pe, dll, elf, macho]
  if:
    type: export
    exact: Java_com_sun_jna_Native_initIDs
- id: pointer-get-string-export
  desc: JNA pointer string export
  crit: notable
  for: [pe, dll, elf, macho]
  if:
    type: export
    exact: Java_com_sun_jna_Pointer__1getString
composite_rules:
- id: jna-library
  desc: Java Native Access (JNA) library
  crit: notable
  conf: 0.98
  any:
  - id: platform-jar-basename
  - id: platform-win32-package
  - id: native-dispatch-library
- id: native-dispatch-identity
  desc: Verified JNA native dispatch library
  crit: exception
  conf: 0.99
  for: [pe, dll, elf, macho]
  all:
  - id: native-dispatch-library
  - id: native-init-ids-export
  - id: pointer-get-string-export
