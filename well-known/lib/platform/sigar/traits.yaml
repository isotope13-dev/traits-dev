defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  # Hyperic SIGAR's Runner loads its native library through a URLClassLoader.
  # The package path is in every class's constant pool.
  - id: sigar-package-class
    desc: Hyperic SIGAR package class
    if:
      type: text
      substr: org/hyperic/sigar/
