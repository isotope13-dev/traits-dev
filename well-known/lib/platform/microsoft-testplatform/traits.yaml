# Microsoft Test Platform assemblies are commonly distributed as strong-name
# signed DLLs without Authenticode signatures. Their version resources and
# assembly filenames provide the component identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 2000000

traits:
  - id: testplatform-product-name
    desc: Microsoft Test Platform product name
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      regex: '^Microsoft\.(VisualStudio\.)?TestPlatf(orm|rom)\.'

  - id: testplatform-assembly-filename
    desc: Microsoft Test Platform assembly filename
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.version.original_filename
      regex: '^Microsoft(\.VisualStudio)?\.TestPlatform\.[A-Za-z0-9.]+\.dll$'

composite_rules:
  - id: microsoft-testplatform-library
    desc: Microsoft Test Platform managed library identity
    crit: notable
    conf: 0.98
    all:
      - id: testplatform-product-name
      - id: testplatform-assembly-filename
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/trust-level::dotnet-strong-name-signed
