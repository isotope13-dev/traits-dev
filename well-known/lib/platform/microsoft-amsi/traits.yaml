# Microsoft Anti-Malware Scan Interface system DLL identity.
# AMSI exports its own scan APIs, so those names are not evidence that this
# file is an AMSI consumer or an AMSI-bypass implementation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 8192
  size_max: 65536
  crit: notable
  conf: 0.99

traits:
  - id: original-filename
    desc: AMSI system DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: amsi.dll
      case_insensitive: true

  - id: internal-name
    desc: AMSI system DLL internal name
    if:
      type: value
      path: pe.version.internal_name
      exact: amsi
      case_insensitive: true

  - id: description
    desc: AMSI system DLL description
    if:
      type: value
      path: pe.version.description
      exact: Anti-Malware Scan Interface
      case_insensitive: true

  - id: pdb
    desc: AMSI system DLL PDB filename
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])Amsi\.pdb$'

  - id: initialize-export
    desc: AMSI initialization export
    if:
      type: export
      exact: AmsiInitialize

  - id: scan-buffer-export
    desc: AMSI buffer scanning export
    if:
      type: export
      exact: AmsiScanBuffer

composite_rules:
  - id: microsoft-amsi-dll
    desc: Microsoft AMSI system DLL identity
    crit: notable
    conf: 0.99
    all:
      - id: original-filename
      - id: internal-name
      - id: description
      - id: initialize-export
      - id: scan-buffer-export

  - id: microsoft-amsi-system-context
    desc: Microsoft AMSI system-library context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-amsi-dll
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/binary/symbols/exports::com-export-pair
