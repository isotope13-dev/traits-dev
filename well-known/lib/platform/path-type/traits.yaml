# sindresorhus/path-type — file/directory path checks.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: path-type npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'path-type'

  - id: vendored-path
    desc: vendored path-type package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/path-type/'

composite_rules:
  - id: library
    desc: path-type library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
