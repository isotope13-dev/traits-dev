# go-rod is a Go library for browser automation via Chrome DevTools Protocol.
defaults:
  platforms: [unix, windows]
  for: [go, zip]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 104857600

traits:
  - id: source-archive-member
    desc: go-rod module source archive member
    for: [zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/go-rod/rod@v[0-9][^/]+/go\.mod$'

  - id: source-archive-path
    desc: go-rod module source path
    for: [go, text]
    if:
      type: path
      regex: 'github\.com/go-rod/rod@v'

  - id: module-path
    desc: go-rod module import path
    if:
      type: text
      substr: 'github.com/go-rod/rod'

composite_rules:
  - id: go-rod-library
    desc: go-rod browser automation library
    crit: notable
    conf: 0.99
    any:
      - id: source-archive-member
      - id: source-archive-path
      - id: module-path

  - id: go-rod-source-archive-context
    desc: go-rod source archive context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: source-archive-member
      - id: module-path
