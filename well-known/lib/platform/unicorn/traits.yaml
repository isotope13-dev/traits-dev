defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98
traits:
  # Unicorn's public API is uc_hook_add. Bindings and samples name the
  # callback hook_syscall because the emulator is tracing the syscall
  # instruction, not installing a kernel hook.
  - id: unicorn-hook-api
    desc: Unicorn emulator hook API
    if:
      type: text
      substr: uc_hook_add
