# MRJ Adapter is an open-source Java library providing Mac OS X MRJ integration.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: mrjadapter-class-namespace
    desc: MRJ Adapter class namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^net/roydesign/mac/'

  - id: mrjadapter-main-class
    desc: MRJAdapter class definition
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      exact: net/roydesign/mac/MRJAdapter
