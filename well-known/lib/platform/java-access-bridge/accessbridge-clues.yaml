# Access Bridge markers with embedded PE, section and API references.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: accessbridge-embedded-pe-section-api-clues
  desc: Access Bridge, embedded PE and API clues
  crit: suspicious
  conf: 0.99
  all:
  - id: well-known/lib/platform/java-access-bridge::jabswitch-cli-banner
  - id: well-known/lib/platform/java-access-bridge::access-bridge-config-line
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::largest-section-under-8pct
  any:
  - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
  - id: objectives/persistence/system/registry/com-hijack::inprocserver32-path
  - id: objectives/collection/keylog/hook::windows-hook-keylogger
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: metadata/build/manifest::require-administrator
  needs: 2
- id: accessbridge-embedded-product-name-clues
  desc: Access Bridge and embedded product-name clues
  crit: suspicious
  conf: 0.97
  all:
  - id: well-known/lib/platform/java-access-bridge::jabswitch-cli-banner
  - id: well-known/lib/platform/java-access-bridge::access-bridge-config-line
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  any:
  - id: well-known/lib/platform/java-access-bridge::oracle-javaaccessbridge-key
  - id: well-known/lib/platform/java-access-bridge::accessbridge-pdb-path
  - id: objectives/evasion/masquerade/identity/fabricated::office-policy-registry
  - id: metadata/binary/debug::adobe-product-pdb-reference
  needs: 2
- id: accessbridge-embedded-remote-memory-clues
  desc: Access Bridge and remote-memory API clues
  crit: suspicious
  conf: 0.97
  all:
  - id: accessbridge-embedded-product-name-clues
  any:
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
  - id: micro-behaviors/process/inject/runtime/call::debug-privilege-remote-memory-api-cluster
  needs: 2
