# Nonempty-content bound; preserves every existing positive match.
# Neutral container term references; names do not prove runtime use.
defaults:
  size_min: 1
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
traits:
- id: libcontainer-str
  desc: libcontainer name reference
  crit: notable
  conf: 0.85
  size_min: 12
  if:
    type: text
    substr: libcontainer
