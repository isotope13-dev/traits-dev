# rasgcw.dll is the Microsoft Windows RAS Wizard Pages library. This identity
# uses stable version/debug/import/export evidence so normal unsigned samples
# from older Windows images do not look like vendor masquerades.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 500000
  size_max: 2000000

traits:
  - id: rasgcw-original-filename
    desc: RAS Wizard Pages original filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: rasgcw.dll
      case_insensitive: true

  - id: rasgcw-internal-name
    desc: RAS Wizard Pages internal DLL name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: rasgcw.dll
      case_insensitive: true

  - id: rasgcw-description
    desc: RAS Wizard Pages version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: RAS Wizard Pages
      case_insensitive: true

  - id: rasgcw-pdb
    desc: RAS Wizard Pages PDB filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])rasgcw\.pdb$'

composite_rules:
  - id: microsoft-rasgcw-library
    desc: Microsoft RAS Wizard Pages system library
    crit: notable
    conf: 0.995
    all:
      - id: rasgcw-original-filename
      - id: rasgcw-internal-name
      - id: rasgcw-description
      - id: rasgcw-pdb
      - id: micro-behaviors/communications/socket/ras::ras-enum-devices
      - id: micro-behaviors/communications/socket/ras::ras-dial-dialog
      - id: metadata/binary/vendor::windows-os-product-name
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/binary/symbols/exports::com-export-pair

  - id: rasgcw-system-context
    desc: Recognized Microsoft RAS Wizard Pages system context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-rasgcw-library
      - id: metadata/binary/vendor::microsoft-prefixed-company
