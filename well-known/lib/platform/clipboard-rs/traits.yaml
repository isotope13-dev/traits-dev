# clipboard-rs Windows Node bindings provide clipboard read/write and opt-in
# change-listener APIs. Consumers such as terminal coding agents ship every
# platform prebuild together, so the dormant Windows listener implementation
# is routinely present in non-Windows packages.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  size_min: 262144
  size_max: 33554432

traits:
  - id: clipboard-rs-listener-constructor
    desc: clipboard-rs listener constructor marker
    conf: 0.98
    if:
      type: raw
      substr: ClipboardListener::new is_wayland=
      section: .rdata

composite_rules:
  - id: clipboard-rs-node-addon
    desc: clipboard-rs Windows Node addon
    conf: 0.99
    all:
      - id: clipboard-rs-listener-constructor
      - id: metadata/binary/framework::node-api-addon-export
