# Vanara (https://github.com/dahall/Vanara) publishes one assembly per Windows
# system DLL, each holding nothing but DllImport signatures, structures and
# constants for that DLL's complete API surface. Vanara.PInvoke.Kernel32 names
# VirtualAllocEx, WriteProcessMemory, QueueUserAPC and ResumeThread for the same
# reason kernel32.dll exports them: it is the declaration of the API, not a use
# of it. Capability composites read those names as an injection chain.
#
# Identify the family by its version resource rather than by filename: every
# module carries the same product name and the same generated comment, so one
# pair of facts covers Kernel32, Security, Cryptography, WinHTTP, Ws2_32 and
# every module Vanara adds later.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 120000000
traits:
  - id: pinvoke-api-import-comment
    desc: Vanara generated P/Invoke module comment
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.comments
      substr: 'PInvoke API (methods, structures and constants) imported from Windows'
  - id: vanara-product-name
    desc: Vanara product name in version resource
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: Vanara
composite_rules:
  - id: pinvoke-binding-assembly
    desc: Vanara P/Invoke binding assembly
    crit: notable
    conf: 0.98
    all:
      - id: pinvoke-api-import-comment
      - id: vanara-product-name
