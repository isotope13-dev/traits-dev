# Vanara's per-DLL assemblies are P/Invoke surfaces. The User32 assembly
# declares PrintWindow, clipboard, and key-state entry points because those
# are User32 APIs, not because the assembly captures input; the Kernel32
# assembly likewise declares the process and memory APIs (CreateProcess,
# WriteProcessMemory, ResumeThread, FlushInstructionCache) as signatures
# for a whole SDK. Declaring an API is not calling it.

defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 100000
  size_max: 5000000
traits:
  - id: vanara-user32-pinvoke
    desc: Vanara User32 P/Invoke assembly
    if:
      type: path
      regex: '(?i)Vanara\.PInvoke\.User32\.dll'
  - id: vanara-kernel32-pinvoke
    desc: Vanara Kernel32 P/Invoke assembly
    if:
      type: path
      regex: '(?i)Vanara\.PInvoke\.Kernel32\.dll'
