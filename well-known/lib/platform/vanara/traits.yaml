# Vanara's User32 assembly is a P/Invoke surface. It declares PrintWindow,
# clipboard, and key-state entry points because those are User32 APIs,
# not because the assembly captures input.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 100000
  size_max: 5000000
traits:
  - id: vanara-user32-pinvoke
    desc: Vanara User32 P/Invoke assembly
    if:
      type: path
      regex: '(?i)Vanara\.PInvoke\.User32\.dll'
