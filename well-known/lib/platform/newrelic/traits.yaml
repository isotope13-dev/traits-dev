defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: newrelic-go-agent-module-path
    desc: New Relic Go agent module path
    if:
      type: text
      substr: github.com/newrelic/go-agent

  - id: newrelic-package-declaration
    desc: New Relic Go agent package declaration
    if:
      type: text
      regex: '(?m)^package newrelic\b'

composite_rules:
  - id: newrelic-go-agent-source-context
    desc: New Relic Go APM agent source
    crit: notable
    conf: 0.99
    any:
      - id: newrelic-go-agent-module-path
      - id: newrelic-package-declaration
