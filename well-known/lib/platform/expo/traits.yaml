# Expo universal React Native platform and framework (github.com/expo/expo).
defaults:
  platforms: [unix, windows, android]
  conf: 0.99
  crit: notable

traits:
  - id: repository-url
    desc: Expo upstream GitHub repository
    for: [package.json, markdown, text, source, scripts]
    if:
      type: text
      substr: 'github.com/expo/expo'
      case_insensitive: true

  - id: expoview-package-name
    desc: Expo Go Exponent Android package name
    for: [xml, java, kotlin, gradle]
    if:
      type: text
      substr: 'host.exp.exponent'

  - id: expo-module-path
    desc: Expo framework package or app path
    for: [source, scripts, manifests, data]
    size_max: 50000000
    if:
      type: path
      regex: '(?i)(apps|packages)[/\\]expo'

composite_rules:
  - id: expo-framework-context
    desc: Expo universal React Native framework context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: repository-url
      - id: expoview-package-name
      - id: expo-module-path
