defaults:
  size_max: 52428800
  platforms: [linux, macos, windows]
  for: [pe, dll, python, zip, tar]

traits:
  - id: windows-extension-export
    desc: psutil Windows Python extension export
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: export
      exact: PyInit__psutil_windows

  - id: windows-extension-filename
    desc: psutil Windows extension filename
    crit: notable
    conf: 0.95
    for: [pe, python]
    if:
      type: text
      word: _psutil_windows.pyd
      section: rdata
  - id: python-library-docstring
    desc: psutil library module docstring
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      substr: psutil is a cross-platform library

composite_rules:
  - id: python-package
    desc: psutil Python library package
    crit: notable
    conf: 0.98
    any:
      - id: well-known/lib/platform/psutil::python-package-path
      - id: python-library-docstring
