# Linux Containers (LXC) shared runtime library (liblxc.so).
# Identifies the upstream LXC C runtime via SONAME, discriminating exported
# container lifecycle symbols, and LXC's memfd rexec environment marker.
# Dual-use container management primitives remain notable; this rule records
# library identity only and never grants a blanket exception.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
  size_min: 65536
  size_max: 20971520

traits:
  - id: liblxc-soname
    desc: liblxc shared object SONAME
    crit: component
    if:
      type: value
      path: elf.soname
      regex: '^liblxc\.so(\.[0-9]+)*$'

  - id: lxc-container-new-symbol
    desc: References lxc_container_new symbol
    crit: component
    if:
      type: symbol
      exact: lxc_container_new

  - id: lxc-get-wait-states-symbol
    desc: References lxc_get_wait_states symbol
    crit: component
    if:
      type: symbol
      exact: lxc_get_wait_states

  - id: lxc-log-init-symbol
    desc: References lxc_log_init symbol
    crit: component
    if:
      type: symbol
      exact: lxc_log_init

  - id: lxc-get-global-config-item-symbol
    desc: References lxc_get_global_config_item symbol
    crit: component
    if:
      type: symbol
      exact: lxc_get_global_config_item

  - id: lxc-memfd-rexec-env-marker
    desc: LXC_MEMFD_REXEC re-exec marker in .rodata
    crit: component
    if:
      type: text
      section: .rodata
      exact: LXC_MEMFD_REXEC

composite_rules:
  - id: liblxc-shared-library
    desc: Linux Containers (LXC) shared library
    crit: notable
    conf: 0.99
    all:
      - id: liblxc-soname
      - id: lxc-container-new-symbol
      - id: lxc-get-wait-states-symbol
      - id: lxc-log-init-symbol
      - id: lxc-get-global-config-item-symbol
      - id: lxc-memfd-rexec-env-marker
