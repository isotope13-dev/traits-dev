# go-diskfs — Go library for manipulating disks, disk images and filesystems
# natively (ext4, FAT, ISO9660, SquashFS, MBR/GPT partition tables) without
# mounting. Opening block devices, parsing boot sectors, and reading
# partition tables is this library's stated purpose, so its identity is the
# benign context for those capabilities elsewhere.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: diskfs/go-diskfs module source path
    if:
      type: path
      regex: 'github\\.com/diskfs/go-diskfs(@|@v)'

  - id: module-import-path
    desc: diskfs/go-diskfs module import path
    if:
      type: text
      substr: github.com/diskfs/go-diskfs

  - id: library-summary-marker
    desc: go-diskfs library summary marker
    if:
      type: text
      substr: 'library for performing manipulation of disks'
