# libhd, the hardware-probing library behind openSUSE's hwinfo (not the
# Windows HWiNFO product). It identifies the machine it runs on, so it asks
# the VMware backdoor port whether it is a VMware guest and checks for acpid,
# just as installers and inventory agents do.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
  size_min: 256
  size_max: 20000000

traits:
  - id: libhd-soname
    desc: libhd hardware probing library soname
    if:
      type: value
      path: elf.soname
      regex: '^libhd\.so\.[0-9]+$'

  - id: hd-probe-api-export
    desc: libhd hd_probe_feature API export
    if:
      type: symbol
      exact: hd_probe_feature

composite_rules:
  - id: hardware-probe-library
    desc: openSUSE libhd hardware probing library
    crit: exception
    all:
      - id: libhd-soname
      - id: hd-probe-api-export
