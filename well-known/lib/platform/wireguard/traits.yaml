# WireGuard for Windows implements its own UAC elevation helper and WFP
# firewall rules as part of the VPN client.
defaults:
  platforms: [windows]
  for: [zip, go]
  crit: notable
  conf: 0.99

traits:
  - id: wireguard-windows-source-path
    desc: WireGuard for Windows source member path
    if:
      type: path
      regex: 'windows@'

  - id: wireguard-elevation-source-path
    desc: WireGuard elevation source member path
    if:
      type: path
      regex: '(^|[\\/])elevate[\\/]'

composite_rules:
  - id: wireguard-windows-source-context
    desc: Recognized WireGuard for Windows source package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: wireguard-windows-source-path
      - id: wireguard-elevation-source-path
