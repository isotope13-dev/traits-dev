defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: mfc-ccmdtarget
  desc: MFC CCmdTarget class string
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: CCmdTarget
    section: .rdata
- id: mfc-cwinapp
  desc: MFC CWinApp class string
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: CWinApp
    section: .rdata
- id: mfc-afx-window-classes
  desc: MFC Afx window class strings
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: Afx(ControlBar|MDIFrame|FrameOrView|OleControl)
    section: .rdata
- id: mfc-symbols
  desc: AfxWinMain symbol reference
  crit: notable
  conf: 0.95
  if:
    type: symbol
    substr: AfxWinMain
composite_rules:
- id: mfc-application-framework
  desc: MFC class and symbol references
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: mfc-ccmdtarget
  - id: mfc-cwinapp
  - id: metadata/binary/symbols/name/token/runtime::cdialog-class-name-text
  - id: mfc-afx-window-classes
  - id: mfc-symbols
- id: mfc-application-dialog-framework
  desc: MFC application and dialog class references
  crit: notable
  conf: 0.92
  all:
  - id: mfc-cwinapp
  - id: metadata/binary/symbols/name/token/runtime::cdialog-class-name-text
