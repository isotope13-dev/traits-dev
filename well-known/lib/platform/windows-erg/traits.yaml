defaults:
  platforms: [unix, windows]
  # Include manifests as well as source and crate archives.
  for: [rust, source, cargo.toml, crate]
  size_max: 500000000

traits:
  - id: windows-erg-crate-path
    desc: windows-erg Windows API wrapper crate context
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)windows-erg-[0-9][^\\/]*(\.crate|[\\/])'
