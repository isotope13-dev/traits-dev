defaults:
  platforms: [unix, windows]
  # `cargo.toml` is its own file type. The rules this identity exempts --
  # objectives/supply-chain/hidden-payload/package::cargo-wdk-service-loader-memory
  # and ::cargo-wininet-lowlevel-loader -- read the manifest's feature list,
  # so without it here the carve-out could never fire on the file that
  # triggers them.
  for: [rust, archives, source, cargo.toml]
  size_max: 500000000

traits:
  - id: windows-erg-crate-path
    desc: windows-erg Windows API wrapper crate context
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(?i)windows-erg-[0-9][^\\/]*(\.crate|[\\/])'
