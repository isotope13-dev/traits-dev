# Microsoft catsrv.dll and catsrvut.dll are COM+ Configuration Catalog
# components. They legitimately contain COM registration data, event/file
# mapping coordination, and a rundll32/comsvcs MiniDump diagnostic path, so
# identify the complete system-library context before applying generic abuse
# heuristics. Some distributed builds retain only the PDB basename rather
# than the compiler source-tree path, so the source-tree marker is supporting
# evidence rather than a requirement for the utility identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 262144
  size_max: 1048576
  crit: notable
  conf: 0.99

traits:
  - id: catsrv-original-filename
    desc: COM+ catalog server original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: catsrv.DLL
      case_insensitive: true

  - id: catsrv-internal-name
    desc: COM+ catalog server internal DLL name
    if:
      type: value
      path: pe.version.internal_name
      exact: catsrv.DLL
      case_insensitive: true

  - id: catsrv-description
    desc: COM+ catalog server version description
    if:
      type: value
      path: pe.version.description
      exact: COM+ Configuration Catalog Server
      case_insensitive: true

  - id: catsrv-pdb
    desc: COM+ catalog server PDB filename
    if:
      type: value
      path: pe.debug.pdb.path
      exact: catsrv.pdb
      case_insensitive: true

  - id: catsrv-source-tree
    desc: COM+ catalog server source tree marker
    if:
      type: text
      regex: '(?i)com[\\/]complus[\\/]src[\\/]comcat[\\/]catsrv[\\/]'
      section: .rdata

  - id: catsrv-component-library-export
    desc: COM+ component library export
    if:
      type: export
      exact: CreateComponentLibraryTS

  - id: catsrv-component-library-open-export
    desc: COM+ component library open export
    if:
      type: export
      exact: OpenComponentLibraryTS

  - id: catsrv-catalog-clerk-export
    desc: COM+ catalog clerk export
    if:
      type: export
      exact: GetCatalogCRMClerk

  - id: catsrvut-original-filename
    desc: COM+ catalog utility original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: catsrvut.DLL
      case_insensitive: true

  - id: catsrvut-internal-name
    desc: COM+ catalog utility internal DLL name
    if:
      type: value
      path: pe.version.internal_name
      exact: catsrvut.DLL
      case_insensitive: true

  - id: catsrvut-description
    desc: COM+ catalog utility version description
    if:
      type: value
      path: pe.version.description
      exact: COM+ Configuration Catalog Server Utilities
      case_insensitive: true

  - id: catsrvut-pdb
    desc: COM+ catalog utility PDB filename
    if:
      type: value
      path: pe.debug.pdb.path
      exact: catsrvut.pdb
      case_insensitive: true

  - id: catsrvut-source-tree
    desc: COM+ catalog utility source tree marker
    if:
      type: text
      regex: '(?i)com[\\/]complus[\\/]src[\\/]comcat[\\/]catsrvut[\\/]'
      section: .rdata

  - id: catsrvut-assembly-export
    desc: COM+ assembly discovery export
    if:
      type: export
      exact: FindAssemblyModulesW

  - id: catsrvut-managed-request-export
    desc: COM+ managed request export
    if:
      type: export
      exact: ManagedRequestW

composite_rules:
  - id: microsoft-catsrv-library
    desc: Microsoft COM+ Configuration Catalog Server DLL
    crit: notable
    conf: 0.995
    all:
      - id: catsrv-original-filename
      - id: catsrv-internal-name
      - id: catsrv-description
      - id: catsrv-pdb
      - id: catsrv-source-tree
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: catsrv-component-library-export
      - id: catsrv-component-library-open-export
      - id: catsrv-catalog-clerk-export

  - id: microsoft-catsrv-library-context
    desc: Recognized Microsoft COM+ catalog server context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-catsrv-library
      - id: microsoft-catsrv-core-context

  - id: microsoft-catsrv-core-context
    desc: Recognized catsrv core identity context
    crit: exception
    conf: 1.0
    all:
      - id: catsrv-internal-name
      - id: catsrv-description

  - id: microsoft-catsrvut-library
    desc: Microsoft COM+ catalog utility DLL
    crit: notable
    conf: 0.995
    all:
      - id: catsrvut-original-filename
      - id: catsrvut-internal-name
      - id: catsrvut-description
      - id: catsrvut-pdb
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: catsrvut-assembly-export
      - id: catsrvut-managed-request-export

  - id: microsoft-catsrvut-library-context
    desc: Recognized Microsoft COM+ catalog utility context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-catsrvut-library
      - id: catsrvut-managed-request-export
