# Microsoft Windows WoW64 implementation DLLs. These files expose a broad
# native NT API surface because they implement the 32-bit-on-64-bit boundary;
# this identity uses several independent PE fields.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
  size_max: 524288

traits:
  - id: wow64-original-filename
    desc: WoW64 DLL OriginalFilename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: wow64.dll
      case_insensitive: true

  - id: wow64-internal-name
    desc: WoW64 DLL InternalName metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: wow64
      case_insensitive: true

  - id: wow64-description
    desc: WoW64 Win32 emulation description metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Win32 Emulation on NT64
      case_insensitive: true

  - id: wow64-pdb
    desc: WoW64 PDB filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      exact: wow64.pdb
      case_insensitive: true

  - id: wow64-system-service-export
    desc: WoW64 system-service export
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: Wow64SystemService

  - id: wow64-system-service-ex-export
    desc: WoW64 extended system-service export
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: Wow64SystemServiceEx

  - id: wow64-startup-context-export
    desc: WoW64 startup context conversion export
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: Wow64StartupContextToContextX86

composite_rules:
  - id: microsoft-wow64-dll
    desc: Microsoft Windows WoW64 system DLL
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: wow64-original-filename
      - id: wow64-internal-name
      - id: wow64-description
    any:
      - id: wow64-pdb
      - id: wow64-system-service-export
      - id: wow64-system-service-ex-export
      - id: wow64-startup-context-export
    needs: 2

  - id: microsoft-wow64-system-context
    desc: Microsoft WoW64 system DLL implementation context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-wow64-dll
      - id: wow64-pdb
