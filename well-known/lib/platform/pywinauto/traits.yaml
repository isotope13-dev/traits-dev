# pywinauto — Windows GUI automation and testing library (pywinauto/pywinauto).
# RemoteMemoryBlock uses VirtualAllocEx/WriteProcessMemory to marshal control
# data into the target application process, not shellcode injection.
defaults:
  platforms: [windows]
  for: [pkginfo, whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-package-name
    desc: pywinauto Python wheel package name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: pywinauto

  - id: github-homepage
    desc: pywinauto GitHub project homepage
    if:
      type: value
      path: home-page
      regex: '(?i)github\.com/pywinauto/pywinauto'

  - id: package-member-path
    desc: pywinauto package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])pywinauto[\\/]'

  - id: remote-memory-block-module
    desc: pywinauto remote memory marshalling module
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])pywinauto[\\/]remote_memory_block\.py$'

  - id: remote-memory-block-class
    desc: pywinauto RemoteMemoryBlock class
    for: [python]
    if:
      type: text
      substr: class RemoteMemoryBlock

composite_rules:
  - id: pywinauto-windows-gui-automation
    desc: pywinauto Windows GUI automation library
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: wheel-package-name
      - id: github-homepage
      - id: package-member-path
      - id: remote-memory-block-class

  - id: remote-memory-block-context
    desc: pywinauto remote process memory marshalling
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: remote-memory-block-module
      - id: remote-memory-block-class
