# SACK (System Abstraction Component Kit) / sack.vfs (d3x0r) — cross-platform
# system abstraction toolkit and Node.js native addon (https://github.com/d3x0r/sack.vfs).
# Provides low-level filesystem, process control, networking, TLS, and SQLite/ODBC
# integration.
defaults:
  platforms: [windows, unix]
  conf: 0.99

traits:
  - id: sack-repository-path
    desc: SACK or sack.vfs repository path
    crit: notable
    for: [source, scripts, manifests, documents, data, tar, zip, binaries]
    size_max: 300000000
    if:
      type: path
      regex: '(?i)(^|[\\/])sack\.vfs(-HEAD)?[\\/]'

  - id: sack-vfs-package-manifest
    desc: SACK VFS npm package manifest
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: sack.vfs

  - id: sack-vfs-define
    desc: SACK VFS source preprocessor definition
    crit: notable
    for: [c, cpp]
    if:
      type: text
      exact: '#define SACK_VFS_SOURCE'

  - id: sack-vfs-class-name
    desc: SACK VFS JavaScript wrapper class
    crit: notable
    for: [c, cpp]
    if:
      type: text
      substr: '"sack.vfs.'

  - id: sack-cmake-project
    desc: SACK VFS CMake project name
    crit: notable
    for: [cmake]
    if:
      type: text
      regex: 'project\s*\(\s*sack_vfs\s*\)'

composite_rules:
  - id: sack-source-tree
    desc: Recognized SACK source tree
    crit: notable
    conf: 0.99
    for: [source, scripts, manifests, documents, data, tar, zip, binaries]
    any:
      - id: sack-repository-path
      - id: sack-vfs-define
      - id: sack-vfs-class-name
      - id: sack-vfs-package-manifest
      - id: sack-cmake-project
