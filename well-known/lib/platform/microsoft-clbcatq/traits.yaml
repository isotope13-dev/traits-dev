# CLBCATQ.DLL is the Microsoft COM+ Configuration Catalog. Its catalog data
# includes COM registration values and a diagnostic rundll32/comsvcs MiniDump
# command marker, so identify the complete signed system-library context before
# applying generic persistence and process-dump heuristics.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 300000
  size_max: 1000000
  crit: notable
  conf: 0.99

traits:
  - id: clbcatq-original-filename
    desc: COM+ catalog DLL original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: CLBCATQ.DLL
      case_insensitive: true

  - id: clbcatq-internal-name
    desc: COM+ catalog DLL internal name
    if:
      type: value
      path: pe.version.internal_name
      exact: CLBCATQ.DLL
      case_insensitive: true

  - id: clbcatq-description
    desc: COM+ Configuration Catalog description
    if:
      type: value
      path: pe.version.description
      exact: COM+ Configuration Catalog
      case_insensitive: true

  - id: clbcatq-pdb
    desc: COM+ catalog PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])clbcatq\.pdb$'

composite_rules:
  - id: microsoft-clbcatq-library
    desc: Microsoft COM+ Configuration Catalog DLL
    all:
      - id: clbcatq-original-filename
      - id: clbcatq-internal-name
      - id: clbcatq-description
      - id: clbcatq-pdb
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/platform::microsoft

  - id: microsoft-clbcatq-library-context
    desc: Recognized Microsoft COM+ catalog library context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-clbcatq-library
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
