# Wine builtin PE markers identify compatibility-runtime context.
# The DOS-stub marker is at offset 64; the other marker names a debug symbol.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: wine-builtin-header-text
    desc: Wine builtin marker at DOS stub offset
    if:
      type: text
      exact: Wine builtin DLL
      offset: 64
  - id: wine-debug-channel-symbol
    desc: Wine debug-channel runtime symbol
    if:
      type: symbol
      regex: '^__wine_dbg_[a-z_]{3,30}$'

composite_rules:
  - id: wine-builtin-binary
    desc: Wine builtin Windows-API binary
    crit: notable
    conf: 0.99
    any:
      - id: wine-builtin-header-text
      - id: wine-debug-channel-symbol
