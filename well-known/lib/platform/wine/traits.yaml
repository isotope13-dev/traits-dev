defaults:
  platforms: [windows, unix]
  for:
    - pe
    - dll
    - elf
  size_max: 104857600
traits:
  - id: wine-builtin-dll-marker
    desc: Wine builtin DLL marker
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: Wine builtin DLL
      # Wine replaces the conventional DOS stub message with this marker.
      offset_range: [0, 256]
  - id: wine-debug-symbols
    desc: Wine debug/runtime symbols
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: __wine_dbg_
      section: rdata
  - id: widl-generated-typelib
    desc: WIDL-generated COM type library stamp
    crit: notable
    conf: 0.97
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: "Created by WIDL version"
      section: rsrc
  - id: wine-registry-resource-prefix
    desc: Wine builtin registry resource prefix
    crit: notable
    conf: 0.96
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: WINE_REGISTRY
      section: rdata
  - id: wine-dlls-pstorec-resource
    desc: Wine pstorec typelib resource path
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: DLLS/PSTOREC/
      section: rsrc
  - id: wine-pstore-typelib-title
    desc: Wine PStore COM type library title
    crit: notable
    conf: 0.96
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: PStore 1.0 Type Library
      section: rsrc
  - id: winecrt0-path
    desc: Wine CRT source path
    crit: component
    conf: 0.95
    if:
      type: text
      substr: dlls/winecrt0
      section: rdata
  - id: wine-debug-channel
    desc: Wine debug channel marker
    crit: baseline
    conf: 0.95
    for: [elf, c, cpp]
    platforms: [linux]
    if:
      type: text
      substr: WINE_DEFAULT_DEBUG_CHANNEL
  - id: wine-source-tree
    desc: Wine source tree member
    crit: notable
    conf: 0.98
    for: [source, scripts, manifests, documents, data, archives, binaries]
    size_max: 300000000
    if:
      type: path
      substr: wine-10.0/
composite_rules:
  - id: wine-runtime-component
    desc: Wine runtime component
    crit: component
    conf: 0.98
    any:
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      - id: well-known/lib/platform/wine::wine-debug-channel
      - id: well-known/lib/platform/wine::wine-debug-symbols
      - id: well-known/lib/platform/wine::winecrt0-path
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/lib/platform/wine::widl-generated-typelib
      - id: well-known/lib/platform/wine::wine-registry-resource-prefix
      - id: well-known/lib/platform/wine::wine-dlls-pstorec-resource
      - id: well-known/lib/platform/wine::wine-pstore-typelib-title
  - id: wine-protected-storage-provider
    desc: Wine Protected Storage provider DLL
    crit: notable
    conf: 0.99
    all:
      - id: wine-builtin-dll-marker
      - id: micro-behaviors/os/security/protected-storage::get-pstore-provider-export
      - id: micro-behaviors/os/security/protected-storage::pstore-create-instance-export
      - id: micro-behaviors/os/security/protected-storage::pstore-enumeration-export
      - id: wine-dlls-pstorec-resource
