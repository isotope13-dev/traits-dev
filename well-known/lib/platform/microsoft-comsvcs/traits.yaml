# COM+ Services is a Windows system library.  Its MiniDumpW export is a
# legitimate process-dump capability that is also commonly abused through
# rundll32, so identify the provider before applying abuse-oriented rules.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1000000
  size_max: 3000000

traits:
  - id: comsvcs-internal-name
    desc: COM+ Services internal DLL name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: COMSVCS.DLL
      case_insensitive: true

  - id: comsvcs-description
    desc: COM+ Services version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: COM+ Services
      case_insensitive: true

  - id: comsvcs-pdb
    desc: COM+ Services PDB filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])comsvcs\.pdb$'

  - id: comsvcs-source-tree
    desc: COM+ Services source tree marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)com[\\/]complus[\\/]src[\\/]comsvcs[\\/]'
      section: .text

  - id: comsvcs-minidump-export
    desc: COM+ Services MiniDumpW export
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: MiniDumpW

composite_rules:
  - id: microsoft-comsvcs-library
    desc: Microsoft COM+ Services system library
    crit: notable
    conf: 0.995
    all:
      - id: comsvcs-internal-name
      - id: comsvcs-description
      - id: comsvcs-pdb
      - id: comsvcs-source-tree
      - id: comsvcs-minidump-export
      - id: metadata/binary/vendor::microsoft-prefixed-company

  - id: microsoft-comsvcs-library-context
    desc: Recognized Microsoft COM+ Services library context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-comsvcs-library
      - id: metadata/binary/symbols/exports::com-export-pair
