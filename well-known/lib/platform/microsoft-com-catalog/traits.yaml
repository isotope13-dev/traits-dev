# Microsoft COM+ catalog/service DLLs legitimately contain registration data
# and diagnostic command markers. Identify this bounded system-library family
# before applying generic persistence or process-dump heuristics.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 100000
  size_max: 3000000
  crit: notable
  conf: 0.99

traits:
  - id: microsoft-com-catalog-filename
    desc: Microsoft COM+ catalog or service DLL filename
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^(CLBCATQ|CATSRV|CATSRVUT|COMSVCS)\.DLL$'

  - id: microsoft-com-catalog-description
    desc: Microsoft COM+ catalog or service description
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^COM\+ (Configuration Catalog( Server( Utilities)?)?|Services)$'

composite_rules:
  - id: microsoft-com-catalog-library
    desc: Microsoft COM+ catalog or services system library
    all:
      - id: microsoft-com-catalog-filename
      - id: microsoft-com-catalog-description
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
      - id: metadata/signed/platform::microsoft

  - id: microsoft-com-catalog-context
    desc: Recognized Microsoft COM+ catalog or services context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-com-catalog-library
      - id: metadata/binary/vendor::microsoft-prefixed-company
