# watson/is-ci — detect whether the process is running on CI.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: is-ci npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: is-ci

  - id: vendored-path
    desc: is-ci package path
    if:
      type: path
      regex: '(^|[\\/])is-ci([\\/]|$)'
