defaults:
  conf: 0.99
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_min: 1
  size_max: 1073741824
traits:
- id: go-cpuid-vendor-table
  desc: klauspost/cpuid hypervisor vendor table
  for:
  - binaries
  if:
    type: text
    substr: TCGTCGTCGTCGMicrosoft HvVMwareVMwareXenVMMXenVMMbhyve bhyve
- id: go-cpuid-native-symbols
  desc: Compiled klauspost/cpuid namespace symbols
  for: [elf, pe, macho]
  count_min: 2
  if:
    type: symbol
    regex: '^github\.com/klauspost/cpuid/v2\.'
composite_rules:
- id: go-klauspost-cpuid-library
  desc: Compiled klauspost/cpuid implementation
  any:
  - id: go-cpuid-vendor-table
  - id: go-cpuid-native-symbols
