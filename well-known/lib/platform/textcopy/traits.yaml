# TextCopy (https://github.com/CopyText/TextCopy) — .NET clipboard library.
# On Windows it shells out to PowerShell Get-Clipboard/Set-Clipboard with
# redirected stdio; that is the documented clipboard backend, not an MSI
# implant PowerShell cluster.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 5000000

traits:
  - id: textcopy-product-name
    desc: TextCopy product name metadata
    if:
      type: value
      path: pe.version.product_name
      exact: TextCopy

  - id: textcopy-original-filename
    desc: TextCopy.dll original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: TextCopy.dll

  - id: textcopy-github-repo
    desc: CopyText/TextCopy GitHub repository URL
    if:
      type: text
      section: .rdata
      substr: 'github.com/CopyText/TextCopy'

composite_rules:
  - id: textcopy-dotnet-clipboard-library
    desc: TextCopy .NET clipboard library
    conf: 0.99
    needs: 2
    any:
      - id: textcopy-product-name
      - id: textcopy-original-filename
      - id: textcopy-github-repo
