defaults:
  platforms: [unix, windows]
  for: [ipa]
  crit: notable
traits:
  - id: substrate-dylib-reference
    desc: Substrate dylib name reference
    conf: 0.95
    if:
      type: text
      exact: libsubstrate.dylib
  - id: mobile-substrate-reference
    desc: MobileSubstrate name reference
    conf: 0.9
    if:
      type: text
      substr: MobileSubstrate
  - id: mshookfunction-reference
    desc: MSHookFunction name reference
    conf: 0.9
    if:
      type: text
      substr: MSHookFunction
