# Microsoft WinINet is the Windows Internet Extensions system library.
#
# The implementation legitimately contains network, cookie, cache, registry,
# credential, and file-management code.  Keep this identity narrow so those
# capabilities are not mistaken for attacker intent when the implementation
# itself is scanned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 500000
  size_max: 2000000

traits:
  - id: wininet-original-filename
    desc: WinINet original filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: wininet.dll
      case_insensitive: true

  - id: wininet-internal-name
    desc: WinINet internal DLL name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: wininet.dll
      case_insensitive: true

  - id: wininet-description
    desc: WinINet version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Internet Extensions for Win32

  - id: wininet-manifest-identity
    desc: WinINet side-by-side manifest identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Windows.WinINET

  - id: wininet-pdb
    desc: WinINet PDB filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])wininet\.pdb$'

composite_rules:
  - id: microsoft-wininet-library
    desc: Microsoft Windows WinINet system library
    crit: notable
    conf: 0.999
    all:
      - id: wininet-original-filename
      - id: wininet-internal-name
      - id: wininet-description
      - id: wininet-manifest-identity
      - id: wininet-pdb
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: micro-behaviors/communications/http/get::internet-open

  - id: wininet-system-context
    desc: Recognized Microsoft WinINet system context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-wininet-library
      - id: metadata/binary/vendor::microsoft-prefixed-company
