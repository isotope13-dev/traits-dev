# @parcel/watcher native filesystem-event addon.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
  size_max: 5000000

traits:
  - id: watcher-build-pdb
    desc: Watcher addon build PDB path
    crit: component
    conf: 0.94
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]watcher[\\/]watcher[\\/]build[\\/]Release[\\/]watcher\.pdb$'

  - id: parcel-prefix
    desc: Parcel watcher string prefix
    crit: component
    conf: 0.9
    if:
      type: text
      exact: parcel-
      section: .rdata

  - id: watcher-node-module-name
    desc: Watcher Node addon module name
    crit: component
    conf: 0.92
    if:
      type: text
      exact: watcher.node
      section: .rdata

composite_rules:
  - id: parcel-watcher-native-addon
    desc: Parcel watcher native addon
    crit: notable
    conf: 0.99
    all:
      - id: watcher-build-pdb
      - id: parcel-prefix
      - id: watcher-node-module-name
      - id: metadata/binary/framework::node-api-addon-export
