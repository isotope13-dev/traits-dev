# @parcel/watcher — the native filesystem-event addon (watcher.node) and the
# npm packages that ship it. The addon is routinely bundled into single-file
# executables (Bun/pkg builds) and recovered as a carved PE, so identity comes
# from build/provenance strings rather than the file name.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable

traits:
  - id: parcel-watcher-build-pdb-path
    desc: Parcel watcher addon PDB build path
    crit: notable
    conf: 0.96
    size_min: 65536
    size_max: 5000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]watcher[\\/]watcher[\\/]build[\\/]Release[\\/]watcher\.pdb$'

  - id: parcel-watchman-name-prefix
    desc: Parcel watchman subscription name prefix
    crit: notable
    conf: 0.9
    size_min: 65536
    size_max: 5000000
    if:
      type: text
      exact: parcel-
      section: .rdata

  - id: watcher-node-module-name
    desc: watcher.node addon module name string
    crit: notable
    conf: 0.92
    size_min: 65536
    size_max: 5000000
    if:
      type: text
      exact: watcher.node
      section: .rdata

  - id: parcel-watcher-package-name
    desc: '@parcel/watcher npm package name'
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@parcel/watcher$'

  - id: parcel-watcher-prebuild-package-name
    desc: '@parcel/watcher platform prebuild package name'
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@parcel/watcher-[a-z0-9-]+$'

  # The JS loader that picks the platform-specific prebuilt addon. Unlike the
  # build/provenance strings above, this one identifies the package from its
  # own source rather than from the carved native addon.
  - id: parcel-watcher-native-loader
    desc: Parcel watcher native loader
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: '@parcel/watcher-${process.platform}-${process.arch}'

composite_rules:
  - id: parcel-watcher-native-addon
    desc: Parcel watcher native addon
    crit: notable
    conf: 0.99
    all:
      - id: parcel-watcher-build-pdb-path
      - id: parcel-watchman-name-prefix
      - id: watcher-node-module-name
      - id: metadata/binary/framework::node-api-addon-export
