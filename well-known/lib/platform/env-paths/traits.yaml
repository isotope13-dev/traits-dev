# sindresorhus/env-paths — OS-specific data/config/cache paths.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: env-paths-package-name
    desc: env-paths package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: env-paths

  - id: env-paths-package-path
    desc: env-paths package member path
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])env-paths([/\\]|$)'
