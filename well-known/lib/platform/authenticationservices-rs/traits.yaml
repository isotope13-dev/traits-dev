# authenticationservices-rs — Safe Rust bindings for Apple's
# AuthenticationServices (Sign in with Apple, passkeys) on macOS.
# Example/build process spawn is cargo smoke-test, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [crate, cargo.toml, rust, markdown]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 5000000

traits:
  - id: crate-name
    desc: authenticationservices-rs crate archive name
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.name
      exact: authenticationservices-rs

  - id: crate-repository
    desc: authenticationservices-rs crate repository
    for: [crate]
    conf: 0.99
    if:
      type: value
      path: crate.repository
      substr: github.com/doom-fish/authenticationservices-rs

  - id: cargo-package-name
    desc: authenticationservices-rs Cargo package name
    for: [cargo.toml]
    conf: 0.99
    if:
      type: value
      path: package.name
      exact: authenticationservices-rs

  - id: github-repo
    desc: authenticationservices-rs GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/doom-fish/authenticationservices-rs
