defaults:
  platforms: [windows]
  for: [pe, c, cpp, batch, powershell]
  crit: notable
  size_min: 7
traits:
  - id: advpack-delnode-entrypoint-text
    desc: Advpack DelNodeRunDLL32 entrypoint text
    conf: 0.94
    if:
      type: text
      substr: advpack.dll,DelNodeRunDLL32
  - id: advpack-delnode-rundll32
    desc: Rundll32 Advpack DelNode command template
    conf: 0.95
    count_min: 2
    if:
      type: text
      exact: rundll32.exe %sadvpack.dll,DelNodeRunDLL32 "%s"
