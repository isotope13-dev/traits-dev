# Tmds.LibC (https://github.com/tmds/Tmds.LibC) provides raw bindings to Linux
# platform APIs for .NET Core. Like other libc and platform bindings, it exposes
# POSIX socket protocol constants (IPPROTO_RAW, IP_HDRINCL) in its public API
# surface for consumers rather than performing raw socket manipulation itself.
defaults:
  platforms: [linux, windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 5000000

traits:
  - id: tmds-libc-assembly
    desc: Tmds.LibC POSIX platform binding assembly
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: Tmds.LibC
