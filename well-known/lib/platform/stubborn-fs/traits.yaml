# stubborn-fs / stubborn-utils — retrying filesystem helpers used by atomically.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: stubborn-fs-package-name
    desc: stubborn-fs package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: stubborn-fs

  - id: stubborn-fs-package-path
    desc: stubborn-fs package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)stubborn-fs[/\\]dist'

  - id: stubborn-utils-package-name
    desc: stubborn-utils package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: stubborn-utils

  - id: stubborn-utils-package-path
    desc: stubborn-utils package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)stubborn-utils[/\\]dist'
