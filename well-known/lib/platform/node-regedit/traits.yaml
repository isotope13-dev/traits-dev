# node-regedit (regedit) — Windows registry access via VBScript helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, vbs]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: regedit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: regedit
  - id: upstream-repository
    desc: node-regedit repository url
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/kessler/node-regedit'
  - id: vendored-path
    desc: vendored regedit package path
    for: [scripts, manifests, data, source, vbs]
    if:
      type: path
      regex: 'node_modules/regedit/'
  - id: regedit-vbs-basename
    desc: regedit vbs helper basename
    for: [vbs]
    if:
      type: path
      basename: true
      regex: '^(regUtil|Architecture(Specific|Agnostic)Registry)\.vbs$'

composite_rules:
  - id: node-regedit-library
    desc: node-regedit Windows registry helper library
    any:
      - id: package-name
      - id: upstream-repository
      - id: vendored-path
      - id: regedit-vbs-basename
