# Microsoft IeRtUtil (iertutil.dll) is the Internet Explorer runtime utility
# library. It embeds large Win32 API-name catalogs and IE configuration
# registry value names; generic abuse heuristics must not treat those as
# attacker intent when the implementation itself is scanned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 500000
  size_max: 8388608

traits:
  - id: iertutil-original-filename
    desc: IeRtUtil original filename metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^iertutil\.dll$'

  - id: iertutil-internal-name
    desc: IeRtUtil internal DLL name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^iertutil\.dll$'

  - id: iertutil-description
    desc: IeRtUtil version description
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: Run time utility for Internet Explorer

  - id: iertutil-pdb
    desc: IeRtUtil PDB filename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])iertutil\.pdb$'

composite_rules:
  - id: microsoft-iertutil-library
    desc: Microsoft Internet Explorer runtime utility library
    crit: notable
    conf: 0.999
    all:
      - id: iertutil-original-filename
      - id: iertutil-internal-name
      - id: iertutil-description
      - id: metadata/binary/vendor::microsoft-prefixed-company
    any:
      - id: iertutil-pdb
      - id: metadata/signed/leaf::microsoft-corporation
    needs: 1

  - id: microsoft-iertutil-system-context
    desc: Recognized Microsoft IeRtUtil system context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-iertutil-library
      - id: metadata/signed/leaf::microsoft-corporation
