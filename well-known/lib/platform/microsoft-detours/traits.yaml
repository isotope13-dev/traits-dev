# Microsoft Detours is an open-source software library for monitoring and
# instrumenting API calls on Windows (github.com/microsoft/Detours).
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, source, tar, zip]
  crit: notable
  conf: 0.95
  size_max: 50000000

traits:
  - id: detours-section-marker
    desc: Microsoft Detours transaction section
    for: [pe, dll]
    size_min: 4096
    size_max: 50000000
    if:
      type: section
      substr: .detourc

  - id: source-header-banner
    desc: Microsoft Detours header banner in source
    for: [c, cpp, source]
    conf: 0.98
    size_max: 5000000
    if:
      type: text
      substr: 'Microsoft Research Detours Package'

  - id: source-path
    desc: Microsoft Detours repository or source tree path
    for: [c, cpp, source, manifests, text]
    conf: 0.98
    size_max: 50000000
    if:
      type: path
      regex: '(?i)(^|[\\/])(Detours-[0-9a-f]{7,40}|detours-e4bfd6b)[\\/]'

  - id: archive-name
    desc: Microsoft Detours release archive name
    for: [tar, zip]
    conf: 0.98
    size_max: 50000000
    if:
      type: path
      regex: '(?i)(^|[\\/])detours-[0-9a-f]{7,40}\.tar\.gz'

composite_rules:
  - id: detours-source
    desc: Microsoft Detours hooking library source
    crit: notable
    conf: 0.99
    any:
      - id: source-header-banner
      - id: source-path
      - id: archive-name
