# Squirrel.Windows updater vendor binaries (Squirrel/Squirrel.Windows).
#
# The Electron ecosystem vendors these exact binaries (electron-winstaller's
# vendor/, every Squirrel-based setup): the managed updater tools
# (Squirrel.exe, Squirrel-Mono.exe, SyncReleases.exe -- Company GitHub,
# InternalName Update*.exe) and the native launch stubs
# (StubExecutable.exe, WriteZipToSetup.exe -- no version resource, but the
# Squirrel.Windows build PDB path). They are routinely unsigned, use
# reflection/Activator plus symmetric crypto to verify update packages, and
# the stubs resolve APIs dynamically -- the same shapes as an
# encrypted-reflection loader and an API-resolver loader. That is the
# updater's normal function, not payload behavior.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 20000000

traits:
  - id: github-company
    desc: GitHub company metadata
    if:
      type: value
      path: pe.version.company
      exact: GitHub

  - id: updater-internal-name
    desc: Squirrel updater internal binary name
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^(Update(-Mono)?|SyncReleases)\.exe$'

  - id: stub-basename
    desc: Squirrel stub launcher basename
    if:
      type: basename
      regex: '(?i)^(StubExecutable|WriteZipToSetup)\.exe$'

  - id: squirrel-windows-build-pdb
    desc: Squirrel.Windows build PDB path
    if:
      type: text
      section: .rdata
      substr: squirrel.windows\build

composite_rules:
  - id: squirrel-managed-updater
    desc: Squirrel.Windows managed updater binary
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: github-company
      - id: updater-internal-name

  - id: squirrel-native-stub
    desc: Squirrel.Windows native stub launcher
    all:
      - id: stub-basename
      - id: squirrel-windows-build-pdb

  - id: squirrel-vendor-binary-context
    desc: Squirrel.Windows updater vendor binary
    crit: exception
    conf: 0.99
    any:
      - id: squirrel-managed-updater
      - id: squirrel-native-stub
