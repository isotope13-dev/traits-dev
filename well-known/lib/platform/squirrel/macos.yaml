# Squirrel's ShipIt helper is an updater-library identity, not evidence of
# quarantine evasion. Objective rules remain responsible for identifying an
# actual extended-attribute removal behavior.
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.98
  size_min: 10000
  size_max: 104857600

traits:
  - id: squirrel-updater-text-marker
    desc: Squirrel ShipIt helper name reference
    if:
      type: text
      section: __rodata
      regex: 'com\.github\.Squirrel|com\.googlecode\.ShipIt|ShipIt'

composite_rules:
  - id: squirrel-updater-helper
    desc: Squirrel updater helper binary
    all:
      - id: metadata/binary/framework::macos-updater-helper-name--shipit
      - id: squirrel-updater-text-marker
