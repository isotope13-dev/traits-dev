# libbpf — the eBPF userspace library. It vendors trimmed Linux kernel
# headers under include/linux/ and include/asm/ under a dual
# LGPL-2.1/BSD-2-Clause license, where the kernel originals carry GPL
# terms. eBPF tooling both benign (bcc/libbpf-tools, Cilium) and hostile
# vendors these files unchanged, so this is identity only; loading or
# hiding behaviour is claimed by the eBPF micro-behaviour traits.
defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: dual-license-banner
    desc: libbpf dual LGPL/BSD license banner
    crit: component
    if:
      type: text
      substr: 'SPDX-License-Identifier: (LGPL-2.1 OR BSD-2-Clause)'

  - id: err-ptr-api
    desc: Linux error-pointer helper API
    crit: component
    if:
      type: text
      substr: PTR_ERR_OR_ZERO

  - id: list-poison-constants
    desc: Linux intrusive list poison constants
    crit: component
    if:
      type: text
      substr: LIST_POISON1

  - id: overflow-check-api
    desc: Linux checked-arithmetic helper API
    crit: component
    if:
      type: text
      substr: check_mul_overflow

  - id: asm-barrier-guard
    desc: asm/barrier.h include guard
    crit: component
    if:
      type: text
      substr: __ASM_BARRIER_H

  - id: ring-buffer-helpers
    desc: perf ring-buffer head/tail helpers
    crit: component
    if:
      type: text
      substr: ring_buffer_read_head

composite_rules:
  - id: libbpf-linux-err-header
    desc: libbpf vendored Linux error-pointer header
    all:
      - id: dual-license-banner
      - id: err-ptr-api

  - id: libbpf-linux-list-header
    desc: libbpf vendored Linux intrusive-list header
    all:
      - id: dual-license-banner
      - id: list-poison-constants

  - id: libbpf-linux-overflow-header
    desc: libbpf vendored Linux overflow-check header
    all:
      - id: dual-license-banner
      - id: overflow-check-api

  - id: libbpf-asm-barrier-header
    desc: libbpf vendored asm barrier header
    all:
      - id: dual-license-banner
      - id: asm-barrier-guard

  - id: libbpf-linux-ring-buffer-header
    desc: libbpf vendored Linux perf ring-buffer header
    all:
      - id: dual-license-banner
      - id: ring-buffer-helpers
