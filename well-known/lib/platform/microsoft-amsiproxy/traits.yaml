# Microsoft AMSI proxy system DLL identity.  The description contains
# "Anti-Malware", but this file is a COM proxy stub rather than an anti-AV
# controller; use the complete identity before suppressing intent heuristics.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 8192
  size_max: 65536
  crit: notable
  conf: 0.99

traits:
  - id: amsiproxy-original-filename
    desc: AMSI proxy original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: amsiproxy.dll
      case_insensitive: true

  - id: amsiproxy-internal-name
    desc: AMSI proxy internal name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: amsiproxy0
      case_insensitive: true

  - id: amsiproxy-description
    desc: AMSI proxy version description
    if:
      type: value
      path: pe.version.description
      exact: Anti-Malware Scan Interface proxy
      case_insensitive: true

  - id: amsiproxy-pdb
    desc: AMSI proxy PDB filename metadata
    if:
      type: value
      path: pe.debug.pdb.path
      exact: amsiproxy.pdb
      case_insensitive: true

composite_rules:
  - id: microsoft-amsiproxy-dll
    desc: Microsoft AMSI proxy DLL identity
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: amsiproxy-original-filename
      - id: amsiproxy-internal-name
      - id: amsiproxy-description
    any:
      - id: amsiproxy-pdb
      - id: metadata/binary/symbols/exports::com-export-pair
    needs: 1

  - id: microsoft-amsiproxy-system-context
    desc: Microsoft AMSI proxy system-library context
    crit: exception
    conf: 1.0
    all:
      - id: microsoft-amsiproxy-dll
      - id: metadata/binary/symbols/exports::com-export-pair
