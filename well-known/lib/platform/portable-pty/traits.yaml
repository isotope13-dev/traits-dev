# portable-pty — cross-platform pseudoterminal library for Rust
# (https://github.com/wez/wezterm, portable-pty crate). Terminal
# emulators and multiplexer daemons built on it spawn the user's shell
# and proxy it over local sockets; that is local terminal service, not a
# remote shell backdoor.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.95

traits:
  - id: portable-pty-crate-reference
    desc: portable-pty crate registry path
    size_min: 512
    size_max: 500000000
    if:
      id: micro-behaviors/process/tty/pty::portable-pty-crate-path
