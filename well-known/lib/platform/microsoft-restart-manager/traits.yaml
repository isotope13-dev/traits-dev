# Microsoft Windows Restart Manager system DLL identity.
# The DLL legitimately references svchost.exe and embeds a hidden, temporary
# scheduled-task definition while coordinating application cleanup.
defaults:
  platforms: [windows]
  for: [dll, pe]
  crit: notable
  conf: 0.99
  size_min: 65536
  size_max: 5242880

traits:
  - id: restart-manager-original-filename
    desc: RstrtMgr.dll original filename metadata
    if:
      type: value
      path: pe.version.original_filename
      exact: RstrtMgr.dll
      case_insensitive: true

  - id: restart-manager-internal-name
    desc: RstrtMgr.dll internal name metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: RstrtMgr.dll
      case_insensitive: true

  - id: restart-manager-description
    desc: Restart Manager version description
    if:
      type: value
      path: pe.version.description
      exact: Restart Manager

  - id: restart-manager-pdb
    desc: RstrtMgr PDB identity
    if:
      type: value
      path: pe.debug.pdb.path
      exact: RstrtMgr.pdb
      case_insensitive: true

composite_rules:
  - id: restart-manager-identity
    desc: Microsoft Restart Manager DLL identity
    crit: notable
    conf: 0.99
    all:
      - id: restart-manager-original-filename
      - id: restart-manager-internal-name
      - id: restart-manager-description
      - id: metadata/binary/vendor::windows-os-product-name
      - id: restart-manager-pdb

  - id: restart-manager-system-context
    desc: Microsoft Restart Manager system-library context
    crit: exception
    conf: 1.0
    all:
      - id: restart-manager-identity
      - id: metadata/binary/vendor::microsoft-prefixed-company
