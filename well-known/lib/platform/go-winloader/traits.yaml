# go-winloader — Go library implementing the Windows module loader in pure Go
defaults:
  platforms: [windows, unix]
  for: [go, pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 104857600

traits:
  - id: source-path
    desc: jchv/go-winloader module source path
    if:
      type: path
      regex: 'jchv/go-winloader(@|@v|[\\/])'

  - id: test-fixture-path
    desc: go-winloader tinydll test fixture path
    for: [pe, dll]
    if:
      type: path
      regex: '(^|[\\/])tinydll[\\/]tiny\.dll$'

  - id: module-import-path
    desc: jchv/go-winloader module import path
    for: [go]
    if:
      type: text
      substr: github.com/jchv/go-winloader

  - id: library-description
    desc: go-winloader library description
    for: [go]
    if:
      type: text
      substr: 'Windows module loader algorithm in pure Go'
