# In-process AppleScript through Foundation's NSAppleScript: the same engine
# osascript(1) wraps, but without a child process for process-tree monitoring
# to see. Native macOS stealers use it for `display dialog` lures and
# `do shell script` without ever spawning osascript.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1059.002
  crit: notable
traits:
  - id: nsapplescript-class-reference
    size_min: 1
    desc: References Foundation NSAppleScript
    conf: 0.85
    if:
      type: symbol
      regex: '(^|_)OBJC_CLASS_\$_NSAppleScript$'
