# platformdirs: per-user data/config/cache directory resolution for Python.
defaults:
  platforms: [linux, macos, windows]

traits:
  - id: user-directory-doc
    desc: platformdirs user-directory docstring
    crit: notable
    platforms: [unix, windows]
    conf: 0.9
    for: [python, javascript, shell, go, pe]
    size_max: 10485760
    if:
      type: text
      substr: directory tied to the user
