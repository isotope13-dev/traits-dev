# hakril/PythonForWindows — documented Win32 process/injection helpers used
# by the library's own process API, not a staged shellcode loader.
defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: docs-url
    desc: PythonForWindows project documentation URL
    if:
      type: text
      substr: hakril.github.io/PythonForWindows

  - id: process-module-path
    desc: PythonForWindows process module path
    if:
      type: path
      regex: 'winobject[\\/]process\.py$'

composite_rules:
  - id: process-api-module
    desc: PythonForWindows process API module
    crit: exception
    conf: 0.99
    all:
      - id: docs-url
      - id: process-module-path
