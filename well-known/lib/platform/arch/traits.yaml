# `arch` (Feross Aboukhadijeh) detects the host OS architecture.  Its Linux
# fallback invokes `getconf`, which otherwise resembles a platform dropper
# when the package is bundled into an application.
defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: node-arch-library-source
    desc: Feross arch library source header
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'arch[.] MIT License[.] Feross Aboukhadijeh'

  - id: node-arch-library-linux-probe
    desc: Feross arch library Linux getconf probe
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'On Linux, use the `getconf` command[\s\S]{0,300}getconf LONG_BIT'

composite_rules:
  - id: arch-library-context
    desc: Feross arch library architecture-probe context
    crit: exception
    conf: 0.99
    all:
      - id: node-arch-library-source
      - id: node-arch-library-linux-probe
