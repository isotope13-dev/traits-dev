# PInvoke.NET (https://github.com/dotnet/pinvoke), published by the .NET
# Foundation, is the other widely-vendored P/Invoke binding family: one
# assembly per Windows system DLL containing only DllImport signatures for it.
# Like Vanara next door, PInvoke.User32 names mouse_event, keybd_event,
# BlockInput and SystemParametersInfo because User32 exports them, not because
# the assembly drives input or repaints the desktop.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 120000000
traits:
  - id: pinvoke-methods-comment
    desc: PInvoke.NET generated module comment
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.comments
      substr: 'P/Invoke methods for the Windows '
  - id: dotnet-foundation-copyright
    desc: .NET Foundation copyright in version resource
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: pe.version.copyright
      substr: '.NET Foundation and Contributors'
composite_rules:
  - id: pinvoke-binding-assembly
    desc: PInvoke.NET binding assembly
    crit: notable
    conf: 0.98
    all:
      - id: pinvoke-methods-comment
      - id: dotnet-foundation-copyright
