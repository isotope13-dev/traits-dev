defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: npm-systeminformation-module
    desc: npm systeminformation module
    if:
      type: path
      regex: 'node_modules[\\/]systeminformation[\\/]'
  - id: systeminformation-library-header
    desc: System Information library source header
    # The library is also embedded verbatim inside packaged single-executable
    # apps (a signed vendored CLI's Mach-O carried the whole bundle), so the
    # content markers below must fire on binaries too, not only on .js files.
    for: [javascript, typescript, binaries]
    size_max: 600000000
    if:
      type: text
      substr: 'Description:   System Information - library'
  - id: bundled-systeminformation-package-metadata
    desc: Bundled systeminformation package metadata
    for: [javascript, typescript, binaries]
    size_max: 600000000
    if:
      type: text
      substr: 'Advanced, lightweight system and OS information library'
  - id: npm-systeminformation-package
    desc: npm systeminformation package artifact
    for: [npm, tar]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: '^systeminformation(-[0-9][^:/\\\\]{1,80})?\\.(tgz|tar|gz)$'
  - id: bundled-dmidecode-shell-invocation
    desc: Bundled systeminformation dmidecode calls
    for: [javascript, typescript, binaries]
    size_max: 600000000
    if:
      type: text
      substr: 'dmidecode -t 4; dmidecode -t 7'
