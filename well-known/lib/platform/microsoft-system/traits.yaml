# Group precise legacy Microsoft system-library contexts for rules that need
# one bounded exception without repeating each vendor-specific identity.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: media-foundation-pmp-manifest
    desc: Media Foundation PMP manifest identity
    crit: notable
    conf: 0.99
    size_min: 12000
    size_max: 1000000
    if:
      type: text
      substr: Microsoft.Windows.MF.MFPMP
      section: rsrc

  - id: media-foundation-pmp-host-import
    desc: Media Foundation PMP host import
    crit: notable
    conf: 0.99
    size_min: 12000
    size_max: 1000000
    if:
      type: import
      exact: MFCreatePMPHost

composite_rules:
  - id: media-foundation-protected-pipeline
    desc: Recognized Microsoft Media Foundation protected-pipeline executable
    crit: exception
    conf: 1.0
    all:
      - id: media-foundation-pmp-manifest
      - id: media-foundation-pmp-host-import

  - id: microsoft-known-system-context
    desc: Recognized Microsoft system library context
    crit: exception
    conf: 1.0
    any:
      - id: well-known/lib/platform/microsoft-amsiproxy/
      - id: well-known/lib/platform/microsoft-wow64/
      - id: well-known/lib/platform/microsoft-catsrv/
      - id: well-known/lib/platform/microsoft-rasgcw/
      - id: well-known/lib/platform/microsoft-shell32/
      - id: media-foundation-protected-pipeline
