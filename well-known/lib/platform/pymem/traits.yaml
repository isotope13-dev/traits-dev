# srounet/Pymem — documented cross-process memory read/write library for
# Windows (game modding, debugging, automation). VirtualAllocEx +
# WriteProcessMemory in its own modules are the library's published
# memory-access API surface, not a staged shellcode loader. Trojanized
# republishes are unaffected: the packed-payload and dropper traits fire on
# the injected code, not on these API calls.
defaults:
  platforms: [windows]
  for: [python, whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: pymem wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: pymem

  - id: github-repository-url
    desc: Pymem GitHub project URL
    if:
      type: text
      regex: 'github\.com/srounet/Pymem'

  - id: package-member-path
    desc: pymem package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])pymem[\\/]'

  - id: namespaced-kernel32-remote-api
    desc: pymem namespaced kernel32 remote-memory API call
    for: [python]
    if:
      type: text
      regex: 'pymem\.ressources\.kernel32\.(VirtualAllocEx|WriteProcessMemory)'

composite_rules:
  - id: pymem-process-memory-library
    desc: Pymem cross-process memory access library
    crit: notable
    conf: 0.99
    scope: archive
    needs: 2
    any:
      - id: wheel-distribution
      - id: github-repository-url
      - id: package-member-path
      - id: namespaced-kernel32-remote-api

  - id: library-module-remote-api-context
    desc: Pymem module uses its namespaced remote-memory API
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: package-member-path
      - id: namespaced-kernel32-remote-api

  - id: remote-memory-api-context
    desc: Pymem library or its documented remote-memory read/write API
    crit: exception
    conf: 0.99
    any:
      - id: wheel-distribution
      - id: library-module-remote-api-context
