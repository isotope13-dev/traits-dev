# gopsutil — Go port of psutil for cross-platform system metrics.
defaults:
  platforms: [unix, windows]
  for: [go, zip, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: source-path
    desc: shirou/gopsutil module source path
    for: [go]
    if:
      type: path
      regex: 'github\.com/shirou/gopsutil(@|@v)'

  - id: module-import-path
    desc: shirou/gopsutil module import path
    for: [go]
    if:
      type: text
      substr: github.com/shirou/gopsutil

  - id: psutil-port-summary
    desc: gopsutil psutil port summary marker
    if:
      type: text
      substr: 'gopsutil: psutil for golang'

composite_rules:
  - id: gopsutil-library-context
    desc: gopsutil system metrics library context
    crit: exception
    any:
      - id: source-path
      - id: module-import-path
      - id: psutil-port-summary
