defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vspmsg-dll-name
    desc: Visual Studio profiler message DLL name
    if:
      type: basename
      exact: VSPMsg.dll
      case_insensitive: true

composite_rules:
  - id: vspmsg-export-contract
    desc: Visual Studio profiler message export contract
    all:
      - id: vspmsg-dll-name
      - id: metadata/binary/symbols/name/export::get-error-message-module-export
      - id: metadata/binary/symbols/name/export::set-error-message-module-export
