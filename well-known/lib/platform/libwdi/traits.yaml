# libwdi — Windows Driver Installer library for USB devices.
#
# Source: https://libwdi.akeo.ie/
# Canonical repo: https://github.com/pbatard/libwdi
#
# Open-source library that automates WinUSB, libusb-win32, and
# libusbK driver installation for USB devices. Used by Rufus,
# wifit3, and other USB management applications. Identification
# only; not a malicious indicator on its own.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  size_min: 50000
  size_max: 20000000

traits:
  - id: libwdi-url
    desc: libwdi project URL reference
    crit: notable
    conf: 0.99
    size_min: 50000
    size_max: 20000000
    if:
      type: text
      section: .rdata
      regex: 'https?://libwdi'

  - id: libwdi-installer-pipe
    desc: libwdi installer named pipe path
    crit: notable
    conf: 0.99
    size_min: 50000
    size_max: 20000000
    if:
      type: text
      section: .rdata
      substr: "\\\\.\\pipe\\libwdi-installer"

  - id: libwdi-autogen-cert-string
    desc: libwdi autogenerated certificate subject string
    crit: notable
    conf: 0.99
    size_min: 50000
    size_max: 20000000
    if:
      type: text
      section: .rdata
      substr: "(libwdi autogenerated)"

composite_rules:
  - id: libwdi-component
    desc: libwdi Windows USB driver library component
    crit: notable
    conf: 0.99
    any:
      - id: libwdi-url
      - id: libwdi-installer-pipe
      - id: libwdi-autogen-cert-string
