# Meziantou.Framework — utility types and extension methods for .NET
# (https://github.com/meziantou/Meziantou.Framework)
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 20000000

traits:
  - id: meziantou-framework-assembly-name
    desc: Meziantou.Framework assembly name
    if:
      type: path
      basename: true
      regex: '(?i)^Meziantou\.Framework(\.[A-Za-z0-9_]+)*\.dll$'

  - id: meziantou-framework-company-name
    desc: Meziantou company name
    if:
      type: value
      path: pe.version.company
      exact: meziantou

  - id: meziantou-framework-product-name
    desc: Meziantou.Framework product name
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Meziantou\.Framework'

composite_rules:
  - id: library
    desc: Meziantou.Framework .NET library
    crit: notable
    conf: 0.99
    all:
      - id: meziantou-framework-assembly-name
      - id: meziantou-framework-company-name
      - id: meziantou-framework-product-name
