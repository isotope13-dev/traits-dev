# sindresorhus/globby — glob matching helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: globby npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'globby'

  - id: vendored-path
    desc: vendored globby package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/globby/'
  - id: negative-pattern
    desc: globby negative glob pattern helper
    if:
      type: text
      substr: 'isNegativePattern'

composite_rules:
  - id: library
    desc: globby library identity
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: negative-pattern
