# Android platform source (AOSP framework and system-app Java) as published in
# the SDK sources mirror. Its framework classes implement the very APIs that
# app-level rules describe (HOME intents, installer sessions, Wi-Fi Direct,
# debugger state, overlay windows), so those observations are the platform
# itself, not behavior of an app that uses them.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: aosp-license-header
    desc: Android Open Source Project license header
    for: [java]
    if:
      type: text
      substr: The Android Open Source Project

  - id: aosp-platform-package
    desc: Platform package declaration in Java source
    for: [java]
    if:
      type: text
      regex: '(?m)^package (android|com\.android)\.'

  - id: sdk-repository-manifest
    desc: Android SDK repository manifest namespace
    for: [xml]
    if:
      type: text
      regex: 'schemas\.android\.com/(sdk/android/repo|repository/android)'

  - id: sdk-source-properties
    desc: Android SDK source package API level
    for: [text]
    if:
      type: text
      substr: AndroidVersion.ApiLevel=

composite_rules:
  - id: aosp-platform-java-file
    desc: Android platform Java file with license and platform marker
    crit: exception
    for: [java]
    all:
      - id: aosp-license-header
      - id: aosp-platform-package

  - id: android-sdk-source-tree
    desc: Android SDK sources package with repository manifest
    crit: exception
    for: [zip, xml, text]
    all:
      - id: sdk-repository-manifest
      - id: sdk-source-properties
