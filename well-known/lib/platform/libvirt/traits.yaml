defaults:
  crit: notable
  conf: 0.98
  platforms: [linux]
  for: [go]

traits:
  - id: libvirt-go-package
    desc: "Declares libvirt Go package"
    if:
      type: text
      regex: '(?m)^package\s+libvirt\s*$'

  - id: libvirt-storage-wipe-enum
    desc: "Defines libvirt storage wipe enum"
    if:
      type: text
      substr: VIR_STORAGE_VOL_WIPE_ALG_GUTMANN

composite_rules:
  - id: libvirt-storage-wipe-enum-context
    desc: "Libvirt storage wipe enum definition"
    crit: exception
    conf: 0.99
    all:
      - id: libvirt-go-package
      - id: libvirt-storage-wipe-enum
