# ChildProcessGuard — cross-platform .NET library ensuring child processes
# terminate when the parent process exits unexpectedly (Iyulab Corporation).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 5000000

traits:
  - id: childprocessguard-assembly-name
    desc: ChildProcessGuard assembly filename
    if:
      type: path
      basename: true
      exact: ChildProcessGuard.dll

  - id: childprocessguard-company-metadata
    desc: ChildProcessGuard company metadata
    if:
      type: value
      path: pe.version.company
      exact: Iyulab Corporation

  - id: childprocessguard-product-metadata
    desc: ChildProcessGuard product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: ChildProcessGuard

composite_rules:
  - id: childprocessguard-library
    desc: ChildProcessGuard process supervision library
    crit: notable
    conf: 0.99
    all:
      - id: childprocessguard-assembly-name
    any:
      - id: childprocessguard-company-metadata
      - id: childprocessguard-product-metadata
