# Xray-core Trojan inbound protocol source identity.  The protocol is a
# dual-use proxy component; these traits identify the upstream implementation
# and do not by themselves imply malicious intent.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: xray-trojan-package-declaration
    desc: Xray Trojan protocol package declaration
    if:
      type: text
      regex: '(?m)^package\s+trojan\b'

  - id: xray-trojan-server-type
    desc: Xray Trojan inbound server type declaration
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+Server\s+struct\s*\{'

  - id: xray-trojan-server-constructor
    desc: Xray Trojan inbound server constructor
    crit: component
    if:
      type: function
      exact: NewServer

composite_rules:
  - id: xray-trojan-inbound-server-source
    desc: Xray Trojan inbound server source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: xray-trojan-package-declaration
      - id: xray-trojan-server-type
      - id: xray-trojan-server-constructor
