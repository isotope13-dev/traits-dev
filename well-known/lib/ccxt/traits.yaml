# Official CCXT package identity. CCXT is a cryptocurrency exchange client;
# its RPC, signing, and trading operations are ordinary library capabilities.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar]
  crit: component
  conf: 0.96

traits:
  - id: npm-package-name
    desc: CCXT npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: ccxt
  - id: npm-package-repository
    desc: CCXT GitHub repository identity
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^git\+https://github\.com/ccxt/ccxt\.git$'
  - id: archive-package-name
    desc: CCXT npm archive name
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: ccxt
  - id: archive-package-repository
    desc: CCXT repository identity in the npm archive
    crit: notable
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      regex: '^git\+https://github\.com/ccxt/ccxt\.git$'
  - id: package-member-context
    desc: CCXT package member identity
    crit: notable
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: ccxt

composite_rules:
  - id: official-npm-package
    desc: Official CCXT npm package identity
    crit: notable
    for: [package.json]
    all:
      - id: npm-package-name
      - id: npm-package-repository
  - id: official-npm-archive
    desc: Official CCXT npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-package-repository
