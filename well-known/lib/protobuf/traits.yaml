defaults:
  platforms: [linux, macos, windows]
  for: [macho]
  crit: baseline

traits:
  - id: nanopb-runtime-marker
    desc: nanopb protobuf runtime marker
    conf: 0.9
    size_min: 65536
    size_max: 134217728
    if:
      type: text
      substr: nanopb
      section: __cstring

  - id: protobuf-framework-marker
    desc: Google protobuf framework marker
    conf: 0.95
    size_min: 65536
    size_max: 134217728
    if:
      type: text
      substr: GPBMessage
      section: __cstring
