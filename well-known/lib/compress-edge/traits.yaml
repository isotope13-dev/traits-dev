defaults:
  platforms: [windows, unix]
  for: [javascript, package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: compress-edge npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: compress-edge

  - id: project-repository
    desc: compress-edge upstream repository
    if:
      type: text
      substr: github.com/baa4ts/compress-edge

composite_rules:
  - id: compress-edge-library
    desc: compress-edge Web Compression API library
    crit: notable
    conf: 0.99
    for: [npm]
    scope: archive
    all:
      - id: package-name
    any:
      - id: project-repository
      - id: micro-behaviors/data/compress/library::web-compression-streams
