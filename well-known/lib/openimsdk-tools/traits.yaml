# OpenIM tools (github.com/openimsdk/tools) — shared Go toolkit for OpenIM.
defaults:
  platforms: [unix, windows]
  for: [go, text, shell, github-actions]
  crit: notable
  conf: 0.98

traits:
  - id: openimsdk-tools-module
    desc: OpenIM tools Go module path
    for: [go, text]
    if:
      type: text
      regex: '(?m)^module github\.com/openimsdk/tools\s*$'
  - id: openim-copyright-header
    desc: OpenIM copyright license header
    if:
      type: text
      substr: 'Copyright © 2023 OpenIM. All rights reserved.'
  - id: openim-docs-url
    desc: OpenIM documentation site reference
    if:
      type: text
      substr: 'https://docs.openim.io'
