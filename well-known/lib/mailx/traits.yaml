# Shared context for the @bobfrankston mailx libraries.  These packages are
# intentionally split into storage, settings, protocol, and orchestration
# layers, so dependency heuristics must recognize the family as one context.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  # Every layer of the family (mailx itself, iflow-direct, the store-web
  # bootstraps) imports this transport shim, so the reference identifies the
  # family rather than any single package -- it used to sit under
  # well-known/lib/iflow-direct and therefore described a mailx file as
  # "iflow-direct".
  - id: tcp-transport-package-reference
    desc: References @bobfrankston/tcp-transport package
    for: [javascript, typescript]
    if:
      type: text
      substr: '@bobfrankston/tcp-transport'

composite_rules:
  - id: mailx-family-package-context
    desc: Recognized @bobfrankston mailx library family context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: tcp-transport-package-reference
      - id: well-known/lib/iflow-direct::package-identity
      - id: well-known/lib/mailx-imap::package-identity
      - id: well-known/lib/mailx-settings::package-identity
      - id: well-known/lib/mailx-store::package-identity
      - id: well-known/lib/mailx-types::package-identity
