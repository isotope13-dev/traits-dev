# Xray-core Hysteria framing source identity. These markers describe the
# protocol parser/serializer and UDP fragmentation implementation; they do not
# infer command-and-control intent from transport code alone.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: transport-package-import
    desc: Xray Hysteria transport package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/transport/internet/hysteria'

  - id: quicvarint-package-import
    desc: Xray QUIC varint package import
    if:
      type: import
      exact: 'github.com/apernet/quic-go/quicvarint'

  - id: tcp-request-reader
    desc: Hysteria TCP request reader function
    if:
      type: function
      exact: ReadTCPRequest

  - id: tcp-request-writer
    desc: Hysteria TCP request writer function
    if:
      type: function
      exact: WriteTCPRequest

  - id: tcp-response-reader
    desc: Hysteria TCP response reader function
    if:
      type: function
      exact: ReadTCPResponse

  - id: tcp-response-writer
    desc: Hysteria TCP response writer function
    if:
      type: function
      exact: WriteTCPResponse

  - id: udp-message-struct
    desc: Hysteria UDP message structure
    if:
      type: text
      regex: '(?m)^type\s+UDPMessage\s+struct\s*\{'

  - id: udp-fragmenter
    desc: Hysteria UDP message fragmentation function
    if:
      type: function
      exact: FragUDPMessage

  - id: bbr-package-declaration
    desc: Hysteria BBR package declaration
    crit: component
    if:
      type: text
      regex: '(?m)^package\s+bbr\b'

  - id: bbr-sender-structure
    desc: Hysteria BBR sender structure
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+bbrSender\s+struct\s*\{'

  - id: bbr-congestion-interface
    desc: Hysteria BBR congestion interface assertion
    crit: component
    if:
      type: text
      exact: 'var _ congestion.CongestionControl = &bbrSender{}'

  - id: bbr-congestion-package-import
    desc: Hysteria BBR QUIC congestion import
    crit: component
    if:
      type: import
      exact: 'github.com/apernet/quic-go/congestion'

  - id: bbr-monotime-package-import
    desc: Hysteria BBR monotonic time import
    crit: component
    if:
      type: import
      exact: 'github.com/apernet/quic-go/monotime'

composite_rules:
  - id: framing-protocol
    desc: Xray Hysteria framing protocol source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: transport-package-import
      - id: quicvarint-package-import
      - id: tcp-request-reader
      - id: tcp-request-writer
      - id: tcp-response-reader
      - id: tcp-response-writer
      - id: udp-message-struct
      - id: udp-fragmenter

  - id: bbr-congestion-controller-source
    desc: Xray Hysteria BBR congestion controller
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: bbr-package-declaration
      - id: bbr-sender-structure
      - id: bbr-congestion-interface
      - id: bbr-congestion-package-import
      - id: bbr-monotime-package-import
