# @react-native-community/cli-debugger-ui — React Native remote JS debugger UI.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, zip]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: React Native CLI debugger UI package
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@react-native-community/cli-debugger-ui'

  - id: debugger-proxy-websocket
    desc: React Native debugger proxy WebSocket path
    for: [javascript]
    if:
      type: text
      substr: /debugger-proxy?role=debugger

composite_rules:
  - id: react-native-cli-debugger-ui
    desc: React Native CLI debugger UI package
    any:
      - id: package-name
      - id: debugger-proxy-websocket
