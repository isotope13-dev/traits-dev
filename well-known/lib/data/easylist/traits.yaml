defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, crx, xpi]
  size_max: 120000000
traits:
  - id: resource
    desc: EasyList JavaScript resource
    if:
      type: path
      substr: easylist.js
  - id: bundle-marker
    desc: EasyList bundle marker
    for: [javascript, text]
    if:
      type: text
      substr: easylist
