defaults:
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, text, crx, xpi]
  size_max: 120000000
traits:
  - id: resource
    desc: EasyList JavaScript resource
    if:
      type: path
      substr: easylist.js
  - id: filter-list-title-header
    desc: EasyList filter-list title header
    for: [javascript, text]
    if:
      type: text
      regex: '(?i)![ \t]*Title:[ \t]*EasyList\b'
  # The @cliqz-oss/adblocker engine serialization (browserless/goto ships it
  # as src/engine.bin): a compiled filter table plus the redirect-resource
  # bundle. Every tracking host, typosquat and .php collect endpoint in it is
  # a BLOCK target, and the bundled scriptlets exist to neuter the blocked
  # scripts — none of it is code the package loads or executes against.
  - id: engine-serialization
    desc: Serialized adblocker engine resource table
    for: [javascript, text]
    conf: 0.95
    if:
      type: text
      regex: '1x1-transparent\.gif.{0,120}R0lGODlhAQABAIAAAP'
