defaults:
  platforms: [windows, unix]
  for: [javascript, text, crx, xpi, archives]
  size_max: 120000000
traits:
  - id: resource
    desc: EasyList JavaScript resource
    crit: notable
    conf: 0.98
    if:
      type: path
      substr: easylist.js
  - id: bundle-marker
    desc: EasyList bundle marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: easylist
