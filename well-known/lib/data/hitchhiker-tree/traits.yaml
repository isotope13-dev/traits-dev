# hitchhiker-tree — functional persistent B-tree (io.replikativ).
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: hitchhiker-tree Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: hitchhiker-tree

  - id: pom-group
    desc: replikativ Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: io.replikativ

  - id: package-path
    desc: hitchhiker-tree namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)hitchhiker/tree/'

  - id: github-repo
    desc: hitchhiker-tree GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/replikativ/hitchhiker-tree
