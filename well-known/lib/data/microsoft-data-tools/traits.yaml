# Microsoft.Data.Tools.Utilities — DacFx / SqlPackage support library shipped
# with vscode-mssql's SqlToolsService. Large COM/schema GUID tables are normal
# for SQL tooling and must not read as UUID-shellcode encoding alone.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 50000000

traits:
  - id: mdtu-product-name
    desc: Microsoft.Data.Tools.Utilities product name
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft.Data.Tools.Utilities

  - id: mdtu-original-filename
    desc: Data.Tools.Utilities.dll original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Microsoft.Data.Tools.Utilities.dll

  - id: dacfx-telemetry-marker
    desc: DacFx telemetry event marker
    if:
      type: text
      section: .rdata
      substr: DacFxTelemetryEventData

composite_rules:
  - id: microsoft-data-tools-utilities
    desc: Microsoft Data Tools Utilities (DacFx) library
    conf: 0.99
    needs: 2
    any:
      - id: mdtu-product-name
      - id: mdtu-original-filename
      - id: dacfx-telemetry-marker
