# tsetmc — async Python client for tsetmc.com (Tehran Securities Exchange).
# aiohttp, a Firefox User-Agent, and HTTP to members.tsetmc.com are the
# product market-data client, not a dropper or C2.
defaults:
  platforms: [unix, windows]
  for: [python, whl, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: pypi-name
    desc: tsetmc PyPI package name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: tsetmc

  - id: wheel-distribution
    desc: tsetmc wheel distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: tsetmc

  - id: github-repo
    desc: 5j9 tsetmc GitHub repository
    conf: 0.98
    if:
      type: text
      substr: github.com/5j9/tsetmc

  - id: cdn-api-host
    desc: tsetmc CDN API hostname
    for: [python]
    conf: 0.98
    if:
      type: text
      substr: cdn.tsetmc.com

  - id: market-watch-init-endpoint
    desc: tsetmc MarketWatchInit data path
    for: [python]
    conf: 0.97
    if:
      type: text
      substr: MarketWatchInit.aspx
