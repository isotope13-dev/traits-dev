# Vendored JDBC/cloud-auth drivers inside Mendix External Database Connector
# modules. IMDS paths, optional trust-all TLS helpers, and the word
# "keylogger" in telemetry/docs are driver/SDK contents, not implants.
defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]
  crit: notable
  conf: 0.98

traits:
  - id: edc-module-path
    desc: Mendix External Database Connector module path
    if:
      type: path
      regex: 'ExternalDatabaseConnector-v'

  - id: bouncycastle-est-path
    desc: Bouncy Castle EST helper class path
    if:
      type: path
      regex: 'bouncycastle[\\/]est'

  - id: bcpkix-jar-basename
    desc: Bouncy Castle PKIX JAR basename
    for: [jar]
    if:
      type: path
      basename: true
      regex: '^bcpkix-jdk'
