# NCNN neural network model weights. INT 21h byte runs in tensor data are
# not a DOS directory infector.
defaults:
  size_min: 100000
  size_max: 500000000
  platforms: [unix, windows]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: ncnn-model-basename
    desc: NCNN neural network model weight file
    if:
      type: basename
      # Upscaler weight blobs are named for their scale factor in either
      # position (`4x-UltraSharp.bin`, `remacri-4x.bin`, `model-x2.bin`);
      # the named tokens cover the ecosystem packs that ship without one.
      regex: '(?i)^.*(\d+x|-x\d+|\bncnn|upscayl|remacri).*\.bin$'
