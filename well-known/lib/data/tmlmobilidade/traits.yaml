# TML Mobilidade publishes @tmlmobilidade/* from the go monorepo on GitHub.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: tmlmobilidade-scoped-package-name
    desc: Official @tmlmobilidade scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@tmlmobilidade/'

  - id: tmlmobilidade-npm-scoped-name
    desc: Official @tmlmobilidade npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@tmlmobilidade/'

  - id: tmlmobilidade-github-repository-url
    desc: TML Mobilidade go monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]tmlmobilidade/go'

  - id: tmlmobilidade-npm-github-repository
    desc: TML Mobilidade go monorepo npm repository field
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com[:/]tmlmobilidade/go'

composite_rules:
  - id: tmlmobilidade-official-monorepo-scope
    desc: Official TML Mobilidade scoped package
    crit: exception
    any:
      - id: tmlmobilidade-scoped-package-name
      - id: tmlmobilidade-npm-scoped-name

  - id: tmlmobilidade-official-org-repository
    desc: Official TML Mobilidade go monorepo repository
    crit: exception
    any:
      - id: tmlmobilidade-github-repository-url
      - id: tmlmobilidade-npm-github-repository

  - id: tmlmobilidade-official-scope-repository-pair
    desc: Official TML Mobilidade monorepo package pairing
    crit: exception
    all:
      - id: tmlmobilidade-official-monorepo-scope
      - id: tmlmobilidade-official-org-repository
