defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, rust]
  crit: notable
  conf: 0.85

traits:
  - id: posthog-python-integration-import
    desc: Python PostHog integration import
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: import
      regex: '(^|\.)posthog(\.|$)'

  - id: posthog-rust-capture-endpoint
    desc: Rust PostHog capture endpoint
    crit: notable
    conf: 0.98
    for: [rust]
    if:
      type: text
      regex: 'https://[a-z0-9.-]*posthog\.com/capture/'
      case_insensitive: true

  - id: posthog-custom-host-option
    desc: PostHog custom telemetry host option
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(new\s+PostHog|PostHog\s*\()[\s\S]{0,240}\bhost\s*:\s*["'']https?://'

  - id: posthog-custom-host-binding
    desc: PostHog custom telemetry host binding
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bPOSTHOG_HOST\s*=\s*["'']https?://'

  - id: posthog-event-object-rust
    desc: Rust PostHog event object fields
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '\bevent\b.{0,240}\bdistinct_id\b'
      case_insensitive: true

  - id: posthog-dotnet-binding-product
    desc: Maui.Posthog .NET binding product identity
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    size_min: 10000
    if:
      type: value
      path: pe.version.product_name
      exact: Maui.Posthog

  - id: posthog-dotnet-session-replay-start
    desc: Maui.Posthog session-replay start API metadata
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    size_min: 10000
    if:
      type: text
      substr: StartSessionReplay
      section: .text

  - id: posthog-dotnet-session-replay-stop
    desc: Maui.Posthog session-replay stop API metadata
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    size_min: 10000
    if:
      type: text
      substr: StopSessionReplay
      section: .text

composite_rules:
  - id: posthog-telemetry-client
    desc: PostHog analytics client identity
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/services/analytics::posthog-host-reference
    any:
      - id: micro-behaviors/os/telemetry/activity::telemetry-event-identity-fields
      - id: posthog-event-object-rust
      - id: posthog-rust-capture-endpoint
      - id: micro-behaviors/os/telemetry/logging/analytics::feature-flag-lookup-reference
      - id: posthog-custom-host-option
      - id: posthog-custom-host-binding
