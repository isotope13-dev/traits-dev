# Fedora MeCab JUMAN dictionary (mecab-jumandic). Autotools
# configure/config.guess/missing are the GNU build, not a dropper.
defaults:
  platforms: [linux]
  for: [rpm, tar, archives, text, shell]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: rpm-name
    desc: mecab-jumandic RPM package name
    for: [rpm]
    conf: 0.99
    if:
      type: value
      path: rpm.name
      exact: mecab-jumandic

  - id: spec-name
    desc: mecab-jumandic RPM spec Name field
    for: [text]
    conf: 0.98
    if:
      type: text
      regex: '(?m)^Name:\s*mecab-jumandic\b'

  - id: spec-path
    desc: mecab-jumandic RPM spec file path
    for: [rpm, tar, archives]
    conf: 0.97
    if:
      type: path
      regex: '(?i)(^|[\\/])mecab-jumandic\.spec$'

  - id: upstream-url
    desc: MeCab SourceForge project URL
    for: [rpm, text]
    conf: 0.96
    if:
      type: text
      substr: mecab.sourceforge.net
