# ioredis — Redis client for Node.js.
# Each marker is a distinctive internal symbol of ioredis, so each one
# identifies the library on its own -- identity, which TAXONOMY places at
# notable. The legs and the composite therefore share a criticality: a bare
# `any:` fires exactly where its legs do, so a lower leg would make the
# reported tier depend on which marker happened to match.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: ioredis-auto-pipeline
    desc: ioredis auto-pipelining commands list
    if:
      type: text
      substr: notAllowedAutoPipelineCommands
  - id: ioredis-command-flags
    desc: ioredis Command.FLAGS definition
    if:
      type: text
      regex: Command\.FLAGS\s*=\s*\{
  - id: ioredis-subscriber-mode
    desc: ioredis VALID_IN_SUBSCRIBER_MODE constant
    if:
      type: text
      substr: "VALID_IN_SUBSCRIBER_MODE"
  - id: ioredis-utils
    desc: ioredis utility functions
    if:
      type: text
      regex: 'exports\.(convertBufferToString|convertObjectToArray|convertMapToArray)\b'
  - id: ioredis-utils-buffer-equal
    desc: ioredis bufferEqual utility
    if:
      type: text
      word: exports.bufferEqual
  - id: ioredis-utils-wrap-multi-result
    desc: ioredis wrapMultiResult utility
    if:
      type: text
      word: exports.wrapMultiResult
  - id: ioredis-utils-pack-object
    desc: ioredis packObject utility
    if:
      type: text
      word: exports.packObject
  - id: ioredis-utils-parse-url
    desc: ioredis parseURL utility
    if:
      type: text
      word: exports.parseURL
  - id: ioredis-utils-zip-map
    desc: ioredis zipMap utility
    if:
      type: text
      word: exports.zipMap
composite_rules:
  - id: ioredis-command
    desc: ioredis Command class
    any:
      - id: ioredis-command-flags
      - id: ioredis-subscriber-mode
