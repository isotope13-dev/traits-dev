defaults:
  platforms: [unix, windows]
  for: [ruby, c]

traits:
  - id: yajl-source-path
    desc: YAJL Ruby binding source path
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])yajl([\\/]|\.rb$|$)'

  - id: yajl-ruby-module-marker
    desc: YAJL Ruby JSON binding marker
    crit: notable
    conf: 0.96
    for: [ruby]
    if:
      type: text
      regex: '\bmodule\s+Yajl\b|\bYajl::(Parser|Encoder)\b'

  - id: yajl-c-extension-marker
    desc: YAJL Ruby C extension marker
    crit: notable
    conf: 0.96
    for: [c]
    if:
      type: text
      regex: '\brb_yajl_(parser|encoder)_'

composite_rules:
  - id: yajl-ruby-library
    desc: YAJL Ruby JSON parser library
    crit: notable
    conf: 0.98
    any:
      - id: yajl-ruby-module-marker
      - id: yajl-c-extension-marker
    all:
      - id: yajl-source-path
