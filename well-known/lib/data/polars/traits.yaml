defaults:
  size_max: 20000000
  platforms: [unix, windows]
  for: [pe, elf, macho]
traits:
  - id: polars-plugin
    desc: Polars data analysis plugin
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: polars-io
      section: .rdata
  - id: polars-basename
    desc: Polars basename
    crit: notable
    if:
      type: path
      basename: true
      regex: polars
