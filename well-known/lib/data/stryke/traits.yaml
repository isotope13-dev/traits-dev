# Storm Software Stryke monorepo — @stryke/* utility packages.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Stryke scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@stryke/[a-z0-9][a-z0-9._/-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Stryke scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@stryke/[a-z0-9][a-z0-9._/-]{0,80}$'

  - id: github-repository-url
    desc: Storm Stryke monorepo GitHub URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]storm-software/stryke'

  - id: github-npm-repository
    desc: Stryke npm archive repository field
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]storm-software/stryke'

  - id: stryke-scoped-import-path
    desc: Stryke scoped package import path
    for: [javascript, typescript]
    if:
      type: text
      substr: '@stryke/'

composite_rules:
  - id: official-package-scope
    desc: Official Stryke scoped package
    crit: notable
    conf: 0.99
    for: [package.json, npm]
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Storm Stryke monorepo repository
    crit: exception
    for: [package.json, npm]
    any:
      - id: github-repository-url
      - id: github-npm-repository

  - id: official-scope-repository-pair
    desc: Official Stryke monorepo package pairing
    crit: exception
    for: [package.json, npm]
    all:
      - id: official-package-scope
      - id: official-package-repo

  - id: stryke-monorepo-package-context
    desc: Official Stryke monorepo npm package
    crit: exception
    conf: 0.99
    for: [npm, tar, zip, package.json]
    scope: archive
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity
