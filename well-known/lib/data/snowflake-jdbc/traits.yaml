# Official Snowflake JDBC driver — cloud IMDS/token paths and optional
# trust-all TLS helpers are driver auth/connectivity, not stealers.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  crit: notable
  conf: 0.98

traits:
  - id: driver-namespace
    desc: Snowflake JDBC driver namespace
    if:
      type: text
      substr: net/snowflake/client/

  - id: driver-jar-basename
    desc: Snowflake JDBC driver JAR basename
    for: [jar]
    size_max: 80000000
    if:
      type: path
      basename: true
      regex: '^snowflake-jdbc-[0-9]'

  - id: driver-member-path
    desc: Snowflake JDBC driver archive member path
    if:
      type: path
      regex: 'snowflake-jdbc-[0-9]'

composite_rules:
  - id: jdbc-driver-context
    desc: Official Snowflake JDBC driver context
    any:
      - id: driver-namespace
      - id: driver-jar-basename
      - id: driver-member-path
