# AKShare — open-source Chinese financial/market data interface for Python.
#
# Vendors obfuscated JavaScript helpers (mini-racer/py-mini-racer) to scrape
# sites that fingerprint plain HTTP clients; that is anti-bot scraping, not
# a hidden payload.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  conf: 0.99
  size_max: 524288000

traits:
  - id: akshare-wheel-package-name
    desc: AKShare Python wheel package name
    crit: notable
    for: [whl]
    if:
      type: value
      path: METADATA::Name
      exact: akshare

  - id: akshare-github-homepage
    desc: AKShare GitHub project homepage
    crit: notable
    if:
      type: value
      path: METADATA::Home-page
      regex: '(?i)github\.com/akfamily/akshare'

  - id: akshare-author-email
    desc: AKFamily maintainer contact email
    crit: component
    for: [whl]
    if:
      type: value
      path: METADATA::Author-email
      substr: albertandking@gmail.com

composite_rules:
  - id: akshare-financial-data-library
    desc: AKShare financial data scraping library
    crit: notable
    needs: 2
    any:
      - id: akshare-wheel-package-name
      - id: akshare-github-homepage
      - id: akshare-author-email
