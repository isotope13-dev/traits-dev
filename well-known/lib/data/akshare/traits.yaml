# AKShare — open-source Chinese financial/market data interface for Python.
#
# Vendors obfuscated JavaScript helpers (mini-racer/py-mini-racer) to scrape
# sites that fingerprint plain HTTP clients; that is anti-bot scraping, not
# a hidden payload.
defaults:
  platforms: [unix, windows]
  for: [whl, python, javascript, text]
  conf: 0.99
  size_max: 524288000

traits:
  - id: wheel-distribution
    desc: AKShare wheel distribution name
    crit: notable
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: akshare

  - id: wheel-author-email
    desc: AKFamily maintainer email on wheel
    crit: component
    for: [whl]
    if:
      type: value
      path: whl.author_email
      substr: albertandking@gmail.com

  - id: github-homepage
    desc: AKShare GitHub project URL
    crit: notable
    if:
      type: text
      substr: github.com/akfamily/akshare

  - id: package-member-path
    desc: AKShare package member path
    if:
      type: path
      regex: '^akshare/'

composite_rules:
  - id: akshare-financial-data-library
    desc: AKShare financial data scraping library
    crit: notable
    needs: 2
    any:
      - id: wheel-distribution
      - id: wheel-author-email
      - id: github-homepage
      - id: package-member-path
