# talib — CRAN R package wrapping the TA-Lib technical analysis library.
defaults:
  platforms: [unix, windows]
  for: [c, shell, tar, text]
  crit: notable
  conf: 0.99

traits:
  - id: cran-package-name
    desc: talib CRAN package name
    for: [text]
    if:
      type: text
      regex: '(?m)^Package:\s*talib\s*$'

  - id: ta-lib-interface-title
    desc: TA-Lib R interface package title
    for: [text]
    if:
      type: text
      substr: "Interface to 'TA-Lib' for Technical Analysis"

  - id: ta-func-prefix
    desc: TA-Lib R function prefix
    for: [c, text]
    if:
      type: text
      substr: ta_STOCHRSI

composite_rules:
  - id: talib-r-package
    desc: Recognized talib CRAN technical-analysis package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: cran-package-name
    any:
      - id: ta-lib-interface-title
      - id: ta-func-prefix
