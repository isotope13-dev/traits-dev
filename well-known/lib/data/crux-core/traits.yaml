# JUXT Crux (now XTDB) bitemporal document database core. sh/getconf
# memory sampling, ConcurrentHashMap table setAccessible, and nippy
# codecs are product internals, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: crux-core Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: crux-core

  - id: pom-group
    desc: juxt Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: juxt

  - id: github-repo
    desc: juxt crux GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/juxt/crux

  - id: defproject
    desc: juxt crux-core Leiningen defproject
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject juxt/crux-core'

  - id: io-namespace-path
    desc: crux io namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)crux/io\.clj$'

composite_rules:
  - id: crux-core-maven-library
    desc: JUXT crux-core Clojure database
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
