defaults:
  platforms: [windows, unix]
  for: [binaries, javascript]
  crit: baseline
  conf: 0.95
  size_max: 2147483648

traits:
  # The low-level Node binding package is intentionally published under a
  # scoped component name while its source repository is the DuckDB Node
  # bindings project. Its platform packages use the same identity pattern.
  - id: node-bindings-package-name
    desc: DuckDB Node bindings npm package name
    for: [npm]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: npm.name
      regex: '^@duckdb/node-bindings(-(darwin-arm64|darwin-x64|linux-arm64|linux-x64|win32-x64))?$'

  - id: node-bindings-manifest-name
    desc: DuckDB Node bindings manifest package name
    for: [package.json]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      regex: '^@duckdb/node-bindings(-(darwin-arm64|darwin-x64|linux-arm64|linux-x64|win32-x64))?$'

  - id: node-bindings-repository
    desc: DuckDB Node bindings repository
    for: [npm]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: npm.repository.url
      regex: '^https?://github\.com/duckdb/duckdb-node-neo(\.git)?$'

  - id: go-bindings-module
    desc: DuckDB Go bindings module path
    if:
      type: text
      substr: github.com/duckdb/duckdb-go

  - id: c-api-export-prefix
    desc: DuckDB C API export prefix
    for: [pe, dll, elf, macho]
    if:
      type: export
      regex: ^duckdb_[a-z0-9_]+$

  - id: javascript-worker-path
    desc: DuckDB JavaScript worker bundle path
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '(?i)^duckdb([.-](browser|node|worker)[a-z0-9._-]*)?\.(c?js|mjs)$'

  - id: libduckdb-sys-crate-name
    desc: libduckdb-sys Rust crate name
    crit: notable
    conf: 0.99
    for: [rust]
    if:
      type: value
      path: package.name
      exact: libduckdb-sys

  - id: libduckdb-download-build-marker
    desc: libduckdb-sys build.rs download hook
    crit: notable
    conf: 0.99
    for: [rust]
    if:
      type: text
      regex: 'download_libduckdb|should_download_libduckdb'

composite_rules:
  - id: official-node-bindings-package-repository-pair
    desc: Official DuckDB Node bindings package and repository pair
    for: [npm, tar, zip]
    crit: exception
    conf: 0.99
    all:
      - id: node-bindings-package-name
      - id: node-bindings-repository

  - id: javascript-worker-runtime
    desc: DuckDB JavaScript worker runtime bundle
    for: [javascript]
    all:
      - id: javascript-worker-path
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle

  - id: duckdb-library
    desc: DuckDB embedded database library
    any:
      - id: go-bindings-module
      - id: c-api-export-prefix
      - id: javascript-worker-runtime
      - id: libduckdb-sys-crate-name
