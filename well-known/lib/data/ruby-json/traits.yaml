# json — Ruby's standard JSON library (https://github.com/ruby/json).
# The gem's documentation uses a deserialize_obj/safe_types example that
# quotes "password": "0wn3d" to illustrate unsafe JSON.load behavior.
defaults:
  platforms: [unix, windows]
  for: [gem, ruby, tar]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 50000000

traits:
  - id: gem-name
    desc: json Ruby gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: json

  - id: upstream-repository
    desc: ruby/json upstream repository URL
    for: [ruby]
    if:
      type: text
      substr: github.com/ruby/json

  - id: module-json
    desc: JSON Ruby module declaration
    for: [ruby]
    if:
      type: text
      regex: '(?m)^module JSON\b'

  - id: deserialize-safe-types-doc
    desc: JSON gem deserialize_obj doc example
    for: [ruby]
    if:
      type: text
      substr: def deserialize_obj(obj, safe_types

composite_rules:
  - id: package-identity
    desc: Official ruby/json gem identity
    crit: notable
    any:
      - id: gem-name
      - id: module-json
    all:
      - id: upstream-repository

  - id: package-context
    desc: Official ruby/json gem context
    crit: exception
    any:
      - id: gem-name
    all:
      - id: upstream-repository
