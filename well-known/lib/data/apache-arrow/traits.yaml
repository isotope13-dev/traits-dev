defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  size_max: 5000000
traits:
  - id: apache-arrow-package-name
    desc: Apache Arrow npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: apache-arrow

  - id: apache-arrow-npm-package-name
    desc: Apache Arrow npm archive name
    crit: notable
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: apache-arrow

  - id: apache-arrow-repository
    desc: Apache Arrow upstream repository
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/apache/arrow(\.git)?'

  - id: apache-arrow-npm-repository
    desc: Apache Arrow npm archive repository
    crit: notable
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: 'github\.com/apache/arrow(\.git)?'

  - id: apache-arrow-module
    desc: Imports Apache Arrow JavaScript module
    crit: baseline
    conf: 0.98
    if:
      # A documentation example that names apache-arrow does not make the host
      # file an Apache Arrow module. Require a parser-confirmed import.
      type: import
      exact: apache-arrow

  - id: arrow-flight-protocol
    desc: Apache Arrow Flight protocol
    crit: baseline
    conf: 0.99
    if:
      type: text
      substr: arrow.flight.protocol.FlightService

  - id: arrow-record-batch-reader
    desc: Apache Arrow RecordBatchReader
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: RecordBatchReader

  - id: arrow-bignum-symbol-marker
    desc: Apache Arrow BigNum implementation marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: isArrowBigNumSymbol

  - id: arrow-bignum-constructor-marker
    desc: Apache Arrow BigNum constructor marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'function\s+BigNum\s*\('

composite_rules:
  - id: apache-arrow-manifest-context
    desc: Apache Arrow package manifest context
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: apache-arrow-package-name
      - id: apache-arrow-repository

  - id: apache-arrow-npm-context
    desc: Apache Arrow npm archive context
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: apache-arrow-npm-package-name
      - id: apache-arrow-npm-repository

  - id: apache-arrow-package-context
    desc: Apache Arrow official JavaScript package context
    crit: exception
    conf: 1.0
    scope: outer
    any:
      - id: apache-arrow-manifest-context
      - id: apache-arrow-npm-context

  - id: apache-arrow-bignum-source
    desc: Apache Arrow BigNum typed-array source context
    crit: exception
    conf: 0.99
    all:
      - id: arrow-bignum-symbol-marker
      - id: arrow-bignum-constructor-marker
