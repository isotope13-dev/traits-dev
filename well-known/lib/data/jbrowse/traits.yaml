# JBrowse 2 — the genome-browser platform of the GMOD project (jbrowse.org).
# The @jbrowse npm scope publishes the official plugin and adapter family.
# A scoped name alone is an allowlist, not identity: the name leg must be
# corroborated by the upstream repository or homepage.
defaults:
  platforms: [unix, windows]
  for: [npm]
  crit: notable
  conf: 0.99

traits:
  - id: jbrowse-npm-scope-package-name
    desc: Official @jbrowse npm scope package name
    if:
      type: value
      path: npm.name
      substr: '@jbrowse/'

  - id: jbrowse-npm-upstream-repository
    desc: JBrowse upstream repository field
    if:
      type: value
      path: npm.repository.url
      regex: 'github\.com/(GMOD|gmod)/jbrowse-components'

  - id: jbrowse-npm-homepage
    desc: JBrowse project homepage
    if:
      type: value
      path: npm.homepage
      substr: jbrowse.org

composite_rules:
  - id: jbrowse-plugin-library-context
    desc: Official JBrowse 2 platform package
    crit: notable
    conf: 0.98
    all:
      - id: jbrowse-npm-scope-package-name
    any:
      - id: jbrowse-npm-upstream-repository
      - id: jbrowse-npm-homepage
