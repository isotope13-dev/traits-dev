# jackc/pgx — the standard PostgreSQL driver for Go. Go import paths are
# format-mandated, so the module path identifies the dependency; the pgxpool
# batch-result type names mark files that are the driver's own source rather
# than a consumer of it.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: pgxpool-batch-type-names
    desc: pgxpool batch result type names
    conf: 0.9
    if:
      type: text
      regex: '\b(pool|err)BatchResults\b'

composite_rules:
  - id: pgx-pool-source
    desc: jackc pgx pgxpool batch source
    crit: notable
    conf: 0.9
    all:
      - id: metadata/import/go/github/com/jackc/pgx/v5
      - id: pgxpool-batch-type-names
