defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline

traits:
  - id: cassandra-namespace-import
    desc: Cassandra namespace import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: cassandra

composite_rules:
  - id: apache-cassandra-driver-source
    desc: Apache Cassandra driver source
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/license::apache-asf-source-header
      - id: cassandra-namespace-import

  - id: datastax-cassandra-driver-source
    desc: DataStax Cassandra Python driver source
    crit: notable
    conf: 0.99
    all:
      - id: metadata/vendor/copyright::datastax-copyright-header
      - id: cassandra-namespace-import
