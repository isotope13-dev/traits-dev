# ONNX model weights. INT 21h byte runs in the tensor data are not a
# DOS directory infector.
defaults:
  size_min: 100000
  size_max: 100000000
  platforms: [unix, windows]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: onnx-model-basename
    desc: ONNX model weight file
    if:
      type: basename
      regex: '(?i)^.+\.onnx$'
