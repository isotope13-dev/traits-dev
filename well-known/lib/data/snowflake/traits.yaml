defaults:
  platforms: [unix, windows]
  for: [go, batch, shell]
  crit: notable
  conf: 0.98

traits:
  - id: gosnowflake-module-path
    desc: Snowflake Go driver module path
    if:
      type: text
      substr: github.com/snowflakedb/gosnowflake

  - id: snowflake-test-account-env
    desc: Snowflake driver test account variable
    if:
      type: text
      substr: SNOWFLAKE_TEST_ACCOUNT

  - id: request-id-header
    desc: Snowflake HTTP request-id header
    for: [javascript, typescript]
    if:
      type: text
      substr: X-Snowflake-Request-Id

  - id: computing-app-suffix
    desc: Snowflake computing app hostname suffix
    for: [javascript, typescript]
    if:
      type: text
      substr: .snowflakecomputing.app

  - id: sql-textmate-scope
    desc: Snowflake SQL TextMate scope name
    for: [javascript, json]
    if:
      type: text
      substr: source.sql.snowflake

composite_rules:
  - id: gosnowflake-source-context
    desc: Snowflake Go database driver source
    crit: notable
    conf: 0.99
    any:
      - id: gosnowflake-module-path
      - id: snowflake-test-account-env
