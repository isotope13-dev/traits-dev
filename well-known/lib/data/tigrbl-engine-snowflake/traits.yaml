# tigrbl_engine_snowflake — Tigrbl SQLAlchemy plugin for Snowflake
# warehouses. snowflake:// DSN construction is the product engine, not
# a credential stealer. Identity only.
defaults:
  platforms: [unix, windows]
  for: [whl, python, text, markdown, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: tigrbl_engine_snowflake wheel name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: tigrbl_engine_snowflake

  - id: package-metadata-name
    desc: tigrbl_engine_snowflake PyPI Name
    for: [pkginfo]
    if:
      type: text
      regex: '(?m)^Name:\s*tigrbl_engine_snowflake\s*$'

  - id: github-engine-path
    desc: tigrbl snowflake engine GitHub path
    for: [pkginfo, markdown, text]
    if:
      type: text
      substr: pkgs/engines/tigrbl_engine_snowflake

  - id: register-hook
    desc: tigrbl snowflake engine register hook
    for: [python, text]
    if:
      type: text
      substr: 'tigrbl_engine_snowflake:register'

  - id: engine-module-path
    desc: tigrbl snowflake engine module path
    for: [python, whl]
    if:
      type: path
      regex: 'tigrbl_engine_snowflake[\\/]engine\.py$'

composite_rules:
  - id: tigrbl-engine-snowflake-package
    desc: tigrbl Snowflake engine plugin
    crit: notable
    conf: 0.99
    scope: outer
    needs: 2
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: github-engine-path
      - id: register-hook
      - id: engine-module-path
