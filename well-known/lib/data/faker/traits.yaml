# faker.js — generate fake contextual data (Marak/Faker.js).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, archives, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: faker-npm-package-name
    desc: faker npm package name
    for: [package.json, npm]
    if:
      type: value
      path: name
      exact: faker

  - id: faker-user-agent-vendor-path
    desc: faker vendor user-agent generator path
    if:
      type: path
      regex: '(?i)vendor/user-agent\.js$'

composite_rules:
  - id: faker-library-context
    desc: faker.js fake data generator library
    crit: exception
    conf: 0.99
    any:
      - id: faker-npm-package-name
      - id: faker-user-agent-vendor-path
