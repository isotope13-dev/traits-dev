# Mongoose — MongoDB object-document mapper for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Mongoose npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: mongoose

  - id: vendored-path
    desc: Vendored Mongoose package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/mongoose/(lib|types)'
