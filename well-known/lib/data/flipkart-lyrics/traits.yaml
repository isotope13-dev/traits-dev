# Flipkart Lyrics JSON sample schemas (com.flipkart.rome:lyrics-json-sample).
# Fixture JAR of JSON type descriptors for the Lyrics Java generator.
# Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, json, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-group
    desc: Flipkart Rome Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: com.flipkart.rome

  - id: pom-artifact
    desc: lyrics-json-sample Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: lyrics-json-sample

  - id: sample-schema-path
    desc: Flipkart Lyrics JSON sample path
    conf: 0.96
    if:
      type: path
      regex: 'flipkart/lyrics/sample'

composite_rules:
  - id: lyrics-json-sample-library
    desc: Flipkart Lyrics JSON sample JAR
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
