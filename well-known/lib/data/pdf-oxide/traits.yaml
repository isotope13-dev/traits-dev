defaults:
  platforms: [unix, windows]
  for: [whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: PDF Oxide wheel distribution name
    if:
      type: value
      path: whl.distribution
      exact: pdf_oxide

  - id: native-module
    desc: PDF Oxide native Python module
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)pdf_oxide/pdf_oxide\.abi3\.so$'

composite_rules:
  - id: pdf-oxide-python-library
    desc: Recognized PDF Oxide Python library
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: wheel-distribution
      - id: native-module
