# QCoDeS (github.com/QCoDeS/QCoDeS) — Python-based data acquisition framework
# developed by the Copenhagen / Delft / Sydney / Microsoft quantum computing consortium
# for scientific research and experimental hardware automation.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: qcodes-project-metadata
    desc: QCoDeS project metadata name
    for: [pyproject.toml]
    if:
      type: text
      regex: '(?m)^\s*name\s*=\s*"qcodes"'

  - id: qcodes-source-path
    desc: QCoDeS source file path
    for: [python]
    if:
      type: path
      regex: 'qcodes[/\\](instrument_drivers|dataset|monitor)'

  - id: qcodes-maintainer-email
    desc: QCoDeS maintainer email
    for: [pyproject.toml, python, text]
    if:
      type: text
      substr: qcodes-support@microsoft.com

  - id: qcodes-github-repo
    desc: QCoDeS GitHub repository URL
    for: [python, pyproject.toml, text, markdown]
    if:
      type: text
      substr: github.com/QCoDeS/QCoDeS

composite_rules:
  - id: qcodes-package-context
    desc: QCoDeS data acquisition framework context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: qcodes-project-metadata
      - id: qcodes-source-path
      - id: qcodes-maintainer-email
      - id: qcodes-github-repo
