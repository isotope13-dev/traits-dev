defaults:
  platforms: [unix, windows]
  for: [python]
  crit: baseline
  conf: 0.96

traits:
  - id: source-tree
    desc: redis-py Python source tree
    crit: notable
    if:
      type: path
      # Match characteristic redis-py module files, not any project directory
      # named `redis` (for example tccli/services/redis/redis_client.py).
      regex: '(^|[\\/])redis[\\/](client|connection)\.py'

  - id: redislite-source-download
    desc: redislite downloads Redis source archive
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'https?://(download\.redis\.io/releases/redis-|github\.com/redis/redis/archive/)'
