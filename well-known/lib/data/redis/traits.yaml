defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll, so, dylib]
  size_min: 65536
traits:
  - id: redis-module-export
    desc: Redis module API export symbol
    crit: notable
    conf: 0.95
    if:
      type: symbol
      regex: ^RedisModule_

  - id: redis-source-tree
    desc: Redis release source-tree path
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, python, scripts]
    if:
      type: path
      regex: '(^|[\\/])redis-[0-9][^\\/]*'
