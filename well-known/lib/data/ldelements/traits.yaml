# @lde/* packages from the LD Elements monorepo (github.com/ldelements/lde).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-name
    desc: LD Elements scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@lde/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: monorepo-repository-url
    desc: LD Elements monorepo GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]ldelements/lde'

composite_rules:
  - id: package-identity
    desc: LD Elements monorepo npm package identity
    crit: notable
    conf: 0.99
    all:
      - id: scoped-package-name
      - id: monorepo-repository-url
