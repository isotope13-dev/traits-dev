# Canton Network wallet monorepo packages (@canton-network/*).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: canton-scoped-package-name
    desc: Official @canton-network scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@canton-network/'

  - id: canton-npm-scoped-name
    desc: Official @canton-network npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@canton-network/'
