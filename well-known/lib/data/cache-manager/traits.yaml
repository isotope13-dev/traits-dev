defaults:
  platforms: [unix, windows]

traits:
  - id: cache-manager-repository-pair
    desc: Cache Manager package and upstream repository
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '(?s)"name"\s*:\s*"cache-manager".{0,1000}github\.com/jaredwray/cacheable'

