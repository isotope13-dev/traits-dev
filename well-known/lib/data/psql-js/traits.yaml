# A JavaScript reimplementation of psql and libpq, shipped as a vendored
# `psql` package. Files carrying it hold PostgreSQL client code -- COPY ...
# PROGRAM strings and TLS-verification handling are the library's own
# implementation, not an injection attempt or a bypass, so SQL-injection and
# TLS-bypass rules reference these as context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: psql-implementation-path
    desc: Embedded psql implementation path
    conf: 0.94
    if:
      type: path
      regex: 'package[\\/]psql[\\/]'
  - id: psql-sql-help-table
    desc: PostgreSQL psql SQL help table
    conf: 0.95
    if:
      type: text
      substr: "SQL command help data for `\\h`"
  - id: postgresql-libpq-tls-client
    desc: PostgreSQL libpq TLS client implementation
    conf: 0.9
    if:
      type: text
      regex: '(?s)\blibpq\b.{0,400}\b(sslmode|sslrootcert|SSLRequest|checkServerIdentity)\b'
