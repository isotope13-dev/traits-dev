# Pathom3 — Wilker Lucio's Clojure/ClojureScript graph API. Local
# `resolve` on a resolver record is graph dispatch, not var reflection.
# edn-file-resolver's read-string loads EDN config.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text, xml]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: pathom3 Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: pathom3

  - id: pom-group
    desc: com.wsscode Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: com.wsscode

  - id: github-repo
    desc: wilkerlucio pathom3 GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/wilkerlucio/pathom3

  - id: namespace-path
    desc: pathom3 Clojure namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)com/wsscode/pathom3'
