# Oracle's JDBC driver contains adjacent Base64, cipher, and byte-range helper
# code as part of normal database authentication and transport support.
defaults:
  platforms: [windows, unix]
  for: [jar, zip]

traits:
  - id: oracle-jdbc-manifest
    desc: Oracle JDBC driver manifest
    crit: notable
    conf: 0.99
    if:
      type: value
      path: jar.manifest.main_class
      exact: oracle.jdbc.OracleDriver
