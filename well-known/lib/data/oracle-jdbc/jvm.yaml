# Oracle JDBC driver (ojdbc) — TLS and crypto helpers trigger obfuscation heuristics.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  crit: notable
  conf: 0.98

traits:
  - id: oracle-jdbc-driver-namespace
    desc: Oracle JDBC driver class namespace
    if:
      type: text
      substr: oracle/jdbc/

  - id: oracle-jdbc-driver-jar-name
    desc: Oracle JDBC driver JAR basename
    if:
      type: path
      basename: true
      regex: '(?i)ojdbc\d.*\.jar'

composite_rules:
  - id: oracle-jdbc-driver-context
    desc: Oracle JDBC driver library context
    any:
      - id: oracle-jdbc-driver-namespace
      - id: oracle-jdbc-driver-jar-name
