# Subsquid publishes scoped @subsquid/* packages from squid-sdk / squid
# monorepos. util-internal-* names are intentional public helpers, not
# dependency-confusion bait.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: subsquid-scoped-package-name
    desc: Official @subsquid scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@subsquid/'

  - id: subsquid-npm-scoped-name
    desc: Official @subsquid npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@subsquid/'

  - id: subsquid-util-internal-scoped-name
    desc: Subsquid util-internal scoped helper name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@subsquid/util-internal-'

  - id: subsquid-util-internal-npm-name
    desc: Subsquid util-internal npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@subsquid/util-internal-'

  - id: subsquid-github-repository-url
    desc: Subsquid organization GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]subsquid/'

  - id: subsquid-github-repository-field
    desc: Subsquid organization repository string field
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(?i)github\.com[:/]subsquid/'

  - id: subsquid-npm-github-repository
    desc: Subsquid npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]subsquid/'

  - id: subsquid-evm-rpc-package-name
    desc: Subsquid EVM RPC ingestion package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@subsquid/evm-rpc'

  - id: subsquid-evm-rpc-npm-name
    desc: Subsquid EVM RPC npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@subsquid/evm-rpc'

  - id: subsquid-evm-validation-schema-module
    desc: Subsquid util-internal-validation schema module
    for: [javascript, typescript]
    if:
      type: text
      substr: '@subsquid/util-internal-validation'

  - id: subsquid-scoped-module-import
    desc: Imports Subsquid scoped npm module
    for: [javascript, typescript]
    if:
      type: text
      substr: '"@subsquid/'

composite_rules:
  - id: subsquid-util-internal-official-context
    desc: Official Subsquid util-internal helper package
    crit: exception
    for: [package.json, npm]
    scope: archive
    all:
      - id: subsquid-util-internal-scoped-name
    any:
      - id: subsquid-github-repository-url
      - id: subsquid-github-repository-field
  - id: subsquid-util-internal-npm-official-context
    desc: Official Subsquid util-internal npm archive
    crit: exception
    for: [npm]
    scope: archive
    all:
      - id: subsquid-util-internal-npm-name
    any:
      - id: subsquid-npm-github-repository

  - id: subsquid-evm-ingestion-archive-context
    desc: Subsquid EVM chain RPC ingestion library
    crit: exception
    scope: archive
    any:
      - id: subsquid-evm-rpc-package-name
      - id: subsquid-evm-rpc-npm-name
      - id: subsquid-evm-validation-schema-module

  - id: subsquid-official-monorepo-scope
    desc: Official Subsquid scoped package
    crit: exception
    any:
      - id: subsquid-scoped-package-name
      - id: subsquid-npm-scoped-name

  - id: subsquid-official-org-repository
    desc: Official Subsquid organization repository
    crit: exception
    any:
      - id: subsquid-github-repository-url
      - id: subsquid-github-repository-field
      - id: subsquid-npm-github-repository

  - id: subsquid-official-scope-repository-pair
    desc: Official Subsquid monorepo package pairing
    crit: exception
    all:
      - id: subsquid-official-monorepo-scope
      - id: subsquid-official-org-repository
