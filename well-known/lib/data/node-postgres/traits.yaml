# node-postgres (`pg`) — PostgreSQL client for Node.js.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: node-postgres npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pg

  - id: vendored-path
    desc: vendored pg npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules[/\\]pg[/\\]'
