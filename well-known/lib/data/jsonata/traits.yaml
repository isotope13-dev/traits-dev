# jsonata — JSON query and transformation language.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: jsonata npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: jsonata

  - id: vendored-path
    desc: vendored jsonata package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/jsonata/'


composite_rules:
  - id: jsonata-library
    desc: jsonata JSON query library
    any:
      - id: package-name
      - id: vendored-path
