# Microsoft JDBC Driver for SQL Server — ships Azure AD / managed-identity auth.
#
# ActiveDirectoryAuthentication reads the Azure IMDS OAuth2 token endpoint by
# design; that path is not credential harvesting.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  crit: notable
  conf: 0.98

traits:
  - id: mssql-jdbc-driver-namespace
    desc: Microsoft SQL Server JDBC driver namespace
    if:
      type: text
      substr: com/microsoft/sqlserver/jdbc/

  - id: mssql-jdbc-active-directory-auth-class
    desc: MSSQL JDBC Active Directory authentication class
    if:
      type: text
      substr: SQLServerConnection$ActiveDirectoryAuthentication

composite_rules:
  - id: mssql-jdbc-driver-context
    desc: Microsoft SQL Server JDBC driver library context
    any:
      - id: mssql-jdbc-driver-namespace
      - id: mssql-jdbc-active-directory-auth-class
