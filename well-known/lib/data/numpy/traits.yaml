# Official NumPy — fundamental array computing library for Python.
defaults:
  platforms: [unix, windows]
  for: [whl]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: NumPy wheel distribution name
    if:
      type: value
      path: whl.distribution
      exact: numpy

  - id: maintainer-email
    desc: NumPy developers maintainer email
    if:
      type: value
      path: whl.maintainer_email
      regex: '(?i)numpy-discussion@python\.org'

  - id: package-init-path
    desc: NumPy package __init__ member path
    for: [python, whl]
    if:
      type: path
      regex: '(^|[/\\])numpy[/\\]__init__\.py$'

composite_rules:
  - id: numpy-wheel-identity
    desc: Official NumPy PyPI wheel
    crit: notable
    conf: 0.99
    all:
      - id: wheel-distribution
      - id: maintainer-email

  - id: numpy-library-context
    desc: Official NumPy library context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: numpy-wheel-identity
      - id: package-init-path
