# validup — @validup/* packages from the tada5hi/validup monorepo.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Validup scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@validup/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Validup scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@validup/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-url
    desc: Validup monorepo GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]tada5hi/validup'

  - id: github-npm-repository
    desc: Validup npm archive repository field
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]tada5hi/validup'

composite_rules:
  - id: official-package-scope
    desc: Official Validup scoped package
    crit: notable
    conf: 0.99
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Validup monorepo repository
    crit: exception
    any:
      - id: github-repository-url
      - id: github-npm-repository

  - id: official-scope-repository-pair
    desc: Official Validup monorepo package pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
