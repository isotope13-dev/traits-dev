# ibm_db is IBM's official Ruby driver gem for Db2 data servers. Its
# extconf.rb downloads the Db2 CLI driver tarball from IBM's own public
# distribution host when IBM_DB_HOME is unset, then builds the native
# extension against it. A network request in that recipe is the documented
# driver-provisioning step, not install-hook exfiltration.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: extconf-ibm-copyright
    desc: ibm_db extconf.rb IBM copyright header
    for: [ruby]
    if:
      type: text
      substr: Copyright IBM Corporation

  - id: db2-cli-driver-download-host
    desc: Db2 CLI driver IBM distribution host
    for: [ruby]
    if:
      type: text
      substr: public.dhe.ibm.com

  # The Python wheel ships ibm_db_dll.pth containing exactly this import;
  # the module registers clidriver/bin via os.add_dll_directory on Windows.
  - id: dll-register-pth
    desc: ibm_db DLL-registration .pth import
    for: [python, shell]
    if:
      type: text
      substr: import _ibm_db_register_dll

  - id: ibm-db2-pe-company
    desc: IBM Db2 PE company metadata
    for: [pe, dll]
    size_min: 1024
    if:
      type: value
      path: pe.version.company
      regex: '(?i)International Business Machines'

  - id: ibm-db2-pe-product
    desc: IBM Db2 PE product name metadata
    for: [pe, dll]
    size_min: 1024
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)IBM.*DB2'

composite_rules:
  - id: ibm-db-official-gem-context
    desc: Recognized IBM Db2 driver gem recipe
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: extconf-ibm-copyright
      - id: db2-cli-driver-download-host

  - id: ibm-db2-client-library
    desc: Recognized IBM Db2 native client library
    crit: exception
    conf: 0.99
    for: [pe, dll]
    all:
      - id: ibm-db2-pe-company
      - id: ibm-db2-pe-product
