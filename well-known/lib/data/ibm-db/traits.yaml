# ibm_db — IBM DB2 CLI/ODBC Python driver and bundled clidriver redistributable.
# Native libs embed host/CPU/network diagnostics for DB support tooling; without
# this identity those strings read as system fingerprinting.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, python, text, shell]
  crit: notable
  conf: 0.99
  size_max: 500000000

traits:
  - id: cli-driver-banner
    desc: IBM DB2 CLI Driver banner string
    for: [elf, pe]
    if:
      type: text
      section: .rodata
      substr: 'IBM DB2 [CLI Driver]'

  - id: libdb2-soname
    desc: IBM DB2 client shared library basename
    for: [elf, pe]
    if:
      type: basename
      regex: '(?i)^libdb2(\.so|[.-])'

  - id: dll-register-pth
    desc: ibm_db Windows DLL registration .pth import
    for: [python, shell, text]
    size_max: 4096
    if:
      type: text
      substr: 'import _ibm_db_register_dll'

  - id: clidriver-path
    desc: IBM DB2 clidriver package path segment
    if:
      type: path
      regex: '(?i)(^|/)clidriver/(lib|bin|cfg)'
