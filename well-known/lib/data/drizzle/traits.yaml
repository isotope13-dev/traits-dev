# Drizzle ORM and the noddde Drizzle persistence adapter.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: noddde-drizzle-package-name
    desc: noddde Drizzle adapter package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@noddde/drizzle'

  - id: noddde-github-repository
    desc: noddde GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/dogganidhal/noddde(\.git)?$'

  - id: noddde-drizzle-import
    desc: noddde drizzle adapter import
    for: [javascript, typescript]
    if:
      type: text
      substr: '@noddde/drizzle'

  - id: drizzle-adapter-class
    desc: DrizzleAdapter class declaration
    for: [javascript, typescript]
    if:
      type: text
      substr: class DrizzleAdapter

composite_rules:
  - id: noddde-drizzle-adapter
    desc: noddde Drizzle ORM persistence adapter
    crit: notable
    conf: 0.99
    any:
      - id: noddde-drizzle-package-name
      - id: noddde-drizzle-import
    all:
      - id: drizzle-adapter-class
