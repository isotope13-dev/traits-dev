# stylefruits/fixpoint — Clojure test fixtures and datasources library.
# Name alone can resemble persistence "fixpoint" malware vocabulary; pin the
# Maven/GitHub/namespace identity so triage has a library anchor.
defaults:
  platforms: [unix, windows]
  for: [clojure, jar, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: lein-project-coords
    desc: stylefruits/fixpoint Leiningen project coords
    for: [text, clojure, jar]
    if:
      type: text
      substr: 'stylefruits/fixpoint'

  - id: github-repo
    desc: stylefruits/fixpoint GitHub repository URL
    for: [text, markdown, clojure]
    if:
      type: text
      substr: github.com/stylefruits/fixpoint

  - id: fixpoint-ns-core
    desc: fixpoint.core Clojure namespace
    for: [clojure]
    if:
      type: text
      regex: '\(ns\s+fixpoint\.core\b'

  - id: jar-artifact-path
    desc: fixpoint library source member path
    for: [jar, archives]
    if:
      type: path
      regex: '(?i)(^|/)fixpoint/(core|datasource)'
