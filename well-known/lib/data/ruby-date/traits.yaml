# date — Ruby standard library date gem (https://github.com/ruby/date).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: gem-name
    desc: date Ruby gem package name
    for: [gem]
    if:
      type: value
      path: gem.name
      exact: date

  - id: official-homepage
    desc: ruby/date official gem homepage
    for: [gem]
    if:
      type: value
      path: gem.homepage
      substr: github.com/ruby/date

  - id: upstream-repository
    desc: ruby/date upstream repository URL
    for: [ruby]
    if:
      type: text
      substr: github.com/ruby/date

composite_rules:
  - id: package-identity
    desc: Official ruby/date gem identity
    for: [gem, ruby]
    needs: 2
    any:
      - id: gem-name
      - id: official-homepage
      - id: upstream-repository

  - id: package-context
    desc: Official ruby/date gem context
    crit: exception
    for: [gem]
    all:
      - id: gem-name
      - id: official-homepage
