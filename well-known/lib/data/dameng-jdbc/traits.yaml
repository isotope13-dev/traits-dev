# Dameng (DM) JDBC driver — bundled in enterprise DB tooling.
#
# Configuration.class exposes uKeyLogin (USB-key login); the built-in Java
# keylogger substring matcher fires on the embedded "KeyLog" fragment.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java_class]
  crit: notable
  conf: 0.98

traits:
  - id: dameng-jdbc-namespace
    desc: Dameng JDBC driver class namespace
    if:
      type: text
      substr: dm/jdbc/

  - id: dameng-jdbc-driver-jar-name
    desc: Dameng JDBC driver JAR basename
    if:
      type: path
      basename: true
      regex: '(?i)DmJdbcDriver.*\.jar'

composite_rules:
  - id: dameng-jdbc-driver-context
    desc: Dameng JDBC driver library context
    any:
      - id: dameng-jdbc-namespace
      - id: dameng-jdbc-driver-jar-name
