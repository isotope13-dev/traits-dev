# Internal Prisma forks retain upstream provenance while publishing under a
# different scope.  This is benign context for the generic impersonation
# composites, not a positive identity or trust assertion.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: prisma-fork-description
    desc: Package describes an explicit Prisma fork
    crit: notable
    conf: 0.98
    if:
      type: value
      path: description
      regex: '^Fork of @prisma/[A-Za-z0-9._-]+\b'
  - id: prisma-internal-description
    desc: Package identifies itself as internal
    crit: notable
    conf: 0.98
    if:
      type: value
      path: description
      regex: '\bInternal package\b'
composite_rules:
  - id: prisma-fork-package-context
    desc: Recognized internal Prisma fork metadata
    crit: exception
    conf: 0.99
    all:
      - id: prisma-fork-description
      - id: prisma-internal-description
      - id: metadata/package/manifest/repository::prisma-repository-url
      - id: metadata/package/manifest/author/identity::prisma-author-email
