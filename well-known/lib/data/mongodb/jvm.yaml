# MongoDB Java driver (mongodb-driver-core / bson) identity markers.
#
# The driver ships first-party MONGODB-AWS and MONGODB-OIDC authentication,
# so `com.mongodb.internal.authentication` legitimately contains the AWS
# instance-metadata credential path, the GCE metadata token URL and the Azure
# IMDS token URL. Those endpoints are the documented auth mechanism, not
# credential harvesting, and the driver is bundled into a very large number of
# Spark/Hadoop/analytics uber-JARs. These markers give the cloud-token rules a
# precise library context to exclude.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  crit: notable
  conf: 0.95

traits:
  - id: mongodb-java-internal-auth-http-helper
    desc: MongoDB Java driver auth HttpHelper class
    if:
      type: text
      substr: com/mongodb/internal/authentication/HttpHelper

  - id: mongodb-java-client-settings-class
    desc: MongoDB Java driver MongoClientSettings class
    if:
      type: text
      substr: com/mongodb/MongoClientSettings

  - id: mongodb-java-connection-string-class
    desc: MongoDB Java driver ConnectionString class
    if:
      type: text
      substr: com/mongodb/ConnectionString
