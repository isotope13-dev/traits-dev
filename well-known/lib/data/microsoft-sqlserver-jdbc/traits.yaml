# Microsoft JDBC Driver for SQL Server. Its Active Directory authentication
# flow legitimately queries Azure IMDS for managed-identity OAuth tokens.
defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar, zip]

traits:
  - id: sqlserver-jdbc-class-namespace
    desc: Microsoft SQL Server JDBC class namespace
    crit: notable
    conf: 0.99
    if:
      type: value
      path: class.class_refs[*]
      regex: '^com/microsoft/sqlserver/jdbc/'

  - id: sqlserver-jdbc-bundle-manifest
    desc: Microsoft SQL Server JDBC bundle manifest
    crit: notable
    conf: 0.99
    for: [jar, zip]
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: com.microsoft.sqlserver.mssql-jdbc
