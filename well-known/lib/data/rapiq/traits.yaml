# rapiq — @rapiq/* query adapter packages from tada5hi/rapiq.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Rapiq scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@rapiq/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Rapiq scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@rapiq/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-url
    desc: Rapiq monorepo GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]tada5hi/rapiq'

  - id: github-npm-repository
    desc: Rapiq npm archive repository field
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]tada5hi/rapiq'

composite_rules:
  - id: official-package-scope
    desc: Official Rapiq scoped package
    crit: notable
    conf: 0.99
    for: [package.json, npm]
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Rapiq monorepo repository
    crit: exception
    for: [package.json, npm]
    any:
      - id: github-repository-url
      - id: github-npm-repository

  - id: official-scope-repository-pair
    desc: Official Rapiq monorepo package pairing
    crit: exception
    for: [package.json, npm]
    all:
      - id: official-package-scope
      - id: official-package-repo
