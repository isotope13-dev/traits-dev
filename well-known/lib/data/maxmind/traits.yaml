# MaxMind GeoLite2 city and country databases are packed binary tables.
defaults:
  size_min: 100000
  size_max: 200000000
  platforms: [unix, windows]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: geolite2-mmdb-basename
    desc: MaxMind GeoLite2 database file
    if:
      type: basename
      regex: '(?i)^GeoLite2-.+\.mmdb$'
