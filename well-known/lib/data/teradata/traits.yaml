# The Teradata Python driver ships a Go-built native driver (c-shared Go
# library loaded over ctypes). Thread-context and loader APIs are
# implementation details of that driver, not an injection payload.
# NOTE: patterns below are single-quoted, so regex dots need ONE backslash
# (\\. here would mean a literal backslash and never match).
defaults:
  platforms: [windows, unix]
  for: [whl, pe, so, dylib, python]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 1073741824

traits:
  - id: teradata-sql-package-path
    desc: Teradata SQL wheel or native member path
    if:
      type: path
      regex: '(^|[\\/])teradatasql-[0-9][^\\/]*\.whl'

  - id: teradata-sql-member-path
    desc: Teradata SQL native driver member path
    for: [pe, so, dylib]
    if:
      type: path
      regex: '(^|[\\/])teradatasql[\\/]teradatasql(\.x86)?\.(dll|so|dylib)$'

  - id: teradata-sql-module-path
    desc: Teradata SQL package tree path
    for: [scripts, binaries, manifests, data, source]
    if:
      type: path
      regex: '(^|[\\/])teradatasql[\\/]'

  - id: teradata-sql-sample-path
    desc: Teradata SQL driver sample script path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])teradatasql[\\/]samples'
