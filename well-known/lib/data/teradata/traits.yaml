# The Teradata Python driver ships a Go-built native DLL. Thread-context and
# loader APIs are implementation details of that c-shared driver, not an
# injection payload.
defaults:
  platforms: [windows, unix]
  for: [whl, pe]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 1073741824

traits:
  - id: teradata-sql-package-path
    desc: Teradata SQL wheel or native member path
    if:
      type: path
      regex: '(^|[\\/])teradatasql-[0-9][^\\/]*\\.whl'

  - id: teradata-sql-member-path
    desc: Teradata SQL native driver member path
    for: [pe]
    if:
      type: path
      regex: '(^|[\\/])teradatasql[\\/]teradatasql(\\.x86)?\\.dll$'

composite_rules:
  - id: teradata-sql-package-context
    desc: Recognized Teradata SQL driver package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: teradata-sql-package-path
      - id: teradata-sql-member-path
