# countries-and-timezones lookup tables.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: countries-and-timezones npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: countries-and-timezones
  - id: vendored-path
    desc: vendored countries-and-timezones package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/countries-and-timezones/'

composite_rules:
  - id: countries-and-timezones-library
    desc: countries-and-timezones data
    any:
      - id: package-name
      - id: vendored-path
