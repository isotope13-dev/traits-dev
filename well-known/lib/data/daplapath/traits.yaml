# daplapath — pathlib.Path for Statistics Norway's Dapla/GCS platform.
defaults:
  platforms: [unix, windows]
  for: [python, whl, text, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 2000000

traits:
  - id: wheel-distribution
    desc: daplapath Python wheel distribution
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: daplapath

  - id: package-path
    desc: daplapath library package path
    conf: 0.96
    if:
      type: path
      regex: '(^|[\\/])daplapath[\\/]'

  - id: ssb-author-email
    desc: Statistics Norway Dapla author email
    for: [pkginfo, text]
    conf: 0.98
    if:
      type: text
      substr: ort@ssb.no

  - id: dapla-group-context
    desc: Dapla group context environment name
    for: [python, text]
    conf: 0.97
    if:
      type: text
      substr: DAPLA_GROUP_CONTEXT
