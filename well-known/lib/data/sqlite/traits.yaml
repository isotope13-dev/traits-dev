defaults:
  size_max: 10485760
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.95

traits:
  - id: sqlite-tcl-init-export
    desc: SQLite Tcl init export
    if:
      type: export
      exact: Tclsqlite3_Init

  - id: sqlite3-init-export
    desc: SQLite init export
    if:
      type: export
      exact: Sqlite3_Init

  - id: sqlite-version-string
    desc: SQLite version string
    crit: component
    conf: 0.86
    if:
      type: text
      section: .rdata
      exact: sqlite_version

  # VERSIONINFO identity of an official SQLite build: the amalgamation's resource
  # script sets ProductName "SQLite" and CompanyName "SQLite Development Team".
  # Any application that links the shipped sqlite3.dll carries these fields, so
  # this identifies the library itself, not the program that bundles it.
  - id: pe-product-name-sqlite
    desc: PE version resource identifies SQLite
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: SQLite

  - id: pe-company-name-sqlite-dev-team
    desc: PE company metadata is SQLite Development Team
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: SQLite Development Team

composite_rules:
  - id: sqlite-version-resource-identity
    desc: Official SQLite library version metadata
    crit: notable
    conf: 0.97
    all:
      - id: pe-product-name-sqlite
      - id: pe-company-name-sqlite-dev-team

  - id: sqlite-tcl-extension-library
    desc: SQLite Tcl extension library
    crit: notable
    conf: 0.98
    all:
      - id: sqlite-tcl-init-export
      - id: sqlite3-init-export
    any:
      - id: sqlite-version-string
      - id: micro-behaviors/data/db/sqlite::sqlite-format

