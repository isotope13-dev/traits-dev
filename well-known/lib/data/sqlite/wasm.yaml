defaults:
  for: [wasm]
  platforms: [windows, unix]
  crit: component
  conf: 0.99

traits:
  - id: sqlite-wasm-open-export
    desc: SQLite WASM database-open export
    if:
      type: value
      path: wasm.exports[*]
      exact: sqlite3_open_v2

  - id: sqlite-wasm-prepare-export
    desc: SQLite WASM statement-prepare export
    if:
      type: value
      path: wasm.exports[*]
      exact: sqlite3_prepare_v3

  - id: sqlite-wasm-step-export
    desc: SQLite WASM statement-step export
    if:
      type: value
      path: wasm.exports[*]
      exact: sqlite3_step

  - id: sqlite-wasm-finalize-export
    desc: SQLite WASM statement-finalize export
    if:
      type: value
      path: wasm.exports[*]
      exact: sqlite3_finalize

composite_rules:
  - id: sqlite-wasm-library
    desc: SQLite WebAssembly library API surface
    crit: notable
    conf: 1.0
    all:
      - id: sqlite-wasm-open-export
    any:
      - id: sqlite-wasm-prepare-export
      - id: sqlite-wasm-step-export
      - id: sqlite-wasm-finalize-export
    needs: 3
