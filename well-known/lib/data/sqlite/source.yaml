# The SQLite amalgamation (sqlite3.c) folds the whole engine, including the
# Windows VFS (temp-path lookup, WriteFile, LoadLibrary/GetProcAddress for
# loadable extensions), into one C file that projects vendor verbatim. The
# generated banner identifies it.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: amalgamation-source-banner
    desc: SQLite amalgamation source banner
    if:
      type: text
      substr: 'This file is an amalgamation of many separate C source files from SQLite'
