# Allmaps — open georeferencing tooling (@allmaps/* from allmaps/allmaps).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Allmaps scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@allmaps/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Allmaps scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@allmaps/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-url
    desc: Allmaps monorepo GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[:/]allmaps/allmaps'

  - id: github-npm-repository
    desc: Allmaps npm archive repository field
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]allmaps/allmaps'

  - id: proj4-import
    desc: Allmaps projection stack proj4 import
    for: [javascript, typescript]
    if:
      type: text
      substr: "from 'proj4'"

  - id: transform-scope-import
    desc: Allmaps @allmaps/transform import
    for: [javascript, typescript]
    if:
      type: text
      substr: "@allmaps/transform"

  - id: ground-control-point-docs
    desc: Allmaps ground control point documentation
    for: [javascript, typescript]
    if:
      type: text
      substr: Ground Control Point

composite_rules:
  - id: official-package-scope
    desc: Official Allmaps scoped package
    for: [package.json, npm]
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Allmaps monorepo repository
    for: [package.json, npm]
    any:
      - id: github-repository-url
      - id: github-npm-repository

  - id: official-scope-repository-pair
    desc: Official Allmaps monorepo package pairing
    crit: exception
    for: [package.json, npm]
    all:
      - id: official-package-scope
      - id: official-package-repo

  - id: projection-functions-source
    desc: Allmaps compiled projection helper module
    crit: exception
    for: [javascript, typescript]
    all:
      - id: proj4-import
    any:
      - id: transform-scope-import
      - id: ground-control-point-docs

  - id: package-identity
    desc: Allmaps georeferencing package identity
    for: [package.json, npm]
    all:
      - id: official-package-scope
    any:
      - id: github-repository-url
      - id: github-npm-repository
