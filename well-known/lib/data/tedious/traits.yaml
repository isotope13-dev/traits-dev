# tedious is the community-standard TDS client for SQL Server in Node.js.
# lib/ntlm-payload.js implements the NTLMv2 client side of a database login:
# it takes the user's plaintext password, derives the protocol-mandated
# MD4-based NT hash (ntHash), and builds the Type-3 authenticate message
# (NTLMResponsePayload). MD4 here is not hash replay -- NTLM requires
# MD4(UTF-16LE(password)), and the hash is derived at login time from a
# supplied password, never from harvested material.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: tedious-ntlm-response-payload
    desc: Tedious NTLM response payload class
    if:
      type: text
      substr: NTLMResponsePayload

  - id: tedious-ntlmv2-response-methods
    desc: Tedious NTLMv2 response builder methods
    if:
      type: text
      regex: 'ntv2Hash|lmv2Response'

  - id: tedious-ntlm-auth-description
    desc: Tedious NTLM auth description string
    if:
      type: text
      substr: "'NTLM Auth'"

composite_rules:
  - id: tedious-ntlm-client-context
    desc: Recognized tedious NTLM client implementation
    crit: exception
    conf: 0.99
    all:
      - id: tedious-ntlm-response-payload
      - id: tedious-ntlmv2-response-methods
      - id: tedious-ntlm-auth-description
