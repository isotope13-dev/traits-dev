# Google LevelDB source vendored by native database bindings.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: source-copyright-banner
    desc: LevelDB source copyright banner
    if:
      type: text
      substr: 'Copyright (c) 2011 The LevelDB Authors'

  - id: source-namespace
    desc: LevelDB C++ namespace declaration
    if:
      type: text
      regex: '\bnamespace\s+leveldb\s*\{'

  - id: internal-db-header
    desc: Includes LevelDB internal database header
    if:
      type: text
      regex: '#include\s+"db/(db_impl|version_set|memtable)\.h"'

composite_rules:
  - id: leveldb-source
    desc: Google LevelDB database engine source
    needs: 2
    any:
      - id: source-copyright-banner
      - id: source-namespace
      - id: internal-db-header
