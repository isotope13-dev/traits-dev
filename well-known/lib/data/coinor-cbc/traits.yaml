# COIN-OR CBC — open-source branch-and-cut linear programming solver.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 500000000

traits:
  - id: cgl-wiki-reference
    desc: COIN-OR Cgl wiki documentation URL
    for: [pe, elf, macho, text]
    if:
      type: text
      substr: 'github.com/coin-or/Cgl/wiki/'

  - id: cbc-model-reference
    desc: COIN-OR CbcModel class reference
    for: [pe, elf, macho, text]
    if:
      type: text
      substr: 'CbcModel'

  - id: coin-sample-problems-reference
    desc: COIN-OR sample problems directory path
    for: [pe, elf, macho, text]
    if:
      type: text
      substr: 'COIN-OR sample problems'

  - id: coin-packed-matrix-reference
    desc: COIN-OR CoinPackedMatrix class reference
    for: [pe, elf, macho, text]
    if:
      type: text
      substr: 'CoinPackedMatrix'

composite_rules:
  - id: coinor-cbc-solver-binary
    desc: COIN-OR branch-and-cut solver binary
    crit: notable
    conf: 0.99
    for: [pe, elf, macho]
    needs: 2
    any:
      - id: cgl-wiki-reference
      - id: cbc-model-reference
      - id: coin-sample-problems-reference
      - id: coin-packed-matrix-reference
