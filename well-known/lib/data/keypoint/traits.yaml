# Packed SIFT keypoint tables. INT 21h byte runs in the feature data
# are not a DOS directory infector.
defaults:
  size_min: 100000
  size_max: 100000000
  platforms: [unix, windows]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: sift-keypoint-basename
    desc: SIFT keypoint binary file
    if:
      type: basename
      regex: '(?i)^.+\.kp\.bin$'
