# mathiasbynens/emoji-regex — Unicode emoji matcher.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: emoji-regex npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: emoji-regex

  - id: vendored-path
    desc: vendored emoji-regex package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/emoji-regex/'
