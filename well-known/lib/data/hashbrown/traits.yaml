# hashbrown — Rust port of Google's SwissTable hash map
# (https://github.com/rust-lang/hashbrown). Core rustc/std dependency.
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, tar, crate]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 50000000

traits:
  - id: crate-name
    desc: hashbrown crate name in Cargo.toml
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: hashbrown

  - id: archive-crate-name
    desc: hashbrown crate archive package name
    for: [crate, tar]
    if:
      type: value
      path: crate.name
      exact: hashbrown

  - id: upstream-repository
    desc: hashbrown upstream repository URL
    if:
      type: text
      substr: github.com/rust-lang/hashbrown

  - id: swisstable-doc-lead
    desc: hashbrown SwissTable documentation lead
    for: [rust]
    if:
      type: text
      substr: "Rust port of Google's high-performance [SwissTable] hash"
