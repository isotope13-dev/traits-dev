defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  crit: baseline
  conf: 0.98
  size_max: 5000000
traits:
- id: sql-js-init-wrapper
  desc: sql.js initSqlJs wrapper
  for: [javascript, typescript]
  if:
    type: text
    substr: initSqlJsPromise
- id: sql-js-module-export
  desc: sql.js module export
  for: [javascript, typescript]
  if:
    type: text
    substr: module.exports=initSqlJs
- id: sql-js-package-name
  desc: sql.js npm package name
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: sql.js
composite_rules:
- id: sql-js-wasm-bundle
  desc: sql.js WebAssembly bundle
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: sql-js-init-wrapper
  - id: sql-js-module-export
