# OpenMS — open-source C++ library for LC-MS mass spectrometry and proteomics (OpenMS/OpenMS).
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 500000000

traits:
  - id: console-utils-read-console-size
    desc: OpenMS ConsoleUtils readConsoleSize symbol
    conf: 0.99
    if:
      type: symbol
      regex: 'ConsoleUtils.*readConsoleSize'

  - id: namespace-symbol
    desc: OpenMS C++ namespace symbol prefix
    conf: 0.98
    if:
      type: symbol
      regex: '^(__ZN6OpenMS|OpenMS::)'

  - id: official-website
    desc: OpenMS project website reference
    conf: 0.95
    for: [elf, macho, pe, text]
    if:
      type: text
      substr: 'openms.de'

  - id: github-repo
    desc: OpenMS GitHub repository reference
    conf: 0.95
    for: [elf, macho, pe, text]
    if:
      type: text
      substr: 'OpenMS/OpenMS'

composite_rules:
  - id: openms-library-context
    desc: Recognized OpenMS mass spectrometry library context
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: console-utils-read-console-size
      - id: namespace-symbol
      - id: official-website
      - id: github-repo
