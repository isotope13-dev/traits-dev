# Official @elastic/elasticsearch JavaScript client.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.99

traits:
  - id: elasticsearch-js-package-name
    desc: Elasticsearch JS client npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@elastic/elasticsearch'

  - id: elasticsearch-js-npm-package-name
    desc: Elasticsearch JS client npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@elastic/elasticsearch'

  - id: elasticsearch-js-repository
    desc: Elasticsearch JS client upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/elastic/elasticsearch-js(\.git)?'

  - id: elasticsearch-js-npm-repository
    desc: Elasticsearch JS client npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: 'github\.com/elastic/elasticsearch-js(\.git)?'

  - id: elasticsearch-js-api-types-marker
    desc: Elasticsearch JS generated API types marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 'github.com/elastic/elasticsearch-js'

composite_rules:
  - id: elasticsearch-js-manifest-context
    desc: Elasticsearch JS client package manifest context
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: elasticsearch-js-package-name
      - id: elasticsearch-js-repository

  - id: elasticsearch-js-npm-context
    desc: Elasticsearch JS client npm archive context
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: elasticsearch-js-npm-package-name
      - id: elasticsearch-js-npm-repository

  - id: elasticsearch-js-package-context
    desc: Elasticsearch official JavaScript client context
    crit: exception
    conf: 1.0
    scope: outer
    any:
      - id: elasticsearch-js-manifest-context
      - id: elasticsearch-js-npm-context
