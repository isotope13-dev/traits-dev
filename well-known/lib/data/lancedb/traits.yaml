# LanceDB — Apache Lance vector database Python package (lancedb on PyPI).
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: lancedb-authors-spdx
    desc: LanceDB SPDX copyright banner
    crit: notable
    if:
      type: text
      substr: Copyright The LanceDB Authors
  - id: lancedb-package-module-path
    desc: LanceDB Python package path segment
    crit: notable
    if:
      type: path
      substr: lancedb/
  - id: lancedb-rust-extension-member
    desc: LanceDB native extension module path
    crit: notable
    for: [elf]
    if:
      type: path
      substr: _lancedb.abi3.so

composite_rules:
  - id: lancedb-python-distribution
    desc: Official LanceDB Python wheel distribution
    crit: exception
    conf: 0.99
    any:
      - id: lancedb-authors-spdx
      - id: lancedb-package-module-path
      - id: lancedb-rust-extension-member
