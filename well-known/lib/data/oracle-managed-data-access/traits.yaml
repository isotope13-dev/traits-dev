# Oracle Managed Data Access is a legitimate signed .NET database driver.
# Its managed-resource and embedded-assembly implementation can resemble a
# protected loader, so the identity requires the assembly version metadata,
# .NET framework marker, and Oracle Authenticode signer together.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 4096
  size_max: 500000000

traits:
  - id: oracle-managed-data-access-original-filename
    desc: Oracle Managed Data Access assembly filename
    if:
      type: value
      path: pe.version.original_filename
      exact: Oracle.ManagedDataAccess.dll

  - id: oracle-managed-data-access-product
    desc: Oracle Managed Data Access product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '^Oracle Data Provider for \.NET( Core|, Managed Driver)$'

composite_rules:
  - id: oracle-managed-data-access-library
    desc: Oracle Managed Data Access signed .NET library
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: oracle-managed-data-access-original-filename
      - id: metadata/vendor/identity::oracle-corporation-version-company
      - id: oracle-managed-data-access-product
      - id: metadata/signed/certificate/identity::pe-signer-oracle-america
