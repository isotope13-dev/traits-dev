# prismatic/schema — declarative Clojure(Script) data schema library.
# resolve / Class/forName appear in macro expansion; leave those micro-behaviors.
defaults:
  platforms: [unix, windows]
  for: [clojure, jar, text, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: lein-project-coords
    desc: prismatic/schema Leiningen project coords
    for: [text, clojure, jar]
    if:
      type: text
      substr: 'prismatic/schema'

  - id: github-repo
    desc: plumatic/schema GitHub repository
    for: [text, markdown, clojure]
    if:
      type: text
      substr: github.com/plumatic/schema

  - id: schema-ns-core
    desc: schema.core Clojure namespace
    for: [clojure]
    if:
      type: text
      regex: '\(ns\s+schema\.core\b'

  - id: jar-artifact-path
    desc: prismatic schema jar member path
    for: [jar, archives]
    if:
      type: path
      regex: '(?i)(^|/)schema/(core|macros)\.clj'

composite_rules:
  - id: prismatic-schema-library
    desc: Prismatic schema Clojure validation library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: lein-project-coords
      - id: github-repo
      - id: schema-ns-core
      - id: jar-artifact-path
    needs: 2
