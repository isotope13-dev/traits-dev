# TDCRPy — BIPM photo-physical stochastic model for liquid scintillation
# counting (TDCR / CIEMAT-NIST efficiency calculations).
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 32
  size_max: 50000000

traits:
  - id: wheel-distribution
    desc: tdcrpy wheel distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: tdcrpy

  - id: pypi-project-url
    desc: TDCRPy PyPI project homepage
    for: [whl]
    if:
      type: value
      path: whl.home_page
      substr: pypi.org/project/TDCRPy

  - id: bipm-author-email
    desc: BIPM maintainer contact email
    if:
      type: text
      substr: romain.coulon@bipm.org

  - id: bipm-affiliation
    desc: BIPM laboratory affiliation string
    for: [python]
    if:
      type: text
      substr: Bureau International des Poids et Mesures

  - id: github-repo
    desc: TDCRPy GitHub repository URL
    if:
      type: text
      substr: github.com/RomainCoulon/TDCRPy

  - id: python-import
    desc: TDCRPy Python package import
    for: [python]
    if:
      type: text
      regex: '\b(import tdcrpy|from tdcrpy)\b'

composite_rules:
  - id: tdcrpy-library
    desc: BIPM TDCRPy scintillation library
    needs: 2
    any:
      - id: wheel-distribution
      - id: pypi-project-url
      - id: bipm-author-email
      - id: bipm-affiliation
      - id: github-repo
      - id: python-import
