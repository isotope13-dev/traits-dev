# Official Snowflake Node.js driver (snowflake-sdk).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: package-name
    desc: snowflake-sdk npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: snowflake-sdk

  - id: driver-blurb
    desc: Snowflake Node.js driver blurb
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Node.js driver for Snowflake'

  - id: ocsp-cache-url
    desc: Snowflake OCSP response cache URL
    for: [javascript, typescript]
    if:
      type: text
      substr: ocsp.snowflakecomputing.com/ocsp_response_cache.json
