# VRM avatar models are glTF binaries. INT 21h byte runs in the mesh
# data are not a DOS directory infector.
defaults:
  size_min: 100000
  size_max: 100000000
  platforms: [unix, windows]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: vrm-model-basename
    desc: VRM avatar model file
    if:
      type: basename
      regex: '(?i)^.+\.vrm$'
