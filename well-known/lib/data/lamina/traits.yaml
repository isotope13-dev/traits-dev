# lamina — Zach Tellman event-driven Clojure data structures. Graphviz
# `sh dot`, AppleScript eval, and read-string interval parse are product
# visualization and query code, not a dropper.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: lamina Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: lamina

  - id: pom-group
    desc: lamina Maven group id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.group_id
      exact: lamina

  - id: github-repo
    desc: ztellman lamina GitHub repository
    conf: 0.97
    if:
      type: text
      substr: github.com/ztellman/lamina

  - id: defproject
    desc: lamina Leiningen defproject form
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject lamina'

  - id: core-namespace-path
    desc: lamina core namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)lamina/core\.clj$'

composite_rules:
  - id: lamina-maven-library
    desc: ztellman lamina Clojure library
    crit: notable
    conf: 0.99
    for: [jar, zip]
    all:
      - id: pom-group
      - id: pom-artifact
