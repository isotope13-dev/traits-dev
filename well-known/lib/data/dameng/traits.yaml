# Dameng JDBC driver classes. The driver has a large constant pool containing
# SQL, credential, connection, and input-validation vocabulary; that breadth
# can resemble generic credential-capture code without a vendor identity.
defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar, zip]

traits:
  - id: dameng-jdbc-package-graph
    desc: Dameng JDBC package type graph
    crit: notable
    conf: 0.99
    if:
      type: value
      path: class.class_refs[*]
      regex: '^dm/jdbc/'
