# Apache Beam runners manage job artifacts as ordinary platform integration:
# the Flink/Spark job servers upload jars via the runner REST API and delete
# them when the job finishes, the YAML provider fetches remote pipeline specs
# with a safe loader, and integration tests create and clean up cloud fixtures.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: beam-package-path
    desc: Apache Beam package or archive path
    for: [python-sdist, whl, tar, zip]
    if:
      type: path
      regex: '(^|[\\/-])apache[-_]beam[-_@0-9]'

  - id: beam-member-path
    desc: Apache Beam package member path
    for: [python, java, go, shell]
    if:
      type: path
      regex: '(^|[\\/])apache[\\/]beam\b'

  - id: beam-sdist-name
    desc: Apache Beam sdist package name
    for: [python-sdist]
    if:
      type: value
      path: python.name
      exact: apache-beam

composite_rules:
  - id: beam-package-context
    desc: Recognized Apache Beam package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: beam-package-path
      - id: beam-member-path
      - id: beam-sdist-name
