# Google Guava — Apache-2.0 Java utility library (com.google.common).
# Identity for class files and shaded JARs that embed Guava packages.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: guava-this-class
    desc: Guava class this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^com/google/common/'

  - id: guava-package-path
    desc: Guava com/google/common path fragment
    conf: 0.96
    if:
      type: path
      regex: '(?i)com/google/common'

  - id: guava-class-string
    desc: Guava package string in class pool
    conf: 0.95
    if:
      type: text
      substr: com/google/common/
