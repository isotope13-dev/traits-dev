# Postman dataset-engine SDK (@postman/dataset-engine-sdk).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Postman dataset-engine SDK package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@postman/dataset-engine-sdk'

  - id: vendored-path
    desc: Postman dataset-engine SDK path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '(^|[\\/])dataset-engine-sdk[\\/]'

  - id: client-implementation
    desc: Postman dataset-engine client implementation
    for: [javascript, typescript]
    if:
      type: text
      substr: 'SdkClient — public surface for talking to the dataset-engine daemon'

  - id: jdbc-state-header
    desc: Postman dataset-engine JDBC metadata header
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Dataset-Engine-Jdbc-Sql-State'
