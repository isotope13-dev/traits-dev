# PHCpy — Python bindings for PHCpack (janverschelde/PHCpack).
# ctypes.CDLL of libPHCpack and eval of polynomial strings are the
# solver API, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, text, elf, so]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: deb-package-name
    desc: python3-phcpy Debian package name
    platforms: [linux]
    for: [deb]
    if:
      type: value
      path: deb.package
      exact: python3-phcpy

  - id: package-metadata-name
    desc: PHCpy package metadata name
    for: [pkginfo, pkg_info]
    if:
      type: value
      path: name
      exact: PHCpy

  - id: github-repo
    desc: PHCpack GitHub repository
    for: [pkginfo, text, python]
    if:
      type: text
      substr: github.com/janverschelde/PHCpack

  - id: version-module-path
    desc: phcpy version module path
    for: [python]
    if:
      type: path
      regex: 'phcpy[\\/]version\.py'

  - id: algorithm-795-citation
    desc: PHCpack Algorithm 795 citation
    for: [elf, so]
    if:
      type: text
      section: .rodata
      substr: 'Algorithm 795: PHCpack'

  - id: native-library-basename
    desc: PHCpack cpython extension name
    for: [elf, so]
    if:
      type: basename
      regex: '^libPHCpack\.cpython'

composite_rules:
  - id: phcpy-package
    desc: PHCpy PHCpack Python bindings
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: deb-package-name
      - id: package-metadata-name
      - id: github-repo
      - id: version-module-path
      - id: algorithm-795-citation
      - id: native-library-basename
    needs: 2
