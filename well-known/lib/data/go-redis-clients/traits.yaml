# Official Go clients for Redis/Valkey (rueidis and valkey-io/valkey-go).
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, zip]
  crit: notable
  conf: 0.99

traits:
  - id: valkey-go-module
    desc: valkey-go Redis/Valkey client module
    if:
      type: text
      substr: github.com/valkey-io/valkey-go

  - id: rueidis-go-module
    desc: rueidis Redis client Go module path
    if:
      type: text
      substr: github.com/redis/rueidis
