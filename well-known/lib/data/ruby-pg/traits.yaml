# ruby-pg (gem `pg`) — Ruby PostgreSQL client (ged/ruby-pg). Connection#exec
# runs SQL via libpq; pair with socket use for cancel, not process replacement.
defaults:
  platforms: [unix, windows]
  for: [ruby, archives, gem]
  crit: notable
  conf: 0.98

traits:
  - id: module-namespace
    desc: Ruby PG top-level module namespace
    if:
      type: text
      regex: '(?m)^module PG\b'

  - id: connection-class-doc
    desc: PG::Connection libpq interface documentation
    if:
      type: text
      substr: 'The PostgreSQL connection class. The interface for this class is based on'

  - id: libpq-reference
    desc: ruby-pg libpq documentation URL
    if:
      type: text
      substr: 'postgresql.org/docs/current/libpq.html'

  - id: gem-name
    desc: Ruby pg gem package name
    for: [archives, gem, text]
    if:
      type: text
      regex: '(?m)^name: pg$'

composite_rules:
  - id: connection-library
    desc: Recognized ruby-pg PostgreSQL connection library
    conf: 0.99
    needs: 2
    any:
      - id: module-namespace
      - id: connection-class-doc
      - id: libpq-reference
      - id: gem-name
