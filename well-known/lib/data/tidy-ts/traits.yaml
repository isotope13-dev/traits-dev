# @tidy-ts/dataframe — TypeScript dataframe library with napi-rs native
# bindings (https://github.com/jtmenchaca/tidy-ts). Platform packages ship
# one prebuilt `.node` addon; not a hidden loader.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, pe, dll, elf, so, dylib, markdown]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000

traits:
  - id: platform-package-name
    desc: tidy-ts dataframe platform package name
    for: [package.json]
    size_max: 100000
    if:
      type: value
      path: name
      regex: '^@tidy-ts/dataframe-'

  - id: npm-archive
    desc: tidy-ts dataframe npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@tidy-ts/dataframe-'

  - id: github-repo
    desc: tidy-ts GitHub repository
    size_max: 100000
    for: [package.json, npm, markdown]
    if:
      type: text
      substr: github.com/jtmenchaca/tidy-ts

  - id: native-addon-basename
    desc: tidy-ts dataframe native addon basename
    size_min: 65536
    for: [pe, dll, elf, so, dylib]
    if:
      type: basename
      regex: '^tidy_ts_dataframe\.(linux|darwin|win32)-'

  - id: pdb-basename
    desc: tidy-ts dataframe PDB basename
    size_min: 65536
    for: [pe, dll]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: tidy_ts_dataframe.pdb
