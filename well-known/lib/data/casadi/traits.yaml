# CasADi — symbolic framework for nonlinear optimization (casadi/casadi).
# Ships SWIG-generated doc.i interface files with deeply nested docstrings.
defaults:
  platforms: [unix, windows]
  for: [whl, python, javascript, text, data]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-distribution
    desc: CasADi wheel distribution name
    for: [whl, pkginfo]
    if:
      type: value
      path: whl.distribution
      exact: casadi

  - id: package-member-path
    desc: CasADi package member path
    for: [python, javascript, text]
    if:
      type: path
      regex: '(^|[\\/])casadi[\\/]'

  - id: github-homepage
    desc: CasADi GitHub project homepage
    if:
      type: text
      substr: github.com/casadi/casadi

  - id: swig-doc-interface-basename
    desc: CasADi SWIG doc.i interface basename
    for: [javascript, text, data]
    if:
      type: basename
      exact: doc.i

  - id: swig-casadi-docstring-feature
    desc: CasADi SWIG docstring feature marker
    for: [javascript, text, data]
    if:
      type: text
      substr: '%feature("docstring") casadi::'

composite_rules:
  - id: casadi-wheel-identity
    desc: Official CasADi PyPI wheel
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: wheel-distribution
      - id: package-member-path

  - id: casadi-swig-documentation-interface
    desc: CasADi SWIG-generated documentation interface file
    crit: exception
    conf: 0.99
    for: [javascript, text, data]
    all:
      - id: swig-doc-interface-basename
      - id: swig-casadi-docstring-feature
    any:
      - id: casadi-wheel-identity
      - id: package-member-path
      - id: github-homepage
