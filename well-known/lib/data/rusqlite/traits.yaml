# rusqlite — ergonomic SQLite wrapper for Rust (github.com/rusqlite/rusqlite).
defaults:
  platforms: [unix, windows]
  for: [rust, cargo.toml, tar]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 50000000

traits:
  - id: crate-name
    desc: rusqlite crate name in Cargo.toml
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: rusqlite

  - id: repository-url
    desc: rusqlite upstream repository URL
    if:
      type: text
      substr: github.com/rusqlite/rusqlite

  - id: driver-doc-lead
    desc: rusqlite crate documentation lead
    for: [rust]
    if:
      type: text
      substr: Rusqlite is an ergonomic wrapper for using SQLite

composite_rules:
  - id: crate-context
    desc: rusqlite SQLite driver crate
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: crate-name
      - id: repository-url
      - id: driver-doc-lead
