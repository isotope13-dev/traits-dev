defaults:
  platforms: [windows, unix]
  for: [nupkg, pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Syncfusion Diagram WPF NuGet package identity
    for: [nupkg]
    if:
      type: value
      path: nupkg.id
      exact: Syncfusion.Diagram.WPF

  - id: assembly-name
    desc: Syncfusion Diagram WPF assembly identity
    for: [pe, dll]
    size_min: 10000
    size_max: 50000000
    if:
      type: text
      section: .rdata
      substr: Syncfusion.Diagram.WPF

  - id: vendor-domain
    desc: Syncfusion vendor domain
    for: [nupkg]
    size_min: 1000
    size_max: 100000000
    if:
      type: text
      substr: syncfusion.com

composite_rules:
  - id: diagram-wpf-identity
    desc: Recognized Syncfusion Diagram WPF package
    crit: notable
    conf: 0.99
    scope: archive
    all:
      - id: package-name
      - id: vendor-domain
