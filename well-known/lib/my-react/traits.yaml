# @my-react/* packages are MrWangJustToDo's experimental React-like framework.
# The terminal package ships an optional devtools preload that fetches the
# author's GitHub Pages bundle — not a hidden install-time payload.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: scoped-package-name
    desc: '@my-react scoped package metadata name'
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@my-react/'

  - id: myreact-devtools-url
    desc: MyReact devtools GitHub Pages endpoint
    for: [javascript, typescript]
    if:
      type: text
      substr: mrwangjusttodo.github.io/myreact-devtools

  - id: remote-script-loader-helper
    desc: MyReact remote script loader helper
    for: [javascript, typescript]
    if:
      type: text
      substr: function loadRemoteScript

composite_rules:
  - id: devtools-preload-context
    desc: MyReact optional devtools remote preload bundle
    crit: notable
    conf: 0.98
    for: [javascript, typescript, package.json]
    scope: archive
    all:
      - id: scoped-package-name
      - id: myreact-devtools-url
