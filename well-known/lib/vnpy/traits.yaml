# vn.py (vnpy.com) is the dominant open-source Python quantitative-trading
# framework in Chinese futures/equity markets. Its CTA and portfolio strategy
# API -- `<pkg>.trader.object` for the BarData/TickData/TradeData/OrderData
# record model, `<pkg>.trader.constant` for the Direction/Offset enums, and a
# CtaTemplate/StrategyTemplate subclass implementing on_init/on_bar/on_trade --
# is reused verbatim by commercial redistributions that rename only the
# top-level package (the Fuwen / 福纹量化 build ships it as
# `fw_core.fuwen_trader.trader.*`).
#
# Identity is therefore anchored on that API surface rather than on the `vnpy`
# package name, so a renamed fork still resolves to "trading-framework strategy
# module" instead of reading as unattributed finance code whose only findings
# are its Chinese identifiers. This is what tells a triager that `buy`/`sell`/
# `short`/`cover`, order ids and position arithmetic are framework calls.
defaults:
  platforms: [unix, windows]
  for: [python]
  conf: 0.9

traits:
  - id: trader-data-model-module
    desc: Imports a trader.object/trader.constant module
    crit: notable
    if:
      type: import
      regex: '(^|\.)trader\.(object|constant)$'

  - id: market-data-record-class
    desc: Imports a Bar/Tick/Trade/OrderData class
    crit: component
    if:
      type: import
      regex: '^(Bar|Tick|Trade|Order)Data$'

  - id: cta-template-base
    desc: Imports the CtaTemplate strategy base class
    crit: component
    if:
      type: import
      exact: CtaTemplate

  - id: strategy-template-base
    desc: Imports the StrategyTemplate base class
    crit: component
    if:
      type: import
      exact: StrategyTemplate

composite_rules:
  - id: vnpy-strategy-module
    desc: vn.py-family trading strategy module
    crit: notable
    conf: 0.92
    all:
      - id: trader-data-model-module
    any:
      - id: market-data-record-class
      - id: cta-template-base
      - id: strategy-template-base
