# Aquilia — async-native Python web framework (github.com/axiomchronicles/Aquilia).
# Flow-first routing, DI, sessions, OAuth2/OIDC auth, admin site, and deployment
# generators. HTTP 403/401 handling, SQL, uploads, and PBKDF2 are expected
# framework capabilities, not webshell behavior.
defaults:
  platforms: [unix, windows]
  for: [whl, python, markdown]
  crit: notable
  conf: 0.99

traits:
  - id: distribution-name
    desc: Aquilia Python distribution name
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: aquilia

  - id: framework-tagline
    desc: Aquilia async web framework tagline
    for: [python, markdown]
    if:
      type: text
      substr: Aquilia - Production-ready async Python web framework

  - id: repository-marker
    desc: Aquilia GitHub repository marker
    if:
      type: text
      regex: 'github\.com/(axiomchronicles|tubox-labs)/Aquilia'

composite_rules:
  - id: aquilia-framework
    desc: Aquilia async Python web framework distribution
    crit: notable
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: distribution-name
    any:
      - id: framework-tagline
      - id: repository-marker
