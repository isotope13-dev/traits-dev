# buf.build/go/protovalidate — Buf's Protocol Buffer validation library for Go.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: buf protovalidate module archive path
    if:
      type: path
      regex: 'buf\.build/go/protovalidate@'

  - id: module-import
    desc: buf protovalidate module import path
    for: [go]
    if:
      type: import
      substr: buf.build/go/protovalidate

composite_rules:
  - id: buf-protovalidate-library
    desc: Buf protovalidate Go module
    any:
      - id: archive-path
      - id: module-import
