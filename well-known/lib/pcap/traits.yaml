# libpcap is the packet-capture library behind tcpdump, Wireshark, nmap,
# Suricata and Zeek, and is vendored or shipped as -dev headers almost
# everywhere, so its public headers turn up constantly as loose files in a
# feed. They are also the files the pcap capability atoms in
# micro-behaviors/communications/capture/pcap/ keep tripping over: a header
# that only *declares* pcap_compile() or pcap_next_etherent() performs no
# capture, but every atom there is a text match over the same names.
#
# Deliberately a plain identity, referenced by no `unless:`. libpcap's own
# pcap.h legitimately declares the capture API and should keep saying so, and
# an include guard is three lines any file can copy — using it to suppress
# capture detections would hand attackers a one-line disarm.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  # Every tcpdump-group header names its include guard after the header itself
  # in lower case: 14 of the 15 in pcap/ use `lib_pcap_<name>_h`, and the
  # internal headers use `pcap_<name>_h` (pcap_int_h, pcap_util_h). pcap/
  # pcap-inttypes.h is the odd one out at `pcap_pcap_inttypes_h`, which an
  # anchored `lib_pcap_` match missed, so the `lib_` half is optional here.
  #
  # Matched as a guard *directive* rather than as a bare token so the identity
  # rests on the construct, not on a `pcap_..._h`-shaped identifier appearing
  # anywhere in a file. Lower case is not incidental and is deliberately not
  # relaxed with case_insensitive: third-party pcap wrappers spell their guards
  # `PCAP_WRAPPER_H`, and matching those would claim upstream identity for
  # someone else's header.
  #
  # Content-anchored, so it still identifies the header after the file is
  # pulled out of its tree and renamed.
  - id: libpcap-header-include-guard
    desc: libpcap header include guard (lib_pcap_*_h)
    if:
      type: text
      regex: '#\s*(ifndef|define)\s+(lib_)?pcap_[a-z0-9_]+_h\b'

  # The unpacked release tarball, for the common case of libpcap vendored into
  # a larger source tree (tcpdump, nmap, Suricata and Zeek all ship one).
  # Modelled on well-known/lib/c4core::c4core-source-tree.
  - id: libpcap-source-tree
    desc: libpcap release source tree member
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])libpcap-[0-9][0-9A-Za-z._-]*([\\/]|$)'
