# libpcap is the packet-capture library behind tcpdump, Wireshark, nmap,
# Suricata and Zeek, and is vendored or shipped as -dev headers almost
# everywhere, so its public headers turn up constantly as loose files in a
# feed. They are also the files the pcap capability atoms in
# micro-behaviors/communications/capture/pcap/ keep tripping over: a header
# that only *declares* pcap_compile() or pcap_next_etherent() performs no
# capture, but every atom there is a text match over the same names.
#
# Every libpcap public header opens with the include guard `lib_pcap_<name>_h`
# (lib_pcap_pcap_h, lib_pcap_bpf_h, lib_pcap_namedb_h, lib_pcap_funcattrs_h,
# lib_pcap_compiler_tests_h, …). That convention is unique to the tcpdump-group
# sources, is spelled out in the file body rather than its path, and so still
# identifies the header after it is pulled out of its tree and renamed.
#
# Deliberately a plain identity, referenced by no `unless:`. libpcap's own
# pcap.h legitimately declares the capture API and should keep saying so, and
# an include guard is three lines any file can copy — using it to suppress
# capture detections would hand attackers a one-line disarm.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: libpcap-header-include-guard
    desc: libpcap public header (lib_pcap_*_h guard)
    if:
      type: text
      regex: '\blib_pcap_[a-z0-9_]+_h\b'
