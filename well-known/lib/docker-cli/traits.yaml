# github.com/docker/cli — Docker command-line client (Go module source).
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: github.com/docker/cli module archive path
    if:
      type: path
      regex: 'github\.com/docker/cli@'

  - id: module-import
    desc: github.com/docker/cli import path
    for: [go]
    if:
      type: import
      substr: github.com/docker/cli

composite_rules:
  - id: docker-cli-library
    desc: Docker CLI Go client module
    any:
      - id: archive-path
      - id: module-import
