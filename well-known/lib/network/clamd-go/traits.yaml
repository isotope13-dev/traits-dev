# github.com/baruwa-enterprise/clamd — Go client for the ClamAV clamd protocol.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, markdown, text]
  crit: notable
  conf: 0.99

traits:
  - id: go-module-path
    desc: baruwa-enterprise clamd Go module path
    for: [go.mod, text]
    if:
      type: text
      substr: module github.com/baruwa-enterprise/clamd

  - id: upstream-repository-url
    desc: baruwa-enterprise clamd GitHub URL
    if:
      type: text
      substr: github.com/baruwa-enterprise/clamd

  - id: examples-eicar-fixture-path
    desc: clamd examples EICAR test fixture path
    if:
      type: path
      regex: '(^|[\\/])examples[\\/]eicar\.(txt|tar\.bz2)$'

composite_rules:
  - id: baruwa-clamd-go-library
    desc: Official baruwa-enterprise ClamAV clamd Go client
    crit: notable
    conf: 0.99
    scope: archive
    for: [zip, tar, go, go.mod]
    any:
      - id: go-module-path
      - id: upstream-repository-url

  - id: baruwa-clamd-eicar-test-fixture
    desc: clamd Go client ships standard EICAR test samples
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, tar, go]
    all:
      - id: baruwa-clamd-go-library
      - id: examples-eicar-fixture-path
