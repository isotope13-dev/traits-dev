# jshttp/content-type — parse and format HTTP Content-Type headers.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: content-type npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: content-type

  - id: repository
    desc: jshttp content-type repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: jshttp/content-type

  - id: wilson-copyright
    desc: content-type Wilson copyright header
    for: [javascript]
    if:
      type: text
      substr: 'Copyright(c) 2015 Douglas Christopher Wilson'

  - id: vendored-path
    desc: vendored content-type package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/content-type/'

composite_rules:
  - id: content-type-library
    desc: jshttp content-type header library
    any:
      - id: repository
      - id: wilson-copyright
      - id: vendored-path
      - id: package-name
