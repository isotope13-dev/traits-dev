# Octokit — GitHub's JavaScript SDK aggregation package.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: manifest-package-name
    desc: Octokit manifest package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: octokit

  - id: package-name
    desc: Octokit npm package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: octokit

  - id: canonical-repository-manifest
    desc: Octokit manifest GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(github:octokit/octokit\.js|(git\+)?https://github\.com/octokit/octokit\.js(\.git)?)$'

  - id: canonical-repository-manifest-url
    desc: Octokit manifest GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(github:octokit/octokit\.js|(git\+)?https://github\.com/octokit/octokit\.js(\.git)?)$'

  - id: canonical-repository
    desc: Octokit canonical GitHub repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      exact: github:octokit/octokit.js

composite_rules:
  - id: package-name-any
    desc: Octokit package name in manifest or npm
    crit: exception
    any:
      - id: package-name
      - id: manifest-package-name

  - id: canonical-repository-any
    desc: Octokit canonical repository in manifest or npm
    crit: exception
    any:
      - id: canonical-repository
      - id: canonical-repository-manifest
      - id: canonical-repository-manifest-url

  - id: package-repository-identity
    desc: Octokit package and repository identity
    crit: exception
    all:
      - id: package-name-any
      - id: canonical-repository-any
