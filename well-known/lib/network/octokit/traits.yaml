# Octokit — GitHub's JavaScript SDK aggregation package.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Octokit npm package name
    if:
      type: value
      path: npm.name
      exact: octokit

  - id: canonical-repository
    desc: Octokit canonical GitHub repository
    if:
      type: value
      path: npm.repository.url
      exact: github:octokit/octokit.js

composite_rules:
  - id: package-repository-identity
    desc: Octokit package and repository identity
    crit: exception
    all:
      - id: package-name
      - id: canonical-repository
