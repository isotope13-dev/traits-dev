# Baileys — the de-facto Node.js WhatsApp Web (multi-device) library.
#
# Worth an identity of its own because the fork ecosystem around it is where
# the abuse lives: dozens of republished `@<handle>/baileys` packages on npm
# carry the upstream tree plus a few lines that make the operator's channel
# grow or brand the bot owner's outgoing messages. Recognising the library is
# what lets those composites say "a fork of Baileys does X" rather than
# "some WhatsApp code does X".
#
# Both legs are Baileys-specific rather than WhatsApp-generic: `makeWASocket`
# is the library's single entry factory, and `WAProto` is the protobuf
# namespace it generates and re-exports. Neither appears in the official
# WhatsApp clients or in the unrelated `whatsapp-web.js`.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: make-wa-socket-factory
    desc: Baileys socket factory
    if:
      type: text
      regex: '\b(makeWASocket|makeNewsletterSocket)\b'
  - id: waproto-namespace
    desc: Baileys WAProto protobuf namespace
    if:
      type: text
      word: WAProto

  # A shim that only re-exports a scoped Baileys fork ships no library code of
  # its own: whatever the forked dependency does at runtime is what the shim's
  # consumer gets. Upstream `baileys` and unscoped forks are not matched.
  - id: scoped-baileys-fork-reexport
    desc: Re-exports a scoped Baileys fork
    for: [javascript]
    if:
      type: text
      regex: 'export\s+\*\s+from\s+[''"]@[\w.-]{1,40}/baileys[''"]'

  # Republished forks often print a forker handle when the entry module loads.
  # Upstream Baileys does not ship import-time publisher banners.
  - id: baileys-fork-publisher-console-banner
    desc: Baileys entry prints forker console banner
    for: [javascript]
    if:
      type: text
      regex: 'console\.log\(.{0,200}Made By @'

composite_rules:
  - id: baileys-library-identity
    for: [javascript, typescript, npm]
    desc: Baileys WhatsApp library
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: make-wa-socket-factory
      - id: waproto-namespace
