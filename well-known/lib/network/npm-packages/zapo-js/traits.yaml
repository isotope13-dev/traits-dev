# zapo-js — a TypeScript WhatsApp Web (multi-device) client library published
# under the @zapo-js scope. Its own packages (@zapo-js/native,
# @zapo-js/store-sqlite) are referenced by name from the library, and its
# client exposes a WaAuthClient class. Neither spelling appears in Baileys,
# whatsapp-web.js, or the official WhatsApp clients.
#
# Republished forks of zapo-js keep the upstream tree, so the identity leg is
# deliberately the library's own scope and class names rather than generic
# WhatsApp vocabulary. Consumers that merely depend on zapo-js do not carry
# the WaAuthClient class declaration, so they miss.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, npm, tar, zip]
  crit: notable
  conf: 0.93

traits:
  # Text atoms read member source files only. A container's own bytes are
  # never content-scanned, so the archive types stay on the composite, which
  # joins these members at archive scope.
  - id: zapo-js-scope-reference
    desc: References a @zapo-js scoped package
    for: [javascript, typescript]
    if:
      type: text
      regex: '@zapo-js/[a-z][a-z0-9-]{1,40}'

  - id: wa-auth-client-class
    desc: Names the zapo-js WaAuthClient class
    for: [javascript, typescript]
    if:
      type: text
      word: WaAuthClient

composite_rules:
  # The scope reference and the auth class live in different files of the
  # published tarball (the native backend selector and the auth client), so
  # the identity needs archive scope.
  - id: zapo-library-identity
    desc: zapo-js WhatsApp library
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: zapo-js-scope-reference
      - id: wa-auth-client-class
