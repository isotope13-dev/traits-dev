# delvedor/hpagent — Node.js HTTP(S) proxy agent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: hpagent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: hpagent

  - id: vendored-path
    desc: vendored hpagent package path
    for: [scripts, manifests, data, source, github-actions]
    if:
      type: path
      regex: 'node_modules/hpagent/'


composite_rules:
  - id: hpagent-library
    desc: hpagent HTTP/HTTPS proxy agent
    any:
      - id: package-name
      - id: vendored-path
