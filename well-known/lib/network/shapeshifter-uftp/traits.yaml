# Shapeshifter UFTP — Universal Flexibility Trading Protocol library for Python.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: shapeshifter-uftp-package-path
    desc: Shapeshifter UFTP package path
    if:
      type: path
      regex: '(?i)(^|[\\/])shapeshifter_uftp([\\/]|$)'

  - id: shapeshifter-usef-dns-record
    desc: UFTP USEF DNS record reference
    if:
      type: text
      substr: '_usef.'

  - id: shapeshifter-uftp-metadata-name
    desc: Shapeshifter UFTP package metadata name
    for: [pkginfo]
    if:
      type: text
      substr: 'Name: shapeshifter_uftp'

composite_rules:
  - id: shapeshifter-uftp-context
    desc: Shapeshifter UFTP protocol library context
    crit: exception
    conf: 0.99
    all:
      - id: shapeshifter-uftp-package-path
      - id: shapeshifter-usef-dns-record
