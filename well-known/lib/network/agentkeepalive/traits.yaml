# node-http-xin/agentkeepalive — HTTP keep-alive agent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: agentkeepalive npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agentkeepalive

  - id: vendored-path
    desc: vendored agentkeepalive package path
    if:
      type: path
      regex: 'node_modules/agentkeepalive/'

composite_rules:
  - id: agentkeepalive-library
    desc: agentkeepalive HTTP agent
    any:
      - id: package-name
      - id: vendored-path
