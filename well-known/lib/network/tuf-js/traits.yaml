# tuf-js — JavaScript implementation of The Update Framework.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: cache-debug-namespace
    desc: tuf-js cache debug namespace
    for: [javascript]
    if:
      type: text
      substr: "debug_1.default)('tuf:cache')"

  - id: package-name
    desc: tuf-js npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: tuf-js

  - id: repository-url
    desc: tuf-js source repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: theupdateframework/tuf-js

composite_rules:
  - id: tuf-js-library
    desc: tuf-js Update Framework client
    any:
      - id: cache-debug-namespace
      - id: package-name
