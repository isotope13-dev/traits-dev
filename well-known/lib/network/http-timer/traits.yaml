# @szmarczak/http-timer — HTTP request timings.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: http-timer npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@szmarczak/http-timer'

  - id: vendored-path
    desc: vendored http-timer package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@szmarczak/http-timer/'

composite_rules:
  - id: library
    desc: http-timer request timings
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
