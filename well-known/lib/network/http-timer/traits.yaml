# szmarczak/http-timer — timings for HTTP requests.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: "@szmarczak/http-timer npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@szmarczak/http-timer'

  - id: vendored-path
    desc: vendored @szmarczak/http-timer package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@szmarczak/http-timer/'


composite_rules:
  - id: http-timer-library
    desc: szmarczak http-timer library
    any:
      - id: package-name
      - id: vendored-path
