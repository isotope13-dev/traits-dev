# mathiasbynens/punycode.js — RFC 3492 Punycode codec.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: punycode npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: punycode

  - id: vendored-path
    desc: vendored punycode package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/punycode/'
