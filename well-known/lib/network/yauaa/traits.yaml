# Yauaa (Yet Another UserAgent Analyzer) — Niels Basjes's open source User-Agent parser library.
defaults:
  platforms: [unix, windows]
  for: [jar, class, java, yaml]
  crit: notable
  conf: 0.99

traits:
  - id: java-package-reference
    desc: Yauaa Java package reference
    for: [class, java]
    if:
      type: text
      substr: "nl/basjes/parse/useragent"

  - id: config-schema-url
    desc: Yauaa config schema URL
    for: [yaml]
    if:
      type: text
      substr: "https://yauaa.basjes.nl"

composite_rules:
  - id: yauaa-analyzer-library
    desc: Yauaa user-agent analyzer library
    any:
      - id: java-package-reference
      - id: config-schema-url
