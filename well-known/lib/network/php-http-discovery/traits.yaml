# php-http/discovery is a benign Composer library that finds installed
# HTTPlug and PSR-7 implementations. Its strategy registry legitimately uses
# concatenated static-method callables.
defaults:
  platforms: [unix, windows]
  for: [php, composer.json]
  crit: notable
  conf: 0.99

traits:
  - id: composer-package-name
    desc: php-http/discovery Composer package name
    for: [composer.json]
    if:
      type: value
      path: name
      exact: php-http/discovery

  - id: source-tree
    desc: php-http/discovery source tree
    for: [php]
    if:
      type: path
      regex: 'php-http[\\/]discovery'

composite_rules:
  - id: library-context
    desc: Recognized php-http/discovery library context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: composer-package-name
      - id: source-tree
