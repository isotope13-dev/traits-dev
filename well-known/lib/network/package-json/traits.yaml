# sindresorhus/package-json — fetch npm package metadata.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: package-json npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'package-json'

  - id: vendored-path
    desc: vendored package-json package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/package-json/'

composite_rules:
  - id: library
    desc: package-json metadata client
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
