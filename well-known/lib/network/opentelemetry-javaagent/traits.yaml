# OpenTelemetry Java auto-instrumentation agent (io.opentelemetry.javaagent),
# and the bundled com.google.cloud.opentelemetry.detection GCP resource
# detector it ships to auto-populate cloud resource attributes. Both legitimately
# read the GCE metadata service by design — observability plumbing, not
# credential harvesting.
defaults:
  platforms: [unix, windows]
  for: [class, jar]
  crit: notable
  conf: 0.98

traits:
  - id: javaagent-manifest-main-class
    desc: OpenTelemetry Java agent manifest main class
    for: [jar]
    if:
      type: value
      path: jar.manifest.main_class
      regex: '^io\.opentelemetry\.javaagent\.'

  - id: gcp-detector-class-package
    desc: GCP OpenTelemetry detector class package
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^com/google/cloud/opentelemetry/detection/'

composite_rules:
  - id: opentelemetry-javaagent-context
    desc: OpenTelemetry Java agent or GCP detector context
    crit: notable
    conf: 0.98
    any:
      - id: javaagent-manifest-main-class
      - id: gcp-detector-class-package
