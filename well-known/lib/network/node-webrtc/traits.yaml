# node-webrtc provides standards-compliant WebRTC bindings for Node.js. These
# stable package-family and upstream-project markers identify the library
# without pinning a release, artifact hash, or build path.
defaults:
  platforms: [windows, unix]
  for: [npm, package.json, binaries]
  crit: notable
  conf: 0.99

traits:
  - id: roamhq-wrtc-npm-package
    desc: RoamHQ node-webrtc npm archive
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@roamhq/wrtc(-(darwin|linux|win32)-(arm64|x64))?$'

  - id: roamhq-wrtc-package-manifest
    desc: RoamHQ node-webrtc package manifest
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@roamhq/wrtc(-(darwin|linux|win32)-(arm64|x64))?$'

  - id: node-webrtc-project-url
    desc: node-webrtc upstream project URL
    for: [binaries]
    size_min: 1048576
    if:
      type: text
      regex: 'https://github\.com/(WonderInventions|node-webrtc)/node-webrtc\b'

composite_rules:
  - id: node-webrtc-native-addon
    desc: Recognized node-webrtc native addon
    for: [binaries]
    all:
      - id: node-webrtc-project-url
      - id: metadata/binary/framework::node-api-native-addon
