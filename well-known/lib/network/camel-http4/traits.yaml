# Apache Camel camel-http4 — HTTP producer using Apache HttpClient 4.x.
# HttpClient.execute is the component's outbound transport, not C2.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, java_class]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: pom-artifact
    desc: camel-http4 Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: camel-http4

  - id: bundle-symbolic-name
    desc: camel-http4 OSGi bundle symbolic name
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.manifest.bundle_symbolic_name
      exact: org.apache.camel.camel-http4

  - id: implementation-title
    desc: Camel HTTP4 JAR implementation title
    for: [jar, zip]
    conf: 0.98
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: 'Camel :: HTTP4'

  - id: producer-class
    desc: Camel HTTP4 producer class name
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      exact: org/apache/camel/component/http4/HttpProducer

  - id: package-path
    desc: Camel HTTP4 component package path
    conf: 0.96
    if:
      type: path
      regex: 'camel/component/http4'
