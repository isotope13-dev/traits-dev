defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - javascript
  - python
  - ruby
  - php
  crit: notable
  conf: 0.99
  size_min: 16384
traits:
- id: go-module-member-path
  desc: Public Suffix List Go module member
  for:
  - scripts
  - source
  size_min: 0
  if:
    type: path
    regex: (^|[\\/])publicsuffix[\\/]list@v[0-9]
- id: mozilla-public-suffix-list-path
  desc: Mozilla public suffix list path
  conf: 0.95
  for:
  - text
  - data
  if:
    type: path
    basename: true
    exact: public-suffix-list.txt
- id: publicsuffix-org-list-header
  desc: Publicsuffix.org list header
  conf: 0.95
  for:
  - text
  - data
  if:
    type: text
    substr: publicsuffix.org/list/public_suffix_list.dat
- id: psl-herokuapp
  desc: Public suffix herokuapp.com
  conf: 0.9
  if:
    type: text
    substr: herokuapp.com
- id: psl-github-io
  desc: Public suffix github.io
  conf: 0.9
  if:
    type: text
    substr: github.io
- id: psl-netlify-app
  desc: Public suffix netlify.app
  conf: 0.9
  if:
    type: text
    substr: netlify.app
- id: cross-subdomain-paas-suffix-exclusion-list
  desc: Cross-subdomain PaaS suffix exclusion list
  conf: 0.95
  size_min: 0
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: herokuapp\.com[\s\S]{0,160}vercel\.app[\s\S]{0,160}netlify\.app
- id: psl-nfshost
  desc: Public suffix nfshost.com
  conf: 0.9
  if:
    type: text
    substr: nfshost.com
- id: psl-readthedocs
  desc: Public suffix readthedocs.io
  conf: 0.9
  if:
    type: text
    substr: readthedocs.io
- id: psl-azurewebsites
  desc: Public suffix azurewebsites.net
  conf: 0.9
  if:
    type: text
    substr: azurewebsites.net
- id: php-top-level-domain-catalog
  desc: Serialized PHP public-suffix lookup table
  conf: 0.98
  for:
  - php
  if:
    type: text
    regex: \$topLevelDomains\s*=\s*['\"]\{"0":"ac","1":"com\.ac"
composite_rules:
- id: public-suffix-list-content
  desc: Embedded public suffix list content
  conf: 0.95
  needs: 4
  any:
  - id: psl-herokuapp
  - id: psl-github-io
  - id: psl-netlify-app
  - id: psl-nfshost
  - id: psl-readthedocs
  - id: micro-behaviors/communications/url/host::cloudfront-domain-reference
  - id: psl-azurewebsites
- id: public-suffix-list
  desc: Embedded public suffix list
  conf: 0.95
  for:
  - scripts
  - binaries
  - data
  any:
  - id: mozilla-public-suffix-list-path
  - id: publicsuffix-org-list-header
  - id: public-suffix-list-content
- id: paas-hosting-suffix-trio
  desc: PaaS hosting suffix exclusion trio
  conf: 0.95
  size_min: 0
  all:
  - id: psl-herokuapp
  - id: micro-behaviors/communications/http/url/domain::vercel-app-suffix-text
  - id: psl-netlify-app
