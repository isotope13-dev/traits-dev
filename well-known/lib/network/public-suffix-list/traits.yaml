# Public Suffix List repository and its validation tooling.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.99

traits:
  - id: go-module-member-path
    desc: Public Suffix List Go module member
    if:
      type: path
      regex: '(^|[\\/])publicsuffix[\\/]list@v[0-9]'
