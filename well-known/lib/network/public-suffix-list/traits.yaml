# The Public Suffix List: the publicsuffix.org effective-TLD table, its Go
# module, and the copies embedded by browsers, cookie libraries, URL parsers
# and password managers to compute the registrable domain.
#
# The embedded table contains EVERY hosting, tunnel, IPFS-gateway and
# dynamic-DNS suffix, so single-domain C2/tunnel substring matchers
# false-positive on any file carrying it. That is why most references to this
# file are `unless:` contexts rather than positive evidence.
defaults:
  platforms: [unix, windows]
  # Native applications embed PSL tables too (Go URL and cookie libraries, for
  # example). Their tunnel suffixes are lookup data, not C2 indicators.
  for: [scripts, binaries, javascript, python, ruby, php]
  crit: notable
  conf: 0.99
  # A real table is tens of kilobytes; below that, a suffix match is a mention.
  size_min: 16384

traits:
  - id: go-module-member-path
    desc: Public Suffix List Go module member
    for: [scripts, source]
    # A module path identifies the list by name, with no table to be large.
    size_min: 0
    if:
      type: path
      regex: '(^|[\\/])publicsuffix[\\/]list@v[0-9]'
  - id: mozilla-public-suffix-list-path
    desc: Mozilla public suffix list path
    conf: 0.95
    for: [text, data]
    if:
      type: path
      basename: true
      exact: 'public-suffix-list.txt'
  - id: publicsuffix-org-list-header
    desc: Publicsuffix.org list header
    conf: 0.95
    for: [text, data]
    if:
      type: text
      substr: publicsuffix.org/list/public_suffix_list.dat
  - id: psl-herokuapp
    desc: Public suffix herokuapp.com
    conf: 0.9
    if:
      type: text
      substr: herokuapp.com
  - id: psl-github-io
    desc: Public suffix github.io
    conf: 0.9
    if:
      type: text
      substr: github.io
  - id: psl-netlify-app
    desc: Public suffix netlify.app
    conf: 0.9
    if:
      type: text
      substr: netlify.app
  - id: psl-nfshost
    desc: Public suffix nfshost.com
    conf: 0.9
    if:
      type: text
      substr: nfshost.com
  - id: psl-readthedocs
    desc: Public suffix readthedocs.io
    conf: 0.9
    if:
      type: text
      substr: readthedocs.io
  - id: psl-cloudfront
    desc: Public suffix cloudfront.net
    conf: 0.9
    if:
      type: text
      substr: cloudfront.net
  - id: psl-azurewebsites
    desc: Public suffix azurewebsites.net
    conf: 0.9
    if:
      type: text
      substr: azurewebsites.net
  - id: php-top-level-domain-catalog
    desc: Serialized PHP public-suffix lookup table
    conf: 0.98
    for: [php]
    if:
      type: text
      regex: '\$topLevelDomains\s*=\s*[''\"]\{"0":"ac","1":"com\.ac"'

composite_rules:
  # Four co-occurring suffixes, not one: each leg on its own is a common domain
  # (github.io, cloudfront.net) that an ordinary file may mention in passing.
  - id: public-suffix-list-content
    desc: Embedded public suffix list content
    conf: 0.95
    needs: 4
    any:
      - id: psl-herokuapp
      - id: psl-github-io
      - id: psl-netlify-app
      - id: psl-nfshost
      - id: psl-readthedocs
      - id: psl-cloudfront
      - id: psl-azurewebsites
  # The two path/header legs are `for: [text, data]`, but the file default is
  # code-only, so the umbrella composite could never fire on the standalone
  # `public-suffix-list.txt` that Apache HttpClient, publicsuffix-java and
  # tough-cookie ship verbatim -- exactly the file that trips single-domain
  # hosting matchers. Widened here so the `unless:` context works on it.
  - id: public-suffix-list
    desc: Embedded public suffix list
    conf: 0.95
    for: [scripts, binaries, data]
    any:
      - id: mozilla-public-suffix-list-path
      - id: publicsuffix-org-list-header
      - id: public-suffix-list-content
