# sindresorhus/latest-version — latest npm version lookup.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: latest-version npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'latest-version'

  - id: vendored-path
    desc: vendored latest-version package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/latest-version/'

composite_rules:
  - id: library
    desc: latest-version npm lookup
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
