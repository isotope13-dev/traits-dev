defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, archives]
  size_max: 600000000
traits:
  - id: runtime-library
    desc: libcurl runtime library object
    crit: baseline
    conf: 0.96
    for: [elf, macho, pe]
    if:
      type: basename
      regex: 'libcurl\.so(\.[0-9]+)*$'
  - id: windows-runtime-basename
    desc: Windows libcurl runtime DLL basename
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: path
      basename: true
      exact: libcurl.dll
  - id: windows-product
    desc: Windows libcurl product identity
    crit: component
    conf: 0.96
    for: [pe]
    if:
      type: value
      path: pe.version.product_name
      exact: The curl library
  - id: windows-internal-name
    desc: Windows libcurl internal name
    crit: component
    conf: 0.96
    for: [pe]
    if:
      type: value
      path: pe.version.internal_name
      exact: libcurl
  - id: mk-ca-bundle-script
    desc: curl mk-ca-bundle VBS script
    crit: notable
    conf: 0.98
    for: [vbs]
    platforms: [windows]
    if:
      type: basename
      exact: mk-ca-bundle.vbs
  - id: cargo-package-name
    desc: curl-sys Cargo package identity
    crit: notable
    conf: 0.99
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: curl-sys
  - id: cargo-upstream-repository
    desc: curl-sys upstream repository
    crit: notable
    conf: 0.99
    for: [cargo.toml]
    if:
      type: value
      path: package.repository
      substr: 'https://github.com/alexcrichton/curl-rust'
  # The per-file suppressor. A `scope: outer` composite over the two
  # Cargo.toml identity traits above was tried here and is NOT usable: the
  # findings that need suppressing land in vendored C and shell members, and
  # a manifest-gated leg does not resolve when `unless:` is evaluated on one
  # of those. The versioned crate directory name is checkable per file.
  - id: source-tree-path
    desc: curl-sys source tree member path
    crit: notable
    conf: 0.99
    for: [c, cpp, shell, perl]
    if:
      type: path
      regex: 'curl-sys-[0-9]'

  - id: configure-ac-path
    desc: curl configure script path
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: path
      regex: '/curl/configure\.ac$'

  - id: embedded-schannel-backend
    desc: Embedded libcurl Schannel TLS backend
    crit: notable
    conf: 0.99
    for: [pe]
    size_min: 50000
    size_max: 2000000000
    if:
      type: text
      exact: 'schannel: failed to create certificate chain engine: %s'
      section: .rdata
composite_rules:
  - id: windows-runtime-library
    desc: Windows libcurl runtime library identity
    crit: notable
    conf: 0.96
    all:
      - id: windows-product
      - id: windows-internal-name
