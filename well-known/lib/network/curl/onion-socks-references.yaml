composite_rules:
- id: native-libcurl-onion-socks
  desc: libcurl with SOCKS5 and onion references
  crit: notable
  all:
  - id: well-known/lib/network/curl::libcurl-version
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks5-proto
  - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.95
