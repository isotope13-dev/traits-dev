defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: source-path
    desc: noVNC source member path
    crit: notable
    conf: 0.98
    if:
      type: path
      substr: novnc/

  - id: name-marker
    desc: noVNC source name marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)noVNC|RFB keysyms'

  - id: rfb-marker
    desc: noVNC RFB implementation marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)RFB\.messages|pseudoEncodingVMware|pseudoEncodingQEMU'

  # NOTE: `ancillary-marker` (`(?i)AsyncClipboard|mozilla\.org/mozilla-central`)
  # was removed. Neither alternative is family-unique, which is the bar for a
  # well-known/ signature: `AsyncClipboard` is the W3C API name any web app
  # uses, and the mozilla-central link is cited in countless JS comments — the
  # js-beautify copy inside a REST-client add-on was reported as a noVNC
  # implementation. `name-marker` and `rfb-marker` below carry noVNC's own
  # vocabulary and still identify every real bundle.

composite_rules:
  - id: protocol-marker
    desc: noVNC RFB protocol implementation marker
    crit: notable
    conf: 0.98
    any:
      - id: name-marker
      - id: rfb-marker

  - id: source-context
    desc: Recognized noVNC source library context
    crit: exception
    conf: 0.99
    all:
      - id: source-path
      - id: protocol-marker
