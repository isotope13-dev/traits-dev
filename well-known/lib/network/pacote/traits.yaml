# npm/pacote — fetch npm package tarballs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: pacote npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: pacote

  - id: vendored-path
    desc: vendored pacote package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/pacote/'


composite_rules:
  - id: pacote-library
    desc: npm pacote package fetcher
    any:
      - id: package-name
      - id: vendored-path
