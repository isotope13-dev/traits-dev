# Envoy's xDS transport-socket schema can configure TLS session-key logging
# for network debugging. Generated protobuf classes retain `TlsKeyLog` in
# their constant pools; this is unrelated to keyboard capture.
defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.99

traits:
  - id: xds-tls-keylog-protobuf
    desc: Envoy xDS TLS session-key logging type
    if:
      type: value
      path: class.strings
      substr: envoy/extensions/transport_sockets/tls/v3/TlsKeyLog

  - id: xds-tls-protobuf-schema
    desc: Envoy xDS TLS protobuf schema
    if:
      type: value
      path: class.strings
      substr: envoy/extensions/transport_sockets/tls/v3/tls.proto
