# JSch (com.jcraft.jsch) is the SSH client library nearly every JVM project
# uses -- JGit, Ant, Gradle, Jenkins and Maven's wagon all ship it. Being an
# SSH client, it necessarily names id_rsa/id_ed25519 and known_hosts: its
# KnownHosts class *is* the known_hosts parser. Classes that merely call it
# carry the same markers, because the JVM constant pool stores the internal
# class name of every type a class references, so one text marker covers the
# library and its callers alike.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java, kotlin]
  crit: notable
  conf: 0.98
  size_min: 200
  size_max: 100000000

traits:
  - id: jsch-api-reference
    desc: References the JSch SSH client API
    if:
      type: text
      substr: com/jcraft/jsch
  # JGit's SSH transport package is the other half of this: SshConstants is a
  # constants class whose entire body is the literal names id_rsa, id_ecdsa,
  # id_ed25519 and known_hosts, and SshSessionFactory/JschConfigSessionFactory
  # wire it to a client. Any WAR that speaks git-over-ssh carries them.
  # WildFly Elytron's SSHCredential is the security framework's *type* for an
  # SSH credential: its body is the default key-file list (id_rsa, id_ecdsa,
  # id_ed25519) and the known_hosts path. Keycloak and Apicurio Registry both
  # ship elytron-credential.
  - id: elytron-ssh-credential-class
    desc: WildFly Elytron SSHCredential class
    if:
      type: text
      substr: org/wildfly/security/credential/SSHCredential
  - id: jgit-ssh-transport-class
    desc: JGit SSH transport class
    if:
      type: text
      regex: 'org/eclipse/jgit/transport/(Ssh|JschConfig)'
