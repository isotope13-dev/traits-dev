# Dedicated IPv4/IPv6 address libraries: ipaddr.js — the widely-vendored
# JavaScript library (a dependency of express, body-parser, proxy-addr, etc.)
# — and CPython's stdlib `ipaddress` module.
#
# Parsing and formatting addresses from integer octet lists is the whole point
# of the library, so it legitimately trips IP-construction/obfuscation matchers.
# Referenced as benign context by those rules so a vendored IP library does not
# read as C2-IP obfuscation.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
traits:
  - id: ipaddr-basename
    crit: notable
    desc: ipaddr.js library filename
    conf: 0.9
    if:
      type: basename
      regex: '^ipaddr(\.min)?\.js$'
  - id: ipaddr-parse-cidr-api
    crit: notable
    desc: ipaddr.js parseCIDR API
    conf: 0.85
    if:
      type: text
      exact: parseCIDR
  - id: ipaddr-special-ranges-api
    crit: notable
    desc: ipaddr.js SpecialRanges API
    conf: 0.85
    if:
      type: text
      exact: SpecialRanges
  - id: ipaddr-from-byte-array-api
    crit: notable
    desc: ipaddr.js fromByteArray API
    conf: 0.85
    if:
      type: text
      exact: fromByteArray
  # CPython's `ipaddress` module documents its integer constructor with
  # `IPv4Address('192.0.2.1') == IPv4Address(3221225985)`, a TEST-NET-1 example
  # in a docstring. Building an address from an int is this module's API, not
  # an obfuscated C2 endpoint.
  - id: cpython-ipaddress-module
    crit: notable
    desc: CPython stdlib ipaddress module
    conf: 0.97
    for: [python]
    if:
      type: text
      substr: 'A fast, lightweight IPv4/IPv6 manipulation library in Python.'
composite_rules:
  - id: ipaddr-api-markers
    crit: notable
    desc: ipaddr.js library API symbols
    conf: 0.85
    any:
      - id: ipaddr-parse-cidr-api
      - id: ipaddr-special-ranges-api
      - id: ipaddr-from-byte-array-api
  - id: ipaddr-js-library
    crit: notable
    desc: ipaddr.js IP-address library
    conf: 0.92
    any:
      - id: ipaddr-basename
      - id: ipaddr-api-markers
