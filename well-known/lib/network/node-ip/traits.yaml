# indutny/node-ip — IP address helper for Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ip npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ip

  - id: vendored-path
    desc: vendored node-ip package path
    if:
      type: path
      regex: 'node_modules/ip/'

composite_rules:
  - id: node-ip-library
    desc: indutny node-ip address helper
    any:
      - id: package-name
      - id: vendored-path
