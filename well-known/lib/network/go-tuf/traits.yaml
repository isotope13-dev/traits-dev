# Official Go TUF client (github.com/theupdateframework/go-tuf).
defaults:
  platforms: [unix, windows]
  for: [go, zip, go.mod]
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 50000000

traits:
  - id: module-path
    desc: go-tuf v2 Go module path
    if:
      type: text
      substr: github.com/theupdateframework/go-tuf/v2

  - id: source-archive-path
    desc: go-tuf module source archive path
    for: [go, zip]
    if:
      type: path
      regex: 'theupdateframework/go-tuf'
