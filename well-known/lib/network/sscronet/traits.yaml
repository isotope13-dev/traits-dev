# ByteDance ss-cronet is the Chromium cronet network stack shipped as
# libsscronet.so inside Trae and MarsCode. It reads TracerPid the same way
# Chromium's debugger_posix helper does, to annotate crashes.
defaults:
  size_min: 1000000
  size_max: 40000000
  platforms: [unix]
  for: [elf]
  crit: baseline
traits:
  - id: sscronet-basename
    desc: ByteDance ss-cronet shared library
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^libsscronet\.so(\.\d+)*$'
