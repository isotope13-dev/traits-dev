# Microsoft Application Insights Node.js SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: applicationinsights npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: applicationinsights

  - id: vendored-path
    desc: vendored applicationinsights package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/applicationinsights/'


composite_rules:
  - id: applicationinsights-library
    desc: Application Insights Node SDK
    any:
      - id: package-name
      - id: vendored-path
