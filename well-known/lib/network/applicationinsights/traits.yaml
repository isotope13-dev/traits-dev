# Microsoft Application Insights SDKs.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: applicationinsights npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: applicationinsights

  - id: vendored-path
    desc: vendored applicationinsights package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/applicationinsights/'

  - id: dotnet-repository-path
    desc: Application Insights .NET SDK repo path
    for: [xml, csharp, zip, tar]
    if:
      type: path
      regex: '(?i)ApplicationInsights-dotnet'

  - id: dotnet-msbuild-file
    desc: Application Insights MSBuild file
    for: [xml]
    if:
      type: path
      basename: true
      regex: '^(Package|AddXmlLanguage)\.targets$'

composite_rules:
  - id: applicationinsights-library
    desc: Application Insights Node SDK
    for: [javascript, typescript, package.json, scripts, manifests, data, source]
    any:
      - id: package-name
      - id: vendored-path

  - id: dotnet-msbuild-context
    desc: Application Insights MSBuild file context
    crit: exception
    for: [xml]
    all:
      - id: dotnet-repository-path
      - id: dotnet-msbuild-file
