# Paramiko is a dual-use Python SSH protocol library. Importing it identifies
# the dependency but does not, by itself, imply client or server behavior.
defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: paramiko-python-library
    desc: Paramiko Python SSH library
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: import
      exact: paramiko

  # The import symbol needs parsed Python; a path match also covers a vendored
  # or byte-compiled copy handed over without its source.
  - id: paramiko-source
    desc: Paramiko SSH library source
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'site-packages[\\/]paramiko[\\/]'

