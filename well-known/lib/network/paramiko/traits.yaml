# Paramiko is a Python SSH protocol library. Parsed imports live under
# metadata/import/python/paramiko; an import does not identify the consumer
# as Paramiko itself. This matcher identifies the installed source tree.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: paramiko-source
    desc: Paramiko SSH library source
    conf: 0.96
    if:
      type: path
      regex: 'site-packages[\\/]paramiko[\\/]'

