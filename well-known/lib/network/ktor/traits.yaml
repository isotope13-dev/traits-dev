# Ktor — JetBrains' Kotlin HTTP client library. Its CIO engine resolves DNS
# itself: CioDnsResolverKt.buildDnsQuery constructs standard A/AAAA queries
# sent over UDP/53. Raw query construction there is resolver behavior, not
# DNS tunneling. The class self-name is stable across ktor 2.x/3.x.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  crit: notable
  conf: 0.97

traits:
  - id: ktor-cio-dns-resolver-class
    desc: Ktor CIO DNS resolver class
    if:
      type: text
      substr: CioDnsResolverKt
