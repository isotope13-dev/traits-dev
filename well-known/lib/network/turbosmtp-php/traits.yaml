# magexon/turbosmtp-php — official turboSMTP PHP email API SDK.
defaults:
  platforms: [windows, unix]
  for: [php, zip, archives, json]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 50000000

traits:
  - id: composer-package-name
    desc: Composer package magexon/turbosmtp-php
    for: [json]
    if:
      type: text
      regex: '"name"\s*:\s*"magexon/turbosmtp-php"'

  - id: turbosmtp-client-class
    desc: TurboSMTPClient PHP SDK class
    for: [php]
    if:
      type: text
      substr: TurboSMTPClient

  - id: serversmtp-api-reference
    desc: serversmtp.com turboSMTP API reference URL
    if:
      type: text
      substr: serversmtp.com/turbo-api

composite_rules:
  - id: turbosmtp-php-sdk
    desc: Official turboSMTP PHP email API SDK
    crit: notable
    conf: 0.97
    any:
      - id: composer-package-name
      - id: turbosmtp-client-class
      - id: serversmtp-api-reference
