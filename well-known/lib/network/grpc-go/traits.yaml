# Identify the source tree using both its module declaration and maintenance
# layout. A standalone module declaration or directory reference is neutral.
defaults:
  platforms: [unix, windows]
  for: [zip, go.mod, shell, text]
  crit: notable
  conf: 0.99
traits:
  - id: protobuf-regeneration-lint-script
    desc: gRPC-Go protobuf lint script fingerprint
    for: [shell]
    if:
      type: text
      regex: 'golint[^\r\n]{0,80}/grpc_testing_not_regenerate/'
composite_rules:
  - id: grpc-go-library
    desc: gRPC-Go source tree module and lint layout
    scope: archive
    all:
      - id: metadata/package/name/identity::grpc-go-module-path
      - id: protobuf-regeneration-lint-script
