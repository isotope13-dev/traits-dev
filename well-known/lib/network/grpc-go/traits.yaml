# google.golang.org/grpc — official gRPC implementation for Go.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, text]
  crit: notable
  conf: 0.99

traits:
  - id: authors-copyright
    desc: gRPC authors Apache copyright header
    if:
      type: text
      regex: 'Copyright 20[0-9]{2} gRPC authors\.'

  - id: go-module-path
    desc: gRPC-Go module path
    for: [go.mod, text]
    if:
      type: text
      substr: 'module google.golang.org/grpc'

  - id: module-archive-path
    desc: gRPC-Go module archive path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'grpc-go@'

  - id: proto-regen-skip-dir
    desc: gRPC-Go protobuf regenerate skip directory
    for: [shell]
    if:
      type: text
      substr: grpc_testing_not_regenerate

composite_rules:
  - id: grpc-go-library
    desc: Official gRPC-Go library
    any:
      - id: go-module-path
      - id: authors-copyright
      - id: proto-regen-skip-dir
      - id: module-archive-path
