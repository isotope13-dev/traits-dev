# google.golang.org/grpc — official gRPC implementation for Go.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, text]
  crit: notable
  conf: 0.99

traits:
  - id: go-module-path
    desc: gRPC-Go module path
    for: [go.mod, text]
    if:
      type: text
      substr: 'module google.golang.org/grpc'

  - id: proto-regen-skip-dir
    desc: gRPC-Go protobuf regenerate skip directory
    for: [shell]
    if:
      type: text
      substr: grpc_testing_not_regenerate

composite_rules:
  - id: grpc-go-library
    desc: Official gRPC-Go library
    any:
      - id: go-module-path
      - id: proto-regen-skip-dir
