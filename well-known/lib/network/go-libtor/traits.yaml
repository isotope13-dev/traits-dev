defaults:
  platforms: [unix, windows, android]
  for: [scripts, binaries]
  crit: notable
  conf: 0.95
  size_max: 268435456

traits:
  - id: library-reference
    desc: go-libtor embedded Tor library reference
    if:
      type: text
      substr: go-libtor
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
