# @ldapjs/asn1 — BER/DER ASN.1 parsers from the ldapjs project (Joyent lineage).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: ldapjs ASN.1 scoped package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@ldapjs/asn1'

  - id: scoped-npm-package-identity
    desc: ldapjs ASN.1 scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@ldapjs/asn1'

  - id: upstream-repository
    desc: ldapjs ASN.1 upstream GitHub repository
    for: [package.json, javascript, typescript]
    if:
      type: text
      substr: github.com/ldapjs/asn1

  - id: github-npm-repository
    desc: ldapjs ASN.1 npm archive repository field
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)github\.com[:/]ldapjs/asn1'

  - id: ber-reader-class
    desc: ldapjs BerReader ASN.1 parser class
    for: [javascript, typescript]
    if:
      type: text
      substr: BerReader

  - id: ber-writer-class
    desc: ldapjs BerWriter ASN.1 serializer class
    for: [javascript, typescript]
    if:
      type: text
      substr: BerWriter

composite_rules:
  - id: official-package-scope
    desc: Official ldapjs ASN.1 package scope
    for: [package.json, npm]
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: package-identity
    desc: ldapjs ASN.1 package identity
    for: [package.json, npm]
    all:
      - id: official-package-scope
    any:
      - id: upstream-repository
      - id: github-npm-repository
