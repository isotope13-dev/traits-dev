# sindresorhus/registry-url — npm registry URL helper.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: registry-url npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'registry-url'

  - id: vendored-path
    desc: vendored registry-url package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/registry-url/'

composite_rules:
  - id: library
    desc: npm registry URL helper
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
