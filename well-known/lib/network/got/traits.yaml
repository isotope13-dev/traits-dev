# sindresorhus/got — Node.js HTTP client.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: docs-sindresorhus-example
    desc: got documentation example URL
    for: [javascript, typescript]
    if:
      type: text
      substr: "await got('https://sindresorhus.com'"

  - id: package-name
    desc: got npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: got

  - id: repository
    desc: got source repository
    for: [package.json]
    if:
      type: value
      path: repository
      exact: sindresorhus/got

composite_rules:
  - id: got-http-client
    desc: sindresorhus got HTTP client
    any:
      - id: docs-sindresorhus-example
      - id: package-name
