defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: serenity-rust-library-import
    desc: Rust Serenity Discord library import
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'use serenity::'
    unless:
      # A file that declares its own `mod serenity` is importing that local
      # module, not the crate. rust-analyzer's name-resolution tests build
      # exactly this shape (`mod serenity { .. } use serenity::*;`) to exercise
      # glob-import collisions.
      - type: text
        regex: '\bmod\s+serenity\b'
