defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - binaries
  crit: notable
  conf: 0.98
  size_min: 1000000
  size_max: 50000000
traits:
- id: arti-crate-source-path
  desc: Arti Tor implementation crate source path
  if:
    type: text
    substr: /arti/crates/tor-
- id: arti-rust-keystore-error
  desc: Arti keystore diagnostic message
  if:
    type: text
    substr: not supported in an Arti keystore
