# websockets/ws — Node.js WebSocket library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ws npm WebSocket package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ws

  - id: vendored-path
    desc: vendored ws package path
    if:
      type: path
      regex: 'node_modules/ws/'

composite_rules:
  - id: ws-library
    desc: ws WebSocket client/server library
    any:
      - id: package-name
      - id: vendored-path
