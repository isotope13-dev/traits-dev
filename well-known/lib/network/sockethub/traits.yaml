# @sockethub/* — Sockethub messaging platform (sockethub/sockethub).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: sockethub-scoped-package-name
    desc: Sockethub scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@sockethub/'

  - id: sockethub-scoped-npm-name
    desc: Sockethub scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@sockethub/'

  - id: sockethub-upstream-repository
    desc: sockethub/sockethub upstream repository
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(?i)sockethub/sockethub'

  - id: sockethub-upstream-repository-npm
    desc: Sockethub npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/sockethub/sockethub'

composite_rules:
  - id: sockethub-upstream
    desc: Sockethub upstream repository claim
    crit: notable
    any:
      - id: sockethub-upstream-repository
      - id: sockethub-upstream-repository-npm

  - id: package-identity
    desc: Sockethub platform npm package
    crit: notable
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: sockethub-upstream
    any:
      - id: sockethub-scoped-package-name
      - id: sockethub-scoped-npm-name
