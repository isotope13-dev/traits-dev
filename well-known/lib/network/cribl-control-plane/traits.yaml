# cribl-control-plane — Cribl's generated Python control-plane SDK.
# https://github.com/criblio/cribl_control_plane_sdk_python
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, pkginfo]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 50000000

traits:
  - id: cribl-control-plane-package-name
    desc: PyPI name is cribl-control-plane
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: cribl-control-plane

  - id: cribl-control-plane-repository
    desc: Cribl control-plane SDK repository URL
    for: [pkginfo, python, text]
    if:
      type: text
      substr: github.com/criblio/cribl_control_plane_sdk_python

  - id: cribl-control-plane-speakeasy-marker
    desc: Speakeasy-generated Cribl SDK metadata marker
    for: [pkginfo, python, text]
    if:
      type: text
      regex: '(?i)generated by Speakeasy'

composite_rules:
  - id: cribl-control-plane-package
    desc: Cribl generated Python control-plane SDK package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: cribl-control-plane-package-name
    any:
      - id: cribl-control-plane-repository
      - id: cribl-control-plane-speakeasy-marker
