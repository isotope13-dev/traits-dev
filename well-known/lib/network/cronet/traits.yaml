# Chromium's cronet network stack ships as cronet.<chrome-version>.dll.
# IsDebuggerPresent, VirtualProtect, and DeleteFileW are the crash and
# cache cleanup path, not an encrypted loader.
defaults:
  size_min: 1000000
  size_max: 80000000
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: cronet-versioned-basename
    desc: Versioned Chromium cronet DLL
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^cronet\.\d+\.\d+\.\d+\.\d+\.dll$'
