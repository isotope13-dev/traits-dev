# aiohttp — async HTTP client/server library for Python.
defaults:
  size_max: 20000000
  platforms: [windows, unix]
  for: [python, pyc, elf]
  crit: baseline

traits:
  - id: aiohttp-package-path
    desc: aiohttp package path segment
    crit: notable
    if:
      type: path
      regex: '(?i)(^|[\\/])aiohttp([\\/]|$)'

  - id: aiohttp-binary-package-path
    desc: aiohttp path in compiled extension
    crit: notable
    for: [elf]
    if:
      type: path
      regex: '(?i)aiohttp[\\/]'

composite_rules:
  - id: aiohttp-source-context
    desc: aiohttp package source path
    crit: notable
    any:
      - id: aiohttp-package-path
      - id: aiohttp-binary-package-path
