# wreq -- Python HTTP client with TLS/HTTP2 emulation. Its PyPI description
# advertises third-party solver services and browser fingerprints -- vendor
# packaging words, not the bundling application's behavior.
defaults:
  conf: 0.99
  platforms: [unix, windows]
traits:
  - id: wreq-pypi-package
    desc: wreq PyPI package metadata
    crit: notable
    conf: 0.99
    for: [pkginfo]
    if:
      type: text
      regex: '(?im)^Name:\s*wreq\s*$'
  - id: wreq-dist-info-path
    desc: wreq dist-info member path
    crit: notable
    conf: 0.99
    for: [pkginfo, python, text]
    if:
      type: path
      regex: 'wreq-[0-9][^/\\]*\.dist-info[\\/]'
composite_rules:
  - id: wreq-package-context
    desc: Recognized wreq library packaging context
    crit: exception
    for: [pkginfo, python, text]
    any:
      - id: wreq-pypi-package
      - id: wreq-dist-info-path
      - id: micro-behaviors/communications/http/client/library::wreq-import
