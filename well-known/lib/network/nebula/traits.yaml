# Slack Nebula overlay mesh VPN (github.com/slackhq/nebula). Example launchd
# plists use a relative binary path under a user dot-directory WorkingDirectory.
defaults:
  platforms: [unix, windows]
  for: [plist, go, gz, crate, zip, source, rust, xml]
  crit: notable
  conf: 0.99

traits:
  - id: slack-nebula-source-path
    desc: Slack Nebula mesh VPN source path
    if:
      type: path
      substr: slackhq/nebula

  - id: nebula-launchd-label
    desc: Slack Nebula launchd service label
    for: [plist, xml]
    if:
      type: text
      substr: net.defined.nebula

composite_rules:
  - id: slack-nebula-vpn-context
    desc: Slack Nebula overlay mesh VPN source
    crit: notable
    conf: 0.99
    any:
      - id: slack-nebula-source-path
      - id: nebula-launchd-label
