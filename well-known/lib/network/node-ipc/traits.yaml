# Imports, API names, and declarations alone are not library identity.
# Require the distinctive internal parser path and event dependency together
# with the socket-server implementation. Do not suppress added payloads.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99
composite_rules:
  - id: node-ipc-library
    desc: Recognized node-ipc JavaScript library bundle
    all:
      - id: metadata/file/comment::node-ipc-module-comment
      - id: metadata/lang/source/declaration::ipc-network-service-getters

  - id: node-ipc-source-implementation
    desc: Recognized node-ipc socket server source
    all:
      - id: metadata/import/npm/relative/2/entities/eventparser/js
      - id: metadata/import/npm/event-pubsub
      - id: metadata/lang/source/declaration::server-extends-events-class
    any:
      - id: micro-behaviors/communications/socket/listen::node-net-create-server
      - id: micro-behaviors/communications/socket/create::node-dgram-create-socket
      - id: micro-behaviors/communications/socket/listen::node-tls-create-server
    needs: 2

  - id: node-ipc-tls-server-context
    desc: node-ipc TLS server reads its listener key
    crit: exception
    all:
      - id: node-ipc-source-implementation
      - id: micro-behaviors/communications/socket/listen::node-tls-create-server
      - id: micro-behaviors/fs/read/file/target::node-read-key-file
