# node-ipc is a Node.js TCP/UDP/Unix-socket IPC library.  These markers
# identify the library implementation; they do not imply that a caller using
# its transport APIs is malicious.  Trojanized releases should retain this
# identity while separate behavior/objective traits describe any added code.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: node-ipc-package-name
    desc: node-ipc npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: node-ipc

  - id: node-ipc-bundle-marker
    desc: node-ipc bundled module marker
    for: [javascript]
    if:
      type: text
      regex: '(?m)^// node-ipc\.js$'

  - id: node-ipc-connect-api
    desc: node-ipc connection API marker
    crit: component
    for: [javascript]
    if:
      type: text
      substr: connectToNet

  - id: node-ipc-serve-api
    desc: node-ipc service API marker
    crit: component
    for: [javascript]
    if:
      type: text
      substr: serveNet

  # The source implementation uses these three modules together for its
  # message-oriented socket server.  They are more specific than a generic
  # TLS/private-key read and let credential-access rules distinguish a server
  # loading its own listener key from code harvesting a user's key.
  - id: node-ipc-event-parser-import
    desc: node-ipc event parser import
    for: [javascript]
    if:
      type: import
      exact: ../entities/EventParser.js

  - id: node-ipc-message-import
    desc: node-ipc message codec import
    for: [javascript]
    if:
      type: import
      exact: js-message

  - id: node-ipc-event-pubsub-import
    desc: node-ipc event bus import
    for: [javascript]
    if:
      type: import
      exact: event-pubsub

  - id: node-ipc-server-class
    desc: node-ipc socket server class
    for: [javascript]
    if:
      type: text
      regex: 'class\s+Server\s+extends\s+Events'

composite_rules:
  - id: node-ipc-api-surface
    desc: node-ipc connection and service APIs
    crit: notable
    conf: 0.99
    for: [javascript]
    near_bytes: 12000
    all:
      - id: node-ipc-connect-api
      - id: node-ipc-serve-api

  - id: node-ipc-library
    desc: Recognized node-ipc JavaScript library bundle
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: node-ipc-bundle-marker
      - id: node-ipc-api-surface

  - id: node-ipc-tls-server-context
    desc: node-ipc TLS server reads its listener key
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: node-ipc-event-parser-import
      - id: node-ipc-message-import
      - id: node-ipc-event-pubsub-import
      - id: node-ipc-server-class
      - id: micro-behaviors/communications/socket/listen::node-tls-create-server
      - id: micro-behaviors/fs/file/read::node-read-key-file

  # The source file is split across the package rather than carrying the
  # bundled `// node-ipc.js` marker and public connect/serve wrappers. These
  # exact internal imports plus the multi-transport server surface identify
  # the library implementation without treating ordinary socket use as a
  # library or malware signature.
  - id: node-ipc-source-implementation
    desc: Recognized node-ipc socket server source
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: node-ipc-event-parser-import
      - id: node-ipc-message-import
      - id: node-ipc-event-pubsub-import
      - id: node-ipc-server-class
    any:
      - id: micro-behaviors/communications/socket/listen::node-net-create-server
      - id: micro-behaviors/communications/socket/create::node-dgram-create-socket
      - id: micro-behaviors/communications/socket/listen::node-tls-create-server
    needs: 2
