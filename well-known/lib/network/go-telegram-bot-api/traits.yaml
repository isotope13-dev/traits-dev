# go-telegram-bot-api is a legitimate Go client library.  The library itself
# implements Telegram file uploads and contains a public test token; those
# facts are not evidence of a Telegram stealer without collection behavior.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, zip]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree
    desc: go-telegram-bot-api v5 source tree
    for: [go, zip]
    if:
      type: path
      regex: 'go-telegram-bot-api/telegram-bot-api/v5@v[0-9]'

  - id: module-path
    desc: go-telegram-bot-api v5 module declaration
    for: [go.mod]
    if:
      type: text
      exact: 'module github.com/go-telegram-bot-api/telegram-bot-api/v5'

  - id: module-import
    desc: Imports go-telegram-bot-api v5
    for: [go]
    if:
      type: import
      substr: github.com/go-telegram-bot-api/telegram-bot-api/v5

composite_rules:
  - id: go-telegram-bot-api-library
    desc: go-telegram-bot-api v5 Go client library
    any:
      - id: source-tree
      - id: module-path
      - id: module-import

  - id: library-source-context
    desc: Recognized go-telegram-bot-api source package context
    crit: exception
    conf: 0.99
    any:
      - id: source-tree
      - id: module-path
