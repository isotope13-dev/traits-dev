# OpenTelemetry Collector Contrib publishes each receiver, processor,
# exporter, connector, and extension as a separate Go module. The proxy zip
# root preserves the canonical module path, providing a version-independent
# identity without trusting README or source comments.
defaults:
  platforms: [unix, windows]
  for: [zip]
  crit: notable
  conf: 0.99

traits:
  - id: contrib-go-module-archive
    desc: OpenTelemetry Collector Contrib module archive
    if:
      type: value
      path: archive.members[*].path
      regex: '^github\.com/open-telemetry/opentelemetry-collector-contrib/.+@v'
