# libnet constructs and sends packets. Its stats line is "packets sent:"
# next to packet errors and byte counts, which is not a flood banner.
defaults:
  size_min: 10000
  size_max: 2000000
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.9
traits:
  - id: libnet-basename
    desc: libnet packet construction library
    if:
      type: basename
      regex: '(?i)^libnet\.so(\.\d+)*$'
