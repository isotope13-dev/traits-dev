# agent-base — wrap a function as an http.Agent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: agent-base npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: agent-base
  - id: vendored-path
    desc: vendored agent-base package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/agent-base/'

composite_rules:
  - id: agent-base-library
    desc: agent-base HTTP agent helper
    any:
      - id: package-name
      - id: vendored-path
