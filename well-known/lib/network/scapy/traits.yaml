# Scapy is an interactive packet manipulation library for Python.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  # The distributed launcher delegates argv to the UTscapy test runner.
  # Require the delegation as well as the import; a Scapy consumer alone is
  # not the command-line launcher. No basename or version is required.
  - id: utscapy-cli-launcher
    desc: Scapy UTscapy command-line launcher
    if:
      type: tree-sitter
      query: |
        (module
          (import_from_statement) @runner_import
          (expression_statement (call) @delegate)
          (#eq? @runner_import "from scapy.tools.UTscapy import main")
          (#eq? @delegate "main(sys.argv[1:])")) @launcher

  - id: scapy-package-docstring
    desc: Scapy package docstring
    if:
      type: text
      substr: "Scapy: interactive packet manipulation tool"

  - id: scapy-website-url
    desc: Scapy website URL
    if:
      type: text
      substr: "https://scapy.net"

  - id: scapy-copyright-banner
    desc: Scapy Philippe Biondi copyright banner
    if:
      type: text
      substr: "Copyright (C) Philippe Biondi <phil@secdev.org>"

  - id: scapy-file-header
    desc: Scapy source attribution header line
    if:
      type: text
      substr: "This file is part of Scapy"

  - id: utscapy-unit-test-infrastructure
    desc: UTscapy unit test infrastructure
    if:
      type: text
      substr: "Unit testing infrastructure for Scapy"

  - id: utscapy-embedded-assets
    desc: UTscapy embedded report files
    if:
      type: text
      substr: 'UTscapy_js = File("UTscapy.js"'

composite_rules:
  # Every scapy source file opens with the two-line attribution header
  # (scapy.net URL + Biondi or Potter copyright, or "part of Scapy") and the
  # package docstring appears in the package modules; any two of the four
  # markers identify the library.
  - id: scapy-library-context
    desc: Scapy library source context
    crit: exception
    conf: 0.99
    any:
      - id: scapy-package-docstring
      - id: scapy-website-url
      - id: scapy-copyright-banner
      - id: scapy-file-header
    needs: 2

  - id: scapy-package-archive
    desc: Scapy distribution package archive
    crit: exception
    conf: 0.99
    scope: outer
    for: [python, python-sdist, tar, zip]
    all:
      - id: scapy-package-docstring
    any:
      - id: scapy-website-url
      - id: scapy-copyright-banner

  - id: scapy-utscapy-test-fixture-context
    desc: Scapy UTscapy test runner asset context
    crit: exception
    conf: 0.99
    # Bind all three markers to one Python source file. The downstream archive
    # exception may aggregate this precise member-level context.
    scope: file
    for: [python, python-sdist, tar, zip]
    # The upstream UTscapy runner contains all three markers. A generic Scapy
    # source header identifies library code, not a test fixture; it cannot by
    # itself suppress an embedded-payload finding elsewhere in the archive.
    all:
      - id: scapy-file-header
      - id: utscapy-unit-test-infrastructure
      - id: utscapy-embedded-assets
