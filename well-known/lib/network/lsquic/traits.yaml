# LiteSpeed QUIC (lsquic) library implements QUIC and HTTP/3 protocol stacks.
defaults:
  size_min: 10000
  size_max: 200000000
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.95

traits:
  - id: lsquic-library
    desc: LiteSpeed QUIC library
    if:
      type: symbol
      exact: lsquic_engine_connect
