defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: cargo-package-name
    desc: pcap-sys Cargo package identity
    conf: 0.99
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      exact: pcap-sys

  - id: cargo-upstream-repository
    desc: pcap-sys upstream repository
    conf: 0.99
    for: [cargo.toml]
    if:
      type: value
      path: package.repository
      substr: 'https://github.com/jmmk/rustcap'

  - id: source-tree-path
    desc: libpcap source tree member path
    conf: 0.99
    for: [c, cpp, shell]
    if:
      type: path
      regex: '(pcap-sys-[0-9]|libpcap[\\/])'

  - id: pcap-int-header
    desc: libpcap internal header reference
    conf: 0.98
    for: [c, cpp]
    if:
      type: text
      substr: '#include "pcap-int.h"'

composite_rules:
  - id: libpcap-source-tree
    desc: libpcap packet capture library source tree
    crit: notable
    conf: 0.99
    any:
      - id: source-tree-path
      - id: pcap-int-header
