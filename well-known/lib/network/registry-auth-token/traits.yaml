# rexxars/registry-auth-token — npm registry auth token.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: registry-auth-token npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: 'registry-auth-token'

  - id: vendored-path
    desc: vendored registry-auth-token package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/registry-auth-token/'

composite_rules:
  - id: library
    desc: npm registry auth token helper
    all:
      - id: vendored-path
    any:
      - id: package-name
      - id: vendored-path
      - id: micro-behaviors/os/package-manager/config::node-auth-token-token
