# openconfig/ygot — YANG Go code generator (openconfig/ygot). Generated and
# example sources document YANG tree paths like /interface/ethernet/config in
# comments; those are schema paths, not RouterOS CLI commands.
defaults:
  platforms: [unix, windows]
  for: [go, zip, archives, text]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: openconfig ygot versioned source-tree member
    if:
      type: path
      regex: 'openconfig[\\/]ygot@'

  - id: go-module-path
    desc: openconfig ygot Go module path
    for: [go, text]
    if:
      type: text
      substr: module github.com/openconfig/ygot

  - id: yang-tree-comment
    desc: ygot YANG tree documentation comment
    for: [go, text]
    if:
      type: text
      substr: if we have a YANG tree

composite_rules:
  - id: ygot-yang-codegen-toolkit
    desc: openconfig ygot YANG Go code generator
    crit: notable
    scope: archive
    needs: 2
    any:
      - id: source-tree-member
      - id: go-module-path
      - id: yang-tree-comment
