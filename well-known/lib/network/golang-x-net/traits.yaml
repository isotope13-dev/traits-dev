# golang.org/x/net is the official Go supplementary networking library
# (IDNA, QUIC, HTTP/2, WebSocket, and related protocol packages).
defaults:
  platforms: [unix, windows]
  for: [go, text]
  crit: notable
  conf: 0.99

traits:
  - id: vendor-path
    desc: golang.org/x/net vendored source path
    if:
      type: path
      regex: 'golang\.org/x/net'

  - id: module-import
    desc: golang.org/x/net import path
    for: [go]
    if:
      type: import
      substr: golang.org/x/net/

  - id: idna-import-comment
    desc: golang.org/x/net/idna package import comment
    for: [go]
    if:
      type: text
      substr: 'package idna // import "golang.org/x/net/idna"'

  - id: quic-retry-rfc9001
    desc: golang.org/x/net QUIC Retry RFC 9001 tag
    for: [go]
    if:
      type: text
      substr: rfc9001#section-5.8

composite_rules:
  - id: golang-x-net-library
    desc: golang.org/x/net supplementary networking library
    any:
      - id: vendor-path
      - id: module-import
      - id: idna-import-comment
      - id: quic-retry-rfc9001
