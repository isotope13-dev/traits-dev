defaults:
  platforms: [unix, windows]
  for: [go, zip, source, data]
  crit: baseline
  conf: 0.99

traits:
  - id: source-tree-member
    desc: cretz/bine Go source-tree member
    for: [go, source, data]
    if:
      type: path
      regex: 'bine@v[0-9]'
  - id: source-archive-member
    desc: cretz/bine Go module source archive
    for: [zip]
    if:
      type: text
      substr: github.com/cretz/bine
  - id: geoip-embedded-data
    desc: cretz/bine generated GeoIP data source
    for: [go]
    if:
      type: path
      regex: 'geoipembed[\\/]bindata\.go$'

composite_rules:
  - id: bine-library-context
    desc: cretz/bine Tor library source context
    crit: notable
    conf: 0.99
    any:
      - id: source-tree-member
      - id: source-archive-member
      - id: geoip-embedded-data
