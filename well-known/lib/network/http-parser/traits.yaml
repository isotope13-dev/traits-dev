defaults:
  platforms:
  - unix
  - windows
  for:
  - gem
  - tar.gz
  - c
  crit: notable
  conf: 0.99
traits:
- id: http-parser-ruby-vendored-source-path
  desc: http_parser.rb vendored HTTP parser source path
  if:
    type: path
    regex: (^|[\\/])http_parser\\.rb-[0-9][^\\/]*\\.gem
- id: http-parser-vendored-source-path
  desc: Vendored HTTP parser source member path
  if:
    type: path
    regex: vendor[\\/]http-parser
