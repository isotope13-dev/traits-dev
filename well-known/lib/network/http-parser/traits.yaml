# http_parser.rb vendors the upstream HTTP parser test corpus and malformed
# framing examples as input data for its parser tests.
defaults:
  platforms: [unix, windows]
  for: [gem, tar.gz, c]
  crit: notable
  conf: 0.99

traits:
  - id: http-parser-ruby-vendored-source-path
    desc: http_parser.rb vendored HTTP parser source path
    if:
      type: path
      regex: '(^|[\\/])http_parser\\.rb-[0-9][^\\/]*\\.gem'

  - id: http-parser-vendored-source-path
    desc: Vendored HTTP parser source member path
    if:
      type: path
      regex: 'vendor[\\/]http-parser'

composite_rules:
  - id: http-parser-ruby-package-context
    desc: Recognized http_parser.rb source package
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: http-parser-ruby-vendored-source-path
      - id: http-parser-vendored-source-path
