# crawlo -- Python crawling framework.
defaults:
  platforms: [unix, windows]
traits:
- id: crawlo-pypi-package
  desc: Crawlo PyPI package metadata
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: text
    regex: '(?im)^Name:\s*crawlo\s*$'
- id: crawlo-python-module
  desc: Crawlo Python module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    regex: '^crawlo(\.|$)'
composite_rules:
  - id: crawlo-benign-automation-context
    desc: Recognized Crawlo crawler automation context
    crit: exception
    conf: 0.99
    for: [pkginfo, python]
    all:
      - id: crawlo-pypi-package
      - id: crawlo-python-module
    scope: archive
