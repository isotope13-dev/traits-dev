# inet.data — Clojure library for IP addresses, networks, and DNS names.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, java, class, java_class, clojure]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: pom-artifact
    desc: inet.data Maven artifact id
    for: [jar, zip]
    conf: 0.99
    if:
      type: value
      path: jar.pom.artifact_id
      exact: inet.data

  - id: package-path
    desc: inet.data Java package path
    conf: 0.96
    if:
      type: path
      regex: '(?i)inet/data/'

  - id: github-repo
    desc: inet.data GitHub repository URL
    for: [jar, zip, clojure, java, text]
    conf: 0.97
    if:
      type: text
      substr: github.com/llasram/inet.data

  - id: defproject
    desc: inet.data Leiningen defproject form
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(defproject inet.data'
