# abraham/twitteroauth — PHP Twitter OAuth 1.0a client.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: php-namespace
    desc: Abraham TwitterOAuth PHP namespace
    if:
      type: text
      substr: 'namespace Abraham\TwitterOAuth'

  - id: user-agent
    desc: TwitterOAuth user-agent header
    if:
      type: text
      substr: 'TwitterOAuth (+https://twitteroauth.com)'

  - id: vendored-path
    desc: TwitterOAuth library source path
    if:
      type: path
      regex: '(^|[\\/])twitteroauth([\\/]|$)'
