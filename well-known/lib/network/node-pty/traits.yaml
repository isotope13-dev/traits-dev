defaults:
  platforms: [windows, unix]
  for: [package.json, pe, dll]
  crit: notable
  conf: 0.99
  size_max: 524288000

traits:
  - id: node-pty-package-name
    desc: node-pty terminal process library package
    for: [package.json]
    if:
      type: value
      path: name
      exact: node-pty

  - id: node-pty-native-module
    desc: node-pty Windows ConPTY native module
    for: [pe, dll]
    if:
      type: path
      regex: '(?i)(^|[\\/])node-pty.{0,120}conpty\.node$'

  - id: bun-pty-spawn-export
    desc: Bun PTY process-spawn export
    for: [pe, dll]
    crit: component
    if:
      type: symbol
      exact: bun_pty_spawn

  - id: bun-pty-io-export
    desc: Bun PTY read or write export
    for: [pe, dll]
    crit: component
    if:
      type: symbol
      regex: '^bun_pty_(read|write)$'

  - id: portable-pty-crate-source-path
    desc: Rust portable-pty crate source path
    for: [pe, dll]
    crit: component
    if:
      type: text
      regex: '(?i)portable-pty-[0-9][^\\/]{0,30}[\\/]src[\\/]win[\\/]conpty\.rs'
      section: .rdata

  - id: vendored-js-path
    desc: vendored node-pty package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/node-pty/'

  - id: fork-pty-doccomment
    desc: node-pty fork-as-PTY documentation
    for: [javascript, typescript]
    if:
      type: text
      substr: Forks a process as a pseudoterminal

  - id: conpty-console-list-native
    desc: node-pty ConPTY console-list native
    for: [javascript, typescript]
    if:
      type: text
      substr: conpty_console_list

  - id: ipy-fork-options-type
    desc: node-pty IPtyForkOptions type name
    for: [javascript, typescript]
    if:
      type: text
      substr: IPtyForkOptions

composite_rules:
  - id: node-pty-native-module-context
    desc: Recognized node-pty ConPTY native module context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: node-pty-package-name
      - id: metadata/package/manifest/author/identity::author-microsoft-corporation
      - id: node-pty-native-module

  - id: bun-portable-pty-native-helper
    desc: Recognized Bun portable-pty Windows native helper
    crit: notable
    conf: 0.99
    for: [pe, dll]
    all:
      - id: bun-pty-spawn-export
      - id: bun-pty-io-export
      - id: portable-pty-crate-source-path

  - id: node-pty-javascript-library
    desc: Microsoft node-pty JavaScript PTY library
    for: [javascript, typescript]
    all:
      - id: vendored-js-path
    any:
      - id: node-pty-package-name
      - id: fork-pty-doccomment
      - id: conpty-console-list-native
      - id: ipy-fork-options-type
