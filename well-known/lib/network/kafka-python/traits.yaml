# kafka-python — pure Python Apache Kafka client (dpkp/kafka-python).
# SASL/SCRAM, SOCKS5, and HTTP CONNECT are the client, not C2.
# Identity only.
defaults:
  platforms: [unix, windows]
  for: [conda, python, json, text, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: conda-basename
    desc: kafka-python conda package basename
    for: [conda]
    if:
      type: value
      path: file.basename
      regex: '(?i)^kafka-python-'

  - id: conda-index-name
    desc: kafka-python conda index name
    for: [json]
    if:
      type: text
      regex: '"name":\s*"kafka-python"'

  - id: github-repo
    desc: dpkp kafka-python GitHub repository
    for: [json, text, markdown, python]
    if:
      type: text
      substr: github.com/dpkp/kafka-python

  - id: conda-forge-feedstock
    desc: conda-forge kafka-python feedstock URL
    for: [json, text]
    if:
      type: text
      substr: github.com/conda-forge/kafka-python-feedstock

  - id: console-entry
    desc: kafka-python CLI console-script entry
    for: [text, json]
    if:
      type: text
      substr: 'kafka-python = kafka.cli:run_cli'

composite_rules:
  - id: kafka-python-package
    desc: kafka-python Apache Kafka client
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: conda-basename
      - id: conda-index-name
      - id: github-repo
      - id: conda-forge-feedstock
      - id: console-entry
    needs: 2
