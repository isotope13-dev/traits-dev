# pyTelegramBotAPI (pytelegrambotapi on PyPI) — official Python Telegram
# Bot API wrapper. Library source and docs include @bot.message_handler
# decorator examples that are not evidence of a C2 bot.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl, zip]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-package-name
    desc: pyTelegramBotAPI wheel package name
    for: [pkginfo, whl]
    if:
      type: value
      path: name
      exact: pyTelegramBotAPI

  - id: github-repository
    desc: pyTelegramBotAPI upstream GitHub repo
    if:
      type: text
      substr: github.com/eternnoir/pyTelegramBotAPI

  - id: telebot-package-path
    desc: telebot package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])telebot[\\/]'

  - id: telebot-class
    desc: telebot TeleBot class definition
    for: [python]
    if:
      type: text
      substr: 'class TeleBot:'

composite_rules:
  - id: pytelegrambotapi-package-archive
    desc: pyTelegramBotAPI distribution archive
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, whl, archives]
    all:
      - id: wheel-package-name
    any:
      - id: github-repository
      - id: telebot-package-path
