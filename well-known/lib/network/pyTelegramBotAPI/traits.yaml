# pyTelegramBotAPI (pytelegrambotapi on PyPI) — official Python Telegram
# Bot API wrapper. Library source and docs include @bot.message_handler
# decorator examples that are not evidence of a C2 bot.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl, zip]
  crit: notable
  conf: 0.99

traits:
  - id: wheel-package-name
    desc: pyTelegramBotAPI wheel package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: pyTelegramBotAPI

  - id: github-repository
    desc: pyTelegramBotAPI upstream GitHub repo
    for: [python, pkginfo]
    if:
      type: text
      substr: github.com/eternnoir/pyTelegramBotAPI

  - id: telebot-package-path
    desc: telebot package member path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])telebot[\\/]'

  - id: telebot-class
    desc: telebot TeleBot class definition
    for: [python]
    if:
      type: text
      substr: 'class TeleBot:'

  - id: pyproject-package-name
    desc: pyTelegramBotAPI pyproject package name
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      exact: pyTelegramBotAPI

composite_rules:
  - id: pytelegrambotapi-package-archive
    desc: pyTelegramBotAPI distribution archive
    crit: exception
    conf: 0.99
    scope: archive
    for: [zip, whl, python-sdist, pkginfo]
    all:
      - id: wheel-package-name
    any:
      - id: github-repository
      - id: telebot-package-path

  # GitHub source tarballs carry no PKG-INFO, so the wheel-based exception
  # above cannot see them. The pyproject project name plus the telebot
  # package tree (or the upstream repo string) identifies the same
  # distribution; referenced only from telegram-finding unless: clauses.
  - id: pytelegrambotapi-source-distribution
    desc: pyTelegramBotAPI source distribution archive
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, zip, pyproject.toml, pkginfo]
    all:
      - id: pyproject-package-name
    any:
      - id: github-repository
      - id: telebot-package-path
