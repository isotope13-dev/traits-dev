# pywinrm is a dual-use Python WinRM (Windows Remote Management) client
# library. Referencing it identifies the dependency; it says nothing about
# whether the remoting is administrative or hostile.
defaults:
  platforms: [windows, linux, macos]
  for: [python, pyc]
  crit: notable
  conf: 0.95
  size_min: 64
  size_max: 100000000

traits:
  - id: pywinrm-python-library
    desc: pywinrm Python WinRM library
    if:
      type: text
      word: pywinrm
  - id: winrm-ntlm-transport
    desc: WinRM NTLM transport selection
    conf: 0.9
    if:
      type: text
      regex: 'transport\s*=\s*.{0,20}ntlm'
