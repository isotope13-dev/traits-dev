# OpenTelemetry JS SDK and resource machine-id detectors.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.99

traits:
  - id: machine-id-debug
    desc: OpenTelemetry machine-id detector debug log
    for: [javascript, typescript]
    if:
      type: text
      substr: 'error reading machine id:'

  - id: linux-machine-id-paths
    desc: OpenTelemetry Linux machine-id file paths
    for: [javascript, typescript]
    if:
      type: text
      substr: "'/etc/machine-id', '/var/lib/dbus/machine-id'"

  - id: win-machineguid-query
    desc: OpenTelemetry Windows MachineGuid registry query
    for: [javascript, typescript]
    if:
      type: text
      substr: 'QUERY HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Cryptography /v MachineGuid'

  - id: authors-copyright
    desc: OpenTelemetry Authors copyright header
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Copyright The OpenTelemetry Authors'

  - id: vendored-path
    desc: OpenTelemetry JS scoped package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: '@opentelemetry/'

  - id: scoped-package-identity
    desc: OpenTelemetry JS scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@opentelemetry/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: OpenTelemetry JS scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@opentelemetry/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: OpenTelemetry JS GitHub repository shorthand
    for: [package.json]
    if:
      type: value
      path: repository
      exact: open-telemetry/opentelemetry-js

  - id: github-repository-url
    desc: OpenTelemetry JS GitHub repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/open-telemetry/opentelemetry-js(\.git)?(/.*)?$'

  - id: github-repository-field
    desc: OpenTelemetry JS GitHub repository string field
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/open-telemetry/opentelemetry-js(\.git)?(/.*)?$'

  - id: github-npm-repository
    desc: OpenTelemetry JS npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)(open-telemetry/opentelemetry-js|github\.com[:/]open-telemetry/opentelemetry-js)'

composite_rules:
  - id: opentelemetry-js-library
    for: [javascript]
    desc: OpenTelemetry JavaScript SDK library
    all:
      - id: vendored-path
    any:
      - id: linux-machine-id-paths
      - id: win-machineguid-query
      - id: machine-id-debug
      - id: authors-copyright

  - id: official-package-scope
    desc: Official OpenTelemetry JS package scope
    crit: notable
    conf: 0.99
    for: [package.json, npm]
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official OpenTelemetry JS monorepo repository
    crit: exception
    for: [package.json, npm]
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-repository-field
      - id: github-npm-repository

  - id: official-scope-repository-pair
    desc: Official OpenTelemetry JS monorepo package pairing
    crit: exception
    for: [package.json, npm]
    all:
      - id: official-package-scope
      - id: official-package-repo
