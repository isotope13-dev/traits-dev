# idna -- the Python internationalized-domain-name library. Its lookup tables
# are machine-generated and carry the generator's banner verbatim, so a file
# full of unfamiliar Unicode domain data is the library's data, not an
# obfuscated payload. Sits beside punycode, the same standard's encoding.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: idna-generated-data
    desc: idna generated data table
    if:
      type: text
      substr: This file is automatically generated by tools/idna-data
