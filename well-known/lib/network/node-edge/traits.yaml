defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  crit: component
  conf: 0.96
  size_max: 5000000
traits:
- id: npm-package-name
  desc: node-edge npm package name
  crit: notable
  for:
  - package.json
  if:
    type: value
    path: name
    exact: node-edge
- id: runtime-header
  crit: notable
  desc: node-edge runtime basename
  for:
  - javascript
  if:
    type: path
    basename: true
    exact: node-edge.js
- id: runtime-config-paths
  crit: notable
  desc: node-edge runtime config paths
  for:
  - javascript
  if:
    type: literal
    exact: m2mConfig/sec/
- id: runtime-kdf-info-label
  crit: notable
  desc: node-edge runtime KDF info label
  for:
  - javascript
  if:
    type: literal
    exact: node-edge-info
- id: endpoint-api-export
  crit: notable
  desc: node-edge endpoint API export
  for:
  - javascript
  if:
    type: symbol
    exact: edge.createServer
composite_rules:
- id: edge-network-runtime-library
  desc: node-edge network runtime library
  crit: notable
  conf: 0.99
  for:
  - javascript
  all:
  - id: runtime-header
  - id: runtime-config-paths
  - id: runtime-kdf-info-label
  - id: endpoint-api-export
