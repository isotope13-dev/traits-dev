# Eclipse Paho Go MQTT client library.
defaults:
  platforms: [unix, windows]
  for: [go, zip, tar, crate, gz]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: module-path-marker
    desc: eclipse paho.golang module path marker
    if:
      type: text
      substr: github.com/eclipse/paho.golang

  - id: paho-package-comment
    desc: Paho Go client package comment
    for: [go]
    if:
      type: text
      substr: Package paho is an MQTT v5 client
