# hrr_rb_ssh is a pure-Ruby SSH 2.0 implementation (client and server),
# vendored here as a framework dependency. Like net-ssh, it resolves key
# paths because that is what an SSH implementation does -- demo client code
# naming `/home/user1/.ssh/id_rsa` is the library showing its own usage,
# not credential theft.
defaults:
  crit: notable
  for: [ruby]
  platforms: [windows, unix]

traits:
  - id: hrr-module-namespace
    desc: HrrRbSsh module namespace reference
    conf: 0.96
    if:
      type: text
      word: "HrrRbSsh"

  - id: hrr-gem-require
    desc: hrr_rb_ssh library require
    conf: 0.95
    if:
      type: text
      substr: require 'hrr_rb_ssh'

composite_rules:
  - id: hrr-ssh-library
    desc: hrr_rb_ssh SSH library context
    conf: 0.98
    all:
      - id: hrr-module-namespace
      - id: hrr-gem-require
