defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: slack-sdk-package-member-path
    desc: Slack JavaScript SDK package member path
    crit: notable
    if:
      type: path
      regex: '@slack[\\/](web-api|types|logger|oauth)'
