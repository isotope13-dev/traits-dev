# finagle-clojure — Twitter Finagle / Util wrapper for Clojure.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure]
  crit: notable
  conf: 0.98

traits:
  - id: finagle-clojure-pom-coords
    desc: finagle-clojure Maven groupId
    for: [jar, zip]
    if:
      type: value
      path: jar.pom.group_id
      exact: finagle-clojure

  - id: finagle-clojure-ns
    desc: finagle-clojure namespace declaration
    for: [clojure]
    if:
      type: text
      regex: '\(ns\s+finagle-clojure\.'

  - id: finagle-clojure-github
    desc: finagle-clojure GitHub repository URL
    if:
      type: text
      substr: github.com/twitter/finagle-clojure
