defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: npm-package-name
    desc: "@nats-io npm package name"
    if:
      type: value
      path: name
      regex: '^@nats-io/'

  - id: nats-js-repository
    desc: nats.js upstream repository identity
    if:
      type: value
      path: repository.url
      substr: github.com/nats-io/nats.js

  - id: deno-install-setup-script
    desc: Deno toolchain install setup script
    if:
      type: value
      path: scripts.setup
      regex: 'deno\.land/x/install/install\.sh[^\n|]{0,40}\|\s*sh'

composite_rules:
  - id: nats-io-package-context
    desc: Recognized @nats-io nats.js package context
    all:
      - id: npm-package-name
      - id: nats-js-repository

  - id: nats-io-deno-setup-pipe-gate
    desc: "@nats-io Deno dev-setup pipe-execute gate"
    all:
      - id: nats-io-package-context
      - id: deno-install-setup-script
