# eventsource-parser — WHATWG EventSource / SSE parser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: eventsource-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: eventsource-parser

  - id: vendored-path
    desc: vendored eventsource-parser path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/eventsource-parser/'

composite_rules:
  - id: eventsource-parser-library
    desc: eventsource-parser SSE library
    any:
      - id: package-name
      - id: vendored-path
