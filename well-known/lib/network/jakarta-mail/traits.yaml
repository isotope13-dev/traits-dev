# JavaMail / Jakarta Mail resolves its providers through a reflective service
# lookup: Session reads META-INF/javamail.providers, FactoryFinder walks the
# ServiceLoader and constructs the named class reflectively, and SocketFetcher
# does the same for socket factories. That is Class.forName plus a reflective
# constructor and method invoke, next to the ([Ljava/net/URL;)V signature the
# provider URLs are loaded through -- the remote-classloader-stage shape,
# implemented rather than used. Any application that can send mail ships it.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java]
  crit: notable
  conf: 0.98
  size_min: 200
  size_max: 100000000

traits:
  - id: jakarta-mail-class
    desc: Jakarta or JavaMail API class
    if:
      type: text
      regex: '(jakarta|javax)/mail/(Session|internet/|util/|Provider)'
  - id: sun-mail-impl-class
    desc: Sun JavaMail implementation class
    if:
      type: text
      substr: com/sun/mail/util/SocketFetcher
