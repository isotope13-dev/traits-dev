# is-network-error — classify fetch/network failures (used by langsmith retries).
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: is-network-error-package-name
    desc: is-network-error package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: is-network-error

  - id: is-network-error-package-path
    desc: is-network-error package member path
    for: [javascript]
    conf: 0.96
    if:
      type: path
      regex: '(?i)is-network-error([/\\]|$)'
