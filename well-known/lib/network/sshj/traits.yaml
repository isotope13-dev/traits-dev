# sshj (net.schmizz.sshj / com.hierynomus.sshj) is the SSH client library a
# large part of the JVM ecosystem uses -- Jenkins SSH plugins, Gradle
# tooling, and JetBrains IDEs all ship it. Being an SSH client, it
# necessarily names id_rsa/id_ed25519 and known_hosts: its key-provider and
# known-hosts classes carry the default key-file list the same way JSch's
# KnownHosts class does. Classes that merely call it carry the same markers,
# because the JVM constant pool stores the internal class name of every type
# a class references, so one text marker covers the library and its callers
# alike. Newer releases moved from net.schmizz to com.hierynomus; both
# package prefixes are matched.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java, kotlin]
  crit: notable
  conf: 0.98
  size_min: 200
  size_max: 100000000

traits:
  - id: sshj-api-reference
    desc: References the sshj SSH client API
    for: [class, java, kotlin]
    if:
      type: text
      substr: net/schmizz/sshj
  - id: sshj-hierynomus-api-reference
    desc: References the relocated sshj SSH client API
    for: [class, java, kotlin]
    if:
      type: text
      substr: com/hierynomus/sshj
