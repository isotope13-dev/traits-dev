# autobahn-python — WebSocket client & server library, WAMP real-time framework by Crossbar.io.
defaults:
  platforms: [linux, macos, windows]
  for: [python, pyc, pkg_info]
  crit: notable
  conf: 0.98

traits:
  - id: autobahn-package-name
    desc: autobahn package name in metadata
    for: [pkg_info]
    if:
      type: value
      path: name
      exact: autobahn

  - id: autobahn-package-path
    desc: autobahn package path
    for: [python, pyc]
    if:
      type: path
      regex: '(?i)(^|[\\/])autobahn([\\/]|$)'

  - id: autobahn-import
    desc: Imports autobahn library
    for: [python]
    if:
      type: symbol
      kind: import
      regex: '^autobahn(\.|$)'

composite_rules:
  - id: autobahn-library
    desc: Autobahn WebSocket and WAMP library
    crit: notable
    conf: 0.98
    any:
      - id: autobahn-package-name
      - id: autobahn-package-path
      - id: autobahn-import
