# wireguard-go rwcancel: poll-cancel helper. Non-Unix platforms get an empty stub.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.96

traits:
  - id: rwcancel-package-clause
    desc: Go rwcancel package clause
    if:
      type: text
      exact: package rwcancel

  - id: rwcancel-empty-struct
    desc: Empty RWCancel platform stub struct
    if:
      type: text
      exact: 'type RWCancel struct{}'

  - id: rwcancel-stub-build-tag
    desc: Non-Unix rwcancel stub build tag
    if:
      type: text
      substr: '//go:build windows || wasm || plan9 || tamago'

  - id: rwcancel-stub-cancel-method
    desc: Empty RWCancel Cancel method stub
    if:
      type: text
      exact: 'func (*RWCancel) Cancel() {}'

composite_rules:
  - id: wireguard-rwcancel-platform-stub
    desc: WireGuard rwcancel non-Unix stub
    conf: 0.98
    all:
      - id: rwcancel-package-clause
      - id: rwcancel-empty-struct
    any:
      - id: rwcancel-stub-build-tag
      - id: rwcancel-stub-cancel-method
