# WireGuard wg-quick profile handling.
#
# The [Interface]/[Peer] directive keyword set is fixed by wg-quick(8) and is
# reproduced verbatim by every implementation, port and fork, so a cluster of
# those keywords identifies code that parses or emits a WireGuard profile.
# Identity only: a VPN client legitimately parses its own profile. Objective
# composites supply the intent (a profile directive that decrypts and runs a
# command, key material reused to seal a payload, and so on).
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts]
  crit: component
  conf: 0.85

traits:
  - id: windows-module-import
    desc: Imports WireGuard for Windows module
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [go]
    if:
      type: import
      regex: '^golang\.zx2c4\.com/wireguard/windows(/|$)'

  - id: wgquick-privatekey-directive
    desc: wg-quick PrivateKey directive keyword
    if:
      type: literal
      exact: privatekey
      case_insensitive: true
  - id: wgquick-presharedkey-directive
    desc: wg-quick PresharedKey directive keyword
    if:
      type: literal
      exact: presharedkey
      case_insensitive: true
  - id: wgquick-allowedips-directive
    desc: wg-quick AllowedIPs directive keyword
    if:
      type: literal
      exact: allowedips
      case_insensitive: true
  - id: wgquick-persistentkeepalive-directive
    desc: wg-quick PersistentKeepalive directive keyword
    if:
      type: literal
      exact: persistentkeepalive
      case_insensitive: true
  - id: wgquick-listenport-directive
    desc: wg-quick ListenPort directive keyword
    if:
      type: literal
      exact: listenport
      case_insensitive: true
  # PreUp/PostUp/PreDown/PostDown are one signal — the wg-quick script hooks —
  # so they stay a single atom rather than four independent ones.
  - id: wgquick-script-hook-directive
    desc: wg-quick PreUp/PostUp script-hook keyword
    if:
      type: literal
      regex: '^(pre|post)(up|down)$'
      case_insensitive: true

  - id: wgquick-script-hook-runner
    desc: WireGuard script-hook command runner
    crit: notable
    conf: 0.9
    for: [go, c, cpp, rust, csharp]
    if:
      type: symbol
      exact: runScriptCommand

  # Nonstandard directive used by trojanized WireGuard forks (UAC-0145 SopraVPN)
  # to carry an AES-sealed command blob inside the profile. Not a wg-quick keyword.
  - id: wgquick-symmetrickey-directive
    desc: Nonstandard SymmetricKey wg profile directive
    crit: suspicious
    conf: 0.96
    for: [source, scripts, text]
    if:
      type: text
      regex: '(?im)^\s*SymmetricKey\s*='

composite_rules:
  # PrivateKey/PublicKey alone are generic crypto field names; the wg-quick
  # keywords that have no meaning outside a WireGuard profile carry the
  # identification, so two of them are required alongside it.
  - id: wgquick-config-parser
    desc: Parses wg-quick WireGuard profile directives
    crit: notable
    conf: 0.92
    all:
      - id: wgquick-privatekey-directive
    any:
      - id: wgquick-presharedkey-directive
      - id: wgquick-allowedips-directive
      - id: wgquick-persistentkeepalive-directive
      - id: wgquick-listenport-directive
      - id: wgquick-script-hook-directive
    needs: 2
