# undici-types — TypeScript types for undici.
defaults:
  platforms: [unix, windows]
  for: [typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: undici-types npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: undici-types

  - id: vendored-path
    desc: vendored undici-types package path
    for: [scripts, manifests, data, source, typescript]
    if:
      type: path
      regex: 'node_modules/undici-types/'
