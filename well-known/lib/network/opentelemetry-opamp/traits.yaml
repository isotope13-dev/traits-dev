# opentelemetry-opamp-client — OpenTelemetry OpAMP agent management client.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 52428800

traits:
  - id: opamp-python-module-path
    desc: OpenTelemetry OpAMP Python package path
    if:
      type: path
      regex: 'opentelemetry/_opamp/'

  - id: opamp-protobuf-stub-basename
    desc: OpAMP protobuf generated stub basename
    if:
      type: basename
      regex: '^opamp_pb2(\.pyi?)?$'

composite_rules:
  - id: opentelemetry-opamp-client-library
    desc: OpenTelemetry OpAMP client Python library
    crit: exception
    conf: 0.97
    any:
      - id: opamp-python-module-path
      - id: opamp-protobuf-stub-basename
