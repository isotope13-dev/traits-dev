# gRPC Java stubs and runtime (io.grpc) — Apache-2.0 RPC framework.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: grpc-java-this-class
    desc: gRPC Java class this_class package
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.this_class
      regex: '^io/grpc/'

  - id: grpc-java-package-path
    desc: gRPC Java package path fragment
    conf: 0.96
    if:
      type: path
      regex: '(?i)io/grpc'

  - id: grpc-java-class-string
    desc: gRPC Java package string in class pool
    conf: 0.95
    if:
      type: text
      substr: io/grpc/
