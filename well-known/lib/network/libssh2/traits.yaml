# A libssh2 runtime implements the SSH remote-forward protocol fields that
# reverse-tunnel clients use. Structured PE metadata distinguishes the shared
# library itself without suppressing applications that merely depend on it.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]
  size_max: 52428800

traits:
  - id: windows-product
    desc: Windows libssh2 product identity
    if:
      type: value
      path: pe.version.product_name
      exact: The libssh2 library

  - id: windows-internal-name
    desc: Windows libssh2 internal name
    if:
      type: value
      path: pe.version.internal_name
      exact: libssh2

composite_rules:
  - id: windows-runtime-library
    desc: Windows libssh2 runtime library identity
    all:
      - id: windows-product
      - id: windows-internal-name
