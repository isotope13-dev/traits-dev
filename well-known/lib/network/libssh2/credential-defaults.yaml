# Network and VCS libraries ship the user's SSH key and known_hosts paths as
# their own client defaults (libcurl/libssh2, FFmpeg's libssh, libgit2,
# MediaInfo's sftp reader, Chromium). Each identifies the library that
# carries the paths, not a collector that targets them.
composite_rules:
  - id: credential-default-library-context
    desc: Library ships default SSH credential paths
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    any:
      - id: well-known/lib/network/curl::libcurl-version
      - id: well-known/lib/media/ffmpeg::ffmpeg-program-debug-name
      - id: well-known/lib/development/libgit2::libgit2-windows-library
      - id: well-known/lib/media/mediainfo::mediainfo-library
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-marker-cluster
