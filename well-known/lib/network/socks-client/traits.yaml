# JoshGlazebrook socks — SOCKSv4/v5 proxy client for Node.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: socks npm SOCKS client package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: socks

  - id: vendored-path
    desc: vendored socks package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/socks/'
