defaults:
  platforms: [windows, unix]
traits:
  - id: python-socketio-wheel-distribution
    desc: python-socketio PyPI wheel distribution
    crit: notable
    conf: 0.99
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: python_socketio

  - id: socketio-package-init-member
    desc: socketio package __init__ in wheel
    crit: notable
    conf: 0.99
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      exact: socketio/__init__.py

  - id: client
    desc: Socket.IO client library
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: text
      regex: 'Socket\.IO\s+v\d+\.\d+\.\d+'
  - id: python-client-import
    desc: Imports the Python Socket.IO client
    crit: notable
    conf: 0.95
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    for: [python]
    if:
      type: import
      exact: socketio

composite_rules:
  - id: python-socketio-wheel-context
    desc: Official python-socketio library wheel
    crit: exception
    conf: 0.99
    for: [whl]
    scope: outer
    all:
      - id: python-socketio-wheel-distribution
      - id: socketio-package-init-member
