# chimurai/http-proxy-middleware — Node.js HTTP proxy middleware.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: http-proxy-middleware npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: http-proxy-middleware

  - id: vendored-path
    desc: Vendored http-proxy-middleware package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/http-proxy-middleware/'
