---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - binaries
composite_rules:
- id: scramjet-libcurl-js-clues
  desc: Scramjet and libcurl.js references
  crit: notable
  conf: 0.95
  for: &1
  - javascript
  - typescript
  all:
  - &2
    id: well-known/lib/network/proxy/scramjet::scramjet-browser-proxy
  - id: well-known/lib/network/curl::libcurl-js-runtime
- id: scramjet-websocket-proxy-clues
  desc: Scramjet and WebSocket proxy references
  crit: notable
  conf: 0.95
  for: *1
  all:
  - *2
  - id: micro-behaviors/communications/proxy/config::websocket-proxy-runtime
