---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - binaries
traits:
- id: scramjet-client-token
  desc: References ScramjetClient proxy runtime
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    word: ScramjetClient
- id: scramjet-client-name-token
  desc: References Scramjet client-name runtime
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    word: SCRAMJETCLIENTNAME
- id: scramjet-fetch-handler-token
  desc: References Scramjet proxy fetch handler
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    word: ScramjetFetchHandler
composite_rules:
- id: scramjet-browser-proxy
  desc: Scramjet proxy runtime clues
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  any:
  - id: well-known/lib/network/proxy/scramjet::scramjet-client-token
  - id: well-known/lib/network/proxy/scramjet::scramjet-client-name-token
  - id: well-known/lib/network/proxy/scramjet::scramjet-fetch-handler-token
