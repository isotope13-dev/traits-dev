---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - binaries
traits:
- id: ultraviolet-config-global
  desc: References the Ultraviolet proxy config
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: __uv$config
- id: ultraviolet-service-worker-class
  desc: References the Ultraviolet worker class
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    word: UVServiceWorker
- id: ultraviolet-codec-namespace
  desc: References the Ultraviolet URL codec
  crit: notable
  conf: 0.97
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: Ultraviolet.codec
composite_rules:
- id: ultraviolet-browser-proxy
  desc: Ultraviolet proxy runtime clues
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  any:
  - id: well-known/lib/network/proxy/ultraviolet::ultraviolet-config-global
  - id: well-known/lib/network/proxy/ultraviolet::ultraviolet-service-worker-class
  - id: well-known/lib/network/proxy/ultraviolet::ultraviolet-codec-namespace
