# socket.io client stack — engine.io, parsers, and component-emitter.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: engine-io-client-package-name
    desc: engine.io-client npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: engine.io-client

  - id: socket-io-client-package-name
    desc: socket.io-client npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: socket.io-client

  - id: engine-io-parser-package-name
    desc: engine.io-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: engine.io-parser

  - id: socket-io-parser-package-name
    desc: socket.io-parser npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: socket.io-parser

  - id: component-emitter-package-name
    desc: '@socket.io/component-emitter package name'
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@socket.io/component-emitter'

  - id: engine-io-client-debug-ns
    desc: engine.io-client socket debug namespace
    for: [javascript, typescript]
    if:
      type: text
      substr: '"engine.io-client:socket"'

  - id: parseuri-ipv6-flag
    desc: engine.io-client parseuri IPv6 URI flag
    if:
      type: text
      substr: 'uri.ipv6uri = true'

  - id: parseqs-pair-decode
    desc: engine.io-client parseqs pair decoder
    if:
      type: text
      substr: 'qry[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1])'

  - id: xhr-ssl-transport
    desc: engine.io-client xmlhttprequest-ssl import
    if:
      type: text
      substr: 'from "xmlhttprequest-ssl"'

  - id: fetch-polling-transport
    desc: engine.io-client Fetch polling transport
    if:
      type: text
      substr: 'export class Fetch extends Polling'

  - id: try-all-transports-option
    desc: engine.io-client tryAllTransports option
    if:
      type: text
      substr: tryAllTransports

  - id: browser-socket-factory
    desc: engine.io-client browser Socket factory
    if:
      type: text
      substr: 'export default (uri, opts) => new Socket(uri, opts);'

  - id: relative-socket-import
    desc: engine.io-client relative Socket import
    if:
      type: text
      substr: 'import { Socket } from "./socket.js"'

  - id: xhr-extends-basexhr
    desc: engine.io-client XHR extends BaseXHR
    if:
      type: text
      regex: 'export (declare )?class XHR extends BaseXHR'

  - id: socket-io-client-debug-ns
    desc: socket.io-client manager debug namespace
    for: [javascript, typescript]
    if:
      type: text
      substr: '"socket.io-client:manager"'

  - id: engine-io-client-path
    desc: vendored engine.io-client package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/engine.io-client/'

  - id: socket-io-client-path
    desc: vendored socket.io-client package path
    if:
      type: path
      regex: 'node_modules/socket.io-client'

  - id: engine-io-parser-path
    desc: vendored engine.io-parser package path
    if:
      type: path
      regex: 'node_modules/engine.io-parser'

  - id: socket-io-parser-path
    desc: vendored socket.io-parser package path
    if:
      type: path
      regex: 'node_modules/socket.io-parser'

  - id: component-emitter-path
    desc: vendored socket.io component-emitter path
    if:
      type: path
      regex: 'node_modules/@socket.io/component-emitter'

  - id: engine-io-package-name
    desc: engine.io npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: engine.io

  - id: engine-io-path
    desc: vendored engine.io server package path
    if:
      type: path
      regex: 'node_modules/engine.io/'

  - id: socket-io-adapter-package-name
    desc: socket.io-adapter npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: socket.io-adapter

  - id: socket-io-adapter-path
    desc: vendored socket.io-adapter package path
    if:
      type: path
      regex: 'node_modules/socket.io-adapter'

composite_rules:
  - id: engine-io-client-library
    desc: engine.io-client realtime transport
    needs: 2
    any:
      - id: engine-io-client-path
      - id: engine-io-client-package-name
      - id: engine-io-client-debug-ns
      - id: parseuri-ipv6-flag
      - id: parseqs-pair-decode
      - id: xhr-ssl-transport
      - id: fetch-polling-transport
      - id: try-all-transports-option
      - id: browser-socket-factory
      - id: xhr-extends-basexhr
      - id: relative-socket-import

  - id: socket-io-client-library
    desc: socket.io-client realtime client
    any:
      - id: socket-io-client-package-name
      - id: socket-io-client-debug-ns
      - id: socket-io-client-path

  - id: engine-io-parser-library
    desc: engine.io-parser packet codec
    any:
      - id: engine-io-parser-package-name
      - id: engine-io-parser-path

  - id: socket-io-parser-library
    desc: socket.io-parser protocol codec
    any:
      - id: socket-io-parser-package-name
      - id: socket-io-parser-path

  - id: socket-io-component-emitter-library
    desc: socket.io component-emitter library
    any:
      - id: component-emitter-package-name
      - id: component-emitter-path

  - id: engine-io-library
    desc: engine.io realtime server
    any:
      - id: engine-io-package-name
      - id: engine-io-path

  - id: socket-io-adapter-library
    desc: socket.io-adapter room adapter
    any:
      - id: socket-io-adapter-package-name
      - id: socket-io-adapter-path
