# OkReplay — Airbnb OkHttp record/replay library (Betamax/VCR-style).
# Intercepts HTTP for Android/Java tests; local proxy + tape I/O are expected.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, shell, markdown, text, archives, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-path
    desc: okreplay source package path
    for: [java, kotlin, groovy, archives, tar]
    if:
      type: path
      regex: '(?i)(^|/)okreplay[-/]'

  - id: github-repo
    desc: airbnb/okreplay GitHub repository
    for: [markdown, text, shell]
    if:
      type: text
      substr: airbnb/okreplay

  - id: interceptor-class
    desc: OkReplayInterceptor class name
    for: [java, kotlin]
    if:
      type: text
      substr: OkReplayInterceptor

  - id: tape-mode-enum
    desc: OkReplay TapeMode enumeration
    for: [java, kotlin]
    if:
      type: text
      substr: TapeMode

composite_rules:
  - id: okreplay-http-recorder
    desc: Airbnb OkReplay OkHttp record/replay library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: package-path
      - id: github-repo
      - id: interceptor-class
      - id: tape-mode-enum
    needs: 2
