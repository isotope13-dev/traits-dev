# Neutral observations and discriminating identities.
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.98
  size_min: 32768
  size_max: 2097152
traits:
- id: sdk-driver-version-description
  desc: Version resource names NetFilter SDK WFP driver
  if:
    type: value
    path: pe.version.description
    exact: NetFilter SDK WFP Driver (WPP)
- id: sdk-driver-copyright
  desc: Version copyright names NetFilterSDK.com
  if:
    type: value
    path: pe.version.copyright
    substr: NetFilterSDK.com
composite_rules:
- id: wfp-sdk-driver
  desc: NetFilter SDK Windows Filtering Platform driver
  all:
  - id: sdk-driver-version-description
  - id: sdk-driver-copyright
  - id: micro-behaviors/os/firewall/wfp::fwpm-filter-add
