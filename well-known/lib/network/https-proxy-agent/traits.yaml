# https-proxy-agent — HTTPS requests through an HTTP proxy.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: https-proxy-agent npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: https-proxy-agent
  - id: vendored-path
    desc: vendored https-proxy-agent package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/https-proxy-agent/'

composite_rules:
  - id: https-proxy-agent-library
    desc: https-proxy-agent HTTP proxy helper
    any:
      - id: package-name
      - id: vendored-path
