# Impacket is a dual-use Python library for low-level network protocol
# construction and parsing (SMB, DCE/RPC, LDAP, Kerberos, 802.11). It is a
# staple of both legitimate security testing and intrusion tooling, so
# importing it identifies the dependency but does not by itself imply
# malicious use; the objective composites under objectives/lateral-movement/
# and objectives/credential-access/ supply the intent when tool invocations
# or dump targets are also present.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  crit: notable
  conf: 0.97

traits:
  - id: impacket-python-library
    desc: Imports impacket network protocol library
    if:
      type: import
      regex: '^impacket(\.|$)'
