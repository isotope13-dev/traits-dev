# Impacket is a dual-use Python library for low-level network protocol
# construction and parsing (SMB, DCE/RPC, LDAP, Kerberos, 802.11). It is a
# staple of both legitimate security testing and intrusion tooling, so
# importing it identifies the dependency but does not by itself imply
# malicious use; the objective composites under objectives/lateral-movement/
# and objectives/credential-access/ supply the intent when tool invocations
# or dump targets are also present.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  crit: notable
  conf: 0.97

traits:
  - id: impacket-python-library
    desc: Imports impacket network protocol library
    if:
      type: import
      regex: '^impacket(\.|$)'
  # Every impacket source file (including examples/ tools such as
  # secretsdump.py, smbrelayx.py, ntlmrelayx) opens with this banner, first
  # under the original SecureAuth Corporation copyright, later restated under
  # Fortra following the 2020 acquisition. Hard to forge or strip
  # incidentally, so it's a reliable signal that a file is upstream impacket
  # source rather than a repackaged or attacker-modified copy -- used by the
  # lateral-movement/credential-access composites below to keep officially
  # published dual-use tool identity at suspicious rather than hostile,
  # mirroring how well-known/tool/offensive/metasploit treats its own
  # openly-distributed payload identity.
  - id: impacket-copyright-banner
    desc: Impacket project copyright banner
    if:
      type: text
      regex: 'Copyright\s+(\d{4}\s+SecureAuth Corporation|Fortra,?\s*LLC)'
