# ureq — the Rust HTTP client crate. A statically linked Rust binary keeps the
# crate's own source paths in its panic metadata, so each path below names the
# crate and its version outright. Library provenance, not an indicator:
# family composites pair these with a malicious anchor.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  size_min: 512
  size_max: 500000000
  crit: notable
  conf: 0.8
traits:
  - id: ureq-body-rs
    desc: ureq-2.12.1/src/body.rs source path
    if:
      type: text
      substr: ureq-2.12.1/src/body.rs
      section: .text
  - id: ureq-chunked-decoder-rs
    desc: ureq-2.12.1/src/chunked/decoder.rs source path
    if:
      type: text
      substr: ureq-2.12.1/src/chunked/decoder.rs
      section: .text
  - id: ureq-pool-rs
    desc: ureq-2.12.1/src/pool.rs source path
    if:
      type: text
      substr: ureq-2.12.1/src/pool.rs
      section: .text
