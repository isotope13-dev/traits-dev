# rsync — npm wrapper for the rsync file-sync command.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: rsync-package-name
    desc: rsync npm package name
    if:
      type: value
      path: name
      exact: rsync

  - id: rsync-dependency
    desc: Declares rsync npm dependency
    if:
      type: value
      path: dependencies.rsync
      exists: true

  - id: rsync-dev-dependency
    desc: Declares rsync dev dependency
    if:
      type: value
      path: devDependencies.rsync
      exists: true

composite_rules:
  - id: rsync-npm-package-context
    desc: rsync npm package or consumer context
    crit: notable
    conf: 0.99
    any:
      - id: rsync-package-name
      - id: rsync-dependency
      - id: rsync-dev-dependency
