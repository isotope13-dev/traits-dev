# WpOrg\Requests (rmccue/requests) -- the PHP HTTP library WordPress core
# bundles and thousands of plugins vendor, often under a scoped namespace
# prefix (AmeliaVendor\WpOrg\Requests, razorpay's Requests-2.0.4 copy, ...).
#
# Its cURL transport IMPLEMENTS the documented `verify` option: it calls
# curl_setopt(CURLOPT_SSL_VERIFYPEER, 0) only inside `if ($options['verify']
# === false)`. Offering the caller that switch is what an HTTP client does;
# the library is not itself disabling certificate validation. Referenced as
# benign context so a vendored HTTP client is not read as a TLS bypass.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.95
traits:
  - id: requests-transport-namespace
    desc: WpOrg Requests transport namespace
    if:
      type: text
      regex: 'namespace\s+[\w\\]*WpOrg\\Requests\b'
  - id: requests-transport-package-tag
    desc: Requests transport package doc tag
    conf: 0.9
    if:
      type: text
      substr: '@package Requests\Transport'
composite_rules:
  - id: php-requests-library
    desc: WpOrg Requests PHP HTTP library
    crit: notable
    conf: 0.97
    any:
      - id: requests-transport-namespace
      - id: requests-transport-package-tag
