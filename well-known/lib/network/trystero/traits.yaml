# Trystero — WebRTC P2P room library. Default MQTT/Nostr relays include
# public HiveMQ Cloud brokers for peer signaling, not RAT tasking.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: trystero-source-marker
    desc: Trystero P2P library product marker
    for: [javascript, typescript]
    if:
      type: text
      word: Trystero

  - id: trystero-package-name
    desc: Trystero npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: trystero

composite_rules:
  - id: trystero-library-context
    desc: Recognized Trystero P2P library
    crit: notable
    conf: 0.99
    any:
      - id: trystero-source-marker
      - id: trystero-package-name
