# jsonrpsee documents optional rustls certificate verification bypass in
# `no_run` doc examples for CustomCertStore — not a runtime TLS implant.
defaults:
  platforms: [unix, windows]
  for: [gz, crate, rust]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: jsonrpsee-crate-package-path
    desc: jsonrpsee Rust crate package path
    if:
      type: path
      regex: '(?i)(^|[/\\:])jsonrpsee(-[a-z0-9-]+)?(@|-)[0-9]'
