defaults:
  platforms: [windows, unix, ios]
  for: [pe, elf, macho]
  size_min: 4096
  size_max: 50000000

traits:
  - id: package-name
    desc: bare-url npm package name
    crit: notable
    conf: 0.99
    for: [package.json]
    size_min: 64
    if:
      type: value
      path: name
      exact: bare-url

  - id: vendored-path
    desc: Vendored bare-url package path
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    size_min: 64
    if:
      type: path
      regex: 'node_modules[\\/]bare-url[\\/]'

  - id: addon-basename
    desc: bare-url native addon filename
    crit: notable
    if:
      type: basename
      exact: bare-url.bare
      case_insensitive: true

  - id: macho-install-name
    desc: bare-url Mach-O install name
    crit: notable
    for: [macho]
    if:
      type: value
      path: macho.install_name
      regex: '^bare-url@[0-9]+\.bare$'

composite_rules:
  - id: library
    desc: Holepunch bare-url WHATWG URL library
    crit: notable
    conf: 0.98
    size_min: 64
    for: [javascript, typescript, package.json, pe, elf, macho]
    any:
      - id: package-name
      - id: vendored-path
      - id: native-addon

  - id: native-addon
    desc: Holepunch bare-url WHATWG URL parser addon
    crit: notable
    conf: 0.98
    all:
      - id: addon-basename
    any:
      - id: metadata/binary/symbols/runtime::bare-runtime-addon-export
      - id: macho-install-name
