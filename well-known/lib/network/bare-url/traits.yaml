defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, so]
  size_min: 4096
  size_max: 50000000

traits:
  - id: addon-basename
    desc: bare-url native addon filename
    crit: baseline
    if:
      type: basename
      exact: bare-url.bare
      case_insensitive: true

  - id: parser-symbol
    desc: bare-url native URL parser symbol
    crit: baseline
    if:
      type: symbol
      regex: '^bare_url_(parse|can_parse)$'

  - id: module-soname
    desc: Versioned bare-url native module name
    crit: baseline
    if:
      type: text
      section: rdata
      regex: 'bare-url@[0-9]+\.bare'

composite_rules:
  - id: native-addon
    desc: Holepunch bare-url WHATWG URL parser addon
    crit: notable
    conf: 0.98
    all:
      - id: addon-basename
    any:
      - id: parser-symbol
      - id: module-soname
