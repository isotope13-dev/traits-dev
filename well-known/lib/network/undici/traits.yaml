# nodejs/undici — Node.js HTTP/1.1 client.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: undici npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: undici

  - id: homepage
    desc: undici project homepage
    for: [package.json]
    if:
      type: value
      path: homepage
      exact: https://undici.nodejs.org

composite_rules:
  - id: undici-http-client
    desc: undici Node.js HTTP client
    all:
      - id: package-name
      - id: homepage
