# discord.js package identity. These traits identify the legitimate library's
# publication metadata; supply-chain rules add foreign-name context before
# inferring impersonation.
defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
  crit: notable
  conf: 0.98

traits:
  - id: npm-package-name
    desc: discord.js npm package name
    if:
      type: text
      regex: '"name"\s*:\s*"discord\.js"'

  - id: npm-package-description
    desc: discord.js npm package description
    if:
      type: text
      substr: A powerful library for interacting with the Discord API

  - id: npm-package-repository
    desc: discord.js official repository claim
    if:
      type: text
      substr: github.com/discordjs/discord.js

  - id: npm-package-homepage
    desc: discord.js official homepage claim
    if:
      type: text
      substr: https://discord.js.org
