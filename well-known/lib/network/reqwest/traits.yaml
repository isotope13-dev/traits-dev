# reqwest exposes danger_accept_invalid_certs via an internal NoVerifier —
# documented optional TLS behavior for an HTTP client library, not a bypass implant.
defaults:
  platforms: [unix, windows]
  for: [gz, crate, rust]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 600000000

traits:
  - id: reqwest-crate-package-path
    desc: reqwest Rust crate package path
    if:
      type: path
      regex: '(?i)(^|[/\\:])reqwest(@|-)[0-9]'
