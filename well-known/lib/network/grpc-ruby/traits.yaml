# grpc Ruby gem — Windows-only C extension loader (rb_loader.c) under GPR_WINDOWS.
defaults:
  platforms: [windows, unix]
  for: [c]
  crit: notable
  conf: 0.99

traits:
  - id: grpc-ruby-native-loader-source
    desc: gRPC Ruby C extension native loader source
    if:
      type: text
      substr: grpc_rb_load_core
