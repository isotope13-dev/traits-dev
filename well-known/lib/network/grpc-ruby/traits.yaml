# grpc Ruby gem — official Ruby bindings (extconf.rb + grpc_c native extension).
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.99

traits:
  - id: grpc-ruby-native-loader-source
    desc: gRPC Ruby C extension native loader source
    for: [c]
    if:
      type: text
      substr: grpc_rb_load_core

  - id: grpc-ruby-module-require
    desc: gRPC Ruby gem requires grpc module
    for: [ruby]
    if:
      type: text
      substr: "require 'grpc'"

  - id: grpc-ruby-c-extension-artifact
    desc: gRPC Ruby grpc_c shared library member
    for: [elf]
    size_min: 50000
    size_max: 209715200
    if:
      type: path
      basename: true
      exact: grpc_c.so

composite_rules:
  - id: grpc-ruby-official-gem
    desc: Official gRPC Ruby gem distribution
    any:
      - id: grpc-ruby-native-loader-source
      - id: grpc-ruby-module-require
      - id: grpc-ruby-c-extension-artifact
