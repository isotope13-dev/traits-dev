# Trilead SSH-2 (com.trilead.ssh2 / ch.ethz.ssh2) is the Java SSH client
# library originally developed as Ganymed SSH-2 and maintained by the Jenkins
# project (org.jenkins-ci:trilead-ssh2). Being an SSH client, it implements
# SSH-2 protocol handling and key authentication. Classes that use it for SSH
# transport reference its packages in the constant pool.
defaults:
  platforms: [unix, windows]
  for: [class, jar, java, kotlin]
  crit: notable
  conf: 0.98
  size_min: 200
  size_max: 100000000

traits:
  - id: trilead-ssh2-api-reference
    desc: References the Trilead SSH-2 client API
    for: [class, java, kotlin]
    if:
      type: text
      substr: com/trilead/ssh2
  - id: ganymed-ssh2-api-reference
    desc: References the Ganymed SSH-2 client API
    for: [class, java, kotlin]
    if:
      type: text
      substr: ch/ethz/ssh2
