# @grpc/proto-loader — load .proto files for gRPC-js via protobufjs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: gRPC proto-loader package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@grpc/proto-loader'

  - id: vendored-path
    desc: vendored gRPC proto-loader path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: '@grpc/proto-loader/'
