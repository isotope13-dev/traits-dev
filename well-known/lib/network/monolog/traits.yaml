# Monolog — popular PHP logging library (Jordi Boggiano).
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 5000000

traits:
  - id: monolog-package-path
    desc: Monolog Composer package path segment
    if:
      type: path
      regex: '(?i)monolog/monolog/'

  - id: monolog-package-copyright
    desc: Monolog package copyright header
    if:
      type: text
      substr: This file is part of the Monolog package

  - id: monolog-handler-namespace
    desc: Monolog Handler namespace
    if:
      type: text
      regex: 'namespace\s+Monolog\\Handler\s*;'

composite_rules:
  - id: monolog-library-context
    desc: Monolog PHP logging library
    crit: notable
    conf: 0.99
    all:
      - id: monolog-handler-namespace
    any:
      - id: monolog-package-path
      - id: monolog-package-copyright
