# cacheable-request — Wrap Node request with RFC caching.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: cacheable-request npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cacheable-request

  - id: vendored-path
    desc: vendored cacheable-request package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cacheable-request/'


composite_rules:
  - id: cacheable-request-library
    desc: cacheable-request HTTP wrapper
    any:
      - id: package-name
      - id: vendored-path
