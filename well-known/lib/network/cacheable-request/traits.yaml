# cacheable-request — Wrap Node request with RFC caching.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: vendored-path
    desc: vendored cacheable-request package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cacheable-request/'
