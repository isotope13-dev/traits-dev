defaults:
  crit: notable
  for: [ruby]
  platforms: [windows, unix]

traits:
  - id: net-ssh-session-basename
    desc: Net::SSH session basename
    conf: 0.9
    if:
      type: value
      path: file.basename
      exact: session.rb
  - id: net-ssh-session-require
    desc: Net::SSH session require
    conf: 0.95
    if:
      type: text
      substr: require 'net/ssh/connection/channel'
  - id: net-ssh-start-doc
    desc: Net::SSH start documentation
    conf: 0.95
    if:
      type: text
      substr: Net::SSH.start
  # The library's own namespace. The three markers above only identify
  # `connection/session.rb`; net-ssh reads `~/.ssh/id_rsa` and friends from
  # `authentication/key_factory.rb`, which declares itself the same way every
  # other file in the gem does. An SSH client resolving key paths is the
  # library doing its job.
  - id: net-ssh-module-namespace
    desc: Net::SSH module namespace declaration
    conf: 0.96
    if:
      type: text
      regex: '\bmodule\s+SSH\b|\bNet::SSH::[A-Z]'

composite_rules:
  - id: net-ssh-session-library
    desc: Net::SSH session library
    conf: 0.98
    all:
      - id: net-ssh-session-basename
      - id: net-ssh-session-require
      - id: net-ssh-start-doc
