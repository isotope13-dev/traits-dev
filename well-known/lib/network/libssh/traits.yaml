# A libssh runtime implements the SSH remote-forward protocol fields that
# reverse-tunnel clients use. Basename plus the library's own SSH-2.0 banner
# distinguishes the shared library itself without suppressing applications
# that merely depend on it.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]
  size_max: 52428800

traits:
  - id: windows-runtime-basename
    desc: Windows libssh runtime DLL basename
    if:
      type: basename
      exact: libssh.dll

  - id: protocol-version-banner
    desc: libssh SSH-2.0 version banner
    if:
      type: text
      regex: 'SSH-2\.0-libssh_[0-9]'
      section: rdata

  - id: ssh-init-export
    desc: libssh ssh_init export symbol
    if:
      type: export
      exact: ssh_init

composite_rules:
  - id: windows-runtime-library
    desc: Windows libssh runtime library identity
    all:
      - id: windows-runtime-basename
      - id: protocol-version-banner
      - id: ssh-init-export
