defaults:
  crit: notable
  conf: 0.95
  platforms: [unix, windows]
  for: [text, c, cpp, html]

traits:
  # Doxygen tutorial pages shipped with libssh: inert documentation whose
  # @code examples show libssh API calls. The page marker names the
  # tutorial series, so renamed chapters and other libssh topics keep
  # matching; no code in such a page is compiled or executed by the page
  # itself.
  - id: doxygen-tutorial-page
    desc: libssh Doxygen tutorial page
    if:
      type: text
      regex: '@page\s+libssh_tutor_\w+'

  - id: doxygen-shell-channel-topic
    desc: libssh tutorial covers remote shell channel
    conf: 0.9
    if:
      type: text
      regex: 'ssh_channel_request_(pty|shell|x11)\s*\('

  - id: doxygen-threads-topic
    desc: libssh tutorial covers threading setup
    conf: 0.9
    if:
      type: text
      regex: 'ssh_threads_(set_callbacks|get_pthread|get_noop)\s*\('
