defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: component-vocabulary
    desc: parseUri URL component property name list
    if:
      type: text
      substr: '["source","protocol","authority","userInfo","user","password","host","port","relative","path","directory","file","query","anchor"]'

  - id: regex-parser
    desc: parseUri regex URL parser pattern
    if:
      type: text
      substr: '(?![^:@]+:[^:@\/]*@)([^:\/?#.]+):'

