# requests-cache — persistent HTTP response cache for Python requests.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, whl]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-package-name
    desc: requests-cache PyPI distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: requests-cache

  - id: module-docstring-title
    desc: requests_cache module docstring title
    for: [python]
    if:
      type: text
      substr: '    requests_cache'

  - id: install-cache-api
    desc: requests_cache install_cache API
    for: [python]
    if:
      type: text
      substr: requests_cache.install_cache

  - id: cached-session-class
    desc: requests_cache CachedSession class
    for: [python]
    if:
      type: text
      substr: CachedSession

  - id: upstream-repository
    desc: requests-cache upstream GitHub repository
    for: [python, pkginfo]
    if:
      type: text
      substr: github.com/reclosedev/requests-cache

composite_rules:
  - id: requests-cache-library
    desc: requests-cache HTTP persistence library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: pkginfo-package-name
      - id: install-cache-api
      - id: module-docstring-title
      - id: cached-session-class
      - id: upstream-repository
    needs: 2
