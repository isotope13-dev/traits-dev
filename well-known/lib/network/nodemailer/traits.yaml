# Nodemailer — the standard Node.js SMTP client library.
#
# These atoms were previously the single `nodemailer-package-reference` trait in
# well-known/tool/development/github-action-send-mail, described as "Nodemailer
# import in send-mail wrapper". The matcher only ever recognised the library's
# name, so it reported an SBOM inventory entry
# (`"name": "nodemailer", "version": "2.7.2"`) as an import inside a GitHub
# Action. Identity belongs here; the action wrapper composite references it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: nodemailer-import
    desc: Imports the Nodemailer SMTP library
    if:
      type: text
      regex: '(?i)\b(from|require)\b.{0,24}nodemailer'

  - id: nodemailer-package-name
    desc: Names nodemailer as a package dependency
    conf: 0.9
    if:
      type: text
      regex: '(?i)nodemailer.{0,24}:'
