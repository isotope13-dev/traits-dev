# Requests — Python Software Foundation HTTP client library.
defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: pkginfo-name
    desc: Requests Python package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: requests

  - id: module-banner
    desc: Requests HTTP library module banner
    for: [python]
    if:
      type: literal
      substr: Requests HTTP Library

  - id: upstream-repository
    desc: Requests upstream repository URL
    if:
      type: text
      substr: github.com/psf/requests

composite_rules:
  - id: requests-library
    desc: Requests Python HTTP client library
    scope: outer
    any:
      - id: pkginfo-name
      - id: module-banner
      - id: upstream-repository
    needs: 2
