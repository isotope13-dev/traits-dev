# Uppy file uploader packages published under the @uppy/ scope.
# Official packages in the Uppy project live in the transloadit/uppy
# monorepo. Individual @uppy/* packages therefore do not share the repository
# basename and their README files routinely use product headings and link sibling
# packages.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Uppy scoped package identity
    if:
      type: value
      path: name
      regex: '^@uppy/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-url
    desc: Uppy GitHub repository URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/transloadit/uppy(\.git)?(/.*)?$'

composite_rules:
  - id: official-scope-repository-pair
    desc: Official Uppy package repository pairing
    crit: exception
    all:
      - id: scoped-package-identity
      - id: github-repository-url
