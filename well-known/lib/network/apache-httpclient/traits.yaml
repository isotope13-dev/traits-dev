# Apache HttpClient includes an explicit TrustAllStrategy utility. Merely
# shipping the library is not evidence that an application selects it.
defaults:
  platforms: [windows, unix]
  for: [jar, zip]

traits:
  - id: apache-httpclient-manifest
    desc: Apache HttpClient library manifest
    crit: notable
    conf: 0.99
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: Apache HttpClient
