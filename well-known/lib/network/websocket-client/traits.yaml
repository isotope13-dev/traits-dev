# websocket-client -- the Python WebSocket client library, installed as the
# `websocket` package.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
traits:
  - id: websocket-client-source
    desc: websocket-client library source
    if:
      type: path
      regex: 'site-packages[\\/]websocket[\\/]'
