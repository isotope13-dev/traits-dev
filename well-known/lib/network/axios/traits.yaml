# axios — promise-based HTTP client for browser and Node.js.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json, markdown]
  crit: notable
  conf: 0.98

traits:
  - id: axios-package-name
    desc: axios package manifest name
    for: [package.json]
    if:
      type: value
      path: name
      exact: axios

  - id: axios-package-path
    desc: axios package member path
    for: [javascript, markdown]
    conf: 0.96
    if:
      type: path
      regex: '(?i)(^|[/\\])axios([/\\]|$)'
