defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: axios-class
    desc: Defines the AxiosError class
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((class_declaration name: (identifier) @name) @class
          (#eq? @name "AxiosError"))
  - id: axios-version
    desc: Axios version string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: \[Axios v[0-9]
