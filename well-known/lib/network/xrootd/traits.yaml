# XRootD (github.com/xrootd/xrootd) is the CERN/SLAC data-access protocol
# suite used across high-energy physics. Its XrdPosix library is an
# LD_PRELOAD POSIX redirector: it resolves the real libc entry points with
# dlsym(RTLD_NEXT) and converts dirent64 records so unmodified programs can
# open root:// URLs.
defaults:
  platforms: [linux, macos]
  for: [c, cpp]
  conf: 0.97

traits:
  - id: xrootd-suite-license-banner
    desc: XRootD software suite source license banner
    crit: notable
    if:
      type: text
      substr: This file is part of the XRootD software suite.
