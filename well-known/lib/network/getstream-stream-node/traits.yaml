# GetStream (@stream-io/node-sdk) official server SDK for Chat/Feeds/Video APIs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: baseline
  conf: 0.98

traits:
  - id: stream-io-node-sdk-package-name
    desc: Stream Node.js SDK npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@stream-io/node-sdk'
  - id: stream-node-git-repository
    desc: GetStream stream-node GitHub repository
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com[/:]GetStream/stream-node'
  - id: stream-node-npm-repository
    desc: GetStream stream-node npm registry repository
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com[/:]GetStream/stream-node'
  - id: stream-openapi-gen-api-path
    desc: Stream OpenAPI-generated API module path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      substr: 'src/gen/'
  - id: stream-openapi-models-index-path
    desc: Stream OpenAPI generated models index path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      substr: 'gen/models/index'
  - id: stream-chat-api-v2-route
    desc: Stream Chat API v2 REST route literal
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: '/api/v2/chat/'

composite_rules:
  - id: stream-node-sdk-official
    desc: Official GetStream Node.js server SDK
    crit: exception
    conf: 0.99
    any:
      - id: stream-io-node-sdk-package-name
      - id: stream-node-git-repository
      - id: stream-node-npm-repository
      - id: stream-openapi-gen-api-path
      - id: stream-openapi-models-index-path
      - id: stream-chat-api-v2-route
