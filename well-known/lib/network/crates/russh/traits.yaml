# russh — the pure-Rust SSH client and server crate. A statically linked Rust
# binary keeps the crate's source paths in its panic metadata, and the client
# sends a russh version banner. Both name the library, not a program that
# speaks SSH with it. The crate's error enum (AgentKernelInterrupted,
# ErrorKexInit, UnknownAlgo, NoCommonAlgo) also contains bare words that
# third-party implant signatures key on; the engine override clears those
# matches when either identity string is present.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  size_min: 512
  size_max: 500000000
  crit: notable
  conf: 0.9

traits:
  - id: russh-crate-source-path
    desc: russh crate source path in binary
    if:
      type: text
      regex: 'russh-0\.[0-9]{1,3}\.[0-9]{1,3}/src/[a-z_/]{1,40}\.rs'

  - id: russh-client-banner
    desc: russh SSH client version banner
    if:
      type: text
      regex: 'SSH-2\.0-russh_[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
