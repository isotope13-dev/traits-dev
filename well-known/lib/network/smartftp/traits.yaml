defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 8192
  size_max: 10000000

traits:
  - id: smartftp-product
    desc: SmartFTP FTP Library product name
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)SmartFTP FTP Library'
  - id: smartftp-company
    desc: SmartSoft Ltd publisher metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)SmartSoft Ltd'

composite_rules:
  - id: smartftp-library-context
    desc: SmartFTP FTP Library vendor context
    crit: exception
    all:
      - id: well-known/lib/network/smartftp::smartftp-product
      - id: well-known/lib/network/smartftp::smartftp-company
