# FTL2 is an Ansible-compatible Python automation framework. Its gate
# protocol deliberately receives module bytes, decodes them, and executes the
# requested module on a managed host; that is a benign remote-module loader,
# not source obfuscation.
defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: gate-protocol-import
    desc: FTL2 gate protocol import
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^\s*from\s+ftl2\.message\s+import\s+GateProtocol\b'

composite_rules:
  - id: remote-module-gate
    desc: FTL2 remote module gate context
    crit: exception
    conf: 0.98
    all:
      - id: gate-protocol-import
      - id: micro-behaviors/process/create/exec::python-asyncio-subprocess-call
