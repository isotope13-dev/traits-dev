# Code-forge subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-octokit-rest-client-import
  desc: Imports the Octokit REST client
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: import
    exact: "@octokit/rest"
- id: github-graphql-client-import
  desc: Imports the Octokit GraphQL client
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: import
    exact: "@octokit/graphql"
