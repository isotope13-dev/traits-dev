defaults:
  conf: 0.99
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - zip
  crit: notable
traits:
- id: xyo-provider-package
  desc: XYO XL1 S3 provider package identity
  if:
    type: value
    path: package.json::name
    exact: '@xyo-network/xl1-s3-providers'
- id: xyo-repository
  desc: XYO protocol repository metadata
  if:
    type: value
    path: package.json::repository.url
    regex: (?i)github\.com/XYOracleNetwork/xl1-protocol(\.git)?$
- id: xyo-peer-ariestools
  desc: XYO package peer SDK declaration
  if:
    type: value
    path: package.json::peerDependencies.@ariestools/sdk
    exists: true
- id: xyo-peer-sdk
  desc: XYO package peer protocol SDK declaration
  if:
    type: value
    path: package.json::peerDependencies.@xyo-network/sdk
    exists: true
- id: xyo-peer-mutex
  desc: XYO package peer mutex declaration
  if:
    type: value
    path: package.json::peerDependencies.async-mutex
    exists: true
