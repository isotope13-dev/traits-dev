defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - tar
  - elf
  - markdown
  - text
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 52428800
traits:
- id: smartwhois-package-name
  desc: push.rocks smartwhois npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@push.rocks/smartwhois'
- id: smartmta-package-name
  desc: push.rocks smartmta npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@push.rocks/smartmta'
- id: smartnetwork-package-name
  desc: push.rocks smartnetwork npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@push.rocks/smartnetwork'
- id: smartsitemap-package-name
  desc: push.rocks smartsitemap npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@push.rocks/smartsitemap'
- id: smartnftables-package-name
  desc: push.rocks smartnftables npm package name
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@push.rocks/smartnftables'
- id: smartnftables-rust-binary-path
  desc: smartnftables bundled Rust nftables ELF path
  for:
  - elf
  if:
    type: path
    regex: smartnftables_linux_(amd64|arm64)(_musl)?$
- id: smartnftables-namespace-entry-marker
  desc: smartnftables network namespace entry error text
  for:
  - elf
  if:
    type: text
    substr: Network namespace startup failed
    section: .rodata
- id: smartnftables-managed-policy-marker
  desc: smartnftables managed policy version marker
  for:
  - elf
  if:
    type: text
    substr: smartnftables/managed-policy-v2
    section: .rodata
- id: push-rocks-foss-repository
  desc: push.rocks code.foss.global repository URL
  for:
  - package.json
  if:
    type: value
    path: repository.url
    regex: code\.foss\.global/push\.rocks/(smartmta|smartwhois|smartnetwork|smartsitemap)
- id: push-rocks-npm-scoped-package-path
  desc: push.rocks scoped npm package path
  if:
    type: path
    regex: '@push\.rocks/smart(network|whois|mta|sitemap)'
- id: push-rocks-npm-tarball-prefix-path
  desc: push.rocks npm tarball filename prefix
  if:
    type: path
    regex: smart(network|whois|mta|sitemap)@
- id: smartmta-rust-mailer-binary-path
  desc: smartmta bundled Rust mailer ELF basename
  for:
  - elf
  if:
    type: path
    regex: mailer-bin_linux_(amd64|arm64)$
- id: smartnetwork-rustnetwork-binary-path
  desc: smartnetwork rustnetwork ELF path
  for:
  - elf
  if:
    type: path
    regex: rustnetwork_linux_(amd64|arm64)$
- id: smartnetwork-cloudflarespeed-basename
  desc: smartnetwork cloudflarespeed module
  for:
  - javascript
  - typescript
  if:
    type: basename
    regex: ^smartnetwork\.classes\.cloudflarespeed\.(js|ts)$
- id: smartnetwork-publicip-basename
  desc: smartnetwork public IP lookup module basename
  for:
  - javascript
  - typescript
  if:
    type: basename
    regex: ^smartnetwork\.classes\.publicip\.(js|ts)$
- id: smartnetwork-package-text-marker
  desc: smartnetwork package name in source or docs
  for:
  - javascript
  - typescript
  - markdown
  - text
  if:
    type: text
    substr: '@push.rocks/smartnetwork'
- id: smartwhois-rdap-client-basename
  desc: smartwhois RDAP client module basename
  for:
  - javascript
  - typescript
  if:
    type: basename
    regex: ^smartwhois\.classes\.rdapclient\.(js|ts)$
- id: smartwhois-rdap-client-import
  desc: smartwhois RDAP client module import
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: smartwhois.classes.rdapclient
- id: smartmta-unified-email-server-basename
  desc: smartmta unified email server module basename
  for:
  - javascript
  - typescript
  - markdown
  - text
  if:
    type: basename
    regex: ^classes\.unified\.email\.server\.(js|ts|md)$
- id: smartmta-dns-manager-basename
  desc: smartmta DNS manager module basename
  for:
  - javascript
  - typescript
  if:
    type: basename
    regex: ^classes\.dns\.manager\.(js|ts)$
- id: smartmta-content-scanner-basename
  desc: smartmta content scanner module basename
  for:
  - javascript
  - typescript
  if:
    type: basename
    regex: ^classes\.contentscanner\.(js|ts)$
- id: smartmta-rust-security-bridge-basename
  desc: smartmta Rust security bridge module basename
  for:
  - javascript
  - typescript
  if:
    type: basename
    regex: ^classes\.rustsecuritybridge(\.d)?\.(js|ts)$
- id: smartmta-package-text-marker
  desc: smartmta package name in source or docs
  for:
  - javascript
  - typescript
  - markdown
  - text
  if:
    type: text
    substr: '@push.rocks/smartmta'
composite_rules:
- id: push-rocks-smartnftables-library
  desc: push.rocks smartnftables nftables manager package
  crit: exception
  conf: 0.96
  all:
  - id: smartnftables-namespace-entry-marker
  any:
  - id: smartnftables-rust-binary-path
  - id: smartnftables-managed-policy-marker
  needs: 1
