# Helidon — Oracle's cloud-native Java microservices framework (WebServer).
defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]
  crit: notable
  conf: 0.98

traits:
  - id: helidon-webserver-manifest-title
    desc: Helidon WebServer JAR manifest title
    for: [jar, zip]
    if:
      type: value
      path: jar.manifest.implementation_title
      exact: Helidon WebServer

  - id: helidon-webserver-pom-coords
    desc: Helidon WebServer Maven coordinates
    for: [jar, zip]
    if:
      type: value
      path: jar.pom.group_id
      exact: io.helidon.webserver

  - id: helidon-webserver-this-class
    desc: Helidon WebServer class package
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^io/helidon/webserver/'
