# curl_cffi -- Python TLS-impersonation HTTP client. Its PyPI description
# advertises the browser fingerprints it ships plus third-party solver
# services -- vendor packaging words, not the bundling application's
# behavior. Any bundle embedding its dist-info inherits this context.
defaults:
  conf: 0.99
  platforms: [unix, windows]
traits:
- id: curl-cffi-pypi-package
  desc: curl_cffi PyPI package metadata
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: text
    regex: '(?im)^Name:\s*curl.cffi\s*$'
- id: curl-cffi-dist-info-path
  desc: curl_cffi dist-info member path
  crit: notable
  conf: 0.99
  for: [pkginfo, python, text]
  if:
    type: path
    regex: 'curl_cffi-[0-9][^/\\]*\.dist-info[\\/]'
composite_rules:
  - id: curl-cffi-package-context
    desc: Recognized curl_cffi library packaging context
    crit: exception
    for: [pkginfo, python, text]
    any:
      - id: curl-cffi-pypi-package
      - id: curl-cffi-dist-info-path
      - id: micro-behaviors/communications/http/client/library::curl-cffi-import
