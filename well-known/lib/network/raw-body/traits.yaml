# stream-utils/raw-body — read a stream into a buffer.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: raw-body npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: raw-body

  - id: vendored-path
    desc: vendored raw-body package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/raw-body/'
