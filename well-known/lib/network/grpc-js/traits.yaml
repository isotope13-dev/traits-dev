# @grpc/grpc-js is the supported pure-JavaScript gRPC implementation. Its
# resolver performs DNS TXT service-config lookups as part of normal endpoint
# resolution; that is not an extension callback or an exfiltration channel.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: gRPC JavaScript package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@grpc/grpc-js'

  # Both published (`@grpc/grpc-js/`) and monorepo (`packages/grpc-js/`)
  # layouts, so an unrelated directory merely named `grpc-js` is not enough.
  - id: package-path
    desc: gRPC JavaScript package source path
    for: [javascript, typescript, text]
    if:
      type: path
      regex: '(?i)(@grpc|packages)[\\/]grpc-js[\\/]'

  - id: upstream-repository
    desc: gRPC JavaScript upstream repository
    for: [package.json, text]
    if:
      type: text
      substr: github.com/grpc/grpc-node
