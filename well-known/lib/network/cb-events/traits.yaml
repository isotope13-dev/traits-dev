# cb-events — async Chaturbate Events API Python client.
defaults:
  platforms: [unix, windows]
  for: [whl, pkginfo, python, markdown, text, json]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: wheel-distribution
    desc: cb-events Python wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: cb-events

  - id: package-metadata-name
    desc: cb-events PyPI distribution name
    for: [json, markdown, text, pkginfo]
    if:
      type: text
      substr: 'Name: cb-events'

  - id: module-path
    desc: cb_events Python package module path
    for: [python, whl, zip, archives]
    if:
      type: path
      regex: '(?i)cb_events/'

  - id: chaturbate-events-api-summary
    desc: Chaturbate Events API client summary
    for: [json, markdown, text, pkginfo, python]
    if:
      type: text
      substr: Chaturbate Events API

  - id: events-api-base-url
    desc: Chaturbate Events API production base URL
    for: [python]
    if:
      type: text
      substr: eventsapi.chaturbate.com/events

  - id: event-client-class
    desc: cb_events EventClient async API class
    for: [python]
    if:
      type: text
      substr: class EventClient

  - id: github-repo
    desc: MountainGod2 cb-events GitHub repository
    for: [json, markdown, text, python]
    if:
      type: text
      substr: MountainGod2/cb-events

composite_rules:
  - id: cb-events-package
    desc: Chaturbate Events API async Python client
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: wheel-distribution
      - id: package-metadata-name
      - id: module-path
