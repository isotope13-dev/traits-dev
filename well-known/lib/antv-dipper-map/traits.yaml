# AntV DipperMap — geospatial map configuration UI library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97

traits:
  - id: package-name
    desc: AntV DipperMap package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/dipper-map'

  - id: source-package-marker
    desc: AntV DipperMap package marker string
    for: [javascript, typescript]
    if:
      type: text
      exact: '@antv/dipper-map'

  - id: dipper-map-component
    desc: DipperMap React component symbol
    for: [javascript, typescript]
    if:
      type: symbol
      exact: DipperMap

composite_rules:
  - id: dipper-map-library
    desc: AntV DipperMap library identity
    any:
      - id: package-name
      - id: source-package-marker
      - id: dipper-map-component
