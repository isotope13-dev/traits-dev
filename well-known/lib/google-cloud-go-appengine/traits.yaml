# cloud.google.com/go/appengine — Google App Engine Admin API Go client.
defaults:
  platforms: [unix, windows]
  for: [go, zip, text]
  crit: notable
  conf: 0.99

traits:
  - id: archive-path
    desc: cloud.google.com/go/appengine archive path
    if:
      type: path
      regex: 'cloud\.google\.com/go/appengine@'

  - id: module-import
    desc: cloud.google.com/go/appengine import path
    for: [go]
    if:
      type: import
      substr: cloud.google.com/go/appengine

composite_rules:
  - id: google-cloud-go-appengine-library
    desc: Google Cloud App Engine Go client
    any:
      - id: archive-path
      - id: module-import
