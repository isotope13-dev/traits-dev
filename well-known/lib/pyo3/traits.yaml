# PyO3: Rust↔Python binding framework. Path markers appear in compiled
# extension modules built via maturin/setuptools-rust.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  size_min: 50000
  size_max: 50000000

traits:
  - id: pyo3-registry-source-path-macho
    desc: Mach-O PyO3 crates.io registry source path
    for: [macho]
    conf: 0.98
    if:
      type: text
      regex: 'index\.crates\.io-[0-9a-f]+/pyo3-'
      section: __const

  - id: pyo3-registry-source-path-elf
    desc: ELF PyO3 crates.io registry source path
    for: [elf]
    conf: 0.98
    if:
      type: text
      regex: 'index\.crates\.io-[0-9a-f]+/pyo3-'
      section: .rodata

  - id: pyo3-runtime-panic-exception-macho
    desc: Mach-O PyO3 PanicException type name
    for: [macho]
    conf: 0.97
    if:
      type: text
      substr: pyo3_runtime.PanicException
      section: __const

  - id: pyo3-runtime-panic-exception-elf
    desc: ELF PyO3 PanicException type name
    for: [elf]
    conf: 0.97
    if:
      type: text
      substr: pyo3_runtime.PanicException
      section: .rodata

  - id: pyo3-ffi-crate-path-macho
    desc: Mach-O pyo3-ffi crate source path
    for: [macho]
    conf: 0.96
    if:
      type: text
      substr: /pyo3-ffi-
      section: __const

  - id: pyo3-ffi-crate-path-elf
    desc: ELF pyo3-ffi crate source path
    for: [elf]
    conf: 0.96
    if:
      type: text
      substr: /pyo3-ffi-
      section: .rodata

composite_rules:
  - id: pyo3-extension-runtime
    desc: PyO3-built Python native extension
    conf: 0.97
    any:
      - id: pyo3-registry-source-path-macho
      - id: pyo3-registry-source-path-elf
      - id: pyo3-runtime-panic-exception-macho
      - id: pyo3-runtime-panic-exception-elf
      - id: pyo3-ffi-crate-path-macho
      - id: pyo3-ffi-crate-path-elf
