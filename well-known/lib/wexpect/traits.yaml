# wexpect-uv: Windows pexpect-compatible console automation library.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: distribution-name
    desc: wexpect-uv Python distribution name
    for: [whl]
    conf: 0.99
    if:
      type: value
      path: whl.distribution
      exact: wexpect_uv

  - id: package-name
    desc: wexpect-uv package metadata name
    for: [pkginfo]
    conf: 0.99
    if:
      type: value
      path: name
      exact: wexpect-uv

  - id: upstream-repository
    desc: wexpect-uv upstream repository marker
    for: [pkginfo, python, markdown]
    conf: 0.99
    if:
      type: text
      regex: 'github\.com/XnneHangLab/wexpect-uv'

  - id: pexpect-fork-marker
    desc: wexpect Windows pexpect compatibility marker
    for: [pkginfo, python, markdown]
    conf: 0.98
    if:
      type: text
      regex: 'Windows variant of pexpect|raczben/wexpect'

composite_rules:
  - id: package-identity
    desc: wexpect-uv Windows pexpect-compatible console library
    conf: 0.99
    any:
      - id: distribution-name
      - id: package-name
      - id: upstream-repository
