# FPDF — PHP PDF library. Generated font metric files embed character
# widths as dense chr(N)=>width tables; that is font data, not obfuscation.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: fpdf-font-metrics-file
    desc: FPDF generated font metrics definition
    if:
      type: text
      regex: '\$cw\s*=\s*array\(\s*\n?\s*chr\(0\)=>'

  - id: fpdf-core-font-marker
    desc: FPDF core font type marker
    if:
      type: text
      regex: '\$type\s*=\s*[''"]Core[''"];'

  - id: fpdf-truetype-font-marker
    desc: FPDF TrueType font type marker
    if:
      type: text
      regex: '\$type\s*=\s*[''"]TrueType[''"];'

composite_rules:
  - id: fpdf-font-definition-context
    desc: Recognized FPDF font definition file
    crit: notable
    conf: 0.99
    all:
      - id: fpdf-font-metrics-file
    any:
      - id: fpdf-core-font-marker
      - id: fpdf-truetype-font-marker
