# PrivacyScrubber Developer SDK (@privacyscrubber/sdk, BrandMeWeb).
# Proprietary PII sanitization and zero-trust privacy interception SDK.
# Core engine files (ps-pii-engine.cjs, scrubber-core.cjs, ps-license-manager.js)
# are protected with JavaScript Obfuscator by the vendor.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: privacyscrubber-sdk-package-name
    desc: PrivacyScrubber SDK npm package name
    if:
      type: value
      path: name
      exact: '@privacyscrubber/sdk'

  - id: privacyscrubber-homepage
    desc: PrivacyScrubber product site URL
    if:
      type: value
      path: homepage
      substr: privacyscrubber.com

  - id: privacyscrubber-author
    desc: PrivacyScrubber author identity
    if:
      type: value
      path: author
      regex: '(?i)Ilya Sibiryakov'

composite_rules:
  - id: privacyscrubber-sdk-package-context
    desc: PrivacyScrubber SDK commercial package context
    crit: exception
    conf: 0.99
    all:
      - id: privacyscrubber-sdk-package-name
      - id: privacyscrubber-homepage
      - id: privacyscrubber-author
