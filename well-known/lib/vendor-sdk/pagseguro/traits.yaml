# PagBank / PagSeguro — Brazilian digital payment SDK and services.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: pagseguro-encrypt-card-method
    desc: PagSeguro encryptCard client method
    if:
      type: text
      regex: 'PagSeguro[?.]{1,2}encryptCard'

composite_rules:
  - id: pagseguro-payment-context
    desc: PagSeguro payment integration context
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: micro-behaviors/communications/http/services/payment::pagbank-sdk-host
      - id: pagseguro-encrypt-card-method
