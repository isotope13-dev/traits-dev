# The Windows API Code Pack is an open-source .NET wrapper. Its assemblies
# keep the upstream CompanyName of Microsoft and ship unsigned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  size_max: 20000000

traits:
  - id: assembly-basename
    desc: Windows API Code Pack assembly
    if:
      type: basename
      regex: '(?i)^WindowsAPICodePack\.'
