# Vungle (Liftoff) mobile ad SDK. Its MRAID creative template is a generated
# HTML document that ships inside app bundles, so HTML-generator and
# HTTP-POST rules treat it as a recognized third-party SDK rather than
# hand-rolled page generation.
#
# The banner is `notable` because it identifies the SDK outright, which is
# what a well-known/ directory is for -- a fragment that only ever fed
# `unless:` clauses would leave the directory with nothing that names the
# software it is about.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, scripts, binaries]
  conf: 0.95
  size_max: 52428800
traits:
  - id: vungle-mraid-template-banner
    desc: Vungle MRAID ad template banner
    crit: notable
    if:
      type: text
      substr: Vungle Third-Party MRAID Template
