# AppMetrica Android SDK (github.com/appmetrica/appmetrica-sdk-android).
# Notable identity for the SDK package. Its ANR monitor probes the debugger to
# avoid reporting a hang while a developer is attached; that is SDK context,
# not evasion.
defaults:
  platforms: [android]
  for: [java]
  crit: component
  conf: 0.95

traits:
  - id: appmetrica-package-declaration
    desc: Declares an AppMetrica SDK Java package
    crit: notable
    if:
      type: text
      regex: '\bpackage io\.appmetrica\.analytics[.;]'
