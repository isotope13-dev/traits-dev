# Masterpass — Mastercard's digital payment wallet and REST SDK.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.98

traits:
  - id: masterpass-package-name
    desc: Masterpass package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '(?i)(^|@akinon/)pz-masterpass-rest\b'

  - id: masterpass-web-sdk-asset
    desc: Masterpass web SDK asset filename
    for: [javascript]
    if:
      type: path
      regex: '(?i)(^|[\\/])masterpass-javascript-sdk-web(\.min)?\.js$'

  - id: masterpass-client-global
    desc: Masterpass JavaScript client global
    for: [javascript, typescript]
    if:
      type: text
      substr: window.Masterpass

  - id: masterpass-security-info-component
    desc: Masterpass security info component
    for: [javascript, typescript]
    if:
      type: text
      substr: MasterpassSecurityInfo

  - id: masterpass-turkiye-domain
    desc: Masterpass service domain reference
    for: [javascript, typescript]
    if:
      type: text
      substr: masterpassturkiye.com

  - id: masterpass-rest-state-key
    desc: Masterpass Redux state key reference
    for: [javascript, typescript]
    if:
      type: text
      substr: state.masterpassRest

composite_rules:
  - id: masterpass-package-context
    desc: Masterpass package context
    crit: exception
    conf: 0.99
    for: [npm, tar, package.json]
    scope: outer
    any:
      - id: masterpass-package-name
      - id: masterpass-web-sdk-asset

  - id: masterpass-payment-context
    desc: Masterpass payment integration context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    any:
      - id: masterpass-web-sdk-asset
      - id: masterpass-client-global
      - id: masterpass-security-info-component
      - id: masterpass-turkiye-domain
      - id: masterpass-rest-state-key
