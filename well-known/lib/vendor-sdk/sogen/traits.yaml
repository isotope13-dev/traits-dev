defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, text]
  conf: 0.98
  size_min: 10
  size_max: 50000000

traits:
  - id: native-emulator-library
    desc: Sogen Python emulator extension
    crit: notable
    platforms: [macos]
    for: [macho]
    size_min: 1000000
    size_max: 50000000
    if:
      type: export
      exact: PyInit_sogen

  - id: sogen-source-member-path
    desc: Sogen emulator source member path
    crit: notable
    for: [scripts, source, text]
    size_min: 10
    size_max: 50000000
    if:
      type: path
      regex: '(?i)github\.com/momo5502/sogen@'

  - id: sogen-guest-registry-script
    desc: Sogen guest registry provisioning script
    crit: notable
    for: [batch]
    size_min: 10
    size_max: 50000000
    if:
      type: text
      substr: 'Sogen guest registry'

composite_rules:
  - id: sogen-source-tree-context
    desc: Sogen CPU emulator source tree context
    crit: exception
    any:
      - id: sogen-source-member-path
      - id: sogen-guest-registry-script
