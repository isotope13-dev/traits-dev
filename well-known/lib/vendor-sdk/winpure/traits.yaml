# WinPure is a commercial data cleansing, deduplication, and matching software
# vendor (winpure.com). Its .NET API packages ship WinPure libraries, including
# WinPure.Licensing.dll protected with .NET Reactor / IntelliLock.
defaults:
  platforms: [windows]
  for: [pe, dll, nupkg]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 100000000

traits:
  - id: winpure-assembly-basename
    desc: WinPure library assembly
    for: [pe, dll]
    if:
      type: basename
      regex: '(?i)^WinPure\..*\.dll$'

  - id: winpure-original-filename
    desc: WinPure PE OriginalFilename version info
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^WinPure\.'

  - id: winpure-namespace-token
    desc: WinPure .NET namespace reference
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\bWinPure\.(Licensing|Matching|Cleansing|Common|Configuration|API)\b'
      section: .text

  - id: winpure-package-id
    desc: WinPure NuGet package identity
    for: [nupkg]
    if:
      type: value
      path: nupkg.name
      regex: '(?i)^WinPure\.'

composite_rules:
  - id: winpure-library-context
    desc: Recognized WinPure library
    crit: exception
    conf: 0.99
    for: [pe, dll]
    all:
      - id: winpure-assembly-basename
    any:
      - id: winpure-original-filename
      - id: winpure-namespace-token

  - id: winpure-package-context
    desc: Recognized WinPure NuGet package
    crit: exception
    conf: 0.99
    for: [nupkg, pe]
    scope: archive
    all:
      - id: winpure-package-id
      - id: winpure-library-context
