defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 67108864

traits:
  - id: chilkat-company
    desc: Chilkat Software publisher metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Chilkat Software,? Inc\.$'

  - id: chilkat-activex-product
    desc: Chilkat ActiveX product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Chilkat ActiveX v[0-9]'

composite_rules:
  - id: chilkat-activex-library-context
    desc: Chilkat ActiveX library vendor context
    crit: notable
    all:
      - id: well-known/lib/vendor-sdk/chilkat::chilkat-company
      - id: well-known/lib/vendor-sdk/chilkat::chilkat-activex-product
