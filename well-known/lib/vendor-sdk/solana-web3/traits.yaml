defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
  size_max: 8000000
traits:
- id: npm-package-name
  desc: Solana Web3 npm package
  for:
  - package.json
  if:
    type: value
    path: name
    exact: '@solana/web3.js'
- id: js-rpc-error-export
  desc: Solana Web3 RPC error identifier
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: SolanaJSONRPCError
composite_rules:
- id: solana-web3-library
  desc: Solana Web3 JavaScript SDK
  for:
  - javascript
  - typescript
  - package.json
  any:
  - id: npm-package-name
  - id: js-rpc-error-export
