defaults:
  platforms:
  - android
  - linux
  for:
  - xml
  - kotlin
  - java
  - gradle
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000
traits:
- id: adyen-checkout-package-name
  desc: Adyen Android checkout package group
  if:
    type: text
    substr: com.adyen.checkout
- id: adyen-github-repository
  desc: Adyen Android GitHub repository reference
  if:
    type: text
    substr: github.com/Adyen/adyen-android
- id: adyen-checkoutshopper-endpoint
  desc: Adyen checkout shopper API host reference
  if:
    type: text
    regex: checkoutshopper-(test|live)[a-z0-9.-]*\.adyen\.com
- id: adyen-copyright-notice
  desc: Adyen copyright notice
  if:
    type: text
    substr: Adyen N.V.
