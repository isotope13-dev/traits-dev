# Tencent Cloud Chat (TIM) Web SDK — instant-messaging client bundled into
# Flutter and web apps. Its endpoint table lists regional gateways plus
# ANYCAST fallbacks as raw `wss://<ip>` URLs, which a bare direct-IP
# WebSocket rule reads as a hardcoded command channel. Identity requires the
# SDK's own global and its API trace label, both of which a minified build
# keeps, plus a size floor so only the full bundle qualifies.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 100000
  size_max: 20000000

traits:
  - id: chat-sdk-global
    desc: Assigns the TencentCloudChat SDK global
    if:
      type: text
      regex: 'globalThis\.TencentCloudChat\s*='

  - id: chat-sdk-create-trace
    desc: TencentCloudChat.create API trace label
    if:
      type: text
      substr: '"TencentCloudChat.create"'

composite_rules:
  - id: chat-sdk-bundle-context
    desc: Tencent Cloud Chat Web SDK bundle
    crit: exception
    conf: 0.97
    all:
      - id: chat-sdk-global
      - id: chat-sdk-create-trace
