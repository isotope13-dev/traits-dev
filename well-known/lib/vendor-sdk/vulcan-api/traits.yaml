# vulcan-api is a client for the Polish UONET+ school e-register (used by the
# Home Assistant vulcan integration). Besides the routing table it fetches from
# vulcan.net.pl, it hard-codes the FakeLog mock server (api.fakelog.tk) as a
# development tenant -- the one free-TLD host in the library.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: component
  conf: 0.97

traits:
  - id: routing-rules-url
    desc: Vulcan UONET+ routing rules URL
    if:
      type: text
      substr: 'komponenty.vulcan.net.pl/UonetPlusMobile/RoutingRules.txt'
  - id: fakelog-mock-tenant
    desc: FakeLog mock tenant host
    if:
      type: text
      substr: 'components["FK1"] = "http://api.fakelog.tk"'

composite_rules:
  - id: vulcan-api-routing
    desc: Vulcan school e-register API client
    crit: notable
    conf: 0.98
    all:
      - id: routing-rules-url
      - id: fakelog-mock-tenant
