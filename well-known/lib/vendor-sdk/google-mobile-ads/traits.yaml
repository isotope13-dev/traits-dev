# Google Mobile Ads SDK and DroidGuard device integrity client.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.95

traits:
  - id: google-droidguard-client
    desc: Google DroidGuard integrity verification client
    if:
      type: text
      substr: "com.google.ccc.abuse.droidguard.DroidGuard"

  - id: google-mobile-ads-sdk
    desc: Google Mobile Ads SDK package reference
    if:
      type: text
      substr: "com.google.android.libraries.ads.mobile.sdk"

  - id: google-play-services-ads
    desc: Google Play Services Ads library reference
    if:
      type: text
      substr: "com.google.android.gms.ads"

composite_rules:
  - id: google-mobile-ads-framework
    desc: Google Mobile Ads SDK framework components
    crit: notable
    any:
      - id: google-droidguard-client
      - id: google-mobile-ads-sdk
      - id: google-play-services-ads
