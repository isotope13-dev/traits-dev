# @tscircuit/eval — browser/worker circuit evaluator (tscircuit/eval on GitHub).
# Ships large esbuild/tsup bundles (dist/blob-url.js worker loader, webworker).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 52428800

traits:
  - id: npm-package-name
    desc: "@tscircuit/eval npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@tscircuit/eval"

  - id: repository-url
    desc: tscircuit eval GitHub repository URL
    for: [package.json]
    if:
      type: text
      substr: github.com/tscircuit/eval

  - id: blob-url-export-path
    desc: tscircuit eval blob-url package export
    for: [package.json]
    if:
      type: text
      substr: '"./blob-url"'

  - id: dist-blob-url-bundle
    desc: tscircuit eval dist blob-url worker bundle
    for: [javascript]
    size_min: 8000000
    if:
      type: path
      basename: true
      exact: blob-url.js

  - id: webworker-entrypoint-bundle
    desc: tscircuit eval webworker entrypoint bundle
    for: [javascript]
    size_min: 1000000
    if:
      type: path
      substr: dist/webworker/entrypoint.js

composite_rules:
  - id: tscircuit-eval-package
    desc: "Official @tscircuit/eval npm package"
    any:
      - id: npm-package-name
      - id: repository-url
