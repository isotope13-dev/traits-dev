# Pagar.me — Brazilian payment service provider (StoneCo) API.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: pagarme-tokens-endpoint
    desc: Pagar.me card tokens endpoint reference
    if:
      type: text
      substr: /core/v5/tokens

composite_rules:
  - id: pagarme-payment-context
    desc: Pagar.me payment integration context
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: micro-behaviors/communications/http/services/payment::pagarme-api-host
      - id: pagarme-tokens-endpoint
