# @datocms/cma-client-browser — official DatoCMS browser CMA SDK.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, javascript]
  crit: notable
  conf: 0.99
  size_min: 64
  size_max: 5242880

traits:
  - id: npm-package-name
    desc: "@datocms/cma-client-browser package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@datocms/cma-client-browser"

  - id: cms-api-description
    desc: DatoCMS REST CMA browser client description
    for: [package.json]
    if:
      type: text
      substr: DatoCMS REST Content Management API

  - id: browser-dist-bundle
    desc: DatoCMS CMA browser dist bundle path
    for: [javascript]
    if:
      type: path
      substr: dist/browser/index.js

composite_rules:
  - id: datocms-cma-browser-package
    desc: Official DatoCMS browser CMA client
    any:
      - id: npm-package-name
      - id: cms-api-description
      - id: browser-dist-bundle
