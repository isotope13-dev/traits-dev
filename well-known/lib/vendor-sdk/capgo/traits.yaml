# Capgo (Cap-go) publishes the @capgo/capacitor-* Capacitor plugins. Their
# package.json carries a `capacitor:sync:after` hook that the Capacitor CLI runs
# at `cap sync`: a base64-wrapped bash script, decoded and piped to bash, that
# runs a short Node script removing the plugin's own entry from the Android
# capacitor.plugins.json. The pipe-to-interpreter shape is what a dropper uses;
# the payload here is a local JSON edit with no network access.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97
  size_max: 262144

traits:
  - id: capgo-capacitor-package-name
    desc: Capgo Capacitor plugin package name
    if:
      type: value
      path: name
      regex: '^@capgo/capacitor-[a-z0-9-]+$'

  - id: capgo-repository
    desc: Capgo plugin repository reference
    if:
      type: value
      path: repository.url
      substr: github.com/Cap-go/capacitor-

composite_rules:
  - id: capgo-capacitor-plugin-package
    desc: Official Capgo Capacitor plugin package
    crit: notable
    all:
      - id: capgo-capacitor-package-name
      - id: capgo-repository
