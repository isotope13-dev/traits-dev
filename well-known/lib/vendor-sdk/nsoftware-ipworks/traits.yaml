# /n software IPWorks libraries (IPC, ZIP, ...): commercial connectivity and
# compression components that vendors bundle inside their own products (here,
# inside SyncBackPro.exe and SchedulesMonitor.exe). A ZIP/IPC engine
# legitimately enumerates files and touches app-data paths, so the
# file-targeting enumeration composite must not read that as credential
# theft when the IPWorks vendor identity is present.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 16777216

traits:
  - id: nsoftware-company
    desc: /n software publisher metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^\s*/n software inc\..*$'

  - id: ipworks-product
    desc: IPWorks library product metadata
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^\s*IPWorks (IPC|ZIP)\b.*$'

composite_rules:
  - id: ipworks-library-benign-context
    desc: /n software IPWorks library vendor context
    crit: exception
    all:
      - id: well-known/lib/vendor-sdk/nsoftware-ipworks::nsoftware-company
      - id: well-known/lib/vendor-sdk/nsoftware-ipworks::ipworks-product
