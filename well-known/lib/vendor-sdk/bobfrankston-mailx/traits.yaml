# bobfrankston mailx package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: bobfrankston-mailx-package-context
    desc: Bob Frankston mailx email client package context
    crit: exception
    conf: 0.97
    scope: archive
    all:
      - id: well-known/app/communication/bobfrankston-mailx::mailx-package-name
      - id: well-known/app/communication/bobfrankston-mailx::mailx-github-repository
