# Stripe — payment processing APIs and client libraries.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: stripe-payment-methods-endpoint
    desc: Stripe payment methods endpoint reference
    if:
      type: text
      substr: /v1/payment_methods

  - id: stripe-tokens-endpoint
    desc: Stripe card tokens endpoint reference
    if:
      type: text
      substr: /v1/tokens

composite_rules:
  - id: stripe-payment-context
    desc: Stripe payment integration context
    crit: exception
    conf: 0.99
    scope: file
    any:
      - id: micro-behaviors/communications/http/services/payment::stripe-api-host
      - id: stripe-payment-methods-endpoint
      - id: stripe-tokens-endpoint
