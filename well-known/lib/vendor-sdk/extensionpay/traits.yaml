# ExtensionPay (ExtPay, github.com/Glench/ExtPay) is the standard drop-in
# payment/licensing SDK for browser extensions.  Its bundled extpay.js is
# behaviourally indistinguishable from licensing telemetry at the atom level:
# it calls chrome.management.getSelf(), holds host access to a single remote
# vendor origin, sends the per-install key as an `?api_key=` query parameter,
# and opens a payment tab.  Naming the library keeps analysts from re-deriving
# that profile on every monetized extension they triage.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: extensionpay-storage-key
    desc: ExtPay per-install API key storage slot
    if:
      type: text
      substr: extensionpay_api_key

  - id: extensionpay-service-host
    desc: ExtPay extensionpay.com service host
    if:
      type: text
      regex: 'https://extensionpay\.com'

  # Fires in the host extension too (`ExtPay("my-extension-id")`), not just in
  # the bundled extpay.js, so an analyst can tell opt-in from vendored code.
  - id: extensionpay-factory-function
    desc: ExtPay(extension_id) SDK entry point
    if:
      type: symbol
      exact: ExtPay
