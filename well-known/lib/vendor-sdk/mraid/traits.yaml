# MRAID — the IAB Mobile Rich Media Ad Interface Definitions. The SDK
# implements the `window.mraid` bridge an ad creative talks to inside a
# mobile webview; `mraid.open` is the spec's click-through surface.
defaults:
  platforms: [android, ios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: window-mraid-bridge-object
    desc: window.mraid bridge object reference
    if:
      type: text
      # window.mraid is the integration surface the IAB spec mandates.
      regex: '(?i)\bwindow\.mraid\b'
  - id: mraid-namespace-method-call
    desc: mraid namespace method call
    if:
      type: text
      regex: '(?i)\bmraid\.(open|expand|close|isViewable|useCustomClose)\b'

composite_rules:
  - id: mraid-bridge-api
    desc: MRAID mobile rich-media ad bridge API
    any:
      - id: window-mraid-bridge-object
      - id: mraid-namespace-method-call
