# Mellowtel — a monetization SDK that embeds in browser extensions. Once the
# user opts in (a "support program" button), the extension loads third-party
# pages in hidden frames from the user's connection, rewriting request and
# response headers to do so. Identity only: the header-stripping it performs
# is reported by the declarativeNetRequest traits, not excused here.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  crit: notable
  conf: 0.95
  size_min: 1000
  size_max: 20000000

traits:
  - id: mellowtel-sdk-optin-api
    desc: Mellowtel SDK opt-in link API
    if:
      type: text
      substr: generateAndOpenOptInLink
