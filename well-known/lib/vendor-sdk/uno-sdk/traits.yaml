defaults:
  platforms: [windows, unix]
  for: [nupkg, pe, dll]
  crit: notable
  conf: 0.99
  size_min: 50000
  size_max: 50000000

traits:
  - id: nupkg-package-id
    desc: Uno.Sdk NuGet package id
    for: [nupkg]
    size_min: 1000000
    size_max: 500000000
    if:
      type: value
      path: nupkg.id
      regex: '^Uno\.Sdk'

  - id: sdk-dll-path
    desc: Uno.Sdk MSBuild task DLL path
    for: [pe, dll]
    if:
      type: path
      regex: '(^|[\\/])Uno\.Sdk_[0-9a-f]+\.dll$'

composite_rules:
  - id: uno-sdk-package-context
    desc: Recognized Uno Platform SDK package context
    any:
      - id: nupkg-package-id
      - id: sdk-dll-path
