# Blues Lib is a public Selenium/undetected-chromedriver automation library.
# Its CDP fingerprint controls are an explicit browser-automation feature;
# retain the generic capability atoms, but do not escalate code in its
# webdriver source tree solely because it uses those controls.
defaults:
  platforms: [linux, macos, windows]
  for: [pkginfo, python]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: Blues Lib package metadata name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: blues-lib

  - id: webdriver-source-path
    desc: Blues Lib source tree path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])blues_lib[\\/]'
