defaults:
  for: [macho, elf, pe]
  platforms: [macos, linux, windows]
  size_min: 10000
  crit: notable
  conf: 0.99

traits:
  - id: system-info-vm-api
    desc: LicenseSpring SDK VM classification API
    if:
      type: export
      substr: ZN13LicenseSpring18SystemInfoProvider9IsVirtualEb

  - id: license-vm-policy-api
    desc: LicenseSpring SDK license VM permission API
    if:
      type: export
      substr: ZNK13LicenseSpring11UserLicense11isVMAllowedEv

composite_rules:
  # This excludes only the ioreg/vendor co-occurrence inference, not any
  # execution, network, or independently established evasion behavior.
  - id: ioreg-license-policy-context
    desc: LicenseSpring VM policy with ioreg vendor query
    crit: exception
    for: [macho]
    platforms: [macos]
    all:
      - id: system-info-vm-api
      - id: license-vm-policy-api
      - id: micro-behaviors/hardware/iokit/registry::ioreg-vendor-query
