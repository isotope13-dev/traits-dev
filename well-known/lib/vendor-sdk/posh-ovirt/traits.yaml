# PoSh-oVirt is a PowerShell module for Oracle Linux Virtualization Manager /
# oVirt (David A. Stewart, Oracle copyright). It carries, as Base64 text inside
# the .psm1, the GlavSoft-signed TightVNC Viewer it launches for VM consoles
# (and a PuTTY/plink helper), a certificate-inspection function that briefly
# trusts any certificate, and SSH wrappers that keep a sudo password out of the
# remote shell history. Each of those is a hostile or suspicious shape on its
# own and reads differently once the module is recognized by its own functions.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.97

traits:
  - id: connect-ovirt-server-function
    desc: Defines the Connect-oVirtServer cmdlet
    for: [powershell]
    size_min: 100000
    size_max: 33554432
    if:
      type: text
      regex: '(?im)^\s*Function\s+Connect-oVirtServer\b'

  - id: start-ovm-console-function
    desc: Defines the Start-oVMConsole cmdlet
    for: [powershell]
    size_min: 100000
    size_max: 33554432
    if:
      type: text
      regex: '(?im)^\s*Function\s+Start-oVMConsole\b'

composite_rules:
  - id: posh-ovirt-module-source
    desc: PoSh-oVirt PowerShell module source
    crit: exception
    scope: outer
    all:
      - id: connect-ovirt-server-function
      - id: start-ovm-console-function
