# Alibaba SecurityGuard SDK — closed-source anti-fraud and request-signing
# library used across Alibaba apps (DingTalk, Taobao). It builds a device
# identifier (UMID) from hardware, display and OS facts and signs requests. It
# therefore contains HTTP, shell-command, WMI display and module-initializer
# code that a bare capability rule reads as an implant. Identity requires the
# vendor's own class names (macOS) or its verified Authenticode publisher plus
# the SDK's version-resource name (Windows).
defaults:
  platforms: [macos, windows]
  crit: notable
  conf: 0.97
  size_min: 100000
  size_max: 50000000

traits:
  - id: securityguard-objc-manager-class
    desc: SecurityGuard SDK manager Objective-C class
    for: [macho]
    platforms: [macos]
    if:
      type: text
      section: __TEXT,__objc_classname
      substr: SecurityGuardSDKManager

  - id: securityguard-objc-umid-class
    desc: SecurityGuard SDK UMID Objective-C class
    for: [macho]
    platforms: [macos]
    if:
      type: text
      section: __TEXT,__objc_classname
      substr: UMIDInterface

  - id: securityguard-pe-internal-name
    desc: SecurityGuardSDK version-resource name
    for: [pe, dll]
    platforms: [windows]
    if:
      type: value
      path: pe.version.internal_name
      exact: SecurityGuardSDK

composite_rules:
  - id: securityguard-macos-library
    desc: Alibaba SecurityGuard macOS library
    crit: exception
    conf: 0.98
    for: [macho]
    platforms: [macos]
    all:
      - id: securityguard-objc-manager-class
      - id: securityguard-objc-umid-class

  - id: securityguard-signed-windows-library
    desc: Alibaba-signed SecurityGuard Windows library
    crit: exception
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: securityguard-pe-internal-name
      - id: metadata/signed/certificate/subject::alibaba-china-signed-publisher
