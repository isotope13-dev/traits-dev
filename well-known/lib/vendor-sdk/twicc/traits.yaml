# twicc -- terminal tooling package.
defaults:
  platforms: [unix, windows]
traits:
- id: twicc-terminal-path
  desc: Twicc terminal implementation path
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])twicc[\\/]terminal\.py$'
# A `twicc-vite-data-asset-path` trait used to label every
# `assets/data-<token>.js` file as Twicc based on its path alone.  That shape is
# generic Vite/Rollup output and is already covered by the canonical
# metadata/build/bundler/asset::js-hashed-asset-bundle trait, so the misleading
# duplicate was removed.
