defaults:
  platforms: [linux, windows, macos]
  for: [rust]
  crit: notable
  conf: 0.98

traits:
  - id: chrome-agent-crate-marker
    desc: chrome-agent crate name marker
    if:
      type: text
      substr: name = "chrome-agent"
  - id: copy-chrome-cookies-routine
    desc: chrome-agent cookie profile copy helper
    crit: component
    if:
      type: text
      substr: fn copy_chrome_cookies

composite_rules:
  - id: chrome-agent-browser-automation-context
    desc: chrome-agent AI browser automation tool
    all:
      - id: chrome-agent-crate-marker
      - id: copy-chrome-cookies-routine
