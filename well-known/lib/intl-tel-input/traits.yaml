# intl-tel-input — international telephone number input library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, text]
  crit: notable
  conf: 0.99
  size_max: 50000000

traits:
  - id: package-name
    desc: intl-tel-input npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: intl-tel-input

  - id: archive-path
    desc: intl-tel-input npm archive path
    if:
      type: path
      regex: 'intl-tel-input-[0-9]'

composite_rules:
  - id: intl-tel-input-library
    desc: intl-tel-input phone number UI library
    any:
      - id: package-name
      - id: archive-path
