# CrashRpt's sender is a crash-report delivery helper.  Its screenshot,
# minidump, network, and cleanup imports are diagnostics, not theft or C2.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: crashrpt-product-name
    desc: CrashRpt product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: CrashRpt

  - id: crashrpt-sender-name
    desc: CrashRpt sender metadata
    if:
      type: value
      path: pe.version.internal_name
      exact: CrashSender

  - id: crashrpt-sender-description
    desc: CrashRpt sender description metadata
    if:
      type: value
      path: pe.version.description
      exact: Crash Report Delivery Module

  - id: crashrpt-sender-text-name
    desc: CrashRpt sender text marker
    if:
      type: text
      substr: CrashSender

  - id: crashrpt-sender-text-description
    desc: CrashRpt sender description text marker
    if:
      type: text
      substr: Crash Report Delivery Module

composite_rules:
  - id: crashrpt-version-identity
    desc: CrashRpt sender version identity
    crit: component
    all:
      - id: crashrpt-product-name
      - id: crashrpt-sender-name
      - id: crashrpt-sender-description

  - id: crashrpt-text-identity
    desc: CrashRpt sender text identity
    crit: component
    all:
      - id: crashrpt-sender-text-name
      - id: crashrpt-sender-text-description

  - id: crashrpt-sender
    desc: Recognized CrashRpt crash-report sender context
    crit: exception
    conf: 0.99
    any:
      - id: crashrpt-version-identity
      - id: crashrpt-text-identity
