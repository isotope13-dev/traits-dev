# Netty ships this intentionally permissive trust-manager utility as a
# reusable transport helper; it is not evidence of sample-specific bypass.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: insecure-trust-manager-utility
    desc: Netty insecure trust manager utility class
    if:
      type: value
      path: class.this_class
      regex: '(^|/)io/netty/handler/ssl/util/InsecureTrustManagerFactory(\$1)?$'
