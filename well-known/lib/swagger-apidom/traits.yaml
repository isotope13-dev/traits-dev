# Official @swagger-api/apidom packages provide AST and namespace support for
# Swagger ApiDOM. These are identity traits only; they must not suppress
# capability or supply-chain findings in a package that happens to use ApiDOM.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: package-name-core
    desc: Swagger ApiDOM core package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@swagger-api/apidom-(ast|core|error)$'

  - id: package-name-json-schema
    desc: Swagger ApiDOM JSON Schema package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@swagger-api/apidom-ns-json-schema-(draft-[467]|2019-09|2020-12)$'

  - id: package-name-openapi
    desc: Swagger ApiDOM OpenAPI package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@swagger-api/apidom-ns-openapi-3-0'

  - id: package-repository
    desc: Swagger ApiDOM package repository identity
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: git+https://github.com/swagger-api/apidom.git

  - id: archive-package-name-core
    desc: Swagger ApiDOM core npm archive package name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      regex: '^@swagger-api/apidom-(ast|core|error)$'

  - id: archive-package-name-json-schema
    desc: Swagger ApiDOM JSON Schema archive name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      regex: '^@swagger-api/apidom-ns-json-schema-(draft-[467]|2019-09|2020-12)$'

  - id: archive-package-name-openapi
    desc: Swagger ApiDOM OpenAPI npm archive package name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@swagger-api/apidom-ns-openapi-3-0'

  - id: archive-package-repository
    desc: Swagger ApiDOM npm archive repository identity
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: git+https://github.com/swagger-api/apidom.git

composite_rules:
  - id: package-name
    desc: Swagger ApiDOM package name
    crit: notable
    for: [package.json]
    any:
      - id: package-name-core
      - id: package-name-json-schema
      - id: package-name-openapi

  - id: archive-package-name
    desc: Swagger ApiDOM npm archive package name
    crit: notable
    for: [npm, tar]
    any:
      - id: archive-package-name-core
      - id: archive-package-name-json-schema
      - id: archive-package-name-openapi

  - id: official-package
    desc: Official Swagger ApiDOM package identity
    crit: notable
    for: [package.json]
    all:
      - id: package-name
      - id: package-repository

  - id: official-archive
    desc: Official Swagger ApiDOM npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-package-repository
