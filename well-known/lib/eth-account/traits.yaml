# Official PyPI eth-account identity.  These atoms describe the upstream
# project; supply-chain intent is assembled in objectives/supply-chain/.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl]
  crit: notable
  conf: 0.98

traits:
  - id: pypi-homepage
    desc: Official eth-account project homepage
    for: [pkginfo]
    if:
      type: value
      path: home-page
      exact: https://github.com/ethereum/eth-account

  - id: pypi-author-email
    desc: Official eth-account maintainer email
    for: [pkginfo]
    if:
      type: value
      path: author-email
      exact: snakecharmers@ethereum.org

  - id: wheel-homepage
    desc: Official eth-account wheel homepage
    for: [whl]
    if:
      type: value
      path: whl.home_page
      exact: https://github.com/ethereum/eth-account

  - id: wheel-author-email
    desc: Official eth-account wheel maintainer email
    for: [whl]
    if:
      type: value
      path: whl.author_email
      exact: snakecharmers@ethereum.org

  - id: pypi-canonical-name
    desc: Canonical eth-account distribution name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: eth-account

  - id: wheel-canonical-name
    desc: Canonical eth-account wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: eth_account

