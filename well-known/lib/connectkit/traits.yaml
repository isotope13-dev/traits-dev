# ConnectKit is a legitimate wallet-connection UI/library bundle.  Its
# catalog intentionally contains the official IDs and download links for many
# wallets; those references are not wallet credential access by themselves.

defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
  for: [javascript, typescript]

traits:
  - id: connectkit-reference
    desc: ConnectKit wallet connection library reference
    if:
      type: text
      word: ConnectKit
      case_insensitive: true
  - id: connectkit-wallet-catalog
    desc: ConnectKit wallet download catalog
    if:
      type: text
      substr: "https://connect.family.co/v0/download/"
  - id: connectkit-ui-marker
    desc: ConnectKit wallet UI mount marker
    if:
      type: text
      substr: "data-connectkit"

composite_rules:
  - id: connectkit-wallet-integration-context
    desc: Recognized ConnectKit wallet integration
    crit: exception
    conf: 0.99
    all:
      - id: connectkit-reference
      - id: connectkit-wallet-catalog
      - id: connectkit-ui-marker
