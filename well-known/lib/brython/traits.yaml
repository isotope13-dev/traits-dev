# Brython (Browser Python) — official Python 3 implementation for the browser.
# eval() in brython.js and CPython stdlib tests under www/src/Lib/test are
# expected runtime and conformance artifacts, not supply-chain payloads.
defaults:
  platforms: [unix, windows]
  for: [javascript, python, markdown, zip]
  crit: notable
  conf: 0.99

traits:
  - id: upstream-repo-marker
    desc: Brython upstream repository marker
    if:
      type: text
      substr: brython-dev/brython

  - id: browser-python-tagline
    desc: Brython browser Python tagline
    for: [markdown]
    if:
      type: text
      regex: '(?i)Brython \(Browser Python\)'

  - id: brython-js-basename
    desc: Brython core JavaScript runtime basename
    for: [javascript]
    if:
      type: path
      basename: true
      exact: brython.js

composite_rules:
  - id: brython-source-archive
    desc: Official Brython browser Python source archive
    crit: notable
    scope: archive
    for: [zip, archives]
    any:
      - id: upstream-repo-marker
      - id: browser-python-tagline
    all:
      - id: brython-js-basename
