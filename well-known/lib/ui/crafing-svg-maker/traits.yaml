# @crafing/react-svg-maker and @crafing/svg-maker — SVG path maker and React UI components (Crafing).
# Commercial SVG editor components (crafing.com/tools/svg-maker) shipped with JavaScript Obfuscator.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Crafing SVG maker package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@crafing\/(react-)?svg-maker$'

  - id: npm-archive-name
    desc: Crafing SVG maker npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@crafing\/(react-)?svg-maker$'

  - id: crafing-author
    desc: Crafing author declaration
    for: [package.json]
    if:
      type: value
      path: author
      exact: crafing

composite_rules:
  - id: crafing-svg-maker-context
    desc: Crafing SVG maker package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: crafing-author
    any:
      - id: package-name
      - id: npm-archive-name
