# Tcl/Tk Windows runtime libraries (tk86t.dll, tcl86t.dll).
#
# The Tk DLL is the toolkit's own event loop. It imports SetWindowsHookEx
# and GetKeyboardState to deliver keystrokes to Tk widgets, so a keyboard-hook
# composite on the DLL is the framework, not an implant.
defaults:
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
traits:
  - id: tcl-tk-runtime-basename
    desc: Tcl/Tk Windows runtime DLL
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^(tcl|tk)[0-9]{2}t?\.dll$'
