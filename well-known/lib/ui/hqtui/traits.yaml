# HQTUI — High-Quality Terminal User Interface system monitor and dashboard.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: HQTUI npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@profullstack/hqtui(-demo)?$'

  - id: hqtui-import-reference
    desc: HQTUI library import reference
    for: [javascript, typescript]
    if:
      type: text
      substr: '@profullstack/hqtui'

  - id: simulated-telemetry-marker
    desc: HQTUI simulated telemetry marker
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Simulated telemetry so `--sim` populates every screen'

composite_rules:
  - id: hqtui-context
    desc: Recognized HQTUI terminal system monitor context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: package-name
      - id: hqtui-import-reference
      - id: simulated-telemetry-marker
