# enquirer — stylish CLI prompts.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: enquirer npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: enquirer

  - id: vendored-path
    desc: vendored enquirer package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/enquirer/'


composite_rules:
  - id: enquirer-library
    desc: enquirer CLI prompt library
    any:
      - id: package-name
      - id: vendored-path
