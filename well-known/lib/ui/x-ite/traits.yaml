# X_ITE — WebGL/X3D browser runtime (create3000/x_ite).
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, archives]
  crit: notable
  conf: 0.99

traits:
  - id: x-ite-package-name
    desc: X_ITE npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: x_ite

  - id: x-ite-npm-package-name
    desc: X_ITE npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: x_ite

  - id: x-ite-repository
    desc: X_ITE upstream repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/create3000/x_ite(\.git)?'

  - id: x-ite-npm-repository
    desc: X_ITE npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: 'github\.com/create3000/x_ite(\.git)?'

  - id: x-ite-library-banner
    desc: X_ITE minified bundle version banner
    for: [javascript, typescript]
    if:
      type: text
      regex: '/\* X_ITE v[0-9]'

composite_rules:
  - id: x-ite-manifest-context
    desc: X_ITE package manifest context
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: x-ite-package-name
      - id: x-ite-repository

  - id: x-ite-npm-context
    desc: X_ITE npm archive context
    crit: exception
    conf: 1.0
    scope: outer
    all:
      - id: x-ite-npm-package-name
      - id: x-ite-npm-repository

  - id: x-ite-package-context
    desc: X_ITE X3D browser library context
    crit: exception
    conf: 1.0
    scope: outer
    any:
      - id: x-ite-manifest-context
      - id: x-ite-npm-context
      - id: x-ite-library-banner
