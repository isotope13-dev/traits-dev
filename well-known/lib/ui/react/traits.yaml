defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: production-error-decoder
    desc: React minified production error decoder text
    conf: 0.95
    if:
      type: text
      substr: Minified React error #

  - id: version-banner
    desc: React version banner
    conf: 0.95
    if:
      type: literal
      regex: React (v)?[0-9]+\.[0-9]+\.[0-9]+

  - id: react-license-banner
    desc: React license banner
    conf: 0.95
    if:
      type: text
      regex: '@license React v[0-9]+\.[0-9]+\.[0-9]+'

  - id: react-do-not-use-fired
    desc: React internal global state
    conf: 0.9
    # Relocated from objectives/supply-chain/hidden-payload/trojan/, where a
    # React framework marker was filed as trojan evidence. The string names
    # React internals; supply-chain composites reference this atom from
    # unless: to excuse framework code.
    if:
      type: text
      substr: _DO_NOT_USE_OR_YOU_WILL_BE_FIRED

  - id: react-dom-development-bundle
    desc: ReactDOM development bundle
    conf: 0.98
    if:
      type: text
      substr: react-dom.development.js

  - id: react-devtools-text
    desc: React DevTools compatibility text
    conf: 0.9
    if:
      type: text
      substr: React DevTools

  - id: react-devtools-hook
    desc: React DevTools compatibility hook
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^(window|globalThis|self|global)\.__REACT_DEVTOOLS[^.]*$'

  - id: react-dom-renderer-package
    desc: ReactDOM renderer package marker
    conf: 0.98
    if:
      type: text
      substr: "rendererPackageName: 'react-dom'"

  - id: copyright-notice
    desc: React copyright notice
    conf: 0.95
    if:
      type: literal
      regex: \* React (\(with addons\) )?v[0-9]

  - id: package-name
    desc: React package identifier
    conf: 0.9
    if:
      type: literal
      regex: '@license React|React \(c\) (Facebook|Meta)'

  - id: react-object
    desc: React object initialization
    conf: 0.85
    if:
      type: literal
      regex: \bReact\.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED\b

  - id: react-dom
    desc: ReactDOM object reference
    conf: 0.85
    if:
      type: literal
      regex: \bReactDOM\.(render|createRoot|hydrate)

  - id: jsx-pragma
    desc: React JSX transformation signature
    conf: 0.8
    if:
      type: text
      substr: 'React.createElement('

composite_rules:
  - id: library-identity
    desc: React library identity
    conf: 0.9
    any:
      - id: version-banner
      - id: react-license-banner
      - id: react-dom-development-bundle
      - id: react-dom-renderer-package
      - id: copyright-notice
      - id: package-name
      - id: react-object
