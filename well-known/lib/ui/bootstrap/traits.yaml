# twbs/bootstrap — front-end CSS/JS UI toolkit.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, data]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 20000000

traits:
  - id: version-banner
    desc: Bootstrap version header comment
    if:
      type: text
      regex: '(?m)^[/*\s]*Bootstrap v[0-9]+\.[0-9]+\.[0-9]+\b'

  - id: dist-module-banner
    desc: Bootstrap dist module version banner
    if:
      type: text
      regex: 'Bootstrap \(v[0-9]+\.[0-9]+\.[0-9]+\)'

  - id: datepicker-version-banner
    desc: Bootstrap Datepicker version header
    if:
      type: text
      regex: 'Datepicker for Bootstrap v[0-9]+\.[0-9]+\.[0-9]+\b'

  - id: authors-copyright
    desc: Bootstrap Authors copyright notice
    if:
      type: text
      substr: The Bootstrap Authors

  - id: getbootstrap-url
    desc: getbootstrap.com library homepage URL
    if:
      type: text
      substr: getbootstrap.com

  - id: twbs-license-url
    desc: Bootstrap MIT license GitHub URL
    if:
      type: text
      regex: 'github\.com/twbs/bootstrap/blob/(main|master)/LICENSE'

  - id: bundle-path
    desc: Bootstrap bundle script path
    for: [scripts, manifests, data, source]
    if:
      type: path
      substr: 'bootstrap.bundle'

  - id: sourcemap-path
    desc: Bootstrap JavaScript sourcemap path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'bootstrap(\.bundle|\.esm)?(\.min)?\.js\.map'

  - id: glyphicons-halflings-font-id
    desc: Glyphicons Halflings SVG font id
    for: [svg]
    if:
      type: text
      substr: 'id="glyphicons_halflingsregular"'

  - id: glyphicons-halflings-font-face
    desc: Glyphicons Halflings font-face metrics
    for: [svg]
    if:
      type: text
      substr: 'units-per-em="1200" ascent="960" descent="-240"'

composite_rules:
  - id: bootstrap-js-library
    desc: twbs Bootstrap JavaScript library
    all:
      - id: getbootstrap-url
    any:
      - id: version-banner
      - id: dist-module-banner
      - id: authors-copyright
      - id: bundle-path
      - id: sourcemap-path
      - id: twbs-license-url

  - id: bootstrap-sourcemap
    desc: Bootstrap JavaScript source map
    all:
      - id: dist-module-banner
      - id: twbs-license-url

  - id: glyphicons-halflings-svg-font
    desc: Glyphicons Halflings SVG icon font
    for: [svg]
    all:
      - id: glyphicons-halflings-font-id
      - id: glyphicons-halflings-font-face
