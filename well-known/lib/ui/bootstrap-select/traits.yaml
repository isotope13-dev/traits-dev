# bootstrap-select — Snapappointments Bootstrap custom select plugin.
defaults:
  platforms: [windows, unix]
  for: [text, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: version-banner
    desc: Bootstrap-select library banner
    if:
      type: text
      substr: Bootstrap-select v

  - id: selectpicker-class
    desc: Bootstrap-select selectpicker class
    if:
      type: text
      substr: selectpicker

composite_rules:
  - id: bootstrap-select-library
    desc: Bootstrap-select UI plugin
    crit: notable
    conf: 0.98
    any:
      - id: version-banner
      - id: selectpicker-class
