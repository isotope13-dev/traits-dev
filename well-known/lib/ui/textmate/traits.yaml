defaults:
  for: [javascript]
  platforms: [linux, macos, windows]
  size_max: 2097152

traits:
  # shiki emits the grammar as a double-quoted JS string with the JSON's own
  # quotes backslash-escaped (`JSON.parse("{\"displayName\":...")`); only the
  # older backtick form spelled `{"displayName":` literally. Requiring the
  # unescaped quote meant this fired on none of the 800+ modules in a current
  # @shikijs/langs tree, so the ~15 rules that suppress on it kept reading the
  # per-language symbol alternations as PowerShell, SMTP and getprop calls.
  - id: frozen-json-grammar-module
    desc: Generated TextMate grammar JSON module
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'Object\.freeze\(JSON\.parse\([`''"]\{\\?"displayName\\?":'
