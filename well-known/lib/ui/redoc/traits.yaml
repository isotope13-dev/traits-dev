defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  size_max: 209715200

traits:
  - id: standalone-bundle
    desc: ReDoc standalone UI bundle
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'exports.Redoc=t(require("null"))'
  - id: oas-bundle-symbol
    desc: ReDoc OpenAPI bundle symbol
    crit: component
    conf: 0.95
    if:
      type: text
      substr: 't.bundleDocument=t.bundleFromString=t.bundle=t.OasVersion'
  - id: version-marker
    desc: ReDoc bundled UI version marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'ReDoc Version:\s*[0-9]+\.[0-9]+\.[0-9]+'

composite_rules:
  - id: library
    desc: ReDoc OpenAPI UI library
    crit: notable
    conf: 0.97
    any:
      - id: standalone-bundle
      - id: oas-bundle-symbol
      - id: version-marker
