# Font Awesome icon fonts carry PostScript names such as FontAwesome5Brands
# or FontAwesome6Free-Solid in their name table. The record identifies the
# icon font; it says nothing about the page or kit that shipped it.
defaults:
  platforms: [unix, windows]
  for: [font]
traits:
  - id: fontawesome-font-name-record
    desc: Font Awesome icon font name record
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'FontAwesome[5-7](Free|Brands|Pro|Sharp)'
