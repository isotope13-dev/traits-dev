# Libadwaita is the companion library for GTK4, providing GNOME UI styling and
# widgets. Its Windows MSVC builds contain legitimate short spin/error stubs
# following G_NORETURN logging or abort calls.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 500000
  size_max: 20000000

traits:
  - id: libadwaita-dll-basename
    desc: Libadwaita DLL basename
    if:
      type: basename
      regex: '^(lib)?adwaita-1-\d+\.dll$'
      case_insensitive: true

  - id: libadwaita-pdb-basename
    desc: Libadwaita PDB basename
    if:
      type: value
      path: pe.debug.pdb.basename
      regex: '^(lib)?adwaita-1-\d+\.pdb$'
      case_insensitive: true

  - id: libadwaita-prefixed-exports
    desc: Many Libadwaita adw-prefixed exports
    count_min: 50
    if:
      type: export
      regex: '^adw_[a-z0-9_]+$'

composite_rules:
  - id: libadwaita-library-identity
    desc: Identified Libadwaita native library
    all:
      - id: libadwaita-prefixed-exports
    any:
      - id: libadwaita-dll-basename
      - id: libadwaita-pdb-basename
