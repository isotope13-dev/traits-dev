# System.Design implements bitmap editors and reflection-based component
# serialization. Those APIs describe the designer library itself. Require
# independent implementation type names from the CLR metadata string heap;
# a filename, vendor field, or a single reference does not establish identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 2000000

traits:
  - id: codedom-serializer-base-type
    desc: CodeDomSerializerBase type name
    if:
      type: text
      section: .text
      exact: CodeDomSerializerBase
  - id: image-list-codedom-serializer-type
    desc: ImageListCodeDomSerializer type name
    if:
      type: text
      section: .text
      exact: ImageListCodeDomSerializer
  - id: designer-table-layout-serializer-type
    desc: Designer table-layout collection serializer type
    if:
      type: text
      section: .text
      exact: DesignerTableLayoutControlCollectionCodeDomSerializer

composite_rules:
  - id: framework-designer-serialization-library
    desc: .NET Framework designer serialization library
    all:
      - id: codedom-serializer-base-type
      - id: image-list-codedom-serializer-type
      - id: designer-table-layout-serializer-type
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::dotnet-strong-name-signed
