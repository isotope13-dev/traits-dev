# GOV.UK Frontend — accessible government-service UI component library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  size_max: 10000000

traits:
  - id: package-name
    desc: GOV.UK Frontend package manifest
    for: [package.json]
    if:
      type: value
      path: name
      exact: govuk-frontend

  - id: package-member-path
    desc: GOV.UK Frontend package member
    if:
      type: path
      regex: 'node_modules[/\\]govuk-frontend([/\\]|$)'
