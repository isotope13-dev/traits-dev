defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: npm-package-name
    desc: Vite npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vite

  - id: upstream-repository
    desc: Vite upstream repository marker
    if:
      type: text
      # Do not treat the `vite-plugin-*` repositories linked by Vue's runtime
      # warning as the Vite repository itself.
      regex: 'github\.com/vitejs/vite(\.git)?([/\s"''`?#),]|$)'

  - id: product-homepage
    desc: Vite product homepage marker
    if:
      type: text
      substr: vite.dev

  - id: dist-node-runtime-chunk-path
    desc: Vite node.js runtime chunk path
    for: [javascript]
    if:
      type: path
      regex: 'chunks[/\\]node\.js$'

  - id: dist-node-hashed-chunk-basename
    desc: Vite hashed dependency chunk basename
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '^dep-[a-f0-9]+\.js$'

  - id: vite-source-path
    desc: Vite published source path
    crit: notable
    for: [javascript, typescript]
    if:
      type: path
      regex: 'node_modules[\\/]vite[\\/]'

composite_rules:
  - id: dist-node-chunk
    desc: Vite published node chunk path
    for: [javascript]
    any:
      - id: dist-node-runtime-chunk-path
      - id: dist-node-hashed-chunk-basename

  - id: vite-dev-tool
    desc: Vite frontend build tool
    any:
      - id: npm-package-name
      - id: upstream-repository
      - id: product-homepage
      - id: dist-node-chunk

  - id: official-vite-package-context
    desc: Official Vite npm package context
    crit: exception
    conf: 0.99
    scope: archive
    for: [javascript, package.json, npm]
    all:
      - id: npm-package-name
      - id: dist-node-chunk
