defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 500000000

traits:
  - id: npm-package-name
    desc: Vite npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: vite

  - id: upstream-repository
    desc: Vite upstream repository marker
    if:
      type: text
      substr: github.com/vitejs/vite

  - id: product-homepage
    desc: Vite product homepage marker
    if:
      type: text
      substr: vite.dev

composite_rules:
  - id: vite-dev-tool
    desc: Vite frontend build tool
    any:
      - id: npm-package-name
      - id: upstream-repository
      - id: product-homepage
