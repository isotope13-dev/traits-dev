# fusesource/jansi — Java ANSI terminal/console native library.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho, class, java_class, jar]
  crit: notable
  conf: 0.99
  size_min: 1024
  size_max: 524288

traits:
  - id: jni-clibrary-init
    desc: Jansi JNI CLibrary init export
    for: [pe, elf, macho]
    if:
      type: symbol
      substr: Java_org_fusesource_jansi_internal_CLibrary_init

  - id: native-so-basename
    desc: Jansi native shared-library basename
    for: [elf, macho]
    if:
      type: basename
      regex: '^libjansi\.(so|jnilib)$'

  - id: class-namespace
    desc: Jansi Java package namespace
    for: [class, java_class]
    if:
      type: import
      regex: '^org/fusesource/jansi/'

  - id: ansiconsole-internal-name
    desc: Jansi AnsiConsole class internal name
    for: [class, java_class]
    if:
      type: text
      substr: 'Lorg/fusesource/jansi/AnsiConsole;'

  - id: ansimain-internal-name
    desc: Jansi AnsiMain class internal name
    for: [class, java_class]
    if:
      type: text
      substr: 'Lorg/fusesource/jansi/AnsiMain;'

  - id: vendored-path
    desc: Jansi fusesource package path
    if:
      type: path
      regex: 'fusesource/jansi'

composite_rules:
  - id: jansi-library
    desc: fusesource Jansi ANSI terminal library
    any:
      - id: jni-clibrary-init
      - id: native-so-basename
      - id: well-known/lib/format/jline::jansi-native-dll
      - id: class-namespace
      - id: ansiconsole-internal-name
      - id: ansimain-internal-name
      - id: vendored-path
