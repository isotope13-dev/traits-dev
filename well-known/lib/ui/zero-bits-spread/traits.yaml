# @zero-bits/spread — React UI wrapper for GrapeCity SpreadJS spreadsheet components.
# Ships build-obfuscated SpreadJS controller and React views with TypeScript declarations.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: Zero-bits spread package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@zero-bits/spread'

  - id: npm-archive-name
    desc: Zero-bits spread npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@zero-bits/spread'

  - id: grapecity-spread-dependency
    desc: GrapeCity SpreadJS dependency declaration
    for: [package.json]
    if:
      type: value
      path: dependencies.@grapecity-software/spread-sheets
      exists: true

composite_rules:
  - id: zero-bits-spread-context
    desc: Zero-bits SpreadJS wrapper package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: grapecity-spread-dependency
    any:
      - id: package-name
      - id: npm-archive-name
