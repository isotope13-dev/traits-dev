# Web Awesome (Fonticons, Inc.) web components library
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.98

traits:
  - id: webawesome-ui-library
    desc: Web Awesome UI components library
    if:
      type: text
      regex: '(?i)(webawesome\.com|Fonticons,\s*Inc\..{0,50}webawesome)'
