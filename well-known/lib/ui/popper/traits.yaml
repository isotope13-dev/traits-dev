defaults:
  platforms: [windows, unix]
  for: [javascript, data, json]
traits:
  - id: popper-js-v1-banner
    desc: Popper.js v1 library copyright banner
    crit: notable
    conf: 0.97
    # The ESM dist spells the copyright `(c)` lowercase with the year before
    # the name (`(c) 2016 Federico Zivolo`); the UMD banner uses `(C)` with
    # the year after. Match both orders so either build identifies as
    # Popper.js.
    if:
      type: text
      regex: 'Copyright \([Cc]\) (20\d\d )?Federico Zivolo( 20\d\d)?\b'
