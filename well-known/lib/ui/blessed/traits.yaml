# blessed (chjj/blessed) lib/unicode.js — the east-asian-width, surrogate-pair
# and combining-character table the terminal widget library uses to compute
# display widths.
#
# This identity sits in the `unless:` of the invisible-unicode steganography
# composite, so it is a suppressor and has to survive an attacker who *wants*
# it to match. Both prior legs were free to satisfy: a file named unicode.js
# containing the word "blessed" anywhere — one comment away from disarming the
# stego rule on a real decoder. The legs below instead require the upstream
# banner blessed's own header carries and the two width exports that give the
# module its purpose, so the file has to actually be (or fully reproduce) the
# library rather than merely mention it.
defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
  size_max: 1000000

traits:
  - id: blessed-unicode-module-path
    desc: Blessed unicode module path
    crit: component
    conf: 0.94
    if:
      type: basename
      regex: '(^|[\\/])unicode\.js$'

  - id: blessed-upstream-repo-banner
    desc: Blessed upstream repository banner
    crit: component
    conf: 0.94
    if:
      type: text
      substr: github.com/chjj/blessed

  - id: blessed-char-width-export
    desc: Blessed charWidth export
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'exports\.charWidth\s*='

  - id: blessed-str-width-export
    desc: Blessed strWidth export
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'exports\.strWidth\s*='

composite_rules:
  - id: blessed-terminal-unicode-module
    desc: Blessed terminal unicode helper
    crit: notable
    conf: 0.94
    all:
      - id: blessed-unicode-module-path
      - id: blessed-upstream-repo-banner
      - id: blessed-char-width-export
      - id: blessed-str-width-export
