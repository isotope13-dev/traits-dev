# orchidjs Tom Select — <select> UI control.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: version-banner
    desc: Tom Select version header comment
    if:
      type: text
      substr: 'Tom Select v'

  - id: umd-global-assign
    desc: Tom Select UMD global assignment
    if:
      type: text
      substr: 'e||self).TomSelect=t()'

  - id: complete-bundle-path
    desc: Tom Select complete bundle path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'tom-select\.complete'

composite_rules:
  - id: tom-select-library
    desc: orchidjs Tom Select UI control
    all:
      - id: umd-global-assign
      - id: complete-bundle-path
