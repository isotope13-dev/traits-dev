# @servicetitan/react-ioc — InversifyJS Context API bindings from ServiceTitan.
# ChainDrop poisoned releases 38.1.1–38.1.5. Keep this neutral package identity
# independent of a release verdict: payload behavior identifies compromised
# artifacts, while an exact package version belongs in threat intelligence.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: "@servicetitan/react-ioc npm package name"
    if:
      type: value
      path: name
      exact: '@servicetitan/react-ioc'
