# @servicetitan/react-ioc — InversifyJS Context API bindings from ServiceTitan's
# uikit monorepo. CHAINDROP/Shai-Hulud poisoned 38.1.1–38.1.3 with a preinstall
# setup.mjs dropper; later releases (including 38.3.0) that lack install hooks
# and match the published uikit source are the clean library.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: "@servicetitan/react-ioc npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@servicetitan/react-ioc'

  - id: uikit-repository
    desc: ServiceTitan uikit monorepo repository URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/servicetitan/uikit'

  - id: inversify-react-description
    desc: package.json InversifyJS React IoC description
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)InversifyJS.*React|React.*Inversify'

  - id: inversify-reexport
    desc: Re-exports inversify container primitives
    for: [javascript, typescript]
    if:
      type: text
      regex: "from ['\"]inversify['\"]"

composite_rules:
  - id: package-identity
    desc: Recognized @servicetitan/react-ioc package
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-name
      - id: uikit-repository
      - id: inversify-react-description

  - id: clean-library-surface
    desc: Clean react-ioc surface without install hooks
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: package-identity
      - id: inversify-reexport
    unless:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
