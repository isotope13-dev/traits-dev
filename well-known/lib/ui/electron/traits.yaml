# Stock Electron runtime executable (the Chromium + Node.js shell every
# Electron app ships under its own name, e.g. app.exe beside resources/app.asar).
# Like the CEF binaries, it is an unsigned or app-signed Chromium build that
# resolves APIs dynamically, checks for debuggers and allocates RWX for V8; none
# of that is a loader stage. Recognised once here so the loader composites can
# carve it out with a single reference.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  size_min: 10485760
  size_max: 600000000
  crit: notable
  conf: 0.99

traits:
  - id: electron-node-source-paths
    desc: Electron-embedded Node.js source paths
    if:
      type: text
      section: .rdata
      regex: 'third_party[\\/]electron_node[\\/]src[\\/][a-z_]{3,30}\.cc'

  - id: electron-run-as-node-switch
    desc: Electron ELECTRON_RUN_AS_NODE switch
    if:
      type: text
      section: .rdata
      word: ELECTRON_RUN_AS_NODE

composite_rules:
  - id: electron-runtime-binary-context
    desc: Stock Electron runtime executable
    crit: exception
    all:
      - id: electron-node-source-paths
      - id: electron-run-as-node-switch
