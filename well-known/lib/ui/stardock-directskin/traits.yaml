# Stardock's WindowBlinds DirectSkin ActiveX control uses window hooks and
# cross-process memory to apply its shell skin. Those capabilities are expected
# for this library and should not be interpreted as injection by themselves.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  size_min: 200000
  size_max: 2000000

traits:
  - id: stardock-company-name
    desc: Stardock Corporation company metadata
    if:
      type: text
      exact: 'Stardock Corporation'
      section: rsrc
  - id: directskin-product-name
    desc: Stardock DirectSkin product metadata
    if:
      type: text
      exact: 'WindowBlinds : DirectSkin'
      section: rsrc
  - id: wbocx-original-filename
    desc: Stardock WBOCX original filename metadata
    if:
      type: text
      exact: 'WBOCX.OCX'
      section: rsrc
  - id: wbocx-progid
    desc: Stardock WBOCX ActiveX ProgID
    if:
      type: text
      exact: 'WBOCX.WbocxCtrl.1'
      section: rdata
  - id: wbocx-description
    desc: Stardock WBOCX ActiveX module description
    if:
      type: text
      exact: 'This OCX control is not for free use.  Only for use by licensed customers of Stardock.Net, Inc'
      section: rsrc

composite_rules:
  - id: directskin-control-identity
    desc: Stardock DirectSkin ActiveX control identity
    scope: file
    all:
      - id: stardock-company-name
      - id: directskin-product-name
      - id: wbocx-original-filename
      - id: wbocx-progid
      - id: wbocx-description
