# seiyria bootstrap-slider — range input widget.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: license-banner
    desc: seiyria bootstrap-slider MIT banner
    if:
      type: text
      substr: 'bootstrap-slider is released under the MIT License'

  - id: bundle-basename
    desc: bootstrap-slider bundle basename
    if:
      type: basename
      exact: bootstrap-slider.js
