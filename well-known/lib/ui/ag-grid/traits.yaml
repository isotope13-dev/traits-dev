# AG Grid — widely used open-source JavaScript data grid library.
defaults:
  platforms: [windows, unix]
  for: [javascript, package.json, npm]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: ag-grid-community npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: ag-grid-community

  - id: npm-archive-name
    desc: ag-grid-community npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: ag-grid-community

  - id: ag-grid-website-url
    desc: AG Grid official website URL
    for: [javascript]
    if:
      type: text
      substr: https://www.ag-grid.com

  - id: ag-grid-css-class-prefix
    desc: AG Grid CSS class prefix
    for: [javascript]
    if:
      type: text
      substr: ag-grid-pinned-left-cells

composite_rules:
  - id: ag-grid-library
    desc: AG Grid data grid JavaScript library
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: npm-archive-name
      - id: ag-grid-website-url
      - id: ag-grid-css-class-prefix
