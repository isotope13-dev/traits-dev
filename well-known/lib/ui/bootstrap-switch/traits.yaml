# bootstrap-switch (Mattia Larentis) — turns checkboxes and radio buttons
# into Bootstrap toggle switches. Identity only: the stylesheet hides the
# native input under the switch widget, which is the component's design.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.98
  size_max: 1000000

traits:
  - id: bootstrap-switch-banner
    desc: Bootstrap Switch stylesheet banner
    if:
      type: text
      substr: 'bootstrap-switch - Turn checkboxes and radio buttons into toggle switches'

  - id: bootstrap-switch-class
    desc: Bootstrap Switch CSS class
    crit: component
    if:
      type: text
      substr: '.bootstrap-switch'

composite_rules:
  - id: bootstrap-switch-library
    desc: Bootstrap Switch UI stylesheet
    all:
      - id: bootstrap-switch-banner
      - id: bootstrap-switch-class
