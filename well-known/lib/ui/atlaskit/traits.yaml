# Atlassian Atlaskit packages from the atlassian-frontend-monorepo. Public
# @atlaskit/* names often include "-internal-" as product wording, not a
# dependency-confusion squat.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Atlaskit scoped package identity
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@atlaskit/[a-z0-9][a-z0-9._-]{0,120}$'

  - id: scoped-npm-package-identity
    desc: Atlaskit scoped npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@atlaskit/[a-z0-9][a-z0-9._-]{0,120}$'

  - id: internal-segment-package-name
    desc: Atlaskit name with internal product segment
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@atlaskit/.+-(internal|intranet|corp)-.+$'

  - id: internal-segment-npm-name
    desc: Atlaskit npm name with internal segment
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@atlaskit/.+-(internal|intranet|corp)-.+$'

  - id: internal-subpath-export-name
    desc: Atlaskit internal product subpath export
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@atlaskit/.+-(internal|intranet|corp)-[^/]+/[a-z0-9._-]+$'

  - id: bitbucket-monorepo-repository
    desc: Atlassian frontend monorepo Bitbucket repo
    for: [package.json]
    if:
      type: value
      path: repository
      regex: '(?i)bitbucket\.org/atlassian/atlassian-frontend-monorepo'

  - id: bitbucket-monorepo-repository-url
    desc: Atlassian frontend monorepo Bitbucket URL
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)bitbucket\.org/atlassian/atlassian-frontend-monorepo'

  - id: bitbucket-monorepo-npm-repository
    desc: Atlaskit npm Bitbucket monorepo repository
    for: [npm]
    if:
      type: value
      path: npm.repository
      regex: '(?i)bitbucket\.org/atlassian/atlassian-frontend-monorepo'

composite_rules:
  - id: official-monorepo-scope
    desc: Official Atlaskit scoped package
    crit: notable
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-monorepo-repository
    desc: Official Atlassian frontend monorepo repository
    crit: exception
    any:
      - id: bitbucket-monorepo-repository
      - id: bitbucket-monorepo-repository-url
      - id: bitbucket-monorepo-npm-repository

  - id: official-scope-repository-pair
    desc: Official Atlaskit monorepo package pairing
    crit: exception
    all:
      - id: official-monorepo-scope
      - id: official-monorepo-repository

  - id: atlaskit-official-internal-name-context
    desc: Official Atlaskit internal-segment product name
    crit: exception
    scope: archive
    for: [package.json, npm, tar]
    all:
      - id: internal-segment-package-name
    any:
      - id: bitbucket-monorepo-repository
      - id: bitbucket-monorepo-repository-url

  - id: atlaskit-official-internal-npm-context
    desc: Official Atlaskit internal-segment npm name
    crit: exception
    scope: archive
    for: [npm, tar]
    all:
      - id: internal-segment-npm-name
      - id: bitbucket-monorepo-npm-repository
