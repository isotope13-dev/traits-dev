# ProseMirror is an MIT-licensed toolkit for building rich-text editors.
# These rules identify its independently published model and view packages.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: view-package-name
    desc: prosemirror-view npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: prosemirror-view

  - id: model-package-name
    desc: prosemirror-model npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: prosemirror-model

  - id: view-vendored-path
    desc: Vendored prosemirror-view package path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'node_modules[\\/]prosemirror-view[\\/]'

  - id: model-vendored-path
    desc: Vendored prosemirror-model package path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'node_modules[\\/]prosemirror-model[\\/]'

composite_rules:
  - id: view-library
    desc: ProseMirror editor view library
    any:
      - id: view-package-name
      - id: view-vendored-path

  - id: model-library
    desc: ProseMirror document model library
    any:
      - id: model-package-name
      - id: model-vendored-path
