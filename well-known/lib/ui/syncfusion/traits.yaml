# Syncfusion Essential Studio / EJ2 UI component suite.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: syncfusion-package-dependency
    desc: Syncfusion EJ2 package dependency
    for: [javascript, typescript, package.json]
    if:
      type: text
      regex: '["'']@syncfusion/ej2-[a-z0-9-]+["'']'

  - id: syncfusion-website-url
    desc: Syncfusion official website URL
    for: [javascript, typescript]
    if:
      type: text
      substr: https://www.syncfusion.com

  - id: syncfusion-license-banner
    desc: Syncfusion Essential Studio license banner
    for: [javascript, typescript]
    if:
      type: text
      substr: Syncfusion Essential Studio

  - id: syncfusion-scoped-package-name
    desc: Syncfusion EJ2 scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@syncfusion\/ej2(-[a-z0-9-]+)?$'

  - id: syncfusion-scoped-archive-name
    desc: Syncfusion EJ2 scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@syncfusion\/ej2(-[a-z0-9-]+)?$'

  - id: syncfusion-author
    desc: Syncfusion author declaration
    for: [package.json]
    if:
      type: text
      substr: Syncfusion Inc.

composite_rules:
  - id: syncfusion-ui-library
    desc: Syncfusion UI component suite
    crit: notable
    conf: 0.99
    for: [javascript, typescript, package.json]
    any:
      - id: syncfusion-package-dependency
      - id: syncfusion-website-url
      - id: syncfusion-license-banner
      - id: syncfusion-scoped-package-name

  - id: syncfusion-package-context
    desc: Syncfusion EJ2 package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: syncfusion-author
    any:
      - id: syncfusion-scoped-package-name
      - id: syncfusion-scoped-archive-name
