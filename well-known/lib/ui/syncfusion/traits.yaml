# Syncfusion Essential Studio / EJ2 UI component suite.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: syncfusion-package-dependency
    desc: Syncfusion EJ2 package dependency
    if:
      type: text
      regex: '["'']@syncfusion/ej2-[a-z0-9-]+["'']'

  - id: syncfusion-website-url
    desc: Syncfusion official website URL
    for: [javascript, typescript]
    if:
      type: text
      substr: https://www.syncfusion.com

  - id: syncfusion-license-banner
    desc: Syncfusion Essential Studio license banner
    for: [javascript, typescript]
    if:
      type: text
      substr: Syncfusion Essential Studio

composite_rules:
  - id: syncfusion-ui-library
    desc: Syncfusion UI component suite
    crit: notable
    conf: 0.99
    any:
      - id: syncfusion-package-dependency
      - id: syncfusion-website-url
      - id: syncfusion-license-banner
