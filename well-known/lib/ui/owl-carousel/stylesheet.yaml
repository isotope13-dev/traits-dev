# Owl Carousel's core stylesheet banner followed by its root selector.
# Requiring the declaration block avoids identifying a prose mention alone.
# This identifies an asset, not the behavior of any page that includes it.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.98

traits:
  - id: owl-carousel-core-stylesheet
    desc: Owl Carousel core stylesheet attribution
    if:
      type: text
      regex: 'Owl Carousel( CSS File| - Core)\s*\*/\s*\.owl-carousel\s*\{'
