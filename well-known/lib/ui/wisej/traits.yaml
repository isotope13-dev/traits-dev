# Wisej.NET (Ice Tea Group LLC) is a commercial .NET framework for building
# web applications with a WinForms-style designer. Its design-time assemblies
# render control artwork pixel by pixel and drive the Visual Studio designer
# through reflection -- the same pair the bitmap-steganography rules look for
# in a payload extractor.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  size_min: 512
  size_max: 524288000

traits:
  - id: wisej-company-versioninfo
    desc: Ice Tea Group CompanyName version info
    if:
      type: value
      path: pe.version.company
      exact: Ice Tea Group

  - id: wisej-copyright-versioninfo
    desc: Ice Tea Group LLC copyright version info
    if:
      type: value
      path: pe.version.copyright
      substr: Ice Tea Group LLC

composite_rules:
  - id: wisej-binary
    desc: Wisej.NET framework assembly
    conf: 0.98
    all:
      - id: wisej-company-versioninfo
      - id: wisej-copyright-versioninfo
