# PrismJS — lightweight syntax highlighter (prismjs.com).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: prismjs-package-name
    desc: prismjs npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: prismjs

  - id: prism-core-banner
    desc: Prism core source section banner
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: Begin prism-core.js
      offset_range: [0, 512]

  - id: prismjs-node-modules-path
    desc: prismjs package path under node_modules
    conf: 0.95
    if:
      type: path
      regex: '(?i)node_modules[/\\]prismjs([/\\]|$)'

composite_rules:
  - id: prismjs-highlighter
    desc: PrismJS syntax highlighter library
    crit: notable
    conf: 0.98
    any:
      - id: prismjs-package-name
      - id: prism-core-banner
      - id: prismjs-node-modules-path
