# Makepad is an open-source cross-platform UI framework and IDE for Rust (Rik Arends).
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: makepad-source-tree-path
    desc: Makepad source tree path
    conf: 0.99
    for: [source, scripts, manifests, documents, data, binaries]
    size_min: 1
    size_max: 300000000
    if:
      type: path
      regex: '(^|[\\/])makepad-[A-Za-z0-9_.-]+[\\/]'

  - id: makepad-gbelt-comlog-source
    desc: Makepad G-Belt COM logger test utility source
    conf: 0.99
    for: [c, cpp]
    platforms: [windows]
    size_min: 100
    size_max: 100000
    if:
      type: text
      substr: 'Starts Sim Commander with an IAT WriteFile hook'

  - id: makepad-repository-readme
    desc: Makepad framework README
    conf: 0.99
    for: [documents, text]
    size_min: 100
    size_max: 100000
    if:
      type: text
      substr: 'Makepad is an AI-accelerated application and game development environment'

  - id: makepad-crate-reference
    desc: References Makepad framework crate
    conf: 0.95
    for: [rust, cargo.toml]
    if:
      type: text
      regex: '\bmakepad_(widgets|platform|draw|derive_widget)\b'

composite_rules:
  - id: makepad-framework-source
    desc: Makepad UI framework source tree or utility
    crit: notable
    conf: 0.99
    any:
      - id: makepad-source-tree-path
      - id: makepad-gbelt-comlog-source
      - id: makepad-repository-readme
      - id: makepad-crate-reference
