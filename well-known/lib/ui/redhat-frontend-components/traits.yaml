# Identity remains neutral across clean and compromised releases.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: utilities-package-name
    desc: Red Hat frontend component utilities package
    if:
      type: value
      path: name
      exact: '@redhat-cloud-services/frontend-components-utilities'
