# @rfdtech/components — shared React UI kit (Clet/GSL) with optional rfdui MCP
# postinstall that wires Claude/Cursor/Codex/OpenCode; skippable via RFDUI_SKIP_SETUP.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: rfdtech components scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@rfdtech/components"

  - id: npm-package-name
    desc: rfdtech components npm archive identity
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: "@rfdtech/components"

  - id: rfdui-cli-bin
    desc: rfdui MCP setup CLI bin entry
    for: [package.json]
    if:
      type: value
      path: bin.rfdui
      exact: dist/mcp/cli.js

  - id: mcp-server-name
    desc: rfdtech-ui MCP server registry name
    for: [javascript, typescript]
    if:
      type: text
      substr: '"rfdtech-ui"'

  - id: postinstall-autosetup-marker
    desc: rfdui postinstall auto-setup skip env gate
    for: [javascript, typescript]
    if:
      type: text
      substr: RFDUI_SKIP_SETUP

  - id: next-router-adapter-marker
    desc: rfdtech Next.js router adapter entrypoint
    for: [javascript, typescript]
    if:
      type: text
      substr: "@rfdtech/components/next"

composite_rules:
  - id: official-package-identity
    desc: Official rfdtech components package identity
    crit: exception
    any:
      - id: package-name
      - id: npm-package-name

  - id: archive-context
    desc: rfdtech components UI library with rfdui MCP autosetup
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: official-package-identity
    any:
      - id: rfdui-cli-bin
      - id: mcp-server-name
      - id: postinstall-autosetup-marker
