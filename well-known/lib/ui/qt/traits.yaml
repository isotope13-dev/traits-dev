defaults:
  size_max: 20000000
  platforms: [windows, unix]
  for: [pe, dll, macho, dylib, elf, so]
  crit: baseline
  conf: 0.95

traits:
  - id: qt-framework-bundle-id-core
    desc: 'Qt framework bundle ID'
    if:
      type: text
      regex: 'org\.qt-project\.Qt(Core|Gui|Network|PrintSupport)'
      section: .text
  - id: qt-framework-bundle-id-extra
    desc: "Qt framework bundle ID (Svg/Widgets/Xml)"
    if:
      type: text
      regex: 'org\.qt-project\.Qt(Svg|Widgets|Xml)'
      section: .text
  - id: qt-qmake-generator
    desc: Qt/QMake generator string
    if:
      type: text
      substr: "Created by Qt/QMake"
      section: .text
  - id: qt-qpa-plugin-interface-metadata
    desc: Qt QPA plugin interface metadata
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .rdata
      regex: 'org\.qt-project\.Qt\.QPA\.QPlatformIntegrationFactoryInterface\.[0-9]+\.[0-9]+'

  - id: qt-windows-platform-plugin-name-reference
    desc: Qt Windows platform plugin name reference
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      section: .rdata
      exact: qwindows.dll
      case_insensitive: true

  - id: qt-platform-plugin-original-filename
    desc: Qt platform plugin OriginalFilename metadata
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^q(windows|windowsvistastyle|direct2d)\.dll$'
