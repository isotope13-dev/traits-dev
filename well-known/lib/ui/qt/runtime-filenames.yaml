defaults:
  for: [pe, dll, macho, dylib, elf, so]
  crit: notable
  conf: 0.95
  platforms:
  - windows
  - unix
traits:
- size_max: 20000000
  id: qt5-gui-binary
  desc: Filename matches qt5 gui runtime
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Gui(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 20000000
  id: qt5-network-binary
  desc: Filename matches qt5 network runtime
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Network(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 20000000
  id: qt5-widgets-binary
  desc: Filename matches qt5 widgets runtime
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Widgets(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 20000000
  id: qt6-runtime-binary
  desc: Filename matches qt6 runtime runtime
  if:
    type: path
    basename: true
    regex: (?i)^Qt6[A-Za-z0-9]+\.dll$
