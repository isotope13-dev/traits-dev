defaults:
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.95
traits:
- size_max: 20000000
  id: qt5-core-binary
  desc: Filename matches Qt5 Core runtime
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Core(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 1073741824
  id: qt-webengine-core-binary
  desc: Filename matches Qt WebEngine core runtime
  if:
    type: path
    basename: true
    regex: (?i)^(lib)?Qt[0-9]+WebEngineCore[.](so.*|dll|dylib)$
