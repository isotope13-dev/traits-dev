# CanvasXpress — standalone data visualization and charting library for JavaScript, R, and Python.
# Commercial license verification and watermark rendering routine is protected with JavaScript Obfuscator.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  crit: notable
  conf: 0.98

traits:
  - id: canvasxpress-package-name
    desc: CanvasXpress npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: canvasxpress

  - id: canvasxpress-npm-archive-name
    desc: CanvasXpress npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: canvasxpress

  - id: canvasxpress-author
    desc: CanvasXpress author declaration
    for: [package.json]
    if:
      type: text
      substr: Isaac M. Neuhaus

  - id: canvasxpress-website-url
    desc: CanvasXpress official website URL
    for: [javascript, typescript]
    if:
      type: text
      substr: https://www.canvasxpress.org

  - id: canvasxpress-license-banner
    desc: CanvasXpress license banner
    for: [javascript, typescript]
    if:
      type: text
      regex: 'CanvasXpress [0-9.]+ - JavaScript Canvas Library'

  - id: canvasxpress-license-email
    desc: CanvasXpress license contact email
    for: [javascript, typescript]
    if:
      type: text
      substr: license@canvasxpress.org

  - id: canvasxpress-commercial-license-notice
    desc: CanvasXpress commercial license notice
    for: [javascript, typescript]
    if:
      type: text
      substr: A commercial license removes the attribution mark

  - id: canvasxpress-umd-export
    desc: CanvasXpress UMD namespace export
    for: [javascript, typescript]
    if:
      type: text
      substr: b.CanvasXpress=b.CanvasXpress||{}

composite_rules:
  - id: canvasxpress-ui-library
    desc: CanvasXpress data visualization and charting library
    crit: notable
    conf: 0.99
    for: [javascript, typescript, package.json]
    any:
      - id: canvasxpress-license-banner
      - id: canvasxpress-package-name
      - id: canvasxpress-umd-export

  - id: canvasxpress-package-context
    desc: CanvasXpress package context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: canvasxpress-author
    any:
      - id: canvasxpress-package-name
      - id: canvasxpress-npm-archive-name

  - id: canvasxpress-bundle-context
    desc: CanvasXpress standalone bundle context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: canvasxpress-website-url
      - id: canvasxpress-commercial-license-notice
    any:
      - id: canvasxpress-license-banner
      - id: canvasxpress-license-email
      - id: canvasxpress-umd-export
