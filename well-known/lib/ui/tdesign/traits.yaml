# Tencent TDesign enterprise design system component library.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: tdesign-package-name
    desc: Tencent TDesign component library package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^(@tencent/)?tdesign-[a-z0-9_-]+$'

  - id: tdesign-npm-name
    desc: Tencent TDesign npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^(@tencent/)?tdesign-[a-z0-9_-]+$'

  - id: tdesign-github-repository
    desc: Tencent TDesign GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^(git\+)?https?://github\.com/Tencent/tdesign-[a-z0-9_-]+(\.git)?([/#]|$)'

  - id: tdesign-github-repository-npm
    desc: Tencent TDesign npm archive repository URL
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)^(git\+)?https?://github\.com/Tencent/tdesign-[a-z0-9_-]+(\.git)?([/#]|$)'

composite_rules:
  - id: tdesign-upstream
    desc: Tencent TDesign repository claim
    crit: notable
    any:
      - id: tdesign-github-repository
      - id: tdesign-github-repository-npm

  - id: package-identity
    desc: Tencent TDesign component library package
    crit: notable
    scope: archive
    for: [npm, tar, zip, package.json]
    all:
      - id: tdesign-upstream
    any:
      - id: tdesign-package-name
      - id: tdesign-npm-name
