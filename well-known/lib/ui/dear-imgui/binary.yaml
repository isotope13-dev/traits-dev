# Dear ImGui library detection
# Dear ImGui is an immediate-mode GUI library used by ordinary applications,
# game overlays, and developer tools.  Its presence is a library identity, not
# evidence of abuse; objective rules must supply any intent inference.
defaults:
  for: [pe, dll, so]
  platforms: [windows, android]
  crit: component
  conf: 0.95
  # Compiled GUI implementation, rather than a tiny banner-only carrier.
  size_min: 1024
traits:
  - id: dear-imgui-version-string
    crit: notable
    desc: Dear ImGui version string
    if:
      type: text
      # Compiled library strings reside in read-only constant data.
      section: .rdata
      regex: "Dear ImGui [0-9]+\\.[0-9]+\\.[0-9]+"

  - id: imgui-impl-win32
    crit: notable
    desc: ImGui Win32 backend implementation
    if:
      type: text
      # Compiled library strings reside in read-only constant data.
      section: .rdata
      word: "imgui_impl_win32"

  - id: imgui-impl-dx11
    crit: notable
    desc: ImGui DirectX 11 backend implementation
    if:
      type: text
      # Compiled library strings reside in read-only constant data.
      section: .rdata
      word: "imgui_impl_dx11"

  - id: imgui-impl-opengl3
    crit: notable
    desc: ImGui OpenGL3 backend implementation
    if:
      type: text
      # Compiled library strings reside in read-only constant data.
      section: .rdata
      word: "imgui_impl_opengl3"

  - id: imgui-error-marker
    crit: notable
    desc: ImGui error message format string
    if:
      type: text
      # Compiled library strings reside in read-only constant data.
      section: .rdata
      substr: "[imgui-error]"

  - id: imgui-ocornut-url
    crit: notable
    desc: Dear ImGui GitHub FAQ URL reference
    if:
      type: text
      # Compiled library strings reside in read-only constant data.
      section: .rdata
      substr: "github.com/ocornut/imgui"

composite_rules:
  - id: dear-imgui-library
    desc: Dear ImGui immediate-mode GUI library
    crit: notable
    conf: 0.95
    all:
      - id: dear-imgui-version-string
    any:
      - id: micro-behaviors/fs/path/config/app::imgui-ini-config
      - id: imgui-impl-win32
      - id: imgui-impl-dx11
      - id: imgui-impl-opengl3
      - id: imgui-error-marker
      - id: micro-behaviors/fs/path/log/application::imgui-log-file
      - id: imgui-ocornut-url
    needs: 1

  # GUI-runtime context for callers assessing input polling or hooks.
  # This group is only consulted as an exception/downgrade condition.
  - id: imgui-interface-context
    desc: Dear ImGui interface or application-support context
    crit: exception
    conf: 0.9
    any:
      - id: well-known/lib/ui/dear-imgui::dear-imgui-version-string
      - id: micro-behaviors/fs/path/config/app::imgui-ini-config
      - id: micro-behaviors/fs/path/log/application::imgui-log-file
      - id: well-known/lib/ui/dear-imgui::imgui-impl-win32
      - id: well-known/lib/ui/dear-imgui::imgui-impl-dx11
      - id: well-known/lib/ui/dear-imgui::imgui-impl-opengl3
      - id: well-known/lib/ui/dear-imgui::imgui-error-marker
      - id: well-known/lib/ui/dear-imgui::imgui-ocornut-url
