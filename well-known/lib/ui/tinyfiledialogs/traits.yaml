# Identity markers for tinyfiledialogs (tinyfd), a lightweight C/C++ cross-platform
# dialog library (open/save file dialogs, input boxes, message boxes).
# On macOS and Linux, tinyfiledialogs invokes osascript, zenity, or kdialog via
# popen() to pop up native GUI dialogs without requiring a heavy GUI framework dependency.
# In native libraries (such as Open3D and game/visualization engines), its presence
# is the benign explanation for a popen import.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  size_min: 1024
  size_max: 500000000

traits:
  - id: query-mode-marker-macho
    desc: Mach-O tinyfiledialogs query mode string
    for: [macho]
    if:
      type: text
      exact: tinyfd_query
      section: __cstring

  - id: query-mode-marker-elf
    desc: ELF tinyfiledialogs query mode string
    for: [elf]
    if:
      type: text
      exact: tinyfd_query
      section: .rodata

  - id: query-mode-marker-pe
    desc: PE tinyfiledialogs query mode string
    for: [pe, dll]
    if:
      type: text
      exact: tinyfd_query
      section: .rdata

  - id: script-temp-file-macho
    desc: Mach-O tinyfiledialogs script temp file
    for: [macho]
    if:
      type: text
      exact: "/tmp/tinyfd.txt"
      section: __cstring

  - id: script-temp-file-elf
    desc: ELF tinyfiledialogs script temp file
    for: [elf]
    if:
      type: text
      exact: "/tmp/tinyfd.txt"
      section: .rodata

  - id: symbol-prefix
    desc: tinyfiledialogs C API symbol
    for: [elf, macho, dylib, so, dll, pe]
    if:
      type: symbol
      regex: '^tinyfd_'

composite_rules:
  - id: tinyfiledialogs-library-context
    desc: Recognized tinyfiledialogs library context
    crit: notable
    conf: 0.98
    any:
      - id: query-mode-marker-macho
      - id: query-mode-marker-elf
      - id: query-mode-marker-pe
      - id: script-temp-file-macho
      - id: script-temp-file-elf
      - id: symbol-prefix
