# Chroma — Go syntax-highlighting library and its generated XML lexers.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
  for: [binaries, xml]
  size_min: 1
  size_max: 1073741824

traits:
  - id: chroma-go-module-elf
    desc: Chroma Go module in ELF
    for: [elf]
    if:
      type: value
      path: elf.go.deps[*].path
      exact: github.com/alecthomas/chroma/v2

  - id: chroma-go-module-macho
    desc: Chroma Go module in Mach-O
    for: [macho]
    if:
      type: value
      path: macho.go.deps[*].path
      exact: github.com/alecthomas/chroma/v2

  - id: chroma-embedded-lexer-path
    desc: Chroma embedded lexer resource path
    for: [binaries]
    if:
      type: text
      substr: embedded/cassandra_cql.xml

  - id: chroma-lexer-config-schema
    desc: XML lexer name and alias schema
    crit: component
    for: [xml]
    if:
      type: text
      regex: '<lexer>\s*<config>\s*<name>[^<]{1,80}</name>\s*<alias>[^<]{1,80}</alias>'

  - id: chroma-lexer-rule-schema
    desc: XML lexer root rule schema
    crit: component
    for: [xml]
    if:
      type: text
      regex: '<rules>\s*<state\s+name="root">\s*<rule\s+pattern='

composite_rules:
  - id: chroma-embedded-lexer-source
    desc: Chroma embedded lexer XML definition
    for: [xml]
    all:
      - id: chroma-lexer-config-schema
      - id: chroma-lexer-rule-schema
