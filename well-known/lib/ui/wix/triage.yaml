traits:
- id: wix-thunderbolt-component-loader-api
  desc: References Wix Thunderbolt loader API
  conf: 0.99
  if:
    type: text
    substr: ensureComponentLoadersAreCreated
- id: wix-thunderbolt-registry-export-bundle
  desc: Lists Wix Thunderbolt registry export names
  conf: 0.98
  if:
    type: text
    regex: siteAssetsRegistry[\s\S]{0,240}corvidRegistry
- id: wix-corvid-registry-export-name
  desc: References Wix corvidRegistry module name
  conf: 0.95
  if:
    type: text
    word: corvidRegistry
- id: wix-site-assets-registry-export-name
  desc: References Wix siteAssetsRegistry module name
  conf: 0.95
  if:
    type: text
    word: siteAssetsRegistry
composite_rules:
- id: wix-thunderbolt-registry-api-surface
  desc: References Wix Thunderbolt registry API surface
  conf: 0.97
  all:
  - id: well-known/lib/ui/wix::wix-thunderbolt-component-loader-api
  - id: well-known/lib/ui/wix::wix-corvid-registry-export-name
  - id: well-known/lib/ui/wix::wix-site-assets-registry-export-name
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
