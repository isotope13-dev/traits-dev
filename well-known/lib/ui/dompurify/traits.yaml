defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  size_max: 209715200

traits:
  - id: library-marker
    desc: DOMPurify sanitization library
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
    if:
      type: text
      substr: DOMPurify
