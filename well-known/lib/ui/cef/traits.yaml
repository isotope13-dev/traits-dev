defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho]
  size_min: 10485760
  crit: notable
  conf: 0.99
traits:
- id: cef-initialize-export
  desc: Exports CEF initialization API
  if:
    type: symbol
    kind: export
    exact: cef_initialize
- id: cef-shutdown-export
  desc: Exports CEF shutdown API
  if:
    type: symbol
    kind: export
    exact: cef_shutdown
- id: cef-execute-process-export
  desc: Exports CEF subprocess execution API
  if:
    type: symbol
    kind: export
    exact: cef_execute_process
- id: cef-browser-host-create-browser-export
  desc: Exports CEF browser-host creation API
  if:
    type: symbol
    kind: export
    exact: cef_browser_host_create_browser
composite_rules:
- id: cef-browser-engine
  desc: Chromium Embedded Framework browser engine
  all:
  - id: cef-initialize-export
  - id: cef-shutdown-export
  - id: cef-execute-process-export
  - id: cef-browser-host-create-browser-export
