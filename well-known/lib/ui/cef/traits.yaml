defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho]
  size_min: 10485760
  crit: notable
  conf: 0.99
traits:
- id: cef-initialize-export
  desc: Exports CEF initialization API
  if:
    type: symbol
    kind: export
    exact: cef_initialize
- id: cef-shutdown-export
  desc: Exports CEF shutdown API
  if:
    type: symbol
    kind: export
    exact: cef_shutdown
- id: cef-execute-process-export
  desc: Exports CEF subprocess execution API
  if:
    type: symbol
    kind: export
    exact: cef_execute_process
- id: cef-browser-host-create-browser-export
  desc: Exports CEF browser-host creation API
  if:
    type: symbol
    kind: export
    exact: cef_browser_host_create_browser
- id: cef-bootstrap-product-name
  desc: PE names the CEF bootstrap application
  size_min: 512
  if:
    type: value
    path: pe.version.product_name
    exact: CEF Bootstrap Application
composite_rules:
- id: cef-browser-engine
  desc: Chromium Embedded Framework browser engine
  all:
  - id: cef-initialize-export
  - id: cef-shutdown-export
  - id: cef-execute-process-export
  - id: cef-browser-host-create-browser-export
# The CEF binaries a host links against: the engine DLL, and the sample
# bootstrap launcher that imports chrome_elf. Both are stock Chromium builds,
# which allocate RWX for V8, resolve APIs dynamically, check for debuggers,
# unmap and rewrite process sections for the sandbox and crash handler, and
# load resources. None of those is a loader stage; recognised once here so the
# loader and hollowing composites can carve it out with a single reference.
- id: cef-bootstrap-binary
  desc: CEF bootstrap application linked to chrome_elf
  for: [pe, dll]
  size_min: 512
  all:
  - id: cef-bootstrap-product-name
  - id: well-known/tool/browser::chrome-elf-link
- id: cef-runtime-binary-context
  desc: Chromium Embedded Framework runtime binary
  crit: exception
  size_min: 512
  any:
  - id: cef-browser-engine
  - id: cef-bootstrap-binary
