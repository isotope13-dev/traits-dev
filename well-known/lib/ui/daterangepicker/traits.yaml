# Date Range Picker (Dan Grossman) — Bootstrap date-range picker component.
# The Bootstrap 3 stylesheet ships under daterangepicker-bs3.css with this
# banner; identity only, the rules below it are ordinary calendar layout.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.99
  size_max: 1000000

traits:
  - id: daterangepicker-bootstrap3-banner
    desc: Date Range Picker Bootstrap stylesheet banner
    if:
      type: text
      substr: 'Stylesheet for the Date Range Picker, for use with Bootstrap'
