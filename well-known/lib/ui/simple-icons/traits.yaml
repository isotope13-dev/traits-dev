# Simple Icons — SVG icons for popular brands (simpleicons.org).
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, javascript, typescript, json, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: simple-icons npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: simple-icons

  - id: repository-url
    desc: simple-icons repository URL
    for: [package.json, text, markdown]
    if:
      type: text
      substr: github.com/simple-icons/simple-icons

  - id: svg-icon-collection
    desc: simple-icons icon collection
    for: [javascript, typescript, json]
    count_min: 50
    if:
      type: text
      regex: '["'']title["'']\s*:'

composite_rules:
  - id: simple-icons-package-context
    desc: simple-icons brand library context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: repository-url
      - id: svg-icon-collection
