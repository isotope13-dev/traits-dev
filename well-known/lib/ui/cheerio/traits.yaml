# Cheerio — server-side HTML parser implementing a jQuery subset.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: cheerio-bundle-file
    desc: Cheerio JavaScript bundle file
    for: [javascript]
    if:
      type: path
      regex: '(^|[\\/])(node_modules[\\/])?cheerio\.js$'

  - id: package-name
    desc: cheerio npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: cheerio

  - id: vendored-path
    desc: vendored cheerio npm package path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'node_modules/cheerio/'

composite_rules:
  - id: cheerio-html-library
    desc: cheerio server-side jQuery library
    any:
      - id: cheerio-bundle-file
      - id: package-name
      - id: vendored-path
