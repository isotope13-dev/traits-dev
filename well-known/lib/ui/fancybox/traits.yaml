# fancyBox — jQuery lightbox plugin.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: version-banner
    desc: fancyBox version comment banner
    if:
      type: text
      regex: 'fancyBox v\d+\.\d+'
  - id: vendored-path
    desc: vendored fancyBox script path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'jquery\.fancybox'

composite_rules:
  - id: fancybox-library
    desc: fancyBox jQuery lightbox plugin
    any:
      - id: version-banner
      - id: vendored-path
