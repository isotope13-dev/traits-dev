# Mermaid — diagramming library (mermaid.js.org / @mermaid-js).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 15000000

traits:
  - id: mermaid-package-name
    desc: mermaid npm package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: mermaid

  - id: mermaid-layout-elk-package-name
    desc: Mermaid ELK layout scoped package name
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: name
      exact: '@mermaid-js/layout-elk'

  - id: mermaid-official-repository
    desc: Mermaid monorepo GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/mermaid-js/mermaid(\.git)?$'

  - id: mermaid-layout-elk-npm-name
    desc: Mermaid ELK layout npm archive identity
    for: [npm, tar]
    conf: 0.99
    if:
      type: value
      path: npm.name
      exact: '@mermaid-js/layout-elk'

  - id: mermaid-official-npm-repository
    desc: Mermaid monorepo npm archive repository
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      regex: '^https://github\.com/mermaid-js/mermaid(\.git)?$'

  - id: mermaid-esbuild-bundle-marker
    desc: mermaid esbuild ESM bundle namespace marker
    for: [javascript]
    conf: 0.98
    if:
      type: text
      substr: __esbuild_esm_mermaid
      offset_range: [0, 512]

  - id: mermaid-node-modules-path
    desc: mermaid package path under node_modules
    conf: 0.95
    if:
      type: path
      regex: '(?i)node_modules[/\\]mermaid([/\\]|$)'

  - id: mermaid-style-definition-data
    desc: Mermaid style-definition parser token
    for: [javascript, typescript]
    conf: 0.98
    if:
      type: text
      substr: STYLE_DEFINITION_DATA

  - id: mermaid-node-statement-rule
    desc: Mermaid nodeStatement parse-rule debug
    for: [javascript, typescript]
    conf: 0.97
    if:
      type: text
      substr: 'Rule: nodeStatement (node)'

composite_rules:
  - id: mermaid-diagram-library
    desc: Mermaid diagramming library bundle
    crit: notable
    conf: 0.98
    any:
      - id: mermaid-package-name
      - id: mermaid-layout-elk-package-name
      - id: mermaid-esbuild-bundle-marker
      - id: mermaid-node-modules-path
      - id: mermaid-style-definition-data
      - id: mermaid-node-statement-rule

  - id: official-package-scope
    desc: Official Mermaid scoped package identity
    crit: exception
    any:
      - id: mermaid-layout-elk-package-name
      - id: mermaid-layout-elk-npm-name

  - id: official-package-repo
    desc: Official Mermaid monorepo repository
    crit: exception
    any:
      - id: mermaid-official-repository
      - id: mermaid-official-npm-repository

  - id: official-scope-repository-pair
    desc: Official Mermaid scoped package repository pair
    crit: exception
    conf: 0.99
    all:
      - id: official-package-scope
      - id: official-package-repo
