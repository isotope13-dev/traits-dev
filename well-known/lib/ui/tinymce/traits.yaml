defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  size_max: 209715200

traits:
  - id: plugin-manager
    desc: TinyMCE plugin manager bundle
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: tinymce.PluginManager
  - id: asset-path
    desc: TinyMCE asset path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])tinymce([\\/]|$)'

composite_rules:
  - id: library
    desc: TinyMCE JavaScript library
    crit: notable
    conf: 0.97
    any:
      - id: plugin-manager
      - id: asset-path
