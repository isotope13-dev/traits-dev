# ionaru/easy-markdown-editor — EasyMDE Markdown editor.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: version-banner
    desc: EasyMDE version header comment
    if:
      type: text
      substr: 'easymde v'

  - id: umd-global-assign
    desc: EasyMDE UMD global assignment
    if:
      type: text
      substr: ').EasyMDE=e()'

  - id: github-repo
    desc: EasyMDE GitHub repository URL
    if:
      type: text
      substr: github.com/ionaru/easy-markdown-editor

  - id: min-bundle-path
    desc: EasyMDE minified bundle path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'easymde\.min\.js'

  - id: unicode-layer-path
    desc: EasyMDE unicode-escape layer path
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'easymde\.min\.js##unicode-escape@'

composite_rules:
  - id: easymde-library
    desc: EasyMDE Markdown editor library
    needs: 2
    any:
      - id: version-banner
      - id: umd-global-assign
      - id: github-repo
      - id: min-bundle-path
      - id: unicode-layer-path
