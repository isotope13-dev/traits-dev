# tqdm -- the Python progress-bar library. An import names it outright.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99
traits:
  - id: tqdm-progress-import
    desc: tqdm progress library import
    if:
      type: text
      regex: '(from tqdm[. ]|import tqdm[. \n])'
