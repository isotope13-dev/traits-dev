# @consta/uikit — Consta design system React component library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, zip, archives, npm]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 50000000

traits:
  - id: package-name
    desc: "@consta/uikit npm package name"
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@consta/uikit"

  - id: consta-homepage
    desc: Consta UI kit homepage URL
    if:
      type: text
      substr: uikit.consta.design

  - id: gazprom-design-system-keyword
    desc: Gazprom Neft design system keyword
    if:
      type: text
      substr: gazprom-neft-design-system

composite_rules:
  - id: consta-uikit-context
    desc: Official Consta design system UI kit
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: consta-homepage
      - id: gazprom-design-system-keyword
