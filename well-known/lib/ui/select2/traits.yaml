# Select2 — jQuery-based replacement for select boxes (Igor Vaynberg).
# Identity only: the library's ajax transport uses a caller-supplied URL, so
# presence of this plugin establishes no endpoint or data flow by itself.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98

traits:
  - id: window-select2-export
    desc: Select2 window global export
    if:
      type: text
      regex: 'window\.Select2\s*='
  - id: jquery-select2-plugin
    desc: Select2 jQuery plugin namespace
    if:
      type: text
      substr: $.fn.select2
  # The distribution also ships pure-CSS themes (e.g. select2-bootstrap.css)
  # whose only content is rules keyed to the widget's generated classes. A
  # selector trait alone would also match a page overriding those classes,
  # so it stays an atom; the composite below claims the shipped stylesheet.
  - id: select2-css-selector
    desc: Select2 widget CSS class selector
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '\.select2-(container|choice|choices|drop)\b'
  - id: select2-bootstrap-form-selector
    desc: Select2 Bootstrap form-control selector
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '\.form-control[ .][^\n{]{0,40}\.select2-'
  - id: default-single-select-css-rule
    desc: Select2 default single-select CSS rule
    crit: component
    for: [text]
    if:
      type: text
      regex: '\.select2-container--default\s+\.select2-selection--single\s*\{'
  - id: classic-single-select-css-rule
    desc: Select2 classic single-select CSS rule
    crit: component
    for: [text]
    if:
      type: text
      regex: '\.select2-container--classic\s+\.select2-selection--single\s*\{'
  - id: hidden-accessible-css-rule
    desc: Select2 accessibility helper CSS rule
    crit: component
    for: [text]
    if:
      type: text
      regex: '\.select2-hidden-accessible\s*\{'

composite_rules:
  # The library itself both registers the jQuery plugin namespace and defines
  # the window global; a page that merely calls $(...).select2() has neither.
  - id: select2-library
    desc: Select2 jQuery select-box library
    crit: notable
    conf: 0.98
    all:
      - id: window-select2-export
      - id: jquery-select2-plugin
  - id: select2-bootstrap-stylesheet
    desc: Select2 Bootstrap theme stylesheet
    crit: notable
    conf: 0.97
    for: [text]
    all:
      - id: select2-css-selector
      - id: select2-bootstrap-form-selector
  # The core distribution defines both built-in skins and the accessibility
  # helper. Require CSS rule definitions, rather than a filename or a page's
  # reference to the plugin. Identity does not suppress any other findings.
  - id: select2-core-stylesheet
    desc: Select2 default and classic stylesheet
    crit: notable
    conf: 0.97
    for: [text]
    all:
      - id: default-single-select-css-rule
      - id: classic-single-select-css-rule
      - id: hidden-accessible-css-rule
