# dumdom — Christian Johansen ClojureScript virtual-DOM library.
# Bundled Google Closure (goog/base.js) and Figwheel/devtools JS are
# CLJS compile output, not a dropper. Identity only.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: core-namespace
    desc: dumdom.core namespace declaration
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(ns dumdom.core'

  - id: core-namespace-path
    desc: dumdom core namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)dumdom[\\/]core\.clj$'

  - id: kondo-export-path
    desc: cjohansen dumdom clj-kondo export path
    conf: 0.99
    if:
      type: path
      regex: '(?i)cjohansen[\\/]dumdom[\\/]config\.edn'

  - id: defcomponent-hook
    desc: dumdom.core defcomponent analyzer hook
    for: [clojure, text]
    conf: 0.97
    if:
      type: text
      substr: dumdom.core/defcomponent

composite_rules:
  - id: dumdom-library
    desc: cjohansen dumdom ClojureScript library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: core-namespace
      - id: core-namespace-path
      - id: kondo-export-path
      - id: defcomponent-hook
    needs: 2
