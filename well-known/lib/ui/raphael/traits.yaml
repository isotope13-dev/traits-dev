# Raphaël (Dmitry Baranovskiy) — JavaScript vector-graphics library
# (SVG/VML). The minified build legitimately uses ActiveX/VML fallbacks,
# DOM mutation and user-agent reads for legacy IE support; identity only.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98
  size_max: 5000000

traits:
  - id: raphael-version-banner
    desc: Raphaël vector library version banner
    if:
      type: text
      regex: 'Raphaël\s+[0-9]+\.[0-9]+(\.[0-9]+)?\s+-\s+JavaScript Vector Library'

  - id: raphael-homepage
    desc: Raphaël library homepage reference
    crit: component
    if:
      type: text
      substr: raphaeljs.com

composite_rules:
  - id: raphael-library
    desc: Raphaël JavaScript vector library
    all:
      - id: raphael-version-banner
      - id: raphael-homepage
