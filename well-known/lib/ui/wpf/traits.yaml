# .NET WPF (Windows Presentation Foundation) framework markers.
# Present in any managed PE that links the WPF GUI assemblies.
defaults:
  size_max: 20000000
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.9

traits:
- id: wpf-namespace-ref
  crit: notable
  desc: .NET WPF type namespace reference
  if:
    type: text
    section: .text
    # Require a WPF child namespace. A bare System.Windows prefix also matches
    # System.Windows.Forms, which is WinForms and must not suppress RAT traits.
    regex: 'System\.Windows\.(Application|Window|Controls|Media)\b'

- id: wpf-assembly-ref
  crit: notable
  desc: .NET WPF assembly reference
  if:
    type: text
    section: .text
    regex: '\b(WindowsBase|PresentationCore|PresentationFramework)\b'

- id: wpf-window-method-names--mainwindow
  crit: notable
  desc: .NET WPF window method names (MainWindow)
  if:
    type: text
    section: .text
    word: MainWindow
- id: wpf-window-method-names--wigglewindow
  crit: notable
  desc: .NET WPF window method names (WiggleWindow)
  if:
    type: text
    section: .text
    word: WiggleWindow
- id: wpf-window-method-names--minimizewindow
  crit: notable
  desc: .NET WPF window method names (MinimizeWindow)
  if:
    type: text
    section: .text
    word: MinimizeWindow
- id: wpf-window-method-names--dragwindow
  crit: notable
  desc: .NET WPF window method names (DragWindow)
  if:
    type: text
    section: .text
    word: DragWindow
composite_rules:
- id: wpf-framework-reference
  desc: .NET WPF framework reference
  crit: notable
  any:
  - id: wpf-namespace-ref
  - id: wpf-assembly-ref
- id: wpf-window-method-names
  desc: .NET WPF window method names
  any:
  - id: wpf-window-method-names--mainwindow
  - id: wpf-window-method-names--wigglewindow
  - id: wpf-window-method-names--minimizewindow
  - id: wpf-window-method-names--dragwindow
