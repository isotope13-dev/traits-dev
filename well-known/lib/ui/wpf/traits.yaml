# A binary WPF fingerprint requires a UI/helper name and a framework reference
# in .text. Bare names establish neither WPF identity nor method invocation.
defaults:
  platforms:
  - windows
  for:
  - pe
  size_max: 20000000
  crit: notable
  conf: 0.9
traits:
- id: wpf-ui-name--mainwindow
  crit: notable
  desc: WPF reference with MainWindow name
  if:
    type: yara
    source: |-
      import "pe"
      rule wpf_reference_MainWindow {
        strings:
          $name = /\bMainWindow\b/ ascii wide
          $framework = "PresentationFramework" ascii wide fullword
          $core = "PresentationCore" ascii wide fullword
          $base = "WindowsBase" ascii wide fullword
          $namespace = /System\.Windows\.(Application|Window|Controls|Media)\b/ ascii wide
        condition:
          pe.is_pe and
          for any s in (0..pe.number_of_sections - 1) : (
            pe.sections[s].name == ".text" and
            $name in (pe.sections[s].raw_data_offset..
                      pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size - 1) and
            for any of ($framework, $core, $base, $namespace) : (
              $ in (pe.sections[s].raw_data_offset..
                    pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size - 1)
            )
          )
      }
