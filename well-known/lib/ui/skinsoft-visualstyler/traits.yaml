# SkinSoft VisualStyler skins WinForms applications. Its ssapihook.dll
# installs window and inline API hooks to repaint standard controls; that
# patching is the library's function, not hook-based evasion.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 1048576
  crit: notable

traits:
  - id: skinsoft-version-company
    desc: SkinSoft version-resource company
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      exact: SkinSoft

  - id: skinsoft-hook-library-product
    desc: SkinSoft .NET Hook Library product name
    crit: component
    conf: 0.97
    if:
      type: value
      path: pe.version.product_name
      exact: SkinSoft .NET Hook Library

composite_rules:
  - id: skinsoft-api-hook-library
    desc: SkinSoft WinForms skinning API hook library
    conf: 0.97
    all:
      - id: skinsoft-version-company
      - id: skinsoft-hook-library-product
      - id: micro-behaviors/ui/window/hook::windows-hook-install
