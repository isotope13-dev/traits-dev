defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: version-header
    desc: Highlight.js version header
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'Highlight\.js v[0-9]+\.[0-9]+\.[0-9]+'
  - id: project-url
    desc: Highlight.js project URL
    crit: component
    conf: 0.99
    if:
      type: text
      substr: highlightjs/highlight.js

  - id: github-reference
    desc: Highlight.js GitHub repository reference
    crit: component
    conf: 0.98
    if:
      type: text
      substr: github.com/highlightjs/highlight.js

  - id: api-marker
    desc: Highlight.js public API marker
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\b(highlightAuto|highlightElement|registerLanguage)\b'

composite_rules:
  - id: browser-bundle
    desc: Highlight.js syntax-highlighter bundle
    crit: notable
    conf: 0.99
    all:
      - id: version-header
      - id: project-url

  - id: bundled-library
    desc: Highlight.js syntax highlighter present
    crit: notable
    conf: 0.99
    any:
      - id: browser-bundle
      - id: github-api-bundle

  - id: github-api-bundle
    desc: Highlight.js API and repository bundle context
    crit: notable
    conf: 0.99
    all:
      - id: github-reference
      - id: api-marker
