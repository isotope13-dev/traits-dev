defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: version-header
    desc: Highlight.js version header
    conf: 0.99
    if:
      type: text
      regex: 'Highlight\.js v[0-9]+\.[0-9]+\.[0-9]+'
  - id: project-url
    desc: Highlight.js project URL
    conf: 0.99
    if:
      type: text
      substr: highlightjs/highlight.js

  - id: github-reference
    desc: Highlight.js GitHub repository reference
    conf: 0.98
    if:
      type: text
      substr: github.com/highlightjs/highlight.js

