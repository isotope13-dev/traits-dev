defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: version-header
    desc: Highlight.js version header
    conf: 0.99
    if:
      type: text
      regex: 'Highlight\.js v[0-9]+\.[0-9]+\.[0-9]+'
  - id: project-url
    desc: Highlight.js project URL
    conf: 0.99
    if:
      type: text
      substr: highlightjs/highlight.js

  - id: github-reference
    desc: Highlight.js GitHub repository reference
    conf: 0.98
    if:
      type: text
      substr: github.com/highlightjs/highlight.js

  # Shipped themes (e.g. styles/vs2015.min.css) are pure CSS keyed to the
  # token classes the highlighter emits. A single class would also match a
  # page overriding it, so the atoms stay components and only their pair
  # claims the shipped stylesheet.
  - id: hljs-code-block-selector
    desc: Highlight.js code block selector
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(pre\s+)?code\.hljs\b'
  - id: hljs-token-class-selector
    desc: Highlight.js token class selector
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '\.hljs-(keyword|comment|string|number)\b'

composite_rules:
  - id: highlight-js-theme-stylesheet
    desc: Highlight.js theme stylesheet
    crit: notable
    conf: 0.97
    for: [text]
    all:
      - id: hljs-code-block-selector
      - id: hljs-token-class-selector

