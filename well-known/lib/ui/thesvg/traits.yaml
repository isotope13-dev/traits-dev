# thesvg — SVG icons for popular brands (thesvg.org).
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, javascript, typescript, json, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: thesvg npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: "@thesvg/icons"

  - id: repository-url
    desc: thesvg repository URL
    for: [package.json, text, markdown]
    if:
      type: text
      substr: github.com/glincker/thesvg

  - id: project-url
    desc: thesvg project URL
    for: [javascript, typescript, json]
    if:
      type: literal
      substr: thesvg.org

  - id: file-header
    desc: thesvg icon file header
    for: [javascript, typescript]
    if:
      type: text
      substr: "// @thesvg/icons"

composite_rules:
  - id: thesvg-package-context
    desc: thesvg brand library context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: package-name
      - id: repository-url
      - id: project-url
      - id: file-header
