defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  - id: stock-packed-zingchart-lf
    desc: Verified packed ZingChart CDN distribution
    size_min: 619947
    size_max: 619947
    if:
      type: yara
      source: |
        import "hash"

        rule stock_packed_zingchart_lf {
          condition:
            hash.sha256(0, filesize) == "a6b746ca7df924688befb3f0ca550de7bdd4c5f89d99a87cc3e1ea7fa71e3c31"
        }
  - id: stock-packed-zingchart-crlf
    desc: Verified packed ZingChart with CRLF
    size_min: 619955
    size_max: 619955
    if:
      type: yara
      source: |
        import "hash"

        rule stock_packed_zingchart_crlf {
          condition:
            hash.sha256(0, filesize) == "ac15388d006207571240b072eeac4a877c7d07279ed0bdd9f2cc5ec3135365dd"
        }

composite_rules:
  - id: stock-packed-zingchart
    desc: Stock packed ZingChart library distribution
    crit: exception
    any:
      - id: stock-packed-zingchart-lf
      - id: stock-packed-zingchart-crlf
