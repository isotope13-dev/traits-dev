# @equinor/eds-core-react — Equinor Design System React components.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, zip, npm]
  crit: notable
  conf: 0.97
  size_min: 1
  size_max: 52428800

traits:
  - id: equinor-eds-core-react-package-name
    desc: Equinor EDS core React npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@equinor/eds-core-react'

  - id: equinor-design-system-repository
    desc: equinor/design-system GitHub repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      substr: github.com/equinor/design-system

  - id: equinor-eds-homepage-marker
    desc: eds.equinor.com homepage marker
    for: [package.json]
    if:
      type: text
      substr: eds.equinor.com

  - id: eds-core-react-dist-bundle-basename
    desc: EDS core React distribution bundle basename
    for: [javascript]
    if:
      type: basename
      exact: eds-core-react.cjs

  - id: equinor-eds-scoped-import-marker
    desc: Equinor EDS scoped package import marker
    for: [javascript, typescript]
    if:
      type: text
      substr: '@equinor/eds-'

  - id: equinor-eds-npm-archive-name
    desc: Equinor EDS npm archive package name
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@equinor/eds-core-react'

  - id: equinor-eds-esm-next-dist-path
    desc: Equinor EDS esm-next dist output path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'dist/esm-next/'

  - id: equinor-eds-esm-dist-path
    desc: Equinor EDS esm dist output path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'dist/esm/'

composite_rules:
  - id: equinor-eds-core-react-library
    desc: Equinor Design System React UI library
    crit: exception
    conf: 0.97
    any:
      - id: equinor-eds-core-react-package-name
      - id: equinor-design-system-repository
      - id: equinor-eds-homepage-marker
      - id: eds-core-react-dist-bundle-basename
      - id: equinor-eds-scoped-import-marker
      - id: equinor-eds-npm-archive-name
      - id: equinor-eds-esm-next-dist-path
      - id: equinor-eds-esm-dist-path
