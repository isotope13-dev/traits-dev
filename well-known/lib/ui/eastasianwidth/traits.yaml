# eastasianwidth — Unicode East Asian Width lookup.
defaults:
  platforms: [unix, windows]
  for: [javascript, markdown, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: eastasianwidth npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: eastasianwidth

  - id: vendored-path
    desc: vendored eastasianwidth package path
    for: [scripts, manifests, data, source, markdown]
    if:
      type: path
      regex: 'node_modules/eastasianwidth/'
