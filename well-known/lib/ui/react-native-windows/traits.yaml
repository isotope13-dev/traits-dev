# react-native-windows — Microsoft's React Native desktop framework for Windows (UWP / WinUI).
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.98

traits:
  - id: store-app-runner-namespace
    desc: StoreAppRunner namespace definition
    if:
      type: text
      substr: 'namespace StoreAppRunner'

  - id: application-activation-manager-guid
    desc: ApplicationActivationManager COM GUID
    if:
      type: text
      substr: '45BA127D-10A8-46EA-8AB7-56EA9078943C'

  - id: invoke-elevated-scriptblock
    desc: Elevated ScriptBlock execution helper
    if:
      type: text
      regex: '(?i)\bfunction\s+Invoke-ElevatedScriptBlock\b'

composite_rules:
  - id: react-native-windows-store-app-utils
    desc: RN Windows Store app management utility
    crit: exception
    conf: 0.99
    all:
      - id: store-app-runner-namespace
      - id: invoke-elevated-scriptblock
      - id: application-activation-manager-guid
