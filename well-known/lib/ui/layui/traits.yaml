# layui layer's shipped demo page loads jQuery from BootCDN, then the
# local layer.js, and links back to layer.layui.com.
defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: layui-layer-bootcss-jquery
    desc: Demo loads jQuery from BootCDN
    if:
      type: text
      substr: 'http://cdn.bootcss.com/jquery/'
  - id: layui-layer-local-script
    desc: Page loads the local layer script
    if:
      type: text
      substr: 'src="layer.js"'
  - id: layui-layer-site
    desc: Links to the layer.layui.com site
    if:
      type: text
      substr: 'http://layer.layui.com/'

composite_rules:
  - id: layui-layer-demo-page
    desc: Official layui layer demo page
    all:
      - id: layui-layer-bootcss-jquery
      - id: layui-layer-local-script
      - id: layui-layer-site
