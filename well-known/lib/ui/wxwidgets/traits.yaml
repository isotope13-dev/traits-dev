# wxWidgets is a cross-platform C++ GUI framework. Its Windows monolithic
# build exports a large wx-prefixed API and identifies itself in PE metadata.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1048576
  size_max: 50000000

traits:
  - id: wxwidgets-product-metadata
    desc: wxWidgets product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: wxWidgets
  - id: wxwidgets-company-metadata
    desc: wxWidgets vendor metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: wxWidgets development team
  - id: wxwidgets-prefixed-exports
    desc: Many wxWidgets-prefixed exports
    crit: notable
    conf: 0.99
    count_min: 50
    if:
      type: export
      regex: '^wx[A-Za-z_]'

composite_rules:
  - id: wxwidgets-library-identity
    desc: Identified wxWidgets native library
    crit: notable
    conf: 0.99
    all:
      - id: wxwidgets-product-metadata
      - id: wxwidgets-company-metadata
      - id: wxwidgets-prefixed-exports
