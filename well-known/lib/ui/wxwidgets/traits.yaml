# wxWidgets is a cross-platform C++ GUI framework. Its Windows monolithic
# build exports a large wx-prefixed API and identifies itself in PE metadata.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  size_min: 1048576
  size_max: 50000000

traits:
  - id: wxwidgets-product-metadata
    desc: wxWidgets product metadata
    if:
      type: value
      path: pe.version.product_name
      exact: wxWidgets
  - id: wxwidgets-company-metadata
    desc: wxWidgets vendor metadata
    if:
      type: value
      path: pe.version.company
      exact: wxWidgets development team
  - id: wxwidgets-prefixed-exports
    desc: Many wxWidgets-prefixed exports
    count_min: 50
    if:
      type: export
      regex: '^wx[A-Za-z_]'

  - id: wxwidgets-source-path
    desc: wxWidgets embedded source path
    for: [pe]
    if:
      type: text
      section: .rdata
      regex: 'wxwidgets(-src)?[\\/](include[\\/]wx|src[\\/])'

  - id: wxwidgets-information-string
    desc: wxWidgets framework information string
    for: [pe]
    if:
      type: text
      section: .rdata
      substr: "wxWidgets information"

composite_rules:
  - id: wxwidgets-library-identity
    desc: Identified wxWidgets native library
    all:
      - id: wxwidgets-product-metadata
      - id: wxwidgets-company-metadata
      - id: wxwidgets-prefixed-exports

  - id: wxwidgets-application-framework
    desc: Identified statically linked wxWidgets GUI framework
    crit: notable
    conf: 0.98
    for: [pe]
    all:
      - id: wxwidgets-source-path
      - id: wxwidgets-information-string
