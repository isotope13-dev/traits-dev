# Apache ECharts / zrender (ecomfe) charting bundle identity.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 15000000

traits:
  - id: zrender-github-license-url
    desc: zrender GitHub license URL
    conf: 0.99
    if:
      type: text
      substr: 'https://github.com/ecomfe/zrender/blob/master/LICENSE.txt'

  - id: zrender-library-banner
    desc: ZRender 2d drawing library banner
    conf: 0.98
    if:
      type: text
      substr: 'ZRender, a high performance 2d drawing library.'

  - id: echarts-instance-token
    desc: ECharts instance token string
    conf: 0.98
    if:
      type: text
      substr: '_echarts_instance_'

  - id: zrender-add-self-to-zr
    desc: zrender addSelfToZr method name
    conf: 0.96
    if:
      type: text
      substr: addSelfToZr

composite_rules:
  - id: echarts-zrender-library
    desc: ECharts zrender charting library
    crit: notable
    conf: 0.98
    any:
      - id: zrender-github-license-url
      - id: zrender-library-banner
      - id: echarts-instance-token
      - id: zrender-add-self-to-zr
