# GreenSock Animation Platform (GSAP) — the dominant JavaScript animation
# library, including the commercial "Club GreenSock" bonus plugins
# (SplitText, etc.) that packages often vendor as `gsap-bonus.tgz`. The
# bonus plugins carry permissive-looking banner comments but a commercial
# license, so their presence in a package is worth surfacing to analysts.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: gsap-library-banner
    desc: GreenSock GSAP library banner
    if:
      type: text
      regex: 'greensock\.com|Club GreenSock'

  - id: gsap-splittext-plugin
    desc: GSAP SplitText plugin
    conf: 0.98
    if:
      type: text
      regex: 'SplitText[: ]+\d+\.\d+'
