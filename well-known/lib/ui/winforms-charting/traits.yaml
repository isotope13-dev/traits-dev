# The .NET Windows Forms charting component includes bitmap-backed chart
# rendering and reflection-based design support. Those framework references
# can otherwise resemble pixel-steganography extraction in merged assemblies.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.95
  size_min: 512
  size_max: 20000000

traits:
  - id: datavisualization-charting-namespace
    desc: .NET DataVisualization charting namespace
    crit: notable
    if:
      type: text
      section: .text
      substr: System.Windows.Forms.DataVisualization.Charting
