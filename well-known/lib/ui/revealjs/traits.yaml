# reveal.js — HTML presentation framework (revealjs.com).
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 5000000

traits:
  - id: revealjs-license-banner
    desc: reveal.js license banner header
    conf: 0.98
    if:
      type: text
      regex: '(?i)reveal\.js\s+\d'
      offset_range: [0, 512]

  - id: revealjs-site-url
    desc: reveal.js project site URL
    conf: 0.96
    if:
      type: text
      substr: https://revealjs.com
      offset_range: [0, 1024]

  - id: revealjs-dist-basename
    desc: reveal.js dist bundle basename
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)^reveal(\.esm)?\.js$'

composite_rules:
  - id: revealjs-presentation-library
    desc: reveal.js presentation library bundle
    crit: notable
    conf: 0.98
    any:
      - id: revealjs-license-banner
      - id: revealjs-site-url
      - id: revealjs-dist-basename
