# harfbuzz — OpenType text shaping library.
defaults:
  platforms: [linux, windows]
  for: [rpm, tar, archives, c, cpp, markdown, text]
  crit: notable
  conf: 0.99
  size_min: 1

traits:
  - id: rpm-package-name
    desc: harfbuzz Fedora source RPM package name
    for: [rpm]
    if:
      type: value
      path: rpm.name
      exact: harfbuzz

  - id: harfbuzz-spec-file
    desc: harfbuzz RPM spec file basename
    for: [rpm, tar, archives]
    if:
      type: path
      regex: '(?i)(^|[\\/])harfbuzz\.spec$'

  - id: harfbuzz-github-repo
    desc: harfbuzz GitHub repository marker
    for: [c, cpp, markdown, text, shell]
    if:
      type: text
      substr: github.com/harfbuzz/harfbuzz

  - id: hb-shape-api-marker
    desc: harfbuzz hb_shape API marker
    for: [c, cpp, markdown, text]
    if:
      type: text
      substr: hb_shape

composite_rules:
  - id: harfbuzz-library-package
    desc: harfbuzz OpenType text shaping library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: rpm-package-name
      - id: harfbuzz-spec-file
      - id: harfbuzz-github-repo
