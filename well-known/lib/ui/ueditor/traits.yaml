# Baidu UEditor 1.4 map dialogs. Each page loads the editor's internal.js
# and the map provider's historical plaintext API, then constructs that map.
defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: ueditor-dialog-internal-script
    desc: UEditor dialog loads internal.js
    if:
      type: text
      substr: 'src="../internal.js"'
  - id: ueditor-google-maps-sensor-script
    desc: Dialog script for the Google Maps API
    if:
      type: text
      substr: 'http://maps.googleapis.com/maps/api/js?sensor=false'
  - id: ueditor-google-maps-constructor
    desc: Constructs a Google Maps map
    if:
      type: text
      substr: 'new google.maps.Map('
  - id: ueditor-baidu-map-v11-script
    desc: Dialog script for the Baidu Maps API
    if:
      type: text
      regex: 'http://api\.map\.baidu\.com/api\?[^"''<>]{0,16}v=1\.1&services=true'
  - id: ueditor-editor-save-scene
    desc: UEditor editor saves the map scene
    if:
      type: text
      substr: "editor.fireEvent('saveScene')"
  - id: ueditor-baidu-map-constructor
    desc: Constructs a Baidu Maps map
    if:
      type: text
      substr: 'new BMap.Map('

composite_rules:
  - id: ueditor-google-map-dialog
    desc: UEditor Google map dialog page
    all:
      - id: ueditor-dialog-internal-script
      - id: ueditor-google-maps-sensor-script
      - id: ueditor-google-maps-constructor
  - id: ueditor-baidu-map-dialog
    desc: UEditor Baidu map dialog page
    all:
      - id: ueditor-dialog-internal-script
      - id: ueditor-baidu-map-v11-script
      - id: ueditor-baidu-map-constructor
  - id: ueditor-baidu-map-preview
    desc: UEditor Baidu map preview page
    all:
      - id: ueditor-baidu-map-v11-script
      - id: ueditor-baidu-map-constructor
      - id: ueditor-editor-save-scene
  - id: ueditor-plaintext-map-page
    desc: UEditor page loads its map provider
    any:
      - id: ueditor-google-map-dialog
      - id: ueditor-baidu-map-dialog
      - id: ueditor-baidu-map-preview
