defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [javascript]
traits:
- id: monaco-editor-main-path
  desc: Monaco editor main bundle path
  crit: notable
  conf: 0.99
  if:
    type: basename
    exact: editor.main.js
- id: monaco-editor-license-banner
  desc: Monaco editor license banner
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'github.com/microsoft/monaco-editor'
- id: monaco-basic-language-module
  desc: Monaco basic language module
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'define\(["'']vs/(monaco/)?basic-languages/'
- id: monaco-environment-global
  desc: MonacoEnvironment global reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: MonacoEnvironment
- id: monaco-loader-license-banner
  desc: Monaco / VS Code loader license banner
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'github.com/microsoft/vscode/blob/main/LICENSE.txt'
- id: monaco-amd-loader-global
  desc: Monaco AMDLoader global reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: AMDLoader
- id: monaco-loader-path
  desc: Monaco / VS Code AMD loader path
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: '(^|/)vs/loader\.js$'
composite_rules:
- id: monaco-editor-main-bundle
  desc: Monaco editor main runtime bundle
  crit: notable
  conf: 0.99
  all:
  - id: monaco-editor-main-path
  - id: monaco-editor-license-banner
- id: monaco-editor-loader-bundle
  desc: Monaco / VS Code AMD loader bundle
  crit: notable
  conf: 0.99
  all:
  - id: monaco-loader-license-banner
  - id: monaco-amd-loader-global
- id: monaco-editor-language-definition
  desc: Monaco editor language definition
  crit: notable
  conf: 0.98
  all:
  - id: monaco-editor-license-banner
  - id: monaco-basic-language-module
- id: monaco-editor-runtime
  desc: Monaco editor runtime bundle
  crit: notable
  conf: 0.96
  all:
  - id: monaco-editor-license-banner
  any:
  - id: monaco-environment-global
  - id: metadata/lang/source/syntax/member::monaco-editor-reference
  - id: monaco-editor-language-definition

- id: monaco-editor-microsoft-banner
  desc: Monaco URL accompanies Microsoft copyright
  crit: notable
  conf: 0.99
  all:
  - id: metadata/vendor/string::microsoft-copyright-header
  - id: monaco-editor-license-banner
