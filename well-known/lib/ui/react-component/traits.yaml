defaults:
  for: [package.json]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.99

traits:
  # The React Component project moved its long-running unscoped `rc-*`
  # packages into the controlled `@rc-component/*` namespace while retaining
  # repositories under the `react-component` GitHub organization. These two
  # identities explain why older README links can still name an unscoped
  # package without making the scoped release a third-party clone.
  - id: scoped-package-identity
    desc: React Component scoped package identity
    if:
      type: value
      path: name
      regex: '^@rc-component/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-identity
    desc: React Component GitHub repository identity
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/react-component/[a-z0-9._-]+(\.git)?$'

composite_rules:
  - id: official-scope-repository-pair
    desc: Official React Component package repository pairing
    crit: exception
    all:
      - id: scoped-package-identity
      - id: github-repository-identity
