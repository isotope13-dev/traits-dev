# SweetAlert2 is a widely bundled MIT-licensed replacement for window.alert().
# These traits establish only that the library is present in a bundle, which is
# ordinary for any web or Electron application.
#
# They previously lived under well-known/unwanted/compilerx-sweetalert-protestware/
# and the composite was described as "SweetAlert2 dialog library in the
# protestware bundle". The matcher checks nothing of the sort -- it finds the
# library's version banner and its CSS class prefix -- so every benign consumer
# (Pinokio, and any site shipping SweetAlert2) was labelled a protestware bundle
# member and keyed to an `unwanted/` ML feature. Library identity belongs here;
# the region-gated sabotage carried by affected releases is a separate claim,
# detected in objectives/impact/ui/manipulation/browser/.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: sweetalert2-name
    desc: References the SweetAlert2 library name
    if:
      type: text
      exact: SweetAlert2

  - id: sweetalert2-version
    desc: SweetAlert2 version identity
    if:
      type: text
      regex: '(?i)(sweetalert2\s+v|(swal|sweetalert2)\.version\s*=\s*["''])\d+\.\d+'

  - id: sweetalert2-css-class-prefix
    desc: SweetAlert2 CSS class prefix
    if:
      # Minified releases construct `swal2-popup` from the `swal2-` prefix
      # and a compact class-name table, so the complete popup class is not
      # necessarily present as an extracted string literal.
      type: text
      substr: swal2-

composite_rules:
  - id: sweetalert2-library
    desc: SweetAlert2 dialog library is bundled
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: sweetalert2-name
      - id: sweetalert2-version
      - id: sweetalert2-css-class-prefix
