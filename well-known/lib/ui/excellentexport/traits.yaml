# ExcellentExport.js is a browser-side Excel/CSV export library. Its legacy
# compatibility code includes base64 alphabets and String.fromCharCode.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, text]
  crit: notable
  conf: 0.98

traits:
  - id: library-api
    desc: ExcellentExport browser export library
    for: [javascript]
    if:
      type: text
      regex: '(?i)(window\.)?ExcellentExport\s*=\s*function'
