# OpenOffice / LibreOffice Java UNO library (unoil / jodconverter) defines
# standard AWT keystroke and accessibility keyboard binding classes
# (e.g. com.sun.star.awt.KeyStroke, com.sun.star.accessibility.XAccessibleKeyBinding).
defaults:
  platforms: [unix, windows]
  for: [jar, class, java_class]
  crit: notable
  conf: 0.99

traits:
  - id: uno-keystroke-class
    desc: OpenOffice UNO keystroke class
    if:
      type: value
      path: class.this_class
      regex: '^com/sun/star/(awt|accessibility)/'
