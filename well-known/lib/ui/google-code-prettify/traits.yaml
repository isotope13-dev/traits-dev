defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  size_max: 209715200

traits:
  - id: runner
    desc: Google Code Prettify runner
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '^(run_prettify|prettify)(-min)?\.js$'
      case_insensitive: true
      basename: true
  - id: autoload-helper
    desc: Google Code Prettify autoload helper
    crit: component
    conf: 0.95
    if:
      type: text
      substr: 'j=="autorun"?S=!/^[0fn]/i.test(w)'

composite_rules:
  - id: library
    desc: Google Code Prettify library
    crit: notable
    conf: 0.97
    any:
      - id: runner
      - id: autoload-helper
