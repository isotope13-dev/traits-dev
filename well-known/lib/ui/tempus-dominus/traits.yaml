# tempus-dominus — Eonasdan Bootstrap 5 datetime picker.
defaults:
  platforms: [windows, unix]
  for: [javascript, text]
  crit: notable
  conf: 0.98

traits:
  - id: package-name
    desc: tempus-dominus package identifier
    if:
      type: text
      substr: tempus-dominus

  - id: tempus-dominus-class
    desc: TempusDominus global export
    if:
      type: text
      substr: tempusDominus

composite_rules:
  - id: tempus-dominus-library
    desc: Tempus Dominus datetime picker
    crit: notable
    conf: 0.98
    all:
      - id: package-name
    any:
      - id: tempus-dominus-class
