defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  # Core translations assign a locale table instead of calling setLang.
  # Assignment nodes distinguish tables from quoted examples and reads.
  # Bind projections omit hyphenated subscripts such as ['fr-ca'], so inspect
  # the assignment itself. This identity grants no behavior exclusions.
  - id: ckeditor-core-language-assignment
    desc: CKEditor core language-table assignment
    if:
      type: tree-sitter
      query: |
        ([
          (assignment_expression
            left: (subscript_expression
              object: (member_expression
                object: (identifier) @root
                property: (property_identifier) @lang)
              index: (string (string_fragment) @locale))
            right: (object))
          (assignment_expression
            left: (member_expression
              object: (member_expression
                object: (identifier) @root
                property: (property_identifier) @lang)
              property: (property_identifier) @locale)
            right: (object))
        ] @assignment
        (#eq? @root "CKEDITOR")
        (#eq? @lang "lang")
        (#match? @locale "^[a-z]{2}(-[a-z]+)?$"))

  # Match the parsed registration call, not a copied copyright or an API name
  # inside a string. These are CKEditor plugin translation resources in any
  # locale; this identity does not suppress executable behavior appended to one.
  - id: ckeditor-plugin-language-registration
    desc: CKEditor plugin translation registration
    if:
      type: symbol
      kind: call
      exact: CKEDITOR.plugins.setLang
      args:
        - index: 0
          kind: string
        - index: 1
          kind: string
        - index: 2
          kind: object

