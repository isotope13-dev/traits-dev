defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  # Match the parsed registration call, not a copied copyright or an API name
  # inside a string. These are CKEditor plugin translation resources in any
  # locale; this identity does not suppress executable behavior appended to one.
  - id: ckeditor-plugin-language-registration
    desc: CKEditor plugin translation registration
    if:
      type: symbol
      kind: call
      exact: CKEDITOR.plugins.setLang
      args:
        - index: 0
          kind: string
        - index: 1
          kind: string
        - index: 2
          kind: object

