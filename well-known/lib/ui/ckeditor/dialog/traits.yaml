defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  # Match the parsed registration call, not a copied copyright or an API
  # name inside a string. CKEditor plugins register their dialogs this
  # way (about, table cell properties, link, and so on); this identity
  # does not suppress executable behavior appended to such a file.
  - id: ckeditor-dialog-registration
    desc: CKEditor dialog registration
    if:
      type: symbol
      kind: call
      exact: CKEDITOR.dialog.add
      args:
        - index: 0
          kind: string
        - index: 1
          kind: function
