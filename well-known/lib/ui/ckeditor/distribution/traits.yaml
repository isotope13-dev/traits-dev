# CKEditor 4's minified distribution uses computed global member calls as
# part of its compatibility layer. That syntax is native to the library and
# is not evidence that an application embedding the editor is obfuscated.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: cksource-license-header
    desc: CKSource copyright and license header
    if:
      type: text
      regex: 'Copyright \(c\) 2003-[0-9]{4}, CKSource Holding'

  - id: ckeditor-global-definition
    desc: CKEditor browser global definition
    if:
      type: text
      regex: 'window\.CKEDITOR\s*\|\|\s*\(window\.CKEDITOR\s*=\s*function'

composite_rules:
  - id: ckeditor-distribution
    desc: CKEditor JavaScript distribution
    all:
      - id: cksource-license-header
      - id: ckeditor-global-definition
