# UIkit is a legitimate modular frontend framework.
defaults:
  platforms: [windows, unix]
  for: [package.json, javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: UIkit npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: uikit

  - id: upstream-repository
    desc: UIkit upstream repository reference
    if:
      type: text
      regex: 'github\.com/uikit/uikit(\.git)?([/\\s"''`?#]|$)'

  - id: version-banner
    desc: UIkit version banner
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bUIkit\s+3\.\d+\.\d+\b'

composite_rules:
  - id: library
    desc: UIkit frontend framework package
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: version-banner
      - id: upstream-repository
