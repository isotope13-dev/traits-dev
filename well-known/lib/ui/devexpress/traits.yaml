# DevExpress (Developer Express Inc.) is a well-known commercial .NET WinForms/
# WPF UI component vendor. Its skinning/theming engine (DevExpress.Utils,
# DevExpress.XtraEditors, DevExpress.LookAndFeel) legitimately reads and writes
# bitmap pixel data for custom-drawn controls and skin resources, and its
# design-time infrastructure makes heavy use of reflection -- the same
# combination the bitmap-steganography rules look for in a payload extractor.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.97
  size_min: 512
  size_max: 524288000

traits:
  - id: devexpress-company-versioninfo
    desc: DevExpress CompanyName version info
    if:
      type: value
      path: pe.version.company
      exact: Developer Express Inc.

  - id: devexpress-copyright-string
    desc: DevExpress copyright notice string
    if:
      type: text
      regex: 'Copyright \(c\) [0-9]{4}(-[0-9]{4})? Developer Express Inc\.'
      section: .text

composite_rules:
  - id: devexpress-binary
    desc: DevExpress .NET UI component assembly
    crit: notable
    conf: 0.98
    any:
      - id: devexpress-company-versioninfo
      - id: devexpress-copyright-string
