# Han.css is a typography framework for Chinese/Japanese text.  Its deliberate
# per-glyph unicode-range declarations are font subsetting, not a CSS oracle.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.99
  size_max: 1000000

traits:
  - id: han-css-release-banner
    desc: Han.css typography framework banner
    if:
      type: text
      substr: 'Han.css: the CSS typography framework optimised for Hanzi'
