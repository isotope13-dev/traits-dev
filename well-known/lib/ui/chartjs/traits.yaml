defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 8388608

traits:
  - id: version-banner
    desc: Chart.js version banner comment
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Chart\.js v\d+\.\d+\.\d+'

  - id: project-url
    desc: Chart.js project URL reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'https://www.chartjs.org'

composite_rules:
  - id: library
    desc: Chart.js charting library bundle
    crit: notable
    conf: 0.94
    any:
      - id: version-banner
      - id: project-url
