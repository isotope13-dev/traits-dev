defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 8388608

traits:
  - id: version-banner
    desc: Chart.js version banner comment
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Chart\.js v\d+\.\d+\.\d+'

  - id: project-url
    desc: Chart.js project URL reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'https://www.chartjs.org'

  - id: umd-global-export
    desc: Chart.js UMD global Chart export
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 't||self).Chart=e()'

  - id: legend-plugin-getter
    desc: Chart.js Legend plugin getter
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'get Legend(){return'

  - id: min-bundle-path
    desc: Chart.js minified bundle path
    crit: notable
    conf: 0.9
    for: [scripts, manifests, data, source]
    if:
      type: path
      regex: 'chart\.min\.js'

composite_rules:
  - id: library
    desc: Chart.js charting library bundle
    crit: notable
    conf: 0.94
    all:
      - id: umd-global-export
    any:
      - id: version-banner
      - id: project-url
      - id: legend-plugin-getter
      - id: min-bundle-path
