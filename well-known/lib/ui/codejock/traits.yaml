# Codejock Xtreme Toolkit Pro is a native Windows UI framework. Its command
# bars, docking panes, syntax editor, calendar and skin manager contain generic
# clipboard, GDI and keyboard-hook support used by hosted applications.
defaults:
  size_min: 1000000
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
traits:
  - id: xtreme-toolkit-pro-company
    desc: Codejock version-resource company
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: Codejock Software
  - id: xtreme-toolkit-pro-product
    desc: Xtreme Toolkit Pro product identity
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      regex: '^Xtreme Toolkit Pro'
  - id: xtreme-toolkit-pro-resource-string
    desc: Codejock Xtreme Toolkit Pro resource identity
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Xtreme Toolkit Pro
      section: rsrc
composite_rules:
  - id: xtreme-toolkit-pro-runtime-component
    desc: Codejock Xtreme Toolkit Pro UI framework component
    crit: notable
    conf: 0.98
    all:
      - id: xtreme-toolkit-pro-company
      - id: xtreme-toolkit-pro-product
