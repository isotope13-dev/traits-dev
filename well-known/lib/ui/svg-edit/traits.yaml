defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.99

traits:
  - id: svg-edit-source-path
    desc: SVG-edit source path
    if:
      type: path
      regex: '(^|[\\/])svg-edit([\\/]|$)'
  - id: svg-edit-library-marker
    desc: SVG-edit library marker
    if:
      type: text
      substr: svgedit

composite_rules:
  - id: svg-edit-library-context
    desc: Recognized SVG-edit browser library source
    crit: exception
    conf: 0.99
    all:
      - id: svg-edit-source-path
      - id: svg-edit-library-marker
