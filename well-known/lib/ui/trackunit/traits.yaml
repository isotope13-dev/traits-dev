# Trackunit's public React/UI packages share the Trackunit/manager monorepo.
# Individual @trackunit/* package names therefore differ from the repository
# basename, and their READMEs link sibling packages in the same design system.
# Pairing the controlled npm scope with the exact official repository explains
# that provenance without exempting either lookalike packages or foreign repos.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: scoped-package-identity
    desc: Trackunit scoped package identity
    if:
      type: value
      path: name
      regex: '^@trackunit/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: scoped-npm-package-identity
    desc: Trackunit scoped npm package identity
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@trackunit/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: github-repository-string
    desc: Trackunit manager repository URL string
    if:
      type: value
      path: repository
      regex: '^(git\+)?https://github\.com/[Tt]rackunit/manager(\.git)?(/.*)?$'

  - id: github-repository-url
    desc: Trackunit manager repository object URL
    if:
      type: value
      path: repository.url
      regex: '^(git\+)?https://github\.com/[Tt]rackunit/manager(\.git)?(/.*)?$'

  - id: github-npm-repository-url
    desc: Trackunit manager npm archive repository
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '^(git\+)?https://github\.com/[Tt]rackunit/manager(\.git)?(/.*)?$'

composite_rules:
  - id: official-package-scope
    desc: Official Trackunit package scope
    crit: exception
    any:
      - id: scoped-package-identity
      - id: scoped-npm-package-identity

  - id: official-package-repo
    desc: Official Trackunit package repository
    crit: exception
    any:
      - id: github-repository-string
      - id: github-repository-url
      - id: github-npm-repository-url

  - id: official-scope-repository-pair
    desc: Official Trackunit package repository pairing
    crit: exception
    all:
      - id: official-package-scope
      - id: official-package-repo
