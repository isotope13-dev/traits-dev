defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.94

traits:
  - id: flutter-windows-dll
    desc: Flutter Windows runtime DLL name
    if:
      type: text
      exact: flutter_windows.dll
      section: rdata
  - id: flutter-desktop-engine-symbols
    desc: Flutter desktop engine symbol reference
    if:
      type: symbol
      regex: ^FlutterDesktop(Engine|ViewController)
  - id: flutter-assets-path
    desc: Flutter assets path reference
    if:
      type: text
      exact: \flutter_assets
      section: rdata

  - id: flutter-linux-desktop-runner
    desc: Flutter Linux embedder API symbol
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    if:
      type: symbol
      regex: '^fl_(dart_project_new|view_new|plugin_registry_get_type)$'

composite_rules:
  - id: flutter-windows-desktop-runner
    desc: Flutter Windows desktop runner
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: flutter-windows-dll
      - id: flutter-desktop-engine-symbols
      - id: flutter-assets-path
