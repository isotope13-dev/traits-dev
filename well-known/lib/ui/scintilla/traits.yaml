# Scintilla -- the source-code editing control (Neil Hodgson), embedded by
# SciTE, Notepad++, PythonWin, Code::Blocks, wxWidgets and many others.
#
# A text-editing widget reaches for the same three Windows API families a
# surveillance collector does, and for entirely ordinary reasons: it blits
# into a DIB to render the text view, reads the clipboard to implement paste,
# and takes keyboard input because that is what an editor is. The
# input/screen/clipboard collector rule already carries the same carve-out for
# pdfium and Tcl/Tk; Scintilla is the same class of component, and it ships
# inside pywin32 as pythonwin/scintilla.dll.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  crit: notable
  conf: 0.98
  size_min: 20000
  size_max: 40000000

traits:
  - id: scintilla-direct-function-export
    desc: Scintilla direct-call entry point
    for: [pe, dll, elf, so, macho, dylib]
    if:
      type: export
      exact: Scintilla_DirectFunction

  - id: scintilla-author-contact
    desc: Scintilla upstream author contact string
    if:
      type: text
      substr: neilh@scintilla.org

  - id: scintilla-win-class-rtti
    desc: Scintilla Windows platform class RTTI
    if:
      type: text
      substr: '.?AVScintillaWin@@'

  - id: scilexer-module-name
    desc: Scintilla lexer module name
    if:
      type: text
      word: SciLexer

composite_rules:
  # Two independent markers: the control's own entry point or RTTI beside its
  # upstream identity. One string alone could be a mention; the pair is the
  # component itself.
  - id: scintilla-edit-control
    desc: Scintilla source-editing control component
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: scintilla-direct-function-export
      - id: scintilla-author-contact
      - id: scintilla-win-class-rtti
      - id: scilexer-module-name
