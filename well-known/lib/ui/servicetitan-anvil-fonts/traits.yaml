# ServiceTitan Anvil Fonts is the published font-only package from the Anvil
# design system.  Match the package identity together with its upstream
# repository so a similarly named package is not treated as this library.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: ServiceTitan Anvil Fonts npm package name
    if:
      type: value
      path: name
      exact: '@servicetitan/anvil-fonts'

  - id: upstream-repository
    desc: ServiceTitan Anvil upstream repository
    if:
      type: value
      path: repository.url
      regex: '^(github:servicetitan/anvil|git\+https://github\.com/servicetitan/anvil(\.git)?)$'

composite_rules:
  - id: package-context
    desc: Recognized ServiceTitan Anvil Fonts package
    crit: notable
    conf: 0.99
    all:
      - id: package-name
      - id: upstream-repository
