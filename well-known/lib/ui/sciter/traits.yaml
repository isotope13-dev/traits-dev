# Sciter (Terra Informatica) is an embeddable HTML/CSS UI engine. The DLL
# exports one SciterAPI entry and uses a keyboard hook, clipboard watch, and
# Winsock client for the host page.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 20000
  size_max: 20000000

traits:
  - id: sciter-api-export
    desc: SciterAPI native engine export
    if:
      type: export
      exact: SciterAPI
