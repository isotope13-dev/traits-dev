defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # CodeMirror is a widely embedded in-browser code-editor library. Code that
  # references the editor instance touches `element.CodeMirror` / `this.CodeMirror`,
  # and the library's own UMD boilerplate assigns `this.CodeMirror = mod()`.
  - id: editor-object-reference
    desc: References the CodeMirror editor object
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: .CodeMirror
  - id: legacy-python-mode-factory
    desc: CodeMirror legacy Python mode factory
    crit: component
    conf: 0.98
    if:
      type: text
      word: mkPython
  - id: legacy-python-mode-name
    desc: CodeMirror Python language mode name
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'name\s*:\s*["'']python["'']'
  - id: legacy-octave-mode-name
    desc: CodeMirror Octave language mode name
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'name\s*:\s*["'']octave["'']'
  - id: legacy-octave-keyword-table
    desc: CodeMirror Octave control-keyword table
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'endfunction["''][^\r\n]{0,160}["'']endwhile'

composite_rules:
  - id: legacy-python-mode
    desc: CodeMirror legacy Python syntax mode
    crit: notable
    conf: 0.99
    all:
      - id: legacy-python-mode-factory
      - id: legacy-python-mode-name
  - id: legacy-octave-mode
    desc: CodeMirror legacy Octave syntax mode
    crit: notable
    conf: 0.99
    all:
      - id: legacy-octave-mode-name
      - id: legacy-octave-keyword-table
