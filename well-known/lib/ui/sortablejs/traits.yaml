# SortableJS — reorderable drag-and-drop list library.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  size_max: 5000000

traits:
  - id: package-name
    desc: SortableJS npm package manifest
    for: [package.json]
    if:
      type: value
      path: name
      exact: sortablejs

  - id: package-member-path
    desc: SortableJS npm package member
    if:
      type: path
      regex: 'node_modules[/\\]sortablejs([/\\]|$)'

  - id: version-banner
    desc: SortableJS version header comment
    if:
      type: text
      regex: '(?m)^/\*!\s+Sortable [0-9]+\.[0-9]+\.[0-9]+ - MIT\b'
