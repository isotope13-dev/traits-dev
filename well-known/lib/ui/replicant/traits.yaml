# replicant — Christian Johansen ClojureScript virtual-DOM library.
# Hiccup rendering and clj-kondo alias hooks are product code, not a
# dropper. Identity only. Pair with cjohansen; do not match "replicant"
# alone.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, clojure, text]
  crit: notable
  conf: 0.97
  size_min: 64
  size_max: 8000000

traits:
  - id: core-namespace
    desc: replicant.core namespace declaration
    for: [clojure, text]
    conf: 0.98
    if:
      type: text
      substr: '(ns ^:no-doc replicant.core'

  - id: core-namespace-path
    desc: replicant core namespace path
    conf: 0.96
    if:
      type: path
      regex: '(?i)replicant[\\/]core\.cljc$'

  - id: kondo-export-path
    desc: cjohansen replicant clj-kondo export path
    conf: 0.99
    if:
      type: path
      regex: '(?i)cjohansen[\\/]replicant[\\/]config\.edn'

  - id: defalias-hook
    desc: replicant.alias defalias analyzer hook
    for: [clojure, text]
    conf: 0.97
    if:
      type: text
      substr: replicant.alias/defalias

composite_rules:
  - id: replicant-library
    desc: cjohansen replicant ClojureScript library
    crit: notable
    conf: 0.99
    scope: outer
    any:
      - id: core-namespace
      - id: core-namespace-path
      - id: kondo-export-path
      - id: defalias-hook
    needs: 2
