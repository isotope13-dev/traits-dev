defaults:
  crit: notable
  conf: 0.95
  platforms: [windows, linux, macos]
  for: [javascript, text]
  size_max: 209715200

traits:
  - id: library
    desc: DataTables JavaScript table and export bundle
    for: [javascript]
    if:
      type: text
      regex: '(?is)DataTables.{0,600}(datatables\.net|SpryMedia)'

  - id: css-license-banner
    desc: DataTables CSS license banner
    for: [text]
    if:
      type: text
      substr: datatables.net/license
