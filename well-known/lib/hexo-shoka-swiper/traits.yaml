# hexo-shoka-swiper is a legitimate Hexo theme slideshow/cardshow plugin.
# Package identity must not suppress independent install-hook or network
# findings: a compromised release can retain the same name and repository.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: hexo-shoka-swiper package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: hexo-shoka-swiper

  - id: source-repository
    desc: hexo-shoka-swiper source repository
    if:
      type: text
      regex: 'github\.com/llxlr/hexo-shoka-swiper'

  - id: theme-plugin-description
    desc: Hexo Shoka Swiper slideshow plugin description
    for: [package.json]
    if:
      type: value
      path: description
      exact: A Slideshow and Cardshow plugin for theme-shoka based on swiper

composite_rules:
  - id: hexo-shoka-swiper-library
    desc: Hexo Shoka Swiper theme plugin identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: source-repository
      - id: theme-plugin-description
