# at-spi2-core is GNOME's AT-SPI accessibility infrastructure.  Its X11
# device implementation necessarily receives and translates global keyboard
# events for screen readers and other assistive technologies; that capability
# is not a keylogger when it remains in this recognized upstream source tree.
defaults:
  platforms: [linux]
  for: [c, cpp, markdown, archives]
  crit: notable
  conf: 0.99

traits:
  - id: source-tree-member
    desc: AT-SPI2 core source-tree member
    if:
      type: path
      regex: 'at-spi2-core-[0-9][A-Za-z0-9.+-]*'

  - id: project-source-header
    desc: AT-SPI accessibility source header
    for: [c, cpp]
    if:
      type: text
      substr: 'AT-SPI - Assistive Technology Service Provider Interface'

  - id: project-readme-heading
    desc: AT-SPI accessibility project README
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# Accessibility infrastructure\\s*$'

composite_rules:
  - id: source-context
    desc: Recognized AT-SPI2 accessibility source context
    crit: exception
    conf: 0.99
    all:
      - id: source-tree-member
    any:
      - id: project-source-header
      - id: project-readme-heading
