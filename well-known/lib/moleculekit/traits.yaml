# MoleculeKit TM-align native extension identity.  These markers identify the
# legitimate Cython/Python extension and are neutral context, not behavior.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 1048576

traits:
  - id: tmalign-cython-source-marker
    desc: MoleculeKit TM-align Cython source marker
    crit: notable
    conf: 0.99
    if:
      type: text
      section: .rdata
      substr: moleculekit/tmalign/tmalign_util

  - id: tmalign-cpython-init-export
    desc: TM-align CPython initialization export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: PyInit_tmalign

composite_rules:
  - id: moleculekit-tmalign-native-extension
    desc: MoleculeKit TM-align native extension
    crit: notable
    conf: 0.99
    all:
      - id: tmalign-cython-source-marker
      - id: tmalign-cpython-init-export
