defaults:
  platforms: [windows, unix]
  for: [rust, javascript, text]
  crit: notable
  conf: 0.99

traits:
  - id: icu-generated-data-path
    desc: ICU4X generated locale data file
    if:
      type: path
      regex: '(^|[\\/])data[\\/].+\.rs\.data$'

  - id: icu-crate-marker
    desc: ICU4X crate source marker
    if:
      type: text
      substr: zerovec::ZeroMap::from_parts_unchecked

composite_rules:
  - id: icu4x-generated-data-context
    desc: ICU4X generated locale data context
    any:
      - id: icu-generated-data-path
      - id: icu-crate-marker
