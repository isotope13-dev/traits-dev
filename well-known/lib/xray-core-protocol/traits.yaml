# Xray-core protocol source identity.  These traits identify the server
# destination adapter; they do not assert network activity by the source file.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: server-spec-type
    desc: ServerSpec struct signature marker
    crit: component
    if:
      type: text
      regex: '(?m)^type\s+ServerSpec\s+struct\s*\{'

  - id: server-spec-protobuf-constructor
    desc: NewServerSpecFromPB function marker
    crit: component
    if:
      type: function
      exact: NewServerSpecFromPB

composite_rules:
  - id: server-spec-adapter
    desc: Xray server specification adapter
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: well-known/lib/xray-core::xray-common-net-package-import
      - id: server-spec-type
      - id: server-spec-protobuf-constructor
