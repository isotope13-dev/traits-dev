# ExcelJS is a spreadsheet document library; its identity is useful context for
# packages that manipulate workbooks, but does not imply hostile behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.95

traits:
  - id: source-package-reference
    desc: ExcelJS source package reference
    for: [javascript, typescript]
    if:
      type: import
      exact: exceljs

  - id: package-dependency
    desc: Package declares ExcelJS dependency
    for: [package.json]
    if:
      type: value
      path: dependencies.exceljs
      exists: true

  - id: package-dev-dependency
    desc: Package declares ExcelJS development dependency
    for: [package.json]
    if:
      type: value
      path: devDependencies.exceljs
      exists: true

composite_rules:
  - id: exceljs-library
    desc: ExcelJS spreadsheet library identity
    any:
      - id: source-package-reference
      - id: package-dependency
      - id: package-dev-dependency
