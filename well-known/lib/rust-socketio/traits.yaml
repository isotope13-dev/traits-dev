# Rust Socket.IO is a dual-use realtime client library.  The crate path
# identifies the dependency; behavior composites decide whether its use is
# hostile.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: rust-socketio-client-library
    desc: Embedded Rust Socket.IO client crate path
    crit: notable
    conf: 0.93
    size_min: 100000
    size_max: 8000000
    if:
      type: hex
      section: .rdata
      pattern: 72 75 73 74 5f 73 6f 63 6b 65 74 69 6f 2d
