defaults:
  for: [pe, elf, macho]
  platforms: [linux, macos, windows]
  size_min: 1048576
  size_max: 2147483647
traits:
  - id: electron-windows-runtime-pdb
    desc: Electron Windows runtime PDB identity
    crit: notable
    conf: 0.99
    for: [pe]
    platforms: [windows]
    if:
      type: value
      path: pe.debug.pdb.basename
      exact: electron.exe.pdb
  - id: electron-app-resources-path
    desc: Electron application resources path
    crit: notable
    conf: 0.98
    for: [macho, binaries]
    if:
      type: path
      regex: 'Resources[\\/]app[\\/]'
  - id: v8-context-snapshot-name
    desc: V8 context snapshot filename
    crit: notable
    conf: 0.99
    for: [data]
    size_min: 0
    if:
      type: basename
      regex: '^v8_context_snapshot(\.(x86_64|arm64))?\.bin$'
      case_insensitive: true
  - id: electron-node-basename
    desc: Node runtime basename
    crit: component
    conf: 0.99
    for: [macho, binaries]
    if:
      type: path
      regex: '[\\/]node$'
  - id: nodejs-webstorage-marker
    desc: Electron/Node.js webstorage SQLite marker
    crit: baseline
    conf: 0.97
    if:
      type: text
      substr: nodejs_webstorage
      section: rdata
  - id: chrome-native-messaging-marker
    desc: Chrome/Electron native messaging registry path
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: NativeMessagingHosts
      section: rdata
  - id: electron-node-symbol
    desc: Electron node integration symbol
    crit: baseline
    conf: 0.93
    if:
      type: text
      substr: electron_node
      section: rdata
  - id: chrome-policy-marker
    desc: Chromium policy subsystem string
    crit: baseline
    conf: 0.88
    if:
      type: text
      substr: chrome_policy
      section: rdata
  # Chromium ships preloaded Privacy Sandbox attestation data: a catalog of
  # ad-tech and cloud hostnames the browser is asserting facts *about*. Domain
  # brand-impersonation rules read that catalog as attacker infrastructure, the
  # same false positive already recognised for the DevTools ad-tracker catalog.
  # Overrides the file-wide binary/1 MB defaults: this ships as a small
  # opaque data blob, not an executable image.
  - id: privacy-sandbox-attestations-file
    desc: Chromium Privacy Sandbox attestations data
    crit: notable
    conf: 0.97
    for: [data]
    size_min: 1
    if:
      type: path
      basename: true
      exact: privacy-sandbox-attestations.dat
  - id: chromium-network-mojom-marker
    desc: Chromium network Mojo interface marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: network.mojom.
      section: rdata
composite_rules:
  - id: electron-bundled-node-runtime
    desc: Electron-bundled Node runtime
    crit: notable
    conf: 0.98
    all:
      - id: electron-app-resources-path
      - id: electron-node-basename
  - id: electron-app-runtime
    desc: Electron or Node.js application runtime markers
    crit: notable
    conf: 0.97
    any:
      - id: well-known/lib/electron::chrome-native-messaging-marker
      - id: well-known/lib/electron::chrome-policy-marker
      - id: well-known/lib/electron::electron-windows-runtime-pdb
      - id: well-known/lib/electron::electron-enable-logging-env
      - id: well-known/lib/electron::electron-node-symbol
      - id: well-known/lib/electron::nodejs-webstorage-marker
  # Stronger multi-marker variant used to suppress capability composites that the
  # Chromium framework binary satisfies legitimately (RawInput, GDI capture,
  # CreateProcess, V8 JIT VirtualProtect). Requires two independent Chromium/
  # Electron signatures so a single embedded string cannot grant the exemption.
  # The marker list was Electron-specific, so a plain Chromium browser binary
  # (chrome.dll) reached only one leg and never satisfied needs: 2 -- leaving
  # the browser engine itself outside every benign-context carve-out built on
  # this composite. Mojo IPC and V8 are the two defining Chromium-engine
  # subsystems and belong in a rule that calls itself a Chromium runtime.
  - id: electron-chromium-runtime-strong
    desc: Chromium/Electron runtime binary (multi-marker)
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: well-known/lib/electron::chrome-native-messaging-marker
      - id: well-known/lib/electron::chrome-policy-marker
      - id: well-known/lib/electron::electron-enable-logging-env
      - id: well-known/lib/electron::electron-node-symbol
      - id: well-known/lib/electron::nodejs-webstorage-marker
      - id: well-known/lib/electron::chromium-network-mojom-marker
      - id: well-known/lib/v8::v8-runtime-multi-marker
