# Xray-core VLESS encryption client source identity. These atoms describe
# the source-level handshake implementation and are neutral library identity,
# not evidence of hostile encrypted traffic.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: common-protocol-package-import
    desc: Xray common protocol package import
    if:
      type: import
      exact: 'github.com/xtls/xray-core/common/protocol'

  - id: encryption-package
    desc: VLESS encryption package declaration
    if:
      type: text
      regex: '(?m)^package\s+encryption\b'

  - id: handshake-function
    desc: VLESS encryption handshake function
    if:
      type: function
      exact: Handshake

  - id: aead-constructor
    desc: Xray AEAD constructor call
    if:
      type: symbol
      kind: call
      exact: NewAEAD

  - id: xor-connection-constructor
    desc: Xray XOR connection constructor call
    if:
      type: symbol
      kind: call
      exact: NewXorConn

composite_rules:
  - id: encryption-client
    desc: Xray VLESS encryption client source
    crit: notable
    conf: 1.0
    all:
      - id: well-known/lib/xray-core::xray-core-module-path
      - id: common-protocol-package-import
      - id: encryption-package
      - id: handshake-function
      - id: aead-constructor
      - id: xor-connection-constructor
