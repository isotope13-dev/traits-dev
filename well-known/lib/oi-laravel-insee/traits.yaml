# oi-laravel-insee — Laravel client for the French INSEE Sirene API.
defaults:
  platforms: [unix, windows]
  for: [php, markdown, package.json]
  crit: notable
  conf: 0.98

traits:
  - id: oi-laravel-insee-namespace
    desc: OiLab Laravel INSEE package namespace
    if:
      type: text
      substr: namespace OiLab\Insee

  - id: oi-laravel-insee-api-host
    desc: INSEE Sirene API host reference
    if:
      type: text
      substr: api.insee.fr
