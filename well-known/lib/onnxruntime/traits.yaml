defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  crit: component
  conf: 0.97
  size_max: 536870912

traits:
  - id: microsoft-namespace
    desc: ONNX Runtime Microsoft namespace
    size_min: 1048576
    if:
      type: text
      substr: Microsoft.ML.ONNXRuntime
      section: rdata

  - id: trace-provider
    desc: ONNX Runtime trace provider
    size_min: 1048576
    if:
      type: text
      substr: ONNXRuntimeTraceLoggingProvider
      section: rdata

  - id: cxx-namespace
    desc: ONNX Runtime C++ namespace
    size_min: 1048576
    if:
      type: text
      substr: 'onnxruntime::'
      section: rdata

  - id: provider-dll-name
    desc: ONNX Runtime provider DLL name
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      substr: onnxruntime_providers_shared.dll
      section: rdata

  - id: onnxruntime-dylib-filename
    desc: ONNX Runtime dylib filename
    platforms: [linux, macos]
    for: [macho, elf]
    size_min: 1048576
    if:
      type: path
      basename: true
      regex: libonnxruntime

  - id: onnxruntime-node-binding-filename
    desc: ONNX Runtime Node native binding
    for: [macho, elf, pe]
    if:
      type: path
      basename: true
      exact: onnxruntime_binding.node

composite_rules:
  - id: onnxruntime-library
    desc: ONNX Runtime library markers
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: microsoft-namespace
      - id: trace-provider
      - id: cxx-namespace
      - id: provider-dll-name
      - id: onnxruntime-dylib-filename
      - id: onnxruntime-node-binding-filename
