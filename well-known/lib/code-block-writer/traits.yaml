# code-block-writer — TypeScript code formatting helper (dsherret).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, tar, text]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: code-block-writer npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: code-block-writer

  - id: archive-path
    desc: code-block-writer npm tarball path
    if:
      type: path
      regex: '(^|[\\/])code-block-writer@[0-9]'

  - id: repository-url
    desc: code-block-writer source repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/dsherret/code-block-writer'

composite_rules:
  - id: code-block-writer-library
    desc: dsherret code-block-writer npm package
    any:
      - id: package-name
      - id: archive-path
      - id: repository-url
