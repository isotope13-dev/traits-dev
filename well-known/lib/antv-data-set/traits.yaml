# @antv/data-set is AntV's data transformation and state-management library.
# These are identity/provenance observations only; its development bundler
# still needs separate process, filesystem, and network traits.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV data-set package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/data-set'

  - id: source-package-marker
    desc: AntV data-set package marker string
    for: [javascript, typescript]
    if:
      type: text
      exact: '@antv/data-set'

  - id: source-repository
    desc: AntV data-set source repository
    if:
      type: text
      regex: 'github\.com/antvis/data-set'

  - id: data-set-description
    desc: AntV data-set state-management description
    for: [package.json]
    if:
      type: value
      path: description
      exact: data set with state management

composite_rules:
  - id: data-set-library
    desc: AntV data-set data transformation library identity
    crit: notable
    conf: 0.99
    any:
      - id: package-name
      - id: source-package-marker
      - id: source-repository
      - id: data-set-description
