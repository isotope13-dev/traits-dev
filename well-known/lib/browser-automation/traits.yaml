# Benign browser-automation helper scripts (Playwright capture, real-device probe).
# FP context: headless-browser drivers resemble stealer collection.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript]
  size_max: 20000000
traits:
  - id: playwright-capture-helper
    desc: Playwright capture helper script
    crit: component
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '.*playwright.*capture.*\.mjs$'
  - id: browser-real-device-probe-helper
    desc: Browser real device probe helper script
    crit: component
    conf: 0.95
    if:
      type: path
      basename: true
      regex: 'browser_real_device_probe\.mjs$'
  - id: puppeteer-core-library-path
    desc: Contains bundled Puppeteer Core library paths
    crit: notable
    conf: 0.9
    size_min: 1000
    size_max: 100000000
    for: [javascript, typescript, python, pe, dll, csharp, go]
    if:
      type: text
      substr: puppeteer-core/lib/
  - id: puppeteer-cdp-preload-script-class
    desc: Puppeteer CdpPreloadScript class marker
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: CdpPreloadScript
  # Puppeteer's own runtime constants. Unlike a require()/node_modules path,
  # these survive bundling and minification because they are meaningful string
  # VALUES at runtime — the sourceURL Puppeteer stamps on every evaluated
  # script, and the name of the isolated world it creates. They are what still
  # identifies Puppeteer once a build step has vendored it into one .mjs
  # (e.g. @remotion/renderer ships a Puppeteer fork inside dist/esm/index.mjs),
  # which is precisely when the package-path markers above go blind.
  - id: puppeteer-evaluation-script-url
    desc: Puppeteer evaluation script sourceURL marker
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: __puppeteer_evaluation_script__

  - id: puppeteer-utility-world-name
    desc: Puppeteer isolated utility world name
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: __puppeteer_utility_world__

  - id: puppeteer-core-require
    desc: JavaScript imports Puppeteer Core
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'require\s*\(\s*["'']puppeteer-core["'']\s*\)'

  - id: puppeteer-device-emulation-catalog
    desc: Puppeteer device emulation catalog
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: 'const knownDevices ='

  - id: chrome-devtools-ad-tracker-entity-catalog
    desc: Chrome DevTools ad-tracker entity catalog
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: package/dist/entities-nostats.json

  - id: playwright-mcp-extension-name
    desc: Playwright MCP Chrome extension name
    crit: notable
    conf: 0.98
    for: [javascript, typescript, json, chrome-manifest]
    size_min: 64
    size_max: 200000
    if:
      type: text
      substr: 'Playwright MCP Extension'

  - id: playwright-mcp-extension-purpose
    desc: Playwright MCP automation purpose
    crit: notable
    conf: 0.97
    for: [javascript, typescript, json, chrome-manifest]
    size_min: 64
    size_max: 200000
    if:
      type: text
      substr: 'bot-detection-free browser automation'

  - id: playwright-core-chrome-reinstall-helper
    desc: Playwright Core Chrome reinstall helper
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: path
      basename: true
      regex: '(?i)reinstall_chrome_(stable|beta)_win\.ps1$'

  - id: playwright-core-browser-reinstall-mac-script
    desc: Playwright Core browser reinstall macOS script
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: path
      basename: true
      regex: '(?i)reinstall_(msedge|chrome|chromium).*_mac\.sh$'

  - id: playwright-user-agent-utility
    desc: Playwright Core user-agent utility module
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Playwright/${getPlaywrightVersion()}'

composite_rules:
  # Canonical "Puppeteer is present" identity, covering both a dependency on the
  # package and a copy vendored into a bundle. Consumers outside this directory
  # should reference this one composite rather than the individual markers.
  - id: puppeteer-library-present
    desc: Puppeteer browser-automation library present
    crit: notable
    conf: 0.95
    any:
      - id: puppeteer-core-library-path
      - id: puppeteer-core-require
      - id: puppeteer-cdp-preload-script-class
      - id: puppeteer-evaluation-script-url
      - id: puppeteer-utility-world-name

  - id: browser-automation-helper-script
    desc: Browser automation helper script
    crit: notable
    conf: 0.95
    any:
      - id: playwright-capture-helper
      - id: browser-real-device-probe-helper

  - id: playwright-mcp-extension-context
    desc: Playwright MCP automation extension context
    crit: exception
    for: [javascript, typescript, json, chrome-manifest]
    all:
      - id: playwright-mcp-extension-name
      - id: playwright-mcp-extension-purpose

  - id: browser-device-emulation-context
    desc: Recognized Puppeteer device-emulation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: puppeteer-core-library-path
      - id: puppeteer-device-emulation-catalog

  - id: chrome-devtools-ad-catalog-context
    desc: Recognized Chrome DevTools ad-catalog context
    crit: exception
    conf: 0.99
    all:
      - id: puppeteer-core-library-path
      - id: chrome-devtools-ad-tracker-entity-catalog
