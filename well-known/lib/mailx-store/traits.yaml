# @bobfrankston/mailx-store is the local SQLite/message-body storage layer
# used by the mailx client.  Database, worker, MIME, and file operations here
# are storage mechanics, not collection or exfiltration objectives.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: mailx-store package metadata name
    if:
      type: value
      path: name
      exact: '@bobfrankston/mailx-store'

  - id: source-marker
    desc: mailx-store library source marker
    for: [javascript, typescript]
    if:
      type: text
      exact: '@bobfrankston/mailx-store'

  - id: mailparser-worker-dispatcher
    desc: mailx-store worker-thread mailparser dispatcher
    for: [javascript, typescript]
    if:
      type: text
      substr: Worker-thread-backed simpleParser dispatcher

  - id: mailparser-worker-entry
    desc: mailx-store dedicated mailparser worker thread
    for: [javascript, typescript]
    if:
      type: text
      substr: mailparser worker thread

composite_rules:
  - id: package-identity
    desc: Recognized mailx-store library package context
    crit: exception
    conf: 0.99
    for: [package.json, javascript, typescript]
    scope: archive
    any:
      - id: package-name
      - id: source-marker
