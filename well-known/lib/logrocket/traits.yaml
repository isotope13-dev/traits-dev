# LogRocket / lrkt-in session replay and RUM logger bundles.
# FP context: cookie helpers + fetch POST of telemetry resemble skimmers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.98
  size_max: 8000000

traits:
  - id: lrkt-cdn-logger-banner
    desc: LogRocket lrkt-in CDN logger banner
    crit: notable
    size_min: 1024
    if:
      type: text
      substr: 'cdn.lrkt-in.com/logger.min.js'

  - id: logrocket-product-marker
    desc: LogRocket product string marker
    crit: notable
    size_min: 1024
    if:
      type: text
      substr: 'LogRocket:'

composite_rules:
  - id: logrocket-logger-bundle
    desc: LogRocket session logger bundle
    crit: exception
    all:
      - id: lrkt-cdn-logger-banner
      - id: logrocket-product-marker
