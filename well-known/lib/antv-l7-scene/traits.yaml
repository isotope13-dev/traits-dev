# @antv/l7-scene is a benign AntV map-scene rendering library.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar]
  crit: notable
  conf: 0.99

traits:
  - id: package-name
    desc: AntV L7 Scene package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@antv/l7-scene'

  - id: package-repository
    desc: AntV L7 Scene repository identity
    for: [package.json]
    if:
      type: value
      path: repository.url
      exact: git@github.com:antvis/L7.git

  - id: archive-package-name
    desc: AntV L7 Scene npm archive name
    for: [npm, tar]
    if:
      type: value
      path: npm.name
      exact: '@antv/l7-scene'

  - id: archive-package-repository
    desc: AntV L7 Scene archive repository identity
    for: [npm, tar]
    if:
      type: value
      path: npm.repository.url
      exact: git@github.com:antvis/L7.git

composite_rules:
  - id: official-package
    desc: Official AntV L7 Scene package identity
    crit: notable
    for: [package.json]
    all:
      - id: package-name
      - id: package-repository

  - id: official-archive
    desc: Official AntV L7 Scene npm archive identity
    crit: notable
    for: [npm, tar]
    scope: archive
    all:
      - id: archive-package-name
      - id: archive-package-repository
