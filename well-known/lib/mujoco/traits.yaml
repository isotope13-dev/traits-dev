# MuJoCo's macOS native Python bindings are ordinary C++ extensions. Their
# compiler-generated __gcc_except_tab data can contain the ARM64 svc byte
# sequence that the generic direct-syscall rule is intended to find in tiny
# unsigned payloads.
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.99
  size_min: 512
  size_max: 500000000

traits:
  - id: mujoco-python-native-symbol
    desc: MuJoCo Python native binding symbol
    if:
      type: text
      substr: mujoco6python
      section: '__TEXT,__const'

  - id: mujoco-python-binding-diagnostic
    desc: MuJoCo Python binding diagnostic
    if:
      type: text
      substr: 'Python version mismatch: module was compiled for Python'
      section: '__TEXT,__cstring'

  - id: mujoco-python-error-symbol
    desc: MuJoCo Python error symbol
    if:
      type: text
      substr: __MUJOCO_ERROR_
      section: '__TEXT,__cstring'

composite_rules:
  - id: mujoco-python-native-identity
    desc: MuJoCo Python native identity
    crit: exception
    conf: 0.99
    any:
      - id: mujoco-python-native-symbol
      - id: mujoco-python-error-symbol

  - id: mujoco-native-extension-context
    desc: MuJoCo native extension context
    crit: exception
    conf: 0.99
    all:
      - id: mujoco-python-native-identity
      - id: mujoco-python-binding-diagnostic
      - id: metadata/signed/trust-level::adhoc
