# zmodemjs / ZMLIB — ZMODEM transfer helpers used by browser and Node
# terminal emulators. The ZDLE/XON/XOFF constants plus the strip/find helpers
# are the library's identity; they are not hostile by themselves.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
  size_min: 400
  size_max: 100000

traits:
  - id: zmodem-namespace-export
    desc: Zmodem module.exports namespace binding
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'var\s+Zmodem\s*=\s*module\.exports'

  - id: zmlib-zdle-constant
    desc: ZMODEM ZDLE escape constant
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\bZDLE\s*=\s*0x18\b'

  - id: zmlib-abort-sequence
    desc: ZMODEM five-CAN abort sequence
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'ABORT_SEQUENCE\s*:\s*\[\s*CAN\s*,\s*CAN\s*,\s*CAN\s*,\s*CAN\s*,\s*CAN\s*\]'

  - id: zmlib-strip-ignored-bytes
    desc: ZMLIB strip_ignored_bytes helper
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\bstrip_ignored_bytes\s*:\s*function\b'

composite_rules:
  - id: zmlib-library
    desc: ZMODEM ZMLIB JavaScript helper library
    crit: notable
    conf: 0.98
    all:
      - id: zmlib-zdle-constant
      - id: zmlib-abort-sequence
    any:
      - id: zmodem-namespace-export
      - id: zmlib-strip-ignored-bytes
