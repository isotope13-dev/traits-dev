defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.98
  size_max: 104857600

traits:
  - id: source-archive-basename
    desc: GNU C Library source archive
    for: [archive]
    if:
      type: path
      basename: true
      regex: '^glibc[-_][0-9][^\\/]*$'

  - id: source-tree-path
    desc: GNU C Library source tree path
    for: [c, cpp, makefile, shell]
    if:
      type: path
      regex: 'glibc-[0-9][^\\/]*[\\/]'

  # Identifies libc.so.6 itself — the object that *implements* the C library,
  # as opposed to anything that merely links against it. Keyed on the SONAME
  # rather than on the "GNU C Library" banner string because this is referenced
  # from a credential-dumping `unless:`: a banner string is one line for an
  # attacker to embed, whereas an LD_PRELOAD shim cannot claim SONAME libc.so.6
  # without displacing the real libc and breaking its own host process.
  - id: libc-soname
    desc: GNU C Library shared object (SONAME)
    for: [elf, so]
    if:
      type: value
      path: elf.soname
      regex: '^libc\.so\.[0-9]+$'

  - id: debian-release-banner-prefix
    desc: Debian GNU C Library banner prefix
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      substr: GNU C Library (Debian GLIBC

  - id: debian-release-banner-version
    desc: Debian GNU C Library release version
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: text
      section: .rodata
      regex: 'stable release version [0-9]+\.[0-9]+'

  - id: source-file-marker
    desc: GNU C Library source marker

    for: [c, cpp, elf, macho]
    if:
      type: text
      substr: GNU C Library

composite_rules:
  - id: debian-release-banner
    desc: Debian GNU C Library release banner
    crit: notable
    conf: 0.99
    for: [elf]
    all:
      - id: debian-release-banner-prefix
      - id: debian-release-banner-version
