# Dynamic Labs embedded-wallet / wallet-connection SDK (dynamic.xyz).
#
# Shipped as the `@dynamic-labs/*` and `@dynamic-labs-sdk/*` npm scopes and
# vendored into a great many dapp bundles. The chain packages legitimately do
# everything a drainer does — derive keypairs, build SOL/EVM transfers, sign
# transactions, talk to RPC endpoints, hold session secrets — so an analyst
# reading those behaviours in a bundle needs to know whose SDK produced them.
#
# Identity only: this deliberately suppresses nothing. A trojanized release of
# a wallet SDK is a realistic supply-chain scenario, so the wallet and drainer
# composites must keep evaluating on these files.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: npm-package-scope
    desc: Dynamic Labs SDK npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@dynamic-labs(-sdk)?/[a-z0-9.-]+$'

  - id: js-dynamic-client-factory
    desc: Dynamic Labs client factory call
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: createDynamicClient

  # Survives bundling: the scoped specifier stays verbatim in the emitted
  # require()/import of every published chunk and in its source map. Matched as
  # a whole string literal and anchored at both ends so it means "this module is
  # resolved here", not "the package is mentioned in a comment or a doc string".
  - id: js-dynamic-labs-module-specifier
    desc: Dynamic Labs SDK module specifier
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^@dynamic-labs(-sdk)?/[a-z0-9][a-z0-9./-]{1,40}$'

composite_rules:
  - id: dynamic-labs-wallet-sdk
    desc: Dynamic Labs embedded-wallet SDK
    for: [javascript, typescript, package.json]
    any:
      - id: npm-package-scope
      - id: js-dynamic-client-factory
      - id: js-dynamic-labs-module-specifier
