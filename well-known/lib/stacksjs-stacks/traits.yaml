# @stacksjs/* packages from the stacksjs/stacks monorepo.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, archives]
  crit: notable
  conf: 0.99

traits:
  - id: stacks-monorepo-repository
    desc: stacksjs stacks monorepo repository URL
    crit: notable
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/stacksjs/stacks(\.git)?'

  - id: stacks-scope-package-name
    desc: Stacks scoped npm package name
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@stacksjs/'

  - id: archive-path
    desc: stacksjs scoped npm archive path
    if:
      type: path
      regex: '(@stacksjs|skills|composables)-[0-9]'

composite_rules:
  - id: stacks-package-context
    desc: Stacks.js monorepo npm package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: stacks-scope-package-name
      - id: stacks-monorepo-repository
