# Visicom Media's "Dynamic Toolbar" / MyStart platform (Draze.com and other
# rebranded toolbars, ~2010-2012): a XUL/IE toolbar whose packed framework
# (dtxFramework) rewrites the homepage and keyword search, deletes the user's
# default engine, and serves sponsored coupon and search feeds from
# apps.mystart.com widgets.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.97

traits:
  - id: visicom-media-extension-creator
    desc: Visicom Media extension creator
    for: [xml, text]
    if:
      type: text
      substr: <em:creator>Visicom Media Inc.</em:creator>
  - id: mystart-widget-repository-host
    desc: MyStart toolbar widget repository host
    for: [xml, html, javascript]
    if:
      type: text
      substr: //apps.mystart.com/
  - id: visicom-coupon-syndication-feed
    desc: Visicom sponsored coupon syndication feed
    for: [javascript]
    if:
      type: text
      substr: shoppingsyndication.com/visicom/
  - id: dtx-framework-browser-switch
    desc: Visicom dtxFramework browser dispatch
    for: [javascript]
    if:
      type: text
      regex: '\bdtxFramework\.(IE|MOZILLA)\b'

composite_rules:
  # Named unwanted-software family: suspicious, never hostile (decision
  # 2026-09-26, see adkeeps). Family samples belong in the purgatory pool.
  - id: visicom-mystart-toolbar
    desc: Visicom MyStart search-hijacking toolbar
    crit: suspicious
    scope: archive
    attack: T1176
    all:
      - id: visicom-media-extension-creator
      - id: mystart-widget-repository-host
    any:
      - id: visicom-coupon-syndication-feed
      - id: dtx-framework-browser-switch
