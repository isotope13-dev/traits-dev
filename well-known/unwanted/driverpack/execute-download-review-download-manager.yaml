defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]


composite_rules:
  - id: winhttp-createprocess-installer-clues
    for: [pe]
    desc: DriverPack offer installer with WinHTTP and process-creation references
    crit: notable
    conf: 0.99
    all:
      - id: well-known/unwanted/driverpack::maombi-multi-offer-bundle-installer
      - id: metadata/binary/resource/manifest::winhttp-system32-manifest
      - id: metadata/binary/symbols/name/process::create-process-w
