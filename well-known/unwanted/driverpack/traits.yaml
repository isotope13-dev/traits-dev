# DriverPack's Maombi-signed offer installer contains several independently
# encrypted 7-Zip payloads and presents preselected third-party offers. The
# family signature requires both the verified product identity and the unusual
# multi-archive carrier shape; neither the signer nor DriverPack metadata alone
# is treated as unwanted.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: maombi-multi-offer-bundle-installer
    desc: Maombi-signed DriverPack multi-offer bundle installer
    crit: hostile
    conf: 0.995
    attack: T1027.009,T1204.002
    scope: outer
    all:
      - id: well-known/app/system/driverpack::maombi-signed-inno-installer
      - id: metadata/binary/layout::large-overlay-1mb
      - id: micro-behaviors/data/embedded/payload/archive::multiple-late-embedded-7z-archives
