# Gameograf is a named unwanted-software family/publisher. Generic new-tab
# promotion behavior remains under objectives/; this file supplies the stable
# publisher identity and its family verdict.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, html, crx]
  crit: component
  conf: 0.92

traits:
  - id: gameograf-bundled-play-shortcut
    desc: Bundles Gameograf play URL in shortcut array
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: tree-sitter
      query: |
        ((array (object (pair
          key: (property_identifier) @key
          value: (string (string_fragment) @url))))
        (#eq? @key "url")
        (#match? @url "^https?://play\\.gameograf\\.com/?$"))

  - id: gameograf-manifest-author
    crit: notable
    desc: Gameograf Chrome extension author
    for: [json, chrome-manifest]
    if:
      type: value
      path: author
      exact: Gameograf
      case_insensitive: true

  - id: gameograf-promo-host
    crit: notable
    desc: Gameograf promotional host URL
    for: [javascript, html]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

  # The same publisher backend as a manifest host permission: a pre-authorized
  # network pipe from the extension (including its background worker) to the
  # operator's server, so page content and search traffic can be served or
  # reported outside store review with no further consent prompt.
  - id: gameograf-backend-host-permission
    crit: notable
    desc: Gameograf publisher backend host permission
    for: [json, chrome-manifest]
    if:
      type: value
      path: host_permissions
      regex: '^https?://([^/"''\s]+\.)?gameograf\.com/'
      case_insensitive: true

composite_rules:
  # Bundled-shortcut variant of the known family's search page. Unlike the
  # backend variant, this ships the publisher's promotion in an array and
  # renders the links locally. Require that structural family evidence plus
  # the HTML sink and search-result navigation; a domain mention or ordinary
  # configured-engine search UI alone retains its existing verdict.
  - id: gameograf-bundled-shortcut-search-page
    desc: Gameograf bundled promotion and search-navigation page
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [javascript]
    all:
      - id: gameograf-bundled-play-shortcut
      - id: gameograf-newtab-search-page
      - id: micro-behaviors/ui/window/insert-html::jquery-appended-link-markup

  - id: gameograf-newtab-extension
    desc: Gameograf remote new-tab extension identity
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, html]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: gameograf-manifest-author
      - id: gameograf-promo-host

  - id: gameograf-promotional-newtab-pua
    desc: Gameograf promotional new-tab potentially unwanted extension
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, html]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: gameograf-manifest-author
      - id: gameograf-promo-host
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls

  # The publisher endpoint (api.gameograf.com/js/shortcuts.json) returns
  # shortcut tiles whose url/name/icon are interpolated into jQuery markup on
  # the new-tab page, so the publisher decides what the user's new tab links
  # to. Suspicious, not hostile (re-pitched 2026-09): the page is a Manifest V3
  # extension page under the default `script-src 'self'` CSP, so injected
  # markup cannot run script; what the feed controls is remote-pushed
  # promotion, the PUA behavior this family is named for. Requiring the family
  # host, parsed external JSON and the concrete HTML sink still keeps ordinary
  # remote catalogs and local jQuery templates out.
  - id: gameograf-remote-markup-injection
    desc: Gameograf feed pushes new-tab shortcut markup
    crit: suspicious
    conf: 0.98
    attack: T1189,T1059.007
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
    near_bytes: 4096

  # The bare manifest of the family shell. This does not claim a default-search
  # settings takeover (there is no chrome_settings_overrides here, and the
  # `search` grant alone only fronts queries through chrome.search.query).
  # The hostile behavior is the interception loop this manifest pre-authorizes
  # for a named unwanted family: every new tab renders the operator's page,
  # searches typed there run through the extension's grant, and a persistent
  # background worker executes without user interaction. Each leg is
  # benign-shaped alone; together with the family identity they are the
  # family's new-tab/search takeover shell, which carries the hostile verdict
  # even when the referenced scripts are not shipped alongside the manifest.
  - id: gameograf-newtab-search-shell
    desc: Gameograf persistent new-tab search takeover shell
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker

  # The armed variant of the shell above with a manifest host permission that
  # grants the persistent worker a pre-authorized pipe to the publisher backend
  # (api.gameograf.com). With it, the operator serves the new tab's content and
  # search destinations remotely and can re-decide both after store review
  # with no further consent prompt.
  - id: gameograf-newtab-search-backend-shell
    desc: Gameograf new-tab search shell with publisher backend pipe
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
      - id: gameograf-backend-host-permission

  # The script-side half of the takeover above: the family's new-tab page,
  # shipped without its manifest. It pins the publisher host into the page,
  # fronts the user's search interaction, and replaces the top frame with the
  # search API callback result. The direct flow leg below proves the API
  # result drives navigation, rather than independently counting a benign
  # search call and an unrelated location assignment.
  - id: gameograf-newtab-search-page
    desc: Gameograf new-tab page fronts user searches
    crit: suspicious
    conf: 0.93
    attack: T1176
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign

  # The armed script-side variant, the runtime half of the backend-shell
  # manifest rule above and the one a page-only corpus sample is convicted on
  # (verified hostile, 2026-10). The pipe is the hostile evidence, not the
  # family name, exactly as in the manifest verdict: this one page implements
  # the whole loop -- it interpolates the publisher backend's parsed JSON feed
  # into its own link markup (the operator decides what every new tab links
  # to, re-decidable after store review) while fronting every search the user
  # types through the extension's `search` grant and replacing the top frame
  # with the callback result. Either half alone keeps the PUA-shape suspicious
  # verdict of the 2026-09-26 decision: feed-driven markup without search
  # fronting is remote-pushed promotion (gameograf-remote-markup-injection),
  # and fronting without the operator feed is the sanctioned search-UI shape
  # (gameograf-newtab-search-page; see the removed-objective note in
  # objectives/impact/ui/manipulation/traffic/browser-extension-search.yaml
  # for why `chrome.search.query` by itself is not hijack evidence). Neither
  # of those rules is re-raised; this conjunction adds the backend pipe to
  # the fronting loop, the same step up the manifest rules take.
  - id: gameograf-newtab-search-backend-page
    desc: Gameograf new-tab page runs feed and search takeover loop
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
