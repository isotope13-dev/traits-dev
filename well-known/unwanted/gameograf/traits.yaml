# Gameograf is a named unwanted-software family/publisher. Generic new-tab
# promotion behavior remains under objectives/; this file supplies the stable
# publisher identity and its family verdict.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, html, crx]
  crit: component
  conf: 0.92

traits:
  - id: gameograf-promo-host
    crit: notable
    desc: Gameograf promotional host URL
    for: [javascript, html]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

composite_rules:
  # Script-side shape of the publisher's new-tab page: it renders the backend's
  # JSON shortcut feed as link markup and offers a search box backed by
  # chrome.search.query. That API runs the user's own configured engine and the
  # page navigates to its result -- ordinary new-tab behaviour, with feed
  # shortcuts the user can delete. This records family identity only; it is not
  # a takeover conviction (see objectives/ for search-provider overrides or
  # redirects of search traffic).
  - id: gameograf-newtab-search-backend-page
    desc: Gameograf new-tab page with backend shortcut feed and search box
    crit: notable
    conf: 0.95
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
