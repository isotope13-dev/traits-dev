# Gameograf is a named unwanted-software family/publisher. Generic new-tab
# promotion behavior remains under objectives/; this file supplies the stable
# publisher identity and its family verdict.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, html, crx]
  crit: component
  conf: 0.92

traits:
  - id: gameograf-promo-host
    crit: notable
    desc: Gameograf promotional host URL
    for: [javascript, html]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

  # A shortcut record, not a mention of the publisher host. The key is part of
  # the source text around the literal, so a literal-only host match cannot
  # express it.
  - id: gameograf-bundled-play-shortcut
    desc: Shortcut targets Gameograf play portal
    crit: notable
    conf: 0.95
    for: [javascript, html]
    if:
      type: text
      regex: 'url\s*:\s*["'']https?://play\.gameograf\.com/?["'']'
      case_insensitive: true

composite_rules:
  # Named unwanted-software family: suspicious, never hostile (decision
  # 2026-09-26, same as adkeeps/owhit). Family samples belong in the
  # purgatory pool; do not re-raise this for a hostile-labeled sample.
  # Legs flattened rather than chained (chained archive-scoped composites
  # resolved inconsistently and the verdict missed matching samples; see the
  # same note on owhit-promotional-newtab-pua). Unit42 tracks this publisher
  # as a wallpaper-adware campaign: forced install landing page, operator
  # uninstall URL, remote-injected popups, wholesale IndexedDB resets.
  - id: gameograf-promotional-newtab-pua
    desc: Gameograf promotional new-tab potentially unwanted extension
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: gameograf-promo-host
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls

  # Manifest-only shell of the same publisher. The PUA composite above stays
  # suspicious and still needs the promo host plus install/uninstall URLs,
  # which live in the scripts. A scan of this manifest alone has neither.
  #
  # This does not claim a default-search settings takeover: there is no
  # chrome_settings_overrides, and the search grant only fronts queries
  # through chrome.search.query. The hostile evidence is the conjunction the
  # manifest pre-authorizes for this publisher: every new tab is the
  # operator's page, searches typed there run under the extension grant, and
  # a service worker stays resident. Each leg is ordinary alone.
  #
  # The reviewed store wallpaper line (1.1.1, 1.1.12) carries a patch
  # component and declares only the search grant. A one- or two-component
  # version (3, 3.2) is this shell: every dotted version is too wide a
  # suppressor, because 3.2 still matches a conventional dotted version.
  # A patch-version build that also declares alarms is not that line; see
  # gameograf-newtab-alarm-shell.
  - id: gameograf-newtab-search-shell
    desc: Gameograf new-tab shell without patch version
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
    unless:
      - id: metadata/package/version::extension-patch-version

  # Same publisher shell as gameograf-newtab-search-shell, including builds
  # whose version looks like the store line. The reviewed wallpaper manifests
  # request search only, so the new-tab page can call chrome.search.query.
  # Alarms is the extra grant: the service worker can wake on a schedule
  # after the tab closes. Each leg is ordinary alone; the store line does
  # not declare this one.
  - id: gameograf-newtab-alarm-shell
    desc: Gameograf new-tab shell can schedule alarms
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
      - id: metadata/permission/alarm::permission-alarms

  # Script-side shape of the publisher's new-tab page: it renders the backend's
  # JSON shortcut feed as link markup and offers a search box backed by
  # chrome.search.query. That API runs the user's own configured engine and the
  # page navigates to its result -- ordinary new-tab behaviour, with feed
  # shortcuts the user can delete. This records family identity only; it is not
  # a takeover conviction (see objectives/ for search-provider overrides or
  # redirects of search traffic).
  - id: gameograf-newtab-search-backend-page
    desc: Gameograf new-tab page with backend shortcut feed and search box
    crit: notable
    conf: 0.95
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation

  # Both halves, plus the shortcut catalog itself. The catalog is interpolated
  # into live anchors, so the operator can change every new-tab link after
  # review, and chrome.search.query then replaces the top frame with the
  # callback's first result. A feed or a search box alone stays the notable
  # identity above. Reviewed store wallpaper releases (1.1.1, 1.1.12) carry a
  # patch component; that manifest downgrades this verdict inside the package.
  # A page scanned on its own, and an unpatched shell (3, 3.2), keep it.
  - id: gameograf-newtab-feed-search-takeover
    desc: Gameograf catalog feed and search replace the new tab
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
    downgrade:
      scope: archive
      any:
        - id: metadata/package/version::extension-patch-version

  # Script-only bundled-shortcut page. gameograf-newtab-search-backend-page
  # stays notable: a fetched shortcut feed plus chrome.search.query is the
  # publisher's ordinary search box, and that API alone is not a hijack.
  # gameograf-promotional-newtab-pua stays the manifest-lifecycle PUA verdict
  # and is not re-raised here. This page instead compiles the play portal into
  # a default shortcut record, parses shortcut records into live anchors
  # through an HTML-append sink, and replaces the top frame with the search
  # callback's first result URL. Each of those is insufficient alone.
  - id: gameograf-bundled-shortcut-page
    desc: Gameograf bundled play-portal shortcut page
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [javascript]
    all:
      - id: gameograf-bundled-play-shortcut
      - id: micro-behaviors/ui/window/insert-html::jquery-appended-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
