# Gameograf is a named unwanted-software family/publisher. Generic new-tab
# promotion behavior remains under objectives/; this file supplies the stable
# publisher identity and its family verdict.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, html, crx]
  crit: component
  conf: 0.92

traits:
  # The extension manifest grants its background worker access to Gameograf's
  # API host. Keep this separate from references in page content: a manifest
  # host permission is the configured remote channel for the extension.
  - id: gameograf-api-host-permission
    crit: notable
    desc: Gameograf API host permission
    for: [chrome-manifest]
    if:
      type: value
      path: host_permissions
      substr: api.gameograf.com

  - id: gameograf-promo-host
    crit: notable
    desc: Gameograf promotional host URL
    for: [javascript, html]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

  # A shortcut record, not a mention of the publisher host. The key is part of
  # the source text around the literal, so a literal-only host match cannot
  # express it.
  - id: gameograf-bundled-play-shortcut
    desc: Shortcut targets Gameograf play portal
    crit: notable
    conf: 0.95
    for: [javascript, html]
    if:
      type: text
      regex: 'url\s*:\s*["'']https?://play\.gameograf\.com/?["'']'
      case_insensitive: true

# Identity and monetization are independent of a malware verdict. A new-tab
# override, configured-engine search, shortcut feed and HTML rendering do not
# establish search hijacking. Version numbers and store metadata do not change
# the meaning of those operations.
composite_rules:
  - id: gameograf-promotional-newtab-pua
    desc: Gameograf promotional new-tab potentially unwanted extension
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: gameograf-promo-host
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls

  - id: gameograf-newtab-search-shell
    desc: Gameograf new-tab search and worker manifest
    crit: notable
    conf: 0.95
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker

  # The named Gameograf adware family has a documented affiliate-opening
  # behavior. Its manifest-only search setup combines a new-tab takeover with
  # the search dispatch grant held by a persistent worker, allowing the family
  # to issue browser searches outside the visible page. Keep generic new-tab
  # and search declarations notable; this family-bound configuration is the
  # attack-specific evidence. In a complete archive the shipped scripts are
  # available for direct behavior analysis, so downgrade this manifest finding.
  - id: gameograf-background-search-dispatch
    desc: Gameograf adware configures background browser search dispatch
    crit: hostile
    conf: 0.96
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-worker-search-grant
      - id: metadata/permission/manifest::extension-google-update-url
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # A minimal manifest can establish the takeover behavior without declaring
  # the publisher API host: it replaces every new tab and grants its resident
  # worker the browser search API. In the known Gameograf extension family
  # (Unit 42-documented adware that opens affiliate URLs without user
  # interaction), this Google-updated configuration is the search-control
  # payload itself, not merely a configured search provider. A complete
  # package ships the declared scripts and they are judged on their own, so
  # the same configuration downgrades there (see below).
  - id: gameograf-newtab-search-control
    desc: Gameograf takes over new tabs and controls browser searches
    # Replacing the new-tab page and granting the search API describe a
    # configurable extension interface. These manifest fields do not prove
    # forced search redirection or another hostile result.
    crit: notable
    conf: 0.95
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
      - id: metadata/permission/manifest::extension-google-update-url
    # A Gameograf API host grant adds a configured remote channel; it does not
    # negate the new-tab takeover and search dispatch authority established by
    # the other required manifest fields. Keep this finding on API-enabled
    # manifests too. Complete extension packages still reach the archive
    # downgrades below when their shipped contents supply benign context.
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # These manifest fields declare a worker, search and alarm permissions,
  # and access to the publisher API. They do not establish that the worker is
  # present or dispatches searches, so report the configuration as notable.
  - id: gameograf-remote-background-search-control
    desc: Gameograf manifest declares background search and API access
    crit: notable
    conf: 0.96
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-worker-search-grant
      - id: metadata/permission/alarm::permission-alarms
      - id: gameograf-api-host-permission
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # Hostile family verdict for the self-updating remote search-control
  # configuration. Beyond the resident dispatcher (a background worker holding
  # the search grant, which can issue searches with no tab open and no user
  # gesture), its schedule (alarms permission) and its publisher channel (a
  # dedicated API host grant), this manifest carries its own update URL, so
  # the publisher can silently replace the extension's behavior outside store
  # review. That combination — every new tab replaced, searches dispatchable
  # in the background on a schedule, a configured remote channel, and an
  # out-of-store update channel, all under the documented Gameograf
  # unwanted-family identity (Unit 42 adware opening affiliate URLs without
  # user interaction) — is the campaign control setup, not a merely configured
  # search provider. The update-channel leg is what separates this verdict
  # from the notable configuration findings above. Complete packages ship the
  # declared scripts and are judged on their own code, so this verdict
  # downgrades in archive scope when shipped members supply that context; the
  # manifest-only campaign configuration keeps the hostile verdict here.
  - id: gameograf-self-updating-background-search-control
    desc: Gameograf self-updating background search control
    crit: hostile
    conf: 0.96
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-worker-search-grant
      - id: metadata/permission/alarm::permission-alarms
      - id: gameograf-api-host-permission
      - id: metadata/permission/manifest::extension-google-update-url
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # These manifest fields identify a Gameograf new-tab extension configured
  # for search and its API. They do not establish the campaign behaviors of
  # opening affiliate URLs without user interaction or tracking uninstall
  # events, so keep this configuration finding at notable criticality.
  - id: gameograf-api-enabled-newtab-search-manifest
    desc: Gameograf API-enabled new-tab and search manifest
    crit: notable
    conf: 0.96
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
      - id: gameograf-api-host-permission
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # The new-tab override, background-worker search grant, and API host
  # permission describe requested capabilities. Without worker code or other
  # behavioral evidence, this combination does not establish a takeover.
  - id: gameograf-background-search-takeover
    desc: Gameograf manifest declares background search and publisher API access
    crit: notable
    conf: 0.96
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-worker-search-grant
      - id: gameograf-api-host-permission
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # The API-enabled manifest above is a configuration observation by itself.
  # This narrower combination identifies the known Gameograf search-takeover
  # behavior: the extension replaces every new tab, requests the browser's
  # search API, schedules background work, and grants its worker access to the
  # publisher API. These are manifest-declared capabilities; the author
  # identity ties this specific remote search-control configuration to the
  # known unwanted family.
  - id: gameograf-newtab-search-backend-page
    desc: Gameograf JSON feed, markup and search APIs
    crit: notable
    conf: 0.95
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation

  # Archive scope permits fetch and rendering in different scripts. This is
  # co-occurrence of family features, not proof of a feed-to-search data flow.
  - id: gameograf-newtab-feed-search-page
    desc: Gameograf feed, link markup and search APIs
    crit: notable
    conf: 0.95
    scope: archive
    for: [javascript, crx, xpi, zip]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
    any:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response

  - id: gameograf-bundled-shortcut-page
    desc: Gameograf play shortcut with search navigation
    crit: notable
    conf: 0.95
    for: [javascript]
    all:
      - id: gameograf-bundled-play-shortcut
      - id: micro-behaviors/ui/window/insert-html::jquery-appended-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation

  # The campaign's publisher-operated API is an externally controlled content
  # channel for its replacement new-tab page. Require the author identity,
  # worker, new-tab override and exact API host together; a new-tab page or API
  # grant by itself is ordinary extension configuration. This is a family
  # identity finding for the known remote-content adware variant, rather than
  # a claim that the manifest proves a particular payload executed.
  - id: gameograf-remote-newtab-content-channel
    desc: Gameograf adware exposes its replacement new tab to a remote content channel
    crit: hostile
    conf: 0.96
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-service-worker
      - id: gameograf-api-host-permission
