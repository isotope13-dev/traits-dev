# Unit42 documents Gameograf's wallpaper promotion/adware campaign.
# Require its own manifest identity plus promotion and remote link markup;
# a URL mention or an unrelated extension using jQuery cannot identify it.
# This version labels ads and uses textContent for popup text. It still
# refreshes operator-selected shortcuts and interpolates their record fields.
defaults:
  for: [crx, zip, chrome-manifest, javascript]
  platforms: [unix, windows]
composite_rules:
  - id: remote-shortcut-adware
    desc: Gameograf wallpaper adware with remote shortcut markup
    crit: hostile
    conf: 0.97
    ref: https://raw.githubusercontent.com/PaloAltoNetworks/Unit42-timely-threat-intel/refs/heads/main/2026-06-01-Adware-Wallpaper-Chrome-Extension-Campaign.txt
    scope: archive
    all:
      - id: well-known/unwanted/gameograf::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/communications/url/host/name::gameograf-url
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls
      - id: micro-behaviors/communications/url/resource-path/content::remote-extension-catalog-url
      - id: micro-behaviors/ui/window/markup::record-icon-enters-image-source-attribute
