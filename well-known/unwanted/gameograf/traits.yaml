# Gameograf is a named unwanted-software family/publisher. Generic new-tab
# promotion behavior remains under objectives/; this file supplies the stable
# publisher identity and its family verdict.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, html, crx]
  crit: component
  conf: 0.92

traits:
  # The extension manifest grants its background worker access to Gameograf's
  # API host. Keep this separate from references in page content: a manifest
  # host permission is the configured remote channel for the extension.
  - id: gameograf-api-host-permission
    crit: notable
    desc: Gameograf API host permission
    for: [chrome-manifest]
    if:
      type: value
      path: host_permissions
      substr: api.gameograf.com

  - id: gameograf-promo-host
    crit: notable
    desc: Gameograf promotional host URL
    for: [javascript, html]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

  # A shortcut record, not a mention of the publisher host. The key is part of
  # the source text around the literal, so a literal-only host match cannot
  # express it.
  - id: gameograf-bundled-play-shortcut
    desc: Shortcut targets Gameograf play portal
    crit: notable
    conf: 0.95
    for: [javascript, html]
    if:
      type: text
      regex: 'url\s*:\s*["'']https?://play\.gameograf\.com/?["'']'
      case_insensitive: true

# Identity and monetization are independent of a malware verdict. A new-tab
# override, configured-engine search, shortcut feed and HTML rendering do not
# establish search hijacking. Version numbers and store metadata do not change
# the meaning of those operations.
composite_rules:
  - id: gameograf-promotional-newtab-pua
    desc: Gameograf promotional new-tab potentially unwanted extension
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: gameograf-promo-host
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls

  - id: gameograf-newtab-search-shell
    desc: Gameograf new-tab search and worker manifest
    crit: notable
    conf: 0.95
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker

  # A minimal manifest can establish the takeover behavior without declaring
  # the publisher API host: it replaces every new tab and grants its resident
  # worker the browser search API. In the known Gameograf extension family,
  # this Google-updated extension is the search-control payload itself, not
  # merely a configured search provider or a promotional page reference.
  - id: gameograf-newtab-search-control
    desc: Gameograf takes over new tabs and controls browser searches
    crit: hostile
    conf: 0.95
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
      - id: metadata/permission/manifest::extension-google-update-url
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  # Same manifest shape as gameograf-newtab-search-shell, plus the campaign
  # API host. chrome.search.query uses the configured engine, so this is not
  # a default-search settings takeover. The hostile evidence is the bare
  # shell: every new tab is the operator page, searches run under the
  # extension grant, a service worker stays resident, and the worker is
  # pre-authorized to the publisher API, while the declared scripts are not
  # in the scan. A complete package ships those scripts and they are judged
  # on their own, so the same bundle downgrades to suspicious there.
  - id: gameograf-adware-newtab-search-extension
    desc: Gameograf new-tab search campaign bundle
    crit: hostile
    conf: 0.96
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker
      - id: gameograf-api-host-permission
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
        - id: gameograf-promotional-newtab-pua

  - id: gameograf-newtab-search-backend-page
    desc: Gameograf JSON feed, markup and search APIs
    crit: notable
    conf: 0.95
    for: [javascript]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation

  # Archive scope permits fetch and rendering in different scripts. This is
  # co-occurrence of family features, not proof of a feed-to-search data flow.
  - id: gameograf-newtab-feed-search-page
    desc: Gameograf feed, link markup and search APIs
    crit: notable
    conf: 0.95
    scope: archive
    for: [javascript, crx, xpi, zip]
    all:
      - id: gameograf-promo-host
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/ui/window/insert-html::jquery-interpolated-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-query
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
    any:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response

  - id: gameograf-bundled-shortcut-page
    desc: Gameograf play shortcut with search navigation
    crit: notable
    conf: 0.95
    for: [javascript]
    all:
      - id: gameograf-bundled-play-shortcut
      - id: micro-behaviors/ui/window/insert-html::jquery-appended-link-markup
      - id: micro-behaviors/browser-extension/lifecycle::chrome-search-result-navigation
