# Gameograf is the named unwanted-software family/publisher. Generic new-tab
# promotion behavior is modeled under objectives/; this file contributes only
# the identity evidence and the family verdict that combines it with that
# behavior.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, crx]
  crit: component
  conf: 0.92

traits:
  - id: gameograf-manifest-author
    desc: Gameograf Chrome extension author
    for: [json, chrome-manifest]
    if:
      type: value
      path: author
      exact: Gameograf

  - id: gameograf-promo-host
    desc: Gameograf host URL in extension code
    for: [javascript, typescript]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

composite_rules:
  - id: gameograf-newtab-extension
    desc: Gameograf new-tab extension identity
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: gameograf-manifest-author
      - id: gameograf-promo-host

  # The publisher repeatedly ships the same wallpaper/new-tab shell with a
  # forced install landing page and an operator-controlled uninstall URL. The
  # generic promotion inference belongs to objectives/impact/ui/manipulation;
  # publisher identity upgrades that behavior to this named PUA family.
  - id: gameograf-promotional-newtab-pua
    desc: Gameograf promotional new-tab potentially unwanted extension
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: gameograf-newtab-extension
      - id: objectives/impact/ui/manipulation/core::newtab-install-uninstall-lifecycle-navigation
