# Gameograf is a named unwanted-software publisher. Generic new-tab promotion
# stays under objectives/; this file is the publisher identity and the family
# verdict that joins it to the detached campaign manifest.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest]
  crit: notable
  conf: 0.95

traits:
  # A manifest host permission is the extension's configured remote channel,
  # distinct from a page that merely mentions the publisher host.
  - id: gameograf-api-host-permission
    desc: Gameograf API host permission
    for: [chrome-manifest]
    if:
      type: value
      path: host_permissions
      substr: api.gameograf.com

composite_rules:
  # Publisher, new-tab replacement, search grant and a resident worker. This
  # is the extension's declared shell; it does not by itself prove that the
  # worker dispatches searches.
  - id: gameograf-newtab-search-shell
    desc: Gameograf new-tab search shell
    conf: 0.95
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker

  # Detached campaign manifest, scanned with no implementation beside it.
  # It replaces every new tab and leaves search dispatch with a resident
  # worker: chrome.search.query can run with no tab open and no user gesture.
  # The worker is granted the publisher API, alarms schedule that work, and
  # storage holds the remote feed. The Google update URL is how the publisher
  # refreshes the worker. Wallpaper-catalog grants are a subset of these
  # legs, so they cannot exclude this configuration. A package that ships the
  # declared scripts is judged on those scripts; the finding downgrades there.
  - id: gameograf-remote-periodic-background-search
    desc: Gameograf periodic background search control
    crit: suspicious
    conf: 0.96
    attack: T1176
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-worker-search-grant
      - id: metadata/permission/manifest::extension-google-update-url
      - id: gameograf-api-host-permission
      - id: metadata/permission/alarm::permission-alarms
      - id: metadata/permission/storage::permission-storage
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/archive-member::archive-js-member
        - id: metadata/package/files/archive-shape::extension-ships-script-member
        - id: metadata/file/format/browser-extension::web-extension-root-manifest
