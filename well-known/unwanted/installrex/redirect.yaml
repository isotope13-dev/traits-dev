# getapplicationmy.info is associated with InstallRex/TixDll adware:
# https://www.zscaler.com/blogs/security-research/beware-skype-adware
# https://any.run/report/cc4f79b5340db4ff5de7e0dc26b25a65b7c0fc810d4bd3b2a609ad007fd8711a/f9d1c4a2-34f3-4115-bf14-5059a944a9cb
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: installrex-affiliate-url-prefix
    desc: InstallRex affiliate tracking URL prefix
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?://([a-z0-9-]{1,63}\.)?getapplicationmy\.info/\?affiliate_id='
composite_rules:
  - id: installrex-affiliate-tracking-profile
    desc: InstallRex affiliate and device tracking profile
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/query::installer-affiliate-query
      - id: micro-behaviors/communications/http/query::installer-hardware-query
      - id: micro-behaviors/communications/http/query::installer-instance-query
    any:
      - id: installrex-affiliate-url-prefix
  - id: installrex-browser-tracking-redirect
    desc: Browser redirects to InstallRex tracking
    crit: suspicious
    conf: 0.96
    all:
      - id: installrex-affiliate-tracking-profile
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
