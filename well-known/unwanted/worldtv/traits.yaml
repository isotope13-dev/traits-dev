# WorldTv Android app (com.makinggames.worldtv), version 1.3.
# This build combines its own persisted ad timer and screen-state check with
# interstitial ad launches. The same package has public adware reporting; the
# signature below uses APK contents and behavior rather than its corpus path.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98

traits:
  - id: package-namespace
    desc: WorldTv Android package namespace
    if:
      type: text
      substr: com/makinggames/worldtv/

  - id: remote-settings-url
    desc: WorldTv remote ad-settings endpoint
    if:
      type: text
      substr: cdn.partycross.com/com.makinggames.worldtv/settings.txt

composite_rules:
  - id: worldtv-application
    desc: WorldTv Android application identity
    for: [android_apk, zip, dex]
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: package-namespace
      - id: remote-settings-url

  - id: worldtv-persisted-interstitial-adware
    desc: WorldTv schedules interstitial ads while the screen is active
    for: [android_apk, zip, dex]
    crit: suspicious
    conf: 0.98
    scope: outer
    all:
      - id: worldtv-application
      - id: micro-behaviors/time/schedule/interval::android-persisted-job-schedule
      - id: micro-behaviors/hardware/display/state::android-screen-interactive-check
      - id: micro-behaviors/ui/window/advertising::android-interstitial-ad-api
      - id: micro-behaviors/os/event/trigger::android-user-present-action
