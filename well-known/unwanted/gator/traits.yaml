# Trickler / Gator (Claria) adware downloader.
# This early-2000s PUP fetches advertising payloads from trickle.gator.*
# infrastructure and installs Browser Helper Object hijacks. Variants use
# UPX-named sections, sometimes with the UPX header modified or removed.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 5242880
  mbc: F0012

traits:
  - id: gator-install-routine-marker
    desc: Gator installation routine marker
    crit: component
    conf: 0.99
    if:
      type: text
      exact: InstallGator
      section: UPX1

  - id: trickler-original-filename
    desc: 'trickler original filename'
    crit: component
    conf: 0.99
    if:
      type: text
      exact: Trickler.exe
      section: .rdata

  - id: trickle-gator-c2-host
    desc: trickle.gator.com Gator/Claria C2 host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exact: trickle.gator.com
      section: .rdata

  # Trickler builds may rewrite the TLD (e.g. .bla) while keeping the
  # trickle.gator label in appended PE data. Mix pe+data so the string is
  # not forced into a PE section clamp that would miss it.
  - id: trickle-gator-c2-label
    desc: trickle.gator C2 hostname label
    crit: suspicious
    conf: 0.99
    attack: T1071.001
    for: [pe, data]
    if:
      type: text
      regex: '(?i)trickle\.gator\.[a-z]{2,8}\b'

  - id: gator-com-host
    desc: gator.com adware host reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[a-z0-9-]{1,32}\.gator\.com\b'
      section: .rdata

  - id: gator-trickler-log-marker
    desc: Gator Trickler log filename
    crit: component
    conf: 0.99
    if:
      type: text
      exact: GatorTrickler.log
      section: UPX1

  - id: gator-offer-install-marker
    desc: Gator bundled-offer installation marker
    crit: component
    conf: 0.98
    if:
      type: text
      exact: InstallOffers
      section: UPX1

  - id: gator-trickler-inf-marker
    desc: Gator Trickler installer definition
    crit: component
    conf: 0.98
    if:
      type: text
      exact: trickler.inf
      section: UPX1

  - id: gator-divxenc-masquerade
    desc: Gator fake divxenc.exe version resource name
    crit: component
    conf: 0.96
    attack: T1036.005
    if:
      type: text
      exact: divxenc.exe
      section: .rsrc

composite_rules:
  - id: trickler-gator-downloader
    desc: Trickler/Gator adware downloader bundle
    crit: hostile
    conf: 0.995
    attack: T1071.001
    all:
      - id: trickler-original-filename
      - id: trickle-gator-c2-host

  - id: gator-trickler-installer
    desc: Gator Trickler adware installer
    crit: hostile
    conf: 0.995
    attack: T1105,T1547.001
    all:
      - id: gator-install-routine-marker
      - id: gator-trickler-log-marker
    any:
      - id: gator-offer-install-marker
      - id: gator-trickler-inf-marker
      - id: gator-com-host
      - id: trickle-gator-c2-label

  # UPX-sectioned Trickler retains a C2 label and a Gator-specific resource;
  # require both so a lone hostname string or generic UPX layout cannot convict.
  - id: gator-upx-trickle-c2-packer
    desc: UPX-sectioned Gator Trickler C2 stub
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1027.002
    all:
      - id: trickle-gator-c2-label
      - id: metadata/binary/section/names::upx-section
      - id: gator-divxenc-masquerade

  - id: gator-upx-trickle-network-stub
    desc: UPX-sectioned Gator Winsock stub
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1027.002
    all:
      - id: trickle-gator-c2-label
      - id: metadata/binary/section/names::upx-section-pair
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
