# Trickler / Gator (Claria) adware downloader.
# This early-2000s PUP retrieves advertising offers, updates itself, and can
# register itself for startup. Variants retain UPX-named sections even after
# unpacking, so those names establish build lineage rather than active packing.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 5242880

traits:
  - id: gator-install-routine-marker
    desc: Gator installation routine marker
    crit: component
    conf: 0.99
    if:
      type: text
      exact: InstallGator
      section: UPX1

  - id: trickler-original-filename
    desc: 'trickler original filename'
    crit: component
    conf: 0.99
    if:
      type: text
      exact: Trickler.exe
      section: .rdata

  - id: trickle-gator-update-host
    desc: Gator Trickler update hostname
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exact: trickle.gator.com
      section: .rdata

  # Trickler test builds may use a non-resolving TLD (e.g. .bla) while keeping
  # the product-specific server label in appended PE data. Mix pe+data so the
  # value is not forced into a PE section clamp that would miss the overlay.
  - id: trickle-gator-server-value
    desc: Configured Gator Trickler server value
    crit: suspicious
    conf: 0.99
    attack: T1071.001
    for: [pe, data]
    if:
      type: text
      regex: '(?i)trickle\.gator\.[a-z]{2,8}\b'

  - id: gator-com-host
    desc: gator.com adware host reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[a-z0-9-]{1,32}\.gator\.com\b'
      section: .rdata

  - id: gator-trickler-log-marker
    desc: Gator Trickler log filename
    crit: component
    conf: 0.99
    if:
      type: text
      exact: GatorTrickler.log
      section: UPX1

  - id: gator-offer-install-marker
    desc: Gator bundled-offer installation marker
    crit: component
    conf: 0.98
    if:
      type: text
      exact: InstallOffers
      section: UPX1

  - id: gator-trickler-inf-marker
    desc: Gator Trickler installer definition
    crit: component
    conf: 0.98
    if:
      type: text
      exact: trickler.inf
      section: UPX1

  - id: gator-divxenc-resource-name
    desc: Gator build divxenc.exe resource name
    crit: component
    conf: 0.96
    if:
      type: text
      exact: divxenc.exe
      section: .rsrc

composite_rules:
  - id: trickler-gator-downloader
    desc: Trickler/Gator adware downloader bundle
    crit: hostile
    conf: 0.995
    attack: T1071.001
    all:
      - id: trickler-original-filename
      - id: trickle-gator-update-host

  - id: gator-trickler-installer
    desc: Gator Trickler adware installer
    crit: hostile
    conf: 0.995
    all:
      - id: gator-install-routine-marker
      - id: gator-trickler-log-marker
    any:
      - id: gator-offer-install-marker
      - id: gator-trickler-inf-marker
      - id: gator-com-host
      - id: trickle-gator-server-value

  # This unpacked DivX-associated build retains UPX section names. Require the
  # product-specific server value and resource name so layout alone cannot fire.
  - id: gator-upx-divx-build
    desc: Gator Trickler UPX-layout DivX build
    crit: hostile
    conf: 0.99
    attack: T1071.001
    all:
      - id: trickle-gator-server-value
      - id: metadata/binary/section/names::upx-section
      - id: gator-divxenc-resource-name

  - id: gator-upx-legacy-winsock-build
    desc: Gator Trickler legacy Winsock build
    crit: hostile
    conf: 0.99
    attack: T1071.001
    all:
      - id: trickle-gator-server-value
      - id: metadata/binary/section/names::upx-section-pair
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
