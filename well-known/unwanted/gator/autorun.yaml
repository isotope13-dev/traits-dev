---
composite_rules:
- id: gator-run-key-persistence
  platforms:
  - windows
  for:
  - pe
  - dll
  desc: Gator Trickler configures Run-key autostart
  crit: hostile
  conf: 0.99
  all:
  - id: well-known/unwanted/gator::gator-install-routine-marker
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  attack: T1547.001,T1112
