# Sendori / RadPlayer / MyRadioPlayer adware helpers (Dyn / Dynamic Network
# Services). Elevated controllers start/stop RadPlayerV1; RegisterLSP helpers
# install myradioplayer.dll as a Winsock layered service provider (SendoriDNS).
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 8192
  size_max: 2097152

traits:
  - id: radplayer-product-name
    desc: RadPlayer product version identity
    if:
      type: value
      path: pe.version.product_name
      exact: RadPlayer

  - id: radplayer-elevated-controller-description
    desc: RadPlayer elevated controller description
    if:
      type: value
      path: pe.version.description
      exact: RadPlayer Elevated Service Controller

  - id: radplayer-control-original-filename
    desc: RadPlayerControl original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: RadPlayerControl.exe

  - id: dyn-network-services-copyright
    desc: Dynamic Network Services copyright
    if:
      type: value
      path: pe.version.copyright
      regex: 'Dynamic Network Services'

  - id: radplayer-v1-service-name
    desc: RadPlayerV1 Windows service name
    if:
      type: text
      exact: RadPlayerV1
      section: .rdata

  - id: register-lsp-description
    desc: RegisterLSP file description identity
    if:
      type: value
      path: pe.version.description
      exact: RegisterLSP

  - id: myradioplayer-company
    desc: myradioplayer company version identity
    if:
      type: value
      path: pe.version.company
      exact: myradioplayer

  - id: myradioplayer-dll-name
    desc: myradioplayer.dll provider module name
    if:
      type: text
      exact: myradioplayer.dll
      section: .data

  - id: software-detector-rtti
    desc: CSoftwareDetector RTTI class name
    if:
      type: text
      exact: .?AVCSoftwareDetector@@
      section: .data

composite_rules:
  - id: radplayer-elevated-service-controller
    desc: RadPlayer elevated adware service helper
    crit: hostile
    conf: 0.98
    all:
      - id: radplayer-product-name
      - id: radplayer-elevated-controller-description
      - id: radplayer-v1-service-name

  - id: sendori-dyn-radplayer-control
    desc: Dyn/Sendori RadPlayerControl adware helper
    crit: hostile
    conf: 0.97
    all:
      - id: radplayer-control-original-filename
      - id: dyn-network-services-copyright
      - id: radplayer-v1-service-name
      - id: micro-behaviors/os/service/control::start-service

  - id: sendori-winsock-lsp-registrar
    desc: Sendori myradioplayer Winsock LSP registrar
    crit: hostile
    conf: 0.98
    all:
      - id: register-lsp-description
      - id: myradioplayer-company
      - id: myradioplayer-dll-name
      - id: micro-behaviors/communications/socket/lsp::wsc-install-provider

  - id: sendori-lsp-av-environment-probe
    desc: Sendori LSP registrar probes security products
    crit: hostile
    conf: 0.97
    all:
      - id: sendori-winsock-lsp-registrar
      - id: software-detector-rtti
      - id: micro-behaviors/os/security/product::antivirus-product-term
