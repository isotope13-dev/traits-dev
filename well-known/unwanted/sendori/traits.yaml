# Sendori / RadPlayer / MyRadioPlayer adware helpers (Dyn / Dynamic Network
# Services). Elevated controllers start and stop the RadPlayerV1 service used by
# the adware stack; AV catalogs this family as SendoriDNS / PUP.MyRadioPlayer.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 8192
  size_max: 524288

traits:
  - id: radplayer-product-name
    desc: RadPlayer product version identity
    if:
      type: value
      path: pe.version.product_name
      exact: RadPlayer

  - id: radplayer-elevated-controller-description
    desc: RadPlayer elevated controller description
    if:
      type: value
      path: pe.version.description
      exact: RadPlayer Elevated Service Controller

  - id: radplayer-control-original-filename
    desc: RadPlayerControl original filename
    if:
      type: value
      path: pe.version.original_filename
      exact: RadPlayerControl.exe

  - id: dyn-network-services-copyright
    desc: Dynamic Network Services copyright
    if:
      type: value
      path: pe.version.copyright
      regex: 'Dynamic Network Services'

  - id: radplayer-v1-service-name
    desc: RadPlayerV1 Windows service name
    if:
      type: text
      exact: RadPlayerV1
      section: .rdata

composite_rules:
  - id: radplayer-elevated-service-controller
    desc: RadPlayer elevated adware service helper
    crit: hostile
    conf: 0.98
    all:
      - id: radplayer-product-name
      - id: radplayer-elevated-controller-description
      - id: radplayer-v1-service-name

  - id: sendori-dyn-radplayer-control
    desc: Dyn/Sendori RadPlayerControl adware helper
    crit: hostile
    conf: 0.97
    all:
      - id: radplayer-control-original-filename
      - id: dyn-network-services-copyright
      - id: radplayer-v1-service-name
      - id: micro-behaviors/os/service/control::start-service
