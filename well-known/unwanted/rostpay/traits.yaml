# ROSTPAY LLC (Rostov-on-Don) ships DriverHub, a driver-updater front end whose
# installer is a bundleware carrier: its WPF wizard steps through partner offer
# pages (antivirus, browsers, games, utilities) and fetches the accepted
# installers to a temporary path and runs them. Vendors classify it as
# PUABundler:Win32/Rostpay / RostDown. The signer alone is not unwanted; the
# family signature also needs the product identity and the offer machinery.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576

traits:
  - id: rostpay-authenticode-signer
    desc: Authenticode signer is ROSTPAY LLC
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.signatures[*].subject
      substr: EMAIL=support@rostpay.ru

  - id: driverhub-installer-version-identity
    desc: DriverHub Installer version identity
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.description
      exact: DriverHub Installer

  # One compiled WPF page per partner product. A single page is ordinary
  # cross-promotion; offer pages spanning several product categories are an
  # offer catalog. .NET manifest resources (BAML page names) live in .text.
  - id: wpf-antivirus-offer-page
    desc: WPF offer page for an antivirus partner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)component/controls/(avast|avg|totalav)[a-z]*\.xaml'
      section: .text
  - id: wpf-browser-offer-page
    desc: WPF offer page for a browser partner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)component/controls/(opera|yandex|teslabrowser)[a-z]*\.xaml'
      section: .text
  - id: wpf-game-offer-page
    desc: WPF offer page for a game partner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)component/controls/lesta[a-z]*\.xaml'
      section: .text
  - id: wpf-utility-offer-page
    desc: WPF offer page for a utility partner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)component/controls/(pdfstorm|zipsoft|wowpaper)\.xaml'
      section: .text

composite_rules:
  - id: rostpay-driverhub-bundle-installer
    desc: ROSTPAY-signed DriverHub bundle installer
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    all:
      - id: rostpay-authenticode-signer
      - id: driverhub-installer-version-identity
      - id: micro-behaviors/process/create/spawn::dotnet-download-temp-process-references

  - id: driverhub-partner-offer-catalog
    desc: DriverHub installer ships a partner offer catalog
    crit: suspicious
    conf: 0.95
    all:
      - id: driverhub-installer-version-identity
    any:
      - id: wpf-antivirus-offer-page
      - id: wpf-browser-offer-page
      - id: wpf-game-offer-page
      - id: wpf-utility-offer-page
    needs: 3
