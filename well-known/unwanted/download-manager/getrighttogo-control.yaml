defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.9
  # Both matched API names contain at least 17 bytes.
  size_min: 17
traits:
  - id: getrighttogo-run-after-api-name
    desc: GetRightToGo run-after API name
    if:
      type: text
      regex: 'g2gSetRunWhenDone|g2gAddDownloadSetToRun'
