# QVI — "Quality Viewership Initiative" streaming viewing-panel extensions.
#
# Identity, not conviction. QVI is a network of ~24 Chrome extensions (Netflix,
# Prime Video, Disney+, Hulu, HBO Max, Peacock, Paramount+, Apple TV+, ...)
# published by HideApp LLC / ToopExt (toopextensions.com, vodextended.com).
# Each ships real playback features (speed control, skip intro/recap, PiP,
# subtitle styling) plus a panel SDK that reuses the user's own logged-in
# session on the streaming site to read watch history, watchlist/bookmarks,
# subscription status and the account e-mail, and uploads them to the operator's
# collection backends (me3x.online, metricsmint.quest) for resale as audience
# research.
#
# The program is DISCLOSED: the "[QVI]" tag is in every extension title, the
# store listing and privacy policy describe the collection and the resale, and
# the options page carries a working off switch. LayerX Security's April 2026
# write-up of the network states the extensions are "not hidden malware
# programs; their data collection and sales practices are stated in their
# policies". These artifacts therefore belong in well-known/unwanted/ as a
# named riskware/PUP publisher family, NOT in well-known/malware/stealer/ —
# labelling a disclosed, opt-out-able analytics panel as a credential stealer
# mislabels ~21 live Web Store extensions and poisons the family feature.
#
# The privacy-affecting behaviours themselves (account e-mail shipped
# off-origin, opt-out re-consent nagging, Base64-wrapped telemetry POSTs) are
# detected behaviourally under objectives/ so they also catch undisclosed
# imitators; this file only answers "which product is this".
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - html
  crit: notable
  conf: 0.95
  size_max: 5000000

traits:
# The program tag the operator puts in every extension title. Matching the tag
# instead of one product's full title covers the whole network (and any new
# member) rather than the single Netflix PiP build it was first seen on.
- id: qvi-title-tag
  desc: Extension title carries the [QVI] program tag
  conf: 0.97
  for: [chrome-manifest, json]
  if:
    type: value
    path: name
    substr: '[QVI]'

- id: me3x-collector-host
  desc: QVI me3x.online collection backend URL
  conf: 0.98
  if:
    type: text
    substr: '"Ec":"https://me3x.online/"'

- id: metricsmint-profile-endpoint
  desc: QVI metricsmint.quest profile-upload endpoint
  conf: 0.98
  if:
    type: text
    substr: '"d1":"https://metricsmint.quest/up"'

# Not a covert marker: this is the storage key behind the options-page
# "Share anonymous viewing insights" switch, present in every panel build.
- id: share-insights-consent-key
  desc: QVI shareInsights data-sharing consent key
  conf: 0.93
  if:
    type: text
    word: shareInsights

- id: toopextensions-survey-url
  desc: ToopExt post-install survey page URL
  conf: 0.97
  if:
    type: text
    substr: https://toopextensions.com/thank-you-survey/

- id: anonymous-feedback-banner-text
  desc: QVI "anonymous feedback" re-consent banner text
  conf: 0.98
  if:
    type: text
    substr: Hollywood needs your anonymous feedback

- id: disney-viewings-cache-db
  desc: QVI Disney viewings IndexedDB cache name
  conf: 0.97
  if:
    type: text
    regex: DisneyViewingsDB(_V2)?

# Peacock's own web app exposes this webpack chunk array and signs API calls
# with the `hmac-nbcuott` module; the panel build reaches into both from the
# page's MAIN world to issue signed requests. The atoms name the host-site
# internals they match — the reach-in is asserted by the composite below.
- id: peacock-webpack-chunk-global
  desc: Peacock web app webpack chunk global
  conf: 0.96
  if:
    type: text
    substr: webpackChunkgsp_web

- id: peacock-hmac-signer-module
  desc: Peacock hmac-nbcuott request signer module
  conf: 0.96
  if:
    type: text
    substr: hmac-nbcuott

composite_rules:
# Product identity: the two operator backends plus a panel-build marker. Fires
# on any member of the network, present or future, without relying on a single
# product name.
- id: qvi-viewing-panel-sdk
  desc: QVI streaming viewing-panel collector SDK
  crit: notable
  conf: 0.97
  attack: T1041
  all:
  - id: me3x-collector-host
  - id: metricsmint-profile-endpoint
  any:
  - id: share-insights-consent-key
  - id: disney-viewings-cache-db
  - id: micro-behaviors/browser-extension/lifecycle::extension-install-user-id-key

- id: qvi-reconsent-banner
  desc: QVI banner offering to re-enable insight sharing
  crit: notable
  conf: 0.97
  all:
  - id: share-insights-consent-key
  - id: anonymous-feedback-banner-text

# A signed-in streaming extension may legitimately match the generic
# collection rules below. Require the product tag as well as the two operator
# backends before treating this as benign context; an imitator that merely
# copies one endpoint does not receive the exception.
- id: disclosed-qvi-panel-context
  desc: Disclosed QVI panel extension context
  crit: exception
  conf: 0.99
  scope: archive
  all:
  - id: qvi-title-tag
  - id: me3x-collector-host
  - id: metricsmint-profile-endpoint

# Beyond ordinary panel telemetry: driving the host site's own signing module
# from the MAIN world to mint authenticated API calls the page never made.
- id: qvi-peacock-request-signer-hook
  desc: Hooks the Peacock request signer in MAIN world
  crit: notable
  conf: 0.97
  attack: T1185
  all:
  - id: peacock-webpack-chunk-global
  - id: peacock-hmac-signer-module
  - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
