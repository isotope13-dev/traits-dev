# Amonetize bundled-browser-modifier helper. Installers use this plugin to
# force browser extensions and rewrite browser settings; the same DLL is also
# embedded unchanged in product uninstallers, where the NSIS script calls only
# cleanup exports. Keep the family identity visible while excluding that
# verified uninstaller container from behavior composites over dormant code.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 30000
  size_max: 2000000

traits:
  - id: aminsis-plugin-basename
    desc: Amonetize aminsis plugin basename
    if:
      type: basename
      exact: aminsis.dll

  - id: chrome-policy-enable-export
    desc: Chrome policy extension-enable export
    if:
      type: export
      exact: enableChromeExtensionWithLocalGroupPolicy

  - id: chrome-policy-remove-export
    desc: Chrome policy extension-remove export
    if:
      type: export
      exact: removeChromeExtensionWithLocalGroupPolicy

  - id: rich-media-view-product
    desc: Rich Media View product identity
    if:
      type: value
      path: pe.version.product_name
      regex: '^Rich Media View release [0-9]+$'

  - id: vm-check-export
    desc: Amonetize environment-check export
    if:
      type: export
      exact: isVM

  - id: bootstrapper-pdb-path
    desc: Amonetize System Bootstrapper build path
    if:
      type: text
      section: .rdata
      substr: 'C:\Amon\AmonSystemBs\BootStrapper\ProductionNoSign\Launcher.pdb'

  - id: monetization-file-marker
    desc: Monetization component file marker
    if:
      type: text
      section: .rdata
      substr: monetization file

  - id: scheduled-component-download-task
    desc: Scheduled component download task marker
    if:
      type: text
      section: .rdata
      substr: CreateDownloadTask

  - id: scheduled-component-install-task
    desc: Scheduled component install task marker
    if:
      type: text
      section: .rdata
      substr: CreateInstallTask

composite_rules:
  - id: aminsis-browser-plugin
    desc: Amonetize browser-modifier plugin identity
    crit: notable
    conf: 0.995
    all:
      - id: aminsis-plugin-basename
      - id: chrome-policy-enable-export
      - id: chrome-policy-remove-export

  - id: amonetize-browser-modifier
    desc: Amonetize unwanted browser-modifier plugin
    crit: suspicious
    conf: 0.99
    all:
      - id: aminsis-browser-plugin
      - id: vm-check-export
      - id: micro-behaviors/data/config/browser-preference::chromium-sideload-wipeout-exemption

  - id: aminsis-plugin-library-context
    desc: Recognized Amonetize multi-function browser plugin
    crit: exception
    conf: 0.995
    scope: file
    all:
      - id: aminsis-browser-plugin
      - id: vm-check-export

  - id: amonetize-offer-installer
    desc: Amonetize bootstrapper schedules monetized component installs
    crit: suspicious
    conf: 0.97
    all:
      - id: bootstrapper-pdb-path
      - id: monetization-file-marker
      - id: scheduled-component-download-task
      - id: scheduled-component-install-task
