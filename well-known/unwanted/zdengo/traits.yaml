# Zdengo / Babar adware NSIS plugin stubs. Bundlers drop randomly named DLLs
# under $PLUGINSDIR whose PE export directory still names the build as
# ctfpc.dll and exposes a single opaque mixed-case export used by the NSIS
# script via Call. The stub resolves APIs dynamically and allocates/protects
# executable memory for the offer payload.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 32768
  size_max: 1048576

traits:
  - id: ctfpc-export-module-name
    desc: Zdengo ctfpc.dll export module name
    if:
      type: text
      exact: ctfpc.dll
      section: .rdata

composite_rules:
  - id: zdengo-ctfpc-nsis-plugin
    desc: Zdengo ctfpc NSIS adware plugin stub
    crit: hostile
    conf: 0.98
    all:
      - id: ctfpc-export-module-name
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/runtime::load-library-w

  - id: zdengo-ctfpc-debug-aware-loader
    desc: Zdengo ctfpc stub checks for debugger
    crit: hostile
    conf: 0.97
    all:
      - id: zdengo-ctfpc-nsis-plugin
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import

  - id: zdengo-ctfpc-opaque-export-loader
    desc: Zdengo ctfpc with opaque export loader
    crit: hostile
    conf: 0.97
    all:
      - id: ctfpc-export-module-name
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::single-opaque-mixed-case-export
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
