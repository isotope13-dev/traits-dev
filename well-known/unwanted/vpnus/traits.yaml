# VPNUS is a named unwanted extension family. The user-facing pages advertise
# VPN protection, while the shipped code opens local marketing/instruction
# pages whose trial and subscription actions lead to alpina.ws with a VPNUS
# campaign tag and whose support action leads to the matching Alpina account.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest, html, javascript, crx]
  crit: component
  conf: 0.96

traits:
  - id: vpnus-extension-name
    desc: VPNUS VPN extension name
    for: [chrome-manifest, crx]
    if:
      type: value
      path: name
      exact: VPNUS VPN

  - id: vpnus-alpina-campaign-url
    desc: VPNUS campaign directs users to Alpina
    crit: notable
    for: [html, javascript]
    if:
      type: text
      regex: 'https://alpina\.ws/\?utm_source=vpnus\b'
      case_insensitive: true

  - id: alpina-telegram-support-url
    desc: Alpina Telegram support link
    crit: notable
    for: [html, javascript]
    if:
      type: text
      regex: 'https://t\.me/alpinasupp\b'
      case_insensitive: true

composite_rules:
  - id: vpnus-external-subscription-leadgen-extension
    desc: VPNUS external-subscription lead-generation extension
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: vpnus-extension-name
      - id: vpnus-alpina-campaign-url
      - id: alpina-telegram-support-url
