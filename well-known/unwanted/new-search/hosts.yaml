# Historical browser-hijacker hosts entries, documented together in cleanup logs.
# https://www.geekstogo.com/forum/topic/31867-smitfraud/
defaults:
  for: [text]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: new-search-hosts-mapping
    desc: Historical new-search hosts mapping
    if:
      type: text
      regex: '(?im)^[ \t]*82\.179\.166\.192[ \t]+new-search\.net([ \t#\r]|$)'
  - id: x-google-hosts-mapping
    desc: Historical x-google hosts mapping
    if:
      type: text
      regex: '(?im)^[ \t]*82\.179\.166\.190[ \t]+x-google\.net([ \t#\r]|$)'
composite_rules:
  - id: browser-hijacker-hosts
    desc: Historical browser hijacker hosts mappings
    crit: hostile
    attack: T1565.001
    all:
      - id: new-search-hosts-mapping
      - id: x-google-hosts-mapping
