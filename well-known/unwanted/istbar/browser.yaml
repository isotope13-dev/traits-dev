defaults:
  for: [html]
  platforms: [windows]
traits:
  - id: installer-prompt-endpoint
    desc: ISTbar remote installer prompt endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: install.xxxtoolbar.com/ist/scripts/prompt.php?
composite_rules:
  - id: remote-installer-prompt-loader
    desc: ISTbar remote installer prompt script
    crit: suspicious
    conf: 0.98
    all:
      - id: installer-prompt-endpoint
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
  - id: recurring-focused-installer-prompt
    desc: ISTbar recurring installer prompt with page focus
    crit: suspicious
    conf: 0.98
    all:
      - id: remote-installer-prompt-loader
      - id: micro-behaviors/communications/http/query::recurring-onload-prompt
      - id: micro-behaviors/ui/window/navigation::self-focus-call-text
