# Named new-tab wallpaper publishers. These are identity/context signatures,
# not malware convictions: a publisher URL, new-tab override, and install
# lifecycle promotion do not by themselves establish malicious intent.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, crx]
  crit: component
  conf: 0.92

traits:
  - id: gameograf-manifest-author
    desc: Gameograf Chrome extension author
    for: [json, chrome-manifest]
    if:
      type: value
      path: author
      exact: Gameograf
  - id: gameograf-promo-host
    desc: Gameograf host URL in extension code
    for: [javascript, typescript]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true
  # Both author spellings this publisher ships under. The yowgames.com
  # extensions are mostly stamped `"author": "Owhit"`, but not all of them —
  # this one carries `"author": "Yowgames"` while serving the same
  # /api/extensions.php catalog, so matching only the first spelling let half
  # the family through with no identity leg at all.
  - id: owhit-manifest-author
    desc: Owhit Chrome extension author
    for: [json, chrome-manifest]
    if:
      type: value
      path: author
      regex: '^(Owhit|Yowgames)$'
      case_insensitive: true
  # This publisher ships under two promo domains: owhit.com and yowgames.com.
  # The link is direct rather than inferred — the yowgames.com extensions carry
  # `"author": "Owhit"` in the manifest, and the catalog that yowgames.com
  # serves at /api/extensions.php returns card images hosted on owhit.com.
  # Matching only owhit.com silently missed the yowgames-branded half.
  - id: owhit-promo-host
    desc: Owhit promotional host URL
    for: [javascript, typescript]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?(owhit|yowgames)\.com\b'
      case_insensitive: true

composite_rules:
  # Keep the named publisher context visible without upgrading it to an
  # unwanted-software verdict. The behavior-specific rules remain responsible
  # for reporting lifecycle navigation, remote catalogs, and storage resets.
  - id: gameograf-newtab-extension
    desc: Gameograf new-tab extension identity
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: gameograf-manifest-author
      - id: gameograf-promo-host
  - id: owhit-newtab-extension
    desc: Owhit new-tab wallpaper extension identity
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: owhit-manifest-author
      - id: owhit-promo-host
