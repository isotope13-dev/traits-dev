# A family of Russian-language "free VPN" Chrome extensions that share one code
# template and one backend. Each package sets a fixed browser proxy whose relay
# comes from the backend's server list and sends all traffic through it. The
# backend host is campaign-specific, so it stays here instead of in the generic
# proxy capability rules.
defaults:
  platforms: [windows, unix]
  for: [crx, zip, javascript]
  crit: notable
  conf: 0.95

traits:
  - id: campaign-backend-domain
    desc: VPN campaign backend API domain reference
    # Container bytes are never content-scanned, so the text match can only
    # fire on the JavaScript members. The archive-level composite below
    # supplies the crx and zip containers.
    for: [javascript]
    if:
      type: text
      substr: api.chetvinternprdo.space

composite_rules:
  - id: vpn-proxy-campaign-takeover
    desc: Campaign backend and fetched-server browser proxy takeover
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: campaign-backend-domain
      - id: objectives/impact/ui/manipulation/traffic/proxy::browser-remote-server-proxy-takeover
