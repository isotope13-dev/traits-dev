# InstallVibes is a known unwanted-software signer.  The family signature is
# intentionally coupled to its concealed SFX payload shape: a certificate
# subject alone is useful provenance, but is not sufficient to call a file a
# dropper.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: installvibes-authenticode-subject
    desc: PE Authenticode subject identifies InstallVibes
    crit: notable
    conf: 0.99
    size_min: 65536
    size_max: 2000000
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=InstallVibes,O=InstallVibes(,|$)'

composite_rules:
  - id: installvibes-signed-encrypted-sfx-bundler
    desc: InstallVibes-signed opaque 7-Zip SFX bundler
    crit: hostile
    conf: 0.995
    scope: outer
    attack: T1027.009,T1204.002,T1548.002
    all:
      - id: installvibes-authenticode-subject
      - id: objectives/anti-static/obfuscation/payload/encrypted::dominant-high-entropy-resources
      - id: metadata/binary/layout::7z-archive-signature-in-resource
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family::known-benign-installer
