defaults:
  for: [shell]
  platforms: [macos]
  crit: notable
  conf: 0.98

traits:
  - id: affiliate-install-event
    desc: MacKeeper affiliate installation event protocol
    if:
      type: text
      substr: 'step=MKInstallEvents&affid='

  - id: serial-mac-device-id
    desc: MacKeeper serial and MAC tracking identifier
    if:
      type: text
      substr: '${MK_INSTALLER_SERIAL_NUMBER}|${MK_INSTALLER_MAC_ADDRESS}'

  - id: device-id-event-upload
    desc: MacKeeper installation device ID upload
    if:
      type: text
      regex: 'curl[^\n]{0,80}--data[^\n]{0,220}&device_id=\$\{MK_INSTALLER_DEVICE_ID\}'

composite_rules:
  # Require the affiliate protocol, hardware-derived identifier and its
  # transmission alongside package installation. Product names, endpoints,
  # filenames and version numbers are deliberately not verdict gates.
  - id: affiliate-tracking-installer
    desc: MacKeeper hardware-tracking affiliate installer
    crit: hostile
    all:
      - id: affiliate-install-event
      - id: serial-mac-device-id
      - id: device-id-event-upload
      - id: micro-behaviors/os/package-manager/sideload::macos-installer-pkg
