defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]


composite_rules:
  - id: winhttp-createprocess-installer-clues
    for: [pe]
    desc: OfferCore installer with WinHTTP and process-creation references
    crit: notable
    conf: 0.97
    all:
      - id: well-known/unwanted/offercore::plooto-star-softonic-inno-bundle-installer
      - id: metadata/binary/resource/manifest::winhttp-system32-manifest
      - id: metadata/binary/symbols/name/process::create-process-w

  # This family gate is essential: WinHTTP and CreateProcessW are ordinary
  # installer primitives. The identified carrier embeds affiliate downloaders
  # behind preselected offer pages, then invokes the selected stages silently.
