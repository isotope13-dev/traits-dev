defaults:
  platforms: [windows]
  for: [pe]
  size_min: 1048576

traits:
  - id: plooto-stylized-version-identity
    desc: Stylized Plooto identity in version resource
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      substr: '𝖯loo𝗍o Inc.'

  - id: softonic-version-identity
    desc: Softonic identity in PE version resource
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      regex: '^Softonic--International \(SA\)\s*$'

composite_rules:
  - id: plooto-signed-inno-bundle-installer
    desc: Plooto-signed Inno bundle installer
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
    any:
      - id: metadata/signature/verified/signer::plooto-inc
      - id: metadata/signature/unverified/signer::plooto-inc
      - id: metadata/signature/self-signed/signer::plooto-inc
      - id: metadata/signature/invalid/tampered/signer::plooto-inc
      - id: metadata/signature/invalid/bad-signature/signer::plooto-inc

  - id: offercore-plooto-pua-installer
    desc: OfferCore/BundleInstaller PUA signed as Plooto
    crit: suspicious
    conf: 0.98
    all:
      - id: plooto-signed-inno-bundle-installer
      - id: plooto-stylized-version-identity

  - id: offercore-reboot-capable-installer
    desc: OfferCore PUA installer can initiate Windows reboot
    crit: notable
    conf: 0.94
    all:
      - id: offercore-plooto-pua-installer
      - id: micro-behaviors/ui/window/control::exit-windows-ex
      - id: micro-behaviors/os/privilege/reference::shutdown-privilege-name
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
      - id: micro-behaviors/os/privilege/token/use::lookup-privilege-value

  - id: offercore-opaque-inno-overlay
    desc: OfferCore PUA carries opaque high-entropy Inno overlay
    crit: suspicious
    conf: 0.96
    all:
      - id: offercore-plooto-pua-installer
      - id: metadata/binary/layout/entropy::overlay-entropy-over-7
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct

  # Plooto Star LLC is a newer signer identity used by the same Softonic
  # download-manager family. Requiring the Softonic VERSIONINFO, Inno stub,
  # and a payload-sized overlay avoids treating the signer alone as unwanted.
  - id: plooto-star-softonic-inno-bundle-installer
    desc: Plooto Star-signed Softonic Inno bundle installer
    crit: suspicious
    conf: 0.98
    all:
      - id: softonic-version-identity
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/size::large-overlay-1mb
    any:
      - id: metadata/signature/verified/signer::plooto-star-llc
      - id: metadata/signature/unverified/signer::plooto-star-llc
      - id: metadata/signature/self-signed/signer::plooto-star-llc
      - id: metadata/signature/invalid/tampered/signer::plooto-star-llc
      - id: metadata/signature/invalid/bad-signature/signer::plooto-star-llc


  # Threat-intelligence reports associate this verified signer and imphash
  # family with repeated BundleInstaller/Adware PUP installers. Keep the
  # signer as one leg of the family signature; a signer alone is not hostile.
  # Sources: GridinSoft/ThreatInfo publisher and file reports; ANY.RUN
  # reports for the shared product metadata and imphash.
  - id: kopetra-signed-inno-bundle-installer
    desc: Kopetra-signed OfferCore bundle installer
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
    any:
      - id: metadata/signature/verified/signer::kopetra-ltd
      - id: metadata/signature/unverified/signer::kopetra-ltd
      - id: metadata/signature/self-signed/signer::kopetra-ltd
      - id: metadata/signature/invalid/tampered/signer::kopetra-ltd
      - id: metadata/signature/invalid/bad-signature/signer::kopetra-ltd

  - id: kopetra-offercore-pua-installer
    desc: Kopetra PUP bundle installer family
    crit: hostile
    conf: 0.98
    all:
      - id: kopetra-signed-inno-bundle-installer
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay

  - id: kopetra-reboot-capable-installer
    desc: Kopetra installer can reboot Windows
    crit: notable
    conf: 0.95
    all:
      - id: kopetra-offercore-pua-installer
      - id: micro-behaviors/ui/window/control::exit-windows-ex
      - id: micro-behaviors/os/privilege/reference::shutdown-privilege-name
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
      - id: micro-behaviors/os/privilege/token/use::lookup-privilege-value

  # RE: Softonic_DLM/Softonic_2 PascalScript obtains a remote offer list,
  # downloads selected partner installers and invokes them with remote flags.
  # The external PUA classification is corroboration, not the matcher.
  - id: softonic-inno-download-manager
    desc: Softonic-branded Inno offer-bundle downloader
    crit: suspicious
    conf: 0.97
    all:
      - id: softonic-version-identity
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/size::large-overlay-1mb
    any:
      - id: metadata/signature/verified/signer::softonic-international-sa
      - id: metadata/signature/unverified/signer::softonic-international-sa
      - id: metadata/signature/self-signed/signer::softonic-international-sa
      - id: metadata/signature/invalid/tampered/signer::softonic-international-sa
      - id: metadata/signature/invalid/bad-signature/signer::softonic-international-sa
