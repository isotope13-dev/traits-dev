# Firseria / Solimba Installer v2 unwanted bundle installer.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.99
  size_min: 262144
  size_max: 2097152

traits:
  - id: installer-v2-internal-name
    desc: Firseria Installer v2 internal name
    if:
      type: text
      exact: install.v2 setup
      section: .rsrc

  - id: v2installer-original-filename
    desc: Firseria Installer v2 original filename
    if:
      type: text
      exact: v2installer.exe
      section: .rsrc

  - id: downloadmr-launch-host
    desc: Firseria DownloadMR launch host
    crit: notable
    if:
      type: encoded
      exact: api.downloadmr.com
      section: .data

composite_rules:
  - id: firseria-installer-v2-identity
    desc: Firseria Installer v2 unwanted bundle installer
    crit: hostile
    conf: 0.995
    all:
      - id: installer-v2-internal-name
      - id: v2installer-original-filename
    any:
      - id: metadata/signed/leaf::apps-installer-sl
      - id: downloadmr-launch-host
