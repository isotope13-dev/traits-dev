# GameAssist (com.gameassist) game-modification plugins. Each plugin APK is
# loaded by the GameAssist host into one named target game and patches it at
# run time; the "lvliab" family unlocks paid content by emulating billing
# and license checks (see well-known/unwanted/software-crack).
defaults:
  platforms: [android]
  conf: 0.92

traits:
  - id: gameassist-plugin-entry-class
    desc: GameAssist plugin entry class
    crit: notable
    for: [dex, xml, text, data]
    if:
      type: text
      regex: 'com[./]gameassist[./][a-z0-9_]+[./]PluginImpl'

composite_rules:
  - id: gameassist-billing-crack-plugin
    desc: GameAssist plugin that emulates Play billing or licensing
    crit: suspicious
    for: [dex]
    all:
      - id: gameassist-plugin-entry-class
    any:
      - id: well-known/unwanted/software-crack::android-iab-purchase-emulator
      - id: well-known/unwanted/software-crack::android-license-check-emulator
