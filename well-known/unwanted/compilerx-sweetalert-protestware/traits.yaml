# CompilerX-GPT is a publicly distributed Chrome extension that bundles a
# SweetAlert2 release carrying region-gated protestware and runs it as an
# all-sites content script -- so the sabotage reaches every page the user
# visits, not just the extension's own UI.
#
# The sabotage itself is upstream SweetAlert2 protestware, not a CompilerX
# invention; it is detected wherever it is vendored by
# objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage.
# This rule adds only the delivery fact. The SweetAlert2 library-identity atoms
# that used to live here have moved to well-known/lib/ui/sweetalert2/ -- they
# match a benign MIT-licensed dialog library, so filing them under unwanted/
# labelled every ordinary consumer of it.
defaults:
  platforms: [windows, unix]
  for: [crx, archives]
  crit: notable
  conf: 0.99

traits:
  - id: compilerx-manifest-name
    desc: CompilerX-GPT Chrome extension identity
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Compilerx-GPT

composite_rules:
  - id: compilerx-sweetalert2-protestware
    desc: CompilerX-GPT injects sabotaging SweetAlert2 everywhere
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: compilerx-manifest-name
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
