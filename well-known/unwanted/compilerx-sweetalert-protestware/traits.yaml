# CompilerX-GPT is a publicly distributed Chrome extension, but this release
# bundles a region-gated SweetAlert2 sabotage routine in its all-sites content
# script. Keep the product identity separate from this behavior-specific rule.
defaults:
  platforms: [windows, unix]
  for: [crx, archives]
  crit: notable
  conf: 0.99

traits:
  - id: compilerx-manifest-name
    desc: CompilerX-GPT Chrome extension identity
    for: [chrome-manifest]
    if:
      type: value
      path: name
      exact: Compilerx-GPT
  - id: sweetalert2-version
    desc: SweetAlert2 version identity
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(sweetalert2\s+v|(jn|swal|sweetalert2)\.version\s*=\s*["''])\d+\.\d+'
  - id: sweetalert2-popup-class
    desc: SweetAlert2 popup CSS class name
    for: [javascript, typescript]
    if:
      type: text
      substr: swal2-popup

composite_rules:
  - id: sweetalert2-library
    desc: SweetAlert2 dialog library in the protestware bundle
    crit: notable
    conf: 0.99
    all:
      - id: sweetalert2-version
      - id: sweetalert2-popup-class
  - id: compilerx-sweetalert2-protestware
    desc: CompilerX-GPT bundles region-gated SweetAlert2 input sabotage
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: compilerx-manifest-name
      - id: sweetalert2-library
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
      - id: micro-behaviors/communications/http/url/path::browser-location-host-russian-tld-match
      - id: micro-behaviors/ui/window/manage/style::browser-root-pointer-events-assignment
      - id: micro-behaviors/hardware/input/audio::browser-audio-element-create
      - id: micro-behaviors/hardware/input/audio::browser-audio-source-property
      - id: micro-behaviors/hardware/input/audio::remote-audio-source-url
      - id: micro-behaviors/hardware/input/audio::browser-audio-loop-enabled
      - id: micro-behaviors/hardware/input/audio::browser-audio-play-call
