# SweetAlert2 11.x releases can carry a region-gated protestware routine.
# Keep this family identity separate from the neutral SweetAlert2 library
# marker: ordinary consumers are not unwanted unless the sabotage behavior is
# present as well.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1491

composite_rules:
  - id: sweetalert2-protestware
    desc: SweetAlert2 region-gated protestware payload
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage

  - id: archive-sweetalert2-protestware-bundle
    desc: Archive bundles SweetAlert2 protestware JavaScript
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, tar, archives]
    all:
      - id: sweetalert2-protestware
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
