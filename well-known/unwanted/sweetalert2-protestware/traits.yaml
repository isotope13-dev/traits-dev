# SweetAlert2 releases from mid-2022 onward shipped a region-gated protestware
# routine that disables page input and plays looping audio for Russian-locale
# visitors on Russian ccTLD sites. The sabotage itself is detected wherever it
# is vendored by
# objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage.
# This rule adds the delivery fact: a SweetAlert2 bundle carrying that routine.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

composite_rules:
  - id: sweetalert2-protestware-bundle
    desc: SweetAlert2 bundle carries regional browser sabotage
    crit: hostile
    conf: 0.995
    scope: file
    all:
      # Minified protestware bundles often split the version banner across
      # literals, so the css-class prefix is the reliable library leg.
      - id: well-known/lib/ui/sweetalert2::sweetalert2-css-class-prefix
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage
