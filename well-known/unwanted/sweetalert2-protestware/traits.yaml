# Identity records code presence; reachability and impact are separate claims.
# A chrome-extension:// options page cannot satisfy a Russian ccTLD gate.
# Keep the vendored protestware visible without convicting that consumer.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: initiation-storage-key
    desc: SweetAlert2 regional routine localStorage key
    if:
      type: literal
      exact: swal-initiation

composite_rules:
  # Library identity and the sabotage routine often sit far apart in minified
  # bundles (prefix table at the top, protestware gate at module load), so do
  # not cluster them with near_bytes. Identity records code presence even
  # when a consumer only reads this bundle as data; impact is separate.
  - id: sweetalert2-protestware-bundle
    desc: SweetAlert2 regional input and audio routine
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
      - id: initiation-storage-key
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-russian-language-test
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-russian-tld-match
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
      - id: micro-behaviors/time/timing/check::js-elapsed-days-gate
      - id: micro-behaviors/ui/window/style::browser-root-pointer-events-disabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-play-call

  - id: sweetalert2-npm-protestware-release
    desc: SweetAlert2 npm release ships regional protestware
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/name/identity::npm-manifest-name-sweetalert2
      - id: sweetalert2-protestware-bundle
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage
    # The canonical release that documents the region-differentiated behavior
    # in its README lifts this verdict; an undisclosed release stays hostile.
    unless:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release

  # Archive scope: the library identity and the routine pool from different
  # members, and only archive scope lets a disclosure unless reach across
  # the README/package.json boundary. The manifest leg keeps lone-file
  # buckets out: a bare bundle.js reports the routine composite, not this
  # identity pairing. File-level sabotage signal stays on the routine
  # composite; this pairing no longer double-counts it per member.
  - id: sweetalert2-regional-browser-sabotage
    desc: SweetAlert2 regional input and audio sabotage
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript, php, whl]
    scope: archive
    all:
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage
    any:
      - id: metadata/file/naming::package-json-basename
      - id: metadata/package/files/included::composer-json-basename
      - id: metadata/package/files/ecosystem::wordpress-plugin-header
      - id: metadata/package/ecosystem::python-package-metadata-member
    needs: 1
    # On a disclosed canonical release the routine-level composite keeps the
    # single suspicious glance; this identity duplicate lifts entirely.
    unless:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
    downgrade:
      scope: archive
      any:
        - id: objectives/impact/ui/manipulation/browser::extension-origin-only-regional-routine
        - id: objectives/impact/ui/manipulation/browser::python-node-text-wasm-extraction
