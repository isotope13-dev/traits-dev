# Identity records code presence; reachability and impact are separate claims.
# A chrome-extension:// options page cannot satisfy a Russian ccTLD gate.
# Keep the vendored protestware visible without convicting that consumer.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: initiation-storage-key
    desc: SweetAlert2 regional routine localStorage key
    if:
      type: literal
      exact: swal-initiation

composite_rules:
  # Library identity and the sabotage routine often sit far apart in minified
  # bundles (prefix table at the top, protestware gate at module load), so do
  # not cluster them with near_bytes. Identity records code presence even
  # when a consumer only reads this bundle as data; impact is separate.
  - id: sweetalert2-protestware-bundle
    desc: SweetAlert2 regional protestware code present
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
      - id: initiation-storage-key
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-russian-language-test
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-russian-tld-match
      - id: micro-behaviors/ui/window/style::browser-root-pointer-events-disabled
      - id: micro-behaviors/ui/window/dom/audio::browser-audio-loop-enabled

  - id: sweetalert2-npm-protestware-release
    desc: SweetAlert2 npm release ships regional protestware
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/name/identity::npm-manifest-name-sweetalert2
      - id: sweetalert2-protestware-bundle
      - id: objectives/impact/ui/manipulation/browser::regional-pointer-events-audio-sabotage
