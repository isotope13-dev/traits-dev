defaults:
  platforms: [unix, windows]
  for: [package.json]
  conf: 0.99

traits:
  # MAL-2025-170656 identifies adilfaheem 1.0.0 as Tea reward registry spam.
  # Its actual archive has an empty index, a Kopling README, and 53 runtime
  # dependencies. It contains no autopublisher, install hook, or stealer.
  # Keep these generator-template identifiers in the family namespace; a
  # generic high-fanout metapackage remains only notable.
  - id: kopling-description
    desc: Kopling campaign package description
    crit: notable
    ref: https://osv.dev/vulnerability/MAL-2025-170656
    if:
      type: value
      path: description
      exact: Jual Beli All Variant Kopling

  - id: kopling-repository
    desc: Kopling campaign repository URL
    crit: notable
    if:
      type: value
      path: repository.url
      regex: '^https://github\.com/uhuhana/agus-kopling(\.git)?$'

composite_rules:
  - id: kopling-republished-manifest
    desc: Kopling template has divergent name and dependency fanout
    crit: notable
    scope: file
    all:
      - id: kopling-description
      - id: kopling-repository
      - id: metadata/package/repository::npm-name-repo-mismatch
      - id: objectives/supply-chain/impersonation/registry/publish/campaign::npm-root-fanout-index-manifest

  - id: kopling-dependency-spam
    desc: Tea reward Kopling campaign dependency-spam package
    crit: hostile
    ref: https://osv.dev/vulnerability/MAL-2025-170656
    for: [npm, package.json]
    scope: package
    all:
      - id: kopling-republished-manifest
      - id: objectives/supply-chain/impersonation/registry/publish/campaign::npm-empty-main-dependency-spam
