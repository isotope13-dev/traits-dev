defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - zip
  conf: 0.99
  size_max: 20000000
traits:
- id: tea-generated-phrase-marker
  desc: Tea campaign generated phrase
  crit: notable
  for:
  - javascript
  - markdown
  - text
  - packagejson
  if:
    type: text
    regex: \b[a-z0-9][a-z0-9-]{2,79}-complete-themselves\b
    case_insensitive: true
- id: tea-generated-description-prefix
  desc: Tea campaign description prefix
  crit: notable
  for:
  - package.json
  if:
    type: value
    path: description
    regex: ^\([^)]{1,80}\)\s*-\s*This function is used to convert multiple words
- id: tea-generated-description-suffix
  desc: Tea campaign description suffix
  crit: notable
  for:
  - package.json
  if:
    type: value
    path: description
    regex: containing the word [a-z0-9][a-z0-9-]{2,79}-complete-themselves\.$
    case_insensitive: true
- id: tea-generated-getpackage-slug
  desc: Tea stub getPackage returns generated slug
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: function getPackage\(\)[^}]{1,40}return ['"][a-z0-9]{3,30}(-[a-z0-9]{2,20}){2}['"]
- id: tea-generated-test-slug
  desc: Tea stub test asserts generated slug
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: should return package [a-z0-9]{3,30}(-[a-z0-9]{2,20}){2}'
- id: tea-sibling-dependency-acertea
  desc: Tea campaign sibling dependency name acertea
  crit: component
  for:
  - package.json
  if:
    type: text
    regex: '"acertea"\s*:'
- id: tea-sibling-dependency-teanager
  desc: Tea campaign sibling dependency name teanager
  crit: component
  for:
  - package.json
  if:
    type: text
    regex: '"teanager"\s*:'
- id: tea-sibling-dependency-tehtehteh
  desc: Tea campaign sibling dependency name tehtehteh
  crit: component
  for:
  - package.json
  if:
    type: text
    regex: '"tehtehteh"\s*:'
- id: tea-sibling-dependency-myteapal
  desc: Tea campaign sibling dependency name myteapal
  crit: component
  for:
  - package.json
  if:
    type: text
    regex: '"myteapal"\s*:'
- id: tea-sibling-dependency-nitroteh
  desc: Tea campaign sibling dependency name nitroteh
  crit: component
  for:
  - package.json
  if:
    type: text
    regex: '"nitroteh"\s*:'
- id: tea-sibling-dependency-anakjalanan
  desc: Tea campaign sibling dependency name anakjalanan
  crit: component
  for:
  - package.json
  if:
    type: text
    regex: '"anakjalanan"\s*:'
- id: tea-campaign-dependency
  desc: Tea campaign dependency graph node
  crit: notable
  for:
  - package.json
  unless:
  - type: value
    path: name
    exact: tea-stakefadhlan1
  if:
    type: value
    path: dependencies.tea-stakefadhlan1
    exists: true
composite_rules:
- id: tea-campaign-sibling-dependencies
  desc: Tea campaign sibling dependency names
  crit: notable
  scope: file
  for:
  - package.json
  needs: 3
  any:
  - id: tea-sibling-dependency-acertea
  - id: tea-sibling-dependency-teanager
  - id: tea-sibling-dependency-tehtehteh
  - id: tea-sibling-dependency-myteapal
  - id: tea-sibling-dependency-nitroteh
  - id: tea-sibling-dependency-anakjalanan
- id: tea-generated-commonjs-package-stub
  desc: Tea campaign generated CommonJS package stub
  crit: suspicious
  scope: file
  for:
  - javascript
  all:
  - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
  any:
  - id: tea-generated-phrase-marker
  - id: tea-generated-getpackage-slug
- id: tea-generated-sentence-template
  desc: Tea campaign generated description
  crit: notable
  scope: file
  for:
  - package.json
  all:
  - id: tea-generated-description-prefix
  - id: tea-generated-description-suffix
- id: tea-generated-dependency-fanout
  desc: Tea campaign generated dependency fanout
  crit: suspicious
  scope: file
  for:
  - package.json
  all:
  - id: tea-generated-sentence-template
  - id: metadata/package/dependencies/count::npm-dependency-fanout
- id: tea-generated-test-case
  desc: Tea campaign generated test duplication
  crit: suspicious
  scope: file
  for:
  - javascript
  all:
  - id: metadata/package/testing/presence/scripted::it-call
  - id: metadata/package/testing/harness/runtime::test-basename-suffix
  any:
  - id: tea-generated-phrase-marker
  - id: tea-generated-test-slug
- id: tea-campaign-generated-dependency-package
  desc: Tea campaign generated dependency package
  crit: suspicious
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  all:
  - id: tea-generated-sentence-template
  any:
  - id: tea-campaign-dependency
  - id: tea-campaign-sibling-dependencies
