defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.99

traits:
  - id: tl-product
    desc: TL product name in version resource
    crit: component
    if:
      type: value
      path: pe.version.product_name
      exact: TL

  - id: tl-setup-description
    desc: TL Setup version resource description
    crit: component
    if:
      type: value
      path: pe.version.description
      exact: TL Setup

  # Setup Factory leaves this member name readable in its overlay table.
  # The installer scripts and executable bodies are LZMA2 compressed.
  - id: browser-installer-member-name
    desc: BrowserInstaller executable name in overlay
    crit: notable
    if:
      type: text
      section: overlay
      exact: BrowserInstaller.exe

composite_rules:
  - id: tl-setup-version-identity
    desc: TL installer version resource identity
    crit: notable
    all:
      - id: tl-product
      - id: tl-setup-description

  # Reviewed scripts deploy region-selected partner browsers and security
  # products with quiet switches, including Yandex search/homepage offers.
  # Detect the offer-bearing installer, not every TLauncher executable or
  # any file merely mentioning the launcher. No hash or version dependency.
  - id: tlauncher-offer-bundler
    desc: TLauncher installer bundles third-party software offers
    crit: hostile
    ref: sha256:04627acfabae38ee0f33647d0383a1bb689215440219cf9488db17404730f8af
    all:
      - id: tl-setup-version-identity
      - id: metadata/installer/builder/setup-factory::setup-factory-manifest-runtime
      - id: browser-installer-member-name
