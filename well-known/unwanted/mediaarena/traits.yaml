# MediaArena is a bundler/adware distributor: it ships functional free consumer
# tools -- PDF viewers, converters, media players -- under throwaway brand names,
# each signed by a shell company that has nothing to do with the brand on the
# product. The programs themselves work, which is the point; what makes them
# unwanted is the distribution around them (bundled offers, search and homepage
# changes), and that lives outside the executable's own bytes.
#
# So this records an IDENTITY, not a behaviour. The vendor consensus on binaries
# carrying this signing certificate is unanimous and specific -- BitDefender,
# Emsisoft, ALYac and Arcabit all name Application.Bundler.MediaArena, ESET the
# matching per-brand PUA -- which is what justifies naming the signer here rather
# than treating it as an ordinary code-signing identity. It belongs in
# well-known/unwanted/ for exactly the reason the taxonomy describes that
# directory: a named PUA family whose distribution is the problem, not clearly
# hostile malware.
#
# Deliberately no behavioural legs. Adding "and it reads the clipboard" or "and
# it captures a bitmap" would convict the parts of these programs that are
# genuinely a PDF viewer doing its job.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 268435456

traits:
  - id: mediaarena-signing-identity
    desc: Signed by a MediaArena bundler identity
    crit: suspicious
    conf: 0.9
    if:
      # Derived from the engine-emitted leaf-certificate identity; the change
      # this adds is the criticality, because the organisation is a known
      # bundler front rather than a neutral signer.
      id: metadata/signed/leaf::monkey-digital-ltd
