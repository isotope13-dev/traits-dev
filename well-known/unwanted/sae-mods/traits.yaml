# SAE-mods MiniPack — World of Tanks client mod-pack installer from sae-mod.ru.
# AV families label variants GameHack / MSILHeracles / Unwanted-Program: the
# binary is a self-signed .NET stub that unpacks ZIP stages into the game tree
# and writes Software\s_mods. Distinctive publisher + product + WoT adapter
# strings are stable across builds.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002
  mbc: B0010
  size_min: 100000

traits:
  - id: sae-mods-authenticode-subject
    desc: SAE-mods Authenticode subject
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: pe.signatures[0].subject
      exact: CN=SAE-mods

  - id: minipack-product-name
    desc: MiniPack product version identity
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      exact: MiniPack

  - id: minipack-internal-exe-name
    desc: MiniPack.exe internal filename
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.internal_name
      exact: MiniPack.exe

  - id: wot-s-mods-registry-path
    desc: Software s_mods registry path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Software\s_mods'
      section: .rdata

  - id: openwg-adapter-marker
    desc: openwg WoT mod adapter marker
    crit: notable
    conf: 0.92
    if:
      type: text
      word: openwg
      section: .rdata

  - id: minipack-pdb-path
    desc: MiniPack Visual Studio PDB path
    crit: notable
    conf: 0.94
    if:
      type: value
      path: pe.debug.pdb.path
      substr: '\MiniPack\'

composite_rules:
  - id: sae-mods-minipack-identity
    desc: SAE-mods MiniPack installer identity
    crit: suspicious
    conf: 0.97
    all:
      - id: sae-mods-authenticode-subject
      - id: minipack-product-name
    any:
      - id: minipack-internal-exe-name
      - id: minipack-pdb-path

  - id: sae-mods-minipack-wot-installer
    desc: SAE-mods MiniPack WoT mod installer
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1547.001
    all:
      - id: sae-mods-minipack-identity
      - id: wot-s-mods-registry-path
      - id: openwg-adapter-marker
