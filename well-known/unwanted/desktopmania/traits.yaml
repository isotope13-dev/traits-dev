# DesktopMania is wallpaper catalog software distributed with an optional
# Yandex Elements partner offer. These signatures identify that PUA bundle;
# they do not characterize its ordinary wallpaper network traffic as hostile.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 262144
  size_max: 16777216
  crit: notable
  conf: 0.98

traits:
- id: autonavigator-desktopmania-registry-key
  desc: DesktopMania Autonavigator registry key
  if:
    type: text
    exact: 'Software\AutonavigatorSRL\DesktopMania\'
    section: .rsrc

- id: autonavigator-desktopmania-registry-key-code
  desc: Embedded DesktopMania Autonavigator registry key
  if:
    type: text
    exact: 'Software\AutonavigatorSRL\DesktopMania\'
    section: .text

- id: statusmania-yandex-partner-command
  desc: StatusMania Yandex partner command
  if:
    type: text
    substr: '--partner statusmania-elements --distr'
    section: .text

- id: desktopmania-favorites-support-url
  desc: DesktopMania favorites support URL
  if:
    type: text
    substr: 'desktopmania.ru/components/getfav.support.php'
    section: .rsrc

- id: desktopmania-favorites-support-url-code
  desc: Embedded DesktopMania favorites support URL
  if:
    type: text
    substr: 'desktopmania.ru/components/getfav.support.php'
    section: .text

composite_rules:
- id: desktopmania-wallpaper-client
  desc: DesktopMania wallpaper client identity
  crit: exception
  conf: 0.99
  all:
  - id: autonavigator-desktopmania-registry-key
  - id: desktopmania-favorites-support-url

- id: desktopmania-yandex-partner-bundle
  desc: DesktopMania Yandex partnerware bundle
  crit: suspicious
  conf: 0.99
  all:
  - id: autonavigator-desktopmania-registry-key
  - id: statusmania-yandex-partner-command
