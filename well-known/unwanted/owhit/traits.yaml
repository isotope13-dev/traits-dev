# Owhit is the named unwanted-software family/publisher. Generic new-tab
# promotion behavior is modeled under objectives/; this file contributes only
# the identity evidence and the family verdict that combines it with that
# behavior.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, crx]
  crit: component
  conf: 0.92

traits:
  # Both author spellings this publisher ships under. The yowgames.com
  # extensions are mostly stamped `"author": "Owhit"`, but one carries
  # `"author": "Yowgames"` while serving the same remote extension catalog.
  - id: owhit-manifest-author
    desc: Owhit Chrome extension author
    for: [json, chrome-manifest]
    if:
      type: value
      path: author
      regex: '^(Owhit|Yowgames)$'
      case_insensitive: true

  # The yowgames.com extensions identify Owhit in their manifests, and their
  # catalog returns card images hosted on owhit.com, directly linking the two
  # publisher domains.
  - id: owhit-promo-host
    desc: Owhit promotional host URL
    for: [javascript, typescript]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?(owhit|yowgames)\.com\b'
      case_insensitive: true

composite_rules:
  - id: owhit-newtab-extension
    desc: Owhit new-tab wallpaper extension identity
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: owhit-manifest-author
      - id: owhit-promo-host

  # The publisher repeatedly ships the same wallpaper/new-tab shell with a
  # forced install landing page and an operator-controlled uninstall URL. The
  # generic promotion inference belongs to objectives/impact/ui/manipulation;
  # publisher identity upgrades that behavior to this named PUA family.
  - id: owhit-promotional-newtab-pua
    desc: Owhit promotional new-tab potentially unwanted extension
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: owhit-newtab-extension
      - id: objectives/impact/ui/manipulation/core::newtab-install-uninstall-lifecycle-navigation
