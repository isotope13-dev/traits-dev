# Android in-app-purchase and license-check emulators (GameAssist "lvliab"
# plugins, Lucky Patcher-style billing proxies).
#
# A crack injected into the target game replaces Google Play's billing and
# licensing Binder services with in-process proxies: purchases come back
# "owned", license checks come back LICENSED, and a dummy signature verifier
# accepts the forged receipts. Apps that really sell content talk to Play
# through com.android.vending and verify signatures; they never ship a
# verifier that accepts everything or re-proxy the system managers.
defaults:
  platforms: [android]
  for: [dex]
  conf: 0.9
  attack: T1574

traits:
  - id: play-billing-service-interface
    desc: References Play in-app billing service
    crit: component
    if:
      type: text
      regex: 'com[./]android[./]vending[./]billing[./]IInAppBillingService'

  - id: play-licensing-listener-interface
    desc: References Play license result listener
    crit: component
    if:
      type: text
      regex: 'com[./]android[./]vending[./]licensing[./]ILicenseResultListener'

  # A signature verifier or security provider named as a stand-in: the
  # component that should reject forged purchase receipts accepts them.
  - id: dummy-signature-verifier-class
    desc: Defines a dummy signature verifier class
    crit: notable
    if:
      type: text
      regex: '/(Dummy|Fake|Null|NoOp)(Signature(Verifier|Checker)|SecurityProvider)[;$]'

  # In-process Binder proxies for the system managers that report installer,
  # signatures and accounts, located by reflected TRANSACTION_ opcodes.
  - id: activity-manager-binder-proxy
    desc: Re-implements the ActivityManager Binder proxy
    crit: component
    if:
      type: text
      substr: '/ActivityManagerService$Proxy;'

  - id: package-manager-binder-proxy
    desc: Re-implements the PackageManager Binder proxy
    crit: component
    if:
      type: text
      substr: '/PackageManagerService$Proxy;'

  - id: account-manager-binder-proxy
    desc: Re-implements the AccountManager Binder proxy
    crit: component
    if:
      type: text
      substr: '/AccountManagerService$Proxy;'

composite_rules:
  - id: system-manager-binder-proxies
    desc: Re-implements system manager Binder proxies
    crit: notable
    needs: 2
    any:
      - id: activity-manager-binder-proxy
      - id: package-manager-binder-proxy
      - id: account-manager-binder-proxy

  - id: android-iab-purchase-emulator
    desc: Fakes Google Play purchases with a billing proxy and a dummy receipt verifier
    crit: suspicious
    all:
      - id: play-billing-service-interface
      - id: dummy-signature-verifier-class

  - id: android-license-check-emulator
    desc: Fakes Google Play license checks by proxying system managers
    crit: suspicious
    all:
      - id: play-licensing-listener-interface
      - id: system-manager-binder-proxies
