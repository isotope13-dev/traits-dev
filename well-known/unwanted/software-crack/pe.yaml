defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: team-vr-authenticode-subject
    desc: Team V.R Authenticode subject
    crit: suspicious
    conf: 0.96
    size_min: 4096
    if:
      type: value
      path: pe.signatures[0].subject
      exact: CN=Team V.R

composite_rules:
  - id: team-vr-self-issued-authenticode
    desc: Team V.R self-issued Authenticode
    crit: suspicious
    conf: 0.98
    all:
      - id: team-vr-authenticode-subject
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
  - id: team-vr-packed-license-crack
    desc: Team V.R packed license crack
    crit: hostile
    conf: 0.98
    all:
      - id: team-vr-self-issued-authenticode
      - id: objectives/anti-static/pack/mpress::mpress-versioned-stub
      - id: objectives/evasion/masquerade/version-resource/licensing::steinberg-elicenser-version-identity
  - id: kms-emulator-office-activation-crack
    desc: Microsoft KMS emulator used to bypass Office activation
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/dual-use/access-control/kms-emulator::kms-service-office-identity
      - id: well-known/dual-use/access-control/kms-emulator::kms-service-rpc-implementation
  - id: kms-emulator-versioned-activation-crack
    desc: Versioned KMS activation service used as a license crack
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/dual-use/access-control/kms-emulator::kms-versioned-activation-service
      - id: well-known/dual-use/access-control/kms-emulator::kms-service-rpc-implementation
  - id: kms-emulator-console-activation-crack
    desc: Console KMS emulator license crack
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/dual-use/access-control/kms-emulator::kms-rpc-emulator
      - id: well-known/dual-use/access-control/kms-emulator::default-kms-pid-name
      - id: well-known/dual-use/access-control/kms-emulator::random-kms-pid-name
      - id: well-known/dual-use/access-control/kms-emulator::kms-port-netstat-pid-lookup
