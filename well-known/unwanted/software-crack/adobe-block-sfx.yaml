# RAR self-extractor whose setup script runs a PowerShell tool that deletes the
# Adobe Genuine Service and its scheduled tasks, rewrites the hosts file from a
# third-party blocklist, and blocks Adobe executables in the firewall. The SFX
# setup line is the plaintext identity; the PowerShell body is compressed in the
# archive and is not visible to text matchers.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1489

traits:
  - id: adobe-block-sfx-deletehost-setup
    desc: SFX setup runs Adobe-blocking deletehost.bat
    crit: hostile
    conf: 0.95
    size_min: 4096
    size_max: 100000000
    if:
      type: text
      section: overlay
      substr: Setup=deletehost.bat
