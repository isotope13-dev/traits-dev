# Goldberg Social Club Emulator loader (launc.dll).
# Renames the real Rockstar socialclub.dll to orig_socialclub.dll, then
# injects/hooks via Microsoft Detours so GTA/RDR titles run without Social
# Club online auth. Distinctive typo string and truncated export name are
# stable across published builds.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
  size_min: 50000
  size_max: 5000000

traits:
  - id: orig-socialclub-dll-name
    desc: Renamed Social Club DLL backup name
    if:
      type: text
      exact: orig_socialclub.dll
      section: .rdata

  - id: socialclub-dll-name
    desc: Rockstar Social Club DLL name
    if:
      type: text
      exact: socialclub.dll
      section: .rdata

  - id: rockstar-launcher-path-suffix
    desc: Rockstar Launcher.exe path suffix
    if:
      type: text
      exact: '\Launcher.exe'
      section: .rdata

  - id: main-module-typo-message
    desc: Goldberg main-module failure typo
    if:
      type: text
      substr: 'Falied to retrieve the main module'
      section: .rdata

  - id: launc-export
    desc: Truncated launc DLL export
    if:
      type: export
      exact: launc

  - id: launc-basename
    desc: launc.dll basename
    if:
      type: basename
      exact: launc.dll
      case_insensitive: true

composite_rules:
  - id: goldberg-socialclub-identity
    desc: Goldberg Social Club emulator identity
    crit: notable
    conf: 0.99
    all:
      - id: orig-socialclub-dll-name
      - id: socialclub-dll-name
      - id: main-module-typo-message

  - id: goldberg-socialclub-emu-injector
    desc: Goldberg Social Club emulator process injector
    crit: hostile
    conf: 0.99
    attack: T1055,T1574.001
    all:
      - id: goldberg-socialclub-identity
      - id: well-known/lib/platform/microsoft-detours::detours-section-marker
    any:
      - id: launc-export
      - id: launc-basename
      - id: rockstar-launcher-path-suffix
