# AdKeeps is the named publisher/product in this extension's manifest. The
# generic settings-takeover behavior lives under objectives/; this file joins
# the brand and its promotional domains into a family verdict.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest, javascript, html, crx]
  crit: component
  conf: 0.92

traits:
  - id: adkeeps-manifest-name
    crit: notable
    desc: AdKeeps Chrome extension identity
    for: [json, chrome-manifest]
    if:
      type: value
      path: name
      regex: '(?i)\badkeeps\b'

  - id: adkeeps-promo-host
    crit: notable
    desc: AdKeeps promotional host URL
    for: [javascript, html, chrome-manifest]
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?(adkeeps\.com|adkps\.me)\b'
      case_insensitive: true

  - id: adkeeps-search-provider-host
    crit: notable
    desc: AdKeeps declared search endpoint
    for: [json, chrome-manifest]
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '^https?://([^/]+\.)?(adkeeps\.com|adkps\.me)(/|$)'
      case_insensitive: true

composite_rules:
  - id: adkeeps-search-pua
    desc: AdKeeps search and homepage hijacking extension
    crit: hostile
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: adkeeps-manifest-name
      - id: adkeeps-search-provider-host
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-homepage-override
      - id: objectives/impact/ui/manipulation/traffic::search-url-query-template
