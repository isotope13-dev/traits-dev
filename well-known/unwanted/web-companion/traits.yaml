# Lavasoft / Millennial Media "Web Companion" (BBWC) search-hijacking
# bundle, versions 1.2x (2021-2022). The companion installs as a browser
# "protection" add-on, rewrites Chrome/Edge/Firefox/IE default search
# (direct INSERT into the Web Data keywords table) and homepages toward its
# own search feed, stages a hidden PowerShell reflective load of a sidecar
# DLL, registers a logon-trigger task, and polls an updater feed for more
# content. Distributed through pay-per-install partner bundling; code is
# Dotfuscated.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  size_min: 2048
  size_max: 16777216

traits:
  - id: web-companion-product-name
    desc: WebCompanion product identity
    if:
      type: value
      path: pe.version.product_name
      substr: WebCompanion

  - id: bbwc-updater-product-name
    desc: BBWC updater product identity
    if:
      type: value
      path: pe.version.product_name
      exact: BBWC

  # The companion's own search feed: favicon and query URLs are embedded as
  # the injected "Chrome Search" provider row.
  - id: search-get-redirect-host
    desc: WebCompanion search-redirect feed host
    if:
      type: text
      substr: search-get.com
      section: .text

  - id: bidmonitor-build-path
    desc: WebCompanion bidmonitor build path
    if:
      type: text
      substr: bidmonitor
      section: .text

composite_rules:
  # Named unwanted-software family: suspicious, never hostile (decision
  # 2026-09-26, see adkeeps). Family samples belong in the purgatory pool.
  # The required product identity and the corroborating family evidence are
  # content-derived; the redirect host is the family's own feed, so a
  # renamed repack still matches.
  - id: web-companion-hijacker-bundle
    desc: WebCompanion search-hijacking bundle
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: web-companion-product-name
    any:
      - id: search-get-redirect-host
      - id: bbwc-updater-product-name
      - id: bidmonitor-build-path
