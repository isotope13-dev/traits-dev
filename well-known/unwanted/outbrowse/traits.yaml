# OutBrowse / BrowseFox adware installer family (SmartInstaller / CCInstaller23).
# Bundled-offer installers signed under throwaway CAs such as "CLIck TrUSt oPT".
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
  size_min: 65536
  size_max: 8388608

traits:
  - id: smart-installer-module-rtti
    desc: OutBrowse CSmartInstallerModule RTTI
    if:
      type: text
      exact: .?AVCSmartInstallerModule@@
      section: .data

  - id: cc-installer23-browser-rtti
    desc: OutBrowse CCInstaller23Browser RTTI
    if:
      type: text
      exact: .?AVCCInstaller23Browser@@
      section: .data

  - id: always-offer-flag
    desc: AlwaysOffer adware installer flag
    if:
      type: text
      exact: AlwaysOffer
      section: .rdata

  - id: offerid-zero-query
    desc: offerid=0 adware offer query string
    if:
      type: text
      exact: offerid=0
      section: .rdata

  - id: installer-path-fragment
    desc: A/Installer/ adware path fragment
    if:
      type: text
      exact: A/Installer/
      section: .rdata

composite_rules:
  - id: outbrowse-smart-installer
    desc: OutBrowse SmartInstaller adware module
    crit: hostile
    conf: 0.98
    all:
      - id: smart-installer-module-rtti
      - id: cc-installer23-browser-rtti
      - id: always-offer-flag

  - id: outbrowse-offer-download-installer
    desc: OutBrowse offer-driven download installer
    crit: hostile
    conf: 0.97
    all:
      - id: cc-installer23-browser-rtti
      - id: offerid-zero-query
      - id: micro-behaviors/communications/http/get::url-download-to-file-import
    any:
      - id: always-offer-flag
      - id: installer-path-fragment
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-open
