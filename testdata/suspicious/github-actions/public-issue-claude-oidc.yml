name: Issue agent with OIDC
on:
  issues:
    types: [opened]
jobs:
  claude:
    if: contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
