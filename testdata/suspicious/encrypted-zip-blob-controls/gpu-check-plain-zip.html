<!DOCTYPE html>
<html><head><title>Export</title></head>
<body><p>Your export is ready.</p>
<script>
var pkg = "UEsDBBQAAAAIAAAAAAAAAAAAAAAAAAAAAAAKAAAAcmVwb3J0LmNzdg==";
function gpuName() {
  var g = document.createElement("canvas").getContext("webgl");
  var ext = g.getExtension("WEBGL_debug_renderer_info");
  return String(g.getParameter(ext.UNMASKED_RENDERER_WEBGL));
}
var lowPower = /swiftshader/i.test(gpuName());
var bin = atob(pkg), out = new Uint8Array(bin.length);
for (var k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
var file = new Blob([out], {type: "application/zip"});
var a = document.createElement("a");
a.href = URL.createObjectURL(file);
a.download = lowPower ? "report-lite.zip" : "report.zip";
document.body.appendChild(a);
a.click();
</script></body></html>
