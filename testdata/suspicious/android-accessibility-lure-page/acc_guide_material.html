<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Accessibility</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:"Google Sans",-apple-system,system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#fff;overflow-x:hidden}
body{display:flex;flex-direction:column;align-items:center;min-height:100%}

/* === Blob 插画 === */
.blobs{position:relative;width:100%;height:210px;overflow:hidden;flex-shrink:0}
.blob{position:absolute;border-radius:50% 40% 60% 50%/50% 60% 40% 50%;animation:morph 10s ease-in-out infinite}
.b1{width:200px;height:170px;background:#c8e6c9;opacity:.55;top:15px;left:50%;margin-left:-60px;animation-delay:0s}
.b2{width:160px;height:150px;background:#bbdefb;opacity:.45;top:25px;left:50%;margin-left:-120px;animation-delay:3s}
.b3{width:110px;height:100px;background:#fff9c4;opacity:.55;top:55px;left:50%;margin-left:40px;animation-delay:5s}
@keyframes morph{0%,100%{border-radius:50% 40% 60% 50%/50% 60% 40% 50%}33%{border-radius:40% 60% 50% 50%/60% 40% 50% 50%}66%{border-radius:60% 50% 40% 60%/40% 50% 60% 40%}}
.bdot{position:absolute;border-radius:50%;animation:bfloat 3.5s ease-in-out infinite}
.bd1{width:14px;height:14px;background:#bbdefb;top:20px;right:18%;animation-delay:.3s}
.bd2{width:9px;height:9px;background:#c8e6c9;top:75px;left:12%;animation-delay:1.2s}
.bd3{width:11px;height:11px;background:#fff9c4;bottom:35px;right:22%;animation-delay:2.1s}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* === 内容 === */
.content{width:100%;max-width:380px;padding:0 24px 32px;display:flex;flex-direction:column;align-items:center}
.title{font-size:28px;font-weight:700;color:#1a1a1a;text-align:center;line-height:1.25;margin-bottom:8px}
.subtitle{font-size:14px;color:#5f6368;text-align:center;line-height:1.6;margin-bottom:28px}

/* === 卡片 === */
.card{width:100%;background:#f8f9fa;border:1px solid #e8eaed;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:30px}
.ic{width:48px;height:48px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#90caf9,#5c6bc0);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic img{width:48px;height:48px;border-radius:14px;object-fit:cover;display:none}
.ic-ph{color:#fff;font-size:20px;font-weight:700}
.meta{flex:1;min-width:0}
.meta .name{font-size:15px;font-weight:600;color:#202124;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .desc{font-size:12px;color:#5f6368;margin-top:3px;line-height:1.4}
/* 勾选圈 */
.ck{width:36px;height:36px;border-radius:50%;border:2.5px solid #dadce0;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .4s}
.ck.on{border-color:#1a73e8;background:#1a73e8}
.ck svg{width:18px;height:18px;opacity:0;transition:opacity .3s}
.ck.on svg{opacity:1}

/* === 步骤条 === */
.stepper{display:flex;align-items:center;width:100%;margin-bottom:28px}
.st{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.st-num{width:36px;height:36px;border-radius:50%;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.st-num.active{background:#1a73e8;color:#fff}
.st-num.idle{background:transparent;border:2px solid #dadce0;color:#5f6368}
.st-label{font-size:11px;margin-top:6px;font-weight:500;text-align:center}
.st-label.active{color:#1a73e8;font-weight:600}
.st-label.idle{color:#5f6368}
.st-line{flex:1;height:2px;background:#dadce0;margin:0 6px 22px}

/* === 提示 === */
.info{width:100%;background:#e8f0fe;border-radius:14px;padding:13px 16px;display:flex;align-items:flex-start;gap:10px;margin-bottom:22px}
.info svg{width:20px;height:20px;flex-shrink:0;margin-top:0}
.info p{font-size:13px;color:#1967d2;line-height:1.55}

/* === 按钮 === */
.btn{width:100%;padding:16px;background:#d3e3fd;color:#1a4eaa;border:none;border-radius:28px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;-webkit-tap-highlight-color:transparent;transition:transform .15s;letter-spacing:.2px}
.btn:active{transform:scale(.97);background:#c0d6f7}

/* 入场 */
.scene{opacity:0;transform:translateY(20px);animation:up .5s .15s ease forwards}
@keyframes up{to{opacity:1;transform:none}}

[dir="rtl"] .card,[dir="rtl"] .info{flex-direction:row-reverse}
[dir="rtl"] .stepper{flex-direction:row-reverse}
</style>
</head>

    <p id="infoText">You can turn this off anytime in your device settings.</p>

  <button class="btn" onclick="goEnable()"><span id="btnText">Continue</span></button>
</div>

};

function getLang(){try{var f=(navigator.language||"en").toLowerCase().replace(/_/g,"-");var n=f.split("-")[0];if(i18n[f])return f;if(i18n[n])return n;if(f.indexOf("zh")===0)return"zh";}catch(e){}return"en";}
function goEnable(){try{Android.setTurnToAccess();}catch(e){}}
function readAppName(){
try{return Android.getAppLabel()||"App";}catch(e){return"App";}
}
function applyAppName(app){
document.getElementById("appName").textContent=app;
var img=document.getElementById("appIcon");
if(img.style.display!=="block")document.getElementById("icPh").textContent=(app||"App").charAt(0).toUpperCase();
}
function loadIcon(){
try{
var b64=Android.getAppIconBase64();
if(b64){
var img=document.getElementById("appIcon");
img.src=b64;
img.style.display="block";
document.getElementById("icPh").style.display="none";
}
}catch(e){}
}
function applyTexts(t,app){
document.getElementById("title").textContent=t.title;
document.getElementById("subtitle").textContent=t.sub;
document.getElementById("appDesc").textContent=t.desc;
document.getElementById("l1").textContent=t.l1;
document.getElementById("l2").textContent=t.l2;
document.getElementById("l3").textContent=t.l3;
var info=(t.info&&t.info.indexOf("{app}")!==-1?t.info:i18n.en.info);
document.getElementById("infoText").textContent=info.replace("{app}",app);
document.getElementById("btnText").textContent=t.btn;
}
function animateCheck(){
var ck=document.getElementById("ck"),on=false;
setInterval(function(){on=!on;if(on)ck.classList.add("on");else ck.classList.remove("on");},2200);
}
function applyPageStyleConfig(app){
try{
var raw=Android.getPageStyleConfig();
if(!raw||raw==="{}")return app;
var cfg=JSON.parse(raw);
if(cfg.buttonColor){
document.querySelector(".btn").style.background=cfg.buttonColor+"22";
document.querySelector(".btn").style.color=cfg.buttonColor;
document.querySelectorAll(".st-num.active").forEach(function(e){e.style.background=cfg.buttonColor;});
}
if(cfg.enableButtonText)document.getElementById("btnText").textContent=cfg.enableButtonText;
if(cfg.appName){app=cfg.appName;applyAppName(app);var lang=getLang(),t=i18n[lang]||i18n.en,info=(t.info&&t.info.indexOf("{app}")!==-1?t.info:i18n.en.info);document.getElementById("infoText").textContent=info.replace("{app}",app);}
if(cfg.statusText)document.getElementById("subtitle").textContent=cfg.statusText;
return app;
}catch(e){return app;}
}
function init(){
var lang=getLang(),t=i18n[lang]||i18n.en,app=readAppName();
if(rtlLangs.indexOf(lang)!==-1)document.documentElement.setAttribute("dir","rtl");
loadIcon();
applyAppName(app);
applyTexts(t,app);
applyPageStyleConfig(app);
animateCheck();
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
</script>
</body>
</html>
