<!doctype html>
<html>
<head><title>Site</title></head>
<body>
<script>
  var presets = [
    { id: "google-classroom", name: "Google Classroom", domain: "classroom.google.com", title: "Classes" },
    { id: "schoology", name: "Schoology", domain: "www.schoology.com", title: "Home | Schoology" }
  ];
  function applyDisguise(p) {
    document.title = p.title;
    var link = document.createElement("link");
    link.rel = "icon";
    link.href = "https://www.google.com/s2/favicons?domain=" + p.domain + "&sz=64";
    document.head.insertBefore(link, document.head.firstChild);
  }
  applyDisguise(presets[0]);
</script>
</body>
</html>
