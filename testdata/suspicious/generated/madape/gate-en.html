<!doctype html><html lang="en"><meta charset="utf-8"><title>Hold to Verify</title>
<body><button id="hold">Tap &amp; hold to verify</button><script>
let timer;
function completed() {
  document.cookie='_cv=1;path=/;max-age=300;SameSite=Lax';
  setTimeout(()=>window.location.reload(),700);
}
document.getElementById('hold').addEventListener('pointerdown', () => {timer=setTimeout(completed,3000)});
document.getElementById('hold').addEventListener('pointerup', () => clearTimeout(timer));
document.addEventListener('contextmenu',
  function(e){ e.preventDefault() });

document.addEventListener('keydown', function(e){
  if(
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey &&
      ['I','J','C'].indexOf(e.key) > -1) ||
    (e.ctrlKey && e.key === 'u')
  ) e.preventDefault()
});
</script></body></html>
