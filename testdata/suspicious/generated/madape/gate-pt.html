<!doctype html><html lang="pt"><meta charset="utf-8"><title>Verificação</title>
<body><button id="hold">Mantenha pressionado</button><script>
let timer;
function completed() {
  document.cookie = "checked=1; SameSite=Lax; max-age=240; path=/";
  setTimeout(()=>window.location.reload(),700);
}
document.getElementById('hold').addEventListener('pointerdown', () => {timer=setTimeout(completed,3000)});
document.getElementById('hold').addEventListener('pointerup', () => clearTimeout(timer));
document.addEventListener('contextmenu',
  function(event){ event.preventDefault() });

document.addEventListener('keydown', function(event){
  if(
    event.key === 'F12' ||
    (event.ctrlKey && event.shiftKey &&
      ['I','J','C'].indexOf(event.key) > -1) ||
    (event.ctrlKey && event.key === 'u')
  ) event.preventDefault()
});
</script></body></html>
