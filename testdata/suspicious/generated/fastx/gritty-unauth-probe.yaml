id: fastx-gritty-dryrun-probe-fixture

info:
  name: FastX 3 Gritty Unauthenticated Accept Check
  author: test
  severity: critical
  tags: fastx,socketio,unauth

http:
  - raw:
      - |
        GET /socket.io/?EIO=3&transport=polling&t=probe1 HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /socket.io/?EIO=3&transport=polling&sid={{sid}}&t=probe2 HTTP/1.1
        Host: {{Hostname}}

        10:40/gritty,

      - |
        GET /socket.io/?EIO=3&transport=polling&sid={{sid}}&t=probe3 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body_3
        words:
          - '42/gritty,["accept"'
