<html>
<head>
<script>
// Near miss: legitimate client-side export builds a ZIP File for the user.
// No staged archive, no base64 decode-to-Blob chain, so the smuggling
// composites must stay silent while the neutral File trait still fires.
function saveExport(bytes) {
  var blob = new Blob([bytes], {type: 'application/octet-stream'});
  var f = new File([blob], 'export.zip', {type: 'application/zip'});
  var url = URL.createObjectURL(f);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'export.zip';
  a.click();
}
</script>
</head>
<body></body>
</html>
