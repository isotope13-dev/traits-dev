<html>
<head>
<script>
// Near miss: an ordinary reverse loop with no staged fragments and no
// carrier assembly. Reversal alone must stay silent at hostile level.
function rev(s){var o="";for(var i=s.length-1;i>=0;i--){o+=s[i];}return o;}
document.getElementById('out').textContent=rev("hello");
</script>
</head>
<body><div id="out"></div></body>
</html>
