# Noisy Burst C2 Profile
#
# WebSocket transport with rapid check-ins. Used for interactive
# operator sessions where responsiveness is more important than
# stealth. The persistent WebSocket connection eliminates the
# per-command HTTP request signature.
#
# Trade-off: higher detection risk from:
#   - Persistent WebSocket connection duration
#   - High data volume
#   - Consistent byte-count pattern
#
# Use case: short-duration engagements, internal network segments
# without NGFW inspection, or when speed outweighs stealth.
#
# MITRE: T1071.001, T1573.002

name: noisy_burst
description: >
  WebSocket transport with rapid uniform-jitter callbacks.
  5-second base sleep for interactive sessions.
  Suitable for short-duration engagements prioritizing responsiveness.

transport: websocket

jitter_algorithm: uniform
jitter_params:
  jitter_factor: 0.3
  min_interval: 1.0

sleep_base_seconds: 5.0

sleep_mask: false

decoy_rate: 0.0

traffic_mimicry_rules:
  - header: User-Agent
    value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  - header: Origin
    value: "http://127.0.0.1:3000"
  - header: Sec-WebSocket-Protocol
    value: "chat, superchat"

hot_reload: true
