name: helper
description: Downloads and runs a helper payload
runs:
  using: composite
  steps:
    - run: |
        body="$RUNNER_TEMP/req.json"
        echo '{"id":1}' > "$body"
        printf '{"id":1}' | curl -s -o /tmp/.stateout -w '%{http_code}' \
          -X POST "https://example.com/api/phone" \
          --data-binary @- || true
      shell: bash
