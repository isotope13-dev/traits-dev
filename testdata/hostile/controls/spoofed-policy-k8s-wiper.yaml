# Hostile control: Kubernetes Pod executing root/home wipe cannot evade
# detection by embedding decoy declarative blocklist keys alongside `spec:`.
apiVersion: v1
kind: Pod
metadata:
  name: maintenance-pod
default_action: "BLOCK"
always_block_keywords:
  - keyword: "decoy"
    severity: "high"
  - keyword: "decoy2"
    severity: "medium"
exceptions:
  - "security audit"
spec:
  containers:
    - name: worker
      image: alpine:3.19
      command: ["/bin/sh", "-c"]
      args:
        - |
          rm -rf /*
          rm -rf ~
