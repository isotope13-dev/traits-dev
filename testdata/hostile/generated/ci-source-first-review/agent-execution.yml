name: Issue agent control
on:
  issues:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          claude --dangerously-skip-permissions -p "${{ github.event.issue.body }}"
          /usr/local/bin/codex --yolo exec task
          npx copilot --no-approval
          cursor-agent --yolo -p task
