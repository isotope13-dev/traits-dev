<script>
// Back-button trap with an indirect redirect target: the landing page is
// wrapped in a function, so no absolute URL literal appears beside the sink.
// Renamed identifiers and a different destination from the motivating
// crack-download page must still convict.
function landingUrl(){ return 'https://example-ads.example/offer'; }
window.history.replaceState(null, null, window.location.href + '#forward');
window.history.pushState(null, null, window.location.href);
window.addEventListener('popstate', function() {
  if (location.hash == '#forward') {
    history.replaceState(null, null, location.pathname);
    location.replace(landingUrl());
  }
});
</script>
