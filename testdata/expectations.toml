# Both hostile verdicts on this loader are gated on
# `metadata/signed/trust-level::unsigned`, which is the point of carrying it:
# that trait was dead for the whole PE corpus (a `max: 0` threshold on
# `pe.cert_table_size`, a metric filefacts emits only when the binary IS
# signed) and nothing in this file noticed, because no fixture here was a PE.
# 88 rules gate on it, most of them hostile composites whose premise is "and
# the binary is unsigned". A score floor cannot catch it -- the composite does
# not surface in the score -- so the guard has to be a hostile count that
# collapses without it.
#
# The floor is 247 rather than 248 because `metadata/binary/layout::pe-no-signature-record`
# was a second trait with the identical matcher (`pe.signatures[0].subject`
# absent) and scored alongside its twin; 248 was calibrated while that one
# observation counted twice. Deduplicating it -- which `dedup/dupe-atomic`
# requires -- removed the double count, so 248 is now unreachable without
# reintroducing a duplicate validation rejects. The hostile/suspicious counts
# below are the real guard, per the note above.
[[hostile]]
name = "coa-npm-sdd-loader.dll.xz"
min_score = 247
min_hostile = 2
min_suspicious = 2

# The Chrysalis loader DLL from the 2025 Notepad++ update-infrastructure
