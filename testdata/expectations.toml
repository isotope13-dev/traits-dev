# anti-analysis or packing traits the other Chrysalis combos require. Pins the
# complete-export-set fingerprint, which is what gives a thin loader like this
# a verdict above suspicious.
[[hostile]]
name = "chrysalis-loader.dll.xz"
min_score = 165
min_hostile = 1
min_suspicious = 8

