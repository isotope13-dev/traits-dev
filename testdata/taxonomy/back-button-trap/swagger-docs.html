<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyService API Documentation</title>
  <link rel="stylesheet" href="./swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="./swagger-ui-bundle.js"></script>
<script src="./swagger-ui-standalone-preset.js"></script>
<script>
// Boot the vendored Swagger UI dist bundle against the local OpenAPI spec.
// Its docs router keeps the section in the URL bar and re-renders on Back.
window.onload = function() {
  window.ui = SwaggerUIBundle({
    url: "openapi.json",
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    plugins: [SwaggerUIBundle.plugins.DownloadUrl]
  });
  // Keep the visible section addressable: forge an entry per docs section
  // and re-render the section when the visitor navigates history.
  function showSection(name) {
    window.history.pushState({section: name}, name, '?section=' + name);
    window.ui.preenableFilter(name);
  }
  window.addEventListener('popstate', function(event) {
    var section = (event.state && event.state.section) || 'overview';
    window.ui.preenableFilter(section);
  });
  // Filler to keep this regression fixture over the 1 KiB marker floor,
  // standing in for the minified dist bundle inlined by real docs pages.
  // Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
  // tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim
  // veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea
  // commodo consequat. Duis aute irure dolor in reprehenderit in voluptate
  // velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint
  // occaecat cupidatat non proident, sunt in culpa qui officia deserunt
  // mollit anim id est laborum. Sed ut perspiciatis unde omnis iste natus
  // error sit voluptatem accusantium doloremque laudantium, totam rem aperiam.
};
</script>
</body>
</html>
