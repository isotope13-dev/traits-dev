<!DOCTYPE html>
<html><head><title>Document</title></head>
<body>
<div id="trap" style="position: absolute; opacity: 0; z-index: 100; width: 27px; height: 20px; overflow: hidden">
<!-- <script type="text/javascript" src="https://ads.example.com/showAd.php?nid=1"></script> -->
</div>
<script type="text/javascript">
jQuery(document).ready(function(){
$("#trap").parent().mousemove(function(e){jQuery("#trap").css({top:e.pageY-10,left:e.pageX+30})});
trap_hider();var a=setTimeout("trap_hider()",5000)});
function trap_hider(){
jQuery("input").mouseout(function(){trapShow()});
jQuery("a").mouseout(function(){trapShow()});
jQuery("input").mouseover(function(){trapHide()});
jQuery("a").mouseover(function(){trapHide()});}
</script>
</body></html>
