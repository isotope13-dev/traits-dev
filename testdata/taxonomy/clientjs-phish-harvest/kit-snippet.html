<form method="post" action="/verify">
<input type="text" name="user">
<input type="password" name="pin">
<input type="hidden" name="fp_browser">
<input type="hidden" name="fp_os">
<input type="hidden" name="fp_java">
<input type="hidden" name="fp_flash">
<button>Sign In</button>
</form>
<script>
var client = new ClientJS();
$("[name='fp_browser']").val(client.getBrowser());
$("[name='fp_os']").val(client.getOS());
$("[name='fp_java']").val(client.isJava() + " " + client.getJavaVersion());
$("[name='fp_flash']").val(client.isFlash() + " " + client.getFlashVersion());
</script>
