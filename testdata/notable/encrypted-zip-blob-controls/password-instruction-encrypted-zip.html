<!DOCTYPE html>
<html><head><title>Secure Export</title></head>
<body><p>Your encrypted backup is ready. Use your account password to open the document</p>
<script>
var pkg = "UEsDBBQACQAIAAAAAAAAAAAAAAAAAAAAAAAKAAAAYmFja3VwLmNzdg==";
var bin = atob(pkg), out = new Uint8Array(bin.length);
for (var k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
var file = new Blob([out], {type: "application/zip"});
if (window.navigator.msSaveBlob) window.navigator.msSaveBlob(file, "backup.zip");
</script></body></html>
