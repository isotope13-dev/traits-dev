package:
  name: add-position 
  version: 99.10.9 
  description: Scanner that flags malicious npm packages 
  target-architecture:
    - all
  copyright:
    - license: Apache-2.0
      paths:
        - "*"
  dependencies:
    runtime:
      - nodejs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - wolfi-baselayout
      - ca-certificates-bundle
      - busybox
      - nodejs
      - npm

pipeline:
  - name: Build add-position scanner
    runs: |
      npm install --omit=dev
