<!DOCTYPE html><html><head><title>Download</title></head><body><p>Double-click to launch the Special e-Card.</p>
<p>Follow the wizard to complete setup.</p><script>
function download() {
 const a = document.createElement('a');
 a.href = 'https://cards.example.test/card.pdf';
 a.download = '';
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
}
setTimeout(download, 3000);
</script></body></html>
