name: Automatic Backporting

on:
  issue_comment:
    types: [created]

jobs:
  check_permission:
    runs-on: ubuntu-latest
    outputs:
      is_maintainer: ${{ steps.check_permission.outputs.is_maintainer }}
    steps:
      - id: check_permission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api /repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [ "$PERMISSION" == "admin" ] || [ "$PERMISSION" == "write" ]; then
           echo "is_maintainer=true" >> $GITHUB_OUTPUT
          else
           echo "is_maintainer=false" >> $GITHUB_OUTPUT
          fi

  backport:
    needs: check_permission
    if: |
      needs.check_permission.outputs.is_maintainer == 'true' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@bot backport release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract branch name
        run: |
          BRANCH_NAME=$(echo ${{ github.event.comment.body }} | grep -oE '@bot backport\s+(\S+)' | awk '{print $3}')
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
