<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Snippetbin</title></head>
<body>
<p>Your saved snippet, decoded for preview:</p>
<pre id="out"></pre>
<button id="copy">Copy text</button>
<script>
function reverse(s)
{
	return s.split("").reverse().join("");
}
var payload = atob(reverse("aXBjb25maWcgL2ZsdXNoZG5zDQo="));
document.getElementById("out").textContent = payload;
document.getElementById("copy").addEventListener("click", function()
{
	var r = document.createRange();
	r.selectNode(document.getElementById("out"));
	window.getSelection().removeAllRanges();
	window.getSelection().addRange(r);
	document.execCommand("copy");
	window.getSelection().removeAllRanges();
});
</script>
</body>
</html>
