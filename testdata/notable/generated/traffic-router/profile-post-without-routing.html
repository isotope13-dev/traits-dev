<script>
const profile = {
  adBlockingDetected: false,
  timezoneBrowser: Intl.DateTimeFormat().resolvedOptions().timeZone,
  webdriver: navigator.webdriver,
  gpu: null
};
const request = new XMLHttpRequest();
request.onreadystatechange = () => {
  if (request.readyState === 4) {
    document.querySelector("#status").textContent = request.responseText;
  }
};
request.open("POST", "/profile", true);
request.send(JSON.stringify(profile));
</script>
