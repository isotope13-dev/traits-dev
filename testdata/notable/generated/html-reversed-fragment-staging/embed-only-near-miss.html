<html>
<head>
<script>
// Near miss: a legitimate document viewer embedding a file. Embed creation
// without reversed staging or harvested fragments is not smuggling.
function showDoc(url){
  var e=document.createElement("embed");
  e.setAttribute("src",url);
  e.setAttribute("width","800");
  document.body.appendChild(e);
}
</script>
</head>
