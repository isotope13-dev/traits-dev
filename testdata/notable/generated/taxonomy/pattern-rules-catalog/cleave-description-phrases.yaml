traits:
  - id: curl-eval-description
    desc: eval `curl ...`
    crit: suspicious
    if:
      type: text
      substr: INERT_CURL_EVAL_MARKER
  - id: wget-eval-description
    desc: eval `wget ...`
    crit: suspicious
    if:
      type: text
      substr: INERT_WGET_EVAL_MARKER
  - id: shell-substitution-description
    desc: shell <(curl ...)
    crit: suspicious
    if:
      type: text
      substr: INERT_SHELL_SUBSTITUTION_MARKER
