# Synthetic trait-catalog file: rule definitions quote the matcher text their
# rules look for. A rule whose own pattern appears as catalog data must not
# fire on the catalog (self-match suppression regression fixture).
defaults:
  crit: notable
  for: [python, shell]
traits:
  - id: demo-clipboard-import
    desc: Demo clipboard import matcher text
    if:
      type: text
      substr: from pynput import clipboard
  - id: demo-log-delete
    desc: Demo log delete matcher text
    if:
      type: text
      substr: 'rm -rf "$HOME/Library/Logs"/*'
composite_rules:
  - id: demo-rule-pair
    desc: Demo composite pair
    all:
      - id: demo-clipboard-import
      - id: demo-log-delete
