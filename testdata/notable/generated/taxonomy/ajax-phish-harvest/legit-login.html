<form id="login">
<input type="email" id="email" placeholder="you@example.com">
<input type="password" id="password">
<button id="go">Sign In</button>
</form>
<script>
$('#go').click(function(event){
  event.preventDefault();
  $.ajax({
    url: 'login.php',
    type: 'POST',
    data: {email: $('#email').val(), password: $('#password').val()}
  });
});
</script>
