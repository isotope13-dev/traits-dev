<!doctype html><form id="login"><input id="password" type="password"><input id="otp" autocomplete="one-time-code"></form>
<script>document.getElementById('login').onsubmit = e => { e.preventDefault(); fetch('/login', {method:'POST',body:JSON.stringify({password:document.getElementById('password').value,otp:document.getElementById('otp').value})}); };</script>
