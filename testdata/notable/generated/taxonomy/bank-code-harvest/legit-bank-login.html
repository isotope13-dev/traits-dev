<!DOCTYPE html>
<html lang="de">
<head>
<title>Online-Banking - Beispielbank</title>
</head>
<body>
<form action="https://bank.example.de/cgi/login.cgi" method="post" autocomplete="off">
<label for="username">Anmeldename:</label>
<input name="username" id="username" value="" maxlength="16" type="text">
<label for="password">PIN:</label>
<input name="password" id="password" value="" autocomplete="off" minlength="5" maxlength="38" type="password">
<label for="blz">Bankleitzahl:</label>
<input name="blz" id="blz" placeholder="701 500 12" value="" maxlength="64" type="text">
<input name="login" value="Anmelden" type="submit">
</form>
</body>
</html>
