<!doctype html><script>
// Near miss: a same-page router that forges no Back entries, gates nothing
// on the URL hash, and navigates to a plain variable -- not a literal
// remote URL and not a call result. Must stay below hostile.
var returnUrl = '/home';
window.history.pushState({page: 1}, 'first', '?page=1');
window.addEventListener('popstate', function(event) {
  renderPage(event.state.page);
  if (event.state && event.state.returning) {
    location.replace(returnUrl);
  }
});
</script>
