name: Cache key
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const crypto = require("crypto");
            const hash = crypto.createHash("sha256").update(ref).digest("hex");
            core.setOutput("cache", hash.slice(0, 8));
