id: fastx-version-detect-fixture

info:
  name: FastX 3 Version Detection
  author: test
  severity: info
  tags: fastx,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/v3/api/"

    matchers:
      - type: regex
        part: body
        regex:
          - '"build"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+'
