<html><head>
<script src="https://cdn.example.com/lib.js"></script>
<title>"Autumn Catalog" - Store</title>
</head><body>
<!-- Benign control: a remote script in <head> followed by a <title> whose
text begins with a quotation mark, plus entity-escaped documentation of the
raw-text escape pattern, must not trigger rawtext-escape traits. -->
<p>Example escaped payload: &lt;/title&gt;&lt;script src="https://cdn.example.com/x.js"&gt;&lt;/script&gt;&lt;title&gt;</p>
<img src="images/logo.png" alt="Autumn Catalog">
</body></html>
