<!DOCTYPE html>
<html>
<head><title>Photo album uploader</title></head>
<body>
<script>
function uploadPhoto()
{
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/album/upload", true);
    xhr.setRequestHeader("Content-Type", "multipart/form-data; boundary=----BoundaryY");
    xhr.withCredentials = true;
    var body = "------BoundaryY\r\n" +
               "Content-Disposition: form-data; name=\"photo\"; filename=\"sunset.jpg\"\r\n" +
               "Content-Type: image/jpeg\r\n" +
               "\r\n" +
               "------BoundaryY--\r\n";
    xhr.send(body);
}
</script>
<button type="button" onclick="uploadPhoto()">Upload photo</button>
</body>
</html>
