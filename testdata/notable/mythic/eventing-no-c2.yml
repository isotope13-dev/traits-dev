name: "generate apollo payloads via cron"
description: "Generate shellcode, and service wrapper payloads"
trigger: cron
trigger_data:
  cron: "* * * * *"
steps:
  - name: "apollo bin"
    description: "generate shellcode"
    action: "payload_create"
    action_data:
      payload_type: "apollo"
      description: "apollo test payload shellcode"
      selected_os: "Windows"
      build_parameters:
      - name: "output_type"
        value: "Shellcode"
      filename: "apollo.bin"
      commands:
      - shell
      - exit
      - load
    outputs:
      PayloadUUID: "uuid"