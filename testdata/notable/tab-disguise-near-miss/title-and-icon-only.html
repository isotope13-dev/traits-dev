<!doctype html>
<html>
<head><title>Notes</title></head>
<body>
<script>
  // Dashboard sets its own title and a status icon when a job finishes.
  function setStatus(done) {
    document.title = done ? "Export complete" : "Exporting";
    var link = document.createElement("link");
    link.rel = "icon";
    link.href = done ? "/assets/ok.png" : "/assets/busy.png";
    document.head.appendChild(link);
  }
  setStatus(false);
</script>
</body>
</html>
