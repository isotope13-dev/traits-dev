<!DOCTYPE html><html><body><button id="mic">Record</button><script>
let rec, chunks=[];
async function start(){ const s=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(s); rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ const b=new Blob(chunks,{type:"audio/webm"}); const f=new FormData(); f.append("audio", b, "voice.webm"); fetch("/api/transcribe", {method:"POST", body:f}); }; rec.start(); }
document.getElementById("mic").onclick=start;
</script></body></html>
