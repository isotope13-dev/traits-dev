<html><head><title>Log viewer</title></head><body>
<script language="JScript">
var fso = new ActiveXObject("Scripting.FileSystemObject");
var wsh = new ActiveXObject("WScript.Shell");
var log = fso.CreateTextFile("C:\\temp\\run.log", true);
log.WriteLine("started");
log.Close();
wsh.Run("notepad.exe C:\\temp\\run.log", 1, false);
fso.DeleteFile("C:\\temp\\run.log");
</script></body></html>
