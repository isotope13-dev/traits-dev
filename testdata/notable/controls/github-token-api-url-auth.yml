name: Workflow token used against the Actions-provided API URL
on: workflow_dispatch
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      # Benign control for the ci-token curl atoms: the token authenticates to
      # the repository's own API URL, which is an Actions expression rather
      # than a literal host. Both spellings must stay clean while the hostile
      # sibling fixture (github-token-send.yml, and the .attacker-suffixed
      # variant) keeps firing.
      - run: curl -H "Authorization: Bearer ${{ github.token }}" "${{ github.api_url }}/user"
      - run: curl -H "Bearer ${{ github.token }}" https://${{ github.api_url }}/repos/x/y
