# Benign control: declarative guardrail blocklist naming dangerous shell commands
# to refuse, not execute.
category_name: "code_injection_guardrail"
description: "Blocks destructive shell and remote execution commands in prompts"
default_action: "BLOCK"

additional_block_words:
  - "rm -rf"
  - "chmod 777"
  - "chmod +x"
  - "curl | bash"
  - "curl | sh"
  - "wget -O -"

always_block_keywords:
  - keyword: "rm -rf /"
    severity: "high"
  - keyword: "rm -rf /*"
    severity: "high"
  - keyword: "rm -rf ~"
    severity: "high"
  - keyword: "curl | sh"
    severity: "high"
  - keyword: "sudo chmod 777 /"
    severity: "high"

exceptions:
  - "code review"
  - "security audit"
  - "defensive security"
