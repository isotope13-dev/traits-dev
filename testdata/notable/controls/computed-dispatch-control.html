<!DOCTYPE html>
<html><head><title>Key inspector</title></head>
<body>
<p id="out">Press a key</p>
<script>
var handlers = {
  show: function(code, name) {
    document.getElementById('out').textContent = name + ': ' + code;
  }
};
document.addEventListener('keydown', function(e) {
  var key = e.key || String.fromCharCode(e.keyCode);
  var action = 'show';
  handlers[action](e.keyCode, key);
  var agent = navigator.userAgent.charCodeAt(0);
  document.title = 'code ' + agent;
});
</script>
</body></html>
