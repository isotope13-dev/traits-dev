# Static matcher control only. Never submitted as a workflow or executed.
name: Airgap path assembly
on: workflow_dispatch
jobs:
  airgap:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize from a local repository path
        run: |
          PWD=$(pwd)
          ROOT=${PWD}/repository
          ./cosign initialize --root ${ROOT}/1.root.json --mirror file://${ROOT}
