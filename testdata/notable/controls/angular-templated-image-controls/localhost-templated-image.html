<!-- Static detection fixture. Never fetch the image; the URL below is
documentation text, not a request. -->
<!-- Guards: a license-style HTML comment beside a framework-templated
localhost image URL (Angular `{{ }}` data binding through a local proxy)
is ordinary UI templating, never a hidden-prompt data export. A hostile
prompt-injection finding needs actual instruction evidence. -->
<html ng-app>
<head>
  <script src="angular.min.js"></script>
</head>
<body ng-controller="ButtonsCtrl">
  <div ng-repeat="server in servers" class="pod">
    <img src="http://localhost:8001/api/v1beta3/proxy/namespaces/default/pods/{{server.podName}}/{{server.image}}" height="100px" width="100px" />
    <b>ID:</b> {{server.podName}}<br>
  </div>
</body>
</html>
