# Static matcher control only; never installed or run by the test suite.
# Loopback-only receiver. A CI environment upload warrants review, but the
# local diagnostic does not establish secret theft or a hostile destination.
name: Local environment diagnostic
description: Send diagnostic data to a local development receiver
runs:
  using: composite
  steps:
    - run: env | curl -d @- http://127.0.0.1:48192/diagnostic
      shell: bash
    - run: printenv | curl --data @- http://127.0.0.1:48192/diagnostic
      shell: bash
    - run: env | curl --data-binary @- http://127.0.0.1:48192/diagnostic
      shell: bash
