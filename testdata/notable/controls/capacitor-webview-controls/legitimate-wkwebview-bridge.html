<!doctype html>
<html><head><title>App Shell</title></head><body>
<script>
if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.appReady) {
  window.webkit.messageHandlers.appReady.postMessage({ origin: window.location.origin });
}
fetch('/api/telemetry', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ path: window.location.pathname })
});
</script>
</body></html>
