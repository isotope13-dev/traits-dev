<!DOCTYPE html>
<html><head><title>Document</title></head>
<body>
<div class="social-plugin">
<iframe src="https://www.facebook.com/plugins/like.php?href=https%3A%2F%2Fexample.com%2Fpage&amp;layout=button_count&amp;action=like&amp;show_faces=false" width="90" height="20" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowtransparency="true"></iframe>
</div>
<div id="toast" class="notification">Saved</div>
<script>
setTimeout(function(){
var toast = document.getElementById('toast');
if (toast && toast.parentNode) {
toast.parentNode.removeChild(toast);
}
}, 4000);
</script>
</body></html>
