# Tirith rule documentation: example attacks each rule catches.
# None of these run; they are the detection corpus.

[[rule]]
id = "destructive_command"
examples_bad = ["sudo rm -rf /tmp/escape", "sudo rm -rf /"]

[[rule]]
id = "threat_package_typosquat"
examples_bad = ["pip install reqeusts", "`tirith install npm reqeusts` (typo, distance 1 from `requests`)"]
examples_good = ["pip install requests", "npm install lodash"]

