<!DOCTYPE html>
<html><head><title>Binary to text converter</title></head>
<body>
<h1>Binary converter</h1>
<input id="bin" placeholder="01100101 01111000">
<button onclick="convert()">Convert</button>
<p id="out"></p>
<script>
function convert() {
  var parts = document.getElementById('bin').value.trim().split(/\s+/);
  var text = parts.map(function(b) { return String.fromCharCode(parseInt(b, 2)); }).join('');
  document.getElementById('out').textContent = text;
}
</script>
</body></html>
