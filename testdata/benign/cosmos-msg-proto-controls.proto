// Chain SDK schema shape (cf. cosmos-sdk proto/cosmos/msg/v1/msg.proto):
// interface docs stating that requests travel via blockchain transactions
// are self-description, not a dead-drop payload source.
syntax = "proto3";

package cosmos.msg.v1;

extend google.protobuf.ServiceOptions {
  // Requests must be transported via blockchain transactions rather than
  // gRPC. Tooling distinguishes Msg services via reflection.
  bool service = 11110000;
}
