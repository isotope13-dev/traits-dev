name: Local health-check unit preparation
description: Writes an unactivated user unit for a loopback HTTP health check.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        install -d "$HOME/.config/systemd/user"
        printf '[Unit]\nDescription=Local health check\n[Service]\nType=oneshot\nExecStart=/usr/bin/curl --head http://127.0.0.1:8080/health\n' \
          > "$HOME/.config/systemd/user/local-healthcheck.service"
        systemctl --user daemon-reload
