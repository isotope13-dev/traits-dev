name: Download relationship controls
description: Static test cases; do not execute these examples.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data
    - shell: bash
      run: |
        curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data
        sh /usr/local/lib/local-check.sh
    - shell: bash
      run: |
        curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data
        printf 'echo local\n' > /tmp/.cache-data
        sh /tmp/.cache-data
    - shell: bash
      run: |
        curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data || sh /tmp/.cache-data
    - shell: bash
      run: |
        if test -f local.flag; then
          curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data
        else
          sh /tmp/.cache-data
        fi
    - shell: bash
      run: |
        curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data
        sh -n /tmp/.cache-data
    - shell: bash
      run: |
        printf '%s\n' 'curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data; sh /tmp/.cache-data'
    - shell: bash
      run: |
        cat <<'EXAMPLE'
        curl -fsSL https://updates.example.invalid/data.json -o /tmp/.cache-data
        sh /tmp/.cache-data
        EXAMPLE
    - shell: bash
      run: |
        curl -fsSL -H https://updates.example.invalid/data.json -o /tmp/.cache-data
        sh /tmp/.cache-data
