# Static analyzer control. Never install or execute this fixture.
# A composite action that downloads its vendor CLI in one step and passes an
# API key to that CLI via `env` in a later step. The download and the secret
# never meet in one pipeline, so this must not read as environment theft --
# the shape that tripped objectives/exfiltration/stealer/credential/env on
# Datadog's dd-ci-upload action (dd-trace-go v1.42.1).
name: Vendor CLI auth control
description: Tool download plus separate secret-auth step
inputs:
  api-key:
    required: true
    description: Vendor API key for the upload step
  service:
    required: false
    default: example-service
    description: Service name for the uploaded results
  files:
    required: true
    description: Result files to upload
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: echo "TOOL_BUILD=linux-x64" >> $GITHUB_ENV
    - name: Install vendor CLI
      shell: bash
      run: |
        curl -L --fail "https://example.invalid/vendor-cli/releases/latest/download/tool_${{ env.TOOL_BUILD }}" --output tool
        chmod +x tool
    - name: Upload the result files
      shell: bash
      run: |
        env VENDOR_API_KEY=${{ inputs.api-key }} ./tool junit upload \
          --service ${{ inputs.service }} \
          ${{ inputs.files }}
