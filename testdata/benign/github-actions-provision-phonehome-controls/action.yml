name: runner-provision
on: workflow_dispatch
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - run: |
          body="$RUNNER_TEMP/ready.json"
          echo '{"id":1}' > "$body"
          curl -s -o "$RUNNER_TEMP/ready.response" \
            -X POST "https://provider.example/api/ready" \
            -H "Authorization: Bearer ${TOKEN}" \
            --data-binary @"$body" || true
        shell: bash
