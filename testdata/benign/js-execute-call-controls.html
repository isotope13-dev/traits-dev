<!doctype html>
<html>
<body>
<div id="panel"></div>
<script>
// Benign control: JavaScript guide-action dispatcher. These execute() calls
// are semicolon-terminated JavaScript statements, which can never be the
// VBScript Execute statement (VBScript has no semicolon terminator).
var panel = document.getElementById('panel');
panel.addEventListener('click', function (event) {
  var button = event.target.closest('[data-guide-action]');
  if (!button || button.disabled) return;
  event.stopPropagation();
  execute(button.getAttribute('data-guide-action'));
});
panel.addEventListener('keydown', function (event) {
  var action = actionForKey(event.key);
  if (!action) return;
  event.preventDefault();
  execute(action);
});
</script>
</body>
</html>
