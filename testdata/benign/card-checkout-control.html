<!DOCTYPE html>
<html><head><title>Checkout - ExampleStore</title></head>
<body>
<form method="post" action="https://pay.example.invalid/checkout/complete">
<label>Card number <input type="text" name="cardnumber" autocomplete="cc-number"></label>
<label>Expiry <input type="text" name="expdate" placeholder="MM/YY"></label>

</form>
</body></html>
