<!DOCTYPE html>
<html><head><title>Menu Demo</title></head>
<body>
<div class="nav">Products
<ul class="menu" style="display: none; position: absolute;">
<li>Widgets</li><li>Gadgets</li>
</ul>
</div>
<script type="text/javascript">
jQuery(".nav").mouseover(function(){jQuery(".menu").show();});
jQuery(".nav").mouseout(function(){jQuery(".menu").hide();});
</script>
</body></html>
