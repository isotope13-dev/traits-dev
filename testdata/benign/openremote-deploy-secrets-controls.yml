# OpenRemote deploy matrix: the whole secrets map is overlaid into SECRETS
# for the project's own multi-repo deployment scripts, not exfiltrated.
name: openremote deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: openremote/openremote/.github/actions/get-version-details@v1
        id: version
      - name: Deploy manager
        run: bash .ci_cd/deploy.sh
        env:
          MANAGER_REF: openremote/manager:SNAPSHOT-latest
          SECRETS: ${{ toJSON(secrets) }}
