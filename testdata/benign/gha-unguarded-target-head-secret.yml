name: Ungated external PR integration test
on:
  pull_request_target:
    types: [opened]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/integration-test
        with:
          token: ${{ secrets.INTEGRATION_TOKEN }}
