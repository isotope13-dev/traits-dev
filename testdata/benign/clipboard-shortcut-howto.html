<!DOCTYPE html>
<html><head><title>Editor Shortcuts</title></head>
<body>
<h1>Copy and paste shortcuts</h1>
<ol>
<li>Select text and press Ctrl+C to copy.</li>
<li>Click where you want it and press Ctrl+V to paste.</li>
</ol>
<button id="copy">Copy summary</button>
<script>
document.getElementById("copy").addEventListener("click", function(){
var t = document.createElement("textarea");
t.value = document.querySelector("h1").textContent;
document.body.appendChild(t);
t.select();
document.execCommand("copy");
document.body.removeChild(t);
});
</script>
</body></html>
