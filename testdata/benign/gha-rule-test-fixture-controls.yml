# Semgrep rule-test fixture: the vulnerable workflow below is a positive
# control for the third-party-action-not-pinned rule, not a live pipeline.
# ruleid: third-party-action-not-pinned-to-commit-sha
on:
  pull_request_target:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github.event.pull_request.head.sha
      - uses: ./.github/actions/summarize
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
