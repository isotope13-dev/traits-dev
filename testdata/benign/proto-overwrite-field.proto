syntax = "proto3";

package example.v1;

// Field numbers are wire-format tags, not assignments: `bool overwrite = 1`
// declares field 1, it does not enable an SFX overwrite directive.
message Policy {
  bool overwrite = 1;
  string name = 2;
  string description = 3;
}

service PolicyService {
  rpc GetPolicy(Policy) returns (Policy);
}
