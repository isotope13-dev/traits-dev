[project]
name = "exploits-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0",
]
# Shared lab-runner dependencies (replaces root requirements-lab.txt)
lab = [
    "flask>=3.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "simple-websocket>=1.0",
    "flask-sock>=0.7",
]

[tool.uv.workspace]
members = [
    "tools/ad-cs",
    "tools/browser-ext-attacks",
    "tools/browser-native-postex",
    "tools/byovd",
    "tools/c2",
    "tools/cloud-identity",
    "tools/edr-silencing",
    "tools/entra-abuse",
    "tools/kerberos",
    "tools/lateral-movement",
    "tools/llm-attacks",
    "tools/post-exploit-staging",
]

[tool.uv]
default-groups = ["dev"]
