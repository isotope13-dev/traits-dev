<!doctype html><script>
// Standard UTF-16 fallbacks, equivalent to the bundled entity codec.
function fromCodePointFallback(e) {
  var n = "";
  if (e > 65535) {
    e -= 65536;
    n += String.fromCharCode(e >>> 10 & 1023 | 55296);
    e = 56320 | 1023 & e;
  }
  return n + String.fromCharCode(e);
}
function toCodePointFallback(e) {
  return 1024*(e.charCodeAt(0)-55296)+e.charCodeAt(1)-56320+65536;
}
function escapeNonAscii(e) {
  return "&#x" + toCodePointFallback(e).toString(16).toUpperCase() + ";";
}
</script>
