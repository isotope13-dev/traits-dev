<!DOCTYPE html><script>
var alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
function decode(data) {
  var i=0, result='';
  while(i<data.length) {
    var a=alphabet.indexOf(data.charAt(i++)), b=alphabet.indexOf(data.charAt(i++));
    var c=alphabet.indexOf(data.charAt(i++)), d=alphabet.indexOf(data.charAt(i++));
    var bits=a<<18|b<<12|c<<6|d;
    var first=bits>>16&0xff, second=bits>>8&0xff, third=bits&0xff;
    result+=String.fromCharCode(first);
    if(c!=64)result+=String.fromCharCode(second);
    if(d!=64)result+=String.fromCharCode(third);
  }
  return result;
}
function reverse(string) {
  var ret='';
  for(var i=string.length-1;i>=0;i--){ret+=string.charAt(i);}
  return ret;
}
