<html>
<head>
<script type="text/vbscript">
' Near miss: an HTA maintenance helper that writes a log and opens it.
' File staging plus a shell launch, but no HTTP response handling, no
' dynamic evaluation, and no encoded stage: neither hostile composite
' may fire.
Sub backup
  on error resume next
  Set fso = CreateObject("Scripting.FileSystemObject")
  Set out = fso.CreateTextFile("C:\logs\run.txt", true)
  out.WriteLine "backup started"
  out.Close
  Set sh = CreateObject("Shell.Application")
  sh.ShellExecute "C:\logs\run.txt", "", "", "open", 1
End Sub
</script>
</head>
<body></body>
</html>
