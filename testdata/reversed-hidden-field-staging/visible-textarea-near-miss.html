<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Guestbook</title></head>
<body>
<form method="post" action="/sign">
<label for="c">Sign the guestbook:</label>
<textarea id="c" rows="4" cols="40" placeholder="Your message"></textarea>
<button type="button" id="s">Copy draft</button>
</form>
<script>
document.getElementById("s").addEventListener("click", function(){
	var c = document.getElementById("c");
	c.select();
	document.execCommand("copy");
});
</script>
</body>
</html>
