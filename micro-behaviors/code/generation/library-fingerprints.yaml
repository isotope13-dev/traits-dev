defaults:
  platforms: [unix, windows]
  for: [java, class]
traits:
  # These are evidence that a code-generation framework is present. Their
  # presence alone does not claim that generation occurred.
  - id: javassist
    desc: Javassist code-generation library reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: javassist
  - id: cglib
    desc: cglib code-generation library reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: cglib
  - id: byte-buddy
    desc: Byte Buddy code-generation library reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: bytebuddy
      case_insensitive: true
