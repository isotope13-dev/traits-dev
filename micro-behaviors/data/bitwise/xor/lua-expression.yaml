defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-xor-expression"
    desc: "Lua computes a bitwise XOR expression"
    crit: "notable"
    conf: 0.96
    if:
      type: "tree-sitter"
      language: "lua"
      query: "(binary_expression operator: \"~\") @xor"
