defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.85

traits:
  - id: dotnet-xor-ca-context
    desc: XOR text near hexadecimal 0xCA
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(xor[^\r\n]{0,80}0xCA|0xCA[^\r\n]{0,80}xor)'
      case_insensitive: true

  - id: dotnet-xor-202-context
    desc: XOR text near decimal 202
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(xor[^\r\n]{0,80}\b202\b|\b202\b[^\r\n]{0,80}xor)'
      case_insensitive: true

composite_rules:
  - id: dotnet-xor-key-context
    desc: XOR text near 0xCA or 202
    crit: notable
    conf: 0.82
    any:
      - id: dotnet-xor-ca-context
      - id: dotnet-xor-202-context
