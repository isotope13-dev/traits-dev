# The report supplies embedded OpenGL and OpenCL source. XOR in a compute
# kernel is a capability, not proof of payload decryption or malware identity.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: embedded-gpu-compute-xor
    desc: Embedded GPU compute source with XOR
    if:
      type: literal
      regex: '\b(gl_GlobalInvocationID|get_global_id)\b[\s\S]{0,768}\^[ \t]*[A-Za-z_][A-Za-z_0-9]*'
