defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
composite_rules:
  - id: digit-dense-long-line-xor-expression
    desc: Digit-heavy text, long line and XOR expression
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/text-distribution::js-digit-ratio-at-least-85pct
      - id: metadata/file/text-distribution::near-zero-whitespace-source
      - id: metadata/file/line::single-long-line
      - id: metadata/lang/source/syntax/operator::js-keyword-xor
