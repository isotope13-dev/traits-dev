# A caret is XOR in these grammars, not in Lua or mathematical prose.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: parsed-caret-xor-expression
    desc: Parsed XOR binary expression
    for: [source, -typescript, -swift, -groovy, -kotlin, -scala, -elixir, -clojure]
    if:
      type: tree-sitter
      query: '(binary_expression "^") @xor'
  - id: js-ts-caret-xor-syntax
    desc: Caret XOR operator syntax in JS/TS
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      regex: '[A-Za-z0-9_$)\]]\s*\^=?\s*[A-Za-z0-9_$(\[~+\-!]'
  - id: php-caret-xor-expression
    desc: PHP parsed caret XOR expression
    for: [php]
    if:
      type: tree-sitter
      query: '(binary_expression operator: "^") @xor'
  - id: php-compound-xor-assignment
    desc: PHP compound XOR assignment expression
    for: [php]
    if:
      type: tree-sitter
      query: '(augmented_assignment_expression operator: "^=") @xor'
  - id: swift-bitwise-xor-expression
    desc: Swift parsed XOR expression
    for: [swift]
    if:
      type: tree-sitter
      query: '(bitwise_operation op: "^") @xor'
  - id: kotlin-infix-xor-expression
    desc: Kotlin infix XOR operation
    for: [kotlin]
    if:
      type: tree-sitter
      language: kotlin
      query: |
        ((infix_expression . (_) . (identifier) @operator . (_) .) @xor
          (#eq? @operator "xor"))
    unless:
      - {type: symbol, kind: function, exact: xor}
  - id: xor-named-helper-call
    desc: Calls an XOR-named helper
    for: [source, scripts]
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(bitxor|bxor|xor)$'

composite_rules:
  - id: js-ts-parsed-xor-expression
    desc: JavaScript or TypeScript XOR operation
    for: [javascript, typescript]
    all:
      - id: metadata/lang/source/syntax/operator::bitwise-xor-operator
      - id: js-ts-caret-xor-syntax
