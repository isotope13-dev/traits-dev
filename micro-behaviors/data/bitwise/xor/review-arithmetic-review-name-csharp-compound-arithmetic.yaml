# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - csharp
  crit: baseline
  conf: 0.88
traits:
- id: compound-xor-assignment
  desc: C# compound XOR assignment
  if:
    type: tree-sitter
    kind: assignment
    regex: "\\b[A-Za-z_]\\w*\\s*\\^=\\s*[A-Za-z_]\\w*\\s*$"
