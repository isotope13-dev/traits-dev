---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
  conf: 0.9
traits:
- id: php-packed-hex-before-xor
  desc: PHP hex packing appears before XOR
  if:
    type: text
    regex: pack\s*\(\s*["']H\*["'][\s\S]{0,300}\^
  unless:
  - id: micro-behaviors/data/encode/hex::php-hex-unpack-repack-endian
  - id: well-known/lib/crypto/phpseclib
  - id: well-known/lib/crypto/firebase-jwt
