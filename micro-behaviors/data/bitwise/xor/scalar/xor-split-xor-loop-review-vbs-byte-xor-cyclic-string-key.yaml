defaults:
  platforms: [windows]
  for: [asp, vbs, html]
  crit: notable

traits:
  - id: vbs-byte-xor-cyclic-string-key
    desc: VB byte XOR uses cyclic string-key index
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bXor\s+Asc\s*\(\s*Mid\s*\(\s*\w+,\s*\(\w+\s+and\s+15\)\s*\+\s*1\s*,\s*1\)'
