# Numeric-key XOR combined with single-byte masking (255 / 0xff) in source text.
# Covers both operand orders (`KEY ^ (v & 255)`, `(v & 255) ^ KEY`, and
# `(v ^ KEY) & 255`) independent of surrounding character-conversion helpers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, text]
  crit: notable

traits:
  - id: js-key-xor-masked-byte-expr
    desc: Numeric key XORs a byte-masked variable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(0x[0-9a-f]{1,2}|\d{1,3})\s*\^\s*\(?\s*[\w$]+\s*&\s*(255|0xff)\b'

  - id: js-masked-var-xor-key-expr
    desc: Byte-masked variable XORed with numeric key
    conf: 0.93
    if:
      type: text
      regex: '(?i)[\w$]+\s*&\s*(255|0xff)\s*\)?\s*\^\s*(0x[0-9a-f]{1,2}|\d{1,3})\b'

  - id: js-var-xor-key-masked-expr
    desc: Variable XORed with numeric key and byte-masked
    conf: 0.93
    if:
      type: text
      regex: '(?i)[\w$]+\s*\^\s*(0x[0-9a-f]{1,2}|\d{1,3})\s*\)?\s*&\s*(255|0xff)\b'

composite_rules:
  - id: js-numeric-key-byte-mask-xor
    desc: Masks unpacked variable to a byte with numeric XOR
    crit: notable
    conf: 0.94
    any:
      - id: js-key-xor-masked-byte-expr
      - id: js-masked-var-xor-key-expr
      - id: js-var-xor-key-masked-expr
