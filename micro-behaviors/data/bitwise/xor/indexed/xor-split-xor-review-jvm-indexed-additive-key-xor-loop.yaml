# Bytecode forms of JVM XOR transforms. These patterns describe the loop
# mechanics rather than any payload name, key value, or family-specific data.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: jvm-indexed-additive-key-xor-loop
    desc: JVM XOR mixes repeating key with index
    conf: 0.98
    for: [class]
    if:
      type: hex
      pattern: '2D 15 04 2D BE 70 33 11 00 FF 7E 15 04 11 00 FF 7E 60 36 05 2B 15 04 2B 15 04 33 15 05 11 00 FF 7E 91 82 91 54'

  # char[i] = (char)(data[i] ^ constant), as emitted by javac. This is a
  # neutral decoder primitive; objectives correlate it with concealed data.
