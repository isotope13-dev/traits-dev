# Bytecode forms of JVM XOR transforms. These patterns describe the loop
# mechanics rather than any payload name, key value, or family-specific data.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: java-indexed-byte-scalar-xor
    desc: Java byte array uses scalar XOR
    conf: 0.92
    platforms: [android, unix, windows]
    for: [java, kotlin]
    if:
      type: text
      regex: '\(byte\)\s*\(\w+\[\w+\]\s*\^\s*(0x[0-9A-Fa-f]{1,2}|\w+)\)'
