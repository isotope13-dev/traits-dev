# Character output of an indexed XOR expression does not by itself establish decoding or delivery.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, text]

traits:
  - id: xor-array-byte-to-character-stream
    desc: XOR-transformed array byte emitted as character
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'f?printf\s*\([^;\n]{0,32}%c[^;\n]{0,32}\w+\[\w+\]\s*\^\s*\w+\s*[,)&]'
