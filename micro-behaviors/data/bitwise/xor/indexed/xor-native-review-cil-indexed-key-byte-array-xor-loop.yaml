defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-indexed-key-byte-array-xor-loop
    desc: CIL repeating-key XOR of byte arrays
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Byte array[index] ^= key[index % key.Length], then advance index
      # and branch while the input remains. Metadata token bytes are skipped.
      pattern: '02 07 02 07 91 06 07 06 8E 69 5D 91 61 D2 9C 07 17 58 0B 07 02 8E 69 32 ?? ??'
