# AL,DH,AH,DL consume the two words of a generated 64-bit state in byte order.
# Direction is deliberately unspecified: the same routine encrypts/decrypts.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
- id: x86-interleaved-state-xor-loop
  desc: x86 interleaved state-byte XOR stream loop
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: text
    pattern: '30 06 46 4B 85 DB 75 09 [9] 30 36 46 4B 85 DB 75 09 [9] 30 26 46 4B 85 DB 75 09 [9] 30 16 46 4B 85 DB'
