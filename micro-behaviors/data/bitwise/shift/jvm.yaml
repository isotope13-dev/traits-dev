defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: jvm-two-bit-shift-or
    desc: JVM shifts two bits then ORs
    # iconst_2, ishl, iload[_n] digit, ior. The one-byte form uses
    # iload_0..iload_3; the two-byte form uses iload with a local index.
    if:
      type: hex
      pattern: '05 78 (1A | 1B | 1C | 1D | 15 ??) 80'
