defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: six-bit-digit-accumulation
    desc: Appends a six-bit digit to accumulator
    if:
      type: text
      exclude_comments: true
      regex: '\(\s*\w+\s*<<\s*6\s*\)\s*\|\s*\w+'
  - id: shifted-masked-byte-push
    desc: Pushes shifted accumulator masked to byte
    if:
      type: text
      exclude_comments: true
      regex: '\.push\s*\(\s*\(\s*\w+\s*>>\s*\w+\s*\)\s*&\s*(255|0xff)\s*\)'
