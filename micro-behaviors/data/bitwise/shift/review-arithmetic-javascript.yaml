# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
traits:
- crit: notable
  id: js-bitwise-arithmetic-chain
  desc: JavaScript bitwise arithmetic and shift chain
  conf: 0.8
  size_max: 400000
  if:
    type: text
    regex: "[0-9]{2,}.{0,12}[&|^].{0,12}[0-9]{2,}.{0,12}(<<|>>).{0,12}[&|^]"
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
