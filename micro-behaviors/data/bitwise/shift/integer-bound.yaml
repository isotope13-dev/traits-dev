# Generic integer arithmetic also occurs in React and timer implementations.
# Key-recovery consumers supply any cryptographic purpose.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: baseline
traits:
  - id: one-shift-31
    desc: Shifts integer one left by 31 bits
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b1[uUlL]{0,3}\s*<<\s*31\b'
