# A low-bit mask is a neutral source operation; hostile meaning comes from
# composites that connect it to a sensitive value and an outbound channel.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: javascript-low-bit-mask
  desc: JavaScript low-bit mask expression
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: binary_op
    regex: '(?i)(^|[^&])&[ \t]*(1|0x0*1)$|^(1|0x0*1)[ \t]*&[^&]'
