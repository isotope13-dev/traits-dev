# A low-bit mask is a neutral source operation; hostile meaning comes from
# composites that connect it to a sensitive value and an outbound channel.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: javascript-low-bit-mask
  desc: JS low-bit mask
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)&\s*1\b|\b1\s*&|\band\s+1\b'
