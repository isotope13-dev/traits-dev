# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  crit: notable
  conf: 0.95
traits:
- id: low-bit-mask-expression
  desc: Parsed low-bit masking expression
  if:
    type: tree-sitter
    kind: binary_op
    regex: "&[ \\t]*1$"
- id: low-twelve-bit-mask-expression
  desc: Masks low 12 bits (page offset)
  for:
  - scripts
  - source
  if:
    type: text
    regex: '(?i)&\s*(0x0*fff|4095)\b'
