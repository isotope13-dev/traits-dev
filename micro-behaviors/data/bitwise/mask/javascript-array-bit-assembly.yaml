defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: js-masked-array-shift-accumulator
    desc: Accumulates shifted masked array elements
    conf: 0.95
    if:
      type: text
      # Mask values can be concealed behind a string-table accessor. This
      # establishes bit assembly, not that the mask equals one or that the
      # source is a pixel buffer.
      regex: '\|=\s*\(\w{1,12}\[[^\n]{1,32}\]&[\w()]{1,16}\)\s*<<\w{1,12}'
