defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: js-key-add-mask-byte-update
    desc: JavaScript key addition masked to byte
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: 'key\s*=\s*\(\s*key\s*\+\s*\w+\s*\+\s*0x[0-9a-fA-F]+\s*\)\s*&\s*0xff'

