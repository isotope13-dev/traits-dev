# A byte-array cipher round: an indexed element rewritten through arithmetic
# and masked back to a byte, repeated across several rounds.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: js-indexed-byte-mask-rounds
    desc: Rewrites array bytes through masked rounds
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '\b\w+\[\w+\]=[^;\n]{0,90}&0xff\b'
