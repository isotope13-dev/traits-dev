# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - text
traits:
- id: six-bit-mask-macro
  desc: Macro masks a value to six bits
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: "#\\s*define\\s+\\w{1,32}\\(\\w+\\)[^\\n]{0,90}&\\s*(077|0[xX]3[fF]|63)\\b"
