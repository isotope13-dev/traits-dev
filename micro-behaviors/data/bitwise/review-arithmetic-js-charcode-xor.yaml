# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-charcode-xor-operation
  desc: JavaScript charCodeAt XOR operation
  crit: notable
  conf: 0.9
  for:
  - html
  - javascript
  if:
    type: tree-sitter
    query: |
      (binary_expression
        left: (call_expression
          function: (_) @method)
        operator: "^"
        (#match? @method "(\\.charCodeAt|\\[\\s*[\"']charCodeAt[\"']\\s*\\])$"))
