# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  for:
  - scripts
  - source
  - class
  platforms:
  - linux
  - macos
  - windows
  crit: notable
traits:
- id: source-shift-or-low-bit
  desc: Shifted accumulator ORs a masked low bit
  conf: 0.97
  if:
    type: text
    regex: "<<\\s*1\\s*\\)\\s*\\|\\s*\\([^;\\n]{1,120}&\\s*(0x0*1|1)\\b"
- id: powershell-shift-or-low-bit
  desc: PowerShell accumulator ORs a masked low bit
  conf: 0.97
  if:
    type: text
    regex: "(?i)-shl\\s+1\\s*\\)\\s*-bor\\s*\\([^;\\n]{1,120}-band\\s+(0x0*1|1)\\b"
