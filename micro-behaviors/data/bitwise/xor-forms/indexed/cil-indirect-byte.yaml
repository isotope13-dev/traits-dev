defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-indirect-modulo-key-byte-xor
    desc: CIL indirect byte XOR with modulo-indexed key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # ldelema byte; dup; ldind.u1; key[index % key.Length]; xor;
      # conv.u1; stind.i1. Support compact arg/local and short local loads.
      # Preserve the typed ldobj/stobj form in its existing canonical rule.
      pattern: '8F ?? ?? ?? 01 25 47 (02|03|04|05|06|07|08|09|11 ??) (06|07|08|09|11 ??) (02|03|04|05|06|07|08|09|11 ??) 8E 69 5D 91 61 D2 52'
