defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: js-bytewise-xor-loop
    desc: JavaScript mutates bytes with XOR
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      # `key.charCodeAt(i)` and `key["charCodeAt"](i)` are the same call;
      # obfuscator.io rewrites dot members to bracket subscripts.
      regex: '[\w$]+\s*\[[^\]]{1,40}\]\s*\^=\s*[\w$]+(\.charCodeAt|\[["'']charCodeAt["'']\])'

