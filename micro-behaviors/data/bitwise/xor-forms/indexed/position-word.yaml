defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-position-multiplied-word-xor
    desc: Position-multiplied XOR over stack words
    conf: 0.98
    if:
      type: hex
      section: .text
      # imul ecx,ecx,key; xor [rsp+rax*2+disp32],cx;
      # reload the counter; compare its bound; branch backward.
      # Both the multiplier and buffer/counter offsets vary independently.
      pattern: '69 C9 ?? ?? ?? ?? 66 31 8C 44 ?? ?? ?? ?? 8B 44 24 ?? 83 F8 ?? 72 (8?|9?|A?|B?|C?|D?|E?|F?)'
