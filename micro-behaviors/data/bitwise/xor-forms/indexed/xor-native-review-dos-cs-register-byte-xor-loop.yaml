defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-cs-register-byte-xor-loop
    desc: DOS XORs bytes through CS segment
    crit: notable
    conf: 0.96
    if:
      type: hex
      # MOV AH,CS:[SI]; XOR AH,DH; MOV CS:[SI],AH; INC SI; LOOP.
      # A zero key leaves bytes unchanged, so this states the operation,
      # not that the retained program body is encrypted.
      pattern: "2E 8A 24 32 E6 2E 88 24 46 E2 F5"
