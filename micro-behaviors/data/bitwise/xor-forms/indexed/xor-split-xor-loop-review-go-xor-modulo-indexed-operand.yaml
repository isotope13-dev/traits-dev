# Source-level repeating-key XOR transforms.
#
# A repeating-key XOR loop is not malicious by itself: it is a useful primitive
# in protocols and file formats. Keep this capability notable and let loader
# composites add the payload, executable-memory, or cleanup context.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [c, cpp, csharp, go, rust, python, javascript, typescript, powershell]

traits:
  - id: go-xor-modulo-indexed-operand
    desc: Go XOR uses a modulo-indexed operand
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\^\s*\w+\[\s*\w+\s*%\s*len\('

