defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - pe
  - dll
traits:
- id: dotnet-named-key-byte-xor-loop
  desc: C# bytewise XOR with named key
  crit: notable
  conf: 0.92
  for:
  - csharp
  if:
    type: text
    regex: outBytes\[i\]\s*=\s*\(byte\)\s*\(data\[i\]\s*\^\s*_xorKey\)
