defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-xor-byte-key-loop
    desc: XORs bytes with a cycling key
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: lua
      query: |
        ((binary_expression
          left: (function_call
            name: (dot_index_expression table: (identifier) @lib field: (identifier) @byte))
          operator: "~"
          right: (bracket_index_expression
            table: (identifier) @key
            field: (binary_expression
              left: (binary_expression
                operator: "%"
                right: (unary_expression operator: "#" operand: (identifier) @length))
              operator: "+"
              right: (number) @one)))
          (#eq? @lib "string")
          (#eq? @byte "byte")
          (#eq? @key @length)
          (#eq? @one "1"))
