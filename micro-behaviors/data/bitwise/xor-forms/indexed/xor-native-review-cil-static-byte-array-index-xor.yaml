defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-static-byte-array-index-xor
    desc: CIL indexed byte-array XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # ldloc.0; ldsfld; ldloc.0; ldelem.u1; ldloc.0; xor;
      # ldc.i4; xor; conv.u1; stelem.i1. No external-call semantics assumed.
      pattern: '06 7E ?? ?? ?? 04 06 91 06 61 20 ?? ?? ?? ?? 61 D2 9C'
