defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: x64-alternating-key-byte-xor
    desc: XORs indexed bytes with alternating key bytes
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Select low/high key byte using index parity, then XOR input[index].
      pattern: '66 41 C1 E8 08 [0-16] 40 F6 C7 01 41 0F B6 C8 40 0F B6 C5 0F 44 C8 32 0C 3A'
