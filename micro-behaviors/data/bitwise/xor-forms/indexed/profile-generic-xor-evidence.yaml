defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  - id: csharp-indexed-char-xor-expression
    desc: C# indexed character conversion with XOR
    crit: notable
    conf: 0.93
    for: [csharp]
    if:
      type: text
      regex: 'Convert\.ToInt32\(\w+\[\w+\]\)\s*\^\s*[1-9]\d?'
