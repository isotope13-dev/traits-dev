defaults:
  crit: notable
  for: [powershell]
  platforms: [windows]

traits:
  - id: rotation-counter-modulo-update
    desc: PowerShell modulo assignment near XOR operator
    conf: 0.85
    if:
      type: text
      # Require the modulo-by-length operation that makes this a rotating
      # index. Plain PowerShell assignments such as tag-list concatenation are
      # ordinary collection logic and are not XOR evidence.
      regex: '(?i)\$\w+\s*=\s*\(\$\w+\s*\+\s*\$\w+\s*\)\s*%\s*\$\w+\.Length.{0,120}-bxor'

composite_rules:
  - id: rotation-counter-update
    desc: Nearby modulo and indexed XOR source patterns
    conf: 0.9
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::rotation-counter-modulo-update
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::rotation-indexed-key-modulo
    near_bytes: 512
