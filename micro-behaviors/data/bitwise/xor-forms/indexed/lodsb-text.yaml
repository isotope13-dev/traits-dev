defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: asm-xor-decryptor-pattern-1
    desc: Assembly LODSB XOR STOSB loop text
    crit: notable
    if:
      type: text
      regex: lodsb\s+(db\s+34h|xor\s+al,)\s+(.|\n)+?stosb\s+loop
  - id: asm-xor-decryptor-pattern-2
    desc: Assembly LODSB XOR loop with decryption label
    crit: notable
    if:
      type: text
      regex: octet_suivant_a_decrypter:\s+lodsb\s+db\s+34h\s+clef\s+db\s+0\s+stosb\s+loop

composite_rules:
  - id: asm-xor-byte-loop
    desc: Assembly byte XOR loop text
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::asm-xor-decryptor-pattern-1
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::asm-xor-decryptor-pattern-2
