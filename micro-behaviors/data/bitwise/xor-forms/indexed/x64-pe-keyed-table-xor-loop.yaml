defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: pe-x64-keyed-table-xor-loop
    desc: x64 PE repeating-key XOR loop, 32-byte key
    conf: 0.95
    if:
      type: hex
      section: .text
      # Index masked to 32 bytes (and edx,1Fh), key byte loaded from a table
      # addressed through r8, XORed into the buffer at a fixed displacement,
      # stored, counter incremented, loop closed by jnz. No key bytes or data
      # constants: the displacement and branch offset are wildcards.
      pattern: "48 89 C2 83 E2 1F 41 0F B6 14 10 32 54 03 ?? 88 14 07 48 83 C0 01 48 39 C8 75 ??"
