# Neutral instruction evidence; callers supply any concealment or infection claim.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-fixed-key-xor-loop
    desc: DOS in-place fixed-key byte XOR loop
    crit: notable
    conf: 0.92
    # The BX form is XOR [BX], key; INC BX; CMP BX, end; JB, a bounded loop
    # used by constant-key COM body decoders.
    if:
      type: hex
      pattern: "(8A 24 80 F4 ?? 88 24 46 E2|80 34 ?? 46 E2|80 37 ?? 43 81 FB ?? ?? 72)"

