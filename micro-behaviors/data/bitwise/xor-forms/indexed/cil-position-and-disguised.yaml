defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: cil-cyclic-xor-position-subtract
    desc: CIL cyclic XOR and position subtraction
    conf: 0.98
    if:
      type: hex
      section: .text
      # key[index & 3] XOR byte, minus index*stride, modulo 256.
      # Wildcard field tokens, the object local, and the stride. The
      # arithmetic is shared by instruction and operand decoding.
      pattern: '19 5F 91 61 (02|06|11 ??) 7B ?? ?? ?? 04 1F ?? 5A 20 FF 00 00 00 5F 59 20 FF 00 00 00 5F D2'

  - id: cil-disguised-cyclic-xor
    desc: CIL cyclic XOR through OR-minus-AND
    conf: 0.98
    if:
      type: hex
      section: .text
      # key[index & 31]; (value | key) - (value & key) == XOR.
      # Includes the byte read, indexed key, and write to the input array.
      pattern: '02 06 91 0C 03 06 1F 1F 5F 91 0D 02 06 08 09 60 08 09 5F 59 D2 9C'
