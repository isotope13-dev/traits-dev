defaults:
  for: [javascript]
  platforms: [windows, unix]
  crit: notable
# The generic identifier/operand query has no API-name prefilter. Bound
# this ancillary observation; the layered-loader objective does not require
# it and retains coverage for larger carriers and different XOR spellings.
traits:
  - id: javascript-return-arithmetic-xor
    desc: Returns XOR via addition, AND and subtraction
    conf: 0.98
    size_max: 65536
    if:
      type: tree-sitter
      query: |
        ((return_statement (binary_expression left: (binary_expression left: (identifier) @a operator: "+" right: (identifier) @b) operator: "-" right: (binary_expression left: (number) @two operator: "*" right: (parenthesized_expression (binary_expression left: (identifier) @x operator: "&" right: (identifier) @y))))) @xor
