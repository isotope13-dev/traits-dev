# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: js-xor-expression-array
  size_max: 65536
  desc: Numeric array contains repeated XOR expressions
  conf: 0.98
  # An array literal opening with six number^number elements. The array
  # must follow code punctuation, so a quoted "[1^2,...]" does not match.
  if:
    type: text
    regex: '[=(:,\s]\[(\s*\d\w*\s*\^\s*\d\w*\s*,){5}\s*\d\w*\s*\^\s*\d'
