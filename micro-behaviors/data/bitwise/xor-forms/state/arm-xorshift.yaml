defaults:
  platforms: [linux, android]
  for: [elf]
  arch: [arm]
  crit: notable
  conf: 0.95
traits:
  - id: arm-xorshift64-byte-stream
    desc: ARM xorshift stream XORs a byte buffer
    if:
      type: hex
      section: .text
      # 64-bit xorshift (13,7,17), byte load, XOR with the stream state,
      # byte store and backward conditional branch. No key or address pinned.
      pattern: "82 36 A0 E1 8C 16 2C E0 AC 39 83 E1 02 30 23 E0 A1 23 A0 E1 83 2C 82 E1 01 20 22 E0 01 E0 F0 E5 A3 33 23 E0 82 C8 22 E0 83 18 A0 E1 A2 17 81 E1 0C E0 2E E0 00 00 54 E1 03 20 21 E0 00 E0 C0 E5 ?? ?? ?? 1A"
