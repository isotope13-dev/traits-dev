defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-position-state-byte-xor
    desc: XORs buffer with evolving byte state
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Derive state from index*5 and prior state, fold a threshold,
      # add a second state byte, XOR the buffer, advance the index.
      # Constants and the conditional branch displacement may vary.
      pattern: '41 8D 4F ?? 8D 0C 99 03 CB 41 8D 42 ?? 0F B6 D1 81 FA ?? ?? ?? ?? 44 0F B6 D0 [0-20] 8D 4A ?? 0F 46 CA 44 8B F9 8D 41 ?? 41 02 C2 42 30 04 0B 48 FF C3'
