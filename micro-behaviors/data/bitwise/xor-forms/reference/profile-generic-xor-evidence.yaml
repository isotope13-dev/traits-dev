defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  - id: xor-decode-symbol
    desc: xor_decode symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: xor_decode
  - id: decode-xor-symbol
    desc: decode_xor symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: decode_xor
  - id: xor-decrypt-symbol
    desc: xor_decrypt symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: xor_decrypt
  - id: decrypt-xor-symbol
    desc: decrypt_xor symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: decrypt_xor
  # `xor_string` is a MySQL client-library helper (the mysys scramble path that
  # XORs a password against the handshake salt), not a string-obfuscation
  # decoder. The mysql-router exclusion below was the first product caught by
  # it; the symbol actually comes from the client library that mysql-router --
  # and every app bundling libmysqlclient, e.g. Sequel Ace -- links against.
  - id: xor-string-symbol
    desc: xor_string symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: xor_string

composite_rules:
  - id: xor-decode-name-reference
    desc: XOR decoding or decryption name reference
    crit: notable
    conf: 0.85
    any:
      - id: xor-decode-symbol
      - id: decode-xor-symbol
      - id: xor-decrypt-symbol
      - id: decrypt-xor-symbol
      - id: xor-string-symbol
  - id: xor-string-transform-clues
    desc: XOR string transform clues
    crit: notable
    conf: 0.8
    any:
      - id: xor-decode-name-reference
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::csharp-indexed-char-xor-expression
    unless:
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context

  # `csharp-secret-filter-xor-transform` lived here: it treated co-occurrence
  # of an env-secret filter and an uncalled XOR helper as an "obfuscated
  # harvest". Mere proximity cannot prove the transform touches the harvest,
  # so the pairing claim was unfounded; real loader chains are covered by the
  # pack/runtime composites that require a download or reflective-load leg.
