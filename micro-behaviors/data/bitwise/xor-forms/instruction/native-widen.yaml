defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
  size_max: 52428800
traits:
  - id: x64-xor-imm8-widen-loop
    desc: XOR byte then zero-extend
    crit: baseline
    conf: 0.85
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: 80 f? ?? 0F B6

  - id: simd-xor-punpcklbw
    desc: SIMD XOR with byte-to-word widening
    crit: baseline
    conf: 0.88
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: 0F 57 ?? 66 0F 60 ??

