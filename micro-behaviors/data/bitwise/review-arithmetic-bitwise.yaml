---
defaults:
  platforms:
  - linux
  - macos
  - windows
traits:
- for:
  - ruby
  crit: notable
  conf: 0.95
  id: ruby-xor-expression
  desc: Ruby bitwise XOR expression
  if:
    type: tree-sitter
    language: ruby
    query: '(binary operator: "^") @expression'
- for:
  - powershell
  platforms:
  - windows
  crit: notable
  id: powershell-xor-operator
  desc: PowerShell bitwise XOR operator syntax
  if:
    type: text
    regex: "(?i)\\s-bxor\\s"
- for:
  - python
  crit: notable
  id: python-xor-expression
  desc: Python bitwise XOR expression
  unless:
  - type: text
    regex: "(?m)\\^\\s*(\\.\\.\\.|all)\\b"
  - type: text
    regex: "(?m)\\^=\\s*slice\\s*\\("
  - type: text
    regex: "(?m)\\^=\\s*[\\[\\(]"
  if:
    type: tree-sitter
    language: python
    query: |
      [
        ((_ (binary_operator operator: "^") @expression) @parent
          (#not-match? @expression "\\^\\^")
          (#not-match? @expression "^[0-9]+\\s*\\^\\s*[0-9]+\\s+to\\s+[0-9]")
          (#not-match? @parent "^[0-9]+\\s*\\^\\s*[0-9]+\\s+to\\s+[0-9]"))
        ((call function: (attribute
            object: (identifier) @module
            attribute: (identifier) @method)
          arguments: (argument_list . (_) . (_) .)) @call
          (#eq? @module "operator")
          (#eq? @method "xor"))
      ]
- id: lua-low-bit-mask-expression
  desc: Lua low-bit masking expression
  for:
  - lua
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    language: lua
    query: |
      [
        ((binary_expression left: (_) "&" right: (number) @one) @mask
          (#eq? @one "1"))
        ((function_call
          name: (dot_index_expression table: (identifier) @module
            field: (identifier) @method)
          arguments: (arguments (_) (number) @one)) @mask
          (#eq? @module "bit") (#eq? @method "band") (#eq? @one "1"))
      ]
- for:
  - c
  - cpp
  - python
  - go
  - rust
  - powershell
  crit: notable
  conf: 0.9
  id: clear-low-bit-then-shift
  desc: Clears a low bit, then shifts right
  if:
    type: text
    regex: "(?s)(&=\\s*0xFE\\b|&\\s*0xFE\\b).{0,220}>>=?\\s*1\\b"
composite_rules:
- id: source-low-bit-mask
  desc: Source contains low-bit mask syntax
  crit: notable
  conf: 0.95
  for:
  - scripts
  - source
  - class
  any:
  - id: metadata/lang/source/syntax/operator::low-bit-mask-expression-text
  - id: micro-behaviors/data/bitwise::lua-low-bit-mask-expression
- id: source-xor-operation
  desc: Source contains parsed or named XOR operations
  crit: notable
  for:
  - scripts
  - source
  - class
  any:
  - id: micro-behaviors/data/bitwise::ruby-xor-expression
  - id: micro-behaviors/data/bitwise::powershell-xor-operator
  - id: micro-behaviors/data/bitwise::python-xor-expression
  - id: micro-behaviors/data/bitwise::parsed-caret-xor-expression
  - id: micro-behaviors/data/bitwise::swift-bitwise-xor-expression
  - id: micro-behaviors/data/bitwise::xor-named-helper-call
  - id: micro-behaviors/data/bitwise::vbs-variable-xor
  - id: micro-behaviors/data/bitwise::compound-xor-assignment
