# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
traits:
- id: repeated-hex-left-xor-expressions
  desc: Repeated hexadecimal-left XOR expressions
  conf: 0.85
  for:
  - javascript
  - typescript
  count_min: 4
  if:
    type: tree-sitter
    kind: binary_op
    regex: "[^<>]0x[0-9a-fA-F]{2}\\s*\\^"
  unless:
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
