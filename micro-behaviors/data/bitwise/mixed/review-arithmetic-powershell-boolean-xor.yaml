# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: powershell-and-not-or-terms
  desc: PowerShell AND/NOT terms joined with OR
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?i)-band\\s+-bnot[^;]{1,40}-bor\\s*\\(-bnot[^;]{1,40}-band"
