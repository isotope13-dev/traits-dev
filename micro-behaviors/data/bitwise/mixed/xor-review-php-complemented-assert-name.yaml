# PHP before 8 treats an undefined bareword as a string. NOT restores
# the ASCII function name; quoted variants work without that legacy feature.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-complemented-assert-name
    desc: PHP complements bytes spelling assert
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: '7E [0-4] (BE|9E) (AC|8C) (AC|8C) (BA|9A) (AD|8D) (AB|8B) (3B|27|22)'
