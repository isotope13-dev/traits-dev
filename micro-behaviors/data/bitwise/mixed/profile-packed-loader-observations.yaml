defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: x64-xor-decrement-dword-loop
    desc: x64 XOR and decrement dword loop
    crit: notable
    conf: 0.9
    arch: [x86-64]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: "41 8b 03 35 ?? ?? ?? ?? ff c8"
  - id: x86-xor-decrement-dword-loop
    desc: x86 XOR and decrement dword loop
    crit: notable
    conf: 0.9
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "81 F2 ?? ?? ?? ?? [0-6] 4A [0-4] 89 17 [0-6] 83 E9 04 83 C7 04 83 C3 04"
