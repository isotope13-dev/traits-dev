defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
  size_max: 52428800
traits:
  - id: x86-rol-ror-xor-byte-mixer
    desc: x86 ROL/ROR/XOR byte mixer sequence
    crit: notable
    conf: 0.94
    arch: [x86]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      # ROL r/m8,imm8 then XOR, NOT, ROR r/m8,imm8 — common in hand-rolled
      # shellcode transform loops that are not a plain indexed XOR.
      pattern: 'C0 C? 03 32 ?? FE C? 80 F? ?? F6 D? 32 ?? C0 C? 03'

