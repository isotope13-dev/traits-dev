defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  arch:
  - x86
traits:
- id: x86-byte-complement-512
  desc: x86 loop complements a 512-byte buffer
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: any
    pattern: (33 C0 8A 4C 04 08 F6 D1 88 4C 04 08 40 3D 00 02 00 00 72 EE | 33 C0 8A 4C 04 08 F6 D1 88
      4C 04 08 83 C0 01 3D 00 02 00 00 72 EC | BE 00 02 00 00 [16-80] 33 C0 F6 94 05 ?? ?? ?? ?? 40 3B
      C6 72 F4 | 8A 8C 05 ?? ?? ?? ?? F6 D1 88 8C 05 ?? ?? ?? ?? 40 3D 00 02 00 00 72 E8)
- id: x86-signed-byte-complement-loop
  desc: x86 loop complements signed-byte stream
  crit: notable
  conf: 0.96
  if:
    type: hex
    section: .text
    pattern: '0F BE ?? 81 (F0|F1|F2|F3|F5|F6|F7) FF 00 00 00'
