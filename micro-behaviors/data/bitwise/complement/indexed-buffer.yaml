defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-indexed-buffer-complement-loop
    desc: Complements bytes in an indexed buffer
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # NOT byte [ebp+eax+displacement]; increment index; compare to ESI;
      # repeat. Neither the buffer displacement nor its size is fixed.
      pattern: '33 C0 F6 94 05 ?? ?? ?? ?? 40 3B C6 72 F4'
