---
defaults: {}
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-xor-byte-loop
  desc: Python loop assigns indexed XOR expressions
  crit: notable
  conf: 0.8
  if:
    type: tree-sitter
    query: |
      (for_statement
        body: (block
          (_
            (assignment
              left: (subscript)
              right: (binary_operator) @bin
            )
          )
        )
        (#match? @bin "\\^")
      )
