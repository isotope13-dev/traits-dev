defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-session-save-handler-registration
    desc: Registers PHP session storage handler
    if:
      type: symbol
      kind: call
      exact: session_set_save_handler
