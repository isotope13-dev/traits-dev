defaults:
  crit: notable
  platforms: [windows, unix]
  for: [pe, dll]

traits:
  - id: fnv1a-offset-basis
    desc: FNV1a hash offset basis constant
    conf: 0.8
    if:
      type: hex
      section: .text
      pattern: C5 9D 1C 81
    unless:
      - id: metadata/binary/framework/
  - id: fnv1a-prime-32bit-literal
    desc: FNV-1a 32-bit prime constant (0x01000193)
    conf: 0.7
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: 93 01 00 01
    unless:
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: fnv1a-prime-64bit-literal
    desc: FNV-1a 64-bit prime constant (0x100000001B3)
    conf: 0.85
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: B3 01 00 00 00 01 00 00
    unless:
      - id: metadata/lang/compiler/systems/
      - id: metadata/binary/framework/
  - id: fnv1a-prime-64bit-movabs
    desc: FNV-1a 64-bit prime loaded via movabs (x64)
    conf: 0.92
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: (48|49) (B8|B9|BA|BB|BC|BD|BE|BF) B3 01 00 00 00 01 00 00
    unless:
      - id: metadata/lang/compiler/systems/
      - id: metadata/binary/framework/
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
  - id: fnv1a-byte-hash-loop-x64
    desc: x64 FNV-1a byte-string hash loop
    crit: notable
    conf: 0.96
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # XOR a byte into the running value, then multiply by the 64-bit FNV-1a
      # prime. The stack slot and register fields vary across compiler output.
      pattern: '0F B6 ?? 48 8B 4C 24 ?? 48 33 C? 48 8B C? 48 B? B3 01 00 00 00 01 00 00 48 0F AF C?'
  - id: custom-fnv-seed-53ff68-x86
    desc: Custom FNV seed 53ff68
    conf: 0.94
    for: [pe]
    arch: [x86]
    if:
      type: hex
      section: text
      pattern: BE 68 FF 53 00

  - id: go-fnv-package-import
    desc: Go FNV hash package import
    conf: 0.9
    for: [go]
    if:
      type: import
      exact: hash/fnv

  - id: go-fnv1a-constructor
    desc: Go FNV-1a hash constructor
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      exact: fnv.New32a
