defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-multiply-xorshift-byte-hash
    desc: Multiplies and folds byte-hash accumulator
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # The per-build multiplier mask is deliberately not an identifier.
      pattern: '41 0F B6 0C 19 81 F2 [4] 41 33 C8 45 8D 49 01 0F AF D1 44 8B C2 41 C1 E8 10 44 33 C2 41 80 3C 19 00 75 ??'
