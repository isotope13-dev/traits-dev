defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: binary-task-header-checksum-x86
    desc: Validates three-word header checksum
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8B 4C 24 04 8B 11 8B 41 08 D1 EA 8D 04 42 03 41 04 2B 41 0C F7 D8 1B C0 40 C3'
