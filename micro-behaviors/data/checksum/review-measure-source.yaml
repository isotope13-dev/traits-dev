# String measurement and checksum review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - windows
  for:
  - c
  - cpp
traits:
- id: djb2-hash-call-source
  desc: Calls a DJB2 string-hash helper
  conf: 0.94
  for:
  - c
  - cpp
  - csharp
  - go
  - rust
  if:
    type: symbol
    kind: call
    regex: "(?i)^djb2_?hash$"
