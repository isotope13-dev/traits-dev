defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.94

composite_rules:
  - id: opaque-pe-fnv-prime-reference
    desc: Opaque-named PE references FNV-1a prime
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/checksum::fnv1a-prime-32bit-literal
    unless:
      - id: metadata/signed/platform/

