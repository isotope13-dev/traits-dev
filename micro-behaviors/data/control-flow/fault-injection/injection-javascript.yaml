defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: weighted-network-error-type-picker
  desc: Weighted timeout-error configuration reference
  conf: 0.91
  if:
    type: text
    regex: errorTypes.{0,120}weight.{0,80}Timeout
- id: encoded-fault-config-url
  desc: Encoded fault-configuration identifier
  conf: 0.93
  if:
    type: encoded
    substr: fault-config
- id: fault-injector-config-update
  desc: Fault-injector updateConfig reference
  conf: 0.92
  if:
    type: text
    regex: faultInjector.{0,40}updateConfig
composite_rules:
- id: remote-fault-config-fetch
  desc: HTTP GET alongside encoded fault configuration
  crit: notable
  conf: 0.94
  near_bytes: 4096
  all:
  - id: encoded-fault-config-url
  - id: micro-behaviors/data/control-flow/fault-injection::fault-injector-module
  any:
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/communications/http/get::axios-require-get-call
