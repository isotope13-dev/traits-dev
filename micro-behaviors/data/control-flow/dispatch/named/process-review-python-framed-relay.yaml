defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-indexed-stream-write
    desc: Writes data to an indexed stream
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (subscript)
            attribute: (identifier) @method)
          arguments: (argument_list (identifier))) @write
          (#eq? @method "write"))

