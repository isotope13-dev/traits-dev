defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Streams, files and network clients all emit open events.
  - id: js-open-event-listener
    desc: Registers a JavaScript open event listener
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.(on|once)$'
      arg:
        index: 0
        kind: string
        exact: open

  # The async keyword is optional: jQuery and EventEmitter also dispatch
  # synchronous function callbacks. Preserve both forms without implying async.
  - id: js-named-function-event-handler
    desc: Registers named event with function callback
    conf: 0.85
    for: [javascript, typescript, text]
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\.on\s*\(\s*["''][\w-]{1,32}["'']\s*,\s*(async\s+)?function'

  # EventEmitter is an in-process dispatch surface by itself. A socket or other
  # transport must be established separately before an objective may describe
  # the emitted object as network exfiltration.
  - id: js-named-event-value-emission
    desc: Emits a value through named JavaScript event
    conf: 0.82
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\.emit\s*\(\s*[''"][\w-]{1,32}[''"]\s*,\s*[A-Za-z_$][\w$]{0,24}\s*\)'

  # A switch on a command-like object field is a control-flow observation.
  # Remote tasking intent requires communication and process-execution context
  # in a separate composite.
  - id: object-field-dispatch-switch
    desc: Switch dispatches on a command-like object field
    conf: 0.93
    if:
      type: text
      regex: '\bswitch\s*\(\s*[A-Za-z_$][\w$]*\s*\.\s*(command|action|task)\s*\)'

  - id: type-selector-dispatch-switch
    desc: Switch dispatches on a type selector
    crit: baseline
    conf: 0.93
    if:
      type: text
      regex: '\bswitch\s*\(\s*([A-Za-z_$][\w$]*\s*\.\s*)?type\s*\)'

  # `new Proxy(obj, { get(target, prop) { ... } })` — an interception layer over
  # every property read on an object. Ordinary metaprogramming (observable
  # stores, mock frameworks, lazy-require helpers all use it), so this is the
  # capability and nothing more; the composites decide what is being intercepted
  # and on whose behalf.
  - id: js-function-derived-computed-call
    desc: Calls computed member from function result
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (subscript_expression
            index: (call_expression))) @call
    unless:
    - id: metadata/lang/source/declaration::pony-method-declaration-syntax
