traits:
- for:
  - html
  - asp
  - vbs
  - makefile
  conf: 0.98
  id: script-run-method-text
  desc: Script calls a Run method
  if:
    type: text
    # `[,;(]` covers the VBScript statement form too — `.Run arg, 0, x` passes
    # its arguments without parentheses (With-block shell calls).
    # Preceded by non-digit to avoid numbered list items like `6.Run configure`.
    # Case-sensitive by design: shell hosts expose `.Run` (WScript.Shell,
    # classic-ASP server objects), while lowercase `.run(` is an ordinary
    # pipeline helper in carousel and UI libraries.
    regex: '(\.Run|\[\s*["'']Run["'']\s*\])\s*\(|(^|[^0-9])\.Run\s+[A-Za-z]\w{3,}\s*[,;(]'
  unless:
    - id: metadata/lang/scripted::dts-declaration-file
- crit: notable
  for:
  - html
  - asp
  - vbs
  conf: 0.92
  id: run-zero-style-text
  desc: Run syntax with zero second argument
  if:
    type: text
    # Positive command/identifier characters support long encoded arguments
    # without crossing a semicolon into an unrelated call.
    regex: (?i)\.Run\s*[(\s][\w .+/'"=:$()&\\-]+,\s*(0|&H0)\b
- id: javascript-run-method-call
  desc: JavaScript calls a Run method
  for: [javascript]
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: '\.Run$'
- id: javascript-run-zero-second-argument
  desc: JavaScript Run call passes zero second argument
  for: [javascript]
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: '(?i)\.Run$'
    arg:
      index: 1
      kind: number
      value: 0
composite_rules:
- id: script-run-method-call
  desc: Script calls a Run method
  for: [html, asp, vbs, javascript, makefile]
  crit: notable
  conf: 0.98
  any:
    - id: script-run-method-text
    - id: javascript-run-method-call
- id: run-zero-style-argument
  desc: Run call passes zero second argument
  for: [html, asp, vbs, javascript]
  crit: notable
  conf: 0.98
  any:
    - id: run-zero-style-text
    - id: javascript-run-zero-second-argument
defaults:
  crit: notable
  platforms:
  - windows
