defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: javascript-run-split-command-zero-style
    desc: Run passes split-join command and zero style
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: [(subscript_expression index: (string (string_fragment) @run))
                     (member_expression property: (property_identifier) @run)]
          arguments: (arguments . (binary_expression) @command . (number) @zero)) @evidence
          (#eq? @run "Run")
          (#match? @zero "^(0[xX])?0+$")
          (#match? @command "\\[['\"]split['\"]\\]")
          (#match? @command "\\[['\"]join['\"]\\]"))
