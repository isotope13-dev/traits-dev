# A method named write does not identify its receiver or destination:
# file handles, stdout, BytesIO and arbitrary application objects share it.
# Preserve the call observation without claiming process or filesystem I/O.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
traits:
  - id: python-write-method-call
    desc: Python write method call
    conf: 0.5
    if:
      type: symbol
      kind: call
      regex: '\.write(_bytes|_text)?$'
composite_rules:
  - id: python-write-call-observation
    desc: Python write-family call observation
    conf: 0.78
    any:
      - id: micro-behaviors/fs/write/file/handle::py-file-write-call
      - id: micro-behaviors/process/io/stream::python-named-stream-write
      - id: micro-behaviors/fs/write/file/handle::py-log-write-call
      - id: python-write-method-call
