defaults:
  platforms:
  - unix
  - windows
  for: [javascript]
  attack: T1059
  crit: notable
traits:
- id: js-execasync-call
  desc: Calls an execAsync-named function
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: execAsync
- id: shell-embedded-node-exec-call
  desc: Calls an .exec() method in embedded text
  conf: 0.95
  mbc: C0017
  for: [shell]
  if:
    type: text
    regex: '\.exec\s*\('
