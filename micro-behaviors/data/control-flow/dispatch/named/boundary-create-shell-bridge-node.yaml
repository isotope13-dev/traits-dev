defaults:
  platforms:
  - unix
  - windows
  for: [javascript]
  crit: notable
traits:
- id: js-execasync-call
  desc: Calls an execAsync-named function
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: execAsync
- id: shell-embedded-exec-method-reference
  desc: Embedded text references an .exec() method
  conf: 0.95
  for: [shell]
  if:
    type: text
    regex: '\.exec\s*\('
