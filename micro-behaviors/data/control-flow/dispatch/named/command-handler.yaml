defaults:
  platforms:
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.7
traits:
- id: process-command-handler-call
  desc: Calls a processCommand handler
  if:
    type: symbol
    kind: call
    regex: (^|\.)processCommand$
composite_rules:
- id: command-member-or-handler-reference
  desc: Command member or handler call reference
  any:
  - id: micro-behaviors/data/property/access::response-commands-member
  - id: process-command-handler-call
