# A literal exec/spawn argument in node -e is also ordinary automation or a
# RegExp method. The spelling alone establishes neither concealment nor a
# child-process receiver. Preserve the observation in neutral dispatch.
defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  conf: 0.85
traits:
  - id: node-inline-exec-spawn-call-text
    desc: Node inline text references exec/spawn calls
    crit: notable
    if:
      type: text
      regex: '\b(node|nodejs)\s+-e\s+.{0,140}(exec|spawn)(Sync)?\s*\(\s*[`"''\[]'

    not:
      - regex: '(?i)(node:sqlite|DatabaseSync|sqlite3)'
      - regex: '(?i)\.exec\s*\(\s*["'']\s*(create|select|insert|update|delete|pragma)\b'

    unless:
      - type: text
        substr: npm root -g
      - type: text
        regex: '\bprocess\.argv\[[1-9]\]'
      - id: metadata/build/ci/github-actions::workflow-definition-path

