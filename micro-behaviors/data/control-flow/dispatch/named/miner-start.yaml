defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  # A receiver name alone does not establish a mining implementation or
  # resource hijacking. Mining composites supply the API context separately.
  - id: miner-or-client-start-call
    desc: Calls start on miner or _client receiver
    if:
      type: text
      regex: '(miner|Miner)\.start\s*\(|_client\.start\s*\(\s*\)'
      exclude_html_comments: true
