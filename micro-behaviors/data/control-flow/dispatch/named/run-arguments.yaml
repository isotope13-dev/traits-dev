defaults:
  platforms:
  - windows
  crit: notable
traits:
- id: run-zero-boolean-text
  for: [vbs, html, batch]
  desc: Run call with zero and Boolean arguments
  conf: 0.94
  if:
    type: text
    regex: (?is)\.\s*Run[\s(]+[^;\r\n]{1,512},\s*0\s*,\s*(false|true)\b
- id: js-run-zero-boolean-arguments
  desc: Run call passes zero and Boolean arguments
  for: [javascript]
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: '(?i)\.Run$'
    args:
      - index: 1
        kind: number
        value: 0
      - index: 2
        kind: bool
- for:
  - javascript
  - vbs
  id: indexed-call-zero-boolean-arguments
  desc: Indexed call with zero and Boolean arguments
  conf: 0.9
  if:
    type: text
    regex: \[[^\r\n\]]{1,900}\]\s*\([^;\r\n]{1,256},\s*0\s*,\s*(false|true)\s*\)
- for:
  - javascript
  - vbs
  - html
  id: run-zero-number-argument
  desc: Run method call with a zero argument
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (?i)\.Run$
    arg:
      kind: number
      value: 0
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
composite_rules:
- id: run-zero-boolean-arguments
  desc: Run call with zero and Boolean arguments
  for: [javascript, vbs, html, batch]
  conf: 0.98
  any:
    - id: js-run-zero-boolean-arguments
    - id: run-zero-boolean-text
