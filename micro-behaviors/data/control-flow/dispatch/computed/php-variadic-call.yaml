defaults:
  platforms: [unix, windows]
  for: [php, text]
traits:
  - id: php-variadic-variable-function-call
    desc: PHP variable call unpacks arguments
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\$\w+\s*\(\s*\.\.\.\$\w+\s*\)'
    unless:
      - id: well-known/lib/network/guzzle
      - type: text
        regex: '(callable\s+\$\w+|Closure\s+\$\w+|\$\w+\s*instanceof\s+callable)'
