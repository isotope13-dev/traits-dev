# Generic call/access syntax does not establish decoding, overwrite or shell execution.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: computed-call-two-argument
  desc: Computed method call with argument two
  conf: 0.85
  if:
    type: text
    regex: \[\w+\(["'][^"']{2,40}["']\)\]\(\w+,\s*2\)
- id: computed-call-false-argument
  desc: Computed method call with false argument
  conf: 0.85
  if:
    type: text
    regex: \[\w+\(["'][^"']{2,40}["']\)\]\([^;\n]{0,100},\s*false\)
- id: awaited-function-selected-method-call
  desc: Awaited call with function-selected method
  conf: 0.97
  if:
    type: text
    regex: await\s+\w+\[\w+\([^)]{1,40}\)\]\(\w+\([^)]{1,40}\)\)
  not:
  - regex: _0x[a-fA-F0-9]{3,}\(
  - regex: await\s+\w+\[\w+\(0x[a-fA-F0-9]+\)\]\(\w+\(0x[a-fA-F0-9]+\)\)
  unless:
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
  - id: well-known/lib/development/vscode-webview::webview-bundle-basename
  - id: metadata/package/files/dependency::vsix-bundled-output-path
- id: nested-function-selected-constructor
  desc: Constructor selected by nested function calls
  conf: 0.99
  if:
    type: text
    regex: new\(\w+\(\w+\([^)]{1,40}\)\)\)\(\w+\([^)]{1,40}\),\w+\[\w+\(
