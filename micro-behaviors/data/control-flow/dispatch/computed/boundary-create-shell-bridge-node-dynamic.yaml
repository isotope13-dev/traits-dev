defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
- id: node-decoded-bracket-sync-shell-output
  desc: Computed call followed by string conversion
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\w+\[[^\]]{1,48}\]\(.{0,24}\(.{0,16}\).{0,16}\)\.toString\(\)\.trim\('
