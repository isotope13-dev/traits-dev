defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
- id: js-dynamic-method-call
  size_max: 262144
  desc: Calls a method via computed bracket access
  crit: baseline
  conf: 0.7
  count_min: 8
  unless:
  - type: basename
    exact: CHANGES
  if:
    type: tree-sitter
    language: javascript
    query: |-
      (call_expression
        function: (subscript_expression
          index: (identifier)
        ) @computed
      )
