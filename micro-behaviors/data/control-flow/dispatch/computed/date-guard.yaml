defaults:
  platforms: [windows, unix]
traits:
- id: js-date-gated-process-method-call
  desc: Date guard calls a computed process method
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: 'new Date\([_$\w]+\(0x\w+\)\)<[_$\w]+&&process\[[_$\w]+\(0x\w+\)\]\('
