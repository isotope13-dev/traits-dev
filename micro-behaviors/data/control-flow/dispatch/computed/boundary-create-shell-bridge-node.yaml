defaults:
  platforms:
  - unix
  - windows
  for: [javascript]
  attack: T1059
  mbc: C0017
  crit: notable
  conf: 0.9
traits:
- id: child-process-computed-member-call
  desc: Calls child_process through a computed member
  if:
    type: text
    regex: 'child_process_\d+\s*\[[^\]\n]{1,120}\]\s*\)\s*\('
  # Obfuscators (jsjiami, obfuscator.io control-flow flattening) route calls
  # through a dispatcher table: `table[decoder(idx)](execSync, concealedArg)`.
  # The symbol projection records no `execSync` call because execSync arrives
  # as the first argument, so the direct-call atom stays silent while the
  # synchronous shell executions hide behind the computed member.
  # Passing the execSync function itself as an argument to a computed call
  # has no benign precedent; ordinary code calls it directly.
- id: execsync-computed-dispatch-call
  desc: execSync invoked through computed dispatch
  attack: T1059.007
  for: [javascript, typescript]
  if:
    type: text
    regex: '\]\s*\(\s*execSync\s*,'
- id: child-process-compiled-computed-call
  desc: Compiled child_process computed-member call
  if:
    type: text
    regex: 'child_process_\d+\s*\[.{1,120}\]\s*\)\s*\('
