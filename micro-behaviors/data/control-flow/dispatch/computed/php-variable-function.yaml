defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
traits:
  - id: php-variable-function-call
    desc: PHP invokes a variable-named function
    if:
      type: tree-sitter
      # The #not-match predicate skips common framework callable variable names.
      query: |
        (function_call_expression
          function: (variable_name (name) @var)
          (#not-match? @var "^(handler|handlers|errorHandler|exceptionHandler|logger|callback|closure|next|middleware|listener|fn|func|callable|cb|cb[A-Z][A-Za-z0-9_]*|resolver|factory|visitor|walker|childMapper|mapper|mutator|canonicalize|decodeT|append|pass|fail|warn|check|checkNode|extractText|shouldStop|stripPunct|stripCoordPunct|securitySource|on[A-Z][A-Za-z0-9_]*|[A-Za-z0-9_]*(Callback|Handler|Closure|Autoloader|Override))$"))
    unless:
      # `$var()` inside a framework's own request dispatcher is plumbing.
      - id: metadata/import/framework::php-framework-source-context
      - type: text
        regex: "\\bClosure\\s+\\$next\\b"
      - type: text
        regex: 'namespace\s+Composer\\Autoload;[\s\S]{0,1200}class\s+ClassLoader'
      - id: metadata/package/manager::composer-generated-autoload
  - id: integer-indexed-func-dispatch
    desc: Dispatches function from integer-indexed array
    conf: 0.87
    count_min: 7
    per_kb_min: 0.4
    if:
      type: text
      regex: '\$\w+\[\s*[0-9]+\s*\]\s*\('
  - id: php-computed-expression-call
    desc: PHP invokes computed callable expression
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: [(parenthesized_expression) (subscript_expression)]) @call
