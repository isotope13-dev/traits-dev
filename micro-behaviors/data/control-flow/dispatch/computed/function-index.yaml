defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-function-derived-computed-call
    desc: Calls member selected by a function result
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (subscript_expression
            index: (call_expression))) @call
    unless:
    - id: metadata/lang/source/declaration::pony-method-declaration-syntax
