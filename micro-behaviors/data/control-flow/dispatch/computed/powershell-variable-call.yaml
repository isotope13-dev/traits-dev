defaults:
  platforms: [windows, unix]
  # vbs: PowerShell staged inside VBScript string literals.
  for: [powershell, batch, vbs, javascript]
  crit: notable
traits:
  - id: powershell-variable-call-operator
    desc: PowerShell dynamically invokes a variable
    conf: 0.9
    if:
      type: text
      regex: '(?m)((^|[;\r\n])\s*&\s*`?\$[A-Za-z_]\w*\b|[&.]\s*\(\s*\$\w+\s*\)\s*\(?\$\w+)'

  - id: powershell-repeated-variable-call-operator
    desc: Repeated dynamic PowerShell variable calls
    conf: 0.94
    for: [powershell]
    count_min: 5
    if:
      type: text
      regex: '(?m)[&.]\s*\(\s*\$\w+\s*\)\s*\(?\$\w+'
