defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  id: js-new-this-bracket
  size_max: 262144
  desc: Constructs object through this bracket property
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    language: javascript
    query: |
      (new_expression
        constructor: (subscript_expression
          object: (this))) @construction
- for:
  - javascript
  - typescript
  id: js-subscript-callee
  size_max: 262144
  desc: Calls a property using bracket notation
  crit: notable
  conf: 0.82
  unless: &computed-call-exclusions
  # The JavaScript parser misreads Dart casts and generic type arguments.
  - id: metadata/file/extension/identity::dart-source-basename
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
  if:
    # Require an actual computed callee. Byte matching also accepts Markdown
    # links in comments, e.g. "the [Normal](https://...) distribution".
    # Subscripts retain nested indexes such as value[names[2]](argument).
    type: tree-sitter
    query: |
      (call_expression function: (subscript_expression)) @call
- for: [html]
  id: html-computed-property-call-text
  desc: Computed-call syntax in HTML script context
  crit: notable
  conf: 0.82
  unless: *computed-call-exclusions
  if:
    # HTML exposes neither JavaScript call facts nor a queryable script AST.
    # The old whole-document regex mistook help prose such as
    # "specified as [frame frequency] (e.g. 25)" for a computed call.
    # Keep the lexical observation, but require a script body, event handler,
    # or javascript: attribute. This does not prove invocation or data flow.
    type: yara
    source: |
      rule html_computed_call_script_context {
        strings:
          $call = /\b[A-Za-z_$][\w.$]*(\s*\[([^\[\]\n]|\[[^\]\n]{1,80}\])+\]){1,3}\s*\(/
          $open = /<script([ \t\r\n][^>]{0,2048})?>/ nocase
          $close = /<\/script[ \t\r\n]*>/ nocase
          $inert = /<script[^>]{0,2048}type\s*=\s*["']application\/(ld\+)?json/ nocase
          $event_double = /\son[a-z]+\s*=\s*"[^"]{0,4096}"/ nocase
          $event_single = /\son[a-z]+\s*=\s*'[^']{0,4096}'/ nocase
          $url_double = /\s(href|src)\s*=\s*"javascript:[^"]{0,4096}"/ nocase
          $url_single = /\s(href|src)\s*=\s*'javascript:[^']{0,4096}'/ nocase
          $comment_open = "<!--"
          $comment_close = "-->"
        condition:
          $call and (
            for any c in (1..#call) : (
              for any o in (1..#open) : (
                @call[c] >= @open[o]+!open[o] and
                not $close in (@open[o]..@call[c]) and
                not $inert at @open[o] and
                not for any b in (1..#comment_open) : (
                  @comment_open[b] < @open[o] and
                  not $comment_close in (@comment_open[b]..@open[o])
                )
              )
            ) or
            for any of ($event_*, $url_*) : (
              for any i in (1..#) : (
                $call in (@[i]..@[i]+![i]-1) and
                not for any b in (1..#comment_open) : (
                  @comment_open[b] < @[i] and
                  not $comment_close in (@comment_open[b]..@[i])
                )
              )
            )
          )
      }
- for:
  - javascript
  id: js-numeric-indexed-computed-call
  desc: Calls a numeric-indexed computed property
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]{0,120}\[\s*[A-Za-z_$][A-Za-z0-9_$]*\(\s*\d+\s*\)\s*\]\s*\(
- for:
  - javascript
  - typescript
  id: js-computed-call-cluster
  size_max: 262144
  desc: Repeated computed-property calls (3+)
  crit: notable
  conf: 0.86
  count_min: 3
  # Non-code text can recover as call nodes when identified as JavaScript.
  unless:
  - id: metadata/file/extension/identity::dart-source-basename
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
  if:
    type: tree-sitter
    query: |
      (call_expression function: (subscript_expression)) @call
- for:
  - javascript
  - typescript
  id: js-computed-constructor
  desc: Constructs an object through a computed property
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \bnew\s+\w+\s*\[[^\]\n]{1,180}\]\s*\(\s*\)
- for:
  - javascript
  id: globalthis-computed-property-call
  desc: Calls a computed globalThis property
  crit: notable
  conf: 0.88
  if:
    # Require the subscript itself to be the callee. A byte regex can cross
    # subsequent property accesses or unrelated expressions in a bundle.
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (subscript_expression
          object: [
            (identifier) @global
            (parenthesized_expression (identifier) @global)
          ])
        (#eq? @global "globalThis")) @call
- for:
  - javascript
  id: js-computed-date-method-call
  desc: Calls a Date method through bracket notation
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: Date\s*\[[^\]]{1,80}\]\s*\(
- for:
  - javascript
  - html
  id: js-addition-indexed-member-call
  desc: Calls member indexed by addition
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b\w+\[(\w+|[''"][a-zA-Z0-9]+[''"])(\s*\+\s*(\w+|[''"][a-zA-Z0-9]+[''"])){1,5}\]\s*\('

- for:
  - javascript
  - html
  id: js-computed-zero-false-call
  desc: Computed call with zero and false arguments
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '\w+\[\w+\([^)]{1,48}\)\]\s*\(\w+\s*,\s*0(x0)?\s*,\s*(false|!\[\])\s*\)'

- for:
  - javascript
  id: js-indexed-zero-false-call
  desc: Indexed call with zero and false arguments
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \b\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*,\s*0\s*,\s*false\s*\)
- for:
  - javascript
  id: js-computed-call-false-third-argument
  desc: Computed call has false third argument
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*,\s*\w+\s*,\s*false\s*\)
- for:
  - javascript
  id: js-function-indexed-false-flag-call
  desc: Function-indexed call with false argument
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \b\w+\[\w+\(["'][^"']{1,40}["']\)\]\s*\(\s*\w+\([^)]{1,80}\)\s*,\s*\w+\s*,\s*false\s*\)
- for:
  - javascript
  - typescript
  - html
  id: window-double-bracket-call
  desc: Window double-bracket member call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: window\s*\[[^\]]{1,120}\]\s*\[[^\]]{1,120}\]\s*\(
- for:
  - javascript
  id: computed-member-call-zero-arg
  desc: Computed member call with trailing zero
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '[A-Za-z_$][\w$]*\s*\[[^\]\n]{1,60}\]\([^()\n;]{1,80},\s*0\s*\)'
- for:
  - javascript
  id: js-nested-this-subscript-call
  desc: Computed this call with this-subscript argument
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: this\[[^\]\n]{8,80}\]\(this\[

composite_rules:
- id: js-computed-property-call
  desc: Calls a property using bracket notation
  crit: notable
  conf: 0.82
  for: [javascript, typescript, html]
  unless: *computed-call-exclusions
  any:
  - id: js-subscript-callee
  - id: html-computed-property-call-text
