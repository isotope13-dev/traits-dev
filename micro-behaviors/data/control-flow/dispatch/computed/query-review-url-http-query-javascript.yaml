defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: query-object-computed-callback-call
    desc: Calls computed query-object member with callback
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams\s*\([\s\S]{0,500}\)\s*\[[^\]]{1,100}\]\s*\(\s*function'
  - id: computed-target-url-params-call
    desc: Computed targetUrl property ending ms invoked
    crit: notable
    conf: 0.88
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'targetUrl\s*\[[^\]]{1,80}\+\s*["'']ms["'']\]\s*\[[^\]]{1,80}\]\s*\('
