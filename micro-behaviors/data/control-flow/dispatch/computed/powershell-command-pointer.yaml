defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-command-pointer-invocation
    desc: PowerShell invokes an object with CommandPtr
    if:
      type: tree-sitter
      # The PowerShell grammar spells this node invokation_expression.
      # A syntax query excludes commented example invocations.
      query: |
        ((invokation_expression) @invoke
          (#match? @invoke "\\$[A-Za-z_][A-Za-z0-9_]*\\.Invoke\\(\\$CommandPtr\\)"))
