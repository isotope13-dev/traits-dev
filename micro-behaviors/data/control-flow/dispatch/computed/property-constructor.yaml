defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: computed-receiver-new-constructor
  desc: Constructs object using call-indexed property
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    regex: new\s*\(\s*[A-Za-z_$][\w$]*\s*\[[^\]"'.]*?\([^)]{0,48}\)[^\]"']{0,24}\]\s*\)\s*\(
    node: new_expression
