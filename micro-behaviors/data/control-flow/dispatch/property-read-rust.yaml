defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
traits:
- id: rust-client-get-call
  desc: Rust calls client.get()
  crit: component
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: client.get
- id: rust-get-accessor-call
  desc: Rust calls a .get() accessor
  crit: baseline
  conf: 0.85
  if:
    type: text
    regex: \.get\s*\(
