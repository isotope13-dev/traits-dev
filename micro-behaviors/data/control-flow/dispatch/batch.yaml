defaults:
  crit: notable
  platforms: [windows]
  for: [batch]
  conf: 0.9

traits:
  # A variable holding the FOR keyword is a control-flow/dispatch fact. Keep
  # the assignment on one command line: `set _DIR=` followed by an ordinary
  # `for` loop is common launcher code, including Kotlin's `kotlinc.bat`.
  - id: batch-for-command-assignment
    desc: Variable-held Batch FOR keyword
    if:
      type: text
      regex: '(?i)\bset[\t ]+[A-Za-z0-9_]+[\t ]*=[\t ]*for\b'
