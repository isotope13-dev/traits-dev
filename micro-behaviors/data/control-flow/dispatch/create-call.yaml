traits:
- id: create-method-call
  for:
  - javascript
  - vbs
  - html
  - text
  - data
  desc: Calls an object Create method
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: call
    regex: \.Create$
- id: create-four-argument-call
  for:
  - javascript
  - html
  desc: Four-argument Create call with null argument
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.\s*Create\s*\(\s*\w+\s*,\s*null\s*,\s*\w+\s*,\s*\w+\s*\)
defaults:
  platforms:
  - windows
