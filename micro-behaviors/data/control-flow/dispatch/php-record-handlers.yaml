defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
- id: php-request-validity-check
  desc: PHP request and checkValid function references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/data/control-flow/dispatch::php-check-valid-reference
  - id: micro-behaviors/os/module/load::php-include-init-script
  - id: micro-behaviors/communications/http/request/superglobal::post-dup

- id: php-validity-check-save
  desc: PHP request, checkValid and save_db references
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/data/control-flow/dispatch::php-check-valid-reference
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/db/access::php-save-db-function-call

