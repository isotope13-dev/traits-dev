# Android Python uses Linux; the engine rejects Android-only Python scope.
defaults:
  for:
  - python
  platforms:
  - linux
  - android
traits:
- id: python-command-key-dispatch
  desc: Command selector dispatches a supplied key
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |-
      ((if_statement
        condition: (boolean_operator
          left: (comparison_operator
            (call function: (attribute object: (identifier) @task attribute: (identifier) @get)
              arguments: (argument_list (string (string_content) @selector)))
            (string))
          right: (call function: (attribute object: (identifier) @same attribute: (identifier) @getkey)
            arguments: (argument_list (string (string_content) @key))))
        consequence: (block [
          (expression_statement (assignment right: (call
            arguments: (argument_list (subscript value: (identifier) @used
              subscript: (string (string_content) @usedkey))))))
          (try_statement body: (block (expression_statement (assignment right: (call
            arguments: (argument_list (subscript value: (identifier) @used
              subscript: (string (string_content) @usedkey))))))))
        ])) @evidence
        (#eq? @task @same) (#eq? @task @used)
        (#eq? @get "get") (#eq? @getkey "get")
        (#match? @selector "^(cmd|command)$")
        (#eq? @key "key") (#eq? @usedkey "key"))
