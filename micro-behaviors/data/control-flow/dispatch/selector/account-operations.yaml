defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: profile-history-device-operation-switch
    desc: Dispatches profile, history, device operations
    if:
      type: tree-sitter
      query: |
        ((switch_statement body: (switch_body
          (switch_case value: (member_expression object: (identifier) @a
            property: (property_identifier) @profiles))
          (switch_case value: (member_expression object: (identifier) @b
            property: (property_identifier) @history))
          (switch_case value: (member_expression object: (identifier) @c
            property: (property_identifier) @devices)))) @dispatch
          (#eq? @a @b)
          (#eq? @a @c)
          (#eq? @profiles "PROFILES")
          (#match? @history "^HISTORY(_V2|_V2_ACTIVE)?$")
          (#eq? @devices "DEVICES"))
