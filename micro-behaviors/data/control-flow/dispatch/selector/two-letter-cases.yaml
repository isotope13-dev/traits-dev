# Two-letter labels can be carrier status codes or country codes.
# Geolocation context belongs in the consuming objective.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: two-letter-case-label-run
    desc: Three consecutive two-letter case labels
    if:
      type: text
      regex: '(\bcase\s*[''"][A-Z]{2}[''"]\s*:\s*){3}'
