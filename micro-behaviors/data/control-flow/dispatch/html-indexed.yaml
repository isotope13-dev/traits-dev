defaults:
  platforms: [windows]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-computed-indexed-call
    desc: HTML calls a computed indexed method
    conf: 0.92
    if:
      type: text
      regex: '\b\w+\s*\[\s*\w+\s*\(\s*["'']0x0["'']\s*\)\s*\]\s*\(\s*\)'

  - id: html-computed-numeric-indexed-call
    desc: HTML calls a numeric computed method
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b\w+\[\w+\(0x[0-9a-f]+\)\]\(\)'

