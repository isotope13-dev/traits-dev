traits:
# Case-sensitive capital E: WSH JScript/VBS spells the method `.Exec`, while
# lowercase `.exec(` is JavaScript's RegExp.prototype.exec and Node's
# child_process.exec. The case-insensitive form labeled every regex match in
# a JS bundle a WSH invocation downstream.
- id: exec-method-call-text
  desc: Text contains an Exec-named method call
  crit: notable
  if:
    type: text
    regex: \.Exec\s*\(
  platforms:
  - windows
  for: [scripts, binaries, html, makefile]
  conf: 0.4
  unless:
  - id: metadata/file/extension/identity::yara-extension
