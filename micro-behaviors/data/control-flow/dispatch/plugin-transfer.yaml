defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: send-plugin-command-token
    desc: Send-plugin request token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: sendPlugin
      section: .text

  # Canonical matcher for the former save/send OR. The save-only atom had
  # no other consumers and duplicated one half of this observation.
  - id: plugin-transfer-command-token
    desc: Save or send plugin command token
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '^(savePlugin|sendPlugin)$'
      section: .text
