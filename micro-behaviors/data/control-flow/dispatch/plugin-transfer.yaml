defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: save-plugin-command-token
    desc: Save-plugin command token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: savePlugin
      section: .text
  - id: send-plugin-command-token
    desc: Send-plugin request token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: sendPlugin
      section: .text

composite_rules:
  - id: plugin-transfer-command-token
    desc: Save or send plugin command token
    crit: notable
    conf: 0.96
    any:
      - id: save-plugin-command-token
      - id: send-plugin-command-token
