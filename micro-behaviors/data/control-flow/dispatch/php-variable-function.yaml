defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-variable-function-call
    desc: PHP invokes a variable-named function
    crit: notable
    if:
      type: tree-sitter
      # The #not-match predicate skips common framework callable variable names.
      query: |
        (function_call_expression
          function: (variable_name (name) @var)
          (#not-match? @var "^(handler|handlers|errorHandler|exceptionHandler|logger|callback|closure|next|middleware|listener|fn|func|callable|resolver|factory|visitor|walker|childMapper|mapper|mutator|canonicalize|decodeT|append|pass|fail|warn|check|checkNode|extractText|shouldStop|stripPunct|stripCoordPunct|securitySource|on[A-Z][A-Za-z0-9_]*|[A-Za-z0-9_]*(Callback|Handler|Closure|Autoloader|Override))$"))
    unless:
      # `$var()` inside a framework's own request dispatcher is plumbing.
      - id: metadata/file/profile/source-indications::php-framework-source-context
      - type: text
        regex: "\\bClosure\\s+\\$next\\b"
      - type: text
        regex: 'namespace\s+Composer\\Autoload;[\s\S]{0,1200}class\s+ClassLoader'
      - id: metadata/package/manager::composer-generated-autoload
      - id: metadata/package/testing/harness/unit/
