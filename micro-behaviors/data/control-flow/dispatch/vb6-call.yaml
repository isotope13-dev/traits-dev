defaults:
  platforms:
  - windows
  for:
  - source
  - vbs
traits:
- id: vb6-loader-command-argument-call
  desc: VB6 call with Loader or Command argument
  crit: notable
  conf: 0.96
  for:
  - vbs
  if:
    type: text
    regex: Call Final\(InjectionPath, Loader\)|\b\w{6,}\(\w{3,32}, Command\)
  unless:
  - id: well-known/tool/sysadmin/sandboxie/
