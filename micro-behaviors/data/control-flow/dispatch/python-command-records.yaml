defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # The map, key, and parameter identifiers are the attacker's choice
  # (`COMMAND_HANDLERS`/`name`/`params` here); the matcher binds the
  # dispatch shape (handler looked up by key, then invoked) instead.
  - id: python-command-record-handler-dispatch
    desc: Selects handler and passes parameter object
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'handler\s*=\s*[\w.]+\.get\(\w+\)[\s\S]{0,120}result\s*=\s*handler\(\w+\)'
