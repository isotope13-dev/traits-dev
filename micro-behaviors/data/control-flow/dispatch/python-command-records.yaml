defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-command-record-handler-dispatch
    desc: Selects handler and passes parameter object
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'handler\s*=\s*\w+\.get\(name\)[\s\S]{0,90}result\s*=\s*handler\(params\)'
