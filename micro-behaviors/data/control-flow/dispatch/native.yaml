defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: x64-multiply-rotate-sequence
    desc: x64 multiply followed by rotate sequence
    crit: notable
    conf: 0.9
    arch: [x86-64]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: '69 ?? ?? ?? ?? ?? D3 C8'

  - id: indirect-call-r13-x64
    desc: Calls a function indirectly through x64 r13
    crit: baseline
    conf: 0.7
    if:
      type: hex
      section: .text
      pattern: '41 FF D5'

  - id: indexed-function-table-indirect-call-x64
    desc: x64 indexed indirect call through function table
    crit: notable
    conf: 0.9
    arch: [x86-64]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: '41 FF 14 C0'

  - id: stack-indirect-call-x64
    desc: x64 stack-indirect function call
    crit: baseline
    conf: 0.8
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'FF 54 24 ??'

  - id: dense-stack-table-indirect-calls-x64
    desc: Dense x64 stack-table indirect calls
    crit: notable
    conf: 0.97
    arch: [x86-64]
    count_min: 12
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: 'FF 94 24 ?? ?? 00 00'

  # Normal x64 TEB access loads GS:[30h]. Adding the TEB pointer into an
  # arithmetic expression is an opaque-address construction used to conceal
  # the eventual PEB/loader dereference.
  - id: opaque-teb-pointer-add-x64
    desc: TEB pointer used in opaque arithmetic
    crit: notable
    conf: 0.98
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '65 48 03 ?? 25 30 00 00 00'

  # Absolute address loaded into a register, adjusted, then used as a call/jump
  # target. Common in obfuscated loaders; not family-specific by itself.
  - id: x64-imm64-add-reg-jmp
    desc: x64 imm64 pointer add then jmp rax
    crit: notable
    conf: 0.9
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '48 B9 ?? ?? ?? ?? ?? ?? ?? ?? 48 01 C8 FF E0'

  - id: x64-imm64-add-mem-call
    desc: x64 imm64 pointer add then call rax
    crit: notable
    conf: 0.9
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '48 B8 ?? ?? ?? ?? ?? ?? ?? ?? 48 03 05 ?? ?? ?? ?? FF D0'

  # Opaque native dispatchers derive a branch target from RIP-relative state,
  # an immediate rotate, and the image base. The two arithmetic variants are
  # separate byte patterns but represent the same computed-jump primitive.
  - id: rip-relative-rotate-sub-jump-x64
    desc: RIP-relative rotate/subtract jumps
    crit: notable
    conf: 0.98
    arch: [x86-64]
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: '48 8B 0D ?? ?? ?? ?? 48 8B 15 ?? ?? ?? ?? 48 C1 C1 ?? 48 29 D1 48 01 C1 48 8D 05 ?? ?? ?? ?? 48 01 C1'

  - id: rip-relative-rotate-xor-jump-x64
    desc: Repeated RIP-relative rotate/XOR computed jumps
    crit: notable
    conf: 0.98
    arch: [x86-64]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: '48 8B 0D ?? ?? ?? ?? 48 8B 15 ?? ?? ?? ?? 48 C1 C1 ?? 48 31 D1 48 01 C1 48 8D 05 ?? ?? ?? ?? 48 01 C1'

  # GS:[58h] is the x64 process TLS-array pointer. High-density accesses are
  # characteristic of dispatchers that keep branch keys in private TLS slots;
  # ordinary runtime TLS setup uses only a handful of such loads.
  - id: dense-x64-tls-array-access
    desc: Dense x64 TLS-array pointer access
    crit: notable
    conf: 0.97
    arch: [x86-64]
    count_min: 16
    if:
      type: hex
      section: .text
      pattern: '65 48 8B ?? 25 58 00 00 00'

  # A command-dispatch function name is useful control-flow evidence, but it
  # is not specific to YakuzaBotNet (or even necessarily to malware). Family
  # attribution requires the larger symbol cluster in the family rule.
  - id: processcmd-function-name
    desc: processCmd command-dispatch function name
    crit: notable
    conf: 0.9
    platforms: [unix, android]
    for: [elf]
    if:
      type: text
      exact: processCmd

composite_rules:
  - id: x64-imm64-pointer-dispatch
    desc: x64 imm64 pointer add then call/jmp
    crit: notable
    conf: 0.9
    arch: [x86-64]
    any:
      - id: x64-imm64-add-reg-jmp
      - id: x64-imm64-add-mem-call

  - id: rip-relative-opaque-jump-x64
    desc: Repeated RIP-relative arithmetic computed jumps
    crit: notable
    conf: 0.99
    arch: [x86-64]
    any:
      - id: rip-relative-rotate-sub-jump-x64
      - id: rip-relative-rotate-xor-jump-x64
