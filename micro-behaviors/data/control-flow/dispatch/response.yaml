defaults:
  platforms: [windows, unix]
traits:
  - id: js-predicate-guarded-decoder-dispatch
    desc: Predicate guards a decoder-indexed call
    crit: notable
    conf: 0.96
    for: [javascript, typescript, html, text, makefile]
    if:
      type: text
      regex: 'function\(\w+\)\{var \w+=\w+;\w+\(\w+,\w+\(0x[\da-f]+\)\)&&\w+\[\w+\('
