defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.7
traits:
  - id: response-commands-member
    desc: References a response commands member
    if:
      type: text
      substr: response.commands
    unless:
      - id: well-known/lib/format/pdfjs/
      - id: metadata/build/
      - id: metadata/package/files/dependency::node-modules-path
      - id: well-known/app/ai/coding-agent/tabby/
      - id: well-known/app/media/vlc::windows-portable-archive
      - type: text
        substr: sendVLMCmd
      - id: metadata/package/files/ecosystem::openclaw-evolver-package-member
      - id: metadata/package/testing/presence/harness::spec-test-filename
      - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: process-command-handler-call
    desc: Calls a processCommand handler
    if:
      type: symbol
      kind: call
      regex: '(^|\.)processCommand$'
    unless:
      - id: well-known/lib/format/pdfjs/
      - id: metadata/build/
      - id: metadata/package/files/dependency::node-modules-path
      - id: well-known/app/ai/coding-agent/tabby/
      - id: well-known/app/media/vlc::windows-portable-archive
      - type: text
        substr: sendVLMCmd
      - id: metadata/package/files/ecosystem::openclaw-evolver-package-member
      - id: metadata/package/testing/presence/harness::spec-test-filename
      - id: well-known/tool/development/aube::aube-package-test-fixture
composite_rules:
  - id: command-member-or-handler-reference
    desc: Command member or handler call reference
    any:
      - id: response-commands-member
      - id: process-command-handler-call
