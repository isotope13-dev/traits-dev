# Neutral observations; consumers must supply any obfuscation interpretation.
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: computed-call-hex-token-pairs
  desc: Computed calls with hex-shaped argument pairs
  crit: notable
  conf: 0.85
  count_min: 3
  if:
    type: text
    regex: \]\s*\(\s*[0-9a-fA-Fx]{1,8}\s*,\s*[0-9a-fA-Fx]{1,8}\s*\)
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
