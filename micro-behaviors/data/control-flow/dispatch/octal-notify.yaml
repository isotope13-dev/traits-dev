# Retained observation; matcher and effective scope unchanged.
traits:
- for:
  - html
  - javascript
  platforms:
  - windows
  crit: notable
  conf: 0.98
  size_max: 262144
  id: octal-dictionary-hgs-notify-call
  desc: Octal dictionary carries hgs_startNotify call
  if:
    type: yara
    source: "import \"math\"\nrule octal_dictionary_hgs_notify_call {\n strings:\n\
      \  $dictionary = /'([0-7]{1,3}\\|){1,61}eval(\\|[0-7]{1,3}){1,61}'/\n condition:\n\
      \  $dictionary and\n  for any d in (1..#dictionary) : (\n   for any p in (0..@dictionary[d]-3*17)\
      \ : (\n    uint16(p) == 0x5c5c and\n    for all n in (0..17-1) : (\n     uint16(p+n*3)\
      \ == 0x5c5c and\n     for any k in (0..!dictionary[d]-3) : (\n      (uint8(@dictionary[d]+k)\
      \ == 124 or k == 0) and\n      ((n == 0 and uint8(@dictionary[d]+k+1) == 53\
      \ and uint8(@dictionary[d]+k+2) == 54 and (uint8(@dictionary[d]+k+3) == 124\
      \ or uint8(@dictionary[d]+k+3) == 39)) or\n(n == 1 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 53 and uint8(@dictionary[d]+k+3) ==\
      \ 48 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 2 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 52 and uint8(@dictionary[d]+k+3) == 55 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 3 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 54 and uint8(@dictionary[d]+k+3) ==\
      \ 51 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 4 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 51 and uint8(@dictionary[d]+k+3) == 55 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 5 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 54 and uint8(@dictionary[d]+k+3) ==\
      \ 51 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 6 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 54 and uint8(@dictionary[d]+k+3) == 52 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 7 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 52 and uint8(@dictionary[d]+k+3) ==\
      \ 49 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 8 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 54 and uint8(@dictionary[d]+k+3) == 50 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 9 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 54 and uint8(@dictionary[d]+k+3) ==\
      \ 52 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 10 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 49 and uint8(@dictionary[d]+k+3) == 54 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 11 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 53 and uint8(@dictionary[d]+k+3) ==\
      \ 55 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 12 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 54 and uint8(@dictionary[d]+k+3) == 52 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 13 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 53 and uint8(@dictionary[d]+k+3) ==\
      \ 49 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 14 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2)\
      \ == 52 and uint8(@dictionary[d]+k+3) == 54 and (uint8(@dictionary[d]+k+4) ==\
      \ 124 or uint8(@dictionary[d]+k+4) == 39)) or\n(n == 15 and uint8(@dictionary[d]+k+1)\
      \ == 49 and uint8(@dictionary[d]+k+2) == 55 and uint8(@dictionary[d]+k+3) ==\
      \ 49 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))\
      \ or\n(n == 16 and uint8(@dictionary[d]+k+1) == 53 and uint8(@dictionary[d]+k+2)\
      \ == 48 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) ==\
      \ 39))) and\n      with slot = math.count(124,@dictionary[d],k+1) : (\n    \
      \   (slot < 10 and uint8(p+n*3+2) == slot+48) or\n       (slot >= 10 and slot\
      \ < 36 and uint8(p+n*3+2) == slot+87) or\n       (slot >= 36 and slot < 58 and\
      \ uint8(p+n*3+2) == slot+29)\n      )\n     )\n    )\n   )\n  )\n}\n"
