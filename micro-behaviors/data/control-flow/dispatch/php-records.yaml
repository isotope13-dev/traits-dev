defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
traits:
  - id: php-get-content-call
    desc: PHP calls a function named get_content
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: get_content

  - id: php-check-valid-reference
    desc: PHP checkValid function reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcheckValid\s*\('

  # `save_db(` reads no request parameter and is an ordinary user-defined
  # persistence method name; it now lives with the other PHP database calls at
  # micro-behaviors/data/db/access::php-save-db-function-call, which the
  # shell-fleet composite references cross-directory.
