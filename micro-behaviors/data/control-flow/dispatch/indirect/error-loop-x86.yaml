defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.95
traits:
  - id: imported-status-two-call-loop-x86
    desc: Imported status gates repeated paired calls
    if:
      type: hex
      section: .text
      # Clear imported state, query it, exit on nonzero; otherwise run two
      # routines and return to the query. Import/callee addresses vary.
      pattern: '6A 00 FF 15 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 85 C0 75 0C E8 ?? ?? ?? ?? E8 ?? ?? ?? ?? EB EA'
