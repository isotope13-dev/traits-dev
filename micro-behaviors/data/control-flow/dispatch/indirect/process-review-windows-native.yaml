defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620
  mbc: B0005
traits:
  - id: x86-indirect-frame-call-with-buffer
    desc: Calls frame-local pointer with buffer
    crit: notable
    conf: 0.86
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # The call consumes the slot populated by the transfer above.
      pattern: '8D 85 1C F4 FF FF 50 FF 95 AC EA FF FF'
  - id: x86-indirect-frame-call-with-stack-buffer
    desc: Calls frame-local pointer with stack buffer
    crit: notable
    conf: 0.96
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8B 45 ?? 89 45 ?? 8D 45 ?? 50 FF 55 ??'
composite_rules:
  - id: x86-computed-image-entry-invocation
    desc: Invokes computed mapped-image entry
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/arithmetic::x86-frame-local-address-sum
      - id: micro-behaviors/mem/copy::x86-frame-pointer-slot-transfer
      - id: micro-behaviors/data/control-flow/dispatch/indirect::x86-indirect-frame-call-with-buffer
