defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: powershell-named-variable-invocation
    desc: PowerShell invokes a stage or file-named variable
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/data/control-flow/dispatch/indirect::powershell-invoke-download-named-variable
      - id: micro-behaviors/data/control-flow/dispatch/indirect::powershell-invoke-stage-named-variable
      - id: micro-behaviors/data/control-flow/dispatch/indirect::powershell-invoke-file-named-variable
    unless:
      - id: metadata/path/directory::test-directory-component
    # Arcade is the shared .NET build toolset; every dotnet repo vendors
    # eng/common/tools.ps1 verbatim, and downloading the SDK, vswhere and
    # dnceng packages then running them is its whole job.
      - id: metadata/build/recognized-contexts::arcade-build-bootstrapper
  - id: powershell-variable-or-command-invocation
    desc: PowerShell invokes a variable or command target
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/process/create/path-execution::powershell-call-operator-target
      - id: micro-behaviors/data/control-flow/dispatch/indirect::powershell-named-variable-invocation
      - id: micro-behaviors/data/control-flow/dispatch/indirect::powershell-invoke-executable-named-variable
