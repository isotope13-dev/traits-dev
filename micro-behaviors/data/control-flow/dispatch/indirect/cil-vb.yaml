# The byte pattern establishes conditional array-argument dispatch.
# VB Shell is corroborated by metadata references; the call operand itself
# remains a wildcard, so this atom does not assert a resolved launch target.
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: cil-vb-string-task-dispatch
  desc: CIL task dispatch with VB Shell references
  crit: notable
  conf: 0.96
  if:
    type: yara
    source: |
      import "pe"
      rule cil_vb_string_array_command_launch {
        strings:
          $dispatch = { 11 ?? 72 ?? ?? ?? 70 16 28 ?? ?? ?? 0A
                        16 33 11 06 17 9A 16 16 15
                        28 ?? ?? ?? 0A 26 38 ?? ?? ?? ?? }
          $vb = "Microsoft.VisualBasic" ascii fullword
          $interaction = "Interaction" ascii fullword
          $shell = "Shell" ascii fullword
          $compare = "CompareString" ascii fullword
        condition:
          for any s in pe.sections : (
            s.name == ".text" and
            for all of them : (
              $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
            )
          )
      }
