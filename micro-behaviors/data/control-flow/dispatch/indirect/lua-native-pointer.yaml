defaults:
  platforms: [windows]
  for: [lua]
traits:
  - id: lua-pcall-cast-pointer
    desc: Lua invokes a cast pointer through pcall
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_
          (variable_declaration (assignment_statement
            (variable_list . (identifier) @binding .)
            (expression_list . (function_call
              name: (dot_index_expression field: (identifier) @cast)
              arguments: (arguments . (string) @ctype . (_) .)) .)))
          . (variable_declaration (assignment_statement
            (expression_list (function_call name: (identifier) @pcall
              arguments: (arguments . [(function_definition body: (block
                . (function_call name: (identifier) @called
                  arguments: (arguments)) @evidence))
                (identifier) @called @evidence]))))))
          (#eq? @cast "cast") (#eq? @pcall "pcall")
          (#eq? @binding @called)
          (#match? @ctype "(\\*|\\\\0?42)"))
