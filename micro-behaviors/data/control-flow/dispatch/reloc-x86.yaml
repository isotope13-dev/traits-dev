defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.97
traits:
  - id: reloc-return-address-stack-rewrite-x86
    desc: Reloc code rewrites saved return address
    if:
      type: hex
      section: .reloc
      # Save the continuation, reserve stack, load an absolute function
      # pointer, adjust the saved return address, then jump to continuation.
      # The imported pointer and return delta vary between infected hosts.
      pattern: '8B 2C 24 8D 64 24 E0 FF 35 ?? ?? ?? ?? 81 44 24 24 ?? ?? ?? ?? 5B FF E5'
