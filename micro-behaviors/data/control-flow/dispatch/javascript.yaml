defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A switch on a command-like object field is a control-flow observation.
  # Remote tasking intent requires communication and process-execution context
  # in a separate composite.
  - id: object-field-dispatch-switch
    desc: Switch dispatches on a command-like object field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bswitch\s*\(\s*[A-Za-z_$][\w$]*\s*\.\s*(command|action|task)\s*\)'

  # `new Proxy(obj, { get(target, prop) { ... } })` — an interception layer over
  # every property read on an object. Ordinary metaprogramming (observable
  # stores, mock frameworks, lazy-require helpers all use it), so this is the
  # capability and nothing more; the composites decide what is being intercepted
  # and on whose behalf.
  - id: js-proxy-get-trap
    desc: Proxy intercepts property reads
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+Proxy\s*\([\s\S]{0,160}?\bget\s*\(\s*\w+\s*,\s*\w+'
  # The trap body forwards the intercepted name onto a value that arrives
  # later: `promise.then(real => real[prop])`. Together with the trap above this
  # is the transparent-forwarder shape — the object a caller holds is a stand-in
  # for one that has not loaded yet.
  - id: js-deferred-member-forward
    desc: Forwards trapped name to resolved value
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.then\s*\(\s*\(?\s*\w+\s*\)?\s*=>\s*\{?[\s\S]{0,80}?\[\s*\w+\s*\]'
  - id: js-provider-computed-forwarding
    desc: Accesses a provider through a computed property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*Provider\s*\[[A-Za-z_$][\w$]*\]'

  - id: js-commonjs-provider-export
    desc: CommonJS module exports a provider symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'exports\.[A-Za-z_$][\w$]*Provider\s*='

  - id: js-esm-provider-export
    desc: ESM module exports a provider symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'export\s*\{[^}]{0,240}\b[A-Za-z_$][\w$]*Provider\b'
