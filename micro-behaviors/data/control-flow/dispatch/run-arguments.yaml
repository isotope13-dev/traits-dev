defaults:
  platforms:
  - windows
  crit: notable
traits:
- for:
  - javascript
  - vbs
  id: run-zero-boolean-arguments
  desc: Run call with zero and Boolean arguments
  conf: 0.94
  if:
    type: text
    regex: (?is)\.Run\s*\([^;\r\n]{1,512},\s*0\s*,\s*(false|true)\s*\)
- for:
  - javascript
  - vbs
  id: indexed-call-zero-boolean-arguments
  desc: Indexed call with zero and Boolean arguments
  conf: 0.9
  if:
    type: text
    regex: \[[^\r\n\]]{1,900}\]\s*\([^;\r\n]{1,256},\s*0\s*,\s*(false|true)\s*\)
- for:
  - javascript
  - vbs
  - html
  id: run-zero-number-argument
  desc: Run method call with a zero argument
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (?i)\.Run$
    arg:
      kind: number
      value: 0
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
