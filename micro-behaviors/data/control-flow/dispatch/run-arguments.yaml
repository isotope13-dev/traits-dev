defaults:
  platforms:
  - windows
  crit: notable
traits:
- for:
  - javascript
  - vbs
  id: run-call-expression-argument
  desc: Run method with function-call argument
  conf: 0.85
  if:
    type: text
    regex: (?i)\.Run\s+[A-Za-z][A-Za-z0-9_]{5,}\s*\(
- for:
  - javascript
  - vbs
  id: run-zero-boolean-arguments
  desc: Run call with zero and Boolean arguments
  conf: 0.94
  if:
    type: text
    regex: (?is)\.Run\s*\([^;\r\n]{1,512},\s*0\s*,\s*(false|true)\s*\)
- for:
  - javascript
  - vbs
  id: indexed-call-zero-boolean-arguments
  desc: Indexed call with zero and Boolean arguments
  conf: 0.9
  if:
    type: text
    regex: \[[^\r\n\]]{1,900}\]\s*\([^;\r\n]{1,256},\s*0\s*,\s*(false|true)\s*\)
- for:
  - javascript
  - vbs
  - html
  id: run-zero-number-argument
  desc: Run method call with a zero argument
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (?i)\.Run$
    arg:
      kind: number
      value: 0
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
composite_rules:
- id: run-hidden-or-falsy-arguments
  desc: Run call with hidden or falsy arguments
  crit: notable
  conf: 0.94
  any:
  - id: run-zero-boolean-arguments
  - id: micro-behaviors/data/arithmetic::hex-arithmetic-falsy-arguments
