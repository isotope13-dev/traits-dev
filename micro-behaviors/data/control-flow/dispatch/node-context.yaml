defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: timeout-bracket-delete
  desc: setTimeout bracketed call
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: setTimeout[\s\S]{0,500}\[[^\]]{1,80}\]\s*\(
  unless:
  - id: metadata/build/
  - id: well-known/lib/web/jquery/
  - id: metadata/file/extension/identity::type-stub-basename
  - id: metadata/file/format/structured::sourcemap
  - type: path
    regex: (^|[\\/])bootstrap(\.min)?\.js$
composite_rules:
- id: date-temp-write-delete
  desc: Dated temp write and delete context
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/data/control-flow/dispatch::js-computed-date-method-call
  - id: micro-behaviors/fs/write/file/full::bom-temp-write
  - id: micro-behaviors/data/control-flow/dispatch::timeout-bracket-delete
