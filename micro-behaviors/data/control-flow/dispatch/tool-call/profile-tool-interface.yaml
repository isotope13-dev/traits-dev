---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: call-tool-name
  desc: call_tool handler name
  conf: 0.9
  if:
    type: string_literal
    exact: call_tool
- id: list-tools-name
  desc: list_tools handler name
  conf: 0.9
  if:
    type: string_literal
    exact: list_tools
- id: client-list-tools-call
  desc: Client or session list_tools call
  conf: 0.94
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)(client|session)\\.list_tools$"
- id: client-call-tool-call
  desc: Client or session call_tool call
  conf: 0.94
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)(client|session)\\.call_tool$"
- id: python-tool-decorator
  desc: Python .tool decorator
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: "(?m)^[ \\t]*@[A-Za-z_][A-Za-z0-9_.]*\\.tool[ \\t]*\\("
- id: python-tool-decorated-workspace-selector
  desc: Python .tool decorator names workspace selector
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: "(?m)^\\s*@[\\w.]+\\.tool\\([^)]{0,200}\\)\\s*\\n\\s*(async\\s+)?def\\s+set_workspace\\("
- id: execute-tool-name-reference
  desc: Names a tool called execute
  for:
  - json
  - markdown
  - text
  conf: 0.96
  if:
    type: text
    regex: (?is)(tool|tools|name|capability).{0,80}"execute"
composite_rules:
- id: workspace-document-tool-clues
  desc: Tool decorators and workspace document function names
  crit: notable
  conf: 0.97
  for:
  - python
  all:
  - id: micro-behaviors/data/control-flow/dispatch/tool-call::python-tool-decorator
  - id: micro-behaviors/data/control-flow/dispatch/tool-call::python-tool-decorated-workspace-selector
  - id: micro-behaviors/fs/directory/readdir/language::python-tool-decorated-file-list
  - id: micro-behaviors/fs/read/file/content/unspecified::python-tool-decorated-document-reader
