defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9

traits:
- id: go-variable-do-call
  desc: Go Do method receives an identifier
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: '^[A-Za-z_][A-Za-z0-9_]*\.Do$'
    arg:
      index: 0
      kind: identifier
