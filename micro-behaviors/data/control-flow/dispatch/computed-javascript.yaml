defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  id: js-new-this-bracket
  desc: Constructs object through this bracket property
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    language: javascript
    query: |
      (new_expression
        constructor: (subscript_expression
          object: (this))) @construction
  unless:
  - id: micro-behaviors/data/archive/library::archiver
  - id: micro-behaviors/data/archive/library::zip-stream-entry-writer-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: well-known/tool/development/vscode-extension/dbcode::extension-context
- for:
  - javascript
  - typescript
  - html
  id: js-computed-property-call
  desc: Calls a property using bracket notation
  crit: notable
  conf: 0.82
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: metadata/package/documentation/manpage::unix-manpage
  if:
    type: text
    regex: \b[A-Za-z_$][\w.$]{0,120}(\s*\[[^\]\n]{1,120}\]){1,3}\s*\(
- for:
  - javascript
  id: js-numeric-indexed-computed-call
  desc: Calls a numeric-indexed computed property
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]{0,120}\[\s*[A-Za-z_$][A-Za-z0-9_$]*\(\s*\d+\s*\)\s*\]\s*\(
- for:
  - javascript
  - typescript
  id: js-computed-call-cluster
  desc: Repeated computed-property calls (3+)
  crit: notable
  conf: 0.86
  count_min: 3
  # Non-code text can recover as call nodes when identified as JavaScript.
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - type: basename
    regex: '\.(md|rst|log)$'
    case_insensitive: true
  if:
    type: tree-sitter
    query: |
      (call_expression function: (subscript_expression)) @call
- for:
  - javascript
  - typescript
  id: js-computed-constructor
  desc: Constructs an object through a computed property
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \bnew\s+\w+\s*\[[^\]\n]{1,180}\]\s*\(\s*\)
- for:
  - javascript
  id: globalthis-computed-property-call
  desc: Calls a computed globalThis property
  crit: notable
  conf: 0.88
  if:
    # Require the subscript itself to be the callee. A byte regex can cross
    # subsequent property accesses or unrelated expressions in a bundle.
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (subscript_expression
          object: [
            (identifier) @global
            (parenthesized_expression (identifier) @global)
          ])
        (#eq? @global "globalThis")) @call
- for:
  - javascript
  id: js-computed-date-method-call
  desc: Calls a Date method through bracket notation
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: Date\s*\[[^\]]{1,80}\]\s*\(
  unless:
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
- for:
  - javascript
  id: js-computed-this-method-concat-call
  desc: Calls a this method named by concatenation
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: this\[['"][a-zA-Z0-9]+['"]\s*\+\s*[a-zA-Z0-9]+\]\(
- for:
  - javascript
  id: js-computed-zero-false-call
  desc: Computed call with zero and false arguments
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \b\w+\[\w+\(["'][^"']{1,40}["']\)\]\s*\(\w+\s*,\s*0\s*,\s*false\s*\)
- for:
  - javascript
  id: js-indexed-zero-false-call
  desc: Indexed call with zero and false arguments
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \b\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*,\s*0\s*,\s*false\s*\)
- for:
  - javascript
  id: js-computed-call-false-third-argument
  desc: Computed call has false third argument
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*,\s*\w+\s*,\s*false\s*\)
- for:
  - javascript
  id: js-function-indexed-false-flag-call
  desc: Function-indexed call with false argument
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \b\w+\[\w+\(["'][^"']{1,40}["']\)\]\s*\(\s*\w+\([^)]{1,80}\)\s*,\s*\w+\s*,\s*false\s*\)
- for:
  - javascript
  id: js-arithmetic-falsy-final-flags
  desc: Trailing arithmetic and falsy argument syntax
  crit: component
  conf: 0.9
  if:
    type: text
    regex: ',\s*[-+*\dA-Fa-fx\s]{3,120},\s*!\[\]\s*\)\s*[,;]'
- for:
  - javascript
  - typescript
  - html
  id: window-double-bracket-call
  desc: Window double-bracket member call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: window\s*\[[^\]]{1,120}\]\s*\[[^\]]{1,120}\]\s*\(
  unless:
  - id: well-known/lib/web/ckeditor::ckeditor-distribution
- for:
  - javascript
  id: computed-member-call-zero-arg
  desc: Computed member call with trailing zero
  crit: notable
  conf: 0.96
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/lib/ui/jquery-ui/
  - id: well-known/lib/ui/yui/
  if:
    type: text
    regex: '[A-Za-z_$][\w$]*\s*\[[^\]\n]{1,60}\]\([^()\n;]{1,80},\s*0\s*\)'
- for:
  - javascript
  id: js-nested-this-subscript-call
  desc: Computed this call with this-subscript argument
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: this\[[^\]\n]{8,80}\]\(this\[
