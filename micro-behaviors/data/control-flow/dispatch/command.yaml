defaults:
  crit: notable
  platforms: [windows, unix]
  for: [c, cpp, rust, go, csharp, javascript, php]

traits:
  # Relocated from objectives/.../remote-command/shell (json-commandid-field).
  # The bare identifier is a command-dispatch field name found throughout
  # .NET (System.Data.Entity, PresentationCore); nothing checks it is JSON.
  # The C++ agent composite supplies the tasking context from its banners.
  - id: commandid-field-name
    desc: CommandId command identifier name
    conf: 0.9
    for: [pe]
    platforms: [windows]
    if:
      type: text
      word: CommandId

  # Relocated from objectives/.../channel/redundancy (c2-command-shell-token).
  # A command enum naming a shell/exec opcode is a dispatcher capability; the
  # multi-transport composite there supplies the C2 context.  Case-sensitive:
  # `(?i)` matched ordinary `cmd_exec()` methods (MariaDB HandlerSocket).
  - id: cmd-shell-exec-enum-constant
    desc: CMD_SHELL or CMD_EXEC command constant
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: \bCMD_(SHELL|EXEC)\b

  - id: go-main-command-handler-symbol
    desc: Go main-package command handler symbol
    conf: 0.98
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      regex: '\bmain\.(handleCommand|processCommand|execCommand)\b'

  - id: go-main-session-dispatch-symbol
    desc: Go main-package session dispatch symbol
    conf: 0.98
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: 'main.(*session).dispatch'

  - id: rust-command-handler-reference
    desc: Rust command-handler function reference
    conf: 0.9
    for: [rust]
    if:
      type: text
      word: command_handler

  - id: python-handle-command-function
    desc: Python _handle_command function
    conf: 0.98
    for: [python, pyc]
    if:
      type: function
      exact: _handle_command

  - id: python-handle-exec-function
    desc: Python _handle_exec function
    conf: 0.98
    for: [python, pyc]
    if:
      type: function
      exact: _handle_exec

  - id: python-handle-upload-function
    desc: Python _handle_upload function
    conf: 0.98
    for: [python, pyc]
    if:
      type: function
      exact: _handle_upload

  - id: python-handle-download-function
    desc: Python _handle_download function
    conf: 0.98
    for: [python, pyc]
    if:
      type: function
      exact: _handle_download

  - id: switch-command-variable-dispatch
    desc: Switch dispatches on a command-like variable
    conf: 0.9
    if:
      type: text
      regex: '\bswitch\s*\(\s*(command|opcode|request)(_[A-Za-z0-9]+)?\s*\)\s*\{'

  - id: match-command-variable-dispatch
    desc: Match dispatches on a command-like variable
    conf: 0.9
    if:
      type: text
      regex: '\bmatch\s+(command|opcode|request)\s*\{'
