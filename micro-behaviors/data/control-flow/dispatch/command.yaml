defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust, go, csharp, javascript]

traits:
  - id: rust-command-handler-reference
    desc: Rust command-handler function reference
    crit: component
    conf: 0.9
    for: [rust]
    if:
      type: text
      word: command_handler
  - id: switch-command-variable-dispatch
    desc: Switch dispatches on a command-like variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bswitch\s*\(\s*(command|opcode|request)(_[A-Za-z0-9]+)?\s*\)\s*\{'

  - id: match-command-variable-dispatch
    desc: Match dispatches on a command-like variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bmatch\s+(command|opcode|request)\s*\{'

  - id: send-command-branch
    desc: Switch or conditional branch on send action
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(case|when)\s*["'']send["'']|if[^;\n]{0,180}["'']send["'']'

  - id: receive-command-branch
    desc: Switch or conditional branch on receive action
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(case|when)\s*["'']receive["'']|if[^;\n]{0,180}["'']receive["'']'
