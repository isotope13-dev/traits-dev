defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust, go, csharp, javascript, php]

traits:
  - id: go-main-command-handler-symbol
    desc: Go main-package command handler symbol
    crit: notable
    conf: 0.98
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      regex: '\bmain\.(handleCommand|processCommand|execCommand)\b'

  - id: go-main-session-dispatch-symbol
    desc: Go main-package session dispatch symbol
    crit: notable
    conf: 0.98
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: 'main.(*session).dispatch'

  - id: rust-command-handler-reference
    desc: Rust command-handler function reference
    crit: component
    conf: 0.9
    for: [rust]
    if:
      type: text
      word: command_handler
  - id: switch-command-variable-dispatch
    desc: Switch dispatches on a command-like variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bswitch\s*\(\s*(command|opcode|request)(_[A-Za-z0-9]+)?\s*\)\s*\{'

  - id: match-command-variable-dispatch
    desc: Match dispatches on a command-like variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bmatch\s+(command|opcode|request)\s*\{'
