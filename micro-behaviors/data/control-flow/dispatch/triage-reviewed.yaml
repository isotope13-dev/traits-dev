traits:
- for:
  - html
  - vbs
  - javascript
  - makefile
  conf: 0.98
  id: script-run-method-call
  desc: Script calls a Run method
  if:
    type: text
    regex: (?i)\.Run\s*\(|\.Run\s+[A-Za-z][A-Za-z0-9_]{5,}\s*\(
    case_insensitive: true
- crit: notable
  for:
  - html
  - vbs
  - javascript
  conf: 0.92
  id: run-zero-style-argument
  desc: Run syntax with zero second argument
  if:
    type: text
    regex: \.Run\s*[(\s][^,\r\n]{1,80},\s*(0|&H0)\b
defaults:
  crit: notable
  platforms:
  - windows
