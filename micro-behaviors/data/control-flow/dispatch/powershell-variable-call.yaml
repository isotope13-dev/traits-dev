defaults:
  platforms: [windows, unix]
  # vbs: PowerShell staged inside VBScript string literals.
  for: [powershell, batch, vbs]
  crit: notable
traits:
  - id: powershell-variable-call-operator
    desc: PowerShell invokes variable via call operator
    conf: 0.9
    if:
      type: text
      regex: '(?m)((^|[;\r\n])\s*&\s*\$[A-Za-z_][A-Za-z0-9_]*\b|[&.]\s*\(\s*\$\w+\s*\)\s*\$\w+)'
