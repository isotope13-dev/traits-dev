defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.97
traits:
  - id: tls-conditional-pointer-jump-x64
    desc: TLS access before conditional pointer dispatch
    if:
      type: hex
      section: .text
      pattern: '65 (48|4C) 8B ?? 25 58 00 00 00 [0-1536] 48 8D ?? [4] [0-12] 48 0F 44 ?? FF (20|21|22|23|26|27)'
  - id: tls-rip-relative-rotate-xor-target-x64
    desc: TLS access before rotate/XOR jump target
    if:
      type: hex
      section: .text
      pattern: '65 (48|4C) 8B ?? 25 58 00 00 00 [0-80] 4C 8B ?? [4] 4C 8B ?? [4] 49 C1 ?? ?? 4D 31 ?? [0-12] (48|4C|4D) 8D ?? [4] 4D 01 ?? 41 FF E1'
