defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: connection-update-handler-registration
  desc: Registers a connection.update handler
  conf: 0.94
  if:
    type: text
    regex: '\.(on|once)\s*\(\s*["'']connection\.update["'']'

# A connection-event listener in the generic `connection` spelling used by
# zapo-js-style clients. Neutral on its own; it becomes a lifecycle trigger
# only with a status gate and a follow objective.
- id: connection-event-listener-registration
  desc: Registers a connection event listener
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.(on|once)\s*\(\s*["'']connection["'']\s*,'

# The status gate on that event: the handler acts only when the connection
# reports `open`. Written as `event.status !== 'open'` rather than comparing a
# variable literally named `connection`, so the Baileys-shaped atoms miss it.
- id: connection-status-open-gate
  desc: Gates connection handler on status open
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '\bstatus\s*(!={1,2}|={2,3})\s*["'']open["'']'

