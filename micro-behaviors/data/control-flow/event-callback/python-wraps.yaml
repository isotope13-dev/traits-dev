defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-functools-wraps-decorator
    desc: Applies wraps to nested Python function
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (decorated_definition
            (decorator (call function: (identifier) @wraps))
            definition: (function_definition name: (identifier) @wrapper))))
          (#eq? @wraps "wraps"))
