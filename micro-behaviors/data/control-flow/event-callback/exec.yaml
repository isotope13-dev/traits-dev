defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-exec-event-registration
    desc: Registers an event named exec
    crit: notable
    conf: 0.88
    # Ace's editor command events use this spelling too. No socket transport
    # or OS command execution is established by the event name.
    if:
      type: text
      regex: '\.on\(\s*[''"]exec[''"]'
