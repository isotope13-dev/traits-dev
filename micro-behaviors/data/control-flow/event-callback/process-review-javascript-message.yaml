defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-event-on-message
    desc: JavaScript 'message' event listener
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '\.on$'
      arg:
        index: 0
        kind: string
        exact: message

