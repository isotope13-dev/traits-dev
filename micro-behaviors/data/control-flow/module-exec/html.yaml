defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: html-initial-parameterless-call
    desc: HTML script starts with parameterless call
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '<script>\s*[A-Za-z_$][\w$]*\s*\(\s*\)\s*;'
