defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
traits:
- id: python-module-process-or-connect-ast
  desc: Module-shaped process/connect AST reference
  if:
    type: tree-sitter
    query: '(module (expression_statement (call function: (attribute attribute: (identifier) @method) (#match? @method "^(system|popen|Popen|run|call|connect|exec|spawn)$")))) @activation'
- id: python-process-or-connect-call
  desc: Calls process creation or socket connection
  if:
    type: symbol
    kind: call
    regex: (\.|^)(system|popen|Popen|connect|exec|spawn)$
composite_rules:
- id: python-module-process-or-connect-call
  desc: Module-shaped process/connect call co-occurrence
  all:
  - id: python-module-process-or-connect-ast
  - id: python-process-or-connect-call
  near_bytes: 80
