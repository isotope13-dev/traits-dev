defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-import-calls-named-downloader
    desc: Import calls function with named downloader
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition name: (identifier) @inner body: (block
            (try_statement body: (block
              (for_statement body: (block
                (expression_statement (call function: (identifier) @download))))))))
          (function_definition name: (identifier) @outer body: (block
            (return_statement (comparison_operator
              (call function: (identifier) @length
                arguments: (argument_list (call function: (identifier) @inner_call)))))))
          (expression_statement (assignment right: (call function: (identifier) @outer_call))))
         (#match? @download "(?i)(download|fetch)")
         (#eq? @inner @inner_call) (#eq? @outer @outer_call) (#eq? @length "len"))
