defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  - id: python-private-alias-module-launch
    desc: Module scope calls privately aliased launcher
    if:
      type: tree-sitter
      language: python
      query: |
        (module
          (import_from_statement module_name: (dotted_name) @module
            name: (aliased_import name: (dotted_name) @primitive alias: (identifier) @alias))
          [(expression_statement (call function: (identifier) @callee))
           (try_statement body: (block (expression_statement (call function: (identifier) @callee))))]
          (#eq? @module "os") (#match? @primitive "^(system|popen|execl)$")
          (#match? @alias "^_") (#eq? @alias @callee))
        (module
          (import_from_statement module_name: (dotted_name) @module
            name: (aliased_import name: (dotted_name) @primitive alias: (identifier) @alias))
          [(expression_statement (call function: (identifier) @callee))
           (try_statement body: (block (expression_statement (call function: (identifier) @callee))))]
          (#eq? @module "subprocess") (#eq? @primitive "Popen")
          (#match? @alias "^_") (#eq? @alias @callee))
