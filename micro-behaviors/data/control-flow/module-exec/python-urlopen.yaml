# urlopen() as a module-body statement (bare or assigned) sends its request
# when the file is imported or run, before any caller chooses to invoke it.
# Calls inside function or class bodies are not module children and do not
# match.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-module-level-urlopen-call
    desc: Calls urlopen as a module-body statement
    conf: 0.92
    attack: T1071.001
    if:
      type: tree-sitter
      query: |
        (module
          (expression_statement
            [(call function: [(attribute attribute: (identifier) @fn) (identifier) @fn])
             (assignment right: (call function: [(attribute attribute: (identifier) @fn) (identifier) @fn]))]) @activation
          (#eq? @fn "urlopen"))
