# Python Module-Level Execution
# Detects bare function calls at module scope in Python files.
# Legitimate SDK/library modules define classes and functions but rarely
# execute bare function calls on import. Useful for differential analysis
# when comparing package versions for supply-chain compromise.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-bootstrap-relative-import
    desc: Imports a private bootstrap module
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'from . import _bootstrap'
  - id: python-bootstrap-native-loader-call
    desc: Calls a native bootstrap loader
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: _bootstrap.ensure_native_loaded
  - id: module-level-bare-call
    desc: Multiple bare function calls at module scope
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?m)^[A-Za-z_]\w+\(\)\s*(#[^\n]{0,160})?$'
    not:
      - substr: "if __name__"
      - regex: '\n(print|logging\.)\w*\('
    count_min: 2
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path

  - id: module-level-side-effect-call
    desc: Python module-level function call
    crit: notable
    conf: 0.82
    if:
      type: tree-sitter
      language: python
      # Anchor the expression to the module body.  A text regex also matches
      # calls nested inside methods after source normalization removes their
      # indentation.
      query: |
        (module
          (expression_statement
            (call) @call))
    # The captured call itself identifies these normal framework/runtime
    # initializers, so filter them here rather than suppressing the whole file.
    not:
      - substr: model_rebuild
      - substr: _initialize_dynamic_exceptions
      - substr: NullHandler(
      - substr: _utilities.register(
      - substr: warnings.warn
      - substr: qInitResources(
      - substr: qconfig.load
      - substr: define_winrt_com_method
      - substr: RoInitialize(
    unless:
      - id: metadata/lang/compiler/generated::pulumi-language-python-generated
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - type: basename
        regex: '(\.feature|\.rbi|\.rbs)$'
      # __main__.py is the CLI/module entrypoint; module-scope calls there are
      # intentional startup, not library import-time side effects.
      - type: basename
        exact: __main__.py
      # A unified diff is heuristically classified as Python when its hunks
      # contain Python syntax.  Its added calls are not module-scope calls in
      # the patch file itself, so do not infer import-time execution from it.
      - type: text
        regex: '(?m)^(---|\+\+\+) [^\r\n]+$|^@@ -[0-9]+(?:,[0-9]+)? \+[0-9]+(?:,[0-9]+)? @@'
      # Streamlit page modules intentionally execute their UI/bootstrap calls
      # on import; those calls are application entrypoint behavior rather than
      # evidence of a library supply-chain side effect.
      - type: text
        regex: '(?im)^\s*(?:import\s+streamlit\b|from\s+streamlit\b)'
      # cleave can heuristically classify Nix expressions as Python; calls in
      # a Nix module body are not Python import-time side effects.
      - type: basename
        regex: '\.nix$'
      # Bazel/Starlark files are parsed with the Python grammar, but their
      # top-level calls are declarative build-language forms rather than
      # Python import-time execution.
      - type: basename
        regex: '(?i)(\.(bzl|bazel)$|^(BUILD|WORKSPACE)(\.bazel)?$)'
      # Ghidra SLEIGH language specifications use call-like semantic actions.
      # They can parse with the Python grammar, but are not Python modules.
      - type: basename
        regex: '(?i)\.(sinc|slaspec)$'

  - id: guarded-module-level-side-effect-call
    desc: Import-time call under a platform guard
    crit: notable
    conf: 0.8
    # The same import-time execution as `module-level-side-effect-call`, one
    # level deeper. A payload that only wants to run on one operating system
    # wraps itself in `if sys.platform.startswith("linux"):`, and its calls
    # are then grandchildren of the module rather than children, so the query
    # above steps straight past them. The compromised guardrails-ai 0.10.1
    # wheel put its entire download-and-run chain inside exactly that guard.
    #
    # The capture is the whole `if`, so the `#match?` predicate can read the
    # condition, and the condition is required to be a platform test. Note
    # that a trait-level `not:` would not work here: the engine ignores it for
    # a tree-sitter matcher that supplies a `query:`, and so are `substr:` and
    # `regex:`. An in-query predicate is the filter that actually runs.
    #
    # Requiring a platform test is also the point on its own merits: the
    # guards which do NOT mean import-time execution -- the `__main__`
    # entrypoint check, a `TYPE_CHECKING` block, a version shim -- cannot
    # match, and what remains is the shape that gates a payload to one target
    # operating system so it stays inert in an analyst's sandbox.
    if:
      type: tree-sitter
      language: python
      query: |
        (module
          (if_statement
            consequence: (block
              (expression_statement (call)))) @guard
          (#match? @guard "^if[^:\\n]*(sys\\.platform|os\\.name|platform\\.system)"))

  - id: module-level-raise
    desc: Python module aborts during import
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      # Restrict the raise to a direct child of the module. Raises inside a
      # function are ordinary error handling; this shape executes on import.
      query: |
        (module
          (raise_statement) @raise)

  - id: try-wrapped-module-call
    desc: Import-time call silenced by try/except
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?m)^try:\s*\n\s{4}[A-Za-z_]\w+\(\)\s*\n^except'

composite_rules:
  - id: python-import-time-native-bootstrap
    desc: Import-time native bootstrap call
    crit: notable
    conf: 0.95
    near_lines: 12
    all:
      - id: python-bootstrap-relative-import
      - id: python-bootstrap-native-loader-call

  - id: module-level-execution
    desc: Code runs when the module is imported
    crit: notable
    conf: 0.85
    # Either shape of import-time execution. Rules that care about "this runs
    # on import" should require this rather than the bare-call atom, so a
    # platform-gated payload is not invisible to them.
    any:
      - id: module-level-side-effect-call
      - id: guarded-module-level-side-effect-call
