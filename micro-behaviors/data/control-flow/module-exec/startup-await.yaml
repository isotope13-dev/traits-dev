defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: startup-awaits-configured-helper
    size_max: 262144
    desc: Startup routine awaits helper with options
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        (program
          (function_declaration
            name: (identifier) @routine
            body: (statement_block
              (try_statement body: (statement_block
                (lexical_declaration (variable_declarator
                  value: (await_expression (call_expression
                    arguments: (arguments (_) (_) (object))) @probe)))))))
          (expression_statement (call_expression
            function: (identifier) @invoked
            arguments: (arguments) @args))
          (#eq? @routine @invoked)
          (#eq? @args "()"))
