defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 2097152
traits:
  - id: browser-init-iife-followed-by-cookie-fetch
    desc: DOM-ready IIFE precedes cookie-fetch postlude
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (expression_statement (call_expression
            function: (parenthesized_expression (arrow_function
              body: (statement_block
                (expression_statement (call_expression
                  function: (member_expression object: (identifier) @document
                    property: (property_identifier) @listen)
                  arguments: (arguments (string) @event (identifier))))
                .)))))
          .
          (expression_statement (call_expression
            function: (identifier) @fetch
            arguments: (arguments (binary_expression
              right: (member_expression object: (identifier) @cookie_document
                property: (property_identifier) @cookie) @evidence)))))
          (#eq? @document "document")
          (#eq? @listen "addEventListener")
          (#match? @event "^['\"]DOMContentLoaded['\"]$")
          (#eq? @fetch "fetch")
          (#eq? @cookie_document "document")
          (#eq? @cookie "cookie")
          (#set! cleave.ignore-comments "true"))
