# A script that declares a function and then calls it from module scope runs
# that function's body as soon as the file is evaluated -- by `node file.js`,
# a lifecycle hook, or a `require`. Neutral on its own: CLIs do this with
# `main()`. It lets composites say that code inside the declared function
# executes at load instead of only when a caller invokes the export.
#
# Limited to short scripts (8 KiB): the sibling-pattern query is quadratic in
# top-level statements, and in a bundle the pairing says little about which
# code the call reaches.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: module-scope-calls-declared-function
    desc: Module scope calls a function it declares
    crit: baseline
    conf: 0.9
    size_max: 8191
    if:
      type: tree-sitter
      query: |
        (program
          [(function_declaration name: (identifier) @fn)
           (lexical_declaration
             (variable_declarator
               name: (identifier) @fn
               value: [(arrow_function) (function_expression)]))]
          (expression_statement
            [(call_expression function: (identifier) @call)
             (await_expression (call_expression function: (identifier) @call))
             (call_expression
               function: (member_expression
                 object: (call_expression function: (identifier) @call)))
             (call_expression
               function: (member_expression
                 object: (call_expression
                   function: (member_expression
                     object: (call_expression function: (identifier) @call)))))]) @evidence
          (#eq? @fn @call))
