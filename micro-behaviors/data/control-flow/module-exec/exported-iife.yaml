defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: commonjs-function-export-followed-by-iife
    desc: Exported function precedes module-level IIFE
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @module
              property: (property_identifier) @exports)
            right: (function_expression)))
          (expression_statement (call_expression
            function: (parenthesized_expression
              (function_expression "function" @evidence)))))
          (#eq? @module "module")
          (#eq? @exports "exports"))
