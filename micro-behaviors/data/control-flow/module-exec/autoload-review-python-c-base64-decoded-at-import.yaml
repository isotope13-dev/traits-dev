defaults:
  platforms:
    - unix
    - windows
  for:
    - python

composite_rules:
  - id: python-c-base64-decoded-at-import
    desc: Import-time Python command and Base64 clues
    crit: suspicious
    conf: 0.96
    near_lines: 12
    all:
      - id: metadata/lang/source/literal/array::python-variable-minus-c-argument-array
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
