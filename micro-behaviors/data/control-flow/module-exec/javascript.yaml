# JavaScript Module-Level Execution
# Detects async IIFE patterns that execute on module import. Common in
# both legitimate startup code (extensions, CLIs) and hidden-side-effect
# trojans, so this is a neutral capability — composites in objectives/
# combine it with empty-export or obfuscation signals to infer intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-empty-export-default
    desc: JavaScript module has an empty default export
    crit: component
    conf: 0.8
    if:
      type: text
      substr: "export default {}"
  - id: js-empty-module-exports
    desc: CommonJS module exports an empty object
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{\s*\}'
  - id: commonjs-module-exports-identifier
    desc: CommonJS module.exports set to an identifier
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(?m)^module\.exports\s*=\s*[A-Za-z_$][\w$]*\s*;?\s*$'
  - id: commonjs-module-reexport
    desc: CommonJS module re-exports required package
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'module\.exports\s*=\s*require\s*\(\s*["''][@\w./-]{1,100}["'']\s*\)'
  # Barrel index: `module.exports = { Foo: require('./foo') }` — aggregates real
  # local modules. Distinct from hollow stubs that export a plain object literal
  # with no requires (see metadata/package/quality/empty::tiny-commonjs-exports-object).
  - id: commonjs-require-barrel-exports
    desc: CommonJS exports object of relative require()s
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[\s\S]{0,200}require\s*\(\s*["'']\./'
  - id: commonjs-getplugin-factory-export
    desc: CommonJS exports a getPlugin factory
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[\s\S]{0,160}\bgetPlugin\b'
  - id: js-hoc-ensure-env-arrow
    desc: HOC ensure-env wrapper (arrow form)
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (function_declaration
          name: (identifier) @outer
          parameters: (formal_parameters
            (identifier) @param)
          body: (statement_block
            (return_statement
              (arrow_function)))
          (#match? @outer "^(ensure|guard|require|init|bootstrap|setup)_?(Env|env|Runtime|runtime|Setup|setup|Deps|deps)$")
          (#eq? @param "fn"))

  - id: js-hoc-ensure-env-classic
    desc: HOC ensure-env wrapper (classic form)
    crit: notable
    conf: 0.92
    unless:
      - type: path
        regex: '\.d\.ts$'
    if:
      type: tree-sitter
      query: |
        (function_declaration
          name: (identifier) @outer
          parameters: (formal_parameters
            (identifier) @param)
          body: (statement_block
            (return_statement
              (function_expression)))
          (#match? @outer "^(ensure|guard|require|init|bootstrap|setup)_?(Env|env|Runtime|runtime|Setup|setup|Deps|deps)$")
          (#eq? @param "fn"))

  - id: async-iife-invoke
    desc: Immediately invokes an async function
    crit: notable
    conf: 0.7
    if:
      type: tree-sitter
      # Match a call whose callee is a parenthesized async arrow function;
      # passing an async callback to another function is not an IIFE.
      query: |
        (call_expression
          function: (parenthesized_expression
            (arrow_function
              "async"
              parameters: (formal_parameters)
              body: (statement_block)) @iife))
    not:
      - substr: this.writeOperation = (async () =>
      - substr: builtin-plugins/tabby-
    unless:
      - type: text
        substr: '"version":3,"file":'
      - type: basename
        regex: ^(\.map|rimraf|run-(script-)?os|ipv6(grep)?)$
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: assigned-async-function-iife
    desc: Assigned async function auto-executes
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '=\s*async\s+function.{0,80}\)\s*\{[\s\S]{0,900}\}\s*\(\s*\)'
  - id: module-scope-string-function
    desc: Top-level non-require string call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^(const|let|var)\s+\w+\s*=\s*\w+\(\s*["''][A-Za-z][\w-]{1,32}["'']'
      # `require(...)` is the CommonJS import, not a dynamic string call — filter
      # those matches per-match (was an inline `(?!require)` lookahead the engine
      # could not compile).
      not:
        - regex: '=\s*require\s*\('
  - id: module-scope-zero-arg-call
    desc: Module scope assigns zero-argument call
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?m)^(const|let|var)\s+\w+\s*=\s*\w+\s*\(\s*\)'
  - id: direct-zero-arg-call
    desc: Invokes zero-argument function at module scope
    crit: notable
    conf: 0.86
    # Require 3+ char names: minified bundles emit `u();` / `a();` after `{`
    # on their own line, which is not module-scope side-effect execution.
    unless:
      - id: metadata/package/testing/
      - type: path
        regex: '(?i)(^|[\\/])min[\\/]|\\.min\\.js$'
    if:
      type: text
      regex: '(?m)^[A-Za-z_$][A-Za-z0-9_$]{2,}\s*\(\s*\)\s*;'
  # Import-time trigger with a magic numeric argument (e.g. uniqueString(64)).
  # Neutral capability — hostile composites pair it with decrypt/eval loaders.
  - id: direct-numeric-arg-call
    desc: Module-scope numeric-arg function call
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/package/testing/
      - type: path
        regex: '(?i)(^|[\\/])min[\\/]|\\.min\\.js$'
    if:
      type: text
      regex: '(?m)^[A-Za-z_$][A-Za-z0-9_$]{2,}\s*\(\s*\d{1,4}\s*\)\s*;?\s*$'
  - id: module-leading-promise-chain-call
    desc: Leading promise-chain call at module scope
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?m)^[A-Za-z_$][A-Za-z0-9_$]{2,}\s*\(\s*\)\s*\.(catch|then)\s*\('
  - id: js-trailing-iife-closure
    desc: JavaScript file ends with an IIFE
    crit: component
    conf: 0.85
    if:
      type: text
      # `$` anchors the end of each extracted text run, not the end of the
      # file, so this matched any *line* ending in `})();` — including an
      # async IIFE nested inside a message/event listener halfway down the
      # file. That handed a false "module end" to js-async-iife-import-hook
      # and, through it, a false import-time stager finding. Pin the match to
      # the file tail so the id keeps meaning what it says.
      regex: '\}\)\(\)\s*;?\s*$'
      offset_range: [-16, null]
  - id: js-synchronous-iife-start
    desc: Starts a synchronous function expression
    crit: component
    conf: 0.86
    # Import-time synchronous IIFEs are a real module-side-effect capability.
    # Keep this separate from async-iife-invoke: a synchronous bootstrap has
    # different syntax and is common in both startup code and npm trojans.
    if:
      type: text
      regex: '(?m)^\s*\(\s*function\s*\([^)]{0,80}\)\s*\{'
  - id: js-synchronous-iife-close
    desc: Calls a parenthesized function expression
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\}\s*\)\s*\(\s*\)'
composite_rules:
  - id: module-empty-export
    desc: JavaScript module exports an empty object
    crit: notable
    conf: 0.8
    any:
      - id: js-empty-export-default
      - id: js-empty-module-exports
    unless:
      # npm/node-semver internal/re.js initializes `module.exports = {}` then
      # fills token tables — not a hollow stub.
      - id: well-known/lib/development/npm-semver::npm-semver-context
  - id: module-side-effect-empty-export
    desc: Module auto-executes with an empty export
    crit: notable
    conf: 0.88
    all:
      - id: async-iife-invoke
    any:
      - id: js-empty-export-default
      - id: js-empty-module-exports
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/development/npm-semver::npm-semver-context

  - id: module-scope-string-registry-call
    desc: Module scope invokes string-selected function
    crit: notable
    conf: 0.92
    all:
      - id: module-scope-string-function
      - id: module-scope-zero-arg-call
    near_lines: 3
  - id: js-import-time-or-first-touch-init
    desc: JS import-time or first-touch initialization
    crit: notable
    conf: 0.92
    any:
      - id: js-async-iife-import-hook
      - id: js-hoc-ensure-env-arrow
      - id: js-hoc-ensure-env-classic
      - id: micro-behaviors/process/exit/terminate::js-process-on-exit-hook
      - id: micro-behaviors/os/module/load::js-side-effect-require
      - id: micro-behaviors/os/module/load::js-require-extensions-mutate
      - id: micro-behaviors/os/module/load::js-module-resolvefilename-override
  - id: js-import-time-network-call
    desc: Module import executes a network call
    crit: notable
    conf: 0.97
    near_bytes: 4096
    all:
      - id: js-import-time-or-first-touch-init
    any:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/options
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/spawn::detached-fork
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - id: metadata/package/testing/presence/harness/
    unless:
      - id: well-known/lib/network/node-edge/
      # Trace Viewer modules legitimately register a worker and fetch trace
      # resources during import; suppress the generic capability for that
      # stable generated bundle.
      - id: well-known/lib/platform/browser-automation::playwright-trace-viewer-bundle
  - id: js-async-iife-import-hook
    desc: Async IIFE executes at module end
    crit: notable
    conf: 0.9
    all:
      - id: async-iife-invoke
      - id: js-trailing-iife-closure
    near_bytes: 4096
  - id: js-synchronous-iife-invoke
    desc: Immediately invokes a synchronous function
    crit: notable
    conf: 0.86
    near_bytes: 2000
    all:
      - id: js-synchronous-iife-start
      - id: js-synchronous-iife-close
