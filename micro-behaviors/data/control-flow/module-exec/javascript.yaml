# JavaScript Module-Level Execution
# Detects async IIFE patterns that execute on module import. Common in
# both legitimate startup code (extensions, CLIs) and hidden-side-effect
# trojans, so this is a neutral capability — composites in objectives/
# combine it with empty-export or obfuscation signals to infer intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: unconditional-bootstrap-call
    desc: Unconditional module-level bootstrap call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^bootstrap\s*\(\s*\)\s*;'
    unless:
      - type: text
        regex: 'require\.main\s*===\s*module'
  - id: js-module-exports
    desc: Exports a JavaScript module through CommonJS
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '\b(module\.exports\s*=\s*(function|class|\{)|exports\.[A-Za-z_$][A-Za-z0-9_$]*\s*=)'

  - id: js-empty-export-default
    desc: JavaScript module has an empty default export
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: "export default {}"
  - id: commonjs-module-exports-identifier
    desc: CommonJS module.exports set to an identifier
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(?m)^module\.exports\s*=\s*[A-Za-z_$][\w$]*\s*;?\s*$'
  - id: commonjs-export-require-expression
    desc: CommonJS export expression starts with require
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'module\.exports\s*=\s*require\s*\(\s*["''][@\w./-]{1,100}["'']\s*\)'
  # Require the sole program statement, allowing only surrounding comments.
  # Line anchors also match re-exports nested in a Browserify bundle.
  - id: sole-require-passthrough-module
    desc: Module body is only a require pass-through
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ([
        (program . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough .)
        (program . (comment)+ . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough .)
        (program . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough . (comment)+ .)
        (program . (comment)+ . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough . (comment)+ .)
        ]
        (#eq? @module "module")
        (#eq? @exports "exports")
        (#eq? @require "require")
        (#match? @target "^[@\\w./-]{1,100}$"))

  # Relative `./lib` barrels re-export this package's own code. A hollow
  # remote loader re-exports a package name, which is what the URL dependency
  # installs.
  - id: sole-package-require-passthrough
    desc: Module body only re-exports a package
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ([
        (program . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough .)
        (program . (comment)+ . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough .)
        (program . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough . (comment)+ .)
        (program . (comment)+ . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough . (comment)+ .)
        ]
        (#eq? @module "module")
        (#eq? @exports "exports")
        (#eq? @require "require")
        (#match? @target "^[@\\w][^\\x27\\x22]{0,80}$"))

  # `require = require('esm')(module)` makes the entry a loader for an ES-module
  # source tree. The `module.exports = require('./lib/index.js')` line below it
  # re-exports the package's own build, so the file is not a hollow stub.
  - id: esm-loader-entry
    desc: Entry module installs the esm loader
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'require\s*=\s*require\(\s*[''"]esm[''"]\s*\)\(\s*module\s*\)'
  - id: js-bounded-stake-bankroll-parameter
    desc: Bounded stake helper reads bankroll parameter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'function\s+computeBoundedFraction\([^)]{0,220}\bbankroll\b'
  - id: commonjs-exports-compute-bounded-fraction
    desc: CommonJS exports computeBoundedFraction symbol
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{\s*computeBoundedFraction'
  - id: ts-relative-import-connection-pool
    desc: TypeScript imports local connection-pool module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'from\s+["'']\./connection-pool\.js["'']'
  - id: ts-relative-import-health-check
    desc: TypeScript imports local health-check module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'from\s+["'']\./health-check\.js["'']'
  # Barrel index: `module.exports = { Foo: require('./foo') }` — aggregates real
  # local modules. Distinct from hollow stubs that export a plain object literal
  # with no requires (see metadata/lang/source/syntax/assignment::small-commonjs-object-export).
  - id: commonjs-require-barrel-exports
    desc: CommonJS exports object of relative require()s
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[\s\S]{0,200}require\s*\(\s*["'']\./'
  - id: commonjs-getplugin-factory-export
    desc: CommonJS exports a getPlugin factory
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[\s\S]{0,160}\bgetPlugin\b'
  - id: js-hoc-ensure-env-arrow
    desc: HOC ensure-env wrapper (arrow form)
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (function_declaration
          name: (identifier) @outer
          parameters: (formal_parameters
            (identifier) @param)
          body: (statement_block
            (return_statement
              (arrow_function)))
          (#match? @outer "^(ensure|guard|require|init|bootstrap|setup)_?(Env|env|Runtime|runtime|Setup|setup|Deps|deps)$")
          (#eq? @param "fn"))

  - id: js-hoc-ensure-env-classic
    desc: HOC ensure-env wrapper (classic form)
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: tree-sitter
      query: |
        (function_declaration
          name: (identifier) @outer
          parameters: (formal_parameters
            (identifier) @param)
          body: (statement_block
            (return_statement
              (function_expression)))
          (#match? @outer "^(ensure|guard|require|init|bootstrap|setup)_?(Env|env|Runtime|runtime|Setup|setup|Deps|deps)$")
          (#eq? @param "fn"))

  - id: async-iife-invoke
    desc: Immediately invokes an async function
    crit: notable
    conf: 0.7
    if:
      type: tree-sitter
      # Match a call whose callee is a parenthesized async arrow function;
      # passing an async callback to another function is not an IIFE.
      query: |
        (call_expression
          function: (parenthesized_expression
            (arrow_function
              "async"
              parameters: (formal_parameters)
              body: (statement_block)) @iife))
    not:
      - substr: this.writeOperation = (async () =>
      - substr: builtin-plugins/tabby-
    unless:
      - type: text
        substr: '"version":3,"file":'
      - type: basename
        regex: ^(\.map|rimraf|run-(script-)?os|ipv6(grep)?)$
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: assigned-async-function-iife
    desc: Assigned async function auto-executes
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '=\s*async\s+function.{0,80}\)\s*\{[\s\S]{0,900}\}\s*\(\s*\)'
  - id: module-scope-string-function
    desc: Top-level identifier call with bare-word string
    crit: notable
    conf: 0.9
    # Use the structured call/flow view instead of a live AST query. This
    # preserves the top-level call and bare-word literal constraints while
    # avoiding repeated whole-tree query work in large bundles.
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*$'
      module_level: true
      arg:
        index: 0
        kind: string
        from:
          whole_value: '^[A-Za-z][A-Za-z0-9_-]{1,32}$'
    unless:
      - type: text
        regex: '\brequire\s*\('
  - id: module-scope-zero-arg-call
    desc: Module scope assigns zero-argument call
    crit: notable
    conf: 0.86
    # Kusto queries are sometimes sniffed as JavaScript. A pipe summarize
    # such as `TotalSignIns = count()` then parses as a module-scope call.
    unless:
      - type: text
        regex: '(?m)^\|\s*(where|project|summarize)\b'
    if:
      type: tree-sitter
      query: |
        (program
          [(variable_declaration
             (variable_declarator value: (call_expression
               function: (identifier) arguments: (arguments) @args)))
           (lexical_declaration
             (variable_declarator value: (call_expression
               function: (identifier) arguments: (arguments) @args)))]
          (#eq? @args "()"))
  - id: direct-zero-arg-call
    desc: Invokes zero-argument function at module scope
    crit: notable
    conf: 0.86
    # Require 3+ char names: minified bundles emit `u();` / `a();` after `{`
    # on their own line, which is not module-scope side-effect execution.
    unless:
      - id: metadata/package/testing/
      - type: path
        regex: '(?i)(^|[\\/])min[\\/]|\\.min\\.js$'
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '(?m)^[A-Za-z_$][A-Za-z0-9_$]{2,}\s*\(\s*\)\s*;'
  # Import-time trigger with a magic numeric argument (e.g. uniqueString(64)).
  # Neutral capability — hostile composites pair it with decrypt/eval loaders.
  - id: direct-numeric-arg-call
    desc: Module-scope numeric-arg function call
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/package/testing/
      - type: path
        regex: '(?i)(^|[\\/])min[\\/]|\\.min\\.js$'
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '(?m)^[A-Za-z_$][A-Za-z0-9_$]{2,}\s*\(\s*\d{1,4}\s*\)\s*;?\s*$'
  - id: module-leading-promise-chain-call
    desc: Leading promise-chain call at module scope
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?m)^[A-Za-z_$][A-Za-z0-9_$]{2,}\s*\(\s*\)\s*\.(catch|then)\s*\('
    # README usage examples sniff as JavaScript; a doc snippet is not module code.
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: js-trailing-iife-closure
    desc: JavaScript file ends with an IIFE
    crit: baseline
    conf: 0.85
    if:
      type: text
      # `$` anchors the end of each extracted text run, not the end of the
      # file, so this matched any *line* ending in `})();` — including an
      # async IIFE nested inside a message/event listener halfway down the
      # file. That handed a false "module end" to js-async-iife-import-hook
      # and, through it, a false import-time stager finding. Pin the match to
      # the file tail so the id keeps meaning what it says.
      regex: '\}\)\(\)\s*;?\s*$'
      offset_range: [-16, null]
  - id: js-synchronous-iife-start
    desc: Starts a synchronous function expression
    crit: baseline
    conf: 0.86
    # Import-time synchronous IIFEs are a real module-side-effect capability.
    # Keep this separate from async-iife-invoke: a synchronous bootstrap has
    # different syntax and is common in both startup code and npm trojans.
    if:
      type: text
      regex: '(?m)^\s*\(\s*function\s*\([^)]{0,80}\)\s*\{'
  - id: js-synchronous-iife-close
    desc: Calls a parenthesized function expression
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '\}\s*\)\s*\(\s*\)'
composite_rules:
  - id: module-empty-export
    desc: JavaScript module exports an empty object
    crit: notable
    conf: 0.8
    any:
      - id: js-empty-export-default
      - id: metadata/lang/source/syntax/assignment::commonjs-empty-object-export
    unless:
      # npm/node-semver internal/re.js initializes `module.exports = {}` then
      # fills token tables — not a hollow stub.
      - id: well-known/lib/development/npm-semver::npm-semver-context
  - id: module-side-effect-empty-export
    desc: Module auto-executes with an empty export
    crit: notable
    conf: 0.88
    all:
      - id: async-iife-invoke
    any:
      - id: js-empty-export-default
      - id: metadata/lang/source/syntax/assignment::commonjs-empty-object-export
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/development/npm-semver::npm-semver-context

  - id: module-scope-string-registry-call
    desc: Module scope invokes string-selected function
    crit: notable
    conf: 0.92
    all:
      - id: module-scope-string-function
      - id: module-scope-zero-arg-call
    near_lines: 3
  - id: js-import-time-or-first-touch-init
    desc: JS import-time or first-touch initialization
    crit: notable
    conf: 0.92
    any:
      - id: js-async-iife-import-hook
      - id: js-hoc-ensure-env-arrow
      - id: js-hoc-ensure-env-classic
      - id: micro-behaviors/process/exit/handler::js-process-on-exit-hook
      - id: micro-behaviors/os/module/require::js-side-effect-require
      - id: micro-behaviors/os/module/require::js-require-extensions-mutate
      - id: micro-behaviors/os/module/require::js-module-resolvefilename-override
  - id: js-import-time-network-call
    desc: Module import executes a network call
    crit: notable
    conf: 0.97
    near_bytes: 4096
    all:
      - id: js-import-time-or-first-touch-init
    any:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/options
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/spawn::detached-fork
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - id: metadata/package/testing/presence/harness/
        - id: "metadata/file/naming::test-directory-component"
    unless:
      - id: well-known/lib/network/node-edge/
      # Trace Viewer modules legitimately register a worker and fetch trace
      # resources during import; suppress the generic capability for that
      # stable generated bundle.
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
  - id: js-async-iife-import-hook
    desc: Async IIFE executes at module end
    crit: notable
    conf: 0.9
    all:
      - id: async-iife-invoke
      - id: js-trailing-iife-closure
    near_bytes: 4096
  - id: js-synchronous-iife-invoke
    desc: Immediately invokes a synchronous function
    crit: baseline
    conf: 0.86
    near_bytes: 2000
    all:
      - id: js-synchronous-iife-start
      - id: js-synchronous-iife-close
