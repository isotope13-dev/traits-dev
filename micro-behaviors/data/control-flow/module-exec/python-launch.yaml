# Import-time process and thread launches. The call fact's module_level flag
# covers calls nested in module-scope `if`/`try`/`with` blocks, e.g.
# `if os.fork() == 0:` or an env-guarded `subprocess.Popen(...)`, which the
# tree-sitter module-exec atoms only see as direct module children. Calls
# inside functions, including `__main__`-dispatched entry points, are not
# module-level.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-module-level-fork
    desc: Forks at Python module top level
    conf: 0.95
    if:
      type: symbol
      kind: call
      module_level: true
      regex: ^os\.fork(pty)?$

  - id: python-module-level-os-spawn
    desc: os spawn call at module top level
    conf: 0.95
    if:
      type: symbol
      kind: call
      module_level: true
      regex: ^os\.(spawn[lv]p?e?|posix_spawnp?|startfile)$

  - id: python-module-level-thread
    desc: Creates a thread at module top level
    conf: 0.9
    if:
      type: symbol
      kind: call
      module_level: true
      regex: (^|\.)Thread$

composite_rules:
  - id: python-module-level-launch
    desc: Starts a process or thread on import
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: python-module-level-fork
      - id: python-module-level-os-spawn
      - id: python-module-level-thread
