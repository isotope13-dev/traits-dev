composite_rules:
- for:
  - python
  id: python-module-exec-exe-reference
  desc: Module exec and executable-name reference co-occur
  conf: 0.93
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::module-scope-exec-builtin
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  scope: file
- for:
  - tar
  - zip
  - whl
  - python
  id: python-archive-executable-module-exec-cooccurrence
  desc: Archive executable with module-exec/name context
  conf: 0.95
  scope: archive
  all:
  - id: metadata/build/archive::archive-windows-executable-entry
  - id: micro-behaviors/data/control-flow/module-exec::python-module-exec-exe-reference
defaults:
  platforms:
  - unix
  - windows
  crit: notable
