traits:
- conf: 0.9
  id: module-level-imported-method-call
  desc: Top-level method call on require result
  # Proven receiver origin and module-level scope exclude calls inside
  # component bodies and methods on unrelated siblings of an import.
  if:
    type: symbol
    kind: call
    regex: '\.[A-Za-z_$][\w$]*$'
    module_level: true
    receiver:
      from:
        call: '^require$'
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
