defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: js-sole-empty-commonjs-export
    desc: Entry exports an empty CommonJS object
    size_max: 120
    if:
      type: text
      regex: '^\s*(//[^\r\n]{0,120}\r?\n\s*)?module\.exports\s*=\s*\{\s*\}\s*;?\s*$'
