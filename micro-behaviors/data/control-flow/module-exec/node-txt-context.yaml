# Import-time initialization can coexist with the TXT/decode/write/launch
# cluster without being the call site that executes it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-import-time-txt-stage-profile
    desc: Node import-time and TXT stage clues
    crit: suspicious
    conf: 0.995
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-import-time-or-first-touch-init
      - id: micro-behaviors/communications/dns/txt::node-txt-decode-write-detached-spawn-profile
