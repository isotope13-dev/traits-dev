defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-assert-options-api
    desc: Configures PHP assertion behavior
    if:
      type: symbol
      kind: call
      exact: assert_options
