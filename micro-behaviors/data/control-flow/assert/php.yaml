defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-assert-call
    desc: PHP assertion function call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: assert
  - id: php-assert-dynamic-payload
    desc: PHP assert receives dynamic payload
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: [(name) @fn (qualified_name (name) @fn)]
          arguments: (arguments .
            (argument
              [(variable_name)
               (subscript_expression)
               (binary_expression operator: ["^" "."])
               (parenthesized_expression (binary_expression operator: ["^" "."]))
               (function_call_expression
                 function: [(name) @inner (qualified_name (name) @inner)]
                 (#not-match? @inner "(?i)^(is_[a-z_]+|in_array|array_key_exists|preg_match|str(i?pos|_(starts|ends)_with|_contains)|defined|(function|class|interface|trait|method|property|file)_exists|count|strlen|version_compare)$"))]))) @assert_call
          (#match? @fn "(?i)^assert$"))
