defaults:
  platforms: [windows, unix]
  for: [php]

traits:
- id: php-assert-get-post-prefix
  desc: PHP assert text begins with GET/POST
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'assert\s*\(\s*\$_(GET|POST)\b'
- id: php-assert-request-cookie-prefix
  desc: PHP assert text begins with REQUEST/COOKIE
  crit: notable
  conf: 0.92
  if:
    type: text
    # A prefix can precede a predicate or occur in quoted code. Only the
    # structural argument observation supports legacy string evaluation.
    regex: 'assert\s*\(\s*\$_(REQUEST|COOKIE)\b'
- id: php-assert-request-subscript-text
  desc: PHP assert text starts with request subscript
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'assert\s*\(\s*\$_(POST|GET|REQUEST)\s*\['

