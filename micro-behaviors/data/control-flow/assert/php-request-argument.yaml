defaults:
  platforms: [unix, windows]
  for: [php, text]

traits:
  # Call facts classify PHP subscripts only as opaque expressions. Nearby
  # request reads cannot distinguish assertions of booleans from raw strings.
  # Match the complete first argument; a diagnostic second argument is allowed.
  - id: php-assert-direct-request-input
    desc: PHP assert directly receives request input
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: [(name) @sink (qualified_name) @sink]
          arguments: (arguments . (argument
            [(subscript_expression (variable_name (name) @source))
             (parenthesized_expression
               (subscript_expression (variable_name (name) @source)))
             (error_suppression_expression
               (subscript_expression (variable_name (name) @source)))])))
          (#match? @sink "(?i)^\\\\?assert$")
          (#any-of? @source "_GET" "_POST" "_REQUEST" "_COOKIE"))
        ((function_call_expression
          function: [(name) @sink (qualified_name) @sink]
          arguments: (arguments . (argument
            [(subscript_expression (variable_name) @server
               [(string) (encapsed_string)] @header)
             (error_suppression_expression
               (subscript_expression (variable_name) @server
                 [(string) (encapsed_string)] @header))])))
          (#match? @sink "(?i)^\\\\?assert$")
          (#eq? @server "$_SERVER")
          (#match? @header "^['\"]HTTP_"))
        ((function_call_expression
          function: [(name) @sink (qualified_name) @sink]
          arguments: (arguments . (argument
            [(function_call_expression function: (name) @source)
             (error_suppression_expression
               (function_call_expression function: (name) @source))])))
          (#match? @sink "(?i)^\\\\?assert$")
          (#eq? @source "wp_get_referer"))
