traits:
- id: js-password-literal-true-return
  desc: Password literal followed by a true return
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '["'']password["''][^;\n]{0,40}\breturn\s*(!0|true)\b'
  unless:
  - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-package-context
  - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-monorepo-package-name
  - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-database-runtime-marker
  - id: metadata/import/npm/stacksjs/query-builder::stacksjs/query-builder
  - type: text
    substr: hashMake
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
