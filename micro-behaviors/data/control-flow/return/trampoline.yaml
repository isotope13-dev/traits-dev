defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Stack return-overwrite fallthrough trampoline: loads the next instruction address
  # onto the stack and executes ret, concealing control-flow continuity from static disassemblers.
  - id: stack-ret-fallthrough-trampoline-x64
    desc: Repeated x64 stack return-overwrite trampolines
    crit: notable
    conf: 0.98
    arch: [x86-64]
    count_min: 10
    if:
      type: hex
      section: .text
      pattern: '48 8D 05 05 00 00 00 48 89 04 24 C3'
