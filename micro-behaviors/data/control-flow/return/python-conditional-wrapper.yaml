defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-conditional-call-or-one
    desc: Returns call result or integer one
    if:
      type: text
      regex: '(?m)^\s*return\s+\w+\([^\n]{1,40}\)\s+if\s+\w+\([^\n]{1,30}\)\s+else\s+1\b'
  - id: python-conditional-call-or-dict
    desc: Returns call result or dictionary
    if:
      type: text
      regex: '(?m)^\s*return\s+\w+\([^\n]{1,40}\)\s+if\s+\w+\([^\n]{1,30}\)\s+else\s+dict\('
  - id: python-conditional-call-or-noop
    desc: Returns call result or no-op
    if:
      type: text
      regex: '(?m)^\s*return\s+\w+\([^\n]{1,40}\)\s+if\s+\w+\([^\n]{1,30}\)\s+else\s+\(\(lambda:\s*None'
