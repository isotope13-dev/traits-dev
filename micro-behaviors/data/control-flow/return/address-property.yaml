defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: returns-address-property
    desc: Returns an object address property
    crit: notable
    conf: 0.86
    not:
      - regex: 'return\s+this\.address\s*[;,}]'
      - substr: Address.simpleGroup(
    unless:
      - type: text
        substr: _srv.address()
    if:
      type: text
      regex: 'return\s+[\w.$\[\]]{1,40}\.address\s*[;,}]'

