# Returning a dynamically selected runner is control flow, not code evaluation.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-delegates-to-loaded-module-run
    desc: Returns profile runner on loaded module
    if:
      type: text
      regex: 'return\s+\w+\.run\(\s*profile\s*='
