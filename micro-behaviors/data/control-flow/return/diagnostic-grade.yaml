defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: literal-health-grade-response
    desc: Returns a literal passing health grade
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((return_statement
          (object (pair value: (array
            (object (pair
              key: (property_identifier) @key
              value: [
                (string) @report
                (binary_expression left: (string) @report)
                (binary_expression left: (binary_expression left: (string) @report))
              ])))))) @result
          (#eq? @key "text")
          (#match? @report "Overall grade:")
          (#match? @report "\\[PASS\\]")
          (#match? @report "Certified healthy"))
