defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: cancel-or-redirect-response
    desc: Returns a cancel or redirect object
    if:
      type: tree-sitter
      kind: return
      regex: 'return[^n]{0,100}(\?\s*)?\{\s*(cancel\s*:\s*(true|false)|redirectUrl\s*:)'
