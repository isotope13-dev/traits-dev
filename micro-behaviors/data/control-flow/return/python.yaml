# Neutral Python return-statement shapes.
#
# `python-return-none` was previously `python-manifest-returns-none` in
# objectives/supply-chain/hidden-payload/runtime/, matching a bare
# `return None` while describing itself as "Returns no manifest digest". Since
# that is one of the most common statements in the language, every Python file
# containing it collected supply-chain hidden-payload evidence. The wheel
# bootstrap composite that uses it keeps its meaning from the two family-unique
# legs it sits next to (`python-native-manifest.json`, `except BootstrapError`)
# plus its near_lines proximity, so this only needed an honest name and home.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-return-none
    desc: Python return None statement
    crit: baseline
    conf: 0.94
    if:
      type: text
      substr: return None
