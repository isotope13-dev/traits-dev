traits:
- id: x86-call-pop-mmx-pointer-handoff
  desc: MMX pointer handoff near x86 entrypoint
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: yara
    source: "import \"pe\"\nrule x86_mmx_entry_handoff {\n strings:\n  $handoff = { 5A 0F 6E DA 0F 7E D9 [0-64] 81 C1 ?? ??\
      \ ?? ?? [0-24] 81 C1 ?? ?? ?? ?? [0-64] 51 [0-64] C3 }\n condition:\n  pe.is_32bit() and\n  for any s in (0..pe.number_of_sections-1)\
      \ : (\n   pe.sections[s].name == \".text\" and\n   for any h in (1..#handoff) : (\n    @handoff[h] >= pe.entry_point\
      \ and @handoff[h] <= pe.entry_point + 256 and\n    @handoff[h] >= pe.sections[s].raw_data_offset and\n    @handoff[h]\
      \ + !handoff[h] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size\n   )\n  )\n}"
