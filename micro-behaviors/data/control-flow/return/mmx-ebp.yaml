defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-pop-mmx-ebp-pointer-handoff
    desc: MMX pointer handoff to EBP return target
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '5B 0F 6E EB 0F 7E ED [0-32] 81 C5 ?? ?? ?? ?? [0-24] 81 ED ?? ?? ?? ?? [0-40] 55 [0-80] C3'
