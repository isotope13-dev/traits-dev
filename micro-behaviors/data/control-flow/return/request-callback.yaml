# Parameter names establish a callback shape, not an HTTP protocol.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: returns-request-response-next-callback
    desc: Returns a request-response-next callback
    if:
      type: tree-sitter
      kind: return
      regex: '^return\s*\(\s*_?req\w*\s*,\s*_?res\w*\s*,\s*_?next\w*\s*\)\s*=>'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
