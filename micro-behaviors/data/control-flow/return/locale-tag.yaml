defaults:
  platforms: [windows]
  for: [powershell, csharp, vbs, batch]
traits:
  - id: locale-region-tag-early-return
    desc: Locale-region tag followed by return or exit
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''][a-z]{2}-[A-Z]{2}["''][^;\r\n]{0,64}\b([Rr]eturn|[Ee]xit)\b'
