defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.92

traits:
  - id: explicit-telemetry-consent-gate
    crit: notable
    desc: Returns early unless consent is true
    conf: 0.94
    if:
      type: text
      regex: 'if\s+\w*consent\(\)\s+is\s+not\s+True\s*:\s*\n\s*return\b'

