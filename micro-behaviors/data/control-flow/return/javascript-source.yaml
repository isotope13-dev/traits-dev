defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: js-arrow-returns-process-global
  desc: Arrow returns Node.js process global
  crit: notable
  conf: 0.95
  attack: T1059.007
  if:
    type: tree-sitter
    language: javascript
    query: |
      (arrow_function
        body: (identifier) @body
        (#eq? @body "process"))
- id: variable-wrapped-string-return-cluster
  size_max: 128000
  desc: Functions return local string variables
  crit: notable
  conf: 0.8
  count_min: 5
  if:
    type: tree-sitter
    # The #match? on "function" never rejects; it lets cleave root the query
    # at declarations instead of walking every JS file.
    query: |
      ((function_declaration
        (statement_block
          (variable_declaration
            (variable_declarator
              name: (identifier) @var
              value: (string)
            )
          )
          (return_statement
            (identifier) @ret
          )
        )
      ) @decl
        (#eq? @var @ret)
        (#match? @decl "function"))
- id: js-function-return-string
  desc: func returning a (fragmentation)
  crit: baseline
  if:
    type: metrics
    field: ast.string_return_function_count
    min: 10
- id: js-function-return-string-dense
  desc: Many JavaScript functions return string literals
  crit: notable
  if:
    type: metrics
    field: ast.string_return_function_count
    min: 30
  unless:
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
- id: constant-only-iife-string-return
  desc: IIFE only returns a string literal
  crit: baseline
  conf: 0.9
  size_max: 128000
  count_min: 10
  # A constant-only wrapper is distinct from a factory that performs useful
  # initialization. Anchor its body rather than searching every descendant.
  # Every function_expression spans the `function` keyword, so the #match?
  # never rejects a match; it gives cleave a literal to root the query at
  # instead of walking the whole tree of every JavaScript file.
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (function_expression
          body: (statement_block .
            (return_statement
              (string) @evidence
            )
            .
          )
        ) @fn
      )
       (#match? @fn "function")
       (#set! cleave.ignore-comments "true"))
