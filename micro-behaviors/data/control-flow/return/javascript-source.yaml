defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: js-arrow-returns-process-global
  desc: Arrow returns Node.js process global
  crit: notable
  conf: 0.95
  attack: T1059.007
  if:
    type: tree-sitter
    language: javascript
    query: |
      (arrow_function
        body: (identifier) @body
        (#eq? @body "process"))
- id: variable-wrapped-string-return-cluster
  desc: Functions return local string variables
  crit: notable
  conf: 0.8
  count_min: 5
  unless:
  - id: metadata/build
  if:
    type: tree-sitter
    query: |
      (function_declaration
        (statement_block
          (variable_declaration
            (variable_declarator
              name: (identifier) @var
              value: (string)
            )
          )
          (return_statement
            (identifier) @ret
          )
        )
        (#eq? @var @ret)
      )
- id: js-function-return-string
  desc: func returning a (fragmentation)
  crit: baseline
  if:
    type: metrics
    field: ast.string_return_function_count
    min: 10
- id: js-function-return-string-dense
  desc: Many JavaScript functions return string literals
  crit: notable
  if:
    type: metrics
    field: ast.string_return_function_count
    min: 30
  unless:
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
- id: iife-string-literal-return
  desc: IIFE returns a string literal
  crit: baseline
  conf: 0.9
  size_max: 500000
  count_min: 10
  if:
    type: tree-sitter
    query: |
      (call_expression
        function: (function_expression
          body: (statement_block
            (return_statement
              (string) @string_literal
            )
          )
        )
      )
