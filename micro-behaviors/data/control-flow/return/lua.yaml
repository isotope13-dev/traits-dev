defaults:
  platforms: [unix, windows]
traits:
  - id: lua-return-vararg-wrapper
    desc: Lua top-level return wraps a vararg function
    crit: notable
    conf: 0.94
    # A payload can be mislabeled with a non-Lua extension and be classified
    # by content heuristics as another source type.  This matcher is still
    # keyed to Lua syntax, so accepting C keeps the trait's identity honest.
    for: [lua, javascript, text, c]
    size_min: 50000
    if:
      type: text
      # Protector builds do not all place the second dispatcher function in
      # the first 512 bytes. The invariant is the top-level vararg closure;
      # size_min and the permutation atom in the composite supply density.
      regex: '^return\(function\(\.\.\.\)'

