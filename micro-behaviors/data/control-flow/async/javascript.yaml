defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A bare `resolve(...)` call is the universal Promise-executor pattern
  # (`new Promise((resolve, reject) => ...)`) present in essentially every
  # async JS/TS file; it says nothing about what is being resolved. Formerly
  # filed under objectives/command-and-control/dropper/delivery/blockchain
  # as "Source resolves blockchain payload data" -- the matcher never checked
  # for blockchain content, so it fired on ordinary Promise plumbing anywhere
  # in the file. Attack-specific composites still reference this atom
  # cross-directory alongside the legs that actually carry the intent
  # (payload-source wording, eval, detached spawn).
  - id: promise-resolve-call
    desc: Promise executor calls resolve
    crit: baseline
    conf: 0.6
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '\bresolve\s*\('
