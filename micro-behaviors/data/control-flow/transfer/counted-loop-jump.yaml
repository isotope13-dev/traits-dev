defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
  size_max: 52428800
traits:
  - id: x86-counted-loop-jmp-eax
    desc: x86 counted loop then indirect jump
    crit: notable
    conf: 0.96
    arch: [x86]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      # INC EAX; CMP EAX, imm32; JB rel8; MOV EAX, imm32; JMP EAX.
      # This sequence does not itself establish what the loop did.
      pattern: '40 3D ?? ?? ?? ?? 72 ?? B8 ?? ?? ?? ?? FF E0'

