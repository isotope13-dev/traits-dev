traits:
- id: go-byte-channel-send
  desc: Go channel sends a byte conversion
  conf: 0.9
  if:
    type: text
    regex: \w+\s*<-\s*byte\s*\(\s*\w+\s*\)
composite_rules:
- id: go-byte-range-loop-and-channel-send
  desc: Byte-range loop near Go channel byte send
  conf: 0.95
  all:
  - id: micro-behaviors/data/control-flow/loop::go-full-byte-search-loop
  - id: micro-behaviors/data/control-flow/transfer::go-byte-channel-send
  near_bytes: 512
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  crit: notable
