defaults:
  platforms:
  - windows
  for:
  - batch
  crit: baseline
  conf: 0.85

traits:
  - id: batch-goto-branch
    desc: Batch script branches with GOTO
    if:
      type: text
      regex: '(?im)^\s*goto\s+[^\s:\r\n]{1,32}\b'

  # Relocated from objectives/impact/degrade/system/desktop/batch-nuisance,
  # where it was `batch-goto-short-label` at suspicious. A one-character
  # label is a narrower case of the GOTO above, not an impact behaviour:
  # Ghostscript's own base/cp.bat and lib/ps2ascii.bat use it, and ghostpdl
  # scored suspicious three times for it. The nuisance composite that needs
  # it references it from here and supplies the intent.
  - id: batch-goto-single-letter-label
    desc: Batch GOTO targets a one-letter label
    conf: 0.86
    if:
      type: text
      regex: '(?im)^\s*goto\s+[A-Za-z]\b'
