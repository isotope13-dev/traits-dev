# An oversized WebAssembly `br_table` target vector, matched on the binary
# encoding: opcode 0x0E, then the target count as an unsigned LEB128, then
# that many label indices. In a canonical LEB128 the count's third byte
# holds bits 14 and up, so a third byte of 0x04+ means at least 65536
# targets; a continuation byte there means an even larger (or padded)
# count. The trailing run requires the label vector itself to be present
# as single-byte label indices (nesting depth below 128, as in generated
# multi-way branches); multi-byte label indices are not covered. The count
# is a neutral control-transfer fact; 65536 exceeds the 65520-target limit
# that Wasmtime, V8 and SpiderMonkey enforce, and exploit composites in
# objectives add that intent.
defaults:
  platforms: [windows, unix]
  for: [wasm]
  crit: notable
  conf: 0.95

traits:
  - id: wasm-br-table-at-least-65536-targets
    desc: Wasm br_table declares 65536+ targets
    if:
      type: raw
      regex: '(?-u)\x0e[\x80-\xff][\x80-\xff][\x04-\xff][\x80-\xff]{0,2}[\x00-\x7f]{4096}'
