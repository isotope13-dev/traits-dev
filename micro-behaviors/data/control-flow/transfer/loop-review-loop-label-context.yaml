defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - java
  - javascript
  - go
  - php
  - shell

composite_rules:
  - id: batch-goto-loop
    desc: Batch GOTO loop label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: metadata/lang/source/naming/declaration::batch-label-loop
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-loop-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-repeat-loop
    desc: Batch GOTO repeat label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: metadata/lang/source/naming/declaration::batch-label-repeat
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-repeat-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-retry-loop
    desc: Batch GOTO retry label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: metadata/lang/source/naming/declaration::batch-label-retry
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-retry-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-again-loop
    desc: Batch GOTO again label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: metadata/lang/source/naming/declaration::batch-label-again
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-again-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-chaos-loop
    desc: Batch GOTO chaos loop label
    crit: notable
    conf: 0.86
    for: [batch]
    all:
      - id: metadata/lang/source/naming/declaration::batch-label-chaos
      - id: micro-behaviors/data/control-flow/transfer::batch-goto-chaos-command
    near_lines: 80
