defaults:
  platforms:
  - unix
  crit: notable
  conf: 0.95
traits:
- id: x64-rebased-entry-jump
  desc: Contains rebasing code and indirect jump
  for:
  - elf
  - data
  if:
    type: hex
    # Entry stubs may restore saved registers between rebasing and jumping.
    # Do not cap the file offset: appended code can follow a large host.
    pattern: 48 8D 0D ?? ?? ?? ?? 48 2B 0D ?? ?? ?? ?? 48 03 0D ?? ?? ?? ?? [0-16] FF E1
    offset_range: [0, null]
- id: c-array-rip-relative-subtract
  desc: C byte array contains RIP-relative subtraction
  for:
  - c
  - cpp
  crit: component
  if:
    type: text
    regex: (?i)0x48,\s*0x2b,\s*0x0d,(\s*0x[\da-f]{2},){4}
- id: c-array-rip-add-indirect-jump
  desc: C array adds RIP-relative data then jumps
  for:
  - c
  - cpp
  if:
    type: text
    regex: (?i)0x48,\s*0x03,\s*0x0d,(\s*0x[\da-f]{2},){4}\s*0xff,\s*0xe1
composite_rules:
- id: c-array-rebased-entry-jump
  desc: C array contains a saved-entry rebasing jump
  for:
  - c
  - cpp
  near_bytes: 160
  all:
  - id: c-array-rip-relative-subtract
  - id: c-array-rip-add-indirect-jump
