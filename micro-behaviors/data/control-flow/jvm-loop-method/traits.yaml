# JVM method names such as repeat/retry are ordinary control-flow building
# blocks. Keep them neutral; model-directed UI conclusions require the
# surrounding model/UI evidence in the objective rule.
defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin]

traits:
  - id: jvm-keepalive-method-call
    desc: JVM keepAlive method call
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: keepAlive

  - id: jvm-maintain-method-call
    desc: JVM maintain method call
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: maintain

  - id: jvm-retry-method-call
    desc: JVM retry method call
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: retry

  - id: jvm-repeat-method-call
    desc: JVM repeat method call
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: repeat

composite_rules:
  - id: jvm-loop-control-method-call
    desc: JVM loop-control method call
    crit: component
    conf: 0.8
    any:
      - id: jvm-keepalive-method-call
      - id: jvm-maintain-method-call
      - id: jvm-retry-method-call
      - id: jvm-repeat-method-call
