defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93

# These headers contain status-like words; they do not establish OAuth,
# polling, or even that the word is the loop's tested condition.
traits:
  - id: while-header-status-word
    desc: While header contains a completion-status word
    if:
      type: text
      regex: '(?i)\bwhile\s*\(.{0,120}\b(pending|approved|authorized|completed)\b.{0,120}\)'
  - id: for-header-status-word
    desc: For header contains a completion-status word
    if:
      type: text
      regex: '(?i)\bfor\s*\(.{0,60}\b(pending|approved|authorized|completed)\b.{0,60}\)'
composite_rules:
  - id: loop-header-status-word
    desc: Loop header contains a completion-status word
    any:
      - id: while-header-status-word
      - id: for-header-status-word
