# A for-of loop whose body issues a fetch: each URL of an iterated list is
# requested in turn. Feed readers and mirror-rotation loaders share the
# shape; what is iterated toward (mirror CDNs, feed URLs) is the consuming
# composite's context, not this atom's claim.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg]
  crit: notable
traits:
  - id: iterated-list-fetch-loop
    desc: Fetches each URL of an iterated list
    conf: 0.88
    if:
      type: text
      regex: 'for\s*\(\s*(const|let|var)\s+\w+\s+of\b[\s\S]{0,300}fetch\s*\('
