# Collection iteration headers (for/foreach over a collection, or
# forEach/map callbacks).  Neutral control-flow syntax; consumers bind
# the loop to specific body operations.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: baseline
  conf: 0.9

traits:
  - id: record-loop-header
    desc: For/foreach loop over a collection
    if:
      type: text
      regex: '(?i)\b(for|foreach)\s*\(?\s*(const\s+|let\s+|var\s+)?\$?\w+\s+(in|of)\b'

  - id: collection-callback-header
    desc: Collection forEach/map callback
    if:
      type: text
      regex: '\.(forEach|map)\s*\('
