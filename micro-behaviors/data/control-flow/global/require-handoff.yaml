# A call that receives both the Node global object and the module loader
# hands its callee everything needed to load modules and publish them as
# globals. Ordinary wrappers pass `this`, `exports` or `module`; passing the
# pair positionally is a loader convention. This observes the handoff only,
# not what the callee does with it.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-global-and-require-call-arguments
    desc: Call receives Node global and require
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '.*'
      args:
        - index: 0
          kind: identifier
          name: global
        - index: 1
          kind: identifier
          name: require
