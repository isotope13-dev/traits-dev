# JavaScript global namespace references are common in runtimes, bundlers, and
# extension integrations.  The namespace shape is useful context, but is not
# supply-chain intent by itself.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-runtime-global-handler-exposure
    desc: Exposes runtime handlers through globalThis
    conf: 0.92
    if:
      type: text
      regex: 'globalThis\s*\[\s*["''](register|sleep)["'']\s*\]\s*='

  - id: global-namespace-dunder-reference
    desc: JavaScript global namespace dunder reference
    conf: 0.75
    if:
      type: symbol
      regex: '^global(This)?\\.__[a-z_]+'

  # Text form of the tree-sitter globalThis dispatch in
  # data/control-flow/dispatch, for HTML files whose embedded scripts
  # that query cannot reach. The callee must be globalThis itself; an
  # ordinary receiver such as `handlers[action](...)` or the string-table
  # rotation `a['push'](...)` is a different fact.
  - id: globalthis-bracket-call
    desc: Calls a computed globalThis property
    conf: 0.88
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bglobalThis\s*\[[^\]\n]{1,80}\]\s*\('

  - id: browser-global-auth-binding
    desc: Publishes authentication binding through window
    conf: 0.85
    if:
      type: symbol
      kind: bind
      regex: '^window\.(getToken|login|auth)$'

  - id: browser-global-secret-binding
    desc: Publishes secret-like binding through window
    conf: 0.8
    if:
      type: symbol
      kind: bind
      regex: '^window\.(key|secret|token)$'
