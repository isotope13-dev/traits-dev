traits:
- id: identifier-call-with-true-flag
  desc: Calls function with identifier and true flag
  conf: 0.6
  if:
    type: text
    regex: "\\b[A-Za-z_]\\w*\\(\\s*[A-Za-z_]\\w*\\s*,\\s*true\\s*\\)"
