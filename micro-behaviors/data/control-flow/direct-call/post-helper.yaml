defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: post-helper-forwards-content
    desc: Helper forwards URL and content into post
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((function_declaration
                  parameters: (formal_parameters . (identifier) @url . (identifier) @message)
                  body: (statement_block (expression_statement (await_expression (call_expression
                        function: (member_expression property: (property_identifier) @post)
                        arguments: (arguments . (identifier) @url_arg
                          . (object (pair key: (property_identifier) @content
                            value: (identifier) @content_arg))))))))
                  (#eq? @post "post") (#eq? @content "content")
                  (#eq? @url @url_arg) (#eq? @message @content_arg))
        ((function_declaration
                  parameters: (formal_parameters . (identifier) @url . (identifier) @message)
                  body: (statement_block (expression_statement (call_expression
                        function: (member_expression property: (property_identifier) @post)
                        arguments: (arguments . (identifier) @url_arg
                          . (object (pair key: (property_identifier) @content
                            value: (identifier) @content_arg)))))))
                  (#eq? @post "post") (#eq? @content "content")
                  (#eq? @url @url_arg) (#eq? @message @content_arg))
        ((function_declaration
                  parameters: (formal_parameters . (identifier) @url . (identifier) @message)
                  body: (statement_block (return_statement (call_expression
                        function: (member_expression property: (property_identifier) @post)
                        arguments: (arguments . (identifier) @url_arg
                          . (object (pair key: (property_identifier) @content
                            value: (identifier) @content_arg)))))))
                  (#eq? @post "post") (#eq? @content "content")
                  (#eq? @url @url_arg) (#eq? @message @content_arg))
