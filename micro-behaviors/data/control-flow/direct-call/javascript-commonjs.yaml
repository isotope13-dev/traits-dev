# This matcher establishes a direct call with a synthetic module argument; it
# does not identify Function construction or source evaluation by itself.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-commonjs-synthetic-module-run
    desc: Function runs via synthetic module object
    conf: 0.94
    if:
      type: text
      regex: '\{\s*exports:\s*\{\s*\}\s*\}[\s\S]{0,120}\w+\s*\(\s*\w+\s*,\s*\w+\s*,\s*\w+\.exports\s*\)'
