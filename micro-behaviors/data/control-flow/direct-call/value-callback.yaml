---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: value-property-direct-reporting-call
  desc: Passes value property to a reporting callback
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (identifier) @callee
        arguments: (arguments
          (member_expression
            property: (property_identifier) @property))) @call
        (#eq? @property "value")
        (#match? @callee "(?i)(send|report|collect|track)"))
- id: trimmed-value-timer-reporting-call
  desc: Reports trimmed value through timer callback
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    query: |
      ((statement_block
        (lexical_declaration
          (variable_declarator
            name: (identifier) @source
            value: (call_expression
              function: (member_expression
                object: (member_expression
                  property: (property_identifier) @value)
                property: (property_identifier) @trim))))
        (expression_statement
          (assignment_expression
            right: (call_expression
            function: (identifier) @timer
            arguments: (arguments
              (arrow_function
                body: (statement_block
                  (expression_statement
                    (call_expression
                      function: (identifier) @callee
                      arguments: (arguments
                        (object
                          (pair
                            key: (property_identifier) @key
                            value: (identifier) @sent)))))))))))) @block
        (#eq? @value "value")
        (#eq? @trim "trim")
        (#eq? @timer "setTimeout")
        (#eq? @key "data")
        (#eq? @source @sent)
        (#match? @callee "(?i)(send|report|collect|track)"))
- id: value-alias-timer-reporting-call
  desc: Reports value alias through timer callback
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    query: |
      ((statement_block
        (lexical_declaration
          (variable_declarator
            name: (identifier) @source
            value: (member_expression
              property: (property_identifier) @value)))
        (expression_statement
          (assignment_expression
            right: (call_expression
              function: (identifier) @timer
              arguments: (arguments
                (arrow_function
                  body: (statement_block
                    (expression_statement
                      (call_expression
                        function: (identifier) @callee
                        arguments: (arguments
                          (object
                            (pair
                              key: (property_identifier) @key
                              value: (identifier) @sent)))))))))))) @block
        (#eq? @value "value")
        (#eq? @timer "setTimeout")
        (#eq? @key "data")
        (#eq? @source @sent)
        (#match? @callee "(?i)(send|report|collect|track)"))
composite_rules:
- id: value-property-reporting-call
  desc: Passes value property to a reporting callback
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/data/control-flow/direct-call::value-property-direct-reporting-call
  - id: micro-behaviors/data/control-flow/direct-call::trimmed-value-timer-reporting-call
  - id: micro-behaviors/data/control-flow/direct-call::value-alias-timer-reporting-call
