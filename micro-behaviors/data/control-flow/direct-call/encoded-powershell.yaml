defaults:
  for: [vbs, javascript]
  platforms: [windows]
traits:
  # Same call shape as the batch carrier sibling: decoder 'base64' 1.
  - id: powershell-repeated-encoded-argument-calls
    desc: Repeated encoded arguments with numeric flag
    crit: notable
    conf: 0.93
    count_min: 5
    if:
      type: text
      regex: "(?i)\\b[A-Za-z_]\\w*\\s+'[A-Za-z0-9+/]{20,}={0,2}'\\s+1\\b"

