# Code runs only when a random integer draw hits one value
# (`n = Math.floor(Math.random()*5); if (n == 3)`), i.e. for a random
# fraction of executions. Sampling, A/B tests and redirect injectors that
# fire for only some visitors all use this shape.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
traits:
  - id: random-integer-equality-gate
    desc: Branches on a random integer equality test
    if:
      type: text
      regex: 'Math\.floor\(Math\.random\(\)\s*\*\s*\d+\)[\s\S]{0,40}==\s*\d+\s*\)'
