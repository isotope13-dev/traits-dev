defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
- id: js-conditional-matcher-call
  desc: Tests a string inside an if/while condition
  crit: baseline
  conf: 0.88
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?i)\b(if|while)\s*\([^;\r\n(]{0,120}\b(test|includes|match|indexOf)\s*\(
