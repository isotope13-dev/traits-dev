traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: retry-guard-positive
  desc: Retry guard checks positive counter
  crit: notable
  conf: 0.84
  size_max: 200000
  unless:
  - type: basename
    regex: ^jsbn(-combined|2)?\.js$
  - type: basename
    regex: \.js\.map$
  - id: well-known/lib/web/jquery::header-prefix
  - id: well-known/app/ai/coding-agent/tabby::tabby-builtin-plugin-dist-path
  if:
    type: text
    regex: if\s*\(\s*(retry|retries|attempts?|retryCount)\s*>\s*0\s*\)
