defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: missing-file-early-return
    desc: Returns early if file does not exist
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (unary_expression operator: "!"
              argument: (call_expression
                function: (member_expression
                  property: (property_identifier) @method))))
          consequence: (statement_block . (return_statement) .)) @gate
          (#eq? @method "existsSync"))
