defaults:
  platforms: [unix, windows, appliance]
  for: [rust]
traits:
  - id: rust-zero-six-byte-or-comparison
    desc: Rust zero six-byte array OR comparison
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: rust
      query: |
        ((binary_expression) @comparison
          (#match? @comparison "==\\s*\\[\\s*0(u8)?\\s*;\\s*6\\s*\\]\\s*\\|\\|"))
