defaults:
  platforms: [unix]
  for: [c, cpp, text]

traits:
  - id: network-port-constant-compare
    desc: Compares decoded network port with constant
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'ntohs\([\w.>-]{1,32}sin_port\)\s*==\s*([1-9]\d{0,4}|[A-Z_][A-Z0-9_]{1,15})\b'
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
