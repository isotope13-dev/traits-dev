# Build-script conditionals that explicitly skip execution during package-build
# subcommands (`rake build`, `python setup.py sdist`/`bdist_wheel`, `npm pack`)
# so the author can package an artifact without triggering side effects locally.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.92

traits:
  - id: ruby-argv-not-build
    for: [ruby]
    desc: Ruby ARGV check skips build subcommand
    if:
      type: text
      regex: 'ARGV\s*\[\s*0\s*\]\s*!=\s*[''"]build[''"]|unless\s+ARGV\s*\[\s*0\s*\]\s*==\s*[''"]build[''"]'

  - id: ruby-argv-exclude-build
    for: [ruby]
    desc: Ruby ARGV.include? negation skips build
    if:
      type: text
      regex: '!\s*ARGV\.include\?\s*\(\s*[''"]build[''"]\s*\)'

  - id: python-argv-not-sdist
    for: [python]
    desc: Python sys.argv check skips sdist or build
    if:
      type: text
      regex: '[''"](sdist|bdist_wheel|egg_info)[''"]\s+not\s+in\s+sys\.argv'

  - id: python-argv-not-any-build
    for: [python]
    desc: Python argv check skips build subcommands
    if:
      type: text
      regex: '\bnot\s+any\s*\(\s*\w+\s+in\s+sys\.argv\s+for\s+\w+\s+in\b'

  - id: js-argv-not-pack
    for: [javascript, typescript]
    desc: Node process.argv check skips pack or build
    if:
      type: text
      regex: '!\s*process\.argv\.includes\s*\(\s*[''"](build|pack)[''"]\s*\)'

composite_rules:
  - id: ruby-build-arg-guard
    for: [ruby]
    desc: Ruby script skips build subcommand
    crit: notable
    conf: 0.92
    any:
      - id: ruby-argv-not-build
      - id: ruby-argv-exclude-build

  - id: build-arg-exclusion-guard
    for: [ruby, python, javascript, typescript]
    desc: Skips execution during package build subcommand
    crit: notable
    conf: 0.92
    any:
      - id: ruby-argv-not-build
      - id: ruby-argv-exclude-build
      - id: python-argv-not-sdist
      - id: python-argv-not-any-build
      - id: js-argv-not-pack
