# Unconditional branch constructs in Windows batch scripts: a label
# definition and the GOTO that jumps to one.
#
# Relocated from micro-behaviors/data/control-flow/loop/, where the two
# generic catch-alls sat beside the loop-idiom pairs (`:loop`/`goto loop`,
# `:retry`/`goto retry`, …). Those pairs earn the `loop/` path because the
# label NAME is what carries the loop meaning; matching *any* label or *any*
# GOTO does not — a forward jump to a cleanup label is a branch, not a loop.
# They were also graded notable, which put every npm-generated `.cmd` shim
# (`GOTO start` … `:find_dp0` … `:start`) at four notable findings for
# nothing but stock batch syntax. Composites that infer a loop, or nuisance
# repetition, reference these atoms and supply that intent.
defaults:
  platforms: [windows]
  for: [batch]
  crit: baseline
  conf: 0.85

traits:
  - id: batch-label-definition
    desc: Batch script defines a GOTO label
    if:
      type: text
      regex: '(?im)^\s*:[A-Za-z0-9_-]{1,32}\s*$'

  - id: batch-goto-branch
    desc: Batch script branches with GOTO
    if:
      type: text
      regex: '(?im)^\s*goto\s+[A-Za-z0-9_-]{1,32}\b'
