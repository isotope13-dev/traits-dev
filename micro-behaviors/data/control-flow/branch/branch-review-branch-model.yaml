defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - go
  - javascript
  - typescript
  crit: notable
  conf: 0.93

traits:
  - id: go-action-field-switch
    desc: Go switches on an action-like field
    for: [go]
    if:
      type: text
      regex: '\bswitch\s+[A-Za-z_]\w*\.(Action|Decision|Command|Task)\s*\{'


composite_rules:
  - id: action-field-selection
    desc: Selects command-like branch or mapping entry
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/data/collection/map::python-command-field-mapping-lookup
      - id: micro-behaviors/data/control-flow/branch::go-action-field-switch
      - id: micro-behaviors/data/control-flow/dispatch/named::object-field-dispatch-switch

