defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  crit: notable

traits:
  - id: x64-terminal-selector-compare
    desc: Branches on eight-byte terminal selector
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '49 83 F8 08 0F 85 [4] 49 B9 74 65 72 6D 69 6E 61 6C 4C 39 0A 0F 85'
  - id: x64-screen-selector-compare
    desc: Branches on six-byte screen selector
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '49 83 F8 06 0F 85 [4] 81 3A 73 63 72 65 [0-8] 0F 85 [4] 66 81 7A 04 65 6E'
