defaults:
  crit: notable
  conf: 0.85
  platforms: [unix, windows]
  for: [c, cpp, rust, go, csharp, javascript, php]

traits:
  # These atoms describe a branch on an application action.  They do not
  # establish command-and-control intent; objective composites add that
  # context when appropriate.
  - id: send-action-branch
    desc: Branches on send action
    if:
      type: text
      regex: '(?i)(case|when)\s*["'']send["'']|(={2,3}|=~|~)\s*["'']send["'']'

  - id: receive-action-branch
    desc: Branches on receive action
    if:
      type: text
      regex: '(?i)(case|when)\s*["'']receive["'']|(={2,3}|=~|~)\s*["'']receive["'']'
