defaults:
  platforms: [unix, windows, appliance]
  for: [python]

traits:
  - id: python-or-equality-comparisons
    desc: Python OR joins equality comparisons
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '==[^;\n]{1,64}\bor\b|\bor\b[^;\n]{1,64}=='
  - id: python-conditional-list-with-call
    desc: Conditional list assignment containing a call
    platforms: [unix, windows]
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: \w+\s*=\s*\[[^\]]{0,120}\(\)[^\]]{0,120}\]\s+if\s+\w+\s+else\s+\[[^\]]{0,160}\]
