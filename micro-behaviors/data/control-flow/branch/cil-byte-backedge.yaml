defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-high-bit-byte-limit-backedge
    desc: CIL high-bit test with byte-limit backedge
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      # MethodDef call, high-bit test, local increment, exclusive bound 256
      # and negative short backedge. Does not resolve the called API token.
      pattern: '17 0A 2B ?? 06 28 ?? ?? ?? 06 20 00 80 00 00 5F 16 FE 03 0B [20-100] 06 17 58 0A 06 20 00 01 00 00 32 (8?|9?|A?|B?|C?|D?|E?|F?)'
