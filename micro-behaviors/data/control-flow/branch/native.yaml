# Comparing one buffer against two alternative values is an ordinary idiom in
# C and Go: accepting either of two magic prefixes, matching a line against a
# pair of framing markers, and so on.
#
# Relocated from objectives/evasion/security-bypass/auth/, where they were
# named for the wildcard-identity composite they feed and graded suspicious.
# The matchers only detect the two-way comparison itself, so they fired on any
# ordinary pair of alternatives -- Go's own cmd/internal/test2json compares a
# trimmed line against its "PASS"/"FAIL" markers. The wildcard-identity
# composites reference these atoms and supply the all-zero identity that
# carries the intent.
defaults:
  platforms: [unix, windows, appliance]
  crit: baseline
  conf: 0.95

traits:
  - id: c-memcmp-alternative-comparisons
    desc: C memcmp matches either of two values
    for: [c, cpp]
    if:
      type: text
      regex: 'memcmp\s*\([^;\n]{1,160}\)\s*==\s*0\s*\|\|\s*memcmp\s*\([^;\n]{1,160}\)\s*==\s*0'

  - id: go-bytes-equal-alternative-comparisons
    desc: Go bytes.Equal matches either of two values
    for: [go]
    if:
      type: text
      regex: 'bytes\.Equal\s*\([^;\n]{1,120}\)\s*\|\|\s*bytes\.Equal\s*\('
