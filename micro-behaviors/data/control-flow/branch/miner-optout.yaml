defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: miner-expiring-optout-test
    desc: Negates timed opt-out on miner receiver
    if:
      type: text
      regex: '!miner\.didOptOut\(\s*[1-9][0-9]*\s*\)'
      exclude_html_comments: true
  - id: miner-optout-gated-start
    desc: Timed opt-out test directly gates start
    if:
      type: text
      regex: '!miner\.didOptOut\([1-9]\d*\)\s*\)\s*\{\s*miner\.start\(\)'
      exclude_html_comments: true
