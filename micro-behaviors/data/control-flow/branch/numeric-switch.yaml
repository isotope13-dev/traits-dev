traits:
  - id: js-short-var-numeric-switch
    desc: Switch on short variable with numeric cases
    platforms: [windows, unix]
    crit: notable
    conf: 0.8
    for: [javascript]
    if:
      type: text
      regex: '(?s)switch\([_$a-z]\w{0,2}\)\s*\{.{0,48}case\s+\d+:.{0,48}case\s+\d+:.{0,48}case\s+\d+:'
    not:
    - substr: "switch(SortColumn)"
    unless:
    - id: metadata/build/minifier::js-large-minified-bundle
    - id: metadata/build/bundler/asset::js-dist-asset-bundle
