defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: buffer-comparison-continue-guard
    desc: memcmp or bcmp guards a loop continue
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: conditional
      regex: '\b(memcmp|bcmp)\s*\([^;]{1,100}\)[^;]{0,30}\bcontinue\b'
