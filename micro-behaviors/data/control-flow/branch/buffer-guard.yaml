defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: buffer-comparison-continue-guard
    desc: Buffer comparison skips a loop iteration
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: conditional
      regex: '\bmemcmp\s*\([^;]{1,100}\)[^;]{0,30}\bcontinue\b'
