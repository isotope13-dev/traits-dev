defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-literal-string-if-comparison
    desc: If compares two alphabetic string literals
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'if\s*\(\s*[''"][A-Za-z]{4,12}[''"]\s*[!=]={1,2}\s*[''"][A-Za-z]{4,12}[''"]'
