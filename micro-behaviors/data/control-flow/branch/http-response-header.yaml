defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: response-header-task-handler-dispatch
    desc: Response header selects a response handler
    crit: notable
    conf: 0.98
    # Bind the response used for header lookup to the response passed onward
    # to a switch-selected handler. Header names and handler names may vary.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((switch_statement
          value: (parenthesized_expression
            (call_expression
              function: [
                (member_expression property: (property_identifier) @get_header)
                (subscript_expression index: (string (string_fragment) @get_header))
              ]
              arguments: (arguments . (identifier) @response (_))))
          body: (switch_body
            (switch_case
              body: (expression_statement
                [
                  (call_expression arguments: (arguments . (_) (identifier) @handled))
                  (sequence_expression
                    (call_expression arguments: (arguments . (_) (identifier) @handled))
                    (_))
                ])))) @dispatch
          (#match? @get_header "^[Gg]et[Rr]esponse[Hh]eader$")
          (#eq? @response @handled))

        ((switch_statement
          value: (parenthesized_expression
            (call_expression
              function: [
                (member_expression object: (identifier) @response
                  property: (property_identifier) @get_header)
                (subscript_expression object: (identifier) @response
                  index: (string (string_fragment) @get_header))
              ]
              arguments: (arguments . (_))))
          body: (switch_body
            (switch_case
              body: (expression_statement
                (call_expression arguments: (arguments . (identifier) @handled)))))) @dispatch
          (#match? @get_header "^[Gg]et[Rr]esponse[Hh]eader$")
          (#eq? @response @handled))
