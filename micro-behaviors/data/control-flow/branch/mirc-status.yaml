defaults:
  platforms: [unix, windows]
  for: [mirc, ircii]
traits:
- id: mirc-list-status-comparison
  desc: Compares mIRC LIST status numbers
  crit: notable
  conf: 0.86
  if:
    type: text
    # RPL_LIST (322) / RPL_LISTEND (323) tested in a raw socket parser.
    regex: '(?i)(==\s*32[23]\b|\b32[23]\s*==)'
