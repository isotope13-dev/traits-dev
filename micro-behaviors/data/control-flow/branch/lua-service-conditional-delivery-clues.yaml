---
defaults:
  platforms:
  - netscaler
  - appliance
  - unix
  for:
  - lua
composite_rules:
- id: lua-service-conditional-delivery-clues
  desc: Lua service, certificate and delivery clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/source/syntax/comparison::lua-service-count-comparison-text
  - id: metadata/lang/source/syntax/control-flow::lua-conditional-deliver-call-text
  any:
  - id: micro-behaviors/communications/tls/initialize::lua-ssl-certificate-name-clues
  - id: micro-behaviors/os/sysinfo/profile::lua-fingerprint-discovery-fields
