defaults:
  platforms: [unix, windows]
  for: [php, text]
traits:
  - id: php-request-argument-under-presence-test
    desc: Presence-guarded PHP request argument call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST)\s*\[[^\]]{1,30}\]\)\s*\{\s*\w{1,40}\(\s*\$_[A-Z]{3,7}\['
