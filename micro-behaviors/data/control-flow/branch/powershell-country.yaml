defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-country-membership-branch
    desc: Tests membership of a country-named variable
    crit: notable
    conf: 0.92
    if:
      type: text
      # Membership tests come in both operators: `-contains` on the collection
      # and `-in` with the operands swapped (`if ($country -in $list) {`).
      # Loaders gate on either spelling, so accept both.
      regex: '(?is)\$\w*(country|region|locale)\w*\s+(-contains|-in)\s+\$\w*\)\s*\{'

  - id: powershell-membership-exit
    desc: PowerShell country membership branch exits
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\$\w*(country|region|locale)\w*\s+(-contains|-in)\s+\$\w*\)\s*\{\s*exit\b'
