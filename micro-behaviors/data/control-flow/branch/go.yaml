defaults:
  crit: notable
  conf: 0.85
  platforms: [unix, windows]
  for: [go]

traits:
  # A fixed-integer activation guard: the function returns early unless a
  # field carries one precomputed value. This is the source shape of
  # targeted-activation gates such as the price check in gogets.dev/btreex,
  # which only unpacks its second stage for one caller-supplied price. The
  # comparison alone is neutral; objective composites add the decrypt-and-run
  # context that makes it hostile.
  - id: go-fixed-int-activation-guard
    desc: Go fixed-integer activation guard
    if:
      type: text
      regex: 'if\s+[A-Za-z_]\w*\.[A-Za-z_]\w*\s*(!=|==)\s*\d{4,}\b'
