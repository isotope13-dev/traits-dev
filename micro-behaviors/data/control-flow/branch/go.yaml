defaults:
  crit: notable
  conf: 0.85
  platforms: [unix, windows]
  for: [go]

traits:
  # A field comparison against a large decimal integer is neutral. It need
  # not return early or activate anything; objective consumers add context.
  - id: go-large-integer-field-comparison
    desc: Go field compared to large integer
    if:
      type: text
      regex: 'if\s+[A-Za-z_]\w*\.[A-Za-z_]\w*\s*(!=|==)\s*\d{4,}\b'
