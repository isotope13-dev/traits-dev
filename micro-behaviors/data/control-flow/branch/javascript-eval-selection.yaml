# The conditional selects a callable but does not invoke it.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: js-conditional-string-eval-selection
    desc: Conditional expression selects String or eval
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '\?\s*String\s*:\s*eval\b'
