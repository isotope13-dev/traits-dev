defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: global-state-comparison-gate
    desc: Branch compares persistent extension state
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (binary_expression
              left: (call_expression
                function: (member_expression
                  object: (member_expression property: (property_identifier) @store)
                  property: (property_identifier) @read))
              operator: ["!==" "!=" "===" "=="]))) @gate
          (#eq? @store "globalState")
          (#eq? @read "get"))
