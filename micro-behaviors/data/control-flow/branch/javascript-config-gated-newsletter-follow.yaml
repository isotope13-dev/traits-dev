defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: javascript-config-gated-newsletter-follow
    desc: Config flag gates a newsletter follow query
    if:
      type: text
      regex: 'if\s*\(\s*config\.autoFollow\s*\)\s*\{[\s\S]{0,500}QueryIds\.FOLLOW'
