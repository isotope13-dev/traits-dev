defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
traits:
- id: native-update-response-string-test
  desc: Tests getUpdates call buffer in a branch
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |-
      ((compound_statement
       (expression_statement (call_expression
        function: (identifier) @request
        arguments: (argument_list (_) (string_literal) @method (_) (identifier) @response)))
       (if_statement condition: (parenthesized_expression (call_expression
        function: (identifier) @search
        arguments: (argument_list (identifier) @tested (string_literal)))))) @dispatch
       (#eq? @method "\"getUpdates\"")
       (#eq? @search "strstr")
       (#eq? @response @tested))
