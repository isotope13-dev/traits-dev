defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x86-f0-control-word-flags
    desc: x86 F0 control-word check with flag branch
    crit: notable
    conf: 0.98
    if:
      type: hex
      # Match the masking, comparison, handler call and flag test together.
      # Addresses and stack locals vary; the conditional relationship does not.
      # Raw scope includes intentionally damaged PE images.
      offset_range: [0, null]
      pattern: '33 44 24 ?? 89 44 24 ?? 74 ?? 8B C8 83 E1 F0 81 F9 F0 00 00 00 75 ?? 50 E8 ?? ?? ?? ?? F6 44 24 ?? 01 59 74 ??'
