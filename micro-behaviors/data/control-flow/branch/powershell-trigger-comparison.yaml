defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-packet-trigger-comparison
    desc: Compares packet-named content against a trigger
    if:
      type: text
      regex: '(?i)if\s*\(\s*\$RemainderOfPacket\s+-match\s+\$Trigger\s*\)'
  - id: powershell-line-trigger-comparison
    desc: Compares a line variable against a trigger
    if:
      type: text
      regex: '(?i)if\s*\(\s*\$line\s+-eq\s+\$Trigger\s*\)'
  - id: powershell-resolved-trigger-comparison
    desc: Compares resolved and trigger variables
    if:
      type: text
      regex: '(?i)if\s*\(\s*\$resolved\s+-ne\s+\$Trigger\s*\)'
