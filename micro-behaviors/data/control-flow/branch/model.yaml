# Structured model output can drive application control flow without ever
# becoming a shell command. These are neutral mechanics: ordinary agents also
# parse an action and dispatch a precompiled handler. Objective rules add the
# offensive handler set before assigning malicious intent.
defaults:
  platforms: [unix, windows]
  for: [python, go, javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: python-action-field-handler-dispatch
    desc: Python looks up an action-field handler
    for: [python]
    if:
      type: text
      regex: '\b\w+\.get\s*\(\s*\w+\s*\[\s*["''](action|decision|command|task)["'']\s*\]'

  - id: go-action-field-switch
    desc: Go switches on an action-like field
    for: [go]
    if:
      type: text
      regex: '\bswitch\s+[A-Za-z_]\w*\.(Action|Decision|Command|Task)\s*\{'

  - id: python-decision-counter
    desc: Python counts structured decisions
    for: [python]
    if:
      type: text
      regex: '\bCounter\s*\([^)]{0,200}\[\s*["''](action|decision)["'']\s*\]'

  - id: python-top-vote-selection
    desc: Python selects the top vote
    for: [python]
    conf: 0.96
    if:
      type: text
      regex: '\b\w+\.most_common\s*\(\s*1\s*\)'

  - id: go-string-int-vote-map
    desc: Go creates a string vote-count map
    for: [go]
    if:
      type: text
      regex: 'map\s*\[\s*string\s*\]\s*int\s*\{'

  - id: go-decision-vote-increment
    desc: Go increments a structured decision vote
    for: [go]
    if:
      type: text
      regex: '\b\w+\[\s*\w+\.(Action|Decision)\s*\]\+\+'

  - id: go-decision-vote-maximum
    desc: Go compares structured decision votes
    for: [go]
    if:
      type: text
      regex: '\b\w+\[\s*\w+\.(Action|Decision)\s*\]\s*>\s*\w+\['

  # CLOSEDQUORUM-class implants tally one vote per model and execute the
  # plurality winner. PowerShell has no Counter/most_common idiom; the same
  # shape is Group-Object on the decision field piped into a descending
  # Sort-Object with the top group selected. Neutral mechanic on its own --
  # ordinary polling code groups and ranks -- objective composites add the
  # model endpoints and the offensive action set.
  - id: powershell-group-decision-field
    desc: PowerShell groups a decision field
    for: [powershell]
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGroup-Object\b[^\n]{0,60}\b(action|decision|vote|task)\b'
  - id: powershell-sort-descending
    desc: PowerShell sorts descending
    for: [powershell]
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSort-Object\b[^\n]{0,60}-Descending'

  - id: javascript-object-entry-reduction
    desc: JavaScript reduces or sorts object entries
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bObject\.(entries|keys)\s*\(\s*[A-Za-z_$][\w$]*\s*\)\s*\.(reduce|sort)\s*\('

composite_rules:
  - id: model-response-json-decode
    desc: Parses model response content as JSON
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/data/serialize/json::model-response-json-loads
      - id: micro-behaviors/data/serialize/json::go-content-field-json-unmarshal
      - id: micro-behaviors/data/serialize/json::model-response-content-json-parse

  - id: action-field-handler-dispatch
    desc: Dispatches action field to handler
    crit: notable
    conf: 0.94
    any:
      - id: python-action-field-handler-dispatch
      - id: go-action-field-switch
      - id: micro-behaviors/data/llm/decision::decision-switch-member

  - id: model-response-action-dispatch
    desc: Model response selects action handler
    crit: notable
    conf: 0.96
    near_bytes: 5000
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: model-response-json-decode
      - id: action-field-handler-dispatch

  - id: python-structured-decision-plurality
    desc: Python selects a decision by plurality
    crit: notable
    conf: 0.96
    for: [python]
    near_lines: 8
    all:
      - id: python-decision-counter
      - id: python-top-vote-selection

  - id: powershell-group-vote-selection
    desc: PowerShell picks top grouped vote
    crit: notable
    conf: 0.93
    for: [powershell]
    near_lines: 6
    all:
      - id: powershell-group-decision-field
      - id: powershell-sort-descending

  - id: go-structured-decision-plurality
    desc: Go selects a decision by plurality
    crit: notable
    conf: 0.96
    for: [go]
    near_lines: 16
    all:
      - id: go-string-int-vote-map
      - id: go-decision-vote-increment
      - id: go-decision-vote-maximum

  - id: javascript-structured-decision-plurality
    desc: JavaScript selects a decision by plurality
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 16
    all:
      - id: micro-behaviors/data/llm/decision::model-decision-vote-increment
      - id: javascript-object-entry-reduction

  - id: structured-decision-plurality
    desc: Selects structured decision by plurality
    crit: notable
    conf: 0.96
    any:
      - id: python-structured-decision-plurality
      - id: go-structured-decision-plurality
      - id: javascript-structured-decision-plurality
