defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: indexed-install-download-get-selector
    desc: Indexed value checks install/download/get
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\[\d+\]\s*(==|in\s*\()\s*["''](install|download|get)["'']'
