traits:
  - id: location-range-check-name
    desc: Country, region or IP-range check name
    for: [binaries, scripts]
    platforms: [windows, linux, macos]
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)\bcheck[-_]?(country|ip[-_]?range)\b|\bcheckRegion\b'

    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
