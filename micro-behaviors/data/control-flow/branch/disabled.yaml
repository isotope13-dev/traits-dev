defaults:
  platforms: [unix, windows]

traits:
- for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  id: literal-false-function-call
  desc: Literal false directly guards a function call
  if:
    type: text
    regex: if\s*\(\s*false\s*\)\s*[A-Za-z_$][\w$]*\s*\(\s*\)\s*;

- for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  id: literal-false-effect-block
  desc: Literal false branch encloses effect text
  if:
    type: text
    regex: if\s*\(false\)\s*\{[^}]{0,180}(https?\.|eval\(atob|var req = http\.|while\(|fs\.write)

- id: cargo-credential-http-false-branch
  for: [rust]
  crit: notable
  conf: 0.98
  desc: Dead Cargo credential HTTP branch
  if:
    type: text
    regex: '(?s)if\s+false\s*\{.{0,180}(CARGO_HOME|credentials|env).{0,180}(ureq::post|send\s*\()'

- id: cargo-credential-read-false-branch
  for: [rust]
  crit: notable
  conf: 0.98
  desc: Cargo read in a false branch
  if:
    type: text
    regex: '(?s)if\s+false\s*\{.{0,360}(CARGO_HOME|\.cargo).{0,360}credentials\.toml'

composite_rules:
- id: literal-false-credential-http-context
  desc: Literal-false call or dead Cargo HTTP path
  crit: exception
  conf: 0.98
  for: [javascript, typescript, rust]
  any:
  - id: literal-false-function-call
  - id: cargo-credential-http-false-branch
