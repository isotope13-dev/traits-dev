defaults:
  platforms: [unix, windows]

traits:
- for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  id: literal-false-effect-block
  desc: Literal false branch encloses effect text
  if:
    type: text
    regex: if\s*\(false\)\s*\{[^}]{0,180}(https?\.|eval\(atob|var req = http\.|while\(|fs\.write)

- id: cargo-credential-http-false-branch
  for: [rust]
  crit: component
  conf: 0.98
  desc: Dead Cargo credential HTTP path
  if:
    type: text
    regex: '(?s)if\s+false\s*\{.{0,180}CARGO_HOME.{0,180}ureq::post'
