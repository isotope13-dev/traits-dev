defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: high-bit-conditional-process-exit
    desc: High-bit test guards Windows process exit
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression) @condition
          consequence: (compound_statement
            (expression_statement
              (call_expression function: (identifier) @exit)))) @gate
          (#match? @condition "(<<[ ]*31|0x80000000)")
          (#eq? @exit "ExitProcess"))
