# File-operation token selectors are neutral; protocol consumers supply intent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
traits:
- id: upload-token-branch-text
  desc: Upload literal in comparison or case syntax
  conf: 0.94
  if:
    type: text
    regex: (?i)(==|case\b|strcmp\s*\()[^"'\n]{0,60}["']upload["']
- id: download-token-branch-text
  desc: Download literal in comparison or case syntax
  conf: 0.94
  if:
    type: text
    regex: (?i)(==|case\b|strcmp\s*\()[^"'\n]{0,60}["']download["']
- id: bof-token-branch-text
  desc: BOF literal in comparison or case syntax
  conf: 0.96
  if:
    type: text
    regex: (?i)(==|case\b|strcmp\s*\()[^"'\n]{0,60}["']bof["']
- id: python-upload-command-selector
  desc: Upload branch follows command-field selector
  conf: 0.98
  for:
  - python
  if:
    type: tree-sitter
    query: |
      ((block (expression_statement (assignment left: (identifier) @selected right: (subscript subscript: (string (string_content) @key)))) (if_statement condition: (comparison_operator (identifier) @used "==" (string (string_content) @token))))
       (#eq? @selected @used) (#eq? @key "command") (#eq? @token "upload"))
      ((block (expression_statement (assignment left: (identifier) @selected right: (subscript subscript: (string (string_content) @key)))) (if_statement alternative: (elif_clause condition: (comparison_operator (identifier) @used "==" (string (string_content) @token)))))
       (#eq? @selected @used) (#eq? @key "command") (#eq? @token "upload"))
- id: python-download-command-selector
  desc: Download branch follows command-field selector
  conf: 0.98
  for:
  - python
  if:
    type: tree-sitter
    query: |
      ((block (expression_statement (assignment left: (identifier) @selected right: (subscript subscript: (string (string_content) @key)))) (if_statement condition: (comparison_operator (identifier) @used "==" (string (string_content) @token))))
       (#eq? @selected @used) (#eq? @key "command") (#eq? @token "download"))
      ((block (expression_statement (assignment left: (identifier) @selected right: (subscript subscript: (string (string_content) @key)))) (if_statement alternative: (elif_clause condition: (comparison_operator (identifier) @used "==" (string (string_content) @token)))))
       (#eq? @selected @used) (#eq? @key "command") (#eq? @token "download"))
composite_rules:
- id: upload-token-branch
  desc: Source branch selects an upload token
  conf: 0.97
  any:
  - id: micro-behaviors/data/control-flow/branch::upload-token-branch-text
  - id: micro-behaviors/data/control-flow/branch::python-upload-command-selector
- id: download-token-branch
  desc: Source branch selects a download token
  conf: 0.97
  any:
  - id: micro-behaviors/data/control-flow/branch::download-token-branch-text
  - id: micro-behaviors/data/control-flow/branch::python-download-command-selector
