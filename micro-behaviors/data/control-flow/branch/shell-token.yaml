defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  conf: 0.97
traits:
- id: shell-token-arrow-arm
  desc: Shell literal selects a match arm
  crit: notable
  conf: 0.97
  for: [rust, csharp]
  if:
    type: text
    regex: '"shell"\s*=>'
- id: shell-token-branch-text
  desc: Shell literal beside comparison or case syntax
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)(==|case\b|strcmp\s*\()[^"'\n]{0,60}["']shell["']
- id: python-command-field-shell-branch
  desc: Python command-field value selects shell branch
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: tree-sitter
    query: |
      ((block (expression_statement (assignment left: (identifier) @selected right: (subscript subscript: (string (string_content) @key)))) (if_statement condition: (comparison_operator (identifier) @used "==" (string (string_content) @token))))
       (#eq? @selected @used) (#eq? @key "command") (#eq? @token "shell"))
      ((block (expression_statement (assignment left: (identifier) @selected right: (subscript subscript: (string (string_content) @key)))) (if_statement alternative: (elif_clause condition: (comparison_operator (identifier) @used "==" (string (string_content) @token)))))
       (#eq? @selected @used) (#eq? @key "command") (#eq? @token "shell"))
composite_rules:
- id: shell-token-branch
  desc: Source branch selects a shell token
  crit: notable
  conf: 0.97
  any:
  - id: shell-token-branch-text
  - id: python-command-field-shell-branch
  - id: shell-token-arrow-arm
