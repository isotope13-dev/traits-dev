defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
  - id: js-while-switch-loop
    desc: JavaScript while loop contains switch dispatch
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (while_statement
          body: (statement_block
            (switch_statement))) @while_switch

