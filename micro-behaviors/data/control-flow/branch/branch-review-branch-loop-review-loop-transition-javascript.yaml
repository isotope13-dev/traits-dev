defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
  - id: js-while-loop-header
    desc: JavaScript while loop header
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bwhile\s*\([^)]{1,100}\)\s*\{'
  - id: js-switch-statement
    desc: JavaScript switch dispatch statement
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bswitch ?\('
composite_rules:
  - id: js-while-switch-loop
    desc: JavaScript while loop near switch dispatch
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/control-flow/branch::js-while-loop-header
      - id: micro-behaviors/data/control-flow/branch::js-switch-statement
    near_bytes: 512

