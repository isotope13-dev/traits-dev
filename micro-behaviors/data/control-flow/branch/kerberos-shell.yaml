defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-ticket-save-success-test
    desc: Tests command output for Kerberos ticket save
    if:
      type: tree-sitter
      node: if_statement
      regex: '\bif\s+echo\s+"\$\{?\w+\}?"\s*\|\s*grep\s+-q\s+["'']Saving ticket["'']'
