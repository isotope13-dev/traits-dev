defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # The dispatcher reads a received task header at +0x10, subtracts 1000,
  # bounds the command to twenty entries, and jumps through its handler table.
  - id: header-range-switch-1000-x86
    desc: x86 header field selects handlers 1000–1019
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 47 04 89 4D ?? 89 45 ?? 8B 47 10 89 45 ?? 05 18 FC FF FF 83 F8 13 89 4D ?? 0F 87 [4] FF 24 85 [4]'
