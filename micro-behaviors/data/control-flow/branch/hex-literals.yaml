defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.82
traits:
- id: hex-literal-conditionals
  desc: Repeated conditionals with large hex literals
  count_min: 5
  per_kb_min: 1.0
  if:
    type: text
    regex: if\s*\([^)]{0,120}\b0x[0-9a-fA-F]{6,}[^)]{0,120}\)
