# Kotlin loop shapes. Neutral language constructs: a destructuring `for` is how
# Kotlin iterates any Map, so the atom says only that — the env-dump objective
# in objectives/exfiltration/stealer/credential/env/ supplies `System.getenv`
# and the key=value assembly that give it meaning.
defaults:
  platforms: [unix, windows]
  for: [kotlin]
  crit: baseline
  conf: 0.9

traits:
  - id: kotlin-map-destructuring-for-loop
    desc: Kotlin destructuring for-loop over pairs
    if:
      type: text
      regex: 'for\s*\(\(\w+,\s*\w+\)\s+in\s+\w+\)'
