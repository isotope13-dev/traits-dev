defaults:
  platforms: [windows]
  for: [batch]

traits:
  # Counts reachable backward GOTO cycles containing a non-waiting START.
  # Conditional exits and START /WAIT cycles do not satisfy the metric.
  - id: batch-unconditional-start-cycle
    desc: Batch repeats START in an unconditional cycle
    crit: notable
    conf: 0.97
    if:
      type: metrics
      field: source.batch.unconditional_start_cycles
      min: 1
