# VBScript `While True ... Wend` / `Do While True` has no exit condition of
# its own: the body runs until Exit or process end. Common in polling agents
# and services alike, so this is only the loop shape.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-while-true-loop
    desc: VBScript loop with constant True condition
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?im)^[ \t]*(Do[ \t]+)?While[ \t]+(True|1)[ \t]*(\r?$|:)'
