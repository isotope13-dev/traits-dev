defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - java
  - javascript
  - go
  - php
  - shell

traits:
  - id: infinite-loop-header
    desc: Contains an unconditional loop header
    crit: notable
    for: [scripts, source, xml, html]
    if:
      type: text
      regex: 'for\s*\([^;\r\n]{0,80};\s*;[^)\r\n]{0,80}\)|while\s*\(\s*(1|true|\$true)\s*\)'
  - id: block-unbounded-loop-header
    desc: Contains an unbounded block loop
    crit: notable
    for: [go, rust, ruby]
    if:
      type: text
      regex: '(?m)^\s*(loop\s*(do|\{)|for\s*\{)\s*$'
  - id: go-unbounded-three-clause-loop
    desc: Go loop omits its continuation condition
    crit: notable
    for: [go]
    if:
      type: text
      regex: '\bfor\s+[^;\r\n]{0,80};\s*;[^{\r\n]{0,80}\{'
  - id: source-infinite-loop-metric
    desc: Source contains an unconditional loop
    crit: notable
    # source is the compiled-source group; preserve the retired Ruby metric scope.
    for: [source, javascript, ruby]
    if:
      type: metrics
      field: 'ast.infinite_loop_count'
      min: 1
  - id: embedded-powershell-while-true
    desc: Code embeds unconditional PowerShell loop
    crit: notable
    for: [scripts, source]
    if:
      type: text
      substr: 'while ($true)'
  # A loop whose condition AND body are both no-ops does no work except burn
  # CPU: `while true; do true; done`. Distinct from the keep-alive idiom
  # (`while true; do sleep …`) and from the mere presence of an infinite loop
  # above: this one is a deliberate spin, as in load generators and stress
  # harnesses. Whether that load serves the operator or a victim is an
  # objective claim for composites, not this capability.
  - id: shell-noop-spin-loop
    desc: No-op shell spin loop burns CPU
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '\bwhile\s+(true|:)\s*;\s*do\s+(true|:)\s*;\s*done'
  # `ast.infinite_loop_count` recognizes literally true conditions, but a
  # counter advancing toward JavaScript's positive Infinity can never reach
  # its bound either. Keep this as a structured loop matcher so comments and
  # string examples do not become executable control-flow findings.
  - id: javascript-infinity-bound-loop
    desc: Loop counter advances toward Infinity
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: loop
      regex: 'for\s*\(.{1,60};.{1,60}<\s*Infinity\s*;.{0,40}\+\+.{0,20}\)'
  # Equivalent unconditional while headers share one canonical observation.
  # Preserve the old substring True form and whole-run numeric form.
  - id: python-unconditional-while-header
    desc: Python unconditional while-loop header
    crit: baseline
    for: [python]
    if:
      type: text
      regex: 'while True:|^while 1:$'
  - id: python-iter-sentinel-loop
    desc: Python iter(int, 1) sentinel infinite loop
    crit: notable
    conf: 0.6
    for: [python]
    if:
      type: text
      exact: 'for _ in iter(int, 1):'
  - id: shell-infinite-loop
    desc: Shell contains an unconditional loop
    crit: baseline
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*while\s+true\s*;\s*do\b'

composite_rules:
  - id: python-unbounded-loop
    desc: Python loop with no exit condition
    crit: component
    conf: 0.9
    for: [python]
    any:
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-iter-sentinel-loop
