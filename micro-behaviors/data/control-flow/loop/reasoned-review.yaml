# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - windows
  - linux
  - macos
  id: go-incrementing-port-loop
  desc: Go loop increments a port-named counter
  crit: notable
  conf: 0.85
  for:
  - go
  if:
    type: text
    regex: for \w*[Pp]ort\w*\b.{0,60}[Pp]ort\+\+
  unless:
  - id: metadata/package/testing/harness/unit::go-test
  - id: metadata/package/testing/presence/harness::go-test-file
defaults: {}
