defaults:
  platforms:
    - unix
    - windows
  for: [c, cpp, java, javascript, go, php, shell]
traits:
  - id: infinite-loop-header
    desc: Contains an unconditional loop header
    crit: baseline
    for: [scripts, source]
    if:
      type: text
      regex: 'for\s*\([^;\r\n]{0,80};\s*;[^)\r\n]{0,80}\)|while\s*\(\s*(1|true|\$true)\s*\)'
  - id: block-unbounded-loop-header
    desc: Contains an unbounded block loop
    crit: notable
    for: [go, rust, ruby]
    if:
      type: text
      regex: '(?m)^\s*(loop\s*(do|\{)|for\s*\{)\s*$'
  - id: go-unbounded-three-clause-loop
    desc: Go loop omits its continuation condition
    crit: notable
    for: [go]
    if:
      type: text
      regex: '\bfor\s+[^;\r\n]{0,80};\s*;[^{\r\n]{0,80}\{'
  - id: iteration-count-1024-literal
    desc: Contains a 1023 or 1024 iteration-count literal
    crit: baseline
    for: [scripts, source]
    if:
      type: text
      regex: '\b102[34]\b'
  - id: receiver-loop-bound-1024
    desc: Receiver iterates one thousand times
    crit: notable
    for: [scripts, source]
    if:
      type: text
      regex: '\b1024\.(times|each)\b|\b1\.\.1024\b'
  - id: javascript-infinite-loop-metric
    desc: JavaScript contains an infinite loop
    crit: baseline
    for: [javascript, typescript]
    if:
      type: metrics
      field: 'ast.infinite_loop_count'
      min: 1
  - id: source-infinite-loop-metric
    desc: Source contains an unconditional loop
    crit: notable
    for: [source]
    if:
      type: metrics
      field: 'ast.infinite_loop_count'
      min: 1
  - id: embedded-powershell-while-true
    desc: Code embeds unconditional PowerShell loop
    crit: notable
    for: [scripts, source]
    if:
      type: text
      substr: 'while ($true)'
  # `ast.infinite_loop_count` recognizes literally true conditions, but a
  # counter advancing toward JavaScript's positive Infinity can never reach
  # its bound either. Keep this as a structured loop matcher so comments and
  # string examples do not become executable control-flow findings.
  - id: javascript-infinity-bound-loop
    desc: Loop counter advances toward Infinity
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: loop
      regex: 'for\s*\(.{1,60};.{1,60}<\s*Infinity\s*;.{0,40}\+\+.{0,20}\)'
  - id: python-while-true
    desc: Python infinite while True loop
    crit: baseline
    for: [python]
    if:
      type: text
      substr: 'while True:'
  - id: python-while-one
    desc: Python infinite while 1 loop
    crit: baseline
    for: [python]
    if:
      type: text
      exact: 'while 1:'
  - id: python-iter-sentinel-loop
    desc: Python iter(int, 1) sentinel infinite loop
    crit: notable
    conf: 0.6
    for: [python]
    if:
      type: text
      exact: 'for _ in iter(int, 1):'
  - id: shell-infinite-loop
    desc: Shell contains an unconditional loop
    crit: baseline
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*while\s+true\s*;\s*do\b'
  - id: batch-label-loop
    desc: Batch loop label
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:loop\b
  - id: batch-goto-loop-command
    desc: Batch GOTO loop command
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^\s*goto\s+loop\b

  # `:start` is the conventional entry label rather than a loop name — every
  # npm-generated `.cmd` shim opens `GOTO start` … `:start`. The loop meaning
  # comes from the batch-goto-start-loop pairing below, not from either atom.
  - id: batch-label-start
    desc: Batch start label
    crit: baseline
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:start\b
  - id: batch-goto-start-command
    desc: Batch GOTO start command
    crit: baseline
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^\s*goto\s+start\b
  - id: batch-label-repeat
    desc: Batch repeat label
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:repeat\b
  - id: batch-goto-repeat-command
    desc: Batch GOTO repeat command
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^\s*goto\s+repeat\b
  - id: batch-label-retry
    desc: Batch retry label
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:retry\b
  - id: batch-goto-retry-command
    desc: Batch GOTO retry command
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^\s*goto\s+retry\b
  - id: batch-label-again
    desc: Batch again label
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:again\b
  - id: batch-goto-again-command
    desc: Batch GOTO again command
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^\s*goto\s+again\b
  - id: batch-label-chaos
    desc: Batch chaos label
    crit: notable
    conf: 0.86
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:chaos\b
  - id: batch-goto-chaos-command
    desc: Batch GOTO chaos command
    crit: notable
    conf: 0.86
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^\s*goto\s+chaos\b

composite_rules:
  - id: python-unbounded-loop
    desc: Python loop with no exit condition
    crit: component
    conf: 0.9
    for: [python]
    any:
      - id: python-while-true
      - id: python-while-one
      - id: python-iter-sentinel-loop
  - id: batch-goto-loop
    desc: Batch GOTO loop label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: batch-label-loop
      - id: batch-goto-loop-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-start-loop
    desc: Batch GOTO start label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: batch-label-start
      - id: batch-goto-start-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-repeat-loop
    desc: Batch GOTO repeat label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: batch-label-repeat
      - id: batch-goto-repeat-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-retry-loop
    desc: Batch GOTO retry label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: batch-label-retry
      - id: batch-goto-retry-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-again-loop
    desc: Batch GOTO again label
    crit: notable
    conf: 0.8
    for: [batch]
    all:
      - id: batch-label-again
      - id: batch-goto-again-command
    near_lines: 80
    not:
      - regex: (?i)\bshift\b
  - id: batch-goto-chaos-loop
    desc: Batch GOTO chaos loop label
    crit: notable
    conf: 0.86
    for: [batch]
    all:
      - id: batch-label-chaos
      - id: batch-goto-chaos-command
    near_lines: 80
