defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.9

traits:
  - id: serial-range-counter
    desc: Range loop uses serial-named counter
    for: [python]
    if:
      type: text
      regex: '(?i)\bfor\s+(\w+_)?serial(_?number|_?num|_?no)?\s+in\s+range\s*\('

  - id: serial-loop-variable
    desc: C-style loop uses serial-named counter
    for: [javascript, typescript, c, cpp, java]
    if:
      type: text
      regex: '(?i)\bfor\s*\([^;\n]{0,35}\b(\w+_)?serial(_?number|_?num|_?no)?\b'

  - id: serial-loop-increment
    desc: Increments serial-named loop counter
    for: [javascript, typescript, c, cpp, java]
    if:
      type: text
      regex: '(?i)\b(\w+_)?serial(_?number|_?num|_?no)?\s*(\+\+|\+=)'

composite_rules:
  - id: incrementing-serial-counter
    desc: Incrementing loop uses serial-named counter
    for: [javascript, typescript, c, cpp, java]
    all:
      - id: serial-loop-variable
      - id: serial-loop-increment
    near_lines: 3
