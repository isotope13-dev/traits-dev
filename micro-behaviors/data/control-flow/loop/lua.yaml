# Lua control-flow structures that are useful context but are not inherently
# evidence of obfuscation.
defaults:
  platforms: [windows, unix]
  for: [lua]

traits:
  - id: lua-while-if-conditional-loop
    desc: Lua while loop contains conditional branch
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while\s+\w+\s+do\s+if\s+\w+\s*[<>=]+\s*\d'
