defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  - svg
  crit: notable

traits:
  - id: source-for-of-fetch-syntax
    desc: For-of loop contains fetch call syntax
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: loop
      regex: 'for\s*\(\s*(const|let|var)\s+\w+\s+of\b[\s\S]{0,300}fetch\s*\('

  # Markup does not expose the same loop AST. Stop at a closing brace to
  # keep a completed loop from reaching a later function's fetch call.
  - id: markup-for-of-fetch-syntax
    desc: Markup for-of body has fetch call syntax
    conf: 0.85
    for: [html, svg]
    if:
      type: text
      regex: 'for\s*\(\s*(const|let|var)\s+\w+\s+of\b[^)]{1,160}\)\s*\{[^{}]{0,300}\bfetch\s*\('


composite_rules:
  - id: iterated-list-fetch-loop
    desc: For-of loop contains fetch call syntax
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/data/control-flow/loop/collection::source-for-of-fetch-syntax
      - id: micro-behaviors/data/control-flow/loop/collection::markup-for-of-fetch-syntax
