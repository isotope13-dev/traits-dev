defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: inline-root-account-loop
    desc: For-loop starts with root account
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      # `root` must be the account itself, not an object (`[root.buttons, ...]`).
      regex: '\bfor\s+\w+\s+in\s+[(\[]?["'']?root([\s"'',)\]]|$)'

composite_rules:
  - id: account-values-loop
    desc: Iterates account or user values
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/data/control-flow/loop/collection::shell-account-array-loop
      - id: inline-root-account-loop
      - id: micro-behaviors/data/control-flow/loop/collection::source-account-range-loop
      - id: micro-behaviors/data/control-flow/loop/collection::method-account-each-loop

