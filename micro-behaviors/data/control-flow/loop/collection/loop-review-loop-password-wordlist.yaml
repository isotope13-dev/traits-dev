
composite_rules:
  - id: python-password-wordlist-iteration
    for: [python]
    platforms: [unix, windows]
    desc: Python iterates wordlist password candidates
    crit: notable
    conf: 0.96
    near_lines: 8
    all:
      - id: micro-behaviors/fs/file/open::python-named-wordlist-open
    any:
      - id: micro-behaviors/data/control-flow/loop/collection::python-enumerated-password-loop
      - id: micro-behaviors/data/control-flow/loop/collection::python-direct-password-loop
