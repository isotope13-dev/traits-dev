# Traversal of a collection named accounts, users or usernames. The loop
# shape is neutral (auth helpers, admin tooling and account scanners all
# iterate user lists); objectives such as the OpenSSH account scanner add
# the attack context.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.92

traits:
  - id: shell-account-array-loop
    desc: Shell loops over accounts or users array
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bfor\s+\w+\s+in\s+"?\$\{?(accounts|users|usernames)\[@\]\}?"?'

  - id: source-account-range-loop
    desc: Python or Go ranges over user lists
    for: [python, go]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bfor\s+(\w+\s*,\s*)?\w+\s+(:?=\s*range|in)\s+(accounts|users|usernames)\b'

  - id: method-account-each-loop
    desc: JS or Ruby iterates accounts or users
    for: [javascript, typescript, ruby]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b(accounts|users|usernames)\.(forEach|each)\b'
