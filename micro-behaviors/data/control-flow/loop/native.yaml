defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, go]
  crit: notable
  conf: 0.85

traits:
  - id: native-range-loop-large-bound
    desc: Uses a large-bound native loop
    if:
      type: text
      # A bound below 100 is common in tests and fixed-size protocol cases;
      # reserve this atom for loops that actually repeat a large literal
      # number of times, matching the Python/Rust counterparts.
      regex: '\bfor\s*\([^;\n]{0,40};[^;\n]{0,40}<\s*([1-9][0-9]{2,})\s*;'

  # The two cursor atoms below are the ordinary "walk a buffer" loop shape.
  # They are baseline because every parser, hash, codec, and copy routine
  # writes them; only a composite that also proves file content I/O and a
  # block-stride constant can read encryption intent into them.
  - id: cursor-zero-init-for-loop
    desc: Loop initializes a byte cursor
    crit: baseline
    conf: 0.92
    for: [c, cpp, source]
    if:
      type: text
      regex: '(?i)\bfor\s*\(\s*(off|offset|pos|position|cursor)\s*=\s*0\s*;'

  - id: cursor-advance-by-stride
    desc: Loop advances a byte cursor by stride
    crit: baseline
    conf: 0.92
    for: [c, cpp, source]
    if:
      type: text
      regex: '(?i)\b(off|offset|pos|position|cursor)\s*\+=\s*\w+\s*\)'
