defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, go]
  crit: notable
  conf: 0.85

traits:
  - id: native-range-loop-large-bound
    desc: Uses a large-bound native loop
    if:
      type: text
      # A bound below 100 is common in tests and fixed-size protocol cases;
      # reserve this atom for loops that actually repeat a large literal
      # number of times, matching the Python/Rust counterparts.
      regex: '\bfor\s*\([^;\n]{0,40};[^;\n]{0,40}<\s*([1-9][0-9]{2,})\s*;'
