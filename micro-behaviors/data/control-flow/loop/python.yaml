defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-itertools-cycle-call
    desc: Creates a cyclic iterator with itertools.cycle
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: itertools.cycle

  - id: python-range-loop-large-bound
    desc: Uses a large-bound Python range loop
    if:
      type: text
      # Require a literal bound of at least 100 iterations.  The previous
      # 5-99 threshold flagged ordinary fixed-size tables such as range(64),
      # while failing to recognize grouped literals such as range(500_000).
      regex: '\bfor\s+\w+\s+in\s+range\s*\(\s*([1-9][0-9]{2,}|[1-9][0-9]?_[0-9]{3}(_[0-9]{3})*)\b'

  - id: python-range-loop-long-span
    desc: Uses a long Python range span
    if:
      type: text
      regex: '\brange\s*\(\s*[0-9]+\s*,\s*(1[2-9]|[2-9][0-9])'
