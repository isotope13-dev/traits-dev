defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: sleep-near-while-loop
    desc: Sleep call near a while loop header
    for: [scripts, binaries]
    platforms: [unix, windows]
    conf: 0.7
    if:
      type: string_literal
      regex: (while.{0,50}True|while\s+1).{0,50}sleep|sleep.{0,50}while

  - id: python-command-list-loop
    desc: Iterates a list named commands
    conf: 0.75
    if:
      type: text
      substr: for cmd in commands

  - id: python-range-loop-large-bound
    desc: Uses a large-bound Python range loop
    if:
      type: tree-sitter
      kind: loop
      regex: '^\s*for\s+\w+\s+in\s+range\s*\(\s*[1-9](_?[0-9]){2,}\s*\)'

  - id: python-range-loop-long-span
    desc: Uses Python range stop of 100+
    if:
      type: text
      # Two-argument ranges ending below 100 are routine fixed-size loops in
      # crypto and codecs (SM3 uses range(16, 68)).
      regex: '\brange\s*\(\s*[0-9]+\s*,\s*([1-9][0-9]{2,}|[1-9][0-9]?_[0-9]{3}(_[0-9]{3})*)\b'
