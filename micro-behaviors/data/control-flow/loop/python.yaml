defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-range-loop-large-bound
    desc: Uses a large-bound Python range loop
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+range\s*\(\s*([5-9]|[1-9][0-9])'

  - id: python-range-loop-long-span
    desc: Uses a long Python range span
    if:
      type: text
      regex: '\brange\s*\(\s*[0-9]+\s*,\s*(1[2-9]|[2-9][0-9])'
