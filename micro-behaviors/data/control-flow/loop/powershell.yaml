# Neutral PowerShell loop syntax. A foreach loop does not establish that the
# iterated values are paths or that the script is collecting files.
defaults:
  crit: baseline
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-foreach-loop
    desc: PowerShell foreach loop
    conf: 0.5
    if:
      type: text
      regex: '\bforeach\s*\(\s*\$[A-Za-z_]\w*\s+in\b'

  - id: powershell-infinite-loop
    desc: PowerShell unconditional loop
    conf: 0.9
    if:
      type: text
      regex: '\b(while\s*\(\s*\$true\s*\)|for\s*\(\s*;\s*;\s*\))'

  - id: powershell-length-bounded-for-loop
    desc: PowerShell length-bounded for loop
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bfor\s*\([^\)\r\n]{0,120}-lt\s+\$[A-Za-z_][A-Za-z0-9_.:]*\.length\b'
