defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-iterator-callback-api
    desc: Applies PHP callback to iterator elements
    if:
      type: symbol
      kind: call
      exact: iterator_apply
