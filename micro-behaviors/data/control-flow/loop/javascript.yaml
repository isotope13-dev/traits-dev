# Generic JavaScript loop header (while/for)
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: js-while-switch-loop
    desc: JavaScript while loop contains switch dispatch
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (while_statement
          body: (statement_block
            (switch_statement))) @while_switch

  - id: js-loop
    desc: Loop structure
    crit: baseline
    if:
      type: string_literal
      regex: \b(while|for)\s*\(
  - id: js-bounded-while-loop
    desc: JavaScript bounded while loop
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'while\s*\([^)]{0,40}<\s*0?x?[0-9a-fA-F]+\)'
  - id: js-retry-loop-with-success-counter
    desc: Retry loop increments success counter
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)while\s*\(\s*\w+\s*<\s*\d+\s*\)\s*\{\s*try\s*\{.*?\+\+\s*;?\s*\}\s*catch'
  - id: js-large-step-loop
    desc: JavaScript loop uses large constant step
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*[1-9]\d+\)'
  - id: js-small-multistep-loop
    desc: JavaScript loop uses constant step 3-9
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*[3-9]\)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::js-emscripten-preamble-marker
      - id: metadata/library/structure::js-large-module-bundle
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::generated-web-ui-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: js-two-step-loop
    desc: JavaScript loop uses constant step two
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*2\)'
  - id: js-fixed-step-two-source
    desc: JavaScript source loop increments by two
    crit: baseline
    conf: 0.85
    # Fallback for minified or oversized source where the structured loop
    # fact is unavailable; the bounded header still identifies the operation.
    if:
      type: text
      regex: 'for\s*\([^)]{1,320}\+=\s*2\)'
  - id: js-variable-step-loop
    desc: JavaScript loop uses variable step
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*[a-zA-Z_$][\w$]*\)'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::generated-web-ui-bundle
  - id: js-length-loop-compound-add
    desc: Length-bounded loop uses compound addition
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bfor\s*\([^)]{0,40}\.length[\s\S]{0,40}\+='
  # The reversed branch needs `\b` in front of the digit run: without it the
  # digit suffix of a mangled identifier counted as the bound, so obfuscator.io
  # output matched on `for(let _0x405643=...;_0x405643<_0xNNNN[...]` — the
  # "large bound" was the tail of the loop *variable's* name, not a literal.
  - id: js-large-bound-loop-cluster
    desc: JavaScript loops with large numeric bounds
    crit: notable
    conf: 0.9
    size_min: 20000
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120}([<>]\s*[0-9]{6,}|\b[0-9]{6,}\s*[<>])[^;]{0,60};'
  # Iteration-protocol mechanics, relocated from micro-behaviors/data/source/unsafe
  # where they were graded notable next to memory-corruption primitives. Declaring
  # `Symbol.iterator` and pumping a value with `.next()` is how every generator,
  # spread, for-of and transpiled async helper works — and `.next()` is also
  # jQuery's next-sibling walk. The HTMLRewriter use-after-free composite in
  # objectives/execution/exploit/memory references both cross-directory.
  - id: js-symbol-iterator-member
    desc: Declares the Symbol.iterator protocol member
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: Symbol.iterator
  - id: js-iterator-next-call
    desc: Advances a value with a next() call
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.next$'
  - id: js-object-key-in-loop
    desc: JavaScript iterates enumerable object keys
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'for\s*\(\s*(var|let|const)\s+[A-Za-z_$][A-Za-z0-9_$]*\s+in\s+[A-Za-z_$][A-Za-z0-9_$]*\s*\)'

  # Generic do-while syntax (not WSH-specific). WSH readyState wait composites
  # reference these; the WScript/ActiveX legs supply the script-host intent.
  - id: js-do-block-open
    desc: JavaScript do-while block opener
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: 'do\s*\{'

  - id: js-do-while-close
    desc: JavaScript do-while loop closer
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '\}\s*while'
