defaults:
  platforms:
  - unix
  - windows
  crit: component
  conf: 0.9

traits:
  - id: serial-range-counter
    crit: notable
    desc: Range loop uses serial-named counter
    for: [python]
    if:
      type: text
      regex: '(?i)\bfor\s+(\w+_)?serial(_?number|_?num|_?no)?\s+in\s+range\s*\('


composite_rules:
  - id: incrementing-serial-counter
    desc: Incrementing loop uses serial-named counter
    for: [javascript, typescript, c, cpp, java]
    all:
      - id: metadata/lang/source/syntax/control-flow::serial-loop-variable
      - id: metadata/lang/source/syntax/assignment/name::serial-variable-add-assignment
    near_lines: 3
