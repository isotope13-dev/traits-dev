defaults:
  platforms: [linux]
  for: [elf]
  arch: [sparc]

traits:
  # Repeated indexed call loops: call, increment and compare the index,
  # branch back through the body, then branch back to the outer loop.
  - id: sparc-repeated-indexed-call-loops
    desc: Repeated SPARC indexed call loops
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: '40 ?? ?? ?? 9A 10 20 10 C2 07 BF F4 84 00 60 01 80 A0 80 18 06 BF ?? ?? C4 27 BF F4 10 BF'
