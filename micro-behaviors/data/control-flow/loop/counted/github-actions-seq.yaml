defaults:
  platforms: [windows, linux, macos]
  for: [github_actions]
traits:
  - id: github-actions-seq-loop
    desc: Workflow step loops over a seq range
    crit: notable
    conf: 0.9
    if:
      type: value
      path: runs.steps[*].run
      regex: 'for\s+\w+\s+in\s+\$\(seq\s+1\s+\d{2,}\)'
