defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  crit: notable
  conf: 0.85

traits:
  - id: python-range-loop-large-bound
    desc: Uses a large-bound Python range loop
    if:
      type: tree-sitter
      kind: loop
      regex: '^\s*for\s+\w+\s+in\s+range\s*\(\s*[1-9](_?[0-9]){2,}\s*\)'

