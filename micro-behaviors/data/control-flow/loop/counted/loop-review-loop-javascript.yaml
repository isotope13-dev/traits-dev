defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
  - id: js-bounded-while-loop
    desc: JavaScript bounded while loop
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'while\s*\([^)]{0,40}<\s*0?x?[0-9a-fA-F]+\)'
  - id: js-large-step-loop
    desc: JavaScript loop uses large constant step
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*[1-9]\d+\)'
  - id: js-small-multistep-loop
    desc: JavaScript loop uses constant step 3-9
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*[3-9]\)'
    unless:
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::generated-web-ui-bundle
  - id: js-two-step-loop
    desc: JavaScript loop uses constant step two
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*2\)'
  - id: js-variable-step-loop
    desc: JavaScript loop uses variable step
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120};\s*[\w$]+\s*\+=\s*[a-zA-Z_$][\w$]*\)'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::generated-web-ui-bundle
  - id: js-length-loop-compound-add
    desc: Length-bounded loop uses compound addition
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bfor\s*\([^)]{0,40}\.length[\s\S]{0,40}\+='
  # The reversed branch needs `\b` in front of the digit run: without it the
  # digit suffix of a mangled identifier counted as the bound, so obfuscator.io
  # output matched on `for(let _0x405643=...;_0x405643<_0xNNNN[...]` — the
  # "large bound" was the tail of the loop *variable's* name, not a literal.
  - id: js-large-bound-loop-cluster
    desc: JavaScript loops with large numeric bounds
    crit: notable
    conf: 0.9
    size_min: 20000
    if:
      type: text
      regex: 'for\s*\([^;]{1,120};[^;]{1,120}([<>]\s*[0-9]{6,}|\b[0-9]{6,}\s*[<>])[^;]{0,60};'
