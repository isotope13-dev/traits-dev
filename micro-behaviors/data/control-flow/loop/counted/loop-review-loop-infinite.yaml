defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - java
  - javascript
  - go
  - php
  - shell

traits:
  - id: receiver-loop-bound-1024
    desc: Receiver iterates one thousand times
    crit: notable
    for: [scripts, source]
    if:
      type: text
      regex: '\b1024\.(times|each)\b|\b1\.\.1024\b'
