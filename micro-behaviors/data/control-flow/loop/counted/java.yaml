defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: java-named-offset-range-loop
    desc: Loops over named offset range
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: 'for\s*\(\s*int\s+\w+\s*=\s*[A-Za-z_]\w*\s*;\s*\w+\s*<\s*\w+\s*\+\s*\w+'


  - id: java-array-tail-scan
    desc: Scans array from a nonzero offset
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: 'for\s*\(\s*int\s+\w+\s*=\s*[1-9][0-9]*\s*;\s*\w+\s*<\s*\w+\.length'
