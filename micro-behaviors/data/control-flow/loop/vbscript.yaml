defaults:
  platforms: [windows]
  for: [vbs, html]
traits:
  - id: vbs-for-step-two
    desc: VBScript For loop advances by two
    crit: notable
    conf: 0.94
    if:
      type: text
      # Hex-pair decoders step over the input two digits at a time. A bare
      # "Step 2" also matches numbered comments ("' --- Step 2.").
      regex: '(?i)\bFor\s+\w+\s*=\s*\w+\s+To\s+[^\r\n]{1,60}\sStep\s+2\b'
