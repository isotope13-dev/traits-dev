defaults:
  crit: notable
  platforms: [windows]
  for: [powershell, batch]

traits:
  - id: powershell-decimal-triplet-loop
    desc: PowerShell loop increments its counter by three
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bfor\s*\(\s*\$[A-Za-z_]\w*\s*=\s*0\s*;.{0,80}\+=\s*3\s*\)'
