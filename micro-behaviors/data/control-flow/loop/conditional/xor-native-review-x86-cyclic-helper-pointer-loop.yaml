defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
traits:
  - id: x86-cyclic-helper-pointer-loop
    desc: x86 helper loop resets an input pointer
    conf: 0.97
    if:
      type: hex
      section: text
      # Preserve key length, process one byte, and rewind ESI on key exhaustion.
      pattern: '8B D8 57 53 53 E8 ?? ?? ?? ?? 85 C0 74 07 49 75 ?? 5B 5B 5F C3 5B 2B F3 53 EB ??'
