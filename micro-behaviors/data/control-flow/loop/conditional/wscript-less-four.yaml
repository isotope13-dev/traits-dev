defaults:
  platforms: [windows]
  for: [javascript]
  conf: 0.8
traits:
  - id: wscript-while-less-four-text
    desc: WScript text in a less-than-four loop
    crit: notable
    if:
      type: text
      # while (obj.readyState < 4) { WScript.Sleep(1000); }
      # Regex matches: while (... < 4) { ...WScript... }
      regex: 'while\s*\([^)]{0,120}<\s*4\s*\)\s*\{[^}]{0,120}WScript[^}]{0,120}\}'
