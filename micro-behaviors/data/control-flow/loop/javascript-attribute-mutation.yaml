defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: attribute-mutation-growth-loop
    desc: Loops while setting attributes
    crit: suspicious
    if:
      type: tree-sitter
      kind: loop
      # A two-digit bound is a menu or shortcut walk (ten entries). Backing-store
      # growth needs a three-digit trip count.
      regex: 'for\s*\([\s\S]{0,80};[\s\S]{0,80}<\s*\d{3,}[\s\S]{0,400}\.setAttribute\s*\('
    unless:
      - id: well-known/lib/ui/tempus-dominus::tempus-dominus-library
      - id: metadata/build/minifier::js-large-minified-bundle

