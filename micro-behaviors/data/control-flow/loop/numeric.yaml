defaults:
  platforms: [unix, windows]

traits:
  - id: python-numeric-range-loop
    desc: Python loop over a numeric range
    crit: baseline
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+range\s*\(\s*[0-9]+(\s*,\s*[0-9]+)?\s*\)'

  - id: native-numeric-bound-loop
    desc: Native loop with a numeric bound
    crit: baseline
    conf: 0.8
    for: [c, cpp, go]
    if:
      type: text
      regex: '\bfor\s*\([^;\n]{0,40};[^;\n]{0,40}<\s*[0-9]+\s*;'

  - id: rust-numeric-range-loop
    desc: Rust loop over a numeric range
    crit: baseline
    conf: 0.8
    for: [rust]
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+0\.\.[=]?[0-9]+'
