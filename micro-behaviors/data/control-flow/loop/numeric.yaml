defaults:
  platforms: [unix, windows]

traits:
  - id: python-numeric-range-loop
    desc: Python loop over a numeric range
    crit: baseline
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+range\s*\(\s*[0-9]+(\s*,\s*[0-9]+)?\s*\)'

  - id: native-numeric-bound-loop
    desc: Native loop with a numeric bound
    crit: baseline
    conf: 0.8
    for: [c, cpp, go]
    if:
      type: text
      regex: '\bfor\s*\([^;\n]{0,40};[^;\n]{0,40}<\s*[0-9]+\s*;'

  - id: rust-numeric-range-loop
    desc: Rust loop over a numeric range
    crit: baseline
    conf: 0.8
    for: [rust]
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+0\.\.[=]?[0-9]+'

  - id: java-multiple-byte-range-loops
    desc: Java has multiple 256-bound loops
    crit: baseline
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin]
    count_min: 2
    if:
      type: text
      regex: 'for\s*\([^;\n]{0,50};[^;\n]{0,50}<\s*256\s*;'

  # Iterating the full 0..255 byte space. Neutral on its own -- lookup tables,
  # codec tables and charset detectors all do it -- so it lives here as a loop
  # shape; byte-exhaustion *attacks* compose it under objectives/.
  - id: python-full-byte-search-loop
    desc: Python loops over all byte values
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'for\s+\w+\s+in\s+range\s*\(\s*256\s*\)'

  - id: go-full-byte-search-loop
    desc: Go loops over all byte values
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: 'for\s+\w+\s*:=\s*0\s*;\s*\w+\s*<\s*256\s*;[^\n]{0,80}\+\+'

  - id: c-family-full-byte-search-loop
    desc: C-family loops over all byte values
    crit: notable
    conf: 0.88
    for: [c, cpp, csharp, java, javascript, typescript]
    if:
      type: text
      regex: 'for\s*\([^;]{0,40}=\s*0\s*;[^;]{0,40}<\s*256\s*;'

