defaults:
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: rust-loop-statement
    desc: Rust infinite loop statement (loop {})
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'loop\s*\{'
  - id: rust-while-loop
    desc: Rust while loop
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: 'while\s+'
  - id: rust-range-loop-large-bound
    desc: Uses a large-bound Rust range loop
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+0\.\.[5-9]'
