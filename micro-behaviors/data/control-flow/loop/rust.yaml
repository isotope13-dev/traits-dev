defaults:
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: rust-loop-statement
    desc: Rust infinite loop statement (loop {})
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'loop\s*\{'
  - id: rust-while-loop
    desc: Rust while loop
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: 'while\s+'
  # Relocated from objectives/anti-static/obfuscation/encoding/base64/: the
  # matcher is a bare `.iter()`, the most common expression in Rust, and filing
  # it under Base64 obfuscation reported every collection walk (hashbrown's
  # rayon adapters, for one) as string-fragment decoding evidence. The
  # base64 fragment-join composite still references it from here; its decode
  # and join legs carry the obfuscation intent.
  - id: rust-iter-call
    desc: Rust creates an iterator with .iter()
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.iter\s*\(\s*\)'
  # Same story as `.iter()` above: `.collect()` is the terminal half of nearly
  # every Rust iterator chain, so filing it under Base64 obfuscation as "joins
  # string fragments" mislabelled ordinary collection code.
  - id: rust-collect-call
    desc: Rust materializes an iterator with .collect()
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.collect\b'
  - id: rust-range-loop-large-bound
    desc: Uses a 100-or-more-bound Rust range loop
    crit: notable
    conf: 0.85
    # Unit tests and Criterion benches routinely iterate 100–1000 keys; that is
    # not the oversized-iteration signal used by exploit composites.
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
      - type: path
        regex: '(?i)(^|/)(tests|benches)/'
    if:
      type: text
      regex: '\bfor\s+\w+\s+in\s+0\.\.[1-9][0-9]{2,}\b'
