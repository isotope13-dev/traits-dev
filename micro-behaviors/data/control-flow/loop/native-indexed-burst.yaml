defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-indexed-handle-burst-loop
    desc: Indexed handles in a counted call loop
    conf: 0.95
    if:
      type: hex
      section: .text
      # Mask an index into a handle array, pass four helper arguments,
      # decrement the burst count and branch back. No call address is fixed.
      pattern: 'E8 [4] 44 21 E8 48 8B 8C C5 [4] 48 89 FA 4D 89 F0 49 89 D9 E8 [4] 41 FF CC 75 ??'
