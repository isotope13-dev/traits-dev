defaults:
  platforms: [unix]
  for: [shell]
  crit: baseline

traits:
  - id: shell-for-loop-over-var
    desc: shell for loop over variable
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\bfor\s+[A-Za-z_]\w*\s+in\s+\$[A-Za-z_]\w*'
  - id: shell-large-numeric-sequence-loop
    desc: Uses a 100-or-more-bound shell sequence loop
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bfor\s+[A-Za-z_]\w*\s+in\s+\$\(\s*seq\s+([0-9]+\s+)?[1-9][0-9]{2,}\s*\)'
