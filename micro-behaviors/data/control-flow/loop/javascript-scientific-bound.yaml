# Canonical numeric-bound loop observation, including scientific notation.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: numeric-loop-bound-at-least-32
    desc: Loop numeric bound is 32 or greater
    crit: notable
    conf: 0.96
    if:
      type: text
      # Exclude exponent literals in initializer calls and require a complete
      # numeric comparison operand. A numeric bound alone proves no CPU abuse.
      regex: 'for\s*\([^;]{0,120};[^;]{0,64}<=?\s*(3[2-9]|[4-9]\d|[1-9]\d{2,}|1e[6-9])\s*;'
