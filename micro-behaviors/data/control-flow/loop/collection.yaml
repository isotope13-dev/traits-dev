# Collection-name loop markers used by account-at-scale composites. Parse loop
# nodes so prose and comments containing these names do not count as loops.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: user-collection-loop
    desc: Iterates over a collection named users
    if:
      type: tree-sitter
      kind: loop
      regex: '(?i)\b(for|foreach)\b.{0,24}\b(user|username)\b.{0,24}\b(users|usernames)\b'

  - id: account-collection-loop
    desc: Iterates over a collection named accounts
    if:
      type: tree-sitter
      kind: loop
      regex: '(?i)\b(for|foreach)\b.{0,24}\baccount\b.{0,24}\baccounts\b'

  - id: csharp-user-collection-loop
    desc: C# iterates over a collection named users
    for: [csharp]
    if:
      type: tree-sitter
      kind: loop
      regex: '(?i)\bforeach\b.{0,24}\b(user|username)\b.{0,24}\b(users|usernames)\b'

  - id: csharp-account-collection-loop
    desc: C# iterates over a collection named accounts
    for: [csharp]
    if:
      type: tree-sitter
      kind: loop
      regex: '(?i)\bforeach\b.{0,24}\baccount\b.{0,24}\baccounts\b'

  - id: script-user-collection-loop
    desc: Script loops over user collection
    for: [python, powershell]
    if:
      type: tree-sitter
      kind: loop
      regex: '(?i)\b(for|foreach)\s*\(?\s*\$?(user|username)\s+in\s+\$?(users|usernames)\b'

  - id: script-account-collection-loop
    desc: Script loops over account collection
    for: [python, powershell]
    if:
      type: tree-sitter
      kind: loop
      regex: '(?i)\b(for|foreach)\s*\(?\s*\$?account\s+in\s+\$?accounts\b'
