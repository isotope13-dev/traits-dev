# Neutral source and operation observations.
traits:
- id: shell-address-named-for-loop
  desc: Shell for-loop uses address-like variable name
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  platforms:
  - unix
  for:
  - shell
  if:
    type: text
    regex: for\s+ip\s+in|for\s+(host|addr)\s+in\s+([0-9]|\$\(\s*(cat|seq|printf))
