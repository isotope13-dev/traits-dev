defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: while-loop-try-block
  desc: While loop contains a try block
  crit: notable
  unless:
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/build/bundler/wrapper::babel-transpiled
  if:
    type: text
    regex: "(?s)while\\s*\\(([^()]|\\([^()]{0,120}\\))*\\)\\s*\\{[^}]{0,300}\\s*try\\s*\\{"
  not:
  - regex: "while\\s*\\(_\\)\\s*\\{\\s*try"
  - regex: "(?i)while\\s*\\([^)]*(time|date|now|timeout|attempt|retry|limit)[^)]*\\)"
- id: for-loop-try-block
  desc: For loop contains a try block
  crit: notable
  size_max: 50000
  unless:
  - id: metadata/build/bundler/wrapper::babel-transpiled
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  if:
    type: text
    regex: "(?s)for\\s*\\(([^()]|\\([^()]{0,120}\\))*\\)\\s*\\{[^}]{0,300}\\s*try\\s*\\{"
  not:
  - regex: "for\\s*\\(\\s*;\\s*i\\s*<\\s*l;\\s*i\\+\\+\\)\\s*\\{\\s*try\\s*\\{"
  - regex: "for\\s*\\([^)]*\\)\\s*\\{[^}]*//[^}]*try\\s*\\{"
  - regex: "for\\s*\\(\\s*var\\s+\\w+\\s+in\\b"
  - regex: "for\\s*\\(\\s*(const|let|var)\\s+\\w+\\s+of\\b"
  - regex: "for\\s*\\(\\s*(const|let|var)\\s+\\w+\\s*="
  - regex: "(?s)for\\s*\\([^)]*\\)\\s*\\{[^}]{0,300}createSyncAccessHandle\\("
