# References and API co-occurrence do not establish bound data flow.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: invalid-port-diagnostic
  desc: Invalid-port argument diagnostic format
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: \binvalid port\b\s*:\s*%s
