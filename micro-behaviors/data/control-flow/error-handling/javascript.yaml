defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: empty-catch-block
  desc: JavaScript silently discards caught errors
  crit: component
  conf: 0.9
  if:
    type: tree-sitter
    language: javascript
    query: |
      (catch_clause
        body: (statement_block) @body
        (#eq? @body "{}"))
# Optional-binding empty catch (`catch {}`) is common in silent npm relays
# where tree-sitter catch_clause matching may not emit. Text keeps the
# observation visible for composites that need a swallowed-error leg.
- id: empty-optional-catch-block
  desc: JavaScript empty optional-binding catch
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'catch\s*\{\s*\}'
- id: empty-named-catch-block
  desc: JavaScript empty named-parameter catch
  crit: notable
  conf: 0.92
  # Sentry's bundler plugin wraps its generated debug-ID stack map in a
  # best-effort try/catch. The empty handler is build instrumentation, not
  # application error suppression.
  unless:
  - id: metadata/build/debug::sentry-debug-id-wrapper
  if:
    type: text
    regex: 'catch\s*\(\s*\w*\s*\)\s*\{\s*\}'
# `catch { return false }` — the failure is absorbed and reported as a plain
# flag, so the caller learns only that something did not happen and never what.
# Ordinary feature detection is written this way too, which is why this stays
# notable; it matters in composites because a helper that both hides which
# builtin it loaded and refuses to say why it failed leaves an operator no
# trace to read and a reviewer no error to follow.
- id: catch-returns-constant-only
  desc: Catch block only returns a constant
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'catch\s*(\(\w*\))?\s*\{\s*return (false|true|null|undefined|0)\s*;?\s*\}'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: silent-error-handler
  desc: JavaScript emitter discards errors
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.on\(['"]error['"],\s*(\(\)\s*=>|function\s*\([^)]{0,20}\))\s*\{\s*\}\)
- id: fetch-empty-catch-handler
  desc: Fetch promise uses empty catch handler
  if:
    type: text
    regex: 'fetch\s*\([^)]{0,240}\)\s*\.catch\s*\(\s*\(\s*\)\s*=>'
- id: catch-before-await-or-require
  desc: Catch block precedes await or require call
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: catch\s*\(\s*\w*\s*\)\s*\{\s*\}.{0,80}(await|require\()
  not:
    - substr: webpackLoadOptionalExternalModule
  unless:
    - id: metadata/library/web-frameworks::has-frontend-framework-hooks
- id: promise-identity-then-empty-catch
  desc: Promise forwards result and discards errors
  crit: component
  conf: 0.99
  if:
    type: text
    substr: .then(e => e).catch(e => { })
- id: from-str-empty-catch
  desc: Empty catch follows from_str call
  crit: component
  conf: 0.97
  size_max: 65536
  if:
    type: text
    regex: 'from_str[\s\S]{0,240}catch\s*\([A-Za-z_][A-Za-z0-9_]*\)\s*\{\s*\}'
  unless:
    - type: text
      substr: instantiateWasm
  downgrade:
    any:
      - id: metadata/package/testing/
      - type: basename
        regex: '(?i)\.(spec|test)\.[jt]s$'
