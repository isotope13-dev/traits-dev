defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - php
  id: php-laravel-strict-validation-abort
  desc: Laravel strict mode aborts on validation failure
  conf: 0.93
  if:
    type: text
    regex: strict_mode[\s\S]{0,900}abort\s*\(\s*500|abort\s*\(\s*500[\s\S]{0,900}strict_mode
composite_rules:
- for:
  - zip
  - php
  id: php-laravel-remote-validation-availability-gate
  desc: Laravel validation can abort application requests
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/communications/http/post::php-laravel-remote-validation-post
  - id: micro-behaviors/data/control-flow/error-handling::php-laravel-strict-validation-abort
