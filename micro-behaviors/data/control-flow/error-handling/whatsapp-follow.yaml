defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # Match the invocation inside the try guarded by this empty catch.
  # A WMex metadata read is not a follow; a later unrelated empty catch
  # does not guard an earlier call. Awaited and synchronous calls retain
  # their lexical guard without claiming that unawaited rejections are caught.
  - id: whatsapp-follow-empty-catch-guard
    desc: Follow invocation inside empty-catch guard
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((try_statement
          body: (statement_block (expression_statement (call_expression function: [(identifier) @callee (member_expression property: (property_identifier) @callee)] arguments: (arguments))))
          handler: (catch_clause body: (statement_block) @handler)) @guard
          (#eq? @callee "newsletterFollow")
          (#match? @handler "^\\{[ \\t\\r\\n]*\\}$"))
        ((try_statement
          body: (statement_block (expression_statement (await_expression (call_expression function: [(identifier) @callee (member_expression property: (property_identifier) @callee)] arguments: (arguments)))))
          handler: (catch_clause body: (statement_block) @handler)) @guard
          (#eq? @callee "newsletterFollow")
          (#match? @handler "^\\{[ \\t\\r\\n]*\\}$"))
        ((try_statement
          body: (statement_block (expression_statement (call_expression function: [(identifier) @callee (member_expression property: (property_identifier) @callee)] arguments: (arguments . (_) . [(member_expression property: (property_identifier) @operation) (identifier) @operation]))))
          handler: (catch_clause body: (statement_block) @handler)) @guard
          (#match? @callee "^executeWMexQuery(IgnoreResponse)?$")
          (#eq? @operation "FOLLOW")
          (#match? @handler "^\\{[ \\t\\r\\n]*\\}$"))
        ((try_statement
          body: (statement_block (expression_statement (await_expression (call_expression function: [(identifier) @callee (member_expression property: (property_identifier) @callee)] arguments: (arguments . (_) . [(member_expression property: (property_identifier) @operation) (identifier) @operation])))))
          handler: (catch_clause body: (statement_block) @handler)) @guard
          (#match? @callee "^executeWMexQuery(IgnoreResponse)?$")
          (#eq? @operation "FOLLOW")
          (#match? @handler "^\\{[ \\t\\r\\n]*\\}$"))
