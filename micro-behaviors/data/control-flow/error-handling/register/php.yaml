defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-error-handler-registration
    desc: Registers PHP error handler
    if:
      type: symbol
      kind: call
      exact: set_error_handler
  - id: php-exception-handler-registration
    desc: Registers PHP exception handler
    if:
      type: symbol
      kind: call
      exact: set_exception_handler
