defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-form-post-empty-rescue
    desc: Ruby form POST errors silently rescued
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((begin
          (call receiver: (scope_resolution) @http
            method: (identifier) @post) @evidence
          (rescue) @rescue)
          (#eq? @http "Net::HTTP")
          (#eq? @post "post_form")
          (#match? @rescue "^rescue[ \t\r\n]*$"))
  - id: ruby-empty-standard-error-rescue
    desc: Ruby silently rescues standard errors
    crit: baseline
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((rescue) @rescue
          (#match? @rescue "^rescue[ \t\r\n]*$"))
