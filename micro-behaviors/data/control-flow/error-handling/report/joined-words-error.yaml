defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: joined-words-forwarded-then-error
    desc: Awaits joined words then sets error state
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'await\s+[\w$]+\([\w$]+\.join\(["''] ["'']\)\),[\w$]+\(["'']error["'']\)'
  # The non-mnemonic sibling: entered text is labeled and forwarded to a
  # sender that error-navigates (`await nu(tt),Te("error")` after building
  # `` `[${label}]: ${secret}` ``). The join() above proves word-list
  # assembly; this proves handoff-to-sender, so it needs a secret-entry
  # label plus an encoded POST in the composite to mean theft.
  - id: forwarded-text-then-error
    desc: Awaits forwarded text then sets error state
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'await\s+[\w$]+\([\w$]+\),[\w$]+\(["'']error["'']\)'
