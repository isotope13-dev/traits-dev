defaults:
  conf: 0.99
  platforms: [unix, windows]

# Generic Rust evidence; HTTP framing context is supplied by consumers.
traits:
  - id: rust-error-result-source
    desc: Rust error-result checks or ParseError reference
    crit: notable
    for: [rust]
    if:
      type: text
      regex: '(?i)(\.(is_err|unwrap_err|expect_err)\s*\(|expect_parse_err!|assert_err!|\bParseError\b)'
