defaults:
  crit: baseline
  platforms: [windows, unix]
traits:
  - id: go-err-nil-check
    desc: Go nil-check text in a literal
    conf: 0.6
    for:
      - go
    if:
      type: string_literal
      substr: if err != nil
  - id: go-errors-new
    desc: Go errors.New reference in a literal
    conf: 0.6
    for:
      - go
    if:
      type: string_literal
      substr: errors.New
  - id: go-fmt-errorf
    desc: Go fmt.Errorf reference in a literal
    conf: 0.6
    for:
      - go
    if:
      type: string_literal
      substr: fmt.Errorf
  - id: rust-result-type
    desc: Rust Result reference in a literal
    conf: 0.6
    for:
      - rust
    if:
      type: string_literal
      substr: Result<
  - id: rust-unwrap-or
    desc: Rust unwrap_or reference in a literal
    conf: 0.6
    for:
      - rust
    if:
      type: string_literal
      substr: unwrap_or
  - id: try-block-open
    desc: Literal contains try-block opening text
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      regex: '\btry[ \t]{1,8}\{'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: catch-keyword
    desc: Literal contains the catch keyword
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      word: catch
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: except-keyword
    desc: Literal contains the Python except keyword
    conf: 0.5
    for:
      - python
    if:
      type: string_literal
      word: except
  - id: finally-keyword
    desc: Literal contains the finally keyword
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      word: finally
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
