# Error Handling Control Flow - Python
# Detects Python exception handling and error suppression patterns
# MBC: C0027 (Error Handling)
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: "C0027"
traits:
  - id: importerror-keyword
    desc: ImportError exception
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: "ImportError"

  # Moved from objectives/command-and-control/backdoor/proxy/socks (where it
  # was filed as tunnel evidence): defining custom exception classes is a
  # neutral capability. Ordinary SDKs (requests, urllib3) define these, so
  # the backdoor directory and the T1572 mapping overstated the matcher.
  # The SOCKS tunnel composites reference this atom from their home.
  - id: connection-exception-class
    desc: Defines connection exception classes
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'class\s+(Connection\w+Error|Exit\w*Exception|Close\w*Exception)\b'
    unless:
      - type: path
        regex: '(^|[/])socketio/exceptions\.py$'

