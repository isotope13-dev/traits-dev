defaults:
  platforms: [unix, windows]
composite_rules:
  - id: go-error-handling
    desc: Go error-handling literal vocabulary
    crit: baseline
    conf: 0.7
    for: [go]
    needs: 2
    any:
      - {id: 'micro-behaviors/data/control-flow/error-handling::go-err-nil-check'}
      - {id: 'micro-behaviors/data/control-flow/error-handling::go-errors-new'}
      - {id: 'micro-behaviors/data/control-flow/error-handling::go-fmt-errorf'}
  # Rust error handling helper
  - id: rust-error-handling
    desc: Rust error-handling literal vocabulary
    crit: baseline
    conf: 0.7
    for: [rust]
    needs: 2
    any:
      - {id: 'micro-behaviors/data/control-flow/error-handling::rust-result-type'}
      - {id: 'micro-behaviors/data/control-flow/error-handling::rust-unwrap-or'}
  # Generic try/catch helper
  - id: try-catch-handling
    desc: Try/catch literal vocabulary
    crit: baseline
    conf: 0.7
    for: [javascript, python, java, csharp]
    needs: 2
    any:
      - {id: 'micro-behaviors/data/control-flow/error-handling::try-block-open'}
      - {id: 'micro-behaviors/data/control-flow/error-handling::catch-keyword'}
      - {id: 'micro-behaviors/data/control-flow/error-handling::except-keyword'}
      - {id: 'micro-behaviors/data/control-flow/error-handling::finally-keyword'}
  # Error handling patterns (combines all)
  - id: error-handling
    desc: Error-handling literal vocabulary
    crit: baseline
    conf: 0.8
    any:
      - {id: go-error-handling}
      - {id: rust-error-handling}
      - {id: try-catch-handling}
  # Logging presence
