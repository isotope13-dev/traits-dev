defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: java-array-bounds-catch
    desc: Catches array bounds exception
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: 'catch\s*\(\s*ArrayIndexOutOfBoundsException\s+\w+'


  - id: java-illegal-argument-catch
    desc: Catches illegal argument exception
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: 'catch\s*\(\s*IllegalArgumentException\s+\w+'
