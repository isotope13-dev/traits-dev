defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: install-catch-option-clues
    desc: Caught install call and option clues
    crit: notable
    conf: 0.95
    near_bytes: 400
    all:
      - id: micro-behaviors/data/control-flow/error-handling/catch::install-call-in-catch
    any:
      - id: metadata/lang/source/syntax/object::install-opt-no-save-prop
      - id: metadata/lang/source/syntax/object::install-opt-silent-loglevel-prop
      - id: metadata/lang/source/syntax/object::install-opt-no-warnings-prop
      - id: metadata/lang/source/syntax/object::install-opt-no-progress-prop
    needs: 1
