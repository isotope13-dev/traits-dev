defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
- id: catch-before-await-or-require
  desc: Catch block precedes await or require call
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: catch\s*\(\s*\w*\s*\)\s*\{\s*\}.{0,80}(await|require\()
  not:
    - substr: webpackLoadOptionalExternalModule
  unless:
    - id: micro-behaviors/ui/window/hook::frontend-component-hook-literal
