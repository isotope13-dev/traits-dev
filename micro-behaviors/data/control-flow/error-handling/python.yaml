# Error Handling Control Flow - Python
# Detects Python exception handling and error suppression patterns
# ATT&CK: T1027 (Obfuscated Files or Information)
# MBC: C0027 (Error Handling)
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1027"
  mbc: "C0027"
traits:
  - id: except-keyword-dup
    desc: except keyword
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: 'except\s+(ImportError|InvalidToken|Exception)'
  - id: importerror-keyword
    desc: ImportError exception
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: "ImportError"
  - id: silent-exception-pass
    desc: "exception suppression via try/except pass"
    crit: notable
    conf: 0.85
    if:
      type: text
      # Treat only broad except:pass as notable suppression, not specific exception handlers.
      regex: '(?m)^\s*except\s*(Exception|BaseException|):\s*\n\s*pass\b'
    unless:
      - type: basename
        regex: '(^|[!/])DebugServer\.py$'
  - id: silent-socket-error-pass
    desc: Silent socket error suppression
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*except\s+socket\.error\s*:\s*\n\s*pass\b'

  # A broad handler that binds the error to a name -- the shape that goes on
  # to do something with it rather than discard it (`silent-exception-pass`
  # above covers the discard). Neutral on its own: ordinary code logs or
  # wraps errors this way. Paired below with an append-mode file write.
  - id: broad-exception-bound-catch
    desc: Catches broad Exception into a variable
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'except\s+(Exception|BaseException)\s+as\s+\w+\s*:'

  - id: python-import-error-handler
    desc: Handles a missing-module ImportError
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: 'except\s+(ImportError|ModuleNotFoundError)\b[^:]{0,80}:'

  - id: python-permission-error-handler
    desc: Python PermissionError except handler
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'except\s+PermissionError\b'

  - id: broad-exception-return-suppression
    desc: Broad exception returns failure sentinel
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'except\s+(Exception|BaseException)\s*:[\s\S]{0,160}\breturn\s+(False|None)\b'

  - id: ruby-rescue-exception-broad
    desc: Ruby catches broad Exception
    crit: notable
    conf: 0.78
    for: [ruby]
    if:
      type: string_literal
      substr: rescue Exception

  - id: ruby-begin-yield-rescue-wrapper
    desc: Ruby yield wrapped by rescue
    crit: notable
    conf: 0.76
    for: [ruby]
    if:
      type: string_literal
      regex: begin.{0,80}yield.{0,80}rescue

  - id: network-error-handler
    desc: Handles HTTP, URL or connection errors
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'except\s+[\w.]*\b(HTTPError|URLError|ConnectionError|TimeoutError)\b'

composite_rules:
  # The handler neither re-raises nor returns a sentinel the caller can check:
  # it appends the error text to a file and carries on, so the failure is
  # invisible to whatever invoked the code and the file is the only record.
  # Ordinary logging has the same shape, which is why this stays neutral --
  # composites supply the context that makes silent-by-design handling mean
  # something.
  - id: broad-exception-appends-to-file
    desc: Broad except appends error to a file
    crit: notable
    conf: 0.85
    near_bytes: 256
    all:
      - id: broad-exception-bound-catch
      - id: micro-behaviors/fs/file/open::write-append-create-mode
