defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-postinstall-empty-error-listener
    desc: Postinstall text registers empty error listener
    crit: notable
    conf: 0.96
    if:
      type: value
      path: scripts.postinstall
      regex: '\.on\(\s*["'']error["'']\s*,\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)'
