defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
traits:
  - id: php-disable-error-display
    desc: Disables PHP error display with ini_set
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: ini_set
      args:
        - index: 0
          kind: string
          exact: display_errors
        - index: 1
          kind: string
          regex: '^(?i:0|off|false)$'

  - id: error-reporting-off
    desc: Disables error reporting (error_reporting(0))
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: error_reporting
      arg:
        index: 0
        kind: number
        value: 0

  - id: php-disable-error-logging
    desc: Disables PHP error logging with ini_set
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: ini_set
      args:
        - index: 0
          kind: string
          exact: log_errors
        - index: 1
          kind: string
          regex: '^(?i:0|off|false)$'

  - id: error-suppress-prefix
    desc: Suppresses errors with the PHP @ operator
    conf: 0.7
    if:
      type: tree-sitter
      node: error_suppression_expression
      regex: .{1,120}
    unless:
      # WooCommerce payment gateways use @floatval on threshold settings
      # to coerce nullable option values without type warnings.
      - type: text
        regex: '@floatval\s*\('
