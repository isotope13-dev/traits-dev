defaults:
  platforms: [windows, unix]
traits:
  - id: js-global-error-suppression
    desc: Browser onerror suppresses error reporting
    crit: notable
    conf: 0.9
    for: [javascript, html, vbs, text, data, mp3]
    if:
      # Returning true suppresses browser error reporting.
      type: text
      regex: '(?i)\bwindow\.onerror\s*=\s*function[^)]{0,20}\)\s*\{\s*return\s+true'

