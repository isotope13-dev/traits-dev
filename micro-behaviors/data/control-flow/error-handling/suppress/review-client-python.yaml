# HTTP request evidence review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-request-error-returns-none
  desc: Request error returns None
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: "(?m)^[ \\t]*except\\s+requests\\.\\w+\\s+as\\s+\\w+\\s*:\\s*\\n[ \\t]*return
      None\\b"
