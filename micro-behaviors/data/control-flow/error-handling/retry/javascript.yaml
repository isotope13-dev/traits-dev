defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
- id: decremented-retry-argument-text
  desc: Call with decremented retry counter
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\w+\([^)(]{0,80}\b(retry|retries|attempts?|retryCount)\s*-\s*1\s*\)'
  unless:
    - id: metadata/file/format/source-map::sourcemap
