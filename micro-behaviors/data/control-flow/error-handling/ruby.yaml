# Ruby error-handling control flow.
#
# `rescue Exception` with an empty body discards every error, including
# SignalException and SystemExit. Relocated here from
# objectives/anti-static/obfuscation/control-flow/exception/: discarding errors
# is an error-handling shape, not an anti-static technique, and it is ordinary
# Ruby — Rails' own `Rails::Info.property` (railties lib/rails/info.rb) ends its
# body with `rescue Exception` / `end` so that a probe for an optional runtime
# property cannot break the info page. Objective composites that need "the
# failure was hidden" (e.g. the beacon-loop backdoor) reference this atom and
# supply the intent evidence.
#
# Sibling: `silent-exception-pass` in python.yaml covers `except Exception: pass`.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  mbc: "C0027"
  attack: "T1027"

traits:
  - id: ruby-rescue-exception-empty-body
    desc: Ruby rescues Exception with an empty body
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'rescue\s+Exception(\s*end|;)'
