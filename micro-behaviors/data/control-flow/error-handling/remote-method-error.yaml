defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  crit: notable
  conf: 0.95

traits:
  - id: missing-method-error-check
    desc: Checks text for missing-method errors
    if:
      type: text
      regex: '(if\s+|\.(includes|include\?)\s*\(\s*)["'']NoMethodError["'']'
