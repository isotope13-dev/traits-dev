defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
traits:
  - id: x64-xor-wide-state-dispatch-pattern
    desc: x64 XOR state and wide-case dispatch
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule x64_xor_wide_state_dispatch {
          strings:
            $mask = { 48 BA [8] ( 48 31 D0 48 31 D1 | 48 33 C2 48 33 CA ) }
            $case = { 48 B9 [8] ( 48 29 C8 | 48 2B C1 ) ( 74 | 75 | 0F 84 | 0F 85 ) }
          condition:
            for any m in (1..#mask) : (
              #case in (@mask[m]..@mask[m]+768) >= 3
            )
        }
