defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-early-return-call-gate
    desc: Python conditional early return after call
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\bif\s+[A-Za-z_]\w*\s*\(\s*\)\s*:\s*return\b'

  # Neutral index-loop shape: `for i in range(len(seq))`. Decoder and cipher
  # composites use it as a weak positional-iteration hint, but on its own it is
  # the plainest loop in Python, so it is a control-flow observation and not
  # string-recovery evidence.
  - id: python-for-range-len-loop
    desc: Python for-range-over-len(X) loop
    crit: component
    conf: 0.4
    if:
      type: tree-sitter
      query: "(for_statement\n  right: (call\n    function: (identifier) @func\n   \
        \ arguments: (argument_list\n      (call\n        function: (identifier) @len\n\
        \      )\n    )\n  )\n  (#eq? @func \"range\")\n  (#eq? @len \"len\")\n)\n"

  - id: transformer-transform-call
    desc: Calls transformer transform method
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: transformer.transform

  # Nested lambdas are a legitimate Python expression pattern (for example,
  # curried operator tables).  Keep the structural observation available to
  # higher-level rules, but do not classify it as obfuscation by itself.
  - id: nested-lambda-chain
    desc: Python nested lambda expression chain
    crit: notable
    conf: 0.85
    count_min: 8
    per_kb_min: 2.0
    if:
      type: text
      regex: lambda\s+[a-zA-Z_][a-zA-Z0-9_]*\s*:.{0,50}lambda\s+[a-zA-Z_][a-zA-Z0-9_]*
