defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-early-return-call-gate
    desc: PHP conditional early return after call
    # This is a complete but common control-flow observation, not an
    # incomplete composite fragment. No objective currently consumes it.
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '\bif\s*\(\s*[A-Za-z_]\w*\s*\(\s*\)\s*\)\s*return\b'
