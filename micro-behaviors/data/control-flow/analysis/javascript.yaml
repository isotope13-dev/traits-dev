defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  # Neutral fragment used by ad-fraud composites: some crawlers legitimately
  # warm seed pages, so the skip branch is not suspicious without an affiliate
  # destination and browser-navigation authority.
  - id: js-seed-task-delay-skip
    desc: Seed-marked task delays then skips work
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)if\s*\([^(\n]{0,60}\.\w*[sS]eed\w*.{0,60}\)[^)\n]{0,160}setTimeout[^t\n]{0,60}continue'

  - id: js-split-join-string-transform
    desc: JavaScript string transform using split and join
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    size_max: 10000
    if:
      type: text
      regex: \.split\(\s*['"]['"]\s*\).{0,50}\.join\(\s*['"]['"]\s*\)

  - id: js-zero-based-index-loop
    desc: JavaScript zero-based index loop
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\(\s*(let|const|var)\s+\w+\s*=\s*0\s*;\s*\w+\s*<'

  - id: js-nested-for-loop
    desc: Contains nested JavaScript for loops
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bfor\s*\([^{]{0,40}\{[^{]{0,40}\bfor\s*\([^{]{0,40}\{'

  - id: js-parenthesized-function-heavy
    desc: Dense parenthesized function expressions
    crit: notable
    conf: 0.85
    size_min: 2048
    per_kb_min: 5.0
    if:
      type: text
      regex: \(\s*(async\s+)?function\s*\([^)]{0,50}\)\s*\{|\(\s*(async\s+)?\([^)]{0,50}\)\s*=>
    unless:
      - id: metadata/library/structure/
      - id: metadata/package/testing/
  - id: js-function-call-method
    desc: Invokes function with .call()
    crit: baseline
    conf: 0.84
    if:
      type: text
      regex: '\.call\s*\([^)]{0,120}\)'
  - id: js-async-try-await-call
    desc: Async function awaits call in try
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    count_min: 2
    if:
      type: text
      regex: 'async\s+function\s+\w+\(\)\s*\{\s*try\s*\{\s*await\s+\w+\('
  - id: js-undefined-string-compare
    desc: Compares a value to the string "undefined"
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: "==\\s*['\"]undefined['\"]"
  - id: js-try-catch-error-method-call
    desc: Calls nested caught-error object method
    crit: notable
    conf: 0.8
    if:
      type: tree-sitter
      language: javascript
      # Matches: catch(e) { ... e[prop][method](); } or e.prop.method()
      query: |
        (catch_clause
          parameter: (identifier) @err_param
          body: (statement_block
            (expression_statement
              (assignment_expression
                right: (call_expression
                  function: (member_expression
                    object: (member_expression
                      object: (identifier) @err_use
                    )
                  )
                )
              )
            )
          )
        )
        (#eq? @err_param @err_use)
  - id: js-dynamic-method-call
    desc: Calls a method via computed bracket access
    crit: baseline
    conf: 0.7
    count_min: 8
    unless:
      - type: basename
        exact: CHANGES
      - id: metadata/library/runtime/
    if:
      type: tree-sitter
      language: javascript
      query: |-
        (call_expression
          function: (subscript_expression
            index: (identifier)
          ) @computed
        )
  - id: repeated-loop-variable-assignment
    desc: Reassigns a variable within a loop
    crit: baseline
    conf: 0.85
    if:
      type: tree-sitter
      language: javascript
      query: |
        (while_statement
          body: (statement_block
            (expression_statement
              (assignment_expression
                left: (identifier) @var
                right: (number)
              )
            )
            (expression_statement
              (assignment_expression
                left: (identifier)
                right: (_)
              )
            )
            (expression_statement
              (assignment_expression
                left: (identifier) @var2
                right: (number)
              )
            )
            (#eq? @var @var2)
          )
        )

  # Generic if/while that calls a matcher (test/includes/match/indexOf). Used by
  # User-Agent branch composites; not itself a User-Agent signal.
  - id: js-conditional-matcher-call
    desc: Calls a matcher in a conditional expression
    crit: component
    conf: 0.88
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)\b(if|while)\s*\([^;\r\n(]{0,120}\b(test|includes|match|indexOf)\s*\('
