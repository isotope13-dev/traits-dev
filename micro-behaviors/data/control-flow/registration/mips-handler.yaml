defaults:
  for: [elf]
  platforms: [linux]
  arch: [mips]

traits:
  # Repeated stores of a handler pointer and numeric byte identifier,
  # followed by an indirect call while growing the registration table.
  - id: mips-be-numbered-handler-registration
    desc: Repeated MIPS numbered handler registration
    crit: notable
    conf: 0.95
    count_min: 8
    if:
      type: hex
      section: .text
      pattern: '24 02 00 ?? 00 05 28 80 AE 23 00 00 A2 22 00 04 03 20 F8 09 24 A5 00 04'
