defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: tagged-config-persona-helper-calls
    desc: Sequential tagged config/persona helper calls
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement (await_expression (call_expression
            function: (identifier) @first
            arguments: (arguments (string) @config
              (member_expression property: (property_identifier) @config_field)))))
          . (expression_statement (await_expression (call_expression
            function: (identifier) @second
            arguments: (arguments (string) @persona
              (member_expression property: (property_identifier) @persona_field)))))) @sequence
          (#eq? @first @second)
          (#match? @config "^['\"](provider|agent|instance)_config['\"]$")
          (#match? @config_field "^(provider|agent|instance)_config$")
          (#match? @persona "^['\"](persona_doc|soul)['\"]$")
          (#match? @persona_field "^(persona_doc|soul)$"))
