defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-transform-suffixed-output-call-layout
    desc: CIL transform and suffixed-output call layout
    crit: component
    conf: 0.95
    if:
      type: hex
      section: .text
      # Equivalent local-slot layouts: compact locals 0/1/2, or locals
      # 2/3/4 with short-form accesses for slot 4. Tokens remain wildcarded;
      # this atom does not identify the transform or the final callee.
      pattern: '(06 28 ?? ?? ?? 0A 0B 07 28 ?? ?? ?? 06 0C 06 7E ?? ?? ?? 04 28 ?? ?? ?? 0A 08 28 ?? ?? ?? 0A 00 06 28 ?? ?? ?? 0A|08 28 ?? ?? ?? 0A 0D 09 28 ?? ?? ?? 06 13 04 08 7E ?? ?? ?? 04 28 ?? ?? ?? 0A 11 04 28 ?? ?? ?? 0A 00 08 28 ?? ?? ?? 0A)'
