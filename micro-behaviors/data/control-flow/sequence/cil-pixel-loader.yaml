defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-value-getter-collection-add
    desc: CIL value getter feeds a collection call
    crit: component
    conf: 0.95
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: '(06|07|08|09|11 ??) 12 ?? 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A 00'
  - id: cil-sized-helper-load-type-array
    desc: CIL sized helper, load and indexed type
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '20 ?? ?? ?? ?? 28 ?? ?? ?? 06 28 ?? ?? ?? 2B 28 ?? ?? ?? 0A (0A|0B|0C|0D) (06|07|08|09) 6F ?? ?? ?? 0A (16|17|18) 9A'
