defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: cil-boxed-array-string-call-layout
    desc: CIL boxed-array value and chained calls
    crit: component
    conf: 0.95
    if:
      type: hex
      section: .text
      # A local is boxed, converted by a virtual call and inserted in an
      # object array. A final literal is inserted before two consecutive
      # calls consume the array/result. Tokens and compact locals vary.
      # This shape alone identifies neither keyboard data nor a file sink.
      pattern: '(06|07|08|09) 8C ?? ?? ?? 01 6F ?? ?? ?? 0A A2 (06|07|08|09) (1A|1B|1C|1D) 72 ?? ?? ?? 70 A2 (06|07|08|09) 28 ?? ?? ?? 0A 28 ?? ?? ?? 0A'
