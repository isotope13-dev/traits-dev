# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - windows
  - unix
  - android
  for:
  - html
  - javascript
traits:
- id: entries-delete-next-calls
  desc: entries/delete/next call sequence
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?s)\.entries\(\).{0,250}\.delete\(.{0,530}.{0,530}\.next\(\)
- id: entries-method-call
  desc: Calls an entries method
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '.entries()'
- id: delete-method-call
  desc: Calls a delete method with an argument
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\.delete\(\s*\w+'
- id: iterator-next-call
  desc: Advances an iterator
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(\w+\s*)?\.next\(\)'
  not:
    - regex: '(?i)^(ctx|context|req(uest)?|options)\s*\.next\(\)$'
