defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-call-chain-null-invoke-sequence
    desc: CIL call chain with two null arguments
    crit: component
    conf: 0.9
    if:
      type: hex
      pattern: '28 ?? ?? ?? 0A (06|07|08|09|11 ??) 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 14 14 6F ?? ?? ?? 0A'
      section: .text
  # A virtual result is stored, addressed for a value-type getter, and passed
  # directly to another virtual call. MemberRef rows and locals are variable.
  - id: cil-addressed-local-member-call-sequence
    desc: CIL addressed-local result feeds member call
    crit: component
    conf: 0.9
    if:
      type: hex
      pattern: '16 6F ?? ?? ?? 0A 13 ?? 12 ?? 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A'
      section: .text

composite_rules:
  - id: cil-local-result-null-invoke-layout
    desc: Local-result CIL beside null-argument invoke chain
    crit: component
    conf: 0.95
    near_bytes: 192
    all:
      - id: cil-addressed-local-member-call-sequence
      - id: cil-call-chain-null-invoke-sequence
