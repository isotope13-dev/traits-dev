defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-call-value-getter-call-sequence
    desc: CIL call, value-address getter and call sequence
    crit: component
    conf: 0.9
    if:
      type: hex
      pattern: '6F ?? ?? ?? 0A 13 ?? 12 ?? 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A'
      section: .text
  - id: cil-call-chain-null-invoke-sequence
    desc: CIL call chain with two null arguments
    crit: component
    conf: 0.9
    if:
      type: hex
      pattern: '28 ?? ?? ?? 0A (06|07|08|09|11 ??) 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 14 14 6F ?? ?? ?? 0A'
      section: .text
