defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Helper result -> virtual getter -> captured field's array element ->
  # virtual call. Tokens, local slots and small array indices are variable.
  # This shape alone identifies neither a process nor remote tasking.
  - id: cil-getter-field-array-item-call
    desc: CIL getter followed by field-array argument call
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '28 ?? ?? ?? 06 6F ?? ?? ?? 0A (06|07|08|09|11 ??) 7B ?? ?? ?? 04 (16|17|18|19|1A|1B|1C|1D|1E|1F ??) 9A 6F ?? ?? ?? 0A'
