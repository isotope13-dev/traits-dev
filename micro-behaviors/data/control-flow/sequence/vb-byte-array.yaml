defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.95
traits:
  # Local object, byte count, helper call, generic array conversion, argument
  # store, two null arrays, VB dispatch, and a typed result cast. The member
  # identities are supplied separately by the consuming loader rule.
  - id: cil-sized-helper-array-lateget-cast
    desc: CIL helper array, late dispatch and cast
    if:
      type: hex
      section: .text
      pattern: '(06|07|08|09|11 ??) 20 ?? ?? ?? ?? 28 ?? ?? ?? 06 28 ?? ?? ?? 2B A2 14 14 28 ?? ?? ?? 0A 74 ?? ?? ?? 01'
