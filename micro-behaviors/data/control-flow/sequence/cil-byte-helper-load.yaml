# The local holding a helper result feeds a generic conversion call, then
# a virtual call whose result is enumerated and indexed. API-name facts in
# the payload composite establish the AppDomain.Load/GetTypes interpretation.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
traits:
  - id: cil-byte-helper-load-type-enumeration
    desc: CIL helper result feeds indexed-call chain
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '20 ?? ?? ?? ?? 28 ?? ?? ?? 06 0A 28 ?? ?? ?? 0A 06 28 ?? ?? ?? 2B 6F ?? ?? ?? 0A 0B 07 6F ?? ?? ?? 0A 17 9A'
