# Opcode shapes are deliberately described as shapes: wildcarded metadata
# tokens cannot establish which API a call resolves to. Known implementation
# fingerprints below combine them with independent semantic references.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-literal-helper-indexed-result
    desc: CIL literal helper and indexed result
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '28 ?? ?? ?? 06 0B 02 07 72 ?? ?? ?? 70 28 ?? ?? ?? 06 28 ?? ?? ?? 0A 0C 08 6F ?? ?? ?? 0A (16|17|18|19|1A|1B|1C|1D|1E|1F ??|20 ?? ?? ?? ??) 9A 0D'
  - id: cil-two-literal-helper-chain
    desc: CIL literals and chained helper calls
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '28 ?? ?? ?? 06 72 ?? ?? ?? 70 72 ?? ?? ?? 70 6F ?? ?? ?? 0A 28 ?? ?? ?? 06 28 ?? ?? ?? 0A 0A'
  - id: cil-three-literal-array-call
    desc: CIL three literals and array dispatch
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      # Bit 0x100 is BindingFlags.InvokeMethod; allow low-byte lookup flags.
      # The decoded local enters object[1].
      pattern: '72 ?? ?? ?? 70 72 ?? ?? ?? 70 72 ?? ?? ?? 70 (28|6F) ?? ?? ?? 0A 28 ?? ?? ?? 0A 7E ?? ?? ?? 04 20 ?? 01 00 00 14 14 17 8D ?? ?? ?? 01 25 16 06 A2 6F ?? ?? ?? 0A 74 ?? ?? ?? 01'
  - id: cil-initialized-array-helper-dispatch
    desc: CIL initialized array and helper dispatch
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '14 1A 8D ?? ?? ?? 01 25 D0 ?? ?? ?? 04 28 ?? ?? ?? 0A 73 ?? ?? ?? 0A 72 ?? ?? ?? 70 28 ?? ?? ?? 0A 18 8D ?? ?? ?? 01 25 17 03 A2 14 14 28 ?? ?? ?? 0A 26'
  - id: cil-ten-slot-boxed-array
    desc: CIL ten-slot array with boxed padding
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # String, two fields, an integer and six boxed Boolean-like values.
      # Describes the array layout, not the destination of the call.
      pattern: '1F 0A 8D ?? ?? ?? 01 25 16 72 ?? ?? ?? 70 A2 25 17 7E ?? ?? ?? 04 A2 25 18 1A 8C ?? ?? ?? 01 A2 25 19 7E ?? ?? ?? 04 A2 25 1A (16|17) 8C ?? ?? ?? 01 A2 25 1B (16|17) 8C ?? ?? ?? 01 A2 25 1C (16|17) 8C ?? ?? ?? 01 A2 25 1D (16|17) 8C ?? ?? ?? 01 A2 25 1E (16|17) 8C ?? ?? ?? 01 A2 25 1F 09 (16|17) 8C ?? ?? ?? 01 A2'
  - id: cil-indexed-argument-permutation
    desc: CIL array extracts indices 1, 3, 0
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Three helper calls read one source argument through separately boxed
      # index arrays into a nested destination array. API tokens vary.
      pattern: '18 8D ?? ?? ?? 01 25 16 03 A2 25 17 19 8D ?? ?? ?? 01 25 16 04 17 8D ?? ?? ?? 01 25 16 17 8C ?? ?? ?? 01 A2 14 28 ?? ?? ?? 0A A2 25 17 04 17 8D ?? ?? ?? 01 25 16 19 8C ?? ?? ?? 01 A2 14 28 ?? ?? ?? 0A A2 25 18 04 17 8D ?? ?? ?? 01 25 16 16 8C ?? ?? ?? 01 A2 14 28 ?? ?? ?? 0A A2 A2'
