---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  crit: notable
  conf: 0.95
  size_max: 500000
traits:
- id: js-string-leading-sequence
  desc: String-leading sequence expression node
  if:
    type: tree-sitter
    language: javascript
    query: |
      [
        (member_expression
          object: (parenthesized_expression
            (sequence_expression
              (string)
              (_)
            )
          )
        )
        (subscript_expression
          object: (parenthesized_expression
            (sequence_expression
              (string)
              (_)
            )
          )
        )
      ] @seq_expr
  unless:
  - type: basename
    regex: "\\.stx$"
  - id: metadata/package/documentation/manpage::unix-manpage
