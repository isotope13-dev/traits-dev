defaults:
  for: [pe, dll]
  platforms: [windows]
  conf: 0.99
traits:
  # Equality is essential here: an unrelated string field passed to a helper
  # is not a reply carrying the recorded buffer. The recording pattern is
  # repeated only to bind its field token to this separate readout operation.
  # The generic internal helper call does not prove a network transmission.
  - id: cil-recorded-field-helper-reuse
    desc: CIL accumulated field reused by helper
    crit: notable
    if:
      type: yara
      source: |
        import "pe"
        rule cil_recorded_field_helper_reuse {
          strings:
            $record = { 02 02 7B ?? ?? ?? 04 02 28 ?? ?? ?? 06
              28 ?? ?? ?? 0A 7D ?? ?? ?? 04
              02 02 7B ?? ?? ?? 04 09 28 ?? ?? ?? 0A 7D ?? ?? ?? 04 }
            // Prefix, static fields, address of recorded instance field,
            // transform helper, concatenation-shaped call, internal helper.
            $reply = { 72 [4] 7E ?? ?? ?? 04 7E ?? ?? ?? 04
              7C ?? ?? ?? 04 28 ?? ?? ?? 06 28 ?? ?? ?? 0A
              28 ?? ?? ?? 06 26 }
          condition:
            all of them and
            for any i in (1..#record) : (
              uint32(@record[i]+3) == uint32(@record[i]+19) and
              uint32(@record[i]+3) == uint32(@record[i]+26) and
              uint32(@record[i]+3) == uint32(@record[i]+37) and
              for any j in (1..#reply) : (
                uint32(@record[i]+3) == uint32(@reply[j]+16) and
                for any s in pe.sections : (
                  s.characteristics & 0x20000000 != 0 and
                  @record[i] >= s.raw_data_offset and
                  @record[i]+!record[i] <= s.raw_data_offset+s.raw_data_size and
                  @reply[j] >= s.raw_data_offset and
                  @reply[j]+!reply[j] <= s.raw_data_offset+s.raw_data_size
                )
              )
            )
        }
