defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: three-string-comma-expression
  desc: Parenthesized three-string comma expression
  size_max: 100000
  if:
    type: tree-sitter
    node: parenthesized_expression
    regex: ^\s*\(["\x27].{1,20}["\x27]\s*,\s*["\x27].{1,20}["\x27]\s*,\s*["\x27].{1,20}["\x27]\)\s*$
  not:
  - regex: \.\w{1,5}['"]
  - regex: (\.attr|\.style|translate)\(
  - regex: \.(xor|valid)\(
  - regex: \bfirstEnv\(
  - regex: (?i)\bIN\s*\(
  - regex: '"\+[A-Za-z]\.[rgb]\+"'
  unless:
  - id: metadata/package/testing/harness/runtime/
  - type: basename
    regex: (?i)\.xcspec$
  - id: well-known/lib/web/mermaid::architecture-fixture
  - type: text
    substr: ("\\bgroup","{")
