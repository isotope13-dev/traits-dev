defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Short-form locals and wildcarded call tokens. API and ransom context
  # belongs to the consumer; this atom makes only an instruction-layout claim.
  - id: cil-zero-int64-two-buffer-call-layout
    desc: CIL zero-int64 and two buffer-call layout
    crit: notable
    conf: 0.94
    if:
      type: hex
      section: .text
      pattern: '11 ?? 16 6A 6F ?? ?? ?? 0A 11 ?? 6F ?? ?? ?? 0A 13 ?? 11 ?? 11 ?? 16 11 ?? 8E 69 6F ?? ?? ?? 0A 11 ?? 09 16 09 8E 69 6F ?? ?? ?? 0A'
