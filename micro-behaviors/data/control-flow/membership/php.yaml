# Neutral PHP country-code membership. Phone-number and address validation
# routinely use this operation; cloaking intent requires the HTTP and timing
# context assembled by objectives/evasion/decoy/cloaking/.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.92

traits:
  - id: country-code-list-membership
    desc: PHP checks country or region code membership
    if:
      type: text
      # Restrict the value to the first in_array argument. Matching anywhere
      # in the call mislabels unrelated country_code text in later arguments.
      regex: '(?i)\bin_array\s*\(\s*\$?([A-Za-z_][A-Za-z0-9_]*[_-])?(country|region)[_-]?code\b'
