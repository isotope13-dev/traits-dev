defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- id: remote-approval-gated-execution
  desc: Fetched text membership test beside host-information queries
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/client/response-body::requests-text-allowed-list-fetch
  - id: micro-behaviors/data/control-flow/membership::in-membership-check
  any:
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/os/sysinfo/profile::python-platform-query-combination
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
- id: paid-telegram-approval-gate
  desc: Remote approval references with a Telegram contact
  conf: 0.94
  all:
  - id: micro-behaviors/data/control-flow/membership::remote-approval-gated-execution
  - id: micro-behaviors/ui/dialog/prompt::approval-required-wording
  - id: micro-behaviors/communications/messaging/telegram::telegram-key-contact-url
  any:
  - id: micro-behaviors/os/sysinfo/profile::python-host-queries-with-sha256
  - id: micro-behaviors/process/create/system::python-os-system-open-url
