# Neutral JavaScript membership checks. Country-shaped values are common in
# localization, billing, and phone-number code; routing intent belongs in the
# composites under objectives/evasion/decoy/cloaking/.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: country-list-membership-call
    desc: JavaScript checks country list membership
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*Countries\s*\.\s*(includes|indexOf)\s*\(\s*'
    not:
      - regex: '(?i)\b[A-Za-z_$][\w$]*Countries\s*\.\s*(includes|indexOf)\s*\(\s*country\.iso2\b'

  - id: country-code-membership-argument
    desc: Checks country-code membership
    for: [javascript, typescript, html]
    if:
      type: text
      # Keep the country token inside the membership argument. A bounded
      # forward search can confuse an unrelated later object property with
      # the value actually being tested.
      regex: '(?i)\b(includes|indexOf)\s*\(\s*([A-Za-z_$][\w$]*\s*\.\s*)?country[_-]?code\b'
