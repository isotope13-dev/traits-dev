# Provider response fields, rather than a kit's variable names or ISP list.
# Membership alone is neutral: VPN dashboards and routing code use it too.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.93
traits:
  - id: js-isp-field-membership
    desc: Checks ISP or organization field membership
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\.(includes|indexOf)\s*\(\s*[\w$.]+\.(isp|org)\s*\)'
      exclude_html_comments: true
  - id: python-isp-field-membership
    desc: Python tests network-provider membership
    for: [python]
    if:
      type: tree-sitter
      kind: conditional
      regex: '\bif\s+[\w.]+\[["''](isp|org)["'']\]\s+(not\s+)?in\b'
  - id: php-isp-field-membership
    desc: PHP checks ISP or organization field membership
    for: [php]
    if:
      # PHP flow currently merges indexed fields with their containing object;
      # inspect the first argument's syntax rather than assert a member origin.
      type: tree-sitter
      kind: call
      regex: '\bin_array\s*\(\s*\$\w+\[["''](isp|org)["'']\]'
  - id: powershell-isp-field-membership
    desc: PowerShell tests network-provider membership
    for: [powershell]
    if:
      type: text
      regex: '(?i)-contains\s+\$[\w]+\.(isp|org)\b'
composite_rules:
  - id: isp-field-membership
    desc: Checks network-provider field against a collection
    any:
      - id: js-isp-field-membership
      - id: python-isp-field-membership
      - id: php-isp-field-membership
      - id: powershell-isp-field-membership
