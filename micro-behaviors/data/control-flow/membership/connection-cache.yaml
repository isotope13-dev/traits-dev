defaults:
  for:
  - csharp
  - pe
  - dll
  - powershell
  - python
  - javascript
  platforms:
  - windows
  - linux
  - macos
traits:
- id: dotnet-connection-id-cache-pruning
  desc: .NET Connection-ID cache membership and pruning
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?is)Connection_?ID.{0,500}\.Contains\(.{0,500}\.(IntersectWith|Remove)\(
- id: python-connection-id-cache-pruning
  desc: Python connection cache membership and pruning
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?is)connection_?id.{0,500}not\s+in.{0,700}\.(intersection_update|discard)\(
- id: javascript-connection-id-cache-pruning
  desc: JavaScript connection cache pruning
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\.has\(.{0,120}connection_?id.{0,700}\.delete\(
composite_rules:
- id: connection-id-cache-pruning
  desc: Connection-ID cache membership and pruning
  crit: notable
  conf: 0.94
  any:
  - id: dotnet-connection-id-cache-pruning
  - id: python-connection-id-cache-pruning
  - id: javascript-connection-id-cache-pruning
