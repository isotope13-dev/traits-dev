# 7z encryption is a packaging capability.  It becomes an anti-analysis
# signal only when the archive also exposes an executable member or an
# unusually large expansion ratio.
defaults:
  platforms: [unix, windows]
  for: [7z]
  crit: notable
  conf: 0.9

traits:
  # `7z-encrypted-entry` lived here reading `archive.security.encrypted_count`,
  # a metric cleave reports for any container. `for: [7z]` does not gate a
  # metrics trait, so it fired on password-protected ZIPs and reported them as
  # 7z. Replaced by micro-behaviors/data/archive/member::archive-encrypted-member.

  # Codec id 06 F1 07 01 = 7zAES. Four bytes alone collide inside gzip/ELF
  # streams; the composite below requires a parsed 7z container.
  - id: 7z-aes-codec-bytes
    desc: 7zAES codec method-id byte sequence
    crit: component
    conf: 0.85
    if:
      type: hex
      # The coder id lives in the next header, which 7z writes at the end.
      # The same four bytes show up by chance in a large LZMA2 payload.
      pattern: "06 F1 07 01"
      offset_range: [-1048576, null]

  - id: compact-7zaes-bytes
    desc: Compact file contains 7zAES codec bytes
    crit: notable
    conf: 0.9
    size_max: 65536
    if:
      id: 7z-aes-codec-bytes

  # 7z magic at offset 0 and no member_count: the encoded header was AES,
  # so the parser never listed names. Distinct from archive-7z-container
  # (a value-path identity fact) so the two are not duplicate matchers.
  - id: 7z-header-locked
    desc: 7z magic with no listed members
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "37 7A BC AF 27 1C"
      offset: 0
    unless:
      - type: metrics
        field: archive.member_count
        min: 1
      - type: metrics
        field: archive.file_count
        min: 1

  - id: large-header-locked-7z
    desc: Large 7z has a locked header
    crit: notable
    conf: 0.94
    size_min: 1048576
    if:
      id: 7z-header-locked

  # Encoded-header folder with one 7zAES coder. Payload-encrypted 7z that
  # still lists names typically use a multi-coder folder in the clear header.
  - id: 7z-single-aes-coder-folder
    desc: 7z folder uses one 7zAES coder
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "07 0B 01 00 01 24 06 F1 07 01"

  - id: 7z-aes-without-members
    desc: 7zAES bytes with no member table
    crit: notable
    conf: 0.94
    if:
      id: 7z-aes-codec-bytes
    unless:
      - type: metrics
        field: archive.member_count
        min: 1
      - type: metrics
        field: archive.file_count
        min: 1

  - id: compact-high-entropy-blob
    desc: Compact file has high entropy
    crit: component
    conf: 0.9
    size_max: 8192
    if:
      type: metrics
      field: file.entropy
      min: 7.4

composite_rules:
  # The `7z` file-kind alias also matches generic ZIP/TAR containers;
  # require the parsed container format before calling this 7z-specific.
  - id: 7z-aes-codec
    desc: 7zAES encryption codec identifier
    conf: 0.96
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: 7z-aes-codec-bytes

  - id: 7z-extreme-expansion-ratio
    desc: 7z archive has an extreme expansion ratio
    conf: 0.92
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/file/archive::archive-high-compression-expansion

  - id: compact-high-entropy-7z
    desc: Compact 7z has high entropy
    conf: 0.9
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: compact-high-entropy-blob
    any:
      - id: 7z-aes-codec-bytes
      - id: 7z-header-locked
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
