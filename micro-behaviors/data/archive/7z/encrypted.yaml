# 7z encryption is a packaging capability.  It becomes an anti-analysis
# signal only when the archive also exposes an executable member or an
# unusually large expansion ratio.
defaults:
  platforms: [unix, windows]
  for: [7z]
  crit: notable
  conf: 0.9

traits:
  - id: 7z-encrypted-entry
    desc: 7z archive contains encrypted content
    if:
      type: metrics
      field: archive.security.encrypted_count
      min: 1

  # Codec id 06 F1 07 01 = 7zAES.  Use when encrypted_count is unavailable
  # because headers cannot be fully decoded without the password.
  - id: 7z-aes-codec
    desc: 7zAES encryption codec identifier
    conf: 0.96
    if:
      type: hex
      pattern: "06 F1 07 01"

  - id: 7z-extreme-expansion-ratio
    desc: 7z archive has an extreme expansion ratio
    conf: 0.92
    if:
      type: metrics
      field: archive.zip_bomb_ratio
      min: 100
