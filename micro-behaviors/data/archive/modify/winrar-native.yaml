defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  # A native program that names WinRAR's console archiver by its Program Files
  # subpath is preparing to drive it to modify archives.
  - id: winrar-console-archiver-path
    desc: WinRAR rar.exe Program Files subpath
    conf: 0.9
    if:
      type: text
      regex: '(?i)winrar\\rar\.exe'
