defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  # A native program that names WinRAR's console archiver by its Program Files
  # subpath is preparing to drive it to modify archives.
  - id: winrar-console-archiver-path
    desc: WinRAR rar.exe Program Files subpath
    conf: 0.9
    if:
      type: text
      regex: '(?i)winrar\\rar\.exe'

  # Bundled WinRAR console archiver and registration key entry names (such as
  # PyInstaller CArchive TOC member entries prefixed by b/x or standalone).
  - id: winrar-console-archiver-entry
    desc: References WinRAR rar.exe binary name
    for: [pe, data]
    conf: 0.9
    if:
      type: text
      regex: '(?i)^[bx]?rar\.exe$'

  - id: winrar-registration-key-entry
    desc: References WinRAR rarreg.key license file
    for: [pe, data]
    conf: 0.9
    if:
      type: text
      regex: '(?i)^[bx]?rarreg\.key$'
