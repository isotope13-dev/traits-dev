defaults:
  platforms: [windows]
  for: [vbs, powershell, batch]
  crit: notable
traits:
  - id: winzip-app-path
    desc: WinZip executable App Paths lookup
    conf: 0.95
    if:
      type: text
      substr: 'App Paths\winzip32.exe'
  - id: wsh-add-filepath-system-folder
    desc: WSH adds system-folder payload to archive
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.run .{1,30}" -a -r " & \w+\.path.{1,60}GetSpecialFolder\(1\)'
