defaults:
  platforms: [unix]
  for: [shell, python, javascript, elf]
traits:
  - id: tar-append
    desc: Tar append command text
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(^|[\n;&|({\[=:"''`])\s*tar\s+-[A-Za-z]*r'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
