defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: makeself-archive-context
    desc: Makeself-generated self-extracting script
    crit: notable
    conf: 0.99
    for: [shell]
    if:
      type: text
      # Generated archive marker, rather than generic prose that happens to
      # mention Makeself or self-extracting archives.
      regex: '(?im)^#[ \t]+This script was generated using Makeself([ \t]+[0-9][0-9.]*)?[ \t]*$'
