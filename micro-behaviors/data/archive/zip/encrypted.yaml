defaults:
  platforms: [windows, unix]
  for: [zip]
traits:
  # `zip-encrypted-entry` lived here with the container-agnostic
  # `archive.security.encrypted_count` matcher. It is now the single canonical
  # micro-behaviors/data/archive/member::archive-encrypted-member; the
  # ZIP-specific evidence below (local-header flag bytes) stays.
  - id: zipcrypto-many-encrypted-entries
    desc: ZIP has many encrypted entries
    crit: notable
    conf: 0.94
    count_min: 5
    if:
      type: hex
      pattern: "50 4B 03 04 14 00 09 00 08 00"
  - id: zipcrypto-few-encrypted-entries
    desc: ZIP has few encrypted entries
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: archive.security.encrypted_count
      min: 2
      max: 4
  - id: pyzipper-aes
    desc: Create AES encrypted ZIP using pyzipper
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: pyzipper.AESZipFile
  - id: zipfile-setpassword
    desc: Set password on Python ZIP archive
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: .setpassword(
