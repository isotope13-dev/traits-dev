defaults:
  crit: notable
  platforms: [windows, unix]
  for: [zip]
traits:
  # `zip-encrypted-entry` lived here with the container-agnostic
  # `archive.security.encrypted_count` matcher. It is now the single canonical
  # metadata/file/archive::archive-encrypted-member; the
  # ZIP-specific evidence below (local-header flag bytes) stays.
  # `zipcrypto-few-encrypted-entries` went the same way, to
  # micro-behaviors/data/archive/member::archive-few-encrypted-members: it read
  # the same container-neutral metric and `for: [zip]` does not gate a metrics
  # trait, so it announced "ZIP has few encrypted entries" over a 7z.
  - id: zipcrypto-many-encrypted-entries
    desc: ZIP has many encrypted entries
    conf: 0.94
    count_min: 5
    if:
      type: hex
      pattern: "50 4B 03 04 14 00 09 00 08 00"
  - id: pyzipper-aes
    desc: Calls AES ZIP archive constructor
    conf: 0.8
    for: [python]
    if:
      type: symbol
      kind: call
      # The public constructor name survives module aliases (import pyzipper
      # as z). Call facts exclude comments and quoted example code.
      regex: '(^|\.)AESZipFile$'
  - id: zipfile-setpassword
    desc: Set password on Python ZIP archive
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: .setpassword(
  # Bytecode twins of the source rules above. PyInstaller and other frozen
  # droppers stage passworded archives from bytecode, where call facts and
  # dotted source syntax are unavailable but the code-object names survive
  # as text. These use the same text-substring form as the other pyc
  # atoms; a bare name reference is weaker than a call, so they feed
  # composites rather than standing alone.
  - id: pyzipper-aes-pyc
    desc: Bytecode references AES ZIP archive constructor
    conf: 0.8
    for: [pyc]
    if:
      type: text
      substr: AESZipFile
  - id: zipfile-setpassword-pyc
    desc: Bytecode sets password on ZIP archive
    conf: 0.8
    for: [pyc]
    if:
      type: text
      substr: setpassword
