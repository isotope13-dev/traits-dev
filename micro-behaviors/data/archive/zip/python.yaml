defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-zipfile-handle
    desc: Python constructs a ZipFile archive handle
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(zipfile\.)?ZipFile$'

  - id: python-zipfile-writer
    desc: Python writes files into a ZIP archive
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'zipfile\.ZipFile[\s\S]{0,900}\.write\s*\('
