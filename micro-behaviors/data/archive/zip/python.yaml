defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-zipfile-handle
    desc: Python constructs a ZipFile archive handle
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ZipFile$'

  - id: python-zipfile-writer
    desc: Python writes files into a ZIP archive
    if:
      type: text
      regex: '\bZipFile\s*\([^)\r\n]{1,160}["''][wax]["''][\s\S]{0,800}\.write(str)?\s*\('
