defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-zipfile-handle
    desc: Python constructs a ZipFile archive handle
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ZipFile$'

  - id: python-zipfile-writer
    desc: Python writes files into a ZIP archive
    if:
      type: text
      regex: '\b(\w+\.)?ZipFile\b[\s\S]{0,900}\.write\s*\('
