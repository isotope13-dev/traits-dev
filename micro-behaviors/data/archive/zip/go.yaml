defaults:
  platforms: [windows, unix]
  for: [go, binaries, wasm]
traits:
  - id: zip-writer
    desc: Go ZIP writer creation
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: zip.NewWriter
  - id: zip-reader
    desc: Go zip.OpenReader usage
    crit: notable
    conf: 0.9
    # Compiled Go PEs whose Go string structures are missing keep full
    # package-qualified symbol names (archive/zip.OpenReader), so match the
    # member name rather than requiring the exact short spelling or the Go
    # file-type classification.
    for:
      - go
      - pe
      - elf
    if:
      type: symbol
      substr: zip.OpenReader
  - id: zip-create
    desc: Go ZIP entry creation
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: text
      substr: z.Create
