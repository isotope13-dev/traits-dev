# PKWARE "traditional" ZIP encryption (ZipCrypto) implemented in the file
# itself: the three key registers are initialised to 0x12345678, 0x23456789
# and 0x34567890 and updated with the CRC table and multiplier 134775813.
# Archive libraries (zip.js, adm-zip, minizip) contain it; so did the stage-2
# page of a 2026-09 Colombian judicial-lure chain, which built a
# password-protected ZIP around a .wsf in the browser.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg, python]
  crit: notable
  conf: 0.9
traits:
  - id: zipcrypto-key-schedule
    desc: Implements ZipCrypto key schedule
    if:
      type: text
      regex: '(?i)0x12345678[\s\S]{0,60}0x23456789[\s\S]{0,60}0x34567890'
