defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: none

traits:
  - id: zip-central-directory-signature
    desc: References the ZIP central directory signature
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '0x02014b50'

  - id: inflates-raw-zip-entry
    desc: Inflates raw compressed archive data
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: inflateRawSync
