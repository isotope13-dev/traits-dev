defaults:
  platforms: [linux, windows, macos]
composite_rules:
- for:
  - scripts
  - binaries
  - source
  id: archive-writer-api-or-library-observations
  desc: ZIP writer APIs or archive-library observations
  crit: notable
  any:
  - id: micro-behaviors/data/archive/zip::zip-writer
  - id: micro-behaviors/data/archive/zip::zip-create
  - id: micro-behaviors/data/archive/zip::miniz-zip-writer-api
  - id: micro-behaviors/fs/path/library::node-archiver-module-path-reference
  - id: metadata/lang/source/naming/function/file::zip-stream-on-write-entry-name
