# Library APIs that write tar archives from code, rather than the tar CLI.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: tar-archive-writer-api
    desc: Writes tar archives through a library API
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'Archive::Tar|\btar\.NewWriter\s*\('
