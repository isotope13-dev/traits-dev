defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-add-arcname-call
    desc: Calls add with archive member name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)add$'
      arg:
        from:
          field: arcname
          field_exists: true
composite_rules:
  - id: python-tar-add-path
    desc: Tar opening near named file addition
    near_lines: 24
    all:
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
      - id: python-add-arcname-call
