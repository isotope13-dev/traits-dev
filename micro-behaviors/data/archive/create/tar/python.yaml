defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1560.001

traits:
  - id: python-tar-write-mode
    desc: Python opens an uncompressed tar for writing
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'tarfile\.open\s*\([^)]{0,500}(^|[,=(]\s*)["'']w["'']'

  - id: python-tar-gz-write-mode
    desc: Python tar.gz write mode
    crit: notable
    conf: 0.9
    for: [python]
    if:
      # Match both positional `tarfile.open(path, "w:gz")` and keyword
      # `tarfile.open(fileobj=buf, mode="w:gz")` call forms.
      type: tree-sitter
      kind: call
      regex: 'tarfile\.open\s*\([^)]{0,500}(^|[,=(]\s*)["'']w:gz["'']'

  - id: python-tar-addfile
    desc: Adds TarInfo member to tar archive
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.addfile$'

  - id: tar-header-root-ownership
    desc: Sets root ownership on tar header
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\buid\s*[:=]\s*0\b[\s\S]{0,120}\buname\s*[:=]\s*["'']root["'']'

  - id: tar-cli-owner-root
    desc: Passes root --owner flag to tar
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '--owner\s*=\s*(0|root)\b'
