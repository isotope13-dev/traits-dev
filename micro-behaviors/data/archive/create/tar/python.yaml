defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1560.001

traits:
  - id: python-tar-gz-write-mode
    desc: Python tar.gz write mode
    crit: notable
    conf: 0.9
    for: [python]
    if:
      # Match both positional `tarfile.open(path, "w:gz")` and keyword
      # `tarfile.open(fileobj=buf, mode="w:gz")` call forms.
      type: tree-sitter
      kind: call
      regex: 'tarfile\.open\s*\([^)]{0,500}(^|[,=(]\s*)["'']w:gz["'']'
