defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-system-config-archive-command"
    desc: "Lua shell command uses tar-like creation flags"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      args:
        - index: 0
          from:
            value: "\\s-?c[zjJ]f\\s"
  - id: "lua-system-config-command-input"
    desc: "Lua shell command names system configuration"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      arg:
        from:
          value: "\\s/etc/\\s"
