# The `tar` crate's archive writer: Builder appends headers/entries to an
# output stream. Readers use tar::Archive, so this is write-side only.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1560.002

traits:
  - id: rust-tar-builder-construction
    desc: Rust tar crate builds an archive
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\btar::Builder::new\s*\('
