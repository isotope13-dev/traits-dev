defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, elf]
  crit: notable
  conf: 0.6
  attack: T1560

traits:
  - id: selinux-archive-header
    desc: GNU tar SELinux extended-header keyword
    crit: notable
    conf: 0.9
    for: [scripts, binaries, elf]
    if:
      type: text
      substr: RHT.security.selinux
  - id: tar-create
    desc: Creates a tar archive
    if:
      type: text
      # GNU and BSD tar accept both `tar -czf` and traditional `tar czf`.
      regex: '(^|[\n;&|({\[=:])\s*tar\s+-?[A-Za-z]*c[A-Za-z]*\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: tar-create-bundled-options
    desc: Creates tar archive with bundled options
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '^tar\s+c[A-Za-z]*f\s'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: tar-from-file-list
    desc: Creates tar archive from file-list input
    conf: 0.85
    if:
      type: text
      regex: '(^|[\n;&|({\[=:"''`])\s*tar[ \t]+-[A-Za-z]*T([ \t]|$)'
  - id: tar-current-dir
    desc: Archives current directory to tar file
    conf: 0.75
    platforms: [unix]
    if:
      type: text
      regex: '(^|[\n;&|({\[=:"''`])\s*tar\s+-[a-zA-Z]*c[a-zA-Z]*f[a-zA-Z]*\s+\S+\s+\.'
    downgrade:
      any:
        - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
        - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test

composite_rules:
  - id: python-gzip-tar-archive
    desc: Creates gzip-compressed tar archive in Python
    for: [python, pyc]
    conf: 0.94
    all:
      - id: micro-behaviors/data/compress/library::gzip-compress-call
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
