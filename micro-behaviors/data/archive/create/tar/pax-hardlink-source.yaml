defaults:
  for: [ruby]
  platforms: [unix]
  crit: notable
traits:
  - id: pax-linkpath-record-call
    desc: Constructs a PAX linkpath record
    if:
      type: text
      exclude_comments: true
      regex: '\w{1,40}\(["'']linkpath["'']\s*,'
  - id: hardlink-nonzero-data-entry
    desc: Hardlink header retains replacement data size
    if:
      type: text
      exclude_comments: true
      regex: '\w{1,40}\(\w{1,40},\s*\w{1,40}\.bytesize,[^\n]{0,80}type:\s*["'']1["'']'
