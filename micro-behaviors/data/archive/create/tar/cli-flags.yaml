defaults:
  platforms: [macos]
  for: [shell, applescript, python]

traits:
  - id: tar-create-flag
    desc: tar command with create flag
    crit: component
    conf: 0.5
    if:
      type: string_literal
      regex: tar\s+-[a-z]*c[a-z]*
  - id: tar-create-long
    desc: tar --create long option
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      substr: tar --create
composite_rules:
  - id: tar-archive-command
    desc: tar or gzip archive command
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/data/archive/create/tar::tar-create-flag
      - id: micro-behaviors/data/archive/create/tar::tar-create-long
      - id: "micro-behaviors/data/codec::gzip-cli-flag"
    unless:
      # Autotools configure scripts probe tar/gzip as build tooling, not staging.
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/build/autotools::autotools-input-script-basename
      - id: metadata/build/autotools::autoconf-init-marker
