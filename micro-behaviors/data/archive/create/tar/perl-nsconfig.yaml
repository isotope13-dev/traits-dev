defaults:
  platforms: [unix]
  for: [perl]
traits:
  - id: perl-nsconfig-tar-command
    desc: Perl archives appliance nsconfig with tar
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        kind: string
        regex: '^tar -?[a-zA-Z]*c[a-zA-Z]*f\s+\S+\s+/flash/nsconfig\b'
