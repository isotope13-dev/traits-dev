# Archive utility use is a neutral capability. Collection or exfiltration
# intent requires separate evidence in an objective-tier composite.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1560.001

traits:
  - id: macos-ditto-compress-flags
    desc: macOS ditto uses ZIP compression flags
    crit: notable
    conf: 0.85
    for: [shell, applescript]
    platforms: [macos]
    if:
      type: text
      regex: '\bditto\s+-c\s+-k\b'
  - id: macos-ditto-sequester-resources
    desc: macOS ditto preserves resource forks
    crit: notable
    conf: 0.85
    for: [shell, applescript]
    platforms: [macos]
    if:
      type: text
      substr: --sequesterRsrc
  - id: macos-ditto-zip-output
    desc: macOS ditto writes a ZIP archive
    crit: notable
    conf: 0.85
    for: [shell, applescript]
    platforms: [macos]
    if:
      type: text
      regex: '\bditto\b.{0,80}\.zip\b'

  - id: shell-7z-create
    desc: Shell invokes 7-Zip to create an archive
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\n;&|({=:])\s*7z[a]?\.?(exe)?\s+[a-z-]*a\b'
