traits:
- id: rar-archive-command
  for:
  - scripts
  desc: RAR archive command
  if:
    type: text
    regex: (?i)\b(rar|winrar)(\.exe)?\s+[a-z-]*a\b
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: metadata/file/function::source-no-parsed-call-sites
  - id: well-known/tool/detection/redac-n::redac-n-structure-analyzer
composite_rules:
- id: archive-with-network-share-reference
  for:
  - batch
  - powershell
  desc: Archive command and network-share path co-occur
  all:
  - id: micro-behaviors/data/archive/create/utility::archive-utility-create
  any:
  - id: micro-behaviors/os/network/share::unc-path-reference
  - id: micro-behaviors/os/network/share::windows-admin-share-path
defaults:
  attack: T1560.001
  crit: notable
  conf: 0.94
  platforms:
  - unix
  - windows
