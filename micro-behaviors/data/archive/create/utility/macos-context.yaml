defaults:
  for:
  - shell
  - applescript
  - python
  - javascript
  - typescript
  platforms:
  - macos
  crit: notable
traits:
- id: ditto-keepparent
  desc: ditto --keepParent compression
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    regex: ditto.{0,30}--keepParent.{0,30}-c
- id: ditto-rsrc-flag
  desc: ditto -rsrc flag
  crit: notable
  conf: 0.8
  if:
    type: string_literal
    regex: ditto.{0,30}-rsrc
- id: zip-recursive-quiet
  desc: zip -r or -q flag
  crit: notable
  conf: 0.6
  if:
    type: string_literal
    regex: \bzip\s+-[rq]
composite_rules:
- id: ditto-compress-comp
  desc: ditto archive creation with compression
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/data/archive/create/utility::macos-ditto-compress-flags
  - id: micro-behaviors/data/archive/create/utility::ditto-keepparent
- id: ditto-sequester-comp
  desc: ditto with resource fork handling
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/archive/create/utility::macos-ditto-sequester-resources
  - id: micro-behaviors/data/archive/create/utility::ditto-rsrc-flag
- id: zip-create-comp
  for: [shell, applescript, python]
  desc: zip archive creation
  crit: notable
  conf: 0.75
  all:
  - id: micro-behaviors/data/archive/create/utility::zip-recursive-quiet
  - id: metadata/lang/source/syntax/command/invocation::zip-output-file-command-text
- id: tmp-archive
  desc: Archive creation with temporary ZIP path references
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/data/archive/create/utility::zip-create-comp
  - id: micro-behaviors/data/archive/create/utility::ditto-compress-comp
  all:
  - id: micro-behaviors/fs/path/temp::tmp-zip-path
  unless:
  - id: well-known/app/infrastructure/skypilot::skypilot-source-file
- id: ditto-temp-archive-context
  desc: ditto compression with temporary archive references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/archive/create/utility::ditto-compress-comp
  - id: micro-behaviors/data/archive/create/utility::ditto-sequester-comp
  all:
  - id: micro-behaviors/data/archive/create/utility::tmp-archive
