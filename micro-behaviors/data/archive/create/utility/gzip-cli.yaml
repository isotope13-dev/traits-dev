# The gzip CLI with level, stdout, force or no-name flags writes compressed
# output. `gzip -d`/`-t` (decompress, test) do not match.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: gzip-cli-compression-flags
    desc: Runs gzip CLI with compression flags
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bgzip\s+-[1-9cfn]+\b'
