# Command-line archive utilities.  The utility capability is neutral; intent
# comes from what is being archived and where the data came from.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1560.001

traits:
  - id: archive-7z-create
    desc: 7-Zip creates an archive
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s"''`])7z(\.exe)?\s+[a-z-]*a(\s|$)'
  - id: archive-7zip-renamed-create
    desc: Renamed 7-Zip binary creates an archive
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s"''`])7\.exe\s+[a-z-]*a(\s|$)'
  - id: archive-rar-create
    desc: RAR creates an archive
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s"''`])(rar|winrar)(\.exe)?\s+[a-z-]*a(\s|$)'
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites

  - id: makecab-create
    desc: makecab creates a CAB archive
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\s"''`])makecab(\.exe)?\s+[^\r\n]{1,240}\.cab\b'

composite_rules:
  - id: archive-utility-create
    desc: Command archive utility creates archive
    crit: notable
    conf: 0.9
    any:
      - id: archive-7z-create
      - id: archive-7zip-renamed-create
      - id: archive-rar-create
