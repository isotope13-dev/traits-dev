# Assembling a RubyGems package archive from inside a running program, through
# the in-process API rather than the `gem build` command line.
#
# Release tooling does this legitimately (Bundler's gem tasks, rake-compiler),
# so the capability is neutral here. It is worth its own atom because the
# `gem build` matcher in micro-behaviors/process/create/shell/build/ only sees
# the shell spelling: a payload that mints packages at run time calls the API
# directly and leaves no command line behind.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.92
  attack: T1560

traits:
  - id: gem-package-build-call
    desc: Builds a gem archive via RubyGems API
    if:
      type: text
      regex: '\bGem::Package\.build\s*\('
