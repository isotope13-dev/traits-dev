defaults:
  platforms:
  - windows
  crit: notable
  for:
  - pe
  - batch
traits:
- desc: IExpress unattended build command reference
  conf: 0.9
  if:
    type: text
    regex: (?i);iexpress\s+/n\s+/q\s+/m
  id: iexpress-unattended-build-command-reference
composite_rules:
- desc: IExpress build reference with SED payload fields
  conf: 0.95
  all:
  - id: micro-behaviors/data/archive/create/package::iexpress-unattended-build-command-reference
  any:
  - id: metadata/package/files/source-input::sed-source-directory-temp-env-form
  - id: metadata/package/files/source-input::sed-source-directory-users-path-form
  - id: metadata/package/scripts/reference::sed-command-field-script-host-reference
  - id: metadata/package/scripts/reference::sed-command-field-powershell-reference
  id: iexpress-build-with-source-or-command-fields
