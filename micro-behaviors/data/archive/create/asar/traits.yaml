defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: asar-pack
    desc: Calls Electron ASAR creation API
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^asar\.(createPackage(WithOptions)?|pack)$'
