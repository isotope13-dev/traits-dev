defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: asar-pack
    desc: Calls Electron ASAR creation API
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^asar\.(createPackage(WithOptions)?|pack)$'

  - id: asar-pickle-format-strings
    desc: Electron ASAR Pickle header format strings
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, binaries]
    if:
      type: text
      regex: (?i)\b(headerPickle|sizePickle|size-pickle format|(Truncated|Corrupt) asar header)\b
