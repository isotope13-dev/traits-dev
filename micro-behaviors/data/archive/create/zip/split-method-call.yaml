# Match invocation syntax, not an API fragment sitting in a string table.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: split-add-local-folder-call
    desc: Calls addLocalFolder through split member name
    if:
      type: text
      regex: \[['"]addLoc['"]\s*\+\s*['"]alFold['"]\s*\+\s*['"]er['"]\]\(
  - id: split-write-zip-call
    desc: Calls writeZip through split member name
    if:
      type: text
      regex: \[['"]writeZ['"]\s*\+\s*['"]ip['"]\]\(
