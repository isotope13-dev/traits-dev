defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
  - id: php-url-password-archive
    desc: PHP archives stored URL and password records
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/scripted::php-open-tag
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/communications/http/request/superglobal::php-secret-request-parameter
      - id: micro-behaviors/data/property/access::php-url-password-record
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-create

  - id: php-url-password-archive-download
    desc: PHP exposes archived URL and password records for download
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/data/property/access::php-url-password-record
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-create
      - id: micro-behaviors/communications/http/download/handler::php-archive-download-link
