defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [powershell]
  attack: T1041

traits:
  - id: powershell-base64-archive-body
    desc: "Archive creation before Base64 conversion"
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Compress-Archive[\s\S]{0,420}ToBase64String'
