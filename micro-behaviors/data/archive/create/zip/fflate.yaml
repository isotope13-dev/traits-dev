defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: fflate-zip-creation-call
    desc: Imports fflate and calls ZIP creation
    crit: notable
    conf: 0.93
    # The imported library and a real call are both required. A reference
    # to a package alone, or an unrelated function named zip, is insufficient.
    all:
      - id: metadata/import/npm/fflate
      - id: metadata/lang/source/syntax/call/arguments::js-zip-named-call
