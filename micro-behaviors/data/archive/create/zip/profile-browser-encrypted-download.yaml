defaults:
  platforms: [windows, unix]
  for: [html, svg]

composite_rules:
  - id: page-encrypted-zip-download-clues
    desc: Page ZIP encryption, construction and download clues
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/symmetric/stream/zipcrypto::source-initial-key-constants
      - id: micro-behaviors/data/archive/create/zip::dataview-zip-local-header-write
    any:
      - id: micro-behaviors/ui/window/dom/tree::dom-blob-download-link
      - id: micro-behaviors/ui/window/dom/tree::object-url-click-or-download-attribute
