defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: php-ziparchive-create
    desc: PHP creates a ZIP archive
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bZipArchive\b[\s\S]{0,240}\bZIPARCHIVE::CREATE\b'

  - id: php-ziparchive-add-from-string
    desc: PHP ZipArchive adds in-memory member
    if:
      type: text
      substr: addFromString
    unless:
      - id: metadata/package/quality/false-positives::php-manual-empty-function-stubs
