# Archive walks that deliberately exclude hidden entries.
#
# A collector wants the dotfiles: ~/.ssh, ~/.aws, ~/.config, browser profiles.
# A packaging helper wants the opposite, and says so in the walk --
#
#   dirs[:] = [d for d in dirs if not d.startswith(".") and d != "__MACOSX"]
#   if name.startswith(".") or name == "Thumbs.db": continue
#
# -- which is roboflow's _zip_directory, shipping a caller-supplied dataset to
# the platform. Skipping the sensitive half of the tree is strong evidence the
# archive is a work product, so the collection objectives reference this.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: walk-skips-dotdirs
    desc: Directory walk filters hidden directories
    if:
      type: text
      regex: 'dirs\[:\][^\n]{0,60}not\s+\w+\.startswith\(\s*["\x27]\.["\x27]'

  - id: walk-skips-dotfiles
    desc: Directory walk filters hidden files
    if:
      type: text
      regex: '(?m)if\s+\w+\.startswith\(\s*["\x27]\.["\x27]\s*\)[^\n]{0,60}:'

composite_rules:
  - id: hidden-excluding-archive-walk
    desc: Archive walk excludes hidden entries
    crit: exception
    conf: 0.92
    any:
      - id: walk-skips-dotdirs
      - id: walk-skips-dotfiles
