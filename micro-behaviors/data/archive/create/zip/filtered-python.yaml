# Name filtering alone is not archive creation. These predicates retain
# their exact suppression role for archive-collection consumers.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

composite_rules:
  - id: hidden-excluding-archive-walk
    desc: Name filter excludes hidden entries
    crit: exception
    conf: 0.92
    any:
      - id: micro-behaviors/fs/search/content::walk-skips-dotdirs
      - id: micro-behaviors/fs/search/content::walk-skips-dotfiles
