defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1560.001

traits:
  - id: python-zipfile-writer
    desc: Python opens ZipFile in write mode
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(zipfile\.)?ZipFile$'
      arg:
        kind: string
        exact: w
  - id: python-shutil-make-archive
    desc: Python creates an archive via shutil
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: shutil.make_archive
