defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-zip-cli-quiet-create
    desc: Invokes quiet ZIP CLI creation
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']zip["'']\s*,\s*\[\s*["'']-q["'']'
  # A ZIP local file header written field by field through a DataView
  # (`setUint32(0, 0x04034b50, true)`): the script assembles the archive
  # bytes itself instead of calling a library. Seen building a password-
  # protected ZIP client-side in a phishing page (2026-09).
  - id: dataview-zip-local-header-write
    desc: Hand-writes a ZIP local file header
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, svg]
    if:
      type: text
      regex: 'setUint32\(\s*0\s*,\s*(0x04034[bB]50|67324752)\s*,\s*(true|!0|1)\s*\)'

