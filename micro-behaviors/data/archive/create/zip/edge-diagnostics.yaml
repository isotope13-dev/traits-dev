defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source, html]
  crit: notable
  conf: 0.97

traits:
  - id: edge-diagnostic-log-archive-call
    desc: Edge diagnostic log archive call
    if:
      # Text also covers browser scripts carried by another language. The
      # private API belongs to Edge; the archive name is attacker-controlled.
      type: text
      regex: '\bedgeFeedbackPrivate\s*\.\s*zipDiagnosticLogFiles\s*\('
