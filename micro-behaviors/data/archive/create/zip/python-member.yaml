defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-zipfile-write-string
    desc: Writes in-memory content to ZipFile
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writestr$'
      receiver:
        from:
          call: '(^|\.)ZipFile$'
  - id: python-zipfile-writestr-text
    desc: ZipFile writestr call in source text
    if:
      type: text
      regex: '\.writestr\s*\('
