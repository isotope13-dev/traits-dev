# Bind the PHP request source to the command argument, then bind those bytes
# to writestr's content argument. A PHP string beside an unrelated archive
# write is insufficient. This observes source generation, not a running PHP
# endpoint; the upload composite supplies deployment context.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-archive-request-command-php
    desc: writestr receives request-command PHP source
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writestr$'
      args:
        - index: 0
          from:
            value: '\.php$'
        - index: 1
          from:
            value: '<\?php\s*@?(system|exec|passthru)\s*\(\s*\$_REQUEST\s*\['
