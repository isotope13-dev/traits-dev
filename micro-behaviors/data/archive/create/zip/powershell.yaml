defaults:
  platforms: [windows, unix]
  for: [powershell]

traits:
  - id: powershell-compress-archive
    desc: PowerShell Compress-Archive command reference
    crit: notable
    conf: 0.8
    for: [powershell, vbs, pe, dll]
    if:
      type: text
      regex: '(?i)\bCompress-Archive\s+-'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
