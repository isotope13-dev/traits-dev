# What a RAR NTFS alternate-data-stream record carries. Ordinary streams are
# small metadata labels (Zone.Identifier, SummaryInformation); a stream whose
# name ends in a runnable file type, or that holds kilobytes of data, is a
# file riding behind its host member. Facts only; intent lives in objectives.
defaults:
  platforms: [windows]
  for: [rar]
  crit: notable
  conf: 0.95

traits:
  - id: ntfs-stream-runnable-name
    desc: RAR NTFS stream has a runnable name
    if:
      type: value
      path: "rar.ntfs_streams[*].stream"
      regex: '(?i)\.(exe|scr|com|pif|dll|cpl|hta|vbs|vbe|jse?|wsf|bat|cmd|ps1|lnk)$'

  - id: ntfs-stream-over-1kb
    desc: RAR NTFS stream holds 1KB or more
    if:
      type: value
      path: "rar.ntfs_streams[*].size_bytes"
      regex: '^[1-9][0-9]{3,}$'
