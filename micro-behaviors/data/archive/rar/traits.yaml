defaults:
  platforms: [windows]
  for: [data, rar]

traits:
  - id: ads-parent-traversal
    desc: RAR member ADS parent traversal
    for: [rar]
    crit: component
    conf: 0.95
    count_min: 1
    if:
      type: hex
      pattern: "3A 2E 2E 5C 2E 2E 5C"

  - id: repeated-ads-parent-traversal
    desc: RAR member repeats parent traversal

    for: [rar]
    crit: component
    conf: 0.95
    count_min: 4
    if:
      type: hex
      pattern: "2E 2E 5C"
    unless:
      - id: metadata/package/files/bsd::freebsd-pkg-zstd-archive

  # `type: raw`, not `text`: archive analysis does not populate extracted
  # strings on the container (verified -- a text search for a member-name
  # substring returns zero matches on a RAR that raw finds immediately), so
  # this atom silently never fired and dead-ended both Startup-traversal
  # hostiles in objectives/persistence/login/startup/shortcut/. Member names
  # live in the RAR5 header as UTF-8, and the path segment is plain ASCII.
  - id: startup-member-path
    desc: RAR member targets Startup folder
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: 'Start Menu\\Programs\\(\.\.\\Programs\\){0,4}Startup'

  - id: lnk-member-extension
    desc: RAR member contains shortcut extension
    crit: component
    conf: 0.85
    if:
      type: raw
      regex: '(?i)\.lnk([^A-Za-z0-9]|$)'

  # The archive container may be nested in a package (RPM, tar, …), where the
  # `for:` filter alone does not stop a raw byte search from seeing
  # coincidental extension bytes in the outer container.  Anchor the RAR
  # signature at byte zero and bound the header search so each atom is safe
  # when an outer package is the analyzed file.
  - id: vbs-script-member-extension
    desc: RAR archive names a VBS script member
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: '52 61 72 21 1A 07 (00|01) [0-65535] 2E 76 62 73'
    unless:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest

  - id: js-script-member-extension
    desc: RAR archive names JS/JSE script member
    crit: notable
    conf: 0.9
    if:
      type: hex
      # `.js\0` or `.jse` — not the `.js` prefix of `.jsp`/`.json`.
      pattern: '52 61 72 21 1A 07 (00|01) [0-65535] 2E 6A 73 (00|65)'

  # HTA is a WSH host, but kept separate from vbs/js so document-lure
  # composites can key on HTML Application delivery without pulling in
  # every script-bearing RAR. Hex (not text): archive analysis does not
  # populate extracted strings on the container.
  # This raw token is intentionally separate from the RAR-gated composite
  # below: document-lure composites can require both the token and RAR magic.
  - id: hta-extension-token
    desc: HTA file extension token in raw bytes
    crit: component
    conf: 0.92
    if:
      type: raw
      regex: '(?i)\.hta([^A-Za-z0-9]|$)'

  # EUR1 + .hta — EU customs Accompanying Document lure used by HTA
  # dropper campaigns; ASCII so it survives RAR headers without UTF-8.
  - id: customs-eur1-hta-member
    desc: RAR HTA member references EUR1 customs form
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "45 55 52 31 2e 68 74 61" # EUR1.hta

  # "HS" (Harmonized System code) within ~7 bytes before ".hta"
  - id: customs-hs-hta-member
    desc: RAR HTA member references HS customs codes
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "48 53 ?? ?? ?? ?? ?? ?? ?? 2e 68 74 61" # HS … .hta

  - id: shell-script-member-extension
    desc: RAR member has .bat/.cmd/.ps1 extension
    crit: component
    conf: 0.9
    if:
      type: raw
      # Require a word boundary so Maven paths like springframework.batch do not
      # match the `.bat` alternative as a prefix of `.batch`.
      regex: '(?i)\.(bat|cmd|ps1)\b'
    unless:
      - id: metadata/package/files/bsd::freebsd-pkg-zstd-archive

  - id: scan-pdf-member-name
    desc: RAR member uses scan PDF lure
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)Scan_[0-9_.-]{6,40}\.pdf'

  - id: search-connector-member-extension
    desc: RAR member contains Search Connector
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.searchConnector-ms\b'

  - id: document-lure-search-connector-member
    desc: RAR Search Connector document lure
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)(important|document)[^/\\]{0,64}\.searchConnector-ms\b'

  - id: programdata-member-paths
    desc: RAR members target ProgramData
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      substr: "ProgramData"

  - id: gta5-mod-menu-root
    desc: RAR member GTA5 mod root
    crit: component
    conf: 0.85
    if:
      type: text
      substr: "GTA5_Mod_Menu/"

  - id: gta5-mod-menu-setup-exe
    desc: RAR member GTA5 setup executable
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "GTA5_Mod_Menu/setup.exe"

  - id: gta5-mod-menu-code-tunnel
    desc: RAR member VS Code tunnel executable
    crit: component
    conf: 0.92
    if:
      type: text
      substr: "GTA5_Mod_Menu/bin/code-tunnel.exe"

  - id: gta5-mod-menu-code-cmd
    desc: RAR member VS Code command launcher
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "GTA5_Mod_Menu/bin/code.cmd"

  - id: gta5-mod-menu-steam-resources
    desc: RAR member Steam overlay resources
    crit: component
    conf: 0.86
    count_min: 3
    if:
      type: text
      substr: "GTA5_Mod_Menu/resource/steam"

composite_rules:
  - id: wsh-script-member-extension
    desc: RAR archive names a WSH script member
    crit: notable
    conf: 0.9
    any:
      - id: vbs-script-member-extension
      - id: js-script-member-extension
    unless:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest

  # Canonical HTA-member atom for every consumer. A format-neutral twin used
  # to live in micro-behaviors/data/archive/member/ as a bare 4-byte hex scan
  # ("2E 68 74 61", plus .vbs/.vbe/.jse/.bat/.cmd/.ps1 siblings) with no
  # container anchor. Its `for: [rar]` gate did not restrict it, and in a zip
  # family container the member name is followed immediately by the deflate
  # stream, so a `.js` entry whose first compressed byte is 0x65 reads as a
  # ".jse" member -- every Chrome extension / wheel / jar shipping JavaScript
  # got a phantom encoded-script finding. Requiring RAR magic before the
  # extension bytes is what makes the "archive names a member" claim true.
  - id: hta-member-extension
    desc: RAR member contains HTA extension
    crit: notable
    conf: 0.92
    all:
      - id: hta-extension-token
    any:
      - id: metadata/file/magic/identity::rar-v4
      - id: metadata/file/magic/identity::rar-v5
