defaults:
  platforms: [windows]
  for: [data, rar]

traits:
  - id: rar-ntfs-stream-member
    for: [rar]
    desc: RAR carries an NTFS alternate stream
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].entry_type"
      exact: ntfs-stream

  - id: ads-parent-traversal
    desc: RAR member ADS parent traversal
    for: [rar]
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].path"
      regex: ':[^/]*\.\.[/\\]'

  - id: repeated-ads-parent-traversal
    desc: RAR member repeats parent traversal
    for: [rar]
    crit: component
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(\.\.[/\\]){4,20}'

  - id: rar-ads-traversal-burst
    desc: RAR member bursts parent-path traversal
    for: [rar]
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(\.\.[/\\]){8,20}'
    unless:
      - id: metadata/package/files/bsd::pkg-archive-kind
      - id: metadata/package/testing/presence/

  # `type: raw`, not `text`: archive analysis does not populate extracted
  # strings on the container (verified -- a text search for a member-name
  # substring returns zero matches on a RAR that raw finds immediately), so
  # this atom silently never fired and dead-ended both Startup-traversal
  # hostiles in objectives/persistence/login/startup/shortcut/. Member names
  # live in the RAR5 header as UTF-8, and the path segment is plain ASCII.
  - id: startup-member-path
    for: [rar]
    desc: RAR member targets Startup folder
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)Start Menu/Programs/.*/Startup/'

  - id: lnk-member-extension
    for: [rar]
    desc: RAR member contains shortcut extension
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.lnk$'
    unless:
      # Random compressed bytes in a FreeBSD pkg are not a RAR member name.
      - id: metadata/package/files/bsd::pkg-archive-kind

  # The archive container may be nested in a package (RPM, tar, …), where the
  # `for:` filter alone does not stop a raw byte search from seeing
  # coincidental extension bytes in the outer container.  Anchor the RAR
  # signature at byte zero and bound the header search so each atom is safe
  # when an outer package is the analyzed file.
  - id: vbs-script-member-extension
    for: [rar]
    desc: RAR archive names a VBS script member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.vbs$'

  - id: js-script-member-extension
    for: [rar]
    desc: RAR archive names JS/JSE script member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.(js|jse)$'

  - id: html-member-extension
    for: [rar]
    desc: RAR archive names HTML member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.html?$'

  - id: exe-member-extension
    for: [rar]
    desc: RAR archive names an executable member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.exe$'

  - id: msi-member-extension
    for: [rar]
    desc: RAR archive names an MSI member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.msi$'

  - id: png-member-extension
    for: [rar]
    desc: RAR archive names a PNG member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.png$'
    unless:
      - id: metadata/package/files/nuget::nupkg-managed-library-member

  - id: php-eval-gzinflate-token
    for: [rar]
    desc: RAR bytes contain eval-gzinflate decoder
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "65 76 61 6C 28 67 7A 69 6E 66 6C 61 74 65"

  - id: php-move-uploaded-file-token
    for: [rar]
    desc: RAR bytes contain a PHP upload stager
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "6D 6F 76 65 5F 75 70 6C 6F 61 64 65 64 5F 66 69 6C 65"

  - id: pdf-member-extension
    for: [rar]
    desc: RAR archive names a PDF member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.pdf$'

  - id: installer-msi-member-name
    for: [rar]
    desc: RAR member names a setup MSI
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(setup|install).{0,40}\.msi$'

  - id: setup-exe-member-name
    for: [rar]
    desc: RAR member names a setup executable
    crit: notable
    conf: 0.92
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(setupfile|set[-_]?up)\.exe$'

  - id: game-cheat-member-name
    for: [rar]
    desc: RAR member names a game cheat
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(modmenu|skinchanger|cheat)'

  - id: lure-exe-member-name
    for: [rar]
    desc: RAR member names a business-lure executable
    crit: notable
    conf: 0.92
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(invoice|statement|quotation|payment|shipping|order).{0,40}\.exe$'

  - id: rar-multi-exe-header
    for: [rar]
    desc: RAR header names several executables
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.exe$'

  - id: hta-member-extension
    for: [rar]
    desc: RAR archive names an HTA member
    crit: notable
    conf: 0.92
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.hta$'

  - id: document-lure-html-member
    desc: RAR HTML member uses a document lure
    crit: suspicious
    conf: 0.93
    for: [rar]
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(invoice|waybill|awb|shipment|tracking|customs|statement).{0,40}\.(html?|hta)$'

  - id: shell-script-member-extension
    for: [rar]
    desc: RAR member has .bat/.cmd/.ps1 extension
    crit: component
    conf: 0.9
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.(bat|cmd|ps1)$'

  - id: vscode-tunnel-member
    for: [rar]
    desc: RAR member is a VS Code tunnel
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(^|/)code-tunnel\.exe$'

  - id: search-connector-member-extension
    for: [rar]
    desc: RAR member contains Search Connector
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)\.searchConnector-ms$'

  - id: document-lure-search-connector-member
    for: [rar]
    desc: RAR Search Connector document lure
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)(important|document)[^/]{0,30}\.searchConnector-ms$'

  - id: programdata-member-paths
    for: [rar]
    desc: RAR members target ProgramData
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: value
      path: "rar.members[*].path"
      regex: '(?i)ProgramData'

composite_rules:
  - id: wsh-script-member-extension
    for: [data, rar, zip, crx, xpi]
    desc: RAR archive names a WSH script member
    crit: notable
    conf: 0.9
    any:
      - id: vbs-script-member-extension
      - id: js-script-member-extension
    unless:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
