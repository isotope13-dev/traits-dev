# Script / encoded-script member extensions in RAR archives (hex for
# container headers — text extractors often skip ADS stream names).
defaults:
  platforms: [windows]
  for: [rar]

traits:
  - id: wsh-script-member-extension
    desc: RAR member contains WSH script
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/file/format::web-extension-root-manifest
    if:
      type: hex
      pattern: "2E 76 62 73" # .vbs

  - id: vbe-member-extension
    desc: RAR member contains encoded VBE script
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "2E 76 62 65" # .vbe

  - id: jse-member-extension
    desc: RAR member contains encoded JSE script
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 6A 73 65" # .jse

  - id: hta-member-extension
    desc: RAR member contains HTA extension
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "2e 68 74 61" # .hta

  - id: shell-script-member-extension
    desc: RAR member contains BAT script
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 62 61 74" # .bat

  - id: cmd-member-extension
    desc: RAR member contains CMD script
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 63 6D 64" # .cmd

  - id: ps1-member-extension
    desc: RAR member contains PowerShell script
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 70 73 31" # .ps1
