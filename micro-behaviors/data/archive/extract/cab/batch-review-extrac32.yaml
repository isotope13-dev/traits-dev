# Cabinet self-extract stubs invoke extrac32 against the running script
# path, then launch the dropped EXE from %tmp%.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.93

traits:
  - id: extrac32-self-extract
    desc: Self-extracts via extrac32 on itself
    if:
      type: text
      regex: '(?i)extrac32(\.exe)?\s+/y\s+"?%~f0"?'
