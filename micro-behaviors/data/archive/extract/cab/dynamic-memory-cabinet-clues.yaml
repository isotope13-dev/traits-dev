---
composite_rules:
- id: cabinet-dynamic-api-memory-clues
  desc: Cabinet, dynamic API and memory clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/archive/extract/cab::setupapi-cabinet-iterate
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: metadata/file/profile/memory/protection-context::virtual-memory-allocation-protection-api-pair
- id: unsigned-cabinet-random-pdb-clues
  desc: Unsigned cabinet and random PDB clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/data/archive/extract/cab::cabinet-dynamic-api-memory-clues
  - id: metadata/binary/debug::pdb-unstructured-word-path
  - id: metadata/signed/trust-level::unsigned
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
