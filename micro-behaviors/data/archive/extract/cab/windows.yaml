# Windows expand.exe extracts Microsoft Cabinet archives.
defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  attack: T1140
  mbc: C0024

traits:
  - id: expand-cab-command
    desc: expand extracts a Cabinet archive
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bexpand(\.exe)?\s+[^\r\n]{0,80}\.cab\b'
