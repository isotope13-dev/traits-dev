# Cabinet extraction through SETUPAPI instead of a decompression library.
#
# `SetupIterateCabinetW` walks a .cab and hands each member to a callback. That
# is how a driver package is installed -- and, for a dropper, a way to unpack a
# payload without linking a decompressor, without spawning `expand.exe`, and
# behind an import that reads as ordinary device-installation code. The file
# queue APIs beside it copy the extracted members into place under the same
# cover. Neutral capability: real driver installers do exactly this, so intent
# comes from what the extracted files are and where they land.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  - id: setupapi-cabinet-iterate
    desc: Extracts a cabinet via SetupIterateCabinet
    conf: 0.9
    if:
      type: import
      regex: '^SetupIterateCabinet[AW]?$'
  - id: setupapi-file-queue-copy
    desc: Copies files through a SETUPAPI queue
    conf: 0.85
    if:
      type: import
      regex: '^Setup(QueueCopy|QueueDefaultCopy|QueueRename)[AW]?$'
