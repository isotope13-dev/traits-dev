# extrac32 accepts a "file.ext:stream" source, unpacking a cabinet that is
# hidden in an NTFS alternate data stream of an innocuous-looking file.
defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, javascript, lnk]
  attack: T1564.004,T1140

traits:
  - id: extrac32-ntfs-stream-source
    desc: Extracts a cabinet from an NTFS stream
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bextrac32(\.exe)?\s[^\r\n]{0,60}\.[a-z0-9]{1,5}:[a-z0-9_.-]{1,40}\b'
