defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-comment-silent-ascii
  desc: SFX comment requests silent install
  crit: notable
  conf: 0.9
  for: [data]
  if:
    # Single-byte counterpart of the UTF-16 comment observation for bare
    # SFX comment fragments. Anchored to its own line so a bare token
    # inside unrelated data does not match.
    type: raw
    regex: '(?im)^Silent[ \t]*=[ \t]*"?1"?[ \t]*\r?(\n|$)'
