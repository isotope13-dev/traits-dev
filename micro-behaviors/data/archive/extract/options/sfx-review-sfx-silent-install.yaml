defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-silent-install
  desc: SFX silent installation directive
  crit: notable
  conf: 0.9
  for: [pe, static-lib, text]
  unless:
    # Stock WinRAR supports silent-install directives.
    - id: well-known/tool/sysadmin/winrar::winrar-component
  if:
    # Anchor the directive to its own CRLF-terminated line. SFX config
    # blocks are line-based (`...=\r\nSilent=1\r\n...`); a bare "Silent=1"
    # token inside a bundled app's data or minified JS is not an SFX
    # directive, and multi-megabyte bundles embed those constantly.
    type: raw
    regex: '(?i)\r\nSilent[ \t]*=[ \t]*"?1"?\r?(\n|$)'

