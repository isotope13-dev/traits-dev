defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-silent-utf16
  desc: UTF-16 SFX silent install flag
  crit: notable
  conf: 0.9
  if:
    # The SFX config is part of the archive appended after the stub.
    type: hex
    section: overlay
    pattern: "53 00 69 00 6C 00 65 00 6E 00 74 00 3D 00 31 00"

