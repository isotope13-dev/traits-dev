defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-overwrite-utf16
  desc: UTF-16 SFX overwrite flag
  crit: notable
  conf: 0.9
  if:
    # The SFX config is part of the archive appended after the stub.
    type: hex
    section: overlay
    pattern: "4F 00 76 00 65 00 72 00 77 00 72 00 69 00 74 00 65 00 3D 00 31 00"

