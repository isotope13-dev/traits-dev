defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: admzip-archive-library
    desc: JavaScript uses the AdmZip archive library
    conf: 0.9
    if:
      type: text
      word: AdmZip
  # AdmZip's extract-everything call. The library name itself is often
  # assigned (`const z = require("adm-zip")`) so the method is the stable tell.
  - id: js-zip-extract-all-to
    desc: Extracts every entry from a zip
    conf: 0.9
    if:
      type: text
      substr: extractAllTo

  # `execSync("unzip ...")` is an archive-extraction capability even when the
  # archive is a user-requested installer.  Keep this as notable micro-behavior
  # evidence; download-and-launch objectives must supply the hostile intent.
  - id: js-unzip-extraction-command
    desc: JavaScript invokes unzip archive extraction
    conf: 0.95
    if:
      type: text
      regex: '\bexecSync[A-Za-z0-9_$]*\s*\(\s*["''`]\s*unzip\b[^"''`\n]{0,240}["''`]'
  - id: js-archive-extraction-command
    desc: JavaScript zipfile extraction call
    conf: 0.9
    if:
      type: text
      regex: '["'']zipfile["'']\s*,\s*["'']-e["'']'

  # The argv form the execSync command-string regex above cannot see:
  # `spawnSync('unzip', [archive, '-d', dir])`.
  - id: node-spawn-unzip-extract
    desc: Node spawns an external zip extractor
    conf: 0.92
    attack: T1105
    if:
      type: text
      regex: '\b(spawn|execFile)(Sync)?\s*\(\s*["''](unzip|7z|7za|bsdtar)["'']'
