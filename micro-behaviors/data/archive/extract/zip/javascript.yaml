defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # `execSync("unzip ...")` is an archive-extraction capability even when the
  # archive is a user-requested installer.  Keep this as notable micro-behavior
  # evidence; download-and-launch objectives must supply the hostile intent.
  - id: js-unzip-extraction-command
    desc: JavaScript invokes unzip archive extraction
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bexecSync[A-Za-z0-9_$]*\s*\(\s*["''`]\s*unzip\b[^"''`\n]{0,240}["''`]'
  - id: js-archive-extraction-command
    desc: JavaScript zipfile extraction call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']zipfile["'']\s*,\s*["'']-e["'']'
