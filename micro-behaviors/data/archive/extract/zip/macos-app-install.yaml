defaults:
  platforms: [macos]
  for: [macho, python, shell, applescript]
  crit: notable
  conf: 0.85

traits:
  - id: unzip-in-tmp
    desc: Runs unzip with /tmp as working directory
    conf: 0.88
    if:
      type: text
      substr: cd /tmp && unzip
  - id: unzip-applications-destination
    desc: unzip extracts into the Applications directory
    conf: 0.9
    if:
      type: text
      regex: 'unzip[^\r\n;]{0,100}-d[ \t]{0,4}["'']?/Applications\b'
  - id: ditto-applications-destination
    desc: ditto extracts into the Applications directory
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '\bditto\b[^\r\n;]{0,24}\s-[a-zA-Z]*x[^\r\n;]{0,80}\s["'']?/Applications\b'

composite_rules:
  - id: extract-zip-applications-destination
    desc: Extracts ZIP archive into /Applications
    conf: 0.9
    any:
      - id: ditto-applications-destination
      - id: unzip-applications-destination
