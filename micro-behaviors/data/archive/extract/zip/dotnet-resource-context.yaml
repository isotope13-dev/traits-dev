defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-resource-zip-extract-context
  desc: .NET ZIP extraction with resource access
  crit: notable
  conf: 0.9
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/data/archive/extract/zip::dotnet-zip-extract
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-or-wpf-resource-access
  any:
  - id: micro-behaviors/data/embedded/payload/resource::wpf-resource-stream-access
  - id: micro-behaviors/fs/temp/directory::temp-file-staging-dotnet
  - id: metadata/lang/compiler/managed::reflection-namespace
  - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
  unless:
  - id: metadata/binary/framework::dotnet-system-diagnostics-process-bcl
  - id: well-known/lib/ui/spectre-console/
  - id: well-known/lib/vendor-sdk/htmlforgex/
  - id: well-known/lib/vendor-sdk/powerforge/
  - id: well-known/lib/format/quantconnect-compression/
  - id: well-known/game/steamtools::member
  needs: 2
