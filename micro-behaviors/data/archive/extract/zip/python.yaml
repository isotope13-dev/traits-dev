defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-native-extension-archive-extraction
    desc: Python extracts native extension from ZIP
    conf: 0.96
    if:
      type: text
      # A native-extension member selected from the archive: a quoted .so/.pyd
      # filename (or the conventional _native module name) near the ZipFile
      # open. Matches any project's selector, not one codebase's
      # `base.startswith("_native.")` call shape.
      regex: 'zipfile\.ZipFile[\s\S]{0,520}["''][\w.~-]*(_native\.|\.so|\.pyd)["'']'
  - id: python-unzip-temp-archive-command
    desc: Python embeds temporary unzip command
    conf: 0.9
    if:
      type: literal
      regex: '\bunzip\s+.{0,80}(temp|tmp)\.zip\b'
composite_rules:
  - id: python-zipfile-extractall
    desc: Python ZIP archive extraction
    conf: 0.92
    all:
      - id: micro-behaviors/data/archive/zip::python-zipfile-handle
    any:
      - id: micro-behaviors/data/archive/extract/capability::python-extractall-call
