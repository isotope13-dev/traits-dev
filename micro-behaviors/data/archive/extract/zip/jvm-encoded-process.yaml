# Co-occurrence does not bind a Base64 value to the ZIP or launch target.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
composite_rules:
  - id: jvm-control-prefixed-zip-process-apis
    desc: Control-prefixed constants with ZIP extraction and process APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: metadata/file/encoded::java-control-prefixed-long-string
      - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode


