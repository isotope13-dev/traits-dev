defaults:
  crit: notable
  platforms: [unix]
  for: [shell, javascript, typescript]
traits:
- id: unzip-tool-reference
  desc: References unzip extraction tool
  crit: notable
  conf: 0.7
  for: [javascript, typescript]
  if:
    type: literal
    regex: '^unzip\s+-[A-Za-z]'

- id: unzip-quiet-dir
  desc: unzip quietly into directory
  crit: notable
  conf: 0.85
  for: [shell]
  if:
    type: text
    regex: unzip\s+-q.{0,40}-d

- id: node-unzip-cli-call
  desc: Node invokes unzip into a directory
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: text
    regex: 'execFile[A-Za-z0-9_$]*\s*\(\s*["'']unzip["'']\s*,\s*\['

# Parser-confirmed invocation also covers the default `unzip "$archive"`
# form. Its arguments may select listing/testing, so claim the utility call.
- id: shell-unzip-command-call
  desc: Shell invokes the unzip archive utility
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    type: symbol
    kind: call
    exact: unzip
