defaults:
  platforms: [unix, windows]

composite_rules:
  - id: fabric-net-fabric-zip-extraction-cooccurrence
    desc: Fabric namespace and ZIP extraction co-occur
    crit: notable
    conf: 0.97
    scope: archive
    for: [jar, zip, class, java_class]
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: metadata/archive/member/path::fabric-jar-net-fabric-class-member
      - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
