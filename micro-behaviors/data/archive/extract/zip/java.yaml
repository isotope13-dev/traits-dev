defaults:
  platforms: [unix, windows]
  for: [class, jar, zip, java, kotlin, groovy, scala]

traits:
  - id: jvm-zipfile-class-reference
    desc: JVM imports the ZipFile archive reader
    crit: notable
    conf: 0.84
    for: [apk, class, java_class, jar, zip]
    if:
      type: import
      exact: java/util/zip/ZipFile

  - id: jvm-zip-entry-iteration-bytecode
    desc: JVM iterates ZIP archive entries
    crit: notable
    conf: 0.92
    for: [class, jar, zip]
    if:
      type: import
      exact: java/util/zip/ZipInputStream.getNextEntry

  - id: jvm-zip-entry-read-bytecode
    desc: JVM reads ZIP archive entry data
    crit: notable
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: import
      exact: java/util/zip/ZipInputStream.read

  - id: zip-inputstream-source
    desc: Java ZipInputStream construction in source
    crit: notable
    conf: 0.9
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+ZipInputStream\s*\('

composite_rules:
  - id: jvm-zip-entry-extraction-to-file
    desc: JVM extracts ZIP entries to files
    crit: notable
    conf: 0.96
    for: [class, jar, zip]
    all:
      - id: jvm-zip-entry-iteration-bytecode
      - id: jvm-zip-entry-read-bytecode
      - id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
