defaults:
  crit: notable

traits:
  - id: macos-ditto-extract-zip
    desc: macOS ditto extracts a ZIP archive
    conf: 0.9
    for: [scripts, macho]
    platforms: [macos]
    if:
      type: text
      exclude_comments: true
      regex: '\bditto\b[^\r\n;]{0,24}\s-(x\b[^\r\n;]{0,12}-k|k\b[^\r\n;]{0,12}-x|xk|kx)\b'

