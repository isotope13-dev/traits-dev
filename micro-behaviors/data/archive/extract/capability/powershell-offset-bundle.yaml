defaults:
  platforms: [windows]
  for: [png, powershell, batch]
traits:
  - id: powershell-offset-member-write
    desc: PowerShell copies bundle member slices to files
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule powershell_offset_member_write {
          strings:
            $slice = /\$slice\s*=\s*New-Object byte\[\]\s+\$entry\.Size/ nocase
            $copy = /\[Array\]::Copy\(\$bytes,\s*\$entry\.Start,\s*\$slice,\s*0,\s*\$entry\.Size\)/ nocase
            $write = /\[System\.IO\.File\]::WriteAllBytes\(\$outPath,\s*\$slice\)/ nocase
          condition:
            // Raw code inside PNG is meaningful here only in the bundle carrier.
            (uint32be(0) != 0x89504e47 or
              uint32be(filesize-4) == 0x53544733) and
            for any c in (1..#copy) : (
              $slice in (@copy[c]-128..@copy[c]) and
              $write in (@copy[c]+!copy[c]..@copy[c]+!copy[c]+128)
            )
        }
