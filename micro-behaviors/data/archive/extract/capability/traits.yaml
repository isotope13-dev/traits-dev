defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: shell-copyhere-method
    desc: Shell CopyHere archive extraction method
    crit: notable
    conf: 0.9
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_][A-Za-z0-9_]{0,40}\.\s*CopyHere\b'
  - id: shell-copyhere-method-token
    desc: CopyHere archive-extraction method token
    crit: notable
    conf: 0.85
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\bCopyHere\b'

  - id: appimage-self-extract-command
    desc: AppImage self-extraction command
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '[A-Za-z0-9_${}./-]+\.AppImage\b[^\n]{0,60}--appimage-extract\b'

  - id: python-extractall-call
    desc: Python archive extractall call
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      regex: '(^|\.)extractall$'

  # Require an archive-producing receiver, not a parser's self.extract().
  - id: python-extract-member-call
    desc: Extracts a ZIP or tar archive member
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.extract$'
      receiver:
        from:
          call: '(^|\.)(ZipFile|TarFile|tarfile\.open)$'

  - id: sevenzip-extract-cmd
    desc: 7-Zip extract command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[\s;&|(`"''])7z[a-z]?(\.exe)?\s+x\b'

composite_rules:
  - id: archive-extraction-context
    desc: References archive extraction mechanics
    crit: component
    conf: 0.75
    any:
      - id: micro-behaviors/data/archive/extension::zip-extension
      - id: micro-behaviors/data/archive/extension::tar-extension
      - id: micro-behaviors/data/format/mime::application-zip-mime
      - id: micro-behaviors/data/archive/extract/zip::unzip-tool-reference
  - id: archive-extraction-capability
    desc: Uses multiple archive extraction mechanisms
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/data/archive/extract/tar::python-tarfile-extractall
      - id: micro-behaviors/data/archive/zip::python-zipfile-handle
      - id: micro-behaviors/data/archive/extract/zip::python-unzip-temp-archive-command
