---
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: sfx-copyright-banner-text
  desc: SFX module copyright banner text
  crit: component
  conf: 0.99
  if:
    type: text
    substr: SFX module - Copyright (c) 2005-
    section: ".rdata"
- id: sfx-configuration-error-text
  desc: SFX configuration error text
  crit: component
  conf: 0.98
  if:
    type: text
    substr: Could not read SFX configuration
    section: ".rdata"
