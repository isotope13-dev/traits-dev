defaults:
  platforms: [windows]
  for: [pe, go]

composite_rules:
  - id: go-http-zip-subprocess-cooccurrence
    desc: Go artifact has ZIP URL and HTTP, ZIP reader, and subprocess references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/get::go-http-get-any
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
      - id: micro-behaviors/data/archive/zip::go-zip-reader-any
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-any
