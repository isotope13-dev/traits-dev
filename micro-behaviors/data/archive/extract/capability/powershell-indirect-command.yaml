defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-indirect-destination-command
    desc: Indirect command destination path
    if:
      type: text
      exclude_comments: true
      regex: '(?i)&\s*\(\w+\s+\d{1,3}\)\s+-Path\s+\$\w+\s+-DestinationPath\s+\$\w+'
