---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
traits:
- id: open-or-extract-zip-archive
  desc: Archive open or extract instruction
  crit: component
  conf: 0.75
  if:
    type: text
    regex: "([\\w']+\\s+){0,2}\\bopen\\s+[^.(\\n]{0,25}\\b(zip|archive)\\b"
    case_insensitive: true
  not:
  - regex: "(?i)(cannot|can'?t|could\\s*n[o']?t|unable\\s+to|failed\\s+to|error)\\s+open"
  - regex: "(?i)(cannot|can't)\\s+open.{0,32}archive"
  - regex: "(?i)error\\s+opening"
  - regex: no\s+password
- id: extract-rar-archive
  desc: RAR extract instruction
  crit: component
  conf: 0.75
  if:
    type: text
    regex: "\\bextract\\b.{0,25}\\brar\\b"
    case_insensitive: true
  not:
  - regex: no\s+password
  - regex: "(?i)wrong\\s+password"
  - regex: "(?i)-p\\{password\\}"
- id: open-7z-archive
  desc: 7z open instruction
  crit: component
  conf: 0.75
  if:
    type: text
    regex: "\\bopen\\b.{0,25}\\b7z\\b"
    case_insensitive: true
  not:
  - regex: no\s+password
