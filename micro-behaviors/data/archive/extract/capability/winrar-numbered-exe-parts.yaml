defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: winrar-sfx-numbered-exe-parts
    desc: WinRAR SFX with numbered executable part names
    crit: notable
    conf: 0.96
    all:
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
      - id: micro-behaviors/fs/path/executable::numbered-exe-part-names
