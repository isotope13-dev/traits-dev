defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
  - text
traits:
- id: curl-output-near-hh-decompile
  desc: curl output near HH decompile command
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bcurl(\.exe)?\b.{0,240}\s-o\s+\S{1,80}.{0,180}\bhh(\.exe)?\s+-decompile\b
