defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  # The awaited result is bound to require; the HTTP and tar calls are
  # co-occurring references and are not independently proven to feed it.
  - id: streamed-tar-and-awaited-module-references
    desc: Streamed GET, tar extract and awaited require
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/get::axios-stream-response-download
      - id: micro-behaviors/data/archive/extract/tar::node-tar-extract-call
      - id: micro-behaviors/os/module/dynamic-load::require-awaited-result
