defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.82

traits:
  - id: tar-extract-temp-destination
    desc: Tar extracts into temporary directory
    if:
      type: text
      regex: '\btar\b.{0,15}-C.{0,15}/(tmp|var/tmp|dev/shm|run)\b'
  - id: tar-extract-system-binary-destination
    desc: Tar extracts into system binary directory
    if:
      type: text
      regex: '\btar\b.{0,15}-C.{0,15}/(usr/(local/)?bin|bin|sbin)\b'
  - id: tar-extract-current-directory
    desc: Tar extracts into current directory
    conf: 0.75
    if:
      type: text
      regex: '\btar\b.{0,15}-C.{0,15}\./'
