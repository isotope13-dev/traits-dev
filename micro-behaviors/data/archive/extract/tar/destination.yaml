defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.82

# The destination must attach to `-C` itself. A loose `.{0,15}` gap after the
# flag let a *later* argument stand in for the destination, so
# `tar -xvz -C / -f ./perl.tar.gz` (extracting to the root directory) was
# reported as extracting into the current directory.
traits:
  - id: tar-extract-temp-destination
    desc: Tar extracts into temporary directory
    if:
      type: text
      regex: '\btar\b.{0,15}-C\s*["'']?/(tmp|var/tmp|dev/shm|run)\b'
  - id: tar-extract-system-binary-destination
    desc: Tar extracts into system binary directory
    if:
      type: text
      regex: '\btar\b.{0,15}-C\s*["'']?/(usr/(local/)?bin|bin|sbin)\b'
  - id: tar-extract-current-directory
    desc: Tar extracts into current directory
    conf: 0.75
    if:
      type: text
      regex: '\btar\b.{0,15}-C\s*["'']?\./'
  # The root directory itself as the destination: every member name in the
  # archive becomes a rootfs path. The destination must be exactly `/`,
  # terminated by a quote, whitespace or a shell separator, so `/tmp` and
  # other rooted destinations keep their own atoms above.
  - id: tar-extract-root-destination
    desc: Tar extracts into filesystem root
    conf: 0.95
    platforms: [unix]
    if:
      type: text
      regex: '\btar\b[^;\r\n]{0,48}(-C\s*|--directory[=\s])["'']?/(["'']|\s|;|&|\|)'
  # User-local runtime staging: extracting into a hidden directory under $HOME
  # is how rootless toolchains install (and where agent-skill bootstrap
  # guidance points its downloads). The archive argument may precede -C, so
  # the gap is wider than the siblings' but stays within one command.
  - id: tar-extract-home-dotdir-destination
    desc: Tar extracts into home dot-directory
    conf: 0.85
    for: [scripts, markdown]
    if:
      type: text
      regex: '\btar\b[^;\r\n]{0,60}-C\s*["'']?(\$\{?HOME\}?|~)/\.'
