defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-tar-temp-extraction
    desc: LNK tar arguments extract config into TEMP
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\btar\s+-xf\s+"%TEMP%\\[^"]+"\s+-C\s+"%TEMP%"\s+\S+\.(ini|cfg)\b'
  - id: lnk-tar-archive-extraction
    desc: LNK tar arguments extract an archive
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      # Dashed extract invocations (tar -xvf a.tar.gz) with an archive
      # operand; the narrow TEMP/USERPROFILE config atoms above keep their
      # precise homes for those subtypes.
      regex: '(?i)\btar(\.exe)?\s+-[a-z]*x[a-z]*\s+\S{1,80}\.(tar\.gz|tgz|tar|zip|7z|rar)\b'
