defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-tar-temp-extraction
    desc: LNK tar arguments extract config into TEMP
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\btar\s+-xf\s+"%TEMP%\\[^"]+"\s+-C\s+"%TEMP%"\s+\S+\.(ini|cfg)\b'
  - id: lnk-tar-archive-extraction
    desc: LNK tar arguments extract an archive
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      # The extraction option establishes the operation, regardless of the
      # archive's chosen suffix. A command boundary excludes echo/help text.
      regex: '(?i)(^|[&|]\s*|/c\s+)tar(\.exe)?\s+-[a-z]*x[a-z]*\s+\S+'
