defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-stream-to-tar-extractor
    desc: Pipes stream into tar.x or tar.extract
    crit: notable
    conf: 0.95
    # Flow facts omit anonymous callback bodies; use the parsed call shape.
    if:
      type: tree-sitter
      kind: call
      regex: '^[\w$.]+\.pipe\s*\(\s*tar\.(x|extract)\s*\('
