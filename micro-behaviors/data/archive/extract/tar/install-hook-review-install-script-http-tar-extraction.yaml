defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-http-tar-extraction
    desc: Install-named script streams HTTP data and extracts a tar archive
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    size_max: 20000
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-gzip-extract
      - id: micro-behaviors/fs/chmod/modify::node-chmod
    any:
      - id: micro-behaviors/os/env/read/named::postinstall-binary-url-env-override
      - id: micro-behaviors/fs/path/archive::versioned-targz-template
