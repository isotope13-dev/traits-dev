defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: configure-irssi-glib-unpack
    desc: GLib gzip and tar extraction commands
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'if `gunzip \$glib_file`; then[\s\S]{0,120}if `tar xf \$glib_file`; then'
