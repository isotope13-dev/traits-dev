defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]

composite_rules:
  - id: node-child-process-runtime-import
    desc: Loads Node child_process at runtime
    crit: component
    conf: 0.9
    any:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: metadata/import/builtin::require-child-process

  - id: node-shell-archive-exec
    desc: Executes command through Node child_process
    crit: notable
    conf: 0.95
    all:
      - id: node-child-process-runtime-import
    any:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/data/control-flow/async::node-promisified-exec

  - id: node-remote-native-archive-extraction
    desc: Fetches and extracts archive; enables executable
    crit: notable
    conf: 0.98
    scope: leaf
    all:
      - id: node-shell-archive-exec
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/data/archive/extract/tar::js-tar-gzip-extract-command
    any:
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
    near_bytes: 8000
