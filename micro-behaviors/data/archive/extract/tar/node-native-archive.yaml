defaults:
  platforms: [unix, windows]
composite_rules:
  - id: node-remote-native-archive-extraction
    desc: Fetches and extracts archive; enables executable
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/data/archive/extract/tar::js-tar-gzip-extract-command
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
    near_bytes: 8000
