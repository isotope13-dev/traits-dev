defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-tar-gzip-extract-command
    desc: JavaScript extracts a gzip archive with tar
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\btar\s+-?[a-zA-Z]*x[a-zA-Z]*z[a-zA-Z]*f[a-zA-Z]*\s+\S+'

  # The argv form, which the command-line regex above cannot see:
  # `spawnSync('tar', ['-xzf', archive, '-C', dir])`.
  - id: node-spawn-tar-extract
    desc: Node spawns tar to unpack an archive
    crit: notable
    conf: 0.94
    attack: T1560.001
    if:
      type: text
      regex: '\b(spawn|execFile)(Sync)?\s*\(\s*["'']tar["'']'
    unless:
      - id: well-known/tool/sysadmin/ripgrep::vscode-ripgrep-package-identity
