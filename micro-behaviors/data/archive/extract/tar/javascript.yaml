defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-tar-extract-command
    desc: JavaScript command extracts an archive with tar
    conf: 0.9
    attack: T1140
    if:
      type: text
      regex: '\btar\s+-?[a-zA-Z]*x[a-zA-Z]*f[a-zA-Z]*\s+\S+'

  - id: js-tar-gzip-extract-command
    desc: JavaScript extracts a gzip archive with tar
    conf: 0.9
    if:
      type: text
      regex: '\btar\s+-?[a-zA-Z]*x[a-zA-Z]*z[a-zA-Z]*f[a-zA-Z]*\s+\S+'

  # The argv form, which the command-line regex above cannot see:
  # `spawnSync('tar', ['-xzf', archive, '-C', dir])`.
  # Tar also accepts old-style option clusters without a leading dash (`xvf`).
  #
  # The trailing option group is required, not decoration. Matching the bare
  # `spawn('tar'` call said "unpacks an archive" about code that CREATES one —
  # `execFileSync('tar', ['-czf', out, '.'])` in an export/backup helper reads
  # back as extraction. The mode letter lives in the argv array, so the flag
  # has to be matched there.
  - id: node-spawn-tar-extract
    desc: Node spawns tar to unpack an archive
    conf: 0.94
    attack: T1560.001
    if:
      type: text
      regex: '\b(spawn|execFile|run)(Sync)?\s*\(\s*["'']tar["''][\s\S]{0,60}["'']-?[a-z]{0,3}x'

  # The Windows form, spawned by computed path:
  # `spawn(path.join(SystemRoot, 'System32', 'tar.exe'), ['-xf', file, '-C', dir])`.
  # The bare-'tar' literal rule above cannot see it — the program argument is
  # an expression, not a literal — so the executable name and the argv mode
  # letter are matched within one call's neighborhood instead.
  - id: node-spawn-tar-exe-extract
    desc: Node spawns tar.exe to unpack an archive
    conf: 0.9
    attack: T1140
    if:
      type: text
      regex: '\b(spawn|execFile|run)(Sync)?\s*\([\s\S]{0,160}tar\.exe["''][\s\S]{0,120}["'']-?[a-z]{0,3}x'

  # Flag literals for the argv-form extraction above. These lived under
  # objectives/supply-chain/install-hook/scripts/dynamic-install, but a tar
  # flag pair alone establishes no install hook: an explicit `virgil setup`
  # fetches and unpacks its local-model engine the same way. The capability
  # belongs here; the hostile npm-bootstrap composite references the combined
  # observation from its own tier.
  - id: node-tar-gzip-flag
    desc: Tar extraction uses gzip flag
    crit: component
    conf: 0.95
    if:
      type: string_literal
      exact: -xzf
  - id: node-tar-strip-components-flag
    desc: Tar extraction strips archive directory
    conf: 0.95
    if:
      type: string_literal
      exact: --strip-components=1

composite_rules:
  - id: node-tar-gzip-strip-array
    desc: Node extracts gzipped tarball with tar flags
    conf: 0.98
    attack: T1105
    all:
      - id: node-spawn-tar-extract
      - id: node-tar-gzip-flag
      - id: node-tar-strip-components-flag
