defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-tar-userprofile-extraction
    desc: LNK tar command extracts under USERPROFILE
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\btar\s+-xf\s+"?%USERPROFILE%\\[^&\r\n]{1,160}\s+-C\s+"?%USERPROFILE%\\'
