defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1560.001

traits:
  # The CVE-2007-4559 hardening idiom: members are yielded only when their
  # resolved path stays inside the destination. An installer that vets its own
  # archive extraction is not a dropper unpacking blindly.
  - id: python-tar-member-path-guard
    desc: Tar extraction guards member paths
    conf: 0.9
    if:
      type: text
      regex: 'def is_within_directory\(|def safe_(members|extract)\w{0,10}\('

  - id: tar-temp-archive-command
    desc: Python tar extracts temporary archive
    conf: 0.86
    if:
      type: literal
      regex: 'tar\s+x.{0,80}(temp|tmp).{0,15}\.(tar|zip|gz)'

composite_rules:
  - id: python-tarfile-extractall
    desc: Python extracts tar archive
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
      - id: micro-behaviors/data/archive/extract/capability::python-extractall-call
