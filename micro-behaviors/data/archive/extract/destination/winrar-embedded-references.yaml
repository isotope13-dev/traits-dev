defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: program-files-x86-destination-text
    desc: Program Files (x86) destination text
    crit: component
    conf: 0.94
    if:
      type: text
      exact: 'Path=C:\Program Files (x86)'

  - id: overwrite-one-option-text
    desc: Overwrite=1 option text
    crit: component
    conf: 0.94
    if:
      type: text
      exact: Overwrite=1
