defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: sfx-temp-install-path
    desc: SFX configuration extracts to Windows temp
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: 'InstallPath="%TEMP%"'

  - id: sfx-overwrite-enabled
    desc: SFX extraction overwrite directive
    crit: notable
    conf: 0.9
    for: [pe, static-lib, text]
    if:
      # Anchor the directive to its own CRLF-terminated line. SFX config
      # blocks are line-based (`...=\r\nOverwrite=1\r\n...`); a bare
      # "Overwrite=1" token inside unrelated text is not an SFX directive --
      # a protobuf field declaration such as `bool overwrite = 1;` matches
      # the unanchored spelling. Same anchoring as sfx-silent-install.
      type: raw
      regex: '(?i)\r\nOverwrite[ \t]*=[ \t]*"?1"?\r?(\n|$)'
