defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-temp-mode-directive
  desc: WinRAR SFX TempMode directive
  crit: notable
  conf: 0.98
  if:
    # Byte boundaries distinguish the config directive from the SFX stub's
    # own localized TempMode resource string.
    type: hex
    pattern: "0D 0A 54 65 6D 70 4D 6F 64 65 0D 0A"
    offset_range: [131072, null]
