defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: asar-extract
    desc: Calls Electron ASAR extraction API
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^asar\.extract(All|File)$'

  - id: asar-computed-property-access
    desc: ASAR object uses computed property access
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\basar\s*\['

composite_rules:
  - id: computed-asar-method-call
    desc: Computed ASAR API call
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: asar-computed-property-access
      - id: micro-behaviors/data/source/property/computed::js-computed-property-call
    near_bytes: 128
