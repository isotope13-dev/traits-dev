# Android application package decompilation through common command-line tools.
# The matchers require command-shaped syntax and an APK operand; a bare tool
# name is product identity, while this file records the extraction operation.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: android-decompiler-argv
    desc: Decompiles APK with Android CLI tool
    if:
      type: text
      regex: '["''](jadx|apktool)["'']\s*,[\s\S]{0,240}(\.apk["'']|apk_path\b)'

  - id: android-decompiler-shell-command
    desc: Shell command decompiles Android APK
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '(?im)^\s*(jadx|apktool)(\.bat)?\s+[^\r\n;&|]{0,220}\.apk\b'

composite_rules:
  - id: android-app-decompiler-cli
    desc: Decompiles an Android application package
    crit: notable
    conf: 0.96
    any:
      - id: android-decompiler-argv
      - id: android-decompiler-shell-command
