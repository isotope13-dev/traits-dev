defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-archive-extract-password-option
  desc: Node archive extraction password option
  conf: 0.5
  if:
    type: tree-sitter
    kind: call
    regex: '(?is)\b(extract(Full|AllTo)|unzip)\b[^)]{0,240}\bpassword\s*:'
composite_rules:
- id: node-passworded-archive-extraction-context
  desc: Node extraction password and archive clues
  conf: 0.65
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/archive/extract/password::node-archive-extract-password-option
  - id: micro-behaviors/data/archive/extract/capability::archive-extraction-context
