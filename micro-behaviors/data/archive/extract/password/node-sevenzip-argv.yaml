# A Node program that hands a standalone 7-Zip console binary an argument
# vector of the form [x, archive, -o<dir>, -p<password>, -y] extracts a
# passworded archive without prompting. Installers do this too, so the
# observation is suspicious on its own; objectives decide whether the
# surrounding program is a loader.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-7zip-password-extract-argv
    desc: Node builds passworded 7-Zip extract args
    crit: suspicious
    conf: 0.85
    attack: T1140
    mbc: C0025
    if:
      type: text
      regex: '["''][xe]["''],\s*[^,]{1,40},\s*["'']-o["'']\s*\+[^,]{1,40},\s*["'']-p["'']\s*\+'
