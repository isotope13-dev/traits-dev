# Password-protected archive extraction is a neutral capability.  The
# objective-tier correlations decide whether the surrounding workflow is
# malicious; this file only records the archive tool/library operation.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts]
  crit: notable
  conf: 0.94

traits:
  - id: msi-dual-sevenzip-passworded-overwrite-extraction
    desc: Two passworded 7-Zip MSI extractions
    platforms: [windows]
    for: [msi]
    count_min: 2
    conf: 0.98
    if:
      type: raw
      regex: '(?i)7z\.exe[\s\S]{0,220}-p[^"''\s]{4,64}\s+-aoa\s+-y\b'

  - id: sevenzip-password-extraction
    desc: 7-Zip passworded extraction options
    for: [scripts, pe]
    if:
      type: text
      # Require a 7z CLI invocation, not a `.7z` filename paired with wget's
      # unrelated `-P` output-directory flag on the same line.
      regex: '(?i)(^|[\s;&|(])7z[a-z]?(\.exe)?\s+\S.{0,160}\s-p\S*'

  - id: sevenzip-password-option-pair
    desc: 7-Zip password and assume-yes options
    for: [scripts, pe]
    if:
      type: text
      regex: '(?i)(^|[\s"''])-p[^"''\s]{4,64}\s+-y\b'

  - id: unrar-password-extraction
    desc: UnRAR extracts an archive with a password
    if:
      type: text
      regex: '(?i)\bunrar\b[^\r\n]{0,180}\s-p\S*'

  # Info-ZIP spells the decryption password `-P` (uppercase; lowercase `-p`
  # means "extract to pipe"), so this needs its own case-sensitive matcher
  # rather than joining the 7z/unrar pattern above.
  - id: unzip-password-extraction
    desc: unzip extracts a passworded archive
    if:
      type: text
      regex: '\bunzip\b[^\r\n]{0,180}\s-P[\s"''$]'

  - id: zip-password-archive-creation
    desc: zip creates a passworded archive
    if:
      type: text
      regex: '\bzip\b[^\r\n]{0,180}\s-P[\s"''$]'

  - id: long-password-option-extraction
    desc: Archive extraction uses a long password option
    if:
      type: text
      regex: '(?i)\b(7z|unrar)\b[^\r\n]{0,180}\s--password(=|\s+)\S*'

  - id: python-archive-password-argument
    desc: Python ZIP API receives a password argument
    for: [python]
    if:
      type: text
      regex: '(?i)\b(zipfile|ZipFile)(\.\w+)?[^\r\n]{0,180}\b(pwd|password)\s*='

  # NOTE: there is no local `extractall`/`extract` atom here.  Python call
  # targets carry the full member chain (`zf.extractall`), so an `exact:`
  # match on the bare method name never sees a real archive call and instead
  # matches a module-level function that merely happens to be named
  # `extract()` — the shape of any code-analysis or parsing library.  The
  # canonical member-chain matcher lives in
  # micro-behaviors/data/archive/extract/capability and is referenced below.
  - id: python-archive-handle-read-call
    desc: Python archive handle reads member
    crit: component
    for: [python]
    if:
      type: text
      regex: '(?i)\b(zf|zip(file|_file)?|archive)\.read\s*\(\s*["'']'

composite_rules:
  - id: cli-passworded-archive-extraction
    desc: CLI extracts an archive with a password
    any:
      - id: sevenzip-password-extraction
      - id: sevenzip-password-option-pair
      - id: unrar-password-extraction
      - id: unzip-password-extraction
      - id: long-password-option-extraction

  - id: python-passworded-archive-extraction
    desc: Python extracts a passworded archive
    for: [python]
    all:
      - id: micro-behaviors/data/archive/zip::python-zipfile-handle
      - id: python-archive-password-argument
    any:
      - id: micro-behaviors/data/archive/extract/capability::python-extractall-call
      - id: micro-behaviors/data/archive/extract/capability::python-extract-member-call
      - id: python-archive-handle-read-call
    near_lines: 20
