---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
composite_rules:
- id: archive-instruction-near-password
  desc: Archive instruction near password value
  crit: notable
  conf: 0.8
  for:
  - scripts
  - "!jcl"
  size_max: 500000
  all:
  - id: micro-behaviors/data/format/credentials::password-value-text
  any:
  - id: micro-behaviors/data/archive/extract/capability::open-or-extract-zip-archive
  - id: micro-behaviors/data/archive/extract/capability::extract-rar-archive
  - id: micro-behaviors/data/archive/extract/capability::open-7z-archive
  near_lines: 12
