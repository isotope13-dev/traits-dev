# Script / encoded-script member extensions named in an archive container.
#
# Hex byte scans rather than a parsed member list: member names sit
# uncompressed in the container headers of every format cleave treats as an
# archive (zip, rar, 7z, …), and text extraction skips RAR ADS stream names
# entirely. The matchers are therefore format-neutral — a zip, jar, wheel,
# or nupkg naming a `.bat` member matches exactly like a RAR does, which is
# why these live here rather than under a per-format directory. The
# RAR-specific intent belongs to the composites, which gate on RAR magic.
#
# Neutral on their own: shipping a Windows helper script inside an archive
# is ordinary (gradlew.bat, mvnw.cmd, npm .bin/*.cmd shims, PowerShell
# modules). Intent comes from the composite that pairs one of these with
# lure naming, ADS traversal, or a packed tiny container.
defaults:
  platforms: [windows]
  for: [rar]

traits:
  - id: wsh-script-member-extension
    desc: Archive names a .vbs script member
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/file/format::web-extension-root-manifest
    if:
      type: hex
      pattern: "2E 76 62 73" # .vbs

  - id: vbe-member-extension
    desc: Archive names a .vbe encoded script
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "2E 76 62 65" # .vbe

  - id: jse-member-extension
    desc: Archive names a .jse encoded script
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 6A 73 65" # .jse

  - id: hta-member-extension
    desc: Archive names an .hta script member
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "2e 68 74 61" # .hta

  - id: bat-member-extension
    desc: Archive names a .bat script member
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 62 61 74" # .bat

  - id: cmd-member-extension
    desc: Archive names a .cmd script member
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 63 6D 64" # .cmd

  - id: ps1-member-extension
    desc: Archive names a .ps1 script member
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 70 73 31" # .ps1
