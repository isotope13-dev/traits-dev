# Neutral archive-content observation: a text-like member name is common in
# benign packages. The matcher only examines the member path extension; it
# does not claim that the member was executed or that its contents are text.
defaults:
  platforms: [unix, windows]
  for: [zip, tar]
traits:
  - id: archive-member-text-like-name
    desc: Archive member filename looks text-like
    crit: component
    conf: 0.82
    if:
      type: value
      path: "archive.members[*].path"
      regex: '[A-Za-z0-9_.-]{1,64}\.(txt|log|lua|dat)$'

  # ZIP stores member paths with '/' separators (APPNOTE 4.4.17.1); every
  # mainstream builder emits them. Backslashes mean the archive was assembled
  # from Windows paths by hand-rolled tooling rather than by the ecosystem's
  # packager -- the shape of a repack -- and they also blind readers that key on
  # the canonical name: a JAR rebuilt this way no longer resolves
  # `META-INF/MANIFEST.MF`, so its Main-Class and signature facts disappear.
  - id: archive-member-backslash-separator
    desc: Archive member path uses backslash separators
    crit: notable
    conf: 0.9
    for: [zip, tar, jar]
    if:
      type: value
      path: "archive.members[*].path"
      substr: '\'

  # Two members with the same name: which one a reader gets depends on whether
  # it walks the central directory or the local headers, and on whether it keeps
  # the first or the last. Benign packagers do not emit these; repacking one
  # archive's contents on top of another's does.
  - id: archive-duplicate-member-names
    desc: Archive contains duplicate member names
    crit: notable
    conf: 0.9
    for: [zip, tar, jar]
    if:
      type: metrics
      field: archive.duplicate_member_count
      min: 1

  # One archive-wide fact, read from the parsed member table.
  #
  # It used to exist twice, once as `zip::zip-encrypted-entry` and once as
  # `7z::7z-encrypted-entry`, with identical matchers differing only in `for:`.
  # `for:` does not gate a metrics trait to a container, so both fired on the
  # same archive: one fact became two ML features, and a password-protected ZIP
  # was reported as "7z archive contains encrypted content". Whether the members
  # are worth hiding is for the composites that reference this to decide.
  #
  # The matcher reads `archive.members[*].encrypted` rather than the
  # `archive.security.encrypted_count` metric it used to read. The metric is
  # only computed by extractors that see a per-entry encryption header bit,
  # which 7z does not have -- it encrypts through the folder's coder chain --
  # so the count came back absent (not zero) for every password-protected 7z,
  # and all thirteen rules referencing this trait were silently unreachable for
  # the one format where password-protected payloads are the normal delivery
  # shape. The member flag is set by every extractor that sets the metric, and
  # additionally by 7z, so it strictly dominates; keeping both as legs of a
  # roll-up would only re-create the duplicate-feature problem above.
  - id: archive-encrypted-member
    desc: Archive contains an encrypted member
    crit: notable
    conf: 0.9
    # Narrower than the `archives` group the metrics matcher used to carry:
    # `type: value` caps at 6 file types and `archives` expands to 25. Nothing
    # is lost -- these four are the only containers that express per-member
    # encryption at all, and the packaging formats that used to be listed
    # through the group (npm, whl, gem, nupkg, ...) are ZIP or tar underneath,
    # so they are still reached by their own container type.
    for: [zip, tar, 7z, rar]
    if:
      type: value
      path: "archive.members[*].encrypted"
      exact: "true"
