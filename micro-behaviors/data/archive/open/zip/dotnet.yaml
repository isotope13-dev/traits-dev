defaults:
  crit: notable
  platforms: [windows]
traits:
  - id: zipfile-openread
    desc: .NET opens a ZIP archive for reading
    conf: 0.96
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)\[System\.IO\.Compression\.ZipFile\]::OpenRead\s*\('

  - id: managed-zipfile-openread-call
    desc: Calls managed ZIP archive reader
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: symbol
      kind: call
      exact: System.IO.Compression.ZipFile.OpenRead
