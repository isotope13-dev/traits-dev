# Archive output names are useful context, but a staging variable alone does
# not establish collection or exfiltration intent.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: archive-output-variable
    desc: Archive staging variable name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(archive_path|archive_file|archive_name|staging_archive)\b'
