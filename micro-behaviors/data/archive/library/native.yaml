defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.85

traits:
  - id: archive-read-api
    desc: Native binary uses libarchive read APIs
    if:
      type: symbol
      substr: archive_read_

  - id: archive-write-api
    desc: Native binary uses libarchive write APIs
    if:
      type: symbol
      substr: archive_write_

  - id: 7zip-sdk-archive-api
    desc: Native binary uses 7-Zip archive APIs
    if:
      type: symbol
      regex: NArchive::(NZip|N7z|NRar|NCab)

composite_rules:
  - id: archive-api-usage
    desc: Native binary uses a recognized archive API
    crit: notable
    conf: 0.9
    any:
      - id: archive-read-api
      - id: archive-write-api
      - id: 7zip-sdk-archive-api
