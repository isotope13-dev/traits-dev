defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: adm-zip-lib
    desc: adm-zip library reference
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      substr: adm-zip

  - id: admzip-passworded-entry-read
    desc: adm-zip reads an entry with a password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(entry|zipEntry|archiveEntry)\.getData\(password\)'

  - id: unzipper-lib
    desc: unzipper library reference
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      substr: unzipper

  - id: extract-zip-lib
    desc: extract-zip library reference
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      substr: extract-zip

  - id: node-7z-lib
    desc: node-7z library reference
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      substr: node-7z

  - id: 7zip-bin-lib
    desc: 7zip-bin library reference
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      substr: 7zip-bin

  - id: path7za-lib
    desc: path7za library reference
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      substr: path7za
