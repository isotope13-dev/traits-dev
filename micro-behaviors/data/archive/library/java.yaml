defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: jvm-jar-api-reference
    desc: JVM JAR archive API reference
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/util/jar(/|$)'

  # These two were filed under objectives/command-and-control/backdoor/loader/
  # archive/, which asserted backdoor staging intent that reading a JAR does not
  # carry: build tools, plugin hosts, installers and the JDK's own tooling walk
  # JAR entries exactly this way. They stay component-grade atoms here, and the
  # loader composites that consume them supply the intent by requiring the
  # in-memory defineClass and the HTTP fetch alongside.
  - id: jarinputstream-ref
    desc: JarInputStream API reference
    crit: component
    conf: 0.9
    if:
      type: import
      exact: java/util/jar/JarInputStream

  - id: jarinputstream-entry-iteration
    desc: JarInputStream entry iteration
    crit: component
    conf: 0.9
    if:
      type: import
      exact: java/util/jar/JarInputStream.getNextJarEntry
