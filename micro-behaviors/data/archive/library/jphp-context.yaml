defaults:
  platforms:
  - windows
  for:
  - pe
  - data
  - php
  - xml
traits:
- id: jphp-stream-getcontents
  desc: JPHP stream getContents call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: ->\s*getContents\s*\(
- id: jphp-stream-putcontents
  desc: JPHP stream putContents call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: ->\s*putContents\s*\(
- id: jphp-unpack-call
  desc: JPHP archive unpack call
  crit: notable
  conf: 0.88
  for:
  - data
  - php
  - xml
  if:
    type: text
    regex: \bunpack\s*\(
- id: jphp-extracted-exe-path
  desc: JPHP path to extracted Windows executable
  crit: component
  conf: 0.91
  if:
    type: text
    regex: /[A-Za-z0-9._-]{2,80}/[A-Za-z0-9._-]{2,80}\.exe
composite_rules:
- id: jphp-stream-zip-stager
  desc: JPHP stream read/write with archive URL
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-stream-api
  - id: micro-behaviors/data/archive/library::jphp-stream-getcontents
  - id: micro-behaviors/data/archive/library::jphp-stream-putcontents
  - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
- id: jphp-download-unpack-execute
  for:
  - php
  - data
  - xml
  desc: JPHP archive URL, unpack and executable path context
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-zipfile-class
  - id: micro-behaviors/data/archive/library::jphp-unpack-call
  - id: micro-behaviors/data/archive/library::jphp-extracted-exe-path
