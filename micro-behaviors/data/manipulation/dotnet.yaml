defaults:
  platforms: [windows]
  for: [csharp, pe, dll]

traits:
  - id: dotnet-array-reverse-call
    desc: Reverses a .NET array in place
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Array.Reverse

  - id: dotnet-name-value-collection
    desc: .NET NameValueCollection type reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: NameValueCollection

  - id: dotnet-item-setter-token
    desc: .NET set_Item method reference
    crit: component
    conf: 0.65
    if:
      type: text
      substr: set_Item
