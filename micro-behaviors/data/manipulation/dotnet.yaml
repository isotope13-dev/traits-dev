defaults:
  platforms: [windows]
  for: [csharp, pe, dll]

traits:
  - id: dotnet-reverse-member-token
    desc: Reverse member-name token
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      exact: Reverse
  - id: dotnet-array-reverse-call
    desc: Reverses a .NET array in place
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Array.Reverse
