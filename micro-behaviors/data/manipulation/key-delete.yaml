defaults:
  platforms: [unix, windows]
  for: [python, go, csharp, javascript, typescript]

traits:
  - id: js-delete-indexed-property
    desc: Deletes an indexed JavaScript object property
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (unary_expression
          operator: "delete"
          argument: (subscript_expression)) @deletion

  - id: recursive-named-key-removal-function
    desc: Removes mapping keys by name filter
    crit: baseline
    conf: 0.86
    if:
      # Generic recursive cleaners commonly use one of these names when the
      # key predicate is supplied separately by the caller.
      type: symbol
      kind: function
      regex: '(?i)^(remove|delete|clear)_?keys?_?(containing|matching|with_?(substring|suffix))$'
