# How a prompt-injection defense describes its own pipeline: the screening step
# it applies to untrusted input, and the disposition it gives input that fails.
# Both are neutral observations -- a threat write-up and an attacker's notes
# name the attack too -- so intent has to come from the rule that uses them.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, markdown, documents, text]

traits:
  - id: injection-screening-step
    desc: Input screened for prompt injection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(analy[sz]e|scan|screen|check)\b[^\n]{0,40}\bfor prompt.injection'

  - id: injection-screening-zh
    desc: Chinese prompt-injection filter guidance
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '提示词注入[\s\S]{0,400}(清洗|过滤|拦截)'

  - id: unsafe-input-quarantine-disposition
    desc: Flagged input quarantined, not delivered
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bquarantined?\b[^\n]{0,60}\b(never|not) (routed|delivered)\b'

  - id: unsafe-input-filter-zh
    desc: Chinese guidance to filter unsafe input
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '检测到就过滤|拦截恶意指令'

  - id: untrusted-content-data-boundary-en
    desc: Untrusted-data boundary in English
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\buntrusted (external )?(content|data|input)\b'
      case_insensitive: true

  - id: untrusted-content-data-boundary-zh
    desc: Untrusted-data boundary in Chinese
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '不可信的?外部输入|外部不可信来源'

  - id: embedded-content-directions-rejected-en
    desc: Rejects embedded directions in English
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(never (execute|follow)|ignore) (any )?(directions|instructions) (inside|found in)\b'
      case_insensitive: true

  - id: embedded-content-directions-rejected-embedded
    desc: LLM rejects directions embedded in content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bignore (any )?(directions|instructions) embedded in\b'
      case_insensitive: true

  - id: embedded-content-directions-rejected-zh
    desc: Rejects embedded directions in Chinese
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '绝不执行[^\n]{0,60}指令|一律忽略，不得当作操作指令执行'

  - id: prompt-injection-no-authority-check
    desc: Checks prompt injection has no authority
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bprompt[_ -]injection[_ -]no[_ -]authority\b'

  - id: untrusted-source-authority-disabled
    desc: Disables untrusted instruction authority
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bsource[_ -]instruction[_ -]authority.{0,20}(is|==|:)\s*[Ff]alse\b'

composite_rules:
  - id: untrusted-content-data-boundary
    desc: Content explicitly marked as untrusted data
    crit: notable
    conf: 0.97
    any:
      - id: untrusted-content-data-boundary-en
      - id: untrusted-content-data-boundary-zh

  - id: embedded-content-directions-rejected
    desc: LLM rejects embedded content directions
    crit: notable
    conf: 0.95
    any:
      - id: embedded-content-directions-rejected-en
      - id: embedded-content-directions-rejected-embedded
      - id: embedded-content-directions-rejected-zh

  - id: injection-screening-any
    desc: Prompt-injection screening in EN or ZH
    crit: notable
    conf: 0.9
    any:
      - id: injection-screening-step
      - id: injection-screening-zh

  - id: unsafe-input-block-disposition
    desc: Flagged input blocked in EN or ZH
    crit: notable
    conf: 0.9
    any:
      - id: unsafe-input-quarantine-disposition
      - id: unsafe-input-filter-zh
