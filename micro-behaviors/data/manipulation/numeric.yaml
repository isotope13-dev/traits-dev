# Array / numerical-computation stack. Importing NumPy or SciPy plus dense
# array operations identifies scientific data manipulation without inferring
# attacker intent.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: numpy-import
    desc: Imports the NumPy array library
    if:
      type: import
      exact: numpy

  - id: scipy-import
    desc: Imports a SciPy scientific module
    if:
      type: import
      regex: '^scipy($|\.)'

  # An import alone can be a leftover dependency; dense array constructors
  # and elementwise reducers are the computation actually running.
  - id: numpy-array-operations--ndarray
    desc: NumPy array operation (ndarray)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.ndarray\b'
  - id: numpy-array-operations--zeros
    desc: NumPy array operation (zeros)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.zeros\b'
  - id: numpy-array-operations--ones
    desc: NumPy array operation (ones)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.ones\b'
  - id: numpy-array-operations--array
    desc: NumPy array operation (array)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.array\b'
  - id: numpy-array-operations--arange
    desc: NumPy array operation (arange)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.arange\b'
  - id: numpy-array-operations--sum
    desc: NumPy array operation (sum)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.sum\b'
  - id: numpy-array-operations--mean
    desc: NumPy array operation (mean)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.mean\b'
  - id: numpy-array-operations--clip
    desc: NumPy array operation (clip)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.clip\b'
  - id: numpy-array-operations--maximum
    desc: NumPy array operation (maximum)
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\bnp\.maximum\b'

composite_rules:
  - id: numpy-array-operations
    desc: Dense NumPy array construction and reduction
    crit: notable
    conf: 0.85
    any:
      - id: numpy-array-operations--ndarray
      - id: numpy-array-operations--zeros
      - id: numpy-array-operations--ones
      - id: numpy-array-operations--array
      - id: numpy-array-operations--arange
      - id: numpy-array-operations--sum
      - id: numpy-array-operations--mean
      - id: numpy-array-operations--clip
      - id: numpy-array-operations--maximum
  - id: numeric-computation-library
    desc: Module built on the numeric Python stack
    crit: notable
    conf: 0.95
    any:
      - id: numpy-import
      - id: scipy-import
    all:
      - id: numpy-array-operations
