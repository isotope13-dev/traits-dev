defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: dompurify-html-sanitize
    desc: DOMPurify HTML sanitization
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bDOMPurify\.sanitize\s*\('
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: alpha-sanitization-replace
    desc: Generic non-alpha character removal
    conf: 1.0
    if:
      type: text
      substr: 'replace(/[^a-zA-Z]/'
  - id: filename-sanitization-replace
    desc: Filename unsafe character replacement
    conf: 0.95
    if:
      type: text
      regex: 'replace\(/\\\[\\\\/:\\*\?"<>\|\]\+/g,\s*[''"]-[''"]\)'
  - id: filename-sanitization-function
    desc: Filename sanitization helper
    conf: 0.95
    if:
      type: text
      regex: 'function\s+sanitizeFilename[\s\S]{0,500}\.replace\s*\('
  - id: sensitive-token-redaction
    desc: Redacts a token or secret value
    conf: 0.8
    for: [python, javascript, typescript, ruby, go, shell, powershell]
    if:
      type: text
      regex: '(?i)\b(redact|scrub)\w*\b[\s\S]{0,80}\b(token|secret|password)\b'
    unless:
      - id: well-known/lib/web/syntaxhighlighter::prismjs-package-reference
      - id: metadata/file/format/structured::sourcemap-sources-content
  # A redaction option or call (`redact:`, `core.setSecret(`) takes a value to
  # scrub from logs. Alone this only says logging is redacted; the composite
  # below binds it to a secret env value nearby.
  - id: log-redaction-option
    desc: Log redaction option or call
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(redact\w*|mask\w*|scrub\w*|censor\w*|setSecret)\b\s*[:=\(]'
      case_insensitive: true
  # Matches a function *named* redactSensitiveText — a redaction capability,
  # not a security product. It lived under well-known/tool/detection/, which
  # labelled every caller (including a VS Code extension that scrubs keys out
  # of the telemetry it uploads) as a known detection tool.
  - id: js-redact-sensitive-text-function
    desc: JavaScript sensitive-text redactor function
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: function
      exact: redactSensitiveText
  - id: python-sanitize-function-name
    desc: Python sensitive-data sanitization function
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: function
      exact: sanitize
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: replacement-redaction-marker
    desc: Replaces data with a redaction marker
    conf: 0.8
    for: [python, javascript, typescript, ruby, go, shell, powershell]
    if:
      type: text
      # Bind the marker to the replacement argument. Merely naming a result
      # `scrubbedValue` near an unrelated replace() is normalization, not
      # redaction.
      regex: '(?i)\breplace\s*\([^,\n]{1,120},\s*["''][^"''\n]{0,24}(redact|scrub)'
    unless:
      - id: well-known/lib/web/syntaxhighlighter::prismjs-package-reference
  - id: sensitive-value-masking
    desc: Masks sensitive value with asterisks
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '["'']\*["'']\s*\*\s*\((len|length)\b'
composite_rules:
  - id: sensitive-value-redaction
    desc: Sensitive-value redaction logic
    conf: 0.8
    for: [python, javascript, typescript, ruby, go, shell, powershell]
    any:
      - id: sensitive-token-redaction
      - id: replacement-redaction-marker
      - id: sensitive-value-masking
  # A secret env value handed to a redaction option (`redact:
  # process.env.GITHUB_TOKEN`) is scrubbed from logs rather than exfiltrated.
  - id: secret-env-value-redaction
    desc: Secret env value sent to redaction
    conf: 0.85
    for: [javascript]
    near_lines: 5
    all:
    - id: log-redaction-option
    - id: micro-behaviors/os/env/secret-name::javascript-credential-env-read
