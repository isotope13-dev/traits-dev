# A function that explicitly rewrites an application's expiration date is a
# neutral data-manipulation capability. EMV intent is established only when an
# objective composite also finds the payment protocol and relay context.
defaults:
  platforms: [android, linux, windows]
  for: [python, java, kotlin]

traits:
  - id: application-expiry-rewrite-routine
    desc: Rewrites an application expiration date
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: function
      regex: '(?i)^(rewrite|modify|replace|patch)_?(application_?)?(expiration|expiry)(_?date)?$'
