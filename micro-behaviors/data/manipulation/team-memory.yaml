defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: team-memory-secret-write-block
    desc: Blocks secrets from shared team memory
    crit: notable
    conf: 0.98
    if:
      type: literal
      substr: Team memory is shared with all repository collaborators. Remove the sensitive content
composite_rules:
  - id: secret-sanitization-output-marker
    for: [python, javascript, typescript]
    desc: Secret redaction or write-block message
    crit: notable
    conf: 0.95
    any:
      - id: redaction-replacement-placeholder
      - id: team-memory-secret-write-block
