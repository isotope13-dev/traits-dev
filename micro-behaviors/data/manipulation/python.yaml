defaults:
  platforms: [unix, windows]
  for: [python, shell]

traits:
  # `x = y.replace(...)` is the same token sequence in every C-family and
  # scripting language, so the atom is named for the assignment it finds; the
  # Python framing belongs to the composite below, which pairs it with the
  # `open(...).write(` sink. Alone it is incomplete evidence — ordinary
  # normalization like `language.replace('-', '_')` must not weigh as notable.
  - id: string-replace-result-assignment
    desc: Assigns a string replace result
    crit: component
    conf: 0.9
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
    if:
      type: text
      regex: '(^|[^$A-Za-z0-9_])[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\.replace\s*\('
  - id: python-open-write-call
    desc: Python writes through open handle
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bopen\s*\([^)]{0,120}\)\.write\s*\('
    unless:
      - id: metadata/build/toolchain::xcode-platform-args-build-context
  - id: python-substitution-call
    desc: Python sub/subn substitution call
    # Regex replacement is routine text normalization and does not establish
    # program purpose by itself.
    crit: baseline
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: '\b(re|regex)\.sub(n)?\s*\(|\b[A-Za-z_]\w*\.sub(n)?\s*\('

  - id: message-collection-remove-call
    desc: Python removes message from collection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b([A-Za-z_]\w*[_-])?(messages?|emails?)\s*\.\s*(remove|delete)\s*\('

  - id: python-single-to-double-quote-replacement
    desc: Replaces single quotes with double quotes
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: \.replace\(['"]'['"],\s*['"]"['"]\)

composite_rules:
  # Neutral file-editing mechanic. Supply-chain intent comes from the
  # consuming composite (for example, pairing this with npm publish).
  - id: python-replace-before-file-write
    desc: Python replaces text before file write
    crit: notable
    conf: 0.9
    all:
      - id: string-replace-result-assignment
      - id: python-open-write-call
    near_lines: 12
