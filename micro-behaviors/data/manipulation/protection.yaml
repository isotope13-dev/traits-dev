# VBA protection methods are neutral document automation.  Keep them under
# data manipulation: they change workbook state, not the process that hosts
# Office.  The raw view can expose either normal member-call syntax or the
# control-byte framing used by compressed VBA modules; requiring one of those
# forms avoids matching ordinary prose such as "Password Protected".
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-protect-method-reference
    desc: VBA Protect method reference
    crit: notable
    if:
      type: raw
      regex: '(?i)(\.\s*Protect\b|Protect\x00[\x20(])'

  - id: vba-unprotect-method-reference
    desc: VBA Unprotect method reference
    crit: notable
    if:
      type: raw
      regex: '(?i)(\.\s*Unprotect\b|\x00Unprotect[\x00-\x1f])'

composite_rules:
  - id: vba-protect-unprotect-pair
    desc: VBA uses Protect and Unprotect methods
    crit: notable
    conf: 0.96
    all:
      - id: vba-protect-method-reference
      - id: vba-unprotect-method-reference
