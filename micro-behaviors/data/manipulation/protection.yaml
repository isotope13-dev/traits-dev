# VBA worksheet protection methods are neutral document automation.  Keep
# them under data manipulation: they change the workbook's sheet state, not
# the process that hosts Excel.  The compressed OLE text view exposes the
# method tokens but not reliable VBA punctuation, so the atomics deliberately
# describe tokens and the composite describes the paired worksheet behavior.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-worksheet-protect-token
    desc: VBA worksheet Protect method token
    crit: component
    if:
      type: raw
      regex: '(?i)\bProtect\b'

  - id: vba-worksheet-unprotect-token
    desc: VBA worksheet Unprotect method token
    crit: component
    if:
      type: raw
      regex: '(?i)\bUnprotect\b'

composite_rules:
  - id: vba-worksheet-protect-unprotect-pair
    desc: VBA uses worksheet Protect and Unprotect methods
    crit: notable
    conf: 0.96
    all:
      - id: vba-worksheet-protect-token
      - id: vba-worksheet-unprotect-token
