defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: trading-post-order-type-test
    desc: Tests trading order-submission method type
    if:
      type: tree-sitter
      query: |
        ((unary_expression
          operator: "typeof"
          argument: (member_expression
            property: (property_identifier) @method))
          (#eq? @method "postOrder"))
        ((unary_expression
          operator: "typeof"
          argument: (subscript_expression
            index: (string (string_fragment) @method)))
          (#eq? @method "postOrder"))
