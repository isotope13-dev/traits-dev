defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: web3-send-raw-transaction
  desc: Web3 send_raw_transaction call
  conf: 0.92
  if:
    type: symbol
    regex: '(^|\.)send_raw_transaction$'
- id: cosmos-broadcast-tx
  desc: Cosmos broadcast_tx call
  conf: 0.9
  if:
    type: text
    regex: \bbroadcast_tx(_sync|_commit|_async)?\b|broadcast_tx
- id: substrate-extrinsic-submit
  desc: Substrate extrinsic submission call
  conf: 0.92
  if:
    type: text
    regex: '\b(submit|send)_extrinsic\b|submit_and_watch_extrinsic|author_submit'
composite_rules:
- id: cosmos-staking-reward-claim-flow
  desc: Cosmos staking reward claim flow
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/transaction/construct::cosmos-withdraw-reward-message-type
  - id: micro-behaviors/data/transaction/submit::cosmos-broadcast-tx
  any:
  - id: well-known/lib/crypto/web3::defi-reward-claim-text
  - id: micro-behaviors/crypto/library/blockchain/client::staking-sign-flow
