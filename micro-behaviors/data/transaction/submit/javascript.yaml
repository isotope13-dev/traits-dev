defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: web3-send-signed-tx
  desc: Web3 signed transaction broadcast
  if:
    type: text
    regex: '\b(this\.)?web3(_\d+)?\.eth\.sendSignedTransaction\s*\('
- id: send-transaction-call
  desc: Blockchain transaction send call
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '\.sendTransaction\s*\('
- id: send-raw-transaction-call
  desc: Sends a signed raw transaction
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: sendRawTransaction
- id: polymarket-create-and-post-order
  desc: Creates and submits a Polymarket order
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\.createAndPostOrder\s*\('
composite_rules:
- id: web3-balance-sign-broadcast
  desc: Web3 balance sign broadcast flow
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/blockchain/client::web3-balance-read
  - id: micro-behaviors/data/transaction/sign::web3-account-sign-call
  - id: micro-behaviors/data/transaction/submit::web3-send-signed-tx
