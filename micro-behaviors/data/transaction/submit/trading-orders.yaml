defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.95

traits:
  - id: trading-post-order-method-test
    desc: Tests object for order submission method
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: binary_op
      regex: 'typeof\s+[\w$.]+\.postOrder\s*={2,3}\s*["'']function'

  - id: trading-post-order-call
    desc: Calls trading order submission method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(postOrder|post_order)$'
