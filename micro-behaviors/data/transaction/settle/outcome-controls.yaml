# These fields and balance updates also occur in inert simulations. They do
# not establish a deployed trading service, deception or a transfer of funds.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]
  conf: 0.94

composite_rules:
  - id: balance-outcome-control-clues
    desc: Balance updates beside win-rate and forced-loss fields
    crit: notable
    all:
      - id: win-probability-member
      - id: forced-loss-member
      - id: balance-adjustment

  - id: forced-loss-with-staged-payout-denials
    desc: Outcome controls accompany staged payout denials
    crit: suspicious
    conf: 0.98
    all:
      - id: balance-outcome-control-clues
      - id: micro-behaviors/data/transaction/withdraw::staged-payout-denial-clues
