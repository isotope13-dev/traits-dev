# Call facts do not retain the flag/credit/debit relationship. Bind the
# result, account, balance field and stake, rather than matching chosen names.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: javascript-flag-gated-balance-outcome
    size_max: 262144
    desc: Account flag gates balance credit versus debit
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((function_declaration body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @result
            value: (binary_expression
              left: (unary_expression operator: "!"
                argument: [(member_expression object: (identifier) @account)
                           (subscript_expression object: (identifier) @account)])
              operator: "&&" right: (binary_expression operator: "<")))) .
          (if_statement condition: (parenthesized_expression (identifier) @test)
            consequence: [
              (expression_statement (augmented_assignment_expression
                left: [(member_expression object: (identifier) @credit
                  property: (property_identifier) @balance)
                  (subscript_expression object: (identifier) @credit
                    index: (string (string_fragment) @balance))]
                operator: "+=" right: (identifier) @stake))
              (statement_block . (expression_statement (augmented_assignment_expression
                left: [(member_expression object: (identifier) @credit
                  property: (property_identifier) @balance)
                  (subscript_expression object: (identifier) @credit
                    index: (string (string_fragment) @balance))]
                operator: "+=" right: (identifier) @stake)) .)]
            alternative: (else_clause [
              (expression_statement (augmented_assignment_expression
                left: [(member_expression object: (identifier) @debit
                  property: (property_identifier) @samebalance)
                  (subscript_expression object: (identifier) @debit
                    index: (string (string_fragment) @samebalance))]
                operator: "-=" right: (identifier) @samestake))
              (statement_block . (expression_statement (augmented_assignment_expression
                left: [(member_expression object: (identifier) @debit
                  property: (property_identifier) @samebalance)
                  (subscript_expression object: (identifier) @debit
                    index: (string (string_fragment) @samebalance))]
                operator: "-=" right: (identifier) @samestake)) .)])))) @evidence
          (#set! cleave.ignore-comments "true")
          (#eq? @result @test) (#eq? @account @credit) (#eq? @account @debit)
          (#match? @balance "^(balance|credits|funds)$")
          (#eq? @balance @samebalance) (#eq? @stake @samestake))
