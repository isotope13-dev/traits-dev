defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-flag-gated-balance-outcome
  desc: Account flag gates balance credit versus debit
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |-
      ((function_definition body: (block
        (expression_statement (assignment left: (identifier) @result
          right: (boolean_operator
            left: (not_operator argument: (subscript value: (identifier) @account))
            operator: "and" right: (comparison_operator)))) .
        (if_statement condition: (identifier) @test
          consequence: (block (expression_statement (augmented_assignment
            left: (subscript value: (identifier) @credit subscript: (string (string_content) @bal))
            operator: "+=" right: (identifier) @stake)))
          alternative: (else_clause body: (block (expression_statement (augmented_assignment
            left: (subscript value: (identifier) @debit subscript: (string (string_content) @samebal))
            operator: "-=" right: (identifier) @samestake))))))) @evidence
        (#eq? @result @test) (#eq? @account @credit) (#eq? @account @debit)
        (#eq? @bal "balance") (#eq? @bal @samebal) (#eq? @stake @samestake))
