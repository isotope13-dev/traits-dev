# Account-specific outcome controls are neutral observations. Their conjunction
# with monetary settlement and repeated withdrawal refusals supplies intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]
  crit: notable
  conf: 0.95

traits:
  - id: win-probability-member
    desc: Account win-probability member reference
    if:
      type: symbol
      kind: member
      regex: '(?i)\.(win_?chance|target_?win_?rate)$'

  - id: forced-loss-member
    desc: Forced-loss account control reference
    if:
      type: symbol
      kind: member
      regex: '(?i)\.force_?loss$'

  - id: balance-adjustment-js
    size_max: 262144
    desc: Account balance increment or decrement
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (augmented_assignment_expression
          left: (member_expression property: (property_identifier) @field)
          operator: ["+=" "-="]
          (#eq? @field "balance")) @evidence
        (augmented_assignment_expression
          left: (subscript_expression index: (string (string_fragment) @field))
          operator: ["+=" "-="]
          (#eq? @field "balance")) @evidence

  - id: balance-adjustment-python
    desc: Account balance increment or decrement
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((augmented_assignment
          left: [(attribute attribute: (identifier) @field)
                 (subscript subscript: (string (string_content) @field))]
          operator: ["+=" "-="]) @evidence
          (#eq? @field "balance"))

  - id: balance-adjustment-go
    desc: Account balance increment or decrement
    for: [go]
    if:
      type: tree-sitter
      query: |
        ((assignment_statement
          left: (expression_list (selector_expression field: (field_identifier) @field))
          operator: ["+=" "-="]) @evidence
          (#match? @field "(?i)^balance$"))

composite_rules:
  - id: balance-adjustment
    desc: Account balance increment or decrement
    any:
      - id: balance-adjustment-js
      - id: balance-adjustment-python
      - id: balance-adjustment-go
