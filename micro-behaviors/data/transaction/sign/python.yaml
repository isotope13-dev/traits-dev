defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: web3-sign-transaction
  desc: "Ledger transaction-signing API reference"
  conf: 0.92
  if:
    type: symbol
    exact: sign_transaction
- id: eth-typed-data-signing
  desc: References wallet typed-data signing
  conf: 0.88
  if:
    type: symbol
    regex: '(^|\.)sign_typed_data$'
