defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: solana-kit-transaction-signing
    desc: Signs a Solana Kit transaction message
    if:
      type: symbol
      kind: call
      regex: '^(partiallySign|sign)TransactionMessageWithSigners$'

  - id: transaction-signing-method-call
    desc: Calls a transaction-signing method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)signTransaction$'
