defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: erc20-approve-signature
  desc: Declares the ERC-20 approve method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)approve\(address,\s?uint256\)|"name"\s*:\s*"approve"'
- id: erc20-increase-allowance-call
  desc: "Token allowance-increase method reference"
  crit: notable
  conf: 0.9
  if:
    type: text
    word: increaseAllowance

# The EIP-2612 gasless approval: a signature, not a transaction, so it never
# reaches the wallet's transaction-confirmation UI. Matched on the typed-data
# struct name next to its own fields rather than on `Permit` alone, which is an
# ordinary English word.
- id: erc20-permit-signature
  desc: "ERC-2612 permit spender or deadline fields"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bPermit\b[^\w]{0,8}\b(spender|deadline)\b'
- id: eip3009-transfer-authorization
  desc: "Transfer authorization type or validity fields"
  if:
    type: text
    regex: '\bTransferWithAuthorization\b|validAfter.{0,120}validBefore.{0,120}nonce'

# The NFT counterpart of `approve`: one call grants a spender control over
# every token of the collection the contract holds, which is why drainers
# reach for it. It is also the standard ERC-721/ERC-1155 handshake every
# marketplace, game and wrapper contract performs, so the call itself stays a
# neutral capability -- the drainer inference comes from pairing it with a
# spender the user never chose. Matched on the method name in call or ABI
# position; a comment mention alone does not match.
- id: erc721-set-approval-for-all-call
  desc: "ERC-721/1155 setApprovalForAll call or ABI entry"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\.\s*setApprovalForAll\s*\(|"name"\s*:\s*"setApprovalForAll"'
# The same blanket-approval method reached by its 4-byte selector, as
# minified or obfuscated bundles do when they build calldata by hand.
- id: erc721-set-approval-for-all-selector
  desc: "ERC-721/1155 setApprovalForAll selector"
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: a22cb465
