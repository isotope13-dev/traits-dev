defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: nested-transaction-recipient-field
    desc: Reads a nested transaction recipient field
    conf: 0.95
    # `?.["to"]` optional chaining reads the same field as `["tx"]["to"]`.
    if:
      type: text
      regex: '\[["''](tx|transaction)["'']\]\s*(\?\.)?\s*\[["'']to["'']\]'
