defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, go, c, cpp, rust, swift]
  crit: notable

traits:
  - id: transaction-total-symbol
    desc: Names total transaction output value
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(tx|transaction)\b[\s\S]{0,99}\btotal(Out|Sat|Output)\b'

  # `out` alone is any variable: `out.Value = args[2]` in a Go cache test
  # (creachadair/mds cache/internal/cachetest) is a struct field write, not a
  # transaction output. Require a spelling that only a transaction uses --
  # txout, vout, or the full word output.
