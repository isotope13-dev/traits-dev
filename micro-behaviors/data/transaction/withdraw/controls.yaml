defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]
  crit: notable
  conf: 0.95

traits:
  - id: refusal-stage-increment-js
    desc: Advances an account withdrawal stage
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ([
         (augmented_assignment_expression
          left: [(member_expression property: (property_identifier) @field)
                 (subscript_expression index: (string (string_fragment) @field))]
          operator: "+=")
         (update_expression
          argument: [(member_expression property: (property_identifier) @field)
                     (subscript_expression index: (string (string_fragment) @field))]
          operator: "++")
         ] @evidence
          (#match? @field "(?i)^withdraw(al)?_?(step|stage)$"))

  - id: refusal-stage-increment-python
    desc: Advances an account withdrawal stage
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((augmented_assignment
          left: [(attribute attribute: (identifier) @field)
                 (subscript subscript: (string (string_content) @field))]
          operator: "+=") @evidence
          (#match? @field "(?i)^withdraw(al)?_?(step|stage)$"))

  - id: refusal-stage-increment-go
    desc: Advances an account withdrawal stage
    for: [go]
    if:
      type: tree-sitter
      query: |
        ([
         (assignment_statement
          left: (expression_list (selector_expression field: (field_identifier) @field))
          operator: "+=")
         (inc_statement (selector_expression field: (field_identifier) @field))
         ] @evidence
          (#match? @field "(?i)^withdraw(al)?_?(step|stage)$"))

  - id: refusal-table-index-js
    desc: Indexes withdrawal error or pretext table
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((subscript_expression object: (identifier) @table) @evidence
          (#match? @table "(?i)^withdraw(al)?_?(errors|pretexts|funnel)$"))

  - id: refusal-table-index-go
    desc: Indexes withdrawal error or pretext table
    for: [go]
    if:
      type: tree-sitter
      query: |
        ((index_expression operand: (identifier) @table) @evidence
          (#match? @table "(?i)^withdraw(al)?_?(errors|pretexts|funnel)$"))

  - id: refusal-table-index-python
    desc: Indexes withdrawal error or pretext table
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((subscript value: (identifier) @table) @evidence
          (#match? @table "(?i)^withdraw(al)?_?(errors|pretexts|funnel)$"))

  - id: payout-denied-return-js
    desc: Returns a denied payout record
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((return_statement (object (pair
          key: [(property_identifier) (string)] @key
          value: (false)))) @evidence
          (#match? @key "^[\"']?payout[\"']?$"))

  - id: payout-denied-return-python
    desc: Returns a denied payout record
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((return_statement (dictionary (pair
          key: (string) @key value: (false)))) @evidence
          (#match? @key "^[\"']payout[\"']$"))

  - id: payout-denied-return-go
    desc: Returns a denied payout record
    for: [go]
    if:
      type: tree-sitter
      query: |
        ((return_statement (expression_list (composite_literal
          body: (literal_value (keyed_element
            key: (literal_element (identifier) @key)
            value: (literal_element (false))))))) @evidence
          (#match? @key "(?i)^payout$"))

composite_rules:
  - id: refusal-stage-increment
    desc: Advances an account withdrawal stage
    any:
      - id: refusal-stage-increment-js
      - id: refusal-stage-increment-python
      - id: refusal-stage-increment-go

  - id: refusal-table-index
    desc: Indexes withdrawal error or pretext table
    any:
      - id: refusal-table-index-js
      - id: refusal-table-index-python
      - id: refusal-table-index-go

  - id: payout-denied-return
    desc: Returns a denied payout record
    any:
      - id: payout-denied-return-js
      - id: payout-denied-return-python
      - id: payout-denied-return-go
