# Match the fee table that the denial routine actually indexes. A separate
# pricing table elsewhere cannot supply fee-based refusal evidence. Call facts
# do not project this subscript/return relationship, so use a structural query.
defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-bound-cyclic-fee-denial
    desc: Cyclic payout denials return indexed fee records
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @fees
            right: (list
              (dictionary
                (pair key: (string (string_content) @code1) value: (string))
                (pair key: (string (string_content) @fee1) value: (integer) @amount1))
              (dictionary
                (pair key: (string (string_content) @code2) value: (string))
                (pair key: (string (string_content) @fee2) value: (integer) @amount2)))))
          (function_definition body: (block .
          (expression_statement (assignment left: (identifier) @reason
            right: (subscript value: (identifier) @table subscript: (binary_operator
              left: (subscript value: (identifier) @account subscript: (string (string_content) @stage))
              operator: "%" right: (call function: (identifier) @length
                arguments: (argument_list (identifier) @same_table)))))) .
          (expression_statement (augmented_assignment
            left: (subscript value: (identifier) @same_account subscript: (string (string_content) @same_stage))
            operator: "+=" right: (integer) @increment)) .
          (return_statement (dictionary
            (pair key: (string (string_content) @payout) value: (false))
            (pair value: (identifier) @returned))) .))) @evidence
          (#set! cleave.ignore-comments "true")
          (#eq? @fees @table)
          (#match? @code1 "^(code|reason)$") (#match? @code2 "^(code|reason)$")
          (#eq? @fee1 "fee") (#eq? @fee2 "fee")
          (#match? @amount1 "^[1-9][0-9]*$") (#match? @amount2 "^[1-9][0-9]*$")
          (#eq? @table @same_table) (#eq? @length "len")
          (#eq? @account @same_account) (#eq? @stage @same_stage)
          (#match? @increment "^[1-9][0-9]*$")
          (#eq? @payout "payout") (#eq? @reason @returned))
