# A fee table elsewhere must not supply the fee records returned by the
# refusal function. These relationships are absent from the call projections.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: javascript-bound-cyclic-fee-denial
    desc: Always denies payout with cyclic fee records
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @fees
            value: (array
              (object (pair key: (property_identifier) @fee1 value: (number) @amount1))
              (object (pair key: (property_identifier) @fee2 value: (number) @amount2)))))
          (function_declaration body: (statement_block .
            (lexical_declaration (variable_declarator name: (identifier) @reason
              value: (subscript_expression object: (identifier) @table
                index: (binary_expression
                  left: [(member_expression object: (identifier) @account property: (property_identifier) @stage)
                    (subscript_expression object: (identifier) @account
                      index: (string (string_fragment) @stage))]
                  operator: "%" right: (member_expression object: (identifier) @sametable
                    property: (property_identifier) @length))))) .
            (expression_statement [
              (augmented_assignment_expression
                left: [(member_expression object: (identifier) @sameaccount property: (property_identifier) @samestage)
                    (subscript_expression object: (identifier) @sameaccount
                      index: (string (string_fragment) @samestage))]
                operator: "+=" right: (number) @increment)
              (update_expression
                argument: [(member_expression object: (identifier) @sameaccount property: (property_identifier) @samestage)
                    (subscript_expression object: (identifier) @sameaccount
                      index: (string (string_fragment) @samestage))]
                operator: "++" @increment)
              (update_expression operator: "++" @increment
                argument: [(member_expression object: (identifier) @sameaccount property: (property_identifier) @samestage)
                    (subscript_expression object: (identifier) @sameaccount
                      index: (string (string_fragment) @samestage))])]) .
            (return_statement (object
              (pair key: (property_identifier) @payout value: (false))
              [(shorthand_property_identifier) @returned
               (pair value: (identifier) @returned)])) .)) @evidence)
          (#set! cleave.ignore-comments "true")
          (#eq? @fees @table) (#eq? @table @sametable)
          (#eq? @fee1 "fee") (#eq? @fee2 "fee")
          (#match? @amount1 "^[1-9][0-9]*$") (#match? @amount2 "^[1-9][0-9]*$")
          (#eq? @length "length") (#eq? @account @sameaccount)
          (#eq? @stage @samestage) (#match? @increment "^([1-9][0-9]*|\\+\\+)$")
          (#eq? @payout "payout") (#eq? @reason @returned))
