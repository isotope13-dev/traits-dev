defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-unconditional-cyclic-payout-denial
  desc: Cycles refusals and always denies payout
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |-
      ((function_definition body: (block .
        (expression_statement (assignment left: (identifier) @reason
          right: (subscript value: (identifier) @table subscript: (binary_operator
            left: (subscript value: (identifier) @account subscript: (string (string_content) @stage))
            operator: "%" right: (call function: (identifier) @length
              arguments: (argument_list (identifier) @same_table)))))) .
        (expression_statement (augmented_assignment
          left: (subscript value: (identifier) @same_account subscript: (string (string_content) @same_stage))
          operator: "+=" right: (integer) @increment)) .
        (return_statement (dictionary
          (pair key: (string (string_content) @payout) value: (false))
          (pair value: (identifier) @returned))) .)) @evidence
        (#eq? @table @same_table) (#eq? @length "len")
        (#eq? @account @same_account) (#eq? @stage @same_stage)
        (#match? @increment "^[1-9][0-9]*$")
        (#eq? @payout "payout") (#eq? @reason @returned))
- id: python-fee-reason-table
  desc: Table pairs reason codes with positive fees
  crit: notable
  conf: 0.97
  count_min: 2
  if:
    type: tree-sitter
    query: |-
      ((assignment right: (list (dictionary
        (pair key: (string (string_content) @code) value: (string))
        (pair key: (string (string_content) @fee) value: (integer) @amount)) @evidence))
        (#match? @code "^(code|reason)$") (#eq? @fee "fee")
        (#match? @amount "^[1-9][0-9]*$"))
