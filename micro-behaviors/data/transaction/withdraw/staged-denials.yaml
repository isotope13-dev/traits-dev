# Co-occurrence is useful evidence of a payout-denial model, including in a
# simulation. It does not prove fabricated compliance checks or fee collection.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]

composite_rules:
  - id: staged-payout-denial-clues
    desc: Withdrawal stage advances beside error indexing and payout denial
    crit: notable
    conf: 0.94
    all:
      - id: refusal-stage-increment
      - id: refusal-table-index
      - id: payout-denied-return
