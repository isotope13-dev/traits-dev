defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: contract-abi-constant-reference
  desc: Declares an ABI-named contract constant
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(export\s+)?(declare\s+)?const\s+[A-Za-z0-9_$]+Abi\b'

- id: evm-address-field-declarations
  desc: Repeated literal EVM address fields
  crit: notable
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: '\breadonly\s+address:\s*["'']0x[a-fA-F0-9]{40}["'']'

- id: evm-address-constants
  desc: Repeated literal EVM address constants
  crit: notable
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: '\bconst\s+[A-Za-z0-9_$]+Address\s*=\s*["'']0x[a-fA-F0-9]{40}["'']'

- id: contract-simulation-reference
  desc: References the simulateContract API name
  crit: notable
  conf: 0.9
  if:
    type: text
    word: simulateContract

- id: contract-client-reference
  desc: References the getContract API name
  crit: notable
  conf: 0.9
  if:
    type: text
    word: getContract
