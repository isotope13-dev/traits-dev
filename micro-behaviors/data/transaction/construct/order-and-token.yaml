defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.95

traits:
  - id: trading-order-constructor-reference
    desc: References trading order construction method
    if:
      type: symbol
      kind: member
      regex: '(^|\.)(create(Market)?Order|create_(market_)?order)$'

  - id: trading-sell-order-construction
    desc: Constructs an order specifying SELL side
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(create(Market)?Order|create_(market_)?order)$'
      arg:
        from:
          field: side
          whole_value: '^SELL$'
