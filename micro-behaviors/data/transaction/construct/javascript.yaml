defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: solana-system-program-transfer
  desc: Solana SystemProgram.transfer instruction
  conf: 0.85
  if:
    type: text
    substr: SystemProgram.transfer
- id: web3-gas-estimate-call
  desc: Web3 transaction gas estimate
  if:
    type: text
    regex: '\b(this\.)?web3(_\d+)?\.eth\.estimateGas\s*\('
