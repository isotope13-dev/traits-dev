defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, go, rust, csharp]
  crit: notable
  conf: 0.95

traits:
  - id: erc1155-batch-transfer-call
    desc: Calls ERC-1155 batch transfer or encoder
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[Ss]afe_?[Bb]atch_?[Tt]ransfer_?[Ff]rom$'

  - id: sell-order-construction
    desc: Constructs a SELL trading order
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)create(Market)?Order$'
      arg:
        index: 0
        from:
          field: side
          whole_value: '^SELL$'

  - id: erc1155-batch-transfer-encoding
    desc: ABI-encodes an ERC-1155 batch transfer
    for: [javascript, typescript, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(encodeFunctionData|encodeABI|encode_abi)$'
      arg:
        index: 0
        kind: string
        regex: '^safeBatchTransferFrom(\(|$)'

  - id: erc1155-batch-transfer-encoding-options
    desc: ABI encoder selects ERC-1155 batch transfer
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)encodeFunctionData$'
      arg:
        index: 0
        from:
          field: functionName
          whole_value: '^safeBatchTransferFrom$'

composite_rules:
  - id: erc1155-batch-transfer-construction
    desc: Constructs an ERC-1155 batch transfer
    any:
      - id: erc1155-batch-transfer-call
      - id: erc1155-batch-transfer-encoding
      - id: erc1155-batch-transfer-encoding-options
