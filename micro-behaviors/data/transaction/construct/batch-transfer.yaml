defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, go, rust, csharp]
  crit: notable
  conf: 0.95

traits:
  - id: erc1155-batch-transfer-call
    desc: Calls ERC-1155 batch transfer or encoder
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[Ss]afe_?[Bb]atch_?[Tt]ransfer_?[Ff]rom$'

  - id: market-sell-order-construction
    desc: Constructs a market SELL order
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createMarketOrder$'
      arg:
        index: 0
        from:
          field: side
          whole_value: '^SELL$'
