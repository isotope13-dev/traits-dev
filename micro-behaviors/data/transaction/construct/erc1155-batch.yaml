# ERC-1155's ABI method and selector retain their meaning across EVM chains,
# clients and host platforms. Neither constructing a batch nor its ABI is theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.97

traits:
  - id: erc1155-batch-transfer-encoding
    desc: Encodes an ERC-1155 batch transfer
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(encodeFunctionData|encodeABI|encode_abi)$'
      arg:
        kind: string
        exact: safeBatchTransferFrom
