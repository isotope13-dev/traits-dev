defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: solana-kit-sol-transfer-instruction
    desc: Constructs a Solana SOL transfer instruction
    if:
      type: symbol
      kind: call
      exact: getTransferSolInstruction

  - id: solana-kit-token-transfer-instruction
    desc: Constructs a checked SPL token transfer
    if:
      type: symbol
      kind: call
      exact: getTransferCheckedInstruction
