defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: component
  size_max: 52428800
traits:
  - id: go-tls-ciphersuites-reference
    crit: notable
    desc: Go crypto/tls CipherSuites function reference
    conf: 0.9
    if:
      type: text
      # Bare CipherSuites is also an Objective-C socket TLS option and a
      # rustls diagnostic. Require Go's qualified package/function spelling.
      regex: 'crypto/tls[./]CipherSuites\b'
    unless:
      # rustls names the same TLS concepts (`CipherSuites`, `SignatureScheme`)
      # in its error and debug strings; a Rust TLS client is not Go.
      - id: micro-behaviors/crypto/library/provider::rustls-crate-path
  - id: go-tls-internal-handshakecontext
    crit: notable
    desc: Go crypto/tls HandshakeContext internal type
    conf: 0.8
    if:
      type: text
      exact: HandshakeContext
  - id: go-http2-framer-internals
    desc: Go HTTP/2 framer internals
    conf: 0.85
    count_min: 2
    if:
      type: text
      regex: http2Frame[A-Z]
composite_rules:
  - id: go-http-internals-present
    desc: Go HTTP internal types detected
    crit: component
    conf: 0.8
    any:
      - id: metadata/binary/symbols/descriptor::go-http-internal-http2transport
      - id: metadata/binary/symbols/descriptor::go-http-internal-persistconn
      - id: metadata/binary/symbols/descriptor::go-http-internal-http2clientconn
      - id: metadata/binary/symbols/descriptor::go-http-internal-wantconn
      - id: metadata/binary/symbols/descriptor::go-http-internal-http2framer
      - id: metadata/binary/symbols/descriptor::go-http-internal-roundtripper
  - id: go-tls-internals-present
    desc: Go TLS internal types detected
    crit: component
    conf: 0.8
    any:
      - id: metadata/binary/symbols/descriptor::go-tls-internal-serverhello
      - id: metadata/binary/symbols/descriptor::go-tls-internal-peercertificates
      - id: go-tls-internal-handshakecontext
      - id: go-tls-ciphersuites-reference
      - id: micro-behaviors/data/runtime/library::go-runtime-crypto-tls-fragment
  - id: go-http2-internals-present
    desc: Go HTTP/2 internals present
    crit: component
    conf: 0.85
    any:
      - id: go-http2-framer-internals
      - id: metadata/binary/symbols/descriptor::go-http2-frame-types
      - id: micro-behaviors/data/runtime/library::go-runtime-http2client-fragment
      - id: metadata/binary/symbols/descriptor::go-http2-frame-headers
      - id: metadata/binary/symbols/descriptor::go-http2-transport-internals
