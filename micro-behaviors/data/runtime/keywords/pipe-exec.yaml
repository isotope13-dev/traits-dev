# Pipe-to-interpreter token: stdout piped into a shell or scripting runtime.
# Neutral primitive — legitimate installers use it too. Composites gate it with
# a download client and a run/paste cue to detect download-pipe-exec lures.
defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests]
  crit: component
traits:
- id: pipe-to-bash
  desc: Pipe to bash interpreter token
  conf: 0.88
  if:
    type: text
    regex: '(^|[^|])\|[ \t]+bash\b'
    case_insensitive: true
  unless:
    - id: metadata/package/manifest/ecosystem::pkginfo-markdown-description
    - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
    - id: metadata/file/catalog/identity::debian-packages-index
- id: pipe-to-sh
  desc: Pipe to sh interpreter
  conf: 0.88
  if:
    type: text
    # A closing `|` must not follow, so Ruby/Vagrant block parameters such as
    # `config.vm.provision "x" do |sh|` are not read as shell pipelines. Same
    # reasoning as pipe-to-node below.
    regex: '(^|[^|])\|[ \t]*sh([ \t;&)]|$)'
    case_insensitive: true
  unless:
    - id: metadata/file/catalog/identity::debian-packages-index
- id: pipe-to-zsh
  desc: Pipe to zsh interpreter token
  conf: 0.88
  if:
    type: text
    regex: '(^|[^|])\|[ \t]+zsh\b'
    case_insensitive: true
  unless:
    - id: metadata/file/catalog/identity::debian-packages-index
- id: pipe-to-python
  desc: Pipe to Python interpreter token
  conf: 0.88
  if:
    type: text
    regex: '(^|[^|])\|[ \t]+python\b'
    # Shell command names are case-sensitive on Unix.  Keeping this
    # lowercase avoids Markdown tables such as "| Python Driver" while
    # preserving ordinary `curl | python` pipelines.
  unless:
    - id: metadata/package/manifest/ecosystem::pkginfo-markdown-description
    - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
    - id: metadata/file/catalog/identity::debian-packages-index
- id: pipe-to-node
  desc: Pipe to Node.js runtime token
  conf: 0.88
  if:
    type: text
    # Require a command argument so Ruby block parameters such as
    # `| node |` are not treated as shell pipelines. Node command names are
    # case-sensitive on Unix; lowercase also excludes Markdown table cells
    # such as `| Node build |`.
    regex: '(^|[^|])\|[ \t]+node[ \t]+[^|\n]'
  unless:
    - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
    - id: metadata/file/catalog/identity::debian-packages-index
- id: pipe-to-perl
  desc: Pipe to Perl interpreter token
  conf: 0.88
  if:
    type: text
    regex: '(^|[^|])\|[ \t]+perl\b'
    case_insensitive: true
  unless:
    - id: metadata/file/catalog/identity::debian-packages-index
- id: pipe-to-ruby
  desc: Pipe to Ruby interpreter token
  conf: 0.88
  if:
    type: text
    regex: '(^|[^|])\|[ \t]+ruby\b'
    case_insensitive: true
  unless:
    - id: metadata/file/catalog/identity::debian-packages-index
composite_rules:
- id: pipe-to-shell
  desc: Pipe to a shell interpreter
  crit: component
  conf: 0.88
  any:
  - id: pipe-to-bash
  - id: pipe-to-sh
  - id: pipe-to-zsh
- id: pipe-to-script-runtime
  desc: Pipe to a scripting runtime
  crit: component
  conf: 0.88
  any:
  - id: pipe-to-python
  - id: pipe-to-node
  - id: pipe-to-perl
  - id: pipe-to-ruby
- id: pipe-to-interpreter
  desc: Pipe-to-interpreter token
  crit: component
  conf: 0.88
  any:
  - id: pipe-to-shell
  - id: pipe-to-script-runtime
