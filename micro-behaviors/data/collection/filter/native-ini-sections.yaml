defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  - id: x86-server-link-host-section-filter
    desc: Native INI server/link/host section filter
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_server_link_host_section_filter {
          strings:
            $servers = "[SERVERS]\x00" ascii
            $links = "[LINKS]\x00" ascii
            $hosts = "[HOSTS]\x00" ascii
            // COW string ABI: three skip flags, resumed at the next heading.
            $filter_cow = {
              C7 44 24 04 ?? ?? ?? ?? 89 34 24 E8 ?? ?? ?? ??
              84 C0 74 ?? C6 43 04 01 E9 ?? ?? ?? ??
              C7 44 24 04 ?? ?? ?? ?? 89 34 24 E8 ?? ?? ?? ??
              84 C0 74 ?? C6 43 05 01 E9 ?? ?? ?? ??
              C7 44 24 04 ?? ?? ?? ?? 89 34 24 E8 ?? ?? ?? ??
              84 C0 74 ?? C6 43 06 01 E9 ?? ?? ?? ??
              80 7B 06 00 74 ?? 8B 45 ?? 83 78 F4 00 74 ??
              89 F1 E8 ?? ?? ?? ?? 8B 45 ?? 80 38 5B 75 ?? C6 43 06 00
              80 7B 04 00 74 ?? 8B 45 ?? 83 78 F4 00 74 ??
              89 F1 E8 ?? ?? ?? ?? 8B 45 ?? 80 38 5B 75 ?? C6 43 04 00
              80 7B 05 00 74 ?? 8B 45 ?? 83 78 F4 00 74 ??
              89 F1 E8 ?? ?? ?? ?? 8B 45 ?? 80 38 5B 75 ?? C6 43 05 00
            }
            $filter = {
              C7 44 24 04 ?? ?? ?? ?? 89 1C 24 E8 ?? ?? ?? ??
              84 C0 74 ?? C6 47 18 01 E9 ?? ?? ?? ??
              C7 44 24 04 ?? ?? ?? ?? 89 1C 24 E8 ?? ?? ?? ??
              84 C0 74 ?? C6 47 19 01 EB ??
              C7 44 24 04 ?? ?? ?? ?? 89 1C 24 E8 ?? ?? ?? ??
              84 C0 74 ?? C6 47 1A 01 EB ??
              80 7F 1A 00 74 ?? 83 7D ?? 00 74 ?? 8B 45 ??
              80 38 5B 75 ?? C6 47 1A 00
              80 7F 18 00 74 ?? 83 7D ?? 00 74 ?? 8B 45 ??
              80 38 5B 75 ?? C6 47 18 00
              80 7F 19 00 74 ?? 83 7D ?? 00 74 ?? 8B 45 ??
              80 38 5B 75 ?? C6 47 19 00
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            (for any c in (1..#filter) : (
              for any a in (1..#servers) : (
                pe.rva_to_offset(uint32(@filter[c]+4)-pe.image_base) == @servers[a]
              ) and
              for any b in (1..#links) : (
                pe.rva_to_offset(uint32(@filter[c]+33)-pe.image_base) == @links[b]
              ) and
              for any d in (1..#hosts) : (
                pe.rva_to_offset(uint32(@filter[c]+59)-pe.image_base) == @hosts[d]
              )
            ) or for any c in (1..#filter_cow) : (
              for any a in (1..#servers) : (
                pe.rva_to_offset(uint32(@filter_cow[c]+4)-pe.image_base) == @servers[a]
              ) and for any b in (1..#links) : (
                pe.rva_to_offset(uint32(@filter_cow[c]+33)-pe.image_base) == @links[b]
              ) and for any d in (1..#hosts) : (
                pe.rva_to_offset(uint32(@filter_cow[c]+62)-pe.image_base) == @hosts[d]
              )
            ))
        }
