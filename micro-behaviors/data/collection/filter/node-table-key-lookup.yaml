defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: node-table-key-lookup
    desc: Finds table entry present in another map
    crit: baseline
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\w+\[\w+\]\.find\(\w+\s*=>\s*\w+\[\w+\]\)'

