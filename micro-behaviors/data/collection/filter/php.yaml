defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-filter-callback-mode
    desc: Uses PHP callback filtering mode
    if:
      type: tree-sitter
      node: function_call_expression
      regex: '^filter_var\s*\([^,]{1,80},\s*FILTER_CALLBACK\b'
