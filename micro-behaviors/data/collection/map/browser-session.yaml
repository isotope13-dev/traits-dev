defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable
  conf: 0.96

traits:
  - id: mapping-get-cookies-key
    desc: "Reads the cookies key from a mapping"
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'session\.get\(\s*["'']cookies["'']'
