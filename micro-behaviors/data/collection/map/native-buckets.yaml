defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: hash-bucket-count-assignment
    desc: Assigns one bucket to hash-table storage
    if:
      type: text
      regex: '(->|\.)numOfBuckets\s*=\s*1\s*;'
  - id: hash-bucket-address-cast
    desc: Casts address into hash-table bucket storage
    if:
      type: text
      regex: '(->|\.)bucketArray\s*=\s*\(\s*wHashTableBucket\s*\*\s*\*\s*\)\s*\w+\s*;'
