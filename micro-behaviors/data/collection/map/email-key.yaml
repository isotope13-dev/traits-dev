# A quoted email key establishes a data field, not agent messaging.
defaults:
  platforms: [windows, unix]
traits:
  - id: quoted-email-field-key
    desc: Quoted email field key
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)["'']email["'']\s*[:=]'

