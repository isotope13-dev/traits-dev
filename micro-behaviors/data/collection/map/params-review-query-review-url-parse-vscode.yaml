defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
- id: params-username-lookup
  desc: params.get username key text
  crit: component
  conf: 0.9
  if:
    type: text
    substr: params.get('username')
- id: params-password-lookup
  desc: params.get password key text
  crit: component
  conf: 0.95
  if:
    type: text
    substr: params.get('password')
- id: params-code-lookup
  desc: params.get code key text
  crit: component
  conf: 0.95
  if:
    type: text
    substr: params.get('code')
- id: params-state-lookup
  desc: params.get state key text
  crit: component
  conf: 0.95
  if:
    type: text
    substr: params.get('state')
