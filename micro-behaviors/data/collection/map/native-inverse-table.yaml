defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # Builds a byte-indexed inverse map for a 64-symbol alphabet. This is
  # table construction; the separate consumer decides how it is decoded.
  - id: x64-inverse-64-symbol-table
    desc: Builds inverse map of 64 symbols
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: >-
        0F B6 84 34 ?? ?? 00 00 40 88 74 04 ??
        48 83 C6 01 48 83 FE 40 75 ??
