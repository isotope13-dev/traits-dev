defaults:
  platforms: [windows]
  for: [python]
  crit: notable
traits:
  - id: pid-to-tag-name-reference
    desc: Text names a pid_to_tag helper
    conf: 0.85
    if:
      type: text
      substr: pid_to_tag
  - id: pid-to-tag-helper-symbol
    desc: Python references a pid_to_tag helper
    conf: 0.9
    if:
      type: symbol
      exact: pid_to_tag
