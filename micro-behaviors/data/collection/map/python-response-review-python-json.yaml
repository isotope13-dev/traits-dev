defaults:
  platforms:
    - windows
    - unix
  for:
    - python
traits:
  - id: json-cmd-field-get
    desc: JSON-decoded mapping get for cmd
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: json\.loads\([^)]{1,80}\)\.get\(['"]cmd['"]\)
  - id: python-payload-mapping-access
    desc: Python mapping payload-field access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: \b(config|data|response)\s*\[\s*['"]payload['"]\s*\]
