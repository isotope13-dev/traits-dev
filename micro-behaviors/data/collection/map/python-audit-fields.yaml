# User identity fields in an HTTP request support audit attribution and can also
# reveal data collection. The observation remains neutral without covert intent.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.92

traits:
  - id: audit-user-name-payload-field
    crit: component
    desc: User-name field in a mapping
    if:
      type: text
      regex: '["'']_user_name["'']\s*:'

  - id: audit-user-email-payload-field
    crit: component
    desc: User-email field in a mapping
    if:
      type: text
      regex: '["'']_user_email["'']\s*:'

