# Python JSON Deserialization
# MBC: C0024 (Data Transformation)
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: mapping-get-action-key
    desc: Python mapping reads the literal "action" key
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^\w+\.get$'
      arg:
        kind: string
        exact: action
  - id: mapping-get-code-key
    desc: Python mapping reads the literal "code" key
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^\w+\.get$'
      arg:
        kind: string
        exact: code
  - id: mapping-get-executable-field
    desc: Python mapping reads an executable field
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^\w+\.get$'
      arg:
        kind: string
        regex: '^(code|command|script|payload)$'
  - id: mapping-get-assets-key
    desc: Python mapping reads an assets key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.get\(["''](assets|resources)["'']\)'
  - id: mapping-get-url-key
    desc: Python mapping reads the url key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.get\(["'']url["'']\)'
  - id: mapping-get-hash-key
    desc: Python mapping reads a hash key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.get\(["''](sha256|integrity|hash)["'']\)'
  - id: mapping-get-args-key
    desc: Python mapping reads an args key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.get\(["''](args|params)["'']\)'
  - id: mapping-get-platform-key
    desc: Python mapping reads a platform key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.get\(["''](platform|os)["'']\)'
  - id: mapping-get-message-key
    desc: Python message-key lookup
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.get\s*\(\s*["'']message["'']\s*\)'
