defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - go
  - javascript
  - typescript
  crit: notable
  conf: 0.93

traits:
  - id: python-command-field-mapping-lookup
    desc: Looks up command-like field in mapping
    for: [python]
    if:
      type: text
      regex: '\b\w+\.get\s*\(\s*\w+\s*\[\s*["''](action|decision|command|task)["'']\s*\]'

  # JavaScript has no Counter/most_common idiom; the same tally is a
  # frequency histogram over the decision field, incremented once per
  # response. Neutral mechanic -- poll counters and survey code do this --
  # objective composites add the model endpoints and the action menu.
