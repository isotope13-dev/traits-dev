defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: documentation-octet-table
    desc: Table lists documentation address prefix
    conf: 0.99
    if:
      type: tree-sitter
      kind: assignment
      regex: '^\w+\s*=\s*\{[^:]{1,32}: 192,[^:]{1,32}: 0,[^:]{1,32}: 2,[^:]{1,32}: \d{1,3}\}$'
