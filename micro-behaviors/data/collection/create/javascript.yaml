defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: named-collection-create-call
    desc: Calls createCollection with a literal name
    if:
      type: symbol
      kind: call
      regex: '\.createCollection$'
      arg:
        index: 0
        kind: string
