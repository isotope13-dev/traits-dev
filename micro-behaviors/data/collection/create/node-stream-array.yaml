traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: node-stream-class-name-array
  desc: Array literal contains a stream-class name
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: (array (identifier) @stream (#match? @stream "^(PassThrough|Readable|Duplex)$"))
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
