defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.85
traits:
  - id: python-itertools-cycle-call
    desc: Creates a cyclic iterator with itertools.cycle
    # A cyclic iterator is a complete, useful operation rather than a
    # near-universal source property. Keep it visible independently of the
    # payload-loader composites that consume it.
