defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  crit: notable
  conf: 0.85

traits:
  - id: python-range-long-span-call
    desc: Python range call has stop of 100+
    if:
      type: text
      # Two-argument ranges ending below 100 are routine fixed-size loops in
      # crypto and codecs (SM3 uses range(16, 68)).
      regex: '\brange\s*\(\s*[0-9]+\s*,\s*([1-9][0-9]{2,}|[1-9][0-9]?_[0-9]{3}(_[0-9]{3})*)\b'
