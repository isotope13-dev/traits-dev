# Constructs a native collection of browser-profile path pointers.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: native-multi-browser-profile-pointer-array
    desc: Builds native browser profile-pointer array
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule native_multi_browser_profile_pointer_array {
          strings:
            $chrome = "Google\\Chrome\\User Data" wide
            $edge = "Microsoft\\Edge\\User Data" wide
            $brave = "BraveSoftware\\Brave-Browser\\User Data" wide
            $opera = "Opera Software\\Opera Stable" wide
            $array = {
              48 8D 05 ?? ?? ?? ?? 48 89 45 ??
              48 8D 05 ?? ?? ?? ?? 48 89 45 ??
              48 8D 05 ?? ?? ?? ?? 48 89 45 ??
              48 8D 05 ?? ?? ?? ?? 48 89 45 ??
            }
          condition:
            pe.machine == pe.MACHINE_AMD64 and all of them and
            for any s in (0..pe.number_of_sections-1) : (
              @array >= pe.sections[s].raw_data_offset and
              @array+44 <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
              pe.rva_to_offset(pe.sections[s].virtual_address+@array-pe.sections[s].raw_data_offset+7+int32(@array+3)) == @chrome and
              pe.rva_to_offset(pe.sections[s].virtual_address+@array-pe.sections[s].raw_data_offset+18+int32(@array+14)) == @edge and
              pe.rva_to_offset(pe.sections[s].virtual_address+@array-pe.sections[s].raw_data_offset+29+int32(@array+25)) == @brave and
              pe.rva_to_offset(pe.sections[s].virtual_address+@array-pe.sections[s].raw_data_offset+40+int32(@array+36)) == @opera
            )
        }
