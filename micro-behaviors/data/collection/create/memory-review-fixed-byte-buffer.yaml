defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: go-48-byte-slice
    desc: Go creates a 48-byte slice with make
    for: [go]
    if:
      type: text
      regex: 'make\s*\(\s*\[\]byte\s*,\s*48\s*\)'

  - id: python-48-byte-bytearray
    desc: Python creates a 48-byte bytearray
    for: [python]
    if:
      type: symbol
      kind: call
      exact: bytearray
      arg:
        index: 0
        kind: number
        value: 48
