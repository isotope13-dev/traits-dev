defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
traits:
  - id: excel4-macro-sheet-creation
    desc: Creates an Excel 4.0 macro sheet
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Excel4(Intl)?MacroSheets\s*\.\s*Add'

composite_rules:
  - id: runtime-excel4-macro-setup
    desc: XLM creation with dispatch or formula assembly
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/collection/create::excel4-macro-sheet-creation
    any:
      - id: metadata/lang/source/syntax/call/arguments::vba-run-concatenated-cell-address
      - id: micro-behaviors/process/interpreter/eval/indirect::vba-run-sheet-range
      - id: metadata/lang/source/syntax/operator::vba-formula-prefix-concatenation
