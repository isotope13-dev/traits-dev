defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
- id: script-create-near-src-assignment-in-file-tail
  desc: Script creation near src assignment in tail
  crit: notable
  conf: 0.8
  if:
    # Preserve the tail bound used by appended-loader consumers. This finds
    # nearby syntax, not a proven same-node assignment or process launch.
    type: text
    regex: createElement\s*\(\s*['"`]script['"`][\s\S]{0,200}\.src\s*=
    offset_range: [-2048, null]
  not:
    # Retain the existing webpack chunk-loader exclusion unchanged.
    - regex: 'setAttribute\s*\(\s*["'']data-webpack["'']'
