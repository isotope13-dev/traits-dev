defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: local-fetch-tag-text-helper
    desc: Local fetch function reads DOM tag text
    conf: 0.99
    if:
      type: text
      regex: '(?s)function fetch\([^)]{0,80}\).{0,100}textContent.{0,40}getElementsByTagName'

composite_rules:
# The exclusion requires the local DOM-reader implementation. A bundled copy
# does not suppress separately evidenced HTTP fetch operations.
- id: local-dom-fetch-helper-context
  desc: DOM helper without separate fetch indicators
  crit: exception
  conf: 0.99
  all:
  - id: micro-behaviors/data/collection/dom::local-fetch-tag-text-helper
  unless:
  - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
  - id: micro-behaviors/communications/http/request/client::fetch-then-json
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
  - id: micro-behaviors/communications/http/request/client::js-fetch-buffer-from-decoded-url
  - id: micro-behaviors/communications/http/request/client::module-execution-http-call
