# Canvas LMS publishes the signed-in user in the page's ENV global
# (ENV.current_user.display_name). A content script reading it obtains the
# student's real name from the session it runs in.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: canvas-env-current-user-name
    desc: Reads Canvas ENV current_user name
    if:
      type: text
      regex: '\bENV\.current_user\.(display_name|name)\b'
