defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - scripts
  - html
  conf: 0.9
  id: source-append-child-call
  desc: Appends a node to a DOM parent
  if:
    type: text
    regex: \bappendChild\s*\(
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.9
  id: document-root-append
  desc: Appends element to document root
  if:
    type: symbol
    kind: call
    exact: document.documentElement.appendChild
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  id: append-child-reference
  desc: References DOM appendChild method
  if:
    type: symbol
    regex: (^|\.)appendChild$
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  crit: component
  id: dom-insert-before-parent-node-call
  desc: parentNode.insertBefore DOM call
  if:
    type: text
    regex: parentNode\.insertBefore\s*\(
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  crit: component
  id: dom-insert-before-document-call
  desc: document.insertBefore DOM call
  if:
    type: text
    regex: document\.insertBefore\s*\(
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  crit: component
  id: dom-insert-before-document-element-call
  desc: documentElement.insertBefore DOM call
  if:
    type: text
    regex: documentElement\.insertBefore\s*\(
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  crit: component
  id: dom-insert-before-owner-document-call
  desc: ownerDocument.insertBefore DOM call
  if:
    type: text
    regex: ownerDocument\.insertBefore\s*\(
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  id: node-remove-call
  desc: Removes a child node from the DOM
  if:
    type: text
    regex: \.removeChild\s*\(|\b(document|querySelector|getElementById)\b.{0,40}\.remove\(\s*\)
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
- for:
  - javascript
  - typescript
  - html
  - -kotlin
  conf: 0.8
  id: insert-before-call
  desc: Inserts DOM node before reference node
  any:
  - id: dom-insert-before-parent-node-call
  - id: dom-insert-before-document-call
  - id: dom-insert-before-document-element-call
  - id: dom-insert-before-owner-document-call
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
