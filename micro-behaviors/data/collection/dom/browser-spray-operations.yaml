defaults:
  for:
  - html
  - javascript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.96
traits:
- id: large-title-substring-store
  desc: Title receives large hexadecimal-bound slice
  if:
    type: text
    regex: \.title\s*=\s*\w+\.substring\(0,\s*\(?0x[0-9a-fA-F]{5,}
- id: stylesheet-owner-reference
  desc: References stylesheet owning element
  if:
    type: text
    substr: .styleSheets[0].owningElement
- id: detach-then-outerhtml-replacement
  desc: Detach precedes outerHTML replacement
  if:
    type: text
    regex: \.removeChild\(\w+\);\s*\w+\.outerHTML\s*=
- id: insert-adjacent-element-call
  desc: Calls insertAdjacentElement method
  if:
    type: text
    substr: .insertAdjacentElement(
