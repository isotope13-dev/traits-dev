defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- id: element-creation-method-reference
  for:
  - javascript
  - typescript
  desc: References a DOM element creation method
  conf: 0.85
  if:
    type: text
    regex: \b(createElement|createContextualFragment)\b
  unless:
  - id: micro-behaviors/ui/graphics/draw::webgpu-api-source-context
- id: node-mutation-method-reference
  for:
  - javascript
  - typescript
  desc: References a DOM insertion or mutation method
  conf: 0.85
  if:
    type: text
    regex: \b(appendChild|setAttribute)\b
  unless:
  - id: micro-behaviors/ui/graphics/draw::webgpu-api-source-context
  - type: text
    regex: "startsWith\\(['\"]aria-['\"]\\)"
  - type: text
    substr: 'data-${attr.name}'
- id: document-create-element
  for:
  - javascript
  - typescript
  - html
  - -kotlin
  desc: Creates DOM element
  conf: 0.96
  if:
    type: symbol
    kind: call
    exact: document.createElement
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: micro-behaviors/ui/graphics/draw::webgpu-api-source-context
- id: document-createelement-bytes
  desc: document.createElement byte string
  conf: 0.9
  for:
  - elf
  if:
    type: hex
    pattern: 64 6f 63 75 6d 65 6e 74 2e 63 72 65 61 74 65 45 6c 65 6d 65 6e 74
    offset_range:
    - 0
    - null
