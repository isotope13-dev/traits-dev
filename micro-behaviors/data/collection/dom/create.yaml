defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- id: dom-anchor-element-creation
  for: [html, javascript, typescript]
  crit: notable
  desc: Creates an anchor DOM element
  conf: 0.85
  if:
    type: text
    regex: '(?i)createElement\s*\(\s*["'']a["'']\s*\)'
- id: contextual-fragment-call
  for: [javascript, typescript]
  desc: Calls DOM contextual fragment creation method
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '\.createContextualFragment$'

- id: document-createelement-bytes
  desc: document.createElement byte string
  conf: 0.9
  for:
  - elf
  if:
    type: hex
    pattern: 64 6f 63 75 6d 65 6e 74 2e 63 72 65 61 74 65 45 6c 65 6d 65 6e 74
    offset_range:
    - 0
    - null
- id: dom-create-embed-element
  for:
  - javascript
  - typescript
  - html
  desc: Creates an embed DOM element
  # Embed elements load active external content (SVG carriers with script);
  # creating one dynamically is the carrier half of embed smuggling chains.
  if:
    type: text
    regex: 'document\.createElement\(\s*[''"]embed[''"]'

composite_rules:
- id: element-creation-method-reference
  for: [javascript, typescript]
  desc: Calls DOM element or fragment creation method
  conf: 0.9
  any:
  - id: micro-behaviors/ui/window/dom/create::document-create-element
  - id: contextual-fragment-call
