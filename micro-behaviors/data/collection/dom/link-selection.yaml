defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:

  - id: micro-behaviors/data/collection/dom::queryselector-link-targeting
    desc: Link element selection
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
    if:
      type: text
      regex: "querySelectorAll\\([^)]{0,120}a\\[href"

