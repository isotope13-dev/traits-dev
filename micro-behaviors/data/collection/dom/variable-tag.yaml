# Moved from process/deploy without changing matcher, scope or severity:
# the tag may be any element; creation alone does not activate a script.
defaults:
  platforms: [windows, unix]
  crit: notable
traits:
  - id: variable-tag-createelement
    desc: Creates element from variable tag name
    conf: 0.85
    for: [javascript, typescript, html, php, svg, binaries, makefile, text]
    if:
      type: text
      regex: 'createElement\(\s*[A-Za-z_$][\w$]*\s*\)'
  # The tag name is the return value of a helper call (a decoder or a
  # regex-strip of junk characters), so it is never spelled in the source.
  - id: decoded-tag-createelement
    desc: Creates element from a decoded tag name
    conf: 0.85
    for: [javascript, html]
    if:
      type: text
      regex: '\.createElement\(\s*[A-Za-z_$][\w$]*\(\s*[''"]'
