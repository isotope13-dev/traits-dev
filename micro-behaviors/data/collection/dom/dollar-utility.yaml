defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: dollar-dom-utility-syntax
    desc: Dollar-style DOM or utility API references
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\B\$\s*\(\s*(document|window|function|["''])|\B\$\.(ajax|get|post|each|fn|extend)\b'
    unless:
      - id: micro-behaviors/data/collection/dom::dollar-dom-lookup-helper
