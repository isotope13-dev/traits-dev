# Parsed code distinguishes jQuery-style use from a shell command stored in
# a JavaScript string, such as PROMPT="$(...)", and from comments.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: dollar-utility-call
    size_max: 262144
    desc: Calls a dollar-named DOM utility
    crit: notable
    conf: 0.8
    if:
      # The validator rejects a one-character exact symbol and also rejects
      # its equivalent anchored regex as wasted. This query preserves the
      # actual call shape without falling back to text in strings/comments.
      type: tree-sitter
      query: |
        (
          (call_expression function: (identifier) @callee
            arguments: (arguments . (identifier) @target))
          (#eq? @callee "$")
          (#match? @target "^(document|window)$")
        )
        (
          (call_expression function: (identifier) @callee
            arguments: (arguments . [(string) (function_expression)
              (generator_function) (arrow_function)]))
          (#eq? @callee "$")
        )
  - id: dollar-http-utility-member
    desc: References a dollar HTTP utility member
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: member
      regex: '^\$\.(ajax|get|post)$'
  - id: dollar-extension-utility-member
    desc: References dollar extension utilities
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: member
      regex: '^\$\.(each|fn|extend)$'

  # HTML has no embedded JavaScript symbols/AST in the current extractor.
  # Preserve its existing text-reference coverage, explicitly scoped to HTML.
  - id: html-dollar-call-syntax
    desc: HTML text references a dollar-style DOM call
    crit: notable
    conf: 0.8
    for: [html]
    if:
      type: text
      regex: '\B\$\s*\(\s*(document|window|function|["''])'
      exclude_html_comments: true
  - id: html-dollar-http-member-syntax
    desc: HTML text references dollar HTTP utility members
    crit: notable
    conf: 0.8
    for: [html]
    if:
      type: text
      regex: '\B\$\.(ajax|get|post)\b'
      exclude_html_comments: true
  - id: html-dollar-extension-member-syntax
    desc: HTML references dollar extension utilities
    crit: notable
    conf: 0.8
    for: [html]
    if:
      type: text
      regex: '\B\$\.(each|fn|extend)\b'
      exclude_html_comments: true
composite_rules:
  - id: dollar-dom-utility-syntax
    desc: Dollar-style DOM or utility API references
    crit: notable
    conf: 0.8
    for: [javascript, html]
    any:
      - id: micro-behaviors/data/collection/dom::dollar-utility-call
      - id: micro-behaviors/data/collection/dom::dollar-http-utility-member
      - id: micro-behaviors/data/collection/dom::dollar-extension-utility-member
      - id: micro-behaviors/data/collection/dom::html-dollar-call-syntax
      - id: micro-behaviors/data/collection/dom::html-dollar-http-member-syntax
      - id: micro-behaviors/data/collection/dom::html-dollar-extension-member-syntax
    unless:
      - id: micro-behaviors/data/collection/dom::dollar-dom-lookup-helper
