# Creation and source assignment are nearby; receiver identity and activation
# are not established by this matcher. Webpack's own chunk loader
# (__webpack_require__.l) creates a script, tags it data-webpack, and sets its
# src from the chunk URL in every bundle with async chunks; that runtime
# match carries no loader intent, so the tag in the span excludes it.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: script-create-near-src-assignment
    desc: Script creation near source assignment
    conf: 0.9
    for: [javascript, typescript, html, php, svg, binaries, makefile, text]
    unless:
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb
    if:
      type: text
      regex: 'createElement\(\s*[''"]script[''"]\s*\)[\s\S]{0,260}[\w$]+\.src\s*=[^=]'
    not:
      - substr: data-webpack
      - substr: __webpack_require__.nc
