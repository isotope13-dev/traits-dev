defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  - -kotlin
traits:
- crit: notable
  id: query-selector-all-call
  desc: Queries multiple DOM elements
  conf: 0.86
  if:
    type: symbol
    kind: call
    regex: (^|\.)querySelectorAll$
- crit: notable
  id: create-tree-walker-call
  desc: Creates a DOM tree walker
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: (^|\.)createTreeWalker$
- crit: notable
  id: text-node-filter-reference
  desc: References DOM text-node filter
  conf: 0.94
  if:
    type: symbol
    kind: member
    exact: NodeFilter.SHOW_TEXT
- crit: notable
  id: node-text-property-assignment
  desc: Assigns a node text property
  conf: 0.9
  if:
    type: text
    regex: \b(node|textNode|text_node|currentNode)\.(nodeValue|textContent|innerText)\s*=
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- crit: notable
  id: dom-template-text-assignment
  desc: Assigns template literal to node text
  conf: 0.9
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]{0,31}\.textContent\s*=\s*`
- crit: notable
  id: template-queryselector
  desc: Template expression queries DOM element
  conf: 0.85
  count_min: 6
  if:
    type: text
    regex: \$\{[^}]{0,160}querySelector
- crit: notable
  id: template-getattribute
  desc: Template expression reads DOM attributes
  conf: 0.85
  count_min: 2
  if:
    type: text
    regex: \$\{[^}]{0,160}getAttribute
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- crit: notable
  id: template-textcontent
  desc: Template expression reads node text
  conf: 0.85
  count_min: 4
  if:
    type: text
    regex: \$\{[^}]{0,160}textContent
- crit: notable
  id: template-htmlcontent-read
  desc: Template literal reads node HTML
  conf: 0.85
  if:
    type: text
    regex: \$\{[^}]{0,160}(innerHTML|outerHTML)
- crit: baseline
  id: dom-text-content-access
  desc: Accesses DOM textContent or innerHTML
  conf: 0.82
  ref: sha256:3b744d89517c857b4c07fa0068aca8d2b1d688731bfd032bf98c1018bd027e64
  if:
    type: text
    regex: \.(textContent|innerHTML)\b
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
  - id: micro-behaviors/ui/graphics/draw::webgpu-api-source-context
- crit: notable
  id: dom-xpath-evaluate-call
  desc: Evaluates DOM XPath selector
  conf: 0.86
  ref: sha256:3b744d89517c857b4c07fa0068aca8d2b1d688731bfd032bf98c1018bd027e64
  if:
    type: text
    regex: document\.evaluate\s*\([^)]{0,180}XPathResult\.FIRST_ORDERED_NODE_TYPE
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- crit: baseline
  id: dom-element-lookup--getelementbyid
  desc: Looks up a DOM element with getElementById
  conf: 0.9
  if:
    type: text
    word: getElementById
- crit: baseline
  id: dom-element-lookup--queryselector
  desc: Looks up a DOM element with querySelector
  conf: 0.9
  if:
    type: text
    word: querySelector
composite_rules:
- crit: notable
  id: tree-walker-and-text-assignment
  desc: TreeWalker and nearby node text assignment
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/collection/dom::create-tree-walker-call
  - id: micro-behaviors/data/collection/dom::text-node-filter-reference
  - id: micro-behaviors/data/collection/dom::node-text-property-assignment
- crit: notable
  id: template-dom-access-cluster
  desc: Multiple DOM reads inside template expressions
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/data/collection/dom::template-queryselector
  - id: micro-behaviors/data/collection/dom::template-getattribute
  - id: micro-behaviors/data/collection/dom::template-textcontent
  - id: micro-behaviors/data/collection/dom::template-htmlcontent-read
