defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: svg-script-element-create
  desc: SVG script creates a script element
  # Same precision rule as script-element-create above: must create a
  # *script* element. Computed member access (document['createElement'])
  # is the SVG-embedded spelling, so the boundary allows a short gap.
  crit: notable
  conf: 0.8
  for: [svg, html]
  if:
    type: text
    regex: 'createElement.{0,12}["'']script["'']'
- id: script-element-create
  desc: Creates a script element with createElement
  # Must create a *script* element. Bare createElement matches benign UI builders
  # (createElement('div'/'button'/'textarea')); the all-substrings composite then
  # false-fires on any DOM-building code that also mentions "script"/"src".
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: createElement\s*\(\s*['"`]script['"`]
