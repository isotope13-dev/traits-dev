defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: svg-script-element-create
  desc: SVG script creates a script element
  # Same precision rule as script-element-create below: must create a
  # *script* element. Computed member access (document['createElement'])
  # is the SVG-embedded spelling; the plain document.createElement('script')
  # form belongs to script-element-create, which fires alongside this atom
  # on ordinary pages when the boundary stays loose.
  crit: notable
  conf: 0.8
  for: [svg, html]
  if:
    type: text
    regex: '\[\s*["'']createElement["'']\s*\]\s*\(\s*["'']script["'']'
- id: script-element-create
  for: [javascript, typescript, html]
  desc: Creates a script element with createElement
  # Must create a *script* element. Bare createElement matches benign UI builders
  # (createElement('div'/'button'/'textarea')); the all-substrings composite then
  # false-fires on any DOM-building code that also mentions "script"/"src".
  # One block comment may sit between the parenthesis and the tag literal;
  # injectors use it to keep createElement("script") from appearing contiguous.
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: 'createElement\s*\(\s*(/\*[\s\S]{0,160}?\*/\s*)?[''"`]script[''"`]'
