# Walks the page's script collection backwards comparing each element's
# attribute (its id) before injecting: a single-instance guard so a loader
# planted in several site files only inserts its remote script once.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: script-collection-reverse-attribute-guard
    desc: Checks existing scripts before injecting one
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'for\(var \w+=\w+\[[^;]{1,24};\w+--;\)\{if\(\w+\[\w+\]\[[^=]{1,24}=='
