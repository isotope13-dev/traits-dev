# Moved from process/deploy/script-eval::concealed-script-element-load.
# Preserve the full matching population, including hostile uses. The required
# observations need not share a receiver or script block, and the variable tag
# can name an image. Neither activation nor concealment is established.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.88

composite_rules:
  - id: variable-tag-near-concatenated-src
    desc: Variable-tag creation near concatenated src
    near_bytes: 512
    all:
      - id: micro-behaviors/data/collection/dom::variable-tag-createelement
      - id: micro-behaviors/data/property/assign::concatenated-src-assignment
