defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: javascript-identifier-textcontent-assignment
    desc: Assigns an identifier value to textContent
    if:
      type: tree-sitter
      language: javascript
      query: |
        (assignment_expression
          left: (member_expression property: (property_identifier) @property)
          right: (identifier)
          (#eq? @property "textContent")) @assignment
