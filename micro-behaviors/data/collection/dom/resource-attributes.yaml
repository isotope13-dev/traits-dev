# Attribute values may be local paths, fragments, data URLs or network URLs.
# These setters alone establish DOM mutation, not HTTP communication.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, svg, html]
  crit: notable
  conf: 0.92
traits:
  - id: href-attribute-variable-assignment
    desc: Assigns variable to DOM href attribute
    conf: 0.92
    if:
      type: text
      regex: '\.(setAttribute|attr)\(\s*[''"]href[''"]\s*,\s*[A-Za-z_$][\w$]*'
  - id: src-attribute-variable-assignment
    desc: Assigns variable to DOM src attribute
    conf: 0.92
    if:
      type: text
      regex: '\.(setAttribute|attr)\(\s*[''"]src[''"]\s*,\s*[A-Za-z_$][\w$]*'
