traits:
- platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  id: python-password-list-loop
  desc: Loops over a password list
  conf: 0.9
  unless:
  - id: micro-behaviors/os/security/keychain::python-keyring-delete-password
  if:
    type: text
    regex: '(?i)for\s+\w+\s+in\s+\w*(passwords|password_list|password_file|wordlist)\w*\s*:'
