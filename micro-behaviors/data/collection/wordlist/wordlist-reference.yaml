# A custom wordlist generator names its product. PDF parsing plus word-pair
# computation alone also describes document-ingestion tooling (a RAG pre-pass
# validating reading order with word pairs), which emits no wordlist and
# handles no credentials, so the credential-list composite requires this sink
# leg before claiming generator intent.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.8

traits:
  - id: python-wordlist-reference
    desc: References a wordlist product
    if:
      type: text
      regex: '(?i)\bwordlist\b'
