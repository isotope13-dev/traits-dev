defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-password-loop-login-helper
    desc: Password loop submits candidate to login helper
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |-
        ((for_statement
          left: (identifier) @candidate
          body: (block (with_statement body: (block
            (if_statement condition: (await (call
              function: (attribute attribute: (identifier) @method)
              arguments: (argument_list . (_) . (identifier) @submitted .))))))))
          (#match? @candidate "^(pwd|password|passwd)$")
          (#match? @method "^(login|authenticate)$")
          (#eq? @candidate @submitted))
