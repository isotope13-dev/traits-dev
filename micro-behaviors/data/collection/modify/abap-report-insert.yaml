defaults:
  platforms: [sapabap]
  for: [text, data]

traits:
  - id: abap-insert-table-lines-at-index
    desc: ABAP table-line insertion statement text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bINSERT\s+LINES\s+OF\s+[\w-]+[^.\r\n]{0,80}\bINTO\s+[\w-]+\s+INDEX\s+[\w-]+'
