defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - go
  - javascript
  - typescript
  crit: notable
  conf: 0.93

traits:
  - id: javascript-vote-histogram
    desc: JavaScript tallies votes into a histogram
    for: [javascript, typescript]
    conf: 0.9
    if:
      type: text
      regex: '\w+\[\w+(\.\w+){1,2}\]\s*=\s*\(\w+\[\w+(\.\w+){1,2}\]\s*\|\|\s*0\s*\)\s*\+\s*1'

  # The dispatch twin of the Python .get() lookup above: finds the array
  # element whose action field equals the winning vote, then branches to
  # the corresponding pre-implemented handler.
  - id: python-decision-counter
    desc: Python counts structured decisions
    for: [python]
    if:
      type: text
      regex: '\bCounter\s*\([^)]{0,200}\[\s*["''](action|decision)["'']\s*\]'

  - id: python-most-common-one-call
    desc: Calls most_common with limit one
    for: [python]
    conf: 0.96
    if:
      type: text
      regex: '\b\w+\.most_common\s*\(\s*1\s*\)'

  - id: go-decision-vote-increment
    desc: Go increments a structured decision vote
    for: [go]
    if:
      type: text
      regex: '\b\w+\[\s*\w+\.(Action|Decision)\s*\]\+\+'

  - id: go-decision-vote-maximum
    desc: Compares decision-indexed map values
    for: [go]
    if:
      type: text
      regex: '\b\w+\[\s*\w+\.(Action|Decision)\s*\]\s*>\s*\w+\['

  # CLOSEDQUORUM-class implants tally one vote per model and execute the
  # plurality winner. PowerShell has no Counter/most_common idiom; the same
  # shape is Group-Object on the decision field piped into a descending
  # Sort-Object with the top group selected. Neutral mechanic on its own --
  # ordinary polling code groups and ranks -- objective composites add the
  # model endpoints and the offensive action set.

composite_rules:
  - id: python-structured-decision-plurality
    desc: Python selects a decision by plurality
    crit: notable
    conf: 0.96
    for: [python]
    near_lines: 8
    all:
      - id: micro-behaviors/data/collection/frequency::python-decision-counter
      - id: micro-behaviors/data/collection/frequency::python-most-common-one-call

  - id: powershell-group-vote-selection
    desc: Decision grouping near descending sort
    crit: notable
    conf: 0.93
    for: [powershell]
    near_lines: 6
    all:
      - id: micro-behaviors/data/collection/group::powershell-group-decision-field
      - id: micro-behaviors/data/collection/array::powershell-sort-descending

  - id: go-structured-decision-plurality
    desc: Decision counts, increments and comparisons
    crit: notable
    conf: 0.96
    for: [go]
    near_lines: 16
    all:
      - id: micro-behaviors/data/collection/map::go-string-integer-map
      - id: micro-behaviors/data/collection/frequency::go-decision-vote-increment
      - id: micro-behaviors/data/collection/frequency::go-decision-vote-maximum

  - id: javascript-structured-decision-plurality
    desc: JavaScript selects a decision by plurality
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 16
    all:
      - id: micro-behaviors/data/llm/decision::model-decision-vote-increment
      - id: micro-behaviors/data/collection/map::javascript-object-entry-reduction
  - id: structured-decision-plurality
    desc: Selects structured decision by plurality
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/data/collection/frequency::python-structured-decision-plurality
      - id: micro-behaviors/data/collection/frequency::go-structured-decision-plurality
      - id: micro-behaviors/data/collection/frequency::javascript-structured-decision-plurality
