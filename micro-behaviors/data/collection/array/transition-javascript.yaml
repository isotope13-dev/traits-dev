defaults:
  platforms:
  - windows
  - unix
  - android
  crit: notable
traits:
- for:
  - javascript
  - typescript
  - html
  id: js-array-fill-in-sort-callback
  desc: Array fill occurs inside sort callback
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression
          property: (property_identifier) @method)
        arguments: (arguments
          [
            (arrow_function) @callback
            (function_expression) @callback
          ]))
        (#eq? @method "sort")
        (#match? @callback "\\.fill\\s*\\("))
- for:
  - javascript
  - typescript
  - html
  id: js-array-fill-inside-sort-comparator
  desc: Fill call inside sort callback syntax
  conf: 0.96
  if:
    type: text
    regex: \.sort\(\s*(function)?[^)]{0,40}\)?\s*(=>)?\s*\{[\s\S]{0,180}\.fill\(
composite_rules:
- for:
  - javascript
  id: js-array-sort-fill-proximity
  desc: Array sort occurs near array fill
  conf: 0.96
  near_bytes: 500
  all:
  - id: micro-behaviors/data/collection/array::sort-method-call
  - id: micro-behaviors/data/collection/array::fill-method-call
