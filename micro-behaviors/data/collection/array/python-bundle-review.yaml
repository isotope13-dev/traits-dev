# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: joined-hex-octet-list
  desc: Join expression contains hexadecimal octet list
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \.join\([^\n]{0,80}0x[0-9a-fA-F]{1,2},\s*0x[0-9a-fA-F]{1,2},\s*0x
