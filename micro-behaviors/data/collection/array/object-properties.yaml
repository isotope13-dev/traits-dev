defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: object-property-integer-arrays
    desc: Object properties hold multiple integer arrays
    crit: notable
    conf: 0.85
    count_min: 2
    if:
      type: text
      regex: '[{,\n][ \t]{0,8}_?\w{1,16}\s*:\s*\[\s*\d{1,3}(\s*,\s*\d{1,3}){5,63}\s*\]'
