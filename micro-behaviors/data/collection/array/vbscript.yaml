defaults:
  platforms: [windows]
  for: [html, makefile, vbs]
  conf: 0.98
traits:
- id: vbs-redim-preserve-reference
  desc: ReDim Preserve array syntax reference
  crit: notable
  if:
    type: text
    regex: (?i)\bredim\s+preserve\b
  # A literal array of DOS/Windows system filenames (COMMAND.COM, WIN.INI,
  # ...) is a wipe-target or drop-target list, not program data. Benign
  # scripts enumerate such files; they do not hardcode them in an Array().
- conf: 0.9
  id: vbs-system-filename-array
  desc: Array holds Windows system filenames
  crit: notable
  if:
    type: text
    regex: '(?i)\bArray\s*\(\s*"[A-Za-z]:\\[^)]{0,120}\.(com|exe|ini|sys|dll)\b'
  # A numeric Array() of four or more entries is a character-code table: the
  # script rebuilds a command string with Chr() arithmetic at runtime so the
  # command text never appears literally. Short numeric arrays are ordinary
  # program data; the four-entry floor matches command-length tables.
- conf: 0.9
  id: vbs-numeric-charcode-array
  desc: Array holds numeric character codes
  crit: notable
  if:
    type: text
    regex: '(?i)\bArray\s*\(\s*-?\d[\d\s+\-]{0,12}(\s*,\s*-?\d[\d\s+\-]{0,12}\s*){3,12}\)'
