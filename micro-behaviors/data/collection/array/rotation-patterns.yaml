defaults:
  platforms: [windows, unix]
  for: [javascript, shell]
traits:
  - id: micro-behaviors/data/collection/array::push-shift-pattern
    desc: _0x push/shift self-rotation pattern
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: _0x[a-fA-F0-9]{3,}\.push\(\s*_0x[a-fA-F0-9]{3,}\.shift\(\)\s*\)
  - id: micro-behaviors/data/collection/array::shift-push-pattern
    desc: _0x unshift/pop self-rotation pattern
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: _0x[a-fA-F0-9]{3,}\.unshift\(\s*_0x[a-fA-F0-9]{3,}\.pop\(\)\s*\)
  - id: micro-behaviors/data/collection/array::array-shuffle-algorithm
    desc: Array shuffle algorithm in infinite loop
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: while\(!!\[\]\).*?try.*?parseInt.*?\.push.*?\.shift
composite_rules:
  - id: micro-behaviors/data/collection/array::for-try-parseint-array-rotate
    for:
      - javascript
    desc: for(;;) try parseInt array rotate
    crit: notable
    conf: 0.92
    near_bytes: 2048
    all:
      - id: metadata/lang/source/syntax/control-flow::for-empty-cond-try
      - id: metadata/lang/source/syntax/control-flow::try-if-parseint
      - id: micro-behaviors/data/collection/array::js-dot-push-shift-call-text
  - id: micro-behaviors/data/collection/array::string-array-rotation
    desc: JavaScript array rotation patterns
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/collection/array::push-shift-pattern
      - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
      - id: micro-behaviors/data/collection/array::shift-push-pattern
      - id: micro-behaviors/data/collection/array::array-shuffle-algorithm
      - id: micro-behaviors/data/collection/array::for-try-parseint-array-rotate
  - id: micro-behaviors/data/collection/array::advanced-array-shuffling
    desc: Array rotation and constant-style loop conditions
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/control-flow::constant-style-loop-conditions
    any:
      - id: micro-behaviors/data/collection/array::string-array-rotation
      - id: micro-behaviors/data/collection/array::js-same-receiver-push-shift
