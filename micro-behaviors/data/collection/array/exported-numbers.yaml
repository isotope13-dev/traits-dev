defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: exported-integer-array-cooccurrence
    desc: Integer arrays near module exports
    crit: notable
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/collection/array::object-property-integer-arrays
      - id: metadata/lang/javascript-features::module-exports-object
    unless:
      - id: well-known/lib/crypto/defillama-adapters/
      - id: well-known/lib/media/pngjs/

