defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  # Indexed lookup and concat also assemble ordinary lists of functions.
  # Encoding and execution context belong to the consuming objective rule.
  - id: js-nested-index-concat
    desc: Concat syntax with nested indexed argument
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\.concat\s*\(\s*\w+\s*\[\s*\w+\s*\[\s*\w+\s*\]\s*\]\s*\)'
