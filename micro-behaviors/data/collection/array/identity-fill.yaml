defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
traits:
  - id: js-256-entry-array-fill
    desc: JavaScript loop fills a 256-entry array
    crit: notable
    conf: 0.85
    if:
      type: text
      # `0x100` as well as `256`: obfuscator string-array encoders emit every
      # numeric literal in hexadecimal, so a decimal-only bound missed the RC4
      # decoder in each of their builds.
      regex: '(?s)for\s*\(\s*\w[^;]{0,40};\s*\w+\s*<\s*(256|0x100);.{0,30}\)\s*\{?\s*\w+\[\w+\]\s*=\s*\w'

