defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: shortcut-form-values-build-record
    desc: Appends shortcut name and URL record
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'shortcut_data\.push\(\{\s*name\s*:\s*link_name\s*,\s*url\s*:\s*link_url'
