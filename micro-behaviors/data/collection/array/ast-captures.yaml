traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: js-nested-array-pairs
  desc: Repeated nested-array pair patterns
  crit: notable
  conf: 0.8
  size_max: 128000
  count_min: 3
  # One match per array that opens with two array elements.
  if:
    type: text
    regex: '\[\s*\[[^\[\]]{0,120}\]\s*,\s*\['
