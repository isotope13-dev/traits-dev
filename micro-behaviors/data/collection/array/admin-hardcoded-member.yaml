defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.97
traits:
  - id: hardcoded-admin-id-insert-if-absent
    desc: Adds fixed ID to admin list
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((if_statement
          condition: (parenthesized_expression (unary_expression operator: "!"
            argument: (call_expression
              function: (member_expression object: (member_expression object: (this)
                property: (property_identifier) @checked_list) property: (property_identifier) @includes)
              arguments: (arguments . (string (string_fragment) @checked_id) .))))
          consequence: (statement_block (expression_statement (call_expression
            function: (member_expression object: (member_expression object: (this)
              property: (property_identifier) @appended_list) property: (property_identifier) @push)
            arguments: (arguments . (string (string_fragment) @appended_id) .)))))
          (#eq? @checked_list "adminIds")
          (#eq? @checked_list @appended_list)
          (#eq? @checked_id @appended_id)
          (#match? @checked_id "^[0-9]{16,20}$")
          (#eq? @includes "includes")
          (#eq? @push "push"))
