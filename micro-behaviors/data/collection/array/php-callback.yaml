defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-array-transform-api
    desc: Calls PHP array transformation API
    # Map/filter/walk/reduce are routine collection plumbing, not purpose.
    crit: baseline
    if:
      type: symbol
      kind: call
      regex: '(?i)^array_(map|filter|reduce|walk(_recursive)?)$'
  - id: php-array-callback-difference-api
    desc: Computes PHP array differences with callbacks
    if:
      type: symbol
      kind: call
      regex: '(?i)^array_(diff_u(assoc|key)|udiff(_u?assoc)?)$'
  - id: php-array-callback-intersection-api
    desc: Computes PHP array intersections with callbacks
    if:
      type: symbol
      kind: call
      regex: '(?i)^array_(intersect_u(assoc|key)|uintersect(_u?assoc)?)$'
  - id: php-array-callback-sort-api
    desc: Sorts PHP arrays using a comparison callback
    if:
      type: symbol
      kind: call
      regex: '(?i)^u[ak]?sort$'
  - id: php-array-callback-dynamic-callable
    desc: Dynamic callable in PHP array callback
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        [((function_call_expression
            function: [(name) @api_first (qualified_name (name) @api_first)]
            arguments: (arguments .
              (argument
                [(variable_name)
                 (subscript_expression)
                 (binary_expression)
                 (parenthesized_expression)
                 (function_call_expression)]))) @call
            (#match? @api_first "(?i)^array_map$"))
         ((function_call_expression
            function: [(name) @api_second (qualified_name (name) @api_second)]
            arguments: (arguments . (argument) .
              (argument
                [(variable_name)
                 (subscript_expression)
                 (binary_expression)
                 (parenthesized_expression)
                 (function_call_expression)]))) @call
            (#match? @api_second "(?i)^(u[ak]?sort|array_(filter|walk(_recursive)?|reduce))$"))
         ((function_call_expression
            function: [(name) @api_last (qualified_name (name) @api_last)]
            arguments: (arguments
              (argument
                [(variable_name)
                 (subscript_expression)
                 (binary_expression)
                 (parenthesized_expression)
                 (function_call_expression)]) .)) @call
            (#match? @api_last "(?i)^array_(intersect_u(assoc|key)|uintersect(_u?assoc)?|diff_u(assoc|key)|udiff(_u?assoc)?)$"))]
