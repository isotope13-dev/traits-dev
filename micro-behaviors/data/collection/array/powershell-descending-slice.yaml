defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-descending-index-slice
    desc: PowerShell reads array elements in reverse
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: powershell
      query: |
        ((element_access (_) (logical_expression) @index) @slice
          (#match? @index "(?i)^\\(\\s*\\$[A-Za-z_][A-Za-z0-9_]*\\.Length\\s*-\\s*1\\s*\\)\\s*\\.\\.\\s*0$"))
