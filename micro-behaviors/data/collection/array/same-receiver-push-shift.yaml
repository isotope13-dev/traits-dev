defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-same-receiver-push-shift
    desc: Push and shift share a receiver
    crit: notable
    conf: 0.99
    if:
      # Call facts retain both method names, but not this receiver equality.
      type: tree-sitter
      query: |
        ((call_expression
          function: [
            (member_expression object: (identifier) @outer
              property: (property_identifier) @push)
            (subscript_expression object: (identifier) @outer
              index: (string) @push)]
          arguments: (arguments
            (call_expression
              function: [
                (member_expression object: (identifier) @inner
                  property: (property_identifier) @shift)
                (subscript_expression object: (identifier) @inner
                  index: (string) @shift)]
              arguments: (arguments) @shift_args))) @evidence
          (#eq? @outer @inner)
          (#match? @push "^(push|['\"]push['\"])$")
          (#match? @shift_args "^\\([ \\t\\r\\n]*\\)$")
          (#match? @shift "^(shift|['\"]shift['\"])$"))
