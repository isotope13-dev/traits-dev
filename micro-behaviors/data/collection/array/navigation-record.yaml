defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: navigation-host-staged-with-transform
    desc: Stages navigation host with transformed copy
    if:
      type: tree-sitter
      query: |
        ((arrow_function body: (statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @host
            value: (member_expression
              object: (new_expression constructor: (identifier) @url
                arguments: (arguments (member_expression) @input))
              property: (property_identifier) @hostname)))
          (expression_statement (await_expression
            (call_expression function: (member_expression) @store
              arguments: (arguments (object
                (shorthand_property_identifier) @stored
                (pair value: (await_expression
                  (call_expression arguments: (arguments (identifier) @transformed))))))))))) @record
          (#eq? @url "URL")
          (#match? @input "\\.url$")
          (#eq? @hostname "hostname")
          (#match? @store "\\.(put|add|set)$")
          (#eq? @host @stored)
          (#eq? @host @transformed))
