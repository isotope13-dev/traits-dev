defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9
traits:
  - id: js-array-from-identifier-map
    desc: Maps a variable copied with Array.from
    if:
      type: text
      regex: '\bArray\.from\s*\(\s*[\w$]+\s*\)\s*\.\s*(flatMap|map)\b'

  - id: js-mapped-values-dot-join
    desc: Joins mapped array values with dots
    if:
      type: text
      regex: '(flatMap|Array\.from|map)[^;\n]{0,30}\.join\s*\(\s*["'']\.["'']\s*\)'

  # An `adminIds` list is the calling bot's own privilege roster -- WhatsApp
  # group admins, a Telegram channel's operators, or a Discord guild's staff.
  # The matcher names only the list operation; which platform the IDs belong
  # to comes from the consumer's context legs, never from this variable name.
  - id: admin-id-list-append
    desc: Appends entry to admin ID list
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\badminIds\s*\.\s*push\s*\('
  - id: admin-id-list-membership
    desc: Checks admin ID list membership
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\badminIds\s*\.\s*includes\s*\('
