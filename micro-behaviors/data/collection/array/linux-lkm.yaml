defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
- id: keys-array-declaration
  desc: "Arrays named keys or keysShift"
  crit: component
  conf: 0.93
  if:
    type: text
    regex: 'keys(Shift)?\[\]'
  unless:
    - id: well-known/app/media/obs-studio
    - id: well-known/lib/crypto/openssl/
    - id: well-known/lib/ai/ggml
    - id: well-known/lib/native/hpc
    - id: well-known/lib/runtime/scripted/php-runtime::source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
    - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
    - id: well-known/dual-use/tunnel/openvpn::openvpn-source-tree
    - type: text
      substr: uct_rkeys
