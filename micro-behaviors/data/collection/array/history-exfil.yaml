# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: js-empty-allowlist-array
    desc: "Declares an empty allowlist array"
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b(allow|white)[Ll]ist\s*=\s*\[\s*\]'
  - id: js-allowlist-index-miss
    desc: "Tests allowlist index lookup failure"
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(allow|white)[Ll]ist\.indexOf\([^)]{0,40}\)\s*===?\s*-\s*1'
composite_rules:
  - id: empty-allowlist-with-browser-network-interfaces
    desc: Empty allowlist beside navigation and HTTP interfaces
    crit: notable
    conf: 0.92
    all:
      - id: empty-allowlist-index-miss
      - id: micro-behaviors/browser-extension/tabs::extension-navigation-observation-interfaces
      - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel

  - id: empty-allowlist-index-miss
    desc: "Empty allowlist and failed index lookup"
    crit: notable
    conf: 0.9
    attack: T1480
    all:
      - id: micro-behaviors/data/collection/array::js-empty-allowlist-array
      - id: micro-behaviors/data/collection/array::js-allowlist-index-miss
