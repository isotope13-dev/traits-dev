# Text establishes call syntax, not the identity of both receivers.
# Preserve the existing spelling-specific consumer cohort during relocation.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - shell
    - html
  crit: notable
  conf: 0.9
traits:
  - id: js-bracket-push-shift-call-text
    desc: Nested bracket push/shift call text
    if:
      type: text
      exclude_html_comments: true
      regex: \w+\[['"]push['"]\]\(\s*\w+\[['"]shift['"]\]\(\)\s*\)
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: well-known/tool/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
      - id: well-known/tool/development/vscode-extension/recomment::webpack-obfuscator-dep
      - id: well-known/tool/development/vscode-extension/recomment::recomment-extension-context
      - id: well-known/tool/development/vscode-extension/recomment::recomment-command-id
    downgrade:
      any:
        - id: metadata/build/minifier::js-large-minified-bundle
  - id: javascript-bracket-array-rotation
    desc: Rotates array through bracket method calls
    if:
      type: text
      exclude_html_comments: true
      regex: '\[["'']push["'']\]\([^\r\n]{0,80}\[["'']shift["'']\]\('
