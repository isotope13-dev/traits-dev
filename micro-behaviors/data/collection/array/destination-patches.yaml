traits:
  - id: computed-destination-patches
    desc: Patches array slots before computed destinations
    for: [c, cpp, rust, go]
    platforms: [linux, macos, windows]
    crit: notable
    conf: 0.85
    count_min: 8
    if:
      type: text
      regex: '\b\w+\s*\[\s*[a-zA-Z_]\w*\s*\+\s*[a-zA-Z_]\w*\s*-\s*[1-3]\s*\]\s*=\s*\w+\s*;'
