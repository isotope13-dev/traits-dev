# Spray-scale array-length rechecks. Rechecking `.length` against a
# megabyte-scale hexadecimal constant (six or more hex digits) is the
# corruption-probe half of a heap-spray exploit: after triggering the bug,
# the exploit re-reads a sprayed array's length to see whether it changed.
# Ordinary size validations use small constants (a font CMap guard such as
# `length !== 0x10000` does not reach this threshold), so this observation is
# analyst-relevant on its own; exploit intent is established only when the
# heap-spray composite pairs it with large-array spraying.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: js-spray-scale-length-recheck
    desc: Rechecks array length at spray scale
    if:
      type: text
      regex: '\.length\s*[!=]==?\s*0x[0-9a-fA-F]{6,}'
