defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.88

traits:
  - id: index-increment-near-sequence-length
    desc: Increments index near sequence length query
    # Generic `seq[(seq.index(x) + 1) % len(seq)]` modular-index step — neutral on
    # its own (UI option-cyclers, round-robin selectors). A component building
    # block: the cipher verdict comes from the unicode-offset-alphabet-decoder
    # composite, which also requires the unicode codepoint-offset decoder AND the
    # lowercase alphabet table.
    if:
      type: text
      regex: \.index\([^)]{1,60}\)\s*\+\s*1.{0,120}\blen\(
    not:
      - substr: ".index(self"

