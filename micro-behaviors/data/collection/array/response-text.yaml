defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-response-text-slice-push
    desc: Pushes sliced response text into an array
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @collector
            property: (property_identifier) @push)
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (member_expression
                  object: (identifier) @response
                  property: (property_identifier) @text)
                property: (property_identifier) @slice)))
          (#eq? @push "push")
          (#eq? @text "text")
          (#eq? @slice "slice"))
