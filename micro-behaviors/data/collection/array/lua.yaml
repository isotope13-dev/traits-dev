defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]
traits:
  - id: lua-last-element-helper
    desc: Lua helper reads the last table element
    crit: notable
    conf: 0.9
    if:
      type: text
      # `function(E)local H,v=E[#E]` -- the one-letter helper that reads the
      # string table from the argument's last slot before permuting it.
      regex: 'function\([A-Za-z]\)local [A-Za-z],[A-Za-z]=[A-Za-z]\[#'

