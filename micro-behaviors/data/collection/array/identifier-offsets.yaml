# Array expressions alone establish no encoding or concealment.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: identifier-offset-array
    desc: Array of identifier-plus-offset expressions
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\[\s*([A-Za-z]\w*\s*[-+]\s*\d+\s*,\s*){2,}[A-Za-z]\w*\s*[-+]\s*\d+\s*\]'
