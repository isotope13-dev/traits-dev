defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-negative-integer-array
    desc: PowerShell constructs a negative integer array
    if:
      type: text
      # @() is PowerShell's array-subexpression construction operation.
      # The offset key can be small; magnitude does not establish concealment.
      # Intent remains in consumers that require decoding and dynamic code.
      regex: '@\(\s*-\d{1,12}(\s*,\s*-\d{1,12}){16,}'
