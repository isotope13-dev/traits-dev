traits:
  - id: js-assign-reversed-array
    desc: Assigns the result of .reverse()
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\w+\s*=\s*\w+\.reverse\(\)'
    not:
      - substr: "Lodash <https://lodash.com/>"
    unless:
      - type: basename
        regex: '(^|!!).{0,200}lodash\.min\.js$'
