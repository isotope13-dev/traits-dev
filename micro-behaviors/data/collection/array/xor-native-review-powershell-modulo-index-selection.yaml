defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-modulo-index-selection
    desc: PowerShell modulo-indexed selection
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\w+\s*=\s*\$\w+\[\s*\$\w+\s*%\s*\$\w+\.Length\s*\]'

  # ErrTraffic's PowerShell stage XORs each converted character with a scalar
  # key. Keep the cast sequence atomic and compose it with hex conversion
  # below so unrelated XOR and conversion calls remain separate.
