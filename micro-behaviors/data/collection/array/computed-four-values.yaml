defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]

traits:
- id: four-value-array-with-identifier
  desc: Four-value array starts with integer
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\[\d{1,3},\s*[A-Za-z_$][^,\]\n]{1,24},[^,\]\n]{1,24},[^\]\n]{1,24}\]'
