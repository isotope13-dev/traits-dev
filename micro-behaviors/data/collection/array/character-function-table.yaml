defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: js-character-conversion-function-table
    desc: Character/number conversion function array
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '\[\s*String\.fromCharCode\s*,\s*isNaN\s*,\s*parseInt\s*,\s*String\s*\]'
