defaults:
  platforms: [windows]
  for: [javascript]
traits:
  # This can accumulate strings or add numeric offsets in an LZ4 codec.
  # Reconstruction intent requires the consuming obfuscation composites.
  - id: js-do-loop-indexed-addition
    desc: Do-loop adds an indexed element
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'do\s*\{[\s\S]{0,96}\w+\s*=\s*\w+\s*\+\s*\w+\[\w+\];'
