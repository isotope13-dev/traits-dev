defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.92

traits:
  - id: country-list-membership-call
    desc: JavaScript checks country list membership
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*Countries\s*\.\s*(includes|indexOf)\s*\(\s*'
    not:
      - regex: '(?i)\b[A-Za-z_$][\w$]*Countries\s*\.\s*(includes|indexOf)\s*\(\s*country\.iso2\b'

  - id: country-code-membership-argument
    desc: Checks country-code membership
    for: [javascript, typescript, html]
    if:
      type: text
      # Keep the country token inside the membership argument. A bounded
      # forward search can confuse an unrelated later object property with
      # the value actually being tested.
      regex: '(?i)\b(includes|indexOf)\s*\(\s*([A-Za-z_$][\w$]*\s*\.\s*)?country[_-]?code\b'

  # Indexed string-table method names and values obscure this negative
  # membership check; the consuming cloaking rule resolves the token and
  # supplies the browser-routing context.
  - id: negative-indexof-token-check
    desc: Indexed membership result compared with -1
    crit: component
    for: [javascript, html]
    if:
      type: text
      regex: '_[\w$]+\[_0x\w+\[\d+\]\]\s*\(_0x\w+\[\d+\]\)\s*==\s*-1'

  # Remote blocklists gate execution on infrastructure the operator controls:
  # fetched arrays of blocked IPs or hostnames tested with includes/indexOf.
  # Renames keep the blocked/blocklist/deny-list sense, so match the role
  # word rather than the specimen's exact variable names.
  - id: blocked-list-membership-call
    desc: JavaScript checks blocked-list membership
    if:
      type: text
      regex: '(?i)[\w$]*(blocked|blocklist|denylist|blacklist)\w*\.(includes|indexOf|has)\s*\('
