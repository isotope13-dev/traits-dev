---
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- id: remote-membership-host-query-context
  desc: Fetched text, membership and host-query context
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/client/response-body::requests-text-allowed-list-fetch
  - id: micro-behaviors/data/collection/membership::in-membership-check
  any:
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/os/sysinfo/profile::python-platform-query-combination
  unless:
  - id: metadata/path/directory::test-directory-component
