# Workspace email-address export is a user-facing extension feature. Scanning
# files and copying found addresses is useful capability context; these facts
# alone do not establish mailbox access or collection outside the workspace.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1115

composite_rules:
  - id: vscode-workspace-email-to-clipboard
    desc: VS Code extension scans workspace files and copies email addresses
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: well-known/lib/development/vscode::workspace-folders
      - id: micro-behaviors/fs/file/open::vscode-open-text-document
      - id: metadata/permission/workspace::workspace-findFiles
      - id: metadata/permission/clipboard::clipboard-write
      - id: micro-behaviors/os/clipboard/write::email-list-clipboard-write
    any:
      - id: micro-behaviors/communications/email/address::email-address-text
      - id: micro-behaviors/communications/email/address::email-regex-structure
