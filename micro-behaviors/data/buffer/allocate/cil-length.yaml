defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-input-length-plus-one-array
    desc: CIL allocates input length plus one
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '(02|03|04) 8E 69 17 (58|D6) 8D ?? ?? ?? 01'
  - id: cil-smaller-array-helper-cast
    desc: CIL smaller-array allocation and helper cast
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      # input length - 2 + 1 becomes the new array's length.
      pattern: '09 03 8E 69 18 DA 17 D6 8D ?? ?? ?? 01 28 ?? ?? ?? 0A 74 ?? ?? ?? 1B'
