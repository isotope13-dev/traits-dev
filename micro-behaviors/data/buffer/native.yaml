defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, elf, macho, pe]

traits:
  - id: c-command-buffer
    desc: C declares a character or byte buffer
    crit: component
    conf: 0.8
    for: [c, cpp]
    if:
      type: text
      regex: '\b(char|unsigned\s+char)\s+[A-Za-z_][A-Za-z0-9_]*\s*\['

  - id: memcmp-byte-comparison
    desc: Compares byte buffers with memcmp
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: memcmp

  - id: native-memcpy-byte-copy
    desc: Copies bytes with native memcpy
    crit: notable
    conf: 0.85
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: memcpy

  - id: fixed-sixteen-byte-array
    desc: Declares a fixed sixteen-byte array
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]'

  # A 32-byte / 12-byte byte array is the storage shape of a 256-bit symmetric
  # key and a 96-bit AEAD nonce/IV (AES-GCM, ChaCha20-Poly1305, etc.). The
  # matcher only sees the declaration, so these are neutral buffer-declaration
  # capabilities — the crypto/objective composites decide intent by pairing
  # them with cipher calls or a C2 channel. (Moved here from the ChaCha20
  # stream file, where the name over-claimed the algorithm the regex cannot see.)
  - id: fixed-thirtytwo-byte-array
    desc: Declares a fixed thirty-two-byte array
    crit: notable
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*32\s*\]'

  - id: fixed-twelve-byte-array
    desc: Declares a fixed twelve-byte array
    crit: notable
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*12\s*\]'

  - id: typed-byte-type-field
    desc: 8-bit type field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint8_t|BYTE)\s+\w*type\s*;'
      case_insensitive: true

  - id: typed-uint32-connection-field
    desc: 32-bit connection ID field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint32_t|DWORD)\s+(conn_?id|connection_?id)\s*;'
      case_insensitive: true

  - id: typed-byte-flags-field
    desc: 8-bit flags field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint8_t|BYTE)\s+\w*flags\s*;'
      case_insensitive: true

  - id: typed-uint16-length-field
    desc: 16-bit length field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint16_t|WORD)\s+\w*(data_?len|length)\s*;'
      case_insensitive: true

  - id: member-type-switch
    desc: Switches on a member named type
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\bswitch\s*\(\s*\w{1,32}\.type\s*\)'

  - id: member-type-switch-case-one
    desc: Handles case 1 under a member-type switch
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bswitch\s*\(\s*\w{1,32}\.type\s*\).{0,512}\bcase\s+1\s*:'

  - id: member-type-switch-case-three
    desc: Handles case 3 under a member-type switch
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bswitch\s*\(\s*\w{1,32}\.type\s*\).{0,512}\bcase\s+3\s*:'

  - id: member-type-switch-case-five
    desc: Handles case 5 under a member-type switch
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bswitch\s*\(\s*\w{1,32}\.type\s*\).{0,512}\bcase\s+5\s*:'

composite_rules:
  - id: native-fixed-frame-field-set
    desc: Nearby typed fields describing a binary record
    crit: notable
    conf: 0.94
    for: [c, cpp]
    all:
      - id: typed-byte-type-field
      - id: typed-uint32-connection-field
      - id: typed-byte-flags-field
      - id: typed-uint16-length-field
    near_lines: 12

  - id: native-member-type-dispatch
    desc: Member-type switch with three numeric cases
    crit: notable
    conf: 0.92
    for: [c, cpp]
    all:
      - id: member-type-switch-case-one
      - id: member-type-switch-case-three
      - id: member-type-switch-case-five
    near_lines: 20

  - id: native-fixed-binary-record-dispatch
    desc: Typed binary record fields with numeric dispatch
    crit: notable
    conf: 0.94
    for: [c, cpp]
    all:
      - id: native-fixed-frame-field-set
      - id: native-member-type-dispatch
