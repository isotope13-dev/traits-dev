defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, elf, macho, pe]

traits:
  - id: c-command-buffer
    desc: C declares a character or byte buffer
    crit: component
    conf: 0.8
    for: [c, cpp]
    if:
      type: text
      regex: '\b(char|unsigned\s+char)\s+[A-Za-z_][A-Za-z0-9_]*\s*\['

  - id: memcmp-byte-comparison
    desc: Compares byte buffers with memcmp
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: memcmp

  # Short prefix comparisons are common in parsers and protocol dispatchers.
  # This atom describes only the buffer operation; intent-specific composites
  # add any command-dispatch evidence.
  - id: short-prefix-comparison
    desc: Compares a one-to-four-byte input prefix
    crit: notable
    conf: 0.82
    for: [c, cpp]
    if:
      type: text
      regex: '\b(memcmp|strncmp)\s*\(\s*\w+\s*,\s*\w+\s*,\s*[1-4]\s*\)'

  - id: native-memcpy-byte-copy
    desc: Copies bytes with native memcpy
    crit: notable
    conf: 0.85
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: memcpy

  - id: x86-call-result-fill-sixteen-byte-loop
    desc: Repeated calls fill a 16-byte buffer
    crit: component
    conf: 0.94
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      # call producer; store AL at base+index-1; repeat for indices 1..16.
      # Section-independent so the same routine is visible in fake-UPX and
      # conventionally linked variants.
      pattern: 'E8 ?? ?? ?? ?? 88 44 ?? FF 46 83 FE 11 75 ??'
      offset_range: [0, null]

  - id: fixed-sixteen-byte-array
    desc: Declares a fixed sixteen-byte array
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]'

  # A 32-byte byte array is one possible storage shape for a 256-bit symmetric
  # key. The matcher only sees the declaration, so this is a neutral,
  # incomplete buffer fragment — crypto/objective composites decide intent by
  # pairing it with cipher calls or a C2 channel. (Moved here from the ChaCha20
  # stream file, where the name over-claimed the algorithm the regex cannot see.)
  - id: fixed-thirtytwo-byte-array
    desc: Declares a fixed thirty-two-byte array
    crit: component
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*32\s*\]'

  # 39 bytes is the record size of a router-implant registration frame
  # (33-byte class + 6-byte MAC). The declaration alone proves nothing —
  # ryu's digit-adjustment table and FreeBSD's mc_frame[39] are the same
  # shape — so the length lives here as a neutral buffer declaration and
  # communications/socket/framing/ composites supply the framing evidence.
  # (Moved here from that file, where the names claimed a "registration".)
  - id: fixed-thirtynine-byte-array
    desc: Declares a fixed thirty-nine-byte array
    crit: notable
    conf: 0.86
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*39\s*\]'

  # `buf[i] = (hi << 4) | lo` is the universal two-nibbles-into-a-byte pack.
  # Linux's HDMI-CEC helpers (`msg[5] = (input_port << 4) | hpd_state`) and any
  # BCD/hex codec write it. The custom-alphabet Base16 composite in
  # objectives/anti-static/obfuscation/encoding/hex/ references it and adds the
  # offset-alphabet nibble decodes that make it an obfuscation decoder.
  - id: nibble-pack-byte-assignment
    desc: Packs two nibbles into a byte
    crit: baseline
    conf: 0.9
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\w+\[\w+\]\s*=\s*\(\w+\s*<<\s*4\)\s*\|\s*\w+'

  - id: rust-thirtynine-byte-array
    desc: Rust array initialized with thirty-nine bytes
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '\[\s*0u8\s*;\s*39\s*\]'

  - id: go-thirtynine-byte-array
    desc: Declares a thirty-nine-byte Go array
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\b(var\s+\w+\s+\[\s*39\s*\]byte|\w+\s*:=\s*\[\s*39\s*\]byte\s*\{)'

  - id: typed-byte-type-field
    desc: 8-bit type field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint8_t|BYTE)\s+\w*type\s*;'
      case_insensitive: true

  - id: typed-uint32-connection-field
    desc: 32-bit connection ID field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint32_t|DWORD)\s+(conn_?id|connection_?id)\s*;'
      case_insensitive: true

  - id: typed-byte-flags-field
    desc: 8-bit flags field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint8_t|BYTE)\s+\w*flags\s*;'
      case_insensitive: true

  - id: typed-uint16-length-field
    desc: 16-bit length field declaration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?im)^\s*(uint16_t|WORD)\s+\w*(data_?len|length)\s*;'
      case_insensitive: true

  - id: member-type-switch
    desc: Switches on a member named type
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\bswitch\s*\(\s*\w{1,32}\.type\s*\)'

  - id: member-type-switch-case-one
    desc: Handles case 1 under a member-type switch
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bswitch\s*\(\s*\w{1,32}\.type\s*\).{0,512}\bcase\s+1\s*:'

  - id: member-type-switch-case-three
    desc: Handles case 3 under a member-type switch
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bswitch\s*\(\s*\w{1,32}\.type\s*\).{0,512}\bcase\s+3\s*:'

  - id: member-type-switch-case-five
    desc: Handles case 5 under a member-type switch
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bswitch\s*\(\s*\w{1,32}\.type\s*\).{0,512}\bcase\s+5\s*:'

composite_rules:
  - id: native-fixed-frame-field-set
    desc: Nearby typed fields describing a binary record
    crit: notable
    conf: 0.94
    for: [c, cpp]
    all:
      - id: typed-byte-type-field
      - id: typed-uint32-connection-field
      - id: typed-byte-flags-field
      - id: typed-uint16-length-field
    near_lines: 12

  - id: native-member-type-dispatch
    desc: Member-type switch with three numeric cases
    crit: notable
    conf: 0.92
    for: [c, cpp]
    all:
      - id: member-type-switch-case-one
      - id: member-type-switch-case-three
      - id: member-type-switch-case-five
    near_lines: 20

  - id: native-fixed-binary-record-dispatch
    desc: Typed binary record fields with numeric dispatch
    crit: notable
    conf: 0.94
    for: [c, cpp]
    all:
      - id: native-fixed-frame-field-set
      - id: native-member-type-dispatch
