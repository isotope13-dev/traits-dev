defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe, wasm]
  crit: baseline
traits:
  - id: go-io-copy
    desc: Copies data with Go io.Copy
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: io.Copy

  - id: go-seek-call
    desc: Go calls a Seek method
    crit: notable
    conf: 0.88
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.Seek$'

  - id: go-byte-slice-from-string
    desc: Converts a Go string literal to bytes
    crit: baseline
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\[\]byte\(\s*"[^"]{16,32}"\s*\)'
