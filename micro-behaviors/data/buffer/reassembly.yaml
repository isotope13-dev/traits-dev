defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: buffer-identifier
    desc: Node Buffer identifier reference
    crit: component
    conf: 0.3
    if:
      type: string_literal
      substr: Buffer
  - id: array-index-i
    desc: Array index i access
    crit: component
    conf: 0.7
    if:
      type: text
      substr: '[i]'
  - id: offset-write
    desc: Writing data to buffer at calculated offset
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '\[[a-zA-Z0-9_]+\s*\+\s*[a-zA-Z0-9_]+\]\s*=\s*[^"''\s]'
  - id: buffer-alloc-large
    desc: Allocating a large buffer (64KB+)
    crit: notable
    conf: 0.6
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: 'Buffer\.alloc\(0xffff\)|Buffer\.alloc\(65535\)'
  # The read side of a 32-bit length prefix. Binary framing on top of a byte
  # stream reads the length before the body; Chromium's native-messaging wire
  # format is exactly this shape.
  - id: buffer-uint32-length-read
    desc: Reads a 32-bit integer from a Buffer
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\.readUInt32(LE|BE)\s*\('
  - id: node-buffer-uint32le-writes
    desc: Multiple Node Buffer UInt32LE writes
    crit: baseline
    conf: 0.78
    count_min: 4
    if:
      type: text
      regex: '\.writeUInt32LE\s*\('
  - id: module-exports-buffer-storage
    desc: Module exports Buffer-backed storage
    # Protocol libraries routinely export small constant buffers (for example
    # heartbeat/frame markers).  The exported-buffer mechanic is notable, but
    # is not suspicious without payload-reassembly evidence in its objective
    # composites.
    crit: notable
    conf: 0.8
    # `module.exports.<prop> = ... Buffer.alloc|from(...)` — persisting a buffer
    # on the module exports (covers both the direct and `x + Buffer.alloc()`
    # binary-expression forms). The `module.exports.` prefix anchors it.
    if:
      type: text
      regex: 'module\.exports\.\w+\s*=[^;\n]{0,120}Buffer\.(alloc|from)\b'

  - id: go-reassembly-state-map
    desc: Go packet reassembly state map
    crit: notable
    conf: 0.84
    for: [go]
    if:
      type: text
      regex: '\breassembly\s+map\s*\['

  - id: go-fragment-processing-function
    desc: Go function named for fragmentation
    crit: component
    conf: 0.82
    for: [go]
    if:
      type: symbol
      kind: function
      regex: '[Ff]ragment'

  - id: python-sequence-field-sort
    desc: Python sorts records by sequence field
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\.sort\s*\([^)]{0,300}["'']seq(uence)?["'']'

  - id: go-sequence-field-sort
    desc: Go sorts records by sequence field
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?i)sort\.Slice[\s\S]{0,700}\bSeq\b'

composite_rules:
  - id: go-packet-fragment-reassembly
    desc: Go packet fragmentation and reassembly state
    crit: notable
    conf: 0.9
    for: [go]
    all:
      - id: go-reassembly-state-map
      - id: go-fragment-processing-function
