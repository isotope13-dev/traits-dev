# Fixed-width byte slicing is ordinary binary/protocol parsing.  More specific
# objectives must add semantic context before interpreting the byte shape.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9

traits:
  - id: named-byte-replacement-routine
    desc: References a named byte-replacement routine
    crit: notable
    conf: 0.9
    for: [c, cpp, python, lua]
    if:
      type: text
      regex: '(?i)\b(replace_bytes|replace_matching_bytes)\b'

  # A single indexed XOR assignment proves a byte mutation, not decoding.
  # Decoder objectives add iteration or buffer-rebuild context separately.
  - id: indexed-byte-xor-mutation
    desc: XOR-mutates an indexed byte
    crit: notable
    conf: 0.92
    for: [python, c, cpp, go, rust, javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\[[^\]\n]{1,24}\]\s*\^=\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test

  - id: indexed-byte-xor-nontrivial-mask
    desc: XOR-mutates indexed byte with non-1 mask
    crit: notable
    conf: 0.92
    for: [python, c, cpp, go, rust, javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\[[^\]\n]{1,24}\]\s*\^=\s*0x0*[2-9A-Fa-f]'

  - id: powershell-byte-array-type
    desc: PowerShell byte-array type declaration
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[(System\.)?Byte\[\]\]'

  - id: adjacent-four-byte-subarrays
    desc: Reads adjacent four-byte subarrays
    if:
      type: text
      regex: 'subarray\s*\(\s*0\s*,\s*4\s*\).{0,120}subarray\s*\(\s*4\s*,\s*8\s*\)'
