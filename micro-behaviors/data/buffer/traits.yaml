# Fixed-width byte slicing is ordinary binary/protocol parsing.  More specific
# objectives must add semantic context before interpreting the byte shape.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9

traits:
  - id: powershell-byte-array-type
    desc: PowerShell byte-array type declaration
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[(System\.)?Byte\[\]\]'

  - id: adjacent-four-byte-subarrays
    desc: Reads adjacent four-byte subarrays
    if:
      type: text
      regex: 'subarray\s*\(\s*0\s*,\s*4\s*\).{0,120}subarray\s*\(\s*4\s*,\s*8\s*\)'
