defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, go, rust, elf, macho, pe, wasm]
  crit: notable
  conf: 0.85

traits:
  - id: network-header-htons-field
    desc: Converts protocol field to network order
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '\bhtons\s*\(\s*(type|code)\s*\)'

  - id: network-buffer-copy-call
    desc: Copies bytes into a protocol buffer
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: memcpy

  - id: network-option-function-call
    desc: Calls add_option during buffer construction
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: add_option

  - id: go-big-endian-uint16-write
    desc: Writes a 16-bit big-endian value in Go
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.PutUint16

  - id: rust-big-endian-uint16-write
    desc: Writes a 16-bit big-endian value in Rust
    for: [rust]
    if:
      type: text
      regex: '\bto_be_bytes\s*\(\s*\)'
