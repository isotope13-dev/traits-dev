defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, go, rust, elf, macho, pe, wasm]
  crit: notable
  conf: 0.85

traits:
  - id: inline-high-bit-frame-length
    desc: ORs high-bit constant into frame length
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*(\|=|=.{0,40}\|)\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: frame-length-bit-constant
    desc: Declares named high-bit frame-length flag
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b\w*(FRAME|LENGTH)\w*BIT\s*=\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: named-frame-length-bit-or
    desc: ORs named flag into frame length
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*=.{0,40}\|\s*\w*BIT\b'

  - id: network-header-htons-field
    desc: Converts protocol field to network order
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '\bhtons\s*\(\s*(type|code)\s*\)'

  - id: network-option-function-call
    desc: Calls add_option during buffer construction
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: add_option

  - id: go-big-endian-uint16-write
    desc: Writes a 16-bit big-endian value in Go
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.PutUint16

  - id: go-big-endian-uint16-append
    desc: Appends a 16-bit big-endian value in Go
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.AppendUint16

  - id: go-big-endian-uint32-write
    desc: Writes a 32-bit big-endian value in Go
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.PutUint32

  # Unlike the Go atoms above, `to_be_bytes()` is an inherent method on every
  # Rust integer type, so the width is not observable from the call site — it
  # fires equally for u16, u32, u64 and the signed forms. Name and describe it
  # for the byte-order conversion it actually proves, not a width it doesn't.
  - id: rust-big-endian-byte-conversion
    desc: Rust integer to big-endian bytes
    for: [rust]
    if:
      type: text
      regex: '\bto_be_bytes\s*\(\s*\)'

composite_rules:
  - id: named-high-bit-frame-length
    desc: Applies high-bit flag to frame length
    crit: notable
    conf: 0.94
    for: [scripts, source]
    all:
      - id: frame-length-bit-constant
      - id: named-frame-length-bit-or
