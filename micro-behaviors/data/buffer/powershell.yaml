# Length-prefixed buffers are common protocol mechanics.  Parsing a UInt64
# length at offset zero and writing exactly the following byte slice is useful
# evidence of payload carving, but does not establish malicious intent alone.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]

traits:
  # Pairing the low four bits of adjacent carrier bytes is a neutral byte
  # reconstruction primitive. Audio/image steganography composites provide
  # the carrier context and execution sink.
  - id: powershell-low-nibble-shift
    desc: Shifts a PowerShell low nibble four bits
    conf: 0.96
    attack: T1140
    if:
      type: text
      regex: '(?i)-band\s+(0x0?f|15)\s*\)\s*-shl\s+4'

  - id: powershell-low-nibble-or
    desc: ORs a second PowerShell low nibble
    conf: 0.96
    attack: T1140
    if:
      type: text
      regex: '(?i)-bor\s*\([^\)\r\n]{1,80}-band\s+(0x0?f|15)\s*\)'

  - id: powershell-fixed-44-byte-header-skip
    desc: Reads buffer after fixed 44-byte header
    conf: 0.94
    if:
      type: text
      regex: '(?is)\[IO\.File\]::Open\([^\r\n]{1,200}\)[\s\S]{0,420}\$\w+\s*=\s*44\b'

  - id: powershell-uint64-length-at-offset-zero
    desc: Reads UInt64 length at offset zero
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[BitConverter\]::ToInt64\s*\(\s*\$\w+\s*,\s*0\s*\)'

  # Joining staged fragments: reads/holds two byte arrays and writes their
  # concatenation out as one file. Neutral buffer mechanic on its own; strong
  # reassembly evidence when composed with staged or extracted fragments.
  - id: powershell-write-concat-byte-arrays
    desc: Writes concatenation of two byte arrays
    conf: 0.9
    if:
      type: text
      regex: '(?i)::\s*WriteAllBytes\s*\([^\r\n)]{0,120}\$\w+\s*\+\s*\$\w+\s*\)'

  - id: powershell-eight-byte-header-slice
    desc: Slices bytes after eight-byte header
    conf: 0.96
    if:
      type: text
      regex: '\$\w+\s*\[\s*8\s*\.\.\s*\(\s*7\s*\+\s*\$\w+\s*\)\s*\]'

composite_rules:
  - id: powershell-lower-nibble-pair-merge
    desc: Merges two PowerShell low nibbles
    conf: 0.98
    attack: T1140
    all:
      - id: powershell-low-nibble-shift
      - id: powershell-low-nibble-or
    near_lines: 2

  - id: powershell-uint64-length-prefixed-file-carve
    desc: Carves UInt64-length-prefixed file
    conf: 0.98
    all:
      - id: powershell-uint64-length-at-offset-zero
      - id: powershell-eight-byte-header-slice
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
    near_lines: 8
