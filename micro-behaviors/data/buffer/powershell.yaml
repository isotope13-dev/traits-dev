# Length-prefixed buffers are common protocol mechanics.  Parsing a UInt64
# length at offset zero and writing exactly the following byte slice is useful
# evidence of payload carving, but does not establish malicious intent alone.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-uint64-length-at-offset-zero
    desc: Reads UInt64 length at offset zero
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[BitConverter\]::ToInt64\s*\(\s*\$\w+\s*,\s*0\s*\)'

  - id: powershell-eight-byte-header-slice
    desc: Slices bytes after eight-byte header
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\$\w+\s*\[\s*8\s*\.\.\s*\(\s*7\s*\+\s*\$\w+\s*\)\s*\]'

composite_rules:
  - id: powershell-uint64-length-prefixed-file-carve
    desc: Carves UInt64-length-prefixed file
    crit: notable
    conf: 0.98
    all:
      - id: powershell-uint64-length-at-offset-zero
      - id: powershell-eight-byte-header-slice
      - id: micro-behaviors/fs/write/file/direct::write-all-bytes
    near_lines: 8
