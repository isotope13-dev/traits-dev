                      for any k in (0..!alphabet[e]-2) : (
                       (k == 0 or uint8(b+k-1) != 92 or (uint16(b+k-2) == 0x5c5c and uint8(b+k-3) != 92)) and
                       ((n == 1 and (uint8(b+k) == 108 or (uint8(b+k) == 92 and uint8(b+k+1) == 108))) or
