  # Decoded evidence: 'block+block+fillblock'
  - id: rotating-padded-block-double
    desc: Substitution carries padded block doubling
    if:
      type: yara
      source: |
        import "math"
        rule rotating_padded_block_double {
         strings:
          $alphabet = /'([^'\\]|\\.){97}'/
          $argument = /[;}>]\w+\("/
          $slash = /[^\\]\\\\/
         condition:
          #alphabet >= 2 and $argument and
          for any d in (1..#alphabet) : (
           for any e in (1..#alphabet) : (
            @alphabet[e] > @alphabet[d] and @alphabet[e] < @alphabet[d]+300 and
            with a = @alphabet[d]+1, b = @alphabet[e]+1 : (
             for any t in (1..#argument) : (
              for any rotation in (0..4) : (
               for any k0 in (0..!alphabet[e]-2) : (
                (k0 == 0 or uint8(b+k0-1) != 92 or (uint16(b+k0-2) == 0x5c5c and uint8(b+k0-3) != 92)) and
                uint8(b+k0) == 98 and
                with oi0 = k0-math.count(92,b,k0)+(#slash in (b-1..b+k0-2)) : (
                 for any j0 in (0..!alphabet[d]-2) : (
                  (j0 == 0 or uint8(a+j0-1) != 92 or (uint16(a+j0-2) == 0x5c5c and uint8(a+j0-3) != 92)) and
                  j0-math.count(92,a,j0)+(#slash in (a-1..a+j0-2)) == (oi0+rotation)%97 and
                  for any p in (@argument[t]+!argument[t]..filesize-21) : (
                   uint8(p) == uint8(a+j0) and
                   (uint8(p) != 92 or uint8(p+1) == uint8(a+j0+1)) and
                   (uint8(p-1) != 92 or (uint16(p-2) == 0x5c5c and uint8(p-3) != 92)) and
                   for all quote in (@argument[t]+!argument[t]..p-1) : (
                    uint8(quote) != 34 or
                    (uint8(quote-1) == 92 and uint8(quote-2) != 92) or
                    (uint8(quote-1) == 92 and uint16(quote-3) == 0x5c5c and
                     uint8(quote-4) != 92)
                   ) and
                   with q0 = p,
        q1 = q0+1+math.count(92,q0,1),
        q2 = q1+1+math.count(92,q1,1),
        q3 = q2+1+math.count(92,q2,1),
        q4 = q3+1+math.count(92,q3,1),
