defaults:
  platforms: [windows]
  for: [javascript, html, text]
traits:
- id: decoded-32kb-string-growth
  desc: Decoded script pads string to 32+ KiB
  crit: notable
  conf: 0.96
  if:
    type: encoded
    regex: 'while\(\w+\.length\s*<\s*0x[89a-fA-F][0-9a-fA-F]{3,}\)\s*\w+\s*\+='
- id: source-32kb-string-growth
  desc: Script source pads string to 32+ KiB
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'while\s*\(\w+\.length\s*<\s*0x[89a-fA-F][0-9a-fA-F]{3,}\)\s*\w+\s*\+='
