defaults:
  platforms: [unix, windows]
  for: [go, python]
  crit: notable
  conf: 0.95
traits:
  - id: leading-32-byte-slice
    desc: Extracts buffer prefix at index 32
    if:
      type: text
      regex: '\b\w+\[\s*:32\s*\]'
  - id: trailing-32-byte-slice
    desc: Extracts buffer suffix starting at index 32
    if:
      type: text
      regex: '\b\w+\[\s*32:\s*\]'
composite_rules:
  - id: split-at-32
    desc: Buffer prefix and suffix slices at index 32
    near_bytes: 128
    all:
      - id: leading-32-byte-slice
      - id: trailing-32-byte-slice
