defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: shell-marker-byte-offset
    desc: grep locates a marker by byte offset
    for: [shell]
    if:
      type: text
      regex: '\bgrep\s+-a\s+-b\s+-o\s+["'']?\$\{?[A-Za-z_]\w*'

  - id: shell-variable-byte-tail
    desc: tail extracts a variable byte-offset suffix
    for: [shell]
    if:
      type: text
      regex: '\btail\s+-c\s+\+["'']?\$\{?[A-Za-z_]\w*'

  - id: sed-delete-through-delimiter
    desc: sed deletes input through delimiter line
    for: [shell]
    if:
      type: text
      regex: '\bsed\s+["'']1,/[^/\r\n]{3,64}/d["'']\s+["'']?\$\{?[A-Za-z_]\w*'

  - id: python-base64-decode-delimited-tail
    desc: Base64 decodes byte-delimited buffer tail
    for: [python]
    if:
      type: text
      regex: '\bb64decode\s*\(\s*\w+\.split\(\s*b["''][^"''\r\n]{3,64}["'']\s*,\s*1\s*\)\s*\[\s*1\s*\]'

composite_rules:
  - id: delimited-base64-tail
    desc: Base64 decoding of delimiter-carved input
    for: [shell, python]
    scope: file
    any:
      - id: shell-delimited-base64-tail
      - id: python-base64-decode-delimited-tail
      - id: shell-offset-base64-tail

  - id: shell-offset-base64-tail
    desc: Marker byte-offset extraction with OpenSSL Base64 decoding
    for: [shell]
    scope: file
    all:
      - id: shell-marker-byte-offset
      - id: shell-variable-byte-tail
      - id: micro-behaviors/data/decode/base64::openssl-base64-decode-command

  - id: shell-delimited-base64-tail
    desc: Delimiter removal with shell Base64 decode
    for: [shell]
    scope: file
    near_lines: 1
    all:
      - id: sed-delete-through-delimiter
      - id: micro-behaviors/data/decode/base64::base64-decode-command
