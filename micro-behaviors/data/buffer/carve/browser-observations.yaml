defaults:
  for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: js-unescape-repeat-call
  desc: Repeats an unescaped string by count
  if:
    type: text
    regex: (?i)unescape\s*\([^)]{0,48}\)\.repeat\s*\(
- platforms:
  - unix
  for:
  - perl
  id: perl-nop-byte-repeat
  desc: Repeats a NOP byte string
  conf: 0.9
  if:
    type: text
    regex: '"\\x90"\s*x'
