defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - html
  - makefile
  crit: notable
  conf: 0.9
traits:
- id: js-length-bound-string-grow
  desc: Grows string past a length bound
  conf: 0.86
  for:
  - javascript
  - html
  - text
  - elixir
  - scala
  - ruby
  - objectivec
  - makefile
  if:
    type: text
    regex: while\s*\(\w{1,16}\.length\s*<=?\s*(0x[\da-fA-F]{3,6}|[0-9]{4,8})(/\d+)?\)[^\n]{0,24}\+=
- id: js-variable-length-string-append
  desc: Appends within variable-bound string length loop
  conf: 0.94
  if:
    type: text
    regex: 'while\s*\(\w+\.length\s*<\s*[A-Za-z_]\w*\s*\)\s*\w+\s*\+=\s*\w+'
- id: js-scaled-length-string-double
  desc: Doubles string below scaled length
  conf: 0.86
  if:
    type: text
    regex: (?s)while\s*\(\w+\.length\s*\*\s*2\s*<\s*\w+\s*\).{0,80}\w+\s*\+=\s*\w+
- id: js-do-while-string-double
  desc: Doubles a string until a length bound
  conf: 0.86
  for:
  - javascript
  - html
  - elixir
  - scala
  - ruby
  - objectivec
  - makefile
  if:
    type: text
    regex: do\s*\{[^}]{0,40}\+=[^;]{1,24};\s*}\s*while\s*\([^)]{1,40}\.length
- id: js-padding-char-spray
  desc: Appends one char to a padding buffer
  conf: 0.86
  for:
  - javascript
  - html
  - elixir
  - scala
  - makefile
  if:
    type: text
    regex: Padding\s*\+=\s*["'][^"']{1,4}["']
