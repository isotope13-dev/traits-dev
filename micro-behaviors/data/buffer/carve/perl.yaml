# Buffer construction is useful exploit evidence but also occurs in tests,
# fuzzers and research tools; it does not establish exploitation or execution.
defaults:
  platforms: [unix]
  for: [perl]

traits:
  - id: high-32bit-address-literal
    desc: Hardcoded high 32-bit address literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[^0-9a-f])0xbf[0-9a-f]{6}([^0-9a-f]|$)'

  # Signature for the FreeBSD i386 connect/exec shellcode form. Requiring the
  # initial register setup, /bin path bytes, and execve syscall keeps this
  # distinct from arbitrary escaped byte buffers without claiming execution.
  - id: perl-freebsd-connect-back-shellcode-signature
    desc: FreeBSD x86 connect-back shellcode signature
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\\x31\\xc9\\xf7\\xe1[\s\S]{0,600}\\x2f\\x62[\s\S]{0,160}\\xb0\\x3b\\xcd\\x80'

  - id: perl-nop-var-repeat
    desc: Repeats a NOP variable
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\$nop\s+x\s+'
  - id: perl-nop-byte-append
    desc: Appends a NOP byte to a pad
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.=\s*"\\x90"'

composite_rules:
  - id: perl-nop-hex-buffer
    desc: NOP byte repetition beside hex-escaped bytes
    crit: suspicious
    conf: 0.96
    near_lines: 45
    all:
    - id: metadata/file/encoding::perl-hex-escape-run
    any:
    - id: micro-behaviors/data/buffer/carve::perl-nop-byte-repeat
    - id: perl-nop-var-repeat
    - id: perl-nop-byte-append
    unless:
    - id: metadata/package/testing/presence/harness::perl-test-file

  # This is a buffer profile: proximity to output does not prove that the
  # buffer is written, much less that it exploits or executes anything.
  - id: perl-nop-hex-buffer-output-context
    desc: NOP/hex buffer near filehandle print
    crit: suspicious
    conf: 0.95
    near_lines: 60
    all:
    - id: micro-behaviors/data/buffer/carve::perl-nop-byte-repeat
    - id: metadata/file/encoding::perl-hex-escape-run
    - id: micro-behaviors/fs/write/stream::perl-filehandle-print
    unless:
    - id: metadata/package/testing/presence/harness::perl-test-file
