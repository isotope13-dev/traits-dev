# Encoded instruction/expression fingerprints; substitution variants require
# the fixed carrier alphabet. These are not general cipher decoders.
defaults:
  for: [html, javascript, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: dollar-decimal-newline-buffer-fill
    desc: Decimal-encoded buffer appends repeated 0a bytes
    if:
      type: text
      substr: '43$61$34$92$120$48$97$92$120$48$97$92$120$48$97$92$120$48$97$34'
  - id: substitution-newline-buffer-fill
    desc: Substitution-encoded repeated 0a buffer fill
    if:
      type: text
      substr: '\_hS5\`\*95\`\*95\`\*95\`\*9'
  - id: dollar-decimal-padded-block-double
    desc: Decimal-encoded padded block doubling
    if:
      type: text
      substr: '98$108$111$99$107$43$98$108$111$99$107$43$102$105$108$108$98$108$111$99$107'
  - id: substitution-padded-block-double
    desc: Substitution-encoded padded block doubling
    if:
      type: text
      substr: 'Je\,Kg\_Je\,Kg\_\|\=eeJe\,Kg'
