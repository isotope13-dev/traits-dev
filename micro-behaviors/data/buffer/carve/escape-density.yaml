# Escape-packed string blobs. Ciphertext staged through script
# string arguments chains neighboring escape pairs; ordinary pages show
# none of these chains, so the count and per-KB floors admit only packed
# staging, never inline data.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: backslash-dense-escape-packing
    desc: Chained escape triples pack concealed content
    count_min: 8
    per_kb_min: 1.0
    if:
      type: text
      regex: '\\[\/n"r].{0,6}\\[\/n"r].{0,6}\\[\/n"r]'
