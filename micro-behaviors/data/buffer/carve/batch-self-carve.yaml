defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-self-carve-decode-write
    desc: Hidden batch shell carves, decodes and writes bytes
    crit: notable
    conf: 0.98
    attack: T1140,T1059.001
    near_lines: 1
    all:
      - id: micro-behaviors/data/buffer/carve::lastindexof-hex-fence
      - id: micro-behaviors/fs/read/self::powershell-reads-current-batch
      - id: micro-behaviors/data/arithmetic::powershell-byte-converter-xor
      - id: micro-behaviors/fs/write/file/binary::embedded-powershell-base64-write-all-bytes
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
