# Neutral observations; references and syntax do not establish attacker intent.
traits:
- platforms:
  - unix
  - windows
  for:
  - go
  id: go-named-buffer-prefix-slice
  desc: Go named buffer slice skips prefix bytes
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: \b(payload|shellcode|stage)\s*\[[2-9]:\]
  unless:
  - type: text
    regex: binary\.(Big|Little)Endian\.Uint\d+\(\s*\w+\[\s*0?:\s*\d+\s*\]\s*\)
  - type: text
    substr: Code generated by go-bindata.
  - id: metadata/package/testing/harness/unit/
