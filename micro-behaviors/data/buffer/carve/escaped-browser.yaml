defaults:
  platforms: [windows, unix]
  for: [html, javascript, ruby, python]
  crit: notable
  conf: 0.98
traits:
  - id: hex-length-bound-buffer-addition
    desc: Hex-length-bound buffer addition loop
    if:
      type: text
      regex: 'while[^\n]{0,160}length[^\n]{0,80}0x40000[^;\n]{0,80}=[^;\n]{0,80}\+'
