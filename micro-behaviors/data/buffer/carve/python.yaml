# A tail slice at an index named eof does not establish an image carrier.
# The image-extraction objective additionally requires a nearby terminator search.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
- id: python-eof-index-tail-slice
  desc: Python buffer tail slice at eof index
  if:
    type: text
    regex: '\b\w+\s*=\s*\w+\[\s*eof\s*:\s*\]'
