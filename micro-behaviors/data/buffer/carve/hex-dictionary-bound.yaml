# Semantic lookup through a Packer xNN dictionary, independent of token order.
# Matches the decoded observation; no sample token map, URL, or filename gate.
defaults:
  for: [html, javascript]
  platforms: [windows]
traits:
  - id: hex-dictionary-block-size-bound
    desc: Hex-dictionary source compares a 256KiB bound
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule hex_dictionary_block_size_bound {
          strings:
            $dictionary = /'(x[0-9a-f]{2}\|){1,61}eval\|(x[0-9a-f]{2}\|){0,61}x[0-9a-f]{2}'/
            $eval_slot = "|eval|"
          condition:
            $dictionary and
            for any d in (1..#dictionary) : (
              for any e in (1..#eval_slot) : (
                @eval_slot[e] > @dictionary[d] and
                @eval_slot[e] < @dictionary[d] + !dictionary[d] and
                with eval_index = (@eval_slot[e] - @dictionary[d]) \ 4 : (
                  for any p in (0..filesize - 24) : (
                      uint16(p) == 0x5c5c and
                      for all n in (0..7) : (
                        uint16(p + n*3) == 0x5c5c and
                        for any k in (0..61) : (
                          ((k < 10 and uint8(p+n*3+2) == k+48) or
                           (k >= 10 and k < 36 and uint8(p+n*3+2) == k+87) or
                           (k >= 36 and uint8(p+n*3+2) == k+29)) and
                          for any pad in (0,1) : (
                            ((k < eval_index and pad == 0) or
                             (k > eval_index and pad == 1)) and
                            @dictionary[d]+4*k+3+pad < @dictionary[d]+!dictionary[d] and
                            with v = uint16(@dictionary[d]+4*k+2+pad) : (
                            (n == 0 and v == 0x6333) or
                            (n == 1 and v == 0x3033) or
                            (n == 2 and v == 0x3837) or
                            (n == 3 and v == 0x3433) or
                            (n == 4 and v == 0x3033) or
                            (n == 5 and v == 0x3033) or
                            (n == 6 and v == 0x3033) or
                            (n == 7 and v == 0x3033)
                            )
                          )
                        )
                      )
                  )
                )
              )
            )
        }
