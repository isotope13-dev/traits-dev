# Protocol frame-length handling: upper-word length flags ORed into frame
# lengths, and single-byte frame markers. Declaring or applying a frame
# length is ordinary protocol mechanics; overflow and framing composites add
# the bounds and socket context.
defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, linux, macos]

traits:
  - id: inline-upper-word-frame-length
    desc: ORs upper-word constant into frame length
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*(\|=|=.{0,40}\|)\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: frame-length-upper-word-flag
    desc: Declares upper-word frame-length flag
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b\w*(FRAME|LENGTH)\w*BIT\s*=\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: named-frame-length-flag-or
    desc: ORs named flag into frame length
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*=.{0,40}\|\s*\w*BIT\b'

  - id: first-buffer-byte-0x22
    desc: Assigns 0x22 to buffer offset zero
    crit: component
    conf: 0.8
    for: [scripts, source]
    if:
      type: text
      regex: '\[[A-Za-z0-9_+\- ]{0,24}0\]\s*=\s*0x22'

  - id: network-option-function-call
    desc: Calls add_option during buffer construction
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: add_option

composite_rules:
  - id: named-upper-word-frame-length
    desc: Applies upper-word flag to frame length
    conf: 0.94
    for: [scripts, source]
    all:
      - id: frame-length-upper-word-flag
      - id: named-frame-length-flag-or
