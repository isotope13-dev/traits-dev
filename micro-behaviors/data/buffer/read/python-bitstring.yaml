defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-bitstring-byte-read
    desc: Reads bytes using bitstring format
    if:
      type: symbol
      kind: call
      regex: '\.read$'
      arg:
        index: 0
        kind: string
        regex: '^bytes:'
