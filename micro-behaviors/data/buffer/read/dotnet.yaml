defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell]
  crit: notable
traits:
- id: dotnet-getbytearrayasync-token
  desc: Async byte-array retrieval method reference
  conf: 0.86
  for: [pe, dll, powershell]
  if:
    type: text
    word: GetByteArrayAsync
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository
- id: dotnet-getbytearrayasync-call
  desc: Calls an async byte-array retrieval method
  conf: 0.95
  for: [csharp]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetByteArrayAsync$'

composite_rules:
- id: dotnet-getbytearrayasync-reference
  desc: Async byte retrieval call or method token
  conf: 0.9
  any:
  - id: dotnet-getbytearrayasync-token
  - id: dotnet-getbytearrayasync-call
