# Neutral observations relocated during crate review. Matchers and type scope retained.
defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - text
  crit: notable
traits:
- id: indexed-byte-hex-comparison
  desc: Indexed buffer value compared to hex byte
  conf: 0.85
  if:
    type: text
    regex: \[\s*[A-Za-z_]\w{0,5}\s*\]\s*==\s*0x[0-9a-fA-F]{2}
- id: next-byte-hex-comparison
  desc: Next buffer value compared to hex byte
  conf: 0.85
  if:
    type: text
    regex: \[\s*\w{1,6}\s*\+\s*1\s*\]\s*==\s*0x[0-9a-fA-F]{2}
composite_rules:
- id: nearby-indexed-byte-hex-comparisons
  desc: Indexed byte comparisons occur near each other
  conf: 0.9
  near_lines: 4
  all:
  - id: micro-behaviors/data/buffer/read::indexed-byte-hex-comparison
  - id: micro-behaviors/data/buffer/read::next-byte-hex-comparison
