# Indexed PowerShell byte comparisons against hex constants (`$b[0] -eq 0xFF`).
# Placed under buffer/read because BOM and header parsers inspect leading bytes
# identically to trailer parsers; footer composites add the end-relative seek.
defaults:
  crit: notable
  platforms: [windows, linux, macos]

traits:
  - id: powershell-byte-index-hex-compare
    desc: Compares buffer bytes to hex constants
    conf: 0.8
    for: [powershell]
    count_min: 3
    if:
      type: text
      regex: '(?i)\$\w+\[\s*[0-7]\s*\]\s*-eq\s*0x[0-9a-f]{2}'

  - id: encoded-powershell-byte-index-hex-compare
    desc: Encoded script compares bytes to hex
    conf: 0.8
    for: [batch, python, javascript, typescript, rust, go, csharp, powershell]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\$\w+\[[0-7]\]\s*-eq\s*0x[0-9a-f]{2}.{0,40}\$\w+\[[0-7]\]\s*-eq\s*0x'
