defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: jvm-outputstream-write
    desc: JVM writes bytes to output stream
    crit: baseline
    conf: 0.96
    if:
      type: import
      exact: java/io/OutputStream.write

  # The synthetic default-argument bridge kotlinc emits for kotlin.io's
  # `copyTo` extensions (InputStream.copyTo, File.copyTo, Path.copyTo), i.e.
  # the app pumps one stream into another with the stdlib helper rather than a
  # hand-written read/write loop. Relocated from
  # micro-behaviors/communications/http/post (2026-08), where it described a
  # stream copy as an HTTP POST; the exfil composites that pair it with a
  # POST leg still reference it here.
  - id: kotlin-bytecode-copyto-default
    desc: Kotlin stdlib copyTo stream-copy bridge
    crit: notable
    conf: 0.86
    platforms: [unix, windows, android]
    if:
      type: hex
      pattern: 63 6F 70 79 54 6F 24 64 65 66 61 75 6C 74
