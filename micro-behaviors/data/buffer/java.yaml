defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  # Generic DataInput/ByteBuffer calls. Framing composites add nearby socket
  # and buffer evidence before describing these as a message length.
  - id: integer-read-method-call
    desc: Java integer read or get method call
    crit: component
    platforms: [android, unix, windows]
    for: [java, kotlin, class, jar, apk, zip]
    if:
      type: text
      regex: '\b(readInt|getInt)\s*\('

  - id: integer-write-method-call
    desc: Java integer write or put method call
    crit: component
    platforms: [android, unix, windows]
    for: [java, kotlin, class, jar, apk, zip]
    if:
      type: text
      regex: '\b(writeInt|putInt)\s*\('

  - id: jvm-outputstream-write
    desc: JVM writes bytes to output stream
    crit: baseline
    conf: 0.96
    if:
      type: import
      exact: java/io/OutputStream.write

  # Relocated from objectives/command-and-control/backdoor/loader/archive/,
  # where a reference to the JDK's in-memory byte buffer was filed as backdoor
  # loader evidence. Half of all Java code accumulates bytes this way, so the
  # atom carries no staging intent -- the loader composites supply that by
  # pairing it with the JAR walk and defineClass. Its input-side sibling is
  # micro-behaviors/data/compress/library::bytearrayinputstream.
  - id: bytearrayoutputstream-ref
    desc: Java ByteArrayOutputStream class
    crit: component
    conf: 0.88
    if:
      type: import
      exact: java/io/ByteArrayOutputStream

  # The synthetic default-argument bridge kotlinc emits for kotlin.io's
  # `copyTo` extensions (InputStream.copyTo, File.copyTo, Path.copyTo), i.e.
  # the app pumps one stream into another with the stdlib helper rather than a
  # hand-written read/write loop. Relocated from
  # micro-behaviors/communications/http/post (2026-08), where it described a
  # stream copy as an HTTP POST; the exfil composites that pair it with a
  # POST leg still reference it here.
  - id: kotlin-bytecode-copyto-default
    desc: Kotlin stdlib copyTo stream-copy bridge
    crit: notable
    conf: 0.86
    platforms: [unix, windows, android]
    if:
      type: hex
      pattern: 63 6F 70 79 54 6F 24 64 65 66 61 75 6C 74
