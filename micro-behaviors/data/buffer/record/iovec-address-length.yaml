defaults:
  platforms: [unix]
  for: [c, cpp]
  conf: 0.97

traits:
  - id: iovec-buffer-address-as-length
    desc: Same address assigned as iovec buffer/length
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (expression_statement
            (assignment_expression
              left: (field_expression
                argument: (subscript_expression) @buffer_entry
                field: (field_identifier) @buffer_field)
              right: (cast_expression
                value: (cast_expression value: (identifier) @buffer_address))))
          (expression_statement
            (assignment_expression
              left: (field_expression
                argument: (subscript_expression) @length_entry
                field: (field_identifier) @length_field)
              right: (cast_expression value: (identifier) @length_address))))
         (#eq? @buffer_field "iov_base")
         (#eq? @length_field "iov_len")
         (#eq? @buffer_entry @length_entry)
         (#eq? @buffer_address @length_address))

