# Native VB6 SAFEARRAY code loads pvData at +0x0c, then indexes a byte.
# The helper call alone does not identify its arithmetic or the buffer source.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-helper-result-indexed-byte-store
    desc: x86 helper result stored in buffer byte
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '50 FF 15 ?? ?? ?? ?? 8B 55 ?? 8B 4A 0C 8B 95 ?? ?? ?? ?? 88 04 11'
