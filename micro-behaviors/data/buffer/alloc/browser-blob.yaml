defaults:
  for: [html, javascript, typescript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
traits:
  - id: blob-construction
    desc: Constructs a Blob from data
    if:
      type: text
      regex: '\bnew\s+Blob\s*\('
  - id: zip-file-construction
    desc: Constructs a ZIP-typed File object
    # Client-side export features (JSZip/FileSaver "download as zip") build
    # ZIP Files legitimately, so this stays a neutral capability: the
    # dropper composites supply the smuggling context (staged Base64 ZIP
    # decoded beside it). Covers the File-sink shape (`new File([blob],
    # name, {type: 'application/zip'})` navigated via a blob URL) that the
    # anchor-download and msSaveOrOpenBlob sink legs miss.
    if:
      type: text
      regex: '(?is)new\s+File\s*\([\s\S]{0,400}application/zip'
