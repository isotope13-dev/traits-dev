defaults:
  for: [html, javascript, typescript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
traits:
  - id: blob-construction
    desc: Constructs a Blob from data
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\bnew\s+Blob\s*\('
  - id: zip-file-construction
    desc: Constructs a ZIP-typed File object
    # Client-side export features (JSZip/FileSaver "download as zip") build
    # ZIP Files legitimately, so this stays a neutral capability: the
    # dropper composites supply the smuggling context (staged Base64 ZIP
    # decoded beside it). Covers the File-sink shape (`new File([blob],
    # name, {type: 'application/zip'})` navigated via a blob URL) that the
    # anchor-download and msSaveOrOpenBlob sink legs miss.
    if:
      type: text
      regex: '(?is)new\s+File\s*\([\s\S]{0,400}application/zip'
composite_rules:
  # Decoded-payload materialization: a sized byte buffer is built and a Blob
  # follows (base64-to-bytes loops, XHR/fetch arrayBuffers, canvas exports).
  # The globals cannot be renamed, so the pairing survives string-table
  # obfuscation where call-shaped decode matchers go blind. Ordinary exports
  # do this too, so it stays neutral; delivery objectives pair it with staged
  # archives and forced-save sinks.
  - id: uint8array-to-blob-materialization
    desc: Byte array materialized into Blob
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/data/buffer/alloc::uint8array-constructor
      - id: micro-behaviors/data/buffer/alloc::blob-construction
