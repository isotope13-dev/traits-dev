defaults:
  platforms: [unix, windows]
  for: [python, ruby]
  crit: notable
  conf: 0.95
traits:
  - id: python-packed-record-repeat
    desc: Repeats a packed binary record
    for: [python]
    if:
      type: text
      regex: '\bstruct\.pack\([^\n)]{1,100}\)\s*\*'
  - id: ruby-packed-record-repeat
    desc: Repeats a packed binary record
    for: [ruby]
    if:
      type: text
      regex: '\[[^\]\n]{1,80}\]\.pack\(["'']Q<Q<Q<["'']\)\s*\*'
