defaults:
  platforms:
  - windows
  - unix
  - android
  for:
  - javascript
  - typescript
  - html
  crit: baseline
  conf: 0.9
traits:
- id: js-float-array-constructor
  desc: Constructs a Float32Array or Float64Array buffer
  if:
    type: text
    regex: \bnew\s+Float(32|64)Array\s*\(
- id: js-bigint-array-constructor
  desc: Constructs a signed or unsigned BigInt64 buffer
  if:
    type: text
    regex: \bnew\s+BigU?Int64Array\s*\(
