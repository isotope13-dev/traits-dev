# Buffer construction is neutral; exploit consumers supply WPS context.
defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, go, rust, javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: python-a-byte-repeat
    desc: Repeats an A byte string
    for: [python]
    if:
      type: text
      regex: 'b["'']A["'']\s*\*\s*[(\w]'
  - id: cyclic-buffer-call
    desc: Calls a cyclic buffer generator
    for: [python, c, cpp]
    if:
      type: symbol
      kind: call
      exact: cyclic
  - id: rust-a-byte-vector
    desc: Allocates a vector of repeated A bytes
    for: [rust]
    if:
      type: text
      regex: '\bvec!\[0x41\s*;'
