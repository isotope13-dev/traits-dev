# Buffer allocation and construction: the buffer, specifically the container
# kind. Fixed-size declarations, typed-array and Buffer constructors, and
# fill routines live here; copies and stream output live in transfer/io.yaml,
# integer encode/decode in integer-codec/, and slicing, packing, and record
# surgery in record/surgery.yaml and carve/carving.yaml. Scopes are explicit
# per trait (this directory merges several language files).
defaults:
  platforms: [windows, linux, macos]

traits:
  - id: buffer-from-call
    desc: Calls Buffer.from at least three times
    crit: notable
    conf: 0.4
    count_min: 3
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: string_literal
      substr: Buffer.from

  - id: uint8array-from
    desc: Constructs byte array from iterable
    crit: baseline
    conf: 0.95
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      substr: Uint8Array.from

  # Canonical typed-array allocation atom. Allocating a byte buffer is ordinary
  # JavaScript (base64 decode, binary I/O, crypto), so it stays baseline here
  # rather than living in an exploit-flavoured directory; the JIT-primitive and
  # Durable-Objects composites reference it cross-directory and supply the
  # intent from their other legs.
  - id: uint8array-constructor
    desc: Constructs a Uint8Array buffer
    crit: baseline
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+Uint8Array\s*\('

  - id: arraybuffer-constructor
    desc: Constructs a JavaScript ArrayBuffer
    crit: baseline
    conf: 0.94
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+ArrayBuffer\s*\('

  - id: node-buffer-tostring-call
    desc: Converts Node.js Buffer output to text
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: Buffer.from.toString

  - id: node-buffer-from-json-stringify
    desc: Creates Node.js Buffer from JSON serialization
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Buffer\.from\s*\(\s*JSON\.stringify\s*\('

  - id: buffer-from-utf8
    desc: Creates Node.js Buffer from UTF-8 text
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        kind: string
        exact: utf8

  - id: c-command-buffer
    desc: C declares a character or byte buffer
    crit: notable
    conf: 0.8
    for: [c, cpp]
    if:
      type: text
      regex: '\b(char|unsigned\s+char)\s+[A-Za-z_][A-Za-z0-9_]*\s*\['

  - id: fixed-sixteen-byte-array
    desc: Declares a fixed sixteen-byte array
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]'

  # A 32-byte byte array is one possible storage shape for a 256-bit symmetric
  # key. The matcher only sees the declaration, so this is a neutral,
  # incomplete buffer fragment — crypto/objective composites decide intent by
  # pairing it with cipher calls or a C2 channel. (Moved here from the ChaCha20
  # stream file, where the name over-claimed the algorithm the regex cannot see.)
  - id: fixed-thirtytwo-byte-array
    desc: Declares a fixed thirty-two-byte array
    crit: notable
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*32\s*\]'

  # 39 bytes is the record size of a router-implant registration frame
  # (33-byte class + 6-byte MAC). The declaration alone proves nothing —
  # ryu's digit-adjustment table and FreeBSD's mc_frame[39] are the same
  # shape — so the length lives here as a neutral buffer declaration and
  # communications/socket/framing/ composites supply the framing evidence.
  # (Moved here from that file, where the names claimed a "registration".)
  - id: fixed-thirtynine-byte-array
    desc: Declares a fixed thirty-nine-byte array
    crit: notable
    conf: 0.86
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*39\s*\]'

  - id: rust-thirtynine-byte-array
    desc: Rust array initialized with thirty-nine bytes
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '\[\s*0u8\s*;\s*39\s*\]'

  - id: go-thirtynine-byte-array
    desc: Declares a thirty-nine-byte Go array
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\b(var\s+\w+\s+\[\s*39\s*\]byte|\w+\s*:=\s*\[\s*39\s*\]byte\s*\{)'

  - id: go-byte-slice-from-string
    desc: Converts a Go string literal to bytes
    crit: baseline
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\[\]byte\(\s*"[^"]{16,32}"\s*\)'

  - id: powershell-byte-array-type
    desc: PowerShell byte-array type declaration
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[(System\.)?Byte\[\]\]'

  - id: repeated-ff-byte-buffer
    desc: Python byte buffer repeats 0xFF
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'b["'']\\xff["'']\s*\*\s*(\w+|[1-9][0-9]{1,3})\b'

  - id: repeated-ff-signature-buffer
    desc: Signature-named buffer repeats 0xFF bytes
    crit: suspicious
    conf: 0.98
    for: [python]
    unless:
      - id: metadata/package/testing/
    if:
      type: text
      regex: '(?i)\b\w*(sig|signature)\w*\s*=\s*b["'']\\xff["'']\s*\*\s*(64|128|256|384|512)\b'


  # Relocated from objectives/anti-static/obfuscation/payload/config (where it
  # was api-named-byte-array-const--rx-6): constructing a bytes object from an
  # integer list is a neutral buffer operation, not obfuscation. SOCKS
  # handshakes (`bytes([5, 0])`), protocol framing, and binary parsers all do
  # this legitimately. The encoded-config composites reference it here.
  - id: python-bytes-list-constructor
    desc: Python builds bytes from an integer list
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bbytes\s*\(\s*\[\s*(0x[0-9A-Fa-f]{2}|\d{1,3})\s*,'
