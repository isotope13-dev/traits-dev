# Neutral observations; consumers must supply any obfuscation interpretation.
traits:
- platforms:
  - unix
  - windows
  crit: baseline
  conf: 0.88
  id: python-repeated-zero-bytes
  desc: Repeats zero bytes
  for:
  - python
  if:
    type: text
    regex: b["']\\x00["']\s*\*\s*(64|[1-9]\d{2,3})\b
- platforms:
  - unix
  - windows
  crit: baseline
  conf: 0.88
  id: zero-filled-byte-constructor
  desc: Constructs a zero-filled byte buffer
  for:
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: \b(bytes|bytearray|Buffer\.alloc)\s*\(\s*(64|[1-9]\d{2,3})\s*\)
- platforms:
  - unix
  - windows
  crit: baseline
  conf: 0.88
  id: rust-zero-filled-vector
  desc: Constructs a zero-initialized vector
  for:
  - rust
  if:
    type: text
    regex: vec!\s*\[\s*0(u8)?\s*;\s*(64|[1-9]\d{2,3})\s*\]
- platforms:
  - windows
  - linux
  - macos
  for:
  - python
  id: python-bytearray-constructor
  desc: Calls the bytearray constructor
  crit: baseline
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: bytearray
