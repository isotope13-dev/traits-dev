# Buffer allocation and initialization: constructors, declared byte arrays,
# and repeated-byte fills. Allocating or declaring a byte buffer is ordinary
# in every language (base64 decode, binary I/O, crypto), so these stay at or
# below notable here; exploit and staging composites reference them
# cross-directory and supply the intent from their other legs.
defaults:
  crit: notable
  conf: 0.9

traits:
  - id: buffer-from-call
    desc: Calls Buffer.from at least three times
    conf: 0.4
    platforms: [windows, unix]
    for: [javascript, typescript]
    count_min: 3
    if:
      type: string_literal
      substr: Buffer.from

  - id: uint8array-from
    desc: Constructs byte array from iterable
    crit: baseline
    conf: 0.95
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      substr: Uint8Array.from

  # Canonical typed-array allocation atom. Allocating a byte buffer is ordinary
  # JavaScript (base64 decode, binary I/O, crypto), so it stays baseline here
  # rather than living in an exploit-flavoured directory; the JIT-primitive and
  # Durable-Objects composites reference it cross-directory and supply the
  # intent from their other legs.
  - id: uint8array-constructor
    desc: Constructs a Uint8Array buffer
    crit: baseline
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+Uint8Array\s*\('

  - id: arraybuffer-constructor
    desc: Constructs a JavaScript ArrayBuffer
    crit: baseline
    conf: 0.94
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+ArrayBuffer\s*\('

  - id: c-command-buffer
    desc: C declares a character or byte buffer
    conf: 0.8
    platforms: [windows, linux, macos]
    for: [c, cpp]
    if:
      type: text
      regex: '\b(char|unsigned\s+char)\s+[A-Za-z_][A-Za-z0-9_]*\s*\['

  - id: fixed-sixteen-byte-array
    desc: Declares a fixed sixteen-byte array
    platforms: [windows, linux, macos]
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]'

  # A 32-byte byte array is one possible storage shape for a 256-bit symmetric
  # key. The matcher only sees the declaration, so this is a neutral,
  # incomplete buffer fragment — crypto/objective composites decide intent by
  # pairing it with cipher calls or a C2 channel.
  - id: fixed-thirtytwo-byte-array
    desc: Declares a fixed thirty-two-byte array
    conf: 0.86
    platforms: [windows, linux, macos]
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*32\s*\]'

  # 39 bytes is the record size of a router-implant registration frame
  # (33-byte class + 6-byte MAC). The declaration alone proves nothing —
  # ryu's digit-adjustment table and FreeBSD's mc_frame[39] are the same
  # shape — so the length lives here as a neutral buffer declaration and
  # communications/socket/framing/ composites supply the framing evidence.
  - id: fixed-thirtynine-byte-array
    desc: Declares a fixed thirty-nine-byte array
    conf: 0.86
    platforms: [windows, linux, macos]
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*39\s*\]'

  - id: rust-thirtynine-byte-array
    desc: Rust array initialized with thirty-nine bytes
    platforms: [windows, linux, macos]
    for: [rust]
    if:
      type: text
      regex: '\[\s*0u8\s*;\s*39\s*\]'

  - id: go-thirtynine-byte-array
    desc: Declares a thirty-nine-byte Go array
    platforms: [windows, linux, macos]
    for: [go]
    if:
      type: text
      regex: '\b(var\s+\w+\s+\[\s*39\s*\]byte|\w+\s*:=\s*\[\s*39\s*\]byte\s*\{)'

  - id: x86-call-result-fill-sixteen-byte-loop
    desc: Repeated calls fill a 16-byte buffer
    conf: 0.94
    platforms: [windows, linux, macos]
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      # call producer; store AL at base+index-1; repeat for indices 1..16.
      # Section-independent so the same routine is visible in fake-UPX and
      # conventionally linked variants.
      pattern: 'E8 ?? ?? ?? ?? 88 44 ?? FF 46 83 FE 11 75 ??'
      offset_range: [0, null]

  - id: powershell-byte-array-type
    desc: PowerShell byte-array type declaration
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[(System\.)?Byte\[\]\]'

  - id: repeated-ff-byte-buffer
    desc: Python byte buffer repeats 0xFF
    conf: 0.94
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: text
      regex: 'b["'']\\xff["'']\s*\*\s*(\w+|[1-9][0-9]{1,3})\b'

  - id: repeated-ff-signature-buffer
    desc: Signature-named buffer repeats 0xFF bytes
    crit: suspicious
    conf: 0.98
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: text
      regex: '(?i)\b\w*(sig|signature)\w*\s*=\s*b["'']\\xff["'']\s*\*\s*(64|128|256|384|512)\b'

  # A large single-byte fill buffer: an x86 NOP (0x90), int3 (0xcc), or a 0x41
  # 'A' filler repeated hundreds of times. This is the sled / padding a
  # memory-corruption exploit lays down to reach a saved return address; a
  # 3+ digit repeat count keeps ordinary small buffer inits out.
  - id: overflow-padding-buffer
    desc: Builds a large repeated-byte padding sled
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: text
      regex: 'b?["''](\\x(90|cc|41)|A)["'']\s*\*\s*(0x[0-9a-fA-F]{2,}|[1-9]\d{2,})\b'
