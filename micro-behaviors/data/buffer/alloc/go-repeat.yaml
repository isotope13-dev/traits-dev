defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9

traits:
- id: go-large-byte-slice-repeat
  desc: Go repeats a byte slice 100+ times
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  if:
    type: text
    regex: '\bbytes\.Repeat\s*\(.{1,40},\s*[1-9]\d{2,}\s*\)'
