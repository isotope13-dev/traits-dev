defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, rust, go, ruby]

traits:
  - id: size-one-call-padding
    desc: Appends padding after a size-one call
    crit: notable
    conf: 0.92
    for: [python, javascript, typescript]
    if:
      type: text
      regex: ',\s*\w+\s*,\s*1\s*\)\s*[,+]\s*(bytes|Buffer\.alloc)\(\s*\w+\s*\)'
