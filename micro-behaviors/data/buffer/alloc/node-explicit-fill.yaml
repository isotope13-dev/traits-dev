defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-explicit-zero-fill-buffer
    desc: Node Buffer allocation explicitly fills zeros
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: Buffer.alloc
      arg:
        index: 1
        kind: number
        value: 0
