defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: repeated-byte-concat-tail
    desc: Adds repeated bytes after closing parenthesis
    crit: component
    if:
      type: text
      regex: '\)\s*\+\s*b["\x27][^\r\n"\x27]{1,8}["\x27]\s*\*\s*[1-9][0-9]{3,5}\b'
      exclude_comments: true
