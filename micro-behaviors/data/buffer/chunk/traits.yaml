# Fixed-step iteration over a buffer. Batching, pagination, and multipart
# upload all loop this way legitimately, so these atoms stay notable: they
# name the iteration shape, and objective composites add the sleep pacing
# and the webhook POST that turn stepping into trickle exfiltration.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: python-fixed-step-chunk-loop
    desc: Python iterates buffer in fixed steps
    for: [python]
    if:
      type: text
      regex: 'for\s+[A-Za-z_]\w*\s+in\s+range\s*\(\s*0\s*,.{1,80}?,\s*\d{2,6}\s*\)'
  - id: powershell-fixed-step-chunk-loop
    desc: PowerShell iterates buffer in fixed steps
    for: [powershell]
    if:
      type: text
      regex: 'for\s*\(\s*\$\w+\s*=\s*0\s*;[^;\n]{1,60};\s*\$\w+\s*\+=\s*\d{2,6}\s*\)'
  - id: javascript-fixed-step-chunk-loop
    desc: JavaScript iterates buffer in fixed steps
    for: [javascript, typescript]
    if:
      type: text
      regex: 'for\s*\(\s*(let|var)\s+\w+\s*=\s*0\s*;[^;\n]{1,40};\s*\w+\s*\+=\s*\d{2,6}\s*\)'
