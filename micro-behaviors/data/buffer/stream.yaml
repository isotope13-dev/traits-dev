# A receiver named only by source syntax may be a file, socket, HTTP/2 stream,
# or in-memory stream.  The matcher proves buffer flow, not filesystem I/O.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, python, javascript]
  crit: notable
  conf: 0.9

traits:
  - id: stream-write-buffer-arg
    desc: Writes a buffer argument to a stream
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\.Write\s*\(\s*\$?buf'

  # The receiver can be an HTTP request, socket, file, or transform stream.
  # Objective rules supply the transport context; this atom records only the
  # neutral write-then-finalize sequence.
  - id: javascript-write-then-end-stream
    desc: JavaScript writes then ends a stream
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.write\(\s*[A-Za-z_$][\w$]*\s*\)\s*;\s*[A-Za-z_$][\w$]*\.end\(\)'
