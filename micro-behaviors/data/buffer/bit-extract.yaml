defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: baseline
  conf: 0.9

traits:
  - id: source-right-shift-24-bits
    desc: Source right-shifts by 24 bits
    if:
      type: text
      regex: '(?i)(>>|>>>|\bshr\b|bsr\s*\()[^\r\n]{0,24}24'

  - id: source-right-shift-16-bits
    desc: Source right-shifts by 16 bits
    if:
      type: text
      regex: '(?i)(>>|>>>|\bshr\b|bsr\s*\()[^\r\n]{0,24}16'

  - id: source-right-shift-8-bits
    desc: Source right-shifts by 8 bits
    if:
      type: text
      regex: '(?i)(>>|>>>|\bshr\b|bsr\s*\()[^\r\n]{0,24}8'

composite_rules:
  - id: source-extracts-32-bit-value-bytes
    desc: Extracts bytes from a 32-bit value
    crit: baseline
    conf: 0.95
    near_lines: 8
    all:
      - id: source-right-shift-24-bits
      - id: source-right-shift-16-bits
      - id: source-right-shift-8-bits
