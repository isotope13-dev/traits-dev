# Value-to-bytes conversion: integer read/write calls, endianness conversion,
# and field codecs that pack or unpack multi-byte values. Each atom proves a
# conversion operation; framing and intent come from referencing composites.
defaults:
  crit: notable
  conf: 0.85

traits:
  - id: integer-read-method-call
    desc: Java integer read or get method call
    platforms: [android, unix, windows]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\b(readInt|getInt)\s*\('

  - id: integer-write-method-call
    desc: Java integer write or put method call
    platforms: [android, unix, windows]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\b(writeInt|putInt)\s*\('

  - id: managed-read-int32-reference
    desc: ReadInt32 member-name token
    crit: component
    conf: 0.88
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      word: ReadInt32
    unless:
      - id: metadata/build/generated::winmd-metadata

  - id: managed-write-int32-reference
    desc: WriteInt32 member-name token
    crit: component
    conf: 0.88
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      word: WriteInt32

  - id: network-header-htons-field
    desc: Converts protocol field to network order
    platforms: [windows, linux, macos]
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '\bhtons\s*\(\s*(type|code)\s*\)'

  - id: go-big-endian-uint16-write
    desc: Writes a 16-bit big-endian value in Go
    platforms: [windows, linux, macos]
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.PutUint16

  - id: go-big-endian-uint16-append
    desc: Appends a 16-bit big-endian value in Go
    platforms: [windows, linux, macos]
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.AppendUint16

  - id: go-big-endian-uint32-write
    desc: Writes a 32-bit big-endian value in Go
    platforms: [windows, linux, macos]
    for: [go]
    if:
      type: symbol
      kind: call
      exact: binary.BigEndian.PutUint32

  # Unlike the Go atoms above, `to_be_bytes()` is an inherent method on every
  # Rust integer type, so the width is not observable from the call site — it
  # fires equally for u16, u32, u64 and the signed forms. Name and describe it
  # for the byte-order conversion it actually proves, not a width it doesn't.
  - id: rust-big-endian-byte-conversion
    desc: Rust integer to big-endian bytes
    platforms: [windows, linux, macos]
    for: [rust]
    if:
      type: text
      regex: '\bto_be_bytes\s*\(\s*\)'

  - id: python-big-endian-hhii-pack
    desc: Packs Python big-endian HHII fields
    conf: 0.94
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^struct\.pack(_into)?$'
      arg:
        kind: string
        exact: ">HHII"

  - id: struct-pack-two-field-header
    desc: Packs a two-field big-endian header
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: text
      regex: 'struct\.pack\s*\(\s*["'']!HH["'']'

  # Packs a machine address as a little-endian pointer-sized word — the
  # return-address / gadget overwrite an exploit splices into its buffer.
  # Requires a 5+ hex-digit value so ordinary small packed constants (flags,
  # lengths) do not match.
  - id: struct-pack-le-address
    desc: Packs a little-endian machine address
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: text
      regex: 'struct\.pack\s*\(\s*["'']<[ILQ]["'']\s*,\s*0x[0-9a-fA-F]{5,}'

  - id: uint16-be-buffer-write
    desc: Writes 16-bit big-endian buffer value
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.writeUInt16BE\s*\('

  - id: node-buffer-tostring-call
    desc: Converts Node.js Buffer output to text
    conf: 0.88
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: Buffer.from.toString

  - id: node-buffer-from-json-stringify
    desc: Creates Node.js Buffer from JSON serialization
    conf: 0.94
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Buffer\.from\s*\(\s*JSON\.stringify\s*\('

  - id: buffer-from-utf8
    desc: Creates Node.js Buffer from UTF-8 text
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        kind: string
        exact: utf8

  # Length-prefixed buffers are common protocol mechanics. Parsing a UInt64
  # length at offset zero and writing exactly the following byte slice is
  # useful evidence of payload carving, but does not establish malicious
  # intent alone.
  - id: powershell-uint64-length-at-offset-zero
    desc: Reads UInt64 length at offset zero
    conf: 0.96
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[BitConverter\]::ToInt64\s*\(\s*\$\w+\s*,\s*0\s*\)'

  # `buf[i] = (hi << 4) | lo` is the universal two-nibbles-into-a-byte pack.
  # Linux's HDMI-CEC helpers (`msg[5] = (input_port << 4) | hpd_state`) and any
  # BCD/hex codec write it. The custom-alphabet Base16 composite in
  # objectives/anti-static/obfuscation/encoding/hex/ references it and adds the
  # offset-alphabet nibble decodes that make it an obfuscation decoder.
  - id: nibble-pack-byte-assignment
    desc: Packs two nibbles into a byte
    crit: baseline
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\w+\[\w+\]\s*=\s*\(\w+\s*<<\s*4\)\s*\|\s*\w+'

  - id: go-byte-slice-from-string
    desc: Converts a Go string literal to bytes
    crit: baseline
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [go]
    if:
      type: text
      regex: '\[\]byte\(\s*"[^"]{16,32}"\s*\)'

composite_rules:
  - id: managed-int32-read-write-pair
    desc: Paired managed 32-bit integer read and write methods
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    near_bytes: 512
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: managed-read-int32-reference
      - id: managed-write-int32-reference
