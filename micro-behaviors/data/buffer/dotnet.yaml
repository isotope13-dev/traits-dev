defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: managed-read-int32-reference
    desc: References a managed 32-bit integer read method
    crit: notable
    conf: 0.88
    if:
      type: text
      word: ReadInt32
    unless:
      - id: metadata/library/generated::winmd-metadata

  - id: managed-write-int32-reference
    desc: References a managed 32-bit integer write method
    crit: notable
    conf: 0.88
    if:
      type: text
      word: WriteInt32

composite_rules:
  - id: managed-int32-read-write-pair
    desc: Paired managed 32-bit integer read and write methods
    crit: notable
    conf: 0.9
    near_bytes: 512
    all:
      - id: managed-read-int32-reference
      - id: managed-write-int32-reference
