# Fixed-range buffer carving: a decoded buffer split into constant-offset fields
# is a packed-record parser — the writer and the reader agreed on a fixed
# header layout. In JavaScript that shape almost only arises around a
# hand-rolled cryptographic envelope (`salt | iv | tag | ciphertext`), because
# the standard containers (JWE, PEM, protobuf, CBOR) carry their own framing
# and are parsed by a library rather than by literal offsets. Adjacent-range
# reads (0,4)/(4,8) are the same technique applied to a transaction or frame
# prefix, and the PowerShell eight-byte-header slice below is its fixed-header
# sibling on Windows.
#
# Notable on its own: binary format readers do this legitimately, and hex
# offsets (`subarray(0x1c,0x2c)`) are how javascript-obfuscator prints the
# same code. The crypto composites supply the intent.
#
# Each atom matches one (method, radix) shape with no regex alternation, so a
# per-shape occurrence count stays precise; the composite below unions them.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
  - id: subarray-decimal-offset-pair
    desc: Subarray split at decimal offsets
    count_min: 3
    if:
      type: text
      regex: '\bsubarray\s*\(\s*\d{1,6}\s*,'

  - id: subarray-hex-offset-pair
    desc: Subarray split at hex offsets
    count_min: 3
    if:
      type: text
      regex: '\bsubarray\s*\(\s*0x[0-9a-fA-F]{1,4}\s*,'

  - id: slice-decimal-offset-pair
    desc: Slice split at decimal offsets
    count_min: 3
    if:
      type: text
      regex: '\bslice\s*\(\s*\d{1,6}\s*,'

  - id: slice-hex-offset-pair
    desc: Slice split at hex offsets
    count_min: 3
    if:
      type: text
      regex: '\bslice\s*\(\s*0x[0-9a-fA-F]{1,4}\s*,'

  # Fixed-width byte slicing is ordinary binary/protocol parsing. More
  # specific objectives must add semantic context before interpreting the
  # byte shape.
  - id: adjacent-four-byte-subarrays
    desc: Reads adjacent four-byte subarrays
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'subarray\s*\(\s*0\s*,\s*4\s*\).{0,120}subarray\s*\(\s*4\s*,\s*8\s*\)'

  - id: powershell-eight-byte-header-slice
    desc: Slices bytes after eight-byte header
    conf: 0.96
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '\$\w+\s*\[\s*8\s*\.\.\s*\(\s*7\s*\+\s*\$\w+\s*\)\s*\]'

  - id: powershell-fixed-44-byte-header-skip
    desc: Reads buffer after fixed 44-byte header
    conf: 0.94
    crit: notable
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?is)\[IO\.File\]::Open\([^\r\n]{1,200}\)[\s\S]{0,420}\$\w+\s*=\s*44\b'

  - id: go-seek-call
    desc: Go calls a Seek method
    crit: notable
    conf: 0.88
    platforms: [windows, linux, macos]
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.Seek$'

composite_rules:
  - id: fixed-offset-buffer-fields
    desc: Buffer split at three fixed offsets
    conf: 0.8
    any:
      - id: subarray-decimal-offset-pair
      - id: subarray-hex-offset-pair
      - id: slice-decimal-offset-pair
      - id: slice-hex-offset-pair
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/

  - id: powershell-uint64-length-prefixed-file-carve
    desc: Carves UInt64-length-prefixed file
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [powershell]
    all:
      - id: micro-behaviors/data/buffer/convert::powershell-uint64-length-at-offset-zero
      - id: powershell-eight-byte-header-slice
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
    near_lines: 8
