traits:
- platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.9
  id: python-length-prefix-expression
  desc: Starts bytes construction from a length
  size_max: 50000
  if:
    type: text
    regex: bytes\s*\(\s*\[\s*len\s*\(
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/scripted/
    - id: metadata/lang/source/naming/security::wpsecscan-check-module
    - id: metadata/path/directory::test-directory-component
