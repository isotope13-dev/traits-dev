# The variable name is evidence of a packed address, not a WPS overwrite.
defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, go, rust, javascript, typescript]
  crit: notable
  conf: 0.93
traits:
  - id: pack-named-system-address
    desc: Packs a value named system_plt or system_addr
    conf: 0.93
    if:
      type: text
      regex: '(?i)(struct\.pack|\bp32)\s*\([^\n;]{0,80}(system_plt|system_addr)'

  - id: putuint-named-system-value
    desc: Writes named system value into integer bytes
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: '(?i)(PutUint32|PutUint64)\s*\([^\n;]{0,80}system'

