# Preserved Windows PE/DLL observations, classified by their supported operation.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: htons-api-ordinal
    desc: Network byte order conversion
    crit: notable
    conf: 0.84
    if:
      type: yara
      source: |
        import "pe"
        rule htons_api_ordinal {
          strings:
            $library = "WS2_32.dll" ascii nocase
          condition:
            $library and
            pe.imports("WS2_32.dll", 9)
        }

