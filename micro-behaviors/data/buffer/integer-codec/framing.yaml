# Length and framing fields: the buffer, specifically the integer width and
# length-prefix kind. These declare or read the multi-byte length, count, and
# flag words that frame a record rather than converting payload byte order
# (see endian.yaml). Relocated from micro-behaviors/data/buffer/, whose trait
# count exceeded the per-directory cap, with matchers and scopes unchanged.
defaults:
  platforms: [windows, linux, macos]
  crit: notable

traits:
  # Generic DataInput/ByteBuffer calls. Framing composites add nearby socket
  # and buffer evidence before describing these as a message length.
  - id: integer-read-method-call
    desc: Java integer read or get method call
    crit: notable
    platforms: [android, unix, windows]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\b(readInt|getInt)\s*\('

  - id: integer-write-method-call
    desc: Java integer write or put method call
    crit: notable
    platforms: [android, unix, windows]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\b(writeInt|putInt)\s*\('

  - id: inline-upper-word-frame-length
    desc: ORs upper-word constant into frame length
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*(\|=|=.{0,40}\|)\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: frame-length-upper-word-flag
    desc: Declares upper-word frame-length flag
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b\w*(FRAME|LENGTH)\w*BIT\s*=\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: named-frame-length-flag-or
    desc: ORs named flag into frame length
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*=.{0,40}\|\s*\w*BIT\b'

  - id: struct-pack-two-field-header
    desc: Packs a two-field big-endian header
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: 'struct\.pack\s*\(\s*["'']!HH["'']'

composite_rules:
  - id: named-upper-word-frame-length
    desc: Applies upper-word flag to frame length
    crit: notable
    conf: 0.94
    for: [scripts, source]
    all:
      - id: frame-length-upper-word-flag
      - id: named-frame-length-flag-or
