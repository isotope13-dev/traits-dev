# Length and framing fields: the buffer, specifically the integer width and
# length-prefix kind. These declare or read the multi-byte length, count, and
# flag words that frame a record rather than converting payload byte order
# (see endian.yaml). Relocated from micro-behaviors/data/buffer/, whose trait
# count exceeded the per-directory cap, with matchers and scopes unchanged.
defaults:
  platforms: [windows, linux, macos]
  crit: notable

traits:
  # Generic one-byte length framing used by DNS labels, DHCP suboptions, and
  # other TLV protocols. Protocol-specific composites provide the identity.
  - id: python-single-byte-length-prefix
    desc: Encodes a one-byte payload length prefix
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [python]
    size_max: 50000
    if:
      type: text
      regex: 'bytes\s*\(\s*\[\s*len\s*\(\s*\w+\s*\)\s*\]\s*\)'
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness/
        - id: metadata/package/testing/scripted/
        - id: well-known/tool/detection/security-scanner::wpsecscan-check-module

  - id: javascript-single-byte-length-prefix
    desc: Encodes a one-byte payload length prefix
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(Buffer\.from|Uint8Array\.of)\s*\(\s*\[?\s*\w+\.length\s*\]?\s*\)'

  - id: go-byte-length-literal
    desc: Encodes a one-byte payload length prefix
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [go]
    if:
      type: text
      regex: '\[\]byte\s*\{\s*byte\s*\(\s*len\s*\(\s*\w+\s*\)\s*\)\s*\}'

  - id: go-byte-length-append
    desc: Appends a one-byte payload length prefix
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [go]
    if:
      type: text
      regex: 'append\s*\(.{1,40},\s*byte\s*\(\s*len\s*\(\s*\w+\s*\)\s*\)\s*\)'

  - id: rust-single-byte-length-prefix
    desc: Encodes a one-byte payload length prefix
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [rust]
    if:
      type: text
      regex: '\[\s*\w+\.len\s*\(\s*\)\s+as\s+u8\s*\]'

  - id: native-single-byte-length-prefix
    desc: Stores a one-byte payload length prefix
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [c, cpp]
    if:
      type: text
      regex: '\b(u?int8_t|unsigned\s+char)\s+\w*(len|length)\w*\s*=\s*(strlen|sizeof)\s*\('

  # Generic DataInput/ByteBuffer calls. Framing composites add nearby socket
  # and buffer evidence before describing these as a message length.
  - id: integer-read-method-call
    desc: Java integer read or get method call
    crit: notable
    platforms: [android, unix, windows]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\b(readInt|getInt)\s*\('

  - id: integer-write-method-call
    desc: Java integer write or put method call
    crit: notable
    platforms: [android, unix, windows]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\b(writeInt|putInt)\s*\('

  - id: inline-upper-word-frame-length
    desc: ORs upper-word constant into frame length
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*(\|=|=.{0,40}\|)\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: frame-length-upper-word-flag
    desc: Declares upper-word frame-length flag
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b\w*(FRAME|LENGTH)\w*BIT\s*=\s*0x0*[1-9a-f][0-9a-f]{4,7}\b'

  - id: named-frame-length-flag-or
    desc: ORs named flag into frame length
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(declared|frame_len)\w*\s*=.{0,40}\|\s*\w*BIT\b'

  - id: struct-pack-two-field-header
    desc: Packs a two-field big-endian header
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: 'struct\.pack\s*\(\s*["'']!HH["'']'

composite_rules:
  - id: single-byte-length-prefix
    desc: Encodes a one-byte payload length prefix
    crit: notable
    any:
      - id: python-single-byte-length-prefix
      - id: javascript-single-byte-length-prefix
      - id: go-byte-length-literal
      - id: go-byte-length-append
      - id: rust-single-byte-length-prefix
      - id: native-single-byte-length-prefix

  - id: named-upper-word-frame-length
    desc: Applies upper-word flag to frame length
    crit: notable
    conf: 0.94
    for: [scripts, source]
    all:
      - id: frame-length-upper-word-flag
      - id: named-frame-length-flag-or
