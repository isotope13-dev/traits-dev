# Network order converts integers; it does not parse an IP address.
# Matchers and effective source/platform scopes preserved from ip/parse.
defaults:
  crit: notable
  conf: 0.66
  platforms: [windows, linux, macos]
  for: [c, cpp, go, rust, elf, macho, so, pe]
traits:
  - id: htons-symbol
    desc: Converts host to network short
    if:
      type: symbol
      exact: htons
  - id: htonl-symbol
    desc: Converts host to network long
    if:
      type: symbol
      exact: htonl
  - id: ntohs-symbol
    desc: Converts network to host short
    if:
      type: symbol
      exact: ntohs
  - id: ntohl-symbol
    desc: Converts network to host long
    if:
      type: symbol
      exact: ntohl
composite_rules:
  - id: byte-order
    desc: Network byte order conversion
    any:
      - id: htons-symbol
      - id: htonl-symbol
      - id: ntohs-symbol
      - id: ntohl-symbol
