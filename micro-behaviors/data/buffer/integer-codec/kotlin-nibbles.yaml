defaults:
  for: [kotlin]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: kotlin-high-nibble-helper-call
    desc: Passes high nibble to helper
    if:
      type: text
      regex: '\b\w+\([^,(\r\n]{1,80},\s*\w+\.toInt\(\)\s+shr\s+4\s*\)'
  - id: kotlin-low-nibble-helper-call
    desc: Passes low nibble to helper
    if:
      type: text
      regex: '\b\w+\([^,(\r\n]{1,80},\s*\w+\.toInt\(\)\s+and\s+15\s*\)'
composite_rules:
  - id: kotlin-nibble-pair-helper-calls
    desc: Passes high and low byte nibbles to nearby helpers
    near_lines: 4
    all:
      - id: kotlin-high-nibble-helper-call
      - id: kotlin-low-nibble-helper-call
