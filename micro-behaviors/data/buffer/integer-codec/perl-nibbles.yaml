defaults:
  platforms:
  - unix
  for:
  - perl
  crit: notable
  conf: 0.98
traits:
- id: perl-byte-high-nibble-call
  desc: Perl passes high nibble to helper
  if:
    type: text
    regex: \b\w+\(\s*[^,(\n]{1,80},\s*\$\w+\s*>>\s*(4|0x4)\s*\)
- id: perl-byte-low-nibble-call
  desc: Perl passes low nibble to helper
  if:
    type: text
    regex: \b\w+\(\s*[^,(\n]{1,80},\s*\$\w+\s*&\s*(15|0x[fF])\s*\)
- id: perl-unpack-byte-iteration
  desc: Perl iterates unpacked unsigned bytes
  conf: 0.98
  if:
    type: text
    regex: for\s+my\s+\$\w+\s*\(\s*unpack\s+["\']C\*["\']
