defaults:
  platforms: [linux, macos, windows]
  for: [class]
traits:
  - id: jvm-long-to-ipv4-octets
    desc: JVM shifts long into masked IPv4 octets
    crit: notable
    conf: 0.98
    if:
      type: hex
      # lload; bipush 24; lshr; ldc2_w mask; land; Long.valueOf;
      # aastore, followed by the same sequence at shift 16 and shift 8.
      # Pool indexes and local slots vary; no package or host is required.
      pattern: '16 ?? 10 18 7B 14 ?? ?? 7F B8 ?? ?? 53 59 04 16 ?? 10 10 7B 14 ?? ?? 7F B8 ?? ?? 53 59 05 16 ?? 10 08 7B 14 ?? ?? 7F'
