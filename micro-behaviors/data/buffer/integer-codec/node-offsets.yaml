defaults:
  platforms:
  - unix
  - windows
  - fortios
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
  mbc: C0001
traits:
- id: node-be32-length-plus-one-write
  desc: Writes length plus one as big-endian u32
  if:
    type: text
    regex: writeUInt32BE\s*\([^,\r\n]{1,64}\+\s*1\s*,\s*0\s*\)
- id: node-u8-offset-four-write
  desc: Writes unsigned byte at buffer offset four
  if:
    type: text
    regex: writeUInt8\s*\([^,\r\n]{1,48},\s*4\s*\)
- id: node-be32-offset-zero-read
  desc: Reads big-endian u32 at buffer offset zero
  if:
    type: text
    regex: readUInt32BE\s*\(\s*0\s*\)
- id: node-u8-offset-four-read
  desc: Reads unsigned byte at buffer offset four
  if:
    type: text
    regex: readUInt8\s*\(\s*4\s*\)
