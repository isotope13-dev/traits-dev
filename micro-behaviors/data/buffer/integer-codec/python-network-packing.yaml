# Binary packing formats do not by themselves establish DNS or exfiltration.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
traits:
- conf: 0.9
  id: python-pack-network-u16-fields
  desc: Packs four to six network-order uint16 fields
  if:
    type: text
    regex: struct\.pack\s*\(\s*["']!H{4,6}["']
  unless:
  - id: well-known/tool/development/mobile/pymobiledevice3
- conf: 0.85
  id: python-pack-network-u16-pair-pattern
  desc: Network-order uint16 pair packing pattern
  if:
    type: text
    regex: struct\.pack\s*\(\s*["']!HH["'].{0,20}1\s*,\s*1
- conf: 0.97
  id: python-pack-network-hhih
  desc: Packs network-order HHIH integer fields
  if:
    type: symbol
    kind: call
    exact: struct.pack
    arg:
      index: 0
      kind: string
      exact: '!HHIH'
- conf: 0.96
  id: python-pack-network-hbb
  desc: Packs network-order HBB integer fields
  if:
    type: symbol
    kind: call
    exact: struct.pack
    arg:
      index: 0
      kind: string
      exact: '!HBB'
- conf: 0.85
  id: python-pack-network-u16-length
  desc: Packs length in network-order uint16
  if:
    type: text
    regex: struct\.pack\s*\(\s*["']!H["'].{0,30}len\s*\(
