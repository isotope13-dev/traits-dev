defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, rust, go, ruby]

traits:
  - id: uint24-big-endian-serialize
    desc: Serializes three-byte big-endian fields
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '\.to_bytes\(\s*3\s*,\s*["\x27]big["\x27]\s*\)'
