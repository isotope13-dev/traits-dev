defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: buffer-from-call
    desc: Calls Buffer.from at least three times
    crit: notable
    conf: 0.4
    count_min: 3
    if:
      type: string_literal
      substr: Buffer.from

  - id: uint8array-from
    desc: Constructs byte array from iterable
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: Uint8Array.from

  # Canonical typed-array allocation atom. Allocating a byte buffer is ordinary
  # JavaScript (base64 decode, binary I/O, crypto), so it stays baseline here
  # rather than living in an exploit-flavoured directory; the JIT-primitive and
  # Durable-Objects composites reference it cross-directory and supply the
  # intent from their other legs.
  - id: uint8array-constructor
    desc: Constructs a Uint8Array buffer
    crit: baseline
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+Uint8Array\s*\('

  - id: arraybuffer-constructor
    desc: Constructs a JavaScript ArrayBuffer
    crit: baseline
    conf: 0.94
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+ArrayBuffer\s*\('

  - id: uint16-be-buffer-write
    desc: Writes 16-bit big-endian buffer value
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.writeUInt16BE\s*\('

  - id: node-buffer-tostring-call
    desc: Converts Node.js Buffer output to text
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: Buffer.from().toString

  - id: node-buffer-from-json-stringify
    desc: Creates Node.js Buffer from JSON serialization
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Buffer\.from\s*\(\s*JSON\.stringify\s*\('

  - id: buffer-from-utf8
    desc: Creates Node.js Buffer from UTF-8 text
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        kind: string
        exact: utf8
