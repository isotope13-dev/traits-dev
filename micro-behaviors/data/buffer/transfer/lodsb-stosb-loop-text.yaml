---
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
composite_rules:
- id: asm-string-instructions-loop
  desc: Nearby LODSB, STOSB and LOOP mnemonic text
  crit: notable
  near_bytes: 256
  all:
  - id: micro-behaviors/data/buffer/read::asm-lodsb
  - id: micro-behaviors/data/buffer/write::asm-stosb
  - id: metadata/binary/instruction/sequence/control-flow::asm-loop-dup
