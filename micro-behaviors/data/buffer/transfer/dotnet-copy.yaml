# CopyTo also applies to arrays/collections: the method name alone does not
# establish a network stream or transfer direction. Keep one canonical pair.
defaults:
  for: [csharp, powershell]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: dotnet-copyto-call
    desc: Calls .NET CopyTo or CopyToAsync
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.\s*CopyTo(Async)?\s*\('
  - id: dotnet-multiple-copyto-calls
    desc: Multiple .NET CopyTo or CopyToAsync calls
    conf: 0.95
    count_min: 2
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.\s*CopyTo(Async)?\s*\('
