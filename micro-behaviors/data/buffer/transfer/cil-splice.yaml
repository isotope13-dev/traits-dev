defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cil-delimited-byte-array-writes
    desc: CIL array writes around a delimiter loop
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule cil_delimited_byte_array_writes {
          strings:
            $write = "WriteByte" ascii fullword
            $splice = {
              11 ?? 11 ?? 91 13 ?? 11 ?? 11 ?? 6F ?? ?? ?? 0A
              [12-64]
              11 ?? 1F ?? 6F ?? ?? ?? 0A
              [8-32]
              1F ?? 31 ??
              [8-40]
              11 ?? 11 ?? 91 13 ?? 11 ?? 11 ?? 6F ?? ?? ?? 0A
            }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
