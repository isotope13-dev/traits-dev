# An io.Writer-style call can target memory, a file, or a socket; the method
# alone establishes no process channel. Keep the matcher and severity when
# relocating it from process/io/stream.
defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: go-write-method-call
    desc: Go Write/WriteAt method call
    crit: notable
    conf: 0.65
    if:
      type: symbol
      kind: call
      regex: '\.Write(At)?$'
  # The argument provenance joins the write site to its buffer origin, so this
  # says the written data is a fill (zeroed, repeated, or random), not merely
  # that some Write happened nearby. This is the overwrite shape of Go file
  # shredders; small literal writes keep only go-write-method-call.
  - id: go-fill-buffer-write
    desc: Go writes a fill or pattern buffer
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '\.Write(At)?$'
      arg:
        index: 0
        from:
          call: '^(make|bytes\.Repeat|rand\.Read)$'
