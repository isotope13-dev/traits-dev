# Buffer transfer: the buffer, specifically the copy/move/stream kind.
# Anything that moves bytes from one place to another — memory copies,
# stream pumps, output writes, reassembly concatenations — lives here;
# allocation lives in alloc/allocation.yaml, integer encode/decode in
# integer-codec/, and slicing, packing, and record surgery in
# record/surgery.yaml and carve/carving.yaml. Scopes are explicit per trait.
defaults:
  platforms: [windows, linux, macos]

traits:
  - id: php-buffer-read-until-length
    desc: PHP accumulates buffer to declared length
    crit: notable
    conf: 0.86
    for: [php]
    if:
      type: text
      regex: 'while\s*\(\s*strlen\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\)\s*<\s*\$len'

  - id: go-io-copy
    desc: Copies data with Go io.Copy
    crit: notable
    conf: 0.9
    for: [go, elf, macho, pe, wasm]
    if:
      type: symbol
      exact: io.Copy

  - id: go-bytes-buffer-io
    desc: Go bytes.Buffer I/O
    crit: baseline
    conf: 0.7
    for: [go, elf, macho, pe, wasm]
    if:
      type: text
      regex: \.(ReadFrom|WriteTo)
  - id: go-bytes-buffer-methods
    desc: Go bytes.Buffer methods
    crit: baseline
    conf: 0.7
    for: [go, elf, macho, pe, wasm]
    if:
      type: text
      regex: \.(ReadByte|WriteByte|WriteString)\b

  - id: go-seek-call
    desc: Go calls a Seek method
    crit: notable
    conf: 0.88
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.Seek$'

  # The generic source-level stream writes -- `.Write($buf)` and the
  # write-then-end pair -- are canonical in micro-behaviors/process/io/stream/
  # alongside the rest of the stream-handle family; reference them as
  # micro-behaviors/data/buffer/transfer::stream-write-buffer-arg and
  # ::javascript-write-then-end-stream rather than re-declaring them here.

  - id: jvm-outputstream-write
    desc: JVM writes bytes to output stream
    crit: baseline
    conf: 0.96
    platforms: [unix, windows]
    for: [class]
    if:
      type: import
      exact: java/io/OutputStream.write

  # Relocated from objectives/command-and-control/backdoor/loader/archive/,
  # where a reference to the JDK's in-memory byte buffer was filed as backdoor
  # loader evidence. Half of all Java code accumulates bytes this way, so the
  # atom carries no staging intent -- the loader composites supply that by
  # pairing it with the JAR walk and defineClass. The input-side sibling is
  # bytearrayinputstream-ref below.
  - id: bytearrayoutputstream-ref
    desc: Java ByteArrayOutputStream class
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [class]
    if:
      type: import
      exact: java/io/ByteArrayOutputStream

  - id: bytearrayinputstream-ref
    desc: Java ByteArrayInputStream class
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/io/ByteArrayInputStream

  # The synthetic default-argument bridge kotlinc emits for kotlin.io's
  # `copyTo` extensions (InputStream.copyTo, File.copyTo, Path.copyTo), i.e.
  # the app pumps one stream into another with the stdlib helper rather than a
  # hand-written read/write loop. Relocated from
  # micro-behaviors/communications/http/post (2026-08), where it described a
  # stream copy as an HTTP POST; the exfil composites that pair it with a
  # POST leg still reference it here.
  - id: kotlin-bytecode-copyto-default
    desc: Kotlin stdlib copyTo stream-copy bridge
    crit: notable
    conf: 0.86
    platforms: [unix, windows, android]
    for: [class]
    if:
      type: hex
      pattern: 63 6F 70 79 54 6F 24 64 65 66 61 75 6C 74

  # Joining staged fragments is a neutral buffer operation.
  - id: powershell-write-concat-byte-arrays
    desc: Writes concatenation of two byte arrays
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)::\s*WriteAllBytes\s*\([^\r\n)]{0,120}\$\w+\s*\+\s*\$\w+\s*\)'

  - id: payload-buffer-concatenation
    desc: Concatenates serialized bytes with payload
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '\bbytes\s*\([^\)\r\n]{1,80}\)\s*\+\s*payload\b'

  # Padding a buffer by concatenating a fresh allocation is a neutral
  # allocation mechanic (crypto padding, protocol framing). Relocated from
  # objectives/command-and-control/dropper/.../javascript (as
  # js-buffer-concat-alloc-pad), where every padded buffer read as dropper
  # staging. Dropper meaning comes from the write+exec composite that
  # references this atom, not from the concatenation itself.
  - id: node-buffer-concat-alloc
    desc: Concatenates buffer with fresh allocation
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Buffer\.concat\(\s*\[[^\]]{0,80}Buffer\.alloc\('

  # Arrays.copyOfRange slices an array; relocated from
  # objectives/anti-static/obfuscation/string/crypto (java-byte-range-copy),
  # where every class slicing a byte array read as string-decryption.
  - id: jvm-array-copy-of-range
    desc: JVM class calls Arrays.copyOfRange
    crit: notable
    conf: 0.7
    platforms: [unix, windows]
    for: [class]
    if:
      type: text
      substr: copyOfRange
