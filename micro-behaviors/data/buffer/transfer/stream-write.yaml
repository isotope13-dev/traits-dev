# Generic stream buffer writes do not establish process I/O.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, python, javascript]
  crit: notable
  conf: 0.9
traits:
  - id: stream-write-buffer-arg
    desc: Writes a buffer argument to a stream
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\.Write\s*\(\s*\$?buf'

  - id: powershell-dual-stream-buffer-write
    desc: Multiple PowerShell stream buffer writes
    for: [powershell]
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: '(?i)\$\w+\.Write\s*\(\s*\$\w+\s*,\s*0\s*,'

