# Generic stream buffer writes do not establish process I/O.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, python, javascript]
  crit: notable
  conf: 0.9
traits:
  - id: stream-write-buffer-arg
    desc: Writes a buffer argument to a stream
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\.Write\s*\(\s*\$?buf'

