defaults:
  for: [javascript, typescript, html]
  platforms: [windows, unix, android]

traits:
  - id: typed-array-set-copy
    desc: Copies values through a typed-array view
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+Uint8Array\([^\n)]{1,120}\)[\s\S]{0,200}\.set\('
