defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: struct-pack-two-field-header
    desc: Packs a two-field big-endian header
    crit: notable
    if:
      type: text
      regex: 'struct\.pack\s*\(\s*["'']!HH["'']'

  - id: payload-buffer-concatenation
    desc: Appends payload to encoded bytes
    crit: notable
    if:
      type: text
      regex: '\)\s*\+\s*payload\b'
