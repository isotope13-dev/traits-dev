defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: repeated-ff-byte-buffer
    desc: Python byte buffer repeats 0xFF
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'b["'']\\xff["'']\s*\*\s*(\w+|[1-9][0-9]{1,3})\b'

  - id: repeated-ff-signature-buffer
    desc: Signature-named buffer repeats 0xFF bytes
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b\w*(sig|signature)\w*\s*=\s*b["'']\\xff["'']\s*\*\s*(64|128|256|384|512)\b'

  - id: struct-pack-two-field-header
    desc: Packs a two-field big-endian header
    crit: notable
    if:
      type: text
      regex: 'struct\.pack\s*\(\s*["'']!HH["'']'

  - id: payload-buffer-concatenation
    desc: Concatenates serialized bytes with payload
    crit: notable
    if:
      type: text
      regex: '\bbytes\s*\([^\)\r\n]{1,80}\)\s*\+\s*payload\b'
