# In-place byte mutation and fragment reassembly: XOR-mutated indexed bytes,
# nibble reconstruction, and concatenation of staged fragments. Each atom
# proves bytes were transformed or joined; decoder and staging composites add
# the iteration, key, and sink context that make it a decoder or a dropper.
defaults:
  crit: notable
  conf: 0.92

traits:
  - id: named-byte-replacement-routine
    desc: References a named byte-replacement routine
    conf: 0.9
    platforms: [windows, unix]
    for: [c, cpp, python, lua]
    if:
      type: text
      regex: '(?i)\b(replace_bytes|replace_matching_bytes)\b'

  # A single indexed XOR assignment proves a byte mutation, not decoding.
  # Decoder objectives add iteration or buffer-rebuild context separately.
  - id: indexed-byte-xor-mutation
    desc: XOR-mutates an indexed byte
    platforms: [windows, unix]
    for: [python, c, cpp, go, rust, javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\[[^\]\n]{1,24}\]\s*\^=\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test

  - id: indexed-byte-xor-nontrivial-mask
    desc: XOR-mutates indexed byte with non-1 mask
    platforms: [windows, unix]
    for: [python, c, cpp, go, rust, javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\[[^\]\n]{1,24}\]\s*\^=\s*0x0*[2-9A-Fa-f]'

  # This is intentionally a component: a bare assignment to a filter-like
  # variable is meaningful only when an objective adds the filter contents.
  # Anchoring at the statement start avoids matching the tail of
  # `object->filter = filter;` as though the local variable were rewritten.
  - id: bare-filter-variable-assignment
    desc: Bare filter variable assignment statement
    conf: 0.85
    platforms: [windows, linux, macos]
    for: [c, cpp]
    if:
      type: text
      regex: '(?m)^[ \t]*(buf|filter|expr|prog|cmdbuf)\s*=\s*("[^"\n]{0,60}"|\w{1,20})\s*;'

  # Pairing the low four bits of adjacent carrier bytes is a neutral byte
  # reconstruction primitive. Audio/image steganography composites provide
  # the carrier context and execution sink.
  - id: powershell-low-nibble-shift
    desc: Shifts a PowerShell low nibble four bits
    conf: 0.96
    attack: T1140
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)-band\s+(0x0?f|15)\s*\)\s*-shl\s+4'

  - id: powershell-low-nibble-or
    desc: ORs a second PowerShell low nibble
    conf: 0.96
    attack: T1140
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)-bor\s*\([^\)\r\n]{1,80}-band\s+(0x0?f|15)\s*\)'

  - id: payload-buffer-concatenation
    desc: Concatenates serialized bytes with payload
    conf: 0.85
    platforms: [windows, linux, macos]
    for: [python]
    if:
      type: text
      regex: '\bbytes\s*\([^\)\r\n]{1,80}\)\s*\+\s*payload\b'

composite_rules:
  - id: powershell-lower-nibble-pair-merge
    desc: Merges two PowerShell low nibbles
    conf: 0.98
    platforms: [windows]
    for: [powershell]
    attack: T1140
    all:
      - id: powershell-low-nibble-shift
      - id: powershell-low-nibble-or
    near_lines: 2
