# A modulo-indexed array commonly implements cyclic access to a key or lookup
# buffer. This trait deliberately describes only the access pattern; composites
# establish whether the indexed buffer participates in decoding or decryption.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vba-modulo-indexed-array
    desc: VBA modulo-indexed array access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\s*\(\s*\w+\s+Mod\s+\w+\s*\)'
