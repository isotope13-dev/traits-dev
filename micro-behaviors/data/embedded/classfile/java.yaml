# Embedded Java Classfile in Byte Array
# Detects Java classfile magic (CAFEBABE) encoded as signed byte array
# The classfile marker is structural; loading intent requires a runtime class
# definition call as well.
# MBC: C0026 (Encoding)
defaults:
  platforms: [windows, unix]
  for: [python, java, class]

traits:
  - id: cafebabe-signed-bytes
    desc: Java classfile magic as signed byte array
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: -54, -2, -70, -66

  - id: cafebabe-hex-bytes
    desc: Java classfile magic as hex byte array
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 0xCA, 0xFE, 0xBA, 0xBE

  - id: byte-array-initializer
    desc: Java byte array initializer
    crit: component
    conf: 0.9
    if:
      type: text
      regex: byte\[\].{0,80}=\s*new\s+byte\[\]

  - id: runtime-define-class
    desc: Java defineClass runtime call
    crit: notable
    conf: 0.92
    for: [java]
    if:
      type: symbol
      kind: call
      exact: defineClass

  - id: runtime-define-anonymous-class
    desc: Java anonymous class definition call
    crit: notable
    conf: 0.92
    for: [java]
    if:
      type: symbol
      kind: call
      exact: defineAnonymousClass

composite_rules:
  - id: runtime-class-definition-call
    desc: Java runtime class definition call
    crit: notable
    conf: 0.92
    any:
      - id: runtime-define-class
      - id: runtime-define-anonymous-class
  - id: embedded-java-classfile
    desc: Embedded Java classfile in source code
    crit: suspicious
    conf: 0.95
    any:
      - id: cafebabe-signed-bytes
      - id: cafebabe-hex-bytes
    all:
      - id: byte-array-initializer
      - id: runtime-class-definition-call
