# Java classfile magic (CAFEBABE) at the start of a Base64 run: `yv66vg` is
# the encoding of 0xCAFEBABE, followed by the version and constant pool. A
# whole compiled class carried as text; loading it needs a separate
# class-definition leg.
defaults:
  platforms: [unix, windows]
  for: [xml, scripts, source, text]
  attack: T1027

traits:
  - id: base64-java-classfile
    desc: Base64-encoded Java classfile
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9+/])yv66vg[A-Za-z0-9+/]{200}'
