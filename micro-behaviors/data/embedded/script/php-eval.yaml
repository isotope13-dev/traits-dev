traits:
- platforms:
  - windows
  - unix
  for:
  - source
  - python
  id: embedded-php-variable-eval
  desc: String literal contains PHP variable evaluation
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/tool/detection/cert-x-gen::archive-member-prefix
  if:
    type: literal
    regex: (^|[^A-Za-z0-9_])@?eval\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*
