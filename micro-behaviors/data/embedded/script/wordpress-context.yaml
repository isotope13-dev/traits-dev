composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - -php
  id: wordpress-request-execution-fragment-context
  desc: WordPress/PHP request execution fragment context
  crit: notable
  conf: 0.999
  near_bytes: 1024
  all:
  - id: micro-behaviors/data/embedded/script::embedded-wordpress-plugin-header
  - id: micro-behaviors/data/embedded/script::embedded-php-command-exec-call
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
