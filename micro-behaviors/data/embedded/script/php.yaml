# A PHP code fragment embedded inside a JavaScript carrier.
#
# Neutral on its own: server-side templating routinely leaves `<?php echo … ?>`
# in a file that ships with a `.js` extension. Three of Photo Gallery's frontend
# scripts do exactly that (`"<?php echo $params_array['gallery_id']; ?>"`), and
# so do documentation bundles that render PHP samples. Whether the fragment ever
# executes depends on how the server routes the file, which no matcher here can
# see.
#
# The trojan reading — a webshell smuggled into a file reviewers read as
# JavaScript — comes from the composite in
# objectives/supply-chain/hidden-payload/trojan/php-script-polyglot.yaml, which
# pairs this fact with an embedded PHP eval and PHP request input. This atom was
# defined there as a `suspicious` trait named `javascript-embedded-php-open-tag`;
# in that directory the placement alone accused every templated plugin script,
# and it had begun collecting per-product exclusions.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98

traits:
  - id: embedded-php-open-tag
    desc: PHP code fragment embedded in JavaScript
    if:
      type: text
      # A bare tag is common in JavaScript documentation and completion
      # strings. Require a PHP token after it so the atom describes an
      # embedded code fragment rather than a quoted language marker.
      #
      # The comment run between the tag and that token has to be generous,
      # and there has to be room for more than one. Padding the gap with
      # decoy comments is the cheapest evasion there is — the attacker picks
      # the length, so any tight bound is one the payload simply steps over.
      # OpenX 2.8.10 opened with an 87-character fragment of real flowplayer
      # source (`/*if(e){jQuery.tools=jQuery.tools||{version:{}}; ... */`),
      # seven characters past the old 80-character budget, and the whole
      # webshell went unseen for it. Requiring the PHP token is what keeps
      # this honest; how much camouflage precedes it is not a safety margin.
      regex: '<\?php\s+((/\*[\s\S]{0,400}?\*/)\s*){0,4}(\$|[A-Za-z_])'
