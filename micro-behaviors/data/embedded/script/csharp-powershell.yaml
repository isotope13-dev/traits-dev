defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: csharp-powershell-hidden-command-text
    desc: C# literal with hidden PowerShell flag
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: 'powershell\s+-w\s+h(\s+-e)?'
  - id: csharp-iex-downloadstring-text
    desc: C# text with IEX DownloadString
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "iex ([System.Net.WebClient]::new()).DownloadString"
  - id: csharp-iex-base64-decode-text
    desc: C# literal with IEX Base64 decoder
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      substr: "iex ([System.Text.Encoding]::UTF8.GetString"
composite_rules:
  - id: csharp-encoded-powershell-command-profile
    desc: C# encoded PowerShell command clues
    crit: suspicious
    conf: 0.96
    all:
      - id: csharp-powershell-hidden-command-text
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string
    needs: 2
    any:
      - id: csharp-iex-downloadstring-text
      - id: csharp-iex-base64-decode-text
      - id: micro-behaviors/communications/transfer::csharp-upload-method-call
      - id: micro-behaviors/data/string/assembly::csharp-percent-variable-batch-obfuscation
  - id: csharp-command-upload-profile
    desc: C# command clues with Upload call
    crit: suspicious
    conf: 0.97
    all:
      - id: csharp-encoded-powershell-command-profile
      - id: csharp-iex-downloadstring-text
      - id: micro-behaviors/communications/transfer::csharp-upload-method-call
    any:
      - id: csharp-iex-base64-decode-text
      - id: micro-behaviors/data/string/assembly::csharp-percent-variable-batch-obfuscation
