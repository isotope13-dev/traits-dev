# Python source carried inside string literals.
defaults:
  platforms: [linux, macos, windows]

traits:
  - id: python-open-write-in-string
    desc: String embeds a Python open() for writing
    crit: notable
    platforms: [unix, windows]
    conf: 0.3
    for: [scripts, binaries]
    if:
      type: string_literal
      regex: open\([^)]{0,120}["'][wa]["']
