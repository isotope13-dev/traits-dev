defaults:
  platforms: [unix, windows]
  for: [documents, data, javascript]
composite_rules:
  - id: json-cookie-detached-or-unref-text
    desc: JSON cookie field contains detached or unref
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/embedded/script::json-cookie-detached-text
      - id: micro-behaviors/data/embedded/script::json-cookie-unref-text
