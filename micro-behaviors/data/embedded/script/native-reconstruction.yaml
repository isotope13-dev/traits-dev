# These literals are passed to output builders, rather than execution APIs.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.96
traits:
  - id: emits-uudecode-file-command
    desc: Builds uudecode-to-file shell command text
    if:
      type: symbol
      kind: call
      regex: '^(archive_string_sprintf|snprintf|sprintf|fprintf|fputs|puts)$'
      arg:
        kind: string
        regex: '^uudecode\s+-p\s*>'
  - id: emits-sed-line-unprefix-command
    desc: Builds sed command removing X line prefixes
    if:
      type: symbol
      kind: call
      regex: '^(archive_string_sprintf|snprintf|sprintf|fprintf|fputs|puts)$'
      arg:
        kind: string
        regex: '^sed\s+[''"]s/\^X//[''"]\s*>'
