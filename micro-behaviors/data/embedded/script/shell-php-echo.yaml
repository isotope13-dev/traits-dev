defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-php-echo-source-prefix
    desc: PHP echo source prefix in shell
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: well-known/tool/offensive/bughunter::bughunter-source-context
      # Source transformers may contain the generated PHP text as a quoted
      # replacement without constructing or uploading an executable payload.
      - type: text
        regex: "(?i)\\bperl\\b[^\\n]{0,200}['\"][^'\"]*<\\\\\\?=[^'\"]*['\"][^\\n]{0,100}['\"]<\\?php\\s+echo['\"]"
    if:
      type: text
      substr: '<?php echo'

