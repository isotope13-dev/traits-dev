defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-php-echo-source-prefix
    desc: PHP echo source prefix in shell
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: well-known/tool/offensive/bughunter::bughunter-source-context
      # Source transformers may contain the generated PHP text as a quoted
      # replacement without constructing or uploading an executable payload.
      - type: text
        regex: "(?i)\\bperl\\b[^\\n]{0,200}['\"][^'\"]*<\\\\\\?=[^'\"]*['\"][^\\n]{0,100}['\"]<\\?php\\s+echo['\"]"
      # Local smoke test: the snippet is executed by a local php binary,
      # never uploaded anywhere.
      - id: micro-behaviors/process/create/shell/stdin-feed::php-snippet-piped-into-php-stdin
      - id: micro-behaviors/process/create/shell/spawn::shell-executes-php
      # A tests/ script that writes `<?php echo` is building a local fixture,
      # not carrying a webshell upload payload.
      - id: metadata/package/testing/presence/harness::test-directory
    if:
      type: text
      substr: '<?php echo'

