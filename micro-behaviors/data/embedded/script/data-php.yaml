# PHP payload fragments embedded inside opaque binary/database files (such as
# SQLite databases planted under a .php path). Kept separate from source-language
# embedded PHP rules so binary data files do not broaden source/script rules.
defaults:
  platforms: [unix, windows]
  for: [data]
  conf: 0.95

traits:
  - id: data-php-open-tag
    desc: PHP opening tag in binary data
    crit: component
    conf: 0.96
    if:
      type: raw
      regex: '<\?((?i:php)\b|=[\t\n\r ]{0,16}[$A-Za-z_0-9(''"\[][\t\n\r -~]{0,512}\?>)'

  - id: data-php-request-superglobal
    desc: PHP request superglobal in binary data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST|COOKIE)\s*\['
    unless:
      - id: metadata/file/format/threat-intelligence::sqlite-article-corpus

  - id: data-php-raw-input-stream
    desc: PHP input stream reference in binary data
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'php://input'
    unless:
      - id: metadata/file/format/threat-intelligence::sqlite-article-corpus

  - id: data-php-shell-exec-call
    desc: PHP shell execution call in binary data
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(system|exec|shell_exec|passthru)\s*\('

  - id: data-php-eval-or-pipe-call
    desc: PHP eval or popen call in data
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(eval|assert|proc_open|popen)\s*\('

composite_rules:
  - id: data-php-tagged-exec
    desc: Embedded PHP execution code in binary data
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: data-php-open-tag
    any:
      - id: data-php-shell-exec-call
      - id: data-php-eval-or-pipe-call
    unless:
      - id: metadata/file/format/threat-intelligence::sqlite-article-corpus

  - id: data-php-request-webshell
    desc: Embedded PHP request input in binary data
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: data-php-open-tag
    any:
      - id: data-php-request-superglobal
      - id: data-php-raw-input-stream
    unless:
      - id: metadata/file/format/threat-intelligence::sqlite-article-corpus

  - id: embedded-php-code-exec-in-data
    desc: Embedded PHP payload in binary data
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: data-php-open-tag
    any:
      - id: data-php-request-superglobal
      - id: data-php-raw-input-stream
      - id: data-php-shell-exec-call
      - id: data-php-eval-or-pipe-call
    unless:
      - id: metadata/file/format/threat-intelligence::sqlite-article-corpus
