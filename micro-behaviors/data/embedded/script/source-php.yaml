# PHP upload handlers embedded as payload strings in exploit clients and
# generators. These are neutral payload mechanics; webshell intent is composed
# under objectives/ with host profiling and a browser upload surface.
defaults:
  platforms: [unix, windows]
  for: [source, python]
  crit: notable
  conf: 0.96

traits:
  - id: embedded-php-open-tag-literal
    desc: PHP open tag in source string
    for: [scripts, source, -php]
    if:
      type: text
      substr: '<?php'

  - id: embedded-php-file-put-contents
    desc: Embedded PHP calls file_put_contents
    crit: component
    for: [scripts, source, -php]
    if:
      type: text
      regex: '\bfile_put_contents\s*\('

  - id: embedded-php-superglobal-read
    desc: Embedded PHP request superglobal read
    crit: component
    for: [scripts, source, -php]
    if:
      type: text
      regex: '(?i)\$_(GET|POST|REQUEST|COOKIE)\s*\[\s*[''"\\$]'

  - id: embedded-php-var-command-call
    desc: Embedded PHP variable command call
    crit: component
    for: [scripts, source, -php]
    if:
      type: text
      regex: '(?i)\b(system|passthru|shell_exec|popen)\s*\(\s*\$'

  - id: embedded-php-eval-base64-fragment
    desc: Embedded PHP evaluates base64-decoded payload
    crit: notable
    for: [scripts, source, -php]
    if:
      type: text
      regex: '(?i)\beval\s*\(\s*(gzinflate\s*\(\s*)?base64_decode\s*\('

  - id: embedded-wordpress-plugin-header
    desc: Embedded WordPress plugin header
    for: [source, python, javascript]
    if:
      type: literal
      kind: string
      regex: '(?is)<\?php.{0,240}\bPlugin\s+Name\s*:'

  - id: embedded-php-command-exec-call
    desc: Embedded PHP command execution call
    for: [scripts, source, python]
    if:
      type: literal
      kind: string
      regex: '(?is)<\?php.*\b(system|exec|shell_exec|passthru)\s*\('
  # Some source generators build PHP payloads from adjacent string fragments,
  # so the complete open-tag-to-call pattern is not one parser literal.
  - id: embedded-php-shell-executor-fragment
    desc: Embedded PHP shell executor fragment
    crit: notable
    for: [scripts, source, python]
    if:
      type: literal
      kind: string
      regex: '(?i)\bshell_exec\s*\('

  - id: embedded-php-files-access
    desc: Embedded PHP reads uploaded-file data
    crit: component
    if:
      type: text
      regex: '\$_FILES\s*\['

  - id: embedded-php-move-upload
    desc: Embedded PHP moves an uploaded file
    crit: component
    if:
      type: text
      regex: '\bmove_uploaded_file\s*\('

  - id: embedded-php-copy-upload
    desc: Embedded PHP copies an uploaded temporary file
    crit: component
    if:
      type: text
      regex: '\bcopy\s*\(\s*\$_FILES\[[^)]{1,160}\[[''"]tmp_name[''"]\]'

  - id: embedded-php-runtime-info
    desc: Embedded PHP reads server identity
    crit: component
    if:
      type: text
      regex: 'php_uname\s*\(|SERVER_SOFTWARE'

  - id: php-proc-open-variable
    desc: Embedded PHP proc_open variable command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bproc_open\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*'

  - id: php-encryption-call
    desc: Embedded PHP encryption call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bopenssl_(decrypt|encrypt)\s*\('

  - id: php-cookie-response-write
    desc: Embedded PHP response cookie write
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bset(raw)?cookie\s*\('

composite_rules:
  - id: embedded-php-upload-handler
    desc: Embedded PHP handles an uploaded file
    crit: notable
    all:
      - id: embedded-php-open-tag-literal
      - id: embedded-php-files-access
    any:
      - id: embedded-php-move-upload
      - id: embedded-php-copy-upload
    near_bytes: 2048

  - id: embedded-php-host-profile
    desc: Embedded PHP reads host identity
    crit: notable
    all:
      - id: embedded-php-open-tag-literal
      - id: embedded-php-runtime-info
    near_bytes: 1536

  - id: fragmented-embedded-php-command-execution
    desc: Embedded PHP command executor across fragments
    crit: notable
    for: [scripts, source, python]
    all:
      - id: embedded-php-open-tag-literal
      - id: embedded-php-shell-executor-fragment
    near_bytes: 1024

  - id: embedded-php-request-command-fragment
    desc: Embedded PHP passes request input to command
    crit: notable
    for: [scripts, source, -php]
    all:
      - id: embedded-php-superglobal-read
      - id: embedded-php-var-command-call
    near_lines: 5
    near_bytes: 240

  - id: embedded-php-command-or-eval-webshell
    desc: Embedded PHP request-command or base64-eval payload
    crit: notable
    for: [scripts, source, -php]
    all:
      - id: embedded-php-open-tag-literal
    any:
      - id: embedded-php-request-command-fragment
      - id: embedded-php-command-exec-call
      - id: fragmented-embedded-php-command-execution
      - id: embedded-php-eval-base64-fragment
    near_bytes: 2048
