defaults:
  platforms:
  - unix
  for:
  - source
  - class
  - jar
  crit: notable
traits:
- id: embedded-shell-shebang
  desc: POSIX shell shebang embedded in a file
  conf: 0.8
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  if:
    type: text
    substr: '#!/bin/sh'
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/harness/unit/
  - id: metadata/path::test-directory-component
- id: embedded-bash-shebang
  desc: Embedded bash script shebang
  conf: 0.9
  if:
    type: text
    substr: '#!/bin/bash'
- id: js-string-bash-script-template
  desc: Bash script held in a JavaScript string
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '[`"'']#!/bin/(ba)?sh(\\n|\n)'
- id: shell-script-literal-curl-url
  desc: Shell script literal calls curl URL
  conf: 0.9
  for:
  - shell
  if:
    type: string_literal
    regex: (?i)#!/.{0,80}curl.{0,100}https?://
- id: embedded-shell-print-command
  desc: Shell print command embedded as string
  conf: 0.8
  for:
  - shell
  if:
    type: text
    regex: (echo|printf)\s+["'](\s*(echo|printf|wall)\b)
