defaults:
  platforms:
    - unix
  for: [source]
traits:
  - id: source-shell-shebang
    desc: Shell shebang in source string literal
    crit: notable
    conf: 0.8
    if:
      type: literal
      substr: '#!/bin/sh'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/unit/
      - id: metadata/path::test-directory-component
