defaults:
  platforms:
    - unix
  for: [source]
traits:
  - id: source-shell-shebang
    desc: Shell shebang in source string literal
    crit: notable
    conf: 0.8
    if:
      type: literal
      substr: '#!/bin/sh'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
