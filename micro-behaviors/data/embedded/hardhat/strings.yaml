defaults:
  for: [javascript, typescript]
  platforms: [windows, linux, macos]
  crit: notable

traits:
  - id: hardhat-config-networksFilter
    desc: Hardhat networksFilter helper identifier
    crit: baseline
    if:
      type: text
      word: "networksFilter"

  - id: hardhat-config-hreConfig
    desc: Hardhat hreConfig export name
    if:
      type: text
      word: "hreConfig"

  - id: hardhat-config-hreInit
    desc: Hardhat hreInit export name
    if:
      type: text
      word: "hreInit"

  - id: hardhat-mnemonic-password-field
    desc: Hardhat mnemonic password field
    if:
      type: text
      word: MNEMONIC_PASSWORD
