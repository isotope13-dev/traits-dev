# Embedded Network Structures in Image Files
# Detects binary network configuration data (sockaddr_in) hidden in image files
# Used by malware to conceal C2 addresses as raw binary structures
defaults:
  platforms: [windows, unix]
  for: [png]
  # Not baseline: a PNG carrying two consecutive sockaddr_in endpoints past
  # offset 512 is not something nearly every PNG does -- it is the concealed-C2
  # shape this file's header and its T1027.003 mapping describe. The array form
  # was chosen over the single struct precisely because chance does not produce
  # it. Arguably `suspicious` ("rarely legitimate"); notable is the floor.
  crit: notable
  conf: 0.85
  attack: "T1027.003"
  mbc: "B0032"
traits:
  # sockaddr_in layout: sin_family=AF_INET (0x0002), sin_port (2 bytes),
  # sin_addr (4 bytes), then 8 bytes of sin_zero padding.
  #
  # A SINGLE struct is not detectable here. With 6 of 16 bytes wildcarded the
  # pattern is mostly a run of zeros, which any large raster image produces by
  # chance -- a 700 KB project logo hit the earlier one-struct form 10 times.
  # What chance does not produce is the endpoint *array* this file is about:
  # two consecutive entries at the natural 16-byte stride.
  # AF_INET endpoint array (big-endian sin_family)
  - id: sockaddr-in-array-be
    desc: Embedded sockaddr_in endpoint array in image
    if:
      type: hex
      pattern: "00 02 ?? ?? ?? ?? ?? ?? 00 00 00 00 00 00 00 00 00 02 ?? ?? ?? ?? ?? ?? 00 00 00 00 00 00 00 00"
      offset_range: [512, null]
  # AF_INET endpoint array (little-endian sin_family)
  - id: sockaddr-in-array-le
    desc: Embedded sockaddr_in endpoint array in image
    if:
      type: hex
      pattern: "02 00 ?? ?? ?? ?? ?? ?? 00 00 00 00 00 00 00 00 02 00 ?? ?? ?? ?? ?? ?? 00 00 00 00 00 00 00 00"
      offset_range: [512, null]
