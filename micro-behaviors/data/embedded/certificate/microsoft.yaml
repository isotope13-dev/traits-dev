defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: microsoft-code-signing-pca
    desc: Microsoft code-signing certificate chain
    crit: baseline
    conf: 0.95
    if:
      type: text
      # Match the PCA family, not an enumerated vintage. Microsoft issues a new
      # generation periodically -- "Code Signing PCA 2024" is current -- and
      # pinning 2010/2011 quietly stopped recognizing every binary signed since.
      # Measured across this corpus: 530 of 3,674 files carrying a Microsoft
      # leaf certificate (14%) failed metadata/signed/platform::microsoft on
      # this leg alone, and that composite is a benign-context suppressor for
      # 284 rules, so the shortfall reads as unsigned software everywhere.
      regex: Microsoft (Code Signing|Windows Production) PCA( \d{4})?
      case_insensitive: true
  - id: microsoft-timestamp-chain
    desc: Microsoft timestamp certificate chain
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: Microsoft Time-Stamp (PCA 2010|Service)
      case_insensitive: true
