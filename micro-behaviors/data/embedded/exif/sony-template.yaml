# EXIF/XMP fields that appear together in a known steganographic JPEG
# template (SONY DSC-P150 + Adobe Photoshop 7.0). Generic Adobe Photoshop
# 7.0 alone is common on benign photos, so it stays component; the DSC-P150
# model string is the rare template-specific notable leg.
defaults:
  platforms: [unix, windows]
  for: [jpeg]
  crit: component
  conf: 0.9

traits:
  - id: exif-sony-camera-model
    desc: EXIF camera make string SONY
    if:
      type: text
      exact: SONY

  - id: exif-sony-dscp150-model
    desc: EXIF camera model string DSC-P150
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: DSC-P150

  - id: exif-adobe-photoshop-tool
    desc: EXIF/XMP creator tool Adobe Photoshop 7.0
    if:
      type: text
      regex: Adobe Photoshop 7\.0

  - id: exif-xmpmeta-adobe
    desc: Adobe XMP metadata packet marker
    if:
      type: text
      substr: x:xmpmeta xmlns:x="adobe:ns:meta/"
