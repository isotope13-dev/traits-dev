# Resource access can load an image, configuration, or encrypted strings.
# Its consumers must establish the resource's purpose independently.
defaults:
  platforms: [windows]
  for: [pe, csharp]

composite_rules:
  - id: dotnet-source-or-binary-resource-access
    desc: Managed embedded-resource API references or source calls
    crit: notable
    conf: 0.91
    any:
      - id: dotnet-source-manifest-resource-stream-call
      - id: dotnet-managed-resource-access
