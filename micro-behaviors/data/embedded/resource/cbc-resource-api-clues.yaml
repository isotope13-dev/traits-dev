defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: cbc-resource-api-clues
    desc: CBC property and resource API clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/cipher/mode::bcrypt-cbc-mode-references
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-a
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
    unless:
      - id: metadata/binary/symbols/count::many-exports
      - id: well-known/lib/platform/mfc::mfc-application-dialog-framework
