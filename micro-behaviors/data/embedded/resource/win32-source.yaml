# Source-level Win32 PE resource access. Looking up and loading an embedded
# resource (icons, version info, message tables, or binary blobs) is a
# neutral OS capability; payload-staging or reflective-loading intent belongs
# in consuming composites that pair resource reads with decoding or manual
# mapping. The PE-only API rules cannot see a source loader before it is
# compiled, while these calls are useful evidence when reviewing C/C++ and
# FFI-based implementations in other languages.
defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]

traits:
  - id: find-resource-source
    desc: Win32 resource lookup in source
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^FindResource(Ex)?[AW]?$'

  - id: load-resource-source
    desc: Win32 resource loading in source
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: LoadResource

  - id: lock-resource-source
    desc: Win32 resource pointer access
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: LockResource

  - id: sizeof-resource-source
    desc: Win32 resource size query
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: SizeofResource

composite_rules:
  - id: source-pe-resource-access
    desc: Source looks up and loads a Win32 PE resource
    conf: 0.95
    all:
      - id: find-resource-source
      - id: load-resource-source
    any:
      - id: lock-resource-source
      - id: sizeof-resource-source
