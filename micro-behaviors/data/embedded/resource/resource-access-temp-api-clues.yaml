defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: resource-access-temp-api-clues
    desc: Resource access and temp-path API clues
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
    unless:
      - id: metadata/binary/debug::msqry32-pdb-basename
      - id: metadata/binary/symbols/count::many-exports-200
      - id: metadata/signature/verified/signer::ip-zinukhov-stanislav-igorevich
      - id: metadata/signature/verified/signer::yandex-llc
      - id: well-known/tool/reverse-engineering/oep-finder::geta-oep-banner-marker
