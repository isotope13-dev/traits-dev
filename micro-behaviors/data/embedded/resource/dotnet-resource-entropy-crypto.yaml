defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: dotnet-resource-entropy-crypto-clues
    desc: High-entropy resource and crypto name clues
    crit: notable
    conf: 0.95
    for: [dll]
    all:
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: metadata/lang/natural/vocabulary/cryptography::encrypted-exact-binary-text
      - id: micro-behaviors/crypto/kdf/password::rfc2898derivebytes
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
    unless:
      - id: micro-behaviors/crypto/kdf/password::sdk-rfc2898-analyzer-table
      - id: micro-behaviors/crypto/kdf/password::sdk-rfc2898-syslib-cryptderivekey
      - id: micro-behaviors/crypto/kdf/password::sdk-rfc2898-syslib-constructors
      - id: micro-behaviors/crypto/kdf/password::sdk-rfc2898-syslib-outdated
