defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800

traits:
- id: dotnet-getmanifestresourcestream
  desc: .NET manifest resource stream API reference
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: text
    exact: GetManifestResourceStream
- id: dotnet-resource-reader
  desc: References the .NET ResourceReader type
  crit: notable
  conf: 0.86
  for:
  - pe
  if:
    type: text
    substr: System.Resources.ResourceReader
- id: dotnet-resource-writer
  desc: References a .NET ResourceWriter type
  crit: notable
  conf: 0.86
  for:
  - pe
  - dll
  if:
    type: text
    substr: ResourceWriter
- id: dotnet-get-resource-data
  desc: References .NET GetResourceData name
  crit: notable
  conf: 0.86
  for:
  - pe
  if:
    type: text
    exact: GetResourceData
- id: dotnet-resourcemanager
  desc: .NET ResourceManager type or property reference
  crit: notable
  conf: 0.78
  for: [pe, dll, csharp]
  if:
    type: text
    regex: '(^|[^@?\w]|get_)ResourceManager([^@\w]|$)'
- id: dotnet-filterresources-iterator
  desc: .NET filter-resources iterator name
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: text
    regex: "^<FilterResources>d__\\d+`1$"
- id: dotnet-getmanifestresourcenames
  desc: References GetManifestResourceNames text
  crit: notable
  conf: 0.8
  for:
  - pe
  if:
    type: text
    substr: GetManifestResourceNames
  unless:
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
- id: dotnet-source-resource-reader-call
  desc: ".NET ResourceReader source call"
  crit: notable
  conf: 0.9
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)ResourceReader$'
- id: dotnet-source-get-resource-data-call
  desc: ".NET GetResourceData source call"
  crit: notable
  conf: 0.9
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetResourceData$'
- id: dotnet-source-manifest-resource-stream-call
  desc: ".NET manifest resource stream source call"
  crit: notable
  conf: 0.9
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetManifestResourceStream$'
- id: dotnet-source-manifest-resource-names-call
  desc: ".NET manifest resource enumeration source call"
  crit: notable
  conf: 0.9
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetManifestResourceNames$'

composite_rules:
- id: dotnet-embedded-resource-read-any
  desc: .NET resource-reading API references
  crit: notable
  conf: 0.86
  for:
  - pe
  any:
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
  - id: micro-behaviors/data/embedded/resource::dotnet-get-resource-data
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcenames
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader
- id: dotnet-stream-resource-access-path
  desc: Resource stream API names co-occur
  crit: notable
  conf: 0.86
  for:
  - pe
  all:
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
  any:
  - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcenames
  unless:
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
- id: dotnet-source-resource-data-extraction
  desc: Source references resource data APIs
  crit: notable
  conf: 0.94
  for:
  - csharp
  all:
  - id: micro-behaviors/data/embedded/resource::dotnet-source-resource-reader-call
  - id: micro-behaviors/data/embedded/resource::dotnet-source-get-resource-data-call
  - id: micro-behaviors/data/embedded/resource::dotnet-source-manifest-resource-stream-call
  any:
  - id: micro-behaviors/data/embedded/resource::dotnet-source-manifest-resource-names-call
  - id: micro-behaviors/mem/copy::dotnet-buffer-block-copy
- id: dotnet-managed-resource-access
  desc: .NET embedded-resource API references
  crit: notable
  conf: 0.9
  for:
  - pe
  any:
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader
  - id: micro-behaviors/data/embedded/resource::dotnet-get-resource-data
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcenames
  unless:
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
- id: dotnet-resource-reader-access
  desc: ResourceReader and resource-loading references co-occur
  crit: notable
  conf: 0.9
  for:
  - pe
  all:
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader
  - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
  any:
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcenames
  unless:
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
- id: dotnet-resource-data-access
  desc: ResourceReader and resource API names co-occur
  crit: notable
  conf: 0.92
  for:
  - pe
  all:
  - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader
  - id: micro-behaviors/data/embedded/resource::dotnet-get-resource-data
  unless:
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
