defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1505.003

traits:
  - id: pdf-header
    desc: PDF header in analyzed bytes
    crit: baseline
    conf: 1.0
    if:
      type: raw
      regex: '\x25\x50\x44\x46\x2d'

  - id: pdf-php-open-tag
    desc: PHP open tag embedded in PDF bytes
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      regex: '\x3c\x3f\x70\x68\x70'

  - id: pdf-upload-source-array
    desc: PDF bytes reference PHP upload array
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '\x24\x5f\x46\x49\x4c\x45\x53'

  - id: pdf-file-copy-call
    desc: PDF bytes contain PHP copy call
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '\x63\x6f\x70\x79\x28'
