defaults:
  platforms: [unix, windows]
  for: [static-lib]
traits:
  - id: go-static-embed-fs-symbol
    desc: Go static object references embed.FS
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'go:info.embed.FS'
  - id: go-static-embedded-vendored-source-path
    desc: Go static object contains vendored source paths
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'vendor/github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/'
composite_rules:
  - id: go-static-embedded-source-tree
    desc: Go static library embeds vendored source
    crit: notable
    conf: 0.96
    all:
      - id: go-static-embed-fs-symbol
      - id: go-static-embedded-vendored-source-path
