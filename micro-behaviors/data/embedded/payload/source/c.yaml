# C source text carried inside a compiled binary (string tables, test
# fixtures, JIT helpers). Neutral observation; intent needs other legs.
defaults:
  platforms: [linux]
  for: [binaries]

traits:
  - id: embedded-c-stdlib-include
    desc: Binary embeds C stdio/stdlib/dlfcn include
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '#include\s+<(stdio|stdlib|dlfcn)\.h>'

  - id: embedded-c-gnu-source-define
    desc: Binary embeds C _GNU_SOURCE define
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '#define\s+_GNU_SOURCE\b'
