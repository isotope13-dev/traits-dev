# Script or document carries embedded Go program source code. Neutral observation;
# intent requires file staging, compilation, or execution legs.
defaults:
  platforms: [unix, windows]
  for: [shell, scripts, text]
  crit: notable
  conf: 0.9

traits:
  - id: embedded-go-program-source
    desc: Embedded Go program source
    if:
      type: text
      regex: '(?ms)^\s*package main\b[\s\S]{0,400}func main\('
