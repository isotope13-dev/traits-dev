# JavaScript packages sometimes carry source examples or generated handlers in
# string literals. The literal is a neutral embedded-source observation; a
# hostile conclusion requires the separate file-read/write/staging behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-embedded-async-handler-source
    desc: Embedded JavaScript async handler source
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: 'export\s+const\s+handler\s*=\s*async\s*\('
    unless:
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/lang/javascript-features::sourcemap-sources-content
