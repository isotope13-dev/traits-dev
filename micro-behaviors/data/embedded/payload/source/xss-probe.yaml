defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript]
traits:
  - id: js-xss-probe-string-fragment
    desc: "String literal contains an XSS probe fragment"
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      # Require payload/probe shapes. Bare "XSS" matches security docs and
      # framework comments (e.g. "cross-site scripting (XSS) vulnerability").
      regex: 'alert\s*\(\/|["'']XSS["'']\s*\+|\+["'']XSS["'']|["''][^"'']{0,60}<img[^"'']{0,40}onerror'
  - id: js-xss-probe-var-declaration
    desc: "Probe payload declared into xss variable"
    crit: notable
    conf: 0.88
    if:
      type: text
      # Scanner idiom: the payload is bound to a variable literally named
      # xss for local testing, not sunk into an HTML parser. Quoted-tag
      # quotes are matched literally; the engine has no lookaround.
      regex: '(var|let|const)\s+xss\s*=\s*["'']<img'
