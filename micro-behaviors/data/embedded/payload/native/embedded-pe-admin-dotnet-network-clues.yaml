# Embedded PE, product-name and API combinations; no linked payload is required.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: embedded-pe-admin-dotnet-network-clues
  desc: Embedded PE with admin, .NET and network clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/build/manifest::admin-manifest
  - id: micro-behaviors/process/config/window::dotnet-console-launch-config-references
  - id: micro-behaviors/communications/http/client/managed::httpwebrequest
  any:
  - id: micro-behaviors/dylib/lookup::rundll32main-entrypoint-reference
