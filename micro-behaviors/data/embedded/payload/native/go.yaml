defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-embed-native-executable
    desc: Go embeds a native executable
    if:
      type: text
      regex: '(?m)^[ \t]*//\s*go:embed\b.{0,200}\.(bin|elf|exe)\b'
  - id: go-embed-native-library
    desc: Go embeds a native library
    if:
      type: text
      regex: '(?m)^[ \t]*//\s*go:embed\b.{0,200}\.(dylib|dll|so)\b'
