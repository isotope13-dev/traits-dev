defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-xor-native-buffer-file-write
    desc: Writes an XOR-decoded embedded PE buffer
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_xor_native_buffer_file_write {
         strings:
          $stage = { 68 00 37 00 00 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 59 59 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 59 59 89 85 B0 F7 FF FF 83 BD B0 F7 FF FF 00 74 28 FF B5 B0 F7 FF FF 6A 01 68 00 37 00 00 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? }
          $decodebytes = { 55 8B EC 51 C7 45 FC 00 00 00 00 EB 09 8B 45 FC 83 C0 01 89 45 FC 8B 4D FC 3B 4D 0C 7D 16 8B 55 08 03 55 FC 0F BE 02 83 F0 02 8B 4D 08 03 4D FC 88 01 EB D9 8B 45 08 8B E5 5D C3 55 8B EC E8 02 00 }
          $mode = "wb\x00"
         condition:
          pe.machine == pe.MACHINE_I386 and
          all of them and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @stage >= s.raw_data_offset and @stage+!stage <= s.raw_data_offset+s.raw_data_size) and
          uint32(@stage+1) == uint32(@stage+59) and
          uint32(@stage+6) == uint32(@stage+64) and
          uint32(@stage+37) == uint32(@stage+43) and uint32(@stage+37) == uint32(@stage+52) and
          uint32(@stage+29) == pe.image_base+pe.import_rva("MSVCRT.dll","fopen") and
          uint32(@stage+70) == pe.image_base+pe.import_rva("MSVCRT.dll","fwrite") and
          $mode at pe.rva_to_offset(uint32(@stage+18)-pe.image_base) and
          for any s in (0..pe.number_of_sections-1) : (@stage >= pe.sections[s].raw_data_offset and @stage < pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and $decodebytes at pe.rva_to_offset(pe.sections[s].virtual_address+@stage-pe.sections[s].raw_data_offset+15+int32(@stage+11))) and
          uint16(pe.rva_to_offset(uint32(@stage+6)-pe.image_base)) ^ 0x0202 == 0x5a4d and
          uint32(pe.rva_to_offset(uint32(@stage+6)-pe.image_base)+(uint32(pe.rva_to_offset(uint32(@stage+6)-pe.image_base)+60)^0x02020202)) ^ 0x02020202 == 0x4550
        }
