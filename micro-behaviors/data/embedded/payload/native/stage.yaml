---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: shell-echo-stage-marker
  desc: Embedded shell echo stage marker
  crit: notable
  conf: 0.7
  for:
  - elf
  - macho
  if:
    type: text
    substr: echo '
# Resource-extraction API names surviving as import strings inside an
# embedded layer. A packed carrier's own import table is tiny, so the full
# Find/Load/Size/Lock cluster in the raw bytes marks the embedded stage that
# reads resources back at runtime. The symbol-typed atoms under
# payload/resource cover unpacked binaries; this raw sibling covers the
# packed-carrier case where only the embedded image's import names are
# visible.
- id: raw-resource-extraction-import-cluster
  desc: Resource extraction API names in raw bytes
  conf: 0.9
  platforms: [windows]
  for: [pe]
  if:
    type: raw
    case_insensitive: true
    regex: (?s)LockResource\x00.{0,4}LoadResource\x00.{0,4}FindResourceA
composite_rules:
# `echo '` and `/bin/sh` in one native image are not a stage unless they sit
# in the same embedded script. Distant copies are unrelated snippets.
- id: shell-echo-beside-bin-sh
  desc: Echo marker beside the shell path
  crit: notable
  conf: 0.86
  for:
  - elf
  - macho
  near_bytes: 8192
  all:
  - id: shell-echo-stage-marker
  - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
- id: line-wrapped-base64-pe-image
  desc: Line-wrapped Base64 embeds a PE image
  crit: notable
  conf: 0.97
  for: [batch, powershell, vbs, javascript, python]
  size_min: 131072
  all:
  - id: metadata/file/encoding::base64-pe-header-text
  - id: metadata/file/line::file-has-30-plus-lines
  unless:
  - id: well-known/tool/forensics/haril::haril-documented-native-addon-context
- id: embedded-shell-stage
  desc: Embedded shell stage in native binary
  crit: notable
  conf: 0.8
  for:
  - elf
  - macho
  all:
  - id: shell-echo-beside-bin-sh
  - id: micro-behaviors/fs/write/file/descriptor::write
  any:
  - id: micro-behaviors/process/create/execv::c-exec-variants
  - id: micro-behaviors/fs/path/temp::tmp-hidden-file
  unless:
  - id: well-known/tool/sysadmin/fish-bash-zsh/
