defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  size_min: 50000
  size_max: 150000
  attack: T1105

composite_rules:
  - id: unsigned-embedded-pe-wininet-clues
    desc: Unsigned embedded PE and WinINet clues
    crit: suspicious
    conf: 0.96
    attack: T1553.002,T1105
    all:
      - id: metadata/binary/layout/embedded::embedded-dos-header-tail
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
