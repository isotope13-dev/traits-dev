  crit: suspicious
  conf: 0.97
  for:
  - pe
  all:
  - id: micro-behaviors/fs/temp/directory::embedded-pe-script-host-temp-api-profile
  - id: metadata/binary/provenance/source::windows-product-or-signer-reference
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  any:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: micro-behaviors/mem/combined::virtual-allocation-or-page-protection
  platforms:
  - windows
