defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: groove-migrator-dropper-payloads
  desc: Unsigned PE with embedded PEs and Microsoft or Groove references
  crit: suspicious
  conf: 0.98
  attack: T1027.009
  all:
  - id: metadata/binary/layout/embedded::embedded-pe-three-plus
  - id: micro-behaviors/os/sysinfo/dmi::cpu-vendor-genuineintel
  - id: micro-behaviors/mem/map::create-file-mapping-w-name-reference
  - id: metadata/signature/absent::unsigned
  any:
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
  - id: micro-behaviors/fs/path/application/executable::groove-migrator-filename-reference
