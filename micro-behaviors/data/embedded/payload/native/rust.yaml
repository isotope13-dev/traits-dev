defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-embed-native-executable
    desc: Rust embeds a native executable
    if:
      type: text
      regex: '(?i)include_bytes!\s*\(\s*".{0,180}\.(bin|elf|exe)"'

  - id: rust-embed-native-library
    desc: Rust embeds a native library
    conf: 0.88
    if:
      type: text
      regex: '(?i)include_bytes!\s*\(\s*".{0,180}\.(dylib|dll|so)"'

  - id: rust-embed-named-payload
    desc: Rust embeds named payload bytes
    conf: 0.88
    if:
      type: text
      regex: '(?i)include_bytes!\s*\(\s*".{0,180}(payload|stage|loader)'
