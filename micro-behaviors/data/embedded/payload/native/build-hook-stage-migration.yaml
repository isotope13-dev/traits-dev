defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- id: rust-build-rs-include-native-bytes
  desc: Cargo build embeds native bytes
  crit: suspicious
  conf: 0.9
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  any:
  - id: micro-behaviors/data/embedded/payload/native::rust-embed-native-executable
  - id: micro-behaviors/data/embedded/payload/native::rust-embed-native-library
  - id: micro-behaviors/data/embedded/payload/native::rust-embed-named-payload
- id: rust-build-rs-native-link-staging
  desc: Cargo native link and embedded file clues
  crit: notable
  conf: 0.92
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: metadata/build/ecosystem::cargo-rustc-link-search-native-directive
  - id: metadata/build/ecosystem::cargo-rustc-link-lib-directive
  any:
  - id: micro-behaviors/data/embedded/payload/native::rust-build-rs-include-native-bytes
  unless:
  - id: micro-behaviors/fs/write/file/unspecified::rust-build-rs-write-out-dir
  - id: micro-behaviors/fs/file/copy/source-destination::rust-build-rs-copy-out-dir
- id: cargo-build-hook-native-link-staging
  desc: Cargo build hook has native link clues
  crit: notable
  conf: 0.94
  for:
  - rust
  - crate
  - tar
  - cargo-toml
  scope: archive
  all:
  - id: "metadata/package/scripts/build::cargo-build-script-declared"
  - id: micro-behaviors/data/embedded/payload/native::rust-build-rs-native-link-staging
  any:
  - id: metadata/build/archive::archive-native-binary-entry
  - id: metadata/build/archive::archive-platform-native-binary-entry
- id: cargo-archive-build-rs-native-link-staging
  desc: Cargo archive has native link clues
  crit: notable
  conf: 0.94
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/archive::archive-cargo-crate-build-script
  - id: micro-behaviors/data/embedded/payload/native::rust-build-rs-native-link-staging
  any:
  - id: metadata/build/archive::archive-native-binary-entry
  - id: metadata/build/archive::archive-platform-native-binary-entry
  unless:
  - id: "metadata/package/scripts/build::cargo-build-script-declared"
