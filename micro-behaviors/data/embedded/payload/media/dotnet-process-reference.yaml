defaults:
  platforms: [windows]
  for: [media]

traits:
  - id: dotnet-processstartinfo-reference-in-media
    desc: ProcessStartInfo reference in media bytes
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: ProcessStartInfo

  - id: dotnet-process-output-reference-in-media
    desc: Process output/read reference in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\b(StandardOutput|StandardError)\b|\b(ReadToEnd|CmdResult\.Text)\b'
