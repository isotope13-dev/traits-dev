# Dynamic evaluation carried by a media container, in whatever language.
#
# Split out of the PHP file next to it. The matcher is `eval(` / `assert(`,
# which no more implies PHP than it implies JavaScript -- and it was reporting
# "PHP dynamic evaluation in media" on an HTA loader with no PHP in it at all.
# The PHP webshell composites that referenced it pair it with `<?php` anyway,
# so nothing about them changes; what changes is that the finding now says
# what the matcher found.
defaults:
  platforms: [unix, windows]
  for: [media, mp3]
  attack: T1027.009
  mbc: B0030

traits:
  - id: dynamic-eval-in-media
    desc: Dynamic evaluation call in media
    crit: suspicious
    conf: 0.98
    if:
      # A media file has no interpreter of its own. A call to one, sitting in
      # a container whose identity is "passive asset", is code that arrived
      # somewhere it will not be looked for.
      type: text
      regex: '\b(eval|assert)\s*\('
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
