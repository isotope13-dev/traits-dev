# Dynamic evaluation carried by a media container, in whatever language.
#
# Split out of the PHP file next to it. The matcher is `eval(` / `assert(`,
# which no more implies PHP than it implies JavaScript -- and it was reporting
# "PHP dynamic evaluation in media" on an HTA loader with no PHP in it at all.
# The PHP webshell composites that referenced it pair it with `<?php` anyway,
# so nothing about them changes; what changes is that the finding now says
# what the matcher found.
defaults:
  platforms: [unix, windows]
  for: [media, mp3]
  attack: T1027.009
  mbc: B0030

traits:
  - id: dynamic-eval-in-media
    desc: Dynamic evaluation call in media
    crit: suspicious
    conf: 0.98
    if:
      # A media file has no interpreter of its own. A call to one, sitting in
      # a container whose identity is "passive asset", is code that arrived
      # somewhere it will not be looked for. `eval(` evaluates its argument
      # in every mainstream scripting language, so it is the whole of this
      # atom; `assert(` only executes strings in PHP and is an ordinary
      # assertion helper everywhere else, so it lives in assert-call-in-media
      # below -- a bundled JS assertion helper must not read as code
      # evaluation on its own.
      type: text
      regex: '\beval\s*\('
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      # A `.js` bundle whose `true&&` preload shim reads as an sfnt tag is
      # JavaScript the sniffer mistyped, not code hidden in an asset.
      - id: metadata/file/extension/mismatch::javascript-source-typed-as-font
  - id: assert-call-in-media
    desc: Assert call in media
    crit: notable
    conf: 0.95
    if:
      # `assert(` with a string argument executes code in PHP, which is why
      # the PHP webshell composites reference this atom next to the open-tag
      # and request-input legs. In JavaScript and Python it is an ordinary
      # assertion helper, so the call alone is analyst information rather
      # than evidence of evaluation -- intent comes from the composite.
      type: text
      regex: '\bassert\s*\('
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      # A `.js` bundle whose `true&&` preload shim reads as an sfnt tag is
      # JavaScript the sniffer mistyped, not code hidden in an asset.
      - id: metadata/file/extension/mismatch::javascript-source-typed-as-font
