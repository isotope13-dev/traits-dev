# PHP server-side code carried by a media container. The media gate is
# intentional: these atoms describe code hidden in a file that has a passive
# asset identity, not ordinary PHP source.
defaults:
  platforms: [unix, windows]
  for: [media, bmp]
  attack: T1027.009,T1505.003
  mbc: B0030

traits:
  - id: php-open-tag-in-media
    desc: PHP opening-tag marker in media bytes
    crit: notable
    conf: 0.98
    if:
      type: raw
      # Scan original bytes so a newline cannot split away the tag. Parsed
      # call facts establish valid PHP context for execution verdicts.
      regex: '<\?([pP][hH][pP]\b|=)'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
      # Text masquerading as media is handled by the extension-mismatch rules;
      # PHP examples in readmes and upload fixtures are not media payloads.
      - id: metadata/file/format/media::media-content-is-text

  - id: php-request-input-in-media
    desc: PHP request variable reference in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST|COOKIE|FILES)\b'

  - id: php-command-exec-in-media
    desc: Command-call syntax in media bytes
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\b(shell_exec|exec|system|passthru|proc_open|popen)\s*\('

  - id: php-file-operation-in-media
    desc: File-operation call syntax in media bytes
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\b(move_uploaded_file|file_put_contents|file_get_contents|unlink|rmdir|copy)\s*\('
