# PHP server-side code carried by a media container. The media gate is
# intentional: these atoms describe code hidden in a file that has a passive
# asset identity, not ordinary PHP source.
defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1027.009,T1505.003
  mbc: B0030

traits:
  - id: php-open-tag-in-media
    desc: PHP code in media
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: '<?php'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree

  - id: php-request-input-in-media
    desc: PHP request input in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST|COOKIE|FILES)\b'

  - id: php-command-exec-in-media
    desc: PHP command execution in media
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\b(shell_exec|exec|system|passthru|proc_open|popen)\s*\('

  - id: php-file-operation-in-media
    desc: PHP file operation in media
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\b(move_uploaded_file|file_put_contents|file_get_contents|unlink|rmdir|copy)\s*\('

  - id: php-eval-in-media
    desc: PHP dynamic evaluation in media
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\b(eval|assert)\s*\('
