# ASP.NET server code hidden behind a passive media signature. These are
# capability atoms only; the webshell intent is assembled under objectives/.
defaults:
  platforms: [windows]
  for: [media]
  attack: T1027.009,T1505.003
  mbc: B0030

traits:
  - id: aspnet-page-directive-in-media
    desc: ASP.NET page directive in media
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)<%@\s*Page\b.{0,240}\bLanguage\s*=\s*["'']C#["'']'

  - id: aspnet-server-script-in-media
    desc: ASP.NET server script in media
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: '<script runat="server">'

  - id: aspnet-request-property-in-media
    desc: ASP.NET request property in media
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bRequest\.(QueryString|Form|Cookies|ServerVariables)\b'

  - id: aspnet-request-indexer-in-media
    desc: ASP.NET request indexer in media
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bRequest\s*\[\s*["''][^"'']{1,80}["'']\s*\]'

  - id: aspnet-page-security-disabled-in-media
    desc: ASP.NET page security control disabled in media
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(EnableViewStateMac|validateRequest|enableEventValidation)\s*=\s*["'']false["'']'

  - id: aspnet-cookie-auth-compare-in-media
    desc: ASP.NET cookie authentication check in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bRequest\.Cookies\s*\[[^\]]{1,80}\]\s*(\.\s*Value\s*)?(==|!=|Equals\s*\()'

  - id: aspnet-password-literal-in-media
    desc: ASP.NET hardcoded password literal in media
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(password|passwd|pass|pwd)\s*=\s*["''][^"''\r\n]{8,80}["'']'

  - id: aspnet-host-recon-in-media
    desc: ASP.NET host reconnaissance in media
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(DriveInfo\.GetDrives|Dns\.GetHostName|Environment\.(OSVersion|MachineName))\b'

  - id: aspnet-processstartinfo-in-media
    desc: ASP.NET process launch in media
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: ProcessStartInfo

  - id: aspnet-command-output-in-media
    desc: ASP.NET command output capture in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\b(StandardOutput|StandardError)\b|\b(ReadToEnd|CmdResult\.Text)\b'

  - id: aspnet-file-upload-in-media
    desc: ASP.NET file upload control in media
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: FileUpload

  - id: aspnet-file-save-in-media
    desc: ASP.NET saves uploaded file in media
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: SaveAs

  - id: aspnet-directory-enumeration-in-media
    desc: ASP.NET directory enumeration in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bDirectory\.(GetFiles|GetDirectories)\b'

  - id: aspnet-file-mutation-in-media
    desc: ASP.NET file mutation in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bFile\.(Delete|Move|Copy)\b'

  - id: aspnet-response-file-in-media
    desc: ASP.NET serves a host file in media
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Response.WriteFile

  - id: aspnet-sql-connection-in-media
    desc: ASP.NET SQL connection in media
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: SqlConnection

  - id: aspnet-sql-execution-in-media
    desc: ASP.NET SQL execution in media
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(SqlCommand|ExecuteReader|ExecuteNonQuery)\b'
