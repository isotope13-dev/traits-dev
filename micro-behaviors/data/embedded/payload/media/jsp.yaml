# JSP server-side code carried by a media container. A picture that still
# decodes can hold a scriptlet the upload filter never opens. The scriptlet
# marker itself is two bytes and is dropped by string extraction, so the
# legs are the request read and the runtime exec, which sit on a real line.
defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1027.009,T1505.003
  mbc: B0030

traits:
  - id: jsp-request-parameter-in-media
    desc: JSP reads a request parameter in media
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: request.getParameter(

  - id: jsp-runtime-exec-in-media
    desc: JSP runtime exec in media
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: Runtime.getRuntime().exec(
