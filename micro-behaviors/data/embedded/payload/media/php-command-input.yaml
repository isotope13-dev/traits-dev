# PHP call relationships parsed by filefacts inside passive media. The first
# argument must be an HTTP-input subscript; quoted snippets, comments, method
# calls and unrelated request reads cannot establish that relationship.
defaults:
  platforms: [unix, windows]
  for: [media, bmp]
  crit: suspicious
  conf: 0.99
traits:
  - id: php-request-command-call
    desc: PHP request input reaches a command call
    if:
      type: value
      path: media.php.request_calls[*]
      regex: '^(exec|system|shell_exec)$'
  - id: php-request-pipe-command-call
    desc: PHP request input reaches pipe-process calls
    if:
      type: value
      path: media.php.request_calls[*]
      regex: '^(passthru|popen|proc_open)$'
  # assert(string) stopped evaluating PHP code in PHP 8. Do not infer eval
  # without version-specific evidence: https://www.php.net/assert
  - id: php-request-eval-call
    desc: PHP request input passed to eval
    if:
      type: value
      path: media.php.request_calls[*]
      exact: eval
