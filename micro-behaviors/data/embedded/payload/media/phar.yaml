# A phar stub's terminator inside a media file. PHP's phar reader finds the
# first `__HALT_COMPILER();` anywhere in a file, so an image whose bytes carry
# one -- typically after a valid JPEG or GIF header -- is both an image that
# passes getimagesize() and a phar that phar:// will open. Image encoders
# never write this token.
defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1027.009,T1190
  mbc: B0030

traits:
  - id: phar-stub-terminator-in-media
    desc: Phar stub terminator in media
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '__HALT_COMPILER\s*\(\s*\)\s*;'
