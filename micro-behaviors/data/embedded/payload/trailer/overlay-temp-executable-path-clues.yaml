defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-dominant-overlay-temp-exe-path
    desc: Unsigned dominant overlay with temp EXE path
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/layout/overlay::unsigned-dominant-overlay-small-sections
      - id: micro-behaviors/fs/path/temporary-artifact::windows-temp-executable-path
    unless:
      - id: metadata/installer/product/
  - id: unsigned-dominant-overlay-loader-name
    desc: Unsigned dominant overlay with loader name
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/layout/overlay::unsigned-dominant-overlay-small-sections
      - id: micro-behaviors/fs/path/executable::loader-executable-reference
    unless:
      - id: metadata/installer/product/
