# Builder-generated stubs join their configuration fields with one random
# token, so the same 12-30 letter word recurs between every field, with a
# digit flag glued on. Three fields in a row is the pattern.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: repeated-token-field-delimiter
    desc: Repeated alphabetic delimiter with zero flags
    crit: notable
    conf: 0.8
    attack: T1027.009
    if:
      type: yara
      source: |
        rule repeated_token_zero_flags {
          strings:
            $field = /([A-Za-z]{12,30}0){3}[A-Za-z]/
          condition:
            for any i in (1..#field): (
              for any width in (12..30): (
                @field[i] + 3 * (width + 1) < filesize and
                uint8(@field[i] + width) == 0x30 and
                uint8(@field[i] + 2 * width + 1) == 0x30 and
                uint8(@field[i] + 3 * width + 2) == 0x30 and
                for all j in (0..width - 1): (
                  uint8(@field[i] + j) == uint8(@field[i] + width + 1 + j) and
                  uint8(@field[i] + j) == uint8(@field[i] + 2 * (width + 1) + j)
                )
              )
            )
        }
