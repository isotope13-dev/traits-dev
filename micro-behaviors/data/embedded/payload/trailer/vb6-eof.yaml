defaults:
  platforms:
  - windows
  for:
  - source
  - vbs
traits:
- conf: 0.95
  id: vb6-read-eof-data-call
  desc: VB6 ReadEOFData helper call
  crit: notable
  if:
    type: text
    substr: ReadEOFData(
- conf: 0.95
  id: vb6-write-eof-data-call
  desc: VB6 WriteEOFData helper call
  crit: notable
  if:
    type: text
    substr: WriteEOFData(
- id: vb6-read-eof-overlay
  desc: VB6 ReadEOFData of edit text
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: ReadEOFData(flatedit1.Text)
- id: vb6-write-eof-overlay
  desc: VB6 WriteEOFData to temp EXE
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: WriteEOFData(Environ$("TEMP") & "\Crypted.exe", EOF)
