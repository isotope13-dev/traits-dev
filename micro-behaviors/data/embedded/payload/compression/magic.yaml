defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: lzma-unknown-size
  desc: LZMA header unknown size marker
  crit: notable
  if:
    type: hex
    section: .text
    pattern: 5D 00 00 (01|02|04|08|10|20|40|80) 00 FF FF FF FF FF FF FF FF 00
- id: lzma-header-past-512k
  desc: LZMA header bytes past 512KB
  crit: component
  conf: 0.92
  for:
  - pe
  size_min: 1000000
  if:
    type: hex
    pattern: 5D 00 00 80 00
    offset_range:
    - 524288
    - null
- id: xz-stream-magic-in-archive-container
  desc: XZ stream magic inside a package archive
  crit: notable
  conf: 0.88
  for:
  - whl
  size_max: 1048576
  if:
    type: hex
    pattern: FD 37 7A 58 5A 00
- id: xz-magic
  desc: XZ format magic in executable code
  crit: notable
  conf: 0.7
  size_min: 262144
  if:
    type: hex
    section: .text
    pattern: FD 37 7A 58 5A 00
- id: gzip-magic
  desc: Gzip header-like bytes in code
  crit: baseline
  conf: 0.5
  if:
    type: hex
    section: .text
    pattern: 1F 8B 08 (0?|1?)
- id: bzip2-magic
  desc: Bzip2 magic bytes in code
  crit: baseline
  conf: 0.5
  if:
    type: hex
    section: .text
    pattern: 42 5A 68
- id: gnu-debugdata-section
  desc: ELF .gnu_debugdata section (mini debug info)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    substr: .gnu_debugdata
composite_rules:
- id: overlay-lzma-header
  desc: LZMA header in a PE carrying an overlay
  crit: notable
  conf: 0.92
  for:
  - pe
  all:
  - id: lzma-header-past-512k
  - id: metadata/binary/layout/overlay::has-overlay
- id: lzma-magic
  desc: LZMA header byte patterns
  crit: notable
  conf: 0.7
  size_max: 52428800
  any:
  - id: metadata/file/magic/numbers::lzma-sized-nonzero-1
  - id: metadata/file/magic/numbers::lzma-sized-nonzero-2
  - id: metadata/file/magic/numbers::lzma-sized-nonzero-3
  - id: lzma-unknown-size
  - id: overlay-lzma-header
- id: multiple-compressed-payloads
  desc: Multiple compression magic byte patterns
  crit: notable
  conf: 0.75
  size_max: 2097152
  needs: 2
  any:
  - id: metadata/binary/instruction/operand::zstd-magic-in-code
  - id: lzma-magic
  - id: xz-magic
  - id: bzip2-magic
