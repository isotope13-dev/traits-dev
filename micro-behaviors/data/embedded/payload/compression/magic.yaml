---
defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: lzma-unknown-size
  desc: LZMA header unknown size marker
  crit: notable
  if:
    type: hex
    section: ".text"
    pattern: 5D 00 00 (01|02|04|08|10|20|40|80) 00 FF FF FF FF FF FF FF FF 00
# Five fixed bytes at an arbitrary offset are weak on their own: in a multi-
# megabyte binary a specific 5-byte run is expected to occur by chance several
# times over, which is how an 11 MB Go CLI with NO overlay at all was reported
# as carrying an "LZMA header in large overlay". The offset bound says "past
# 512 KB", not "past the last section", so the atom is named for that and the
# overlay claim is made by the composite, which requires an overlay to exist.
- id: lzma-header-past-512k
  desc: LZMA header bytes past 512KB
  crit: component
  conf: 0.92
  for:
  - pe
  size_min: 1000000
  if:
    type: hex
    pattern: 5D 00 00 80 00
    offset_range: [524288, null]
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: micro-behaviors/data/embedded/payload/installer::7z-sfx-config-marker
- id: xz-stream-magic-in-archive-container
  desc: XZ stream magic inside a package archive
  crit: notable
  conf: 0.88
  mbc: F0001.006
  attack: T1027.009
  for: [whl]
  size_max: 1048576
  if:
    type: hex
    pattern: FD 37 7A 58 5A 00
- id: xz-magic
  desc: XZ format magic in executable code
  crit: notable
  conf: 0.7
  size_min: 262144
  if:
    type: hex
    section: ".text"
    pattern: FD 37 7A 58 5A 00
  unless:
  # Codec libraries embed the XZ magic as a format-identifier constant for
  # stream detection — that is not an embedded compressed payload.
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: metadata/lang/compiled/
  - id: well-known/lib/format/
  - id: micro-behaviors/data/compression::compression-library-evidence
- id: gzip-magic
  desc: Valid embedded gzip header
  crit: baseline
  conf: 0.5
  if:
    type: hex
    section: ".text"
    pattern: '1F 8B 08 (0?|1?)'
- id: bzip2-magic
  desc: Embedded bzip2 compressed data
  crit: baseline
  conf: 0.5
  if:
    type: hex
    section: ".text"
    pattern: 42 5A 68
- id: gnu-debugdata-section
  desc: ELF .gnu_debugdata section (mini debug info)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    substr: ".gnu_debugdata"
composite_rules:
- id: overlay-lzma-header
  desc: LZMA header in a PE carrying an overlay
  crit: notable
  conf: 0.92
  for:
  - pe
  all:
  - id: lzma-header-past-512k
  - id: metadata/binary/layout/overlay::has-overlay
- id: lzma-magic
  desc: Embedded LZMA compressed data
  crit: notable
  conf: 0.7
  mbc: F0001.006
  attack: T1027.009
  size_max: 52428800
  any:
  - id: metadata/file/magic/numbers::lzma-sized-nonzero-1
  - id: metadata/file/magic/numbers::lzma-sized-nonzero-2
  - id: metadata/file/magic/numbers::lzma-sized-nonzero-3
  - id: lzma-unknown-size
  - id: overlay-lzma-header
- id: multiple-compressed-payloads
  desc: Multiple embedded compressed payloads
  crit: suspicious
  conf: 0.75
  mbc: F0001.006
  attack: T1027.009
  size_max: 2097152
  needs: 2
  any:
  - id: metadata/binary/instruction/operand::zstd-magic-in-code
  - id: lzma-magic
  - id: xz-magic
  - id: bzip2-magic
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: metadata/binary/framework::dotnet-metadata
    - id: gnu-debugdata-section
    - id: metadata/binary/vendor/
    - id: well-known/lib/format/
    - id: metadata/lang/compiled/
  unless:
    - id: well-known/tool/
