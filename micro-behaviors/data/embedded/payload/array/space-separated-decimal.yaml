# Bytes written as fixed-width decimal groups separated by spaces: "077 090
# 144 ...". A long unbroken run of such groups in one string is a serialized
# binary blob, not prose or a numeric table a UI would display; generators
# often reverse or offset the digits so no recognisable header survives.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1027

traits:
  - id: space-separated-decimal-triplet-run
    desc: Long run of space-separated decimal triplets
    if:
      type: text
      regex: '([0-9]{3} ){60}'
