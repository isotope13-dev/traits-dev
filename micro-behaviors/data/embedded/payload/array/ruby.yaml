# A Ruby literal that carries a long run of byte-ranged decimal integers —
# `TABLE = [1, 0, 45, 12, ...]`. This is how a Ruby loader embeds a payload it
# will XOR and inflate, and equally how every Ragel-generated lexer emits its
# transition tables (regexp_parser's lib/regexp_parser/scanner.rb, the mail
# gem's parsers). The literal alone records only "this file carries a decimal
# byte array"; the multi-layer loader composite in
# objectives/anti-static/obfuscation/multi-layer/ supplies the XOR + inflate +
# eval evidence that makes it a payload.
#
# Siblings: c.yaml (`0x4d, 0x5a, ...`), decimal.yaml (script-embedded PE image),
# escaped-bytes.yaml (`"\xNN"` rows).
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.9
  attack: T1027

traits:
  - id: ruby-decimal-byte-array-literal
    desc: Ruby decimal byte-array literal, 33+ elements
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*=\s*\[\s*\d{1,3}(\s*,\s*\d{1,3}){32,}\s*\]'
