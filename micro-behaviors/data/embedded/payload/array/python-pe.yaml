# Python source carrying or referring to an embedded Windows PE payload.
defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  # Text-level on purpose: huge or malformed modules can exceed the parser's
  # scanner-state budget, but an escaped DOS header remains visible in source.
  - id: escaped-pe-bytes-literal
    desc: Escaped Python PE bytes literal
    if:
      type: text
      regex: '(?i)\bb?["'']MZ\\x90\\x00\\x03\\x00\\x00\\x00'

  - id: embedded-pe-byte-array
    desc: Embedded PE byte array
    if:
      type: text
      regex: '(?is)\b[A-Za-z_]\w*\s*=\s*\[\s*0x4d\s*,\s*0x5a\s*,\s*0x'

  - id: python-references-embedded-pe-module
    desc: Python references embedded PE module bytes
    if:
      type: text
      regex: 'bytes\(\s*embed\.[A-Za-z_]\w*\s*\)'
