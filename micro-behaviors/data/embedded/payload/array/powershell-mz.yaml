defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # Do not require the stock DOS stub: shellcode-bearing PE images can begin
  # MZ followed by instructions. This observes array construction, not PE
  # validity, loading, or execution.
  - id: powershell-typed-mz-byte-array
    desc: PowerShell typed byte array begins with MZ
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[byte\[\]\]\s*\$\w+\s*=\s*\(\s*77\s*,\s*90\s*,'
