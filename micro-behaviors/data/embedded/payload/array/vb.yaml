# VB.NET/VB6 byte-array literal opening with the DOS header bytes
# MZ 0x90 0x00 (`&H4D, &H5A, &H90, &H0`): a whole PE image carried in source.
# Siblings: c.yaml (`0x4d, 0x5a, ...`), powershell-mz.yaml.
defaults:
  conf: 0.92
  platforms: [windows]
  for: [vbs]

traits:
  - id: embedded-pe-in-vb-hex-array
    desc: PE image in VB hex byte array
    crit: notable
    if:
      type: text
      regex: '(?i)&H4D,\s*&H5A,\s*&H90,\s*&H0{1,2}\b'
