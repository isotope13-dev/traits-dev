# The compiled form of the byte-array embedding that the siblings in this
# directory detect in source: `xxd -i payload.py > payload.h` emits an
# `unsigned char <mangled_path>_py[]` array plus an
# `unsigned int <mangled_path>_py_len` companion, and both names survive into
# the linked binary's symbol table. The `_len` companion is what makes this
# readable at symbol level — an ordinary data export does not come in a
# `<name>` / `<name>_len` pair named after a source file's extension.
#
# Neutral on its own: build systems legitimately compile in a default config,
# a licence text, a shader, or a test corpus this way. It records only "this
# binary carries a file of the named kind as a byte array". Objective
# composites (dropper staging, self-extracting loaders) supply the write and
# execute evidence.
defaults:
  platforms: [unix, windows, android]
  for: [elf, macho, pe, so, dylib, dll]
  crit: notable
  conf: 0.9
  attack: T1027.009

traits:
  - id: embedded-script-blob-export
    desc: Exports an xxd-style embedded script array
    if:
      type: export
      regex: '_(py|sh|js|lua)_len$'

  - id: embedded-archive-blob-export
    desc: Exports an xxd-style embedded archive array
    if:
      type: export
      regex: '_(zip|tar|whl|jar)_len$'
