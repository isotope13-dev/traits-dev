# A long typed hexadecimal byte array is a common way to compile an opaque
# resource into Zig. It is neutral until a composite proves decode and use.
defaults:
  platforms: [linux, macos, windows]
  for: [zig]
  crit: notable
  conf: 0.94

traits:
  - id: zig-hex-byte-array-literal
    desc: Zig embeds a long hexadecimal byte array
    if:
      type: text
      regex: '\[\s*\d{2,5}\s*\]u8\s*\{\s*0x[0-9a-fA-F]{2}(\s*,\s*0x[0-9a-fA-F]{2}){15,}'

