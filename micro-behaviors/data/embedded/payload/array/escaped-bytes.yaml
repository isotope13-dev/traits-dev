# Binary blobs embedded into source/script text as C-style "\xNN" byte escapes.
# This is the emit format of every mainstream shellcode generator (msfvenom
# -f c/python/perl/ruby/php, donut, sRDI) and of xxd-style dumpers: a payload is
# written out as quoted rows of fixed-width byte escapes, one row per line,
# concatenated by the language's adjacent-string-literal rule.
#
# Neutral on its own — a C file legitimately embeds test vectors, key material,
# or a compressed resource this way, and this fires on any such blob regardless
# of content. It records only "this file carries a binary blob as escaped
# bytes". Objective composites (shellcode staging, extension masquerade,
# API-hash loaders) reference it and supply the intent evidence.
#
# `for:` is the set of languages whose string syntax actually uses \xNN escapes
# — i.e. the languages shellcode generators emit this shape into.
# Sibling array/c.yaml covers the `0x4d, 0x5a, ...` comma-separated form.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, python, powershell, perl, ruby, php, javascript, go]
traits:
  - id: quoted-byte-escape-rows
    desc: Quoted \x byte-escape rows (payload blob)
    crit: notable
    conf: 0.9
    # 16+ rows: a couple of short escaped strings are ordinary source; a wall of
    # fixed-width escape rows is a dumped payload.
    count_min: 16
    if:
      type: text
      regex: '(?m)^[ \t]*"(\\x[0-9a-fA-F]{2}){8,32}",?;?$'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # `48 31 /r` is REX.W + XOR r/m64, r64 — the register-zeroing idiom every x64
  # shellcode stub opens with. The third byte must be a register-direct ModRM
  # (mod=11 -> C0..FF): `48 31 c0` (xor rax,rax), `48 31 d2`, `48 31 f6`, ...
  # Matching the bare `\x48\x31` pair fired on any source that hex-escapes plain
  # text, because "H1" escapes to exactly those two bytes -- obfuscator.io
  # \x-escapes every character of its string table, so its base64-ish entries
  # produced a "shellcode" hit per file. An escaped ASCII run can never reach
  # C0..FF, so requiring the ModRM byte drops that whole class.
  - id: escaped-x64-xor-instruction
    desc: Escaped x64 register XOR instruction bytes
    crit: notable
    conf: 0.96
    for: [shell, python, perl, ruby, go, c, cpp, javascript]
    if:
      type: text
      regex: '\\x48\\x31\\x[c-fC-F][0-9a-fA-F]'
    unless:
      - id: metadata/lang/source::generated-do-not-edit-text
      - id: metadata/build/artifact::go-bindata-generated-source
      - id: well-known/app/system/olares::cli-source-tree
      - id: well-known/app/network/gns3::gns3-gui-package-member
      - id: well-known/lib/format/bine::geoip-embedded-data
