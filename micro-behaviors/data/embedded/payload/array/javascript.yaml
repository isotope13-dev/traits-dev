defaults:
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # Executable-format signature bytes written as a numeric array literal, the
  # way a script synthesizes a file header (ELF 7f 45 4c 46, PE 4d 5a, Mach-O
  # cf fa). Only the signature is asserted, not a complete embedded binary.
  - id: executable-magic-byte-array
    desc: JS byte array starting with executable magic
    crit: notable
    if:
      type: text
      regex: '\[\s*0x7f,\s*0x45,\s*0x4c,\s*0x46\b|\[\s*0x4d,\s*0x5a\s*\]|\[\s*0xcf,\s*0xfa\b'
