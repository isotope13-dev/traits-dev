# Scripts that carry a Windows PE image as a comma-separated *decimal* byte
# array — 77,90,144,0,3,0,0,0,4,... is "MZ\x90\x00\x03\x00\x00\x00\x04", the
# DOS header. Script loaders prefer this spelling because the array can be fed
# straight to [Reflection.Assembly]::Load or to a hollowing helper without a
# decode step. The 0x-hex spelling of the same idea lives in c.yaml and
# python-pe.yaml.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, javascript, python]
  crit: notable
  conf: 0.95
  attack: T1027

traits:
  - id: decimal-mz-dos-header-array
    desc: Embedded PE image as decimal byte array
    if:
      type: text
      regex: '\b77,\s*90,\s*144,\s*0,\s*3,\s*0,\s*0,\s*0,\s*4,'

  # The same byte array written one value per line rather than comma-separated:
  # `@('120\n88\n195\n...')` in PowerShell, a heredoc fed to `split("\n")`
  # elsewhere. Generators spell it this way to break the comma-delimited
  # patterns that byte-array rules look for, and the payload is unchanged.
  # Density is required as well as count so that an incidental numeric block
  # inside a large source file is not read as an embedded payload.
  - id: decimal-byte-array-per-line
    desc: Payload as one decimal byte per line
    count_min: 32
    per_kb_min: 5.0
    if:
      type: text
      regex: '(?m)^[0-9]{1,3}\r?$'
