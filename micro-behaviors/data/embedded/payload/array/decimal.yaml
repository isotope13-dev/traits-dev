# Scripts that carry a Windows PE image as a comma-separated *decimal* byte
# array — 77,90,144,0,3,0,0,0,4,... is "MZ\x90\x00\x03\x00\x00\x00\x04", the
# DOS header. Script loaders prefer this spelling because the array can be fed
# straight to [Reflection.Assembly]::Load or to a hollowing helper without a
# decode step. The 0x-hex spelling of the same idea lives in c.yaml and
# python-pe.yaml.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, javascript, python]
  crit: notable
  conf: 0.95
  attack: T1027

traits:
  - id: decimal-mz-dos-header-array
    desc: Embedded PE image as decimal byte array
    if:
      type: text
      regex: '\b77,\s*90,\s*144,\s*0,\s*3,\s*0,\s*0,\s*0,\s*4,'
