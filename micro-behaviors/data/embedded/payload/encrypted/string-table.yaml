# Dozens of standalone base64 strings whose decoded form starts with a
# 4-byte big-endian length below 256 ("AAAA" prefix): a table of encrypted
# strings that the program decodes at runtime instead of storing any API,
# path or registry name in the clear.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  attack: T1027.013

traits:
  - id: length-prefixed-base64-string-table
    desc: Stores a table of encrypted strings
    crit: suspicious
    conf: 0.85
    count_min: 20
    if:
      type: text
      regex: '^AAAA[A-Za-z0-9+/]{6,200}={0,2}$'
    # Not the fixed-width lines of ONE wrapped blob: PEM wraps at 64 columns,
    # MIME at 76, others at 72-80. PIL's ImageFont.pyc carries its default
    # bitmap font that way -- 38 lines of 76-77 opening with zero bytes. An
    # encrypted table of API, path and registry names encodes shorter strings.
    not:
      - regex: '^[A-Za-z0-9+/=]{64,80}$'
