defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.95

# AES-GCM, Base64 decoding, and document writes are individually neutral APIs.
# Their co-occurrence establishes an encrypted browser-content rendering
# mechanism, not that the content decrypts successfully, is executable, or is
# malicious. Objective rules must add independent attack-specific evidence.
composite_rules:
  - id: browser-aes-gcm-document-render
    desc: Combines AES-GCM decryption with document writing
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::webcrypto-aes-gcm-decrypt
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/ui/window/manage/dom::browser-document-write
    near_bytes: 4096

  # This records the additional presence of a key-width Base64 literal without
  # claiming the literal is actually passed to importKey; the matcher does not
  # establish variable-level data flow.
  - id: browser-aes-gcm-render-with-key-width-literal
    desc: AES-GCM browser render includes key-width Base64 literal
    all:
      - id: browser-aes-gcm-document-render
      - id: micro-behaviors/crypto/symmetric/aes/library::webcrypto-aes-gcm-importkey
      - id: metadata/file/encoded::base64-16-or-32-byte-literal
    near_bytes: 4096
