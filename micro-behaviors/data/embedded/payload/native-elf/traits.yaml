defaults:
  platforms: [unix]
  for: [elf]
  size_max: 52428800
  mbc: F0001.006
  attack: T1027.009

traits:
  - id: rodata-embedded-elf
    desc: Embedded ELF64 little-endian binary in rodata
    crit: notable
    conf: 0.84
    if:
      type: hex
      section: .rodata
      # Require a valid ELF type and version after the magic.  The glibc
      # startup data in statically linked Go binaries contains the magic and
      # interpreter/environment strings but is not an embedded ELF payload.
      pattern: 7F 45 4C 46 02 01 01 ?? [8] 02 00 ?? ?? 01 00 00 00
      offset_range:
        - 4096
        - null

  - id: rodata-embedded-elf-dyn
    desc: Embedded ELF64 shared-object binary in rodata
    crit: notable
    conf: 0.84
    if:
      type: hex
      section: .rodata
      pattern: 7F 45 4C 46 02 01 01 ?? [8] 03 00 ?? ?? 01 00 00 00
      offset_range:
        - 4096
        - null

  - id: rodata-embedded-elf32-le
    desc: Embedded ELF32 little-endian binary in rodata
    crit: notable
    conf: 0.84
    if:
      type: hex
      section: .rodata
      pattern: 7F 45 4C 46 01 01 01 ?? [8] 02 00 ?? ?? 01 00 00 00
      offset_range:
        - 4096
        - null

  - id: rodata-embedded-elf32-le-dyn
    desc: Embedded ELF32 shared-object binary in rodata
    crit: notable
    conf: 0.84
    if:
      type: hex
      section: .rodata
      pattern: 7F 45 4C 46 01 01 01 ?? [8] 03 00 ?? ?? 01 00 00 00
      offset_range:
        - 4096
        - null
  # A whole ELF carried as base64 text. `f0VMRg` is the encoding of the four
  # magic bytes, so this fires wherever an executable is smuggled through a
  # text channel -- a Go binary's rodata, a shell installer, a JSON blob --
  # without needing to scan for the decoded image. No size cap: the carrier is
  # usually large precisely because it holds a second program.
  - id: base64-embedded-elf-image
    desc: Base64-encoded ELF image in file
    crit: notable
    conf: 0.92
    size_max: 1073741824
    for: [elf, macho]
    if:
      # Raw bytes, not extracted strings: a native binary's string extractor
      # does not surface long base64 runs inside rodata, which is exactly
      # where a Go binary keeps an embedded image. The trailing run keeps the
      # match on real encoded data rather than a bare mention of the magic.
      type: raw
      regex: 'f0VMRgIB[A-Za-z0-9+/]{24,}'
