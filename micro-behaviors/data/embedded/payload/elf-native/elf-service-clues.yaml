# ELF structure and service-related references do not prove impersonation.
defaults:
  platforms:
  - linux
  for:
  - elf
traits: []
composite_rules:
- id: embedded-elf-service-name-clues
  desc: Embedded ELF and service-related name clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/embedded/payload/elf-native::static-embedded-elf-entropy-api-clues
  any:
  - id: metadata/lang/source/naming/target::httpd-name-reference
  - id: micro-behaviors/fs/path/binary::binary-usr-sbin
  - id: micro-behaviors/fs/proc/mounts::mounts-mountinfo
