# XMRig's donation host and its donate-level config key, Base64-encoded at all
# three byte alignments. They occur only when an XMRig image or its config is
# carried as Base64 data inside another file, such as a Go string constant;
# the decoded miner itself is never seen by a text search.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.9
  attack: T1027

traits:
  - id: base64-encoded-xmrig-donate-host
    desc: Base64 data encodes the XMRig donation host
    if:
      type: raw
      regex: 'ZG9uYXRlLnYyLnhtcmln|RvbmF0ZS52Mi54bXJp|kb25hdGUudjIueG1y'
  - id: base64-encoded-donate-level-key
    desc: Base64 data encodes the XMRig donate-level key
    if:
      type: raw
      regex: 'ImRvbmF0ZS1sZXZl|Jkb25hdGUtbGV2ZWwi|iZG9uYXRlLWxldmVs'
