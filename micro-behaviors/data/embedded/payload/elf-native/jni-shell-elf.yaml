# Embedded header and JNI/shell API references do not establish staging.
defaults:
  platforms:
  - android
  for:
  - elf
composite_rules:
- id: jni-shell-embedded-elf-header-clues
  desc: JNI, shell APIs and embedded ELF header
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/layout/embedded::elf32-header-after-start
  - id: metadata/binary/symbols/plugin::jni-native-method-exports
  - id: metadata/binary/symbols/name/process::c-system-import
  - id: metadata/binary/symbols/name/process::c-popen
