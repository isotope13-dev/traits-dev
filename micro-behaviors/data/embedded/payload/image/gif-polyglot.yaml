defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: gif-header-in-script
    desc: GIF image header in PHP file
    crit: suspicious
    conf: 0.99
    attack: T1505.003
    if:
      type: text
      regex: '^GIF8[79]a'
    unless:
      - id: well-known/lib/benign-runtime-bundles::php-source-tree
