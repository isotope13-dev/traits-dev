defaults:
  platforms: [windows, unix]
  for: [php]

# The GIF magic itself is `metadata/file/magic/identity::gif-magic-header`.
# What makes it a web shell is *where* it sits: at the head of a file the
# server will execute as PHP. That context is this rule; the header is not
# respelled here.
composite_rules:
  - id: gif-header-in-script
    desc: GIF image header in PHP file
    crit: suspicious
    conf: 0.99
    attack: T1505.003
    any:
      - id: metadata/file/magic/identity::gif-magic-header
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/lib/runtime/php-runtime::source-tree
