defaults:
  platforms: [windows, unix]
  for: [php, asp]

# The GIF magic itself is `metadata/file/magic/identity::gif-magic-header`.
# This records the header in a script, independent of collection directory.
# Request-to-command evidence in the objective establishes the webshell.
composite_rules:
  - id: gif-header-in-script
    desc: GIF image header in script file
    crit: notable
    conf: 0.99
    any:
      - id: metadata/file/magic/identity::gif-magic-header
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
