defaults:
  platforms: [unix, windows]
  for: [class]
composite_rules:
  - id: png-inflate-process-class
    desc: JVM class combines PNG extraction, inflation and process launch
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/media/raster::jvm-png-signature-byte-array
      - id: micro-behaviors/data/decompress/zlib::java-inflater-set-input
      - id: micro-behaviors/data/decompress/zlib::java-inflater-inflate
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
