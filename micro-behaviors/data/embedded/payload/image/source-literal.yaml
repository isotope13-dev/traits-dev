# A whole PNG file inlined into source as a string or byte-array literal.
#
# Shipping an image as a literal is ordinary on its own -- an icon, a favicon,
# a test fixture -- so these stay notable. What they buy an objective composite
# is the fact a bare `& 1` can never supply: the bytes the low-bit arithmetic
# is walking really are image pixels, and they travel with the package rather
# than being fetched. Every matcher anchors on the 8-byte PNG signature in the
# encoding the literal uses, and requires enough payload after it to rule out a
# passing mention of the magic in a comment or a format table.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [scripts, source, class]
  conf: 0.9
  mbc: F0001.006
  attack: T1027.003

traits:
  # `iVBORw0KGgo` is base64 of 89 50 4E 47 0D 0A 1A 0A. Data-URI icons hit this
  # too, which is why the atom is notable and never an objective on its own.
  - id: png-magic-base64-literal
    desc: Source inlines a base64-encoded PNG file
    if:
      type: text
      regex: '["'']iVBORw0KGgo[A-Za-z0-9+/]{128,}'

  - id: png-magic-hex-literal
    desc: Source inlines a hex-encoded PNG file
    if:
      type: text
      regex: '(?i)["'']89504e470d0a1a0a[0-9a-f]{128,}'

  # Perl's pack('C*', ...) and Ruby's [..].pack('C*') both spell the signature
  # as decimal bytes.
  - id: png-magic-decimal-byte-literal
    desc: PNG inlined as a decimal byte list
    if:
      type: text
      regex: '\b137\s*,\s*80\s*,\s*78\s*,\s*71\s*,\s*13\s*,\s*10\s*,\s*26\s*,\s*10\s*,'

  - id: rust-include-bytes-png
    desc: Rust compiles a PNG into the binary
    for: [rust]
    if:
      type: text
      regex: 'include_bytes!\s*\(\s*"[\w./-]{0,80}\.png"\s*\)'

composite_rules:
  - id: embedded-png-source-literal
    desc: Source carries a PNG file as a literal
    crit: notable
    conf: 0.9
    any:
      - id: png-magic-base64-literal
      - id: png-magic-hex-literal
      - id: png-magic-decimal-byte-literal
      - id: rust-include-bytes-png
