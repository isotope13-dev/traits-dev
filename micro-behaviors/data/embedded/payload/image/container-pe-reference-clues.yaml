defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: image-container-pe-reference-clues
  desc: Image container and PE inspection clues
  crit: suspicious
  conf: 0.98
  all:
    - id: micro-behaviors/data/embedded/payload/image::native-image-container-name-clues
    - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  any:
    - id: metadata/binary/symbols/name/api-resolution::winapi-virtual-alloc-symbol
    - id: metadata/binary/symbols/name/function::pic-decode-dib-symbol
    - id: metadata/lang/natural/diagnostic::blob-or-pe-size-log-format
  needs: 2
