defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: image-container-memory-api-clues
  desc: Image container and memory API clues
  crit: suspicious
  conf: 0.94
  all:
    - id: micro-behaviors/data/embedded/payload/image::native-image-container-name-clues
  any:
    - id: metadata/binary/symbols/name/api-resolution::winapi-virtual-alloc-symbol
    - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check

