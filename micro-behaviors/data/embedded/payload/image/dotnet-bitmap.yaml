defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1027.003
  mbc: F0001.006

traits:
  - id: dotnet-bitmap-type-token
    desc: .NET Bitmap type reference
    conf: 0.82
    if:
      type: text
      word: System.Drawing.Bitmap

  # Bitmap loaders may keep second-stage API names in a resource. These are
  # notable decoded capabilities, while ordinary visible image APIs remain
  # baseline in the pixel behavior directory.
  - id: dotnet-hidden-pixel-readback-marker
    desc: Encoded .NET pixel readback marker
    conf: 0.88
    if:
      type: encoded
      regex: '(?i)\b(GetPixel|FromArgb|ToArgb|LockBits)\b'

composite_rules:
  - id: dotnet-resource-backed-bitmap
    for: [pe]
    desc: .NET resource-backed bitmap object
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-bitmap-type-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager

  - id: dotnet-resource-bitmap-pixel-readback
    for: [pe]
    desc: .NET resource bitmap pixel readback
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-bitmap-type-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
    any:
      # GetPixel/ToArgb and LockBits are both used by stego loaders to pull
      # payload bytes from an embedded resource bitmap (Olock/Fareit-style).
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/data/encode/image/pixel::pixel-access-lockbits
