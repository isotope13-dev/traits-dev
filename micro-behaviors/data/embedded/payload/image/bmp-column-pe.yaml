# Read RGB bytes in the same column order as Bitmap.GetPixel(x, y). Match
# both the DOS header and the PE signature at its decoded e_lfanew offset.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: bmp-rgb-column-pe-header
    desc: BMP RGB column contains validated PE headers
    conf: 0.99
    if:
      type: yara
      source: |
        rule bmp_rgb_column_pe_header {
          strings:
            $bmp = { 42 4D [12] 28 00 00 00 }
          condition:
            for any b in (1..#bmp) : (
              uint16(@bmp[b]+28) == 32 and uint32(@bmp[b]+30) == 0 and
              uint32(@bmp[b]+18) >= 1 and uint32(@bmp[b]+18) <= 4096 and
              uint32(@bmp[b]+22) >= 64 and uint32(@bmp[b]+22) <= 4096 and
              uint32(@bmp[b]+10) >= 54 and
              for any stride in (uint32(@bmp[b]+18)*4..uint32(@bmp[b]+18)*4) : (
                for any p in (@bmp[b]+uint32(@bmp[b]+10)+(uint32(@bmp[b]+22)-1)*stride..@bmp[b]+uint32(@bmp[b]+10)+(uint32(@bmp[b]+22)-1)*stride) : (
                  uint8(p+2) == 0x4d and uint8(p+1) == 0x5a and uint8(p) == 0x90 and
                  for any e in (64..512) : (
                    e+4 < uint32(@bmp[b]+22)*3 and
                    uint8(p-20*stride+2) == (e & 255) and
                    uint8(p-20*stride+1) == (e >> 8) and
                    uint8(p-20*stride) == 0 and uint8(p-21*stride+2) == 0 and
                    uint8(p-(e\3)*stride+2-(e%3)) == 0x50 and
                    uint8(p-((e+1)\3)*stride+2-((e+1)%3)) == 0x45 and
                    uint8(p-((e+2)\3)*stride+2-((e+2)%3)) == 0 and
                    uint8(p-((e+3)\3)*stride+2-((e+3)%3)) == 0
                  )
                )
              )
            )
        }
