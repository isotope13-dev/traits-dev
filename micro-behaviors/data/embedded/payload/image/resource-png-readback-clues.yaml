---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: resource-png-pixel-readback-clues
  desc: Resource PNG and pixel readback clues
  conf: 0.88
  unless:
  - id: metadata/installer/product::known-installer-context
  - id: micro-behaviors/fs/write/file/resource::update-resource-any
  - id: metadata/filename/name-form::is-microsoft-named
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/resource/embedded-media::png-and-manifest-rsrc
  - id: micro-behaviors/ui/graphics/image::gdiplus-startup
  - id: micro-behaviors/ui/graphics/image::gdiplus-bitmap-stream-pixel-readback
  any:
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/process/info/current::get-current-process
  - id: micro-behaviors/dylib/unload::free-library
  needs: 2
