# Short executable stubs stored as data for copying over function entries.
# A single return-zero function is common; require different variants nearby.
# The three-byte forms recur by chance in compressed or encrypted bodies (an
# 85 MB Nuitka onefile .rdata holds several), so they are not reported for
# files whose whole-file entropy is already near-random.
# A section named .rdata may contain executable code in a dumped or packed PE;
# exclude that case before describing instruction bytes as stored patch data.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86, x86-64]
  crit: notable
  conf: 0.95
traits:
  - id: xor-eax-return-data
    desc: XOR EAX return-zero stub in read-only data
    if:
      type: hex
      section: .rdata
      pattern: '(33 C0 | 31 C0) C3'
    unless:
      - id: metadata/file/entropy::overall-entropy-78
      - type: section
        exact: .rdata
        executable: true
  - id: sub-eax-return-data
    desc: SUB EAX return-zero stub in read-only data
    if:
      type: hex
      section: .rdata
      pattern: '2B C0 C3'
    unless:
      - id: metadata/file/entropy::overall-entropy-78
      - type: section
        exact: .rdata
        executable: true
  - id: mov-eax-zero-return-data
    desc: MOV EAX return-zero stub in read-only data
    if:
      type: hex
      section: .rdata
      pattern: 'B8 00 00 00 00 C3'
    unless:
      - type: section
        exact: .rdata
        executable: true
  - id: push-zero-return-data
    desc: PUSH zero return stub in read-only data
    if:
      type: hex
      section: .rdata
      pattern: '6A 00 58 C3'
    unless:
      - type: section
        exact: .rdata
        executable: true
composite_rules:
  - id: varied-return-zero-stubs
    desc: Multiple return-zero patch variants stored as data
    needs: 3
    near_bytes: 128
    any:
      - id: xor-eax-return-data
      - id: sub-eax-return-data
      - id: mov-eax-zero-return-data
      - id: push-zero-return-data
