defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: unsigned-resource-pe-library-operations
    desc: Unsigned PE locates resources containing PE data and uses DLL APIs
    crit: notable
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
    any:
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: well-known/app/
      - id: well-known/lib/
