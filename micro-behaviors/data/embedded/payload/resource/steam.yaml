defaults:
  crit: component
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: extract-launch-steam
    desc: Steam extraction-and-launch helper reference
    if:
      type: text
      substr: ExtractAndLaunchSteam
  - id: get-embedded-steam
    desc: Embedded Steam resource helper reference
    if:
      type: text
      substr: GetEmbeddedSteam
  - id: extracting-steam-resources
    desc: Steam resource-extraction status text
    if:
      type: text
      substr: Extracting Steam from resources

composite_rules:
  - id: steam-resource-extraction-reference
    desc: Steam embedded-resource extraction reference
    crit: component
    conf: 0.9
    any:
      - id: extract-launch-steam
      - id: get-embedded-steam
      - id: extracting-steam-resources
