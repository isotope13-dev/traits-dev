defaults:
  platforms: [unix, windows]
  for: [java, class, java_class, jar, zip]

traits:
  - id: java-getresourceasstream
    desc: Java classpath resource stream lookup
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: java/lang/ClassLoader.getResourceAsStream
  - id: java-class-getresourceasstream
    desc: Java class-relative resource stream lookup
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: java/lang/Class.getResourceAsStream

composite_rules:
  - id: java-classpath-resource-stream
    desc: Java reads a bundled classpath resource
    crit: notable
    conf: 0.92
    any:
      - id: java-getresourceasstream
      - id: java-class-getresourceasstream
