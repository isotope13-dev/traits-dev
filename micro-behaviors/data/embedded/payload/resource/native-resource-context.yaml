defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: delphi-resource-access-allocation
  desc: Delphi resource access and allocation APIs
  crit: notable
  conf: 0.94
  all:
  - id: metadata/lang/compiler/managed::delphi
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  any:
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/infrastructure/atlantis/
- id: unsigned-delphi-resource-access
  desc: Unsigned Delphi resource-access API cluster
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/payload/resource::delphi-resource-access-allocation
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: metadata/binary/provenance/build::header-timestamp-pre-2000
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/signed/platform/
- id: ansi-resource-access-layout
  desc: ANSI resource access with large resources
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
  - id: metadata/file/string/application-name::tool-identity-putty
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/infrastructure/atlantis/
  # IObit Advanced SystemCare's tray, monitor and setup helpers read their
  # own compressed resources through the ANSI APIs by design; the verified
  # vendor identity marks the known-benign suite.
  - id: well-known/app/system/iobit::iobit-signed-component-context
  all:
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-a
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/data/embedded/payload/resource::lock-resource
  - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
  any:
  - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
  - id: metadata/binary/resource/entropy::major-high-entropy-rsrc-section
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/code/complexity::no-functions
  - id: metadata/binary/resource/size::large-rsrc-section
  needs: 3
