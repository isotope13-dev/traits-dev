defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: opaque-resource-crypto-write-api-surface
    desc: Opaque resource/crypto/file-write APIs co-occur
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/file/extension/identity::netstandard-dll-basename
    # Entropy and API presence establish no source-to-sink data flow.
    all:
      - id: metadata/binary/resource/size::clr-resource-high-entropy
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-embedded-resource-read-any
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-managed
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
