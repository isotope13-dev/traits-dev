defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: resource-command-process-io-profile
    desc: PE resource, command, process and file-I/O indicators
    # Resource access, cmd.exe, process creation and file APIs co-occur in
    # ordinary applications too; the matcher establishes no payload flow.
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/process/create/exec::create-process-a
    any:
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
