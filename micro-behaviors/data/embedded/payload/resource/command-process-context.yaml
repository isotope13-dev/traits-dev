defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: resource-temp-command-process-context
    desc: PE resource access near temp and process APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/shell::encoded-cmd-exe-reference
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/process/create/spawn::create-process-a
    any:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-name
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
