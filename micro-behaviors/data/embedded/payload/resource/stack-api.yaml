defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-stack-findresourcea-name
    desc: Constructs FindResourceA API name on stack
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Overlapping stores construct FindResourceA, not an unqualified word
      # in data. Frame displacement and register allocation may vary.
      pattern: '48 B? 46 69 6E 64 52 65 73 6F [0-16] 48 B? 73 6F 75 72 63 65 41 00 [0-16] 48 89'
