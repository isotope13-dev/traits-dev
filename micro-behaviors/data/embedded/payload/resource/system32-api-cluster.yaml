defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: pe-resource-system32-write-api-cluster
  desc: PE resource/write API cluster with System32 target
  crit: notable
  conf: 0.95
  size_min: 40000
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  any:
  - id: micro-behaviors/os/service/host::system32-service-dll-target
  - id: micro-behaviors/fs/path/system::system32-executable-path
  unless:
  # kernelbase.dll and friends *provide* FindResource/WriteFile/
  # GetSystemDirectory to the programs above them — Wine's PE
  # reimplementations most visibly, but genuine Windows system DLLs and
  # ReactOS the same way. An API provider exporting the surface is the
  # opposite of a dropper importing it, so the vendor/implementer directory
  # moved from `downgrade:` to a suppression.
  - id: metadata/binary/vendor/
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
  - id: well-known/app/enterprise/citrix-receiver::citrix-pnagent-context
  # Action1 Endpoint Agent installs/updates service binaries under System32.
  - id: well-known/dual-use/remote-admin/action1::action1-version-resource-context
