defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: opaque-resource-module-export-lookup
  desc: High-entropy resource access with module and export lookup
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/section/permission::dominant-high-entropy-rsrc-section
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: micro-behaviors/fs/temp/py2exe::py2exe-bundle
    - id: well-known/app/system/drivers/
    - id: well-known/app/security/mcafee-epolicy/
  unless:
  - id: metadata/signed/unknown::ip-zinukhov-stanislav-igorevich
  - id: metadata/signed/unknown::yandex-llc
