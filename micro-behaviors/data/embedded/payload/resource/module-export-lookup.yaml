defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: resource-extraction-module-lookup-references
  desc: Resource extraction and module lookup API refs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: micro-behaviors/fs/temp/py2exe::py2exe-bundle
    - id: well-known/app/system/drivers/
    - id: well-known/app/security/mcafee-epolicy/
  unless:
  - id: metadata/signed/unknown::ip-zinukhov-stanislav-igorevich
  - id: metadata/signed/unknown::yandex-llc
