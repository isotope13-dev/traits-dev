defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

composite_rules:
  - id: xor-resource-clr-api-profile
    desc: Opaque resources, XOR and CLR/PE lookup clues
    conf: 0.95
    all:
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
      - id: opaque-resource-module-export-lookup
      - id: micro-behaviors/data/decode/xor::x86-unrolled-byte-xor-to-stack
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/dylib/library/family::mscoree-dll-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
