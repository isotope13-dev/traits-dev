defaults:
  for: [pe]
  platforms: [windows]

# Archive-scoped coexistence does not bind an extracted image to a process.
composite_rules:
  - id: managed-resource-process-tcp-references
    desc: Embedded PE/resources beside process and TCP API references
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start-split-tokens
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
