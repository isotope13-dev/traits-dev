---
defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: dotnet-getmanifestresourcestream
  desc: .NET manifest resource stream API reference
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: text
    exact: GetManifestResourceStream
- id: dotnet-resource-reader
  desc: References the .NET ResourceReader type
  crit: notable
  conf: 0.86
  for:
  - pe
  if:
    type: text
    substr: System.Resources.ResourceReader
- id: dotnet-resource-writer
  desc: References a .NET ResourceWriter type
  crit: notable
  conf: 0.86
  for:
  - pe
  - dll
  if:
    type: text
    substr: ResourceWriter
- id: dotnet-get-resource-data
  desc: ".NET GetResourceData resource read"
  crit: notable
  conf: 0.86
  attack: T1027.009
  for:
  - pe
  if:
    type: text
    exact: GetResourceData
- id: dotnet-resourcemanager
  desc: .NET ResourceManager type or property reference
  crit: notable
  conf: 0.78
  for: [pe, dll, csharp]
  if:
    type: text
    regex: '(^|[^@?\w]|get_)ResourceManager([^@\w]|$)'
- id: dotnet-filterresources-iterator
  desc: ".NET resource filter iterator"
  crit: notable
  conf: 0.9
  attack: T1027.009
  for:
  - pe
  if:
    type: text
    regex: "^<FilterResources>d__\\d+`1$"
- id: costura-bundle-marker
  desc: Costura embedded assembly bundle marker
  crit: notable
  conf: 0.8
  for:
  - pe
  - dll
  if:
    type: text
    substr: costura.costura.dll.compressed
- id: dotnet-getmanifestresourcenames
  desc: ".NET embedded resource enumeration"
  crit: notable
  conf: 0.8
  attack: T1027.009
  for:
  - pe
  if:
    type: text
    substr: GetManifestResourceNames
  unless:
  - id: costura-bundle-marker
  - id: metadata/binary/framework/
- id: hex-named-resource-entries
  desc: Hex-named resource entries (chunked payload)
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  if:
    type: text
    regex: "(?s)RES_[0-9A-Fa-f]{6}.{0,64}RES_[0-9A-Fa-f]{6}"
- id: dotnet-source-resource-reader-call
  desc: ".NET ResourceReader source call"
  crit: notable
  conf: 0.9
  attack: T1027.009
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)ResourceReader$'
- id: dotnet-source-get-resource-data-call
  desc: ".NET GetResourceData source call"
  crit: notable
  conf: 0.9
  attack: T1027.009
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetResourceData$'
- id: dotnet-source-manifest-resource-stream-call
  desc: ".NET manifest resource stream source call"
  crit: notable
  conf: 0.9
  attack: T1027.009
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetManifestResourceStream$'
- id: dotnet-source-manifest-resource-names-call
  desc: ".NET manifest resource enumeration source call"
  crit: notable
  conf: 0.9
  attack: T1027.009
  for:
  - csharp
  if:
    type: symbol
    kind: call
    regex: '(^|\.)GetManifestResourceNames$'
composite_rules:
- id: dotnet-embedded-resource-read-any
  desc: .NET resource-reading API references
  crit: notable
  conf: 0.86
  for:
  - pe
  any:
  - id: dotnet-getmanifestresourcestream
  - id: dotnet-resourcemanager
  - id: dotnet-get-resource-data
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  - id: dotnet-getmanifestresourcenames
  - id: dotnet-resource-reader
- id: dotnet-stream-resource-access-path
  desc: ".NET manifest resource stream access path"
  crit: notable
  conf: 0.86
  attack: T1027.009
  for:
  - pe
  all:
  - id: dotnet-getmanifestresourcestream
  any:
  - id: dotnet-resourcemanager
  - id: dotnet-getmanifestresourcenames
  unless:
  - id: costura-bundle-marker
- id: dotnet-source-resource-data-extraction
  desc: ".NET source resource data extraction"
  crit: suspicious
  conf: 0.94
  attack: T1027.009
  for:
  - csharp
  all:
  - id: dotnet-source-resource-reader-call
  - id: dotnet-source-get-resource-data-call
  - id: dotnet-source-manifest-resource-stream-call
  any:
  - id: dotnet-source-manifest-resource-names-call
  - id: micro-behaviors/mem/copy::dotnet-buffer-block-copy
- id: dotnet-managed-resource-access
  desc: .NET embedded-resource API references
  crit: notable
  conf: 0.9
  for:
  - pe
  any:
  - id: dotnet-getmanifestresourcestream
  - id: dotnet-resource-reader
  - id: dotnet-get-resource-data
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  - id: dotnet-getmanifestresourcenames
  unless:
  - id: costura-bundle-marker
  - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
- id: dotnet-resource-reader-access
  desc: ResourceReader and resource-loading references co-occur
  crit: notable
  conf: 0.9
  for:
  - pe
  all:
  - id: dotnet-resource-reader
  - id: dotnet-resourcemanager
  any:
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  - id: dotnet-getmanifestresourcenames
  unless:
  - id: costura-bundle-marker
- id: dotnet-resource-data-access
  desc: ".NET ResourceReader GetResourceData access"
  crit: notable
  conf: 0.92
  attack: T1027.009
  for:
  - pe
  all:
  - id: dotnet-getmanifestresourcestream
  - id: dotnet-resource-reader
  - id: dotnet-get-resource-data
  unless:
  - id: costura-bundle-marker
