defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: unsigned-gui-embedded-pe
  desc: Unsigned GUI PE with embedded resource PE
  crit: notable
  conf: 0.97
  all:
    - id: micro-behaviors/ui/graphics/draw::begin-paint-symbol
    - id: micro-behaviors/ui/window/probe::get-active-window
    - id: metadata/binary/layout/embedded::pe-embedded
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
  unless:
    - id: metadata/binary/installer/
    - id: metadata/signed/platform/
    - id: well-known/tool/
    - id: well-known/app/
    - id: well-known/lib/

# Reactor and similar protectors ship a native mscoree host that decrypts
# managed payloads from high-entropy resources; pairing the ANSI resource
# API chain with CLR hosting and an anti-debug import separates crypter
# stubs from signed product builds that read their own resources.
