defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: managed-resource-write-hidden-launch-api-profile
  desc: Managed resource access with file-write and hidden-launch APIs
  crit: notable
  conf: 0.97
  near_bytes: 8192
  all:
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
  - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
  - id: metadata/binary/symbols/name/token/execution::process-start-member-token
  any:
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-reader-access

