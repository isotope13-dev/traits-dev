defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: managed-resource-write-hidden-launch-api-profile
  desc: Managed resource access with file-write and hidden-launch APIs
  crit: notable
  conf: 0.97
  near_bytes: 8192
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
  - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
  - id: metadata/binary/symbols/name/token::process-start-member-token
  any:
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access

