defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: unsigned-resource-winexec-api-profile
  desc: Unsigned resource-access and WinExec API sets
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/resource/size::rsrc-section-over-150kb
  - id: micro-behaviors/process/create/exec::winexec
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/process/create/exec::create-process-a
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
