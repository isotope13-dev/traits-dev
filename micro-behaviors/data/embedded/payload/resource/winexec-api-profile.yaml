defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-resource-winexec-api-profile
    desc: Unsigned resource-access and WinExec API sets
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: metadata/binary/resource/size::rsrc-section-over-150kb
      - id: micro-behaviors/process/create/native-symbol::winexec
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
    needs: 1
    unless:
      - id: metadata/installer/product/
