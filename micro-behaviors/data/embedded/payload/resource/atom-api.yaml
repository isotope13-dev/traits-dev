defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: unsigned-resource-pe-with-global-atom
  desc: Embedded resource PE with GlobalAddAtomA
  crit: notable
  conf: 0.98
  all:
    - id: micro-behaviors/communications/ipc/message::global-add-atom-a
    - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: metadata/binary/layout/embedded::pe-embedded
  unless:
    - id: metadata/binary/installer/
    - id: metadata/signed/platform/
    - id: well-known/tool/
    - id: well-known/app/
    - id: well-known/lib/
