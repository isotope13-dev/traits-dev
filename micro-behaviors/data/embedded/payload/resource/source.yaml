# Source-level PE resource extraction. The PE-only API rules cannot see a
# source loader before it is compiled, while these calls are useful evidence
# when reviewing C/C++ and FFI-based implementations in other languages.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  attack: T1027.009

traits:
  - id: find-resource-source
    desc: Native PE resource lookup in source
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^FindResource(Ex)?[AW]?$'

  - id: load-resource-source
    desc: Native PE resource loading in source
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: LoadResource

  - id: lock-resource-source
    desc: Native PE resource pointer access
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: LockResource

  - id: sizeof-resource-source
    desc: Native PE resource size query
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: SizeofResource

composite_rules:
  - id: source-pe-resource-extraction
    desc: Source extracts PE resource bytes
    crit: notable
    conf: 0.95
    all:
      - id: find-resource-source
      - id: load-resource-source
    any:
      - id: lock-resource-source
      - id: sizeof-resource-source
