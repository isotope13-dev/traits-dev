# Fody Costura stores each bundled assembly as a raw-DEFLATE manifest
# resource named costura.<assembly>.dll.compressed, and lists them all in the
# plaintext costura.metadata resource. The code is compressed, but the names
# are not, so they show which libraries ride inside the executable.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  attack: T1027.009
  size_max: 52428800

traits:
  # DInvokeResolver (Apollo), DInvoke, DInvoke.ManualMap and the other
  # split DInvoke packages.
  - id: costura-bundled-dinvoke
    desc: Costura bundles a DInvoke assembly
    conf: 0.95
    if:
      type: text
      regex: '\bcostura\.dinvoke[a-z0-9.]{0,24}\.dll\.compressed'

  - id: costura-bundled-ghostpack-credential-tool
    desc: Costura bundles a GhostPack credential tool
    conf: 0.96
    if:
      type: text
      regex: '\bcostura\.(rubeus|sharpdpapi|safetykatz)\.dll\.compressed'

  - id: costura-bundled-offensive-library
    desc: Costura bundles SharpSploit or SharpKatz
    conf: 0.96
    if:
      type: text
      regex: '\bcostura\.(sharpsploit|sharpkatz)\.dll\.compressed'

  # Generic module names used by Apollo and the forks that keep its layout.
  # Matched as the exact Costura resource, so DependencyInjection or
  # Kerberos.NET bundles do not qualify.
  - id: costura-bundled-kerberos-tickets-module
    desc: Costura bundles a KerberosTickets module
    conf: 0.9
    if:
      type: text
      substr: costura.kerberostickets.dll.compressed

  - id: costura-bundled-injection-module
    desc: Costura bundles an Injection module
    conf: 0.85
    if:
      type: text
      substr: costura.injection.dll.compressed
