defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: resource-extraction-library-api-set
  desc: Resource extraction and DLL API references co-occur
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  any:
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-module-enumeration
  - id: micro-behaviors/crypto/symmetric/xor/loop::x86-byte-xor-terminator-loop
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: micro-behaviors/process/terminate/kill::terminate-process
  needs: 2
