defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-resource-soap-reflection-profile
    desc: Managed resource with SOAP/reflection APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource/size::clr-resource-high-entropy
      - id: metadata/binary/resource/identity::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: "micro-behaviors/data/codec::dotnet-gzip-compression"
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/communications/http/client/managed::soap-http-client-protocol
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding
    unless:
      - id: metadata/signed/platform::microsoft
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
