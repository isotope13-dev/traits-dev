---
defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: zip-magic
  desc: Embedded ZIP archive
  crit: baseline
  conf: 0.4
  if:
    type: hex
    section: ".text"
    # The four-byte local-header signature alone is also a valid x86
    # immediate (`push 0x04034b50`). ZIP's version-needed field is a
    # little-endian small integer, so require its high byte to be zero.
    pattern: 50 4B 03 04 ?? 00
  unless:
  - id: well-known/game/mod/
  - id: metadata/lang/compiled/
  downgrade:
    any:
    - id: metadata/library/compression/
    - id: metadata/library/compression/
    - id: metadata/lang/compiled/
- id: zip-magic-multiple-pe
  desc: Multiple embedded ZIP local headers in PE
  crit: notable
  conf: 0.75
  attack: T1027.009
  for:
  - pe
  size_min: 200000
  count_min: 3
  if:
    type: hex
    pattern: 50 4B 03 04
    section: ".rsrc"
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/game/mod/
  downgrade:
    any:
    - id: metadata/library/compression/
    - id: metadata/library/compression/
    - id: metadata/lang/compiled/
- id: zip-locals-in-data-pe
  desc: Multiple ZIP locals in PE data
  crit: notable
  conf: 0.86
  attack: T1027.009
  for:
  - pe
  platforms:
  - windows
  size_min: 200000
  count_min: 2
  if:
    type: hex
    pattern: 50 4B 03 04
    section: ".data"
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/installer/family/
  - id: well-known/game/mod/
  downgrade:
    any:
    - id: metadata/library/compression/
    - id: metadata/library/compression/
    - id: metadata/lang/compiled/
- id: rar-magic
  desc: Embedded RAR4 archive header
  crit: notable
  conf: 0.6
  if:
    type: hex
    section: ".text"
    # RAR4's block type follows the seven-byte signature and two-byte CRC.
    # Requiring 0x73 avoids treating arbitrary encrypted bytes that contain
    # only the six-byte marker as an archive.
    pattern: 52 61 72 21 1A 07 00 ?? ?? 73
- id: 7z-magic
  desc: 7-Zip archive magic in executable code
  crit: notable
  conf: 0.6
  size_min: 262144
  if:
    type: hex
    section: ".text"
    pattern: 37 7A BC AF 27 1C
  unless:
  - type: text
    substr: costura.costura.dll.compressed
- id: late-embedded-7z-archive
  desc: 7-Zip header after 6 MiB
  crit: notable
  conf: 0.97
  for: [pe]
  platforms: [windows]
  size_min: 7340032
  if:
    type: hex
    pattern: 37 7A BC AF 27 1C
    offset_range: [6291456, null]
- id: multiple-late-embedded-7z-archives
  desc: Multiple 7-Zip headers occur after 6 MiB
  crit: notable
  conf: 0.98
  for: [pe]
  platforms: [windows]
  size_min: 8388608
  count_min: 2
  if:
    id: late-embedded-7z-archive
