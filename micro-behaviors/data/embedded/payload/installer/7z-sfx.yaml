# 7-Zip SFX configuration is an embedded installer-payload format marker.
# It is carried in the PE overlay rather than in a mapped PE section, so this
# neutral capability belongs with embedded installer payload observations.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: 7z-sfx-config-marker
    desc: 7z self-extracting archive configuration
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: ;!@Install@!UTF-8!
