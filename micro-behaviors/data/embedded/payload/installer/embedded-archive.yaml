# A recognized archive stream carried inside the binary's overlay (the
# trailing data appended past the last mapped section/segment). This is the
# general form of the 7z-SFX marker beside it -- an installer, updater or app
# host that ships its payload attached to the loader.
#
# It matters for the overlay-entropy rules. Compressed data measures ~8.0
# entropy by construction, so entropy alone can never separate "installer
# payload appended to the loader" from "encrypted blob"; the container magic
# is what does. classinx's eeoPlayerProxy.exe appends a 3.9 MB gzip stream
# (`1f 8b 08`) to a signed CEF host binary and was read as a concealed payload.
#
# The per-format magic atoms elsewhere in micro-behaviors/data/embedded/
# payload/{archive,compression}/ are scoped to `.text`/`.rsrc`/`.data` for
# in-code embedded-payload detection; these are the overlay-anchored form of
# the same magics, since a PE/ELF/Mach-O overlay is not a named section.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, dll, elf, macho]

traits:
  - id: overlay-zip-magic
    desc: ZIP local-file header in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: 50 4B 03 04 ?? 00
  - id: overlay-gzip-magic
    desc: Gzip header in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: '1F 8B 08 (0?|1?)'
  - id: overlay-7z-magic
    desc: 7-Zip archive header in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: 37 7A BC AF 27 1C
  - id: overlay-bzip2-magic
    desc: Bzip2 header in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: 42 5A 68
  - id: overlay-rar-magic
    desc: RAR archive header in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: 52 61 72 21 1A 07 00

composite_rules:
  - id: embedded-archive-stream
    desc: Binary embeds a recognized archive stream in its overlay
    crit: notable
    conf: 0.9
    any:
      - id: overlay-zip-magic
      - id: overlay-gzip-magic
      - id: overlay-7z-magic
      - id: overlay-bzip2-magic
      - id: overlay-rar-magic
