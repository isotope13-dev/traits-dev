# A recognized archive stream carried inside the binary image.
#
# cleave already identifies packaged data in the file: an appended gzip, zip,
# 7z or similar container sets `binary.embedded_archives`. This is the general
# form of the 7z-SFX marker beside it -- an installer, updater or app host that
# ships its payload attached to the loader.
#
# It matters for the overlay-entropy rules. Compressed data measures ~8.0
# entropy by construction, so entropy alone can never separate "installer
# payload appended to the loader" from "encrypted blob"; the container magic
# is what does. classinx's eeoPlayerProxy.exe appends a 3.9 MB gzip stream
# (`1f 8b 08`) to a signed CEF host binary and was read as a concealed payload.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, dll, elf, macho]

traits:
  - id: embedded-archive-stream
    desc: Binary embeds a recognized archive stream
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: binary.embedded_archives
      min: 1
