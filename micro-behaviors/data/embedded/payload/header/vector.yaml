# Split-stage cabinets prefix a payload chunk with a short English banner
# word so a companion stub can reassemble MZ-stripped PE fragments.
defaults:
  platforms: [windows]
  for: [data, pe, dll, text]
  crit: notable
  conf: 0.93

traits:
  - id: vector-stage-banner
    desc: Word banner over a DOS stub
    if:
      type: text
      regex: '(?s)^[A-Z][A-Za-z]{2,15}\r\n\x90\x00\x03\x00'
