defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.99
traits:
  - id: restore-dos-magic-x64
    desc: Writes DOS M byte after reading e_lfanew
    if:
      type: hex
      section: .text
      pattern: '41 8B 47 3C 41 C6 07 4D 48 3D ?? ?? ?? ??'
  - id: restore-pe-and-dos-signatures-x64
    desc: Restores erased PE and DOS signature bytes
    if:
      type: hex
      section: .text
      pattern: '(41 C6 44 07 01 45 41 C6 47 01 5A 41 C6 04 07 50 | 41 C6 04 07 50 66 41 C7 07 4D 5A)'

  - id: indexed-pe-signature-word-write-x64
    desc: Writes PE signature word at indexed address
    if:
      type: hex
      section: .text
      # MOV word [extended-base + index + 0], 0x4550. Register allocation
      # may change; neither a build constant nor a payload name is required.
      pattern: '66 41 C7 44 ?? 00 50 45'
