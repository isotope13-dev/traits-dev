# Raw PE DOS-stub text inside a file typed as a batch script: the script
# body carries an uncompressed Windows executable image.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.9
  attack: T1027.009

traits:
  - id: batch-embedded-pe-dos-stub
    desc: Batch file carries a PE DOS stub
    if:
      type: text
      regex: 'This program (cannot|must) be run (in DOS mode|under Win32)'
