---
defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: elf-magic-embedded
  desc: Embedded ELF64 little-endian binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: ".text"
    # A bare ELF magic is also emitted by ordinary format parsers. Require
    # the type/version fields of a complete header before calling it payload.
    pattern: 7F 45 4C 46 02 01 01 ?? [8] 02 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    -
- id: elf-magic-embedded-dyn
  desc: Embedded ELF64 shared-object binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: ".text"
    pattern: 7F 45 4C 46 02 01 01 ?? [8] 03 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    -
- id: elf32-le-magic-embedded
  desc: Embedded ELF32 little-endian binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: ".text"
    pattern: 7F 45 4C 46 01 01 01 ?? [8] 02 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    -
- id: elf32-le-magic-embedded-dyn
  desc: Embedded ELF32 shared-object binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: ".text"
    pattern: 7F 45 4C 46 01 01 01 ?? [8] 03 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    -
- id: pe-magic-embedded
  desc: Embedded PE/MZ binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  if:
    type: hex
    section: ".text"
    pattern: 4D 5A 90 00
    offset_range:
    - 4096
    -
  unless:
  - id: metadata/binary/resource/
  downgrade:
    any:
    - id: metadata/binary/framework::dotnet-metadata
    - id: metadata/signed/platform/
- id: pe-dos-stub-base64
  desc: Base64-encoded PE DOS stub
  crit: notable
  conf: 0.9
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  - dll
  if:
    type: text
    substr: VGhpcyBwcm9ncmFtIGNhbm5vdCBiZSBydW4gaW4gRE9TIG1vZGUu
  # Stable Base64 body of the standard PE DOS stub, found as data inside a
  # parsed PE/DLL rather than as the file's own header.
- id: pe-magic-embedded-multiple
  desc: Multiple embedded PE/MZ headers
  crit: suspicious
  conf: 0.9
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  size_min: 200000
  count_min: 3
  if:
    type: hex
    section: ".text"
    pattern: 4D 5A 90 00
    offset_range:
    - 4096
    -
  unless:
  - id: metadata/package/versioning::pe-version-resource
  downgrade:
    any:
    - id: metadata/binary/framework::dotnet-metadata
    - id: metadata/signed/platform/
- id: pe-header-compare-immediate-multiple
  desc: In-code MZ/PE compare immediate
  crit: component
  conf: 0.8
  for:
  - pe
  if:
    type: raw
    regex: MZ\x00\x00.{0,48}PE\x00\x00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: inline-mz-magic-check
  desc: Inline MZ header validation constant
  crit: component
  conf: 0.85
  for:
  - pe
  if:
    type: hex
    section: .text
    pattern: B8 4D 5A 00 00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: inline-pe-signature-check
  desc: Inline PE signature validation constant
  crit: component
  conf: 0.85
  for:
  - pe
  if:
    type: hex
    section: .text
    pattern: 81 ?? ?? 50 45 00 00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: inline-pe-header-walk
  desc: Inline PE header walk sequence
  crit: component
  conf: 0.8
  for:
  - pe
  if:
    type: hex
    section: .text
    pattern: 8B 4? 3C
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: x86-inline-mz-word-compare
  desc: x86 compares an in-memory MZ signature
  crit: component
  conf: 0.94
  mbc: B0005
  attack: T1620
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  if:
    type: hex
    section: .text
    # Widen a word from an image buffer and compare it with MZ as an
    # immediate. Register allocation and nearby branches are wildcarded.
    pattern: '0F B7 ?? [0-8] 81 F? 4D 5A 00 00'
- id: x86-inline-mz-eax-compare
  desc: x86 compares widened EAX with MZ
  crit: component
  conf: 0.94
  mbc: B0005
  attack: T1620
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  if:
    type: hex
    section: .text
    # Accumulator-special form: movzx eax, word [image]; cmp eax, MZ.
    pattern: '0F B7 ?? [0-8] 3D 4D 5A 00 00'
- id: x86-inline-e-lfanew-pe-walk
  desc: x86 e_lfanew to PE signature walk
  crit: notable
  conf: 0.97
  mbc: B0005
  attack: T1620
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  if:
    type: hex
    section: .text
    # Add the DOS e_lfanew field at +0x3c to an image base, then compare the
    # pointed dword with PE\0\0. This is the core of an inline PE header walk.
    # Polymorphic stubs may interleave arithmetic junk between the e_lfanew
    # addition and PE-signature comparison. Keep both semantic anchors while
    # allowing that bounded instruction churn.
    pattern: '03 ?? 3C [0-64] 81 3? 50 45 00 00'
- id: inline-pe-header-walk-x64
  desc: x64 inline PE e_lfanew header walk
  crit: component
  conf: 0.9
  mbc: B0005
  attack: T1620
  for:
  - pe
  - dll
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    # REX-prefixed load of e_lfanew from an image buffer.  The following
    # PE-signature compare is supplied by inline-pe-signature-check.
    pattern: 41 8B ?? 3C
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: pe-e-lfanew-read-x64
  desc: x64 reads the PE e_lfanew field
  crit: component
  conf: 0.9
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: 48 63 ?? 3C
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: x64-bounded-mz-pe-header-walk
  desc: x64 bounded MZ-to-PE header scan
  crit: notable
  conf: 0.98
  mbc: B0005
  attack: T1620
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    # Position-independent loaders search backwards for an image base, read
    # e_lfanew, reject implausible offsets, and validate the PE signature.
    pattern: '48 FF C8 66 81 38 4D 5A [0-32] 8B 50 3C 81 FA 00 04 00 00 [0-8] 48 01 C2 66 81 3A 50 45'
- id: x64-backward-mz-bounded-pe-walk
  desc: x64 backward MZ scan and PE validation
  crit: notable
  conf: 0.97
  mbc: B0005
  attack: T1620
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    # Position-independent loaders often use a short backward MZ search,
    # reject oversized header offsets, then validate the PE signature. The
    # bounded gaps cover register/branch scheduling without keying on payload
    # constants or one compiler's exact instruction order.
    pattern: '48 FF C8 66 81 38 4D 5A [0-64] 81 FA 00 04 00 00 [0-32] 66 81 3A 50 45'
- id: x64-inline-mz-byte-pair-check
  desc: x64 validates an in-memory MZ pair
  crit: component
  conf: 0.95
  mbc: B0005
  attack: T1620
  for: [pe, dll]
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: 80 39 4D 0F 85 ?? ?? ?? ?? 80 79 01 5A 0F 85
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: x64-inline-e-lfanew-pe-walk
  desc: x64 e_lfanew dereference in PE validation
  crit: component
  conf: 0.96
  mbc: B0005
  attack: T1620
  for: [pe, dll]
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: 48 63 49 3C 8B DA
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: x64-inline-pe-signature-compare
  desc: x64 code compares an in-memory PE signature
  crit: component
  conf: 0.96
  mbc: B0005
  attack: T1620
  for: [pe, dll]
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: 81 3C 39 50 45 00 00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: pe-mz-compare-x64
  desc: x64 code compares PE MZ magic
  crit: component
  conf: 0.94
  for: [pe]
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: 66 81 ?? 4D 5A
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: pe-magic-corrupt-multiple
  desc: Multiple malformed embedded PE stubs
  crit: suspicious
  conf: 0.9
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  size_min: 200000
  count_min: 2
  # Stubs a dropper carries sit together; `4D 5A 00 00` turning up a handful of
  # times across a very large image is byte noise. A Bun single-file executable
  # embeds an entire application graph in .text and hit this 16 times in 125MB
  # -- one per 8MB. Require the hits to be dense enough to be a payload set
  # rather than coincidence; a 200KB-2MB binary with two of them still fires.
  per_kb_min: 0.001
  # The magic alone is four bytes that x86 code emits constantly: `B8 4D 5A 00
  # 00` is `mov eax, 5A4Dh`, the immediate every routine that validates a PE
  # header loads. All three hits in Squirrel's `StubExecutable.exe` are that
  # instruction, checking the stub's own header before reading `e_lfanew`.
  # An actual embedded stub carries the DOS header that follows the magic, so
  # require it: e_cp/e_cparhdr stay wildcards, the zeroed and 0xFFFF fields do
  # not. `4D 5A 00 00` rather than `4D 5A 90 00` is the malformed part -- the
  # sibling `pe-magic-embedded-multiple` covers the well-formed spelling.
  if:
    type: hex
    section: ".text"
    pattern: 4D 5A 00 00 ?? 00 00 00 ?? 00 00 00 FF FF 00 00
    offset_range:
    - 4096
    -
  unless:
  - id: metadata/package/versioning::pe-version-resource
  - id: well-known/app/system/drivers/
  # Large statically-linked OpenSSL builds contain incidental MZ-like byte runs.
  - id: well-known/lib/crypto/openssl/
  # An image whose Authenticode signature still verifies is byte-for-byte what
  # the publisher signed, so a handful of `4D 5A 00 00` sequences in its code
  # section are constants rather than a carried payload set: Microsoft's signed
  # `wslcsdk.dll` in VSCodium's `@microsoft/mxc-sdk` has six across 3.3 MB.
  - id: metadata/signed/certificate/identity::pe-signature-verified-kv
- id: photoshop-metadata-embedded
  desc: Photoshop image metadata in binary
  crit: notable
  conf: 0.75
  for:
  - pe
  - elf
  count_min: 2
  if:
    type: text
    exact: 8BIM
composite_rules:
- id: pe-magic-corrupt-benign-context
  desc: Benign context for malformed embedded PE header bytes
  crit: component
  conf: 0.85
  any:
  - id: pe-header-compare-immediate-multiple
  - id: inline-pe-header-validation-sequence
  - id: known-pe-header-validation-fp
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/signed/platform::microsoft
  - id: metadata/library/automation::selenium-ie-driver-benign-binary
  - id: metadata/binary/vendor::benign-unsigned-microsoft-import-heavy-context
  - id: well-known/app/browser/internet-explorer::internet-explorer-frame-component
  - id: well-known/app/security/mcafee-epolicy::mcafee-epolicy-migration
  - id: well-known/tool/reverse-engineering/x64dbg::x64dbg-release-component
  - id: well-known/tool/reverse-engineering/scylla::scylla-unpacker
  - id: metadata/library/qt/
- id: known-pe-header-validation-fp
  desc: Known PE header validation false positive
  crit: component
  conf: 0.99
  any:
  - id: well-known/game/mod::wynncraft-overhaul-installer
  - id: well-known/dual-use/tunnel/swifttunnel_vpn::swifttunnel
  - id: well-known/app/system/cvte-crashrpt::cvte-crashrpt-strong-pin
- id: inline-pe-header-validation-sequence
  desc: Inline PE header validation sequence
  crit: component
  conf: 0.9
  for:
  - pe
  all:
  - id: inline-mz-magic-check
  - id: inline-pe-signature-check
  any:
  - id: inline-pe-header-walk
  - id: inline-pe-header-walk-x64
  - id: pe-header-compare-immediate-multiple
# x86 counterpart to the x64 reflective-loader header walk above.
- id: x86-inline-pe-header-validation-sequence
  desc: x86 in-memory MZ-to-PE validation
  crit: notable
  conf: 0.98
  mbc: B0005
  attack: T1620
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  all:
  - id: x86-inline-e-lfanew-pe-walk
  any:
  - id: x86-inline-mz-word-compare
  - id: x86-inline-mz-eax-compare
# Tight x64 MZ → e_lfanew → PE\0\0 walk used by reflective/manual loaders.
- id: x64-manual-pe-header-walk
  desc: x64 in-memory MZ and PE header walk
  crit: notable
  conf: 0.97
  mbc: B0005
  attack: T1620
  for: [pe, dll]
  arch: [x86-64]
  all:
  - id: x64-inline-mz-byte-pair-check
  - id: x64-inline-e-lfanew-pe-walk
  - id: x64-inline-pe-signature-compare
