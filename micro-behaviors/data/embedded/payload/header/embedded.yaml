defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: elf-magic-embedded
  desc: Embedded ELF64 little-endian binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: .text
    pattern: 7F 45 4C 46 02 01 01 ?? [8] 02 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    - null
- id: elf-magic-embedded-dyn
  desc: Embedded ELF64 shared-object binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: .text
    pattern: 7F 45 4C 46 02 01 01 ?? [8] 03 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    - null
- id: elf32-le-magic-embedded
  desc: Embedded ELF32 little-endian binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: .text
    pattern: 7F 45 4C 46 01 01 01 ?? [8] 02 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    - null
- id: elf32-le-magic-embedded-dyn
  desc: Embedded ELF32 shared-object binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  if:
    type: hex
    section: .text
    pattern: 7F 45 4C 46 01 01 01 ?? [8] 03 00 ?? ?? 01 00 00 00
    offset_range:
    - 4096
    - null
- id: pe-magic-embedded
  desc: Embedded PE/MZ binary
  crit: notable
  conf: 0.8
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  if:
    type: hex
    section: .text
    pattern: 4D 5A 90 00
    offset_range:
    - 4096
    - null
  unless:
  - id: metadata/binary/resource/
  downgrade:
    any:
    - id: metadata/binary/framework::dotnet-metadata
    - id: metadata/signed/platform/
- id: pe-dos-stub-base64
  desc: Base64-encoded PE DOS stub
  crit: notable
  conf: 0.9
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  - dll
  if:
    type: text
    substr: VGhpcyBwcm9ncmFtIGNhbm5vdCBiZSBydW4gaW4gRE9TIG1vZGUu
- id: x86-inline-mz-word-compare
  desc: x86 compares an in-memory MZ signature
  crit: notable
  conf: 0.94
  mbc: B0005
  attack: T1620
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: 0F B7 ?? [0-8] 81 F? 4D 5A 00 00
- id: x86-inline-mz-eax-compare
  desc: x86 compares widened EAX with MZ
  crit: notable
  conf: 0.94
  mbc: B0005
  attack: T1620
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: 0F B7 ?? [0-8] 3D 4D 5A 00 00
- id: x64-bounded-mz-pe-header-walk
  desc: x64 bounded MZ-to-PE header scan
  crit: notable
  conf: 0.98
  mbc: B0005
  attack: T1620
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86-64
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 48 FF C8 66 81 38 4D 5A [0-32] 8B 50 3C 81 FA 00 04 00 00 [0-8] 48 01 C2 66 81 3A 50 45
- id: x64-backward-mz-bounded-pe-walk
  desc: x64 backward MZ scan and PE validation
  crit: notable
  conf: 0.97
  mbc: B0005
  attack: T1620
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86-64
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 48 FF C8 66 81 38 4D 5A [0-64] 81 FA 00 04 00 00 [0-32] 66 81 3A 50 45
- id: x64-inline-mz-byte-pair-check
  desc: x64 validates an in-memory MZ pair
  crit: notable
  conf: 0.95
  mbc: B0005
  attack: T1620
  for:
  - pe
  - dll
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 80 39 4D 0F 85 ?? ?? ?? ?? 80 79 01 5A 0F 85
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: x64-inline-e-lfanew-pe-walk
  desc: x64 e_lfanew dereference in PE validation
  crit: notable
  conf: 0.96
  mbc: B0005
  attack: T1620
  for:
  - pe
  - dll
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 48 63 49 3C 8B DA
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: x64-inline-pe-signature-compare
  desc: x64 code compares an in-memory PE signature
  crit: notable
  conf: 0.96
  mbc: B0005
  attack: T1620
  for:
  - pe
  - dll
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 81 3C 39 50 45 00 00
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: pe-magic-corrupt-multiple
  desc: Multiple malformed embedded PE stubs
  crit: suspicious
  conf: 0.9
  mbc: F0001.006
  attack: T1027.009
  for:
  - pe
  size_min: 200000
  count_min: 2
  per_kb_min: 0.001
  if:
    type: hex
    section: .text
    pattern: 4D 5A 00 00 ?? 00 00 00 ?? 00 00 00 FF FF 00 00
    offset_range:
    - 4096
    - null
  unless:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: well-known/app/system/drivers/
  - id: well-known/lib/crypto/openssl/
  - id: metadata/signed/certificate/signature::pe-signature-verified-kv
- id: photoshop-metadata-embedded
  desc: Photoshop image metadata in binary
  crit: notable
  conf: 0.75
  for:
  - pe
  - elf
  count_min: 2
  if:
    type: text
    exact: 8BIM
composite_rules:
- id: pe-magic-corrupt-benign-context
  desc: Benign context for malformed embedded PE header bytes
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
  - id: inline-pe-header-validation-sequence
  - id: known-pe-header-validation-fp
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/signed/platform::microsoft
  - id: well-known/lib/platform/browser-automation/drivers/selenium::selenium-ie-driver-benign-binary
  - id: metadata/binary/vendor::benign-unsigned-microsoft-import-heavy-context
  - id: well-known/app/browser/internet-explorer::internet-explorer-frame-component
  - id: well-known/app/security/mcafee-epolicy::mcafee-epolicy-migration
  - id: well-known/tool/reverse-engineering/x64dbg::x64dbg-release-component
  - id: well-known/tool/reverse-engineering/scylla::scylla-unpacker
  - id: well-known/lib/ui
- id: known-pe-header-validation-fp
  desc: Known PE header validation false positive
  crit: component
  conf: 0.99
  any:
  - id: well-known/game/mod::wynncraft-overhaul-installer
  - id: well-known/dual-use/tunnel/swifttunnel_vpn::swifttunnel
  - id: well-known/app/system/cvte-crashrpt::cvte-crashrpt-strong-pin
- id: inline-pe-header-validation-sequence
  desc: Inline PE header validation sequence
  crit: component
  conf: 0.9
  for:
  - pe
  all:
  - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
  - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
  any:
  - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
  - id: micro-behaviors/data/format/pe-parser::x64-mov-e-lfanew-read
  - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
- id: x86-inline-pe-header-validation-sequence
  desc: x86 in-memory MZ-to-PE validation
  crit: notable
  conf: 0.98
  mbc: B0005
  attack: T1620
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86
  all:
  - id: micro-behaviors/data/parse/portable-executable::x86-e-lfanew-pe-walk
  any:
  - id: x86-inline-mz-word-compare
  - id: x86-inline-mz-eax-compare
- id: x64-manual-pe-header-walk
  desc: x64 in-memory MZ and PE header walk
  crit: notable
  conf: 0.97
  mbc: B0005
  attack: T1620
  for:
  - pe
  - dll
  arch:
  - x86-64
  all:
  - id: x64-inline-mz-byte-pair-check
  - id: x64-inline-e-lfanew-pe-walk
  - id: x64-inline-pe-signature-compare
