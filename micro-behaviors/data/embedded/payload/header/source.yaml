# Source-level PE header validation used by manual/in-memory loaders.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python]
  attack: T1620

traits:
  # The magic must be a quoted constant ("MZ", "PE\0\0"), not a bare word in the
  # 160-byte trailing window. Allowing an unquoted ` PE` under a case-insensitive
  # flag made any English word starting "pe" near a memcmp/strncmp — "a lone \r
  # is a char, not a newline, per current spec" — read as a PE header check.
  - id: source-mz-buffer-compare
    desc: Source compares an MZ buffer header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)\b(memcmp|strncmp)\s*\([\s\S]{0,160}["'']MZ(\\|["''])'

  - id: source-pe-buffer-compare
    desc: Source compares a PE buffer header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)\b(memcmp|strncmp)\s*\([\s\S]{0,160}["'']PE(\\|["''])'

composite_rules:
  - id: source-pe-header-validation
    desc: Source validates MZ and PE headers
    crit: notable
    conf: 0.95
    all:
      - id: source-mz-buffer-compare
      - id: source-pe-buffer-compare
    near_lines: 20
