defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.99

traits:
  - id: restore-dos-magic-byte-stores-x86
    desc: Writes MZ bytes to one buffer argument
    if:
      type: hex
      section: .text
      # mov eax,[ebp+12]; mov byte [eax],'M'; mov ecx,[ebp+12];
      # mov byte [ecx+1],'Z'. Both stores address the same buffer.
      pattern: '8B 45 0C C6 00 4D 8B 4D 0C C6 41 01 5A'
