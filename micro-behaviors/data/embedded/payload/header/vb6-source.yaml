# VB6/VBA source that declares the Windows PE image structures by hand.
# A script that types out IMAGE_DOS_HEADER/IMAGE_NT_HEADERS and reads
# e_lfanew is parsing or writing PE images itself, not loading one.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
traits:
  - id: vb-image-header-type-decl
    desc: VB declares PE image header structure
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bType\s+IMAGE_(DOS|NT|FILE|SECTION)_HEADER\b'
  - id: vb-e-lfanew-field-decl
    desc: VB declares PE e_lfanew header field
    conf: 0.92
    if:
      type: text
      regex: '(?i)\be_lfanew\s+As\s+Long\b'
