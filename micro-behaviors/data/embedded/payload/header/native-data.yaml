defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dos-executable-header-in-data
    desc: DOS executable header in writable data
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .data
      pattern: '4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00 B8 00 00 00'
