defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  conf: 0.9

traits:
  # A second complete ShellLinkHeader (HeaderSize 0x4C plus the LNK CLSID)
  # after offset 0 means another shortcut was appended to this one. Shell
  # APIs read only the first, so the tail is dead weight a generator or an
  # infector left behind.
  - id: lnk-appended-second-header
    desc: Shortcut file carries a second LNK header
    if:
      type: hex
      offset_range: [76, null]
      pattern: 4C 00 00 00 01 14 02 00 00 00 00 00 C0 00 00 00 00 00 00 46
