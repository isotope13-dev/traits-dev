defaults:
  for: [javascript, html, text]
  platforms: [windows]
traits:
  - id: packer-x86-peb-word-table
    desc: Packer dictionary contains x86 PEB loader words
    crit: notable
    if:
      type: text
      substr: 'u9000|u408b|u8b0c|u738b|u0840|u8bad|u1c70'
  - id: packed-x86-fs-peb-walk-words
    desc: Packed dictionary contains x86 FS PEB opcodes
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'u306a|u5e00|u6459|u198b'
