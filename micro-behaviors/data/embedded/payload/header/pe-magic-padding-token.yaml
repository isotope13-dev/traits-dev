defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: pe-magic-padding-token-cooccurrence
    desc: Embedded PE marker and padding token
    crit: notable
    conf: 0.84
    for:
      - pe
    all:
      - id: metadata/binary/layout/padding::paddingxxpadding-filler
      - id: micro-behaviors/data/embedded/payload/header::pe-magic-embedded
    downgrade:
      any:
        - id: well-known/app/system/crayens/
        - id: metadata/lang/compiler/managed::dotnet-metadata
