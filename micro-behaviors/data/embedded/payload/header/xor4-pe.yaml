defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: xor4-encoded-pe-in-data
    desc: XOR4 PE header in writable data
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule xor4_embedded_pe {
          strings:
            $data_section = ".data"
          condition:
            $data_section and pe.is_pe and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".data" and
              for any i in (pe.sections[s].raw_data_offset..pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size-256) : (
                uint32(i) != 0x00905a4d and
                with k = uint32(i) ^ 0x00905a4d : (
                  (uint32(i+4) ^ k) == 3 and
                  (uint32(i+8) ^ k) == 4 and
                  (uint32(i+12) ^ k) == 0x0000ffff and
                  (uint32(i+60) ^ k) >= 64 and
                  (uint32(i+60) ^ k) <= 1024 and
                  (uint32(i+60) ^ k) % 4 == 0 and
                  (uint32(i+(uint32(i+60)^k)) ^ k) == 0x00004550
                )
              )
            )
        }
