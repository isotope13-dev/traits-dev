defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
traits:
  - id: powershell-gzip-first-byte-write
    desc: Writes gzip first header byte
    if:
      type: text
      regex: '(?i)\$[\w]{1,64}\s*\[\s*0\s*\]\s*=\s*(0x1f|31)\b'
  - id: powershell-gzip-second-byte-write
    desc: Writes gzip second header byte
    if:
      type: text
      regex: '(?i)\$[\w]{1,64}\s*\[\s*1\s*\]\s*=\s*(0x8b|139)\b'
composite_rules:
  - id: powershell-gzip-header-repair
    desc: Nearby writes restore gzip magic bytes
    near_lines: 3
    all:
      - id: powershell-gzip-first-byte-write
      - id: powershell-gzip-second-byte-write
