defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-backward-image-search
    desc: Scans backward for a PE image
    crit: notable
    attack: T1620
    if:
      type: hex
      section: .text
      # MZ check, bounded e_lfanew, PE check, decrement address and retry.
      pattern: '0F B7 08 81 F9 4D 5A 00 00 75 ?? 8B 48 3C 8D 51 C0 81 FA BF 03 00 00 77 ?? 81 3C 08 50 45 00 00 74 ?? 48 EB ??'
