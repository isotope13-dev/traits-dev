# A single common word is not enough to identify Turkish in raw binary scans:
# compressed data produced the isolated token `Gibi` in a benign installer.
# Keep the language signal as two distinct function-word atoms, outside the
# broad metadata profile directory, so the atoms remain individually useful
# without making that directory an oversized catch-all.
defaults:
  platforms: [windows, unix]
  for: [scripts, documents]

traits:
  - id: lang-turkish--atom-1
    desc: Turkish function-word token
    crit: component
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '(?i)\biçin\b'
  - id: lang-turkish--atom-2
    desc: Turkish function-word token
    crit: component
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '(?i)\bolarak\b'
  - id: lang-turkish--atom-3
    desc: Turkish function-word token
    crit: component
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '(?i)\bgibi\b'

composite_rules:
  - id: lang-turkish
    desc: Turkish language detection
    crit: notable
    conf: 0.8
    size_max: 1000000
    needs: 2
    any:
      - id: lang-turkish--atom-1
      - id: lang-turkish--atom-2
      - id: lang-turkish--atom-3
