defaults:
  platforms:
    - unix
    - windows
  for:
    - java
    - class
traits:
  - id: java-stringbuilder
    desc: Java StringBuilder class reference
    crit: baseline
    conf: 0.96
    if:
      type: text
      substr: java/lang/StringBuilder

  - id: javassist
    desc: Javassist library reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: javassist
  # cglib (and its mockito-all repackaging under org/mockito/cglib) is a
  # bytecode-generation framework: defining generated classes from resource
  # streams is its documented purpose, not concealment. The reflection
  # composites that pair defineClass with resource loading suppress
  # themselves on it, exactly as they already do for javassist.
  - id: cglib
    desc: cglib library reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: cglib
  - id: byte-buddy
    desc: Byte Buddy library reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: bytebuddy
      case_insensitive: true
