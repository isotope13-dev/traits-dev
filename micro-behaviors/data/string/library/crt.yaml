# String Operations
# C runtime string manipulation
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  # === String Length ===
  - id: strlen
    desc: String length
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "strlen"
  - id: wcslen
    desc: Wide string length
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "wcslen"
  # === String Comparison ===
  - id: strcmp
    desc: String comparison
    crit: baseline
    conf: 0.90
    for: [c, cpp, elf, macho, pe, dll]
    platforms: [unix, windows]
    if:
      type: symbol
      exact: "strcmp"
  - id: strncmp
    desc: Limited string comparison
    crit: baseline
    conf: 0.90
    for: [c, cpp, elf, macho, pe, dll]
    platforms: [unix, windows]
    if:
      type: symbol
      exact: "strncmp"
  - id: wcscmp
    desc: Wide string comparison
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "wcscmp"
  # === String Copy ===
  - id: strcpy
    desc: String copy (unsafe)
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "strcpy"
  - id: strncpy
    desc: Limited string copy
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "strncpy"
  - id: wcscpy
    desc: Wide string copy
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "wcscpy"
  # === String Case Conversion ===
  - id: tolower
    desc: Convert character to lowercase
    crit: baseline
    conf: 0.90
    for: [c, cpp, pe, dll]
    if:
      type: symbol
      kind: call
      exact: "tolower"
  - id: ascii-case-fold-lookup-table
    desc: ASCII case-fold lookup table
    crit: baseline
    conf: 0.75
    for: [pe]
    if:
      type: text
      exact: '!"#$%&''()*+,-./0123456789:;<=>?@abcdefghijklmnopqrstuvwxyz[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
    unless:
      - id: well-known/lib/format/jline::jline-native-dll-basename
      - id: well-known/lib/format/jline::jline-native-jni-exports
  # === String Search ===
  - id: strchr
    desc: Find character in string
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "strchr"

  - id: strstr
    desc: Find substring
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "strstr"
  - id: strstr-source-call
    desc: Find substring in C or C++ source
    crit: baseline
    conf: 0.90
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: "strstr"

composite_rules:
  - id: c-string-comparison
    desc: Uses C runtime string comparison
    crit: baseline
    conf: 0.9
    for: [c, cpp, elf, macho, pe, dll]
    platforms: [unix, windows]
    any:
      - id: strcmp
      - id: strncmp
