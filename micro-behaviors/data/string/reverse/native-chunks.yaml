defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: native-subtract-and-four-byte-string-chunks
    desc: String byte subtraction and four-byte chunks
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_subtract_and_four_byte_string_chunks {
          strings:
            $subtract = { 8A 04 06 8D 4D ?? 2A 45 ?? 50 56 E8 ?? ?? ?? ?? }
            $chunks = { 6A 04 59 46 8B 40 F8 83 C7 04 99 F7 F9 }
          condition:
            $subtract and $chunks
        }
