defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.93

traits:
  # `//:ptth` is not a word; a script holding the scheme backwards hides the
  # URL from string scanners and reverses it at runtime before use.
  - id: powershell-reversed-http-url-literal
    desc: PowerShell holds a reversed HTTP URL
    attack: T1027
    if:
      type: text
      exclude_comments: true
      regex: "['\"][^'\"\\s]{1,200}//:s?ptth['\"]"
