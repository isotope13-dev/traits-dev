# StrReverse over a literal that, read forwards, is a path ending in a
# Windows script or executable extension ("ath.xxx\atadmargorp\:c ..." is
# "c:\programdata\xxx.hta"): the file name the macro launches is kept
# backwards so it never appears in the module text.
traits:
  - id: strreverse-literal-script-path
    desc: StrReverse literal is a reversed script path
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [vbs, ooxml, oledoc]
    if:
      type: text
      regex: '(?i)StrReverse\("(ath|sbv|ebv|sj|esj|fsw|exe|lld)\.[^"]{1,40}\\[^"]{1,160}:'
