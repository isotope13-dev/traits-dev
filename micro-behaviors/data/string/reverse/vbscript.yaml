# Visual Basic string reversal is a neutral data operation. Obfuscation intent
# comes from objective composites that require attack-specific reversed values.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.88
  mbc: C0019

traits:
  - id: strreverse-call
    desc: Visual Basic string reversal reference
    conf: 0.85
    if:
      type: literal
      regex: '(?i)\bStrReverse\b'

  - id: strreverse-invocation
    desc: VBScript invokes StrReverse
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bStrReverse\s*\('
