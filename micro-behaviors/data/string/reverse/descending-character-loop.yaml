defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: descending-character-loop
    desc: Reads characters with descending indices
    # Two spellings of the same loop: the charAt call form and the
    # bracket-index read form (`s[i]`), which decoders use to dodge charAt.
    if:
      type: text
      regex: 'for\s*\([^;]{1,64}length\s*-\s*1;[^)]{1,64}--[^}]{0,128}(\.charAt\(|\w\[[^\]]{1,32}\])'
