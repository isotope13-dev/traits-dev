# Reversing generated digits before text decoding is normal in radix encoders.
# This observes the operation; it does not establish hidden executable content.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-join-reversed-then-text-decode
    desc: Joins reversed elements then decodes to text
    if:
      type: tree-sitter
      kind: call
      regex: '\.join\s*\(\s*reversed\s*\([^)\n]{1,80}\)\s*\)\s*\.decode\s*\('
