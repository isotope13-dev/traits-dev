# String reversal also supports ordinary suffix matching and text processing.
# A call alone does not establish obfuscation or execution of the result.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-strrev-call
    desc: Calls PHP string reversal function
    if:
      type: symbol
      kind: call
      regex: '^\\?strrev$'
