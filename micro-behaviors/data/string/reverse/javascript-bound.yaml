defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: bracket-split-reverse-join-bindings
    desc: Reverses string through three bound variables
    if:
      type: tree-sitter
      query: |
        ((variable_declaration
          (variable_declarator name: (identifier) @chars
            value: (call_expression function: (subscript_expression
              index: (string (string_fragment) @split))
              arguments: (arguments . (string) @empty .)))
          . (variable_declarator name: (identifier) @reversed
            value: (call_expression function: (subscript_expression
              object: (identifier) @chars-use
              index: (string (string_fragment) @reverse))
              arguments: (arguments) @noargs))
          . (variable_declarator value: (call_expression
            function: (subscript_expression object: (identifier) @reversed-use
              index: (string (string_fragment) @join))
            arguments: (arguments . (string) @empty-join .)))) @evidence
          (#eq? @split "split") (#eq? @reverse "reverse") (#eq? @join "join")
          (#match? @empty "^['\"][\"']$")
          (#match? @empty-join "^['\"][\"']$")
          (#eq? @chars @chars-use) (#eq? @reversed @reversed-use))
