# A string literal indexed backwards (`'txetDer'[-1..-24] -join ''`) hides
# cmdlet and API names from static review: only the reversed spelling exists
# in the file, and the readable form is rebuilt at run time. Seen in LNK
# one-liners and obfuscated batch launchers that unpack decoder names.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1027
  mbc: B0032

traits:
  - id: literal-reverse-index-join
    desc: Descending literal index reverses a string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\[-1\.\.-[0-9]{1,3}\]\s+-jo'
