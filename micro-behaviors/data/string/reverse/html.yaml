defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-split-reverse-join-string
    desc: HTML script reverses a string
    if:
      type: text
      exclude_html_comments: true
      regex: '\.split\(["'']["'']\)\.reverse\(\)\.join\(["'']["'']\)'
  # A reversed `script` tag is the concealed payload of reversed-string markup
  # injection: `document.write('>tpircs/<>...'.split("").reverse().join(""))`
  # rebuilds `<script src="https://...">` at runtime so static scanners never
  # see the element. `tpircs` is not a word in any language, so the token
  # itself is the finding.
  - id: reversed-script-tag-text
    desc: Reversed script tag text
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\btpircs\b'
