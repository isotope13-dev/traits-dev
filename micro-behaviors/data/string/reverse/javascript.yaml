# JavaScript string reversal by split/reverse/join.
# This is a neutral data operation: token protocols and UI code use it as well
# as obfuscators. Intent comes from an objective composite that adds execution
# or another attack-specific behavior.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  mbc: C0019

traits:
  - id: split-reverse-join-string
    desc: Reverses string with split reverse join
    if:
      # Match an executable call expression, not examples in comments.
      type: tree-sitter
      kind: call
      regex: '\.split\s*\([^)]{0,80}\)\s*\.reverse\s*\(\s*\)\s*\.join\s*\('
  # A complete string token that ends in a backwards scheme (`...moc.x//:ptth`).
  # `//:ptth` is not a word; the literal is a URL held reversed so string
  # scanners never see the host. Delimiters include `|` so the token is also
  # found inside a Packer keyword dictionary.
  - id: reversed-http-url-literal-text
    desc: String literal holds a reversed HTTP URL
    for: [javascript, typescript, html]
    if:
      type: text
      exclude_html_comments: true
      regex: '[''"|][^''"|\s<>]{4,400}//:s?ptth[''"|]'
