defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-prefix-reverse-index-join
  desc: LNK arg reverses string by index
  crit: notable
  conf: 0.95
  if:
    type: value
    path: lnk.arguments
    regex: -join\s+\$\w+\[(-1\.\.-\$\w+\.Length|\$\w+\.Length\.\.0)\]
    case_insensitive: true
- id: lnk-postfix-reverse-index-join
  desc: LNK reverses a string with postfix join
  crit: notable
  conf: 0.98
  if:
    type: value
    path: lnk.arguments
    regex: \[\$\w+\.Length\.\.0\]\s*-join\s*\(?["\x27]["\x27]
    case_insensitive: true
composite_rules:
- id: lnk-reverse-index-join
  desc: LNK reverse-index string join
  crit: notable
  conf: 0.95
  any:
  - id: lnk-prefix-reverse-index-join
  - id: lnk-postfix-reverse-index-join
