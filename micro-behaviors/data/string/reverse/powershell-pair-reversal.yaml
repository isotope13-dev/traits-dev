defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.93

traits:
  # Two halves of one loop shape: a descending two-step counter starting
  # at Length-2, and a builder appending two-character slices. Either
  # half alone is ordinary string handling, so both stay components and
  # the composite below carries the standalone observation.
  - id: powershell-descending-pair-loop
    desc: Descending two-step PowerShell loop header
    crit: component
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?i)for\s*\(\$\w+\s*=\s*\$\w+\.Length-2;\$\w+\s-ge\s+0;\$\w+\s*-=2\)'
  - id: powershell-append-pair-substring
    desc: Appends a two-character PowerShell slice
    crit: component
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.Append\(\$\w+\.Substring\(\$\w+,2\)\)'

composite_rules:
  # Walks a string backwards two characters at a time and appends each
  # slice to a builder: the hex-pair reversal a loader uses so the
  # carrier reads neither as plain hex nor as the decoded byte order.
  # Variable, carrier and builder names are all attacker-chosen, so the
  # legs key on the loop shape, not on any identifier.
  - id: powershell-reversed-pair-assembly
    desc: PowerShell rebuilds string from reversed pairs
    crit: notable
    conf: 0.93
    near_bytes: 160
    all:
      - id: powershell-descending-pair-loop
      - id: powershell-append-pair-substring
