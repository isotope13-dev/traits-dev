defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: one-c-source-line-staging
    desc: Copies source lines into staging text
    if:
      type: text
      case_insensitive: true
      regex: 'CurStr = SourceText\.GetLine\(x\);\s*TargetText\.AddLine\(CurStr\);'

  - id: one-c-conditional-source-append
    desc: Conditionally appends staged source to report
    if:
      type: text
      case_insensitive: true
      regex: 'if Action = "Yes" then[\s\S]{0,160}TargetText\.AddLine\(SourceText\.GetLine'

