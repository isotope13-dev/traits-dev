defaults:
  crit: baseline
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: strcpy
    desc: String copy (unsafe)
    conf: 0.90
    if:
      type: symbol
      exact: "strcpy"
  - id: strncpy
    desc: Limited string copy
    conf: 0.90
    if:
      type: symbol
      exact: "strncpy"
  - id: wcscpy
    desc: Wide string copy
    conf: 0.90
    if:
      type: symbol
      exact: "wcscpy"
