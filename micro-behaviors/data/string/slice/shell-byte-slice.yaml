defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9

# Repeated `cut -b` with computed offsets rebuilds characters from a stream.
# The repo's own shell scripts never use arithmetic byte offsets.
# Each arithmetic form is an atomic count; the composite accepts either one.
traits:
  - id: shell-bracket-arithmetic-byte-slice
    desc: Cut takes $[ arithmetic byte offsets
    count_min: 40
    if:
      type: text
      regex: '-[bB] {1,3}\$\['
  - id: shell-paren-arithmetic-byte-slice
    desc: Cut takes $(( arithmetic byte offsets
    count_min: 40
    if:
      type: text
      regex: '-[bB] {1,3}\$\(\('

composite_rules:
  - id: shell-arithmetic-byte-slice
    desc: Shell cut takes computed byte offsets repeatedly
    any:
      - id: shell-bracket-arithmetic-byte-slice
      - id: shell-paren-arithmetic-byte-slice
