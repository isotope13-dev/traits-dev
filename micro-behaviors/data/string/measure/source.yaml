# Source-level multiplicative string hashing. The 0x2001 multiplier is used
# by some API-name resolvers, but the arithmetic alone is a neutral hash step.
defaults:
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: djb2-hash-call-source
    desc: Calls a DJB2 string-hash helper
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust]
    if:
      type: symbol
      kind: call
      regex: '(?i)^djb2_?hash$'

  - id: multiplicative-0x2001-hash-step
    desc: Multiplicative 0x2001 string hash step
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: assignment
      regex: '\b[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*\*\s*0x2001u?\s*\+'
