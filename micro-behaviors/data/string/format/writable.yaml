defaults:
  platforms: [windows, unix]
  for: [pe, elf]

traits:
- id: multi-format-writable
  desc: Writable data has %n and format specifiers
  crit: notable
  conf: 0.7
  count_min: 1
  if:
    type: text
    section: .data
    regex: '%[0-9*]*n.{0,20}%[0-9*]*[sdxpnuifgec].{0,20}%[0-9*]*[sdxpnuifgec]'
  not:
  - regex: '^%n%o%p%q%r%s$'
- id: format-n-writable
  desc: Repeated %n markers in writable data
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    section: .data
    regex: '%[0-9$]*n'
- id: format-width-writable
  desc: Repeated large format widths in writable data
  crit: notable
  conf: 0.75
  count_min: 2
  if:
    type: text
    section: .data
    regex: '%[0-9]{5,}[sdxpn]'
