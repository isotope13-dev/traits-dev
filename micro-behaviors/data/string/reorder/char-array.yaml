defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: char-array-swap-and-join
    desc: Character indexing, swaps and joins co-occur
    crit: notable
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/string/assembly::js-charat-indexed-assignment
      - id: metadata/lang/javascript-features::js-temp-indexed-swap-prefix
    any:
      - id: micro-behaviors/data/string/concat::join-short-string-argument
      - id: micro-behaviors/data/string/replace::split-join-variable-separator
