defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: batch-caret-replace-clues
    desc: Caret replacement and batch text
    crit: notable
    conf: 0.8
    for: [scripts, -javascript, -typescript, binaries]
    if:
      type: text
      regex: replace.{0,50}"\^".{0,160}(bat|cmd|echo|%COMSPEC%)
    unless:
      - type: text
        regex: 'str_replace\s*\(\s*\[\s*["'']\^["'']'
