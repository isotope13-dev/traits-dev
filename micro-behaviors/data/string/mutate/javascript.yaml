defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-split-join-string-transform
    desc: Split-join JavaScript string transform
    crit: notable
    conf: 0.8
    size_max: 10000
    if:
      # The outer join call contains the nested split expression; matching a
      # call node prevents examples in comments from becoming behavior.
      type: tree-sitter
      kind: call
      regex: \.split\(\s*['"]['"]\s*\)[^;\n]{0,50}\.join\(\s*['"]['"]\s*\)
