defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: unique-mutation-slot-marker
    desc: Unique mutation-slot marker in UPX data
    crit: notable
    conf: 0.98
    if:
      # The bracket-anchored marker never reaches the extracted-strings
      # layer (runs must start alphanumeric), so scan the section bytes.
      type: raw
      substr: "[[UNIQUE]]"
      section: UPX1
  - id: unique-mutation-slot-marker-rsrc
    desc: Mutation-slot marker in PE resources
    crit: notable
    conf: 0.98
    if:
      type: raw
      substr: "[[UNIQUE]]"
      section: .rsrc
