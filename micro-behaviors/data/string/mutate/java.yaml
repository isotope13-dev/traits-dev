defaults:
  platforms: [unix, windows]
  for: [java, class]
  crit: baseline
  conf: 0.82

traits:
  - id: java-append-calls
    desc: Repeated Java append method calls
    count_min: 4
    if:
      type: symbol
      kind: call
      exact: append

  - id: java-string-join-call
    desc: Java joins string fragments
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: import
      exact: java/lang/String.join

  - id: java-junk-padded-string-cleanup
    desc: Java removes junk padding from string fragments
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '^\[[^]]{1,24}\]\+$'

  # A class name split across padded string fragments can evade ordinary
  # import extraction.  Keep this as an atom; the malicious meaning comes
  # from pairing it with a bundled HTTP client and credential access.
  - id: java-obfuscated-httpclient-class-fragment
    desc: Junk-padded Apache HTTP class fragment
    crit: notable
    conf: 0.91
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(org.{0,24}apach|tpCl)'
