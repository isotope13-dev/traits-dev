# A literal delimiter and bracket access do not establish obfuscation. Preserve
# the original population for the JScript reconstruction consumer, which adds
# the conditional-comment, token-map, and accumulator evidence.
defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: js-large-bracket-hyphen-split
    desc: Large source contains bracket hyphen split
    crit: notable
    conf: 0.95
    size_min: 50000
    if:
      type: text
      substr: '["split"](''-'')'
