defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  crit: notable
traits:
  - id: perl-inline-split-expression
    desc: Perl inline program contains a split expression
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: perl
      arg:
        kind: string
        regex: '\bsplit\s*\('
