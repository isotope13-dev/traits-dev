defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]

traits:
  # Document metadata is often split for ordinary display purposes, so this
  # remains a neutral capability. Auto-open and dynamic COM use establish the
  # obfuscated-loader interpretation in the consuming objective composite.
  - id: vba-document-property-split
    desc: VBA splits a document property value
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bBuiltInDocumentProperties\s*\([^)]{1,100}\)[\s\S]{0,180}\bSplit\s*\('

  - id: vbs-for-each-split-loop
    desc: VBScript loops over split string elements
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\bFor\s+Each\s+[A-Za-z_]\w*\s+In\s+Split\s*\('

  # Splitting on a variable rather than a literal delimiter means the table
  # boundary is computed at runtime -- the loader shape where a Mid-sliced
  # key separates numeric cells. A literal delimiter is ordinary parsing, and
  # so is a `vb*` language constant (vbLf, vbTab, ...): the runtime defines
  # its value, no boundary is computed. The engine has no lookaround, so the
  # built-in namespace is filtered per-match instead of via `(?!vb\w)`.
  - id: vbs-split-variable-delimiter
    desc: VBScript splits on a variable delimiter
    crit: notable
    conf: 0.88
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bSplit\s*\(\s*[A-Za-z_]\w*\s*,\s*[A-Za-z_]\w*'
    not:
      - regex: '(?i),\s*vb[A-Za-z0-9_]'

