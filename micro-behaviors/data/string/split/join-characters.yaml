# Concatenate array entries, then split the string into individual characters.
# Ordinary formatting uses this too; Nemucod attribution needs loader context.
defaults:
  platforms: [windows]
  for: [javascript]
  size_min: 20000
  size_max: 120000

traits:
  - id: js-join-split-character-assignment
    desc: Assigns joined text split into characters
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: \w+\s*=\s*\w+\.join\(''\)\.split\(''\)
