# Token tables also hold ordinary hardware names and other labels.
# The Packer objective supplies the eval decoder requirement separately.
defaults:
  platforms: [windows, unix]

traits:
  - id: pipe-token-list-split
    desc: Splits pipe-delimited literal token list
    crit: notable
    conf: 0.9
    for: [javascript, shell, html, text]
    if:
      type: text
      regex: '[''"][\w$|]*\|[\w$|]*[''"]\.split\(\s*[''"]\|[''"]\s*\)'
