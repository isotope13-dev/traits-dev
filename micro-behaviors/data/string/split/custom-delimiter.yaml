defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
traits:
- id: js-split-custom-delimiter
  desc: String split with unusual delimiter
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '\.split\(\s*["''][^a-zA-Z0-9\s=,.:;/_|#*~`\\?&()<>{}\[\]+-]["'']\s*\)'
  not:
  - substr: .split('+')
  - substr: .split("+")
  - substr: .split('@')
  - substr: .split("@")
  - substr: .split('(')
  - substr: .split("(")
  - substr: .split(')')
  - substr: .split(")")
  - substr: .split('<')
  - substr: .split("<")
  - substr: .split('>')
  - substr: .split(">")
  - substr: .split(']')
  - substr: .split(']')
  - substr: .split('[')
  - substr: .split("[")
  - substr: .split("·")
  - substr: .split('·')
  - substr: "query.includes('@')"
  - regex: (^|[\\/]).+\.map$
