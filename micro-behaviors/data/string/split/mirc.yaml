defaults:
  platforms: [windows, unix]
  for: [mirc, ircii]
traits:
  - id: mirc-first-space-token
    desc: mIRC extracts first space-separated token
    crit: notable
    conf: 0.86
    if:
      type: text
      # Token extraction alone establishes neither dispatch nor C2.
      regex: '(?i)\$gettok\(\s*%[\w.]+\s*,\s*1\s*,\s*32\s*\)'
