defaults:
  for: [csharp, powershell]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: dotnet-colon-delimiter-split
    desc: Splits string on colon delimiter
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: '(?i)(\.Split\s*\(\s*[''"]:[''"]\s*\)|-split\s+[''"]:[''"])'
  - id: dotnet-colon-split-integer-conversion
    desc: Colon split followed by integer conversion
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.Split\s*\(|-split)\s*[''"]\s*:\s*[''"].{0,420}(\[int\]|int\.Parse|Convert\.ToInt32)'
