defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-splits-encoded-data-into-dns-labels
    desc: Splits text into dot-joined 63-character chunks
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '\.match\(/.{1,63}/g\)\.join\(["''][.]["'']\)'

