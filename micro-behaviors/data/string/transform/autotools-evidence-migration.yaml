defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: carrier-suffix-command
    desc: sed keeps the final dot suffix
    crit: notable
    conf: 0.92
    for: [shell, text]
    if:
      type: text
      substr: 'sed "s/.*\.//g"'
  - id: custom-character-permutation
    desc: Shell tr character translation
    crit: notable
    conf: 0.96
    for: [shell, text]
    if:
      type: text
      substr: 'tr "\t \-_" " \t_\-"'
