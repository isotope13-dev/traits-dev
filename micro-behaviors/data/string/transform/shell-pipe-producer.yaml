# Inline echo/printf producers piping literal text into rev or tr.
# Ordinary string transformation without a shell sink is baseline syntax.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, build, github-actions]
  crit: baseline
  conf: 0.9

traits:
  - id: literal-rev-producer
    desc: Inline literal piped into rev
    if:
      type: text
      regex: '(echo|printf)\s+(-[neE]+\s+)?([''"][^\n]{2,180}[''"]|[^|;\n$]{2,80})\s*\|\s*rev\b'

  - id: literal-tr-producer
    desc: Inline literal piped into tr
    if:
      type: text
      regex: '(echo|printf)\s+(-[neE]+\s+)?([''"][^\n]{2,180}[''"]|[^|;\n$]{2,80})\s*\|\s*tr +'
