defaults:
  platforms: [windows, unix]
  for: [pdf]
  crit: suspicious
  conf: 0.95
  attack: T1203

traits:
  - id: pdf-stream-js-util-bytetochar
    desc: PDF stream uses util.byteToChar
    conf: 0.9
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: byteToChar
    unless:
      - id: well-known/lib/format/pdfium::source-tree
