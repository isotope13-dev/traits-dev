defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-escapeshellarg
    desc: PHP shell argument escaping call
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: escapeshellarg
  - id: php-escapeshellcmd
    desc: PHP shell command escaping call
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: escapeshellcmd

  # A shell command string that starts with the php binary: the process
  # re-enters the interpreter on a file instead of including it, which is how a
  # dropped stage is run detached from the request that fetched it.
composite_rules:
  - id: php-shell-argument-escaping
    desc: PHP shell argument escaping
    conf: 0.85
    any:
      - id: php-escapeshellarg
      - id: php-escapeshellcmd
