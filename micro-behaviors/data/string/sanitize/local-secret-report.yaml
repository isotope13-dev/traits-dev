defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: masked-secret-finding-record
  desc: Secret finding stores a masked value
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: '((call_expression) @record (#match? @record "findings\\.push\\([\\s\\S]{0,500}masked:\\s*maskSecret\\(match\\[0\\]\\)"))' 
  unless:
  - type: symbol
    kind: call
    exact: fetch
  - type: symbol
    kind: call
    exact: eval
  - type: symbol
    kind: call
    exact: Function
  - type: symbol
    kind: call
    exact: execSync
  - type: symbol
    kind: call
    exact: spawn
