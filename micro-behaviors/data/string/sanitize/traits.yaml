# Neutral formula-injection and bidirectional-text inspection atoms.
# Defensive sanitizers and offensive generators share these patterns;
# intent lives in objectives / well-known composites.
defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript, go]
  crit: notable
  conf: 0.9

traits:
  - id: formula-injection-kind-enum
    desc: FormulaInjection violation kind identifier
    conf: 0.95
    if:
      type: text
      word: FormulaInjection

  - id: bidi-override-kind-enum
    desc: BidiOverride violation kind identifier
    conf: 0.95
    if:
      type: text
      word: BidiOverride

  - id: csv-formula-prefix-check
    desc: Checks CSV formula-leading characters
    conf: 0.92
    if:
      type: text
      regex: "matches!\\([^)]{0,80}[=+]\\s*\\|\\s*[-]\\s*\\|\\s*[@]"

  - id: bidi-override-codepoints
    desc: References Unicode bidi override codepoints
    conf: 0.93
    if:
      type: text
      regex: '\\u\{202[A-E]\}|\\u\{206[6-9]\}|U\+202[A-E]'

composite_rules:
  - id: structured-input-hazard-inspect
    desc: Inspects formula and bidi input hazards
    conf: 0.94
    needs: 2
    any:
      - id: formula-injection-kind-enum
      - id: bidi-override-kind-enum
      - id: csv-formula-prefix-check
      - id: bidi-override-codepoints
