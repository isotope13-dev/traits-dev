defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: js-bracketed-call-bom-prefix
    desc: Bracketed call with a BOM string prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \[[^\]]{1,80}\]\s*\([^,]{1,160},\s*['"]\\uFEFF['"]\s*\+

