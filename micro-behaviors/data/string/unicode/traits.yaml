# Unicode Tags-block references are neutral observations. Defensive
# sanitizers, validators, and encoders can all need the same range; the
# anti-static objective owns only the stronger chr()-construction combination.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: unicode-tags-block-base-reference
    desc: References Unicode Tags block base
    if:
      type: text
      regex: '0[xX]E0(000|100)\b'

  - id: unicode-tags-block-range-check
    desc: Checks Unicode Tags block range
    if:
      type: text
      regex: '0[xX]E0000\b[\s\S]{0,240}0[xX]E007F\b'

