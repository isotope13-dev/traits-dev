# References to the two Unicode blocks whose code points render as nothing are
# neutral observations. Defensive sanitizers, validators, encoders and plain
# text-width tables can all need the same ranges; the anti-static objective owns
# only the stronger chr()-construction combination.
#
# Split in 2026-08: one trait matched `0xE0000|0xE0100` but was named and
# described for the Tags block alone. U+E0100 is the Variation Selectors
# Supplement, a different block — so on any east-asian-width table (blessed's
# lib/unicode.js treats U+E0100..U+E01EF as ambiguous-width) it reported a
# Tags-block reference that is not in the file. Two blocks, two traits.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # Repeated invisible separators inside ASCII words are distinct from the
  # single ZWNJ used legitimately in Persian and other joining scripts.
  # Three gaps also cover the report's five-character e-Tax label.
  - id: ascii-word-interleaved-format-marks
    desc: ASCII word split by invisible separators
    for: [source, scripts]
    platforms: [unix, windows, android]
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '([A-Za-z0-9-][\x{200B}-\x{200D}\x{2060}\x{FEFF}]){3}[A-Za-z0-9]'

  - id: xml-ascii-word-interleaved-format-marks
    desc: XML ASCII word split by invisible separators
    for: [xml]
    platforms: [unix, windows, android]
    conf: 0.97
    if:
      type: text
      regex: '([A-Za-z0-9-][\x{200B}-\x{200D}\x{2060}\x{FEFF}]){3}[A-Za-z0-9]'

  # DEX string extraction can split a UTF-8 string at invisible characters;
  # inspect the original MUTF-8 string-pool bytes for this observation.
  - id: dex-ascii-word-interleaved-format-marks
    desc: DEX ASCII word split by invisible separators
    for: [dex]
    platforms: [android]
    conf: 0.97
    if:
      type: raw
      regex: '([A-Za-z0-9-][\x{200B}-\x{200D}\x{2060}\x{FEFF}]){3}[A-Za-z0-9]'

  - id: unicode-tags-block-base-reference
    desc: References Unicode Tags block base U+E0000
    if:
      type: text
      regex: '0[xX]E0000\b'

  - id: unicode-variation-selectors-supplement-base-reference
    desc: References Variation Selectors Supp base
    if:
      type: text
      regex: '0[xX]E0100\b'

  - id: unicode-tags-block-range-check
    desc: Checks Unicode Tags block range
    if:
      type: text
      regex: '0[xX]E0000\b[\s\S]{0,240}0[xX]E007F\b'

  - id: zero-width-format-codepoint-set
    desc: References ordered zero-width codepoint set
    for: [scripts, source, class]
    conf: 0.94
    if:
      type: text
      regex: '(?is)(\\u\{?|0x)200b.{0,100}200c.{0,100}200d.{0,100}(feff|2060)'

  # A zero-width or bidi mark inside a regex character class (U+200F RLM in
  # `[d\u200fM\u200f]`, Syncfusion's RTL date-format separator detection)
  # is an i18n alternative the class can match, not a token being split to
  # evade filters. The brackets are the discriminator: spliced tokens never
  # carry them.
  - id: bidi-mark-in-regex-character-class
    desc: Bidi mark inside a regex character class
    conf: 0.93
    ref: sha256:327f76cd5eb2079043f7f782094eda455ab619988dc4d63934d3a825786f0271
    if:
      type: text
      regex: '(r?["'']|/)\[[^\[\]\n]{0,120}(\xE2\x80[\x8E\x8F]|\xE2\x80[\xAA-\xAE])[^\[\]\n]{0,120}\]'

  # Every visible character followed by U+200B ZERO WIDTH SPACE: the string
  # renders as the plain word ("Saisonポイント") while keyword, brand and
  # allowlist matching sees no such word. A single ZWSP is a line-break hint;
  # five alternations in a row is a word being split. The character before
  # each ZWSP must itself be visible, so a run of invisible marks alone (a
  # separate observation) does not satisfy it.
  - id: zero-width-space-interleaved-word
    desc: Word interleaved with zero-width spaces
    for: [dex]
    platforms: [android]
    conf: 0.9
    if:
      type: raw
      regex: '([^\s\x{200B}-\x{200F}\x{2060}\x{FEFF}]\x{200B}){5}'

composite_rules:
  - id: zero-width-interleaved-word
    desc: Word repeatedly split by invisible separators
    for: [source, scripts, dex, xml]
    platforms: [unix, windows, android]
    any:
      - id: ascii-word-interleaved-format-marks
      - id: xml-ascii-word-interleaved-format-marks
      - id: dex-ascii-word-interleaved-format-marks
      - id: zero-width-space-interleaved-word
