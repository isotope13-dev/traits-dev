defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: javascript-variation-selector-range
  desc: Checks variation-selector code point range
  crit: notable
  conf: 0.94
  for: [javascript, typescript, text]
  if:
    type: text
    regex: 'codePointAt[\s\S]{0,120}0x[Ff][Ee]00[\s\S]{0,120}0x[Ff][Ee]0[Ff]'
  unless:
  - id: well-known/lib/format/pdfjs/
- id: javascript-supplementary-selector-range
  desc: Checks supplementary selector code point range
  crit: notable
  conf: 0.94
  for: [javascript, typescript, text]
  if:
    type: text
    regex: 'codePointAt[\s\S]{0,120}0x[Ee]0100[\s\S]{0,120}0x[Ee]01[Ee][Ff]'
  unless:
  - id: well-known/lib/format/pdfjs/
