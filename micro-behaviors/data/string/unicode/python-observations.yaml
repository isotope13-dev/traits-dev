defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: invisible-character-set-exclusion
    desc: Python excludes chars via invisible set
    if:
      type: text
      regex: '(?i)not\s+in\s+_[a-z_]*invisible[a-z_]*'
  - id: zero-width-space-literal
    desc: Zero-width space string literal
    if:
      type: string_literal
      exact: "​"
