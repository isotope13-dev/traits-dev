defaults:
  platforms: [unix, windows]
  for: [rust]
traits:
  # Printable ASCII spelled as \xNN escapes has no reason to exist in source:
  # it hides names such as environment keys from text search.
  - id: rust-hex-escaped-printable-literal
    desc: Rust literal spells text in hex escapes
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '"(\\x[2-7][0-9a-fA-F]){12,}"'
  - id: rust-printable-byte-array-from-utf8
    desc: Rust text rebuilt from printable bytes
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '&\[u8\]\s*=\s*&\[\s*(0x[2-7][0-9a-fA-F],\s*){16,}[^\]]{0,40}\][\s\S]{0,200}from_utf8'
