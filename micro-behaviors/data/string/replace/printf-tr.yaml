# Deleting characters from a printed token does not prove command execution.
defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text]
  crit: notable
  conf: 0.9
traits:
  - id: printf-token-character-deletion
    desc: Printf token piped through character deletion
    if:
      type: text
      regex: 'printf\s+[''"]?[A-Za-z0-9]{2,16}[''"]?\s*\|\s*tr\s+-d\s+[''"]?[A-Za-z0-9]'

