defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: callback-retains-unmatched-text
    desc: Replacement callback keeps unchanged matches
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @replace)
          arguments: (arguments (_)
            (_ parameters: (formal_parameters (identifier) @matched)
              body: (statement_block
                (return_statement (ternary_expression
                  condition: (binary_expression
                    left: (identifier) @r1 operator: "&&"
                    right: (binary_expression left: (identifier) @r2
                      operator: ["!==" "!="] right: (identifier) @input))
                  consequence: (identifier) @r3
                  alternative: (identifier) @fallback)))))) @rewrite
          (#eq? @replace "replace")
          (#eq? @r1 @r2) (#eq? @r1 @r3)
          (#eq? @matched @input) (#eq? @matched @fallback))
