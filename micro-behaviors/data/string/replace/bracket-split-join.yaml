defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-bracket-split-join-remove
  desc: Removes delimiter via bracket split/join
  crit: notable
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \[['"]split['"]\]\([^)]{1,80}\)(\.join|\[['"]join['"]\])\(['"]['"]\)
