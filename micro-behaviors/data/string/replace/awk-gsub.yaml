# gsub is the in-place regex substitution in awk, jq, Tcl (and historically
# Lua), so a bare call token identifies the string-replace operation, not the
# interpreter. Composites that need awk supply the awk context themselves.
traits:
  - id: gsub-call-literal
    desc: Shell string literal calls gsub
    platforms: [unix, windows]
    for: [shell]
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '\bgsub\s*\('
