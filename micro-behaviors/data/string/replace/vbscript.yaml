# Raw source reference, including quoted examples; no execution or decoding claim.
defaults:
  for: [vbs, asp]
  platforms: [windows]
traits:
  - id: vb-replace-function-reference
    desc: VB Replace function-name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      # ASP.NET pages can be identified as ASP. A C# receiver.Replace(...)
      # is a method call, not the unqualified VBScript Replace function.
      regex: '(?i)(^|[^\w.])Replace[ \t]*\('
