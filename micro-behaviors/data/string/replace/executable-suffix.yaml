# String suffix transformations do not prove a renamed executable.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
traits:
- id: suffix-slice-call-to-exe
  desc: Slices string; appends .exe, .dll or .scr
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.slice\s*\(\s*0\s*,\s*-[2-5]\s*\)\s*\+\s*["']\.(exe|dll|scr)["']
- id: suffix-slice-call-to-exe-alt
  desc: Slices string; appends .com, .cpl or .pif
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.slice\s*\(\s*0\s*,\s*-[2-5]\s*\)\s*\+\s*["']\.(com|cpl|pif)["']
- id: suffix-index-slice-to-exe
  desc: Index slice appends .exe, .dll or .scr
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \[[^\]\r\n]{0,80}:-[2-5]\]\s*\+\s*["']\.(exe|dll|scr)["']
- id: suffix-index-slice-to-exe-alt
  desc: Index slice appends .com, .cpl or .pif
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \[[^\]\r\n]{0,80}:-[2-5]\]\s*\+\s*["']\.(com|cpl|pif)["']
- id: suffix-replace-identity-exe
  desc: No-op replace keeps .exe extension
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: \.replace\s*\(\s*["']\.exe["']\s*,\s*["']\.exe["']\s*\)
- id: suffix-replace-identity-dll
  desc: No-op replace keeps .dll extension
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: \.replace\s*\(\s*["']\.dll["']\s*,\s*["']\.dll["']\s*\)
- id: suffix-replace-to-exe-or-dll
  desc: Replaces suffix with .exe or .dll
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.replace\s*\(\s*["']\.[a-z0-9]{2,5}["']\s*,\s*["']\.(exe|dll)["']\s*\)
- id: suffix-replace-to-scr
  desc: replace() changes a suffix to .scr
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.replace\s*\(\s*["']\.[a-z0-9]{2,5}["']\s*,\s*["']\.scr["']\s*\)
- id: suffix-replace-call-to-com
  desc: replace() swaps a document suffix to .com
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.replace\s*\(\s*["']\.(pdf|jpe?g|docx?)["']\s*,\s*["']\.com["']\s*\)
- id: suffix-replace-to-cpl-or-pif
  desc: Replaces suffix with .cpl or .pif
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.replace\s*\(\s*["']\.[a-z0-9]{2,5}["']\s*,\s*["']\.(cpl|pif)["']\s*\)
composite_rules:
- id: suffix-slice-and-append
  desc: Slices string and appends a file suffix
  crit: notable
  conf: 0.94
  any:
  - id: suffix-slice-call-to-exe
  - id: suffix-slice-call-to-exe-alt
  - id: suffix-index-slice-to-exe
  - id: suffix-index-slice-to-exe-alt
- id: suffix-literal-replace
  desc: Replaces a literal file suffix
  crit: notable
  conf: 0.94
  any:
  - id: suffix-replace-to-exe-or-dll
  - id: suffix-replace-to-scr
  - id: suffix-replace-call-to-com
  - id: suffix-replace-to-cpl-or-pif
  unless:
  - id: suffix-replace-identity-exe
  - id: suffix-replace-identity-dll
