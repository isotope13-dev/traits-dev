defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: npm-auth-prefix-replacement
    desc: Replaces npm registry auth token prefix
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: \.replace\(\s*['"]//registry\.npmjs\.org/:_authToken=['"]\s*,
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/path::test-directory-component
