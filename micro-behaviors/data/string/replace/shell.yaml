defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  - id: shell-echo-tr-transform
    desc: Shell echo piped to tr transformation
    if:
      type: text
      regex: echo\s+['"].*?['"]\s*\|\s*tr\s+['"].*?['"]\s+['"].*?['"]
    not:
      # Variable/list normalization is common shell plumbing, not decoding.
      - regex: echo\s+["'][^"']*\$[{(]?
      - regex: echo\s+["'][^"']*["']\s*\|\s*tr\s+["'][,\s\\n]+["']\s+["'][,\s\\n]+["']
      - substr: echo "$@" | tr " " "\n"
      - substr: echo "$@" | tr 'abcdefghijklmnopqrstuvwxyz'
      - substr: echo "$@" | tr 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
      - substr: echo "$gltype" | tr '
      - substr: echo "$test" | tr '\n' ' '
      - substr: echo "$VERSION" | tr '.' ','
      - substr: echo "$EXPECTED_PATHVER" | tr '.' '_'
      - substr: echo "$difference" | tr ' ' '\n'
      - substr: echo "$todo" | tr ' ' '\12'
      - substr: echo "$UNAME_SYSTEM"
      - substr: echo "$(ZSTD_NOMT_FILES)" | tr ' ' '\n' | $(GREP) -q zstdmt
      - substr: echo "${sym}"; done |grep -v "^${n}\$" |tr '\n' ' '
      - substr: echo "alias ci=\"$(readlink -f "$0")\"; complete -W
      - substr: echo "alias ci=\"$(readlink -f "$0")\"; _complete_mpy_ci_zsh()
      - substr: echo "alias ci=\"$(readlink -f "$0")\"; complete -c ci -p
      - substr: alias ci=\"$(readlink -f "$0")\"; complete -W
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/app/system/quickemu
  # A `tr` translation whose first set mixes an escape sequence with at least
  # two other characters and whose second set is four or more characters --
  # the multi-character map xz 5.6.x's build-to-host used as a stream decoder
  # (`tr "\t \-_" " \t_\-"`). Single-escape line-ending conversion such as
  # `tr '\r' '\n'` (MariaDB's wsrep SST scripts) is plumbing, not this.
  - id: tr-escaped-multichar-translation
    desc: tr maps escaped multi-character sets
    for: [shell, text]
    platforms: [unix]
    conf: 0.88
    if:
      type: text
      regex: 'tr\s+[''"]([^''"]{2,40}\\[tnr\\]|\\[tnr\\][^''"]{2,40})[^''"]{0,40}[''"]\s+[''"][^''"]{4,80}[''"]'
