# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
traits:
- id: split-join-variable-separator
  desc: Split and join calls within 60 bytes
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: \.split\(\w+\)[\s\S]{0,60}\.join\(
- id: split-join-indexed-separator
  desc: Split and join with table-indexed separator
  crit: notable
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \.split\s*\(\s*\w+\s*\[\s*(0x[0-9a-fA-F]+|\d+)\s*\]\s*\)[\s\S]{0,60}\.join\s*\(
