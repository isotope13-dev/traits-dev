# Python source rewrite via re.sub: reading files, substituting with a
# regular expression, and writing the result back is the codemod shape.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-re-sub-file-rewrite
    desc: Python regex-substitutes file content
    if:
      type: text
      # The write has to belong to the substitution. A later function's
      # write, hundreds of bytes away, is a different operation.
      regex: '\bre\.sub\([\s\S]{0,400}\.write\('

composite_rules:
  # Recursive codemods use the same operations as indicator cleanup, but
  # walking and rewriting alone do not establish that the target is a
  # security indicator.
  - id: python-walk-regex-rewrite-files
    desc: Python walks and regex-rewrites file contents
    crit: notable
    conf: 0.9
    near_lines: 20
    all:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
      - id: python-re-sub-file-rewrite
