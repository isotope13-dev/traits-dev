# Python source rewrite via re.sub: reading files, substituting with a
# regular expression, and writing the result back is the codemod shape.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-re-sub-file-rewrite
    desc: Python regex-substitutes file content
    if:
      type: text
      regex: 're\.sub\([\s\S]{0,900}\.write\('
