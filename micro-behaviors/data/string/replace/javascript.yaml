defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: chained-replace-calls
    desc: Chains multiple JavaScript string replacements
    crit: notable
    conf: 0.9
    count_min: 1
    if:
      type: symbol
      regex: \.replace\.replace
    not:
      - regex: replaceAll
    unless:
      - type: text
        substr: replace(/~/g,"~0").replace(/\//g,"~1")
      - type: raw
        regex: '&amp;[\s\S]{0,200}&lt;[\s\S]{0,200}&gt;'
      - id: micro-behaviors/data/manipulation::filename-sanitization-replace
      - id: micro-behaviors/data/manipulation::filename-sanitization-function
      - id: metadata/file/profile/locale::js-locale-registration-module

  - id: regex-global-string-removal
    desc: JavaScript removes matches with global RegExp
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.replace\(RegExp\(\w+,\s*[''\"]g[''\"]\),\s*[''\"][''\"]\)'
  - id: keyed-replacement-call
    desc: Replaces text using a keyed replacement table
    # Property names are intentionally unconstrained. Wallet clippers can
    # rename their table or add new chains; the address-recognition leg in the
    # hostile composites establishes the cryptocurrency context.
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\.(replace|replaceAll)\(\s*[A-Za-z_$]\w*(\.[A-Za-z_$]\w*|\[[^\]]{1,80}\])\s*,'
