defaults:
  platforms: [unix, windows]

composite_rules:
- id: node-environment-fragment-unicode-replace
  desc: Environment token and Unicode replace clues
  crit: notable
  conf: 0.97
  for: [javascript, typescript]
  near_bytes: 500
  all:
  - id: micro-behaviors/data/string/replace::unicode-whitespace-class-replace
  any:
  - id: micro-behaviors/data/string/unicode::node-escaped-env-fragment
  - id: micro-behaviors/data/string/concat::node-separated-env-fragment
