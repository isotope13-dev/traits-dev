defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  # Require the assignment inside the regex argument of this same call.
  # A dotenv parser's replace(/^export\s+/, "") followed by a credential
  # key comparison strips only a syntax prefix, not a credential assignment.
  # No file modification or startup-file target is implied by string removal.
  - id: js-credential-export-removal
    desc: Removes credential export assignment text
    if:
      type: tree-sitter
      query: |
        (
          (call_expression
            function: (member_expression
              property: (property_identifier) @method)
            arguments: (arguments
              . (regex pattern: (regex_pattern) @pattern)
              . (string) @replacement)) @removal
          (#eq? @method "replace")
          (#match? @pattern "\\bexport\\b[^\\r\\n]{0,60}(API_KEY|TOKEN|SECRET)[A-Z_0-9]*[^\\r\\n]{0,20}=")
          (#match? @replacement "^(\"\"|'')$")
        )
