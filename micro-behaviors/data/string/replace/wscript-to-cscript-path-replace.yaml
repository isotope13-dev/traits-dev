defaults:
  platforms:
  - windows
traits:
- id: wscript-to-cscript-path-replace
  desc: Replaces wscript with cscript on host path
  for:
  - javascript
  - vbs
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)WScript\.FullName[\s\S]{0,120}replace\s*\([^)]{0,40}wscript[^)]{0,40}cscript
