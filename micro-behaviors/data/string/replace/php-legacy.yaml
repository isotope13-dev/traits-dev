defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-preg-eval-modifier
    desc: Uses legacy PHP regex evaluation modifier
    if:
      type: tree-sitter
      node: function_call_expression
      case_insensitive: true
      regex: '^preg_(replace|filter)\s*\(\s*["''][^"'']{1,100}[/|#~][a-z]*e[a-z]*["'']'
  - id: php-mb-regex-eval-option
    desc: Uses legacy multibyte regex evaluation option
    if:
      type: tree-sitter
      node: function_call_expression
      case_insensitive: true
      regex: '^mb_eregi?_replace\s*\([^,]{1,80},[^,]{1,80},[^,]{1,80},\s*["''][a-z]*e'
