# The ProgID passed to CreateObject is the result of four or more nested
# Replace calls: the class name (e.g. WScript.Shell) is spelled with junk
# tokens that are substituted away at run time and never appears literally.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1027

traits:
  - id: vbs-createobject-nested-replace-progid
    desc: CreateObject ProgID built by nested Replace
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)CreateObject\s*\(\s*(Replace\s*\(\s*){4,}'
