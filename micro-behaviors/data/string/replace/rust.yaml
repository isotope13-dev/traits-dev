defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: rust-string-replacement-call
    desc: Rust replace call with string-pattern argument
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(replace|replace_all)$'
      # Rust pointer/Cell/Option replacement takes one argument, not a pattern.
      arg:
        index: 0
        kind: string
