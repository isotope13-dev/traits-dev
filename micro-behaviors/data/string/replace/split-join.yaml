defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: notable
  conf: 0.8
traits:
- id: repeated-split-join-removal
  desc: Repeated split/join string removal
  count_min: 2
  if:
    type: text
    regex: \.split\(\s*".{1,30}"\s*\)\.join\(\s*""\s*\)
  not:
  - regex: \\[rnt]
  - regex: \\x1b\[20[01]~
  downgrade:
    any:
    - id: metadata/build/bundler/asset::google-tag-manager-bundle
  unless:
  - id: well-known/lib/web/ecmascript::core-js-runtime-bundle
  - id: metadata/build/
  - id: well-known/lib/ui/gsap/
