# Literal character substitution, independent of its purpose or input contents.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: python-non-ascii-to-base64-character
    desc: Non-ASCII to Base64 replacement call
    for: [python]
    if:
      type: tree-sitter
      query: |
        (
          (call
            function: (attribute
              attribute: (identifier) @method)
            arguments: (argument_list
              . (string) @source
              . (string) @replacement .)) @substitution
          (#eq? @method "replace")
          (#match? @source "^[\"'][^\\x00-\\x7F][\"']$")
          (#match? @replacement "^[\"'][A-Za-z0-9+/][\"']$")
        )
  - id: js-non-ascii-to-base64-character
    desc: Non-ASCII to Base64 replacement call
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (
          (call_expression
            function: (member_expression
              property: (property_identifier) @method)
            arguments: (arguments
              . (string) @source
              . (string) @replacement .)) @substitution
          (#any-of? @method "replace" "replaceAll")
          (#match? @source "^[\"'][^\\x00-\\x7F][\"']$")
          (#match? @replacement "^[\"'][A-Za-z0-9+/][\"']$")
        )
