defaults:
  platforms: [windows, unix]
traits:
  - id: js-repeated-split-join-chain
    desc: Repeated split/join call chain
    crit: notable
    conf: 0.92
    for:
    - javascript
    if:
      type: symbol
      regex: (\.split\.join|\.join\.split){3,}
    unless:
    - id: metadata/build
    - type: string_literal
      substr: \0SLASH
