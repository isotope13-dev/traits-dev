defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: singapore-delimiter-cleanup
    desc: Removes Singapore delimiters from a string
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'split("singapore").join("")'
  - id: js-repeated-split-join-chain
    desc: Repeated split/join call chain
    crit: notable
    conf: 0.92
    if:
      type: symbol
      regex: (\.split\.join|\.join\.split){3,}
