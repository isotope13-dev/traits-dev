defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-str-replace-call
    desc: PHP replaces matched string content
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: str_replace

  - id: php-preg-replace-call
    desc: PHP replaces strings with a regular expression
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: preg_replace

  - id: php-preg-replace-digit-class
    desc: PHP regex replacement uses a digit class
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: preg_replace
      arg:
        kind: string
        substr: '\d'
