defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: variable-pattern-callback-replacement
    desc: Replaces variable pattern through callback
    conf: 0.97
    if:
      type: text
      exclude_comments: true
      regex: '\.replace(All)?\s*\(\s*[\w$]+\s*,\s*(function\b|\([^)]{0,80}\)\s*=>|[\w$]+\s*=>)'
