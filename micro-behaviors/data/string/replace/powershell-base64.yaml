# Preserve the former decoder/regex matcher. Whitespace cleanup also matches;
# the required evidence supplies no payload activation or hostile intent.
defaults:
  platforms: [windows]
  for: [batch, powershell]

traits:
  - id: powershell-base64-regex-preprocessing
    desc: Base64 decoder near regex replacement
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)FromBase64String.{0,80}\[regex\]::Replace'
