defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: js-packer-token-substitution
    desc: Replaces packed tokens with dictionary entries
    if:
      type: text
      regex: 'replace\(new RegExp\([^\r\n]{1,80},k\[c\]\)'
  - id: numeric-character-dictionary
    desc: Pipe-delimited numeric character-code dictionary
    if:
      type: text
      regex: "'([0-9]{2,3}\\|){20,}"
  - id: packed-character-code-table-names
    desc: Packed table contains character-code API names
    if:
      type: text
      substr: 'fromCharCode|String'
