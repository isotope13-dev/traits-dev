defaults:
  platforms: [unix, windows]
  for: [python]
  size_min: 512
  size_max: 500000000
composite_rules:
  - id: openai-spellchecker-prompt-references
    desc: OpenAI, SpellChecker and spelling prompt references
    crit: notable
    conf: 0.99
    all:
      - id: well-known/lib/ai/openai::python-openai-import
      - id: metadata/lang/source/syntax/declaration::spellchecker-class-declaration-text
    any:
      - id: metadata/lang/natural/phrasing/agent::spelling-check-text-prompt
      - id: metadata/lang/natural/phrasing/agent::spelling-check-image-prompt
      - id: metadata/lang/source/literal/string/shape::reject-boolean-format-text
