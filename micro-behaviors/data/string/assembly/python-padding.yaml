defaults:
  platforms: [windows, linux, macos]
  for: [python]

traits:
  # Packet padding and exploit buffers share this neutral string construction.
  - id: python-large-repeated-byte-string
    desc: Builds a large repeated-byte string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[^#\r\n]{0,80}b?["''](\\x(90|cc|41)|A)["'']\s*\*\s*(0x[0-9a-fA-F]{2,}|[1-9]\d{2,})\b'
    not:
      - regex: '\bint\s*\(\s*b?["'']A["'']\s*\*'

