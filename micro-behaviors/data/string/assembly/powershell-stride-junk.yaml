defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1027
traits:
  - id: powershell-stride-loop-junk-cmdlet
    desc: Stride loop discards a junk cmdlet call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[\$\w+\];\s?\$\w+\s?=\s?[A-Z]\w+-\w+ \w+ \w+;\s?\$\w+\s?\+=\s?\d\}'

  - id: powershell-function-decodes-many-literals
    desc: One function decodes many string literals
    crit: notable
    conf: 0.85
    count_min: 8
    if:
      type: text
      regex: '\$\w+\s?\+?=\s?[A-Za-z]\w{3,30} ''[^''\n]{4,}'';'

  - id: powershell-inline-command-defines-function
    desc: PowerShell command line defines functions
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^powershell(\.exe)?\s[^"\n]{0,60}"[^"\n]{0,60}function \w+ ?\('
