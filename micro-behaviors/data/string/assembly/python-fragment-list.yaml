# Co-occurrence preserves the original archive scope; it does not bind the
# list's values to the decoder or establish an endpoint or concealment.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
composite_rules:
  - id: python-fragment-list-decoder-join
    desc: Base64-like list text and decoder join co-occur
    conf: 0.95
    scope: archive
    for: [python, whl, python-sdist, egg, tar, zip]
    all:
      - id: metadata/file/encoding/shape::python-base64-like-list-text
      - id: micro-behaviors/data/string/assembly::python-join-with-decoder-call
