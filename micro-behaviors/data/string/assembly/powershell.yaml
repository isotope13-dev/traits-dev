defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
traits:
  - id: powershell-stride-two-character-assembly
    desc: PowerShell assembles characters at stride two
    conf: 0.96
    if:
      type: text
      regex: '\+=\$\w+\[\$\w+\];\$\w+\+=2\}\s*until\(!\$\w+\[\$\w+\]\)'

  # Reassembling a value from three or more variables is a neutral string
  # assembly operation. Any split-URL or evaluated-payload meaning comes
  # from the objective composites that reference this atom, not from the
  # concatenation itself.
  - id: powershell-multi-var-concat
    desc: Concatenates three or more PowerShell variables
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '\$[A-Za-z0-9_]+\s*=\s*\$[A-Za-z0-9_]+\s*\+\s*\$[A-Za-z0-9_]+\s*\+'
