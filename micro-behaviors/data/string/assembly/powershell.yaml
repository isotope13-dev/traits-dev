defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
traits:
  - id: powershell-stride-two-character-assembly
    desc: PowerShell assembles characters at stride two
    conf: 0.96
    if:
      type: text
      regex: '\+=\$\w+\[\$\w+\];\$\w+\+=2\}\s*until\(!\$\w+\[\$\w+\]\)'
