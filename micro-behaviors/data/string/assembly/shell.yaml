defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: sh-template-placeholder
    desc: Shell contains a double-brace placeholder
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\{\{\s*[A-Za-z_]\w*\s*\}\}'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
  # CMake configures `@VAR@` in `.sh.cmake` before the shell runs. The
  # substituted token is a build path, not a reconstructed command name.
  - id: sh-cmake-at-placeholder
    desc: CMake at-sign variable placeholder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '@[A-Z][A-Z0-9_]{3,}@'
  # Go text/template slots (`{{.Field}}`) inside shell text embedded in Go
  # source: cloud-init and installer templates render these before the
  # shell ever runs, so the substitutions the shell parser counts as
  # dynamic targets are template rendering, not reconstruction.
  - id: sh-template-opening-delimiter
    desc: Shell contains a template delimiter
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '{{ '
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/lang/encoding::non-ascii-script-text
      - id: micro-behaviors/process/create/launch::shell-self-executable-jar

  - id: sh-terraform-template-directive
    desc: Shell contains Terraform template directive
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '%\{[ ~]*(for|if|endfor|endif)\b'

  # Hyphen joins are ordinary name-building (CI build IDs, artifact names,
  # image tags: test_id=$circuit-$degree-Benchmark-PR$prnumber--$time), not
  # command reconstruction; without them the parser's dynamic-target metric
  # can promote such assignments into hostile verdicts downstream.
  - id: assignment-variable-concatenation
    desc: Shell assignment joins variable expansions
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '\$\{?[A-Za-z_]\w*\}?(\.|-|\$)'

  - id: assignment-path-variable-concatenation
    desc: Shell path assignment uses a variable
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '.{0,60}[/.].{0,60}\$\{?[A-Za-z_]\w*\}?'

  - id: assignment-backtick-substitution
    desc: Shell assignment captures command substitution
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '`[^`\n]{1,200}`'

composite_rules:
  - id: shell-assignment-string-assembly
    desc: Shell assignment assembles a dynamic string
    crit: baseline
    conf: 0.9
    any:
      - id: assignment-variable-concatenation
      - id: assignment-path-variable-concatenation
      - id: assignment-backtick-substitution
