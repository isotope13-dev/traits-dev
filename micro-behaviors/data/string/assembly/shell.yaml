defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: sh-template-placeholder
    desc: Shell contains a double-brace placeholder
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\{\{\s*[A-Za-z_]\w*\s*\}\}'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content

  - id: sh-template-opening-delimiter
    desc: Shell contains a template delimiter
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '{{ '
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text
      - id: micro-behaviors/process/create/launch::shell-self-executable-jar

  - id: assignment-variable-concatenation
    desc: Shell assignment joins variable expansions
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '\$\{?[A-Za-z_]\w*\}?(\.|\$)'

  - id: assignment-path-variable-concatenation
    desc: Shell path assignment uses a variable
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '.{0,60}[/.].{0,60}\$\{?[A-Za-z_]\w*\}?'

  - id: assignment-backtick-substitution
    desc: Shell assignment captures command substitution
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '`[^`\n]{1,200}`'

composite_rules:
  - id: shell-assignment-string-assembly
    desc: Shell assignment assembles a dynamic string
    crit: baseline
    conf: 0.9
    any:
      - id: assignment-variable-concatenation
      - id: assignment-path-variable-concatenation
      - id: assignment-backtick-substitution
