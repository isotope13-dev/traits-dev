defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: sh-template-placeholder
    desc: Shell contains a double-brace placeholder
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\{\{\s*[A-Za-z_]\w*\s*\}\}'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content

  - id: sh-template-opening-delimiter
    desc: Shell contains a template delimiter
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '{{ '
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text
