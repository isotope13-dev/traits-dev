# PHP that spells names out rather than writing them.
#
# A backdoor grafted into a legitimate file cannot contain the word `eval`,
# `create_function` or `base64_decode` anywhere, because that is the one thing
# a reviewer greps for. So it carries a scrambled alphabet and a list of
# indexes into it, or chops the name into one-character literals and glues
# them back together. Either way the source names nothing it calls.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: suspicious
  conf: 0.92
  attack: T1027

traits:
  - id: php-char-table-index-builder
    desc: Builds a string from a character table
    if:
      type: text
      regex: '(?s)foreach\s*\(\s*\[[\d, ]{6,60}\]\s+as\s+\$\w+\)\s*\{\s*\$\w+\s*\.=\s*\$\w+\['

  - id: php-single-char-literal-chain
    desc: Name spelled as single-character literals
    if:
      type: text
      regex: "('[A-Za-z]?'\\.){6,}"

  - id: php-xor-char-chain
    desc: String assembled from XOR character expressions
    conf: 0.95
    if:
      type: text
      regex: '(\([^\r\n()]{3,16}\^[^\r\n()]{3,16}\)\s*\.){2,}'

  - id: php-chr-slice-char-chain
    desc: Assembled chr and slice concatenation
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '((chr\s*\(\s*\d+\s*\)|substr\s*\(\s*\$\w+[^)]{1,20}\))\s*\.){2,}'

  # Long runs of random letters inside a block comment, sitting between tokens
  # of a live expression. The comment changes nothing at run time; it exists to
  # break up `$_REQUEST[` so a signature spanning it never matches.
  - id: php-junk-block-comment
    desc: Block comment of random letters
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/\*[A-Za-z]{80,}\*/'
