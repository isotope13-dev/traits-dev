defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]

traits:
  - id: stack-immediate-byte-string-x64
    desc: Native stack immediate byte-string fragment
    crit: component
    conf: 0.86
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: C6 85 ?? ?? ?? ?? ?? [0-16] C6 85 ?? ?? ?? ?? ?? [0-16] C6 85 ?? ?? ?? ?? ?? [0-16] C6 85 ?? ?? ?? ?? ??
  - id: stack-immediate-byte-string-x86
    desc: Native stack immediate byte-string fragment
    crit: component
    conf: 0.86
    arch: [x86]
    for: [elf, pe]
    if:
      type: hex
      section: .text
      pattern: C6 45 ?? ?? [0-16] C6 45 ?? ?? [0-16] C6 45 ?? ?? [0-16] C6 45 ?? ??
