defaults:
  crit: notable
  conf: 0.86
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]

# Nearby immediate stores can initialize unrelated flags rather than text.
# Require the extractor to recover a printable string from stack writes;
# eight characters also excludes short incidental numeric fragments.
traits:
  - id: native-stack-string
    desc: Printable stack-constructed string (8+ chars)
    arch: [x86, x86-64]
    if:
      type: encoded
      encoding: stack
      regex: '[\x20-\x7e]{8,}'
