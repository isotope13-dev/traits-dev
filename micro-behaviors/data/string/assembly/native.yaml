defaults:
  crit: notable
  conf: 0.86
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]

# Nearby immediate stores can initialize unrelated flags rather than text.
# Require a path separator or word boundary inside printable immediate bytes.
# Repeated printable arithmetic immediates alone do not establish a string.
# The minimum two + separator + five characters also excludes short fragments.
traits:
  - id: native-immediate-string
    desc: Native immediate-built text with separators
    arch: [x86, x86-64]
    if:
      type: encoded
      encoding: stack
      regex: '[A-Za-z0-9_.:-]{2,}[/\\ ][A-Za-z0-9_./\\:= -]{5,}'
      not:
        # Go's parallel ChaCha state initializer repeats each sigma word.
        # These stores build cipher state, rather than text.
        - substr: 'nd 3nd 3nd 3'
