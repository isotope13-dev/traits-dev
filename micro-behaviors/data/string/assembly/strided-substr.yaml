defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: js-strided-substr-assembly
    desc: Appends characters at a fixed stride
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((for_statement
          increment: (augmented_assignment_expression
            left: (identifier) @step
            operator: "+="
            right: (number) @stride)
          body: (statement_block
            (expression_statement
              (augmented_assignment_expression
                operator: "+="
                right: (call_expression
                  function: (member_expression
                    property: (property_identifier) @method)
                  arguments: (arguments
                    (identifier) @index
                    (number) @width)))))) @loop
          (#eq? @step @index)
          (#eq? @method "substr")
          (#eq? @width "1")
          (#match? @stride "^([2-9]|[1-9][0-9]+)$"))
