defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.95
traits:
  - id: percent-byte-string-fragment-appends
    desc: Appends many percent-byte string fragments
    count_min: 8
    if:
      type: text
      regex: '\w+\s*\+=\s*"[^"\r\n]{0,80}%[0-9A-Fa-f]{2}[^"\r\n]{0,80}"'
