# Zero-padded integer formatting is neutral. Disk-fill objectives combine it
# with an unbounded file-producing loop, a large buffer, and repeated writes.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: zero-padded-format-token
    desc: Source uses an explicit zero-fill format token
    crit: component
    # Require an explicit zero fill. Optional `0` and one-argument padStart
    # matched ordinary width formatting and random tokens in encoded blobs.
    if:
      type: text
      regex: '(%0[3-8]d|:0[3-8][dD]?[}\"]|:0>[3-8]|padStart\([3-8]\s*,\s*["'']0|~[3-8]\.\.0B)'

  - id: csharp-decimal-width-format
    desc: C# interpolation zero-pads a decimal integer
    crit: component
    for: [csharp]
    if:
      type: text
      regex: '(?i)\{[a-z_]\w*:d[3-8]\}'

composite_rules:
  - id: zero-padded-integer-format
    desc: Code formats a zero-padded integer
    crit: notable
    any:
      - id: zero-padded-format-token
      - id: csharp-decimal-width-format
    unless:
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite
