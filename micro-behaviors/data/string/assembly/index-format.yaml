# Zero-padded integer formatting is neutral. Disk-fill objectives combine it
# with an unbounded file-producing loop, a large buffer, and repeated writes.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: zero-padded-integer-format
    desc: Code formats a zero-padded integer
    if:
      type: text
      regex: '(%0?[3-8]d|:0?[dD]?[3-8][}\"]|padStart[(][3-8]|~[3-8][.][.]0B|:0>[3-8])'
    unless:
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite
