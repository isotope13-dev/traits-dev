# Character removal inside shell substitution, followed by command options.
# Requires the closing backtick and following option: a substitution that
# merely returns stripped data does not establish this command-position shape.
defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text]
  crit: notable
  conf: 0.9

traits:
  - id: character-stripped-command-substitution
    desc: Stripped substitution precedes command options
    conf: 0.95
    if:
      type: text
      regex: '`\s*printf\s+[A-Za-z0-9]{2,16}\s*\|\s*tr\s+-d\s+\w+`\s+-'
