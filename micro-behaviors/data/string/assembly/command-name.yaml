# Rebuilding a command *name* at runtime so the name never appears in the file.
#
# `printf xAxd | tr -d A` prints `xxd`. The interesting property is not the
# string assembly -- shells concatenate text constantly -- but that the result
# is spliced straight into a command position via command substitution, so the
# program actually invoked is one no static reader of the file ever sees. It
# defeats an "is xxd/curl/base64 called here?" search on the source text.
#
# Kept deliberately file-type-agnostic: the technique lives in a shell string,
# and that string is just as likely to sit inside a Makefile recipe, a Kotlin
# `ProcessBuilder`, a Rust `Command`, a `setup.py`, or an Xcode build setting
# as in a `.sh`. It is the payload that moves between build systems, not the
# host language.
defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text]
  crit: suspicious
  conf: 0.9
  attack: T1027
  mbc: B0032

traits:
  # `tr -d` deleting filler out of a printf argument has one purpose: to emit a
  # word the file does not contain. A build that wants `xxd` writes `xxd`.
  - id: printf-tr-command-reconstruction
    desc: Command name rebuilt via printf and tr
    if:
      type: text
      regex: 'printf\s+[''"]?[A-Za-z0-9]{2,16}[''"]?\s*\|\s*tr\s+-d\s+[''"]?[A-Za-z0-9]'

  # The same reconstruction, confirmed to land in a command position: the
  # backticks or `$( )` make the rebuilt word the program that runs. This is
  # the form that actually executes, and it is what the obfuscation composites
  # pair with a payload.
  - id: reconstructed-command-substitution
    desc: Rebuilt command name executed
    conf: 0.95
    if:
      type: text
      regex: '[`$]\(?\s*printf\s+[''"]?[A-Za-z0-9]{2,16}[''"]?\s*\|\s*tr\s+-d\s+'
