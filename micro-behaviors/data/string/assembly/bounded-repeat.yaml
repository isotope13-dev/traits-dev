# Bounded 257-1024 character string repetition across source and scripting languages.
# Protocol fuzzers, packet padders, and length-boundary auth-bypass exploits construct
# repeated-character strings in this window (exceeding 256-byte libc/crypt limits while
# staying within 1024-byte protocol maximums); consumers supply protocol intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: operator-string-repeat-257-to-999
    desc: Repeats string 257-999 times via operator
    for: [python, ruby, perl, powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(^|[(=\[,:\s])b?[''"][^''"\\\n]{1,4}[''"]\s*[*x]\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'

  - id: operator-string-repeat-1000-to-1024
    desc: Repeats string 1000-1024 times via operator
    for: [python, ruby, perl, powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(^|[(=\[,:\s])b?[''"][^''"\\\n]{1,4}[''"]\s*[*x]\s*10([01]\d|2[0-4])\b'

  - id: reverse-operator-string-repeat-257-to-1019
    desc: Left-multiplies short string by 257-1019
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\b(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\s*\*\s*b?[''"][^''"\\\n]{1,4}[''"]'

  - id: method-string-repeat-257-to-999
    desc: Calls repeat method with 257-999 count
    for: [javascript, typescript, rust, java, kotlin]
    if:
      type: text
      exclude_comments: true
      regex: '\.repeat\s*\(\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\s*\)'

  - id: method-string-repeat-1000-to-1024
    desc: Calls repeat method with 1000-1024 count
    for: [javascript, typescript, rust, java, kotlin]
    if:
      type: text
      exclude_comments: true
      regex: '\.repeat\s*\(\s*10([01]\d|2[0-4])\s*\)'

  - id: go-repeat-257-to-999
    desc: Go Repeat call with 257-999 count
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: '\b(strings|bytes)\.Repeat\([^,\n]{1,24},\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\s*\)'

  - id: go-repeat-1000-to-1024
    desc: Go Repeat call with 1000-1024 count
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: '\b(strings|bytes)\.Repeat\([^,\n]{1,24},\s*10([01]\d|2[0-4])\s*\)'

  - id: php-or-c-repeat-257-to-999
    desc: Calls str_repeat or memset for 257-999 bytes
    for: [php, c, cpp]
    if:
      type: text
      exclude_comments: true
      regex: '\b(str_repeat|memset)\([^)\n]{3,32},\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\s*\)'

  - id: shell-seq-repeat-257-to-999
    desc: Shell printf repeats chars 257-999 times
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: 'printf\s+[^\r\n;|&]{1,32}(\bseq\s+(1\s+)?|\{1\.\.)(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'

  - id: shell-seq-repeat-1000-to-1024
    desc: Shell printf repeats chars 1000-1024 times
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: 'printf\s+[^\r\n;|&]{1,32}(\bseq\s+(1\s+)?|\{1\.\.)10([01]\d|2[0-4])\b'

  - id: shell-head-tr-repeat-257-to-1019
    desc: Shell head and tr repeat 257-1019 bytes
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: '\bhead\s+-c\s*(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\b[^\r\n]{0,36}\|\s*tr\b'

  - id: operator-short-string-var-repeat
    desc: Multiplies short string literal by variable
    for: [python, ruby, powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(^|[(=\[,:\s])b?(''[^''\\\r\n]{1,2}''|"[^"\\\r\n]{1,2}")\s*\*\s*[A-Za-z_]\w*\b'
    not:
      - regex: '[''"][-=_~ \t][''"]\s*\*\s*(?i)(width|cols|columns|indent|pad\w*|sep\w*|hr|line\w*)\b'

  - id: method-short-string-var-repeat
    desc: Repeats short string literal by variable
    for: [javascript, typescript, rust, java, kotlin]
    if:
      type: text
      exclude_comments: true
      regex: '(''[^''\n]{1,2}''|"[^"\n]{1,2}")\.repeat\s*\(\s*[A-Za-z_$]\w*\s*\)'

  - id: go-short-string-var-repeat
    desc: Go Repeat on short literal with variable
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: '\b(strings|bytes)\.Repeat\((\[\]byte\()?"[^"\n]{1,2}"\)?,\s*[A-Za-z_]\w*\)'

  - id: shell-seq-var-repeat
    desc: Shell printf repeats chars over variable seq
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: 'printf\s+[''"][^''"\n]{1,6}%\.0s[''"]\s+\$\(\s*seq\s+(1\s+)?["'']?\$[A-Za-z_{\w]'

  - id: variable-bound-257-to-999
    desc: Assigns variable to 257-999 numeric bound
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '\b[A-Za-z_]\w*(:\s*\w+)?\s*:?=\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'
    not:
      - regex: '(?i)^(timeout|port|status|code|sleep|delay|ttl|interval|mode|perm|buf\w*|chunk\w*|recv\w*|read\w*|block\w*|page\w*|workers|threads|concurrency|max_conn\w*|width|height|cols|columns|rows|dpi|fps|hz|rate|limit|batch\w*|queue\w*|cache\w*|pool\w*|backlog|mtu|mss)\b'
      - regex: '(?i)^(int\d*|uint\d*|float\d*|usize|isize|number|long|short)\b'

  - id: fallback-bound-257-to-999
    desc: Defaults expression to 257-999 numeric bound
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '(\belse\s+|:-)(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'

  - id: variable-bound-1000-to-1024
    desc: Assigns or defaults bound to 1000-1024
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '(\b[A-Za-z_]\w*(:\s*\w+)?\s*:?=\s*|\belse\s+|:-)10([01]\d|2[0-4])\b'
    not:
      - regex: '(?i)^(timeout|port|status|code|sleep|delay|ttl|interval|mode|perm|buf\w*|chunk\w*|recv\w*|read\w*|block\w*|page\w*|workers|threads|concurrency|max_conn\w*|width|height|cols|columns|rows|dpi|fps|hz|rate|limit|batch\w*|queue\w*|cache\w*|pool\w*|backlog|mtu|mss)\b'
      - regex: '(?i)^(int\d*|uint\d*|float\d*|usize|isize|number|long|short)\b'

composite_rules:
  - id: variable-bound-257-to-1024
    desc: Sets variable or default bound to 257-1024
    conf: 0.88
    any:
      - id: variable-bound-257-to-999
      - id: fallback-bound-257-to-999
      - id: variable-bound-1000-to-1024

  - id: shell-var-repeat-257-to-1024
    desc: Shell repeats chars via 257-1024 variable
    platforms: [unix]
    for: [shell]
    conf: 0.94
    all:
      - id: shell-seq-var-repeat
      - id: variable-bound-257-to-1024
    near_bytes: 8192

  - id: shell-repeat-257-to-1024
    desc: Shell generates 257-1024 repeated characters
    platforms: [unix]
    for: [shell]
    conf: 0.95
    any:
      - id: shell-seq-repeat-257-to-999
      - id: shell-seq-repeat-1000-to-1024
      - id: shell-head-tr-repeat-257-to-1019
      - id: shell-var-repeat-257-to-1024

  - id: python-var-repeat-257-to-1024
    desc: Python repeats string via 257-1024 variable
    for: [python]
    conf: 0.94
    all:
      - id: operator-short-string-var-repeat
      - id: variable-bound-257-to-1024
    near_bytes: 8192

  - id: ruby-or-ps-var-repeat-257-to-1024
    desc: Ruby or PowerShell 257-1024 variable repeat
    for: [ruby, powershell]
    conf: 0.94
    all:
      - id: operator-short-string-var-repeat
      - id: variable-bound-257-to-1024
    near_bytes: 8192

  - id: python-repeat-257-to-1024
    desc: Python builds 257-1024 char repeated string
    for: [python]
    conf: 0.95
    any:
      - id: operator-string-repeat-257-to-999
      - id: operator-string-repeat-1000-to-1024
      - id: reverse-operator-string-repeat-257-to-1019
      - id: python-var-repeat-257-to-1024

  - id: go-var-repeat-257-to-1024
    desc: Go repeats literal via 257-1024 variable
    for: [go]
    conf: 0.94
    all:
      - id: go-short-string-var-repeat
      - id: variable-bound-257-to-1024
    near_bytes: 8192

  - id: go-repeat-257-to-1024
    desc: Go builds 257-1024 byte repeated buffer
    for: [go]
    conf: 0.95
    any:
      - id: go-repeat-257-to-999
      - id: go-repeat-1000-to-1024
      - id: go-var-repeat-257-to-1024

  - id: js-var-repeat-257-to-1024
    desc: JS repeats literal via 257-1024 variable
    for: [javascript, typescript]
    conf: 0.94
    all:
      - id: method-short-string-var-repeat
      - id: variable-bound-257-to-1024
    near_bytes: 8192

  - id: js-repeat-257-to-1024
    desc: JS builds 257-1024 char repeated string
    for: [javascript, typescript]
    conf: 0.95
    any:
      - id: method-string-repeat-257-to-999
      - id: method-string-repeat-1000-to-1024
      - id: js-var-repeat-257-to-1024

  - id: repeated-string-257-to-1024
    desc: Builds 257-1024 byte repeated-character string
    conf: 0.94
    any:
      - id: shell-repeat-257-to-1024
      - id: python-repeat-257-to-1024
      - id: ruby-or-ps-var-repeat-257-to-1024
      - id: go-repeat-257-to-1024
      - id: js-repeat-257-to-1024
      - id: operator-string-repeat-257-to-999
      - id: operator-string-repeat-1000-to-1024
      - id: method-string-repeat-257-to-999
      - id: method-string-repeat-1000-to-1024
      - id: php-or-c-repeat-257-to-999
