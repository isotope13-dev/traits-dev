defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.92
traits:
- id: python-join-with-decoder-call
  desc: Python join expression contains decoder call
  if:
    type: text
    regex: \.join\([^)\r\n]{0,60}(b64decode|b16decode|b32decode|unhexlify)\([^()\r\n]{0,40}\)
