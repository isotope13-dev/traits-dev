defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-hex-pack-decode
    desc: Decodes hex through Ruby pack
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call method: (identifier) @pack arguments: (argument_list (string (string_content) @format))
          (#eq? @pack "pack") (#eq? @format "H*"))
