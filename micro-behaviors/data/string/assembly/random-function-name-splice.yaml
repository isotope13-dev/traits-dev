# Generated source text gets a freshly random function name concatenated
# in ("function " + makeid(17) + ...), so each copy of the emitted script
# differs from the last.
traits:
  - id: random-function-name-spliced-into-code
    desc: Splices random function name into code
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '(\\x20|\s)function(\\x20|\s)[''"]\s*\+\s*\w+\(\s*(0x)?[0-9a-f]+\s*\)'
