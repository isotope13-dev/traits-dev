# Kotlin StringBuilder assembly. `appendLine("$k=$v")` builds a key=value text
# block — the shape of a dotenv/properties dump, but equally of ordinary log and
# report formatting, so it stays neutral here. Objectives that mean "environment
# dump" pair it with the environment source.
defaults:
  platforms: [unix, windows]
  for: [kotlin]
  crit: baseline
  conf: 0.9

traits:
  - id: kotlin-interpolated-key-value-append
    desc: Kotlin appends interpolated key=value line
    if:
      type: text
      regex: 'appendLine\([^)]{0,80}\$\w+=\$\w+'
