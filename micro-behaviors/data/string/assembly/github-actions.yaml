# Workflow expressions are expanded before the shell parses the run script.
# A step output alone does not establish untrusted input or command injection.
# Keep the interpolation observation without inferring an attacker objective.
# This is also the canonical home for the former gha-step-output-run rule:
# assignments and git/gh/cat commands do not establish who controls the output.
# Numeric, hash and filename outputs remain visible here without name allowlists.
defaults:
  platforms: [unix, windows]
  for: [github-actions]

traits:
  - id: gha-step-output-run-template
    desc: Step output interpolated into workflow run text
    crit: notable
    conf: 0.91
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\$\{\{\s*steps\.[\w-]+\.outputs\.[\w-]+\s*\}\}'

  # Both input spellings are expanded before the run interpreter sees the text.
  # Dispatchers may be authorized, and workflow_call inputs inherit their caller's
  # trust boundary. Interpolation alone establishes neither outside control nor
  # a shell interpreter. Relocated from metadata/build/ci/step/dispatch-input.yaml
  # and extended to the inputs.* spelling shared by dispatch and reusable flows.
  - id: gha-input-run-template
    desc: Workflow input interpolated into run text
    crit: notable
    conf: 0.96
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\$\{\{\s*(github\.event\.)?inputs\.[\w-]+\s*\}\}'
    unless:
      - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
      - id: metadata/build/ci/github-actions::action-testdata-path
