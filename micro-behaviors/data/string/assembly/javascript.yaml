defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  crit: notable
  conf: 0.9

traits:
  - id: js-charat-indexed-assignment
    desc: Assigns charAt output to computed property
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '\[\w+\]\s*=\s*\w+\.charAt\(\w+\)'

  - id: indexed-property-string-assembly
    desc: Indexed-value string assembly
    if:
      type: text
      regex: for\s*\([^)]{1,120}\)\s*\{[^{}]{0,120}\w+\s*\+=\s*this\[
