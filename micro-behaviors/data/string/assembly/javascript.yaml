defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  crit: notable
  conf: 0.9

traits:
  - id: js-charat-indexed-assignment
    desc: Assigns charAt output to computed property
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '\[\w+\]\s*=\s*\w+\.charAt\(\w+\)'

  - id: indexed-property-string-assembly
    desc: Indexed-value string assembly
    if:
      type: text
      regex: for\s*\([^)]{1,120}\)\s*\{[^{}]{0,120}\w+\s*\+=\s*this\[

  # Junk-interleaved string tables decoded by striding over them: the loop
  # advances two or more elements per step while accumulating one element
  # into the output string. The sibling above owns the `this[` shape; this
  # owns the strided-step shape whatever the receiver is.
  - id: strided-index-string-assembly
    desc: String assembly from strided array indices
    for: [javascript, html]
    if:
      type: text
      regex: 'for\([^)]{1,80}(\+=\s*2|=\w+\+2)\)[^{]{0,40}\{[^}]{0,160}\+=\s*\w+\['
