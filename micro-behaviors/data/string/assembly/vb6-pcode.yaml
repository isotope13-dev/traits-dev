defaults:
  platforms: [windows]
  for: [pe]

traits:
  # P-code for `For i = 0 To 25` followed by the conversion of `i + &H41`
  # to a one-character string. This is an alphabetic identifier generator;
  # higher-level rules must supply filesystem context before calling it a
  # drive walk.
  - id: vb6-pcode-a-z-character-loop
    desc: VB6 p-code generates A-Z characters
    crit: component
    conf: 0.96
    if:
      type: hex
      pattern: 'F4 00 04 ?? ?? F4 19 FE 63 ?? ?? ?? ?? [0-128] 6B ?? ?? F4 41 A9 E7 0B ?? ?? 04 00'
      section: .text
