defaults:
  platforms: [windows]
  for: [pe]

traits:
  # P-code for `For i = 0 To 25` followed by the conversion of `i + &H41`
  # to a one-character string via either `Chr$` (`0B ?? ?? 04 00`) or Variant
  # `Chr` (`04 ?? ?? 0A ?? ?? 08 00`). This is an alphabetic identifier
  # generator; higher-level rules must supply filesystem context before calling
  # it a drive walk.
  - id: vb6-pcode-a-z-character-loop
    desc: VB6 p-code generates A-Z characters
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 'F4 00 04 ?? ?? F4 19 FE 63 ?? ?? ?? ?? [0-128] 6B ?? ?? F4 41 A9 E7 (0B ?? ?? 04 00 | 04 ?? ?? 0A ?? ?? 08 00)'
      section: .text

  # P-code for repeated character-by-character string construction using
  # `LitI4 <ascii>; FLdRfVar <tmp>; ImpAdCallFPR4 <Chr>, 8; FLdRfVar <tmp>; ConcatVar <dst>`.
  - id: vb6-pcode-liti4-chr-concat-chain
    desc: VB6 p-code assembles string from character codes
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: 'F5 ?? 00 00 00 04 ?? ?? 0A ?? ?? 08 00 04 ?? ?? FB EF ?? ?? F5 ?? 00 00 00 04 ?? ?? 0A ?? ?? 08 00 04 ?? ?? FB EF ?? ??'
      section: .text
