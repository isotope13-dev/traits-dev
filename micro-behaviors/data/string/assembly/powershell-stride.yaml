defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: powershell-odd-character-decoder-loop
    desc: PowerShell loop assembles every second character
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule powershell_odd_character_decoder_loop {
          strings:
            $start = /\$\w{1,40}\s*=\s*1\s*;\s*do\s*\{\s*/ nocase
            $body = /\$\w{1,40}\s*\+=\s*\$\w{1,40}\[\$\w{1,40}\]\s*;\s*\$\w{1,40}\s*\+=\s*2\s*\}\s*until\s*\(/ nocase
          condition:
            for any i in (1..#start) : (
              for any j in (1..#body) : (@body[j] == @start[i]+!start[i])
            )
        }
