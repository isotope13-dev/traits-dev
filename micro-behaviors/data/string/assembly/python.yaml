defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: formatted-index-token-join
    desc: Formatted tokens joined with spaces
    crit: component
    conf: 0.96
    if:
      type: tree-sitter
      kind: assignment
      regex: '["'']\s+["'']\.join\s*\(\s*f["''].{0,48}\{.{1,20}\}.{0,48}\bfor\b'

  - id: four-digit-range-bound
    desc: Python range has a four-digit bound
    crit: component
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: '\brange\s*\(\s*[1-9][0-9]{3,}\s*\)'

composite_rules:
  - id: python-thousand-indexed-tokens
    desc: Builds thousands of formatted indexed tokens
    crit: notable
    conf: 0.98
    all:
      - id: formatted-index-token-join
      - id: four-digit-range-bound
    near_lines: 1
