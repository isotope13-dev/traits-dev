defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]

traits:
  - id: formatted-index-token-join
    desc: Formatted tokens joined with spaces
    conf: 0.96
    if:
      type: tree-sitter
      kind: assignment
      regex: '["'']\s+["'']\.join\s*\(\s*f["''].{0,48}\{.{1,20}\}.{0,48}\bfor\b'

  - id: python-thousand-indexed-tokens
    desc: Builds thousands of formatted indexed tokens
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: '["'']\s+["'']\.join\s*\(\s*f["''].{0,48}\bfor\s+\w+\s+in\s+range\s*\(\s*[1-9][0-9]{3,}'
