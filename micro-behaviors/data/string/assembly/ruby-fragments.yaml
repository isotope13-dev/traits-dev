defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-long-string-fragment-array
    desc: Long strings in a fragment array
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (assignment right: (array
          (string (string_content) @fragment))
          (#match? @fragment "^[A-Za-z0-9+/]{40,}=?=?$"))
