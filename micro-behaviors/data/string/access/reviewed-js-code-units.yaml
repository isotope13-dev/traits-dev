# Code-unit operations do not establish encoding direction or concealment.
defaults:
  platforms:
  - unix
  - windows
traits:
- id: js-charcode-length-modulo-index
  desc: charCodeAt index uses modulo of a length
  conf: 0.9
  if:
    type: text
    regex: (\.charCodeAt|\['charCodeAt'\])\s*\([^)]{0,120}%\s*[A-Za-z_$][\w$]*\.length\s*\)
  unless:
  - id: well-known/tool/development/agent/ai-cli/guangnao-agent::cli-banner
  - id: well-known/tool/development/agent/ai-cli/guangnao-agent::package-name
  for:
  - javascript
  - typescript
  - html
  crit: notable
- id: js-charcode-modulo-index
  desc: charCodeAt index contains a modulo expression
  conf: 0.92
  if:
    type: text
    regex: charCodeAt["'\]]{0,2}\([^)]{0,60}%\s*[A-Za-z_$][\w$]*(\.length)?\s*\)
  for:
  - javascript
  - typescript
  - html
  crit: notable
- id: js-xor-modulo-charcode-read
  desc: Modulo-indexed code-unit read used by XOR
  crit: notable
  conf: 0.85
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/tool/development/agent/ai-cli/guangnao-agent::cli-banner
  - id: well-known/tool/development/agent/ai-cli/guangnao-agent::package-name
  - id: well-known/app/media/docpro::mdland-api-xor-helper
  if:
    type: text
    regex: \^\s*[\w$]+\.charCodeAt\s*\(\s*[\w$]+\s*%\s*[\w$]+\.length
  for:
  - javascript
  - svg
  - html
