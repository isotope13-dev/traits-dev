defaults:
  platforms: [windows, unix]
  for: [pe, dll, csharp, powershell]

traits:
  # GetStringAsync is shared by HttpClient, distributed-cache extensions, and
  # other asynchronous string providers. The token alone identifies string
  # retrieval, not network communication; HTTP composites add the type anchor.
  - id: dotnet-getstringasync-token
    desc: .NET asynchronous string retrieval token
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell]
    if:
      type: text
      word: GetStringAsync
  - id: dotnet-getstringasync-call
    desc: Calls an asynchronous string retrieval method
    crit: notable
    conf: 0.95
    for: [csharp]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetStringAsync$'
  # CIL call records carry the fully qualified target, so this matches
  # String.Substring string slicing in compiled .NET binaries. The slice
  # bounds and data flow are established by consuming composites.
  - id: dotnet-string-substring-call
    desc: Calls .NET String.Substring
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: symbol
      kind: call
      exact: System.String.Substring

composite_rules:
  - id: dotnet-getstringasync-reference
    desc: Async string retrieval call or method token
    crit: notable
    conf: 0.9
    any:
      - id: dotnet-getstringasync-token
      - id: dotnet-getstringasync-call
