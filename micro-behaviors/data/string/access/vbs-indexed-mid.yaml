defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-mid-single-character
    desc: VBScript extracts one indexed Mid character
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bMid\(\w+,\s*[A-Za-z_]\w*,\s*1\)'

  - id: vbs-mid-variable-width
    desc: VBScript Mid uses variable index and width
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bMid\(\s*\w+,\s*[A-Za-z_]\w*,\s*[A-Za-z_]\w*\s*\)'

  # A bounded relation, without asserting variable aliasing or decoding.
  # Keep the arithmetic fragment within this substring observation.
  - id: vbs-mid-access-near-small-addition-inline
    desc: Indexed Mid near constant-step assignment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)Mid\(\w+,\s*[A-Za-z_]\w*,\s*\w+\).{0,160}\w+\s*=\s*\w+\s*\+\s*[2-9]'

  # The length-bounded walk is the ordinary way BASIC/VBScript iterates a
  # string character by character (paired with Mid$); neutral capability.
  - id: vbs-length-bounded-char-loop
    desc: Iterates string characters to the string length
    crit: notable
    conf: 0.9
    for: [vbs, text, static-lib]
    if:
      type: text
      regex: '(?i)for [A-Za-z_]+=1 to len\('

  - id: vbs-variable-constant-step-addition
    desc: Small constant increment assignment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*\+\s*[2-9]\b'

composite_rules:
  - id: vbs-mid-multiline-stride-walk
    desc: Indexed Mid near constant step across lines
    crit: notable
    conf: 0.92
    near_lines: 20
    all:
      - id: vbs-variable-constant-step-addition
    any:
      - id: vbs-mid-variable-width
      - id: vbs-mid-single-character

  - id: vbs-mid-access-near-small-addition
    desc: Indexed Mid near constant-step assignment
    crit: notable
    conf: 0.92
    any:
      - id: vbs-mid-access-near-small-addition-inline
      - id: vbs-mid-multiline-stride-walk
