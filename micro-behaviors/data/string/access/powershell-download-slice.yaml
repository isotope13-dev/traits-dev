# Co-occurrence only: no claim that downloaded content is sliced.
defaults:
  platforms:
  - unix
  - windows
  for:
  - powershell
  crit: notable
  conf: 0.97
traits:
- id: powershell-download-near-string-slice
  desc: PowerShell download near string index/slice
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)\.Download(Data|String)\s*\([^)]{0,240}\)[\s\S]{0,600}\.(IndexOf|Substring)\s*\(
  unless:
  - id: well-known/tool/offensive/invoke-obfuscation::obfuscation-module-functions-a
  - id: well-known/tool/offensive/invoke-obfuscation::obfuscation-module-functions-b
