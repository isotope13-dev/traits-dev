defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: char-at-right-shift-two
    desc: Character lookup uses index shifted two bits
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments (binary_expression
            operator: ">>" right: (number) @bits))) @lookup
          (#eq? @method "charAt")
          (#eq? @bits "2"))
