# Neutral observations relocated during release-diff triage.
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  crit: notable
traits:
- id: php-table-indexed-substring-offset
  desc: PHP substring offset indexes a numeric table
  conf: 0.93
  if:
    type: tree-sitter
    kind: call
    regex: substr\s*\(\s*\$\w{1,20}\s*,\s*\$\w{1,20}\[\d
- id: php-large-prefix-extraction
  desc: PHP extracts a 100-plus-character prefix
  conf: 0.85
  unless:
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  if:
    type: tree-sitter
    kind: call
    regex: \bsubstr\s*\(\s*\$\w+\s*,\s*0\s*,\s*[1-9]\d{2,}\b
