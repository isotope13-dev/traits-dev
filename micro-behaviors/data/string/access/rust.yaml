defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  # These method names do not identify their receiver. Keep them as generic
  # string-access components; clipboard composites add the Clipboard type
  # context needed to infer an OS clipboard operation.
  - id: rust-text-getter-call
    desc: Calls Rust text getter method
    crit: component
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((get_text)|(get_contents))$'

  - id: rust-text-setter-call
    desc: Calls Rust text setter method
    crit: component
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((set_text)|(set_contents))$'
