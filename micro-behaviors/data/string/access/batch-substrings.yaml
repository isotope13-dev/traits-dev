defaults:
  platforms:
  - unix
  - windows
  for:
  - batch
traits:
- id: batch-long-name-delayed-substring
  desc: Batch long-name delayed substring expressions
  crit: notable
  conf: 0.94
  count_min: 10
  if:
    type: text
    regex: '![A-Za-z0-9_]{6,}:~[0-9]+,[0-9]+!'
  unless:
  - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch
- id: batch-short-name-delayed-substring
  desc: Batch short-name delayed substring expressions
  crit: notable
  conf: 0.93
  count_min: 30
  if:
    type: text
    regex: '![A-Za-z0-9_]{2,5}:~[0-9]+,[0-9]+!'
  unless:
  - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch
