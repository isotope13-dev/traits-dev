defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: js-two-character-token-before-array-loop
    desc: Extracts two-char tokens before array loop
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\w+\.substr\(\w+,2\);for\(\w+=0;\w+<\w+\.length;\w+\+\+\)'
