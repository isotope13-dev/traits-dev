defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: js-codepoint-at
  desc: JavaScript reads a string Unicode code point
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: (^|\.)codePointAt$
- id: js-substring-call
  desc: JavaScript substring or slice call
  crit: baseline
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: (^|\.)?(substring|substr|slice)$
- id: js-short-fixed-prefix-removal
  desc: Removes a short fixed string prefix
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \.(slice|substring|substr)\s*\(\s*([1-9]|[12][0-9]|3[0-2])\s*\)
- id: js-charat-lookup
  desc: JavaScript string character lookup
  crit: baseline
  conf: 0.82
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\.charAt\s*\(
- id: js-repeated-charat-calls
  desc: Repeated JavaScript charAt calls
  crit: notable
  conf: 0.9
  size_max: 200000
  count_min: 10
  per_kb_min: 0.5
  if:
    type: text
    regex: \.charAt\([^)]{0,120}\)[^}]{0,120}\.charAt\([^)]{0,120}\)
  unless:
  - id: well-known/lib/development/google-diff-match-patch/
  - id: metadata/package/files/dependency::node-modules-path
- id: javascript-unshift-pop-rotation-text
  desc: Array unshift receives a pop call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b[A-Za-z_$][\w$]*\.unshift\([A-Za-z_$][\w$]*\.pop\(\)\)'
- id: javascript-conditional-index-return-text
  desc: Returns a conditionally indexed value
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'return\s+\w+\[\w+[<>][^\]\n]{0,90}\?[^\]\n]{0,100}:[^\]\n]{0,100}\]'
- id: js-uppercase-marker-prefix-check
  desc: String prefix check against uppercase marker
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\.startsWith\(["''][_A-Z0-9]{4,24}["'']\)'
- id: js-uppercase-marker-suffix-check
  desc: String suffix check against uppercase marker
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\.endsWith\(["''][_A-Z0-9]{4,24}["'']\)'
