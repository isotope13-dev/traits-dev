# A later Substring on an unrelated filename is not slicing downloaded data.
# Require the download invocation to be the Substring receiver. The legacy
# powershell-delimited-remote-payload regex only established nearby calls.
defaults:
  platforms: [linux, macos, windows]
  for: [powershell]
  crit: notable
  conf: 0.97
traits:
  - id: powershell-http-response-substring
    desc: Slices an HTTP response string
    if:
      type: tree-sitter
      query: |
        (invokation_expression
          (invokation_expression
            (member_name) @download)
          (member_name) @slice
          (#match? @download "(?i)^DownloadString$")
          (#match? @slice "(?i)^Substring$"))
