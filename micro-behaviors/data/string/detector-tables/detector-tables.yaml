# Detector-table exceptions moved from guardrail.yaml. This directory holds only
# these four exceptions, so a directory reference counts once in suppression
# limits. Sibling trait legs stay in the search directory and are qualified.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, go, source, text]

composite_rules:
  - id: labeled-regex-scanner-table
    desc: Labeled regex table used to scan text
    crit: exception
    for: [javascript]
    all:
      - id: micro-behaviors/data/string/search::labeled-regex-entry
      - id: micro-behaviors/data/string/search::matched-entry-regex
  # Both field annotations on the same entries: a table of threat signatures
  # typed by matching strategy and triage level, i.e. detector plumbing.
  - id: typed-threat-signature-table
    desc: Detector table pairs classes with severities
    crit: exception
    conf: 0.94
    near_bytes: 200
    all:
      - id: micro-behaviors/data/string/search::detector-class-annotation
      - id: metadata/lang/source/syntax/rule-field::repeated-string-severity-fields

  # The same detector plumbing without a `detector:` strategy field: entries
  # that bind a regex-literal pattern field to a triage severity (tool- or
  # prompt-injection scanners, WAF and lint rule sets). Either field alone is
  # ordinary code, and the pairing does not prove defense — but a table of
  # pattern→severity entries labels its own matchers, which attack prose does
  # not do. Order-independent: the severity may precede or follow the pattern
  # field. Like typed-threat-signature-table, this downgrades override-phrase
  # claims on scanner plumbing; the embedded phrase observations themselves
  # stay notable.
  - id: regex-severity-detector-table
    desc: Detector table pairs regex patterns with severities
    crit: exception
    conf: 0.93
    near_bytes: 400
    all:
      - id: metadata/lang/source/syntax/rule-field::regex-pattern-rule-field
      - id: metadata/lang/source/syntax/rule-field::repeated-string-severity-fields

  # Scoring-based threat detection tables pairing categories with numeric scores.
  - id: scored-threat-signature-table
    desc: Detector table pairs categories with scores
    crit: exception
    conf: 0.94
    near_bytes: 200
    all:
      - id: micro-behaviors/data/string/search::prompt-injection-category-entry
      - id: micro-behaviors/data/string/search::threat-pattern-score-annotation
