# A guard that refuses to store credentials tests text against a list of
# secret shapes and returns the name of the first one it finds
# (`if (/AKIA[0-9A-Z]{16}/.test(t)) return "AWS access key";`). The token
# regexes are there to detect and block secrets, not to collect them.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 5000000

traits:
  - id: secret-scanner-label-return-table
    desc: Secret-shape tests returning a credential label
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '\.test\(\w+\)\) return "[A-Z][A-Za-z -]{3,40}"'
