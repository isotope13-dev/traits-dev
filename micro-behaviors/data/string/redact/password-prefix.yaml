defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: password-mask-retains-prefix
    desc: Password masking retains a value prefix
    conf: 0.97
    # A password branch returns a nonempty input slice plus a mask. This
    # observes partial masking, without asserting collection or transmission.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((if_statement
          condition: (_) @condition
          consequence: (statement_block
            (if_statement consequence: (return_statement
              (binary_expression
                left: (call_expression
                  function: (member_expression property: (property_identifier) @slice)
                  arguments: (arguments (number) @zero (number) @length))
                operator: "+"
                right: (string (string_fragment) @mask)))))) @capture
          (#match? @condition "(?i)[\"']password[\"']")
          (#eq? @slice "slice")
          (#eq? @zero "0")
          (#match? @length "^[1-9][0-9]?$" )
          (#match? @mask "^\\*{2,}$"))
