defaults:
  crit: baseline
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: tolower
    desc: Convert character to lowercase
    conf: 0.90
    for: [c, cpp, pe, dll]
    if:
      type: symbol
      kind: call
      exact: "tolower"
  - id: ascii-case-fold-lookup-table
    desc: ASCII case-fold lookup table
    conf: 0.75
    for: [pe]
    if:
      type: text
      exact: '!"#$%&''()*+,-./0123456789:;<=>?@abcdefghijklmnopqrstuvwxyz[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
    unless:
      - id: well-known/lib/ui/jline::jline-native-dll-basename
      - id: well-known/lib/ui/jline::jline-native-jni-exports

  - id: ctype-class-test-call
    desc: Calls a ctype character-class test
    platforms: [unix, windows]
    crit: notable
    conf: 0.85
    for: [c, cpp, text]
    if:
      type: text
      # No leading \b: projects wrap these as `vsf_sysutil_isspace`, and an
      # underscore is a word character, so a boundary anchor never matches the
      # wrapped form -- which is the form that actually appears.
      regex: 'is(space|alpha|digit)\w{0,4}\s*\('
