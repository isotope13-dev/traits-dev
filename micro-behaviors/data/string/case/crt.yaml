defaults:
  crit: baseline
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: tolower
    desc: Convert character to lowercase
    conf: 0.90
    for: [c, cpp, pe, dll]
    if:
      type: symbol
      kind: call
      exact: "tolower"
  - id: ascii-case-fold-lookup-table
    desc: ASCII case-fold lookup table
    conf: 0.75
    for: [pe]
    if:
      type: text
      exact: '!"#$%&''()*+,-./0123456789:;<=>?@abcdefghijklmnopqrstuvwxyz[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
    unless:
      - id: well-known/lib/ui/jline::jline-native-dll-basename
      - id: well-known/lib/ui/jline::jline-native-jni-exports
