# Source-level string letter-case transforms (upcase/downcase/toUpper/toLower).
# This was filed under communications/dns/label as `source-dns-case-transform`,
# but the matcher only detects a case-transform call -- any program that
# normalizes a header value or a display label fires it, with no DNS label in
# sight. The DNS-tunnel meaning lives in the composite that references this
# atom alongside a resolver call, an LSB mask, and a credential path.
defaults:
  platforms: [windows, unix]
  for: [source]
  crit: notable
  conf: 0.9

traits:
  - id: source-case-transform
    desc: Source changes string letter casing
    if:
      type: text
      regex: '(?i)\b(toUpper|toLower|toUpperCase|toLowerCase|toupper|tolower|upcase|downcase)\b'
  - id: javascript-conditional-case-transform
    desc: Conditional upper/lower casing
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\?\s*[\w\[\]]+\.toUpperCase\(\)\s*:\s*[\w\[\]]+\.toLowerCase\(\)'
  - id: kotlin-char-case-transform
    desc: Kotlin references Char case-conversion methods
    crit: notable
    conf: 0.95
    for: [kotlin]
    if:
      type: text
      regex: '(?i)\b(uppercaseChar|lowercaseChar)\b'
