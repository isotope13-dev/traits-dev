defaults:
  platforms: [windows]
traits:
  - id: vbs-asc-mid-char-code
    desc: Reads a character code from a slice
    for: [javascript, text, vbs, static-lib, html]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Asc(Mid("

  - id: vbs-asc-mid-large-fixed-offset
    desc: Char code read at large fixed offset
    for: [vbs]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bAsc\s*\(\s*Mid\s*\(\s*\w+\s*,\s*\d{4,}\s*,\s*1\s*\)\s*\)'

  - id: vbs-mid-chrw-cooccurrence
    desc: VBScript Mid near ChrW call text
    for: [vbs, mp3]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bMid\s*\([\s\S]{0,600}\bChrW\s*\('
