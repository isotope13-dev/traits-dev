defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: filtered-eval-string-conversion
    desc: Filters string form of evaluated expression
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'eval\([^;]{0,100}\.replace\([^;]{0,60}\)\)\.toString\(\)\.replace'
