traits:
  - id: charcode-near-base64-buffer-helpers
    desc: Character conversion near Base64/buffer helpers
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: from(CodePoint|CharCode).{0,40}(atob|Buffer\.from)
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/pdfjs::pdfjs-bundle
      - id: well-known/lib/format/pdfjs::pdfjs-pdfworker-class
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
      - id: micro-behaviors/data/encode/base64::js-base64url-alphabet-restore
      - type: text
        substr: fromCharCode(parseInt
