# Adding or subtracting a constant from a character code (`Asc(c) - 3`) is a
# Caesar-style shift; it is also how digits and case are converted, so it is
# only a building block.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.85

traits:
  - id: vb-asc-constant-shift
    desc: Shifts a character code by a constant
    if:
      type: text
      regex: '(?i)\bAscW?\s*\(\s*\w+\s*\)\s*[-+]\s*\d{1,3}\s*\)'

  - id: vb-mid-statement-reverse-copy
    desc: Copies characters in reverse with Mid$
    if:
      type: text
      regex: '(?i)\bMid\$?\s*\(\s*\w+\s*,\s*\w+\s*,\s*1\s*\)\s*=\s*Mid\$?\s*\(\s*\w+\s*,\s*\w+\s*-\s*\w+'
