# Neutral evidence; neither repetition nor conversion proves decoding.
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: character-code-conversion-cluster
  desc: Repeated charCodeAt near fromCharCode arguments
  crit: notable
  conf: 0.84
  size_min: 8192
  count_min: 3
  if:
    type: text
    regex: String\.fromCharCode\s*\([^;\n]{0,120}\.charCodeAt\s*\(
  unless:
  - id: metadata/build/
  - id: well-known/lib/network/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
