traits:
- id: python-empty-str-conversion
  desc: Python string conversion returns empty text
  conf: 0.9
  if:
    type: tree-sitter
    language: python
    query: "(function_definition\n name: (identifier) @method\n body: (block (return_statement (string) @empty))\n\
      \ (#eq? @method \"__str__\")\n (#match? @empty \"^(''|\\\"\\\")$\"))"
- id: python-empty-repr-conversion
  desc: Python repr conversion returns empty text
  conf: 0.9
  if:
    type: tree-sitter
    language: python
    query: "(function_definition\n name: (identifier) @method\n body: (block (return_statement (string) @empty))\n\
      \ (#eq? @method \"__repr__\")\n (#match? @empty \"^(''|\\\"\\\")$\"))"
composite_rules:
- id: python-empty-str-and-repr
  desc: Python string and repr conversions return empty
  conf: 0.95
  all:
  - id: micro-behaviors/data/string/conversion::python-empty-str-conversion
  - id: micro-behaviors/data/string/conversion::python-empty-repr-conversion
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
