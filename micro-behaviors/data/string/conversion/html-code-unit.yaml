defaults:
  platforms: [linux, macos, windows]
  for: [html, scala, elixir]
traits:
- id: charcodeat-text-expression
  desc: Source contains a charCodeAt expression
  crit: notable
  conf: 0.78
  if:
    type: text
    substr: charCodeAt(
- id: fromcharcode-text-reference
  desc: Source text references fromCharCode
  crit: notable
  conf: 0.78
  # oledoc: Outlook .msg / legacy Office bodies carry embedded HTML whose
  # script cleave reads as the container's own text runs. The atom stays
  # notable; the sealed-container hostile composite that consumes it
  # (objectives/anti-static/obfuscation/payload/container::noncode-container-selfdecoding-script)
  # supplies the "no reason for script to be here" context.
  for: [html, scala, elixir, oledoc]
  if:
    type: text
    substr: fromCharCode
