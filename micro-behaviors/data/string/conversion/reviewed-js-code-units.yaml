# Code-unit operations do not establish encoding direction or concealment.
defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: charcode-xor-character-reconstruction
  desc: Reconstructs characters from charCodeAt XOR
  conf: 0.9
  for:
  - javascript
  - html
  any:
  - id: micro-behaviors/data/string/conversion::js-fromcharcode-xor-result
  - id: micro-behaviors/data/string/conversion::js-fromcharcode-xor-result-computed-access
  crit: notable
- id: js-repeating-key-xor-character-reconstruction
  desc: Character reconstruction beside modulo-indexed code units
  conf: 0.9
  for:
  - javascript
  - html
  all:
  - id: micro-behaviors/data/string/conversion::charcode-xor-character-reconstruction
  any:
  - id: micro-behaviors/data/string/access::js-charcode-length-modulo-index
  - id: micro-behaviors/data/string/access::js-charcode-modulo-index
  near_bytes: 160
  crit: notable
traits:
- id: js-xor-character-code
  desc: Converts XOR result into a character
  conf: 0.97
  if:
    type: tree-sitter
    language: javascript
    query: "(call_expression\n  function: (member_expression\n    object: (identifier) @obj\n    property: (property_identifier) @fn)\n  arguments: (arguments [\n    (binary_expression operator: \"^\")\n    (parenthesized_expression (binary_expression operator: \"^\"))\n  ])\n  (#eq? @obj \"String\")\n  (#eq? @fn \"fromCharCode\"))\n"
  for:
  - javascript
  - typescript
  crit: notable
- id: js-xor-character-call
  desc: Calls fromCharCode with an XOR expression
  crit: notable
  conf: 0.95
  for:
  - javascript
  if:
    type: tree-sitter
    query: "((call_expression\n  function: (member_expression property: (property_identifier) @p)\n  (#eq? @p \"fromCharCode\")\n  arguments: (arguments\n    (binary_expression operator: \"^\")\n  )\n))\n"
  unless:
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/file/magic/identity::macho-32
  - id: metadata/file/magic/identity::macho-64
  - type: text
    substr: fpdf.org/en/script/script37.php
  - type: basename
    exact: carrotsearch.foamtree.js
