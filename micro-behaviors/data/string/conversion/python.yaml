defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.86

traits:
  - id: python-bytes-string-conversion
    desc: Python bytes/string encoding conversion
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bbytes\(.{0,40}\)\.decode\(|\bstr\(.{0,40}\)\.encode\('

  - id: python-chr-call
    desc: Python chr() character conversion
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      language: python
      kind: call
      regex: '\bchr\s*\('
    unless:
      # VS Code extensions may embed Python source for language/tooling
      # detection inside JavaScript template literals; that is not executed
      # Python in the extension bundle.
      - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: python-chr-loop-string-builder
    crit: notable
    desc: Python builds string from char codes
    if:
      type: text
      regex: 'for\s+\w+\s+in\s+\w+[\w\s,()''"]{0,40}:[\s\S]{0,240}\.append\(\s*chr\('
  - id: ascii-decode-call
    desc: Decodes bytes as ASCII
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: decode('ascii')
    unless:
    - type: text
      substr: start.decode('ascii').encode
