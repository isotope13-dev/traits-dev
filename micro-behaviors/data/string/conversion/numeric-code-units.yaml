defaults:
  platforms: [unix, windows]
traits:
  - id: fromcharcode-numeric-sequence
    desc: Rebuilds string from numeric character codes
    crit: notable
    conf: 0.96
    for: [javascript, typescript, html, json, text]
    # Covers executable JavaScript serialized inside a remote JSON record as
    # well as ordinary source. A long numeric argument sequence is structural
    # encoding evidence; it does not depend on prose or a campaign-specific
    # URL hidden by the character codes.
    if:
      type: text
      regex: 'String\.fromCharCode\(\s*[0-9]{1,3}(\s*,\s*[0-9]{1,3}){11,}\s*\)'
