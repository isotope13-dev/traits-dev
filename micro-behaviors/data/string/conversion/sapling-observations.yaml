# Original matchers and effective scopes are retained.
defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
traits:
- size_max: 5000000
  id: rust-output-stdout-lossy-utf8-string
  desc: Rust output.stdout lossy UTF-8 conversion
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: String::from_utf8_lossy(&output.stdout).to_string()
- size_max: 5000000
  id: rust-output-stderr-lossy-utf8-string
  desc: Rust output.stderr lossy UTF-8 conversion
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: String::from_utf8_lossy(&output.stderr).to_string()
