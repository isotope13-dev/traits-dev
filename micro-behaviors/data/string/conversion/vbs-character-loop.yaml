defaults:
  platforms: [windows]
  # Self-decoding VBS viruses (Repulik) keep raw control bytes in the encoded
  # string literal, so the file sniffs as opaque `data` rather than `vbs`.
  for: [vbs, html, data]

traits:
  - id: vbs-string-character-code-loop
    desc: VB string loop with character-code references
    crit: notable
    conf: 0.9
    if:
      # raw, not text: in `data`-typed files the extracted string list drops
      # the short Asc/Chr lines, so only the file bytes carry the loop.
      type: raw
      regex: '(?is)\bfor\b[^\n]{0,30}\bto\s+len\s*\(.{0,60}\basc\s*\(\s*mid\s*\(.{0,80}\bchr\s*\('
    unless:
      - type: path
        basename: true
        regex: '(?i)\.br?s$'
