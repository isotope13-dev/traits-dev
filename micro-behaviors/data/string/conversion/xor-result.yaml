defaults:
  for: [html, javascript]
  platforms: [unix, windows]
traits:
  - id: js-fromcharcode-xor-result
    desc: Constructs characters from charCodeAt XOR
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fromCharCode\s*\([^)]{0,120}charCodeAt\s*\([^)]{0,40}\)\s*\^'
    not:
      - substr: 'n.generate(g,v)'
      - substr: 'String.fromCharCode(y.charCodeAt(c)^b.charCodeAt(c))'
      - regex: 'PSS signature verification|Encoded message does not end in 0xBC|Inconsistent parameters to PSS'
    unless:
      - id: well-known/app/security/bitwarden::bitwarden-extension-script
      - id: well-known/lib/crypto/node-forge::node-forge-crypto-library
  - id: js-fromcharcode-xor-result-computed-access
    desc: Computed-access character construction from XOR
    # Same reconstruction as js-fromcharcode-xor-result, reached through
    # bracket property access (x["String"]["fromCharCode"](y["charCodeAt"](i)
    # ^ k)) so the bare fromCharCode(/charCodeAt( spellings never appear.
    # This atom claims character construction, not a transform direction.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\["fromCharCode"\]\s*\([\s\S]{0,160}\["charCodeAt"\]\s*\([^)]{0,60}\)\s*\^'
    unless:
      - id: well-known/app/security/bitwarden::bitwarden-extension-script
      - id: well-known/lib/crypto/node-forge::node-forge-crypto-library
