defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-shifted-pipeline-character
    desc: Casts offset pipeline element to character
    if:
      type: text
      regex: '(?i)\[char\]\s*\(\s*\$_\s*[-+]\s*(0x[\da-f]+|\d+|\$[\w.:]+)\s*\)'

composite_rules:
  - id: powershell-transformed-character
    desc: PowerShell transforms an element into a character
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::powershell-scalar-bxor-char
      - id: powershell-shifted-pipeline-character
