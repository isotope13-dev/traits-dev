# Raw source reference, including quoted examples; no execution or decoding claim.
defaults:
  for: [vbs, asp]
  platforms: [windows]
traits:
  - id: vb-chr-function-reference
    desc: VB Chr-family function-name reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bChr[W$]?[ \t]*\('
