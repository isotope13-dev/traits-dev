# Pairing the i-th character with the (i + half)-th re-interleaves a string
# whose two halves were split apart: a transposition decoder.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.88

traits:
  - id: vb-mid-half-offset-interleave
    desc: Interleaves characters from two string halves
    if:
      type: text
      regex: '(?i)\bMid\s*\(\w+,\s*\w+,\s*1\)\s*&\s*Mid\s*\(\w+,\s*\w+\s*\+\s*\w+,\s*1\)'
