defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: repeated-hex-fromcharcode
    desc: Repeated hexadecimal fromCharCode calls
    crit: notable
    conf: 0.8
    count_min: 3
    per_kb_min: 0.2
    if:
      type: text
      regex: 'fromCharCode\s*\(\s*0x[0-9a-fA-F]+'
