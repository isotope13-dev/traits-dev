# JavaScript string/number conversion calls
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: js-parseint
    desc: parseInt call
    crit: baseline
    if:
      type: string_literal
      regex: parseInt\s*\(
  - id: js-fromcharcode-alias
    desc: Aliases String.fromCharCode conversion function
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (
          [
            (variable_declarator name: (identifier)
              value: (member_expression object: (identifier) @obj
                property: (property_identifier) @prop))
            (assignment_expression left: (identifier)
              right: (member_expression object: (identifier) @obj
                property: (property_identifier) @prop))
          ] @alias
          (#eq? @obj "String")
          (#eq? @prop "fromCharCode")
        )
  - id: keyboard-event-code-to-character
    desc: Converts keyboard event code to character
    crit: notable
    conf: 0.93
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'fromCharCode\s*\(\s*\w{1,24}\.(keyCode|charCode|which)\s*\)'
  - id: tostring-call
    desc: Calls JavaScript toString conversion method
    crit: baseline
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)toString$'
  - id: from-str-method-call
    desc: Calls a method named from_str
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.from_str$'
  - id: from-str-no-argument-call
    desc: Calls from_str with no arguments
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.from_str\(\s*\)'
