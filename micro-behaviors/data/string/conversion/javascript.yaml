# JavaScript string/number conversion calls
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: js-parseint
    desc: parseInt call
    crit: baseline
    if:
      type: string_literal
      regex: parseInt\s*\(
  - id: js-fromcharcode-alias
    desc: Aliases String.fromCharCode conversion function
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*=\s*String\.fromCharCode\b'
  - id: from-str-method-call
    desc: Calls a method named from_str
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.from_str$'
  - id: from-str-no-argument-call
    desc: Calls from_str with no arguments
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.from_str\(\s*\)'
