defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-join-map-chr
    desc: Builds string via ''.join(map(chr, ...))
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "join\\s*\\(\\s*map\\s*\\(\\s*chr\\s*,"
  - id: python-join-chr-generator
    desc: Builds string from chr() codepoints
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'join\s*\(\s*(\[\s*)?chr\s*\(\s*\w+\s*\)\s+for\s+\w+\s+in'
