# The tag name "script" (or "head") spelled as character codes so that a
# createElement / getElementsByTagName call never names it in clear text.
traits:
  - id: charcode-spelled-script-tag-name
    desc: Character codes spell the script tag name
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '\((0x73,\s*0x63,\s*0x72,\s*0x69,\s*0x70,\s*0x74|115,\s*99,\s*114,\s*105,\s*112,\s*116)\)'
