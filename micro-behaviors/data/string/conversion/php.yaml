# PHP String Conversion Capabilities
defaults:
  crit: notable
  conf: 0.65
  platforms: [windows, unix]
  mbc: C0000
  for: [php]
traits:
  - id: chr-call
    desc: Converts a character code with PHP chr()
    if:
      type: symbol
      kind: call
      exact: "chr"
  - id: ord-call
    desc: PHP ord() character-to-code conversion
    if:
      type: symbol
      kind: call
      exact: "ord"
composite_rules:
  - id: chr-ord
    desc: Character code manipulation
    any:
      - id: chr-call
      - id: ord-call
