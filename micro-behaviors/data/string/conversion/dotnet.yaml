defaults:
  platforms: [windows, unix]
  for: [pe, dll]
traits:
  # Convert.ToByte/ToInt32 cover the two radix-16 string-to-byte overloads
  # used by manual hex decoders (Convert.ToByte(pair, 16) and its
  # (byte)ToInt32 idiom). The radix argument is established by consuming
  # composites, not by this call observation alone.
  - id: cil-convert-tobyte-or-int32-call
    desc: Calls .NET Convert.ToByte or Convert.ToInt32
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^System\.Convert\.To(Byte|Int32)$'
