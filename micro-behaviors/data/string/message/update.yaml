# Program text claims an update is being installed; UI display is not required.
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: vb6-microsoft-update-lure
  desc: Microsoft update installation text
  crit: notable
  conf: 0.9
  for:
  - pe
  - static-lib
  - dll
  if:
    type: text
    regex: (?i)Installing Microsoft Update
