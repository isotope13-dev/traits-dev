# Perl locates a marker with index() and carves the remainder with substr().
# Dead-drop stagers split their fetched blob at an embedded marker and keep
# the tail; ordinary string handling rarely pairs the two calls with shared
# variables in one short span.
defaults:
  platforms: [windows, unix]
  for: [perl]
  crit: notable
  conf: 0.9

traits:
  - id: perl-index-marker-substring
    desc: Perl carves a payload at a marker
    if:
      type: text
      regex: 'index\(\s*\$\w+\s*,\s*\$\w+[\s\S]{0,120}substr\(\s*\$\w+'
