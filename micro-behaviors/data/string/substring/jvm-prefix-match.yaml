defaults:
  for: [class, java_class]
  platforms: [windows, unix]
traits:
  - id: jvm-multiple-zero-four-substrings
    desc: Two JVM substring calls with zero/four bounds
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule jvm_multiple_zero_four_substrings {
          strings:
            $name = "substring"
            $signature = "(II)Ljava/lang/String;"
            $call = { 03 07 B6 ?? ?? }
          condition:
            $name and $signature and #call >= 2 and
            for any i in (1..#call) : (
              for any j in (1..#call) : (
                @call[j] > @call[i] and @call[j] - @call[i] < 256 and
                uint16(@call[j]+3) == uint16(@call[i]+3)
              )
            )
        }
