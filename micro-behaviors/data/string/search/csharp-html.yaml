defaults:
  platforms: [windows, unix]
  for: [csharp]
traits:
  - id: dotnet-html-comment-capture
    desc: Regex.Match captures an HTML comment body
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Regex\.Match$'
      arg:
        index: 1
        kind: string
        regex: '^<!--\(\.[*+]\??\)-->$'
