defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-includes-indexof-call
    desc: Searches strings with includes or indexOf
    crit: baseline
    conf: 0.82
    if:
      type: text
      regex: '\b(includes|indexOf)\s*\('

  # Relocated from micro-behaviors/data/source/unsafe, where it was called
  # "Calls an object exec method" and graded notable. `x.exec(...)` is
  # RegExp.prototype.exec — the ordinary pattern-match call every regex-driven
  # parser makes (moment.js date parsing, Sizzle selector matching). The
  # URLPattern out-of-bounds composite in objectives/execution/exploit/memory
  # references it for the `urlpattern.exec()` step; the exploit context comes
  # from its sibling legs, not from this call.
  - id: js-exec-match-call
    desc: Matches a string with RegExp exec
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.exec$'
