defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-includes-indexof-call
    desc: Searches strings with includes or indexOf
    crit: baseline
    conf: 0.82
    if:
      type: text
      regex: '\b(includes|indexOf)\s*\('

  - id: js-alphabet-indexof-lookup
    desc: Searches an inline alphabet table
    crit: notable
    conf: 0.95
    if:
      type: text
      # This proves a string search, not decoding by itself. Decoder
      # composites add the character reconstruction operations separately.
      regex: '["''][A-Za-z0-9+/=_-]{16,}["'']\.indexOf\s*\('

  - id: js-includes-token-literal
    desc: includes() searches for token literal
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)includes$'
      arg:
        kind: string
        exact: token

  - id: js-includes-cookie-literal
    desc: includes() searches for cookie literal
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)includes$'
      arg:
        kind: string
        exact: cookie

  # Relocated from micro-behaviors/data/source/unsafe, where it was called
  # "Calls an object exec method" and graded notable. `x.exec(...)` is
  # RegExp.prototype.exec — the ordinary pattern-match call every regex-driven
  # parser makes (moment.js date parsing, Sizzle selector matching). The
  # URLPattern out-of-bounds composite in objectives/execution/exploit/memory
  # references it for the `urlpattern.exec()` step; the exploit context comes
  # from its sibling legs, not from this call.
  - id: js-exec-match-call
    desc: Matches a string with RegExp exec
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.exec$'

  - id: node-pub-suffix-check
    desc: Node checks for .pub string suffix
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)endsWith$'
      arg:
        kind: string
        exact: .pub
