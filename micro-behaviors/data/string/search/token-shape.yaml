# Search patterns that hunt for bearer credentials inside a byte blob.
#
# These match a regex *source* the code carries, not a token itself. A
# character class spelled `eyJ[A-Za-z0-9...]` only appears in code looking for
# compact JWS tokens, and `Bearer` immediately followed by a character class
# only appears in code extracting an Authorization header value. Both survive
# a rewrite into another language: the quantifier (`{16,}` vs `{20,}`) and the
# regex delimiters change, the character class does not.
#
# Neutral on their own -- secret scanners, credential-hygiene tooling and
# gateway middleware carry the same patterns. Credential-access and
# exfiltration composites supply intent by pairing them with the buffer the
# search runs over.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
  crit: notable
  conf: 0.92

traits:
  - id: jwt-compact-regex
    desc: Search pattern for compact JWS tokens
    # Previously python-only, with a regex that spelled out one sample's exact
    # segment layout. The technique is language-neutral (shell `grep -oE`, Go
    # `regexp.MustCompile`, a Rust `Regex::new`), so the matcher is too.
    if:
      type: text
      regex: 'eyJ\[A-Za-z0-9[^\]]{0,16}\]'

  - id: bearer-token-capture-regex
    desc: Search pattern for Authorization Bearer values
    # Catches the variants that are not JWTs -- opaque OAuth bearers, session
    # tokens, vault-minted service credentials -- which a JWS-shaped pattern
    # alone would miss.
    conf: 0.9
    if:
      type: text
      regex: 'Bearer[^\r\n]{0,12}\[A-Za-z0-9'

composite_rules:
  - id: bearer-credential-search-pattern
    desc: Carries a bearer-credential search pattern
    crit: notable
    conf: 0.92
    any:
      - id: jwt-compact-regex
      - id: bearer-token-capture-regex
