defaults:
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: rust-microphone-substring-search
    desc: Rust substring search for microphone
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)contains$'
      arg:
        kind: string
        exact: microphone
