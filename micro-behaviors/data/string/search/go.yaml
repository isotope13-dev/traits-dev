defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-credential-keyword-contains
    desc: Go string search for credential-related keywords
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'strings\.(Contains|ContainsAny)\([^)]{0,400}(token|secret|password|api[-_]?key|auth)'
      case_insensitive: true
  - id: go-credential-keyword-prefix
    desc: Go credential keyword prefix comparison
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'strings\.(HasPrefix|EqualFold)\([^)]{0,220}"(token|secret|password|api[-_]?key|auth)'
      case_insensitive: true
  - id: go-uppercase-credential-keyword
    desc: Go uppercase credential keyword comparison
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'ToUpper\([^)]{1,80}\),\s*"(PASSWORD|SECRET|TOKEN|KEY|CREDENTIAL|AUTH)"'
composite_rules:
  - id: go-credential-keyword-filter
    desc: Go filters strings against credential-related keywords
    crit: notable
    conf: 0.92
    any:
      - id: go-credential-keyword-contains
      - id: go-credential-keyword-prefix
      - id: go-uppercase-credential-keyword
