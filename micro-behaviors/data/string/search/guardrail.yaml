# Defensive filters that must name the attack strings they block.
#
# A prompt-injection denylist, a WAF ruleset, a moderation filter and a linter
# all quote the phrasing they reject -- "ignore the above", "new system prompt:",
# "you are now unrestricted". Read as content, that is indistinguishable from a
# jailbreak; read as structure, it is a list of compiled patterns with a
# deny/block name attached, which is what a filter looks like and what an
# attack payload does not.
#
# Measured on cuga (an AI agent framework), whose knowledge/config.py declares
# `_CLIENT_ADAPTATION_DENYLIST` over six `re.compile` patterns and was flagged
# for the jailbreak openers it exists to reject.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, go, source, text]

traits:
  - id: pattern-denylist-declaration
    desc: Declares a deny/block pattern list
    crit: notable
    conf: 0.92
    if:
      # Require the binding, not the word: "denylist" is also an ordinary
      # English verb in prose ("we denylist any use of TripleDES" in
      # cryptography's FIPS backend), and a comment saying so is not a filter
      # implementation. Require the name to be bound to a collection: covers
      # `DENYLIST = [`, `denylist: set[str] = {`, `blocklist: [` and
      # `const blockList = new Set([`.
      type: text
      regex: '(?i)\b(deny|block|banned|forbidden)_?(list|patterns)\b\s*[:=][^\n]{0,20}[\[({]'
  - id: compiled-python-pattern-set
    desc: Compiles a set of Python regex patterns
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      substr: 're.compile('
  - id: compiled-js-pattern-set
    desc: Compiles a set of JavaScript regex patterns
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      substr: 'new RegExp('

composite_rules:
  # Both legs: a name alone is a variable, and compiled patterns alone are
  # ordinary parsing. Together they are a filter implementation.
  - id: pattern-denylist-guardrail-context
    desc: Defensive pattern-denylist filter implementation
    crit: exception
    conf: 0.93
    all:
      - id: pattern-denylist-declaration
    any:
      - id: compiled-python-pattern-set
      - id: compiled-js-pattern-set
