# Compare each candidate against a NUL-terminated needle, advancing the
# candidate after a mismatch. This is a utility routine, not malware identity.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-naive-substring-search
    desc: x86 bytewise NUL-terminated substring search
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 44 24 ?? 53 8A 18 84 DB 74 ?? 8B D0 2B 54 24 ?? 8B 4C 24 ?? 84 DB 74 ?? 8A 19 84 DB 74 ?? 38 1C 0A 75 ?? 41 80 3C 0A 00 75 ?? 80 39 00 74 ?? 40 8A 18 42 84 DB 75 ?? 33 C0 5B C3'
