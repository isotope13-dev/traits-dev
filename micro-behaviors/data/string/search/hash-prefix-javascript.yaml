defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: hash-input-hex-prefix-check
  desc: Hash input checked for fixed hex prefix
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (hash|digest)[A-Za-z0-9_$]*\.startsWith\("[0-9A-Fa-f]{5,}"\)
- id: checksum-hex-prefix-check
  desc: Checksum checked for fixed hex prefix
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (checksum|fingerprint)[A-Za-z0-9_$]*\.startsWith\("[0-9A-Fa-f]{5,}"\)
composite_rules:
- id: hash-or-checksum-hex-prefix-check
  desc: Hash or checksum fixed-hex prefix check
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/string/search::hash-input-hex-prefix-check
  - id: micro-behaviors/data/string/search::checksum-hex-prefix-check
