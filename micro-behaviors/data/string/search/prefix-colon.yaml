defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go]

traits:
  # `update:` is generic framework/protocol vocabulary. It becomes remote
  # tasking evidence only when several command-oriented prefixes occur
  # together in the C2 composite that references this component.
  - id: update-colon-prefix-check
    desc: Checks string for update colon prefix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.(startswith|startsWith)\s*\(\s*["'']update:["'']\s*\)'

  - id: exec-colon-prefix-check
    desc: Checks for an exec command prefix
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.startswith$'
      arg:
        index: 0
        exact: 'exec:'
