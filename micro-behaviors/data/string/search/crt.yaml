defaults:
  crit: baseline
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: strchr
    desc: Find character in string
    conf: 0.90
    if:
      type: symbol
      exact: "strchr"
  - id: strstr
    desc: Find substring
    conf: 0.90
    if:
      type: symbol
      exact: "strstr"
  - id: strstr-source-call
    desc: Find substring in C or C++ source
    conf: 0.90
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: "strstr"
