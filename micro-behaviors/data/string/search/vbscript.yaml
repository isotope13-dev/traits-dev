# VBScript delimiter-search + slice idiom.
#
# Relocated from objectives/anti-static/obfuscation/string/anomaly, where it
# was named "VBScript remaps an encoded alphabet" and graded `suspicious`.
# The matcher only sees `InStr(...)` followed by `Mid(` on the same line: the
# textbook way to find a separator and take the substring after it. Microsoft's
# OffScrub Office-removal script does it to split a product name at the dot.
# Custom-alphabet decoders happen to use the same idiom, but the alphabet
# evidence lives in the sibling character-range loops, not here.
defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: instr-offset-substring-slice
    desc: VBScript slices string at InStr offset
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bInStr\s*\([^\r\n]{0,120}\bMid\s*\('
