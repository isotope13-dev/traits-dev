defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.99

traits:
- id: titus-secret-scan-implementation
  desc: Titus secret-scanning implementation functions
  if:
    type: text
    regex: 'github\.com[/_]praetorian[-_]inc[/_]titus[/_]pkg[/_]scanner'
- id: kingfisher-secret-pattern-corpus
  desc: Embedded Kingfisher secret-search pattern corpus
  if:
    type: text
    regex: 'kingfisher\.[a-z0-9_.-]+'
