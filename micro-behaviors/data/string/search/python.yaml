defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: regex-map-findall-loop
    desc: Iterates regex map with findall
    if:
      type: text
      regex: '(?s)\.(items|values)\(\)\s*:.{0,200}\.findall\s*\('

  - id: jwt-compact-regex
    desc: JWT compact-token regex
    if:
      type: text
      regex: 'eyJ.{0,40}\[A-Za-z0-9_-\].{0,80}\\\.{0,40}\[A-Za-z0-9_-\].{0,80}\\\.'
