defaults:
  platforms: [android, linux, windows]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.9

traits:
  - id: java-pattern-compile-matcher
    desc: Compiles Java regex pattern and matcher
    if:
      type: text
      regex: 'Pattern\.compile\([^)]{0,100}\)[\s\S]{0,250}\.matcher\('

  - id: indexof-lookup
    desc: IndexOf lookup in string
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\.indexOf\(\s*[\w.]+\s*\)'

  - id: indexof-offset-lookup
    desc: Offset indexOf lookup in string
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\.indexOf\(\s*[\w.]+\s*,'

  - id: substring-slice
    desc: Substring slice on string
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\.substring\s*\('

composite_rules:
  - id: indexof-offset-substring-slice
    desc: Java slices string at indexOf offsets
    crit: baseline
    conf: 0.9
    near_bytes: 700
    all:
      - id: indexof-lookup
      - id: indexof-offset-lookup
      - id: substring-slice
