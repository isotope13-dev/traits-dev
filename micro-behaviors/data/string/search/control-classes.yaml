defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, yaml]

traits:
  - id: atomic-empty-branch-boundary-contradiction
    desc: Atomic regex with impossible boundary suffix
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\(\?>[^{}]{0,768}\{[^{}]{1,80}\}\|\)\\{1,4}b\\{1,4}B'

  - id: adjacent-control-byte-regex-classes
    desc: Adjacent regex classes start with controls
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(\]\[[\x00-\x0f][^{}]{1,128}){3}'
