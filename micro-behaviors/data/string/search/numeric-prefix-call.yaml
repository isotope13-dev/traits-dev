defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
- id: numeric-prefix-22-27-or-51-55
  desc: Checks numeric prefixes 22–27 or 51–55
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: '(^|\.)startsWith$'
    arg:
      index: 0
      kind: string
      regex: '^(5[1-5]|2[2-7])$'
