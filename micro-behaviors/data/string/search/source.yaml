defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: native-buffer-cmp-call
    desc: Native buffer comparison call
    if:
      type: text
      regex: '\b[A-Za-z_]*cmp\s*\([^;\n]{0,120}\b(packet|payload|buf\w*)\b'

  - id: native-string-search-call
    desc: Calls a native string-search API
    if:
      type: symbol
      kind: call
      regex: '^(strchr|strrchr|strstr|strpbrk|strspn|strcspn|strtok|strtok_r)$'

composite_rules:
  - id: native-buffer-string-compare
    desc: Native buffer string comparison
    crit: notable
    conf: 0.9
    any:
      - id: native-buffer-cmp-call
      - id: native-string-search-call
