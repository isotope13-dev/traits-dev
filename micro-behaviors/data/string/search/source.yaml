defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: native-buffer-cmp-call
    desc: Native buffer comparison call
    if:
      type: text
      regex: '\b[A-Za-z_]*cmp\s*\([^;\n]{0,120}\b(packet|payload|buf\w*)\b'

  - id: native-buffer-string-search
    desc: Native buffer string search call
    if:
      type: text
      regex: '\bstr[A-Za-z_]{2,}\s*\([^;\n]{0,120}\b(packet|payload|buf\w*)\b'

composite_rules:
  - id: native-buffer-string-compare
    desc: Native buffer string comparison
    crit: notable
    conf: 0.9
    any:
      - id: native-buffer-cmp-call
      - id: native-buffer-string-search
