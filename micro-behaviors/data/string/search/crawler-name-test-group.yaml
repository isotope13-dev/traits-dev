defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
composite_rules:
  - id: crawler-or-automation-name-test
    desc: Tests a crawler or automation name pattern
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/string/search::js-crawler-user-agent-test
      - id: micro-behaviors/data/string/search::js-automation-user-agent-test
      - id: micro-behaviors/data/string/search::php-crawler-user-agent-test
      - id: micro-behaviors/data/string/search::php-automation-user-agent-test
