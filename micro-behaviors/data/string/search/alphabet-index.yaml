defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.95

traits:
  - id: incrementing-character-index-lookup
    desc: Looks up successive characters with indexOf
    if:
      type: text
      regex: '\.indexOf\(\s*[A-Za-z_$][\w$]*\.charAt\(\s*[A-Za-z_$][\w$]*\+\+'

