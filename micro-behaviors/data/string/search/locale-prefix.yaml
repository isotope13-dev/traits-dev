defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.95
traits:
  - id: javascript-ru-prefix-comparison
    desc: Tests literal ru string prefix
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startsWith$'
      arg: {index: 0, kind: string, exact: ru}
  - id: javascript-be-prefix-comparison
    desc: Tests literal be string prefix
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startsWith$'
      arg: {index: 0, kind: string, exact: be}
  - id: javascript-kk-prefix-comparison
    desc: Tests literal kk string prefix
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startsWith$'
      arg: {index: 0, kind: string, exact: kk}
