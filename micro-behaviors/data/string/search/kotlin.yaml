defaults:
  platforms: [windows, unix, routeros]
  for: [java, kotlin]

traits:
  # Keyword filters are also used defensively to reject sensitive fields.
  # Credential-access intent comes from a composite that adds a data source.
  - id: jvm-credential-keyword-filter
    desc: JVM searches password and passphrase keywords
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'contains\("password"\)[\s\S]{0,100}contains\("passphrase"\)'
