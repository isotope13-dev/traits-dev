defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - ruby
traits:
- id: dot-separator-join
  desc: Joins values with a dot separator
  crit: notable
  conf: 0.5
  if:
    type: text
    exclude_comments: true
    regex: '["'']\.["'']\.join\(|\.join\(["'']\.["'']\)'
