defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-user-variable-substring-exclusion
    desc: Tests substring absence in a user-named variable
    conf: 0.88
    if:
      type: text
      regex: '["''][^"''\r\n]{1,40}["'']\s+not\s+in\s+(username|user)\b'
