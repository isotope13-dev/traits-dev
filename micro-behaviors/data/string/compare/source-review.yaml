# Neutral observations relocated from attack and product-identity rules.
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-printable-ascii-range-test
  desc: Tests ASCII character range bounds
  crit: notable
  conf: 0.7
  if:
    type: tree-sitter
    query: |
      (comparison_operator
        (integer) @min
        (identifier)
        (integer) @max
        (#eq? @min "32")
        (#match? @max "^12[67]$")
      )
