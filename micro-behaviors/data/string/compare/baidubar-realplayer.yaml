defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: playerproperty-build-comparison
  desc: Compares RealPlayer product build threshold
  if:
    type: text
    regex: PlayerProperty\("PRODUCTVERSION"\)\s*<=\s*"6\.0\.14\.[0-9]+"
  crit: notable
  conf: 0.98
  for:
  - javascript
  - html
  - text
- id: percent-player-version-comparison
  desc: Escaped RealPlayer version comparison
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: PlayerProperty%28%22PRODUCTVERSION%22%29%3C%3D%22[0-9%a-fA-F]+
