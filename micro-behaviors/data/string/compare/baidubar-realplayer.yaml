defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: playerproperty-build-comparison
  desc: Compares RealPlayer product build threshold
  if:
    type: yara
    source: |
      rule realplayer_build_comparison_forms {
        strings:
          $plain = /PlayerProperty\("PRODUCTVERSION"\)\s*<=\s*"6\.0\.14\.[0-9]+"/
          $octal = /\\120\\154\\141\\171\\145\\162\\120\\162\\157\\160\\145\\162\\164\\171\\50\\42\\120\\122\\117\\104\\125\\103\\124\\126\\105\\122\\123\\111\\117\\116\\42\\51\\74\\75\\42\\66\\56\\60\\56\\61\\64\\56/
        condition:
          any of them
      }
  crit: notable
  conf: 0.98
  for:
  - javascript
  - html
  - text
- id: percent-player-version-comparison
  desc: Escaped RealPlayer version comparison
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: PlayerProperty%28%22PRODUCTVERSION%22%29%3C%3D%22[0-9%a-fA-F]+
