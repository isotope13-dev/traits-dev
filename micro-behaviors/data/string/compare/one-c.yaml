defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: one-c-marked-report-guard
    desc: Disables modification of marked report source
    if:
      type: text
      case_insensitive: true
      regex: 'find\(TargetText\.GetLine\(y\), Label\) > 0 then\s*Action = "No";'

