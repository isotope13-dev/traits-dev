defaults:
  crit: baseline
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: strcmp
    desc: String comparison
    conf: 0.90
    for: [c, cpp, elf, macho, pe, dll]
    platforms: [unix, windows]
    if:
      type: symbol
      exact: "strcmp"
  - id: strncmp
    desc: Limited string comparison
    conf: 0.90
    for: [c, cpp, elf, macho, pe, dll]
    platforms: [unix, windows]
    if:
      type: symbol
      exact: "strncmp"
  - id: wcscmp
    desc: Wide string comparison
    conf: 0.90
    if:
      type: symbol
      exact: "wcscmp"
  - id: literal-string-comparison
    desc: Compares an input against a string literal
    crit: baseline
    conf: 0.85
    for: [c, cpp, text]
    platforms: [unix]
    if:
      type: text
      regex: '\bstr(n|case)?cmp\s*\(\s*[A-Za-z_][\w>.\[\]-]{0,40}\s*,\s*"[^"\n]{2,40}"'
composite_rules:
  - id: c-string-comparison
    desc: Uses C runtime string comparison
    conf: 0.9
    for: [c, cpp, elf, macho, pe, dll]
    platforms: [unix, windows]
    any:
      - id: strcmp
      - id: strncmp
