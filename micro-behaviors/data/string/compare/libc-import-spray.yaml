# An obfuscator that fills a pointer table imports string and time
# routines it never calls. Requiring the three together keeps a lone
# strcoll import from looking like that spray.
defaults:
  platforms: [macos]
  for: [macho]
  crit: baseline
  conf: 0.9

traits:
  - id: macho-import-strcoll
    desc: Mach-O imports strcoll
    if:
      type: symbol
      kind: import
      exact: strcoll
  - id: macho-import-mbstowcs
    desc: Mach-O imports mbstowcs
    if:
      type: symbol
      kind: import
      exact: mbstowcs
  - id: macho-import-tmpnam
    desc: Mach-O imports tmpnam
    if:
      type: symbol
      kind: import
      exact: tmpnam

composite_rules:
  - id: macho-libc-string-time-spray
    desc: Mach-O imports strcoll, mbstowcs, and tmpnam
    crit: notable
    all:
      - id: macho-import-strcoll
      - id: macho-import-mbstowcs
      - id: macho-import-tmpnam
