defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: python-trimmed-string-empty-check
    desc: Checks a trimmed Python string for emptiness
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (not_operator
          argument: (call
            function: (attribute attribute: (identifier) @method)
            arguments: (argument_list) @args)
          (#eq? @method "strip")
          (#eq? @args "()")) @check
