defaults:
  platforms: [windows]
  for: [html, javascript]
# The required observation is a string-version comparison, rather than a
# product-name reference. Keep the split property-name spelling and scopes.
traits:
  - id: realplayer-product-version-comparison
    desc: Compares split RealPlayer product version
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'PlayerProperty\(["'']PRODUCTV["'']\s*\+\s*["'']ERSION["'']\)<="\d\.\d'
