defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - python
  - powershell
  crit: notable
  conf: 0.97
traits:
- id: hex-suffix-comparison
  desc: Checks a hexadecimal string suffix
  for: [csharp, python]
  if:
    type: symbol
    kind: call
    regex: (?i)\.endswith$
    arg:
      index: 0
      kind: string
      regex: (?i)^0x[0-9a-f]{2,8}$
- id: powershell-hex-suffix-comparison
  desc: PowerShell checks a hexadecimal string suffix
  for: [powershell]
  if:
    type: tree-sitter
    query: |
      (invokation_expression
        (member_name) @method
        (argument_list) @suffix
        (#match? @method "(?i)^EndsWith$")
        (#match? @suffix "(?i)^\\(\\s*['\"]0x[0-9a-f]{2,8}['\"]\\s*\\)$"))
composite_rules:
- id: hexadecimal-suffix-test
  desc: Tests a string for a hexadecimal suffix
  any:
  - id: hex-suffix-comparison
  - id: powershell-hex-suffix-comparison
