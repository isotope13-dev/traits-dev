defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - python
  crit: notable
  conf: 0.97
traits:
- id: hex-suffix-comparison
  desc: Checks a hexadecimal string suffix
  if:
    type: symbol
    kind: call
    regex: (?i)\.endswith$
    arg:
      index: 0
      kind: string
      regex: (?i)^0x[0-9a-f]{2,8}$
