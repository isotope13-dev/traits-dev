# VBA that keeps its strings in UserForm control properties.
#
# A macro's literals are the first thing an analyst or a YARA rule reads, so
# maldoc builders move them into the form designer instead: ComboBox items,
# Caption and Tag values, Label text. The module then reads them back at run
# time and the code itself contains no URL, ProgID or command -- only dozens
# of `UserForm2.ComboBox27` reads. The count is the signal; one form read is
# ordinary UI code, forty is a string table.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027
  mbc: B0032

traits:
  - id: vba-userform-property-string-stash
    desc: Macro reads many UserForm control values
    crit: suspicious
    conf: 0.9
    count_min: 20
    if:
      type: text
      regex: 'UserForm\d{1,3}\.\w{1,32}'

  # `CallByName(obj, "Run", VbMethod)` is ordinary late binding. With the
  # member name supplied as a variable, the method being invoked is not in the
  # file at all -- it arrives from wherever the strings are stashed.
  - id: vba-callbyname-variable-member
    desc: Late-bound call with a variable member name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)CallByName\s*\(\s*[\w.]{1,40},\s*[\w.]{1,40},\s*Vb(Method|Get)'
