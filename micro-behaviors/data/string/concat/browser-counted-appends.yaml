defaults:
  for:
  - html
  - javascript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.96
traits:
- id: four-variable-append-statements
  desc: Four variable append statements
  count_min: 4
  if:
    type: text
    regex: \w+\s*\+=\s*\w+\s*;
- id: counted-loop-at-least-32
  desc: Counted loop bound exceeds 31
  if:
    type: text
    regex: for\s*\([^;]{1,40};[^;]{1,30}<=?\s*(3[2-9]|[4-9][0-9])\s*;
