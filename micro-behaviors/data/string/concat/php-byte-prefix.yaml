defaults:
  platforms: [unix, windows]
  for: [python, javascript, php, pe, elf]
traits:
  # Also used in PDF encryption Perms records; no network meaning by itself.
  - id: php-four-ff-chr-prefix
    desc: Concatenates four 0xFF bytes with chr()
    crit: notable
    if:
      type: text
      regex: chr\(255\)(\s*\.\s*chr\(255\)){3}
