# Character-at-a-time string assembly in a loop: `out += arr[i]`,
# `out += s.charAt(i)`, `out = out + arr[i]`. Neutral by itself — CSS.escape,
# tokenizers and formatters all build strings this way — but it is also the
# tail of a char-by-char decoder, so the count/density floors and the
# `unless:` list below keep the sparse benign spellings out.
#
# Relocated from micro-behaviors/data/encode/skip-step/, which named a
# technique (take every Nth character) that none of these matchers look for.
defaults:
  platforms: [windows, unix]

traits:
  - id: js-loop-string-concat
    desc: String concatenation in loop body using array
    crit: baseline
    conf: 0.6
    for: [javascript, typescript]
    size_max: 500000
    unless:
      - type: basename
        regex: \.js\.map$
      - id: metadata/library/structure::js-large-module-bundle
    if:
      type: text
      regex: '[\w$]+\s*=\s*[\w$]+\s*\+\s*[\w$]+\s*\[[^\]]{1,120}\]'
  - id: js-loop-string-plus-equals
    desc: Builds a string from array elements
    crit: notable
    conf: 0.6
    for: [javascript, typescript]
    size_max: 500000
    # Density floor, not just a raw count: a real char-by-char string decoder
    # is dense, whereas normal libraries (e.g. moment.js: 2 hits in ~25 KB =
    # 0.08/KB) have a couple of incidental `x += y[i]` lines. Requiring both a
    # count floor and density keeps the obfuscation signal without flagging
    # sparse benign usage.
    per_kb_min: 0.2
    if:
      type: text
      regex: '(for|while)\s*\([^)]{0,200}\)[\s\S]{0,300}[\w$]+\s*\+=\s*[\w$]+\s*\[[^\]]{1,120}\]'
    unless:
      - type: text
        regex: '[\w$]+\s*\+=\s*arguments\s*\['
      - id: metadata/file/format/structured::sourcemap-sources-content
      - type: basename
        regex: ^jsbn(-combined|2)?\.js$|run-script-os[\\/]index\.js$
      - type: basename
        regex: node_modules[\\/]ipv6[\\/]
      - id: well-known/app/ai/coding-agent/tabby::tabby-builtin-plugin-dist-path
      - id: metadata/library/structure::js-large-module-bundle
      - id: well-known/lib/ui/popper::popper-js-v1-banner
      - type: text
        regex: "\\bdot\\s*\\+=\\s*a\\[i\\]\\s*\\*\\s*b\\[i\\]"
  - id: js-loop-string-charat
    desc: Appends a character returned by charAt()
    crit: notable
    conf: 0.6
    for: [javascript, typescript]
    size_max: 500000
    # The index must be a variable or index arithmetic (i, i+1, 2*i, idx++) —
    # the shape a char-by-char decoder walks a string with. A call-valued index
    # is the random-string/ID/token generator idiom (`charAt(randomInt(0,n))`,
    # `charAt(secureRand(n))`); the `Math.floor(Math.random()` spelling of it
    # already had an `unless:` below, but generators that wrap randomness in a
    # helper slipped through.
    if:
      type: text
      regex: '[\w$]+\s*\+=\s*[\w$]+\.charAt\(\s*[\w$]+\s*[-+*)]'
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: well-known/lib/ui/jquery-ui::jquery-ui-version-banner
      - type: text
        regex: 'charAt\(Math\.floor\([^)]{0,40}Math\.random\(\)'
composite_rules:
  - id: js-loop-string-concat-any
    desc: String concatenation in loop body using array
    crit: notable
    conf: 0.6
    any:
      - id: js-loop-string-concat
      - id: js-loop-string-plus-equals
      - id: js-loop-string-charat
