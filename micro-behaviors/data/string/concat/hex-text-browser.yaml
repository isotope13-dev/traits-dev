defaults:
  for: [html, javascript, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: hex-text-padded-block-double
    desc: Hex-text padded block doubling
    if:
      type: text
      exclude_html_comments: true
      regex: "(?i)626c6f636b[\\s\"S=+]*2b626c6f636b2b66696c6c626c6f636b"
  - id: hex-text-newline-buffer-fill
    desc: Hex-text repeated newline buffer fill
    if:
      type: text
      exclude_html_comments: true
      regex: "(?i)2b3d225c7830615c7830[\\s\"S=+]*615c7830615c783061"
