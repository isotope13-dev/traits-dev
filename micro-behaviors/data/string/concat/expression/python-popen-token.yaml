# Reconstructing a function-name token is not itself command execution.
# Preserve the original textual predicate; the HTTP-service composite adds
# its independent handler, input, and output evidence.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-popen-token-concatenation
    desc: Python string expression reconstructs popen
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '["'']po["'']\s*\+\s*["'']pen["'']'
