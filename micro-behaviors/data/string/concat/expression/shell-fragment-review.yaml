defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: sh-char-split-concatenation
    desc: Word split into single-character fragments
    crit: suspicious
    conf: 0.9
    count_min: 3
    per_kb_min: 0.5
    if:
      type: text
      regex: '["''][A-Za-z0-9]["'']["''][A-Za-z0-9]["'']'
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
  - id: sh-inline-char-split
    desc: Shell word uses interleaved quoted characters
    crit: notable
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ((concatenation) @word
          (#match? @word "[A-Za-z]\"[A-Za-z]\"[A-Za-z]"))
    not:
      - substr: shellcheck disable=SC2140
      - regex: Word is of the form
      - substr: github_git-l"f"s.list
      - substr: micro"soft"-prod.list
  - id: shell-adjacent-uppercase-variables
    desc: Adjacent uppercase shell variables
    crit: component
    conf: 0.9
    if:
      type: text
      regex: \$[A-Z][A-Z0-9_]{2,}\$[A-Z][A-Z0-9_]{2,}
