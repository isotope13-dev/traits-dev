defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-sequence-dot-concatenation"
    desc: "Lua joins sequence label and dotted suffix"
    crit: "notable"
    conf: 0.96
    if:
      type: tree-sitter
      language: lua
      query: |
        ((for_statement body: (block
          (variable_declaration (assignment_statement
            (variable_list (identifier) @label)
            (expression_list (binary_expression
              left: (function_call name: (dot_index_expression) @fmt
                arguments: (arguments (string) @seq (_)))
              operator: ".." right: (identifier)))))
          (variable_declaration (assignment_statement
            (expression_list (binary_expression
              left: (identifier) @used operator: ".."
              right: (binary_expression left: (string) @dot operator: "..")))))))
          (#eq? @label @used) (#eq? @fmt "string.format")
          (#match? @seq "%0[0-9]d") (#match? @dot "[\"']\\.[\"']"))
