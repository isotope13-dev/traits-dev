---
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
traits:
- id: shell-declared-helper-namespace
  desc: Declares shell helper functions under a prefix
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: 'declare -F\s+--\s*["'']\.[A-Za-z_][A-Za-z0-9_-]*\.\$\{?[A-Za-z0-9_]+[}]?'
- id: shell-namespaced-argument-dispatch
  desc: Dispatches shell arguments to a helper name
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^\s*\.[A-Za-z_][A-Za-z0-9_-]*\."\$@"'
- id: shell-namespaced-helper-definition
  desc: Defines a namespaced shell helper function
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^\s*\.[A-Za-z_][A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\s*\(\s*\)'

composite_rules:
- id: sh-reconstructed-command-clues
  desc: Shell command reconstruction clues
  crit: suspicious
  conf: 0.88
  size_max: 524288
  all:
  - id: metadata/lang/shebang::shell-script
  any:
  - id: micro-behaviors/data/string/concat/expression::sh-inline-char-split
  - id: micro-behaviors/data/string/concat/expression::sh-char-split-concatenation
  - id: metadata/lang/source/syntax/call/invocation::sh-reconstructed-command-target-shape
  unless:
  - id: metadata/lang/shebang::tcl-sh-reexec-header
  - id: micro-behaviors/data/string/assembly::sh-shell-template-context
  - id: micro-behaviors/data/string/assembly::shell-assignment-string-assembly
  - id: micro-behaviors/data/string/concat/expression::shell-adjacent-uppercase-variables
  - id: micro-behaviors/data/string/concat/expression::shell-namespaced-argument-dispatch-context

- id: shell-namespaced-argument-dispatch-context
  desc: Shell dispatches arguments to helper functions
  crit: exception
  conf: 0.99
  all:
  - id: metadata/lang/source/syntax/call/invocation::sh-reconstructed-command-target-shape
  - id: micro-behaviors/data/string/concat/expression::shell-declared-helper-namespace
  - id: micro-behaviors/data/string/concat/expression::shell-namespaced-argument-dispatch
  - id: micro-behaviors/data/string/concat/expression::shell-namespaced-helper-definition
