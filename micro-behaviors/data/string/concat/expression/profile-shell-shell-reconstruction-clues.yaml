---
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
composite_rules:
- id: sh-reconstructed-command-clues
  desc: Shell command reconstruction clues
  crit: suspicious
  conf: 0.88
  size_max: 524288
  all:
  - id: metadata/lang/shebang::shell-script
  any:
  - id: micro-behaviors/data/string/concat/expression::sh-inline-char-split
  - id: micro-behaviors/data/string/concat/expression::sh-char-split-concatenation
  - id: metadata/lang/source/syntax/call/invocation::sh-reconstructed-command-target-shape
  unless:
  - id: metadata/lang/shebang::tcl-sh-reexec-header
  - id: micro-behaviors/data/string/assembly::sh-shell-template-context
  - id: micro-behaviors/data/string/assembly::shell-assignment-string-assembly
  - id: micro-behaviors/data/string/concat/expression::shell-adjacent-uppercase-variables
