defaults:
  crit: component
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-dotted-fstring
    desc: Dotted Python f-string
    conf: 0.9
    if:
      type: text
      regex: 'f["''][^"''\n\s:]{0,40}\{[A-Za-z_]\w*\}\s*\.\s*(\{\w+\}|[\w-]+\.[\w.-]+)'
    not:
      - regex: 'f["'']\{header\}\s*\.\s*\{payload\}'
