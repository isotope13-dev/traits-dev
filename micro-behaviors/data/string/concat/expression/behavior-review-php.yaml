defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: php-literal-string-concatenation
    desc: PHP concatenates adjacent literal strings
    if:
      type: text
      regex: "(?m)^\\s*['\"][^'\"<>]{4,24}['\"]\\s*\\.\\s*['\"][^'\"<>]{4,24}['\"]\\s*;"
  - id: concat-bareword-fragments
    desc: Concat bareword string fragments
    crit: notable
    conf: 0.9
    size_max: 500000
    if:
      type: text
      regex: (?m)^[^\n/#*]{0,40}['"][^'"\s]{1,16}['"]\s*\.\s*(_[A-Za-z0-9]|[a-z])[A-Za-z0-9_]*\b
    unless:
      - id: well-known/lib/format/tcpdf::tcpdf-library-source
      - type: text
        regex: \$_(?:GET|POST|REQUEST|COOKIE)\s*\[[^\]]+\]\s*\.\s*["'][^"']+["']
      - type: text
        regex: '[''"][^''"\s]{1,16}[''"]\s*\.\s*[a-z_][A-Za-z0-9_]*\s*\('
      - type: text
        regex: '[''"][^''"\s]{1,16}[''"]\s*\.\s*(self|static|parent)::'
  - id: indexed-string-table
    desc: Indexed string table lookup
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: return\s+\$[a-z]{1,3}\s*\[\s*\$[a-z]{1,2}\s*\]\s*;
    unless:
      - id: well-known/lib/crypto/phpseclib
      - type: path
        regex: php-[0-9][^\\/]*[\\/].*tests[\\/].*\.phar([\\/!]|$)
