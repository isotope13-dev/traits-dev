---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: nonascii-literal-concatenation
  desc: Repeated non-ASCII string concatenation
  conf: 0.78
  for:
  - javascript
  - html
  count_min: 5
  per_kb_min: 0.3
  if:
    type: text
    regex: \+\s*["'][\p{L}--\p{ASCII}]{3,}["']
composite_rules:
- id: mixed-block-concatenation-profile
  desc: Mixed Unicode sequences near string concatenation
  conf: 0.94
  near_lines: 80
  all:
  - id: micro-behaviors/data/string/concat/expression::nonascii-literal-concatenation
  - id: metadata/lang/encoding/shape/high-bit::supplementary-devanagari-symbol-sequences
- id: international-literal-encoding-profile
  desc: International literals near escapes or mixed blocks
  conf: 0.88
  near_lines: 60
  all:
  - id: metadata/lang/source/literal/string/shape::dense-international-script-literals
  - id: micro-behaviors/data/string/concat/expression::nonascii-literal-concatenation
  any:
  - id: metadata/lang/encoding/unicode-escape::js-three-unicode-escapes
  - id: metadata/lang/encoding/shape/high-bit::supplementary-devanagari-symbol-sequences
