defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: hash-delimited-string-concat
    desc: Joins strings with a triple-hash delimiter
    crit: component
    conf: 0.85
    size_max: 5000
    if:
      type: tree-sitter
      kind: binary_op
      substr: '###'

  - id: python-dotted-fstring
    desc: Dotted Python f-string
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'f["''][^"''\n]{0,80}\{[A-Za-z_]\w*\}\s*\.\s*\{[A-Za-z_]\w*\}'
