defaults:
  crit: component
  platforms: [windows, unix]
  for: [python]

traits:
  - id: hash-delimited-string-concat
    desc: Joins strings with a triple-hash delimiter
    conf: 0.85
    size_max: 5000
    if:
      type: tree-sitter
      kind: binary_op
      substr: '###'

  # `f"{host}.{user}.vspc.example.com"` -- a name assembled from parts joined
  # by dots. Its one consumer is the DNS-label composite, so what matters is
  # that the dots are label separators.
  #
  # The literal prefix may not contain `:`, `/` or whitespace: those make it a
  # URL being formatted for display or an English message with a placeholder,
  # where the dots belong to a port, path, escape or title rather than a hostname.
  # Unsloth's studio server prints `f"http://localhost:{port}.{reset}"`, and mDNS
  # announcements format `f"sofabaton-x-server on {host}.{SERVICE_TYPE}"`.
  - id: python-dotted-fstring
    desc: Dotted Python f-string
    conf: 0.9
    if:
      type: text
      regex: 'f["''][^"''\n:/\s]{0,80}\{[A-Za-z_]\w*\}\s*\.\s*\{[A-Za-z_]\w*\}'
    not:
      - regex: 'f["'']\{header\}\s*\.\s*\{payload\}'
