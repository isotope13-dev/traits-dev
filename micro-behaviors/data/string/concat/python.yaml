defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: hash-delimited-string-concat
    desc: Joins strings with a triple-hash delimiter
    crit: component
    conf: 0.85
    size_max: 5000
    if:
      type: tree-sitter
      kind: binary_op
      substr: '###'

  # `f"{host}.{user}.vspc.example.com"` -- a name assembled from parts joined
  # by dots. Its one consumer is the DNS-label composite, so what matters is
  # that the dots are label separators.
  #
  # The literal prefix may not contain `:` or `/`: those make it a URL being
  # formatted for display, where the dots belong to a port, a path or a
  # trailing escape rather than to a hostname. Unsloth's studio server prints
  # `f"http://localhost:{port}.{reset}"` -- a warning message ending in an
  # ANSI colour reset -- which read as a dotted DNS label and, beside an
  # unrelated `socket.getaddrinfo("localhost", ...)` loopback probe, was
  # reported as a host-identity DNS beacon.
  - id: python-dotted-fstring
    desc: Dotted Python f-string
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'f["''][^"''\n:/]{0,80}\{[A-Za-z_]\w*\}\s*\.\s*\{[A-Za-z_]\w*\}'
