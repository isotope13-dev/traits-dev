defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: split-trycloudflare-host-fragment
    desc: Split trycloudflare host fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '.tryc" + "loud" + "flare'
  - id: split-epub-word-fragment
    desc: Concatenated epub word fragment
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '"ep" + "ub"'
