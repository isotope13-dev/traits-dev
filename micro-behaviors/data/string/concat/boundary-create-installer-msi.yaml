defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1105,T1218.007

  crit: notable
traits:
- id: js-split-msiexec-literal
  desc: JavaScript splits msiexec token
  conf: 0.95
  if:
    type: text
    regex: 'msi["'']\s*\+\s*["'']exec'
- id: js-split-msi-extension-literal
  desc: JavaScript splits MSI filename extension
  conf: 0.94
  if:
    type: text
    regex: '\.m["'']\s*\+\s*["'']si'
  # Same split-literal evasion for HTA-embedded script, where the executable
  # is assembled as "msiexec" + ".exe" so no single line names msiexec.exe.
