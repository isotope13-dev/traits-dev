# Go dotted-string assembly. `fmt.Sprintf` with a literal dot between two
# verbs is how Go code builds version strings, dotted filenames, and yes --
# DNS labels. The construction itself is neutral string mechanics; the DNS
# composites in micro-behaviors/communications/dns/label add the hostname and
# resolver context that make it label construction.
defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: go-dotted-format
    desc: Go Sprintf builds a dotted string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fmt\.Sprintf\s*\("[^"\n]{0,24}%[a-z][^"\n]{0,16}\.[^"\n]{0,16}%[a-z]'
