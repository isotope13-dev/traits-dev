# A VBScript builtin's name appended to a string as a bare literal.
#
# `x = x + "Replace"` is not how anyone calls Replace. It is how a script
# assembles the *text* of a call it will hand to `Execute`, so that the call
# itself never appears in the file:
#
#     Function ZIuB(a, b, c)
#       n = "ZIuB = "
#       n = n + "Replace"
#       n = n + "(a, b, c)"
#       execute(n)
#     End Function
#
# Every builtin the script needs gets a wrapper like this, and a reader -- or a
# signature -- looking for Replace, StrReverse or CreateObject finds nothing.
# Neutral here because concatenating a word is not itself a behaviour; the
# objective that references it supplies the evaluator.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: suspicious
  conf: 0.92
  attack: T1027

traits:
  - id: vbs-builtin-name-concatenated
    desc: VBScript builtin name appended as a literal
    if:
      type: text
      regex: '(?i)\+\s*"(Replace|StrReverse|InStr|CreateObject|Chr|Asc|Mid|Split|Join)"'
