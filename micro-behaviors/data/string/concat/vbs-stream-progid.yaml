defaults:
  for: [html, vbs]
  platforms: [windows]
traits:
  - id: vbs-four-variable-concatenation
    desc: Concatenates four VBScript variables
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\b\w+\s*=\s*\w+\s*&\s*\w+\s*&\s*\w+\s*&\s*\w+'
composite_rules:
  - id: vbs-split-adodb-stream-progid
    desc: ADODB fragments beside four-variable concat
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/property/assign::vbs-adodb-stream-fragment-assignments
      - id: vbs-four-variable-concatenation
    near_bytes: 200
