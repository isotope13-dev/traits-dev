defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: random-character-append
    desc: Appends random character
    if:
      type: text
      exclude_html_comments: true
      regex: "\\+=\\s*\\w+\\.charAt\\(Math\\.floor\\(Math\\.random\\(\\)"
  - id: at-sign-append
    desc: Appends at sign to string
    if:
      type: text
      exclude_html_comments: true
      regex: "\\b\\w+\\s*\\+=\\s*[\"\\x27]@[\"\\x27]"
