defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-indexed-foreach-join
    desc: Joins strings through array indexes
    if:
      type: text
      exclude_comments: true
      regex: '(?i)-join\s*\(\$\w+\s*\|\s*ForEach-Object\s*\{\s*\$\w+\[\$_\]\s*\}\s*\)'
