defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: join-short-string-argument
    desc: Join method with short string argument
    crit: baseline
    conf: 0.72
    if:
      type: text
      regex: \.join\s*\(\s*["'][^"']{0,2}["']\s*\)
  - id: join-indexed-separator
    desc: Join method with table-indexed separator
    crit: baseline
    conf: 0.72
    if:
      type: text
      regex: \.join\s*\(\s*\w+\s*\[\s*(0x[0-9a-fA-F]+|\d+)\s*\]\s*\)
