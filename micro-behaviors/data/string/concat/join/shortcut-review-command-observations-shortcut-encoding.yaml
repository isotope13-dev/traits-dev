---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: kv-powershell-string-array-join
  desc: LNK arguments join string array
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: '@\(\s*["''][^"'']{1,64}["'']\s*,\s*["''][^"'']{1,64}["'']\s*\)[^\r\n]{0,48}-join\b'
    case_insensitive: true
