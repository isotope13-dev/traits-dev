defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: join-empty-separator-call
    desc: Joins values without a separator
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '\.join$'
      arg:
        kind: string
        exact: ""

  - id: array-join-empty-separator-text
    desc: Array expression joined without separator
    crit: baseline
    conf: 0.78
    if:
      type: text
      regex: '\]\.join\(["'']["'']\)'

  # Narrower sibling of the broad array-join above: the array is an inline
  # literal of short quoted strings, the fragment-assembly shape string
  # obfuscation builds on. Ordinary uses (regex construction from readable
  # fragments) stay visible here as a neutral capability; obfuscation
  # composites reference this leg alongside their concealment evidence.
  - id: js-inline-string-array-join
    desc: Inline string array joined with empty separator
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[(["''][^"'']{1,30}["'']\s*,\s*){2,}["''][^"'']{1,30}["'']\s*\]\.join\(["'']{2}\)'

  - id: js-inline-array-join-oob-domain-fragment
    desc: Joined string array hides oob domain label
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[^\]]{0,240}["'']oob["''][^\]]{0,240}\]\.join\(["'']{2}\)'
    unless:
      - id: well-known/lib/ai/mathjax::mathjax-api-access
      - id: metadata/build/minifier::js-large-minified-bundle

  # Sibling of the empty-separator join above: pipe-style beacons join host
  # labels with dots before an oob.* collector suffix.
  - id: js-dot-joined-oob-dns-label-array
    desc: Dot-joined array hides OOB DNS suffix
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[^\]]{0,480}oob\.[a-z][^\]]{0,120}\]\.join\(["'']\.["'']\)'

  - id: dot-joined-array-values
    desc: Array values joined with dots
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '\.join$'
      arg:
        kind: string
        exact: "."

  # A compact array of collected values with single-letter fallbacks. This is
  # only an assembly fragment; DNS or host-profile meaning comes from the API
  # and resolver legs of the composites that reference it.
  - id: js-array-join-fallback-labels
    desc: Array join contains fallback labels
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?is)\[[^\]\r\n]{0,220}\|\|\s*["''][uhd]["''][^\]\r\n]{0,220}\]\s*\.\s*join\s*\('

  # Simple `${a}.${b}` templates only. Expressions such as `${t.id}.${e.id}`
  # or arithmetic IPv4 formatters (`${x>>8}.${x&255}...`) are ordinary app
  # glue — keep those out of DNS-prep atoms by requiring bare identifiers.
  - id: js-user-host-dotted-call-template
    desc: Template joins transformed user and host labels
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{[A-Za-z_$][\w$]*\(username\)\}\.\$\{[A-Za-z_$][\w$]*\(hostname\)\}'

  - id: js-host-path-dotted-call-template
    desc: Template joins transformed host and path labels
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{[A-Za-z_$][\w$]*\(hostname\)\}\.\$\{[A-Za-z_$][\w$]*\(path\)\}'

  # Injected drive-by scripts hide their payload as dozens of two-character
  # fragments assigned into an indexed table (x["Qj"]="da") and concatenate
  # the table into an eval call. Locale maps use longer values and object
  # literals, so the short-value indexed form with a high count floor keeps
  # this leg on machine-built concealment tables.
composite_rules:
  - id: js-user-host-path-dotted-call-template
    desc: Template joins user host and path labels
    crit: component
    conf: 0.97
    near_bytes: 256
    all:
      - id: micro-behaviors/data/string/concat/join::js-user-host-dotted-call-template
      - id: micro-behaviors/data/string/concat/join::js-host-path-dotted-call-template

  - id: array-join-empty-separator
    desc: Joins array values without separator
    crit: baseline
    conf: 0.8
    any:
      - id: micro-behaviors/data/string/concat/join::join-empty-separator-call
      - id: micro-behaviors/data/string/concat/join::array-join-empty-separator-text
