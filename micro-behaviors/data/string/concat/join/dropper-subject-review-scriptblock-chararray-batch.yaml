defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: powershell-numeric-char-array-join
    desc: PowerShell joins a numeric character array
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[char\[\]\]\([0-9,\s]{80,}\)\s*-join'

  - id: batch-powershell-empty-string-join
    desc: Batch PowerShell empty-string join
    crit: notable
    conf: 0.84
    unless:
      - id: metadata/package/manager::maven-wrapper-script
    if:
      type: text
      # Anchor to a batch PowerShell command; support one caret continuation.
      regex: '(?im)^[ \t]*@?(powershell|pwsh)(\.exe)?.{0,128}(\^[ \t]*\r?\n.{0,128})?-join\s*(''''|"")'

