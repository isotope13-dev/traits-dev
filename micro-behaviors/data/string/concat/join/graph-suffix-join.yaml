defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  size_max: 5000000

traits:
- id: object-keys-graph-string-join
  desc: Object keys joined with graph suffix
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (Object\.keys|Object\.entries).{0,200}join\(\s*['"]-['"]\s*\).{0,80}-graph
- id: map-graph-string-join
  desc: Map joined with graph suffix
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: Map.{0,120}join\(\s*['"]-['"]\s*\).{0,80}-graph

composite_rules:
- id: graph-string-join
  desc: Graph suffix string join
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/string/concat/join::object-keys-graph-string-join
  - id: micro-behaviors/data/string/concat/join::map-graph-string-join
