traits:
  - id: js-return-array-join
    desc: Function returns array.join() result
    platforms: [windows, unix]
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: 'return\s+[a-zA-Z_$][\w$]*\.join\([a-zA-Z_$][\w$]*\);'
    not:
      - substr: "pairSeparator"
    unless:
      - id: well-known/lib/format/json-ts/
