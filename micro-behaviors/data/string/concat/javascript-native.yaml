# JavaScript wrappers around native global keyboard listeners.
defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  attack: T1056.001
  mbc: B0015

traits:
  - id: kbd-buffer-character-append
    desc: "Appends character to kbdBuf"
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\bkbdBuf\s*\+=\s*ch\b'
