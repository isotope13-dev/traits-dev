# Source text of assignment with ampersand concatenation and Mid(..., ..., 1).
# No loop, reversal, encoding, downloading, or execution is inferred.
traits:
- platforms:
  - windows
  for:
  - vbs
  id: vb-mid-character-append-text-reference
  desc: VB assignment concatenates a Mid character
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\w+\s*=\s*\w+\s*&\s*Mid\s*\(\s*\w+\s*,\s*\w+\s*,\s*1\s*\)
