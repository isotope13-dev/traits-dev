defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  # `[a, b].concat()` / `slice.concat()` is the plain way to join elements in
  # Rust. It used to live under Base64 obfuscation described as "joins string
  # fragments", which asserted an endpoint-reassembly intent the matcher never
  # checks; the obfuscation composite references it from here instead.
  - id: rust-concat-call
    desc: Rust joins elements with .concat()
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.concat\b'
