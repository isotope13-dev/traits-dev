defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: token-field-colon-string-assembly
    desc: Appends token field after colon delimiter
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        (binary_expression
          left: (binary_expression operator: "+" right: (string (string_fragment) @delimiter))
          operator: "+"
          right: [
            (subscript_expression index: (string (string_fragment) @field))
            (member_expression property: (property_identifier) @field)]
          (#eq? @delimiter ":") (#eq? @field "token")) @match
