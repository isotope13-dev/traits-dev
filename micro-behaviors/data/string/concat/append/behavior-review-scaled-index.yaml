defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: js-scaled-index-substr-append
    desc: Scaled indexing precedes character append
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\[[\w$]+\]\s*/\s*\d+;\s*[\w$]+\s*\+=\s*[\w$]+\.substr\([\w$]+,1\)'
      exclude_html_comments: true
