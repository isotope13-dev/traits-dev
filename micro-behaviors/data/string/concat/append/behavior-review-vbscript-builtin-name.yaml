defaults:
  platforms: [windows]
  for: [vbs]
  crit: suspicious
  conf: 0.92
  attack: T1027

traits:
  - id: vbs-builtin-name-concatenated
    desc: VBScript builtin name appended as a literal
    if:
      type: text
      regex: '(?i)\+\s*"(Replace|StrReverse|InStr|CreateObject|Chr|Asc|Mid|Split|Join)"'
