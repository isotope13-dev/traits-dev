defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-process-argv-join
    desc: Joins process argument values into text
    crit: notable
    conf: 0.95
    # Require join's receiver to be argv or a slice of it. A nearby path.join
    # does not consume argv; joining argv does not itself launch a shell.
    if:
      type: symbol
      kind: call
      regex: '^process\.argv(\.slice)?\.join$'
