defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: files-field-joined-list
    desc: Joins a list under a files-named field
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bfiles\s*:\s*[A-Za-z_$][\w$]*[.]join\s*\('
  - id: vars-field-joined-list
    desc: Joins a list under a vars-named field
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bvars\s*:\s*[A-Za-z_$][\w$]*[.]join\s*\('
