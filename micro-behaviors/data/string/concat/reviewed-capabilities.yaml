traits:
- platforms:
  - windows
  - unix
  id: js-join-empty-assignment
  desc: Assigns an array joined without separators
  crit: notable
  conf: 0.97
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \w+\s*=\s*\w+\.join\(''\)
  not:
  - substr: finalStr = bits.join('')
  - substr: arrayValue.join('')
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: well-known/lib/network/push-rocks::smartmta-dns-manager-basename
