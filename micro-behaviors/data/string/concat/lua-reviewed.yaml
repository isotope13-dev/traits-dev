defaults:
  platforms: [windows, unix]
  for: [lua]

traits:
  - id: lua-double-indexed-concat-loop
    desc: Lua doubly indexed table-concatenation loop
    crit: notable
    conf: 0.93
    for: [lua, javascript, text, c]
    size_min: 50000
    if:
      type: text
      regex: 'for [A-Za-z]=1,#[A-Za-z],1 do [A-Za-z]=[A-Za-z]\.\.[A-Za-z]\[[A-Za-z]\['

  - id: lua-half-table-concat-loop
    desc: Lua half-table concatenation loop
    crit: notable
    conf: 0.95
    for: [lua, javascript, text, c]
    size_min: 50000
    if:
      type: text
      regex: 'for [A-Za-z]=1,#[A-Za-z]/2,1 do [A-Za-z]=[A-Za-z]\.\.[A-Za-z]\['

  - id: lua-indexed-concat
    desc: Lua doubly indexed value concatenation
    crit: notable
    conf: 0.94
    for: [lua, javascript, text]
    size_min: 50000
    if:
      type: text
      regex: '[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\.\.\s*[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\['


composite_rules:
  - id: lua-indexed-concat-loop
    desc: Lua indexed table-concatenation loop
    crit: notable
    conf: 0.95
    for: [lua, javascript, text, c]
    any:
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
      - id: micro-behaviors/data/string/concat::lua-half-table-concat-loop

