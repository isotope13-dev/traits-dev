defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-bracket-variable-concat
    desc: mIRC bracketed variable concatenation
    crit: notable
    conf: 0.92
    for: [mirc, ircii]
    if:
      type: text
      # `// [ $+ [ %cmd ] ]` forces mIRC to run the variable's text.
      regex: '(?i)\[\s*\$\+\s*\[\s*%[A-Za-z]'

