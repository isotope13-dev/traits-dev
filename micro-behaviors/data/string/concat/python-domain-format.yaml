# Formatting a domain-like string does not establish its use or transmission.
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.9
  id: python-three-label-domain-fstring
  desc: Formats three labels with a domain suffix
  if:
    type: text
    regex: f["']\{.{1,50}\}\.\{.{1,50}\}\.\{.{1,50}\}\.\w+\.(com|net|org|io)
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/scripted/
  - id: micro-behaviors/communications/http/url/build::python-api-client-base-url
  - type: text
    regex: f["']\{self\..{1,30}\}\.\{self\.
