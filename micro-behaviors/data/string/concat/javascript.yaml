defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: dotted-variable-template
    desc: JavaScript dotted variable template
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '`[^`\n]{0,100}\$\{[A-Za-z_$][A-Za-z0-9_$]*\}\s*\.\s*\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'

  # Relocated from micro-behaviors/communications/dns/label, where it was
  # named js-template-subdomain-label and described as DNS subdomain
  # construction. `${var}.label.label` is the shape of a DNS name, but it is
  # equally the shape of a property path — AJV's codegen emits
  # `${h}.evaluated.props` — so the matcher alone proves only that a dotted
  # name is built from a leading variable. The DNS-exfil intent comes from the
  # nslookup/whoami/hostname legs of the composites in
  # objectives/exfiltration/dns/tunnel/, which reference this trait.
  - id: leading-variable-dotted-name
    desc: Dotted name built from a leading variable
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^\$\{[A-Za-z_$][\w$]*\}\.[a-z0-9-]+(\.[a-z0-9-]+)+$'

  - id: massive-concatenation-chain
    desc: JavaScript massive string concatenation chain
    crit: notable
    conf: 0.7
    size_max: 500000
    if:
      type: text
      regex: '=\s*([\w"''\.]+\s*\+\s*){5,}'
    unless:
      # Extensionless saved HTML pages are heuristically typed as JavaScript;
      # their inline site scripts and article markup are not source-level
      # string reconstruction by the page itself.
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/library/structure::js-large-module-bundle
      - id: well-known/lib/ui/greensock::greensock-tweenmax-suite-banner
      # npm semver builds its version regexes via long src[N] concatenations.
      - id: well-known/lib/development/npm-semver::npm-semver-context
      - id: well-known/lib/development/npm-semver::legacy-single-file

  - id: fragmented-url-construction
    desc: URL scheme built from string fragments
    crit: notable
    conf: 0.95
    size_max: 100000
    if:
      type: text
      regex: '[''"]https?[''"]\s*\+\s*[''"]'

  # `%LOCALAPPDATA%` is the per-user Windows install root (`...\Programs\<app>`).
  # Code that needs it writes the variable whole; these regexes only match when
  # the variable NAME ITSELF is chopped mid-token across a `+`, which is what
  # a string-splitting obfuscator does and what ordinary path building never
  # does. Neutral on its own — it says a Windows per-user install path is
  # being reassembled at runtime, not why.
  - id: fragmented-localappdata-path
    desc: Windows %LOCALAPPDATA% path built from fragments
    crit: notable
    conf: 0.93
    size_max: 2000000
    if:
      type: text
      regex: '[''"]%LOCA[A-Z]{0,8}[''"]\s*\+'

  # Same idea for the macOS side: `/Applications/<App>.app/Contents/...` is the
  # only place an installed app's private CLI lives, and the leading directory
  # name is split mid-word rather than written out.
  - id: fragmented-macos-app-bundle-path
    desc: macOS /Applications path split across fragments
    crit: notable
    conf: 0.93
    size_max: 2000000
    if:
      type: text
      regex: '[''"]/Appl[a-z]{0,8}[''"]\s*\+'

  - id: dense-string-fragment-concatenation
    desc: Dense concatenated string fragments
    crit: notable
    conf: 0.9
    size_max: 100000
    per_kb_min: 0.5
    if:
      type: text
      regex: '[\"''].{1,20}[\"''](\s*\+\s*(\w+|[\"''].{1,20}[\"''])){3}'
    not:
      - regex: '[\"'']<[/A-Za-z][^>]{0,40}>[\"'']'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - type: text
        regex: 'twitter\.com/intent|facebook\.com/sharer|t\.me/share'
      - id: well-known/app/development/nodpy::nodpy-package-context
      - id: well-known/lib/media/regula-facesdk::official-face-components-context
      # npm semver builds its version regexes via dense src[N] concatenations.
      - id: well-known/lib/development/npm-semver::npm-semver-context
      - id: well-known/lib/development/npm-semver::legacy-single-file

  - id: join-empty-separator-call
    desc: Joins values without a separator
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '\.join$'
      arg:
        kind: string
        exact: ""

  - id: array-join-empty-separator-text
    desc: Array expression joined without separator
    crit: component
    conf: 0.78
    if:
      type: text
      regex: '\]\.join\(["'']["'']\)'

  - id: dot-joined-array-values
    desc: Array values joined with dots
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '\.join$'
      arg:
        kind: string
        exact: "."

  # Simple `${a}.${b}` templates only. Expressions such as `${t.id}.${e.id}`
  # or arithmetic IPv4 formatters (`${x>>8}.${x&255}...`) are ordinary app
  # glue — keep those out of DNS-prep atoms by requiring bare identifiers.
  - id: js-dotted-template-string
    desc: Dotted JavaScript template string
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '`[^`\n]{0,80}\$\{[$\w]+\}\s*\.\s*\$\{[$\w]+\}'
    not:
      - substr: '${this.major}.${this.minor}.${this.patch}'

  - id: js-dotted-variable-concat
    desc: Dotted variable concatenation
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*\+\s*["'']\.\s*["'']'

  # Identity values appended onto a DNS/FQDN suffix (often a leading-dot apex
  # held in a variable). Distinct from dotted-variable-concat, which only
  # matches an explicit "." string between two identifiers.
  - id: js-os-identity-label-concat
    desc: Concatenates OS identity into a hostname label
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'os\.(hostname\(\)|userInfo\(\)\.username)\s*\+'

  # Install-time beacons commonly transform each collected value through the
  # same helper before placing user, host, and working-directory fields in
  # adjacent DNS labels. Requiring all three semantic inputs avoids treating
  # ordinary version or object-property templates as host-profile assembly.
  - id: js-user-host-dotted-call-template
    desc: Template joins transformed user and host labels
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{[A-Za-z_$][\w$]*\(username\)\}\.\$\{[A-Za-z_$][\w$]*\(hostname\)\}'

  - id: js-host-path-dotted-call-template
    desc: Template joins transformed host and path labels
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{[A-Za-z_$][\w$]*\(hostname\)\}\.\$\{[A-Za-z_$][\w$]*\(path\)\}'

composite_rules:
  - id: js-user-host-path-dotted-call-template
    desc: Template joins user host and path labels
    crit: component
    conf: 0.97
    near_bytes: 256
    all:
      - id: js-user-host-dotted-call-template
      - id: js-host-path-dotted-call-template

  - id: array-join-empty-separator
    desc: Joins array values without separator
    crit: notable
    conf: 0.8
    any:
      - id: join-empty-separator-call
      - id: array-join-empty-separator-text
