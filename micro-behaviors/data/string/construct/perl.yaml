# The x operator repeats strings; it does not establish packet construction.
defaults:
  platforms: [unix, windows]
  for: [perl]
traits:
  - id: perl-repetition-expression
    desc: Perl repetition operator expression
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '([''"][A-Za-z0-9][''"]|\$[A-Za-z_]\w*)\s+x\s+(\$[A-Za-z_]\w*|int\b|\d+)'
