# Neutral marker for tool-result data in LLM and agent interfaces.  The marker
# describes a data object, not transmission or exfiltration; objective rules
# must combine it with forwarding and destination evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, markdown, text, json]

traits:
  - id: tool-result-marker
    desc: References an LLM tool-result marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\btool[-_ ]result(s)?\b'
