defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, go, rust, json]
  crit: notable
  conf: 0.93
  attack: T1562.001

traits:
  - id: agent-isolated-session-launch
    desc: Agent CLI launched with isolated session config
    conf: 0.9
    if:
      type: text
      regex: '(?i)--(strict-mcp-config|setting-sources|ephemeral)\b'

  - id: agent-default-agent-override
    desc: Overrides the configured default agent
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']?default[_-]?agent["'']?\s*[:=]\s*["''][A-Za-z0-9_-]{1,32}["'']'

  # Generic auto-approval switch used by Gemini CLI, Cline, Roo and friends.
  # Keep this to the approval spelling: `autoAccept` is ordinary domain
  # vocabulary (for example, Pulumi's VPC peering option) and does not name a
  # human approval gate.
