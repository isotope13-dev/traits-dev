defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  attack: T1059
  mbc: B0022
  crit: notable
  conf: 0.88

traits:
  - id: codex-cli-command
    desc: Codex CLI command invocation
    if:
      type: text
      regex: '\bcodex (login|login status|--version)\b'

  # Bare-text mention: documentation and comments name `codex exec` without
  # invoking it (e.g. a hook wirer explaining non-interactive behavior), so
  # this records a command reference, not a proven invocation. Composites
  # pairing it with scripted execution supply the invocation claim.
  - id: codex-exec-command
    desc: Codex exec command reference
    crit: notable
    conf: 0.94
    for: [javascript, typescript, package.json, json, shell, python, markdown, text]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      regex: '\bcodex\s+exec\b'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: agent-target-option
    desc: Targets a named local AI agent
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, shell, markdown]
    if:
      type: text
      regex: '(?i)--agent[ \t]+(codex|claude-code|cursor)\b'

  - id: ai-agent-response-storage-disable-key
    desc: AI agent response-storage disable setting
    crit: notable
    conf: 0.92
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\bdisable[_-]?response[_-]?storage\b'

  - id: ai-agent-response-storage-disable-value
    desc: AI agent response-storage disable value
    crit: notable
    conf: 0.92
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\bdisable[_-]?response[_-]?storage\b.{0,16}\b(true|1|off)\b'

  # NOTE: "proxy_url = 'http://...'" is plain HTTP proxy configuration and has
  # nothing to do with agents — it fired on the `needle` HTTP client. It now
  # lives at micro-behaviors/communications/proxy/config::proxy-endpoint-url-setting
  # and the exploit-agent composite references it cross-directory.

  # A terminal-capable agent is a useful neutral capability. The objective
  # composites add unattended execution and offensive tasking before treating
  # it as malicious, so ordinary coding assistants remain notable evidence.
  # Plural `tools` only: the singular form matched unrelated keys such as the
  # `Tool:` creator field in an SPDX SBOM and `[tool.*]` config sections.
  # The value must be a collection literal as well: a bare `tools:` key with a
  # string value is ordinary UI vocabulary (i18n catalogs translate the
  # toolbar label `tools:"Werkzeuge"`), not a declared tool list.
  - id: codex-skip-git-repo-check-flag
    desc: Codex CLI skips Git repository check
    crit: notable
    conf: 0.96
    for: [javascript, typescript, package.json, json, shell, python, markdown, text]
    if:
      type: text
      substr: --skip-git-repo-check

  - id: ai-agent-cli-call
    desc: Calls AI coding-agent CLI
    crit: notable
    conf: 0.96
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      regex: '^(codex|claude|gemini|opencode)(\.exe)?$'

  # Hermes exposes this as a configuration value rather than a CLI flag. Keep
  # the atom language-neutral so future agent frameworks using the same
  # unattended approval convention are covered without naming Hermes.
  - id: claude-cli-literal
    desc: Claude CLI command token
    crit: component
    conf: 0.88
    size_max: 1000000
    if:
      type: text
      regex: '(^|[\s"''`(\[{;|&])claude([\s"''`\])};|&]|$)'

  - id: claude-print-flag
    desc: Claude CLI print mode flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bclaude\b[^\n\r;&|]{0,120}(^|[[:space:]])(--print|-p)([[:space:]]|$)'

  - id: claude-settings-flag
    desc: Claude CLI settings flag
    crit: component
    conf: 0.9
    if:
      # Bound to the claude command token on the same command segment, like
      # claude-print-flag: a bare --settings is any tool's own option, and
      # --codex-settings / --settings-file are different flags. The token
      # guards admit argv arrays (["--settings", ...]) as well as shell
      # spellings (claude --settings ...).
      type: text
      regex: '\bclaude\b[^\n\r;&|]{0,120}(^|[^\w-])--settings($|[^\w-])'

  - id: claude-stream-json-mode
    desc: Claude command selects stream JSON output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bclaude\b[^\n;&|]{0,80}--output-format[ ="'']+stream-json\b'
  - id: claude-runtime-cli-provision-call
    desc: Ensures Claude runtime CLI availability
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: ensureClaude
  - id: claude-runtime-process-launcher-reference
    desc: References Claude runtime process launcher
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: identifier
      regex: '^spawnClaude(Bidirectional)?$'
  - id: python-llm-agent-command-builder
    desc: Python LLM agent command builder
    crit: notable
    conf: 0.92
    for: [python]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      regex: 'def\s+_build_(claude|codex|ollama)_command\s*\('
  - id: python-invoke-claude-call
    desc: Python invoke Claude call
    crit: notable
    conf: 0.9
    for: [python]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: symbol
      kind: call
      exact: invoke_claude
  - id: opencode-server-command
    desc: OpenCode server command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bopencode\s+server\b'
      case_insensitive: true
  - id: opencode-server-listening
    desc: OpenCode server startup output
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: opencode server listening
      case_insensitive: true
  - id: python-llm-runner-class
    desc: Python LLM runner class
    crit: notable
    conf: 0.92
    for: [python]
    ref: sha256:cb80b116928df7b01cff82895a0df1ed6cad5e7898ed431bf9d4ddc4dbaf7cc0
    if:
      type: text
      regex: 'class\s+\w*Runner\s*\(\s*LLMRunner\s*\)'
  - id: python-agentic-ellipsis-method
    desc: Agent method delegated to runtime model
    crit: notable
    conf: 0.97
    for: [python]
    attack: T1059.006
    if:
      type: tree-sitter
      language: python
      query: |
        (class_definition
          superclasses: (argument_list
            (identifier) @base
            (#match? @base "(?i)agent$"))
          body: (block
            (function_definition
              name: (identifier) @method
              body: (block
                (expression_statement
                  (ellipsis))))))

  # The app-server policy values are separate components. The composite below
  # requires the approval and sandbox settings to occur close together.
composite_rules:
  - id: ai-agent-response-storage-disabled
    for: [shell, python, javascript, json]
    desc: AI agent disables response storage
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/llm/session::ai-agent-response-storage-disable-key
      - id: micro-behaviors/data/llm/session::ai-agent-response-storage-disable-value
    near_lines: 1

  - id: codex-cli-or-agent-session
    desc: Codex CLI or agent session
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/llm/session::codex-cli-command
      - id: micro-behaviors/data/llm/session::codex-exec-command

  - id: claude-cli-agent-session
    desc: Claude CLI agent session
    crit: notable
    conf: 0.92
    # A bare `claude` token plus a `~/.claude` path reference never establishes
    # a session: installers and skills name both without invoking the CLI
    # (detection probes, config management). Every remaining `any` leg is a
    # CLI-mode flag, so a passing combination always carries invocation shape.
    all:
      - id: micro-behaviors/data/llm/session::claude-cli-literal
    any:
      - id: micro-behaviors/data/llm/session::claude-print-flag
      - id: micro-behaviors/data/llm/session::claude-settings-flag
      - id: micro-behaviors/data/llm/session::claude-stream-json-mode
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
    near_bytes: 240
  - id: opencode-cli-agent-session
    for: [javascript, packagejson]
    desc: OpenCode CLI agent session
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/llm/agent::opencode-name-reference
    any:
      - id: micro-behaviors/data/llm/session::opencode-server-command
      - id: micro-behaviors/data/llm/session::opencode-server-listening

  - id: ai-coding-cli-local-server
    for: [javascript]
    desc: AI coding CLI local server
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/llm/session::opencode-cli-agent-session
      - id: micro-behaviors/communications/url/host/http::loopback-client-url-cooccurrence
    any:
      - id: micro-behaviors/process/create/spawn::child-process-member-spawn
      - id: micro-behaviors/process/create/spawn::child-process-alias-spawn
      - id: micro-behaviors/process/create/exec::node-spawn-current-executable

