defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: cursor-agent-prompt-command
    desc: Invokes Cursor agent with prompt
    if:
      type: text
      regex: '(?i)(^|\s)cursor-agent\s+[^\n]{0,100}(-p|--print)\b'

  - id: aider-message-command
    desc: Invokes Aider with instruction
    if:
      type: text
      regex: '(?i)(^|\s)aider\s+[^\n]{0,100}(-m|--message|-f|--message-file)\b'

