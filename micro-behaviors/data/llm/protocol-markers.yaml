# Neutral LLM protocol and provider markers.  These describe message and
# configuration formats; attack intent requires a separate objective context.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, markdown]

traits:
  - id: ai-agent-term-reference
    desc: References the phrase "AI agent"
    crit: component
    conf: 0.8
    if:
      type: text
      substr: ai agent
      case_insensitive: true
    unless:
      - id: well-known/lib/core/dna-sdk/
      - id: well-known/tool/development/caprock/

  - id: jailbreak-term-reference
    desc: References LLM jailbreak terminology
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(jailbreak prompt|prompt jailbreak|LLM jailbreak|jailbreak AI)\b'
    unless:
      - type: basename
        regex: '(?i)^(english[_-]?words?|words?|dictionary)\.txt$'
      - id: metadata/file/format/markup::adblock-filter-list
  # Companion to the jailbreak vocabulary above. Naming the attack describes
  # the concept, not the program: guardrail products, threat write-ups, and
  # schema models for an agent firewall all use it, so it stays a neutral
  # terminology observation and the tool identity comes from elsewhere.
  - id: prompt-injection-term-reference
    desc: References prompt-injection attack terminology
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bprompt injection attacks?\b'

  - id: tool-call-sequence-instruction
    desc: LLM tool-call sequence instruction
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'tool call sequence|Call the `[A-Za-z_]{1,40}` tool'
      case_insensitive: true

  - id: llm-memory-add-call-reference
    desc: References a memory.add call
    crit: component
    conf: 0.9
    for: [html, markdown, text, python, javascript, typescript]
    if:
      type: text
      regex: '(?i)\bmemory\.add\s*\('

  - id: model-provider-field
    desc: LLM model provider field
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bmodel_providers?\b'

  # These are serialization delimiters used by model families such as
  # ChatML and Llama 3.  The delimiters describe prompt format only; attacker
  # intent requires a separate objective trait (for example, an agent target
  # plus an instruction override).
  - id: system-prompt-tag-marker
    desc: LLM system-prompt format tag
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '<\s*/?\s*system_prompt\s*>'
      case_insensitive: true

  - id: chatml-system-role-marker
    desc: ChatML system-role delimiter
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '<\|im_start\|>\s*system\b'
      case_insensitive: true

  - id: llama-system-header-marker
    desc: Llama system-header delimiter
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '<\|start_header_id\|>\s*system\s*<\|end_header_id\|>'
      case_insensitive: true

  - id: role-line-marker
    desc: Quoted LLM role label
    crit: component
    conf: 0.72
    # Include html: Copilot-style pages hide SYSTEM: directives in markup.
    for: [python, javascript, typescript, ruby, markdown, html, text, documents]
    if:
      type: text
      # Bare "SYSTEM: …" (HTML prompt-injection) and quoted "system: '…'" forms.
      # In HTML the label often starts immediately after an opening tag.
      regex: '(?m)(^|>)\s*["'']?(system|developer|assistant)["'']?\s*[:#>]\s*\S'
      case_insensitive: true

  - id: system-role-marker
    desc: LLM system-role value
    crit: component
    conf: 0.72
    if:
      type: text
      regex: "(?i)\\bsystem (prompt|role|instruction)\\b"

  - id: non-system-role-marker
    desc: LLM developer- or assistant-role value
    crit: component
    conf: 0.72
    if:
      type: text
      regex: "(?i)\\b(developer|assistant) (message|prompt|role|instruction)\\b"

  - id: role-field-marker
    desc: References an LLM message role field
    crit: component
    conf: 0.72
    if:
      type: text
      regex: "(?i)\\brole\\s*[:=]\\s*['\"]?(system|developer|assistant)\\b"

  - id: instruction-marker-forward
    desc: System or developer prompt marker
    crit: component
    conf: 0.72
    if:
      type: text
      regex: '\\b(system|developer)\\b[\\s\\S]{0,20}\\b(prompt|instruction)\\b'
      case_insensitive: true

  - id: instruction-marker-reverse
    desc: Prompt marker with system or developer role
    crit: component
    conf: 0.72
    if:
      type: text
      regex: '\\b(prompt|instruction)\\b[\\s\\S]{0,20}\\b(system|developer)\\b'
      case_insensitive: true

  - id: assistant-identity-marker
    desc: LLM assistant identity marker
    crit: component
    conf: 0.72
    if:
      type: text
      regex: "(?i)\\byou are (an? )?(ai|assistant|chatbot)\\b"

composite_rules:
  - id: role-marker
    desc: LLM role marker component
    crit: component
    conf: 0.72
    any:
      - id: role-line-marker
      - id: system-role-marker
      - id: non-system-role-marker
      - id: role-field-marker

  - id: prompt-marker
    desc: LLM prompt format marker
    crit: component
    conf: 0.72
    any:
      - id: role-marker
      - id: instruction-marker-forward
      - id: instruction-marker-reverse
      - id: assistant-identity-marker

  - id: system-role-format-marker
    desc: LLM system-role format delimiter
    crit: component
    conf: 0.82
    any:
      - id: system-prompt-tag-marker
      - id: chatml-system-role-marker
      - id: llama-system-header-marker
