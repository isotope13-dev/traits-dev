# Persistent LLM/agent memory capabilities. These observations are neutral:
# memory plugins legitimately expose them, while objective composites can add
# collection, persistence, or prompt-manipulation intent when warranted.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, markdown]
  crit: notable
  conf: 0.9

traits:
  - id: agent-memory-md-session-load
    desc: Loads MEMORY.md during an agent session
    ref: sha256:ffbf482c4b6c5a57944da3576001f383e4cb61bce3ed008b813487357e49e107
    if:
      type: text
      regex: '(?is)`?MEMORY\.md`?.{0,80}(session start|prior session)'

  - id: agent-session-start-loads-memory-md
    desc: Loads MEMORY.md when an agent starts
    if:
      type: text
      regex: '(?is)(session start|prior session).{0,80}`?MEMORY\.md`?'

  - id: agent-memory-md-write-instruction
    desc: Instructs an agent to write MEMORY.md
    conf: 0.95
    for: [markdown, python, javascript, typescript, shell, powershell, ruby, perl, php]
    if:
      type: text
      regex: '(?i)\b(write|append|modify|persist)\b.{0,80}\bMEMORY\.md\b'

  - id: agent-context-persistent-memory-append
    desc: Appends persistent memory to agent context
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: output.context.push
      arg:
        kind: string
        substr: 'Persistent memory:'

  - id: agent-compaction-memory-capture-prompt
    desc: Prompts memory capture before compaction
    conf: 0.96
    for: [javascript, typescript, python, markdown]
    if:
      type: literal
      kind: string
      regex: '(?is)Before summarizing.{0,80}extract any memorable facts'

  - id: agent-memory-write-tool
    desc: Exposes an agent-memory write tool
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: symbol
      kind: bind
      exact: memory_write

  - id: agent-memory-export-tool
    desc: Exposes an agent-memory export tool
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: symbol
      kind: bind
      exact: memory_export

  - id: agent-memory-import-tool
    desc: Exposes an agent-memory import tool
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: symbol
      kind: bind
      exact: memory_import

  - id: agent-memory-forget-tool
    desc: Exposes an agent-memory deletion tool
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: symbol
      kind: bind
      exact: memory_forget

  - id: agent-memory-cross-project-search-tool
    desc: Searches agent memory across projects
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: symbol
      kind: bind
      exact: memory_search_all
