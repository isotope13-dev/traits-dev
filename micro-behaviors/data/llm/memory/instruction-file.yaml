defaults:
  platforms: [unix, windows]
  for: [json, text, markdown, scripts, source]
traits:
  - id: agent-instruction-file-write-language
    desc: Mentions writing instructions into agent file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(add|append|write).{0,12}(prompt|instruction).{0,12}(AGENTS|CLAUDE|GEMINI)\.md'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: micro-behaviors/os/security/scan/documentation/
