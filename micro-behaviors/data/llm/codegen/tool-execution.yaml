defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, java, markdown, json]

traits:
  # Exclude code formatting and table columns from the prose gap.
  - id: tool-call-wording
    desc: Mentions a tool call
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)\btool\s+call\b'
  - id: execute-tool-api
    desc: References execute_tool API
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript, shell, powershell, ruby]
    if:
      type: symbol
      exact: execute_tool

composite_rules:
  - id: model-tool-execution-references
    desc: Model completion and tool execution references
    crit: notable
    conf: 0.95
    # Vocabulary and API references establish a capability, not output flow.
    scope: archive
    for: [scripts, java, markdown, json, zip, tar]
    unless:
      - id: well-known/tool/offensive/bingo::bingo-terminal-context
    all:
      - id: micro-behaviors/data/llm/codegen::model-output-reference
      - id: metadata/lang/natural/phrasing::model-completion-wording
      - id: tool-call-wording
      - id: execute-tool-api
