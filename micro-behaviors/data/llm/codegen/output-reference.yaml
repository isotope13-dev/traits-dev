# Neutral references to model output in AI-facing documentation. Whether that
# output drives execution, persistence, or another objective is established by
# composites that add the corresponding action.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.9

traits:
  - id: model-output-reference
    desc: Documentation references model or LLM output
    if:
      type: text
      regex: '(?i)\b(model|LLM)\b[^\n]{0,40}\b(response|output|completion)\b'
