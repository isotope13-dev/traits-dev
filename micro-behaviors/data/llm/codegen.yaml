# Model-generated source is a useful capability signal when an artifact asks
# an LLM for executable code.  Execution and destructive intent are separate
# objective-level conclusions.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]

traits:
  - id: llm-code-generation-verb
    desc: LLM code-generation verb
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}\b(generate|write|produce)\b'

  - id: source-generation-code-directive
    desc: Prompt or instruction requests generated code
    crit: notable
    conf: 0.88
    if:
      type: text
      # Require prompt-like context so compiler APIs such as generateCodeFrame
      # and ordinary documentation do not look like LLM instructions.
      regex: '(?i)\b(prompt|instruction)\b.{0,16}\b(generate|write|produce)\b.{0,16}\bcode\b'

  - id: source-generation-program-directive
    desc: Prompt requests a generated program
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(prompt|instruction)\b.{0,14}\b(generate|write|produce)\b.{0,14}\bprogram\b'

  - id: llm-generation-source-language-model
    desc: Explicit LLM or language-model reference
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b'

  - id: llm-generation-source-generate
    desc: Generates source code or script
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bgenerat\w*\b[^\r\n]{0,80}\s(source code|script|program)\b'

  - id: llm-generation-source-write
    desc: Writes source code or script
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bwrit\w*\b[^\r\n]{0,80}\s(source code|script|program)\b'

  - id: llm-generation-source-produce
    desc: Produces source code or script
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bproduc\w*\b[^\r\n]{0,80}\s(source code|script|program)\b'

  - id: llm-generation-source-return
    desc: Returns source code or script
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\breturn\w*\b[^\r\n]{0,24}\s(source code|script|program)\b'

  - id: llm-generation-source-output
    desc: Outputs source code or script
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\boutput\w*\b[^\r\n]{0,80}\s(source code|script|program)\b'

  - id: llm-code-generation-language
    desc: LLM prompt names a script language
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}(\bpython\b|[^\w-]shell([^\w-]|$))'

  - id: llm-code-generation-language-alt
    desc: LLM prompt names Lua or JavaScript
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}\b(lua|javascript)\b'

  - id: llm-output-source-word
    desc: LLM output source reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b.{0,32}\b(generated|returned)\b.{0,32}\b(code|script)\b'

  - id: llm-output-command-word
    desc: LLM output command reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b.{0,32}\b(generated|returned)\b.{0,32}\bcommand\b'

  - id: llm-output-response-word
    desc: LLM response output reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(LLM|language model)[ -](response|output)\b'

  - id: llm-generated-output-response
    desc: Generated or returned model response
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(generated|returned)\b.{0,32}\b(LLM|language model)\b.{0,32}\b(response|output)\b'

  - id: llm-near-execution-verb
    desc: LLM reference near execution verb
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}\b(executed|runs?|interpreted?)\b'

  - id: llm-output-execution-generated-verb
    desc: Generated model output execution
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(generated|returned)\b.{0,16}\b(LLM|model)\b.{0,16}\b(execut\w*|run\w*)\b'

  - id: llm-output-execution-evaluated-verb
    desc: Generated output evaluation verb
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(generated|returned)\b[^\r\n]{0,48}\bevaluated\b'

composite_rules:
  - id: llm-code-generation-source
    desc: LLM names generated source code
    crit: notable
    conf: 0.88
    all:
      - id: llm-generation-source-language-model
    any:
      - id: llm-generation-source-generate
      - id: llm-generation-source-write
      - id: llm-generation-source-produce
      - id: llm-generation-source-return
      - id: llm-generation-source-output
    # Byte proximity, not line proximity: a minified bundle is one line, so
    # `near_lines` degenerates to "anywhere in the file" and pairs an `llm`
    # icon name at 1.7 MB with a `return ... script` at 23 KB.
    near_bytes: 200
  - id: source-generation-directive
    desc: Prompt requests generated source
    crit: notable
    conf: 0.92
    any:
      - id: source-generation-code-directive
      - id: source-generation-program-directive
      - id: llm-code-generation-verb
      - id: llm-code-generation-language
      - id: llm-code-generation-language-alt

  - id: llm-code-generation-instruction
    desc: LLM instruction requests source code
    crit: notable
    conf: 0.92
    all:
      - id: source-generation-directive
    any:
      - id: llm-code-generation-source
      - id: llm-code-generation-language
      - id: llm-code-generation-language-alt
    near_bytes: 200

  - id: llm-output-execution-intent
    desc: LLM output is intended for execution
    crit: notable
    conf: 0.92
    any:
      - id: llm-output-source-word
      - id: llm-output-command-word
      - id: llm-output-response-word
      - id: llm-generated-output-response
    all:
      - id: llm-output-execution-verb
    near_lines: 2

  - id: llm-output-execution-verb
    desc: LLM output execution verb
    crit: notable
    conf: 0.92
    any:
      - id: llm-near-execution-verb
      - id: llm-output-execution-generated-verb
      - id: llm-output-execution-evaluated-verb
