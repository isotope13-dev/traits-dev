# Model-generated source is a useful capability signal when an artifact asks
# an LLM for executable code.  Execution and destructive intent are separate
# objective-level conclusions.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]

traits:
  - id: llm-code-generation-verb
    desc: LLM code-generation verb
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(generate|write|produce)\s+'

  - id: llm-code-generation-source
    desc: LLM prompt names source code
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(source code|script|program)\b'

  - id: llm-code-generation-language
    desc: LLM prompt names a script language
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(lua|python|javascript|shell)\b'

  - id: llm-output-source-word
    desc: LLM output source reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(model|generated|returned)\s+(code|script)\b'

  - id: llm-output-command-word
    desc: LLM output command reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(model|generated|returned)\s+command\b'

  - id: llm-output-response-word
    desc: LLM response output reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(response|output)\b'

  - id: llm-output-execution-verb
    desc: LLM output execution verb
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(executed|runs?|evaluated|interpreted?)\b'

composite_rules:
  - id: llm-code-generation-instruction
    desc: LLM instruction requests source code
    crit: notable
    conf: 0.92
    all:
      - id: llm-code-generation-verb
    any:
      - id: llm-code-generation-source
      - id: llm-code-generation-language
    near_lines: 2

  - id: llm-output-execution-intent
    desc: LLM output is intended for execution
    crit: notable
    conf: 0.92
    any:
      - id: llm-output-source-word
      - id: llm-output-command-word
      - id: llm-output-response-word
    all:
      - id: llm-output-execution-verb
    near_lines: 2
