# Agent frameworks can turn an otherwise empty method body into a model-driven
# execution loop.  The ellipsis is only meaningful here when it is the body of
# a method on a class whose base name identifies it as an Agent; a bare `...`
# remains ordinary Python stub syntax and is not a finding.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-agentic-ellipsis-method
    desc: Agent method delegated to runtime model
    crit: notable
    conf: 0.97
    attack: T1059.006
    if:
      type: tree-sitter
      language: python
      query: |
        (class_definition
          superclasses: (argument_list
            (identifier) @base
            (#match? @base "(?i)agent$"))
          body: (block
            (function_definition
              name: (identifier) @method
              body: (block
                (expression_statement
                  (ellipsis))))))
