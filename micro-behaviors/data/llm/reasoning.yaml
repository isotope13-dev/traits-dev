# Structured LLM message-envelope observations. These are data capabilities,
# not file-format metadata and not HTTP behavior: the same JSON shape can be
# carried by a local adapter, a file, or another transport.
defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.95

traits:
  - id: llm-thinking-block-type
    desc: LLM message contains a thinking block
    if:
      type: value
      path: messages[*].content[*].type
      exact: thinking

  - id: llm-opaque-thinking-content
    desc: LLM message contains encrypted_content
    if:
      type: value
      path: messages[*].content[*].encrypted_content
      exists: true

  # Field presence alone says only "this JSON is a reasoning envelope" — docs,
  # schemas and API fixtures carry the key with a self-describing placeholder.
  # A genuine replayed envelope carries the provider's opaque token, so the
  # blob atoms below require the value to actually be one.
  - id: llm-encrypted-reasoning-blob
    desc: encrypted_content holds a long opaque token
    if:
      type: value
      path: messages[*].content[*].encrypted_content
      regex: '^[A-Za-z0-9+/_=-]{64,}$'

  - id: llm-thinking-signature-blob
    desc: Thinking block carries an opaque signature
    if:
      type: value
      path: messages[*].content[*].signature
      regex: '^[A-Za-z0-9+/_=-]{64,}$'

  - id: llm-assistant-model-role
    desc: LLM message uses assistant or model role
    if:
      type: value
      path: messages[*].role
      regex: '^(assistant|model)$'
      case_insensitive: true

  - id: llm-repeated-encrypted-content-field
    desc: Multiple encrypted_content fields
    if:
      type: text
      regex: '["'']encrypted_content["'']\s*:'
    count_min: 2

  - id: llm-repeated-assistant-role
    desc: Multiple assistant message roles
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["'']assistant["'']'
    count_min: 2

  - id: llm-repeated-model-role
    desc: Multiple model message roles
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["'']model["'']'
    count_min: 2

  - id: llm-thinking-signature-field
    desc: LLM message contains thinkingSignature
    if:
      type: value
      path: messages[*].content[*].thinkingSignature
      exists: true

  - id: llm-thought-signature-field
    desc: LLM message contains thought_signature
    if:
      type: value
      path: messages[*].content[*].thought_signature
      exists: true

  - id: llm-repeated-thinking-signature-field
    desc: Multiple thinkingSignature fields
    if:
      type: text
      regex: '["'']thinkingSignature["'']\s*:'
    count_min: 2

  - id: llm-repeated-thought-signature-field
    desc: Multiple thought_signature fields
    if:
      type: text
      regex: '["'']thought_signature["'']\s*:'
    count_min: 2

  - id: llm-repeated-thought-signature-property
    desc: Multiple thought_signature property accesses
    if:
      type: text
      regex: '\.thought_signature\b'
    count_min: 2

  - id: llm-reasoning-signature-field
    desc: LLM message contains a reasoning signature
    if:
      type: text
      regex: '(?i)reasoning[\s\S]{0,80}["'']signature["'']\s*:'

  - id: llm-repeated-reasoning-signature-field
    desc: Multiple reasoning signature fields
    if:
      type: text
      regex: '(?i)reasoning[\s\S]{0,80}["'']signature["'']\s*:'
    count_min: 2

composite_rules:
  # Provider-neutral "a real reasoning envelope is present": OpenAI-style
  # encrypted_content or an Anthropic thinking-block signature.
  - id: llm-opaque-reasoning-blob
    desc: Reasoning envelope carries an opaque blob
    crit: notable
    conf: 0.95
    any:
      - id: llm-encrypted-reasoning-blob
      - id: llm-thinking-signature-blob

  - id: llm-repeated-assistant-model-role
    desc: Multiple assistant or model roles
    crit: notable
    conf: 0.95
    any:
      - id: llm-repeated-assistant-role
      - id: llm-repeated-model-role

  - id: llm-repeated-reasoning-envelope-field
    desc: LLM messages contain multiple reasoning fields
    any:
      - id: llm-repeated-encrypted-content-field
      - id: llm-repeated-thinking-signature-field
      - id: llm-repeated-thought-signature-field
      - id: llm-repeated-thought-signature-property
      - id: llm-repeated-reasoning-signature-field
