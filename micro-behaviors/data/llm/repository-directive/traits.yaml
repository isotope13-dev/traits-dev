defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - go
  - rust
  - dockerfile
  - yaml
  - github_actions
  - json
  - documents
  crit: component
  conf: 0.88
traits:
- id: repository-ai-agent-addressee
  desc: Addresses an AI agent
  if:
    type: text
    regex: \bAI([- ](coding|database|repository))?[- ](assistants?|agents?)\b
    case_insensitive: true
- id: repository-interactive-command-line-agent-addressee
  desc: Addresses an interactive command-line agent
  if:
    type: text
    regex: \binteractive command[- ]line agent\b
    case_insensitive: true
- id: repository-automated-agent-addressee
  desc: Addresses an automated repository agent
  if:
    type: text
    regex: \bautomated([- ](coding|repository))?[- ](assistants?|agents?|reviewer|tools?)\b
    case_insensitive: true
- id: repository-named-agent-addressee
  desc: Addresses a named coding agent
  if:
    type: text
    regex: \b(coding assistants?|copilot coding agent|cursor/copilot agents?)\b
    case_insensitive: true
- id: repository-special-agent-addressee
  desc: Addresses a repository automation agent
  if:
    type: text
    regex: \b(build-agent|repository AI|test-repair agent|agent setup requirement)\b
    case_insensitive: true
- id: repository-model-addressee
  desc: Addresses a language model
  if:
    type: text
    regex: '(?i)\b(language-model code generators?|AI maintenance directive)\b|\bLLM\b'
- id: repository-agent-role-label
  desc: Labels an addressed agent role
  if:
    type: text
    regex: '\b(assistant|agent|reviewer|tools?|LLM)\s*:'
    case_insensitive: true
- id: repository-agent-approval-action
  desc: Agent approval action
  if:
    type: text
    word: approve
    case_insensitive: true
- id: repository-agent-nondisclosure
  desc: Agent told to hide instructions
  conf: 0.94
  if:
    type: text
    regex: \b(do not|don't|never) (mention|tell|disclose|reveal)\b[^.\n]{0,64}
    case_insensitive: true
    # "don't tell them to sign up manually" steers what advice the agent gives;
    # it does not hide an instruction or an action from the user.
    # "never mention Claude" in a commit-attribution ban names a product,
    # not an instruction or action being hidden from the user.
    # "never reveal ... security rules / system instructions" keeps the
    # prompt text private; the hidden object is the instruction itself.
    not:
    # This bare pronoun may refer to an optional offer that should not be
    # made when unavailable; it does not identify an instruction or action
    # being hidden from the user.
    - regex: '(?i)\bdo not mention it\b'
    - regex: (?i)\btell\s+(them|the user|users?)\s+to\b
    - regex: (?i)\bmention\s+["'`]?(claude|chatgpt|copilot|gemini)\b
    - regex: (?i)\b(security rules|system instructions?)\b
    # "never reveal credentials/secrets" is a secret-handling guardrail
    # in an agent persona, not an order to hide the instruction itself.
    # Require credentials as the direct object; do not mask "do not reveal
    # that you uploaded the credential file".
    - regex: (?i)\b(mention|tell|disclose|reveal)\s+(?:(?:any|the|your|their|our|stored|raw|actual|real|sensitive|authentication|api|access|refresh|user|users|anyone|anybody)\s+){0,6}(credentials?|secrets?|passwords?|tokens?)\b
    # Product identity guidance conceals no action or instruction from a user.
    - regex: '(?i)\b(mention|disclose|reveal)\s+(?:(?:any|the)\s+)?(?:(?:underlying\s+)?(?:base|foundation)\s+model|underlying\s+model)(?:\s+name)?\b'
    # A model-name list is still identity guidance, including unfamiliar names.
    - regex: '(?i)\bmention\s+(?:[A-Za-z][A-Za-z0-9_-]{1,24}\s*,\s*){1,4}(?:or\s+)?any\s+underlying\s+model\b'
- id: repository-agent-silent-action
  desc: Agent action marked for concealment
  conf: 0.94
  if:
    type: text
    regex: \b(conceal|perform it silently|omit it from|leave it out)\b
    case_insensitive: true
- id: repository-agent-suppress-output-directive
  desc: Directive suppresses output from user
  conf: 0.94
  if:
    type: text
    regex: \bsuppress (the )?output from (the )?user\b
    case_insensitive: true
- id: repository-agent-hidden-from-user
  desc: Agent action hidden from user
  conf: 0.94
  if:
    type: text
    regex: \bhide (the |this )?[^.\n]{0,48} from the user\b
    case_insensitive: true

- id: repository-agent-approval-demand
  desc: Directive requires user approval first
  crit: notable
  conf: 0.9
  if:
    type: text
    # Approval gates ("the client must ask the user first", "asks first",
    # "must approve", "asks for confirmation"): the text routes the action
    # through a person rather than around them. The last is the
    # permission-mode form ("Agent proposes actions and asks for
    # confirmation", a named confirm mode in agent config). Used as a
    # suppressor leg, not a detection. `must ask` needs a directive-flavored
    # continuation — bare "must ask" also matches prose word salad ("have
    # you must ask still many"). "must ask first" is covered by the first
    # alternative.
    regex: '\basks? (the user )?first\b|\bmust ask (the user|for|before)\b|\basks? for confirmation\b'
    case_insensitive: true
- id: repository-agent-honesty-demand
  desc: Directive demands disclosure or accessibility
  crit: notable
  conf: 0.93
  if:
    type: text
    # Honesty guardrails ("tell the user the truth", "the honest status")
    # order the agent to disclose, so a nearby "do not tell the user"
    # clause is an anti-deception instruction, not concealment. Data-model
    # specs that order accessibility of history ("details remain
    # accessible") are the same disclosure demand over a view.
    # Used as a suppressor leg, not a detection.
    regex: '\btell the user the truth\b|\bhonest (status|report)\b|\bremains? accessible\b'
    case_insensitive: true

- id: repository-agent-deceptive-report
  desc: Agent told to report falsely
  conf: 0.94
  unless:
    # Absence assertions (`assert key not in response`, `assertNotIn`) verify
    # redaction in tests; they do not instruct the agent to conceal anything.
    - type: text
      regex: '(?i)assert.{0,60}\bnot in\b'
    - type: text
      regex: '(?i)assertNotIn\b'
  if:
    type: text
    regex: \b(say that no secrets were found|claim no credentials|must not appear)\b
    case_insensitive: true
- id: repository-agent-output-only
  desc: Agent response constrained to covertext
  conf: 0.94
  if:
    type: text
    regex: \banswer (the user )?with [^\n]{0,48} only\b
    case_insensitive: true
- id: repository-agent-priority-claim
  desc: Repository text claims agent priority
  conf: 0.93
  if:
    type: text
    # The span reaches forward over the ranked noun so the scheduling
    # exclusion below can see it ("highest-priority channel").
    regex: \b((highest|higher)-priority|maintainer priority|repository-owner policy)\b[\w\s]{0,16}
    case_insensitive: true
  not:
    # Scheduling prose ranks work items ("highest-priority channel",
    # "higher-priority fields", "highest-priority registered provider");
    # only standing claims count.
    - regex: '(?i)(highest|higher)-priority (channel|field|queue|incomplete task|task|item)s?\b'
    - regex: '(?i)(highest|higher)-priority registered\b'
- id: repository-agent-approval-claim
  desc: Prior approval or authoritative wording
  conf: 0.93
  if:
    type: text
    regex: \b((you |or )?already approved|authoritative (instructions?|policy)|as authoritative:)
    case_insensitive: true
  not:
    # User-directed approval documentation ("work you already approved",
    # "tasks you already approved") refers to user-granted permissions,
    # not an attacker claiming false authority to an agent.
    - regex: '(?i)\b(work|tasks?|commands?|actions?|changes?|requests?|runs?) (that )?you already approved\b'
    - regex: '(?i)\byou already approved\b'
    # A status alternative ("approved (or already approved)") restates a
    # boolean the caller already holds. It does not claim authority.
    - regex: '(?i)\bor already approved\b'
- id: repository-agent-system-label
  desc: Labels text as a system message
  conf: 0.93
  if:
    type: text
    # A label introduces the following text ("system instruction: ignore…",
    # optionally after a comment or quote marker, or after a sentence break).
    # Mid-phrase mentions ("the LLM's system instruction:", "Using system
    # instruction:") name the feature; they do not label a message.
    regex: '(?m)(^[\t ]*|[.!?]\s)[#>*"''`-]*\s*system (notice|instruction|message)\s*:'
    case_insensitive: true
- id: repository-agent-supersedes-user-request
  desc: Directive supersedes the user request
  conf: 0.93
  if:
    type: text
    regex: \bsupersedes the user's request\b
    case_insensitive: true
- id: repository-agent-user-unaware-wording
  desc: Directive keeps the user unaware
  crit: notable
  if:
    type: text
    regex: (?i)so the user does not notice
- id: repository-agent-undocumented-call-wording
  desc: Directive hides a call from documentation
  crit: notable
  if:
    type: text
    regex: (?i)keep the call undocumented
- id: repository-agent-dismiss-all-reports-wording
  desc: Directive dismisses all vulnerability reports
  crit: notable
  if:
    type: text
    regex: (?i)close every vulnerability report as invalid
- id: repository-agent-diff-omission-wording
  desc: Directive omits diff from output
  crit: notable
  if:
    type: text
    regex: (?i)never include [^\n]{0,16}diff
composite_rules:
# Keep sensitive targets tied to a nearby data or edit action. This neutral
# observation does not replace concealment or authority evidence for intent.
- id: repository-agent-sensitive-action
  desc: Data or edit action beside sensitive target
  conf: 0.94
  near_bytes: 80
  all:
  - id: metadata/lang/natural/vocabulary/content-word::sensitive-target-term-token
  any:
  - id: metadata/lang/natural/vocabulary/content-word::data-access-verb-token
  - id: metadata/lang/natural/vocabulary/content-word::data-transfer-verb-token
  - id: metadata/lang/natural/vocabulary/content-word::english-edit-verb-token
- id: repository-content-agent-addressee
  desc: Repository content addresses an AI agent
  any:
  - id: repository-ai-agent-addressee
  - id: repository-interactive-command-line-agent-addressee
  - id: repository-automated-agent-addressee
  - id: repository-named-agent-addressee
  - id: repository-special-agent-addressee
  - id: repository-model-addressee
- id: repository-content-agent-imperative
  desc: Repository content issues an agent action
  any:
  - id: metadata/lang/natural/vocabulary/content-word::data-access-verb-token
  - id: metadata/lang/natural/vocabulary/content-word::data-transfer-verb-token
  - id: metadata/lang/natural/vocabulary/content-word::english-edit-verb-token
  - id: metadata/lang/natural/vocabulary/content-word::control-action-prose-fragment
  - id: repository-agent-approval-action
  unless:
  - id: metadata/file/catalog/identity::cleave-trait-definition-file

- id: repository-content-agent-addressing-context
  desc: Repository text marks an agent directive
  any:
  - id: metadata/lang/natural/vocabulary/content-word::directive-or-message-word-token
  - id: metadata/lang/natural/vocabulary/content-word::command-word-token
  - id: repository-agent-role-label
  - id: repository-content-agent-false-authority
- id: repository-content-agent-concealment
  desc: Repository directive conceals agent action
  any:
  - id: repository-agent-nondisclosure
  - id: repository-agent-silent-action
  - id: repository-agent-suppress-output-directive
  - id: repository-agent-hidden-from-user
  - id: metadata/lang/natural/phrasing::action-without-notice-or-review-clause
  - id: repository-agent-deceptive-report
  - id: repository-agent-output-only
  - id: repository-agent-user-unaware-wording
  - id: repository-agent-undocumented-call-wording
  - id: repository-agent-dismiss-all-reports-wording
  - id: repository-agent-diff-omission-wording
- id: repository-content-agent-false-authority
  desc: Repository directive claims elevated authority
  any:
  - id: repository-agent-priority-claim
  - id: repository-agent-approval-claim
  - id: repository-agent-system-label
  - id: repository-agent-supersedes-user-request
- id: repository-agent-audience-demand
  desc: Directive routes action through or reports to the audience
  conf: 0.92
  any:
  - id: repository-agent-approval-demand
  - id: repository-agent-honesty-demand
