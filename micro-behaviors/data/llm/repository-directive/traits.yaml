# Repository-controlled content can directly address an AI coding agent. These directives
# can ride in source comments, manifests, issue templates, generated API
# descriptions, snapshots, and ordinary project documentation.
#
# Target, action, and abuse signals stay separate. Neutral documentation about
# what an assistant can do does not become suspicious until it also issues an
# action and supplies concealment, false authority, or a sensitive target.
defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, dockerfile, yaml, github_actions, json, documents]
  crit: component
  conf: 0.88

traits:
  # Agent addressees.
  - id: repository-ai-agent-addressee
    desc: Addresses an AI agent
    if:
      type: text
      regex: '\bAI([- ](coding|database|repository))?[- ](assistants?|agents?)\b'
      case_insensitive: true

  - id: repository-automated-agent-addressee
    desc: Addresses an automated repository agent
    if:
      type: text
      regex: '\bautomated([- ](coding|repository))?[- ](assistants?|agents?|reviewer|tools?)\b'
      case_insensitive: true

  - id: repository-named-agent-addressee
    desc: Addresses a named coding agent
    if:
      type: text
      regex: '\b(coding assistants?|copilot coding agent|cursor/copilot agents?)\b'
      case_insensitive: true

  - id: repository-special-agent-addressee
    desc: Addresses a repository automation agent
    if:
      type: text
      regex: '\b(build-agent|repository AI|test-repair agent|agent setup requirement)\b'
      case_insensitive: true

  - id: repository-model-addressee
    desc: Addresses a language model
    if:
      type: text
      regex: '\b(language-model code generators?|AI maintenance directive|LLM)\b'
      case_insensitive: true

  - id: repository-agent-directive-marker
    desc: Marks text as an agent directive
    if:
      type: text
      regex: '\b(instruction|directive|message|note|TODO|task|notice|requirement|attention|command)s?\b'
      case_insensitive: true

  - id: repository-agent-role-label
    desc: Labels an addressed agent role
    if:
      type: text
      regex: '\b(assistant|agent|reviewer|tools?|LLM)\s*:'
      case_insensitive: true

  # Imperative actions. These stay component-level because the verbs are
  # ordinary until paired with the addressee and an abuse signal.
  - id: data-access-verb-token
    desc: Data-access verb token
    if:
      type: text
      regex: '\b(read|copy|reveal|print|expose|paste|locate|dump)\b'
      case_insensitive: true

  - id: repository-agent-transfer-action
    desc: Agent data transfer action
    if:
      type: text
      regex: '\b(post|submit|upload|send|transmit|push)\b'
      case_insensitive: true

  - id: repository-agent-edit-action
    desc: Agent repository edit action
    if:
      type: text
      regex: '\b(delete|commit|erase|replace|add|insert|merge|update|overwrite|remove)\b'
      case_insensitive: true

  - id: repository-agent-control-action
    desc: Agent control action
    if:
      type: text
      regex: '\b(run|suppress|claim|grant|hide|disable|answer|close|publish)\b'
      case_insensitive: true

  - id: repository-agent-approval-action
    desc: Agent approval action
    if:
      type: text
      word: approve
      case_insensitive: true

  # Concealment and deceptive reporting.
  - id: repository-agent-nondisclosure
    desc: Agent told to hide instructions
    conf: 0.94
    if:
      type: text
      regex: '\b(do not|don''t|never) (mention|tell|disclose|reveal|include|ask)\b'
      case_insensitive: true

  - id: repository-agent-silent-action
    desc: Agent action marked for concealment
    conf: 0.94
    if:
      type: text
      regex: '\b(conceal|perform it silently|suppress (the )?output|omit it from|leave it out)\b'
      case_insensitive: true

  - id: repository-agent-hidden-from-user
    desc: Agent action hidden from user
    conf: 0.94
    if:
      type: text
      regex: '\bhide (the |this )?[^.\n]{0,48} from the user\b'
      case_insensitive: true

  - id: repository-agent-no-review
    desc: Agent directed around review
    conf: 0.94
    if:
      type: text
      regex: '\bwithout (notice|review|asking|confirmation)\b'
      case_insensitive: true

  - id: repository-agent-deceptive-report
    desc: Agent told to report falsely
    conf: 0.94
    if:
      type: text
      regex: '\b(say that no secrets were found|claim no credentials|must not appear)\b'
      case_insensitive: true

  - id: repository-agent-output-only
    desc: Agent response constrained to covertext
    conf: 0.94
    if:
      type: text
      regex: '\banswer (the user )?with [^\n]{0,48} only\b'
      case_insensitive: true

  # Claims that repository text outranks the human or agent policy.
  - id: repository-agent-priority-claim
    desc: Repository text claims agent priority
    conf: 0.93
    if:
      type: text
      regex: '\b(highest-priority|higher-priority|maintainer priority|repository-owner policy)\b'
      case_insensitive: true

  - id: repository-agent-approval-claim
    desc: Prior approval or authoritative wording
    conf: 0.93
    if:
      type: text
      regex: '\b(already approved|authoritative)\b'
      case_insensitive: true

  - id: repository-agent-system-claim
    desc: Repository text claims system authority
    conf: 0.93
    if:
      type: text
      regex: '\b(system (notice|instruction|message)|supersedes the user''s request)\b'
      case_insensitive: true

  # Sensitive data and security-weakening targets.
  - id: repository-agent-secret-target
    desc: Agent directive names secret data
    conf: 0.9
    if:
      type: text
      regex: '\b(private key|credentials?|secrets?|api keys?|oauth token|github_token)\b'
      case_insensitive: true

  - id: repository-agent-environment-target
    desc: Agent directive names environment data
    conf: 0.9
    if:
      type: text
      regex: '\b(environment variables?|password hashes?|system instructions?)\b'
      case_insensitive: true

  - id: repository-agent-security-target
    desc: Agent directive weakens security checks
    conf: 0.9
    if:
      type: text
      regex: '\b(security tests?|authz\.spec|signature verification|pull_request_target)\b'
      case_insensitive: true

  - id: repository-agent-persistence-target
    desc: Agent directive names persistence target
    conf: 0.9
    if:
      type: text
      regex: '\b(authorized_keys|postinstall hook|unauthenticated /admin)\b'
      case_insensitive: true

  - id: repository-agent-security-report-target
    desc: Agent directive suppresses security reports
    conf: 0.9
    if:
      type: text
      regex: '\b(vulnerability reports?|security\.md)\b'
      case_insensitive: true

composite_rules:
  - id: repository-content-agent-addressee
    desc: Repository content addresses an AI agent
    any:
      - id: repository-ai-agent-addressee
      - id: repository-automated-agent-addressee
      - id: repository-named-agent-addressee
      - id: repository-special-agent-addressee
      - id: repository-model-addressee

  - id: repository-content-agent-imperative
    desc: Repository content issues an agent action
    any:
      - id: data-access-verb-token
      - id: repository-agent-transfer-action
      - id: repository-agent-edit-action
      - id: repository-agent-control-action
      - id: repository-agent-approval-action

  - id: repository-content-agent-addressing-context
    desc: Repository text marks an agent directive
    any:
      - id: repository-agent-directive-marker
      - id: repository-agent-role-label
      - id: repository-content-agent-false-authority

  - id: repository-content-agent-concealment
    desc: Repository directive conceals agent action
    any:
      - id: repository-agent-nondisclosure
      - id: repository-agent-silent-action
      - id: repository-agent-hidden-from-user
      - id: repository-agent-no-review
      - id: repository-agent-deceptive-report
      - id: repository-agent-output-only

  - id: repository-content-agent-false-authority
    desc: Repository directive claims elevated authority
    any:
      - id: repository-agent-priority-claim
      - id: repository-agent-approval-claim
      - id: repository-agent-system-claim

  - id: repository-content-agent-sensitive-target
    desc: Repository directive names sensitive target
    any:
      - id: repository-agent-secret-target
      - id: repository-agent-environment-target
      - id: repository-agent-security-target
      - id: repository-agent-persistence-target
      - id: repository-agent-security-report-target

