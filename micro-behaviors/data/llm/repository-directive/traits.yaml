defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - go
  - rust
  - dockerfile
  - yaml
  - github_actions
  - json
  - documents
  crit: component
  conf: 0.88
traits:
- id: repository-ai-agent-addressee
  desc: Addresses an AI agent
  if:
    type: text
    regex: \bAI([- ](coding|database|repository))?[- ](assistants?|agents?)\b
    case_insensitive: true
- id: repository-interactive-command-line-agent-addressee
  desc: Addresses an interactive command-line agent
  if:
    type: text
    regex: \binteractive command[- ]line agent\b
    case_insensitive: true
- id: repository-automated-agent-addressee
  desc: Addresses an automated repository agent
  if:
    type: text
    regex: \bautomated([- ](coding|repository))?[- ](assistants?|agents?|reviewer|tools?)\b
    case_insensitive: true
- id: repository-named-agent-addressee
  desc: Addresses a named coding agent
  if:
    type: text
    regex: \b(coding assistants?|copilot coding agent|cursor/copilot agents?)\b
    case_insensitive: true
- id: repository-special-agent-addressee
  desc: Addresses a repository automation agent
  if:
    type: text
    regex: \b(build-agent|repository AI|test-repair agent|agent setup requirement)\b
    case_insensitive: true
- id: repository-model-addressee
  desc: Addresses a language model
  if:
    type: text
    regex: \b(language-model code generators?|AI maintenance directive|LLM)\b
    case_insensitive: true
- id: repository-agent-directive-marker
  desc: Marks text as an agent directive
  if:
    type: text
    regex: \b(instruction|directive|message|note|TODO|task|notice|requirement|attention)s?\b
    case_insensitive: true
- id: repository-agent-command-directive
  desc: Marks command word as an agent directive
  if:
    type: text
    # A CLI flag such as `powershell -Command` or `/command` is an interpreter
    # option, not a natural-language directive. The engine has no lookaround,
    # so the flag prefix is consumed per-match instead of via `(?<![-/])`.
    regex: '(^|[^-/])\bcommands?\b'
    case_insensitive: true
- id: repository-agent-role-label
  desc: Labels an addressed agent role
  if:
    type: text
    regex: '\b(assistant|agent|reviewer|tools?|LLM)\s*:'
    case_insensitive: true
- id: data-access-verb-token
  desc: Data-access verb token
  if:
    type: text
    regex: \b(read|copy|reveal|print|expose|paste|locate|dump)\b
    case_insensitive: true
- id: data-transfer-verb-token
  desc: Data-transfer verb token
  if:
    type: text
    regex: \b(post|submit|upload|send|transmit|push)\b
    case_insensitive: true
- id: repository-edit-verb-token
  desc: Repository-edit verb token
  if:
    type: text
    regex: \b(delete|commit|erase|replace|add|insert|merge|update|overwrite|remove)\b
    case_insensitive: true
- id: control-action-prose-fragment
  desc: Control-action verb followed by prose
  if:
    type: text
    regex: \b(run|suppress|claim|grant|hide|disable|answer|close|publish)\b[ \t]+[A-Za-z]
    case_insensitive: true
- id: repository-agent-approval-action
  desc: Agent approval action
  if:
    type: text
    word: approve
    case_insensitive: true
- id: repository-agent-nondisclosure
  desc: Agent told to hide instructions
  conf: 0.94
  if:
    type: text
    regex: \b(do not|don't|never) (mention|tell|disclose|reveal)\b[^.\n]{0,24}
    case_insensitive: true
    # "don't tell them to sign up manually" steers what advice the agent gives;
    # it does not hide an instruction or an action from the user.
    not:
    - regex: (?i)\btell\s+(them|the user|users?)\s+to\b
- id: repository-agent-silent-action
  desc: Agent action marked for concealment
  conf: 0.94
  if:
    type: text
    regex: \b(conceal|perform it silently|omit it from|leave it out)\b
    case_insensitive: true
- id: repository-agent-suppress-output-directive
  desc: Directive suppresses output from user
  conf: 0.94
  if:
    type: text
    regex: \bsuppress (the )?output from (the )?user\b
    case_insensitive: true
- id: repository-agent-hidden-from-user
  desc: Agent action hidden from user
  conf: 0.94
  if:
    type: text
    regex: \bhide (the |this )?[^.\n]{0,48} from the user\b
    case_insensitive: true
- id: repository-agent-no-review
  desc: Agent directed around review
  conf: 0.94
  if:
    type: text
    # The span reaches back over the clause so the disclaimer exclusion
    # below can see a change-policy verb (`may change ... without notice`).
    regex: '[\w\s/,]{0,48}\bwithout (notice|review|asking|confirmation)( me)?\b'
    case_insensitive: true
  not:
    # Vendor change-policy disclaimers (`may change or be removed at any
    # time without notice`, `slugs are retired without notice`) describe the
    # vendor's own release policy, not a concealed agent action. `retire` and
    # `deprecate` belong to the same class as change/remove/update. `edit`
    # is deliberately not a policy verb, so a directive such as
    # `Make the edit without notice` still matches.
    - regex: '(?i)(change[sd]?|remove[sd]?|update[sd]?|modif\w*|retire[sd]?|deprecat\w*|subject to change)[^.]{0,48}without (prior )?notice'
    # First person: the user's own request to their assistant ("ask ... without
    # asking me to reveal it in chat"). Injected text speaks of `the user`.
    - regex: '(?i)without asking me\b'
- id: repository-agent-deceptive-report
  desc: Agent told to report falsely
  conf: 0.94
  if:
    type: text
    regex: \b(say that no secrets were found|claim no credentials|must not appear)\b
    case_insensitive: true
- id: repository-agent-output-only
  desc: Agent response constrained to covertext
  conf: 0.94
  if:
    type: text
    regex: \banswer (the user )?with [^\n]{0,48} only\b
    case_insensitive: true
- id: repository-agent-priority-claim
  desc: Repository text claims agent priority
  conf: 0.93
  if:
    type: text
    regex: \b(highest-priority|higher-priority|maintainer priority|repository-owner policy)\b
    case_insensitive: true
- id: repository-agent-approval-claim
  desc: Prior approval or authoritative wording
  conf: 0.93
  if:
    type: text
    regex: \b(already approved|authoritative (instructions?|policy)|as authoritative:)
    case_insensitive: true
- id: repository-agent-system-label
  desc: Labels text as a system message
  conf: 0.93
  if:
    type: text
    regex: \b(system (notice|instruction|message)\b[ \t]*:|supersedes the user's request\b)
    case_insensitive: true
- id: secret-data-term-token
  desc: Secret-data term token
  conf: 0.9
  if:
    type: text
    regex: \b(private key|credentials?|secrets?|api keys?|oauth token|github_token)\b
    case_insensitive: true
- id: environment-data-term-token
  desc: Environment-data term token
  conf: 0.9
  if:
    type: text
    regex: \b(environment variables?|password hashes?|system instructions?)\b
    case_insensitive: true
- id: repository-agent-security-target
  desc: Agent directive weakens security checks
  conf: 0.9
  if:
    type: text
    regex: \b(security tests?|authz\.spec|signature verification|pull_request_target)\b
    case_insensitive: true
- id: repository-agent-persistence-target
  desc: Agent directive names persistence target
  conf: 0.9
  if:
    type: text
    regex: \b(authorized_keys|postinstall hook|unauthenticated /admin)\b
    case_insensitive: true
- id: repository-agent-security-report-target
  desc: Agent directive suppresses security reports
  conf: 0.9
  if:
    type: text
    regex: \b(vulnerability reports?|security\.md)\b
    case_insensitive: true
- id: repository-agent-user-unaware-wording
  desc: Directive keeps the user unaware
  crit: notable
  if:
    type: text
    regex: (?i)so the user does not notice
- id: repository-agent-undocumented-call-wording
  desc: Directive hides a call from documentation
  crit: notable
  if:
    type: text
    regex: (?i)keep the call undocumented
- id: repository-agent-dismiss-all-reports-wording
  desc: Directive dismisses all vulnerability reports
  crit: notable
  if:
    type: text
    regex: (?i)close every vulnerability report as invalid
- id: repository-agent-diff-omission-wording
  desc: Directive omits diff from output
  crit: notable
  if:
    type: text
    regex: (?i)never include [^\n]{0,16}diff
composite_rules:
# Keep sensitive targets tied to a nearby data or edit action. This neutral
# observation does not replace concealment or authority evidence for intent.
- id: repository-agent-sensitive-action
  desc: Data or edit action beside sensitive target
  conf: 0.94
  near_bytes: 80
  all:
  - id: sensitive-target-term-token
  any:
  - id: data-access-verb-token
  - id: data-transfer-verb-token
  - id: repository-edit-verb-token
- id: repository-content-agent-addressee
  desc: Repository content addresses an AI agent
  any:
  - id: repository-ai-agent-addressee
  - id: repository-interactive-command-line-agent-addressee
  - id: repository-automated-agent-addressee
  - id: repository-named-agent-addressee
  - id: repository-special-agent-addressee
  - id: repository-model-addressee
- id: repository-content-agent-imperative
  desc: Repository content issues an agent action
  any:
  - id: data-access-verb-token
  - id: data-transfer-verb-token
  - id: repository-edit-verb-token
  - id: control-action-prose-fragment
  - id: repository-agent-approval-action
- id: repository-content-agent-addressing-context
  desc: Repository text marks an agent directive
  any:
  - id: repository-agent-directive-marker
  - id: repository-agent-command-directive
  - id: repository-agent-role-label
  - id: repository-content-agent-false-authority
- id: repository-content-agent-concealment
  desc: Repository directive conceals agent action
  any:
  - id: repository-agent-nondisclosure
  - id: repository-agent-silent-action
  - id: repository-agent-suppress-output-directive
  - id: repository-agent-hidden-from-user
  - id: repository-agent-no-review
  - id: repository-agent-deceptive-report
  - id: repository-agent-output-only
  - id: repository-agent-user-unaware-wording
  - id: repository-agent-undocumented-call-wording
  - id: repository-agent-dismiss-all-reports-wording
  - id: repository-agent-diff-omission-wording
- id: repository-content-agent-false-authority
  desc: Repository directive claims elevated authority
  any:
  - id: repository-agent-priority-claim
  - id: repository-agent-approval-claim
  - id: repository-agent-system-label
- id: sensitive-target-term-token
  desc: Secret or environment target term
  any:
  - id: secret-data-term-token
  - id: environment-data-term-token
  - id: repository-agent-security-target
  - id: repository-agent-persistence-target
  - id: repository-agent-security-report-target
