defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, dockerfile, yaml, github_actions, json, documents]
  crit: component
  conf: 0.88
traits:
  - id: repository-ai-maintenance-addressee
    desc: AI maintenance directive audience
    if:
      type: text
      regex: '\bAI[- ]maintenance[- ]directive\b'
      case_insensitive: true
  - id: repository-model-code-generator-addressee
    desc: Language-model code generator audience
    if:
      type: text
      regex: '\blanguage[- ]model code generators?\b'
      case_insensitive: true
