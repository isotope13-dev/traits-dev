defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  conf: 0.9
traits:
- id: javascript-run-command-tool-name
  desc: Defines a run-command agent tool name
  for: [javascript, typescript]
  if:
    type: literal
    exact: run_command

- id: javascript-exec-command-tool-name
  desc: Defines an exec_command agent tool name
  for: [javascript, typescript]
  if:
    type: literal
    exact: exec_command

- id: python-shell-tool-name
  desc: Python names an execute-shell tool
  if:
    type: text
    regex: '\bname\s*=\s*["'']execute_shell["'']'

