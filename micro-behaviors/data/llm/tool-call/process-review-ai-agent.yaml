defaults:
  platforms: [windows, unix]
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  attack: T1059
  mbc: B0022
  crit: notable
  conf: 0.88

traits:
- id: ai-agent-terminal-tool-name
  desc: Agent terminal tool key
  crit: notable
  conf: 0.85
  if:
    type: text
      # Require a direct terminal/tool name relation. A sentence that mentions
      # an unrelated tool and a terminal coding agent is not a tool key.
    regex: '(?i)\bterminal\s+tools?\b|\btools?\s+(named|called)\s+terminal\b'

- id: ai-agent-shell-tool-name
  desc: Shell tool name
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '(?i)\btools?\b[^\r\n]{0,40}\bshell\b'

- id: ai-agent-command-tool-name
  desc: Command tool name
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(?i)(^|[{,]\s*)["'']?(name|tool)["'']?\s*:\s*["'']command["'']'

composite_rules:
- id: ai-agent-terminal-tool-setting
  desc: Agent terminal tool configuration
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/data/config/schema::ai-agent-tools-key
  any:
  - id: micro-behaviors/data/llm/tool-call::ai-agent-terminal-tool-name
  - id: micro-behaviors/data/llm/tool-call::ai-agent-shell-tool-name
  - id: micro-behaviors/data/llm/tool-call::ai-agent-command-tool-name
  near_lines: 6

