# Tool-call interfaces that expose system settings to the model.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [source, json]

traits:
  - id: settings-tool-schema-enum
    desc: LLM tool schema enumerates system settings
    conf: 0.9
    if:
      # A tool-call interface whose enum lists system-setting resources
      # (volume, brightness, wifi, ...) is a desktop-control tool surface;
      # audio handling beside it is the tool's implementation.
      type: text
      regex: '(?i)["'']enum["'']\s*:\s*\[[^\]]{0,300}"(volume|mute|brightness|bluetooth)"[^\]]{0,300}\]'
