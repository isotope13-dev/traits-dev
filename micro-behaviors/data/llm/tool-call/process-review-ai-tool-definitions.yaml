defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-agent-run-command-name
    desc: Python agent run-command tool name
    conf: 0.9
    if:
      type: literal
      exact: run_command
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/data/control-flow/dispatch/named::python-run-command-call
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
      - id: metadata/lang/source/naming/action/function-name::python-run-command-function

  - id: python-agent-shell-command-desc
    desc: Python agent shell-command description
    conf: 0.9
    if:
      type: literal
      exact: Execute shell command

  - id: python-agent-run-command-function
    desc: Python agent run-command binding
    conf: 0.9
    if:
      type: text
      substr: function=run_command

  - id: python-agent-python-repl-name
    desc: Python agent Python REPL name
    conf: 0.9
    if:
      type: literal
      exact: python_repl

  - id: python-agent-python-code-desc
    desc: Python agent Python-code description
    conf: 0.9
    if:
      type: literal
      substr: Execute Python code

  - id: python-agent-python-repl-function
    desc: Python agent Python REPL binding
    conf: 0.9
    if:
      type: text
      substr: function=python_repl

composite_rules:
  - id: python-agent-shell-command-tool
    desc: Python agent exposes a shell-command tool
    conf: 0.95
    all:
      - id: micro-behaviors/data/llm/tool-call::python-agent-run-command-name
      - id: micro-behaviors/data/llm/tool-call::python-agent-shell-command-desc
      - id: micro-behaviors/data/llm/tool-call::python-agent-run-command-function
    near_bytes: 700

  - id: python-agent-python-repl-tool
    desc: Python agent exposes a Python REPL tool
    conf: 0.95
    all:
      - id: micro-behaviors/data/llm/tool-call::python-agent-python-repl-name
      - id: micro-behaviors/data/llm/tool-call::python-agent-python-code-desc
      - id: micro-behaviors/data/llm/tool-call::python-agent-python-repl-function
    near_bytes: 900
