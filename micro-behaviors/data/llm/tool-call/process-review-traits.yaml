defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.88

traits:
  - id: agent-tool-input-field-token
    desc: Tool execution input field name
    crit: component
    conf: 0.9
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)tool_(name|input)'

  - id: execute-command-tool-name
    crit: notable
    desc: execute_command tool name
    if:
      type: string_literal
      exact: execute_command

