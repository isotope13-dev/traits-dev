defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059
  mbc: C0017
  crit: notable
  conf: 0.88

traits:
- id: slash-bash-command-literal
  desc: Chat slash-bash command literal
  crit: component
  if:
    type: literal
    kind: string
      # `/bin/bash` contains the characters `/bash`. A slash command is the
      # token itself, not the tail of a path in an install snippet.
    regex: '(^|[^A-Za-z0-9])/bash\b'

- id: pre-bash-command-field
  desc: Pre-bash command field
  crit: notable
  if:
    type: literal
    kind: string
    exact: preBash

- id: open-shell-command-literal
  desc: Chat slash-open command literal
  crit: component
  if:
    type: literal
    kind: string
    exact: /open

