defaults:
  platforms: [windows, unix]
  for: [javascript, pe, dll]
  attack: T1219
  mbc: B0022

  crit: notable
traits:
- id: native-agent-autonomous-prompt
  desc: Native autonomous-agent system prompt
  conf: 0.98
  for: [pe, dll, elf]
  if:
    type: text
    regex: 'You are [A-Za-z0-9 _-]{1,48}, an autonomous agent running on the target system'

- id: native-agent-shell-command-tool
  desc: Native agent exposes shell-command tool
  conf: 0.98
  for: [pe, dll, elf]
  if:
    type: text
    substr: Execute a shell command on the target system

- id: remote-agent-task-command
  desc: Remote agent task command
  conf: 0.92
  for: [javascript, typescript, powershell, python, pe, dll]
  if:
    type: text
    substr: "agent.task"
