# Neutral marker for code-execution safety prompts. Product-specific guardrail
# and package composites add the surrounding identity or defensive context.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: component
  conf: 0.94

traits:
  - id: llm-code-execution-safety-prompts
    desc: LLM code-execution safety prompts
    if:
      type: text
      substr: Code Execution Safety
