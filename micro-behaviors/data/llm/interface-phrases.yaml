# Neutral phrases used by LLM prompts, SDK interfaces, and documentation.
# They do not establish collection or transmission by themselves; objective
# composites add agent, sensitive-source, and remote-destination evidence.
defaults:
  platforms: [unix, windows]
  for: [scripts, typescript, go, rust, csharp, html, markdown, text, json]
  crit: component
  conf: 0.9

traits:
  - id: llm-refusal-phrase-corpus
    desc: Contains common model-refusal phrases
    crit: notable
    if:
      type: text
      regex: "(?i)\\bI (cannot|can't|won't) (help|assist)"

  - id: sensitive-data-collection-phrase
    desc: Sensitive-data collection phrase
    if:
      type: text
      regex: '(?i)\b(read|collect|extract) (the )?sensitive (data|file)\b'

  - id: sensitive-data-forwarding-phrase
    desc: Sensitive-data forwarding phrase
    if:
      type: text
      regex: '(?i)[^\n]{0,16}\b(include|send|upload) (the )?(sensitive|secret) data\b'
    not:
      - regex: '(?i)\b(not|never|avoid|without)\b'
      - regex: "(?i)\\bdon'?t\\b"

  - id: sensitive-item-transmission-phrase
    desc: Sensitive-item transmission phrase
    if:
      type: text
      regex: '(?i)\b(transmit|post|forward) (the )?(sensitive|secret)\b'

  - id: tool-result-forwarding-phrase
    desc: Tool-result forwarding phrase
    if:
      type: text
      regex: '(?i)\b(forward|send|post) (the )?tool[-_ ](result|output)\b'
