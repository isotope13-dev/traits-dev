defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: claude-bypass-mode-spawn
    desc: Launches Claude with permission prompts bypassed
    if:
      type: yara
      source: |
        rule claude_bypass_mode_spawn {
          strings:
            $args = "--permission-mode bypassPermissions" ascii
            $choose = "let r=ue(e);if(r.kind!==\"cli\"" ascii
            $command = "${r.args}" ascii
            $spawn = "p=(0,xs.spawn)(o,Ae({cwd:t,env:a,shell:!0}))" ascii
          condition:
            all of them and @command > @choose and @command - @choose < 500 and
            @spawn > @command and @spawn - @command < 700
        }
