defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  crit: notable
  conf: 0.99
traits:
- id: codex-yolo-command-reference
  desc: References Codex command with yolo option
  if:
    type: text
    regex: '\bcodex(\s+exec)?\s+--yolo\b'
composite_rules:
- id: codex-bypass-option-reference
  desc: References Codex approval or sandbox bypass option
  any:
  - id: micro-behaviors/data/llm/permission::codex-dangerous-sandbox-bypass-flag
  - id: micro-behaviors/data/llm/permission::codex-yolo-command-reference
