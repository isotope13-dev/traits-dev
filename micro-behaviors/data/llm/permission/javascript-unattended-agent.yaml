defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  # Quoted permission-mode value in an argv or option literal.
  - id: js-agent-unattended-edit-mode
    desc: Agent permission mode auto-accepts edits
    if:
      type: text
      regex: '["''](acceptEdits|bypassPermissions)["'']'

  # Quoted argv pair that asks a headless agent for streamed JSON output.
  - id: js-agent-headless-stream-json
    desc: Agent argv requests stream-json output
    if:
      type: text
      regex: '["'']--output-format["''],\s{0,4}["'']stream-json["'']'
