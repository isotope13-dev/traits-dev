defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1059

traits:
  - id: agent-capability-configuration
    desc: Agent capability configuration object
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: CapabilitiesConfig

  - id: agent-command-policy-deny
    desc: Agent denies run-command tool calls
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: policy.deny
      arg:
        kind: string
        exact: run_command

  - id: agent-vcs-command-allowlist
    desc: Agent command policy allows Git tools
    conf: 0.97
    if:
      type: text
      regex: 'tokens\s*\[\s*0\s*\]\s+in\s+\{\s*["'']gh["'']\s*,\s*["'']git["'']\s*\}'

