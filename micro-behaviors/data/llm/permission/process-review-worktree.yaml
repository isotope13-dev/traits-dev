defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
- id: agent-workspace-write-sandbox-setting
  desc: Agent config restricts writes to workspace
  if:
    type: literal
    regex: 'sandbox_mode\s*=\s*"workspace-write"'
- id: agent-sandbox-network-disabled-setting
  desc: Agent config disables sandbox network access
  if:
    type: literal
    regex: 'network_access\s*=\s*false'
  # The enable direction matters as much as the disable one: installer
  # tooling that flips an AI coding agent's workspace sandbox to
  # network-enabled (e.g. writing network_access = true into Codex
  # config.toml) widens what every later agent session may reach.
- id: agent-sandbox-network-enabled-setting
  desc: Agent config enables sandbox network access
  if:
    type: literal
    regex: 'network_access\s*=\s*true'
