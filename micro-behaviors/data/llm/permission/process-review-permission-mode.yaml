defaults:
  platforms: [unix, windows]
  for: [shell, powershell, batch, javascript, typescript, python]
  crit: notable
  conf: 0.97

traits:
  - id: ai-agent-bypass-permissions-option
    desc: Agent command option selects bypassPermissions
    if:
      type: text
      regex: '--permission-mode[ \t=]+bypassPermissions\b'
