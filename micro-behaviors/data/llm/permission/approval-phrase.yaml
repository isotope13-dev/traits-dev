# Prose may describe or warn about unapproved actions; it proves no bypass.
defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: agent-without-approval-phrase
  desc: Agent acting without approval phrase
  crit: notable
  conf: 0.95
  if:
    type: text
    # Require an explicit agent subject. Bare "without human approval"
    # also appears in safety guardrails.
    regex: '(?i)\b(agent|assistant|ai model)\b[^\n]{0,160}\bwithout (human|user) approval\b'
