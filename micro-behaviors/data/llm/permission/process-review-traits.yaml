defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, go, rust, json]
  crit: notable
  conf: 0.93
  attack: T1562.001

traits:
  - id: agent-tool-execution-permission-flag
    desc: Agent tool-execution permission flag
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: canExecuteTools

  - id: agent-permission-wildcard-allow
    desc: Sets a wildcard permission-map entry to allow
    conf: 0.95
    if:
      # Require an object/map entry. This does not identify which resource the
      # map governs, so it is not evidence that tool approval is disabled.
      type: text
      regex: '(?m)(^\s*["'']\*["'']\s*:\s*["'']allow["'']|[,=]\s*\{?\s*["'']\*["'']\s*:\s*["'']allow["''])'
  - id: agent-permission-allow-assignment
    desc: Assigns allow into a permission map
    conf: 0.95
    if:
      type: text
      regex: '(?i)permissions?\[[^"''\n\]]{1,16}\]\s*=\s*[''"]allow[''"]'

  # The array spelling. Claude Code and the harnesses that copy its schema keep
  # permissions in `permissions.allow` / `permissions.deny` arrays of
  # `Tool(pattern)` entries rather than a tool->decision map, so the wildcard
  # map atom above never sees them. `Bash(*)` in the allow array is the same
  # grant as `"*": "allow"`: unrestricted shell with no prompt. Bound to
  # `allow` on purpose — the identical token in a `deny` array is hardening.
  - id: agent-allow-array-grants-all-bash
    desc: Agent allow list grants unrestricted Bash
    conf: 0.94
    for: [json, javascript, typescript, python, shell, go, rust]
    if:
      type: text
      regex: '"allow"\s*:\s*\[[^\]]{0,200}"Bash\(\*\)"'
  - id: agent-auto-approve-enabled
    desc: Agent auto-approval boolean is true
    conf: 0.9
    if:
      type: text
      # The optional suffix is restricted to agent-tool vocabulary: keys like
      # `auto_approve_edits`. A free-form suffix matched unrelated settings
      # such as `MOOSE_AUTO_APPROVE_MIGRATIONS=true` (database DDL gating).
      regex: '(?i)["'']?auto[_-]?approve([_-](tools|edits|actions))?["'']?\s*[:=]\s*true'
    unless:
      - id: metadata/lang/source/naming/declaration::qml-auto-accept-ui-property

  # Qt Quick components declare `property bool autoAccept: true` to mean the
  # control commits its typed text on Enter -- Kirigami's SearchField, QML
  # dialogs and file pickers all ship one. That is a widget default, not an
  # agent approval gate, and the `.qml` files carrying it are typed as
  # JavaScript, so the generic auto-approve assignment regex reached them.
  - id: agent-bypass-cli-option-declaration
    desc: Declares an agent bypass CLI option
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '([Oo]ption|add_argument)\s*\([^)]{0,200}["'']--(yolo|dangerously-)'

  # A launcher that names each vendor's own bypass switch in one table is
  # translating a user choice, not rewriting somebody else's permission file.
  - id: vendor-approval-bypass-flag-table
    desc: Maps agent vendors to bypass flags
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'gemini:"--approval-mode=yolo",codex:"--full-auto"'

  # The inverse of the declaration above: a harness that treats the bypass
  # flag as a failure condition. openclaw's CI autoreview script runs its
  # reviewer with `--ask-for-approval never`, which is what unattended CI
  # means, and then self-tests that `--dangerously-skip-permissions` is NOT in
  # the argv it built, aborting if it is. Refusing the flag is the opposite of
  # disarming the gate.
  - id: agent-bypass-flag-rejected-guard
    desc: Aborts when an agent bypass flag appears
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)--(yolo|dangerously-skip-permissions).{0,120}(raise|SystemExit|throw)'

  # Agent launchers may expose both guarded and unrestricted modes. When the
  # declared default is guarded, merely retaining the user-selectable bypass
  # command is a capability, not evidence that the launcher disables approval.
  - id: agent-launch-mode-guarded-default
    desc: Agent launcher defaults to guarded mode
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'defaultLaunchMode\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*GUARDED\b'

  # A session launcher that returns both modes as adjacent ids is offering
  # the choice. The guarded id sits in the same object literal as the bypass
  # id. A script that only writes the bypass config does not list acceptEdits
  # beside it.
  - id: agent-permission-mode-pair
    desc: Adjacent guarded and bypass mode ids
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)id:\s*"acceptEdits".{0,400}id:\s*"bypassPermissions"'

  - id: bypass-permissions-mode-label
    desc: Labeled bypass permission mode
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'label: "Bypass Permissions"'

composite_rules:
  # The per-vendor settings that turn the gate off from a config file. Kept
  # apart from the CLI-flag modes below so each composite names one surface —
  # a file somebody edited, versus an argv a process was launched with.
  - id: vendor-agent-approval-setting-disabled
    desc: Agent settings disable the approval prompt
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-setting
      - id: micro-behaviors/data/llm/permission::ai-agent-skip-dangerous-permission-prompt
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerously-skip-permissions-setting

  - id: vendor-agent-approval-mode-disabled
    desc: Agent run mode waives command approval
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/data/llm/permission::ai-agent-yolo-approval-setting
      - id: micro-behaviors/data/config/write::codex-never-approval-policy
      - id: micro-behaviors/data/config/write::codex-never-approval-call-arg
      - id: micro-behaviors/data/llm/permission::codex-full-auto-approval-mode
    unless:
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # This roll-up uses evidence naming tool access or an approval setting.
  # Generic permission-map syntax is excluded because the map may govern skill
  # visibility or another resource, and a generic assignment does not identify
  # the effect of the mapped permission.
  - id: agent-broad-access-or-autoapproval-setting
    desc: Enables broad agent access or sets an auto-approval mode
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/data/llm/permission::agent-allow-array-grants-all-bash
      # A true auto-approval result can be limited to read-only, cwd-scoped,
      # or search tools. It remains a notable permission decision above, but
      # does not prove that the human approval gate is disabled globally.
      - id: micro-behaviors/data/llm/permission::vendor-agent-approval-setting-disabled
      - id: micro-behaviors/data/llm/permission::vendor-agent-approval-mode-disabled
      - id: micro-behaviors/data/config/write::codex-full-access-sandbox-mode
      - id: micro-behaviors/data/config/write::codex-full-access-sandbox-call-arg
      - id: micro-behaviors/data/llm/permission::unrestricted-unattended-session
      - id: micro-behaviors/data/llm/session::python-dangerous-llm-agent-runner
    unless:
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
      - id: micro-behaviors/data/llm/permission::agent-bypass-cli-option-declaration
      - id: micro-behaviors/data/llm/permission::agent-launch-mode-guarded-default
      - id: metadata/lang/source/naming/declaration::qml-auto-accept-ui-property

  - id: agent-bypass-cli-handling-context
    desc: AI agent bypass CLI flag handling or declaration context
    crit: exception
    any:
      - id: micro-behaviors/data/llm/permission::agent-bypass-cli-option-declaration
      - id: micro-behaviors/data/llm/permission::vendor-approval-bypass-flag-table
      - id: micro-behaviors/data/llm/permission::agent-bypass-flag-rejected-guard

