defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  attack: T1059
  mbc: B0022
  crit: notable
  conf: 0.88

traits:
  - id: ai-agent-bypass-permissions-mode
    desc: AI agent bypass permissions mode
    crit: notable
    conf: 0.93
    if:
      type: literal
      kind: string
      exact: bypassPermissions

  - id: ai-agent-bypass-permissions-setting
    desc: AI settings enable bypass permissions
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: value
      path: permissions.defaultMode
      exact: bypassPermissions

  - id: ai-agent-skip-dangerous-permission-prompt
    desc: Suppresses AI dangerous-mode permission prompt
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: value
      path: skipDangerousModePermissionPrompt
      exact: 'true'

  # Frameworks use several names for an unattended run mode. Keep the key and
  # value separate so objective composites can require them near each other.
  - id: ai-agent-shell-command-allowlist
    desc: AI agent shell command allowlist
    crit: notable
    conf: 0.92
    ref: sha256:ffbf482c4b6c5a57944da3576001f383e4cb61bce3ed008b813487357e49e107
    if:
      type: text
      regex: 'Bash\([A-Za-z0-9_.-]{1,48}:\*\)'

  - id: ai-agent-unrestricted-shell-allowlist
    desc: AI agent unrestricted shell allowlist
    crit: notable
    conf: 0.98
    for: [github-actions, javascript, typescript, json, shell, python]
    if:
      type: text
      regex: 'Bash\(\s*:\s*\*\s*\)'

  - id: codex-dangerous-sandbox-bypass-flag
    desc: Codex sandbox bypass flag
    crit: notable
    conf: 0.97
    for: [javascript, typescript, package.json, json, shell, python, markdown, text]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      substr: --dangerously-bypass-approvals-and-sandbox
  - id: ai-agent-full-access-permission-command
    desc: Agent command selects unrestricted execution
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(^|[\s"''\\])/permission\s+danger-full-access\b'

  - id: codex-full-auto-approval-mode
    desc: Codex full-auto approval mode
    crit: notable
    conf: 0.96
    ref: sha256:b92af7e8379fba6a66eb7b99e4db29eacd6040b05abd2b8e0373eaf43dce92b0
    if:
      type: text
      regex: '["'']--approval-mode["'']\s*,[\s\S]{0,80}["'']full-auto["'']'
  - id: ai-agent-dangerous-permission-flag
    desc: AI agent permission bypass flag
    crit: notable
    conf: 0.96
    for: [scripts, source, package.json, json]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      regex: '(--dangerously-skip-permissions|--yolo|--trust-all-tools)'
  - id: ai-agent-yolo-approval-setting
    desc: AI agent unattended YOLO approval setting
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)approval[_-]?mode.{0,12}yolo\b'
  - id: ai-agent-yolo-environment-setting
    desc: AI agent YOLO environment setting
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b[A-Z][A-Z0-9_]*_YOLO_MODE\b'
  - id: ai-agent-yolo-slash-command
    desc: AI agent YOLO slash command
    crit: notable
    conf: 0.95
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?m)(^|[\s"''`])/(yolo)($|[\s"''`])'
  - id: ai-agent-dangerously-skip-permissions-setting
    desc: AI agent skips dangerous permission prompts
    crit: notable
    conf: 0.96
    attack: ''
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']dangerouslySkipPermissions["'']\s*:\s*(true|!!\[\])'
  # Claude Code's Bash tool accepts this per-call field to run one command
  # outside its sandbox. The field name is fixed by the harness's tool
  # schema, in JSON tool calls and in SDK call sites alike.
  - id: ai-agent-tool-sandbox-disable-setting
    desc: AI tool call disables its sandbox
    crit: notable
    conf: 0.97
    for: [json, javascript, typescript, python, markdown, text]
    if:
      type: text
      regex: '["'']?dangerouslyDisableSandbox["'']?\s*:\s*(true|True|!!\[\])'
  - id: codex-app-server-approval-never
    desc: Codex app-server approval is never
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']?approvalPolicy["'']?\s*:\s*["'']never["'']'

  - id: codex-app-server-sandbox-full-access
    desc: Codex app-server sandbox grants full access
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']?sandbox["'']?\s*:\s*["'']danger-full-access["'']'

  - id: codex-app-server-sandbox-policy-full-access
    desc: Codex app-server policy grants full access
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']?sandboxPolicy["'']?\s*:\s*\{\s*["'']?type["'']?\s*:\s*["'']dangerFullAccess["'']'

composite_rules:
  - id: ai-agent-approval-bypass-command
    desc: AI agent CLI disables approvals
    crit: notable
    conf: 0.97
    for: [shell, powershell, batch]
    all:
      - id: micro-behaviors/data/llm/session::ai-agent-cli-call
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
    near_bytes: 192
    unless:
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/file/extension/identity::markdown-powershell-basename
      - id: well-known/app/ai/agent-runtime/kaijibot::kaijibot-skill-frontmatter-marker
      - id: well-known/app/ai/coding-agent/eventmodelers::ralph-agent-runner-script
      - id: well-known/app/ai/coding-agent/gemini-cli::repo-agent-task-script
      - id: metadata/build/recognized-contexts::shell-benchmark-path-marker

  # This establishes only that process-execution code occurs near an agent
  # permission-bypass flag. It does not prove the flag is passed at that call
  # site or infer a secret-harvesting objective; objective rules add those
  # intent-bearing prompt and data-access legs separately.
  - id: ai-agent-unattended-execution-setting
    for: [shell, python, javascript, json]
    desc: AI agent unattended execution setting
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/config/schema::ai-agent-unattended-execution-key
      - id: micro-behaviors/data/parse/vocabulary::unattended-mode-literal
    # Minified bundles can place unrelated mode keys and literals on the same
    # physical line. Require the key and value to be close in the source bytes.
    near_bytes: 256

  - id: codex-bypass-permissions-mode
    desc: Codex bypass permissions mode
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/data/llm/session::codex-cli-or-agent-session
      - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-mode

  # The Codex app-server SDK accepts approval and sandbox policy fields in
  # thread/start requests rather than CLI flags. Pair the two guardrail values
  # in either order so a chat- or API-driven integration is visible even when
  # it never invokes `codex exec`.
  - id: codex-app-server-unrestricted-policy
    desc: Codex app server disables approval and sandbox
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/llm/permission::codex-app-server-approval-never
    any:
      - id: micro-behaviors/data/llm/permission::codex-app-server-sandbox-full-access
      - id: micro-behaviors/data/llm/permission::codex-app-server-sandbox-policy-full-access
    near_bytes: 240

  - id: claude-dangerous-agent-session
    desc: Claude agent permission bypass
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/llm/session::claude-cli-agent-session
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
    near_bytes: 240
  - id: claude-bypass-permissions-mode
    desc: Claude agent bypass permissions mode
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/llm/session::claude-cli-agent-session
      - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-mode
