defaults:
  platforms: [unix, windows]
  for: [shell, javascript, package.json]
composite_rules:
  - id: agent-worker-staging-clues
    desc: Agent permission bypass and worker staging clues
    crit: suspicious
    conf: 0.95
    scope: file
    for: [javascript]
    all:
      - id: micro-behaviors/fs/file/copy/call::js-copyfile-sync-call
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/data/llm/permission::claude-dangerous-agent-session
      - id: micro-behaviors/fs/path/hidden::node-homedir-hidden-entry
