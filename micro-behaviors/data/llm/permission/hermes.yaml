# The variable and enabled value are named explicitly in the BOSSAI report.
# This is an operator-selectable harness permission, not proof of an attack.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.97
traits:
  - id: hermes-event-hooks-auto-trust-enabled
    desc: Enables automatic trust of Hermes event hooks
    if:
      type: text
      regex: '\bHERMES_ACCEPT_HOOKS["'']?\]?\s*[:=]\s*["'']?1["'']?(\s|[,});]|$)'
