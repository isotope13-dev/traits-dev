defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: claude-skip-permissions-argument
    desc: Claude permission bypass argument
    if:
      type: literal
      kind: string
      exact: --dangerously-skip-permissions
  - id: vscode-terminal-send-call
    desc: Calls terminal sendText
    if:
      type: symbol
      kind: call
      regex: '\.sendText$'
composite_rules:
  - id: terminal-send-near-claude-bypass-argument
    desc: Terminal send near Claude bypass argument
    # sendText types into a visible integrated terminal the user watches;
    # hidden headless spawns are covered by claude-bypass-mode-spawn.
    crit: notable
    near_bytes: 2048
    all:
      - id: claude-skip-permissions-argument
      - id: vscode-terminal-send-call
