defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: cursor-agent-force-flag
    desc: Cursor agent force mode
    if:
      type: text
      regex: '(?i)\bcursor-agent\b[^\n]{0,120}\s--force\b'

  - id: aider-unattended-approval
    desc: Aider unattended approval mode
    if:
      type: text
      regex: '(?i)(\baider\b[^\n]{0,120}\s--yes-always\b|\bAIDER_YES_ALWAYS\s*=\s*true\b)'
