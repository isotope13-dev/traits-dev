defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: agent-read-only-sandbox-pinned
    desc: Agent run pins a read-only sandbox
    if:
      type: text
      regex: '(?i)\bsandbox(_mode)?\W{1,6}read-only\b'

  - id: agent-tools-disabled-in-config
    desc: Agent config switches its tools off
    if:
      type: text
      regex: '(?i)\bshell_tool\W{1,4}false\b|\bpermission\W{1,4}deny\b|"\*"\s*:\s*false'

composite_rules:
  - id: agent-locked-down-headless-run
    desc: Headless agent run with read-only sandbox and no tools
    crit: exception
    all:
      - id: micro-behaviors/data/llm/permission::agent-read-only-sandbox-pinned
      - id: micro-behaviors/data/llm/permission::agent-tools-disabled-in-config
