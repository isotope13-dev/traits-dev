defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, markdown]

traits:
  - id: skill-read-tool-routing
    desc: Skill routes loading away from Read tool
    crit: notable
    conf: 0.94
    for: [documents]
    if:
      type: text
      regex: '\bnever use the [`* ]*read [`* ]*tool.{0,80}skill files\b'
      case_insensitive: true

  - id: edit-file-tool-reference
    desc: LLM edit-file tool reference
    crit: notable
    conf: 0.9
    if:
      type: text
      word: edit_file
