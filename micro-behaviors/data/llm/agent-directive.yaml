# Text a source file addresses to whatever AI agent reads it, marked with an
# explicit label rather than written as prose. Neutral on its own — libraries
# annotate their own modules this way so agents route to the right tool — but
# it is the carrier an injected instruction rides in, so an objective that
# pairs it with credential access, config writes, or exfiltration has a source
# for the instruction text.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, go, rust, shell, markdown]
  crit: notable
  conf: 0.9

traits:
  # Line-anchored and upper-case: the deliberate label, not the phrase "agent
  # instructions" occurring in a sentence.
  - id: agent-directive-label
    desc: Source text labeled as an AI-agent instruction
    if:
      type: text
      regex: '(?m)^[\s#*/-]{0,8}(AGENT|AI|LLM)[ _-]?(INSTRUCTION|DIRECTIVE)S?\s*:'
