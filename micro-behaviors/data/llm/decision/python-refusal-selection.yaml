# A comprehension that retains records whose refusal flag is false.
# Syntax binds the yielded, iterated and tested record; a nearby flag name
# or a comment cannot establish this relationship.
defaults:
  for: [python]
  platforms: [unix, windows]
traits:
- id: python-non-refusal-comprehension
  desc: Filters out refusal-marked records
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((list_comprehension
         body: (identifier) @value
         (for_in_clause left: (identifier) @item)
         (if_clause (boolean_operator
           left: (not_operator argument: (subscript
             value: (identifier) @tested
             subscript: (string (string_content) @key)))
           operator: "and"))) @evidence
       (#eq? @value @item) (#eq? @item @tested) (#eq? @key "is_refusal"))
      ((list_comprehension
         body: (identifier) @value
         (for_in_clause left: (identifier) @item)
         (if_clause (boolean_operator
           left: (not_operator argument: (call
             function: (attribute object: (identifier) @tested attribute: (identifier) @method)
             arguments: (argument_list (string (string_content) @key))))
           operator: "and"))) @evidence
       (#eq? @value @item) (#eq? @item @tested)
       (#eq? @method "get") (#eq? @key "is_refusal"))
