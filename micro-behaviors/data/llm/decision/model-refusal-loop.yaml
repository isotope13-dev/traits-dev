# A model-list loop with bound request, response, refusal corpus and return.
# Facts/proximity alone cannot bind these roles or distinguish a comment from
# a response-dependent branch. These queries cover explicit JS fetch and Python
# post/json shapes; they do not claim interprocedural or binary coverage.
# Corpus bindings may be module-level or local to the containing function.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: js-model-loop-refusal-return-filter
    size_max: 262144
    desc: JS model loop rejects refusal-text responses
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
        (lexical_declaration (variable_declarator
          name: (identifier) @corpus
          value: (array (string) @refusal)))
        (function_declaration body: (statement_block
        (for_in_statement
          left: (identifier) @selected
          operator: "of"
          body: (statement_block
            .
            (lexical_declaration (variable_declarator
              name: (identifier) @response
              value: (await_expression (call_expression
                function: (identifier) @fetch
                arguments: (arguments (_) (object (pair
                  key: (property_identifier) @body
                  value: (call_expression
                    function: (member_expression object: (identifier) @json
                      property: (property_identifier) @stringify)
                    arguments: (arguments (object [
                      (pair key: (property_identifier) value: (identifier) @model)
                      (shorthand_property_identifier) @model
                    ] @model_field))))))))))
            .
            (lexical_declaration (variable_declarator
              name: (identifier) @output
              value: (member_expression
                object: (member_expression
                  object: (subscript_expression
                    object: (member_expression
                      object: (parenthesized_expression (await_expression
                        (call_expression function: (member_expression
                          object: (identifier) @decoded_response
                          property: (property_identifier) @decode))))
                      property: (property_identifier) @choices)
                    index: (number) @zero)
                  property: (property_identifier) @message)
                property: (property_identifier) @content)))
            .
            (if_statement
              condition: (parenthesized_expression (unary_expression
                operator: "!"
                argument: (call_expression
                  function: (member_expression object: (identifier) @tested_corpus
                    property: (property_identifier) @some)
                  arguments: (arguments (arrow_function
                    [parameter: (identifier) @prefix
                     parameters: (formal_parameters (identifier) @prefix)]
                    body: (call_expression
                      function: (member_expression object: (identifier) @tested_output
                        property: (property_identifier) @includes)
                      arguments: (arguments (identifier) @tested_prefix)))))))
              consequence: [(return_statement (identifier) @returned) (statement_block . (return_statement (identifier) @returned) .)]) .))))
        (#eq? @fetch "fetch")
        (#eq? @body "body")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#match? @model_field "^model([ \t\r\n:]|$)")
        (#eq? @selected @model)
        (#eq? @response @decoded_response)
        (#eq? @decode "json")
        (#eq? @choices "choices")
        (#eq? @zero "0")
        (#eq? @message "message")
        (#eq? @content "content")
        (#eq? @some "some")
        (#eq? @includes "includes")
        (#eq? @corpus @tested_corpus)
        (#eq? @output @tested_output)
        (#eq? @output @returned)
        (#eq? @prefix @tested_prefix)
        (#match? @refusal "(?i)^[\"']I( (can'?t|cannot|won'?t|am unable)|'m (not able|unable))")
        (#set! cleave.ignore-comments "true")) @rotation

        (statement_block
        (lexical_declaration (variable_declarator
          name: (identifier) @corpus
          value: (array (string) @refusal)))
        (for_in_statement
          left: (identifier) @selected
          operator: "of"
          body: (statement_block
            .
            (lexical_declaration (variable_declarator
              name: (identifier) @response
              value: (await_expression (call_expression
                function: (identifier) @fetch
                arguments: (arguments (_) (object (pair
                  key: (property_identifier) @body
                  value: (call_expression
                    function: (member_expression object: (identifier) @json
                      property: (property_identifier) @stringify)
                    arguments: (arguments (object [
                      (pair key: (property_identifier) value: (identifier) @model)
                      (shorthand_property_identifier) @model
                    ] @model_field))))))))))
            .
            (lexical_declaration (variable_declarator
              name: (identifier) @output
              value: (member_expression
                object: (member_expression
                  object: (subscript_expression
                    object: (member_expression
                      object: (parenthesized_expression (await_expression
                        (call_expression function: (member_expression
                          object: (identifier) @decoded_response
                          property: (property_identifier) @decode))))
                      property: (property_identifier) @choices)
                    index: (number) @zero)
                  property: (property_identifier) @message)
                property: (property_identifier) @content)))
            .
            (if_statement
              condition: (parenthesized_expression (unary_expression
                operator: "!"
                argument: (call_expression
                  function: (member_expression object: (identifier) @tested_corpus
                    property: (property_identifier) @some)
                  arguments: (arguments (arrow_function
                    [parameter: (identifier) @prefix
                     parameters: (formal_parameters (identifier) @prefix)]
                    body: (call_expression
                      function: (member_expression object: (identifier) @tested_output
                        property: (property_identifier) @includes)
                      arguments: (arguments (identifier) @tested_prefix)))))))
              consequence: [(return_statement (identifier) @returned) (statement_block . (return_statement (identifier) @returned) .)]) .))
        (#eq? @fetch "fetch")
        (#eq? @body "body")
        (#eq? @json "JSON")
