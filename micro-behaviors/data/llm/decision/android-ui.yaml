defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
composite_rules:
- id: model-completion-loop-context
  desc: Model completion tokens with loop control
  crit: notable
  conf: 0.93
  all:
  - id: metadata/lang/source/literal::model-completion-state-text
  any:
  - id: micro-behaviors/data/control-flow/jvm-loop-method::jvm-loop-control-method-call
  - id: micro-behaviors/data/control-flow/analysis::while-loop-header
  near_lines: 20
- id: android-ui-tree-model-context
  desc: Android UI-tree access with model context
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-tree-source
  any:
  - id: metadata/lang/source/literal::model-request-vocabulary
  - id: metadata/lang/source/literal::ui-xml-model-prompt-text
- id: android-model-json-gesture-context
  desc: Model context with JSON parsing and gestures
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/llm/decision::android-ui-tree-model-context
  - id: micro-behaviors/ui/controls/widget::ui-gesture-action-call
  any:
  - id: micro-behaviors/data/parse/json::parsejson-helper-call
  - id: metadata/lang/source/naming/action::model-json-parser-names
- id: android-model-loop-gesture-context
  desc: Model completion loop with UI gestures
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/llm/decision::model-completion-loop-context
  - id: micro-behaviors/ui/controls/widget::ui-gesture-action-call
  near_lines: 24
- id: android-recents-model-gesture-context
  desc: Android Recents and model gesture context
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/hardware/input/accessibility::android-accessibility-open-recents
  - id: micro-behaviors/data/llm/decision::android-model-json-gesture-context
  - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
- id: android-model-endpoint-ui-context
  desc: Model endpoint context with Android UI actions
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/llm/decision::android-ui-tree-model-context
  - id: micro-behaviors/data/llm/decision::android-model-json-gesture-context
  - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
  any:
  - id: micro-behaviors/communications/http/services/gemini::gemini-rest-generate-content
  - id: micro-behaviors/communications/http/model::model-generation-request
  near_lines: 32
- id: android-model-task-lock-context
  desc: Android model UI context with task-lock policy
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/llm/decision::android-ui-tree-model-context
  - id: micro-behaviors/data/llm/decision::android-model-json-gesture-context
  - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
  - id: micro-behaviors/ui/window/overlay::recent-task-lock-policy-context
  - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
  any:
  - id: micro-behaviors/communications/http/services/gemini::gemini-rest-generate-content
  - id: micro-behaviors/communications/http/model::model-generation-request
- id: android-model-ui-loop-context
  desc: Model endpoint context with repeated UI actions
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/llm/decision::android-model-endpoint-ui-context
  - id: micro-behaviors/data/llm/decision::android-model-loop-gesture-context
