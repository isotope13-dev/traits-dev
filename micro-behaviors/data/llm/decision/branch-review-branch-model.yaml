defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - go
  - javascript
  - typescript
  crit: notable
  conf: 0.93

composite_rules:
  - id: model-response-action-selection-context
    desc: LLM endpoint, parsing and action selection
    crit: notable
    conf: 0.96
    near_bytes: 5000
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/data/parse/json::model-response-json-decode
      - id: micro-behaviors/data/control-flow/branch::action-field-selection

