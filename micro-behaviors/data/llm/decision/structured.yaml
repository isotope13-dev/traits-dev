# Structured model-decision interfaces. These traits match code/data shape,
# not prompt prose: a schema constraining a model to attack actions, a program
# dispatching the returned field, and vote aggregation across model results.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  crit: notable
  conf: 0.94

traits:
  - id: attack-action-enum
    desc: Decision field enumerates implant actions
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)\bdecision\s*:\s*"inject"\s*\|\s*"persist"\s*\|\s*"steal"\s*\|\s*"move"'

  - id: attack-parameter-fields
    desc: Decision schema has target and exploit fields
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '(?i)\b(target_process|targetProcess)\b[\s\S]{0,240}\b(exploit_type|exploitType)\b'

  - id: decision-switch-member
    desc: Switch statement selects a response decision
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bswitch\s*\(?\s*[A-Za-z_$][\w$]*\.(decision|action)\b'

  - id: decision-match-member
    desc: Match expression selects a response decision
    conf: 0.95
    for: [python, rust]
    if:
      type: text
      regex: '(?i)\bmatch\s+(response|result)\.(decision|action)\b'

  - id: model-decision-vote-increment
    desc: Decision-member vote counter increment
    conf: 0.97
    if:
      type: text
      regex: '\b\w+\s*\[\s*\w+\.(Decision|Action|decision|action)\s*\]\s*(\+\+|\+=\s*1)'

  - id: model-query-function
    desc: Function queries a model for a decision
    conf: 0.96
    for: [python, javascript, typescript, go, rust, csharp]
    if:
      type: symbol
      kind: function
      regex: '(^|\.)(queryLLM|queryModel|requestDecision)$'

  - id: model-decision-dispatch-function
    desc: Function selects or executes a model decision
    conf: 0.96
    for: [python, javascript, typescript, go, rust, csharp]
    if:
      type: symbol
      kind: function
      regex: '(^|\.)(executeDecision|selectPlurality|interModelDiscussion)$'

composite_rules:
  - id: offensive-action-schema
    desc: Model decision schema enumerates attack actions
    crit: suspicious
    conf: 0.99
    all:
      - id: attack-action-enum
      - id: attack-parameter-fields
    near_bytes: 800

  - id: model-decision-capability-switch
    desc: Code switches on a returned model decision
    crit: notable
    conf: 0.97
    any:
      - id: decision-switch-member
      - id: decision-match-member

  - id: model-decision-controller-functions
    desc: Model query and decision dispatcher functions
    crit: notable
    conf: 0.98
    all:
      - id: model-query-function
      - id: model-decision-dispatch-function
    near_bytes: 5000

  - id: voted-offensive-model-decisions
    desc: Model votes select from an offensive action schema
    crit: suspicious
    conf: 0.99
    all:
      - id: offensive-action-schema
      - id: model-decision-vote-increment
    near_bytes: 5000
