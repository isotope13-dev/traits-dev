# Refusal-driven model selection requires a bound model/request/response loop.
# Provider names and endpoint constants alone do not establish retry behavior.
defaults:
  platforms: [unix, windows]
  for: [python, javascript]

composite_rules:
  - id: llm-refusal-triggered-model-failover
    desc: Refused chat requests retry other models
    crit: suspicious
    conf: 0.97
    any:
      - id: js-model-loop-refusal-return-filter
      - id: js-model-loop-refusal-continue-filter
      - id: python-model-loop-refusal-return-filter
      - id: python-model-loop-refusal-continue-filter
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
