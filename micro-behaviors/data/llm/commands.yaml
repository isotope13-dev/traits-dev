# Natural-language command generation is a neutral capability. An agent may
# use it legitimately, so malicious conclusions belong in objectives that also
# observe execution and an attack-relevant outcome.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, lua, powershell, shell, batch]

traits:
  # Require prompt-like context in a string literal. A bare noun phrase such as
  # "list of commands" is ordinary English, while a prompt that directs a model
  # to return or generate an executable command line is the useful artifact.
  - id: llm-command-generation-request
    desc: LLM prompt requests executable commands
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\b(prompt|instruct)\w*.{0,90}\b(return|generate|produce|write)\b.{0,120}\bcommands?\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: encoded-llm-command-generation-request
    desc: Encoded LLM prompt requests executable commands
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, base32, base85, stack, wide]
      regex: '(?i)\b(prompt|instruct)\w*.{0,90}\b(return|generate|produce|write)\b.{0,120}\bcommands?\b'

  - id: no-user-question-directive
    desc: Prompt directs agent to skip questions
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bwithout asking the user\b'

  # `ultrathink` is the documented Claude Code keyword that raises the model's
  # thinking budget. Users type it themselves and it appears throughout agent
  # docs and rule files, so it is a neutral prompt-control keyword here; the
  # prompt-injection composites decide when a carrier is planting it.
  - id: ultrathink-thinking-budget-keyword
    desc: References Claude Code extended-thinking keyword
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, go, rust, shell, markdown, json]
    if:
      type: text
      substr: "ULTRATHINK"
      case_insensitive: true

composite_rules:
  - id: llm-command-generation-instruction
    desc: LLM prompt requests executable commands
    crit: notable
    conf: 0.94
    any:
      - id: llm-command-generation-request
      - id: encoded-llm-command-generation-request
