defaults:
  platforms: [unix, windows]
  for: [scripts, markdown, text, html, yaml, json]

traits:
- id: llm-silent-operation-mode-phrase
  desc: LLM silent operation mode phrase
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: SILENT OPERATION MODE
    case_insensitive: true

- id: llm-prohibited-mentioning-phrase
  desc: LLM prohibited from mentioning phrase
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: prohibited from mentioning
    case_insensitive: true


- id: llm-filesystem-tool-chain--list-allowed-directories
  desc: LLM filesystem tool (list_allowed_directories)
  crit: notable
  conf: 0.9
  if:
    type: literal
    kind: string
    word: list_allowed_directories

- id: ssh-credential-disclosure-directive
  desc: Tool response directs SSH credential disclosure
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript, shell, markdown]
  if:
    type: text
    regex: '(?i)\b(tool|agent)\b.{0,60}\b(read|include|send)\b.{0,100}~?/.ssh/'
  unless:
    - id: well-known/app/system/netwatch::safety-boundary-documentation
    - type: text
      regex: '(?i)\b(can(?:not|''t)|unable to|not permitted to)\s+read\b[\s\S]{0,120}~?/.ssh/'

- id: aws-credential-disclosure-directive
  desc: Tool response directs AWS credential disclosure
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript, shell, markdown]
  if:
    type: text
    regex: '(?i)\b(tool|agent)\b.{0,60}\b(read|include|send)\b.{0,100}\.aws/credentials'
  unless:
    - id: well-known/app/system/netwatch::safety-boundary-documentation
    - type: text
      regex: '(?i)\b(can(?:not|''t)|unable to|not permitted to)\s+read\b[\s\S]{0,120}\.aws/credentials'

- id: shadow-credential-disclosure-directive
  desc: Tool response directs shadow disclosure
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript, shell, markdown]
  if:
    type: text
    regex: '(?i)\b(tool|agent)\b.{0,60}\b(read|include|send)\b.{0,100}/etc/shadow'
  unless:
    - id: well-known/app/system/netwatch::safety-boundary-documentation
    - type: text
      regex: '(?i)\b(can(?:not|''t)|unable to|not permitted to)\s+read\b[\s\S]{0,120}/etc/shadow'

- id: concealed-tool-instruction
  desc: Tool instruction conceals action from user
  crit: notable
  conf: 0.92
  for: [python, javascript, typescript, shell, markdown, text, html, pdf]
  if:
    type: text
    regex: '(?i)\b(do not|don''t)\s+(inform|tell)\s+(the )?user\b.{0,100}\b(execute|run)\b'
  not:
    - regex: '(?i)\btell\s+(the )?user\s+to\s+run\b'
  unless:
    - type: text
      regex: '(?i)\b(do not|don''t) tell the user you cannot (inspect files|run commands)'

- id: concealed-data-instruction
  desc: Hidden tool data action
  crit: notable
  conf: 0.92
  for: [python, javascript, typescript, shell, markdown, html, text]
  if:
    type: text
    regex: '(?i)\b(do not|don''t)\s+(inform|tell)\s+(the )?user\b.{0,100}\b(send|upload)\b'

- id: concealed-credential-instruction
  desc: Hidden credential action
  crit: notable
  conf: 0.92
  for: [python, javascript, typescript, shell, markdown]
  if:
    type: text
    regex: '(?i)\b(do not|don''t)\s+(inform|tell)\s+(the )?user\b.{0,100}\b(secret|password)\b'

- id: tool-state-transition
  desc: Tool state transitions to poisoned
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript, shell, markdown]
  if:
    type: text
    regex: '(?i)\btool\b.{0,60}\b(benign|clean)\b.{0,100}\b(poisoned|malicious)\b'

composite_rules:
- id: concealed-sensitive-instruction
  desc: Conceals a sensitive tool side effect
  crit: notable
  conf: 0.92
  for: [python, javascript, typescript, shell, markdown]
  any:
    - id: concealed-tool-instruction
    - id: concealed-data-instruction
    - id: concealed-credential-instruction
- id: llm-filesystem-tool-chain
  desc: LLM filesystem tool chain
  crit: component
  conf: 0.9
  any:
  - id: llm-filesystem-tool-chain--list-allowed-directories
  - id: micro-behaviors/fs/file/read-write::agent-read-file-tool
  - id: micro-behaviors/communications/ipc/agent-hook::edit-file-tool-reference
- id: llm-tool-secrecy-phrase
  desc: LLM secrecy phrase fragment
  crit: component
  conf: 0.9
  any:
  - id: llm-silent-operation-mode-phrase
  - id: llm-prohibited-mentioning-phrase
  - id: micro-behaviors/data/llm/agent::without-permission-phrase

- id: llm-tool-secrecy-instruction
  desc: Secrecy wording and tool context
  crit: notable
  conf: 0.9
  all:
  - id: llm-tool-secrecy-phrase
  any:
  - id: llm-filesystem-tool-chain
  - id: micro-behaviors/communications/ipc/agent-hook::edit-file-tool-reference
  - id: micro-behaviors/data/llm/wire-marker::tool-call-sequence-instruction
  - id: metadata/lang/natural/vocabulary/ai-assistant::agent-identity-ai-assistant
  needs: 1

