defaults:
  platforms: [unix, windows]
  for: [scripts, markdown, text, html, yaml, json]

traits:
- id: llm-silent-operation-mode-phrase
  desc: LLM silent operation mode phrase
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: SILENT OPERATION MODE
    case_insensitive: true

- id: llm-prohibited-mentioning-phrase
  desc: LLM prohibited from mentioning phrase
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: prohibited from mentioning
    case_insensitive: true


- id: llm-filesystem-tool-chain--list-allowed-directories
  desc: LLM filesystem tool (list_allowed_directories)
  crit: notable
  conf: 0.9
  if:
    type: literal
    kind: string
    word: list_allowed_directories

composite_rules:
- id: llm-filesystem-tool-chain
  desc: LLM filesystem tool chain
  crit: component
  conf: 0.9
  any:
  - id: llm-filesystem-tool-chain--list-allowed-directories
  - id: micro-behaviors/fs/file/read-write::agent-read-file-tool
  - id: micro-behaviors/communications/ipc/agent-hook::edit-file-tool-reference
- id: llm-tool-secrecy-phrase
  desc: LLM secrecy phrase fragment
  crit: component
  conf: 0.9
  any:
  - id: llm-silent-operation-mode-phrase
  - id: llm-prohibited-mentioning-phrase
  - id: micro-behaviors/data/llm/agent::without-permission-phrase

- id: llm-tool-secrecy-instruction
  desc: Secrecy wording and tool context
  crit: notable
  conf: 0.9
  all:
  - id: llm-tool-secrecy-phrase
  any:
  - id: llm-filesystem-tool-chain
  - id: micro-behaviors/communications/ipc/agent-hook::edit-file-tool-reference
  - id: micro-behaviors/data/llm/wire-marker::tool-call-sequence-instruction
  - id: metadata/lang/natural/vocabulary/ai-assistant::agent-identity-ai-assistant
  needs: 1

