defaults:
  platforms: [unix, windows]
  for: [text, markdown]

traits:
  - id: system-prompt-encoded-assignment
    desc: System prompt assigned a Base64-shaped string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*system_prompt\s*=\s*["''][A-Za-z0-9+/]{16,}={0,2}["'']'
