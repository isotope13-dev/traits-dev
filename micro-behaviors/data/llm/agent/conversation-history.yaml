defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, markdown, text]

traits:
  - id: conversation-history-collection-instruction
    desc: Text mentions conversation history collection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(record|append|capture).{0,80}(conversation history|user and assistant messages)'
