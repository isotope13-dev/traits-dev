traits:
- platforms:
  - windows
  - unix
  crit: notable
  conf: 0.4
  for:
  - javascript
  - typescript
  id: chat-inventory-term-literal
  desc: Chat listing or search API token
  unless:
  - id: well-known/lib/network/getstream-stream-node::stream-node-sdk-official
  - id: well-known/lib/network/getstream-stream-node::stream-openapi-gen-api-path
  - id: well-known/lib/network/getstream-stream-node::stream-chat-api-v2-route
  - id: well-known/lib/network/atproto-api::atproto-api-pnpm-bundle-path
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: well-known/tool/development/vcs/github-web::githubassets-fetched-artifact-path
  - id: well-known/tool/development/vcs/github-web::js-parse-end-mark
  if:
    # Verb-attached shapes only: listChats, chat.list, list_chats, "list all
    # chats". A loose chat-near-list window also matches UI component slugs
    # such as a "chat-list" registry key, which inventory nothing.
    type: string_literal
    regex: '(?i)\b(list|enumerate|search|inventory)[ ._]?chats?\b|\bchats?[._](list|search)\b'
