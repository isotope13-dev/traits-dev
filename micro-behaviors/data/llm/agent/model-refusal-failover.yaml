# Text references alone do not establish executable refusal detection.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: llm-refusal-prefix-reference
    desc: Quoted model-refusal prefix text
    if:
      type: text
      regex: '(?i)["'']I(\s|'')(can''?t|cannot|won''?t|am unable|m not able|m unable)["'']'

composite_rules:
  - id: llm-refusal-phrase-references
    desc: References model-refusal phrases or prefixes
    conf: 0.92
    any:
      - id: llm-refusal-prefix-reference
      - id: micro-behaviors/data/llm/agent::llm-refusal-phrase-corpus
