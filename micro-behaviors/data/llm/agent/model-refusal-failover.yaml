# Refusal-resilient model chaining: code carries namespaced provider model
# IDs (the router form used by OpenRouter-style gateways) and compares model
# output against refusal prefixes so a declined request can be retried on a
# more permissive model. Ordinary error-based fallback carries no refusal
# literals and does not match; guardrail scanners are excepted.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: llm-refusal-prefix-literal
    desc: Quoted model-refusal prefix literal
    if:
      type: text
      regex: '(?i)["'']I(\s|'')(can''?t|cannot|won''?t|am unable|m not able|m unable)["'']'

composite_rules:
  - id: llm-refusal-detection-literals
    desc: Literals for detecting a model refusal
    conf: 0.92
    any:
      - id: llm-refusal-prefix-literal
      - id: micro-behaviors/data/llm/agent::llm-refusal-phrase-corpus
  - id: llm-refusal-triggered-model-failover
    desc: Refused chat requests retry other models
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: llm-refusal-detection-literals
    any:
      - id: micro-behaviors/data/llm/wire-marker::anthropic-namespaced-model-id
      - id: micro-behaviors/data/llm/wire-marker::openai-namespaced-model-id
      - id: micro-behaviors/data/llm/wire-marker::google-namespaced-model-id
      - id: micro-behaviors/data/llm/wire-marker::moonshot-namespaced-model-id
      - id: micro-behaviors/data/llm/wire-marker::deepseek-namespaced-model-id
      - id: micro-behaviors/data/llm/wire-marker::mistral-namespaced-model-id
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
