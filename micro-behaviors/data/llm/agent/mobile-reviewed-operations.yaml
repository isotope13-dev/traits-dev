# Addressing an AI agent and maintaining its conversation are neutral data
# operations. An objective needs separate collection/transfer evidence.
defaults:
  platforms: [unix, windows]

traits:
  - id: ai-agent-addressing-phrase
    for: [scripts, html, markdown, text, json, go, rust]
    desc: Phrase addressing an AI agent
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(tell|ask|instruct) (the )?AI agent\b'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::aui-agent-builder-package-context

  - id: tool-result-history-append
    for: [javascript, typescript]
    desc: Tool results appended to conversation transcript
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(history|transcript|messages)\.push\(\s*\{\s*role\s*:\s*["'']tool["'']'

