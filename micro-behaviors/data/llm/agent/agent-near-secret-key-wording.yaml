defaults:
  platforms: [unix, windows]
  for: [scripts, source, markdown, text, html]

traits:
  - id: agent-near-secret-key-wording
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Agent wording near secret or key terms
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(ai agent|ai assistant)\b[\s\S]{0,100}\b(password|secret|private key)\b'
    # "Keep a secret" describes confidentiality, not a credential value.
    # Filter only this matched span, so safety prose cannot suppress a later
    # instruction that actually names a password, private key or other secret.
    not:
      - regex: '(?i)\bkeep\s+a\s+secret$'
