traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: tool-call-string-literal
  desc: References the tool_call message label
  conf: 0.92
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    substr: '''tool_call'''
- platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - pyc
  id: penetration-testing-prompt-text
  desc: String literal mentions penetration testing
  if:
    type: string_literal
    substr: penetration testing
defaults:
  crit: notable
