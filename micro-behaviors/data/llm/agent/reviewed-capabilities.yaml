traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: tool-call-string-literal
  desc: Tags a message with the tool_call label
  conf: 0.92
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: '["'']?(type|role|kind)["'']?\s*[:=]\s*["'']tool_call["'']'
defaults:
  crit: notable
