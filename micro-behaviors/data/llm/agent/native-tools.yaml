defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.95
traits:
  - id: native-ai-agent-identity
    crit: notable
    desc: Native AI coding-agent reference
    if:
      type: text
      # A bare four-byte "kiro" occurs by chance in large opaque overlays.
      # Require an executable/CLI spelling for that short product name.
      regex: '(?i)\b(cursor-agent|claude(code)?|kiro(-cli|\.exe))\b'
    unless:
      - id: metadata/binary/section/name::bun-section-name
