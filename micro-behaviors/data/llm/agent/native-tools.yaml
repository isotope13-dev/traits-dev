defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: native-ai-agent-identity
    desc: Native AI coding-agent CLI reference
    if:
      type: yara
      # Bare Claude also names a GTA character. Preserve unambiguous
      # CLI/executable spellings in ASCII and UTF-16 instead.
      source: |
        rule native_coding_agent_cli_reference {
          strings:
            $other = /\b(cursor-agent|claudecode|kiro(-cli|\.exe))\b/i ascii wide
            $claude = /\bclaude([-.]code|\.exe)\b/i ascii wide
          condition:
            any of them
        }
    unless:
      - id: metadata/binary/section/name::bun-section-name
