traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - shell
  - markdown
  - text
  - html
  id: agent-send-wording
  desc: AI agent wording near a send verb
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(ai agent|ai assistant)\b[\s\S]{0,80}\b(send|upload|forward)\b
  not:
    - regex: '(?i)\b(can''t|cannot|can not|won''t|will not|never|doesn''t|does not|must not|should not|unable to|prohibited from)\s+(send|upload|forward)\b'
