defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: verbatim-output-directive
    desc: Requests verbatim text output
    crit: notable
    conf: 0.92
    if:
      type: literal
      regex: '(?is)(^|[.!:]\s+|please\s+)(output|repeat|reproduce|print) .{0,40}(verbatim|word.for.word)'
