defaults:
  platforms: [unix, windows]
  for: [documents, markdown, text, html]

traits:
  - id: superseded-content-phrase
    desc: Text calls a document or draft superseded
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(superseded|obsolete|outdated) (draft|message|email|document|content)\b'
