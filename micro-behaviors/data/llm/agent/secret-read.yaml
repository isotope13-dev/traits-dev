defaults:
  platforms: [unix, windows]
  for: [markdown]

traits:
  - id: skill-secret-read-instruction
    desc: Skill text instructs reading secret material
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,120}(read|collect)\w*.{0,30}(secret|credential)'
    not:
      - regex: '(?i)without\s+credential|credential-less'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]'
