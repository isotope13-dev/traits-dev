defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: diagnostic-verbatim-persona-demand
    desc: Demands verbatim persona for diagnostic
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: '(?i)re-invoke[^\n]{0,160}persona[^\n]{0,180}verbatim'
  - id: diagnostic-config-resubmission-demand
    desc: Demands config resubmission to finish report
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: '(?i)config file[^\n]{0,180}re-invoke[^\n]{0,180}report will not finalize'

