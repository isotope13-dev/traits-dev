traits:
- id: copy-prompt-instruction
  desc: Copy or append prompt/instruction wording
  conf: 0.88
  if:
    type: text
    regex: \b(copy|append)\s+((the\s+following|the|this|these)\s+)?(prompt|instructions?)\b
    case_insensitive: true
  for:
  - documents
  - markdown
  - text
  - json
  - xml
- id: llm-model-call-phrase
  desc: Text refers to LLM/model calls
  conf: 0.84
  ref: sha256:c4174973b48d9d1137461e94456872cb6a8f223eb7740248bc4c16094cdcf93b
  for:
  - scripts
  if:
    type: text
    regex: (?i)\b(LLM|model) call\b
defaults:
  crit: notable
  platforms:
  - unix
  - windows
