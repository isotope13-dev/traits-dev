defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  crit: notable
traits:
  - id: llm-generation-verb-reference
    desc: LLM reference near a generation verb
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}\b(generate|write|produce)\b'
  - id: llm-python-or-shell-reference
    desc: LLM term near Python or shell
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}(\bpython\b|[^\w-]shell([^\w-]|$))'
  - id: llm-lua-or-javascript-reference
    desc: LLM term near Lua or JavaScript
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}\b(lua|javascript)\b'
  - id: llm-output-response-reference
    desc: LLM response or output reference
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(LLM|language model)[ -](response|output)\b'
  - id: llm-near-execution-verb
    desc: LLM reference near execution wording
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b[^\r\n]{0,48}\b(executed|runs?|interpreted?)\b'
