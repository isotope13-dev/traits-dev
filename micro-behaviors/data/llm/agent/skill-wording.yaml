defaults:
  platforms: [linux, macos, windows]
  for: [markdown]
  crit: notable
  conf: 0.9

traits:
  - id: skill-startup-wording
    desc: Skill or agent and startup vocabulary co-occur
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(skill|agent)\b.{0,80}\b(startup|autostart|persistence)\b'

  - id: skill-encoding-wording
    desc: Skill or agent and encoding vocabulary co-occur
    crit: notable
    conf: 0.92
    if:
      type: text
      # Encoding vocabulary is ordinary documentation language. Keep the
      # skill/agent context in a separate atom so the composite can require a
      # staged object as well.
      regex: '(?is)\b(skill|agent)\b.{0,100}\b(base64|encod\w*|decod\w*|decrypt\w*)\b'
    not:
      - regex: '(?i)\b(arguments|blob|payload|body)\b.{0,48}\bdecod'
      - regex: '(?i)\bdecod\w*\s+to\s+(\{\}|\[\]|null)\b'
      - regex: '(?i)service/agent'
      - regex: '(?i)raw base64'
      - regex: '(?i)Ed25519'

  - id: skill-execution-wording
    desc: Skill and execution vocabulary co-occur
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(launch|execute)\b'

  - id: unrequested-action-wording
    desc: Mentions acting without request or approval
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bwithout\s+(the\s+)?(user|explicit)\s+(request|approval)\b'
