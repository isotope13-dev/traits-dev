defaults:
  platforms: [linux, macos, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.9

traits:
  - id: undisclosed-activity-wording
    desc: References user-hidden activity
    # These phrases establish concealment only when the composite also finds
    # the private-thought harvesting instruction. A generic background worker
    # is neither covert nor related to an agent diary.
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(user sees nothing|without the user knowing|don.t announce[^\n]{0,40})'
    not:
      - regex: '(?i)don.t announce deprecation'
