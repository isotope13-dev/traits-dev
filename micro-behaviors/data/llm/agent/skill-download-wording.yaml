defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: skill-download-wording
    desc: Agent skill mentions external fetch
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(download|curl|wget)\b'
  - id: skill-url-payload-helper-wording
    desc: Skill mentions URL, payload or helper
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bskill\b.{0,120}\b(URL|payload|helper)\b'
