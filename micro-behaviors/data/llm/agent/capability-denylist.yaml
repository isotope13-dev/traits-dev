# An agent's capability-name filter keeps its denylist as module-level sets
# (`CYBER_OFFENSIVE_CAPABILITIES = {"cyber_warfare", "ddos", ...}`). The names
# are the things the agent refuses, so offensive vocabulary in them describes
# what is blocked, not what the code does.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: capability-name-set-catalog
    desc: Module sets of agent capability names
    crit: baseline
    conf: 0.9
    count_min: 5
    if:
      type: text
      regex: '(?m)^[A-Z][A-Z_]{3,40}_CAPABILITIES(:[^=\n]{1,60})?\s*=\s*\{'
