defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, package.json, powershell]

traits:

  - id: opencode-name-reference
    desc: References the OpenCode coding agent
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bopencode\b(@[A-Za-z0-9.-]+)?'
      case_insensitive: true
    not:
      - regex: "(?i)opencode@[A-Za-z0-9.-]+"
