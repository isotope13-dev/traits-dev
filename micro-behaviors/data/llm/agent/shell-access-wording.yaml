traits:
- id: shell-access-wording
  desc: Mentions shell or terminal access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)access\s+to\s+[\w ,]{0,30}\b(shell|bash|zsh|terminal|command[\s-]?line)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - json
  - text
