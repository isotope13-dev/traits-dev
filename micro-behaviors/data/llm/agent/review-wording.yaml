defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, markdown, text, json]
  crit: notable
  conf: 0.9

traits:
  - id: agent-review-wording
    desc: Agent and review vocabulary co-occur
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(AI|LLM|coding) agents?\b.{0,120}\b(review|diagnos)\w*'
