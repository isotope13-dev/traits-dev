# Recorded agent-transcript structure: a JSON message log with role-tagged
# messages and tool-call records. Eval harnesses (terminal-bench, SWE-bench
# style runners) persist every turn this way, so the harness system prompt,
# the agent chain-of-thought, and terminal output all appear as data in one
# file. Co-occurrence inside such a transcript is a record of a run, not a
# payload addressed to a reader that obeys, so objective rules that would
# otherwise read transcript content as an attack pair it with this exception.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  crit: notable
  conf: 0.9
traits:
  - id: trajectory-message-role-field
    desc: Transcript message role field
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["''](system|user|assistant|tool|developer)["'']'
  - id: trajectory-tool-calls-field
    desc: Transcript tool-calls record field
    if:
      type: text
      regex: '["'']tool_calls["'']\s*:'
composite_rules:
  # Both halves of a message log: role-tagged turns plus tool-call records.
  # Either half alone is common elsewhere (chat exports, API client code), so
  # the exception requires the pair that marks a recorded agent run.
  - id: agent-trajectory-record-context
    desc: Recorded agent trajectory transcript
    crit: exception
    all:
      - id: trajectory-message-role-field
      - id: trajectory-tool-calls-field
