# Output-format prompt text is an instruction, not an object schema.
defaults:
  platforms: [unix, windows]
traits:
  - id: json-only-response-instruction
    desc: Prompt requests a JSON-only response
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, markdown]
    if:
      type: literal
      kind: string
      substr: Return JSON only
