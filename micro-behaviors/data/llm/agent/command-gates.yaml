# Command-gate tables (fullAutoCanProceed / userShouldReview /
# COMMIT_BOUNDARY_*) classify which shell commands an AI agent may run
# unattended - and their rows quote the very commands they gate. A workflow
# harness shipping such tables is not itself creating and pushing tags.
defaults:
  platforms: [unix, windows]
composite_rules:
- id: command-gate-classification-context
  desc: Agent command-gate tables classifying git operations
  crit: exception
  conf: 0.94
  all:
  - id: micro-behaviors/data/llm/agent::agent-autonomy-gate-fields
  any:
  - id: micro-behaviors/process/create/shell/git::git-tag-annotate
  - id: micro-behaviors/process/create/shell/git::git-push-origin
