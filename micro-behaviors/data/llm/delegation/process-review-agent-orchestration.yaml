defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: notable
  conf: 0.9

traits:
- id: agent-delegation-tool-name
  desc: Agent delegation tool name
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: '(?i)^(delegate_task|sessions_spawn|spawn_subagent)$'

- id: agent-delegation-call
  desc: Calls an agent delegation API
  conf: 0.94
  for: [python, javascript, typescript, go, rust, lua, powershell]
  if:
    type: symbol
    kind: call
    regex: '(?i)(^|\.)(delegate_task|sessions_spawn|spawn_subagent)$'

- id: agent-prompt-dispatch-call
  desc: Calls an agent-prompt dispatch API
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '(?i)^(sendPromptToAgent|sendAgentPrompt)$'

  # ThreadPoolExecutor pool management lives in process/work/pool.
- id: claude-task-tool-subagent-spawn
  desc: References Task tool subagent spawning
  conf: 0.95
  for: [scripts, source, json, markdown, text]
  if:
    type: text
    regex: '(?is)\bTask\s+tool\b.{0,120}\bsub-?agent\b|\bsub-?agent\b.{0,120}\bTask\s+tool\b'

composite_rules:
- id: agent-delegation-capability
  desc: Agent exposes a delegation capability
  conf: 0.93
  any:
  - id: micro-behaviors/data/llm/delegation::agent-delegation-tool-name
  - id: micro-behaviors/data/llm/delegation::agent-delegation-call

- id: agent-parallel-delegation
  desc: Agent delegates tasks through parallel dispatch
  conf: 0.96
  all:
  - id: micro-behaviors/data/llm/delegation::agent-delegation-capability
  any:
  - id: micro-behaviors/process/work/task::parallel-task-dispatch-api
  - id: micro-behaviors/process/sync/join::promise-all-join
  - id: micro-behaviors/process/sync/join::asyncio-gather-join
  near_bytes: 2048
