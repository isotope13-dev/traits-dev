defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, package.json, powershell]
  conf: 0.9
traits:
- id: mcp-tool-use-field-reference
  desc: References the MCP tool-use wire field
  crit: notable
  if:
    type: text
    substr: mcp_tool_use
- id: tool-use-allow-response
  desc: Claude tool request followed by allow
  crit: notable
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)\b(can_use_tool|tool_use)\b.{0,120}\ballow\b'
