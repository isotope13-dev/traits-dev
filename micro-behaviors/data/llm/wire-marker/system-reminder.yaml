defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: llm-system-reminder-marker
    desc: LLM system-reminder tag reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '<system-reminder[\s>]'
      case_insensitive: true
    not:
      - substr: 'Model-facing system-reminder appended'
