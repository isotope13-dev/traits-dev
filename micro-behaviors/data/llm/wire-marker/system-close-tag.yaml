traits:
- id: llm-system-block-close-tag
  desc: Closing system-prompt markup tag
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/log::windows-event-csv-records
  # Include an optional same-line `<system>scalar` prefix in the matched span
  # so `not:` rejects inline XML elements (`<system>PRD</system>`) while keeping
  # standalone `</system>` breakouts and multi-line `<system>...</system>` blocks.
  if:
    type: text
    regex: '(<\s*system\s*>[^<\r\n]{0,64})?<\s*/\s*system\s*>'
    case_insensitive: true
  not:
    - regex: '(?i)^<\s*system\s*>'
  platforms:
  - unix
  - windows
  for:
  - json
  - text
  - markdown
  - scripts
  - source
