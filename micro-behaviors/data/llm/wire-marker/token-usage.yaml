# Usage field names do not establish HTTP, JSON or a proxy implementation.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
- id: completion-token-field
  desc: LLM completion-token count field
  crit: notable
  conf: 0.65
  if:
    type: text
    substr: completion_tokens
- id: reasoning-token-field
  desc: LLM reasoning-token count field
  crit: notable
  conf: 0.65
  if:
    type: text
    substr: reasoning_tokens
- id: output-token-field
  desc: LLM output-token count field
  crit: notable
  conf: 0.65
  if:
    type: text
    substr: output_tokens
- id: prompt-token-field
  desc: LLM prompt-token count field
  crit: notable
  conf: 0.65
  if:
    type: text
    substr: prompt_tokens
- id: input-token-field
  desc: LLM input-token count field
  crit: notable
  conf: 0.65
  if:
    type: text
    substr: input_tokens
- id: total-token-field
  desc: LLM total-token count field
  crit: notable
  conf: 0.65
  if:
    type: text
    substr: total_tokens

composite_rules:
- id: token-usage-field-reference
  desc: References an LLM token usage field
  crit: notable
  conf: 0.65
  any:
  - id: completion-token-field
  - id: reasoning-token-field
  - id: output-token-field
  - id: prompt-token-field
  - id: input-token-field
  - id: total-token-field
