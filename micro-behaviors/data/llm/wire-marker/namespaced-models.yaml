# Model references are wire vocabulary, not agent behavior. Require complete
# tokens so a GitHub URL or google/protobuf/field_mask.proto is not a model.
# Google also needs an LLM-specific family: its general package namespace is
# widely used for software unrelated to model inference.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: anthropic-namespaced-model-id
    desc: Namespaced Anthropic model identifier
    if:
      type: text
      regex: '(?i)(^|[\s"''=:])anthropic/[a-z0-9._-]{3,80}($|[\s"'',;}])'
  - id: openai-namespaced-model-id
    desc: Namespaced OpenAI model identifier
    if:
      type: text
      regex: '(?i)(^|[\s"''=:])openai/[a-z0-9._-]{3,80}($|[\s"'',;}])'
  - id: google-namespaced-model-id
    desc: Namespaced Gemini or Gemma model identifier
    if:
      type: text
      regex: '(?i)(^|[\s"''=:])google/g(emini|emma)[a-z0-9._-]{0,70}($|[\s"'',;}])'
  - id: moonshot-namespaced-model-id
    desc: Namespaced Moonshot model identifier
    if:
      type: text
      regex: '(?i)(^|[\s"''=:])moonshotai/[a-z0-9._-]{3,80}($|[\s"'',;}])'
  - id: deepseek-namespaced-model-id
    desc: Namespaced DeepSeek model identifier
    if:
      type: text
      regex: '(?i)(^|[\s"''=:])deepseek/[a-z0-9._-]{3,80}($|[\s"'',;}])'
  - id: mistral-namespaced-model-id
    desc: Namespaced Mistral model identifier
    if:
      type: text
      regex: '(?i)(^|[\s"''=:])mistralai/[a-z0-9._-]{3,80}($|[\s"'',;}])'
