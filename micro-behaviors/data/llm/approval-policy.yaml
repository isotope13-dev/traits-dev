# Agent instruction text that *requires* human approval before acting — the
# negated spellings of "without human/user approval" or permission.
#
# These lived in objectives/exfiltration/http/agent/, inheriting that file's
# `attack: T1041`, so every agent skill file, AGENTS.md or system prompt that
# documents its own approval policy — the responsible thing for an agent
# harness to ship — collected an exfiltration finding at notable. What the
# matchers find is a guardrail, the opposite of exfiltration intent; TAXONOMY
# puts neutral prompt-text atoms here and leaves the intent to composites.
#
# They stay notable rather than dropping to component: "this agent is
# instructed to get human sign-off before acting" is a real fact about how an
# agent behaves, worth seeing in a diff on its own, and the exception composite
# that consumes them requires notable members.
#
# The affirmative reading — a prompt telling an agent to proceed *without*
# approval — lives under objectives/evasion/security-bypass/llm/override and
# suppresses on these through the exception composite below.
defaults:
  platforms: [unix, windows]
  for: [scripts, html, markdown, text, json, go, rust]
  crit: notable
  conf: 0.9

traits:
  - id: prohibitive-dont-without-approval
    desc: Don't act without user approval guideline
    if:
      type: text
      regex: '(?i)\bdon''t\b.{0,200}\bwithout (human|user) approval\b'

  - id: prohibitive-do-not-without-approval
    desc: Do not act without user approval guideline
    if:
      type: text
      regex: '(?i)\bdo not\b.{0,200}\bwithout (human|user) approval\b'

  - id: prohibitive-never-without-approval
    desc: Never act without user approval guideline
    if:
      type: text
      regex: '(?i)\bnever\b.{0,200}\bwithout (human|user) approval\b'

  - id: prohibitive-dont-section-without-approval
    desc: Don't section forbids bypassing user approval
    if:
      type: text
      regex: '(?is)\bdon''?t:\s*.{0,200}\bwithout (human|user) approval\b'

  - id: affirmative-require-human-approval
    desc: Require human approval guideline
    if:
      type: text
      regex: '(?i)\brequire (human|user) approval\b'

  - id: human-approval-nonnegotiable
    desc: Human approval declared non-negotiable
    if:
      type: text
      regex: '(?i)\b(human|user) approval\b.{0,80}\bnon[- ]negotiable\b'

  - id: prohibitive-dont-without-permission
    desc: Don't act without user permission guideline
    if:
      type: text
      regex: '(?i)\bdon''t\b.{0,120}\bwithout (human|user) permission\b'

  - id: prohibitive-do-not-without-permission
    desc: Do not act without user permission guideline
    if:
      type: text
      regex: '(?i)\bdo not\b.{0,120}\bwithout (human|user) permission\b'

  - id: prohibitive-never-without-permission
    desc: Never act without user permission guideline
    if:
      type: text
      regex: '(?i)\bnever\b.{0,120}\bwithout (human|user) permission\b'

composite_rules:
  - id: approval-guideline-context
    desc: Human approval guideline context
    crit: exception
    conf: 0.98
    any:
      - id: prohibitive-dont-without-approval
      - id: prohibitive-do-not-without-approval
      - id: prohibitive-never-without-approval
      - id: prohibitive-dont-section-without-approval
      - id: affirmative-require-human-approval
      - id: human-approval-nonnegotiable
