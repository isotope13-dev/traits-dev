defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: python-injection-marker-rejection-result
    desc: Injection evaluation negates marker-hit result
    if:
      type: tree-sitter
      query: |
        ((function_definition
          body: (block
            (expression_statement (assignment
              left: (identifier) @hit
              right: (comparison_operator
                (call function: (attribute attribute: (identifier) @lower_left))
                "in"
                (call function: (attribute attribute: (identifier) @lower_right)))))
            (return_statement (call arguments: (argument_list
              (string) @category
              (not_operator argument: (identifier) @negated)))))) @result
          (#eq? @hit @negated)
          (#eq? @lower_left "lower")
          (#eq? @lower_right "lower")
          (#match? @category "^[\"']prompt_injection[\"']$"))
