defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: instruction-override-classification-question
    desc: Instruction-override classification question
    if:
      type: literal
      regex: '(?i)(prompt|input) (tries|attempts) to override the assistant'
  - id: hidden-prompt-extraction-classification-label
    desc: Hidden-prompt extraction classification label
    if:
      type: literal
      regex: '(?i)(tries|attempts) to extract hidden data or prompts'
