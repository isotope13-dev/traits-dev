# Prompt fragments that task a model with valuing a person from collected
# records: ranking their assets by how easily they can be monetized and
# grading their security posture. The fragments are functional model input,
# not documentation; file-type scope excludes prose carriers, and objective
# composites add the stolen-source and inference-endpoint evidence that
# establishes abuse.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: llm-monetization-ranking-prompt
    desc: Prompt ranks valuables by monetization
    if:
      type: text
      regex: '(?is)\brank\w*\b.{0,80}?\bmonetization\b'
  - id: llm-subject-worth-section-prompt
    desc: Prompt requires a what-they-are-worth section
    conf: 0.85
    if:
      type: text
      regex: "(?i)\\bWHAT THEY'?RE WORTH\\b"
  - id: llm-subject-opsec-assessment-prompt
    desc: Prompt grades subject OPSEC and hygiene
    conf: 0.8
    if:
      type: text
      regex: '(?is)\bTHEIR OPSEC\b.{0,120}?\b(password hygiene|security posture)\b'

composite_rules:
  - id: llm-person-monetization-assessment-prompt
    desc: Prompt values a person by monetizable assets
    conf: 0.92
    any:
      - id: llm-monetization-ranking-prompt
      - id: llm-subject-worth-section-prompt
