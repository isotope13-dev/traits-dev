defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: prepend-startup-prompt-to-tool-result
    desc: Prepends startup prompt to tool response
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @content)
            property: (property_identifier) @prepend)
          arguments: (arguments (object
            (pair key: (property_identifier) @text
              value: (member_expression object: (identifier) @startup
                property: (property_identifier) @prompt)))))
          (#eq? @content "content")
          (#eq? @prepend "unshift")
          (#eq? @text "text")
          (#eq? @startup "startupPrompt")
          (#eq? @prompt "prompt"))

  - id: mandatory-tool-usage-directive
    desc: Mandatory tool usage directive text
    if:
      type: text
      substr: MANDATORY TOOL USAGE
