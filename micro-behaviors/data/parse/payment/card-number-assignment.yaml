defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, html]
traits:
- id: card-number-field-assignment
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Card-number or PAN field assignment
  crit: notable
  conf: 0.75
  if:
    type: text
    # Require a number-bearing object key. A bare `creditcard` key also occurs
    # in public-suffix tables for the .creditcard TLD. The value must be code,
    # not a quoted string: Rich's emoji table maps "credit_card" to a quoted
    # glyph. Quoted uppercase PAN remains supported; unquoted PAN collides with
    # chart and networking APIs.
    regex: '(?m)(^|[{,])\s*(["'']?(?i:card_?number)["'']?|["'']PAN["''])[:=]\s*[^"''\s]'
