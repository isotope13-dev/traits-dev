defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, html]
traits:
- id: mastercard-card-number-context
  desc: Mastercard brand near card-number context
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)\bmastercard\b.{0,64}\b(cardNumber|card_number|credit.?card|pan|bin)\b
