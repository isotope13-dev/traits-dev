defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  # A card-network validation table is ordinary payment parsing. Credential
  # theft requires a separate capture or exfiltration leg in an objective.
  - id: javascript-mastercard-card-number-regex
    desc: Mastercard card-number validation regex
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bmastercard\s*:\s*/\^?5'
