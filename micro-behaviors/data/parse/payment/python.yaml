defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: payment-card-network-major
    desc: Payment-card network name in source
    crit: notable
    conf: 0.82
    if:
      type: literal
      kind: string
      regex: '(?i)\b(UnionPay|Visa|Mastercard)\b'
    unless:
      - id: metadata/file/profile/locale::binary-lang-string-catalog
      - id: metadata/file/extension/identity::sorbet-stub-extension
      - id: well-known/lib/core/increase-api::increase-module-marker
  - id: payment-card-network-amex
    desc: American Express card name in source
    crit: notable
    conf: 0.82
    if:
      type: literal
      kind: string
      regex: '(?i)\b(American[ _-]?Express|Amex)\b'
    unless:
      - id: metadata/file/profile/locale::binary-lang-string-catalog
      - id: metadata/file/extension/identity::sorbet-stub-extension
      - id: well-known/lib/core/increase-api::increase-module-marker
  - id: credit-card-candidate-pattern
    desc: Credit-card parser marker
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b_CC_CANDIDATE_RE\b|\bcard[ _-]?number\b'
    unless:
      - id: metadata/file/extension/identity::sorbet-stub-extension
      - id: well-known/lib/core/increase-api::increase-module-marker
composite_rules:
  - id: payment-card-network-marker
    desc: Payment-card network name in source
    crit: notable
    conf: 0.82
    any:
      - id: payment-card-network-major
      - id: payment-card-network-amex
  - id: payment-card-redaction-logic
    desc: Payment-card redaction and validation logic
    crit: notable
    conf: 0.93
    all:
      - id: payment-card-network-marker
      - id: credit-card-candidate-pattern
      - id: micro-behaviors/data/manipulation::sensitive-value-redaction
    near_lines: 120
