defaults:
  platforms: [unix, windows]
  for: [go, python, javascript, typescript, php, ruby, java]
composite_rules:
  - id: card-verification-and-order-fields
    desc: Card verification and order field references
    crit: notable
    conf: 0.8
    scope: file
    all:
      - id: micro-behaviors/data/parse/payment::card-number-snake-field
      - id: metadata/lang/source/syntax/identity-field::verify-code-token-or-field
    any:
      - id: "metadata/lang/source/naming/variable::goods-name-field"
      - id: "metadata/lang/source/naming/variable::goods-price-field"
      - id: "metadata/lang/source/naming/variable::select-goods-record"
