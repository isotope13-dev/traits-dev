defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, php, html]

traits:
  - id: card-expiry-name-after-http-post
    desc: Card expiry near request or form syntax
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (http\.post|\.post\().{0,500}\bcard.{0,3}expir

  - id: card-expiry-format-after-http-post
    desc: Card expiry near request or form syntax
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (http\.post|\.post\().{0,500}\b(card_exp|mm/yy)\b

  - id: card-number-after-http-post
    desc: Card number near request or form syntax
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (http\.post|\.post\().{0,500}\b(card.?number|cc.?num)\b

