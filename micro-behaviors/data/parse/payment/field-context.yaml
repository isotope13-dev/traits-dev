# Payment field names and nearby request syntax do not establish theft.
# Matchers and exclusions retained from the former credential-access rules.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, html]

traits:
  - id: card-expiry-month-year-field
    desc: Card expiry month or year field
    crit: notable
    conf: 0.6
    if:
      type: text
      # `exp_date` is dropped: it is the stock "expected date" name in test
      # suites (pandas' datetime tests), not a card expiry field.
      regex: (?i)\b(exp_month|exp_year)\b
    unless:
      - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-package-context
      - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-monorepo-package-name
      - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-database-runtime-marker
      - id: well-known/lib/web/server/stack-auth::stack-auth-package-context
      - id: well-known/lib/web/server/stack-auth::stripe-payment-method-expiry-fields
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/source-map::sourcemap
  - id: card-expiry-short-field
    desc: Short-form card expiry field
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bcard_exp\b
  - id: card-expiry-mm-yy-input
    desc: HTML input has a card-style MM/YY field
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,180}(placeholder|name|id)\s*=\s*["''][^"'']{0,60}(mm/yy|card_exp)'
  - id: card-number-name-reference
    desc: References a card-number field name
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(card.?number|cc.?num)\b
    unless:
    - id: metadata/file/catalog/identity/
    - id: metadata/build/recognized-contexts/
  # A message that asks for the card number and the PIN in one breath is a
  # harvest instruction. Payment docs name the fields, so this stays
  # suspicious until a greeting or a click-through link joins it.
  - id: card-number-and-pin-request
    desc: Asks for a card number and PIN
    crit: suspicious
    conf: 0.9
    for: [html]
    if:
      type: text
      regex: '(?is)\bcard.?number\b.{0,80}\bPIN\b'
      exclude_html_comments: true
    unless:
    - id: metadata/file/catalog/identity/
    - id: metadata/build/recognized-contexts/
  - id: russian-card-number-label
    desc: Russian payment-card number label
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: "Номер\\s+карты"
composite_rules:
  - id: payment-card-fields-near-request
    desc: Payment-card fields coexist with request syntax
    crit: notable
    conf: 0.9
    all:
    - id: micro-behaviors/data/parse/payment::cvv-cvc-name-reference
    - id: micro-behaviors/data/parse/payment::payment-field-request-reference
    any:
    - id: card-expiry-month-year-field
    - id: micro-behaviors/ui/window/banking-field::russian-card-expiry-label
    - id: card-expiry-short-field
    - id: card-expiry-mm-yy-input
    - id: card-number-name-reference
    - id: russian-card-number-label
    - id: micro-behaviors/data/format/card::luhn-checksum
    - id: micro-behaviors/data/parse/payment::javascript-mastercard-card-number-regex
    unless:
    - id: well-known/lib/ai/inspect-evals::eval-corpus-context
    - id: well-known/lib/vendor-sdk/braintree::braintree-web-package-path
    - id: well-known/lib/vendor-sdk/masterpass/
    - id: well-known/lib/vendor-sdk/stripe/
    - id: well-known/lib/vendor-sdk/pagseguro/
    - id: well-known/lib/vendor-sdk/pagarme/
