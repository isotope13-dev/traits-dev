# A parser for operator-supplied card tuples; this does not establish theft.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: pipe-delimited-card-regex
    desc: Compiles a pipe-delimited card-data regex
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(re\.)?compile$'
      arg:
        kind: string
        regex: '\\d\{1[2-9],19\}\\\|.{0,80}\\d\{3,4\}'
