---
defaults:
  platforms:
  - unix
  - windows
  for:
  - html
  - javascript
  - typescript
  crit: notable
  conf: 0.92
traits:
- id: payment-card-field-name
  desc: Names payment-card data fields
  if:
    type: text
    regex: (?i)\b(card(number|_number|_expiry)|cvv|cvc)\b[\s"'=:]
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/file/line::javascript-line-over-20000
