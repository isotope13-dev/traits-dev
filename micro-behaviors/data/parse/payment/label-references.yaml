defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
traits:
  - id: account-number-copy
    desc: Account number text reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Account Number"
  - id: card-number-copy
    desc: Card number text reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "Card Number"
    unless:
      - id: metadata/file/catalog/identity/
      - id: metadata/build/recognized-contexts/
