# Server-side payment-record field keys, in the snake_case vocabulary that
# checkout backends, order controllers, and phishing-kit harvest records use
# (`card_number`, `expiry_date`, `verify_code`). The existing payment atoms
# cover browser/processor spellings (`cardNumber`, `exp_month`, `cc-num`);
# these cover the serialized-record spellings shared by Go struct tags, JSON
# bodies, and PHP/Python request maps.
#
# Each matcher requires the token quoted (a string literal, key, struct tag,
# or subscript) or as a bare word in key/assignment position, so prose that
# merely mentions card data does not match.
# Legitimate storefront and processor code carries the same keys, so these
# stay notable: intent comes from composites that pair them with
# purchase-item context outside a payment SDK.
defaults:
  platforms: [unix, windows]
  for: [go, python, javascript, typescript, php, ruby, java, json]
  crit: notable
  conf: 0.75

traits:
  - id: card-number-snake-field
    desc: Snake-case card-number record field
    if:
      type: text
      regex: '(?i)["'']card_number["'']|\bcard_number\b\s*[:=]'

  - id: card-expiry-date-field
    desc: Snake-case card-expiry record field
    if:
      type: text
      regex: '(?i)["'']expiry_date["'']|\bexpiry_date\b\s*[:=]'

  - id: card-verify-code-field
    desc: Snake-case verification-code record field
    if:
      type: text
      regex: '(?i)["'']verify_code["'']|\bverify_code\b\s*[:=]'
