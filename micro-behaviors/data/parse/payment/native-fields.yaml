# Payment-field handling is neutral application behavior. Theft intent requires
# an exfiltration composite in objectives/credential-access/.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, macho, elf]
  crit: notable

traits:
  # Require key/assignment syntax so Steam (and similar) billing error prose
  # like "Credit card number is invalid" is not labeled a payment-field parse.
  - id: payment-card-number-phrase
    desc: Payment-card number field phrase
    conf: 0.75
    if:
      type: text
      regex: '(?i)["'']?(credit|debit|payment)[-_. ]card[-_. ]number["'']?\s*[:=]'
  - id: card-number-field-key-quoted
    desc: Quoted card-number or PAN field key
    conf: 0.75
    if:
      type: text
      regex: '(?i)["'']card[-_. ]?number["'']\s*[:=]|["'']pan["'']\s*[:=]'

  - id: card-number-field-key-unquoted
    desc: Unquoted card-number or PAN field key
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bcard[-_.]?number\b\s*[:=]|\bcardNumber\b\s*[:=]|\bpan\b\s*[:=]'
  - id: managed-cvv-field
    desc: Payment-card CVV or CVC field
    conf: 0.75
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])["'']?cv[vc]2?["'']?[[:space:]]*[:=]'
    unless:
      - id: metadata/library/generated-fhir::generated-fhir-schema-data
      - id: metadata/library/qt::pyqt-binding-path
  # Require assignment/key syntax so prose like Steam's billing error
  # "does not match the credit card type" is not labeled a field reference.
  - id: managed-card-type-field
    desc: Payment-card type field reference
    conf: 0.7
    if:
      type: text
      regex: '(?i)["'']?card[-_. ]?type["'']?\s*[:=]'
    unless:
      - id: metadata/library/generated-fhir::generated-fhir-schema-data
      - id: metadata/library/qt::pyqt-binding-path
      - id: metadata/library/generated::winmd-metadata
  - id: managed-card-expiry-field
    desc: Payment-card expiration field reference
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bcard[-_. ]?(expir(ation|y)[-_. ]?date|expiry)\b'
    unless:
      - id: metadata/library/generated-fhir::generated-fhir-schema-data
      - id: metadata/library/qt::pyqt-binding-path

composite_rules:
  - id: managed-card-number-field
    desc: Payment-card number field reference
    crit: notable
    conf: 0.75
    any:
      - id: payment-card-number-phrase
      - id: card-number-field-key-quoted
      - id: card-number-field-key-unquoted
    unless:
      - id: metadata/library/generated-fhir::generated-fhir-schema-data
      - id: metadata/library/qt::pyqt-binding-path

  - id: managed-card-data-fields
    desc: Card number and expiry handled together
    crit: notable
    conf: 0.85
    all:
      - id: managed-card-number-field
      - id: managed-card-expiry-field
    # Managed metadata heaps do not preserve source-level field proximity:
    # adjacent JSON keys can land in separate string tables many KB apart.
    # Keep this file-scoped; hostile consumers must additionally require an
    # HTTP client and high-confidence external-C2 evidence.
