defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - pe
  - dll
  - macho
  - elf
  crit: notable
traits:
- id: payment-card-number-phrase
  desc: Payment-card number field phrase
  conf: 0.75
  if:
    type: text
    regex: (?i)["']?(credit|debit|payment)[-_. ]card[-_. ]number["']?\s*[:=]
- id: card-number-field-key-quoted
  desc: Quoted card-number or PAN field key
  conf: 0.75
  if:
    type: text
    regex: (?i)["']card[-_. ]?number["']\s*[:=]|["']pan["']\s*[:=]
- id: card-number-field-key-unquoted
  desc: Unquoted card-number field key
  conf: 0.75
  if:
    type: text
    regex: (?i)\bcard[-_.]?number\b\s*[:=]|\bcardNumber\b\s*[:=]
- id: managed-cvv-field
  desc: Payment-card CVV or CVC field
  conf: 0.75
  if:
    type: text
    regex: (?i)["']cv[vc]2?["'][[:space:]]*[:=]|\bcv[vc]2?\b[[:space:]]*[:=]
  unless:
  - id: metadata/build/generated::generated-fhir-schema-data
  - id: metadata/path::pyqt-binding-path
- id: managed-card-type-field
  desc: Payment-card type field reference
  conf: 0.7
  if:
    type: text
    regex: (?i)["']?card[-_. ]?type["']?\s*[:=]
  unless:
  - id: metadata/build/generated::generated-fhir-schema-data
  - id: metadata/path::pyqt-binding-path
  - id: metadata/build/generated::winmd-metadata
- id: managed-card-expiry-field
  desc: Payment-card expiration field reference
  conf: 0.75
  if:
    type: text
    regex: (?i)\bcard[-_. ]?(expir(ation|y)[-_. ]?date|expiry)\b
  unless:
  - id: metadata/build/generated::generated-fhir-schema-data
  - id: metadata/path::pyqt-binding-path
- id: managed-merchant-id-field
  desc: Payment merchant ID field reference
  conf: 0.72
  if:
    type: text
    regex: (?i)merchant[-_. ]?id
- id: managed-gateway-public-key-field
  desc: Gateway public-key field reference
  conf: 0.7
  if:
    type: text
    regex: (?i)gateway.{0,40}\bpublic[-_. ]?key|\bpublic[-_. ]?key.{0,40}gateway
- id: managed-gateway-private-key-field
  desc: Gateway private-key field reference
  conf: 0.75
  if:
    type: text
    regex: (?i)gateway.{0,40}\bprivate[-_. ]?key|\bprivate[-_. ]?key.{0,40}gateway
composite_rules:
- id: managed-card-number-field
  desc: Payment-card number field reference
  conf: 0.75
  any:
  - id: payment-card-number-phrase
  - id: card-number-field-key-quoted
  - id: card-number-field-key-unquoted
  unless:
  - id: metadata/build/generated::generated-fhir-schema-data
  - id: metadata/path::pyqt-binding-path
- id: managed-card-data-fields
  desc: Card number and expiry handled together
  conf: 0.85
  all:
  - id: managed-card-number-field
  - id: managed-card-expiry-field
- id: managed-gateway-credential-triple
  desc: Gateway merchant and key fields together
  conf: 0.85
  all:
  - id: managed-merchant-id-field
  - id: managed-gateway-public-key-field
  - id: managed-gateway-private-key-field
