# Payment-field names are normal storefront behavior.  These atoms
# require field-key or selector syntax so documentation that merely discusses
# card data does not match; exfiltration intent is supplied by objective
# composites that connect the fields to a live network sink.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  crit: component
  conf: 0.92

traits:
  - id: standard-card-number-field-key
    desc: Card or CC number field key
    if:
      type: text
      regex: '(?i)\b(card|cc)[-_]?(number|num)\b["'']?\s*(\]|[:=,])'

  - id: credit-card-number-field-key
    crit: notable
    desc: Credit-card number field key
    if:
      type: text
      regex: '(?i)\bcredit[-_]?card[-_]?(number|num)\b["'']?\s*(\]|[:=,])'

  - id: pan-field-key
    crit: notable
    desc: PAN field key
    if:
      type: text
      regex: '(?i)(\bprimary[-_]?account[-_]?number\b|["'']pan["''])["'']?\s*(\]|[:=])'

  - id: short-card-security-field-key
    crit: notable
    desc: CVV, CVC or security-code field key
    if:
      type: text
      regex: '(?i)\b(cvv2?|cvc2?|security[-_]?code)\b["'']?\s*(\]|[:=,])'
    unless:
      # Obfuscator minified tables reuse CVV/CVC as property names.
      - id: metadata/file/line::javascript-line-over-20000

  - id: long-card-security-field-key
    crit: notable
    desc: Card-verification field key
    if:
      type: text
      regex: '(?i)\bcard[-_]?(security|verification)[-_]?(code|value)\b["'']?\s*(\]|[:=,])'

  - id: prefixed-card-expiration-field-key
    crit: notable
    desc: Card-prefixed expiration field key
    if:
      type: text
      regex: '(?i)\bcard[-_]?(exp|expiry|expiration)([-_]?(date|month|year))?\b["'']?\s*(\]|[:=,])'

  - id: short-card-expiration-field-key
    crit: notable
    desc: Short-form expiry field key
    if:
      type: text
      regex: '(?i)\b(exp|expiry)[-_]?(month|year)\b["'']?\s*(\]|[:=])'

  - id: cardholder-name-field-key
    crit: notable
    desc: Cardholder-name field key
    if:
      type: text
      regex: '(?i)\b(cardholder[-_]?name|name[-_]?on[-_]?card|cc[-_]?name)\b["'']?\s*(\]|[:=,])'

  - id: billing-address-field-key
    crit: notable
    desc: Billing-address field key
    if:
      type: text
      regex: '(?i)\bbilling[-_]?(address([_-]?(1|line1))?|street|line1)\b["'']?\s*(\]|[:=,])'

  # Phone, email and postal-code keys are generic field names -- every contact
  # form and settings page has them, and a button labelled 'EMAIL' matches.
  # They describe a checkout only together, in checkout-pii-field-set.
  - id: phone-field-key
    desc: Phone field key or selector
    if:
      type: text
      regex: '(?i)\bphone\b["'']?\s*(\]|[:=,])'

  - id: email-field-key
    desc: Email field key or selector
    if:
      type: text
      regex: '(?i)\bemail\b["'']?\s*(\]|[:=,])'

  - id: pincode-field-key
    desc: Postal-code field key or selector
    if:
      type: text
      regex: '(?i)\b(pincode|postal[-_]?code|zip[-_]?code)\b["'']?\s*(\]|[:=,])'

composite_rules:
  - id: card-number-field-key
    desc: Card-number field key
    crit: component
    any:
      - id: standard-card-number-field-key
      - id: credit-card-number-field-key
      - id: pan-field-key

  - id: card-security-field-key
    desc: Card-security field key
    crit: component
    any:
      - id: short-card-security-field-key
      - id: long-card-security-field-key

  - id: card-expiration-field-key
    desc: Expiration field key
    crit: component
    any:
      - id: prefixed-card-expiration-field-key
      - id: short-card-expiration-field-key

  - id: payment-card-secret-pair
    desc: Fields name card number and security code
    crit: notable
    conf: 0.95
    all:
      - id: card-number-field-key
      - id: card-security-field-key
    near_bytes: 900

  - id: payment-card-field-set
    desc: Fields name card number, expiry and security code
    crit: notable
    conf: 0.97
    all:
      - id: payment-card-secret-pair
      - id: card-expiration-field-key
    near_bytes: 1200

  - id: cardholder-billing-field-set
    desc: Fields name cardholder name and billing address
    crit: notable
    conf: 0.95
    all:
      - id: cardholder-name-field-key
      - id: billing-address-field-key
    near_bytes: 900

  - id: checkout-pii-field-set
    desc: Fields name phone, email and postal-code fields
    crit: notable
    conf: 0.95
    all:
      - id: phone-field-key
      - id: email-field-key
      - id: pincode-field-key
    near_bytes: 1200
