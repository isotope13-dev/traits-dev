# Browser payment-field names are normal storefront behavior.  These atoms
# require field-key or selector syntax so documentation that merely discusses
# card data does not match; exfiltration intent is supplied by objective
# composites that connect the fields to a live network sink.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  crit: component
  conf: 0.92

traits:
  - id: browser-standard-card-number-field-key
    desc: Browser card or CC number field key
    if:
      type: text
      regex: '(?i)\b(card|cc)[-_]?(number|num)\b["'']?\s*(\]|[:=,])'

  - id: browser-credit-card-number-field-key
    desc: Browser credit-card number field key
    if:
      type: text
      regex: '(?i)\bcredit[-_]?card[-_]?(number|num)\b["'']?\s*(\]|[:=,])'

  - id: browser-pan-field-key
    desc: Browser PAN field key
    if:
      type: text
      regex: '(?i)(\bprimary[-_]?account[-_]?number\b|["'']pan["''])["'']?\s*(\]|[:=,])'

  - id: browser-short-card-security-field-key
    desc: Browser CVV, CVC or security-code field key
    if:
      type: text
      regex: '(?i)\b(cvv2?|cvc2?|security[-_]?code)\b["'']?\s*(\]|[:=,])'

  - id: browser-long-card-security-field-key
    desc: Browser card-verification field key
    if:
      type: text
      regex: '(?i)\bcard[-_]?(security|verification)[-_]?(code|value)\b["'']?\s*(\]|[:=,])'

  - id: browser-prefixed-card-expiration-field-key
    desc: Browser card-prefixed expiration field key
    if:
      type: text
      regex: '(?i)\bcard[-_]?(exp|expiry|expiration)([-_]?(date|month|year))?\b["'']?\s*(\]|[:=,])'

  - id: browser-short-card-expiration-field-key
    desc: Browser expiration-date field key
    if:
      type: text
      regex: '(?i)\b(exp|expiry|expiration)[-_]?(date|month|year)\b["'']?\s*(\]|[:=,])'

  - id: browser-cardholder-name-field-key
    desc: Browser cardholder-name field key
    if:
      type: text
      regex: '(?i)\b(cardholder[-_]?name|name[-_]?on[-_]?card|cc[-_]?name)\b["'']?\s*(\]|[:=,])'

  - id: browser-billing-address-field-key
    desc: Browser billing-address field key
    if:
      type: text
      regex: '(?i)\bbilling[-_]?(address([_-]?(1|line1))?|street|line1)\b["'']?\s*(\]|[:=,])'

composite_rules:
  - id: browser-card-number-field-key
    desc: Browser card-number field key
    crit: component
    any:
      - id: browser-standard-card-number-field-key
      - id: browser-credit-card-number-field-key
      - id: browser-pan-field-key

  - id: browser-card-security-field-key
    desc: Browser card-security field key
    crit: component
    any:
      - id: browser-short-card-security-field-key
      - id: browser-long-card-security-field-key

  - id: browser-card-expiration-field-key
    desc: Browser expiration field key
    crit: component
    any:
      - id: browser-prefixed-card-expiration-field-key
      - id: browser-short-card-expiration-field-key

  - id: browser-payment-card-secret-pair
    desc: Browser handles card number and security code
    crit: notable
    conf: 0.95
    all:
      - id: browser-card-number-field-key
      - id: browser-card-security-field-key
    near_bytes: 900

  - id: browser-payment-card-field-set
    desc: Browser handles card number, expiry and security code
    crit: notable
    conf: 0.97
    all:
      - id: browser-payment-card-secret-pair
      - id: browser-card-expiration-field-key
    near_bytes: 1200

  - id: browser-cardholder-billing-field-set
    desc: Browser handles cardholder name and billing address
    crit: notable
    conf: 0.95
    all:
      - id: browser-cardholder-name-field-key
      - id: browser-billing-address-field-key
    near_bytes: 900
