# Android ML Kit OCR is dual-use.  It becomes a useful signal when combined
# with UI automation and visual targeting, so the API and processing step are
# exposed separately for higher-level composites.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, apk, zip]
  crit: notable
  conf: 0.9

traits:
  - id: android-mlkit-text-recognition-api
    desc: Android ML Kit text recognition API
    if:
      type: text
      regex: '(?i)\b(TextRecognition|TextRecognizer)\b'

  - id: android-mlkit-text-processing
    desc: Processes an image with ML Kit OCR
    if:
      type: text
      regex: '(?is)\b(TextRecognition|TextRecognizer)\b.{0,96}\bprocess\s*\('

composite_rules:
  - id: android-mlkit-ocr
    desc: Android ML Kit OCR workflow
    all:
      - id: android-mlkit-text-recognition-api
      - id: android-mlkit-text-processing
