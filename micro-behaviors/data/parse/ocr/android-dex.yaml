defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-mlkit-recognized-text-read
    desc: Reads ML Kit OCR text
    if:
      type: symbol
      kind: call
      exact: Lcom/google/mlkit/vision/text/Text;->getText
  - id: dex-mlkit-text-blocks-read
    desc: Reads ML Kit OCR text blocks
    if:
      type: symbol
      kind: call
      exact: Lcom/google/mlkit/vision/text/Text;->getTextBlocks
