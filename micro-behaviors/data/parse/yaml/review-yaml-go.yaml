# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.9
traits:
- id: yaml-unmarshal
  desc: Unmarshals YAML data in Go
  if:
    type: symbol
    kind: call
    exact: yaml.Unmarshal
composite_rules:
- id: go-yaml-parser
  desc: Go source parses YAML data
  crit: notable
  conf: 0.92
  all:
  - id: metadata/import/package::yaml-v3-import
  - id: micro-behaviors/data/parse/yaml::yaml-unmarshal
