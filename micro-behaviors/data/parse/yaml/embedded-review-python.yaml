defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: base64-and-unsafe-yaml-at-module-level
    desc: Base64 and unsafe YAML at module level
    conf: 0.98
    near_lines: 15
    all:
      - id: micro-behaviors/data/parse/yaml::yaml-load-call
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    any:
      - id: micro-behaviors/data/parse/yaml::yaml-loader-unsafe
      - id: micro-behaviors/data/parse/yaml::yaml-unsafe-load
    unless:
      - id: metadata/path/directory::test-directory-component
    crit: suspicious
