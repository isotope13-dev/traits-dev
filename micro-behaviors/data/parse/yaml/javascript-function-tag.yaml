defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: yaml-javascript-function-tag
    desc: YAML JavaScript function tag text
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'tag:yaml.org,2002:js/function'

composite_rules:
  - id: yaml-function-tag-dynamic-evaluator
    desc: YAML function tag and dynamic evaluator coexist
    crit: suspicious
    conf: 0.93
    near_bytes: 4096
    all:
      - id: yaml-javascript-function-tag
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
