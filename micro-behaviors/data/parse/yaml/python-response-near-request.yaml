defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: unsafe-yaml-loader-near-http-request
    desc: HTTP request near unsafe YAML loader
    crit: suspicious
    conf: 0.9
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: micro-behaviors/data/parse/yaml::yaml-loader-unsafe
      - id: micro-behaviors/data/parse/yaml::yaml-unsafe-load
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: micro-behaviors/os/security/scan/signature::code-pattern-catalog
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
