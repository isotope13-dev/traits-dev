defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: phone-number-text-parser
    desc: Parses phone numbers from text
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: findPhoneNumbersInText

  - id: multi-country-phone-regex-table
    desc: Defines country-specific phone validators
    crit: notable
    conf: 0.9
    count_min: 15
    if:
      type: text
      regex: '\(\\\+\?'
