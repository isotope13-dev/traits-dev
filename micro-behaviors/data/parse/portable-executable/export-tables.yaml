defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: x64-export-name-ordinal-address-tables
    desc: Loads PE export lookup tables
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # IMAGE_EXPORT_DIRECTORY AddressOfFunctions, AddressOfNames, and
      # AddressOfNameOrdinals (+1c/+20/+24), rebased against the same image.
      pattern: '(46 8B 4C 01 1C 46 8B 5C 01 20 49 01 CB 42 8B 74 01 24 48 01 CE 49 01 C9 | 42 8B 6C 3E 1C 46 8B 6C 3E 20 49 01 F5 42 8B 44 3E 24 48 01 F0 48 89 44 24 ?? 48 01 F5)'
