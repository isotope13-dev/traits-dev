defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: high-entropy-pe-parser
    for: [elf, macho, pe]
    desc: High-entropy image contains PE signature or import-parsing code
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
      - id: metadata/file/entropy::very-high-overall-entropy-75
    any:
      - id: micro-behaviors/data/format/executable/header::x86-mz-pe-signature-check
      - id: micro-behaviors/os/api-resolution/export-table::asm-manual-import-parsing
    unless:
      - id: metadata/file/magic/identity::zip-archive
      - id: metadata/installer/product/
