defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: x86-stack-mz-byte-pair-check
    desc: Checks adjacent bytes for an MZ signature
    crit: notable
    conf: 0.98
    arch: [x86]
    if:
      # Bind the two compares to consecutive bytes in the same stack buffer.
      # This establishes a magic check, not signature verification or trust.
      type: yara
      source: |
        import "pe"
        rule x86_stack_mz_byte_pair_check {
          strings:
            $check = {
              80 BD ?? ?? ?? ?? 4D 75 ??
              80 BD ?? ?? ?? ?? 5A 74 ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for any c in (1..#check) : (
              uint32(@check[c]+2)+1 == uint32(@check[c]+11)
            )
        }

  - id: x86-inline-e-lfanew-pe-walk
    desc: Checks PE signature through DOS header offset
    crit: notable
    conf: 0.97
    size_max: 52428800
    arch: [x86]
    if:
      type: hex
      section: .text
      # Add the DOS e_lfanew field at +0x3c to an image base, then compare the
      # pointed dword with PE\0\0. This is the core of an inline PE header walk.
      # Polymorphic stubs may interleave arithmetic junk between the e_lfanew
      # addition and PE-signature comparison. Keep both semantic anchors while
      # allowing that bounded instruction churn.
      pattern: '03 ?? 3C [0-64] 81 3? 50 45 00 00'
