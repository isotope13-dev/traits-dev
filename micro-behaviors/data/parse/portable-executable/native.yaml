defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: x86-stack-mz-byte-pair-check
    desc: Checks adjacent bytes for an MZ signature
    crit: notable
    conf: 0.98
    arch: [x86]
    if:
      # Bind the two compares to consecutive bytes in the same stack buffer.
      # This establishes a magic check, not signature verification or trust.
      type: yara
      source: |
        import "pe"
        rule x86_stack_mz_byte_pair_check {
          strings:
            $check = {
              80 BD ?? ?? ?? ?? 4D 75 ??
              80 BD ?? ?? ?? ?? 5A 74 ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for any c in (1..#check) : (
              uint32(@check[c]+2)+1 == uint32(@check[c]+11)
            )
        }

