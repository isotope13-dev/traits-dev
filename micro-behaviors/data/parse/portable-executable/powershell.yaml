# Script-level PE structure parsing. A PowerShell script that reads Windows
# loader-header fields out of image bytes is inspecting or mapping an
# executable image itself rather than handing it to the OS loader. Field
# inspection alone stays notable; the pair (DOS header plus optional-header
# fields relative to e_lfanew) is the manual-mapping preparation shape.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # 60 is the e_lfanew field offset in the DOS header (4Ch), a PE constant.
  - id: powershell-dos-header-offset-read
    desc: Reads the e_lfanew field from image bytes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)BitConverter\]::To(Int32|UInt32)\(\s*\$\w+\s*,\s*60\s*\)'
  # A value read at a computed offset is incomplete evidence alone (any byte
  # parser matches); beside the e_lfanew read it identifies optional-header
  # field access, so it is a component leg of the composite below.
  - id: powershell-computed-offset-read
    desc: Reads a value at computed offset
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)BitConverter\]::To(UInt16|UInt32|Int64)\(\s*\$\w+,\s*\$\w+\s*\+\s*\d{1,3}\)'

composite_rules:
  - id: powershell-pe-header-manual-parse
    desc: Parses PE header structure from image bytes
    crit: suspicious
    conf: 0.93
    near_lines: 60
    all:
      - id: powershell-dos-header-offset-read
      - id: powershell-computed-offset-read
