# Managed code that walks a PE section table byte by byte: each character of
# ".text" is loaded as an ldc.i4.s immediate and compared with a branch
# (bne.un / bne.un.s / beq / beq.s). Module unhookers and manual mappers
# locate the code section this way. Locating a section establishes neither
# a write nor a hook removal.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-text-section-name-compare
    desc: CIL byte compare against .text name
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: "1F 2E (40 ?? ?? ?? ?? | 33 ?? | 3B ?? ?? ?? ?? | 2E ??) [6-48] 1F 74 (40 ?? ?? ?? ?? | 33 ?? | 3B ?? ?? ?? ?? | 2E ??) [6-48] 1F 65 (40 ?? ?? ?? ?? | 33 ?? | 3B ?? ?? ?? ?? | 2E ??) [6-48] 1F 78 (40 ?? ?? ?? ?? | 33 ?? | 3B ?? ?? ?? ?? | 2E ??) [6-48] 1F 74 (40 ?? ?? ?? ?? | 33 ?? | 3B ?? ?? ?? ?? | 2E ??)"
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
