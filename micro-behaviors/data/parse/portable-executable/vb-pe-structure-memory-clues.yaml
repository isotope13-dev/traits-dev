defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: vb-pe-structure-memory-clues
    desc: VB PE structure and memory clues
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/header::vb-image-header-type-decl
      - id: micro-behaviors/data/embedded/payload/header::vb-e-lfanew-field-decl
    any:
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite-vb6
      - id: micro-behaviors/mem/inline-asm::vb-hex-string-to-byte-buffer
      - id: micro-behaviors/dylib/lookup::vb-dll-function-call-declare
