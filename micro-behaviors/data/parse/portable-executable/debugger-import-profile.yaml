composite_rules:
- id: unsigned-pe-header-walk-debugger-import-profile
  desc: Unsigned PE header-walk code, embedded DOS bytes and debugger API import
  crit: notable
  conf: 0.96
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: metadata/binary/symbols/count::many-imports
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
