defaults:
  platforms:
  - unix
  - windows
  size_max: 120000000
traits:
- id: pe-mz-compare-x64
  desc: x64 comparison with MZ magic
  crit: notable
  conf: 0.94
  for:
  - pe
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 66 81 ?? 4D 5A
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
