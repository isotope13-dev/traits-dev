defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
- id: fetched-html-domparser
  desc: Fetch response parsed as an HTML DOM
  crit: notable
  conf: 0.94
  for: [scripts, html]
  if:
    type: text
    regex: '(?is)\bfetch\s*\(.{0,300}\bDOMParser\s*\(\s*\)\.parseFromString\s*\('

- id: csrf-input-value-read
  desc: Reads an anti-CSRF input value
  crit: notable
  conf: 0.96
  for: [scripts, html]
  if:
    type: text
    regex: '(?i)querySelector\(.{0,100}(csrf|xsrf).{0,100}\)\.value'

- id: tiktok-hydration-state-marker
  desc: TikTok embedded hydration JSON marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: __UNIVERSAL_DATA_FOR_REHYDRATION__

- id: tiktok-sigi-state-marker
  desc: TikTok SIGI state JSON marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: SIGI_STATE

- id: dom-body-text-substring
  desc: Reads rendered DOM text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'document\.body\.innerText\.substring\s*\('

- id: browser-document-html-snapshot-read
  desc: Reads complete page HTML snapshot
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'document\.documentElement\.outerHTML\b'

- id: unicode-escaped-document-html-snapshot-read
  desc: Reads page HTML via escaped properties
  crit: notable
  conf: 0.94
  if:
    type: encoded
    encoding: unicode-escape
    regex: 'document.{0,32}documentElement.{0,32}outerHTML'

composite_rules:
- id: fetched-html-csrf-input-read
  desc: Fetch response yields an anti-CSRF value
  crit: notable
  conf: 0.97
  for: [scripts, html]
  all:
  - id: fetched-html-domparser
  - id: csrf-input-value-read
  near_bytes: 1200

- id: browser-document-html-snapshot-read-any
  desc: Reads complete page HTML snapshot
  crit: notable
  conf: 0.94
  any:
  - id: browser-document-html-snapshot-read
  - id: unicode-escaped-document-html-snapshot-read

- id: tiktok-hydration-json-parse
  for: [javascript]
  desc: Parses TikTok embedded hydration state
  crit: notable
  conf: 0.95
  near_bytes: 1200
  any:
  - id: tiktok-hydration-state-marker
  - id: tiktok-sigi-state-marker
  all:
  - id: micro-behaviors/data/serialize/json::json-parse-call
