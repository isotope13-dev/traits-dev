defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
traits:
  - id: regex-script-tag-content
    desc: Regex extracts HTML script-tag content
    conf: 0.95
    if:
      type: text
      regex: 'Regex\.(Match|Matches)\s*\([^\n]{0,160}<script>[^\n]{1,80}</script>'

  - id: constructed-script-tag-regex
    desc: Constructs HTML script extraction regex
    conf: 0.94
    if:
      type: text
      regex: 'new\s+Regex\s*\([^;]{0,160}<script>[^;]{1,80}</script>'

  - id: assigned-script-tag-regex
    desc: Script pattern followed by Regex construction
    conf: 0.92
    if:
      type: text
      regex: '(?s)"<script>[^"\n]{1,80}</script>";.{0,80}new\s+Regex\s*\('

composite_rules:
  - id: script-tag-regex-extraction
    desc: HTML script-content extraction regex
    crit: notable
    conf: 0.94
    any:
      - id: regex-script-tag-content
      - id: constructed-script-tag-regex
      - id: assigned-script-tag-regex
