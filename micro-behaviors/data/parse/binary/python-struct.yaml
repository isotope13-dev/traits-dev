defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-unpack-three-bytes
    desc: Unpacks three unsigned byte fields
    if:
      type: symbol
      kind: call
      exact: struct.unpack
      arg:
        index: 0
        kind: string
        regex: '^[!@=<>]?BBB$'
