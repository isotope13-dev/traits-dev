defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: opcode-address-offset-eight
    desc: Unpacks opcode and address from bytes 8-20
    if:
      type: tree-sitter
      kind: call
      regex: 'struct\.unpack\(\s*["''][!>]BB4sHB3[sx]["'']\s*,\s*[a-zA-Z_]\w*\[\s*8\s*:\s*20\s*\]\s*\)'
