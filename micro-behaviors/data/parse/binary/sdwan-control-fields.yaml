# Published SD-WAN control-message selectors, not implant names. Require a
# parsed search call with the bytes as an argument: prose, comments, and a
# dissector's passive constants do not establish parsing. Native memmem and
# managed byte/string searches express the same operation.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, javascript, rust]
  crit: notable
  conf: 0.95

traits:
  - id: sdwan-public-ip-field-search
    desc: Searches SD-WAN public-IP field bytes
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(memmem|find|indexOf)$'
      arg:
        kind: string
        exact: "\x40\x03\x06"

  - id: sdwan-system-ip-field-search
    desc: Searches SD-WAN system-IP field bytes
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(memmem|find|indexOf)$'
      arg:
        kind: string
        exact: "\x40\x0c\x04"

  - id: sdwan-key-field-search
    desc: Searches SD-WAN key-material field bytes
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(memmem|find|indexOf)$'
      arg:
        kind: string
        exact: "\x05\x01\x0c\x06\x40"

composite_rules:
  - id: sdwan-control-key-field-parser
    desc: Parses SD-WAN addressing and key fields
    near_bytes: 1024
    all:
      - id: sdwan-public-ip-field-search
      - id: sdwan-system-ip-field-search
      - id: sdwan-key-field-search
