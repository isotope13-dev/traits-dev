# Published SD-WAN control-message selectors, not implant names. Require a
# parsed search/comparison call with the bytes as an argument: prose, comments, and a
# dissector's passive constants do not establish parsing. Native memmem and
# managed byte/string searches express the same operation. A sliding memcmp
# loop is equivalent to memmem; Index/IndexOf cover managed and Go
# implementations without depending on implant names or chosen paths.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, javascript, rust, go, csharp]
  crit: notable
  conf: 0.95

traits:
  - id: sdwan-public-ip-field-search
    desc: Searches or compares SD-WAN public-IP bytes
    if:
      type: symbol
      kind: call
      regex: '^(.*[.:])?(mem(mem|cmp)|find|[Ii]ndex(Of)?)$'
      arg:
        kind: string
        exact: "\x40\x03\x06"

  - id: sdwan-system-ip-field-search
    desc: Searches or compares SD-WAN system-IP bytes
    if:
      type: symbol
      kind: call
      regex: '^(.*[.:])?(mem(mem|cmp)|find|[Ii]ndex(Of)?)$'
      arg:
        kind: string
        exact: "\x40\x0c\x04"

  - id: sdwan-key-field-search
    desc: Searches or compares SD-WAN key-field bytes
    if:
      type: symbol
      kind: call
      regex: '^(.*[.:])?(mem(mem|cmp)|find|[Ii]ndex(Of)?)$'
      arg:
        kind: string
        exact: "\x05\x01\x0c\x06\x40"

composite_rules:
  - id: sdwan-control-key-field-parser
    desc: Parses SD-WAN addressing and key fields
    near_bytes: 1024
    all:
      - id: sdwan-public-ip-field-search
      - id: sdwan-system-ip-field-search
      - id: sdwan-key-field-search
