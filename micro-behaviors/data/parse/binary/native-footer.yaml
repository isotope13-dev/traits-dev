defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
  crit: notable
  conf: 0.97
traits:
- id: x86-eof-length-pair-reader
  desc: x86 reads an EOF-relative length pair
  if:
    type: yara
    source: |
      import "pe"
      rule eof_length_pair_reader {
        strings:
          $code = { 6A 02 [0-4] 6A F8 (8B CE|56 59) 58 2B 05 ?? ?? ?? ?? 50 E8 ?? ?? ?? ?? 8D 45 ?? 6A 04 50 (8B CE|56 59) E8 ?? ?? ?? ?? 8D 45 ?? 6A 04 50 (8B CE|56 59) E8 ?? ?? ?? ?? 6A 00 (8B CE|56 59) FF 75 ?? E8 ?? ?? ?? ?? }
        condition:
          pe.machine == pe.MACHINE_I386 and (
            for any s in pe.sections : (
              (s.name == ".text" or s.characteristics & pe.SECTION_MEM_EXECUTE != 0) and
              $code in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size)
            ) or (pe.overlay.size > 0 and $code in (pe.overlay.offset..filesize))
          )
      }
