traits:
- id: go-cryptobyte-asn1-core
  desc: Go cryptobyte ASN.1 reader references
  conf: 0.9
  if:
    type: text
    regex: cryptobyte\.\(\*String\)\.ReadASN1(Integer|Boolean|BitString|ObjectIdentifier)
- id: go-cryptobyte-asn1-types
  desc: Go cryptobyte ASN.1 element/time readers
  conf: 0.9
  if:
    type: text
    regex: cryptobyte\.\(\*String\)\.ReadASN1(Element|GeneralizedTime|UTCTime)
- id: go-cryptobyte-methods
  desc: Go cryptobyte length-prefixed reader references
  conf: 0.85
  if:
    type: text
    regex: cryptobyte\.\(\*String\)\.ReadUint(8|16|24|32)LengthPrefixed
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  crit: notable
  size_max: 52428800
