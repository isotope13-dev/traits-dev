defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-second-delimiter-tail-offset
    desc: Computes tail offset after second delimiter
    crit: notable
    conf: 0.97
    if:
      type: hex
      offset_range: [0, null]
      # Branch on comparison result, increment match count, require the second
      # match, advance past the delimiter, subtract offset from original size.
      # Match arithmetic and call layout, never the delimiter's value or path.
      pattern: >-
        21 C0 0F 84 [4] FF 44 24 ?? 8B 5C 24 ?? 83 FB 02 0F 85 [4]
        FF 74 24 ?? FF 74 24 ?? 83 04 24 ?? 83 54 24 ?? 00
        8F 44 24 ?? 8F 44 24 ?? FF 74 24 ?? FF 74 24 ??
        8D 44 24 ?? 8B 10 29 14 24 8B 50 04 19 54 24 ??
