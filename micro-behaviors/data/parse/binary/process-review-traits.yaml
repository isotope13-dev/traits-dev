defaults:
  platforms: [linux]
  for: [elf, rust, shell]
  crit: notable
  conf: 0.8
traits:
  - id: readelf-invocation
    desc: Invokes readelf
    if:
      type: text
      # Command-position form, mirroring md5sum-invocation below. A bare
      # `word: readelf` also matched binaries that merely carry the tool NAME
      # in a table (IoT bot anti-analysis string tables list readelf, objdump,
      # strip...), which is not an invocation.
      regex: '(^|[\s;&|`$({])readelf[ \t]{1,8}["'']?[-./~\w$]'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/package/files/system-package::shell-completion-script
