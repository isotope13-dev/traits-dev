defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-path-triple-length-footer-reader
    desc: Reads path-and-length footer with EOF check
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Three MAX_PATH slots, four DWORDs and a three-byte trailing tag.
      # Seek to size-799, read 796 bytes, check final length == size-3.
      # Addresses, call displacements and stack slots are not pinned.
      pattern: >-
        8B 45 ?? 8B 4D ?? 68 ?? ?? ?? ?? 51 8B F8
        8D 98 E1 FC FF FF E8 ?? ?? ?? ?? 8B F0 83 C4 08 85 F6
        0F 84 ?? ?? ?? ?? 6A 00 53 56 E8 ?? ?? ?? ??
        56 68 1C 03 00 00 8D 95 ?? ?? ?? ?? 6A 01 52 E8 ?? ?? ?? ??
        8B 45 ?? 83 C7 FD 83 C4 1C 3B C7 74 ??
