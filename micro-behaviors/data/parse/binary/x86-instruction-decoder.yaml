# Neutral x86 instruction-length decoder capability. Comparing an opcode or
# ModR/M variable against prefix constants is ordinary decoder logic shared
# by crash reporters, disassemblers, emulators and packers; hook-evasion or
# kernel-module intent belongs in consuming composites that add that context.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
traits:
  - id: x86-opcode-prefix-rex
    desc: Opcode checked for REX prefix value
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\b(opcode|modrm)\b.{0,40}\b0x40\b'
  - id: x86-opcode-prefix-66
    desc: Opcode checked for 0x66 operand-size prefix
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\b(opcode|modrm)\b.{0,40}\b0x66\b'
  - id: x86-opcode-prefix-0f
    desc: Opcode checked for 0x0F two-byte escape
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\b(opcode|modrm)\b.{0,40}\b0x0F\b'
  - id: x86-modrm-shift
    desc: Decoding x86 ModR/M shift
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'modrm\s*>>\s*6'
  - id: x86-modrm-mask
    desc: Decoding x86 ModR/M mask
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'modrm\s*&\s*0x7'
