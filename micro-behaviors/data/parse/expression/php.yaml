defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.86

traits:
  - id: recursive-descent-expression-parser--pipe
    desc: Recursive parser method (parsePipe)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parsePipe\s*\('
  - id: recursive-descent-expression-parser--or
    desc: Recursive parser method (parseOr)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parseOr\s*\('
  - id: recursive-descent-expression-parser--and
    desc: Recursive parser method (parseAnd)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parseAnd\s*\('
  - id: recursive-descent-expression-parser--comparison
    desc: Recursive parser method (parseComparison)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parseComparison\s*\('
  - id: recursive-descent-expression-parser--add
    desc: Recursive parser method (parseAdd)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parseAdd\s*\('
  - id: recursive-descent-expression-parser--multiply
    desc: Recursive parser method (parseMul)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parseMul\s*\('
  - id: recursive-descent-expression-parser--unary
    desc: Recursive parser method (parseUnary)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parseUnary\s*\('
  - id: recursive-descent-expression-parser--primary
    desc: Recursive parser method (parsePrimary)
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'private function parsePrimary\s*\('

  - id: evaluator-allowlist-constructor
    desc: PHP evaluator allowlist parameter
    crit: component
    conf: 0.84
    if:
      type: text
      substr: 'private array $allowlist = []'

  - id: record-evaluator-allow-checks
    desc: PHP evaluator allowlist check helpers
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'function (isAllowed|assertAllowed)\s*\('

  - id: silverstripe-orm-record-evaluator
    desc: SilverStripe ORM record/list evaluator
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'SilverStripe\\ORM\\Data(List|Object)'

composite_rules:
  - id: recursive-descent-expression-parser
    desc: Recursive descent expression parser
    crit: notable
    conf: 0.84
    any:
      - id: recursive-descent-expression-parser--pipe
      - id: recursive-descent-expression-parser--or
      - id: recursive-descent-expression-parser--and
      - id: recursive-descent-expression-parser--comparison
      - id: recursive-descent-expression-parser--add
      - id: recursive-descent-expression-parser--multiply
      - id: recursive-descent-expression-parser--unary
      - id: recursive-descent-expression-parser--primary
  - id: allowlisted-record-expression-evaluator
    desc: Allowlisted record expression evaluator
    crit: notable
    conf: 0.9
    all:
      - id: evaluator-allowlist-constructor
      - id: record-evaluator-allow-checks
      - id: silverstripe-orm-record-evaluator
