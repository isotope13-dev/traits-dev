defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.88

traits:
  # An unqualified call can resolve to clojure.core/read-string or an imported
  # parser such as cljs.reader/read-string. The matcher establishes parsing,
  # not evaluation; execution traits must identify an eval/load sink directly.
  - id: clojure-read-string-call
    desc: Clojure parses an expression with read-string
    if:
      type: symbol
      kind: call
      exact: read-string
