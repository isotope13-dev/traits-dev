# Encoded instruction/expression fingerprints; substitution variants require
# the fixed carrier alphabet. These are not general cipher decoders.
defaults:
  for: [html, javascript, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: dollar-decimal-rawparse-call
    desc: Dollar-decimal encoded rawParse member call
    if:
      type: text
      substr: '46$114$97$119$80$97$114$115$101$40'
  - id: substitution-hex-rawparse-member
    desc: Substitution-encoded hex rawParse member
    if:
      type: text
      substr: '89\"\{38\\G5\`dI5\`\(yG\_G5\`dd5\`b\*G\_G5\`\(y5\`dIG\_G5\`d\>5\`\(bG\;'
