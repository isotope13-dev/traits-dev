---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: botnet-term-reference
  desc: Botnet terminology reference
  crit: component
  conf: 0.6
  for: [elf, pe, shell, python, javascript, typescript, c, go]
  if:
    type: text
    regex: '\bbot[_.\s-]?net\b'
    case_insensitive: true
- id: scanner-word
  desc: Scanner term reference
  crit: component
  for:
  - elf
  - pe
  - shell
  - python
  if:
    type: text
    word: scanner
    case_insensitive: true
- id: magic-packet-term
  desc: Magic-packet identifier reference
  crit: notable
  conf: 0.85
  for: [scripts, binaries]
  if:
    type: text
    substr: magic_packet
