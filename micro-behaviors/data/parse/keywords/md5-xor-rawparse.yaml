# Standard browser packer ciphertext of rawParse(, before the carrier split.
defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.99
traits:
  - id: md5-xor-rawparse-call-token
    desc: MD5-XOR encoded rawParse call token
    crit: notable
    if:
      type: text
      substr: "%14YO5W@@%5CJ"
