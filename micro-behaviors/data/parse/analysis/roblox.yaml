# Roblox Studio cookie representation
# These are format/parser observations. Store access is modeled separately so
# a legitimate developer tool that parses its own credential format is not
# classified as a cookie stealer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, pyc, shell, batch, powershell]
traits:
- id: roblox-studio-cookie-format
  desc: References Roblox Studio cookie format marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: COOK::<
- id: roblox-studio-cookie-delimiter-split
  desc: Splits a Roblox Studio cookie string
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "\\.split\\(['\"]COOK::<['\"]\\)"
composite_rules:
- id: roblox-studio-cookie-parser
  desc: Parses Roblox Studio cookie representation
  crit: notable
  conf: 0.9
  any:
  - id: roblox-studio-cookie-format
  - id: roblox-studio-cookie-delimiter-split
