defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # Dataset parsing is separate from code loading. Consumers requiring the
  # Hugging Face API also require its engine-emitted import fact.
  - id: datasets-load-dataset-call
    desc: Calls a Python load_dataset function
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: load_dataset

