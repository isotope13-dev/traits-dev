defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: datasets-trust-remote-code
    desc: Hugging Face datasets loader enables remote code
    crit: notable
    conf: 0.94
    all:
      - id: metadata/import/python/datasets/load_dataset
      - id: micro-behaviors/data/parse/dataset::datasets-load-dataset-call
      - id: micro-behaviors/data/parse/model::trust-remote-code-enabled
