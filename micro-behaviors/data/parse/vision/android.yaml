# Model-backed screen/object recognition.  The matcher intentionally accepts
# common implementation families (YOLO and ncnn) instead of one model name.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, cpp, apk, zip]
  crit: notable
  conf: 0.9

traits:
  - id: android-object-detector-api
    desc: Android object-detection model API
    if:
      type: text
      regex: '(?i)\b(YOLOv?[0-9]*[A-Za-z]*|ObjectDetector|ncnn)\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: android-object-detector-inference
    desc: Runs an object detector inference call
    if:
      type: text
      regex: '(?is)\b(YOLO\w*|ncnn|ObjectDetector)\b.{0,120}\b(detect|infer)\s*\('

composite_rules:
  - id: android-object-detection
    desc: Android model-backed object detection
    all:
      - id: android-object-detector-api
      - id: android-object-detector-inference
    near_lines: 12
