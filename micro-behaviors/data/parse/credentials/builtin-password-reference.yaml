# The Java analyzer's built-in credential/password heuristic examines complete
# constant-pool strings. Brotli's generated dictionary is stored in a few giant
# strings, so unrelated words such as "browser" and "password" appear together
# even though the class only initializes decompression lookup data.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: suspicious
  conf: 1.0

traits:
  - id: builtin-password-reference
    desc: Built-in JVM password reference hook
    crit: notable
    if:
      type: basename
      exact: __cleave_builtin_password_reference_hook__
    unless:
      - id: well-known/tool/development/mobile/expo::expo-ui-android-class
