defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.75

traits:
  - id: go-parse-document-function
    desc: Go defines a ParseDocument API
    if:
      type: symbol
      kind: function
      exact: ParseDocument

  - id: go-parse-document-call
    desc: Go calls a ParseDocument API
    if:
      type: symbol
      kind: call
      exact: ParseDocument
