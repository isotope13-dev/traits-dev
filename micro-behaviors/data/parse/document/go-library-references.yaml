# Library references support probable document parsing, not observed extraction or collection.
defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- id: go-lu4p-cat-import-reference
  desc: Go lu4p/cat import-name reference
  crit: notable
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: import
    regex: github\.com/lu4p/cat|lu4p/cat
- id: lu4p-cat-module-path-reference
  desc: lu4p/cat module-path reference
  crit: notable
  conf: 0.85
  for:
  - go
  - elf
  - macho
  - pe
  if:
    type: text
    substr: lu4p/cat
  unless:
  - id: metadata/build/bundler/vscode::vscode-packaged-native-tool
- id: go-pdfcpu-import-name-reference
  desc: Go pdfcpu import-name reference
  crit: notable
  conf: 0.7
  for:
  - go
  if:
    type: symbol
    kind: import
    regex: pdfcpu
- id: go-unipdf-import-name-reference
  desc: Go unipdf import-name reference
  crit: notable
  conf: 0.7
  for:
  - go
  if:
    type: symbol
    kind: import
    regex: unidoc/unipdf
- id: go-office-import-name-reference
  desc: Go Office-library import-name fragments
  crit: notable
  conf: 0.7
  for:
  - go
  if:
    type: symbol
    kind: import
    regex: baliance(\.com)?/gooxml|nguyenthenguyen/docx
composite_rules:
- id: lu4p-cat-library-references
  desc: lu4p/cat document-library references
  crit: notable
  conf: 0.85
  any:
  - id: go-lu4p-cat-import-reference
  - id: lu4p-cat-module-path-reference
- id: go-pdf-library-import-references
  desc: Go PDF-library import-name references
  crit: notable
  conf: 0.75
  any:
  - id: go-pdfcpu-import-name-reference
  - id: go-unipdf-import-name-reference
