# Building credential matchers: a program that compiles provider token-format
# strings into regular expressions is constructing a secret scanner, not
# holding live tokens. Redaction tools, CI secret detectors, and hand-rolled
# guardrail validators all compile these patterns; the sweep composites in
# objectives/credential-access/theft/token-format/ use this capability as a
# scanner-context exclusion, because a harvesting instrument carries the
# format table as data while a scanner carries it as matcher source.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  # The argument regex mirrors the provider pattern forms the token-format
  # sweep atoms recognize (prefix immediately followed by a character class,
  # or a provider's fixed token prefix), so a compile call over a copy of
  # those scan patterns matches here.
  - id: credential-format-regex-compile
    desc: Compiles a credential-format matching regex
    if:
      type: symbol
      kind: call
      regex: '^(re\.)?compile$'
      arg:
        kind: string
        regex: '(AKIA|ASIA)\[|github_pat_\[|gh\[[a-z]{4,6}\]_|gh[opusr]_\[|glpat-\[|npm_\[|pypi-\[|hf_\[|hvs\.\[|xox[baprs]-|sk_(live|test)_|SG\.[A-Za-z0-9]'

composite_rules:
  # The Rust half of the same claim. The builder call receives a loop
  # variable, not the format literal, so the flow the Python atom asserts
  # directly is not statically visible; the defensible form is co-presence —
  # the file both constructs regexes at runtime and carries four-plus
  # unrelated providers' token-format strings as source. That is the shape of
  # a self-built credential matcher (a save-time secret guard, a redaction
  # helper), while a harvesting binary embeds the table as opaque data and
  # matches it with native code, not a regex builder.
  - id: credential-format-regex-build
    desc: Builds regexes over a token-format literal table
    for: [rust]
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/parse/regex::rust-regex-builder-call
    needs: 4
    any:
      - id: micro-behaviors/data/format/credentials::github-token-format-pattern
      - id: micro-behaviors/data/format/credentials::gitlab-token-format-pattern
      - id: micro-behaviors/data/format/credentials::npm-token-format-pattern
      - id: micro-behaviors/data/format/credentials::huggingface-token-format-pattern
      - id: micro-behaviors/data/format/credentials::slack-token-format-pattern
      - id: micro-behaviors/data/format/credentials::aws-access-key-pattern-prefix
      - id: micro-behaviors/data/format/credentials::jwt-pattern-prefix
      - id: micro-behaviors/data/format/credentials::github-pat-format-scan-regex
      - id: micro-behaviors/data/format/credentials::slack-token-format-scan-regex
      - id: micro-behaviors/data/format/credentials::aws-access-key-length-pattern
