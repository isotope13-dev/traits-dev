defaults:
  for: [scripts]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: grep-aws-key-context
    desc: Grep captures AWS key match context
    if:
      type: text
      regex: '\bgrep\b[^\n|;]{0,80}-[ABC]\s*[1-9][0-9]*[^\n|;]{0,80}(AKIA|ASIA)\['
  - id: grep-matching-substrings
    desc: Grep extracts matching substrings only
    if:
      type: text
      regex: '\bgrep\b[^\n|;]{0,24}-[A-Za-z]*o[A-Za-z]*\b'
