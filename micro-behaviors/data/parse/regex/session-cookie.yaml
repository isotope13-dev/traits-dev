defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  crit: notable
  conf: 0.95

traits:
  - id: session-cookie-regex-extraction
    desc: Regex extracts serialized session cookies
    if:
      type: text
      regex: '(re\.(findall|search)|\.(scan|match))\s*\([^\n]{0,24}Cookie[^\n]{0,160}_session='
