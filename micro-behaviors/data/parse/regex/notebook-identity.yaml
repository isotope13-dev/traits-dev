defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # Scraping the first entry of an `errors` array for a value that is then used
  # as a visitor id. This is a parsing capability, not an intent: analytics SDKs
  # reach a stable per-user number this way when a platform exposes it only in
  # an error message (Kaggle's secret-store RPC is the documented example), and
  # the vetted-benign release of such a package carries it unchanged. It is a
  # clear, diff-worthy behavior on its own, so it stays notable; the hostile
  # reading comes from the composite that pairs it with secret-store token use
  # and a tracking upload
  # (objectives/credential-access/credential-manager/store-api::notebook-secret-error-identity-exfil),
  # not from the parse itself.
  - id: error-response-number-to-visitor-id
    desc: Extracts visitor identity from error response
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)errors["'']?\]\[0\].{0,400}visitorId'
