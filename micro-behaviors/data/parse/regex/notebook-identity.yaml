defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # Require a numeric regex after the error-array access, rather than any
  # unrelated visitorId token within 400 bytes. This is parsing evidence;
  # authorization, credential extraction and a network sink are not implied.
  - id: error-array-numeric-visitor-context
    desc: Numeric regex near error and visitor fields
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)errors["'']?\]\[0\].{0,120}\\d\{[0-9,]+\}.{0,160}visitorId'

composite_rules:
  # Authentication to a store beside error parsing does not establish theft.
  - id: secret-rpc-error-visitor-identity-context
    desc: Secret-store RPC and error-derived visitor identity coexist
    crit: notable
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/communications/rpc::secret-read-rpc-session-token-context
      - id: error-array-numeric-visitor-context
