defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1114

traits:
  - id: uid-regex-matching
    desc: "Regex matching of UID tokens"
    crit: notable
    conf: 0.82
    if:
      # Require an extraction call. A bare `for (const uid of …)` is how a mail
      # store walks message ids; that is not pulling UIDs out of a response.
      type: text
      regex: 'matchAll\([^)\n]{0,80}\buid\b|\.(match|exec)\([^)\n]{0,60}\buid\b'
