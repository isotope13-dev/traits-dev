defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # Bind the response error, regex input and match group to the identity field.
  # Merely requesting a named secret, handling an exception, or recording a
  # fingerprint elsewhere in a module is insufficient.
  - id: python-response-error-derived-visitor-id
    desc: HTTP response error parsed into visitor identity
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (identifier) @post)
            alias: (as_pattern_target (identifier) @response))))
          body: (block
            (expression_statement (assignment left: (identifier) @error
              right: (subscript
                value: (subscript
                  value: (call function: (attribute object: (identifier) @read_response
                    attribute: (identifier) @json))
                  subscript: (string (string_content) @errors))
                subscript: (integer) @zero)))
            (expression_statement (assignment left: (identifier) @match
              right: (call function: (attribute object: (identifier) @re
                attribute: (identifier) @search)
                arguments: (argument_list . (string) @pattern . (identifier) @input))))
            (if_statement condition: (identifier) @tested
              consequence: (block (expression_statement
                (assignment left: (subscript subscript: (string (string_content) @visitor))
                  right: (call function: (attribute object: (identifier) @group_match
                    attribute: (identifier) @group)
                    arguments: (argument_list . (integer) @one)))))))) @flow
          (#eq? @post "post") (#eq? @json "json")
          (#eq? @response @read_response) (#eq? @errors "errors") (#eq? @zero "0")
          (#eq? @re "re") (#eq? @search "search") (#match? @pattern "d[{][0-9,]+[}]")
          (#eq? @error @input) (#eq? @match @tested) (#eq? @match @group_match)
          (#eq? @group "group") (#eq? @one "1") (#eq? @visitor "visitorId"))

