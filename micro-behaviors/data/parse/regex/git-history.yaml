# Secret audits legitimately use both observations; neither proves theft.
# Requiring concrete token-format matchers avoids matching prose about secrets.
defaults:
  for: [scripts]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
composite_rules:
  - id: git-history-credential-pattern-scan
    desc: Git history with credential substring extraction
    all:
      - id: micro-behaviors/process/create/vcs/git::git-history-patches
      - id: micro-behaviors/data/parse/regex::grep-matching-substrings
      - id: micro-behaviors/data/format/credentials::aws-access-key-length-pattern
      - id: micro-behaviors/data/format/credentials::github-token-format-pattern
  - id: aws-key-context-harvest
    desc: Captures context of AWS key matches
    all:
      - id: micro-behaviors/data/parse/regex::grep-aws-key-context
      - id: micro-behaviors/data/format/credentials::aws-access-key-length-pattern
