# Runtime regex construction in Rust. The regex crate builds matchers either
# directly (Regex::new) or through the builder (RegexBuilder::new, for
# case-insensitive and size options); a call target records the chain
# (`regex::RegexBuilder::new.case_insensitive.build`). A compiled binary
# carries its matchers as data, so building them from source strings at
# runtime is evidence the file is matcher source — the half of the
# credential-matcher claim the compile-call atom carries for Python.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.9

traits:
  - id: rust-regex-builder-call
    desc: Builds a regex matcher via RegexBuilder
    if:
      type: symbol
      kind: call
      regex: '^(regex::)?(RegexBuilder::new|Regex::new)'
