defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.96
traits:
  - id: command-type-dispatch-diagnostic
    desc: Native unknown-command dispatch diagnostic
    if:
      type: hex
      section: any
      pattern: 55 6E 6B 6E 6F 77 6E 20 63 6F 6D 6D 61 6E 64 20 74 79 70 65 3A 20
  - id: persist-action-dispatch-diagnostic
    desc: Native persistence-action dispatch diagnostic
    if:
      type: hex
      section: any
      pattern: 55 6E 6B 6E 6F 77 6E 20 70 65 72 73 69 73 74 20 61 63 74 69 6F 6E 3A 20
  - id: self-destruct-command-diagnostic
    desc: Native self-destruct command failure diagnostic
    if:
      type: hex
      section: any
      pattern: 53 65 6C 66 2D 64 65 73 74 72 75 63 74 20 63 6F 6D 6D 61 6E 64 20 66 61 69 6C 65 64 2E
