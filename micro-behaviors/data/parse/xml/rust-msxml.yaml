defaults:
  platforms: [windows]
  for: [rust]
  crit: notable
  conf: 0.94
traits:
  - id: rust-msxml-transform-call
    desc: Rust source calls XML node transformation
    if:
      type: symbol
      kind: call
      regex: '\.transformNode$'
  - id: rust-msxml-load-xml-call
    desc: Rust source loads an XML string
    if:
      type: symbol
      kind: call
      regex: '\.loadXML$'
