defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: xinclude-namespace
    desc: Declares XInclude XML namespace
    if:
      type: text
      regex: 'xmlns:[A-Za-z_][\w.-]{0,24}\s*=\s*["'']http://www\.w3\.org/2001/XInclude'
  - id: xinclude-file-href
    desc: Includes a local file through XML
    if:
      type: text
      regex: '<[A-Za-z_][\w.-]{0,24}:include\b[^>]{0,160}\bhref\s*=\s*["'']file:/'
