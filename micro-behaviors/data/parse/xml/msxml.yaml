traits:
- for:
  - oledoc
  - ooxml
  id: domdocument-token-in-document
  desc: DOMDocument token in document bytes
  crit: component
  conf: 0.9
  if:
    type: raw
    regex: (?i)DOMDocument
  unless:
  - id: well-known/tool/offensive/metasploit::framework-context
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  id: msxml-domdocument-progid
  desc: References the MSXML DOM document COM class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: MSXML2.DOMDocument
    case_insensitive: true
defaults:
  platforms:
  - windows
