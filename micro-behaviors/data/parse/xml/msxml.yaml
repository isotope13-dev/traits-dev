traits:
- for:
  - oledoc
  - ooxml
  id: domdocument-token-in-document
  desc: DOMDocument token in document bytes
  crit: component
  conf: 0.9
  if:
    type: raw
    regex: (?i)DOMDocument
  unless:
  - id: well-known/tool/offensive/metasploit::framework-context
- for:
  - text
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  id: msxml-domdocument-progid
  desc: MSXML DOM document COM class reference
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)(MSXML2\.DOMDocument|Microsoft\.XMLDOM)'
    case_insensitive: true
# API-reference syntax only; receiver identity and execution are not inferred.
- id: vbscript-select-single-node-assignment
  desc: VBScript Set/selectSingleNode assignment text
  crit: notable
  conf: 0.84
  for:
  - vbs
  - asp
  if:
    type: text
    regex: (?im)^([^"'\r\n]|"(""|[^"\r\n])*")*?\bSet\s+\w+\s*=\s*\w+\.\s*selectSingleNode\s*\(
  not:
  - regex: (?im)^([^"'\r\n]|"(""|[^"\r\n])*")*?\bRem\b
defaults:
  platforms:
  - windows
