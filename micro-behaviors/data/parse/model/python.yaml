defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # Model, tokenizer and configuration data share this API. A loader call
  # alone establishes neither a new process nor execution of repository code.
  - id: from-pretrained-call
    desc: Calls a Python pretrained-resource loader
    crit: notable
    conf: 0.9
    if:
      # Cached call fact (no per-member cursor walk): matches `X.from_pretrained(`.
      type: symbol
      kind: call
      regex: '\.from_pretrained$'

