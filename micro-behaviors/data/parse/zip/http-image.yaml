defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-image-http-zip-container
    desc: Opens image-named HTTP response as ZIP
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: zipfile.ZipFile
      arg:
        index: 0
        from:
          call: '^(urllib\.request\.)?urlopen$'
          argument: 0
          literal: '\.(png|jpe?g|gif|webp)(\?|$)'
          through:
            - call: '\.read$'
              receiver: true
            - call: '^io\.BytesIO$'
              arguments: [0]
    unless:
      - type: symbol
        kind: function
        exact: urlopen
