defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: javascript-pe32plus-parser
    desc: Parses PE32+ image header fields
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule js_pe32plus_parser {
          strings:
            $dos = /readUInt16LE\(0\)[^;]{0,12}23117/
            $nt = /readUInt32LE\([a-zA-Z_$][a-zA-Z0-9_$]*\)[^;]{0,12}17744/
            $entry = /entryPoint[ \t]*:[^,;]{1,80}readUInt32LE\([^)]{1,40}\+16\)/
            $image = /imageBase[ \t]*:[^,;]{1,80}readBigUInt64LE\([^)]{1,40}\+24\)/
          condition: all of them
        }
