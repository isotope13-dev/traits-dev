defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: json-parse-data-identifier
  desc: Parses the data identifier as JSON
  crit: notable
  conf: 0.97
  size_max: 131072
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression
          object: (identifier) @json
          property: (property_identifier) @parse)
        arguments: (arguments (identifier) @parsed_data))
      (#eq? @json "JSON")
      (#eq? @parse "parse")
      (#eq? @parsed_data "data")
      )
