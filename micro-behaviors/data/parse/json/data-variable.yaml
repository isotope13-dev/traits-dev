defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: json-data-parse
    desc: Parses a data variable as JSON
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.parse\s*\(\s*data\s*\)'
    unless:
      - id: metadata/package/testing/harness/runtime/
