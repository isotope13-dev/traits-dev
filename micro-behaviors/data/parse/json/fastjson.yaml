defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [java, class]

traits:
  - id: java-json-parse-call-syntax
    desc: Java JSON or JSONObject parse-call syntax
    conf: 0.9
    for: [java]
    if:
      type: tree-sitter
      query: |
        ((method_invocation
          object: (identifier) @receiver
          name: (identifier) @method) @call
          (#match? @receiver "^(JSON|JSONObject)$")
          (#match? @method "^parse(Object|Array)?$"))

composite_rules:
  - id: java-fastjson-parse-call
    for: [java]
    desc: Fastjson import accompanies JSON parse call
    conf: 0.9
    all:
      - id: metadata/import/package::java-fastjson-jsonobject-import
      - id: java-json-parse-call-syntax
