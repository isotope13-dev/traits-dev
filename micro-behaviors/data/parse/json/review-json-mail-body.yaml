# JSON direction review; matcher and effective scope preserved.
---
defaults:
  for:
  - python
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.98
traits:
- id: parse-body-content-json-python
  desc: Parses body content field as JSON
  for:
  - python
  if:
    type: tree-sitter
    kind: call
    regex: json\.loads\(\s*\w+\[["']body["']\]\[["']content["']\]
- id: parse-body-content-json-js
  desc: Parses body content field as JSON
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    kind: call
    regex: JSON\.parse\(\s*[\w$]+(\.body|\[\s*["']body["']\s*\])(\.content|\[\s*["']content["']\s*\])
composite_rules:
- id: parse-body-content-json
  desc: Parses body content field as JSON
  any:
  - id: micro-behaviors/data/parse/json::parse-body-content-json-python
  - id: micro-behaviors/data/parse/json::parse-body-content-json-js
