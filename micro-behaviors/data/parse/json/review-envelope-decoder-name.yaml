# JSON direction review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  - pe
  - dll
  crit: baseline
  conf: 0.85
traits:
- id: json-decoder-name-call
  desc: Calls a JSON decode or parse helper
  if:
    type: symbol
    kind: call
    regex: "(?i)^(decode|parse|unpack|deserialize)[A-Za-z0-9_]*json[A-Za-z0-9_]*$"
