# Python JSON deserialization belongs with parsing, not serialization.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # Short marshal records can be absent from extracted text. Require both
  # complete records, near each other, rather than a loads substring in
  # Downloads or an unrelated pickle/marshal method. This is reference
  # co-occurrence, not proof that a particular receiver is called.
  - id: json-loads-pyc-name
    desc: Nearby json and loads bytecode records
    crit: notable
    conf: 0.82
    for: [pyc]
    if:
      type: hex
      pattern: '((7A|5A|FA|DA) 04 | (61|41|E1|C1|75|F5|74|F4) 04 00 00 00) 6A 73 6F 6E [0-512] ((7A|5A|FA|DA) 05 | (61|41|E1|C1|75|F5|74|F4) 05 00 00 00) 6C 6F 61 64 73'

  - id: json-loads-call
    desc: Parses JSON data with Python
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "json.loads"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: json-load-call
    desc: Python json.load call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "json.load"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: model-response-json-loads
    desc: Parses a model response variable as JSON
    crit: notable
    conf: 0.94
    if:
      type: text
      # Identifier and call syntax keep this on executable data flow rather
      # than prose that merely discusses parsing an LLM response.
      regex: 'json\.loads\s*\(\s*(model|llm)[_-]?(response|output)\s*\)'
  - id: comprehension-parse
    desc: List comprehension parses JSON lines
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'json\.loads\([^()\n]{0,40}\)\s*for\s+\w+\s+in\s+\w+'
