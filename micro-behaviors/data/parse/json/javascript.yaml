defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.6

traits:
  - id: json-data-property-parse
    desc: Parses a data property with JSON.parse
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'JSON\.parse\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.data\s*\)'

  - id: parsed-json-main-property
    desc: Parsed JSON .main property access
    if:
      type: text
      regex: JSON\.parse\(.{0,100}\)\.main\b

  - id: json-response-path-content-fields
    desc: Parsed JSON response path/content fields
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.parse[\s\S]{0,260}path[\s\S]{0,120}content\s*:'

  - id: jwt-access-token-source-regex
    desc: Source regex parses JWT access-token field
    conf: 0.96
    if:
      type: text
      substr: '"accessToken"\s*:\s*"(eyJ'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  - id: refresh-token-field-source-regex
    desc: Source regex parses refresh-token fields
    conf: 0.96
    if:
      type: text
      substr: '"(?:refreshToken|token|refresh_token)"\s*:\s*"'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  # `eval("(" + text + ")")` is the pre-JSON.parse deserializer, shipped as a
  # `parseJSON` fallback by every library old enough to predate ES5 (jQuery
  # <=1.4 and its plugin ecosystem).  The parenthesis-wrapping argument is what
  # separates it from eval used to run code: the wrapper forces the payload to
  # be parsed as an expression, which is only useful for reading a value back.
  # An obfuscator passes its decoded string straight through instead.
  - id: eval-parenthesized-json-deserializer
    desc: Legacy JSON deserialization via eval
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'eval["'']?\]?\(\s*[''"]\([''"]\s*\+'
