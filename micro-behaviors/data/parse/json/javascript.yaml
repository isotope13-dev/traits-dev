defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.6

traits:
  - id: jwt-access-token-source-regex
    desc: Source regex parses JWT access-token field
    conf: 0.96
    if:
      type: text
      substr: '"accessToken"\s*:\s*"(eyJ'
  - id: refresh-token-field-source-regex
    desc: Source regex parses refresh-token fields
    conf: 0.96
    if:
      type: text
      substr: '"(?:refreshToken|token|refresh_token)"\s*:\s*"'
