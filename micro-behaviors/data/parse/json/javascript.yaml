defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.6

traits:
  - id: jwt-access-token-source-regex
    desc: Source regex parses JWT access-token field
    conf: 0.96
    if:
      type: text
      substr: '"accessToken"\s*:\s*"(eyJ'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  - id: refresh-token-field-source-regex
    desc: Source regex parses refresh-token fields
    conf: 0.96
    if:
      type: text
      substr: '"(?:refreshToken|token|refresh_token)"\s*:\s*"'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  # `eval("(" + text + ")")` is the pre-JSON.parse deserializer, shipped as a
  # `parseJSON` fallback by every library old enough to predate ES5 (jQuery
  # <=1.4 and its plugin ecosystem).  The parenthesis-wrapping argument is what
  # separates it from eval used to run code: the wrapper forces the payload to
  # be parsed as an expression, which is only useful for reading a value back.
  # An obfuscator passes its decoded string straight through instead.
