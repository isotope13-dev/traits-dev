defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: json-parse-near-content-text-member
    desc: JSON parsing near nested content or text access
    crit: notable
    conf: 0.95
    near_bytes: 180
    all:
      - id: micro-behaviors/data/parse/json::json-parse-call
      - id: micro-behaviors/data/property/access::nested-content-text-member-access

