# JSON parsed from a decoded call result. The producer of the decoded text is
# any single-word call — `bytes(...)`, `base64.b64decode(...)`, a response
# reader — so this is a decode-then-parse shape, not evidence of a network
# fetch. (Moved out of module-exec: the matcher never required module scope,
# and its former "urllib response" description claimed a source the shape does
# not name; a NumPy ZIP manifest decoded in memory matched it.)
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-json-parse-decoded-call
    desc: Parses JSON from a decoded call result
    conf: 0.85
    if:
      type: text
      regex: json\.loads\(\s*\w+\([^)]{0,80}\)\.decode\(
