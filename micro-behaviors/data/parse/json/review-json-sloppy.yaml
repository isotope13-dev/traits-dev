# JSON direction review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
composite_rules:
- id: json-quote-replace
  desc: Normalizes Python repr quotes before JSON parsing
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/manipulation::python-single-to-double-quote-replacement
  - id: micro-behaviors/data/parse/json::json-loads-call
  near_bytes: 2048
