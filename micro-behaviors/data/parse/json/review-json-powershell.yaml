# JSON direction review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: convertfrom-json-as-hashtable
  desc: PowerShell parses JSON as a hashtable
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "(?i)\\bConvertFrom-Json\\b[^\\r\\n]{0,120}-AsHashtable\\b"
- id: powershell-base64-json-parse
  desc: PowerShell parses Base64-decoded text as JSON
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?i)FromBase64String\\s*\\([^\\n]{0,400}?\\)\\s*\\)\\s*\\|\\s*ConvertFrom-Json\\b"
