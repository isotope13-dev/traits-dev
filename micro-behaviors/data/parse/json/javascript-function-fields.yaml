# Co-occurrence within a small source range, not proof of taint or execution.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: js-parse-object-property-json
    desc: JSON parse of an object property
    crit: component
    if:
      type: text
      regex: 'JSON[.]parse\s*\(\s*[\w$]+[.][\w$]+\s*\)'
  - id: js-function-body-property-reference
    desc: Object function body property reference
    crit: component
    if:
      type: text
      regex: '\b[\w$]+[.]function[.]body\b'
  - id: js-function-arguments-property-constructor
    desc: Function constructor uses arguments property
    crit: component
    if:
      type: text
      regex: '\bnew\s+Function\s*\(\s*[\w$]+[.]function[.]arguments\b'
composite_rules:
  - id: js-json-function-body-construction-indicators
    desc: JSON property, function body and dynamic constructor co-occur
    crit: notable
    conf: 0.9
    near_lines: 12
    all:
      - id: js-parse-object-property-json
      - id: js-function-body-property-reference
      - id: js-function-arguments-property-constructor
