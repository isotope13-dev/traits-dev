defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, typescript, go, rust]
  conf: 0.97
traits:
  - id: parsed-seed-callback-dispatch
    desc: JSON parse near seed callback dispatch
    crit: notable
    if:
      type: text
      regex: 'JSON\.parse\([^;]{0,100};\s*if\s*\(\w+\.seed\)\s*\w+\(\w+\.seed'

