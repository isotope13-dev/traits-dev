traits:
  - id: json-parse-code-field-read
    desc: Reads token/payload/script/code off JSON.parse
    platforms: [windows, unix]
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      # Same statement only: a 180-byte multi-line window read any later `.code`
      # (error codes, key codes) as a field of the parsed object.
      regex: 'JSON\.parse\s*\([^)]{1,80}\)[^;\n]{0,40}\.\s*(token|payload|script|code)\b'
