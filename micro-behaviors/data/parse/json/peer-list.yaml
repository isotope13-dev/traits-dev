defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  crit: notable
  conf: 0.9

traits:
  - id: peer-relay-json-parser-cooccurrence
    desc: JSON parser near peer or relay text
    if:
      type: text
      regex: '(?is)json\.(loads|parse).{0,160}\b(peers|relays)\b'
