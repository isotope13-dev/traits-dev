defaults:
  crit: component
  platforms: [unix, windows]
  for: [python, go, rust, javascript, typescript]
traits:
  - id: python-response-json-command-text
    desc: Python JSON response near command text
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)json\.loads\s*\(\s*response\s*\)[\s\S]{0,90}["'']command["'']'

  - id: javascript-response-json-command-text
    desc: JavaScript JSON response near command text
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)JSON\.parse\s*\(\s*response\s*\)[\s\S]{0,90}["'']command["'']'

  - id: go-response-json-command-text
    desc: Go JSON response near command text
    conf: 0.94
    for: [go, rust]
    if:
      type: text
      regex: '(?i)json\.Unmarshal.{0,40}response[\s\S]{0,90}\bCommand\b'

composite_rules:
  - id: response-json-command-clues
    desc: JSON response and command text clues
    conf: 0.94
    any:
      - id: python-response-json-command-text
      - id: javascript-response-json-command-text
      - id: go-response-json-command-text

