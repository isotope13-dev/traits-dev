defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python

traits:
  - id: response-json-gating-not
    desc: Tests negated result of json method
    conf: 0.8
    if:
      type: text
      regex: if\s+not\s+[A-Za-z_][A-Za-z0-9_]*\.json\(\)
  - id: response-json-gating-positive
    desc: Tests result of json method call
    conf: 0.75
    if:
      type: text
      regex: if\s+[A-Za-z_][A-Za-z0-9_]*\.json\(\)
