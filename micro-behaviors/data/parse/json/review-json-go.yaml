# JSON direction review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - go
  - elf
  - macho
  - pe
  - wasm
  mbc: C0032
traits:
- id: go-json-unmarshal
  conf: 0.85
  desc: Go JSON unmarshal call
  crit: notable
  if:
    type: symbol
    exact: json.Unmarshal
- id: go-content-field-json-unmarshal
  desc: Go unmarshals returned content as JSON
  crit: notable
  conf: 0.94
  for:
  - go
  if:
    type: text
    regex: json\.Unmarshal\s*\(\s*\[\]byte\s*\([^)]{0,120}\.(Content|Text)\s*\)\s*,\s*&\w+\s*\)
- id: go-credential-json-unmarshal
  desc: Go unmarshals credential variable as JSON
  crit: notable
  conf: 0.94
  for:
  - go
  if:
    type: text
    regex: "(?i)\\bjson\\.Unmarshal\\s*\\([^;\\n]{0,40}(token|secret|cred|password)"
- id: go-body-json-method-call
  crit: notable
  conf: 0.9
  desc: Go decodes HTTP body as JSON
  if:
    type: symbol
    kind: call
    regex: "\\.Body\\.JSON$"
