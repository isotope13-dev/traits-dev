defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
  crit: notable
  conf: 0.9

traits:
  - id: js-parseint-radix-two
    desc: JavaScript parses a value as radix-two digits
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: parseInt
      arg:
        index: 1
        kind: number
        value: 2

