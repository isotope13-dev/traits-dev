defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: revshell-term
    desc: References reverse-shell terminology (revshell)
    crit: notable
    conf: 0.7
    if:
      type: text
      word: revshell
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/tool/detection/ai-guardrail::block-code-execution-guardrail
      - id: well-known/tool/offensive/bingo::bingo-pentest-module-context
composite_rules:
  - id: reverse-shell-terminology
    desc: References reverse-shell terminology
    crit: notable
    conf: 0.7
    any:
      - id: metadata/lang/natural::reverse-shell-term
      - id: revshell-term
    unless:
      - id: well-known/tool/detection/ai-guardrail::block-code-execution-guardrail
