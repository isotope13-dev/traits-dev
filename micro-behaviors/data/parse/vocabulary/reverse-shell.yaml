defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: reverse-shell-term
    desc: Text names a reverse shell
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: \breverse[_.\s-]?shell\b
      case_insensitive: true
    unless:
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
      # Directory refs keep suppression budget low while covering defensive tooling
      - id: well-known/tool/detection/
      - id: well-known/app/infrastructure/k9x-satan::attack-fixture-context
      - id: well-known/lib/cloud/tencentcloud-dotnet/
      # Scanner finding descriptions / security playbooks citing the term
      - type: text
        regex: '(?i)(potential reverse shell|FLAG:.*reverse.?shell)'
      # Defensive firewall and sandbox policy text describes what it blocks;
      # it does not provide a reverse-shell capability.
      - type: text
        regex: '(?i)\b(block|deny|drop)\s+reverse[_.\s-]?shell\b'
      - type: text
        regex: '(?i)\b(prevent|disallow)\s+reverse[_.\s-]?shell\b'
      - type: text
        regex: '(?i)\bnot\s+(?:a\s+)?reverse[_.\s-]?shell\b'
      # HTTP/query parameter labels name a staged command, not a shell primitive.
      - type: text
        regex: '(?i)\bcmd=reverse[_.\s-]?shell\b'
  - id: revshell-term
    desc: References reverse-shell terminology (revshell)
    crit: notable
    conf: 0.7
    if:
      type: text
      word: revshell
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/tool/detection/ai-guardrail::block-code-execution-guardrail
      - id: well-known/tool/offensive/bingo::bingo-pentest-module-context
composite_rules:
  - id: reverse-shell-terminology
    desc: References reverse-shell terminology
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/data/parse/vocabulary::reverse-shell-term
      - id: revshell-term
    unless:
      - id: well-known/tool/detection/ai-guardrail::block-code-execution-guardrail
