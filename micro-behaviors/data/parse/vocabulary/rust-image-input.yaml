defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-image-input-name
    desc: Rust image-data or image-to-text name
    crit: component
    conf: 0.95
    # These names alone establish no CAPTCHA workflow. Generic optional body
    # fields establish no image input at all, so they are not an alternative.
    if:
      type: text
      regex: '(?i)\bImageToText\b|\bimage_data\b'
    unless:
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
