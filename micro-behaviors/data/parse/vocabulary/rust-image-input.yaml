defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-image-input-name
    desc: Rust image-data or image-to-text name
    crit: component
    conf: 0.95
    # These names alone establish no CAPTCHA workflow. Generic optional body
    # fields establish no image input at all, so they are not an alternative.
    if:
      type: text
      regex: '(?i)\bImageToText\b|\bimage_data\b'
    unless:
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  - id: rust-captcha-sitekey-input
    desc: Rust CAPTCHA job accepts a site key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(sitekey|googlekey|website_key|websiteKey)\b'
  - id: rust-page-url-field-name
    desc: Generic page or site URL field
    crit: component
    conf: 0.94
    # `page_url`/`website_url` are ordinary web-client field names (MCP
    # server info, scrapers) and establish no CAPTCHA workflow alone; the
    # composite below adds the site-key context that makes it a solver job.
    if:
      type: text
      regex: '(?i)\b(pageurl|page_url|website_url|websiteURL)\b'

composite_rules:
  - id: rust-captcha-input-schema
    desc: Rust CAPTCHA job has site/page inputs
    crit: notable
    conf: 0.95
    all:
      - id: rust-captcha-sitekey-input
      - id: rust-page-url-field-name
