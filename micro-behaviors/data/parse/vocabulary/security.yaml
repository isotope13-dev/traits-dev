defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
  conf: 0.45
traits:
  # A neutral vocabulary marker used as supporting evidence by narrowly
  # defined objectives; package managers, credential stores, and auth clients
  # all legitimately document this phrase.
  - id: stored-credentials-vocabulary
    desc: Stored credentials phrase
    crit: notable
    conf: 0.96
    for: [pkginfo]
    if:
      type: text
      regex: '(?i)\bstored credentials\b'
  # Relocated from objectives/collection/stealer/browser/ (2026-07). Four
  # occurrences of `auth`/`login`/`session`/`token` is what every OAuth client,
  # login form, session middleware and API SDK looks like -- a codespace
  # pairing CLI ("auto-pair token", "sessionId", "pluginAuthToken") clears the
  # threshold trivially. Filed under the browser stealer it made all of them
  # credential-harvesting evidence. The interception composite that uses it
  # keeps its discriminators: the AUTH_URL_PATTERN identifier plus the
  # fetch/XHR response hooks.
  - id: auth-route-auth-word
    desc: auth route vocabulary word
    for: [javascript, typescript]
    if:
      type: text
      word: auth
  - id: auth-route-login-word
    desc: login route vocabulary word
    for: [javascript, typescript]
    if:
      type: text
      word: login
  - id: auth-route-session-word
    desc: session route vocabulary word
    for: [javascript, typescript]
    if:
      type: text
      word: session
  - id: auth-route-token-word
    desc: token route vocabulary word
    for: [javascript, typescript]
    if:
      type: text
      word: token
  # Relocated from objectives/lateral-movement/social-engineering/lures/
  # (2026-07). The matcher finds a `password`/`passwd` key with an inline
  # value -- which is what a Google/Sphinx docstring Args entry
  # (`password: Authentication password.`), a YAML/INI config line and every
  # DB-driver API reference look like. Filed under lures it gave all of them
  # malware-lure provenance. Matcher and its 17 `not:` filters are unchanged;
  # the lure inference stays in that tier's password-protected-archive-lure,
  # which still requires an archive-open leg within 12 lines.
  - id: password-key-value-pair
    desc: password/passwd key with inline value
    conf: 0.8
    for: [scripts, binaries]
    if:
      type: text
      # Keep the value on the same line and exclude normal status prose. This
      # still accepts quoted and unquoted password tokens, while rejecting UI
      # text such as "password is passed".
      #
      # The leading -/-- is captured deliberately, even though a lure never has
      # one: `not:` only ever sees the matched span, so without the dashes in
      # `if:` there is no way to tell a lure's "Password: infected" from a CLI
      # option specification (`--passwd=file`, `--password=SECRET`) printed in
      # any tool's usage text or manual page. Captured here, filtered below.
      regex: \-{0,2}\b(passwd|password)\b[ \t]{0,12}(is|:|=)[ \t]*['"]?[A-Za-z0-9._-]{3,}['"]?
      case_insensitive: true
    not:
      # Usage/manpage option spelling, not a password handed to a victim.
      - regex: ^-
      - regex: (?i)\bpassword[ \t]+is[ \t]+(passed|sent|provided|used)\b
      - regex: (?i)\b(passwd|password)\b.{0,12}(is|:|=)\s*['"]?%[a-z]
      - regex: (?i)\buser(name)?\s+password\s+isadmin\b
      - regex: (?i)password\s+in\s+\.netrc\s+is\b
      - regex: (?i)password\s+is\s+(bad|too|invalid|incorrect|required|empty|corrupt)\b
      - regex: (?i)password\s+is\s+missing\b
      - regex: --password\s+request
      - regex: password\s+file
      - regex: password\s+given
      - regex: password\s+manager
      - regex: (?i)stored\s+password\s+is\s+corrupt
      - regex: (?i)master\s+password
      - regex: (?i)password\s+is\s+pswd\b
      - regex: (?i)password.{0,12}is\s+(unchanged|already)
      - regex: (?i)password\s*=\s*None\b
      - regex: (?i)password\s*:\s*Forgotten\b
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/binary/vendor/
  - id: secret
    desc: Secret vocabulary word
    if:
      type: text
      word: secret
      case_insensitive: true
  - id: token-word
    desc: Contains the standalone word token
    if:
      type: text
      word: token
      case_insensitive: true
  # Parsing a serialized OAuth token field is a neutral data operation.  The
  # GitHub CLI credential-harvest objective combines this atom with the
  # specific hosts.yml path; the parse itself is also used by honest clients
  # that read their own provider credentials.
  - id: oauth-token-yaml-field-regex
    desc: Extracts an OAuth token YAML field
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'match\s*\(\s*/oauth_token:'
    unless:
      - id: well-known/tool/detection/threat-intel/
      - id: well-known/app/storage/akm/
  - id: credential-field
    desc: Credential field keyword
    conf: 0.84
    if:
      type: text
      regex: '(?i)\b(credential|api[-_]?key)\b'
  # These are neutral source-level observations.  Credential spraying intent
  # is inferred only by the IoT brute-force composite that combines them with
  # a credential map, iteration, and an authentication call.
  - id: go-credential-list-initializer
    desc: Go credential slice initializer
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      substr: 'credentials = ['
    count_min: 1
  - id: go-login-field-initializer
    desc: Repeated Go login field assignments
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      substr: 'login = "'
    count_min: 3
  - id: go-password-field-initializer
    desc: Repeated Go password field assignments
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      substr: 'password = "'
    count_min: 3
  - id: go-setauth-credential-call
    desc: Go SetAuth call with credentials
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: 'SetAuth\(\s*\w+\.Login\s*,\s*\w+\.Password'
  - id: secret-key-data-name
    desc: Secret key/data field name
    crit: baseline
    conf: 0.6
    for: [scripts, binaries]
    if:
      type: text
      regex: \bsecret_?(key|data|payload|cmd)\w*\b
      case_insensitive: true
    not:
      - regex: (?i)SecretKey(Selector|Ref|Volume|Source|Spec)
      - regex: (?i)SecretData(Source|Provider|Wrapper)
    downgrade:
      any:
        - id: metadata/signed/platform::apple
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
composite_rules:
  # `needs: 4` is the whole point of this rule and was missing: an `any:` with
  # no `needs:` defaults to 1, so "Four or more ... words" fired on a SINGLE
  # one. A tab-session-manager extension whose popup.js says `session.urls`,
  # `saveSession`, `restoreSession` cleared it on the word "session" alone —
  # browser-tab sessions, not auth sessions. The two stealer composites that
  # consume this want the co-occurrence, which is what the desc always claimed.
  - id: auth-route-vocabulary
    desc: Four or more auth/login/session/token words
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    any:
      - id: auth-route-auth-word
      - id: auth-route-login-word
      - id: auth-route-session-word
      - id: auth-route-token-word
    needs: 4
