defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: component
  conf: 0.8
traits:
  - id: ciphertext-key-vocabulary
    desc: Uses ciphertext, shared-secret, or trailer terms
    if:
      type: text
      regex: '(?i)\b(ciphertext|shared[_-]?secret|encrypted[_-]?trailer)\b'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  # This phrase is ordinary exchange-transparency terminology. Keep it as
  # neutral supporting evidence; scam intent requires wallet/yield context.
  - id: proof-of-reserve-collateral
    desc: Proof-of-reserve or collateral phrase
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: (?i)\bproof of reserve\b|\bproof of collateral\b
