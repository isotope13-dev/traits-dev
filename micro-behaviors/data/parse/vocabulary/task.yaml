# Generic task-vocabulary tokens. A bare `task_id` field appears in build
# systems, schedulers, SQL task tables, and ordinary API payloads, so it
# carries no family identity on its own: it relocated here from
# well-known/malware/rat/mythic-agents (where it was mythic-task-id-field)
# after firing on an unrelated benign runtime. The Mythic tasking-fields
# composite references it cross-directory, where sibling legs supply the
# family context.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
  size_min: 512
  size_max: 524288000

traits:
  - id: task-id-field
    desc: Task identifier field label
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: task_id
    unless:
      - id: well-known/app/system/drivers/
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
