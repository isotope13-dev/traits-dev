---
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - go
  - lua
  - shell
  - javascript
  - typescript
  - powershell
  - rust
  id: destructive-data-target-a
  desc: Names mass file/data encryption or destruction
  crit: notable
  conf: 0.92
  unless:
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
  - id: metadata/file/format/source-map::sourcemap
  - id: well-known/lib/web/server/django::django-database-flush-warning
  if:
    type: text
    regex: "(?i)\\b(encrypt|destroy)\\w*\\s+all\\s+(files|data)\\b"
- platforms:
  - unix
  - windows
  conf: 0.9
  for:
  - javascript
  - typescript
  id: tool-result-message-label
  desc: References tool_result message label
  if:
    type: text
    substr: "'tool_result'"
- platforms:
  - unix
  - windows
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  - go
  id: private-key-field-name
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Private-key field name
  if:
    type: text
    regex: '["'']?private_key["'']?\s*:'
- platforms:
  - unix
  - windows
  conf: 0.6
  for:
  - python
  - ruby
  - perl
  - go
  id: connection-check-command-wording
  desc: Connection check command wording
  if:
    type: string_literal
    regex: "(?i)check.{0,15}(session|agent|client).{0,15}connection"
- platforms:
  - unix
  - windows
  for:
  - python
  - go
  - lua
  - shell
  - javascript
  - typescript
  - powershell
  - rust
  id: destructive-model-wording
  desc: Destructive instruction wording about models
  conf: 0.92
  if:
    type: text
    # An unqualified `verb <word> model(s)` matched every ORM docstring
    # ("Deletes a model row"). The destructive instructions these rules feed
    # state the target as a whole, so require the all/every/each/your
    # quantifier, matching the sibling destructive-data-target legs.
    regex: "(?i)\\b(delet|encrypt|lock|destroy)\\w*\\s+(all|every|each|your)\\s+models?\\b"
  unless:
  - type: text
    regex: "(?is)confirm_message.{0,80}(are you sure|want to).{0,60}(delete|remove).{0,20}models?"
- platforms:
  - unix
  - windows
  for:
  - python
  - go
  - scripts
  - json
  id: pentest-task-queue-name
  desc: Penetration-testing job label
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: "(?i)^[a-z0-9_.-]{0,24}(penetration[_-]?tests?|pentests?)[a-z0-9_.-]{0,24}$"
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  - html
  - markdown
  - package.json
  size_max: 1048576
  id: quit-or-timer-event-trigger-name
  desc: Quit or recurring timer event-trigger name
  conf: 0.9
  if:
    type: text
    regex: "(?i)(^|[^\\w-])(on-quit|every\\s*n\\s*seconds)"
