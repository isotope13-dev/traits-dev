---
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  conf: 0.9
  for:
  - javascript
  - typescript
  id: tool-result-message-label
  desc: References tool_result message label
  if:
    type: text
    substr: "'tool_result'"
- platforms:
  - unix
  - windows
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  - go
  id: private-key-field-name
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/lib/network/opentelemetry-opamp::opentelemetry-opamp-client-library
  desc: Quoted private_key document field
  if:
    type: text
    regex: '["'']private_key["'']'
- platforms:
  - unix
  - windows
  conf: 0.6
  for:
  - python
  - ruby
  - perl
  - go
  id: connection-check-command-wording
  desc: Connection check command wording
  if:
    type: string_literal
    regex: "(?i)check.{0,15}(session|agent|client).{0,15}connection"
- platforms:
  - unix
  - windows
  for:
  - python
  id: flooding-word-reference
  desc: Flooding word reference
  conf: 0.9
  unless:
  - type: text
    substr: prevent flooding
  - type: basename
    exact: pft_synflood.py
  if:
    type: string_literal
    substr: flooding
- platforms:
  - unix
  - windows
  for:
  - python
  - go
  - lua
  - shell
  - javascript
  - typescript
  - powershell
  - rust
  id: model-delete-encrypt-lock-wording
  desc: Model delete encrypt lock wording
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(delet|encrypt|lock|destroy)(e|es|ed|s|ing)?\\s+\\w+\\s+models?\\b"
  unless:
  - type: text
    regex: "(?is)confirm_message.{0,80}(are you sure|want to).{0,60}(delete|remove).{0,20}models?"
- platforms:
  - unix
  - windows
  for:
  - python
  - go
  - scripts
  - json
  id: pentest-task-queue-name
  desc: Penetration-testing job label
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: "(?i)^[a-z0-9_.-]{0,24}(penetration[_-]?tests?|pentests?)[a-z0-9_.-]{0,24}$"
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  - html
  - markdown
  - package.json
  size_max: 1048576
  id: quit-or-timer-event-trigger-name
  desc: Quit or recurring timer event-trigger name
  conf: 0.9
  if:
    type: text
    regex: "(?i)(^|[^\\w-])(on-quit|every\\s*n\\s*seconds)"
