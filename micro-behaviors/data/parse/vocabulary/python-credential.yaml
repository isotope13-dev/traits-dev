defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-secret-key-token-literal
    desc: Secret, token or key vocabulary literal
    crit: component
    conf: 0.92
    if:
      type: string_literal
      kind: string
      # The consuming composite supplies the os.environ.items() context.
      # Keep this atom limited to actual string literals, not identifiers
      # such as _safe_keys or prose mentioning a credential term.
      # A literal ending in KEY_/SECRET_/TOKEN_ is a namespace prefix for a
      # startswith() selection (e.g. an app's own FERAL_KEY_ variables), not
      # a credential name: real credential variables never end in "_".
      regex: '(^|[_-])(TOKEN|SECRET|KEY)([_-]|$)'
      case_insensitive: true
    not:
      - regex: '(?i)(TOKEN|SECRET|KEY)_["'']?$'
  - id: python-password-credential-literal
    desc: Password or credential vocabulary literal
    crit: component
    conf: 0.92
    if:
      type: string_literal
      kind: string
      # As above: a trailing-underscore literal (APP_PASSWORD_) selects an
      # application namespace; it does not name a credential.
      regex: '^[A-Za-z0-9_]*(PASSWORD|CREDENTIAL)[A-Za-z0-9_]*$'
      case_insensitive: true
    not:
      - regex: '(?i)(PASSWORD|CREDENTIAL)_["'']?$'
