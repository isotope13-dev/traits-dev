defaults:
  platforms: [unix, windows]

traits:
  - id: unattended-mode-literal
    desc: Literal naming an unattended mode
    crit: component
    conf: 0.9
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    # A value alone identifies neither an agent nor process execution.
    # Leading switch prefixes are excluded: these are mode names, not argv.
    if:
      type: literal
      regex: '(?i)^[\"'']?(unattended|headless|non[-_ ]?interactive|auto[-_ ]?approve)[\"'']?$'
    unless:
      - id: metadata/file/format/structured::generated-news-summary-index
      - id: metadata/file/format/structured::serialized-news-article-catalog
