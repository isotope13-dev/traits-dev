defaults:
  platforms: [unix, windows]
traits:
  - id: cloud-credential-type-name
    # Any cloud client's help text names these ("AWS Access Key ID"); a
    # secret scanner's rule table is only one place they appear.
    desc: Names a cloud or VCS credential type
    crit: notable
    conf: 0.95
    for: [scripts, source, documents]
    if:
      type: text
      regex: Personal Access Token|Service Account Key|Access Key ID
