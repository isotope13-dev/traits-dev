traits:
- id: backdoor-operational-shell
  desc: Backdoor-related vocabulary in source
  conf: 0.8
  if:
    type: text
    regex: (?i)\bbackdoor[_ -]?shell\b
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: backdoor-operational-service
  desc: Backdoor-related vocabulary in source
  conf: 0.8
  if:
    type: text
    regex: (?i)\bbackdoor[_ -]?(server|client|agent|c2)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
- id: backdoor-operational-payload
  desc: Backdoor-related vocabulary in source
  conf: 0.8
  if:
    type: text
    regex: (?i)\bbackdoor[_ -]?(payload|process|task|login)\b
- id: backdoor-operational-account
  desc: Backdoor-related vocabulary in source
  conf: 0.8
  if:
    type: text
    regex: (?i)\bbackdoor[_ -]?(user|passwd|root|command)\b
- id: backdoor-comment
  desc: Backdoor-related vocabulary in source
  conf: 0.9
  if:
    type: text
    substr: '# backdoor:'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: backdoor-upgrade-check
  desc: Backdoor-related vocabulary in source
  conf: 0.9
  if:
    type: text
    regex: \bbackdoor upgrade check\b
    case_insensitive: true
- id: hide-backdoor
  desc: Backdoor-related vocabulary in source
  conf: 0.5
  if:
    type: text
    regex: \bhide[_ ]backdoor\b
    case_insensitive: true
- id: icmp-backdoor
  desc: Backdoor-related vocabulary in source
  conf: 0.6
  if:
    type: text
    regex: \bicmp[_ ]backdoor\b
    case_insensitive: true
- id: pam-backdoor
  desc: Backdoor-related vocabulary in source
  conf: 0.6
  if:
    type: text
    regex: \bpam[_ ]backdoor\b
    case_insensitive: true
  unless:
  - id: metadata/file/naming::generated-attack-map-context
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: sshd-backdoor
  desc: Backdoor-related vocabulary in source
  conf: 0.6
  if:
    type: text
    regex: \bsshd[_ ]backdoor\b
    case_insensitive: true
- id: backdoor-task
  desc: Backdoor-related vocabulary in source
  conf: 0.5
  if:
    type: text
    regex: \bbackdoor[_ ]task\b
    case_insensitive: true
- id: backdoor-process
  desc: Backdoor-related vocabulary in source
  conf: 0.5
  if:
    type: text
    regex: \bbackdoor[_ ]process\b
    case_insensitive: true
composite_rules:
- id: backdoor-comp
  desc: Backdoor-related vocabulary in source
  conf: 0.8
  any:
  - id: micro-behaviors/data/parse/vocabulary::backdoor-operational-shell
  - id: micro-behaviors/data/parse/vocabulary::backdoor-operational-service
  - id: micro-behaviors/data/parse/vocabulary::backdoor-operational-payload
  - id: micro-behaviors/data/parse/vocabulary::backdoor-operational-account
  unless:
  - type: trait
    id: metadata/package/compat::virtualbox-platform-component
  - type: trait
    id: metadata/signed/unknown::vmware
  - type: trait
    id: micro-behaviors/data/parse/vocabulary::backdoor-comment
  - type: trait
    id: micro-behaviors/data/parse/vocabulary::backdoor-upgrade-check
  - type: trait
    id: well-known/tool/detection/
  - type: trait
    id: well-known/app/infrastructure/aws-vault/
  - type: trait
    id: well-known/tool/sysadmin/unix-benign::flipper-firmware-elf
  - type: trait
    id: metadata/signed/platform::microsoft
defaults:
  for:
  - pe
  - elf
  - shell
  - python
  - javascript
  platforms:
  - windows
  - unix
  crit: notable
