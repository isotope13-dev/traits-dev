defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable

traits:
- id: credentials-path-tail
  desc: Path ending in credentials
  crit: notable
  conf: 0.4
  if:
    type: text
    regex: '(^|[/\\])credentials([''"\s,)]|$)'
  unless:
  - type: text
    regex: '\.aws[/\\]credentials'
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

