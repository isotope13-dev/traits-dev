traits:
- id: ssh-attack-suffix
  desc: SSH attack-named identifier vocabulary
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '[Ss][Ss][Hh][_\-]?[Aa]ttack'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ssh-boom
  desc: SSH attack-named identifier vocabulary
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: ssh[_\-]?boom
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
- id: attack-ref
  desc: SSH attack-named identifier vocabulary
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/parse/vocabulary::ssh-attack-suffix
  - id: micro-behaviors/data/parse/vocabulary::attack-ssh-name
  - id: micro-behaviors/data/parse/vocabulary::ssh-boom
defaults:
  for:
  - shell
  - python
  - javascript
  - elf
  - macho
  - pe
  platforms:
  - linux
  - macos
  - windows
