traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: slash-tail-token
  desc: Slash-tail command token
  conf: 0.82
  if:
    type: text
    regex: (^|["'\s])/tail(["'\s]|$)
- platforms:
  - macos
  - windows
  - linux
  for:
  - javascript
  - typescript
  - html
  - markdown
  - package.json
  size_max: 1048576
  id: save-or-startup-event-name
  desc: Save or startup event-trigger name
  conf: 0.9
  if:
    type: text
    regex: (?i)(^|[^\w-])(on-save-file|on-startup)
defaults:
  crit: notable
