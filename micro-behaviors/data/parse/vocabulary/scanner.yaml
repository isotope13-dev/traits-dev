traits:
- id: cve-reference
  desc: CVE-YYYY-NNNN vulnerability identifier
  conf: 0.6
  if:
    type: string_literal
    regex: CVE-[0-9]{4}-[0-9]{4,}
- id: pawn-keyword
  desc: pawn exploit-target slang term
  conf: 0.5
  if:
    type: string_literal
    regex: (?i)\bpawn\b
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
