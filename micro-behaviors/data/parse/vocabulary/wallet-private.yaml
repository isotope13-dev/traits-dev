defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: private-literal-word
  desc: '"private" word inside a string literal'
  crit: component
  conf: 0.5
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    word: private
    case_insensitive: true
- id: wallet-word
  desc: Wallet keyword
  crit: component
  conf: 0.4
  if:
    type: text
    word: wallet
  unless:
  - id: well-known/lib/cloud/supabase::auth-js-web3-module
