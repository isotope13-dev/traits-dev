defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: hash-cracking-vocabulary
    desc: Names hash cracking or wordlist attack
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/lib/web/server/django::django-web-framework-package
    if:
      type: text
      regex: '(?i)\b((hash|password) cracking|wordlist attack|rainbow table|hashcat|john the ripper)\b'

