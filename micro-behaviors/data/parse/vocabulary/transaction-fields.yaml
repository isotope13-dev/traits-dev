defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  crit: notable
traits:
- id: account-keys-field-name
  desc: accountKeys field-name text
  conf: 0.8
  if:
    type: text
    substr: accountKeys
- id: inner-instructions-field-name
  desc: innerInstructions field-name text
  conf: 0.8
  if:
    type: text
    substr: innerInstructions
- id: program-id-field-name
  desc: programId field-name text
  conf: 0.8
  if:
    type: text
    substr: programId
- id: log-messages-field-name
  desc: logMessages member or field-name syntax
  conf: 0.8
  if:
    type: text
    regex: '\bmeta\.logMessages\b|["'']logMessages["'']\s*:'
- id: memo-program-id-name-proximity
  desc: Memo and programId names within 80 characters
  conf: 0.9
  if:
    type: text
    regex: (?i)(programId|program_id).{0,80}Memo|Memo.{0,80}(programId|program_id)
composite_rules:
- id: solana-transaction-field-cluster
  desc: Solana transaction schema field-name cluster
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/data/parse/vocabulary::account-keys-field-name
  - id: micro-behaviors/data/parse/vocabulary::inner-instructions-field-name
  - id: micro-behaviors/data/parse/vocabulary::program-id-field-name
  - id: micro-behaviors/data/parse/vocabulary::log-messages-field-name
