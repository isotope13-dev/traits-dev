defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-seed-key-field-default
    desc: Reads seed or private-key field with default
    crit: notable
    conf: 0.8
    if:
      type: text
      exclude_comments: true
      regex: '\.(seeds|private_?keys|mnemonics?)\s*(\|\||\?\?)\s*(\[|\w)'
