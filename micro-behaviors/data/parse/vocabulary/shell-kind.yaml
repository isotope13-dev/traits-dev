defaults:
  platforms: [windows, unix]
  for: [html, php]
traits:
- id: shell-kind-term
  desc: Text names a web or reverse shell
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(web shell|reverse shell)"

# Vocabulary alone does not establish a backdoor capability.
- id: backdoor-term
  desc: Text names a backdoor or cmd shell
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(backdoor|cmd shell)"
