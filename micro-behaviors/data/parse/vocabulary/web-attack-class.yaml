# Injection-class vocabulary and malicious-traffic phrasing. Server-side
# attack-class names live under metadata/lang/source/naming/target.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: sqli-acronym
    desc: Names the SQLi attack class
    if:
      type: text
      word: SQLi

  - id: nosqli-acronym
    desc: Names the NoSQLi attack class
    if:
      type: text
      word: NoSQLi

  - id: xss-acronym
    desc: Names the XSS attack class
    if:
      type: literal
      word: XSS

  - id: malicious-traffic-or-payload-phrase
    desc: Mentions malicious traffic, category or payload
    if:
      type: text
      regex: '(?i)malicious[^\n]{0,80}(traffic|categor|payload)'

composite_rules:
  - id: injection-attack-class-acronyms
    desc: Names two or more injection attack classes
    needs: 2
    any:
      - id: sqli-acronym
      - id: nosqli-acronym
      - id: xss-acronym
