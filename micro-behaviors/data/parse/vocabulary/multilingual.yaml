# Non-English "spyware" / espionage terms — surveillance-category labels found
# in executable, script, and source content. Standalone documents are omitted
# because legal/privacy disclosures commonly mention spyware while denying it.
# Farsi uses regex for the optional ZWNJ (U+200C) joiner; Arabic تجسس
# ("espionage/spying") is matched as a substr.
defaults:
  platforms: [unix, windows, android]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.75
traits:
- id: fa-spyware-term
  desc: Farsi spyware term (جاسوس‌افزار)
  conf: 0.8
  if:
    type: text
    regex: 'جاسوس\x{200c}?افزار'
  crit: notable
- id: ar-spyware-term
  desc: Arabic spyware vocabulary reference (تجسس)
  conf: 0.6
  if:
    type: text
    substr: تجسس
  crit: notable
