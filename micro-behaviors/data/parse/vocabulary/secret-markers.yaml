defaults:
  conf: 0.6
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: secret-key-name
    desc: Secret key/token/API vocabulary
    crit: component
    if:
      type: text
      regex: secret[_-]?(key|token|api)
      case_insensitive: true
    not:
      - regex: ^SecretKey$
      - regex: (?i)SecretKey(Selector|Ref|Volume|Source|Spec|Factory|Ring)
      - regex: (?i)NSS.{0,10}SecretKey
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: secret-theft-name
    desc: Secret exfiltration or theft vocabulary
    crit: notable
    if:
      type: text
      # 'secret_data' dropped: it is an ordinary identifier (numpy's
      # set_secret_data_policy, Kubernetes SecretData*), not a theft marker.
      regex: secret[_-]?(exfil|steal|grab)
      case_insensitive: true
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
    downgrade:
      any:
        - id: metadata/signed/platform::apple
