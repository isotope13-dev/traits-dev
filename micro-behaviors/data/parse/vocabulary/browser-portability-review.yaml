traits:
- conf: 0.75
  for:
  - scripts
  - source
  id: token-extraction-wording
  desc: Token near extraction or theft wording
  if:
    type: text
    regex: \b(steal|harvest|dump)\b.{0,40}\btoken\b
    case_insensitive: true
  unless:
  - id: well-known/app/browser/google-web::official-google-web-asset
  - id: metadata/lang/compiler/generated::pulumi-language-python-generated
  - type: text
    substr: windows.Token
  - type: text
    substr: windows.TOKEN_
  - type: text
    substr: windows.OpenProcessToken
- for:
  - go
  - javascript
  - lua
  - powershell
  - python
  - rust
  - shell
  - typescript
  id: encrypted-status-wording
  desc: Text states files or data are encrypted
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(files? encrypted|data has been encrypted)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
defaults:
  crit: notable
  platforms:
  - unix
  - windows
