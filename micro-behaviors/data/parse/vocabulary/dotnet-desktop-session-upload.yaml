# Managed collector that reads Discord desktop tokens and Telegram sessions,
# stages the captures as an archive and sends it with an HTTP
# multipart POST. The named routines are compiler-retained method identifiers;
# the archive and upload legs tie those sources to outbound collection.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: managed-discord-token-scan-routines-reference
  desc: References Discord token-scanning routine names
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(ScanDiscordDesktop|ExtractPlainTokens|ExtractSafeStorageTokens|AddToken)\b'

- id: managed-telegram-session-capture-routines-reference
  desc: Telegram session-capture routine names
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(ScanTelegramDesktop|ScanTelegramWeb|EnumerateTelegramFiles|CaptureDirectory)\b'
