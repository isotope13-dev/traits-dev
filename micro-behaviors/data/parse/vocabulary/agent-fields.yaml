defaults:
  platforms: [unix, windows]

traits:
  - id: agent-file-id-field
    for: [go]
    desc: Agent file identifier field reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: agent_file_id
  - id: tasking-size-field
    for: [elf, macho, pe, go]
    size_min: 512
    size_max: 524288000
    desc: Tasking size protocol field reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: tasking_size
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: delegate-tasks-field
    for: [elf, macho, pe, go]
    size_min: 512
    size_max: 524288000
    desc: Delegated task request protocol field reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: get_delegate_tasks
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: is-screenshot-field
    for: [elf, macho, pe, go]
    size_min: 512
    size_max: 524288000
    desc: Screenshot flag field reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: is_screenshot
  - id: c2-profile-field
    for: [elf, macho, pe, go]
    size_min: 512
    size_max: 524288000
    desc: C2 profile field reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: c2_profile
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

