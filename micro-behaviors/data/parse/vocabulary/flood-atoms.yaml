traits:
- id: attack-pan
  desc: PAN attack type indicator
  conf: 0.5
  if:
    type: text
    regex: (?i)(\bpan[_-]?(attack|flood)|\bpan[_-]?ddos)
- conf: 0.7
  desc: DDOS attack terminology
  id: ddos-attack-ddos
  if:
    regex: (?i)\bddos_?attack(s|ed|ing|er)?\b
    type: text
  unless:
  - id: metadata/package/documentation/page::static-html-shell
  - id: well-known/app/infrastructure/cloud-custodian::shield-ddos-metrics-filter-context
- conf: 0.7
  desc: SYN attack terminology
  id: ddos-attack-syn
  if:
    regex: (?i)\bsyn[_-]?attack\b
    type: text
- conf: 0.7
  desc: Attack target/mode/type terminology
  id: ddos-attack-target-mode-type
  if:
    regex: (?i)\b(ddos|flood)[_-]?attack[_-]?(target|mode|type)\b
    type: text
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  for:
  - binaries
  - scripts
