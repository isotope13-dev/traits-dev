# A class method invokes the same named client factory imported from Redis.
# No successful connection or unauthorized use is inferred.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-redis-client-initialization
    desc: Class invokes client factory imported from Redis
    if:
      type: tree-sitter
      query: |
        ((program
          (import_statement
            (import_clause
              (named_imports (import_specifier name: (identifier) @factory)))
            source: (string (string_fragment) @module))
          (export_statement declaration: (class_declaration
            body: (class_body
              (method_definition body: (statement_block
                (expression_statement (assignment_expression
                  right: (call_expression function: (identifier) @callee))))))))) @initialization
        (#eq? @factory "createClient")
        (#eq? @module "redis")
        (#eq? @factory @callee))
