---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - go
  mbc: C0002
traits:
- id: go-redis-import
  desc: Go Redis client import
  conf: 0.95
  if:
    type: import
    regex: "^github\\.com/(redis/go-redis|go-redis/redis)(/v[0-9]+)?$"
- id: go-redis-new-client
  desc: Creates a Redis client
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: redis.NewClient
- id: go-redis-new-cluster-client
  desc: Creates a Redis cluster client
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: redis.NewClusterClient
- id: go-redis-options-struct
  desc: Defines Redis client options
  conf: 0.85
  if:
    type: text
    regex: "\\bredis\\.Options\\s*\\{"
- id: go-redis-remote-addr
  desc: Go Redis options name a remote host
  conf: 0.9
  if:
    type: text
    regex: Addr:\s*"[A-Za-z][A-Za-z0-9.-]{3,120}:[0-9]{2,5}"
  unless:
  - type: text
    regex: Addr:\s*"(localhost|127\.0\.0\.1|0\.0\.0\.0)
  - type: text
    regex: Addr:\s*"(redis|cache|valkey)
  - type: text
    regex: Addr:\s*"(10|172|192)\.[0-9]{1,3}\.
composite_rules:
- id: go-redis-client
  desc: Go process is a Redis client
  conf: 0.95
  all:
  - id: micro-behaviors/data/db/redis::go-redis-import
  any:
  - id: micro-behaviors/data/db/redis::go-redis-new-client
  - id: micro-behaviors/data/db/redis::go-redis-new-cluster-client
  - id: micro-behaviors/data/db/redis::go-redis-options-struct
