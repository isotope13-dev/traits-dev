# Go Redis client detection (github.com/redis/go-redis, github.com/go-redis/redis).
#
# Existing redis traits in this directory cover the URL scheme (`redis://`,
# `rediss://`) and Redis-module C-side exports. Go applications using the
# canonical go-redis client go through neither: they import the package and
# call `redis.NewClient(...)` against a typed options struct. This file
# adds the Go-specific client surface so caching behavior is visible in
# pure Go binaries.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]
  mbc: C0002
traits:
  - id: go-redis-import
    desc: Go Redis client import
    conf: 0.95
    if:
      type: import
      regex: '^github\.com/(redis/go-redis|go-redis/redis)(/v[0-9]+)?$'

  - id: go-redis-new-client
    desc: Creates a Redis client
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: redis.NewClient

  - id: go-redis-new-cluster-client
    desc: Creates a Redis cluster client
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: redis.NewClusterClient

  - id: go-redis-options-struct
    desc: Defines Redis client options
    conf: 0.85
    if:
      type: text
      regex: '\bredis\.Options\s*\{'

  # A Redis endpoint on another host. Caches are overwhelmingly local or
  # private-network; an external address in the options struct means the data
  # leaves the machine, which is what makes a result sink interesting.
  - id: go-redis-remote-addr
    desc: Go Redis options name a remote host
    conf: 0.9
    if:
      type: text
      regex: 'Addr:\s*"[A-Za-z][A-Za-z0-9.-]{3,120}:[0-9]{2,5}"'
    unless:
      - type: text
        regex: 'Addr:\s*"(localhost|127\.0\.0\.1|0\.0\.0\.0)'
      # Service names resolved inside a compose/cluster network, not a host.
      - type: text
        regex: 'Addr:\s*"(redis|cache|valkey)'
      - type: text
        regex: 'Addr:\s*"(10|172|192)\.[0-9]{1,3}\.'

  - id: go-redis-rpush-call
    desc: Calls Go Redis RPUSH list append
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.RPush$'

composite_rules:
  - id: go-redis-client
    desc: Go process is a Redis client
    conf: 0.95
    all:
      - id: go-redis-import
    any:
      - id: go-redis-new-client
      - id: go-redis-new-cluster-client
      - id: go-redis-options-struct

  - id: go-redis-list-producer
    desc: Go process appends records to a Redis list
    conf: 0.96
    all:
      - id: go-redis-client
      - id: go-redis-rpush-call
