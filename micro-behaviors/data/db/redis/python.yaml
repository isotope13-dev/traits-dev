defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-redis-import
    desc: Imports the Python Redis client
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: import
      exact: redis

  - id: python-redis-rpush-call
    desc: Calls the Redis RPUSH list append method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '\.rpush$'

composite_rules:
  - id: python-redis-list-producer
    desc: Python process appends records to a Redis list
    crit: notable
    conf: 0.96
    all:
      - id: python-redis-import
      - id: python-redis-rpush-call
      - id: rediss-url
