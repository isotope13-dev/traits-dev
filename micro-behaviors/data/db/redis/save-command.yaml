defaults:
  platforms: [unix, windows]
traits:
  - id: redis-save-native-wire-command
    desc: Redis SAVE wire command in native code
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf, c, cpp]
    if:
      type: raw
      regex: '\bSAVE(\\r\\n|\r\n)'
  - id: redis-save-script-wire-command
    desc: Redis SAVE wire command in script
    crit: notable
    conf: 0.98
    for: [scripts]
    if:
      type: text
      regex: '\bSAVE(\\r\\n|\r\n)'
composite_rules:
  - id: redis-save-command
    desc: Redis SAVE wire command
    crit: notable
    conf: 0.98
    for: [scripts, elf, c, cpp]
    any:
      - id: redis-save-native-wire-command
      - id: redis-save-script-wire-command
