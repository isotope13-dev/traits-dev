---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: redis-url
  desc: redis:// URL scheme
  conf: 0.9
  if:
    type: text
    substr: redis://
  unless:
  - type: text
    regex: redis://([^\s"'@/]+@)?(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?
- id: redis-authenticated-url
  desc: redis URL with embedded username or password
  conf: 0.95
  if:
    type: text
    regex: redis://.{0,40}:.{0,80}@.{0,160}
  unless:
  - type: text
    regex: redis://([^\s"'@/]+@)?(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?
- id: rediss-url
  desc: rediss:// URL scheme
  conf: 0.9
  if:
    type: text
    substr: rediss://
  unless:
  - type: text
    regex: rediss://([^\\s"'@/]+@)?(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(:\\d+)?
- id: go-redis
  desc: go-redis driver
  conf: 0.9
  if:
    type: text
    substr: go-redis
- id: redis-py
  desc: redis-py driver
  conf: 0.9
  if:
    type: text
    substr: redis-py
- id: hiredis
  desc: hiredis library
  conf: 0.9
  if:
    type: text
    substr: hiredis
- id: ioredis
  desc: ioredis driver reference
  conf: 1.0
  if:
    type: text
    word: ioredis
  unless:
  - id: metadata/file/string/corpus::hashed-text-record
composite_rules:
- id: redis
  desc: Redis database connectivity
  conf: 0.9
  any:
  - id: micro-behaviors/data/db/redis::redis-url
  - id: micro-behaviors/data/db/redis::rediss-url
  - id: micro-behaviors/data/db/redis::go-redis
  - id: micro-behaviors/data/db/redis::redis-py
  - id: micro-behaviors/data/db/redis::hiredis
  - id: micro-behaviors/data/db/redis::ioredis
