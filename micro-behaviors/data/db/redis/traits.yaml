defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: redis-url
    desc: redis:// URL scheme
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: redis://
    unless:
      - type: text
        regex: redis://([^\\s"'@/]+@)?(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(:\\d+)?
  - id: rediss-url
    desc: rediss:// URL scheme
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: rediss://
    unless:
      - type: text
        regex: rediss://([^\\s"'@/]+@)?(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(:\\d+)?
  - id: go-redis
    desc: go-redis driver
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: go-redis
  - id: redis-py
    desc: redis-py driver
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: redis-py
  - id: hiredis
    desc: hiredis library
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: hiredis
  - id: ioredis
    desc: ioredis driver reference
    crit: notable
    conf: 1.0
    if:
      type: text
      word: ioredis
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: redis-flushall-call
    desc: Redis client FLUSHALL call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(redis|redis_db|client|conn)\.flushall\s*\('
  - id: redis-construct-append
    desc: Redis client APPEND after construct
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bnew\s+Redis\b[\s\S]{0,800}\.append\s*\('
composite_rules:
  - id: redis
    desc: Redis database connectivity
    crit: notable
    conf: 0.9
    any:
      - id: redis-url
      - id: rediss-url
      - id: go-redis
      - id: redis-py
      - id: hiredis
      - id: ioredis
