defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  size_min: 512
  size_max: 500000000

traits:
  - id: redis-cli-tool
    desc: redis-cli command-line tool
    crit: notable
    conf: 0.7
    if:
      type: text
      word: redis-cli
      section: .text

  - id: redis-cli-auth-command
    desc: redis-cli AUTH command with credential
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bredis-cli\b[^\r\n;&|]{0,160}\bAUTH\s+["'']?\S+'
      case_insensitive: true

  - id: redis-replication-endpoint-command
    desc: Redis replication endpoint command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(SLAVEOF|REPLICAOF)\s+[A-Za-z0-9.-]+\s+\d{1,5}\b'
      case_insensitive: true

  - id: redis-keys-full-keyspace
    desc: Redis KEYS '*' full-keyspace query
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bKEYS\s+\*(\s|["'']|$)'

  - id: redis-scan-cursor
    desc: Redis SCAN cursor query
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bSCAN\s+[0-9]+'

composite_rules:
  - id: redis-full-keyspace-enumeration
    desc: Redis full-keyspace enumeration
    crit: notable
    conf: 0.9
    all:
      - id: redis-cli-tool
      - id: redis-keys-full-keyspace
    unless:
      - id: well-known/app/development/vscode-extension/jinicode::benign-read-only-database-tool-context

  - id: redis-cursor-enumeration
    desc: Redis cursor-based key enumeration
    crit: notable
    conf: 0.85
    all:
      - id: redis-cli-tool
      - id: redis-scan-cursor
