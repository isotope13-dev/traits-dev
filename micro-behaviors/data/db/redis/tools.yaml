---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  size_min: 512
  size_max: 500000000
traits:
- id: redis-cli-tool
  desc: redis-cli command-line tool
  conf: 0.7
  if:
    type: text
    word: redis-cli
    section: ".text"
- id: redis-cli-auth-command
  desc: redis-cli AUTH command with credential
  conf: 0.9
  if:
    type: text
    regex: \bredis-cli\b[^\r\n;&|]{0,160}\bAUTH\s+["']?\S+
    case_insensitive: true
- id: redis-replication-endpoint-command
  size_min: 0
  desc: Redis replication endpoint command
  conf: 0.9
  if:
    type: text
    regex: \b(SLAVEOF|REPLICAOF)\s+([A-Za-z0-9.-]+|"\$[A-Za-z_][A-Za-z0-9_]*")\s+\d{1,5}\b
    case_insensitive: true
composite_rules: []
