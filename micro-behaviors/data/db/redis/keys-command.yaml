defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: redis-keys-method-call
    desc: Calls Redis KEYS through a client method
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(redis|ioredis|redisClient)\s*\.\s*keys\s*\('
  - id: this-redis-keys-method-call
    desc: Calls Redis KEYS through this.redis
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bthis\.redis\s*\.\s*keys\s*\('
  - id: redis-send-command-keys-call
    desc: Calls Redis KEYS via command API
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(sendCommand|call)\s*\(\s*\[\s*["'']KEYS["'']'
