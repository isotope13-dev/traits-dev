defaults:
  for: [scripts, binaries]
  platforms: [unix, windows]

traits:
  - id: config-set-dir
    desc: Redis CONFIG SET dir command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: config\s+set\s+dir\s+"?/
      case_insensitive: true
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  - id: config-set-dbfilename
    desc: Redis CONFIG SET dbfilename command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: config\s+set\s+dbfilename\s+
      case_insensitive: true
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide

composite_rules:
  - id: snapshot-path-configuration
    desc: Redis snapshot directory and filename configuration
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/db/redis::config-set-dir
      - id: micro-behaviors/data/db/redis::config-set-dbfilename
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
