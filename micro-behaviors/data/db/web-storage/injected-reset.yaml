defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.93

composite_rules:
  # Injection and bulk deletion are useful capabilities, but their proximity
  # does not establish destruction of victim data. A user-invoked site-cache
  # reset uses this same sequence. No product identity or UI label exemption.
  - id: script-injection-near-indexeddb-reset
    desc: Script injection beside IndexedDB reset
    scope: file
    near_bytes: 4096
    all:
      - id: indexeddb-databases-enumerate
      - id: indexeddb-delete-database
    any:
      - id: metadata/permission/host::broad-content-script-matches
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
