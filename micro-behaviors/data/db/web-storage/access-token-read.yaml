defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.9

traits:
  - id: web-storage-access-token-read
    desc: Reads an access token from page localStorage
    if:
      type: text
      regex: 'localStorage\.getItem\(\s*[''"](access_token|refresh_token)[''"]'
      exclude_comments: true
