defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: base64-xor-site-repair-state
    desc: Encoded site-repair state key
    crit: baseline
    conf: 0.96
    if:
      type: text
      substr: jJaLmqCNmo+elo2gjIuei5rY
  - id: base64-xor-browser-downloaded-state
    desc: Encoded browser download state key
    crit: baseline
    conf: 0.96
    if:
      type: text
      substr: 2I0puQiJGTkJ6bmpvY
  - id: base64-xor-browser-mode-map
    desc: Encoded browser mode-map marker
    crit: baseline
    conf: 0.93
    if:
      type: text
      substr: djZCIjJqNxdiJztGVjNg
  - id: base64-xor-cloudflare-mode-map
    desc: Encoded Cloudflare mode-map marker
    crit: baseline
    conf: 0.93
    if:
      type: text
      substr: yTkIqbmZOejZrF2InJ0ZWM2
  - id: base64-xor-state-key-pair
    desc: Encoded browser state keys in proximity
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: jJaLmqCNmo\+elo2gjIuei5rY[\s\S]{0,100}2I0puQiJGTkJ6bmpvY
  - id: base64-xor-dual-mode-map
    desc: Encoded browser mode maps in proximity
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: djZCIjJqNxdiJztGVjNg[\s\S]{0,120}yTkIqbmZOejZrF2InJ0ZWM2

composite_rules:
  - id: site-repair-and-browser-download-state
    desc: Encoded site-repair and browser-download state markers
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/db/web-storage::base64-xor-site-repair-state
      - id: micro-behaviors/data/db/web-storage::base64-xor-browser-downloaded-state
  - id: browser-and-cloudflare-mode-map
    desc: Encoded browser and Cloudflare mode markers
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/data/db/web-storage::base64-xor-browser-mode-map
      - id: micro-behaviors/data/db/web-storage::base64-xor-cloudflare-mode-map
