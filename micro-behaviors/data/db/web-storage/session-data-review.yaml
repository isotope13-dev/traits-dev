traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: auth-token-getitem-source
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: getItem names an authentication token key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: getItem\(\s*["\x27](access_token|refresh_token|okta-token-storage)["\x27]
