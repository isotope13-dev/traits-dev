defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: dom-storage-removeitem-call
    desc: Deletes an entry from browser storage
    if:
      type: symbol
      kind: call
      regex: '^((window|globalThis)\.)?(localStorage|sessionStorage)\.removeItem$'
  - id: extension-storage-change-listener
    desc: Registers an extension storage change listener
    if:
      type: symbol
      kind: call
      regex: '^(chrome|browser)\.storage\.onChanged\.addListener$'
