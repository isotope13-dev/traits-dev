# Browser local storage interfaces. Cryptography alone does not satisfy
# this capability; collection and export consumers supply their own intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

composite_rules:
  - id: browser-local-storage-interfaces
    desc: "Browser local storage interfaces"
    crit: component
    conf: 0.9
    any:
    - id: micro-behaviors/data/db/web-storage::dexie-indexeddb-wrapper
    - id: micro-behaviors/data/db/web-storage::indexeddb-open
    - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
