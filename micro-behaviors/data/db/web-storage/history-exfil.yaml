# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: dexie-indexeddb-wrapper
    desc: Dexie IndexedDB wrapper instantiation
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bnew\s+Dexie\s*\('
  - id: array-push-local-anal-storage
    desc: "Array push and local anal storage"
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'push\([A-Za-z_$][\w$]*\).{0,180}storage\.local\.set\(\{anal:'
