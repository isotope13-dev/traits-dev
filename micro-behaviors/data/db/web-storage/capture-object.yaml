defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text]
  crit: notable
  conf: 0.97

traits:
  - id: oauth-token-field-from-local-storage
    desc: OAuth token field reads browser local storage
    if:
      type: text
      regex: '(access|refresh)_token["\x27]\s*:\s*localStorage\['

  - id: local-store-snapshot-field
    desc: Snapshot field passes localStorage to helper
    if:
      type: text
      regex: '["\x27]localStorage["\x27]\s*:\s*\w+\(localStorage\)'

  - id: session-store-snapshot-field
    desc: Snapshot field passes sessionStorage to helper
    if:
      type: text
      regex: '["\x27]sessionStorage["\x27]\s*:\s*\w+\(sessionStorage\)'

composite_rules:
  - id: both-web-stores-in-snapshot-object
    desc: Snapshot fields pass both browser stores
    near_bytes: 512
    all:
      - id: local-store-snapshot-field
      - id: session-store-snapshot-field
