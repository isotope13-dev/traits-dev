defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: dom-localstorage
  desc: Web Storage localStorage access
  crit: baseline
  if:
    type: text
    regex: "\\b(window\\.)?localStorage\\s*(\\.|\\[)"
- id: localstorage-alias-assignment
  desc: Aliases the browser localStorage object
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\b(LS|storage|store)\\s*=\\s*localStorage\\b"
- id: dom-storage-bracket-accessor
  desc: Web Storage accessed via bracket notation
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: "\\b(localStorage|sessionStorage)\\s*\\["
