defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: extension-startup-handler-storage-read
  desc: Startup listener reads extension storage
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((call_expression
         function: (member_expression
           object: (member_expression property: (property_identifier) @event)
           property: (property_identifier) @method)
         arguments: (arguments (_) @listener))
       (#eq? @event "onStartup")
       (#eq? @method "addListener")
       (#match? @listener "storage\.(local|sync|session|managed)\.get"))

