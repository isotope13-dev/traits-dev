defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]
traits:
- id: extension-local-sync-get-text
  desc: Local or sync extension storage read syntax
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'storage\.(local|sync)\.get\s*\('
- id: extension-local-sync-set-text
  desc: Local or sync extension storage write syntax
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'storage\.(local|sync)\.set\s*\('
