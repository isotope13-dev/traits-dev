# A string that names the browser's IndexedDB store. Ordinary in any web app
# (log and error messages); LLM-prompt harvesting composites under
# objectives/supply-chain/recon-exfil/ai-cli/ use it as one vocabulary leg of
# a prompt that lists credential stores to search. Moved from there, where it
# was described as a credential-store name.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
  crit: notable
  conf: 0.9

traits:
  - id: indexeddb-name-literal
    desc: String literal names IndexedDB
    if:
      type: literal
      substr: IndexedDB
      case_insensitive: true
