defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
- id: extension-storage-read-data-keys
  desc: Reads extension storage using data.keys
  crit: notable
  if:
    type: text
    regex: 'chrome\.storage\.(local|sync)\.get\(\s*[A-Za-z_$][\w$]*\.data\.keys\s*\)'
