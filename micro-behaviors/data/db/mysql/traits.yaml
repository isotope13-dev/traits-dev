defaults:
  crit: notable
  conf: 0.9
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe, go, wasm]
traits:
  - id: libmysql
    desc: libmysql library
    if:
      type: text
      substr: libmysql
  - id: mysql-url
    desc: mysql:// URL scheme
    if:
      type: text
      substr: mysql://
  - id: mysql-real-connect
    desc: mysql_real_connect function
    if:
      type: symbol
      regex: mysql_real_connect
  - id: mysqlclient
    desc: mysqlclient library
    if:
      type: text
      substr: mysqlclient
  - id: go-sql-mysql
    desc: go-sql-driver/mysql
    if:
      type: text
      substr: go-sql-driver/mysql
  - id: pymysql
    desc: Imports the PyMySQL driver
    for: [python]
    if:
      type: import
      exact: pymysql
composite_rules:
  - id: mysql
    desc: MySQL/MariaDB database connectivity
    any:
      - id: libmysql
      - id: mysql-url
      - id: mysql-real-connect
      - id: mysqlclient
      - id: go-sql-mysql
      - id: pymysql
      - id: micro-behaviors/data/db/mysql::php-mysql-connect
      - id: micro-behaviors/data/db/mysql::php-mysql-admin-surface
