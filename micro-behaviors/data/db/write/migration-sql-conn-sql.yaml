# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: sql-set-password-assignment
  desc: SQL SET password assignment
  crit: notable
  conf: 0.82
  if:
    type: text
    # SQL shape only: the value is a quoted string or PASSWORD() call, and an
    # optional FOR clause may sit before the equals sign. Shell and batch
    # variable setters (`set "PASSWORD=..."`) quote before the name and never
    # quote the assigned value, so they do not match.
    regex: (?i)\bSET\s+PASSWORD(\s+FOR\b.{0,64})?\s*=\s*(PASSWORD\(|['"])
