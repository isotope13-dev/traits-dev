defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: secret-validation-status-update
    desc: SQL secret-status update beside last-checked assignment
    crit: notable
    conf: 0.96
    near_lines: 12
    all:
      - id: micro-behaviors/data/db/write/row::secret-table-status-update
      - id: micro-behaviors/data/db/write/row::last-checked-sql-assignment
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/threat-intel/
