# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: postgres-cron-job-update
  desc: Directly updates pg_cron job table
  if:
    type: text
    regex: (?i)\bUPDATE\s+"?cron"?\s*\.\s*"?job"?\s+SET\b
