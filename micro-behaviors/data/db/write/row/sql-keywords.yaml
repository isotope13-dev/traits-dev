defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - source
  crit: component
  conf: 0.92
  size_max: 5000000

traits:
  - id: sql-insert-into-statement
    desc: SQL INSERT INTO statement marker
    if:
      type: literal
      kind: string
      regex: '(?i)\bINSERT\s+INTO\b'

  - id: sql-update-set-statement
    desc: SQL UPDATE SET statement marker
    if:
      type: text
      regex: '(?i)\bUPDATE\s+[A-Za-z_][A-Za-z0-9_$\.\[\]]*\s+SET\b'
