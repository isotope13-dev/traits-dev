defaults:
  platforms: [unix, windows]
  for: [python, powershell, text]
  crit: notable
traits:
  - id: postgres-cron-postgres-username-update
    desc: Updates pg_cron job username to postgres
    conf: 0.99
    if:
      type: text
      regex: '(?i)UPDATE\s+"?cron"?\s*\.\s*"?job"?\s+SET\s+"?username"?\s*=\s*''postgres'''
