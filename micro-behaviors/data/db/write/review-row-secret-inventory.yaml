# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
composite_rules:
- id: secret-validation-status-update
  desc: SQL secret-status update beside last-checked assignment
  crit: notable
  conf: 0.96
  near_lines: 12
  all:
  - id: micro-behaviors/data/db/write::secret-table-status-update
  - id: micro-behaviors/data/db/write::last-checked-sql-assignment
  unless:
  - id: metadata/file/profile/security-scanner/
  - id: well-known/tool/detection/threat-intel/
