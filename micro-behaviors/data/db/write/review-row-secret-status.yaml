# Database-operation review; matcher and effective scope preserved.
---
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  id: secret-table-status-update
  desc: SQL updates secret table status
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)UPDATE\\s+\\w*(secret|credential|token)\\w*\\s+SET\\s+status\\s*="
