# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
traits:
- id: php-add-option
  desc: Creates a WordPress option (add_option)
  if:
    type: symbol
    exact: add_option
- id: php-update-post-meta
  desc: Writes WordPress post metadata
  if:
    type: symbol
    kind: call
    exact: update_post_meta
- id: php-insert-post
  desc: Creates a WordPress post
  if:
    type: symbol
    kind: call
    exact: wp_insert_post
