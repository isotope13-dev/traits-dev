# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - go
  mbc: C0002
traits:
- id: go-redis-rpush-call
  desc: Calls Go Redis RPUSH list append
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: "\\.RPush$"
composite_rules:
- id: go-redis-list-producer
  desc: Go process appends records to a Redis list
  conf: 0.96
  all:
  - id: micro-behaviors/data/db/redis::go-redis-client
  - id: micro-behaviors/data/db/write::go-redis-rpush-call
