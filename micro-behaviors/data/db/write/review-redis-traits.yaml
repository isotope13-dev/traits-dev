# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: redis-construct-append
  desc: Redis client APPEND after construct
  conf: 0.93
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\bnew\\s+Redis\\b[\\s\\S]{0,800}\\.append\\s*\\("
