# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: sql-update-debits-existing-balance
  desc: SQL update subtracts from a balance column
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "(?i)UPDATE\\s+[a-z0-9_]+\\s+SET\\s+balance\\s*=\\s*balance\\s*-"
- id: sql-insert-records-transaction-hash
  desc: SQL insert records a transaction hash
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "(?is)INSERT\\s+INTO\\s+[a-z0-9_]+\\s*\\([^)]{0,240}\\btx_hash\\b"
- id: sql-insert
  desc: SQL INSERT syntax reference
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  - c
  - cpp
  - go
  if:
    type: literal
    kind: string
    regex: "(?i)\\bINSERT\\s+INTO\\s+\\w+\\s*(\\(|VALUES\\b|SELECT\\b|DEFAULT\\b)"
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sql-update
  desc: SQL UPDATE syntax reference
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bUPDATE\\s+[a-z0-9_]+\\s+SET\\s+[a-z0-9_]+\\s*="
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sql-insert-into-users-table
  desc: SQL inserts into a users table
  for:
  - php
  - text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(?i)INSERT\\s+INTO\\s+[^\\n(]{0,40}users\\s*\\("
composite_rules:
- id: sql-balance-debit-with-transaction-record
  desc: SQL balance debit accompanies transaction record
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  near_bytes: 16000
  all:
  - id: micro-behaviors/data/db/write::sql-update-debits-existing-balance
  - id: micro-behaviors/data/db/write::sql-insert-records-transaction-hash
