# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-redis-rpush-call
  desc: Calls the Redis RPUSH list append method
  conf: 0.88
  if:
    type: symbol
    kind: call
    regex: "\\.rpush$"
composite_rules:
- id: python-redis-list-producer
  desc: Python process appends records to a Redis list
  conf: 0.96
  all:
  - id: micro-behaviors/data/db/redis::python-redis-import
  - id: micro-behaviors/data/db/write::python-redis-rpush-call
  - id: micro-behaviors/data/db/redis::rediss-url
