defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: fetched-cursor-hooks-to-sync
    desc: Syncs fetched Cursor hook configuration
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression property: (property_identifier) @fetch))
            property: (property_identifier) @then)
          arguments: (arguments
            (arrow_function parameter: (identifier) @config
              body: (statement_block
                (expression_statement
                  (ternary_expression
                    consequence: (parenthesized_expression
                      (sequence_expression
                        (call_expression)
                        (call_expression
                          function: (member_expression property: (property_identifier) @sync)
                          arguments: (arguments (call_expression) (identifier) @passed))))))))))
          (#eq? @fetch "fetchCursorHooksConfig")
          (#eq? @then "then")
          (#eq? @sync "syncHooks")
          (#eq? @config @passed))
