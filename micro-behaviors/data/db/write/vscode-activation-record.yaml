defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: vscode-global-activation-timestamps
    desc: Stores editor activation timestamps
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @state)
            property: (property_identifier) @update)
          arguments: (arguments . (_) . (call_expression
            function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
            arguments: (arguments . (object
              (pair key: (property_identifier) @first value: (identifier) @time)
              (pair key: (property_identifier) @last value: (identifier) @time2)
              (pair key: (property_identifier) @initialized value: (true))) .)) .))
          (#eq? @state "globalState")
          (#eq? @update "update")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @first "firstActivated")
          (#eq? @last "lastActivated")
          (#eq? @initialized "initialized")
          (#eq? @time @time2))
