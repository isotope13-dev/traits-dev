defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: clickhouse-rowbinary-null-insert
    desc: Inserts RowBinary into null table function
    crit: notable
    if:
      type: text
      regex: 'INSERT\s+INTO\s+FUNCTION\s+null\([^\r\n)]{1,60}\)\s+FORMAT\s+RowBinary\b'
      case_insensitive: true
      exclude_comments: true
