defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: extension-consent-flag-set
    desc: Sets extension consent or tracking flag true
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'storage\.\w+\.set\(\s*\{\s*\w*(nsights|onsent|racking)\w*\s*:\s*true'

