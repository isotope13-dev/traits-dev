# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.95
traits:
- id: binary-insert-bare
  desc: binary INSERT with bare quoting
  conf: 0.93
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+Binary\\s*\\("
- id: binary-insert-backtick
  desc: binary INSERT with backtick quoting
  conf: 0.93
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+`Binary`\\s*\\("
- id: binary-insert-bracket
  desc: binary INSERT with bracket quoting
  conf: 0.93
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+\\[Binary\\]\\s*\\("
- id: binary-insert-double
  desc: binary INSERT with double quoting
  conf: 0.93
  if:
    type: text
    regex: (?i)\bINSERT\s+INTO\s+"Binary"\s*\(
- id: binary-insert-single
  desc: binary INSERT with single quoting
  conf: 0.93
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+'Binary'\\s*\\("
- id: custom-action-insert-bare
  desc: custom action INSERT with bare quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+CustomAction\\s*\\("
- id: custom-action-insert-backtick
  desc: custom action INSERT with backtick quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+`CustomAction`\\s*\\("
- id: custom-action-insert-bracket
  desc: custom action INSERT with bracket quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+\\[CustomAction\\]\\s*\\("
- id: custom-action-insert-double
  desc: custom action INSERT with double quoting
  if:
    type: text
    regex: (?i)\bINSERT\s+INTO\s+"CustomAction"\s*\(
- id: custom-action-insert-single
  desc: custom action INSERT with single quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+'CustomAction'\\s*\\("
- id: install-sequence-insert-bare
  desc: install sequence INSERT with bare quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+Install(Execute|UI)Sequence\\s*\\("
- id: install-sequence-insert-backtick
  desc: install sequence INSERT with backtick quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+`Install(Execute|UI)Sequence`\\s*\\("
- id: install-sequence-insert-bracket
  desc: install sequence INSERT with bracket quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+\\[Install(Execute|UI)Sequence\\]\\s*\\("
- id: install-sequence-insert-double
  desc: install sequence INSERT with double quoting
  if:
    type: text
    regex: (?i)\bINSERT\s+INTO\s+"Install(Execute|UI)Sequence"\s*\(
- id: install-sequence-insert-single
  desc: install sequence INSERT with single quoting
  if:
    type: text
    regex: "(?i)\\bINSERT\\s+INTO\\s+'Install(Execute|UI)Sequence'\\s*\\("
composite_rules:
- id: sql-insert-binary-table-reference
  desc: SQL INSERT reference to Binary
  conf: 0.93
  any:
  - id: micro-behaviors/data/db/write::binary-insert-bare
  - id: micro-behaviors/data/db/write::binary-insert-backtick
  - id: micro-behaviors/data/db/write::binary-insert-bracket
  - id: micro-behaviors/data/db/write::binary-insert-double
  - id: micro-behaviors/data/db/write::binary-insert-single
- id: sql-insert-custom-action-table-reference
  desc: SQL INSERT reference to CustomAction
  any:
  - id: micro-behaviors/data/db/write::custom-action-insert-bare
  - id: micro-behaviors/data/db/write::custom-action-insert-backtick
  - id: micro-behaviors/data/db/write::custom-action-insert-bracket
  - id: micro-behaviors/data/db/write::custom-action-insert-double
  - id: micro-behaviors/data/db/write::custom-action-insert-single
- id: sql-insert-install-sequence-table-reference
  desc: SQL INSERT reference to install sequence
  any:
  - id: micro-behaviors/data/db/write::install-sequence-insert-bare
  - id: micro-behaviors/data/db/write::install-sequence-insert-backtick
  - id: micro-behaviors/data/db/write::install-sequence-insert-bracket
  - id: micro-behaviors/data/db/write::install-sequence-insert-double
  - id: micro-behaviors/data/db/write::install-sequence-insert-single
