defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: extension-local-storage-computed-true
    desc: Sets computed extension storage key to true
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'chrome\.storage\.local\.set\(\s*\{[^}]{0,120}\[[A-Za-z_$][\w$]*\]\s*:\s*true'
