defaults:
  crit: notable
  platforms:
  - windows
  for:
  - csharp
traits:
- id: sqlcommand
  desc: References the SqlCommand query API
  conf: 0.8
  if:
    type: symbol
    kind: identifier
    exact: SqlCommand
- id: extension-method
  desc: Declares a SQL command extension method
  conf: 0.7
  if:
    type: text
    substr: this SqlCommand
