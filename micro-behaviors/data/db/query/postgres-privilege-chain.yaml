# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: postgres-large-object-from-bytea
  desc: Stages bytes as PostgreSQL large object
  if:
    type: text
    regex: (?i)\blo_from_bytea\s*\(
- id: postgres-auto-conf-call-argument
  desc: SQL call with auto-config filename argument
  if:
    type: text
    regex: '(?i)\bSELECT\s+[\w.]+\s*\(\s*\d+\s*,\s*''postgresql\.auto\.conf''\s*\)'
