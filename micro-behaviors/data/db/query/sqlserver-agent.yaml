defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: sqlserver-agent-add-jobstep
    desc: SQL Agent job step creation statement
    crit: notable
    if:
      type: text
      regex: '(?i)\bEXEC(UTE)?\s+([\w\[\]]*\.){0,2}sp_add_jobstep\b'
  - id: sqlserver-agent-powershell-subsystem
    desc: SQL Agent selects PowerShell subsystem
    crit: notable
    if:
      type: text
      regex: '(?i)@subsystem\s*=\s*N?''PowerShell'''
  - id: sqlserver-agent-start-job
    desc: SQL Agent job start statement
    crit: notable
    if:
      type: text
      regex: '(?i)\bEXEC(UTE)?\s+([\w\[\]]*\.){0,2}sp_start_job\b'
