---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - php
traits:
- id: wp-user-query-exclusion
  desc: WordPress user query exclusion
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: user_login\s*!=|login__not_in
- id: wp-user-field-not-equal
  desc: WP user field with inequality
  crit: notable
  if:
    type: text
    regex: '(user_login|user_email|display_name)\s*(!=|<>)'
- id: wp-user-field-not-in
  desc: WP user field with NOT IN list
  crit: notable
  if:
    type: text
    regex: '(user_login|ID|user_email)\s+NOT\s+IN'
composite_rules:
- id: wp-user-query-filtering
  desc: WordPress user query filtering
  crit: notable
  conf: 0.84
  all:
  - id: metadata/lang/source/naming/target::user-login-token
  - id: micro-behaviors/data/db/query::wp-user-query-exclusion
