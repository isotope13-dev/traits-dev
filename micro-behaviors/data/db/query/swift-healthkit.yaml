# Construction exposes permission-gated HealthKit query capability; it does
# not establish covert collection, execution of the query, or transmission.
defaults:
  for: [swift]
  platforms: [ios, macos]
  crit: notable
  conf: 0.98

traits:
  - id: swift-healthkit-sample-query
    desc: Constructs a HealthKit sample query
    if:
      type: symbol
      kind: call
      exact: HKSampleQuery

  - id: swift-healthkit-statistics-query
    desc: Constructs a HealthKit statistics query
    if:
      type: symbol
      kind: call
      exact: HKStatisticsQuery

  - id: swift-healthkit-anchored-query
    desc: Constructs an anchored HealthKit query
    if:
      type: symbol
      kind: call
      exact: HKAnchoredObjectQuery
