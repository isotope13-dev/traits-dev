defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell, javascript, java, text, jsp]
  crit: notable

traits:
  - id: archibus-password-column-list
    desc: DWR list references user password column
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-e\d+=string:\[[^\r\n]{0,160}\bafm_users\.user_pwd\b'

composite_rules:
  - id: archibus-query-password-column-list
    desc: Archibus query and password-column list
    conf: 0.98
    all:
      - id: archibus-password-column-list
      - id: micro-behaviors/communications/rpc::archibus-record-query-call
    near_bytes: 1536
