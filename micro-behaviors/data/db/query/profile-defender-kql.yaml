defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - powershell
  - python
  - shell
  - go
  - csharp
  - text
  - data
traits:
- id: endpoint-sensitive-file-event-text
  desc: Endpoint file-event sensitivity-label text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?is)\bDeviceFileEvents\b.{0,700}\bSensitivityLabel\b
- id: endpoint-file-event-sha256-text
  desc: Endpoint file-event SHA256 field text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\bDeviceFileEvents\b.{0,700}\bSHA256\b
- id: email-attachment-table-source-text
  desc: Email attachment table source text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?m)^\s*EmailAttachmentInfo\s*(\||$)
- id: email-attachment-recipient-field-text
  desc: Email attachment recipient-field text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\bEmailAttachmentInfo\b.{0,700}\bRecipientEmailAddress\b
- id: email-attachment-sha256-field-text
  desc: Email attachment SHA256 field text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\bEmailAttachmentInfo\b.{0,700}\bSHA256\b
- id: public-domain-data-security-event-text
  desc: Public-domain data-security event text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)\bDataSecurityEvents\b.{0,700}\bActionType\b.{0,180}free\s+public\s+domains
composite_rules:
- id: sensitive-file-hash-inventory-query
  desc: Sensitive-file hash inventory query
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/data/db/query::endpoint-sensitive-file-event-text
  - id: micro-behaviors/data/db/query::endpoint-file-event-sha256-text
- id: file-external-email-hash-correlation-query
  desc: File and external-email hash correlation query
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/query::sensitive-file-hash-inventory-query
  - id: micro-behaviors/data/db/query::email-attachment-table-source-text
  - id: micro-behaviors/data/db/query::email-attachment-recipient-field-text
  - id: micro-behaviors/data/db/query::email-attachment-sha256-field-text
  - id: micro-behaviors/data/db/query::recipient-domain-filter-text
  - id: micro-behaviors/data/db/query::sha256-join-text
  near_bytes: 12000
- id: file-public-domain-hash-correlation-query
  desc: File and public-domain hash correlation query
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/query::sensitive-file-hash-inventory-query
  - id: micro-behaviors/data/db/query::public-domain-data-security-event-text
  - id: metadata/lang/source/naming/record::attachment-info-json-parse-text
  - id: micro-behaviors/data/db/query::attachment-array-expansion-text
  - id: metadata/lang/source/naming/record::attachment-sha256-field-text
  - id: micro-behaviors/data/db/query::sha256-join-text
  near_bytes: 12000
