# Recovered UPX images can leave Go constants in very long fused strings.
# The hex fallback reaches the bytes omitted by text extraction; ordinary
# text is still matched by the existing cross-format SQL observation.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Rust concatenates constants without terminators. The string extractor may
  # omit that entire run; match the query bytes without requiring action_url.
  - id: chromium-login-password-select-rdata
    desc: Chromium saved-password SELECT bytes in .rdata
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rdata
      regex: 'SELECT origin_url,\s*username_value,\s*password_value FROM logins\b'
  - id: chromium-login-column-select-upx0
    desc: Chromium login-column SELECT bytes in UPX0
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: UPX0
      pattern: '53 45 4C 45 43 54 20 6F 72 69 67 69 6E 5F 75 72 6C 2C 20 61 63 74 69 6F 6E 5F 75 72 6C 2C 20 75 73 65 72 6E 61 6D 65 5F 76 61 6C 75 65 2C 20 70 61 73 73 77 6F 72 64 5F 76 61 6C 75 65'
  - id: chromium-login-column-select-rdata
    desc: Chromium login-column SELECT bytes in .rdata
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .rdata
      pattern: '53 45 4C 45 43 54 20 6F 72 69 67 69 6E 5F 75 72 6C 2C 20 61 63 74 69 6F 6E 5F 75 72 6C 2C 20 75 73 65 72 6E 61 6D 65 5F 76 61 6C 75 65 2C 20 70 61 73 73 77 6F 72 64 5F 76 61 6C 75 65'
composite_rules:
  - id: chromium-login-query-reference
    desc: Chromium stored-login SELECT reference
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: chromium-login-column-select-upx0
      - id: chromium-login-column-select-rdata
      - id: chromium-login-password-select-rdata
