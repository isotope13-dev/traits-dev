# A helper must forward its SQL parameter directly to a query API. Both the
# helper name and parameter bindings must agree; labels and comments cannot
# establish a database call. Adjacent Python string literals are one argument.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-forwarded-litellm-credentials-query
    desc: Helper queries LiteLLM credentials table
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @helper
            parameters: (parameters . (identifier) @db . (identifier) @sql .)
            body: (block . (return_statement
              (await (call
                function: (attribute object: (identifier) @receiver
                  attribute: (identifier) @query)
                arguments: (argument_list . (identifier) @forwarded .)))) .))
          (function_definition
            body: (block
              (try_statement body: (block
                (expression_statement (assignment
                  right: (await (call
                    function: (identifier) @invoked
                    arguments: (argument_list . (identifier) . [(string) (concatenated_string)] @statement .))))))))))
          (#eq? @helper @invoked)
          (#eq? @db @receiver)
          (#eq? @sql @forwarded)
          (#match? @query "^(query_raw|query|execute|executequery)$")
          (#match? @statement "(?i)^[\"']{1,3}SELECT[ \\t]+")
          (#match? @statement "(?i)FROM[ \\t]+[\"`\\[]?LiteLLM_CredentialsTable[\"`\\] \\t]"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

  - id: python-forwarded-litellm-models-query
    desc: Helper queries LiteLLM model table
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @helper
            parameters: (parameters . (identifier) @db . (identifier) @sql .)
            body: (block . (return_statement
              (await (call
                function: (attribute object: (identifier) @receiver
                  attribute: (identifier) @query)
                arguments: (argument_list . (identifier) @forwarded .)))) .))
          (function_definition
            body: (block
              (try_statement body: (block
                (expression_statement (assignment
                  right: (await (call
                    function: (identifier) @invoked
                    arguments: (argument_list . (identifier) . [(string) (concatenated_string)] @statement .))))))))))
          (#eq? @helper @invoked)
          (#eq? @db @receiver)
          (#eq? @sql @forwarded)
          (#match? @query "^(query_raw|query|execute|executequery)$")
          (#match? @statement "(?i)^[\"']{1,3}SELECT[ \\t]+")
          (#match? @statement "(?i)FROM[ \\t]+[\"`\\[]?LiteLLM_ProxyModelTable[\"`\\] \\t]"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
