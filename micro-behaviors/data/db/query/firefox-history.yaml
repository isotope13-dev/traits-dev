# Query text is a capability reference; it does not establish collection intent.
defaults:
  platforms: [windows]
  for: [pe, source]
  attack: T1217
traits:
- id: firefox-history-sql-query
  desc: Firefox moz_places history SQL query
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_places
    case_insensitive: true
  unless:
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/security/itop-vpn::benign-context
  - id: well-known/app/communication/thunderbird::thunderbird-xul-runtime
  - id: well-known/app/browser/mozilla-firefox::firefox-xul-runtime
  - id: well-known/app/browser/nova-browser::nova-browser-context
