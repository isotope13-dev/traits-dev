defaults:
  crit: notable
  platforms: [unix, windows]
  for: [pe, csharp, asp]
traits:
  - id: execute-nonquery
    desc: ExecuteNonQuery method
    conf: 0.7
    if:
      type: text
      substr: ExecuteNonQuery
  - id: execute-scalar
    desc: ExecuteScalar method
    conf: 0.7
    if:
      type: text
      substr: ExecuteScalar
  - id: execute-reader
    desc: ExecuteReader method
    conf: 0.7
    if:
      type: text
      substr: ExecuteReader
composite_rules:
  - id: sql-command
    desc: ADO.NET command and query API references
    conf: 0.85
    any:
      - id: execute-nonquery
      - id: execute-scalar
      - id: execute-reader
      - id: micro-behaviors/data/db/access::sql-command-class
      - id: micro-behaviors/data/db/access::db-command-class
