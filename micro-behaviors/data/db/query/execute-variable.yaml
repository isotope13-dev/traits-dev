defaults:
  platforms: [unix, windows]

traits:
  - id: execute-sql-variable
    desc: Executes a query from a sql variable
    for: [jsp, java, html, javascript, python]
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '\.execute(Query|Update)?\s*\(\s*sql\w*\s*\)'

  # Python DB-API execute() of a single query variable, with no parameter
  # tuple. Ordinary when the variable is a constant; consumers bind it to
  # interpolated SQL built a few lines earlier.
  - id: python-execute-query-variable
    desc: Executes a query variable without parameters
    for: [python]
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.execute\(\s*(query|sql|stmt|statement|q)\w*\s*\)'

composite_rules:
  # The f-string and its unparameterized execute() are a few lines apart in
  # the same function: user values reach the SQL text, not bound parameters.
  - id: python-executes-interpolated-sql
    desc: Executes SQL built by f-string interpolation without bound parameters
    for: [python]
    crit: notable
    conf: 0.9
    near_lines: 6
    all:
      - id: micro-behaviors/data/db/query::python-sql-f-string
      - id: python-execute-query-variable
