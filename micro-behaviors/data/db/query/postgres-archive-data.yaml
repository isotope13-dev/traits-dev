defaults:
  platforms: [unix, windows]
  for: [python, powershell, text]
  crit: notable
traits:
  - id: large-object-archive-command-data
    desc: Large object contains archive_command setting
    conf: 0.98
    if:
      type: text
      regex: '(?is)\blo_from_bytea\s*\([^;]{0,180}\barchive_command\s*=\s*'''
  - id: auto-conf-oid-call
    desc: SQL OID call targets postgresql.auto.conf
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bSELECT\s+\w+\s*\(\s*\d+\s*,\s*''postgresql\.auto\.conf''\s*\)'
