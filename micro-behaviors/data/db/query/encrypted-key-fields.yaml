# Key selection is also ordinary application secret-store access.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: select-encrypted-key-field
    desc: SELECT expression references encrypted key
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '(?i)\bSELECT\b.{0,160}\bencrypted[_ -]?key\b'
