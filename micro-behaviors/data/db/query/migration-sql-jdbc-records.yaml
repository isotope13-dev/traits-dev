defaults:
  platforms:
  - unix
  - windows
  for:
  - data
  - text
  - json
traits:
- id: values-cast-or-row-expression
  desc: SQL VALUES begins CAST or ROW
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: \bVALUES\s+(CAST|ROW)\b
composite_rules:
- id: lookup-error-sql-expression
  desc: SQL expression beside database lookup error
  crit: notable
  conf: 0.98
  near_lines: 1
  all:
  - id: metadata/lang/natural/diagnostic::identifier-lookup-database-error
  - id: micro-behaviors/data/db/query::values-cast-or-row-expression
- id: jdbc-driver-and-lookup-errors
  desc: JDBC driver and database lookup error context
  crit: notable
  conf: 0.98
  near_lines: 12
  all:
  - id: micro-behaviors/data/db/config::sentinel-jdbc-driver-error
  - id: micro-behaviors/data/db/query::lookup-error-sql-expression
