defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - powershell
  - python
  - shell
  - go
  - csharp
  - text
  - data
traits:
- id: recipient-domain-filter-text
  desc: Recipient-domain filter text
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (?is)\bRecipientDomain\b.{0,320}(!=|!in|has_any|!contains)\s*['"(]
- id: attachment-array-expansion-text
  desc: Attachment array expansion query text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?im)^\s*\|\s*mv-expand\s+Attachments\b
- id: sha256-join-text
  desc: SHA256 join query text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)\bjoin\b[^b\n]{0,260}\bon\s+SHA256\b
