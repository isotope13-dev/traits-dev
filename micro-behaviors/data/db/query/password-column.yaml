---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 1.0
traits:
- id: user-pass-column-character-query
  desc: SQL probes a user_pass character code
  if:
    type: text
    regex: "(?i)ASCII\\s*\\(\\s*SUBSTRING\\s*\\(\\s*user_pass\\b"
composite_rules:
- id: password-column-query
  desc: SQL query references a password column
  any:
  - id: micro-behaviors/data/db/read::password-column-select
  - id: micro-behaviors/data/db/query::user-pass-column-character-query
