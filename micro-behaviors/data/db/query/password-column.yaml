# Column references are capabilities, not evidence of unauthorized extraction.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 1.0
traits:
  - id: password-column-select
    desc: SELECT references a password column
    if:
      type: text
      regex: '(?is)SELECT.{0,160}\b(\w*password|user_pass(wd)?)\b.{0,160}FROM'
  - id: user-pass-column-character-query
    desc: SQL probes a user_pass character code
    if:
      type: text
      regex: '(?i)ASCII\s*\(\s*SUBSTRING\s*\(\s*user_pass\b'
composite_rules:
  - id: password-column-query
    desc: SQL query references a password column
    any:
      - id: password-column-select
      - id: user-pass-column-character-query
