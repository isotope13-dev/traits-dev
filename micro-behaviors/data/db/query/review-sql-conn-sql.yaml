# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: sql-prepare-statement
  desc: SQL PREPARE statement declaration
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - text
  if:
    type: text
    regex: "\\bPREPARE\\s+\\w+\\s+FROM\\b"
    case_insensitive: true
- id: sql-execute-named-statement
  desc: SQL EXECUTE named statement
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - text
  if:
    type: text
    regex: "(^|[;\\n])\\s*EXECUTE\\s+\\w+\\s*;"
    case_insensitive: true
composite_rules:
- id: sql-prepared-statement-execution
  desc: SQL prepared statement execution
  crit: notable
  conf: 0.92
  for:
  - scripts
  - binaries
  - text
  all:
  - id: micro-behaviors/data/db/query::sql-prepare-statement
  - id: micro-behaviors/data/db/query::sql-execute-named-statement
