# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  for:
  - scripts
  - source
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: gsql-file-content-query-parameters
  desc: GSQL query takes file and string parameters
  conf: 0.98
  if:
    type: string_literal
    regex: (?i)^CREATE\s+(OR\s+REPLACE\s+)?QUERY\s+[^(){]{1,100}\(\s*FILE\s+\w+\s*,\s*STRING\s+\w+
