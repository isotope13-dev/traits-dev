defaults:
  platforms: [windows]
  for: [text, scripts, source]
  crit: notable

traits:
  - id: sqlserver-dynamic-exec-variable
    desc: Executes dynamic T-SQL variable string
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?im)(^|[\s;])exec(ute)?\s*\(\s*@\w+\s*\)'

  - id: sqlserver-dynamic-exec-sql-string
    desc: Executes dynamic T-SQL query string
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      regex: '(?im)(^|[\s;])exec(ute)?\s*\([^\r\n)]{1,16}(SELECT|USE|ALTER|CREATE)\b'
