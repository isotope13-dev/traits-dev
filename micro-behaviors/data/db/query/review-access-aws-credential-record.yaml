# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.92
traits:
- id: credential-record-join
  desc: SQL joins credential record aliases
  if:
    type: text
    regex: "(?is)\\bJOIN\\s+\\w*(credential|secret|token)\\w*\\s+AS\\s+\\w+.{0,180}\\bON\\b"
- id: aws-access-key-kind-predicate
  desc: SQL filters AWS access-key record type
  if:
    type: text
    regex: key_kind\s*=\s*["']aws_access_key_id["']
- id: aws-secret-key-kind-predicate
  desc: SQL filters AWS secret-key record type
  if:
    type: text
    regex: key_kind\s*=\s*["']aws_secret_access_key["']
