# PHP's current call projection loses member names on $object->method().
# The syntax tree retains the method and its SQL argument, so bind them there.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: php-litellm-credentials-query
    desc: PHP queries LiteLLM credentials table
    if:
      type: tree-sitter
      language: php
      query: |
        ((member_call_expression
          name: (name) @method
          arguments: (arguments . (argument
            [(string) (encapsed_string)] @sql)))
          (#match? @method "(?i)^(query|execute(query)?)$")
          (#match? @sql "(?i)^[\"']SELECT[ \\t]+[^();]{1,160}FROM")
          (#match? @sql "(?i)FROM.{0,6}LiteLLM_CredentialsTable\\b"))
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source

  - id: php-litellm-models-query
    desc: PHP queries LiteLLM models table
    if:
      type: tree-sitter
      language: php
      query: |
        ((member_call_expression
          name: (name) @method
          arguments: (arguments . (argument
            [(string) (encapsed_string)] @sql)))
          (#match? @method "(?i)^(query|execute(query)?)$")
          (#match? @sql "(?i)^[\"']SELECT[ \\t]+[^();]{1,160}FROM")
          (#match? @sql "(?i)FROM.{0,6}LiteLLM_ProxyModelTable\\b"))
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
