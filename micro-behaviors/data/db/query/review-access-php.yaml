# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
traits:
- id: wordpress-wpdb-prepare
  desc: Prepares a WordPress database query
  conf: 0.97
  if:
    type: text
    regex: "\\$wpdb\\s*->\\s*prepare\\s*\\("
