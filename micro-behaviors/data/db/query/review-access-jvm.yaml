# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - android
  for:
  - java
  - kotlin
traits:
- id: jvm-query-method-call
  desc: JVM database query call
  conf: 0.94
  if:
    type: text
    regex: "\\b(db|database|sqlite|contentResolver|resolver)\\s*\\.query\\s*\\("
