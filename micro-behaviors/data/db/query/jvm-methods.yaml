defaults:
  platforms: [windows]
  for: [class]
  crit: notable
traits:
  - id: jvm-jdbc-statement-query-reference
    desc: JVM imports JDBC statement query method
    conf: 0.96
    if:
      type: import
      exact: java/sql/Statement.executeQuery
  - id: jvm-jdbc-byte-column-reference
    desc: JVM imports JDBC binary column reader
    conf: 0.96
    platforms: [windows, unix]
    if:
      type: import
      exact: java/sql/ResultSet.getBytes
