defaults:
  platforms: [android, unix, windows]
  for: [java, javascript, typescript, python]
  crit: notable
  conf: 0.98

traits:
  - id: string-field-sql-query
    desc: Executes SQL read from a string field
    if:
      type: symbol
      kind: call
      regex: '(^|\.)queryFinalized$'
      arg:
        index: 0
        from:
          call: '(^|\.)getString$'
          literal: '^sql$'

  # Kotlin call-target/flow projections are incomplete in the current engine.
  # Observe the API syntax without asserting the SQL argument's provenance.
  - id: kotlin-query-finalized-call
    desc: Kotlin SQLite queryFinalized call syntax
    for: [kotlin]
    if:
      type: text
      regex: '\.queryFinalized\s*\('
