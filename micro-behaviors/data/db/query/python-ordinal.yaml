defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-sql-character-slice-template
    desc: SQL substring expression template
    conf: 0.95
    if:
      type: literal
      exclude_docstrings: true
      regex: '(?i)\bSUBSTR(ING)?\s*\([^\n]{0,160}\{\w+\}'

  - id: python-sql-ordinal-expression-template
    desc: SQL character ordinal expression template
    conf: 0.95
    if:
      type: literal
      exclude_docstrings: true
      regex: '(?i)\b(ASCII|ORD|UNICODE)\s*\(\s*(\{\w+\}|SUBSTR(ING)?\s*\()'

composite_rules:
  # Co-located templates and a real comparison call support this observation;
  # injection and any particular oracle remain claims of their consumers.
  - id: python-ordinal-character-comparison-templates
    desc: SQL character ordinal and comparison templates
    conf: 0.95
    near_bytes: 2400
    all:
      - id: python-sql-character-slice-template
      - id: python-sql-ordinal-expression-template
      - id: metadata/lang/source/syntax/call/member::python-interpolated-comparison-call
