# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: python-sql-f-string
  desc: Builds SQL with Python f-string interpolation
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: \bf["']\s*(SELECT.{0,59}FROM|INSERT\s+INTO|UPDATE.{0,59}\bSET|DELETE\s+FROM).{0,80}\{\w+\}
    case_insensitive: true
- id: sql-keyword-table
  desc: SQL_BIG_RESULT query option reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: SQL_BIG_RESULT
  unless:
  - id: metadata/build/scaffold::antlr-generated-parser
composite_rules:
- id: sql-keywords
  desc: Contains several SQL statement types
  crit: notable
  conf: 0.5
  needs: 3
  any:
  - id: micro-behaviors/data/db/read/records::sql-select
  - id: micro-behaviors/data/db/write::sql-insert
  - id: micro-behaviors/data/db/write::sql-update
  - id: micro-behaviors/data/db/delete::sql-delete
  - id: micro-behaviors/data/db/schema/relational::sql-create-table
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sql-generic
  desc: SQL interface or statement evidence
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/data/db/query::sql-keywords
  - id: metadata/import/go/database/sql
  - id: micro-behaviors/data/db/open::sql-open
  - id: metadata/package/dependencies/storage::sqlparser-rust-crate
  - id: micro-behaviors/data/db/query::sql-keyword-table
  unless:
  - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
