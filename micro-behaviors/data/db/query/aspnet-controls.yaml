defaults:
  platforms: [windows]
  for: [asp]
  crit: notable

traits:
  # ASP files currently have no call/flow projections. Match the direct
  # constructor argument and describe that evidence without inferring theft,
  # OS execution, or unauthorized database access.
  - id: aspnet-sql-command-from-control-text
    desc: SqlCommand receives server control text directly
    conf: 0.97
    if:
      type: text
      regex: '\bnew\s+SqlCommand\s*\(\s*[A-Za-z_]\w*\.Text\s*,'
      exclude_html_comments: true
