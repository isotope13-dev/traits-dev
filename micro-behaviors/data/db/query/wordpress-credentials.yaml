defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: python-prefixed-users-table-assignment
    desc: Assigns a prefixed users table name
    crit: notable
    conf: 0.96
    if:
      type: text
      # Require an assignment to a table-named variable. A route such as
      # f"{BASE_URL}users/{login}" is not evidence of a SQL table name.
      regex: '(?i)\b\w*table\s*=\s*f["''].{0,50}\{[A-Za-z_][\w.]*\}users\b'

  - id: wordpress-password-hash-column-reference
    desc: WordPress password-hash column SQL reference
    crit: notable
    if:
      type: text
      # Match the standalone WordPress column spelling. An underscore is a
      # word character, so this excludes unrelated identifiers such as
      # UM_USER_PASSWORD in JDBC user-store code.
      regex: '(?is)SELECT.{0,160}\buser_pass\b.{0,160}\bFROM\b|ASCII\s*\(\s*SUBSTRING\s*\(\s*user_pass\b'

