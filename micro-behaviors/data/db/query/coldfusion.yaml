defaults:
  platforms: [unix, windows]
  for: [cfml]
traits:
  # The whole query body is a form field. Parameterized business queries that
  # merely interpolate a form value into fixed SQL are a different observation.
  - id: cfml-raw-form-query
    desc: CFQUERY executes a complete form-supplied query
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)<cfquery\b[^>]{0,200}>\s*#form\.\w+#\s*</cfquery\s*>'
      exclude_html_comments: true
