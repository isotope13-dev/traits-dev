defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable

traits:
  - id: storage-prototype-method-replacement
    desc: Replaces browser Storage mutation methods
    # The receiver must alias Storage.prototype; arbitrary objects called
    # proto and ordinary storage writes do not establish a global hook.
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @alias
              value: (member_expression
                object: (identifier) @storage
                property: (property_identifier) @prototype)))
          (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @method)
              right: (function_expression) @replacement))
          (#eq? @storage "Storage")
          (#eq? @prototype "prototype")
          (#eq? @alias @receiver)
          (#match? @method "^(setItem|removeItem|clear)$"))
