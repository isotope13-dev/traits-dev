# SQL is also embedded in drivers and compiled clients. These observations
# describe PostgreSQL syntax, independently of the client language or host OS.
defaults:
  for: [scripts, source, text, elf, macho, pe]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: grant-all-data-roles
    desc: Grants cluster-wide PostgreSQL data roles
    if:
      type: text
      regex: '(?i)\bGRANT\s+pg_(read|write)_all_data\b'
  - id: cron-job-update
    desc: Directly updates pg_cron job table
    if:
      type: text
      regex: '(?i)\bUPDATE\s+"?cron"?\s*\.\s*"?job"?\s+SET\b'
  - id: postgres-job-username
    desc: Assigns postgres as job username
    if:
      type: text
      regex: '(?i)\busername"?\s*=\s*''postgres'''
  - id: security-definer
    desc: PostgreSQL function uses owner privileges
    if:
      type: text
      regex: '(?i)\bSECURITY\s+DEFINER\b'
  - id: return-query-execute
    desc: Returns results from dynamic SQL
    if:
      type: text
      regex: '(?i)\bRETURN\s+QUERY\s+EXECUTE\s+[a-z_][a-z_0-9]*\s*;'
  - id: definer-dynamic-query
    desc: Definer function returns dynamic SQL results
    crit: suspicious
    if:
      type: text
      regex: '(?is)SECURITY\s+DEFINER[^;]{0,240}RETURN\s+QUERY\s+EXECUTE\s+\w+\s*;'
  - id: grant-function-execute
    desc: Grants execution of stored function
    if:
      type: text
      regex: '(?i)\bGRANT\s+EXECUTE\s+ON\s+FUNCTION\b'
  - id: internal-language
    desc: Binds PostgreSQL internal function language
    if:
      type: text
      regex: '(?i)\bLANGUAGE\s+''?internal''?\b'
  - id: read-file-symbol-binding
    desc: Aliases PostgreSQL file-read entry point
    if:
      type: text
      regex: '(?i)\bAS\s+''pg_read_file'''
  - id: export-object-symbol-binding
    desc: Aliases PostgreSQL object-export entry point
    if:
      type: text
      regex: '(?i)\bAS\s+''lo_export'''
  - id: large-object-from-bytea
    desc: Stages bytes as PostgreSQL large object
    if:
      type: text
      regex: '(?i)\blo_from_bytea\s*\('
  - id: auto-conf-output-argument
    desc: PostgreSQL auto-config as output argument
    if:
      type: text
      regex: '\(\s*\d+\s*,\s*''[^''\r\n]{0,160}postgresql\.auto\.conf''\s*\)'
  - id: archive-command-assignment
    desc: Configures PostgreSQL archiver shell command
    if:
      type: text
      regex: '(?i)\barchive_command\s*=\s*''[^''\r\n]{1,240}'''
composite_rules:
  - id: internal-file-primitives
    desc: Rebinds internal PostgreSQL file-access primitives
    crit: suspicious
    near_bytes: 192
    all:
      - id: micro-behaviors/data/db/postgresql::internal-language
    any:
      - id: micro-behaviors/data/db/postgresql::read-file-symbol-binding
      - id: micro-behaviors/data/db/postgresql::export-object-symbol-binding
