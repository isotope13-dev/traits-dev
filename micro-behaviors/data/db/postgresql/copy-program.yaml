defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: copy-query-source
    desc: PostgreSQL COPY query source
    crit: component
    conf: 0.99
    if:
      type: text
      # COPY accepts every data-returning query form here, not only SELECT.
      # WITH covers CTE-prefixed variants whose terminal statement is one of
      # the same query forms.
      regex: '(?i)\bCOPY\s*\(\s*(SELECT|VALUES|INSERT|UPDATE|DELETE|MERGE|WITH)\b'

  - id: copy-table-source
    desc: PostgreSQL COPY table source
    crit: component
    conf: 0.99
    if:
      type: text
      # The next byte must continue a schema qualification, whitespace before
      # TO/FROM, or an optional column list. Quoted identifiers cannot span
      # lines. The destination atom below validates the target's closing edge.
      regex: '(?i)\bCOPY\s+("[^"\r\n]{1,128}"|[A-Za-z_][A-Za-z0-9_$]*)[.\s(]'

  - id: program-quoted-command-destination
    desc: PostgreSQL PROGRAM quoted command destination
    crit: suspicious
    conf: 0.99
    attack: T1059
    if:
      type: text
      # A valid COPY source ends in an identifier or closing parenthesis.
      # Require the opening command-string delimiter after PROGRAM.
      regex: '(?i)([A-Za-z0-9_$"]|\))\s+TO\s+PROGRAM\s+(E\s*)?["'']'

  - id: program-dollar-command-destination
    desc: PostgreSQL dollar-quoted PROGRAM command
    crit: suspicious
    conf: 0.99
    attack: T1059
    if:
      type: text
      # PostgreSQL also accepts an empty or identifier-style dollar tag.
      regex: '(?i)[\w$")]\s+TO\s+PROGRAM\s+\$([A-Za-z_]\w*)?\$'

composite_rules:
  - id: copy-source
    desc: PostgreSQL COPY statement source
    crit: component
    conf: 0.99
    any:
      - id: copy-query-source
      - id: copy-table-source

  - id: copy-to-program
    desc: PostgreSQL COPY invokes OS command
    crit: suspicious
    conf: 0.99
    attack: T1059
    near_bytes: 512
    all:
      - id: copy-source
    any:
      - id: program-quoted-command-destination
      - id: program-dollar-command-destination
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/payload-corpus/
      - id: well-known/lib/data/psql-js::psql-implementation-path
      - id: well-known/lib/data/psql-js::psql-sql-help-table
      - id: well-known/tool/detection/agent-audit-kit::scanner-context
      - id: well-known/tool/offensive/bingo/
      - id: well-known/tool/offensive/mcpsec/
      - id: metadata/package/testing/harness/unit::rust-test
