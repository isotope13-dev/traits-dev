defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: copy-query-source
    desc: PostgreSQL COPY query source
    crit: component
    conf: 0.99
    if:
      type: text
      # COPY accepts every data-returning query form here, not only SELECT.
      # WITH covers CTE-prefixed variants whose terminal statement is one of
      # the same query forms.
      regex: '(?i)\bCOPY\s*\(\s*(SELECT|VALUES|INSERT|UPDATE|DELETE|MERGE|WITH)\b'

  - id: copy-table-source
    desc: PostgreSQL COPY table source
    crit: component
    conf: 0.99
    if:
      type: text
      # Require the direction and a SQL source/destination, not prose such as
      # "Copy fileset todir..." in a Groovy snippet description. Support quoted
      # and schema-qualified identifiers, optional column lists, SQL strings,
      # PROGRAM and the direction-appropriate client stream.
      # Exact reviewed grammar exception in Cleave parsing.rs: splitting this
      # match by proximity could join different COPY statements.
      regex: '\bCOPY\s+(BINARY\s+)?("|[A-Za-z_])[^;]{0,120}?\bTO\s+PROGRAM\b'

  - id: program-quoted-command-destination
    desc: PostgreSQL PROGRAM quoted command destination
    crit: notable
    conf: 0.99
    attack: T1059
    if:
      type: text
      # The bare "TO PROGRAM '<cmd>'" fragment also matches English prose
      # ("will likely lead to program "hangs..." in an error string), so
      # require the statement to open with COPY within the same match: a
      # valid COPY source precedes TO, and no statement boundary may
      # intervene (trl vllm_serve.py triage).
      regex: '(?i)\bCOPY\b[^;]{0,120}?\bTO\s+PROGRAM\s+(E\s*)?["'']'
    unless:
      - id: metadata/package/testing/harness/unit/

  - id: program-dollar-command-destination
    desc: PostgreSQL dollar-quoted PROGRAM command
    crit: notable
    conf: 0.99
    attack: T1059
    if:
      type: text
      # PostgreSQL also accepts an empty or identifier-style dollar tag.
      regex: '(?i)[\w$")]\s+TO\s+PROGRAM\s+\$([A-Za-z_]\w*)?\$'
    unless:
      - id: metadata/package/testing/harness/unit/

composite_rules:
  - id: copy-source
    desc: PostgreSQL COPY statement source
    crit: component
    conf: 0.99
    any:
      - id: copy-query-source
      - id: copy-table-source

  - id: copy-to-program
    desc: PostgreSQL COPY invokes OS command
    crit: notable
    conf: 0.99
    attack: T1059
    near_bytes: 512
    all:
    - id: copy-source
    any:
    - id: program-quoted-command-destination
    - id: program-dollar-command-destination
    unless:
    - id: well-known/tool/offensive/pentestkit/
    - id: well-known/tool/offensive/payload-corpus/
    - id: well-known/lib/data/psql-js::psql-implementation-path
    - id: well-known/lib/data/psql-js::psql-sql-help-table
    - id: well-known/tool/detection/agent-audit-kit::scanner-context
    - id: well-known/tool/offensive/bingo/
    - id: well-known/tool/offensive/mcpsec/
    - id: metadata/package/testing/harness/unit/
    - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
