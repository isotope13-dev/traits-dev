# Field declarations on Python ORM model classes (Peewee, Django-style).
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-model-domain-field
    desc: ORM model declares a Domain field
    conf: 0.7
    if:
      type: text
      # Anchored declaration: `Domain = CharField(`, not GDAL's
      # `ODsCAddFieldDomain = _ogr.ODsCAddFieldDomain`.
      regex: '(?m)^\s*Domain\s*=\s*[A-Za-z_][\w.]*Field\s*\('
  - id: python-model-command-field
    desc: ORM model declares a command field
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*command\s*=\s*[A-Za-z_][\w.]*Field\s*\('
