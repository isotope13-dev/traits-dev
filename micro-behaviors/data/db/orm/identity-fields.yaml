defaults:
  platforms: [windows, unix]
  crit: component
  conf: 0.7
  for: [javascript, php, python, java, csharp]
traits:
- id: username-field-peewee
  crit: notable
  desc: Username ORM field declaration
  if:
    type: text
    regex: '(?m)^\s*Username\s*=\s*[A-Za-z_]\w*Field\s*\('
- id: computer-field-peewee
  crit: notable
  desc: Computer ORM field declaration
  if:
    type: text
    regex: 'Computer\s*=.{0,50}Field'
- id: windows-field-peewee
  crit: notable
  desc: Windows ORM field declaration
  if:
    type: text
    regex: 'Windows\s*=.{0,50}Field'
  # === Database initialization patterns ===
