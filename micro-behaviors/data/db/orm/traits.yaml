defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: gorm-io
    desc: gorm.io ORM
    conf: 0.85
    if:
      type: text
      substr: gorm.io
  - id: sqlalchemy
    desc: SQLAlchemy ORM
    conf: 0.85
    for: [python]
    if:
      type: import
      regex: '^sqlalchemy(\.|$)'
  - id: reydb-orm-import
    desc: Imports the reydb Python database ORM
    conf: 0.9
    for: [python]
    if:
      type: import
      exact: reydb
  - id: hibernate
    desc: Hibernate ORM
    conf: 0.85
    if:
      type: text
      regex: (?i)org\.hibernate|hibernate\.(cfg|hbm|Session)
  - id: django-db
    desc: django.db ORM
    conf: 0.85
    for: [python]
    if:
      type: import
      regex: '^django\.db(\.|$)'
  - id: sequelize
    desc: Imports Sequelize ORM
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: import
      regex: '^sequelize(/|$)'
  - id: prisma
    desc: Prisma ORM
    conf: 0.85
    for: [source, package.json]
    count_min: 2
    if:
      type: text
      word: prisma
  - id: typeorm
    desc: Imports TypeORM ORM
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: import
      regex: '^typeorm(/|$)'
  - id: has-database-import-1
    desc: Imports JavaScript database library
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: require\(['"](mongoose|sequelize|knex)['"]\)
  - id: has-database-import-2
    desc: Imports JavaScript database client
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: require\(['"](pg|mysql|mongodb)['"]\)
  - id: has-database-usage
    desc: Calls Prisma database API
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: symbol
      regex: '(^|\.)prisma\.|^\$queryRaw$'
composite_rules:
  - id: orm
    desc: ORM framework usage
    conf: 0.85
    any:
      - id: gorm-io
      - id: sqlalchemy
      - id: hibernate
      - id: django-db
      - id: sequelize
      - id: typeorm
  - id: has-database-import
    desc: Imports JavaScript database libraries
    conf: 0.8
    any:
      - id: has-database-import-1
      - id: has-database-import-2
  - id: has-database
    for: [javascript]
    desc: JavaScript code interacts with database
    conf: 0.8
    all:
      - id: has-database-import
      - id: has-database-usage
