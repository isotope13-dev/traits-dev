defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: wordpress-wpdb-prepare
    desc: Prepares a WordPress database query
    conf: 0.97
    if:
      type: text
      regex: '\$wpdb\s*->\s*prepare\s*\('
  - id: php-update-option
    desc: Writes a WordPress option (update_option)
    if:
      type: symbol
      exact: "update_option"
  - id: php-get-option
    desc: Reads a WordPress option (get_option)
    if:
      type: symbol
      exact: "get_option"
  - id: php-add-option
    desc: Creates a WordPress option (add_option)
    if:
      type: symbol
      exact: "add_option"
  - id: php-get-post-meta
    desc: Reads WordPress post metadata
    if:
      type: symbol
      kind: call
      exact: get_post_meta
  - id: php-update-post-meta
    desc: Writes WordPress post metadata
    if:
      type: symbol
      kind: call
      exact: update_post_meta
  - id: php-insert-post
    desc: Creates a WordPress post
    if:
      type: symbol
      kind: call
      exact: wp_insert_post
  # A conventional user-defined persistence method name, not an API: MVC
  # controllers and models across ordinary PHP applications define `save_db()`
  # (WordPress plugins in particular). The name alone establishes nothing about
  # behavior, hence component. It was previously
  # `communications/http/request/params::php-shell-fleet-save-db` ("PHP shell
  # fleet database save call") — a directory with no request parameter in the
  # matcher and a name asserting a webshell panel, which reported a shell fleet
  # in every plugin with a save routine. The webshell composite in
  # command-and-control/backdoor/webshell/exec supplies that intent by pairing
  # it with the fleet validity check and request input.
  - id: php-save-db-function-call
    desc: Calls a function named save_db()
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bsave_db\s*\('
