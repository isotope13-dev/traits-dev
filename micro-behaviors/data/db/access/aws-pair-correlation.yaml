defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: aws-credential-record-pair-correlation
    desc: SQL correlates stored AWS credential records by source
    crit: notable
    conf: 0.97
    near_lines: 24
    all:
      - id: micro-behaviors/data/db/access::aws-credential-pair-select-projection
      - id: micro-behaviors/data/db/access::credential-record-join
      - id: micro-behaviors/data/db/access::aws-access-key-kind-predicate
      - id: micro-behaviors/data/db/access::aws-secret-key-kind-predicate
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/threat-intel/
