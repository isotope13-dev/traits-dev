defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.94

traits:
  # The getter accesses an SDK instance; it does not establish network I/O.
  - id: android-firebase-database-instance
    desc: Accesses the Firebase database SDK instance
    if:
      type: text
      regex: '\bFirebaseDatabase\s*\.\s*getInstance\s*\('

  # A bounded source sequence, not a data-flow binding between receivers.
  - id: android-firebase-set-value-sequence
    desc: Firebase SDK access followed by setValue
    if:
      type: text
      regex: '\bFirebaseDatabase\s*\.getInstance\([\s\S]{0,500}\.setValue\s*\('

  - id: android-firebase-value-listener
    desc: Registers a Firebase database value listener
    if:
      type: text
      regex: '\bFirebaseDatabase\s*\.getInstance\([^;\n]{0,180}\.addValueEventListener\('
