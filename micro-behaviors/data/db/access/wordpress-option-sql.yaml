defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
traits:
  - id: wordpress-option-value-select
    desc: SQL SELECT of WordPress option_value
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bSELECT\s+`?option_value`?\s+FROM\s+'

composite_rules:
  - id: php-direct-option-value-query
    desc: MySQLi query beside an option_value SELECT literal
    for: [php]
    conf: 0.95
    near_bytes: 300
    all:
      - id: wordpress-option-value-select
      - id: micro-behaviors/data/db/mysql::php-mysqli-query
