defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]

composite_rules:
  - id: wsus-susdb-sql-session
    for: [source, '!objectivec', batch, javascript, lua, perl, php, powershell, python, ruby, vbs]
    desc: SQL client and WSUS SUSDB references
    crit: suspicious
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/data/db/access::sqlserver-cli-client
      - id: micro-behaviors/data/db/schema/relational::wsus-susdb-reference
