---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - pe
  - csharp
  - asp
traits:
- id: sql-connection-class
  desc: SqlConnection class
  conf: 0.7
  if:
    type: text
    substr: SqlConnection
- id: db-connection-class
  desc: DbConnection class
  conf: 0.7
  if:
    type: text
    substr: DbConnection
- id: oledb-connection-class
  desc: OleDbConnection class
  conf: 0.7
  if:
    type: text
    substr: OleDbConnection
- id: odbc-connection-class
  desc: OdbcConnection class
  conf: 0.7
  if:
    type: text
    substr: OdbcConnection
- id: sql-command-class
  desc: SqlCommand class
  conf: 0.7
  if:
    type: text
    substr: SqlCommand
- id: db-command-class
  desc: DbCommand class
  conf: 0.7
  if:
    type: text
    substr: DbCommand
- id: connection-string-singular
  desc: ConnectionString property
  conf: 0.7
  if:
    type: text
    substr: ConnectionString
- id: connection-strings-plural
  desc: ConnectionStrings property
  conf: 0.7
  if:
    type: text
    substr: ConnectionStrings
- id: sql-parameter-class
  desc: SqlParameter class
  conf: 0.6
  if:
    type: text
    substr: SqlParameter
- id: db-parameter-class
  desc: DbParameter class
  conf: 0.6
  if:
    type: text
    substr: DbParameter
- id: add-with-value
  desc: AddWithValue method
  conf: 0.6
  if:
    type: text
    substr: AddWithValue
- id: sql-data-adapter-class
  desc: SqlDataAdapter class
  conf: 0.6
  if:
    type: text
    substr: SqlDataAdapter
- id: data-adapter-class
  desc: DataAdapter class
  conf: 0.6
  if:
    type: text
    substr: DataAdapter
composite_rules:
- id: sql-connection
  desc: SQL database connection capability
  conf: 0.85
  any:
  - id: micro-behaviors/data/db/access::sql-connection-class
  - id: micro-behaviors/data/db/access::db-connection-class
  - id: micro-behaviors/data/db/access::oledb-connection-class
  - id: micro-behaviors/data/db/access::odbc-connection-class
- id: connection-string
  desc: Database connection string handling
  conf: 0.8
  any:
  - id: micro-behaviors/data/db/access::connection-string-singular
  - id: micro-behaviors/data/db/access::connection-strings-plural
- id: sql-parameter
  desc: Parameterized SQL queries (good practice)
  conf: 0.75
  any:
  - id: micro-behaviors/data/db/access::sql-parameter-class
  - id: micro-behaviors/data/db/access::db-parameter-class
  - id: micro-behaviors/data/db/access::add-with-value
- id: data-adapter
  desc: ADO.NET data adapter usage
  conf: 0.75
  any:
  - id: micro-behaviors/data/db/access::sql-data-adapter-class
  - id: micro-behaviors/data/db/access::data-adapter-class
