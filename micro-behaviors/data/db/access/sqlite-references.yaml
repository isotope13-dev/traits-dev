defaults:
  platforms: [unix, windows, android]
  for: [binaries, scripts, source]

# Preserve consumers of the former SQLite directory population, including the
# embedded format-header reference now classified as artifact metadata.
composite_rules:
  - id: sqlite-api-or-format-reference
    desc: SQLite API or embedded format-header references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/db/sqlite
      - id: metadata/binary/layout/embedded::sqlite-format-header-reference
