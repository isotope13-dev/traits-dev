# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - text
  crit: notable
  conf: 0.97
traits:
- id: local-store-snapshot-field
  desc: Snapshot field copies whole localStorage
  if:
    type: text
    regex: '["'']?localStorage["'']?\s*:\s*(\{\s*\.\.\.|[\w$.\[\]"'']{1,40}\(\s*)localStorage\b'
- id: session-store-snapshot-field
  desc: Snapshot field copies whole sessionStorage
  if:
    type: text
    regex: '["'']?sessionStorage["'']?\s*:\s*(\{\s*\.\.\.|[\w$.\[\]"'']{1,40}\(\s*)sessionStorage\b'
composite_rules:
- id: both-web-stores-in-snapshot-object
  desc: Snapshot fields pass both browser stores
  near_bytes: 512
  all:
  - id: micro-behaviors/data/db/access::local-store-snapshot-field
  - id: micro-behaviors/data/db/access::session-store-snapshot-field
