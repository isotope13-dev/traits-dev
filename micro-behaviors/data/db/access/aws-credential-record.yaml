# Query mechanics used to access and correlate separately stored credential
# records. The harvested-store objective adds attacker intent when all four
# occur in one bounded query.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: aws-credential-pair-select-projection
    desc: SQL selects AWS access and secret fields
    if:
      type: text
      regex: '(?is)\bSELECT\b.{0,240}\baccess_key_id\b.{0,160}\bsecret_access_key\b'

  - id: credential-record-join
    desc: SQL joins credential record aliases
    if:
      type: text
      regex: '(?is)\bJOIN\s+\w*(credential|secret|token)\w*\s+AS\s+\w+.{0,180}\bON\b'

  - id: aws-access-key-kind-predicate
    desc: SQL filters AWS access-key record type
    if:
      type: text
      regex: 'key_kind\s*=\s*["'']aws_access_key_id["'']'

  - id: aws-secret-key-kind-predicate
    desc: SQL filters AWS secret-key record type
    if:
      type: text
      regex: 'key_kind\s*=\s*["'']aws_secret_access_key["'']'
