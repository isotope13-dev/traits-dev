defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.9
traits:
- id: open-database-member-call-reference
  desc: OpenDatabase member-call syntax reference
  if:
    type: text
    regex: (?i)\.OpenDatabase\s*\(
- id: open-database-numeric-argument-fragment
  desc: OpenDatabase plus 1/3 argument fragment
  if:
    type: text
    regex: (?i)\.OpenDatabase\s*\(?\s*[^,\n]{1,60},\s*[13]\b
