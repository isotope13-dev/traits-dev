defaults:
  crit: notable
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: jvm-cursor-next-record-call
    desc: JVM cursor advances to the next record
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: moveToNext

  - id: jvm-query-method-call
    desc: JVM database query call
    conf: 0.94
    if:
      type: text
      regex: '\b(db|database|sqlite|contentResolver|resolver)\s*\.query\s*\('
