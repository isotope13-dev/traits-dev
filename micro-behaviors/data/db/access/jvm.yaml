defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: jvm-query-method-call
    desc: JVM query method identifier
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: query

  - id: jvm-cursor-next-record-call
    desc: JVM cursor advances to the next record
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: moveToNext
