---
defaults:
  crit: notable
  platforms:
  - android
  for:
  - java
  - kotlin
traits:
- id: jvm-cursor-next-record-call
  desc: JVM cursor advances to the next record
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: moveToNext
- id: kotlin-cursor-next-record-call
  desc: Kotlin cursor calls moveToNext
  conf: 0.9
  for:
  - kotlin
  if:
    type: text
    regex: '(\.|\?\.)\s*moveToNext\s*\(\s*\)'

composite_rules:
- id: jvm-cursor-move-to-next
  desc: JVM cursor advances via moveToNext
  conf: 0.92
  any:
  - id: jvm-cursor-next-record-call
  - id: kotlin-cursor-next-record-call
