---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: vscode-global-state-access
  desc: Reads or updates VS Code global state
  if:
    type: text
    regex: "\\.globalState\\.(get|update)\\s*\\("
  unless:
  - id: metadata/file/format/source-map::sourcemap
- id: vscode-workspace-state-access
  desc: Accesses VS Code workspace-scoped state
  conf: 0.85
  if:
    type: text
    substr: workspaceState
- id: chrome-storage-api
  desc: References the WebExtension storage API
  crit: baseline
  if:
    type: symbol
    kind: member
    regex: "^(chrome|browser)\\.storage(\\.[A-Za-z_][A-Za-z0-9_]*|$)"
- id: chrome-storage-local
  desc: Uses browser extension local storage
  crit: baseline
  if:
    type: text
    substr: storage.local.
- id: gm-userscript-storage
  desc: Reads or writes userscript GM storage
  if:
    type: symbol
    kind: call
    regex: "^GM_(get|set|delete|list)Value(s)?$"
- id: chrome-storage-session
  desc: Chrome session storage access
  crit: baseline
  if:
    type: text
    substr: storage.session.
- id: chrome-storage-sync
  desc: Chrome synced storage access
  crit: baseline
  if:
    type: text
    substr: storage.sync.
- id: dom-localstorage
  desc: Web Storage localStorage access
  crit: baseline
  if:
    type: text
    regex: "\\b(window\\.)?localStorage\\s*(\\.|\\[)"
- id: localstorage-alias-assignment
  desc: Aliases the browser localStorage object
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\b(LS|storage|store)\\s*=\\s*localStorage\\b"
- id: browser-storage-management-api
  desc: Defines browser storage getter or setter
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: function
    regex: "^browser_storage_(get|set)$"
- id: dom-storage-bracket-accessor
  desc: Web Storage accessed via bracket notation
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: "\\b(localStorage|sessionStorage)\\s*\\["
- id: browser-storage-token-key-local
  desc: Local storage access to token-named key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: localStorage\.(get|set)Item\([^)]{0,120}(access|refresh|auth)[_-]?token
- id: browser-storage-token-key-session
  desc: Session storage access to token-named key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: sessionStorage\.(get|set)Item\([^)]{0,120}(access|refresh|auth)[_-]?token
- id: browser-storage-session-key-local
  desc: Local storage access to session-named key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: localStorage\.(get|set)Item\([^)]{0,120}session([_-]?(token|id))?
- id: browser-storage-session-key-session
  desc: Session storage access to session-named key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: sessionStorage\.(get|set)Item\([^)]{0,120}session([_-]?(token|id))?
- id: dom-sessionstorage
  desc: Web Storage sessionStorage access
  crit: baseline
  if:
    type: text
    regex: "\\b(window\\.)?sessionStorage\\.(get|set|remove)Item\\b|\\bsessionStorage\\["
- id: indexeddb-open
  desc: IndexedDB open call or object reference
  if:
    type: text
    regex: "\\bindexedDB\\.open\\s*\\(|\\bwindow\\.indexedDB\\b"
- id: storage-proxy-command-storage-get
  desc: Repeated storageGet command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: storageGet
- id: storage-proxy-command-storage-set
  desc: Repeated storageSet command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: storageSet
- id: storage-proxy-command-storage-remove
  desc: Repeated storageRemove command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: storageRemove
- id: storage-proxy-command-storage-delete
  desc: Repeated storageDelete command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: storageDelete
- id: storage-proxy-command-set-storage
  desc: Repeated setStorage command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: setStorage
- id: storage-proxy-command-remove-storage
  desc: Repeated removeStorage command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: removeStorage
- id: storage-proxy-command-delete-storage
  desc: Repeated deleteStorage command name
  crit: notable
  conf: 0.86
  count_min: 3
  if:
    type: text
    word: deleteStorage
composite_rules:
- id: vscode-workspace-state-use
  desc: VS Code extension uses workspace-scoped state
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/db/access::vscode-workspace-state-access
  - id: well-known/lib/development/vscode::activate-export
- id: storage-proxy-command-words
  desc: Repeated storage proxy command names
  crit: component
  conf: 0.86
  any:
  - id: micro-behaviors/data/db/access::storage-proxy-command-storage-get
  - id: micro-behaviors/data/db/access::storage-proxy-command-storage-set
  - id: micro-behaviors/data/db/access::storage-proxy-command-storage-remove
  - id: micro-behaviors/data/db/access::storage-proxy-command-storage-delete
  - id: micro-behaviors/data/db/access::storage-proxy-command-set-storage
  - id: micro-behaviors/data/db/access::storage-proxy-command-remove-storage
  - id: micro-behaviors/data/db/access::storage-proxy-command-delete-storage
- id: browser-storage-token-key
  desc: Web storage access to token-named key
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/db/read::browser-storage-token-key-read
  - id: micro-behaviors/data/db/write::browser-storage-token-key-write
  - id: micro-behaviors/data/db/access::browser-storage-token-key-local
  - id: micro-behaviors/data/db/access::browser-storage-token-key-session
- id: browser-storage-session-key
  desc: Web storage access to session-named key
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/db/access::browser-storage-session-key-local
  - id: micro-behaviors/data/db/access::browser-storage-session-key-session
- id: browser-storage-credential-key
  desc: Web storage access to credential-named key
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/db/access::browser-storage-token-key
  - id: micro-behaviors/data/db/read::browser-storage-switch-token-read
  - id: micro-behaviors/data/db/read::jwt-key-read
  - id: micro-behaviors/data/db/write::jwt-key-write
