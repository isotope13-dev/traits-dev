defaults:
  platforms: [windows]
  for: [pe, source]
composite_rules:
- id: firefox-history-query-context
  desc: Firefox history query with SQLite or database-path references
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/data/db/query::firefox-history-sql-query
  any:
  - id: micro-behaviors/data/db/sqlite
  - id: micro-behaviors/fs/path/personal::places-sqlite
  unless:
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/security/itop-vpn::benign-context
  - id: well-known/app/communication/thunderbird::thunderbird-xul-runtime
  - id: well-known/app/browser/mozilla-firefox::firefox-xul-runtime
  - id: well-known/app/browser/nova-browser::nova-browser-context

