# SQL Server command-line clients. Naming one of these says only "this code
# drives MSSQL from a shell" — Microsoft's own `sqlcmd`/`Invoke-Sqlcmd` are
# standard DBA tooling and impacket's `mssqlclient.py` is an ordinary client
# too. The abusive shapes (WSUS SUSDB payload delivery, NTLM relay to MSSQL)
# come from the objective composites that reference this atom.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data]

traits:
  - id: sqlserver-cli-client
    desc: Invokes a SQL Server command-line client
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(mssqlclient(\.py)?|Invoke-Sqlcmd|sqlcmd)\b'

  - id: sqlcmd-text-output
    desc: Writes SQL query results to text file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bsqlcmd(\.exe)?\b[^\r\n]{0,240}\s-o\s+[''"]?[^''"\r\n]{1,200}\.txt\b'
