defaults:
  platforms: [unix, windows]
  for: [cfml]
traits:
  - id: cfml-form-selected-datasource
    desc: CFQUERY selects a form-supplied datasource
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)<cfquery\b[^>]{0,160}\bdatasource\s*=["'']#form\.\w+#'
      exclude_html_comments: true
