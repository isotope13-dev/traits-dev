defaults: {}
traits:
- platforms:
  - windows
  for:
  - go
  - pe
  id: firefox-nss-password-metadata-query
  desc: Queries Firefox NSS password-check metadata
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: SELECT item1, item2 FROM metaData WHERE id = 'password'
    case_insensitive: true
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  id: moz-cookies-sql
  desc: Firefox moz_cookies SQL query
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_cookies
    case_insensitive: true
  unless:
  - id: well-known/app/browser/palemoon/
  - id: well-known/app/system/iobit/
  - id: well-known/app/security/itop-vpn::benign-context
  - id: well-known/dual-use/transfer/aria2::aria2-downloader-context
  - id: well-known/tool/browser::idm-download-manager-context
  - id: well-known/app/communication/thunderbird::thunderbird-xul-runtime
  - id: well-known/app/browser/mozilla-firefox::firefox-xul-runtime
  - id: well-known/tool/media/yt-dlp/
  - id: well-known/lib/development/browser-cookie3/
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  id: moz-formhistory-sql
  desc: Firefox form-history SQL query
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_formhistory
    case_insensitive: true
  unless:
  - id: well-known/app/browser/palemoon/
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/app/security/itop-vpn::benign-context
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  id: firefox-profile-cookie-query
  desc: Firefox profile path and cookie SQL query co-occur
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
  - id: micro-behaviors/data/db/access::moz-cookies-sql
  unless:
  - id: well-known/app/browser/palemoon/
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/tool/browser::idm-download-manager-context
  - id: well-known/tool/media/yt-dlp/
