defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs]
  crit: component
  conf: 0.92

# Legacy Office containers retain VBA identifiers in their raw streams.
# Requiring the DAO open, recordset, and ODBC-mode tokens avoids treating a
# stray API name or an ordinary spreadsheet data label as a database query.
traits:
  - id: dao-open-database-reference
    desc: References the DAO OpenDatabase method
    if:
      type: hex
      pattern: '4F 70 65 6E 44 61 74 61 62 61 73 65'

  - id: dao-open-recordset-reference
    desc: References the DAO OpenRecordset method
    if:
      type: hex
      pattern: '4F 70 65 6E 52 65 63 6F 72 64 53 65 74'

  - id: dao-odbc-mode-reference
    desc: References DAO ODBC database mode
    if:
      type: hex
      pattern: '64 62 55 73 65 4F 44 42 43'

composite_rules:
  - id: vba-dao-odbc-query
    desc: VBA queries an ODBC database through DAO
    crit: notable
    conf: 0.97
    all:
      - id: dao-open-database-reference
      - id: dao-open-recordset-reference
      - id: dao-odbc-mode-reference
