defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs]
  crit: component
  conf: 0.92

# API names can survive in Office streams and script text.
# Names alone do not identify the receiver or establish an executed query.
# The composite records the three required name references together.
traits:
  - id: open-database-name-reference
    crit: notable
    desc: Contains the OpenDatabase method-name bytes
    if:
      type: hex
      pattern: '4F 70 65 6E 44 61 74 61 62 61 73 65'

  - id: open-recordset-name-reference
    crit: notable
    desc: Contains the OpenRecordSet method-name bytes
    if:
      type: hex
      pattern: '4F 70 65 6E 52 65 63 6F 72 64 53 65 74'

  - id: dao-odbc-mode-reference
    crit: notable
    desc: References DAO ODBC database mode
    if:
      type: hex
      pattern: '64 62 55 73 65 4F 44 42 43'

composite_rules:
  - id: dao-odbc-api-name-cooccurrence
    desc: OpenDatabase, OpenRecordSet, and dbUseODBC name references co-occur
    crit: notable
    conf: 0.97
    all:
      - id: "micro-behaviors/data/db/access::open-database-name-reference"
      - id: "micro-behaviors/data/db/access::open-recordset-name-reference"
      - id: dao-odbc-mode-reference
