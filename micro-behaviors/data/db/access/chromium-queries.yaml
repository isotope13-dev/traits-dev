---
defaults:
  for:
  - scripts
  - source
  - binaries
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: chromium-login-password-table
  desc: SQL reads passwords from Chromium login table
  for:
  - scripts
  - source
  - binaries
  - pyc
  if:
    type: text
    regex: "(?is)password_value.{0,160}FROM\\s+(auto)?logins"
composite_rules: []
