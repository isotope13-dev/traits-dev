defaults:
  for:
  - scripts
  - source
  - binaries
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: chromium-credit-card-sql
  desc: Chromium credit-card database query
  conf: 0.95
  if:
    type: text
    regex: SELECT.{0,100}card_number.{0,80}FROM\s+credit_cards
    case_insensitive: true
  unless:
  - id: metadata/package/testing/presence/fixture::php-security-regression-phpunit-context
  - id: metadata/path::firefox-directory-path
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
- id: chromium-login-column-select
  desc: SQL selects Chromium login URL and password
  for: [scripts, source, binaries, pyc]
  if:
    type: text
    regex: '(?is)SELECT.{0,160}(origin|action)_url.{0,160}password_value'
- id: chromium-login-password-table
  desc: SQL reads passwords from Chromium login table
  for: [scripts, source, binaries, pyc]
  if:
    type: text
    regex: '(?is)password_value.{0,160}FROM\s+(auto)?logins'
- id: chromium-encrypted-cookie-sql
  desc: SQL selects encrypted cookie values
  if:
    type: text
    regex: (?is)SELECT.{0,160}encrypted_value.{0,80}FROM\s+cookies\b
- id: chromium-cookie-table-select-sql
  desc: SQLite SELECT against Chromium cookies table
  conf: 0.88
  for:
  - pe
  - dll
  - binaries
  platforms:
  - windows
  if:
    type: text
    regex: (?is)\bSELECT\b.{0,400}\bhost_key\b.{0,400}\bFROM\s+cookies\b
  unless:
  - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context

composite_rules:
- id: chromium-login-sql
  desc: Chromium Login Data SQL query
  conf: 0.95
  for:
  - scripts
  - source
  - binaries
  - pyc
  near_bytes: 600
  all:
  - id: chromium-login-column-select
  - id: chromium-login-password-table
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
  - id: metadata/path::firefox-directory-path
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
