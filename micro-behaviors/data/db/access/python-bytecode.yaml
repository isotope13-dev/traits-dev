# A cookie query, DPAPI reference and GCM reference establish a capability
# cluster. They do not bind decrypted cookie values to an outgoing message.
defaults:
  platforms: [windows]
  for: [pyc]
composite_rules:
  - id: pyc-encrypted-cookie-query-dpapi-gcm
    desc: Cookie query with DPAPI and GCM references
    crit: notable
    conf: 0.95
    all:
      - id: chromium-encrypted-cookie-sql
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/crypto/symmetric/aes/library::python-bytecode-gcm-mode-ref
