defaults:
  platforms: [unix, windows]
  for: [jsp, java]
  crit: notable
  conf: 0.98

traits:
  - id: jdbc-driver-manager-connect-source
    desc: JDBC connection through DriverManager
    if:
      type: text
      regex: '\bDriverManager\.getConnection\s*\('
  - id: oracle-jdbc-url-reference
    desc: Oracle thin-driver JDBC URL reference
    for: [jsp]
    conf: 0.94
    if:
      type: text
      substr: "jdbc:oracle:thin:"
