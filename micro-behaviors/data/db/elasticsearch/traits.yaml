defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, json]
traits:
  - id: elasticsearch-string
    desc: elasticsearch string
    crit: component
    conf: 0.9
    if:
      type: text
      substr: elasticsearch
  - id: elastic-co
    desc: elastic.co domain
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: elastic.co
  - id: olivere-elastic
    desc: olivere/elastic Go driver
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: olivere/elastic
  - id: es-search-endpoint
    desc: Elasticsearch _search endpoint context
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'elasticsearch.{0,200}/_search'
      case_insensitive: true
  - id: es-bulk-endpoint
    desc: _bulk ES endpoint
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /_bulk

  - id: es-security-user-endpoint
    desc: Elasticsearch user-security API endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '/_security/user/'

  - id: es-security-apikey-endpoint
    desc: Elasticsearch API-key security endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '/_security/api_key'

  - id: es-watcher-definition-endpoint
    desc: Elasticsearch Watcher definition endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '/_watcher/watch/'

  - id: es-superuser-role-grant
    desc: Grants the Elasticsearch superuser role
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']roles["'']\s*:\s*\[\s*["'']superuser["'']'

  - id: es-cluster-all-privilege-grant
    desc: Grants all Elasticsearch cluster privileges
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']cluster["'']\s*:\s*\[\s*["'']all["'']'

  - id: es-pit-or-scroll-cursor
    desc: Elasticsearch PIT or Scroll cursor
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '_pit\?keep_alive|_search/scroll'

  - id: es-search-after-pagination
    desc: Uses Elasticsearch search_after pagination
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: 'search_after'

  - id: es-watcher-scheduled-trigger
    desc: Scheduled Elasticsearch Watcher trigger
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']trigger["'']\s*:\s*\{[\s\S]{0,240}["'']schedule["'']\s*:\s*\{'

  - id: es-watcher-always-condition
    desc: Always-true Elasticsearch Watcher condition
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']condition["'']\s*:\s*\{[\s\S]{0,160}["'']always["'']\s*:'

  - id: es-watcher-user-webhook-path
    desc: Watcher webhook targets user-security API
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'webhook[\s\S]{0,500}/_security/user/'

  - id: es-watcher-apikey-webhook-path
    desc: Watcher webhook targets API-key security API
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'webhook[\s\S]{0,500}/_security/api_key'
composite_rules:
  - id: elasticsearch
    desc: Elasticsearch connectivity
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/data/db/elasticsearch::elastic-co
      - id: micro-behaviors/data/db/elasticsearch::elasticsearch-string
      - id: micro-behaviors/data/db/elasticsearch::es-bulk-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-search-endpoint
      - id: micro-behaviors/data/db/elasticsearch::olivere-elastic
