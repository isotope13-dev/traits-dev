defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]

composite_rules:
  - id: es-superuser-endpoint-role-clues
    for: [scripts, '!jcl', json]
    desc: Elasticsearch user endpoint and superuser role
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-security-user-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-superuser-role-grant
    near_bytes: 500

  - id: es-apikey-endpoint-privilege-clues
    for: [scripts, '!jcl', json]
    desc: Elasticsearch API key endpoint and cluster grant
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/data/db/elasticsearch::es-security-apikey-endpoint
      - id: micro-behaviors/data/db/elasticsearch::es-cluster-all-privilege-grant
    near_bytes: 400

