defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: cassandra-string
    desc: Cassandra client or connection marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcassandra\s*(:|[._-])\s*(client|cluster|session|driver|connect)\b'
    unless:
      - id: metadata/package/quality/benign-context::password-strength-blocklist-context
      - id: metadata/file/catalog/identity/
      - id: metadata/library/data::public-suffix-list-content
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/lib/ui/chroma/
  - id: gocql
    desc: gocql Go driver
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: gocql
    unless:
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle
  - id: datastax
    desc: datastax driver
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: datastax
  - id: cql-url
    desc: cql:// URL scheme
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: cql://
