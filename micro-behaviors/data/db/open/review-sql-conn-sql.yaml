# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: sql-open
  desc: sql.Open Go function
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: sql.Open
- id: go-sql-open-mysql
  desc: Go opens MySQL database
  crit: notable
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: sql.Open
    arg:
      kind: string
      exact: mysql
- id: jvm-jdbc-driver-manager
  desc: JVM opens JDBC connections via DriverManager
  crit: notable
  conf: 0.9
  for:
  - class
  - java_class
  if:
    type: text
    substr: java/sql/DriverManager
