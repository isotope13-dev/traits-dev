# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
traits:
- id: psycopg-connect-call
  desc: Python connects to PostgreSQL through psycopg
  conf: 0.99
  if:
    type: symbol
    kind: call
    regex: "^psycopg(2)?\\.connect$"
