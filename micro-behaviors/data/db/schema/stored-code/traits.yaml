# Stored-language database objects are a neutral database capability. Objective
# composites add the process or network behavior that makes a stored object an
# attack-relevant database-to-host bridge.
defaults:
  platforms: [windows, unix]
  for: [text]
  attack: T1505.001
  mbc: C0017

traits:
  - id: database-stored-function-definition
    desc: Database function or procedure definition
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bCREATE\s+(OR\s+REPLACE\s+)?(FUNCTION|PROCEDURE)\s+[A-Za-z_][A-Za-z0-9_$#]*'

  - id: database-stored-language-clause
    desc: Database stored language clause
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bLANGUAGE\s+(pl[a-z0-9]+|sql|java|c)\b'

  - id: oracle-java-schema-source
    desc: Oracle compiles Java source in schema
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bCREATE\s+(OR\s+REPLACE\s+)?AND\s+COMPILE\s+JAVA\s+SOURCE\s+NAMED\b'

  - id: oracle-java-language-binding
    desc: Oracle wrapper binds a Java method
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "(?i)\\bAS\\s+LANGUAGE\\s+JAVA\\s+NAME\\s+['\"]"

composite_rules:
  - id: database-stored-function-language
    desc: Database function binds stored language
    crit: notable
    conf: 0.94
    all:
      - id: database-stored-function-definition
      - id: database-stored-language-clause
    near_bytes: 900

  - id: database-stored-language-object
    desc: Database stores executable language code
    crit: notable
    conf: 0.98
    any:
      - id: oracle-java-schema-source
      - id: database-stored-function-language
