defaults:
  platforms:
  - unix
  - windows
  for:
  - data
  - scripts
  - text
  crit: notable
  conf: 0.99
traits:
- attack: T1059
  mbc: C0058
  id: javascript-trigger-source
  desc: SQL trigger with JavaScript source marker
  if:
    type: text
    regex: (?is)\bCREATE(\s|\+)+TRIGGER\b.{1,600}//javascript\b
