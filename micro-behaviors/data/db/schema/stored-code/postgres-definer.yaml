defaults:
  platforms: [unix, windows]
  for: [python, powershell, text]
  crit: notable
traits:
  - id: postgres-definer-return-query-execute
    desc: SECURITY DEFINER body executes a query variable
    conf: 0.97
    if:
      type: text
      regex: '(?is)SECURITY\s+DEFINER\b.{0,240}\bRETURN\s+QUERY\s+EXECUTE\s+\w+\s*;'
  - id: internal-lo-export-binding
    desc: PostgreSQL internal alias binds lo_export
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bAS\s+''lo_export''\s+LANGUAGE\s+''?internal''?\b'
