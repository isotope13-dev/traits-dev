defaults:
  platforms:
  - windows
  for:
  - text
  - data
traits:
- id: sqlserver-unsafe-clr-assembly
  desc: SQL Server creates unsafe CLR assembly
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: (?is)create\s+assembly.{0,500}permission_set\s*=\s*unsafe
- id: sqlserver-external-clr-procedure
  desc: SQL Server creates external CLR procedure
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)create\s+procedure.{0,500}as\s+external\s+name
- id: sqlserver-external-shell-command
  desc: SQL CLR name near Windows shell command
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)as\s+external\s+name.{0,800}(cmd(\.exe)?|powershell(\.exe)?|wmic)
