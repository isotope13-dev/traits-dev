# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: postgres-security-definer
  desc: PostgreSQL function uses owner privileges
  if:
    type: text
    regex: (?i)\bSECURITY\s+DEFINER\b
- id: postgres-return-query-execute
  desc: Returns results from dynamic SQL
  if:
    type: text
    regex: (?i)\bRETURN\s+QUERY\s+EXECUTE\s+[a-z_][a-z_0-9]*\s*;
- id: postgres-definer-dynamic-query
  desc: Definer clause near dynamic query return
  crit: suspicious
  if:
    type: text
    regex: (?is)SECURITY\s+DEFINER[^;]{0,240}RETURN\s+QUERY\s+EXECUTE\s+\w+\s*;
- id: postgres-internal-language
  desc: Binds PostgreSQL internal function language
  if:
    type: text
    regex: (?i)\bLANGUAGE\s+'?internal'?\b
- id: postgres-read-file-symbol-binding
  desc: Declares PostgreSQL file-read symbol binding
  if:
    type: text
    regex: (?i)\bAS\s+'pg_read_file(_(off_len|all)(_missing)?)?'
- id: postgres-export-object-symbol-binding
  desc: Declares PostgreSQL file-export symbol binding
  if:
    type: text
    regex: (?i)\bAS\s+'(be_)?lo_export'
composite_rules:
- id: postgres-internal-file-primitives
  desc: Internal language near file-access symbol binding
  crit: suspicious
  near_bytes: 192
  all:
  - id: micro-behaviors/data/db/schema/stored-code::postgres-internal-language
  any:
  - id: micro-behaviors/data/db/schema/stored-code::postgres-read-file-symbol-binding
  - id: micro-behaviors/data/db/schema/stored-code::postgres-export-object-symbol-binding
