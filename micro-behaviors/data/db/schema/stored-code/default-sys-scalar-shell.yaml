defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
composite_rules:
  - id: default-sys-scalar-shell
    desc: Default SYS login accompanies SQL shell code
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/db/schema/stored-code::scalar-script-shell-command
    any:
      - id: micro-behaviors/os/security/auth/password::sys-exasol-cli-credentials
      - id: micro-behaviors/os/security/auth/password::sys-exasol-credential-fields
