defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: redis-function-load-call
    desc: Calls Redis FUNCTION LOAD API
    if:
      # Awaited methods have no target in this producer's symbol projection.
      type: tree-sitter
      kind: call
      regex: '\.FUNCTION_LOAD\s*\('

  - id: redis-function-flush-call
    desc: Calls Redis FUNCTION FLUSH API
    if:
      type: tree-sitter
      kind: call
      regex: '\.FUNCTION_FLUSH\s*\('

  - id: embedded-redis-lua-function-registration
    desc: Embedded Lua registers Redis stored functions
    if:
      type: literal
      regex: 'redis\.register_function\s*\('
