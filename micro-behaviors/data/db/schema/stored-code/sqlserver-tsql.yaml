defaults:
  platforms: [windows]
  for: [text, scripts, source]
  crit: notable

traits:
  - id: sqlserver-alter-procedure
    desc: Alters a SQL Server stored procedure
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bALTER\s+PROCEDURE\b'

  - id: sqlserver-stuff-string-splice
    desc: Splices text with T-SQL STUFF function
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bstuff\s*\(\s*@\w+\s*,'
