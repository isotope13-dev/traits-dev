# Registered language aliases are configurable; the SQL declaration, rather
# than an alias, object name, client language or product version, is the context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
traits:
  - id: scalar-script-definition
    desc: Database creates a scalar script object
    conf: 0.98
    if:
      type: text
      # Names can be quoted SQL identifiers or client templates ({udf}, %s,
      # ${name}). Bound the name and stop at a statement separator.
      regex: '(?i)\bCREATE\s+(OR\s+REPLACE\s+)?\w+\s+SCALAR\s+SCRIPT\s+[^(;]{1,128}\('
