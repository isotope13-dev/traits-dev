---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: indexeddb-delete-database
  desc: Deletes IndexedDB database
  crit: notable
  if:
    type: text
    regex: "\\bindexedDB\\.deleteDatabase\\s*\\("
composite_rules:
- id: indexeddb-enumerate-delete
  desc: IndexedDB enumeration and deletion calls co-occur
  crit: notable
  conf: 0.93
  for:
  - javascript
  scope: file
  all:
  - id: micro-behaviors/data/db/enumerate::indexeddb-databases-enumerate
  - id: micro-behaviors/data/db/schema/delete::indexeddb-delete-database
