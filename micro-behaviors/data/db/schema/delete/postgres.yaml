# dropdb also serves ordinary administration and test teardown. The command
# establishes schema deletion, not an attacker objective. Preserve this signal
# even when the script also creates a database or belongs to a test harness.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.97

traits:
  - id: postgres-dropdb-command
    desc: PostgreSQL dropdb command with arguments
    if:
      type: text
      regex: '(?im)^\s*dropdb\s+\S+'
