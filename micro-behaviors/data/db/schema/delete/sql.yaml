defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: sql-drop-object
    desc: DROP SQL object syntax reference
    crit: notable
    conf: 0.8
    for: [scripts, binaries, c, cpp, go, asp]
    if:
      type: text
      regex: '(?i)\bDROP\s+(TABLE|DATABASE|SCHEMA|INDEX)\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/package/testing/presence/fixture::php-test-file

  - id: sql-drop-database
    desc: SQL DROP DATABASE or SCHEMA statement
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bDROP\s+(DATABASE|SCHEMA)\b'
