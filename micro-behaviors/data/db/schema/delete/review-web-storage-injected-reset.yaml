---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
  conf: 0.93
composite_rules:
- id: script-injection-near-indexeddb-reset
  desc: IndexedDB reset near extension permission or injection
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/db/enumerate::indexeddb-databases-enumerate
  - id: micro-behaviors/data/db/schema/delete::indexeddb-delete-database
  any:
  - id: metadata/permission/host::broad-content-script-matches
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
