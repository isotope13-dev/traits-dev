defaults:
  platforms: [windows]
  for: [text, scripts, source]
  crit: notable

traits:
  - id: sqlserver-sysdatabases-catalog
    desc: Queries SQL Server database catalog
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(master\.\.)?SYSDATABASES\b|\bsys\.databases\b'

  - id: sqlserver-syscomments-catalog
    desc: Queries SQL Server syscomments source table
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(syscomments|sys\.sql_modules)\b'

  - id: sqlserver-sysobjects-catalog
    desc: Queries SQL Server sysobjects table
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(sysobjects|sys\.objects|sys\.procedures)\b'

  - id: sqlserver-self-procid
    desc: References current procedure via @@PROCID
    conf: 0.95
    if:
      type: text
      regex: '(?i)@@PROCID\b'

composite_rules:
  - id: sqlserver-stored-procedure-source-enum
    desc: Enumerates SQL Server stored procedure source
    conf: 0.96
    near_bytes: 500
    all:
      - id: sqlserver-sysobjects-catalog
      - id: sqlserver-syscomments-catalog
