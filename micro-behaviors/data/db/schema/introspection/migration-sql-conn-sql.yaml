# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: sqlite-version-func
  desc: SQLite version query fragment
  crit: notable
  for:
  - python
  if:
    type: text
    regex: sqlite_version\(\)\s+IS\s+NOT\s+NULL
- id: mysql-version-comment-var
  desc: MySQL version comment variable
  crit: notable
  for:
  - python
  if:
    type: text
    substr: '@@version_comment'
- id: mssql-servername-var
  desc: MSSQL server name variable
  crit: notable
  for:
  - python
  if:
    type: text
    substr: '@@servername'
composite_rules:
- id: dbms-fingerprint-query-suite
  desc: Multi-DBMS fingerprint query suite
  crit: notable
  conf: 0.93
  needs: 3
  any:
  - id: micro-behaviors/data/db/schema/introspection::sqlite-version-func
  - id: micro-behaviors/data/db/schema/introspection::mysql-version-comment-var
  - id: micro-behaviors/data/db/schema/introspection::mssql-servername-var
