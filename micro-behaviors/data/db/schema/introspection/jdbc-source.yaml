defaults:
  platforms: [windows, unix]
  for: [jsp, java]
  crit: notable
  conf: 0.95

traits:
  - id: jdbc-all-tables-metadata-source
    desc: JDBC wildcard table metadata query
    if:
      type: text
      regex: '\.getTables\s*\(\s*null\s*,\s*null\s*,\s*"%"\s*,\s*null\s*\)'
  - id: jdbc-show-create-table-source
    desc: JDBC queries table creation SQL
    if:
      type: text
      regex: '\.executeQuery\(\s*"SHOW\s+CREATE\s+TABLE\s+'
