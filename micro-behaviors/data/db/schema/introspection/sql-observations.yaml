defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - python
  id: postgres-catalog-table
  desc: PostgreSQL catalog table reference
  if:
    type: text
    substr: pg_catalog.pg_tables
- for:
  - python
  id: information-schema-ref
  desc: SQL information_schema reference
  if:
    type: text
    word: information_schema
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- for:
  - python
  id: sqlite-master-ref
  desc: SQLite sqlite_master reference
  if:
    type: text
    word: sqlite_master
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- for:
  - python
  id: pragma-table-info-ref
  desc: SQLite table info pragma
  if:
    type: text
    substr: pragma_table_info
composite_rules:
- for:
  - scripts
  - binaries
  id: schema-catalog-reference-suite
  desc: Multiple schema catalog references
  conf: 0.94
  needs: 2
  any:
  - id: micro-behaviors/data/db/schema/introspection::information-schema-ref
  - id: micro-behaviors/data/db/schema/introspection::sqlite-master-ref
  - id: micro-behaviors/data/db/schema/introspection::pragma-table-info-ref
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
