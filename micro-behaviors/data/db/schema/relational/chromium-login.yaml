defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: chromium-password-value-column
    desc: References Chromium encrypted password column
    if:
      type: literal
      exact: password_value
  - id: chromium-username-value-column
    desc: References Chromium login username column
    if:
      type: literal
      exact: username_value
