defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: sql-create-table
  desc: SQL CREATE TABLE syntax reference
  crit: notable
  conf: 0.5
  if:
    type: literal
    kind: string
    regex: (?i)\bCREATE\s+TABLE(\s+IF\s+NOT\s+EXISTS)?\s+[a-z_][a-z0-9_$]*(\s*\(|\s+AS\b)
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/lang/generated::openapi-generator-source-banner
  - id: well-known/lib/ui/highlight-js::browser-bundle
- id: sql-value-blob-column
  desc: SQL value column stores BLOBs
  crit: baseline
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: (?i)\bvalue\s+BLOB\b
- id: sql-password-column
  desc: SQL password column definition
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)\bpassword\b\s+(VARCHAR|TEXT|CHAR|STRING)
composite_rules:
- id: table-and-blob-column-syntax
  desc: CREATE TABLE and BLOB-column syntax
  crit: baseline
  conf: 0.9
  all:
  - id: micro-behaviors/data/db/schema/relational::sql-create-table
  - id: micro-behaviors/data/db/schema/relational::sql-value-blob-column
