# A table that stores a server address in the same row as a key column:
# the on-device cache shape used when discovered servers arrive with
# per-server encryption keys. The schema alone is a notable storage
# observation; it does not show the key was server-supplied.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.9

traits:
  - id: server-key-column-pair
    desc: Server column paired with key column
    if:
      type: text
      regex: '\b(domain|host|server)\b[^;]{0,200}?\b(aes[._-]?key|enc[._-]?key)\b'
      exclude_comments: true

composite_rules:
  - id: server-key-cache-table
    desc: Table caches server addresses beside key columns
    for: [javascript, typescript, elf, so]
    crit: notable
    conf: 0.92
    near_bytes: 512
    all:
      - id: micro-behaviors/data/db/schema/relational::sql-create-table
      - id: server-key-column-pair
