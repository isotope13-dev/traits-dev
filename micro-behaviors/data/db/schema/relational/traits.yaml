defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: dataset-user-relational-key-pair
    desc: Relational schema links dataset/user keys
    conf: 0.88
    if:
      type: text
      regex: 'dataset_id.{0,80}user_id|user_id.{0,80}dataset_id'

  - id: account-id-field
    desc: Account identity key field name
    conf: 0.8
    for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
    if:
      type: text
      regex: '(?i)["'']user_?id["'']'

  - id: account-created-field
    desc: Account creation timestamp field name
    conf: 0.8
    for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
    if:
      type: text
      regex: '(?i)["''](member_since|joined_at|registered_at)["'']'

  - id: account-last-seen-field
    desc: Account last-activity timestamp field name
    conf: 0.8
    for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
    if:
      type: text
      regex: '(?i)["''](last_login|last_seen|last_active)["'']'

composite_rules:
  - id: account-record-field-schema
    desc: Dense account-record field-name schema
    conf: 0.85
    for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
    any:
      - id: account-id-field
      - id: micro-behaviors/data/serialize/object::quoted-username-field-key
      - id: account-created-field
      - id: account-last-seen-field
    needs: 3
