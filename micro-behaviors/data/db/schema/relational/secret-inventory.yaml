defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: secret-inventory-provider-fields
    desc: Provider and secret schema fields
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(provider|service)\s+TEXT.{0,120}\b(secret|token|api_key)\s+TEXT'
  - id: secret-inventory-source-status-fields
    desc: Secret source and status schema fields
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(source_url|origin)\s+TEXT.{0,120}\bstatus\s+TEXT'

composite_rules:
  - id: secret-validation-inventory-schema
    for: [scripts, '!jcl']
    desc: Secret-inventory schema beside validation-state vocabulary
    crit: notable
    conf: 0.97
    near_lines: 32
    all:
      - id: micro-behaviors/data/db/schema/relational::sql-create-table
      - id: micro-behaviors/data/db/schema/relational::secret-inventory-provider-fields
      - id: micro-behaviors/data/db/schema/relational::secret-inventory-source-status-fields
      - id: metadata/lang/source/literal::secret-validation-state-triad
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/threat-intel/
