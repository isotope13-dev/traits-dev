defaults:
  platforms: [unix, windows]
  for: [php, c, cpp, python, shell]
  crit: component
  conf: 0.85

# One atom per connection-string credential key. A lone `user:` or `key=` is
# common in docs, diagnostics, and unrelated config, so no single key is a
# finding on its own — the `needs: 2` composite below (two distinct credential
# keys) is the useful connection-string observation. The `(^|[^a-z0-9_/-])` and
# `:[^:]` guards keep package/version paths (`dev-db/mariadb:10.3`) from reading
# as a `db:` key.
#
# The optional `param` prefix plus the `not:` filter is a reST/Sphinx docstring
# guard: `:param host:` / `:param password:` in a documented constructor is an
# API parameter list, not a connection string. Widening the match to include the
# preceding `param` word puts that word in the evidence, which `not:` then
# drops; a real `;host=` / `:host=` key keeps matching unchanged.
traits:
  - id: db-key-user
    desc: Connection user key
    not:
      - regex: '(?i)param'
    if:
      type: string_literal
      regex: '(?i)(param\s+)?\buser\s*[=:]'

  - id: db-key-password
    desc: Connection password key
    not:
      - regex: '(?i)param'
    if:
      type: string_literal
      regex: '(?i)(param\s+)?\b(pass|password|passwd)\s*[=:]'

  - id: db-key-secret
    desc: Connection secret key
    not:
      - regex: '(?i)param'
    if:
      type: string_literal
      regex: '(?i)(param\s+)?\b(secret|key)\s*[=:]'

  - id: db-key-host
    desc: Connection host key
    not:
      - regex: '(?i)param'
    if:
      type: string_literal
      regex: '(?i)(param\s+)?\b(host|postgres|pgsql)\s*[=:]'

  - id: db-key-database
    desc: Connection database key
    not:
      - regex: '(?i)param'
    if:
      type: string_literal
      regex: '(?i)(param)?(^|[^a-z0-9_/-])(database|dbname|db|mysql)\s*(=|:[^:])'

  - id: db-key-dsn
    desc: Connection DSN key
    not:
      - regex: '(?i)param'
    if:
      type: string_literal
      regex: '(?i)(param\s+)?\b(dsn|connstr|connection_?string)\s*[=:]'

composite_rules:
  # Two or more distinct credential keys — a real connection-string surface,
  # not a stray `user:` in documentation. Replaces the former pairwise
  # `connection-*-pair` atoms, whose `(?=.*A)(?=.*B)` lookahead never compiled.
  - id: multiple-database-credential-keys
    desc: Multiple database credential config keys
    crit: component
    conf: 0.9
    any:
      - id: db-key-user
      - id: db-key-password
      - id: db-key-secret
      - id: db-key-host
      - id: db-key-database
      - id: db-key-dsn
    needs: 2
