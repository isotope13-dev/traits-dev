defaults:
  platforms:
  - unix
  - windows
  for:
  - data
  - text
  - json
traits:
- id: jdbc-sentinel-subprotocol
  desc: JDBC URL uses sentinel subprotocol
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: jdbc:(no|none|invalid|unknown|fake|null|test):\S{1,128}
- id: derby-memory-db-url-log
  desc: Derby in-memory database URL logged
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: DB URL:\s*jdbc:derby:memory:\S{0,64}
composite_rules:
- id: sentinel-jdbc-driver-error
  desc: Unsupported JDBC URL beside driver error
  crit: notable
  conf: 0.98
  near_lines: 1
  all:
  - id: metadata/lang/natural/diagnostic::jdbc-no-driver-error
  - id: micro-behaviors/data/db/config::jdbc-sentinel-subprotocol
