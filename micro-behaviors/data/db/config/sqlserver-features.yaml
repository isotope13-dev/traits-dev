defaults:
  platforms:
  - windows
  for:
  - text
  - data
traits:
- id: sqlserver-enable-clr
  desc: SQL Server configures CLR integration
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)sp_configure\s+['"]clr\s+enabled['"]
- id: sqlserver-enable-xp-cmdshell
  desc: SQL Server configures xp_cmdshell
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?is)sp_configure\s+['"]xp_cmdshell['"]
- id: sqlserver-enable-ole-automation
  desc: SQL Server configures OLE Automation
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?is)sp_configure\s+['"]ole automation procedures['"]
- id: sqlserver-reconfigure-keyword
  desc: SQL Server RECONFIGURE statement keyword
  for: [powershell, c, cpp, csharp, python, batch, text]
  crit: notable
  conf: 0.92
  if:
    type: text
    word: RECONFIGURE
