defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - text
  - data
traits:
- id: sqlserver-enable-clr
  desc: SQL Server configures CLR integration
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)sp_configure\s+['"]clr\s+enabled['"]
- id: sqlserver-xp-cmdshell-setting-reference
  desc: SQL Server xp_cmdshell configuration statement
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)sp_configure\s*['"]xp_cmdshell['"]
- id: sqlserver-enable-xp-cmdshell
  # The statement may occur in help text or a query string. Its presence does
  # not establish that the containing program submits it to SQL Server.
  desc: xp_cmdshell enablement SQL text
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?i)sp_configure\s*['"]xp_cmdshell['"]\s*,\s*1\s*([;'"]|$)
- id: sqlserver-enable-ole-automation
  desc: SQL Server configures OLE Automation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)sp_configure\s+['"]ole automation procedures['"]
- id: sqlserver-reconfigure-keyword
  desc: SQL Server RECONFIGURE statement keyword
  for: [powershell, c, cpp, csharp, python, batch, text]
  crit: notable
  conf: 0.92
  if:
    type: text
    word: RECONFIGURE
- id: sqlserver-xp-regwrite-call
  desc: SQL Server xp_regwrite registry modification
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bexec(ute)?\s+[\w.\[\]]*xp_regwrite\b
