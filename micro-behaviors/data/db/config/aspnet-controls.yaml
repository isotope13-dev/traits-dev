defaults:
  platforms: [windows]
  for: [asp]
  crit: notable

traits:
  - id: aspnet-connection-string-from-control-text
    desc: Connection string comes from control text
    conf: 0.97
    if:
      type: text
      regex: '\.ConnectionString\s*=\s*[A-Za-z_]\w*\.Text\s*;'
      exclude_html_comments: true
