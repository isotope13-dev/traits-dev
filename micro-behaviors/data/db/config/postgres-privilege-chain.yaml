# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: postgres-archive-command-assignment
  desc: Configures PostgreSQL archiver shell command
  if:
    type: text
    regex: (?i)\barchive_command\s*=\s*'[^'\r\n]{1,240}'
