# A standalone WordPress database tool (backup, restore, migration, search and
# replace) runs outside WordPress, so it cannot call $wpdb. It reads the
# DB_NAME / DB_USER / DB_PASSWORD / DB_HOST defines out of wp-config.php with a
# pattern and hands them to its own PDO connection. That reads the same file a
# credential thief reads, so the path, key and read legs alone cannot tell the
# two apart. What does: the credentials end in a database connection opened by
# the same file, rather than going anywhere else.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: wp-config-define-pattern
    desc: Pattern matches WordPress DB_ constants
    if:
      type: text
      regex: 'preg_match[^;\n]{0,80}DB_\(?(NAME|USER|PASSWORD|HOST)'

  - id: php-pdo-connection-opened
    desc: Opens a database connection with new PDO
    if:
      type: text
      regex: '\bnew\s+\\?PDO\s*\('

composite_rules:
  - id: wordpress-database-client
    desc: Standalone WordPress database client
    crit: exception
    all:
      - id: wp-config-define-pattern
      - id: php-pdo-connection-opened
