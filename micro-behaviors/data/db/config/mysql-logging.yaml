defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable

traits:
  - id: mysql-general-log-enable
    desc: Enables MySQL global query logging
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bSET\s+(GLOBAL\s+|@@global\s*\.\s*)`?general_log`?\s*=\s*[''"]?(1|ON|TRUE)\b'

  - id: mysql-general-log-disable
    desc: Disables MySQL global query logging
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bSET\s+(GLOBAL\s+|@@global\s*\.\s*)`?general_log`?\s*=\s*[''"]?(0|OFF|FALSE)\b'
