# A database connection string names the server, the credentials and, for
# file-backed providers, the on-disk data source. Applications read it from
# web.config, an include, or a constant -- never from the HTTP request, because
# that hands the caller the choice of which database to open and as whom.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  crit: suspicious
  conf: 0.94
  attack: T1505.003

traits:
  - id: request-supplied-connection-string
    desc: Request field supplies a DB connection string
    if:
      type: text
      # Covers both the bare assignment (`connstr = Request("connstr")`) and the
      # session-cached form (`session("dbstr") = request("dbstr")`); the short
      # bounded class spans the closing quote/paren and the whitespace between.
      regex: '(?i)\b(dbstr|connstr|connectionstring)\b["'')\]\s]{0,4}=\s*request\s*\('
