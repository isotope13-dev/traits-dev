# PaperCut external card/ID lookup configuration. These are neutral
# administration surfaces on their own; exploit objectives add the public-page
# component routing and executable JDBC content that make their use hostile.
defaults:
  platforms: [unix, windows]
  for: [data, scripts, text]
  attack: T1190
  mbc: C0058

traits:
  - id: papercut-user-lookup-driver-setting
    desc: PaperCut user lookup driver setting
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'user-lookup\.db-driver\s*='

  - id: papercut-user-lookup-url-setting
    desc: PaperCut user lookup URL setting
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'user-lookup\.db-url\s*='

  - id: papercut-user-lookup-sql-setting
    desc: PaperCut user lookup SQL setting
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'user-lookup\.id-to-username-sql\s*='

  - id: papercut-user-lookup-enabled-setting
    desc: PaperCut user lookup enable setting
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'user-lookup\.enabled\s*='

composite_rules:
  - id: papercut-external-user-lookup-config
    desc: PaperCut external user lookup configuration
    crit: notable
    conf: 0.99
    all:
      - id: papercut-user-lookup-driver-setting
      - id: papercut-user-lookup-url-setting
      - id: papercut-user-lookup-sql-setting
      - id: papercut-user-lookup-enabled-setting
