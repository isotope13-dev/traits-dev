# SQL statements that modify a `system_timezone` configuration row. Ordinary
# appliance schema migrations and backups write clean IANA/POSIX timezone names;
# CVE-2026-111560 injects shell commands when `Backup2.pm` / `fix_tz.pl`
# interpolates `system_timezone` into single-quoted `sed` commands.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: sql-dml-write-keyword
    desc: SQL table write statement
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b((INSERT|REPLACE)\s+(IGNORE\s+)?INTO|DELETE\s+FROM)\s+\S+|\bUPDATE\s+\S+\s+SET\b'

  - id: system-timezone-quoted-literal
    desc: Quoted system_timezone config key
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '["'']system_timezone["'']'

composite_rules:
  - id: sql-system-timezone-write
    desc: SQL write to system_timezone setting
    crit: notable
    conf: 0.94
    near_bytes: 256
    all:
      - id: sql-dml-write-keyword
      - id: system-timezone-quoted-literal
