defaults:
  platforms: [unix, windows]
  for: [python, powershell, text]
  crit: notable
traits:
  - id: postgres-archive-identity-probe
    desc: WAL archive command redirects identity probe
    conf: 0.99
    if:
      type: text
      regex: '(?i)\barchive_command\s*=\s*''\s*(/(usr/)?bin/)?(id|whoami)\s*>'
