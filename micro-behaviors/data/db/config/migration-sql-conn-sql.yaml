# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: sqlite-readonly-connection
  desc: Read-only connection mode parameter
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    substr: mode=ro
- id: go-mysql-credential-dsn-format
  desc: MySQL TCP credential DSN format
  crit: notable
  conf: 0.84
  for:
  - go
  - binaries
  - wasm
  if:
    type: text
    substr: '@tcp(%s:3306)'
- id: sql-disable-foreign-key-checks
  desc: MySQL globally disables foreign-key checks
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\bSET\s+GLOBAL\s+FOREIGN_KEY_CHECKS\s*=\s*0\b
