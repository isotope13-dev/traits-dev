# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - data
  - scripts
  - text
  attack: T1059
  mbc: C0058
traits:
- id: h2-jdbc-init-sql
  desc: H2 JDBC URL includes INIT SQL
  conf: 0.98
  if:
    type: text
    regex: (?i)\bjdbc:h2:[^\r\n&"']{0,600};INIT=
