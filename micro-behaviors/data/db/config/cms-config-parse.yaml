# Reading database configuration also supports backup and recovery.
defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: db-credential-define-extraction
    desc: Regex references DB credential constants
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'preg_match[^;\n]{0,60}DB_(PASSWORD|USER|NAME)'

composite_rules:
  - id: wordpress-config-database-credential-parse
    desc: WordPress config and credential parsing references
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: db-credential-define-extraction
      - id: micro-behaviors/fs/path/config/web::wordpress-config-path
      - id: micro-behaviors/fs/read/file/full::file-get-contents
