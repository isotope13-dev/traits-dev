defaults:
  platforms: [windows]
  for: [binaries]

traits:
  - id: yandex-music-electron-protocol
    desc: YandexMusic Electron protocol origin key
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: _music-application://desktop

  - id: oauthkey-missing-error
    desc: OAuth-key lookup error message reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: oauthkey missing in db

composite_rules:
  - id: yandex-music-oauth-theft
    desc: YandexMusic LevelDB and OAuth key references
    crit: notable
    conf: 0.97
    any:
      - id: micro-behaviors/data/db/leveldb::oauthkey-missing-error
      - id: micro-behaviors/data/db/leveldb::yandex-music-electron-protocol
      - id: micro-behaviors/fs/path/app-data::yandex-music-leveldb
    needs: 2

  - id: yandex-storage-reference
    desc: YandexMusic storage or OAuth-key reference
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/app-data::yandex-music-leveldb
      - id: yandex-music-electron-protocol
      - id: oauthkey-missing-error
