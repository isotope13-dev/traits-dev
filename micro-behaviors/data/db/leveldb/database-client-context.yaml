defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: rusty-leveldb-crate
    desc: Rusty-leveldb version reference
    crit: notable
    conf: 0.88
    platforms: [windows, linux, macos]
    for: [binaries]
    if:
      type: text
      regex: rusty-leveldb-[0-9]

composite_rules:
  - id: rust-leveldb-electron-stealer
    for: [elf, macho, pe, class, pyc, beam, wasm, staticlib]
    desc: Rusty-leveldb and storage context references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/db/leveldb::rusty-leveldb-crate
    any:
      - id: micro-behaviors/data/db/leveldb::leveldb-ref
      - id: micro-behaviors/fs/path/app-data::local-storage-ref
      - id: micro-behaviors/fs/path/app-data::yandex-music-leveldb
