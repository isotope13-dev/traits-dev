defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, c, cpp]

traits:
  - id: leveldb-ref
    desc: LevelDB storage reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)([/\\]leveldb[/\\]|\bleveldb\b.{0,40}\b(database|storage|directory)\b)'
    not:
      - regex: disabled-by-default-memory-infra
    downgrade:
      any:
        - id: objectives/anti-static/obfuscation/string/junking/
