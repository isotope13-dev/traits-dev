defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, c, cpp]

traits:
  # Path form includes a trailing \leveldb directory, not only \leveldb\.
  - id: leveldb-path-or-store
    desc: LevelDB path segment or store wording
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)([/\\]leveldb([^A-Za-z0-9]|$)|\bleveldb\b.{0,24}\b(database|storage)\b)'
    not:
      - regex: disabled-by-default-memory-infra
  - id: leveldb-directory-wording
    desc: LevelDB directory wording
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bleveldb\b.{0,40}\bdirectory\b'
    not:
      - regex: disabled-by-default-memory-infra

composite_rules:
  - id: leveldb-ref
    desc: LevelDB storage reference
    crit: notable
    conf: 0.88
    any:
      - id: leveldb-path-or-store
      - id: leveldb-directory-wording
