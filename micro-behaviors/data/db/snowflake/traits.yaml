defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, class]

traits:
  - id: temporary-stage-create
    desc: Creates a temporary Snowflake data stage
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCREATE\s+(TEMP|TEMPORARY)\s+STAGE\s+[A-Za-z_"$][A-Za-z0-9_.$"]*'

  - id: stage-unload
    desc: Snowflake query unload to named stage
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bCOPY\s+INTO\s+@[A-Za-z_"$][A-Za-z0-9_.$/"-]*'

  - id: gzip-unload-option
    desc: Snowflake unload uses GZIP compression
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bCOMPRESSION\s*=\s*[''"]?GZIP[''"]?\b'

  - id: stage-download-to-local-uri
    desc: Snowflake stage download to local URI
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bGET\s+@[A-Za-z_"$][^\s;]{0,200}\s+file:///{1,3}[^\s;]{1,260}'
