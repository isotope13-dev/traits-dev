# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-select-message-table
  desc: Selects chat message rows
  conf: 0.93
  if:
    type: text
    regex: "(?i)\\bselect\\b.{0,120}\\bfrom\\s+(message|part)\\b"
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - powershell
  id: chromium-cookie-select-query
  desc: Chromium cookies table SQL query
  conf: 0.8
  if:
    type: text
    regex: "(?is)\\bSELECT\\b.{0,240}\\bhost_key\\b.{0,240}\\bencrypted_value\\b.{0,240}\\bFROM\\s+cookies\\b"
