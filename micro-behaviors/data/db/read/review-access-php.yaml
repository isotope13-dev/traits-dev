# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
traits:
- id: php-get-option
  desc: Reads a WordPress option (get_option)
  if:
    type: symbol
    exact: get_option
- id: php-get-post-meta
  desc: Reads WordPress post metadata
  if:
    type: symbol
    kind: call
    exact: get_post_meta
