# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - powershell
  id: chromium-cookie-select-query
  desc: Chromium cookies table SQL query
  conf: 0.8
  if:
    type: text
    regex: (?is)\bSELECT\b.{0,240}\bhost_key\b.{0,240}\bencrypted_value\b.{0,240}\bFROM\s+cookies\b
