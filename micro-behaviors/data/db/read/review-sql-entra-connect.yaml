# Database-operation review; matcher and effective scope preserved.
---
defaults:
  for:
  - scripts
  - source
  - pe
  - dll
  platforms:
  - windows
  attack: T1003
traits:
- id: entra-connect-connector-secret-columns
  desc: Selects Entra Connect connector secret columns
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "(?i)\\bSELECT\\s+private_configuration_xml\\b"
- id: entra-connect-key-fields
  desc: Selects Entra Connect key metadata fields
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: "(?i)\\bSELECT\\s+instance_id\\s*,\\s*keyset_id\\s*,\\s*entropy\\b"
composite_rules:
- id: entra-connect-connector-configuration
  desc: Queries Entra Connect connector secrets
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/db/read::entra-connect-connector-secret-columns
  - id: micro-behaviors/data/db/sql::entra-connect-connector-secret-table
- id: entra-connect-key-metadata
  desc: Queries Entra Connect key metadata
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/data/db/read::entra-connect-key-fields
  - id: micro-behaviors/data/db/sql::entra-connect-key-table
