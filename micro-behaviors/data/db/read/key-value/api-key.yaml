defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: browser-storage-api-key-read
    desc: Reads API-key-named browser storage entry
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(localStorage|sessionStorage)\.getItem$'
      arg:
        kind: string
        regex: '(?i)(^|[._-])api[_-]?key([._-]|$)'
