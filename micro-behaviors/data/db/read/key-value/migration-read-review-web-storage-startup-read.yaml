# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: extension-startup-handler-storage-read
  desc: Startup listener reads extension storage
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: "((call_expression\n   function: (member_expression\n     object: (member_expression property: (property_identifier)\
      \ @event)\n     property: (property_identifier) @method)\n   arguments: (arguments (_) @listener))\n (#eq?\
      \ @event \"onStartup\")\n (#eq? @method \"addListener\")\n (#match? @listener \"storage\\.(local|sync|session|managed)\\\
      .get\"))\n"
