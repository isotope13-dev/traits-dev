# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
# Token-valued object fields read straight from localStorage, in bracket
# (obfuscator) or getItem form, with snake_case or camelCase keys.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - text
  crit: notable
  conf: 0.97
traits:
- id: access-token-field-from-local-storage
  desc: Access-token field reads localStorage
  if:
    type: text
    regex: '(?i)access_?token["\x27]?\s*:\s*(window\.)?localstorage(\[|\.getitem\s*\()'
- id: refresh-token-field-from-local-storage
  desc: Refresh-token field reads localStorage
  if:
    type: text
    regex: '(?i)refresh_?token["\x27]?\s*:\s*(window\.)?localstorage(\[|\.getitem\s*\()'
composite_rules:
- id: oauth-token-field-from-local-storage
  desc: OAuth token field reads browser local storage
  any:
  - id: access-token-field-from-local-storage
  - id: refresh-token-field-from-local-storage
- id: access-and-refresh-tokens-from-local-storage
  desc: Access and refresh token fields read localStorage
  near_bytes: 1024
  all:
  - id: access-token-field-from-local-storage
  - id: refresh-token-field-from-local-storage
