# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: component
  conf: 0.92
  size_max: 5000000
traits:
- id: sql-select-all-qualified-table
  desc: Selects all columns from qualified SQL table
  crit: notable
  if:
    type: text
    regex: (?i)\bSELECT\s+\*\s+FROM\s+["\w$]+\.["\w$]+\.["\w$]+
