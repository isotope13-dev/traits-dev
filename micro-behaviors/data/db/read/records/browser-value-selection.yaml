defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  - id: browser-secret-value-selection
    desc: SQL selects wildcard or browser secret columns
    if:
      type: text
      exclude_comments: true
      regex: '(?i)SELECT\s+(\*|[^;]{0,80}(password_value|encrypted_value|card_number))[^;]{0,80}\bFROM\b'

  - id: browser-login-identity-selection
    desc: SQL selects browser login usernames
    if:
      type: text
      exclude_comments: true
      regex: '(?i)SELECT\s+[^;()]{0,80}\busername_value\b'

composite_rules:
  - id: browser-credential-value-selection
    desc: SQL selects browser credential values
    any:
      - id: browser-secret-value-selection
      - id: browser-login-identity-selection
