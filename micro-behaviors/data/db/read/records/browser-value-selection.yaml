defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  - id: browser-secret-value-selection
    desc: Selects browser secret value columns
    if:
      type: text
      exclude_comments: true
      regex: '(?i)SELECT\s+[^;]{0,80}\b(password_value|encrypted_value|card_number)\b[^;]{0,80}\bFROM\b'

  - id: browser-secret-wildcard-selection
    desc: Selects all browser credential columns
    if:
      type: text
      exclude_comments: true
      regex: '(?i)SELECT\s+\*\s+FROM\s+[`''"]?(logins|cookies|credit_cards)\b'

  - id: browser-login-identity-selection
    desc: SQL selects browser login usernames
    if:
      type: text
      exclude_comments: true
      regex: '(?i)SELECT\s+[^;()]{0,80}\busername_value\b'

composite_rules:
  - id: browser-credential-value-selection
    desc: SQL selects browser credential values
    any:
      - id: browser-secret-value-selection
      - id: browser-secret-wildcard-selection
      - id: browser-login-identity-selection
