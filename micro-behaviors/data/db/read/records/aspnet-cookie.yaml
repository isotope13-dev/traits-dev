defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
traits:
  - id: aspnet-auth-cookie-query
    desc: Selects ASP.NET authentication cookie records
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bSELECT\b.{0,100}\bFROM\s+cookies\s+WHERE\s+name\s*=\s*[''"]\.ASPXAUTH[''"]'
