# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: component
  conf: 0.92
  size_max: 5000000
traits:
- id: sql-union-select-statement
  desc: SQL UNION SELECT statement marker
  if:
    type: text
    regex: (?i)\bUNION\s+(ALL\s+)?SELECT\b
