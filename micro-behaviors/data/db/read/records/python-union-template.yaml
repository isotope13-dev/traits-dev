defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: union-interpolated-injection-template
    desc: Interpolated UNION SELECT between expressions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\{[^{}\n]{1,40}\}\s+UNION\s+(ALL\s+)?SELECT\s+\{[^\n]{1,120}\}.{0,30}\{[^{}\n]{1,40}\}'
