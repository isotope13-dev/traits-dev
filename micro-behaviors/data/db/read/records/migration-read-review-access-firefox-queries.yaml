defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  id: moz-cookies-sql
  desc: Firefox moz_cookies SQL query
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_cookies
    case_insensitive: true
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  id: moz-formhistory-sql
  desc: Firefox form-history SQL query
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_formhistory
    case_insensitive: true
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  id: firefox-profile-cookie-query
  desc: Firefox profile and cookie query references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
  - id: micro-behaviors/data/db/read/records::moz-cookies-sql
