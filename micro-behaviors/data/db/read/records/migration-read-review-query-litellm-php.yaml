# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
  conf: 0.98
traits:
- id: php-litellm-credentials-query
  desc: PHP queries LiteLLM credentials table
  if:
    type: tree-sitter
    language: php
    query: "((member_call_expression\n  name: (name) @method\n  arguments: (arguments . (argument\n    [(string)\
      \ (encapsed_string)] @sql)))\n  (#match? @method \"(?i)^(query|execute(query)?)$\")\n  (#match? @sql \"(?i)^[\\\
      \"']SELECT[ \\\\t]+[^();]{1,160}FROM\")\n  (#match? @sql \"(?i)FROM.{0,6}LiteLLM_CredentialsTable\\\\b\"))\n"
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
- id: php-litellm-models-query
  desc: PHP queries LiteLLM models table
  if:
    type: tree-sitter
    language: php
    query: "((member_call_expression\n  name: (name) @method\n  arguments: (arguments . (argument\n    [(string)\
      \ (encapsed_string)] @sql)))\n  (#match? @method \"(?i)^(query|execute(query)?)$\")\n  (#match? @sql \"(?i)^[\\\
      \"']SELECT[ \\\\t]+[^();]{1,160}FROM\")\n  (#match? @sql \"(?i)FROM.{0,6}LiteLLM_ProxyModelTable\\\\b\"))\n"
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
