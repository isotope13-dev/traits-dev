---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: chrome-storage-local-get
  desc: Reads data from extension local storage
  if:
    type: symbol
    kind: call
    regex: "^(chrome|browser)\\.storage\\.local\\.get$"
- id: chrome-storage-area-get
  desc: Reads from any extension storage area
  if:
    type: symbol
    kind: call
    regex: "^(chrome|browser)\\.storage\\.(local|sync|session|managed)\\.get$"
- id: chrome-storage-session-get
  desc: Chrome session storage read
  if:
    type: text
    regex: "(chrome|browser)\\.storage\\.session\\.get\\b|storage\\.session\\.get\\("
- id: dom-storage-getitem
  for:
  - javascript
  - typescript
  - html
  desc: Reads browser storage with getItem
  if:
    type: text
    regex: "\\b(localStorage|sessionStorage)\\.getItem\\b"
- id: dom-storage-getitem-call
  desc: Calls localStorage or sessionStorage getItem
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: "^(localStorage|sessionStorage)\\.getItem$"
- id: browser-storage-token-key-read
  desc: Reads token-named Web Storage key
  crit: notable
  conf: 0.93
  if:
    type: symbol
    kind: call
    regex: "^(localStorage|sessionStorage)\\.getItem$"
    arg:
      kind: string
      exact: token
- id: browser-storage-campaign-config-read
  desc: Reads config-named Web Storage key
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: "^(localStorage|sessionStorage)\\.getItem$"
    arg:
      kind: string
      exact: config
- id: browser-storage-campaign-subid-read
  desc: Reads subId-named Web Storage key
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    regex: "^(localStorage|sessionStorage)\\.getItem$"
    arg:
      kind: string
      exact: subId
- id: browser-storage-switch-token-read
  desc: Reads switch/login token from web storage
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "\\b(localStorage|sessionStorage)\\.getItem\\([^)]{0,100}(switchToken|login)"
- id: jwt-key-read
  desc: Reads JWT-named browser storage key
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)localStorage\\.getItem$"
    arg:
      kind: string
      exact: jwt
- id: window-localstorage-getitem
  desc: Reads window.localStorage with getItem
  crit: notable
  conf: 0.82
  for:
  - scripts
  if:
    type: text
    regex: "\\bwindow\\.localStorage\\.getItem\\s*\\("
- id: credential-regex-then-storage-read
  desc: Credential-name test near a storage getter
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: "/(token|jwt|bearer|secret)[^/\\n]{0,48}/i?\\.test\\([\\s\\S]{0,64}\\.getItem\\("
composite_rules:
- id: browser-storage-campaign-state-read
  desc: Reads config, subId and token keys from Web Storage
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/data/db/read::browser-storage-campaign-config-read
  - id: micro-behaviors/data/db/read::browser-storage-campaign-subid-read
  - id: micro-behaviors/data/db/read::browser-storage-token-key-read
