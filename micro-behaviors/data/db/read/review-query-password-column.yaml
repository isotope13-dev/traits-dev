# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 1.0
traits:
- id: password-column-select
  desc: SELECT references a password column
  if:
    type: text
    regex: "(?is)SELECT.{0,160}\\b(\\w*password|user_pass(wd)?)\\b.{0,160}FROM"
