# Database-operation review; matcher and effective scope preserved.
---
defaults: {}
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - powershell
  - scripts
  - source
  id: browser-record-table-select
  desc: SELECT names login, cookie or card table
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)SELECT\b.{0,80}FROM\s+[`'"]?(logins|cookies|credit_cards)\b
