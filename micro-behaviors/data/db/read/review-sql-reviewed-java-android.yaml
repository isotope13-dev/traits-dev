# Database-operation review; matcher and effective scope preserved.
---
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - class
  - java
  - kotlin
  id: credential-column-select-text
  desc: SQL SELECT text names credential columns
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: "(?i)SELECT .{0,80}(username|password|credentials)"
