# Database-operation review; matcher and effective scope preserved.
---
defaults:
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
traits:
- id: js-read-records-call
  desc: Calls record-query API
  platforms:
  - unix
  - android
  - ios
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)readRecords$"
- id: js-health-sample-query-call
  desc: Calls health-sample query API
  platforms:
  - unix
  - android
  - ios
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)query((Quantity|Category|Workout)Samples|StatisticsCollectionForQuantity)$"
composite_rules:
- id: health-connect-record-query
  desc: Health Connect import and record query
  platforms:
  - android
  all:
  - id: metadata/import/npm/react-native-health-connect
  - id: micro-behaviors/data/db/read::js-read-records-call
- id: healthkit-sample-query
  desc: HealthKit import and health-sample query
  platforms:
  - ios
  all:
  - id: metadata/import/npm/kingstinct/react-native-healthkit
  - id: micro-behaviors/data/db/read::js-health-sample-query-call
