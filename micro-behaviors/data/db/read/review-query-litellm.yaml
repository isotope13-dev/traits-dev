# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  - ruby
  - java
  - php
  crit: notable
  conf: 0.98
traits:
- id: litellm-credential-values-query-direct
  desc: Queries LiteLLM provider credential records
  if:
    type: symbol
    kind: call
    regex: "(?i)(^|[._$])(execute(query)?|(raw)?query)(_?raw)?$"
    arg:
      index: 0
      from:
        value: "(?i)(\\*\\s|credential_values\\b)[^();]{0,64}FROM\\s+.?LiteLLM_CredentialsTable\\b"
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
- id: litellm-model-params-query-direct
  desc: Queries LiteLLM model configuration records
  if:
    type: symbol
    kind: call
    regex: "(?i)(^|[._$])(execute(query)?|(raw)?query)(_?raw)?$"
    arg:
      index: 0
      from:
        value: "(?i)(\\*\\s|litellm_params\\b)[^();]{0,64}FROM\\s+.?LiteLLM_ProxyModelTable\\b"
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
- id: go-litellm-credential-values-query-context
  desc: Queries LiteLLM credentials with Go context
  for:
  - go
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)QueryContext$"
    arg:
      index: 1
      from:
        value: "(?i)(\\*\\s|credential_values\\b)[^();]{0,64}FROM\\s+.?LiteLLM_CredentialsTable\\b"
- id: go-litellm-model-params-query-context
  desc: Queries LiteLLM models with Go context
  for:
  - go
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)QueryContext$"
    arg:
      index: 1
      from:
        value: "(?i)(\\*\\s|litellm_params\\b)[^();]{0,64}FROM\\s+.?LiteLLM_ProxyModelTable\\b"
composite_rules:
- id: litellm-credential-values-query
  desc: Queries LiteLLM provider credential records
  any:
  - id: micro-behaviors/data/db/read::litellm-credential-values-query-direct
  - id: micro-behaviors/data/db/read::go-litellm-credential-values-query-context
- id: litellm-model-params-query
  desc: Queries LiteLLM model configuration records
  any:
  - id: micro-behaviors/data/db/read::litellm-model-params-query-direct
  - id: micro-behaviors/data/db/read::go-litellm-model-params-query-context
