# Database-operation review; matcher and effective scope preserved.
---
defaults: {}
traits:
- platforms:
  - windows
  for:
  - go
  - pe
  id: firefox-nss-password-metadata-query
  desc: Queries Firefox NSS password-check metadata
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: SELECT item1, item2 FROM metaData WHERE id = 'password'
    case_insensitive: true
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - "-mirc"
  - "-ircii"
  - "-beam"
  id: moz-cookies-sql
  desc: Firefox moz_cookies SQL query
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_cookies
    case_insensitive: true
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - "-mirc"
  - "-ircii"
  - "-beam"
  id: moz-formhistory-sql
  desc: Firefox form-history SQL query
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: SELECT.{0,80}FROM\s+moz_formhistory
    case_insensitive: true
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  id: firefox-profile-cookie-query
  desc: Firefox profile path and cookie SQL query co-occur
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
  - id: micro-behaviors/data/db/read::moz-cookies-sql
