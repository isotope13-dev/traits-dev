# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - text
  crit: notable
  conf: 0.97
traits:
- id: oauth-token-field-from-local-storage
  desc: OAuth token field reads browser local storage
  if:
    type: text
    regex: (access|refresh)_token["\x27]\s*:\s*localStorage\[
