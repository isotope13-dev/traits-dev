# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
composite_rules:
- id: aws-credential-record-pair-correlation
  desc: SQL correlates stored AWS credential records by source
  crit: notable
  conf: 0.97
  near_lines: 24
  all:
  - id: micro-behaviors/data/db/read::aws-credential-pair-select-projection
  - id: micro-behaviors/data/db/query::credential-record-join
  - id: micro-behaviors/data/db/query::aws-access-key-kind-predicate
  - id: micro-behaviors/data/db/query::aws-secret-key-kind-predicate
  unless:
  - id: metadata/file/profile/security-scanner/
  - id: well-known/tool/detection/threat-intel/
