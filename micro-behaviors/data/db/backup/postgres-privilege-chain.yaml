# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: postgres-switch-wal-call
  desc: PostgreSQL WAL segment switch call
  conf: 0.99
  if:
    type: text
    regex: (?i)\bpg_switch_wal\s*\(\s*\)
