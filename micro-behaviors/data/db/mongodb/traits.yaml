defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: client-port-reference
    desc: References the MongoDB client service port
    conf: 0.82
    if:
      type: text
      word: "27017"
  - id: client-symbol-reference
    desc: References the MongoDB client constructor symbol
    conf: 0.82
    for: [python, javascript, typescript]
    if:
      type: text
      substr: MongoClient
  - id: mongodb-url
    desc: mongodb:// URL scheme
    conf: 0.9
    if:
      type: text
      substr: mongodb://
  - id: mongodb-srv-url
    desc: mongodb+srv:// URL scheme
    conf: 0.9
    if:
      type: text
      substr: mongodb+srv://
  # Credential-shaped userinfo, not a variable reference or scheme mention.
  # Documentation placeholders (mongodb://user:password@localhost) are excluded
  # so published examples do not read as leaked credentials.
  - id: credentialed-mongodb-url
    desc: MongoDB URL embeds authentication info
    conf: 0.94
    for: [javascript, typescript, python, text]
    if:
      type: text
      regex: 'mongodb(\+srv)?://[A-Za-z0-9._%+-]{1,64}:[A-Za-z0-9._%+-]{1,128}@'
    not:
      - regex: '(?i)mongodb(\+srv)?://(username|user|admin|root|test)\s*:\s*(password|passwd|pass|secret|changeme|example|123456|randompassword)\s*@'
      # Synthetic redaction-benchmark and example fixtures name their
      # placeholder credential inline (`synthetic-pass-42`,
      # `db.example.invalid`): no live secret is embedded.
      - regex: '(?i)mongodb(\+srv)?://[^@\s]*(synthetic|example|sample|placeholder|dummy)[^@\s]*@'
      # Seed-list documentation shorthand (`mongodb://u:p@h1:27017,h2:27017/db`
      # — user, password, host numerals) illustrates the URL grammar; single-
      # letter userinfo is a format example, not a credential.
      - regex: '(?i)mongodb(\+srv)?://[a-z]{1,2}:[a-z0-9]{1,4}@'
  - id: go-mongodb
    desc: go.mongodb.org driver
    conf: 0.9
    if:
      type: text
      substr: go.mongodb.org
  - id: pymongo
    desc: Imports the PyMongo database driver
    conf: 0.9
    for: [python]
    if:
      type: import
      regex: '^pymongo(\.|$)'
  - id: python-mongodb-insert-helper
    desc: Inserts records into MongoDB
    conf: 0.9
    for: [python, pe, dll]
    if:
      type: text
      regex: '\binsert_to_db\s*\('
  - id: python-mongodb-client-import
    desc: Imports Python MongoDB client
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: import
      exact: MongoClient
  - id: python-mongodb-client-create
    desc: Creates a Python MongoDB client
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      exact: MongoClient
  - id: python-mongodb-query
    desc: Queries MongoDB collections from Python
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bcoll\.(find|aggregate)\s*\('
  - id: python-mongodb-health-check
    desc: Checks MongoDB server availability
    conf: 0.88
    for: [python]
    if:
      type: text
      substr: client.admin.command(
  - id: mongoose-import
    desc: Imports the Mongoose MongoDB ODM
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: import
      exact: mongoose
  - id: mongodb-client-import
    desc: JavaScript or TypeScript MongoDB driver import
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: import
      exact: mongodb
  - id: mongodb-client-connect
    desc: MongoClient instance connection call
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)MongoClient$'
  - id: mongoose-client-connect
    desc: Mongoose database connection call
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bmongoose\.connect\s*\('
  - id: mongodb-update-write
    desc: MongoDB update write call
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(updateOne|updateMany|findOneAndUpdate)$'
  - id: mongodb-insert-write
    desc: MongoDB insert write call
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)insert(One|Many)$'
  - id: mongodb-replace-write
    desc: MongoDB replace write call
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)replace(One|Many)$'
  - id: mongodb-admin-seed-function
    desc: Function that seeds a MongoDB administrator
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: function
      regex: '(?i)^seed.*admin'

composite_rules:
  - id: mongodb-collection-create
    desc: MongoDB import with collection creation call
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: mongodb-client-import
      - id: micro-behaviors/data/collection/create::named-collection-create-call

  - id: mongodb-index-create
    desc: Creates a MongoDB index
    conf: 0.92
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: mongodb-client-import
      - id: micro-behaviors/data/db/index::database-index-create-call

  - id: python-mongodb-access
    desc: Python MongoDB client and collection access
    conf: 0.95
    for: [python]
    all:
      - id: python-mongodb-client-import
      - id: python-mongodb-client-create
    any:
      - id: python-mongodb-query
      - id: python-mongodb-health-check
