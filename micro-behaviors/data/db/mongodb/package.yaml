# Publication plus credential-shaped userinfo does not establish a live secret,
# credential acquisition, or disclosure across a security boundary. Packages
# also ship error-redaction tests containing these URLs. Retain the package
# observation without treating it as a credential-harvesting objective.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]

composite_rules:
  - id: packaged-credentialed-mongodb-url
    desc: npm package contains a credential-shaped MongoDB URL
    crit: notable
    conf: 0.96
    for: [npm, javascript]
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/data/db/mongodb::credentialed-mongodb-url
