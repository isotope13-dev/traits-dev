# An npm lifecycle declaration and MongoDB account-seeding clues.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]

composite_rules:
  - id: install-hook-mongodb-admin-bcrypt-example
    desc: npm hook and MongoDB admin bcrypt salt clues
    crit: suspicious
    conf: 0.99
    for: [npm, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/data/db/mongodb::mongodb-admin-seed-function
      - id: micro-behaviors/data/db/mongodb::mongodb-client-connect
      - id: micro-behaviors/crypto/hash/digest/bcrypt::bcrypt-example-salt-prefix
    any:
      - id: micro-behaviors/data/db/mongodb::mongodb-update-write
      - id: micro-behaviors/data/db/mongodb::mongodb-insert-write
      - id: micro-behaviors/data/db/mongodb::mongodb-replace-write
