defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, ruby, php]
  crit: notable
  conf: 0.88

traits:
  - id: qdrant-set-payload-call
    desc: Qdrant payload mutation call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(client|qdrant|qdrant_client)\.set_payload$'

  - id: vector-payload-processor-version
    desc: Vector processor_version schema key
    crit: component
    if:
      type: text
      word: processor_version
  - id: vector-payload-pipeline-tier
    desc: Vector pipeline_tier schema key
    crit: component
    if:
      type: text
      word: pipeline_tier
  - id: vector-payload-embedding-identity
    desc: Vector embedding_identity schema key
    crit: component
    if:
      type: text
      word: embedding_identity

  - id: vector-metadata-sentinel-upsert
    desc: Vector metadata sentinel-upsert call
    if:
      type: symbol
      kind: call
      exact: upsert_sentinel

composite_rules:
  - id: vector-payload-default-backfill
    desc: Multiple vector payload schema key references
    crit: notable
    conf: 0.88
    any:
      - id: vector-payload-processor-version
      - id: vector-payload-pipeline-tier
      - id: vector-payload-embedding-identity
  - id: qdrant-default-payload-backfill
    desc: Qdrant default payload backfill
    crit: notable
    conf: 0.94
    all:
      - id: qdrant-set-payload-call
      - id: vector-payload-default-backfill
      - id: vector-metadata-sentinel-upsert
