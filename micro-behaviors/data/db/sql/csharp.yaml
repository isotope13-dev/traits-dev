# C# SQL/Database Traits
# objective: data, behavior: sql
defaults:
  crit: notable
  platforms: [windows]
  for: [csharp]
traits:
  - id: sqlcommand
    desc: SQL command construction or execution
    conf: 0.8
    if:
      type: symbol
      kind: identifier
      exact: "SqlCommand"
  - id: sqlconnection
    desc: SQL database connection
    conf: 0.8
    if:
      type: symbol
      kind: identifier
      exact: "SqlConnection"
  - id: sqldatareader
    desc: SQL data reader
    conf: 0.7
    if:
      type: symbol
      kind: identifier
      exact: "SqlDataReader"
  - id: extension-method
    desc: Extension method definition (can extend
    conf: 0.7
    if:
      type: text
      substr: "this SqlCommand"
