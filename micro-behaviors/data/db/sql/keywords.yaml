defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - source
  crit: component
  conf: 0.92
  size_max: 5000000

traits:
  - id: sql-union-select-statement
    desc: SQL UNION SELECT statement marker
    if:
      type: text
      regex: '(?i)\bUNION\s+(ALL\s+)?SELECT\b'

  - id: sql-drop-object-statement
    desc: SQL DROP object statement marker
    if:
      type: text
      regex: '(?i)DROP\s+(TABLE|VIEW|INDEX)\b'

  - id: sql-delete-from-statement
    desc: SQL DELETE FROM statement marker
    if:
      type: text
      # Require the table identifier.  Prose such as "delete from the whole
      # chain" is not an SQL statement.
      regex: '(?i)\bDELETE\s+FROM\s+[A-Za-z_][A-Za-z0-9_$.\[\]]*'

  - id: sql-insert-into-statement
    desc: SQL INSERT INTO statement marker
    if:
      type: literal
      kind: string
      regex: '(?i)\bINSERT\s+INTO\b'

  - id: sql-update-set-statement
    desc: SQL UPDATE SET statement marker
    if:
      type: text
      regex: '(?i)\bUPDATE\s+[A-Za-z_][A-Za-z0-9_$\.\[\]]*\s+SET\b'

  - id: sql-select-all-qualified-table
    desc: Selects all columns from qualified SQL table
    crit: notable
    if:
      type: text
      regex: '(?i)\bSELECT\s+\*\s+FROM\s+["\w$]+\.["\w$]+\.["\w$]+'

  - id: sql-exec-system-procedure
    desc: SQL EXEC system-procedure marker
    if:
      type: text
      regex: '(?i)\bEXEC\s+(xp_|sp_)[A-Za-z0-9_]+'

  - id: sql-execute-system-procedure
    desc: SQL EXECUTE system-procedure marker
    if:
      type: text
      regex: '(?i)\bEXECUTE\s+(xp_|sp_)[A-Za-z0-9_]+'

composite_rules:
  - id: sql-statement-marker
    desc: SQL statement marker
    crit: component
    conf: 0.92
    any:
      - id: sql-union-select-statement
      - id: sql-drop-object-statement
      - id: sql-delete-from-statement
      - id: sql-insert-into-statement
      - id: sql-update-set-statement
      - id: sql-exec-system-procedure
      - id: sql-execute-system-procedure
