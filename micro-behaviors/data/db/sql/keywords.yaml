defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - source
  crit: component
  conf: 0.92
  size_max: 5000000

traits:
  - id: sql-union-select-statement
    desc: SQL UNION SELECT statement marker
    if:
      type: text
      regex: '(?i)\bUNION\s+(ALL\s+)?SELECT\b'

  - id: sql-select-all-qualified-table
    desc: Selects all columns from qualified SQL table
    crit: notable
    if:
      type: text
      regex: '(?i)\bSELECT\s+\*\s+FROM\s+["\w$]+\.["\w$]+\.["\w$]+'

  - id: sql-exec-system-procedure
    crit: notable
    desc: SQL EXEC system-procedure marker
    if:
      type: text
      regex: '(?i)\bEXEC\s+(xp_|sp_)[A-Za-z0-9_]+'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: sql-execute-system-procedure
    crit: notable
    desc: SQL EXECUTE system-procedure marker
    if:
      type: text
      regex: '(?i)\bEXECUTE\s+(xp_|sp_)[A-Za-z0-9_]+'

composite_rules:
  - id: sql-statement-marker
    desc: SQL statement marker
    crit: component
    conf: 0.92
    any:
      - id: sql-union-select-statement
      - id: micro-behaviors/data/db/schema/delete::sql-drop-object-statement
      - id: micro-behaviors/data/db/delete/row::sql-delete-from-statement
      - id: micro-behaviors/data/db/write/row::sql-insert-into-statement
      - id: micro-behaviors/data/db/write/row::sql-update-set-statement
      - id: sql-exec-system-procedure
      - id: sql-execute-system-procedure
