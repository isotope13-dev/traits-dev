defaults:
  platforms: [unix, windows]
  for: [data, text, json]

traits:
  - id: jdbc-no-driver-error
    desc: JDBC reports no suitable driver
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'No suitable driver found for jdbc:'

  - id: jdbc-sentinel-subprotocol
    desc: JDBC URL uses sentinel subprotocol
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'jdbc:(no|none|invalid|unknown|fake|null|test):\S{1,128}'

  - id: identifier-lookup-database-error
    desc: Database error occurs during identifier lookup
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(Database error|database exception).{0,48}(looking\s+up|lookup)\b'

  - id: values-cast-sql-expression
    desc: SQL VALUES begins a cast expression
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\bVALUES\s+(CAST|ROW)\b'

  # In-memory Derby is also a legitimate database configuration.
  - id: derby-memory-db-url-log
    desc: Derby in-memory database URL logged
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'DB URL:\s*jdbc:derby:memory:\S{0,64}'


composite_rules:
  - id: sentinel-jdbc-driver-error
    desc: Sentinel JDBC URL reaches driver selection
    crit: notable
    conf: 0.98
    near_lines: 1
    all:
      - id: micro-behaviors/data/db/sql::jdbc-no-driver-error
      - id: micro-behaviors/data/db/sql::jdbc-sentinel-subprotocol

