# The table names are LiteLLM's schema, not attacker-selected identifiers.
# These are database operations; legitimate administrators can issue them too.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, ruby, java, php]
  crit: notable
  conf: 0.98
traits:
  - id: litellm-credentials-bulk-query
    desc: Bulk SELECT of LiteLLM provider credentials
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[._])(execute(query)?|(raw)?query)$'
      arg:
        from:
          value: '(?i)^\s*SELECT\s+\*\s+FROM\s+["`\[]?LiteLLM_CredentialsTable\b'

  - id: litellm-models-bulk-query
    desc: Bulk SELECT of LiteLLM model configurations
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[._])(execute(query)?|(raw)?query)$'
      arg:
        from:
          value: '(?i)^\s*SELECT\s+\*\s+FROM\s+["`\[]?LiteLLM_ProxyModelTable\b'
