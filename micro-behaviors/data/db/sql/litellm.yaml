# Quoted child programs can contain SQL without the parent executing a query
# itself. Record the table reference; query-call rules separately bind a SQL
# value to a database API. Neither observation alone establishes theft.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, ruby, java, php]
  crit: notable
  conf: 0.98
traits:
  - id: litellm-credentials-from-clause
    desc: SQL text names LiteLLM credentials table
    if:
      type: string_literal
      regex: '(?i)\bFROM\s+["`]?LiteLLM_CredentialsTable\b'

  - id: litellm-models-from-clause
    desc: SQL text names LiteLLM model table
    if:
      type: string_literal
      regex: '(?i)\bFROM\s+["`]?LiteLLM_ProxyModelTable\b'
