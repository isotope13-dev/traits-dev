# JDBC connection features used by the disclosed Derby-to-H2 execution chain.
# INIT SQL and script-backed triggers are supported H2 mechanics, so the atoms
# remain neutral capabilities. Objective composites require their dangerous
# combination with a process launch or a cross-driver foreignViews bridge.
defaults:
  platforms: [unix, windows]
  for: [data, scripts, text]
  attack: T1059
  mbc: C0058

traits:
  - id: h2-jdbc-init-sql
    desc: H2 JDBC URL executes INIT SQL
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bjdbc:h2:[^\r\n&"'']{0,600};INIT='

  - id: h2-javascript-trigger-source
    desc: H2 creates a JavaScript-backed database trigger
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)\bCREATE(\s|\+)+TRIGGER\b.{1,600}//javascript\b'

  - id: derby-foreignviews-jdbc-bridge
    desc: Derby foreignViews opens an external JDBC URL
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)\bSYSCS_REGISTER_TOOL\s*\(.{0,120}foreignViews.{0,180}\bjdbc:'
