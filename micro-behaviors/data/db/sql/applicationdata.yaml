defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  - php
  - html
  - javascript
  - python
  - vbs
traits:
- id: applicationdata-table-reference
  desc: SQL references the ApplicationData table
  crit: notable
  conf: 0.9
  for:
  - java
  - kotlin
  - groovy
  - scala
  - html
  - javascript
  - python
  - vbs
  if:
    type: text
    regex: \b(FROM|JOIN|from|join)\s+ApplicationData\b
