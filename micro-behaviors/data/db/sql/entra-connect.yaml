defaults:
  for: [scripts, source, pe, dll]
  platforms: [windows]
  attack: T1003

traits:
  - id: entra-connect-connector-secret-columns
    desc: Selects Entra Connect connector secret columns
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bSELECT\s+private_configuration_xml\b'

  - id: entra-connect-connector-secret-table
    desc: Reads Entra Connect management-agent secrets
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bencrypted_configuration\s+FROM\s+mms_management_agent\b'

  - id: entra-connect-key-fields
    desc: Selects Entra Connect key metadata fields
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bSELECT\s+instance_id\s*,\s*keyset_id\s*,\s*entropy\b'

  - id: entra-connect-key-table
    desc: Reads Entra Connect server configuration
    crit: notable
    conf: 0.97
    if:
      type: text
      word: mms_server_configuration

composite_rules:
  - id: entra-connect-connector-configuration
    desc: Queries Entra Connect connector secrets
    crit: suspicious
    conf: 0.98
    all:
      - id: entra-connect-connector-secret-columns
      - id: entra-connect-connector-secret-table

  - id: entra-connect-key-metadata
    desc: Queries Entra Connect key metadata
    crit: notable
    conf: 0.97
    all:
      - id: entra-connect-key-fields
      - id: entra-connect-key-table
