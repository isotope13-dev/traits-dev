defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - json
  - text
traits:
- id: union-credential-column-query-text
  desc: UNION SELECT names credential columns
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bunion\s+(all\s+)?select[^\n;]{0,60}[\s,`"](passw(or)?d|secret|(auth|api)_?token)\b
    case_insensitive: true
  not:
  - regex: (?i)\b(the|a|an|your|their)\s+\S{0,12}$
  - regex: (?i)^union\s+(all\s+)?select(\s+[a-z]+){2,12}$
  - regex: (?i)from\s+password\s+where\s+\w+\s*=\s*\$
  - regex: (?i)union\s+select\s+\d+\s+from\s+password\b
  - regex: (?i)select\s+exists\s*\([^)]*union\s+select\s+\d+\s+from\s+password\b
  - regex: (?i)\.sqlx/query-
- id: union-wp-users-column-query-text
  desc: UNION SELECT names WordPress user columns
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: \bunion\s+(all\s+)?select[^\n;]{0,80}[\s,`"]user_(login|pass)\b
    case_insensitive: true
