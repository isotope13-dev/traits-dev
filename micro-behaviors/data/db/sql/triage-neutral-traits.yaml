---
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-select-message-table
  desc: Selects chat message rows
  conf: 0.93
  if:
    type: text
    regex: "(?i)\\bselect\\b.{0,120}\\bfrom\\s+(message|part)\\b"
- platforms:
  - macos
  for:
  - python
  - shell
  - scripts
  - binaries
  id: imessage-message-table-query
  desc: iMessage chat.db message-table query
  conf: 0.94
  if:
    type: literal
    kind: string
    regex: "(?is)FROM message.{0,240}(handle_id|chat_message_join|is_from_me)"
  unless:
  - id: well-known/lib/ai/agent-utilities::agent-utilities-library-context
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - powershell
  id: chromium-cookie-select-query
  desc: Chromium cookies table SQL query
  conf: 0.8
  if:
    type: text
    regex: "(?is)\\bSELECT\\b.{0,240}\\bhost_key\\b.{0,240}\\bencrypted_value\\b.{0,240}\\bFROM\\s+cookies\\b"
