---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: avanty-ace-event-channel
  desc: Avanty Ace editor event channel
  conf: 0.95
  if:
    type: text
    substr: avantyAceCommunication
- id: metabase-store-access
  desc: Reads Metabase Redux store
  conf: 0.9
  if:
    type: text
    substr: window.Metabase.store
- id: sql-editor-set-value
  desc: Sets SQL editor value
  conf: 0.86
  if:
    type: text
    regex: "(?i)sql.{0,40}editor\\.setValue|editor\\.setValue.{0,40}sql"
- id: avanty-codemirror-event-channel
  desc: Avanty CodeMirror event channel
  conf: 0.95
  if:
    type: text
    substr: avantyCodeMirrorCommunication
- id: pgadmin-sqleditor-container
  desc: Detects pgAdmin SQL editor
  conf: 0.88
  if:
    type: text
    substr: sqleditor-container
- id: pgadmin-csrf-token-read
  desc: Reads pgAdmin CSRF token
  conf: 0.9
  if:
    type: text
    substr: window.pgAdmin.csrf_token
- id: metabase-api-list-databases
  desc: Calls Metabase database list
  conf: 0.9
  if:
    type: text
    substr: "/api/database?include=tables"
- id: metabase-api-database-metadata
  desc: Calls Metabase metadata API
  conf: 0.9
  if:
    type: text
    substr: "/api/database/${e}/metadata"
- id: metabase-api-database-schemas
  desc: Calls Metabase schemas API
  conf: 0.9
  if:
    type: text
    substr: "/api/database/${e}/schemas"
- id: metabase-api-database-fields
  desc: Calls Metabase fields API
  conf: 0.9
  if:
    type: text
    substr: "/api/database/${e}/fields"
- id: metabase-api-card-access
  desc: Calls Metabase saved-card API
  conf: 0.9
  if:
    type: text
    substr: "/api/card/"
- id: metabase-api-native-dataset
  desc: Calls Metabase native dataset
  conf: 0.9
  if:
    type: text
    substr: "/api/dataset/native"
- id: generate-query-path-fragment
  desc: Path fragment /generate-query
  conf: 0.9
  if:
    type: text
    substr: "/generate-query"
- id: ai-debug-sql-endpoint
  desc: AI SQL debug endpoint
  conf: 0.9
  if:
    type: text
    substr: "/debug-sql"
- id: explain-path-fragment
  desc: Explain route path fragment
  conf: 0.86
  if:
    type: text
    substr: "/explain"
- id: ai-comment-sql-endpoint
  desc: AI SQL comment endpoint
  conf: 0.86
  if:
    type: text
    substr: "/add-comments"
composite_rules:
- id: metabase-ace-editor-bridge
  desc: Bridges Metabase Ace editor
  conf: 0.92
  all:
  - id: micro-behaviors/data/db/sql::avanty-ace-event-channel
  - id: micro-behaviors/data/db/sql::metabase-store-access
  - id: micro-behaviors/ui/controls/input::ace-editor-access
  - id: micro-behaviors/data/db/sql::sql-editor-set-value
- id: pgadmin-codemirror-editor-bridge
  desc: Bridges pgAdmin CodeMirror editor
  conf: 0.92
  all:
  - id: micro-behaviors/data/db/sql::avanty-codemirror-event-channel
  - id: micro-behaviors/data/db/sql::pgadmin-sqleditor-container
  - id: micro-behaviors/data/db/sql::pgadmin-csrf-token-read
- id: metabase-api-schema-client
  desc: Calls Metabase schema APIs
  conf: 0.9
  all:
  - id: micro-behaviors/data/db/sql::metabase-api-list-databases
  - id: micro-behaviors/data/db/sql::metabase-api-database-metadata
  - id: micro-behaviors/data/db/sql::metabase-api-database-schemas
  - id: micro-behaviors/data/db/sql::metabase-api-database-fields
- id: metabase-card-sql-client
  desc: Calls Metabase saved-question APIs
  conf: 0.9
  all:
  - id: micro-behaviors/data/db/sql::metabase-api-card-access
  - id: micro-behaviors/data/db/sql::metabase-api-native-dataset
- id: ai-sql-generation-api-client
  desc: Calls AI SQL generation APIs
  conf: 0.9
  all:
  - id: micro-behaviors/data/db/sql::generate-query-path-fragment
  - id: micro-behaviors/data/db/sql::ai-debug-sql-endpoint
  any:
  - id: micro-behaviors/data/db/sql::explain-path-fragment
  - id: micro-behaviors/data/db/sql::ai-comment-sql-endpoint
