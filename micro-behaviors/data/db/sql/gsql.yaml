defaults:
  for: [scripts, source]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: gsql-file-content-query-parameters
    desc: GSQL query takes file and string parameters
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)^CREATE\s+(OR\s+REPLACE\s+)?QUERY\s+[^(){]{1,100}\(\s*FILE\s+\w+\s*,\s*STRING\s+\w+'
  - id: gsql-print-to-file
    desc: GSQL PRINT exports to a file variable
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)(^|[;{])\s*PRINT\s+\w+\s+TO_CSV\s+\w+\s*;'

composite_rules:
  - id: remote-file-query-submit
    desc: Remote GSQL statement submission exposes file and content query parameters
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/db/sql::gsql-file-content-query-parameters
      - id: micro-behaviors/data/db/sql::gsql-print-to-file
      - id: micro-behaviors/communications/http/request/route::gsql-statements-api
    near_bytes: 2048

