defaults:
  platforms: [unix, windows]
  for: [source, scripts, pe, elf, macho]
  crit: notable
  conf: 0.96
traits:
  - id: chromium-history-domain-query
    desc: Domain-filtered Chromium visit query
    if:
      type: string_literal
      regex: '(?i)\bSELECT\s+url\s*,\s*title\s*,\s*visit_count\s+FROM\s+urls\s+WHERE\s+url\s+LIKE\b'
