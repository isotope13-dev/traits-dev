---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: jvm-sql-class-ref
  desc: JVM SQL package reference
  crit: baseline
  conf: 0.86
  for:
  - class
  if:
    type: value
    path: class.class_refs[*]
    regex: "^java/sql(/|$)"
- id: python-sql-f-string
  desc: Builds SQL with Python f-string interpolation
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: \bf["']\s*(SELECT.{0,59}FROM|INSERT\s+INTO|UPDATE.{0,59}\bSET|DELETE\s+FROM).{0,80}\{\w+\}
    case_insensitive: true
- id: sqlite-readonly-connection
  desc: SQLite database opened read-only
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    substr: mode=ro
- id: sql-quoted-tautology-payload
  desc: Quoted SQL tautology payload literal
  crit: notable
  conf: 0.92
  for:
  - python
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: well-known/tool/offensive/framework/bingo::bingo-terminal-context
  - id: well-known/tool/offensive/shadowcat::shadowcat-authorized-pentest-context
  if:
    type: literal
    regex: (?i)["']\s+or\s+["']?1["']?\s*=\s*["']?1
- id: sql-set-password-assignment
  desc: SQL SET password assignment
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: (?i)\bSET\s+["'`\[]?password["'`\]]?\s*=
- id: go-mysql-credential-dsn-format
  desc: MySQL TCP credential DSN format
  crit: notable
  conf: 0.84
  for:
  - go
  - binaries
  - wasm
  if:
    type: text
    substr: "@tcp(%s:3306)"
- id: sqlparser-rust-crate
  desc: Rust sqlparser crate
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "/sqlparser-"
- id: sql-keyword-table
  desc: Embedded SQL keyword table
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: SQL_BIG_RESULT
  unless:
  - id: metadata/build/scaffold::antlr-generated-parser
- id: sqlite-version-func
  desc: SQLite version query fragment
  crit: notable
  for:
  - python
  if:
    type: text
    regex: sqlite_version\(\)\s+IS\s+NOT\s+NULL
- id: mysql-version-comment-var
  desc: MySQL version comment variable
  crit: notable
  for:
  - python
  if:
    type: text
    substr: "@@version_comment"
- id: mssql-servername-var
  desc: MSSQL server name variable
  crit: notable
  for:
  - python
  if:
    type: text
    substr: "@@servername"
- id: sql-disable-foreign-key-checks
  desc: MySQL globally disables foreign-key checks
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "(?i)\\bSET\\s+GLOBAL\\s+FOREIGN_KEY_CHECKS\\s*=\\s*0\\b"
- id: sql-aes-encrypt-function
  desc: SQL AES_ENCRYPT function call
  crit: notable
  conf: 0.93
  for:
  - scripts
  - binaries
  - c
  - cpp
  - go
  if:
    type: literal
    kind: string
    regex: "(?i)\\bAES_ENCRYPT\\s*\\("
  unless:
  - id: metadata/build/scaffold::antlr-generated-parser
composite_rules:
- id: sql-keywords
  desc: Contains several SQL statement types
  crit: notable
  conf: 0.5
  needs: 3
  any:
  - id: micro-behaviors/data/db/read::sql-select
  - id: micro-behaviors/data/db/write::sql-insert
  - id: micro-behaviors/data/db/write::sql-update
  - id: micro-behaviors/data/db/delete::sql-delete
  - id: micro-behaviors/data/db/schema/relational::sql-create-table
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sql-generic
  desc: Uses SQL database operations
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/data/db/sql::sql-keywords
  - id: metadata/import/go/database/sql
  - id: micro-behaviors/data/db/open::sql-open
  - id: micro-behaviors/data/db/sql::sqlparser-rust-crate
  - id: micro-behaviors/data/db/sql::sql-keyword-table
  unless:
  - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
- id: dbms-fingerprint-query-suite
  desc: Multi-DBMS fingerprint query suite
  crit: notable
  conf: 0.93
  needs: 3
  any:
  - id: micro-behaviors/data/db/sql::sqlite-version-func
  - id: micro-behaviors/data/db/sql::mysql-version-comment-var
  - id: micro-behaviors/data/db/sql::mssql-servername-var
