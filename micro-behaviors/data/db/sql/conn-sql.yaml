defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, asp]
traits:
  - id: jvm-sql-class-ref
    desc: JVM SQL package reference
    crit: baseline
    conf: 0.86
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/sql(/|$)'

  - id: sql-select
    desc: SQL SELECT syntax reference
    crit: notable
    conf: 0.6
    # A source-level SELECT token is not enough: Python UI code commonly
    # imports a function named `select`, and prose can contain "select ...
    # from ...". SQL statements are string literals here, so use the literal
    # projection/table shape and keep the parser's structured evidence.
    if:
      type: literal
      kind: string
      regex: '(?i)\bSELECT\s+(DISTINCT\s+)?[\w*`".(),]+(\s+AS\s+\w+)?\s+FROM\s+[\w`".]+'
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - type: text
          substr: "org.junit.jupiter.api.Test"
        - type: text
          substr: "TestGoConverterSingleFile"
        - type: basename
          regex: '(?i)Test\.java##plain'
    unless:
      - id: metadata/lang/generated::openapi-generator-source-banner
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
      - id: metadata/file/string/corpus::hashed-text-record
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
    not:
      # WMI WQL against CIM classes is not a SQL database statement.
      - regex: '(?i)\bFROM\s+Win32_'
      # WMI intrinsic/system classes, event polling, and type tests are WQL,
      # not SQL: SELECT * FROM __InstanceModificationEvent WITHIN 60 WHERE
      # TargetInstance ISA 'Win32_...' is a persistence trigger, not a query.
      - regex: '(?i)\bFROM\s+__[A-Za-z0-9_]+'
      - regex: '(?i)\bWITHIN\s+\d+\s+WHERE\b'
      - regex: '(?i)TargetInstance\s+ISA\b'
  - id: python-sql-f-string
    desc: Builds SQL with Python f-string interpolation
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bf["'']\s*(SELECT.{0,59}FROM|INSERT\s+INTO|UPDATE.{0,59}\bSET|DELETE\s+FROM).{0,80}\{\w+\}'
      case_insensitive: true
  - id: sqlite-readonly-connection
    desc: SQLite database opened read-only
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: 'mode=ro'
  - id: sql-quoted-tautology-payload
    desc: Quoted SQL tautology payload literal
    crit: notable
    conf: 0.92
    for: [python]
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: well-known/tool/offensive/bingo::bingo-terminal-context
      - id: well-known/tool/offensive/shadowcat::shadowcat-authorized-pentest-context
    if:
      type: literal
      regex: '(?i)["'']\s+or\s+["'']?1["'']?\s*=\s*["'']?1'
  - id: sql-messages-table-query
    desc: SQL SELECT query targets messages table
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: '(?is)\bSELECT\b[\s\S]{0,240}\bFROM\s+messages\b'
  - id: sql-prepare-statement
    desc: SQL PREPARE statement declaration
    crit: notable
    conf: 0.9
    for: [scripts, binaries, text]
    if:
      type: text
      regex: '\bPREPARE\s+\w+\s+FROM\b'
      case_insensitive: true
  - id: sql-execute-named-statement
    desc: SQL EXECUTE named statement
    crit: notable
    conf: 0.9
    for: [scripts, binaries, text]
    if:
      type: text
      regex: '(^|[;\n])\s*EXECUTE\s+\w+\s*;'
      case_insensitive: true

  - id: sql-set-password-assignment
    desc: SQL SET password assignment
    crit: notable
    conf: 0.82
    if:
      type: text
      # A bare object property assignment (`url.password = ...`) is not SQL.
      regex: '(?i)\bSET\s+["''`\[]?password["''`\]]?\s*='
  - id: database-sql-import
    desc: database/sql Go import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: database/sql
    for: [go]
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - type: text
          substr: "org.junit.jupiter.api.Test"
        - type: text
          substr: "TestGoConverterSingleFile"
        - type: basename
          regex: '(?i)Test\.java##plain'
  - id: sql-open
    desc: sql.Open Go function
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: sql.Open
  - id: go-sql-open-mysql
    desc: Go opens MySQL database
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: sql.Open
      arg:
        kind: string
        exact: mysql
  - id: go-mysql-credential-dsn-format
    desc: MySQL TCP credential DSN format
    crit: notable
    conf: 0.84
    for: [go, binaries, wasm]
    if:
      type: text
      substr: '@tcp(%s:3306)'
  - id: sqlparser-rust-crate
    desc: Rust sqlparser crate
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /sqlparser-
  - id: sql-keyword-table
    desc: Embedded SQL keyword table
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: SQL_BIG_RESULT
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser
  - id: sqlite-version-func
    desc: SQLite version query fragment
    crit: notable
    for: [python]
    if:
      type: text
      regex: 'sqlite_version\(\)\s+IS\s+NOT\s+NULL'
  - id: mysql-version-comment-var
    desc: MySQL version comment variable
    crit: notable
    for: [python]
    if:
      type: text
      substr: '@@version_comment'
  - id: mssql-servername-var
    desc: MSSQL server name variable
    crit: notable
    for: [python]
    if:
      type: text
      substr: '@@servername'
  - id: sql-disable-foreign-key-checks
    desc: MySQL globally disables foreign-key checks
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bSET\s+GLOBAL\s+FOREIGN_KEY_CHECKS\s*=\s*0\b'

  - id: sql-aes-encrypt-function
    desc: SQL AES_ENCRYPT function call
    crit: notable
    conf: 0.93
    for: [scripts, binaries, c, cpp, go]
    if:
      # Match an SQL statement embedded as data, not a source-level helper
      # named `aes_encrypt`.
      type: literal
      kind: string
      regex: '(?i)\bAES_ENCRYPT\s*\('
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser
  - id: jvm-jdbc-driver-manager
    desc: JVM opens JDBC connections via DriverManager
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: text
      substr: java/sql/DriverManager
composite_rules:
  - id: sql-keywords
    desc: Contains several SQL statement types
    crit: notable
    conf: 0.5
    needs: 3
    any:
      - id: sql-select
      - id: micro-behaviors/data/db/write/row::sql-insert
      - id: micro-behaviors/data/db/write/row::sql-update
      - id: micro-behaviors/data/db/delete/row::sql-delete
      - id: micro-behaviors/data/db/schema/relational::sql-create-table
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: sql-generic
    desc: Uses SQL database operations
    crit: notable
    conf: 0.8
    any:
      - id: sql-keywords
      - id: database-sql-import
      - id: sql-open
      - id: sqlparser-rust-crate
      - id: sql-keyword-table
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: dbms-fingerprint-query-suite
    desc: Multi-DBMS fingerprint query suite
    crit: notable
    conf: 0.93
    needs: 3
    any:
      - id: sqlite-version-func
      - id: mysql-version-comment-var
      - id: mssql-servername-var
  - id: sql-prepared-statement-execution
    desc: SQL prepared statement execution
    crit: notable
    conf: 0.92
    for: [scripts, binaries, text]
    all:
      - id: sql-prepare-statement
      - id: sql-execute-named-statement
