# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  size_min: 512
  size_max: 500000000
traits:
- id: redis-keys-full-keyspace
  desc: Redis KEYS '*' full-keyspace query
  conf: 0.9
  if:
    type: text
    regex: \bKEYS\s+\*(\s|["']|$)
- id: redis-scan-cursor
  desc: Redis SCAN cursor query
  conf: 0.85
  if:
    type: text
    regex: "\\bSCAN\\s+[0-9]+"
composite_rules:
- id: redis-full-keyspace-enumeration
  desc: Redis full-keyspace enumeration
  conf: 0.9
  all:
  - id: micro-behaviors/data/db/redis::redis-cli-tool
  - id: micro-behaviors/data/db/enumerate::redis-keys-full-keyspace
  unless:
  - id: well-known/tool/development/vscode-extension/jinicode::benign-read-only-database-tool-context
- id: redis-cursor-enumeration
  desc: Redis cursor-based key enumeration
  conf: 0.85
  all:
  - id: micro-behaviors/data/db/redis::redis-cli-tool
  - id: micro-behaviors/data/db/enumerate::redis-scan-cursor
