defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: clickhouse-string-limit-disabled
    desc: Sets binary string size limit to zero
    crit: suspicious
    ref: https://depthfirst.com/research/narrow-grants-wide-engines
    if:
      type: text
      regex: '["\x27]format_binary_max_string_size["\x27]\s*:\s*0\s*[,}]'
      exclude_comments: true
