# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: postgres-grant-all-data-roles
  desc: Grants cluster-wide PostgreSQL data roles
  if:
    type: text
    regex: (?i)\bGRANT\s+pg_(read|write)_all_data\b
- id: postgres-grant-function-execute
  desc: Grants execution of stored function
  conf: 0.98
  if:
    type: text
    regex: (?i)\bGRANT\s+EXECUTE\s+ON\s+FUNCTION\b
