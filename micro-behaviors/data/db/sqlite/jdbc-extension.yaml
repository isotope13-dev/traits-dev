defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: jdbc-extension-enabled
    desc: Enables native extensions in SQLite JDBC
    if:
      type: text
      regex: 'jdbc:sqlite:[^"''\r\n]{1,160}[?&]enable_load_extension=true\b'
  - id: sql-load-extension
    desc: SQL statement loads a native extension
    if:
      type: text
      regex: '(?i)\bSELECT\s+load_extension\s*\('
composite_rules:
  - id: jdbc-native-extension-load
    desc: SQLite JDBC enables extensions beside a native library load statement
    crit: suspicious
    ref: https://github.com/geoserver/geoserver/security/advisories/GHSA-wc3v-48j7-xf57
    near_lines: 12
    all:
      - id: jdbc-extension-enabled
      - id: sql-load-extension
