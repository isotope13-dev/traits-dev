defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-sqlite-callback-api
    desc: Registers PHP callback with SQLite
    if:
      type: symbol
      kind: call
      regex: '(?i)^sqlite_create_(aggregate|function)$'
