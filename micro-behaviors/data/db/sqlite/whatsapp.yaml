# Schema references are neutral: legitimate inbox readers use these tables too.
# Private-store path targeting remains in objectives/collection/app-data/messaging.
defaults:
  platforms: [unix, android, ios]
  for: [scripts, source]

traits:
  - id: whatsapp-message-table-name
    desc: WhatsApp message table name
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: ZWAMESSAGE

  - id: whatsapp-media-table-name
    desc: WhatsApp media table name
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: ZWAMEDIAITEM

  - id: whatsapp-message-query
    desc: Database query names WhatsApp message table
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execute$'
      arg:
        index: 0
        from:
          value: 'ZWAMESSAGE'
