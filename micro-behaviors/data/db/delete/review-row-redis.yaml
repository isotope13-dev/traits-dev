# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.94
traits:
- id: redis-flushdb-call
  desc: Calls Redis FLUSHDB database clearing API
  if:
    type: tree-sitter
    kind: call
    regex: "(?i)\\.FLUSHDB\\s*\\("
