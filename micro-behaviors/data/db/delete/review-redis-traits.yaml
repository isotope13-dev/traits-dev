# Database-operation review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: redis-flushall-call
  desc: Redis client FLUSHALL call
  conf: 0.92
  if:
    type: text
    regex: "\\b(redis|redis_db|client|conn)\\.flushall\\s*\\("
