defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: redis-flushdb-call
    desc: Calls Redis FLUSHDB database clearing API
    if:
      # Match the actual call node; awaited calls lack projected target names.
      type: tree-sitter
      kind: call
      regex: '(?i)\.FLUSHDB\s*\('
