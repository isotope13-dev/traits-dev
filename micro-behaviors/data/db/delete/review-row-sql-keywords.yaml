# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: component
  conf: 0.92
  size_max: 5000000
traits:
- id: sql-delete-from-statement
  desc: SQL DELETE FROM statement marker
  if:
    type: text
    regex: "(?i)\\bDELETE\\s+FROM\\s+[A-Za-z_][A-Za-z0-9_$.\\[\\]]*"
