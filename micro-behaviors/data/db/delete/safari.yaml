defaults:
  platforms: [ios, macos]
  for: [objectivec, swift, javascript, typescript, python]
  crit: notable
  conf: 0.98

traits:
  - id: safari-website-data-deletion-selector
    desc: References Safari website-data deletion selector
    # Objective-C selectors may be dispatched through objc_msgSend or a
    # language bridge. A reference does not prove cleanup or evasion.
    if:
      type: symbol
      kind: identifier
      regex: '(^|\.)deleteSafariWebsiteDataRecord(:completionHandler:|_completionHandler_)?$'
