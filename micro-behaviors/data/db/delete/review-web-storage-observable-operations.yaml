# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.96
traits:
- id: dom-storage-removeitem-call
  desc: Deletes an entry from browser storage
  if:
    type: symbol
    kind: call
    regex: "^((window|globalThis)\\.)?(localStorage|sessionStorage)\\.removeItem$"
