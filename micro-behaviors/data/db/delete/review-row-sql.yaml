# Database-operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: sql-delete-clause
  desc: SQL DELETE statement clause
  crit: notable
  conf: 0.5
  if:
    type: literal
    kind: string
    regex: "(?i)\\bDELETE\\s+FROM\\s+[a-z_][a-z0-9_]*\\s+(WHERE|USING|RETURNING|LIMIT)\\b"
- id: sql-delete-order-clause
  desc: SQL DELETE statement ordering clause
  crit: notable
  conf: 0.5
  if:
    type: literal
    kind: string
    regex: "(?i)\\bDELETE\\s+FROM\\s+[a-z_][a-z0-9_]*\\s+ORDER\\s+BY\\b"
- id: sql-delete-terminated
  desc: Terminated SQL DELETE statement
  crit: notable
  conf: 0.5
  if:
    type: literal
    kind: string
    regex: "(?i)\\bDELETE\\s+FROM\\s+[a-z_][a-z0-9_]*\\s*;"
- id: sql-truncate-object
  desc: TRUNCATE SQL object syntax reference
  crit: notable
  conf: 0.8
  if:
    type: literal
    kind: string
    regex: "(?i)\\bTRUNCATE\\s+(TABLE|DATABASE|SCHEMA)\\b"
composite_rules:
- id: sql-delete
  desc: SQL DELETE statement syntax
  crit: notable
  conf: 0.5
  any:
  - id: micro-behaviors/data/db/delete::sql-delete-clause
  - id: micro-behaviors/data/db/delete::sql-delete-order-clause
  - id: micro-behaviors/data/db/delete::sql-delete-terminated
