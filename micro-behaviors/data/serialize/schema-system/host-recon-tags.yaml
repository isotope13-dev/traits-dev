defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, scripts, source]
  crit: component
  conf: 0.9

traits:
  - id: elevated-tag-raw
    desc: Go elevated struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"elevated[,"]'

  - id: elevated-field-text
    desc: Serialized elevated field in text
    if:
      type: text
      regex: '((json|msgpack):"elevated[,"]|["'']elevated["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: processes-tag-raw
    desc: Go processes struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"processes[,"]'

  - id: processes-field-text
    desc: Serialized processes field in text
    if:
      type: text
      regex: '((json|msgpack):"processes[,"]|["'']processes["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: ppid-tag-raw
    desc: Go ppid struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x09-\x2f](json|msgpack):"ppid[,"]'

  - id: ppid-field-text
    desc: Serialized ppid field in text
    if:
      type: text
      regex: '((json|msgpack):"ppid[,"]|["'']ppid["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: os-version-tag-raw
    desc: Go os_version struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"os_version[,"]'

  - id: os-version-field-text
    desc: Serialized os_version field in text
    if:
      type: text
      regex: '((json|msgpack):"os_version[,"]|["'']os_version["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: screens-tag-raw
    desc: Go screens struct tag in binary
    for: [elf, macho, pe]
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"screens[,"]'

  - id: screens-field-text
    desc: Serialized screens field in text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '((json|msgpack):"screens[,"]|["'']screens["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

composite_rules:
  - id: elevated-privilege-field-tag
    desc: Serialized elevated privilege status field
    any:
      - id: elevated-tag-raw
      - id: elevated-field-text

  - id: processes-list-field-tag
    desc: Serialized processes list field
    any:
      - id: processes-tag-raw
      - id: processes-field-text

  - id: ppid-field-tag
    desc: Serialized parent PID field
    any:
      - id: ppid-tag-raw
      - id: ppid-field-text

  - id: os-version-field-tag
    desc: Serialized OS version field
    any:
      - id: os-version-tag-raw
      - id: os-version-field-text

  - id: screens-capture-field-tag
    desc: Serialized display screens list field
    crit: notable
    conf: 0.92
    any:
      - id: screens-tag-raw
      - id: screens-field-text

  - id: serialized-host-privilege-recon-schema
    desc: Serialized privilege and host recon schema
    crit: notable
    conf: 0.96
    all:
      - id: elevated-privilege-field-tag
    any:
      - id: processes-list-field-tag
      - id: ppid-field-tag
      - id: os-version-field-tag
    needs: 2
