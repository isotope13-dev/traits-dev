defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: urlencode-recon-params
  desc: Setup URL encodes host and user fields
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/data/serialize/schema-system::host-user-field-pair
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  unless:
  - id: well-known/app/development/calvyn-code
