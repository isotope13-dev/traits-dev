defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-body-serializes-host-profile
    desc: JSON body includes host identity call
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_comments: true
      regex: 'body\s*:\s*JSON\.stringify\(\s*\{[^}]{0,350}(hostname|userInfo)\s*\('
