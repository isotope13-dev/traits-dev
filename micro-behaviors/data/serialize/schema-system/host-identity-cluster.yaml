defaults:
  platforms: [windows, unix]
  crit: component
  conf: 0.7
  for: [javascript, php, python, java, csharp]
composite_rules:
- id: host-identity-field-cluster
  desc: Identity and Windows field vocabulary
  crit: notable
  conf: 0.75
  near_lines: 40
  any:
  - id: micro-behaviors/data/serialize/schema-system::user-field-key
  - id: micro-behaviors/data/serialize/schema-system::computer-field-key
  - id: micro-behaviors/data/serialize/schema-object::domain-field-key
  - id: metadata/lang/source/syntax/assignment/name::windows-name-assignment
  - id: micro-behaviors/data/db/orm::username-field-peewee
  - id: micro-behaviors/data/db/orm::computer-field-peewee
  - id: micro-behaviors/data/db/orm::python-model-domain-field
  - id: micro-behaviors/data/db/orm::windows-field-peewee
  needs: 3
  unless:
  # A lexicon corpus contains every common word as a key, so field-name
  # coincidence carries no schema meaning there.
  - id: metadata/file/format/wordlist::headword-parts-of-speech-entries
  # C2 victim tracking schema: system info + tasking
