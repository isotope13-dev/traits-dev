defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9
traits:
- id: uuid-username-schema-fields
  desc: UUID and username schema fields
  crit: component
  conf: 0.94
  for: [scripts, source, pe, dll, elf, macho]
  if:
    type: text
    regex: '(?is)\\?["'']uuid\\?["'']\s*:.{0,160}\\?["'']username\\?["'']\s*:'
- id: computer-internal-ip-schema-fields
  desc: Computer and internal-IP schema fields
  crit: component
  conf: 0.94
  for: [scripts, source, pe, dll, elf, macho]
  if:
    type: text
    regex: '(?is)\\?["'']computer\\?["'']\s*:.{0,160}\\?["'']internal_ip\\?["'']\s*:'
- id: process-pid-schema-fields
  desc: Process and PID schema fields
  crit: component
  conf: 0.94
  for: [scripts, source, pe, dll, elf, macho]
  if:
    type: text
    regex: '(?is)\\?["'']process\\?["'']\s*:.{0,160}\\?["'']pid\\?["'']\s*:'
- id: arch-admin-schema-fields
  desc: Architecture and admin-state schema fields
  crit: component
  conf: 0.94
  for: [scripts, source, pe, dll, elf, macho]
  if:
    type: text
    regex: '(?is)\\?["'']arch\\?["'']\s*:.{0,160}\\?["'']is_admin\\?["'']\s*:'
composite_rules:
- id: host-process-privilege-profile-schema
  desc: Structured host process and privilege profile
  crit: notable
  conf: 0.97
  for: [scripts, source, pe, dll, elf, macho]
  near_bytes: 1200
  all:
  - id: micro-behaviors/data/serialize/schema-system::uuid-username-schema-fields
  - id: micro-behaviors/data/serialize/schema-system::computer-internal-ip-schema-fields
  - id: micro-behaviors/data/serialize/schema-system::process-pid-schema-fields
  - id: micro-behaviors/data/serialize/schema-system::arch-admin-schema-fields
