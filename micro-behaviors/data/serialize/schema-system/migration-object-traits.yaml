defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9

traits:
- id: host-field-key
  crit: notable
  desc: JSON-like host or hostname field
  if:
    type: text
    regex: '["''](host|hostname)["'']\s*:'
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: home-directory-field-key
  crit: notable
  desc: JSON-like home or current-directory field
  if:
    type: text
      # A preceding { or comma is an object key. A ternary ("home":"other")
      # uses the same quotes-and-colon spelling for a string value.
    regex: '[{,]\s*["''](home|home_directory|current_directory)["'']\s*:'
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: user-field-key
  crit: notable
  desc: User identity key in object-like text
  if:
      # Case conventions on identity key names vary (username, userName,
      # LoginName), and the claim is about the key's meaning, not its spelling.
    case_insensitive: true
    regex: '([{,]|\barray\()\s*["''](user|username|whoami|login|loginname)["'']\s*[:=]'
    type: text
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: computer-field-key
  for: [scripts, source, json, pe, dll]
  crit: notable
  desc: JSON-like computer name field
  if:
    type: text
    regex: '(?i)["'']computer(_name)?["'']\s*:'

- id: platform-field-key
  crit: notable
  desc: JSON-like platform or OS field
  conf: 0.86
  if:
    type: text
    regex: '[{,]\s*["''](platform|os|os_info)["'']\s*:'
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: runtime-version-field-key
  desc: JSON-like platform or interpreter version field
  for: [scripts, source, json, python]
  if:
    type: text
    regex: '["''](platform_release|platform_version|python_version|python_executable)["'']\s*:'

composite_rules:
- id: host-user-field-pair
  desc: JSON-like host and user identity fields
  crit: notable
  conf: 0.9
  near_bytes: 500
  all:
  - id: micro-behaviors/data/serialize/schema-system::host-field-key
  - id: micro-behaviors/data/serialize/schema-system::user-field-key

- id: user-path-profile-fields
  desc: JSON-like user or home-path field
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/data/serialize/schema-system::user-field-key
  - id: micro-behaviors/data/serialize/schema-system::home-directory-field-key

- id: compact-host-profile-fields
  desc: Compact host-profile field set
  needs: 3
  any:
  - id: micro-behaviors/data/serialize/schema-system::host-field-key
  - id: micro-behaviors/data/serialize/schema-object::environment-field-key
  - id: micro-behaviors/data/serialize/schema-credential::pwd-passwd-field-key
  - id: micro-behaviors/data/serialize/schema-system::home-directory-field-key
  - id: micro-behaviors/data/serialize/schema-system::user-field-key
  - id: micro-behaviors/data/serialize/schema-object::ipv4-field-value
  - id: micro-behaviors/data/serialize/schema-system::platform-field-key

