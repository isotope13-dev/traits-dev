defaults:
  platforms: [windows, unix]
  for: [scripts, javascript, typescript, shell, rust, java, csharp, groovy, json]
  crit: component
  conf: 0.4

traits:
  - id: command-assignment-key
    desc: Command field or assignment key
    # Callback parameters and interface members are not serialized fields.
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\b["'']?(cmd|command)["'']?\s*[:=]'

  - id: result-assignment-key
    desc: Result field or assignment key
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)["'']?result["'']?\s*[:=]'

composite_rules:
  - id: command-result-word
    desc: Command/result assignment pair
    crit: component
    conf: 0.4
    near_lines: 8
    all:
      - id: command-assignment-key
      - id: result-assignment-key
