defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, scripts, source]
  crit: component
  conf: 0.9

traits:
  # Go compiles struct reflection tags into .rodata with a leading varint length
  # byte (`\x0b`..`\x2f`) rather than a (ptr, len) string header, so compiled
  # Go binaries require a binary-scoped raw match paired with text matching.
  - id: command-id-tag-raw
    desc: Go command_id struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"command_id[,"]'

  - id: command-id-field-text
    desc: Serialized command_id field in text
    if:
      type: text
      regex: '((json|msgpack):"command_id[,"]|["'']command_id["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: job-id-tag-raw
    desc: Go job_id struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"job_id[,"]'

  - id: job-id-field-text
    desc: Serialized job_id field in text
    if:
      type: text
      regex: '((json|msgpack):"job_id[,"]|["'']job_id["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: job-type-tag-raw
    desc: Go job_type struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"job_type[,"]'

  - id: job-type-field-text
    desc: Serialized job_type field in text
    if:
      type: text
      regex: '((json|msgpack):"job_type[,"]|["'']job_type["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: term-id-tag-raw
    desc: Go term_id struct tag in binary
    for: [elf, macho, pe]
    crit: notable
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"term_id[,"]'

  - id: term-id-field-text
    desc: Serialized term_id field in text
    crit: notable
    if:
      type: text
      regex: '((json|msgpack):"term_id[,"]|["'']term_id["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: channel-id-tag-raw
    desc: Go channel_id struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"channel_id[,"]'

  - id: channel-id-field-text
    desc: Serialized channel_id field in text
    if:
      type: text
      regex: '((json|msgpack):"channel_id[,"]|["'']channel_id["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: encrypt-key-tag-raw
    desc: Go encrypt_key struct tag in binary
    for: [elf, macho, pe]
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"encrypt_key[,"]'

  - id: encrypt-key-field-text
    desc: Serialized encrypt_key field in text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '((json|msgpack):"encrypt_key[,"]|["'']encrypt_key["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

  - id: addresses-tag-raw
    desc: Go addresses struct tag in binary
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[\x0b-\x2f](json|msgpack):"addresses[,"]'

  - id: addresses-field-text
    desc: Serialized addresses field in text
    if:
      type: text
      regex: '((json|msgpack):"addresses[,"]|["'']addresses["'']\s*:)'
    unless:
      - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

composite_rules:
  - id: command-id-envelope-field
    desc: Serialized command_id dispatch field
    any:
      - id: command-id-tag-raw
      - id: command-id-field-text

  - id: job-id-envelope-field
    desc: Serialized job_id tracking field
    any:
      - id: job-id-tag-raw
      - id: job-id-field-text

  - id: job-type-envelope-field
    desc: Serialized job_type dispatch field
    any:
      - id: job-type-tag-raw
      - id: job-type-field-text

  - id: term-id-envelope-field
    desc: Serialized term_id session field
    crit: notable
    any:
      - id: term-id-tag-raw
      - id: term-id-field-text

  - id: channel-id-envelope-field
    desc: Serialized channel_id multiplex field
    any:
      - id: channel-id-tag-raw
      - id: channel-id-field-text

  - id: encrypt-key-profile-field
    desc: Serialized encrypt_key profile field
    crit: notable
    conf: 0.94
    any:
      - id: encrypt-key-tag-raw
      - id: encrypt-key-field-text

  - id: addresses-profile-field
    desc: Serialized endpoint addresses field
    any:
      - id: addresses-tag-raw
      - id: addresses-field-text

  - id: serialized-task-job-dispatch-envelope
    desc: Serialized command_id and job dispatch schema
    crit: notable
    conf: 0.95
    all:
      - id: command-id-envelope-field
      - id: job-id-envelope-field
    any:
      - id: job-type-envelope-field
      - id: channel-id-envelope-field
      - id: term-id-envelope-field

  - id: encrypted-endpoint-profile-schema
    desc: Serialized encrypt_key and addresses schema
    crit: suspicious
    conf: 0.95
    all:
      - id: encrypt-key-profile-field
      - id: addresses-profile-field
