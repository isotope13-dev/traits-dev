# Calls to a decode/parse/unpack/deserialize helper, keyed only on the callee
# name. Nothing here establishes *what* is being decoded: `parseJsonc`,
# `parse_result` (an llvm-libc StrToNumResult declaration), and `parseConfig`
# all match. They are baseline structured-data parse steps; composites that
# care about a specific source (an EVM contract response, a C2 envelope) pair
# them with the request that produced the payload.
defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, typescript, c, cpp, csharp, pe, dll]
  crit: baseline
  conf: 0.85

traits:
  - id: json-decoder-name-call
    desc: Calls a JSON decode or parse helper
    if:
      type: symbol
      kind: call
      regex: '(?i)^(decode|parse|unpack|deserialize)[A-Za-z0-9_]*json[A-Za-z0-9_]*$'

  - id: result-decoder-name-call
    desc: Calls a result decode or parse helper
    if:
      type: symbol
      kind: call
      regex: '(?i)^(decode|parse|unpack|deserialize)[A-Za-z0-9_]*result[A-Za-z0-9_]*$'

  - id: config-decoder-name-call
    desc: Calls a config decode or parse helper
    if:
      type: symbol
      kind: call
      regex: '(?i)^(decode|parse|unpack|deserialize)[A-Za-z0-9_]*config[A-Za-z0-9_]*$'
