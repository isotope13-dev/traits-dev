defaults:
  crit: notable
  for: [go]
  platforms: [linux, macos, windows]
traits:
  - id: map-string-interface-envelope
    desc: Parses generic map[string]interface{} envelope
    conf: 0.8
    if:
      type: text
      regex: 'envelope\s+map\[string\]interface\{\}'

  # The GitHub Gist API returns `{files: {<name>: {content: "..."}}}`; walking a
  # files map into a nested content field reads that response envelope. Neutral
  # alone - the Gist dead-drop composites supply the API-endpoint context.
  - id: files-map-content-field-read
    desc: Reads content field from a files map
    conf: 0.85
    for: [scripts, source, json]
    if:
      type: text
      regex: '\bfiles\b["'']?\]?[^;\n]{0,40}[.\[]["'']?content\b'

  - id: json-type-field
    desc: 'JSON object has a type key'
    crit: baseline
    conf: 0.9
    for: [scripts, go, rust, c, cpp, java, csharp]
    if:
      type: text
      regex: '(?i)(["'']type["'']\s*:|json\s*:\s*["'']type["''])'

  - id: auth-message-type-field
    desc: Serialized message uses auth type
    crit: notable
    conf: 0.82
    for: [scripts, source]
    if:
      type: text
      regex: 'type:\s*["'']auth["'']'

  - id: json-channel-field
    desc: JSON object channel field fragment
    conf: 0.9
    for: [scripts, go, rust, c, cpp, java, csharp]
    if:
      type: text
      regex: '(?i)(["'']channel["'']\s*:|json\s*:\s*["'']channel["''])'

  - id: json-sequence-field
    desc: JSON object sequence field fragment
    conf: 0.9
    for: [scripts, go, rust, c, cpp, java, csharp]
    if:
      type: text
      regex: '(?i)(["'']seq(uence)?["'']\s*:|json\s*:\s*["'']seq(uence)?["''])'

  - id: json-checksum-field
    desc: JSON object checksum field fragment
    conf: 0.9
    for: [scripts, go, rust, c, cpp, java, csharp]
    if:
      type: text
      regex: '(?i)(["'']checksum["'']\s*:|json\s*:\s*["'']checksum["''])'

  - id: json-payload-field
    desc: JSON object payload field fragment
    conf: 0.9
    for: [scripts, go, rust, c, cpp, java, csharp]
    if:
      type: text
      regex: '(?i)(["'']payload["'']\s*:|json\s*:\s*["'']payload["''])'
