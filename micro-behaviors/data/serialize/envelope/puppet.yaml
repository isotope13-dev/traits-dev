defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: puppet-rich-object-type
    desc: Puppet rich-data object type declaration
    if:
      type: text
      regex: '"__ptype"\s*:\s*"Object\s*\['

composite_rules:
  - id: puppet-rich-data-ruby-code
    desc: Serialized Puppet object carries Ruby code
    all:
      - id: puppet-rich-object-type
      - id: micro-behaviors/metaprogramming/generation/source::puppet-ruby-method-body
    near_bytes: 512
