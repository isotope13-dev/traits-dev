defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-yaml-parser-import
    desc: Imports JavaScript YAML parser
    conf: 0.9
    if:
      type: import
      exact: yaml

  - id: javascript-yaml-load
    desc: JavaScript parses YAML with yaml.load
    conf: 0.9
    if:
      type: text
      regex: '\byaml\.load\s*\('

  - id: javascript-yaml-dump
    desc: JavaScript serializes data with yaml.dump
    conf: 0.88
    if:
      type: text
      regex: '\byaml\.dump\s*\('
