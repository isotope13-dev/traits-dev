defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: yaml-v3-import
    desc: Imports the Go YAML v3 parser
    if:
      type: import
      exact: gopkg.in/yaml.v3

  - id: yaml-unmarshal
    desc: Unmarshals YAML data in Go
    if:
      type: symbol
      kind: call
      exact: yaml.Unmarshal

composite_rules:
  - id: go-yaml-parser
    desc: Go source parses YAML data
    crit: notable
    conf: 0.92
    all:
      - id: yaml-v3-import
      - id: yaml-unmarshal
