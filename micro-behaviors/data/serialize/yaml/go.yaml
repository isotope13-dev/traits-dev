defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: yaml-v3-import
    desc: Imports the Go YAML v3 parser
    if:
      type: import
      exact: gopkg.in/yaml.v3

  - id: yaml-unmarshal
    desc: Unmarshals YAML data in Go
    if:
      type: symbol
      kind: call
      exact: yaml.Unmarshal
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: ghodss-yaml-import
    desc: Imports Go YAML-to-JSON parser
    if:
      type: import
      exact: github.com/ghodss/yaml

  - id: ghodss-yaml-to-json
    desc: Converts YAML data to JSON in Go
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: yaml.YAMLToJSON

composite_rules:
  - id: go-yaml-parser
    desc: Go source parses YAML data
    crit: notable
    conf: 0.92
    all:
      - id: yaml-v3-import
      - id: yaml-unmarshal

  - id: go-yaml-to-json-parser
    desc: Go source converts YAML to JSON
    crit: notable
    conf: 0.92
    all:
      - id: ghodss-yaml-import
      - id: ghodss-yaml-to-json
