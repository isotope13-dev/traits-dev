defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: yaml-load-call
    desc: "Python yaml.load call"
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '\byaml\.load\s*\('
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/security-scanner::python-taint-sink-map
  - id: yaml-loader-unsafe
    desc: "Selects unsafe PyYAML Loader (yaml.Loader)"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Loader\s*=\s*yaml\.Loader'
  - id: yaml-unsafe-load
    desc: "Explicit unsafe YAML deserialization"
    crit: notable
    if:
      type: text
      regex: 'yaml\.unsafe_load\s*\('
  # Remote-input yaml.load: the parsed document comes straight from an HTTP
  # response body (a .text/.content property, an inline requests.get/post, or
  # a urlopen read). Establishes the remote-source dataflow that composites
  # need before inferring dropper/RCE intent; a local yaml.load
  # (e.g. yaml.load(open("cfg.yml"))) does not match.
  - id: yaml-load-network-response
    desc: "yaml.load parses an HTTP response body"
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'yaml\.load\s*\(\s*(\w+\.(text|content)\b|requests\.(get|post)\(|([\w.]+\.)?urlopen\()'
