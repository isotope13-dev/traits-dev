defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

# Record fields alone establish neither an HTTP body nor its transmission.
traits:
  - id: js-quoted-identity-password-fields
    desc: Quoted identity and password record fields
    crit: notable
    conf: 0.9
    if:
      type: text
      # Quoted JSON keys with a non-empty password value. Skips URL
      # destructure (`username:p,password:m`), empty userinfo
      # (`username:"",password:""`), and React input-type maps
      # (`email:!0,password:!0`).
      #
      # The leading `[{,]` pins both keys to object-literal position and the
      # gap forbids statement punctuation, so a switch over URL component
      # names -- `case"username":...break;case"password":` in
      # urlpattern-polyfill -- no longer reads as one credential record.
      regex: '[{,]\s*["''](email|username)["'']\s*:\s*[^;{}]{0,80}["'']password["'']\s*:\s*.{0,8}[A-Za-z]'

composite_rules:
  - id: js-identity-password-object-fields
    desc: Email or username and password object fields
    crit: notable
    conf: 0.93
    any:
      - id: js-quoted-identity-password-fields
      - id: micro-behaviors/communications/http/request/body::js-body-shorthand-email-password

