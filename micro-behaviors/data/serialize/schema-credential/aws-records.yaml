defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-aws-shared-credential-record-extraction
    desc: Returns multiple AWS credential-shaped records
    crit: notable
    conf: 0.98
    count_min: 2
    if:
      type: text
      regex: '\?\.aws_access_key_id&&\w+\?\.aws_secret_access_key\)\{return\{'
