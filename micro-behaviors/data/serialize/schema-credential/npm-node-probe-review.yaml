defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: ci-token-names-near-credential-payload
    desc: CI token names near payload credential field
    crit: suspicious
    conf: 0.95
    attack: "T1195.002,T1552"
    if:
      type: text
      regex: "\\bGITHUB_TOKEN\\b[^\\r\\n]{0,120}\\bNPM_TOKEN\\b[^\\r\\n]{0,220}payload\\.ci_creds"
