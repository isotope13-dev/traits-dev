defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: fetch-json-browser-secret-fields
    desc: Fetch body contains cookies and passwords
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (identifier) @fetch
          arguments: (arguments
            (_)
            (object
              (pair
                key: (property_identifier) @body
                value: (call_expression
                  function: (member_expression
                    object: (identifier) @json
                    property: (property_identifier) @stringify)
                  arguments: (arguments
                    (object
                      (pair
                        key: (property_identifier) @data
                        value: (object
                          (pair key: (property_identifier) @cookies)
                          (pair key: (property_identifier) @passwords)))))))))
          (#eq? @fetch "fetch")
          (#eq? @body "body")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @data "data")
          (#eq? @cookies "cookies")
          (#eq? @passwords "passwords")) @request
