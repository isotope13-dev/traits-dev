defaults:
  for:
  - python
  - shell
  - javascript
  platforms:
  - unix
traits:
- id: secret-record-true-field
  desc: Secret-marked record isSecret=true field
  crit: notable
  conf: 0.98
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -pyc
  - -staticlib
  - -elixir
  - -clojure
  if:
    type: string_literal
    regex: (?i)isSecret\\*["']?\s*[:=]\s*true
