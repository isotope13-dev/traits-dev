traits:
  - id: python-password-variable-field
    crit: notable
    conf: 0.85
    desc: Password variable assigned to dictionary field
    for: [python]
    platforms: [windows, unix]
    unless:
      - type: text
        substr: 'return cls(scheme, {"username": username, "password": password})'
      - type: text
        substr: "proxy_password"
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
    if:
      type: text
      regex: '"password":\s*password'
