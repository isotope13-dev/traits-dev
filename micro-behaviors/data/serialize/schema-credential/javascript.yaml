defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  # A hardcoded service record is a useful neutral fact for package-level
  # composites.  Keep the keys and values in one object, and require literal
  # strings for all three fields; a password field by itself is common in
  # configuration UIs and API clients.
  - id: hardcoded-service-credential-object
    crit: notable
    conf: 0.94
    desc: Object embeds host, user, and password literals
    if:
      type: tree-sitter
      language: javascript
      query: |
          ((object
            (pair key: (property_identifier) @host_key value: (string) @host_value)
            (_)*
            (pair key: (property_identifier) @username_key value: (string) @username_value)
            (_)*
            (pair key: (property_identifier) @password_key value: (string) @password_value)
           )
           (#match? @host_key "(?i)^(host|hostname|server)$")
           (#match? @host_value "^['\"][^'\"]{1,200}['\"]$")
           (#match? @username_key "(?i)^(user|username|account)$")
           (#match? @username_value "^['\"][^'\"]{1,80}['\"]$")
           (#match? @password_key "(?i)^(pass|passwd|password)$")
           (#match? @password_value "^['\"][^'\"]{3,200}['\"]$")
          )
          ((object
            (pair key: (property_identifier) @host_key value: (string) @host_value)
            (_)*
            (pair key: (property_identifier) @password_key value: (string) @password_value)
            (_)*
            (pair key: (property_identifier) @username_key value: (string) @username_value)
           )
           (#match? @host_key "(?i)^(host|hostname|server)$")
