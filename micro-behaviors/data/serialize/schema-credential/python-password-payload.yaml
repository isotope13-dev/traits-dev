defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-password-payload-field
    desc: Password key in Python data/payload dictionary
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(data|payload)\s*=\s*\{[^{}\n]{0,180}["''](password|passwd|pass)["'']\s*:'

