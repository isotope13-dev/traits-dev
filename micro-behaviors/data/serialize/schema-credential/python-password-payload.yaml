defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-password-payload-field
    desc: Password key in Python data/payload dictionary
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(data|payload)\s*=\s*\{[^{}\n]{0,180}["''](password|passwd|pass)["'']\s*:'

  # The identifier is the observation. A login client, a stored-password
  # record, and a guessing loop can all bind this key; only the loop plus a
  # request establishes guessing.
  - id: password-key-pw-candidate
    desc: Password key maps pw or candidate
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']password["'']\s*:\s*(pw|candidate)\b'

