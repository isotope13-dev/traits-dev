defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-return-access-refresh-token-record
    desc: Returns an access/refresh token record
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((return_statement
          (object
            (pair key: (property_identifier) @first)
            (pair key: (property_identifier) @second))) @record
          (#match? @first "^(access_token|refresh_token)$")
          (#match? @second "^(access_token|refresh_token)$")
          (#not-eq? @first @second))
