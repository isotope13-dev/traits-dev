defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: script-aws-credential-parameter-name
    for: [python, powershell, shell]
    desc: AWS credential parameter-name reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bAWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN)\b'
