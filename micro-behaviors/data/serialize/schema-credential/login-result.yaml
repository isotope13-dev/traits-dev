defaults:
  platforms: [unix, android, ios]

traits:
  - id: password-login-result-record
    desc: Password beside serialized login result
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      # Require the submitted password beside serialization of a login result.
      regex: '(?i)\bpass\b.{0,320}JSON\.stringify\((resp|postRes\.(data|body))'

  - id: login-result-field
    desc: Serialized login_result status field
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html, php, python]
    if:
      type: text
      regex: '(?i)(["'']login_result["'']\s*:|\blogin_result\s*:)'

  - id: mfa-status-field
    desc: Serialized MFA_status state field
    crit: notable
    conf: 0.94
    for: [javascript, typescript, html, php, python]
    if:
      type: text
      regex: '(?i)(["'']mfa_status["'']\s*:|\bmfa_status\s*:|\.mfa_status\b)'

  - id: session-ss-id-field
    desc: Serialized ss_id session correlation field
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html, php, python]
    if:
      type: text
      regex: '(?i)(["'']ss_id["'']\s*:|\bss_id\s*:|\.ss_id\b|\[\s*["'']ss_id["'']\s*\])'

  - id: auth-handler-mfa-update-methods
    desc: AuthHandler updateMfaComplete method
    crit: notable
    conf: 0.96
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\b(AuthHandler|updateMfaComplete)\b'

