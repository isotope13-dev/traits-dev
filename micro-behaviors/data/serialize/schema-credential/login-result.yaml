defaults:
  platforms: [unix, android, ios]

traits:
  - id: password-login-result-record
    desc: Password beside serialized login result
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      # Require the submitted password beside serialization of a login result.
      regex: '(?i)\bpass\b.{0,320}JSON\.stringify\((resp|postRes\.(data|body))'

