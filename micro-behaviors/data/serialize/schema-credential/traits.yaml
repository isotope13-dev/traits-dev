defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - json
  crit: notable
  conf: 0.96
traits:
- id: api-key-field-name
  desc: API-key field key
  if:
    type: text
    regex: '["'']api[_-]?key["'']\s*(:|=>)'
    case_insensitive: true
- id: access-token-field-name
  desc: Access-token field key
  if:
    type: text
    regex: '["'']access[_-]?token["'']\s*(:|=>)'
    case_insensitive: true
- id: private-key-field-name
  desc: Private-key field key
  if:
    type: text
    regex: '["'']private[_-]?key["'']\s*(:|=>)'
    case_insensitive: true
