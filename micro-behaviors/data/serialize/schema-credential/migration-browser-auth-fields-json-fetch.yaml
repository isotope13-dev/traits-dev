defaults:
  platforms: [windows, unix]
  for: [text]
traits:
- id: public-access-token-field
  desc: Public access token field
  crit: component
  if:
    type: text
    substr: public_access_token
- id: public-refresh-token-field
  desc: Public refresh token field
  crit: component
  if:
    type: text
    substr: public_refresh_token
- id: admin-access-token-field
  desc: Admin access token field
  crit: component
  if:
    type: text
    substr: admin_access_token
- id: admin-refresh-token-field
  desc: Admin refresh token field
  crit: component
  if:
    type: text
    substr: admin_refresh_token
composite_rules:
- id: browser-auth-token-set
  desc: Browser access and refresh token fields with cookies
  crit: notable
  all:
  - id: micro-behaviors/data/serialize/schema-credential::public-access-token-field
  - id: micro-behaviors/data/serialize/schema-credential::public-refresh-token-field
  - id: micro-behaviors/data/serialize/schema-credential::admin-access-token-field
  - id: micro-behaviors/data/serialize/schema-credential::admin-refresh-token-field
  - id: micro-behaviors/data/serialize/schema-cookie::cookies-field
