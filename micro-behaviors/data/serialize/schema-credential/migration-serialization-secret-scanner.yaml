defaults:
  conf: 0.97
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- id: trufflehog-message-body-detector-field
  desc: Message body precedes secret-detector field
  crit: notable
  if:
    type: text
    regex: (?i)["'](text|body|content|payload)["']\s*:[\s\S]{0,480}["']DetectorName["']
- id: trufflehog-detector-raw-fields
  desc: Secret-detector field precedes raw-secret field
  crit: notable
  if:
    type: text
    regex: (?i)["']DetectorName["'][\s\S]{0,320}["']Raw(V2)?["']
composite_rules:
- id: trufflehog-raw-result-message-body
  desc: Message payload with raw secret-detector result
  crit: suspicious
  near_bytes: 64
  all:
  - id: micro-behaviors/data/serialize/schema-credential::trufflehog-message-body-detector-field
  - id: micro-behaviors/data/serialize/schema-credential::trufflehog-detector-raw-fields
