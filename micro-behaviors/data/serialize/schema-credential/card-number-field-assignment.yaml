traits:
- platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - php
  - html
  id: card-number-field-assignment
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Assigns card number or PAN field
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?m)(^|[{,])\s*(["']?(?i:card_?number)["']?|["']PAN["'])[:=]\s*[^"'\s]
