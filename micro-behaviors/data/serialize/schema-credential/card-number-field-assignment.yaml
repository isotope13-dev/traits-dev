traits:
- platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - php
  - html
  id: card-number-field-assignment
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: metadata/package/documentation/page::static-documentation-html-page
  - id: metadata/lang/generated::generated-apollo-icon-enum-source
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  desc: Assigns card number or PAN field
  crit: notable
  conf: 0.75
  if:
    type: text
    # Require a number-bearing object key and an unquoted value. A bare
    # creditcard key occurs in public-suffix tables; quoted values can be
    # emoji mappings. Only quoted uppercase PAN avoids chart/network API names.
    regex: (?m)(^|[{,])\s*(["']?(?i:(credit[ _-]?)?card[ _-]?number)["']?|["']PAN["'])[:=]\s*[^"'\s]
  not:
    - regex: '(?i)[:=]\s*(string|number|boolean|any|unknown)\b'
