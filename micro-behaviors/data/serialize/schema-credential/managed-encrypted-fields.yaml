defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: encrypted-username-field-reference
    desc: encryptedUsername credential-field reference
    if:
      type: text
      exact: encryptedUsername
  - id: encrypted-password-field-reference
    desc: encryptedPassword credential-field reference
    if:
      type: text
      exact: encryptedPassword
  # The exact-match siblings above miss Go struct tags such as
  # `json:"encryptedUsername"` emitted by stealers that serialize decrypted
  # Chromium Login Data rows — length-prefixed Go strings the text
  # extractor skips, so these match raw .rdata bytes. Either tag alone is
  # weak (test fixtures, documentation); the pair together is the Chromium
  # login-row shape: hostname + encrypted username + encrypted password.
  - id: json-tagged-encrypted-username
    desc: JSON-tagged encryptedUsername field
    if:
      type: raw
      section: .rdata
      substr: 'json:"encryptedUsername"'
  - id: json-tagged-encrypted-password
    desc: JSON-tagged encryptedPassword field
    if:
      type: raw
      section: .rdata
      substr: 'json:"encryptedPassword"'
