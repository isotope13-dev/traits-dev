defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: aws-access-key-field-reference
  desc: AWS access-key field-name reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: aws_access_key_id
- id: aws-secret-key-field-reference
  desc: AWS secret-key field-name reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: aws_secret_access_key
composite_rules:
- id: python-shared-credentials-configuration
  desc: Python AWS shared credential configuration
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: aws-access-key-field-reference
  - id: aws-secret-key-field-reference
