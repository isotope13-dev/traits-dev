defaults:
  platforms: [unix, appliance, windows]
  for: [javascript, typescript]
traits:
  - id: json-serializes-secrets-and-files
    desc: Serializes secrets and files fields as JSON
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'JSON\.stringify\(\{[\s\S]{0,220}secrets:[\s\S]{0,120}files:'
