defaults:
  crit: notable
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  - binaries
  conf: 0.96
  id: remote-token-pool-context
  desc: Tenant and client-token routing field references
  if:
    type: text
    regex: (?is)(tenantSlug.{0,220}clientKey|clientKey.{0,220}tenantSlug)
- id: json-stringify-magic-link-field
  for:
  - javascript
  - typescript
  desc: Serializes magic-link credential field to JSON
  conf: 0.93
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,200}\bmagicLink\b
