traits:
- platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - typescript
  id: login-password-value-record
  desc: Record contains login/password form values
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(login|username)\s*:\s*[^,\n]{0,40}\.value\s*,\s*(pass|password)\s*:'
    case_insensitive: true
