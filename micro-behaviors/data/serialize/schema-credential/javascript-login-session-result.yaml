defaults:
  crit: component
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-login-success-object-return
    desc: Returns an ok true object
    conf: 0.95
    if:
      type: text
      regex: 'return\s*\{\s*ok\s*:\s*true'

  - id: js-login-token-cookie-result-fields
    desc: Access token and cookie fields in result
    conf: 0.96
    if:
      type: text
      regex: '(?i)(access_token|accessToken)\s*:\s*[A-Za-z_$][\w$]*[^}]{0,120}\bcookie'

composite_rules:
  - id: js-social-login-session-result
    desc: Successful login result returns a token and cookie
    crit: notable
    conf: 0.97
    near_bytes: 300
    all:
      - id: js-login-success-object-return
      - id: js-login-token-cookie-result-fields
