defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: keyring-map-serialize-calls
    desc: Keyring map callback contains serialize calls
    if:
      type: tree-sitter
      kind: call
      regex: '(^|[\w$.]+\.)keyrings\s*\.\s*map\s*\([\s\S]{0,240}\.serialize\s*\(\s*\)'
  - id: keyring-serializer-mnemonic-member
    desc: Serializer references its mnemonic member
    if:
      type: tree-sitter
      query: |
        ((method_definition
          name: (property_identifier) @method
          body: (statement_block) @body)
          (#eq? @method "serialize")
          (#match? @body "mnemonic\\s*:\\s*this\\.mnemonic\\b"))
  - id: keyring-serializer-private-key-map
    desc: Serializer maps wallet private-key members
    if:
      type: tree-sitter
      query: |
        ((method_definition
          name: (property_identifier) @method
          body: (statement_block) @body)
          (#eq? @method "serialize")
          (#match? @body "this\\.wallets\\.map\\([\\s\\S]{0,160}\\.privateKey\\b"))
