defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]

traits:

  - id: pwd-passwd-field-key
    crit: notable
    desc: Password-shaped pwd/passwd record key
    conf: 0.9
    if:
      type: text
      # A shell dispatcher can have case "pwd": / == "pwd": without
      # declaring a password field. Require a record boundary or line key.
      regex: '(?m)([{,]\s*|^[ \t]*)["''](pwd|passwd)["'']\s*:'

