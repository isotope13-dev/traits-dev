traits:
- id: username-password-json-body
  desc: Serializes username and password fields
  conf: 0.94
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{\s*username\s*,\s*password\s*\}
- id: email-password-json-body
  desc: Serializes email and password fields
  conf: 0.95
  if:
    type: text
    regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,320}\bemail\s*:[^}]{0,180}\bpassword\s*:'
- id: refresh-token-field-stringify
  desc: JSON serialization includes refresh-token field
  conf: 0.96
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((call_expression
        function: (member_expression
          object: (identifier) @object
          property: (property_identifier) @method)
        arguments: (arguments (object
          (pair key: [(property_identifier) (string)] @key)))) @call
        (#eq? @object "JSON")
        (#eq? @method "stringify")
        (#match? @key "(?i)^[\"']?refreshToken[\"']?$"))
      ((call_expression
        function: (member_expression
          object: (identifier) @object
          property: (property_identifier) @method)
        arguments: (arguments (object
          (shorthand_property_identifier) @key))) @call
        (#eq? @object "JSON")
        (#eq? @method "stringify")
        (#match? @key "(?i)^refreshToken$"))
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
