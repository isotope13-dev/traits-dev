# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: json-serializes-npmrc-content
  desc: Serializes an npmrc-named field into JSON
  crit: suspicious
  conf: 0.97
  attack: T1041
  unless:
  - id: well-known/tool/development/cli/capsurface::capsurface-distribution
  if:
    type: tree-sitter
    kind: call
    regex: JSON[.]stringify\s*\(\s*\{.{0,600}\bnpmrc\s*[,}:]
