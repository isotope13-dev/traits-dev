defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
  conf: 0.45
traits:
- id: credential-field--password
  crit: notable
  desc: Credential field populated from input or file
  conf: 0.84
  if:
    type: text
    regex: '(?i)\b(password|passphrase|api[_-]?key)\b\s*[:=]\s*(input|open)\s*\(\s*\w*'
    not:
      - regex: '\(\s*(doc|document|el|root)\b'
