# Credential-shaped dump records: the target-store label and data field are
# required, not just JSON serialization. Source syntax does not prove an upload.
defaults:
  platforms: [ios, macos]
  for: [html]
  crit: notable
  conf: 0.9
traits:
  - id: html-keychain-dump-body
    desc: HTML JSON body names keychain dump data
    if:
      type: text
      exclude_html_comments: true
      regex: '(?m)(^|>)\s*body:\s*JSON\.stringify\(\{.{0,80}keychain_dump.{0,80}data:\s*[\w$]+'
    not:
      - regex: 'data:\s*(null|undefined|[0-9]+)\b'
      - regex: 'data:\s*(true|false)\b'
  - id: html-wallet-dump-body
    desc: HTML JSON body names wallet dump data
    if:
      type: text
      exclude_html_comments: true
      regex: '(?m)(^|>)\s*body:\s*JSON\.stringify\(\{.{0,80}wallet_dump.{0,80}data:\s*[\w$]+'
    not:
      - regex: 'data:\s*(null|undefined|[0-9]+)\b'
      - regex: 'data:\s*(true|false)\b'
