# Torrent-based leak distribution.  The article's distinctive technique is a
# per-release tracker plus an initial HTTP web seed for a staged data archive.
# The protocol atoms are neutral; intent is raised only for the complete release
# shape or when it accompanies a known cloud-portal record-extraction pattern.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, javascript, typescript, python, shell, powershell, go, rust, java, csharp]
  attack: T1041

composite_rules:
  - id: bittorrent-web-seeded-archive-release
    desc: "Web-seeded archive metainfo construction"
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/bittorrent::bittorrent-announce-endpoint
      - id: micro-behaviors/data/format/bittorrent::bittorrent-web-seed-key
      - id: micro-behaviors/data/format/bittorrent::bittorrent-metainfo-output
      - id: "micro-behaviors/data/format/bittorrent::bittorrent-archive-payload-reference"
    any:
      - id: micro-behaviors/data/format/bittorrent::javascript-bittorrent-metainfo-field-set
      - id: micro-behaviors/data/format/bittorrent::bittorrent-bencode-encoder
  - id: bittorrent-cli-web-seeded-archive-release
    for: [shell, powershell]
    desc: "CLI web-seeded archive metainfo construction"
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-create
      - id: micro-behaviors/data/format/bittorrent::bittorrent-announce-endpoint
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-web-seed-option
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-metainfo-output
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-archive-payload-reference
  - id: bittorrent-cli-tracker-web-seed-release
    for: [shell, powershell]
    desc: "CLI metainfo with tracker and web seed"
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-create
      - id: micro-behaviors/data/format/bittorrent::bittorrent-announce-endpoint
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-web-seed-option
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-metainfo-output
  - id: bittorrent-cli-archive-staging
    for: [shell]
    desc: "Archive creation with torrent metainfo output"
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/create/tar::tar-create
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-create
      - id: micro-behaviors/data/format/bittorrent::bittorrent-cli-metainfo-output
