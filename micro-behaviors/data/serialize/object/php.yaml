defaults:
  platforms: [windows, unix]
  for:
    - php
traits:
  - id: serialize-symbol
    desc: References PHP serialize() or a serialize method
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: serialize
  - id: wordpress-maybe-serialize
    desc: WordPress conditional object serialization
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: maybe_serialize
  - id: unserialize
    desc: PHP object deserialization call
    crit: notable
    conf: 0.65
    mbc: E1059
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: unserialize
  - id: error-suppressed-unserialize
    desc: Error-suppressed unserialize call
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '@\s*unserialize\s*\('
    # WP core probes "is this value serialized?" via @unserialize($v) —
    # a standard defensive idiom there, not payload staging.
    downgrade:
      any:
        - id: metadata/library/web-frameworks::wordpress-core-package-doc
        - id: metadata/library/web-frameworks::wordpress-core-include-bootstrap
        - id: well-known/tool/development/wp-cli::wp-cli-phar
  - id: php-serialized-object-record
    desc: PHP serialized object record
    crit: notable
    conf: 0.96
    for: [scripts, source, data]
    if:
      type: text
      regex: 'O:[0-9]{1,6}:"[A-Za-z_][A-Za-z0-9_\\]{0,255}":[0-9]{1,6}:\{'
  - id: unserialize-get
    desc: Deserializes data from PHP $_GET
    crit: suspicious
    conf: 0.8
    if:
      type: tree-sitter
      kind: call
      regex: 'unserialize\s*\([^)]{0,160}\$_GET'
    unless:
      - id: unserialize-allowed-classes-whitelist
      - id: unserialize-allowed-classes-disabled
  - id: unserialize-post
    desc: Deserializes data from PHP $_POST
    crit: suspicious
    conf: 0.8
    if:
      type: tree-sitter
      kind: call
      regex: 'unserialize\s*\([^)]{0,160}\$_POST'
    unless:
      # Typed allow-lists (Facebook CAPI event objects, etc.) are not freeform
      # gadget chains — the operator named the only instantiable classes.
      - id: unserialize-allowed-classes-whitelist
      - id: unserialize-allowed-classes-disabled
      - id: well-known/app/publishing/wordpress-plugins::known-wordpress-plugin
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-ui
  - id: unserialize-request
    desc: Deserializes data from PHP $_REQUEST
    crit: suspicious
    conf: 0.8
    if:
      type: tree-sitter
      kind: call
      regex: 'unserialize\s*\([^)]{0,160}\$_REQUEST'
    unless:
      - id: unserialize-allowed-classes-whitelist
      - id: unserialize-allowed-classes-disabled
  - id: unserialize-cookie
    desc: Deserializes data from PHP $_COOKIE
    crit: suspicious
    conf: 0.8
    if:
      type: tree-sitter
      kind: call
      regex: 'unserialize\s*\([^)]{0,160}\$_COOKIE'
    unless:
      - id: unserialize-allowed-classes-disabled
      - id: unserialize-allowed-classes-whitelist
  - id: unserialize-allowed-classes-disabled
    desc: unserialize disables object instantiation
    crit: component
    conf: 0.95
    if:
      type: text
      regex: "unserialize\\s*\\([^)]{0,160}['\"]allowed_classes['\"]\\s*=>\\s*false"
  - id: unserialize-allowed-classes-whitelist
    desc: unserialize restricts object classes
    crit: component
    conf: 0.95
    if:
      type: text
      regex: "unserialize\\s*\\([\\s\\S]{0,240}['\"]allowed_classes['\"]\\s*=>\\s*\\["
composite_rules:
  - id: unserialize-user-input
    desc: Deserialization of user input
    crit: suspicious
    conf: 0.95
    mbc: E1059
    attack: T1059
    any:
      - id: unserialize-get
      - id: unserialize-post
      - id: unserialize-request
      - id: unserialize-cookie
  - id: remote-unserialize
    desc: Deserialization of remote HTTP data
    crit: suspicious
    conf: 0.96
    # Require the remote read and unserialization to be close enough to form a
    # plausible direct hand-off. A remote asset fetch in one helper plus a
    # local cache unserialization in another is not dataflow.
    near_bytes: 512
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
    any:
      - id: unserialize
      - id: error-suppressed-unserialize
    unless:
      - id: well-known/tool/development/wp-cli::wp-cli-phar
      - id: well-known/app/publishing/wordpress-plugins/
      - id: unserialize-allowed-classes-disabled
