defaults:
  for: [javascript, typescript, html, python, php]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: password-attempt-one-slot
    desc: Password attempt one record slot
    if:
      type: text
      regex: '["'']?password[_-](one|1)["'']?\s*[:=]'
  - id: password-attempt-two-slot
    desc: Password attempt two record slot
    if:
      type: text
      regex: '["'']?password[_-](two|2)["'']?\s*[:=]'
  - id: password-attempt-three-slot
    desc: Password attempt three record slot
    if:
      type: text
      regex: '["'']?password[_-](three|3)["'']?\s*[:=]'
composite_rules:
  - id: separate-password-attempt-slots
    desc: Three separate password attempt slots
    all:
      - id: password-attempt-one-slot
      - id: password-attempt-two-slot
      - id: password-attempt-three-slot
    near_bytes: 400
