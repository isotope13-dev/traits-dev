defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: js-serialise
  desc: References a serialization-related symbol
  crit: notable
  conf: 0.85
  if:
    type: symbol
    regex: '[Ss]eriali[sz]e'
- id: js-deserialise
  desc: References a deserialization-related symbol
  crit: notable
  conf: 0.85
  if:
    type: symbol
    regex: '[Dd]eseriali[sz]e'

