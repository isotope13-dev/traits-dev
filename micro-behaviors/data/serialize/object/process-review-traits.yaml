defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell, python]
  crit: notable
  conf: 0.9

traits:
  - id: vscode-editor-record-id-cli
    desc: Defines bracket-keyed id and c lists
    if:
      type: text
      regex: '\["id"\]\s*=\s*[\s\S]{0,300}\["c"\]\s*=\s*\['

  - id: vscode-editor-record-platform-paths
    desc: Defines bracket-keyed w and m path lists
    if:
      type: text
      regex: '\["w"\]\s*=\s*\[[\s\S]{0,600}\["m"\]\s*=\s*\['

composite_rules:
  - id: vscode-editor-candidate-record
    desc: Defines editor CLI and path record
    crit: notable
    conf: 0.92
    near_bytes: 1200
    all:
      - id: micro-behaviors/data/serialize/object::vscode-editor-record-id-cli
      - id: micro-behaviors/data/serialize/object::vscode-editor-record-platform-paths
