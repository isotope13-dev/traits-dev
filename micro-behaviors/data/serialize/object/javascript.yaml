defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: json-stringify-name-email-fields
    desc: Serializes name and email fields
    crit: notable
    conf: 0.92
    if:
      type: text
      # Word boundaries prevent `username:` from masquerading as `name:`.
      regex: 'JSON\.stringify\(\s*\{[^}]{0,100}\bname\s*:[^}]{0,100}\bemail\s*:'

  - id: transfer-list-identifier-option
    desc: Transfer-list option references an identifier
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\btransferList\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*'
