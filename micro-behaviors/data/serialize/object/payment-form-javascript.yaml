defaults:
  platforms: [linux, macos, windows, unix, android, ios]

traits:
  - id: payment-context-serialize-array
    desc: serializeArray near payment-related text
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?is)(payment|checkout|billing)[A-Za-z0-9_$-]{0,24}.{0,100}serializeArray\s*\('
