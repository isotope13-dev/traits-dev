---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - xml
  crit: notable
  conf: 0.96
traits:
- id: sharepoint-bdc-schema-namespace
  desc: SharePoint BDC model schema
  if:
    type: text
    substr: http://schemas.microsoft.com/windows/2007/BusinessDataCatalog
- id: bdcm-dotnet-lobsystem-type
  desc: BDC LobSystem uses DotNetAssembly
  if:
    type: text
    regex: (?i)<LobSystem\b.{0,160}\bType\s*=\s*["']DotNetAssembly["']
- id: bdcm-class-property-tag
  desc: BDC Class property tag
  if:
    type: text
    regex: (?i)<Property\s+Name\s*=\s*["']Class["']
- id: dotnet-framework-assembly-type
  desc: Assembly-qualified System type
  if:
    type: text
    regex: \bSystem\.[\w.+`]{3,120}\s*,\s*[\w.-]+\s*(,\s*\w+=|["'<]|$)
    case_insensitive: true
  not:
  - regex: "\\bSystem\\.(Item\\w+|Document\\.\\w+)\\s*,"
- id: dotnet-losformatter-assembly-type
  desc: Assembly-qualified ASP.NET LosFormatter type
  crit: suspicious
  conf: 0.995
  if:
    type: text
    substr: System.Web.UI.LosFormatter, System.Web
- id: bdcm-input-parameter-tag
  desc: BDC input parameter tag
  if:
    type: text
    regex: (?i)<Parameter\s+Direction\s*=\s*["']In["']
- id: bdcm-default-value-binding-tag
  desc: BDC method-instance default value
  if:
    type: text
    regex: (?i)<DefaultValue\s+MethodInstanceName\s*=\s*["'][^"']{1,160}["']
- id: bdcm-finder-method-instance
  desc: BDC Finder method instance
  if:
    type: text
    regex: (?i)<MethodInstance\s+Type\s*=\s*["']Finder["']
- id: sharepoint-bdcm-deserialize-method
  desc: BDC model defines Deserialize method
  conf: 0.98
  if:
    type: text
    regex: (?i)<Method\b.{0,160}\bName\s*=\s*["']Deserialize["']
composite_rules:
- id: sharepoint-bdcm-dotnet-assembly-model
  desc: SharePoint BDC DotNetAssembly model
  all:
  - id: micro-behaviors/data/serialize/object::sharepoint-bdc-schema-namespace
  - id: micro-behaviors/data/serialize/object::bdcm-dotnet-lobsystem-type
  near_bytes: 4096
- id: sharepoint-bdcm-framework-class-property
  desc: BDC Class selects framework type
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/serialize/object::sharepoint-bdc-schema-namespace
  - id: micro-behaviors/data/serialize/object::bdcm-class-property-tag
  - id: micro-behaviors/data/serialize/object::dotnet-framework-assembly-type
  near_bytes: 2048
- id: sharepoint-bdcm-losformatter-class-property
  desc: BDC Class selects ASP.NET LosFormatter
  crit: suspicious
  conf: 0.995
  all:
  - id: micro-behaviors/data/serialize/object::sharepoint-bdc-schema-namespace
  - id: micro-behaviors/data/serialize/object::bdcm-class-property-tag
  - id: micro-behaviors/data/serialize/object::dotnet-losformatter-assembly-type
  near_bytes: 2048
- id: sharepoint-bdcm-default-argument-finder
  desc: BDC Finder receives default input
  all:
  - id: micro-behaviors/data/serialize/object::sharepoint-bdc-schema-namespace
  - id: micro-behaviors/data/serialize/object::bdcm-input-parameter-tag
  - id: micro-behaviors/data/serialize/object::bdcm-default-value-binding-tag
  - id: micro-behaviors/data/serialize/object::bdcm-finder-method-instance
  near_bytes: 8192
