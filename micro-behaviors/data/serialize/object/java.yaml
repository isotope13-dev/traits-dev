defaults:
  platforms: [unix, windows]
  for: [java, class]
  crit: notable
  conf: 0.88

traits:
  - id: clojure-objectoutputstream-constructor
    desc: Clojure constructs a JVM object serializer
    for: [clojure]
    if:
      type: symbol
      kind: call
      regex: '^(java\.io\.)?ObjectOutputStream\.$'
  - id: java-objectinputstream-import
    desc: Java ObjectInputStream import
    if:
      type: symbol
      kind: import
      exact: java.io.ObjectInputStream
  - id: java-objectinputstream-ctor
    desc: Java ObjectInputStream construction
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ObjectInputStream$'
  - id: java-readobject-call
    desc: Java readObject deserialization call
    if:
      type: symbol
      kind: call
      exact: readObject
