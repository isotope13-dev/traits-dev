defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
  crit: notable
  conf: 0.88

traits:
  - id: clojure-objectoutputstream-constructor
    desc: Clojure constructs a JVM object serializer
    for: [clojure]
    if:
      type: symbol
      kind: call
      regex: '^(java\.io\.)?ObjectOutputStream\.$'
  - id: java-objectinputstream-import
    desc: Java ObjectInputStream import
    if:
      type: symbol
      kind: import
      exact: java.io.ObjectInputStream
  - id: java-objectinputstream-ctor
    desc: Java ObjectInputStream construction
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ObjectInputStream$'
  - id: java-readobject-call
    desc: Java readObject deserialization call
    if:
      type: symbol
      kind: call
      exact: readObject
  - id: java-readobject-callback
    desc: Java readObject callback definition
    if:
      type: symbol
      kind: function
      exact: readObject
  - id: java-marshalledobject-import
    desc: Java imports MarshalledObject serialization
    if:
      type: symbol
      kind: import
      exact: java.rmi.MarshalledObject
  - id: java-marshalledobject-construction
    desc: Java constructs nested serialized envelope
    if:
      type: text
      regex: '\b(new\s+)?(java\.rmi\.)?MarshalledObject(\s*<.{0,80}>)?\s*\('
  - id: java-marshalledobject-unwrap
    desc: Java unwraps a MarshalledObject payload
    if:
      type: text
      regex: '\bMarshalledObject.{0,160}=[\s\S]{0,300}\.\s*get\s*\(\s*\)'
  - id: java-objectinputstream-subclass
    desc: Java subclasses ObjectInputStream
    if:
      type: text
      regex: '\bclass\s+\w+.{0,80}(extends|:)\s+(java\.io\.)?ObjectInputStream\b'
  - id: java-resolveclass-function
    desc: Java defines serialized-class resolution
    if:
      type: symbol
      kind: function
      exact: resolveClass

composite_rules:
  - id: java-objectinputstream-class-filter
    desc: Java stream filters deserialized classes
    crit: notable
    conf: 0.94
    near_lines: 80
    all:
      - id: java-objectinputstream-subclass
      - id: java-resolveclass-function

  - id: java-socket-objectinputstream
    desc: Java deserializes objects from a socket
    crit: suspicious
    conf: 0.96
    near_lines: 16
    all:
      - id: java-readobject-call
      - id: micro-behaviors/process/io/stream::java-input-stream-access
      - id: micro-behaviors/communications/socket/listen::java-accepts-connection
