---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - source
  - scripts
traits:
- id: stdout-property-field
  desc: Maps stdout property to stdout field
  conf: 0.96
  if:
    type: text
    regex: '["'']stdout["'']\s*:\s*[A-Za-z_]\w*\.stdout'
- id: stderr-property-field
  desc: Maps stderr property to stderr field
  conf: 0.96
  if:
    type: text
    regex: '["'']stderr["'']\s*:\s*[A-Za-z_]\w*\.stderr'
composite_rules:
- id: stdout-stderr-field-cooccurrence
  desc: Stdout and stderr field mappings coexist
  conf: 0.97
  near_bytes: 320
  all:
  - id: micro-behaviors/data/serialize/object::stdout-property-field
  - id: micro-behaviors/data/serialize/object::stderr-property-field
