defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.92

# These match object construction only. HTTP form submission is a separate
# observation composed in communications/http/form with an HTTP client call.
traits:
  - id: python-username-variable-object-field
    desc: Python object maps username variable
    for: [python]
    if:
      type: text
      regex: '["'']user(name)?["'']\s*:\s*(user|username)\b'

  - id: python-password-variable-object-field
    desc: Python object maps password variable
    for: [python]
    if:
      type: text
      regex: '["'']password["'']\s*:\s*(password|passwd|pwd)\b'

  - id: powershell-username-variable-object-field
    desc: PowerShell object maps username variable
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*user(name)?\s*=\s*\$(user|username)\b'

  - id: powershell-password-variable-object-field
    desc: PowerShell object maps password variable
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*password\s*=\s*\$(password|passwd|pwd)\b'

composite_rules:
  - id: python-variable-credential-object
    desc: Python object maps credential variables
    for: [python]
    near_bytes: 240
    all:
      - id: python-username-variable-object-field
      - id: python-password-variable-object-field

  - id: powershell-variable-credential-object
    desc: PowerShell object maps credential variables
    for: [powershell]
    near_bytes: 240
    all:
      - id: powershell-username-variable-object-field
      - id: powershell-password-variable-object-field
