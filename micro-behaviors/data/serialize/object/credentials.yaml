defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.92

# These match neutral credential-shaped object operations. HTTP submission,
# theft, or device exploitation requires separate objective evidence.
traits:
  - id: response-username-field-access
    desc: Reads username from a response-like object
    for: [python, javascript, typescript, go, rust, c, cpp, java]
    if:
      type: text
      regex: '(?i)\b(response|result|device|site)\s*\.\s*usernames?\b'
    unless:
      - id: well-known/app/productivity/keepercommander/

  - id: response-username-subscript-access
    desc: Reads bracketed response username
    for: [python, javascript, typescript, go, rust, c, cpp, java]
    if:
      type: text
      regex: '(?i)\b(response|result|device|site)\s*\[\s*["'']?usernames?'

  - id: python-username-variable-object-field
    desc: Python object maps username variable
    for: [python]
    if:
      type: text
      regex: '["'']user(name)?["'']\s*:\s*(user|username)\b'

  - id: python-password-variable-object-field
    desc: Python object maps password variable
    for: [python]
    if:
      type: text
      regex: '["'']password["'']\s*:\s*(password|passwd|pwd)\b'

  - id: powershell-username-variable-object-field
    desc: PowerShell object maps username variable
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*user(name)?\s*=\s*\$(user|username)\b'

  - id: powershell-password-variable-object-field
    desc: PowerShell object maps password variable
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*password\s*=\s*\$(password|passwd|pwd)\b'

composite_rules:
  - id: python-variable-credential-object
    desc: Python object maps credential variables
    for: [python]
    near_bytes: 240
    all:
      - id: python-username-variable-object-field
      - id: python-password-variable-object-field

  - id: powershell-variable-credential-object
    desc: PowerShell object maps credential variables
    for: [powershell]
    near_bytes: 240
    all:
      - id: powershell-username-variable-object-field
      - id: powershell-password-variable-object-field
