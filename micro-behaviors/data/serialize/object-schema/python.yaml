# Python JSON Deserialization
# MBC: C0024 (Data Transformation)
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: mapping-get-action-key
    desc: Python mapping reads the literal "action" key
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^\w+\.get$'
      arg:
        kind: string
        exact: action
  - id: mapping-get-code-key
    desc: Python mapping reads the literal "code" key
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^\w+\.get$'
      arg:
        kind: string
        exact: code
  - id: mapping-get-executable-field
    desc: Python mapping reads an executable field
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^\w+\.get$'
      arg:
        kind: string
        regex: '^(code|command|script|payload)$'
  - id: python-json-env-field
    desc: Python JSON object includes env field
    conf: 0.9
    if:
      type: text
      regex: 'json\.dumps?\s*\(\s*\{[\s\S]{0,320}["'']env["'']\s*:'
  - id: response-json-gating-not
    desc: Negative JSON response gate
    conf: 0.8
    if:
      type: text
      regex: if\s+not\s+[A-Za-z_][A-Za-z0-9_]*\.json\(\)
  - id: response-json-gating-positive
    desc: Positive JSON response gate
    conf: 0.75
    if:
      type: text
      regex: if\s+[A-Za-z_][A-Za-z0-9_]*\.json\(\)
