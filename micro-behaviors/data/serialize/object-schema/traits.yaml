# Generic object-field shapes belong below serialization, not in objectives.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9

traits:
  - id: host-field-key
    desc: JSON-like host identity field
    if:
      type: text
      regex: '["''](host|hostname)["'']\s*:'

  - id: environment-field-key
    desc: JSON-like environment field
    if:
      type: text
      regex: '["''](env|ev)["'']\s*:'

  - id: pwd-passwd-field-key
    desc: JSON-like pwd or passwd field
    if:
      type: text
      regex: '["''](pwd|passwd)["'']\s*:'

  - id: home-directory-field-key
    desc: JSON-like home or current-directory field
    if:
      type: text
      regex: '["''](home|home_directory|current_directory)["'']\s*:'

  - id: user-field-key
    desc: JSON-like user identity field
    if:
      type: text
      regex: '["''](user|username|whoami)["'']\s*:'

  - id: ipv4-field-value
    desc: JSON-like IP field with IPv4 literal
    conf: 0.86
    if:
      type: text
      regex: '["''](ip|addr)["'']\s*:\s*["'']\d{1,3}(\.\d{1,3}){3}["'']'

  - id: platform-field-key
    desc: JSON-like platform or OS field
    conf: 0.86
    if:
      type: text
      regex: '["''](platform|os|os_info)["'']\s*:'

composite_rules:
  - id: compact-host-profile-fields
    desc: Compact host-profile field set
    needs: 3
    any:
      - id: host-field-key
      - id: environment-field-key
      - id: pwd-passwd-field-key
      - id: home-directory-field-key
      - id: user-field-key
      - id: ipv4-field-value
      - id: platform-field-key
