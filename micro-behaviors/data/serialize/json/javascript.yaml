---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: baseline
traits:
- id: json-stringify-payload-call
  desc: Serializes a payload object as JSON
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: JSON.stringify
    arg:
      kind: identifier
      name: payload
- id: process-env-json-stringify
  desc: JSON.stringify serializes process.env
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @obj
          property: (property_identifier) @prop)
        arguments: (arguments
          (member_expression
            object: (identifier) @src
            property: (property_identifier) @field))
      (#eq? @obj "JSON")
      (#eq? @prop "stringify")
      (#eq? @src "process")
      (#eq? @field "env"))
- id: parsed-or-environment-json-stringify
  desc: JSON.stringify names parsed or env
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*(parsed|env|process\.env)\b
- id: json-stringify-local-storage
  desc: JSON-serializes localStorage state
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: JSON.stringify
    arg:
      kind: identifier
      name: localStorage
- id: json-stringify-session-storage
  desc: JSON-serializes sessionStorage state
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: JSON.stringify
    arg:
      kind: identifier
      name: sessionStorage
- id: json-stringify-call
  desc: Calls JSON.stringify()
  crit: notable
  conf: 0.5
  if:
    type: symbol
    kind: call
    exact: JSON.stringify
- id: json-stringify-identifier
  desc: Serializes an identifier as JSON
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    exact: JSON.stringify
    arg:
      kind: identifier
- id: json-stringify-result-rows
  desc: Serializes result rows as JSON
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: JSON\.stringify\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.(rows|records|results)\s*\)
- id: screenshot-data-stringify
  desc: Serializes screenshot data as JSON
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'JSON\.stringify\(\{\s*screenshots\s*:'
- id: json-stringify-token-secret-body
  desc: Serializes token or secret fields
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,500}\b(token|secret)\b
- id: json-stringify-key-password-body
  desc: Serializes key or password fields
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,500}\b(key|password)\b
- id: json-stringify-password-body
  desc: Serializes password fields
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,500}\bpassword\b
- id: json-stringify-env-access-body
  desc: Serializes credential environment values
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,500}process\.env\.[A-Z0-9_]*(TOKEN|SECRET|KEY|PASS)
  not:
  - regex: Boolean\s*\(\s*process\.env
- id: json-stringify-file-data-body
  desc: Serializes file data fields
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "(?i)JSON\\.stringify\\s*\\(\\s*\\{[^}]{0,200}\\b(file|fileData|fileContent|filePath)\\s*:"
- id: json-stringify-payload-body
  desc: Serializes payload data fields
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,240}\b(payload|fileData)\b
- id: json-stringify-creds-body
  desc: Serializes credential fields
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: JSON\.stringify\s*\(\s*\{[^}]{0,240}\b(creds|credentials|credential)\b
composite_rules:
- id: json-stringify-sensitive-fields-body
  desc: Serializes token, secret, key or password fields
  crit: notable
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-token-secret-body
  - id: micro-behaviors/data/serialize/json::json-stringify-key-password-body
  - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
- id: json-stringify-file-material-body
  desc: Serializes file or payload material
  crit: notable
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-file-data-body
  - id: micro-behaviors/data/serialize/json::json-stringify-payload-body
- id: json-stringify-credential-material-body
  desc: Serializes credential-like material
  crit: notable
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-creds-body
  - id: micro-behaviors/data/serialize/json::json-stringify-token-secret-body
  - id: micro-behaviors/data/serialize/json::json-stringify-key-password-body
- id: secret-http-flow-with-json-call
  desc: Secret HTTP flow candidate beside JSON call
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::secret-http-request-flow
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: micro-behaviors/os/env/test::boolean-env-presence-check
