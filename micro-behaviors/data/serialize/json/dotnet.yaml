defaults:
  platforms:
    - unix
    - windows
  for:
    - pe
    - dll
    - csharp
  crit: baseline
  conf: 0.85

traits:
  - id: javascript-serializer-type-reference
    desc: .NET JavaScriptSerializer type reference
    crit: notable
    conf: 0.94
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      exact: JavaScriptSerializer
      section: .text

  - id: json-newtonsoft
    desc: Newtonsoft.Json library reference
    if:
      type: text
      substr: Newtonsoft.Json

  - id: json-system
    desc: System.Text.Json library reference
    if:
      type: text
      substr: System.Text.Json

  - id: json-polymorphic-attribute
    desc: .NET JsonPolymorphic attribute reference
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: JsonPolymorphicAttribute

  - id: json-polymorphic-resolver
    desc: .NET polymorphic resolver reference
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: PolymorphicTypeResolver
