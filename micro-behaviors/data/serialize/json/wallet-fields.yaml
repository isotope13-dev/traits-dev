defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: js-private-key-json-field
  desc: Serializes private-key JSON field
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)JSON\.stringify\s*\(\s*\{[^}]{0,250}\bprivate[_ -]?key\b\s*[:=]'

- id: js-seed-phrase-json-field
  desc: Serializes seed-phrase JSON field
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)JSON\.stringify\s*\(\s*\{[^}]{0,250}\b(seedPhrase|mnemonic)\b\s*[:=]'

- id: js-seed-json-field
  desc: Serializes seed JSON field
  crit: notable
  conf: 0.97
  for: [html, javascript, typescript]
  if:
    type: text
    regex: '(?i)JSON\.stringify\s*\(\s*\{[^}]{0,250}\bseed\b\s*:\s*[A-Za-z_$][\w$]*seed'

