# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.9
traits:
- id: ghodss-yaml-to-json
  desc: Converts YAML data to JSON in Go
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: yaml.YAMLToJSON
composite_rules:
- id: go-yaml-to-json-parser
  desc: Go source converts YAML to JSON
  crit: notable
  conf: 0.92
  all:
  - id: metadata/import/package::ghodss-yaml-import
  - id: micro-behaviors/data/serialize/json::ghodss-yaml-to-json
