# Flow facts expose serialization-to-send, but do not connect object fields
# stored in one function with the HMAC key read in another. This query supplies
# that relationship without requiring any chosen variable or key-field name.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-serialized-hmac-config
    desc: Serializes configuration retained as an HMAC key
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @crypto
            value: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @module)))))
          (function_declaration body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @options
                value: (binary_expression left: (identifier) operator: "||" right: (object))))
              (try_statement body: (statement_block
                (lexical_declaration (variable_declarator name: (identifier) @payload
                  value: (call_expression function: (member_expression
                    object: (identifier) @json property: (property_identifier) @stringify)
                    arguments: (arguments (object (pair value: (identifier) @serialized))))))
                (expression_statement (call_expression function: (member_expression
                  property: (property_identifier) @end)
                  arguments: (arguments (identifier) @sent)) @evidence))
                handler: (catch_clause body: (statement_block) @caught))
              (expression_statement (assignment_expression left: (identifier) @state
                right: (object (pair key: (property_identifier) @stored
                  value: (binary_expression left: (member_expression
                    object: (identifier) @source property: (property_identifier))
                    operator: "||")))))))
          (function_declaration body: (statement_block
            (return_statement (call_expression function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression function: (member_expression
                  object: (identifier) @cryptouse property: (property_identifier) @hmac)
                  arguments: (arguments (_) (call_expression
                    function: (identifier) @string
                    arguments: (arguments (ternary_expression
                      consequence: (member_expression object: (identifier) @keystate
                        property: (property_identifier) @keyfield))))))))))))))
          (#eq? @options @serialized)
          (#eq? @options @source) (#eq? @payload @sent)
          (#eq? @json "JSON") (#eq? @stringify "stringify") (#eq? @end "end")
          (#eq? @state @keystate) (#eq? @stored @keyfield)
          (#eq? @hmac "createHmac") (#eq? @string "String")
          (#eq? @require "require") (#match? @module "^(node:)?crypto$")
          (#eq? @crypto @cryptouse) (#match? @caught "^\\{\\s*\\}$"))
