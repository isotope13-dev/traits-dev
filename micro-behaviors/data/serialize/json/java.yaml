defaults:
  platforms: [android, unix, windows]
  for: [java, class]

traits:
  - id: java-fastjson-jsonobject-import
    desc: Imports the Java Fastjson JSONObject API
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: import
      exact: com.alibaba.fastjson.JSONObject

  - id: java-fastjson-parse-call
    desc: Parses JSON with Java Fastjson
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(JSON|JSONObject)\.parse(Object|Array)?$'
