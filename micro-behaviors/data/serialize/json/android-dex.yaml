defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-json-object-put-call
    desc: Adds an Android JSON object value
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Lorg/json/JSONObject;->put
  - id: dex-gson-to-json-call
    desc: DEX serializes object with Gson
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Lcom/google/gson/Gson;->toJson'
