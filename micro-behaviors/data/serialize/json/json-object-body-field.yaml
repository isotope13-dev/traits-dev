defaults:
  platforms: [windows, unix]
traits:
- crit: notable
  id: json-object-body-field
  for:
  - html
  - javascript
  - typescript
  - php
  desc: Serializes an object into a body field
  conf: 0.9
  if:
    type: text
    regex: \bbody\s*:\s*JSON\.stringify\(\s*\{
- id: encrypted-context-object-key
  desc: Object uses encrypted_context field
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'encrypted_context\s*:'
