---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: convertto-json
  desc: PowerShell serializes objects as JSON
  crit: notable
  conf: 0.9
  if:
    type: text
    word: ConvertTo-Json
    case_insensitive: true
composite_rules:
- id: powershell-file-timestamp-state-map
  desc: JSON conversion, timestamp map and write coexist
  crit: notable
  conf: 0.97
  near_bytes: 3000
  all:
  - id: micro-behaviors/data/parse/json::convertfrom-json-as-hashtable
  - id: micro-behaviors/data/serialize/json::convertto-json
  - id: micro-behaviors/data/property/assign::powershell-fullname-timestamp-map
  - id: micro-behaviors/fs/write/file/full::powershell-set-content-call
