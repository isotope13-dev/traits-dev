defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: convertto-json
    desc: PowerShell serializes objects as JSON
    crit: notable
    conf: 0.9
    if:
      type: text
      word: ConvertTo-Json
      case_insensitive: true

  - id: convertfrom-json-as-hashtable
    desc: PowerShell parses JSON as a hashtable
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bConvertFrom-Json\b[^\r\n]{0,120}-AsHashtable\b'

  - id: powershell-base64-json-parse
    desc: PowerShell parses Base64-decoded text as JSON
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)FromBase64String\s*\([^\n]{0,400}?\)\s*\)\s*\|\s*ConvertFrom-Json\b'

composite_rules:
  - id: powershell-file-timestamp-state-map
    desc: PowerShell persists file timestamps in JSON
    crit: notable
    conf: 0.97
    near_bytes: 3000
    all:
      - id: convertfrom-json-as-hashtable
      - id: convertto-json
      - id: micro-behaviors/data/source/syntax/assignment::powershell-fullname-timestamp-map
      - id: micro-behaviors/fs/write/file/full::powershell-set-content-call
