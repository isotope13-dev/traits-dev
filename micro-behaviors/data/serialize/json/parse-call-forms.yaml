defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- crit: notable
  conf: 0.9
  id: json-body-identifier-parse
  desc: Parses a body identifier with JSON.parse
  if:
    type: text
    regex: \bJSON\.parse\s*\(\s*body\s*\)
- crit: notable
  conf: 0.94
  id: json-data-property-parse
  desc: Parses a data property with JSON.parse
  if:
    type: text
    regex: JSON\.parse\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.data\s*\)
- crit: notable
  conf: 0.6
  id: parsed-json-main-property
  desc: Parsed JSON .main property access
  if:
    type: text
    regex: JSON\.parse\(.{0,100}\)\.main\b
- crit: notable
  conf: 0.88
  id: json-response-path-content-fields
  desc: JSON.parse near path and content fields
  if:
    type: text
    regex: 'JSON\.parse[\s\S]{0,260}path[\s\S]{0,120}content\s*:'
