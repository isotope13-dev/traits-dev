defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: printf-json-string-member
    desc: Printf JSON string member template
    if:
      # Raw bytes retain short format strings omitted from extracted runs.
      type: hex
      section: rodata
      pattern: "25 73 22 25 73 22 3A 22 25 73 22"
