---
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - go
  - elf
  - macho
  - pe
  - wasm
  mbc: C0032
traits:
- id: go-json-marshal
  conf: 0.85
  desc: Go JSON marshal call
  crit: notable
  if:
    type: symbol
    exact: json.Marshal
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- id: go-write-json-method-call
  crit: notable
  conf: 0.9
  desc: Go calls a WriteJSON method
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)WriteJSON$"
composite_rules:
- id: go-base64-json-marshal
  desc: JSON marshaling near Base64 encoding
  crit: notable
  conf: 0.9
  for:
  - go
  all:
  - id: micro-behaviors/data/serialize/json::go-json-marshal
  - id: micro-behaviors/data/encode/base64::go-base64-encode-call
  near_bytes: 400
