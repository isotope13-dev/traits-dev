defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe, wasm]
  mbc: C0032
traits:
  - id: go-json-marshal
    conf: 0.85
    desc: Go JSON marshal call
    crit: notable
    if:
      type: symbol
      exact: json.Marshal
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-json-unmarshal
    conf: 0.85
    desc: Go JSON unmarshal call
    crit: notable
    if:
      type: symbol
      exact: json.Unmarshal
  - id: go-json-new-decoder
    desc: Go JSON decoder construction
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: json.NewDecoder
  - id: go-content-field-json-unmarshal
    desc: Go unmarshals returned content as JSON
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      # OpenAI-compatible SDKs return model text through a Content field. This
      # captures the second deserialization boundary where that text becomes a
      # typed decision object, without depending on local type names.
      regex: 'json\.Unmarshal\s*\(\s*\[\]byte\s*\([^)]{0,120}\.(Content|Text)\s*\)\s*,\s*&\w+\s*\)'
  - id: encoding-json-import
    desc: encoding/json package import
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: encoding/json
  - id: go-write-json-method-call
    crit: notable
    conf: 0.9
    desc: Go calls a WriteJSON method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)WriteJSON$'
composite_rules:
  - id: go-base64-json-marshal
    desc: Base64 data marshaled into JSON
    crit: notable
    conf: 0.9
    for: [go]
    all:
      - id: go-json-marshal
      - id: micro-behaviors/data/encode/base64::go-base64-encode-call
    near_bytes: 400
