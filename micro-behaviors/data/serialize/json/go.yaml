defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe, wasm]
  crit: baseline
  conf: 0.85
  mbc: C0032
traits:
  - id: go-json-marshal
    desc: Go JSON marshal call
    crit: notable
    if:
      type: symbol
      exact: json.Marshal
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-json-unmarshal
    desc: Go JSON unmarshal call
    crit: notable
    if:
      type: symbol
      exact: json.Unmarshal
  - id: go-json-new-decoder
    desc: Go JSON decoder construction
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: json.NewDecoder
  - id: encoding-json-import
    desc: encoding/json package import
    crit: component
    conf: 0.5
    if:
      type: text
      substr: encoding/json

composite_rules:
  - id: go-base64-json-marshal
    desc: Base64 data marshaled into JSON
    crit: notable
    conf: 0.9
    for: [go]
    all:
      - id: go-json-marshal
      - id: micro-behaviors/data/encode/base64::go-base64-encode-call
    near_bytes: 400
