defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
traits:
- id: json-stringify-post-body-core
  desc: Serializes cookie or browser User-Agent
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: JSON\.stringify\s*\([^)]{0,220}(document\.cookie|navigator\.userAgent)
- id: json-stringify-post-body-tracking
  desc: Serializes browser tracking fields
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: JSON\.stringify\s*\([^)]{0,160}(gclid|vsent)
