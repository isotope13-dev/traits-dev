# Generic JSON-like field names are serialization context, not tasking intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9

traits:
  - id: command-field-key
    desc: JSON-like object command field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?(cmd|command|task|action)["'']?\s*[:=]'

  - id: command-property-access
    desc: Reads JSON-like command property
    if:
      type: text
      regex: '(?i)\.\s*(cmd|command|task|action)\b'

  - id: result-field-key
    desc: JSON-like object result field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?(result|output|stdout|response)["'']?\s*[:=]'

  - id: result-property-access
    desc: Reads JSON-like result property
    if:
      type: text
      regex: '(?i)\.\s*(result|output|stdout|response)\b'

  - id: credentials-field-key
    desc: JSON-like object credentials field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']credentials["'']\s*:'

  # `agent` is ordinary application and dictionary vocabulary. Recognize the
  # structured API schema only when its tool-call field is near function
  # metadata; a bare agent key is not an agentic API record.
  - id: agent-tool-call-field
    desc: JSON tool-call field
    if:
      type: text
      regex: '(?i)["''](tool_calls|function_call)["'']\s*[:=]'
  - id: agent-tool-call-function-field
    desc: JSON tool-call function metadata field
    if:
      type: text
      regex: '(?i)["''](function|arguments)["'']\s*[:=]'

composite_rules:
  - id: agent-tool-call-structure
    desc: JSON tool-call record with metadata
    crit: notable
    conf: 0.92
    for: [json, javascript, typescript, python, go, rust, java, shell, powershell]
    all:
      - id: agent-tool-call-field
      - id: agent-tool-call-function-field
    near_bytes: 1200

  - id: command-field
    desc: JSON-like object command field
    any:
      - id: command-field-key
      - id: command-property-access

  - id: result-field
    desc: JSON-like object result field
    any:
      - id: result-field-key
      - id: result-property-access

  - id: command-result-field-pair
    desc: JSON-like command and result fields
    all:
      - id: command-field
      - id: result-field
