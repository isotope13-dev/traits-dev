defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: package-object-json-stringify
    desc: Serializes package metadata object as JSON
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.stringify\s*\([^)]{0,500}\b(pkg|packageJson|packageJSON)\b'

