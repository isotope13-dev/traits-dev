defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: json-stringify-package-named-argument
    desc: JSON.stringify argument named pkg or packageJson
    crit: notable
    conf: 0.88
    if:
      type: tree-sitter
      kind: call
      regex: '^JSON\.stringify\(\s*(pkg|packageJson|packageJSON)\s*[,)]'
