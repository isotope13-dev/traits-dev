defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.9

traits:
  - id: ruby-json-generate-call
    desc: Ruby serializes a value as JSON
    if:
      type: symbol
      kind: call
      regex: '^JSON\.(generate|dump)$'

  - id: ruby-json-pretty-generate
    desc: Ruby serializes formatted JSON
    if:
      type: text
      regex: '\bJSON\.pretty_generate\s*\('
