defaults:
  platforms: [windows, unix]
  for: [javascript]

# Co-occurrence does not establish a data flow or unauthorized collection.
composite_rules:
  - id: payment-form-json-remote-url
    desc: Payment serialization, JSON and URL coexist
    crit: notable
    conf: 0.90
    all:
      - id: micro-behaviors/data/serialize/object::payment-context-serialize-array
      - id: micro-behaviors/data/serialize/json::json-stringify-identifier
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
