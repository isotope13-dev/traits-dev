# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: visited-url-before-json-serialization
    desc: "Visited URL precedes JSON serialization"
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(details\.url|tab\.url|url\.hostname)[\s\S]{0,80}JSON\.stringify'
  - id: json-serialization-before-visited-url
    desc: "JSON serialization precedes visited URL"
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)JSON\.stringify[\s\S]{0,80}(details\.url|tab\.url|url\.hostname)'
