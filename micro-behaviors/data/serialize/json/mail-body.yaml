defaults:
  for: [python, javascript, typescript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: parse-body-content-json-python
    desc: Parses body content field as JSON
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'json\.loads\(\s*\w+\[["'']body["'']\]\[["'']content["'']\]'
  - id: parse-body-content-json-js
    desc: Parses body content field as JSON
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: 'JSON\.parse\(\s*[\w$]+(\.body|\[\s*["'']body["'']\s*\])(\.content|\[\s*["'']content["'']\s*\])'
  - id: serialize-content-field-json
    desc: Serializes JSON into content field
    if:
      type: text
      regex: '["'']?content["'']?\s*:\s*(json\.dumps|JSON\.stringify)\s*\('
composite_rules:
  - id: parse-body-content-json
    desc: Parses body content field as JSON
    any:
      - id: parse-body-content-json-python
      - id: parse-body-content-json-js
