# PHP JSON serialization shapes
# MBC: C0024 (Data Transformation)
defaults:
  platforms: [linux, macos, windows]
  for: [php]
traits:
  # A `json_encode([... 'status' ... 'response' ...])` envelope is the universal
  # REST/API response shape (every controller that returns {status, response}
  # builds it — Amelia's Square payment cache, Laravel/Symfony API responses,
  # etc.). It is an incomplete fragment on its own; the webshell composite in
  # objectives/command-and-control/backdoor/webshell/request references it as a
  # weak corroborator alongside the real `>cmd` POST + shell_exec legs.
  - id: json-status-response-envelope
    desc: Builds a status/response JSON envelope
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'json_encode\s*\(\s*\[[\s\S]{0,240}[''"]status[''"][\s\S]{0,240}[''"]response[''"]'
