# PHP JSON serialization shapes
# MBC: C0024 (Data Transformation)
defaults:
  crit: notable
  for: [php]
traits:
  - id: php-json-encode
    platforms: [linux, macos, windows]
    desc: PHP JSON serialization
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: json_encode
  - id: php-json-site-metadata
    platforms: [linux, macos, windows]
    desc: PHP JSON encodes site metadata
    conf: 0.9
    if:
      type: text
      regex: "wp_json_encode\\s*\\([\\s\\S]{0,900}\\b(admin_email|site_url|plugin_version|country_info)\\b"
  - id: php-json-decode
    platforms: [windows, unix]
    conf: 0.9
    desc: PHP JSON deserialization
    if:
      type: symbol
      kind: call
      exact: json_decode
  - id: wordpress-json-encode
    platforms: [windows, unix]
    conf: 0.95
    desc: WordPress JSON serialization
    if:
      type: symbol
      kind: call
      exact: wp_json_encode
