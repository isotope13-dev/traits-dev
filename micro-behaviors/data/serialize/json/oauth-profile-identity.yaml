defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: oauth-profile-identity-fields-in-json
    desc: Serializes OAuth profile identity fields
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.stringify\s*\([^)]{0,260}\b(picture|sub)\s*:'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
