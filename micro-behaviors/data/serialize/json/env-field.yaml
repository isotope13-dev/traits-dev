traits:
  - id: js-json-stringify-env-field
    for: [javascript, typescript]
    crit: notable
    platforms: [unix, windows]
    desc: JSON serialization includes an env field
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,500}\benv\b'
    not:
      # Boolean() coercion records only whether a credential is set (e.g.
      # `credential_present: Boolean(process.env.X || ...)`); the env value
      # itself never reaches the serialized body.
      - regex: 'Boolean\s*\(\s*process\.env'
