defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  # The parsed object field accepts quoted keys, identifier keys and shorthand.
  # A command string elsewhere in the file does not satisfy this observation.
  - id: json-stringify-command-field
    desc: Serializes an object containing a command field
    if:
      type: symbol
      kind: call
      exact: JSON.stringify
      arg:
        index: 0
        from:
          field: command
          field_exists: true
