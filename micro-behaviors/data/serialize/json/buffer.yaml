defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: node-json-parse-buffer
  desc: JSON.parse receives a Buffer.from result
  conf: 0.86
  if:
    type: text
    regex: JSON\.parse\s*\(\s*Buffer\.from
- id: base64-buffer-json-parse
  desc: JSON.parse wraps Base64 Buffer decoding
  conf: 0.96
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression
          object: (identifier) @json
          property: (property_identifier) @parse)
        arguments: (arguments . (call_expression
        function: (member_expression
          object: (identifier) @buffer
          property: (property_identifier) @from)
        arguments: (arguments . (_) . (string) @codec .)) .)) @conversion
        (#eq? @json "JSON")
        (#eq? @parse "parse")
        (#eq? @buffer "Buffer")
        (#eq? @from "from")
        (#any-of? @codec "\"base64\"" "'base64'")
      )

      ((call_expression
        function: (member_expression
          object: (identifier) @json
          property: (property_identifier) @parse)
        arguments: (arguments . (call_expression
        function: (member_expression
          object: (call_expression
        function: (member_expression
          object: (identifier) @buffer
          property: (property_identifier) @from)
        arguments: (arguments . (_) . (string) @codec .))
          property: (property_identifier) @stringify)
        arguments: (arguments)) .)) @conversion
        (#eq? @json "JSON")
        (#eq? @parse "parse")
        (#eq? @buffer "Buffer")
        (#eq? @from "from")
        (#any-of? @codec "\"base64\"" "'base64'")
        (#eq? @stringify "toString")
      )
composite_rules:
- id: base64-json-parse-near-file-write
  desc: Base64 JSON parsing near file write
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/serialize/json::base64-buffer-json-parse
  - id: micro-behaviors/fs/write/file/full::write-file-sync
