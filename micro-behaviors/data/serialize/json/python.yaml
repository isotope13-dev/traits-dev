# Python JSON Deserialization
# MBC: C0024 (Data Transformation)
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: json-loads-call
    desc: Parses JSON data with Python
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "json.loads"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: json-loads-pyc-name
    desc: loads name in Python bytecode
    crit: component
    conf: 0.82
    for: [pyc]
    if:
      type: text
      substr: loads
  - id: json-load-call
    desc: Python json.load call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "json.load"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: json-dumps-call
    desc: Serializes data with Python json.dumps()
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "json.dumps"
  - id: python-environ-json
    desc: Python serializes entire environment to JSON
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'json\.(dumps|dump)\s*\(\s*(dict\s*\(\s*)?os\.environ(\s*\))?\s*[,)]'
  - id: python-env-json-value
    desc: Python serializes environment value to JSON
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)^json\.dumps?\(.{0,512}os\.(getenv|environ\.get)\s*\('
  - id: json-dumps-pyc-name
    desc: json.dumps name in Python bytecode
    crit: baseline
    conf: 0.82
    for: [pyc]
    if:
      type: text
      substr: dumps
  - id: comprehension-parse
    desc: List comprehension parses JSON lines
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'json\.loads\([^()\n]{0,40}\)\s*for\s+\w+\s+in\s+\w+'
composite_rules:
  - id: python-filtered-environ-json-value
    desc: Filtered env mapping serialized to JSON
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/env/secret-name::python-environ-credential-filter
      - id: micro-behaviors/data/serialize/schema-object::python-json-env-field
