# Python JSON Serialization
# MBC: C0024 (Data Transformation)
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-aliased-json-dump
    desc: Serializes JSON through a local import alias
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (import_statement name: (aliased_import
            name: (dotted_name) @module alias: (identifier) @alias))
          (with_statement body: (block
            (expression_statement (call function: (attribute
              object: (identifier) @receiver attribute: (identifier) @method))))))) @serialization
          (#eq? @module "json") (#eq? @alias @receiver)
          (#eq? @method "dump"))
  # Match complete, nearby marshal records; a dumps substring alone does
  # not identify JSON. These references do not establish receiver binding.
  - id: json-dumps-pyc-name
    desc: Nearby json and dumps bytecode records
    crit: notable
    conf: 0.82
    for: [pyc]
    if:
      type: hex
      pattern: >-
        (7A 04|5A 04|FA 04|DA 04|61 04 00 00 00|41 04 00 00 00|E1 04 00 00 00|C1 04 00 00 00|75 04 00 00 00|F5 04 00 00 00|74 04 00 00 00|F4 04 00 00 00)
        6A 73 6F 6E [0-512]
        (7A 05|5A 05|FA 05|DA 05|61 05 00 00 00|41 05 00 00 00|E1 05 00 00 00|C1 05 00 00 00|75 05 00 00 00|F5 05 00 00 00|74 05 00 00 00|F4 05 00 00 00)
        64 75 6D 70 73

  - id: json-dumps-call
    desc: Serializes data with Python json.dumps()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "json.dumps"
  - id: python-environ-json
    desc: Python serializes entire environment to JSON
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'json\.(dumps|dump)\s*\(\s*(dict\s*\(\s*)?os\.environ(\s*\))?\s*[,)]'
  - id: python-env-json-value
    desc: Python serializes environment value to JSON
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)^json\.dumps?\([^()]{0,300}os\.(getenv|environ\.get)\s*\('
  # Secret-named variant of the atom above: the environment value entering
  # the JSON body is itself credential-named (KEY/TOKEN/SECRET/...), not
  # merely adjacent to a secret read. An authenticated API client reads its
  # key for an Authorization header while serializing unrelated config
  # (e.g. a model name) into the body; that proximity is not exfiltration.
  - id: python-secret-env-json-value
    desc: Serializes secret-named env value to JSON
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)^json\.dumps?\([^()]{0,300}os\.(getenv|environ\.get)\([^)]{0,40}(?i:KEY|TOKEN|SECRET)'
composite_rules:
  - id: python-filtered-environ-json-value
    desc: Filtered env mapping serialized to JSON
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/env/secret-name::python-environ-credential-filter
      - id: micro-behaviors/data/serialize/schema-object::python-json-env-field
