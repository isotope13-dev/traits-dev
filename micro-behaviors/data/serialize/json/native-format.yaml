defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: printf-json-string-pair
    desc: Printf format for JSON string pairs
    if:
      # This short fragment is absent from cleave facts text runs.
      # Match its bytes and NUL terminator in ELF read-only data.
      type: hex
      section: rodata
      pattern: '22 25 73 22 3A 22 25 73 22 00'
