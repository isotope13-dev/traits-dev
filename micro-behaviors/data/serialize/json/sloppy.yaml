# Quote normalization is a neutral string-manipulation atom.  The JSON
# behavior below is composite so this file does not label an unrelated
# `.replace("'", '"')` call as JSON parsing.
defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: json-quote-replace
    desc: Normalizes Python repr quotes before JSON parsing
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/manipulation::python-single-to-double-quote-replacement
      - id: micro-behaviors/data/serialize/json::json-loads-call
    near_bytes: 2048
