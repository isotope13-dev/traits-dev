defaults:
  platforms:
  - windows
  - unix
  crit: notable
  for:
  - python
  mbc: C0038
traits:
- id: import-marshal
  desc: Imports marshal module
  conf: 0.9
  if:
    type: symbol
    kind: import
    exact: marshal
- id: marshal-loads-from-import
  desc: Imports loads from the marshal module
  conf: 0.9
  if:
    type: text
    substr: from marshal import loads
- id: marshal-loads-symbol
  desc: marshal.loads symbol
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: marshal.loads
- id: marshal-loads-dynamic
  desc: marshal.loads dynamic import
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: __import__.loads
- id: python-code-to-timestamp-pyc
  desc: Builds a Python pyc code payload
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: importlib._bootstrap_external._code_to_timestamp_pyc
- id: marshal-load
  desc: Calls marshal.load
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: marshal.load
- id: import-pickle
  desc: Imports Python's pickle serialization module
  conf: 0.9
  if:
    type: symbol
    kind: import
    exact: pickle
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: pickle-loads
  desc: Calls pickle.loads
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: pickle.loads
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
- id: pickle-load
  desc: Loads an object with pickle.load()
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: pickle.load
  unless:
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
- id: pandas-read-pickle
  desc: Loads a pandas pickle file
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: pnd.read_pickle
- id: torch-load
  desc: Loads a PyTorch checkpoint
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: torch.load
- id: module-scope-torch-load
  desc: torch.load runs at module import
  crit: suspicious
  conf: 0.9
  if:
    type: tree-sitter
    language: python
    query: |
      ((module
         (expression_statement
           (assignment right: (call function: (attribute) @fn))))
       (#match? @fn "torch\\.load"))
      ((module
         (expression_statement
           (call function: (attribute) @fn)))
       (#match? @fn "torch\\.load"))
  unless:
  - id: well-known/lib/ai/llama2-c::source-path
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/lib/ai/e3nn::e3nn-wigner-context
  - id: well-known/lib/ai/s3prl::s3prl-speech-toolkit
  # Test trees load their own fixtures and checkpoints by design; a tutorial
  # restoring its just-trained model is not untrusted deserialization.
  - id: metadata/package/testing/presence/harness::test-directory-path
  # Weight-conversion scripts load the official checkpoint at top level as
  # their documented step; the operator runs them explicitly on their own file.
  - id: well-known/lib/ai/huggingface::transformers-weight-conversion-context
  - id: well-known/lib/ai/ggml::llama-cpp-archive-path
- id: torch-imported-load-call
  desc: Calls a bare load function
  crit: component
  conf: 0.82
  if:
    type: symbol
    kind: call
    exact: load
- id: torch-imported-load-import
  desc: Imports load from PyTorch
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?m)^\s*from\s+torch\s+import[^\n]{0,180}\bload\b
- id: python-pickle-loads-zlib
  desc: Unpickles a zlib-compressed blob
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: pickle\.loads\(\s*zlib\.decompress\s*\(
- id: joblib-load
  desc: Loads an object with joblib.load()
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: joblib.load
composite_rules:
- id: torch-imported-load
  desc: Calls imported PyTorch loader
  crit: notable
  conf: 0.9
  near_lines: 80
  all:
  - id: torch-imported-load-import
  - id: torch-imported-load-call
- id: marshal-loads
  desc: Calls marshal.loads
  crit: notable
  conf: 0.9
  any:
  - id: marshal-loads-symbol
  - id: marshal-loads-dynamic
- id: marshal-deserialization
  desc: Marshal deserialization
  crit: notable
  conf: 0.95
  any:
  - id: marshal-loads
  - id: marshal-load
- id: marshal-bytecode-materialization
  desc: Materializes a marshaled Python code object as bytecode
  crit: notable
  conf: 0.97
  all:
  - id: marshal-loads
  - id: python-code-to-timestamp-pyc
- id: pickle-deserialization
  desc: Deserializes data using Python pickle
  crit: notable
  conf: 0.95
  any:
  - id: pickle-loads
  - id: pickle-load
  downgrade:
    any:
    - id: metadata/import/python/mercurial
- id: base64-zlib-pickle-deserialization
  desc: Deserializes base64-encoded zlib-compressed data with Python pickle
  crit: notable
  conf: 0.96
  all:
  - id: pickle-loads
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
