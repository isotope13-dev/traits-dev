# Python Serialization
# Detects usage of Python serialization modules (marshal, pickle, etc.)
# MBC: C0038 (Serialize Data)
# ATT&CK: T1505 (Server Software Component)
defaults:
  platforms: [windows, unix]
  crit: notable
  for: [python]
  mbc: "C0038"
traits:
  # === Marshal Module ===
  - id: import-marshal
    desc: Imports marshal module
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: "marshal"
  - id: marshal-loads-symbol
    desc: marshal.loads symbol
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "marshal.loads"
  - id: marshal-loads-dynamic
    desc: marshal.loads dynamic import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "import__('marshal').loads"
  - id: python-code-to-timestamp-pyc
    desc: Builds a Python pyc code payload
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: "importlib._bootstrap_external._code_to_timestamp_pyc"
  - id: marshal-load
    desc: Calls marshal.load
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "marshal.load"
  # === Pickle Module ===
  - id: import-pickle
    desc: Imports Python's pickle serialization module
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: "pickle"
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: pickle-loads
    desc: Calls pickle.loads
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: "pickle.loads"
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/security-scanner::python-taint-sink-map
  - id: pickle-load
    desc: Loads an object with pickle.load()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: "pickle.load"
    unless:
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: pandas-read-pickle
    desc: Loads a pandas pickle file
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "pnd.read_pickle"
  - id: torch-load
    desc: Loads a PyTorch checkpoint
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "torch.load"
  # `torch.load` reached during import rather than from inside a function.
  # The plain `torch-load` atom says the capability is present; this says the
  # pickle runs the moment the module is imported, which is what turns a
  # bundled checkpoint into unconditional code execution. Both spellings are
  # covered: the bare call statement and the module-scope assignment
  # (`model = torch.load(...)`), which is the form real loaders use.
  - id: module-scope-torch-load
    desc: torch.load runs at module import
    crit: suspicious
    conf: 0.9
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
           (expression_statement
             (assignment right: (call function: (attribute) @fn))))
         (#match? @fn "torch\\.load"))
        ((module
           (expression_statement
             (call function: (attribute) @fn)))
         (#match? @fn "torch\\.load"))
  - id: torch-imported-load-call
    desc: Calls a bare load function
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: load
  - id: torch-imported-load-import
    desc: Imports load from PyTorch
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*from\s+torch\s+import[^\n]{0,180}\bload\b'
  - id: joblib-load
    desc: Loads an object with joblib.load()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: "joblib.load"
composite_rules:
  - id: torch-imported-load
    desc: Calls imported PyTorch loader
    crit: notable
    conf: 0.9
    near_lines: 80
    all:
      - id: torch-imported-load-import
      - id: torch-imported-load-call
  - id: marshal-loads
    desc: Calls marshal.loads
    crit: notable
    conf: 0.9
    any:
      - id: marshal-loads-symbol
      - id: marshal-loads-dynamic
  - id: marshal-deserialization
    desc: Marshal deserialization
    crit: notable
    conf: 0.95
    any:
      - id: marshal-loads
      - id: marshal-load
  - id: marshal-bytecode-materialization
    desc: Materializes a marshaled Python code object as bytecode
    crit: notable
    conf: 0.97
    all:
      - id: marshal-loads
      - id: python-code-to-timestamp-pyc
  - id: pickle-deserialization
    desc: Deserializes data using Python pickle
    # Loading pickle data is a neutral capability; the unsafe-object or code
    # execution evidence belongs in the objective rules that compose it.
    crit: notable
    conf: 0.95
    any:
      - id: pickle-loads
      - id: pickle-load
    unless:
      - id: micro-behaviors/crypto/library/blockchain/
    downgrade:
      any:
        - id: metadata/import/python::mercurial
  - id: base64-zlib-pickle-deserialization
    desc: Deserializes base64-encoded zlib-compressed data with Python pickle
    # This is a precise capability observation. It is not itself a malware
    # verdict: the data may be a legitimate benchmark or application record.
    crit: notable
    conf: 0.96
    all:
      - id: pickle-loads
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
