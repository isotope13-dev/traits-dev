# These APIs deserialize Ruby objects. Their use alone establishes neither
# obfuscation nor an attacker-controlled input; preserve the capability.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
traits:
  - id: ruby-marshal-load
    desc: Deserializes Ruby objects through Marshal
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '^(Marshal\.load|Marshal\.restore)$'
  - id: ruby-yaml-load
    desc: Deserializes YAML through Ruby YAML.load
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: YAML.load
