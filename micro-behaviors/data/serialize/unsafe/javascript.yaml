# JavaScript object graphs that rebuild callables from function-tagged records
# — distinct from JSON.parse shims and globalThis discovery idioms.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.93

traits:
  - id: js-function-tagged-record-compile
    desc: Compiles function-tagged serialized record
    attack: T1059.007
    if:
      type: text
      regex: '\[\s*__class__\s*\]\s*===\s*["'']function["''][\s\S]{0,240}Function\s*\('
