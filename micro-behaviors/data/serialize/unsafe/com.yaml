# COM-visible formatter construction is a capability; the encoded script
# deserialization workflow is classified by the objective composite.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: com-binaryformatter-construction
    desc: Constructs COM-visible .NET BinaryFormatter
    if:
      type: symbol
      kind: call
      exact: ActiveXObject
      arg:
        index: 0
        kind: string
        exact: System.Runtime.Serialization.Formatters.Binary.BinaryFormatter
  - id: com-binaryformatter-string-fragment-construction
    desc: Builds COM BinaryFormatter from string fragments
    crit: notable
    conf: 0.98
    for: [javascript, html]
    if:
      type: text
      regex: 'ActiveXObject.{0,180}(Binary[.]B["'']\+["'']inaryFormatter|Bi["'']\+["'']nary)'
