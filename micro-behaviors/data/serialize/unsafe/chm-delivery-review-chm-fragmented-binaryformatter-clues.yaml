defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-fragmented-binaryformatter-clues
  desc: CHM fragmented COM BinaryFormatter clues
  crit: suspicious
  conf: 0.99
  scope: archive
  for: [chm, html, javascript]
  attack: T1059.007,T1140,T1218.001
  all:
    - id: metadata/document/chm::chm-has-objinst
    - id: micro-behaviors/data/serialize/unsafe::com-binaryformatter-string-fragment-construction
    - id: micro-behaviors/data/serialize/unsafe::binary-formatter-fragment-deserialize-call
    - id: metadata/lang/source/naming/resource::dotnet-frombase64transform-text
    - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
    - id: micro-behaviors/os/registry/read::wscript-regread
  unless:
    - id: metadata/document/chm::chm-data-basename

