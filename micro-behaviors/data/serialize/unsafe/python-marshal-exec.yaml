defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: dynamic-marshal-loads-text
    for: [python, xml]
    desc: Dynamically imports marshal to load bytes
    crit: notable
    if:
      type: text
      regex: '__import__\([''"]marshal[''"]\)\.loads\('

  # Text form, not a call symbol: a bundle padded with megabytes of comments can
  # exhaust the parser's lexer budget, which drops the AST facts exec-builtin needs.
  - id: exec-marshal-loads-text
    desc: Executes unmarshaled Python code object
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bexec\s*\(\s*marshal\.loads\s*\('
    unless:
    - id: micro-behaviors/metaprogramming/generation/source::python-execution-template-generator
