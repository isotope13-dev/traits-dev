# A dict check after unrestricted unpickling cannot constrain reducer execution.
# Bind the checked identifier to the deserialized result in the same function;
# a check of some other value, or JSON parsing, does not establish this weakness.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-pickle-post-load-dict-check
    desc: Checks dict type after unrestricted unpickling
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (function_definition
          body: (block
            (try_statement
              body: (block
                (expression_statement
                  (assignment
                    left: (identifier) @result
                    right: (call
                      function: (attribute
                        object: (identifier) @module
                        attribute: (identifier) @load))))
                .)
              (except_clause)+
              .)
            .
            (if_statement
              condition: (not_operator
                argument: (call
                  function: (identifier) @check
                  arguments: (argument_list
                    (identifier) @checked
                    (identifier) @type)))
              consequence: (block (raise_statement))))
          (#eq? @module "pickle")
          (#eq? @load "loads")
          (#eq? @check "isinstance")
          (#eq? @type "dict")
          (#eq? @result @checked)) @validation
        (function_definition
          body: (block
            (expression_statement
              (assignment
                left: (identifier) @result
                right: (call
                  function: (attribute
                    object: (identifier) @module
                    attribute: (identifier) @load))))
            .
            (if_statement
              condition: (not_operator
                argument: (call
                  function: (identifier) @check
                  arguments: (argument_list
                    (identifier) @checked
                    (identifier) @type)))
              consequence: (block (raise_statement))))
          (#eq? @module "pickle")
          (#eq? @load "loads")
          (#eq? @check "isinstance")
          (#eq? @type "dict")
          (#eq? @result @checked)) @validation
