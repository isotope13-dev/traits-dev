defaults:
  platforms:
    - unix
    - windows
  for:
    - pe
    - csharp
traits:
  # XML serialization is a neutral capability under data/serialize/xml.
  # Bare `System.Runtime.Serialization` namespace reference relocated to
  # micro-behaviors/data/serialize/object/dotnet.yaml — it is a neutral
  # capability (the safe DataContractSerializer lives in the same namespace),
  # not an unsafe-deserialization signal. The unsafe sink is `binary-formatter`.
  - id: binary-formatter
    desc: .NET BinaryFormatter type or member reference
    crit: notable
    conf: 0.9
    mbc: C0026
    for: [pe, csharp, xml, javascript, powershell]
    if:
      type: text
      regex: '(?i)\bBinary\.BinaryFormatter\b|\bBinaryFormatter(Serialize|Deserialize)?\b'
  - id: unsafe-binary-formatter-switch
    desc: Enables unsafe BinaryFormatter serialization
    crit: notable
    conf: 0.98
    mbc: C0026
    for: [csharp]
    if:
      type: literal
      kind: string
      exact: System.Runtime.Serialization.EnableUnsafeBinaryFormatterSerialization
  - id: freeimage-dotnet-wrapper
    desc: FreeImage.NET wrapper source
    crit: notable
    conf: 0.95
    for: [csharp]
    if:
      type: path
      regex: '(?i)freeimage\.net[\\/]'
  - id: binary-formatter-deserialize-syntax
    desc: BinaryFormatter near Deserialize syntax
    crit: component
    conf: 0.8
    for: [pe, csharp, html, javascript, powershell]
    # Syntax alone can be documentation; the composite requires a parsed call.
    if:
      type: text
      regex: '(?is)\bBinaryFormatter\b.{0,400}\.\s*Deserialize(_[0-9]+)?\s*\('
    # Preserve the bounded serialize/deserialize round-trip exclusion.
    not:
      - regex: '\.\s*Serialize\s*\('
  - id: dotnet-load-from-bytes-symbol
    desc: .NET LoadFromBytes method symbol
    crit: notable
    conf: 0.78
    for:
      - pe
      - dll
    if:
      type: text
      exact: LoadFromBytes
  - id: dotnet-load-from-file-symbol
    desc: LoadFromFile member-name token
    crit: component
    conf: 0.72
    for:
      - pe
      - dll
    if:
      type: text
      exact: LoadFromFile
  - id: dotnet-custom-binary-serializer-symbol
    desc: .NET custom binary serializer symbol
    crit: notable
    conf: 0.84
    for:
      - pe
      - dll
    if:
      type: text
      exact: ICustomBinarySerializer
composite_rules:
  - id: binary-formatter-deserialize-call
    desc: Deserialize call and BinaryFormatter syntax
    crit: suspicious
    conf: 0.96
    mbc: C0026
    for: [csharp, html, javascript, powershell]
    all:
      - id: binary-formatter-deserialize-syntax
      - id: micro-behaviors/data/serialize/object::deserialize-call
    unless:
      - id: well-known/tool/offensive/peas/
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/path::test-artifact-context
      - id: metadata/file/naming::test-directory-component
      - id: well-known/app/productivity/winmerge::winmerge-full-source-archive-path
      - id: freeimage-dotnet-wrapper
  - id: dotnet-custom-binary-loader
    desc: .NET custom binary loader helpers
    crit: notable
    conf: 0.82
    for:
      - pe
      - dll
    any:
      - id: dotnet-load-from-bytes-symbol
      - id: dotnet-load-from-file-symbol
    all:
      - id: dotnet-custom-binary-serializer-symbol
