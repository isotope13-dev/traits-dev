defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: torch-load-http-derived-input
    desc: PyTorch load input comes from HTTP
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: torch.load
      arg:
        index: 0
        from:
          call: '^requests\.get$'
          through:
            - call: '^io\.BytesIO$'
              arguments: [0]
