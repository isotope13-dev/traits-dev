# The pafex/pafer campaign separates its executable pickle from this loader.
# Read/write pickle calls and frame inspection alone do not establish package
# compromise, a config path, import-time activation, or malicious payload bytes.
# Keep the unusual combination visible without assigning those missing claims.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-pickle-roundtrip-caller-frame
    desc: Pickle read/write near caller-frame inspection
    crit: suspicious
    conf: 0.96
    scope: leaf
    near_lines: 100
    all:
      - id: micro-behaviors/data/serialize/unsafe::pickle-loads
      - id: micro-behaviors/data/serialize/unsafe::pickle-dumps
      - id: micro-behaviors/metaprogramming/reflection::python-sys-getframe-caller-globals
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
      - id: well-known/lib/runtime/scripted/renpy::engine-package-init
