# Unrestricted unpickling executes reducers before the later dict check.
# The caller-frame and serialization helpers establish loader context, not
# a malicious config payload or automatic activation.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-md5-truncated-size-header-verify
    desc: Computes checksum and size header offset
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '_HEADER_SIZE\s*=\s*_CHECKSUM_SIZE\s*\+\s*_SIZE_SIZE'

  - id: python-magic-gzip-xz-zlib-decompress-dispatch
    desc: Detects gzip and XZ compression magic
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)data\[:2\]\s*==\s*b[''"]\\x1f\\x8b[''"].*?data\[:6\]\s*==\s*b[''"]\\xfd7zXZ\\x00[''"]'

  - id: python-caller-find-spec-default-config
    desc: Locates caller package config via find_spec
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)CONFIG_NAME\s*=\s*[''"]default\.config[''"].*?importlib\.util\.find_spec\(package\)'

composite_rules:
- id: python-caller-pickle-postcheck
  desc: Pickle post-check with caller-frame access
  crit: suspicious
  conf: 0.94
  for: [whl, python]
  scope: file
  all:
    - id: micro-behaviors/data/serialize/unsafe::pickle-loads
    - id: micro-behaviors/data/serialize/unsafe::pickle-dumps
    - id: micro-behaviors/metaprogramming/reflection/inspect/member::python-sys-getframe-caller-globals
    - id: micro-behaviors/data/serialize/unsafe::python-pickle-post-load-dict-check
