defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: python-marshal-loads-literal-zlib-clues
    desc: Python marshal loads and literal/zlib clues
    crit: notable
    conf: 0.85
    for:
      - python
    size_max: 5242880
    all:
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads-from-import
      - id: micro-behaviors/data/decompress/zlib::python-loads-or-zlib-header-clues
    unless:
      - id: well-known/tool/packaging/pyinstaller::packaging-toolchain-context
      - id: metadata/path/directory::test-directory-component
