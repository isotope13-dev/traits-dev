defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: numpy-load-pickle-keyword
    desc: NumPy-style load enables pickle
    crit: component
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (identifier) @module attribute: (identifier) @load)
          arguments: (argument_list (keyword_argument name: (identifier) @keyword value: (true)))) @call
        (#match? @module "^(np|numpy)$")
        (#eq? @load "load")
        (#eq? @keyword "allow_pickle")
        )

composite_rules:
  - id: numpy-load-with-pickle-enabled
    desc: NumPy import and pickle-enabled load co-occur
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: numpy-load-pickle-keyword
      - id: micro-behaviors/data/manipulation::numpy-import
