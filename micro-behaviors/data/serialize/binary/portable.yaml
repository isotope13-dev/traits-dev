# Cross-language roll-up for explicit big-endian field writes. Each member is
# a canonical, language-specific serialization observation defined once at its
# technique home.
defaults:
  platforms: [linux, macos, windows]
  for: [source, scripts]
  crit: notable
  conf: 0.95

composite_rules:
  - id: big-endian-field-write
    desc: Writes explicit big-endian binary fields
    any:
      - id: dense-big-endian-pack-into
      - id: micro-behaviors/data/buffer::uint16-be-buffer-write
      - id: micro-behaviors/data/buffer::go-big-endian-uint32-write
      - id: micro-behaviors/data/buffer::rust-big-endian-byte-conversion
      - id: dense-pack-unpack-calls
      - id: micro-behaviors/communications/ip/parse::htonl-symbol
