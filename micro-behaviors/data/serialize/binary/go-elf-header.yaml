defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.97
traits:
  - id: go-elf-header-marker-writes
    desc: Writes ELF header marker bytes
    # The letter markers at ELF offsets 1..3 must target the same buffer.
    # This establishes header construction, not an installed/executed image.
    if:
      type: tree-sitter
      language: go
      query: |
        ((statement_list
          (assignment_statement
            left: (expression_list (index_expression
              operand: (identifier) @a index: (int_literal) @one))
            operator: "="
            right: (expression_list (rune_literal) @e))
          . (assignment_statement
            left: (expression_list (index_expression
              operand: (identifier) @b index: (int_literal) @two))
            operator: "="
            right: (expression_list (rune_literal) @l))
          . (assignment_statement
            left: (expression_list (index_expression
              operand: (identifier) @c index: (int_literal) @three))
            operator: "="
            right: (expression_list (rune_literal) @f))) @header
          (#set! cleave.ignore-comments "true")
          (#eq? @a @b) (#eq? @a @c)
          (#eq? @one "1") (#eq? @two "2") (#eq? @three "3")
          (#eq? @e "'E'") (#eq? @l "'L'") (#eq? @f "'F'"))
  - id: go-copy-elf-signature
    desc: Copies an ELF signature into a buffer
    if:
      type: symbol
      kind: call
      exact: copy
      arg:
        index: 1
        from:
          value: '^\x7fELF$'
