# A PHP 64-bit reference zval has an eight-byte value, IS_REFERENCE (8),
# and a zero auxiliary word. This layout alone does not establish exploitation.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: python-reference-zval-layout-pack
    desc: Packs PHP reference-shaped type words
    for: [python]
    if:
      type: symbol
      kind: call
      exact: struct.pack
      args:
        - index: 0
          kind: string
          exact: '<QII'
        - index: 2
          kind: number
          value: 8
        - index: 3
          kind: number
          value: 0

  # Repeated reference-shaped records in a request's binary payload. A single
  # record or mere textual descriptions of zvals cannot satisfy this matcher.
  - id: many-reference-zval-layout-records
    desc: Many binary PHP reference-shaped records
    for: [data, text]
    count_min: 64
    if:
      type: hex
      pattern: '?? ?? ?? ?? ?? ?? ?? ?? 08 00 00 00 00 00 00 00'

composite_rules:
  - id: reference-zval-layout
    desc: Serializes PHP reference-shaped values
    for: [python, data, text]
    any:
      - id: python-reference-zval-layout-pack
      - id: many-reference-zval-layout-records
