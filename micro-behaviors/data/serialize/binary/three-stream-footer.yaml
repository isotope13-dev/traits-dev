defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-three-stream-footer-writer
    desc: Three-stream copy with path-and-length footer
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule three_stream_path_length_footer {
          strings:
            // fgetc/fputc loops share ESI as output, then append a 796-byte
            // record and a three-byte tag. Calls, stack slots and tag masked.
            $writer = {
              57 E8 ?? ?? ?? ?? 83 C4 34 83 F8 FF 74 15 56 50 E8 ?? ?? ?? ?? 57 E8 ?? ?? ?? ?? 83 C4 0C 83 F8 FF 75 EB 53 E8 ?? ?? ?? ?? 83 C4 04 83 F8 FF 74 15 56 50 E8 ?? ?? ?? ?? 53 E8 ?? ?? ?? ?? 83 C4 0C 83 F8 FF 75 EB 55 E8 ?? ?? ?? ?? 83 C4 04 83 F8 FF 74 15 56 50 E8 ?? ?? ?? ?? 55 E8 ?? ?? ?? ?? 83 C4 0C 83 F8 FF 75 EB 56 68 1C 03 00 00 8D 8C 24 ?? ?? ?? ?? 6A 01 51 E8 ?? ?? ?? ?? 56 6A ?? E8 ?? ?? ?? ?? 56 6A ?? E8 ?? ?? ?? ?? 56 6A ?? E8 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and (
              for any s in pe.sections : (
                s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                $writer in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size)
              ) or (
                pe.overlay.size > 0 and $writer in (pe.overlay.offset..filesize)
              )
            )
        }
