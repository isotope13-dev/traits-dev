defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-zend-hashtable-mask-pack
    desc: Packs Zend HashTable flags and bucket mask
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<II'
        - index: 3
          kind: number
          value: 16
        - index: 4
          kind: number
          value: 4294967288

  - id: python-zend-string-gc-header-pack
    desc: Packs Zend string refcount and type header
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<II'
        - index: 3
          kind: number
          value: 1
        - index: 4
          kind: number
          value: 262

  - id: python-zend-hashtable-inband-mask-pack
    desc: Packs in-band Zend HashTable flags and mask
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<II'
        - index: 3
          kind: number
          value: 17
        - index: 4
          kind: number
          value: 4294967294

  - id: python-zend-array-gc-header-pack
    desc: Packs Zend array refcount and type header
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<II'
        - index: 3
          kind: number
          value: 1
        - index: 4
          kind: number
          value: 7

  - id: python-zend-string-leak-type-pack
    desc: Packs non-collectable Zend string type header
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<I'
        - index: 3
          kind: number
          value: 22

composite_rules:
  - id: python-zend-hashtable-any-mask-pack
    desc: Packs Zend HashTable flags and bucket mask
    any:
      - id: python-zend-hashtable-mask-pack
      - id: python-zend-hashtable-inband-mask-pack
