defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-zend-hashtable-mask-pack
    desc: Packs Zend HashTable flags and bucket mask
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<II'
        - index: 3
          kind: number
          value: 16
        - index: 4
          kind: number
          value: 4294967288

  - id: python-zend-string-gc-header-pack
    desc: Packs Zend string refcount and type header
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      args:
        - index: 0
          kind: string
          exact: '<II'
        - index: 3
          kind: number
          value: 1
        - index: 4
          kind: number
          value: 262
