# Container writing alone does not establish malformed media or exploitation.
# Scope to languages that can supply every required evidence role.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, c, go, rust, ruby]
composite_rules:
- id: iso-media-item-payload-writer
  desc: Writes ISO media item payload fields
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/format/container::item-payload-box-set
  - id: micro-behaviors/data/serialize/binary::big-endian-field-write
  any:
  - id: micro-behaviors/fs/write/file/full
  - id: micro-behaviors/fs/write/stream::java-file-outputstream-write
  - id: micro-behaviors/fs/write/stream::perl-filehandle-print
  - id: micro-behaviors/data/stream/write::native-looped-write-call
  - id: micro-behaviors/data/control-flow/dispatch/named::source-named-write-call
  near_bytes: 4096
