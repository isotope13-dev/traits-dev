# Repeated indexed-field writes of value-minus-one encodings. ISO media and
# other binary formats store widths as N-1; the parsed assignment matchers keep
# comments and documentation from satisfying this structural observation.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.95

traits:
  - id: python-paired-minus-one-index-writes
    desc: Python writes paired N-1 indexed fields
    for: [python]
    count_min: 2
    if:
      type: tree-sitter
      kind: assignment
      regex: '[A-Za-z_]\w*\s*\[[^]\r\n]{1,80}\]\s*=\s*[A-Za-z_]\w*\s*-\s*1'

  - id: js-paired-minus-one-index-writes
    desc: JavaScript writes paired N-1 indexed fields
    for: [javascript]
    count_min: 2
    if:
      type: tree-sitter
      language: javascript
      kind: assignment_expression
      regex: '[A-Za-z_]\w*\s*\[[^]\r\n]{1,80}\]\s*=\s*[A-Za-z_]\w*\s*-\s*1'

  - id: c-paired-minus-one-index-writes
    desc: C source writes paired N-1 indexed fields
    for: [c]
    count_min: 2
    if:
      type: tree-sitter
      language: c
      kind: assignment_expression
      regex: '[A-Za-z_]\w*\s*\[[^]\r\n]{1,80}\]\s*=\s*[A-Za-z_]\w*\s*-\s*1'

  - id: rust-paired-minus-one-index-writes
    desc: Rust writes paired N-1 indexed fields
    for: [rust]
    count_min: 2
    if:
      type: tree-sitter
      language: rust
      kind: assignment_expression
      regex: '[A-Za-z_]\w*\s*\[[^]\r\n]{1,80}\]\s*=\s*[A-Za-z_]\w*\s*-\s*1'

  - id: go-paired-minus-one-index-writes
    desc: Go writes paired N-1 indexed fields
    for: [go]
    count_min: 2
    if:
      type: tree-sitter
      kind: assignment_statement
      regex: '[A-Za-z_]\w*\s*\[[^]\r\n]{1,80}\]\s*=\s*[A-Za-z_]\w*\s*-\s*1'

composite_rules:
  - id: paired-minus-one-index-writes
    desc: Writes paired N-1 values into indexed fields
    for: [python, javascript, c, go, rust]
    any:
      - id: python-paired-minus-one-index-writes
      - id: js-paired-minus-one-index-writes
      - id: c-paired-minus-one-index-writes
      - id: rust-paired-minus-one-index-writes
      - id: go-paired-minus-one-index-writes
