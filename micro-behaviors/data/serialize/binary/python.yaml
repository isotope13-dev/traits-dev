# Structured binary-field mutation in Python. The symbol matcher excludes
# comments and documentation; the format argument proves byte-order-aware
# serialization rather than an unrelated helper with the same name.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: dense-big-endian-pack-into
    desc: Repeatedly packs big-endian fields into a buffer
    count_min: 3
    if:
      type: symbol
      kind: call
      exact: struct.pack_into
      arg:
        index: 0
        kind: string
        substr: '>'
