defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # Component atoms for fixed-offset-buffer-fields below, split per the
  # count-re-alt guidance: a counted alternation overcounts repeats of one
  # spelling, so the spellings are separate atoms and the count lives on the
  # alternation-free numeric-pair atom.
  - id: buffer-subarray-call-name
    desc: subarray method call name
    crit: component
    conf: 0.9
    if:
      type: text
      substr: .subarray(
  - id: buffer-slice-call-name
    desc: slice method call name
    crit: component
    conf: 0.9
    if:
      type: text
      substr: .slice(
  - id: buffer-call-numeric-offset-pair
    desc: Numeric offset pair in call parentheses
    crit: component
    conf: 0.85
    count_min: 3
    if:
      type: text
      regex: '\(\s*(0x)?\d[\da-fA-F]*\s*,\s*(0x)?\d[\da-fA-F]*\s*\)'

composite_rules:
  # A decoded buffer carved into three or more constant-offset fields is a
  # packed-record parser: the writer and the reader agreed on a fixed header
  # layout. In JavaScript that shape almost only arises around a hand-rolled
  # cryptographic envelope -- `salt | iv | tag | ciphertext` -- because the
  # standard containers (JWE, PEM, protobuf, CBOR) carry their own framing and
  # are parsed by a library rather than by literal offsets.
  #
  # Notable on its own: binary format readers do this legitimately, and hex
  # offsets (`subarray(0x1c,0x2c)`) are how javascript-obfuscator prints the
  # same code. The crypto composites supply the intent.
  - id: fixed-offset-buffer-fields
    desc: Buffer split at three fixed offsets
    crit: notable
    conf: 0.8
    all:
      - id: buffer-call-numeric-offset-pair
    any:
      - id: buffer-subarray-call-name
      - id: buffer-slice-call-name
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/
