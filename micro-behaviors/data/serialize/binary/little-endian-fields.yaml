# Structured field serialization, independent of the values being serialized.
# Three distinct parsed call sites exclude comments, documentation and a lone
# integer conversion. Exploit consumers must supply their own attack evidence.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: go-repeated-little-endian-u64-writes
    desc: Repeatedly writes little-endian 64-bit fields
    for: [go]
    count_min: 3
    if:
      type: symbol
      kind: call
      exact: binary.LittleEndian.PutUint64

  - id: node-repeated-little-endian-u64-writes
    desc: Repeatedly writes little-endian 64-bit fields
    for: [javascript, typescript]
    count_min: 3
    if:
      type: symbol
      kind: call
      regex: '\.writeBigU?[Ii]nt64LE$'

  - id: rust-repeated-little-endian-u64-writes
    desc: Repeatedly writes little-endian 64-bit fields
    for: [rust]
    count_min: 3
    if:
      type: symbol
      kind: call
      exact: byteorder::LittleEndian::write_u64

  - id: managed-repeated-little-endian-u64-writes
    desc: Repeatedly writes little-endian 64-bit fields
    for: [csharp]
    count_min: 3
    if:
      type: symbol
      kind: call
      regex: '^(System\.Buffers\.Binary\.)?BinaryPrimitives\.WriteU?Int64LittleEndian$'

composite_rules:
  - id: repeated-little-endian-field-writes
    desc: Repeatedly serializes little-endian buffer fields
    for: [python, go, javascript, typescript, rust, csharp]
    any:
      - id: dense-little-endian-pack-into
      - id: go-repeated-little-endian-u64-writes
      - id: node-repeated-little-endian-u64-writes
      - id: rust-repeated-little-endian-u64-writes
      - id: managed-repeated-little-endian-u64-writes
