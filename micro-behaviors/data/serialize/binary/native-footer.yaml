defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
  crit: notable
  conf: 0.97
traits:
- id: x86-length-pair-marker-writes
  desc: x86 writes two DWORDs and variable-length tag
  if:
    type: yara
    source: |
      import "pe"
      rule length_pair_marker_writer {
        strings:
          $code = { 8D 45 ?? 6A 04 50 (8B CF|57 59) E8 ?? ?? ?? ?? 8D 45 ?? 6A 04 50 (8B CF|57 59) E8 ?? ?? ?? ?? FF 35 ?? ?? ?? ?? (8B CF|57 59) FF 35 ?? ?? ?? ?? E8 ?? ?? ?? ?? }
        condition:
          pe.machine == pe.MACHINE_I386 and (
            for any s in pe.sections : (
              (s.name == ".text" or s.characteristics & pe.SECTION_MEM_EXECUTE != 0) and
              $code in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size)
            ) or (pe.overlay.size > 0 and $code in (pe.overlay.offset..filesize))
          )
      }
