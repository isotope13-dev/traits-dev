# Varint (LEB128-style) length-prefixed binary encoding in JavaScript: a
# preencode/encode/decode triple over a shared cursor state. Each leg below is
# meaningless on its own -- `Out of bounds` is ordinary error text -- so they
# are components that only carry meaning through the composite.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: component
traits:
  - id: js-varint-codec-preencode
    desc: JavaScript varint preencode helper
    conf: 0.9
    if:
      type: text
      substr: function preencode(state, num)
  - id: js-varint-codec-bounds
    desc: JavaScript varint bounds checks
    conf: 0.9
    if:
      type: text
      substr: Out of bounds
  - id: js-varint-codec-byte-mask
    desc: JavaScript varint byte mask constants
    conf: 0.85
    if:
      type: text
      regex: '0x10000[\s\S]{0,999}0xff'
composite_rules:
  - id: js-varint-codec
    desc: JavaScript varint codec implementation
    crit: baseline
    conf: 0.95
    all:
      - id: js-varint-codec-preencode
      - id: js-varint-codec-bounds
      - id: js-varint-codec-byte-mask
