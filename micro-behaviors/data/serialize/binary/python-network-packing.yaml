# Binary packing formats do not by themselves establish DNS or exfiltration.
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.85
  id: python-pack-big-endian-format
  desc: Packs fields using big-endian format
  if:
    type: symbol
    kind: call
    exact: struct.pack
    arg:
      index: 0
      kind: string
      regex: ^[!>]
