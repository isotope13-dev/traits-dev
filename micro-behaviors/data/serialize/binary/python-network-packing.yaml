# Binary packing formats do not by themselves establish DNS or exfiltration.
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.85
  id: python-pack-network-order
  desc: Packs fields with network-order format
  if:
    type: symbol
    kind: call
    exact: struct.pack
    arg:
      kind: string
      regex: ^!
