defaults:
  platforms: [windows, unix]
  for: [php, data, xml]
  crit: notable
  conf: 0.88
traits:
  - id: php-unpack-call
    desc: unpack binary-parse call
    if:
      type: symbol
      kind: call
      exact: unpack
  - id: php-pack-call
    for: [php]
    desc: PHP packs values into binary bytes
    if:
      type: symbol
      kind: call
      exact: pack
