defaults:
  platforms: [unix, windows]
  for: [xml, scripts, source, text]
  crit: notable
  conf: 0.98

traits:
  - id: java-xmldecoder-document
    desc: XML document declares Java XMLDecoder
    if:
      type: text
      regex: '<java\b[^>]{0,240}\bclass\s*=\s*["'']java\.beans\.XMLDecoder["'']'

  - id: xml-bean-start-instruction
    desc: XML bean declares a start invocation
    if:
      type: text
      regex: '<void\s+method\s*=\s*["'']start["'']\s*/?>'
