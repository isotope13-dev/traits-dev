defaults:
  platforms: [windows, unix]
  for: [java]
  crit: notable
  conf: 0.94

traits:
  - id: java-xmldecoder-constructor
    desc: Constructs a Java XMLDecoder
    if:
      type: symbol
      kind: call
      regex: '(^|\.)XMLDecoder$'
    unless:
      - type: basename
        exact: ct.sym
      - type: basename
        regex: \.sig$
