defaults:
  platforms: [windows, unix]
  for: [java]
  crit: notable
  conf: 0.94

traits:
  - id: java-xmldecoder-constructor
    desc: Constructs a Java XMLDecoder
    if:
      type: symbol
      kind: call
      regex: '(^|\.)XMLDecoder$'
    unless:
      - id: well-known/lib/runtime/openjdk::jdk-distribution-artifact
