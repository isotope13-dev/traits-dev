# Python JSON Lines (JSONL/NDJSON) Deserialization
# MBC: C0024 (Data Transformation)
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: comprehension-parse
    desc: List comprehension parses JSON lines
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'json\.loads\([^()\n]{0,40}\)\s*for\s+\w+\s+in\s+\w+'
