defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.9
  mbc: C0032

traits:
  - id: go-protobuf-import
    desc: Imports Go protobuf serialization package
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: google.golang.org/protobuf/proto

  - id: go-protobuf-marshal
    desc: Marshals a protobuf message in Go
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: proto.Marshal

  - id: go-protobuf-unmarshal
    desc: Unmarshals a protobuf message in Go
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: proto.Unmarshal
