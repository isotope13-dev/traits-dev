defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-protobuf-schema-registration
    desc: Registers a serialized protobuf schema
    if:
      type: symbol
      kind: call
      exact: add_serialized_file

  - id: ruby-protobuf-descriptor-decode
    desc: Decodes a protobuf file descriptor
    if:
      type: tree-sitter
      kind: call
      regex: 'Google::Protobuf::FileDescriptorProto\.decode\s*\('
