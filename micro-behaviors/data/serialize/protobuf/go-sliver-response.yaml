# Constructs a typed protobuf response inside another protobuf message.
# This does not establish marshaling, transmission, or a completed RPC.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99
traits:
  - id: go-sliver-response-envelope
    desc: Constructs a Sliver RPC response envelope
    if:
      type: tree-sitter
      language: go
      query: |
        ((source_file
        (import_declaration [
          (import_spec !name path: (interpreted_string_literal (interpreted_string_literal_content) @module))
          (import_spec_list (import_spec !name path: (interpreted_string_literal (interpreted_string_literal_content) @module)))
        ])
        (method_declaration body: (block (statement_list
           (short_var_declaration right: (expression_list
             (unary_expression operand: (composite_literal body: (literal_value
               (keyed_element value: (literal_element
                 (unary_expression operand: (composite_literal
                   type: (qualified_type package: (package_identifier) @package
                     name: (type_identifier) @type)))) @evidence))))))))))
        (#eq? @module "github.com/bishopfox/sliver/protobuf/commonpb")
        (#eq? @package "commonpb")
        (#eq? @type "Response"))
        ((source_file
        (import_declaration [
          (import_spec name: (package_identifier) @import_alias path: (interpreted_string_literal (interpreted_string_literal_content) @module))
          (import_spec_list (import_spec name: (package_identifier) @import_alias path: (interpreted_string_literal (interpreted_string_literal_content) @module)))
        ])
        (method_declaration body: (block (statement_list
           (short_var_declaration right: (expression_list
             (unary_expression operand: (composite_literal body: (literal_value
               (keyed_element value: (literal_element
                 (unary_expression operand: (composite_literal
                   type: (qualified_type package: (package_identifier) @package
                     name: (type_identifier) @type)))) @evidence))))))))))
        (#eq? @module "github.com/bishopfox/sliver/protobuf/commonpb")
        (#eq? @package @import_alias)
        (#eq? @type "Response"))
