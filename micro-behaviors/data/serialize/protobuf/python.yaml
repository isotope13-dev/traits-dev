# Python Protocol Buffers capability indicators.  Match the import or the
# serialization call itself; a prose mention of "protobuf" is not evidence
# that the program serializes data.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-protobuf-import
    desc: Imports Python protobuf runtime
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '(^|\.)(google\.protobuf|protobuf)(\.|$)'

  - id: python-protobuf-serialize
    desc: Serializes Python protobuf message
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SerializeToString$'

  - id: python-protobuf-parse
    desc: Parses Python protobuf message
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ParseFromString$'
