# Copying a browser-API cookie into a new record with its value and its
# httpOnly attribute: the shape of a cookie-jar export meant to be replayed
# in another browser (httpOnly cookies are the session cookies page script
# cannot read). Cookie managers that display or back up cookies also do this.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: cookie-record-value-and-httponly-copy
    desc: Copies cookie value with httpOnly attribute
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bvalue:\s*(\w+)\.value,[\s\S]{0,200}\bhttpOnly:\s*\w+\.httpOnly'
