defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9
traits:
- id: cookies-json-body
  desc: Serializes cookies in a JSON object
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'JSON\.stringify\s*\(\s*\{[^}\n]{0,500}\bcookies\s*:'
  unless:
  - id: metadata/file/format/news::serialized-news-article-catalog
