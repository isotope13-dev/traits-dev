defaults:
  platforms: [windows, unix]
  for: [jsp]
  crit: notable
  conf: 0.94

traits:
  # Writing an INSERT statement to a stream creates SQL text; it does not
  # execute the statement or modify database rows.
  - id: jsp-insert-row-text
    desc: JSP appends SQL INSERT row text
    if:
      type: text
      regex: '\.(append|write)\s*\(\s*"INSERT\s+INTO\s+'
