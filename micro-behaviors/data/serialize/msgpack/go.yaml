defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.88
  mbc: C0032

traits:
  - id: go-msgpack-import
    desc: Go msgpack package reference
    for: [go, elf, macho, pe, dll]
    conf: 0.88
    if:
      type: text
      substr: "github.com/vmihailenco/msgpack"
  - id: go-msgpack-struct-tag-source
    desc: Go msgpack struct tag in source
    conf: 0.9
    if:
      type: text
      substr: 'msgpack:"'
  - id: go-msgpack-struct-tag-binary
    desc: Go msgpack struct tag in binary
    for: [elf, macho, pe]
    conf: 0.9
    if:
      type: raw
      regex: '[\x09-\x2f]msgpack:"[A-Za-z0-9_]'
  - id: go-msgpack-new-decoder
    desc: Go msgpack decoder creation
    conf: 0.9
    if:
      type: text
      regex: '\bmsgpack\.NewDecoder\s*\('
  - id: go-msgpack-new-encoder
    desc: Go msgpack encoder creation
    conf: 0.9
    if:
      type: text
      regex: '\bmsgpack\.NewEncoder\s*\('
  - id: go-msgpack-marshal
    desc: Go msgpack marshal call
    conf: 0.88
    if:
      type: text
      regex: '\bmsgpack\.(Marshal|Unmarshal)\s*\('

composite_rules:
  - id: go-msgpack-struct-tag
    desc: Go msgpack struct field tag
    for: [go, elf, macho, pe, dll]
    conf: 0.9
    any:
      - id: go-msgpack-struct-tag-source
      - id: go-msgpack-struct-tag-binary

  - id: go-msgpack-serialization
    desc: Go msgpack serialization
    for: [go, elf, macho, pe, dll]
    conf: 0.92
    all:
      - id: go-msgpack-import
    any:
      - id: go-msgpack-struct-tag
      - id: go-msgpack-new-decoder
      - id: go-msgpack-new-encoder
      - id: go-msgpack-marshal
