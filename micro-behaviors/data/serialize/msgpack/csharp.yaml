defaults:
  platforms: [windows]
  for: [csharp, pe, dll]

traits:
  - id: dotnet-messagepacklib-namespace
    desc: .NET MessagePackLib serialization namespace
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: MessagePackLib.MessagePack

  - id: dotnet-msgpack-type-name
    desc: .NET Msgpack serializer type name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Msgpack
