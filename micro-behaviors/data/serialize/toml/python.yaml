# Python TOML deserialization
# MBC: C0024 (Data Transformation)
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [python]
traits:
  - id: toml-load-call
    desc: Python toml.load file parser
    if:
      type: symbol
      kind: call
      exact: toml.load
  - id: toml-loads-call
    desc: Python toml.loads parses a TOML string
    if:
      type: symbol
      kind: call
      exact: toml.loads
