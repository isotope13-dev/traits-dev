defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9
  mbc: C0024

traits:
  - id: pelletier-toml-import
    desc: Imports the Go TOML parser
    if:
      type: import
      exact: github.com/pelletier/go-toml

  - id: go-toml-unmarshal
    desc: Unmarshals TOML data in Go
    if:
      type: symbol
      kind: call
      exact: toml.Unmarshal

composite_rules:
  - id: go-toml-parser
    desc: Go source parses TOML data
    crit: notable
    conf: 0.92
    all:
      - id: pelletier-toml-import
      - id: go-toml-unmarshal
