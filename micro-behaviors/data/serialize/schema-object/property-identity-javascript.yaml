defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.9
traits:
- id: host-user-object-fields
  desc: Object literal declares host or user
  crit: notable
  if:
    # Require an object pair, excluding documentation and type signatures.
    type: tree-sitter
    query: |
      (pair key: (property_identifier) @key
        (#match? @key "^(host|user)$"))
- id: repository-object-fields
  desc: gname, gmail or repo object-key syntax
  crit: notable
  if:
    type: text
    regex: '(^|[,{]\s*)(gname|gmail|repo)\s*:'
- id: machine-id-object-field
  desc: Object-key syntax named mid
  crit: component
  if:
    type: text
    regex: '(^|[,{]\s*)mid\s*:'
