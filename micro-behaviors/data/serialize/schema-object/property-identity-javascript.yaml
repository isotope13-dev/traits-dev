defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.9
traits:
- id: host-user-object-fields
  desc: Host or user object-key syntax
  crit: notable
  if:
    type: text
    regex: '(^|[,{]\s*)(host|user)\s*:'
  not:
  - regex: (host|user)\s*:\s*(unknown|string|number|boolean|object|any)\b
- id: repository-object-fields
  desc: gname, gmail or repo object-key syntax
  crit: notable
  if:
    type: text
    regex: '(^|[,{]\s*)(gname|gmail|repo)\s*:'
- id: machine-id-object-field
  desc: Object-key syntax named mid
  crit: component
  if:
    type: text
    regex: '(^|[,{]\s*)mid\s*:'
