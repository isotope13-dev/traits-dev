defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  mbc: E1003

traits:
  - id: passwords-json-string-field
    desc: "JSON passwords string field"
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: '"passwords":"'
  - id: credit-cards-json-string-field
    desc: "JSON credit cards string field"
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: '"credit_cards":"'
  - id: firefox-cookies-json-string-field
    desc: "JSON Firefox cookies string field"
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: '"firefox_cookies":"'
