defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: send-object-argument-text
    desc: Send payload uses object or array syntax
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bsend\s*\(\s*(JSON\.stringify\s*\(\s*)?[\[{]'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
