traits:
  - id: host-platform-arch-text-sequence
    platforms: [unix, windows]
    for: [javascript, typescript]
    desc: Hostname, platform and architecture text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'hostname[\s\S]{0,300}(platform|kernel|uname)[\s\S]{0,300}(arch|network)'
