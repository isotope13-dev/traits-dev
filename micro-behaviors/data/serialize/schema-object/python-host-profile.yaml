defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-host-id-object-fields
    desc: Python object host-identity fields
    if:
      type: text
      regex: '["''](hostname|ip_address)["'']\s*:\s*[^,\n]{0,30}(gethostname|gethostbyname)'

  - id: python-hostname-object-field
    desc: Python hostname field from lookup result
    if:
      type: text
      regex: 'gethostname\s*\(\)[\s\S]{0,160}["'']hostname["'']\s*:\s*\w+'

  - id: python-system-machine-object-fields
    desc: Object system or machine field from platform
    if:
      type: text
      regex: '["''](system|machine)["'']\s*:\s*platform\.(system|machine)\s*\('

  - id: python-platform-object-fields
    desc: Object platform field from runtime query
    if:
      type: text
      regex: '["''](platform|architecture|processor)["'']\s*:\s*[^,\n]{0,12}platform\.(system|machine)'
