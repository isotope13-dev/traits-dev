defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-host-id-object-fields
    desc: Python object host-identity fields
    if:
      type: text
      regex: '["''](hostname|ip_address)["'']\s*:\s*[^,\n]{0,30}(gethostname|gethostbyname)'

  - id: python-hostname-object-field
    desc: Python hostname field from lookup result
    if:
      type: text
      regex: 'gethostname\s*\(\)[\s\S]{0,160}["'']hostname["'']\s*:\s*\w+'

  - id: python-platform-object-fields
    desc: Object field set from platform system query
    if:
      type: text
      regex: '["''](platform|arch\w*|system|machine)["'']\s*:[^,\n]{0,14}platform\.(system|machine)'

  # A host profile is one object carrying two of platform, host and user
  # identity. A heartbeat that reports only `"platform": platform.system()`
  # beside its own node id is not a profile of the host.
  - id: python-host-profile-object-fields
    desc: Object pairs platform, host or user fields
    if:
      type: text
      regex: '["''](platform|host|user)(name)?["'']\s*:[^{}]{0,300}["''](platform|host|user)(name)?["'']\s*:'
