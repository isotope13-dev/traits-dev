defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-prompt-text-map-field
    desc: Assigns prompt text map field
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: go
      query: |
        ((assignment_statement) @assignment
         (#match? @assignment "\\[\\\"prompt\\\"\\][ \\t]*=[ \\t]*map\\[string\\](interface\\{\\}|any)[ \\t]*\\{[ \\t]*\\\"text\\\"[ \\t]*:"))
