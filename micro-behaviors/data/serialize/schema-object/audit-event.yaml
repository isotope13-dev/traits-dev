# Exchange audit-log shapes associated with automated mailbox collection.
# The individual fields are neutral log facts; the suspicious composites
# require the unusual client and successful message-content access together.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  attack: T1114.002

traits:
  - id: api-id-guid-field
    desc: "APIId field containing a GUID"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']APIId["'']\s*:\s*["''][0-9a-f-]{36}["'']'
  - id: api-id-guid-property
    desc: "APIId property containing a GUID"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)"Name"\s*:\s*"APIId".{0,24}"Value"\s*:\s*"[0-9a-f-]{36}"'
  - id: client-app-guid-field
    desc: "ClientAppId field containing a GUID"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']ClientAppId["'']\s*:\s*["''][0-9a-f-]{36}["'']'
  - id: client-app-guid-property
    desc: "ClientAppId property containing a GUID"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)"Name"\s*:\s*"ClientAppId".{0,24}"Value"\s*:\s*"[0-9a-f-]{36}"'
composite_rules:
  - id: api-id-guid-value
    desc: "API identifier GUID field or property"
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/data/serialize/schema-object::api-id-guid-field
      - id: micro-behaviors/data/serialize/schema-object::api-id-guid-property
  - id: client-app-guid-value
    desc: "Client application GUID field or property"
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/data/serialize/schema-object::client-app-guid-field
      - id: micro-behaviors/data/serialize/schema-object::client-app-guid-property
