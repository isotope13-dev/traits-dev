# Canonical GUID fields retain direct and Name/Value encodings.
defaults:
  platforms: [unix, windows]
  for: [json, text]

traits:
  - id: api-id-guid-value
    desc: API identifier GUID field or property
    crit: notable
    conf: 0.93
    if:
      type: yara
      source: |
        rule api_id_guid_value {
          strings:
            $form0 = /["']APIId["']\s*:\s*["'][0-9a-f-]{36}["']/ nocase
            $form1 = /"Name"\s*:\s*"APIId".{0,24}"Value"\s*:\s*"[0-9a-f-]{36}"/ nocase
          condition:
            any of them
        }
  - id: client-app-guid-value
    desc: Client application GUID field or property
    crit: notable
    conf: 0.93
    if:
      type: yara
      source: |
        rule client_app_guid_value {
          strings:
            $form0 = /["']ClientAppId["']\s*:\s*["'][0-9a-f-]{36}["']/ nocase
            $form1 = /"Name"\s*:\s*"ClientAppId".{0,24}"Value"\s*:\s*"[0-9a-f-]{36}"/ nocase
          condition:
            any of them
        }
