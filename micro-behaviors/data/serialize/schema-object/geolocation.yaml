defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: component
  conf: 0.5
traits:
  - id: city-field-key
    crit: component
    desc: Object has a city field
    if:
      type: text
      substr: '"city":'

  - id: region-field-key
    crit: component
    desc: Object has a region field
    if:
      type: text
      substr: '"region":'

  - id: country-code-camel
    crit: notable
    desc: Contains a countryCode data field
    if:
      type: text
      word: countryCode
    unless:
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: country-code-snake
    crit: notable
    desc: country_code data field
    if:
      type: text
      word: country_code
    unless:
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: country-name
    crit: notable
    desc: country_name data field
    if:
      type: text
      word: country_name
