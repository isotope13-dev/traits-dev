defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  - id: json-stringify-email-field
    for: [javascript, typescript]
    desc: Serializes an email field to JSON
    conf: 0.92
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,160}\bemail\s*[:,}]'
  - id: json-stringify-magic-link-field
    for: [javascript, typescript]
    desc: Serializes magic link field to JSON
    conf: 0.93
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,200}\bmagicLink\b'
  - id: payload-user-field
    for: [javascript, typescript]
    desc: Payload contains a user field
    conf: 0.9
    if:
      type: text
      regex: '\bpayload\s*=\s*\{[\s\S]{0,700}\buser\s*:'
  - id: payload-quiz-content-field
    for: [javascript, typescript]
    desc: Payload contains quiz content field
    conf: 0.9
    if:
      type: text
      regex: '\bpayload\s*=\s*\{[\s\S]{0,700}\b(quiz|question|pageContent)\s*:'
  - id: payload-timestamp-field
    for: [javascript, typescript]
    desc: Payload contains a timestamp field
    conf: 0.9
    if:
      type: text
      regex: '\bpayload\s*=\s*\{[\s\S]{0,700}\btimestamp\s*:'
  - id: json-object-action-field
    for: [javascript, typescript]
    desc: JSON payload includes an action field
    conf: 0.82
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,180}\baction\s*[:,}]'
  - id: identity-platform-json-payload
    for: [javascript, typescript]
    desc: JSON payload has an ID and platform
    conf: 0.9
    if:
      type: text
      regex: '(?is)JSON\.stringify\s*\(\s*\{.{0,120}(id|installId|clientId):.{0,100}platform\s*:'
  - id: json-stringify-title-content-fields
    for: [javascript, typescript]
    desc: Serializes title and content fields as JSON
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,240}(title|subject)\s*:[^}]{0,160}(content|message)\s*:'
  - id: json-object-body-field
    for: [html, javascript, typescript, php]
    desc: Serializes an object into a body field
    conf: 0.9
    if:
      type: text
      regex: '\bbody\s*:\s*JSON\.stringify\(\s*\{'
  - id: json-stringified-text-field
    for: [html, javascript, typescript, php]
    desc: Assigns JSON serialization to text or caption
    conf: 0.9
    if:
      type: text
      regex: '\b(text|caption)\s*:\s*JSON\.stringify\('
composite_rules:
  - id: json-user-content-timestamp-payload
    for: [javascript, typescript]
    desc: Serializes user content with timestamp payload
    conf: 0.94
    near_bytes: 1800
    all:
      - id: payload-user-field
      - id: payload-quiz-content-field
      - id: payload-timestamp-field
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
  - id: nested-json-text-body
    for: [html, javascript, typescript, php]
    desc: Nests serialized text inside a JSON body
    conf: 0.95
    near_bytes: 400
    all:
      - id: json-object-body-field
      - id: json-stringified-text-field
