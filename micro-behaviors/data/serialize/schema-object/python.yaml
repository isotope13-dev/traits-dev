# Python JSON Deserialization
# MBC: C0024 (Data Transformation)
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-json-env-field
    desc: Python JSON object includes env field
    conf: 0.9
    if:
      type: text
      regex: 'json\.dumps?\s*\(\s*\{[\s\S]{0,320}["'']env["'']\s*:'
  - id: python-architecture-field-key
    desc: Python mapping architecture field
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: architecture
