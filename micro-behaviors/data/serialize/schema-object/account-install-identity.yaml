defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: passes-email-and-install-identity-payload
    size_max: 450000
    desc: Passes email and install identity payload
    if:
      type: tree-sitter
      # Key checks run as text predicates on the whole object: matching two
      # unanchored pair children made this query a rule-perf outlier.
      query: |
        (switch_case
          (expression_statement (assignment_expression
            left: (identifier) @payload right: (object) @fields))
          . (comment)*
          . (return_statement (array (number)
            (call_expression arguments: (arguments
              (string) (identifier) @sent))))
          (#eq? @payload @sent)
          (#match? @fields "[{,]\\s*(customer_email|emailAddress|ownerEmail)\\s*:")
          (#match? @fields "[{,]\\s*(extension_user_id|install_id|client_id)\\s*:")) @identity
        (switch_case
          (expression_statement (assignment_expression
            left: (identifier) @payload right: (object) @fields))
          . (comment)*
          . (return_statement (array (number)
            (call_expression arguments: (arguments
              (string) (identifier) @sent))))
          (#eq? @payload @sent)
          (#match? @fields "(?s)[{,]\\s*(install_id|client_id)\\s*:.*[{,]\\s*email\\s*:")) @identity
