defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  # An object holding an email key and an install-identity key is assigned
  # and then sent by the same switch case (@payload/@sent equality). Key
  # checks run as predicates on the object text: pairing two unanchored
  # pair children was quadratic on large bundled objects.
  - id: passes-email-and-install-identity-payload
    size_max: 450000
    desc: Passes email and install identity payload
    if:
      # Keys may appear in either order, including inside a nested object
      # in the payload; a bare email key pairs with any install key.
      type: tree-sitter
      query: |
        (switch_case
          (expression_statement (assignment_expression
            left: (identifier) @payload right: (object) @fields))
          (return_statement (array (number)
            (call_expression arguments: (arguments
              (string) (identifier) @sent))))
          (#eq? @payload @sent)
          (#match? @fields "[{,]\\s*(customer_email|emailAddress|ownerEmail|email)\\s*:")
          (#match? @fields "[{,]\\s*(extension_user_id|install_id|client_id)\\s*:")) @identity
