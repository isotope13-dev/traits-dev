defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: passes-email-and-install-identity-payload
    desc: Passes email and install identity payload
    if:
      type: tree-sitter
      query: |
        ((switch_case
          (expression_statement (assignment_expression
            left: (identifier) @payload right: [
              (object (pair key: (property_identifier) @install)
                (pair key: (property_identifier) @email))
              (object (pair key: (property_identifier) @email)
                (pair key: (property_identifier) @install))]))
          . (comment)*
          . (return_statement (array (number)
            (call_expression arguments: (arguments
              (string) (identifier) @sent))))) @identity
          (#eq? @payload @sent)
          (#match? @email "^(customer_email|emailAddress|email|ownerEmail)$")
          (#match? @install "^(extension_user_id|install_id|client_id)$"))
