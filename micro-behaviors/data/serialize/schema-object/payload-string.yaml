defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]

traits:
  - id: payload-string-field
    desc: JSON/data/body/payload field has string value
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)["''](json|data|body|payload)["'']\s*:\s*["'']'
    unless:
      - id: metadata/lang/source::js-exported-string-enum-cluster

