defaults:
  for: [python, javascript, shell]
  platforms: [unix, windows]
traits:
  - id: complete-save-format-variable-field
    desc: Complete-save format variable field
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '["\x27]format["\x27]\s*:\s*[A-Za-z_]\w{0,60}\s*,\s*["\x27]savetype["\x27]\s*:\s*3'
  - id: complete-save-type
    desc: ONLYOFFICE complete-all save request
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '["\x27]savetype["\x27]\s*:\s*3[ ,}]'
