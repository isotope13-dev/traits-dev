defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.96

traits:
  - id: compiled-command-result-fields
    desc: Compiled command-result report field sequence
    if:
      type: raw
      section: .rdata
      substr: comsuccessecdurst1
  - id: compiled-output-truncation-fields
    desc: Compiled output-truncation report fields
    if:
      type: raw
      section: .rdata
      substr: st2trunc1trunc2err
  - id: compiled-app-profile-file-fields
    desc: Compiled application-profile file fields
    if:
      type: raw
      section: .rdata
      regex: 'appIdpnsFile(bprFile|rFilebp)'
  - id: compiled-profile-control-offset-fields
    desc: Compiled profile-control offset field sequence
    if:
      type: raw
      section: .rdata
      substr: OffsetEMOffsetEAOffsetLSOffsetTNSSAPSAC
