# Generic object-field shapes belong below serialization, not in objectives.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9

traits:
  - id: host-field-key
    crit: notable
    desc: JSON-like host identity field
    if:
      type: text
      regex: '["''](host|hostname)["'']\s*:'

  - id: environment-field-key
    desc: JSON-like environment field
    if:
      type: text
      regex: '["''](env|ev)["'']\s*:'

  - id: pwd-passwd-field-key
    crit: notable
    desc: JSON-like pwd or passwd field
    if:
      type: text
      regex: '["''](pwd|passwd)["'']\s*:'

  - id: home-directory-field-key
    crit: notable
    desc: JSON-like home or current-directory field
    if:
      type: text
      regex: '["''](home|home_directory|current_directory)["'']\s*:'

  - id: user-field-key
    crit: notable
    desc: JSON-like user identity field
    if:
      type: text
      regex: '["''](user|username|whoami)["'']\s*:'

  - id: ipv4-field-value
    crit: notable
    desc: JSON-like IP field with IPv4 literal
    conf: 0.86
    if:
      type: text
      regex: '["''](ip|addr)["'']\s*:\s*["'']\d{1,3}(\.\d{1,3}){3}["'']'

  - id: platform-field-key
    crit: notable
    desc: JSON-like platform or OS field
    conf: 0.86
    if:
      type: text
      regex: '["''](platform|os|os_info)["'']\s*:'

  # Relocated from communications/http/request/tasking: a field named
  # seq/sequence/task_id is a generic schema observation (journal sequence
  # numbers, ordering fields, task IDs alike), not HTTP-tasking evidence on
  # its own. Backdoor composites pair it with command/liveness fields.
  - id: structured-sequence-field
    crit: notable
    desc: Structured object names a sequence field
    if:
      type: text
      regex: '\b(seq|sequence|task_id)\b["'']?\s*:'

composite_rules:
  - id: host-user-field-pair
    desc: JSON-like host and user identity fields
    crit: notable
    conf: 0.9
    near_bytes: 500
    all:
      - id: host-field-key
      - id: user-field-key

  - id: user-path-profile-fields
    desc: JSON-like user or home-path field
    crit: notable
    conf: 0.88
    any:
      - id: user-field-key
      - id: home-directory-field-key

  - id: compact-host-profile-fields
    desc: Compact host-profile field set
    needs: 3
    any:
      - id: host-field-key
      - id: environment-field-key
      - id: pwd-passwd-field-key
      - id: home-directory-field-key
      - id: user-field-key
      - id: ipv4-field-value
      - id: platform-field-key
