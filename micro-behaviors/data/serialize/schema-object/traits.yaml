# Generic object-field shapes belong below serialization, not in objectives.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9

traits:
- id: object-success-field
  desc: Object has a success or status field
  crit: notable
  conf: 0.86
  for: [json, javascript, typescript, python, go, rust, java, shell, powershell, source]
  if:
    type: text
    regex: '(?i)["''](status|success|ok)["'']\s*:\s*(2\d\d|true)\b'

- id: environment-field-key
  desc: JSON-like environment field
  if:
    type: text
    regex: '["''](env|ev)["'']\s*:'
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: domain-field-key
  crit: notable
  desc: JSON-like domain name field
  if:
    type: text
    regex: '["''](domain|domain_name)["'']\s*:'
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: persistence-field-key
  crit: notable
  desc: JSON-like persist or persistence field
  if:
    type: text
    regex: '(?i)["'']persist(ence)?["'']\s*:'
  unless:
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

- id: ipv4-field-value
  crit: notable
  desc: JSON-like IP field with IPv4 literal
  conf: 0.86
  if:
    type: text
    regex: '["''](ip|addr)["'']\s*:\s*["'']\d{1,3}(\.\d{1,3}){3}["'']'

  # Relocated from communications/http/request/tasking: a field named
  # seq/sequence/task_id is a generic schema observation (journal sequence
  # numbers, ordering fields, task IDs alike), not HTTP-tasking evidence on
  # its own. Backdoor composites pair it with command/liveness fields.
- id: structured-sequence-field
  for: [scripts, source, json, pe]
  crit: baseline
  desc: 'Object key named seq, sequence or task_id'
  if:
    type: text
    regex: '\b(seq|sequence|task_id)\b["'']?\s*:'

- id: heartbeat-field-key
  desc: Object key named ping, heartbeat or alive
  crit: notable
  conf: 0.9
  if:
    type: text
      # This is a field-name observation, not a network or liveness operation.
      # Function-valued export entries are excluded.
    regex: '(^|[,{]\s*)["'']?(ping|heartbeat|alive)["'']?\s*:\s*[^\s(,}][\w.]*'
  not:
  - regex: ':\s*(function|async)$'
  unless:
  - id: metadata/file/catalog/vocabulary::huggingface-bpe-tokenizer-json

composite_rules:
- id: heartbeat-sequence-fields
  desc: Object has heartbeat and sequence field names
  crit: component
  conf: 0.9
  near_bytes: 512
  all:
  - id: heartbeat-field-key
  - id: structured-sequence-field
  for: [scripts, source, json, pe]
