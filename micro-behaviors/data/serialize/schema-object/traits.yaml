# Generic object-field shapes belong below serialization, not in objectives.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9

traits:
  - id: host-field-key
    crit: notable
    desc: JSON-like host or hostname field
    if:
      type: text
      regex: '["''](host|hostname)["'']\s*:'

  - id: environment-field-key
    desc: JSON-like environment field
    if:
      type: text
      regex: '["''](env|ev)["'']\s*:'

  - id: pwd-passwd-field-key
    crit: notable
    desc: JSON-like pwd or passwd field
    if:
      type: text
      regex: '["''](pwd|passwd)["'']\s*:'

  - id: home-directory-field-key
    crit: notable
    desc: JSON-like home or current-directory field
    if:
      type: text
      regex: '["''](home|home_directory|current_directory)["'']\s*:'

  - id: user-field-key
    crit: notable
    desc: User identity field declaration
    if:
      type: text
      regex: '["''](user|username|whoami)["'']\s*[:=]'

  - id: computer-field-key
    crit: notable
    desc: JSON-like computer name field
    if:
      type: text
      regex: '(?i)["'']computer(_name)?["'']\s*:'

  - id: domain-field-key
    crit: notable
    desc: JSON-like domain name field
    if:
      type: text
      regex: '["''](domain|domain_name)["'']\s*:'

  - id: persistence-field-key
    crit: notable
    desc: JSON-like persist or persistence field
    if:
      type: text
      regex: '(?i)["'']persist(ence)?["'']\s*:'
    unless:
      - id: metadata/package/runtime::vscode-extension

  - id: ipv4-field-value
    crit: notable
    desc: JSON-like IP field with IPv4 literal
    conf: 0.86
    if:
      type: text
      regex: '["''](ip|addr)["'']\s*:\s*["'']\d{1,3}(\.\d{1,3}){3}["'']'

  - id: platform-field-key
    crit: notable
    desc: JSON-like platform or OS field
    conf: 0.86
    if:
      type: text
      regex: '[{,]\s*["''](platform|os|os_info)["'']\s*:'

  - id: runtime-version-field-key
    desc: JSON-like platform or interpreter version field
    for: [scripts, source, json, python]
    if:
      type: text
      regex: '["''](platform_release|platform_version|python_version|python_executable)["'']\s*:'

  # Relocated from communications/http/request/tasking: a field named
  # seq/sequence/task_id is a generic schema observation (journal sequence
  # numbers, ordering fields, task IDs alike), not HTTP-tasking evidence on
  # its own. Backdoor composites pair it with command/liveness fields.
  - id: structured-sequence-field
    for: [scripts, source, json, pe]
    crit: baseline
    desc: 'Object key named seq, sequence or task_id'
    if:
      type: text
      regex: '\b(seq|sequence|task_id)\b["'']?\s*:'

  - id: heartbeat-field-key
    desc: Object key named ping, heartbeat or alive
    crit: notable
    conf: 0.9
    if:
      type: text
      # This is a field-name observation, not a network or liveness operation.
      # Function-valued export entries are excluded.
      regex: '(^|[,{]\s*)["'']?(ping|heartbeat|alive)["'']?\s*:\s*[^\s(,}][\w.]*'
    not:
      - regex: ':\s*(function|async)$'

composite_rules:
  - id: host-user-field-pair
    desc: JSON-like host and user identity fields
    crit: notable
    conf: 0.9
    near_bytes: 500
    all:
      - id: host-field-key
      - id: user-field-key

  - id: user-path-profile-fields
    desc: JSON-like user or home-path field
    crit: notable
    conf: 0.88
    any:
      - id: user-field-key
      - id: home-directory-field-key

  - id: compact-host-profile-fields
    desc: Compact host-profile field set
    needs: 3
    any:
      - id: host-field-key
      - id: environment-field-key
      - id: pwd-passwd-field-key
      - id: home-directory-field-key
      - id: user-field-key
      - id: ipv4-field-value
      - id: platform-field-key

  - id: heartbeat-sequence-fields
    desc: Object has heartbeat and sequence field names
    crit: component
    conf: 0.9
    near_bytes: 512
    all:
      - id: heartbeat-field-key
      - id: structured-sequence-field
    for: [scripts, source, json, pe]
