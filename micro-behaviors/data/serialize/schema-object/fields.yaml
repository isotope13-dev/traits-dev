# Generic JSON-like field names are serialization context, not tasking intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: component
  conf: 0.9
traits:
  - id: quoted-sub-field
    desc: JSON-like quoted sub field assignment
    crit: notable
    conf: 0.88
    if:
      type: text
      # Line anchoring excludes Go/Rust switch arms such as `case "sub":`.
      regex: '(?im)^[ \t]*["'']sub["''][ \t]*:[ \t]*[^\r\n]{1,128}'
  # A severity field set to a triage level. Secret scanners' pattern catalogs
  # carry it, and so do issue trackers, alert payloads and review records
  # (a Rust `severity: "high".into()` objection message), so it is a schema
  # field, not a scanner identity; relocated from
  # well-known/tool/detection/redaction/. A bare `severity:` is a field every
  # linter, validator and log framework writes; requiring a scanner-style
  # level keeps it off `severity:"error"`.
  - id: severity-level-field
    desc: Severity field set to a triage level
    crit: notable
    conf: 0.95
    for: [scripts, source, markdown, text]
    if:
      type: text
      regex: '(?i)severity\s*:\s*[''"]?(critical|high|medium|low)\b'
  - id: files-object-field
    desc: JSON files object field
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '["'']files["'']\s*:'
  - id: content-object-field
    desc: JSON content object field
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '["'']content["'']\s*:'
  - id: nonce-object-field
    desc: JSON-like nonce object field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)["'']nonce["'']\s*:'
    unless:
      - type: text
        substr: '"algorithm"'
      - type: text
        substr: AESGCM
      - type: text
        substr: AES-GCM
      - type: text
        substr: encryption_meta
  - id: command-field-key
    desc: JSON-like object command field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?(cmd|command|task|action)["'']?\s*[:=]'
  - id: result-field-key
    desc: JSON-like object result field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?(result|output|stdout|response)["'']?\s*[:=]'
  - id: credentials-field-key
    crit: notable
    desc: JSON-like object credentials field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']credentials["'']\s*:'
  - id: repo-key-field
    crit: notable
    desc: JSON-like repoKey object field
    if:
      type: text
      regex: '(\\?["''])repoKey(\\?["''])\s*:'
  - id: relative-path-field
    crit: notable
    desc: JSON-like relativePath object field
    if:
      type: text
      regex: '(\\?["''])relativePath(\\?["''])\s*:'
  # `agent` is ordinary application and dictionary vocabulary. Recognize the
  # structured API schema only when its tool-call field is near function
  # metadata; a bare agent key is not an agentic API record.
  - id: agent-tool-call-field
    crit: notable
    desc: JSON tool-call field
    if:
      type: text
      regex: '(?i)["''](tool_calls|function_call)["'']\s*[:=]'
  - id: agent-tool-call-function-field
    desc: JSON tool-call function metadata field
    if:
      type: text
      regex: '(?i)["''](function|arguments)["'']\s*[:=]'
  - id: json-only-response-instruction
    desc: Response constrained to JSON serialization
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, markdown]
    if:
      type: literal
      kind: string
      substr: Return JSON only
  # RFC 6901 JSON Pointer token escaping (`~` -> `~0`, `/` -> `~1`). A library
  # doing this is implementing the pointer spec, not obfuscating.
  - id: json-pointer-token-escape
    desc: RFC 6901 JSON Pointer token escaping
    for: [javascript, typescript]
    if:
      type: text
      substr: 'replace(/~/g,"~0").replace(/\//g,"~1")'
  - id: cookies-json-body
    desc: Serializes cookies in a JSON object
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*\{[^}\n]{0,500}\bcookies\s*:'
  - id: window-id-field
    crit: notable
    desc: JSON-like object window ID field
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?window_id["'']?\s*[:=]'
  - id: uuid-username-schema-fields
    desc: UUID and username schema fields
    crit: component
    conf: 0.94
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']uuid\\?["'']\s*:.{0,160}\\?["'']username\\?["'']\s*:'
  - id: computer-internal-ip-schema-fields
    desc: Computer and internal-IP schema fields
    crit: component
    conf: 0.94
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']computer\\?["'']\s*:.{0,160}\\?["'']internal_ip\\?["'']\s*:'
  - id: process-pid-schema-fields
    desc: Process and PID schema fields
    crit: component
    conf: 0.94
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']process\\?["'']\s*:.{0,160}\\?["'']pid\\?["'']\s*:'
  - id: arch-admin-schema-fields
    desc: Architecture and admin-state schema fields
    crit: component
    conf: 0.94
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']arch\\?["'']\s*:.{0,160}\\?["'']is_admin\\?["'']\s*:'
  - id: task-id-filename-schema-fields
    desc: Task-ID and filename schema fields
    crit: component
    conf: 0.94
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']task_id\\?["'']\s*:.{0,160}\\?["'']filename\\?["'']\s*:'
  - id: data-size-schema-fields
    desc: Data and size schema fields
    crit: component
    conf: 0.94
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']data\\?["'']\s*:.{0,160}\\?["'']size\\?["'']\s*:'
  - id: chunk-count-schema-fields
    desc: Chunk index and count schema fields
    crit: notable
    conf: 0.95
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?is)\\?["'']chunk\\?["'']\s*:.{0,160}\\?["'']total_chunks\\?["'']\s*:'
  - id: file-transfer-true-field
    desc: File-transfer schema flag enabled
    crit: notable
    conf: 0.95
    for: [scripts, source, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)\\?["'']file_transfer\\?["'']\s*:\s*true'
composite_rules:
  - id: host-process-privilege-profile-schema
    desc: Structured host process and privilege profile
    crit: notable
    conf: 0.97
    for: [scripts, source, pe, dll, elf, macho]
    near_bytes: 1200
    all:
      - id: uuid-username-schema-fields
      - id: computer-internal-ip-schema-fields
      - id: process-pid-schema-fields
      - id: arch-admin-schema-fields
  - id: chunked-file-transfer-schema
    desc: Structured chunked file transfer record
    crit: notable
    conf: 0.97
    for: [scripts, source, pe, dll, elf, macho]
    near_bytes: 1200
    all:
      - id: task-id-filename-schema-fields
      - id: data-size-schema-fields
      - id: chunk-count-schema-fields
      - id: file-transfer-true-field
  - id: agent-tool-call-structure
    desc: JSON tool-call record with metadata
    crit: notable
    conf: 0.92
    for: [json, javascript, typescript, python, go, rust, java, shell, powershell]
    all:
      - id: agent-tool-call-field
      - id: agent-tool-call-function-field
    near_bytes: 1200
  - id: command-result-field-pair
    desc: JSON-like command and result fields
    # Protocol objects keep these keys in one record. Without a tight window,
    # a TypeScript `{ stdout: string }` annotation plus an unrelated `action:`
    # REST field in the same file looks like C2 tasking.
    near_bytes: 384
    all:
      - id: command-field-key
      - id: result-field-key
