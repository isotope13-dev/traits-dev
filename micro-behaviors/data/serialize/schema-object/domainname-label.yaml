defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: domainname-label
    desc: 'DomainName field label reference'
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: 'DomainName:'
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
