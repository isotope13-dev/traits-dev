traits:
- id: keystring-field
  desc: keystring field-name reference
  if:
    type: text
    regex: '(^|[^\w.])keyString($|[^\w])'
  not:
  - substr: .keyString
- id: clipstring-field
  desc: clipstring field-name reference
  if:
    type: text
    regex: '(^|[^\w.])clipString($|[^\w])'
  not:
  - substr: .clipString
defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
  - elf
  crit: notable
  conf: 0.9
