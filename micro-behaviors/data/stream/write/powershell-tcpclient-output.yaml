---
defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
  crit: notable
  conf: 0.93
traits:
- id: powershell-stream-writes-byte-buffer
  desc: PowerShell writes byte buffers to stream
  crit: component
  if:
    type: text
    regex: "(?is)\\.Write\\s*\\(\\s*\\$[A-Za-z_]\\w{0,63}\\s*,\\s*0\\s*,\\s*\\$[A-Za-z_]\\w{0,63}\\.Length\\s*\\)"
