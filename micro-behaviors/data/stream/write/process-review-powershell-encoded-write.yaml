defaults:
  for: [powershell, html]
  platforms: [windows]
  crit: notable
traits:
  - id: powershell-encoded-buffer-stream-write
    desc: PowerShell writes encoded bytes to stream
    conf: 0.95
    if:
      type: text
      regex: '(?i)\$\w+\.Write\(\$\w+\.GetBytes\(\$\w+\),0,\$\w+\.Length\)'

composite_rules:
  # Either relay spelling a PowerShell shell bridge uses to move bytes:
  # an explicit encoded Write loop, or paired Stream.CopyTo(Async) calls.
  - id: powershell-stream-relay-write
    desc: PowerShell writes or copies bytes into a stream
    conf: 0.85
    for: [powershell]
    any:
      - id: powershell-encoded-buffer-stream-write
      - id: micro-behaviors/data/buffer/transfer::dotnet-multiple-copyto-calls
