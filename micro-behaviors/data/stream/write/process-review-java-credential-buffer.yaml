defaults:
  platforms: [android, unix, windows]
  for: [java]
  crit: notable
traits:
  - id: java-credential-buffer-write
    desc: Writes credential buffer bytes to stream
    conf: 0.98
    if:
      type: tree-sitter
      language: java
      query: |
        (method_declaration body: (block
          (try_statement body: (block
            (local_variable_declaration
              declarator: (variable_declarator
                name: (identifier) @bytes
                value: (method_invocation
                  object: (parenthesized_expression
                    (binary_expression right: (identifier) @credential))
                  name: (identifier) @encode)))
            (expression_statement (method_invocation
              object: (method_invocation name: (identifier) @stream)
              name: (identifier) @write
              arguments: (argument_list (identifier) @sent)))))
          (#match? @credential "(?i)(pin|password|passcode)")
          (#eq? @encode "getBytes")
          (#eq? @stream "getOutputStream")
          (#eq? @write "write")
          (#eq? @bytes @sent)))
