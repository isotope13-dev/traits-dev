defaults:
  platforms: [windows]
  for: [powershell, pe, dll]
  crit: notable
traits:
  - id: powershell-streamwriter-constructor-text
    desc: PowerShell text constructs a StreamWriter
    conf: 0.95
    if:
      type: text
      regex: '(?i)New-Object\s+(System\.)?IO\.StreamWriter\s*\('
  - id: powershell-writeline-variable-text
    desc: PowerShell writes a variable through WriteLine
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$\w+\.WriteLine\s*\(\s*\$\w+\s*\)'
