defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-read-framed-send
    desc: Sends stream read data through framing call
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @buffer
            right: (await (call
              function: (attribute attribute: (identifier) @read)))))
          (expression_statement (await (call
            function: (attribute attribute: (identifier) @send)
            arguments: (argument_list (call
              arguments: (argument_list (identifier) @used))))))) @transfer
          (#eq? @read "read")
          (#eq? @send "send")
          (#eq? @buffer @used))
