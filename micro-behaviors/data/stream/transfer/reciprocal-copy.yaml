defaults:
  for: [csharp]
  platforms: [windows, unix]
  crit: notable
traits:
  # Paired calls alone do not establish opposing directions. C# call facts
  # do not retain local receiver/argument bindings, so bind them in the AST.
  - id: csharp-reciprocal-copy-async
    desc: Starts opposing stream CopyToAsync transfers
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((invocation_expression
          function: (member_access_expression
            expression: (identifier) @task name: (identifier) @when)
          arguments: (argument_list
            (argument (invocation_expression
              function: (member_access_expression
                expression: (identifier) @a name: (identifier) @copy1)
              arguments: (argument_list (argument (identifier) @b))))
            (argument (invocation_expression
              function: (member_access_expression
                expression: (identifier) @c name: (identifier) @copy2)
              arguments: (argument_list (argument (identifier) @d)))))) @bridge
          (#eq? @task "Task")
          (#match? @when "^When(All|Any)$")
          (#eq? @copy1 "CopyToAsync") (#eq? @copy2 "CopyToAsync")
          (#eq? @a @d) (#eq? @b @c) (#not-eq? @a @b))
