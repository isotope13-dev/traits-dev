defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
traits:
  - id: python-response-read-to-write
    desc: Writes a response-named stream's read result
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        from:
          call: '^(response|resp|r)\.read$'
