defaults:
  crit: notable
  platforms: [unix, windows]
  for: [java, class, kotlin, jar, zip]
traits:
  - id: java-stream-transfer-to
    desc: Java stream transferTo calls
    conf: 0.9
    count_min: 2
    for: [java, jsp, class, kotlin]
    if:
      type: text
      regex: '\.transferTo\s*\('
  # A single chained transfer already establishes stream copying. Keep the
  # repeated-call observation above for consumers requiring paired relays.
  # JSP has no call facts, so match the accessor-to-transfer source chain.
  - id: java-input-stream-transfer-to
    desc: Transfers Java input stream to output
    conf: 0.95
    for: [java, jsp, kotlin]
    if:
      type: text
      regex: '\.getInputStream\s*\(\s*\)\s*\.transferTo\s*\('
