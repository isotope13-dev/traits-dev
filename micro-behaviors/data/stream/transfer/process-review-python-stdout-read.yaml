defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-read-result-to-stream-write
    desc: Passes read result to a write call
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        from:
          call: '\.read$'
