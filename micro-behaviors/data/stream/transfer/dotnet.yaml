defaults:
  platforms: [windows, unix]
  for: [powershell, csharp]
  crit: notable
traits:
  - id: dotnet-stream-copy-to
    desc: Copies .NET streams via CopyTo or CopyToAsync
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.\s*CopyTo(Async)?\s*\('
  - id: dotnet-paired-stream-copy-to
    desc: Paired .NET stream CopyTo or CopyToAsync calls
    conf: 0.95
    count_min: 2
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.\s*CopyTo(Async)?\s*\('
