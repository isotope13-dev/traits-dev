defaults:
  platforms: [windows, unix]
  for: [php]
  crit: baseline
traits:
  - id: ob-start
    desc: Starts output buffering
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: "ob_start"
  - id: ob-get-contents
    desc: Gets output buffer contents
    conf: 0.6
    if:
      type: symbol
      kind: call
      exact: "ob_get_contents"
  - id: ob-get-clean
    desc: Gets and cleans output buffer
    conf: 0.6
    if:
      type: symbol
      kind: call
      exact: "ob_get_clean"
  - id: ob-end-clean
    desc: Ends and cleans output buffer
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: "ob_end_clean"
  - id: ob-end-flush
    desc: Ends and flushes output buffer
    conf: 0.4
    if:
      type: symbol
      kind: call
      exact: "ob_end_flush"
  - id: ob-get-level
    desc: Gets output buffering level
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: "ob_get_level"
composite_rules:
  - id: output-buffer-capture
    desc: Captures PHP output-buffer contents
    crit: baseline
    conf: 0.75
    all:
      - id: micro-behaviors/data/stream/buffer::ob-start
    any:
      - id: micro-behaviors/data/stream/buffer::ob-get-contents
      - id: micro-behaviors/data/stream/buffer::ob-get-clean
