defaults:
  platforms: [windows, unix]
  for: [vbs, batch, powershell, javascript, python, typescript, csharp, html]
  crit: notable
traits:
  - id: powershell-buffer-stream-read
    desc: Stream read fills a byte buffer
    conf: 0.93
    if:
      type: text
      regex: '(?is)\.Read\(\s*\$[A-Za-z_]\w{0,63}\s*,\s*0\s*,\s*\$[A-Za-z_]\w{0,63}\.Length\s*\)'
