# `for await (const chunk of stream)` drains any async-iterable stream: an
# HTTP response, a file read stream or child-process output. The loop body
# appends each chunk to a string or array. This records the read idiom only;
# consumers supply the stream source and what the collected text reaches.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-for-await-chunk-accumulation
    desc: Collects async-iterated stream chunks
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'for\s+await\s*\(\s*(\w+\s+)?[\w$]+\s+of\s+[\w$.]+\s*\)\s*\{?\s*[\w$.]+\s*(\+=|\.push\()'

composite_rules:
  # Either Node stream-reading style: async iteration or a `data` listener.
  - id: js-stream-chunk-read
    desc: Reads stream chunks by iteration or data event
    crit: component
    conf: 0.9
    any:
      - id: js-for-await-chunk-accumulation
      - id: micro-behaviors/communications/http/response::node-http-get-data-handler
      - id: metadata/lang/source/syntax/call/member::node-data-event-call-text
