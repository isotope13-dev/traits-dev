defaults:
  platforms: [windows, unix]
  for: [powershell, pe, dll]
  crit: notable
traits:
  - id: powershell-streamreader-constructor-text
    desc: PowerShell text constructs a StreamReader
    conf: 0.95
    if:
      type: text
      regex: '(?i)New-Object\s+(System\.)?IO\.StreamReader\s*\('
  - id: powershell-readline-assignment-text
    desc: PowerShell assigns a ReadLine result
    conf: 0.95
    if:
      type: text
      regex: '(?i)\$\w+\s*=\s*\$\w+\.ReadLine\s*\(\s*\)'
  - id: powershell-networkstream-dataavailable-check
    desc: PowerShell checks stream DataAvailable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$\w+\.DataAvailable\b'
  - id: csharp-streamreader-constructor
    desc: C# constructs a StreamReader instance
    for: [csharp]
    conf: 0.95
    if:
      type: text
      regex: '\bnew\s+(System\.IO\.)?StreamReader\s*\('
  - id: csharp-readline-call
    desc: C# calls ReadLine or ReadLineAsync
    for: [csharp]
    conf: 0.95
    if:
      type: text
      regex: '\.ReadLine(Async)?\s*\(\s*\)'
