defaults:
  platforms: [linux, macos, windows]
  for: [php]
  crit: notable
  conf: 0.92
traits:
  - id: php-stream-nonblocking
    desc: PHP disables blocking on a stream
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)^stream_set_blocking\s*\([^,]{1,120},\s*(false|0)\s*\)$'

  - id: php-stream-select
    desc: PHP waits for stream readiness
    if:
      type: symbol
      kind: call
      exact: stream_select

