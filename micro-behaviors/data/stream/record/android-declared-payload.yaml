defaults:
  platforms: [android]
  for: [apk]
  crit: notable
traits:
  - id: android-shell-video-recorder-declaration
    desc: Declares reverse-shell video recorder
    if:
      type: value
      path: android.components[*].name
      regex: '\.reverseshell[0-9]*\.Payloads\.videoRecorder$'
  - id: android-shell-audio-manager-declaration
    desc: Declares reverse-shell audio manager
    if:
      type: value
      path: android.components[*].name
      regex: '\.reverseshell[0-9]*\.Payloads\.audioManager$'
