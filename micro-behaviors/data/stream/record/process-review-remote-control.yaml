defaults:
  platforms: [windows, unix]
  for: [javascript, pe, dll]
  attack: T1219
  mbc: B0022

traits:
  - id: remote-desktop-stream-command
    desc: Remote desktop stream command
    crit: notable
    conf: 0.94
    if:
      type: text
      # A quoted protocol token. stream.start() is an ordinary method call
      # (media recorders, browser screencast handles) and is not this command.
      regex: '["'']stream\.start["'']'
