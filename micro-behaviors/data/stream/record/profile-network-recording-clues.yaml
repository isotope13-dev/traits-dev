defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
traits:
  - id: mediarecorder-before-network-sink
    desc: "MediaRecorder near a network API reference"
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'MediaRecorder[\s\S]{0,700}(fetch|XMLHttpRequest|WebSocket)'
composite_rules:
  - id: mediarecorder-upload-endpoint-context
    desc: "MediaRecorder with upload endpoint context"
    crit: suspicious
    conf: 0.94
    near_bytes: 1200
    all:
      - id: micro-behaviors/data/stream/record::mediarecorder-before-network-sink
    any:
      - id: micro-behaviors/communications/url/resource-path/file::media-recording-upload-route
      - id: micro-behaviors/communications/url/resource-path/file::html-media-recording-upload-route
