defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-reloc-in-place-dword-subtract
    desc: Relocation code subtracts dwords in place
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .reloc
      pattern: '8B 45 00 [0-24] 8B DA [0-12] 2B C3 [0-16] 89 45 00'
