defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: repeated-hex-left-xor-expressions
    desc: Repeated hexadecimal-left XOR expressions
    conf: 0.85
    for: [javascript, typescript]
    count_min: 4
    if:
      # Match executable expressions, not explanatory comments such as the
      # finite-field arithmetic examples bundled with node-forge.
      # A shift immediate (`x<<0x19^y`, `x>>>0x13^y`) is not a hex left
      # operand; xorshift/PRNG loops in math libraries use that shape.
      type: tree-sitter
      kind: binary_op
      regex: '[^<>]0x[0-9a-fA-F]{2}\s*\^'
    unless:
      - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
