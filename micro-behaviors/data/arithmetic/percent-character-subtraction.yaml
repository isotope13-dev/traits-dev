defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: percent-charcode-subtraction
    desc: Percent-encoded character-code subtraction
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)%63%68%61%72%43%6f%64%65%41%74%28(%[a-f0-9]{2}){1,20}%29%2d'
