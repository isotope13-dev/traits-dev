# JavaScript numeric idioms that mix arithmetic with bit truncation.
#
# `(n + 0x7fffffff) | 0` adds past INT32_MAX and truncates back to a 32-bit
# int, wrapping negative: the standard JavaScript JIT idiom for defeating
# bounds-check elimination ahead of an out-of-bounds access. Ordinary hash
# mixing and PRNG code shares the arithmetic, so exploit intent is assembled
# only by the browser-exploit composites that pair the wrap with a memory
# primitive, a staged buffer, or a CVE citation.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]

traits:
  - id: js-int32-overflow-wrap
    desc: Int32 overflow wrap arithmetic
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\(\w+\s*\+\s*(0x7fffffff|0x80000000|214748364[78])\)\s*\|\s*0'
