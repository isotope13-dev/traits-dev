defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-multiply-floor-or-shift-chain
    desc: Python arithmetic and bit-shift expression chain
    crit: notable
    conf: 0.95
    # Arithmetic alone does not establish concealment or reflective evaluation.
    # Require one parsed expression, rather than glyphs in Markdown, comments,
    # quoted operator tables, or separate statements. Reject quoted/commented
    # spans within the expression too: a string added to another value is also
    # a binary_operator, but its contents are not arithmetic.
    if:
      type: tree-sitter
      language: python
      query: |
        ((binary_operator) @chain
          (#match? @chain "[*].{0,30}//.{0,30}[|].{0,30}<<.{0,30}>>")
          (#not-match? @chain "['\"`#]"))
