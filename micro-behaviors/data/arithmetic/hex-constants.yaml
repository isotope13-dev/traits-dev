defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.97
traits:
- id: repeated-hex-arithmetic-constants
  desc: Repeated hex arithmetic over numeric constants
  crit: notable
  count_min: 30
  if:
    type: text
    # The left operand must be a hex *literal*, not the tail of an
    # identifier. javascript-obfuscator names every variable `_0xABCDEF`, so
    # without the boundary an ordinary array index -- `_0x4aa6c9[_0x304364
    # + 0x1]` -- read as `0x304364 + 0x1`, hex arithmetic that was never
    # written. Zencoder's bundled extension.js scored 826 such "constants";
    # 14 survive the boundary, all genuine codec math (UTF-16 surrogate
    # composition, UUID digit sums), well under the count floor.
    regex: '[^\w$]0x[0-9a-fA-F]+\s*[+*\-]\s*-?0x[0-9a-fA-F]+'
