# Consolidates variable/constant ordinal-shift comprehensions.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-chr-ord-shift-generator
    desc: Character ordinal shift comprehension
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'chr\s*\(\s*ord\s*\(\s*\w+\s*\)\s*[-+]\s*\w+\s*\)\s+for\s+\w+\s+in\b'
