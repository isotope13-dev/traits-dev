defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-chr-ord-shift-generator
    desc: Shifts each character ordinal by a constant
    crit: notable
    conf: 0.85
    # A generator that rebuilds a string as chr(ord(c) +/- shift) for every
    # character; the shift is a literal or a module constant. A Caesar-style
    # decode of an embedded string, not proof of what the string conceals.
    if:
      type: text
      regex: 'chr\(ord\(\w+\)\s*[-+]\s*\w+\)\s*for\s+\w+\s+in\s+\w+'
