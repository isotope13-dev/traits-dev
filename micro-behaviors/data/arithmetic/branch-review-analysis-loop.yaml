defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript

traits:
  - id: while-augmented-assignment
    desc: Augmented assignment inside while loop
    # Updating an index or accumulator is routine loop mechanics. More
    # specific surrounding behavior must supply any triage significance.
    crit: baseline
    if:
      type: tree-sitter
      language: javascript
      query: |
        (
          (while_statement
            body: (statement_block
              (expression_statement
                (augmented_assignment_expression
                  operator: ["+=" "-="]
                  right: (identifier) @step
                )
              )
            )
          )
        )
