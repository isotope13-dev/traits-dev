traits:
  - id: powershell-indexed-arithmetic-assignment
    desc: PowerShell indexed arithmetic assignment
    crit: notable
    conf: 0.9
    for: [batch, powershell]
    platforms: [windows]
    if:
      type: text
      # PowerShell accepts unary negation directly after a compound
      # assignment operator (`$bytes[$i]+=-$key[$i%$width]`). Keep the
      # indexed target and variable operand requirements; the optional sign
      # only admits this valid arithmetic form.
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*[-+*/]=\s*[-+]?\s*\$?\w+'
