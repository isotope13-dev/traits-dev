defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, rust, go, ruby]

traits:
  - id: declared-size-adjustment
    desc: Adds size minus one to declared length
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*(declared|fragment)\w*\s*=\s*[A-Za-z_]\w*\s*\+\s*[A-Za-z_]\w*\s*-\s*1\b'
