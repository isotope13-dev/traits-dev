defaults:
  for: [html, php]
  platforms: [unix, windows]
traits:
  - id: php-ord-subtraction
    desc: Subtracts PHP character ordinal values
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bord\(\$\w+\)-ord\(\$\w+\)'
  # Relocated from objectives/.../webshell/obf-dispatch: the matcher detects a
  # neutral arithmetic idiom (XOR with a character code), not a webshell. The
  # webshell intent lives in the decoder composites that reference these atoms;
  # the atoms keep their matchers and PHP scope here.
  - id: php-xor-ord-operand
    desc: PHP ord XOR operand
    crit: notable
    conf: 0.9
    for: [php]
    if:
      type: text
      substr: '^ ord('
