# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-self-xor-binary-patch
    desc: XOR operation with self-path and file-read refs
    crit: notable
    conf: 0.97
    for: [swift]
    platforms: [unix]
    all:
      - id: micro-behaviors/fs/path/self::swift-own-executable-backup
      - id: micro-behaviors/data/arithmetic::source-xor-operation
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api

