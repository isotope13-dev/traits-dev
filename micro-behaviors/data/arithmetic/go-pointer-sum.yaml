defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  # A field/base sum is prepared as a zero-argument Go native-call target.
  # Keep the existing register variants. When junk separates the sum from
  # its spill, additionally bind the field spill/reload and target spill/
  # reload stack offsets. These bounded instruction observations are not
  # a complete CFG/data-flow proof or PE-header identification on their own.
  - id: go-field-base-sum-call-setup
    desc: Adds structure field to pointer before call
    crit: notable
    conf: 0.92
    if:
      type: yara
      source: |
        import "pe"
        rule go_field_base_sum_call_setup {
          strings:
            $legacy = { (8B 40 10 48 89 84 24 ?? ?? ?? ?? [0-2048] 48 8B 8C 24 ?? ?? ?? ?? 48 8B 94 24 ?? ?? ?? ?? 48 01 D1 48 89 8C 24 ?? ?? ?? ?? | 8B 40 10 48 89 84 24 ?? ?? ?? ?? [0-2048] 48 8B 84 24 ?? ?? ?? ?? 48 8B 8C 24 ?? ?? ?? ?? 48 01 C8 48 89 84 24 ?? ?? ?? ?? | 8B 40 10 [0-384] 48 8B 8C 24 ?? ?? ?? ?? 48 01 C8 [0-384] 48 89 84 24 ?? ?? ?? ?? | 8B 52 10 [0-512] 48 8B 9C 24 ?? ?? ?? ?? 48 01 DA [0-512] 48 89 94 24 ?? ?? ?? ?? | 8B 52 10 [0-512] 48 8B 94 24 ?? ?? ?? ?? 48 8B B4 24 ?? ?? ?? ?? 48 01 F2 [0-512] 48 89 94 24 ?? ?? ?? ??) [0-2048] 48 8B 84 24 ?? ?? ?? ?? 31 DB 31 C9 48 89 CF [0-8] E8 ?? ?? ?? ?? }
            $field = { 8B 40 10 48 89 84 24 ?? ?? ?? ?? }
            $add = { 48 8B 8C 24 ?? ?? ?? ?? 48 8B 94 24 ?? ?? ?? ?? 48 01 D1 }
            $save = { 48 89 8C 24 ?? ?? ?? ?? }
            $call = { 48 8B 84 24 ?? ?? ?? ?? 31 DB 31 C9 48 89 CF E8 ?? ?? ?? ?? }
          condition:
            pe.is_pe and pe.machine == pe.MACHINE_AMD64 and (
              for any l in (1..#legacy) : (
                pe.sections[pe.section_index(@legacy[l])].name == ".text"
              ) or (
                all of ($field, $add, $save, $call) and
                for any f in (1..#field) : (
                  pe.sections[pe.section_index(@field[f])].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                  for any a in (1..#add) : (
                    @add[a] >= @field[f] + 11 and @add[a] - @field[f] <= 512 and
                    uint32(@field[f]+7) == uint32(@add[a]+4) and
                    for any s in (1..#save) : (
                      @save[s] >= @add[a] + 19 and @save[s] - @add[a] <= 512 and
                      for any c in (1..#call) : (
                        @call[c] >= @save[s] + 8 and @call[c] - @save[s] <= 1024 and
                        uint32(@save[s]+4) == uint32(@call[c]+4) and
                        pe.section_index(@field[f]) == pe.section_index(@call[c])
                      )
                    )
                  )
                )
              )
            )
        }
