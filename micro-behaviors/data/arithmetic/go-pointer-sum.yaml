defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  # A field loaded from a parsed structure is added to a base pointer,
  # saved, then passed as the Go ABI target of a zero-argument call.
  # Wildcard stack slots are not a data-flow proof on arbitrary code.
  - id: go-field-base-sum-call-setup
    desc: Adds structure field to pointer before call
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .text
      # A second build keeps the field in AX across stack-initialization
      # instructions, adds the base from CX, and spills the sum later.
      # DX/SI builds spill the field, reload it into DX, and add the base in SI.
      # Larger bounded gaps also cover intervening generated junk blocks.
      # These are bounded instruction observations, not a generic flow proof.
      pattern: '(8B 40 10 48 89 84 24 [4] [0-2048] 48 8B 8C 24 [4] 48 8B 94 24 [4] 48 01 D1 48 89 8C 24 [4] | 8B 40 10 48 89 84 24 [4] [0-2048] 48 8B 84 24 [4] 48 8B 8C 24 [4] 48 01 C8 48 89 84 24 [4] | 8B 40 10 [0-384] 48 8B 8C 24 [4] 48 01 C8 [0-384] 48 89 84 24 [4] | 8B 52 10 [0-512] 48 8B 9C 24 [4] 48 01 DA [0-512] 48 89 94 24 [4] | 8B 52 10 [0-512] 48 8B 94 24 [4] 48 8B B4 24 [4] 48 01 F2 [0-512] 48 89 94 24 [4]) [0-2048] 48 8B 84 24 [4] 31 DB 31 C9 48 89 CF [0-8] E8 [4]'
