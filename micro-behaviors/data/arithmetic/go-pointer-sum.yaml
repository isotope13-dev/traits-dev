defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  # A field loaded from a parsed structure is added to a base pointer,
  # saved, then passed as the Go ABI target of a zero-argument call.
  # Wildcard stack slots are not a data-flow proof on arbitrary code.
  - id: go-field-base-sum-call-setup
    desc: Adds structure field to pointer before call
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .text
      pattern: '8B 40 10 48 89 84 24 [4] [0-2048] (48 8B 8C 24 [4] 48 8B 94 24 [4] 48 01 D1 48 89 8C 24 [4] | 48 8B 84 24 [4] 48 8B 8C 24 [4] 48 01 C8 48 89 84 24 [4]) [0-2048] 48 8B 84 24 [4] 31 DB 31 C9 48 89 CF E8 [4]'
