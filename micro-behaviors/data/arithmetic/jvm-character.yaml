defaults:
  for: [class]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: jvm-xor-character-array-store
    desc: XOR result stored as JVM character
    conf: 0.95
    if:
      type: hex
      pattern: '82 92 55'
  - id: jvm-subtract-character-array-store
    desc: Difference narrowed and stored as JVM character
    conf: 0.95
    if:
      type: hex
      pattern: '64 92 55'
