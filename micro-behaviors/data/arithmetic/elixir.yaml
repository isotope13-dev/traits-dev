defaults:
  for:
  - elixir
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.95
traits:
- id: elixir-weighted-symbol-index
  desc: Scales lookup index by radix-four weight
  if:
    type: tree-sitter
    query: "((binary_operator\n  left: (call\n    target: (dot left: (alias) @module\
      \ right: (identifier) @method))\n  \"*\"\n  right: (integer) @weight)\n  (#eq?\
      \ @module \"Enum\")\n  (#eq? @method \"find_index\")\n  (#match? @weight \"\
      ^(4|16|64)$\"))\n"
