defaults:
  for: [powershell]
  platforms: [windows, unix]
traits:
  - id: powershell-paired-lt-255-comparisons
    desc: Paired PowerShell -lt 255 comparisons
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?is)\$\w+\s+-lt\s+255([;),}\s]|$).{0,100}\$\w+\s+-lt\s+255([;),}\s]|$)'
