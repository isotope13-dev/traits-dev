defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp]
  crit: notable
traits:
  - id: indexed-xor-array-assignment
    desc: Indexed array XOR assignment
    conf: 0.84
    if:
      type: text
      # Accept compound assignment and an explicit XOR expression, while
      # excluding equality tests and comments before a later caret.
      regex: '(\b\w+\[\w{1,3}\]\s*\^=|\b\w+\[\w{1,3}\]\s*=\s*[^=;/\n]{0,60}\^)'

