defaults:
  platforms: [unix, windows]
  for: [c, cpp, javascript, pe, elf]
  crit: notable
traits:
  - id: indexed-xor-array-assignment
    desc: Indexed array XOR assignment expression
    conf: 0.84
    if:
      type: text
      # Accept compound assignment and an explicit XOR expression, while
      # excluding equality tests and comments before a later caret.
      # Also covers the former js-buffer-xor-loop: embedded Groestl and
      # Keccak OpenCL source contains these expressions without a cipher or
      # payload decoder. Short identifier and numeric indexes are arithmetic.
      # Require a valid expression start, rather than an identifier such as
      # `7J((PdKb` accidentally present in a printable encoded resource.
      regex: '\b[\w$]+\[[\w$]+\]\s*(\^=|=\s*\(*([A-Za-z_$]|\d+\b)[^=;/\n]{0,40}\^)'

