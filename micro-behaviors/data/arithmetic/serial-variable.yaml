defaults:
  platforms: [unix, windows]
  conf: 0.9
traits:
  - id: serial-variable-add-assignment
    crit: notable
    desc: Adds to a serial-named variable
    for: [javascript, typescript, c, cpp, java]
    if:
      type: text
      regex: '(?i)\b(\w+_)?serial(_?number|_?num|_?no)?\s*(\+\+|\+=)'

