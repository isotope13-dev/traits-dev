defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-xor-before-hex-pack
    desc: XOR syntax precedes a hex pack call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\^[^\^]{0,300}pack\s*\(\s*["'']H\*["'']'
    unless:
      - id: micro-behaviors/data/encode/hex::php-hex-unpack-repack-endian
      - id: well-known/lib/crypto/phpseclib
      - id: well-known/lib/crypto/firebase-jwt

