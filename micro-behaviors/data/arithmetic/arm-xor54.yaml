defaults:
  platforms: [linux, android]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
  - id: arm-indexed-xor54-byte-loop
    desc: ARM bounded indexed XOR-0x54 byte loop
    conf: 0.99
    if:
      type: hex
      offset_range: [256, 262144]
      pattern: '06 30 D2 E7 54 30 23 E2 06 30 C2 E7 01 20 82 E2 02 00 (55|57) E1 F9 FF FF 1A'
