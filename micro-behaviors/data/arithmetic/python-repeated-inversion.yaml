defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-repeated-modular-inverse
  desc: Calls pow with inverse exponent repeatedly
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((call function: (identifier) @power
       arguments: (argument_list . (_) . (unary_operator operator: "-" argument: (integer) @one) . (_) .)) @evidence
       (#eq? @power "pow") (#eq? @one "1"))
  count_min: 2
