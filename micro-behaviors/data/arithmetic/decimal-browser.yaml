defaults:
  platforms:
    - "windows"
  for:
    - "javascript"
    - "html"
    - "text"
traits:
  - id: "decimal67-shellcode-array-store"
    desc: "Encoded script stores addition in array"
    crit: "notable"
    conf: 0.98
    if:
      type: "text"
      regex: "160128([0-9]{3}){1,20}110([0-9]{3}){1,20}"
