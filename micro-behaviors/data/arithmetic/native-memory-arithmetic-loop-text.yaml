---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: asm-loop-op
  conf: 0.7
  crit: notable
  desc: Memory arithmetic instruction text
  if:
    type: text
    regex: "(xor|sub|add)\\s+(byte|dword)\\s+ptr\\s+\\[.+?\\],"
    section: ".text"
composite_rules:
- id: asm-loop-any
  desc: Memory arithmetic and control transfer text
  crit: notable
  conf: 0.7
  all:
  - id: micro-behaviors/data/arithmetic::asm-loop
  - id: metadata/binary/instruction/sequence/control-flow::asm-loop-control-transfer
- id: asm-loop
  conf: 0.7
  crit: notable
  desc: Memory arithmetic and register operand text
  all:
  - id: micro-behaviors/data/arithmetic::asm-loop-op
  - id: metadata/binary/instruction/operand::asm-loop-reg
