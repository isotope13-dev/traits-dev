defaults:
  platforms: [unix, windows]
  for: [go, python]
  crit: notable
  conf: 0.98
traits:
  - id: go-modular-inverse
    desc: Computes modular multiplicative inverse
    for: [go]
    if:
      type: symbol
      regex: '(^|\.)ModInverse$'
  - id: python-modular-inverse
    desc: Computes modular inverse with negative exponent
    for: [python]
    if:
      type: text
      regex: '\bpow\(\s*\w+\s*,\s*-1\s*,\s*\w+\s*\)'
  - id: go-big-integer-subtract
    desc: Subtracts operands with big integer API
    for: [go]
    if:
      type: text
      regex: '\bnew\(big\.Int\)\.Sub\(\s*\w+\s*,\s*\w+\s*\)'
  - id: python-subtract-inverse-product
    desc: Multiplies operand difference by modular inverse
    for: [python]
    if:
      type: text
      regex: '\(\w+\s*-\s*\w+\)\s*\*\s*pow\(\w+,\s*-1,\s*\w+\)'
composite_rules:
  - id: modular-inverse
    desc: Computes modular multiplicative inverse
    any:
      - id: go-modular-inverse
      - id: python-modular-inverse
  - id: difference-with-inverse
    desc: Subtraction co-occurs with modular inverse
    near_bytes: 256
    all:
      - id: modular-inverse
    any:
      - id: go-big-integer-subtract
      - id: python-subtract-inverse-product
