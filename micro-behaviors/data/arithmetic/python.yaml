---
defaults:
  for:
  - python
  platforms:
  - windows
  - unix
  crit: notable
traits:
- id: large-complex-number-expression
  desc: Python large complex-number expression
  conf: 0.85
  if:
    type: tree-sitter
    language: python
    kind: binary_op
    regex: "\\d{3,}\\.\\d+\\s*[+-]\\s*\\d{3,}\\.\\d+j"
