defaults:
  platforms: [windows, unix]
  for: [python]

# Integer shifts can encode or decode bytes; no direction or evasion is implied.
# Restrict the arithmetic to a comprehension body inside the construction.
# A PDF header literal followed by enumerate(..., 1) is not byte arithmetic.
traits:
  - id: python-byte-construction-shift
    desc: Bytes constructed from shifted integer elements
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((call
          function: (identifier) @constructor
          arguments: (argument_list
            [
              (generator_expression body: [(binary_operator) (parenthesized_expression (binary_operator))] @body)
              (list_comprehension body: [(binary_operator) (parenthesized_expression (binary_operator))] @body)
            ])) @construction
          (#match? @constructor "^byte(s|array)$")
          (#match? @body "^\\(?[A-Za-z_]\\w*\\s*[-+]\\s*(0x[\\da-fA-F]+|\\d+)\\)?(\\s*%\\s*256)?$"))
