    desc: Byte addition and XOR buffer loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 4C 24 ?? 8A 14 08 80 C2 ?? 88 14 08 8B 4C 24 ?? 8A 14 08 80 F2 ?? 88 14 08 40 3B C6 7C ??'
