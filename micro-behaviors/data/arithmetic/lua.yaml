defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-large-constant-arithmetic
    desc: Many arithmetic expressions with large constants
    crit: notable
    conf: 0.94
    count_min: 50
    if:
      type: text
      regex: '[-]?\d{5,}\s*[-+]\s*\(?\s*[-]?\d{5,}'

  - id: lua-negated-subtraction
    desc: Repeated subtraction of negative constants
    crit: notable
    conf: 0.94
    count_min: 20
    if:
      type: text
      regex: '-\(-\d{4,}\)'

