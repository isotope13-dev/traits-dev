defaults:
  platforms: [linux, macos, windows]
  crit: notable
traits:
  - id: native-xor-modulo-arithmetic
    # The metric only sees "XOR near a modulo"; whether the XOR operand is a
    # key byte is never checked, so the desc must not claim a repeating key.
    # Zig's `zig.h` signed floor-division macro (`a % b != 0 ? (a ^ b) >> w-1`)
    # matches the shape with no key and no cipher in sight.
    desc: Source combines XOR and modulo
    conf: 0.92
    for: [c, cpp, go, rust]
    if:
      type: metrics
      field: ast.xor_mod_loop_count
      min: 1
    unless:
      # `b[i/64] ^= (1ull << (i % 64))` is a bitfield toggle, not a repeating
      # key: the modulus is the machine word width and the XOR operand is a
      # shifted 1, never a byte drawn from a key buffer. The AST metric counts
      # the XOR-plus-modulo shape and cannot tell the two apart.
      - type: text
        regex: '\^=\s*[(~]*\s*1[uU]*[lL]*\s*<<'

