defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: powershell-byte-converter-xor
    desc: Byte converter applies scalar XOR
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)Converter\[byte,byte\]\]\s*\{\s*param\(\$\w+\)\s*\$\w+\s*-bxor\s*(0x[0-9a-f]+|[0-9]+)'
