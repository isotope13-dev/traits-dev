defaults:
  platforms: [windows, unix]
traits:
  - id: js-charcode-xor-operation
    desc: JavaScript charCodeAt XOR operation
    crit: notable
    conf: 0.9
    for:
      - html
      - javascript
    if:
      # Require an executable XOR expression, including quoted bracket access.
      # Comments and strings describing a transform are not operations.
      type: tree-sitter
      query: |
        (binary_expression
          left: (call_expression
            function: (_) @method)
          operator: "^"
          (#match? @method "(\\.charCodeAt|\\[\\s*[\"']charCodeAt[\"']\\s*\\])$"))
