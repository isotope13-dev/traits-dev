defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  # Minus-node metrics include unary negatives. The infix-subtraction leg
  # distinguishes dense subtraction from coordinate data; it proves neither
  # array initialization nor concealment. Existing scope/exclusions retained.
  - id: js-dense-subtraction
    desc: "Dense JavaScript subtraction expressions"
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/arithmetic::js-many-minus-operator-nodes
      - id: metadata/file/arithmetic::js-minus-operator-node-density
      - id: micro-behaviors/data/arithmetic::js-binary-subtraction-cluster
      - id: metadata/file/extension/identity::javascript-source-extension
    unless:
      - id: metadata/build/bundler/runtime/
      - id: metadata/file/format/markup::jinja-template-source
      # Astronomy polynomials (SunCalc et al.) are dense in subtractions by design.
      - id: well-known/lib/datetime/suncalc::suncalc-astronomy-library
      - id: well-known/lib/network/novnc::source-context
      - id: well-known/lib/media/pixastic::pixastic-library-context
      - id: well-known/lib/development/vscode::vscode-extension-marker
      # Numeric test vectors are intentionally arithmetic-dense, but are not
      # obfuscation merely because they occur in JavaScript source.
      - id: metadata/package/testing/
      - id: well-known/lib/ui/rfdtech-components/
