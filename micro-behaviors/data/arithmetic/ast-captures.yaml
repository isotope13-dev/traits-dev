defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-addition-assignment-identifier
  desc: Addition assignment from an identifier
  crit: notable
  conf: 0.85
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: "(augmented_assignment_expression\n  operator: \"+=\"\n  right: (identifier)) @observation\n"
- for:
  - javascript
  - typescript
  id: js-identifier-subtraction
  unless:
  - id: "metadata/file/naming::readme-requirements-install-basename"
  desc: Spaced subtraction between identifiers
  crit: notable
  conf: 0.6
  if:
    type: tree-sitter
    language: javascript
    # Error recovery in JSX can parse CSS class names as subtraction.
    # Require operator whitespace to avoid those hyphenated text tokens.
    query: |
      ((binary_expression
        left: (identifier)
        operator: "-"
        right: (identifier)) @observation
        (#match? @observation "^[A-Za-z_$][A-Za-z0-9_$]*[ \t]+-[ \t]+[A-Za-z_$][A-Za-z0-9_$]*$"))
