defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-addition-assignment-identifier
  desc: Addition assignment from an identifier
  crit: notable
  conf: 0.85
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: "(augmented_assignment_expression\n  operator: \"+=\"\n  right: (identifier)) @observation\n"
- for:
  - javascript
  - typescript
  id: js-identifier-subtraction
  unless:
  - id: "metadata/file/naming::readme-requirements-install-basename"
  desc: Subtracts one identifier from another
  crit: notable
  conf: 0.6
  if:
    type: tree-sitter
    language: javascript
    query: "(binary_expression\n  left: (identifier)\n  operator: \"-\"\n  right: (identifier)\n) @observation\n"
