defaults:
  platforms:
  - linux
  - macos
  - windows
traits:
# Ruby's parsed binary operator excludes mathematical prose in comments and
# operator-looking text inside serialized protobuf descriptor literals.
- for: [ruby]
  crit: notable
  conf: 0.95
  id: ruby-xor-expression
  desc: Ruby bitwise XOR expression
  if:
    type: tree-sitter
    language: ruby
    query: '(binary operator: "^") @expression'
- for: [powershell]
  platforms: [windows]
  crit: notable
  id: powershell-xor-operator
  desc: PowerShell bitwise XOR operator syntax
  if:
    type: text
    regex: '(?i)\s-bxor\s'
- for: [python]
  crit: notable
  id: python-xor-expression
  desc: Python evaluates a bitwise XOR expression
  if:
    type: tree-sitter
    language: python
    query: |
      [
        (binary_operator operator: "^") @expression
        ((call function: (attribute
            object: (identifier) @module
            attribute: (identifier) @method)
          arguments: (argument_list . (_) . (_) .)) @call
          (#eq? @module "operator")
          (#eq? @method "xor"))
      ]
- for:
  - scripts
  - source
  - class
  crit: notable
  id: lsb-bit-mask-source
  desc: Source contains low-bit mask syntax
  if:
    type: text
    regex: '([\w)\]]\s*&\s*1\b|-band\s+1\b|\bbitAnd\s*\(\s*1\b|\)\s+and\s+1\b)'
- for:
  - javascript
  - typescript
  - c
  - cpp
  crit: notable
  id: normalized-byte-mask
  desc: Byte mask scaled to unit interval
  if:
    type: text
    regex: '&\s*0xff\)\s*/\s*0xff'
# Clear a byte's low bit, then shift a value right by one: the inner step of
# LSB embedding (carrier byte masked, secret shifted), and equally of DES
# key-parity fixing, which wolfSSL's des3.c does with the same two operators.
# A mechanic; the bitmap-key locker composite supplies the intent.
- for:
  - c
  - cpp
  - python
  - go
  - rust
  - powershell
  crit: notable
  conf: 0.9
  id: clear-low-bit-then-shift
  desc: Clears a low bit, then shifts right
  if:
    type: text
    regex: '(?s)(&=\s*0xFE\b|&\s*0xFE\b).{0,220}>>=?\s*1\b'

composite_rules:
- id: source-xor-operation
  desc: Source contains XOR operator or function syntax
  crit: notable
  for: [scripts, source, class]
  any:
  - id: metadata/lang/source/syntax/operator::caret-or-xor-expression-text
  - id: ruby-xor-expression
  - id: powershell-xor-operator
  - id: python-xor-expression
