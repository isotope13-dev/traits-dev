defaults:
  platforms:
  - linux
  - macos
  - windows
traits:
- for:
  - scripts
  - source
  - class
  crit: notable
  id: source-xor-operation
  desc: Source references XOR syntax
  if:
    type: text
    regex: (?i)(\b(bxor|bitxor|xor)\b|\s\^\s)
- for:
  - scripts
  - source
  - class
  crit: baseline
  id: lsb-bit-mask-source
  desc: Source contains low-bit mask syntax
  if:
    type: text
    regex: ([\w)\]][ \t]*&[ \t]*1\b|\band\s+1\b|\bbitAnd\s*[(]\s*1\b)
- for:
  - javascript
  - typescript
  - c
  - cpp
  crit: notable
  id: normalized-byte-mask
  desc: Byte mask scaled to unit interval
  if:
    type: text
    regex: '&\s*0xff\)\s*/\s*0xff'
# Clear a byte's low bit, then shift a value right by one: the inner step of
# LSB embedding (carrier byte masked, secret shifted), and equally of DES
# key-parity fixing, which wolfSSL's des3.c does with the same two operators.
# A mechanic; the bitmap-key locker composite supplies the intent.
- for:
  - c
  - cpp
  - python
  - go
  - rust
  - powershell
  crit: notable
  conf: 0.9
  id: clear-low-bit-then-shift
  desc: Clears a low bit, then shifts right
  if:
    type: text
    regex: '(?s)(&=\s*0xFE\b|&\s*0xFE\b).{0,220}>>=?\s*1\b'
