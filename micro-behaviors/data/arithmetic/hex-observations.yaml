---
defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: hex-operand-arithmetic
  desc: Binary operations on hexadecimal operands
  conf: 0.78
  if:
    type: text
    regex: 0x[0-9a-fA-F]+\s*[-+*/%^&|]\s*0x[0-9a-fA-F]+
  unless:
  - type: basename
    regex: "(^|[._-])README([._-][^\\\\/]*)?$"
  - id: metadata/file/extension/asset::ico-basename
  - id: metadata/file/extension/identity::c3-source-basename
