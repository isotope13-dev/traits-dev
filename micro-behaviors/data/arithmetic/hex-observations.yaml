# Neutral observations; consumers must supply any obfuscation interpretation.
defaults:
  platforms: [windows, unix]
traits:
- for:
  - javascript
  - typescript
  id: hex-operand-arithmetic
  desc: Binary operations on hexadecimal operands
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: 0x[0-9a-fA-F]+\s*[-+*/%^&|]\s*0x[0-9a-fA-F]+
  unless:
  - id: metadata/build/
  - type: basename
    regex: (^|[._-])README([._-][^\\/]*)?$
  - id: metadata/package/testing/
  - id: metadata/file/extension/identity::ico-basename
  - id: metadata/file/extension/identity::c3-source-basename
- for: [python, c, cpp, javascript, typescript]
  id: add-hex-0x77-constant
  desc: Adds the hex constant 0x77
  crit: notable
  conf: 0.9
  if:
    type: text
    # Require a terminator after 0x77 so offsets like `+0x770` do not match.
    regex: '\+\s*0x77([^0-9a-fA-F]|$)'
