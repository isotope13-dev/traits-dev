---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-byte-construction-shift
  desc: Constructs bytes from offset integer elements
  crit: notable
  conf: 0.92
  if:
    type: tree-sitter
    query: |
      ((call
        function: (identifier) @constructor
        arguments: (argument_list
          [
            (generator_expression body: [(binary_operator) (parenthesized_expression (binary_operator))] @body)
            (list_comprehension body: [(binary_operator) (parenthesized_expression (binary_operator))] @body)
          ])) @construction
        (#match? @constructor "^byte(s|array)$")
        (#match? @body "^\\(?[A-Za-z_]\\w*\\s*[-+]\\s*(0x[\\da-fA-F]+|\\d+)\\)?(\\s*%\\s*256)?$"))
