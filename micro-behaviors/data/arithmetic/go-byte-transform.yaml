defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.98

traits:
  # Byte subtraction using a shifted or multiplied index. Neither buffer length,
  # additive constant nor shift identifies a specimen or establishes intent.
  - id: x64-index-scaled-byte-subtraction-loop
    desc: Subtracts scaled index from buffer bytes
    if:
      type: hex
      section: .text
      pattern: '(0F B6 14 01 48 89 CB 48 C1 E3 ?? 48 29 CB 29 DA 83 C2 ?? 88 14 08 48 FF C1 [0-15] 48 81 F9 [4] 7C ?? | 44 0F B6 04 10 4C 8D 0C 40 4E 8D 0C 48 45 29 C8 41 83 C0 ?? 44 88 04 02 48 FF C0 48 3D [4] 7C ?? | 44 0F B6 04 10 4C 8D 0C 40 4E 8D 0C 88 45 29 C8 41 83 C0 ?? 44 88 04 02 48 FF C0 48 3D [4] 7C ??)'
