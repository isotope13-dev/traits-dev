defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.98

traits:
  # byte[i] -= ((i << shift) - i) + constant. Neither the buffer length,
  # additive constant nor shift identifies a specimen or establishes intent.
  - id: x64-index-scaled-byte-subtraction-loop
    desc: Subtracts scaled index from buffer bytes
    if:
      type: hex
      section: .text
      pattern: '0F B6 14 01 48 89 CB 48 C1 E3 ?? 48 29 CB 29 DA 83 C2 ?? 88 14 08 48 FF C1 48 81 F9 [4] 7C ??'

  - id: x64-adjacent-byte-pair-swap-loop
    desc: Swaps adjacent bytes in a buffer
    if:
      type: hex
      section: .text
      pattern: '0F B6 5C 10 01 0F B6 34 10 88 1C 02 40 88 74 10 01 48 83 C0 02 48 8D 58 01 48 81 FB [4] 7D ??'
