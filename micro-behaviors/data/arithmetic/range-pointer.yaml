defaults:
  for: [html, javascript, typescript]
  platforms: [unix, windows, android]
traits:
  - id: object-keys-signed-range-shift
    desc: Object.keys length feeds signed shifts
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'Object\.keys\([^)]{1,80}\)\.length;\s*var \w+ = \w+ << 3;\s*var \w+ = \w+ >> 31;'
