# NOT is its own inverse. This loop applies a bitwise complement to a fixed-size buffer;
# it does not establish encryption or an evasion objective.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]

traits:
  - id: x86-byte-complement-512
    desc: x86 loop complements a 512-byte buffer
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '33 C0 8A 4C 04 08 F6 D1 88 4C 04 08 40 3D 00 02 00 00 72 EE'
