defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-and-not-or-terms
    desc: PowerShell AND/NOT terms joined with OR
    crit: notable
    conf: 0.95
    # (a & ~b) | (~a & b) implements XOR without the -bxor token.
    # Operator shape alone does not bind the operands or establish decoding.
    if:
      type: text
      regex: '(?i)-band\s+-bnot[^;]{1,40}-bor\s*\(-bnot[^;]{1,40}-band'
