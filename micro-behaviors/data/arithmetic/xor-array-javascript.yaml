defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: js-xor-expression-array
    desc: Numeric array contains repeated XOR expressions
    conf: 0.98
    if:
      # Six actual XOR elements in one array; quoted examples and comments
      # do not establish arithmetic or character-code reconstruction.
      type: tree-sitter
      query: |
        (array
          (binary_expression left: (number) operator: "^" right: (number))
          (binary_expression left: (number) operator: "^" right: (number))
          (binary_expression left: (number) operator: "^" right: (number))
          (binary_expression left: (number) operator: "^" right: (number))
          (binary_expression left: (number) operator: "^" right: (number))
          (binary_expression left: (number) operator: "^" right: (number))) @array
