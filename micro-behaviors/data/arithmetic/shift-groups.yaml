defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: left-shift-or-18-12-6
  desc: Combines values shifted by 18/12/6 bits
  conf: 0.85
  unless:
  - id: metadata/build/
  if:
    type: text
    regex: <<\s*18\s*\|\s*\w+\s*<<\s*12\s*\|\s*\w+\s*<<\s*6
- for:
  - scripts
  - powershell
  - batch
  - lnk
  - javascript
  - typescript
  - python
  - csharp
  - vbs
  - html
  id: powershell-shift-or-sequence
  desc: PowerShell shift/OR operator sequence
  conf: 0.92
  if:
    type: text
    regex: (?i)-(shl|shr)\s*[246][^\r\n]{0,180}-bor[^\r\n]{0,180}-(shl|shr)\s*[246]
