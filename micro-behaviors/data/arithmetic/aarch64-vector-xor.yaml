defaults:
  platforms: [macos]
  for: [macho]
  arch: [aarch64]
traits:
  - id: aarch64-paired-vector-xor-store
    desc: Repeated paired vector XOR loads and stores
    crit: notable
    conf: 0.94
    count_min: 3
    if:
      type: hex
      section: __text
      # Two Q loads, one Q-pair load, two SIMD EORs, and two Q stores.
      # Buffer offsets and most register choices vary. This records the
      # arithmetic sequence; it does not assert crypto, decoding or evasion.
      pattern: '?? ?? D? 3D ?? ?? D? 3D ?? ?? 4? AD ?? 1C 2? 6E ?? 1C 2? 6E ?? ?? 9? 3D ?? ?? 9? 3D'
