# XOR inside a byte constructor does not prove a byte stream or decoding.
defaults:
  platforms: [windows, unix]

traits:
  - id: literal-key-xor-byte-constructor
    desc: Byte constructor contains literal-key XOR
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(bytes|bytearray)\s*\([^)]{0,120}\b[A-Za-z_]\w*\s*\^\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    for: [python, c, cpp, go, rust, javascript, typescript]
