traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-xor-byte-loop
  desc: Python loop with XOR byte manipulation
  crit: notable
  conf: 0.8
  if:
    type: tree-sitter
    query: "(for_statement\n  body: (block\n    (_\n      (assignment\n        left: (subscript)\n\
      \        right: (binary_operator) @bin\n      )\n    )\n  )\n  (#match? @bin \"\\\\^\"\
      )\n)\n"
