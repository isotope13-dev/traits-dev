defaults:
  platforms: [windows, unix]
  for: [source, python, -elixir]

traits:
  - id: fixed-thirty-two-iteration-xor-loop
    desc: In-place XOR loop iterates over 32 units
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: 'for\s*\([^)]{0,48}32[^)]{0,24}\)[\s\S]{0,80}\^='
