defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
traits:
- crit: baseline
  id: byte-mask-or-divide-0xff
  desc: Masks or divides by 0xff byte value
  conf: 0.95
  if:
    type: text
    regex: '[&/]\s*0xff\b'
- crit: baseline
  id: js-binary-subtraction-cluster
  desc: Many JavaScript infix subtraction expressions
  conf: 0.95
  count_min: 30
  if:
    type: tree-sitter
    language: javascript
    query: "(binary_expression\n  operator: \"-\"\n) @subtraction\n"
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/package/documentation/page::static-html-shell
  - id: metadata/build/generated::laya-engine-runtime-marker
  - type: path
    regex: '[\\/]node_modules[\\/]'
- crit: notable
  id: js-bitwise-arithmetic-chain
  desc: JavaScript bitwise arithmetic and shift chain
  conf: 0.8
  size_max: 400000
  if:
    type: text
    regex: '[0-9]{2,}.{0,12}[&|^].{0,12}[0-9]{2,}.{0,12}(<<|>>).{0,12}[&|^]'
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
- crit: notable
  id: js-dense-math-pow
  desc: Dense repeated Math.pow arithmetic
  count_min: 8
  per_kb_min: 0.2
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: micro-behaviors/hardware/input/audio/
  - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/lang/compiler/aot::huge-runtime-function-count
  if:
    type: symbol
    kind: call
    exact: Math.pow
- crit: notable
  id: js-math-pow-power-of-two-constants
  desc: Math.pow power-of-two constants
  count_min: 6
  per_kb_min: 0.2
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: micro-behaviors/hardware/input/audio/
  - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/lib/data/apache-arrow
  - id: well-known/lib/format/protobuf-ts
  if:
    type: text
    regex: Math\.pow\s*\(\s*2\s*,\s*\d{2}\s*\)
- crit: notable
  id: js-indexed-array-subtraction-loop
  desc: Indexed array subtraction loop
  conf: 0.95
  unless:
  - id: metadata/file/format/markup::astro-template-basename
  if:
    type: tree-sitter
    language: javascript
    query: "(for_statement\n  body: (statement_block\n    (expression_statement\n\
      \      (assignment_expression\n        left: (subscript_expression)\n      \
      \  right: (binary_expression\n          left: (subscript_expression)\n     \
      \     operator: \"-\"\n          right: (number)\n        )\n      )\n    )\n\
      \  )\n) @transform_loop\n"
- id: return-subtraction-expression
  desc: Subtraction return expression
  for: [javascript]
  crit: component
  conf: 0.86
  if:
    type: text
    regex: 'return\s+[A-Za-z0-9_$]+\s*-\s*[A-Za-z0-9_$]+\s*;'
