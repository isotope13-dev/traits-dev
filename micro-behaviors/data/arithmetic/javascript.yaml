---
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
traits:
- crit: baseline
  id: byte-mask-or-divide-0xff
  desc: Masks or divides by 0xff byte value
  conf: 0.95
  if:
    type: text
    regex: "[&/]\\s*0xff\\b"
- crit: notable
  id: js-dense-math-pow
  desc: Dense repeated Math.pow arithmetic
  count_min: 8
  per_kb_min: 0.2
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: micro-behaviors/hardware/input/audio/
  - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/lang/compiler/aot::huge-runtime-function-count
  if:
    type: symbol
    kind: call
    exact: Math.pow
- crit: notable
  id: js-math-pow-power-of-two-constants
  desc: Math.pow power-of-two constants
  count_min: 6
  per_kb_min: 0.2
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: micro-behaviors/hardware/input/audio/
  - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/lib/data/apache-arrow
  - id: well-known/lib/format/protobuf-ts
  if:
    type: text
    regex: Math\.pow\s*\(\s*2\s*,\s*\d{2}\s*\)
- crit: notable
  id: js-indexed-array-subtraction-loop
  desc: Indexed array subtraction loop
  conf: 0.95
  unless:
  - id: metadata/file/format/markup::astro-template-basename
  if:
    type: tree-sitter
    language: javascript
    query: |
      (for_statement
        body: (statement_block
          (expression_statement
            (assignment_expression
              left: (subscript_expression)
              right: (binary_expression
                left: (subscript_expression)
                operator: "-"
                right: (number)
              )
            )
          )
        )
      ) @transform_loop
- id: return-subtraction-expression
  desc: Subtraction return expression
  for:
  - javascript
  crit: component
  conf: 0.86
  if:
    type: text
    regex: return\s+[A-Za-z0-9_$]+\s*-\s*[A-Za-z0-9_$]+\s*;
