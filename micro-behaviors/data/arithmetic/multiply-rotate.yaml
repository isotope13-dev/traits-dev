    desc: x64 multiply followed by rotate sequence
    crit: notable
    conf: 0.9
    arch: [x86-64]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: '69 ?? ?? ?? ?? ?? D3 C8'

