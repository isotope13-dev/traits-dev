traits:
- id: padding-alignment-wording
  desc: Text mentions padding alignment
  conf: 0.92
  if:
    type: text
    regex: (?i)padding alignment
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
- id: numeric-transform-name
  desc: Numeric precision/result transform name
  conf: 0.85
  if:
    type: text
    regex: (?i)\b(scale|perturb|adjust)_(precision|result)\b
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  - c
  - python
  - lua
defaults:
  crit: notable
