# Encoded instruction/expression fingerprints; substitution variants require
# the fixed carrier alphabet. These are not general cipher decoders.
defaults:
  for: [html, javascript, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: substitution-shellcode-array-store
    desc: Substitution-encoded block plus shellcode store
    if:
      type: text
      substr: 'Y3Y\,\"j\\S\_\`\_S\;\#h\#Je\,Kg\#\_\#\~\%3eeK\,R3'
