# Compression algorithm is the refinement axis, shared by native API callers
# and portable implementations. Generic RtlCompressBuffer references remain
# in data/codec because the API also accepts XPRESS formats.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust, go, csharp, python, powershell]
  crit: notable
traits:
  - id: rtl-lznt1-standard-call
    desc: Compresses with native LZNT1 standard engine
    conf: 0.99
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])RtlCompressBuffer$'
      arg:
        index: 0
        kind: number
        value: 2

  - id: lznt1-compress-call
    desc: Calls portable LZNT1 compression
    conf: 0.96
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])lznt1[.:]+compress$'
