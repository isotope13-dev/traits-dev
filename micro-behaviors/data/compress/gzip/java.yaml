---
defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  - class
  - java_class
  - jar
  - zip
traits:
- id: gzip-outputstream
  desc: Java GZIPOutputStream class
  crit: notable
  conf: 0.86
  platforms:
  - unix
  - windows
  - android
  for:
  - class
  - java_class
  - jar
  - zip
  - apk
  if:
    type: text
    substr: java/util/zip/GZIPOutputStream
- id: gzip-outputstream-source
  desc: Java GZIPOutputStream construction in source
  crit: notable
  conf: 0.9
  for:
  - java
  - kotlin
  - groovy
  - scala
  if:
    type: text
    regex: new\s+GZIPOutputStream\s*\(
