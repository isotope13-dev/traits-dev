---
defaults:
  platforms:
  - windows
  for:
  - data
  - powershell
  - batch
  crit: notable
  conf: 0.88
traits:
- id: powershell-gzipstream
  desc: PowerShell GZipStream reference
  if:
    type: text
    regex: "(?i)\\bGZipStream\\b"
- id: powershell-gzip-compression-mode
  desc: PowerShell selects Gzip compression mode
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)CompressionMode\\]\\s*::\\s*Compress"
- id: gzip-compress-exe-source
  desc: Gzip-compresses an EXE source path
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)(SrcPath|ReadAllBytes).{0,80}\.exe'
composite_rules:
- id: powershell-gzipstream-compress
  desc: PowerShell GzipStream compression
  crit: notable
  conf: 0.92
  all:
  - id: powershell-gzipstream
  - id: powershell-gzip-compression-mode
  near_lines: 8
