defaults:
  platforms: [linux, macos, windows]
  for: [python, c, cpp, rust, go, javascript, typescript]
traits:
  - id: xpress-huffman-compress-call
    desc: Calls named XPRESS Huffman compression helper
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])xpress_huffman_compress$'
