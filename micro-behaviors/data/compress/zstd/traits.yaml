---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: zstd-compress
  desc: ZSTD_compress function
  crit: notable
  conf: 0.9
  for:
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    regex: ZSTD_compress
- id: go-zstd-decoder-pclntab
  desc: Go binary includes Zstandard decoder methods
  crit: notable
  conf: 0.9
  for:
  - pe
  - elf
  - macho
  if:
    type: text
    substr: compress/zstd.(*Decoder)
- id: zstd-cctx
  desc: ZSTD_CCtx type
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: ZSTD_CCtx
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: libzstd
  desc: libzstd library
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: libzstd
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
composite_rules:
- id: zstd-comp
  desc: Zstandard compression library
  crit: notable
  conf: 0.9
  any:
  - id: zstd-compress
  - id: micro-behaviors/data/decompress/zstd::zstd-decompress
  - id: zstd-cctx
  - id: libzstd
