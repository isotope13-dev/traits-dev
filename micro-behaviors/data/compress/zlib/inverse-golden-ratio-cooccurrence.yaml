defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Retains the former compact-XXTEA-loader predicate without claiming a
  # cipher or payload chain from a multiplier and zlib alone.
  - id: compact-zlib-with-inverse-golden-ratio-code
    desc: Zlib beside inverse golden-ratio code
    crit: notable
    conf: 0.95
    size_max: 2097152
    all:
      - id: micro-behaviors/data/compress/zlib::zlib-adler32-binary
    any:
      - id: metadata/binary/instruction/operand::inverse-golden-ratio-imul
      - id: metadata/binary/instruction/operand::inverse-golden-ratio-mov
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/signed/platform/
