---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: deflate
  desc: References the zlib deflate routine
  crit: notable
  conf: 0.8
  for:
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    exact: deflate
- id: zlib-adler32-binary
  desc: Zlib adler32 fast-division constant (x64)
  crit: notable
  conf: 0.7
  arch:
  - x86-64
  for:
  - pe
  - dll
  - elf
  - so
  if:
    type: hex
    section: ".text"
    pattern: B8 85 10 42 08 41 F7 E2
- id: zlib-compress-symbol
  desc: Compresses data with Python zlib.compress()
  crit: notable
  conf: 0.9
  for:
  - python
  - pyc
  if:
    type: symbol
    exact: zlib.compress
composite_rules:
- id: zlib
  desc: Zlib compression library
  crit: notable
  conf: 0.9
  any:
  - id: "micro-behaviors/data/codec::deflate-inflate"
  - id: micro-behaviors/data/codec::z-stream
  - id: zlib-adler32-binary
