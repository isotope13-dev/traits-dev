---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: deflate
  desc: References the zlib deflate routine
  crit: notable
  conf: 0.8
  for:
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    exact: deflate
- id: zlib-adler32-binary
  desc: Zlib adler32 fast-division constant (x64)
  crit: notable
  conf: 0.7
  arch:
  - x86-64
  for:
  - pe
  - dll
  - elf
  - so
  if:
    type: hex
    section: ".text"
    pattern: B8 85 10 42 08 41 F7 E2
- id: z-stream
  desc: z_stream type
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: z_stream
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: zlib-compress-symbol
  desc: Compresses data with Python zlib.compress()
  crit: notable
  conf: 0.9
  for:
  - python
  - pyc
  if:
    type: symbol
    exact: zlib.compress
- id: zlib-signature
  desc: zlib compression library reference
  crit: baseline
  conf: 0.8
  for:
  - binaries
  - scripts
  if:
    type: text
    exact: zlib
- id: zlib-dynamic-import
  desc: Python zlib dynamic import
  crit: notable
  conf: 0.9
  for:
  - python
  - text
  if:
    type: text
    regex: (?m)^[ \t]*[^#\n].{0,160}__import__\(\s*["']zlib["']\s*\)
composite_rules:
- id: zlib
  desc: Zlib compression library
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/compress/combined::zlib-deflate-inflate
  - id: z-stream
  - id: zlib-adler32-binary
  - id: zlib-signature
