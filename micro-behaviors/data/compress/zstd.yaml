---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: zstd-compress
  desc: ZSTD_compress function
  crit: notable
  conf: 0.9
  for:
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    regex: ZSTD_compress
- id: zstd-cctx
  desc: ZSTD_CCtx type
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: ZSTD_CCtx
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
