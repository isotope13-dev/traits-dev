defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: php-compressed-base64-decode
    desc: PHP decompresses base64-decoded data
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(gzinflate|gzuncompress|gzdecode)\s*\(\s*@?\s*base64_decode\s*\('

  - id: gzuncompress-call
    desc: PHP zlib uncompress call
    if:
      type: symbol
      exact: gzuncompress

  - id: gzinflate-call
    desc: PHP zlib inflate call
    if:
      type: symbol
      exact: gzinflate

  - id: gzdecode-call
    desc: PHP gzip decode call
    if:
      type: symbol
      exact: gzdecode
