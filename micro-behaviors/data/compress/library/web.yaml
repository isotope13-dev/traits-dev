defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: compression-stream-constructor
    desc: Creates a Web CompressionStream
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: CompressionStream

  - id: decompression-stream-constructor
    desc: Creates a Web DecompressionStream
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: DecompressionStream

composite_rules:
  - id: web-compression-streams
    desc: Uses Web Compression Streams APIs
    crit: notable
    conf: 0.98
    any:
      - id: compression-stream-constructor
      - id: decompression-stream-constructor
