# Python Compression Operations
# MBC: C0024 (Data Transformation)
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: lzma-import
    desc: Imports Python's LZMA compression library
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: lzma
  - id: lzma-decompressor-call
    desc: Creates a Python LZMA decompressor
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: lzma.LZMADecompressor
  - id: bz2-decompress-call
    desc: Calls Python bz2.decompress
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: bz2.decompress

  - id: gzip-open-call
    desc: Python gzip.open call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: gzip.open
  - id: gzip-decompress-call
    desc: Python gzip.decompress call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: gzip.decompress
  - id: gzip-compress-call
    desc: Python gzip.compress call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "gzip.compress"
composite_rules:
  - id: gzip-read-operation
    desc: Reads gzip compressed data
    crit: notable
    conf: 0.85
    any:
      - id: gzip-open-call
      - id: gzip-decompress-call
