defaults:
  platforms:
    - unix
    - windows
  for:
    - java
    - class
    - java_class
    - jar
    - zip
traits:
  - id: jvm-util-zip-class-ref
    desc: JVM ZIP package reference
    crit: baseline
    conf: 0.86
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/util/zip(/|$)'
  - id: gzip-inputstream
    desc: Java GZIPInputStream class
    crit: component
    if:
      type: text
      substr: java/util/zip/GZIPInputStream
  - id: gzip-outputstream
    desc: Java GZIPOutputStream class
    crit: notable
    conf: 0.86
    platforms: [unix, windows, android]
    for: [class, java_class, jar, zip, apk]
    if:
      type: text
      substr: java/util/zip/GZIPOutputStream

  - id: gzip-outputstream-source
    desc: Java GZIPOutputStream construction in source
    crit: notable
    conf: 0.9
    for: [java, kotlin, groovy, scala]
    if:
      type: text
      regex: 'new\s+GZIPOutputStream\s*\('
composite_rules:
  - id: gzip-decompress
    desc: Java GZIP in-memory decompression
    crit: notable
    conf: 0.85
    all:
      - id: gzip-inputstream
      - id: micro-behaviors/data/buffer::bytearrayinputstream-ref
