defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-zlib-import
    desc: Imports the Node.js zlib module
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '^(node:)?zlib$'
  - id: node-gzip-function
    desc: Node gzip compression call
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/library/runtime/
      - id: metadata/library/structure/
    if:
      type: text
      regex: '\bzlib\.(gzip|gzipSync)\s*\('
  - id: node-gunzip-function
    desc: Node gunzip decompression call
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bzlib\.gunzip(Sync)?\s*\('
  # Raw-deflate/zip decompression, the sibling of the gunzip trait above.
  # Packers prefer `inflateSync` over `gunzipSync` because a raw deflate blob
  # carries no gzip magic for a scanner to key on.
  - id: node-inflate-function
    desc: Node zlib inflate decompression call
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bzlib\.(inflate|inflateRaw|unzip)(Sync)?\s*\('
  - id: node-brotli-decompress-function
    desc: Node zlib Brotli decompression call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bzlib\.brotliDecompress(Sync)?\s*\('
  - id: node-gzip-stream-obfuscated
    desc: Obfuscated Node gzip stream creation
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: "zlib_\\d+\\[.{1,40}\\]\\[.{1,40}\\+'ip'\\]"
  - id: node-gzip-temp-output
    desc: Gzip output written to temp file
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: "Date\\[.{1,40}\\]\\(\\).{0,80}createWriteStrea"
composite_rules:
  - id: node-compression-library
    desc: Node.js compression library usage
    crit: notable
    conf: 0.82
    any:
      - id: node-zlib-import
      - id: node-gzip-functions
      - id: node-inflate-function
      - id: node-brotli-decompress-function
  - id: node-gzip-functions
    desc: Node gzip or gunzip calls
    crit: notable
    conf: 0.8
    any:
      - id: node-gzip-function
      - id: node-gunzip-function
  - id: node-gzip-stream-archive
    desc: Node gzip stream archive creation
    crit: notable
    conf: 0.88
    any:
      - id: node-gzip-stream-obfuscated
      - id: node-gzip-temp-output
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
