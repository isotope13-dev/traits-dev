---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: bz2-compress
  desc: BZ2_bzCompress function
  crit: notable
  conf: 0.9
  for:
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    regex: BZ2_bzCompress
- id: libbz2
  desc: libbz2 library
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: libbz2
- id: bzip2-string
  desc: bzip2 string
  crit: component
  conf: 0.8
  for:
  - scripts
  - binaries
  - "-php"
  count_min: 2
  if:
    type: text
    regex: "(?i)\\bbzip2\\b"
  not:
  - regex: application/x-bzip2?
  unless:
  - id: metadata/binary/framework::electron-desktop-runtime
  - id: metadata/binary/installer/script/
  - id: metadata/file/extension/identity::uninstaller-exe-basename
composite_rules:
- id: bzip2-comp
  desc: Bzip2 compression library
  crit: notable
  conf: 0.9
  any:
  - id: bz2-compress
  - id: micro-behaviors/data/decompress/bzip2::bz2-decompress
  - id: libbz2
  - id: bzip2-string
