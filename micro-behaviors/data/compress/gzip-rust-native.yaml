defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
  crit: notable

traits:
  - id: libflate-gzip-encoder-type
    desc: References libflate gzip encoder type
    conf: 0.95
    if:
      # Rust's internal type names survive in legacy mangled symbols even
      # when the symbol producer exposes only dynamic imports and exports.
      type: text
      regex: 'libflate(\.\.|::)gzip(\.\.|::)Encoder'
