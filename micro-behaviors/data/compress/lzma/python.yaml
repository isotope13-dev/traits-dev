---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: lzma-import
  desc: Imports Python's LZMA compression library
  conf: 0.9
  if:
    type: import
    exact: lzma
- id: lzma-open-stream
  desc: Opens a Python LZMA-compressed stream
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: lzma.open
