---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: liblzma
  desc: liblzma library
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: liblzma
  unless:
  - type: basename
    regex: "^liblzma\\.so\\.5\\.4\\.5$"
- id: lzma-crc64-table
  desc: lzma_crc64_table reference
  crit: notable
  conf: 0.4
  if:
    type: text
    substr: lzma_crc64_table
- id: lzma-prefix
  desc: lzma_ function prefix
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: "\\blzma_"
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - type: basename
    regex: "^liblzma\\.so\\.5\\.4\\.5$"
- id: lzmaenc
  desc: LzmaEnc SDK function
  crit: notable
  conf: 0.9
  if:
    type: text
    word: LzmaEnc
- id: lzmadec
  desc: References the LZMA SDK LzmaDec routine
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: LzmaDec
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: lzma-ok
  desc: LZMA_OK status
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: LZMA_OK
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
composite_rules:
- id: lzma
  desc: LZMA/XZ compression library
  crit: notable
  conf: 0.9
  any:
  - id: liblzma
  - id: lzma-prefix
  - id: lzmaenc
  - id: lzmadec
  - id: lzma-ok
