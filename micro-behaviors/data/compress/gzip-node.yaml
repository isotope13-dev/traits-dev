defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-create-gzip-reference
  desc: References Node zlib.createGzip stream factory
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      (member_expression
        object: (identifier) @module
        property: (property_identifier) @factory
        (#eq? @module "zlib")
        (#eq? @factory "createGzip")) @reference
- id: node-gzip-function
  desc: Node gzip compression call
  conf: 0.8
  unless:
  - id: well-known/lib
  - id: metadata/build
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: \bzlib\.(gzip|gzipSync)\s*\(
- id: node-gzip-stream-obfuscated
  desc: Obfuscated Node gzip stream creation
  conf: 0.86
  if:
    type: text
    regex: zlib_\d+\[.{1,40}\]\[.{1,40}\+'ip'\]
- id: node-gzip-temp-output
  desc: Gzip output written to temp file
  conf: 0.82
  if:
    type: text
    regex: Date\[.{1,40}\]\(\).{0,80}createWriteStrea
composite_rules:
- id: node-gzip-stream-archive
  desc: Node gzip stream archive creation
  conf: 0.88
  any:
  - id: node-gzip-stream-obfuscated
  - id: node-gzip-temp-output
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
