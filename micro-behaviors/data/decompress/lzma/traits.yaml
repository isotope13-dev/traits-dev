---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: lzstring-utf16-decompress
  desc: Decompresses UTF-16 data with LZString
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  if:
    type: text
    regex: "\\bLZString\\s*\\.\\s*decompressFromUTF16\\s*\\("
