defaults:
  platforms: [linux]
  for: [elf]
  arch: [aarch64]
traits:
  # Decoder arguments: properties at sp+0x48, input after the 21-byte
  # size/properties header, output/input length pointers, five properties.
  - id: arm64-sized-buffer-decode-setup
    desc: ARM64 sized LZMA buffer decode setup
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'E4 03 18 AA 62 56 00 91 E3 63 01 91 E1 43 01 91 A5 00 80 D2 F5 5B 05 A9'
