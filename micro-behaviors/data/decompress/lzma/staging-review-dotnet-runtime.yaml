defaults:
  platforms:
  - windows
  for:
  - powershell
  - pe
  - csharp
  conf: 0.94
traits:
- id: sevenzip-helper-name
  desc: SevenZipHelper name text
  crit: notable
  if:
    type: text
    word: SevenZipHelper
- id: sevenzip-lzma-namespace-name
  desc: SevenZip LZMA namespace text
  crit: component
  if:
    type: text
    word: SevenZip.Compression.LZMA
composite_rules:
- id: sevenzip-helper-lzma-names
  desc: SevenZip helper and LZMA namespace text
  crit: component
  all:
  - id: micro-behaviors/data/decompress/lzma::sevenzip-helper-name
  - id: micro-behaviors/data/decompress/lzma::sevenzip-lzma-namespace-name
