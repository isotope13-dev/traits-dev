---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: gzip-decompress-call
  desc: Python gzip.decompress call
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: gzip.decompress
composite_rules:
- id: gzip-read-operation
  desc: Reads gzip compressed data
  conf: 0.85
  any:
  - id: micro-behaviors/data/compress/gzip::gzip-open-call
  - id: gzip-decompress-call
