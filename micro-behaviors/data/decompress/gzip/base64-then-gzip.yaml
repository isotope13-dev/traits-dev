# Base64 and gzip used together are common in generated data and metadata
# tooling.  Keep the capability neutral; command-tasking intent requires the
# surrounding polling, envelope, and shell-dispatch evidence in objectives/.
defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: notable

traits:
  - id: python-base64-gzip-decode
    desc: Python decodes Base64 before gzip decompression
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: gzip.decompress
      arg:
        index: 0
        from:
          call: '^base64\.b64decode$'
