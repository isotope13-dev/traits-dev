defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [powershell]
composite_rules:
  - id: powershell-base64-rotation-gzip-clues
    desc: PowerShell Base64 strings, rotation and gzip clues
    conf: 0.98
    all:
      - id: metadata/file/line::powershell-long-line
      - id: metadata/file/encoding/base64::multiple-long-base64-literals
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::rotation-counter-update
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
