---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - go
traits:
- id: go-gzip-reader
  desc: Go gzip.NewReader decompression
  conf: 0.85
  if:
    type: symbol
    exact: gzip.NewReader
composite_rules:
- id: go-base64-gzip-decode
  desc: Go Base64 decoding near gzip reader construction
  conf: 0.95
  near_lines: 2
  all:
  - id: go-gzip-reader
  any:
  - id: micro-behaviors/data/decode/base64::go-base64-decode-method
  - id: micro-behaviors/data/decode/base64::new-decoder
- id: go-base64-gzip-near-stdout-output
  desc: Go Base64 and gzip decode calls near stdout output
  conf: 0.9
  near_lines: 5
  all:
  - id: go-base64-gzip-decode
  any:
  - id: micro-behaviors/os/console/io::go-stdout-write-call
  - id: micro-behaviors/os/console/io::go-copy-to-stdout-call
