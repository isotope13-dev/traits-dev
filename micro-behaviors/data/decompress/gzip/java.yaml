---
defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  - class
  - java_class
  - jar
  - zip
traits:
- id: gzip-inputstream
  desc: Java GZIPInputStream class
  crit: notable
  for:
  - java
  - class
  - java_class
  if:
    type: text
    substr: java/util/zip/GZIPInputStream
- id: gzip-byte-array-input-source
  desc: Java GZIP-decompresses in-memory bytes
  crit: notable
  conf: 0.94
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - groovy
  - scala
  if:
    type: text
    regex: new\s+GZIPInputStream\s*\(\s*new\s+ByteArrayInputStream\s*\(
composite_rules:
- id: gzip-decompress
  desc: Java GZIP in-memory decompression
  crit: notable
  conf: 0.85
  all:
  - id: gzip-inputstream
  - id: micro-behaviors/data/buffer::bytearrayinputstream-ref
