---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
# A factory may be exported as a callback without being called in this file.
- id: node-create-gunzip-reference
  desc: References Node zlib.createGunzip stream factory
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      (member_expression
        object: (identifier) @module
        property: (property_identifier) @factory
        (#match? @module "^zlib(_[0-9]+)?$")
        (#eq? @factory "createGunzip")) @reference
- id: node-gunzip-function
  desc: Node gunzip decompression call
  conf: 0.8
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: "\\bgunzip(Sync)?\\s*\\("
composite_rules:
- id: node-gzip-functions
  desc: Node gzip or gunzip calls
  conf: 0.8
  any:
  - id: micro-behaviors/data/compress/gzip::node-gzip-function
  - id: node-gunzip-function
