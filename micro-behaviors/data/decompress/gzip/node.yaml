---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-create-gunzip-call
  desc: Calls a gzip decompression stream factory
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: createGunzip
# A factory may be exported as a callback without being called in this file.
- id: node-create-gunzip-reference
  desc: References Node zlib.createGunzip stream factory
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      (member_expression
        object: (identifier) @module
        property: (property_identifier) @factory
        (#match? @module "^zlib(_[0-9]+)?$")
        (#eq? @factory "createGunzip")) @reference
- id: gunzip-call-text
  desc: Gzip decompression call syntax
  conf: 0.8
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: "\\bgunzip(Sync)?\\s*\\("
composite_rules:
- id: node-gzip-functions
  desc: Gzip compression or decompression call syntax
  conf: 0.8
  any:
  - id: micro-behaviors/data/compress::node-gzip-function
  - id: gunzip-call-text
