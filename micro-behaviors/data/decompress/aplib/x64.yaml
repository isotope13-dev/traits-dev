defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  # Literal copy and aPLib's carry-driven bit reader. The short branch
  # targets vary with the register-save prologue. Verified by emulating the
  # complete routine, including gamma-coded offsets and back references.
  - id: x64-aplib-depacker
    desc: x64 aPLib literal and bitstream decompressor
    conf: 0.98
    if:
      type: hex
      section: any
      pattern: 'FC B2 80 8A 06 48 FF C6 88 07 48 FF C7 BB 02 00 00 00 00 D2 75 ?? 8A 16 48 FF C6 10 D2 73'
