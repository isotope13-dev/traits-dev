# Verified by emulating this routine on the sample's config and helper blobs.
defaults:
  platforms: [windows, linux]
  for: [pe, dll, elf]
  arch: [x86]
  crit: notable
traits:
  - id: x86-aplib-depacker
    desc: x86 aPLib literal and bitstream decompressor
    conf: 0.98
    if:
      type: hex
      section: text
      pattern: '60 8B 74 24 24 8B 7C 24 28 FC B2 80 8A 06 83 C6 01 88 07 83 C7 01 BB 02 00 00 00 00 D2 75 ?? 8A 16 46 10 D2 73'
