---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-deflatestream-reference
  desc: LNK references DeflateStream
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: DeflateStream
- id: lnk-kv-deflatestream-argument
  desc: LNK arguments reference DeflateStream
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: lnk.arguments
    substr: DeflateStream
composite_rules:
- id: lnk-deflate-base64-reference-profile
  desc: LNK DeflateStream and Base64 with marker or encoded flag
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/decompress/deflate::lnk-deflatestream-reference
  - id: micro-behaviors/data/decode/base64/reference::lnk-dotnet-frombase64string-text
  any:
  - id: metadata/lang/encoding/shape/character::lnk-triple-z-marker
  - id: micro-behaviors/process/argument/interpreter::lnk-powershell-encoded-short
- id: lnk-argument-deflate-base64-reference-profile
  desc: LNK arguments reference DeflateStream and Base64 with PowerShell clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/decompress/deflate::lnk-kv-deflatestream-argument
  - id: micro-behaviors/data/decode/base64/reference::lnk-kv-frombase64string-argument
  any:
  - id: micro-behaviors/process/argument/interpreter::lnk-powershell-argument-reference
  - id: micro-behaviors/process/argument/interpreter::kv-encoding-flag
