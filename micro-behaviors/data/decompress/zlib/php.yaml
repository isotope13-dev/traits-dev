---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  crit: notable
  conf: 0.9
traits:
- id: gzuncompress-call
  desc: PHP zlib uncompress call
  if:
    type: symbol
    exact: gzuncompress
- id: php-inflate-literal
  desc: PHP inflates an embedded string
  if:
    type: text
    regex: \bgzinflate\s*\(\s*\(?\s*['"]
- id: gzinflate-call
  desc: PHP zlib inflate call
  if:
    type: symbol
    exact: gzinflate
