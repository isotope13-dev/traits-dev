---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
traits:
- id: inflate
  desc: References the zlib inflate routine
  crit: notable
  conf: 0.8
  for:
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    exact: inflate
- id: zlib-uncompress-call
  desc: Calls the zlib uncompress routine
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  - pe
  - elf
  - macho
  - dll
  if:
    type: symbol
    kind: call
    exact: uncompress
- id: python-zlib-alias-decompress-call
  desc: Python zlib alias decompress call
  crit: notable
  conf: 0.9
  for:
  - python
  - pyc
  if:
    type: text
    regex: exec\(_[A-Za-z]\w*\.decompress\(_b\.b64decode
- id: zlib-decompress-symbol
  desc: zlib.decompress symbol
  crit: notable
  conf: 0.9
  for:
  - python
  - pyc
  if:
    type: symbol
    exact: zlib.decompress
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: zlib-decompress-dynamic
  desc: Python dynamically imports zlib to decompress
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: \b__import__\s*\(\s*("zlib"|'zlib')\s*\)\s*\.\s*decompress\s*\(
- id: ruby-zlib-inflate
  desc: Decompresses data with Ruby Zlib.inflate
  crit: notable
  conf: 0.92
  for:
  - ruby
  if:
    type: text
    substr: Zlib::Inflate.inflate
composite_rules:
- id: zlib-decompress
  for: [python, pyc, ruby]
  desc: zlib.decompress call
  crit: notable
  conf: 0.9
  any:
  - id: zlib-decompress-symbol
  - id: python-zlib-alias-decompress-call
  - id: zlib-decompress-dynamic
  - id: ruby-zlib-inflate
- id: python-zlib-decompress
  desc: Python zlib decompress call
  crit: notable
  conf: 0.9
  for:
  - python
  - pyc
  any:
  - id: zlib-decompress-symbol
  - id: python-zlib-alias-decompress-call
