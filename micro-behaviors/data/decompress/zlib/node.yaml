---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-create-inflate-call
  desc: Calls a DEFLATE decompression stream factory
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: createInflate
- id: node-inflate-function
  desc: Node zlib inflate decompression call
  conf: 0.8
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: symbol
    kind: call
    regex: '\.(inflate|inflateRaw|unzip)(Sync)?$'
    receiver:
      from:
        call: '^require$'
        literal: '^(node:)?zlib$'
- id: javascript-inflate-sync-call
  desc: Decompresses data synchronously with DEFLATE
  conf: 0.94
  if:
    # The extractor records the full dotted callee, so the idiomatic
    # `require('zlib').inflateSync(...)` chain arrives as
    # `require.inflateSync` and a bare `exact:` misses it. Anchor on the
    # member name the way vm runInContext rules do.
    type: symbol
    kind: call
    regex: '(^|\.)inflateSync$'
- id: pako-inflate-call
  desc: Calls pako's DEFLATE inflater
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: '\.inflate$'
    receiver:
      from:
        call: '^require$'
        literal: '^pako$'
