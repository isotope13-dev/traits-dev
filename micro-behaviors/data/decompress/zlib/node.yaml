---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-inflate-function
  desc: Node zlib inflate decompression call
  conf: 0.8
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: "\\bzlib\\.(inflate|inflateRaw|unzip)(Sync)?\\s*\\("
- id: javascript-inflate-sync-call
  desc: Decompresses data synchronously with DEFLATE
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: inflateSync
- id: pako-inflate-call
  desc: Calls pako's DEFLATE inflater
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: '\.inflate$'
    receiver:
      from:
        call: '^require$'
        literal: '^pako$'
