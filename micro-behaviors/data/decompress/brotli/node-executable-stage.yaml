defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
composite_rules:
  - id: remote-brotli-binary-stage
    desc: Brotli stream, hash and executable-mode clues
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
      - id: micro-behaviors/data/decompress/brotli::js-create-brotli-decompress
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/fs/write/file/stream::node-pipeline-write-stream

