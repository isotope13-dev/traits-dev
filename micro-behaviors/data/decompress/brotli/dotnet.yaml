defaults:
  platforms: [linux, macos, windows]
  for: [csharp]
  crit: notable
  conf: 0.97

traits:
  - id: dotnet-brotli-stream-decompress
    desc: Constructs BrotliStream in decompression mode
    if:
      type: text
      regex: '\bBrotliStream\s*\([^;]{0,160}CompressionMode\.Decompress\b'

  - id: dotnet-brotli-buffer-decompress
    desc: Calls .NET Brotli buffer decompression
    if:
      type: symbol
      kind: call
      regex: '(^|\.)BrotliDecoder\.TryDecompress$'
