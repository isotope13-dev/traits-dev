defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: js-executable-suffix-with-brotli-decompress
  desc: Executable Brotli suffix near decompressor call
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/extension::javascript-brotli-executable-suffix
  - id: micro-behaviors/data/decompress/brotli::js-create-brotli-decompress
  near_bytes: 4000
