defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-brotli-decompress-call
    desc: Calls Python Brotli buffer decompression
    if:
      type: symbol
      kind: call
      regex: '^brotli(cffi)?\.decompress$'

  - id: python-brotli-decompressor-call
    desc: Constructs Python Brotli streaming decoder
    if:
      type: symbol
      kind: call
      regex: '^brotli(cffi)?\.Decompressor$'
