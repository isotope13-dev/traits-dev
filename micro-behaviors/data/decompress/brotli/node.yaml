---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-brotli-decompress-function
  desc: Calls the Brotli decompression API
  conf: 0.9
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: symbol
    kind: call
    regex: '(^|\.)brotliDecompress(Sync)?$'
- id: js-create-brotli-decompress
  desc: Brotli decompress constructor call
  conf: 0.95
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    substr: createBrotliDecompress
