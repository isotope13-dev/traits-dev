---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-brotli-decompress-function
  desc: Node zlib Brotli decompression call
  conf: 0.9
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: "\\bzlib\\.brotliDecompress(Sync)?\\s*\\("
- id: js-create-brotli-decompress
  desc: Brotli decompress constructor call
  conf: 0.95
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    substr: createBrotliDecompress
