defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, static-lib]
  crit: notable
  conf: 0.98

traits:
  - id: native-brotli-decompress-symbol
    desc: Native Brotli decompression API symbol
    if:
      type: symbol
      substr: BrotliDecoderDecompress

  - id: native-brotli-decompress-call
    desc: Calls native Brotli buffer or stream decoder
    for: [c, cpp, csharp]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)BrotliDecoderDecompress(Stream)?$'
