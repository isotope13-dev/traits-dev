---
defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  conf: 0.9
traits:
- id: decompress-decoded-to-text
  desc: Decompressed bytes decoded to text
  if:
    type: text
    regex: decompress\s*\(.{0,160}\)\s*\.decode\b
composite_rules:
- id: script-decompress-call
  desc: Runtime decompression call
  any:
  - id: "micro-behaviors/data/decompress/aplib/"
  - id: "micro-behaviors/data/decompress/brotli/"
  - id: "micro-behaviors/data/decompress/bzip2/"
  - id: "micro-behaviors/data/decompress/gzip::go-gzip-reader"
  - id: "micro-behaviors/data/decompress/gzip::gzdecode-call"
  - id: "micro-behaviors/data/decompress/gzip::gzip-byte-array-input-source"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompress"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompress-call"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompression-stream"
  - id: "micro-behaviors/data/decompress/gzip::gzip-inputstream"
  - id: "micro-behaviors/data/decompress/gzip::node-gunzip-function"
  - id: "micro-behaviors/data/decompress/lz4/"
  - id: "micro-behaviors/data/decompress/lzma::lzma-decompressor-call"
  - id: "micro-behaviors/data/decompress/lzma::lzstring-utf16-decompress"
  - id: "micro-behaviors/data/decompress/stream::decompression-stream-constructor"
  - id: "micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress"
  - id: "micro-behaviors/data/decompress/zlib::compressionmode-decompress"
  - id: "micro-behaviors/data/decompress/zlib::dotnet-deflate-decompress"
  - id: "micro-behaviors/data/decompress/zlib::gzinflate-call"
  - id: "micro-behaviors/data/decompress/zlib::gzuncompress-call"
  - id: "micro-behaviors/data/decompress/zlib::inflate"
  - id: "micro-behaviors/data/decompress/zlib::javascript-inflate-sync-call"
  - id: "micro-behaviors/data/decompress/zlib::node-inflate-function"
  - id: "micro-behaviors/data/decompress/zlib::php-inflate-literal"
  - id: "micro-behaviors/data/decompress/zlib::powershell-data-deflate-decompress"
  - id: "micro-behaviors/data/decompress/zlib::ruby-zlib-inflate"
  - id: "micro-behaviors/data/decompress/zlib::sharpziplib-inflaterinputstream"
  - id: "micro-behaviors/data/decompress/zlib::zlib-decompress"
  - id: "micro-behaviors/data/decompress/zlib::zlib-decompress-dynamic"
  - id: "micro-behaviors/data/decompress/zlib::zlib-decompress-symbol"
  - id: "micro-behaviors/data/decompress/zlib::zlib-uncompress-call"
  - id: "micro-behaviors/data/decompress/zstd::zstd-decompress"
- id: base64-compressed-transform
  desc: Decodes Base64-compressed data
  conf: 0.94
  all:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  - id: script-decompress-call
  near_lines: 12

