defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-lz-history-distance-copy
    desc: LZ history distance and length copy loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Build a little-endian two-byte distance, then read a length byte
      # (+3) and copy prior output bytes into the current output position.
      # Compiler NOP padding and bounds-check branches remain variable.
      pattern: '44 0F B6 04 0E 89 D1 0F B6 0C 0E 41 C1 E0 08 41 09 C8 [0-64] 44 0F B6 1C 16 [0-16] 45 29 C4 41 83 C3 03 [0-128] 47 0F B6 04 02 39 E8 44 88 01'
