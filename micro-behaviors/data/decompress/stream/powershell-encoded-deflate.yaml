defaults:
  platforms: [windows]
  for: [data]

composite_rules:
  - id: powershell-base64-deflate-context
    desc: PowerShell Base64 decode and Deflate reference
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      # The generic .NET method name also appears in managed-runtime metadata.
      # Require PowerShell's conversion expression before calling this a loader.
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-untyped
      - id: micro-behaviors/data/compression::powershell-deflatestream-reference
  - id: powershell-deflate-streamreader
    desc: PowerShell reads a Deflate stream
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/buffer/read::powershell-streamreader-readtoend
      - id: micro-behaviors/data/decompress/zlib::powershell-data-deflate-decompress
