defaults:
  platforms: [windows]
  for: [data, powershell, batch]
  crit: notable
  conf: 0.88

traits:
  - id: powershell-compressionmode-decompress
    desc: PowerShell selects decompression mode
    if:
      type: text
      regex: '(?i)CompressionMode\]::\s*Decompress|CompressionMode\.Decompress'
