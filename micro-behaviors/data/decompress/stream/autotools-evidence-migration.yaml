defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: test-fixture-exec-xz
    desc: Test XZ decompressor and shell clues
    crit: suspicious
    conf: 0.75
    if:
      type: text
      # Require xz/xzcat/unxz as a decompressor command — not ADD of *.tar.xz
      # (Docker/build tests) or unrelated "test…xz…|shell" string adjacency.
      regex: 'test.{0,50}\b(xzcat|unxz|xz -[a-z]*d)\b[\s\S]{0,100}(sh|shell|\|)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: text
        regex: test -f '[^']+' \|\| echo '\$\(srcdir\)/'
      - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
      - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
  - id: test-fixture-exec-bzcat
    desc: Test bzcat and shell or pipe clues
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'test.{0,50}bzcat[\s\S]{0,100}(sh|shell|\|)'
    unless:
      - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
      - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test

composite_rules:
  - id: test-fixture-exec
    desc: Test decompressor and shell clues
    crit: suspicious
    conf: 0.85
    any:
      - id: micro-behaviors/data/decompress/stream::test-fixture-exec-xz
      - id: micro-behaviors/data/decompress/stream::test-fixture-exec-bzcat
