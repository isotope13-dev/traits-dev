# ROT13 is symmetric: the transform alone establishes neither direction nor intent.
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.98
traits:
- id: shell-tr-rot13
  desc: Shell tr applies a ROT13 substitution
  if:
    type: symbol
    kind: call
    exact: tr
    args:
    - index: 0
      kind: string
      exact: A-Za-z
    - index: 1
      kind: string
      exact: N-ZA-Mn-za-m
