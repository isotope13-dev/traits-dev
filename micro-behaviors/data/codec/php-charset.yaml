# Transcoding changes a string's character set; it is not payload concealment.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: php-iconv-call
    desc: PHP iconv character-set conversion call
    if:
      type: symbol
      kind: call
      regex: '^\\?iconv$'
  - id: php-mb-convert-encoding-call
    desc: PHP mb_convert_encoding charset call
    if:
      type: symbol
      kind: call
      regex: '^\\?mb_convert_encoding$'
