# ROT13 is self-inverse; the API alone establishes neither direction nor intent.
defaults:
  for: [php]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: php-rot13-call
    desc: Calls the PHP ROT13 string transform
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '(?i)^str_rot13$'
