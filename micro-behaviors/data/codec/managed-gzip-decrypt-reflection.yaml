composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: dotnet-gzip-decrypt-reflection-api-profile
  desc: GZip, decryption and dynamic-reflection APIs
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/build/protector::suppress-ildasm-managed-pe-string
  - id: metadata/lang/compiler/managed::reflection-emit
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  unless:
  - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
  - id: metadata/file/extension/identity::netstandard-dll-basename
  - id: well-known/lib/runtime/managed/dotnet-runtime::msbuild-runtime-assembly-context
  - id: well-known/lib/runtime/managed/dotnet-runtime::source-built-artifacts-pkg-path
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/signed/platform::microsoft
  - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary
