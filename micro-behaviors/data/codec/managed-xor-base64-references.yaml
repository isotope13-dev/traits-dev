defaults:
  platforms: [windows]
  for: [pe, dll]

# These are separate observations, not a bound Base64-to-XOR decoder.
composite_rules:
  - id: managed-byte-xor-with-base64-api-references
    desc: Byte-XOR store beside Base64 and HTTP or launch references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/encoding/xor::cil-byte-array-xor-store-sequence
      - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
    any:
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
