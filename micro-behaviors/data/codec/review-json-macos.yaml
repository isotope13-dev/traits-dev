---
defaults:
  platforms:
  - macos
  - ios
  for:
  - macho
  - swift
  - objc
  crit: baseline
traits:
- id: nsjsonserialization-class
  desc: NSJSONSerialization class reference
  conf: 0.75
  if:
    type: symbol
    exact: OBJC_CLASS_$_NSJSONSerialization
- id: nsjsonserialization-text
  desc: ObjC JSON conversion API reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: NSJSONSerialization
composite_rules:
- id: swift-json-object-serialization
  desc: JSON API and dictionary bridge references
  crit: notable
  conf: 0.82
  all:
  - id: micro-behaviors/data/codec::nsjsonserialization-class
  - id: micro-behaviors/data/collection/map::swift-dictionary-objc-bridge
