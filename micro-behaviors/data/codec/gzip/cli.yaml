traits:
  - id: gzip-cli-flag
    desc: gzip command with an option flag
    for: [shell, applescript, python]
    platforms: [macos]
    crit: component
    conf: 0.5
    if:
      type: string_literal
      regex: gzip\s+-
    unless:
      - id: well-known/app/system/drivers/nvidia::linux-driver-script-basename
