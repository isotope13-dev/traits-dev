---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: gzipfile-class
  desc: Python GzipFile class reference
  conf: 0.9
  if:
    type: symbol
    exact: GzipFile
- id: gzip-open-call
  desc: Python gzip.open call
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: gzip.open
composite_rules:
- id: gzip-read-operation
  desc: Python gzip I/O or decompression API
  conf: 0.85
  any:
  - id: "micro-behaviors/data/codec/gzip::gzip-open-call"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompress-call"
