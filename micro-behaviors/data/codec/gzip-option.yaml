defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, source, pe, class]

traits:
  - id: gzip-compression-option
    desc: Assigns a GZIP compression option
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bCOMPRESSION\s*=\s*[''"]?GZIP[''"]?\b'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
