defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-multiply-rotate-plaintext-feedback-xor
    desc: XOR byte transform with multiply-rotate feedback
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # key *= multiplier; key += constant; rol key, 3;
      # output[i] = input[i] ^ key; key += input[i]. No direction claim.
      pattern: '0F AF 45 ?? 8B 55 ?? 8B 75 ?? 0F B6 14 0A 83 C0 ?? C1 C0 03 89 D3 31 C3 01 D0 88 1C 0E 41 EB ??'
