defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.98

traits:
  - id: x86-indexed-inplace-xor-buffer-loop
    desc: x86 indexed in-place XOR buffer loop
    if:
      type: hex
      # A counted loop reads buffer[index], XORs an argument key into the
      # byte, and writes it back to the same buffer[index]. The alternatives
      # bound the index by a length argument or an indirect strlen-like call.
      # Neither direction nor malicious intent follows from this transform.
      # Include populated unpacked sections as well as normal .text code;
      # the function contains no fixed addresses, key values or family names.
      offset_range: [0, 2097152]
      pattern: '55 8B EC 51 C7 45 FC 00 00 00 00 EB 09 8B 45 FC 83 C0 01 89 45 FC ( 8B 4D 08 51 FF 15 ?? ?? ?? ?? 39 45 FC 7D 16 8B 55 08 03 55 FC 0F BE 02 33 45 0C 8B 4D 08 03 4D FC 88 01 EB D2 | 8B 4D FC 3B 4D 0C 7D 16 8B 55 08 03 55 FC 0F BE 02 33 45 10 8B 4D 08 03 4D FC 88 01 EB D9 ) 8B 45 08 8B E5 5D C3'
