defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, php, perl, powershell]
  conf: 0.7
traits:
  - id: base64-helper-invocation
    desc: Calls a Base64 conversion helper
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(atob|btoa|base64)$'
    not:
      - substr: ".cargo\\registry\\src\\"
      - substr: "\\base64-"
      - substr: "\\base64.rs"
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - type: text
        regex: '(?i)[\\/]+base64-[0-9]+\.[0-9]+\.[0-9]+[\\/]'
