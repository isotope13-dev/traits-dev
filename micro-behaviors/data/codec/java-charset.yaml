defaults:
  platforms: [unix, windows]
  for: [jsp, java]
  crit: notable
  conf: 0.99
traits:
  - id: java-ec-latin1-charset-helper
    desc: EC reinterprets Latin-1 using caller charset
    if:
      type: text
      substr: 'String EC(String s,String c)throws Exception{return new String(s.getBytes("ISO-8859-1"),c);}'
      exclude_html_comments: true
