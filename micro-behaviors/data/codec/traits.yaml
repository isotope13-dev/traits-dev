traits:
- id: zlib-codec-name-reference
  desc: zlib codec name reference
  crit: baseline
  conf: 0.8
  platforms: [linux, macos, windows]
  for: [binaries, scripts]
  if:
    type: text
    exact: zlib
- id: libzstd-codec-name-reference
  desc: libzstd codec library name reference
  crit: baseline
  conf: 0.8
  platforms: [linux, macos, windows]
  for: [c, cpp, rust, go, pe, elf, macho, wasm]
  if:
    type: text
    word: libzstd
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: libbz2-name-reference
  desc: libbz2 codec library name reference
  crit: baseline
  conf: 0.9
  platforms: [linux, macos, windows]
  for: [c, cpp, rust, go, pe, elf, macho, wasm]
  if:
    type: text
    substr: libbz2
- id: bzip2-name-reference
  desc: Repeated bzip2 codec name reference
  crit: baseline
  conf: 0.8
  platforms: [linux, macos, windows]
  for: [scripts, binaries, "-php"]
  count_min: 2
  if:
    type: text
    regex: "(?i)\\bbzip2\\b"
  not:
  - regex: application/x-bzip2?
  unless:
  - id: metadata/binary/framework::electron-desktop-runtime
  - id: metadata/binary/installer/script/
  - id: metadata/file/extension/identity::uninstaller-exe-basename
- id: gzip-cli-flag
  desc: gzip command with an option flag
  for:
  - shell
  - applescript
  - python
  platforms:
  - macos
  crit: component
  conf: 0.5
  if:
    type: string_literal
    regex: gzip\s+-
  unless:
  - id: well-known/app/system/drivers/nvidia::linux-driver-script-basename
- crit: notable
  for: &id003
  - pe
  - dll
  - csharp
  platforms: &id004
  - windows
  id: gzipstream-dotnet
  desc: .NET GZipStream compression class reference
  conf: 0.8
  if:
    type: text
    word: GZipStream
- platforms:
  - windows
  for:
  - data
  - powershell
  - batch
  crit: notable
  conf: 0.88
  id: powershell-gzipstream
  desc: PowerShell GZipStream reference
  if:
    type: text
    regex: (?i)\bGZipStream\b
- crit: notable
  platforms: &id001
  - windows
  - unix
  for: &id002
  - python
  id: gzipfile-class
  desc: Python GzipFile class reference
  conf: 0.9
  if:
    type: symbol
    exact: GzipFile
- crit: notable
  platforms: *id001
  for: *id002
  id: gzip-open-call
  desc: Python gzip.open call
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: gzip.open
- crit: notable
  conf: 0.9
  platforms: &id005
  - linux
  - macos
  - windows
  id: z-stream
  desc: z_stream type
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
  if:
    type: text
    word: z_stream
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
- id: bzip2-codec-evidence
  desc: Bzip2 codec API evidence
  crit: notable
  conf: 0.9
  platforms: [linux, macos, windows]
  for: [pe, elf, macho, dll]
  any:
  - id: micro-behaviors/data/compress/bzip2::bz2-compress
  - id: micro-behaviors/data/compress/bzip2::bz2-buff-to-buff-compress
  - id: micro-behaviors/data/compress/bzip2::bz2-compress-init
  - id: micro-behaviors/data/compress/bzip2::bz2-compress-end
  - id: micro-behaviors/data/decompress/bzip2::bz2-decompress
- id: web-compression-streams
  desc: Uses direction-neutral Web Compression Streams APIs
  crit: notable
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript, typescript]
  any:
  - id: micro-behaviors/data/compress/stream::compression-stream-constructor
  - id: micro-behaviors/data/decompress/stream::decompression-stream-constructor
- crit: notable
  for: *id003
  platforms: *id004
  id: dotnet-gzip-compression
  desc: .NET GZip compression via System.IO.Compression
  conf: 0.85
  all:
  - id: micro-behaviors/data/codec::gzipstream-dotnet
  - id: micro-behaviors/data/compress/stream::system-io-compression
- crit: notable
  platforms: *id001
  for: *id002
  id: gzip-read-operation
  desc: Python gzip I/O or decompression API
  conf: 0.85
  any:
  - id: micro-behaviors/data/codec::gzip-open-call
  - id: micro-behaviors/data/decompress/gzip::gzip-decompress-call
- crit: notable
  conf: 0.9
  platforms: *id005
  id: deflate-inflate
  desc: Zlib deflate and inflate
  all:
  - id: micro-behaviors/data/compress/zlib::deflate
  - id: micro-behaviors/data/decompress/zlib::inflate
- platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
  id: lzma
  desc: LZMA/XZ codec evidence
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/compress/lzma::liblzma
  - id: micro-behaviors/data/compress/lzma::lzma-prefix
  - id: micro-behaviors/data/compress/lzma::lzmaenc
  - id: micro-behaviors/data/decompress/lzma::lzmadec
  - id: micro-behaviors/data/compress/lzma::lzma-ok
- platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
  - wasm
  id: zstd-codec-evidence
  desc: Zstandard codec API evidence
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/compress/zstd::zstd-compress
  - id: micro-behaviors/data/decompress/zstd::zstd-decompress
  - id: micro-behaviors/data/compress/zstd::zstd-cctx
