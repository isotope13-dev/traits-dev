defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: component

traits:
  - id: js-utf8-decoder-helper-name
    desc: UTF-8 decoder helper name
    if:
      type: text
      regex: '\bdecoderReplacer\b|\bdecodeUTF8\b|\bdecodeUtf8\b'
  - id: js-utf8-encoder-helper-name
    desc: UTF-8 encoder helper name
    if:
      type: text
      regex: '\bencoderReplacer\b|\bencodeUTF8\b|\bencodeUtf8\b'
  - id: js-utf8-codec-api
    desc: UTF-8 codec API reference
    if:
      type: text
      regex: '\bTextEncoder\b|\bTextDecoder\b|UTF-8|utf8'

composite_rules:
  - id: js-utf8-codec-helper-pair
    desc: Names paired UTF-8 decoder and encoder helpers
    crit: notable
    conf: 0.94
    scope: file
    near_bytes: 8192
    all:
      - id: js-utf8-decoder-helper-name
      - id: js-utf8-encoder-helper-name
      - id: js-utf8-codec-api
