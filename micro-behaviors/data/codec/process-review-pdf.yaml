defaults:
  platforms: [windows, unix]
  for: [pdf]
  crit: suspicious
  conf: 0.95
  attack: T1203

traits:
  - id: js-streamdecode
    desc: PDF JavaScript streamDecode decoder API
    conf: 0.9
    if:
      type: text
      regex: 'SOAP(\.|\[.{0,80})streamDecode'
