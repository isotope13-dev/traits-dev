# The same byte transform appears in the transmit and receive paths. Neither
# direction nor concealment intent follows from the loop alone.
defaults:
  for: [elf]
  platforms: [linux]
  arch: [arm]
  crit: notable
  conf: 0.98

traits:
  - id: arm-four-byte-cyclic-xor-buffer-loop
    desc: ARM four-byte cyclic XOR buffer loop
    if:
      type: hex
      section: .text
      # AND 3 selects a key byte; LDRB/EOR/STRB transform the same indexed
      # buffer byte. Both forms advance the key position and bound the loop
      # by the byte count. No addresses, key values or family tokens are used.
      pattern: '(03 30 03 E2 03 10 D4 E7 00 20 D6 E7 01 30 80 E2 01 20 22 E0 03 38 A0 E1 00 20 C6 E7 23 08 A0 E1 01 20 8C E2 00 00 55 E1 02 30 A0 E1 02 C0 A0 E1 F2 FF FF 1A | 0C 18 A0 E1 21 18 A0 E1 03 20 02 E2 02 00 D7 E7 01 30 DA E7 00 30 23 E0 01 30 CA E7 08 20 97 E5 01 C0 8C E2 01 30 82 E2 0C 00 5E E1 03 20 A0 E1 08 30 87 E5 F1 FF FF 1A)'
