defaults:
  platforms: [unix, windows]
  for: [python, pyc]

composite_rules:
  # Preserve the former serialization-directory membership after moving
  # its reader traits to parsing; unrelated JSON parsers are not added.
  - id: python-json-transform-reference
    desc: Python JSON parsing or serialization reference
    crit: notable
    any:
      - id: micro-behaviors/data/serialize/json/
      - id: micro-behaviors/data/parse/json::json-loads-call
      - id: micro-behaviors/data/parse/json::json-loads-pyc-name
      - id: micro-behaviors/data/parse/json::json-load-call
      - id: micro-behaviors/data/parse/json::model-response-json-loads
      - id: micro-behaviors/data/parse/json::comprehension-parse
