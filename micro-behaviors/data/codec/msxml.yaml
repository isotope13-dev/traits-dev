defaults:
  platforms:
  - windows
  crit: notable
traits:
- for:
  - python
  - javascript
  - powershell
  - pe
  - oledoc
  - ooxml
  - vbs
  - html
  id: msxml-datatype-bin-base64
  desc: XML node bin.base64 datatype assignment
  conf: 0.9
  if:
    type: text
    regex: (?i)dataType\s*=\s*['"]bin\.base64['"]
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  - mp3
  - text
  id: msxml-bin-base64-token
  desc: References XML bin.base64 data type
  conf: 0.9
  if:
    type: text
    substr: bin.base64
    case_insensitive: true
composite_rules:
- for:
  - python
  - javascript
  - powershell
  - pe
  - oledoc
  - ooxml
  id: base64data-element-and-type
  desc: Base64Data element and bin.base64 type
  conf: 0.95
  all:
  - id: micro-behaviors/data/collection/dom::create-element-base64data
  - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  id: msxml-base64-type-and-value
  desc: MSXML Base64 type and typed-value references
  conf: 0.86
  all:
  - id: micro-behaviors/data/parse/xml::msxml-domdocument-progid
  - id: micro-behaviors/data/codec::msxml-bin-base64-token
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
- for:
  - oledoc
  - ooxml
  id: document-base64-type-and-value
  desc: XML type and value tokens in document bytes
  conf: 0.96
  all:
  - id: micro-behaviors/data/codec::msxml-bin-base64-token
  - id: micro-behaviors/data/parse/xml::domdocument-token-in-document
  - id: micro-behaviors/data/property/access::node-typed-value-in-document
