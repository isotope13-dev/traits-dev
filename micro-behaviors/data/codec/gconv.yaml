defaults:
  platforms: [unix]
  for: [scripts, binaries]
traits:
  - id: gconv-init-reference
    desc: References the GNU gconv_init conversion hook
    crit: notable
    conf: 0.4
    if:
      type: text
      substr: gconv_init
    unless:
      - id: metadata/binary/linking/static/
      # The exported ABI hook is normal in an actual glibc gconv module; the
      # exploit signal requires an accompanying GCONV_PATH/payload context.
      - id: well-known/lib/native/glibc::gnu-character-conversion-module
      - id: well-known/lib/native/glibc::libc-runtime
      - id: well-known/tool/development/toolchain/gcc-toolchain::gcc-bootstrap-benign-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
