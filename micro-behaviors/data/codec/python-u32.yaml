# struct's >I format describes a binary field, including image box lengths.
# It does not establish a socket, encryption, or a network framing protocol.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-big-endian-u32-format
    desc: Python big-endian unsigned 32-bit format
    if:
      type: text
      regex: 'struct\.(pack|unpack)\([\"\x27]>I[\"\x27]'
