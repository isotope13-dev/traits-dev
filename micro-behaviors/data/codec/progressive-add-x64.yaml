defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.98

traits:
  - id: x64-progressive-add-byte-decoder
    desc: Byte decoding with a progressing additive key
    if:
      type: hex
      section: .text
      # bpl is the key; input byte + key is appended to the output string.
      # Generalize the seed, step, call displacement, and branch offset.
      pattern: '(40 B5 ?? 45 31 F6 42 8A 04 37 40 00 E8 0F B6 D0 48 89 D9 E8 ?? ?? ?? ?? 49 FF C6 40 80 C5 ?? 4C 39 F6 75 ?? | 40 B5 ?? 45 31 FF 4C 8B 63 10 46 8A 2C 3F 45 31 F6 89 E8 44 00 E8 41 0F 98 C6 49 FF C6 48 89 D9 4C 89 F2 E8 ?? ?? ?? ?? 41 00 ED 48 8B 44 24 28 48 8B 4C 24 30 79 ?? 44 89 EA C0 EA 06 41 80 E5 BF 80 CA C0 44 88 6C 08 01 41 89 D5 44 88 2C 08 4D 01 F4 4C 89 64 24 30 49 FF C7 40 80 C5 ?? 4C 39 FE 75 ??)'
  - id: x64-feedback-xor-rotate-buffer
    desc: Feedback XOR and per-byte rotation encoding
    if:
      type: hex
      section: .text
      # XOR previous encoded byte, index, random-key byte, and input byte;
      # the following pass rotates bytes by key + index.
      pattern: '44 89 C1 80 E1 18 41 89 D2 41 D3 EA 44 30 C8 44 30 D0 42 32 04 0E 42 88 04 0E 49 FF C1 41 83 C0 08 EB ?? 89 D0 45 31 C0 4D 39 C7 74 ?? 42 8D 0C 00 42 D2 04 06 49 FF C0 EB ??'
