defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: computed-this-method-call
    desc: Calls a computed this method
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require the closing subscript before the call. The former pattern also
      # matched ordinary assignments such as this[normalize(key)] = value.
      # Keep the receiver adjacent to the subscript so prose such as
      # "this [example](...)" in Markdown is not treated as JavaScript.
      regex: '\bthis\[\s*\w+\s*\]\s*\('

  - id: computed-expression-this-method-call
    desc: Calls a computed-expression this method
    crit: notable
    conf: 0.8
    count_min: 2
    if:
      type: text
      regex: 'this\[[a-zA-Z0-9_\s]*[\(\+][a-zA-Z0-9_\(\)\+\s]*\]\('
    unless:
      - id: well-known/lib/web/jquery/
      - id: metadata/library/prototype/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context

  - id: helper-call-https-module-name
    desc: Passes HTTPS module name to helper
    crit: component
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']https["'']\)'

  - id: helper-call-child-process-module-name
    desc: Passes child-process module name to helper
    crit: component
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']child_process["'']\)'

composite_rules:
  - id: helper-call-network-process-module-names
    desc: Passes network and process module names to helpers
    crit: component
    conf: 0.95
    near_bytes: 256
    all:
      - id: helper-call-https-module-name
      - id: helper-call-child-process-module-name
