defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:

  - id: helper-call-https-module-name
    desc: Passes HTTPS module name to helper
    crit: notable
    unless:
      # Direct require('https') is an ordinary static Node import, not a
      # reflective helper lookup. The builtin-import trait reports it.
      - id: metadata/import/builtin::require-https
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']https["'']\)'

  - id: helper-call-child-process-module-name
    desc: Passes child-process module name to helper
    crit: notable
    unless:
      # Direct require('child_process') is an ordinary static Node import, not
      # a reflective helper lookup. The builtin-import trait reports it.
      - id: metadata/import/builtin::require-child-process
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']child_process["'']\)'
composite_rules:
  - id: helper-call-network-process-module-names
    desc: Passes network and process module names to helpers
    crit: component
    conf: 0.95
    near_bytes: 256
    all:
      - id: helper-call-https-module-name
      - id: helper-call-child-process-module-name
