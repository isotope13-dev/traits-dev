defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-send-call
    desc: Ruby dynamically invokes a method with send
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: send

  - id: ruby-public-send-call
    desc: Ruby public_send method dispatch
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: public_send

  - id: ruby-const-get
    desc: Ruby dynamically resolves a constant
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: const_get

  - id: ruby-const-set
    desc: Ruby dynamically defines a constant
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: const_set

  # `alias_method` rebinds an existing method under a new name. Rails and most
  # non-trivial Ruby lean on it constantly, so it is a reflection capability
  # here rather than in the Rack-backdoor objective it used to sit under: that
  # placement made every stock ActiveSupport file report a webshell-intercept
  # building block. The interception intent comes from the composite's other
  # legs (cookie read + base64 + eval).
  - id: ruby-alias-method
    desc: Ruby rebinds a method with alias_method
    crit: notable
    conf: 0.7
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: alias_method

  - id: ruby-hash-send-key
    desc: Ruby hash contains send key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']send["'']\s*=>'

  - id: ruby-hash-public-send-key
    desc: Ruby hash contains public_send key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']public_send["'']\s*=>'

  - id: ruby-hash-eval-key
    desc: Ruby hash contains eval key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']eval["'']\s*=>'
