defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-send-call
    desc: Ruby dynamically invokes a method with send
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: send

  - id: ruby-public-send-call
    desc: Ruby public_send method dispatch
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: public_send

  - id: ruby-hash-send-key
    desc: Ruby hash contains send key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']send["'']\s*=>'

  - id: ruby-hash-public-send-key
    desc: Ruby hash contains public_send key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']public_send["'']\s*=>'

  - id: ruby-hash-eval-key
    desc: Ruby hash contains eval key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']eval["'']\s*=>'
