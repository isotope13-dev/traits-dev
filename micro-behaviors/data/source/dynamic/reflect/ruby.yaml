defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-send-call
    desc: Ruby dynamically invokes a method with send
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: send

  - id: ruby-public-send-call
    desc: Ruby public_send method dispatch
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: public_send
