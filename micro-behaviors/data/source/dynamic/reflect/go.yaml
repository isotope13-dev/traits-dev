defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: go-reflect-heavy
    desc: Repeated Go reflection API usage
    crit: notable
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '\breflect\.'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-test-helper-file
composite_rules:
  - id: go-reflect-unsafe-combo
    desc: Go reflection with unsafe pointer conversion
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/data/source/unsafe::go-unsafe-package-import
      - id: go-reflect-heavy
      - id: micro-behaviors/data/source/unsafe::go-unsafe-pointer-conversion
