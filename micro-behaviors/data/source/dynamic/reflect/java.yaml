defaults:
  platforms: [unix, windows]
  for: [java, class, java_class, jar, zip]
traits:
  - id: jvm-reflect-class-ref
    desc: JVM reflection class reference
    crit: baseline
    conf: 0.88
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/lang/reflect(/|$)'
  - id: jvm-classloader-class-ref
    desc: JVM ClassLoader class reference
    crit: baseline
    conf: 0.88
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/ClassLoader
  - id: java-urlclassloader-bytecode
    desc: JVM URLClassLoader class reference
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/net/URLClassLoader
  - id: java-defineclass
    for: [class, java_class]
    desc: Java defineClass class definition
    crit: notable
    conf: 0.88
    if:
      type: value
      path: class.strings[*]
      exact: defineClass

  # Source-form defineClass for JVM source and JSP/servlet implants. Generic
  # JavaScript libraries also use defineClass for CSS and parser definitions.
  - id: java-defineclass-source
    desc: Java defineClass call in source
    crit: notable
    conf: 0.9
    for: [jsp, java, kotlin, groovy, scala, html]
    if:
      type: text
      regex: '\.defineClass\s*\('

  - id: java-reflective-defineclass-source
    desc: Reflectively resolves ClassLoader.defineClass
    crit: notable
    conf: 0.92
    for: [java]
    if:
      type: text
      regex: 'getDeclaredMethod\s*\(\s*"defineClass"'

  - id: java-class-forname
    desc: Java Class.forName reference
    crit: notable
    for: [jsp, java, class, java_class, html]
    if:
      type: text
      substr: Class.forName

  - id: java-class-forname-bytecode
    desc: JVM Class.forName invocation
    crit: notable
    for: [class, java_class]
    if:
      type: import
      exact: java/lang/Class.forName

  - id: java-classloader
    desc: Java source ClassLoader reference
    crit: notable
    for: [jsp, java]
    if:
      type: text
      substr: ClassLoader
    unless:
      - type: basename
        regex: \.sig$

  - id: java-context-classloader-setter
    desc: Java context ClassLoader setter
    crit: notable
    conf: 0.92
    for: [java, class, java_class]
    if:
      type: text
      substr: setContextClassLoader

  - id: java-set-accessible
    desc: Java reflection accessibility override
    crit: notable
    conf: 0.86
    for: [java, class]
    if:
      type: symbol
      kind: call
      exact: setAccessible
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # Constant-pool form of the call above: some class files reference
  # setAccessible only in the constant pool without an emitted call record.
  - id: java-set-accessible-string
    desc: Java reflection accessibility override string
    crit: notable
    conf: 0.84
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      substr: setAccessible
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # A bare `.invoke()` call is not enough to identify Java reflection: Clojure
  # IFn, callbacks, and ordinary application interfaces use the same method
  # name. Keep the source-side evidence tied to a declared java.lang.reflect
  # Method variable; bytecode uses java-method-invoke-bytecode below.
  - id: java-method-invoke
    desc: Java reflection Method variable invoke call
    crit: notable
    conf: 0.92
    for: [jsp, java, html]
    if:
      type: text
      regex: '(?s)\bMethod\s+\w+\s*(=|;)[\s\S]{0,300}\.\s*invoke\s*\('

  - id: java-loadclass
    desc: Java loadClass reference
    crit: notable
    for: [java, class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: loadClass

  - id: java-newinstance
    desc: Java newInstance reference
    crit: notable
    for: [jsp, java, html]
    if:
      type: text
      substr: newInstance

  - id: java-constructor-newinstance-bytecode
    desc: JVM reflective constructor invocation
    crit: notable
    for: [class, java_class]
    if:
      type: import
      exact: java/lang/reflect/Constructor.newInstance

  - id: java-method-invoke-bytecode
    desc: JVM reflective method invocation
    crit: notable
    for: [class, java_class]
    if:
      type: import
      exact: java/lang/reflect/Method.invoke

  - id: java-class-getmethod-bytecode
    desc: JVM reflective method lookup
    crit: notable
    for: [class, java_class]
    if:
      type: import
      exact: java/lang/Class.getMethod

  - id: java-getdeclaredconstructor
    desc: Java reflective constructor lookup
    crit: notable
    conf: 0.9
    for: [java, class, java_class]
    if:
      type: import
      exact: java/lang/Class.getDeclaredConstructor

  - id: java-get-system-classloader
    desc: Java getSystemClassLoader call
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: getSystemClassLoader

  - id: java-findclass
    desc: Java class loader findClass reference
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: findClass

  - id: jvm-reflect-method-class-ref
    desc: JVM java.lang.reflect.Method class reference
    crit: baseline
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/reflect/Method

  - id: java-class-getconstructor-bytecode
    desc: JVM reflective constructor lookup
    crit: notable
    for: [class, java_class]
    if:
      type: import
      exact: java/lang/Class.getConstructor

  # Relocated from objectives/anti-static/obfuscation/reflection/class (dalvik-*).
  - id: jvm-reflect-method-descriptor
    desc: JVM reflect.Method type descriptor
    crit: notable
    for: [class]
    if:
      type: text
      substr: "Ljava/lang/reflect/Method;"
    unless:
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class

  - id: jvm-reflect-field-descriptor
    desc: JVM reflect.Field type descriptor
    crit: notable
    for: [class]
    if:
      type: text
      substr: "Ljava/lang/reflect/Field;"

  - id: jvm-reflect-constructor-descriptor
    desc: JVM reflect.Constructor type descriptor
    crit: notable
    for: [class]
    if:
      type: text
      substr: "Ljava/lang/reflect/Constructor;"

  - id: jvm-get-declared-method
    desc: JVM getDeclaredMethod reflection
    crit: notable
    for: [class]
    if:
      type: text
      word: "getDeclaredMethod"

  - id: jvm-get-declared-field
    desc: JVM getDeclaredField reflection
    crit: notable
    for: [class]
    if:
      type: text
      word: "getDeclaredField"
  # A class that defines its own invokedynamic bootstrap taking one extra
  # String: `(Lookup, String, MethodType, String) -> CallSite`. javac never
  # emits this shape (string concat carries `[Object`, lambdas carry
  # MethodType/MethodHandle), so it is either a language runtime linking its
  # own call sites (JRuby has three) or a string-concealment obfuscator that
  # resolves every literal through `invokedynamic ()String` with the encrypted
  # text as the static argument -- every obfuscated class of a JNA HVNC jar
  # (2026-09) did the latter.
  - id: jvm-custom-string-indy-bootstrap
    desc: Class defines a string-argument indy bootstrap
    crit: notable
    conf: 0.85
    for: [class, java_class]
    if:
      type: text
      exact: '(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/String;)Ljava/lang/invoke/CallSite;'
  - id: java-get-declared-field-call
    desc: Java getDeclaredField reflection call
    for: [java]
    crit: notable
    conf: 0.9
    mbc: "F0006"
    if:
      type: symbol
      kind: call
      exact: getDeclaredField
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
composite_rules:
  # URLClassLoader plus reflective invocation is a dynamic-loading capability.
  # Source and bytecode facts are mutually exclusive on a file node, so a
  # two-of-four requirement pairs the corresponding forms without a mixed hit.
  # The combination alone does not identify a dropper.
  - id: java-urlclassloader-reflective-invoke
    desc: Java URLClassLoader invokes reflectively
    crit: notable
    conf: 0.92
    for: [java, class, java_class]
    needs: 2
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-urlclassloader-api
      - id: java-urlclassloader-bytecode
      - id: java-method-invoke
      - id: java-method-invoke-bytecode

  - id: context-classloader-handoff
    desc: Thread context classloader activation
    crit: notable
    conf: 0.92
    for: [class]
    unless:
      - id: well-known/lib/runtime/scripted/jruby::package-path
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
      - id: well-known/lib/ui/jline/
      - id: well-known/lib/development/scala-compiler
      - id: metadata/build/bundler/vscode::vscode-language-server-library
    all:
      - id: micro-behaviors/process/thread/lifecycle::java-current-thread-reference
      - id: java-context-classloader-setter
      - id: java-urlclassloader-bytecode
      - id: java-getdeclaredconstructor
      - id: java-method-invoke-bytecode
    any:
      - id: java-defineclass
      - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
      - id: java-class-forname-bytecode

  - id: dynamic-bytecode-loader
    desc: ClassLoader combines defineClass and resource streams
    crit: notable
    conf: 0.93
    for: [class, java_class]
    unless:
      - id: well-known/lib/runtime/scripted/jruby::package-path
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
      - id: well-known/lib/runtime/managed/openjdk::source-archive-path
      - id: metadata/build/bundler/vscode::vscode-language-server-library
      - id: well-known/lib/development/lombok/
      - id: well-known/tool/development/vscode-extension/redhat-java/
      - id: well-known/lib/development/apache-ant::package-path
    all:
      - id: jvm-classloader-class-ref
      - id: java-defineclass
      - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream

  - id: system-classloader-bytearray-streams
    desc: System ClassLoader with byte-array streams
    crit: notable
    conf: 0.96
    for: [class, java_class]
    unless:
      - id: well-known/lib/runtime/scripted/jruby::package-path
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
      - id: well-known/lib/runtime/managed/openjdk::source-archive-path
      - id: metadata/build/bundler/vscode::vscode-language-server-library
      - id: well-known/lib/development/lombok/
      - id: well-known/tool/development/vscode-extension/redhat-java/
      - id: well-known/lib/development/apache-ant::package-path
    all:
      - id: dynamic-bytecode-loader
      - id: java-get-system-classloader
      - id: micro-behaviors/data/buffer/transfer::bytearrayinputstream-ref

  - id: java-bytecode-reflective-method-invoke
    desc: JVM resolves and invokes method reflectively
    crit: notable
    conf: 0.94
    platforms: [unix, windows, android]
    for: [class, java_class, jar, zip, apk]
    all:
      - id: java-class-forname-bytecode
      - id: java-class-getmethod-bytecode
      - id: java-method-invoke-bytecode
    unless:
      - id: well-known/lib/development/google-closure-compiler/
      - id: well-known/lib/development/args4j
      - id: well-known/lib/runtime/scripted/mozilla-rhino
      - id: well-known/lib/format/google-protobuf-java::generated-message-lite-class

  - id: java-bytecode-reflective-constructor-invoke
    desc: JVM resolves and invokes constructor reflectively
    crit: notable
    conf: 0.94
    platforms: [unix, windows, android]
    for: [class, java_class, jar, zip, apk]
    all:
      - id: java-class-forname-bytecode
      - id: java-class-getconstructor-bytecode
      - id: java-constructor-newinstance-bytecode
    unless:
      - id: well-known/lib/development/google-closure-compiler/
      - id: well-known/lib/development/args4j
      - id: well-known/lib/runtime/scripted/mozilla-rhino
      - id: well-known/lib/format/google-protobuf-java::generated-message-lite-class

  - id: java-defineclass-any
    desc: Java source or bytecode defineClass load
    crit: notable
    conf: 0.9
    for: [jsp, java, class, java_class]
    any:
      - id: java-defineclass
      - id: java-defineclass-source
      - id: java-reflective-defineclass-source
      - id: micro-behaviors/data/embedded/classfile::runtime-define-class

  - id: java-reflection
    desc: Java dynamically loads classes
    crit: notable
    conf: 0.85
    for: [jsp, java, class, java_class]
    needs: 2
    any:
      - id: java-class-forname
      - id: java-classloader
      - id: java-defineclass
      - id: java-loadclass
      - id: java-newinstance
    unless:
      - id: metadata/package/testing/presence/platform_suites::java-test-directory
      - id: metadata/package/testing/presence/platform_suites::java-generic-test-directory
      - id: metadata/package/testing/presence/platform_suites::java-test-filename
