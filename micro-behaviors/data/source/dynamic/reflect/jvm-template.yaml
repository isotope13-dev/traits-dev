defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.95

traits:
  - id: jvm-template-classloader-bytearray-method
    desc: Template resolves ClassLoader byte-array method
    if:
      type: value
      path: class.strings[*]
      regex: 'ClassLoader\.class\.getDeclaredMethod[\s\S]{0,240}byte\[\]\.class'

  - id: jvm-template-parameter-classloader-invoke
    desc: Template parameter precedes ClassLoader invoke
    if:
      type: value
      path: class.strings[*]
      regex: '(?s)getParameter\(.{0,1200}ClassLoader\.class.{0,500}\.invoke\('
