# Dense emoji in parsed literals is a source-data characteristic. It becomes
# obfuscation only when a higher-level rule adds decoding or execution intent;
# comments and generated warning banners are deliberately outside this atom.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]

traits:
  - id: emoji-saturated-string-literals
    desc: Dense emoji content in source string literals
    crit: notable
    conf: 0.96
    count_min: 20
    per_kb_min: 8.0
    if:
      type: literal
      kind: string
      regex: '[\x{2600}-\x{27BF}\x{1F000}-\x{1FAFF}]'
    unless:
      - type: path
        regex: '(^|[\\/])node_modules[\\/]emojis-list[\\/]index\.js(?:$|[!#])'
      - type: path
        regex: '(^|[\\/])node_modules[\\/]prettier[\\/](standalone\.js|esm[\\/]standalone\.mjs)(?:$|[!#])'
      - id: metadata/file/string/charset::emoji-library-table-text
      - id: metadata/file/invisible-unicode::emoji-logger-icons-text
      - id: metadata/file/invisible-unicode::warning-emoji-log-text
      - id: metadata/file/invisible-unicode::node-emoji-package-text
      - id: metadata/package/documentation/
