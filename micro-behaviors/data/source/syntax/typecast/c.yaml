# C casts to a function-pointer type. `((void(*)())buf)()` enters a buffer,
# but the same cast is how C API tables (numpy's import arrays) are typed.
traits:
- id: c-noarg-function-pointer-cast
  desc: Casts to a no-argument function pointer
  platforms: [windows]
  crit: notable
  conf: 0.85
  for: [c, cpp]
  if:
    type: text
    regex: '\(\s*(void|int|BOOL)\s*\(\s*(__\w+\s*)?\*\s*\)\s*\(\s*(void)?\s*\)\s*\)'
