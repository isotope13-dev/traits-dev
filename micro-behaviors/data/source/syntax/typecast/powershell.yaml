defaults:
  platforms: [windows]
  for: [powershell]
  crit: component
  conf: 0.8

traits:
  - id: powershell-system-io-file-type-cast
    desc: PowerShell System.IO.File type cast
    if:
      type: text
      regex: '(?is)["'']System\.IO\.File["'']\s*-as\s*\[type\]'

  - id: char-array-cast
    crit: notable
    desc: PowerShell char array cast
    if:
      type: text
      regex: '(?i)\[char\[\]\]'
    unless:
