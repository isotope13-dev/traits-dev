# Dockerfile instruction keywords named outside a Dockerfile (e.g. a script
# that parses Dockerfiles). Kept out of metadata/build/ on purpose: several
# objective rules carry `unless: metadata/build/`, and a keyword seen in a
# JavaScript file is not build metadata.
defaults:
  platforms: [unix, windows]
traits:
- id: dockerfile-workdir-keyword
  desc: Mentions the Dockerfile WORKDIR instruction
  for: [javascript, package.json]
  crit: notable
  conf: 0.94
  unless:
  - id: metadata/build/docker::dockerfile-name-reference
  if:
    type: text
    word: WORKDIR
