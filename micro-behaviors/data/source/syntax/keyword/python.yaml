defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: function-command-parameter
    desc: Python function accepts a command parameter
    # component, not notable (2026-07): the matcher reads a *parameter name* off
    # a `def` line and nothing else -- no call, no shell, no execution. Every
    # argparse/Click wrapper, subprocess helper, task runner and test fixture
    # that writes `def run(cmd, ...)` collected a notable whose wording reads
    # like execution evidence, and no composite has ever referenced this atom,
    # so the notable stood alone with nothing to qualify it. An identifier name
    # does not establish a behaviour: that is the standalone-description test,
    # and the sibling `token-parameter-declaration` below -- the same `def`
    # signature shape for `token` -- is already filed at component for it.
    # Execution itself is reported by process/create/subprocess:: atoms.
    crit: component
    conf: 0.8
    if:
      type: text
      # Match a declared handler parameter, not ordinary local assignments
      # such as `cmd = ...` in administrative or restore code.
      regex: '(?m)^\s*(async\s+)?def\s+[A-Za-z_]\w*\s*\([^)]{0,200}\b(cmd|command)\b[^)]{0,200}\)'

  - id: token-parameter-declaration
    desc: Python token parameter declaration
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'def\s+\w+\s*\(\s*self\s*,\s*token\b'

  - id: token-tuple-argument
    desc: Python token tuple argument
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'args\s*=\s*\(\s*token\s*,\s*\)'

  # Source-syntax capability: the code uses the bitwise XOR operator. Surfaced
  # as `notable` (a capability observed), not `suspicious` — a lone `^` also
  # appears in benign code (hashing, bit flags, checksums, permission masks), so
  # it signals capability, not intent. Real XOR encode/decode transforms
  # (byte-range genexprs, cyclic-key loops) live in micro-behaviors/data/encode/xor/.
  - id: py-keyword-xor
    desc: Python bitwise XOR operator
    crit: notable
    conf: 0.6
    if:
      # ast.op.xor density metric, counted inline in the single AST walk.
      type: metrics
      field: 'ast.op.xor'
      min: 1
    unless:
      # PFB font programs are sometimes heuristically parsed as Python and
      # expose arbitrary XOR-shaped AST nodes; they are not Python source.
      - type: path
        basename: true
        regex: '(?i)\.pfb$'
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      # Jennifer (.j) is heuristically typed as Python; `xor` is a language keyword.
      - id: well-known/app/jennifer::recognized-source
