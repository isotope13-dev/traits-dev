# `asmlinkage` is a Linux kernel calling-convention qualifier. It is common
# in ordinary in-tree syscall and architecture code as well as in out-of-tree
# modules, so the keyword alone is a source-syntax observation rather than a
# kernel-hide objective.
defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: baseline
  conf: 0.99

traits:
  - id: linux-asmlinkage-qualifier
    desc: Linux kernel asmlinkage qualifier
    if:
      type: text
      word: asmlinkage
