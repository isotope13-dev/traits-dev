# Method-name literals alone do not establish a call or a decoder.
defaults:
  platforms: [unix, windows]
  for: [javascript, shell]
  crit: component
  conf: 0.6
traits:
  - id: push-string-literal
    desc: String literal names the push method
    if:
      type: literal
      exact: push
  - id: shift-string-literal
    desc: String literal names the shift method
    if:
      type: literal
      exact: shift
