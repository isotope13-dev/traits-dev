defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.88

traits:
  - id: python-repeated-zero-bytes
    desc: Repeats zero bytes in Python
    for: [python]
    if:
      type: text
      regex: 'b["'']\\x00["'']\s*\*\s*(64|[1-9]\d{2,3})\b'

  - id: zero-filled-byte-constructor
    desc: Constructs a zero-filled byte array
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '\b(bytes|bytearray|Buffer\.alloc)\s*\(\s*(64|[1-9]\d{2,3})\s*\)'

  - id: rust-zero-filled-vector
    desc: Constructs a zero-filled Rust vector
    for: [rust]
    if:
      type: text
      regex: 'vec!\s*\[\s*0(u8)?\s*;\s*(64|[1-9]\d{2,3})\s*\]'
