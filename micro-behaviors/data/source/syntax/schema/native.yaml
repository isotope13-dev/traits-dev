# Host-profile record keys as they survive in a native Windows binary: either
# the bare key constant a JSON library serializes, or a quoted `"key":` spelling
# in a format string. A key name says nothing about what is collected or where
# it goes; the host-profile schema composite in objectives/discovery pairs all
# three.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
  - id: ram-total-field-key
    desc: Binary declares a ram_total field key
    if:
      type: text
      word: ram_total

  # `computer` is an English word: python311.dll's winreg docstrings ("the
  # remote computer") and every .NET framework assembly carry it in prose, so
  # a bare word match described documentation as a host-identity field. Only
  # the whole-string key constant or a quoted JSON key is a field name.
  - id: computer-field-key
    desc: Binary declares a computer field key
    if:
      type: text
      regex: '^computer$|["'']computer["'']\s*:'

  - id: screen-w-field-key
    desc: Binary declares a screen_w field key
    if:
      type: text
      word: screen_w
