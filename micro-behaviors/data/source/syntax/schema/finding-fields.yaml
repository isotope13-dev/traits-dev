# Named fields on a finding or report record. The field alone does not say
# the program is a scanner; composites that want that context bind it to
# a scanner purpose phrase and probe payloads.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: finding-remediation-field
    desc: Assigns a remediation field
    for: [python]
    if:
      type: text
      regex: '(?i)\bremediation\s*[:=]'
