# Named fields on a finding or report record. The field alone does not say
# the program is a scanner; composites that want that context bind it to
# a scanner purpose phrase and probe payloads.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  # Assignment or quoted-key form only. A bare `remediation:` also matches
  # narrative prose ("execute the remediation: 1. ..."), which assigns no
  # field; quoted keys and `=` assignments are the field evidence.
  - id: finding-remediation-field
    desc: Assigns a remediation field
    for: [python]
    if:
      type: text
      regex: '(?i)([''"]remediation[''"]\s*:|\bremediation\s*=)'
