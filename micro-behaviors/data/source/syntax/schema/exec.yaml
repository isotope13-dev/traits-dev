defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-exec-mapping-field
    desc: Defines an exec configuration mapping
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      query: |
        (pair key: (string) @key value: (dictionary)
          (#match? @key "^[\"']exec[\"']$"))
