# Individual object/JSON request fields, as source-level shapes. A field name
# and value alone prove nothing about which API is being called; composites
# that care must bind the field to the request that carries it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

traits:
  # `{ private: false }` is the GitHub create-repo body's visibility field, but
  # by itself it is just an object field. TypeScript's decorator metadata emit
  # writes the identical shape for every decorated class member
  # (`{ kind: "accessor", name: "x", static: false, private: false, ... }`),
  # which is why this is a component: the create-repo meaning comes from the
  # API call it sits next to, not from the field.
  - id: private-false-object-field
    desc: Object field sets private to false
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\bprivate\s*:\s*false\b'
