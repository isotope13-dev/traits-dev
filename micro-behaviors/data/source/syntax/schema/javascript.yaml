defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A lone schema key is incomplete evidence: it says nothing about telemetry
  # until a consuming composite supplies extension or analytics context.
  - id: js-bare-event-field
    desc: Object schema has a bare event field
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?m)^\s*event\s*[,}:]'

  # Bare `key_type` appears in compilers, maps, crypto SDKs (matrix-js-sdk's
  # key backup in Element) and APIs. The wallet-phishing composite in
  # objectives/credential-access/wallet/mnemonic/ supplies wallet brands and
  # key dispatch.
  - id: key-type-field-name
    desc: key_type field name
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      word: key_type

  - id: js-bare-installation-id-field
    desc: Object schema has an installationId field
    crit: component
    conf: 0.8
    if:
      type: text
      word: installationId

  # Schema field names alone do not prove that a program reads or sends host
  # information.  Keep this as a neutral source-level observation; exfiltration
  # objectives must supply collection and transport evidence separately.
  - id: host-system-metric-schema
    desc: 'Host recon fields: hostname, platform, arch'
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'hostname[\s\S]{0,300}(platform|kernel|uname)[\s\S]{0,300}(arch|network)'
  - id: user-identity-field-assignment
    desc: Assigns a user identity property
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(this|[A-Za-z_$][\w$]*)\.user(Name|Email|Meta)\s*='
  # One key alone is a generic field name; the observation is an object literal
  # that carries BOTH, which is the host-identity payload a beacon sends.
  # `[{,]` keeps each key in object-key position: the previous unanchored
  # `\b(hostname|username)\s*:` with count_min 2 also counted the else-branch
  # of `window.location.hostname : "localhost"` and the `hostname: ""` field of
  # a DOM Location shim, then described two `hostname` hits as "multiple host
  # identity fields".
  - id: hostname-object-key
    desc: Object literal declares a hostname key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*["'']?hostname["'']?\s*:'
  - id: hardware-object-key
    desc: Object literal declares a hardware key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*hardware\s*:'
  - id: macs-object-key
    desc: Object literal declares a macs key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*macs\s*:'
  # user/path/domain keys, relocated from objectives/discovery/system/profile
  # where they were named "host profile" fields. A lone key is a generic field
  # name; the host-profile record composite there needs four distinct keys.
  - id: user-object-key
    desc: Object literal declares a user key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*["'']?user["'']?\s*:'
  - id: path-object-key
    desc: Object literal declares a path key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*["'']?path["'']?\s*:'
  - id: domain-object-key
    desc: Object literal declares a quoted domain key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']domain["'']\s*:'

composite_rules:
  - id: host-identity-field-pair
    desc: Object literal pairs hostname and username keys
    crit: notable
    conf: 0.88
    all:
      - id: hostname-object-key
      - id: micro-behaviors/data/serialize/schema-object::username-object-key
    near_bytes: 500
  - id: hardware-macs-field-pair
    desc: Object literal pairs hardware and MAC keys
    crit: notable
    conf: 0.92
    all:
      - id: hardware-object-key
      - id: macs-object-key
    near_bytes: 500
