# Neutral source-syntax capability: bitwise XOR is useful for checksums,
# flags, arithmetic, and cryptographic implementations. Intent comes from
# surrounding data-flow or encoding behavior, not from the operator alone.
defaults:
  platforms: [windows, unix]
  for: [source, python]

traits:
  - id: bitwise-xor-operator
    desc: Source uses bitwise XOR operator
    crit: notable
    conf: 0.6
    if:
      type: metrics
      field: ast.op.xor
      min: 1
