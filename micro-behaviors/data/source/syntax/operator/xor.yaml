# Neutral source-syntax capability: bitwise XOR is useful for checksums,
# flags, arithmetic, and cryptographic implementations. Intent comes from
# surrounding data-flow or encoding behavior, not from the operator alone.
defaults:
  platforms: [windows, unix]
  # Elixir's pin operator (`^name`) is reported by the parser through the
  # same AST counter as XOR.  Keep this syntax rule on languages where that
  # metric denotes bitwise XOR until the parser exposes a distinct Elixir
  # operator metric.
  for: [source, python, -elixir]

traits:
  - id: bitwise-xor-operator
    desc: Uses bitwise XOR syntax
    # A single XOR operator is ordinary arithmetic syntax. More specific
    # crypto/decoder rules provide analyst-useful signal when XOR has purpose.
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: ast.op.xor
      min: 1
    unless:
      - id: metadata/file/extension/identity::sorbet-stub-extension
      # Mercury field update `Term ^ field = Value` is parsed as XOR when the
      # `.m` file is misclassified as Objective-C.
      - id: metadata/lang/compiler/systems::mercury-source
