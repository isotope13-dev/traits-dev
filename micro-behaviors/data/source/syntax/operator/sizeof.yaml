# sizeof over a 32-bit integer (or a `pattern` buffer). A fragment for the
# undersized USB SETUP packet composite in objectives/execution/exploit/usb-control.
traits:
- id: sizeof-uint32-or-pattern
  desc: sizeof(uint32_t) or sizeof(pattern)
  for: [source]
  platforms: [ios, macos, appliance]
  crit: component
  conf: 0.94
  if:
    type: text
    regex: 'sizeof\s*\(\s*(u?int32_t|pattern)\s*\)'
