defaults:
  platforms: [windows]
  for: [csharp]
  crit: baseline
  conf: 0.88

traits:
  - id: compound-xor-assignment
    desc: C# compound XOR assignment
    if:
      type: tree-sitter
      kind: assignment_expression
      regex: '\b[A-Za-z_]\w*\s*\^=\s*[A-Za-z_]\w*\s*;'

  - id: compound-subtract-assignment
    desc: C# compound subtraction assignment
    if:
      type: tree-sitter
      kind: assignment_expression
      regex: '\b[A-Za-z_]\w*\s*-=\s*[A-Za-z_]\w*\s*;'
