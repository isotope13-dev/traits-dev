defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, vbs]
  crit: baseline
  conf: 0.7
traits:
  - id: variable-function-expression-cluster
    desc: Many variables receive function expressions
    crit: notable
    conf: 0.85
    count_min: 15
    if:
      type: text
      regex: 'var\s+\w+\s*=\s*function\s*\([^)]{0,120}\)\s*\{|var\s+\w+\s*=\s*\(\s*\)\s*=>'
  - id: indexed-call-assignment
    desc: Indexed call assignment target
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\[[^\]\r\n]{1,40}\]\s*\)\s*='
  - id: nested-call-assignment
    desc: Nested function call assignment target
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\([^)]{1,160}\)\s*\)\s*='
