defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, vbs]
  crit: baseline
  conf: 0.7
traits:
  - id: variable-function-expression
    desc: Variable receives a function expression
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: 'var\s+\w+\s*=\s*function\s*\([^)]{0,120}\)\s*\{|var\s+\w+\s*=\s*\(\s*\)\s*=>'
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      # TypeScript/tsc CJS interop helpers emitted beside `var fn = function`.
      - type: text
        substr: '__importStar'
      - type: text
        substr: '__createBinding'
      - type: text
        substr: '__setModuleDefault'
      # VS Code extensions often vendor JS libraries under vendor/.
      - type: path
        regex: '/vendor/'
  - id: indexed-call-assignment
    desc: Indexed call assignment target
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\[[^\]\r\n]{1,40}\]\s*\)\s*='
  - id: nested-call-assignment
    desc: Nested function call assignment target
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\([^)]{1,160}\)\s*\)\s*='
