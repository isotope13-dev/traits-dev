defaults:
  platforms: [windows, unix]
  for: [c, cpp, text]

traits:
  - id: buffer-or-filter-variable-assignment
    desc: Assigns buffer or filter-like variable
    crit: component
    conf: 0.85
    # This is only a neutral source-syntax fragment. Objective composites add
    # the operation-specific evidence needed to infer caller-filter tampering.
    if:
      type: text
      regex: '(?m)^[ \t]*((cmd)?buf|filter|expr|prog)[ \t]*=[^;\n]{1,60};'
