defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: shell-set-positional-params
    desc: Shell resets positional parameters with set --
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(^|[;&\n])\s*set\s+--\s'
    # IFS reassigned to a non-whitespace delimiter to word-split a packed string
    # into an argv ("a,b,c" + IFS=, then unquoted $var). `IFS= read` (set to
    # empty/space) is the common benign idiom and is excluded by the class.

  # The configuration-knob idiom: the command tool is held in an UPPERCASE
  # variable that is either assigned an absolute path
  # (`ISCSIADM="/usr/sbin/iscsiadm"`), given a caller-overridable default
  # (`: ${DIFF:=diff}`), or assigned from a positional parameter (`SED=$1`),
  # then invoked. The command word is configuration, not a name hidden from
  # `ps` or string search — distro wrappers (rpm gendiff, dracut udev helpers,
  # tool wrappers) are built this way. Cryptic lowercase placeholders
  # (`${b:-bun}`) stay out.
  - id: sh-upper-knob-command-variable
    desc: Uppercase knob holds tool path or default
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)(:[ \t]*\$\{[A-Z][A-Z0-9_]{0,39}:=|^[A-Z_][A-Z0-9_]{0,39}=["'']?(/|\$\{?[0-9]))'
