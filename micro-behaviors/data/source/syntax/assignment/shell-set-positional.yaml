defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: shell-set-positional-params
    desc: Shell resets positional parameters with set --
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(^|[;&\n])\s*set\s+--\s'
    # IFS reassigned to a non-whitespace delimiter to word-split a packed string
    # into an argv ("a,b,c" + IFS=, then unquoted $var). `IFS= read` (set to
    # empty/space) is the common benign idiom and is excluded by the class.

  # ClusterFuzz and autotools invoke the compiler from the environment
  # (`$CXX $CXXFLAGS`) without assigning it in the script.
  - id: sh-compiler-flags-invocation
    desc: Compiler variable invoked with FLAGS
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*\$\{?(CC|CXX|CPP|FC|LD|AR|AS|NM)\}?[ \t]+\$\{?\w*FLAGS\b'
composite_rules:
  - id: sh-upper-knob-command-variable
    desc: Uppercase knob holds tool path or default
    crit: component
    conf: 0.9
    all:
      - id: metadata/lang/shebang::shell-script
    any:
      - id: metadata/lang/source/syntax/assignment::shell-uppercase-path-assignment
      - id: metadata/lang/source/syntax/assignment::shell-uppercase-parameter-default
      - id: sh-compiler-flags-invocation
    needs: 1
