traits:
  - id: python-secret-literal-assignment
    # A bare `KEY` substring is the most common suffix in Python constant
    # tables (dict keys, widget keys, event keys, cache keys), so require the
    # identifier to name a secret or a cipher key rather than any key at all.
    desc: Python secret or key assigned a literal
    platforms: [unix, windows]
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '(?im)^\w*(SECRET|PASSPHRASE|PASSW|(API|ENC|CRYPT|XOR)_?KEY)\w*\s*=\s*["''][^"'']{6,80}["'']'
