defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: aws-shared-access-key-field
  desc: AWS shared credentials access key field
  crit: notable
  conf: 0.95
  if:
    type: text
    word: aws_access_key_id
- id: aws-shared-secret-key-field
  desc: AWS shared credentials secret key field
  crit: notable
  conf: 0.95
  if:
    type: text
    word: aws_secret_access_key
composite_rules:
- id: python-shared-credentials-configuration
  desc: Python AWS shared credential configuration
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: aws-shared-access-key-field
  - id: aws-shared-secret-key-field
