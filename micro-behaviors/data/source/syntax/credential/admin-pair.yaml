# An auth parameter set to the literal pair admin/admin. This is a source
# fact (demo accounts, test doubles, and device scripts all use it). Fleet
# adoption abuse is decided by the objective that requires it.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, c, cpp, java]
  crit: notable
  conf: 0.92

traits:
  - id: admin-admin-auth-pair
    desc: Auth parameter set to the admin/admin pair
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(auth|default_auth)\s*=\s*[(\[]\s*["'']admin["'']\s*,\s*["'']admin'
    unless:
      - id: well-known/tool/offensive/exploitdb::published-script-wrapper
