# Source naming and literal assignment are neutral observations.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.85
traits:
  - id: cfml-password-literal-assignment
    desc: CFML assigns a password-named string
    if:
      type: symbol
      kind: bind
      regex: '(?i)^(\w*(password|passwd|passphrase|pwd)(_\w+)*|(\w+_)*pass(_\w+)*)$'
      arg:
        kind: string
