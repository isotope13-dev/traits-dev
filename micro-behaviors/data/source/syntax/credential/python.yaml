defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.9

# Variable names describe the data handled by source code, not why it handles
# it. Attack objectives must combine these with collection or cracking APIs.
traits:
  - id: kerberos-tgs-hash-identifier
    desc: Kerberos TGS hash identifier
    crit: notable
    if:
      type: text
      regex: '(?i)\btgs[_ -]?hash\b'

  - id: kerberos-asrep-hash-identifier
    desc: Kerberos AS-REP hash identifier
    crit: notable
    if:
      type: text
      regex: '(?i)\bas[_ -]?rep[_ -]?hash\b'

  # Relocated from objectives/credential-access/cloud/token/files. Both are
  # source mechanics over a variable named `token`: tokenizers, parsers and
  # auth clients all do this. Harvest intent comes from the composite legs.
  - id: python-token-variable-set-add
    desc: Python adds token variable to a set
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\.add\s*\(\s*token\s*\)'

  - id: python-token-variable-print
    desc: Python prints a token variable
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bprint\s*\(\s*token\s*\)'

  # Relocated from objectives/credential-access/cloud/session. Function names
  # only: pydantic's SecretStr defines _get_secret_value, and any secrets
  # client may define these helpers.
  - id: python-get-secret-value-symbol
    desc: Python _get_secret_value function symbol
    crit: notable
    conf: 0.86
    if:
      type: symbol
      exact: _get_secret_value

  - id: python-list-secrets-symbol
    desc: Python _list_secrets function symbol
    crit: notable
    conf: 0.86
    if:
      type: symbol
      regex: '^_(list_secret_names|list_secrets)$'

  # Relocated from objectives/credential-access/api-harvest/token
  # (credential-regex-map-binding). A variable naming secret/token/credential
  # regex patterns (SECRET_PATTERNS, GIT_CREDENTIAL_REGEX). The keyword must
  # be its own underscore segment so PRETOKENIZE_REGEX does not match.
  - id: credential-pattern-variable-name
    desc: Variable names secret or token regex patterns
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[^a-z0-9]|_)(secret|token|credential)s?_[a-z0-9_]{0,40}(pattern|regex)(e?s)?\b'

  # `password = "password"` -- a placeholder or default credential literal.
  # Common in examples and test fixtures; the SSH backdoor composite pairs it
  # with a root username default and a Paramiko server interface.
  - id: password-set-to-password-literal
    desc: Sets password to the literal "password"
    crit: notable
    if:
      type: text
      regex: "\\bpassword\\s*=\\s*['\"]password['\"]"

composite_rules:
  - id: kerberos-roast-hash-identifier
    desc: Kerberos roast hash identifier
    crit: notable
    any:
      - id: kerberos-tgs-hash-identifier
      - id: kerberos-asrep-hash-identifier
