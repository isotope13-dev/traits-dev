# C/C++ preprocessor directives that select code per target architecture.
#
# `#ifdef __x86_64__` is a compile-time portability guard, not a runtime query
# of the host: essentially every portable C header, libc, kernel header and
# language runtime carries one, so these are baseline. Composites that infer
# architecture-aware *behavior* (a loader that resolves a different shared
# object per arch, a dropper that picks a per-arch payload) reference these
# atoms and supply the intent.
defaults:
  platforms: [unix, windows]
  for: [c]
  crit: baseline
  conf: 0.8

traits:
  - id: ifdef-x86-arm-arch-guard
    desc: Preprocessor guard selects x86/ARM code
    if:
      type: text
      regex: '#ifdef\s+__(x86_64|arm|i386)__'

  - id: ifdef-aarch64-arch-guard
    desc: Preprocessor guard selects AArch64 code
    if:
      type: text
      regex: '#ifdef\s+__(aarch64)__'
