# Assigning an implementation through Constructor.prototype.method is the
# traditional JavaScript class spelling. It is neutral on its own, but it lets
# objective composites distinguish behavior hidden in a public library method
# from module-load bootstraps and explicit command-line launchers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: prototype-method-function-assignment
    desc: Assigns a JavaScript prototype method
    crit: baseline
    conf: 0.94
    if:
      type: text
      regex: '[$A-Za-z_]\w*\.prototype\.[$A-Za-z_]\w*\s*=\s*(async\s+)?function\s*\('
