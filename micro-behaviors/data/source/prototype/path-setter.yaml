# These are structural indicators, not proof that the path is untrusted or
# that the setter lacks prototype guards. Review the surrounding control flow.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: js-indexed-object-traversal
    desc: Traverses an object through a computed property
    crit: component
    if:
      type: text
      regex: '\b[$A-Za-z_][\w$]*\s*=\s*[$A-Za-z_][\w$]*\s*\[\s*[$A-Za-z_][\w$]*\s*\]'
  - id: js-indexed-object-assignment
    desc: Assigns a computed object property
    crit: component
    if:
      type: text
      regex: '\[[A-Za-z_$][A-Za-z0-9_$]*\]\s*=\s*[A-Za-z_$]'
composite_rules:
  - id: js-dot-path-traversal-and-assignment
    desc: Dot-path splitting, computed traversal and assignment co-occur
    crit: notable
    conf: 0.85
    near_lines: 24
    all:
      - id: micro-behaviors/data/string/split::js-dot-path-split
      - id: js-indexed-object-traversal
      - id: js-indexed-object-assignment
