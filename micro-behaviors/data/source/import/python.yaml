defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.75
traits:
  - id: wildcard-import-helpers
    crit: notable
    desc: Python wildcard import from helpers module
    if:
      type: text
      regex: from\s+helpers\.[a-zA-Z_]+\s+import\s+\*
  # `from pkg import fn` written *inside* a function body, with the imported
  # name called on the very next statement. The deferred spelling is ordinary
  # by itself -- CLIs and setuptools command classes defer imports to keep
  # module scope cheap -- and this says nothing about what is imported, so it
  # is a neutral capability. What it does state is that the enclosing function
  # exists to run that module's code: the import is not hoisted to module
  # scope where a reader (or a metadata-only parse of setup.py) would see it.
  - id: function-scope-import-invoked
    crit: notable
    conf: 0.85
    desc: Function-scope import called immediately
    if:
      type: text
      regex: '(?m)^[ \t]+from\s+[\w.]+\s+import\s+\w+[ \t]*\n[ \t]+\w+\s*\(\s*\)'
