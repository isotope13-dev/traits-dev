# Aliased stdlib imports (`import <module> as <name>`). Each is a complete,
# standalone observation about a sensitive module — code execution, credential
# access, encoding, or communications — reached under a local name, so each is
# `notable` on its own. The evasive-aliasing obfuscation inference (multiple
# sensitive modules aliased together) lives in
# objectives/anti-static/obfuscation/aliasing/ and references this directory;
# per TAXONOMY, composite membership does not lower an atomic's criticality.
#
# These were `component` on the premise that "aliasing an import is normal
# Python". Measured against CPython 3.14's stdlib plus four site-packages trees
# (7,016 .py files), it is not: subprocess 194 plain imports and 0 aliased,
# platform 116/0, base64 37/0, getpass 9/0, urllib 1/0. Only `os` aliases at
# all (11 of 1,102), and 10 of those are the stdlib's private-shadow idiom
# `import os as _os` (tempfile, random, threading, argparse, ctypes, curses,
# dbm.dumb, idlelib) — excluded below by matcher, not by demotion.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.6
traits:
  - id: alias-os
    desc: os imported under an alias
    if:
      type: symbol
      kind: import
      exact: 'os'
      # Skips the `import os as _os` private-shadow idiom used inside stdlib
      # modules that need `os` to outlive interpreter shutdown.
      alias: {regex: '^[^_]'}
  - id: alias-subprocess
    desc: subprocess imported under an alias
    if:
      type: symbol
      kind: import
      exact: 'subprocess'
      alias: {}
  - id: alias-platform
    desc: platform imported under an alias
    if:
      type: symbol
      kind: import
      exact: 'platform'
      alias: {}
  - id: alias-getpass
    desc: getpass imported under an alias
    if:
      type: symbol
      kind: import
      exact: 'getpass'
      alias: {}
  - id: alias-base64
    desc: base64 imported under an alias
    if:
      type: symbol
      kind: import
      exact: 'base64'
      alias: {}
  - id: alias-urllib
    desc: urllib imported under an alias
    if:
      type: symbol
      kind: import
      exact: 'urllib'
      alias: {}
