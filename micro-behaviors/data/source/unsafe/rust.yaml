# Rust ownership escape hatches — safe-to-call APIs that suppress the normal
# destructor/lifetime guarantees. Neutral mechanics only; composites elsewhere
# add the intent (a forgotten Child handle is detached-process evidence, a
# forgotten file descriptor is a leak).
defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  # Relocated from micro-behaviors/process/daemonize/spawn/: the matcher sees
  # only `mem::forget(x)`, which suppresses a value's Drop for any value at all
  # — scope guards, rayon adapters and FFI handoffs all use it (hashbrown's
  # rayon raw adapter is one). Daemonization is what the *composite* infers when
  # the forgotten value is a spawned Child, so that leg now references this atom.
  - id: rust-mem-forget-call
    desc: Rust suppresses a value's Drop with mem::forget
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(std::)?mem::forget\s*\(\s*\w+\s*\)'
