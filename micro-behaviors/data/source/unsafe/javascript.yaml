# Source-level observations for unsafe native/runtime API interactions.
# The objective rules that combine these atoms live under execution/exploit.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: urlpattern-constructor-call
    desc: Constructs a URLPattern object
    if:
      type: symbol
      kind: call
      exact: URLPattern

  - id: urlpattern-nested-capture-literal
    desc: URLPattern named group has nested capture
    if:
      type: literal
      kind: string
      # URLPattern custom regex groups are named (`:name(...)`) and always
      # follow a path separator (`/books/:id(\d+)`). Requiring the leading `/`
      # keeps CSS declarations out: `filter:drop-shadow(0 0 2px var(--x))` in
      # Quarto's preview bundle and bslib's web components matched the bare
      # `:name(...(...))` shape exactly.
      regex: '/:[A-Za-z][A-Za-z0-9_-]{0,32}\([^()\r\n]{1,48}\([^()\r\n]{1,48}\)[^()\r\n]{0,48}\)'

  # `object-exec-call` moved to micro-behaviors/data/string/search::js-exec-match-call.
  # A bare `x.exec(...)` is RegExp.prototype.exec — the ordinary JS pattern-match
  # call, present in every regex-driven parser (moment.js, jQuery/Sizzle). It is a
  # string-search capability, not an unsafe runtime API; the URLPattern composite
  # below supplies the exploit context and references it cross-directory.

  - id: pathname-groups-member
    desc: Reads pathname capture groups
    if:
      type: symbol
      kind: member
      regex: '\.(pathname)\.groups$'

  # Uint8Array allocation is ordinary byte handling, not an unsafe runtime API:
  # the canonical atom lives in micro-behaviors/data/buffer and the Durable
  # Objects composite references it there.
  - id: zlib-implementation-reference
    desc: References a zlib implementation
    crit: component
    if:
      type: text
      regex: '\b(Zlib|node:zlib)\b'

  - id: private-handle-member
    desc: Accesses a private handle member
    crit: component
    if:
      type: symbol
      kind: member
      regex: '\._handle$'

  - id: member-write-call
    desc: Calls write on a zlib-style handle
    if:
      type: symbol
      kind: call
      regex: '^(_handle|handle)\.write$'

  - id: member-params-call
    desc: Calls a member params method
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.params$'

  - id: htmlrewriter-constructor-call
    desc: Constructs an HTMLRewriter
    if:
      type: symbol
      kind: call
      exact: HTMLRewriter

  # `attributes-member` moved to
  # micro-behaviors/data/source/property/attributes::object-attributes-property-access,
  # and the two iteration-protocol atoms (`symbol-iterator-member`,
  # `iterator-next-call`) to micro-behaviors/data/control-flow/loop. `.attributes`,
  # `Symbol.iterator` and `x.next()` are ordinary DOM and iteration mechanics —
  # jQuery's `.next()` sibling walk and every transpiled async helper hit them —
  # so they describe capabilities, not an unsafe runtime API. The HTMLRewriter
  # composite below still requires them, cross-directory, alongside the two legs
  # that actually carry the exploit shape.

  - id: attribute-mutation-growth-loop
    desc: Grows attributes in a loop
    crit: suspicious
    if:
      type: tree-sitter
      kind: loop
      regex: 'for\s*\([\s\S]{0,80};[\s\S]{0,80}<\s*\d{2,}[\s\S]{0,400}\.setAttribute\s*\('
    unless:
      - id: well-known/lib/ui/tempus-dominus::tempus-dominus-library
      - id: metadata/library/structure::js-large-minified-bundle

composite_rules:
  - id: zlib-private-handle-access
    desc: Accesses a private Node zlib handle
    crit: notable
    scope: leaf
    all:
      - id: zlib-implementation-reference
      - id: private-handle-member
