# Source-level observations for unsafe native/runtime API interactions.
# The objective rules that combine these atoms live under execution/exploit.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: urlpattern-constructor-call
    desc: Constructs a URLPattern object
    if:
      type: symbol
      kind: call
      exact: URLPattern

  - id: urlpattern-nested-capture-literal
    desc: URLPattern nested capture syntax
    if:
      type: literal
      kind: string
      # Path-pattern groups only: reject JS call sites, template interpolation,
      # and arithmetic (commas, dots, equals, slashes, ${}).
      regex: '\([^()\r\n,.= /+\-*${}]{1,48}\([^()\r\n,.= /+\-*${}]{1,48}\)[^()\r\n,.= /+\-*${}]{0,48}\)'

  - id: object-exec-call
    desc: Calls an object exec method
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.exec$'
    unless:
      # RegExp.prototype.exec in parsers that declare a /pattern/ variable.
      - type: text
        regex: '(?i)(?:const|let|var)\s+[A-Za-z_$][\w$]*[Rr]egexp?\s*=\s*/'

  - id: pathname-groups-member
    desc: Reads pathname capture groups
    if:
      type: symbol
      kind: member
      regex: '\.(pathname)\.groups$'

  - id: node-zlib-import
    desc: Imports the Node zlib module
    if:
      type: import
      exact: node:zlib

  # Uint8Array allocation is ordinary byte handling, not an unsafe runtime API:
  # the canonical atom lives in micro-behaviors/data/buffer and the Durable
  # Objects composite references it there.
  - id: zlib-implementation-reference
    desc: References a zlib implementation
    crit: component
    if:
      type: text
      regex: '\b(Zlib|node:zlib)\b'

  - id: private-handle-member
    desc: Accesses a private handle member
    crit: component
    if:
      type: symbol
      kind: member
      regex: '\._handle$'

  - id: member-write-call
    desc: Calls write on a zlib-style handle
    if:
      type: symbol
      kind: call
      regex: '^(_handle|handle)\.write$'

  - id: member-params-call
    desc: Calls a member params method
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.params$'

  - id: htmlrewriter-constructor-call
    desc: Constructs an HTMLRewriter
    if:
      type: symbol
      kind: call
      exact: HTMLRewriter

  - id: attributes-member
    desc: Accesses an attributes member
    if:
      type: symbol
      kind: member
      regex: '\.attributes$'

  - id: symbol-iterator-member
    desc: Accesses the JavaScript Symbol.iterator member
    if:
      type: symbol
      kind: member
      exact: Symbol.iterator
    unless:
      - type: text
        regex: 'node_modules/rxjs/dist/'

  - id: attribute-mutation-growth-loop
    desc: Grows attributes in a loop
    crit: suspicious
    if:
      type: tree-sitter
      kind: loop
      regex: 'for\s*\([\s\S]{0,80};[\s\S]{0,80}<\s*\d{2,}[\s\S]{0,400}\.setAttribute\s*\('

  - id: iterator-next-call
    desc: Advances a JavaScript iterator with next()
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.next$'
    unless:
      - type: text
        regex: 'node_modules/rxjs/dist/'

composite_rules:
  - id: zlib-private-handle-access
    desc: Accesses a private Node zlib handle
    crit: notable
    scope: leaf
    all:
      - id: zlib-implementation-reference
      - id: private-handle-member
