defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]

traits:
  - id: go-unsafe-package-import
    desc: Imports Go's unsafe package
    conf: 0.95
    if:
      type: import
      exact: unsafe

  - id: go-unsafe-pointer-conversion
    desc: Converts a Go pointer through unsafe.Pointer
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: unsafe.Pointer

  - id: go-unsafe-function-pointer-call
    desc: Calls a Go function through unsafe.Pointer
    conf: 0.92
    if:
      type: text
      regex: '\*\s*\(\s*\*func\s*\(\s*\)\s*\)\s*\(\s*unsafe\.Pointer'
