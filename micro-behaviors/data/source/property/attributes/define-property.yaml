traits:
- id: define-property-variable-arguments
  desc: Defines an object property using variables
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'Object\.defineProperty\s*\(\s*[\w$]{1,24}\s*,\s*[\w$]{1,24}\s*,\s*[\w$]{1,24}\s*\)'

