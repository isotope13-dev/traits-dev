defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: object-attributes-property-access
  desc: Reads an object's attributes property
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    kind: member
    regex: '\\.attributes$'
