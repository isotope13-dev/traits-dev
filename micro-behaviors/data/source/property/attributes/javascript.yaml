defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: object-attributes-property-access
  desc: Reads an object's attributes property
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    kind: member
    regex: '\\.attributes$'
# A bare `.value` read is ordinary JavaScript: Map/Set iterator results,
# `Object.getOwnPropertyDescriptor` descriptors, option objects, and DOM form
# fields all expose it. The matcher proves only that some object's `value`
# property is read, so it stays a neutral property-access observation here.
# Credential-capture and wallet-phishing composites reference it and supply
# the DOM lookup / input-field legs that make the read meaningful.
- id: object-value-property-access
  desc: Reads an object's value property
  crit: baseline
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\.value\b'
