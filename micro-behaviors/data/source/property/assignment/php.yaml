defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: wordpress-login-keyed-value-assignment
    desc: Assigns value under WordPress login key
    conf: 0.95
    if:
      type: text
      regex: '\[\s*\$[A-Za-z_][A-Za-z0-9_]*\s*->\s*user_login\s*\]\s*=\s*\$[A-Za-z_][A-Za-z0-9_]*\s*;'
