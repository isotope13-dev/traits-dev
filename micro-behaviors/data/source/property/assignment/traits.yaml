defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.8

traits:
  - id: request-like-property-assignment
    desc: Request-like .to property assignment
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\b(request|params|args|tx)\b[\s\S]{0,120}\.to\s*='
