defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.8

traits:
  - id: node-client-context-await-assignment
    desc: Assigns awaited data to clientContext
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\.clientContext\s*=\s*await\s+[A-Za-z_$][A-Za-z0-9_$]*\(\)'

  - id: request-like-property-assignment
    desc: Request-like .to property assignment
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\b(request|params|args|tx)\b[\s\S]{0,120}\.to\s*='
