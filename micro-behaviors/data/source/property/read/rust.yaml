defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  # Relocated from micro-behaviors/communications/http/get/: `.get(` is the
  # standard Rust accessor for HashMap, BTreeMap, slices, Vec, Option, Cell and
  # RefCell, so filing it under HTTP reported plain collection lookups
  # (hashbrown's own src/control/bitmask.rs) as GET-request evidence. The ureq
  # composite references it from here and supplies the HTTP context itself.
  - id: rust-get-accessor-call
    desc: Rust calls a .get() accessor
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.get\s*\('
