# Plain named-property reads in JavaScript source.
#
# `.value` is best known from DOM form fields (`input.value`), but it is an
# ordinary JavaScript field name: iterator results, Map/Set entries, parser
# node objects, and countless library value wrappers all expose it. The
# matcher can only see "a `.value` property was read", so that is all this
# atom claims. Credential-capture and wallet-exfiltration composites pair it
# with their own DOM/form-field legs to supply the browser context.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: baseline
  conf: 0.9

traits:
  # Relocated from objectives/collection/monitor/tracking/. Named the fields
  # they read, not the intent of the composite they feed: each matcher sees
  # only "a property with this name was read", which every profile header,
  # contact form and user-settings page in existence also does. As
  # `profile-*-field-read` under a collection objective they reported a Docker
  # setup-docker-action bundle and a yarn plugin as reading a profile
  # account-name field. The harvest intent comes from the cluster -- three
  # different identity fields off one object inside 512 bytes -- which is what
  # objectives/collection/monitor/tracking::client-store-identity-record-harvest
  # states, referencing these three cross-directory.
  - id: js-real-name-property-read
    desc: Reads a real-name property
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.\s*(realName|real_name|fullName|full_name)\b'

  - id: js-phone-property-read
    desc: Reads a phone-number property
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.\s*(phone|phoneNumber|mobile|telephone)\b'

  - id: js-account-name-property-read
    desc: Reads an account-name property
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '\.\s*(account|username|userNo|userName)\b'

  - id: js-value-property-read
    desc: Reads a .value property
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\.value\b'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  # Repeated constructor-property reads are useful structural evidence for
  # prototype-chain reflection. They do not alone prove that the second
  # constructor is JavaScript's Function constructor, so keep this neutral;
  # eval-loader objectives add the decode and invocation relationship.
  - id: repeated-constructor-property-read
    desc: Reads constructor properties repeatedly
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: symbol
      kind: member
      regex: '\.constructor$'
