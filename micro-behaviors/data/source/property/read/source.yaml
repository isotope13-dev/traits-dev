# Generic named-property reads shared across source languages.
defaults:
  platforms: [windows, unix]
  for: [binaries, python, javascript, typescript, c, cpp, csharp]
  crit: component
  conf: 0.9

traits:
  # A result-member access is generic object handling, not evidence of the
  # protocol that supplied the object. C2 composites add that context. Require
  # an object identifier before the accessor so JavaScript spread syntax such
  # as an ellipsis before result cannot masquerade as a result property read.
  - id: result-dot-member-read
    desc: Reads result through dot or arrow access
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]{0,63}\s*(->|\.)\s*result\b'

  - id: result-subscript-member-read
    desc: Reads bracketed result from an object
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]{0,63}\s*\[\s*\\?["'']result\\?["'']\s*\]'

composite_rules:
  - id: result-member-read
    desc: Reads a result member from an object
    any:
      - id: result-dot-member-read
      - id: result-subscript-member-read
