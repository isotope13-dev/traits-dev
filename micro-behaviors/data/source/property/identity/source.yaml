defaults:
  platforms: [windows, unix]
  for: [c, cpp, python]
  crit: component
  conf: 0.85

traits:
  - id: flags-identifier
    desc: Source identifier named flags
    if:
      type: symbol
      kind: identifier
      exact: flags
    unless:
      - id: metadata/file/catalog/identity::linux-ptrace-system-header
