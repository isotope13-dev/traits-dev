defaults:
  platforms: [windows, unix]
  for: [c, cpp, python]
  crit: component
  conf: 0.85

traits:
  # A bare field name is only a schema/property observation. Dask telemetry,
  # code-review tools, and many unrelated source models all use this name; the
  # consuming composite must supply the behavior and product context.
  - id: source-code-snippet-field
    desc: Source-code snippet field identifier
    for: [python]
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: code_snippet

  - id: flags-identifier
    desc: Source identifier named flags
    if:
      type: symbol
      kind: identifier
      exact: flags
    unless:
      - id: metadata/file/catalog/identity::linux-ptrace-system-header
