defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: host-user-object-fields
  desc: Host or user object field keys
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(^|[,{]\s*)(host|user)\s*:'
- id: repository-object-fields
  desc: Repository identity object field keys
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(^|[,{]\s*)(gname|gmail|repo)\s*:'
- id: machine-id-object-field
  desc: Machine identifier object field key
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(^|[,{]\s*)mid\s*:'
- id: client-uuid-object-field
  desc: Client UUID object field key
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '["'']?clientUuid["'']?\s*[:=]'
- id: account-email-object-field
  desc: Account e-mail object field key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(customer|account|billing)_email\s*:'
- id: commonjs-domain-like-export
  desc: CommonJS module exports a domain-like field
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'module\.exports\s*=\s*\{[^}\n]{0,400}\b(dom|domain|host|hostname)\s*:'
