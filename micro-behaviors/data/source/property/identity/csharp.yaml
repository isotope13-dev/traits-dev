defaults:
  for: [pe, dll, csharp]
  platforms: [windows, linux]
  crit: component
  conf: 0.88

traits:
  # A turbine-speed property also occurs in games and physical simulations.
  # ICS discovery requires a nearby industrial protocol/register marker.
  - id: turbine-speed-field
    desc: Turbine speed field identifier
    if:
      type: text
      regex: '(?i)\bTurbine[-_]?Speed'
