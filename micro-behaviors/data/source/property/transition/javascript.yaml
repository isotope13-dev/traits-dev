# JavaScript object-shape transitions used by browser JIT exploit primitives.
# These are capabilities, not standalone exploit verdicts: the objective rule
# combines them with enumeration, native-address, and arbitrary-memory helpers.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]

traits:
  - id: js-function-metadata-descriptor
    desc: Defines a function metadata property
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'Object\.defineProperty.{0,100}["''](name|length|prototype)["'']'

  # Uint8Array allocation is the canonical byte-buffer atom in
  # micro-behaviors/data/buffer; the composite below references it there.
  - id: js-float-array-constructor
    desc: Constructs a Float64Array buffer
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bnew\s+Float(32|64)Array\s*\('

  - id: js-bigint-array-constructor
    desc: Constructs a BigInt64Array buffer
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bnew\s+BigU?Int64Array\s*\('

  - id: js-metadata-read-after-enumeration
    desc: Reads function metadata after enumeration
    for: [javascript]
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        (function_declaration
          body: (statement_block
            (lexical_declaration
              (variable_declarator
                value: (member_expression
                  object: (identifier) @first_obj
                  property: (property_identifier) @first_prop)))
            (expression_statement
              (call_expression
                function: (member_expression
                  object: (identifier) @keys_obj
                  property: (property_identifier) @keys_prop)
                arguments: (arguments
                  (identifier) @keys_arg)))
            (lexical_declaration
              (variable_declarator
                value: (member_expression
                  object: (identifier) @second_obj
                  property: (property_identifier) @metadata)))
          )
          (#eq? @first_obj @keys_arg)
          (#eq? @keys_arg @second_obj)
          (#eq? @keys_prop "keys")
          (#match? @metadata "^(name|length|prototype)$")
        )

  - id: js-object-enumeration-html
    desc: Enumerates a JavaScript object in HTML
    for: [html]
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'Object\.keys\s*\(\s*\w+\s*\)'

  - id: js-function-name-read-html
    desc: Reads a function name in HTML JavaScript
    for: [html]
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '=\s*\w+\.name\b'

  - id: js-high-iteration-loop
    desc: Runs a high-iteration JavaScript loop
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'for\s*\(.{0,80}<\s*(1[0-9]{3}|[2-9][0-9]{3,})\s*;'

composite_rules:
  - id: js-metadata-read-after-enumeration-html
    desc: Reads metadata after enumeration in HTML
    for: [html]
    crit: suspicious
    conf: 0.96
    near_bytes: 160
    all:
      - id: js-object-enumeration-html
      - id: js-function-name-read-html

  - id: js-function-metadata-typed-array-proximity
    desc: Defines function metadata near typed-array allocation
    # This proximity is common in validation and serialization libraries.  It
    # becomes suspicious only when paired with the enumeration primitive and a
    # high-iteration warm-up by the browser-JIT objective.
    crit: notable
    conf: 0.97
    near_bytes: 320
    all:
      - id: js-function-metadata-descriptor
    any:
      - id: micro-behaviors/data/buffer::uint8array-constructor
      - id: js-float-array-constructor
      - id: js-bigint-array-constructor
