defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-new-this-bracket
    desc: Constructs object through this bracket property
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (new_expression
          constructor: (subscript_expression
            object: (this)))
    unless:
      - id: micro-behaviors/data/archive/library::archiver
      - id: micro-behaviors/data/archive/library::zip-stream-entry-writer-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/tool/development/yarn::yarn-cli-bundle-marker
      - id: well-known/app/development/vscode-extension/dbcode::extension-context
  - id: js-this-bracket-access
    desc: Accesses a property on this via brackets
    crit: notable
    conf: 0.8
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (subscript_expression
          object: (this))
    unless:
      - id: well-known/lib/web/jquery::domain
      - id: metadata/library/prototype::copyright
  # Plain `ident[expr](...)` — dispatch tables, callback queues, `arr[i]()`.
  # This is ordinary JavaScript (ramda and lodash both match), so on its own it
  # is a language construct rather than an analyst-relevant behavior. The tight
  # siblings below (globalThis/Date/`_0x` computed calls) carry the real signal,
  # and the composites referencing this one supply their own intent legs.
  - id: js-computed-property-call
    desc: Calls a property using bracket notation
    crit: baseline
    conf: 0.82
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      # Roff man pages are typed as JavaScript by the walker; their prototype
      # lines and font escapes produce `ident[...](` shapes that are not calls.
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_.$]{0,120}\s*\[[^\]\n]{1,120}\]\s*\('
  # Numeric function calls inside a computed property are useful to the
  # obfuscated-dispatch composites, but the receiver is required here. This
  # avoids treating Markdown links such as `[capabilities(7)](...)` as code.
  - id: js-numeric-indexed-computed-call
    desc: Calls a numeric-indexed computed property
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,120}\[\s*[A-Za-z_$][A-Za-z0-9_$]*\(\s*\d+\s*\)\s*\]\s*\('
  # A computed document member is a JavaScript property-dispatch construct,
  # not evidence that a script element or remote code is being loaded.
  - id: js-computed-document-call
    desc: Calls a computed document member
    crit: baseline
    conf: 0.86
    for: [javascript]
    if:
      type: text
      regex: 'document\[\s*(["''][^"''\n]{1,64}["'']|[A-Za-z_$][\w$]{0,64})\s*\]\s*\('

  # Obfuscators keep the receiver and decoded property expression in
  # brackets, so ordinary text matchers cannot establish the call's meaning.
  # This neutral structural atom is used only with stronger operation legs.
  - id: js-obfuscated-computed-call-cluster
    desc: Obfuscated computed call cluster
    crit: component
    conf: 0.86
    count_min: 3
    if:
      type: text
      regex: '\b\w+\s*\[[^\]\n]{1,180}\]\s*\('
  # Computed constructor selection is ordinary dynamic dispatch by itself.
  # Obfuscation composites add the decode/dispatch evidence that supplies
  # intent; this atom only records the source-level operation.
  - id: js-computed-constructor
    desc: Constructs an object through a computed property
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bnew\s+\w+\s*\[[^\]\n]{1,180}\]\s*\(\s*\)'

  - id: globalthis-computed-property-call
    desc: Calls a computed globalThis property
    # Computed global dispatch is neutral; composites supply malicious intent.
    crit: notable
    conf: 0.88
    for: [javascript]
    if:
      type: text
      regex: '\(?globalThis\)?\s*\[[\s\S]{1,100}\]\s*\(\s*\w+'
  - id: js-computed-date-method-call
    desc: Calls a Date method through bracket notation
    crit: notable
    conf: 0.82
    for: [javascript]
    if:
      type: text
      regex: 'Date\s*\[[^\]]{1,80}\]\s*\('
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  # Relocated from objectives/execution/interpreter/script/wsh: the matcher only
  # sees `this['prefix' + name](...)`, the standard visitor/dispatch idiom used
  # by CSS and AST compilers (`this['visit' + name](node)`).  It is neither
  # JScript-specific nor a loop, so it belongs with the other computed-property
  # call atoms; WSH composites can reference it from here.
  - id: js-computed-this-method-concat-call
    desc: Calls a this method named by concatenation
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: 'this\[[''"][a-zA-Z0-9]+[''"]\s*\+\s*[a-zA-Z0-9]+\]\('
  - id: js-computed-member-variable-assignment
    desc: Assigns through a computed JavaScript member
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\]\s*=\s*_0x[A-Za-z0-9_$]+'

  - id: js-computed-property-alias
    desc: Binds computed property to variable
    # Indexed lookups such as `channels[chNumber]` are routine application
    # logic; retain the capability without elevating ordinary loops.
    crit: baseline
    conf: 0.75
    for: [javascript]
    if:
      type: text
      regex: 'var\s+[A-Za-z_$][A-Za-z0-9_$]*\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\[[A-Za-z_$][A-Za-z0-9_$]*\]'
    unless:
      - id: metadata/build/bundler::babel-transpiled
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: js-computed-hidden-flag-call
    desc: Computed call with hidden-window arguments
    crit: notable
    conf: 0.94
    for: [javascript]
    if:
      type: text
      regex: '\b\w+\[\w+\(["''][^"'']{1,40}["'']\)\]\s*\(\w+\s*,\s*0\s*,\s*false\s*\)'
  - id: js-computed-hidden-flag-identifier-call
    desc: Computed identifier call, hidden arguments
    crit: notable
    conf: 0.94
    for: [javascript]
    if:
      type: text
      regex: '\b\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*,\s*0\s*,\s*false\s*\)'
  - id: js-computed-call-false-third-argument
    desc: Computed call has false third argument
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\b\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*,\s*\w+\s*,\s*false\s*\)'
  - id: js-decoded-false-flag-call
    desc: Decoded call with false flag
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '\b\w+\[\w+\(["''][^"'']{1,40}["'']\)\]\s*\(\s*\w+\([^)]{1,80}\)\s*,\s*\w+\s*,\s*false\s*\)'
  - id: js-computed-decoder-call-prefix
    desc: Computed call uses a decoder function
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\b\w+\[\w+\([^\r\n)]{1,240}\)\]\s*\('
  - id: js-arithmetic-falsy-final-flags
    desc: Call uses arithmetic and falsy final flags
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: text
      # Obfuscators commonly replace numeric and Boolean flags with arithmetic
      # and JavaScript's falsy `![]` expression. Execution intent is supplied
      # by higher-level composites with WSH and method-name evidence.
      regex: ',\s*[-+*\d\s]{3,120},\s*!\[\]\s*\);'
  - id: js-global-require-alias
    desc: Assigns require to computed global property
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: 'global\s*\[.{1,80}\]\s*=\s*require\b'

  # Two-level bracket access on the global object where both keys and the
  # argument index are computed — `window[f(a)][f(b)](t[c])`. The string-array
  # obfuscator shape: no property name appears in the source.
  #
  # Relocated from micro-behaviors/ui/window/manage/navigation/, which named it
  # for the composite it feeds (obfuscated query navigation) rather than for
  # what it matches; the matcher cannot tell a navigation call from any other
  # window method. The navigation composite references it cross-directory.
  - id: computed-window-member-call
    desc: Computed window member call
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: 'window\s*\[[^\]]{1,80}\]\s*\[[^\]]{1,80}\]\s*\(\s*\w+\s*\['

  # A bracket-indexed method call whose last argument is the literal 0. In the
  # WSH dropper shape that is `sh[decode("Run")](cmd, 0)` — the 0 being the
  # hidden-window mode — but the matcher itself checks nothing about process
  # creation, which is why it also lands on minified private-symbol dispatch
  # such as minipass/tar's `this[He](null, 0)`. Relocated from
  # micro-behaviors/process/create/flags/, which asserted a launch flag the
  # matcher never verifies; the ActiveX/WSH dropper composites reference it
  # cross-directory and supply the ADODB.Stream and ProgID legs themselves.
  #
  # The argument list must be a single unnested call: no parentheses and no
  # statement separators between `](` and the trailing `, 0)`. The former
  # 240-character `[^\n]` window spanned unrelated code on minified lines and
  # stitched a regex literal's `]([^'"]+)` to a later `u2(S,0)` call.
  # The receiver must also be an identifier — the hidden-window `Run(cmd, 0)`
  # shape dispatches off a shell object, whereas a subscript on a literal is
  # ordinary polyfill code (core-js probes `'0'[$SPLIT](undefined, 0)`).
  - id: computed-member-call-zero-arg
    desc: Computed member call with trailing zero
    crit: notable
    conf: 0.96
    for: [javascript]
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/ui/jquery-ui/
      - id: well-known/lib/ui/yui/
    if:
      type: text
      regex: '[A-Za-z_$][\w$]*\s*\[[^\]\n]{1,60}\]\([^()\n;]{1,80},\s*0\s*\)'
