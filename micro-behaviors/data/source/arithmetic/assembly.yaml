# Assembly arithmetic instructions appearing in C/C++ sources — inline `asm`
# blocks, `.S` translation units (which type as C), and shellcode listings
# quoted in comments.
#
# A bare mnemonic is a syntax fragment, not a behavior: `add x0, x1` is the
# most common instruction in any hand-written assembly file. Composites that
# infer intent from an instruction *sequence* (an API-hash loop, a decode
# stub) reference these atoms and supply the discriminating neighbours.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: component
  conf: 0.9

traits:
  # Relocated from objectives/evasion/anti-av/api-hashing/, where it was named
  # and graded as an "API hash accumulator instruction". The matcher sees only
  # a two-operand ADD: it fired 53 times across Zig's AArch64/ARM/RISC-V
  # startup and sanitizer assembly. The ROR13 rotate it is paired with in
  # `ror13-api-hash-loop-source` is the leg that carries the API-hashing
  # meaning.
  - id: asm-add-two-operand-instruction
    desc: Assembly ADD instruction with two operands
    if:
      type: text
      regex: '(?i)\bADD\s+[A-Z0-9]+\s*,\s*[A-Z0-9]+\b'
