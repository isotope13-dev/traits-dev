defaults:
  platforms: [linux, macos, windows]
  for: [elixir]
  crit: notable
  conf: 0.95

traits:
  - id: elixir-weighted-symbol-index
    desc: Scales lookup index by radix-four weight
    if:
      type: tree-sitter
      query: |
        ((binary_operator
          left: (call
            target: (dot left: (alias) @module right: (identifier) @method))
          "*"
          right: (integer) @weight)
          (#eq? @module "Enum")
          (#eq? @method "find_index")
          (#match? @weight "^(4|16|64)$"))
