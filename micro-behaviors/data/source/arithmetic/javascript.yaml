defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: js-binary-subtraction-cluster
    desc: Many JavaScript infix subtraction expressions
    crit: baseline
    conf: 0.95
    count_min: 30
    if:
      # AST matching excludes negative numeric coordinates and hyphenated
      # identifiers inside strings, both of which inflate text/metric counts.
      type: tree-sitter
      language: javascript
      query: |
        (binary_expression
          operator: "-"
        ) @subtraction
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/library/generated::laya-engine-runtime-marker
      - type: path
        regex: '[\\/]node_modules[\\/]'

  - id: hex-threshold-conditionals
    desc: Repeated large hexadecimal threshold checks
    crit: notable
    conf: 0.82
    count_min: 5
    per_kb_min: 1.0
    if:
      type: text
      regex: 'if\s*\([^)]{0,120}0x[0-9a-fA-F]{6,}[^)]{0,120}\)'

  - id: js-bitwise-arithmetic-chain
    desc: JavaScript bitwise arithmetic and shift chain
    crit: notable
    conf: 0.8
    size_max: 400000
    if:
      type: text
      regex: '[0-9]{2,}.{0,30}[&|^].{0,30}[0-9]{2,}.{0,30}(<<|>>).{0,30}[&|^]'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: js-dense-math-pow
    desc: Dense repeated Math.pow arithmetic
    count_min: 8
    per_kb_min: 0.2
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/hardware/input/audio/
      - id: metadata/library/structure::js-emscripten-preamble-marker
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/lang/compiler/aot::huge-runtime-function-count
    if:
      type: symbol
      kind: call
      exact: Math.pow

  - id: js-math-pow-power-of-two-constants
    desc: Math.pow power-of-two constants
    count_min: 6
    per_kb_min: 0.2
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/hardware/input/audio/
      - id: metadata/library/structure::js-emscripten-preamble-marker
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/lib/data/apache-arrow
      - id: well-known/lib/format/protobuf-ts
    if:
      type: text
      regex: 'Math\.pow\s*\(\s*2\s*,\s*\d{2}\s*\)'

  - id: js-indexed-array-subtraction-loop
    desc: Indexed array subtraction loop
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/file/format/markup::astro-template-basename
    if:
      type: tree-sitter
      language: javascript
      query: |
        (for_statement
          body: (statement_block
            (expression_statement
              (assignment_expression
                left: (subscript_expression)
                right: (binary_expression
                  left: (subscript_expression)
                  operator: "-"
                  right: (number)
                )
              )
            )
          )
        ) @transform_loop
