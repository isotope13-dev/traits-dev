# A two-bit left shift is the arithmetic step used by radix-four codecs, but it
# is also ordinary bit manipulation. Keep the operation neutral; decoder
# composites add the encoded alphabet/content that gives it meaning.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class]
  crit: baseline
  conf: 0.9

traits:
  - id: radix-four-left-shift
    desc: Code shifts a value by two bits
    if:
      type: text
      regex: '(-shl\s+2|<<\s*2|shl\s+2|shiftLeft\s*[(]\s*2)'

