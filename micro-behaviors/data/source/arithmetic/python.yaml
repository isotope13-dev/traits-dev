defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: repeated-numeric-bitshift
    desc: Repeated numeric bit-shift operations
    crit: notable
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '<<[0-9]{2,}.{0,50}>>[0-9]{2,}|>>[0-9]{2,}.{0,50}<<[0-9]{2,}'

  - id: bitshift-array
    desc: Python bitshift in a list comprehension
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\[\s*\w+\s*(<<|>>)\s*\d+\s+for\s+\w+\s+in'

  - id: large-complex-number-expression
    desc: Python large complex-number expression
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      language: python
      kind: binary_op
      regex: '\d{3,}\.\d+\s*[+-]\s*\d{3,}\.\d+j'
