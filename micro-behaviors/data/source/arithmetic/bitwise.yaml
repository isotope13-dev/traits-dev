defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class]
  crit: notable

traits:
  - id: source-xor-operation
    desc: Source references XOR syntax
    if:
      type: text
      regex: '(?i)(\b(bxor|bitxor|xor)\b|\s\^\s)'

  - id: lsb-bit-mask-source
    desc: Source contains low-bit mask syntax
    crit: baseline
    # Require a left operand for infix &: Elixir's &1 is an argument
    # capture, not a bit mask. A mask of 16 is not a one-bit mask either.
    if:
      type: text
      regex: '([\w)\]][ \t]*&[ \t]*1\b|\band\s+1\b|\bbitAnd\s*[(]\s*1\b)'

  - id: rgb-byte-mask-scale
    desc: RGB byte mask scaled to unit interval
    for: [javascript, typescript, c, cpp]
    if:
      type: text
      regex: '&\s*0xff\)\s*/\s*0xff'
