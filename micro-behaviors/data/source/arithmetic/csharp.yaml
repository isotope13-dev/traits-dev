defaults:
  for: [csharp]
  platforms: [windows, unix]
  crit: baseline
  conf: 0.86

traits:
  - id: csharp-high-bit-mask-0x80
    desc: C# masks a value with 0x80
    if:
      type: text
      regex: '(?is)\b[A-Za-z_]\w*\s*&\s*0x80\b'

  - id: csharp-continuation-bit-mask
    desc: C# masks a value with continuation bits
    if:
      type: text
      regex: '(?is)\b[A-Za-z_]\w*\s*&\s*0x(40|3F)\b'

  - id: csharp-byte-width-left-shift
    desc: C# shifts a value by byte widths
    if:
      type: text
      regex: '(?is)<<\s*(8|24)\b'
