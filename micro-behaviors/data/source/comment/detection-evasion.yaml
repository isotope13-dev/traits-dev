# Source comments in which the author says the code is shaped to get past
# detection: "to keep the signature low", "avoids detection by scanners".
# Machine-assisted malware narrates its own evasion this way. Matched inside
# comments only, so a string table or a scanner's rule text does not count.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.85
  attack: T1027

traits:
  - id: comment-evading-detection
    desc: Comment speaks of evading detection
    if:
      type: tree-sitter
      kind: comment
      regex: '(?i)\b(evad|bypass|dodg|avoid)\w*\b.{0,20}\b(detection|scanners?|antivirus|EDR)\b'

  - id: comment-lowering-detection-signature
    desc: Comment speaks of keeping a signature low
    if:
      type: tree-sitter
      kind: comment
      regex: '(?i)\b(keep|lower|reduce|minimi[sz]e)\b.{0,12}\bsignature\s+(low|down|minimal|small)\b'
