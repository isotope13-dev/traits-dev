defaults:
  platforms: [openwrt]
  for: [c, objc]

composite_rules:
  - id: openwrt-objc-unlock-agent-interface
    desc: ObjC agent declares unlock and wipe methods
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/source/class::objc-agent-target-host-field
      - id: micro-behaviors/data/source/class::objc-agent-file-unlock-method
      - id: micro-behaviors/data/source/class::objc-agent-wipe-method
