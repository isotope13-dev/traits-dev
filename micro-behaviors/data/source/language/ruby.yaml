defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  # Canonical atom for a direct Ruby `define_method` call. Structured call
  # matching avoids comments and RuboCop node-pattern strings that merely
  # discuss `(send _ :define_method ...)` without defining any method.
  - id: ruby-dynamic-method-definition
    desc: Ruby defines methods dynamically
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: define_method

  # The symbol projection records a literal-symbol argument to `send` as an
  # opaque expression. Keep the syntax fragment honest and combine it below
  # with the structured `send` call at byte proximity.
  - id: ruby-send-define-method-syntax
    desc: Ruby send syntax targets define_method
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.send\s*\(?\s*:define_method\b'

composite_rules:
  - id: ruby-send-define-method
    desc: Ruby invokes define_method through send
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::ruby-send-call
      - id: ruby-send-define-method-syntax
    near_bytes: 64
