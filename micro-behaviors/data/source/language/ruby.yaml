defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  # Canonical atom for Ruby's dynamic method definition. Covers both the direct
  # `define_method(:name)` call and the `klass.send :define_method, name`
  # indirection Thor and RubyGems use. This replaces a duplicate that sat in
  # objectives/anti-static/obfuscation/eval/scripting/: `define_method` is
  # ordinary metaprogramming, not an anti-static technique, so the neutral
  # capability belongs here and obfuscation composites reference it.
  - id: ruby-dynamic-method-definition
    desc: Ruby defines methods dynamically
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(define_method\s*\(\s*:[a-z_]+|:define_method\b)'
