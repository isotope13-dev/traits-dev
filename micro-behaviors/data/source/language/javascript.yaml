# Named declarations in JavaScript/TypeScript source whose identifier is all
# the matcher can see.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Relocated from objectives/collection/email-harvest/. A symbol named
  # PROVIDER_LABELS is the ordinary way to name a display-label lookup for any
  # kind of provider -- LLM vendors, CRM record sources, payment processors --
  # and an npm package's CRM template matched on exactly that. Under an
  # email-harvest objective it read as harvesting evidence. The identifier
  # alone establishes no behavior, so it is a component here; the harvesting
  # intent comes from the runEmailExtractor / createEmailWriter legs of the
  # composite that references it.
  - id: provider-label-table-identifier
    desc: PROVIDER_LABELS identifier declaration
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      exact: PROVIDER_LABELS
    unless:
      - id: well-known/app/infrastructure/sympozium::official-project-context
