# Named declarations in JavaScript/TypeScript source whose identifier is all
# the matcher can see.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Relocated from objectives/collection/email-harvest/. A symbol named
  # PROVIDER_LABELS is the ordinary way to name a display-label lookup for any
  # kind of provider -- LLM vendors, CRM record sources, payment processors --
  # and an npm package's CRM template matched on exactly that. Under an
  # email-harvest objective it read as harvesting evidence. The identifier
  # alone establishes no behavior, so it is a component here; the harvesting
  # intent comes from the runEmailExtractor / createEmailWriter legs of the
  # composite that references it.
  - id: provider-label-table-identifier
    desc: PROVIDER_LABELS identifier declaration
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      exact: PROVIDER_LABELS
    unless:
      - id: well-known/app/infrastructure/sympozium::official-project-context

  # Relocated from objectives/execution/interpreter/eval/dynamic/, where both
  # sat in a file about evasive `eval` usage. Neither matcher has anything to
  # do with evaluation: they detect JavaScript capturing the global object
  # into an alias, which is the UMD/CommonJS wrapper idiom every pre-ESM
  # library opens with. Jupyter's notebook/static/edit/js/notificationarea.js
  # matched the first one. The obfuscation reading comes from the composites
  # in that file, which reference these cross-directory.
  - id: js-global-object-alias-assignment
    desc: Assigns the global object to a local alias
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(root|global|that)\s*=\s*this($|[^.A-Za-z0-9_$])'
    unless:
      # `metadata/file/line/` was dropped here. As a directory reference it
      # pulls in both `file-under-12-lines` and `file-has-30-plus-lines`,
      # which between them cover almost every file, so the trait was
      # effectively unreachable -- a 4-line probe was skipped by the first and
      # a 44-line one by the second. It came from the trait's time under an
      # obfuscation objective, where a minified-shape filter made sense; the
      # line count of a file says nothing about whether it aliases the global.
      - id: metadata/build/
      - id: metadata/package/files/dependency::node-modules-path
      # Built for this trait and never referenced by it: an emscripten or
      # bundler artifact, a jQuery plugin, a test harness and a TypeScript
      # source are all ordinary places for the idiom.
      - id: metadata/lang/source::js-assign-common-root-known-benign-context

  - id: js-global-object-self-assignment
    desc: Assigns the global object to window or globalThis
    crit: notable
    conf: 0.9
    if:
      # Require an assignment statement boundary.  This avoids treating the
      # ordinary UMD wrapper `this.window=this.window||{}` as global aliasing.
      type: tree-sitter
      kind: assignment
      regex: '(?i)^\s*(window|globalThis)\s*=\s*this\s*;?\s*$'
    unless:
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: metadata/build/
      - id: metadata/lang/source::js-assign-common-root-known-benign-context
    downgrade:
      any:
        - type: metrics
          field: text.whitespace_ratio
          min: 0.20
        - id: metadata/package/testing/harness/runtime/
