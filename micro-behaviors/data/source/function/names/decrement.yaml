defaults:
  platforms: [unix, windows]
  for: [source]
  crit: notable
  conf: 0.9

traits:
  # These names describe a counter operation, not its target. Objective rules
  # combine the helper with concrete kernel credential fields before claiming
  # privilege escalation.
  - id: decrement-to-zero-helper
    desc: Function decrements a value toward zero
    if:
      type: text
      regex: '\b(decrement_to_zero|decrement_u32_once|decrement_zero_to_all_ones)\s*\('
