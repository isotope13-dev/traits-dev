# File-infection function names in .NET / compiled binaries and C/C++ source
# Detects function/method names indicative of file infectors
defaults:
  platforms: [windows]
  for: [pe, csharp]
  crit: suspicious
  conf: 0.85

traits:
  # C/C++ source form of the InfectExe/InfectDir names below. The target noun is
  # required: a bare `infect`/`infect_` prefix also names ordinary epidemic and
  # contagion-simulation routines (SIS/SIR kernels, graph-propagation helpers
  # such as infect_vertex_property), which carry no file-infection meaning.
  - id: infect-executable-function
    desc: Function named infect_<executable>
    conf: 0.9
    for: [c, cpp]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^infect_?(file|elf|exe|pe)'

  - id: infect-container-function
    desc: Function named infect_<dir or drive>
    conf: 0.9
    for: [c, cpp]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^infect_?(bin|dir|folder|drive)'

  - id: infect-machine-function
    desc: Function named infect_<host or disk>
    conf: 0.9
    for: [c, cpp]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^infect_?(disk|host|target|victim)'

  - id: infect-exe-function
    desc: InfectExe function name (PE infector)
    conf: 0.92
    if:
      type: text
      word: InfectExe

  - id: file-infection-handler-name
    desc: File-infection handler name
    crit: component
    conf: 0.92
    for: [pe]
    if:
      type: text
      regex: '(?i)^fleInfect$'

  - id: infect-dir-function
    desc: "InfectDir func name (dir PE infector)"
    conf: 0.92
    if:
      type: text
      word: InfectDir

  - id: append-exe-function
    desc: AppendExe function name (PE appender infector)
    conf: 0.9
    if:
      type: text
      word: AppendExe

  - id: extract-base-exe-function
    desc: 'ExtractBaseExe func name'
    conf: 0.88
    if:
      type: text
      word: ExtractBaseExe

  - id: extract-file-to-dir-function
    desc: "ExtractFileToDir func name"
    conf: 0.85
    if:
      type: text
      word: ExtractFileToDir
