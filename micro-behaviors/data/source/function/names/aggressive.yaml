defaults:
  platforms: [windows, unix]
  for: [source]
  crit: suspicious
  conf: 0.8
traits:
  # `main.X` is the fully-qualified symbol form, which is how a function name
  # appears in a compiled Go binary's pclntab -- not in Go source, where a
  # function name is an identifier and never a string_literal. Both consumers
  # (go-fileless, mimicry-fatigue) pair these with compiled-binary evidence.
  - id: aggressive-go-punishment
    desc: Aggressive Go function name (Punishment)
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: string_literal
      substr: 'main.Punishment'
  - id: aggressive-go-desperate
    desc: Aggressive Go function name (Desperate)
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: string_literal
      substr: 'main.Desperate'
  - id: aggressive-go-killer
    desc: Aggressive Go function name (Killer/Destroyer)
    conf: 0.85
    for: [elf, macho, pe]
    if:
      type: string_literal
      regex: main\.(Killer|Destroyer)
  - id: aggressive-go-payload
    desc: Aggressive Go function name (Payload/Injector)
    conf: 0.8
    for: [elf, macho, pe]
    if:
      type: string_literal
      regex: main\.(Payload|Injector)
  - id: aggressive-go-malicious-intent
    desc: "Aggressive Go func name (Steal/Infect/Bypass)"
    conf: 0.85
    for: [elf, macho, pe]
    if:
      type: string_literal
      regex: main\.(Steal|Infect|Bypass)
  - id: aggressive-go-target
    desc: "Aggressive Go func name (Target/Victim/Locker)"
    conf: 0.8
    for: [elf, macho, pe]
    if:
      type: string_literal
      regex: main\.(Target|Victim|Locker|Crypt)
  # `[^a-z]` counted `_` as a boundary, so this matched the tail of a longer
  # identifier: chainflip-backend's `fn test_missing_author_punishment(`, a
  # slashing test in a proof-of-stake validator pallet, read as a function
  # named "punishment". Require a real identifier boundary. The word itself
  # stays -- it is ordinary in staking, game and reinforcement-learning code,
  # and only means anything here when it *is* the whole name.
  - id: aggressive-generic-hostility
    desc: 'Aggressive generic func name'
    if:
      type: text
      regex: (?i)(^|[^a-z_0-9])(punishment|desperate)\s*\(
  - id: backdoor-exploit-function-name
    desc: Function name contains backdoor or exploit term
    crit: notable
    if:
      type: text
      # Same boundary problem: `check_exploit(` or `is_backdoor(` in a
      # scanner's own source is not a backdoor.
      regex: (?i)(^|[^a-z_0-9])(malicious|backdoor|exploit)\s*\(
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # `locker(` is a routine C/C++ local-variable name (for example,
  # JavaScriptCore's JSLockHolder locker), not an attack indicator.
  # Require the paren adjacent to the name. Allowing `\s*` also matched English
  # prose in comments — dlmalloc's "Designated victim (dv)" chunk terminology,
  # carried in SDL2's bundled SDL_malloc.c — which is not a function at all.
  - id: victim-named-function
    desc: Victim-named function call or definition
    crit: notable
    if:
      type: text
      regex: (?i)\bvictim\(
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
