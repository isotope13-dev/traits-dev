defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: telemetry-data-object-call
    desc: Telemetry-style call receives data object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(collect|track|report|send)\w*\s*\(\s*\{\s*data\s*:'

  - id: telemetry-handler-function
    desc: Defines telemetry-style handler function
    crit: notable
    conf: 0.94
    if:
      type: function
      # Bare `send` is a generic IPC/C2 helper name; require a telemetry-shaped
      # stem (collect/track/report) or a send* suffix (sendEvent, sendBeacon).
      regex: '^(collect|track|report)\w*$|^send[A-Z_]\w*$'
