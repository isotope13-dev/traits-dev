defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: telemetry-data-object-call
    desc: Telemetry-style call receives data object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(collect|track|report|send)\w*\s*\(\s*\{\s*data\s*:'

  - id: telemetry-handler-function
    desc: Defines telemetry-style handler function
    crit: notable
    conf: 0.94
    if:
      type: function
      # Bare `send`/`report` are generic IPC and diagnostics helpers (e.g.
      # diagnostics.report). Require collect/track stems, or a camelCase
      # telemetry suffix on report/send (reportEvent, sendBeacon).
      regex: '^(collect|track)\w*$|^report[A-Z_]\w*$|^send[A-Z_]\w*$'
