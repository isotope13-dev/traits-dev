defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: telemetry-data-object-call
    desc: Telemetry-style call receives data object
    crit: notable
    conf: 0.9
    if:
      type: text
      # Generic sendResponse({ data: ... }) is ordinary browser-extension IPC.
      # Require the callee name itself to identify telemetry or usage reporting.
      regex: '(?i)\b(collect|track|report|send)(Metric|Telemetry|Usage)\w*\(\s*\{\s*data:'

  - id: telemetry-handler-function
    desc: Defines telemetry-style handler function
    crit: notable
    conf: 0.94
    if:
      type: function
      # Generic camelCase helpers such as sendMessage/sendRequest are IPC or
      # transport wrappers, not telemetry. Require an explicit telemetry noun.
      regex: '^(collect|track)(Metric|Telemetry|Usage)s?\w*$'

  - id: telemetry-emitter-function
    desc: Defines telemetry emission function
    crit: notable
    conf: 0.94
    if:
      type: function
      regex: '^(report|send)(Beacon|Telemetry)\w*$'
