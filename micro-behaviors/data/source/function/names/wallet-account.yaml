defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.82

traits:
- id: js-wallet-account-api-function
  desc: JavaScript wallet or account API function name
  if:
    type: text
    regex: '\b(async\s+)?function\s+(wallets?|accounts?|mnemonics?)\s*\('
  unless:
    - id: metadata/lang/scripted::dts-declaration-file
