# Python function-name observations.
# A bare method name is a building block, not a verdict: composites supply
# the install-hook or staging context that makes it meaningful.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
traits:
  # `run` names the setuptools command entry point -- and every other Python
  # class with a run() method. Filed by what the matcher detects (a method
  # definition), not by the install-hook composites that reference it.
  - id: ast-install-method-override
    desc: Defines a method named run
    conf: 0.85
    if:
      type: symbol
      kind: function
      exact: run
