defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A resolve(source) helper is only vocabulary. Blockchain delivery rules add
  # the transaction source, detached execution, and install-hook evidence that
  # give the helper malicious meaning.
  - id: resolve-source-parameter-function
    desc: Defines resolve function with source parameter
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\b(async\s+)?function\s+resolve\s*\(\s*source\b'
