# Neutral call-target vocabulary used to qualify protocol-specific composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A bare createConnection() name does not establish a socket call: protocol
  # clients and connection factories commonly use the same local method name.
  - id: create-connection-call-target
    desc: Call target named createConnection
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createConnection$'
  # A bare createServer() name does not establish an HTTP server: the http,
  # https, net and tls modules all expose the same factory name, and local
  # code commonly defines its own. Protocol composites qualify this atom
  # with their module import.
  - id: create-server-call-target
    desc: Call target named createServer
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: createServer
