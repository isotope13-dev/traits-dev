defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: cil-strided-byte-array-copy
    desc: CIL compacts strided bytes into array
    if:
      type: hex
      section: .text
      # Output index advances by one, input index by a computed stride.
      pattern: '11 ?? 11 ?? 25 17 58 13 ?? 11 ?? 11 ?? 91 9C 11 ?? 20 ?? ?? ?? ?? 20 ?? ?? ?? ?? 28 ?? ?? ?? 06 58 13 ??'
