# Delphi-register stream sequence: size-minus-prefix seek, prefix read,
# seed extraction and transform, output-prefix write, input-body seek,
# size-minus-two-prefixes calculation, then copy to the output stream.
# Pointers, stack slots, prefix lengths and call destinations are masked.
# This bounded stream-reassembly idiom is a probable capability; it establishes
# neither infection nor a decoy launch. Generic copying without this prefix/body
# relationship does not satisfy it.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-tail-prefix-transform-body-copy
    desc: Tail-prefix transform and stream body copy
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: CODE
      pattern: '8B 45 ?? E8 ?? ?? ?? ?? 8B D0 81 EA ?? ?? ?? ?? 8B 45 ?? E8 ?? ?? ?? ?? 8D 95 ?? ?? ?? ?? 8B 45 ?? B9 ?? ?? ?? ?? E8 ?? ?? ?? ?? 8D 55 ?? 8D 85 ?? ?? ?? ?? B9 04 00 00 00 E8 ?? ?? ?? ?? 8D 85 ?? ?? ?? ?? 8B 4D ?? BA ?? ?? ?? ?? E8 ?? ?? ?? ?? 8D 95 ?? ?? ?? ?? 8B 45 ?? B9 ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B 45 ?? BA ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B 45 ?? E8 ?? ?? ?? ?? 8B C8 81 E9 ?? ?? ?? ?? 8B 55 ?? 8B 45 ?? E8 ?? ?? ?? ??'
