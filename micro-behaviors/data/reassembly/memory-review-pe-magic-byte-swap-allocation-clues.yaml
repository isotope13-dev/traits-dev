defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: pe-magic-byte-swap-allocation-clues
    desc: PE magic, byte swapping and allocation-like call
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/instruction/call::x64-ecx-3000-edi-40-call-alternative
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/reassembly::x64-adjacent-byte-pair-swap-loop
