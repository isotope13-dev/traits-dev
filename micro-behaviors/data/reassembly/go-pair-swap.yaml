    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '(0F B6 5C 10 01 0F B6 34 10 88 1C 02 40 88 74 10 01 48 83 C0 02 48 8D 58 01 [0-15] 48 81 FB [4] 7D ?? | 44 0F B6 44 10 01 44 0F B6 0C 10 44 88 04 02 44 88 4C 10 01 48 83 C0 02 | 0F B6 5C 10 01 44 0F B6 04 10 88 1C 02 44 88 44 10 01 48 83 C0 02 | 0F B6 7C 33 01 44 0F B6 04 33 40 88 3C 1E 44 88 44 33 01 48 83 C3 02)'
