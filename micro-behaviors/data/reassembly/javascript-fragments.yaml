defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: repeated-percent-decode-concatenation
    desc: Concatenates many percent-decoded fragments
    count_min: 12
    if:
      type: text
      regex: 'unescape\(["''](%[0-9A-Fa-f]{2}){1,8}["'']\)\s*\+'
      exclude_html_comments: true
  - id: repeated-hex-fragments-interleaved-variable
    desc: Hex fragments interleaved with identifiers
    count_min: 8
    if:
      type: text
      regex: '["''][A-Fa-f0-9]{2,}["'']\s*\+\s*[\w$]+\s*\+\s*["'']'
      exclude_html_comments: true
