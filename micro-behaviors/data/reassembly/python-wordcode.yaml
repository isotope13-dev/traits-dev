defaults:
  for: [pyc]
  platforms: [windows]
traits:
  - id: pyc-byte-mask-and-shift-reassembly
    desc: Wordcode one-bit mask and shift packing
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule pyc_byte_mask_and_shift_reassembly {
          strings:
            $mask = { 88 ?? 7C ?? 19 00 64 00 40 00 91 02
                      71 ?? 53 00 29 01 E9 01 00 00 00 }
            $pack = { 88 ?? 88 ?? 64 ?? 14 00 7C ?? 17 00 19 00
                      64 ?? 7C ?? 18 00 3E 00 56 00 }
          condition:
            uint32(0) == 0x0a0d0d42 and $mask and $pack
        }
