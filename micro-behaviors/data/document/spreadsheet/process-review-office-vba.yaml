defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
traits:
  - id: vba-worksheet-range-byte-source
    desc: VBA reads bytes from worksheet range
    for: [oledoc, ooxml, vbs]
    crit: suspicious
    conf: 0.94
    attack: T1027
    if:
      type: text
      regex: '(?is)\b(Me\.)?Worksheets\s*\(\s*\d+\s*\)\s*\.\s*Range\s*\(.{0,120}\)\s*\.\s*Value'
