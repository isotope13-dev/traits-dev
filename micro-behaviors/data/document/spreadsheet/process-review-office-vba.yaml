defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
traits:
  - id: vba-worksheet-range-value-reference
    desc: VBA references a worksheet range value
    for: [oledoc, ooxml, vbs]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(Me\.)?Worksheets\s*\(\s*\d+\s*\)\s*\.\s*Range\s*\(.{0,120}\)\s*\.\s*Value'
