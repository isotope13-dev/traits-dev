defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.88

traits:
  - id: vba-cell-formula-from-variable
    desc: Writes a variable into a cell formula
    if:
      type: text
      regex: '(?im)\.Formula\s*=\s*[A-Za-z_]\w{0,40}\s*$'

  - id: vba-nested-call-on-cell-value
    desc: Passes a cell value through nested calls
    if:
      type: text
      regex: '(?i)\b\w+\(\s*\w+\(\s*Cells\(\s*\d+\s*,\s*\d+\s*\)\s*\)\s*\)'
