defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.9

traits:
  - id: vba-sheet-copy-into-workbook
    desc: Copies a sheet into another open workbook
    if:
      type: text
      regex: '(?i)\.Copy\s+(before|after)\s*:=\s*Workbooks\s*\('

  - id: vba-workbook-save-copy-as
    desc: Saves a workbook copy to a path
    if:
      type: text
      regex: '(?i)Workbook(s\s*\([^)\r\n]{1,60}\))?\.SaveCopyAs\s+\S'

  - id: vba-named-workbook-saveas-path
    desc: Saves a named workbook to a path
    if:
      type: text
      regex: '(?i)\bWorkbooks\s*\([^)\r\n]{1,60}\)\.SaveAs\s+FileName\s*:='
