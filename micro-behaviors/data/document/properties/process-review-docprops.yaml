defaults:
  for: [vbs, oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-builtin-document-properties
    desc: Macro reads built-in document properties
    if:
      type: text
      regex: '(?i)\bBuiltInDocumentProperties\s*\('

  - id: vba-custom-document-properties
    desc: Macro reads custom document properties
    if:
      type: text
      regex: '(?i)\bCustomDocumentProperties\s*\('
