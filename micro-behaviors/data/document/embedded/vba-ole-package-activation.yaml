# Calling DoVerb on an embedded OLE "Package" object opens the file packaged
# inside the document with its registered handler.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.9

traits:
  - id: vba-ole-package-doverb
    desc: Activates an embedded OLE Package object
    if:
      type: text
      regex: '(?is)\bClassType\s*=\s*"Package".{0,500}?\.DoVerb\b'
