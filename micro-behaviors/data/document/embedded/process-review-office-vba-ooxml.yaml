defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
  crit: notable
  conf: 0.88
traits:
  - id: oleformat-access
    desc: OLEFormat object access
    if:
      type: text
      regex: (?i)\bOLEFormat\b
  - id: classtype-access
    desc: OLE ClassType inspection
    if:
      type: text
      regex: (?i)\bClassType\b
