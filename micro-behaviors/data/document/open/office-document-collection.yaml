# Walking the application's open-document, attached-template or recent-file
# collections addresses documents other than the running one.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.9

traits:
  - id: office-open-document-iteration
    desc: Iterates the open documents collection
    if:
      type: text
      regex: '(?i)For\s+Each\s+\w+\s+In\s+(Word\.|Application\.)?Documents\b'

  - id: word-template-iteration
    desc: Iterates attached and global Word templates
    if:
      type: text
      regex: '(?i)For\s+Each\s+\w+\s+In\s+(Word\.|Application\.)?Templates\b'

  - id: office-recent-file-path-access
    desc: Reads a recent-file list entry path
    if:
      type: text
      regex: '(?i)\bRecentFiles\s*\(\s*\w+\s*\)\.(Path|Name)\b'
