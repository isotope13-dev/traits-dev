# Generator-source evidence for PDF open-event script binding.
#
# PDF scripting libraries expose an action-object constructor plus a
# document/page open-event setter (Origami spells them
# `Action::JavaScript.new` and `PDF#onDocumentOpen` / `Page#onOpen`).
# Authoring the binding alone is neutral: the Origami samples use it for
# greeting alerts, and form workflows register calculations the same way.
# Attack meaning comes from the paired payload evidence; see the hostile
# composites in objectives/execution/trigger/document/.
#
# These are text traits because the binding idiom appears inside Ruby
# string-bearing source where a parsed Ruby call projection would not
# distinguish the embedded-JS action object from ordinary strings.
defaults:
  for: [ruby]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
  - id: source-pdf-javascript-action-construction
    desc: Source constructs a PDF JavaScript action object
    if:
      type: text
      regex: '\bAction::JavaScript\s*\.\s*new\b'
  - id: source-pdf-open-event-binding
    desc: Binds handler to PDF open event
    if:
      type: text
      regex: '\.(onDocumentOpen|onInstantOpen|onOpen)\s*(\(|[A-Z])'

composite_rules:
  - id: source-binds-javascript-to-pdf-open
    desc: Source binds a JavaScript action to a PDF open event
    all:
      - id: source-pdf-javascript-action-construction
      - id: source-pdf-open-event-binding
    near_lines: 40
