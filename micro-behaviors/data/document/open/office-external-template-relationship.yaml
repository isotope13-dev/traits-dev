defaults:
  for: [xml]
  platforms: [windows, unix]

traits:
  - id: office-external-http-template-relationship
    desc: Office relationship names HTTP template
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '<Relation[^>]{0,99}attachedTemplate[^>]{0,99}Target="http[^>]{0,99}TargetMode="External"'
