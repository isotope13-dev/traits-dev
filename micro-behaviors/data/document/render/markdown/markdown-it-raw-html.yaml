defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: markdown-it-allows-raw-html
    desc: Markdown renderer enables raw HTML
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((new_expression
          constructor: (member_expression property: (property_identifier) @constructor)
          arguments: (arguments (object (pair key: (property_identifier) @html value: (true)))))
          (#eq? @constructor "default")
          (#eq? @html "html"))

  - id: markdown-it-import
    desc: Imports markdown-it renderer
    if:
      type: text
      substr: require("markdown-it")

composite_rules:
  - id: markdown-it-with-raw-html
    desc: markdown-it configured to render raw HTML
    crit: notable
    all:
      - id: markdown-it-allows-raw-html
      - id: markdown-it-import
