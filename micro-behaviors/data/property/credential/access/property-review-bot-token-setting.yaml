defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: bot-token-empty-default-read
    desc: Reads bot-token setting with empty default
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.get$'
      args:
        - index: 0
          kind: string
          regex: '^(tg_token|telegram_token|telegram_bot_token|bot_token)$'
        - index: 1
          kind: string
          exact: ''
