defaults:
  platforms: [windows]
  for: [powershell, python, javascript, typescript, vbs, batch, csharp]
traits:
  - id: powershell-properties-description-index
    desc: Indexes Properties by the description key
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)Properties\s*\[\s*["'']description["'']\s*\]'

