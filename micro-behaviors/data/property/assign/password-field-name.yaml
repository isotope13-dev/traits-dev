defaults:
  crit: notable
  platforms: [unix, windows]
traits:
- for:
  - scripts
  - source
  - json
  conf: 0.96
  id: password-field-name
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Password field name in structured data
  if:
    type: text
    regex: '["'']password["'']\s*(:|=>)'
    case_insensitive: true
# The variable binding is a data-shape fact. Online guessing requires the
# wordlist loop and HTTP submission in the brute-force composite.
- id: python-pw-password-field
  desc: Password field assigned pw or candidate
  for: [python]
  conf: 0.96
  if:
    type: text
    regex: '["'']password["'']\s*:\s*(pw|candidate)\b'
