# Stream subject review; matcher and effective scope preserved.
---
defaults:
  for:
  - java
  - groovy
  - kotlin
  - scala
  - html
  - javascript
  - python
  - vbs
  platforms:
  - linux
  - macos
  - windows
traits:
- id: inputstream-property-assignment
  desc: Assigns an inputStream property
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(p|process)\\.inputStream\\s*=\\s*(s|sock|client)"
