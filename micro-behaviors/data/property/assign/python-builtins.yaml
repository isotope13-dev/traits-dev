defaults:
  platforms:
  - windows
  - unix
  for:
  - python

traits:
  - id: python-builtins-setattr
    desc: Sets an attribute on Python builtins
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'setattr\s*\(\s*__builtins__\s*,'
  - id: python-execution-builtins-rebind
    desc: Rebinds a Python execution builtin
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'setattr\s*\(\s*__builtins__\s*,\s*["''](__import__|eval|exec|compile)["'']\s*,'
    unless:
      - type: text
        regex: '_set_builtin\s*\(\s*["'']__NUMPY_SETUP__["'']'
      - id: "metadata/file/naming::test-directory-component"
