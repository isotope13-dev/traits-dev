defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: source-url-charcode-value
  desc: sourceUrl field initialized from character codes
  conf: 0.96
  if:
    type: text
    regex: 'sourceUrl\s*:\s*String\.fromCharCode\s*\('

  # Client code that writes the forwarded-newsletter wrapper itself, either
  # as an object property (`forwardedNewsletterMessageInfo: {`) or as an
  # assignment onto an outgoing message (`msg.forwardedNewsletterMessageInfo
  # = {`). The same client-authored metadata either way.
- id: annotations-near-media-type-check
  desc: Annotation assignment near media-type check
  conf: 0.92
  if:
    type: text
    regex: 'if\s*\([^)\n]{0,60}(image|video)[^)\n]{0,60}\)[\s\S]{0,80}\.?annotations\s*='

  # The media builder keeps caller annotations when given (`annotations ?
  # { annotations: <same expression> } : { annotations: [ ... ] }`) and
  # substitutes a library-authored block when they are absent. Upstream
  # Baileys never touches the annotations field, so this defaulting shape is
  # a fork grafting its own message content into the media pipeline. Neutral
  # on its own -- the embedded block could be any annotation; the
  # channel-attribution abuse is composed in
  # objectives/impact/ui/manipulation/social/.
- id: annotations-default-block
  desc: Annotations field defaults to an embedded block
  conf: 0.9
  if:
    type: text
    regex: 'annotations\s*\?\s*\{\s*annotations\s*:\s*[\w.$]+\s*\}\s*:\s*\{\s*annotations\s*:\s*\['

  # The nullish spelling of the same fallback: `annotations ?? [ {...} ]` /
  # `annotations || [ {...} ]`. Requires a populated object array -- an empty
  # `|| []` default is ordinary null-safety and stays silent.
- id: annotations-nullish-default
  desc: Annotations field defaults to entries
  conf: 0.9
  if:
    type: text
    regex: 'annotations\s*(\?\?|\|\|)\s*\[\s*\{'

  # A guard checking for absence of caller annotations before defaulting:
  # `if (!annotations) annotations = ...` or
  # `if (!mediaObj.annotations) mediaObj.annotations = ...`,
  # or minified logical short-circuit `(!annotations && (annotations = ...))`.
- id: annotations-falsy-if-default
  desc: Annotations defaults on falsy check
  conf: 0.9
  if:
    type: text
    regex: 'if\s*\(\s*!\s*(\w+\.)?annotations\b[^)\n]{0,40}\)[\s\S]{0,60}(\w+\.)?annotations\s*='

- id: annotations-falsy-short-circuit-default
  desc: Annotations defaults on logical short-circuit
  conf: 0.9
  if:
    type: text
    regex: '!\s*(\w+\.)?annotations\b[^;\n]{0,40}&&\s*\(?(\w+\.)?\w+\s*=\s*\[\s*\{'

- id: annotations-cached-falsy-short-circuit-default
  desc: Cached annotations defaults on short-circuit
  conf: 0.9
  if:
    type: text
    regex: '\bannotations\s*;\s*!\w+[^;\n]{0,40}&&\s*\(?(\w+\.)?\w+\s*=\s*\[\s*\{'

composite_rules:
- id: annotations-falsy-default
  desc: Annotations field defaults on falsy check
  conf: 0.9
  any:
    - id: annotations-falsy-if-default
    - id: annotations-falsy-short-circuit-default
    - id: annotations-cached-falsy-short-circuit-default

  # A media `annotations` array whose entry carries a `newsletter` block:
  # WhatsApp renders that block as channel attribution on the recipient's
  # screen. Channel-post clients write this for their own channel, so it is
  # neutral alone; the covert default is composed in
  # objectives/impact/ui/manipulation/social/.
