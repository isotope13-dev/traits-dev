defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: entry-pair-indexed-value-overlay
  desc: Overwrites object values from entry pairs
  if:
    type: tree-sitter
    query: |
      (
      (for_in_statement
        left: (array_pattern (identifier) @key (identifier) @value)
        operator: "of"
        right: (call_expression
          function: (member_expression object: (identifier) @object
            property: (property_identifier) @entries))
        body: (statement_block
          (if_statement consequence: (statement_block
            (expression_statement (assignment_expression
              left: (subscript_expression index: (identifier) @index)
              right: (identifier) @assigned)))))) @overlay
      (#eq? @object "Object")
      (#eq? @entries "entries")
      (#eq? @key @index)
      (#eq? @value @assigned)
      )
