traits:
- id: python-env-credential-named-mapping-assignment
  desc: Assigns entry in env/credential-named mapping
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?i)(env|secret|cred)\w*\s*\[\s*\w+\s*\]\s*=\s*(\w+\s*\[\s*\w+\s*\]|\w+)\s*($|[;\n#])
  not:
  - regex: (?i)^(os\.)?environ\s*\[
  platforms:
  - windows
  - unix
