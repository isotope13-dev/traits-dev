# A mapping destination can be a filename, postal address or contract.
# Only the consuming RPC composite supplies Ethereum context.
defaults:
  platforms: [unix, windows]
  for: [python, php, javascript, typescript, c, cpp, csharp]
traits:
  - id: named-target-to-field
    desc: To field names target or address
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)["']to["']\s*(:|=>)\s*(["']|\$)?(contract|address|target)\b
