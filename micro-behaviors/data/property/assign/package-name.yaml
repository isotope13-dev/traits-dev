defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  # Receiver naming suggests a package object but does not prove a manifest
  # write or publication. Require assignment syntax, excluding comparisons
  # near package.json and callbacks such as c.name === name.
  - id: package-named-object-name-assignment
    desc: Assigns name on package-named object
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)^(packageJson|package_json|pkg|manifest)\s*\.\s*name\s*='
