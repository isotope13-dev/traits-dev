# Purchase-item record fields in the vocabulary PhaaS victim-submission
# records use (`goods_name`, `goods_price`, `SelectGoods`). Ordinary
# storefront code uses the same concepts under other names (`product`,
# `item`, `sku`, `amount`); the `goods_*` / `SelectGoods` spellings are the
# order-controller dialect this kit family stores next to harvested payment
# data, so they are worth surfacing as discrete schema fields.
#
# Each matcher requires the token quoted (a string literal, key, struct tag,
# or subscript) or as a bare word in key/assignment position, so
# documentation that merely discusses merchandise does not match. Neutral on
# their own: they become evidence only when a composite pairs them with
# captured card data.
defaults:
  platforms: [unix, windows]
  for: [go, python, javascript, typescript, php, ruby, java, json]
  crit: notable
  conf: 0.7

traits:
  - id: goods-name-field
    desc: Goods-name order record field
    if:
      type: text
      regex: '(?i)["'']goods[_-]?name["'']|\bgoods[_-]?name\b\s*[:=]|\bgoodsName\b'

  - id: goods-price-field
    desc: Goods-price order record field
    if:
      type: text
      regex: '(?i)["'']goods[_-]?price["'']|\bgoods[_-]?price\b\s*[:=]|\bgoodsPrice\b'

  - id: select-goods-record
    desc: Selected-goods submission record reference
    if:
      type: text
      regex: '(?i)(["'']select[_-]?goods["'']|\bselect[_-]?goods\b\s*[:=]|\bSelectGoods\b)'
