defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: notable
  conf: 0.9
traits:
- id: js-computed-member-variable-assignment
  desc: Assigns through a computed JavaScript member
  if:
    type: text
    regex: \]\s*=\s*_0x[A-Za-z0-9_$]+
- id: js-global-require-alias
  desc: Assigns require to a global property
  for: [javascript, typescript]
  if:
    # Store the function itself; a require() result is a loaded module.
    type: tree-sitter
    language: javascript
    query: |
      ((assignment_expression
        left: [(member_expression object: (identifier) @global)
               (subscript_expression object: (identifier) @global)]
        right: (identifier) @require) @evidence
        (#match? @global "^(global|globalThis)$")
        (#eq? @require "require"))
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
