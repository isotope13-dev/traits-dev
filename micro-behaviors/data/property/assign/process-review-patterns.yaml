defaults:
  platforms: [windows, unix]
traits:
  - id: string-assign
    desc: 'Assigns a command-like string to a variable'
    crit: baseline
    conf: 0.6
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((assignment
          left: (identifier) @var
          right: (string) @val)
         (#match? @var "^(cmd|command|cmdline|cmd_line|cmdstr)$"))
