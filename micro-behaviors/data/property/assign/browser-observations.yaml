defaults:
  for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: filename-member-assignment-text
  desc: FileName member assignment syntax
  if:
    type: text
    regex: \.FileName\s*=
- id: activex-posturl-assignment
  desc: Script assigns a PostURL
  if:
    type: text
    regex: (?i)\.PostURL\s*=
- id: activex-logfile-assign
  desc: object LogFile property is assigned
  if:
    type: text
    regex: (?i)\.LogFile\s*=
