defaults:
  for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: browser-control-filename-assign
  desc: Script assigns an object FileName
  if:
    type: text
    regex: \.FileName\s*=
- id: activex-posturl-assignment
  desc: Script assigns a PostURL
  if:
    type: text
    regex: (?i)\.PostURL\s*=
- id: activex-logfile-assign
  desc: object LogFile property is assigned
  if:
    type: text
    regex: (?i)\.LogFile\s*=
