traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: delete-private-property
  desc: Deletes an object private property
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: delete\s+\w+\.private
  not:
  - substr: delete e.private
  - substr: delete connection.private
  - substr: delete error.private
  unless:
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
