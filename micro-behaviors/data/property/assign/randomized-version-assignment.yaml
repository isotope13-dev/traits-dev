# Spam republishers re-roll the manifest version from Math.random so every
# copy publishes as a distinct release; release tooling derives the next
# version from the previous one (semver bump, changelog) instead of rolling
# dice. The random-to-assignment window keeps lucky version constants out:
# the dice must flow into a `.version` assignment.
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: randomized-version-assignment
  desc: Assigns randomly generated version value
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'Math\.random\(\)[\s\S]{0,200}\.version\s*='
