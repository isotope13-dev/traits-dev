# Source property construction is not evidence of payload acquisition or run.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: concatenated-src-assignment
    desc: Assigns element src from concatenation
    conf: 0.85
    for: [javascript, typescript, html, php, svg, binaries, makefile, text]
    if:
      type: text
      regex: '\.\s*src\s*=\s*[A-Za-z_$][\w$]*\s*\+[^;]{1,80}\+'
    # Analytics snippets append a cache-bust query or join a protocol-relative
    # host. Those are URL assembly, not a concealed fragment chain.
    not:
      - regex: '\+\s*[''"]\?'
      - regex: '\+\s*[''"]//'
