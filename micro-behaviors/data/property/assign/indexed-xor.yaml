defaults:
  platforms: [windows, linux, macos]
  for: [python, c, cpp, go, rust, javascript, typescript]

traits:
  # An indexed XOR assignment proves arithmetic, not a byte buffer or decoding.
  # Decoder objectives add iteration or buffer-rebuild context separately.
  - id: indexed-value-xor-assignment
    desc: XOR-updates an indexed value with small integer
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\[[^\]\n]{1,24}\]\s*\^=\s*(0x[\da-fA-F]{1,2}|\d{1,3})\s*([;),\n}]|/[/*])'
  - id: indexed-value-xor-nontrivial-mask
    desc: XOR-updates an indexed value with non-1 mask
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*\[[^\]\n]{1,24}\]\s*\^=\s*0x0*[2-9A-Fa-f]'

