# The object property is a configuration observation, not a call-site claim.
# Keep it notable; process creation needs separate operation evidence.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-shell-true-property
    desc: JavaScript shell property set to true
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: '((pair key: (property_identifier) @key value: (true)) @option (#eq? @key "shell"))'
