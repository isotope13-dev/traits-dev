defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
- id: php-request-backdoor-record
  desc: PHP request and backdoor record references
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/superglobal::php-backdoor-url-field
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/property/access::php-database-backdoor-field

- id: php-indexed-backdoor-record
  desc: PHP request assignment and backdoor record references
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/superglobal::php-backdoor-url-field
  - id: micro-behaviors/data/property/access::php-database-backdoor-field
  - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment

- id: php-request-comment-store
  desc: PHP request, comment field and database save APIs
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/property/access::php-database-comment-field
  - id: micro-behaviors/os/module/load::php-include-init-script
  - id: micro-behaviors/data/db/access::php-save-db-function-call

- id: php-request-comment-endpoint
  desc: PHP request assignment, comment field and save APIs
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/property/access::php-database-comment-field
  - id: micro-behaviors/os/module/load::php-include-init-script
  - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/db/access::php-save-db-function-call

