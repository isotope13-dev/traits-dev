defaults:
  platforms: [unix, windows]
  for: [javascript, shell]
traits:
  - id: js-global-module-alias
    desc: Assigns module to computed global property
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "global\\s*\\[.{1,80}\\]\\s*=\\s*module\\b"
    unless:
      - id: metadata/build/bundler/wrapper::js-browserify-dependency-map
      - id: metadata/build/bundler/wrapper::js-browserify-module-wrapper
      - id: metadata/file/format/source-map::sourcemap-inline-base64
      - id: metadata/file/format/source-map::sourcemap-sources-content

composite_rules:
  - id: js-global-require-module-aliases
    for: [javascript]
    desc: Aliases require and module through global state
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/property/assign::js-global-require-alias
      - id: js-global-module-alias
