traits:
- conf: 0.88
  id: normalize-request-tools-array
  desc: Sets non-array tools field to empty array
  if:
    type: text
    regex: 'Array\.isArray\s*\(\s*[\w$]+\.tools\s*\).{0,40}\.tools\s*=\s*\[\s*\]'
