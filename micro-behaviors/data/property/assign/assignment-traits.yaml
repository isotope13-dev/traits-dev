defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- conf: 0.82
  id: js-active-or-unlocked-boolean-assignment
  desc: Assigns an active or unlocked boolean
  if:
    type: text
    regex: \.\s*(locked_out\s*=\s*false|active\s*=\s*true)\s*;
- conf: 0.94
  id: node-client-context-await-assignment
  desc: Assigns awaited data to clientContext
  if:
    type: text
    regex: \.clientContext\s*=\s*await\s+[A-Za-z_$][A-Za-z0-9_$]*\(\)
- conf: 0.8
  id: request-like-property-assignment
  desc: Request-like identifier near a .to assignment
  if:
    type: text
    regex: \b(request|params|args|tx)\b[\s\S]{0,120}\.to\s*=
