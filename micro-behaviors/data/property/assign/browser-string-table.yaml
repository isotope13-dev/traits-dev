# A computed key alone does not identify cookie, location, or another property.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  crit: notable
  conf: 0.95
traits:
  - id: string-table-document-property-write
    desc: Writes indexed document property
    if:
      type: text
      regex: 'document\[_0x[\w$]+\[\d+\]\]\s*=\s*_0x[\w$]+\[\d+\]'
  - id: string-table-window-property-write
    desc: Writes indexed window property
    if:
      type: text
      regex: 'window\[_0x[\w$]+\[\d+\]\]\s*=\s*[_\w$]+'
