defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: source-variable-text-property-assignment
    desc: Assigns source to a .text property
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression
            property: (property_identifier) @property)
          right: (identifier) @source)
          (#eq? @property "text")
          (#eq? @source "source"))
