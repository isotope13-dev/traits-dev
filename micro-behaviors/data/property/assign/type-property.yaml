# Type = 1 is not a stream identity without receiver context.
defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell]
traits:
  - id: type-one-property-assignment
    desc: Assigns one to a Type property
    crit: component
    if:
      type: text
      regex: (?i)(\.Type|\[['"]type['"]\])\s*=\s*1
