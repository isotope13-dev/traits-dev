# Call-shaped assignment syntax does not bind the receiver to COM or to an
# environment object. Preserve the syntax observation without staging intent.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: indexed-string-key-assignment-text
    desc: String-keyed call-shaped assignment syntax
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*["''][A-Za-z0-9_$]{8,40}["'']\s*\)\s*=\s*[A-Za-z_$]'
