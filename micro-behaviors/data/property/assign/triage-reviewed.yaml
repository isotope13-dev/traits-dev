traits:
- for:
  - html
  - text
  - data
  - javascript
  - vbs
  id: script-item-assignment
  desc: Script assigns to an Item accessor
  conf: 0.97
  if:
    type: text
    regex: '(?i)\.Item\s*\(\s*(["'']\w{1,32}["'']|[\w$]+)\s*\)\s*='
- for:
  - pe
  - data
  - php
  - xml
  id: jphp-autostart-timer-property
  desc: Assigns the autoStart property
  conf: 0.88
  if:
    type: text
    regex: autoStart\s*=\s*["']?(true|1)["']?
defaults:
  platforms:
  - windows
  crit: notable
