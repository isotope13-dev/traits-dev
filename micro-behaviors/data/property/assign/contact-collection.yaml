defaults:
  crit: notable
  conf: 0.85
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
traits:
  - id: contact-collection-field
    desc: Object field names a contact collection
    if:
      # Quoted (`"emails":`) and bare (`emails:`, Go `Emails:`) object keys,
      # followed by a collection literal or the variable holding one.
      type: text
      regex: '(?i)["'']?\b(emails|contacts|email_hashes)["'']?\s*:\s*(\[|[A-Za-z_$]\w*)'
      not:
        - regex: '(?i)\b(contacts|emails|email_hashes)\s*:\s*(return|break|case)\b'

