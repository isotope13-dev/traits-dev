defaults:
  platforms: [unix, windows]
  crit: notable
traits:
- id: location-href-write-text
  for: [javascript, typescript, html, svg, -kotlin]
  desc: Assignment to a location.href property
  conf: 0.82
  if:
    type: text
    regex: '\b(window\.)?location\.href\s*=[^=]'
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
