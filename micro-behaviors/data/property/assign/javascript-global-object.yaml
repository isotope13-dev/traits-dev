defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-global-object-alias-assignment
    desc: Assigns this to root/global/that
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\b(root|global|that)\s*=\s*this($|[^.A-Za-z0-9_$])'
  - id: js-global-object-self-assignment
    desc: Assigns this to window/globalThis
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)^\s*(window|globalThis)\s*=\s*this\s*;?\s*$'
