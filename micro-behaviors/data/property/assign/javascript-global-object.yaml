defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-global-object-alias-assignment
    desc: Assigns global object to a local alias
    conf: 0.9
    if:
      type: text
      regex: '\b(root|global|that)\s*=\s*this($|[^.A-Za-z0-9_$])'
    unless:
      - id: metadata/build
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/file/profile/source-indications::javascript-source-tooling-clues
  - id: js-global-object-self-assignment
    desc: Assigns global object to window/globalThis
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)^\s*(window|globalThis)\s*=\s*this\s*;?\s*$'
    unless:
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: metadata/build
      - id: metadata/file/profile/source-indications::javascript-source-tooling-clues
    downgrade:
      any:
        - type: metrics
          field: text.whitespace_ratio
          min: 0.2
        - id: metadata/package/testing/harness/runtime/
