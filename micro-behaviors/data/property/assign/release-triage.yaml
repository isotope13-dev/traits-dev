---
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - python
  - powershell
  - csharp
  - javascript
  - go
  - rust
  id: key-assignment-near-serial
  desc: Key or seed assignment near serial wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?is)\\b(key|seed)\\s*[=:][^;\\r\\n]{0,64}\\bserial\\b"
  not:
  - substr: prefix, cluster, and serial
  - substr: key={`serial`}
  - regex: "\\bkey\\s*=\\s*\\{"
  - regex: "\\bkey\\s*=\\s*\\("
