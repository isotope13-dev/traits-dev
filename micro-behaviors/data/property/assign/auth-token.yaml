defaults:
  platforms: [windows, unix]
traits:
- id: auth-token-variable-assignment-source
  desc: Assigns an AUTH or TOKEN named variable
  crit: notable
  conf: 0.8
  for:
  - scripts,-shell
  - binaries
  if:
    type: text
    # AUTH must end a name segment: AUTHOR/COAUTHOR/AUTHENTICATOR are not
    # authentication variables. Keep AUTHORIZATION and plural TOKENS, and
    # retain suffixes such as AUTH_HEADER and API_TOKEN_VALUE.
    regex: '(?m)^\s*(const |let |var )?(\w+_)?(AUTH(ORIZATION)?|TOKENS?)(_\w*)?\s*=\s*[^=\s]'
  not:
  # HRESULT-style error symbols describe authentication failures, not tokens.
  - regex: '\b[A-Z][A-Z0-9_]*_E_[A-Z0-9_]*\b'
  # Windows NTE_* cryptographic error constants have no _E_ separator.
  - regex: '\bNTE_[A-Z0-9_]+\b'
  # Uppercase numeric AUTH/TOKEN masks describe protocol/access flags.
  # The parent matcher retains only the first character of the value.
  - regex: '\b[A-Z][A-Z0-9_]*_(AUTH|TOKENS?)\s*=\s*[0-9]'
  # This is a TLS policy switch, not an authentication credential.
  - regex: '\bNODE_TLS_REJECT_UNAUTHORIZED\s*='
  # CSS lexical tokens are parser grammar, not authentication material.
  - regex: '\bCSS_[A-Z0-9_]*TOKEN[A-Z0-9_]*\s*='
  - regex: '(?i)\b[A-Za-z_$][\w$]*CONTEXT_TOKENS?\s*='
  - regex: (?i)\b[A-Za-z_$][\w$]*_PER_?TOKEN\s*=
  - regex: (?i)\b[A-Za-z_$][\w$]*TOKENS?_PER_[A-Za-z0-9_$]+\s*=
  # Lexer/parser token patterns (HOOK_TOKEN_RE, TOKEN_PATTERN) name the
  # grammar's tokens, not credentials: a secret is never a compiled regex.
  - regex: (?i)\b[A-Za-z_$][\w$]*TOKEN_(RE|REGEX|PATTERN)\s*=
  - regex: (?i)\b[A-Za-z_$][\w$]*TOKENIZ[A-Za-z0-9_$]*\s*=
  # Lexer/parser token-type tables (_FILE_LIST_TOKEN_TYPES) enumerate the
  # grammar's token kinds, not authentication material.
  - regex: (?i)\b[A-Za-z_$][\w$]*TOKEN_TYPES?\s*=
  # Conventional token-kind sets (SKIP_TOKENS, IGNORED_TOKENS, ...) name
  # grammar terminals, not credentials. Kept narrow so plural credential
  # stores (tokens = {...}) still match.
  - regex: (?i)\b(SKIP|IGNORE[D]?|VALID|ALLOWED|EXPECTED)_TOKENS?\s*=
  # Display-option token vocabularies (PASSTHROUGH_ASPECT_TOKENS) enumerate
  # media-format keywords, not authentication material.
  - regex: (?i)\b[A-Za-z_$][\w$]*(ASPECT|RESOLUTION|RATIO)_TOKENS?\s*=
  # Token-syntax field constants (REF_TOKEN_NAMESPACE_PREFIXES,
  # TOKEN_SEPARATOR) describe the structure of grammar tokens, not credentials.
  - regex: (?i)\b(?:[A-Za-z_$][\w$]*)?TOKEN_(NAMESPACE|PREFIX|SEPARATOR|DELIMITER)\w*\s*=
  # Parser completion sentinels (DONE_TOKEN = 'done.') mark grammar
  # progress, not authentication material.
  - regex: '(?i)\bDONE_TOKENS?\s*='
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog

- id: auth-token-shell-assignment
  desc: Assigns AUTH or TOKEN named shell variable
  crit: notable
  conf: 0.96
  for: [shell]
  if:
    type: tree-sitter
    language: shell
    query: |
      ((variable_assignment name: (variable_name) @name) @assignment
        (#match? @name "(AUTH(ORIZATION)?|TOKENS?)(_|$)"))

composite_rules:
- id: auth-token-variable-assignment
  desc: Assigns an AUTH or TOKEN named variable
  crit: notable
  conf: 0.9
  for: [scripts, binaries]
  any:
    - id: auth-token-shell-assignment
    - id: auth-token-variable-assignment-source
