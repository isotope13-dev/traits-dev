defaults:
  platforms: [linux, macos, windows]
  crit: notable

traits:
  - id: fractional-throttle-option
    desc: Fractional throttle property setting
    crit: notable
    conf: 0.87
    for:
    - html
    - javascript
    - typescript
    if:
      type: text
      regex: 'throttle\s*:\s*0\.\d+'
