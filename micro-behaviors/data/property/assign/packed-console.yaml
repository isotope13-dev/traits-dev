defaults:
  for: [html, javascript]
  platforms: [windows]
traits:
  - id: packed-console-property-name
    desc: Packer dictionary contains Console property name
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '|Console|'
  - id: packed-numeric-property-store
    desc: Packed dotted numeric property assignment
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[0-9]+\.[0-9]+=[a-zA-Z0-9]+;'
    count_min: 4
composite_rules:
  - id: packed-console-repeated-property-store
    desc: Console dictionary and repeated property stores
    crit: notable
    all:
      - id: packed-console-property-name
      - id: micro-behaviors/data/property/assign::packed-numeric-property-store
