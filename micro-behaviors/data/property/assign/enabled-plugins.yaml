defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: enabled-plugins-setting
    desc: Assigns enabledPlugins setting
    # This is only the final fragment of a multi-part remote-plugin signature.
    # A generic class field such as `enabledPlugins = []` is common in benign
    # plugin frameworks (for example, workspace analyzers) and is not intent
    # evidence on its own.
    crit: notable
    conf: 0.88
    for: [javascript]
    if:
      type: text
      regex: '\benabledPlugins\s*=\s*'
