traits:
- id: python-hf-token-keyword
  desc: Assigns hf_token variable or keyword
  conf: 0.88
  if:
    type: text
    regex: (?i)\bhf_token\s*=
  platforms:
  - unix
  - windows
- id: python-model-load-state-dict
  desc: Loads model state from state_dict argument
  if:
    type: text
    substr: load_state_dict(state_dict
  platforms:
  - windows
  - linux
  conf: 0.96
defaults:
  for:
  - python
  crit: notable
