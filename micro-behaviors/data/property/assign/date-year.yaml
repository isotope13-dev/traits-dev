traits:
- id: js-date-setter-call
  desc: Calls Date year setter
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: setFullYear\s*\([^;\n]{0,80}\)
defaults:
  for:
  - javascript
  platforms:
  - windows
  - unix
composite_rules:
- id: js-date-setter-getter-check
  desc: Date year setter and comparison nearby
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/data/property/assign::js-date-setter-call
  - id: micro-behaviors/time/query::js-date-getter-conditional-compare
  near_lines: 3
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/
  - id: metadata/build/
  - id: metadata/package/testing/
  - id: well-known/app/system/mdn::mdn-date-reference-context
  - id: metadata/file/naming::test-directory-component
