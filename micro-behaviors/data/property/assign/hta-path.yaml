defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  # Assigning Path configures a property; it does not establish a file write.
  - id: object-hta-path-assignment
    desc: Object Path assignment targets an HTA
    if:
      type: text
      regex: '(?i)\b[\w$]{1,40}\.Path\s*=\s*["''][^"''\r\n]{1,700}\.hta["'']'
  - id: object-startup-hta-path-assignment
    desc: Object Path assignment names a Startup HTA
    if:
      type: text
      regex: '(?i)\.Path\s*=[^;\r\n]{1,200}(StartUp|Autostart)\\+[^;\r\n]{1,80}\.hta'
