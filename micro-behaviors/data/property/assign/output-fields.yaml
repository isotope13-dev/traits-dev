# Output-named properties do not by themselves establish a financial transaction.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, go, c, cpp, rust, swift]
  crit: notable

traits:
  - id: output-destination-field-assignment
    desc: Assigns an output destination field
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(txout|vout|output)\.(address|destination)\s*=[^=>]'
  - id: indexed-output-destination-field-assignment
    desc: Assigns an indexed output destination
    conf: 0.94
    if:
      type: text
      regex: '(?i)\boutputs\s*\[[^\]]{0,80}\]\.(address|destination|to)\s*=[^=>]'
  - id: output-amount-field-assignment
    desc: Assigns an output amount or value field
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(txout|vout|output)\.(amount|value)\s*=[^=>]'
