# A body setter is also used by mail and model objects. It proves no HTTP verb.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
traits:
  - id: ruby-body-field-assignment
    desc: Assigns identifier to Ruby body field
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        (assignment
          left: (call
            receiver: (identifier) @request
            method: (identifier) @field)
          right: (identifier) @body
          (#eq? @field "body"))
