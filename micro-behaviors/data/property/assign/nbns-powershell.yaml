defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: nbns-response-transaction-id-assignments
    desc: Assigns both NBNS transaction-ID bytes
    if:
      type: text
      regex: '(?s)\$NBNS_response_packet\[0\]\s*=.{0,80}\$NBNS_response_packet\[1\]\s*='
