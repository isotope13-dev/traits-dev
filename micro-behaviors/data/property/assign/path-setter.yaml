# Structural assignment indicators; they do not establish an unguarded
# prototype setter.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]

traits:
  - id: js-indexed-object-assignment
    desc: Assigns a computed object property
    crit: component
    if:
      type: text
      regex: '\[[A-Za-z_$][A-Za-z0-9_$]*\]\s*=\s*[A-Za-z_$]'

composite_rules:
  - id: js-dot-path-traversal-and-assignment
    desc: Dot-path splitting, computed traversal and assignment co-occur
    crit: notable
    conf: 0.85
    near_lines: 24
    all:
      - id: micro-behaviors/data/string/split::js-dot-path-split
      - id: micro-behaviors/data/property/access::js-indexed-object-traversal
      - id: js-indexed-object-assignment
