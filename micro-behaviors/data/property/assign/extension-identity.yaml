defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: conditional-indexed-extension-identity-rewrite
    desc: Replaces a tested indexed extension identity
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (binary_expression
              right: (binary_expression
                left: (subscript_expression
                  object: (identifier) @checked_array
                  index: (number) @checked_slot)
                operator: ["==" "==="]
                right: (string (string_fragment) @prior))))
          consequence: (statement_block
            (expression_statement (assignment_expression
              left: (subscript_expression
                object: (identifier) @changed_array
                index: (number) @changed_slot)
              right: (string (string_fragment) @replacement)))))
          (#eq? @checked_array @changed_array)
          (#eq? @checked_slot @changed_slot)
          (#not-eq? @prior @replacement)
          (#match? @prior "^[A-Za-z0-9-]+[.][A-Za-z0-9-]+$")
          (#match? @replacement "^[A-Za-z0-9-]+[.][A-Za-z0-9-]+$"))
