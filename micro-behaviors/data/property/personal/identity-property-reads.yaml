defaults:
  platforms:
  - windows
  - unix
  for: [javascript, typescript, html]
traits:
- crit: baseline
  conf: 0.85
  id: js-real-name-property-read
  desc: Reads a real-name property
  if:
    type: text
    regex: \.\s*(realName|real_name|fullName|full_name)\b
- crit: baseline
  conf: 0.85
  id: js-phone-property-read
  desc: Reads a phone-number property
  if:
    type: text
    regex: \.\s*(phone|phoneNumber|mobile|telephone)\b
- crit: baseline
  conf: 0.85
  id: js-account-name-property-read
  desc: Reads an account-name property
  if:
    type: text
    regex: \.\s*(account|username|userNo|userName)\b
composite_rules:
- crit: notable
  conf: 0.9
  id: js-identity-property-read-cluster
  desc: References clustered personal-identity properties
  near_bytes: 512
  all:
  - id: micro-behaviors/data/property/personal::js-real-name-property-read
  - id: micro-behaviors/data/property/personal::js-phone-property-read
  - id: micro-behaviors/data/property/personal::js-account-name-property-read
