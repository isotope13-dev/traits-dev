defaults:
  platforms:
  - windows
  - unix
  - android
  for:
  - javascript
  - typescript
  - html
traits:
- id: js-function-metadata-descriptor
  desc: Defines a function metadata property
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: Object\.defineProperty.{0,100}["'](name|length|prototype)["']
- id: js-numeric-index-property-definition
  desc: Defines numeric JavaScript index property
  crit: baseline
  conf: 0.96
  if:
    type: text
    regex: Object\.defineProperty\s*\(\s*[\w$]+\s*,\s*(0|["']0["'])\s*,
- id: js-getter-counter-conditional-return
  desc: Getter changes counter before conditional return
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \bget\s*\(\s*\)\s*\{[\s\S]{0,180}\breturn\s+(\+\+|--)\s*[\w$]+[\s\S]{0,80}\?
composite_rules:
- id: js-stateful-numeric-index-getter
  desc: Numeric property definition near conditional getter syntax
  crit: suspicious
  conf: 0.98
  near_lines: 10
  all:
  - id: micro-behaviors/data/property/define::js-numeric-index-property-definition
  - id: micro-behaviors/data/property/define::js-getter-counter-conditional-return
  - id: micro-behaviors/data/control-flow/branch::js-conditional-identifier-scalar
- id: js-function-metadata-typed-array-proximity
  desc: Defines function metadata near typed-array allocation
  crit: notable
  conf: 0.97
  near_bytes: 320
  all:
  - id: micro-behaviors/data/property/define::js-function-metadata-descriptor
  any:
  - id: micro-behaviors/data/buffer/alloc::uint8array-constructor
  - id: micro-behaviors/data/buffer/alloc::js-float-array-constructor
  - id: micro-behaviors/data/buffer/alloc::js-bigint-array-constructor
