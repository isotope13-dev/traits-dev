defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: string-prototype-define-property
    desc: Object.defineProperty on String.prototype
    conf: 0.9
    if:
      type: text
      regex: 'defineProperty\s*\(\s*String\.prototype'

  - id: string-prototype-getter-tostring-call
    desc: Getter calls helper with this.toString()
    conf: 0.95
    if:
      type: text
      regex: 'get\s*:\s*function\s*\(\s*\)\s*\{\s*\w+\(\s*this\.toString\(\)'

  - id: chalk-computed-color-tostring-return
    desc: Returns chalk computed color on toString
    conf: 0.95
    if:
      type: text
      regex: 'return\s+chalk\[\w+\]\(\s*this\.toString\(\)\s*\)'

  - id: empty-module-exports-object
    desc: Exports empty CommonJS object literal
    conf: 0.85
    if:
      type: text
      regex: '\bmodule\.exports\s*=\s*\{\s*\}\s*;'
