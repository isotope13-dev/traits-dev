# Property definition alone establishes neither neutralization nor evasion.
# The conformance probe attempts to restore an API disabled by the sandbox.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]

traits:
  - id: browser-window-webrtc-property-definition
    desc: Defines global RTCPeerConnection property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Object\.defineProperty\s*\(\s*window\s*,\s*["'']RTCPeerConnection["'']'
  - id: browser-self-webrtc-property-definition
    desc: Defines self RTCPeerConnection property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Object\.defineProperty\s*\(\s*(self|globalThis)\s*,\s*["'']RTCPeerConnection["'']'
composite_rules:
  - id: browser-webrtc-constructor-property-definition
    desc: Defines a global WebRTC constructor property
    crit: notable
    conf: 0.9
    any:
      - id: browser-window-webrtc-property-definition
      - id: browser-self-webrtc-property-definition
