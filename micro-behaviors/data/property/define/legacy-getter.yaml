defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript, html]
traits:
  - id: js-legacy-getter-definition
    desc: Defines a getter on an object
    crit: notable
    conf: 0.88
    # The legacy spelling is the one this trick reaches for, because it takes a
    # plain function and needs no descriptor object.
    if:
      type: text
      regex: '\.__defineGetter__\s*\(\s*[''"][\w-]{1,24}[''"]'
    unless:
      # The pre-2021 globalThis polyfill (handlebars no-conflict and dozens of
      # libraries) defines the "__magic__" getter and then deletes it. That
      # environment shim is not an inspector probe.
      - type: text
        substr: __magic__.globalThis = __magic__
