defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: string-arg-declaration
    desc: String.prototype.arg function declaration
    if:
      type: text
      regex: '(?i)String\.prototype\.arg\s*=\s*function|function\s+String\.prototype\.arg'

  - id: string-arg-returns-this
    desc: String.prototype.arg function returns this
    if:
      type: text
      regex: '(?is)String\.prototype\.arg\s*=\s*function.{0,400}\breturn\s+this\b'

composite_rules:
  - id: string-arg-extension
    desc: Defines a String.prototype.arg extension
    crit: notable
    conf: 0.95
    all:
      - id: string-arg-declaration
      - id: string-arg-returns-this
    near_lines: 4
    near_bytes: 400
