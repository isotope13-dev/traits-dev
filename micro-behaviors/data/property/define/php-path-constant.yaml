# A path-shaped constant name and a superglobal establish a definition,
# not an include sink or attacker control. Preserve this textual observation
# separately from the bound request-to-include objective.
defaults:
  platforms: [unix, windows]
  for: [php, text]

traits:
  - id: php-path-constant-from-superglobal
    desc: Defines path-named constant from a superglobal
    crit: notable
    conf: 0.96
    if:
      type: text
      # The subscript is part of the match so the `not:` below can see it --
      # a span ending at `$_SERVER` cannot tell TEMP from HTTP_HOST.
      regex: '(?i)define\(\s*["'']\w{0,16}(path|root|dir|base|home)\w{0,8}["''],\s*\$_[A-Z]{3,7}\[.{0,14}'
    not:
      # `$_SERVER` carries server-set environment as well as request data.
      # jpgraph (vendored by LibreNMS, Grafana dashboards and much else) does
      # `\define('CACHE_DIR', $_SERVER['TEMP'] . '/')` -- the Windows temp
      # variable, not attacker input.
      - regex: '(?i)\$_SERVER\W{1,3}(TEMP|TMP|DOCUMENT_ROOT|PATH|SystemRoot)\b'

