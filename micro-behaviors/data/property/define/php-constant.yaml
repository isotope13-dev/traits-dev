# A PHP define() of a string is ordinary plugin and library setup. The
# SquirrelMail shadowing composite pairs it with a request-sourced define.
defaults:
  platforms: [windows, unix]
  for: [php, text]
  crit: notable

traits:
  - id: php-define-string-literal
    desc: Defines a PHP constant from a string
    crit: notable
    conf: 0.85
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    if:
      type: text
      regex: 'define\s*\(\s*[''"]\w{1,32}[''"]\s*,\s*[''"][^''"\n]{0,40}[''"]\s*\)'

  - id: php-define-from-superglobal
    desc: Defines a PHP constant from a superglobal
    crit: notable
    conf: 0.92
    # `define('SM_PATH', $_SERVER['HTTP_BASE_PATH'])`. Copying a request or
    # server value into a constant is ordinary configuration -- Codeception's
    # c3.php coverage shim names its test from a request header this way.
    # The SquirrelMail shadowing composite supplies the deception.
    if:
      type: text
      # The subscript is inside the match so the `not:` can read it: a span
      # ending at `[` cannot tell HTTP_BASE_PATH from TEMP.
      regex: 'define\s*\(\s*[''"]\w{1,32}[''"]\s*,\s*\$_(SERVER|GET|POST)\s*\[.{0,14}'
    not:
      # `$_SERVER` holds server-set environment as well as request data.
      # jpgraph's config.inc.php does `\define('CACHE_DIR', $_SERVER['TEMP'])`.
      - regex: '(?i)\$_SERVER\W{1,3}(TEMP|TMP|DOCUMENT_ROOT|PATH|SystemRoot)\b'
