defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: baseline
  conf: 0.92
traits:
- id: define-property-variable-arguments
  desc: Defines an object property using variables
  if:
    type: text
    regex: Object\.defineProperty\s*\(\s*[\w$]{1,24}\s*,\s*[\w$]{1,24}\s*,\s*[\w$]{1,24}\s*\)
# String-table obfuscation splits the API name into fragments such as
# 'defineProp'+'erty' and reaches it through computed access, so no
# `Object.defineProperty` call text survives. The quoted fragment still names
# the property-definition surface the code drives; wholesale obfuscation of a
# legitimate build produces the same shape, so this is a capability clue and
# consumers supply the hooked-member context.
- id: quoted-method-name-fragment
  desc: Quotes a defineProperty name fragment
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '["'']defineProp(erty)?["'']'
