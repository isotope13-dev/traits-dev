defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable

traits:
  - id: applescript-notes-bulk-properties
    desc: AppleScript reads every Notes item's properties
    conf: 0.95
    if:
      type: text
      regex: '(?s)tell application [\\]*"Notes[\\]*".{0,500}properties of every note'
