defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, vbs]
traits:
  - id: indexed-call-assignment
    desc: Assigns through an indexed default-property call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b[\w$]+\s*\(\s*[\w$]+\s*\[[^\]\r\n]{1,40}\]\s*\)\s*=[^=]'
