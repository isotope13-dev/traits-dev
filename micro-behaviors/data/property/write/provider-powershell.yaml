# Provider-property cmdlets also target filesystem and other providers.
# Registry meaning requires an independently matched registry path.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-provider-property-command-text
    for: [powershell, html]
    desc: PowerShell New or Set-ItemProperty command
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(New|Set)-ItemProperty\b'

  - id: powershell-provider-string-property-alias
    desc: PowerShell sp alias sets string property
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsp\s+\(.{0,80}\)\s+\(.{0,240}\).{0,160}-Type\s+String'

  - id: powershell-new-itemproperty-variable-path
    desc: New-ItemProperty uses a provider path variable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bNew-ItemProperty\s+-Path\s+\$[A-Za-z_]\w*'

  # Embedded command-name references in batch and PE artifacts.
  - id: set-itemproperty-command-text
    desc: Set-ItemProperty cmdlet name in text
    conf: 0.9
    for: [batch, pe]
    if:
      type: text
      substr: Set-ItemProperty

