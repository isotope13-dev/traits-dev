# Item-removal member calls on script objects. JScript's native collections
# expose `delete`/`splice`/lowercase `remove`; a capital-R `.Remove("name")`
# call is the WSH interop idiom (environment collections,
# Scripting.Dictionary). The receiver's collection identity is left open —
# consumers pair this atom with the collection they can prove.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: script-item-removal-call
    desc: Removes a named item from a collection
    crit: notable
    conf: 0.9
    if:
      type: text
      # Case-sensitive: capital-R `Remove(` is the WSH/COM spelling and keeps
      # lowercase web-API calls such as jQuery's `.remove(selector)` out.
      regex: '\b[A-Za-z_$][\w$]{0,40}\.Remove\s*\(\s*["''][^"''\r\n]{1,64}["'']\s*\)'
