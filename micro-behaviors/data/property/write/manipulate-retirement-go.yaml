defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [go]

traits:
  - id: go-set-string-value-call
    desc: Go SetStringValue call
    for: [go, pe]
    if:
      type: symbol
      kind: call
      regex: '(\.)?[sS]etStringValue$'

  - id: go-set-dword-value-call
    desc: Go SetDWordValue call
    if:
      type: symbol
      kind: call
      regex: '(\.)?SetDWordValue$'
