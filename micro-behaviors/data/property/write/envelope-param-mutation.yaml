# Structural field preservation and parameter-map mutation used when modifying
# unsigned request parameters while re-emitting an existing message signature.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  - id: preserved-signature-field-copy
    desc: Copies signature field into outgoing payload
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(\.get\(|\[)\s*["'']signature["''][\s\S]{0,360}\bsignature["'']?\s*(=>|:)'

  - id: unquoted-signature-field-copy
    desc: Copies parsed signature into object literal
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\bsignature\s*:\s*\$?\w+(\.\s*signature|\[\s*["'']signature["'']\s*\])'

  - id: mutated-params-map-write
    desc: Mutates params dictionary or map entries
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '\bparams\s*(\.update\s*\(|\[[^\]]{1,48}\]\s*=)|Object\.assign\(\s*\w*params'
