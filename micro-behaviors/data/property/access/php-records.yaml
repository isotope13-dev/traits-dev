defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
traits:
  - id: php-url-password-record
    desc: PHP accesses URL and password record fields
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\$database\[[^]]{1,32}\]\[[''\"]url[''\"]\][\s\S]{0,120}\bpass[''\"]'

  - id: php-database-comment-field
    desc: PHP accesses an indexed database comment field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$database\[[^\]]{1,40}\]\[[''"]comment[''"]\]'
  - id: php-database-backdoor-field
    desc: PHP database reference near backdoor field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$database[\s\S]{0,120}backdoor'
