# Neutral evidence separated from its objective consumers.
traits:
- id: powershell-content-property-access
  desc: PowerShell Content or RawContent member access
  conf: 0.88
  for:
  - powershell
  if:
    type: text
    regex: (?i)\$[A-Za-z_]\w*\.(Content|RawContent)\b
  crit: notable
  platforms:
  - windows
