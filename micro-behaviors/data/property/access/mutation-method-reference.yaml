# These member names are also used by tracing spans and other non-DOM objects.
# A member reference alone establishes neither DOM access nor a mutation call.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
- id: appendchild-or-setattribute-member
  desc: References appendChild or setAttribute member
  conf: 0.85
  if:
    type: symbol
    kind: member
    regex: \.(appendChild|setAttribute)$
  unless:
  - type: symbol
    kind: function
    exact: appendChild
  - type: symbol
    kind: function
    exact: setAttribute
  - id: micro-behaviors/ui/graphics/draw::webgpu-api-source-context
  - type: text
    regex: "startsWith\\(['\"]aria-['\"]\\)"
  - type: text
    substr: 'data-${attr.name}'
