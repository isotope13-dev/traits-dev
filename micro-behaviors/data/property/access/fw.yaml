# A field name is neutral; cloaking intent comes from the consuming objective.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php]
traits:
  - id: fw-property-access
    desc: Accesses an object property named fw
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      regex: '\.fw$'
