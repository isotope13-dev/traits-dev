defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
traits:
- id: indexed-value-variable-binding
  desc: Binds an indexed value to a variable
  crit: baseline
  conf: 0.8
  if:
    type: text
    regex: \b(var|let|const)\s+\w+\s*=\s*\w+\s*\[\s*\w+\s*\]
- id: comma-brackets-numeric-indexing
  desc: Numerically indexes comma-containing brackets
  crit: component
  conf: 0.8
  size_min: 1
  count_min: 2
  if:
    type: text
    regex: \[\s*[^\]]{0,60},[^\]]{0,60}\]\s*\[\s*\d+\s*\]
- id: this-brackets-numeric-indexing
  desc: Numerically indexes brackets containing this
  crit: baseline
  conf: 0.8
  size_min: 1
  if:
    type: text
    regex: \[[^\]]{0,120}\bthis\b\s*[,\]][^\]]{0,120}\]\s*\[\s*\d+\s*\]
- id: numeric-arithmetic-index-cluster
  desc: Repeated indexing with numeric arithmetic
  crit: notable
  conf: 0.7
  count_min: 3
  if:
    type: text
    regex: \b[A-Za-z_]\w{1,8}\s*\[\s*\d{1,2}\s*[-+]\s*\d{1,2}\s*\]
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
