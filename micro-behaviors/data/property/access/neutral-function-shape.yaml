# Neutral observations; consumers must supply any obfuscation interpretation.
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: function-indexed-access-cluster
  desc: Repeated access through function-selected keys
  crit: baseline
  conf: 0.95
  count_min: 3
  if:
    type: tree-sitter
    language: javascript
    query: |
      (subscript_expression
        index: (call_expression
          function: (identifier) @decoder
          arguments: (arguments (_))))
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
