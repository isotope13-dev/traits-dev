defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: first-name-member-access
    desc: References a firstName object member
    if:
      type: symbol
      kind: member
      regex: '\.firstName$'
  - id: last-name-member-access
    desc: References a lastName object member
    if:
      type: symbol
      kind: member
      regex: '\.lastName$'
