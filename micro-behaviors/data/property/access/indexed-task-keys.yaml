defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: js-indexed-link-task-key
    desc: JavaScript constructs indexed link key
    if:
      type: text
      regex: 'link\$\{[A-Za-z_][A-Za-z0-9_]*\}'
  - id: js-indexed-python-task-key
    desc: JavaScript constructs indexed Python key
    if:
      type: text
      regex: 'python\$\{[A-Za-z_][A-Za-z0-9_]*\}'
