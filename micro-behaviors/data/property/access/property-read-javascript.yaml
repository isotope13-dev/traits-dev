defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  - typescript
  - html
  crit: baseline
  conf: 0.9
  id: js-value-property-read
  desc: References a value object member
  if:
    type: symbol
    kind: member
    regex: \.value$
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- for:
  - javascript
  - typescript
  - html
  crit: notable
  conf: 0.9
  id: repeated-constructor-property-read
  desc: Reads constructor properties repeatedly
  count_min: 2
  if:
    type: symbol
    kind: member
    regex: \.constructor$
- for:
  - javascript
  - typescript
  - html
  - svg
  crit: baseline
  conf: 0.9
  id: js-bracket-constructor-property-read
  desc: Reads constructor via bracket notation
  if:
    type: text
    regex: \[\s*["']constructor["']\s*\]
  unless:
  - id: well-known/lib/web/client-side/jquery::sizzle-with-ajax-settings
