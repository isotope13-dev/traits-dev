defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  - typescript
  - html
  crit: baseline
  conf: 0.85
  id: js-real-name-property-read
  desc: Reads a real-name property
  if:
    type: text
    regex: \.\s*(realName|real_name|fullName|full_name)\b
- for:
  - javascript
  - typescript
  - html
  crit: baseline
  conf: 0.85
  id: js-phone-property-read
  desc: Reads a phone-number property
  if:
    type: text
    regex: \.\s*(phone|phoneNumber|mobile|telephone)\b
- for:
  - javascript
  - typescript
  - html
  crit: baseline
  conf: 0.85
  id: js-account-name-property-read
  desc: Reads an account-name property
  if:
    type: text
    regex: \.\s*(account|username|userNo|userName)\b
- for:
  - javascript
  - typescript
  - html
  crit: baseline
  conf: 0.9
  id: js-value-property-read
  desc: Reads a .value property
  if:
    type: text
    regex: \.value\b
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- for:
  - javascript
  - typescript
  - html
  crit: notable
  conf: 0.9
  id: repeated-constructor-property-read
  desc: Reads constructor properties repeatedly
  count_min: 2
  if:
    type: symbol
    kind: member
    regex: \.constructor$
- for:
  - javascript
  - typescript
  - html
  - svg
  crit: baseline
  conf: 0.9
  id: js-bracket-constructor-property-read
  desc: Reads constructor via bracket notation
  if:
    type: text
    regex: \[\s*["']constructor["']\s*\]
  unless:
  - id: well-known/lib/web/jquery::obfuscated-jquery-source
composite_rules:
- for:
  - javascript
  - typescript
  - html
  crit: notable
  conf: 0.9
  id: js-identity-property-read-cluster
  desc: References clustered personal-identity properties
  near_bytes: 512
  all:
  - id: micro-behaviors/data/property/access::js-real-name-property-read
  - id: micro-behaviors/data/property/access::js-phone-property-read
  - id: micro-behaviors/data/property/access::js-account-name-property-read
