---
defaults:
  for:
  - python
  crit: notable
traits:
- platforms:
  - android
  - unix
  id: python-send-command-method
  desc: References send_command method invocation syntax
  conf: 0.88
  if:
    type: text
    regex: "\\.send_command\\s*\\("
- platforms:
  - unix
  - windows
  id: python-cmd-key-get
  desc: Python get reads cmd key with default
  conf: 0.92
  if:
    type: text
    regex: \b[A-Za-z_][A-Za-z0-9_]*\.get\(["']cmd["']\s*,
- platforms:
  - unix
  - windows
  id: python-refresh-token-key-get
  desc: Python reads refresh_token JSON key
  conf: 0.94
  if:
    type: text
    regex: \.get\s*\(\s*["']refresh_token["']\s*\)
