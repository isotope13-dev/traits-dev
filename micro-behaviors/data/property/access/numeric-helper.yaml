defaults:
  platforms: [windows, unix]
traits:
  - id: repeated-numeric-helper-property-keys
    desc: Numeric helper calls supply property keys
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, svg]
    count_min: 2
    if:
      type: text
      regex: '[\w$]{1,24}\[\s*[A-Za-z_$][\w$]{1,24}\(\s*\d{2,3}(\s*,\s*\d{2,3}){2,}\s*\)\s*\]'
