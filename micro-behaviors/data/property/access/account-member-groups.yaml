defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: identity-name-member-references
  desc: References an explicit user-name field
  any:
  - id: micro-behaviors/data/property/access::first-name-member-access
  - id: micro-behaviors/data/property/access::last-name-member-access
  - id: micro-behaviors/data/property/access::js-user-name-member
- id: identity-email-member-references
  desc: References a user-email field
  any:
  - id: metadata/file/string/account::user-email-label
  - id: micro-behaviors/data/property/access::js-email-address-member
  - id: micro-behaviors/data/property/access::js-primary-email-member
  - id: micro-behaviors/data/property/access::js-work-email-member
