defaults:
  platforms:
  - windows
  - unix
  conf: 0.9
traits:
- for:
  - binaries
  - python
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  crit: baseline
  id: result-dot-member-read
  desc: Reads result through dot or arrow access
  if:
    type: text
    regex: (?i)\b[A-Za-z_$][\w$]{0,63}\s*(->|\.)\s*result\b
- for:
  - binaries
  - python
  - php
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  crit: component
  id: result-subscript-member-read
  desc: Reads bracketed result from an object
  if:
    type: text
    regex: (?i)\b[A-Za-z_$][\w$]{0,63}\s*\[\s*\\?["']result\\?["']\s*\]
composite_rules:
- for:
  - binaries
  - python
  - php
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  crit: component
  id: result-member-read
  desc: Reads a result member from an object
  any:
  - id: micro-behaviors/data/property/access::result-dot-member-read
  - id: micro-behaviors/data/property/access::result-subscript-member-read
