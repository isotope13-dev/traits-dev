defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: socket-session-id-member
  desc: Socket or session identifier member access
  crit: component
  conf: 0.85
  if:
    type: symbol
    kind: member
    regex: (^|\.)(socketId|sessionId|session_id)$
- id: result-code-script-property
  desc: Result or response code/script member access
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: member
    regex: ^(result|response)\.(code|script)$
