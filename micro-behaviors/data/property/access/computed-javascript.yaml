defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: js-this-bracket-access
  desc: Accesses a property on this via brackets
  crit: notable
  conf: 0.8
  if:
    type: tree-sitter
    language: javascript
    query: |
      (subscript_expression
        object: (this)) @access
  unless:
  - id: well-known/lib/web/jquery::license-url
  - id: well-known/lib/web/prototype::copyright
- id: js-computed-property-alias
  desc: Binds computed property to variable
  crit: baseline
  conf: 0.75
  if:
    type: text
    regex: var\s+[A-Za-z_$][A-Za-z0-9_$]*\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\[[A-Za-z_$][A-Za-z0-9_$]*\]
  unless:
  - id: metadata/build/bundler/wrapper::babel-transpiled
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
- id: js-this-identifier-concat-key
  desc: Computed this key adds multiple identifiers
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: this\[\w+\+\w+\+\w+\+\w+
