defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: payload-encoded-member
    desc: Reads the payload encoded member
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: member
      exact: payload.encoded

  - id: payload-encoded-text
    desc: References the encoded payload member
    crit: notable
    for: [makefile]
    if:
      type: text
      substr: 'payload.encoded'
