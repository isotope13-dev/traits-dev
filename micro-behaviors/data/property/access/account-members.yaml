defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: js-user-name-member
  desc: References a userName object member
  if:
    type: symbol
    kind: member
    regex: \.userName$
- id: js-email-address-member
  desc: References a emailAddress object member
  if:
    type: symbol
    kind: member
    regex: \.emailAddress$
- id: js-primary-email-member
  desc: References a primaryEmail object member
  if:
    type: symbol
    kind: member
    regex: \.primaryEmail$
- id: js-work-email-member
  desc: References a workEmail object member
  if:
    type: symbol
    kind: member
    regex: \.workEmail$
