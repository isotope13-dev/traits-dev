# Structural indicators of reading a computed property; they do not establish
# untrusted input or an unguarded prototype setter.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]

traits:
  - id: js-indexed-object-traversal
    desc: Traverses an object through a computed property
    crit: component
    if:
      type: text
      regex: '\b[$A-Za-z_][\w$]*\s*=\s*[$A-Za-z_][\w$]*\s*\[\s*[$A-Za-z_][\w$]*\s*\]'
