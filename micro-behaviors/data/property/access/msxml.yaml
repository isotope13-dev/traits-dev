defaults:
  platforms:
  - windows
  crit: notable
traits:
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  - mp3
  - text
  id: msxml-node-typed-value
  desc: References XML nodeTypedValue property
  conf: 0.9
  if:
    type: text
    substr: nodeTypedValue
    case_insensitive: true
- for:
  - oledoc
  - ooxml
  id: node-typed-value-in-document
  desc: nodeTypedValue reference in document bytes
  conf: 0.94
  if:
    type: raw
    regex: (?i)NodeTypedValue
  unless:
  - id: well-known/tool/offensive/metasploit::framework-context
