defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, php, python, ruby]
  crit: notable
  conf: 0.9

traits:
  # A parameter named body/json need not originate in an HTTP request.
  - id: container-target-member-access
    desc: References target/host/URL/IP container member
    if:
      type: symbol
      kind: member
      regex: '(POST|REQUEST|(?i:body|form|json|params))\.(?i:target|host|url|ip(_address)?)$'
