defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, php, python, ruby]
  crit: notable
  conf: 0.9

traits:
  # A parameter named body/json need not originate in an HTTP request.
  - id: request-shaped-target-member
    desc: Reads target field on request-shaped object
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|json|params)\.(target|host|url|ip(_address)?)$'
