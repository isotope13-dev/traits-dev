defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: device-id-identifier-reference
    crit: notable
    desc: References a deviceId or $device_id identifier
    conf: 0.88
    if:
      type: text
      regex: '\$device_id|\bdeviceId\b'
    unless:
      - id: well-known/lib/media/regula-facesdk/
