defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: webextension-bookmarks-member
    desc: References a WebExtension bookmarks API member
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      regex: '^(chrome|browser)\.bookmarks\.[A-Za-z_]'
