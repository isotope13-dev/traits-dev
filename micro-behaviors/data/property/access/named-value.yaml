defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: input-form-option-value-member-read
    desc: Reads value/innerText on input/form/option
    if:
      type: symbol
      kind: member
      regex: '(^|\.)(input|option|form)\.(value|innerText)$'
