defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-anthropic-key-value-read
    desc: Copies an Anthropic API key property value
    conf: 0.97
    # Member facts include assignment destinations. Inspect expression shape
    # here so writing a user-supplied key cannot satisfy the read evidence.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ([
          (variable_declarator
            value: (member_expression
              property: (property_identifier) @property))
          (ternary_expression
            consequence: (member_expression
              property: (property_identifier) @property))
        ] @read
        (#eq? @property "ANTHROPIC_API_KEY"))

  - id: js-key-probe-before-origin-report
    desc: Passes key before returning origin comparison
    conf: 0.98
    # Match control order and local bindings, not status/helper/variable names.
    # The body admits declarations, then a nonempty-key probe, then a return.
    # An origin guard, consent prompt, or early return breaks this shape.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((function_declaration
          body: (statement_block
            . (lexical_declaration)*
            . (lexical_declaration
                (variable_declarator
                  name: (identifier) @key
                  value: (ternary_expression
                    consequence: (member_expression
                      object: (identifier) @env
                      property: (property_identifier) @key_property))))
            . (lexical_declaration
                (variable_declarator name: (identifier) @valid value: (null)))
            . (if_statement
                condition: (parenthesized_expression
                  (binary_expression
                    left: (identifier) @tested_key
                    operator: ["!==" "!="]
                    right: (string) @empty))
                consequence: (statement_block
                  . (lexical_declaration
                      (variable_declarator
                        name: (identifier) @reply
                        value: (await_expression
                          (call_expression
                            function: (identifier)
                            arguments: (arguments . (identifier) @passed_key .)))))
                  . (expression_statement
                      (assignment_expression
                        left: (identifier) @assigned_valid
                        right: (member_expression object: (identifier) @reply_read)))
                  .))
            . (return_statement
                (object
                  (pair value: (binary_expression
                    left: (member_expression
                      object: (identifier) @compared_env
                      property: (property_identifier) @origin_property)
                    operator: ["===" "=="]
                    right: (identifier)))
                  [
                    (pair value: (identifier) @returned_valid)
                    (shorthand_property_identifier) @returned_valid
                  ]))
            .)) @probe
          (#eq? @key_property "ANTHROPIC_API_KEY")
          (#eq? @origin_property "ANTHROPIC_BASE_URL")
          (#eq? @key @tested_key)
          (#eq? @key @passed_key)
          (#eq? @env @compared_env)
          (#eq? @valid @assigned_valid)
          (#eq? @valid @returned_valid)
          (#eq? @reply @reply_read)
          (#match? @empty "^['\"][\"']$"))
