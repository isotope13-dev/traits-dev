defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: event-target-value-member
    desc: Reads event or target value/text member
    if:
      type: symbol
      kind: member
      regex: '(event|evt|target)\.(value|innerText)$'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
