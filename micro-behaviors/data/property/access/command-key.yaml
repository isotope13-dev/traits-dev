defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: mapping-command-key-read
    desc: Reads a cmd or command mapping key
    crit: notable
    conf: 0.94
    if:
      type: text
      # The subscript must follow a value (`msg["cmd"]`); a bare array literal
      # such as LSP's `resolveSupport={properties:["command"]}` is not a read.
      regex: '(\.get\(\s*["''](cmd|command)["'']\s*\)|[\w)\]]\[\s*["''](cmd|command)["'']\s*\])'

