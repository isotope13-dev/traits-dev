defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: mapping-command-key-access
    desc: Indexes or gets a cmd/command mapping key
    crit: notable
    conf: 0.94
    if:
      type: text
      # The subscript must follow a value (`msg["cmd"]`); a bare array literal
      # such as LSP's `resolveSupport={properties:["command"]}` does not index a mapping.
      regex: '(\.get\(\s*["''](cmd|command)["'']\s*\)|[\w)\]]\[\s*["''](cmd|command)["'']\s*\])'

