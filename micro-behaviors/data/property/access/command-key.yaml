defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: mapping-command-key-access
    desc: Indexes or gets a cmd/command mapping key
    crit: notable
    conf: 0.94
    if:
      type: text
      # The subscript must follow a value (`msg["cmd"]`); a bare array literal
      # such as LSP's `resolveSupport={properties:["command"]}` does not index a mapping.
      regex: '(\.get\(\s*["''](cmd|command)["'']\s*\)|[\w)\]]\[\s*["''](cmd|command)["'']\s*\])'

  # json_decode() without the assoc flag returns an object, so a PHP reply
  # field is read as `$reply->cmd` rather than `$reply["cmd"]`. `$this->cmd` is
  # an ordinary class property and is excluded.
  - id: php-object-command-property
    desc: Reads a cmd/command property from an object
    for: [php]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$\w{1,40}->(cmd|command)\b'
      not:
        - '$this->'
