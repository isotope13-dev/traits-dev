defaults:
  platforms: [unix, windows]
traits:
  - id: request-like-target-member
    desc: Reads request-like target, host, URL or IP
    crit: notable
    conf: 0.9
    for: [javascript, typescript, php, python, ruby]
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|json|params)\.(target|host|url|ip(_address)?)$'

