defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: js-provider-computed-forwarding
  desc: Accesses a provider through a computed property
  conf: 0.9
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]*Provider\s*\[[A-Za-z_$][\w$]*\]
- id: js-deferred-member-forward
  desc: Promise callback returns computed member
  conf: 0.88
  if:
    type: text
    regex: \.then\s*\(\s*\(?[$\w]+\)?\s*=>\s*[$\w]+\s*\[\s*[$A-Za-z_]\w*\s*\]
