defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
traits:
- id: php-server-key-config-field
  desc: Reads a server decryption key from configuration
  conf: 0.93
  if:
    type: text
    regex: \[\s*["'](server_?key|decrypt(ion)?_?key|traffic_?key)["']\s*\]
- id: php-url-server-endpoint-key-reference
  desc: References URL, server or endpoint array key
  conf: 0.9
  if:
    type: text
    regex: \[\s*["'](urls?|servers?|endpoints?)["']\s*\]
