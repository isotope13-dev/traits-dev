defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 2097152
traits:
  - id: function-property-key-from-permutation-prefix
    desc: Function property uses a transformed prefix
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (function_declaration name: (identifier) @transform_definition)
          .
          (_ (variable_declarator name: (identifier) @key
            value: (call_expression
              function: (member_expression
                object: (call_expression function: (identifier) @transform_call
                  arguments: (arguments (string) @key_material))
                property: (property_identifier) @prefix)
              arguments: (arguments (number) @start (_)))))
          .
          [(variable_declaration) (lexical_declaration)]*
          .
          (_ (variable_declarator value: (subscript_expression
            object: (identifier) @transform_use
            index: (identifier) @key_use) @evidence)))
          (#eq? @transform_definition @transform_call)
          (#eq? @transform_call @transform_use)
          (#eq? @key @key_use)
          (#match? @prefix "^(substr|substring|slice)$")
          (#match? @start "^(0|0x0)$")
          (#match? @key_material "(?s)^.{16,}$")
          (#set! cleave.ignore-comments "true"))
