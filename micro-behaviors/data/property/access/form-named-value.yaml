defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
traits:
  - id: form-named-value-member
    desc: Value or innerText member on input/option/form
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      regex: '(^|\.)(input|option|form)\.(value|innerText)$'
