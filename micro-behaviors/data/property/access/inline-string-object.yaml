# Inline object member access is not inherently obfuscation.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9
  for: [javascript]
traits:
  - id: inline-string-object-member-access
    desc: Inline string object member access
    if:
      type: text
      # Require a path/URL-ish character in the string value so build-time
      # define stubs such as {IS_KIBANA_DISTRIBUTABLE:"true"}.NODE_DEBUG
      # (process.env replacement) do not match this string-bearing member observation.
      regex: '([=(,:;])\{[A-Za-z_$]\w*:\s*[''"][\w]*[./:$-][\w./:$-]{2,38}[''"]\}\.\w+'
      not:
        # Bundler-inlined version stamps: `require('../package.json')`
        # becomes `{version:"6.5.4"}.version` (the elliptic copy inside
        # dist bundles). A dotted-numeric value is a version, not a
        # recovered string.
        - regex: '[''"]\d+(\.\d+){2}[''"]'
    unless:
      - type: text
        regex: '\{\s*content\s*:'
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/package/testing/presence/snapshot::snapshot-file
