# Neutral observations; consumers must supply any obfuscation interpretation.
traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: hex-key-indexing-cluster
  desc: Repeated indexing with hexadecimal keys
  crit: notable
  conf: 0.85
  count_min: 5
  per_kb_min: 0.3
  if:
    type: text
    regex: \w+\[\s*0x[0-9a-fA-F]{2,}\s*\]
  not:
  - regex: (?i)pdfdocencoding
  unless:
  - type: text
    substr: FuelAsm.
  - type: text
    substr: ESCAPE_SEQUENCES
  - id: metadata/file/extension/identity::c3-source-basename
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  id: identifier-plus-hex-index
  desc: Indexed access with identifier plus hex
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: \w+\[\s*\w+\s*\+\s*0x[0-9a-fA-F]+\s*\]
  unless:
  - type: path
    regex: \.(c|cc|cpp|cxx|h|hh|hpp|hxx|inl|inc)$
