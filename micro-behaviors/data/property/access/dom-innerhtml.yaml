defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.96
traits:
  - id: dom-dataset-store-read
    desc: References a dataset property member
    # Staging kits park payload fragments in hidden elements' data-store
    # attributes and harvest them at runtime; the read itself is neutral.
    # Other dataset properties also match; SQL examples in comments do not.
    if:
      type: text
      regex: '\.dataset\.[a-zA-Z0-9_$]+\b'
      exclude_comments: true
