defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.96
traits:
  - id: dom-innerhtml-access
    desc: Accesses an element's innerHTML by identifier
    if:
      type: text
      regex: 'document\.getElementById\([^\r\n)]{1,100}\)\.innerHTML'
  - id: dom-dataset-store-read
    desc: Reads an element's dataset store property
    # Staging kits park payload fragments in hidden elements' data-store
    # attributes and harvest them at runtime; the read itself is neutral.
    if:
      type: text
      regex: '\.dataset\.store\b'
