defaults:
  platforms: [unix, windows]
traits:
  - id: property-value-local-assignment
    desc: Value property assigned to a local variable
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(const|let|var)\s+\w+\s*=\s*\w+\.value(\.trim\(\))?'
