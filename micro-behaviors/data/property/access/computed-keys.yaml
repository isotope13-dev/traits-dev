# Generic call/access syntax does not establish decoding, overwrite or shell execution.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: js-addition-indexed-access
  desc: Computed property access with addition
  conf: 0.95
  if:
    type: tree-sitter
    language: javascript
    query: "(subscript_expression\n  index: (binary_expression\n    operator: \"+\"\n  )\n) @access\n"
  unless:
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
# The bounds-check-elimination probe shape: an element access whose index
# passes through an int32 overflow wrap before truncation (`(idx +
# 0x80000000) | 0`). The wrap sits in subscript position, so ordinary hash
# mixing and PRNG state updates do not match. The access may be a read or a
# write; the out-of-bounds claim is assembled only by the browser-JIT
# exploit composites that pair it with a staged victim buffer or a memory
# primitive.
- id: js-wraparound-index-access
  desc: Computed access with int32-wraparound index
  crit: suspicious
  conf: 0.92
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
  if:
    type: text
    exclude_comments: true
    case_insensitive: true
    regex: '\[\s*\(?\s*\w+\s*\+\s*(0x(7f{7}|80000000)|214748364[78])\)?\s*(\|\s*0|>>\s*0)\]'
- id: wscript-function-key-prefix
  desc: WScript function-expression key prefix
  conf: 0.9
  if:
    type: text
    regex: WScript\s*\[\s*\(function
- id: wscript-bracket-member-access
  desc: WScript bracket-member access
  conf: 0.95
  if:
    type: text
    regex: WScript\s*\[
