defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: value-property-direct-reporting-call
    desc: Passes value property to a reporting callback
    crit: notable
    conf: 0.96
    if:
      # Call arguments expose only an expression shape, so inspect the member.
      # A value assignment elsewhere cannot stand in for this argument.
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            (member_expression
              property: (property_identifier) @property))) @call
          (#eq? @property "value")
          (#match? @callee "(?i)(send|report|collect|track)"))

  - id: trimmed-value-timer-reporting-call
    desc: Reports trimmed value through timer callback
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @source
              value: (call_expression
                function: (member_expression
                  object: (member_expression
                    property: (property_identifier) @value)
                  property: (property_identifier) @trim))))
          (expression_statement
            (assignment_expression
              right: (call_expression
              function: (identifier) @timer
              arguments: (arguments
                (arrow_function
                  body: (statement_block
                    (expression_statement
                      (call_expression
                        function: (identifier) @callee
                        arguments: (arguments
                          (object
                            (pair
                              key: (property_identifier) @key
                              value: (identifier) @sent)))))))))))) @block
          (#eq? @value "value")
          (#eq? @trim "trim")
          (#eq? @timer "setTimeout")
          (#eq? @key "data")
          (#eq? @source @sent)
          (#match? @callee "(?i)(send|report|collect|track)"))
  - id: value-alias-timer-reporting-call
    desc: Reports value alias through timer callback
    crit: notable
    conf: 0.96
    if:
      # Bind the local value read to the identifier actually passed as data.
      # An unrelated value read and reporting call cannot satisfy this query.
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @source
              value: (member_expression
                property: (property_identifier) @value)))
          (expression_statement
            (assignment_expression
              right: (call_expression
                function: (identifier) @timer
                arguments: (arguments
                  (arrow_function
                    body: (statement_block
                      (expression_statement
                        (call_expression
                          function: (identifier) @callee
                          arguments: (arguments
                            (object
                              (pair
                                key: (property_identifier) @key
                                value: (identifier) @sent)))))))))))) @block
          (#eq? @value "value")
          (#eq? @timer "setTimeout")
          (#eq? @key "data")
          (#eq? @source @sent)
          (#match? @callee "(?i)(send|report|collect|track)"))

  - id: password-field-values-collected-joined
    desc: Collects password values into joined string
    crit: notable
    conf: 0.93
    if:
      # Keylogger aggregation: password-selected inputs have each trimmed
      # value read inside an element loop, and the collected values are
      # joined for bulk reporting. Bind the loop parameter to the value
      # read; an unrelated join beside a password form cannot satisfy this.
      # Terse single-identifier arrows (`inp =>`) bind on the singular
      # `parameter` field, and `?.` chains parse as plain member nesting.
      type: tree-sitter
      query: |
        ((function_declaration body:
            (statement_block
              (lexical_declaration
                (variable_declarator value:
                  (call_expression function:
                    (member_expression property:
                      (property_identifier) @query) arguments:
                    (arguments
                      (string
                        (string_fragment) @kind)))))
              (expression_statement
                (call_expression function:
                  (member_expression property:
                    (property_identifier) @each) arguments:
                  (arguments
                    (arrow_function parameter:
                      (identifier) @input body:
                      (statement_block
                        (lexical_declaration
                          (variable_declarator value:
                            (call_expression function:
                              (member_expression object:
                                (member_expression object:
                                  (identifier) @source property:
                                  (property_identifier) @value) property:
                                (property_identifier) @trim)))))))))
              (return_statement
                (call_expression function:
                  (member_expression property:
                    (property_identifier) @join)))))
          (#eq? @query "querySelectorAll")
          (#match? @kind "(?i)password")
          (#eq? @source @input)
          (#eq? @each "forEach")
          (#eq? @value "value")
          (#eq? @trim "trim")
          (#eq? @join "join"))

composite_rules:
  - id: value-property-reporting-call
    desc: Passes value property to a reporting callback
    crit: notable
    conf: 0.96
    any:
      - id: value-property-direct-reporting-call
      - id: trimmed-value-timer-reporting-call
      - id: value-alias-timer-reporting-call

  # A generic function parameter's .value is not evidence of browser input.
  # Preserve the generic reporting observations above, but require a DOM
  # event registration before using them as the wallet composite's source.
  # This records co-occurrence, not a cross-function value-flow proof.
  # Aggregation already requires a password-input DOM selector and reads
  # each selected element's value; it need not use an event listener. The
  # direct-pass shape needs the same DOM selector: seed fields selected in
  # the file, their .value read, and a collector named for telemetry
  # receiving the data object.
  - id: dom-value-report-channel
    desc: DOM event reporting, joined values, or collector data calls
    crit: notable
    conf: 0.96
    scope: file
    any:
      - id: micro-behaviors/ui/window/form-input::dom-event-value-reporting-call
      - id: micro-behaviors/data/property/access::password-field-values-collected-joined
      - id: micro-behaviors/ui/controls/wallet::seed-field-values-collector-call
