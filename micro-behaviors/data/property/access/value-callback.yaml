defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: value-property-direct-reporting-call
    desc: Passes value property to a reporting callback
    crit: notable
    conf: 0.96
    if:
      # Call arguments expose only an expression shape, so inspect the member.
      # A value assignment elsewhere cannot stand in for this argument.
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            (member_expression
              property: (property_identifier) @property))) @call
          (#eq? @property "value")
          (#match? @callee "(?i)(send|report|collect|track)"))

  - id: trimmed-value-timer-reporting-call
    desc: Reports trimmed value through timer callback
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @source
              value: (call_expression
                function: (member_expression
                  object: (member_expression
                    property: (property_identifier) @value)
                  property: (property_identifier) @trim))))
          (expression_statement
            (assignment_expression
              right: (call_expression
              function: (identifier) @timer
              arguments: (arguments
                (arrow_function
                  body: (statement_block
                    (expression_statement
                      (call_expression
                        function: (identifier) @callee
                        arguments: (arguments
                          (object
                            (pair
                              key: (property_identifier) @key
                              value: (identifier) @sent)))))))))))) @block
          (#eq? @value "value")
          (#eq? @trim "trim")
          (#eq? @timer "setTimeout")
          (#eq? @key "data")
          (#eq? @source @sent)
          (#match? @callee "(?i)(send|report|collect|track)"))
  - id: value-alias-timer-reporting-call
    desc: Reports value alias through timer callback
    crit: notable
    conf: 0.96
    if:
      # Bind the local value read to the identifier actually passed as data.
      # An unrelated value read and reporting call cannot satisfy this query.
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @source
              value: (member_expression
                property: (property_identifier) @value)))
          (expression_statement
            (assignment_expression
              right: (call_expression
                function: (identifier) @timer
                arguments: (arguments
                  (arrow_function
                    body: (statement_block
                      (expression_statement
                        (call_expression
                          function: (identifier) @callee
                          arguments: (arguments
                            (object
                              (pair
                                key: (property_identifier) @key
                                value: (identifier) @sent)))))))))))) @block
          (#eq? @value "value")
          (#eq? @timer "setTimeout")
          (#eq? @key "data")
          (#eq? @source @sent)
          (#match? @callee "(?i)(send|report|collect|track)"))

composite_rules:
  - id: value-property-reporting-call
    desc: Passes value property to a reporting callback
    crit: notable
    conf: 0.96
    any:
      - id: value-property-direct-reporting-call
      - id: trimmed-value-timer-reporting-call
      - id: value-alias-timer-reporting-call
