defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component

composite_rules:
- id: python-subprocess-result-fields
  desc: Python subprocess result field-name references
  conf: 0.84
  all:
  - id: metadata/import/builtin::python-subprocess-import
  any:
  - id: micro-behaviors/data/property/access::python-exit-code-field-name
  - id: micro-behaviors/process/fd/stdio::python-stderr-stream-name
  - id: micro-behaviors/process/fd/stdio::python-stdout-stream-name
  - id: micro-behaviors/data/property/access::python-returncode-field-name
