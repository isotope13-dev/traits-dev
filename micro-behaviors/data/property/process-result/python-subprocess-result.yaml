defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component

composite_rules:
- id: python-subprocess-result-fields
  desc: Python subprocess result field-name references
  conf: 0.84
  all:
  - id: metadata/import/builtin::python-subprocess-import
  any:
  - id: "metadata/lang/source/naming/setting::python-exit-code-field-name"
  - id: metadata/file/profile/operation-reference::python-stderr-stream-name
  - id: metadata/file/profile/operation-reference::python-stdout-stream-name
  - id: "metadata/lang/source/naming/setting::python-returncode-field-name"
