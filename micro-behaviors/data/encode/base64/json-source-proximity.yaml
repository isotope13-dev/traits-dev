defaults:
  platforms: [unix, windows]
  for: [python, javascript, go, php, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: json-base64-text-proximity-10
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(json\.dumps|ConvertTo-Json).{0,400}(b64encode|ToBase64String)'

  - id: json-base64-text-proximity-11
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(json\.dumps|ConvertTo-Json).{0,400}(base64\.StdEncoding|btoa)'

  - id: json-base64-text-proximity-12
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(json\.Marshal|JSON\.stringify).{0,400}(b64encode|ToBase64String)'

  - id: json-base64-text-proximity-13
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(json\.Marshal|JSON\.stringify).{0,400}(base64\.StdEncoding|btoa)'

  - id: json-base64-text-proximity-14
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(json\.encode).{0,400}(b64encode|ToBase64String|base64\.StdEncoding|btoa)'

  - id: json-base64-text-proximity-16
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(base64\.StdEncoding|btoa).{0,400}(json\.dumps|ConvertTo-Json)'

  - id: json-base64-text-proximity-17
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(b64encode|ToBase64String).{0,400}(json\.Marshal|JSON\.stringify)'

  - id: json-base64-text-proximity-18
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(base64\.StdEncoding|btoa).{0,400}(json\.Marshal|JSON\.stringify)'

composite_rules:
  - id: json-base64-text-proximity
    desc: JSON and Base64 encoding text nearby
    crit: notable
    conf: 0.9
    any:
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-10
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-11
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-12
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-13
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-14
    - id: micro-behaviors/data/encode/base64::base64-json-encoding-proximity
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-16
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-17
    - id: micro-behaviors/data/encode/base64::json-base64-text-proximity-18
    unless:
    - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
    - id: metadata/file/format/source-map::sourcemap-sources-content
    # Inline `//# sourceMappingURL=data:application/json;...;base64,` — a bundler
    # source map, not a masqueraded HTTP body. Previously a local duplicate of this
    # matcher lived here at `crit: notable` with the desc "Regex component marker",
    # which surfaced in triage as a meaningless evasion/masquerade finding on any
    # bundled JS. Use the canonical metadata marker instead.
    - id: metadata/file/format/source-map::sourcemap-inline-base64
    not:
    - substr: 'from"./chunk-'
    - substr: 'btoa(unescape(encodeURIComponent'
    - substr: 'http://example.com/ffmpeg-core.js#{btoa(JSON.stringify({'
    - substr: 'createResponse(t,o,n){let a={from:'
    - substr: 'payload:JSON.stringify({method:n,path:a,body:p,headers:i})'
