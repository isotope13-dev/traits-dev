defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: component
  conf: 0.78
traits:
  - id: dotnet-to-base64string
    desc: .NET Base64 encoding method reference
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ToBase64String$'
  - id: dotnet-to-base64string-text
    desc: .NET Base64 encoder name in binary text
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ToBase64String
