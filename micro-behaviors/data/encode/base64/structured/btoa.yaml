defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: btoa-basic-auth-header
    desc: Base64 Basic-auth credential encoding
    conf: 0.95
    if:
      type: text
      regex: "btoa\\s*\\([^)]{0,100}\\+\\s*[\"']:[\"']"

  - id: btoa-page-origin
    desc: Base64-encodes a page origin value
    conf: 0.94
    if:
      type: text
      regex: 'btoa\s*\(\s*(origin|pageUrl|location\.href)\s*\)'
