# JSON::PP followed closely by MIME::Base64 encoding: Perl code that packs
# Base64 values into JSON. Common in APIs and tests; exfiltration composites
# add the secret sources and HTTP sink that make it a theft.
defaults:
  platforms: [unix, netbsd, windows]
  for: [perl]
traits:
  - id: perl-json-pp-base64-encode
    desc: Perl encodes Base64 values with JSON::PP
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'JSON::PP[\s\S]{0,260}encode_base64'
