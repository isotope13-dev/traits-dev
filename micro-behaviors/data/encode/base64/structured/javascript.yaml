defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0026
  crit: notable
  conf: 0.85

traits:
  - id: node-template-image-data-url
    desc: Image data URL with interpolated Base64
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'data:\$\{[^}]{0,40}\};base64,\$\{'
  - id: json-stringify-base64
    desc: JSON stringify near Base64 conversion
    if:
      type: text
      regex: 'JSON\.stringify.{0,120}toString\(["'']base64["'']'
    not:
      - substr: 'JSON.stringify({["crossref-index-file"]:"index.json"'
      - substr: 'JSON.stringify(val)).toString("base64"'
      - substr: "JSON.stringify(this.sourcemap"
      - substr: 'JSON.stringify(":base64:"+e.toString("base64"'
      - substr: 'JSON.stringify(":base64:"+t.toString("base64"'
      - substr: 'JSON.stringify(Ke),"utf8").toString("base64"'
      - substr: 'K.alg==='
      - substr: 'K.kid'
composite_rules:
  - id: node-json-buffer-base64-encode
    desc: Serializes JSON into a Node.js Buffer and Base64-encodes it
    crit: notable
    conf: 0.94
    for: [javascript]
    near_bytes: 600
    all:
      - id: micro-behaviors/data/buffer/alloc::node-buffer-from-json-stringify
      - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
