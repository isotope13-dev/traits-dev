defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
- id: node-json-base64-with-host-query
  desc: JSON Base64 encoding beside host identity query
  crit: notable
  conf: 0.96
  near_bytes: 800
  all:
    - id: micro-behaviors/data/encode/base64::node-json-buffer-base64-encode
  any:
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
    - id: micro-behaviors/process/identity/query::os-userinfo-call
    # cwd is path context, not host identity; build tools commonly encode it
    - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
  unless:
    # GitHub Contents API create/update requires base64 file bodies in JSON.
    - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
