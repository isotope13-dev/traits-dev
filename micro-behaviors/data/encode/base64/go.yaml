defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe, wasm]
  crit: baseline
traits:
  - id: encoding-base64-import
    desc: encoding/base64 package import
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: encoding/base64
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiled/
  - id: go-base64-encode-call
    desc: Go calls a base64 encoding method
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: symbol
      kind: call
      regex: 'base64\.[A-Za-z0-9_]+Encoding\.(Encode|EncodeToString|AppendEncode)$'
  - id: go-base64-encode-binary
    desc: Go binary base64 EncodeToString method
    crit: notable
    conf: 0.75
    for: [elf, macho, pe, wasm]
    if:
      type: text
      regex: 'encoding/base64\.\(\*Encoding\)\.EncodeToString'
composite_rules:
  - id: go-base64-encode
    desc: Go base64 encoding
    crit: notable
    conf: 0.85
    any:
      - id: go-base64-encode-call
      - id: go-base64-encode-binary
