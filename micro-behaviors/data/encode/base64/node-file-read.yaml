defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-file-read-base64-output
    desc: File read requests Base64 output
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readFile$'
      arg:
        index: 1
        from:
          field: encoding
          value: '^base64$'
