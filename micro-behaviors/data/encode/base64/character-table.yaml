defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: base64-shifted-character-encoder
    desc: Base64 alphabet near shifted character lookup
    # Unlike an alphabet alone, shifting an input byte right by two before
    # selecting a character is the first sextet of Base64 encoding. Describe
    # the bounded co-occurrence rather than claiming interprocedural flow.
    near_bytes: 1800
    all:
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
      - id: micro-behaviors/data/string/access::char-at-right-shift-two
