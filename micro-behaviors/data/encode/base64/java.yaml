defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
traits:
  - id: java-base64-encode
    desc: Java Base64 encoding
    crit: notable
    conf: 0.8
    for: [java, kotlin]
    if:
      type: text
      regex: '(java\.util\.)?Base64\.getEncoder\(\)[\s\S]{0,160}encodeToString'
  - id: jvm-base64-encode-bytecode
    desc: JVM Base64 encodeToString call
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: import
      exact: java/util/Base64$Encoder.encodeToString
  - id: android-base64-class-reference
    desc: Android Base64 API reference
    crit: notable
    conf: 0.84
    platforms: [android]
    for: [apk]
    if:
      type: text
      substr: Landroid/util/Base64;
