defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
traits:
  - id: java-base64-encode
    desc: Java Base64 encoding
    crit: notable
    conf: 0.8
    for: [java, kotlin]
    if:
      type: text
      regex: '(java\.util\.)?Base64\.getEncoder\(\)[\s\S]{0,160}encodeToString'
  - id: jvm-base64-encode-bytecode
    desc: JVM Base64 encodeToString call
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: import
      exact: java/util/Base64$Encoder.encodeToString
  - id: android-base64-class-reference
    desc: Android Base64 API reference
    crit: notable
    conf: 0.84
    platforms: [android]
    for: [apk, dex]
    if:
      type: text
      substr: Landroid/util/Base64;
  - id: android-base64-url-safe-flag
    desc: Uses Android Base64 URL_SAFE flag
    crit: notable
    conf: 0.94
    platforms: [android]
    for: [javascript, typescript, java, kotlin]
    if:
      type: text
      regex: '\b(android\.util\.)?Base64\.URL_SAFE\b'
  - id: android-base64-no-padding-flag
    desc: Uses Android Base64 NO_PADDING flag
    crit: notable
    conf: 0.94
    platforms: [android]
    for: [javascript, typescript, java, kotlin]
    if:
      type: text
      regex: '\b(android\.util\.)?Base64\.NO_PADDING\b'
  - id: android-base64-url-safe-mask
    desc: Uses Android URL-safe Base64 flag mask
    crit: notable
    conf: 0.92
    platforms: [android]
    for: [javascript, typescript, java, kotlin]
    if:
      type: text
      regex: 'Base64\.[^(]{1,24}\([^\n)]{1,120},\s*1\s*\|\s*2\s*\|\s*8\b'
