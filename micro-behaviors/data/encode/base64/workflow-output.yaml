defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-shell-base64-stdout
    desc: Shell pipeline emits Base64 to workflow log
    if:
      type: text
      regex: '(?m)\| *base64( +-w *\d+)? *$'

  - id: gha-python-base64-stdout
    desc: Python prints Base64 encoded data
    if:
      type: text
      regex: '(?m)^[ \t]*print\(base64\.b64encode\([^;\r\n]{1,180}\)\.decode\(\)\) *$'

  - id: gha-node-base64-stdout
    desc: Node prints Base64 encoded buffer
    if:
      type: text
      regex: '(?m)^ *console\.log\(Buffer\.from\(.{1,200}\.toString\([''"]base64[''"]\)\);? *$'

