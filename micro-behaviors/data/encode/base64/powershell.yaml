# Base64 encoding in PowerShell
defaults:
  platforms: [windows]
  for: [scripts, source, markdown, text]
  crit: notable
  conf: 0.9
traits:
  - id: to-base64-string
    desc: PowerShell Base64 conversion expression
    if:
      type: text
      regex: '(?i)\[(System\.)?Convert\]::\s*ToBase64String'
