# Retained observation; matcher and effective scope unchanged.
traits:
- platforms:
  - macos
  for:
  - scripts
  - source
  - class
  - java_class
  - jar
  id: cookie-store-base64-pipe
  desc: Cookie store piped into base64 encoder
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: Cookies.{0,80}\|\s*base64
