defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: ruby-encoded-actions-expression-output
    desc: Ruby prints an encoded Actions expression
    # This is an stdout sink, not a credential-source predicate: github.ref
    # and other ordinary expressions satisfy it too. A consumer must bind
    # the sensitive source on the same executable line.
    if:
      type: text
      regex: '(?m)^ *puts Base64\.(strict_)?encode64\([''"]\$\{\{[^;#\n]{1,80}}}[''"]\)$'
