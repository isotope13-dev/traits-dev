defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0026
  crit: notable
  conf: 0.85

traits:
  - id: node-buffer-base64-encode
    desc: Encodes Node.js Buffer output as Base64
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: Buffer.from.toString
      arg:
        kind: string
        exact: base64
  - id: shell-embedded-buffer-base64-encode
    desc: Embedded Node Buffer Base64 encoding
    crit: notable
    conf: 0.95
    mbc: C0025
    for: [shell]
    if:
      type: text
      regex: 'Buffer\.from\([^)]{0,240}\)\.toString\(\s*["'']base64["'']\s*\)'
