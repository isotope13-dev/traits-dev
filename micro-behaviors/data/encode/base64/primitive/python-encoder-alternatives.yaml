defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: python-base64-encoder-alternatives
    desc: Python Base64 encoder alternatives
    crit: component
    for:
      - python
    any:
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
      - id: micro-behaviors/data/encode/base64/primitive::encodestring-call
      - id: micro-behaviors/data/encode/base64/primitive::encodebytes-call
