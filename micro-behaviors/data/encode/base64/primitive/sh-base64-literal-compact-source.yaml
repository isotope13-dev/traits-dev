defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
composite_rules:
  - id: sh-base64-literal-compact-source
    desc: Base64 literal in compact shell source
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
      - id: metadata/lang/source/comment::no-comments-code
    any:
      - id: metadata/file/line::single-long-line
    unless:
      - id: metadata/file/format/structured::valid
