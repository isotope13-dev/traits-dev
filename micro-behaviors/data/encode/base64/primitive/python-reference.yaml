# Preserve the text-only reference used by source and text consumers.
# An occurrence alone does not establish host profiling or an invocation.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  crit: notable

traits:
  - id: python-b64encode-text
    desc: References Python base64.b64encode
    conf: 0.9
    if:
      type: text
      substr: 'base64.b64encode'
