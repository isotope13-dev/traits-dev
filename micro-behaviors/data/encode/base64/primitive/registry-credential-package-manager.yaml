defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: project-snapshot-npmrc-text-branch
  desc: npmrc suffix near Base64 conversion
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: endsWith\("\.npmrc"\)[\s\S]{0,160}toString\("base64"\)

composite_rules:
- id: creds-base64-encode
  desc: Credential path and Base64 clues
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/credential::credentials-path-tail
  any:
  - id: micro-behaviors/data/encode/base64/primitive::base64-encoding
  - id: micro-behaviors/data/encode/base64/primitive::btoa-symbol
  near_bytes: 300
  unless:
  - id: well-known/lib/runtime/scripted/node-runtime::bundled-npm-source
  downgrade:
    any:
    - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
    - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-imds-provider
    - id: well-known/lib/cloud/aws-sdk-js::v3-http-credential-provider-impl
    - id: well-known/lib/cloud/aws-sdk-js::v3-runtime-context-marker
    - id: well-known/lib/cloud/aws-sdk-js::v3-credential-provider-debug-prefix
- id: npmrc-base64-encode
  desc: Reads NPM config near Base64 encoding
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
  - id: micro-behaviors/fs/read/file/content/unspecified::file-content-read-operation
  any:
  - id: micro-behaviors/data/encode/base64/primitive::base64-encoding
  - id: micro-behaviors/data/encode/base64/primitive::btoa-symbol
  near_bytes: 300
  unless:
  - id: well-known/tool/development/lint/dprint::dprint-cli
  - id: micro-behaviors/data/encode/base64/primitive::project-snapshot-npmrc-text-branch
  - id: metadata/path/directory::test-directory-component
- id: cred-base64-encode
  desc: Credential path and encoding clues
  crit: suspicious
  conf: 0.85
  any:
  - id: micro-behaviors/data/encode/base64/primitive::creds-base64-encode
  - id: micro-behaviors/data/encode/base64/primitive::npmrc-base64-encode
  - id: micro-behaviors/data/encode/base64/content::pypirc-base64-encode
