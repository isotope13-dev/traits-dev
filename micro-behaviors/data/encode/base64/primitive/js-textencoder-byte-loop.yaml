defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable

traits:
  - id: js-only-charcode-is-utf8-base64-encoder
    desc: Sole char-code loop encodes UTF-8 as base64
    conf: 0.96
    if:
      type: yara
      source: |
        rule js_only_charcode_is_utf8_base64_encoder {
          strings:
            $charcode = "String.fromCharCode(" ascii
            $encoder = /function [A-Za-z_$][A-Za-z0-9_$]*\([A-Za-z_$][A-Za-z0-9_$]*\)\{let [^;]{1,100}=new TextEncoder\(\)\.encode\([^;]{1,80};for\([^;]{1,100};[^;]{1,100};[^)]{1,80}\)[^;]{1,80}\+=String\.fromCharCode\([^;]{1,80};return btoa\([^)]{1,80}\)\}/
          condition:
            #charcode == 1 and $encoder
        }
