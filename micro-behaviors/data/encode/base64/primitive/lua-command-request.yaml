defaults:
  platforms: [windows, unix]
  for: [lua]
traits:
  - id: lua-windows-base64-command-request
    desc: Passes encodewinbase64-prefixed command text
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: lua
      query: |
        ((function_call
          name: (_) @callee
          arguments: (arguments
            (binary_expression
              left: (string (string_content) @prefix)
              operator: "..")))
          (#match? @prefix "^encodewinbase64\\s+$")
          (#not-match? @callee "^(print|io\\.write)$")
          (#not-match? @callee "(^|[.:])(log|info|debug)$")
          (#not-match? @callee "(^|[.:])(warn|error)$"))
