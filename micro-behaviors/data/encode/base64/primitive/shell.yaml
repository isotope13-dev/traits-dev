defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.75

traits:
  - id: base64-encode-command
    desc: Shell pipeline text names Base64 encoder
    mbc: C0025
    if:
      type: text
      regex: '(?m)^[ \t]*[^#\s\r\n].{0,240}\|\s*base64\b[^|`\r\n]{0,40}'
    not:
      - regex: '\|\s*base64\s+(-[dD]|--decode)\b'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/file/extension/source::rust-source-extension
      # A same-named shell function shadows the external encoder. A null
      # stdin redirect makes this pipeline stage encode no upstream data.
      - id: metadata/lang/source/naming/function/command::shell-base64-function-name-symbol
      - type: text
        regex: '\|\s*base64\s*<\s*/dev/null\b'
