defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041

traits:
  - id: cicd-release-script-b64encode-marker
    desc: "Base64 encoding of CI release script"
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: "base64.b64encode((Path(__file__).parent / 'scripts' / 'cicd-release.sh')"
