defaults:
  for: [scripts, source, text, data]
  platforms: [windows, unix]
traits:
  - id: powershell-base64-byte-slice
    desc: PowerShell encodes a byte-array slice
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\[(System\.)?Convert\]::\s*ToBase64String\s*\(\s*\$\w+\s*,\s*\$\w+\s*,'
