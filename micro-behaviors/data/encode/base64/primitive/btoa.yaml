defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: btoa-symbol
    desc: Calls a btoa Base64 encoder
    conf: 0.78
    if:
      type: symbol
      kind: call
      exact: btoa
  - id: btoa-call-argument
    desc: Passes btoa as a call argument
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$'
      arg:
        kind: identifier
        name: btoa
  - id: btoa-computed-helper-argument
    desc: Passes btoa to computed helper call
    conf: 0.92
    if:
      type: text
      regex: '\]\(\s*btoa\s*,'
  - id: btoa-utf8-safe-encode
    desc: UTF-8-safe Base64 encoding via btoa()
    conf: 0.88
    # The standard idiom for base64-encoding a Unicode string in the browser.
    # Neutral; exfil/skimmer composites reference it cross-directory alongside an
    # actual exfil sink.
    if:
      type: text
      substr: btoa(unescape(encodeURIComponent(
composite_rules:
  - id: btoa-invocation-surface
    desc: Direct or helper-wrapped btoa invocation
    crit: component
    conf: 0.82
    any:
      - id: btoa-symbol
      - id: btoa-call-argument
      - id: btoa-computed-helper-argument
