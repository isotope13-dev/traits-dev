defaults:
  platforms: [unix, windows]
  for: [python, javascript]
traits:
  - id: b64encode-call
    desc: Encodes data with Python base64.b64encode()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)b64encode$'
    for: [python]
  - id: encodebytes-call
    desc: Calls base64.encodebytes (Python)
    crit: notable
    conf: 0.9
    ref: sha256:3c194dcffee3decd03e434a716b0e71b3d6eb5a21e3e7776c12ef33d50451ce2
    if:
      type: symbol
      regex: '(^|\.)encodebytes$'
    for: [python]
  - id: urlsafe-b64encode-call
    desc: Calls base64.urlsafe_b64encode (Python)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(^|\.)urlsafe_b64encode$'
    for: [python]
  - id: encodestring-call
    desc: Calls base64.encodestring (Python legacy)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(^|\.)encodestring$'
    for: [python]
  - id: binascii-b2a-base64
    desc: Calls binascii.b2a_base64 (Python)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(^|\.)b2a_base64$'
    for: [python]
  - id: std-encoding-encode-string
    desc: base64.StdEncoding.EncodeToString (Go)
    for: [go]
    if:
      type: symbol
      substr: 'base64.StdEncoding.EncodeToString'
  # === PHP ===
  - id: php-base64-encode
    desc: Calls PHP base64_encode()
    crit: notable
    conf: 0.9
    for: [php]
    if:
      type: symbol
      exact: base64_encode
  # === Ruby ===
  - id: ruby-base64-encode-call
    desc: Encodes Base64 data in Ruby
    crit: notable
    conf: 0.9
    for: [ruby]
    if:
      type: text
      regex: '\bBase64\.(strict_)?encode64\s*\('
  - id: ruby-base64-encode-helper-call
    desc: Ruby calls an encode_base64 helper
    crit: notable
    conf: 0.9
    for: [ruby]
    if:
      type: symbol
      kind: call
      regex: '(^|[.])encode_base64$'
  # === JavaScript/TypeScript ===
  - id: js-base64url-alphabet-restore
    desc: JS base64url alphabet restore before atob
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'replace(/_/g,"/")'

  - id: tostring-base64
    desc: Base64 encoding via toString (JS)
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      # Indexed argument facts distinguish real encoding calls from comments
      # and ordinary toString(), without rescanning source with a regex.
      type: symbol
      kind: call
      regex: '(^|\.)toString$'
      arg:
        index: 0
        kind: string
        regex: '^base64(url)?$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/scripted::dts-declaration-file
  - id: base64-chunk-wording
    desc: Base64 near chunk-size wording
    crit: component
    for: [scripts, binaries, powershell]
    conf: 0.9
    if:
      type: text
      regex: (?i)base64.{0,80}(1500|chunk)|(1500|chunk).{0,80}base64
    unless:
      - id: metadata/file/format/source-map::sourcemap-context

composite_rules:
  - id: base64-encoding
    desc: Base64 encoding capability
    crit: notable
    conf: 0.95
    any:
      - id: b64encode-call
      - id: encodebytes-call
      - id: urlsafe-b64encode-call
      - id: encodestring-call
      - id: binascii-b2a-base64
      - id: std-encoding-encode-string
      - id: tostring-base64
      - id: php-base64-encode
      - id: ruby-base64-encode-call
