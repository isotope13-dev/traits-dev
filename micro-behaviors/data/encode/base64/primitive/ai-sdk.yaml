defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: ai-sdk-convert-to-base64-call
    desc: Calls AI SDK Base64 conversion helper
    if:
      type: symbol
      kind: call
      exact: convertToBase64
  - id: ai-sdk-uint8array-to-base64-call
    desc: Calls AI SDK byte-array Base64 encoder
    if:
      type: symbol
      kind: call
      exact: convertUint8ArrayToBase64
