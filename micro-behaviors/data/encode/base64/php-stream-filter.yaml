# The stream URI requests Base64 encoding when interpreted by a PHP-capable
# resolver; its presence does not prove that the scanned host supports PHP.
defaults:
  for: [php, xml, text, data]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: php-stream-base64-encode-filter
    desc: PHP stream requests Base64 encoding
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      substr: 'php://filter/convert.base64-encode/resource='
