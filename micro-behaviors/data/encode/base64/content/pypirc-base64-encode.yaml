defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: pypirc-base64-encode
  desc: pypirc and Base64 call clues
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: tree-sitter
    kind: call
    regex: (?s)base64.{0,320}\.pypirc|\.pypirc.{0,320}base64
