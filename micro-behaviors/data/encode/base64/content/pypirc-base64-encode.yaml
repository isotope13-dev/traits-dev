defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: pypirc-base64-encode
  desc: Base64 encoder argument references .pypirc
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: tree-sitter
    query: |
      ((call
         function: [(identifier) @name (attribute attribute: (identifier) @name)]
         arguments: (argument_list) @input)
       (#match? @name "^((standard_|urlsafe_)?b64encode|encodebytes|b2a_base64)$")
       (#match? @input "\\.pypirc\\b")
       (#set! cleave.ignore-comments "true"))
