defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: python-binary-read-base64-batch-clues
    for:
      - python
    desc: Python binary-read, Base64 and batch clues
    crit: notable
    conf: 0.95
    size_max: 512000
    all:
      - id: micro-behaviors/data/encode/base64/primitive::python-base64-encoder-alternatives
      - id: micro-behaviors/data/format/script::batch-indicator-alternatives
      - id: "metadata/lang/source/naming/interface/runtime::activex-wscript-or-vbs-extension-reference"
      - id: micro-behaviors/fs/file/open/unspecified::python-open-reference
      - id: micro-behaviors/fs/file/open/unspecified::binary-read-mode
