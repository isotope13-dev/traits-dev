defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-base64-gzip-encode
    desc: Base64-encodes gzip.compress output
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (attribute object: (identifier) @base64_module
                     attribute: (identifier) @encode_method)
          arguments: (argument_list
            . (call
                function: (attribute object: (identifier) @gzip_module
                           attribute: (identifier) @compress_method)
                arguments: (argument_list)
              )
          )
          (#eq? @base64_module "base64")
          (#eq? @encode_method "b64encode")
          (#eq? @gzip_module "gzip")
          (#eq? @compress_method "compress")
        )
