# .NET source that reads a whole file and Base64-encodes its bytes in one
# expression, e.g. Convert.ToBase64String(IO.File.ReadAllBytes(path)).
defaults:
  platforms: [windows]
  for: [vbs, csharp]

traits:
  - id: dotnet-file-bytes-to-base64
    desc: Base64-encodes the bytes of a whole file
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Convert\.ToBase64String\(\s*(System\.)?(IO\.)?File\.ReadAllBytes\('
