defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-exec-base64-no-wrap-pipeline
    desc: Exec argument pipes to Base64 encoding
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: '\|\s*base64\s+-w\s+0\b'
