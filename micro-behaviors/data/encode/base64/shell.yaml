defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.75

traits:
  - id: base64-encode-command
    desc: Shell encodes data with Base64
    mbc: C0025
    if:
      type: text
      regex: '(?m)^[ \t]*[^#\s\r\n].{0,240}\|\s*base64\b'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/file/naming::rust-source-file-context
  - id: password-base64-pipeline
    desc: Shell pipes password text to Base64
    conf: 0.9
    if:
      type: text
      regex: '(?m)(echo|printf).{0,80}(password|passwd|passphrase).{0,80}\|\s*base64\b'
  # A bare `base64` command says nothing about direction: `... | base64` encodes
  # just as often as it decodes, and the tool encodes by default (decoding
  # needs an explicit -d/--decode flag). Kept as a baseline capability marker
  # here, beside the encode claims, rather than under decode/: a whole-directory
  # reference from the base64-decoding composite swept this directionless atom
  # in as decode evidence, so `cat /dev/urandom | base64` (encode) read as a
  # decode leg in decode-plus-exec composites.
  - id: base64-tool
    desc: base64 command-line tool reference
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      exact: base64
