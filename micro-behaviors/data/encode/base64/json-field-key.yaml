defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041

traits:
  - id: rust-file-content-base64-field
    desc: Rust base64 file content encoding
    crit: notable
    conf: 0.9
    if:
      type: text
      # A bare `"base64"` string is also a normal encoding/method name (for
      # example, `method == "base64"`).  The exfiltration atom is specifically
      # about a serialized field, so require the JSON key form.
      regex: '["'']base64["'']\s*:'
