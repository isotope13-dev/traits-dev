defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-file-read-base64-result
    desc: File read with Base64 result construction
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)open\(path, ["'']rb["'']\) as f:\s*data = f\.read\(\)\s*return.{0,60}b64encode\(data\)'
