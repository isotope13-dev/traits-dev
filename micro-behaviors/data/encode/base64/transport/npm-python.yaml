defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-postinstall-python-b64encode
    desc: Postinstall calls Python Base64 encoder
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '\bbase64\.b64encode\s*\('
  - id: npm-postinstall-base64-config-result-body
    desc: Base64 encodes collected config result into body
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.postinstall
      regex: 'body\s*=\s*base64\.b64encode\(str\(results\)\.encode\(\)\)'
