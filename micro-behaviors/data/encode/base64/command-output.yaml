defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.85

traits:
  - id: command-group-base64-pipeline
    desc: Closed command group piped to Base64
    if:
      type: text
      regex: ';\s*\}\s*\|\s*base64\b'
    not:
      - substr: base64 -d
      - substr: base64 --decode
      - substr: base64 -D
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

  - id: identity-command-base64-pipeline
    desc: Identity or environment command piped to Base64
    if:
      type: text
      regex: '\b(env|set|id|whoami)\s*\|\s*base64\b'
    not:
      - substr: base64 -d
      - substr: base64 --decode
      - substr: base64 -D
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

  - id: file-command-base64-pipeline
    desc: File listing or content piped to Base64
    if:
      type: text
      regex: '\b(cat|ls)\b[^|\n]{0,80}\|\s*base64\b'
    not:
      - substr: base64 -d
      - substr: base64 --decode
      - substr: base64 -D
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

composite_rules:
  - id: command-output-base64-pipeline
    desc: Command output piped to Base64
    any:
      - id: command-group-base64-pipeline
      - id: identity-command-base64-pipeline
      - id: file-command-base64-pipeline
