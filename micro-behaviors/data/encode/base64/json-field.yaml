# JSON.stringify plus btoa proves encoding, without any HTTP send.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
- id: json-field-btoa-value
  desc: JSON object field applies Base64 encoding
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,180}:\s*btoa\s*\('
