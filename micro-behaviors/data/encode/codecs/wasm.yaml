defaults:
  platforms: [windows, unix]
  for: [wasm]
  crit: notable
traits:
  - id: wasm-encode-export
    desc: WASM module encode export
    conf: 0.9
    if:
      type: value
      path: wasm.exports[*]
      exact: encode
  - id: wasm-decode-export
    desc: WASM module decode export
    conf: 0.9
    if:
      type: value
      path: wasm.exports[*]
      exact: decode
