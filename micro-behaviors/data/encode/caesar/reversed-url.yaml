defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho, rust, go, c, cpp, python]
  attack: T1027

traits:
  - id: reversed-rot3-http-scheme
    desc: Reversed ROT-3 shifted HTTP URL literal
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '[a-z0-9./_-]{6,120}//:v?swwk'

  - id: reversed-rot3-domain-path
    desc: Reversed ROT-3 shifted www domain path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '/(prf|whq|jur)\.[a-z0-9-]{4,63}\.zzz\b'
