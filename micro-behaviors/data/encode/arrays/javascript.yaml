defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
traits:
  - id: js-hex-number-array
    desc: Contains a long hexadecimal byte array
    crit: notable
    conf: 0.8
    size_max: 200000
    if:
      type: text
      regex: '\[\s*0x[0-9a-fA-F]{1,3}(\s*,\s*0x[0-9a-fA-F]{1,3}){9,}\s*\]'

  # File-format scanners pass byte-signature arrays inline to a search helper
  # (`findSequence(data, [0x3C, 0x3F, 0x78, ...])`). Payload arrays are bound
  # to a name and decoded; repeated inline signatures mark a format parser.
  - id: js-inline-hex-signature-arguments
    desc: Repeated inline byte-signature call arguments
    crit: notable
    conf: 0.85
    count_min: 3
    size_max: 200000
    if:
      type: text
      regex: '\(\s*\w+\s*,\s*\[\s*0x[0-9a-fA-F]{1,2}(\s*,\s*0x[0-9a-fA-F]{1,2}){4,}\s*\]'

