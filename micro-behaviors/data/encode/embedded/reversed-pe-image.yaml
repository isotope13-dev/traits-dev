# A Windows executable stored back to front. The DOS stub message is fixed
# text in every MZ image, so reading it reversed means a complete PE was
# byte-reversed before embedding -- a cheap way to hide a payload from
# scanners that look for MZ/PE headers in resources or data.
defaults:
  platforms: [windows]
  for: [pe, dll, data]
traits:
  - id: reversed-dos-stub-text
    desc: Byte-reversed PE DOS stub message
    crit: suspicious
    conf: 0.97
    attack: T1027.013
    if:
      type: text
      substr: "edom SOD ni nur eb tonnac margorp sihT"
