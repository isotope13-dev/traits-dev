defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: baseline
  conf: 0.7
traits:
- id: pe-base64-blob
  desc: Embedded PE base64 blob
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: TVqQ[A-Za-z0-9+/=]{256,}
  unless:
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  - id: metadata/build
  - id: metadata/package/files/dependency::node-modules-path
- id: reversed-pe-base64-header
  desc: Reversed Base64 Windows executable header
  crit: suspicious
  conf: 0.96
  for:
  - media
  - scripts
  if:
    type: text
    regex: ([A-Za-z0-9+/]{32}|MAA)QqVT([^A-Za-z0-9+/=]|$)|[!-~]{32}guUFpVT
- id: repeated-gzip-base64-assignment
  desc: Repeated gzip-base64 assignment wrapper
  crit: suspicious
  conf: 0.93
  count_min: 10
  if:
    type: text
    regex: var\s+H4sIA[A-Za-z0-9+/=]{200,}=H4sIA[A-Za-z0-9+/=]{200,}
composite_rules:
- id: large-encoded-blob
  desc: Large encoded data blob in JavaScript
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  - id: metadata/build/bundler/asset::js-image-data-url
  any:
  - id: metadata/file/encoding/hex::quoted-hex-run-128
  - id: metadata/file/encoding/base64::large-base64-alphabet-string
  - id: pe-base64-blob
  - id: reversed-pe-base64-header
  - id: metadata/file/encoding/compression::gzip-base64-like-literal
