# Header bytes are a neutral encoding observation; carrier intent belongs
# in composites with image structure and trailer evidence.
defaults:
  platforms: [unix, windows]
  for: [jpeg, png]
traits:
  - id: image-raw-base64-pe-header
    desc: Base64 PE header in image bytes
    crit: suspicious
    conf: 0.92
    if:
      type: raw
      regex: '(TVqQAA|TVpFUug)[A-Za-z0-9+/]{30,}'
