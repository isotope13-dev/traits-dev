defaults:
  crit: notable
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: b85decode-symbol
    desc: Python Base85 decode call
    conf: 0.9
    if:
      type: symbol
      exact: base64.b85decode
  - id: b85decode-dynamic
    desc: Dynamic Python Base85 decode import
    conf: 0.9
    if:
      type: symbol
      exact: __import__.b85decode
  - id: b85decode-script
    desc: Python Base85 decode call in script
    conf: 0.92
    for: [python]
    if:
      type: symbol
      exact: base64.b85decode
