defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: decimal-string-blob
    desc: Long string of decimal digits
    crit: notable
    size_max: 500000
    if:
      type: string_literal
      regex: ^[0-9]{50,}$
    not:
      - exact: "1111111010000000000000000000000000000000000000000000000000000000"
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime::node-common-require
      - id: metadata/library/nodeunit/
