defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: vb-strreverse
    desc: Imports Visual Basic string reversal API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "rtcStrReverse"

  - id: dotnet-strreverse
    desc: References .NET string reversal method
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      exact: StrReverse
