defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe]
traits:
  - id: vb-strreverse
    desc: Imports Visual Basic string reversal API
    if:
      type: symbol
      exact: "rtcStrReverse"

  - id: dotnet-strreverse
    desc: References .NET string reversal method
    for: [pe, dll]
    if:
      type: text
      exact: StrReverse
