defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-json-base64-encoding
    desc: Base64-encodes serialized JSON
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(base64\.)?b64encode$'
      arg:
        index: 0
        from:
          call: '^(json\.)?dumps$'
          through:
            - call: '(^|\.)encode$'
              receiver: true
