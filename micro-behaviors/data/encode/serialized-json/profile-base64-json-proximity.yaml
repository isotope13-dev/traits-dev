defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: base64-json-encoding-proximity
    desc: Base64 encoding near JSON serialization
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(b64encode|ToBase64String).{0,400}(json\.dumps|ConvertTo-Json)'
    not:
      - substr: 'from"./chunk-'
      - substr: 'btoa(unescape(encodeURIComponent'
      - substr: 'http://example.com/ffmpeg-core.js#{btoa(JSON.stringify({'
      - substr: 'createResponse(t,o,n){let a={from:'
      - substr: 'payload:JSON.stringify({method:n,path:a,body:p,headers:i})'
