defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: btoa-json-stringify-call
    desc: Base64-encodes JSON.stringify output via btoa
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'btoa\s*\(\s*JSON\.stringify\s*\('
