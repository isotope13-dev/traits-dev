defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: btoa-json-stringify-call
    desc: Base64-encodes JSON.stringify output via btoa
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'btoa\s*\(\s*JSON\.stringify\s*\('

  # The Base64 JSON goes straight into a `.send()` sink -- XHR, WebSocket,
  # data channel, or worker port. The receiver type stays open.
  - id: send-base64-json-call
    desc: Sends Base64-wrapped JSON
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\.send\s*\(\s*(btoa\s*\(|JSON\.stringify\s*\(\s*\{[^;]{0,120}btoa\s*\()'
