---
defaults:
  platforms:
  - windows
  - unix
  for:
  - c
  - cpp
traits:
- id: xor-to-system
  desc: XOR decoded buffer passed to system()
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "\\^=.{0,80}system\\("
- id: xor-byte-with-cyclic-key
  desc: XOR byte using advancing key index
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: byte\s*=\s*byte\s*\^\s*\(int\)key\[key_count\]
- id: xor-aa55-byte-mask
  desc: XOR AA/55 byte-mask constant
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "\\^\\s*0x(AA|55)"
# Adjacent subtract-then-XOR keyed byte transform, as used by binder stubs
# that decode appended overlay records with a cycling key. Written without
# specimen names so renamed identifiers, index or pointer forms, and
# differing key schedules still match; HTML/text views of C source included
# because listings carry the same bytes without parser call facts.
- id: c-subtract-xor-keyed-transform
  desc: C subtract-then-XOR keyed byte transform
  crit: notable
  conf: 0.9
  for: [c, cpp, html, text]
  if:
    type: text
    regex: '-=\s*[^;]{1,40}?;\s*[^;]{1,60}?\^='
composite_rules:
- id: cyclic-xor-string-decrypt
  desc: Cyclic XOR string decryption routine
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/encode/xor::xor-byte-with-cyclic-key
  - id: micro-behaviors/data/string/measure::key-index-string-length-comparison
