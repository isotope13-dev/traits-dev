---
defaults:
  platforms:
  - windows
  - unix
  for:
  - c
  - cpp
traits:
- id: xor-to-system
  desc: XOR decoded buffer passed to system()
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "\\^=.{0,80}system\\("
- id: xor-byte-with-cyclic-key
  desc: XOR byte using advancing key index
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: byte\s*=\s*byte\s*\^\s*\(int\)key\[key_count\]
- id: xor-aa55-byte-mask
  desc: XOR AA/55 byte-mask constant
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "\\^\\s*0x(AA|55)"
  unless:
  - id: well-known/lib/media/spandsp
  - id: well-known/lib/crypto/openssl/
  - type: text
    substr: GetDigest() const
  - type: text
    substr: CrcGetDigest
  - type: path
    regex: "(^|[\\\\/])is_utf8[\\\\/].*src[\\\\/]is_utf8\\.cpp$"
  - type: path
    regex: "(^|[\\\\/])miniz\\.c$"
composite_rules:
- id: cyclic-xor-string-decrypt
  desc: Cyclic XOR string decryption routine
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/encode/xor::xor-byte-with-cyclic-key
  - id: micro-behaviors/data/string/measure::key-index-string-length-comparison
