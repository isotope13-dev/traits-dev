defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-xor-copy-write-handoff
    desc: XOR-copy output passed to indirect write call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # mov dl,[ecx+eax]; xor dl,key; mov [eax],dl; inc eax;
      # sub esi,1 (or dec esi); jne loop. The same output buffer (EDI),
      # length and handle then feed a WriteFile-shaped indirect call.
      # Zero XOR or passing a different buffer must not satisfy this rule.
      pattern: '8A 14 01 80 F2 ~00 88 10 40 (83 EE 01 75 F2 6A 00 8D 44 24 ?? 50 55 FF 15 ?? ?? ?? ?? 50 57 53|4E 75 F4 8D 44 24 ?? 6A 00 50 53 FF 15 ?? ?? ?? ?? 50 57 55) FF 15 ?? ?? ?? ??'
