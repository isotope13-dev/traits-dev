defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-xor-byte-copy-loop
    desc: x86 byte-copy loop with nonzero XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # mov dl,[ecx+eax]; xor dl,key; mov [eax],dl; inc eax;
      # sub esi,1; jne loop. Zero would be an ordinary byte copy.
      pattern: '8A 14 01 80 F2 ~00 88 10 40 83 EE 01 75 F2'
