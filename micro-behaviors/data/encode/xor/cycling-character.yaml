defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: js-cycling-eight-character-xor
    desc: Character XOR with cycling 1..8 key
    if:
      type: text
      regex: '\^\s*\(\(\w{1,20}\+\+\s*%\s*8\)\s*\+\s*1\)'
  - id: js-dual-charcode-xor
    desc: XOR combines two character-code keys
    if:
      type: text
      regex: 'charCodeAt\(\w{1,16}\)\s*\^\s*\w{1,16}\.charCodeAt\('
  - id: js-xor-fromcharcode-rebuild
    desc: Rebuilds characters from XOR of variables
    if:
      type: text
      regex: 'String\.fromCharCode\(\w{1,20}\^\w{1,20}\)'
