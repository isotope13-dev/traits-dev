defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - pyc
traits:
- for:
  - python
  id: python-xor-modulo-character-reconstruction
  desc: Python reconstructs characters via XOR loop
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    kind: call
    regex: \bchr\s*\([^\)\n]{0,48}\^[^\)\n]{0,48}%\s*len\s*\(
