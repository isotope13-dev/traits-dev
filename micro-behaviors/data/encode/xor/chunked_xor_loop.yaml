defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
composite_rules:
  - id: js-indexed-buffer-xor-loop
    desc: JavaScript loop XOR-transforms indexed buffer
    crit: notable
    conf: 0.88
    near_bytes: 512
    all:
      - id: "metadata/lang/source/literal/string::literal-xor-operator-text"
      - id: micro-behaviors/data/control-flow/analysis::for-loop-content
      - id: micro-behaviors/data/reassembly::array-index-i
      - id: micro-behaviors/data/reassembly::buffer-identifier
  - id: js-chunked-xor-loop
    desc: Chunked parse and XOR decode loop
    crit: suspicious
    size_max: 100000
    near_bytes: 512
    all:
      - id: micro-behaviors/data/string/conversion::js-parseint
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: "metadata/lang/source/literal/string::literal-xor-operator-text"
      - id: metadata/lang/source/literal/value::js-loop-source-literal
    any:
      - id: micro-behaviors/data/string/access::js-substring-call
      - id: micro-behaviors/data/string/access::js-charat-lookup
