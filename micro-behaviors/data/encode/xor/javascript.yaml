# JavaScript XOR Obfuscation
# Detects specific XOR patterns used in JScript malware (e.g., Nemucod)
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-xor-variable-assignment
    desc: JavaScript variable assignment using XOR
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bvar\s+\w{1,40}\s*=\s*[\w$+-]{1,40}\s*\^\s*[\w$+-]{1,40}\s*;'
    count_min: 1
  # Single-byte XOR applied elementwise to a byte array/Buffer — the cheapest
  # way to keep a packed payload out of a string scanner's reach. Distinct
  # from the charCodeAt string forms: this one transforms raw bytes read from
  # a file or socket, so it is the shape JS packers and bundled-blob loaders
  # use. Neutral on its own (checksums and cipher demos do it too).
  - id: js-byte-array-xor-map
    desc: Elementwise XOR over a byte array
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.map\s*\(\s*\(?\s*\w{1,20}\s*\)?\s*=>\s*\w{1,20}\s*\^\s*\w{1,20}\s*\)'
  - id: js-xor-dynamic-char-at
    desc: JS dynamic charCodeAt access
    crit: notable
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      regex: '\.(^(charCodeAt|charAt)$)$'
