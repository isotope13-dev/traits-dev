---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: js-xor-variable-assignment
  desc: JavaScript variable assignment using XOR
  conf: 0.88
  if:
    type: text
    regex: "\\bvar\\s+\\w{1,40}\\s*=\\s*[\\w$+-]{1,40}\\s*\\^\\s*[\\w$+-]{1,40}\\s*;"
  count_min: 1
- id: js-xor-decode-unescape-write-loop
  desc: Repeated XOR charCode decode loops
  conf: 0.94
  for:
  - html
  - javascript
  if:
    type: text
    regex: fromCharCode\(\w+\.charCodeAt\(\w+\)\^\d+\)
  count_min: 2
composite_rules:
- id: js-byte-buffer-xor-transform
  desc: Byte buffer XOR transformation
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/data/encoding/xor::js-byte-array-xor-map
  - id: micro-behaviors/data/property/assign::indexed-value-xor-assignment
