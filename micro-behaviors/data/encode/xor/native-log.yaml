defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
traits:
  - id: indexed-byte-xor-fwrite-loop
    desc: Loop writes XOR-transformed indexed bytes
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((for_statement body: (compound_statement
          (declaration declarator: (init_declarator
            declarator: (identifier) @encoded
            value: (binary_expression left: (subscript_expression) operator: "^")))
          (expression_statement (call_expression function: (identifier) @write
            arguments: (argument_list
              . (pointer_expression (identifier) @output)
              . (number_literal) @size
              . (number_literal) @count)))))
         (#eq? @encoded @output)
         (#eq? @write "fwrite")
         (#eq? @size "1")
         (#eq? @count "1"))
