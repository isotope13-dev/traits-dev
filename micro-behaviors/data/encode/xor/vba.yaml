# XOR computed through the boolean identity (a Or b) And (Not (a And b))
# instead of the Xor keyword or the ^ operator, so no XOR token exists in
# the file for keyword signatures to find. The helper takes two bytes and
# returns their XOR; callers feed it a buffer byte and a repeating-key byte
# (buffer(i) indexed with key(i Mod keyLen)). Ordinary code has no reason
# to spell XOR this way.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  - id: vba-boolean-identity-xor
    desc: XOR computed with And/Or/Not identity
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\(\s*\w+\s+Or\s+\w+\s*\)\s+And\s+\(\s*Not\s+\(\s*\w+\s+And\s+\w+\s*\)\s*\)'
