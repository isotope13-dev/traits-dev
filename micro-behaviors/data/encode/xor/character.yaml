defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: js-xor-character-code
    desc: Converts XOR result into a character
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @fn)
          arguments: (arguments [
            (binary_expression operator: "^")
            (parenthesized_expression (binary_expression operator: "^"))
          ])
          (#eq? @obj "String")
          (#eq? @fn "fromCharCode"))
  # Text companion for script embedded in HTML or an unrecognised container,
  # where the tree-sitter query above cannot run. The argument itself has to be
  # an XOR expression: a `^` elsewhere on the line (a regex anchor, a "^"
  # literal) is not a decode.
  - id: embedded-js-xor-character-code
    desc: Embedded script XORs a character code
    conf: 0.9
    for: [html, static-lib]
    if:
      type: text
      regex: 'String\.fromCharCode\(\s*\(*\s*[\w$.\[\]]+\s*\^\s*[\w$.\[\]]+'
