defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: embedded-js-xor-character-code
    desc: Embedded script XORs a character code
    conf: 0.9
    for: [html, static-lib]
    if:
      type: text
      regex: 'String\.fromCharCode\(\s*\(*\s*[\w$.\[\]()]+\s*\^\s*[\w$.\[\]()*+\s-]+'
