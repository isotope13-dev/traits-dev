defaults:
  platforms: [unix, windows]
  for: [rust]
traits:
  - id: rust-repeating-key-xor
    desc: Rust XOR indexes a repeating key
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((binary_expression "^"
          right: (index_expression (identifier) @key
            (binary_expression "%"
              right: (call_expression function: (field_expression
                value: (identifier) @length_key field: (field_identifier) @length)))))
          (#eq? @key @length_key)
          (#eq? @length "len"))
