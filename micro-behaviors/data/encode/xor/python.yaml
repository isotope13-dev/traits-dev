---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: xor-byte-invert-listcomp
  desc: Single-byte XOR list comprehension
  conf: 0.92
  if:
    type: text
    regex: "\\[\\w+\\s*\\^\\s*0xFF\\s+for\\s+\\w+\\s+in\\s+\\w+\\]"
- id: xor-byte-invert-bytes-listcomp
  desc: bytes XOR inversion transform
  conf: 0.96
  if:
    type: text
    regex: bytes\(\[\w+\s*\^\s*0xFF\s+for\s+\w+\s+in\s+\w+\]\)
- id: xor-indexed-assign-modulo-key
  desc: Indexed XOR assignment with modulo key
  conf: 0.9
  for:
  - python
  - pyc
  attack: T1027
  mbc: B0032
  if:
    type: text
    regex: "\\w+\\[\\w+\\]\\s*=\\s*\\w+\\[\\w+\\]\\s*\\^\\s*\\w+\\[\\w+\\s*%"
- id: xor-bytearray-mutating-loop
  desc: In-place XOR against a keystream
  conf: 0.92
  attack: T1027
  mbc: B0032
  if:
    type: text
    regex: "\\w+\\[\\w+\\]\\s*\\^=\\s*\\w+\\[[^\\]\\n]{1,40}\\]"
- id: xor-itertools-starmap-cycle
  desc: itertools.starmap(operator.xor, zip(...))
  conf: 0.95
  attack: T1027
  mbc: B0032
  if:
    type: text
    regex: starmap\s*\(\s*(operator\.)?xor\s*,\s*zip\s*\(
composite_rules:
- id: xor-bytearray-indexed-assign
  desc: Indexed XOR assignment into Python bytearray
  conf: 0.93
  attack: T1027
  mbc: B0032
  all:
  - id: micro-behaviors/data/bitwise::indexed-xor-assignment
  - id: micro-behaviors/data/buffer/alloc::python-bytearray-constructor
  near_lines: 40
