# Script-level decompression operations. These are neutral capabilities;
# remote retrieval and an execution sink establish staging intent.
#
# The Base64 half of the staging pair is NOT redefined here: decoding lives in
# micro-behaviors/data/decode/base64/ (and the Go atom in data/encode/base64/),
# and re-matching `atob(` / `b64decode(` under encode/compression both filed a
# decode capability in the wrong directory and duplicated a canonical matcher.
# base64-stage-marker below references those atoms instead.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: gzip-decompression-call
    desc: Gzip decompression call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgzip\s*\.\s*(decompress|GzipFile)\s*\('

  - id: zlib-decompression-call
    desc: Zlib decompression call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(zlib|bz2)\s*\.\s*decompress\s*\('

  - id: generic-decompression-call
    desc: Generic decompression call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(decompress|gunzip)\s*(\(|\b)'

composite_rules:
  - id: base64-stage-marker
    desc: Base64 decoding operation
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/encode/base64::go-base64-decode

  - id: compression-stage-marker
    desc: Decompression operation
    crit: notable
    conf: 0.9
    any:
      - id: gzip-decompression-call
      - id: zlib-decompression-call
      - id: generic-decompression-call

  - id: packed-stage-transform
    desc: Nearby Base64 and compression transforms
    # Encoding plus decompression is common in archives, protocol clients,
    # caches, and AI tooling. A remote response and dynamic sink are needed
    # elsewhere to establish staged execution intent.
    crit: notable
    conf: 0.92
    all:
      - id: base64-stage-marker
      - id: compression-stage-marker
    near_lines: 12
