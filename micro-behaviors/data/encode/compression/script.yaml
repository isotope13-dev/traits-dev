# Script-level Base64 and decompression operations. These are neutral
# capabilities; remote retrieval and an execution sink establish staging intent.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: python-base64-decode
    desc: Base64 decoding operation
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(base64\s*\.\s*b64decode|b64decode)\s*\('

  - id: javascript-base64-decode
    desc: JavaScript Base64 decoding operation
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\batob\s*\('

  - id: go-base64-decode
    desc: Go Base64 decoding operation
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bStdEncoding\s*\.\s*DecodeString\s*\('

  - id: gzip-decompression-call
    desc: Gzip decompression call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgzip\s*\.\s*(decompress|GzipFile)\s*\('

  - id: zlib-decompression-call
    desc: Zlib decompression call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(zlib|bz2)\s*\.\s*decompress\s*\('

  - id: generic-decompression-call
    desc: Generic decompression call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(decompress|gunzip)\s*(\(|\b)'

composite_rules:
  - id: base64-stage-marker
    desc: Base64 decoding operation
    crit: component
    conf: 0.9
    any:
      - id: python-base64-decode
      - id: javascript-base64-decode
      - id: go-base64-decode

  - id: compression-stage-marker
    desc: Decompression operation
    crit: component
    conf: 0.9
    any:
      - id: gzip-decompression-call
      - id: zlib-decompression-call
      - id: generic-decompression-call

  - id: packed-stage-transform
    desc: Nearby Base64 and compression transforms
    # Encoding plus decompression is common in archives, protocol clients,
    # caches, and AI tooling. A remote response and dynamic sink are needed
    # elsewhere to establish staged execution intent.
    crit: notable
    conf: 0.92
    all:
      - id: base64-stage-marker
      - id: compression-stage-marker
    near_lines: 12
