# Base64 and gzip used together are common in generated data and metadata
# tooling.  Keep the capability neutral; command-tasking intent requires the
# surrounding polling, envelope, and shell-dispatch evidence in objectives/.
defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: notable

traits:

  - id: python-base64-gzip-encode
    desc: Python encodes gzip data as Base64
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)b64encode[\s\S]{0,160}gzip\.compress'

  - id: go-base64-gzip-decode
    desc: Go decodes Base64 before gzip decompression
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: '(?is)DecodeString[\s\S]{0,260}NewReader'

  # The stdout/log half of the banner idiom below. Kept separate so the
  # composite can join the legs with proximity instead of one long regex.
  - id: go-print-decompressed-output
    desc: Go prints decompressed output
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'fmt\.Print\w*|io\.Copy\(os\.Stdout|klog\.(Warning|Info)f|log\.Print\w*'

composite_rules:
  - id: encoded-compressed-transform
    desc: Encodes or decodes Base64-compressed data
    conf: 0.96
    any:
      - id: "micro-behaviors/data/decompress/gzip::python-base64-gzip-decode"
      - id: python-base64-gzip-encode
      - id: go-base64-gzip-decode
  # Compressed ASCII-art banners and long notice texts are embedded in Go
  # sources as base64-gzip (v2ray love command, trillian banners) and
  # printed to stdout or the log — displayed, never staged or executed.
  # Fires next to the engine's base64-gz finding so triage sees the benign
  # use directly; it deliberately does NOT gate the engine finding, which no
  # YAML condition can scope to parent-file content from the extracted child.
  - id: go-base64-gzip-print-banner
    desc: Go prints base64-gzip decoded output
    conf: 0.9
    for: [go]
    near_lines: 30
    all:
      - id: go-base64-gzip-decode
      - id: go-print-decompressed-output
