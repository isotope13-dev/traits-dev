defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, html, lnk, python, text]
  attack: T1027

traits:
  - id: powershell-numeric-char-reconstruction
    desc: PowerShell builds characters from numeric codes
    crit: notable
    conf: 0.9
    if:
      type: encoded
      regex: '(?i)(\[char\]\s*\[?int\]?|\[char\]\s*\(?\s*\d{1,4})'

  - id: powershell-numeric-char-reconstruction-loop
    desc: PowerShell loops over numeric character codes
    crit: suspicious
    conf: 0.92
    if:
      type: encoded
      regex: '(?is)-join\s*\([^)]{24,}\|\s*ForEach-Object\s*\{\s*\[char\]'

  - id: powershell-offset-char-decode
    desc: Decodes characters by numeric offset
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\[char\]\s*\(\s*\$\w+\s*-\s*\d{3,5}\s*\)'

  - id: powershell-hex-pair-bxor
    desc: XOR-decodes hex pairs to characters
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\[Convert\]::ToByte\([^)]{0,40},\s*16\)\s*-bxor'

  - id: powershell-call-substring-iex
    desc: Call-operator invokes a 3-char prefix
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '&\s*\$\w+\.Substring\(\s*0\s*,\s*3\s*\)'

  - id: powershell-regex-hex-pair-split
    desc: Regex splits a blob into hex pairs
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\[regex\]::Matches\([^,]{32,},\s*[''"]\.\{\d+\}[''"]\)'
