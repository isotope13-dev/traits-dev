# Character codes written as two-character base-17+ numbers ("4i", "3m",
# "2b"): a letter beyond f in the second position means a radix above 16,
# which no ordinary data uses. Seen in WSH/JS downloader stubs that rebuild
# their script by parseInt(token, 25) into a lookup table.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: radix-above-sixteen-char-token-literals
    desc: Many base-17+ two-character code literals
    crit: notable
    conf: 0.9
    count_min: 15
    if:
      type: literal
      kind: string
      regex: '^[1-6][g-p]$'
  - id: printable-char-lookup-table
    desc: Builds a printable character lookup table
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(\s*''\\x[2-7][0-9a-f]'',){60}|\w+\[\w+\]=String\[''fromCharCode''\]\(\w+\);\w+\+\+;'
  - id: parseint-radix-conversion-helper
    desc: Helper re-bases a token with parseInt radix
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '=parseInt\(\w+,\w+\);\w+=\w+\[''toString''\]\(\w+\)|\]\(parseInt,\w+,\w+\);'
