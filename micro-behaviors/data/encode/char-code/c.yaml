defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: c-octal-escape-sequence
    desc: C source contains repeated octal escapes
    if:
      type: text
      regex: '(\\[0-7]{3}){20,}'

  # Printable ASCII (0x20-0x7E) spelled entirely as octal escapes. Octal
  # escapes legitimately encode control bytes or UTF-8 high bytes (\033,
  # \342\200\213); writing readable characters as \143\165\162\154 only
  # serves to keep the text from being read.
  - id: c-octal-printable-ascii-run
    desc: Octal escapes spell printable ASCII text
    if:
      type: text
      regex: '(\\(0?[4-7][0-7]|1[0-7][0-7])){16,}'
