# The arguments of an XMLHTTP-style `.Open` call are concatenated from calls
# that take a numeric character code (`f(101)`, `Chr(71)`): the HTTP verb or
# URL is assembled at run time instead of appearing as a literal.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  - id: vbs-http-open-char-code-arguments
    desc: HTTP Open arguments built from character codes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Open\s+[^\r\n]{0,60}"\s*&\s*[A-Za-z_]\w*\(\s*\d{2,3}\s*\)\s*&'
