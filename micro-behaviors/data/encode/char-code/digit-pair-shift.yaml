# Payload stored as runs of decimal digit pairs; every pair is parsed and
# shifted by a loop-dependent offset before String.fromCharCode, so the
# written markup never appears in the source.
traits:
  - id: digit-pair-charcode-shift-decoder
    desc: Decodes shifted two-digit character codes
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: 'if\(\w+\.length==2\)\{\w+\+=String\.fromCharCode\(parseInt\(\w+\)\s*[-+]'
