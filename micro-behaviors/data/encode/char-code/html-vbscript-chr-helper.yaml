# VBScript embedded in HTML/HTA pages is not split into a vbs layer, so the
# vbs-only atoms never see it (vba.yaml's chr-wrapper-function now also
# covers html). This adds the dense use of a numeric-argument helper inside
# `&` concatenations.
defaults:
  platforms: [windows]
  for: [html]
  crit: notable
  conf: 0.88

traits:
  - id: html-vbscript-dense-numeric-helper-concat
    desc: Page VBScript chains numeric helper calls
    count_min: 50
    if:
      type: text
      regex: '&[ \t]*[A-Za-z]\w{2,30}\([ \t]*\d{2,3}[ \t]*\)[ \t]*&'
