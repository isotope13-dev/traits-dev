defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: long-numeric-array-literal
    desc: Long numeric array literal
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\[\s*[0-9]{1,3}(\s*,\s*[0-9]{1,3}){15,}\s*\]'
  - id: charcode-byte-array-assignment
    desc: Assigns character code to array element
    crit: notable
    conf: 0.94
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\[[A-Za-z_$][A-Za-z0-9_$]*\]\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\.charCodeAt\s*\('
  - id: js-high-surrogate-rebuild
    desc: Builds a UTF-16 high surrogate code unit
    crit: notable
    conf: 0.95
    for: [javascript, typescript, html]
    # The leading half of the canonical astral code-point encoder:
    # `(cp >> 10) + 0xD800`. Used by String.fromCodePoint polyfills, UTF-16
    # codecs, and emoji handling. The shift width and the 0xD800 offset are
    # specific to surrogate math, so no `fromCharCode` anchor is needed and
    # the atom also covers codecs that build code units by other means.
    if:
      type: text
      regex: '(?i)>>>?\s*10\s*\)?\s*\+\s*(55296|0xd800)'
  - id: js-low-surrogate-rebuild
    desc: Builds a UTF-16 low surrogate code unit
    crit: notable
    conf: 0.95
    for: [javascript, typescript, html]
    # The trailing half of the same encoder: the low ten bits of the code
    # point, taken with `% 0x400` or `& 0x3FF`, offset by 0xDC00.
    if:
      type: text
      regex: '(?i)[%&]\s*(1024|1023|0x400|0x3ff)\s*\)?\s*\+\s*(56320|0xdc00)'
  - id: js-modulo-charcode-mapping
    desc: Maps a modulo-reduced value to a character
    crit: notable
    conf: 0.94
    # This maps a numeric range to characters. Decoders use the same operation
    # as ordinary checksum-to-letter algorithms, so it implies no obfuscation.
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: micro-behaviors/data/encode/char-code::js-surrogate-pair-encoder
    if:
      type: text
      regex: 'fromCharCode\s*\(\s*\w+\s*%\s*\d+\s*\+\s*\d+\s*\)'
  - id: fromcharcode-call
    desc: Builds characters with String.fromCharCode
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: fromCharCode
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/library/structure::js-large-minified-bundle
      # Monaco's generated editor runtime reconstructs Unicode code points as
      # part of its parser tables; this is library identity, not a decoder.
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle
  - id: fromcharcode-call-text
    desc: Oversized source calls String.fromCharCode
    crit: notable
    conf: 0.9
    size_min: 1000000
    # Large JavaScript files may be intentionally left unparsed by the source
    # extractor. Preserve the same capability detection from source text,
    # including bracket notation used to evade dot-notation scans.
    if:
      type: text
      regex: 'String(\.fromCharCode|\[\s*["'']fromCharCode["'']\s*\])\s*\([^;\n]{1,240}\)'
    unless:
      - id: fromcharcode-call
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle

  - id: fromcharcode-member-reference
    desc: References the String.fromCharCode member
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    # Parsed member evidence distinguishes executable references and aliases
    # from API examples in comments, such as Lodash documentation snippets.
    if:
      type: symbol
      kind: member
      exact: String.fromCharCode
    unless:
      - id: fromcharcode-call
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle

  - id: fromcharcode-source-token
    desc: Large source references String.fromCharCode
    crit: notable
    conf: 0.8
    size_min: 1000000
    for: [javascript, typescript]
    # Keep a token fallback for oversized source where the call expression is
    # not available to the AST-backed matcher.
    if:
      type: text
      substr: String.fromCharCode
    unless:
      - id: fromcharcode-call
      - id: fromcharcode-call-text
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle
  - id: fromcharcode-numeric-sequence
    desc: Rebuilds string from numeric character codes
    crit: notable
    conf: 0.96
    for: [javascript, typescript, html, json, text]
    # Covers executable JavaScript serialized inside a remote JSON record as
    # well as ordinary source. A long numeric argument sequence is structural
    # encoding evidence; it does not depend on prose or a campaign-specific
    # URL hidden by the character codes.
    if:
      type: text
      regex: 'String\.fromCharCode\(\s*[0-9]{1,3}(\s*,\s*[0-9]{1,3}){11,}\s*\)'
  - id: fromcharcode-xor-rebuild
    desc: Reconstructs characters from XOR-decoded values
    crit: notable
    conf: 0.95
    if:
      # Join the call and XOR at one AST node so unrelated operators and
      # comments elsewhere in a crypto library cannot satisfy the rule.
      type: tree-sitter
      kind: call
      regex: 'fromCharCode\s*\(.{0,240}\^'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::js-emscripten-preamble-marker

  - id: encoded-windows-startup-path
    desc: Rebuilds Startup from character codes
    crit: notable
    conf: 0.96
    # `Startup` is a meaningful persistence indicator even when a package
    # hides it in a numeric string table.  The objective layer requires a
    # write and import-time execution before treating it as hostile.
    if:
      type: text
      regex: '\[\s*83\s*,\s*116\s*,\s*97\s*,\s*114\s*,\s*116\s*,\s*117\s*,\s*112\s*\]'
  - id: computed-string-method-xor-rebuild
    desc: Computed String method rebuilds XOR byte
    crit: notable
    conf: 0.95
    # JScript can hide fromCharCode behind a computed String method name.  The
    # XOR operand makes this a byte-decoder operation rather than ordinary
    # computed property access; execution intent belongs to composites.
    if:
      type: text
      regex: 'String\s*\[\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\]\s*\(\s*[^)\r\n]{1,240}\^\s*[A-Za-z_$0-9]'
  - id: computed-string-method-byte-rebuild
    desc: Computed String method rebuilds a masked byte
    crit: notable
    conf: 0.95
    # JScript can hide String.fromCharCode behind an alias and use a byte
    # mask instead of XOR. Keep the atom capability-focused; staged execution
    # is established only by objective composites.
    if:
      type: text
      regex: 'String\s*\[\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\]\s*\(\s*\([^)]{1,240}\)\s*&\s*255\s*\)'
  # Rebuilds an API name such as fromCharCode by indexing a scrambled
  # alphabet with charAt/substr, then uses it as String[<rebuilt>]. Common in
  # WSH loaders that hide the decoder entry point from static scanners.
  - id: indexed-alphabet-string-method-rebuild
    desc: Rebuilds String method via alphabet indexes
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\.charAt\(\d{1,3}\)[\s\S]{0,160}\.substr\(\d{1,3},\s*1\)[\s\S]{0,240}String\s*\['

composite_rules:
  # A Unicode code-point encoder, not a string decoder: both surrogate halves
  # are rebuilt from the same arithmetic, which is what String.fromCodePoint
  # polyfills and UTF-16 codecs do. Obfuscators that abuse modulo arithmetic
  # produce only the trailing half, so requiring both keeps the suppression
  # narrow. Size-independent, so it also covers hand-written and lightly
  # minified sources that the large-bundle exclusion never reaches.
  - id: js-surrogate-pair-encoder
    desc: Encodes a code point as a UTF-16 surrogate pair
    crit: exception
    conf: 0.97
    all:
      - id: js-high-surrogate-rebuild
      - id: js-low-surrogate-rebuild
