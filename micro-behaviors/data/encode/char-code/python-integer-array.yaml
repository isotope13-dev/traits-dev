defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: inline-chr-loader-array
  desc: Builds text from decimal character codes
  crit: notable
  conf: 0.9
  # Character construction alone need not activate code. The inline-chr-loader
  # objective additionally requires an execution sink.
  if:
    type: text
    regex: join\(map\(chr,\s*\[(\d{1,3},\s*){50,}
