defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-percent-u-hex-word-builder
    desc: Builds percent-u text from paired substrings
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: php
      kind: binary_op
      regex: '["'']%u["'']\s*\.\s*substr\([\s\S]{0,100}\.\s*substr\('
