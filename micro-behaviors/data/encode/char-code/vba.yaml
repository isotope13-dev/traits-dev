defaults:
  for:
    - vbs
  platforms:
    - windows
  conf: 0.88
traits:
  - id: chr-function-call
    desc: VBA Chr character code function
    crit: notable
    if:
      type: string_literal
      regex: (?i)\bChr[W$]?\(
  - id: dense-chr-construction
    desc: Dense Chr-based string construction
    crit: notable
    conf: 0.9
    count_min: 10
    per_kb_min: 2.0
    if:
      type: text
      regex: (?i)Chr[W$]?\(
  - id: chr-plus-concat
    desc: Chr codes joined with plus
    crit: notable
    conf: 0.92
    count_min: 8
    for: [vbs, text]
    if:
      type: text
      regex: '(?i)Chr[W$]?\s*\(\s*\d{1,3}\s*\)\s*\+\s*Chr[W$]?\s*\('
  # A helper that returns Chr() of its argument exists to hide string
  # plaintext (usually a URL or ProgID) from static extraction: callers pass
  # numeric codes instead of readable text. Bare Chr() tallies miss it
  # because the source never calls Chr directly at the use site.
  - id: chr-wrapper-function
    desc: VBScript function computes Chr character code
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bFunction\s+\w+\([^)\r\n]{0,40}\)[ \t]*\r?\n[ \t]*\w+[ \t]*=[ \t]*Chr[W$]?\('
  - id: arithmetic-chr-reconstruction
    desc: Arithmetic Chr payload reconstruction
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bChr[W$]?\(\s*[0-9]{3,}\s*[-+]\s*[A-Za-z_]\w*'
  # Numeric-table decoders (Emotet epoch: chr(Clng(cell) / 102)) hide the
  # payload as dividable codes instead of literal characters. The division
  # of a converted table cell is the reusable shape; the divisor varies.
  - id: chr-division-decoder
    desc: Chr decodes a divided numeric code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bChr\s*\(\s*\w+\s*\(.{1,60}\)\s*/\s*\d{2,}'
  - id: arithmetic-hex-chr-reconstruction
    desc: Chr arithmetic hex reconstruction
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bChr[W$]?\([^)]{0,80}\bCLng\s*\(\s*&H[0-9A-F]+\s*\)'
  - id: strreverse-call
    desc: VBA StrReverse obfuscation primitive
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: (?i)\bStrReverse\b
  # Call-shape companion to strreverse-call: matches direct
  # StrReverse("...") invocations in script sources.
  - id: strreverse-invocation
    desc: VBScript StrReverse call
    crit: notable
    conf: 0.88
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bStrReverse\s*\('
  # A per-character decoder whose input is read backwards, or whose output is
  # offset by the ciphertext length, is a hand-rolled cipher. VB has no reason
  # to reverse a string before reading characters out of it except to keep the
  # plaintext -- usually an API or ProgID name -- out of the file.
  - id: vb-reversed-string-char-decoder
    desc: VB reads chars from a reversed string
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)Asc\(\s*Mid\$?\(\s*StrReverse\('
  - id: vb-length-keyed-char-shift
    desc: VB shifts char codes by string length
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bAsc\(.{1,60}\)\s*-\s*Len\(\w{1,24}\)'
  - id: replace-function-call
    desc: VBA Replace string manipulation
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: (?i)\bReplace\(
composite_rules:
  - id: chr-replace-deobfuscation
    desc: Chr plus Replace deobfuscation chain
    crit: suspicious
    conf: 0.93
    all:
      - id: chr-function-call
      - id: dense-chr-construction
      - id: replace-function-call
