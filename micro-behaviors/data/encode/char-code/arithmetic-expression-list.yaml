# Character codes hidden as arithmetic expressions in one comma-joined string
# ("52.5*2,51*2,..."): each item is evaluated back to a code point, so no
# literal number in the source equals a byte of the payload.
traits:
  - id: arithmetic-charcode-expression-list
    desc: String of arithmetic-encoded character codes
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '["''](\d{1,3}(\.\d)?\*\d{1,2},){40}'
