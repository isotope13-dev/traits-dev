defaults:
  for: [vbs, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
  - id: array-payload-reconstruction
    desc: Array-based payload byte reconstruction
    crit: suspicious
    if:
      type: text
      regex: '(?i)Array\(\s*[0-9]{1,3}(\s*,\s*[0-9]{1,3}){15,}'
    unless:
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: vba-byte-array-allocation
    desc: VBA allocates bounded byte array
    crit: notable
    conf: 0.9
    for: [ooxml]
    if:
      type: text
      regex: '(?i)\bDim\s+[A-Za-z_]\w*\s*\(\s*[0-9]{2,6}\s*\)\s+As\s+Byte\b'
  - id: vba-delimited-byte-payload
    desc: VBA splits text into byte payload
    crit: suspicious
    conf: 0.9
    for: [ooxml]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\s*=\s*Split\s*\([^;\r\n]{1,160},\s*["''],["'']\s*\)'
