defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-shell-base32-stdout
    desc: Shell pipeline emits Base32 to workflow log
    if:
      type: text
      regex: '(?m)\| *base32( +-w *\d+)? *$'

  - id: gha-python-base32-stdout
    desc: Python prints Base32 encoded data
    if:
      type: text
      regex: '(?m)^[ \t]*print\(base64\.b32encode\([^;\r\n]{1,180}\)\.decode\(\)\) *$'

