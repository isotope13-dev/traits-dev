defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.82
traits:
  # A five-bit accumulator loop is only one part of an encoder; keep it as a
  # component and combine it with the alphabet and surrounding operation.
  - id: node-five-bit-loop
    desc: Compares pending bit count with five
    if:
      type: text
      regex: 'while\s*\(\s*bits\s*>=\s*5\s*\)'

  - id: rfc4648-lowercase-alphabet
    crit: notable
    desc: RFC4648 Base32 alphabet string
    if:
      type: string_literal
      exact: abcdefghijklmnopqrstuvwxyz234567
