# Python stdlib Base32 codec calls. Base32 is the DNS-safe alphabet, so the
# encode direction is the one tunnels reach for when packing command output
# into query labels — but on its own it is a neutral codec operation.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.93
  mbc: C0026

traits:
  - id: python-b32encode-call
    desc: Python calls the Base32 encoder
    if:
      type: text
      regex: '(?i)\bbase64\.b32encode\s*\('

  - id: python-b32decode-call
    desc: Python calls the Base32 decoder
    if:
      type: text
      regex: '(?i)\bbase64\.b32decode\s*\('
