defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-base32-encode
    desc: Shell invokes Base32 encoder
    if:
      type: symbol
      kind: call
      regex: '^(/usr/bin/|/bin/)?base32$'
    unless:
      - type: text
        regex: '\bbase32\s+(-d\b|--decode\b)'
