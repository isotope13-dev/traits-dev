defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-base32-bit-packing
    desc: PHP Base32 five-bit output packing
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (compound_statement
          (expression_statement (assignment_expression right: (string) @alphabet))
          (foreach_statement body: (compound_statement
            (expression_statement (assignment_expression right:
              (binary_expression
                left: (parenthesized_expression
                  (binary_expression operator: "<<" right: (integer) @width))
                right: (function_call_expression function: (name) @code)))))))) @encoder
          (#match? @alphabet "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567")
          (#eq? @code "ord")
          (#eq? @width "8")
          (#match? @encoder ">>[^;]{1,40}&\\s*31\\b"))
