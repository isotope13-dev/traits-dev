defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.85

traits:
  - id: encoding-base32-import
    desc: Go Base32 package import
    conf: 0.9
    if:
      type: import
      exact: encoding/base32

  - id: go-base32-encoder-configuration
    desc: Go configures a Base32 encoder
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: base32.StdEncoding.WithPadding

  - id: go-base32-stdlib-encode-call
    desc: Go calls a Base32 standard encoder
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^base32\.[A-Za-z0-9_]*Encoding\.(Encode|EncodeToString|AppendEncode)$'

  - id: go-base32-named-encode-call
    desc: Go calls a named Base32 encoder
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z0-9_]*base32[A-Za-z0-9_]*Encoding\.(Encode|EncodeToString|AppendEncode)$'

composite_rules:
  - id: go-base32-encode-call
    desc: Go calls a Base32 encoder
    crit: notable
    conf: 0.9
    any:
      - id: go-base32-stdlib-encode-call
      - id: go-base32-named-encode-call
