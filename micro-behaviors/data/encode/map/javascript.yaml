defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  conf: 0.8
traits:
- id: js-string-dict-map
  desc: JavaScript short-string character map
  crit: notable
  size_max: 200000
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/package/testing/scripted/
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
  - id: metadata/build
  - type: basename
    regex: \.baseline\.jsonc$
  if:
    type: text
    regex: '"\w{2,5}"\s*:\s*"(\\x[0-9a-fA-F]{2}|.)"'
- id: js-nested-object-table-mapping
  desc: Object mapping string keys to nested arrays
  crit: suspicious
  count_min: 5
  if:
    type: text
    regex: '"\w{1,5}":\s*\[\s*\d+\s*,\s*\[\s*\d+\s*,\s*"\\x[0-9a-fA-F]{2}"\s*\]\s*\]'
