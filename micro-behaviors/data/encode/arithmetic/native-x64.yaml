defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.93
traits:
  - id: rolling-key-xor-in-place-loop-x64
    desc: Rolling-key XOR loop over a buffer
    if:
      type: hex
      # The crypter's appended entry section; the stub never lives in .text.
      section: .data1
      # key byte = (state + index) & 0xFF, `xor [rsi+rdx], al`, then
      # state = state * K + C. The register choice is the stub generator's;
      # the multiplier and addend are the per-build secret and stay wild.
      pattern: '0F B6 C3 89 D7 81 E7 FF 00 00 00 01 F8 25 FF 00 00 00 30 04 16 0F B6 C3 6B C0 ?? 83 C0 ?? 88 C3 FF C2'
