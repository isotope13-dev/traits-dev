# Numeric constants written as offsets from a shared seed rather than as
# themselves. `const seed = 0x5B; [seed + 102, seed + 57, seed - 35, seed - 43]`
# is the literal 193.148.56.48, but nothing in the file spells it: `strings`,
# an IOC extractor, and a reviewer skimming for a hardcoded endpoint all come
# back empty, and the constant only exists once the expression is evaluated.
# Ordinary code that computes from a base does it inline at the use site; an
# array whose every element is the same shape of base-plus-literal is a table
# of hidden constants.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: seed-offset-integer-array
    desc: Integer array hides constants as offsets
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\[\s*([A-Za-z]\w*\s*[-+]\s*\d+\s*,\s*){2,}[A-Za-z]\w*\s*[-+]\s*\d+\s*\]'
