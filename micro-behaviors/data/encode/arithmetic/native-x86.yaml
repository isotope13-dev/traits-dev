defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.95
traits:
  - id: indexed-wide-add-loop-x86
    desc: Adds a constant to indexed wide characters
    if:
      type: hex
      section: .text
      # Indexed UTF-16 load, arbitrary additive key, indexed store, back edge.
      # Neither the key nor stack offsets identify the specimen.
      pattern: '0F B7 54 4D ?? 81 C2 ?? ?? ?? ?? 8B 85 ?? ?? ?? ?? 66 89 54 45 ?? EB ??'
  - id: repeating-key-subtract-loop-x86
    desc: Subtracts repeating key bytes from buffer
    if:
      type: hex
      section: .text
      # Unsigned remainder selects a key byte; subtract it from each data byte.
      pattern: '33 D2 F7 75 ?? 8B 45 ?? 0F B6 0C 10 8B 55 ?? 03 55 ?? 0F B6 02 2B C1 8B 4D ?? 03 4D ?? 88 01 EB ??'
