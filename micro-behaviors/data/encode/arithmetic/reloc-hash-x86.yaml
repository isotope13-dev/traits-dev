defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.96
traits:
  - id: reloc-multiply-subtract-byte-hash-x86
    desc: Reloc code computes rolling byte hash
    if:
      type: hex
      section: .reloc
      # Accumulate multiplier * hash - byte, advance a split cursor,
      # repeat over printable bytes, then compare using a stack key.
      pattern: '33 C0 6B C0 ?? 0F B6 4E ?? 83 EE ?? 2B C1 8D 76 ?? F6 D7 8B D8 80 7E ?? 0A 73 ?? [0-8] 33 44 24 ?? 59 5B'
