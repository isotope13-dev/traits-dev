defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.97
traits:
  - id: reloc-rolling-xor-subtract-loop-x86
    desc: Reloc loop applies rolling XOR and subtraction
    if:
      type: hex
      section: .reloc
      # Multiplied key, XOR/subtract of the same byte through a moving
      # pointer, exchange key registers and bytes, bounded backward loop.
      # Key material, trip limit, and junk immediates are wildcarded.
      pattern: '0F AF CA BE ?? ?? ?? ?? 30 4F FF 84 DC 47 4E 28 77 FE 87 D1 86 D6 83 E8 F8 4F 87 C9 3D ?? ?? ?? ?? 76 ??'
