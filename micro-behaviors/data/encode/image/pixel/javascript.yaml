# Browser-side image-carrier payloads often recover bytes from canvas pixels
# rather than from the image's visible content.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.003
  mbc: C0053

traits:
  - id: canvas-pixel-to-charcode
    desc: Converts Canvas pixels into characters
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bgetImageData\s*\([^)]{0,240}\)[\s\S]{0,900}\bString\.fromCharCode\s*\('
  - id: canvas-pixel-to-char-code-at
    desc: Converts Canvas pixel values with charCodeAt
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bgetImageData\s*\([^)]{0,240}\)[\s\S]{0,900}\bcharCodeAt\s*\('
  - id: canvas-pixel-to-byte-array
    desc: Copies Canvas pixels into a byte array
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bgetImageData\s*\([^)]{0,240}\)[\s\S]{0,900}\bUint8Array\s*\('
  - id: canvas-pixel-to-base64
    desc: Decodes Canvas-derived text as base64
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bgetImageData\s*\([^)]{0,240}\)[\s\S]{0,900}\batob\s*\('

composite_rules:
  - id: canvas-image-byte-reconstruction
    desc: Reconstructs a byte stream from Canvas image data
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/ui/graphics/draw::canvas-image-data-readback
    any:
      - id: canvas-pixel-to-charcode
      - id: canvas-pixel-to-char-code-at
      - id: canvas-pixel-to-byte-array
      - id: canvas-pixel-to-base64
    near_bytes: 1200
