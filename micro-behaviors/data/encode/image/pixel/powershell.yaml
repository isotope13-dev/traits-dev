# PowerShell bitmap decoders can serialize pixel channels into a byte stream.
# This is a neutral image-data mechanic until an objective rule establishes
# that the stream is being recovered as a concealed payload.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-bitmap-getpixel-call
    desc: PowerShell reads bitmap pixels
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.GetPixel\s*\([^\r\n)]{1,120}\)'

  - id: powershell-write-red-channel
    desc: Writes red pixel channel byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.WriteByte\s*\(\s*\[byte\]\s*\$\w+\.R\s*\)'

  - id: powershell-write-green-channel
    desc: Writes green pixel channel byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.WriteByte\s*\(\s*\[byte\]\s*\$\w+\.G\s*\)'

  - id: powershell-write-blue-channel
    desc: Writes blue pixel channel byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.WriteByte\s*\(\s*\[byte\]\s*\$\w+\.B\s*\)'

  - id: powershell-write-alpha-channel
    desc: Writes alpha pixel channel byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.WriteByte\s*\(\s*\[byte\]\s*\$\w+\.A\s*\)'

composite_rules:
  - id: powershell-bitmap-rgba-byte-stream
    desc: Serializes bitmap RGBA bytes
    crit: notable
    conf: 0.98
    all:
      - id: powershell-bitmap-getpixel-call
      - id: powershell-write-red-channel
      - id: powershell-write-green-channel
      - id: powershell-write-blue-channel
      - id: powershell-write-alpha-channel
    near_lines: 12
