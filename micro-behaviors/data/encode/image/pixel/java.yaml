# Per-pixel reads are ordinary image-processing capabilities. Keep this atom
# neutral; steganography objectives add byte reconstruction and execution.
defaults:
  platforms: [linux, macos, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.94

traits:
  - id: jvm-buffered-image-getrgb-call
    desc: JVM reads an individual BufferedImage pixel
    if:
      type: import
      exact: java/awt/image/BufferedImage.getRGB
