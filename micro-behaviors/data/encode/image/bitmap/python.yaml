# Python helpers that reconstruct byte buffers from uncompressed BMP pixel
# planes (trailing-channel walks with per-byte combiners).
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-bmp-plane-tail-function
    desc: Python bmp_plane_tail decoder defined
    if:
      type: text
      regex: 'def bmp_plane_tail\s*\('

  - id: python-bmp-channel-xor-mix
    desc: Python XOR-mixes BMP channel bytes
    if:
      type: text
      regex: 'buf\[ch_off\]\s*\^\s*mix'

composite_rules:
  - id: python-bmp-plane-tail-stego-decoder
    desc: Python BMP tail plane XOR steganography decoder
    crit: suspicious
    conf: 0.97
    attack: T1027.003
    mbc: B0032.001
    near_bytes: 4096
    all:
      - id: python-bmp-plane-tail-function
      - id: python-bmp-channel-xor-mix
