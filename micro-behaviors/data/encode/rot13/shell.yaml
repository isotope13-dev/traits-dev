defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: shell-tr-rot13-alphabet-arguments
    desc: tr uses ROT13 alphabet-translation arguments
    if:
      type: symbol
      kind: call
      regex: '(^|/)tr$'
      args:
        - index: 0
          kind: string
          exact: A-Za-z
        - index: 1
          kind: string
          exact: N-ZA-Mn-za-m
