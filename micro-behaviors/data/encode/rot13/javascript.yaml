# JavaScript ROT13 string transform implementations.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  crit: notable
traits:
  - id: js-rot13-replace-charcode-transform
    desc: JavaScript ROT13 charCodeAt transform
    conf: 0.95
    if:
      type: text
      regex: 'replace\s*\(\s*/\[a-zA-Z\]/g\b.{0,80}charCodeAt\(0\)\s*\+\s*13'
