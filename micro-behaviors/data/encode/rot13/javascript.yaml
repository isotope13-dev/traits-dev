# JavaScript ROT13 string transform implementations.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  crit: notable
traits:
  # Caesar rotation with any shift (ROT13 is shift 13): a letter-class
  # replace callback that wraps with modulo 26.
  - id: js-caesar-letter-rotation-replace
    desc: JavaScript Caesar letter-rotation transform
    conf: 0.93
    if:
      type: text
      regex: '\.replace\(\s*/\[(a-zA-Z|A-Za-z)\]/g,.{0,160}%\s*26\b'
  - id: js-rot13-replace-charcode-transform
    desc: JavaScript ROT13 charCodeAt transform
    conf: 0.95
    if:
      type: text
      regex: 'replace\s*\(\s*/\[a-zA-Z\]/g\b.{0,80}charCodeAt\(0\)\s*\+\s*13'
