defaults:
  conf: 0.95
  platforms:
    - unix
    - windows
  for: [python, ruby, perl, php, powershell]
traits:
  - id: rot13-windows
    desc: ROT13 encoded 'Windows' string (Jvaqbjf)
    crit: notable
    if:
      type: text
      substr: Jvaqbjf
  - id: rot13-rebase-tmp
    desc: ROT13 encoded 'rebase.tmp' string (eronfr.gzc)
    crit: notable
    if:
      type: text
      substr: 'eronfr.gzc'
  - id: rot13-amazon
    desc: ROT13 encoded 'Amazon.com' string (Nznmba.pbz)
    crit: suspicious
    if:
      type: text
      substr: 'Nznmba.pbz'
  - id: rot13-google
    desc: ROT13 encoded 'Google.com' string (Tbbtyr.pbz)
    crit: suspicious
    if:
      type: text
      substr: 'Tbbtyr.pbz'
  - id: rot13-url-https
    desc: ROT13 encoded 'https://' scheme (uggcf://)
    crit: suspicious
    if:
      type: text
      substr: 'uggcf://'
