defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-shell-rot13-stdout
    desc: Shell pipeline emits ROT13 to workflow log
    if:
      type: text
      regex: '(?m)\| *tr +(''A-Za-z''|"A-Za-z"|A-Za-z) +(''N-ZA-Mn-za-m''|"N-ZA-Mn-za-m"|N-ZA-Mn-za-m) *$'
