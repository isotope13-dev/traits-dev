# PE/DLL binaries that ship ROT13-obfuscated Windows path fragments.
# Classic MyDoom-family socks/autorun DLLs encode registry and filesystem
# paths this way; keep the atoms here so PE scans can see them (script-only
# rot13/strings.yaml does not cover pe).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: rot13-windows-path-fragment
    desc: ROT13-encoded Windows path fragment
    attack: T1027
    if:
      type: text
      substr: '\Jvaqbjf\'

  - id: rot13-software-prefix-fragment
    desc: ROT13 Softwa registry path shard
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Fbsgjn

  - id: rot13-microsoft-path-fragment
    desc: ROT13 Micros registry path shard
    crit: component
    conf: 0.9
    if:
      # Embedded between non-printable bytes so text extraction misses it.
      # Hex + offset_range (not section:) so packed DLLs with random section
      # names still match; search starts after typical PE headers.
      type: hex
      pattern: 5c 5a 76 70 65 62 66
      offset_range: [512, 262144]

  # Export/symbol form of the decoder used by socks55-style MyDoom helpers.
  - id: rot13-export-symbol
    desc: Exports a rot13 string decoder
    conf: 0.9
    if:
      type: symbol
      exact: rot13

  - id: rot13c-export-symbol
    desc: Exports a rot13c string decoder
    conf: 0.9
    if:
      type: symbol
      exact: rot13c

composite_rules:
  - id: rot13-software-microsoft-fragments
    desc: ROT13 Softwa/Micros registry path shards
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: rot13-software-prefix-fragment
      - id: rot13-microsoft-path-fragment

  - id: pe-rot13-windows-path-obfuscation
    desc: PE obfuscates Windows paths with ROT13
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: rot13-windows-path-fragment
    any:
      - id: rot13-export-symbol
      - id: rot13c-export-symbol
      - id: rot13-software-microsoft-fragments
