defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: js-alpha-index-bitset-shift
  desc: Maps lowercase character code to a bit
  crit: notable
  conf: 0.9
  ref: sha256:6f5f0528e5f3e6618a6c831de53be65f3f79290edf4d3e38433938eb118243f2
  if:
    type: text
    regex: '1\s*<<\s*\([^)]{0,40}\.charCodeAt\(0\)\s*-\s*97\)'
- id: js-alpha-index-bitset-fromcharcode
  desc: Converts alphabet index to lowercase character
  crit: notable
  conf: 0.9
  ref: sha256:6f5f0528e5f3e6618a6c831de53be65f3f79290edf4d3e38433938eb118243f2
  if:
    type: text
    regex: 'String\.fromCharCode\(\s*97\s*\+\s*\w+\s*\)'
composite_rules:
- id: js-alpha-index-bitset
  desc: Maps between lowercase letters and bit positions
  crit: component
  conf: 0.9
  ref: sha256:6f5f0528e5f3e6618a6c831de53be65f3f79290edf4d3e38433938eb118243f2
  # UI/state packing stores lowercase letters as bit positions and emits the
  # inverse alphabet index; it is not a ROT-N decode stream.
  all:
  - id: micro-behaviors/data/encode/charcode::js-alpha-index-bitset-shift
  - id: micro-behaviors/data/encode/charcode::js-alpha-index-bitset-fromcharcode
  near_lines: 20
