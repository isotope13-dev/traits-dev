traits:
- id: unicode-hidden-block-char-construction
  desc: Constructs invisible Unicode block characters
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: chr\([^)]{0,40}0[xX]E0(000|100)[^)]{0,40}\+|chr\([^)]{0,40}\+[^)]{0,40}0[xX]E0(000|100)
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
