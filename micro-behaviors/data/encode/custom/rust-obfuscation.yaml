defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.93
traits:
  - id: address-obfuscation-helper-call
    desc: Calls address-format obfuscation helpers
    if:
      type: symbol
      kind: call
      regex: '(^|::)obfuscate_(ipv4|ipv6|mac)$'
  - id: uuid-obfuscation-helper-call
    desc: Calls UUID-format obfuscation helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)obfuscate_uuid$'
  - id: word-obfuscation-helper-call
    desc: Calls word-format obfuscation helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)obfuscate_words$'
