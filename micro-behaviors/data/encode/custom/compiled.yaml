# Native lookup-table decoders.  The atom describes the transformation only;
# executable-memory and control-flow traits provide the intent gate.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027

traits:
  - id: x86-lookup-table-byte-decoder
    desc: x86 lookup-table loop decoding bytes
    # This is a complete byte transformation, not merely an encoding hint;
    # surface it so loaders that combine it with memory staging are visible.
    crit: notable
    conf: 0.78
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # Compare each input word against a 256-entry table, emit one byte,
      # and advance through the complete byte range.
      pattern: '31 C9 85 C0 74 ?? 8B 1C 8D ?? ?? ?? ?? 31 D2 39 1C 95 ?? ?? ?? ?? 75 ?? 88 14 08 EB ?? 42 81 FA 00 01 00 00 75 ?? 41 81 F9 ?? ?? ?? ?? 75 ?? 89 04 24 E8 ?? ?? ?? ??'
  - id: x86-indexed-substitution-byte-decoder
    desc: x86 indexed byte substitution loop
    crit: notable
    conf: 0.94
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # Load an input byte, widen it as the table index, add the input/output
      # loop offsets, then copy table[index] to the destination byte.
      pattern: '8A 00 88 85 ?? ?? ?? ?? [0-32] 0F B6 85 ?? ?? ?? ?? 8B 0D ?? ?? ?? ?? 03 8D ?? ?? ?? ?? 8B 15 ?? ?? ?? ?? 8A 04 02 88 01'

  - id: x86-in-place-subtraction-byte-decoder
    desc: x86 in-place byte subtraction decoder
    crit: notable
    conf: 0.99
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .reloc
      # Load a bounded byte count, then subtract one constant from every byte.
      pattern: 'B9 ?? ?? 00 00 80 2E ?? 46 E2 FA'
