# PHP's endian-conversion idiom: unpack a hex string into a value, then repack
# it with a machine format code ("v" = 16-bit little-endian). Binary protocol
# and crypto code uses this pair constantly, so XOR/obfuscation rules that key
# on `pack('H*')` alone need it to tell byte-order plumbing from a packed key.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-hex-unpack-repack-endian
    desc: PHP hex unpack repacked little-endian
    crit: component
    conf: 0.95
    if:
      type: text
      regex: "unpack\\s*\\(\\s*['\"]H\\*['\"].{0,80}pack\\s*\\(\\s*['\"]v\\*?['\"]"
