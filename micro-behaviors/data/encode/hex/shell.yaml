defaults:
  crit: notable
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: shell-hex-byte-sequence
    desc: Shell printf emits hex bytes
    conf: 0.9
    if:
      type: text
      regex: 'printf\s+[''"]\\x[0-9a-fA-F]{2}(\\x[0-9a-fA-F]{2}){3,}'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: hex-encode-xxd
    desc: Shell invokes xxd plain hex encoding
    conf: 0.96
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @command)
          . argument: (word) @option
          (#eq? @command "xxd")
          (#eq? @option "-p"))
    unless:
      - type: symbol
        kind: function
        exact: xxd
      - type: tree-sitter
        language: shell
        query: |
          (command name: (command_name (word) @alias)
            argument: [(concatenation . (word) @assignment) (word) @assignment]
            (#eq? @alias "alias")
            (#match? @assignment "^xxd="))
  - id: hex-dump-od
    desc: Hex dump via od
    conf: 0.6
    if:
      type: string_literal
      regex: od\s+-t\s+x1
