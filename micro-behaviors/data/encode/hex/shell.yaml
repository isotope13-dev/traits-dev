defaults:
  crit: notable
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: hex-encode-xxd
    desc: Shell invokes xxd plain hex encoding
    conf: 0.96
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @command)
          . argument: (word) @option
          (#eq? @command "xxd")
          (#eq? @option "-p"))
    unless:
      - type: symbol
        kind: function
        exact: xxd
      - type: tree-sitter
        language: shell
        query: |
          (command name: (command_name (word) @alias)
            argument: [(concatenation . (word) @assignment) (word) @assignment]
            (#eq? @alias "alias")
            (#match? @assignment "^xxd="))
  # A pipeline feeding command output into a byte-wise hex formatter.
  # The pipe is required: bare `hexdump file` is an ordinary file dump.
  # Extended past shell files because the same pipeline text is routinely
  # embedded as a command string in Python/C exploit and implant code.
  - id: piped-hex-encode-shell-output
    desc: Shell pipeline hex-encodes command output
    conf: 0.94
    for: [shell, python, c, cpp, go, rust, javascript, typescript]
    platforms: [unix]
    if:
      type: text
      regex: '\|[\s"''b]{0,16}(hexdump\b[^\r\n]{0,80}%02x|xxd\s+-p\b|od\b[^\r\n]{0,40}-t\s*x1)'
  # od has no reverse mode: any -t x invocation formats bytes as hex text.
  # string_literal never carries shell command text, so match the command line.
  - id: hex-dump-od
    desc: Hex dump via od
    conf: 0.6
    if:
      type: text
      regex: '\bod\s+.{0,50}-t\s*x'
