# Binary key material from hex-encoded hash digests is normal in PHP session
# and password helpers; dense-pack-calls must not treat it as obfuscation.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-pack-hex-from-hash-digest
    desc: PHP pack hex decodes a hash() digest
    crit: component
    conf: 0.95
    if:
      type: text
      regex: pack\s*\(\s*['"]H\*['"]\s*,\s*hash\s*\(
