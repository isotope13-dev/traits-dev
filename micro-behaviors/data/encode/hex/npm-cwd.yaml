defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-hex-encodes-cwd
    desc: Hex-encodes current working directory
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      regex: 'Buffer\.from\(process\.cwd\(\)\)\.toString\(["'']hex["'']\)'

