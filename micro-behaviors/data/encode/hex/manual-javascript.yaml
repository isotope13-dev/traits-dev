defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  mbc: "C0026"

traits:
  - id: js-table-nibble-encoder
    desc: Encodes bytes through nibble lookup tables
    if:
      type: text
      regex: '\w+\s*\[[^\[\n]{0,50}>>\s*4\s*\][^\]]{0,40}\w+\s*\[[^\[\n]{0,50}&\s*0x0[fF]\s*\]'

  - id: js-hex-string-stash-literal
    desc: JS assigns huge hex string literal
    crit: notable
    conf: 0.93
    size_min: 1000000
    attack: T1140
    if:
      type: text
      regex: '(?i)(const|let|var)\s+\w+\s*=\s*["''][0-9a-f]+["'']'
      length_min: 500000
