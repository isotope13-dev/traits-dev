defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  mbc: "C0026"

traits:
  - id: js-table-nibble-encoder
    desc: Encodes bytes through nibble lookup tables
    if:
      type: text
      regex: '\w+\s*\[[^\[\n]{0,50}>>\s*4\s*\][^\]]{0,40}\w+\s*\[[^\[\n]{0,50}&\s*0x0[fF]\s*\]'
