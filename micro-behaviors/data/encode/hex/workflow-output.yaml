# Shell hex formatters at the end of a workflow run pipeline write
# transformed bytes to the job log, like the Base32/Base64 atoms. The
# end-of-line anchor keeps file-redirected dumps out.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-shell-xxd-stdout
    desc: Shell pipeline emits xxd hex
    if:
      type: text
      regex: '(?m)\| *xxd\b[^|\n]{0,40}-p\b[^|\n]{0,30} *$'
  - id: gha-shell-od-hex-stdout
    desc: Shell pipeline emits od hex
    if:
      type: text
      regex: '(?m)\| *od\b[^|\n]{0,40}-t *x[0-9]*\b[^|\n]{0,30} *$'
  - id: gha-shell-hexdump-stdout
    desc: Shell pipeline emits hexdump hex
    if:
      type: text
      regex: '(?m)\| *hexdump\b[^|\n]{0,60}%02x[^|\n]{0,30} *$'

composite_rules:
  - id: gha-shell-hex-stdout
    desc: Shell pipeline emits hex output
    any:
      - id: gha-shell-xxd-stdout
      - id: gha-shell-od-hex-stdout
      - id: gha-shell-hexdump-stdout
