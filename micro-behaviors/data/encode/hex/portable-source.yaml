# Standard byte-to-hex operations across package languages. These are neutral
# serialization capabilities; exfiltration and obfuscation objectives combine
# them with the source and sink of the encoded bytes.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, class, java_class]
  crit: notable
  conf: 0.92
  mbc: C0026

traits:
  - id: dotnet-tohexstring-call
    desc: .NET converts bytes to a hexadecimal string
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: Convert.ToHexString

  - id: elixir-base-encode16-call
    desc: Elixir Base16-encodes data
    for: [elixir]
    if:
      type: symbol
      kind: call
      exact: Base.encode16

  - id: python-bytes-hex-call
    desc: Python converts bytes to hexadecimal text
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|[.])hex$'

  - id: ruby-unpack1-hex-call
    desc: Ruby unpacks bytes as hexadecimal text
    for: [ruby]
    if:
      type: symbol
      kind: call
      exact: unpack1
      arg:
        kind: string
        exact: H*

  - id: php-bin2hex-call
    desc: PHP converts bytes to hexadecimal text
    crit: component
    for: [php]
    if:
      type: symbol
      kind: call
      exact: bin2hex

  - id: percent-02x-byte-format-source
    desc: Source formats bytes as two hex digits
    for: [java, kotlin, swift]
    if:
      type: literal
      kind: string
      exact: '%02x'

  - id: jvm-hex-byte-format-class
    desc: JVM bytecode formats two-digit hex bytes
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '^%{1,2}02x$'

  - id: rust-hex-byte-format
    desc: Rust formats two-digit hex bytes
    for: [rust]
    if:
      type: literal
      kind: string
      exact: '{:02x}'

composite_rules:
  - id: byte-to-hex-encoding-operation
    desc: Converts byte content to hexadecimal text
    crit: component
    conf: 0.94
    any:
      - id: micro-behaviors/data/encode/hex::manual-lowercase-byte-hex-encoder
      - id: dotnet-tohexstring-call
      - id: elixir-base-encode16-call
      - id: micro-behaviors/data/encode/hex::go-hex-encode-string
      - id: micro-behaviors/data/encode/hex::buffer-hex
      - id: micro-behaviors/data/encode/hex::js-to-string-hex
      - id: micro-behaviors/data/encode/hex::perl-unpack-hex
      - id: php-bin2hex-call
      - id: python-bytes-hex-call
      - id: ruby-unpack1-hex-call
      - id: percent-02x-byte-format-source
      - id: jvm-hex-byte-format-class
      - id: rust-hex-byte-format
