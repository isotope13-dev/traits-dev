# Manual byte-to-hex encoders use the two nibbles of each byte to index a
# sixteen-character alphabet. This is neutral encoding behavior; objectives
# add the source of the bytes and the eventual sink.
defaults:
  platforms: [windows, unix]
  for: [source]
  crit: notable
  conf: 0.94

traits:
  - id: lowercase-hex-alphabet
    desc: Source contains lowercase hexadecimal alphabet
    crit: notable
    if:
      type: literal
      kind: string
      exact: '0123456789abcdef'

  - id: high-nibble-array-index
    desc: Source indexes array by high nibble
    crit: component
    if:
      type: text
      regex: '\[[^\]\r\n]{0,80}>>\s*4\]'

  - id: low-nibble-array-index
    desc: Source indexes array by low nibble
    crit: component
    if:
      type: text
      regex: '\[[^\]\r\n]{0,80}&\s*0x[fF]\]'

composite_rules:
  - id: manual-lowercase-byte-hex-encoder
    desc: Source manually encodes bytes as lowercase hex
    crit: notable
    near_bytes: 2048
    all:
      - id: lowercase-hex-alphabet
      - id: high-nibble-array-index
      - id: low-nibble-array-index
