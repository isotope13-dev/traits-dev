# Hex applied to the value returned by os.networkInterfaces(). A later
# helper that hex-encodes some other string is not this observation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: js-tohex-networkinterfaces-call
    desc: Passes networkInterfaces() into toHex
    if:
      type: text
      regex: 'toHex\([\s\S]{0,80}networkInterfaces\(\)'
  - id: js-networkinterfaces-tostring-hex
    desc: Calls toString hex on networkInterfaces()
    if:
      type: text
      regex: 'networkInterfaces\(\)[\s\S]{0,80}toString\([''"]hex[''"]\)'
composite_rules:
  - id: js-os-networkinterfaces-to-hex
    desc: Hex-encodes a networkInterfaces() value
    any:
      - id: js-tohex-networkinterfaces-call
      - id: js-networkinterfaces-tostring-hex
