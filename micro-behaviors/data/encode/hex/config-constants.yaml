defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - ruby
  - php
  - go
  - rust
traits:
- id: arch-keyed-hex-blob-dict--encoded-value
  desc: Architecture keyed hex byte-array value
  crit: notable
  conf: 0.94
  count_min: 2
  if:
    type: text
    regex: \[(\s*0x[0-9A-Fa-f]{2}\s*,){8,}
- id: cred-named-hex-string-const--rx-22
  desc: SECRET-named encoded constant
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)\bsecret\w*[:=]\s*("(\\x[0-9a-f]{2}){8,}"|(\[ *0x[0-9a-f]{2} *,){8,})
- id: cred-named-hex-string-const--rx-23
  desc: TOKEN-named encoded constant
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)\btoken\w*[:=]\s*("(\\x[0-9a-f]{2}){8,}"|(\[ *0x[0-9a-f]{2} *,){8,})
- id: cred-named-hex-string-const--rx-24
  desc: CRED-named encoded constant
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)\bcred\w*[:=]\s*("(\\x[0-9a-f]{2}){8,}"|(\[ *0x[0-9a-f]{2} *,){8,})
composite_rules:
- for:
  - python
  - javascript
  - rust
  - ruby
  - go
  id: arch-keyed-hex-blob-dict
  desc: Hex arrays with platform and config labels
  crit: notable
  conf: 0.94
  needs: 3
  all:
  - id: micro-behaviors/data/encode/hex::arch-keyed-hex-blob-dict--encoded-value
  any:
  - id: micro-behaviors/data/config/schema::uppercase-platform-assignment-label
  - id: micro-behaviors/data/config/schema::arch-keyed-hex-blob-dict--rx-15
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-5
  - id: micro-behaviors/data/config/schema::arch-keyed-hex-blob-dict--rx-18
  - id: micro-behaviors/data/config/schema::arch-keyed-hex-blob-dict--rx-19
  - id: micro-behaviors/data/serialize/schema-object::linux-platform-map-key
  - id: micro-behaviors/data/config/schema::arch-keyed-hex-blob-dict--rx-21
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  - go
  - rust
  id: cred-named-hex-string-const
  desc: Credential-named hex string constant
  crit: notable
  conf: 0.88
  needs: 2
  any:
  - id: micro-behaviors/data/encode/hex::cred-named-hex-string-const--rx-22
  - id: micro-behaviors/data/encode/hex::cred-named-hex-string-const--rx-23
  - id: micro-behaviors/data/encode/hex::cred-named-hex-string-const--rx-24
