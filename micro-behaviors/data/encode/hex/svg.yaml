defaults:
  platforms: [unix, windows]
  for: [svg]

traits:
  - id: svg-long-hex-string-literal
    desc: Long hexadecimal string literal in SVG markup
    crit: notable
    conf: 0.86
    count_min: 2
    if:
      type: text
      regex: '[''\"][0-9a-fA-F]{80,}[''\"]'
      not:
        - regex: '[''\"](0{80,}|1{80,}|2{80,}|3{80,}|4{80,}|5{80,}|6{80,}|7{80,}|8{80,}|9{80,}|[aA]{80,}|[bB]{80,}|[cC]{80,}|[dD]{80,}|[eE]{80,}|[fF]{80,})[''\"]'

  - id: svg-hex-escaped-member-call
    desc: SVG script calls a hex-escaped property
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\[\s*["'']([^"'']{0,120}\\x[0-9a-fA-F]{2}){4,}[^"'']{0,120}["'']\s*\]\s*\('

  # String-table obfuscation inside an SVG script: API names and URLs are
  # stored as hex-escaped array elements and reassembled through indexed
  # access (`document[_0x4f2a[1]]('script')`), so neither `createElement` nor
  # `atob` ever appears literally. Diagram exporters (Inkscape, draw.io) emit
  # human-readable markup and never hex-escaped string tables, which makes the
  # array form as strong as the inline member-call above.
  - id: svg-hex-escaped-string-array
    desc: SVG stores strings as hex-escaped array
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(["''][^"'']{0,100}\\x[0-9a-fA-F]{2}[^"'']{0,100}["'']\s*,\s*){2}'
