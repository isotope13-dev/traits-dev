defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-byte-hex-format"
    desc: "Lua formats a byte as hexadecimal"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "string.format"
      arg:
        index: 0
        kind: "string"
        regex: "^%02[xX]$"
