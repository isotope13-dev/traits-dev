defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [python, javascript]
traits:
  - id: buffer-hex
    desc: Converts buffer to hex string
    # `Buffer.from(...).toString("hex")` — the chained Buffer→toString("hex")
    # call is distinctive enough as source text (no live query needed).
    if:
      type: text
      regex: 'Buffer\.from\s*\([^)]{0,200}\)\s*\.toString\s*\(\s*[''"]hex[''"]'
  - id: js-to-string-hex
    desc: Calls JavaScript toString with hex encoding
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)toString$'
      arg:
        kind: string
        exact: hex
