# URL encoding - PHP
defaults:
  crit: notable
  for: [php]
  platforms: [unix, windows]

traits:
  - id: http-build-query-call
    desc: Builds PHP query string from key-value data
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: http_build_query

  - id: urlencode-call
    desc: URL-encodes data via PHP urlencode
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: urlencode
