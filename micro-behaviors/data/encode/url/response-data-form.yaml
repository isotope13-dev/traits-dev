# Also recognize JavaScript embedded in a PowerShell here-string. The body
# expression is required: a responseData read elsewhere is insufficient.
defaults:
  for: [javascript, typescript, html, powershell]
  platforms: [windows, unix]
traits:
  - id: uri-encoded-response-data-form-body
    desc: Form body URI-encodes responseData member
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'body:\s*["''][^"'']{1,64}["'']\s*\+\s*encodeURIComponent\(\w+\.responseData'
