defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  size_max: 524288
traits:
  - id: session-value-uri-encoded
    desc: URI-encodes a cookie or session value
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)\b(cookie|session|sid)[\w-]{0,32}=.{0,40}encodeURIComponent\(
  - id: cookie-session-argument
    desc: URL-encodes a cookie or session expression
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: encodeURIComponent\([^)]{0,160}(document\.cookie|cookies?)
