traits:
  - id: session-value-uri-encoded
    desc: URI-encodes a cookie or session value
    platforms: [windows, unix]
    for: [html, javascript]
    size_max: 524288
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)\b(cookie|session|sid)[\w-]{0,32}=.{0,40}encodeURIComponent\(
