defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-command-output-uri-encoding
    desc: URI-encodes the trimmed output of execSync
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (
        (statement_block
          (variable_declaration
            (variable_declarator
              name: (identifier) @output
              value: (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression
                      property: (property_identifier) @exec))
                  property: (property_identifier) @trim))))
          .
          (expression_statement
            (call_expression
              arguments: (arguments
                (binary_expression
                  right: (call_expression
                    function: (identifier) @encode
                    arguments: (arguments (identifier) @encoded))))))) @chain
        (#eq? @exec "execSync")
        (#eq? @trim "trim")
        (#eq? @encode "encodeURIComponent")
        (#eq? @output @encoded)
        )
