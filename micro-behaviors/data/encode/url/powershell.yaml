defaults:
  for: [powershell]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-uri-escape-data-string-call
    desc: PowerShell URI percent-encoding call syntax
    if:
      type: text
      regex: '\[(System\.)?Uri\]\s*::\s*EscapeDataString\s*\('
      case_insensitive: true
