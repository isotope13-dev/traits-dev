defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
traits:
- id: execsync-output-uri-callback
  desc: URI-encoded shell output reaches callback
  if:
    type: tree-sitter
    query: '(try_statement body: (statement_block (variable_declaration (variable_declarator name: (identifier) @output value: (call_expression function: (member_expression object: (call_expression function: (member_expression property: (property_identifier) @exec)) property: (property_identifier) @trim)))) (expression_statement (call_expression arguments: (arguments (binary_expression right: (call_expression function: (identifier) @encode arguments: (arguments (identifier) @sent)))))))) @block (#eq? @exec "execSync") (#eq? @trim "trim") (#eq? @encode "encodeURIComponent") (#eq? @output @sent)'
- id: execsync-output-uri-encode-call
  desc: encodeURIComponent wraps execSync trimmed output
  if:
    type: text
    regex: 'encodeURIComponent\(\s*[\w$]+\.execSync\([^)]{0,120}\)\s*\.trim\(\s*\)\s*\)'
