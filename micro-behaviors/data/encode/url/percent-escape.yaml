# Re-escaping '%' turns existing percent escapes into another encoding layer.
# This operation alone is neutral; exploit consumers supply traversal context.
defaults:
  for: [python, javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: percent-sign-reescape
    desc: Replaces percent signs with percent-25
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.replace$'
      args:
        - index: 0
          kind: string
          exact: '%'
        - index: 1
          kind: string
          exact: '%25'
