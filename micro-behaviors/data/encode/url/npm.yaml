defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-postinstall-json-url-encoding
    desc: npm postinstall encodes JSON into URL
    crit: notable
    conf: 0.94
    if:
      type: value
      path: scripts.postinstall
      regex: 'https://.{0,260}encodeURIComponent\s*\(\s*JSON\.stringify'
