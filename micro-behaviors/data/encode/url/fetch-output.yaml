defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: bound-output-fetch-uri
    desc: Fetch URL URI-encodes captured call output
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
         (variable_declaration (variable_declarator name: (identifier) @output
          value: (call_expression function: (member_expression
           object: (call_expression function: (identifier))
           property: (property_identifier) @trim))))
         (expression_statement (call_expression function: (member_expression
          object: (call_expression function: (identifier) @fetch
           arguments: (arguments (binary_expression
            right: (call_expression function: (identifier) @encode
             arguments: (arguments (call_expression function: (member_expression
              object: (identifier) @sent property: (property_identifier) @slice)))))))))))
         (#eq? @output @sent)
         (#eq? @trim "trim")
         (#eq? @fetch "fetch")
         (#eq? @encode "encodeURIComponent")
         (#eq? @slice "substring"))
