defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.97

traits:
  - id: shell-base64-output-file
    desc: Writes Base64 encoder output to a file
    if:
      type: tree-sitter
      query: |
        ((redirected_statement
          body: (command name: (command_name) @encoder)
          redirect: (file_redirect ">" destination: (_))) @write
         (#eq? @encoder "base64")
         (#not-match? @write "\\s(-[dD]|--decode)(\\s|$)")
         (#not-match? @write ">\\s*/dev/null\\s*$"))
