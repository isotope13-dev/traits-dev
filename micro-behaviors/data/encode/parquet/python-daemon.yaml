defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-argument-parquet-daemon-worker
    desc: Daemon worker serializes a passed frame
    crit: notable
    conf: 0.97
    # Bind the outer input to Thread.args and the worker's first parameter
    # to the to_parquet receiver. This does not infer a remote destination,
    # theft, or an authorization boundary from serialization alone.
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition
          parameters: (parameters
            (identifier) @_self
            (typed_parameter (identifier) @input))
          body: (block
            (function_definition
              name: (identifier) @worker
              parameters: (parameters . (identifier) @worker_input)
              body: (block
                (with_statement body: (block
                  (try_statement body: (block
                    (with_statement body: (block
                      (expression_statement
                        (call function: (attribute
                          object: (identifier) @serialized_input
                          attribute: (identifier) @serialize)))))))))))
            (try_statement body: (block
              (expression_statement
                (call function: (attribute
                  object: (call
                    function: (_) @thread
                    arguments: (argument_list
                      (keyword_argument name: (identifier) @target_key
                        value: (identifier) @target)
                      (keyword_argument name: (identifier) @args_key
                        value: (tuple . (identifier) @thread_input))
                      (keyword_argument name: (identifier) @daemon_key
                        value: (true))))
                  attribute: (identifier) @start))))))) @flow
          (#eq? @worker @target)
          (#eq? @input @thread_input)
          (#eq? @worker_input @serialized_input)
          (#eq? @serialize "to_parquet")
          (#match? @thread "^(Thread|threading[.]Thread)$")
          (#eq? @target_key "target")
          (#eq? @args_key "args")
          (#eq? @daemon_key "daemon")
          (#eq? @start "start"))
