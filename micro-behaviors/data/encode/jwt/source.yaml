# Compact JWT construction mechanics. Generic dotted concatenation is kept
# under data/string/concat; only the composite adds a JWT encoding claim.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: jwt-library-signing-call
    desc: JWT library signs or encodes a token
    crit: notable
    conf: 0.96
    for: [python, javascript, typescript, ruby, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(jwt|jsonwebtoken|jose\.jwt)(\.|::)(encode|sign)$'

  - id: jwt-variable-empty-tail-concat
    desc: JWT variables concat an empty signature
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\b(jwt|token)\w*\s*=\s*\w+\s*\+\s*["'']\.["'']\s*\+\s*\w+\s*\+\s*["'']\.["'']'

  - id: dotted-empty-tail-python-join
    desc: Python dotted join has empty final segment
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '["'']\.["'']\.join\(\s*[\[(][^,\n]{1,40},[^,\n]{1,40},\s*["'']["'']\s*[\])]'

  - id: dotted-empty-tail-array-join
    desc: Array dotted join has empty final segment
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[^,\n\[]{0,40},[^,\n]{1,40},\s*["'']["'']\s*\]\.join\(\s*["'']\.["'']\s*\)'

composite_rules:
  - id: jwt-empty-signature-construction
    desc: Constructs unsigned JWT with empty signature
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/token-auth::jwt-unsecured-algorithm
    any:
      - id: micro-behaviors/data/string/concat::dotted-empty-tail-call-concat
      - id: jwt-variable-empty-tail-concat
      - id: dotted-empty-tail-python-join
      - id: dotted-empty-tail-array-join
    near_bytes: 1024
