# Compact JWT construction mechanics. The dotted-tail atoms are deliberately
# components: only their combination with the unsecured JWT algorithm is a
# meaningful encoding behavior.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: dotted-empty-tail-call-concat
    desc: Dotted call concat has empty final segment
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\+\s*["'']\.["'']\s*\+\s*\w+\([^\n)]{1,60}\)\s*\+\s*["'']\.["'']\s*$'

  - id: jwt-variable-empty-tail-concat
    desc: JWT variables concat an empty signature
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\b(jwt|token)\w*\s*=\s*\w+\s*\+\s*["'']\.["'']\s*\+\s*\w+\s*\+\s*["'']\.["'']'

  - id: dotted-empty-tail-python-join
    desc: Python dotted join has empty final segment
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '["'']\.["'']\.join\(\s*[\[(][^,\n]{1,40},[^,\n]{1,40},\s*["'']["'']\s*[\])]'

  - id: dotted-empty-tail-array-join
    desc: Array dotted join has empty final segment
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[^,\n\[]{0,40},[^,\n]{1,40},\s*["'']["'']\s*\]\.join\(\s*["'']\.["'']\s*\)'

composite_rules:
  - id: jwt-empty-signature-construction
    desc: Constructs unsigned JWT with empty signature
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/token-auth::jwt-unsecured-algorithm
    any:
      - id: dotted-empty-tail-call-concat
      - id: jwt-variable-empty-tail-concat
      - id: dotted-empty-tail-python-join
      - id: dotted-empty-tail-array-join
    near_bytes: 1024
