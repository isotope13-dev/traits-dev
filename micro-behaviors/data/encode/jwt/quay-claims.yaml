defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: encode-anonymous-quay-claims
    desc: Encodes anonymous Quay identity claims
    if:
      type: symbol
      kind: call
      exact: jwt.encode
      args:
        - index: 0
          from: {field: iss, whole_value: '^quay$'}
        - index: 0
          from: {field: sub, whole_value: '^anonymous$'}
