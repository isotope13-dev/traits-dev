defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-ascii-encode-call
    desc: Calls encode with ASCII character encoding
    if:
      type: symbol
      kind: call
      regex: '(^|\.)encode$'
      arg:
        index: 0
        kind: string
        exact: ascii
