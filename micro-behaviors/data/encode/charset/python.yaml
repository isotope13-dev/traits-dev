defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-json-string-encode
    desc: Encodes serialized JSON text as bytes
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: json.dumps.encode

  - id: python-latin1-encode-call
    desc: Python encodes a string as latin-1 bytes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.encode\s*\(\s*["\x27]latin[-_]?1["\x27]\s*\)'
