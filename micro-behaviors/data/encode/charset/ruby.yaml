defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-utf16le-encode
    desc: Ruby encodes a string as UTF-16LE
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: encode
      arg:
        index: 0
        kind: string
        exact: UTF-16LE
