defaults:
  for: [csharp]
  platforms: [windows, unix]

traits:
  - id: dotnet-utf8-getbytes
    desc: C# encodes text as UTF-8 bytes
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Encoding\.UTF8\.GetBytes$'

  - id: powershell-utf8-getbytes
    desc: PowerShell converts text to UTF-8 bytes
    crit: notable
    conf: 0.94
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\](::|[.])UTF8[.]GetBytes\s*\('

  - id: powershell-ascii-getbytes
    desc: PowerShell converts text to ASCII bytes
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [powershell]
    if:
      # Method invocations are not projected as PowerShell call facts. Anchor
      # the AST expression to avoid comments and quoted source examples.
      type: tree-sitter
      node: invokation_expression
      regex: '(?i)^\[(System\.)?Text\.Encoding\]::ASCII\.GetBytes\s*\('
