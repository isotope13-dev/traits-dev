defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: js-cat-etc-files-b64
    desc: Shell base64 encodes etc files
    crit: suspicious
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: "cat /etc/(hosts|passwd|group).{0,360}\\|\\s*base64"
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: metadata/package/testing/corpus/security-tests::rule-test-case-detection-verdicts
