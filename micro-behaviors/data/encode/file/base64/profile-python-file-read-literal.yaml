defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: python-base64-file-read-utf8-literal
    desc: Base64 file encoder call in literal
    if:
      type: string_literal
      regex: base64\.b64encode\((image_file|f|file|handle)\.read\(\)\)\.decode\("utf-8"\)
