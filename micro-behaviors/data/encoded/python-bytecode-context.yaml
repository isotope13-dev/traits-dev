defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: pyc-base64-pe-temp-subprocess
    desc: Bytecode has Base64 PE and temp/subprocess clues
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/encoding::base64-pe-header-text
      - id: micro-behaviors/data/encode/base64::embedded-base64-blob
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/fs/temp/directory::directory-python
      - id: micro-behaviors/process/create/subprocess::subprocess-result-pyc
