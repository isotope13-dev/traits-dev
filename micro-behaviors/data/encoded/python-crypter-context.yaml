# Bytecode-visible blob and module references do not establish a decrypt,
# file write, or launch. Keep the combined signal with encoded-data evidence.
defaults:
  platforms: [windows, unix]
  for: [python, pyc]

composite_rules:
  - id: pyc-base64-cipher-temp-subprocess-profile
    for: [pyc]
    desc: Pyc Base64, cipher-module, temp and subprocess clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/encoding::python-base64-alphabet-run
      - id: metadata/import/python/crypto/cipher
      - id: micro-behaviors/fs/temp/reference::tempfile-ref
      - id: metadata/binary/symbols/name/token::pyc-subprocess-name-reference
