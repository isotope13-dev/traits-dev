defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  conf: 0.7
traits:
  - id: base64-token
    desc: Calls a Base64 conversion helper
    crit: baseline
    if:
      type: text
      regex: '(?i)\b(atob|btoa|base64)\s*\('
    not:
      - substr: ".cargo\\registry\\src\\"
      - substr: "\\base64-"
      - substr: "\\base64.rs"
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - type: text
        regex: '(?i)[\\/]+base64-[0-9]+\.[0-9]+\.[0-9]+[\\/]'
