defaults:
  platforms: [windows, unix]
  for: [wasm]
  crit: notable
  conf: 0.98

traits:
  - id: wasm-indexed-byte-rotation-loop
    desc: WASM repeats indexed byte rotation loops
    if:
      type: yara
      source: |
        rule wasm_indexed_byte_rotation_loops {
          strings:
            $loop = { 20 00 41 ?? [0-2] 49 04 40 20 00 20 00 41 ?? [0-4] 6A 2D 00 00 41 ?? [0-4] 20 00 41 03 71 41 03 74 76 }
          condition:
            #loop >= 8
        }
