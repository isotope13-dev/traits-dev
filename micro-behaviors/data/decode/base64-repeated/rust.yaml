defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  attack: T1140
  mbc: C0053

traits:
  # Repeated calls establish Base64 decoding activity, but not obfuscation:
  # legitimate crypto, protocol, and import code commonly decodes several
  # independent fields through the same engine.
  - id: rust-repeated-standard-engine-decodes
    desc: Rust repeats standard Base64 decoding
    conf: 0.97
    count_min: 2
    if:
      type: symbol
      kind: call
      regex: '^STANDARD(_NO_PAD)?\.decode$'

  - id: rust-repeated-url-safe-engine-decodes
    desc: Rust repeats URL-safe Base64 decoding
    conf: 0.97
    count_min: 2
    if:
      type: symbol
      kind: call
      regex: '^URL_SAFE(_NO_PAD)?\.decode$'
