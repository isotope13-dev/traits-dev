defaults:
  platforms: [unix, windows]
  for: [text, batch]
  crit: notable
  attack: T1140
  mbc: C0053

traits:
  - id: short-command-syntax-repeated
    desc: Text repeats short Base64 decode commands
    conf: 0.98
    count_min: 2
    if:
      id: micro-behaviors/data/decode/base64::base64-d-cmd

  - id: long-command-syntax-repeated
    desc: Text repeats long Base64 decode commands
    conf: 0.98
    count_min: 2
    if:
      id: micro-behaviors/data/decode/base64::base64-decode-cmd

composite_rules:
  - id: command-syntax-repeated
    desc: Text repeats Base64 decode commands
    conf: 0.98
    any:
      - id: short-command-syntax-repeated
      - id: long-command-syntax-repeated
      - id: micro-behaviors/data/decode/base64::base64-d-cmd
      - id: micro-behaviors/data/decode/base64::base64-decode-cmd
    needs: 2
