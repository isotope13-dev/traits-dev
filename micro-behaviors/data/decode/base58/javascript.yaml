defaults:
  crit: notable
  conf: 0.8
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1140
  mbc: C0053
traits:
  - id: bs58-decode
    desc: Base58 decode operation
    if:
      type: text
      substr: bs58.decode
  - id: base58-decode-function-marker
    desc: Base58 decode function marker
    if:
      type: text
      substr: b58decode
  - id: imported-base58-converter-initialized
    desc: Base58 alphabet initializes decoder
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz[\s\S]{0,120}ALPHABET\)'
