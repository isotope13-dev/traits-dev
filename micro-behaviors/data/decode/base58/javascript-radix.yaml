# Hand-written conversion used for address validation as well as payloads.
# Alphabet, indexed lookup and radix accumulation are independent roles.
defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: bigint-radix58-accumulation
    desc: Accumulates Base58 digits into BigInt
    if:
      type: text
      exclude_comments: true
      regex: '\b\w+\s*\*\s*58n\s*\+\s*BigInt\s*\('
composite_rules:
  - id: javascript-indexed-base58-decoder
    desc: Base58 alphabet lookup with radix accumulation
    conf: 0.97
    near_bytes: 650
    all:
      - id: micro-behaviors/data/encoding/base58::bitcoin-base58-alphabet
      - id: bigint-radix58-accumulation
      - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
