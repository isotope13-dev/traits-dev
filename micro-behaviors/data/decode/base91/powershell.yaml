# The basE91 pair-packing algorithm also appears with a 93-symbol alphabet.
# Require adaptive 13/14-bit unpacking, rather than the generator's names.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
  attack: T1140
traits:
  - id: powershell-pair-bit-mask
    desc: PowerShell masks a thirteen-bit value
    if:
      type: text
      regex: '-band\s+(8191|0x1[fF]{3})\b'
      exclude_comments: true
  - id: powershell-adaptive-pair-width
    desc: Adds thirteen or fourteen to a counter
    if:
      type: text
      regex: '\$\w+\s*\+=\s*13\s*\}\s*else\s*\{\s*\$\w+\s*\+=\s*14\b'
      exclude_comments: true
composite_rules:
  - id: powershell-adaptive-pair-decoder
    desc: PowerShell adaptive radix-pair byte decoder
    near_lines: 5
    all:
      - id: powershell-pair-bit-mask
      - id: powershell-adaptive-pair-width
