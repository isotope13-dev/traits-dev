defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: base91-magic-constants--rx-1
    desc: Base91 mask operation and radix constant cluster
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '0x5b.{0,200}&\s*0x1fff.{0,200}0x58'
    not:
      - regex: '0x5b,\s*0x1fff,\s*0x58'
  - id: base91-magic-constants--rx-2
    desc: Base91 mask operation and radix constant cluster
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '0x58.{0,200}&\s*0x1fff.{0,200}0x5b'
  - id: base91-magic-constants--rx-3
    desc: Base91 mask operation and radix constant cluster
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '&\s*0x1fff.{0,200}0x5b.{0,200}0x58'
composite_rules:
  - id: base91-magic-constants
    desc: Base91 decoder magic constants
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/data/decode/base91::base91-magic-constants--rx-1
      - id: micro-behaviors/data/decode/base91::base91-magic-constants--rx-2
      - id: micro-behaviors/data/decode/base91::base91-magic-constants--rx-3
