defaults:
  crit: notable
  conf: 0.94
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: imports-shader-decoder
    desc: Imports a local shader decoder
    if:
      type: text
      regex: 'import\s+\w+\s+from\s+["\x27][^"\x27]{0,100}(shader|glsl)[^"\x27]{0,40}["\x27]'
  - id: exports-mz-base64-to-decoder
    desc: Passes MZ-prefixed Base64 text to a decoder
    if:
      type: text
      regex: 'export\s+default\s+\w+\s*\(\s*["\x27]TVp[A-Za-z0-9+/=]{100,}'

composite_rules:
  - id: shader-base64-text-decoder-call
    desc: Base64 shader data passed to decoder
    conf: 0.94
    all:
      - id: imports-shader-decoder
      - id: exports-mz-base64-to-decoder
    near_bytes: 512
