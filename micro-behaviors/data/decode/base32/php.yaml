defaults:
  platforms: [unix, windows]
  for: [php]
traits:
- id: php-base32-alphabet-assignment
  desc: PHP manually decodes Base32 bytes
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?is)\$[A-Za-z_]\w*\s*=\s*["'']ABCDEFGHIJKLMNOPQRSTUVWXYZ234567["'']'
- id: php-base32-byte-reconstruction
  desc: PHP shifts Base32 bits into decoded bytes
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?is)<<\s*5.{0,300}chr\s*\('

- id: php-base32-bit-unpacking
  desc: PHP Base32 five-bit byte reconstruction
  crit: notable
  conf: 0.94
  if:
    type: tree-sitter
    query: |
      ((function_definition body: (compound_statement
        (expression_statement (assignment_expression right: (string) @alphabet))
        (foreach_statement body: (compound_statement
          (expression_statement (assignment_expression right:
            (function_call_expression function: (name) @lookup)))
          (expression_statement (assignment_expression right:
            (binary_expression left: (parenthesized_expression
              (binary_expression operator: "<<" right: (integer) @width))))))))) @decoder
        (#match? @alphabet "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567")
        (#eq? @lookup "strpos")
        (#eq? @width "5")
        (#match? @decoder "chr\\s*\\("))

composite_rules:
- id: php-base32-decoder
  desc: PHP manually decodes Base32 bytes
  crit: notable
  conf: 0.94
  near_lines: 60
  all:
  - id: php-base32-alphabet-assignment
  - id: php-base32-byte-reconstruction
