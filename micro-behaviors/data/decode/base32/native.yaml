defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-five-bit-table-byte-decoder
    desc: Table-decoded five-bit values reconstruct bytes
    conf: 0.98
    if:
      type: hex
      section: .text
      # Accumulate a table lookup in five-bit units, shift out a byte,
      # store it, then retain the remaining bits. No alphabet is pinned.
      pattern: '89 E9 C1 E1 05 0F B6 6C 14 ?? 8D 57 05 09 CD 83 FF 02 76 ?? 83 C7 FD 89 F9 89 EA D3 EA [0-40] 42 88 14 38 89 F9 49 FF C7 BA FF FF FF FF D3 E2'
