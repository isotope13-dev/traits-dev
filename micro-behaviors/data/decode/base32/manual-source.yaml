defaults:
  platforms: [unix, windows]
  for: [perl, rust]
  crit: notable
  conf: 0.93
  attack: T1140

traits:
  - id: manual-base32-bit-accumulator
    desc: Manual five-bit Base32 byte reconstruction
    if:
      type: text
      # Standard alphabet plus five-bit accumulation identifies the codec
      # without depending on local variable names or decoded content.
      regex: '(?is)ABCDEFGHIJKLMNOPQRSTUVWXYZ234567[\s\S]{0,200}(<<\s*5|shl\s*\(?\s*5)'
