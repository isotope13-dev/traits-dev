defaults:
  platforms: [linux, macos]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-base32-decode
    desc: Base32 command selects decoding mode
    if:
      type: tree-sitter
      query: |
        ((command
          name: (command_name) @decoder
          argument: (word) @option) @decode
          (#match? @decoder "^(/usr/bin/|/bin/)?base32$")
          (#match? @option "^(-d|--decode)$"))
