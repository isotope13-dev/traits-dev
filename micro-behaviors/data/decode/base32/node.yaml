# Base32 encoding token in a Node Buffer.from call.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-base32-decoder-call
  desc: Node Buffer.from uses Base32 token
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: Buffer\.from\s*\([^\n)]{0,180}["']base32["']\s*\)
