# Base32 token reference only: standard Node Buffer does not implement this codec.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-buffer-base32-call-text
  desc: Buffer.from text requests Base32 encoding
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: Buffer\.from\s*\([^\n)]{0,180}["']base32["']\s*\)
