defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: codecs-decode-call
    desc: "Calls codecs.decode for data transformation"
    conf: 0.8
    # Scheme-specific codecs.decode calls have dedicated traits under their
    # algorithm homes; this rule records the directional decode operation.
    if:
      type: symbol
      kind: call
      exact: 'codecs.decode'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
