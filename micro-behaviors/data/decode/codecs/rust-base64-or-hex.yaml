defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  - id: rust-base64-or-hex-decode
    desc: Rust Base64 or hex decoding
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::rust-base64-engine-decode
      - id: micro-behaviors/data/decode/base64/unspecified::rust-base64-helper-decode
      - id: micro-behaviors/data/decode/repeated-base64::rust-repeated-standard-engine-decodes
      - id: micro-behaviors/data/decode/hex::rust-radix16-byte-decode
