defaults:
  crit: notable
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: b85decode-symbol
    desc: Python Base85 decode call
    conf: 0.9
    if:
      type: symbol
      exact: base64.b85decode
  - id: b85decode-dynamic
    desc: Dynamic Python Base85 decode import
    conf: 0.9
    if:
      type: symbol
      exact: __import__.b85decode
  # Imports aliased to a short name (import base64 as x) still leave the
  # module's method name on the call; the symbol keeps the receiver name.
  - id: b85decode-method-call
    desc: Python Base85 decode method call, any alias
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^[\w]+\.b85decode$'
  - id: b85decode-script
    desc: Python Base85 decode call in script
    conf: 0.92
    for: [python]
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::python-execution-template-generator
    if:
      type: symbol
      exact: base64.b85decode
