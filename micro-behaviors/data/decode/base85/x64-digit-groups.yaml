defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-base85-five-digit-accumulator
    desc: Base85 digit lookup and five-digit accumulator
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Inverse alphabet lookup; reject 0xff; accumulator*85 + digit;
      # complete a word after five input characters. Relocations and NOP
      # padding vary; no key, resource label or exact file size is required.
      pattern: '45 0F B6 14 04 41 80 FA FF 0F 84 [4] 41 B8 55 00 00 00 [0-80] 4C 89 C0 49 D1 E8 83 E0 01 48 F7 D8 48 21 D0 48 01 D2 49 01 C1 83 E9 01 75 ?? 83 C7 01 4B 8D 14 0A 83 FF 05'
