defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-z85decode-call
    desc: Python decodes Z85-encoded data
    if:
      type: symbol
      kind: call
      regex: '(^|\.)z85decode$'
  - id: ascii85-routine-name
    desc: ASCII85 codec routine naming
    if:
      type: text
      case_insensitive: true
      regex: 'ascii[\s_-]*85|base[\s_-]*85'
  - id: radix-85-arithmetic
    desc: Base-85 radix arithmetic
    if:
      type: text
      regex: '85\s*\*\*|divmod\([^()\n]{0,60},\s*85\s*\)'
composite_rules:
  # Both legs are required: the name alone also matches mere base85 stdlib
  # *usage*, and radix-85 math alone could be anything. Together they mark
  # a file that *implements* the ASCII85 codec (ReportLab pdfutils, pypdf
  # forks), whose ord() byte arithmetic is standard-codec work.
  - id: ascii85-codec-implementation
    desc: Implements ASCII85 base-85 codec
    crit: notable
    conf: 0.9
    all:
      - id: ascii85-routine-name
      - id: radix-85-arithmetic
