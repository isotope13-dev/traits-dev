defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.97
traits:
  # Regenerate a word-sized keystream every eight bytes, shift out the
  # current byte and XOR it into the same buffer. Keys and mixing constants
  # are deliberately not pinned to the reviewed build.
  - id: x64-word-mixer-inplace-xor-loop
    desc: Word-mixed keystream XORs a byte buffer
    if:
      type: hex
      section: .text
      pattern: >-
        48 83 E1 07 75 ?? [0-50] C1 E1 03 [0-12] (48|49) D3 E?
        (42|44|46) 30 ?? ?? (48|49) FF C? [0-8] 75 ??
