defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  mbc: "C0053"

traits:
  - id: js-table-nibble-decoder
    desc: Decodes paired lookup nibbles into bytes
    if:
      type: text
      regex: '2\s*\*\s*\w+\s*\]\s*\]\s*<<\s*4[\s\S]{0,60}1\s*\+\s*2\s*\*\s*\w+'
