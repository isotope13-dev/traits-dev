traits:
- for: &id001
  - vbs
  - html
  - scala
  id: vb-hex-prefix-plus-left-text-reference
  desc: Hex prefix plus Left source reference
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)["']&H["']\s*\+\s*(UCase\s*\()?\s*Left\s*\(
- for: *id001
  id: vb-chr-prefixed-hex-integer-text-reference
  desc: Chr conversion with hexadecimal prefix reference
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bChrW?\s*\(\s*(CLng|CInt|Val)\s*\(\s*["']&H["']\s*&\s*[A-Za-z_]
- for:
  - asp
  - vbs
  - html
  id: vb-chrb-hex-prefix-mid-text-reference
  desc: ChrB hex prefix with Mid reference
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?i)\bChrB\s*\(\s*"&H"\s*&\s*\(?Mid\s*\(
defaults:
  platforms:
  - windows
