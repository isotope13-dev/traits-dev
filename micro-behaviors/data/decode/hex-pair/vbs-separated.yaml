defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: vbs-left-pair-hex-prefix-append
    desc: Appends Left hex pair to prefix variable
    if:
      type: text
      regex: '(?i)\b\w+\s*=\s*\w+\s*\+\s*UCase\(Left\(\w+,2\)\)'
  - id: vbs-hex-prefix-assignment
    desc: Assigns VBScript hexadecimal numeric prefix
    if:
      type: text
      regex: '(?i)\b\w+\s*=\s*"&H"'
composite_rules:
  - id: vbs-separated-hex-pair-conversion
    desc: VBScript assembles hexadecimal byte pairs
    all:
      - id: vbs-left-pair-hex-prefix-append
      - id: vbs-hex-prefix-assignment
    near_bytes: 160
