defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
traits:
  - id: mips-hex-pair-byte-store-loop
    desc: MIPS nibble-pair byte assembly loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Shift the high nibble, merge low nibble, advance input two bytes,
      # and store the output byte in the branch delay slot. Require the nearby
      # ASCII 'a' through 'f' classification, not arbitrary nibble packing.
      pattern: '00 02 11 00 7C 03 1C 20 25 08 00 01 00 43 10 25 24 84 00 02 14 C8 ?? ?? A0 E2 00 00 [8] 24 E9 FF 9F 2D 29 00 06'
