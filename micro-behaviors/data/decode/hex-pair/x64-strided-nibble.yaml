# x64 Base16 decoder that de-interleaves a transposed character matrix via
# integer division + scaled row/column indexing before shift-6 nibble conversion.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  - id: x64-transposed-hex-pair-decoder
    desc: x64 matrix-transposed Base16 byte decoder
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '31 D2 F7 (F1|F3|F6|F7) 8D 04 (50|90|D0) 8D ?? 00 [6-24] C0 (E8|E9|EA|EB) 06 [2-14] 83 (E0|E1|E2|E3|E6|E7) 0F [2-14] C1 (E0|E1|E2|E3|E6|E7) 04'
