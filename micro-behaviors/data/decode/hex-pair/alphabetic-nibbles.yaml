defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
# Base16 with an a-p alphabet rather than 0-9/a-f. The instruction
# sequence binds alphabet subtraction, digit bounds, nibble merge and store.
traits:
  - id: x64-a-p-nibble-decoder
    desc: x64 alphabetic Base16 byte decoder
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '41 0F B6 01 44 8D 58 9F 41 80 FB 0F 77 ?? 83 FA FF 74 ?? C1 E2 04 41 09 D3 [0-16] 44 88 1F'
