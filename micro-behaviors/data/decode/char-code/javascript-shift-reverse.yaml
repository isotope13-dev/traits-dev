# A per-character code shift (a Caesar step written as
# `String.fromCharCode(c.charCodeAt(0) - N)`) chained with a split/reverse/join
# reversal. Either step alone is common string handling; the chain is a
# two-layer text decoder. It describes the decode, not what the text is for.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1140

traits:
  - id: js-charcode-shift-then-reverse
    desc: Shifts character codes then reverses text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fromCharCode\(\s*[\w$]{1,12}\.charCodeAt\(0\)\s*[-+]\s*\d{1,3}\s*\)\).{0,64}\.reverse\(\)'
  - id: js-reverse-then-charcode-shift
    desc: Reverses text then shifts character codes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.reverse\(\).{0,64}fromCharCode\(\s*[\w$]{1,12}\.charCodeAt\(0\)\s*[-+]\s*\d{1,3}\s*\)'
