defaults:
  platforms: [windows]
  for: [vbs, html]
  crit: notable

traits:
  # Chr maps a numeric code to a character; this does not require arithmetic.
  - id: vbs-hex-character-code
    desc: Chr call contains a hexadecimal character code
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bChr[W$]?\([^)]{0,80}(CLng\s*\(\s*)?&H[0-9A-F]+'
  # At least three ChrW calls, not character-set conversion of byte strings.
  - id: vbs-chrw-concat-chain
    desc: Concatenates three or more ChrW calls
    conf: 0.97
    if:
      type: text
      regex: '(?i)ChrW\s*\([^)]{1,40}\)(\s*&\s*ChrW\s*\([^)]{1,40}\)){2,8}'
