defaults:
  platforms:
  - windows
  for:
  - vbs
  - powershell
  - javascript
  crit: notable
traits:
- id: powershell-hex-integer-conversion-text
  desc: PowerShell text converts hexadecimal integers
  conf: 0.98
  if:
    type: text
    regex: (?i)\[(System\.)?Convert\]::ToInt(16|32)\([^;\r\n]{0,70},\s*16\)
- id: vbs-paired-array-char-offset
  desc: Builds characters from two indexed arrays
  conf: 0.98
  if:
    type: text
    regex: (?i)\bChrW?\(\s*\w+\(\w+\)\s*[+-]\s*\w+\(\w+\)\s*\)
  for:
  - vbs
