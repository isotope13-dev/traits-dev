defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  attack: T1140

traits:
  - id: js-stack-byte-to-character
    desc: Converts popped bytes to characters
    if:
      type: text
      regex: 'String\.fromCharCode\(\s*[\w$]+\.pop\(\)\s*&\s*255\s*\)'
      exclude_comments: true
