defaults:
  for:
  - vbs
  platforms:
  - windows
traits:
- id: vb-repeated-chr-concatenation
  desc: Repeated VB character-code concatenation
  crit: notable
  conf: 0.9
  count_min: 8
  per_kb_min: 0.5
  if:
    type: text
    regex: (?i)Chr[W$]?\s*\([^)\r\n]{1,40}\)\s*&\s*Chr[W$]?\s*\(
  not:
  - regex: (?i)^ChrW\s*\(\s*(?:&H0*[1-9A-F][0-9A-F]{2,}|0*(?:25[6-9]|2[6-9][0-9]|[3-9][0-9]{2}|[1-9][0-9]{3,}))\s*\)
  - regex: (?i)^Chr[W$]?\s*\(\s*(?:9|10|13|&H0*[9ADad])\s*\)
  - regex: (?i)^Chr\(\s*(?:1[3-9]\d|2\d\d)\)\s*&\s*Chr\(\s*$
  - regex: (?i)^Chr\(\s*(?:1[0-6]|[0-9])\)\s*&\s*Chr\(\s*$
