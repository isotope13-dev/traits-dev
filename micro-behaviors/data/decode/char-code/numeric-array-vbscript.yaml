# Decimal character codes preserve the source operation without claiming runtime success.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
traits:
  - id: vbscript-numeric-array-execute
    desc: Numeric-array VBScript decoder invokes its code
    if:
      type: text
      substr: 'Chr(Str(I)):Next:End%20Function%0D%0AExecute%20Num2Str(Str)'
