defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs, text]
traits:
  - id: vb-decimal-triplet-character
    desc: VB converts three-digit substrings to characters
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bChr[W$]?\s*\(\s*(CInt\s*\(\s*)?Mid\$?\([^\r\n]{1,40},\s*3\s*\)'
