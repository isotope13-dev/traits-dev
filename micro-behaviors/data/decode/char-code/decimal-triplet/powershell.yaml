defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1140
  mbc: C0053

traits:
  - id: powershell-decimal-triplet-loop
    desc: Loops through decimal characters in threes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bfor\s*\(\s*\$[A-Za-z_]\w*\s*=\s*0\s*;.{0,80}\+=\s*3\s*\)'
  - id: powershell-decimal-triplet-byte
    desc: Converts three-digit chunks to bytes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[byte\]\s*\(\s*\$[A-Za-z_]\w*\.Substring\s*\(.{0,30},\s*3\s*\)\s*\)'
  - id: powershell-ascii-getstring
    desc: Converts bytes to an ASCII string
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[System\.Text\.Encoding\]::ASCII\.GetString\s*\('

composite_rules:
  - id: powershell-decimal-triplet-ascii-decode
    desc: Decimal triplet ASCII decoder
    crit: notable
    conf: 0.96
    all:
      - id: powershell-decimal-triplet-loop
      - id: powershell-decimal-triplet-byte
      - id: powershell-ascii-getstring
    near_bytes: 512
