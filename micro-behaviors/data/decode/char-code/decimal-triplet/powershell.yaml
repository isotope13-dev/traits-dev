defaults:
  crit: notable
  platforms: [windows]
  for: [powershell, batch]
  attack: T1140
  mbc: C0053

traits:
  - id: powershell-decimal-triplet-byte
    desc: Converts three-digit chunks to bytes
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[byte\]\s*\(\s*\$[A-Za-z_]\w*\.Substring\s*\(.{0,30},\s*3\s*\)\s*\)'
composite_rules:
  - id: powershell-decimal-triplet-ascii-decode
    desc: Decimal triplet ASCII decoder
    conf: 0.96
    all:
      - id: micro-behaviors/data/control-flow/loop::powershell-decimal-triplet-loop
      - id: micro-behaviors/data/decode/char-code/decimal-triplet::powershell-decimal-triplet-byte
      - id: micro-behaviors/data/string/convert::powershell-ascii-getstring
    near_bytes: 512
