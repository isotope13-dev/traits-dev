defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
  - id: charcode-spread-array-decoder
    desc: Converts spread numeric codes to text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'String\.fromCharCode\(\.\.\.\s*\[[\d,\s]+\]'

  # Decimal character-code runs that spell protocol keywords. Forks hide
  # method names and identifiers from static scans by building them from
  # numeric arrays (`a.map(v => String.fromCharCode(v)).join('')`), so the
  # words below never appear as text. Each run is matched in full: the
  # numbers spell `newsletter`, `Follow`, and `Mute` respectively, and the
  # comma-separated form is the only spelling a JS array or argument list
  # accepts. Word meaning comes from the composites that reference these.
