# AutoHotkey rebuilding text from decimal character codes. The plain-script
# form splits a comma-delimited code list and accumulates Chr() of each code;
# compiled scripts embed the same source in the PE, so both scopes match.
defaults:
  platforms: [windows]
  for: [pe, text]
  crit: notable
  conf: 0.88

traits:
  - id: autohotkey-comma-code-split
    desc: Splits comma-delimited character-code list
    if:
      type: text
      regex: '(?i)StrSplit\s*\(\s*\w+\s*,\s*","\)'

  - id: autohotkey-chr-accumulation
    desc: Accumulates Chr of variable code points
    if:
      type: text
      regex: '\w+\s*\.=\s*Chr\s*\(\s*\w+\s*(\+\s*0\s*)?\)'

composite_rules:
  - id: autohotkey-charcode-decode-loop
    desc: Char-code list decoded through Chr accumulation
    all:
      - id: autohotkey-comma-code-split
      - id: autohotkey-chr-accumulation
