# Character-code reconstruction is a decoder; it does not establish evasion.
# The loader objective separately requires evaluation of the reconstructed text.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, html, lnk, python, text]
traits:
  - id: powershell-variable-char-cast-join
    desc: Joins variable elements cast to chars
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)-join\s*\(\s*\$\w+\s*\|\s*(ForEach-Object|foreach|%)\s*\{\s*\[char\]\s*\(?\s*\$_'
