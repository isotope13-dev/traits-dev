# printf interprets these escape sequences as bytes; it does not encode input
# into hexadecimal text. Four consecutive escapes retain the original protocol
# and obfuscation consumers' evidence population and platform scope.
defaults:
  crit: notable
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: shell-printf-hex-byte-sequence
    desc: printf format starts with four hex escapes
    conf: 0.9
    if:
      type: text
      regex: 'printf\s+[''"]\\x[0-9a-fA-F]{2}(\\x[0-9a-fA-F]{2}){3,}'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
