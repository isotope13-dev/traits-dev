defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell]
  attack: T1140

traits:
  - id: shell-printf-hex-substitution-format
    desc: Shell printf decodes hexadecimal escapes
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '(\\x[0-9a-fA-F]{2}){2}'

  - id: shell-printf-hex-substitution-percent-b
    desc: Shell printf decodes hexadecimal escapes
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '(\\x[0-9a-fA-F]{2}){2}'

  - id: shell-printf-octal-substitution-format
    desc: Shell printf decodes octal escapes
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '(\\[0-7]{3}){2}'

  - id: shell-printf-octal-substitution-percent-b
    desc: Shell printf decodes octal escapes
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '(\\[0-7]{3}){2}'

  - id: shell-ansi-hex-fragment
    desc: Consecutive ANSI-C hexadecimal escapes
    conf: 0.92
    if:
      type: text
      regex: "\\$'[^']{0,60}(\\\\x[2-7][0-9a-fA-F]\\\\x[0-9a-fA-F]{2}|\\\\x[0-9a-fA-F]{2}\\\\x[2-7][0-9a-fA-F])"
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/development/cli/zshrs::zshrs-test-corpus-path

  - id: shell-ansi-octal-fragment
    desc: Consecutive ANSI-C octal escapes
    conf: 0.92
    if:
      type: text
      regex: "\\$'[^']{0,60}(\\\\[01][0-7]{2}\\\\[0-7]{3}|\\\\[0-7]{3}\\\\[01][0-7]{2})"
      not:
        - regex: "tr -d '\\\\[0-7]"
        - regex: '\[\$.*\$''\\[01]'
        - regex: "\\$'[^']{0,40}\\\\0[0-3][0-7]\\\\0[0-3][0-7]"

composite_rules:
  - id: shell-printf-hex-substitution
    desc: Shell printf decodes hexadecimal escapes
    conf: 0.97
    any:
      - id: shell-printf-hex-substitution-format
      - id: shell-printf-hex-substitution-percent-b
  - id: shell-printf-octal-substitution
    desc: Shell printf decodes octal escapes
    conf: 0.97
    any:
      - id: shell-printf-octal-substitution-format
      - id: shell-printf-octal-substitution-percent-b
  - id: shell-printf-escape-decoder
    desc: Shell printf decodes character escapes
    conf: 0.97
    any:
      - id: shell-printf-octal-substitution
      - id: shell-printf-hex-substitution
