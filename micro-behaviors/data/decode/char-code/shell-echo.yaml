# Require the escape-enabling option and escaped data on the same echo call.
# Literal diagnostic text, comments and echo without -e do not establish decoding.
defaults:
  platforms: [linux, macos]
  for: [shell]
  crit: notable
  conf: 0.97

traits:
  - id: shell-echo-character-escapes
    desc: Echo -e receives character escapes
    if:
      type: symbol
      kind: call
      regex: '^(/usr/bin/|/bin/)?echo$'
      args:
        - index: 0
          kind: identifier
          name: '-e'
        - index: 1
          kind: string
          regex: '(\\(x[0-9a-fA-F]{2}|0[0-7]{1,3})){2}'
