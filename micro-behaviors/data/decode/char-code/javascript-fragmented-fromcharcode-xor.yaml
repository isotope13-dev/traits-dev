defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - svg
    - html
traits:
  - id: js-bracket-fromc-harcode-xor
    desc: Bracketed fromCharCode XOR decode call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: String\["fromC"\+"harCode"\]\([^)]{0,220}\^
  - id: js-bracket-from-charcode-xor
    desc: Bracketed fromCharCode XOR decode call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: String\["from"\+"CharCode"\]\([^)]{0,220}\^
  - id: js-bracket-fr-omcharcode-xor
    desc: Bracketed fromCharCode XOR decode call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: String\["fr"\+"omCharCode"\]\([^)]{0,220}\^
composite_rules:
  - id: js-bracket-fromcharcode-xor-decode
    desc: Bracketed fromCharCode XOR string decoder
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/data/decode/char-code::js-bracket-fromc-harcode-xor
      - id: micro-behaviors/data/decode/char-code::js-bracket-from-charcode-xor
      - id: micro-behaviors/data/decode/char-code::js-bracket-fr-omcharcode-xor
