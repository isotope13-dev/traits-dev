defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
  - id: fromcharcode-map-array
    desc: Maps character codes to characters
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'map\(function\([^)]{1,20}\)\s*\{\s*return String\.fromCharCode'
  - id: fromcharcode-map-numeric-offset
    desc: fromCharCode map with numeric offset
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'map\(function\([^)]{1,20}\)\s*\{\s*return String\.fromCharCode\(\w+\s*\+\s*\d{1,3}\)'

  - id: fromcharcode-arrow-map
    desc: Arrow-maps codes to characters
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.map\s*\(\s*\(?\s*[A-Za-z_$][\w$]*\s*\)?\s*=>\s*String\.fromCharCode\s*\('

  - id: fromcharcode-indexed-array
    desc: Converts an indexed code to a character
    crit: notable
    conf: 0.9
    # Keep the existing exclusion for large minified bundles.
    for: [javascript, typescript, svg]
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
    if:
      type: text
      regex: 'String\.fromCharCode\(\w+\[\w+\]\)'

  - id: fromcharcode-apply-array
    desc: Converts character-code array to string
    crit: notable
    conf: 0.92
    for: [javascript, typescript, svg]
    if:
      type: text
      # Custom alphabet decoders commonly pass String (or null) as the apply
      # receiver before rebuilding the decoded bytes into a string.
      regex: 'String\.fromCharCode\s*\.\s*apply\s*\(\s*(null|String)\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'

