# A single fromCharCode call with two dozen or more numeric codes is not
# building one word: it defines a substitution alphabet that later code
# spends one slot at a time (`$[17]`). Ordinary string building stays well
# below the count. Feeds carry such scripts inside post markup, so xml is in
# scope alongside html and JavaScript.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, xml]

traits:
  - id: fromcharcode-alphabet-table
    desc: fromCharCode builds a 25+ char alphabet
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'String\.fromCharCode\((\s*\d{1,3}\s*,){24,}\s*\d{1,3}\s*\)'
