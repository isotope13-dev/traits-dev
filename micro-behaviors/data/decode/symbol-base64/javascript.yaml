# Base64 Decoding — JavaScript/TypeScript
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: buffer-from-base64
    desc: Base64 decoding via Buffer.from (JS)
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        kind: string
        exact: base64
  # A Base64 *literal* decoded straight to text: the string the code uses is
  # kept out of the source. Moved from the npm dynamic-install objectives,
  # where it was named for one use (a module name) of a matcher that decodes
  # anything -- URLs, commands, package names.
  - id: buffer-from-base64-literal-to-text
    desc: Decodes a Base64 string literal to text
    conf: 0.9
    if:
      type: text
      regex: 'Buffer\.from\(\s*["''][A-Za-z0-9+/=]{6,}["'']\s*,\s*["'']base64["'']\)\.toString'
  - id: atob-decode
    desc: Decodes Base64 data with JavaScript atob()
    conf: 0.9
    if:
      type: symbol
      exact: atob
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
