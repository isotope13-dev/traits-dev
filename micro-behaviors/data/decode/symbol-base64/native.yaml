# Conventional native Base64 decoder call names. The operation is neutral on
# its own; objective composites supply any payload or C2 context.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust]
  crit: notable
  attack: T1140

traits:
  - id: native-base64-decode-call
    desc: Calls a native Base64 decoder
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(base64_|b64_?)(decode|decoded)$'
