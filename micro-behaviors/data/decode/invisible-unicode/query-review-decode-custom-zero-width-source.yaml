defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
  crit: notable
  conf: 0.9

composite_rules:
  - id: zero-width-radix-four-decoder
    desc: Source decodes radix-four zero-width symbols
    for: [scripts, source]
    all:
      - id: metadata/file/invisible-unicode::zero-width-only-string
      - id: micro-behaviors/data/bitwise::radix-four-left-shift

  - id: embedded-zero-width-radix-four-decoder
    desc: Source decodes zero-width data embedded in visible text
    for: [python, javascript, rust, go, elixir]
    all:
      - id: metadata/file/invisible-unicode::multiple
      - id: micro-behaviors/data/string/unicode::zero-width-format-codepoint-set
      - id: micro-behaviors/data/bitwise::radix-four-left-shift

  - id: c-escaped-zero-width-radix-four-decoder
    desc: C source decodes octal-escaped zero-width data
    for: [c, cpp]
    all:
      - id: micro-behaviors/data/encode/char-code::c-octal-escape-sequence
      - id: metadata/file/invisible-unicode::zero-width-utf8-byte-alphabet
      - id: micro-behaviors/data/bitwise::radix-four-left-shift

  - id: elixir-zero-width-radix-four-decoder
    desc: Elixir source decodes radix-four zero-width symbols
    for: [elixir]
    all:
      - id: metadata/file/invisible-unicode::zero-width-only-string
      - id: micro-behaviors/data/arithmetic::elixir-weighted-symbol-index
      - id: micro-behaviors/data/string/conversion::elixir-list-to-binary

  - id: jvm-zero-width-radix-four-decoder
    desc: JVM bytecode decodes radix-four zero-width symbols
    for: [class, java_class]
    all:
      - id: metadata/file/invisible-unicode::jvm-zero-width-only-string
      - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref

  - id: zero-width-command-data-decoder
    desc: Decodes command-sized data from zero-width symbols
    any:
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-radix-four-decoder
      - id: micro-behaviors/data/decode/invisible-unicode::embedded-zero-width-radix-four-decoder
      - id: micro-behaviors/data/decode/invisible-unicode::c-escaped-zero-width-radix-four-decoder
      - id: micro-behaviors/data/decode/invisible-unicode::elixir-zero-width-radix-four-decoder
      - id: micro-behaviors/data/decode/invisible-unicode::jvm-zero-width-radix-four-decoder

  - id: js-zero-width-bitstream-decoder
    desc: JavaScript decodes zero-width characters as binary digits
    for: [javascript, typescript]
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/invisible-unicode::js-u200b-string
      - id: metadata/file/invisible-unicode::js-u200c-string
      - id: micro-behaviors/data/parse/number::js-parseint-radix-two
    # Large generated bundles commonly contain zero-width identifier/space
    # handling and unrelated binary parsing; require them to form one local
    # decode path before assigning this behavior.
    near_bytes: 4096
