defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala, html, javascript, python, vbs]

composite_rules:
  - id: java-request-base64-source
    desc: Servlet Base64-decodes a request value
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
    any:
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: micro-behaviors/communications/http/header/custom::servlet-get-header-call
    needs: 1

  - id: java-request-reflective-base64-source
    desc: Servlet reflectively resolves Base64 decoder
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64-reflection::java-reflective-base64-decoder
    any:
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: micro-behaviors/communications/http/header/custom::servlet-get-header-call
    needs: 1
