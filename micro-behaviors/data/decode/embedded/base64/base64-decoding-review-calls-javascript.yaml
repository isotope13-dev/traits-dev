defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: buffer-from-base64-literal-to-text
    desc: Decodes a Base64 string literal to text
    conf: 0.9
    if:
      type: text
      regex: Buffer\.from\(\s*["'][A-Za-z0-9+/=]{6,}["']\s*,\s*["']base64["']\)\.toString
