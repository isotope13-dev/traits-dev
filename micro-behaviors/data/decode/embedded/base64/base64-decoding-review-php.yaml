defaults:
  platforms: [unix, windows]
  for: [php, html, text]
  mbc: C0053
traits:
  - id: php-large-literal-base64-decode
    desc: PHP decodes a large Base64 literal
    crit: notable
    conf: 0.95
    # Bare-PHP injections carry no opening tag and are typed Text; the same
    # decode call is still PHP semantics there. Text search also reaches
    # decoded string layers.
    if:
      type: text
      regex: 'base64_decode\s*\(\s*["''][A-Za-z0-9+/=]{500,}'
  # A carrier-scale Base64 literal stored for later decoding, whether or not
  # the decode call appears beside it. The scale floor keeps hashes and short
  # encoded configuration values out.
  - id: php-embedded-base64-literal
    desc: Large embedded Base64 literal (PHP source)
    crit: notable
    conf: 0.9
    for: [php, text, data]
    if:
      type: text
      regex: '[''"][A-Za-z0-9+/=]{300,}[''"]'
