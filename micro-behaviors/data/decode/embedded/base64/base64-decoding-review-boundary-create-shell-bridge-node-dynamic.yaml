defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-atob-base64-decoded-command-blobs
    desc: Decodes multiple Base64 string literals
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: 'atob_?\s*\(\s*["''][A-Za-z0-9+/]{4,}={0,2}["'']\s*\)'
