defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: buffer-from-hex-dup
    desc: Hex decoding/usage via Buffer.from
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: Buffer\.from\(.{0,60}['"]hex['"]\)
  - id: buffer-from-hex-call
    desc: Buffer.from hex decoding
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        index: 1
        kind: string
        exact: hex
  - id: buffer-from-hex-to-utf8
    desc: Buffer hex decode to UTF-8
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "from\\(.{0,40}['\"]hex['\"].{0,20}\\)\\.toString\\("
  - id: multiple-node-hex-decodes
    desc: Multiple Node.js hex decodes
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'Buffer\.from\([^,]{1,50},\s*["'']hex["'']\)'
    count_min: 2
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/lang/scripted::dts-declaration-file
  - id: js-hex-charcode-decoder
    desc: JavaScript hex escape decoder
    crit: notable
    conf: 0.9
    # `data`, `text`, `mp3`, and `scala` are here because loaders are delivered
    # under whatever name and content-type the author likes: abuse.ch HTA-in-MP3
    # waves, and vxheaven `.sc` HTML clickers that filefacts types as Scala.
    for: [javascript, typescript, html, data, text, media, scala, elixir, mp3]
    if:
      type: text
      regex: 'String\.fromCharCode\s*\(\s*parseInt\s*\([^)]{0,120},\s*16\s*\)'
  - id: js-parseint-radix-16
    desc: JavaScript parseInt with radix 16
    crit: notable
    conf: 0.85
    for: [javascript, typescript, html, data, text, media, scala, elixir]
    if:
      type: text
      regex: '\bparseInt\s*\([^,)]{1,80},\s*16\s*\)'
  - id: hex-encoded-iframe-tag
    desc: Hex-encoded HTML iframe tag
    crit: notable
    conf: 0.93
    for: [javascript, typescript, html, data, text, media, scala, elixir]
    if:
      type: text
      regex: '(?i)3c696672616d65'
  - id: hex-encoded-script-tag
    desc: Hex-encoded HTML script tag
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, data, text, media, scala, elixir]
    if:
      type: text
      regex: '(?i)3c(53|73)(43|63)(52|72)(49|69)(50|70)(54|74)3e'
  - id: hex-encoded-display-none
    desc: Hex-encoded CSS display none
    crit: notable
    conf: 0.88
    for: [javascript, typescript, html, data, text, media, scala, elixir]
    if:
      type: text
      regex: '(?i)646973706c61793a206e6f6e65'
  - id: js-hex-number-parse
    desc: JavaScript hex-to-integer conversion
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: parseInt
      arg:
        kind: number
        value: 16
  - id: hex-pair-regex-byte-parser
    desc: Parses regex-selected hex pairs as bytes
    crit: notable
    conf: 0.85
    if:
      type: text
      # The capture-and-skip spellings count too: `/(..)./g` takes two hex
      # digits and throws the separator away, which the bare `/../` form did
      # not cover and which is what the HTA loaders in the abuse.ch 2025 wave
      # actually write.
      regex: 'replace\(\/\(?\.\.\)?\.?\/[gimuy]*\s*,.{0,240}parseInt\s*\([^,]{0,80},\s*16\s*\)'
