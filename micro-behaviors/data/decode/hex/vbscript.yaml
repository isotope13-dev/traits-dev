defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1140

traits:
  # The article's Ramnit example converts each two-character hex pair into
  # a byte with Chr(CLng("&H" & Mid(...))). CInt/Val and MidB are equivalent
  # VBScript spellings used by later variants.
  #
  # The tail was `MidB?\s*\(`, which only covered walking the string with
  # Mid(). Splitting the hex on whitespace and indexing the array —
  # `Chr(CInt("&h" & hexarr(i)))` — is just as common and matched nothing,
  # so an embedded binary rebuilt that way decoded invisibly. Any identifier
  # after the `"&H" &` concatenation is the same conversion; the literal is
  # what makes it hex-to-byte, not how the pair was fetched.
  - id: vbscript-hex-pair-byte-conversion
    desc: VBScript converts hex pairs to bytes
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bChrW?\s*\(\s*(CLng|CInt|Val)\s*\(\s*["'']&H["'']\s*&\s*[A-Za-z_]'
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::office-repatches-benign-context
      - id: well-known/tool/sysadmin/microsoft-office::office-mui-patch-repair-benign-context
