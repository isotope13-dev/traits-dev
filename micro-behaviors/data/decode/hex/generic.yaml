defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: hex-to-bytes-helper
    desc: Hex-to-bytes native helper
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, macho, pe]
    platforms: [windows, linux, macos]
    if:
      type: symbol
      exact: hex_to_bytes
  - id: buffer-from-hex-string
    desc: Node.js Buffer.from decodes a hexadecimal string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: Buffer\.from\(.{1,80},\s*['"]hex['"]\)
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/v8::isolate-symbol
