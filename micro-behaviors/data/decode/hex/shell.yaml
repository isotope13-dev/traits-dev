defaults:
  platforms: [unix, windows]
  for: [shell, applescript]
  crit: notable
  conf: 0.8

traits:
  - id: xxd-hex-decode
    desc: Shell hex decoding via xxd
    mbc: C0053
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: xxd
      args:
        - index: 0
          kind: identifier
          name: -r
        - index: 1
          kind: identifier
          name: -p
  # AppleScript has no call projection for commands inside do shell script.
  # Retain its text observation without claiming a shell call was parsed.
  - id: applescript-xxd-hex-command-text
    desc: xxd reverse plain-hex command text
    for: [applescript]
    if:
      type: text
      regex: '\bxxd\s+-r\s+-p\b'
