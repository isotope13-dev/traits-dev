defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1027

traits:
  - id: java-long-hex-constant-table
    desc: Java class embeds many long hexadecimal strings
    # Long constants can be hashes, keys, or serialized data.  The trait is
    # evidence for an obfuscation composite, not an objective by itself.
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '[0-9A-Fa-f]{80,}'
    count_min: 8

  - id: java-parse-int-radix-overload
    desc: Java references parseInt with explicit radix
    crit: component
    conf: 0.9
    if:
      type: raw
      regex: 'parseInt.{0,80}\(Ljava/lang/String;I\)I'

  - id: java-radix-16-static-call
    desc: Java pushes radix 16 before static call
    crit: component
    conf: 0.88
    if:
      type: hex
      pattern: '10 10 B8 ?? ??'

  - id: java-hex-pair-parser-substring
    desc: Java slices strings for hexadecimal pair parsing
    crit: component
    conf: 0.88
    if:
      type: symbol
      exact: java/lang/String.substring

  - id: java-hex-pair-parser-builder
    desc: Java appends decoded hex values
    crit: component
    conf: 0.88
    if:
      type: symbol
      exact: java/lang/StringBuilder.append

  - id: java-hex-pair-parser-utf8
    desc: Java converts decoded hex bytes as UTF-8
    crit: component
    conf: 0.88
    if:
      type: symbol
      exact: java/nio/charset/StandardCharsets.UTF_8

  # An Ethereum `eth_call` returning a dynamic type answers with a hex string
  # whose first 32-byte word is the data offset and whose second word (hex
  # characters 64..128) is the byte length.  Hand-rolled ABI readers therefore
  # emit exactly `substring(64, 128)` followed by `parseInt(_, 16)`:
  #   bipush 64 ; sipush 128 ; invokevirtual String.substring(II) ;
  #   bipush 16 ; invokestatic Integer.parseInt(String,I)
  # web3j and the other real JVM Ethereum clients decode through TypeDecoder /
  # BigInteger instead, so this literal offset pair is a decoder written to
  # avoid pulling in a web3 dependency.
  - id: java-abi-hex-length-word-parse
    desc: Java parses ABI hex length word
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: '10 40 11 00 80 B6 ?? ?? 10 10 B8 ?? ??'

composite_rules:
  - id: java-hex-pair-parser
    desc: Java parses hexadecimal string pairs
    crit: notable
    conf: 0.94
    all:
      - id: java-parse-int-radix-overload
      - id: java-radix-16-static-call

  - id: java-hex-pair-decoder
    desc: Java decodes hexadecimal text into values
    crit: notable
    conf: 0.94
    all:
      - id: java-hex-pair-parser
      - id: java-hex-pair-parser-substring
    any:
      - id: java-hex-pair-parser-builder
      - id: java-hex-pair-parser-utf8
