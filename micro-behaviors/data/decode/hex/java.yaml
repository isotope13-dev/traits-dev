defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1027

traits:
  - id: java-long-hex-constant-table
    desc: Java class embeds many long hexadecimal strings
    crit: suspicious
    conf: 0.92
    if:
      type: raw
      regex: '[0-9A-Fa-f]{80,}'
    count_min: 8

  - id: java-parse-int-radix-overload
    desc: Java references parseInt with explicit radix
    crit: component
    conf: 0.9
    if:
      type: raw
      regex: 'parseInt.{0,80}\(Ljava/lang/String;I\)I'

  - id: java-radix-16-static-call
    desc: Java pushes radix 16 before static call
    crit: component
    conf: 0.88
    if:
      type: hex
      pattern: '10 10 B8 ?? ??'

  - id: java-hex-pair-parser-substring
    desc: Java slices strings for hexadecimal pair parsing
    crit: component
    conf: 0.88
    if:
      type: symbol
      exact: java/lang/String.substring

  - id: java-hex-pair-parser-builder
    desc: Java appends decoded hex values
    crit: component
    conf: 0.88
    if:
      type: symbol
      exact: java/lang/StringBuilder.append

  - id: java-hex-pair-parser-utf8
    desc: Java converts decoded hex bytes as UTF-8
    crit: component
    conf: 0.88
    if:
      type: symbol
      exact: java/nio/charset/StandardCharsets.UTF_8

composite_rules:
  - id: java-hex-pair-parser
    desc: Java parses hexadecimal string pairs
    crit: notable
    conf: 0.94
    all:
      - id: java-parse-int-radix-overload
      - id: java-radix-16-static-call

  - id: java-hex-pair-decoder
    desc: Java decodes hexadecimal text into values
    crit: notable
    conf: 0.94
    all:
      - id: java-hex-pair-parser
      - id: java-hex-pair-parser-substring
    any:
      - id: java-hex-pair-parser-builder
      - id: java-hex-pair-parser-utf8
