defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: chr-hexdec-call
    desc: Converts hex values with PHP chr(hexdec())
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: chr\s*\(\s*hexdec\s*\(
    unless:
      - id: well-known/lib/runtime/scripted/php-libraries::htmlpurifier-library
      - id: well-known/lib/runtime/scripted/php-libraries::pel-exif-library

  - id: php-pack-hex-decode
    desc: Decodes hexadecimal with PHP pack
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: pack
      arg:
        index: 0
        kind: string
        exact: H*
