defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  - id: busybox-echo-hex-escape-staging
    desc: BusyBox echo with nearby hex-escaped argument
    conf: 0.9
    if:
      type: raw
      section: .rodata
      # Native command builders store the echo prefix and escaped arguments
      # separately. Require both; -ne alone does not establish hex decoding.
      regex: 'busybox echo -ne[\x00-\x7f]{0,990}"\\x[0-9A-Fa-f]{2}'
