defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
  - id: dotnet-hexstring-conversion
    desc: .NET converts hexadecimal text to bytes
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bConvert\s*\.\s*(FromHexString\s*\(|ToByte\s*\([^;\n]{1,80},\s*16\s*\))'
composite_rules:
  - id: dotnet-stringbuilder-hex-decoding-references
    for: [pe, dll]
    desc: .NET string-building and hex-decoding API references
    crit: component
    conf: 0.88
    all:
      - id: micro-behaviors/data/string/concat/append::dotnet-stringbuilder-append
      - id: micro-behaviors/data/decode/hex::dotnet-hexstring-conversion
  # The IL layout pairs a length-2 slice with a radix-16 byte conversion at
  # adjacent call sites, while the resolved calls name Substring and
  # Convert.ToByte/ToInt32. Together they establish a manual hex-pair decode
  # loop in compiled .NET code, rather than mere co-occurrence of two common
  # string APIs in a large assembly.
  - id: cil-substring-radix16-byte-decode
    for: [pe, dll]
    desc: CIL Substring pair radix-16 byte decode
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/instruction/cil::cil-len2-radix16-call-pair
      - id: micro-behaviors/data/string/access::dotnet-string-substring-call
      - id: micro-behaviors/data/string/conversion::cil-convert-tobyte-or-int32-call
