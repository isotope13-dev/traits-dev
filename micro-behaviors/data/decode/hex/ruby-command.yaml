# A single Kernel.system string is interpreted as a command; multiple argv
# arguments and unrelated receivers named system do not establish this behavior.
defaults:
  platforms: [unix]
  for: [ruby]
  crit: notable
  conf: 0.96
traits:
  - id: ruby-system-xxd-hex-decode
    desc: Ruby system command invokes xxd hex decoder
    if:
      type: tree-sitter
      query: |
        ((call !receiver method: (identifier) @method
          arguments: (argument_list . (string . (string_content) @command .) .)) @call
          (#eq? @method "system")
          (#match? @command "^(echo[ \\t]+['\"]?[0-9a-fA-F]+['\"]?[ \\t]*\\|[ \\t]*)?(/usr/bin/)?xxd[ \\t]+-r[ \\t]+-p([ \\t]|$)"))
        ((call receiver: (constant) @receiver method: (identifier) @method
          arguments: (argument_list . (string . (string_content) @command .) .)) @call
          (#eq? @receiver "Kernel") (#eq? @method "system")
          (#match? @command "^(echo[ \\t]+['\"]?[0-9a-fA-F]+['\"]?[ \\t]*\\|[ \\t]*)?(/usr/bin/)?xxd[ \\t]+-r[ \\t]+-p([ \\t]|$)"))
