# PowerShell hosts the .NET BCL, so hex decoding is spelled through
# [Convert]. The sibling dotnet.yaml trait is scoped to csharp/pe/dll and
# leans on a bare `HexString` name match, which would fire on any script that
# merely has a $hexString variable; these match the actual conversion call.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1140
  mbc: C0043
  crit: notable

traits:
  - id: powershell-convert-fromhexstring
    desc: PowerShell Convert.FromHexString call
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[convert\]::fromhexstring\s*\('

  # ToByte with an explicit radix 16 argument: a hex-pair parser, as opposed
  # to the plain numeric [Convert]::ToByte($n) cast.
  - id: powershell-convert-tobyte-radix16
    desc: PowerShell hex-pair byte conversion
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[convert\]::tobyte\s*\(.{1,80}?,\s*16\s*\)'

  - id: embedded-powershell-convert-tobyte-radix16
    desc: Embedded PowerShell hex byte conversion
    conf: 0.94
    for: [batch, javascript, typescript, vbs, html, xml]
    if:
      type: text
      regex: '(?i)\[convert\]::tobyte\s*\(.{1,80}?,\s*16\s*\)'

  - id: embedded-powershell-format-string-hex-byte
    desc: Format-string obfuscated hex byte conversion
    conf: 0.95
    for: [batch, javascript, typescript, vbs, html, powershell]
    if:
      type: text
      regex: '(?i)To\s*\{\s*0\s*\}\s*[''"]\s*-\s*f\s*[''"]\s*Byte.{0,48}?,\s*16'

  - id: encoded-powershell-convert-tobyte-radix16
    desc: Base64 PowerShell hex-pair byte conversion
    conf: 0.96
    for: [powershell, javascript, vbs, html, batch, lnk]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\[convert\]::tobyte\s*\(.{1,80}?,\s*16\s*\)'

  # Shortcut arguments carry the whole PowerShell command line in a value
  # field rather than extracted text, so the hex-pair parser needs its own atom.
  - id: lnk-convert-tobyte-radix16
    desc: LNK arguments parse hex pairs to bytes
    conf: 0.94
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\[convert\]::tobyte\s*\(.{1,80}?,\s*16\s*\)'

  - id: powershell-convert-toint32-radix16
    desc: PowerShell parses a hexadecimal integer
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[convert\]::toint32\s*\(.{1,80}?,\s*16\s*\)'

  # PowerShell also parses hex by casting a prefixed two-character slice.
  # Require the cast, prefix and slice together; plain hex data is not a decoder.
  - id: powershell-int-cast-hex-pair
    desc: PowerShell casts hexadecimal pair to integer
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\[int\]\s*\(\s*[''"]0x[''"]\s*\+\s*\$\w+\.Substring\(\s*\$\w+\s*,\s*2\s*\)\)'

composite_rules:
  - id: powershell-hex-integer-conversion
    desc: PowerShell converts hex text to integer
    conf: 0.95
    any:
      - id: powershell-convert-tobyte-radix16
      - id: powershell-convert-toint32-radix16
      - id: powershell-int-cast-hex-pair
