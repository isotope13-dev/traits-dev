# PowerShell hosts the .NET BCL, so hex decoding is spelled through
# [Convert]. The sibling dotnet.yaml trait is scoped to csharp/pe/dll and
# leans on a bare `HexString` name match, which would fire on any script that
# merely has a $hexString variable; these match the actual conversion call.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1140
  mbc: C0043
  crit: notable

traits:
  - id: powershell-convert-fromhexstring
    desc: PowerShell Convert.FromHexString call
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[convert\]::fromhexstring\s*\('

  # ToByte with an explicit radix 16 argument: a hex-pair parser, as opposed
  # to the plain numeric [Convert]::ToByte($n) cast.
  - id: powershell-convert-tobyte-radix16
    desc: PowerShell hex-pair byte conversion
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[convert\]::tobyte\s*\(.{1,80}?,\s*16\s*\)'
