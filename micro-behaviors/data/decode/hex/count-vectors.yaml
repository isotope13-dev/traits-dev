# Short binary vectors with huge big-endian count fields are useful decoded
# data observations; they establish no protocol or malicious intent by themselves.
# Each matcher binds the vector to a decoding call, excluding comments and
# unrelated strings. JavaScript additionally requires the hex encoding argument.
defaults:
  platforms: [unix, windows]
  for: [java, python, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: zero-tag-huge-count-vector-hex-decode
    desc: Decodes zero-tag huge-count hex vector
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(parseHex|fromhex|decodeHex)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^00[4-7][0-9a-f]{7}([0-9a-f]{2}){0,64}$'

  - id: zero-tag-huge-count-vector-buffer-decode
    desc: Buffer decodes zero-tag huge-count hex vector
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      args:
        - index: 0
          kind: string
          regex: '(?i)^00[4-7][0-9a-f]{7}([0-9a-f]{2}){0,64}$'
        - index: 1
          kind: string
          exact: hex

  - id: versioned-huge-count-vector-hex-decode
    desc: Decodes versioned huge-count hex vector
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(parseHex|fromhex|decodeHex)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^000000(0[12]|0[3-9ab]000000[0-9a-f]{2})[4-7][0-9a-f]{7}([0-9a-f]{2}){0,64}$'

  - id: versioned-huge-count-vector-buffer-decode
    desc: Buffer decodes versioned huge-count hex vector
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      args:
        - index: 0
          kind: string
          regex: '(?i)^000000(0[12]|0[3-9ab]000000[0-9a-f]{2})[4-7][0-9a-f]{7}([0-9a-f]{2}){0,64}$'
        - index: 1
          kind: string
          exact: hex

composite_rules:
  - id: zero-tag-huge-count-vector
    desc: Decodes zero-tag huge-count vector
    any:
      - id: zero-tag-huge-count-vector-hex-decode
      - id: zero-tag-huge-count-vector-buffer-decode

  - id: versioned-huge-count-vector
    desc: Decodes versioned huge-count vector
    any:
      - id: versioned-huge-count-vector-hex-decode
      - id: versioned-huge-count-vector-buffer-decode

