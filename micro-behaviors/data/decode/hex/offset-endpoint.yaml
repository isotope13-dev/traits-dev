defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: offset-eight-hex-character-slice
    desc: Slices eight characters at variable offset
    if:
      type: text
      regex: '(\[\s*["'']substring["'']\s*\]|\.substring)\(\s*\w+\s*,\s*\w+\s*\+\s*8\s*\)'
  - id: bracket-hex-octets-dot-join
    desc: Converts hex octets to dotted decimal
    if:
      type: text
      regex: 'parseInt\(\s*\w+\s*,\s*16\s*\);?\s*\}\)\s*\[["'']join["'']\]\(["'']\.["'']\)'
  - id: offset-hex-port-decode
    desc: Parses hex port after four address bytes
    if:
      type: text
      regex: 'parseInt\(\w+\[["'']substring["'']\]\(\w+\s*\+\s*8,\s*\w+\s*\+\s*12\),\s*16\)'
