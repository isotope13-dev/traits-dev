defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
traits:
- id: python-input-named-hex-decode
  desc: Python hex decoder consumes input-named value
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?is)\b(bytes?\.fromhex|bytearray\.fromhex|unhexlify)\s*\([^)]{0,180}\b(input|raw_data)\b
  for:
  - binaries
  - scripts
  - source
  - -mirc
  - -ircii
  - -clojure
- id: input-named-hex-decode
  desc: Hex decoder consumes input-named value
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?is)\bhex[.:]decode\s*\([^)]{0,180}\b(input|raw_data)\b
  for:
  - binaries
  - scripts
  - source
  - -mirc
  - -ircii
  - -clojure
- id: dotnet-input-named-hex-decode
  desc: .NET hex decoder consumes input-named value
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?is)\bConvert\.FromHexString\s*\([^)]{0,180}\b(input|raw_data)\b
  for:
  - binaries
  - scripts
  - source
  - -mirc
  - -ircii
  - -clojure
composite_rules:
- id: transaction-input-buffer-hex
  for:
  - javascript
  desc: Transaction-by-hash RPC near a Buffer hex decoder
  crit: notable
  conf: 0.92
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/blockchain/client::ethereum-transaction-by-hash-literal
  any:
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-computed-access
- id: transaction-input-hex
  desc: Input-named or transaction-context hex decoding
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/data/decode/hex::transaction-input-buffer-hex
  - id: micro-behaviors/data/decode/hex::python-input-named-hex-decode
  - id: micro-behaviors/data/decode/hex::input-named-hex-decode
  - id: micro-behaviors/data/decode/hex::dotnet-input-named-hex-decode
