defaults:
  platforms: [windows, unix]
  for: [lua]
  crit: notable
  conf: 0.95

traits:
  - id: lua-aliased-radix16-conversion
    desc: Lua calls aliased tonumber with radix 16
    if:
      type: tree-sitter
      query: |
        ((block
          (assignment_statement
            (variable_list . (identifier) @converter .)
            (expression_list . (bracket_index_expression
              field: (string content: (string_content) @api)) .))
          . (empty_statement)*
          . (assignment_statement
            (expression_list . (function_call name: (identifier) @called
              arguments: (arguments . (_) . [(number) @radix
                (parenthesized_expression (number) @radix)] .)) .)))
          (#eq? @api "tonumber")
          (#eq? @converter @called)
          (#eq? @radix "16"))
        ((block
          (assignment_statement
            (variable_list . (identifier) @radixvar .)
            (expression_list . [(number) @radix
              (parenthesized_expression (number) @radix)] .))
          . (assignment_statement
            (variable_list . (identifier) @between0 .) (expression_list (_)))
          . (assignment_statement
            (variable_list . (identifier) @selector .)
            (expression_list . (string content: (string_content) @api) .))
          . (assignment_statement
            (variable_list . (identifier) @between1 .) (expression_list (_)))
          . (assignment_statement
            (variable_list . (identifier) @converter .)
            (expression_list . (bracket_index_expression
              field: (identifier) @selected) .))
          . (assignment_statement
            (expression_list . (function_call name: (identifier) @called
              arguments: (arguments . (_) . (identifier) @radixarg .)) .)))
          (#eq? @radix "16")
          (#eq? @api "tonumber")
          (#eq? @selector @selected)
          (#eq? @converter @called)
          (#eq? @radixvar @radixarg)
          (#not-eq? @between0 @radixvar)
          (#not-eq? @selector @radixvar)
          (#not-eq? @between1 @radixvar)
          (#not-eq? @between1 @selector)
          (#not-eq? @converter @radixvar))
