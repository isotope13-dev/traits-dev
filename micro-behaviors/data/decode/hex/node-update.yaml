defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-update-with-hex-buffer
    desc: Calls update with a hex-decoded Buffer
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: "\\.update\\(\\s*Buffer\\.from\\([^)]{1,200}['\"]hex['\"]\\s*\\)\\s*\\)"

