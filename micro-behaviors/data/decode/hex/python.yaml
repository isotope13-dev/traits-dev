defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  - id: python-unhexlify
    desc: Python binascii.unhexlify hex decode
    conf: 0.7
    for: [python, pyc]
    if:
      type: symbol
      regex: '(^|\.)unhexlify$'
  - id: python-fromhex
    desc: Python bytes.fromhex decode
    conf: 0.8
    for: [python, pyc]
    if:
      type: symbol
      kind: call
      exact: bytes.fromhex
    # A neutral decoding fact remains true in tests and upstream projects.
  - id: hex-decode-int-16
    desc: "Hex decoding via int(x, 16)"
    conf: 0.7
    for: [python]
    if:
      type: symbol
      kind: call
      exact: int
      arg:
        kind: number
        value: 16
