defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  - id: python-unhexlify
    desc: Python binascii.unhexlify hex decode
    conf: 0.7
    for: [python, pyc]
    if:
      type: symbol
      regex: '(^|\.)unhexlify$'
  - id: python-unhexlify-text
    desc: String literal contains an unhexlify call
    conf: 0.85
    for: [python]
    if:
      type: string_literal
      regex: 'unhexlify\s*\('
  - id: python-fromhex
    desc: Python bytes.fromhex decode
    conf: 0.8
    for: [python, pyc]
    if:
      type: symbol
      kind: call
      exact: bytes.fromhex
    # A neutral decoding fact remains true in tests and upstream projects.
  - id: hex-decode-int-16
    desc: "Hex decoding via int(x, 16)"
    conf: 0.7
    for: [python]
    if:
      type: symbol
      kind: call
      exact: int
      arg:
        kind: number
        value: 16

  - id: python-hex-byte-generator-dot-join
    desc: Joins hex byte generator as dotted octets
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (attribute
            object: (string) @separator
            attribute: (identifier) @join)
          arguments: (generator_expression
            body: (call
              function: (identifier) @str
              arguments: (argument_list
                (call
                  function: (identifier) @int
                  arguments: (argument_list
                    (subscript) @slice
                    (integer) @base)))))
          (#match? @separator "^[\"']\\.[\"']$")
          (#eq? @join "join")
          (#eq? @str "str")
          (#eq? @int "int")
          (#eq? @base "16")
          (#match? @slice "\\[\\s*\\w+\\s*:\\s*\\w+\\s*\\+\\s*2\\s*\\]$"))
