# Portable source implementations of the same concealment chain: turn pairs
# of hexadecimal characters into bytes, then XOR each byte before using the
# result.  Decoder APIs differ by language, so the matcher names the operation
# rather than a campaign string or package name.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94
  attack: T1027

traits:
  - id: rust-radix16-byte-decode
    desc: Rust decodes radix-16 bytes
    for: [rust]
    if:
      type: text
      regex: 'from_str_radix.{0,80},\s*16'

  - id: native-sscanf-hex-byte-decode
    desc: Native source scans hexadecimal byte
    for: [c, cpp]
    if:
      type: text
      regex: 'sscanf.{0,80}%2x'

  - id: swift-radix16-byte-decode
    desc: Swift decodes radix-16 byte
    for: [swift]
    if:
      type: text
      regex: 'UInt8.{0,80}radix\s*:\s*16'

  - id: objc-scanner-hex-byte-decode
    desc: Objective-C scans hexadecimal byte
    for: [objc, objectivec]
    if:
      type: text
      regex: 'scanHexInt\s*:'

  - id: elixir-base16-xor-decode
    desc: Elixir XORs Base16-decoded bytes
    for: [elixir]
    if:
      type: text
      regex: 'Base[.]decode16.{0,240}Bitwise[.]bxor'

  - id: zig-radix16-byte-decode
    desc: Zig decodes radix-16 byte
    for: [zig]
    if:
      type: text
      regex: 'fmt[.]parseInt.{0,120},\s*16'

  - id: perl-packed-hex-byte-decode
    desc: Perl decodes packed hexadecimal bytes
    for: [perl]
    if:
      type: text
      regex: 'pack\s*\(\s*[''"]H[*][''"]'

  - id: php-hex-byte-decode
    desc: PHP decodes hexadecimal bytes
    for: [php]
    if:
      type: symbol
      kind: call
      exact: hex2bin

  # Python and similar compact decoders perform integer radix conversion
  # directly inside a byte constructor and do not name a hex-decoder API.
  - id: radix16-byte-xor-comprehension
    desc: Radix-16 byte conversion uses XOR
    if:
      type: text
      regex: 'int\s*\(.{0,80},\s*16\s*\)\s*\^\s*0x[0-9A-Fa-f]{1,2}'

  - id: lua-radix16-byte-xor
    desc: Lua radix-16 byte conversion is XOR-decoded
    for: [lua]
    if:
      type: text
      regex: 'tonumber\s*\(.{1,80},\s*16\s*\)\s*~\s*0x[0-9A-Fa-f]{1,2}'
