defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  # CLR member names are separate heap entries, so a dotted Uri call matcher
  # misses compiled assemblies. This names the decoder API reference without
  # claiming a particular call site, argument, or decoded payload.
  - id: dotnet-uri-unescape-data-string-reference
    desc: .NET URI percent-decoding API reference
    conf: 0.95
    if:
      type: text
      exact: UnescapeDataString
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
