# The letter w stands in for a percent sign, then unescape decodes the result.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: unescape-w-replaced-with-percent
    desc: Unescapes text after swapping in percent
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'unescape\(\w{1,16}\.replace\(/w/g,'
