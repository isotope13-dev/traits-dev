defaults:
  platforms: [unix, windows]
  for: [perl]

traits:
  # The hand-rolled CGI percent-decoder: s/%([0-9A-Fa-f]{2})/pack('C', hex($1))/eg
  - id: perl-percent-decode-substitution
    desc: Perl hex-pair percent-decode substitution
    crit: notable
    conf: 0.93
    attack: T1140
    if:
      type: text
      regex: '%\(\[A-Fa-f0-9\]\{2\}\)/pack\(.C.,\s*hex\(\$1\)\)'
