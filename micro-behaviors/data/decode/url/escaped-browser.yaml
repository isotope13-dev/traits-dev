defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: escaped-unescape-repeated-0c
    desc: Decoded unescape builds repeated 0c words
    if:
      type: encoded
      encoding: unicode-escape
      regex: 'unescape["'']?\s*\]?\s*\(\s*["'']%u0[Cc]0[Cc]%u0[Cc]0[Cc]'
