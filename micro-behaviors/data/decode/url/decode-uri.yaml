defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: javascript-decode-uri-call
    desc: Decodes percent escapes in a URI
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.|self\.)?decodeURI$'
  - id: javascript-decode-uri-component-call
    desc: Decodes percent escapes in a URI component
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.|self\.)?decodeURIComponent$'
