defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  # Proximity establishes co-occurrence, not that this string is the decoder's
  # input. Percent decoding alone does not establish hostile concealment.
  - id: unescape-near-w-hex-string
    desc: w-prefixed hex near percent-swap decoding
    crit: notable
    conf: 0.93
    near_bytes: 2500
    all:
      - id: metadata/file/encoding/hex::w-prefixed-hex-byte-string
      - id: micro-behaviors/data/decode/url::unescape-w-replaced-with-percent
