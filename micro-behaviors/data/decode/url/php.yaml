defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95
traits:
  - id: php-urldecode-call
    desc: PHP decodes percent-encoded form data
    if:
      type: symbol
      kind: call
      exact: urldecode
  - id: php-rawurldecode-call
    desc: PHP decodes percent-encoded URI data
    if:
      type: symbol
      kind: call
      exact: rawurldecode
  - id: php-rawurldecode-call-text
    desc: PHP decodes percent-encoded data in text
    for: [php, text]
    if:
      type: text
      regex: '(?i)\brawurldecode\s*\('
