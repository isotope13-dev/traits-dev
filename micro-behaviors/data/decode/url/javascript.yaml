# URL decoding operations in JavaScript
defaults:
  conf: 0.9
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: browser-escape-fallback-decoder
    desc: escape decodeURIComponent fallback decoder
    crit: baseline
    count_min: 2
    if:
      type: text
      regex: 'decodeURIComponent\s*\(\s*escape\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)\s*\)'
  # unescape() is the deprecated percent-decoder that predates
  # decodeURIComponent. It is a URL decode, not a bespoke one, so it belongs
  # here rather than under decode/custom/ where it used to sit; composites that
  # want "custom decoder" meaning pair it with the char-code masking atom.
  - id: js-unescape-call
    desc: Calls JavaScript unescape
    crit: notable
    for: [javascript, typescript, html, elixir, scala]
    attack: T1140
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.|self\.)?unescape$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: js-unicode-unescape-payload
    desc: JavaScript decodes Unicode percent escapes
    crit: notable
    conf: 0.93
    for: [scripts, typescript, html, text, makefile, elixir, scala, objectivec]
    attack: T1140
    if:
      type: text
      regex: 'unescape(\s*\(|["'']\s*\]\s*\()\s*(["'']{2}\s*\+\s*){0,6}["''“”]%u[0-9A-Fa-f]{4}'
    unless:
      - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
  # Exploit pages bind the decoder to another name (`var d = unescape;`)
  # and decode through it, so the direct-call atoms never see "unescape(".
  # The binding alone is matched here; it does not prove a later call.
  - id: js-unescape-alias-binding
    desc: Binds unescape to an alias variable
    crit: notable
    conf: 0.92
    for: [javascript, html]
    attack: T1140
    if:
      type: text
      regex: '(?m)[\w$]+\s*=\s*((window|self|globalThis)\.)?unescape\s*([;,]|$)'
      exclude_comments: true
  # A bare-identifier call whose first argument traces (through variables)
  # to a %u-escaped literal: the decode step of a percent-u payload, whatever
  # the decoder is named. Flow origin, not call-site text.
  - id: js-percent-u-literal-call-argument
    desc: Call argument traces to a %u literal
    crit: notable
    conf: 0.9
    attack: T1140
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][\w$]*$'
      arg:
        index: 0
        from:
          value: '%u[0-9A-Fa-f]{4}'
  - id: js-percent-byte-unescape
    desc: JavaScript decodes percent-encoded bytes
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, makefile, elixir, scala, ruby, python]
    attack: T1140
    if:
      type: text
      regex: 'unescape\s*\(\s*["'']%[0-9A-Fa-f]{2}%'
    unless:
      - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
  - id: js-unescape-eval-sequence
    desc: URL-decode call followed by eval
    crit: notable
    conf: 0.88
    for: [html, elixir, scala, javascript, typescript]
    attack: T1140
    if:
      type: text
      regex: '\bunescape\s*\([^)]{1,200}\)\s*;[\s\S]{0,120}?\beval\s*\('
    unless:
      - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
      - id: well-known/tool/development/webinspector/
  - id: js-shellcode-unescape-assignment
    desc: Assigns unescape to a shellcode-named variable
    crit: notable
    conf: 0.96
    attack: T1140
    for: [javascript, html, text, makefile, ruby, python]
    if:
      type: text
      regex: '(?i)(\w{0,8}shellcode\w{0,8}|payLoadCode)\s*=\s*unescape\s*\('

  - id: decode-uri-component-text-call
    desc: Calls decodeURIComponent in HTML script text
    crit: notable
    for: [html]
    if:
      type: text
      regex: '\bdecodeURIComponent\s*\('
      exclude_html_comments: true
  # A script tag smuggled percent-encoded, with each letter plain or %HH
  # in any mix (`%3C%53crip%54`). Link smuggling and stored injection
  # carry markup this way so static filters miss the tag. Neutral on its
  # own: security write-ups quote encoded tags too.
  - id: url-encoded-markup-tag
    desc: Percent-encoded markup tag text
    crit: notable
    conf: 0.9
    for: [html, javascript]
    attack: T1140
    if:
      type: text
      regex: '(?i)%3C(%53|S)(%63|C)(%72|R)(%69|I)(%70|P)(%54|T)'

  # HTML and non-JavaScript carriers do not expose embedded JS call facts.
  # Ruby and Python PoC generators carry the same invocation as string text;
  # the embedded-layer extraction misses it when the block opens with
  # comments, so the carrier text is matched directly.
  - id: js-unescape-carrier-call-text
    desc: Embedded JavaScript unescape invocation text
    crit: notable
    for: [html, elixir, scala, ruby, python]
    if:
      type: text
      regex: '\bunescape(\s*\(|["'']\s*\]\s*\()'
      exclude_html_comments: true

composite_rules:
  - id: js-unescape-invocation-evidence
    desc: Unescape call or embedded invocation syntax
    crit: notable
    for: [javascript, typescript, html, elixir, scala]
    any:
      - id: js-unescape-call
      - id: js-unescape-carrier-call-text

  # unescape is bound to another name and some call decodes a %u literal.
  # Same-file co-occurrence: the flow leg does not prove the called name is
  # the alias, only that a %u value reaches a call.
  - id: js-unescape-alias-percent-u-call
    desc: Unescape alias and %u-literal call argument
    crit: notable
    all:
      - id: js-unescape-alias-binding
      - id: js-percent-u-literal-call-argument
  # A Unicode %u literal passed straight to unescape, or unescape bound to
  # an alias beside a call that consumes a %u literal.
  - id: js-unicode-or-aliased-unescape
    desc: Direct Unicode or aliased unescape decoding
    crit: notable
    for: [scripts, typescript, html, text, makefile, elixir, scala, objectivec]
    any:
      - id: js-unicode-unescape-payload
      - id: js-unescape-alias-percent-u-call
