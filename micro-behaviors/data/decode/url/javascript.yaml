# URL decoding operations in JavaScript
defaults:
  conf: 0.9
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: browser-escape-fallback-decoder
    desc: escape decodeURIComponent fallback decoder
    crit: baseline
    count_min: 2
    if:
      type: text
      regex: 'decodeURIComponent\s*\(\s*escape\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)\s*\)'
  # unescape() is the deprecated percent-decoder that predates
  # decodeURIComponent. It is a URL decode, not a bespoke one, so it belongs
  # here rather than under decode/custom/ where it used to sit; composites that
  # want "custom decoder" meaning pair it with the char-code masking atom.
  - id: js-unescape-call
    desc: Calls JavaScript unescape
    crit: notable
    for: [javascript, typescript, html, elixir, scala]
    attack: T1140
    if:
      type: symbol
      kind: call
      exact: unescape
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: js-unicode-unescape-payload
    desc: JavaScript decodes Unicode percent escapes
    crit: notable
    conf: 0.93
    for: [javascript, typescript, html, text, makefile, elixir, scala, objectivec]
    attack: T1140
    if:
      type: text
      regex: 'unescape\s*\(\s*(["'']{2}\s*\+\s*){0,6}["'']%u[0-9A-Fa-f]{4}'
    unless:
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/path::bundled-cve-exploit-sample-context
  - id: js-percent-byte-unescape
    desc: JavaScript decodes percent-encoded bytes
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, makefile, elixir, scala]
    attack: T1140
    if:
      type: text
      regex: 'unescape\s*\(\s*["'']%[0-9A-Fa-f]{2}%'
    unless:
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/path::bundled-cve-exploit-sample-context
  - id: js-unescape-call-text
    desc: Calls JavaScript unescape in source text
    crit: notable
    for: [html, elixir, scala, javascript, typescript]
    attack: T1140
    if:
      type: text
      regex: '\bunescape\s*\('
  - id: js-shellcode-unescape-assignment
    desc: Assigns unescape to a shellcode-named variable
    crit: notable
    conf: 0.96
    attack: T1140
    for: [javascript, html, text, makefile]
    if:
      type: text
      regex: '(?i)(\w{0,8}shellcode\w{0,8}|payLoadCode)\s*=\s*unescape\s*\('

  - id: decode-uri-component-text-call
    desc: Calls decodeURIComponent in HTML script text
    crit: notable
    for: [html]
    if:
      type: text
      regex: '\bdecodeURIComponent\s*\('
      exclude_html_comments: true
