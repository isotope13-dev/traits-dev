# Aggregated Python encoded-data decoding capability.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
composite_rules:
  - id: python-decode-capability
    desc: Python encoded-data decoding capability
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decode/encoded/formats
      - id: micro-behaviors/data/decode/base58
      - id: micro-behaviors/data/decode/uu
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/compress/library::bz2-decompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads-symbol
