# Python decoding capabilities
# These are neutral data transformations. Intent comes from composites that
# pair decoding with dynamic execution, transport, or other attack context.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
traits:
  - id: python-base16-decode
    desc: Python base16 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.b16decode
    unless:
      - id: well-known/lib/core/psutil/
  - id: python-base32-decode
    desc: Python base32 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.b32decode
  - id: python-ascii85-decode
    desc: Python ASCII85 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.a85decode
  - id: python-urlsafe-base64-decode
    desc: Python URL-safe Base64 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.urlsafe_b64decode
  - id: python-standard-base64-decode
    desc: Python standard Base64 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.standard_b64decode
  - id: python-latin1-decode-call
    desc: Python latin-1 bytes decode call
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: '\.decode\s*\(\s*["'']latin-1["'']\s*\)'
