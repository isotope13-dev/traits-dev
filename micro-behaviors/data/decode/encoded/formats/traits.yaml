# Python decoding capabilities
# These are neutral data transformations. Intent comes from composites that
# pair decoding with dynamic execution, transport, or other attack context.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
traits:
  - id: python-base16-decode
    desc: Python base16 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.b16decode
    unless:
      - id: well-known/lib/core/psutil/
  - id: python-base32-decode
    desc: Python base32 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.b32decode
  - id: python-ascii85-decode
    desc: Python ASCII85 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.a85decode
  - id: python-urlsafe-base64-decode
    desc: Python URL-safe Base64 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.urlsafe_b64decode
  - id: python-standard-base64-decode
    desc: Python standard Base64 decoder call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: symbol
      exact: base64.standard_b64decode
  # Joining separately decoded values is a neutral aggregation operation. It
  # may rebuild split constants, but it also reassembles streamed media and
  # record batches; the anti-static objective supplies the encoded-literal
  # fragment list needed to infer concealment.
  - id: python-join-decoded-values
    desc: Python joins individually decoded values
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '\.join\([^)\r\n]{0,60}(b64decode|b16decode|b32decode|unhexlify)\([^()\r\n]{0,40}\)'
