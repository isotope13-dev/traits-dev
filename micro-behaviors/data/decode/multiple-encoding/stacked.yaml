# Decoders piped into one another, so the payload is wrapped more than once.
#
# Distinct from the repeated-decode traits elsewhere in this tree, which count
# decode calls: a program that decodes several independent fields through the
# same engine is ordinary, and those stay notable for that reason. Stacking is
# the different claim -- the *output* of one decoder is the *input* of the next,
# so the value only becomes readable after two or more passes. Nothing
# legitimate double-encodes a payload; the second wrapper exists to make the
# first one's output look like data rather than a command.
#
# It is also the durable half of the technique. XCSSET's git-hook propagation
# randomizes the C2 domain, the encoding scheme, and the nesting depth per
# infection, so neither the host nor the specific encodings hold still -- but
# the pipeline shape does.
defaults:
  platforms: [unix]
  # Named types rather than the `scripts`/`source` groups: `type: encoded`
  # caps at 11 file types, those groups expand to 26, and 9+ explicit types
  # must be spelled as groups -- so eight named types. These are the
  # languages a stacked-decoder payload actually ships in, plus the build
  # files that carry the git-hook propagation this rule was written for.
  for: [shell, python, javascript, typescript, ruby, makefile, dockerfile, github-actions]
  crit: suspicious
  conf: 0.93
  attack: T1140,T1027
  mbc: C0053

traits:
  # `base64 --decode | base64 --decode`, `xxd -r -p | base64 -d`, and the rest
  # of the family. Written against the two decoders and the pipe between them
  # rather than a fixed pair, so a mixed or reordered chain still matches.
  - id: stacked-decode-pipeline
    desc: Decoder piped into another decoder
    if:
      type: text
      regex: '(base64\s+-{1,2}[dD]\w*|xxd\s+-r)\s*\|\s*(base64\s+-{1,2}[dD]|xxd\s+-r)'

  # The same technique seen from the other side: not the pipeline that decodes
  # twice, but a payload that *was* decoded twice. `encoding: base64+base64`
  # matches the recovered chain, so it fires however the wrapping was spelled --
  # nested `base64 --decode`, a shell function called twice, a reconstructed
  # decoder name -- and needs no decode command in the file at all.
  #
  # Double-wrapping has no legitimate use. One encoding carries binary safely
  # through a text channel; a second carries nothing further and exists only so
  # the first layer reads as data rather than as a command.
  # `regex: '\S'` -- "the two-layer decode produced anything at all" -- was not
  # evidence of a payload, only of the decoder having guessed twice. Speculative
  # base64 chains recover bytes from any long alphanumeric run, so a generated
  # Unicode table matched: idna's uts46data.py is 230 KB of codepoint tuples.
  # Require the recovered bytes to look like the thing the wrapping exists to
  # hide -- a fetch or an interpreter -- which is the claim the description makes.
  - id: double-base64-payload
    desc: Payload wrapped in base64 twice
    if:
      type: encoded
      encoding: base64+base64
      regex: '(?i)https?://|/bin/s?h|curl |wget '

  # Mixed stacking, same reasoning: hex over base64 and base64 over hex are the
  # two orderings this loader family alternates between.
  - id: mixed-encoding-payload
    desc: Payload wrapped in two encodings
    if:
      type: encoded
      encoding: [hex+base64, base64+hex]
      regex: '(?i)https?://|/bin/s?h|curl |wget '
