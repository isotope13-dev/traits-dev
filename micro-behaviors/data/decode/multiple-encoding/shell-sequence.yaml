# The matcher observes two decoders in order, not multiple language grammars
# or a bound payload. Preserve its bounded sequence scope when relocating it.
defaults:
  platforms: [netscaler, appliance, unix]
  for: [shell]
  attack: T1140

traits:
  - id: xxd-base64-decode-sequence
    desc: Hex reverse precedes Base64 decoding
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'xxd -r -p[\s\S]{0,120}base64 -d'
    unless:
      # A rendered writeup stores the echo quote as an HTML entity.
      - type: text
        substr: '&#34;'

