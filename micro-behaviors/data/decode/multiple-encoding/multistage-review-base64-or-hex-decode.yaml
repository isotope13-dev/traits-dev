defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: base64-or-hex-decode
  desc: Base64 or hexadecimal decode
  crit: component
  conf: 0.86
  any:
  - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
  - id: micro-behaviors/data/decode/hex::python-fromhex
  - id: micro-behaviors/data/decode/hex::python-unhexlify
