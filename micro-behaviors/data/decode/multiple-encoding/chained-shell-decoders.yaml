# The same shell decoder piped into itself: each pass strips one layer of
# encoding from an inline blob. Real build and install scripts decode data
# once; stacking three hex reversals or two Base64 passes exists only to
# keep the final command out of the source.
defaults:
  platforms: [unix]
  for: [shell, pbxproj, scripts, text]
  crit: notable
  conf: 0.92
  attack: T1140

traits:
  - id: chained-xxd-reverse-decoders
    desc: Three or more chained xxd hex reversals
    if:
      type: text
      regex: 'xxd -(p -r|r -p)\s*\|\s*xxd -(p -r|r -p)\s*\|\s*xxd -(p -r|r -p)'

  - id: chained-base64-decoders
    desc: Two or more chained base64 decode passes
    if:
      type: text
      regex: 'base64 (--decode|-d|-D)\s*\|\s*base64 (--decode|-d|-D)'
