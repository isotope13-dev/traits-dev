defaults:
  platforms: [windows, unix]
  for: [wasm]
  crit: notable
  conf: 0.99

traits:
  - id: wasm-constant-xor-data-loops
    desc: WASM constant XOR data loops
    if:
      type: value
      path: wasm.xor_decode
      exists: true

  - id: wasm-bulk-xor-data-loops
    desc: WASM has 128+ XOR data loops
    if:
      type: metrics
      field: wasm.xor_decoded_range_count
      min: 128

  - id: wasm-xor-data-over-8k
    desc: WASM XOR data exceeds 8 KiB
    if:
      type: metrics
      field: wasm.xor_decoded_bytes
      min: 8192
