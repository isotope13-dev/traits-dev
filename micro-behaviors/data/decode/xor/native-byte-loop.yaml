defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  crit: notable
traits:
  - id: x86-cyclic-256-byte-key-loop
    desc: Byte decoder cycles through 256-byte XOR key
    conf: 0.99
    if:
      type: hex
      section: any
      # Input[edx] XOR key[edx & 255] -> output[edx], up to ecx.
      pattern: '0F B6 04 16 89 D3 81 E3 FF 00 00 00 32 83 [4] 88 04 17 42 39 CA 72'
