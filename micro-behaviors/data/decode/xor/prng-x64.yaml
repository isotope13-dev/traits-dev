defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-eight-byte-prng-xor-buffer-loop
    desc: Byte XOR loop with eight-byte PRNG refresh
    conf: 0.97
    if:
      type: hex
      section: .text
      # Refresh a multiplied/added state every eight bytes, mix it with
      # shifts and XOR, then select a key byte and transform the buffer.
      # Keys, mixer constants, relative branches and image addresses vary.
      pattern: '(4C 89 D1|49 8B CA) 48 83 E1 07 75 ?? 4C 0F AF C8 (49 01 D1|4C 03 CA) [0-32] C1 E1 03 (4C 89 DF|49 8B FB) 48 D3 EF 42 30 3C 16 49 FF C2 (4D 39 FA|4D 3B D7) 75 ??'
