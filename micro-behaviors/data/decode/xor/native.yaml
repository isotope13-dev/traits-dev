defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  # Bounded nonzero-key XOR followed by explicit NUL termination and a
  # returned buffer pointer. Unlike a generic XOR loop this reconstructs a
  # C string. Key, buffer length, and termination displacement may change.
- id: x86-bounded-xor-string-decoder
  desc: x86 bounded XOR string decoder
  conf: 0.98
  arch: [x86]
  platforms: [linux, windows]
  for: [elf, pe, dll]
  if:
    type: hex
    section: .text
    pattern: '33 C0 80 34 08 ~00 40 83 F8 ?? 72 F6 C6 41 ?? 00 8B C1 C3'

- id: x64-indexed-xor-string-decode-loop
  desc: x64 indexed XOR string decode loop
  conf: 0.94
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: '41 89 C0 41 83 E0 0F 45 8A 04 10 44 32 04 08 44 88 84 04 ?? ?? ?? ?? 48 FF C0 EB'
- id: x86-fixed-buffer-xor-loop
  desc: x86 bounded in-place byte XOR loop
  conf: 0.98
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: 33 C0 80 B0 ?? ?? ?? ?? ~00 40 3D ?? ?? ?? ?? 7C F1
- id: x86-index-affine-key-xor-copy-loop
  desc: x86 indexed affine-key XOR byte decoder
  conf: 0.98
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: ( B0 ?? 8A 55 ?? 32 14 0F 0F AF C1 83 C0 ?? 31 C2 8B 03 88 14 08 41 39 CE 75 ?? | B1 ?? 8A 55 ?? 32 14 18
      88 C8 0F AF C3 8D 48 ?? 8B 06 31 CA 88 14 18 43 EB ?? )
- id: x64-byte-xor-decode-loop
  desc: x64 bytewise XOR decode loop
  conf: 0.95
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 48 FF C9 8A 14 08 44 30 ?? 88 14 08
- id: x64-constant-dword-xor-decode-loop
  desc: x64 constant dword XOR decode loop
  conf: 0.97
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 81 30 ?? ?? ?? ?? 81 70 04 ?? ?? ?? ?? 48 83 C0 08 48 39 D0 75 ??
