defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: x64-byte-xor-decode-loop
    desc: x64 bytewise XOR decode loop
    crit: notable
    conf: 0.95
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '48 FF C9 8A 14 08 44 30 ?? 88 14 08'
  - id: x64-indexed-xor-string-decode-loop
    desc: x64 indexed XOR string decode loop
    crit: notable
    conf: 0.94
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '41 89 C0 41 83 E0 0F 45 8A 04 10 44 32 04 08 44 88 84 04 ?? ?? ?? ?? 48 FF C0 EB'

  # A decoder that XORs two consecutive dwords with the same immediate and
  # advances by eight bytes.  This is more specific than a lone XOR opcode
  # and catches compact native payload stagers with per-sample keys.
  - id: x64-constant-dword-xor-decode-loop
    desc: x64 constant dword XOR decode loop
    crit: notable
    conf: 0.97
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '81 30 ?? ?? ?? ?? 81 70 04 ?? ?? ?? ?? 48 83 C0 08 48 39 D0 75 ??'
