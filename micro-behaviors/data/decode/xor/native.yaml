defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  # A complete byte-copy loop, including the backwards branch to the load.
  # The immediate key varies; neither a particular key nor a C2 is required.
  - id: x86-constant-byte-xor-copy-loop
    desc: x86 constant-key XOR byte-copy loop
    conf: 0.98
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8A 1C 08 80 F3 ?? 88 19 41 4A 75 F4'

  # Copies input bytes after XOR with a key byte and an affine function of
  # the index. Multiplier, addend, stack key slot and branch displacement
  # vary across builds; no endpoint, address or product name is required.
  - id: x86-index-affine-key-xor-copy-loop
    desc: x86 indexed affine-key XOR byte decoder
    conf: 0.98
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '( B0 ?? 8A 55 ?? 32 14 0F 0F AF C1 83 C0 ?? 31 C2 8B 03 88 14 08 41 39 CE 75 ?? | B1 ?? 8A 55 ?? 32 14 18 88 C8 0F AF C3 8D 48 ?? 8B 06 31 CA 88 14 18 43 EB ?? )'

  - id: x64-byte-xor-decode-loop
    desc: x64 bytewise XOR decode loop
    conf: 0.95
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '48 FF C9 8A 14 08 44 30 ?? 88 14 08'
  - id: x64-indexed-xor-string-decode-loop
    desc: x64 indexed XOR string decode loop
    conf: 0.94
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '41 89 C0 41 83 E0 0F 45 8A 04 10 44 32 04 08 44 88 84 04 ?? ?? ?? ?? 48 FF C0 EB'

  # A decoder that XORs two consecutive dwords with the same immediate and
  # advances by eight bytes.  This is more specific than a lone XOR opcode
  # and catches compact native payload stagers with per-sample keys.
  - id: x64-constant-dword-xor-decode-loop
    desc: x64 constant dword XOR decode loop
    conf: 0.97
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '81 30 ?? ?? ?? ?? 81 70 04 ?? ?? ?? ?? 48 83 C0 08 48 39 D0 75 ??'
