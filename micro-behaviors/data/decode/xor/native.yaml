defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  # Bounded nonzero-key XOR followed by explicit NUL termination and a
  # returned buffer pointer. Unlike a generic XOR loop this reconstructs a
  # C string. Key, buffer length, and termination displacement may change.
- id: x86-bounded-xor-string-decoder
  desc: x86 bounded XOR string decoder
  conf: 0.98
  arch: [x86]
  platforms: [linux, windows]
  for: [elf, pe, dll]
  if:
    type: hex
    section: .text
    pattern: '33 C0 80 34 08 ~00 40 83 F8 ?? 72 F6 C6 41 ?? 00 8B C1 C3'

- id: x64-indexed-xor-string-decode-loop
  desc: x64 indexed XOR string decode loop
  conf: 0.94
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: '41 89 C0 41 83 E0 0F 45 8A 04 10 44 32 04 08 44 88 84 04 ?? ?? ?? ?? 48 FF C0 EB'
