defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-xor-executable-path-clues
    desc: XOR loop and executable path clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
    any:
      - id: micro-behaviors/fs/path/executable::downloads-exe-path-clues
      - id: micro-behaviors/fs/path/temp::temp-main-exe-path-clues

  - id: node-xor-executable-decode-clues
    desc: XOR decoding and executable path clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/xor::node-xor-executable-path-clues
    any:
      - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/string/access::js-charcode-length-modulo-index
      - id: micro-behaviors/data/string/conversion::js-xor-character-call

