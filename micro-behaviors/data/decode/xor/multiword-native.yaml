defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  crit: notable
traits:
  # Four byte lanes of each key word are XORed into each table byte.
  # Repeating over the key-word table reduces to one effective byte key.
  # Wildcard branch offsets; no table address, key value or family name.
  - id: x64-four-lane-table-xor-loop
    desc: x64 four-lane key table XOR loop
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: >-
        48 8B 0A 48 01 C1 40 30 39 48 8B 0A 48 01 C1 44 30 11
        48 8B 0A 48 01 C1 44 30 09 48 8B 0A 48 01 C1 48 83 C0 01
        44 30 01 0F B7 72 08 89 F1 39 C6 7F ?? 49 39 DB 74 ??
        49 83 C3 04 EB ??
