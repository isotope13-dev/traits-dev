defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
  crit: notable
traits:
  - id: mips-xor-digit-dot-decode-loop
    desc: MIPS XOR decoder validates digit-or-dot bytes
    conf: 0.96
    if:
      type: hex
      section: .text
      # Load parsed byte; XOR with key; accept '.' or '0'..'9'; store
      # one output byte while advancing the hex input cursor by two.
      # Stack offsets, output limit and branch displacements may vary.
      # No host, marker, date key or symbol spelling is required.
      pattern: '24 15 00 2E [0-128] 93 A3 ?? ?? 02 03 18 26 7C 03 24 20 10 95 ?? ?? 24 63 FF D0 2C 63 00 0A 10 60 ?? ?? 00 00 00 00 02 36 28 21 24 03 ?? ?? 26 D6 00 01 27 DE 00 02 16 C3 ?? ?? A0 A4 00 00'
    unless:
      - type: value
        path: elf.endian
        exact: little
