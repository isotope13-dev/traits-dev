defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  # Consecutive byte loads, immediate XORs, and stack stores in an unrolled
  # buffer decoder. Keys, input displacements and output slots may change.
  # Scan the PE and appended images: the latter are outside the host sections.
  - id: x86-unrolled-byte-xor-to-stack
    desc: x86 unrolled XOR byte decoding to stack
    conf: 0.96
    if:
      type: yara
      source: |
        rule x86_unrolled_byte_xor_to_stack {
          strings:
            $decoder = { 0F B6 50 ?? 80 F1 ?? 80 F2 ?? 88 4C 24 ??
                         0F B6 48 ?? 88 54 24 ?? 0F B6 50 ??
                         80 F1 ?? 80 F2 ?? 88 4C 24 ?? }
          condition:
            uint16(0) == 0x5a4d and $decoder
        }
