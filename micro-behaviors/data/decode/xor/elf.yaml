# Native ELF bytewise XOR decoding.  The loop shape is a capability; intent is
# inferred by objective composites that add a network-received stage and
# execution from anonymous memory.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1140

traits:
  - id: elf-bytewise-xor-loop
    desc: ELF bytewise XOR buffer transform loop
    crit: notable
    conf: 0.9
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # xor byte in place, advance the buffer cursor, compare with the end,
      # and loop.  The key and branch displacement vary between builds.
      pattern: '80 30 ?? 48 FF C0 48 39 D0 75 ??'
  - id: nios2-bytewise-xor-loop
    desc: Nios II bytewise XOR buffer transform loop
    crit: notable
    conf: 0.94
    if:
      type: hex
      section: .text
      # Load a buffer byte, load a key byte, XOR them, and store the result.
      # Stack offsets vary between builds; the Nios II instruction sequence
      # around the XOR is stable and is more specific than the opcode alone.
      pattern: '17 ?? ?? ?? 17 ?? ?? ?? 3A 88 85 18 03 00 80 10 3A 88 07 10 17 ?? ?? ?? 3A F0 84 18'
