defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1140
traits:
  - id: charcode-modulo-key-index
    desc: charCodeAt indexed by a repeating key length
    conf: 0.9
    if:
      type: text
      # Obfuscators call the method through a computed member
      # (`x['charCodeAt'](...)`) and generate 30+ char identifiers, so the
      # pattern admits both spellings and long index expressions.
      regex: '(\.charCodeAt|\[''charCodeAt''\])\s*\([^)]{0,120}%\s*[A-Za-z_$][\w$]*\.length\s*\)'
    unless:
      - id: well-known/tool/development/agent/ai-cli/guangnao-agent::cli-banner
      - id: well-known/tool/development/agent/ai-cli/guangnao-agent::package-name

  - id: js-base64-xor-decode-loop
    desc: JavaScript Base64-to-XOR decode
    conf: 0.9
    # HTML email attachments (Mirage2FA-class stagers) embed the same
    # atob→charCodeAt→XOR unpacker inline; html is covered by file defaults.
    if:
      type: text
      regex: "(atob|Buffer\\.from).{0,80}charCodeAt\\s*\\([^)]{0,25}\\)\\s*\\^"
    not:
      - substr: atob(f.printable)
    unless:
      - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
      - id: well-known/app/media/docpro::mdland-api-xor-helper

  # Hex Buffer.from(...).map(b => b ^ 0xNN) — common npm-implant token decode.
  # Catches future installers that XOR-obfuscate embedded Bearer/auth secrets.
  - id: buffer-from-hex-byte-xor
    desc: XOR-decodes a hex Buffer byte-by-byte
    conf: 0.94
    if:
      type: text
      regex: 'Buffer\.from\([^)]{0,80}["'']hex["'']\s*\)\s*\.map\s*\([^)]{0,60}\^\s*0x[0-9A-Fa-f]{2}'

  - id: js-bytewise-xor-loop
    desc: JavaScript mutates bytes with XOR
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\[[^\]]{1,40}\]\s*\^=\s*[A-Za-z_$][A-Za-z0-9_$]*\.charCodeAt'

  - id: js-xor-key-modulo
    desc: XOR key uses a modulo index
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'charCodeAt\([^)]{0,40}%\s*[A-Za-z_$][A-Za-z0-9_$]*\)'

composite_rules:
  - id: js-repeating-key-buffer-xor-loop
    desc: Repeating-key XOR byte loop
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 800
    all:
      - id: js-bytewise-xor-loop
      - id: js-xor-key-modulo

  # A repeating-key XOR helper is a data-decoding capability.  It is also
  # used by legitimate bundled applications, so obfuscation intent belongs in
  # the objective composites that add payload and execution context.
  - id: js-repeating-key-charcode-xor-decoder
    desc: JavaScript repeating-key XOR decoder
    conf: 0.9
    for: [javascript, html]
    all:
      - id: micro-behaviors/data/encode/xor::js-fromcharcode-charcode-xor
      - id: charcode-modulo-key-index
    near_bytes: 160
