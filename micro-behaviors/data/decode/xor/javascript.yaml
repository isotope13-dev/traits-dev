defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1140
traits:
  - id: charcode-modulo-key-index
    desc: charCodeAt indexed by a repeating key length
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'charCodeAt\s*\([^)]{0,40}%\s*[A-Za-z_$][\w$]*\.length\s*\)'
    unless:
      - id: well-known/tool/development/guangnao-agent::cli-banner
      - id: well-known/tool/development/guangnao-agent::package-name

  - id: js-base64-xor-decode-loop
    desc: JavaScript Base64-to-XOR decode
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: "(atob|Buffer\\.from).{0,80}charCodeAt\\s*\\([^)]{0,25}\\)\\s*\\^"
    not:
      - substr: atob(f.printable)
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: well-known/app/docpro::mdland-api-xor-helper

  # Hex Buffer.from(...).map(b => b ^ 0xNN) — common npm-implant token decode.
  # Catches future installers that XOR-obfuscate embedded Bearer/auth secrets.
  - id: buffer-from-hex-byte-xor
    desc: XOR-decodes a hex Buffer byte-by-byte
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Buffer\.from\([^)]{0,80}["'']hex["'']\s*\)\s*\.map\s*\([^)]{0,60}\^\s*0x[0-9A-Fa-f]{2}'

composite_rules:
  # A repeating-key XOR helper is a data-decoding capability.  It is also
  # used by legitimate bundled applications, so obfuscation intent belongs in
  # the objective composites that add payload and execution context.
  - id: js-repeating-key-charcode-xor-decoder
    desc: JavaScript repeating-key XOR decoder
    crit: notable
    conf: 0.9
    for: [javascript, html]
    all:
      - id: micro-behaviors/data/encode/xor::js-fromcharcode-charcode-xor
      - id: charcode-modulo-key-index
    near_bytes: 160
