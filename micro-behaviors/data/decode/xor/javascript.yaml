defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1140
traits:
  - id: js-base64-xor-decode-loop
    desc: JavaScript Base64-to-XOR decode
    conf: 0.9
    # HTML email attachments (Mirage2FA-class stagers) embed the same
    # atob→charCodeAt→XOR unpacker inline; html is covered by file defaults.
    if:
      type: text
      regex: "(atob|Buffer\\.from).{0,80}charCodeAt\\s*\\([^)]{0,25}\\)\\s*\\^"
    not:
      - substr: atob(f.printable)
    unless:
      - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
      - id: well-known/app/media/docpro::mdland-api-xor-helper

  # Hex Buffer.from(...).map(b => b ^ 0xNN) — common npm-implant token decode.
  # Catches future installers that XOR-obfuscate embedded Bearer/auth secrets.
  - id: buffer-from-hex-byte-xor
    desc: XOR-decodes a hex Buffer byte-by-byte
    conf: 0.94
    if:
      type: text
      regex: 'Buffer\.from\([^)]{0,80}["'']hex["'']\s*\)\s*\.map\s*\([^)]{0,60}\^\s*0x[0-9A-Fa-f]{2}'

  - id: js-bytewise-xor-loop
    desc: JavaScript mutates bytes with XOR
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\[[^\]]{1,40}\]\s*\^=\s*[A-Za-z_$][A-Za-z0-9_$]*\.charCodeAt'

  - id: js-rolling-key-byte-xor-loop
    desc: Buffer byte XOR with rolling key update
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: 'key\s*=\s*\(\s*key\s*\+\s*\w+\s*\+\s*0x[0-9a-fA-F]+\s*\)\s*&\s*0xff'

  - id: js-numeric-array-index-xor-loop
    desc: XOR-decodes numeric array into string
    conf: 0.93
    count_min: 3
    if:
      type: text
      regex: '\+=\s*\w+\(\s*\w+\[\s*\w+\s*\]\s*\^\s*\w+\s*\)'

composite_rules:
  - id: js-repeating-key-buffer-xor-loop
    desc: Repeating-key XOR byte loop
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 800
    all:
      - id: js-bytewise-xor-loop
      - id: micro-behaviors/data/string/access::js-charcode-modulo-index
