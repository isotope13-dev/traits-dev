traits:

  - id: vbs-numeric-code-xor
    desc: WSH XORs numeric character codes
    crit: notable
    conf: 0.92
    attack: T1027
    for: [vbs]
    platforms: [windows]
    if:
      type: text
      # Reconstructs characters from XORed numeric values.
      regex: '(?i)Chr\s*\(\s*CLng\s*\([^\r\n]{1,100}\bXor\b'

