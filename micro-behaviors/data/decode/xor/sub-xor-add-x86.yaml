defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
traits:
  - id: x86-stack-byte-sub-xor-add-loop
    desc: Stack byte subtract/XOR/add decoder loop
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A 44 0D ?? 2A C3 34 ?? 04 ?? 88 44 0D ?? 41 83 F9 ?? 72 ??'
  - id: x86-rolling-xor-decrement-buffer
    desc: Rolling multiply-add-shift XOR byte decoder
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A 04 32 32 C1 69 C9 ?? ?? ?? ?? FE C8 88 04 32 81 C1 ?? ?? ?? ?? C1 E9 ?? 42 3B D7 7C ??'
