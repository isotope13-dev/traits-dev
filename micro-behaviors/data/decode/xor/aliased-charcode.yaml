defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: aliased-charcode-xor-rebuild
    desc: Aliased character conversion of XORed bytes
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((_
          (_
            (variable_declarator name: (identifier) @alias
              value: (member_expression object: (identifier) @object
                property: (property_identifier) @method)))
          (for_statement
            body: [
              (expression_statement
                (augmented_assignment_expression
                  right: (call_expression function: (identifier) @callee
                    arguments: (arguments
                      (binary_expression left: (subscript_expression)
                        operator: "^"))))) @rebuild
              (statement_block
                (expression_statement
                  (augmented_assignment_expression
                    right: (call_expression function: (identifier) @callee
                      arguments: (arguments
                        (binary_expression left: (subscript_expression)
                          operator: "^")))))) @rebuild
            ]))
          (#eq? @object "String")
          (#eq? @method "fromCharCode")
          (#eq? @alias @callee))
