defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: cil-modulo-key-byte-xor-sequence
    desc: CIL byte XOR with modulo-indexed key
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: text
      # ldelem.u1; ldsfld key; ldloc index; ldsfld key; callvirt Length;
      # rem; callvirt Chars; stloc; ldloc; xor; conv.u2. Metadata tokens
      # and local indices vary between builds; no key or ciphertext is used.
      pattern: '91 7E ?? ?? ?? 04 FE 0C ?? ?? 7E ?? ?? ?? 04 6F ?? ?? ?? 0A 5D 6F ?? ?? ?? 0A FE 0E ?? ?? FE 0C ?? ?? 61 D1'
