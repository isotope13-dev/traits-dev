defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: e-runtime-xor10-byte-decode
    desc: E-runtime byte XOR and character-conversion code
    crit: notable
    conf: 0.97
    if:
      type: hex
      offset_range: [0, null]
      pattern: '68 10 0E 00 00 [20-32] BB CC 00 00 00 E8 [4] 83 C4 1C [10-24] BB D4 09 00 00 E8'
