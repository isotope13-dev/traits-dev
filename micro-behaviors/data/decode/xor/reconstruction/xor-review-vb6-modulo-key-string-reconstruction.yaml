defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: vb6-modulo-key-string-reconstruction
    desc: VB6 modulo-key string XOR reconstruction
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # Mid(key, index Mod Len(key) + 1, 1); Asc; XOR the two characters.
      # Pool slots, locals, keys, registry paths and endpoints are unrestricted.
      pattern: '6C ?? ?? 80 10 00 4A C2 F5 01 00 00 00 AA 80 10 00 0B ?? ?? 0C 00 23 ?? ?? 0B ?? ?? 04 00 70 ?? ?? [0-32] 6B ?? ?? 6B ?? ?? FB 12 E7'
