defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.93

traits:
  # Indexes a key string with a halved counter taken modulo the key length
  # (a literal length or a Length expression): the repeating-key schedule
  # of a byte-wise XOR decoder. The key text and variable names vary; the
  # `-bxor [int][char]$key[($i/2) % N]` shape does not.
  - id: powershell-repeating-key-bxor-index
    desc: PowerShell XORs against repeating indexed key
    if:
      type: text
      exclude_comments: true
      regex: '(?i)-bxor\s*\[int\]\[char\]\$\w+\[\(\$\w+/2\)%(\d+|\$\w+\.Length)\]'
