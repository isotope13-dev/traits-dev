defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1140
traits:
  - id: js-repeating-key-xor-string-decode
    desc: XOR-decodes repeating-key bytes into a string
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'String\.fromCharCode.{0,30}\[\s*i\s*\].{0,10}\^.{0,40}\[\s*i\s*%'

