defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.93

composite_rules:
  - id: php-pack-hex-xor-reconstruction
    desc: PHP pack hex decode near bitwise XOR
    near_bytes: 320
    all:
      - id: micro-behaviors/data/decode/hex::php-pack-hex-decode
    any:
      - id: micro-behaviors/data/bitwise/xor/expression::php-caret-xor-expression
      - id: micro-behaviors/data/bitwise/xor/expression::php-compound-xor-assignment

  - id: php-pack-low-hex-xor-reconstruction
    desc: PHP low-nibble pack decode near XOR
    near_bytes: 320
    all:
      - id: micro-behaviors/data/decode/hex::php-pack-hex-low-nibble
    any:
      - id: micro-behaviors/data/bitwise/xor/expression::php-caret-xor-expression
      - id: micro-behaviors/data/bitwise/xor/expression::php-compound-xor-assignment

  - id: php-hex2bin-xor-reconstruction
    desc: PHP hex2bin decode near bitwise XOR
    near_bytes: 320
    all:
      - id: micro-behaviors/data/decode/hex::php-hex-byte-decode
    any:
      - id: micro-behaviors/data/bitwise/xor/expression::php-caret-xor-expression
      - id: micro-behaviors/data/bitwise/xor/expression::php-compound-xor-assignment

  - id: php-chr-hexdec-xor-reconstruction
    desc: PHP chr(hexdec()) conversion near bitwise XOR
    near_bytes: 320
    all:
      - id: micro-behaviors/data/decode/hex::chr-hexdec-call
    any:
      - id: micro-behaviors/data/bitwise/xor/expression::php-caret-xor-expression
      - id: micro-behaviors/data/bitwise/xor/expression::php-compound-xor-assignment

  - id: php-hex-xor-reconstruction
    desc: PHP hexadecimal decode near bitwise XOR
    crit: component
    any:
      - id: php-pack-hex-xor-reconstruction
      - id: php-pack-low-hex-xor-reconstruction
      - id: php-hex2bin-xor-reconstruction
      - id: php-chr-hexdec-xor-reconstruction
