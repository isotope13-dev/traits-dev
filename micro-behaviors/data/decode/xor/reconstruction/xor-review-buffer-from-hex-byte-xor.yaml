defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1140
traits:
  - id: buffer-from-hex-byte-xor
    desc: XOR-decodes a hex Buffer byte-by-byte
    conf: 0.94
    if:
      type: text
      regex: 'Buffer\.from\([^)]{0,60}hex[\s\S]{0,70}\^\s*(0x[0-9A-Fa-f]{2}|[\w$]+)'

