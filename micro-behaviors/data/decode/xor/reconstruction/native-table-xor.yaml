defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.98

traits:
  - id: x64-table-keyed-position-xor-loop
    desc: Table lookup with keyed and position XOR
    if:
      type: hex
      section: .text
      # Input byte indexes the inverse substitution table. XOR with a
      # masked key and position bytes, then store and advance in place.
      # Key width, table/key displacements and multiplier are variable.
      pattern: '41 0F B6 00 49 8B C8 48 2B CE 83 E1 ?? 0F B6 54 0D ?? 32 94 05 ?? ?? ?? ?? 8B C7 C1 E8 10 32 D0 8B C7 C1 E8 08 32 D0 40 0F B6 C7 69 C8 ?? ?? ?? ?? FF C7 32 D1 41 88 10 49 FF C0 41 3B F9 72 ??'
