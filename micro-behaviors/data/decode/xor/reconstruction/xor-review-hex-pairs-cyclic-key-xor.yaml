defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: hex-pairs-cyclic-key-xor
    desc: Decodes hex pairs through cyclic XOR key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Pair offset / 2 modulo key length selects the repeating key byte;
      # shift/or assembles the two hex nibbles before XORing that byte.
      pattern: '48 8B C6 48 D1 E8 33 D2 48 F7 77 10 41 C0 E1 04 44 0A C9 46 32 0C 12'
