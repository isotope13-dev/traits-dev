defaults: {}
composite_rules:
  - platforms:
      - windows
      - unix
    for:
      - javascript
    id: wsh-xor-string-and-marker-clues
    desc: WSH XOR, string fragments and marker clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/source/literal/fragment/sequence::js-string-from-char-fragments
      - id: metadata/lang/runtime::wscript-host-reference
      - id: micro-behaviors/data/decode/xor/reconstruction::js-numeric-array-index-xor-loop
      - id: micro-behaviors/data/format/framing::generic-framing-marker-text
