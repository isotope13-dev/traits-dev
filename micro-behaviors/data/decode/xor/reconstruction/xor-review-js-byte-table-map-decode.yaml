defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]

traits:
  # Map-based sibling of fromcharcode-xor-rebuild: the XOR lives inside a
  # `.map` callback spread into String.fromCharCode
  # (`String.fromCharCode(...table.map((b, i) => (b ^ key[i & 3] + ... & 255) & 255))`),
  # which the plain `fromCharCode(...^)` form misses because the inner `)`
  # precedes the `^`. Text with `;` bounding so the match cannot cross
  # statements into unrelated code.
  - id: js-map-fromcharcode-xor-rebuild
    desc: XORed array map rebuilt via fromCharCode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fromCharCode\s*\(\s*\.\.\.\s*[A-Za-z_$][\w$]*\s*\.\s*map\s*\([^;]{0,500}?\^'
  - id: js-apply-fromcharcode-xor-rebuild
    desc: Mapped XOR values rebuilt via fromCharCode.apply
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'fromCharCode\s*\.\s*(apply|call)\s*\([^;]{0,500}?\.map\s*\([^;]{0,500}?\^'
