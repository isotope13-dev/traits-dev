defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1140
  mbc: C0043

traits:
  - id: dotnet-hex-byte-repeating-xor-loop
    desc: Hex bytes decoded with repeating XOR
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '08 1F 20 2F ?? 07 08 18 5B 03 08 18 6F ?? ?? ?? ?? 1F 10 28 ?? ?? ?? ?? 9C [0-16] 08 18 5B 1F 10 59 0D 06 09 03 08 18 6F ?? ?? ?? ?? 1F 10 28 ?? ?? ?? ?? 07 09 07 8E 69 5D 91 61 D2 9C'

  # Same decoder compiled with the key buffer in the first local: the first
  # 32 hex digits fill a 16-byte key, the rest decode against key[i % len].
  - id: dotnet-hex-leading-key-xor-loop
    desc: Hex bytes decoded with leading key XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '1F 10 59 0D 08 1F 20 2F ?? ?? 08 18 5B 03 08 18 6F ?? ?? ?? ?? 1F 10 28 ?? ?? ?? ?? 9C [0-4] ?? 09 03 08 18 6F ?? ?? ?? ?? 1F 10 28 ?? ?? ?? ?? ?? 09 ?? 8E 69 5D 91 61 D2 9C'
