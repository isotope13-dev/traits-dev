# Numerical Recipes LCG (x*1664525 + 1013904223) whose top byte is taken as
# a keystream byte: the state update and >>24 extraction of a per-byte
# string or payload decryptor. The constants alone are a common PRNG.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  attack: T1140

traits:
  - id: lcg-keystream-high-byte-x86
    desc: Derives key bytes from an LCG state
    crit: notable
    conf: 0.85
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      # imul r32, r32, 0x19660D ; ... ; add r32, 0x3C6EF35F ; ... ; shr r32, 24
      pattern: '69 ?? 0D 66 19 00 [0-12] 81 C? 5F F3 6E 3C [0-8] C1 E? 18'
