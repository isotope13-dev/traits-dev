defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-cyclic-key128-ciphertext-feedback
    desc: Cyclic-key XOR with ciphertext feedback
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F BE 14 37 8B C7 83 E0 7F 8A 84 04 ?? ?? ?? ?? 02 C3 8B DA 30 04 37 47 3B FD 72 ??'
  - id: x86-dword-key16-ciphertext-feedback
    desc: DWORD-key XOR with ciphertext feedback
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F BE 34 18 8B C8 83 E1 0F 8A 4C 8D 00 02 4C 24 ?? 30 0C 18 40 89 74 24 ?? 3B C7 72 ??'
