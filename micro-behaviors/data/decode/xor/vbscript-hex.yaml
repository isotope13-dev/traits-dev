defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
- id: vbs-hex-pair-xor23-character
  desc: VBScript decodes hex pairs with XOR 23
  if:
    type: text
    regex: '(?i)Chr\(CLng\("&H" & Mid\(\w+,\w+,2\)\) Xor 23\)'
composite_rules:
- id: vbs-pair-step-xor23-decoder
  desc: Pair-step loop decodes hex with XOR 23
  all:
  - id: vbs-hex-pair-xor23-character
  - id: micro-behaviors/data/control-flow/loop::vbs-for-step-two
