# key += increment + sign, with sign alternating between +1 and -1.
# This copies decoded bytes and is not a family identity on its own.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-alternating-step-key-xor-copy-loop
    desc: x86 XOR decoder with alternating key increments
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'B1 01 85 FF 74 ?? 56 8B 75 ?? 2B F0 8A 14 06 32 55 ?? 88 10 8A D1 02 55 ?? F6 D9 00 55 ?? 40 4F 75 ??'
