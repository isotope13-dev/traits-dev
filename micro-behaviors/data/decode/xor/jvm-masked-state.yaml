defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
traits:
  - id: jvm-repeated-masked-state-xor-stores
    desc: Repeated JVM masked-state XOR byte stores
    conf: 0.95
    count_min: 4
    if:
      type: hex
      # iushr; ixor; push mask (sipush/ldc_w/ldc); iand; ixor;
      # i2b; bastore. No fixed seed, multiplier, shift, or pool index.
      pattern: '7C 82 (11 ?? ?? | 13 ?? ?? | 12 ??) 7E 82 91 54'
