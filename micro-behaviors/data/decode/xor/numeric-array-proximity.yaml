defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: js-character-xor-near-numeric-array
    desc: XOR character rebuilding near numeric array
    crit: notable
    conf: 0.97
    # A proximity observation, not proof that the array feeds the XOR.
    # Preserve the former window and consumers without asserting concealment.
    near_bytes: 131072
    all:
      - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
    # Both decimal and hexadecimal array syntax are covered. No relationship
    # between the array's contents and the decoder's input is asserted.
    any:
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/data/encode/arrays::js-hex-number-array
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
      - id: well-known/lib/format/jspdf/
      - id: well-known/lib/format/pdfjs/
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems::go-binary
