defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # e-runtime XOR dispatch (operation 0xcc), followed by byte conversion
  # (0x9d4). The immediate 0xe10 is reduced to its low byte, 0x10. Calls,
  # frame slots and the following conversion address vary between builds.
  # Search the full image: unpacked UPX carriers and their embedded native
  # modules put this compiled routine in differently named sections.
  - id: e-runtime-xor10-byte-decode
    desc: E-runtime byte XOR and character-conversion code
    crit: notable
    conf: 0.97
    if:
      type: hex
      offset_range: [0, null]
      pattern: '68 10 0E 00 00 [20-32] BB CC 00 00 00 E8 [4] 83 C4 1C [10-24] BB D4 09 00 00 E8'
