defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: powershell-xor-char-decode-loop
    desc: PowerShell XOR-decodes bytes into characters
    crit: suspicious
    conf: 0.93
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\[char\]\(\$\w+\s*-bxor\s*\$\w+\[\$\w+\]\)'

  # `iex` spelled as character codes so the cmdlet name never appears in the
  # script: `&([char[]](105,101,120)-join '')`.
