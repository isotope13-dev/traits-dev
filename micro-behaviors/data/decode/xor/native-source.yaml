defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1140

traits:
  - id: native-bytewise-xor-array-transform
    desc: Native bytewise XOR transform over a buffer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(\b\w+\[\w{1,3}\]\s*\^=|\b\w+\[\w{1,3}\]\s*=.{0,80}\^)'
