defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1140

traits:
  - id: native-bytewise-xor-array-transform
    desc: Native bytewise XOR array transform
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: >-
        \b(out|dst|buf)\s*\[\s*\w+\s*\]\s*=\s*\w+\s*\[\s*\w+\s*\]\s*\^\s*\w+\s*;
