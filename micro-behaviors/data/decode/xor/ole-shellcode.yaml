defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.95
traits:
  # x86: load count; XOR byte [ebx], key; increment ebx; LOOP backwards.
  # Deliberately leave the count and key variable, including across versions.
  - id: ole-x86-byte-xor-loop
    desc: OLE contains x86 byte-XOR decoding loop
    if:
      type: hex
      pattern: 'B9 ?? ?? ?? ?? 80 33 ?? 43 E2 FA'

  - id: ole-x86-dec-xor-loop
    desc: OLE contains x86 decrement XOR loop
    if:
      type: hex
      pattern: '80 34 11 ?? 49 81 3C 11 F2 33 C0 33 75 F2'
