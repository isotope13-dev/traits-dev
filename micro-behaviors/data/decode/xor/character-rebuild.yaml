defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: fromcharcode-xor-rebuild
    desc: Reconstructs characters from XOR-decoded values
    crit: notable
    conf: 0.95
    if:
      # Text rather than tree-sitter: the packed multi-megabyte single-line
      # droppers that most need this signal exceed the parser's scanner-state
      # guard, so an AST-anchored matcher never runs on them. `[^)]` keeps the
      # XOR inside the fromCharCode argument list, which is the same
      # containment the AST node provided — an operator elsewhere in a crypto
      # library cannot reach across the closing paren.
      type: text
      regex: 'fromCharCode\s*\([^)]{0,240}\^'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker

