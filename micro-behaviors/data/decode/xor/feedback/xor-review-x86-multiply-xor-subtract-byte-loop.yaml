defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
traits:
  - id: x86-multiply-xor-subtract-byte-loop
    desc: x86 rolling XOR/subtraction byte decoder
    conf: 0.98
    if:
      type: hex
      offset_range: [1024, null]
      pattern: B9 B5 EF 00 00 [0-24] 0F AF CA 30 4F FF [0-512] 28 77 FE [0-24] (86 D6 [0-24] 83 E8 F8 | 83 E8 F8 [0-24] 86 D6)
