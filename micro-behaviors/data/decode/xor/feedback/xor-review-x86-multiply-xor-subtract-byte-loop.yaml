defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
traits:
  - id: x86-multiply-xor-subtract-byte-loop
    desc: x86 rolling XOR/subtraction byte decoder
    conf: 0.98
    if:
      type: hex
      offset_range: [1024, null]
      pattern: B9 B5 EF 00 00 [0-24] 0F AF CA 30 4F FF [0-512] 28 77 FE [0-24] (86 D6 [0-24] 83 E8 F8 | 83 E8 F8 [0-24] 86 D6)
  - id: x86-multiply-xor-subtract-swapped-key-loop
    desc: Rolling XOR/subtract with key byte swap
    conf: 0.99
    if:
      type: hex
      section: any
      # Multiply ECX into EDX, XOR DL, subtract CH, then carry the
      # product back into ECX and swap CL/CH before the next byte.
      # The multiplier and counter bounds are generation dependent.
      pattern: '83 EF FE BA ?? ?? ?? ?? 0F AF D1 30 57 FE 28 6F FE 87 D1 86 E9 83 E8 ?? 4F 3D ?? ?? ?? ?? 76 ??'
