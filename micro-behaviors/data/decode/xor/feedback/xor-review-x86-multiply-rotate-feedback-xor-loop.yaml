defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-multiply-rotate-feedback-xor-loop
    desc: Multiply-rotate XOR with byte feedback
    crit: notable
    conf: 0.99
    if:
      type: hex
      # This decoder can inhabit an appended section rather than .text.
      offset_range: [512, null]
      # TEST and OR both test ECX for zero without changing its value.
      # SUB EAX,negative-imm8 also implements the state increment. Keep
      # multiplication, rotation, plaintext feedback and execution mandatory.
      pattern: '(09 C9|85 C9) 74 ?? 0F AF C2 (8D 40 ??|83 C0 ??|83 E8 ??) 89 C3 C1 E3 03 C1 E8 1D 09 D8 88 C3 30 1E 0F B6 1E 01 D8 46 49 EB ?? FF E5'
