# x86 rolling-key XOR whose key advances by a 16-bit rotate, a 32-bit
# multiply and a subtract/add of constants each byte -- the key schedule of
# the ShadowPad loader in the trojaned NetSarang nssock2.dll (2017). The
# constants are build-specific and left open here.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1140
traits:
  - id: x86-rol16-multiply-key-xor-loop
    desc: x86 rol16-multiply rolling XOR key schedule
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: 'C1 E2 10 8B 45 ?? C1 E8 10 03 D0 [0-6] 69 C9 ?? ?? ?? ?? 81 (E9|C1)'
