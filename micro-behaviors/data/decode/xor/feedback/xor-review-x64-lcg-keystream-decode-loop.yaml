defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.97
traits:
  - id: x64-lcg-keystream-xor-decode-loop
    desc: x64 LCG-keystream XOR decode loop
    if:
      type: hex
      section: any
      # Require a memory XOR using the updated state and a backedge to IMUL.
      # Loose register arithmetic also matches unrelated obfuscation mid-instruction.
      pattern: '69 C0 ?? ?? ?? ?? 48 8D 49 04 05 ?? ?? ?? ?? 31 41 FC 48 83 EA 01 75 E8'
