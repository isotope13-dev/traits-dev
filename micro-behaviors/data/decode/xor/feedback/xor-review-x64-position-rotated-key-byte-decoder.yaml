defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.95

traits:
  - id: x64-position-rotated-key-byte-decoder
    desc: Rotates key by index and XOR-decodes bytes
    if:
      type: hex
      section: any
      # ecx = index; eax = key; rol eax,cl; add al,index;
      # xor al,[source+destination]; store decoded byte. The key is unconstrained.
      pattern: '41 8B C8 B8 ?? ?? ?? ?? D3 C0 [0-12] 41 02 C0 [0-12] 41 32 04 11 88 02'
