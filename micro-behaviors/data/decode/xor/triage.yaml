traits:
- id: vbs-xor-character-code
  platforms:
  - unix
  - windows
  desc: VBScript XORs a character-code slice
  conf: 0.94
  for:
  - vbs
  - static-lib
  if:
    type: text
    regex: (?i)\b(Asc|ChrW?|Mid)\s*\([^\r\n]{0,80}\bXor\b
- id: vbs-numeric-code-xor
  platforms:
  - windows
  for:
  - vbs
  attack: T1027
  desc: WSH XORs numeric character codes
  conf: 0.92
  if:
    type: text
    regex: (?i)(CLng.{0,120}\bXor\b|AscB\s*\(\s*MidB\s*\([^)]{1,240}\)\s*\)\s*\bXor\b)
defaults:
  crit: notable
