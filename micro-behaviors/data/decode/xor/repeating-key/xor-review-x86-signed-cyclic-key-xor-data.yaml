# Signed key-byte load, signed division, key-byte addition and in-place XOR.
# The second division resets the key cursor; neither key bytes nor addresses
# are fixed. This is a decoding capability, not a malware-family identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-signed-cyclic-key-xor-data
    desc: x86 signed cyclic-key XOR decoder in .data
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .data
      pattern: '0F BE 04 ?? 99 F7 ?? [2] 80 C2 ?? 30 11 [4] 47 85 D2 75 ?? 33 FF 46'
