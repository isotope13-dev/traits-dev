defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1140
traits:
  - id: js-buffer-repeating-key-xor-decode
    desc: XOR-decodes bytes with repeating key index
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[\s*i\s*\]\s*=\s*\w+\s*\[\s*i\s*\]\s*\^\s*key\s*\[\s*i\s*%\s*key\.length\s*\]'

