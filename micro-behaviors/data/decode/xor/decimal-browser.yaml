defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.98
traits:
  - id: js-array-xor-character-reconstruction
    desc: "Rebuilds characters from XORed array elements"
    platforms: [windows, unix]
    crit: notable
    if:
      type: text
      regex: "fromCharCode\\(\\w+\\[\\w+\\]\\s*\\^\\s*\\w+\\)"
  - id: js-incrementing-xor-charcode
    desc: Incrementing XOR rebuilds characters
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\w+=\w+\^\w+;\w+\+=1;\w+=\w+\+String\.fromCharCode\(\w+\)'
  - id: js-quoted-semicolon-decimals
    desc: Quoted semicolon-separated decimal run
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(\d{1,5};){12}"'
