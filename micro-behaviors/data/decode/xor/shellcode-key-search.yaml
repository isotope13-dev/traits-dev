defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable

traits:
  # Tries each byte key against three shellcode-header bytes, then XORs the
  # same source buffer in place. Addresses and branch displacements vary.
  - id: x86-header-key-search-byte-xor
    desc: x86 header-key search and in-place XOR loop
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F B6 32 33 C9 8B FF 8B C6 33 C1 3C EB 75 ?? 0F B6 42 01 33 C1 3C 02 75 ?? 0F B6 42 03 33 C1 3C F1 74 ?? 41 81 F9 00 01 00 00 72 ?? [7-16] 30 0C 10 40 3B 47 14 72 ??'

  - id: x86-index-subtract-xor-copy-loop
    desc: x86 index-derived XOR byte-copy loop
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '8A 04 37 88 06 FF D5 8A CB 80 E9 ?? 30 0E 43 46 81 FB ?? ?? ?? ?? 72 ??'
