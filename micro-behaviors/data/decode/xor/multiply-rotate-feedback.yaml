defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-multiply-rotate-feedback-xor-loop
    desc: Multiply-rotate XOR with byte feedback
    crit: notable
    conf: 0.99
    if:
      type: hex
      # This decoder can inhabit an appended section rather than .text.
      offset_range: [512, null]
      # TEST and OR both test ECX for zero without changing its value.
      pattern: '(09 C9|85 C9) 74 ?? 0F AF C2 (8D 40 ??|83 C0 ??) 89 C3 C1 E3 03 C1 E8 1D 09 D8 88 C3 30 1E 0F B6 1E 01 D8 46 49 EB ?? FF E5'
  - id: x86-callpop-inline-xor-return
    desc: XOR-decodes inline bytes and returns into them
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '5E 89 F7 B9 ?? ?? ?? ?? (09 C9|85 C9) 74 07 80 36 ?? 46 49 EB F5 57 C3 E8 E6 FF FF FF'
