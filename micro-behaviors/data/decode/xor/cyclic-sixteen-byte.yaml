defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-sixteen-byte-key-xor-in-place
    desc: x86 in-place cyclic sixteen-byte XOR loop
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      # Reset EDX at sixteen, XOR each input byte against key[EDX],
      # write it back, then advance the key index and remaining count.
      pattern: '83 FA 10 75 ?? 33 D2 AC 32 82 [4] AA 42 49 75 ??'
