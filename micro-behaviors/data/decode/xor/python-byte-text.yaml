defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-xor-byte-comprehension-text-decode
    desc: XOR byte comprehension decoded as text
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: 'bytes\(\[[^\]\n]{1,80}\^[^\]\n]{1,80}\]\)\.decode\('
