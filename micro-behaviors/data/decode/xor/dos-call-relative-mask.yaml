# Bind the CALL return address, POP BP delta, source offset and XOR key.
# The six decoded bytes must actually be a NUL-terminated COM wildcard;
# arbitrary XOR loops and coincidental encoded text do not establish it.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, html]
  size_max: 65536

traits:
  - id: dos-call-relative-com-mask-decode
    desc: DOS XOR decodes an executable wildcard
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_call_relative_com_mask_decode {
          meta:
            filetypes = "dos_com,data,html"
          strings:
            $call = { E8 ?? 00 }
            $decode = { 5D 83 ED ?? 33 C9 8B F5 B1 06 BF ?? ?? 83 C6 ?? 03 FE AC 34 ?? AA E2 FA }
          condition:
            for any c in (1..#call) : (
              for any d in (1..#decode) : (
                @call[c] + 3 + uint16(@call[c]+1) == @decode[d] and
                uint8(@decode[d]+20) != 0 and
                @call[c]+3 >= uint8(@decode[d]+3) and
                @call[c]+3-uint8(@decode[d]+3)+uint8(@decode[d]+15)+6 <= @decode[d] and
                for any m in (0..filesize-6) : (
                  m == @call[c]+3-uint8(@decode[d]+3)+uint8(@decode[d]+15) and
                  (uint8(m) ^ uint8(@decode[d]+20)) == 0x2a and
                  (uint8(m+1) ^ uint8(@decode[d]+20)) == 0x2e and
                  ((uint8(m+2) ^ uint8(@decode[d]+20)) | 0x20) == 0x63 and
                  ((uint8(m+3) ^ uint8(@decode[d]+20)) | 0x20) == 0x6f and
                  ((uint8(m+4) ^ uint8(@decode[d]+20)) | 0x20) == 0x6d and
                  (uint8(m+5) ^ uint8(@decode[d]+20)) == 0
                )
              )
            )
        }
