defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.97
traits:
  - id: x64-byte-subtract-xor-store
    desc: Subtracts and XORs bytes into output buffer
    if:
      type: hex
      section: .text
      # Source-byte load, stack-supplied subtraction and XOR operands, and
      # store through the context's output-buffer pointer. Slots vary.
      pattern: '4? 8A 0C ?? 2A 8C 24 ?? ?? ?? ?? 32 8C 24 ?? ?? ?? ?? 49 8B 4? ?? 4? 88 0C ??'
