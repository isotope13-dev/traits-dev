# Byte-array XOR transforms in C# source.  The indexed assignment is a real
# data transform; a lone XOR operator remains in the neutral syntax trait.
defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-bytearray-xor-assignment
    desc: C# indexed byte XOR transform
    crit: notable
    conf: 0.92
    attack: T1140
    if:
      type: text
      regex: '\w+\[\w+\]\s*\^=\s*0x[0-9A-Fa-f]{2}'
