defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-xorshift-secret-decode
    desc: Decodes bytes using xorshift32
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # xorshift32 (13,17,5), XOR input, and store decoded key bytes.
      pattern: '8B C2 C1 E0 0D 33 C2 8B D0 C1 EA 11 33 D0 44 8B CA 41 C1 E1 05 44 33 CA 41 0F B6 C1 32 01 41 88 00'
