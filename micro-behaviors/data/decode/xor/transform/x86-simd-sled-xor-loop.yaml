# x86 memory XOR loops interleaved with MMX/SSE short-jump junk sleds.
# Matches register-indexed XOR writes regardless of chosen registers or key.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.96
  size_max: 2000000

traits:
  - id: x86-simd-sled-indexed-xor
    desc: Indexed x86 XOR before SIMD jump
    if:
      type: hex
      pattern: "(31|30) (04|0C|14|1C|2C|34|3C) ?? (66 0F ?? ?? | 0F ?? ??) [0-1] EB"
