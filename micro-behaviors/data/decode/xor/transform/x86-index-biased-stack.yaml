defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-index-biased-stack-xor
    desc: Decodes stack bytes with biased index
    crit: notable
    if:
      type: hex
      section: .text
      # ecx=eax; cl+=bias; cl^=stack[eax]; cl^=bias; store; increment;
      # bounded loop. Bias and stack displacement vary between strings.
      pattern: '(89 C1|8B C8) 80 C1 ?? 32 4C 04 ?? 80 F1 ?? 88 4C 04 ?? 40 83 F8 ?? 75 ??'
