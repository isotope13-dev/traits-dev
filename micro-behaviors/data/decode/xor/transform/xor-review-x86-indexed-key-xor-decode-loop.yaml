# Scattered x86 decode-and-dispatch operation. A decoder rebuilds code
# from indexed streams with a memory-held key byte, initializes a table
# of code-chunk addresses, then invokes the decoded buffer at the start
# of its code section. Opcodes and register roles are the technique
# invariants; stream addresses, key values, and sizes vary per build.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-indexed-key-xor-decode-loop
    desc: x86 indexed-stream keyed XOR decode loop
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      section: .text
      pattern: '03 05 ?? ?? ?? ?? 8A 00 32 05 ?? ?? ?? ?? 8B 0D ?? ?? ?? ?? 03 0D ?? ?? ?? ?? 88 01'
