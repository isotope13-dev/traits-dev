defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: x86-xor-pe-buffer-write-arguments
    desc: XOR-decoded PE reused in write-call arguments
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule x86_xor_pe_buffer_write_arguments {
          strings:
            $decode = { 6A ?? 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 0C }
            $xor = { 8B 55 08 03 55 FC 0F BE 02 33 45 10 8B 4D 08 03 4D FC 88 01 EB ?? }
            $write = { FF B5 ?? ?? ?? ?? 6A 01 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 83 C4 10 }
          condition:
            uint16(0) == 0x5a4d and
            for any d in (1..#decode) : (
              uint8(@decode[d]+1) > 0 and uint32(@decode[d]+3) >= 128 and
              uint32(@decode[d]+3) <= filesize and
              for any x in (1..#xor) : (
                @decode[d]+17+int32(@decode[d]+13) == @xor[x]-30
              ) and
              for any w in (1..#write) : (
                @write[w] > @decode[d] and @write[w]-@decode[d] < 256 and
                uint32(@decode[d]+3) == uint32(@write[w]+9) and
                uint32(@decode[d]+8) == uint32(@write[w]+14)
              ) and
              for any o in (pe.rva_to_offset(uint32(@decode[d]+8)-pe.image_base)) : (
                o+uint32(@decode[d]+3) <= filesize and
                uint8(o) ^ uint8(@decode[d]+1) == 0x4d and
                uint8(o+1) ^ uint8(@decode[d]+1) == 0x5a and
                for any e in (uint32(o+60) ^ (uint8(@decode[d]+1)*0x01010101)) : (
                  e >= 64 and e+4 < uint32(@decode[d]+3) and
                  uint32(o+e) ^ (uint8(@decode[d]+1)*0x01010101) == 0x00004550
                )
              )
            )
        }
