# The COM entry calls the counted BX loop at offset 0x24. The loop XORs bytes
# from 0x013A through 0x1634 with the byte at 0x0108; the encoded find-first
# block decodes with that same key. This records decoding capability only.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, text]
  size_max: 65536

traits:
  - id: dos-memory-key-xor-decodes-search-body
    desc: DOS XOR loop decodes executable search code
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_memory_key_xor_decodes_search_body {
          meta:
            filetypes = "dos_com,data,text"
          strings:
            $entry = { E8 20 00 }
            $loop = { BB 3A 01 8A 27 90 32 26 08 01 88 27 90 43 81 FB 34 16 90 7E EE C3 }
            $body = "\xb9\x27\x00\xba\x3a\x01\xb4\x4e\xcd\x21" xor(1-255)
          condition:
            $entry at 1 and $loop at 0x24 and
            for any b in (1..#body) : (
              @body[b] > 0x24 and
              (uint8(@body[b]) ^ 0xb9) == uint8(8)
            )
        }
