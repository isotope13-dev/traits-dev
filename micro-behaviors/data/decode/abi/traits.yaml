defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, csharp, pe, dll]

traits:
  - id: abi-decoder-call
    desc: Calls an ABI decoder
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      # `abi` must end the name, optionally followed by viem-style
      # Parameters/Params. This excludes C++ ABI helpers such as parseAbiTags.
      regex: '(?i)^(decode|deserialize|parse|unpack)_?abi(_?param[a-z]{0,6})?$'
