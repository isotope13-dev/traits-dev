defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, csharp, pe, dll]

traits:
  - id: abi-decoder-call
    desc: Calls an ABI decoder
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      # `abi` must end the name, optionally followed by viem-style
      # Parameters/Params or by the decoded Solidity value type. This covers
      # hand-written resolver helpers such as decodeAbiString without widening
      # to C++ ABI helpers such as parseAbiTags.
      regex: '(?i)^(decode|parse|unpack)_?abi(_?(param(eter)?s?|string|bytes?|result|value))?$'
