# Custom Base64 quartet decoding — JavaScript/TypeScript
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: base64-character-index-loop
    desc: Base64 decoder indexes input characters
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.indexOf\s*\([^)]{0,40}\.charAt\s*\([^)]{0,30}\+\+\)'

  - id: base64-first-byte-shift
    desc: Base64 decoder emits first quartet byte
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.push\s*\([^;]{0,80}<<\s*2[^;]{0,80}>>\s*4\)'

  - id: base64-second-byte-shift
    desc: Base64 decoder emits second quartet byte
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.push\s*\([^;]{0,100}&\s*15\)[^;]{0,40}<<\s*4[^;]{0,80}>>\s*2\)'

  - id: base64-third-byte-shift
    desc: Base64 decoder emits third quartet byte
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.push\s*\([^;]{0,100}&\s*3\)[^;]{0,40}<<\s*6'

composite_rules:
  - id: custom-base64-quartet-byte-decoder
    desc: Custom Base64 quartet decoder emits bytes
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: base64-character-index-loop
      - id: base64-first-byte-shift
      - id: base64-second-byte-shift
      - id: base64-third-byte-shift
    unless:
      - id: metadata/package/testing/harness/runtime/
