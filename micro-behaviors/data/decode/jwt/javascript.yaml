defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: jwt-decode-call
    desc: Decodes JWT claims without verifying signatures
    # decode() parses claims; this observation alone is not an auth bypass.
    if:
      type: symbol
      kind: call
      regex: '^(jwt|jsonwebtoken)\.decode$'
