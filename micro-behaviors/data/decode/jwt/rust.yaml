defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: component
  conf: 0.85

composite_rules:
  - id: rust-jwt-claims-decode
    desc: Rust JWT claims decoding
    crit: notable
    conf: 0.9
    near_bytes: 500
    all:
      - id: micro-behaviors/data/string/split::rust-second-dot-segment
      - id: micro-behaviors/data/decode/base64::rust-base64-engine-decode
      - id: micro-behaviors/data/parse/json::rust-serde-json-parse
