defaults:
  platforms: [windows]
  # vbs: PowerShell staged inside VBScript string literals.
  for: [batch, powershell, vbs]
  crit: notable
traits:
  - id: powershell-convert-tochar
    desc: PowerShell Convert.ToChar character conversion
    conf: 0.98
    if:
      type: text
      regex: '(?i)\[Convert\]::ToChar\(\$\w+\)'
  # Bounded reconstruction context; this does not assert the two variables alias.
  - id: powershell-cyclic-subtraction-character-decoder
    desc: ToChar near cyclic key subtraction
    conf: 0.95
    if:
      type: text
      regex: '(?is)\[Convert\]::ToChar\(\$\w+\).{0,900}\+=-\$\w+\[\$\w+%%?\$\w+\]'
  # Modulo is assigned, then the key byte is subtracted in place. Spaces
  # around assignment operators are common in formatted PowerShell source.
  - id: powershell-modulo-index-key-subtraction
    desc: Modulo indexing near indexed key subtraction
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$\w+\s*=\s*\$\w+%\$\w+;\s*\$\w+\[\$\w+\]=\$\w+\[\$\w+\]-\$\w+\[\$\w+\]'
  - id: powershell-indexed-element-subtraction
    desc: In-place subtraction on array element
    conf: 0.92
    if:
      type: text
      regex: '(?i)\$\w+\[\$\w+\]\s*(-=|=\s*\$\w+\[\$\w+\]\s*-)\s*\$\w+'
  - id: powershell-indexed-element-append-increment
    desc: Appends converted element with post-increment
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\+=\s*\w+\(\$\w+\[\$\w+\+\+\]\)'
composite_rules:
  # Indexed form: each array element has a key element subtracted in place
  # and the result is passed to a converter whose output is appended.
  - id: powershell-indexed-key-subtraction-append
    desc: Subtracts key element, appends converted value
    conf: 0.93
    near_bytes: 300
    all:
      - id: powershell-indexed-element-subtraction
      - id: powershell-indexed-element-append-increment
  - id: powershell-indexed-key-subtraction-character-decoder
    desc: ToChar with indexed key-subtraction append
    conf: 0.95
    all:
      - id: powershell-convert-tochar
      - id: powershell-indexed-key-subtraction-append
