# Hand-written Base64 decoder that also converts Windows-1251 bytes to
# Unicode code points: bytes >= 192 get +848 (А..я), 168 -> 1025 (Ё) and
# 184 -> 1105 (ё). Inline copies of this routine are a long-running way to
# smuggle markup or script into a page as a Base64 literal; the remap is
# what distinguishes it from an ordinary atob() shim.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.92
traits:
  - id: cp1251-byte-unicode-remap
    desc: Remaps cp1251 byte values to Unicode
    if:
      type: text
      regex: '\+=\s*848;\s*else\s+if\s*\(\s*\w+\s*==\s*168\s*\)\s*\w+\s*=\s*1025'
