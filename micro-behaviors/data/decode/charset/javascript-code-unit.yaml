defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: fromcharcode-call
    desc: Builds characters with String.fromCharCode
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: fromCharCode
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/build/minifier::js-large-minified-bundle
      # Monaco's generated editor runtime reconstructs Unicode code points as
      # part of its parser tables; this is library identity, not a decoder.
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle

  - id: multiple-fromcharcode-calls
    desc: Calls String.fromCharCode multiple times
    crit: notable
    conf: 0.92
    count_min: 2
    if:
      id: micro-behaviors/data/decode/charset::fromcharcode-call
  - id: fromcharcode-text-in-large-source
    desc: fromCharCode text in large unparsed source
    crit: notable
    conf: 0.9
    size_min: 100000
    if:
      type: text
      substr: String.fromCharCode(
    unless:
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle

  - id: fromcharcode-call-text
    desc: Oversized source calls String.fromCharCode
    crit: notable
    conf: 0.9
    size_min: 1000000
    # Large JavaScript files may be intentionally left unparsed by the source
    # extractor. Preserve the same capability detection from source text,
    # including bracket notation used to evade dot-notation scans.
    if:
      type: text
      regex: 'String(\.fromCharCode|\[\s*["'']fromCharCode["'']\s*\])\s*\([^;\n]{1,240}\)'
    unless:
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle

  - id: fromcharcode-member-reference
    desc: References the String.fromCharCode member
    crit: notable
    conf: 0.9
    # Parsed member evidence distinguishes executable references and aliases
    # from API examples in comments, such as Lodash documentation snippets.
    if:
      type: symbol
      kind: member
      exact: String.fromCharCode
    unless:
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/ui/monaco-editor::monaco-editor-main-bundle
