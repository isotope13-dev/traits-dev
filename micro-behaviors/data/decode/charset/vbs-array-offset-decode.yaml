# VBScript decoders that rebuild a string from a numeric array by shifting each
# element with a key before Chr(): the array is inert numbers until decoded.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.85
  attack: T1027,T1140
traits:
  - id: vbs-numeric-array-literal
    desc: Long numeric Array literal in VBScript
    if:
      type: text
      regex: '(?i)=\s*Array\(\s*(\d{2,5}\s*,\s*){40,}'

  - id: vbs-chr-array-element-minus-key
    desc: VBScript Chr of array element minus key
    if:
      type: text
      regex: '(?i)Chr\(\s*\w+\(\w+\)\s*-\s*\(?\w+\)?\s*\)'

  - id: vbs-execute-decoded-variable
    desc: VBScript Execute of a built string variable
    if:
      type: text
      regex: '(?im)^\s*Execute\s+\w+\s*$'
