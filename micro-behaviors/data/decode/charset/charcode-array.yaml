defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: charcode-spread-array-decoder
    desc: Spread fromCharCode array decoder helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'String\.fromCharCode\(\.\.\.\s*\[[\d,\s]+\]'

  # Decimal character-code runs that spell protocol keywords. Forks hide
  # method names and identifiers from static scans by building them from
  # numeric arrays (`a.map(v => String.fromCharCode(v)).join('')`), so the
  # words below never appear as text. Each run is matched in full: the
  # numbers spell `newsletter`, `Follow`, and `Mute` respectively, and the
  # comma-separated form is the only spelling a JS array or argument list
  # accepts. Word meaning comes from the composites that reference these.
  - id: charcode-run-spells-newsletter
    desc: Char-code run spells newsletter
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b110,\s*101,\s*119,\s*115,\s*108,\s*101,\s*116,\s*116,\s*101,\s*114\b'

  - id: charcode-run-spells-follow
    desc: Char-code run spells Follow
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b70,\s*111,\s*108,\s*108,\s*111,\s*119\b'

  - id: charcode-run-spells-mute
    desc: Char-code run spells Mute
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b77,\s*117,\s*116,\s*101\b'

