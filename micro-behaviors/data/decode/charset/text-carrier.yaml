defaults:
  for: [text, html]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: fromcharcode-text-carrier
    desc: String.fromCharCode call in source text
    if:
      type: text
      substr: String.fromCharCode(
  # A fromCharCode call with two dozen or more numeric codes is not building
  # a word like "eval" -- it defines a substitution alphabet the surrounding
  # decoder indexes per character ($tbl[17]). Ordinary string building stays
  # below the count.
  - id: charcode-substitution-alphabet
    desc: fromCharCode table with dozens of codes
    conf: 0.9
    if:
      type: text
      regex: 'String\.fromCharCode\(\s*\d+\s*(,\s*\d+\s*){23,}\)'
