defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: indexed-charcode-array-decode
    desc: Builds characters from indexed array values
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'String\.fromCharCode\s*\(\s*\w+\[\s*\w+\s*\]\s*\)'
      exclude_html_comments: true
