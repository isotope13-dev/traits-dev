# EBCDIC code pages (IBM mainframe charsets) map ASCII-range letters to
# high-bit bytes: "eval" in cp1026 is b'\x85\xa5\x81\x93'. Decoding an escaped
# bytes literal through one turns an unreadable byte string back into source
# text. Mainframe data converters decode file or network buffers instead.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-ebcdic-escaped-bytes-literal-decode
    desc: Decodes escaped bytes literal with EBCDIC codec
    conf: 0.9
    if:
      type: text
      regex: 'b["'']\\x[0-9a-fA-F]{2}[^"''\n]{0,400}["'']\.decode\(\s*["'']cp(1026|500|037|875)["'']\s*\)'
