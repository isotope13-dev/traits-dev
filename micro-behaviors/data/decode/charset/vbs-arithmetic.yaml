defaults:
  for: [vbs, html]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: vbs-chr-decimal-minus-hex
    desc: Builds characters by subtracting hex constants
    if:
      type: text
      regex: '(?i)\bchr\(\d{1,5}-\(&H[0-9a-f]{1,5}\)\)'
  - id: vbs-chr-variable-subtraction
    desc: VBScript Chr converts a variable subtraction
    if:
      type: text
      regex: '(?i)\bChr[Ww]?\s*\(\s*[A-Za-z_]\w*\s*-\s*[A-Za-z_]\w*\s*\)'
  # The sibling atoms match the subtraction inside the Chr() call. Packers
  # instead assign `code = 366 - &H128` per character and feed the variables
  # to ChrW() later, so no subtraction ever appears inside a call. The
  # decimal-minus-hex assignment is the same idiom one step removed.
  - id: vbs-assigned-charcode-arithmetic
    desc: Assigns decimal-minus-hex character codes
    if:
      type: text
      regex: '(?i)\b\w+\s*=\s*\d{1,5}\s*-\s*&H[0-9a-f]{1,5}\b'
  - id: vbs-assigned-arithmetic-expression
    desc: Assigns multi-term arithmetic expression
    crit: notable
    conf: 0.92
    count_min: 5
    if:
      type: text
      regex: '(?i)\b[a-z_]\w*\s*=\s*-?\d+\s*[+\-*/]\s*\d+\s*[+\-*/]'

  - id: vbs-variable-chr-assignment
    desc: Assigns Chr of variable
    crit: notable
    conf: 0.92
    count_min: 5
    if:
      type: text
      regex: '(?i)\b[a-z_]\w*\s*=\s*chr\s*\(\s*[a-z_]\w*\s*\)'

