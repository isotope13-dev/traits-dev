defaults:
  platforms: [windows, unix]
  for: [pe, dll]
traits:
  # CIL call records carry the fully qualified target. GetString decodes a
  # byte buffer into text; what those bytes are is established by consuming
  # composites.
  - id: cil-encoding-getstring-call
    desc: Calls .NET Encoding.GetString
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: System.Text.Encoding.GetString
