# Character-set decoding: turning bytes into text through a codec. This is not
# payload decoding -- no data is concealed by being latin-1 -- so these traits
# live apart from micro-behaviors/data/decode/encoded/formats, whose members
# feed the anti-static "decodes and executes" composites. PEP 3333 mandates
# latin-1 for WSGI header bytes, which puts one of these in every WSGI shim.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-latin1-decode-call
    desc: Python latin-1 bytes decode call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.decode\s*\(\s*["'']latin-1["'']\s*\)'
