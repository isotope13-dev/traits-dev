defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  # The API supports several text encodings. Its name does not establish
  # Base64, encryption, or a particular payload; flags determine the format.
  - id: crypt-string-to-binary-name
    desc: CryptStringToBinary decoding API name reference
    if:
      type: text
      regex: '^CryptStringToBinary[AW]$'
    unless:
      - type: symbol
        regex: '^CryptStringToBinary[AW]$'
