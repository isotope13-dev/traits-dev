defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: gunzip-tool
    desc: Invokes the gunzip decompression tool
    if:
      type: symbol
      exact: gunzip
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: bunzip2-tool
    desc: bunzip2 tool reference
    if:
      type: symbol
      exact: bunzip2
