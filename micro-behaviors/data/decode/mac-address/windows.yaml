# RtlEthernetStringToAddress parses text; alone it is ordinary networking.
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: rtl-ethernet-string-to-address-call
    desc: Parses MAC address text into bytes
    if:
      type: symbol
      kind: call
      regex: '^RtlEthernetStringToAddress[AW]$'
