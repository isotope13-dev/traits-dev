defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala, html, javascript, python, vbs]

traits:
  # Legacy JSP shells resolve sun.misc.BASE64Decoder by name, while newer
  # variants resolve java.util.Base64 and invoke its decoder reflectively.
  - id: java-reflective-base64-decoder
    desc: Reflective Java Base64 decoder lookup
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Class\.forName\s*\(\s*["''](sun\.misc\.BASE64Decoder|java\.util\.Base64)["'']\s*\)'
