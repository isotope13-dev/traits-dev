defaults:
  platforms: [unix, windows]
  for: [python, shell, php, javascript, typescript, text, html]

traits:
  - id: echo-pipe-base64-decode
    desc: Echoed data piped into base64 decoder
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\|\s*echo\b[^|\n&;]{0,120}\|\s*base64\s+(-[dD]|--decode)\b'

