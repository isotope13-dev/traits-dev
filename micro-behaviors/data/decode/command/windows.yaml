defaults:
  platforms: [windows]
  # scripts + source (not just go/batch/powershell) so a certutil -decode
  # staged in a Ruby/Python/JS/shell dropper or generator carries the native
  # decode observation regardless of the language it was written in.
  for: [scripts, source, pe]
  attack: T1140
  mbc: C0026

traits:
  - id: certutil-decode-command
    desc: certutil file decoding command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bcertutil(\.exe)?\s+-decode\b'
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: certutil-decodes-powershell-script
    desc: certutil decodes a PowerShell script
    crit: notable
    conf: 0.97
    if:
      type: literal
      regex: '(?i)\bcertutil(\.exe)?\s+-decode\b[^\r\n]{1,160}\.ps1\b'
