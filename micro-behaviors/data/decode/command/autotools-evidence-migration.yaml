defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: eval-transform-decompress-pipeline
    desc: Mapped shell pipeline to a decode option
    crit: suspicious
    conf: 0.99
    for: [shell, text]
    if:
      type: text
      regex: 'sed.{0,80}eval\s+\$gl_path_map\s*\|\s*\$gl_[^\s]{1,24}_prefix\s+-d'
