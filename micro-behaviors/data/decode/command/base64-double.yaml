defaults:
  platforms: [unix, windows]

traits:
  - id: double-base64-decode
    desc: Two consecutive Base64 decode commands
    crit: notable
    conf: 0.8
    for: [shell, applescript, makefile, github-actions]
    if:
      type: text
      regex: '\|\s*base64\s+(-d|--decode)\b[^|\n;&]{0,50}\|\s*base64\s+(-d|--decode)\b'
