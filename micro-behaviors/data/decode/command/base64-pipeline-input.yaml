defaults:
  platforms: [unix, windows]
  for: [shell, applescript, text, python, github-actions]
  crit: notable
  conf: 0.95

traits:
  # A bare `base64 -d | bash` in a policy comment names a risky command;
  # it does not supply executable content to the decoder.
  - id: base64-local-pipeline-input
    desc: Local command feeds base64 decoder
    if:
      type: text
      regex: '\b(echo|printf|cat)\b[^|\n]{1,160}\|\s*base64\s+(-[dD]|--decode)\b'

    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/file/format/news::serialized-news-article-catalog
      # The next line after "blocked" is the gate's documented example.
      - id: micro-behaviors/os/security/command-policy::python-doc-blocked-decode-example
  - id: curl-base64-pipeline-input
    desc: curl output feeds base64 decoder
    if:
      type: text
      regex: '\bcurl\b[^|\n]{1,160}\|\s*base64\s+(-[dD]|--decode)\b'

  - id: literal-base64-decoder-input
    desc: Literal Base64 input piped to a decoder
    crit: component
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^[ \t]*echo[ \t]+["'']?[A-Za-z0-9+/]{14,}={0,2}["'']?[ \t]*\|[ \t]*base64\b'

composite_rules:
  - id: literal-base64-pipeline
    desc: Literal Base64 input near a shell pipeline
    crit: component
    conf: 0.9
    for: [shell]
    near_lines: 1
    all:
      - id: literal-base64-decoder-input
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::base64-input-shell-execution

  - id: base64-pipeline-input
    desc: Supplies data to a base64 decoding pipeline
    any:
      - id: base64-local-pipeline-input
      - id: curl-base64-pipeline-input
    # Embedded linter reference examples do not supply runtime input.
    unless:
      - id: metadata/package/documentation/claims::lint-decoded-shell-example-context
      - id: metadata/package/documentation/page::documentation-web-page
