defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.6

traits:
  # `base64 -d ... > /tmp/run.sh` — a decode command whose output is staged as
  # a file rather than piped onward. Ordinary by itself (fixtures, keys,
  # embedded assets), so it stays a plain observation; the destination is what
  # a composite needs to pair with an execution of that same path.
  #
  # Declared for the script carriers too, not just shell: a decode command
  # embedded in a JavaScript CI action is still a decode command, and the
  # outer file's extension says nothing about what the string does. That is
  # the same reasoning `eval-user-input` records for PHP inside .js.
  - id: base64-decode-to-file
    desc: Base64 decode redirected into a file
    conf: 0.9
    for: [shell, github-actions, javascript, typescript, python, text, batch]
    if:
      type: text
      regex: 'base64\s+(-d|-D|--decode).{0,60}>\s*[~./]\S{1,60}'

  - id: python-inline-decode-command
    desc: Python inline command decodes encoded data
    conf: 0.85
    if:
      type: text
      regex: '\bpython[23]?\s+-c\s+.{0,200}(fromhex|b64decode|rot[_-]?13|\[::\s*-\s*1\])'

  - id: od-decode-command
    desc: od command invoked with option flags
    if:
      type: text
      regex: '\bod\s+-'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
