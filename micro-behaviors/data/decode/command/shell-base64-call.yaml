defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-base64-decode-call
    desc: Invokes Base64 decoder command
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '^(/(usr/)?bin/)?base64$'
      arg:
        kind: identifier
        name_regex: '^(-[dD]|--decode)$'
