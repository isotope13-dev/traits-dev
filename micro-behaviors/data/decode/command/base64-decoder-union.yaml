defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source, documents, data, manifests, build, media, archives, asp, jsp]
composite_rules:
  - id: base64-api-or-command
    desc: Base64 decoder API or command
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/decode/base64
      - id: micro-behaviors/data/decode/command::double-base64-decode
      - id: micro-behaviors/data/decode/command::openssl-base64-decode-command
      - id: micro-behaviors/data/decode/command::base64-local-pipeline-input
      - id: micro-behaviors/data/decode/command::curl-base64-pipeline-input
      - id: micro-behaviors/data/decode/command::base64-pipeline-input
      - id: micro-behaviors/data/decode/command::base64-decode-command-option
      - id: micro-behaviors/data/decode/command::kubernetes-secret-pipeline
      - id: micro-behaviors/data/decode/command::base64-decode-command
      - id: micro-behaviors/data/decode/command::base64-pipe-perl-decrypt
