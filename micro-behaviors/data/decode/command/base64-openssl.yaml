# Match an actual OpenSSL call, excluding comments and quoted command examples.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: openssl-base64-decode-command
    desc: OpenSSL Base64 decoding command
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @name) @decode
          (#eq? @name "openssl")
          (#match? @decode "^openssl[ \t]+(base64|enc)([ \t]|$)")
          (#match? @decode "[ \t]-d([ \t]|$)")
          (#match? @decode "^openssl[ \t]+base64|[ \t]-(base64|a)([ \t]|$)"))
