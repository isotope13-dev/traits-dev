defaults:
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: autotools-encoded-carrier-decoding-clues
    desc: Autotools-style encoded carrier decoding clues
    crit: suspicious
    conf: 0.995
    for: [shell, text]
    all:
      - id: metadata/lang/source/literal/string/shape::encoded-sentinel-search
      - id: micro-behaviors/data/string/transform::carrier-suffix-command
      - id: micro-behaviors/data/string/transform::custom-character-permutation
      - id: micro-behaviors/data/decode/command::eval-transform-decompress-pipeline
