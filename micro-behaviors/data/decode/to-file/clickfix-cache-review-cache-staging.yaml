defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch]


traits:
  - id: certutil-decode-temp
    desc: Certutil decode and TEMP path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcertutil(\.exe)?\b.{0,100}-decode.{0,100}%TEMP%'

composite_rules:
  - id: certutil-temp-script-decode-clues
    desc: Certutil TEMP decoding and staged script path clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/to-file::certutil-decode-temp
      - id: micro-behaviors/fs/path/script::windows-staged-script-path
    near_bytes: 512
