defaults:
  platforms: [windows]
  for: [html]

traits:
- id: certutil-force-decode-command
  desc: certutil force decode command
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\bcertutil(\.exe)?\s+-f\s+-decode\b'

- id: certutil-decodes-vbscript-file
  desc: Certutil decodes content into a VBS file
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\bcertutil(\.exe)?\s+-decode\b[^\r\n<>|]{1,100}\.vbs\b'

composite_rules:
- id: certutil-force-or-vbs-decode
  desc: Certutil forcibly decodes or writes a VBScript payload
  crit: notable
  conf: 0.95
  any:
  - id: certutil-force-decode-command
  - id: certutil-decodes-vbscript-file

