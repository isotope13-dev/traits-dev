defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1140

traits:
  - id: lnk-variable-fragment-certutil-decode
    desc: Variable fragment splits certutil before -decode
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bce\^?[%!][A-Za-z_][A-Za-z0-9_]*[%!]\s*tutil(\.exe)?[^\r\n]{0,160}\s+-decode\b'
