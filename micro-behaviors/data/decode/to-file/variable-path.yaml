defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
traits:
  # `... | base64 -d > "$W"`: the decoded bytes land at a path held in a
  # variable, the usual first half of a decode-then-run dropper.
  - id: base64-decode-to-variable-path
    desc: Base64 decode written to a variable path
    if:
      type: text
      regex: 'base64\s+(-d|-D|--decode)\b[^\n|;&]{0,24}>\s*["'']?\$\{?[A-Za-z_]\w*'
  # Go: bytes from a Base64/hex decode reach os.WriteFile's data argument.
  - id: go-decoded-bytes-written-to-file
    desc: Go writes decoded bytes to a file
    for: [go]
    platforms: [unix, windows]
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(os|ioutil)\.WriteFile$'
      arg:
        index: 1
        from:
          call: '(^|/)(base64\.\w+|hex)\.DecodeString$'
