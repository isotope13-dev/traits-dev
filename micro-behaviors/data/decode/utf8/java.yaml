defaults:
  platforms: [unix, windows, android]
  for: [java]
  crit: notable
  conf: 0.99

traits:
  - id: java-string-utf8-decoder
    desc: String constructor decodes UTF-8 bytes
    if:
      type: tree-sitter
      query: |-
        ((object_creation_expression type: (type_identifier) @type
          arguments: (argument_list (_)
            (field_access object: (identifier) @charset
              field: (identifier) @encoding))) @decode
          (#eq? @type "String")
          (#eq? @charset "StandardCharsets")
          (#eq? @encoding "UTF_8"))
