defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: buffer-concat-utf8-decode
    desc: Decodes concatenated Node buffers as UTF-8
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @concat))
            property: (property_identifier) @decode)
          arguments: (arguments . (string (string_fragment) @encoding) .)
          (#eq? @buffer "Buffer")
          (#eq? @concat "concat")
          (#eq? @decode "toString")
          (#match? @encoding "^utf-?8$"))

  - id: textdecoder-default-utf8-constructor
    desc: Initializes a default UTF-8 decoder
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((new_expression
          constructor: (identifier) @constructor
          arguments: (arguments) @arguments) @decoder
         (#eq? @constructor "TextDecoder")
         (#match? @arguments "^\\(\\s*\\)$"))

  - id: textdecoder-utf8-decode
    desc: Decodes bytes as UTF-8 with TextDecoder
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'new\s+TextDecoder\s*\(\s*["'']utf-8["'']\s*\)\s*\.decode\s*\('

  - id: textdecoder-bracket-decode-call
    desc: TextDecoder decode via bracket access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'new\s+TextDecoder\s*\(\s*\)\s*\[\s*["'']decode["'']\s*\]\s*\('

  - id: textdecoder-uint8-alias
    desc: Aliases TextDecoder beside Uint8Array
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\.TextDecoder\b[\s\S]{0,80}Uint8Array'

  - id: multibyte-typedarray-array-init
    desc: Initializes multi-byte TypedArray from array
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.)?(Uint(16|32)|Int(16|32)|Float(32|64))Array$'
      arg:
        index: 0
        kind: array

  - id: uint8array-constructor-call
    desc: Constructs a Uint8Array byte view
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.)?Uint8Array$'

  - id: textdecoder-constructor-call
    desc: Invokes the TextDecoder constructor
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.)?TextDecoder$'

  - id: textdecoder-decode-method-call
    desc: Calls a decode method in JavaScript
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)decode$'

  - id: html-typedarray-textdecoder-decode
    desc: HTML decodes packed TypedArray via TextDecoder
    crit: notable
    conf: 0.94
    for: [html]
    if:
      type: text
      exclude_html_comments: true
      regex: 'TextDecoder\([^)]{0,9}\)\.decode\([^;\n]{0,40}(16|32|64)Array'

composite_rules:
  # The Base64-bytes-to-text half of a decode chain. On its own this is the
  # standard idiom for reading any binary-encoded field -- a JWS payload, a
  # protobuf, a data: URL -- so it stays notable; the loaders that care about
  # it supply the obfuscation evidence from their own legs.
  - id: textdecoder-utf8-after-byte-decode
    desc: TextDecoder renders Base64-decoded bytes
    crit: notable
    conf: 0.84
    near_bytes: 200
    all:
      - id: textdecoder-utf8-decode
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text

  - id: js-typedarray-buffer-utf8-decode
    desc: Unpacks multi-byte TypedArray literal as UTF-8 text
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 450
    all:
      - id: multibyte-typedarray-array-init
      - id: uint8array-constructor-call
      - id: textdecoder-constructor-call
      - id: textdecoder-decode-method-call

  - id: typedarray-buffer-utf8-decode
    desc: Decodes packed multi-byte TypedArray bytes as UTF-8
    crit: notable
    conf: 0.94
    any:
      - id: js-typedarray-buffer-utf8-decode
      - id: html-typedarray-textdecoder-decode
