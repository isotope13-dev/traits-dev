defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: base64-buffer-default-text
    desc: Base64 buffer converted to default UTF-8 text
    conf: 0.95
    if:
      type: text
      regex: 'Buffer\.from\(\s*[A-Za-z_$][\w$]*\s*,\s*["'']base64["'']\s*\)\.toString\(\)'
