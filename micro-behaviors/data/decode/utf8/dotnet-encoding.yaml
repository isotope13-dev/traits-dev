# .NET Encoding.GetString byte-to-string conversion in PowerShell and LNK
# command lines. Bare .GetString($bytes) in PowerShell source is baseline
# syntax; in a Windows shortcut's command-line arguments it is notable.
defaults:
  platforms: [windows, unix]
  for: [powershell, batch, lnk]

traits:
  - id: dotnet-encoding-getstring-text
    desc: Calls .NET Encoding.GetString on bytes
    crit: baseline
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bEncoding\]::(UTF8|ASCII|Unicode|Default)\.GetString\s*\('

  - id: lnk-arg-dotnet-encoding-getstring
    desc: Shortcut arguments call Encoding.GetString
    platforms: [windows]
    for: [lnk]
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bEncoding\]::(UTF8|ASCII|Unicode|Default)\.GetString\s*\('

composite_rules:
  - id: dotnet-encoding-getstring
    desc: Converts byte array to string via GetString
    crit: baseline
    conf: 0.9
    any:
      - id: dotnet-encoding-getstring-text
      - id: lnk-arg-dotnet-encoding-getstring
