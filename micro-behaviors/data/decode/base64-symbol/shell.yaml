defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  # A bare `base64` command says nothing about direction: `... | base64` encodes
  # just as often as it decodes. Kept as a baseline capability marker, but
  # deliberately not part of the base64-decoding composite -- the decode-flag
  # traits above carry that claim.
  - id: base64-tool
    desc: base64 command-line tool reference
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      exact: base64
