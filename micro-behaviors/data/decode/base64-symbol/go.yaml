defaults:
  crit: notable
traits:
  - id: go-base64-decode
    platforms: [windows, linux, macos]
    for: [elf, macho, pe, wasm]
    desc: Go binary embeds a base64 decoder symbol
    conf: 0.7
    if:
      type: text
      regex: '\.Decode(String|dLen)|AppendDecode'
  - id: std-encoding-decode-string
    platforms: [unix, windows]
    for: [go]
    desc: base64.StdEncoding.DecodeString (Go)
    if:
      type: symbol
      substr: 'base64.StdEncoding.DecodeString'
  - id: raw-std-encoding-decode-string
    platforms: [unix, windows]
    for: [go]
    desc: base64.RawStdEncoding.DecodeString (Go)
    if:
      type: symbol
      substr: 'base64.RawStdEncoding.DecodeString'
  - id: url-encoding-decode-string
    platforms: [unix, windows]
    for: [go]
    desc: base64.URLEncoding.DecodeString (Go)
    if:
      type: symbol
      substr: 'base64.URLEncoding.DecodeString'
  - id: raw-url-encoding-decode-string
    platforms: [unix, windows]
    for: [go]
    desc: base64.RawURLEncoding.DecodeString (Go)
    if:
      type: symbol
      substr: 'base64.RawURLEncoding.DecodeString'
  - id: std-encoding-decode
    platforms: [unix, windows]
    for: [go]
    desc: base64.StdEncoding.Decode (Go)
    if:
      type: symbol
      substr: 'base64.StdEncoding.Decode'
  - id: new-decoder
    platforms: [unix, windows]
    for: [go]
    desc: base64.NewDecoder (Go)
    if:
      type: symbol
      substr: 'base64.NewDecoder'
