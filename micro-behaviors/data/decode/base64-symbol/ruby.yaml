# Base64 Decoding — Ruby
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
traits:
  - id: ruby-require-base64
    desc: Ruby imports the Base64 library
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        kind: string
        exact: base64
