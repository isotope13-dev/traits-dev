defaults:
  platforms: [unix, fortios]
  for: [shell]
traits:
  - id: shell-three-base64-decode-pipeline
    desc: Shell pipelines three Base64 decodes
    crit: suspicious
    conf: 0.9
    if:
      # Independent `base64 -d` calls (if/elif branches, commented alternatives,
      # Kubernetes Secret field unpacking) are ordinary.  Multilayer stagers
      # pipe decode into decode on one command; require that pipeline shape.
      type: text
      regex: 'base64\s+-d[^;\n]{0,80}\|[^;\n]{0,100}base64\s+-d[^;\n]{0,80}\|[^;\n]{0,100}base64\s+-d'

