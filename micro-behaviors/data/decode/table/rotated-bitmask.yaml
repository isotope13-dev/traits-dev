defaults:
  platforms: [windows, unix]
  for: [scripts, source]
composite_rules:
  # A keyed alphabet need not carry a prefix bitmask. Keep that optional
  # format refinement separate from the general table/packing observation.
  - id: rotated-b64-table-decoder
    desc: Hex table with modular remapping and six-bit byte packing
    crit: notable
    conf: 0.92
    near_lines: 50
    all:
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: modulo-64-table-rotation
      - id: quartet-6bit-byte-pack-shifts

  - id: rotated-b64-table-bitmask-decoder
    desc: Decodes strings via rotated 64-byte table and bitmask
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/source/literal/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/decode/table::modulo-64-table-rotation
      - id: micro-behaviors/data/decode/table::quartet-6bit-byte-pack-shifts
      - id: micro-behaviors/data/decode/table::bitmask-high-bit-restore

