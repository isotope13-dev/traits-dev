# Base64 alphabet tables and the codecs built around them.
#
# Swapping the RFC 4648 table for a private ordering keeps a payload readable
# to its own decoder while making it opaque to every off-the-shelf base64
# tool and to string-extraction triage. The table alone is only partial
# evidence; the codec constructor, or the translation back onto the standard
# table, is what shows it is in use.
defaults:
  platforms: [windows, linux, macos]
  attack: T1027
  mbc: C0026

traits:
  # Regex cannot prove that all 64 characters are distinct, so require either
  # a Base64 codec constructor or an alphabet-named assignment. A bare
  # 64-character ciphertext is payload data, not an alphabet table.
  - id: nonstandard-base64-alphabet
    desc: Defines or passes custom Base64 alphabet
    crit: notable
    conf: 0.9
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)(NewEncoding\(\s*|\w*alphabet\w*\s*[:=]+\s*)[''"][A-Za-z0-9+/]{64}'
    not:
      - regex: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\+/'
      - regex: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\+/'

  # base64.NewEncoding exists only to build a codec around a caller-supplied
  # alphabet; the stock tables are reached through the StdEncoding and
  # URLEncoding package variables instead.
  - id: go-base64-custom-alphabet-codec
    desc: Builds a Base64 codec from custom alphabet
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      exact: 'base64.NewEncoding'

  - id: python-maketrans-table
    desc: Builds a str.maketrans translation table
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: symbol
      regex: '(^|\.)maketrans$'

  - id: go-crc32-seed-call
    desc: Computes a CRC32 alphabet seed
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      regex: '(^|\.)ChecksumIEEE$'

composite_rules:
  - id: go-dynamic-base64-alphabet
    desc: CRC32-seeded Base64 alphabet permutation
    crit: suspicious
    conf: 0.93
    for: [go]
    all:
      - id: go-base64-custom-alphabet-codec
      - id: go-crc32-seed-call
      - id: micro-behaviors/os/random/prng/stdlib::go-new-source-call
      - id: micro-behaviors/os/random/prng/stdlib::go-intn-method-call

  # Remapping a private ordering onto the RFC 4648 table right before
  # b64decode is how a custom-alphabet payload is unwrapped with the stdlib
  # decoder: the blob never decodes with off-the-shelf tooling, yet the code
  # only ever calls base64.b64decode.
  - id: python-alphabet-substitution-decode
    desc: Remaps an alphabet onto standard Base64
    crit: suspicious
    conf: 0.9
    for: [python]
    all:
      - id: python-maketrans-table
      - id: micro-behaviors/data/decode/base64::standard-base64-alphabet-table
    any:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/decode/base64::b64decode-string
    needs: 1
