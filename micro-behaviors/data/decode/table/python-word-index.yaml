defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-index-modulo-byte-stream
    desc: Reconstructs bytes from table indices modulo 256
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      kind: call
      regex: '\bbytes\s*\(\s*\w{1,40}\.index\(\w{1,40}\)\s*%\s*256\s+for\s+\w{1,40}\s+in\s+\w{1,40}\s*\)'
