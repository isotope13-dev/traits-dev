# Six-bit offset-table stream unpacking in JavaScript and HTML scripts.
# Keep these capability rules neutral on their own; concealment and dynamic
# evaluation context are supplied by obfuscation and execution composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, text]
  crit: notable
  attack: T1140
  mbc: C0026

traits:
  - id: js-offset-table-charcode-index
    desc: Indexes offset table by character code
    conf: 0.94
    if:
      type: text
      regex: '[\w$]+\[\s*[\w$]+\.charCodeAt\s*\([^)]{1,24}\)\s*-\s*\d{1,3}\s*\]'

  - id: js-table-entry-variable-shift-or
    desc: Packs table bits into shift accumulator
    conf: 0.95
    if:
      type: text
      regex: '\|=\s*\(?[\w$]+\[[^\];\r\n]{1,64}\]\s*\)?\s*<<\s*[\w$]+'

  - id: js-byte-accumulator-drain-shift
    desc: Drains byte from six-bit accumulator
    conf: 0.95
    if:
      type: text
      regex: '>>=\s*8\s*;\s*[\w$]+\s*-=\s*2\b'

composite_rules:
  - id: js-six-bit-table-byte-unpacker
    desc: Unpacks six-bit offset-table byte stream
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: js-offset-table-charcode-index
      - id: js-table-entry-variable-shift-or
      - id: js-byte-accumulator-drain-shift
