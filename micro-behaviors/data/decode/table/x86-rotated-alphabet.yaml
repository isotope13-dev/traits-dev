defaults:
  platforms: [windows]
  for: [data]
traits:
  # Table substitution: add the rotation to a found index, mask to 64 entries,
  # load the replacement byte and store it into the input buffer.
  - id: x86-rotated-alphabet-substitution
    desc: x86 substitutes bytes through a rotated alphabet
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: '8B 54 24 ?? 8B 44 24 ?? 01 D0 83 E0 3F 0F B6 44 04 ?? 8B 54 24 ?? 81 C2 ?? ?? ?? ?? 88 02 EB ??'
