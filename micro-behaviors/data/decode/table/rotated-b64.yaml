defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  attack: T1140
  mbc: C0026

traits:
  - id: modulo-64-table-rotation
    desc: Remaps table slots through a modulo-64 offset
    conf: 0.92
    if:
      type: text
      regex: '\w+\[\w+\]\s*=\s*\w+\[\s*\(\s*\w+\s*\+[^;\n]{1,28}%\s*64\s*\]'

  - id: quartet-6bit-byte-pack-shifts
    desc: Packs 6-bit quartet values into bytes
    conf: 0.95
    if:
      type: text
      regex: '<<\s*2\s*\)?\s*[|+]\s*\(?[^;\n]{1,28}>>\s*4[\s\S]{1,80}<<\s*4\s*\)?\s*[|+]'

  - id: bitmask-high-bit-restore
    desc: Restores byte MSB from prefix bitmask
    conf: 0.95
    if:
      type: text
      regex: '0x7[Ff]\s*\)?\s*(:|\}\s*else\s*\{)[^;\n]{1,32}\|\s*0x80'
