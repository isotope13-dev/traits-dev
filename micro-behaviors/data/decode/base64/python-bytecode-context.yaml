defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: pyc-base64-crypto-or-memory-context
    desc: Python bytecode names Base64 decoding with cipher or memory-protection context
    crit: component
    conf: 0.8
    all:
      - id: metadata/lang/source/naming/resource::b64decode-string
    any:
      - id: micro-behaviors/crypto/library/keyword::pyc-cipher-name
      - id: micro-behaviors/mem/protect/modify::pyc-virtualprotect-name
