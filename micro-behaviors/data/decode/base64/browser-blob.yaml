defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: base64-to-blob-text-sequence
    desc: Base64 decode precedes Blob construction
    # Generic browser data operation: export/font/image code in any web bundle
    # decodes base64 into a Blob (a diagramming library did, twice). Delivery
    # intent exists only in the composite chain below.
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?is)\batob\s*\([^)]{1,120}\)[\s\S]{0,420}\bnew\s+Blob\s*\('
