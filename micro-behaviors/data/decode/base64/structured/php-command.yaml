# Inline PHP command fragments also occur in exploit clients and wire requests.
# This syntax establishes a decoder in the command argument, not deserialization
# or successful execution. Require the decoder's opening parenthesis so a
# constant such as base64_decode_label cannot satisfy the observation.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, text, json]
  crit: suspicious
  conf: 0.98

traits:
  - id: php-shell-argument-decode-syntax
    desc: Base64 decoder in PHP shell argument
    if:
      type: text
      regex: '(?i)\b(system|exec|passthru|shell_exec)\s*\(\s*base64_decode\s*\('

  - id: php-popen-argument-decode-syntax
    desc: Base64 decoder in PHP popen argument
    if:
      type: text
      regex: '(?i)\bpopen\s*\(\s*base64_decode\s*\('

composite_rules:
  - id: php-command-argument-decode
    desc: Base64 decoding in PHP command argument
    crit: component
    attack: T1027,T1059
    any:
      - id: php-shell-argument-decode-syntax
      - id: php-popen-argument-decode-syntax
