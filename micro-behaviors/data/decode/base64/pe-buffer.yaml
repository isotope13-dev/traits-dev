# Buffer reconstruction is a decode observation. Remote execution requires
# the separate loader call and memory/thread evidence in its consumer.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: powershell-pebytes-buffer-decode
    desc: PEBytes buffer decoded from Base64
    if:
      type: text
      regex: '\$PEBytes\s*=\s*\[Byte\[\]\]\[Convert\]::FromBase64String\(\$PEBytes(32|64)\)'
