defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: java-base64-decoder-class
    desc: JVM Base64 decoder class reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: java/util/Base64$Decoder
  - id: java-base64-decoder-bytecode-call
    desc: Java Base64 decoder accessor call
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: java/util/Base64.getDecoder
  - id: java-base64-url-decoder-bytecode-call
    desc: Java URL-safe Base64 decoder accessor call
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: java/util/Base64.getUrlDecoder
  - id: java-base64-decoder-source-call
    desc: Java Base64 decoder source call
    crit: notable
    conf: 0.94
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: 'Base64\.getDecoder\s*\(\s*\)\.decode\s*\('
  - id: java-base64-url-decoder-source-call
    desc: Java URL-safe Base64 decoder source call
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      regex: 'Base64\.getUrlDecoder\s*\(\s*\)\.decode\s*\('
  - id: android-base64-decoder-source-call
    desc: Android Base64 decoder source call
    crit: notable
    conf: 0.94
    platforms: [android]
    for: [java, kotlin]
    if:
      type: text
      regex: '\bBase64\.decode\s*\('
  - id: java-base64-decode-bytecode-call
    desc: Java Base64 decode call
    crit: notable
    conf: 0.96
    if:
      type: import
      exact: java/util/Base64$Decoder.decode
  - id: java-datatypeconverter-base64-decoder
    desc: Java DatatypeConverter Base64 decoder
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: javax/xml/bind/DatatypeConverter.parseBase64Binary

composite_rules:
  - id: java-base64-decoding-bytecode
    desc: Java bytecode Base64 decoding
    crit: notable
    conf: 0.94
    scope: leaf
    all:
      - id: java-base64-decode-bytecode-call
    any:
      - id: java-base64-decoder-bytecode-call
      - id: java-base64-url-decoder-bytecode-call
    needs: 1
