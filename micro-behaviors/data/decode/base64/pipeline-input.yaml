defaults:
  platforms: [unix, windows]
  for: [shell, applescript, text, python, github-actions]
  crit: notable
  conf: 0.95

traits:
  # A bare `base64 -d | bash` in a policy comment names a risky command;
  # it does not supply executable content to the decoder.
  - id: base64-local-pipeline-input
    desc: Local command feeds base64 decoder
    if:
      type: text
      regex: '\b(echo|printf|cat)\b[^|\n]{1,160}\|\s*base64\s+(-[dD]|--decode)\b'

    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: curl-base64-pipeline-input
    desc: curl output feeds base64 decoder
    if:
      type: text
      regex: '\bcurl\b[^|\n]{1,160}\|\s*base64\s+(-[dD]|--decode)\b'

composite_rules:
  - id: base64-pipeline-input
    desc: Supplies data to a base64 decoding pipeline
    any:
      - id: base64-local-pipeline-input
      - id: curl-base64-pipeline-input
    # Embedded linter reference examples do not supply runtime input.
    unless:
      - id: metadata/package/documentation/claims::lint-decoded-shell-example-context
