defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-decode-indexed-static-table
    desc: PHP Base64 decodes an indexed static table entry
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: 'base64_decode\s*\(\s*\w+::\$\w+\s*\[\s*\$\w+\s*\]'

  - id: php-base64-file-write-function-name
    desc: PHP stores Base64 file_put_contents name
    conf: 0.99
    if:
      type: string_literal
      exact: ZmlsZV9wdXRfY29udGVudHM=

composite_rules:
  # Co-occurrence is enough to recognize the encoded dispatch implementation
  # shape, but does not prove the decoded table entry is the callback argument.
  - id: php-encoded-file-write-dispatch-profile
    desc: PHP encoded file-write name and table callback dispatch
    conf: 0.97
    all:
      - id: php-decode-indexed-static-table
      - id: php-base64-file-write-function-name
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-array-dispatch
