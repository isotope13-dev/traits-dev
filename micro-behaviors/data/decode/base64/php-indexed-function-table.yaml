defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-decode-indexed-static-table
    desc: PHP Base64 decodes indexed static table entry
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: 'base64_decode\s*\(\s*\w+::\$\w+\s*\[\s*\$\w+\s*\]'
