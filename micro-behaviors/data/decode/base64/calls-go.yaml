defaults:
  crit: notable
traits:
- id: go-base64-decode
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  - wasm
  desc: Go binary references Base64 decoder methods
  conf: 0.7
  if:
    type: text
    regex: encoding/base64\.\(\*Encoding\)\.(Decode(String|dLen)?|AppendDecode)
- id: go-base64-decode-method
  platforms:
  - unix
  - windows
  for:
  - go
  desc: References Go Base64 decoding methods
  if:
    type: symbol
    regex: base64\.(StdEncoding\.Decode|(Raw)?(Std|URL)Encoding\.DecodeString)
- id: new-decoder
  platforms:
  - unix
  - windows
  for:
  - go
  desc: base64.NewDecoder (Go)
  if:
    type: symbol
    substr: base64.NewDecoder
