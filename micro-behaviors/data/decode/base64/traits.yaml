defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
traits:
- id: dotnet-frombase64string-text
  desc: .NET FromBase64String method reference
  crit: notable
  conf: 0.9
  for:
  - scripts
  - html
  - xml
  - csharp
  - asp
  - pe
  - dll
  if:
    type: text
    word: FromBase64String
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/build/generated::winmd-metadata
- id: dotnet-frombase64transform-text
  desc: .NET streaming Base64 decoder reference
  crit: notable
  conf: 0.94
  for:
  - powershell
  - batch
  - vbs
  - html
  - xml
  - javascript
  - csharp
  - pe
  - dll
  if:
    type: text
    word: FromBase64Transform
- id: dotnet-frombase64string-data
  desc: .NET FromBase64String in data
  crit: notable
  conf: 0.9
  for:
  - data
  if:
    type: text
    substr: FromBase64String
    case_insensitive: true
- id: dotnet-frombase64string-obfuscated-data
  desc: Obfuscated FromBase64String in data
  crit: suspicious
  conf: 0.94
  for:
  - data
  if:
    type: text
    regex: (?i)f`?r`?o`?m`?b`?a`?s`?e`?6`?4`?s`?t`?r`?i`?n`?g
  not:
  - regex: (?i)frombase64string
- id: encoded-dotnet-frombase64string-text
  desc: Encoded .NET FromBase64String reference
  crit: notable
  conf: 0.9
  for:
  - powershell
  - batch
  - vbs
  - html
  - csharp
  - pe
  - dll
  if:
    type: encoded
    encoding: base64
    substr: FromBase64String
- id: dotnet-frombase64string-reflected-split
  desc: PowerShell reconstructs reflected Base64 decoder
  crit: notable
  conf: 0.94
  for:
  - powershell
  if:
    type: text
    regex: (?is)FromBas.{0,120}e64Str.{0,120}ing.{0,160}GetMethod
- id: dotnet-frombase64-getmethods-like
  desc: Reflects FromBase64 via GetMethods filter
  crit: notable
  conf: 0.95
  for:
  - powershell
  if:
    type: text
    regex: (?is)GetMethods\(\)[\s\S]{0,160}\*FromBase64\*
- id: nim-base64-decoder-symbol
  desc: Nim stdlib base64 decode symbol
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (decode|decodeSize)__pureZbase64_u\d+
composite_rules:
- id: base64-decoding
  desc: Base64 decoding behavior
  crit: notable
  conf: 0.95
  for:
  - binaries
  - scripts
  - go
  unless:
  - id: well-known/tool/detection/agentskillmap/
  - id: well-known/tool/detection/skill-scanner::source-context
  - id: metadata/file/naming::rust-source-file-context
  any:
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/data/decode/base64::buffer-from-base64-literal-to-text
  - id: micro-behaviors/data/decode/base64::clojure-jvm-base64-decoder-accessor
  - id: micro-behaviors/data/decode/base64::codecs-decode-base64
  - id: micro-behaviors/data/decode/base64::decode-base64-call
  - id: micro-behaviors/data/decode/base64::decodestring-call
  - id: micro-behaviors/data/decode/base64::go-base64-decode
  - id: micro-behaviors/data/decode/base64::go-base64-decode-method
  - id: micro-behaviors/data/decode/base64::multiple-b64decode-calls
  - id: micro-behaviors/data/decode/base64::native-base64-decode-call
  - id: micro-behaviors/data/decode/base64::new-decoder
  - id: micro-behaviors/data/decode/base64::nsdata-base64-decode
  - id: micro-behaviors/data/decode/base64::php-base64-decode-call
  - id: micro-behaviors/data/decode/base64::msxml-text-to-bytes
  - id: micro-behaviors/data/decode/base64::b64decode-string
  - id: micro-behaviors/data/decode/base64::b64decode-wrapper-func
  - id: micro-behaviors/data/decode/base64::base64-decode-command
  - id: micro-behaviors/data/decode/base64::base64-decode
  - id: micro-behaviors/data/decode/base64::base64-pipe-perl-decrypt
  - id: micro-behaviors/data/decode/base64::base64-urlsafe-decode
  - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
  - id: micro-behaviors/data/decode/base64::const-decoder-classname
  - id: micro-behaviors/data/decode/base64::const-decoder-self
  - id: micro-behaviors/data/decode/base64::const-decoder-static
  - id: micro-behaviors/data/decode/base64::data-url-index-base64-decode
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-data
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-obfuscated-data
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/data/decode/base64::encoded-dotnet-frombase64string-text
  - id: micro-behaviors/data/decode/base64::nim-base64-decoder-symbol
  - id: micro-behaviors/data/decode/base64::python-urlsafe-base64-decode
