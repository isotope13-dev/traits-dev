defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: node-atob-base64-decoded-command-blobs
    desc: Node atob decodes multiple base64 command blobs
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: 'atob_?\s*\(\s*["''][A-Za-z0-9+/]{4,}={0,2}["'']\s*\)'
