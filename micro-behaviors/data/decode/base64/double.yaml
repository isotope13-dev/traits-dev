defaults:
  platforms: [unix, windows]

traits:
  # Plain text pipe-chain regex; a Makefile recipe line executes the same
  # shell text. Encoding alone does not establish build-input tampering.
  - id: double-base64-decode
    desc: Shell decodes data through two Base64 stages
    crit: notable
    conf: 0.8
    for: [shell, applescript, makefile, github-actions]
    if:
      type: text
      regex: '\|\s*base64\s+(-d|--decode)\b[^|\n;&]{0,50}\|\s*base64\s+(-d|--decode)\b'
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/detection/clawker::adversarial-payload-fixture
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/app/system/konk::konk-certificate-repair-script-context
      - id: metadata/path::openshift-release-ci-step-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-kubeconfig-provisioning-context
      # A rendered writeup stores the echo quote as an HTML entity.
      - type: text
        substr: '&#34;'
