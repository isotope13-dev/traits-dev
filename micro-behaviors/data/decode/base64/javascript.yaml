defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: atob-uri-decoder-proximity
  desc: decodeURIComponent and atob syntax occur nearby
  conf: 0.88
  if:
    type: text
    regex: \bdecodeURIComponent\s*\([^)]{0,40}atob\s*\(|\batob.{0,40}decodeURIComponent
  not:
  - substr: base64
  - substr: token.split
  unless:
  - type: basename
    exact: open-jssdk.es.js
  - type: text
    substr: ASSET_PRESETS
- id: multiple-node-base64-decodes
  desc: Multiple Node.js Base64 decodes
  conf: 0.8
  if:
    type: text
    regex: Buffer\.from\([^,]{1,50},\s*["']base64["']\)
  count_min: 2
  not:
  - substr: Buffer.from(result.data, 'base64')
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/lang/scripted::dts-declaration-file
- id: base64-chunk-array-buffer-concat
  desc: Reassembles a chunked Base64 blob into bytes
  conf: 0.9
  attack: T1027.013
  if:
    type: text
    regex: Buffer\.concat\([\s\S]{0,200}?\.map\([\s\S]{0,160}?Buffer\.from\([^)]{0,60}base64
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: buffer-from-url-safe-base64
  desc: JavaScript URL-safe Base64 decode via Buffer
  conf: 0.9
  if:
    type: text
    regex: (?is)Buffer\.from\([^)]{0,180}(base64url|replace\s*\([^)]{0,80}[-_])
- id: buffer-from-base64-to-utf8
  desc: Buffer base64 decode to UTF-8
  conf: 0.85
  if:
    type: text
    regex: from\(.{0,40}['"]base64['"].{0,20}\)\.toString\(\s*(['"]utf-?8['"])?\s*\)
- id: json-code-field-buffer-decode
  desc: Decodes a JSON code field from Base64
  conf: 0.97
  if:
    type: text
    regex: Buffer\.from\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.code\s*,\s*['"]base64['"]
- id: base64-decode-call-text
  desc: JavaScript invokes a Base64 decoder
  conf: 0.86
  for:
  - javascript
  - typescript
  - html
  - svg
  if:
    type: text
    regex: \batob\s*\(|Buffer\.from\([^)]{0,120}["']base64["']
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: metadata/lang/scripted::dts-declaration-file
- id: atob-embedded-base64-literal
  desc: Decodes embedded Base64-like literal
  conf: 0.94
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: atob\s*\(\s*\(?\s*["'][A-Za-z0-9+/_-]{40,}={0,2}["']
- id: large-base64-atob-decode
  desc: Large Base64 string decoded via atob()
  conf: 0.9
  for:
  - javascript
  - html
  if:
    type: text
    regex: atob\(["'][A-Za-z0-9+/=]{400,}
  not:
  - substr: AGFzbQEAAAAB
  - substr: T1RUTwALAIAAAwAwQ0ZG
- id: atob-indexed-value
  desc: Base64-decodes an indexed value
  conf: 0.84
  if:
    type: text
    regex: \batob\(.{0,40}\[\s*1\s*\]\)
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
composite_rules:
- id: base64-typed-array-reconstruction
  desc: Rebuilds Base64 data as typed bytes
  conf: 0.96
  for:
  - javascript
  - typescript
  - html
  all:
  - id: base64-decode-call-text
  - id: micro-behaviors/data/buffer/alloc::uint8array-constructor
  - id: micro-behaviors/data/encode/char-code::charcode-byte-array-assignment
  near_lines: 8
- id: long-base64-blob-decode-pair
  desc: JavaScript decodes a long embedded Base64 blob
  conf: 0.92
  near_bytes: 16384
  all:
  - id: metadata/file/encoded::large-base64-like-literal
  - id: base64-decode-call-text
- id: atob-literal-fixed-prefix-strip
  desc: Strips literal prefix before Base64 decode
  conf: 0.97
  near_bytes: 256
  all:
  - id: atob-embedded-base64-literal
  - id: micro-behaviors/data/string/access::js-short-fixed-prefix-removal
