# Base64 Decoding — JavaScript/TypeScript
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # The `escape`/`unescape`-free way to round-trip non-ASCII through Base64,
  # in either order. Ordinary enough to stay notable; the composites that care
  # supply the reason the decoded value matters.
  - id: decodeuricomponent-atob-chain
    desc: decodeURIComponent on atob output
    conf: 0.88
    if:
      type: text
      regex: '\bdecodeURIComponent\s*\([^)]{0,40}atob\s*\(|\batob.{0,40}decodeURIComponent'
    not:
      - substr: base64
      - substr: token.split
    unless:
      - type: basename
        exact: open-jssdk.es.js
      - type: text
        substr: ASSET_PRESETS

  - id: standard-base64-alphabet
    desc: JavaScript embeds an upper-first Base64 alphabet
    conf: 0.9
    if:
      type: string_literal
      exact: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=
  - id: lower-first-base64-alphabet
    desc: JavaScript embeds a lower-first Base64 alphabet
    conf: 0.9
    if:
      type: string_literal
      exact: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=
  - id: multiple-node-base64-decodes
    desc: Multiple Node.js Base64 decodes
    conf: 0.8
    if:
      type: text
      regex: 'Buffer\.from\([^,]{1,50},\s*["'']base64["'']\)'
    count_min: 2
    not:
      - substr: Buffer.from(result.data, 'base64')
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/lang/scripted::dts-declaration-file
  # `Buffer.concat(chunks.map(c => Buffer.from(c, 'base64')))` — one binary blob
  # split across an array of Base64 strings and reassembled at runtime. The
  # split is what defeats a scanner looking for a single long Base64 run, and
  # the `concat` (rather than a `.toString()`) says the result is meant to be
  # bytes, not text — a file to write, not a string to eval.
  - id: base64-chunk-array-buffer-concat
    desc: Reassembles a chunked Base64 blob into bytes
    conf: 0.9
    attack: T1027.013
    if:
      type: text
      regex: 'Buffer\.concat\([\s\S]{0,200}?\.map\([\s\S]{0,160}?Buffer\.from\([^)]{0,60}base64'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: buffer-from-url-safe-base64
    desc: JavaScript URL-safe Base64 decode via Buffer
    conf: 0.9
    if:
      type: text
      regex: '(?is)Buffer\.from\([^)]{0,180}(base64url|replace\s*\([^)]{0,80}[-_])'
  - id: buffer-from-base64-to-utf8
    desc: Buffer base64 decode to UTF-8
    conf: 0.85
    if:
      type: text
      regex: "from\\(.{0,40}['\"]base64['\"].{0,20}\\)\\.toString\\(\\s*(['\"]utf-?8['\"])?\\s*\\)"
  - id: json-code-field-buffer-decode
    desc: Decodes a JSON code field from Base64
    conf: 0.97
    if:
      type: text
      # Bind the response field to Buffer.from's input. A standalone `.code`
      # property or Base64 decoder is common; their dataflow is the behavior.
      regex: "Buffer\\.from\\s*\\(\\s*[A-Za-z_$][A-Za-z0-9_$]*\\.code\\s*,\\s*['\"]base64['\"]"
  - id: buffer-computed-base64-string-decoder
    desc: Computed Buffer base64 string decoder
    conf: 0.9
    if:
      type: text
      regex: Buffer\s*\[[^\]]{0,80}\]\s*\([^)]{0,80},\s*[A-Za-z_$][\w$]*\s*\)\s*\[[^\]]{0,80}\]\s*\(
  - id: node-json-parse-buffer
    desc: Node JSON.parse Buffer.from
    conf: 0.86
    if:
      type: text
      regex: 'JSON\.parse\s*\(\s*Buffer\.from'
  - id: node-base64-tostring-token
    desc: Node base64 toString token
    conf: 0.86
    if:
      type: text
      regex: '["'']base64["''].{0,80}\.toString\s*\('
  - id: base64-decode-call-text
    desc: JavaScript invokes a Base64 decoder
    conf: 0.86
    # svg: an SVG document's inline <script> is browser JavaScript; phish-lure
    # SVGs decode concealed URLs and API names with atob() at runtime.
    for: [javascript, typescript, html, svg]
    if:
      type: text
      regex: '\batob\s*\(|Buffer\.from\([^)]{0,120}["'']base64["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: large-base64-atob-decode
    desc: Large Base64 string decoded via atob()
    conf: 0.9
    for: [javascript, html]
    if:
      type: text
      regex: 'atob\(["''][A-Za-z0-9+/=]{400,}'
    not:
      - substr: "AGFzbQEAAAAB"
      - substr: "T1RUTwALAIAAAwAwQ0ZG"
  - id: data-url-index-base64-decode
    desc: Data URL payload decoded from second segment
    conf: 0.84
    if:
      type: text
      regex: '\batob\(.{0,40}\[\s*1\s*\]\)'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
  - id: custom-base64-decode-logic
    desc: Custom Base64 decoding logic (bit-shifting)
    conf: 0.85
    unless:
      - id: metadata/build/
    if:
      type: text
      regex: '<<\s*18\s*\|\s*\w+\s*<<\s*12\s*\|\s*\w+\s*<<\s*6'
composite_rules:
  - id: base64-typed-array-reconstruction
    desc: Rebuilds Base64 data as typed bytes
    conf: 0.96
    for: [javascript, typescript, html]
    all:
      - id: base64-decode-call-text
      - id: micro-behaviors/data/buffer::uint8array-constructor
      - id: micro-behaviors/data/encode/char-code::charcode-byte-array-assignment
    near_lines: 8
  - id: long-base64-blob-decode-pair
    desc: JavaScript decodes a long embedded Base64 blob
    conf: 0.92
    near_bytes: 16384
    all:
      - id: metadata/file/encoded::large-base64-like-literal
      - id: base64-decode-call-text
  - id: base64-alphabet
    desc: JavaScript embeds a Base64 alphabet
    conf: 0.9
    any:
      - id: standard-base64-alphabet
      - id: lower-first-base64-alphabet
  - id: node-base64-json-file-materializer
    desc: Node decodes base64 JSON to file
    conf: 0.9
    near_bytes: 2048
    all:
      - id: node-json-parse-buffer
      - id: node-base64-tostring-token
      - id: micro-behaviors/fs/write/file/full::write-file-sync
