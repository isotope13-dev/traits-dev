defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-string-decode-base64
    desc: Python legacy string Base64 decode call
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '\.decode\(\s*["'']base64["'']\s*\)'

# The Python grammar error-recovers poorly across UTScapy's section directives.
# Bind the literal-ending decode syntax to that campaign grammar; do not claim
# that a quoted example in an ordinary Python module executes.
composite_rules:
  - id: utscapy-triple-string-base64-decode
    desc: UTScapy campaign contains literal Base64 decoder
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/directive::utscapy-campaign
      - id: metadata/lang/source/syntax/call/arguments::python-triple-string-base64-decode-text
