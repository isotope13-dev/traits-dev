defaults:
  for:
    - python
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.85
traits:
  - id: python-urlsafe-base64-decode
    desc: Python URL-safe Base64 decoder reference
    if:
      type: symbol
      exact: base64.urlsafe_b64decode
  - id: python-standard-base64-decode
    desc: Python standard Base64 decoder reference
    if:
      type: symbol
      exact: base64.standard_b64decode
  - id: pyc-base64-decode-identifier
    desc: Bytecode references a Base64 decoder
    for: [pyc]
    crit: component
    if:
      type: symbol
      kind: identifier
      regex: '^(b64decode|standard_b64decode|urlsafe_b64decode|a2b_base64)$'
