defaults:
  for: [package.json]
  platforms:
  - unix
  - windows
  crit: suspicious

traits:
- id: npm-preinstall-base64
  desc: preinstall script decodes base64 data
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)(base64\s*(-d|--decode)|atob\s*\(|Buffer\.from\s*\([^,]+,\s*["']base64["'])
- id: npm-install-base64
  desc: install script decodes base64 data
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.install
    regex: (?i)(base64\s*(-d|--decode)|atob\s*\(|Buffer\.from\s*\([^,]+,\s*["']base64["'])
- id: npm-postinstall-base64
  desc: postinstall script decodes base64 data
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)(base64\s*(-d|--decode)|atob\s*\(|Buffer\.from\s*\([^,]+,\s*["']base64["'])

composite_rules:
- id: npm-script-base64
  desc: NPM lifecycle script decodes base64 data
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/data/decode/base64/unspecified::npm-preinstall-base64
  - id: micro-behaviors/data/decode/base64/unspecified::npm-install-base64
  - id: micro-behaviors/data/decode/base64/unspecified::npm-postinstall-base64
