defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: setup-py-install-hidden-decoded-exec
    desc: Setup subclass with decode and DEVNULL clues
    crit: suspicious
    conf: 0.96
    scope: leaf
    near_bytes: 4096
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-command-subclass
      - id: micro-behaviors/data/decode/base64/unspecified::setup-hidden-decoded-process-chain
    unless:
      - id: metadata/build/recognized-contexts::python-setup-network-benign-context
