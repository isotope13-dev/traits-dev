# Single Base64 decode call in Rust. Neutral on its own -- one decode is
# ordinary crypto/protocol/config work, which is why the sibling
# `repeated-base64::rust-*` atoms require two. This one is a building block for
# composites that already carry the intent (a build.rs that decodes then writes
# and executes the result); it never convicts alone.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.7
  attack: T1140
  mbc: C0053
traits:
  - id: rust-base64-engine-decode
    desc: Rust decodes Base64 through an engine
    if:
      type: symbol
      kind: call
      regex: '(STANDARD|STANDARD_NO_PAD|URL_SAFE|URL_SAFE_NO_PAD)\.decode$'
  - id: rust-base64-helper-decode
    desc: Rust calls a base64 decode helper
    if:
      type: symbol
      kind: call
      regex: '(^|:)base64::decode$'
