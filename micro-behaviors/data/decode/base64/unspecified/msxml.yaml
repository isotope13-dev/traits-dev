defaults:
  platforms:
  - windows
  for:
  - javascript
  crit: notable
  conf: 0.94
traits:
- id: msxml-text-to-bytes
  desc: MSXML converts Base64 text to bytes
  if:
    type: tree-sitter
    language: javascript
    query: |
      (
       (statement_block
        [
        (variable_declaration (variable_declarator name: (identifier) @doc value: (new_expression constructor: (identifier) @ctor arguments: (arguments (string (string_fragment) @progid)))))
        (lexical_declaration (variable_declarator name: (identifier) @doc value: (new_expression constructor: (identifier) @ctor arguments: (arguments (string (string_fragment) @progid)))))
      ]
        . [
        (variable_declaration (variable_declarator name: (identifier) @node value: (call_expression function: (member_expression object: (identifier) @doc_use property: (property_identifier) @create) arguments: (arguments (string)))))
        (lexical_declaration (variable_declarator name: (identifier) @node value: (call_expression function: (member_expression object: (identifier) @doc_use property: (property_identifier) @create) arguments: (arguments (string)))))
      ]
        . (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @node_type property: (property_identifier) @type_property)
            right: (string (string_fragment) @base64)))
        . (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @node_input property: (property_identifier) @input_property)
            right: (identifier) @input))
        . (return_statement (member_expression
            object: (identifier) @node_output property: (property_identifier) @output_property))
       ) @codec
       (#eq? @ctor "ActiveXObject")
       (#match? @progid "(?i)^msxml2\\.domdocument(\\.[0-9]+\\.[0-9]+)?$")
       (#eq? @doc @doc_use)
       (#eq? @create "createElement")
       (#eq? @node @node_type)
       (#eq? @node @node_input)
       (#eq? @node @node_output)
       (#eq? @type_property "dataType")
       (#eq? @base64 "bin.base64")
       (#eq? @input_property "text")
       (#eq? @output_property "nodeTypedValue")
      )
