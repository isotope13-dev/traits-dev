defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
    - scripts
traits:
  - id: base64-decoder-near-reflection-method-lookup
    desc: Base64 decoder near reflected method lookup
    crit: notable
    conf: 0.94
    for:
      - powershell
      - vbs
    if:
      type: text
      regex: (?is)FromBa.{0,120}64Str.{0,120}ing.{0,160}GetMethod

composite_rules:
  - id: base64-decoding
    desc: Base64 decoding behavior
    crit: notable
    conf: 0.95
    for:
      - binaries
      - scripts
      - go
      - csharp
      - typescript
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/tool/detection/agent/agentskillmap::cli-context
      - id: well-known/tool/detection/agent/skill-scanner::source-context
      - id: metadata/file/extension/source::rust-source-extension
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decode/embedded/base64
      - id: micro-behaviors/data/decode/base64/unspecified::codecs-decode-base64
      - id: micro-behaviors/data/decode/base64/unspecified::decode-base64-call
      - id: micro-behaviors/data/decode/base64/unspecified::decodestring-call
      - id: micro-behaviors/data/decode/base64/reference::go-base64-decode-method
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/decode/base64/unspecified::multiple-b64decode-calls
      - id: micro-behaviors/data/decode/base64/unspecified::native-base64-decode-call
      - id: micro-behaviors/data/decode/base64/unspecified::nsdata-base64-decode
      - id: micro-behaviors/data/decode/base64/unspecified::php-base64-decode-call
      - id: micro-behaviors/data/decode/base64/unspecified::msxml-text-to-bytes
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-wrapper-func
      - id: micro-behaviors/data/decode/command::base64-decode-command
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode
      - id: micro-behaviors/process/stdio/write::base64-decode-piped-perl
      - id: micro-behaviors/data/decode/base64/unspecified::base64-urlsafe-decode
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64-to-utf8
      - id: micro-behaviors/data/decode/base64/structured::const-decoder-static-or-classname
      - id: micro-behaviors/data/decode/base64/structured::const-decoder-self
      - id: micro-behaviors/data/decode/base64/unspecified::atob-indexed-value
      - id: micro-behaviors/data/decode/to-file::base64-decode-piped-to-file-write
      - id: micro-behaviors/data/decode/to-file::env-var-base64-gzip-json-to-file
      - id: micro-behaviors/data/decode/to-file::base64-decode-redirected-to-data-file
      - id: micro-behaviors/data/decode/to-file::base64-decode-lands-in-file
