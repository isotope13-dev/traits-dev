defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  mbc: C0053
traits:
- id: php-base64-decode-call
  desc: Calls PHP base64_decode()
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: base64_decode
# Bare-PHP injections carry no opening tag and yield no call facts; this text
# shape reaches them. Decoding into a variable is the first half of the
# two-step decode-and-write staging shape.
- id: php-base64-decode-assignment
  desc: Stores Base64 decode result in variable
  crit: notable
  conf: 0.85
  for: [php, text, data]
  if:
    type: text
    regex: '=\s*base64_decode\s*\('
