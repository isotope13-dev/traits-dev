defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: b64decode-call
  desc: Decodes Base64 data with Python
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: (^|\.)b64decode$
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: multiple-b64decode-calls
  desc: Multiple Python Base64 decoder calls
  conf: 0.97
  count_min: 2
  if:
    type: symbol
    kind: call
    exact: base64.b64decode
- id: decodestring-call
  desc: Calls base64.decodestring (Python legacy)
  conf: 0.9
  if:
    type: symbol
    exact: base64.decodestring
- id: codecs-decode-base64
  desc: codecs.decode with base64 encoding (Python)
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: codecs.decode
    arg:
      kind: string
      regex: (?i)^base[_-]?64$
