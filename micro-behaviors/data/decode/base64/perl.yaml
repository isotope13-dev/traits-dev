# Base64 Decoding — Perl
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  platforms: [unix]
  for: [perl]
traits:
  - id: perl-base64-decode
    desc: Calls Perl MIME Base64 decoder
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(MIME::Base64::)?decode_base64$'
