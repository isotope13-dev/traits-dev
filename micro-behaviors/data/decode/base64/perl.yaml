# Base64 Decoding — Perl
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  platforms: [unix]
  for: [perl]
traits:
  - id: perl-base64-decode
    desc: Calls Perl MIME Base64 decoder
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(MIME::Base64::)?decode_base64$'
  - id: mime-base64-import
    desc: use MIME::Base64 (Perl)
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: "use\\s+MIME::Base64"
  - id: perl-base64-bit-decoder
    desc: Perl bitwise Base64 decoder
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: 'sprintf(''%06b'''
