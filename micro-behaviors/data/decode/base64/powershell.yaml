defaults:
  conf: 0.95
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-frombase64string
    desc: PowerShell decodes Base64 with Convert
    crit: notable
    for: [powershell, javascript, html, vbs, batch]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\[\s*(System\.)?Convert\s*\]::\s*FromBase64String\s*\('

  - id: from-base64-string-concat
    desc: Obfuscated FromBase64String call
    crit: suspicious
    if:
      type: text
      regex: "\\[Convert\\]::\\(\\s*'Fr'\\s*\\+\\s*'omB'|'F'\\s*\\+\\s*'ro'.{0,40}'4St'"
