defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-frombase64string
    desc: PowerShell decodes Base64 with Convert
    crit: notable
    conf: 0.95
    for: [powershell, javascript, html, vbs]
    if:
      type: text
      regex: '(?i)\[\s*(System\.)?Convert\s*\]::\s*FromBase64String\s*\('

  - id: from-base64-string-concat
    desc: Obfuscated FromBase64String call
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "\\[Convert\\]::\\(\\s*'Fr'\\s*\\+\\s*'omB'|'F'\\s*\\+\\s*'ro'.{0,40}'4St'"

composite_rules:
  - id: powershell-base64-symmetric-decrypt
    desc: PowerShell Base64-decodes and symmetrically decrypts data
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
    near_lines: 40
    unless:
      - id: well-known/app/infrastructure/watchmaker::package-context
