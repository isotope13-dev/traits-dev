# A decode operation alone does not imply DNS use or concealed payloads.
defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ruby-base64-decode64-call
    desc: Ruby Base64.decode64 call
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (call receiver: (constant) @receiver
          method: (identifier) @method
          (#eq? @receiver "Base64")
          (#eq? @method "decode64"))
