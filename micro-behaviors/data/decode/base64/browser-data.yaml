# Proximity supplies context only; it does not bind a response or cookie to
# the decoder. Keep these neutral and describe exactly that limitation.
defaults:
  platforms: [windows, unix]
  crit: notable

traits:
  - id: json-call-atob-proximity
    desc: JSON method call near Base64 decoding
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '\.json\s*\(\s*\)[\s\S]{0,240}atob\s*\('

  - id: page-cookie-atob-proximity
    desc: Page cookie read near Base64 decoding
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)(document\.cookie.{0,120}atob\(|atob\(.{0,120}document\.cookie)'
