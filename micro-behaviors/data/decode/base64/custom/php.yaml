defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-strtr-alphabet-base64
    desc: Maps a 64-char alphabet onto standard Base64
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "'[A-Za-z0-9+/=]{64,65}',\\s*'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef"
  - id: php-translated-base64-decode
    desc: Decodes translated Base64 text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bbase64_decode\s*\(\s*strtr\s*\('
      exclude_comments: true
