# Six-bit digit accumulation followed by masked byte output distinguishes
# decoding from an encoder indexing the same alphabet.
defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
composite_rules:
  - id: javascript-indexed-base64url-decoder
    desc: URL-safe Base64 lookup with six-bit byte unpacking
    conf: 0.97
    near_bytes: 650
    all:
      - id: micro-behaviors/data/encoding/base64::javascript-url-safe-alphabet
      - id: micro-behaviors/data/bitwise/shift::six-bit-digit-accumulation
      - id: micro-behaviors/data/bitwise/shift::shifted-masked-byte-push
      - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
