defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: java-base64-decoder-declaration
    desc: Declares Java Base64 decoder
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Base64\.Decoder\s+[A-Za-z_$][\w$]*\s*=\s*Base64\.getDecoder\('

  - id: java-decode-into-destination-array-call
    desc: Java decode call supplies destination array
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[A-Za-z_$][\w$]*\.decode\(\s*[A-Za-z_$][\w$]*\s*,\s*[A-Za-z_$][\w$]*\s*\)'

composite_rules:
  - id: java-base64-decoder-to-array
    desc: Java Base64 decoder writes into array
    crit: notable
    conf: 0.9
    all:
      - id: java-base64-decoder-declaration
      - id: java-decode-into-destination-array-call
    near_bytes: 1024
