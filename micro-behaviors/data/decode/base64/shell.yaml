defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: kubernetes-secret-pipeline
    desc: Kubernetes secret field Base64 decoding pipeline
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(kubectl|jq|jsonpath)[^\r\n]{0,240}\|\s*base64\s+-d'
  - id: base64-d-cmd
    desc: base64 -d/-D decode command
    crit: notable
    conf: 0.6
    for: [shell, github-actions, text, batch]
    if:
      type: text
      # `\b` keeps `base64` off a preceding word char so unit-test binaries named
      # `test_base64 -d` (Mercury/Notmuch bower Makefile) do not look like the
      # base64(1) tool: `_base64` has no boundary before `base64`, but a backtick,
      # pipe, space, or line start does. cleave's regex engine
      # (regex_automata::meta) has no lookbehind, and `\b` is the clean
      # equivalent here — the earlier `(?<!\w)` form silently never matched.
      regex: '\bbase64\s+-(d|D)'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/file/naming::rust-source-file-context
  - id: base64-decode-cmd
    desc: base64 --decode command
    crit: notable
    conf: 0.6
    for: [shell, github-actions, text, batch]
    if:
      type: text
      substr: 'base64 --decode'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/file/naming::rust-source-file-context
  - id: shell-embedded-atob-decode
    desc: Embedded JavaScript atob decode
    crit: notable
    conf: 0.95
    if:
      type: text
      word: atob
  - id: base64-pipe-perl-decrypt
    desc: Base64 decode piped to Perl decryption
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: base64\s+--?de?c?o?d?e?\s*\|\s*perl\s+-e
  - id: decode-pipe-shell
    desc: Base64 decode piped directly to a shell
    crit: component
    conf: 0.9
    for: [shell, applescript, text, python]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)(\s+\S{1,40})?\s*\|\s*(/(usr/)?bin/)?(ba|da|z|k)?sh\b'
  - id: decode-pipe-env-shell
    desc: Base64 decode-to-shell pipeline through env
    crit: component
    conf: 0.9
    for: [shell, applescript, text, python]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\s*\|\s*env\s+(\w{1,20}=\S{1,20}\s+)?(/bin/)?(ba|da|z|k)?sh\b'
composite_rules:
  - id: base64-decode-piped-shell
    desc: Base64 decode-to-shell pipeline
    crit: suspicious
    conf: 0.9
    for: [shell, applescript, text, python]
    any:
      - id: decode-pipe-shell
      - id: decode-pipe-env-shell
    unless:
      - id: metadata/file/naming::rust-source-file-context
  - id: base64-decode-shell
    desc: Shell base64 decode command
    crit: notable
    conf: 0.6
    any:
      - id: base64-d-cmd
      - id: base64-decode-cmd
    unless:
      - id: metadata/file/naming::rust-source-file-context
