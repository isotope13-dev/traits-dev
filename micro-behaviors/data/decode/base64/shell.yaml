defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  # `printf %s "$cfg" | base64 -d | sudo tee /etc/foo.conf` is how you ship a
  # generated config file over a shell command channel without quoting it --
  # minikube writes containerd's hosts.toml this way. The decoded bytes land
  # in a file, not in an interpreter, so this is a file write that happens to
  # be encoded in transit. Declared for source languages too, because the
  # command string is usually built inside a program.
  - id: base64-decode-piped-to-file-write
    desc: Base64 decode piped into a file write
    crit: notable
    conf: 0.95
    for: [shell, go, source, python, ruby, javascript]
    if:
      type: text
      regex: 'base64\s+(-d|--decode)[^|]{0,30}\|[^|]{0,40}\b(tee|dd)\b'
  # `echo "$JSON" | base64 -d | gzip -d > task.json` provisions structured
  # runtime input through the environment. Keep all three semantic gates:
  # environment input, gzip decompression, and a JSON destination. A broader
  # decode-to-file exception would also cover an environment-delivered
  # executable staged for a later launch.
  - id: env-var-base64-gzip-json-to-file
    desc: Environment Base64-gzip JSON decoded to file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'echo\s+["''"]?\$\{?\w+\}?["''"]?\s*\|\s*base64\s+-[dD]\s*\|\s*gzip\s+-d\s*>\s*\S+\.json\b'
  - id: kubernetes-secret-pipeline
    desc: Kubernetes secret field Base64 decoding pipeline
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(kubectl|jq|jsonpath)[^\r\n]{0,240}\|\s*base64\s+-d'
  - id: base64-d-cmd
    desc: base64 -d/-D decode command
    crit: notable
    conf: 0.6
    for: [shell, github-actions, text, batch]
    if:
      type: text
      # `\b` keeps `base64` off a preceding word char so unit-test binaries named
      # `test_base64 -d` (Mercury/Notmuch bower Makefile) do not look like the
      # base64(1) tool: `_base64` has no boundary before `base64`, but a backtick,
      # pipe, space, or line start does. cleave's regex engine
      # (regex_automata::meta) has no lookbehind, and `\b` is the clean
      # equivalent here — the earlier `(?<!\w)` form silently never matched.
      regex: '\bbase64\s+-(d|D)'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/file/naming::rust-source-file-context
  - id: base64-decode-cmd
    desc: base64 --decode command
    crit: notable
    conf: 0.6
    for: [shell, github-actions, text, batch]
    if:
      type: text
      substr: 'base64 --decode'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/file/naming::rust-source-file-context
  - id: shell-embedded-atob-decode
    desc: Embedded JavaScript atob decode
    crit: notable
    conf: 0.95
    if:
      type: text
      word: atob
  - id: base64-pipe-perl-decrypt
    desc: Base64 decode piped to Perl decryption
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: base64\s+--?de?c?o?d?e?\s*\|\s*perl\s+-e
  - id: decode-pipe-shell
    desc: Base64 decode piped directly to a shell
    crit: component
    conf: 0.9
    for: [shell, applescript, text, python]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)(\s+\S{1,40})?\s*\|\s*(/(usr/)?bin/)?(ba|da|z|k)?sh\b'
    unless:
      # A brace placeholder piped into base64 (`echo {payload} | base64 -d`)
      # is a code-generation template, not an encoded payload: no base64
      # data is present for the decoder. Live stagers pipe a blob or a
      # shell variable, which this does not exclude.
      - type: text
        regex: '\{[A-Za-z_][A-Za-z0-9_]*\}\s*\|\s*\bbase64\b'
  - id: decode-pipe-env-shell
    desc: Base64 decode-to-shell pipeline through env
    crit: component
    conf: 0.9
    for: [shell, applescript, text, python]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\s*\|\s*env\s+(\w{1,20}=\S{1,20}\s+)?(/bin/)?(ba|da|z|k)?sh\b'
composite_rules:
  - id: base64-decode-piped-shell
    desc: Base64 decode-to-shell pipeline
    crit: suspicious
    conf: 0.9
    for: [shell, applescript, text, python]
    any:
      - id: decode-pipe-shell
      - id: decode-pipe-env-shell
    unless:
      - id: metadata/file/naming::rust-source-file-context
      # Static-scan fixtures ship dangerous shell text as scanner input by
      # design (e.g. tests/staticscan_fixtures/): the pipeline shape is the
      # fixture under test, not an attack.
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: base64-decode-shell
    desc: Shell base64 decode command
    crit: notable
    conf: 0.6
    any:
      - id: base64-d-cmd
      - id: base64-decode-cmd
    unless:
      - id: metadata/file/naming::rust-source-file-context
