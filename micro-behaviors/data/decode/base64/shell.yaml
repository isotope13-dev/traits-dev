defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: kubernetes-secret-pipeline
    desc: Kubernetes secret field Base64 decoding pipeline
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(kubectl|jq|jsonpath)[^\r\n]{0,240}\|\s*base64\s+-d'
  - id: base64-decode-command
    desc: base64 short or long decode option
    crit: notable
    conf: 0.6
    for: [shell, github-actions, text, batch, makefile, markdown, php]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\b'
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/file/extension/source::rust-source-extension
  - id: base64-pipe-perl-decrypt
    desc: Base64 decode piped to Perl decryption
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: base64\s+--?de?c?o?d?e?\s*\|\s*perl\s+-e
composite_rules:
  - id: serialized-or-heuristic-input-context
    desc: Serialized data or heuristic YAML fragments
    crit: exception
    any:
      - id: metadata/package/testing/corpus/
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: "metadata/lang/source/origin::yaml-plain-source-layer-path"
