defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
traits:
  - id: base64-d-cmd
    desc: base64 -d/-D decode command
    crit: notable
    conf: 0.6
    if:
      type: text
      # Require a word boundary so unit-test binaries named `test_base64 -d`
      # (Mercury/Notmuch bower Makefile) do not look like the base64(1) tool.
      regex: '(?<![A-Za-z0-9_])base64\s+-(d|D)'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script

  - id: base64-decode-cmd
    desc: base64 --decode command
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: 'base64 --decode'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script

  - id: base64-tool
    desc: base64 tool reference
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      exact: base64
  - id: shell-embedded-atob-decode
    desc: Embedded JavaScript atob decode
    crit: notable
    conf: 0.95
    if:
      type: text
      word: atob

  - id: base64-pipe-perl-decrypt
    desc: Base64 decode piped to Perl decryption
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: base64\s+--?de?c?o?d?e?\s*\|\s*perl\s+-e

  - id: base64-decode-piped-shell
    desc: Base64 decode piped into a shell
    crit: notable
    conf: 0.9
    for: [shell, applescript]
    if:
      type: text
      regex: 'base64\s+(-[dD]|--decode)[^|\n]{0,60}\|\s*(env\s+\S+\s+)?(/bin/)?(ba)?sh\b'

composite_rules:
  - id: base64-decode-shell
    desc: Shell base64 decode command
    crit: notable
    conf: 0.6
    any:
      - id: base64-d-cmd
      - id: base64-decode-cmd
