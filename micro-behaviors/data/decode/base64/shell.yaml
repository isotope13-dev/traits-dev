defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: base64-decode-piped-to-file-write
    desc: Base64 decode piped into a file write
    crit: notable
    conf: 0.95
    for: [shell, go, source, python, ruby, javascript]
    if:
      type: text
      regex: 'base64\s+(-d|--decode)[^|]{0,30}\|[^|]{0,40}\b(tee|dd)\b'
  # `echo "$JSON" | base64 -d | gzip -d > task.json` provisions structured
  # runtime input through the environment. Keep all three semantic gates:
  # environment input, gzip decompression, and a JSON destination. A broader
  # decode-to-file exception would also cover an environment-delivered
  # executable staged for a later launch.
  - id: env-var-base64-gzip-json-to-file
    desc: Environment Base64-gzip JSON decoded to file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'echo\s+["''"]?\$\{?\w+\}?["''"]?\s*\|\s*base64\s+-[dD]\s*\|\s*gzip\s+-d\s*>\s*\S+\.json\b'
  # The redirection sibling of `base64-decode-piped-to-file-write`, which only
  # ever covered `| tee` and `| dd`. Plain `> file` is the commoner spelling:
  # Apache Druid's `peon.sh` does
  # `echo ${TASK_JSON} | base64 -d | gzip -d > ${TASK_DIR}/task.json`, and
  # because that decode sits a few lines above the script's `exec bin/run-java`
  # it scored two suspicious findings for a decode-then-execute flow it does
  # not perform -- the bytes land in a task description, and the exec target is
  # a literal program path.
  #
  # Deliberately bounded to data-file extensions rather than any redirect: a
  # dropper that stages `base64 -d > /tmp/payload` and runs it keeps scoring,
  # because the thing it writes is not a config or a document.
  - id: base64-decode-redirected-to-data-file
    desc: Base64 decode redirected into a data file
    crit: notable
    conf: 0.95
    for: [shell, go, source, python, ruby, javascript]
    if:
      type: text
      regex: 'base64\s+-{1,2}[dD]\w*[^\n]{0,50}>[^\n]{0,60}\.(json|ya?ml|conf|txt|xml)\b'

  - id: kubernetes-secret-pipeline
    desc: Kubernetes secret field Base64 decoding pipeline
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(kubectl|jq|jsonpath)[^\r\n]{0,240}\|\s*base64\s+-d'
  - id: base64-decode-command
    desc: base64 short or long decode option
    crit: notable
    conf: 0.6
    for: [shell, github-actions, text, batch, makefile, markdown, php]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\b'
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/file/extension/identity::rust-source-extension
  - id: shell-embedded-atob-decode
    desc: Embedded JavaScript atob decode
    crit: notable
    conf: 0.95
    if:
      type: text
      word: atob
  # A backtick-quoted pipeline followed by a word is explanatory prose
  # (`... | base64 --decode | sh` does not contain). A shell that runs the
  # pipeline has no closing backtick and following word.
  - id: backtick-decode-pipeline-prose
    desc: Quoted decode pipeline followed by prose
    crit: notable
    conf: 0.9
    for: [text, markdown]
    if:
      type: text
      regex: '`[^`\n]{0,160}base64\s+(-[dD]|--decode)\s*\|\s*sh`\s+[A-Za-z]'
  - id: base64-pipe-perl-decrypt
    desc: Base64 decode piped to Perl decryption
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: base64\s+--?de?c?o?d?e?\s*\|\s*perl\s+-e
composite_rules:
  - id: base64-decode-piped-shell
    desc: Base64 decode-to-shell pipeline
    crit: suspicious
    conf: 0.9
    for: [shell, applescript, text, python]
    all:
      - id: base64-pipeline-input
    near_bytes: 256
    any:
      - id: micro-behaviors/process/create/shell/pipeline::base64-decode-shell-stdin
      - id: micro-behaviors/process/create/shell/pipeline::decode-pipe-env-shell
    unless:
      - id: metadata/package/documentation/security-testing::documented-pipeline-input-context
      - id: micro-behaviors/process/create/shell/guard::python-command-risk-classifier-context
      - id: metadata/file/extension/identity::rust-source-extension
      # Static-scan fixtures ship dangerous shell text as scanner input by
      # design (e.g. tests/staticscan_fixtures/): the pipeline shape is the
      # fixture under test, not an attack.
      # Red-team eval banks quote decode-to-shell pipelines as labeled test
      # inputs in a testing corpus instead of running them.
      - id: metadata/package/testing/
      - id: metadata/package/tooling::the-situation-provisioner
      - id: well-known/tool/detection/
      # Base64 transport round trip (runtime, printf-fed, or shell).
      - id: micro-behaviors/process/create/shell/bridge::base64-shell-transport-context
      - id: "metadata/file/naming::test-directory-component"
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/opencode-v2-security::package-name
  # One reference for the two "the decoded bytes land in a file, not in an
  # interpreter" spellings, so a consuming rule spends a single suppression
  # slot -- `base64-exec-proximity` is already at the limit.
  - id: base64-decode-lands-in-file
    desc: Base64 decode writes to a file rather than an interpreter
    crit: notable
    conf: 0.95
    for: [shell, go, source, python, ruby, javascript]
    any:
      - id: base64-decode-piped-to-file-write
      - id: base64-decode-redirected-to-data-file
      - id: env-var-base64-gzip-json-to-file

  - id: serialized-or-heuristic-input-context
    desc: Serialized data or heuristic YAML fragments
    crit: exception
    any:
    - id: metadata/package/testing/corpus/
    - id: metadata/file/format/structured::serialized-news-article-catalog
    - id: "metadata/lang/source/origin::yaml-plain-source-layer-path"
