defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: b64decode-literal-to-text
    desc: Decodes a Base64 literal to text
    conf: 0.9
    size_max: 15000
    if:
      type: tree-sitter
      # tree-sitter-python has no `bytes` node — `b"..."` parses as `string`,
      # so the single `(string)` alternative covers both literal forms.
      query: |
        (call
          function: (attribute
            object: (call
              function: (attribute
                object: [
                  (identifier) @mod
                  (attribute
                    object: (identifier) @pkg
                    attribute: (identifier) @submod)
                ]
                attribute: (identifier) @decoder)
              arguments: (argument_list
                (string) @encoded))
            attribute: (identifier) @decode_method)
          (#eq? @decode_method "decode")
          (#any-of? @decoder "b64decode" "standard_b64decode" "urlsafe_b64decode")
          (#any-of? @mod "base64" "binascii"))
  - id: b64decode-string
    # base64 is an encoding/decoding method, which TAXONOMY places at notable
    # (it defines program purpose). This is the text/bytecode fallback for the
    # `b64decode-call` symbol atom on files where symbols aren't extracted (.pyc).
    desc: Standard Base64 decoder reference
    conf: 0.66
    for: [python, pyc, text]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])(base64\.)?b64decode([^A-Za-z0-9_]|$)'
    unless:
      # The structured call atom is canonical when parser facts are available;
      # this text atom is only the fallback for source/bytecode without it.
      - type: symbol
        kind: call
        regex: '(^|\.)b64decode$'
      - id: well-known/tool/detection/agentskillmap/
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/llm-scanner::skill-vetting-pattern-scanner
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: b64decode-wrapper-func
    desc: Short function wrapping base64 decode
    conf: 0.9
    if:
      type: text
      regex: 'def\s+\w{1,4}\(\w\)\s*:[\s\S]{1,60}b64decode'
  - id: placeholder-b64decode-exec-transport
    desc: Python decodes a placeholder before exec
    conf: 0.95
    if:
      type: text
      regex: 'b64decode\s*\(\s*["'']\{[A-Za-z_]\w*\}["'']\s*\)[\s\S]{0,160}\bexec\s*\('
  - id: dunder-import-base64
    desc: Dynamically imports base64 module
    conf: 0.9
    for: [python, text]
    if:
      type: text
      regex: __import__\(['"]base64['"]\)
