defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: b64decode-literal-to-text
    desc: Decodes a Base64 literal to text
    conf: 0.9
    size_max: 15000
    if:
      type: tree-sitter
      # tree-sitter-python has no `bytes` node — `b"..."` parses as `string`,
      # so the single `(string)` alternative covers both literal forms.
      query: |
        (call
          function: (attribute
            object: (call
              function: (attribute
                object: [
                  (identifier) @mod
                  (attribute
                    object: (identifier) @pkg
                    attribute: (identifier) @submod)
                ]
                attribute: (identifier) @decoder)
              arguments: (argument_list
                (string) @encoded))
            attribute: (identifier) @decode_method)
          (#eq? @decode_method "decode")
          (#any-of? @decoder "b64decode" "standard_b64decode" "urlsafe_b64decode")
          (#any-of? @mod "base64" "binascii"))
  - id: b64decode-wrapper-func
    desc: Short function wrapping base64 decode
    conf: 0.9
    if:
      type: text
      regex: 'def\s+\w{1,4}\(\w\)\s*:[\s\S]{1,60}b64decode'
  - id: placeholder-b64decode-exec-transport
    desc: Python decodes a placeholder before exec
    conf: 0.95
    if:
      type: text
      regex: 'b64decode\s*\(\s*["'']\{[A-Za-z_]\w*\}["'']\s*\)[\s\S]{0,160}\bexec\s*\('
  - id: python-slice-then-b64decode
    desc: Slices a string then Base64-decodes
    conf: 0.94
    if:
      type: text
      regex: '(?is)\w+\s*=\s*\w+\[\d+:\][\s\S]{0,80}b64decode'
