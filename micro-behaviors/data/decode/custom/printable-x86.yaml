defaults:
  for: [html, javascript, dos_com]
  platforms: [windows]
traits:
  - id: printable-x86-self-decoder
    desc: Printable x86 stub patches decoder code
    crit: notable
    conf: 0.99
    if:
      # Entry instructions recover BX from the PSP stack, then patch code.
      # These bytes describe a decoder, not the payload it carries.
      type: raw
      regex: 'XPPPYZIQD\[L-.{2}-.{2}1GDSX'
