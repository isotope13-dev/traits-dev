defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-key-value-pair-comprehension
    desc: Builds key-value pairs from a mapping
    if:
      type: text
      regex: '\[\w+\[0\],\s*\w+\[1\]\]\s+for\s+\w+\s+in\s+\{'
  - id: python-inverse-value-comparison
    desc: Compares input to mapping pair value
    if:
      type: text
      regex: '\}\.items\(\)\]\s+if\s+\w+\s*==\s*\w+\[1\]'
