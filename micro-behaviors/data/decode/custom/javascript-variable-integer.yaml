defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # Bind the alphabet lookup, weighted digit, termination test and emitted
  # integer within nested loops. Names, whitespace and alphabet are arbitrary.
  - id: js-variable-length-alphabet-integer-decoder
    desc: Decodes variable-length alphabet integers
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        (function_expression
          parameters: (formal_parameters
            . (identifier) @input
            . (identifier) @alphabet
            . (identifier) @base .)
          body: (statement_block
            (for_statement body: (for_statement body: (statement_block
              (expression_statement (assignment_expression
                left: (identifier) @digit
                right: (call_expression
                  function: (member_expression
                    object: (identifier) @alphabet_use
                    property: (property_identifier) @lookup)
                  arguments: (arguments (subscript_expression
                    object: (identifier) @input_use
                    index: (update_expression operator: "++"))))))
              (if_statement
                condition: (parenthesized_expression (sequence_expression
                  (augmented_assignment_expression
                    left: (identifier) @acc operator: "+="
                    right: (binary_expression operator: "*"
                      right: (parenthesized_expression (binary_expression
                        left: (identifier) @digit_mod operator: "%"
                        right: (identifier) @base_mod))))
                  (binary_expression
                    left: (identifier) @digit_test operator: "<"
                    right: (identifier) @base_test)))
                consequence: (statement_block
                  (expression_statement (call_expression
                    function: (member_expression
                      property: (property_identifier) @emit)
                    arguments: (arguments (binary_expression
                      left: (identifier) @acc_emit operator: "|"
                      right: (number) @zero))))
                  (break_statement)))))))
          (#eq? @alphabet @alphabet_use)
          (#eq? @input @input_use)
          (#eq? @base @base_mod)
          (#eq? @base @base_test)
          (#eq? @digit @digit_mod)
          (#eq? @digit @digit_test)
          (#eq? @acc @acc_emit)
          (#eq? @lookup "indexOf")
          (#eq? @emit "push")
          (#eq? @zero "0"))
