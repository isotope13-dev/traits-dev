defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # Index a 256x256 substitution table with adjacent bytes, first forwards
  # and then backwards over the same buffer. No key or payload name is fixed.
  - id: x86-table-byte-feedback-decoder
    desc: Forward/reverse table byte feedback decoding
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F B6 14 30 0F B6 5C 30 01 81 C2 00 01 00 00 C1 E2 08 03 D7 8A 14 13 88 14 30 40 3B C1 7C ?? [30-100] 0F B6 14 30 0F B6 4C 30 FF 81 C2 00 01 00 00 C1 E2 08 03 CF 8A 0C 0A 88 0C 30 48 83 F8 01 7D ??'
