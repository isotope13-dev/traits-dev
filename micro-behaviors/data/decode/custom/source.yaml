# Repeated byte substitutions used as a custom decoder.
#
# This is a capability atom: the malicious intent is supplied by objective
# composites that also require XOR transformation, remote staging, or process
# execution.  The matcher is based on call structure and byte arguments, not
# comments describing a decoder.
defaults:
  platforms: [windows, unix]
  for: [python, c, cpp, go, rust, javascript]
  attack: T1140

traits:
  - id: byte-substitution-replace-all
    desc: replace_all byte substitution call
    crit: component
    if:
      type: symbol
      kind: call
      exact: replace_all
  - id: byte-substitution-replace-byte
    desc: replace_byte byte substitution call
    crit: component
    if:
      type: symbol
      kind: call
      exact: replace_byte
  - id: byte-substitution-substitute-byte
    desc: substitute_byte substitution call
    crit: component
    if:
      type: symbol
      kind: call
      exact: substitute_byte
  - id: byte-substitution-map-byte
    desc: map_byte substitution call
    crit: component
    if:
      type: symbol
      kind: call
      exact: map_byte

  - id: bytewise-xor-append-transform
    desc: Bytewise XOR append transform
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(append|push)\s*\([^;\n]{0,80}\b[A-Za-z_]\w*\s*\^\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    for: [python, c, cpp, go, rust, javascript, typescript]

  - id: bytewise-xor-generator-transform
    desc: Bytewise XOR generator transform
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(bytes|bytearray)\s*\([^)]{0,120}\b[A-Za-z_]\w*\s*\^\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    for: [python, c, cpp, go, rust, javascript, typescript]

  # Caesar-style byte shift inside a bytes()/bytearray() comprehension, e.g.
  # `bytes((b - 3) % 256 for b in data)`. Sibling to the XOR generator above
  # with `[-+]` for the operator; the two matchers are disjoint. The leading
  # guard keeps string-literal codecs (`bytes(name, "utf-8")`), subscript
  # offsets (`line[i+1]`), and slice bounds (`a[i+1:]`) out: the shifted name
  # must not start inside quotes, brackets, or a slice.
  - id: python-byte-shift-arithmetic
    desc: Bytewise add/subtract inside bytes construction
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bbyte(s|array)\s*\([^)]{0,120}[^"''`*:\[]\b[A-Za-z_]\w*\s*[-+]\s*(0x\w+|[0-9]+)'
    not:
      # Codec names in prose and docstrings (`latin-1`, `utf-8`, `utf-16`)
      # read as name-number arithmetic but name no operation.
      - regex: '(?i)\b(utf|latin|ascii|iso)[_-]?[0-9]'
    for: [python]

  # Character-level Caesar shift, e.g. `''.join(chr(ord(c) - 3) for c in s)`.
  - id: python-chr-ord-shift
    desc: chr(ord()) with add/subtract shift
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bchr\s*\(\s*ord\s*\([^)]{0,40}\)\s*[-+]\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    for: [python]

  - id: python-four-byte-prefix-slice
    desc: Four-byte prefix slice on decoded data
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(decoded|unxored)\s*\[\s*4\s*:\s*\]'
    for: [python, c, cpp, go, rust, javascript, typescript]

  # Keep the decoded-buffer receiver in the pattern, as the Python sibling does.
  # A bare `slice(4)` is any four-byte skip — image parsers drop a 4-byte file
  # signature that way (`buffer = buffer.slice(4)`), which is not decoding.
  - id: native-four-byte-prefix-slice
    desc: Four-byte subspan on decoded data
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(decoded|unxored)\w*\.(subspan|slice|advance)\s*\(\s*4\s*\)'
    for: [python, c, cpp, go, rust, javascript, typescript]

  # Unary whitespace decoding represents each output character as the length
  # of a whitespace-only line.  Keep the line-length conversion and the line
  # selection separate so ordinary blank-line filtering does not become a
  # decoder finding on its own.
  - id: python-line-length-character-rebuild
    desc: Python converts line length to character
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '\bchr\s*\(\s*len\s*\(\s*[A-Za-z_]\w*\s*\)\s*(//\s*2\s*)?\)'

  - id: python-whitespace-only-line-selection
    desc: Python selects lines containing only whitespace
    crit: component
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '\bnot\s+[A-Za-z_]\w*\.strip\s*\(\s*\)'

  - id: python-splitlines-iteration
    desc: Python iterates over split text lines
    crit: baseline
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bfor\s+[A-Za-z_]\w*\s+in\s+[A-Za-z_]\w*\.splitlines\s*\(\s*\)'

  - id: javascript-line-length-character-rebuild
    desc: JavaScript converts line length to character
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'String\.fromCharCode\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.length\s*\)'

  - id: javascript-whitespace-only-line-filter
    desc: JavaScript filters whitespace-only lines
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.filter\s*\([\s\S]{0,160}(/\^\s+\+\$/|\.trim\s*\(\s*\)\s*===?\s*["'']["''])'

  - id: javascript-crlf-line-split
    desc: JavaScript splits text at CRLF line boundaries
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.split\s*\(\s*/\\r\?\\n/\s*\)'

composite_rules:
  - id: python-whitespace-run-length-decoder
    desc: Python rebuilds characters from whitespace-only line lengths
    crit: suspicious
    conf: 0.98
    for: [python]
    near_bytes: 768
    all:
      - id: python-line-length-character-rebuild
      - id: python-whitespace-only-line-selection
      - id: python-splitlines-iteration

  - id: javascript-whitespace-run-length-decoder
    desc: JavaScript rebuilds characters from whitespace-only line lengths
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 768
    all:
      - id: javascript-line-length-character-rebuild
      - id: javascript-whitespace-only-line-filter
      - id: javascript-crlf-line-split

  - id: whitespace-run-length-decoder
    desc: Rebuilds characters from whitespace-only line lengths
    crit: suspicious
    conf: 0.98
    any:
      - id: python-whitespace-run-length-decoder
      - id: javascript-whitespace-run-length-decoder

  - id: repeated-byte-substitution-calls
    desc: Repeated byte substitutions over a buffer
    crit: notable
    conf: 0.94
    any:
      - id: byte-substitution-replace-all
      - id: byte-substitution-replace-byte
      - id: byte-substitution-substitute-byte
      - id: byte-substitution-map-byte
  - id: bytewise-xor-buffer-transform
    desc: Bytewise XOR buffer transform
    crit: notable
    conf: 0.92
    any:
      - id: bytewise-xor-append-transform
      - id: bytewise-xor-generator-transform

  - id: four-byte-decoded-prefix-removal
    desc: Removes four-byte decoded prefix
    crit: notable
    conf: 0.9
    any:
      - id: python-four-byte-prefix-slice
      - id: native-four-byte-prefix-slice

  - id: chained-byte-substitution-xor-decoder
    desc: Chained byte substitution followed by XOR decoding
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    all:
      - id: repeated-byte-substitution-calls
      - id: bytewise-xor-buffer-transform
