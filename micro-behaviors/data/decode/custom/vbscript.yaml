# VBScript custom decoding primitives
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1140

traits:
  - id: vbs-replace-digit-filler-strip
    desc: VBScript strips long digit filler with Replace
    crit: notable
    conf: 0.92
    if:
      type: text
      # Digit-filler droppers bury the payload characters inside a giant
      # numeric string, then strip a long repeated filler key with
      # Replace(blob, "<100+ digit key>", "") to reveal the command.
      regex: 'Replace\(\s*\w+\s*,\s*"[0-9.]{100,}"\s*,\s*""\s*\)'

  - id: vbs-oversized-digit-blob
    desc: VBScript long digit filler string
    crit: notable
    conf: 0.9
    if:
      type: text
      # A 400-plus digit run inside a string literal is not a constant: it
      # is the filler key (or a payload block) of filler-strip decoding,
      # where the key repeats in hundred-char blocks around payload chars.
      regex: '"[0-9.]{400,}"'
