# VBScript custom decoding primitives
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1140

traits:
  - id: mid-single-character-extraction
    desc: VBScript extracts one character with Mid
    crit: notable
    conf: 0.9
    if:
      type: text
      # Mid(s, 1, 1) takes a constant first character, not a walking index.
      regex: '(?i)\bMid\(\w+,\s*[A-Za-z_]\w*,\s*1\)'

  - id: fixed-stride-index-increment
    desc: VBScript advances index by fixed stride
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)^\s*\w+\s*=\s*\w+\s*\+\s*[2-9]\s*$'

  - id: vbs-replace-digit-filler-strip
    desc: VBScript strips long digit filler with Replace
    crit: notable
    conf: 0.92
    if:
      type: text
      # Digit-filler droppers bury the payload characters inside a giant
      # numeric string, then strip a long repeated filler key with
      # Replace(blob, "<100+ digit key>", "") to reveal the command.
      regex: 'Replace\(\s*\w+\s*,\s*"[0-9.]{100,}"\s*,\s*""\s*\)'

  - id: vbs-oversized-digit-blob
    desc: VBScript long digit filler string
    crit: notable
    conf: 0.9
    if:
      type: text
      # A 400-plus digit run inside a string literal is not a constant: it
      # is the filler key (or a payload block) of filler-strip decoding,
      # where the key repeats in hundred-char blocks around payload chars.
      regex: '"[0-9.]{400,}"'

composite_rules:
  - id: fixed-stride-character-decoder
    desc: VBScript samples characters at a fixed stride
    crit: notable
    conf: 0.96
    all:
      - id: mid-single-character-extraction
      - id: fixed-stride-index-increment
    # The Mid call and the index step belong to the same loop.
    near_lines: 15
