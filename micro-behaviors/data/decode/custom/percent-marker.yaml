defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: character-test-percent-replacement
    desc: Character test selects a percent replacement
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: 'charAt\(\w+\)==["''][A-Z]["'']\)\{\w+=["'']%["'']'
