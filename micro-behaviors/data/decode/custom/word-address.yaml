defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  crit: notable
traits:
  - id: python-dictionary-dot-join
    desc: Dot-joins dictionary lookup results
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '["'']\.["'']\.join\s*\(\s*str\s*\(\s*\w+\s*\[\s*\w+\s*\]\s*\)\s+for\s+\w+\s+in\s+\w+'
  - id: javascript-dictionary-dot-join
    desc: Dot-joins mapped dictionary values
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.map\s*\(\s*[\w$]+\s*=>\s*[\w$]+\s*\[\s*[\w$]+\s*\]\s*\)\s*\.join\s*\(\s*["'']\.["'']\s*\)'
  - id: ruby-dictionary-dot-join
    desc: Dot-joins Ruby mapped dictionary values
    conf: 0.95
    for: [ruby]
    if:
      type: text
      regex: '\.map\s*\{\s*\|([A-Za-z_]\w*)\|\s*\w+\.fetch\(\s*\w+\s*\)\s*\}\.join\(\s*["'']\.["'']\s*\)'
composite_rules:
  - id: dictionary-dot-join
    desc: Builds dotted text from token dictionary lookups
    crit: notable
    conf: 0.95
    any:
      - id: python-dictionary-dot-join
      - id: javascript-dictionary-dot-join
      - id: ruby-dictionary-dot-join
