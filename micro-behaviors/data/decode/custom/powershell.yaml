defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  attack: T1140
traits:
  - id: powershell-offset-array-character-decode
    desc: PowerShell casts shifted array elements to chars
    conf: 0.96
    if:
      type: text
      # Offset sign, integer width, and formatting are generator choices.
      # Keep the indexed element, arithmetic, and character cast together;
      # an array or a plain numeric cast alone is not a decoder.
      regex: '\[char\]\s*\(\s*(\[(u?int\d*|long)\])?\s*\$\w+\[\s*\$\w+\s*\]\s*[+-]\s*[$\d-]'
      case_insensitive: true

  - id: powershell-keyed-byte-loop-decrypt
    desc: PowerShell loop transforms indexed array bytes
    for: [powershell, batch, lnk]
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?is)for\w* ?\( ?\$[^{()]{1,58}\)\s*\{[^{}]{1,90}\[\$[^\]]{1,18}\] ?([+-]|-bxor) ?[$\d]'

  - id: lnk-arg-keyed-byte-loop-decrypt
    desc: Shortcut loop transforms indexed array bytes
    platforms: [windows]
    for: [lnk]
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?is)for\w* ?\( ?\$[^{()]{1,58}\)\s*\{[^{}]{1,90}\[\$[^\]]{1,18}\] ?([+-]|-bxor) ?[$\d]'

composite_rules:
  - id: powershell-negative-offset-character-decoder
    desc: Negative integer array near character decoding
    crit: notable
    conf: 0.98
    near_lines: 8
    all:
      - id: micro-behaviors/data/collection/array::powershell-negative-integer-array
      - id: micro-behaviors/data/decode/custom::powershell-offset-array-character-decode

  - id: keyed-byte-loop-decoder
    desc: Loop transforms indexed bytes with key math
    for: [powershell, batch, lnk]
    crit: notable
    conf: 0.94
    any:
      - id: powershell-keyed-byte-loop-decrypt
      - id: lnk-arg-keyed-byte-loop-decrypt
