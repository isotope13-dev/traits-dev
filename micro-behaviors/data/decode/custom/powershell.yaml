defaults:
  platforms: [windows, unix]
  for: [powershell, batch]
  crit: notable
  attack: T1140
traits:
  - id: powershell-offset-array-character-decode
    desc: PowerShell offset-array character decoding
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[char\]\s*\(\s*(\[int64\])?\$\w+\[\$\w+\]\s*\+\s*(\$\w+|\d+)\s*\)'

composite_rules:
  - id: powershell-negative-offset-character-decoder
    desc: Negative integer array character reconstruction
    crit: notable
    conf: 0.98
    near_lines: 8
    all:
      - id: micro-behaviors/data/embedded/payload/array::large-negative-integer-array
      - id: micro-behaviors/data/decode/custom::powershell-offset-array-character-decode
