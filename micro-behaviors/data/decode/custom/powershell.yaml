defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  attack: T1140
traits:
  # These key-1000 substrings identify output hidden in the PowerShell
  # negative-offset integer-array format. The installer objective combines
  # them with the decoder and dynamic invocation evidence before making an
  # attack claim.
  - id: offset-array-downloadfile-token
    desc: Encoded DownloadFile call
    crit: notable
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: '-932,-889,-881,-890,-892,-889,-903,-900,-930,-895,-892,-899'
  - id: offset-array-msiexec-token
    desc: Encoded msiexec executable
    crit: notable
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: '-891,-885,-895,-899,-880,-899,-901,-954,-899,-880,-899'
  - id: offset-array-msi-quiet-no-restart-token
    desc: Encoded MSI quiet and no-restart switches
    crit: notable
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: '-953,-887,-890,-968,-953,-890,-889,-886,-899,-885,-884,-903,-886,-884'
  - id: powershell-offset-array-character-decode
    desc: PowerShell casts shifted array elements to chars
    conf: 0.96
    if:
      type: text
      # Offset sign, integer width, and formatting are generator choices.
      # Keep the indexed element, arithmetic, and character cast together;
      # an array or a plain numeric cast alone is not a decoder.
      regex: '\[char\]\s*\(\s*(\[(u?int\d*|long)\])?\s*\$\w+\[\s*\$\w+\s*\]\s*[+-]\s*[$\d-]'
      case_insensitive: true

composite_rules:
  - id: powershell-negative-offset-character-decoder
    desc: Negative integer array near character decoding
    crit: notable
    conf: 0.98
    near_lines: 8
    all:
      - id: micro-behaviors/data/collection/array::powershell-negative-integer-array
      - id: micro-behaviors/data/decode/custom::powershell-offset-array-character-decode
