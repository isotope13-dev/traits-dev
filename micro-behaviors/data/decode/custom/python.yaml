# Home-made character-shift decoders in Python.
#
# A Caesar shift is not encryption and nobody uses one to protect anything; it
# exists to keep a string out of `grep` and out of a reviewer's eye. The
# encoded form still sits in the source as a bytes literal, so the only thing
# the shift buys is that the URL, path or command inside it does not read as
# one.
#
# Neutral here by design: the decoder says a string is being hidden, not what
# the string is. Objectives pair it with what the decoded value is used for.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.93
  attack: T1027
  mbc: E1027

traits:
  # `bytes([b - 3 for b in data])` -- the comprehension form, which is how this
  # is written when the author wants one short helper.
  - id: python-byte-shift-comprehension
    desc: Byte-shift decoder comprehension
    if:
      type: text
      regex: 'bytes\s*\(\s*\[\s*\w+\s*[-+]\s*\d{1,3}\s+for\s+\w+\s+in'

  # The arithmetic must produce one character per iterable input; bare
  # chr(ord(c) - 1) expressions also occur in Unicode range algorithms.
  - id: python-char-shift-decoder
    desc: Character-shift decoder expression
    if:
      type: text
      regex: 'chr\s*\(\s*ord\s*\(\s*\w+\s*\)\s*[-+]\s*\d{1,3}\s*\)\s+for\s+\w+\s+in\b'

  # A function named *decrypt* whose body base64-, hex- or XOR-decodes its
  # input. Says only that the program has its own decrypt routine; whether
  # that hides anything comes from the composites that use it.
  - id: python-decrypt-function-decodes-input
    desc: Decrypt-named function decodes its input
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?i)def\s+\w*decrypt\w*\s*\([^)]{0,80}\):(?s:.{0,300})(\^|b64decode|fromhex)'
