defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: js-character-substitution-ternary
    desc: Substitutes characters with source fallback
    if:
      type: text
      regex: '\(\w+==-1\?\w+\.charAt\(\w+\):\w+\.charAt\(\w+\)\)'
  - id: js-rotating-alphabet
    desc: Concatenates string tail and first character
    if:
      type: text
      regex: '([A-Za-z_$][\w$]*)\.substring\(1\)\s*\+\s*[A-Za-z_$][\w$]*\.charAt\(0\)'
  - id: js-charcode-minus-one
    for: [html, javascript, scala, elixir]
    desc: Subtracts one when rebuilding characters
    if:
      type: text
      regex: 'String\.fromCharCode\s*\(\s*[A-Za-z_$][\w$]*(\.charCodeAt\s*\([^)]{1,40}\))?\s*-\s*1\s*\)'
  - id: substitution-document-write-call
    desc: Character substitution near document writing
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'charAt\([^)]{1,40}\)\)\+\w+;[\s\S]{0,160}document\.write\(\w+\)'
