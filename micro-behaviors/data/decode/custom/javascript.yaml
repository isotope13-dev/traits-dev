defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1140
traits:
  - id: javascript-decode-function
    desc: Defines a JavaScript decode function
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: decode

  - id: decrypt-payload-function-name
    desc: JavaScript function named decryptPayload
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: decryptPayload

  - id: fromcharcode-map-array
    desc: Converts character-code arrays to strings
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'map\(function\([^)]{1,20}\)\s*\{\s*return String\.fromCharCode'

  - id: fromcharcode-arrow-map
    desc: Arrow-maps character codes to a string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.map\s*\(\s*\(?\s*[A-Za-z_$][\w$]*\s*\)?\s*=>\s*String\.fromCharCode\s*\('

  - id: fromcharcode-indexed-array
    desc: Converts indexed character codes to strings
    crit: notable
    conf: 0.9
    # Large minified vendor bundles (DataTables, chart libs, …) routinely
    # rebuild Unicode via fromCharCode(arr[i]); keep this for small custom
    # decoders in droppers and staged payloads.
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
    if:
      type: text
      regex: 'String\.fromCharCode\(\w+\[\w+\]\)'

  - id: fromcharcode-apply-array
    desc: Converts character-code array to string
    crit: notable
    conf: 0.92
    if:
      type: text
      # Custom alphabet decoders commonly pass String (or null) as the apply
      # receiver before rebuilding the decoded bytes into a string.
      regex: 'String\.fromCharCode\s*\.\s*apply\s*\(\s*(null|String)\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'

  - id: fromcharcode-large-offset-expression
    desc: Rebuilds characters with large-offset arithmetic
    crit: notable
    conf: 0.96
    # A large decimal literal subtracted by a variable is outside the normal
    # String.fromCharCode range and is a compact runtime string decoder. Keep
    # the atom capability-focused; execution of its result is objective
    # evidence supplied by composites.
    if:
      type: text
      regex: 'String\.fromCharCode\s*\(\s*\d{6,}\s*-\s*[A-Za-z_$][A-Za-z0-9_$]*'

  - id: js-charat-charcodeat-alphabet-offset
    desc: Alphabet lookup via charAt(charCodeAt()-N)
    crit: notable
    conf: 0.95
    # Cryxos-family WSH droppers map high Unicode codepoints into a printable
    # alphabet with alphabet.charAt(s.charCodeAt(i)-N) (N typically 1280).
    if:
      type: text
      regex: '\.charAt\s*\(\s*[\w$]+\.charCodeAt\s*\([^)]{0,24}\)\s*-\s*\d{3,5}\s*\)'

  - id: js-indexof-charat-lookup
    desc: Indexes characters in a custom alphabet
    crit: notable
    conf: 0.9
    # Keep this atom focused on the lookup itself; the stepping-loop companion
    # is composed with it where decoder intent is required.
    # Exclude trim helpers: whitespace tables use charAt(0), and argparse-style
    # strip loops use while (chars.indexOf(str.charAt(i))).
    if:
      type: text
      regex: '[\w$]+\.indexOf\s*\(\s*[\w$]+\.charAt\s*\(\s*[\w$]+\s*\)\)'
    not:
      - regex: '\.charAt\s*\(\s*0\s*\)'
    unless:
      - type: text
        regex: 'while\s*\([^)]{0,100}\.indexOf\s*\(\s*[\w$]+\.charAt'

  - id: js-indexof-source-token
    desc: JavaScript indexOf lookup uses character input
    crit: notable
    conf: 0.75
    # Oversized source is tokenized rather than retained as one searchable
    # line. This neutral atom preserves the operation for proximity-based
    # decoder composites; intent comes from the other atoms.
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\.indexOf\s*\([^)]{0,120}\.charAt\s*\('

  - id: js-step-two-source-token
    desc: JavaScript source advances a loop by two
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\+=\s*2'

  - id: js-charcode-shift-operation
    desc: Character code shift operation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.charCodeAt\s*\([^)]{1,80}\)\s*%'

  - id: js-fixed-step-three-loop
    desc: JavaScript loop increments by three
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'for\s*\([^)]{1,240}\+=\s*3\s*\)\s*\{'

  - id: js-octal-parseint
    desc: parseInt parses an octal string
    crit: notable
    conf: 0.96
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
    if:
      type: text
      regex: 'parseInt\s*\(.{0,180},\s*8\s*\)'

  - id: js-charcode-byte-mask
    desc: Masks character code to one byte
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(String\.fromCharCode|charCodeAt)[\s\S]{0,400}&\s*255'

  - id: js-multi-charcode-decoder
    desc: Decodes strings with multi-argument fromCharCode
    crit: notable
    conf: 0.9
    count_min: 5
    if:
      type: text
      # Keep both arguments inside the same call. The former dot wildcard
      # crossed a closing parenthesis and counted commas in following code.
      regex: 'String\.fromCharCode\([^)]{0,80},[^)]{0,80}\)'
    not:
      - substr: "String.fromCharCode(Number.parseInt(v.slice(1)"
      - substr: "bytesToString:function(n){for(var x=[],e=0;e<n.length;e++)x.push("
      - substr: "/*! markdown-it 14.1.0 https://github.com/markdown-it/markdown-it"
      - substr: 'String.fromCharCode(55349,56320+'
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/ui/redoc::library

  # js-unescape-call moved to micro-behaviors/data/decode/url/: unescape() is the
  # legacy percent-decoder, a standard URL decoding routine rather than a custom
  # scheme, and it shows up in ordinary code (axios builds its Basic-auth header
  # with unescape(encodeURIComponent(pw))). The composite below still references
  # it, which is where pairing it with a char-code mask makes it custom decoding.
  - id: js-hex-xor-character-decode
    desc: Decodes JavaScript hex pairs with XOR
    crit: notable
    conf: 0.95
    # This is a decoding operation only.  Execution, persistence, and the
    # HTA container are separate signals supplied by objective composites.
    if:
      type: text
      regex: 'parseInt\s*\([^;]{0,100},\s*16\s*\)\s*\^'

  - id: js-offset-array-fromcharcode-decode
    desc: Rebuilds characters from offset array values
    crit: notable
    conf: 0.95
    # Indexed character-code helpers occur in both benign bundles and
    # script decoders; keep the operation neutral and let surrounding
    # execution context determine intent.
    if:
      type: text
      regex: 'String\.fromCharCode\([^)]{0,50}\[[A-Za-z_$][\w$]*\]\s*[+-]\s*\d{1,3}\s*[),]'

composite_rules:
  - id: js-indexof-charcode-shift-decoder
    desc: Alphabet index decoder with char shifts
    crit: notable
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/string/search::js-alphabet-indexof-lookup
      - id: js-charcode-shift-operation
      - id: micro-behaviors/data/string/access::js-charat-lookup

  - id: js-octal-charcode-loop
    desc: Octal loop rebuilds chars with fromCharCode
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: js-fixed-step-three-loop
      - id: js-octal-parseint
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call-text

  - id: js-alphabet-coded-decoder
    desc: JavaScript alphabet-index character decoder
    crit: notable
    conf: 0.9
    # The three operations must belong to one decoder, rather than merely
    # appearing somewhere in a large third-party bundle.
    near_bytes: 2048
    all:
      - id: js-indexof-charat-lookup
      - id: micro-behaviors/data/control-flow/loop::js-two-step-loop
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
  - id: js-alphabet-coded-decoder-source
    desc: JavaScript source contains an alphabet lookup decoder
    crit: notable
    conf: 0.95
    near_bytes: 2048
    # Text fallbacks keep the decoder identity available when a large source
    # file exceeds the JavaScript AST guard.
    all:
      - id: js-indexof-charat-lookup
      - id: micro-behaviors/data/control-flow/loop::js-fixed-step-two-source
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call-text
  - id: js-charcode-mask-unescape-decoder
    desc: CharCode mask near JavaScript unescape
    crit: notable
    conf: 0.96
    # A line-based window turns a large one-line vendor routine (for example
    # MD5's UTF-8 helper) into a decoder match. Byte proximity keeps the
    # observation tied to a compact decode expression instead.
    near_bytes: 256
    all:
      - id: js-charcode-byte-mask
      - id: micro-behaviors/data/decode/url::js-unescape-call
