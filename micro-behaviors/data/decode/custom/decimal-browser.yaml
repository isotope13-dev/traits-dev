defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: charcode-decimal67-subtraction
    desc: Char-code list encodes subtraction of 67
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'String\.fromCharCode\(([0-9]{1,3},){1,400}45,(32,){0,8}54,55,59'
  - id: bang-decimal-iframe-tag
    desc: Bang-decimal encoding of an iframe tag
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [html, javascript, text]
    if:
      type: text
      substr: '60!105!102!114!97!109!101!'
  - id: bang-decimal-display-none
    desc: Bang-decimal encoding of display none
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    for: [html, javascript, text]
    if:
      type: text
      substr: '100!105!115!112!108!97!121!58!110!111!110!101'
