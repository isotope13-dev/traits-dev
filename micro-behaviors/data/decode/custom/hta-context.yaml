defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-hex-xor-string-decoder
    desc: HTA context with hex-XOR string decoder
    crit: suspicious
    conf: 0.95
    # hta-application-element is an HTML-only marker, so this can only ever
    # fire on html regardless of js-hex-xor-character-decode's own reach.
    for: [html]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/data/decode/custom::js-hex-xor-character-decode
