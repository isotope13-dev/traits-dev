# Managed integer-offset byte reconstruction. This is a decoding mechanic, not
# a verdict: serialized integer formats and compact application protocols may
# legitimately use the same conversion.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vb-tointeger-token
    desc: Visual Basic converts text to an integer
    crit: component
    conf: 0.72
    if:
      type: text
      exact: ToInteger

  - id: il-subtract-to-byte
    desc: .NET IL offset-subtracts into a byte
    crit: component
    conf: 0.9
    if:
      # call <converter>; ldc.i4 <offset>; sub.ovf; conv.ovf.u1
      type: hex
      pattern: 28 ?? ?? ?? ?? 20 ?? ?? ?? ?? DA B4
      section: .text

composite_rules:
  - id: vb-integer-offset-byte-decoder
    desc: Visual Basic reconstructs bytes by subtracting an integer offset
    crit: notable
    conf: 0.94
    attack: T1140
    mbc: B0032
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: vb-tointeger-token
      - id: il-subtract-to-byte
