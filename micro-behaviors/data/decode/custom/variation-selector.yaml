defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-variation-selector-byte-decoder
    desc: Decodes selector code points to byte values
    crit: notable
    conf: 0.97
    # The +16 reserves byte values 0..15 for U+FE00..FE0F. Range
    # comparisons alone are ordinary Unicode rendering, not this transform.
    if:
      type: tree-sitter
      kind: binary_op
      regex: 'ord\([^)]{1,32}\)\s*-\s*(0[xX][Ee]0100|917760)\s*\+\s*16\b'
