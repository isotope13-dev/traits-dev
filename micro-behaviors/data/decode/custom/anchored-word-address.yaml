defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
traits:
  - id: four-word-numeric-table
    desc: Four word keys mapped to short integers
    conf: 0.95
    if:
      type: text
      regex: '(["''][A-Za-z]{2,32}["'']\s*:\s*[0-9]{1,3}\s*,?\s*){4}'
  - id: anchor-following-first-token
    desc: Selects first token after a text anchor
    conf: 0.95
    if:
      type: text
      regex: '\.split\s*\(\s*[\w$]+\s*\)\s*\[\s*1\s*\]\s*\.split\s*\([^\r\n)]{0,32}\)\s*\[\s*0\s*\]'
composite_rules:
  - id: anchored-word-address-decoder
    desc: Anchor-selected words map to dotted numeric text
    crit: suspicious
    conf: 0.95
    near_lines: 30
    all:
      - id: four-word-numeric-table
      - id: anchor-following-first-token
      - id: micro-behaviors/data/decode/custom::dictionary-dot-join
