defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  crit: notable
traits:
  - id: anchor-following-delimited-field
    desc: Selects delimited field after text anchor
    conf: 0.95
    if:
      type: text
      regex: '\.split\s*\(\s*[\w$]+\s*\)\s*\[\s*1\s*\]\s*\.split\s*\([^\r\n)]{0,32}\)\s*\[\s*0\s*\]'
composite_rules:
  - id: anchored-word-address-decoder
    desc: Anchor-selected words map to dotted numeric text
    crit: suspicious
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/data/collection/map::four-word-numeric-table
      - id: anchor-following-delimited-field
      - id: micro-behaviors/data/decode/custom::dictionary-dot-join
