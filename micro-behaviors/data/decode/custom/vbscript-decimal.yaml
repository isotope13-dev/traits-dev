defaults:
  for: [html, vbs, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: vbscript-chr-eval-index
    desc: VBScript Chr converts evaluated array items
    if:
      type: text
      regex: '(?i)Chr\s*\(eval\s*\(\w+\(\w+\)\)\)'
  - id: vbscript-dollar-split
    desc: VBScript splits dollar-delimited characters
    if:
      type: text
      regex: '(?i)Split\s*\(\w+,\s*"\$"\)'
