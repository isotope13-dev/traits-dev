defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.96
traits:
  - id: html-angle-entity-substitution
    desc: Unescapes HTML angle bracket entities
    if:
      type: text
      exclude_html_comments: true
      regex: 'replaceAll\(["'']&(amp;)?(lt|gt);["''],\s*["''][<>]["'']'
