defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: js-fromcharcode-hex-offset-rebuild
    desc: Rebuilds characters from offset hex tokens
    crit: notable
    conf: 0.96
    if:
      type: text
      # A string method alias, hex-prefixed indexed tokens, parseInt and an
      # arithmetic offset together describe a character reconstruction loop.
      regex: 'String\[\w+\]\(\w+\(\w+\+\(\w+\[\w+\]\)\)-\(\d+\)\)'
  - id: js-hex-parseint-offset-subtraction
    desc: Hex parseInt subtracts character offset
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'parseInt\([^,]{1,40},\s*16\)\s*-\s*33'
