defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: js-fromcharcode-hex-offset-rebuild
    desc: Rebuilds characters from offset hex tokens
    crit: notable
    conf: 0.96
    if:
      type: text
      # A string method alias, hex-prefixed indexed tokens, parseInt and an
      # arithmetic offset together describe a character reconstruction loop.
      regex: 'String\[\w+\]\(\w+\(\w+\+\(\w+\[\w+\]\)\)-\(\d+\)\)'
  - id: js-hex-parseint-offset-subtraction
    desc: Hex parseInt subtracts character offset
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'parseInt\([^,]{1,40},\s*16\)\s*-\s*33'
  - id: js-fromcharcode-eval-offset-rebuild
    desc: fromCharCode rebuilds chars from eval offset
    crit: notable
    conf: 0.94
    if:
      type: text
      # Dot-notation fromCharCode over eval(identifier + table[index]) with an
      # added hex-or-decimal literal and a subtracted identifier offset: the
      # colon-hex drive-by loader spells its reconstruction loop this way.
      regex: 'fromCharCode\s*\(eval\(\w+\+\w+\[[^\]]{1,40}\]\)\s*\+\s*(0x[\da-fA-F]+|\d+)-\w+\)'
