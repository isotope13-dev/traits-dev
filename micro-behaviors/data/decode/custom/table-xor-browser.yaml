defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: js-offset-character-table-lookup
    desc: Character code indexes an offset decoding table
    if:
      type: text
      regex: '\w+\[\w+\.charCodeAt\(\w+\+\+\)\s*-\s*\d{1,3}\]'
  - id: js-numeric-xor-byte-unpack
    desc: XORs numeric key into unpacked bytes
    if:
      type: text
      regex: '\w+\s*=\s*\d{1,3}\s*\^\s*\w+;\w+\s*=\s*\w+\s*&\s*255;'
  - id: js-fromcharcode-xor-masked-byte
    desc: Rebuilds characters from XOR-masked bytes
    if:
      type: text
      regex: 'String\.fromCharCode\(\d{1,3}\s*\^\s*\w+\s*&\s*255\)'
