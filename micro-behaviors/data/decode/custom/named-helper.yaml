defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: named-codec-decoder-helper-reference
    desc: References a codec or custom decoder helper
    crit: notable
    conf: 0.6
    if:
      type: text
      # `decode[CcUu][a-z]{4,16}` also matched base-x's `decodeUnsafe(`.
      regex: '\bdecode(Codec|Custom)\w{0,8}\s*\('
  - id: named-position-decoder-helper-reference
    desc: References a position or unit decoder helper
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\bdecode(Position|Unit)\s*\('
