defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1140

traits:
  # Reads a word-sized fragment length and a source pointer from separate
  # tables, copies that fragment into a contiguous destination, then advances
  # to the next table entry. This reconstructs bytes that are deliberately
  # stored out of execution order in the image.
  - id: x86-fragment-table-byte-reassembly
    desc: Reassembles bytes selected by fragment table
    crit: notable
    conf: 0.98
    size_max: 1048576
    if:
      type: hex
      section: any
      pattern: '0F B7 0B 43 43 8B 32 [0-16] 42 42 [0-8] 42 42 8A 06 88 07 46 47 49 75 F7 [0-16] 0F B7 0B 81 F9 ?? ?? 00 00 72 ??'

  - id: x86-index-scaled-add-byte-decoder
    desc: Decodes bytes with index-scaled addition
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F BE 91 [4] 8B 45 ?? 83 C0 01 69 C0 [4] 03 D0 8B 4D ?? 88 91 [4] EB ??'

  # The buffer's first two bytes select the three residues: a+b, b, a.
  # This signature covers the modulo-three dispatch and all three byte writes.
  # Accept both compiler forms: EDI/ESI in UPX0 and ECX/EBP in merged .text.
  - id: x86-three-phase-subtract-byte-decoder
    desc: Three-phase byte subtraction decoder
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '( 8B C7 6A 03 99 59 F7 F9 83 FA 02 75 ?? 8A 45 ?? 28 04 37 83 FA 01 75 ?? 8A 45 ?? 28 04 37 3B D3 75 ?? 8A 45 ?? 02 45 ?? 28 04 37 47 3B 7D ?? 7C ?? | 8B C1 BF 03 00 00 00 99 F7 FF 8B FA 83 FF 02 75 ?? 28 1C 29 83 FF 01 75 ?? 8A 54 24 ?? 8A 04 29 2A C2 88 04 29 85 FF 75 ?? 8A 44 24 ?? 8A 14 29 02 C3 2A D0 88 14 29 41 3B CE 7C ?? )'
