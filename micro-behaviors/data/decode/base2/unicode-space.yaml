defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  crit: notable
  conf: 0.95

traits:
  - id: unicode-space-to-bit-substitution
    desc: Replaces Unicode spaces with binary digits
    # Match literal and escaped Unicode in regex alphabets. The text view can
    # already have expanded source Unicode escapes. No particular space pair,
    # variable name, bit width, merchant or loader endpoint is required.
    if:
      type: text
      encoding: none
      regex: '\.replace\(\s*/(\\u200[\daA]|[\u2000-\u200A])/[gimu]*\s*,\s*["''][01]["'']\s*\)'
      exclude_html_comments: true
