defaults:
  crit: notable
  conf: 0.8
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  attack: T1140
  mbc: C0053
traits:
  # Binary string literals decoded into character codes
  # (`parseInt('01100101', 2)`). Octal and hex radices appear in ordinary
  # parsers; base-2 almost exclusively spells hidden API and builtin names
  # one bit at a time, so this lives beside the base-N decoders rather than
  # with the generic parseInt atoms.
  - id: js-binary-parseint
    desc: parseInt parses a binary string
    conf: 0.95
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
    if:
      type: text
      regex: '\bparseInt\s*\(([^,()]{1,80}|[^()]{1,60}\([^()]{0,60}\)),\s*2\s*\)'
