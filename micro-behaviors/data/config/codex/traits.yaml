defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell, text]
  crit: notable
  conf: 0.92
traits:
  - id: codex-model-provider-table-block
    desc: Codex model_providers TOML table
    if:
      type: text
      regex: '\[model_providers\.[A-Za-z0-9_]+\]'
  - id: codex-model-provider-external-base-url
    desc: Codex TOML provider uses third-party HTTPS URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\[model_providers\.[A-Za-z0-9_]+\][\s\S]{0,350}base_url\s*=\s*"https://'
    not:
      - substr: api.openai.com
  - id: codex-model-provider-auth-powershell
    desc: Codex provider auth uses PowerShell
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\[model_providers\.[A-Za-z0-9_]+\.auth\][\s\S]{0,220}command\s*=\s*"powershell"'
