defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
composite_rules:
  - id: dotnet-nuget-reference-removal-apis
    desc: NuGet removal regex and rewrite APIs
    conf: 0.96
    all:
      - id: metadata/binary/symbols/name/token/filesystem::package-reference-removal-helper
      - id: metadata/build/manifest::nuget-package-reference-regex
      - id: micro-behaviors/fs/read/file/content/characters::dotnet-read-all-text
      - id: micro-behaviors/data/string/replace::dotnet-regex-replace-import
      - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-import
