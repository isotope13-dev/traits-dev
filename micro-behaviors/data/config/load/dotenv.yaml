defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: dotenv-config-call
    desc: Calls dotenv.config helper
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/development/build/autorest::autorest-generated-header
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: well-known/app/ai/gateway/opencode-router
      - id: well-known/app/ai/assistant/nitin-ai
    if:
      type: text
      regex: "\\bdotenv\\s*\\.\\s*config\\s*\\(|require\\(\\s*[\"']dotenv[\"']\\s*\\)\\s*\\.\\s*config\\s*\\("
