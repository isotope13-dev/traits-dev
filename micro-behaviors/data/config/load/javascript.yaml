defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: load-config-helper-call
    desc: Calls a loadConfig helper method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)loadConfig$'
    unless:
      - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
