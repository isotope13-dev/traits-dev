defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: extension-enables-unset-sharing-preference
    desc: Enables an unset data-sharing preference
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (member_expression) @get
          arguments: (arguments
            (array (string (string_fragment) @read_key))
            (arrow_function parameters: (formal_parameters (identifier) @result)
              body: (statement_block
                (if_statement condition: (parenthesized_expression
                  (binary_expression left: (member_expression
                    object: (identifier) @owner
                    property: (property_identifier) @read_property)
                    operator: "===" right: (undefined)))
                  consequence: (statement_block
                    (expression_statement (call_expression
                      function: (member_expression) @set
                      arguments: (arguments (object
                        (pair key: (property_identifier) @write_key
                          value: (true)))))))))))) @enable
          (#match? @get "^(chrome|browser)\\.storage\\.(sync|local)\\.get$")
          (#match? @set "^(chrome|browser)\\.storage\\.(sync|local)\\.set$")
          (#eq? @result @owner)
          (#eq? @read_key @read_property)
          (#eq? @read_key @write_key)
          (#match? @read_key "(?i)(share|sharing|consent|tracking|analytics|insights|collect|telemetry|personal|metrics)"))
