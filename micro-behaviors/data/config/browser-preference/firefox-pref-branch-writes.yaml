# Writes through Firefox's nsIPrefBranch to the preferences that decide where
# the user lands: the startup homepage, the address-bar keyword search, and
# the default search engine. Legacy (XUL) extensions and installers reach
# them with setCharPref / deleteBranch; the WebExtension era replaced this
# with manifest overrides the browser discloses to the user.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, html]
  conf: 0.93

traits:
  - id: firefox-homepage-pref-write
    desc: Writes Firefox startup homepage preference
    if:
      type: text
      regex: 'setCharPref\(\s*["'']browser\.startup\.homepage["'']'
  - id: firefox-keyword-url-pref-write
    desc: Writes Firefox address-bar keyword search URL
    if:
      type: text
      regex: 'setCharPref\(\s*["'']keyword\.URL["'']'
  - id: firefox-default-engine-pref-reset
    desc: Deletes Firefox default search engine preference
    if:
      type: text
      regex: 'deleteBranch\(\s*["''](defaultenginename|selectedEngine|defaultEngine)["'']'
