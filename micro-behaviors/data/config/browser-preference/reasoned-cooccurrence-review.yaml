# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  - batch
  - python
  - javascript
  - csharp
  - powershell
  - vbs
  id: cross-browser-homepage-write-api-cooccurrence
  desc: Browser homepage and registry-write API references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/os/registry/keys/browser::ie-main-settings-registry-key
  - id: micro-behaviors/data/config/browser-preference::firefox-startup-homepage-pref
  any:
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/registry/access::registry-create-key-api
  - id: micro-behaviors/os/registry/write::registry-set-value-source
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
  - id: micro-behaviors/os/registry/write::powershell-registry-property-write
