# Browser preference stores and the integrity machinery around them:
# Chromium's Secure Preferences MAC fields and the helper functions that
# compute them, the tracked-prefs reset and sideload-exemption keys, and
# Firefox's startup/search preference names. These are preference KEYS and
# FIELD names, not filesystem paths -- which is why they never belonged
# under fs/path/. Neutral here; forging a preference MAC to sideload an
# extension is intent, and lives in the objectives composites that use them.

defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.9

traits:
  - id: firefox-startup-homepage-pref
    desc: Firefox startup homepage preference name
    crit: notable
    if:
      type: text
      substr: browser.startup.homepage
  - id: firefox-selected-engine-pref
    desc: Firefox selected search engine preference
    crit: notable
    if:
      type: text
      substr: browser.search.selectedEngine

  # The add-on manager's own database. Firefox reads it through the AddonManager
  # API; code that names the file is going around that API to the raw store.
